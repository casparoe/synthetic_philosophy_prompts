      *   **Conflict:** Gordon was a staunch utilitarian regarding the atomic bombings (Truman did the right thing, saved lives, including his father's). The speaker has recently been reading Elizabeth Anscombe ("Mr. Truman's Degree") and is now convinced by her deontological argument (deliberate killing of innocents is murder, regardless of consequences).
      *   **Audience:** Mixed. 1/3 are lab colleagues (know the argument, expect honesty), 2/3 are family (non-philosophers, need comfort/affirmation of Gordon's goodness).
      *   **Constraints:** 6-7 minutes spoken (approx. 900-1100 words), must not misrepresent Anscombe, must acknowledge the speaker's doubt/change of heart, must *not* turn into an indictment or a lecture, must be an act of love.
      *   **Goal:** Write the eulogy.

  2.  **Determine the Tone and Strategy:**
      *   **Tone:** Respectful, intimate, intellectually honest but emotionally grounded, reconciling friendship with disagreement.
      *   **Strategy:**
          *   Acknowledge the friendship and shared history first.
          *   Address Gordon's work and his conviction without endorsing the conviction as *truth*, but endorsing it as *his truth* and a source of his integrity.
          *   Introduce the philosophical tension gently. Don't name-drop Anscombe explicitly as a "lecture," but frame it as a shift in the speaker's own thinking.
          *   Bridge the gap: Focus on *character* rather than *conclusion*. Gordon acted according to his conscience for what he believed was the greater good. The speaker now sees it differently, but respects the seriousness with which Gordon held his view.
          *   Conclude with love and loss, prioritizing the human bond over the intellectual dispute.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the bond. 42 years of physics, decades of friendship. The shared language of science.
      *   **Gordon's Work:** Acknowledge the elephant in the room. He designed warheads. He was proud. He believed it saved lives (specifically his father's). This wasn't abstract to him; it was personal.
      *   **The Philosophical Shift (The Hard Part):** The speaker needs to admit they don't agree anymore. How to do this without insulting Gordon?
          *   *Idea:* Frame it as the speaker's own late-life journey. "I have come to see things differently."
          *   *Anscombe:* Mention the core idea (means vs. ends) without getting bogged down in jargon. "The arithmetic of lives."
          *   *Respect:* Gordon wasn't a monster; he was a man who bore a heavy weight believing it was necessary. His integrity is the key.
      *   **The Colleagues:** Acknowledge them. They know the debates. Don't hide the disagreement. "We argued."
      *   **The Family:** Reassure them. He was a good man, a loving father/husband. His work didn't define his capacity for love.
      *   **Closing:** The friendship transcends the disagreement. Grief is the price of love.

  4.  **Refining the Argument (Anscombe vs. Utilitarianism):**
      *   Anscombe's point: Certain acts are intrinsically wrong (killing innocents) regardless of the outcome.
      *   Gordon's point: Consequentialism. The outcome (saving more lives) justifies the act.
      *   *Crucial nuance:* The eulogy cannot say "Gordon was wrong." It must say "Gordon believed X with integrity. I now believe Y. But our friendship was built on Z."
      *   *Avoid:* Preaching. The speaker is unsure, not a crusader.
      *   *Key phrase:* "The arithmetic of conscience."

  5.  **Drafting - Iteration 1 (Mental Outline):**
