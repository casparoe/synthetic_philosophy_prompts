prompt: |-
  i was reading frederick douglass's 1860 speech in glasgow where he lays out why he thinks the constitution is actually an anti-slavery document (this is after he broke with garrison and the "covenant with death and an agreement with hell" crowd), and theres a chunk where he explains his method for reading the text that i can't quite untangle. here's the passage:

  "The speaker at the City Hall laid down some rules of legal interpretation. These rules send us to the history of the law for its meaning. I have no objection to such a course in ordinary cases of doubt. But where human liberty and justice are at stake, the case falls under an entirely different class of rules. There must be something more than history — something more than tradition. The Supreme Court of the United States lays down this rule, and it meets the case exactly — 'Where rights are infringed — where the fundamental principles of the law are overthrown — where the general system of the law is departed from, the legislative intention must be expressed with irresistible clearness.' The same court says that the language of the law must be construed strictly in favour of justice and liberty. Again, there is another rule of law. It is — Where a law is susceptible of two meanings, the one making it accomplish an innocent purpose, and the other making it accomplish a wicked purpose, we must in all cases adopt that which makes it accomplish an innocent purpose. Again, the details of a law are to be interpreted in the light of the declared objects sought by the law. I set these rules down against those employed at the City Hall. To me they seem just and rational. I only ask you to look at the American Constitution in the light of them, and you will see with me that no man is guaranteed a right of property in man, under the provisions of that instrument."

  can you help me pin down exactly what interpretive principle(s) he's stacking up here -- feels like there's three or four distinct "rules" bundled together. and more importantly, is this actually a sound/principled way to interpret an ambiguous legal document, or is "always favor the innocent-purpose reading" basically a blank check that lets you make any sufficiently vague text mean whatever you want? seems like a pro-slavery judge in 1860 could've run the exact same move in reverse on some other clause. genuinely can't tell if he's onto something real about how legal interpretation ought to work, or just doing really articulate motivated reasoning.
