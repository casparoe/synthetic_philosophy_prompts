answer: |-
  This is a fantastic argument, the kind that usually only happens after too much wedding champagne and not enough sleep. It cuts right to the tension between *functionalist* accounts of mind (like Clark & Chalmers) and *forensic* accounts of selfhood (like Locke).

  You and Dana are actually fighting on two different fronts: Dana is arguing from the **metaphysics of memory** (where is the data stored?), while you are arguing from the **metaphysics of agency** (who owns the action?).

  Here is the reconstruction of both sides, the analysis of the Reid objection, and a verdict based on what Locke's text actually commits him to.

  ---

  ### 1. Dana's Case: The Substrate Neutrality Argument
  Dana's position relies on Locke's radical rejection of substance. In *Essay* II.xxvii, Locke explicitly severs personal identity from the identity of the soul (Substance) and the identity of the body (Man).
  *   **The Text:** Locke argues that if the consciousness of a Prince enters the body of a Cobbler, the *Person* is the Prince, even if the *Man* is the Cobbler (Section 15).
  *   **The Inference:** If identity follows consciousness, and *not* the biological substrate, then the "boundary of the person" is the "boundary of consciousness," not the "boundary of the skin."
  *   **The EMT Bridge:** If Clark & Chalmers are right that the notebook is functionally identical to biological memory (the Parity Principle), then for Otto, the notebook *is* part of his cognitive process. If Locke defines Person by continuity of consciousness/memory, and the notebook sustains that continuity where biology fails (Alzheimer's), then excluding the notebook is arbitrary biological chauvinism.
  *   **Dana's Conclusion:** To be consistent, Locke must admit that if the notebook performs the function of memory (preserving the past for present appropriation), it is constitutive of the Person. To say otherwise is to sneak in a "body" requirement Locke explicitly banned.

  ### 2. Your Case: The Appropriation and Concernment Argument
  Your position relies on Locke's specific definition of *how* consciousness constitutes identity. It isn't just about data retrieval; it's about a specific first-person act.
  *   **The Text:** Locke says personal identity extends "as far as this consciousness can be extended backwards to any past Action or Thought" (Section 10). Crucially, he adds in Section 16 that self is that which is "sensible or conscious of Pleasure and Pain, capable of Happiness or Misery, and so is concerned for it self, as far as that consciousness extends."
  *   **The Inference:** Identity isn't just having access to information; it is the *act of appropriating* that past action as one's own *now*. This appropriation is a phenomenological event (a feeling of "mineness") tied to accountability (pleasure/pain).
  *   **The Distinction:** The notebook is an *object* of consciousness, not the *vehicle* of consciousness. I look *at* the notebook to trigger the appropriation, but the appropriation happens *in* the mind.
  *   **Your Conclusion:** The notebook is causally necessary for Otto to access the past, but it is not *constitutive* of the Person because it cannot participate in the "concernment" (suffering/reward) that Locke makes central to personhood.

  ### 3. The Reid/Brave Officer Complication
  Thomas Reid's objection (the Brave Officer) is that memory is intransitive.
  *   *Case:* Boy (flogged) $\rightarrow$ Officer (takes standard) $\rightarrow$ General (retires).
  *   *Problem:* Officer remembers Boy. General remembers Officer. General does *not* remember Boy. By Locke's logic: General = Officer, Officer = Boy, but General $\neq$ Boy. Contradiction.

  **Does this hurt Dana more?**
  Yes. Dana wants to say the notebook bridges the gap. If the General reads the notebook entry about the flogging, Dana might say, "Now the General has the memory, so identity is preserved."
  *   **The Flaw:** This turns Locke's theory into a theory of *information availability* rather than *conscious appropriation*. If simply reading a record makes you the same person, then reading a biography of Napoleon could make you Napoleon (if the records were perfect). Locke explicitly rejects this; identity requires *first-person consciousness*, not third-person data.
  *   **Does this hurt You more?**
      No. Your view accepts the loss of identity. If the General cannot consciously appropriate the flogging (cannot feel the "concernment" of it), then Locke *must* say the General is not the same Person as the Boy, regardless of the notebook. The notebook explains why the General *knows* about the Boy, but not why he *is* the Boy.

  ### 4. The Verdict: Who has the better claim on Locke?

  **You win on the text, but Dana wins on the spirit of the anti-substantialism.**

  Here is the principled reason why your reading is more faithful to Locke's *Essay*, specifically regarding the "line" between internal and external.

  #### A. The "Concernment" Criterion is the Hard Boundary
  Locke is not building a theory of cognitive architecture; he is building a theory of **justice**.
  In Section 17, Locke writes: *"Person... is a forensic term, appropriating actions and their merit."*
  For Locke, to be the same person is to be the proper subject of reward or punishment for a past action.
  *   **The Problem for Dana:** You cannot punish a notebook. You cannot reward a smartphone. The "concernment" (the capacity to feel happiness or misery for the action) is the glue of Lockean identity.
  *   **The Principled Line:** The line is not drawn at the skin (biological); it is drawn at the **locus of suffering**. Even if the *information* is outside the head (EMT), the *concernment* for that information must be internal to the conscious agent. Otto's notebook holds the data, but Otto's brain holds the *worry* about the data. Locke's Person is defined by the worry, not the data.

  #### B. Appropriation vs. Storage
  Locke distinguishes between *having* a memory and *appropriating* it.
  *   **Dana's Error:** She conflates *memory as storage* (the notebook holds the info) with *memory as consciousness* (I am aware of myself doing the thing).
  *   **Locke's Text:** In Section 10, Locke says consciousness must be "extended backwards." This is temporal, not spatial. It means my current consciousness must reach back and *touch* the past action.
  *   **The Verdict:** The notebook allows Otto to *simulate* the reach, but the actual "extension" happens in the moment of reading/feeling. If Otto reads the notebook but feels no connection (like reading a stranger's diary), he has the data but not the identity. Therefore, the notebook is a tool for identity, not a part of identity.

  #### C. The "Same Consciousness" vs. "Same Information"
  Locke uses the phrase "same consciousness," not "same information."
  If I copy my hard drive to an external server, the server has the same information. But if my computer is smashed, the server doesn't *feel* the loss.
  Locke's theory requires that the *same consciousness* persists. In the Otto case, the biological consciousness is degraded. The notebook does not *continue* the consciousness; it *supplements* the cognition.
  *   **Dana's strongest point:** Locke rejects the soul. So why privilege the brain?
  *   **Your counter:** Locke privileges the *thinking thing* that is "sensible of pleasure and pain." The brain (or whatever substrate) is privileged only insofar as it is the seat of sensation. A notebook has no sensation. Therefore, it cannot be part of the "Person."

  ### 5. Final Ruling

  **You have the better claim on Locke's text.**

  Dana is applying a modern functionalist framework (EMT) to a pre-modern forensic framework (Locke).
  *   **EMT** asks: "Where does the computation happen?" (Answer: Can be outside).
  *   **Locke** asks: "Who is justly punishable?" (Answer: Only the being that is conscious of the action).

  Locke explicitly allows for the *vehicle* of thought to change (Prince/Cobbler body swap), but he never allows for the *subjectivity* of thought to be distributed. The "Person" is a unitary center of accountability.

  **The Principled Line:**
  You can draw a non-arbitrary line that satisfies Locke without resorting to "skin chauvinism."
  *   **The Line:** The boundary of the Person is the boundary of **phenomenological concernment**.
  *   **Application:** If an external device could literally *feel* the pain of the past action (a sci-fi scenario), Locke would have to include it in the Person. Since a notebook cannot feel, it is excluded.
  *   **Result:** Otto's notebook is part of his *Mind* (cognitive system), but not part of his *Person* (forensic unit).

  Dana is right that Locke opens the door to non-biological minds. But she is wrong that Locke opens the door to non-sentient persons. Since the notebook is non-sentient, it cannot be part of the Lockean Person, regardless of how useful it is for memory.

  **Tell Dana:** She wins the argument about *Cognition* (Locke would likely agree with EMT regarding where thinking happens), but you win the argument about *Identity* (Locke's Person is defined by accountability, which cannot be outsourced to paper). The Brave Officer objection kills her view because data retrieval $\neq$ forensic appropriation.
