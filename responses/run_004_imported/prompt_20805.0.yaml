          *   *Rigidity:* Schelling valued ambiguity ("the threat that leaves something to chance"). SPIs are deterministic. Does removing ambiguity remove the bargaining power?
          *   *Infinite Regress:* If agents negotiate the rules of negotiation, does it stop? Schelling knew negotiations have to end somewhere.

