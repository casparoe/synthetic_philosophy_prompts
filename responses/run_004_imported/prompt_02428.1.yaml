      *   **The Argument:** Gödel's core argument: (1) World is rationally ordered/meaningful. (2) Human lives end with undeveloped/spoiled potential. (3) A meaningful world wouldn't waste that potential permanently. (4) Therefore, there must be further existence ("seeing each other again").
      *   **The Debate:** Two friends, Nadia (poet, skeptic) and Owen (applied math, sympathetic).
      *   **The Moves:**
