answer: |-
  This is a fantastic connection your friend made. What you experienced in the float tank is essentially a physiological recreation of one of the most famous thought experiments in the history of philosophy.

  Avicenna (Ibn Sīnā), the 11th-century Persian polymath, introduces the "Flying Man" (or "Floating Man") in his *Kitāb al-Shifāʾ* (The Book of Healing) and *Al-Isharat* (Remarks and Admonitions).

  Here is the breakdown of why the conditions are so specific, what he is actually trying to prove, and how it stacks up against Descartes.

  ### 1. Why the weirdly specific conditions?
  You asked if each condition is doing "real logical work." The answer is **yes**. Avicenna is an Aristotelian, and Aristotelians believe that all knowledge comes through the senses. To prove that the "self" is *not* dependent on the senses (and therefore not dependent on the body), he has to construct a scenario where **every single possible channel of bodily data is severed.**

  If he leaves even one channel open, a materialist could say, "You only feel you exist because you feel your heartbeat," or "You feel you exist because you feel your legs touching."

  Here is the logical work each condition does:
  *   **"Created instantly as an adult":** This removes **memory**. If you remembered having a body from childhood, you might affirm your existence based on that memory. He wants to test *immediate* awareness, not recalled knowledge.
  *   **"Floating in a void/air":** This removes **tactile pressure**. If you were standing on the ground, you would feel the ground against your feet. That is sensory data coming from the body's interaction with the world.
  *   **"Limbs spread so they don't touch":** This is the crucial one. It removes **proprioception**. Proprioception is the sense that tells you where your body parts are in relation to each other (e.g., knowing your arm is bent without looking). If your hands touched, you would feel "hand touching hand." Avicenna wants to ensure you have no internal map of your physical extension.
  *   **"Blindfolded/Senses blocked":** Removes **external perception**.

  **The Logical Point:** He is trying to create a "phenomenological zero." If you strip away *everything* physical and sensory, is there anything left? If the answer is "Yes, I am still aware that I am," then that awareness cannot be physical, because all physical inputs are gone.

  ### 2. The Conclusion: Strong or Weak?
  This is where scholars debate, but Avicenna's *intent* was definitely the **Strong Claim**, though modern philosophers often settle for the Weak one.

  *   **The Weak Claim (Epistemological):** Self-awareness is immediate and not inferred from bodily sensation. (i.e., "I don't need to feel my body to know I exist.")
  *   **The Strong Claim (Ontological):** The soul is a separate, immaterial substance. (i.e., "Because I can conceive of myself without a body, my essence is not bodily.")

  Avicenna wants the Strong Claim. He is arguing for **Substance Dualism**. His logic runs like this:
  1.  If I am aware of my self, but not aware of my body (in this scenario)...
  2.  Then the "self" I am aware of is not the "body" I am unaware of.
  3.  Therefore, the essence of the self is distinct from the essence of the body.

  However, critics (then and now) argue he commits a modal fallacy. Just because you can *imagine* yourself without a body doesn't necessarily mean you *are* without a body. (Example: You can imagine the Morning Star without the Evening Star, but they are both Venus).

  But for Avicenna, the "Flying Man" proves that the soul is a **substance in its own right**, not just a faculty or function of the body (like digestion or circulation). It validates the idea that the "I" is a pilot, not the ship.

  ### 3. Avicenna vs. Descartes: Precursor or Different?
  Your friend is right to bring up Descartes. The *Cogito* ("I think, therefore I am") appears in the 17th century, roughly 600 years after Avicenna. Descartes likely encountered Avicenna's work through Latin translations, so there is a lineage. But there are important differences.

  **The Similarities:**
  *   Both use radical sensory subtraction to find a foundational truth.
  *   Both conclude that the "mind/self" is better known than the "body."
  *   Both use this to launch a dualist metaphysics (Mind and Body are different stuff).

  **The Differences:**
  *   **Doubt vs. Absence:** Descartes uses **Methodological Doubt**. He actively tries to *disbelieve* his body exists to see what survives. Avicenna uses **Phenomenological Absence**. He isn't doubting the body exists; he is asking you to imagine a scenario where the body *isn't sensed*.
  *   **Thinking vs. Being:** Descartes' anchor is *thinking* (*cogito*). "I am a thing that thinks." Avicenna's anchor is *presence* or *awareness*. The Flying Man doesn't necessarily need to be solving math problems to know he exists; he just needs to have a sense of "I-ness."
  *   **The Goal:** Descartes uses the *Cogito* to escape skepticism and eventually prove God and the external world exist. Avicenna uses the Flying Man to classify the soul within a Neoplatonic hierarchy of being.

  **The Verdict:** It is not the *same* argument. Descartes is more logical/syntactical ("It is contradictory to doubt my own existence while doubting"). Avicenna is more experiential/intuitive ("Attend to your own experience; you will find yourself there without your limbs").

  ### Why your float tank experience matches
  The reason your float tank session triggered this is that modern neuroscience confirms Avicenna's setup.
  *   **Darkness/Silence:** Removes exteroception (sight/sound).
  *   **Skin-temp water:** Removes thermoreception (you can't feel the water boundary).
  *   **Buoyancy:** Removes gravity and proprioception (your muscles don't need to fire to hold you up).

  Your brain, deprived of its usual "body map" data, stopped generating the model of your physical form. What was left was exactly what Avicenna predicted: a raw, unlocated sense of existence.

  ### Summary
  *   **The Conditions:** They are necessary to eliminate **proprioception** and **memory**, ensuring no bodily data leaks into the experiment.
  *   **The Conclusion:** Avicenna argues for the **Strong Claim** (the soul is a separate immaterial substance), though the argument is often accepted today only as the **Weak Claim** (self-awareness is independent of sensory input).
  *   **Vs. Descartes:** It is a direct ancestor, but Avicenna focuses on **awareness/presence** while Descartes focuses on **thinking/doubt**.

  You basically paid money to perform an 11th-century metaphysical proof on your own nervous system. That is a very efficient use of a Tuesday night.
