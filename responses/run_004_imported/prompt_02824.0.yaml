answer: |-
  This is a fantastic friction point for a horror writer to sit with, because while the philosophers are arguing about the architecture of the mind, you're arguing about the blood on the page.

  Here is the gut-level breakdown of why Radford's shrug drives philosophers up the wall, and whether Walton and Lamarque are actually fighting over territory or just drawing different maps of the same island.

  ### 1. Why Radford's Shrug is Unacceptable (The "Broken Mind" Problem)

  You asked why philosophers treat Radford's "we're just incoherent" conclusion as unacceptable. It's not because they think humans are perfectly rational machines. It's because Radford's solution turns the human response to art into a **cognitive glitch.**

  If Radford is right, then experiencing *Anna Karenina* or your horror novel is functionally identical to a visual hallucination or a logic error in a computer code. It implies that our emotional machinery is fundamentally broken when it comes to representation. It suggests that to be moved by art, we must temporarily lose our grip on reality.

  Philosophers hate this because it makes art a **parasite on rationality.**

  *   **The Gut-Level Stake:** If Radford is right, the horror writer is a con artist exploiting a bug in the reader's brain. The fear your beta readers feel is a mistake. It's a misfire.
  *   **The Philosopher's Goal:** They want to show that engaging with fiction is a **feature, not a bug.** They want to prove that you can be rational, know the monster isn't real, and *still* have a valid, structured emotional experience without your brain short-circuiting.

  Radford's shrug kills the normative power of art. If it's just incoherence, there's no way to judge *good* fear vs. *bad* fear, only *effective* hacking vs. *ineffective* hacking. Walton and Lamarque are trying to save the idea that reading is a coherent human activity, not a temporary insanity.

  ### 2. Walton vs. Lamarque: Real Disagreement or Semantic Wrestling?

  This is the crux of your beta reader problem. Your readers say, "This feels like real fear."

  *   **Walton says:** "It feels like fear, it looks like fear, it has the adrenaline of fear, but it is **not** fear. It is quasi-fear."
  *   **Lamarque says:** "It **is** fear. You just don't need a real object to have it."

  Are they just labeling the same thing? **No.** This is a metaphysical disagreement about what an emotion *is*.

  #### The Walton Position: The Game of Make-Believe
  Walton is a strict cognitivist. He believes emotions are tethered to beliefs. To be *actually* scared, you must believe there is a threat. Since Charles (or your reader) knows the slime monster is fake, he cannot be actually scared.

  For Walton, the physiological arousal (sweaty palms, turning on the light) is real, but the **mental state** is a prop in a game.
  *   **The Horror Writer's Implication:** If Walton is right, your reader is never truly in danger. They are a child playing "monster." When they turn on the light, they aren't reacting to a threat; they are completing a move in the game of make-believe. The thrill comes from the **safety**. They enjoy the sensation of fear *because* they know they can walk away.
  *   **The Weakness:** As you noted, this insults the beta reader. Tell a reader who had nightmares for a week that they were only "quasi-scared," and they'll tell you to get out of their house. Walton struggles to explain why we avoid certain fictions if we know they aren't real. (Why not watch the snuff film if it's just a game? Because the quasi-fear becomes too intrusive.)

  #### The Lamarque Position: The Power of Thought
  Lamarque (and the Thought Theory crowd) loosens the tether. He argues that emotions respond to **thoughts**, not just **beliefs**.
  *   **The Gut-Level Distinction:** You can fear the *proposition* "A slime monster is in the room" without believing it is true. The content of the thought is sufficient to trigger the emotion.
  *   **The Horror Writer's Implication:** If Lamarque is right, your beta readers are telling the truth. They *are* genuinely afraid. The fiction isn't a game; it's a **simulation of possibility.** The horror works because the *idea* of the monster is toxic, regardless of its existence.
  *   **The Weakness:** It risks making emotions too unmoored. If I can fear anything I can think of, why aren't we in a constant state of panic? Lamarque has to explain why fictional fear stops when the book closes, while real fear persists.

  ### The Verdict: Where the Rubber Meets the Road

  Walton and Lamarque are disagreeing about the **ontology of the reader's experience.**

  *   **Walton** thinks the reader is an **Actor.** They are performing fear within a fictional context. The emotion belongs to the game.
  *   **Lamarque** thinks the reader is a **Witness.** They are contemplating a state of affairs. The emotion belongs to the mind.

  **Why this matters for your novel:**

  If **Walton** is right, your job is to maintain the **ludic contract**. You must keep the reader immersed in the "game." If the prose becomes too clunky or the logic too flawed, the game breaks, and the quasi-fear evaporates. You are designing a rollercoaster; the safety bar must hold.

  If **Lamarque** is right, your job is to make the **thought contagious**. You aren't building a ride; you are planting a seed. The horror comes from the reader entertaining the *possibility* of your monster. The fear lingers after the book closes because the *thought* of the monster now exists in their mind, independent of the book.

  **My take?**
  Philosophers hate Radford's shrug because it surrenders the mind to chaos. But between Walton and Lamarque, Lamarque respects the beta reader more. Walton requires you to tell your readers, "You didn't really feel what you felt." Lamarque allows you to say, "You felt exactly what you felt, because the human mind reacts to the *image* of the knife just as it reacts to the knife."

  For a horror writer, Lamarque is the more terrifying proposition. It means your words aren't just props in a game; they are actual stimuli. You aren't playing make-believe with their amygdala; you are poking it.
