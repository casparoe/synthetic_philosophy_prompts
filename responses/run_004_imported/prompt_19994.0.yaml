  ### **⚠️ Flat-Out Errors (Feedback for Priya)**
  *Even if the rubric didn't catch these, you should tell her these are factually incorrect so she doesn't put them on the real AP exam:*

  1.  **The Peacock is a Handicap, Not an Index:** This is the biggest conceptual error. In signaling theory, the peacock's tail is the definition of a **Handicap**. It reduces survival (predation risk, metabolic cost) but signals quality because only high-quality males can survive *despite* the tail. An **Index** signal is something physically impossible to fake, like the frequency of a frog's croak (linked directly to vocal sac size) or a lion's roar depth. You cannot "choose" to have a deeper voice if your body is small; you *can* choose to grow a big tail if you sacrifice immune function. She mixed these up.
  2.  **The History of the Math:** She wrote that Zahavi worked out the math in 1975 and that's why people believed him. The opposite is true. Zahavi proposed the idea verbally in 1975, and most evolutionary biologists (including John Maynard Smith) rejected it for over a decade because the math didn't seem to work. It wasn't until Alan Grafen published his mathematical models in 1990 that the theory was accepted. The teacher specifically hinted at this "15-year controversy" in class, so missing this will definitely cost points.
  3.  **Definition of Index:** She implies an index is "hard to fake" because it is expensive. An index is hard to fake because of **physical/physiological constraints**, not necessarily because it is expensive. A cheap signal can be an index if it is physically tied to the trait (e.g., body size).

