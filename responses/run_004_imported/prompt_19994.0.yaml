  **Category 3: Handicap vs. Index (Part c)**
  **Score: 1/5**
  **Justification:** This is the weakest section. You defined a handicap but labeled it an "index." The peacock's tail is the canonical textbook example of a **handicap**, not an index. An index signal is physically constrained (e.g., vocal frequency linked to body size) and cannot be faked even with resource allocation. A handicap *can* be faked but is too costly to survive. conflating these suggests a fundamental misunderstanding of the distinction the rubric requires.

  **Category 4: Examples & Evaluation (Part d)**
  **Score: 3/5**
  **Justification:** Your human example (promposal) is a reasonable analogy for a costly signal, and you evaluated the cost aspect well. However, because you misclassified the peacock in part (c), your evaluation of it here is inconsistent with biological theory. You evaluated the peacock as an index based on cost, but indices are defined by physical constraints, not just cost. You earned partial credit for attempting the evaluation logic, but the foundational classification error limits the score.

