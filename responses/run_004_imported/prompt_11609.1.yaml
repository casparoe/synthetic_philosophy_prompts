answer: |-
  **Setting:** *A university faculty lounge, late afternoon. The remains of a seminar on "The Ethics of Life Extension" are being cleared away. **Elias**, a biomedical researcher, is pouring coffee. **Mara**, a philosopher of medicine, is stacking her notes.*

  **Elias:** You were quiet during the Q&A, Mara. But I saw you wince when the speaker brought up the FDA roadblock. You don't buy the argument that we need to classify aging as a disease to unlock the funding?

  **Mara:** I buy that it would unlock the funding, Elias. I don't buy that it's conceptually coherent. If you tell me aging is a disease, you're telling me that the default trajectory of human development is a pathology. That turns medicine from a practice of healing into a practice of fighting existence.

  **Elias:** That's dramatic. Look, it's a regulatory hack, sure, but it's grounded in biology. We have mechanisms—methylation clocks, senescent cell accumulation—that correlate with system failure. If I can measure a deviation from healthy function, I can treat it. The problem is the definition of "normal." Right now, if a seventy-year-old has the arteries of a typical seventy-year-old, the doctor says, "You're fine." Even if those arteries are calcified and stiff.

  **Mara:** Because "fine" is relative to the reference class. You're comparing him to other seventy-year-olds.

  **Elias:** Exactly. And that's the trap. If everyone in the reference class is decaying, then decay becomes the statistical norm. By the current definition, you can *never* diagnose aging as a disease, because you can't be statistically abnormal for your age if your whole cohort is aging with you. It builds the conclusion into the premise.

  **Mara:** So your solution is to change the reference class?

  **Elias:** I'm saying the reference class shouldn't be "current population averages." It should be "species-typical functional design." Think about teeth. A hundred years ago, losing teeth by fifty was statistically normal. Was it healthy? No. It was a failure of the biological system to maintain integrity. We didn't say, "Well, everyone loses teeth, so it's not a disease." We fixed the biology, and now keeping teeth is the norm. Aging is just systemic tooth loss.

  **Mara:** That's a clever move, Elias. You're shifting from *statistical* normality to *ideal* function. But you're smuggling in a value judgment there. Why is keeping teeth the "design goal"?

  **Elias:** Because the biological design is homeostasis. The system is built to maintain itself. When it fails to maintain itself, that's a biological fact, not an opinion.

  **Mara:** Is it? Biology is full of trade-offs. Evolution doesn't design for immortality; it designs for reproduction. Once you've passed on your genes, the selective pressure drops off. The accumulation of damage isn't a "failure" of the system from an evolutionary standpoint. It's the system working exactly as selected for. You're calling it a failure only because *you* value longevity over reproductive efficiency.

  **Elias:** I'm not valuing longevity arbitrarily. I'm valuing function. If a car engine seizes up, we don't say, "Well, it was designed to last 100,000 miles, so seizing at 100,001 is natural." We say the engine is broken. We have a standard of what the machine is *supposed* to do. Humans are machines that are supposed to walk, think, and pump blood. Aging stops those things. That's dysfunction. Dysfunction is objective.

  **Mara:** But "dysfunction" only matters if we care about the function. A rock doesn't have dysfunction. A virus doesn't have dysfunction. We attribute dysfunction to organisms because we assume they have a *good*—a state of affairs that is better for them. That's a normative claim. You're saying aging is bad.

  **Elias:** I'm saying it leads to death and suffering. That's not a value judgment; that's a consequence.

  **Mara:** Is it? Death is inevitable. Suffering is contingent. By classifying aging itself as the disease, you're saying the *process* leading to death is the pathology, not just the specific pains along the way. That medicalizes the human condition. If I take a drug to stop aging, I'm not treating an illness; I'm altering my relationship with time. That's an enhancement, not a cure. And "enhancement" is purely a value category.

  **Elias:** Okay, let's press on your point about values. You're worried that calling aging a disease makes diagnosis a matter of taste. Like, "I don't like wrinkles, so I have a disease." But that's not what we're doing. We're identifying specific pathways—mTOR, AMPK—that, when dysregulated, increase the probability of all-cause mortality. If I can show you a biomarker that predicts you will get cancer, heart disease, and dementia simultaneously, isn't that a pathological state?

  **Mara:** It's a risk state. But risk isn't disease. High cholesterol isn't a disease until it causes harm. The harm is the value-laden part. You keep trying to ground this in "biology," but biology just *is*. Cancer cells are biological. They follow laws of physics. They're natural. We call them "disease" because they harm the host's interests.

  **Elias:** So you agree there is a "host's interest"?

  **Mara:** Yes.

  **Elias:** Then the interest is survival and function. Aging compromises that interest. Therefore, aging is the disease. Where is the subjectivity?

  **Mara:** The subjectivity is in prioritizing *that* interest above all others. Imagine a society that values wisdom and acceptance of mortality over physical persistence. They might look at our obsession with cellular repair and say, "You're treating the natural conclusion of a life as a malfunction." You're assuming that maximizing health-span is the highest good. That's not a biological fact. That's a cultural value.

  **Elias:** But doctors make that assumption every day. When a doctor treats a ninety-year-old for pneumonia, they aren't saying, "Well, you're ninety, maybe you should just die." They are acting on the premise that life and function are goods worth preserving. If we accept that premise for pneumonia, why do we draw the line at the underlying fragility that made the pneumonia lethal?

  **Mara:** Because there's a difference between restoring function and denying limits. Treating pneumonia restores the patient to their age-expected baseline. Treating aging attempts to change the baseline itself. You're asking medicine to fight entropy.

  **Elias:** Medicine has *always* fought entropy. We fight infection. We fight genetic defects. Why is time the one enemy we're not allowed to fight? It seems like you're drawing a magical line around "natural" causes. Smallpox was natural. We eradicated it.

  **Mara:** Smallpox was an external pathogen. Aging is internal. It's constitutive. If you cure aging, you aren't returning the patient to a "healthy" state defined by their species; you're creating a new state of being. That's why the value judgment is unavoidable. You have to argue that *being older* is worse than *being younger*, essentially.

  **Elias:** I argue that *being less functional* is worse than *being more functional*. And aging is, biologically, a loss of function. It's a loss of resilience. If I can measure resilience, I can measure the disease. I don't need to ask the patient if they value resilience. Their immune system values it. Their cells are fighting to survive every second.

  **Mara:** Their cells are fighting to survive, yes. But *you* are the one interpreting that cellular struggle as a mandate for medical intervention. The cell doesn't care about "disease." It just reacts. "Disease" is a label we apply when those reactions interfere with a life plan.

  **Elias:** Okay, let's grant that "disease" requires a value judgment. Let's say you're right, and we can't separate the biology from the "good." Does that change the practical reality? If we don't classify it as a disease, the FDA won't approve a drug that targets the aging process. They only approve drugs for specific indications. So we wait for people to get heart failure, then we treat the heart. We wait for dementia, we treat the brain. We treat the branches, not the root.

  **Mara:** I understand the regulatory incentive. But don't confuse "useful classification" with "true classification." You can argue we *should* regulate it as a disease to save lives. That's a policy argument. But don't tell me it *is* a disease in the same way tuberculosis is. Tuberculosis is a deviation from the human norm. Aging *is* the human norm.

  **Elias:** It's the human norm *so far*. Just like blindness was the norm before we understood optics. You're conflating "common" with "normal." In medicine, normal means functioning as intended. If the intention of the organism is to persist, aging is a bug.

  **Mara:** But who sets the intention? Evolution didn't. God didn't. We did. And that brings us back to my point: this is about what we want, not what we are. If we decide we want to live to 150, then aging becomes a disease. If we decide we want to live to 80 and then gracefully decline, it's a life stage. The biology is the same. The diagnosis changes based on our desire.

  **Elias:** But the biology *isn't* the same if we intervene! If I take a senolytic and clear out my zombie cells, my biology changes. I become more resilient. Isn't resilience an objective good?

  **Mara:** Resilience is good *for* something. For surviving. For working. If I'm a monk seeking transcendence, maybe my physical fragility helps me detach. I'm not saying that's the right view, Elias. I'm saying you can't prove it's the *wrong* view using a microscope. You need ethics.

  **Elias:** So we're stuck. I need the label to get the tools to fix the biology. You need the ethics to justify the label.

  **Mara:** Not stuck. Just honest. If you want to treat aging, argue for the value of extended health. Don't hide behind the idea that you've found a "biological fact" that forces the classification. You haven't found a fact; you've found a mechanism for a value we hold.

  **Elias:** And if I argue the value?

  **Mara:** Then we're having a real conversation. About what kind of creatures we want to be, not just what kind of machines we are.

  **Elias:** *Sips cold coffee.* I can live with that. As long as we can agree that the machine is currently broken.

  **Mara:** *Smiles.* I can agree the machine is fragile. Whether it's broken depends on what you think it's supposed to build.
