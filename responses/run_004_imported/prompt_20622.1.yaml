      *   The core worry is that if phenomenal consciousness depends on a higher-order representation (HOR), and that HOR can exist without a corresponding first-order state (targetless) or misrepresent it, then the theory implies one can have a conscious experience without the underlying sensory state (or with a different one). This is often seen as counterintuitive (e.g., feeling pain without any nociceptive state).
      *   Exposure depends on how tightly the theory couples the HOR to the first-order state (FOR) and whether the HOR is distinct from the FOR.
      *   *High Exposure:* Distinct HOR, actual occurrence required, loose coupling allowing targetless states to generate consciousness.
      *   *Low Exposure:* HOR and FOR are not distinct (single state), or the theory explicitly denies consciousness in targetless cases, or the architecture makes targetless states impossible/unlikely to generate phenomenology.

