answer: |-
  The logbook was a leather-bound brick, smelling of brine and thirty years of dead men's ink. Elias dipped his pen. *Day 10,957. Sunset: 19:42. Barometer: Steady.*

  He capped the pen. The ritual was a comfort, a physical anchor in a world of shifting water. He turned to the lamp. It was a Fresnel lens the size of a carriage, a hive of glass prisms waiting to catch the fire.

  Elias had lit this lamp every single night for thirty years. The Order's directive was carved into the stone lintel above the door: *GUIDE THE LOST.*

  He interpreted that as: *When it is dark, make light.*

  It had worked. Ships passed. None had struck the Needle Rocks. He knew what the rule meant. He felt the meaning in his bones, a pre-linguistic certainty. When the sun dipped, the wick rose.

  A knock at the iron door. Not the wind.

  Elias opened it. A man stood there, wrapped in a grey coat that seemed to absorb the twilight. He held a clipboard, but he wasn't looking at it. He was looking at the sky.

  "Auditor?" Elias asked. The Order rarely sent people. They sent oil, they sent rations, they sent letters of commendation. Not people.

  "Call me H," the man said. He stepped inside without invitation. He walked to the lens, running a gloved finger along the brass rim. "Thirty years, Elias. Impressive consistency."

  "It's the job."

  "Is it?" H turned. His face was unremarkable, the kind you forget before you've finished looking. "Tell me. What is the rule?"

  Elias blinked. "Carved in the stone. Guide the Lost."

  "And how do you operationalize that?"

  "I light the lamp when the sun goes down."

  H nodded slowly. "You have done this 10,957 times. In every single instance, the sun went down, and you lit the lamp. In every single instance, the ship passed safely."

  "Yes."

  "But," H said, raising a finger, "in every single one of those 10,957 instances, the Moon was waxing or waning. It was never *New*."

  Elias frowned. He looked out the gallery window. Tonight, the sky was a void. No silver coin. No crescent. The Moon was dark, aligned with the sun, invisible. A New Moon.

  "It happens every month," Elias said.

  "Not at the Solstice," H corrected. "Not when the Solstice aligns with the New Moon. That is a cycle of nineteen years. You've been here thirty. You've seen this once before."

  Elias paused. He searched his memory. Nineteen years ago. He had been younger, the lamp heavier. He remembered the darkness being thicker, more absolute. He had lit the lamp. The night had passed.

  "You lit the lamp then, too," H said, reading his face. "So your history is consistent with Rule A: *Light when the sun sets.*"

  "Obviously."

  "But your history is also consistent with Rule B," H said softly. "*Light when the sun sets, unless the Sky is Blind. If the Sky is Blind, extinguish the flame.*"

  Elias laughed, a dry, brittle sound. "Extinguish? In the dark? That would sink them."

  "Would it?" H stepped closer. "How do you know? You have never tested the negative case. Every time you have lit the lamp, the Sky had eyes. The Moon was watching. You have no data for a Blind Sky at Solstice. Your past behavior fits Rule B just as perfectly as it fits Rule A."

  "That's absurd. I *know* what I meant. I meant 'Light the damn lamp'."

  H tilted his head. "You mean you have a feeling. A sensation of certainty. But feelings are just more internal events, Elias. They are more data points in the past. You felt certain nineteen years ago, too. Did that feeling guarantee the rule? Or was it just a noise in your head accompanying the action?"

  "I... I was taught by the previous Keeper."

  "And what did he say?"

  "'"Guide the Lost."'"

  "And did he ever encounter a Blind Solstice?"

  "He died in his sleep."

  H shrugged. "Then his usage was finite, too. Look, I'm not saying Rule B is *better*. I'm saying there is no fact of the matter about which rule you intended. You think meaning is a hook in your mind that catches the future. But the hook is smooth. It slides off. Nothing you did, nothing you thought, nothing you felt in the last thirty years locks in the next ten seconds."

  Elias turned back to the lamp. The matchbox was in his hand. The sulfur head was red, waiting. Outside, the horizon was bleeding out the last of the orange. The grey was turning to black. The sea was silent. Too silent.

  "If I don't light it," Elias said, "and a ship comes..."

  "If you do light it," H countered, "and the Rule was B... then you have signaled 'Safe Waters' when the rocks are exposed by the tidal pull of the Blind Sky. You guide them onto the Needle."

  "I've never heard of such a rule."

  "Because you've never been in a position to learn it," H said. "Meaning isn't private, Elias. It's social. It's what the community accepts. And I am the community right now. And I am telling you that your past does not justify your present."

  Elias struck the match. The flare hissed, bright and sudden in the gloom.

  "Wait," H said. Not a command. Just an observation.

  Elias froze. The flame licked at his thumb. He could feel the heat. It was real. The lamp was real. The ship's horn, distant and low, vibrated in the glass.

  "Why are you here?" Elias asked. "If there's no fact of the matter, why stop me?"

  "Because," H said, "I am following a rule, too. *Interrupt when the divergence occurs.* Maybe that's my Rule A. Maybe my Rule B is *Interrupt only when the Keeper is wearing a blue shirt.*"

  Elias looked down. He was wearing a grey sweater.

  H smiled, and it was a sad, empty expression. "See? Even I don't know. I just feel the impulse. Just like you feel the impulse to light the wick."

  The match burned down to Elias's fingernail. The pain was sharp, immediate. A fact.

  He dropped the match. It hit the stone floor, sputtered, and died.

  The darkness rushed in, absolute and heavy. The Moon was not there to soften it. The sea was a black void.

  "I'm lighting it," Elias said. His voice shook. "I have to."

  "On what grounds?"

  "On the grounds that I am the Keeper."

  "That's just a label. It relies on a rule for what a 'Keeper' does. We are back at the start."

  Elias reached for the flint striker. His hand hovered over the mechanism. He tried to look inside himself, to find the solid core of *Plus* that distinguished it from *Quus*. He tried to find the moment he learned the word *Light* and pin down exactly what it contained.

  He found nothing. Just a chain of memories. *Light. Dark. Light. Dark.* A sequence of events that could be described by infinite functions.

  The horn blew again. Closer.

  "If I'm wrong," Elias whispered, "they die."

  "If you're right," H said, leaning against the wall, crossing his arms, "they die."

  Elias gripped the striker. The metal was cold. He realized he was waiting for a sign, for a feeling of correctness to descend like grace. But the silence in his head was total. There was no instruction manual in his soul. There was only the next step, taken without a net.

  He struck the flint.

  The spark caught the wick. The flame roared up, magnified by the prisms, throwing a beam of brilliant, cutting white out into the blind night.

  Elias watched the beam sweep the water. He waited for the crash. He waited for the ships to pass. He waited for H to tell him he had misunderstood the word *Wait*.

  H was gone.

  The door stood open. The wind blew through the empty frame. There were no footprints on the dusty floor.

  Elias stood alone in the lantern room, the great light spinning above him, casting his shadow long and thin against the wall. He didn't know if he had done the right thing. He didn't know if he ever could. He only knew that tomorrow, the sun would rise, and he would have to decide what *Rise* meant.

  He sat down at the logbook. He dipped his pen.

  *Day 10,958,* he wrote. *Sunset: 19:42. Rule: Followed.*

  He stared at the word *Followed*. He wondered if it would still be true when he read it in the morning. He put the pen down and watched the light cut the dark, waiting for the sea to answer.
