          *   But for *social* science, the basis is Psychology. If the laws of mind are the ultimate laws, and minds remain distinct entities, the combination rule is mechanical.
          *   *Crucial Point:* Mill acknowledges that the *result* looks complex (like water), but insists the *causal mechanism* is the sum of individual actions.

      *   *Q3: Assertion via analogy or real argument?*
