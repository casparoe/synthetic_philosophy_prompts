          *   So, it's not a *proof* against Holism from neutral ground; it's a consistency check within his own system.

      *   *Q4: Argument for Methodological Individualism or Promissory Note?*
          *   It's a *methodological prescription* based on an ontological claim. He is saying: "You *must* treat it as additive because that's how minds work."
