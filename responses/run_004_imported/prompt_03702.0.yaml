          2.  Is there a principled basis in Mill's broader account of causation for classifying social phenomena as "mechanical" (additive) rather than "chemical" (emergent)?
          3.  Is Mill *asserting* his conclusion via analogy, or providing a real argument?
          4.  Is this passage a defense of methodological individualism or a "promissory note"?
