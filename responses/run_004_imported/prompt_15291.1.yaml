      *   *The Veterans' Argument:* Why do they say this? To protect soldiers. It's functional. But is it morally complete? Maybe not.
      *   *The User's Feeling:* Why does it persist? Because harm was caused. If the war was unjust, the harm was unnecessary. That carries weight.
      *   *Culpability vs. Causation:* Did you *cause* harm? Yes. Are you *to blame* for the war? No. This is a crucial distinction.
      *   *Epistemic Burden:* Could you have known then? Usually no. Holding yourself to a standard of omniscience is unfair.
      *   *Moral Injury:* Name it. This isn't just logic; it's soul pain.
      *   *Conclusion:* Neither side is fully "right." It's a tension. The goal isn't to erase the feeling but to integrate it.

  7.  **Refining Tone:**
      *   Must be respectful, non-judgmental, and compassionate.
