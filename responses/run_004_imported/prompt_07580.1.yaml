prompt: |-
  I run a tiny philosophy podcast out of my spare room (a few hundred listeners, nothing fancy) and next week I'm finally getting to interview a guy who's spent his whole career defending the doctrine of double effect -- not just on trolleys, he's applied it to self-defense and collateral damage in war too. I never studied philosophy in school (I'm an electrician by trade), but I've spent a couple years now reading Foot and Thomson and some of Kamm's papers on my own time, and I don't want to waste this interview on stuff he's answered a thousand times. Can you write me 8 or 9 questions that actually get into the hard parts? I want at least one on the closeness problem -- how does he decide that looping the trolley onto a track where it just happens to get stopped by a guy's body counts as merely foreseeing the guy's death, when the whole plan only works because that body is there, versus the footbridge case where pushing the same guy off is supposed to be flat-out using him. I want one on Kamms "triple effect" move, where you're apparently allowed to intend that a guy's body ends up blocking the trolley without intending his death, even though it's completely certain going in that getting hit like that will kill him -- I want to know if that's a genuine moral distinction or just a more careful way of phrasing your intentions until the theory spits out the answer you wanted. And I want one on Joshua Greene's argument that the whole intend/foresee line he cares so much about is really just tracking whether the killing is up close and personal, not anything double effect is actually picking up on. For each of those three, give me the smooth answer he'll probably reach for first, and then a sharper follow-up question that doesn't let him just rest there.
