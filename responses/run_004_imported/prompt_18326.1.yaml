answer: |-
  Your intuition is sharp, and you have identified what is arguably the single most significant ethical controversy in the economics of climate change. You are not missing a subtlety; rather, you have pinpointed the exact fault line between mainstream welfare economics and intergenerational ethics.

  The short answer is: **Yes, you are largely correct.** The use of a positive social discount rate in climate models does generate outcomes that many moral philosophers (and some economists) view as ethically indefensible according to the Sidgwick-Parfit standard. However, the situation is slightly more nuanced than "economists are ignoring philosophy." It is better described as a fundamental methodological disagreement about the purpose of economic modeling.

  Here is an assessment of the tension between the philosophical consensus and climate economics.

  ### 1. The Philosophical Consensus (Sidgwick, Ramsey, Parfit)
  As you noted, the philosophical argument is robust.
  *   **Henry Sidgwick** argued that the mere difference of time is not a rational ground for having less regard for a future good.
  *   **Frank Ramsey** (1928), the father of modern discounting theory, famously called pure time preference a "practice which is ethically indefensible and arises merely from the weakness of the imagination."
  *   **Derek Parfit** reinforced this in *Reasons and Persons*, arguing that discounting the welfare of future persons simply because they are temporally distant is a form of discrimination analogous to racism or sexism ("temporal chauvinism").

  In moral philosophy, the consensus is that $\delta$ (the pure rate of time preference) should be zero for intergenerational problems.

  ### 2. The Economic Mechanism: The Ramsey Equation
  To understand why economists like William Nordhaus continue to use positive rates, we must look at the **Ramsey Rule**, which determines the social discount rate ($r$):

  $$r = \delta + \eta \cdot g$$

  Where:
  *   $\delta$ = Pure time preference (impatience).
  *   $\eta$ = Elasticity of marginal utility of consumption (inequality aversion).
  *   $g$ = Expected growth rate of per capita consumption.

  Economists argue that a positive $r$ does not necessarily imply a positive $\delta$. They justify positive discounting through two main channels that attempt to bypass the Sidgwick-Parfit critique:

  **A. The Growth Argument ($\eta \cdot g$)**
  Standard economic theory assumes future generations will be significantly wealthier than the present generation due to technological progress. If a dollar is worth less to a rich person than to a poor one (diminishing marginal utility), then transferring resources from the poor present to the rich future is less urgent.
  *   *The Economist's Defense:* We aren't discounting their *welfare* because of time; we are discounting the *marginal value of consumption* because they will be richer.
  *   *The Philosophical Counter:* This assumes growth is guaranteed. If climate change catastrophically reduces $g$ (or makes the planet uninhabitable), this justification collapses. Furthermore, it assumes financial capital is a perfect substitute for environmental stability.

  **B. The Opportunity Cost of Capital**
  Economists often argue from a **descriptive** standpoint rather than a **prescriptive** one.
  *   *The Argument:* Capital invested today yields a return (historically ~4–6%). If we spend \$100 today on abatement, we forego that investment. If we invest that \$100 and let it compound, future generations will have more resources to adapt to climate change than if we spent it on abatement now.
  *   *The Critique:* This relies on market rates, which reflect the finite lifespans and myopia of current market participants. Using market rates to determine intergenerational ethics effectively "smuggles in" the very pure time preference philosophers reject, because market rates reflect the impatience of people who know they will die.

  ### 3. The Stern-Nordhaus Debate
  This is not a quiet disagreement; it exploded into public view with the **Stern Review (2006)**.
  *   **Nicholas Stern** adopted the philosophical view: He set $\delta \approx 0.1\%$ (near zero). The result: Immediate, aggressive mitigation is required because future damages are not discounted heavily.
  *   **William Nordhaus** criticized Stern, arguing that such a low rate was inconsistent with observed market behavior and would require sacrifices by the current poor that were too large. Nordhaus maintained a higher $\delta$ (around 1–1.5%). The result: A slower, "optimal" ramp-up of carbon taxes.

  Nordhaus did not explicitly argue that "discriminating against the future is good." Rather, he argued that **feasibility and consistency with current economic behavior** matter. If the discount rate is too low, the model prescribes policies that no political system would ever adopt, rendering the model "normatively ideal but practically useless."

  ### 4. Is the Premise Discredited?
  Your assessment that mainstream climate economics rests on a premise moral philosophy has discredited is **substantially accurate**, with three important caveats:

  **1. Descriptive vs. Prescriptive Ethics**
  Mainstream economics often claims to be value-neutral, utilizing "revealed preference" (what people actually do). By using market discount rates, economists are modeling *how society behaves*, not necessarily *how it ought to behave*. However, when these models are used to prescribe *policy* (as IAMs are), they inevitably import the ethical biases of the market into the prescription. Philosophers argue this is a category error.

  **2. The Problem of Non-Substitutability**
  The economic justification for discounting relies on the idea that future wealth can compensate for future climate damage. Moral philosophers (and ecological economists) argue that some losses (extinction, ecosystem collapse) are non-substitutable. No amount of future GDP compensates for a destabilized biosphere. In this context, discounting future harm is not just ethically dubious; it is analytically flawed.

  **3. The Field is Shifting**
  The criticism you raise has gained traction even within economics.
  *   **Weitzman's Dismal Theorem:** Martin Weitzman argued that when dealing with fat-tailed risks (catastrophic climate change), the discount rate becomes irrelevant or undefined; the expected utility is dominated by the low-probability, high-impact scenarios.
  *   **Policy Changes:** Recently, the US EPA and the UK Treasury have moved toward lower discount rates for climate regulations, acknowledging the intergenerational ethical dimension. The concept of **declining discount rates** (hyperbolic discounting) is also gaining ground, which reduces the discrimination against the far future without requiring $\delta = 0$ today.

  ### Conclusion
  You are right to be skeptical. When Integrated Assessment Models (IAMs) apply a constant positive discount rate over centuries, they mathematically ensure that damages occurring 100 or 200 years from now have almost zero weight in today's decision-making.

  While economists justify this via the "future wealth" argument ($\eta \cdot g$) rather than pure impatience ($\delta$), the practical effect is often indistinguishable from the "pure time preference" that Sidgwick and Parfit refuted.

  Mainstream climate economics is not necessarily *ignoring* the philosophical critique, but it has historically prioritized **internal consistency with neoclassical growth theory** over **intergenerational ethical coherence**. However, the pressure from philosophy (and the physical reality of climate risk) is forcing a recalibration. The "decisive" philosophical argument is slowly eroding the economic consensus, but the lag time is measured in decades—precisely the kind of delay that the discount rate itself encourages.

  **Verdict:** Your assessment is correct. The standard economic approach effectively operationalizes a form of temporal discrimination that lacks ethical foundation, justified by technical assumptions about growth and capital that may not hold in a climate-constrained world.
