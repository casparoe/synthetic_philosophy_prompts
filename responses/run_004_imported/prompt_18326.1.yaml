      *   *Nordhaus's Position:* He uses a higher $\delta$ (around 1-1.5%) and relies on market rates. He argues we observe people discounting the future, so society should too (Descriptive).
      *   *Stern's Position:* He used $\delta = 0.1\%$ (near zero). Focused on the ethical imperative (Prescriptive).
