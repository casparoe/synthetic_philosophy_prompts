      *   *Nordhaus/Economists:* Yes, William Nordhaus (Nobel laureate) uses discounting in his DICE model. The Stern Review (2006) is the famous counterpoint that used a near-zero discount rate.
      *   *The Tension:* This is a well-known debate in the field (Stern vs. Nordhaus/Weitzman). It's not a secret; it's the central ethical controversy of climate economics.
      *   *Nuance:* Economists distinguish between *pure time preference* ($\delta$) and the *elasticity of marginal utility of consumption* ($\eta$). The social discount rate ($r$) is roughly $r = \delta + \eta \cdot g$.
      *   *The "Smuggling" Charge:* Is it smuggling? Or is there a justification? Economists argue based on *opportunity cost of capital* and *growth*, not just pure impatience.

  3.  **Structure the Response:**
