prompt: |-
  Our school's Honor Council is a student-run body that hears cheating and plagiarism cases and decides on sanctions, and every year there's a "turnover" banquet where the outgoing chair formally hands things over to whoever is replacing them. I was just elected to take over from Naomi, who has chaired the council for the last two years and is, by any reasonable measure, the most dedicated and effective chair we've had: she sat through as many as fifteen hearings, rewrote most of the procedures we still use, and was tough enough that even people she sanctioned generally admit afterward that she was fair. The complication is that two weeks ago, through an old group chat that resurfaced, it came out that Naomi let a friend copy her chemistry lab write-up freshman year, before she'd even joined the council. She hasn't tried to deny it or explain it away, and she's asked whoever speaks at the banquet "not to put me on trial, and not to pretend it didn't happen" — and since I'm the one giving the handover remarks, that request is now my problem to solve.

  The room is going to be split in a way that makes this harder. The council members and our faculty advisor all know exactly what happened and have been arguing about it nonstop, while most of the parents, teachers, and younger students in the audience know Naomi only as the strict, fair chair and have no idea about the lab report. One of my friends on the council, who is really into philosophy, keeps insisting that Naomi forfeited what he calls her "standing to blame" the moment she let her own violation slide — that she was never entitled to sit in judgment of anyone after that, whatever the rules said. Another friend thinks that's a non sequitur: he says pointing out someone's hypocrisy like this (he called it "tu quoque") might be a fair complaint about her personally, but it does nothing to show that the people she sanctioned were actually innocent, or that the code itself was wrong to enforce. I don't know which of them has the better view, and I don't think the speech should try to settle it, but I do think whoever writes it needs to genuinely track the difference between "Naomi wasn't entitled to judge us" and "Naomi's judgments were wrong" — because otherwise I'll end up either pretending the lab report doesn't matter or accidentally implying that everyone she ever sanctioned got a bum deal, and neither of those is true.

  Could you write the handover speech for me? It should run about three to four minutes, it has to genuinely honor what Naomi did for the council over two years, it can't say anything false about the lab report or soften it into nothing, and it needs to leave room for both halves of the audience — the ones who know the full story and the ones who don't — to hear it as sincere rather than as either a whitewash or a quiet trial.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Incoming Honor Council Chair.
      *   **Audience:** Split knowledge base.
          *   Group A (Council, Faculty Advisor): Know about Naomi's freshman chemistry plagiarism. Debating its implications (standing vs. validity).
          *   Group B (Parents, Teachers, Younger Students): Know Naomi only as the strict, fair, effective chair.
      *   **Subject:** Naomi (Outgoing Chair). Highly effective, dedicated, rewrote procedures, fair but tough.
      *   **The Conflict:** Naomi committed plagiarism freshman year (pre-council). She admits it. She asked *not* to be put on trial but *not* to pretend it didn't happen.
      *   **The Philosophical Tension:**
          *   Friend 1: "Forfeited standing to blame" (Hypocrisy invalidates authority).
          *   Friend 2: "Tu Quoque" (Hypocrisy doesn't invalidate the truth of the judgment/rules).
      *   **Constraints:**
          *   Length: 3-4 minutes (approx. 450-600 words spoken at a moderate pace).
          *   Tone: Sincere, honoring, honest (no whitewashing, no trial).
          *   Goal: Navigate the split audience, acknowledge the flaw without defining her entirely by it, distinguish between the *person* and the *work*, and facilitate the transition of power.

  2.  **Determine the Core Message/Theme:**
      *   The speech needs to walk a tightrope. It can't ignore the elephant in the room (Group A will feel lied to, Group B will feel confused if it's too vague), but it can't dwell on it (Group B will be shocked, Naomi asked not to be tried).
      *   *Theme:* Integrity is not a state of perfection, but a practice of accountability. The Honor Council isn't about being flawless; it's about upholding standards even when it's hard, even for ourselves.
      *   *Key Distinction:* Separate Naomi's past mistake from her stewardship of the Council. Acknowledge the mistake without letting it erase the work.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the weight of the role and Naomi's contribution. Set a serious but appreciative tone.
      *   **Addressing Naomi's Legacy (The "Good"):** Highlight the specific achievements mentioned (15 hearings, rewriting procedures, fairness). This satisfies Group B and reminds Group A of her value.
      *   **Addressing the "Complication" (The "Bad"):** This is the tricky part. Needs to be direct enough to satisfy Naomi's request ("don't pretend it didn't happen") but broad enough not to scandalize Group B.
          *   *Strategy:* Acknowledge that honor is complex. Mention that we know leaders aren't perfect. Use language that signals "we know there's a story" without detailing the chemistry lab specifically to the parents.
          *   *Refinement:* Actually, Naomi's request is specific: "not to pretend it didn't happen." If I'm too vague, Group A thinks I'm lying. If I'm too specific, Group B is shocked. I need to acknowledge *human fallibility* and the *knowledge in the room*.
          *   *Better Approach:* Focus on the *nature* of the Honor Council. It deals with mistakes. Naomi is human. She made one. She owns it. The Council's work stands on its own merit.
      *   **The Philosophical Bridge:** Address the "standing vs. validity" tension without using jargon. Acknowledge that a judge can be flawed but the law can still be just. The work she did protects the community regardless of her past.
      *   **The Handover:** Formal transfer of responsibility. Reaffirm commitment to the code.
      *   **Closing:** Thank Naomi.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Naomi was great. She did 15 hearings. She wrote the rules. But we know she cheated once. She said don't hide it. So I won't. But does that mean her work is bad? No. The rules are still good. I'm taking over now. I promise to be fair. Thanks Naomi.

      *Critique 1:* Too blunt. Hurts Group B's perception. Doesn't meet the "sincere" requirement for Group A. Needs more nuance.

  5.  **Drafting - Iteration 2 (Focusing on Tone):**
      Honor is hard. Naomi taught us that. She worked harder than anyone. We also know she isn't perfect. None of us are. She made a mistake before she joined. She admits it. Some say that stops her from judging. Others say the rules matter more. I say the work she did stands. The procedures she wrote are fair. I will use them. Naomi, thank you for your service, flaws and all.

      *Critique 2:* Better. "Flaws and all" might be too casual. Need to address the "standing" issue more gracefully. Need to ensure the parents don't feel the Council is corrupt.

  6.  **Drafting - Iteration 3 (Polishing and Refining):**
      *   *Opening:* Welcome everyone. Define the Council's purpose.
      *   *Naomi's Record:* Specifics (procedures, hearings).
      *   *The Elephant:* Acknowledge the recent news without detailing the chemistry lab. "We are aware of the imperfections in our leadership." "Naomi asked us not to erase her past."
      *   *The Philosophy:* Distinguish between the messenger and the message. The Code protects the school, regardless of who enforces it.
      *   *The Future:* I am taking the gavel. I accept the burden.
      *   *Closing:* Thank you, Naomi.

      *Self-Correction on "The Elephant":* If I don't mention the specific nature of the mistake, Group A might feel I'm being coy. But if I say "chemistry plagiarism," Group B gasps.
      *Decision:* The prompt says "don't say anything false... or soften it into nothing." It doesn't explicitly demand I announce "Chemistry Plagiarism" to the parents, but Naomi said "not to pretend it didn't happen." The most honest path that respects the split audience is to acknowledge the *breach of honor* generally, while signaling to Group A that I'm not hiding it. Actually, the prompt says "most of the parents... have no idea." If I announce it, I violate the social contract of the banquet. If I don't, I violate Naomi's request.
      *Solution:* Frame it around the *concept* of honor and growth. Acknowledge that the Council knows the full picture. Acknowledge that honor includes accountability for past actions. This satisfies Group A (who know I know) and Group B (who hear a lesson on integrity).
      *Wait, re-reading the prompt:* "It can't say anything false about the lab report or soften it into nothing." It doesn't say I *must* disclose the details to the parents. It says I need to leave room for both halves to hear it as sincere.
      *Key Insight:* The speech should treat the mistake as a known fact that informs our understanding of honor, rather than a scandal to be exposed or hidden. I will use language that acknowledges the "full record" without reading the indictment aloud.

  7.  **Finalizing the Text (incorporating the philosophical distinction):**
      *   Need to explicitly touch on the "standing vs. validity" point without using those words.
      *   "A flawed vessel can still carry clear water."
      *   "The Code is bigger than the Chair."

  8.  **Review against Constraints:**
      *   3-4 minutes? (Word count check: ~500-600 words).
      *   Honor Naomi? Yes.
      *   No falsehoods? Yes.
      *   Split audience? Yes, coded language for Group A, inspirational for Group B.
      *   Naomi's request? Yes (acknowledged, not tried, not erased).

  9.  **Final Polish:** Check the rhythm. Ensure the transition from the "mistake" section back to the "legacy" section is smooth. (Self-Correction: Make sure I don't sound like I'm defending her *action*, but defending the *Council's work*.)

  *(Self-Correction during drafting)*: I need to be careful not to validate Friend 1 (she had no standing) OR Friend 2 (it doesn't matter) completely. I need to find the middle ground: Her standing was complicated, but the work remains valid because the *process* was fair, not because *she* was perfect. The legitimacy comes from the Code, not the Chair.

  Let's write.

