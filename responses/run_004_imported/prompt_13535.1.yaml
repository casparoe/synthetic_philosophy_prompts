prompt: |-
  My aunt Miriam, a philosopher of mind who spent the better part of thirty years defending illusionism about phenomenal consciousness, died two weeks ago, and I've been asked to deliver the eulogy at her memorial service this coming Sunday. She held what Keith Frankish, who coined the distinction, calls "strong" illusionism, the harder-line descendant of Dennett's older attacks on qualia: not the more cautious view that some deflated phenomenal property survives introspection's distortions, but the claim that there is no phenomenal "something it is like" underneath our self-models at all, just a representational system that models itself as though it had one. She was adamant, though, that this was not eliminativism about the mind in any cheap sense: she thought grief, memory, preference, and attention were all completely real, and she got visibly irritated with colleagues (and with me) whenever they heard "illusionism" and assumed she must think nothing really matters, or that she considered herself a zombie. Two nights before she died, half-joking, she made me promise that nobody would stand up at her funeral and talk about her "inner light going out," or claim that some ineffable spark of "what it was like to be Miriam" would live on in our memories -- because, as she put it, that would smuggle back in, on her own funeral day, exactly the picture of consciousness she had spent her career arguing was a cognitive illusion. (She used to make the same point in long comment-section arguments I read as a teenager, which is a fair amount of why I've spent the years since as a fairly devoted lurker on Less Wrong and the old Slate Star Codex threads.)

  The room on Sunday will be mostly family and old friends with no philosophical background who just want to grieve a warm, funny, exacting woman, but four or five people from her department are coming too, including the qualia realist she sparred with happily for two decades and plainly adored arguing with. I'd like the eulogy to actually honor her position rather than sand it down into generic materialism, while still functioning as a eulogy and not a seminar: it needs to let people cry and laugh and feel the size of what's gone, without either quietly contradicting something she considered a serious philosophical error, or spending its first ten minutes throat-clearing about the hard problem in a way that strands everyone who isn't already fluent in it. Could you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt Miriam, a philosopher of mind.
      *   **Key Philosophical Stance:** Strong Illusionism about phenomenal consciousness (Keith Frankish's distinction). She believed there is no "what it is like" (qualia), only a representational system modeling itself as having one.
      *   **Nuance:** Not eliminativism about mental states (grief, memory, preference are real). She hated being called a zombie or accused of thinking nothing matters.
      *   **Specific Constraint:** She made the narrator promise *no* talk of her "inner light going out" or an ineffable spark living on. That would contradict her life's work.
      *   **Audience:** Mixed. Mostly family/friends (non-philosophers) who want to grieve a warm, funny woman. A few colleagues (including a friendly rival/qualia realist).
      *   **Goal:** Honor her position without turning it into a seminar. Allow for grief and laughter. Avoid contradicting her philosophy, but don't alienate the non-philosophers.
      *   **Tone:** Warm, exacting, funny, respectful, intellectually honest but accessible.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Trap:* Eulogies traditionally rely on the language of spirit, essence, inner light, and "what it was like to be them." Miriam explicitly forbade this.
      *   *The Solution:* Focus on the *real* things she affirmed: behavior, memory, impact, relationships, arguments, and the causal power of her mind. Grief is real, even if qualia aren't. The *pattern* of Miriam survives, even if the "ghost in the machine" didn't exist to begin with.
      *   *The "Hard Problem" Avoidance:* Don't define illusionism technically. Show it through her life. Show how she loved, argued, and lived *as if* it mattered (because for her, it *did* matter, just not for metaphysical reasons).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Set the scene. Mention the promise. This immediately signals to the colleagues that "we know," and signals to the family that "this is unique to her."
      *   **Addressing the Philosophy (Gently):** How to explain illusionism without jargon? Use the "user interface" metaphor or simply focus on the reality of her actions. *Decision:* Focus on the reality of her *impact*. She believed grief is real. That's the anchor for the mourners.
      *   **Personal Memories:** Need to show her warmth and exacting nature. The prompt mentions she was "warm, funny, exacting." Need an anecdote. Maybe about her correcting someone lovingly, or a shared moment of skepticism. The prompt mentions the narrator is a Less Wrong lurker because of her. That's a great bridge.
      *   **The Colleagues/Rival:** Acknowledge the friendly adversary. This humanizes the academic side. It shows she loved the *process* of truth-seeking, not just winning.
      *   **The Constraint (The "Inner Light"):** Address the promise directly but poetically. Instead of "light going out," talk about the "model updating" or the "silence of the argument." *Better:* Talk about the *absence* of the illusion, but the *presence* of the loss. The loss is real, even if the "feeling" of loss is a complex computational state.
      *   **Closing:** A send-off that respects her view. No "rest in peace" in the spiritual sense. Maybe "rest in accuracy" or simply acknowledging the continuity of her influence.

  4.  **Refining the Tone:**
      *   *Risk:* Sounding too cold/robotic.
      *   *Mitigation:* Emphasize that for Miriam, *love* was a functional reality. The fact that she cared about this distinction proves she cared about truth.
      *   *Key Phrase:* "She didn't think grief was an illusion. She thought grief was one of the realest things there is." (This is crucial for the family).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi, I'm the nephew/niece.
      *   Miriam made me promise not to talk about her soul.
      *   She thought consciousness was a trick.
      *   But she loved us really.
      *   Remember when she argued with Dave?
      *   I learned to think clearly from her.
      *   She's gone now. The machine stopped. But we remember her.
      *   Goodbye.

      *Critique 1:* Too blunt. Needs more poetry. Needs to weave the philosophy into the emotion.

  6.  **Drafting - Iteration 2 (Adding Texture):**
      *   Start with the promise. It's a hook.
      *   Explain that she wasn't denying *us*, just a specific metaphysical picture.
      *   Talk about her laugh. Was the laugh real? Yes, functionally.
      *   Talk to the rival, Professor X. You miss the sparring.
      *   Talk to the family. You miss the hugs. Both are valid.
      *   End with the idea that the *story* of Miriam continues.

  7.  **Final Polish (incorporating specific constraints):**
      *   Ensure "strong illusionism" isn't namedropped unnecessarily, but the *concept* is clear.
      *   Make sure the "no inner light" promise is central but handled tenderly.
      *   Ensure the Less Wrong/SSC connection is subtle (shows the narrator's bond).
      *   Check the emotional arc: Confusion -> Understanding -> Grief -> Acceptance.

  8.  **Writing the Eulogy (incorporating the "Voice"):**
      *   *Voice:* Intelligent, grieving, respectful, slightly wry (honoring her humor).
      *   *Specific line to include:* "She didn't believe in the ghost, but she believed in the machine."
      *   *Handling the Rival:* "Dave, she loved your objections more than your agreements."
      *   *Handling the Family:* "If you feel pain, that pain is real data."

      *(Self-Correction during drafting)*: I need to be careful not to make the family feel like *their* grief is an illusion. Miriam believed the *state* of grief is real, only the *qualitative feel* (the "ouchiness" as a non-physical property) is the illusion. I must phrase this carefully. "The loss is real." "The impact is real."

      *Revised Plan:* Focus on *causal power*. Miriam changed the world. That change persists. That is her immortality, compatible with her philosophy.

  9.  **Final Review against constraints:**
      *   No "inner light"? Check.
      *   No "what it was like"? Check.
      *   Honors strong illusionism? Check.
      *   Accessible to family? Check.
      *   Honors the rival? Check.
      *   Emotional resonance? Check.

      *(Final thought on the ending)*: Don't say "she lives on in our hearts" (too qualia-heavy). Say "she lives on in our models" or "in how we think." Let's go with "in the structure of how we think now."

      *Wait, one more thing:* The prompt mentions she got irritated when people thought she was a zombie. I need to emphasize her *passion*. Illusionists are often accused of being dry. She wasn't.

      *Okay, ready to write.*
answer: |-
  Thank you all for coming.

  For those who don't know me, I'm [Your Name], Miriam's nephew/niece.

  Standing here, I am acutely aware that I am navigating a minefield. Not the usual kind—the kind made of awkward silences and suppressed tears—but the kind Miriam spent thirty years mapping. She made me promise, two nights before she died, that I would not stand up here and talk about her "inner light" going out. She made me promise not to tell you that some ineffable spark of "what it was like to be Miriam" is now floating in the ether, or living on in our memories.

  To say that would be, in her view, to tell a comforting lie. It would be to smuggle back in, on her own funeral day, the very cognitive illusion she dedicated her life to dismantling.

  So, I will keep that promise. But I also know that most of you are not here to think about the Hard Problem of Consciousness. You are here because you loved a warm, funny, exacting woman who made the best lasagna in the tri-state area and who could dismantle your arguments while simultaneously refilling your wine glass.

  And this is where I need to speak to the family and friends first, because I know how this sounds. I know that when people heard Miriam's work, they sometimes worried she thought *nothing* mattered. That if there was no "magic spark," then love was just chemistry and grief was just a glitch.

  Nothing could have been further from the truth. Miriam did not believe that grief was an illusion. She believed grief was one of the realest things there is.

  She believed that the machinery of the mind—the memories, the preferences, the attachments, the deep, complex processing of another human being's absence—that all of that is real. Causally powerful. Physically grounded. She didn't think she was a zombie; she thought she was a person who refused to pretend she understood the dashboard instruments better than she did.

  She taught me that you don't need a ghost in the machine to make the machine matter.

  I learned this young. I was a teenager, lurking on internet forums she posted on, reading threads where she would spend hours patiently explaining that just because pain *feels* like a simple, indivisible thing, doesn't mean it *is* one. But then I'd look up from the screen, and she'd be in the kitchen, burning the toast because she was too engrossed in a conversation about my day, or crying over a movie, or laughing until she couldn't breathe at a joke I'd made.

  If that was an illusion, it was a magnificent one. It was robust. It was interactive. It was love.

  To her colleagues here, especially Dave: I know you lost your favorite sparring partner. I know you spent twenty years trying to find the crack in her armor where the qualia might hide. She adored those arguments. She didn't see them as battles to be won, but as a collaborative effort to keep the thinking honest. She respected your realism because it kept her illusionism sharp. I think the best way to honor her is not to concede, but to continue the argument. Write the paper. Make the point. She would be irritated if you stopped challenging her, even now.

  But to the rest of us, who just miss her:

  Miriam believed that we are storytelling engines. We model ourselves, we model each other, and we weave those models into a shared reality. In that sense, she is still here. Not as a spirit, but as a structure.

  The way I pause before accepting a claim as true? That's Miriam.
  The way my mother checks to make sure everyone has eaten before sitting down herself? That's Miriam.
  The specific, skeptical raise of an eyebrow that my cousin just did when the officiant started speaking? That is pure Miriam.

  She argued that consciousness is a user interface. A way for the brain to present complex data to itself in a manageable form. If that is true, then her interface is closed. The process has halted. But the data she wrote into us remains. The code she helped debug in our own lives is still running.

  She didn't want us to pretend she was somewhere else. She wanted us to acknowledge that she was *here*, and now she is *not*, and that the difference is significant, and painful, and real.

  So, we will not speak of her light going out, because she didn't believe she was a lamp. We will not speak of her spirit living on, because she believed she was more durable than that. She was a cause. She was a set of actions and words and arguments that changed the shape of the world around her.

  And that shape remains.

  Miriam, you were right about the error. But you were also right about the grief. We are processing your absence. The model is updating. And it hurts.

  Thank you for teaching us how to think. Thank you for teaching us that being real doesn't require being magical. And thank you for the thirty years where you modeled, so perfectly, what it looks like to live a life of rigorous, compassionate truth.

  We will miss you. Accurately.
