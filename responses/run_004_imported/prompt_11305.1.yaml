          *   So in Choice 1, they sacrifice EV for safety. In Choice 2, they sacrifice safety (probability of winning) for EV.
          *   The contradiction is that the "safety premium" required in Choice 1 is mathematically incompatible with the "safety discount" accepted in Choice 2 under a single utility function.

