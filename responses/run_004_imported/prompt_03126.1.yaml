  9.  *(Self-Correction during drafting)*: Make sure to address the hypothetical about the host having a good track record. Even then, without a mechanism, it's overfitting or luck. A model explains *causality* (or correlation), a track record alone does not.

  10. **Final Review against constraints:** The user wants to understand "what is genuinely at stake." Focus heavily on the value of *explanation* and *reliability* over *coincidence*.

