          *   *No Online Learning:* Inference is static.
          *   *No Access to Reward:* The reward model is external during training, absent during inference.
          *   *Objective Mismatch:* RLHF optimizes for *helpfulness/harmlessness* as judged by a model/human, not a raw scalar signal the AI can touch.
      *   **Discuss "Inner Alignment" / "Reward Tampering":** Confirm that this *is* a huge topic in AI safety (instrumental convergence, mesa-optimizers). It's not ignored, but it's categorized as a risk for *future* agentic systems, not current chatbots.
      *   **The "Why Not Certainty?" Argument:**
