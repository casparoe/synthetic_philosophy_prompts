answer: |-
  This is a compelling reading of Gödel's philosophical architecture, and you are correct to identify the Leibnizian *Principle of Sufficient Reason* (PSR) as the load-bearing wall for both his ontological proof and his views on immortality. However, elevating the immortality argument to the status of a rigorous corollary comparable to the Incompleteness Theorems encounters significant obstacles, both logical and historiographical.

  To treat the immortality argument as a formal corollary of the ontological proof requires bridging a gap that Gödel himself never formally closed. Here is why the distinction historians maintain is not merely dismissive, but logically necessary.

  ### 1. Formal Validity vs. Metaphysical Inference
  The primary distinction lies in the modality of the arguments. Gödel's Ontological Proof (found in his *Nachlass*) is a formal derivation within a system of modal logic (specifically resembling S5). It proceeds from defined axioms regarding "positive properties" to a conclusion of "necessary existence." While the axioms themselves are philosophically contestable (as noted by critics like Howard Sobel or Manuscrito), the *deductive structure* is formalizable and checkable.

  The argument for immortality, by contrast, is teleological and ethical rather than strictly logical. It appears primarily in his conversations with Hao Wang and private letters, positing that a rational world order would not waste a developed personality. To make this a rigorous corollary of the Ontological Proof, one would need to formalize additional axioms such as:
  1.  *God is just.*
  2.  *Justice requires the preservation of personality.*
  3.  *Death constitutes a waste of personality.*

  These are theological and ethical premises, not logical ones. While they fit comfortably within Gödel's Leibnizian worldview, they do not follow from the definition of a "God-like being" possessing "positive properties" without importing substantial external value judgments. In logical terms, the immortality argument is an *enthymeme* (an argument with unstated premises), whereas the Ontological Proof attempts to be a complete formal derivation.

  ### 2. Gödel's Epistemological Caution
  You note that Gödel withheld the Ontological Proof until he judged it "watertight." It is crucial to nuance this. Gödel's hesitation was not solely due to logical doubt, but due to a fear of *sociological* misunderstanding. He told Hao Wang that he did not want to be thought of as a religious maniac; he wanted the proof to be judged on its logical merit, independent of his belief.

  However, there is no evidence Gödel ever attempted to formalize the immortality argument with the same scrutiny. He treated the Ontological Proof as a piece of logic that happened to have theological implications. He treated the immortality argument as a philosophical conviction supported by the rationality of the universe. For Gödel, the PSR guaranteed that the world was intelligible, but moving from "the world is intelligible" to "I will live forever" requires a leap from epistemology to soteriology. Gödel was precise enough to know that this leap was not a matter of symbolic logic.

  ### 3. The "Incompleteness" Standard
  Your suggestion asks if the argument should be considered "rigorous in the same sense as the incompleteness theorems." This sets an exceptionally high bar. The Incompleteness Theorems are arithmetical truths derived within formal systems that are neutral regarding metaphysics. They hold regardless of whether one is a Platonist, a formalist, or a theist.

  Even the Ontological Proof does not meet the "Incompleteness standard" of universal acceptance, because it relies on intensional logic and contested metaphysical definitions (e.g., what constitutes a "positive property"). If the Ontological Proof itself is viewed by logicians as a fascinating exercise in modal logic rather than a settled theorem like Incompleteness, the immortality argument—which relies on the Ontological Proof *plus* ethical axioms—cannot claim that status. To treat it as a rigorous corollary would be to conflate Gödel's *mathematics* with Gödel's *metaphysics*.

  ### 4. Historiographical Necessity
  Historians of logic treat the immortality argument as a biographical footnote not because they dismiss Gödel's intelligence, but because the *evidence base* differs.
  *   **Incompleteness:** Published, peer-reviewed, verified.
  *   **Ontological Proof:** Manuscript notes, formal symbols, shown to Scott.
  *   **Immortality:** Anecdotal records (Wang), private letters, informal reasoning.

  To elevate the immortality argument to a formal corollary would require a manuscript that does not exist. It would require Gödel to have axiomatized "value" and "personality" in the same way he axiomatized "positivity" and "essence." Since he did not, treating it as a formal proof would be an act of reconstruction that risks projecting a systematic coherence Gödel may not have intended.

  ### Conclusion
  You are right that the two arguments are stages of one continuous *philosophical* project. They are unified by Gödel's conviction that the universe is rational, benevolent, and structured by the PSR. However, they are not stages of one continuous *deductive* project.

  The Ontological Proof attempts to be a machine that turns definitions into existence. The immortality argument is a hope that the machine produces a benevolent output. While the latter is consistent with the former within Gödel's specific Leibnizian framework, it lacks the formal scaffolding to be considered a rigorous logical corollary. It remains, as historians suggest, a vital key to understanding Gödel the *philosopher*, but it cannot be adjudicated by the standards of Gödel the *logician*.
