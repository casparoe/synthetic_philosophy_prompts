              *   Can a mix of A and B dominate C?
              *   Let $\sigma_1 = pA + (1-p)B$.
              *   Payoff against X: $3p + 0(1-p) = 3p$.
              *   Payoff against Y: $0p + 3(1-p) = 3 - 3p$.
              *   We need $3p > 1$ AND $3 - 3p > 1$.
              *   $3p > 1 \Rightarrow p > 1/3$.
              *   $3 - 3p > 1 \Rightarrow 2 > 3p \Rightarrow p < 2/3$.
