      *   **Definition Check:** Distinguish between "Poset is a chain" vs. "Subset is a chain."
      *   **Applying to Vector Spaces:** Walk through the specific sets.
      *   **The "Why":** Explain that Zorn's Lemma is the tool used *because* the set isn't totally ordered (to find a maximal element amidst the branching).
      *   **Summary:** Reiterate that the hypothesis is a local condition (on subsets), not a global condition (on the whole set).

