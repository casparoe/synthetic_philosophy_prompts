prompt: |-
  On several old Overcoming Bias and LessWrong threads about decision theory under unbounded gambles, I keep running into people gesturing at the "Pasadena paradox" as some sort of nastier cousin of the St. Petersburg paradox, without ever quite explaining why it's supposed to be worse. As I understand the two cases: in the classic St. Petersburg game, a fair coin is tossed until it first lands heads, and you're paid 2^n if the first heads occurs on toss n; the expected payoff is a divergent sum of positive terms, so it comes out unambiguously infinite, and there's a familiar toolkit for defusing the resulting puzzle — bounded utility functions, diminishing marginal utility of money, objections from the counterparty's necessarily finite wealth, and so on. Nover and Hájek's Pasadena game instead pays (-1)^(n+1) × 2^n⁄n if the first heads occurs on toss n, so the terms of the expectation alternate in sign and sum to the alternating harmonic series, which converges to ln 2 only conditionally, not absolutely. Since the series isn't absolutely convergent, Riemann's rearrangement theorem tells us that reordering the very same underlying outcomes lets you make the "expected value" equal any real number you like, or diverge to positive or negative infinity, or oscillate without ever settling on a value.

  I'd like you to compare the two paradoxes properly, rather than treating Pasadena as just "St. Petersburg, but weirder." Please explain precisely why an expectation that is undefined by rearrangement constitutes a different, and arguably deeper, kind of problem than one that is merely infinite, and then assess whether the standard rescues for St. Petersburg — bounding utility, invoking finite wealth, or simply refusing to take unbounded gambles seriously — do anything at all to help with Pasadena. Close with a clear, justified verdict: which of the two paradoxes poses the more serious threat to someone committed to maximizing expected value, and why?
reasoning: |-
  Here's a thinking process that leads to the comparison and verdict on the St. Petersburg and Pasadena paradoxes:

  1.  **Deconstruct the Request:**
      *   **Topic:** Decision theory under unbounded gambles, specifically comparing the St. Petersburg paradox and the Pasadena paradox.
      *   **Core Task:** Explain *why* Pasadena is considered "nastier" or a "deeper" problem than St. Petersburg, focusing on the nature of the expectation (infinite vs. undefined/rearrangement-dependent).
      *   **Assessment:** Evaluate standard "rescues" for St. Petersburg (bounded utility, finite wealth, rejection of unbounded gambles) against Pasadena.
      *   **Verdict:** Conclude with a justified verdict on which poses the more serious threat to Expected Value (EV) maximization.
      *   **Tone:** Analytical, precise, philosophical but grounded in the math (Overcoming Bias/LessWrong style).

  2.  **Analyze the St. Petersburg Paradox (SP):**
      *   *Structure:* Coin toss $n$ until Heads. Payoff $2^n$. Probability $1/2^n$.
      *   *Expectation:* $\sum (1/2^n) \cdot 2^n = \sum 1 = \infty$.
      *   *Nature of the problem:* The sum diverges to positive infinity. It's "too big."
      *   *Intuition clash:* People won't pay much to play, despite infinite EV.
      *   *Standard Solutions:*
          *   Bounded Utility (Bernoulli): $U(money) = \log(money)$. Sum becomes $\sum (1/2^n) \cdot n$, which converges.
          *   Finite Bankroll: The casino can't pay $2^{100}$. Truncates the series.
          *   Time/Resource constraints.

  3.  **Analyze the Pasadena Paradox (PP):**
      *   *Structure:* Coin toss $n$ until Heads. Payoff $(-1)^{n+1} \frac{2^n}{n}$. Probability $1/2^n$.
      *   *Expectation:* $\sum (1/2^n) \cdot (-1)^{n+1} \frac{2^n}{n} = \sum \frac{(-1)^{n+1}}{n}$.
      *   *Nature of the problem:* This is the alternating harmonic series. It converges *conditionally* to $\ln(2)$ *if* summed in the natural order ($n=1, 2, 3...$).
      *   *The Catch:* In probability theory, expectation is defined via integration over the measure space. For discrete variables, it's $\sum p_i x_i$. However, the definition of the sum for infinite series requires *absolute* convergence to be well-defined independent of ordering. If $\sum |p_i x_i| = \infty$ (which it is here, harmonic series), the expectation is technically *undefined* in standard measure theory (Lebesgue integration requires absolute integrability).
      *   *Rearrangement:* Riemann Rearrangement Theorem applies. By reordering the outcomes (which shouldn't matter for a set of outcomes), you can make the EV anything.
      *   *Why it's worse:* SP says "Value is $\infty$." PP says "Value is... wait, what order are you counting in?" It attacks the *definition* of expectation itself, not just the magnitude.

  4.  **Compare the "Depth" of the Problem:**
      *   *SP:* The machinery works, but outputs $\infty$. We can argue $\infty$ isn't a real number, or utility isn't linear. The *concept* of EV holds, the *result* is pathological.
      *   *PP:* The machinery breaks. The integral/sum doesn't exist in the Lebesgue sense. The value depends on an arbitrary indexing of outcomes. This undermines the coherence of the EV formalism itself. It's not just that the answer is counterintuitive; it's that there *is no answer* provided by the theory.

  5.  **Evaluate Standard Rescues:**
      *   *Bounded Utility:*
          *   SP: Works perfectly. $\log(2^n)$ makes the series converge absolutely.
          *   PP: If utility is bounded, say $U \in [-K, K]$, then $\sum p_i U(x_i)$ is absolutely convergent (since $\sum p_i = 1$ and $U$ is bounded). So, yes, bounded utility kills Pasadena too.
          *   *Nuance:* Is bounded utility a "rescue" or a "retreat"? If one insists utility *could* be unbounded (e.g., saving lives), PP is a problem. SP is also a problem for unbounded utility, but PP is more structurally damaging.
      *   *Finite Wealth/Bankroll:*
          *   SP: Truncates the series. EV becomes finite.
          *   PP: Truncates the series. EV becomes a finite sum. Order doesn't matter for finite sums.
          *   *Critique:* Both paradoxes rely on idealized infinite scenarios. If you reject the physical possibility of infinite payouts/steps, both vanish. But as *theoretical* challenges to decision theory axioms, this is dodging the math.
      *   *Refusing Unbounded Gambles:*
          *   Similar to finite wealth. If the domain of the utility function or the probability space is restricted to avoid these tails, the problem disappears.
      *   *Key Distinction:* For SP, one can argue "Infinite EV is okay, I just won't pay infinite money." For PP, one cannot even calculate the EV to make a decision. Dominance arguments fail more spectacularly in PP (Pasadena dominates Altadena in some formulations, yet EV is undefined).

  6.  **Synthesize the Argument:**
      *   *Introduction:* Define both clearly. Acknowledge the user's correct understanding.
      *   *The Core Difference:* Divergence (SP) vs. Undefinability/Conditional Convergence (PP).
      *   *Measure Theory Angle:* Lebesgue integration requires absolute convergence. SP fails this but is "positive infinity." PP fails this and is "undefined."
      *   *Rescue Assessment:* Bounded utility solves both. Finite resources solve both. But if we care about the *principle* of unbounded utility/probability, PP is harder to patch without breaking the linearity of expectation or accepting arbitrary ordering.
      *   *Dominance:* Mention the Altadena variant (Pasadena + 1). Pasadena is dominated by Altadena, yet both have undefined EV. This violates dominance principles more aggressively than SP.
      *   *Verdict:* Pasadena is worse. It attacks the well-definedness of the expectation operator, not just the output value.

  7.  **Refine the Logic (Self-Correction/Nuance Check):**
      *   *Wait, does Bounded Utility actually solve Pasadena?* Yes. If $|U(x)| < M$, then $\sum p_i |U(x_i)| < M \sum p_i = M$. Absolute convergence is guaranteed. So the "rescue" works for both.
      *   *So why is PP worse?* Because if you *allow* unbounded utility (which many rationalists want to, for example, in long-termism or existential risk contexts), SP gives you $\infty$ (which you can handle with extended reals or hyperreals), but PP gives you *nothing*. You can't compare two Pasadena-like gambles. You can't even say one is better than the other if the sums depend on ordering.
      *   *The "Ordering" Issue:* In SP, the terms are all positive. Order doesn't change the divergence to $+\infty$. In PP, order changes the value. But in a probability space, outcomes are a set. There is no "natural order" inherent to the set of outcomes, only the indexing we impose. If the EV depends on indexing, EV is not a function of the gamble alone.
      *   *LessWrong Context:* Acknowledge the rationalist community's focus on this (Bostrom, Beckstead, etc.). They care about unbounded utility for existential risk. PP is a bigger threat to long-termism than SP.

  8.  **Drafting the Response:**
      *   *Structure:*
          1.  Mathematical Distinction (Divergence vs. Undefinability).
          2.  The Measure-Theoretic Crisis (Lebesgue vs. Riemann/Conditional).
          3.  Assessment of Rescues (Bounded Utility, Finite World).
          4.  The Dominance Problem (Altadena).
          5.  Final Verdict.
      *   *Tone:* Rigorous, clear, addressing the "why it's worse" prompt directly.

  9.  **Final Polish:** Ensure the distinction between "infinite" and "undefined" is sharp. Emphasize that SP is a problem of *valuation* (how much is $\infty$ worth?), while PP is a problem of *coherence* (what does the value even mean?).

  **(Self-Correction during drafting):** Make sure to mention that standard probability theory (Kolmogorov) actually *defines* expectation only for absolutely convergent series (or non-negative ones). So technically, in rigorous math, Pasadena has *no* expectation. St. Petersburg has an expectation of $+\infty$ (for non-negative variables). This is a crucial technical distinction. SP is a valid random variable with infinite mean. PP is a random variable where the mean is undefined.

  10. **Final Verdict Formulation:** Pasadena is the more serious threat because it renders the expectation operator inoperative for a class of gambles, whereas St. Petersburg merely stretches it to a limit.

  (Proceed to generate output based on these thoughts.)
answer: |-
  You have correctly identified the mathematical skeleton of both paradoxes, but the intuition behind why the Pasadena paradox is considered "nastier" requires digging into the measure-theoretic foundations of expected value (EV) and what it means for a decision theory to be *coherent*.

  Here is the precise comparison, an assessment of the standard rescues, and a verdict on which paradox poses the greater threat to expected value maximization.

  ### 1. The Core Distinction: Divergence vs. Undefinability

  The fundamental difference lies in the status of the expectation operator itself.

  **St. Petersburg (SP): The Problem of Magnitude**
  In the St. Petersburg game, the payoff terms are strictly non-negative. In measure-theoretic probability (the standard Kolmogorov framework), the expectation of a non-negative random variable is *always* well-defined, even if it is infinite.
  $$ E[X] = \sum p_n x_n = \infty $$
  The machinery works perfectly; it simply outputs a value in the extended real numbers $[0, \infty]$. The paradox is purely axiological: it conflicts with human intuition and market behavior. The mathematical object exists; it is just "too big."

  **Pasadena (PP): The Problem of Existence**
  In the Pasadena game, the payoffs alternate in sign. The series $\sum \frac{(-1)^{n+1}}{n}$ converges conditionally to $\ln 2$, but it does **not** converge absolutely ($\sum |\frac{(-1)^{n+1}}{n}| = \sum \frac{1}{n} = \infty$).

  In rigorous probability theory, the expectation $E[X]$ is defined as a Lebesgue integral. For a discrete variable, the expectation is **undefined** unless the series converges absolutely (i.e., $E[|X|] < \infty$). If a series is conditionally convergent, the Lebesgue integral does not exist.
  *   **SP:** The expectation exists and is $+\infty$.
  *   **PP:** The expectation **does not exist.**

  Why is this worse? Because if the expectation does not exist, the central tool of Expected Value Theory is inoperative. You cannot compare the Pasadena game to *any* other game using EV, not even a game that pays \$0. The theory offers no output.

  Furthermore, the Riemann Rearrangement Theorem implies that the "value" of the gamble depends on the order in which you sum the outcomes. But in a probability space, the outcomes form a *set*. There is no intrinsic temporal or causal ordering to the sample space that justifies summing $n=1$ before $n=2$ other than the indexing we arbitrarily imposed. If the value of a gamble depends on an arbitrary indexing of the sample space, the value is not a property of the gamble itself. This attacks the **objectivity** of the valuation, not just its magnitude.

  ### 2. Assessing the Standard Rescues

  Do the standard solutions to St. Petersburg survive the Pasadena attack?

  **A. Bounded Utility Functions**
  *   **St. Petersburg:** If utility $U(x)$ is bounded (e.g., $U(x) < M$), the series $\sum p_n U(2^n)$ converges absolutely because $\sum p_n = 1$. The paradox vanishes.
  *   **Pasadena:** If utility is bounded, the Pasadena payoffs are transformed into a bounded sequence. The expectation becomes absolutely convergent. The paradox vanishes.
  *   **Verdict:** This rescue works for both. However, this is often viewed as a "solution by fiat." Many decision theorists (particularly in long-termist or existential risk contexts) argue that utility *ought* to be unbounded (e.g., the value of saving $n$ lives should scale with $n$). If you insist on unbounded utility to accommodate moral intuitions, **both** paradoxes return, but Pasadena returns as a logical contradiction rather than a counterintuitive infinity.

  **B. Finite Wealth / Bankroll Constraints**
  *   **St. Petersburg:** No casino has infinite money. If the bankroll is capped at $W$, the game truncates at $n \approx \log_2 W$. The EV becomes finite.
  *   **Pasadena:** Similarly, a finite bankroll truncates the series. A finite sum is immune to rearrangement.
  *   **Verdict:** This works for both, but it is a physical objection, not a decision-theoretic one. It admits that EV theory only applies to a restricted domain of "physically possible" gambles. As a theoretical challenge to the *axioms* of rationality, this is dodging the bullet. We want to know if EV maximization is coherent in principle, not just in our specific universe.

  **C. Dominance Principles (The Altadena Variant)**
  This is where Pasadena inflicts the most damage. Consider the "Altadena" game, which is identical to Pasadena but adds \$1 to every payoff.
  *   **Dominance:** Altadena strictly dominates Pasadena (it pays more in every possible outcome). Any rational agent should prefer Altadena.
  *   **St. Petersburg:** If you compare SP to SP + \$1, both have EV $= \infty$. EV theory struggles to distinguish them, but it doesn't contradict dominance; it just lacks resolution.
  *   **Pasadena:** Since the EV of Pasadena is undefined, and the EV of Altadena is undefined (it's just the original series + $\sum 1/2^n$, and the original part is still conditionally convergent), EV theory cannot formally justify preferring Altadena.
  *   **Worse:** Nover and Hájek showed that you can construct variants where one gamble dominates another, yet by rearranging terms, you can make the dominated gamble appear to have a higher "sum" than the dominating one. This creates a direct conflict between the **Dominance Axiom** (if $A$ pays more than $B$ in all states, choose $A$) and **Expectation Maximization**. St. Petersburg does not force this conflict; Pasadena does.

  ### 3. Why Pasadena is a Deeper Threat

  The St. Petersburg paradox suggests that Expected Value Theory might yield **extreme** recommendations (pay any finite price to play). We can handle this by extending the reals, using hyperreals, or accepting that rational agents *would* pay millions if the game were truly offered. It is a paradox of *scale*.

  The Pasadena paradox suggests that Expected Value Theory might yield **no** recommendation, or contradictory recommendations depending on how you count. It is a paradox of *coherence*.

  If you are a committed EV maximizer with unbounded utility:
  1.  **In SP:** You can say, "The value is infinite. I will prefer this to any finite gamble." You have a decision rule, even if it seems crazy.
  2.  **In PP:** You cannot say what the value is. You cannot compare it to a sure \$10. You cannot compare it to another Pasadena-style gamble with different coefficients. The arithmetic of the theory breaks down.

  The Pasadena paradox demonstrates that without absolute convergence, the linearity of expectation ($E[A+B] = E[A] + E[B]$) fails. If linearity fails, the entire algebraic structure of decision theory collapses. You can no longer decompose complex decisions into sums of simpler ones, because the sum depends on the order of decomposition.

  ### Verdict

  **The Pasadena paradox poses the more serious threat.**

  **Justification:**
  The St. Petersburg paradox challenges the *plausibility* of Expected Value Theory (it implies valuations that no human holds). The Pasadena paradox challenges the *mathematical well-definedness* of Expected Value Theory (it implies that for a wide class of unbounded utility functions, the value of a gamble does not exist).

  Standard rescues like bounded utility solve both, but they require abandoning the principle of unbounded value, which is costly for many ethical and rationalist frameworks (e.g., total utilitarianism). If one retains unbounded utility to preserve those frameworks, St. Petersburg remains a manageable anomaly (infinite value), whereas Pasadena renders the decision calculus inoperative (undefined value) and violates dominance principles.

  Therefore, Pasadena is not just "St. Petersburg but weirder"; it is a structural indictment of applying standard summation/integration to unbounded utility spaces without absolute convergence. It shows that the problem isn't just that the numbers get too big, but that the operation of "taking the expectation" ceases to be a function of the gamble itself.
