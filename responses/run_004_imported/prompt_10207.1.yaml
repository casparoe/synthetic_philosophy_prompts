prompt: |-
  My younger sister is getting married in three weeks, and she has asked me, her maid of honor, to give the toast. I have no background in philosophy and no real qualification for the assignment beyond having spent most of the last month reading about it obsessively, because the situation is more delicate than a normal wedding toast. She and her fiancé have written their own vows, and rather than promise anything "till death do us part," they are going to promise to keep choosing each other "for as long as it's true," with a line about renewing the commitment deliberately every year instead of assuming it will simply last. His parents, who are quietly unhappy about this, have told me privately that a promise you can call off isn't really a promise at all, just a report of your current feelings dressed up in wedding language, and that they don't know what the two of them will actually have vowed to each other. My sister's friends, several of whom (myself included) have already watched an unconditional "forever" vow get broken anyway, think the traditional wording is the dishonest one, since nobody can truthfully promise how they'll feel in forty years.

  I keep getting stuck on the same question underneath both complaints: what actually makes a wedding vow binding in the first place, over and above however the two people happen to feel at the moment they say it? I fell down a bit of an internet rabbit hole trying to answer this myself. I found Hume arguing, if I followed him right, that the whole obligation is basically a useful convention we've all agreed to honor rather than anything built into the promise itself; a much older argument, which I think comes from Hobbes, that the entire point of a promise is to hold you to something exactly when you've stopped wanting to do it, since a promise that only counts while you still feel like keeping it isn't doing anything a mere intention wouldn't already do; and then something in a more recent writer named Scanlon about a "principle of fidelity," which seemed to be about the trust and expectations you create in the other person rather than about lifetime guarantees at all. I couldn't work out which of these, if any, would let me say that what my sister and her fiancé are doing at the altar is a real, binding promise, rather than either an empty guarantee or a nice way of describing their current mood.

  Could you write the toast for me? It needs to run five or six minutes out loud, sound like a sister and not a seminar, and actually be funny and warm in the places a wedding toast should be. But somewhere in the middle it has to take on the disagreement directly rather than steering around it: by the end, I want his parents to feel their worry about what a promise even is has been taken seriously, and I want my sister's friends to feel the same, even though I can't honestly end up agreeing with both sides. I would rather you pick a real position and make it work as a toast than have it stay neutral for six minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Maid of Honor (older sister).
      *   **Occasion:** Wedding reception toast.
      *   **Duration:** 5-6 minutes spoken (approx. 750-900 words at a moderate pace).
      *   **Tone:** Funny, warm, sisterly (not academic/seminar-like), but intellectually honest.
      *   **Core Conflict:** The couple is using non-traditional vows ("for as long as it's true," renewed annually) vs. traditional vows ("till death do us part").
      *   **Stakeholders:**
          *   *The Couple:* Believe traditional vows are dishonest/impossible.
          *   *Groom's Parents:* Believe non-traditional vows aren't real promises (just reports of feelings).
          *   *Friends (including MOH):* Believe traditional vows are often broken anyway, so honesty is better.
      *   **Philosophical Underpinning:** The user has read Hume (convention), Hobbes (binding against future desire), and Scanlon (fidelity/trust). The toast needs to pick a *real position* (not neutral) that validates the couple's choice as a *real promise* while acknowledging the parents' concern about binding commitment.
      *   **Goal:** Resolve the tension. Make the parents feel heard (the need for binding obligation) and the friends feel heard (the need for honesty), but ultimately argue for the couple's approach as a *stronger* form of commitment.

  2.  **Determine the Philosophical Stance:**
      *   *Hobbes* is too harsh for a wedding ("holding you to it when you hate it").
      *   *Hume* is too cynical ("it's just a useful convention").
      *   *Scanlon* offers the best path for a wedding toast. The "Principle of Fidelity" suggests that the binding nature of a promise comes from the expectation of trust created in the other person.
      *   *The Twist/Argument:* A promise isn't binding because of magic words ("till death") or external pressure. It's binding because of the *daily act of choosing*. The couple's vow to *renew* the promise annually is actually *more* demanding than a one-time "forever" vow. It requires active participation, not just passive endurance. This addresses the parents' fear (it's not just a feeling, it's a discipline) and the friends' hope (it's honest).
      *   *Key Concept:* "Active Commitment" vs. "Passive Inertia."

  3.  **Drafting - Section by Section:**

      *   **Introduction (1 minute):** Warmth, humor, establishing the relationship. Acknowledge the honor. Break the ice.
      *   **The Elephant in the Room (1.5 minutes):** Address the vows directly but gently. Acknowledge the tension without throwing anyone under the bus. Mention the "rabbit hole" of research (lightly) to show effort but keep it accessible.
      *   **The Philosophical Pivot (2 minutes):** This is the core. Translate the Scanlon/Hobbes/Hume debate into sisterly language.
          *   Address the parents: Yes, a promise needs to hold weight.
          *   Address the friends: Yes, "forever" is unknowable.
          *   The Synthesis: The weight comes from the *renewal*. It's not a "report of feelings." It's a contract to show up and re-sign. That's hard work.
      *   **The Personal Touch (1 minute):** Connect this philosophy to the couple's specific relationship. Show *why* this fits them.
      *   **Conclusion (1 minute):** Raise a glass. Wish them well. Bring it back to love.

  4.  **Drafting - Tone Check:**
      *   *Avoid:* "As Hume said..." or "In philosophical terms..."
      *   *Use:* "I've been thinking..." or "Here's what I realized..."
      *   *Humor:* Self-deprecating about the research, gentle jabs at traditional wedding tropes.
      *   *Warmth:* Focus on love, care, and the future.

  5.  **Drafting - Content Refinement (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Metaphor time. Compare the vows to a subscription service vs. a lifetime purchase. Or a garden vs. a stone monument. Let's go with the "subscription" idea but make it romantic (renewing the lease on a home).
      *   *Critique:* Will the parents be offended?
      *   *Fix:* Explicitly validate their desire for security. Acknowledge that "forever" sounds safer. Then argue that *active choice* is safer than *habit*.
      *   *Critique:* Is it long enough?
      *   *Fix:* Ensure the stories about the sister add length and warmth.

  6.  **Writing the Toast (incorporating the "Scanlon-esque" Fidelity argument):**
      *   *Opening:* Hi everyone, I'm [Name]. I'm the sister. I've been stressed about this speech.
      *   *The Vows:* We need to talk about the wording. I know there are different opinions.
      *   *The Argument:* I read a lot of stuff. Here's the thing: A promise isn't magic. It's about trust. If you promise "forever" but stop trying, the promise is dead. If you promise "today, and again tomorrow," you are doing the work.
      *   *Addressing Parents:* You want to know they are safe. They are. Because they are choosing to check in.
      *   *Addressing Friends:* You want honesty. This is honest.
      *   *Closing:* To the couple.

  7.  **Polishing and Timing:**
      *   Word count check: 800-900 words is usually 5-6 minutes at a speaking pace (130-150 wpm).
      *   Add pauses for laughter/applause.
      *   Ensure the transition from "philosophy" to "love" is smooth.

  8.  **Final Review against Constraints:**
      *   5-6 minutes? (Looks good).
      *   Sound like a sister? (Yes, using "I," personal anecdotes).
      *   Take a position? (Yes: Active renewal is *more* binding than passive permanence).
      *   Address parents and friends? (Yes).
      *   Funny and warm? (Will inject humor in the intro and specific couple anecdotes).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm lecturing the parents. I need to frame their concern as *love* and *protection*, which it is. And frame the friends' concern as *wisdom* from experience. The synthesis is that the couple's vow is a *discipline*.

  Let's write it.

  *Title:* The Annual Renewal.
  *Voice:* Warm, articulate, slightly vulnerable, authoritative but kind.

  *(Drafting mental outline)*
  1. Intro: Nervous MOH, love for sister.
  2. The Vow Controversy: Acknowledge it gently.
  3. The Philosophy (translated): What makes a promise stick?
  4. The Verdict: Renewal is harder than inertia.
  5. To the Couple: Specific praise.
  6. Toast.

  *Let's flesh this out.*
