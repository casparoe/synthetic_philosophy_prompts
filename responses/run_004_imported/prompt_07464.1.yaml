      *   Point 4: Is Mira *mostly* right (+1)? It's a "least bad option" argument. It doesn't prove CEV works, but it defends using it. +1.

      *Wait, one nuance on Point 3.* Josh says "whoever picks it will pick parameters that spit out answers they already like." This implies a human picking parameters. In CEV, the *AI* is supposed to figure out the parameters based on our current vague intuitions. But those intuitions are the input. So the circularity remains. Josh is still right.

      *Wait, one nuance on Point 4.* Mira says "nothing clears it." Moral realists might disagree. But in the context of naturalized agency, she's mostly right. +1 is safe.

      *Missing Section:* Make sure to highlight that CEV is an *alignment proposal*, not a *metaethical proof*. That's the category error driving the fight.

