      *   **Participants:** Josh (critic of CEV regarding Euthyphro) vs. Mira (defender of CEV regarding Euthyphro).
      *   **Task:** Adjudicate the debate move-by-move (4 points).
      *   **Output Format:**
          1.  JSON block with scores for each point (-2 to 2).
