      *   *Observation 2 (Reversal upon removal):* This is a violation of the **Independence of Irrelevant Alternatives (IIA)**.
      *   *The "Deeper" Truth:* The user suspects something fundamental about the nature of aggregating preferences. This points directly to **Arrow's Impossibility Theorem**.

  3.  **Deconstruct the Mathematical/Social Choice Theory:**
      *   **The Points System:** Likely a Borda Count (1st=4 pts, 2nd=3 pts, etc., or similar). Borda Counts are known to be susceptible to IIA violations (cloning/spoiler effects).
      *   **The Cycle:** Proves there is no Condorcet Winner (a candidate who beats everyone else head-to-head).
