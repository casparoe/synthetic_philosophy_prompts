  I've been on a big ancient Greece kick lately and can't stop thinking about the Solon story - after he wrote his reform laws for Athens he got everyone to swear an oath not to touch them for ten years, then he left the country for that whole stretch specifically so nobody, including him, could get pressured into changing anything early. Classic tie-yourself-to-the-mast move. At the same time I've been reading about how Germany's constitution has this "eternity clause" saying core stuff like human dignity and the basic democratic order can NEVER be amended, not by any majority no matter how big, forever - they built it that way on purpose after Weimar got legally hollowed out from the inside. So here's what I keep wondering: would Solon look at that eternity clause as basically his own move but done properly, or would he think the Germans broke the actual principal of what he was doing, since his version had an expiration date and theirs doesn't? Was the ten years plus leaving town just him working around his own particular situation, or is there a real principle buried in there that says permanent, no-exceptions lock-in is actually a mistake? Actually reason it through instead of just giving me a vibe answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Comparison between Solon's self-imposed exile/oath (10-year moratorium on law changes) and Germany's "Eternity Clause" (Article 79(3) of the Basic Law).
      *   **Core Question:** Would Solon view the Eternity Clause as a successful extension of his principle or a violation of it? Is there a principled reason why temporary lock-in (Solon) might be superior to permanent lock-in (Germany)?
