answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a software engineer, which means I spend my life trying to get complex systems to work without crashing. Naturally, that makes me the perfect person to analyze the architecture of a marriage.

  Usually, when we talk about relationships, we talk about "compromise." You know the drill: I want Italian, you want Thai, so we get pizza. Neither party is thrilled, but the conflict is resolved.

  But Rohan and Claire don't do compromise. They do something far more sophisticated. They do what the philosopher Toby Ord calls "moral trade."

  For the half of the room currently scanning their mental bibliographies: yes, I mean exactly what you think I mean. For the rest of you: it means that instead of trying to change each other's minds, they act on what matters most to the *other* person. They maximize each other's happiness, even when they disagree on the principles.

  Their history bears this out almost too neatly. A few years ago, they hit a stalemate. Claire cares deeply about animal welfare; Rohan cares deeply about global poverty. In a normal relationship, they might have argued over who was right. In this relationship, they ran an optimization script.

  Claire agreed to donate a year's savings to a high-impact anti-poverty charity—Rohan's priority. In exchange, Rohan went vegetarian for a year—Claire's priority.

  Now, to the family: I know that sounds transactional. It sounds like a business deal. But look closer. Rohan didn't become a vegetarian because he suddenly thought meat was wrong. He did it because Claire's conscience mattered more to him than his own palate. Claire didn't donate the money because she thought poverty was more important than animals. She did it because Rohan's conviction mattered more to her than her own bank account.

  They didn't change their minds. They changed their lives for each other.

  To Rohan's rationalist friends: You'll recognize this as a Pareto improvement on their joint utility function. They found comparative advantage in their ethics and traded on it.

  To the aunts and uncles: You call it sacrifice. We call it love. It turns out, they are the same variable.

  But this brings me to the question I've been wrestling with while writing this speech. Is a marriage the ultimate moral trade? Or is it the point where trading finally stops?

  In a trade, there are two ledgers. There's "yours" and "mine." There's a counterfactual where I could have kept my money, or you could have kept your burgers. But watching them together, I realize that a successful marriage isn't about keeping the ledger balanced. It's about burning the ledger entirely.

  Moral trade is the bridge you build to get to the other side. It's the rigorous practice of valuing someone else's joy as highly as your own. But once you cross that bridge, you don't keep tolling each other. You stop counting the utility. You stop measuring the sacrifice.

  Rohan, Claire: You have proven that you can negotiate the hardest terms imaginable with integrity and wit. But my wish for you is that you never have to negotiate again. May your utility functions merge so completely that you no longer need to trade, because what is good for one is simply good for both.

  So, if everyone could please raise a glass.

  To Rohan and Claire. May your disagreements remain respectful, your sacrifices remain willing, and your ledger remain forever empty.

  To the happy couple!
