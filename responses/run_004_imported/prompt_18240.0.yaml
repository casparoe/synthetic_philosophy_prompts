answer: |-
  The stamp sat on the blotter, a block of polished walnut and steel, heavy enough to anchor the paper against a breeze that wasn't blowing. Elias looked at it. He looked at the blueprint spread beneath it, the blue lines of the mezzanine railing glowing faintly in the desk lamp's cone.

  The railing was three inches too short.

  The code said forty-two inches. The installed steel measured thirty-nine. It was a fact, like the grain of the wood on the stamp or the hum of the HVAC system cycling on in the ducts above. To note the discrepancy was not to judge it; it was merely to read the numbers. Elias had measured it himself this morning, tape measure clicking softly in the empty theater. *Thirty-nine.* He had written *42* in the logbook.

  He told himself this was a clerical correction. A projection of the intended state. The contractor had promised to swap the cap rail next week, before opening night. The promise existed in an email chain archived on the server. The email was a document. Documents were facts. Therefore, the railing was, in the administrative sense, forty-two inches.

  Elias picked up the pen. It was a rollerball, black ink, cheap, the kind the firm bought by the gross. He held it between his thumb and forefinger. His hand was steady. He was a licensed structural engineer. His license was a piece of paper framed in the hallway, but it was also a property of his body, a way his hand moved when it touched a specification sheet. When he signed, he was not Elias the man who worried about his daughter walking on balconies; he was Elias the Professional Seal. The Seal did not worry. The Seal verified.

  He looked at the discrepancy report on the second page. Item 404: Guardrail Height. Status: *Pending Resolution.*

  *Pending* was a temporal word. It implied a future where the resolution would occur. Elias knew the future was not written. The contractor might go bankrupt. The steel might not arrive. The opening night might happen with the rail at thirty-nine inches. He knew this. He knew it with the same clarity that he knew the ink was black.

  But to dwell on the *might* was to invite the vertigo. If the future was open, then the signature he was about to place was not a verification of a process, but a wager on a outcome. A wager involved a gambler. Elias was not a gambler; he was an engineer. Engineers dealt in loads and tolerances, not bets.

  So he shifted the weight of the thought. It wasn't that he ignored the risk. He acknowledged it, categorized it, and filed it under *Acceptable Variance.* The code allowed for variances if compensated by other safety factors. The floor load was lower than maximum. The egress width was wider than required. One deficit could be balanced by a surplus elsewhere. It was arithmetic. Morality was not arithmetic, but safety was. Safety was numbers. If the numbers balanced, the building stood. If the building stood, no one fell.

  He uncapped the pen. The click was loud in the office.

  There was a flicker, then. A sudden image of a crowd leaning against the rail, champagne glasses in hand, the pressure of bodies translating into pounds per linear foot. He saw the steel groan. He felt the sickening lurch of a fixture giving way.

  He did not push the image away. To push it away would imply it was an intruder, something foreign that needed repelling. Instead, he let the image sit, but he changed its resolution. It became grainy. Distant. Like a scene from a movie he had seen once. In the movie, the railing broke. In this building, the math held. The math held because he was signing. His signature was not just ink; it was a force. It bound the steel to the calculation. By signing, he made the thirty-nine inches function as forty-two.

  This was not magic. It was authority. The state granted him the power to define reality for the purpose of occupancy. If he said it was safe, it was legally safe. And if it was legally safe, and the contractor fulfilled the email promise, then it was physically safe. The chain of logic was unbroken, provided one did not pull too hard on the link between *legally* and *physically.*

  Elias did not pull. He rested his hand on the paper. He felt the texture of the bond, the slight tooth that grabbed the ink.

  He thought about calling the contractor. He imagined the phone ringing in a truck, the foreman answering with grease on his voice. *Yeah, we'll get to it.* Elias could demand it now. He could halt the occupancy. He could freeze the funds. He had the power. He was free to do it.

  The freedom was heavy. It sat on his shoulders like the yoke of the stamp. If he was free to stop it, he was responsible for letting it go. If he chose to sign, he chose the risk. He owned the risk. It would be his fault if the steel sheared.

  To avoid the ownership, he had to become the instrument. He wasn't choosing; he was complying. The schedule demanded it. The investors demanded it. The city's timeline was fixed. If he halted the project, he would be the obstacle. An engineer should not be an obstacle; he should be a conduit. A conduit does not choose the flow; it merely directs it.

  *I am directing the flow,* he thought.

  The thought was soothing. It turned him into a pipe. Pipes do not feel anguish. Pipes do not lie awake wondering if the pressure will hold.

  He moved the pen to the signature line. *Elias Thorne, P.E.* He wrote it quickly. The signature looked like a seismograph reading, a series of peaks and valleys that identified him without spelling him out. It was a logo.

  He set the pen down. He picked up the stamp.

  The ink pad was dry on the edges. He pressed the walnut block down, rocking it slightly to ensure full contact. He felt the resistance of the paper, the give of the blotter. He lifted the stamp.

  *APPROVED.*

  The blue ink was wet. It shone under the lamp. It covered the date. It covered the bottom corner of the railing detail.

  Elias sat back. He waited for the relief. It didn't come. Instead, he felt a strange suspension, a hovering. He knew the rail was thirty-nine inches. He knew he had written *Approved.* These two truths existed in the room simultaneously. They did not cancel each other out. They did not clash. They occupied the same space, like two ghosts walking through the same wall.

  If he fully believed the rail was safe, he would be a fool. If he fully believed the rail was dangerous, he would be a criminal. He was neither. He was a professional. A professional holds the contradiction in tension until the tension becomes structure.

  He stood up. His knees popped. He walked to the window and looked out at the city. The theater was down there, a brick mouth waiting to swallow the crowd. He could see the marquee lights testing, flickering on and off.

  He wondered if he should go back. He could pick up the pen. He could write *VOID* across the blue stamp.

  He didn't move. It wasn't that he couldn't. His legs worked. His hand worked. It was that the moment for *Void* had passed, not because time had moved, but because he had defined the moment as *Past.* The signature was dry. The ink was setting. To void it now would be an act of destruction, not correction. And he was a builder, not a destroyer.

  He told himself this, and he believed it, in the way one believes a story is true while knowing it is fiction. He believed in the necessity of the belief.

  Elias turned off the desk lamp. The office went dark, save for the streetlights bleeding in through the blinds. The blueprint vanished into the black. The stamp was just a shape in the gloom. He put the cap back on the pen. He placed the pen in his breast pocket, over his heart.

  He walked to the door. He locked it. He checked the handle twice.

  In the hallway, the air was cooler. He walked toward the elevator, his footsteps echoing on the tile. He thought about the drive home. He thought about the dinner his wife had made, waiting in the microwave. He thought about the news, the traffic, the weather.

  He did not think about the railing.

  He did not *not* think about it, either. The knowledge was there, in the periphery, like the blind spot in his vision. He knew it was there. He navigated around it. He drove his car, he merged into traffic, he signaled his turns, all while carrying the blind spot as a passenger.

  When the elevator arrived, he stepped in. He pressed the button for the lobby. The doors closed. He watched the numbers light up. 10. 9. 8.

  At 7, he wondered if the contractor had actually ordered the steel.
  At 5, he decided the contractor was reliable.
  At 3, he remembered the email didn't specify a date.
  At L, he decided dates were flexible.

  The doors opened. He walked into the lobby. The security guard nodded. Elias nodded back.

  "Leaving early, Mr. Thorne?"

  "Just finishing up," Elias said.

  It was true. He had finished. The paper was signed. The job was done. The building was safe. The building was risky. The statement was complete.

  He pushed open the glass door and stepped into the night. The air smelled of exhaust and rain. He unlocked his car. He sat in the driver's seat and gripped the wheel. He sat there for a long time, engine off, hands at ten and two. He was ready to drive. He was waiting for permission to turn the key.

  He looked at his hands. They were his hands. They were the hands of an engineer. They were the hands of a man who had just decided that thirty-nine was enough.

  He turned the key. The engine caught. He put the car in drive. He merged into the street, flowing with the traffic, red taillights ahead of him, all moving in the same direction, none of them braking, all of them assuming the road would hold.
