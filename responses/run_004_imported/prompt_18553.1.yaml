      *   *Correction on Common Knowledge:* Alina says "you never get further than a round." Jonah says "months of texting." Jonah is right that repeated announcement *simulates* common knowledge. Alina's point about "I know that you know" is a bit muddled but points to the depth of mutual understanding. I'll give Jonah the technical win, Alina the psychological win.
      *   *Correction on Rationality:* Alina's final point is the strongest. Aumann fails if agents aren't perfect Bayesians. This is the standard critique in behavioral game theory.

