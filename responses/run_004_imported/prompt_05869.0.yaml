answer: |-
  This is a fantastic puzzle, and you are right to feel that algospeak puts pressure on the *static* nature of Lewis's equilibrium analysis without necessarily breaking it. Your advisor might be sick of hearing about it, but from a philosophy of language perspective, this is one of the most fertile natural experiments for Lewisian convention in decades.

  Here is a reconstruction of how Lewis would likely classify algospeak, sticking strictly to the machinery of *Convention* (1969) and "Languages and Language" (1975), followed by where the framework creaks and where Skyrms or Millikan might pick up the slack.

  ### 1. The Lewisian Verdict: Yes, It Is a Convention
  Lewis would almost certainly classify algospeak as a genuine convention, but with specific caveats regarding the definition of the "situation" ($S$) and the population ($P$).

  **The Coordination Problem ($S$)**
  Lewis defines a convention as a solution to a recurrent coordination problem. Your first worry is the adversarial element: *Does the algorithm break the coordination game?*
  For Lewis, the "game" is defined by the payoff matrix. In standard linguistic conventions, the payoff is successful communication. In algospeak, the payoff is *successful communication minus the cost of moderation*.
  *   **Lewis's Move:** The algorithm is not a player in the coordination game; it is part of the *environment* (the state of nature) that determines the payoffs.
  *   **The Situation:** The recurrent situation $S$ is not merely "communicating about death." It is "communicating about death *on Platform X under Moderation Regime Y*."
  *   **The Equilibrium:** As long as using "unalive" yields a higher payoff (communication + no ban) than using "kill" (no communication + ban), and everyone expects everyone else to use "unalive," you have a coordination equilibrium. The fact that the environment is hostile doesn't stop it from being a coordination problem among the *users*. They are coordinating *against* the environment, not against each other.

  **Arbitrariness**
  Lewis requires that there be an alternative regularity $R'$ that could have solved the problem.
  *   **The Worry:** If "kill" gets banned, is "unalive" still arbitrary?
  *   **Lewis's Move:** Yes. "Corn," "seggs," "lebbo," or "un-alive" are all functionally equivalent solutions to the specific constraint of Regime Y. As long as there is more than one euphemism that successfully evades the classifier, the choice among them is arbitrary in the Lewisian sense. The constraint narrows the set of viable equilibria, but it does not reduce it to a singleton (unless the algorithm is perfect, in which case no convention is possible).

  ### 2. Addressing Your Two Specific Blockers

  **Blocker 1: The Churn (Stability vs. Dynamics)**
  You asked: *Does the constantly churning element break the "recurring situation with a stable solution" picture?*
  *   **Lewis's Answer:** No, because Lewisian conventions are *synchronic*.
      Lewis analyzes convention as a state that holds at a time $t$. He acknowledges in Chapter 3 that conventions can change. If the algorithm updates at $t_2$ and flags "unalive," the situation $S$ has changed. The old convention dissolves, and a new coordination problem arises (requiring a new term, e.g., "unalivee").
      For Lewis, the fact that the convention has a short half-life doesn't mean it isn't a convention *while it lasts*. It just means the population is moving through a rapid sequence of distinct Lewisian conventions. The "recurrence" requirement is satisfied if the situation $S$ recurs frequently enough for expectations to form before the algorithm catches up.

  **Blocker 2: Common Knowledge and the "Why"**
  You asked: *Does Lewis's common knowledge condition require people to know why the regularity is in everyone's interest?*
  *   **Lewis's Answer:** No. This is the strongest point in Lewis's favor.
      Lewis requires common knowledge of:
      1.  The regularity $R$ (everyone says "unalive").
      2.  The expectations (everyone expects everyone to say "unalive").
      3.  The preferences (everyone prefers to say "unalive" *if* others do).
      He does **not** require common knowledge of the *etiology* or the *external justification*.
      If a new user joins TikTok and uses "unalive" simply because they think it's the slang term for death, and they expect others to understand it as such, they satisfy the conditions. They prefer to conform because deviating (saying "kill") risks communicative failure or social signaling costs (looking like an outsider), even if they don't know about the algorithm.
      *   **The Caveat:** If the population splits into those who know the *reason* (evasion) and those who don't (slang), Lewis might argue this creates two overlapping conventions or a dialect boundary. But as long as the *behavioral regularity* and *mutual expectations* align, the convention holds. The "rationale" is external to the game; the "preference" is internal.

  ### 3. Where Lewis's Machinery Creaks (The "Bolt-Ons")

  While Lewis can technically classify algospeak as a convention, your intuition that something is missing is correct. Lewis's framework is static, and algospeak is essentially an evolutionary arms race.

  **1. Dynamic Payoffs (The Diachronic Problem)**
  Lewis treats the payoff matrix as fixed for the duration of the convention. In algospeak, the payoff matrix is *endogenous* to the convention's success. The more successful the convention (the more people use "unalive"), the more likely the algorithm is to update and flag "unalive."
  *   **The Lewis Gap:** Lewis has no resources to model a convention that sows the seeds of its own destruction. For him, a convention persists until external conditions change. In algospeak, the *persistence* of the convention is what changes the external conditions.
  *   **The Fix:** This is where **Skyrms** (specifically *Signals: Evolution, Learning, and Information*) is superior. Skyrms models signaling games using evolutionary dynamics (replicator dynamics). He can model the "eavesdropper" (the algorithm) as a selective pressure that changes the fitness of the signal over time. Skyrms explains *how* the convention emerges and dies; Lewis only explains its state while it exists.

  **2. The "Zombie" Users (Function vs. Regularity)**
  Your second worry about users who don't know the *why* touches on **Millikan**.
  *   **The Lewis Gap:** For Lewis, if the regularity and expectations hold, the convention holds.
  *   **The Millikan Fix:** Millikan (*Language, Thought, and Other Biological Categories*) focuses on *proper functions*. The proper function of the signal "unalive" is to evade detection *and* communicate. If a large chunk of the population uses the signal without the capacity to fulfill the evasion function (e.g., they use it in contexts where evasion doesn't matter, or they would be baffled if asked why), Millikan might argue the device is malfunctioning or becoming a "mimic."
      Millikan is better equipped to handle the question: *At what point does the loss of the original rationale degrade the convention into something else?* Lewis is too behaviorist here; Millikan adds the historical/functional layer you feel is missing.

  ### 4. Summary for Your Reading Group

  If you need to present this, here is the distilled Lewisian position:

  1.  **Classification:** Algospeak **is** a Lewisian convention. It is a regularity $R$ in population $P$ in situation $S$ (platform communication under moderation), sustained by mutual expectations and preferences, with arbitrary alternatives available.
  2.  **The Adversary:** The algorithm is part of the *state of nature* defining the payoffs of $S$, not a player in the coordination game. It makes the convention fragile, but not impossible.
  3.  **The Knowledge Condition:** Users do not need to know the *historical reason* (moderation evasion) for the convention to hold; they only need to share the *preference* to conform conditional on others conforming.
  4.  **The Limitation:** Lewis's framework is **synchronic**. It can validate algospeak at time $t$, but it cannot model the *lifecycle* of the convention (the arms race).
  5.  **Recommendation:** Use Lewis to define the *state* of algospeak, but use **Skyrms** to explain its *evolution* and **Millikan** to analyze the degradation of meaning among users who don't know the "why."

  **One final "Lewisian" nuance to throw at your advisor:**
  Lewis distinguishes between *conventions of truthfulness* (language) and *conventions of action* (driving). Algospeak is interesting because it blurs this. It is a linguistic convention (meaning) driven by a practical constraint (action/safety). Lewis might call this a **"pragmatic overlay"** on a linguistic convention. We are adhering to a convention of *which language to use* ($\mathcal{L}_{algospeak}$ vs $\mathcal{L}_{english}$) based on practical constraints, but once we are in $\mathcal{L}_{algospeak}$, the convention of truthfulness applies normally.

  You're not overthinking it; you've found a case where the "common knowledge" condition is technically met but functionally hollowed out. That's a genuine philosophical tension, not just vibes.
