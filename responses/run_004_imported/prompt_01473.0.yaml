      *   *The Intuition:* It feels like *death* for the Original. The Copy is someone else who *thinks* they are me.
      *   *The Argument:* If Relation R were truly "what matters," the Earth-bound Original should feel the same comfort as they would knowing they will recover normally. They don't. They feel terror/regret. Parfit dismisses this terror as irrational, but that begs the question.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Point 1: The Phenomenology of Anticipation.**
