      *   In Branch-Line (no destruction), Relation R holds, Identity does not (because there are two). Parfit says the Original should feel comforted.
      *   *Core Claim:* What matters in survival is Relation R, not Identity.

  3.  **Identify the Weak Point (The Branch-Line Counter):**
