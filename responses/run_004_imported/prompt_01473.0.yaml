          *   The "Special Concern" we have for our own futures cannot be transferred to a distinct spatiotemporal locus, even with perfect psychological copying.

      *   **Point 2: The Asymmetry of Experience (The "Leftover" Problem).**
          *   If Identity = Relation R, then the relationship between Me-Earth and Me-Mars should be symmetrical to Me-Earth and Me-Future (normal survival).
          *   It isn't. In normal survival, there is one stream of consciousness. In Branch-Line, there are two.
          *   The Earth-bound stream terminates. The fact that another stream *starts* doesn't keep *this* stream going.
          *   Parfit treats persons as bundles of relations. But the *subject* of those relations experiences termination.

      *   **Point 3: Begging the Question (Stipulation vs. Explanation).**
