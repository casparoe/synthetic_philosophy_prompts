answer: |-
  This is a profound observation, and you have put your finger on a dynamic that plagues almost everyone working in the public eye today. What you experienced isn't just "negative feedback" in two different flavors; it is two fundamentally different psychological and social phenomena.

  The reason they feel categorically different is that **the pile-on was a status attack, while the colleague's email was a work critique.**

  Here is a breakdown of what is actually going on psychologically and socially, and how you can use that distinction to protect your sanity going forward.

  ### 1. The Mechanism: Shame vs. Guilt
  The most critical distinction is the target of the feedback.
  *   **The Colleague (Guilt):** His email attacked your *work*. He said, in effect, "This argument is flawed, this data is weak, this conclusion is unsupported." This triggers **guilt** (or professional frustration), which is an adaptive emotion. It says, "I made a mistake." Mistakes are fixable. This is why it felt like "being critiqued."
  *   **The Crowd (Shame):** The comments attacked your *credibility and identity*. Even if they didn't say "you are stupid," the subtext of dozens of uncoordinated digs is, "You are out of touch," "You are dangerous," or "You don't belong here." This triggers **shame**. Shame says, "I *am* a mistake." Shame is not fixable; it can only be hidden or defended against. This is why it felt like "being judged."

  ### 2. The Structure: Coherence vs. Chaos
  Your brain processes information differently depending on how it is packaged.
  *   **The Colleague:** He provided a coherent narrative. Premise A, Evidence B, Conclusion C. Your brain can engage with this logically. You can agree, disagree, or nuance it. It is a **dialogue.**
  *   **The Crowd:** This is **noise.** Because they weren't coordinating, you likely received 50 different, contradictory, half-formed objections. Psychologically, this creates a "Gish Gallop" effect. You cannot answer 50 distinct jabs in real-time. When the brain is presented with too many fragmented threats, it stops processing the *content* of the threats and starts processing the *volume* of the threat. It triggers a primal "predator swarm" response. You aren't reading arguments; you are sensing danger.

  ### 3. The Intent: Communication vs. Performance
  This is the hardest pill to swallow, but also the most liberating.
  *   **The Colleague:** He wrote to *you*. He wants you to understand his point. He values the relationship and the truth.
  *   **The Crowd:** They were not writing to *you*. They were writing to *each other*, using you as the prop. When someone leaves a quick dig on a science article, they are often performing virtue for their own social tribe. They are signaling, "Look, I am a person who cares about this health issue." You are not the audience; you are the backdrop. Being ignored by an audience feels bad; realizing you were never the speaker to begin with feels different.

  ### 4. Accountability and Empathy
  *   **The Colleague:** He put his name on it. He has a reputation to maintain. If he is wrong, he loses credibility with you. There is skin in the game.
  *   **The Crowd:** Online deindividuation removes empathy. They don't see a human being; they see a byline. There is no cost to them for being unkind or imprecise. This lack of accountability makes the feedback feel "cheap," which paradoxically makes it sting more because it feels unjust.

  ### How to Handle This Going Forward

  Knowing *why* it hurts differently allows you to change *how* you process it. Here is a framework for handling the "Pile-On vs. Critique" dynamic:

  **1. The "One Expert" Rule**
  Adopt a heuristic: **One email from a qualified peer is worth 1,000 comments from the public.**
  When the pile-on starts, your instinct will be to weigh the volume of negative sentiment. Actively suppress that. Remind yourself: "The crowd is measuring *reaction*; my colleague is measuring *accuracy*." If the colleague says you're right, the crowd is noise. If the colleague says you're wrong, the crowd is irrelevant—you already have the data you need to correct course.

  **2. Reframe the Pile-On as a Metric of Reach, Not Quality**
  In science communication, a pile-on often means you successfully interrupted a narrative people are emotionally invested in. If you wrote something boring that no one read, you would get zero comments. The anger is often a proxy for impact. Try to view the volume of comments as a sign that you touched a nerve, not necessarily that you failed.

  **3. Don't Feed the Shame Spiral**
  When you feel that "judged" feeling rising, recognize it as a shame response. Remind yourself: *"These people do not know me. They are not critiquing my character; they are reacting to a headline."* Separate your professional output from your human worth. The colleague critiqued the output; the crowd is trying to hook into your worth. Don't let them.

  **4. Change Your Engagement Hygiene**
  *   **Delay:** Do not read comments immediately after publishing. Your cortisol is already high; adding noise to that is dangerous.
  *   **Curate:** If possible, have an editor or assistant filter comments for "substantive critique" vs. "drive-by digging."
  *   **Reply to the Signal, Ignore the Noise:** If you feel compelled to engage, reply only to good-faith questions. Do not try to "win" against the pile-on. You cannot logic someone out of a position they didn't logic themselves into, especially when they are performing for an audience.

  ### Summary
  You felt differently because **the colleague treated you like a peer, and the crowd treated you like a symbol.**

  The colleague's email was a gift, even if it was harsh. It was an invitation to improve the work. The pile-on was not feedback; it was weather. It happened *to* you, not *for* you.

  Going forward, when the storm hits, look for the one person holding an umbrella (the expert critique) and ignore the rain. Your job is to write the science, not to manage the emotional regulation of strangers on the internet.
