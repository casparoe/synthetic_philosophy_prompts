answer: |-
  This is a fantastic angle. Most people treat Hobbes's quadrature obsession as a sad footnote to a brilliant career—a case of "even geniuses have blind spots." But if you take his epistemology seriously, as laid out in *De Corpore* and defended in the *Six Lessons*, the mathematical failure isn't incidental. It is a *reductio ad absurdum* of the very mechanism he uses to justify the certainty of *Leviathan*.

  Here is the argument that Hobbes's failure to square the circle actively undermines his claim that civil philosophy can be a demonstrative science.

  ### The Core Thesis
  Hobbes's "maker's knowledge" criterion argues that we have scientific certainty only of things we construct (geometry and the commonwealth). The quadrature disaster demonstrates that **ontological construction does not guarantee epistemic infallibility.** If Hobbes could be demonstrably wrong about an object he claims to construct perfectly (a geometric figure), his claim that we can construct a perfect political science is logically severed from its foundation. The failure reveals that the bottleneck of certainty is not the *object* (which we make), but the *reasoning subject* (who remains fallible).

  ### 1. The Conflation of Definition with Deduction
  Hobbes's argument in the *Six Lessons* rests on the idea that because we define the lines and figures in geometry, we know their causes. Therefore, errors in geometry are impossible for the rational mind. He writes that in civil philosophy, just as in geometry, "the truth of the conclusion is contained in the definition of the terms."

  The circle-squaring fiasco exposes a category error here. Hobbes conflates **generating the premises** with **validating the derivation**.
  *   **In Geometry:** Yes, we define the circle. But the relationship between a circle's diameter and its circumference ($\pi$) is not determined by our definition alone; it is constrained by logical consistency that exists independently of our will. Hobbes could define his terms perfectly and still botch the deduction.
  *   **The Implication:** If "maker's knowledge" guarantees certainty, Hobbes should have been immune to error. The fact that he wasn't proves that constructing the object does not inoculate the mind against logical error.
  *   **Political Application:** In *Leviathan*, Hobbes argues we construct the Commonwealth via covenant, so we can know it scientifically. But even if we grant that the *covenant* is a human artifact (the premises), the *deductions* about sovereignty, obligation, and rights are still subject to human reasoning errors. If Hobbes couldn't track the logical consequences of a circle he "made," why should we trust his tracking of the logical consequences of a Commonwealth he "made"? The "maker's knowledge" criterion secures the *material*, but not the *method*.

  ### 2. The Illusion of Control vs. The Resistance of Reality
  Hobbes loves geometry because, as he says, lines "do not hinder us." They are passive. He contrasts this with natural philosophy, where nature resists our theories. He assumes civil philosophy is like geometry because men, once covenanted, become passive subjects of the Sovereign's will.

  The Wallis controversy shows that **even ideal objects resist.**
  *   **The Mathematical Resistance:** The circle "fought back." Despite Hobbes's insistence, the mathematical reality refused to conform to his construction. This suggests that even in artificial systems, there is a "recalcitrance" to truth that exists outside the maker's will.
  *   **The Political Parallel:** If geometric figures (which are static and silent) can resist Hobbes's reasoning, human beings (who are dynamic and passionate) will resist the "scientific" deductions of the Sovereign far more violently.
  *   **The Undermining:** Hobbes claims civil philosophy is certain because we make the commonwealth. But the quadrature failure shows that "making" something doesn't mean you fully comprehend its properties. A Sovereign might "make" the law, but that does not guarantee the *science* of how that law interacts with human nature is correct. The "maker's knowledge" argument promises a control over politics that Hobbes couldn't even achieve over a diagram.

  ### 3. Certainty as Dogmatism, Not Truth
  Perhaps the most damaging implication is what the controversy reveals about Hobbes's concept of "certainty." For decades, Hobbes remained *psychologically certain* he had squared the circle, despite universal refutation.
  *   **Epistemic Hubris:** This suggests that for Hobbes, "scientific certainty" is not an external validation of truth, but an internal feeling of coherence. He felt he *must* be right because his system was self-consistent, even when it failed externally.
  *   **The Political Danger:** If the "science" of civil philosophy is based on this model, then political certainty becomes indistinguishable from dogmatism. In *Leviathan*, Hobbes wants to end civil war by establishing indisputable truths. But the *Six Lessons* show that his method produces men who *believe* they possess indisputable truth while being objectively wrong.
  *   **The Argument:** A political system built on the claim of "geometric certainty" risks replicating Hobbes's own stubbornness. If the Sovereign claims the same epistemic authority Hobbes claimed over the circle, dissent becomes not just political disobedience, but "mathematical error." The quadrature disaster proves that this claim to authority is fragile. It undermines the *Leviathan* by showing that a "scientific" sovereign might be a dogmatic crank, enforcing errors with the confidence of truths.

  ### 4. The Breakdown of the Analogy
  Finally, the argument strikes at the structural analogy between Geometry and Politics.
  *   **Hobbes's Claim:** Geometry : Civil Philosophy :: Lines : Men.
  *   **The Reality:** In geometry, the "maker" (the geometer) is individual and solitary. In civil philosophy, the "maker" (the commonwealth) is collective (the multitude covenanting).
  *   **The Flaw:** Hobbes failed at geometry *alone*. If a single mind cannot achieve certainty over its own solitary constructions, how can a multitude achieve certainty over a collective construction? The quadrature failure highlights the limitations of the *individual reasoner*. But politics requires the alignment of *many* reasoners.
  *   **Conclusion:** If the individual mind (Hobbes) is prone to delusion even when the object is static and self-made, the collective mind (the State) is exponentially more prone to error when the object is dynamic and other-made (other people). The analogy doesn't just fail; it inverts. Geometry proves the *fallibility* of the maker, which suggests Civil Philosophy must be probabilistic, not demonstrative.

  ### Summary
  The quadrature disaster is not a footnote; it is the crack in the foundation. Hobbes argues that we can have a science of politics because, like geometry, it is a product of human construction. The Wallis controversy proves that **human construction does not preclude human error.**

  By failing to square the circle, Hobbes demonstrated that the "maker's knowledge" criterion provides **ontological access** (we know what the parts are) but not **epistemic security** (we don't necessarily know how they relate). If the "science" of geometry cannot save Hobbes from decades of delusion, the "science" of politics cannot save the Commonwealth from tyranny or error. The *Leviathan* claims to be a machine built of geometric certainty; the *Six Lessons* reveal it is built by a man who couldn't measure his own blueprints.
