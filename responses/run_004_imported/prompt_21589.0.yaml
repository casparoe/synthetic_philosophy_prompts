prompt: |-
  Me and my flatmate had a two hour argument last night about the 'equality of what' debate - she kept bringing up the wheelchair/disability case to say resourcism obviously fails, and I kept coming back with Dworkin's hypothetical insurance market, and neither of us actually won. Anyway I'm interviewing a philosopher next week who defends the capability approach for my podcast, and I dont want it to just be her reciting Sen 101 at me. Can you draft six or seven questions that push past that? I want at least one on whether Sen's refusal to ever fix a canonical list of capabilities (unlike Nussbaum) is a principled feature of the view or just a way of dodging - and what it would actually take for 'public reasoning' to settle a hard case rather than paper over it; one on how she tells a genuinely adapted, deprived preference apart from someone who just values different things, without quietly importing an external welfare standard to make that call; and one on how the approach aggregates across a bunch of non-comparable capabilities for policy purposes instead of collapsing back into a single index, which was sort of the whole point of leaving primary goods behind in the first place. For each one, throw in a sharp follow-up for whatever answer she's likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user had a debate with a flatmate about "equality of what?" (Resources vs. Capabilities). The flatmate argued resources fail (disability case); the user argued Dworkin's hypothetical insurance market. No winner.
      *   **Task:** Draft 6-7 interview questions for a philosopher defending the Capability Approach (CA) for a podcast.
      *   **Constraint 1:** Avoid basic "Sen 101" recitation. Push past introductory level.
      *   **Constraint 2:** Must include specific topics:
          *   Sen's open list vs. Nussbaum's fixed list (principled feature vs. dodge? Public reasoning in hard cases).
          *   Adaptive preferences (distinguishing deprived vs. different values without smuggling in external welfare standards).
          *   Aggregation/Measurement (how to weigh non-comparable capabilities for policy without collapsing back into a single index like primary goods).
      *   **Constraint 3:** Each question needs a sharp follow-up based on the likely answer.
      *   **Tone:** Intellectual, probing, respectful but challenging (suitable for a philosophy podcast).

  2.  **Deconstruct the Required Topics & Brainstorm Angles:**

      *   **Topic 1: The List (Sen vs. Nussbaum).**
          *   *Core Tension:* Sen says "democratic public reasoning" decides the list. Nussbaum says "no, we need a definite constitutional list."
          *   *Critique:* Is Sen's vagueness a bug or a feature? Does "public reasoning" just kick the can down the road when consensus is impossible?
          *   *Follow-up:* If public reasoning fails (polarization), does the theory go silent?

      *   **Topic 2: Adaptive Preferences.**
          *   *Core Tension:* People adjust desires to oppression (happy slave). CA wants to ignore these.
          *   *Critique:* How do you know it's "adaptive" and not just "different values"? If you judge it, aren't you using an external metric (like resources or welfare) you claimed to reject?
          *   *Follow-up:* Is the CA secretly paternalistic?

      *   **Topic 3: Aggregation/Measurement.**
          *   *Core Tension:* CA rejects single metrics (utility, income). But policy needs trade-offs (health vs. education).
          *   *Critique:* How do you trade off without a common denominator? If you create one (HDI), haven't you just reinvented primary goods?
          *   *Follow-up:* Is incommensurability a dealbreaker for real-world implementation?

      *   **Topic 4: The Disability/Resource Critique (Connecting to user's debate).**
          *   *Core Tension:* User defended Dworkin. Flatmate defended CA.
          *   *Critique:* Dworkin's insurance market *tries* to handle disability. Why is CA strictly better? Is the "conversion factor" argument enough to kill resourceism?
          *   *Follow-up:* Does CA actually offer a *metric* for compensation, or just a diagnosis of the problem?

      *   **Topic 5: Responsibility and Choice.**
          *   *Core Tension:* CA focuses on freedom/opportunity. What about bad choices?
          *   *Critique:* If I have the capability to be healthy but choose to smoke, is inequality okay? How does CA distinguish brute luck from option luck without leaning on resourceist accountability?
          *   *Follow-up:* Does CA collapse into luck egalitarianism or does it diverge?

      *   **Topic 6: The "Medium" vs. "End" Distinction.**
          *   *Core Tension:* Resources are means; Capabilities are ends.
          *   *Critique:* Some resources *are* constitutive of freedom (e.g., cash gives immediate agency). Is the dichotomy too sharp?
          *   *Follow-up:* Is there a "capability threshold" where resources become indistinguishable from freedom?

      *   **Topic 7: Global Justice/Scope.**
          *   *Core Tension:* Who owes whom capabilities?
          *   *Critique:* If capabilities are the goal, do borders matter? Is CA inherently more cosmopolitan than resource-based views?
          *   *Follow-up:* How does this handle the "burden" on wealthy nations without a global state?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Drafting Q1 (The List):* Focus on the "dodge" accusation.
      *   *Drafting Q2 (Adaptive Preferences):* Focus on the "external standard" accusation.
      *   *Drafting Q3 (Aggregation):* Focus on the "single index" collapse.
      *   *Drafting Q4 (Dworkin/Resources):* Connect to the user's debate. Challenge the superiority claim.
      *   *Drafting Q5 (Responsibility):* A classic objection to CA.
      *   *Drafting Q6 (Implementation/Political Feasibility):* How does this work in a non-ideal world?
      *   *Drafting Q7 (Metaphysical/Conceptual):* Is "Capability" coherent without defining "Functioning"?

      *Refining for "Sharpness":* Make sure the follow-ups aren't just "Why?" but "If you say X, doesn't that imply Y which contradicts your premise?"

  4.  **Review against Constraints:**
      *   6-7 questions? Yes.
      *   Sen's List included? Yes (Q1).
      *   Adaptive Preferences included? Yes (Q2).
      *   Aggregation included? Yes (Q3).
      *   Dworkin/Resource debate context included? Yes (Q4).
      *   Follow-ups included? Yes.
      *   Tone check: Needs to sound like a knowledgeable host, not a hostile interrogator, but not soft either.

  5.  **Final Polish:** Ensure the philosophical terminology is accurate (conversion factors, functionings, incommensurability, paternalism). Make sure the connection between the user's debate (Dworkin) and the interview is acknowledged to personalize it. (Self-Correction: Ensure I don't answer the questions, just draft them as requested).

  6.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are seven questions designed to move past the introductory textbook definitions and press on the structural tensions within the Capability Approach (CA). They incorporate your specific requirements regarding the list, adaptive preferences, and aggregation, while also leveraging your debate about Dworkin to ground the conversation.

  ### 1. The "Open List" and Public Reasoning
  Sen famously refuses to endorse a fixed, canonical list of capabilities (unlike Nussbaum), arguing instead that the relevant capabilities should be selected through democratic public reasoning. Critics often charge that this is theoretically timid—that it leaves the approach without a critical edge until *after* a consensus is reached. Is this openness a principled commitment to anti-perfectionism, or is it a way of dodging the hard normative work of defining the human good?

  *   **Follow-up:** If public reasoning in a specific society results in a consensus that excludes a capability you deem fundamental—say, reproductive freedom or political dissent—does the Capability Approach have the resources to condemn that outcome from the outside? Or does the theory go silent whenever local reasoning fails?

  ### 2. Adaptive Preferences and the "External Standard"
  A core motivation for the CA is its ability to identify "adaptive preferences"—cases where the oppressed scale down their desires to match their grim reality (the "happy slave" problem). But to identify a preference as "deprived" rather than just "different," you seem to need a benchmark of what a flourishing life looks like. How do you make that distinction without quietly importing an external welfare standard or a resource metric that you claim to have moved beyond?

  *   **Follow-up:** If the answer is that we look at whether the person had *real opportunities* they didn't take, aren't you just shifting the paternalism from the *outcome* to the *opportunity set*? Who decides which opportunities were "real" enough to count as a genuine choice?

  ### 3. Aggregation and Incommensurability
  The move away from primary goods or utility was driven by the idea that human freedoms are qualitatively different and shouldn't be collapsed into a single metric. But policy-making inevitably requires trade-offs. If we have to choose between funding a program that improves mobility for the disabled versus one that improves literacy for the poor, how does the CA aggregate these non-comparable capabilities without constructing a shadow index that functions exactly like the primary goods index we tried to leave behind?

  *   **Follow-up:** If you admit that some weighting is necessary for implementation, doesn't that weighting effectively re-establish a common denominator? And if so, why isn't that common denominator the actual site of justice, rather than the capabilities themselves?

  ### 4. The Disability Objection vs. Dworkin's Insurance
  In resource-based theories like Dworkin's, the disability objection is met with the hypothetical insurance market: we ask what level of compensation people would have insured for behind a veil of ignorance. The CA argues this fails because money can't always solve conversion issues. But Dworkin's model *does* account for differential needs via the insurance payout. What is the *practical* difference in the compensation package? Does the CA actually generate a different distributive outcome, or is it just a different philosophical description of the same payout?

  *   **Follow-up:** If the CA suggests we should provide a wheelchair ramp rather than cash, isn't that a "specific goods" approach that restricts agency more than giving the disabled person the cash equivalent to spend as they see fit?

  ### 5. Responsibility and Option Luck
  The Capability Approach focuses heavily on freedom and opportunity. But this raises the question of responsibility. If two people have the same capability set, but one chooses to gamble their resources on a risky venture and ends up destitute while the other remains secure, does the CA view this inequality as unjust? How do you distinguish between brute luck (which requires redress) and option luck (which doesn't) without leaning on the very resource-accountability models you critique?

  *   **Follow-up:** If you say society should still protect the gambler to maintain their *future* capabilities, doesn't that make the approach insensitive to personal responsibility in a way that violates our intuitions about fairness?

  ### 6. The Means-Ends Dichotomy
  The CA rests on a sharp distinction between means (resources/income) and ends (capabilities/functionings). But in a modern market economy, money is arguably the most versatile "conversion factor" available. At a certain threshold, doesn't the distinction between having the *resource* to do X and having the *capability* to do X collapse? Is the critique of resourcism actually a critique of poverty, disguised as a conceptual innovation?

  *   **Follow-up:** If we accept that cash transfers are often the most efficient way to expand capabilities, does defending the CA become mostly semantic? Why shouldn't we just maximize resources and acknowledge conversion factors as a secondary implementation detail?

  ### 7. Global Justice and Institutional Duty
  Sen frames capabilities as a standard for assessing social arrangements. But in a globalized world, the constraints on a citizen's capabilities often come from external economic structures, not just their domestic government. Does the Capability Approach imply a cosmopolitan duty where wealthy nations are directly responsible for the capability shortfalls of citizens in other states? Or is the duty bounded by the nation-state?

  *   **Follow-up:** If the duty is cosmopolitan, how do you avoid the "demandingness objection"—that citizens of wealthy nations are perpetually unjust until global capability gaps are closed? If the duty is bounded, aren't you accepting that arbitrary borders determine the scope of justice, which seems to undermine the universalism of the human capabilities themselves?
