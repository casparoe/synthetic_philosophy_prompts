      *   *Crucial Distinction:* It's not just *technical* inexplicability (too complex to trace); it's *principled* inexplicability (no concept exists to capture the rule).
      *   *Newton vs. Homer:* Newton *could* explain because science operates via determinate concepts. Homer *couldn't* because art operates via aesthetic Ideas which exceed concepts.

  4.  **Evaluate AI against the Marks (Holistic Approach):**
      *   *Mark 1 (Originality):* AI produces novelty. But is it "original" in Kant's sense? Kantian originality requires *intentionality* directed at aesthetic Ideas. AI produces statistical variance.
      *   *Mark 2 (Exemplarity):* AI outputs can be beautiful. But do they serve as a *standard* for others? Who is the "other"? Another AI? A human? If a human imitates the AI, is that art?
      *   *Mark 3 (Inexplicability):* This is the user's main sticking point.
