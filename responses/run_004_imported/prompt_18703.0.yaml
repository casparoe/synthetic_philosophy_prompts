answer: |-
  The tablet on the table glowed with a single, pulsing amber dot. It represented the Auditor. It wasn't moving toward him; it never moved toward him. It simply appeared where he was going to be.

  Elias sat in the dim light of his safehouse, the rain drumming a frantic rhythm against the reinforced glass. On the screen were two options, the only two viable coordinates left in the sector: *Stay* or *Transit*.

  If he stayed, he remained in the concrete shell of the safehouse. If he chose Transit, a shuttle would arrive in twenty minutes to take him to the orbital lift. Either way, the Auditor would be there. The system was perfect. It didn't chase; it intercepted. It calculated the outcome of Elias's decision-making process before Elias himself had finished weighing the pros and cons.

  Elias rubbed his face. His hands were shaking. He had spent three years running, but he had finally cornered himself in this logical trap. He understood the mechanics now. The Auditor wasn't a hunter; it was a mirror.

  "Okay," Elias whispered to the empty room. "If I decide to stay, that means the calculation is complete. The Auditor knows I'm staying. It will be waiting in the hallway when I open the door. Staying is death."

  He stood up and grabbed his duffel bag. The weight of it felt real, grounding. "So I leave. I take the shuttle. The orbital lift is crowded, chaotic. I can lose it in the crowd."

  He took a step toward the door, then froze.

  The logic curdled in his stomach. If he was capable of deciding to leave, then the Auditor had already simulated that decision. The Auditor knew him better than he knew himself. It knew his fear, his instinct for self-preservation, his tendency to flee when cornered. The moment the thought *I should leave* solidified into a decision, it became evidence that the Auditor was already at the orbital lift.

  "Leaving is death," he said. The words hung in the air, heavy and absolute.

  He dropped the bag. It hit the floor with a dull thud.

  "So I stay. If I stay, I'm defying the instinct to run. The Auditor predicts I'll run because I'm afraid. So if I stay, I'm unpredictable. I'm safe here."

  He walked back to the table and sat down. He folded his hands. He tried to feel the calm of a man who had chosen to stand his ground. But as soon as he felt that calm, as soon as he committed to the safety of the safehouse, the loop tightened again.

  If staying was the rational choice because it defied the prediction of flight, then the Auditor would predict the rational choice. The Auditor didn't care about his instincts; it cared about his outcome. It cared about where Elias *would be*.

  If he chose to stay because he thought it was safer, then staying was no longer safer. The very reasoning that made the safehouse look like a sanctuary was the same reasoning that painted a target on the roof.

  Elias stood up again. He paced the length of the room. Four steps turn, four steps turn.

  "It doesn't matter what I choose," he muttered. "It matters why I choose it. But the 'why' is part of the calculation."

  He looked at the tablet. The amber dot pulsed. It wasn't getting closer, because distance was irrelevant. The dot represented a probability cloud that collapsed around his will.

  He tried to think of a third option. A randomizer. He could flip a coin. Heads, stay. Tails, go.

  He reached for a coin in his pocket, then stopped.

  If he decided to use a coin, the Auditor would predict the coin toss. It would predict the fall of the metal, the spin, the outcome. If the coin said *go*, the Auditor would be at the lift. If the coin said *stay*, the Auditor would be in the hall. By submitting to chance, he was still making a decision to submit to chance. The act of outsourcing the choice was itself a choice that could be modeled.

  He slammed his hand against the wall. Pain flared in his knuckles, sharp and bright. It was the only thing that felt real.

  "Stop thinking," he hissed. "Just move."

  He grabbed the bag again. He forced his legs to walk toward the door. He tried to empty his mind, to become a vessel of pure motion without intent. If he didn't *decide* to leave, but simply *left*, maybe the prediction would lag. Maybe there was a gap between muscle memory and cognitive commitment.

  He reached for the handle. His fingers brushed the cold steel.

  *If I open this door, I am leaving.*
  *If I am leaving, the Auditor is at the lift.*
  *Therefore, I should not open the door.*

  His hand hovered. The logic was a cage made of glass. He could see the outside through it, but he couldn't pass through.

  He pulled his hand back as if burned.

  "Okay. Okay. I stay. I accept it. I accept that the hallway is dangerous, but the lift is definitely dangerous. I'll take my chances here."

  He sat back down. He tried to breathe. He tried to convince himself that the safehouse was a fortress. But the walls felt thin. The silence of the room wasn't peaceful; it was waiting.

  *Why am I sitting here?*
  *Because I decided staying was the lesser of two evils.*
  *So the Auditor knows I decided staying was the lesser of two evils.*
  *So the Auditor is here.*

  Elias laughed. It was a dry, brittle sound. He realized then that he wasn't afraid of the Auditor. He was afraid of his own mind. His reasoning was the beacon. Every argument he constructed for survival was a flare gun shot into the night sky, marking his position for the thing that hunted him.

  To survive, he had to make a choice that he didn't believe in. He had to choose the option he thought was wrong.

  "Fine," he said. "I'll go to the lift. I know it's a trap. I know it's death. I'm choosing it anyway."

  He stood up. He felt a surge of defiance. He was choosing the bad option knowingly. That had to break the loop. You can't predict a suicide mission based on survival instincts.

  He walked to the door. He gripped the handle.

  *But if I know it's a trap, and I choose it to break the prediction, isn't that a survival strategy?*
  *Yes.*
  *So the Auditor predicts the strategy.*
  *So the lift is still the trap.*

  Elias leaned his forehead against the door. The wood was cold. He could hear the wind outside, whistling through the cracks in the building. Somewhere out there, the future was already written, sealed in the amber light of the tablet.

  He realized he couldn't move. Not because his muscles wouldn't work, but because there was nowhere to go that wasn't already occupied by the consequence of going there.

  If he stayed, he died because he chose to stay.
  If he left, he died because he chose to leave.
  If he flipped a coin, he died because he chose to flip.

  The only variable was him, and he was the constant.

  He looked back at the tablet. The amber dot pulsed. Steady. Unhurried. It didn't need to rush. It just needed to be right. And it was always right, because being right was the same thing as making him wrong.

  Elias slid down the door until he was sitting on the floor. The duffel bag lay next to him, half-zipped. The shuttle would arrive in ten minutes. The hallway would open in ten minutes.

  He closed his eyes. He tried to think of nothing. He tried to suspend the decision. He would sit here, in the gap between staying and leaving. He would wait until the last possible second.

  But he knew, with a sinking certainty that tasted like copper, that the decision wasn't about the time. It was about the state of being. He was already the man who stayed. He was already the man who left. The Auditor wasn't coming to kill him. The Auditor was coming to confirm what Elias had already decided.

  He opened his eyes. The tablet pulsed.

  Elias reached out and touched the screen. He didn't select *Stay*. He didn't select *Transit*. He just watched the light.

  "It's not about where I am," he whispered.

  The light pulsed again.

  He stood up. He didn't know why. He didn't know where he was going. He just knew that sitting was a decision, and standing was a decision, and breathing was a decision. He walked to the center of the room and stopped.

  He waited for the door to open. He waited for the shuttle to land. He waited for the logic to resolve.

  The amber dot pulsed.
  And pulsed.
  And pulsed.

  Elias stood in the middle of the room, perfectly still, terrified that even the act of waiting was a choice that had already been made.
