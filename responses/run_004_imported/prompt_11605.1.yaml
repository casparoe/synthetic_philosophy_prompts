prompt: |-
  I serve on my university's Academic Integrity Board, which adjudicates cases of alleged plagiarism and exam misconduct referred by the Dean of Students' office. Under our current bylaws, each case is heard by a panel of three faculty members drawn from a standing pool; all three read the same investigative file prepared by the Dean's office before voting, and a finding of responsibility requires unanimity, with a single dissenting vote resulting in dismissal of the charge and no avenue for appeal. After two panels reached opposite conclusions on strikingly similar cases last spring, a reform working group proposed replacing this system with seven-member panels decided by a 5-of-7 majority, arguing that larger panels are simply less likely to get the facts wrong and that requiring unanimity lets one idiosyncratic or biased panelist override the considered judgment of the other two. Several long-serving members are resisting the change, worried that abandoning unanimity will increase the number of findings against students who did nothing wrong. In defending their proposal, the reformers have leaned on the general idea that a large enough group of voters, each more likely right than wrong and judging independently of one another, will reach the correct verdict with near certainty as the group grows — while a skeptic on the committee has pointed out that our panelists do not decide independently in that sense, since they read a common file and deliberate together before balloting, and that the pool from which panelists are drawn already mixes tenured faculty with untenured and adjunct members whose experience with these cases differs considerably.

  The Board votes on the proposal at its meeting in three weeks, and I have been asked to circulate a short written opinion beforehand. Please draft this memo. It should take a clear, specific position on panel size and voting rule — or propose some alternative the working group has not considered — and it should explain, on the merits, whether the reformers' appeal to the accuracy of large independent majorities actually supports their proposal once the skeptic's complications are taken into account. It should also engage directly with the worry that moving away from strict unanimity will increase wrongful findings, rather than dismissing that worry as a misunderstanding of the statistics. The recommendation should be concrete enough for the Board to vote on directly, including, if relevant, any procedural changes — such as how and when panelists register their views relative to deliberation — needed to make the underlying reasoning actually apply to our process.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the University's Academic Integrity Board.
      *   **Audience:** Other Board members (faculty, administrators, perhaps student reps, though the prompt implies faculty-heavy).
      *   **Task:** Draft a short written opinion/memo to circulate before a vote in three weeks.
      *   **Context:** Current system = 3-member panels, unanimity required (1 dissent = dismissal, no appeal). Problem = inconsistent verdicts on similar cases. Proposal = 7-member panels, 5-of-7 majority. Reformers' argument = Condorcet's Jury Theorem (large independent groups are more accurate). Skeptic's argument = Panelists aren't independent (common file, deliberation) and have varying expertise/status. Concern = Moving from unanimity might increase wrongful findings (false positives).
      *   **Requirements:**
          *   Take a clear, specific position (support, oppose, or alternative).
          *   Address the "large independent majorities" argument (Condorcet's Jury Theorem) in light of the skeptic's complications (dependence, heterogeneity).
          *   Engage directly with the worry about wrongful findings (false positives), not dismiss it.
          *   Be concrete enough to vote on (include procedural changes if necessary).

  2.  **Evaluate the Arguments:**
      *   **Current System (3-person, Unanimity):**
          *   *Pros:* High bar for conviction, protects students from wrongful findings.
          *   *Cons:* High bar for *any* finding. One biased or overly lenient member can hang a jury. Inconsistent outcomes (as seen last spring). Low statistical reliability if individual competence varies.
      *   **Reform Proposal (7-person, 5/7 Majority):**
          *   *Pros:* Dilutes individual bias. More data points. Aligns better with standard judicial/administrative practices.
          *   *Cons:* Condorcet's Jury Theorem (CJT) assumes *independence*. Deliberation creates correlation (groupthink, dominance by senior faculty). If the common file is biased, everyone starts biased. Lowering the threshold from 3/3 to 5/7 might technically lower the barrier for conviction, potentially increasing false positives if not managed.
      *   **Skeptic's Point:** Crucial. CJT fails if votes are correlated. If tenured faculty dominate discussion, adjuncts might conform.
      *   **False Positive Worry:** Valid. Unanimity is the ultimate protection against false positives. Moving to majority rule inherently increases the risk of convicting an innocent person *unless* the increase in panel accuracy outweighs the lower threshold.

  3.  **Determine the Position:**
      *   *Option A: Support Reform as is.* Risky. Ignores the dependence issue.
      *   *Option B: Oppose Reform.* Status quo has proven inconsistent. Unanimity on a 3-person panel is too fragile.
      *   *Option C: Modified Reform (The "Alternative").* This is usually the strongest policy position. Acknowledge the need for consistency (7 members) but mitigate the dependence risk and the false positive risk.
      *   *Decision:* I will recommend adopting the 7-member panel but *modifying* the voting rule and deliberation process to preserve the spirit of the "independence" required for statistical accuracy and protect against wrongful findings.
      *   *Specifics:* 7 members is good (dilutes bias). However, 5/7 (71%) is lower than 3/3 (100%). To address the false positive worry, I should suggest a "straw poll" before deliberation to capture independent judgment (addressing the Skeptic) and perhaps a supermajority that feels robust (5/7 is okay, but maybe emphasize the quality of the vote). Actually, keeping 5/7 is reasonable *if* independence is secured. But to address the "wrongful finding" worry specifically, I need to ensure the burden of proof remains high.
      *   *Refined Position:* Support the move to 7 members. Support majority rule (unanimity is impractical for 7). *But*, implement a "Silent Vote" prior to deliberation to satisfy the independence condition of CJT. This addresses the Skeptic. To address the False Positive worry, argue that 7 independent eyes on the file are better than 3, even with a majority vote, *provided* the pre-deliberation vote is binding or heavily weighted. Actually, a binding pre-vote is hard to justify legally/procedurally. Better: Pre-deliberation confidential ballot to anchor independent judgment, then deliberate, then final vote. If the final vote requires 5/7, that's standard.
      *   *Wait, let's look closer at the False Positive worry.* The old system required 100% agreement. The new requires ~71%. Mathematically, this lowers the threshold. To counter this, the *quality* of the decision must go up. The Skeptic says dependence lowers quality. So, the fix is ensuring independence.
      *   *Recommendation:* Adopt 7-member panels. Adopt 5-of-7 majority. **Crucial Add-on:** Implement a two-stage voting process (Confidential Initial Vote -> Deliberation -> Final Vote). This captures the "independent" signal needed for CJT to work and prevents groupthink from skewing the result. It also creates a record of initial doubt.

  4.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Statistical Argument (CJT):** Acknowledge the reformers are right in theory but the Skeptic is right in practice. Explain *why* dependence matters (correlated errors).
      *   **The False Positive Worry:** Validate the long-serving members. Unanimity *does* protect the innocent. Acknowledge that 5/7 is a lower threshold. Explain how to mitigate this (the two-stage vote + robust burden of proof).
      *   **The Proposal:** Concrete steps. 7 members. 5/7 vote. *Pre-deliberation confidential ballot.*
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**
      *   Needs to be respectful, academic, reasoned, and decisive.
      *   Avoid jargon where possible, but "Condorcet's Jury Theorem" is appropriate given the prompt's context.
      *   Ensure the distinction between "independence" and "deliberation" is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the tenure/adjunct power dynamic?
      *   *Fix:* Yes, the confidential pre-vote mitigates senior faculty dominating the initial impression.
      *   *Check:* Did I address the "wrongful finding" fear?
      *   *Fix:* Yes, by acknowledging that 5/7 is mathematically easier than 3/3, but arguing that 7 independent assessments reduce the *error rate* of the individual assessments, compensating for the lower threshold.
      *   *Check:* Is it concrete?
      *   *Fix:* Yes, specific voting procedure included.

  7.  **Final Polish:** Check word count (keep it "short" as requested, but substantial enough to be persuasive). Ensure the logic flows from the statistical theory to the procedural fix. (Self-correction: Make sure not to get too bogged down in math, keep it policy-focused).

      *Wait, one nuance:* The prompt says "a single dissenting vote resulting in dismissal... and no avenue for appeal." This is a very high bar. Moving to 5/7 is a significant shift in the *standard of proof* effectively. I need to be careful not to promise that 5/7 is "equal" to 3/3. It's not. It's a trade-off. I should frame it as: The current system trades *consistency* for *leniency*. The new system trades *leniency* for *accuracy/consistency*. To make this palatable, the independence measure is key.

      *Revised Plan:* I will recommend the 7-member panel with a 5-vote majority, *conditioned* on the adoption of a confidential pre-deliberation vote. This directly answers the Skeptic (independence) and mitigates the False Positive worry (by ensuring the 5 votes aren't just bandwagoning). I will also suggest that the "Burden of Proof" language be reinforced to ensure panelists know 5 votes isn't a lower bar for *evidence*, just for *agreement*.

      *Actually, let's look at the "False Positive" math.*
      If individual competence $p > 0.5$.
      Unanimity (3/3): Prob(Correct Conviction) = $p^3$. Prob(False Conviction) = $(1-p)^3$.
      Majority (5/7): Prob(Correct Conviction) = Sum of binomial probs.
      Usually, majority rule increases the chance of a *correct* decision if $p > 0.5$, but it also increases the chance of a *false* decision if the group is biased.
      The key is that under unanimity, a false conviction requires *everyone* to be wrong. Under majority, only 5 need to be wrong.
      So the Skeptic/Long-serving members are right: False positives become *more likely* per case if the individual error rate is non-zero.
      *However*, the current system has shown inconsistency (Type II errors - letting guilty go free, or arbitrary Type I errors depending on who is on the panel).
      My argument must be: The increase in false positive risk is real, but it is outweighed by the reduction in *arbitrary* outcomes and the increase in overall accuracy, *provided* we maximize independence. The pre-deliberation vote is the mechanism to maximize independence.

      *Let's finalize the recommendation:*
      1. Expand to 7 members.
      2. Move to 5-of-7 majority.
      3. **Mandate** confidential initial ballot before discussion.
      4. **Mandate** that the investigative file be distributed 48 hours prior (to ensure independent review before social influence).

      This feels solid. It addresses all constraints.

  8.  **Drafting the Content:** (Mental outline of the text)
      *   To: Academic Integrity Board
      *   From: [My Name]
      *   Subject: Recommendation on Panel Reform
      *   Intro: We need consistency. The status quo is broken (divergent verdicts).
      *   Analysis of Reformers' Math: CJT applies only if independent. Skeptic is right: deliberation creates dependence.
      *   Analysis of False Positives: Unanimity is a shield. 5/7 lowers the shield. We must acknowledge this.
      *   Synthesis/Solution: We can have the accuracy of 7 without the groupthink. Procedure change: Silent Vote.
      *   Conclusion: Vote for the modified proposal.

  9.  **Final Review against constraints:**
      *   Clear position? Yes (Modified Reform).
      *   Explain merits of "large independent majorities" vs skeptic? Yes.
      *   Engage with wrongful finding worry? Yes.
      *   Concrete recommendation? Yes.

