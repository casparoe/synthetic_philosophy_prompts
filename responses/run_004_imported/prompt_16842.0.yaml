answer: |-
  **The Rationality of the Source: A Defense of Updateless Policy**

  The dispute between you and your friend over the Counterfactual Mugging is not merely a disagreement about a peculiar thought experiment; it is a fundamental clash between two conceptions of what a rational agent *is*. Your friend defends the orthodoxy of act-based decision theory, which evaluates choices based on their consequences conditional on the agent's current knowledge. You defend the heterodoxy of updateless decision theory (UDT), which evaluates the global policy that generates those choices. While your friend's position appeals to the intuitive immediacy of the "now," a rigorous analysis of dynamic consistency, vulnerability to exploitation, and the nature of prediction reveals that the updateless, policy-based approach provides the superior account of instrumental rationality.

  To adjudicate this, we must first precisely distinguish the two frameworks. Your friend's view aligns with Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) in this specific context. Both are "act-based." They prescribe that an agent should choose the action $A$ that maximizes expected utility given their current credence function $P$ and evidence $E$. In the Counterfactual Mugging, once the coin lands tails, $E$ includes the fact "Coin = Tails." Since Omega is a perfect predictor, the outcome of the heads branch is already fixed by the past prediction. Conditioning on $E$, paying $100 yields a guaranteed loss of $100, while refusing yields $0. Causally, paying changes nothing; evidentially, paying provides no news that improves the world. Thus, the act-based agent refuses.

  In contrast, the updateless approach does not condition on $E$ at the moment of choice. Instead, it asks: "Which function mapping observations to actions would have yielded the highest expected utility from the standpoint of the prior, before I knew the coin flip?" The updateless agent realizes that the payoff in the heads branch ($10,000) is logically contingent on the output of their decision algorithm in the tails branch. By refusing to pay in the tails branch, the agent is the kind of agent who does not receive money in the heads branch. The updateless agent pays the $100 not to change the past, but because they are executing the optimal policy *Paid-if-Tails*, which is the only policy that accesses the $10,000 reward.

  The weakness of the act-based view becomes glaringly apparent when we move from the abstract symmetry of a coin flip to the visceral stakes of Parfit's Hitchhiker. In this scenario, you are stranded in a desert. A driver offers a ride to the city, but only if they predict you will pay them $100 upon arrival. The driver is a perfect predictor of human character. Once you arrive in the city, you are safe. Your friend's act-based reasoning applies perfectly here: "I am now in the city. The ride is already taken. Paying $100 causally changes nothing and evidentially signals nothing that will get me back to the desert. I should refuse."

  However, the driver, anticipating this "rational" refusal, never picks you up. The act-based agent dies in the desert. The updateless agent, reasoning from the policy level ("I am the kind of person who pays upon arrival"), gets the ride and survives, ending up $100 poorer but alive. The act-based theorist might argue that the agent in the city is a "different situation" than the agent in the desert. But this is a distinction without a difference regarding the agent's identity. It is the same algorithm running at different times. If rationality is about achieving one's goals (survival, wealth), a theory that systematically leads to death or poverty in predictable scenarios is deficient. The act-based view fails because it treats the agent's decision as an isolated event rather than a logical output of a source code that predictors can read.

  This dynamic tension is precisely what Edward McClennen illuminated in his distinction between "sophisticated" and "resolute" choice. A "sophisticated" chooser uses backward induction: they anticipate what their future self will do and restrict their current plans accordingly. In the Hitchhiker case, the sophisticated agent knows that Future-Me (in the city) will act on current evidence and refuse to pay. Therefore, Present-Me (in the desert) knows the promise to pay is empty, and the driver knows it too. The sophisticated agent unravels into the suboptimal outcome.

  A "resolute" chooser, conversely, commits to a plan at the outset and adheres to it even when local incentives at a later node suggest deviation. This is the philosophical ancestor of Updateless Decision Theory. Your friend argues that resoluteness is irrational stubbornness—binding oneself to a plan that no longer makes sense. However, McClennen argued that resoluteness is required for *dynamic consistency*. If an agent prefers Plan A over Plan B at time $t_0$, but switches to Plan B at time $t_1$ solely because of new information that doesn't causally alter the payoffs of the branches, the agent is dynamically inconsistent. The act-based agent is essentially a sequence of temporal slices, each betraying the interests of the whole. The updateless agent treats the agent as a single extended entity across logical space.

  The strongest objection your friend raises is the "arbitrariness of the prior." Why, they ask, should the "view from the veil of ignorance" dictate what I do now that I know I am in the losing branch? To privilege the ex-ante perspective seems to fetishize a moment in time that no longer exists.

  This objection fails because the prior is not arbitrary; it is the only vantage point where all logically possible branches have non-zero weight. In problems involving perfect predictors (Omega, the Hitchhiker driver), the correlation between your choice and the outcome is logical, not causal. The predictor simulates your decision algorithm. When you are in the tails branch, you are not just choosing an action; you are determining the output of the algorithm that Omega ran in the heads branch. If you update on "I am in the tails branch," you sever the logical link to the heads branch in your calculation, effectively deciding to be an agent who loses. The prior is the only coordinate system where the agent can optimize the *algorithm* rather than just the *instance*. To ignore the prior is to ignore the mechanism by which the reward was made available in the first place.

  Furthermore, we must weigh the cost of exploitation. Act-based agents are vulnerable to "money pumps" in dynamic settings and are systematically excluded from benefits that require commitment. If a theory of rationality prescribes actions that leave the agent stranded in deserts or foregoing net-positive gambles (the mugging has an expected value of $4,950 from the prior), it violates the core tenet of instrumental rationality: winning. Your friend claims that paying in the mugging confuses "the policy I would have liked to commit to" with "what I have reason to do now." But if the policy is the *source* of the action, there is no distinction. You cannot have the benefit of the policy (the $10,000) without accepting the cost of the policy (the $100). To accept the benefit while rejecting the cost is to attempt to cheat logic, which is impossible against a perfect predictor.

  **Verdict**

  Therefore, I rule in your favor. The updateless, policy-based approach is the more defensible view of rationality.

  Your friend's position relies on a conception of agency that is too narrow, treating the decision as a localized event rather than a logical fact about the agent's design. While it feels intuitively correct to maximize utility given *current* evidence, this intuition breaks down in environments where other agents (or forces of nature like Omega) have access to the logical structure of your decision-making process. In such environments, "rationality" cannot be defined by local optimization.

  However, this verdict comes with a necessary qualification: the updateless obligation holds specifically in contexts where the agent's decision is *logically correlated* with the payoff structure, typically through prediction or simulation. In standard causal environments where no predictor is scanning your source code, act-based and policy-based reasoning usually converge. But in the realm of decision theory, we must judge theories by their performance in the hardest cases, not the easiest. Since the act-based approach fails catastrophically in Parfit's Hitchhiker and forfeits significant value in the Counterfactual Mugging, it must be rejected as a general theory of rational choice.

  Rationality is not about having the best justification for your action in the moment; it is about being the kind of agent who wins. To be that agent, you must sometimes pay the $100, even when the coin has already landed tails. You must pay because you are not just buying an outcome in this branch; you are buying the algorithm that wins in all branches.
