prompt: |-
  I've spent more years than I care to admit reading rationalist blogs and forums, and a few years ago that reading turned out to be unexpectedly practical when I joined the protocols subcommittee of a volunteer backcountry search-and-rescue unit, where we maintain the rules incident commanders use to build probability-of-location maps (a homemade, much cruder cousin of the Bayesian search-theory tools that outfits like the Coast Guard use for planning searches at sea). Last month's callout has split the subcommittee down the middle in a way I'd like to settle properly rather than re-litigate every time it comes up, especially since the map is literally what tells commanders which zone to send scarce search teams to at first light. The search area was divided by a ridge into an East zone and a West zone, and given the subject's last known position and the elapsed time, we had good reason going in to treat the two zones as equally likely. A few hours into the search, a hunter radioed in a tip everyone found credible: if the missing hiker had gone into the West zone, she was far more likely to be headed for the lake basin than for the old lookout trail, and he had no opinion at all about East versus West. Half the subcommittee wants to leave our probability of West exactly where it was, on the grounds that a tip about the inside of West can't be evidence about East versus West; the other half reran the map using the maximum-entropy update our software defaults to, feeding in only the new conditional constraint, and got a P(West) that had shifted noticeably away from one half, which they insist is simply what the math requires whether or not it feels right. I recognized this as a field-grade version of a puzzle I first ran into years ago in a rationalist-blog discussion of Bayesian conditionalization, under a name I'm fairly sure was the Judy Benjamin problem, and learning that it's a genuinely disputed case rather than a solved exercise has not, unfortunately, told me what our unit should actually do the next time a tip like this comes over the radio, which at the rate we get them will probably be before the season is out.

  As the subcommittee member who volunteered to turn this into policy, I need to bring a short written recommendation to our meeting before the spring training weekend, when new field volunteers are briefed on protocol. Please draft that memo. It should commit our unit to one specific, usable procedure for folding a conditional-form tip like this into the probability map going forward, stated clearly enough that a commander under field pressure could apply it without re-deriving the epistemology on the spot; it should give the reasoning in enough depth that a skeptical, numerate coordinator would actually be persuaded rather than just told to comply; and it should engage honestly with whichever camp's procedure you end up not recommending, since both are being argued for in good faith by subcommittee members whose judgment I otherwise trust.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A volunteer backcountry search-and-rescue (SAR) unit. The user is on the protocols subcommittee.
      *   **Problem:** A disagreement on how to update probability-of-location maps (POA - Probability of Area) when receiving a specific type of tip.
      *   **Scenario:** Search area split into East (E) and West (W). Prior $P(E) = P(W) = 0.5$.
      *   **New Information:** A credible tip states: *If* the subject is in West, they are more likely in the Lake Basin (L) than the Lookout Trail (T). The tip giver has *no opinion* on East vs. West.
      *   **The Conflict:**
          *   Camp A (Keep P(W) = 0.5): Information is internal to West, so it shouldn't shift probability mass between E and W.
          *   Camp B (MaxEnt Update): Feeding the conditional constraint into the software shifts $P(W)$ away from 0.5. They claim math requires this.
      *   **User's Insight:** Recognizes this as the *Judy Benjamin Problem* (a known paradox in Bayesian epistemology).
      *   **Task:** Draft a policy memo for the subcommittee meeting.
      *   **Requirements:**
          *   Commit to *one* specific, usable procedure.
          *   Clear enough for a field commander under pressure.
          *   Reasoning deep enough to persuade a skeptical, numerate coordinator.
          *   Engage honestly with the rejected camp (good faith disagreement).
          *   Tone: Professional, practical, authoritative but collaborative.

  2.  **Deconstruct the Judy Benjamin Problem (JBP):**
      *   *The Setup:* You have a partition (East, West). You get a conditional constraint on one partition (If West, then Likelihood(Lake) > Likelihood(Lookout)).
      *   *The Intuition (Camp A):* Learning about the *interior* of West shouldn't tell you anything about whether the subject is in West vs. East. $P(W)$ should stay fixed.
      *   *The Math (Camp B - MaxEnt/INFOMIN):* Minimizing cross-entropy (Kullback-Leibler divergence) subject to the new constraint often results in shifting the marginal probability of the condition (West). Why? Because changing the internal distribution of West changes the "distance" from the prior, and sometimes shifting the marginal $P(W)$ minimizes the total information gain more than keeping it fixed.
      *   *The Consensus in Epistemology:* There is *no* consensus. It is a known paradox. Standard Bayesian conditionalization doesn't apply directly because we aren't learning a proposition is *true*, we are learning a *conditional probability constraint*.
      *   *The SAR Context:* This is crucial. This isn't abstract philosophy; it's life-or-death resource allocation.
      *   *Decision Criterion:* In SAR, we want to minimize risk (expected loss). We want to avoid false negatives (missing the subject). We also need stability and interpretability.
      *   *Evaluating Camp A (Fixed Marginals):* Intuitively robust. If the hunter knows nothing about E vs. W, why would we shift resources from E to W (or vice versa)? It respects the independence of the evidence source regarding the partition.
      *   *Evaluating Camp B (MaxEnt Shift):* Mathematically defensible under specific entropy minimization axioms, but counter-intuitive. It implies that learning about the *inside* of a region changes the probability of *being* in that region, even when the source explicitly disclaims knowledge about the region boundary. In a SAR context, this looks like "ghost evidence"—shifting resources based on math artifacts rather than ground truth.

  3.  **Determine the Recommendation:**
      *   *Which way to go?* For SAR, **Camp A (Fixed Marginals)** is the safer, more defensible operational choice.
      *   *Why?*
          1.  **Evidence Integrity:** The tipster explicitly said "no opinion on East vs. West." Ignoring that explicit meta-data to satisfy an entropy algorithm is risky.
          2.  **Operational Stability:** Commanders need to trust the map. If internal updates shift external boundaries without new external evidence, trust erodes.
          3.  **Risk Management:** Shifting probability away from a zone without evidence that the subject is *more* likely to be there (or less) increases the risk of under-searching the unchanged zone.
          4.  **The "Judy Benjamin" Reality:** Since even philosophers can't agree on the "true" answer, we should default to the heuristic that minimizes unwarranted assumptions. The MaxEnt solution assumes a specific relationship between the conditional and marginal probabilities that isn't justified by the evidence.
      *   *Procedure:* Normalize within the sub-region only. Keep the marginal probability of the parent region constant.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the recent incident and the split decision.
      *   **The Recommendation:** State the policy upfront. (Preserve marginal probabilities of search zones when receiving conditional tips internal to a zone).
      *   **The Procedure (Field Guide):** Step-by-step instructions for the Commander/Plotter. Keep it simple.
          1.  Identify the Zone.
          2.  Apply the ratio inside the Zone.
          3.  Renormalize *within* the Zone.
          4.  Do not touch the Zone's total POA.
      *   **The Reasoning (For the Numerate):**
          *   Acknowledge the Judy Benjamin Problem.
          *   Explain why MaxEnt (Camp B) is mathematically valid *in a vacuum* but operationally hazardous here. It introduces "information" not in evidence.
          *   Explain why Fixed Marginals (Camp A) aligns with the *source's* epistemic state (they said they don't know E vs. W).
          *   SAR Priority: Minimize risk of missing the subject. Don't move resources without positive evidence.
      *   **Addressing the Counter-Argument:** Validate Camp B. They aren't wrong about the math *if* you accept MaxEnt as the gold standard. But MaxEnt is a tie-breaker for ignorance, not a truth machine. In this case, we have specific meta-evidence (the tipster's limitation) that overrides the default entropy assumption.
      *   **Closing:** Implementation timeline (Spring Training).

  5.  **Refining the Tone:**
      *   Needs to be respectful. Both sides are smart.
      *   Needs to be decisive. "We are doing X."
      *   Needs to bridge the gap between "rationalist blog theory" and "muddy boots reality."
      *   *Self-Correction during drafting:* I initially thought about suggesting a complex formula. No, the prompt asks for something a commander can use under pressure. The procedure must be "Renormalize inside, leave outside alone." The math justification goes in the appendix or reasoning section, not the field steps.

  6.  **Addressing the Judy Benjamin Specifics:**
      *   In the JBP, the standard MaxEnt solution *does* shift the probability of the antecedent (West).
      *   The "van Fraassen" critique (Camp A intuition) is that conditional information shouldn't update the probability of the condition unless there's a causal link or specific evidence.
      *   I need to make sure I don't get bogged down in the philosophy but use it to support the operational decision. The key argument is: *The tipster's lack of opinion on E vs. W is itself data.* MaxEnt ignores that meta-data.

  7.  **Final Review against Constraints:**
      *   Commit to one procedure? Yes (Fixed Marginals).
      *   Clear for commander? Yes (Step-by-step).
      *   Persuade numerate coordinator? Yes (JBP discussion, risk analysis).
      *   Engage rejected camp? Yes (Validate MaxEnt logic but limit scope).

  8.  **Final Polish:** Check for SAR terminology (POA, IAP, Incident Commander). Ensure the distinction between "Probability of Area" (POA) and "Probability of Detection" (POD) is clear (though this is mostly about POA). *Correction:* The prompt talks about Probability of Location maps (POA). Stick to that.

  *(Self-Correction on the Math)*: Wait, if I keep P(West) fixed, and I learn P(Lake | West) is high, I just shift mass from Lookout to Lake *within* West. P(West) = P(Lake) + P(Lookout). If P(West) is fixed, and P(Lake|West) goes up, P(Lake) goes up and P(Lookout) goes down. This is straightforward Bayesian updating *within* the partition. The MaxEnt crowd argues that updating the conditional *should* shift the marginal. I need to be firm that for SAR, we treat the tipster's "No opinion on E vs W" as a hard constraint that overrides the MaxEnt default.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Protocols Subcommittee, [Unit Name] Search & Rescue
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation: Updating POA Maps with Conditional Intelligence

  ### 1. Purpose and Recommendation

  Following the debrief of last month's incident, the subcommittee remains divided on how to update Probability of Area (POA) maps when receiving credible tips that constrain probabilities *within* a zone without addressing the likelihood of the zone itself.

  This memo establishes the unit's standing protocol for this scenario. Effective immediately, and to be included in Spring Training materials:

  **When a tip provides conditional information internal to a specific search zone (e.g., "If in Zone West, subject is likely at Lake") but offers no evidence regarding the partition between zones (East vs. West), Incident Commanders must preserve the marginal probability of the parent zone.**

  In practice: **Do not allow the total Probability of Area for Zone West to shift.** Apply the new information only to redistribute probability mass *within* Zone West. Zone East remains unchanged.

  ### 2. Field Procedure (For Incident Commanders)

  Under time pressure, commanders should not need to derive epistemology. When a radio tip meets the criteria above (credible source, specific to a sub-region, no opinion on broader zones), follow this three-step process:

  1.  **Isolate the Zone:** Identify the search zone containing the sub-regions mentioned in the tip (e.g., Zone West). Note its current total POA (e.g., 50%).
  2.  **Redistribute Internally:** Adjust the POA of the sub-regions *inside* that zone to reflect the tip (e.g., increase Lake Basin, decrease Lookout Trail).
  3.  **Normalize Locally:** Ensure the sub-regions sum to the Zone's original total POA. **Do not** let the software's default entropy functions shift probability mass from Zone East to Zone West (or vice versa).

  **Rule of Thumb:** If the tipster doesn't know East from West, the map shouldn't know East from West. Internal intel shifts internal resources, not zone boundaries.

  ### 3. Reasoning and Analysis

  This recommendation sides with the subcommittee members who argued for keeping the Zone West probability fixed. However, the dissenting view—that the Maximum Entropy (MaxEnt) update is mathematically rigorous—deserves serious engagement. Both sides are operating in good faith, and the disagreement stems from a known paradox in probability theory called the **Judy Benjamin Problem**.

  **The Case for MaxEnt (The Dissenting View)**
  The argument for allowing the software to shift the marginal probability of Zone West is mathematically defensible under the principle of Minimum Cross-Entropy. When we update a probability distribution with a new conditional constraint, the MaxEnt algorithm finds the "closest" new distribution to the old one that satisfies the constraint. In many formulations of this problem, the mathematically "closest" distribution *does* require shifting the marginal probability of the condition (Zone West), even if the evidence seems internal. The dissenting members are correct that our software defaults to this because, in the absence of other instructions, it is a consistent way to minimize unwarranted assumptions.

  **Why We Are Overriding the Default**
  While MaxEnt is a powerful tool for handling ignorance, it is not a substitute for evidence. In a Search and Rescue context, we must prioritize **evidence integrity** over mathematical elegance.

  1.  **Meta-Evidence Matters:** The tipster explicitly stated they had "no opinion on East versus West." This is not just an absence of data; it is positive meta-evidence about the reliability of the tip regarding the zone partition. The MaxEnt default effectively ignores this statement, treating the tip as if it were generated by a process that might correlate internal and external probabilities. By fixing the marginal, we respect the tipster's stated epistemic limits.
  2.  **Operational Risk:** Shifting the POA of Zone West based solely on internal data creates "ghost evidence." If we lower the POA of Zone West to satisfy an entropy constraint, we are implicitly deciding to send fewer teams there. If the subject is in Zone East, and we have shifted resources to West based on a math artifact rather than ground truth, we have increased the risk of a false negative without a justifying signal.
  3.  **Stability and Trust:** Commanders operate on trust in the map. If internal updates to Zone West cause the total probability of Zone West to fluctuate, it becomes difficult to explain resource allocation to field teams. "We moved teams out of East because of a clue about the Lake in West" is a hard sell unless that clue explicitly suggests the subject *left* East.

  ### 4. Conclusion

  The Judy Benjamin problem remains unsolved in theoretical epistemology; there is no universal "correct" answer that satisfies all axioms of probability. However, SAR is not a theoretical exercise. It is a risk-management discipline.

  When forced to choose between a mathematical default that shifts resources without external evidence, and a heuristic that preserves resource allocation until new external evidence arrives, **we must choose the heuristic that minimizes the risk of abandoning a viable search area.**

  Please review this procedure before the Spring Training weekend. I am available to walk through the specific normalization calculations with any coordinators who wish to verify the math.

  **Approved for Implementation:**
  [Your Name]
  Protocols Subcommittee
