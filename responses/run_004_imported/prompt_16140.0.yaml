      *   *Original Public Meaning:* How would a reasonable person at the time have understood the text? (Scalia/Thomas version).
      *   *Goal:* To constrain judges from imposing their own values by sticking to the historical understanding.
      *   *Problem regarding Slavery:* If you apply strict original public meaning to the 1787 Constitution, it *was* pro-slavery. If you apply it to the 14th Amendment (1868), it's more complex, but often used to strike down civil rights legislation (e.g., *Civil Rights Cases*, *Plessy* era logic, though *Brown* is the counter-argument).

  4.  **Compare Douglass's Methodology to Modern Originalism:**
