      *   *Nuance:* He might appreciate the focus on text over "living constitutionalism" (judges making things up), but he would hate the "dead hand" control of historical prejudice.
      *   *Specific Evidence:* Cite his 1860 speech. He explicitly rejects looking at the "secret intentions." Modern originalism *is* looking at the intentions/understandings.

  6.  **Refine the Analysis (Self-Correction/Edge Cases):**
