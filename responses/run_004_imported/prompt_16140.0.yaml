answer: |-
  This is a sharp observation, and you've hit on a tension that legal scholars actually wrestle with when they look at Douglass's jurisprudence. You are right to distinguish between **textualism** (what the words say) and **originalism** (what the words meant to the people who wrote or ratified them at the time).

  Douglass was definitely a textualist, but he was almost certainly **not an originalist** in the modern sense. If he were transported to today to watch the Supreme Court debate originalism, he would likely view it as a sophisticated method for burying the very liberty the Constitution promises.

  Here is the breakdown of why Douglass's interpretive method clashes with modern originalism, based on the mechanics of interpretation rather than just moral outcomes.

  ### 1. Douglass Separated Text from Historical Context
  Your point about Douglass choosing "text-over-intent" is the key. In his 1860 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, Douglass makes a radical move. He admits the framers were compromised. He admits the historical context was steeped in racism. But he argues that the **law** is the written document, not the historical baggage surrounding it.

  He writes:
  > *"I shall interpret the Constitution according to its reading, not according to the secret intentions of its framers."*

  Modern originalism (specifically "Original Public Meaning," the dominant version today) argues that you cannot interpret the text without anchoring it to how a reasonable person at the time would have understood it. For an originalist, if the "public meaning" of "equal protection" in 1868 did not include school integration, then the text cannot mandate school integration.

  Douglass would reject this anchor. He argued that the words "Liberty," "Justice," and "Equality" have a **principled meaning** that transcends the specific prejudices of the era in which they were written. He wanted the text to be a vessel for universal natural law, not a time capsule of 18th or 19th-century consensus. To Douglass, binding the text to the "original understanding" was effectively binding liberty to the limitations of slaveholders and racists.

  ### 2. The "Dead Hand" Problem
  Modern originalism is often justified by the idea of democratic legitimacy: the law was ratified by the people (or their representatives) back then, and judges shouldn't change it without a new amendment. This is often called the "dead hand" of the past controlling the present.

  Douglass explicitly argued against being controlled by the dead hand of the founding generation. In an 1857 speech responding to the *Dred Scott* decision (which was arguably an originalist ruling—Taney looked at history and said "Black people were never considered citizens, so they can't be now"), Douglass said:

  > *"We have to do with the past only as we can make it useful to the present and the future... To enlighten us, to improve us, is the only legitimate object of studying the past."*

  Douglass viewed the Constitution as a **dynamic tool**. He believed the text contained principles that were meant to grow. If you lock the meaning of "persons" or "citizens" to the 1787 or 1868 understanding, you freeze the moral progress of the nation. Douglass's textualism was forward-looking; modern originalism is backward-looking. Douglass would likely see originalism as a way for judges to hide behind history to avoid doing the work of justice in the present.

  ### 3. The "Glory" vs. The "Compromise"
  The core of Douglass's shift from Garrison was his belief that the Constitution's **Preamble** ("secure the Blessings of Liberty") set the interpretive rule for the rest of the document. He argued that when there is ambiguity, you must interpret the specific clauses in light of the general purpose of Liberty.

  Modern originalism generally rejects this. An originalist would say, "Don't look at the vague aspirations of the Preamble; look at the specific legal meaning of the Fugitive Slave Clause or the 14th Amendment as understood by the ratifiers."

  If Douglass applied his method to the 14th Amendment, he would argue that "Equal Protection" is a broad principle that mandates full social and political equality, regardless of whether the specific guys who voted for it in 1868 were personally ready for interracial marriage or integrated schools. He would argue the *text* demands more than the *ratifiers* intended.

  An originalist would say, "If the ratifiers didn't intend to ban segregated schools, the text doesn't ban segregated schools."

  This is the fatal friction. Douglass used the text to **escape** the intent. Originalists use the intent to **define** the text.

  ### 4. Why He Might Respect the Form, But Reject the Function
  Douglass might appreciate one thing about originalism: its hostility to judges making things up out of thin air (what he might call "judicial tyranny"). He believed in the rule of law. He didn't want judges ignoring the text to be nice; he wanted them reading the text to find the liberty that was already there.

  However, he would quickly realize that modern originalism is often used to strike down civil rights legislation (like the Voting Rights Act) or limit federal power to protect minorities, based on a "states' rights" understanding from the 19th century.

  Because Douglass's textualism was fundamentally **moral** (the text *must* be read in the light of liberty), and modern originalism claims to be **neutral** (the text means what it meant, even if that's unjust), Douglass would find the methodology bankrupt. He famously said the Constitution was "a glorious liberty document," but only *if* interpreted correctly. To him, "correctly" meant in favor of freedom. To an originalist, "correctly" means in favor of historical accuracy, even if that accuracy reveals a lack of freedom.

  ### The Verdict
  Douglass would likely view modern originalism as **Garrisonism in disguise.**

  Remember, Garrison burned the Constitution because he looked at the *history* and the *intent* and saw slavery. Douglass saved the Constitution by looking at the *text* and seeing liberty. Modern originalists look at the *history* and *intent* to define the *text*.

  By forcing the text to bow to the historical understanding of the framers/ratifiers, originalism forces the Constitution to bow to the prejudices of the past. Douglass spent his life arguing that the Constitution was stronger than the prejudices of the men who wrote it. He would likely argue that originalism surrenders the document back to those prejudices.

  He wouldn't just be "against it" on civil rights grounds; he would be against it on **interpretive grounds**. He would argue that originalism is a failure of reading—that it mistakes the *shadows* of the framers' limitations for the *substance* of the law's principles. He chose text *over* intent. Originalism chooses intent (or historical understanding) *to define* text. That is an irreconcilable difference.
