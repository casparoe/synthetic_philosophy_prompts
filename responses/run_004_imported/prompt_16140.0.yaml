      *   *The Crux:* Douglass rejected the "original understanding" of 1787 because it validated slavery. He embraced a textualism that allowed for moral progress *within* the document. Modern originalism often claims to be neutral, but when applied to the 1787 text without the Reconstruction Amendments, it yields pro-slavery results. When applied to the 14th, it can be restrictive on federal power to protect rights.

  5.  **Formulate the Argument:**
      *   *Acknowledge the insight:* The user is sharp to notice the tension between Douglass's textualism and modern originalism's reliance on historical understanding.
      *   *Define Douglass's stance:* He was a "Textualist" but not an "Originalist" in the modern sense. He separated the *text* from the *historical intent*.
      *   *Evaluate Modern Originalism:* Modern originalism (Scalia/Thomas/Barrett) relies heavily on "Original Public Meaning." This means asking: "What did 'liberty' or 'equal protection' mean to a white man in 1868?"
      *   *The Conflict:* Douglass argued that the Constitution's *principles* (Liberty, Justice) were universal, even if the *framers* were flawed. Modern originalism often insists that if the public in 1868 didn't understand "equal protection" to include school integration, then it doesn't.
