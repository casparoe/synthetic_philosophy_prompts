      *   *Phase 2 (Post-1851, especially "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" 1860):* The text itself contains no word "slave" or "slavery." It refers to "persons held to service." The Preamble says "secure the Blessings of Liberty." Therefore, the text mandates liberty. The intent might have been compromised, but the *law* is the text.
      *   *Methodology:* Douglass adopted a form of textualism. He argued that the *written law* supersedes the *unwritten intentions* of the drafters, especially when those intentions are immoral. He famously said, "I shall interpret the Constitution according to its reading, not according to the secret intentions of its framers."

  3.  **Deconstruct Modern Originalism:**
