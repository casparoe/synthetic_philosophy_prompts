answer: |-
  Here are nine questions designed to press the specific vulnerabilities of hybrid expressivism, structured to build pressure throughout the Q&A session. They move from the technical semantics of embedding to the broader metaethical costs, culminating in the "deletion" challenge you requested.

  ### 1. The "Dissolution" Claim
  **Question:** You suggest that by assigning the compositional burden to the descriptive component, you dissolve the Frege-Geach problem rather than merely managing it. But doesn't this presuppose that the Frege-Geach problem was *only* about logical syntax? If the puzzle is also about explaining the *uniformity* of meaning between asserted and embedded contexts, doesn't your view imply that the normative meaning actually *shifts* in embedded contexts, since the expressive component drops out?
  **Follow-up:** If she says the meaning is stable because the descriptive content is stable: Press whether the "normative meaning" is then just the descriptive meaning, rendering the expressivist label redundant.

  ### 2. The Negation Problem (Unwin/Schroeder)
  **Question:** Let's zoom in on negation. Unwin and Schroeder argue that negating a descriptive content doesn't capture the specific inconsistency involved in moral disagreement. If "X is wrong" expresses attitude A toward descriptive content D, "X is not wrong" negates D. But why is accepting D and rejecting D inconsistent in the *moral* sense, rather than just a descriptive error? Have you solved the negation problem, or just relocated it into the choice of the descriptive property?
  **Follow-up:** If she claims the descriptive property is specially constituted to ensure inconsistency: Ask what constitutes that specialness without smuggling in the very normative notions you're trying to analyze.

  ### 3. The Choice of Descriptive Property
  **Question:** Following up on that relocation worry: You propose the descriptive content is something like "fits the norms the speaker accepts." But if the inconsistency of "Wrong" and "Not Wrong" depends entirely on the logic of *that* descriptive clause, aren't you committed to the claim that moral disagreement is fundamentally disagreement about the speaker's own psychological states or norm-sets?
  **Follow-up:** If she denies this and says the property is objective: Press how an objective descriptive property avoids collapsing into standard naturalist cognitivism (see Question 8).

  ### 4. Explanatory Idleness (Truth Conditions)
  **Question:** A common criticism of Ridge-style ecumenical views is that the expressive component becomes explanatorily idle. If the descriptive component fixes the truth conditions, determines the validity of arguments, and handles embedding, what semantic work is left for the expressive attitude to do? Is it fair to say the attitude is semantically inert?
  **Follow-up:** If she says it explains "assertoric force": Ask whether force is a semantic phenomenon or merely pragmatic, and if the latter, why it belongs in the semantics at all.

  ### 5. Explanatory Idleness (Communication)
  **Question:** To press the idleness point further: If I understand the descriptive proposition you express, I seemingly grasp the truth-conditions of your utterance. If I can do that without sharing or recognizing your conative attitude, in what sense does the attitude contribute to the *content* communicated? Are you distinguishing between what is *said* (descriptive) and what is *expressed* (attitude) in a way that makes the latter irrelevant to understanding?
  **Follow-up:** If she says understanding requires grasping the attitude: Ask how one grasps an attitude that is not part of the truth-conditional content, and whether this isn't just a pragmatic implicature.

  ### 6. Motivational Internalism (The Amoralist)
  **Question:** One of the original motivations for expressivism was to secure a tight link between judgment and motivation (internalism). But on your view, the descriptive content is graspable independently of the attitude. Doesn't this open the door to an amoralist who fully grasps the proposition "X is wrong" (the descriptive part) but remains utterly unmoved, without any conceptual confusion?
  **Follow-up:** If she says the amoralist is irrational but possible: Press whether this concedes the internalist battle to the cognitivists, who also allow for irrational amoralists.

  ### 7. Motivational Internalism (Contingency)
  **Question:** If the connection between the descriptive content and the conative attitude is contingent—since one can theoretically exist without the other—doesn't your view reduce internalism to a mere psychological generalization? If so, have you retained the *conceptual* connection that made expressivism attractive as a alternative to cognitivism?
  **Follow-up:** If she argues the connection is normative rather than conceptual: Ask why a hybrid *semantics* is needed to support a *normative* claim, rather than just a normative ethical premise.

  ### 8. Creeping Minimalism
  **Question:** Dreier's "creeping minimalism" worry suggests that once expressivists claim their view has truth conditions, propositions, and belief-states, there is no daylight left between them and cognitivism. Since your descriptive component carries full truth-conditional weight, what substantive distinction remains between your view and a naturalist cognitivism that simply adds a pragmatic note that "speakers usually have attitudes when asserting these truths"?
  **Follow-up:** If she says cognitivists deny the attitude expression: Point out that cognitivists can agree speakers express attitudes; ask what the *semantic* difference is.

  ### 9. The "Delete the Layer" Challenge
  **Question:** This leads to my final question. Imagine we take your theory and delete the expressive layer wholesale. We keep the descriptive content, the truth conditions, and the logic exactly as they are. We just stop saying an attitude is "expressed." What exactly breaks? What semantic or normative phenomenon becomes unexplainable if we treat your view as a plain naturalist cognitivism?
  **Follow-up:** If she says "We lose the explanation of action": Reply that cognitivists explain action via belief-desire pairs where the belief is your descriptive content and the desire is independent. Ask why your view is superior to that simpler model.

  ***

  ### Moderation Advice
  Since you are moderating rather than debating, frame these as "questions arising from the literature" or "worries students often raise" if you want to soften the edge, though given your role as a PhD peer, direct philosophical pressure is appropriate.

  *   **Pacing:** Questions 1–3 should come early (Semantics/Logic). Questions 4–5 in the middle (Metasemantics). Questions 6–9 toward the end (Metaethical consequences).
  *   **Managing Answers:** Hybrid expressivists often try to retreat to pragmatics when pressed on semantics. If she does this, use Follow-up 4 or 5 to ask why a pragmatic feature is being modeled as part of the semantic "hybrid."
  *   **The Finale:** Question 9 is your strongest tool. If she struggles to answer what is lost by deleting the attitude, it undermines the motivation for the hybrid view entirely. Be prepared to cut off a long-winded answer there to ensure you get a direct response.
