      *   *Marcus:* The "Sophisticated" agent sees the loop and refuses the first trade. The "Resolute" agent commits to a path. The pump requires *naivety* about future choices.
      *   *Elena's Counter:* Sophistication changes the preferences! If you refuse the trade because of the future cost, your *revealed* preference isn't C>A anymore. It's A>(C-cost). You've effectively made preferences transitive by incorporating the context.
