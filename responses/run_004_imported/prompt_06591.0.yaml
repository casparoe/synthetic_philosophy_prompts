prompt: |-
  I'm working on a piece about organ donation and I've got an interview lined up with a philosopher of medicine who's known for arguing that whole-brain death isn't really a biological fact so much as a useful legal fiction -- something we keep around so transplant teams can procure organs without technically "killing" anyone -- and that we'd be more honest just scrapping the dead donor rule altogether. Can you draft me 8-10 interview questions that don't just let her restate that thesis? Want at least one on the Shewmon-style chronic survival cases (bodies that keep growing, healing, even one pregnancy sustained to viability, years after a whole-brain-death diagnosis) and whether those cases actually help or undercut her "it's a fiction" line; one on why circulatory-death protocols only wait a couple minutes after the heart stops given that auto-resuscitation is a real thing, and whether "permanent" cessation is smuggling in a decision that "irreversible" cant justify; and one that pushes her to say what's left of the dead donor rule on her view, and whether shes actually willing to bite the bullet on harvesting organs from living, consenting, permanently unconscious patients. For each, throw in a quick follow-up keyed to whatever dodge she's most likely to reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Organ donation, specifically the definition of death (whole-brain death vs. biological fact vs. legal fiction) and the Dead Donor Rule (DDR).
      *   **Interviewee:** A philosopher of medicine known for arguing that whole-brain death is a legal fiction and advocating for scrapping the DDR.
      *   **Goal:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Do not let her just restate her thesis (push deeper).
          *   Must include a question on Shewmon-style chronic survival cases (growth, healing, pregnancy) and their impact on her "fiction" argument.
          *   Must include a question on Circulatory-Death (DCD) protocols (waiting time, auto-resuscitation, "permanent" vs. "irreversible").
          *   Must include a question on what remains of the DDR on her view and the "bullet" of harvesting from living, consenting, permanently unconscious patients.
          *   Each question needs a specific follow-up keyed to a likely dodge.

  2.  **Deconstruct the Interviewee's Position:**
      *   *Core Claim:* Whole-brain death (WBD) isn't biological death; it's a legal fiction to facilitate transplants.
      *   *Proposal:* Scrap the Dead Donor Rule (DDR).
      *   *Implication:* We should be honest that we are taking organs from bodies that might still have some biological integration, provided there is consent/benefit.
      *   *Potential Weak Points/Dodges:*
          *   "It's about moral status, not biology."
          *   "We still respect the body."
          *   "The alternative is worse (black markets, loss of trust)."
          *   "Consciousness is what matters, not heartbeat."
          *   "Shewmon's cases are outliers."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Foundation):* Need to move past "It's a fiction." Ask about the *cost* of that fiction.
          *   *Draft:* You say WBD is a fiction. What does admitting that change practically?
          *   *Refinement:* Focus on the *function* of the fiction. If it's a fiction, does it deceive families?
          *   *Follow-up:* If she says "families understand," challenge that with data on misunderstanding.

      *   *Question 2 (Shewmon/Chronic Survival):* *Required.* Focus on the biological integration argument.
          *   *Draft:* What about the cases where bodies grow or get pregnant after WBD? Does that prove you right?
          *   *Refinement:* Does this biological integration undermine the "fiction" utility? If the body integrates, is the fiction harmful?
          *   *Follow-up:* If she says "those are rare," ask if rare exceptions invalidate a biological rule.

      *   *Question 3 (DCD/Permanent vs. Irreversible):* *Required.* Focus on the semantics of death determination.
          *   *Draft:* Why do we wait only 2 minutes for DCD? Isn't auto-resuscitation possible?
          *   *Refinement:* Focus on the shift from "irreversible" to "permanent." Is this a semantic trick to make the patient dead faster?
          *   *Follow-up:* If she says "it's practical," ask if practicality trumps biological accuracy.

      *   *Question 4 (The Dead Donor Rule):* *Required.* Focus on the "bullet biting."
          *   *Draft:* If we scrap DDR, can we take organs from living people?
          *   *Refinement:* Be specific: Permanently unconscious, consenting. Is this essentially euthanasia for organs?
          *   *Follow-up:* If she says "consent solves it," ask about the slippery slope to non-consenting or vulnerable populations.

      *   *Question 5 (Public Trust):* A classic objection to her view.
          *   *Draft:* Won't people stop donating if they know you're alive?
          *   *Refinement:* You argue honesty builds trust. But if the public realizes the "dead" donor was biologically alive, won't trust collapse?
          *   *Follow-up:* If she says "trust is based on transparency," ask if transparency reveals something horrifying to the average person.

      *   *Question 6 (Moral Status vs. Biological Death):* Philosophical nuance.
          *   *Draft:* Is biological death even the right metric?
          *   *Refinement:* If WBD is a fiction, are you actually arguing for a *personhood* theory of death rather than a biological one?
          *   *Follow-up:* If she says "yes," ask why we use medical criteria for a philosophical status.

      *   *Question 7 (The "Killing" Distinction):* The causality issue.
          *   *Draft:* Does taking organs kill the patient?
          *   *Refinement:* If the patient isn't dead, does organ procurement *cause* death? If so, how is that distinct from active euthanasia?
          *   *Follow-up:* If she says "they were going to die anyway," ask about the timing and agency.

      *   *Question 8 (International Context):* Broaden the scope.
          *   *Draft:* Do other countries do this?
          *   *Refinement:* Some countries use "cardiac death" more loosely. Does your view align more with utilitarian systems?
          *   *Follow-up:* If she says "no," ask why the US specific legal framework matters. (Decided to skip this one to focus more on the ethical core).
          *   *Alternative Q8 (The Alternative):* If not DDR, what is the guardrail?
          *   *Refinement:* If we remove the "dead" requirement, what prevents commodification?
          *   *Follow-up:* If she says "regulation," ask who regulates the regulators.

      *   *Question 9 (The Family's Grief):* Emotional impact.
          *   *Draft:* How does this affect grieving?
          *   *Refinement:* Does telling a family "your loved one is biologically alive but we are taking their heart" complicate grief more than the current fiction?
          *   *Follow-up:* If she says "grief is the same," challenge the psychological difference between death and execution.

      *   *Question 10 (Conclusion/Policy):* Actionable steps.
          *   *Draft:* What should we do tomorrow?
          *   *Refinement:* If legislature adopted your view, what is the *first* change to the consent form?
          *   *Follow-up:* If she says "disclosure," ask if disclosure would lower donation rates significantly.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Shewmon included? Yes. DCD/Permanent vs. Irreversible included? Yes. DDR/Bullet-biting included? Yes. Follow-ups included? Yes.
      *   Tone check: Needs to be rigorous, respectful, but probing. Avoid being antagonistic, but prevent vague philosophical drifting.
      *   *Self-Correction on Q2 (Shewmon):* Make sure the follow-up addresses the "fiction" aspect specifically. If the body integrates, the "death" claim is biologically false. Does that make the fiction *dangerous*?
      *   *Self-Correction on Q3 (DCD):* Ensure the distinction between "permanent" (won't restart on its own) and "irreversible" (can't be restarted) is clear in the prompt.
      *   *Self-Correction on Q4 (DDR):* Make sure the "living, consenting" part is highlighted.

  5.  **Final Polish:** Organize logically. Start with the core definition, move to specific medical cases (Shewmon/DCD), then to the ethical implications (DDR/Euthanasia), and end with public trust/policy. (Decided to reorder for flow).

      *   *Order:*
          1.  The "Fiction" & Deception (Intro)
          2.  Shewmon/Chronic Survival (Biological reality)
          3.  DCD/Permanent vs. Irreversible (Semantic shifting)
          4.  Moral Status vs. Biology (Philosophical grounding)
          5.  The DDR & "Bullet Biting" (Core ethical implication)
          6.  Causation of Death (Killing vs. Letting Die)
          7.  Public Trust (Practical consequence)
          8.  Guardrails (What replaces DDR?)
          9.  Family/Grief (Human element)
          10. Policy/Consent (Actionable)

