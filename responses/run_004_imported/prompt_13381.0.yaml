answer: |-
  You are remembering correctly. The intervention you are recalling is almost certainly **Amartya Sen's 1977 paper, "Rational Fools: A Critique of the Behavioral Foundations of Economic Theory."**

  Your brother-in-law's argument is the standard neoclassical position, and within the strict axioms of Revealed Preference Theory (RPT), he is technically correct. However, as Sen and others have argued, this correctness comes at the cost of rendering the theory tautological and incapable of distinguishing between different types of motivation.

  Here is the technical breakdown of the argument, the implications of RPT, and the specific distinction Sen introduced to rescue the concept of self-sacrifice.

  ### 1. The Brother-in-Law's Case: The Tautology of Revealed Preference

  To understand why your brother-in-law feels unmoved, we must look at the axioms of standard microeconomic theory.

  **The Logic:**
  1.  **Definition of Utility:** In neoclassical economics, "utility" is not a psychological state of happiness; it is an ordinal ranking of preferences. If you choose $A$ over $B$, you reveal that $A \succeq B$ (A is preferred or equal to B).
  2.  **The Maximization Assumption:** Agents act to maximize their utility function.
  3.  **The Conclusion:** Therefore, whatever you choose is, by definition, what maximizes your utility.

  **The "All Things Considered" Clause:**
  Economists handle altruism by expanding the arguments of the utility function. Your utility function $U$ is not just a function of your income ($I$); it is a function of income, status, moral satisfaction, guilt avoidance, etc.
  $$U = f(I, \text{Status}, \text{Moral Satisfaction}, \dots)$$

  If you chose the nonprofit job (lower $I$) over the consulting job (higher $I$), the model infers that the marginal utility gained from "Moral Satisfaction" outweighed the marginal utility lost from Income.

  **The Implication:**
  Under this framework, **self-sacrifice is impossible.** To choose an option is to prefer it. To prefer it is to maximize your utility. Therefore, you never sacrifice your utility; you merely maximize it through a different bundle of goods (including "moral goods").

  **The Technical Cost:**
  The strength of this argument is also its fatal weakness: **Unfalsifiability.** If every possible action is explained by positing a preference that justifies that action, the theory cannot be tested. As the economist Daniel Hausman has noted, if RPT explains everything, it predicts nothing. It collapses the distinction between "selfish" and "unselfish" because "selfish" simply becomes "acting on one's preferences," and since everyone always acts on their preferences, everyone is always "selfish" in the economic sense.

  ### 2. Amartya Sen's Critique: Sympathy vs. Commitment

  Sen argued that while the neoclassical model is internally consistent, it is behaviorally impoverished. It fails to capture the nuance of human agency. His primary contribution to this debate is the distinction between **Sympathy** and **Commitment**.

  #### A. Sympathy (Compatible with RPT)
  Sympathy occurs when your welfare is causally dependent on the welfare of others.
  *   *Example:* You give money to a friend because seeing them happy makes *you* feel happy.
  *   *RPT Status:* This is fully compatible with your brother-in-law's view. Your utility function includes the friend's welfare ($U_{me} = f(W_{me}, W_{friend})$). You are still maximizing your own welfare; it just happens that your welfare is tied to theirs. This is often called "impure altruism" or the "warm glow" effect.

  #### B. Commitment (Incompatible with RPT)
  Commitment occurs when you choose an act that you know will **lower your personal welfare**, not because it boosts your welfare via sympathy, but because you feel bound by a principle, duty, or social norm.
  *   *Example:* You refuse to cross a picket line, even though you need the money, you don't know the workers, and crossing wouldn't make you feel guilty (perhaps you are stoic). You do it because you believe it is *right*.
  *   *RPT Status:* This breaks the link between **Choice** and **Personal Welfare Maximization**.

  Sen's crucial insight is that RPT conflates *choice* with *welfare*.
  *   **Standard View:** Choice $\rightarrow$ Revealed Preference $\rightarrow$ Maximized Personal Welfare.
  *   **Sen's View:** Choice $\rightarrow$ Revealed Preference $\neq$ Maximized Personal Welfare.

  In cases of commitment, you choose $A$ over $B$, but you acknowledge that $B$ would have resulted in higher personal welfare for you. You have chosen against your own welfare. This is the technical definition of self-sacrifice that RPT attempts to define away.

  ### 3. Technical Wrinkles: Meta-Rankings and Identity

  Sen further complicated the picture with the concept of **Meta-Rankings** (or second-order preferences).

  In standard theory, preferences are given and fixed. Sen argued humans have preferences *about* their preferences.
  *   *First-order preference:* "I prefer the high-paying consulting job (more money)."
  *   *Second-order preference:* "I prefer to be the kind of person who prefers the nonprofit job."

  When you act on the second-order preference, you are overriding your immediate welfare maximization to satisfy an identity constraint. This creates a wedge between "well-being" (your personal state) and "agency" (your ability to act on values).

  If your brother-in-law argues that satisfying the second-order preference *is* utility maximization, Sen would reply that this stretches the definition of "utility" until it snaps. If "utility" includes acting against one's own well-being for a principle, then "maximizing utility" no longer means "doing what is best for oneself." It just means "doing what one does." At that point, the term "self-interest" has been emptied of meaning.

  ### 4. Other Objections from Within and Outside Economics

  While Sen provides the most famous philosophical rebuttal, there are other technical objections to your brother-in-law's claim.

  **A. The "Empty Organism" Objection (Behavioral Economics)**
  RPT assumes consistent preferences. However, behavioral economics shows that preferences are often constructed in the moment and inconsistent (intransitive). If preferences aren't stable, then "revealing" them is incoherent. If you chose the nonprofit today but would choose consulting tomorrow under identical conditions, there is no stable "utility" being maximized, selfish or otherwise.

  **B. The Predictive Failure**
  If the brother-in-law's view were true, we could not predict behavior based on incentives. If a person sacrifices their life for a cause, the economist must say, "They must have valued martyrdom more than life." This explains the past but predicts nothing about the future. A theory that distinguishes between self-interest and commitment allows for predictions: e.g., people acting on commitment are less responsive to price incentives (money) than people acting on sympathy or self-interest.

  **C. Jon Elster and "Sour Grapes"**
  Philosopher Jon Elster argued that RPT ignores the formation of preferences. If you stay at the nonprofit and convince yourself you prefer it to avoid cognitive dissonance (adaptive preference formation), RPT treats that as a genuine preference. Sen's framework allows us to say, "You chose this, but it is not actually good for you, and you only claim to prefer it to cope." This preserves the notion of sacrifice (you gave up the good for the coping mechanism).

  ### 5. Conclusion: Does the Framework Collapse the Distinction?

  **Yes, the standard Revealed Preference framework does collapse the distinction.**
  If you accept the axioms of neoclassical economics without modification, your brother-in-law is right. In that model, "self-sacrifice" is a semantic error. There is only utility maximization. To claim otherwise is, in that framework, unscientific.

  **However, that collapse is widely regarded as a bug, not a feature.**
  Most modern welfare economists and philosophers of economics accept Sen's critique. They acknowledge that while RPT is useful for modeling market behavior (buying apples vs. oranges), it is insufficient for modeling moral behavior.

  **The Principled Rebuttal:**
  You can rebut your brother-in-law not by denying logic, but by denying the **identity of Choice and Welfare.**

  You can say:
  > "Revealed Preference Theory defines 'utility' as 'whatever is chosen.' Under that definition, you are right; my choice reveals my preference. But that definition makes 'utility' synonymous with 'action,' which strips it of explanatory power.
  >
  > Amartya Sen distinguishes between **Sympathy** (where my welfare depends on yours) and **Commitment** (where I act against my welfare due to principle). If I stay at the nonprofit, I may be lowering my personal well-being (income, leisure) to satisfy a commitment. RPT cannot see this distinction because it assumes Choice = Well-Being. I am arguing that Choice $\neq$ Well-Being. Therefore, self-sacrifice is possible: it is the gap between what I chose and what would have maximized my personal welfare."

  **Summary:**
  Your brother-in-law is defending a **tautology** (Choice reveals Preference). You are defending a **phenomenological reality** (Commitment involves sacrificing welfare). The economic framework collapses the distinction only by defining "welfare" so broadly that it includes "acting on commitment." Sen's contribution was to show that if we want economics to explain human behavior rather than just describe it mathematically, we must allow for the possibility that people sometimes choose what is *not* best for them.
