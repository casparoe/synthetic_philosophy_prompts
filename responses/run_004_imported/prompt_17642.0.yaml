answer: |-
  You haven't gotten anything wrong, and your intuition is spot-on. In fact, you've stumbled directly into one of the most famous results in social choice theory.

  The short answer is: **Yes, this is unavoidable.** There is a mathematical proof that guarantees exactly what you experienced.

  The longer answer involves distinguishing between the specific quirks of the app you used (Instant-Runoff Voting) and the fundamental limits of *any* voting system. Since you write about this, I'll break it down into the specific mechanism that failed at dinner, the theorem that governs all systems, and the nuance you might want to incorporate into your future explainers.

  ### 1. The Specific Glitch: IRV and Non-Monotonicity
  The app you used employed **Instant-Runoff Voting (IRV)**. While IRV is excellent at solving the "spoiler effect" (where a third candidate splits the vote and hands the win to a disliked majority choice), it is **not monotonic**.

  In a monotonic system, voting *for* a candidate should never hurt their chances, and voting *against* them should never help them. IRV violates this.

  Here is likely what happened at your dinner:
  *   **Round 1:** Sushi and Burger split the "strong preference" vote. Pizza had steady, lukewarm support.
  *   **The Elimination:** Because you (and perhaps others) voted honestly for Sushi first, Sushi didn't have enough first-place votes to survive the first cut. Sushi was eliminated.
  *   **The Transfer:** Sushi's votes transferred to their second choices (likely Burger).
  *   **The Final:** It became Burger vs. Pizza. Pizza won.

  **The Strategic Flip:**
  *   If you had voted **Pizza > Sushi > Burger**:
  *   **Round 1:** Pizza gains a vote; Sushi loses one.
  *   **The Elimination:** Crucially, this shift might have caused **Burger** to be eliminated instead of Sushi (perhaps Burger was only ahead of Sushi by a vote or two).
  *   **The Transfer:** Burger's votes transfer. If Burger voters prefer Sushi over Pizza (the "rival" dynamic you mentioned), those votes flow to Sushi.
  *   **The Final:** It becomes Sushi vs. Pizza. Sushi wins.

  By voting *against* your favorite (Sushi) and *for* your least favorite (Pizza), you changed the elimination order to save your favorite. This is a classic **non-monotonicity failure**. It is a known, documented weakness specific to IRV.

  ### 2. The Deep Truth: Gibbard-Satterthwaite Theorem
  You asked if a "cleverer counting method" could design this away. The answer, mathematically, is **no**.

  In the early 1970s, Allan Gibbard and Mark Satterthwaite independently proved a theorem that settles this debate. The **Gibbard-Satterthwaite Theorem** states that for any voting system that meets three basic conditions:
  1.  It allows three or more outcomes.
  2.  It is deterministic (the votes determine the winner, not a die roll).
  3.  It is not a dictatorship (one person doesn't just decide).

  **...the system is manipulable.**

  There will *always* be scenarios where a voter can achieve a better outcome by voting insincerely than by voting honestly. This applies to IRV, Condorcet methods, Borda counts, and essentially any ranked system you can devise.

  So, when you read marketing from RCV advocates claiming it "eliminates strategic voting," they are technically incorrect. A more accurate claim is that it *reduces the incentive* for strategic voting in *most* common scenarios, or that it removes the specific strategy of "lesser-evil voting" found in Plurality (First-Past-The-Post) systems. But it cannot eliminate strategy entirely.

  ### 3. Is It Settled Science?
  Yes, the math is settled. The Gibbard-Satterthwaite theorem is as solid as Pythagoras'. However, the *practical interpretation* is where political scientists and mathematicians still debate.

  **The "Information Problem"**
  While a voting system might be *theoretically* manipulable, it might be *practically* strategy-proof. To successfully vote strategically in IRV (like you did in your reconstruction), you need to know exactly how everyone else is voting. You needed to know that shifting one vote would swap the elimination order of Sushi and Burger.

  In a small dinner of 8 people, you can reconstruct the ballots. In a city election of 500,000 people, you have no idea if your strategic vote will help or hurt. It might cause your favorite to be eliminated even earlier. Therefore, many theorists argue that while *perfect* strategy-proofness is impossible, some systems make successful manipulation so difficult (due to lack of information) that honesty remains the best *practical* strategy.

  **Cardinal vs. Ordinal**
  There is one loophole in Gibbard-Satterthwaite: it applies to **ordinal** systems (ranking candidates A > B > C). It does not strictly apply to **cardinal** systems (rating candidates 0–5 stars), such as **Score Voting** or **Star Voting**.

  In Score Voting, you can still strategize (by "bullet voting"—giving your favorite 5 stars and everyone else 0), but you cannot create the paradoxical elimination orders seen in IRV. Many voting theorists argue that cardinal systems are more robust against the specific kind of frustration you felt, though they introduce different complexities.

  ### 4. Advice for Your Writing
  Since you write explainers on this, here is how you might refine your pitch based on this experience:

  1.  **Distinguish "Spoiler Effect" from "Strategy Proofing":** RCV is very good at fixing the spoiler effect (where Nader voters cost Gore the election). It is not good at fixing strategy-proofing. Conflating the two weakens your argument when people encounter IRV failures like yours.
  2.  **Acknowledge the Trade-off:** No system is perfect. Plurality voting encourages "lesser of two evils" strategy. IRV encourages "burial" or "compromise" strategy (as you saw). Score Voting encourages "exaggeration" strategy. The goal isn't a perfect system; it's choosing which flaws we prefer.
  3.  **The "Honesty" Claim:** Instead of saying RCV allows people to "vote their conscience without fear," a more precise claim is "RCV reduces the fear that a vote for a preferred candidate is a wasted vote."

  ### Summary
  You didn't do the math wrong. You experienced a **non-monotonicity failure** inherent to **Instant-Runoff Voting**, which is a specific instance of the broader **Gibbard-Satterthwaite Theorem**.

  It is a settled mathematical fact that **no ranked voting system with 3+ options can be completely immune to strategic voting.** The frustration you feel is the sound of mathematical reality colliding with political marketing. You are in good company; this paradox bothers mathematicians just as much as it bothers you.
