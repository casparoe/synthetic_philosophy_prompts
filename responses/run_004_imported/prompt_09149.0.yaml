      *   **Scene 4: The Climax/Resolution.** The regress threat. The moment where it could hang forever. The Löbian leap.
      *   **Scene 5: Aftermath.** The result. Cooperation. The humans are confused but relieved.

  5.  **Refining the Logic for the Story:**
      *   I need to make sure I don't misrepresent the math too badly, even if it's fiction.
      *   *The Trick:* The programs aren't just simulating each other (which causes infinite loops). They are searching for *proofs* within a formal system.
      *   *The Fragility:* If the formal systems don't match, or if the timeout is too short, the proof search fails, and they default to Defect.
      *   *Visualizing the Regress:* Describe it as a mirror hallway. The "trick" is finding a window that looks out instead of into another mirror.

  6.  **Writing - First Pass (Mental or rough notes):**
