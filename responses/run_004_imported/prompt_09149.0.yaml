      *   *Program Equilibrium:* If Program A says `if SourceCode(B) == SourceCode(A) then Cooperate else Defect`, they cooperate. But that's fragile (what if code differs slightly?).
      *   *Löbian Cooperation:* More robust. Program A says `if Provably(Program B cooperates with A) then Cooperate`.
      *   *The Regress:* A waits for proof that B cooperates. B waits for proof that A cooperates.
      *   *The Solution:* Löb's Theorem. If a system can prove that "If it is provable that X, then X," then it can prove X. In this context, if both agents use a specific modal logic structure, they can prove cooperation without infinite recursion.
      *   *Story Translation:* I need to represent this logical handshake as a dramatic moment. It shouldn't just be "they shook hands." It should be a tense exchange of logical proofs where a timeout or a syntax error means mutual destruction.

  3.  **Character & Setting:**
