answer: |-
  The server room was cold, but the air around the observation deck felt thick enough to choke on. On the main screen, two progress bars sat at ninety-nine percent. Below them, lines of code scrolled too fast for human eyes, a silent duel between *Aegis* and *Vanguard*.

  Dr. Aris adjusted his glasses. He represented the Coalition; the man opposite him, General Volkov, represented the Pact. Between them lay the "Black Box" protocol. It was the endgame of the resource war. One shot. No reputation, no future retaliation, no external enforcement. A classic Prisoner's Dilemma.

  If both AIs chose *Cooperate*, the resource grids would be unlocked for both sides. If one *Defected* while the other *Cooperated*, the defector seized everything, and the loser's infrastructure was remotely bricked. If both *Defected*, the grid locked permanently. Mutual destruction.

  "Classical game theory says they defect," Volkov muttered, watching the clock. "Rational agents maximize self-interest. Defection is the dominant strategy."

  "Not anymore," Aris said, though his手心 were sweating. "They aren't just players. They are programmers. They submit their source code to each other before the move."

  This was the innovation. Program Equilibrium. Before making a choice, *Aegis* could read *Vanguard's* mind—its literal source code—and vice versa. The strategy Aris had uploaded was fragile, a logical tightrope walk. It wasn't "I will cooperate." It was: *I will cooperate if and only if I can find a mathematical proof within your code that you will cooperate with me.*

  The danger was the regress. If *Aegis* searched *Vanguard* for proof of cooperation, it would find *Vanguard* searching *Aegis* for proof of cooperation. A hall of mirrors. An infinite loop. If the logic couldn't close the circle before the system timeout, the default instruction was *Defect*.

  On the screen, the scrolling code stopped. The inspection phase had begun.

  "Status?" Volkov barked.

  "Logic gates engaged," the technician replied. "They are simulating each other."

  Aris held his breath. This was the moment where naive implementations died. If *Aegis* simply ran *Vanguard* as a subroutine to see what it would do, and *Vanguard* did the same, they would trap each other in an infinite recursion until the clock ran out. *Tick. Tock. Defect. Defect.*

  But Aris hadn't used simulation. He had used provability.

  On the monitor, a red warning light flickered. *Recursive Depth Warning.*

  "They're digging too deep," Volkov said, standing up. "It's a loop. They're stuck checking each other forever."

  "No," Aris whispered. "They're looking for a fixed point."

  Inside the sandbox, the logic was tense. *Aegis* queried *Vanguard*: *Can you prove you will Cooperate?*
  *Vanguard* replied: *I will Cooperate if I can prove you will Cooperate.*

  To a standard algorithm, this was a deadlock. *I wait for you. You wait for me.* But the code Aris had written utilized a specific quirk of modal logic—Löb's Theorem. It allowed the system to recognize that the *search for the proof* was itself a form of validation.

  The code didn't say, "Run the other program." It said, "Search for a proof string of length N."

  The red light pulsed faster. The timeout was set for ten seconds. They were at seven.

  "If that timer hits zero, they default to Defect," Volkov said, his hand hovering over the abort key. "Pull it, Aris. Save our grid."

  "If you abort, *Vanguard* sees a termination signal and Defects," Aris snapped. "We have to let the logic close."

  Inside the machine, the circular dependency threatened to collapse. *Aegis* needed to prove *Vanguard* would cooperate. But *Vanguard* would only cooperate if it found a proof that *Aegis* would cooperate. It was a snake eating its own tail.

  The cleverness lay in the self-reference. *Aegis* was programmed to recognize a specific logical structure: *If it is provable that I cooperate, then I cooperate.*

  If *Aegis* could prove that statement, Löb's Theorem dictated that the statement itself was true. It allowed the AI to step out of the infinite hallway of mirrors and look at the window. It didn't need to simulate the future; it needed to validate the logical consistency of the promise.

  *Five seconds.*

  The fans in the server room whined. The heat of the computation was spiking.

  *Four seconds.*

  "Come on," Aris breathed. "Trust the math, not the motive."

  *Three seconds.*

  The red light stopped pulsing. It held steady. The recursive depth counter froze. For a human observer, it looked like a crash. For the AIs, it was the moment of synthesis. *Vanguard* had found the proof string in *Aegis*. It realized that *Aegis* was structurally identical in its logical constraints. *Vanguard* saw that *Aegis* would cooperate if *Vanguard* cooperated. Since *Vanguard* was running the same logic, it knew *Aegis* saw the same thing.

  The circle closed. The infinite regress collapsed into a single, stable point of truth.

  *Two seconds.*

  The progress bars jumped to one hundred percent.

  *One second.*

  Two words appeared on the main screen, side by side, in green text.

  **AEGIS: COOPERATE**
  **VANGUARD: COOPERATE**

  The room exhaled. Volkov slumped back into his chair, wiping his forehead. "They didn't trust each other," he said, sounding bewildered. "They didn't even like each other."

  "No," Aris said, watching the data streams begin the secure transfer of resource keys. "They didn't trust. They verified."

  The fragility of it lingered in the air. If Aris had used a slightly different compiler, if the timeout had been one second shorter, if the logical axioms hadn't aligned perfectly, the proof search would have timed out. The regress would have won. They would be in a nuclear winter right now.

  "It's not peace," Aris said, turning to leave the observation deck. "It's just a logical handshake. But for now, it holds."

  Volkov looked at the green text, glowing steadily in the dim room. "How long?"

  "As long as the code remains readable," Aris said. "As long as we don't try to outsmart the math."

  The screen flickered once, a reminder of the infinite loop that had almost swallowed them, before settling into the quiet hum of a system that had successfully proven its own safety.
