answer: |-
  The seed merchant came in the spring, when the frost had just lifted from the lower fields. He brought sacks of a new grain, hard-shelled and dark, promising yields that made the old wheat look like chaff.

  "If the rains hold," the merchant said, spreading a handful on Elias's table, "you'll gain half again what you plant. If the blight comes, you'll lose four tenths. But the blight is rare. The average harvest is higher. Any man who wants to grow should plant this."

  Elias looked at Kael. They had farmed adjacent plots for twenty years, shared tools, and swapped labor during the threshing. They trusted each other's judgment on soil and weather. But this was different. This was about how much of their stored grain to risk.

  Elias emptied his barn. He took every sack of seed from the previous year, every reserve meant for lean times, and bought the dark grain. He planted it all. The logic was simple: the harvest was better than the seed. Why hold back what could grow?

  Kael bought the dark grain too. But he took only a quarter of his store. He kept the rest in the old bins, sealed against rats and damp.

  "You're hoarding," Elias said, watching Kael's men carry the leftover sacks back into the shadows of his barn. "The merchant said the average is up. You're leaving growth on the table."

  "I'm keeping seed for next year," Kael said. He didn't look at Elias. He looked at the sky, which was clear and blue.

  "Next year will take care of itself," Elias said. "If we win big this year, we won't need the old seed."

  The summer was wet and kind. The dark grain surged, tall and heavy. When the threshing came, Elias's barn groaned. He had fifty percent more grain than he had planted. He was rich. He laughed across the fence at Kael, whose harvest was modest. Kael's barn was fuller than before, but only by a fraction. Elias's was overflowing.

  "Look at you," Elias called out, leaning on his scythe. "You could have had this. You were afraid."

  Kael wiped his brow. "The winter is long, Elias."

  "The winter is short when you're full."

  Elias ate well that winter. He traded surplus for new tools, for a better plow, for repairs on the roof. He felt the warmth of correctness. Kael came over sometimes, quiet, checking the locks on his own bins. Elias felt a pang of pity for his friend. It was a sickness, this caution. To have the chance for plenty and to choose scarcity. It wasn't just timid; it was irrational. Why live in the past when the future offered more?

  The second spring, Elias planted everything again. Why wouldn't he? The grain had proven itself. He expanded his fields, clearing the rocky edge of his land to plant more. Kael planted his quarter again. He stored the rest.

  "You're doing it again," Elias said. "You think I got lucky."

  "I think the blight comes when it comes," Kael said.

  "It's a favorable bet," Elias said, using a word he'd heard the merchant use. "You take the bet."

  "I take the bet," Kael said. "I just don't bet the farm."

  The second summer was dry. The blight didn't come, but the yield was lower. Still, Elias gained. Not fifty percent, but enough. He was still ahead of where he started. Kael was ahead too, steady as a clock. But the gap between them was wide. Elias was a lord of the valley; Kael was a steady hand.

  Then came the third year. The rains failed completely. The blight arrived on the wind, a rust that ate the stalks before they could grain.

  When Elias walked his fields, the sound of the dry leaves crunching under his boots was louder than the wind. He harvested what he could. It was less than he had planted. He lost forty percent of his capital.

  He sat in his barn that evening. It was still fuller than it had been three years ago, but the slope was steep. He had to eat during the winter. He had to save seed for spring. The math of survival was harsh. If you lose forty percent, you need a sixty percent gain just to get back to where you were. And he had less to plant next year.

  Kael lost forty percent too. But he lost forty percent of a quarter of his store. The rest sat in the bins, untouched. When the threshing was done, Kael had enough to eat, enough to plant, and enough left over to lend.

  Elias didn't ask for a loan immediately. He tightened his belt. He sold the new plow. He sold the roof repairs.

  The fourth year, the rains returned. Elias planted everything he had left. He needed the big win. He needed the fifty percent surge to catch up to where he *should* have been. He watched Kael plant his quarter. The anger rose in Elias's throat, hot and bitter. Kael looked secure. Too secure. It was insulting.

  "You're still hiding," Elias said. "We're both playing the same game. Why are you acting like the rules don't apply to you?"

  "The rules apply," Kael said. "But I'm the one playing them. You're letting the game play you."

  "I'm maximizing," Elias snapped. "I'm taking the positive edge. You're just... drifting."

  "Drifting stays afloat," Kael said.

  The fifth year was good. Elias surged. He felt the old fire. He was back. Almost. But he hadn't caught Kael. Kael's barn was full, not because of one big harvest, but because it had never been emptied. It was a slow accumulation, layer upon layer, like sediment in a riverbed.

  The sixth year was bad. Another loss.
  The seventh year was good. A gain.
  The eighth year was bad.

  Elias stopped counting the percentages. He only counted the sacks. Each loss took more out of him than the gain put back in. He realized, with a cold dread in his stomach, that he was running in place. He was working harder, clearing more land, risking more sleep, and yet his barn was shrinking. The average was good, the merchant had said so. The average was positive. But the average was a lie told by a crowd of ghosts. Elias was not a crowd. He was one man. He had one timeline.

  Kael's barn grew. It wasn't dramatic. There were no overflowing sacks to boast about. But when the winter storms came, Kael's hearth was warm. When the seed merchant came back the next spring, offering a new strain with even higher risks and higher rewards, Kael shook his head.

  Elias looked at the merchant. He looked at his own bins, which were half empty. He looked at Kael's bins, which were full.

  "If I plant it all," Elias said, his voice rough, "and I win, I catch up."

  "And if you lose?" Kael asked.

  "Then I start over."

  "You don't start over," Kael said softly. "You start from zero. And the ground doesn't give credit."

  Elias bought the seed. He didn't plant it all. He looked at the sacks in his hand, then at the empty space in the bin. He put half back. He kept half.

  He walked out to the field. The soil was dark and waiting. He scattered the seed. It felt lighter than it used to. He looked over at Kael's field, where his friend was walking the rows, checking the spacing, calm and unhurried.

  Elias went back to the barn. He sat on a crate. He watched the dust motes dance in the light coming through the slats. He thought about the years he had won, and how they felt like validation. He thought about the years he had lost, and how they felt like theft.

  He understood, finally, that the win hadn't been real. It was only real if he could have taken the money and left the game. But the game was life. You couldn't leave. You had to stay at the table. And at this table, the only way to win was to refuse to lose everything, even when the odds said you should bet it all.

  Kael came to the door. He didn't say anything. He just leaned against the frame, watching the light shift across the floor.

  "It's a good season," Kael said eventually.

  "It's a season," Elias said.

  They stood there together, listening to the wind in the eaves, waiting for the harvest, neither of them knowing what the next throw of the dice would bring, but both knowing exactly how much they could afford to lose.
