      *   *The Meta-Problem:* Why do we *think* there is a hard problem? Why do we report having subjective experience that seems irreducible?
      *   *Tractability:* The meta-problem is "easy" (in the technical sense) because it deals with behavior, reports, and cognitive mechanisms, which are amenable to standard scientific explanation. The hard problem resists this.
      *   *Illusionism vs. Realism:*
          *   *Illusionists (e.g., Frankish, Dennett):* Solving the meta-problem *dissolves* the hard problem. If we explain why we *think* we have irreducible experience, and that explanation shows the belief is false/misleading, there's nothing left to explain. Consciousness (phenomenal) is an illusion.
          *   *Realists (e.g., Chalmers):* Solving the meta-problem is useful but doesn't *solve* the hard problem. Even if we know why we report experience, the question remains: why is there *actual* experience accompanying that report? Chalmers is *not* an illusionist. He is a property dualist / panpsychist (generally). He thinks the hard problem is real.

