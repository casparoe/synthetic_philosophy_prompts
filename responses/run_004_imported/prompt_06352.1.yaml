prompt: |-
  I'm working on a feature about the intellectual ancestry of market-based governance, and I want to examine how Nicolas de Condorcet's own arguments would hold up against futarchy — Robin Hanson's proposal that societies should "vote on values but bet on beliefs." Under futarchy, citizens would democratically choose a measurable welfare metric (GDP or some broader index), then let speculative markets, via conditional bets on rival policies, decide which policy is expected to maximize it, on the premise that market prices aggregate dispersed information more reliably than deliberation or majority voting ever could. Condorcet is the obvious precedent to test this against: his 1785 jury theorem and his broader program of "social mathematics" tried to demonstrate, with actual probability calculus, when and why collective judgment outperforms any individual's, and he risked — and ultimately lost — his life drafting a constitution built on that same rationalist confidence. Working strictly from his own writings and commitments rather than generic Enlightenment-rationalist impressions, tell me whether he would have recognized futarchy as the fulfillment of his project or rejected it, and why. Please surface the point where his own principles pull against each other: his insistence on political equality and his wariness of concentrated factional power sit uneasily beside a system in which influence over policy scales with capital at risk, even as his faith in mathematized collective judgment could just as easily make him the mechanism's most natural champion. Give me his single most plausible verdict, not a survey of possibilities.
reasoning: |-
  Here's a thinking process that leads to the suggested verdict:

  1.  **Analyze the Request:**
      *   **Topic:** Intellectual ancestry of market-based governance, specifically comparing Nicolas de Condorcet's arguments to Robin Hanson's Futarchy ("vote on values, bet on beliefs").
      *   **Task:** Determine Condorcet's *single most plausible verdict* (acceptance or rejection) based *strictly* on his own writings and commitments.
      *   **Key Tension:** Condorcet's faith in mathematized collective judgment (Jury Theorem) vs. his insistence on political equality and wariness of factional power/wealth concentration.
      *   **Constraint:** Do not give a survey of possibilities. Give one definitive verdict. Surface the internal tension but resolve it.

  2.  **Deconstruct Condorcet's Core Principles (based on his writings):**
      *   *The Jury Theorem (1785):* If voters are competent (>50% chance of being right) and independent, majority rule converges on truth as group size increases. This is the epistemic argument for democracy.
      *   *Social Mathematics:* Politics should be grounded in probability and reason, not tradition or force.
      *   *Political Equality:* Universal suffrage (including women, which was radical), equal weight of votes. One person, one vote.
      *   *Anti-Oligarchy/Wealth:* Condorcet was wary of wealth distorting political power. He advocated for public education to ensure competence (the $p > 0.5$ condition). He distrusted the "aristocracy of wealth."
      *   *The Goal:* The "common good" or "public utility," discovered through rational deliberation and aggregation.
      *   *Constitutional Drafting:* He worked on a constitution (1793) that emphasized direct democracy, frequent elections, and mandates to prevent representation from becoming a separate interest.

  3.  **Deconstruct Futarchy (Hanson's Proposal):**
      *   *Mechanism:* Vote on a welfare metric (values), bet on policies (beliefs).
      *   *Epistemic Claim:* Markets aggregate information better than voters because participants have skin in the game (incentives to be right) and prices reflect dispersed knowledge.
      *   *Power Distribution:* Influence scales with capital wagered. Wealthy actors have more say on *beliefs* (which policy works), even if everyone votes on *values*.

  4.  **Evaluate the Fit (Condorcet vs. Futarchy):**

      *   *Point of Convergence (The Epistemic Hope):* Condorcet would love the idea of using a mathematical mechanism to find the "truth" about policy efficacy. He wanted to remove passion and error from governance. Futarchy claims to do this via market pricing. Condorcet's faith in "social mathematics" aligns with the *intent* of using a calculus to determine the best outcome.
      *   *Point of Divergence (The Mechanism of Aggregation):*
          *   Condorcet's Jury Theorem relies on *independent* judgments weighted *equally*.
          *   Futarchy relies on *weighted* judgments based on *capital*.
          *   Condorcet assumes competence ($p > 0.5$) is achieved through education and civic virtue.
          *   Futarchy assumes incentives (profit) drive competence.
      *   *Point of Divergence (Equality vs. Plutocracy):* Condorcet was a staunch egalitarian. He argued for universal suffrage. Futarchy effectively creates a plutocracy regarding policy selection. If I have \$1 million and you have \$10, my belief counts 100,000 times more than yours in the market mechanism.
      *   *The "Independence" Condition:* Condorcet's theorem fails if voters are influenced by others (correlated errors). Markets are prone to bubbles and manipulation (correlated errors via herd behavior or insider power). Condorcet worried about factions; markets can be cornered by factions with deep pockets.

  5.  **Resolve the Tension (The Verdict):**
      *   *The Tension:* Condorcet wants the *result* (truth-tracking) but demands the *process* (equality) be just. Futarchy promises the result but violates the process.
      *   *Which weighs heavier?* Condorcet's entire political project was about *emancipation* through reason. He believed inequality (especially in education and wealth) was the primary barrier to the Jury Theorem working. If you introduce a system where wealth dictates policy outcomes, you violate the condition of independence and equality necessary for the "general will" to emerge.
      *   *The "Social Mathematics" aspect:* Condorcet didn't just want *any* math; he wanted the math of *equal citizens*. He explicitly argued against systems where wealth translates to political power (e.g., censitary suffrage).
      *   *Conclusion:* He would reject Futarchy. Why? Because the mechanism corrupts the independence and equality required for the epistemic benefit to actually materialize. He would see market weighting as a new form of aristocracy that violates the $p > 0.5$ independence assumption by allowing wealthy factions to manipulate prices or drown out dispersed information.

  6.  **Drafting the Argument (Iterative refinement):**
      *   *Opening:* State the verdict clearly. (Rejection).
      *   *The "Yes" part:* Acknowledge why it looks tempting. The desire to use probability to find the common good. The dissatisfaction with simple majoritarianism's vulnerability to ignorance.
      *   *The "No" part (The Core):* The Jury Theorem requires *equal weight* and *independence*. Futarchy violates equal weight (capital weighting). It violates independence (markets allow coordination/manipulation by large players).
      *   *The Wealth Factor:* Condorcet's 1793 Constitution and his *Sketch for a Historical Picture of the Progress of the Human Mind* show his commitment to equality of condition as a prerequisite for rational politics. Futarchy makes wealth the arbiter of truth.
      *   *The Internal Conflict:* Acknowledge the tension (Math vs. Equality). Resolve it by showing that for Condorcet, Math *serves* Equality. You can't have the math work without the equality.
      *   *Final Polish:* Ensure the tone is analytical and grounded in his specific concepts (Jury Theorem, independence, competence, aristocracy of wealth).

  7.  **Refining the Verdict:**
      *   Is it possible he'd accept it as a transitional tool? Unlikely. He was a principled radical.
      *   Is it possible he'd accept the "vote on values" part? Yes, but the prompt asks about Futarchy as a system of governance (which hinges on the betting).
      *   *Key Insight:* Condorcet's Jury Theorem proves that *equal* votes yield truth *if* competence is above random. Futarchy assumes markets yield truth *because* votes are *unequal* (weighted by capital/skill). Condorcet would argue that weighting by capital introduces bias (correlated error) that breaks the theorem.
      *   *Decision:* He would reject it as a violation of the conditions required for collective rationality to function.

  8.  **Final Review against Constraints:**
      *   Strictly from his writings/commitments? Yes (Jury Theorem, 1793 Constitution, views on wealth).
      *   Surface the tension? Yes (Epistemic optimism vs. Egalitarian ethics).
      *   Single plausible verdict? Yes (Rejection).

  9.  **Constructing the Output:** (Drafting the response following the thought process above.)
      *   *Headline:* Rejection.
      *   *Reasoning:* The Jury Theorem's conditions (Independence/Equality) vs. Market Mechanics (Weighting/Manipulation).
      *   *The Tension:* Acknowledge the allure of "Social Mathematics" but explain why the *type* of math matters.
      *   *Closing:* The moral-epistemic link.

      *(Self-Correction during drafting)*: Make sure not to paint Condorcet as a modern egalitarian in the socialist sense, but as a liberal-republican egalitarian who feared the "aristocracy of the rich." Ensure the distinction between "values" (voting) and "beliefs" (betting) is addressed. Condorcet would argue you cannot separate them cleanly, and allowing wealth to decide beliefs effectively decides values.

      *(Refining the "Independence" argument)*: Condorcet knew that if voters communicate or are influenced, the theorem fails. Markets are essentially communication mechanisms that can lead to herding. He would see this as a bug, not a feature.

      *(Final Polish)*: Ensure the voice is authoritative and direct.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  Condorcet would reject futarchy.

  While the proposal's ambition to replace partisan wrangling with a mathematical mechanism for discovering the "true" policy outcome aligns with Condorcet's dream of a **social mathematics**, the specific mechanics of futarchy violate the necessary conditions of his **Jury Theorem** and contradict his foundational commitment to **political equality as a prerequisite for epistemic reliability**.

  Here is the breakdown of his verdict, surfacing the tension between his rationalism and his egalitarianism.

  ### The Allure: The Epistemic Promise
  Condorcet would initially recognize futarchy as a kindred spirit in its dissatisfaction with ordinary voting. In his *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785), Condorcet demonstrated that majority rule is only truth-tracking if the average voter competence ($p$) exceeds 0.5. He was acutely aware that without informed citizens, democracy degenerates into oligarchy or mob rule.

  He would appreciate futarchy's attempt to solve the "competence problem" by incentivizing accuracy. The idea that we should "vote on values" resonates with his view that the *goal* of society (public utility) must be determined by the general will, while the *means* (policy) should be determined by reason and evidence. To Condorcet, a market price that aggregates dispersed information looks, superficially, like a high-speed calculator for the general interest.

  ### The Fatal Flaw: Independence and Weighting
  However, Condorcet's rejection would stem from a rigorous application of his own probability calculus. The Jury Theorem relies on two non-negotiable conditions:
  1.  **Independence:** Voters must not be influenced by one another (no correlated errors).
  2.  **Equal Weight:** Each judgment must count equally.

  Futarchy violates both.

  **1. The Violation of Equal Weight (The Aristocracy of Capital)**
  Condorcet was a radical proponent of universal suffrage, including for women and non-property owners, precisely because he believed political right derives from human reason, not property. In futarchy, influence over policy scales with capital at risk. A billionaire's "belief" counts for infinitely more than a laborer's.

  For Condorcet, this reintroduces the **aristocracy of wealth** he fought to dismantle. He argued in his *Sketch for a Historical Picture of the Progress of the Human Mind* that inequality of wealth leads to inequality of power, which corrupts the formation of the general will. If policy selection is auctioned to the highest bidder (or the most confident speculator), the system no longer aggregates *judgment*; it aggregates *leverage*. Condorcet would argue this biases the $p$ value (competence) not toward truth, but toward the interests of the capital-holding class, violating the condition that the collective decision serves the common good.

  **2. The Violation of Independence (Market Herding)**
  Condorcet understood that for the math to work, errors must be random. If voters are swayed by a faction, the theorem collapses. Markets, however, are prone to bubbles, manipulation, and herding—systemic correlated errors. Condorcet would view speculative markets not as neutral aggregators, but as venues where concentrated factions can manipulate prices to signal false "beliefs." If a wealthy interest group can short a policy they oppose regardless of its efficacy, they break the link between price and truth. For Condorcet, a mechanism that allows concentrated power to distort the signal is mathematically inferior to a public deliberation protected by equality.

  ### Resolving the Tension: Equality *Is* the Math
  The core tension in your prompt is between Condorcet's faith in mathematized judgment and his wariness of concentrated power. Condorcet would resolve this by arguing that **equality is not merely a moral preference; it is an epistemic necessity.**

  He did not believe the Jury Theorem worked *despite* equality; he believed it worked *because* of it. Only when every citizen is equally empowered and educated (his push for universal public instruction) does the noise cancel out and the signal emerge. By weighting votes by capital, futarchy systematically amplifies specific biases (those of the wealthy) rather than canceling them out.

  ### The Verdict
  Condorcet would view futarchy as a **category error**. He would argue that you cannot separate "values" and "beliefs" cleanly enough to let markets decide the latter without corrupting the former. If the market decides that Policy A maximizes GDP, but Policy A impoverishes the poor to enrich the rich, the "value" metric (GDP) was flawed, and the "belief" mechanism (the market) was captured by those who benefit from that flaw.

  His single most plausible verdict: **Futarchy is a sophisticated mechanism for oligarchy, not democracy.** It abandons the only condition (political equality) that guarantees the mathematical convergence toward truth. He would prefer a system of **deliberative democracy with universal education**, accepting the slower pace of human reasoning over the faster, but structurally biased, pricing of the market. For Condorcet, a truth discovered by plutocrats is not a public truth at all.
