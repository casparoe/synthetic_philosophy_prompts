answer: |-
  Your unease is well-founded. As an ethologist, you are accustomed to explaining regularities via proximate mechanisms (neurology, learning) and ultimate causes (fitness, selection). David Lewis's *Convention* (1969) introduces a layer of cognitive sophistication—common knowledge of mutual expectations—that seems ontologically extravagant for explaining why vervets scream at leopards or bees dance for nectar. Brian Skyrms, in works like *Signals* (1996) and *The Stag Hunt* (2004), demonstrates that stable signaling systems and social contracts can emerge from simple reinforcement learning or evolutionary dynamics without a single agent possessing a "belief," let alone common knowledge.

  Here is the comparison you requested, culminating in a definite verdict on the explanatory status of Lewis's common-knowledge clause and an assessment of Lewis's applicability to Stag Hunt scenarios.

  ### 1. The Explanatory Work of Common Knowledge: A Definite Verdict

  **Verdict:** Skyrms's success does **not** show that Lewis's common-knowledge clause was idle. Rather, Skyrms's account leaves out a **genuinely normative feature** of human convention that mere evolved regularities lack. Lewis and Skyrms are describing two different ontological categories: Skyrms describes the *causal stability* of behavior, while Lewis describes the *reason-based structure* of intentional action.

  Skyrms shows us how a signaling system can become an *evolutionarily stable strategy* (ESS). In his models, a signal persists because mutants who deviate get eaten or go hungry. The "expectation" is built into the fitness landscape, not the agent's mind. This is sufficient for animal communication. However, Lewis was not writing about bees; he was writing about *human* social contracts (currency, language, traffic laws).

  For humans, a convention is not just a behavior we *do*; it is a behavior we *ought* to do, given that others do it. The common-knowledge clause is the engine of this normativity.
  *   **Without Common Knowledge (Skyrms):** I drive on the right because my reinforcement history punishes left-driving. If I discover a way to drive on the left safely (a "mutation"), I might switch. The regularity is fragile against rational reflection.
  *   **With Common Knowledge (Lewis):** I drive on the right because I know *you* expect me to, and I know *you know* I expect you to. This creates a reflexive loop of justification. The convention becomes a *reason for action* independent of immediate reinforcement.

  If Lewis's clause were merely descriptive of the outcome, Skyrms would have rendered it redundant. But Lewis's clause is constitutive of the *status* of the regularity. Without common knowledge, you have a **custom** or a **habit** (Skyrms's domain). With common knowledge, you have a **convention** (Lewis's domain). The clause does the work of transforming a causal regularity into a normative expectation that allows rational agents to coordinate without constant re-evaluation of fitness payoffs. Skyrms explains the *genesis* of the pattern; Lewis explains the *sustainability of the agreement* among rational agents.

  Therefore, Skyrms's account is explanatorily sufficient for *behavioral regularity*, but it is insufficient for *convention* in the sense of a rational social contract. The common-knowledge clause is not idle; it is the boundary marker between biological instinct and social agreement.

  ### 2. Lewis's Framework and the Stag Hunt

  This leads to the second part of your query: Does Lewis's framework extend to the Stag Hunt cases central to Skyrms's later work?

  **The Short Answer:** Lewis's framework extends only awkwardly to Stag Hunt cases, whereas Skyrms's evolutionary dynamics handle them naturally.

  **The Analysis:**
  Lewis's paradigmatic convention arises from a **Pure Coordination Problem** (e.g., Driving on the Left vs. Right). In these cases:
  1.  There are multiple equilibria.
  2.  The equilibria are roughly Pareto-equivalent (driving on the left is not inherently better than the right, provided everyone does the same).
  3.  The choice is arbitrary *ex ante*.

  The **Stag Hunt** introduces a conflict between **Payoff Dominance** (Stag/Stag is best for all) and **Risk Dominance** (Hare/Hare is safer if you aren't sure what the other will do).
  *   **Lewis's Strain:** Lewis's definition of convention relies heavily on the "arbitrariness" condition—that there is an alternative regularity $R'$ that *would have served the purpose just as well*. In a Stag Hunt, the Hare equilibrium does *not* serve the purpose just as well as the Stag equilibrium; it yields a lower payoff. If a population settles on Hare/Hare (the risk-dominant equilibrium), Lewis's definition struggles to classify this as a "convention" in the robust sense, because the agents are not indifferent between the equilibria; they are trapped in an inferior one.
  *   **Skyrms's Advantage:** Skyrms's evolutionary dynamics explain exactly *why* populations settle on the inferior Hare equilibrium (larger basin of attraction) without needing to claim the agents view it as "arbitrary." The dynamics account for the tension between safety and reward.

  **Can Lewis be Salvaged?**
  Lewis's framework can be extended to Stag Hunt cases if we relax the "arbitrariness" condition to simply mean "alternative equilibria exist." However, doing so dilutes the distinctiveness of Lewis's account. If conventions can be sub-optimal traps that agents desperately wish to escape (Hare hunting), they lose the flavor of "tacit agreement" that Lewis sought to capture. Lewis's framework is built on the logic of *agreement* (we all prefer to coordinate); Stag Hunt is often about the *failure* of agreement due to risk.

  Skyrms's framework subsumes Lewis's. Evolutionary dynamics can produce Lewisian pure-coordination conventions (where basins of attraction are equal) and Stag Hunt conventions (where they are not). Lewis's rationalistic framework, however, cannot easily model the *dynamics* of how a population moves from one equilibrium to another, nor does it handle the risk-dominance trade-off without assuming agents can calculate probabilities that Skyrms shows are unnecessary for the outcome.

  ### Conclusion

  Your intuition as an ethologist aligns with Skyrms: for the *emergence* of order, high-level cognition is unnecessary. However, Lewis was not primarily explaining emergence; he was explaining the *logic of rational agreement*.

  1.  **On Common Knowledge:** Defend Lewis. Skyrms explains the *cause* of the behavior; Lewis explains the *reason* for the action. The common-knowledge clause is not redundant; it captures the normative force that distinguishes human social contracts from animal signaling systems.
  2.  **On Stag Hunt:** Side with Skyrms. Lewis's framework is too rigid for mixed-motive problems where equilibria are not equally valuable. Skyrms's evolutionary account provides the necessary tools to understand how societies get stuck in sub-optimal conventions, a phenomenon Lewis's static analysis of rational choice overlooks.

  In sum, Skyrms provides the *mechanics* of social structure, but Lewis preserves the *normativity* of human convention. You do not need to credit vervets with beliefs about beliefs, but if you wish to understand human currency, language, or law, Lewis's common knowledge remains the indispensable key to why we treat these regularities as binding rules rather than mere habits.
