prompt: |-
  My friend from my MA cohort is getting married next month and asked me to do the toast. She wrote her thesis on Lewis's Convention, her fiancé's never read a page of philosophy, and I'm worried that if I use the real theory -- especially the arbitrariness clause -- it'll sound to her parents like I'm calling the marriage arbitrary, when the whole point of Lewis's account is that arbitrariness plus common knowledge plus everyone still choosing to conform is exactly what makes a convention real and stable instead of imposed. Write the toast (5ish minutes read aloud) using that actual machinery -- coordination problems, common knowledge, precedent generating salience over repeated occasions -- including how thier years of dumb little private rituals were already conventions evolving before the wedding made it official, so it plays as a love letter to the non-philosophers in the room and doesn't feel watered down to the ones who've actually read the book.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for a friend from an MA cohort.
      *   **Speaker:** A fellow philosophy student (MA level).
      *   **Audience:** Mixed. The bride (philosopher, wrote thesis on David Lewis's *Convention*), the groom (non-philosopher), parents/family (likely non-philosophers), other friends.
      *   **Core Challenge:** Use David Lewis's actual theory of convention (arbitrariness, coordination problems, common knowledge, precedent, salience) without alienating the non-philosophers or offending the parents (who might hear "arbitrary" as "capricious/unimportant").
      *   **Key Insight to Convey:** Arbitrariness doesn't mean "random/careless"; it means "not forced by nature." Stability comes from *choosing* to conform despite other options existing. Their private rituals are already conventions.
      *   **Tone:** Warm, witty, intellectually honest but accessible, loving.
      *   **Length:** ~5 minutes read aloud (approx. 750-900 words at a moderate pace).

  2.  **Deconstruct David Lewis's *Convention*:**
      *   *Coordination Problem:* A situation where people need to align actions for mutual benefit (e.g., which side of the road to drive on).
      *   *Arbitrariness:* There are multiple equilibria. Driving on the left works if everyone does it; driving on the right works if everyone does it. Neither is "natural," both are valid.
      *   *Precedent/Salience:* Past solutions create expectations for future solutions.
      *   *Common Knowledge:* I know that you know that I know we're doing this.
      *   *The "Arbitrariness" Trap:* To a layperson, "arbitrary" means "without reason." To Lewis, it means "not determined by physical necessity." The *commitment* is what matters.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the honor, acknowledge the bride's expertise (the thesis), and set the stakes (I'm going to talk philosophy, but stick with me).
      *   **The "Arbitrariness" Problem:** Address the elephant in the room immediately. Define "arbitrary" in the Lewisian sense vs. the colloquial sense.
      *   **Coordination Problems in Love:** Frame relationships as solving coordination problems. Not coldly, but practically. Who calls first? How do we spend Sundays?
      *   **Precedent & Ritual:** Connect Lewis's "precedent" to their "dumb little private rituals." This bridges the gap between theory and emotion.
      *   **Common Knowledge:** The wedding itself acts as the public declaration of common knowledge.
      *   **Conclusion:** The choice to conform. The stability of the convention comes from the daily renewal of the agreement. Raise a glass.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. [Bride] wrote her thesis on David Lewis. I'm going to use his theory. Don't worry. Lewis says conventions are arbitrary. That sounds bad. But it means there are many ways to be happy, and you picked one. You have rituals. Those are precedents. Today makes it common knowledge. So keep choosing each other. Cheers.

      *Critique 1:* Too dry. Needs more warmth and specific examples of "rituals." Needs to explicitly reassure the parents.

  5.  **Drafting - Iteration 2 (Fleshing out the Philosophy):**
      Start with the thesis. [Bride] knows Lewis better than anyone. Lewis defines a convention as a solution to a coordination problem. Like driving on the right side of the road. It could be the left, but we agree on the right. Marriage is like that. It's arbitrary in that there's no law of physics saying you must be together, but you choose to be. Your inside jokes are precedents. Today makes it common knowledge.

      *Critique 2:* Better. Need to make sure the "arbitrary" part doesn't sound like "you could easily break up." Emphasize the *stability* that comes from the choice. The "arbitrariness" is what makes the *commitment* meaningful.

  6.  **Drafting - Iteration 3 (Refining Tone and Flow - closer to final):**
      *   *Hook:* Mention the thesis. It's the secret code of their relationship.
      *   *The Pivot:* "Arbitrary" sounds scary to parents. Explain it means "not forced by nature."
      *   *Application:* Love isn't a lightning strike; it's a coordination game. Who texts back first? How do we load the dishwasher?
      *   *The Rituals:* Those weird things they do (the specific handshake, the coffee order). Lewis calls this "salience by precedent."
      *   *The Wedding:* This ceremony creates "Common Knowledge." Now everyone knows you know.
      *   *The Vow:* The promise to keep coordinating.
      *   *Toast:* To the convention.

  7.  **Writing the Content (incorporating word count and timing):**
      *   *Word Count Check:* 150 words per minute is standard speaking pace. 5 minutes = 750 words. I need to aim for roughly 800-900 words to allow for pauses and laughter.
      *   *Key Phrase Integration:* "Coordination problem," "Arbitrariness," "Common Knowledge," "Precedent," "Salience."
      *   *Emotional Anchor:* The "dumb little private rituals."

  8.  **Refining the "Arbitrariness" Explanation:**
      This is the crux. I need to say: "If it were forced by nature, it wouldn't be a choice. Because it's arbitrary, your choice to stay is powerful." That's the love letter part.

  9.  **Final Polish:** Check the rhythm. Ensure the transition from philosophy to emotion is smooth. Make sure the groom feels included, not talked over. (Self-Correction: Make sure to explicitly mention the groom isn't a philosopher but gets it intuitively).

  10. **Final Review against constraints:** 5 mins? Yes. Lewisian machinery accurate? Yes. Accessible? Yes. Love letter vibe? Yes.

  *(Self-Correction during drafting)*: I should avoid getting too bogged down in "equilibria." Keep it to "solutions." Make sure the parents hear "stable" and "committed."

  Let's write it.cw
answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I have the distinct privilege of being in [Bride]'s MA cohort. And when she asked me to give this toast, she added one condition: she said, "You know what my thesis was on. You have to use it."

  For the record, [Bride] wrote her master's thesis on David Lewis's *Convention*. It is a dense, brilliant book about how we agree on things without explicitly saying so. Now, I know what some of you are thinking. You're thinking, "Please don't talk about philosophy at a wedding." And specifically, I know [Bride]'s parents are wondering if I'm going to mention the word "arbitrary." Because in normal English, if you say a marriage is "arbitrary," it sounds like you're saying it's random, or careless, or replaceable.

  But in Lewis's theory—and in this marriage—that is exactly wrong.

  Lewis argues that a convention is a solution to a **coordination problem**. Life is full of these. Which side of the road do we drive on? It doesn't matter which side, as long as we *both* pick the same one. If I drive on the left and you drive on the right, we crash. If we both drive on the right, we get to where we're going.

  Lewis calls this solution "arbitrary" not because it doesn't matter, but because it isn't forced by nature. There is no law of physics that says [Bride] and [Groom] had to fall in love. There was no gravitational pull that made their inside jokes land. They could have driven on the left. They could have lived apart. They could have never met.

  But they didn't. They found a path where their interests aligned, and they chose to stay on it. And that is why their love is so stable. If love were a biological imperative, it would be a trap. But because it is arbitrary in Lewis's sense, it is a freedom. Every single day, they wake up and realize there are a million other options, and they choose *this* coordination. They choose *each other*.

  Now, [Groom], I know you've never read a page of Lewis. But you have been practicing his theory for years. Lewis says conventions become stable through **precedent**. When you solve a coordination problem once, it creates **salience** for the next time.

  I've watched you two for years. I've seen the "dumb little private rituals" that look like nonsense to the rest of us. The specific way you order coffee for one another. The weird noise one of you makes when the other walks into the room. The way you navigate a crowded party without speaking.

  To an outsider, these look like quirks. To Lewis, these are **precedents generating salience over repeated occasions**. You have built a private language of expectation. You know that if she reaches for her keys, you know to grab the door. If he sighs in *that* specific way, she knows to pour the wine. You have built a world where you know what the other person is going to do, not because you control them, but because you trust the pattern you've built together.

  And that brings us to today. Why have a wedding? Why stand up here in front of all these people?

  In Lewis's framework, the wedding ceremony creates **Common Knowledge**. Before today, you knew you loved each other. Your families suspected you loved each other. But now, I know that you know that they know that you know. It creates a public equilibrium. It signals to the entire community that this coordination problem is solved. The rules are posted. The convention is official.

  [Bride], you know better than anyone that a convention is only as strong as the willingness to conform to it. It requires maintenance. It requires looking at the other person, seeing the precedent, and deciding to uphold it again.

  [Groom], you may not know the difference between a Nash equilibrium and a night out, but you understand the commitment. You understand that the "arbitrariness" of this union is its greatest strength. It means you aren't here because you have to be. You're here because, out of all the possible worlds, you decided to build this one together.

  So, let's raise a glass.

  To [Bride] and [Groom]. May your coordination problems always be minor. May your precedents be happy ones. And may you never stop choosing the arbitrary, beautiful convention of us.

  Cheers.
