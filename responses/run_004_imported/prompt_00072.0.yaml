  A Bohmian and an Everettian are discussing a life-altering decision they both made years ago.

  The Everettian says, "I never feel regret. In some branch of the universal wavefunction, I made the better choice. That version of me is living a wonderful life."

  The Bohmian says, "I feel regret. I made the wrong choice. The particle went this way."

  The Everettian asks, "But what about the wave?"

  The Bohmian replies, "The wave went both ways. The part of the pilot wave that corresponds to the better choice is still out there, evolving unitarily."

  The Everettian smiles. "So the better life exists?"

  The Bohmian shakes his head. "No. That part of the wave is empty. It has no particle. It's a reality with no observer."

  The Everettian shudders. "So you believe there's a perfect version of your life existing as a field, fully real, but completely uninhabited?"

  The Bohmian nods. "Yes. An empty wave."

  The Everettian says, "That's horrific. You believe in ghost worlds."

  **Punchline:** The Bohmian sighs. "Better than you. In your theory, the version of me who made the right choice isn't a ghost—it's a clone. And he's probably laughing at me."
