      *   **The Crucial Distinction:**
          *   Bohm: One world, one wave, particles ride the wave. The wave has "empty" branches that don't contain stuff.
          *   Everett: Many worlds, one wave, everything is the wave. All branches are equally "real" and populated (by counterparts).
          *   *Interaction:* In Bohm, the particle is *here*, not *there*, even if the wave is *there*. In Everett, there is a version of you *here* and a version of you *there*.

