answer: |-
  **Setting:** *A university philosophy department lounge, late evening. Whiteboards are covered in half-erased logic trees. Elena (a postdoc defending a quasi-realist expressivism) and Caleb (a PhD candidate skeptical of non-cognitivist semantics) are working through a draft of Elena's latest paper.*

  **Caleb:** Look, I grant you the modus ponens point. You've shown how, on Blackburn's or Gibbard's model, if Priya accepts "If stealing is wrong, then embezzling is wrong" and accepts "Stealing is wrong," she is committed to accepting "Embezzling is wrong." You've validated the inference pattern. But the Frege-Geach problem isn't just about validity. It's about content. Specifically, it's about whether your semantics can distinguish the *contents* of the premises without collapsing them.

  **Elena:** I know where you're going. The negation problem. Schroeder's challenge.

  **Caleb:** Sharper than that. I'm looking at your belief ascriptions. Take your running example: "Priya believes that firms are obligated to disclose conflicts of interest." Let's call the disclosure proposition $D$. So, "Priya believes $O(D)$."

  **Elena:** Right. On my view, that ascribes to Priya a state of *accepting a norm* that requires $D$. Let's call that attitude $N(D)$.

  **Caleb:** Okay. Now consider the three ways I can deny that sentence. We agree these are distinct in natural language.
  One: "Priya believes firms are obligated *not* to disclose." That's $B(O(\neg D))$.
  Two: "Priya believes it is *not the case* that firms are obligated to disclose." That's $B(\neg O(D))$.
  Three: "Priya *does not believe* that firms are obligated to disclose." That's $\neg B(O(D))$.

  **Elena:** Standard deontic distinctions. (1) is contrary obligation. (2) is negation of obligation—maybe it's optional. (3) is absence of belief—she might be agnostic.

  **Caleb:** Exactly. But on your semantics, "Priya believes $O(D)$" translates to "Priya holds attitude $N$ toward $D$." So, reading (3), $\neg B(O(D))$, translates to "Priya does *not* hold attitude $N$ toward $D$." That seems fine. That's just the absence of the state. But what about reading (2)? "Priya believes $\neg O(D)$." If $O(D)$ is analyzed as $N(D)$, then $\neg O(D)$ looks like $\neg N(D)$. But if you analyze the *belief* in $\neg O(D)$ as holding an attitude toward the negation, you need an attitude toward "not-obligatory."

  **Elena:** I'm not forced to say the attitude is toward the negation of the *attitude*. I can say the object of the attitude is the negation of the *action*. Gibbard handles this with hyperplans. To believe $\neg O(D)$ is to have a hyperplan that rules out requiring $D$.

  **Caleb:** But that's the wrinkle. If "believing $O(D)$" is *having a plan to require D*, and "believing $\neg O(D)$" is *having a plan to not-require D*... aren't those just the same state described differently? If I don't have a plan to require $D$, do I necessarily have a plan to *not* require it? Or am I just plan-less?

  **Elena:** That's why I'm proposing a technical fix in this chapter. I'm moving away from a single primitive attitude like "being for" or "accepting." I'm proposing a **bifurcated attitude semantics**. We have two distinct primitive mental states: *Endorsement* ($E$) and *Rejection* ($R$).
  So:
  Reading (1) $B(O(\neg D))$: Priya Endorses a norm prohibiting $D$.
  Reading (2) $B(\neg O(D))$: Priya Rejects a norm requiring $D$.
  Reading (3) $\neg B(O(D))$: Priya lacks an Endorsement of a norm requiring $D$.

  **Caleb:** Okay, you've lexicalized the distinction. You've got three buckets: Endorse Requirement, Reject Requirement, and No Attitude. That captures the three readings. But at what cost? You've solved the distinction problem by stipulation. Now you have to explain the *logic* between them.

  **Elena:** The logic is built into the consistency constraints on the mental states. It is inconsistent to simultaneously Endorse a requirement for $D$ and Reject a requirement for $D$.

  **Caleb:** Why? If they are distinct primitives, why can't I have both? In standard logic, $P$ and $\neg P$ are inconsistent because of the semantics of negation. But here, $E$ and $R$ are just two different flavors of mental goo. What makes them clash? You have to add a brute constraint: "No agent can $E$ and $R$ the same content."

  **Elena:** It's not brute. It's functional. If you Endorse a requirement, you are disposed to blame violations. If you Reject the requirement, you are disposed to withhold blame. You can't be disposed to blame and withhold blame for the same act in the same context. The inconsistency is practical, not representational.

  **Caleb:** I'm willing to grant the practical inconsistency for a moment. The real problem is the embedding under the belief operator. You're analyzing "Priya believes $O(D)$" as "Priya is in state $E(D)$."
  So, "Priya believes $\neg O(D)$" becomes "Priya is in state $R(D)$."
  And "Priya does not believe $O(D)$" becomes "Priya is not in state $E(D)$."
  Here's the collapse: "Priya is in state $R(D)$" *entails* "Priya is not in state $E(D)$."
  So, semantically, (2) entails (3). If she Rejects the requirement, she necessarily lacks the Endorsement.

  **Elena:** Of course it does. Just as in realist semantics, if Priya believes $\neg O(D)$, it follows she doesn't believe $O(D)$ (assuming consistency).

  **Caleb:** No, in realist semantics, the *truth conditions* are distinct.
  Realist (2): There is a fact $\neg O(D)$, and Priya stands in the belief relation to it.
  Realist (3): It is not the case that Priya stands in the belief relation to the fact $O(D)$.
  The realist can explain the difference because the *object* of the belief changes. In (2), she believes a negative proposition. In (3), she fails to believe a positive one.
  In your semantics, the *object* of the attitude in (2) is still $D$ (you Reject $D$-requiring), and in (3) you just say she lacks the attitude toward $D$.
  The distinction between (2) and (3) in your system isn't a difference in *content* or *object*. It's a difference between *having attitude R* and *having no attitude*.
  But "Having attitude R" is a positive psychological state. "Having no attitude" is the absence of a state.
  So you are analyzing a negation of a belief ("She doesn't believe") as the absence of a state, but a belief in a negation ("She believes not") as the presence of a *different* state ($R$).

  **Elena:** That's a feature, not a bug. It mirrors the phenomenology. Agnosticism feels different from denial.

  **Caleb:** It does. But does your semantics capture the *logical relations* between them? Consider this inference:
  Premise 1: Priya does not believe firms are obligated to disclose. ($\neg E(D)$)
  Premise 2: If Priya does not believe firms are obligated to disclose, then she thinks it's optional.
  Conclusion: Priya thinks it's optional.
  On your view, Premise 1 is true if Priya is agnostic *or* if she Rejects. Premise 2 seems to rely on the assumption that "not believing obligated" implies "believing not-obligated" (in a permissive sense).
  If you distinguish $R$ from $\neg E$ sharply, you break the link. If you don't distinguish them sharply, you collapse (2) and (3).

  **Elena:** I can handle that with pragmatics. When we say "Priya doesn't believe $O(D)$," we often implicate that she has considered the matter and lacks the endorsement, which usually implies she's settled on $\neg O(D)$. But semantically, I keep them distinct. $R$ is a positive state of ruling out the norm. $\neg E$ is just the absence of ruling in.

  **Caleb:** Here's the concrete case where that costs you too much. Suppose we are assessing Priya's moral responsibility.
  "Priya isn't blameworthy for disclosing, because she didn't believe she was obligated not to."
  Wait, let's stick to your example. "Priya isn't praiseworthy for disclosing, because she didn't believe she was obligated to."
  If "didn't believe obligated" just means $\neg E$, that includes agnostics.
  If "believes not obligated" means $R$, that includes people who think it's forbidden or optional.
  Now, consider the negation of the ascription itself. "It is not the case that Priya believes firms are obligated."
  In your semantics, that's $\neg (\text{Priya is in } E)$.
  But what if I say, "Priya believes that it's not the case that firms are obligated"? That's $(\text{Priya is in } R)$.
  The problem is compositionality with logical operators *outside* the belief context.
  Suppose I say: "Either Priya believes firms are obligated, or she believes they are not."
  $E(D) \lor R(D)$.
  This implies she has *some* attitude. It excludes agnosticism.
  But in natural language, "Either she believes it's obligatory or she doesn't" is a tautology. $B(p) \lor \neg B(p)$.
  On your view, "She doesn't" is $\neg E(D)$.
  So the tautology becomes $E(D) \lor \neg E(D)$.
  But the sentence "Either she believes it's obligatory or she believes it's not" is *not* a tautology. It excludes the agnostic.
  So your semantics must treat "believes not" as $R$, and "doesn't believe" as $\neg E$.
  But now, look at the negation of the *whole* ascription again.
  "It is false that Priya believes firms are obligated."
  That is $\neg E(D)$.
  This is compatible with agnosticism.
  But if I say, "Priya believes that it is false that firms are obligated," that is $R(D)$.
  The wrinkle is this: In standard semantics, $\neg B(p)$ is the contradictory of $B(p)$. $B(\neg p)$ is the contrary.
  In your semantics, $B(p)$ is $E$. $\neg B(p)$ is $\neg E$. $B(\neg p)$ is $R$.
  So far, so good. You have three states: $E$, $R$, and Neither.
  But now, how do you handle *disagreement*?
  If I say "Priya is wrong to believe firms are obligated," what am I saying?
  If I'm a realist, I'm saying $O(D)$ is false.
  If I'm an expressivist, I'm saying I Reject $D$.
  But if I say "Priya is wrong to *not* believe firms are obligated" (i.e., she should believe it), I am Endorsing $D$.
  The problem arises when we embed these in conditionals.
  "If Priya doesn't believe firms are obligated, then she is ignorant."
  Antecedent: $\neg E(D)$.
  "If Priya believes firms are not obligated, then she is mistaken."
  Antecedent: $R(D)$.
  Suppose Priya is agnostic (Neither).
  The first conditional is true (she is ignorant). The second is false (she doesn't believe they aren't).
  Your semantics handles this *if* we can keep $R$ and $\neg E$ distinct.
  But here is the collapse: How do you analyze "Priya believes that it is not the case that she is obligated to believe..."?
  We are nesting the attitudes.
  If $B$ is analyzed as $E$, then $\neg B$ is $\neg E$.
  But you need $R$ to be a positive state to distinguish it from $\neg E$.
  So, is $R$ analyzed as $E(\text{negation})$? Or is it a primitive $R$?
  If it's $E(\text{negation})$, then $R(D)$ is $E(\neg D)$.
  But $O(\neg D)$ is also $E(\neg D)$ (Endorse norm prohibiting D).
  So now Reading (1) "Believes obligated not to" and Reading (2) "Believes not obligated to" collapse. Both become $E(\neg D)$.

  **Elena:** I anticipated that. That's why $R$ is not $E(\neg D)$. $R$ is *Rejection of the norm*. $E$ is *Endorsement of the norm*.
  Reading (1) $B(O(\neg D))$: Endorse norm prohibiting $D$. ($E_{prohib}(D)$)
  Reading (2) $B(\neg O(D))$: Reject norm requiring $D$. ($R_{req}(D)$)
  These are distinct primitives. One is endorsing a prohibition; the other is rejecting a requirement.

  **Caleb:** Okay, so you've multiplied primitives. You have $E_{req}$, $E_{prohib}$, $R_{req}$, $R_{prohib}$...
  Now, explain the logical relation between $E_{req}(D)$ and $E_{prohib}(D)$. They are inconsistent. Why?
  If they are just different primitives, why can't I endorse a requirement and endorse a prohibition?
  You have to build the deontic logic *into* the psychology of the primitives.
  But if you do that, you aren't explaining the logic of moral discourse via the logic of attitudes. You are *importing* the logic of moral discourse into the definition of the attitudes.
  The tail is wagging the dog. You need the logic of $O$ and $\neg O$ to define the attitudes $E$ and $R$. But the whole point of expressivism was to explain the logic of $O$ and $\neg O$ via the attitudes.

  **Elena:** It's not circular. It's structural. The attitudes are defined by their role in practical reasoning. You can't plan to do $D$ and plan to not do $D$. The inconsistency is grounded in the nature of planning, not in a semantic map.

  **Caleb:** But planning doesn't capture the *belief ascription* nuance.
  Let's go back to the three readings.
  (1) Priya believes $O(\neg D)$.
  (2) Priya believes $\neg O(D)$.
  (3) Priya $\neg B(O(D))$.
  Your fix:
  (1) Priya has $E_{prohib}$.
  (2) Priya has $R_{req}$.
  (3) Priya lacks $E_{req}$.
  Now, consider the sentence: "Priya does not believe that firms are obligated not to disclose."
  That is $\neg B(O(\neg D))$.
  On your view, that means Priya lacks $E_{prohib}$.
  This is compatible with her having $R_{req}$ (believing it's not required).
  It is also compatible with her having $R_{prohib}$ (believing it's not prohibited).
  It is also compatible with agnosticism.
  Now consider: "Priya believes that it is not the case that firms are obligated not to disclose."
  That is $B(\neg O(\neg D))$.
  On your view, that is $R_{prohib}$.
  So, we have a distinction between "Lacking $E_{prohib}$" and "Having $R_{prohib}$".
  This works for Priya's mind. But does it work for *our* talk about Priya?
  If I say, "It's not true that Priya believes disclosure is forbidden," I mean $\neg E_{prohib}$.
  If I say, "Priya believes disclosure is not forbidden," I mean $R_{prohib}$.
  In ordinary language, the first is often used to imply the second. If I find out Priya is agnostic, I might correct you: "No, she doesn't believe it's forbidden, but she doesn't believe it's *permitted* either."
  This suggests the first statement ($\neg E_{prohib}$) is semantically weaker than the second ($R_{prohib}$).
  Your semantics captures that.
  But here is the cost: You have made the semantics of moral belief ascriptions *disjunctive* over mental states.
  To give the truth conditions of "Priya believes $P$," where $P$ is a complex normative proposition, you have to map the logical structure of $P$ onto a specific configuration of $E$ and $R$ states.
  If $P$ is $\neg O(D)$, you map to $R_{req}$.
  If $P$ is $O(\neg D)$, you map to $E_{prohib}$.
  But what if $P$ is $\neg \neg O(D)$?
  Does that map back to $E_{req}$?
  If so, you are relying on the logical equivalence of $\neg \neg O(D)$ and $O(D)$ to map the mental states.
  But if the mental states are primitives, why should $R_{req}$'s negation map to $E_{req}$?
  Why isn't "Not Rejecting" just "Not Rejecting" (which could be Endorsing or Agnostic)?
  If "Not Rejecting" allows Agnosticism, then $\neg B(\neg O(D))$ does not entail $B(O(D))$.
  But logically, $\neg \neg O(D)$ entails $O(D)$.
  So, if Priya believes $\neg \neg O(D)$, she must believe $O(D)$.
  So, if she is in the state corresponding to $\neg \neg O(D)$, she must be in the state corresponding to $O(D)$.
  But if the state for $\neg O(D)$ is $R$, then the state for $\neg \neg O(D)$ is $\neg R$.
  And you just admitted $\neg R$ is not equivalent to $E$. It includes Agnosticism.
  So, on your semantics, believing a double negation does not commit Priya to believing the positive.
  You've broken double negation elimination for belief ascriptions.

  **Elena:** *Pauses, tapping pen on the whiteboard.*
  I can block that. I can say that *rational* Priya eliminates double negations. The semantics gives the content; the psychology of a rational agent ensures the states align. If Priya believes $\neg \neg O(D)$, she is in state $\neg R$. If she is rational, $\neg R$ collapses to $E$ in the context of full consideration.

  **Caleb:** So you're outsourcing the logic to a norm of rationality?
  Then the semantics isn't doing the work. The Frege-Geach problem was about whether the *meaning* of the terms validates the inference. If you say, "The inference holds because rational agents don't have gaps in their attitude sets," you're saying the semantics *allows* the gap, but psychology forbids it.
  But if the semantics allows the gap, then there is a possible world where Priya believes $\neg \neg O(D)$ but not $O(D)$.
  In that world, is Priya contradicting herself?
  If yes, the semantics should show it.
  If no, then your semantics doesn't capture the meaning of "obligated."

  **Elena:** Look, Caleb. The realist says "O(D)" refers to a property. "Not O(D)" refers to the absence of that property.
  The problem for the realist is explaining why believing "O(D)" motivates.
  The problem for me is explaining why "O(D)" has logic.
  I'm choosing to save the motivation explanation and pay a tax on the logic side. I'm paying it in primitives ($E$ vs $R$) and rationality constraints.
  You're asking me to make the logic perfect without losing the expressivist core.
  If I make $E$ and $\neg R$ identical, I lose the distinction between (2) and (3).
  If I keep them distinct, I struggle with double negation.
  Is there a third option?

  **Caleb:** There's always the error theory. Say all three ascriptions are false because there are no normative properties to believe.

  **Elena:** *Laughs.* That's not a solution, that's a surrender. I'm trying to save the discourse.
  Maybe the fix is to stop analyzing "believes" as a relation to an attitude. Maybe "Priya believes $O(D)$" is itself an expressive utterance.
  When I say "Priya believes $O(D)$," I'm not describing her mind. I'm endorsing $D$ and attributing my endorsement to her.

