answer: |-
  First, let me congratulate you on the retirement and the new pursuit. Philosophy is a wonderful companion for a legal mind; you've spent a career weighing evidence and assessing credibility, which is essentially applied epistemology.

  Your "daft little argument" is not daft at all. In fact, you have stumbled directly into one of the oldest and most vibrant debates in the theory of knowledge (epistemology): **The Problem of Testimony.**

  To answer your question directly: **Both you and your wife are defensible, but you are operating under different "epistemic economies."**

  Here is how a philosopher might break down the dispute you had in your living room.

  ### 1. The Wife's Position: The Principle of Credulity
  Your wife's instinct represents the view of the 18th-century Scottish philosopher **Thomas Reid**. Reid argued against the skepticism of his contemporary, David Hume.

  Reid proposed a "Principle of Credulity." He suggested that human beings are hardwired to trust testimony. It is a "basic source" of knowledge, just like perception or memory. If someone tells you something, you are justified in believing it *by default*, unless you have a specific reason to doubt them (e.g., they are known liars, or the claim is impossible).

  **Why she is right:**
  If we adopted your standard for everything, society would collapse. You cannot personally verify that the earth is round, that germs cause disease, or that Antarctica exists. You rely on a vast division of epistemic labor. We trust scientists, mapmakers, and teachers so that we can get on with living. In philosophical terms, your wife is an **Anti-Reductionist** regarding testimony. She believes testimony provides its own justification; it doesn't need to be reduced to your own personal observations to count as knowledge.

  ### 2. Your Position: The Reductionist Instinct
  Your instinct represents the empirical skepticism of **David Hume** (and later, many scientific positivists). This view holds that testimony is not a *basic* source of knowledge. It is only reliable insofar as we have independent evidence that the source is reliable.

  **Why you are right:**
  Blind trust is dangerous. Misinformation spreads easily. In your former profession, you would never accept a witness's statement as fact without cross-examination or corroboration. You were trained to understand that human error and deception are common. Your desire for "independent confirmation" is the engine of the scientific method. In philosophical terms, you are a **Reductionist**. You believe the justification for believing the teacher must be reduced to your own inductive evidence (e.g., "Geologists have been right before, so they are likely right now").

  ### 3. The Regress Problem: "Where does it stop?"
  You hit the nail on the head when you asked: *"Whatever source I went and checked would just be somebody else's word too."*

  This is known as **Agrippa's Trilemma** (or the Munchausen Trilemma). If you demand justification for every belief, you face three bad options:
  1.  **Infinite Regress:** You check a book, which cites a study, which cites data, which cites a measurement... forever.
  2.  **Circularity:** You check the book, which cites a study, which cites the book.
  3.  **Dogmatism:** You just stop at some point and say, "This is self-evident."

  Most modern philosophers resolve this with **Contextualism**. The standard for "knowing" shifts depending on the context.
  *   **In the living room:** The stakes are low. The teacher is a reliable authority. Your wife's standard is appropriate. She *knows* Everest is growing.
  *   **In the laboratory (or the courtroom):** The stakes are high. The standard for justification rises. Your instinct is appropriate there.

  ### 4. A Legal Analogy for a Retired Judge
  Since you come from the bench, consider the difference between **Judicial Notice** and **Evidence**.

  *   **Your Wife** treated the teacher's claim like **Judicial Notice**. Courts accept certain facts (like "water flows downhill" or "London is in England") without requiring evidence because they are indisputable sources of common knowledge. It saves time and resources.
  *   **You** treated the claim like **Contested Evidence**. You wanted the chain of custody for the data. You wanted to see the calipers measuring the mountain.

  In a trial, if a lawyer demanded empirical proof for every piece of judicial notice, the trial would never end. But if a lawyer accepted expert testimony without checking the expert's credentials, they would be negligent.

  ### The Verdict
  Was your wife right that taking someone's say-so is enough to *know* something? **Yes.** In everyday life, testimony is sufficient for knowledge. If she had bet you £5 that Everest was growing, she would have won the bet, and she would have *known* she would win.

  Was your instinct to want independent confirmation more defensible? **Also Yes.** As a matter of *intellectual virtue*, maintaining a healthy skepticism is superior. It protects against error. However, it is inefficient as a primary mode of living.

  **The Synthesis:**
  The philosopher **Edward Craig** suggested we think of knowledge as a "good informants" concept. We attribute "knowledge" to people who are reliable sources.
  *   The teacher is a good informant on geology.
  *   Therefore, the grandson knows.
  *   Therefore, your wife knows (by trusting the grandson/teacher).

  Your discomfort wasn't about whether the fact was true (it is; the Indian plate is pushing into the Eurasian plate, raising Everest roughly 4mm a year, though erosion counteracts some of that). Your discomfort was about **Epistemic Dependence**. You felt that if you didn't verify it, the belief wasn't *yours*.

  **My advice?**
  Keep the lab instinct for matters of consequence (health, finance, justice), but grant your wife the victory on the mountain. As the philosopher **Bernard Williams** noted, we must balance the "responsibility" of belief (checking facts) with the "sociality" of belief (trusting our community).

  You weren't being difficult; you were just doing what you did for a living: holding the evidence to the light. But sometimes, in a happy home, hearsay is admissible.
