      *   $M \models \text{ZFC}$.
      *   $M$ is countable (externally). So there exists $f: \mathbb{N} \to M$ (bijection).
      *   $M$ contains a set $A$ such that $M \models "A \text{ is uncountable}"$.
      *   Definition of "uncountable" in ZFC: $\neg \exists g (g: \omega \to A \text{ is a bijection})$.
      *   Crucial point: The quantifier $\exists$ ranges over elements *inside* $M$.
      *   The external bijection $f$ is not an element of $M$.
