      *   **Nina's Interpretation:** "The migration was the trigger *in this specific context*." $\rightarrow$ Migration + Config = Crash. But if we have to pick the *variable* that changed last or was the 'active' trigger, it's the migration (perhaps because the config push was 'normal' and the migration was 'abnormal'). Or, more accurately, she's arguing about *counterfactuals*.
      *   **The Core Dispute:** Causality vs. Trigger vs. Contributing Factor.
      *   **Sufficient vs. Necessary:**
          *   Nina argues: Migration was *necessary* (in this specific timeline) but not *sufficient*. (Migration + Config = Crash. Migration alone = No Crash).
          *   Marcus argues: If we call it "The Root Cause," it implies sufficiency. (Migration = Crash).

