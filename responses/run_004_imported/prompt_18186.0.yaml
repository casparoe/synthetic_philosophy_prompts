          *   Verdict: The statement itself is logically valid *if* the premise (it must be one of these two) is true.

      *   *Move 2: Marcus's Claim Weeks Later.* ("This means the migration would've taken prod down all on its own.")
          *   He is inferring *sufficiency* from a statement of *selection*.
          *   Is he right? In rigorous Root Cause Analysis (RCA), "Root Cause" usually implies something that, if fixed, prevents recurrence. If the migration alone wouldn't have crashed it, fixing the migration prevents *this* crash, but the system is still fragile (config push could crash it with something else).
