      *   *Move 4: Nina's Semantic Distinction.* ("I signed 'it was the migration and not the config push, given it had to be one of the two' -- not 'the migration alone was sufficient'.")
          *   She is distinguishing between "Pick the guilty party from this list" vs. "This party is guilty in all contexts."
          *   In incident management, we often look for the *trigger* vs. the *underlying vulnerability*.
