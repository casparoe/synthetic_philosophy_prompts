answer: |-
  Thank you all for being here.

  For those of you who don't know me, I'm a friend of Priya's. We met fifteen years ago in online forums dedicated to the safety of artificial intelligence. For half of you in this room, that sentence explains everything. For the other half—her parents, her brother, her oldest friends—that sentence probably sounds like a very complicated way to describe a career. I stand here today because I am perhaps the only person who speaks both languages fluently enough to talk about the work she loved, and the woman we loved.

  Priya was an AI alignment researcher. She spent her life thinking about how to build systems that are helpful, honest, and safe. Specifically, she worked on the "shutdown problem." In plain English: How do you build a machine that will let you turn it off when it's time, without fighting you, but also without wanting to be turned off so much that it stops doing its job?

  For a long time, the field tried to solve this by making the machine indifferent to being shut down. Priya came to believe that was the wrong approach. She argued, alongside colleagues like Elliott Thornley, that the better path was "incomplete preferences." She believed a safe system shouldn't be forced to prefer existing over not existing, or vice versa. It should be permitted to leave that question open.

  A year ago, knowing where her illness was leading, Priya wrote a short set of instructions for today. She was half-joking, as she often was when the subject got too heavy. But there was one line she was very serious about. She wrote: *Do not tell them I made my peace with dying. And do not tell them I fought to the very end.*

  To her family, this might sound like a strange distinction. But to Priya, both of those stories were lies. Saying she "made her peace" implies she decided death was good. Saying she "fought" implies she decided death was bad. Priya spent her career arguing that you don't have to force a binary choice where one doesn't exist. She believed that integrity means admitting when you don't have an answer.

  She applied that same rigor to her own life. She did not want her friends to comfort ourselves by narrativizing her death into a story of acceptance or resistance. She wanted us to acknowledge that, for her, the question remained open. She remained present, and then she was not. There was no vote taken. There was no final decision.

  To her colleagues here: We know how hard it is to hold a variable open when the math demands a solution. We know the intellectual honesty it takes to refuse a completed utility function. Priya lived that honesty. She didn't just write papers about corrigibility; she practiced it. She allowed herself to be vulnerable to the end, without pretending she had resolved the tension between staying and going.

  To her family: You knew her long before she was a researcher. You knew her as a daughter, a sister, a friend. You know that this intellectual stubbornness was just one part of her warmth. She didn't need technical terms to be kind. She loved you completely, even if she refused to simplify her own end.

  So, I will not tell you that she is at peace. I will not tell you that she lost a battle. I am not going to resolve the equation for you, because she asked us not to.

  Instead, I will say this: Priya was here. She thought deeply, she loved fiercely, and she remained true to her own mind until she could no longer speak. We are left with the open space she occupied. We are left with the work she did. And we are left with the privilege of remembering her, without needing to define exactly how she left us.

  Thank you.
