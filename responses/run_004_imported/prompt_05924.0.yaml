prompt: |-
  I was just appointed the teacher representative on my state's instructional-materials review committee, and my first case is a dispute over the U.S. history textbook's unit on the Constitution and slavery. The current draft quotes only the young Frederick Douglass, who through the 1840s agreed with William Lloyd Garrison that the Constitution was "a covenant with death, and an agreement with hell." Two members want it revised to quote the older Douglass instead, who broke with Garrison in the early 1850s and later declared that "interpreted as it ought to be interpreted, the Constitution is a glorious liberty document." Others worry that foregrounding the later quote settles, rather than reports, a contested question of interpretation, especially since it echoes the argument some originalists now make that the Constitution was antislavery from the start. Please draft the memo I'll bring to next Tuesday's vote: approve the passage as written, reject it, or approve it with specific required revisions, giving reasons the textbook's authors could actually act on and taking seriously whichever side's strongest argument you don't adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Teacher Representative on a State Instructional-Materials Review Committee.
      *   **Task:** Draft a memo for next Tuesday's vote regarding a specific dispute in a U.S. history textbook.
      *   **Subject:** A unit on the Constitution and slavery, specifically the quoting of Frederick Douglass.
      *   **The Conflict:**
          *   *Current Draft:* Quotes young Douglass (1840s) calling the Constitution "a covenant with death..." (Garrisonian view).
          *   *Proposal A (Revision):* Quote older Douglass (1850s+) calling it a "glorious liberty document."
          *   *Proposal B (Status Quo/Caution):* Worry that using the later quote "settles" a contested historical/legal question (originalism vs. anti-slavery constitution) rather than reporting it.
      *   **Decision Options:** Approve as written, Reject, or Approve with Specific Required Revisions.
      *   **Requirements:** Give actionable reasons for authors, take seriously the strongest argument of the side *not* adopted.

  2.  **Evaluate the Historical Context:**
      *   *Frederick Douglass's Evolution:* It is a historical fact that Douglass's views changed. In the 1840s, influenced by Garrison, he viewed the Constitution as pro-slavery. After breaking with Garrison (around 1851, notably in "The Change of Opinion Announced"), he argued the Constitution could be interpreted as an anti-slavery document.
      *   *Pedagogical Goal:* History textbooks should reflect historical complexity and change over time, not just present a static viewpoint.
      *   *The "Originalism" Concern:* The committee members worry that using the "liberty document" quote validates modern originalist arguments (like those of Justice Scalia or Randy Barnett) that the Constitution was legally anti-slavery. While Douglass did argue this, presenting *only* this view might seem like endorsing a specific legal theory over historical debate. However, presenting *only* the "covenant with death" view ignores Douglass's mature political philosophy and his argument for abolition through constitutional means.
      *   *Best Practice:* Show the *evolution* of thought. This teaches historical thinking skills (change over time, context, interpretation) rather than just memorizing a quote.

  3.  **Determine the Recommendation:**
      *   *Approve as written?* No. It presents only half of Douglass's intellectual journey. It implies he never changed his mind.
      *   *Reject?* Too harsh. The content isn't factually wrong, just incomplete.
      *   *Approve with Revisions?* Yes. This is the most constructive path. It addresses the incompleteness of the current draft while mitigating the concern about "settling" the debate. By showing *both* quotes and the *shift* in perspective, the textbook teaches the controversy rather than taking a side.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Rationale (The "Why"):** Explain the historical accuracy of Douglass's evolution.
      *   **Addressing the Concerns:**
          *   To those wanting the later quote: Acknowledge the importance of his mature view.
          *   To those worried about "settling" the debate: Explain how showing the *change* avoids endorsing one legal theory as absolute truth.
      *   **Actionable Revisions:** Specific instructions for the authors.
      *   **Closing:** Professional sign-off.

  5.  **Drafting - Section by Section (Iterative refinement):**

      *   *Header:* Keep it formal.
      *   *Recommendation:* "Approve with Specific Required Revisions."
      *   *Argument for Revision:* Douglass didn't hold one view forever. The textbook currently freezes him in 1845. That's historically inaccurate.
      *   *Addressing the "Originalism" Worry:* This is the tricky part. I need to show I understand why they are worried. If we just swap the quote, it looks like we are saying "The Constitution was definitely anti-slavery." If we show *both*, it shows "Douglass argued this changed." It contextualizes the quote as part of a political strategy, not just a legal verdict.
      *   *Actionable Steps:* Don't just say "fix it." Say "Include both quotes," "Date them," "Explain the break with Garrison."
      *   *Tone:* Professional, collaborative, pedagogical, historically rigorous.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is suggesting both quotes too much text?
      *   *Fix:* Suggest a sidebar or a specific paragraph focusing on "Douglass's Changing Views."
      *   *Critique:* Did I take the "Originalism" concern seriously?
      *   *Fix:* Explicitly mention that presenting the later quote *without context* risks anachronism. The revision must emphasize that Douglass's view was a *political argument* made in a specific context (the 1850s crisis), not necessarily a settled historical fact for students to accept uncritically.
      *   *Critique:* Did I take the "Revision" side seriously?
      *   *Fix:* Acknowledge that omitting the "liberty document" quote erases Douglass's contribution to Constitutional abolitionism.

  7.  **Final Polish:** Check against the prompt constraints.
      *   Memo format? Yes.
      *   Vote options clear? Yes.
      *   Actionable reasons? Yes.
      *   Strongest argument of opposing side addressed? Yes (the concern about settling a contested question).

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** State Instructional-Materials Review Committee
  **FROM:** [Your Name], Teacher Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding U.S. History Textbook Draft: Constitution and Slavery Unit

  **RECOMMENDATION:** Approve with Specific Required Revisions

  **SUMMARY**
  The current draft of the U.S. history textbook presents a historically incomplete picture of Frederick Douglass's relationship to the Constitution. By quoting only his 1840s Garrisonian view ("covenant with death"), the text freezes Douglass's intellectual development at a specific moment, ignoring his significant later evolution. However, simply swapping this for his 1850s quote ("glorious liberty document") risks presenting a contested legal-historical interpretation as settled fact.

  Therefore, I recommend we **approve the passage contingent on specific revisions** that contextualize Douglass's changing views. This approach maintains historical accuracy regarding Douglass's biography while addressing pedagogical concerns about presenting complex constitutional interpretations.

  **RATIONALE**
  **1. Historical Accuracy and "Change Over Time"**
  The primary function of a history textbook is to model historical thinking, specifically the concept of "change over time." Frederick Douglass did not hold a static view of the Constitution throughout his life. In the 1840s, aligned with William Lloyd Garrison, he viewed the Constitution as a pro-slavery compact. Following his break with Garrison in 1851, Douglass famously revised his position, arguing that the Constitution's text, properly interpreted, contained no guarantees for slavery and could be wielded as an abolitionist tool.

  To present only the early quote is to teach a falsehood by omission. It suggests Douglass died believing the Constitution was irredeemable, which contradicts his later political activism, his support for the Republican Party, and his service in federal office. The text must reflect that Douglass's interpretation evolved in response to political circumstances and deeper study of constitutional law.

  **2. Addressing the Concern Regarding "Settled Questions"**
  I take seriously the concern raised by committee members that foregrounding the later "liberty document" quote may inadvertently endorse a specific modern legal theory (originalism) rather than reporting on historical debate. There is a valid pedagogical risk that students will read the later quote not as *Douglass's argument*, but as the *textbook's verdict* on the Constitution's morality.

  If we merely replace the "covenant with death" quote with the "glorious liberty document" quote, we validate the concern that we are settling a contested question. We would be swapping one partial truth for another that carries heavy contemporary political baggage.

  **3. The Pedagogical Solution**
  The solution is not to choose one Douglass over the other, but to teach the *disagreement* Douglass had with himself. By presenting the evolution of his thought, the textbook transforms a potential ideological minefield into a lesson on historical interpretation. It shows students that historical figures debated the meaning of the Constitution then, just as scholars debate it now. This satisfies the demand for the later quote without validating the claim that the "liberty document" interpretation is the only historically valid one.

  **REQUIRED REVISIONS**
  To secure approval, the authors must implement the following changes to the unit:

  1.  **Include Both Perspectives:** The text must acknowledge Douglass's shift. Do not simply swap the quotes. The passage should explicitly state that Douglass's view changed between 1845 and 1855.
  2.  **Contextualize the "Liberty Document" Quote:** When introducing the "glorious liberty document" quote, the text must frame it as Douglass's *argument* or *interpretation* (e.g., "Douglass came to argue that..."), rather than presenting it as an objective description of the Constitution.
  3.  **Specify Dates and Context:** Both quotes must be dated. The text should briefly mention his break with William Lloyd Garrison as the catalyst for this re-evaluation.
  4.  **Student Inquiry:** Add a sidebar or discussion question asking students to analyze *why* Douglass might have changed his mind. (e.g., "How might Douglass's political goals in the 1850s have influenced his reading of the Constitution compared to the 1840s?")

  **CONCLUSION**
  By requiring these revisions, we avoid the error of presenting Douglass as a monolith while also avoiding the error of presenting his later legal theory as uncontested historical fact. This ensures the textbook teaches students how to analyze primary sources within their specific historical contexts, which is the ultimate goal of history instruction.

  I look forward to discussing this recommendation at Tuesday's vote.
