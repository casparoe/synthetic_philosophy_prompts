answer: |-
  Here is a joke drafted specifically for your seminar context. It relies on the tension between SIA's weighting of worlds by observer count and SSA's reliance on reference classes.

  **Setup:**
  The Presumptuous Philosopher walks into a bar, orders an expensive round of drinks for the house, and then refuses to pay the tab. When the bartender threatens to call the police, the Philosopher shakes his head and says, "You're making a basic epistemic error. There are two hypotheses: World A, where I pay and leave immediately, and World B, where I don't pay, stay here forever, and generate an infinite stream of observer-moments debating my brilliance. Under the Self-Indication Assumption, World B is infinitely more likely than World A simply because it contains more observers. I am *certain* I'm not paying."

  **Punchline:**
  The bartender kicks him out into the street. As he's dusting himself off, the Philosopher mutters to his study group: 
  "Unbelievable. She's clearly a hardline SSA theorist. She thinks I'm a random sample from the reference class of *'People Who Get Kicked Out of Bars,'* rather than updating on the total observer count of the *'Free Drinks'* multiverse."

  ***

  **Why this works for your group:**
  1.  **The SIA Logic:** It correctly (if absurdly) applies SIA: the philosopher favors the hypothesis that generates more observers (staying forever) regardless of physical evidence.
  2.  **The SSA Logic:** The punchline correctly identifies the SSA rebuttal: the bartender has forced him into a specific reference class ("People Kicked Out"), rendering his prior observer-count weighting irrelevant.
  3.  **The Presumptuous Angle:** It captures the specific arrogance of Bostrom's character who thinks armchair reasoning overrides empirical reality (the bartender's bouncer skills).
