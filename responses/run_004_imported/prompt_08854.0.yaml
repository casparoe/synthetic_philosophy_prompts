          *   *Correction/Refinement:* Löb's theorem says if you can *prove* the reflection schema for a specific $P$, you prove $P$.
          *   If you add the Reflection Principle as an *axiom schema* (i.e., for every $P$, $\Box P \to P$ is an axiom), then for any $P$, the system proves $\Box P \to P$.
          *   By Löb's Theorem, the system then proves $P$.
          *   Since $P$ is arbitrary, the system proves *everything* (including contradictions). It becomes inconsistent.
          *   *Analogy:* It's like a judge saying "Everything I say is true." If the judge says "I am lying," paradox ensues. In formal logic, it collapses into triviality.

