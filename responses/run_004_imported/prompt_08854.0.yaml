      *   **Step 3: Löb's Theorem Mechanism (The "Break").**
          *   Need to explain Löb's Theorem clearly.
          *   Standard form: If $T \vdash \Box P \to P$, then $T \vdash P$.
          *   Apply this to the Reflection Principle.
          *   If we add $\Box P \to P$ for *all* $P$ as axioms...
          *   Pick a false statement, like $0=1$ (False).
