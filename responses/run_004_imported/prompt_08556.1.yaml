answer: |-
  # The Origin of Priors: Why Hanson Wins the Logic but Loses the War

  The rationalist project, as it crystallized in the mid-2000s around *Overcoming Bias* and *LessWrong*, was built on a specific aspiration: to make disagreement costly. If two honest reasoners cannot agree to disagree, then persistent disagreement is evidence that at least one party is failing to be honest, or failing to be rational. This intuition draws its normative force from Robert Aumann's 1976 agreement theorem. But as you note, the theorem rests on a load-bearing wall that many critics—and many practitioners—suspect is made of straw: the Common Prior Assumption (CPA).

  Robin Hanson's intervention, specifically his argument that "uncommon priors require origin disputes," was intended to cement that wall. He aimed to show that the CPA is not merely a convenient modeling artifact, as John Harsanyi suggested, but a binding requirement for any agent that treats its own mind as part of the world.

  My verdict is this: **Hanson's argument is logically valid but anthropologically false.** It successfully demonstrates that *transparent, pre-rational* agents must share a common prior. However, human beings are neither transparent nor pre-rational in the required sense. We do not possess common knowledge of our own cognitive origins. Therefore, the Common Prior Assumption does not bind human agents *ex ante*. It is not a law we are currently breaking; it is a coordination target we have not yet reached. Consequently, the strong epistemic modesty that follows from Aumann—automatic convergence toward a peer's belief—is unjustified in most real-world contexts. You should update significantly on disagreement, but you are not rationally compelled to converge.

  ### The Architecture of Agreement

  To understand why the CPA matters, we must recall why Aumann's theorem is so startling. The theorem states that if two agents are Bayesian expected-utility maximizers, share a common prior, and have common knowledge of each other's posterior probabilities for a given event, their posteriors must be identical. They cannot "agree to disagree."

  The mechanism is recursive. If I know your posterior, and I know we started with the same prior, I must treat your posterior as having incorporated information I do not have. To maintain a different posterior, I would have to believe that your information is misleading or that you processed it incorrectly. But if we have common knowledge of our rationality, I know you processed it correctly. Thus, I must update my belief to match yours.

  The loophole, as you identified, is the prior. If we start with different priors, we can look at the same data, process it perfectly, and arrive at different conclusions without either of us making a mistake. Harsanyi's doctrine was essentially a plea: let us *assume* rational agents share a prior, because otherwise, we cannot model strategic interaction as a search for truth, but only as a clash of incompatible psychologies. Harsanyi treated the CPA as a definition of rationality. Critics treated it as an impossibility theorem for human psychology.

  ### Hanson's Pre-Rationality Gambit

  Hanson sought to move the CPA from a definition to a derivation. His argument in "Uncommon Priors Require Origin Disputes" relies on what he calls the "pre-rationality condition."

  Standard rationality requires your beliefs to cohere with your evidence. Pre-rationality requires your *prior* to cohere with your beliefs about how you got that prior.

  Imagine you and I disagree. I think the probability of X is 90%; you think it is 10%. We both know we are rational Bayesians. If we have different priors, Hanson argues, we must ask: *Why?* Why did I get the prior that leads to 90% and you get the prior that leads to 10%?

  If we agree on the causal story of our origins—for example, "we are both humans evolved on Earth, educated in similar systems, subject to similar cognitive biases"—then we must treat the selection of our priors as a random variable within that causal story. I must ask: "What is the probability that *I* would be the person with the '90% prior' versus the '10% prior'?"

  If I believe my prior is superior *simply because it is mine*, I am asserting a correlation between "being me" and "being right" that is not explained by the causal story we agreed upon. I am effectively claiming that the universe conspired to give the better prior to *this* specific body/mind rather than yours. Unless I have evidence that my cognitive origin is causally superior to yours (e.g., I have better sensors, better training data), I must treat my prior as a random draw from the same distribution as yours.

  Once we treat our priors as random draws from a common distribution over "possible minds given our origin story," we effectively reconstruct a common prior over the larger space of (World State × Mind State). Once that larger common prior is established, Aumann's theorem kicks back in. We must average our beliefs.

  Hanson's conclusion is stark: If you cannot point to a specific, substantive dispute about *why* your mind is better calibrated than your peer's (an "origin dispute"), you are rationally required to defer to them.

  ### The Breakdown: Opacity and Architecture

  Hanson's logic is impeccable. If you accept the premises, the conclusion follows. The failure lies in the applicability of the premises to human cognition. There are two fatal objections that prevent the CPA from binding us in practice.

  **1. The Opacity of Origin**
  Hanson's argument requires that agents have "common knowledge" of the causal story of their origins. Humans do not have this. I do not know the precise algorithmic structure of my own priors, let alone yours. I cannot verify that we are drawing from the same distribution of minds because I cannot characterize the distribution.

  When I look at a peer, I do not see "a mind generated by process P." I see "a mind that outputs conclusions I sometimes find baffling." To apply Hanson's correction, I would need to model your cognitive architecture well enough to confirm that it is exchangeable with mine. In most high-stakes disagreements (politics, philosophy, complex strategy), we lack the shared vocabulary to even describe our reasoning processes, much less verify their isomorphism.

  Without common knowledge of the origin story, the "pre-rationality condition" cannot be satisfied. We cannot agree on the larger state space required to smooth out our prior differences.

  **2. The Architecture Mismatch**
  The second objection is deeper. Hanson assumes that priors are *beliefs* about the world that can be updated. But for bounded agents, priors are often inextricably linked to cognitive *architecture*.

  Consider a neural network. Its "prior" is determined by its weights, initialization, and loss function. If two networks have different architectures, they are not just sampling from different points in the same space; they are inhabiting different spaces entirely. A human and an AI, or even two humans with significantly different neurotypes or cultural training, may not be "disagreeing" in the Aumannian sense. They may be optimizing different utility functions over different state spaces.

  If my prior is a structural feature of how I parse reality (e.g., my threshold for pattern recognition, my temporal discounting), it is not a hypothesis I can update on. It is the lens through which I view hypotheses. Hanson's argument requires me to step outside my lens to evaluate the lens itself. For a bounded agent, this is often computationally impossible. I cannot run a simulation of "me with your prior" to see who gets better results, because I can only run simulations using *my* prior.

  ### The Verdict

  This leads to a definite verdict: **The Common Prior Assumption is false for human beings as a default state.**

  Hanson proves that *ideal* agents who can model each other's origins must share a prior. But humans are not ideal agents, and we cannot model each other's origins with sufficient fidelity. Therefore, the CPA is not a binding rationality requirement for us *ex ante*. It is a *regulative ideal*. It tells us what we should aim for if we want to achieve Aumannian agreement, not what we are obligated to assume before we start talking.

  This vindicates Yudkowsky's resistance to strong epistemic modesty in *Inadequate Equilibria*. Yudkowsky argues that you should not defer to a peer if you have reason to believe your reasoning process is superior in the specific domain at hand. Hanson would say: "Do you have an origin dispute to back that up?" The answer is usually: "I cannot verify the origin, but I can verify the track record."

  Because we cannot satisfy the pre-rationality condition (common knowledge of origins), we fall back to the rationality condition (coherence with evidence). If my track record suggests my priors yield better predictions in domain D than yours, I am not rationally compelled to average with you. I am compelled to treat your disagreement as *evidence*, but not as a *command*.

  ### Practical License: How Much to Update?

  So, what does this license in practice? When you encounter a genuine epistemic peer—someone you respect, who has access to similar information, and who disagrees with you on something that matters—how much should you update?

  1.  **Reject Automatic Convergence:** Do not simply average your probabilities (e.g., taking the geometric mean of odds). This assumes the CPA holds. It does not. Blind averaging surrenders the value of your specific cognitive training and architectural strengths.
  2.  **Update on Existence, Not Just Content:** The fact of disagreement is strong evidence that the problem is harder than you thought or that there is ambiguous evidence you haven't seen. You should move your credence toward the center, but not all the way. A reasonable heuristic is to update roughly **one-third to one-half** of the distance toward your peer's belief, depending on their track record in the specific domain.
  3.  **Search for the Origin Dispute:** Instead of deferring, investigate. Ask: "What experience or reasoning step caused you to start with a prior that favors this conclusion?" If you can identify a specific causal difference (e.g., "I read paper X," or "I trust institution Y"), you can evaluate that evidence directly. If you find their origin story flawed, you maintain your prior. If you find it compelling, you update your model of the world, not just your probability estimate.
  4.  **Distinguish Peers from Mirrors:** Reserve full Aumannian convergence only for "mirrors"—agents whose cognitive processes you have successfully reverse-engineered and verified as isomorphic to your own (e.g., yourself yesterday, or a copy of your algorithm). For all other humans, treat them as noisy sensors with unknown bias profiles.

  In short: Hanson is right that *if* we knew ourselves as well as we know our equations, we would agree. But we don't. We are black boxes to ourselves. Until we open the boxes, disagreement is not a sin; it is data. Treat it as such, but do not let it overwrite your source code.
