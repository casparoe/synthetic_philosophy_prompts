answer: |-
  It is a pleasure to correspond with someone who recognizes that the methodological ghosts haunting economics often look remarkably like those that have stalked biology. Your intuition is correct: the tautology charge against "fitness" and the tautology charge against "utility" are structural siblings, born of the same logical positivist anxiety about unobservable entities.

  As you have likely encountered in your retirement studies, the shift from the mentalistic utility of the Utilitarians to the revealed preference (RP) of Samuelson was driven by a desire to make economics "harder"—to purge it of introspection and ground it in observables, much like behaviorism in psychology. Below, I assess the comparison you drew, the weight of Sen's critique, and the viability of the biological "propensity" rescue.

  ### 1. Mentalistic vs. Revealed Preference: The Ontological Shift

  To understand the stakes, we must distinguish the two conceptions of utility clearly.

  **The Mentalistic Conception (Bentham, Jevons, Edgeworth):**
  Here, utility is a psychological magnitude—a "hedonic tone" or state of satisfaction. It is cardinal (in principle) and ontologically distinct from action. Choice is *evidence* of utility, but fallible evidence. An agent might choose $x$ over $y$ believing $x$ yields more utility, but they could be mistaken due to ignorance, weakness of will (*akrasia*), or cognitive error. In this framework, the statement "agents maximize utility" is a substantive empirical hypothesis that could be false.

  **The Revealed Preference Conception (Samuelson, Houthakker):**
  Samuelson, influenced by the operationalism of Percy Bridgman, argued that if we cannot measure utils, we should not speak of them. Preference is *defined* by choice. If an agent chooses bundle $A$ when bundle $B$ is affordable, $A$ is revealed preferred to $B$. There is no gap between the preference and the choice. Consequently, the claim "agents maximize utility" becomes true by definition, provided the choices satisfy consistency axioms (like the Weak Axiom of Revealed Preference, WARP). The empirical content shifts from *maximization* (which is tautological) to *consistency* (which is falsifiable).

  **The Tautology Parallel:**
  In biology, if fitness = actual survival, "the fittest survive" is empty. In economics, if utility = actual choice, "agents choose what they prefer" is empty. Both fields responded by trying to find a definition that allowed for prediction without metaphysical baggage.

  ### 2. Assessing Sen's Charge: The Welfare Dilemma

  Amartya Sen's critique, particularly in *Rational Fools* (1977) and *On Ethics and Economics* (1987), strikes at the junction where positive economics bleeds into normative welfare economics. His charge is that RP theory attempts to have it both ways, and your question asks how much of this sticks.

  **Where the Charge Sticks:**
  Sen argues that RP creates a "dual identity" crisis.
  1.  **As a Behavioral Theory:** If utility is just consistency of choice, RP is robust for prediction. However, it is normatively inert. A consistent heroin addict, a disciplined monk, and a self-sacrificing parent all "maximize utility" in the RP sense. If the economist claims the addict is "better off" consuming heroin because they chose it, the theory has silently switched definitions.
  2.  **As a Welfare Theory:** Policy economics relies on the premise that satisfying preferences increases welfare. But if preferences are just choices, we cannot distinguish between a choice that enhances well-being and one that destroys it (e.g., adaptive preferences under oppression). To make welfare judgments, the economist *must* reintroduce a mentalistic or objective notion of "good" that is independent of the choice.

  **Verdict:** Sen's charge sticks firmly against **welfare economics**. You cannot derive an "ought" (policy should respect choices) from a purely behavioral "is" (choices are consistent) without smuggling in a mentalistic premise (choices track well-being). However, the charge sticks less against **positive economics**. For predicting market demand, it does not matter *why* an agent chooses, only that they choose consistently. Samuelson succeeded in building a predictive engine, but he failed to build a philosophical shield that could protect welfare claims from the tautology worry.

  **Where RP Genuinely Succeeds:**
  RP succeeds in avoiding the *measurement* problems of mentalism. We cannot observe hedons; we can observe prices and quantities. By stripping utility of psychological content, RP allowed economics to model complex interactions without getting bogged down in interpersonal comparisons of utility. It turned utility from a *cause* of behavior into a *representation* of behavior. This is a genuine methodological advance, even if it is philosophically thin.

  ### 3. The Biological Disanalogy: Can Propensity Save Utility?

  This is the crux of your inquiry. Biologists largely defused the tautology charge by adopting the **propensity interpretation of fitness** (championed by philosophers like Mills, Beatty, and Sober). Fitness is not *actual* reproductive success; it is the *expected* reproductive success given a set of traits in an environment. A very fit organism can die by lightning (bad luck); a unfit one can survive (good luck). The concept has content independent of the outcome.

  **Is there an analogous move in economics?**

  There is, but it is fraught with difficulties that biology does not face.

  **The Economic Analog: Random Utility Models (RUM)**
  In econometrics, we often model choice probabilistically. An agent chooses $x$ over $y$ with probability $P$, determined by a deterministic utility component plus a stochastic error term ($U = V + \epsilon$). Here, "utility" acts somewhat like a propensity: it is the *tendency* to choose, not the choice itself.

  **Why the Disanalogy Holds (The Economic Failure):**
  1.  **Causal Independence:** In biology, the propensity (fitness) is grounded in physical traits (speed, camouflage, metabolic efficiency) that exist *before* the selection event. We can measure the traits independently of the survival outcome. In economics, what is the "trait" that grounds the propensity to choose? If we say "brain states," we are back to mentalism/neuroeconomics. If we say "past choices," we are circular. Without an independent measure of the *source* of the propensity, the propensity is just a statistical smoothing of the tautology.
  2.  **The Nature of the Environment:** In evolution, the environment selects *against* the organism. In economics, the agent selects *from* the environment. The "propensity to choose" is internal to the agent, whereas "fitness" is a relational property between organism and environment.
  3.  **Normative Weight:** Even if we treat utility as a propensity to choose, Sen's problem remains. A high propensity to choose heroin does not imply a high propensity for welfare. The biological propensity explains *survival* (the outcome of interest). The economic propensity explains *choice* (the data), but fails to explain *welfare* (the outcome of interest for policy) without reintroducing mentalism.

  **A Possible Rescue: Structural Modeling**
  The closest economics comes to the biological solution is in structural econometric modeling, where researchers try to estimate "deep parameters" (risk aversion, time preference) that are stable across contexts. If I can estimate your risk aversion in a lab gamble and successfully predict your insurance choices in the real world, I have shown that "utility" refers to a stable underlying disposition, not just a specific choice.
  *   *However:* This only works if those parameters are psychologically real. If they are just curve-fitting devices, the tautology remains.

  ### Conclusion

  Your intuition that the two fields are wrestling the same ghost is astute. The difference lies in the **causal architecture**.

  In evolutionary ecology, you have a causal mechanism (genetics/physics) that links traits to survival probabilities, allowing fitness to be a propensity distinct from actual survival. In economics, the link between "utility" and "choice" is conceptual, not causal. Choice *constitutes* preference in the RP framework; it does not merely reveal it.

  Therefore, the biological rescue does not fully transfer. Revealed preference avoids the tautology only by retreating into **instrumentalism**: it treats utility not as a real thing (like fitness traits) but as a mathematical device to organize data. It succeeds as a tool for prediction (positive economics) but fails as a foundation for welfare (normative economics), precisely because it cannot distinguish between "chosen" and "good for the chooser" without smuggling the mentalism back in.

  Sen was right: Economics cannot have it both ways. If it wants to speak to human welfare, it must return to the garden of mentalism it fled in 1938, perhaps armed with the tools of psychology and neuroscience to measure the "propensity" for satisfaction directly. Until then, the tautology remains a useful fiction for the market, but a hollow one for the man.

  It seems your penance has led you to a conclusion many philosophers of economics have reached: biology, ironically, often has a firmer grip on the reality of its central theoretical constructs than economics does.
