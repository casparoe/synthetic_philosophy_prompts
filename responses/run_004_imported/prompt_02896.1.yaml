answer: |-
  ### The Scenario: The "Elite Expert" vs. The "Competent Local"

  Consider a city council hearing regarding the safety of a local water supply. Two speakers offer conflicting testimony about the presence of a specific toxin.

  *   **Speaker A:** A consultant from a prestigious, private firm based in the capital city. A belongs to a high socioeconomic class and holds an identity socially coded as "Elite Expert."
  *   **Speaker B:** A senior hydrologist from the municipal water department. B is a career civil servant, locally based, belonging to the same racial and gender demographic as the Council Chair (the hearer), and holds an identity socially coded as "Competent Bureaucrat."
  *   **The Hearer:** The City Council Chair.

  **The Prejudice:** The Chair holds a positive identity prejudice in favor of Speaker A. Influenced by a social imaginary that equates private, elite institutions with "cutting-edge objectivity" and public institutions with "stagnation," the Chair unconsciously inflates A's credibility. The Chair perceives A as possessing a superior, almost infallible epistemic authority.

  **The Neutrality:** Crucially, the Chair holds **no negative identity prejudice against Speaker B**. The Chair genuinely respects civil servants, views B as honest, diligent, and generally reliable. There is no stereotype in the Chair's mind that "bureaucrats are liars" or "local scientists are incompetent."

  **The Conflict:** A testifies, "The water is safe; our models show no toxin." B testifies, "The water is unsafe; our on-site sensors detect the toxin."

  **The Outcome:** Driven by the credibility excess granted to A, the Chair accepts A's testimony as definitive fact. Consequently, B's testimony is treated as erroneous or "misinterpreted." B suffers a credibility deficit: their evidence is dismissed, and their professional judgment is overruled.

  ### Why This Is Genuine Comparative Proportionality

  This scenario instantiates Medina's proportional view rather than a disguised Frickerian case for the following reasons:

  1.  **The Source of the Deficit:** In a standard Frickerian case, B would suffer a deficit because the hearer holds a *negative* stereotype about B (e.g., "civil servants are lazy" or "women are emotional"). Here, the Chair's attitude toward B is independently positive or neutral. B is not disbelieved *because of who B is*; B is disbelieved *because of who A is*. The deficit imposed on B is entirely derivative of the excess granted to A.
  2.  **The Zero-Sum Epistemic Economy:** Medina argues that credibility functions within a comparative economy. In a situation where a single truth must be established (the water is either safe or unsafe), credibility is a limited resource. By granting A 120% credibility (due to identity prejudice regarding elite status), the hearer structurally necessitates that B receives less than 100% credibility, even if B's evidence merits it. The "scale" is tipped not by weighing B down, but by lifting A up.
  3.  **Absence of Independent Stigma:** If we removed Speaker A from the room, the Chair would likely find Speaker B fully credible. The injustice against B exists only in the *relation* between A and B. This confirms that the harm is proportional and comparative, not intrinsic to the hearer's prejudice against the victim.

  ### Implications for Fricker's Framework

  This example demonstrates that **Fricker's hearer-prejudice-against-the-victim framework is too narrow** for capturing the structural dynamics of testimonial injustice.

  *   **Individual vs. Structural:** Fricker's model focuses on the dyadic relationship between the hearer and the victim (Hearer $\rightarrow$ Prejudice $\rightarrow$ Victim). It locates the wrong in the negative attitude toward the speaker. Medina's example shows that the wrong can be structural and triangular (Hearer $\rightarrow$ Prejudice for Privileged $\rightarrow$ Victim). By focusing solely on prejudice *against* the victim, Fricker's framework renders invisible the harms caused by prejudice *for* the privileged.
  *   **Remedial Limitations:** If we follow Fricker's restriction, the remedy for Speaker B's injustice would be to check for prejudice against civil servants. Finding none, we might conclude no testimonial injustice occurred. Medina's view reveals that justice requires policing *credibility excess* just as rigorously as credibility deficits. We must dismantle the positive stereotypes that inflate privileged speakers, because those inflations actively deflate the credibility of others, regardless of whether those others are stigmatized.
  *   **Active Ignorance:** Medina's view highlights that the hearer's "virtue" (respecting B) is insufficient to prevent injustice if it is coupled with an unexamined vice (deferring to A). Fricker's framework risks allowing "polite" prejudice (favoring the elite) to escape the label of injustice, provided it doesn't explicitly disparage the marginalized. Medina corrects this by showing that unearned privilege in the epistemic economy is itself a mechanism of injustice.

  In sum, the scenario shows that testimonial injustice is not merely a matter of individual speakers being unfairly lowered; it is a matter of the *distribution* of epistemic authority being distorted by identity prejudice. By ignoring credibility excess, Fricker's account fails to address the systemic tipping of the scales that Medina identifies.
