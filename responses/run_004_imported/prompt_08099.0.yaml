answer: |-
  This is a fantastic case study. It's essentially the Ship of Theseus transplanted into social ontology, but with the added layer of institutional normativity (the prank war obligation). Since you're in phil of language, I'll skip the intro to Ship of Theseus basics and focus on the metaontological and semantic machinery they're deploying.

  Here is the move-by-move breakdown, evaluating the dialectical strength of each position.

  ### Move 1: Constituents vs. Causal Continuity
  **Renata:** Mereological/Constitutive Essentialism.
  **Owen:** Causal/Functional Continuity (Perdurance or Functional Kind).

  **Analysis:**
  Renata is treating the lab as a *material object* or a *mereological sum* of its personnel and physical location. On this view, replacing every part destroys the whole. This is a standard, if somewhat naive, intuition for natural kinds or artifacts, but it struggles with institutional entities.
  Owen is treating the lab as a *functional kind* or a *process*. He appeals to causal chains (notebooks, techniques) and structural invariants (PI, weekly meeting). This aligns better with how we typically individuate institutions (e.g., the Supreme Court is the same court even if every justice is replaced, provided the constitutional rules of succession are followed).

  **Verdict:** **Owen takes this round.**
  Renata's criterion is too strict for social ontology. If 100% personnel turnover destroys institutional identity, then universities, corporations, and states rarely survive more than a human lifespan. Owen correctly identifies that for institutional kinds, *causal continuity of function and structure* usually trumps *constitutive identity*. Renata is applying a metaphysics of statues to a metaphysics of organizations.

  ### Move 2: The Verbal Dispute Dissolution
  **Renata:** Conceptual Relativity / Quantifier Variance (Hirsch/Chalmers). "We are carving the world differently."
  **Owen:** Charitable Interpretation / Extension Overlap. "Even on your carving, I'm right."

  **Analysis:**
  Renata attempts to pull the Chalmers move: the dispute is merely verbal because they are associating different concepts with the word "lab." She posits two concepts: *Lab-Community* (people + project) vs. *Lab-Institution* (structure + funding). She claims they are talking past each other.
  Owen blocks this. He doesn't just insist on his definition; he argues that the *extension* of Renata's preferred concept (*Lab-Community*) still includes the current lab. He points to the "apprenticeship-style handoffs" and "unbroken meetings" as sufficient for *community continuity*. He is arguing that the *application conditions* for her concept are met, even if the *intension* differs from his.

  **Verdict:** **Owen takes this round (decisively).**
  This is the strongest move Owen makes. In a verbal dispute, one party usually concedes that the other is speaking a true sentence in their own idiolect. Owen refuses to concede even that. He argues that under *any* reasonable precisification of "community" or "shared project" that allows for temporal endurance, the causal chains he cited (notebooks, meetings) satisfy the conditions. Renata tried to dissolve the disagreement by positing two concepts, but Owen demonstrated that the *facts on the ground* satisfy the truth conditions for *both* concepts. The dispute remains substantive because they disagree on whether *those specific facts* (handoffs vs. total turnover) are sufficient for continuity.

  ### Move 3: Vagueness vs. Extreme Cases
  **Renata:** Semantic Vagueness / Ontic Indeterminacy. "No sharp cutoff = No fact of the matter (NFM)."
  **Owen:** The "Paradigm Case" Argument. "Vagueness handles margins, not extremes."

  **Analysis:**
  Renata shifts to a supervaluationist or ontic indeterminacy stance. She argues that because "lab" is a vague predicate, there is no precise point where identity is lost, and therefore in a case of total turnover, there is no objective truth.
  Owen's counter is pragmatic and logical. Vagueness predicates (like "bald" or "heap") generate truth-value gaps in *borderline* cases. A case of 100% turnover, total location change, and total research shift is not a borderline case; it is a *stress test*. If the concept "same lab" cannot withstand 100% turnover despite causal continuity, then the concept is not vague—it is *false* in this instance (on Renata's view) or *true* (on Owen's). Owen is arguing that invoking vagueness here is a category error: we aren't hovering near the cutoff; we are testing the structural limits of the concept itself.

  **Verdict:** **Draw / Slight Edge to Owen.**
  Renata is technically correct that vague predicates lack sharp cutoffs, but she misapplies the implication. The lack of a sharp cutoff doesn't entail that *extreme* cases are indeterminate. (e.g., "Bald" is vague, but a man with 0 hairs is determinately bald). Owen is right that if vagueness renders *this* case indeterminate, the concept is useless. However, Renata has one hidden bullet left: she could argue this is a case of *ontological indeterminacy* (Sider), where the world itself doesn't decide. But for social kinds, which are mind-dependent, ontological indeterminacy usually collapses into collective intentionality (see below). Owen wins on the logic of vagueness, but Renata identifies that the *concept* might be failing to track anything robust.

  ### What They Are Both Missing: Social Ontology and Normativity

  There is a layer here neither of them fully excavated, which is surprising given the "prank war" trigger.

  **1. Status Functions and Collective Intentionality (Searle/Tuomela/Gilbert)**
  A lab is not just a causal chain or a group of people; it is an *institutional fact* constituted by collective intentionality. X counts as Y in context C.
  *   **The Missing Question:** Do the relevant agents *treat* it as the same lab?
  *   The PI treats it as the same lab (funding, leadership).
  *   The University treats it as the same lab (budget codes, building allocation).
  *   The *new* students (like the first-year) are the wild card. The first-year's refusal ("we're not even the lab that started it") suggests a *failure of collective acceptance*.
  *   **Implication:** If social ontology is correct, the identity of the lab depends partly on the participants' recognition of that identity. If the new cohort refuses to inherit the normative commitments (the prank war), they are effectively fracturing the collective intentionality that sustains the "Lab" as a status function. Renata is intuiting this fracture; Owen is ignoring the normative uptake.

  **2. Normative Inheritance**
  The argument isn't just about description ("Is this Lab A?"); it's about prescription ("Do we owe a prank to Lab B?").
  *   This is a question of **normative inheritance**. Even if the *descriptive* identity is continuous (Owen), the *normative* obligations might not transfer if the *values* of the community have shifted (Renata's "research questions are unrecognizable").
  *   If the lab's *telos* has changed (new model organism, new questions), the normative commitments attached to the old *telos* (the prank war) might not bind the new members. Owen proves the *container* is the same; Renata argues the *content* (which generates the norms) is different.

  ### Overall Assessment

  **Who won?**
  **Owen** was the stronger dialectician. He successfully blocked the verbal dispute dissolution and exposed the weakness in Renata's vagueness move regarding extreme cases. He has the standard analytic metaphysics of institutions on his side (causal continuity > constitutive replacement).

  **Where Renata was right:**
  She sensed that "Lab" is a *thick concept* involving normative expectations, not just a rigid designator for a causal chain. Her "vagueness" move was a clumsy way of saying that the *concept* of "Lab" might not be the right tool for tracking normative obligations across such a radical shift in research culture.

  **The Synthesis:**
  The dispute is substantive (Owen is right), but it is likely about **two different identity conditions for two different purposes**.
  1.  **Administrative Identity:** (Owen) For grants, HR, and building space, the lab is the same. Causal continuity of the PI and budget code suffices.
  2.  **Normative/Cultural Identity:** (Renata) For prank wars, lab culture, and intellectual lineage, the lab might *not* be the same. If the "shared project" has fundamentally changed (new organism, new questions), the normative commitments of the previous iteration do not automatically bind the new one.

  **Advice for the next happy hour:**
  Tell them to stop arguing about "identity" and start arguing about "normative inheritance." Ask Owen: "Does the causal chain transfer *obligations* if the collective intentionality regarding those obligations has been severed?" Ask Renata: "If the University and PI treat it as the same legal entity, does the first-year have the standing to unilaterally declare a discontinuity?"

  That moves the metaphysics into the philosophy of action, where the real puzzle lies.
