prompt: |-
  I sit on my university's Institutional Animal Care and Use Committee. A neuroscience lab has applied to implant chronic recording electrodes in the vertical lobe of several octopuses to study memory consolidation -- survival surgery, weeks of solitary confinement, only experimental analgesia -- and although federal rules exclude invertebrates from oversight altogether, our own policy already extends review to cephalopods given what's known about their cognitive complexity. Nobody on the committee disputes the relevant behavioral and neurophysiological facts; the dispute is entirely over how much moral weight those facts warrant, since members hold genuinely different views about which theory of moral status is correct, and those theories range from ones granting octopuses near-primate-level protections to ones granting them almost none. One faction wants us to weight the decision by the committee's actual spread of credence across these rival theories and choose whichever disposition of the protocol comes out ahead in expectation; another objects that this lets a few members' modest credence in high-stakes theories about octopus sentience effectively dictate the outcome for everyone else. Draft the memo I will circulate before the vote: recommend a specific disposition of the protocol -- approve, reject, or approve with named modifications -- propose a decision rule the committee should use for similar cases going forward, and engage honestly with the worry that this kind of expected-choiceworthiness reasoning can be hijacked by a minority's credence in extreme theories, rather than simply dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's Institutional Animal Care and Use Committee (IACUC).
      *   **Context:** A neuroscience lab wants to implant chronic recording electrodes in octopus vertical lobes (memory consolidation study).
      *   **Protocol Details:** Survival surgery, weeks of solitary confinement, only experimental analgesia.
      *   **Regulatory/Policy Context:** Federal rules exclude invertebrates, but university policy *includes* cephalopods due to cognitive complexity.
      *   **The Conflict:** No dispute on facts (neurophysiology/behavior). Dispute is on *moral weight/status*. Theories range from near-primate protection to almost none.
      *   **The Debate:** One faction wants to use "expected choiceworthiness" (weighting by credence across theories). Another faction worries this lets a minority with extreme views (high stakes/low probability) dictate outcomes (Pascal's Wager problem).
      *   **Task:** Draft a memo to circulate *before* the vote.
      *   **Requirements:**
          1.  Recommend a specific disposition (Approve, Reject, or Approve with Modifications).
          2.  Propose a decision rule for future cases.
          3.  Engage honestly with the "hijacking/extreme theories" worry (don't dismiss it).

  2.  **Determine the Stance/Recommendation:**
      *   *Ethical Analysis:* Octopuses are highly sentient invertebrates. Chronic implants + solitary confinement + experimental analgesia is high burden.
      *   *Precautionary Principle:* Given the uncertainty about sentience and the high potential cost of being wrong (severe suffering), a precautionary approach is usually best in animal ethics.
      *   *The "Hijacking" Worry:* If we use pure expected value, someone saying "There's a 1% chance they feel pain like humans" could block everything. But if we ignore it, we risk moral catastrophe.
      *   *Decision:* **Approve with Significant Modifications.** Outright rejection might stifle important science without addressing the uncertainty. Outright approval ignores the welfare risks. Modifications should reduce burden and increase analgesia.
      *   *Decision Rule:* A "Threshold Precautionary Principle" combined with "Stakeholder Weighted Consensus." Avoid pure expected utility maximization which is vulnerable to fanaticism, but acknowledge moral uncertainty.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the complexity. State the purpose of the memo (frame the vote).
      *   **Scientific & Policy Context:** Briefly recap the protocol and the unique policy position (cephalopods included despite federal exclusion). Acknowledge the factual agreement (they are complex).
      *   **The Ethical Core (Moral Uncertainty):** Address the disagreement on moral status.
          *   *Theory A:* High status (near primate).
          *   *Theory B:* Low status (standard invertebrate).
          *   *The Problem:* How to aggregate these views?
      *   **Addressing the "Hijacking" Concern:** This is crucial. I need to explain why simple expected value is risky (Pascal's Mugging/Wager). If someone assigns non-zero probability to "octopuses have souls," does that stop all research? No.
      *   **Proposed Decision Rule:** Instead of "Expected Choiceworthiness," propose a **"Risk-Weighted Precautionary Threshold."**
          *   We don't sum up utilities. We ask: "Does the potential harm, weighted by a *reasonable* minimum credence in high sentience, exceed the scientific benefit?"
          *   This blocks the "1% chance of infinite suffering" argument but respects the "significant chance of significant suffering" argument.
      *   **Specific Recommendation:** **Approve with Modifications.**
          *   *Why:* The science is valuable, but the welfare cost is too high as written.
          *   *Mods:* Require established analgesia (not experimental), reduce confinement time, enrich environment.
      *   **Closing:** Call for principled deliberation.

  4.  **Refining the Tone:**
      *   Must be professional, academic, yet decisive.
      *   Must show empathy for both sides (the scientists wanting to research, the ethicists worrying about suffering, the committee members worried about decision paralysis).
      *   Avoid jargon where possible, but "moral uncertainty" and "precautionary principle" are necessary.

  5.  **Self-Correction/Iterative Thinking during Drafting:**
      *   *Critique:* Is "Approve with Modifications" too weak?
      *   *Adjustment:* Make the modifications specific and stringent. If the lab can't meet them, it becomes a rejection. This bridges the gap.
      *   *Critique:* Is the decision rule too vague?
      *   *Adjustment:* Define the rule as avoiding "fanaticism" while respecting "reasonable doubt." Use the concept of "moral risk management" rather than "moral calculus."
      *   *Critique:* Did I address the "hijacking" worry enough?
      *   *Adjustment:* Dedicate a specific section to it. Acknowledge that expected value theory breaks down with extreme variances. Propose capping the influence of low-probability/high-stakes claims unless they cross a plausibility threshold.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Recommend disposition? Yes (Approve with Modifications).
      *   Propose decision rule? Yes (Risk-Weighted Precautionary Threshold).
      *   Engage with hijacking worry? Yes (Section on "The Problem of Fanaticism").
      *   Tone? Professional memo.

  7.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Institutional Animal Care and Use Committee (IACUC)
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Protocol Review #24-09: Chronic Neural Recording in *Octopus vulgaris* – Decision Framework and Recommendation

  **1. Purpose**

  This memo serves to frame our upcoming deliberation and vote on Protocol #24-09. As you know, this proposal involves survival surgery and chronic electrode implantation in the vertical lobes of octopuses to study memory consolidation. While federal regulations exclude invertebrates, our university policy explicitly extends oversight to cephalopods. We are in agreement regarding the scientific facts: octopuses possess complex nervous systems, exhibit sophisticated behaviors, and demonstrate capacity for learning and memory.

  Our disagreement lies not in biology, but in ethics. We hold divergent views on the moral status of cephalopods, ranging from "near-primate protection warranted" to "minimal moral weight." This memo proposes a specific disposition for this protocol and, more importantly, a decision rule for resolving similar conflicts of moral uncertainty in the future.

  **2. The Challenge of Moral Uncertainty**

  We are currently debating whether to aggregate our votes based on "expected choiceworthiness"—essentially calculating a weighted average of outcomes based on each member's credence in various moral theories. Proponents argue this respects the diversity of our ethical commitments. However, I share the concern raised by several colleagues that this approach is vulnerable to what decision theorists call the "problem of fanaticism."

  If we simply multiply *probability* by *stakes*, a single member's modest credence in an extreme theory (e.g., "There is a 1% chance octopuses possess moral status equivalent to human infants") can mathematically outweigh the majority's strong credence in a lower-stakes theory. This allows a minority view to effectively veto research regardless of scientific merit or consensus. Conversely, ignoring moral uncertainty entirely risks committing grave moral errors if the minority turns out to be right about the capacity for suffering.

  We need a middle path that acknowledges moral risk without succumbing to decision paralysis or minority veto.

  **3. Proposed Decision Rule: The Risk-Weighted Precautionary Threshold**

  For this and future cases involving entities with contested moral status, I propose we adopt a **Risk-Weighted Precautionary Threshold** rather than a pure Expected Value calculation.

  This rule operates on three principles:
  1.  **Plausibility Constraint:** We do not weight theories that fall outside the bounds of current scientific consensus on sentience and nociception. Moral uncertainty must be grounded in empirical uncertainty, not metaphysical speculation.
  2.  **Asymmetric Risk:** When the potential harm involves severe, prolonged suffering (e.g., unmanaged post-surgical pain), the burden of proof lies on the researcher to demonstrate that the risk is mitigated, even if the probability of high-level sentience is not 100%.
  3.  **Proportionality:** The strictness of welfare safeguards must scale with the *product* of the scientific plausibility of sentience and the severity of the proposed intrusion.

  This approach prevents "hijacking" by extreme theories (by enforcing the Plausibility Constraint) while honoring the Precautionary Principle regarding suffering (by enforcing Asymmetric Risk). It asks not "What is the average moral weight?" but "Have we reduced the risk of severe suffering to an acceptable level given what we reasonably know?"

  **4. Recommendation: Approve with Significant Modifications**

  Applying this framework to Protocol #24-09, I recommend we **APPROVE WITH MODIFICATIONS**.

  An outright rejection ignores the significant scientific value of understanding memory consolidation in a phylogenetically distinct system, which could have broad implications for neurobiology. However, approval in the current form fails the Asymmetric Risk test. The combination of survival surgery, weeks of solitary confinement, and *experimental* analgesia creates a high ceiling for potential suffering that is not justified by our current level of certainty regarding their pain experience.

  To meet the Risk-Weighted Precautionary Threshold, the following modifications are required:

  *   **Analgesia:** The use of "experimental analgesia" is unacceptable. The protocol must utilize the best-available, empirically validated analgesic regimen for cephalopods (e.g., magnesium chloride or specific NSAIDs as per current veterinary literature), even if off-label. We cannot treat pain management as an experimental variable when the subject's moral status is contested.
  *   **Confinement:** Solitary confinement must be minimized. The protocol must demonstrate that social isolation is strictly necessary for the specific neural endpoints, and duration must be reduced by at least 50% from the current proposal, with enrichment provided during isolation.
  *   **Humane Endpoints:** Stricter criteria for immediate euthanasia must be codified. Any sign of chronic distress or failure to thrive post-surgery must trigger removal from the study.

  **5. Conclusion**

  Adopting this disposition allows the science to proceed but places a "tax" on moral uncertainty in the form of stricter welfare safeguards. It acknowledges that if octopuses *do* possess high moral status, we have minimized their suffering significantly. If they *do not*, the scientific cost of these modifications is manageable.

  This approach respects the gravity of our policy decision to include cephalopods without allowing our committee to be held hostage by the most extreme interpretations of moral status. I ask that you review these modifications and the proposed decision rule prior to our session on Thursday.

  Respectfully,

  [Your Name]
  IACUC Member
