answer: |-
  This is a really sharp observation, but I think you are slightly misreading Turing's strategic move in that section. While your intuition connects ESP to the broader "mechanism vs. vitalism" debate, Turing isn't conceding that ESP proves minds are non-computational. Instead, he is treating ESP as a **methodological loophole** in the Imitation Game, not a metaphysical refutation of computationalism.

  Here is a breakdown of why your read is understandable but ultimately misses Turing's specific point.

  ### 1. Interface vs. Engine
  The core of your interpretation is that ESP represents a "non-computational channel." If that were true, it would indeed threaten Turing's thesis that intelligence is a function of computation.

  However, Turing treats ESP not as a magical property of the soul, but as a **physical input/output channel**.
  *   **The Worry:** If telepathy is real, a human interrogator could simply "read the mind" of the human contestant to verify they are human. A machine, lacking this biological receiver, would be exposed.
  *   **Turing's Counter:** He doesn't argue that machines *can't* have ESP. He argues that we can simply **block the signal.**

  Turing writes:
  > *"I do not think that one need take this objection very seriously. One can imagine a 'telepathy-proof' room..."*

  By suggesting a lead-lined room or similar shielding, Turing is treating telepathy as a physical phenomenon (like radio waves) that can be engineered around. If it can be blocked, it doesn't prove the *thinking* is non-computational; it just proves the *communication channel* is different. If telepathy is a natural phenomenon, a machine could theoretically be built to detect it. Therefore, it doesn't sink the thesis that thinking is computation; it just means the machine needs better sensors.

  ### 2. Turing's Surprising Acceptance of the Data
  What often shocks modern readers is that Turing doesn't actually dismiss the existence of ESP. In 1950, parapsychology (specifically the work of J.B. Rhine at Duke University) was taken somewhat more seriously in certain scientific circles than it is today.

  Turing writes:
  > *"The statistical evidence, at least for telepathy, is overwhelming."*

  He is being an empiricist here. He is saying, "Okay, let's assume the data is right." But even granting that ESP is real, he refuses to let it invalidate the Turing Test. He effectively says: *Even if humans have this extra wireless card installed in their brains, we can unplug it for the duration of the test to ensure a fair comparison of computational intelligence.*

  ### 3. Contrast with the "Mathematical Objection"
  If you want to find the section where Turing addresses the "thinking can't just be computation" worry, you should look at the **"Mathematical Objection"** (based on Gödel's incompleteness theorems) or the **"Informality of Behavior"** objection.

  *   **The Mathematical Objection:** This argues that there are limits to what discrete state machines can prove/calculate that human minds can supposedly transcend. *This* is the ancestor of the Lucas-Penrose argument that minds are non-computational.
  *   **The ESP Objection:** This is merely about cheating on the test.

  Turing handles the Mathematical Objection by arguing that just because a machine has limits doesn't mean it can't be intelligent (humans make mistakes too), or that we don't know for sure humans aren't subject to similar limits. That is where the battle over computationalism is actually fought in the paper.

  ### 4. Why your read is understandable
  You aren't crazy for reading it the way you did. In the landscape of philosophy of mind, appeals to ESP or "psychic phenomena" have often been used as a last-ditch effort to save dualism (the idea that the mind is non-physical).

  If ESP requires a non-physical substance to transmit thoughts, then yes, a physical machine could never replicate it. But Turing is a materialist. He assumes that if ESP exists, it operates via physical laws. If it operates via physical laws, it is theoretically computable or engineerable.

  ### Summary
  Your read is **not quite fair**, but it's a productive misunderstanding.
  *   **You think:** Turing is admitting minds have a magic ingredient machines can't have.
  *   **Turing is saying:** Even if humans have a "wireless receiver" in their heads, we can put them in a Faraday cage so we can test their *computational* intelligence fairly.

  He is protecting the integrity of the **Test**, not conceding the nature of the **Mind**. He effectively neutralizes the objection by turning a metaphysical worry into an engineering constraint.
