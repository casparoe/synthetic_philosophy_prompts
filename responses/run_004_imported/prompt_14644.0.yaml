prompt: |-
  I have spent a good deal of time reading about the replication crisis on my own, and there is one recurring point I have never seen explained to my full satisfaction. Among the "questionable research practices" blamed for inflated false-positive rates is optional stopping: monitoring results as data come in and halting collection the moment p drops below 0.05. I can see why this distorts the true error rate under standard frequentist reasoning, since it effectively gives chance repeated opportunities to get lucky. Yet I have also come across the claim that a Bayesian analysis of that very same final dataset would be completely untouched by this practice, on the grounds of the likelihood principle: the idea that all the evidential meaning in data is carried by the likelihood function and does not depend on the stopping rule that produced it. This strikes me as almost too convenient. How can one and the same sequence of observations count as badly biased evidence under one framework, yet as perfectly legitimate evidence under another, apparently just because of the researcher's private intentions about when to stop collecting data? I would like a genuinely careful, mechanistic explanation of what is actually going on here, together with an honest assessment of whether Bayesians' claimed immunity to optional stopping truly holds up, or whether it is more of a theoretical idealization that quietly depends on assumptions practicing researchers rarely satisfy.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Question:** How can optional stopping (peeking at data and stopping when $p < 0.05$) inflate false positives in frequentist statistics but supposedly have *no effect* in Bayesian statistics (due to the Likelihood Principle)?
      *   **User's Background:** Has read about the replication crisis, understands the frequentist critique (multiple testing/inflated Type I error), finds the Bayesian claim "too convenient," and suspects it might be a theoretical idealization.
      *   **Desired Output:** A "genuinely careful, mechanistic explanation" and an "honest assessment" of whether Bayesian immunity holds up or relies on unrealistic assumptions.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Frequentist View:* Stopping rules matter because the sampling distribution depends on the *space of possible experiments* (including those that didn't happen but could have). Optional stopping expands the rejection region, inflating $\alpha$.
      *   *Bayesian View:* The Likelihood Principle states inference depends only on the observed data likelihood, not the sampling plan. Bayes Factors (BF) or Posterior Probabilities update based on data $D$, regardless of *why* $D$ was collected.
      *   *The Tension:* How can the *same data* be biased in one framework and unbiased in another?
      *   *The Catch:* Bayesian immunity isn't absolute. It depends on priors, model specification, and decision thresholds. There's a distinction between *calibration* and *coherence*.
      *   *Structure:*
          1.  Acknowledge the validity of the user's skepticism (it *is* counterintuitive).
          2.  Explain the Frequentist mechanism (Sampling distributions & Error rates).
          3.  Explain the Bayesian mechanism (Likelihood Principle & Updating).
          4.  Address the "How can both be true?" paradox (Different definitions of "evidence" and "error").
          5.  Critically assess the "Immunity Claim" (Where it breaks down: Priors, Model Misspecification, Decision Theory).
          6.  Conclusion/Summary.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user's intuition. It *is* strange. State the thesis: The difference lies in what "error" means and what the goal of inference is. Bayesian immunity is real regarding *coherence*, but fragile regarding *calibration* and *truth-tracking* in the real world.

      *   **Frequentist Mechanism:**
          *   Focus on the *Sampling Distribution*.
          *   $p$-values are probabilities of data *as extreme or more extreme* under $H_0$.
          *   If you peek, "more extreme" includes paths where you would have stopped earlier.
          *   Analogy: Rolling dice until you get a 6. If you report "I rolled a 6," the frequentist asks "How many times did you roll?"
          *   Result: Type I error rate balloons (can approach 100% with unlimited peeking).

      *   **Bayesian Mechanism:**
          *   Focus on the *Likelihood Function* $P(D|H)$.
          *   Bayes' Theorem: Posterior $\propto$ Likelihood $\times$ Prior.
          *   The Likelihood Principle: $P(D|H)$ is the same regardless of the stopping rule (assuming the rule doesn't depend on unknown parameters in a specific way, usually).
          *   If I stop at $N=50$ because $p<0.05$ vs. $N=50$ because "that was the plan," the likelihood of the observed data is identical.
          *   Therefore, the posterior update is identical.
          *   *Key nuance:* Bayesians care about *degrees of belief*, not long-run error rates.

      *   **Reconciling the Paradox:**
          *   Frequentists ask: "How often would this procedure mislead me in the long run?" (Procedure-oriented).
          *   Bayesians ask: "Given this specific data, how much should I believe H?" (Evidence-oriented).
          *   Optional stopping creates a procedure that misleads often (Frequentist failure) but each individual misleading instance looks like strong evidence (Bayesian update).
          *   *Crucial Point:* Bayesians can be "calibrated" wrong if the prior is wrong or if the stopping rule exploits the prior.

      *   **The "Honest Assessment" (The Critical Core):**
          *   Is the immunity real? Yes, mathematically, regarding *coherence*.
          *   Does it hold in practice? No, not entirely.
          *   *Reason 1: Priors.* If you use a "default" prior that doesn't reflect reality, optional stopping can drift towards false conclusions (Roulette wheel problem).
          *   *Reason 2: Model Misspecification.* If the model is wrong, likelihoods are wrong. Stopping rules can exploit this.
          *   *Reason 3: Decision Theory.* If you *act* on the posterior (e.g., publish if BF > 10), you re-introduce frequentist-like error rates. This is the "Bayesian Frequentist" hybrid problem.
          *   *Reason 4: Information Leakage.* If the stopping rule depends on the parameter (e.g., stop when effect > 10), the likelihood *does* change. (Though standard optional stopping usually depends on $p$ or BF, not raw $\theta$).
          *   *Simulation Evidence:* Mention that simulations show Bayes Factors *can* be biased by optional stopping if the threshold is fixed and peeking is unlimited (Schönbrodt et al.).

      *   **Refining the "Likelihood Principle" Nuance:**
          *   Strict LP says stopping rule is irrelevant *if* the rule doesn't convey information about the parameter.
          *   If the stopping rule is "Stop when $\theta > 5$", that conveys info.
          *   Standard optional stopping ("Stop when $p < .05$") is usually considered non-informative about $\theta$ *directly*, but it selects for noise.
          *   Wait, does optional stopping convey info? In a Bayesian framework, if the stopping rule is known, it *should* be part of the model. But standard Bayesian practice ignores it. Why? Because the likelihood of the *observed data* is unchanged.
          *   *Correction:* I need to be careful here. The Likelihood Principle holds for the *observed* data. But if we evaluate the *procedure*, we leave the LP.
          *   *Key Insight:* Bayesian immunity protects the *interpretation of the specific dataset*, not the *reliability of the research pipeline*.

      *   **Synthesizing the "Too Convenient" Feeling:**
          *   The user feels it's a loophole. It is, if you care about truth-tracking in a scientific ecosystem.
          *   If everyone peeks, the literature becomes filled with high-BF false positives (if priors are weak).
          *   The "immunity" is internal consistency, not external validity.

  4.  **Review and Refine:**
      *   *Tone:* Respectful, rigorous, not dogmatic.
      *   *Clarity:* Avoid overly dense notation. Use analogies.
      *   *Check:* Did I answer the specific question about "private intentions"? Yes, emphasize that frequentists care about the *space of possibilities* (intentions define the space), Bayesians care about the *actualized reality* (data).
      *   *Self-Correction on Bayesian Immunity:* I must explicitly mention that while the *Posterior* is unaffected, the *probability of reaching a misleading conclusion* (calibration) *is* affected by optional stopping in Bayesian terms if you set a decision threshold. This is the "Bayesian Error Rate" argument (e.g., by Sanborn & Hills, or Rouder).
      *   *Reference:* Mention the distinction between *Stopping Rule Principle* (SRP) and actual performance.

  5.  **Final Polish:** Organize into clear headings. Ensure the "Honest Assessment" section is robust, as that's what the user specifically asked for regarding "theoretical idealization." (Make sure to mention that if priors are well-calibrated, optional stopping is less harmful, but if priors are vague, it's risky).

  6.  *(Self-Correction during drafting)*: I need to make sure I don't conflate "Stopping Rule Principle" with "Likelihood Principle." They are related but distinct. The SRP says inference shouldn't depend on the rule. The LP says inference depends only on the likelihood. SRP follows from LP. I will stick to LP as it's more fundamental to the user's query.

  7.  *(Final Check on the "Immunity" claim)*: Recent literature (e.g., Heike Freytag, Eric-Jan Wagenmakers) suggests that while Bayes Factors are robust, they aren't *immune* to bias in terms of false discovery rates if thresholds are treated like $p$-values. I need to highlight that treating a BF > 10 as a "significant" stop criterion reintroduces the problem.

  8.  **Final Output Generation** (Proceed to write response based on these thoughts).
answer: |-
  Your skepticism is well-founded. The claim that Bayesian analysis is "immune" to optional stopping often sounds like a magic trick, especially when contrasted with the frequentist condemnation of the exact same behavior. It feels like a loophole where the *researcher's mind* determines the *data's validity*.

  To resolve this, we have to disentangle three things: the mathematical mechanism of the Likelihood Principle, the philosophical definition of "evidence," and the practical reality of scientific calibration.

  Here is a mechanistic explanation of why the frameworks diverge, followed by an honest assessment of whether Bayesian immunity holds up in practice.

  ---

  ### 1. The Mechanism: Why Frequentists Care About Intentions

  To understand the divergence, you must first accept that Frequentism and Bayesianism are answering different questions.

  **The Frequentist Question:** "If the null hypothesis were true, how often would a procedure *like this* produce data that look this extreme?"

  Notice the phrase "a procedure like this." Frequentist error rates ($\alpha$, $p$-values) are properties of the **experimental design**, not just the data. They are calculated over the *sampling distribution*—the set of all possible datasets that *could* have been observed under the same protocol.

  *   **Fixed Sample Size:** If you plan $N=100$, the "space of possibilities" is all sequences of 100 observations.
  *   **Optional Stopping:** If you plan "collect until $p < 0.05$ or $N=100$," the space of possibilities expands. It now includes sequences where you stopped at $N=20$, $N=21$, etc.

  By peeking, you effectively cast a wider net. You give random noise multiple opportunities to cross the significance threshold. Under the null hypothesis, a $p$-value is uniformly distributed *once*. If you check it 10 times, the probability that *at least one* check dips below 0.05 is much higher than 5%.

  **Why intentions matter:** To a frequentist, your intention defines the "procedure." If you intended to stop at $N=100$ but stopped at $N=50$ because you got bored, a strict frequentist must technically treat that as a deviation from the protocol, altering the sampling space. If you intended to stop when $p < 0.05$, the sampling space includes all the "near misses" you would have collected had you not gotten lucky early. The $p$-value calculates the probability of the data *plus* the probability of the "more extreme" data you *would have collected* under that intention.

  ### 2. The Mechanism: Why Bayesians Claim Immunity

  **The Bayesian Question:** "Given the data I actually have, how much should I update my belief in the hypothesis?"

  Bayesian inference relies on **Bayes' Theorem**:
  $$ P(H|D) \propto P(D|H) \times P(H) $$

  The core term here is the **Likelihood**, $P(D|H)$: the probability of observing *this specific data* given the hypothesis.

  **The Likelihood Principle:** This principle states that all evidential meaning in data is contained in the likelihood function. Crucially, the likelihood of the *observed* data does not change based on unobserved data or the rules that governed collection.

  *   **Scenario A:** I flip a coin 100 times. I get 60 Heads.
  *   **Scenario B:** I flip a coin until I get 60 Heads. It takes 100 flips.

  In both scenarios, the observed data is "60 Heads, 40 Tails." The likelihood of this specific sequence (assuming independence) is mathematically identical. The fact that in Scenario B I *would have kept flipping* if I hadn't reached 60 Heads is counterfactual. The data that *didn't happen* does not exist in the likelihood function.

  Therefore, if you calculate a Bayes Factor (BF) or a Posterior Probability for the dataset collected via optional stopping, the number comes out exactly the same as if the sample size had been fixed. The "private intention" of the researcher does not appear in the equation.

  ### 3. Reconciling the Paradox

  How can the same data be "biased" in one framework and "pure" in the other?

  The resolution lies in the definition of **Error**.

  *   **Frequentist Error (Calibration):** This is about the long-run performance of the *method*. Optional stopping breaks the link between the $p$-value and the long-run false positive rate. If everyone uses optional stopping, 100% of null effects might eventually be published as "significant." The *procedure* is broken.
  *   **Bayesian Error (Coherence):** This is about internal logical consistency. A Bayesian argues that if the data show a likelihood ratio of 10:1 in favor of $H_1$, then you *should* believe $H_1$ ten times more than you did before, regardless of how you got there. To ignore the data because of the stopping rule would be to violate the laws of probability (specifically, coherence).

  **The Paradox Resolved:** Optional stopping produces a dataset that is **rare under the null** (which is why the Frequentist flags it) but **equally likely under the alternative** (which is why the Bayesian accepts it).
  The Frequentist says: "You searched until you found a rare event; that's not evidence, that's selection bias."
  The Bayesian says: "But you *did* find the event. The likelihood ratio is what it is. If the null were true, this data would be unlikely. If the alternative were true, this data would be likely. That ratio hasn't changed."

  ### 4. The Honest Assessment: Is the Immunity Real?

  This is the critical part. The claim of "immunity" is theoretically robust but practically fragile. It holds up as a matter of **coherence**, but it often fails as a matter of **calibration** and **truth-tracking**.

  Here are four reasons why the Bayesian immunity is often a "theoretical idealization."

  #### A. The Decision Threshold Problem
  Bayesian immunity applies to the *Posterior* or the *Bayes Factor*. It does not apply to *decisions*.
  In practice, researchers do not just report a BF; they act on it. "If BF > 10, I publish/claim discovery."
  If you introduce a decision threshold and combine it with optional stopping ("Peek until BF > 10"), you reintroduce frequentist-style error rates.
  Simulations (e.g., by Schönbrodt, Wagenmakers, et al.) show that if you peek continuously and stop only when BF > 10, you **will** eventually find evidence for a false hypothesis, provided you have enough time/resources. The BF might be "coherent," but the *false discovery rate* of the pipeline inflates. The immunity protects the *number*, not the *conclusion drawn from the number*.

  #### B. The Prior Sensitivity
  Bayesian immunity assumes your Prior $P(H)$ is fixed and honest. Optional stopping can exploit weak priors.
  If you use a "default" diffuse prior (common in psychology), the Bayes Factor can be biased toward the null for small $N$ and toward the alternative for large $N$ (or vice versa, depending on the prior scale).
  If a researcher peeks, they are essentially waiting for the random walk of the BF to hit their threshold. If the prior is not well-calibrated to the true effect size distribution, optional stopping allows the researcher to "wait out" the noise until the BF temporarily favors their desired hypothesis. The Likelihood Principle holds, but the *interpretation* of that likelihood depends on the prior, which is now being implicitly manipulated by the stopping time.

  #### C. Model Misspecification
  The Likelihood Principle assumes the model is correct. If your statistical model is misspecified (e.g., you assume normality but the data are heavy-tailed), the likelihood function is wrong.
  Optional stopping exacerbates model misspecification. Extreme values (outliers) often drive early significance. If you stop early because of an outlier, and your model doesn't account for outliers, your likelihood is garbage. Frequentist robustness checks often catch this; Bayesian updating just confidently updates on the garbage likelihood.

  #### D. The "Stopping Rule is Data" Argument
  There is a nuanced counter-argument within Bayesian theory itself. Some Bayesians argue that if the stopping rule depends on the parameter of interest, the stopping rule *itself* is data and should be modeled.
  *   **Standard Optional Stopping:** "Stop when $p < 0.05$." This depends on the data, not directly on the parameter $\theta$. Most Bayesians say ignore it.
  *   **Informative Stopping:** "Stop when the effect size looks > 0.5." This conveys information about $\theta$.
  However, in the "replication crisis" context, stopping is usually based on significance (which is a function of data). While the strict Likelihood Principle says ignore it, **predictive checking** suggests that if you know a researcher used optional stopping, you should downgrade your trust in their prior or their model. A sophisticated Bayesian analysis *of the researcher* (meta-science) would treat "used optional stopping" as evidence that the researcher is prone to $p$-hacking, and thus adjust the prior probability that their hypothesis is true downward.

  ### 5. Summary: The Verdict

  You are right to feel that "immunity" is too convenient. Here is the bottom line:

  1.  **Mathematically:** The Bayesian claim is correct. The likelihood of the observed data does not change based on the stopping rule. A posterior calculated on the data is internally coherent regardless of how the data were collected.
  2.  **Practically:** The claim is misleading. While the *posterior* is unbiased, the **probability of obtaining a misleading posterior** increases with optional stopping.
  3.  **The "Private Intentions" Issue:** It is not that the data change meaning based on intentions. It is that Frequentism evaluates the **process** (which includes intentions), while Bayesianism evaluates the **product** (the data).
  4.  **The Trap:** If the scientific community adopts Bayesian methods but retains the habit of "stopping when the evidence looks good," they will reproduce the replication crisis, just with Bayes Factors instead of $p$-values.

  **Recommendation:**
  If you are analyzing data where optional stopping occurred:
  *   **Frequentist:** You must adjust (e.g., alpha spending functions) or admit the $p$-value is invalid.
  *   **Bayesian:** You can calculate the posterior, **BUT** you should not treat a threshold (like BF > 10) as a hard "discovery" rule if stopping was optional. You must acknowledge that the *rate* of false positives in the literature generated by this method is higher than the nominal Bayesian error rates suggest.

  The Bayesian framework saves you from logical incoherence, but it does not save you from a research culture that rewards finding patterns in noise. Optional stopping is a way of mining for noise; Bayesian math treats the mined noise as valid evidence, which is why the "immunity" feels like a bug to a scientist concerned with truth, rather than a feature.
