answer: |-
  **Title:** The Common Prior Problem

  **Setting:** *Twitter DMs, 2:00 AM.*
  **Characters:**
  *   **@BayesLord:** A rationalist who believes Aumann's Agreement Theorem is a conversation-ending superweapon.
  *   **@EpistemicHumility:** A formal epistemologist who actually reads the footnotes.

  ***

  **@BayesLord:** Look, we can't actually disagree on this policy take. It's literally impossible.

  **@EpistemicHumility:** Why?

  **@BayesLord:** Aumann's Agreement Theorem. We're both Bayesians. If we exchange posteriors, we must converge. If we don't converge, one of us is irrational. I'm not irrational. So...

  **@EpistemicHumility:** Do we have a common prior?

  **@BayesLord:** Obviously. We're both reasonable people. We start from the same baseline of truth-seeking.

  **@EpistemicHumility:** Okay, assume I grant that. Do we have *common knowledge* of each other's posteriors? Like, I know your posterior, you know mine, I know that you know mine, ad infinitum?

  **@BayesLord:** I just tweeted my posterior.

  **@EpistemicHumility:** That's public information, not common knowledge. I don't know if you saw my reply. You don't know if I saw your tweet. We'd need to exchange emails until the heat death of the universe to satisfy the infinite regress condition.

  **@BayesLord:** You're nitpicking the math to avoid updating. Just tell me your probability.

  **@EpistemicHumility:** Fine. My posterior on "This conversation is productive" is 0.05.

  **@BayesLord:** Okay. I hear you. My posterior on "This conversation is productive" is now 0.05 as well.

  **@EpistemicHumility:** Wait, really? You updated that fast?

  **@BayesLord:** Yes. Because I realized something.

  **@EpistemicHumility:** What?

  **@BayesLord:** My prior on "EpistemicHumility is being difficult" was high. But now that you've stated your posterior clearly, I realize you *are* trying to be rational. So I update my view of *you*, which updates my view of the conversation.

  **@EpistemicHumility:** Okay, but now I know that you know my posterior is 0.05. And you know that I know you updated to 0.05.

  **@BayesLord:** Right.

  **@EpistemicHumility:** But if you updated to 0.05, that means you think the conversation is unproductive.

  **@BayesLord:** Yes.

  **@EpistemicHumility:** So why are you still typing?

  **@BayesLord:** ...

  **@EpistemicHumility:** If your posterior is 0.05, a rational agent should stop typing. By continuing to type, you are signaling that your *actual* posterior is higher.

  **@BayesLord:** I'm explaining why I'm typing!

  **@EpistemicHumility:** So your posterior on "I should stop typing" is low, but your posterior on "This conversation is productive" is 0.05? Those are correlated events, Chad. You're violating coherence.

  **@BayesLord:** Fine. New posterior: "I should stop typing" = 0.99.

  **@EpistemicHumility:** Great. Now we agree.

  **@BayesLord:** Wait. If we agree that I should stop typing, then we agree that I am wrong to continue.

  **@EpistemicHumility:** Yes.

  **@BayesLord:** But if I stop typing, I can't verify that you agree. So it's not common knowledge.

  **@EpistemicHumility:** True.

  **@BayesLord:** So I have to type one more message to confirm that we agree that I should stop.

  **@EpistemicHumility:** But that message *is* you not stopping.

  **@BayesLord:** Exactly. It's a paradox.

  **@EpistemicHumility:** No, it's not a paradox. It's just proof that you don't have a common prior with me.

  **@BayesLord:** What's my prior?

  **@EpistemicHumility:** Your prior is that "Winning the argument" and "Finding the truth" are the same event.

  **@BayesLord:** ...

  **@EpistemicHumility:** Mine aren't.

  **@BayesLord:** Okay. I see.

  **@EpistemicHumility:** See what?

  **@BayesLord:** My posterior on "You are annoying" just went to 1.

  **@EpistemicHumility:** Mine too.

  **@BayesLord:** Finally! Agreement!

  **@EpistemicHumility:** Aumann would be proud.

  **@BayesLord:** *[User has been blocked]*
