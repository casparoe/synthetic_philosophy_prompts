answer: |-
  This is an excellent close reading of the text. You are right to be suspicious of the leap from this passage to "Aquinas endorsed assassinating tyrants." Scholastic precision is exactly what gets lost in dinner-table arguments, and your grandfather is relying on a popularized summary of Thomism rather than the text itself.

  Here is the logical breakdown of the three specific hurdles you identified, followed by the crucial context regarding "killing" that is missing from this specific article.

  ### 1. Definitional vs. Cost-Benefit (The "Unless" Clause)

  You asked if Aquinas is making a definitional move (resisting a tyrant isn't sedition by definition) or a consequentialist one (it's okay *unless* it causes more harm), and how they work together.

  **The Answer:** It is a **two-stage moral evaluation.** Aquinas is using the definitional move to clear the *category* of the act, and the cost-benefit clause to judge the *circumstances* of the act.

  *   **Stage 1: The Formal Definition (The "What")**
      Aquinas defines *sedition* specifically as opposition to the **unity of the common good**.
      *   Premise A: A just government aims at the common good.
      *   Premise B: A tyranny aims at the private good of the ruler.
      *   Conclusion: A tyranny is, by definition, already opposed to the common good.
      *   Therefore: Opposing a tyranny is not opposing the common good. Therefore, it is not *sedition* (which is defined as opposing the common good).
      *   *Logical Function:* This removes the automatic moral prohibition. It says, "This act does not belong to the class of sins called 'sedition'."

  *   **Stage 2: The Material Proportionality (The "How")**
      The "unless" clause (*nisi forte sic intollerabiliter...*) introduces the principle of **proportionality**.
      *   Even if an act is not "sedition" by definition, it can still be sinful if it violates charity or prudence.
      *   If the resistance causes more destruction to the common good (civil war, anarchy, greater suffering) than the tyranny itself, the act becomes immoral—not because it is sedition, but because it is **reckless** or **disproportionate**.
      *   *Logical Function:* This sets the boundary conditions. It says, "You are allowed to resist, but you are not allowed to burn down the village to save it."

  **How they work together:** The definition grants the *license* to act; the proportionality clause sets the *limits* of that license. Without the definition, resistance is always a sin. Without the proportionality clause, resistance is justified regardless of the bloodshed. Aquinas needs both to maintain a coherent ethic of order.

  ### 2. "Disturbing" vs. "Killing" (The Tyrannicide Gap)

  You are absolutely correct: **This text does not mention killing.** It speaks of "disturbing a government" (*turbare regimen*) and "delivering a multitude."

  **The Inference Problem:**
  The leap from "disturbing a government" to "killing the ruler" is not contained in this text. It is an inference drawn from other parts of Aquinas's corpus and later Scholastic commentary, often conflated by laypeople (and apparently your grandfather).

  *   **In the *Summa*:** Aquinas treats "killing" under the virtue of Charity and Justice (II-II, Q. 64). There, he generally restricts lawful killing to **public authority** (the state executing a criminal) or **self-defense** (unintended death while protecting life). He explicitly argues against private individuals killing sinners, because the care of the common good is entrusted to public authorities, not private persons.
  *   **In *De Regno* (On Kingship):** This is where the "tyrannicide" rumor usually starts. In *De Regno*, Aquinas discusses removing tyrants. He suggests that if a tyrant is intolerable, the community (or a superior authority, like the Emperor over a King) can depose him. However, he explicitly warns against **private assassination**, arguing that it often leads to worse tyrants or civil strife.
  *   **The Later Scholastics:** In the 16th century, Jesuit Scholastics (like Juan de Mariana) went further than Aquinas, arguing that under specific conditions, a private citizen *could* kill a tyrant. This is likely the tradition your grandfather is actually channeling, but he is attributing it to Aquinas for authority.

  **Verdict:** You are not missing an inference in *this* text. The inference isn't there. Citing *Summa* II-II, Q. 42 to justify *killing* a tyrant is a category error. It justifies *resistance* or *deposition*, but the *means* of that deposition are governed by other moral laws (prohibition on murder, requirement of public authority) which Aquinas generally argues preclude private assassination.

  ### 3. The Tyrant as "Guilty of Sedition" (Rhetoric or Philosophy?)

  You asked if calling the tyrant "seditious" is a rhetorical trick or real philosophical work.

  **The Answer:** It is **real philosophical work** regarding the ontology of political unity.

  *   **The Scholastic View of Unity:** For Aquinas, peace and unity are not just "absence of fighting." They are positive realities grounded in the *common good*.
  *   **The Logic:**
      1.  Sedition is a sin against the unity of the multitude.
      2.  True unity exists only when the multitude is ordered toward the common good.
      3.  A tyrant orders the multitude toward his *private* good.
      4.  Therefore, the tyrant is the one actively dissolving the true unity of the multitude.
      5.  Therefore, the tyrant is the true "seditious" party.
  *   **Why this matters:** This isn't just name-calling. It shifts the **burden of guilt**. In a rebellion, the default assumption is that the rebels are breaking the peace. Aquinas argues that the peace was *already broken* by the tyrant. The rebels are not "breaking the peace"; they are attempting to *restore* the peace that the tyrant shattered.
  *   **Function:** It legitimizes the resistance as **restorative justice** rather than **revolutionary violence**. It makes the resistance an act of upholding the law (the natural law of the common good) rather than breaking it.

  ### Summary for Your Next Dinner

  If you need to push back without starting a war, here is the precise Thomistic position based on the text you found:

  1.  **On Sedition:** Aquinas argues resisting a tyrant is not "sedition" because tyranny is already an attack on the common good. However, resistance is only permitted if it does not cause *greater* harm to the common good than the tyranny itself (the proportionality clause).
  2.  **On Killing:** This specific text does not authorize killing. Aquinas generally holds that removing a tyrant is the job of **public authority** (a higher king, the church, or the community acting through legal mechanisms), not private individuals. Private assassination is generally condemned by him in other parts of the *Summa* because it invites anarchy.
  3.  **On the Tyrant:** Aquinas classifies the tyrant as the true seditious actor because he prioritizes private gain over the common good, thereby dissolving the moral bond of the society.

  **The "Gotcha" for your grandfather:**
  "Grandfather, I read Q. 42. Aquinas says resisting a tyrant isn't sedition, but he also says the tyrant is the one guilty of sedition. But nowhere in that article does he authorize private citizens to kill the ruler. He talks about 'disturbing the government,' not assassination. If you want to cite Aquinas on killing tyrants, we have to look at *De Regno*, where he actually warns against killing tyrants if it causes more turmoil. Are you arguing for Aquinas's view, or the later Jesuit view that Aquinas himself might have cautioned against?"

  This acknowledges his authority (Aquinas) while correcting the textual interpretation without dismissing his traditionalist framework.
