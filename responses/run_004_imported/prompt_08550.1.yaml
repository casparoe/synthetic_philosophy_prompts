answer: |-
  This is a classic academic dilemma: the tension between **procedural compliance** (your advisor) and **ethical intent** (your friend). It is completely understandable that this is keeping you up at night; academic integrity is high-stakes, and ambiguity is stressful.

  Here is a breakdown of who is right, why the situation is more nuanced than a binary choice, and a concrete framework to help you resolve the anxiety and decide on a course of action.

  ### 1. Deconstructing the Arguments

  **Your Advisor (The Procedural Argument)**
  *   **The Logic:** Policies are contracts. If the text says "Do not promote *during* the review period," then actions taken *before* that period are compliant.
  *   **The Precedent:** In many fields (especially CS/ML), posting pre-prints (arXiv) or workshop versions of a paper before submission is standard and explicitly allowed, even though it technically breaks anonymity. The assumption is that reviewers will follow instructions *not* to google the paper.
  *   **The Weakness:** This relies on a "honor system" that everyone knows is leaky. It prioritizes technical adherence over the actual state of anonymity.

  **Your Friend (The Principled Argument)**
  *   **The Logic:** The *goal* of double-blind review is to prevent bias. If anonymity is compromised, the goal is failed, regardless of when the breach occurred.
  *   **The Precedent:** Reviewers are often instructed to recuse themselves if they feel they can identify an author. If your thread makes identification trivial, a scrupulous reviewer (like your friend) feels the process is tainted.
  *   **The Weakness:** This interpretation can be paralyzing. If *any* prior public discussion of a project disqualifies a submission, researchers couldn't present at workshops, post on arXiv, or discuss projects on GitHub before submission, which would stall scientific progress.

  ### 2. The "Third Perspective": Community Norms

  The reality usually lies between your advisor and your friend, governed by **community norms** rather than just the written policy.

  In most subfields that use double-blind review (like Computer Science, AI, etc.), the community has implicitly accepted that **"Double-Blind" effectively means "Don't actively campaign."**

  *   **Prior Work vs. Submission:** There is a critical distinction between posting "early results from a project" (what you did) and posting "Our paper [Title] is under review at [Conference]" (what you are doing now).
  *   **The ArXiv Standard:** Most top conferences allow arXiv preprints. An arXiv paper is googleable, name-attached, and permanent. If a tweet points to a project that *became* a paper, but doesn't explicitly link the *submission itself*, it is often treated as prior work.
  *   **Reviewer Instructions:** Reviewers are typically instructed: *"If you suspect you know the authors, do not investigate. If you accidentally find out, continue reviewing objectively."* Your friend is being exceptionally scrupulous (which is good!), but they may be holding themselves to a higher standard than the conference requires.

  ### 3. A Smarter Way to Frame the Disagreement

  Instead of asking "Who is right?", ask: **"Does this thread constitute active identification of the *submission*, or does it document the *research trajectory*?"**

  Here is the checklist to determine your risk level:

  1.  **Title Match:** Does the Twitter thread use the exact same title as the submitted paper?
      *   *Yes:* High risk. This looks like an announcement of the submission.
      *   *No:* Lower risk. This looks like prior work.
  2.  **Content Overlap:** Does the thread contain the *final* claims and results of the submission, or just "early results" (as you stated)?
      *   *Final Results:* High risk.
      *   *Early/Preliminary:* Lower risk. This is standard scientific discourse.
  3.  **Explicit Link:** Does the thread mention the conference name or the word "submission"?
      *   *Yes:* Violation.
      *   *No:* Likely compliant.

  ### 4. Actionable Advice

  You need to move from "worrying" to "managing." Here is a step-by-step plan:

  **Step 1: Read the FAQ, not just the Policy.**
  Most top conferences (NeurIPS, ICML, ACL, CVPR, etc.) have an "Author FAQ." Search for "arXiv," "prior work," or "social media."
  *   *If they allow arXiv:* They acknowledge anonymity is imperfect. A tweet about early results is usually treated similarly to an arXiv preprint.
  *   *If they ban all public artifacts:* You have a problem, and your friend is right. (This is rare).

  **Step 2: Assess the "Google Test."**
  Ask a colleague who is *not* involved in the project to Google the paper title. Then ask them to Google your Twitter handle + keywords.
  *   If the connection is obvious and immediate, the anonymity is compromised.
  *   If it requires digging, you are likely within the norms of "passive" availability.

  **Step 3: Mitigation (The Safe Play).**
  If you want to sleep better at night and honor your friend's concern without admitting guilt:
  *   **Edit the Thread:** You can edit the tweet to remove specific claims that match the paper too closely, or add a disclaimer: *"Note: This work evolved significantly since this post. Current version under anonymous review."*
  *   **Delete (Optional):** If the thread is getting new engagement *now* because of the submission window, deleting it removes the active signal. However, deleting old content can sometimes look suspicious if discovered.
  *   **Do Nothing (With Documentation):** If the thread is clearly "prior work" (different title, preliminary results), keep it. Write down the date of the tweet and the submission policy for your own records. If questioned later, you have proof the post predates the review window.

  **Step 4: Address the Friend/Reviewer Conflict.**
  This is delicate. Your friend is a reviewer. If they believe the blind is broken, **they should recuse themselves from reviewing your paper.**
  *   They cannot ethically review it if they feel the anonymity policy is violated, because they now possess "outside information."
  *   You do not need to tell them what to do, but recognize that their anxiety is partly *their* burden to manage via recusal, not yours to manage via deletion.

  ### Summary Verdict

  **Your advisor is likely right on policy; your friend is right on principle.**

  However, in the modern academic landscape, **your advisor's view is the operational standard.** Conferences know that research is iterative. They ban *active campaigning during the window* because that influences reviewers in real-time. They generally accept that past work exists.

  **Recommendation:**
  1.  Verify the thread doesn't explicitly name the conference or the specific submission title.
  2.  If it doesn't, treat it as prior work (arXiv style).
  3.  Trust that reviewers are instructed not to hunt for authors.
  4.  If your friend feels compromised, support their decision to recuse themselves, but do not assume the paper will be rejected.

  You followed the rules as written at the time. Don't let the "perfect" (total anonymity) become the enemy of the "good" (fair process). Focus on the quality of the paper now; that is the variable you can actually control.
