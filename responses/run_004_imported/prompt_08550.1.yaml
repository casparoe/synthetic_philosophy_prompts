      *   **User's State:** Anxious ("can't stop turning it over in my head"), sees merit in both sides.
      *   **Goal:** Determine who has the better argument or reframe the disagreement to find a resolution/path forward.

  2.  **Evaluate the Arguments:**

      *   **Advisor's Argument (Literal/Procedural):**
          *   *Strengths:* Most conference policies are written specifically to govern behavior *after* submission. Pre-prints and prior workshops are usually allowed (often with caveats). If the policy says "during the review period," technically, past actions aren't violations.
          *   *Weaknesses:* Ignores the practical reality of de-anonymization. If the thread links clearly to the paper, the blind review is compromised regardless of *when* the link was made.

      *   **Friend's Argument (Spirit/Intent):**
          *   *Strengths:* Accurately identifies the *purpose* of double-blind review (mitigating bias). If anonymity is broken, the process is flawed.
          *   *Weaknesses:* Might be over-interpreting the policy. If *no one* could post anything ever about a project before submission, research collaboration would be impossible. There's usually a distinction between "prior work/pre-prints" and "active campaigning."

  3.  **Consult General Academic Norms (specifically CS/AI/ML):**
      *   *ArXiv:* Most top conferences (NeurIPS, ICML, CVPR, ACL, etc.) allow arXiv preprints. These are public and googleable.
      *   *Social Media:* Policies vary. Some explicitly ban linking the submission on social media *after* submission. Some ban *any* identification.
      *   *Prior Work:* Posting early results 8 months ago is usually considered "prior work" or "work in progress," not the submission itself.
      *   *The "10 Seconds" Test:* If the thread title matches the paper title, or the results are identical, it's a problem. If it's "early results" (e.g., "We tried X, got Y accuracy" vs. the full paper "We propose Z, which improves Y by 10%"), it might be distinct enough.

  4.  **Identify the Core Tension:**
      *   It's not just "Rule vs. Spirit." It's "Active Promotion vs. Passive Existence."
      *   It's also "Technical Compliance vs. Ethical Integrity."

  5.  **Formulate a Strategy for the User:**
      *   **Validation:** Acknowledge the anxiety. This is a common stress point in academia.
      *   **Policy Check:** The specific wording matters immensely. Does it ban "publicly available artifacts" or "active promotion"?
      *   **Risk Assessment:** What happens if caught? Desk reject? Ignored?
      *   **Actionable Advice:** Can the thread be edited/deleted? Should they contact PCs?
      *   **Reframing:** Move from "Who is right?" to "What minimizes risk and aligns with integrity?"

  6.  **Drafting the Response (Iterative Process):**

      *   *Empathy:* Start by validating the feeling. It's a tough spot.
      *   *Analyze the Policy:* Distinguish between "active promotion" and "prior dissemination." Most conferences allow preprints (arXiv). A Twitter thread about early results is often treated similarly to a workshop paper or preprint.
      *   *The "Double-Blind" Reality:* Acknowledge the friend's point. Double-blind is often "single-blind in practice" because of arXiv. Reviewers are instructed *not* to look.
      *   *The Crucial Distinction:* Did the thread identify the *submission* or just the *project*? There's a difference between "Here is our paper submitted to Conf X" and "Here are some cool experiments we are doing."
      *   *Advisor vs. Friend:* The Advisor is likely right on *policy*, the Friend is right on *idealized anonymity*. But idealized anonymity doesn't exist in the arXiv era.
