answer: |-
  This is a classic debate in quantitative finance and gambling theory. The short answer is: **Your friend is mathematically correct about the asymptotic limit, but he is practically wrong about what constitutes "rational" behavior for a human being.**

  You are not being irrational by betting half-Kelly. In fact, most professional gamblers and quantitative funds use fractional Kelly precisely for the reasons you cited.

  Here is the breakdown of where your friend is right, where he is overselling it, and why half-Kelly is often the superior choice in the real world.

  ### 1. Where Your Friend Is Right (The Math)
  Your friend is correct on the narrow theoretical properties of the Kelly Criterion.

  *   **Maximizing Geometric Growth:** It is mathematically proven that betting Full Kelly maximizes the expected logarithm of wealth. In the limit (as the number of bets $N \to \infty$), a Full Kelly bettor will almost surely have more wealth than someone using any other strategy (including half-Kelly or fixed fractional betting).
  *   **The Flaw of Arithmetic Expected Value (EV):** He is also right about "geometric rationality" (often associated with ergodicity economics, like the work of Ole Peters). If you maximize *arithmetic* EV on repeated bets, you will eventually go broke.
      *   *Example:* A bet that doubles your money on heads and loses 60% on tails has a positive arithmetic EV. But if you bet your whole bankroll repeatedly, you will eventually hit a tail and lose 60%, then need a 150% gain just to break even. The compounding math (geometric mean) drags you to zero. Kelly solves this by optimizing the geometric mean.

  So, on a whiteboard, with infinite time and perfect knowledge, Full Kelly wins.

  ### 2. Where Your Friend Is Wrong (The Reality)
  The argument that Full Kelly is the *only* rational strategy falls apart once you introduce real-world constraints. Here is why your half-Kelly approach is defensible:

  #### A. Volatility and Drawdowns
  Full Kelly is incredibly volatile. By definition, a Full Kelly strategy expects to see its bankroll drop by **50%** at some point.
  *   To recover from a 50% drawdown, you need a 100% gain.
  *   To recover from a 70% drawdown (which is possible with Full Kelly variance), you need a 233% gain.

  Most humans have a utility function that is not purely logarithmic. We feel the pain of a loss more acutely than the pleasure of an equivalent gain (loss aversion). If a 50% drawdown causes you to panic, sleep poorly, or abandon the strategy, then Full Kelly is **suboptimal for you**, regardless of the asymptotic math. Half-Kelly reduces variance by 75% while only sacrificing 25% of expected growth. That is an excellent trade-off.

  #### B. Estimation Error (The Killer)
  This is the strongest argument against your friend. The Kelly formula requires you to know the **true probability** of winning and the **true payoff**.
  $$ f^* = \frac{p(b+1) - 1}{b} $$
  In a casino (like blackjack card counting), you can calculate these probabilities with high precision. In investing or sports betting, you cannot. You are dealing with *estimated* edges.

  *   **Overbetting leads to ruin:** If you calculate an edge that is slightly too high and bet Full Kelly based on that error, you are effectively overbetting.
  *   **The Cliff:** The growth rate function drops off very sharply if you bet more than Full Kelly. If you bet double-Kelly, your expected geometric growth rate drops to **zero**. You will tread water forever. If you bet more than that, you will go broke.
  *   **The Slope:** The growth rate function is very flat *below* Full Kelly. Betting half-Kelly puts you on the safe, flat part of the curve where estimation errors don't hurt you much.

  By betting half-Kelly, you are building in a "margin of safety" against your own inability to perfectly calculate probabilities.

  #### C. Time Horizon and Consumption
  Full Kelly assumes you are maximizing terminal wealth at the end of time. But you are a human who needs to consume capital along the way.
  *   If you need to withdraw money from your portfolio to live, massive drawdowns become dangerous.
  *   If you have a finite time horizon (e.g., you want to retire in 20 years, not 100 years), the "long run" convergence of Full Kelly might not happen before you need the money. Half-Kelly offers a smoother equity curve, which is better for finite horizons.

  ### 3. On "Geometric Rationality"
  Your friend is referencing a specific school of thought (Ergodicity Economics) that argues rational agents should maximize the time-average growth rate rather than the ensemble-average (expected value).

  *   **He is right** that this invalidates naive Expected Value reasoning for repeated bets.
  *   **He is wrong** that this mandates *Full* Kelly. Maximizing the time-average growth rate implies maximizing Log Utility. However, if your personal utility function is *more* conservative than Log Wealth (which it likely is, given you care about drawdowns), then maximizing *your* utility mathematically requires betting *less* than Kelly.

  Rationality is defined by maximizing *your* utility, not the theoretical maximum growth of the bankroll. If sleep and stability have value to you, half-Kelly maximizes your utility better than Full Kelly.

  ### 4. What the Pros Do
  If this were settled in favor of your friend, every professional gambler and quant fund would use Full Kelly. They don't.
  *   **Bill Benter** (legendary horse bettor) and other card counters typically use fractional Kelly.
  *   **Edward Thorp** (who invented the application of Kelly to investing) advocated for fractional Kelly to reduce volatility.
  *   **Warren Buffett** and **Charlie Munger** have concentration levels that resemble Kelly, but they also sit on massive cash piles to mitigate the drawdown risk, effectively acting as a fractional bet on their total net worth.

  ### The Verdict
  Your friend is winning the argument on **pure asymptotic theory**, but you are winning on **practical application and risk management.**

  *   **Is Full Kelly irrational?** No, it is optimal for an agent with Log Utility, infinite time horizon, and perfect knowledge of probabilities.
  *   **Is Half-Kelly irrational?** No. It is optimal for an agent who acknowledges estimation error, has a lower risk tolerance than Log Utility, and has a finite time horizon.

  **How to reply to him:**
  Tell him you acknowledge that Full Kelly maximizes asymptotic geometric growth, but that in the presence of **parameter uncertainty** (not knowing the true edge) and **finite utility** (caring about drawdowns), Fractional Kelly dominates Full Kelly on a risk-adjusted basis. You aren't leaving money on the table; you're paying an insurance premium against being wrong about your edge and against having a heart attack during the 60% drawdown.

  You're not being irrational; you're being employable. Full Kelly gets you fired (or busted) before the "long run" arrives.
