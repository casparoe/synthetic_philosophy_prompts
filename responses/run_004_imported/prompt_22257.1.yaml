      *   **Bayes (Bayesian):** Focuses on belief updating, coherence, the Likelihood Principle, and evidence *in the data*. Worried about misinterpreting what the data say based on hypothetical unobserved data (stopping rules).
      *   **Dynamic:** They know each other, respect each other's math, but disagree on the *philosophy of inference*.

  3.  **Key Technical Points to Cover:**
      *   **Optional Stopping:** The act of monitoring data and stopping when $p < 0.05$.
      *   **Frequentist Objection:** Inflates Type I error rate ($\alpha$). The sampling distribution changes.
      *   **Bayesian Objection:** Likelihood Principle. The stopping rule is irrelevant to the posterior (assuming proper priors and model).
      *   **The "Cost" for Frequentists:** Loss of error control, replication failure.
      *   **The "Cost" for Bayesians:** Sensitivity to priors, computational complexity, potential for "Bayesian hacking" (though they argue it's less structural).
      *   **The "Hidden Commitments":** Frequentists commit to a hypothetical long-run. Bayesians commit to subjective priors.

  4.  **Drafting - Section by Section:**

