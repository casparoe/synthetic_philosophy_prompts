answer: |-
  The hotel bar is dim, the air conditioning humming a low counterpoint to the clink of ice. Eleanor (Frequentist) and Marcus (Bayesian) are sharing a high-top table, empty slides from the afternoon's session still projected in their minds. I sit nearby, notebook open, pretending not to eavesdrop. They know I'm there; they've invited me into the periphery of their argument.

  **Eleanor:** You enjoyed that session, didn't you? The hand-wringing about "questionable research practices." You looked almost smug when the speaker mentioned optional stopping.

  **Marcus:** I looked relieved, Eleanor. Finally, people are admitting that the $p$-value is a fragile little thing. It breaks if you look at it wrong. If the replication crisis is caused by researchers peeking at data and stopping when things look good, that's not a crisis of morality. It's a crisis of using a tool that forbids learning from data.

  **Eleanor:** It's not that the tool forbids learning. It's that the tool measures *error rates*, not *truth*. When you peek, you change the sampling distribution. You expand the space of possible outcomes where you *could* have stopped. If I design a test with $\alpha = 0.05$, I am promising the scientific community that, in the long run, I will falsely claim an effect only 5% of the time. If you peek, that promise is broken. The actual error rate might be 15%, 20%. You're printing false positives and calling them discoveries.

  **Marcus:** But that "long run" is a fiction. I have *this* dataset. I have *this* experiment. The Likelihood Principle states that all the evidence relevant to a parameter is contained in the likelihood function of the observed data. My decision to stop collecting data—whether because I ran out of money, because $p < 0.05$, or because a chicken crossed my lab—does not change the likelihood of the data I actually have. Why should my inference depend on data I *might* have collected but didn't?

  **Eleanor:** Because science isn't just about your inference. It's about calibration. It's a social contract. When you publish a $p$-value, you are using a shared currency. If you devalue that currency by changing the rules of minting mid-stream, you create inflation. The replication crisis *is* the inflation. We have a literature full of effects that vanish because the original authors treated the $p$-value as a Bayesian signal when it was designed as a Frequentist guardrail.

  **Marcus:** And whose fault is that? If you give researchers a metric that says "significance" but forbid them from stopping when they see it, you are asking them to act against their own economic and ethical incentives. Ethically, if I see a drug is working at $N=50$, why should I be forced to recruit 50 more patients just to satisfy a hypothetical sampling distribution? That's the Frequentist commitment I can't swallow. You commit to hypothetical repetitions of the experiment that never happened. I commit to the coherence of my beliefs given the data that *did* happen.

  **Eleanor:** I commit to controlling the rate at which we fool ourselves. You talk about coherence, Marcus, but your coherence relies on the prior. And don't tell me you use "non-informative" priors. I've seen your code. You're smuggling in assumptions. When you peek, you might not inflate the Type I error in your Bayesian updating, but you can absolutely inflate the rate at which you claim "decisive evidence" if your stopping rule is correlated with your prior beliefs. You just hide it inside the prior specification.

  **Marcus:** That's a fair hit, but it's solvable. I can do a sensitivity analysis. I can show you how the posterior shifts with different priors. Can you show me how your $p$-value shifts with different *intentions*? Because that's what optional stopping is. It's policing the researcher's mind. If two researchers collect the exact same data, but one intended to stop at $N=100$ and the other intended to stop when $p < 0.05$, you give them different $p$-values. I give them the same posterior. Which one reflects the evidence?

  **Eleanor:** The one that accounts for the procedure that generated the data! If you don't account for the procedure, you can't trust the result in a cumulative science. You're treating every paper as a孤岛—island. But we build on each other. If I'm designing a study based on your power calculation, I need to know your false positive rate is actually 5%. If you peeked, it's not. My hidden commitment is to the *collective* error rate. Your hidden commitment is to *individual* rationality.

  **Marcus:** And my retort is that individual rationality is all we have. The "collective" is just a bunch of individuals updating beliefs. If I update coherently, I am doing my part. The problem isn't optional stopping; it's the dichotomous thinking. "Significant" or "not." If you reported effect sizes and uncertainty intervals, peeking wouldn't matter as much. But you Frequentists created the cliff edge, and now you're angry when people walk off it.

  **Eleanor:** We created the cliff edge because decision-making requires thresholds. Regulatory agencies, clinical guidelines, funding decisions—they need binary choices eventually. You can't tell the FDA, "Well, the posterior probability is 0.94, but it depends on my prior." They need to know the risk of approval given no effect. That requires a sampling distribution. That requires fixing $N$ or adjusting for peeking.

  **Marcus:** So we're back to the cost. My cost is subjectivity. I have to own my priors. I have to defend why I think an effect is likely before I see the data. Your cost is rigidity. You have to ignore the data accumulating in front of you to protect a hypothetical long-run frequency. You sacrifice efficiency and ethical flexibility for the sake of calibration.

  **Eleanor:** I sacrifice *nothing* if I plan properly. I can use group sequential designs. I can use alpha-spending functions. I can peek, Eleanor-style, if I account for it mathematically. But most biologists don't do that. They just peek and stop. And that *is* carelessness, however foundational the dispute is.

  **Marcus:** Or they peek and stop because the Frequentist framework is too brittle for the messy reality of discovery. They intuitively understand that more data is better, and that stopping when you're convinced is rational. The framework punishes rationality.

  **Eleanor:** (Sighs, swirls her drink) It punishes *unaccountable* rationality.

  **Marcus:** (Nods) And it rewards *rigid* ignorance.

  *They both turn to look at me. The silence stretches, heavy with thirty-five years of my lab notebooks.*

  **Eleanor:** You want to know what you should have done? You asked for blunt. Every time you felt the urge to peek at the data to decide whether to run another round of mice, you should have stopped. Or, if you couldn't stop, you should have calculated an alpha-spending function before you started the first experiment. You treated your $p$-values as if they were measures of evidence, but you used them as if they were error controls. You can't have it both ways. By peeking without adjustment, you rendered your $p$-values meaningless. You published noise and called it signal. To fix it, you'd need to re-analyze everything with a sequential design correction. Most of your "significant" findings would vanish. I'm sorry.

  **Marcus:** Don't listen to her apology. She's mourning the loss of the threshold, not the truth. Here is what you should have done. You should have specified a prior—based on previous literature, not hope—and calculated a Bayes Factor as the data came in. When the Bayes Factor crossed your threshold for evidence (say, 10:1), you stop. The stopping rule is irrelevant. The data speak for themselves. Your mistake wasn't peeking; your mistake was using a metric ($p$-value) that forbids peeking while operating in a world that demands it. You should have reported the posterior probability of the effect size. If you had done that, your "failed replications" would just look like "updated uncertainties." You didn't fail; your metric failed you.

  **Eleanor:** Your metric hides the false positives.

  **Marcus:** Your metric hides the evidence.

  **Eleanor:** (To me) Pre-register or adjust.

  **Marcus:** (To me) Update and report the likelihood.

  *They clink glasses, not in agreement, but in acknowledgment that the bill, like the philosophy, remains unpaid.*
