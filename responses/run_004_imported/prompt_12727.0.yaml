answer: |-
  **Setting:** *A cramped office in the Political Science department, late afternoon. Empty coffee cups and a stack of photocopies sit between **Elena** (proponent of the All-Affected-Interests Principle) and **Marcus** (proponent of the All-Subjected-to-Coercion Principle).*

  **Elena:** Let's stick to the dam. The legislature in Upstreamia is voting tomorrow to approve the hydroelectric project. It creates power for Upstreamia, but the runoff poisons the river that Downstreamia's farmers rely on. The farmers have zero representation in the Upstreamian legislature. Under the All-Affected-Interests principle, this is a clear violation. Their vital interests are at stake. They need a vote, or at least a veto.

  **Marcus:** I agree it's a moral outrage, Elena. But is it a *democratic* violation? That's the question. The Downstreamian farmers are not subjects of the Upstreamian state. They don't obey its laws. They don't pay its taxes. The Upstreamian legislature isn't issuing commands *to them*; it's issuing commands to its own citizens to build a dam. The harm is a side effect, not an act of political subjection.

  **Elena:** That distinction feels like semantic sleight of hand. If I put a gun to your head, I'm coercing you. If I build a dam that poisons your water and kills your livelihood, I'm also coercing you. I'm altering the conditions of your agency. If democracy is about self-determination, you can't determine your life if your water supply is controlled by a stranger's vote.

  **Marcus:** But if you equate "causal impact" with "political coercion," you dissolve the demos entirely. Think about the scope. Upstreamia's interest rate decisions affect the global market. Downstreamian farmers might lose money on grain exports. Does that give them a vote on Upstreamia's central bank policy? Does every climate policy require a global plebiscite? The All-Affected principle turns every election into a global election. It's administratively impossible, and conceptually it destroys the idea of a collective *self*-determination. There has to be a "self" before there can be determination.

  **Elena:** That's the Whelan regress, I know. But "impossible" isn't an argument against justice; it's an argument for institutional creativity. We can threshold "significant effects." Poisoning a river is significant; fluctuating grain prices might not be. But let's turn to your principle. You say coercion is the trigger. Fine. Let's talk about the undocumented migrant living *inside* Upstreamia. They work here, they use the roads, the police can arrest them, the state can deport them. They are deeply coerced by Upstreamian law. Do they get a vote?

  **Marcus:** Most coercion theorists would say yes, actually. If you are subject to the law's enforcement, you should have a say in its authorship.

  **Elena:** Exactly. So your boundary is porous. But if you include the undocumented migrant because they are coerced by the state's monopoly on violence, how do you exclude the Downstreamian farmer? The state's monopoly on violence is exactly what enforces the border that keeps the farmer out. Abizadeh's whole point was that border coercion is still coercion. If the state uses force to prevent the farmer from entering to protest the dam, or to prevent them from accessing the water, that is an act of coercion. If you demand justification for coercing the migrant inside, you must demand it for coercing the farmer outside. Your "narrow" boundary explodes just as wide as mine.

  **Marcus:** I think you're conflating two types of coercion. There is *border coercion*—keeping people out—and there is *legislative coercion*—telling people what they can and cannot do within a jurisdiction. Abizadeh is right that borders need justification to outsiders. But justification doesn't necessarily mean *enfranchisement*. It might mean treaty obligations, human rights tribunals, or international law. It doesn't mean the Downstreamian farmer gets to vote for the Upstreamian Prime Minister. The Coercion principle binds the *members* of the legal order. The Affected principle binds the *world*.

  **Elena:** But why is the legal order the magic circle? Why is being subject to a law morally weightier than having your life ruined by a policy? If the dam kills the farmer's children, does it matter whether the state did it via a direct order or via a "side effect"? To the dead children, the distinction is invisible. You're prioritizing the autonomy of the Upstreamian voters over the survival of the Downstreamian farmers. You're saying, "We have the right to decide together, even if our decision destroys you."

  **Marcus:** And you're saying, "Anyone who suffers a consequence gets to decide the outcome." But here's the trap we walked into in seminar, Elena. Look at us. We are sitting in Upstreamia. We are debating which principle should decide the boundary of the demos. But *who* gets to decide which principle we use?

  **Elena:** *[Pauses]* The Upstreamian legislature, presumably. Or the courts.

  **Marcus:** Exactly. So, if the Upstreamian legislature adopts the Coercion Principle, they exclude the farmers. If they adopt the Affected Principle, they include them. But the decision to adopt the principle is itself a democratic decision made by a bounded group that *already excludes the farmers*.

  **Elena:** Right. Whelan's regress. To define the demos democratically, you need a prior demos. So whichever principle we pick, it's being imposed by a group that has no democratic right to impose it on the outsiders.

  **Marcus:** So my worry isn't just administrative. It's that your principle requires a global authority to adjudicate "effects" that doesn't exist. Without that, the All-Affected Principle is just a moral wish. The Coercion Principle, at least, tracks existing institutions. It says: "Where there is a state apparatus enforcing rules, there must be democracy." It's a parasite on existing power, not a blueprint for world government.

  **Elena:** But it's a parasite that legitimizes exclusion. If we stick to Coercion, we accept that the Upstreamians can form a club, lock the door, and dump toxic waste on the neighbors, as long as they don't force the neighbors to *carry* the waste. It makes democracy a tool for insider solidarity rather than a check on power.

  **Marcus:** And if we stick to Affected, democracy becomes a tool for vetoing any action with externalities. Which is most actions. Upstreamia can't build a school because the construction noise affects the neighbors? No, Elena. There has to be a threshold of *political* relationship, not just *causal* relationship.

  **Elena:** Okay, let's narrow the disagreement then. We both admit the regress problem: neither of us can democratically justify the boundary without presupposing a boundary. We're both relying on a pre-political moral claim.

  **Marcus:** Agreed. The regress is real. We're arguing about which moral claim is more fundamental.

  **Elena:** Precisely. Your fundamental claim is that *coercion requires justification to the coerced*. My fundamental claim is that *power over interests requires justification to the interested*.

  **Marcus:** But I would refine that. My claim is that *autonomy* is violated only when you are subject to a will that is not your own *within a legal framework*. The farmers are subject to nature and geography, mediated by Upstreamia. They aren't subject to Upstreamia's *will* directly.

  **Elena:** And I would say that in a globalized world, the distinction between "legal framework" and "causal power" is a fiction. The dam is an exercise of power. If we can't solve the regress, we have to pick the principle that minimizes the worst injustice. Excluding the migrant is bad. Excluding the poisoned farmer is worse.

  **Marcus:** And I'd say picking the principle that maximizes inclusion risks making democracy functionally impossible, which helps no one. We need a bounded space to actually *deliberate*.

  **Elena:** So we're stuck. You think my principle dissolves the possibility of collective action. I think your principle sanctifies the violence of the border.

  **Marcus:** We're stuck on the meta-level. We agree the regress is unsolvable. We agree the dam case is a tragedy. We disagree on whether democracy is primarily about protecting *agency from coercion* or protecting *welfare from power*.

  **Elena:** And until we solve that, the farmers don't get a vote.

  **Marcus:** And until we solve that, the legislature claims it's acting democratically.

  **Elena:** *[Sighs]* Same time next week?

  **Marcus:** Same time. But bring a better example than a dam. Maybe something where the coercion is harder to deny.

  **Elena:** I'll try. But I'm not promising I won't bring up climate change again.

  **Marcus:** I knew it.
