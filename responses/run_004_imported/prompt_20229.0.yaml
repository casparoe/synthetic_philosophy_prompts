answer: |-
  Here are nine interview questions designed to probe the mechanics of your guest's resolute-choice position, including the four specific topics you requested. Each includes a follow-up tailored to the response a defender of this view is most likely to offer.

  **1. The Bratman Objection (Mandatory)**
  Michael Bratman's "Simple View" argues that intending to $X$ entails believing you will $X$. In the Toxin case, if you've reasoned correctly, you know that at 2:00 PM you'll have no causal reason to drink. If you know you won't drink, the Simple View says you literally *cannot* intend to drink at midnight, so the billion is out of reach. You've suggested this worry is overstated. Do you reject the Simple View entirely, or do you argue that the resolute agent actually *does* believe they will drink?
  *   **Follow-up:** If she says she rejects the Simple View: "If we decouple intention from belief, what prevents intention from collapsing into mere wishful thinking? How does your agent maintain planning stability without that belief constraint anchoring their future actions?"

  **2. McClennen and Dynamic Choice (Mandatory)**
  Edward McClennen developed resolute choice to handle dynamic inconsistency in cases like Ulysses and the Sirens, where an agent's *preferences* change over time. The Toxin Puzzle is different: your preferences don't change (you always prefer health), but the *payoff structure* depends on a predictor. Is extending McClennen's framework here a natural unification of dynamic choice problems, or are you substituting one puzzle for another by treating a predictor problem as a preference problem?
  *   **Follow-up:** If she says it's a natural unification: "In Ulysses cases, the future self is hostile to the plan; in Toxin, the future self is merely indifferent. Does resolute choice require the agent to treat their future self as an adversary to be bound, even when that future self has no motive to deviate?"

  **3. The "Reason" at T1 (Mechanics)**
  Your strongest claim is that the agent has a *genuine reason* to drink the toxin at 2:00 PM, not just a backward-looking justification. Standard causal decision theory says the money is sunk and the sickness is real. What is the ontological status of this "reason" at the moment of drinking? Is it an evidential reason, a logical reason, or are you positing a form of diachronic rationality that overrides synchronic causal dominance?
  *   **Follow-up:** If she posits diachronic rationality: "If diachronic rationality can override causal dominance at T1, does that imply the agent is effectively acting as if they have backward causal influence? How do you explain this without invoking magical thinking about the past?"

  **4. Reliability Thresholds (Mandatory)**
  The puzzle assumes an infallible predictor. If the billionaire's lie detector is merely 90% reliable, the expected utility of intending to drink drops. Does your argument hold continuously as reliability decreases, or is there a threshold where the "reason to drink" vanishes and causal dominance reasserts itself?
  *   **Follow-up:** If she argues it holds continuously: "At some low probability of prediction, drinking is strictly dominated (you get sick for no gain). If the 'reason' doesn't vanish until probability hits zero, aren't you asking the agent to ignore massive expected disutility based on a vanishingly small correlation?"

  **5. Blackmail vs. Reward (Mandatory)**
  In Newcomb and Toxin, being the sort of agent who follows through earns a reward. But in logical blackmail scenarios (like the "XOR Blackmail" in FDT literature), being predictably resolute can make you a target for exploitation. How do you formally distinguish between cases where resolute choice pays off and cases where it invites extortion?
  *   **Follow-up:** If she says it depends on the dependency structure: "Can that distinction be made from inside the agent's epistemic position, or do they need a 'God's eye view' of the scenario to know whether their resoluteness is being rewarded or weaponized against them?"

  **6. Resolute Choice vs. Precommitment**
  A causal decision theorist might say, "Just bind yourself physically at midnight so you *must* drink." Your view seems to be that a rational agent doesn't need the ropes; they can do it by sheer force of rational policy. Is resolute choice distinct from precommitment technology, or is it just an internalized simulation of having burned your bridges?
  *   **Follow-up:** If she says it's distinct: "If there's no physical mechanism binding the hand, what physically happens in the brain at 2:00 PM that differs from the agent who decides not to drink? If the physical state is identical, are we just relabeling 'willpower' as 'rationality'?"

  **7. Alignment with FDT/UDT**
  You've mentioned Functional Decision Theory as a supporting framework. FDT relies on logical counterfactuals: my output determines the predictor's output. Resolute choice is often framed as sticking to a plan despite changed incentives. Are these the same mechanism described differently, or does FDT solve Toxin in a way that makes resolute choice redundant?
  *   **Follow-up:** If she says they are the same mechanism: "FDT agents one-box because their algorithm outputs 'one-box.' But in Toxin, the payout is already fixed by midnight. Does FDT actually recommend drinking, or does it just recommend *having the algorithm* that intends to drink, leaving the actual drinking underdetermined?"

  **8. The Phenomenology of Regret**
  Suppose I am your resolute agent. It is 2:00 PM, I have the million in the bank, and I am about to drink the toxin. I know the money isn't going away if I pour it down the sink. Do you expect this agent to feel regret while drinking? If not, how do they reconcile the immediate, certain pain with the knowledge that it is instrumentally useless in that moment?
  *   **Follow-up:** If she says they feel no regret: "Is this a cognitive illusion the agent must cultivate? If rationality requires us to suppress the intuitive judgment that 'sunk costs are sunk,' are we optimizing for payoff at the cost of accurate reality-testing?"

  **9. Normative Implications for AI**
  If we are building AI systems, should we hard-code them to be resolute choosers? If an AI knows it will face Toxin-like problems, should it disable its ability to update on new information to preserve its bargaining power?
  *   **Follow-up:** If she says yes: "Doesn't that create a fragility problem? An agent that cannot update on new information to avoid local harms might be easily lured into traps that a more flexible, causal agent would simply walk away from. How do we balance resoluteness with adaptability?"
