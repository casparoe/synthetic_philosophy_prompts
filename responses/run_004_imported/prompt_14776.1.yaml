      *   *SIA Counter:* Sam brings in the "likelihood of existence."
      *   *PP Attack:* Sarah deploys Bostrom's PP.
      *   *PP Defense:* Sam argues about Priors and Complexity. He claims SIA corrects the *sampling*, not the *physics*, but the physics priors matter.
