  *(Self-Correction on "Supervenience"):* Wait, logical supervenience is stronger than natural supervenience. Chalmers' zombie argument relies on the gap between physical and logical supervenience. Grounding is supposed to bridge that. I should mention that grounding is meant to be *explanatory* where supervenience is merely *modal*.

  *(Self-Correction on "Monism"):* Make sure to explain *why* Schaffer thinks this (quantum entanglement, etc.), but keep it brief so the user doesn't get bogged down. The key is that the analogy needs to accommodate "top-down" grounding.

