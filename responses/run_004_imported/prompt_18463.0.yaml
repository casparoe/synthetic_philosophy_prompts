      *   *Supervenience:* Make sure to distinguish clearly. Supervenience is a modal footprint; Grounding is the metaphysical glue.
      *   *Monism:* This is Schaffer's specific brand. Fine might disagree. Since the user name-dropped Schaffer, this is crucial.

  6.  **Final Polish:**
      *   Structure the response to match the user's numbered questions.
