          *   The citation: It is indeed *Mencius* 7A35 (sometimes 7A:35 or 13.35 depending on numbering system). In the Lau translation, it's 7A:35. In Van Norden, it's 13.35. Best to advise checking the specific numbering system the audience uses (usually Lau or Van Norden).
          *   "No self": Ames/Rosemont are careful to say "no *autonomous, atomic* self," not necessarily "no self." The draft says "no self... prior to or independent of one's roles," which is accurate enough, but "no self" alone is a trigger for pushback.
