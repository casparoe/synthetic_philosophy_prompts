      *   *Correction on Mencius:* Make sure to mention that Shun's action is often interpreted as "filial piety overrides public justice," but the *abdication* is the key nuance the user caught. That's the strongest part of the draft.
      *   *Audience:* Remind the user to define *quan* clearly. Non-Chinese philosophy folks won't know it.
      *   *The "Locus of Judgment":* This is the philosophical meat. Encourage them to lean into this. It connects to Western debates about agency and unity of the self.

  8.  **Final Polish:** Check against the user's specific questions one last time.
      *   1. Fairness? Yes, addressed.
