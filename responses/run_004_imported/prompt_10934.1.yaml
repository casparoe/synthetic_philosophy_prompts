      *   Let $x = 2^n$.
      *   Case 1: $x$ is the smaller amount ($M=x$). This happens if $M=2^n$ and Coin=Heads (say Heads = keep $M$). Prob $\propto P(M=2^n) \times 0.5$.
      *   Case 2: $x$ is the larger amount ($2M=x \implies M=x/2$). This happens if $M=2^{n-1}$ and Coin=Tails. Prob $\propto P(M=2^{n-1}) \times 0.5$.
      *   Note: If $n=0$ ($x=1$), Case 2 is impossible (since $M \ge 1$). So if $x=1$, you definitely have the smaller amount. Switching yields $2$. $E[\text{Other}] = 2 > 1$.
