answer: |-
  # The Physics of Wealth vs. The Psychology of Value: A Verdict on Kelly

  The debate over the Kelly Criterion is not merely a technical squabble over position sizing. It is a proxy war for the soul of decision theory. On one side stands the neoclassical orthodoxy, championed by Paul Samuelson, which holds that rationality is defined by maximizing expected utility (EU), where "utility" is a subjective preference function. On the other side stands the growth-optimal camp, from Ed Thorp's trading desk to Ole Peters' physics lab, which argues that maximizing the geometric growth rate is not a preference but a physical necessity for survival in a multiplicative world.

  Samuelson mocked the Kelly proponents with a famous paper written entirely in one-syllable words, aiming to strip the "mystique" from the math. He argued that maximizing expected log wealth is simply what you do if you happen to have log utility, and nothing more. Peters, decades later, argues that Samuelson missed the point: the issue isn't utility, it's ergodicity. Standard economics averages over parallel universes; humans live in one timeline.

  To find the truth, we must weigh Samuelson's defense of subjective human needs against Peters' revelation of objective dynamic constraints. The verdict is not that one side is right and the other wrong, but that they are answering different questions. Kelly is the rational strategy for *capital*; Expected Utility is the rational strategy for the *human*.

  ### The Samuelson Objection: The Tyranny of the Long Run

  Samuelson's critique rests on two pillars: the subjectivity of value and the irrelevance of asymptopia.

  First, the subjectivity argument. In the von Neumann-Morgenstern framework, rationality is consistency, not a specific outcome. If you prefer a guaranteed \$1 million over a 50% chance at \$3 million, you reveal a concave utility function. If you choose the gamble, you reveal a convex one. To say everyone *should* maximize geometric growth is to say everyone *should* have log utility. Samuelson found this prescriptive arrogance absurd. Why should a retiree who needs \$50,000 to eat care about the compound growth rate of a portfolio they intend to draw down? For them, volatility isn't just a drag on growth; it's a risk of destitution.

  Second, and more devastatingly, Samuelson attacked the "long-run" justification. Kelly proponents often argue that as the number of bets $N \to \infty$, the Kelly strategy will almost surely outperform any other strategy. Samuelson pointed out that this is a mathematical truism with no practical bite. In the limit, we are all dead. For any finite $N$, no matter how large, there is always a non-zero probability that a fractional Kelly strategy (or even a leveraged one) will outperform full Kelly. More importantly, the *expected utility* of the Kelly path might be lower than a safer path if the agent's utility function penalizes drawdowns heavily.

  Samuelson's strongest point is that "maximizing wealth" is not the same as "maximizing well-being." If the path to maximum terminal wealth requires enduring a 90% drawdown that causes the investor to panic-sell or suffer a heart attack, the strategy is irrational for that human, even if it is optimal for the account. By reducing the problem to pure math, Kelly advocates commit the naturalistic fallacy: deriving an "ought" (you should bet this size) from an "is" (this size grows fastest).

  ### The Thorp-Peters Defense: Ergodicity and the Physics of Ruin

  Ed Thorp's defense was pragmatic: in blackjack and markets, you cannot bet if you are broke. Survival is a prerequisite for winning. But Ole Peters provided the theoretical heavy artillery that Samuelson could not anticipate: ergodicity economics.

  Standard expected value theory assumes ergodicity—that the time average of a single system equals the ensemble average of many systems. If 100 people flip a coin once, the average outcome equals one person flipping a coin 100 times. This is true for *additive* dynamics (win \$10 or lose \$10). It is catastrophically false for *multiplicative* dynamics (win 10% or lose 10%).

  In a multiplicative process, the ensemble average (what standard EV calculates) is dominated by rare, extreme outcomes in parallel universes where you get incredibly lucky. The time average (what you actually experience) is dragged down by volatility drag. If you lose 50%, you need a 100% gain to break even. The arithmetic mean lies; the geometric mean tells the truth.

  Peters argues that when a system is non-ergodic, expected value is physically meaningless for the individual. It averages over worlds you will never visit. Therefore, maximizing the time-average growth rate (which yields the Kelly criterion) is not a subjective preference for log utility; it is the only way to align your decision-making with the physical reality of time. You don't choose log utility because you like it; you choose it because it is the mathematical map of the territory you actually inhabit.

  This reframing demolishes Samuelson's claim that Kelly is just "one utility function among many." In a non-ergodic world, maximizing EV is objectively wrong, not just subjectively risky. It is like calculating the average depth of a river and drowning because you ignored the variance. The Kelly criterion stops being a "strategy" and starts being a "speed limit."

  ### The Verdict: Conditions for Rationality

  So, who wins? Samuelson or Peters?

  The honest answer is conditional. The Kelly Criterion is uniquely rational *only* under specific structural conditions. Outside those conditions, it collapses into Samuelson's view: one utility function among many.

  **The Kelly Criterion is objectively superior if and only if:**
  1.  **The dynamics are multiplicative:** Wealth is reinvested. Gains compound; losses shrink the base.
  2.  **The horizon is indefinite:** The agent intends to remain in the game forever (or for a time $T$ sufficiently large that asymptotic properties dominate).
  3.  **There are no interim consumption constraints:** The capital is not needed for survival or consumption before the terminal date.

  If these three conditions hold, Peters is right. Ergodicity is broken, ensemble averages are fiction, and maximizing geometric growth is the only way to avoid certain ruin in the long run. In this specific domain—endowment funds, perpetual hedge funds, professional gambling bankrolls—Samuelson's objection is a category error. He is applying consumption-based utility theory to an accumulation engine.

  **However, Samuelson wins when:**
  1.  **The dynamics are additive:** You bet a fixed amount, not a percentage of wealth.
  2.  **The horizon is finite and short:** You are betting on a single event or a small sequence.
  3.  **Consumption matters:** You are a human being who needs to spend the money.

  Here lies the crux. Most humans are not perpetual capital accumulation machines. We have liabilities, consumption needs, and finite lifespans. For a retiree, a 50% drawdown is not a "buying opportunity"; it is a reduction in their standard of living that may never be recovered before death. For them, the "time average" of their wealth is less important than the "utility" of their consumption stream.

  Furthermore, Peters' ergodicity argument assumes the agent cares *only* about the terminal wealth number. But humans care about the *path*. If two strategies yield the same terminal wealth, but one requires living in poverty for ten years while the other allows for smooth consumption, a rational human chooses the latter. Kelly maximizes the end point; it does not optimize the journey.

  ### The Synthesis: Capital vs. Capitalist

  The resolution is to stop treating Kelly and Utility as rivals for the same throne. They govern different domains.

  **Kelly is the physics of the capital.** If you have a positive edge in a repeatable, multiplicative game, the Kelly fraction describes the maximum growth rate physically available to that system. Ignoring it is like ignoring friction; you can do it, but you will underperform the physical limits of the environment. In this sense, Peters is right: it is objective.

  **Utility is the psychology of the capitalist.** How much of that available growth you *capture* depends on your relationship to the money. If you need the money for food, you must bet fractional Kelly (or zero). If you are managing other people's money and they will fire you after a 20% drawdown, you must bet fractional Kelly. This is not a rejection of the math; it is an overlay of constraints.

  Therefore, the verdict is this: **Maximizing geometric growth is the rational default for any pool of capital intended for reinvestment, but it is not a moral imperative for the owner of that capital.**

  Samuelson was right that you cannot force a human to love log utility. But Peters was right that if a human *wants* to grow wealth over time in a multiplicative world, they have no other mathematical choice. To deviate from Kelly is to voluntarily accept a lower growth rate. The only rational reason to do so is if you value something else more than growth (e.g., stability, consumption, sleep).

  The "fight" persists because economists study humans (who consume) while quants study prices (which compound). The Kelly Criterion is not a universal theory of rationality. It is a universal theory of *compounding*. If your goal is to compound, Kelly is the law. If your goal is to live, Kelly is just a tool—one you must wield with the discretion Samuelson demanded.

  To bet full Kelly without considering your finite lifespan is to worship the map over the territory. To reject Kelly entirely because "utility is subjective" is to ignore the physics of the terrain. The rational investor acknowledges the physics (Peters) but navigates for the human (Samuelson). They bet enough to grow, but not enough to die. That is not a compromise; it is the only way to survive the long run without missing the short one.
