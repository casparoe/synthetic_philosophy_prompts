prompt: |-
  I'm the student representative on my high school's Honor Council. The administration wants to start citing a commercial AI-writing detector -- sold to teachers as fully transparent -- in honor-code hearings: for each flagged essay, the same system that produces a percentage score also generates a paragraph explaining which stylistic cues supposedly gave it away. We have no independent way to confirm whether an essay was actually AI-written, and some students have noticed that lightly hand-editing a draft lowers the score. Several council members treat the explanations as solid evidence on their own; others are uneasy but can't say why. Draft the short memo I'll bring to our next meeting recommending we adopt, reject, or conditionally adopt the tool as evidence, with reasons the first group would have to engage with, and a fair statement of what's right about their view.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the High School Honor Council.
      *   **Audience:** Honor Council members (students) and potentially Administration (though primarily for the Council meeting).
      *   **Issue:** Administration wants to use a commercial AI-writing detector (with percentage scores + explanatory paragraphs) as evidence in honor-code hearings.
      *   **Concerns:** No independent verification, false negatives via light editing, some members trust the explanations blindly, others are uneasy but lack arguments.
      *   **Task:** Draft a short memo recommending a stance (Adopt, Reject, or Conditionally Adopt) with reasons that engage the "pro-tool" group fairly while addressing the risks.
      *   **Tone:** Professional, persuasive, balanced, evidence-based, respectful of the Council's gravity.

  2.  **Determine the Recommendation:**
      *   *Adopt:* Too risky. High false positive/negative rates in AI detection are well-documented. Relying on it violates due process.
      *   *Reject:* Ideal from a student rights perspective, but might be a non-starter with administration. Might alienate council members who want *some* tool to help.
      *   *Conditionally Adopt:* The most pragmatic and defensible position. It acknowledges the tool exists but sets strict guardrails. It treats the output as *investigative lead* rather than *evidence of guilt*.
      *   *Decision:* **Conditionally Adopt (with heavy restrictions).** Specifically, the "explanation" paragraph cannot be treated as proof, and the score cannot be the sole basis for a charge.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the administration's proposal.
      *   **The "Pro-Tool" View (Fair Statement):** Why do some members like it? It offers objective-looking data. It gives specific reasons (the "explanation"), which feels like due process. It helps level the playing field against cheaters. *Need to validate this feeling without validating the accuracy.*
      *   **The Risks/Counter-Arguments (Reasons to Engage):**
          *   *The "Black Box" Problem:* Even with explanations, we don't know the training data.
          *   *Stylistic Bias:* AI detectors often flag non-native English speakers or concise writers.
          *   *The "Light Edit" Loophole:* If a human can bypass it easily, it's not a reliable truth machine.
          *   *The "Explanation" Illusion:* The text explanation is post-hoc rationalization, not forensic proof.
      *   **Recommendation:** Conditionally Adopt.
      *   **Conditions/Guardrails:**
          1.  Not sole evidence.
          2.  Explanations are hypotheses, not findings.
          3.  Right to rebuttal (students can show draft history).
          4.  Regular review of false positives.
      *   **Closing:** Call to action/unity.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Conditionally Adopt" too weak?
      *   *Correction:* In a school setting, outright rejection might get overruled by admin. A strong conditional stance empowers the Council to control *how* it's used. It shifts the burden of proof back to where it belongs.
      *   *Tone Check:* Ensure I don't sound like I'm accusing the pro-tool members of being lazy. Frame it as "wanting certainty in an uncertain situation."
      *   *Key Insight:* The prompt mentions the tool claims to be "fully transparent." I need to address that specific claim. Transparency $\neq$ Accuracy.

  5.  **Final Polish:**
      *   Keep it concise (it's a memo for a meeting).
      *   Use bullet points for readability.
      *   Ensure the distinction between "investigative lead" and "evidence of guilt" is clear.

  6.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Recommend stance? Yes (Conditional).
      *   Reasons for first group to engage? Yes (addressing the "explanation" fallacy).
      *   Fair statement of their view? Yes.

  *(Self-Correction Note: Make sure to emphasize that the "explanation paragraph" is technically known as 'post-hoc rationalization' in AI ethics, but explain it simply.)*

  7.  **Final Output Generation** (Proceed to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding AI-Detection Tools in Hearings

  **Purpose**
  This memo outlines a recommendation regarding the Administration's proposal to use commercial AI-detection reports (scores + stylistic explanations) as evidence in honor-code hearings.

  **Understanding the Support for the Tool**
  Several Council members support adopting this tool, and their reasoning is sound in principle. We all want a fair process where violations are caught consistently, not arbitrarily. The appeal of this specific system is its claim to transparency; unlike a simple percentage score, the generated paragraph offers specific stylistic cues (e.g., "low perplexity," "uniform sentence structure"). This feels like due process because it gives the accused a specific claim to answer, rather than a vague accusation. It promises to objectiveize a subjective judgment.

  **Critical Risks & Counter-Arguments**
  However, treating these reports as substantive evidence carries significant risks that we must address:

  1.  **The "Explanation" Illusion:** Current research suggests that the explanatory text generated by these tools is often *post-hoc rationalization*. The AI makes a prediction based on patterns, then writes a paragraph to justify it. It looks like forensic analysis, but it is not independently verifiable.
  2.  **False Positives & Bias:** These tools frequently flag writing by non-native English speakers or students who write concisely. If we treat the report as proof, we risk punishing students for their writing style.
  3.  **Fragility:** As noted by students, light human editing can bypass the detector. If a tool can be fooled easily, a low score doesn't prove innocence, but a high score doesn't necessarily prove guilt—it may only prove the student didn't edit the draft enough to confuse the algorithm.

  **Recommendation: Conditional Adoption**
  I recommend we **conditionally adopt** the tool, strictly as an *investigative lead*, never as *evidence of guilt*.

  **Proposed Guardrails**
  To protect the integrity of the Council and the rights of the accused, we should require the following conditions before accepting these reports:

  *   **Corroboration Required:** A flagged report cannot be the sole basis for a charge. It must be paired with other evidence (e.g., draft history, oral defense of the work, witness testimony).
  *   **Reframing the Explanation:** The stylistic explanation must be presented as a *hypothesis* for discussion, not a *finding* of fact.
  *   **Right to Rebuttal:** Accused students must be allowed to present process evidence (Google Doc version history, notes, outlines) to override the detector's score.
  *   **Sunset Clause:** We review the policy every semester. If false positives are identified, the tool is suspended.

  **Conclusion**
  We can acknowledge the Administration's need to address AI misuse without compromising our standard of proof. By treating this tool as a starting point for inquiry rather than a verdict, we maintain our commitment to fairness while engaging with the new reality of AI writing.

  I look forward to discussing this framework at our next meeting.
