      *   *Differences:* Formal parties have manifests and membership. Online tribes are fluid, leaderless, and algorithmic. The "party" is now decentralized.
      *   *Weil's Diagnosis:* She would likely see social media as the *purest* form of the party mechanism, stripped of the pretense of policy. It's pure pressure on the mind.

  4.  **Evaluate the "Fix" (Abolish Parties):**
