  Quick one -- I'm prepping a seminar on Simone Weil and can't stop thinking about her essay calling for the total abolition of political parties. Her actual argument isnt just "factions are bad": a party, for her, is a machine for manufacturing collective passion that then requires members to hold the party-approved opinion even on stuff totally unrelated to what the party's about, and the whole enterprise runs on unlimited self-perpetuation instead of any real interest in truth or justice, which she thinks have natural stopping points once you've actually found them. Given that specific mechanism, not just a "she'd have hated Twitter" vibe, what do you think she'd say about how political tribalism runs on social media now, and does her proposed fix -- just get rid of the parties -- even make sense anymore when the same psychological machinery runs on algorithms and doesn't need a formal party at all?
reasoning: |-
