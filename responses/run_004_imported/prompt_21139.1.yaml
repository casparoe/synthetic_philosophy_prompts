          *   *Truman Comparison:* It's not exactly the same (Truman knew they were civilians; Signature strikes hope they aren't). But if the evidence is weak, it becomes "killing the innocent as a means."
          *   *Nuance:* Anscombe cares about the *description under which the action is chosen.* If the description is "kill militant group," but the reality is "kill men walking near a compound," there is a disconnect. She would likely demand a much higher standard of proof regarding their status as "engaged in harm."

