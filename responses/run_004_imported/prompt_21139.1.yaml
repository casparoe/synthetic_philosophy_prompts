      *   *Correction on R9X:* Is there a "technological sleight of hand"? Anscombe was skeptical of consequentialist justifications ("we saved more lives"). She would look at the *act itself*. The act is killing a combatant. The side effect is minimized. This seems to fit her framework well. However, she might question the *secrecy* or the *extrajudicial* nature if it bypasses sovereign authority, but that's more about *jus ad bellum*. Sticking to *jus in bello* (conduct): It looks morally superior to a 2,000 lb bomb.
      *   *Where does the framework run out?* Anscombe's framework relies on clear categories: Combatant vs. Innocent. Modern asymmetric warfare blurs this. Signature strikes rely on *probabilistic* combatancy. Anscombe deals in *moral certainty*. She might say the framework demands we *cannot* strike if we lack certainty, rendering signature strikes impermissible not because they are "Truman-esque" but because they violate the epistemic requirement for targeting.
