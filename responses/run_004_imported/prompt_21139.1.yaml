      *   **"War and Murder":**
          *   Central Claim: Clarifies the Doctrine of Double Effect (DDE).
          *   Key Distinction: Intended effects vs. Foreseen but unintended side effects.
          *   Criterion for Murder in War: Directly intending the death of the innocent is always forbidden.
          *   Criterion for Legitimate War: Targeting combatants/those engaged in harm. Collateral damage is permissible *only if* it is not intended (neither as end nor means) and is proportionate.
          *   "Direct Intention": What you choose to do. If your plan *requires* their death to work, you intend it.

