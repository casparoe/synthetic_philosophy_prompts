answer: |-
  You have hit on one of the most genuine philosophical pivot points in modern ethics. You are absolutely right that Taurek's "Should the Numbers Count?" (1977) is far more sophisticated than the "utilitarianism is math, Taurek is emotional" caricature often found in EA circles. Taurek isn't saying death doesn't matter; he's making a metaphysical claim about *who* experiences the loss.

  Parfit's reply in "Innumerate Ethics" (1978) is the canonical counter-move. Let's break down the clash, evaluate Parfit's "individual complaints" strategy, and assess who actually owns the "separateness of persons."

  ### 1. The Core Disagreement

  **Taurek's Position: The No-Sum Thesis**
  Taurek argues that "loss" is a first-person phenomenon.
  *   David loses *his* life.
  *   Each of the five loses *their* life.
  *   There is no "super-observer" (society, the universe, God) who experiences the *sum* of the five losses as a single, heavier burden.
  *   **Fairness:** If you save the five, you have effectively told David, "Your life counts for less than theirs." To treat them equally, you must give David a 50% chance and the group of five a 50% chance (which means each individual in the group gets a 10% chance). A coin flip achieves this equal regard.

  **Parfit's Position: The Individual Claims Thesis**
  Parfit agrees that there is no "group mind" that feels the sum. He grants Taurek the metaphysics but denies the moral conclusion.
  *   We don't need to sum losses to see that the five should be saved.
  *   Instead, we look at **reasons**.
  *   David has one strong reason to be saved (his life).
  *   Person A has one strong reason. Person B has one strong reason... up to E.
  *   Each of these five reasons is *individually* as weighty as David's reason.
  *   **The Move:** Five equally weighty reasons outweigh one equally weighty reason. You don't need to merge the five people into a collective entity to see that the *totality of reasons* on one side is greater.

  ### 2. Is Parfit Just Smuggling Aggregation In?

  This is the sharpest critique of Parfit, and your intuition is correct to question it.

  **The Critique:**
  Taurek would argue that saying "five reasons outweigh one" is functionally identical to saying "five lives outweigh one." If the reasons cannot be aggregated (because the persons are separate), how can they be placed on a scale together to outweigh the single reason? If you say "Reason A + Reason B > Reason C," you are performing addition. Parfit claims he is counting *claims*, not summing *utility*, but mathematically, the operation looks the same.

  **The Defense:**
  Parfit would argue he is shifting from **Consequentialist Aggregation** (summing states of affairs) to **Deontological Weighting** (balancing obligations).
  *   In utilitarianism, the *outcome* (5 lives saved) is the good.
  *   In Parfit's view, the *claims* are the primary moral data.
  *   He isn't saying the *pain* of the five adds up to more *pain*. He is saying the *moral force* of five distinct demands is greater than one.

  **Verdict:**
  Parfit is arguably wearing aggregation in an individualist costume, **but it is a necessary costume.**
  If you strictly follow Taurek, you cannot compare *any* interpersonal claims. If David needs a kidney and the five each need a pint of blood, Taurek's logic makes it hard to prioritize even small burdens over large ones if the numbers differ. Parfit's move allows us to keep the "separateness of persons" (we acknowledge five distinct claimants) while avoiding the absurdity of flipping a coin between 1 person and 1,000,000 people. It works pragmatically, even if the metaphysical "why" remains slightly fuzzy.

  ### 3. Who Takes "Separateness of Persons" More Seriously?

  This is the crux of your second question. The phrase "separateness of persons" (famously coined by Rawls to critique utilitarianism) is the battleground.

  **Taurek's Interpretation: Radical Distinctness**
  Taurek takes separateness to mean **incommensurability**. Because persons are distinct, their losses cannot be compared in a way that allows one to be sacrificed for the other. To Taurek, "separateness" means moral isolationism. The boundary between persons is a moral firewall.
  *   *Consistency:* High. If persons are truly separate, why does the existence of Person B strengthen the claim of Person A against Person C? It doesn't.
  *   *Problem:* It renders collective action almost impossible. It treats the "separateness" as a barrier to moral reasoning itself.

  **Parfit's Interpretation: Distinctness with Equal Weight**
  Parfit takes separateness to mean **non-fungibility**, not incomparability.
  *   Persons are separate, so we cannot sacrifice David *just* to make the "group" happier (no utilitarian sacrifice).
  *   However, persons are separate, so each has an *equal* claim.
  *   Because each has an equal claim, the side with more claimants has more moral "pressure."
  *   *Consistency:* Parfit argues that ignoring the numbers actually *violates* the separateness of the five. If you flip a coin, you are treating the five as a single bloc (giving the bloc 50%) rather than treating the five as individuals (each deserving full consideration). By saving the five, you are respecting the individual claim of each of the five, whereas the coin flip dilutes their individual claims to protect David's.

  **Who Wins?**
  Parfit is generally considered to have the stronger grasp of "separateness" in a way that is compatible with moral agency.
  Taurek's view implies that the *existence* of other people in the group of five is morally irrelevant to David's claim. But Parfit points out that David's claim is "Save me," and Person A's claim is "Save me." These are not conflicting claims in a zero-sum sense until resources force a choice. When forced, acknowledging that there are five "Save me" requests versus one "Save me" request respects the reality of the situation without merging the requesters.

  ### 4. Why Parfit's Move Matters for EA/LW Discourse

  The reason EA defaults to "shut up and multiply" is that it is computationally efficient. But Taurek exposes the metaphysical hole in that heuristic: *Who is the multiplier for?*

  Parfit plugs that hole without requiring you to become a total utilitarian. He allows you to say:
  1.  I am not maximizing "Goodness" in the universe (avoiding the repugnant conclusion risks).
  2.  I am responding to the weight of individual claims.
  3.  More claims = stronger moral requirement.

  **The Weakness:**
  Parfit's argument works best in "save the life" scenarios. It gets messier with trade-offs (e.g., saving 5 from death vs. saving 1 from permanent paralysis). Taurek would say you can't compare death to paralysis across persons. Parfit has to argue that the *strength* of the claim varies, which invites the aggregation problem back in (how do we weigh the intensity of claims across separate persons?).

  ### Summary

  *   **Taurek** is logically consistent but morally paralyzing. He takes separateness to mean we cannot aggregate claims at all.
  *   **Parfit** saves the intuition that numbers count by arguing that **counting claims is not the same as summing utility.**
  *   **Is it aggregation in disguise?** Yes, but it is "claim aggregation" rather than "welfare aggregation." This is a crucial distinction that allows us to respect persons as individuals while acknowledging that five individuals create a stronger moral demand than one.
  *   **Separateness:** Parfit is more consistent with a workable theory of separateness. Taurek treats persons as so separate they cannot even be counted in a decision procedure. Parfit treats them as separate but morally audible; if five people shout "Help," the noise is objectively louder than one person shouting, even if they aren't singing in chorus.

  You were right to read the original paper. Taurek forces you to realize that "maximizing the good" requires a metaphysical leap (that the good can exist independently of the experiencer). Parfit shows you how to step back from that ledge without falling into the abyss of flipping a coin between 1 and 1,000,000.
