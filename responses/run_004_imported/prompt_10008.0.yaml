prompt: |-
  I have been a longtime reader of Robin Hanson's Overcoming Bias, where futarchy keeps resurfacing whenever the topic of institutional design comes up. The proposal, in short, is to "vote on values, but bet on beliefs": have the polity vote on some measurable welfare metric, then let conditional prediction markets pick whichever policy is forecast to maximize it. In a recent thread on a forum I frequent, someone pointed out that the whole scheme is, in spirit, a market-based descendant of Condorcet's eighteenth-century "social mathematics," in particular his 1785 jury theorem, which shows that a large enough group of voters, each only slightly more likely than not to pick the correct answer, will converge on it with near certainty under majority rule. Condorcet originally devised the theorem to argue that criminal trial juries and legislative assemblies could be trusted to discover the objectively correct verdict or law, and he treated the result as formal support for his broader ambition of putting political decision-making on the same rigorous probabilistic footing as the natural sciences.

  I would like you to reconstruct, in some detail, what Condorcet's verdict on futarchy would plausibly have been, reasoning from positions he actually held rather than from generic Enlightenment sympathies. In particular, I would like you to work through: whether the independence and competence assumptions that do the real work in his jury theorem have any plausible analogue in a market populated by self-selected, potentially herding traders, as opposed to a cross-section of ordinary citizens or jurors; whether he would have accepted Hanson's division of labor between voting on values and betting on beliefs as a legitimate way of separating moral from empirical questions, given that Condorcet himself wanted to treat certain moral and legal questions as having a "true" answer discoverable by aggregation in the first place; and whether the wealth-weighted influence that speculative markets grant to those with capital and an appetite for risk sits comfortably with his unusually strong (for his time) commitment to political equality, including his advocacy for extending the franchise to women. I am less interested in a quick up-or-down verdict than in seeing how these specific tensions within his own body of work would have pulled him toward, or away from, endorsing markets, rather than votes or the slow spread of enlightenment through education, as the master mechanism for extracting truth from a crowd.
reasoning: |-
  Here's a thinking process that leads to the essay on Condorcet's verdict on Futarchy:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Reconstruct Marquis de Condorcet's plausible verdict on Robin Hanson's "Futarchy" (vote on values, bet on beliefs).
      *   **Context:** The user is a reader of *Overcoming Bias* and knows the basics of Futarchy. They note a connection between Futarchy and Condorcet's Jury Theorem (1785).
      *   **Key Requirements:**
          *   Reason from Condorcet's *actual* positions, not generic Enlightenment tropes.
          *   Address three specific tensions:
              1.  **Independence/Competence:** Do market traders satisfy the Jury Theorem's assumptions (independence, $p > 0.5$) better or worse than jurors/citizens?
              2.  **Values vs. Beliefs:** Would Condorcet accept the separation of moral questions (voted) and empirical questions (bet on), given he believed moral/legal truths are discoverable via aggregation?
              3.  **Equality/Wealth:** How does wealth-weighted voting (markets) square with Condorcet's commitment to political equality (including women's suffrage)?
          *   **Goal:** A nuanced exploration of tensions, not just a binary "yes/no."

  2.  **Analyze Condorcet's Core Philosophy:**
      *   *Social Mathematics:* He believed social phenomena could be quantified and optimized using probability theory.
      *   *The Jury Theorem:* Requires independent voters, each with competence $p > 0.5$. As $N \to \infty$, probability of correct majority decision $\to 1$.
      *   *Epistemology:* Truth exists (objective correctness). It is discoverable through reason and aggregation.
      *   *Political Equality:* Strong advocate for universal suffrage (including women and non-property owners). He distrusted elite domination.
      *   *Progress:* Believed in indefinite human perfectibility through education and rational institutions.
      *   *Role of Experts:* He valued expertise but within a democratic framework (e.g., his constitutional proposals involved primary assemblies and representative bodies, but grounded in popular will).

  3.  **Analyze Futarchy (Hanson's Proposal):**
      *   *Mechanism:* Democracy defines the utility function (vote); Prediction Markets choose the policy (bet).
      *   *Epistemology:* Markets aggregate information efficiently (Efficient Market Hypothesis applied to policy).
      *   *Incentives:* Profit motive aligns truth-telling.
      *   *Influence:* Proportional to capital and risk tolerance.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Acknowledge the intellectual lineage (Social Mathematics $\to$ Futarchy).
          *   State the thesis: Condorcet would be fascinated by the *mathematical ambition* but deeply troubled by the *sociological assumptions* and *egalitarian implications*. He would likely reject the market mechanism as a substitute for democratic deliberation, viewing it as a regression to aristocracy of wealth.

      *   **Point 1: The Jury Theorem vs. Market Efficiency (Independence & Competence):**
          *   *Condorcet's View:* Independence is crucial. Voters must not be swayed by eloquence or faction. Competence ($p > 0.5$) is ensured by common reason and basic education.
          *   *Futarchy/Markets:* Traders are *not* independent. They observe prices (herding). They are self-selected (not a cross-section).
          *   *Condorcet's Critique:* He would worry about correlation of error. If traders all rely on the same models or are influenced by a charismatic speculator, independence fails. However, he might appreciate the *incentive* for accuracy (unlike voters). But he'd argue that "competence" in markets is tied to capital, not reason.
          *   *Verdict:* Markets might be *more* competent on average but *less* independent. The theorem breaks down without independence.

      *   **Point 2: Values vs. Beliefs (The Ontological Split):**
          *   *Condorcet's View:* Moral truths are like mathematical truths. They are discoverable. The "general will" isn't just preference aggregation; it's truth tracking.
          *   *Futarchy:* Separates "what we want" (subjective) from "how to get it" (objective).
          *   *Condorcet's Critique:* He would reject the idea that values are merely subjective preferences to be tallied. For Condorcet, justice and rights are objective. Voting isn't just summing desires; it's approximating natural law.
          *   *Nuance:* He might agree that *means* are empirical. But he would insist that the *ends* are also subject to rational scrutiny, not just raw voting. A vote on a welfare metric could be "wrong" (immoral) even if unanimous.
          *   *Verdict:* He would find the dichotomy artificial. Moral questions require reason/deliberation, not just voting, and certainly not just betting.

      *   **Point 3: Political Equality and Wealth (The Aristocracy of Capital):**
          *   *Condorcet's View:* Radical egalitarian. Women's suffrage, no property requirements. Wealth corrupts judgment.
          *   *Futarchy:* One dollar, one vote. Wealthy/risk-tolerant have more say.
          *   *Condorcet's Critique:* This is the dealbreaker. It reintroduces the aristocracy he fought to destroy. It privileges the rich and the reckless over the poor and the prudent. It violates the "one person, one vote" principle essential for legitimacy and the assumption of equal moral worth.
          *   *Verdict:* Unacceptable. It substitutes an aristocracy of wealth for an aristocracy of birth, which is no progress at all.

      *   **Synthesis/Conclusion:**
          *   Condorcet would prefer *deliberative democracy* enhanced by education (his "social mathematics" applied to institutions, not markets).
          *   He might see prediction markets as *advisory* tools (informational), but never *decisive* mechanisms.
          *   Final thought: Futarchy is technocratic; Condorcet was democratic-rationalist.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I focus too much on modern economics? *Correction:* Keep anchoring back to Condorcet's *Essay on the Application of Analysis to the Probability of Majority Decisions*.
      *   *Check:* Did I address the "herding" aspect? *Correction:* Ensure I mention how price signals create dependency among traders, violating the independence axiom.
      *   *Check:* Is the tone appropriate? *Correction:* Maintain a scholarly, analytical tone suitable for a reader of *Overcoming Bias*.
      *   *Nuance:* Condorcet loved probability. He wouldn't dismiss the math. He would challenge the *input parameters* of the math.

  6.  **Final Polish:**
      *   Ensure the distinction between "vote on values" and "bet on beliefs" is clearly mapped to Condorcet's view on moral truth.
      *   Highlight his specific advocacy for women (Olympe de Gouges connection, *Sur l'admission des femmes au droit de cité*).
      *   Make sure the conclusion ties the three threads together.

  7.  *(Mental Sandbox)*: What if Condorcet liked the idea of removing emotion from policy? He did want to reduce the influence of eloquence. Markets do that. *Counter:* But markets introduce greed. Condorcet wanted reason, not greed. He believed education cultivates reason. Markets cultivate self-interest. Big difference for a moral philosopher.

  8.  **Finalizing the Structure:**
      *   Intro: The Shared Dream of Social Mathematics.
      *   I. The Axioms of Truth: Independence and Competence in Markets vs. Juries.
      *   II. The Ontology of the Good: Can Values Be Voted and Beliefs Bet?
      *   III. The Arithmetic of Equality: Wealth-Weighted Influence vs. Universal Suffrage.
      *   Conclusion: The Rationalist vs. The Technocrat.

  9.  (Proceed to generate output based on these thoughts.)
answer: |-
  It is a striking historical irony that Robin Hanson's futarchy, a proposal born of late-20th-century neoclassical economics and rationalist culture, finds its spiritual antecedent in the Marquis de Condorcet. Both share the foundational conviction that political decision-making is not an art of compromise but a problem of estimation—a matter of aggregating signals to approximate an objective truth. Condorcet's *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785) is indeed the ur-text of this ambition. He sought to prove that democracy was not merely legitimate, but *epistemically superior* to monarchy or aristocracy, provided certain mathematical conditions were met.

  However, to assume Condorcet would endorse futarchy because he endorsed the Jury Theorem is to mistake the theorem for the philosophy. Condorcet was not a mere aggregator of preferences; he was a moral realist and a radical egalitarian. If we reconstruct his verdict on futarchy by applying his specific axioms regarding independence, moral truth, and equality, we find that while he would admire the mathematical formalism, he would likely reject the mechanism as a regression into aristocracy and a misunderstanding of the nature of political truth.

  ### I. The Axioms of Truth: Independence and Competence in Markets vs. Juries

  The engine of Condorcet's Jury Theorem is not the majority rule itself, but the assumptions required to make it work: voters must be independent, and each must have a probability of correctness ($p$) greater than 0.5. If these hold, the probability of the majority reaching the correct decision approaches 1 as the number of voters increases.

  Condorcet would immediately scrutinize whether a prediction market satisfies these axioms better than a jury of citizens.

  **On Competence ($p > 0.5$):**
  Condorcet was optimistic about human reason but realistic about ignorance. He believed $p > 0.5$ was achievable through basic education and the absence of coercive influence. In futarchy, "competence" is proxied by the ability to predict outcomes profitably. Condorcet might concede that professional traders have higher *technical* competence regarding price movements than the average peasant. However, he distinguished sharply between *skill* (technical ability) and *judgment* (moral and rational capacity). For Condorcet, a "correct" political decision is not just one that works, but one that aligns with natural right. A trader might correctly predict that a war will boost GDP (high $p$ on the empirical belief), but lack the moral judgment to know the war is unjust. Condorcet would argue that market competence measures predictive acuity, not the holistic judgment required for the "general will."

  **On Independence:**
  This is where Condorcet's critique would be most devastating. The Jury Theorem collapses if voters correlate their errors. Condorcet was terrified of "corporate spirits" and factions that could sway individuals to vote against their own reason. He designed constitutional safeguards to prevent representatives from communicating too closely, fearing the formation of cabals.

  Prediction markets, by their very mechanism, violate the independence axiom. Traders do not form beliefs in a vacuum; they observe the market price, which is the aggregate of others' beliefs. This creates an information cascade. If a price moves, it signals information to other traders, inducing herding behavior. For Condorcet, this is the mathematical equivalent of a jury foreman bullying the other jurors. The market price becomes a source of "eloquence" or authority that sways the individual, corrupting the independence required for the theorem to converge on truth. He would likely view the market not as a collection of independent samplers, but as a single, volatile organism prone to the very passions and panics he hoped social mathematics would tame.

  ### II. The Ontology of the Good: Can Values Be Voted and Beliefs Bet?

  Futarchy relies on a sharp distinction: values are subjective (vote on them), beliefs are objective (bet on them). Condorcet would find this dichotomy philosophically incoherent.

  **Moral Realism vs. Preference Aggregation:**
  Condorcet was a moral realist. He believed that rights and justice were discoverable truths, akin to mathematical theorems, not mere expressions of collective desire. When he advocated for voting, he did not view it as a way to sum up subjective preferences (as modern social choice theory often does), but as a method to *discover* the pre-existing correct decision.

  In *Sur l'admission des femmes au droit de cité* (1790), he argues that women's suffrage is required by natural right, regardless of whether the male majority desired it. If a polity voted on a welfare metric that excluded the rights of a minority, Condorcet would deem that vote "wrong," not just a legitimate expression of value. Futarchy takes the welfare metric as a given input. Condorcet would ask: *Who verifies the metric?* If the metric is determined by majority vote, it is subject to the same errors as any other decision. If the metric is flawed (e.g., maximizing GDP at the expense of liberty), a prediction market will efficiently find the most oppressive policy to maximize it.

  **The Unity of Reason:**
  Condorcet believed that empirical and moral questions were both subject to the light of reason. To relegate moral questions to a "vote" (which implies might-makes-right) and empirical questions to a "market" (which implies profit-makes-right) fragments the unity of human reason. He would argue that determining *what* maximizes welfare is not purely empirical; it involves theoretical understanding of society that should be open to public deliberation, not just speculative positioning. He would likely view the separation as an abdication of the citizen's duty to be informed. For Condorcet, the citizen must understand the *means* as well as the *ends* to be truly free. Outsourcing the means to speculators creates a technocratic priesthood, which contradicts his vision of an enlightened populace.

  ### III. The Arithmetic of Equality: Wealth-Weighted Influence vs. Universal Suffrage

  This is the point of greatest friction. Condorcet was arguably the most radical egalitarian of the French Enlightenment. He advocated for universal suffrage regardless of property or gender at a time when even many revolutionaries balked.

  **The Aristocracy of Capital:**
  Futarchy implements a "one dollar, one vote" system for beliefs. Condorcet explicitly argued against wealth-weighted voting. In his analysis of elections, he worried that the rich could exert undue influence over the poor through economic dependence. A prediction market institutionalizes this dependence. It grants political influence (in the form of policy selection) proportional to capital and risk tolerance.

  Condorcet would see this as a return to the *censitary* suffrage (voting based on tax contribution) that the Revolution sought to abolish. He believed that every individual, by virtue of their capacity for reason, had an equal stake in the truth. A poor laborer might have less capital, but their experience of the policy's effect is as valid as a speculator's. By weighting influence by wealth, futarchy biases the "truth" toward the interests of the wealthy. If a policy benefits the rich but harms the poor, the rich have more capital to bet on its success, potentially manipulating the market price to reflect a false positive.

  **Risk vs. Reason:**
  Furthermore, market influence is weighted by risk appetite. Condorcet valued prudence and stability. A market system rewards those willing to gamble. Condorcet would likely argue that political decision-making requires caution, not the aggressive risk-taking incentivized by speculation. Giving more political weight to the reckless contradicts the goal of securing the natural rights of all, especially the vulnerable.

  ### IV. Synthesis: The Rationalist vs. The Technocrat

  If we synthesize these tensions, Condorcet's verdict emerges not as a rejection of "social mathematics," but as a rejection of *market* mathematics as a substitute for *democratic* mathematics.

  Condorcet would likely view futarchy as a form of **technocratic despotism**. It solves the problem of voter ignorance (which worried him) by removing the decision from the voter, but it does so by handing the reins to an unelected aristocracy of speculators. He would argue that the solution to ignorance is not markets, but *education*. His *Sketch for a Historical Picture of the Progress of the Human Mind* posits that the perfection of political institutions depends on the perfection of human reason through public instruction.

  **Where He Might Compromise:**
  Condorcet was pragmatic enough to recognize that direct democracy on every issue is impossible. He might accept prediction markets as **advisory bodies**. If a market predicts a policy will fail, that is valuable data for the legislative assembly. But the *decision* must remain with the representatives of the people, who are bound by the mandate of the voters and the constraints of natural right.

  He would appreciate the *incentive* structure of futarchy (rewarding truth) but reject the *distribution* of power. He might propose a system where "citizen juries" are rewarded for accuracy in forecasting local outcomes, integrating the incentive of the market with the equality of the jury. But the core mechanism of wealth-weighted betting would be anathema to him.

  ### Conclusion

  Condorcet would recognize Hanson as a fellow traveler in the quest to apply probability to the moral sciences. He would agree that we should "bet on beliefs" in the metaphorical sense—that policy should be guided by the best available probabilistic evidence.

  However, his final verdict would be negative. He would argue that futarchy fails the **independence test** (markets herd), fails the **moral test** (values are truths to be reasoned, not preferences to be tallied), and fails the **equality test** (wealth should not buy political truth). For Condorcet, the "correct" decision is not merely the one that maximizes a metric, but the one that a free, equal, and educated populace would assent to under conditions of ideal deliberation.

  Futarchy seeks to bypass the need for an enlightened citizenry by using markets to extract truth from self-interested actors. Condorcet's entire life's work was predicated on the belief that we *must* create an enlightened citizenry, because without that, no mathematical mechanism can secure liberty. He would likely conclude that futarchy is a shortcut that sacrifices the very equality that makes the search for political truth legitimate in the first place.
