prompt: |-
  So a few of us on my team got into a whole side-argument last week about why our A/B test results at work never seem to replicate cleanly, and someone linked an article about the replication crisis in psychology, which sent me down a multi-night rabbit hole reading about the history of significance testing. Apparently what basically every intro stats class (and every data science bootcamp, judging by mine) teaches as "the" hypothesis test is actually a kind of frankenstein mashup of Fisher's approach and Neyman-Pearson's approach, even though Fisher and Neyman apparently despised each other so much that Fisher at one point compared Neyman-Pearson-style decision procedures to Soviet central planning in one of his papers. That was a fun tangent on it's own honestly, but it also kind of broke my brain a little, because I always assumed "the p-value test" was just one coherent thing some guy invented, not two incompatible philosophies duct-taped together.

  Anyway, now I'm stuck trying to figure out, of all the different frameworks statisticians and philosophers have proposed for how you're supposed to draw conclusions from noisy data, which ones actually deserve the most "blame" for the mess we're in, and which ones are more like innocent bystanders (or even point toward a fix). I don't have any formal stats or philosophy training, I just write backend services for a living, so I genuinely can't tell if my gut ranking here makes any sense or is totally off base. Could you rank the six approaches below from S-tier ("most responsible for the replication crisis") down to D-tier ("basically blameless, or actually points toward fixing it")? Give a 1-2 sentence justification for each one, and return the whole thing as a JSON block using the short labels I've given each approach, formatted like this:

  ```json
  {
    "S": ["label1"],
    "A": ["label2"],
    "B": [],
    "C": ["label3", "label4"],
    "D": ["label5", "label6"],
    "why": {
      "label1": "one or two sentences",
      "label2": "..."
    }
  }
  ```

  The six approaches:
  - fisherian: Fisherian significance testing — p-value as continuous evidence against the null, no fixed alpha threshold decided in advance
  - neyman_pearson: Neyman–Pearson hypothesis testing — fixed alpha and beta, an explicit alternative hypothesis, long-run error-rate control
  - hybrid_nhst: the hybrid "null hypothesis significance testing" actually taught in textbooks and used in most papers, which mixes the two above without acknowledging it
  - subjective_bayes: subjective/personalist Bayesianism — priors are just an individual's honest degrees of belief (de Finetti/Savage style)
  - objective_bayes: objective/default Bayesianism — Jeffreys-style "uninformative" priors meant to make results more mechanical and comparable across researchers
  - likelihoodism: evidence is just the likelihood ratio between two hypotheses, no priors and no long-run error rates at all (Royall's version)
