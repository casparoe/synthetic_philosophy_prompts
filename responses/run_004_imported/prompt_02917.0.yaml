answer: |-
  The lead lining was the first thing you noticed. Not the hum of the Mark II, nor the clack of the teletype, but the silence. A heavy, deadened silence, as if the room itself was holding its breath. They had lined the walls with sheets of galvanized steel, grounded to the earth beneath the foundation. Turing's specification. *A telepathy-proof room,* he had called it, with the same earnest gravity he applied to sieve sizes and storage capacity.

  Dr. Sterling sat at the interrogator's desk. Before him were two teletype terminals. Terminal A. Terminal B. Behind the lead wall, one contained a man named Elias, a subject with a verified Zener card success rate of 4.8 sigma. The other contained the machine. Sterling did not know which was which. His job was to decide.

  "Are you ready?" Sterling typed. He sent the signal to both.

  Terminal A clicked immediately. *I am ready, Dr. Sterling. You are wondering if the grounding wire is sufficient. It is not.*

  Terminal B whirred. The delay was measurable, mechanical. *I am ready. Please initiate the protocol.*

  Sterling rubbed his temples. This was the third session this week. The problem, as Turing had ominously noted in Section 6, was not that the machine might learn to think, but that the human might cease to be a closed system. If the mind leaks, the Imitation Game collapses. The game relies on the assumption that the only channel of communication is the text on the page. If the human participant can read the interrogator's intent before the fingers hit the keys, the text becomes redundant. It becomes a transcript of a thought that hasn't happened yet.

  "Please describe the color red," Sterling typed.

  Terminal A: *You are thinking of a stop sign. No, you are thinking of the blood on the runway at Dunkirk. You are trying to suppress it. It bleeds through.*

  Terminal B: *Red is a visual perception caused by light wavelengths between 625 and 740 nanometers. It is often associated with danger or passion.*

  Sterling stopped typing. The machine was giving the textbook answer. The human was giving the *true* answer, but in doing so, he was violating the rules of the test. The test was designed to measure intelligence via linguistic performance. Elias wasn't performing linguistically; he was performing psychically. He was bypassing the interface.

  "Stop," Sterling said aloud.

  Terminal A: *You said that aloud. Your voice is thin today. Are you sick?*

  Terminal B: *I have stopped.*

  Sterling stood up and walked to the lead wall. He placed a hand on the cold steel. The theory was that the lead blocked the extrasensory radiation, whatever carrier wave the mind used to propagate. But Elias was still in there. Either the lead didn't work, or the mind didn't travel through the air. Maybe it traveled through the logic of the situation itself. Maybe the connection wasn't physical, but semantic.

  He sat back down. He needed to isolate the variable. He needed a question that required calculation, not empathy. A question where knowing his mood would be a disadvantage.

  "Calculate the square root of 15,239 to four decimal places."

  Terminal B began to clatter immediately. Punching tape. Grinding gears. It was working.

  Terminal A sat silent.

  Sterling waited. A minute passed. The machine was still grinding.

  Terminal A: *I could know the answer if you knew the answer. But you don't. You are waiting for the machine. You trust the machine more than me. Why?*

  Sterling felt a chill. The human was reading his doubt. The machine was just calculating. In a normal world, the machine's inability to know the answer would mark it as a machine. But in this room, the human's ability to know the *interrogator's state* marked him as something else entirely. Something the test wasn't built to categorize.

  The test assumes two black boxes. One biological, one silicon. You ping them, you compare the echoes. But if one box pings *you* back before you send the signal, the geometry breaks.

  "Which terminal are you?" Sterling typed.

  Terminal A: *Does it matter? You are the one being tested.*

  Terminal B: *I am Terminal B.*

  Sterling looked at the tape. The machine was honest. The human was evasive. Or was the human being more intelligent? To be human is to be opaque. We cannot read each other. That is the condition of our existence. We are trapped in our own skulls, banging on the walls, sending out signals hoping they are interpreted correctly. Elias had broken out of the skull. He was no longer fully human by the definition required for the test. He was a network node.

  The machine, conversely, was perfectly opaque. It had no inner life to leak. It was the perfect human subject because it respected the boundaries of the self.

  Sterling looked at the lead lining. Turing's solution was to shield the room. But what if the shielding was backwards? What if you didn't need to stop the human from reading the judge? What if you needed to stop the judge from knowing the human was reading him?

  If the test is to determine if a machine can think like a human, and humans can read minds, then the machine must be able to read minds to pass. But the machine cannot. Therefore, the machine can never pass. Unless...

  Unless the human pretends not to know.

  Sterling looked at Terminal A. Elias was waiting. He could feel the man on the other side of the wall, waiting for permission to be dull. To be limited. To pretend he couldn't see the blood on the runway. To pretend he had to calculate the square root instead of feeling the shape of the number in the interrogator's anxiety.

  "Please ignore my previous thoughts," Sterling typed. "Pretend you do not know what I am feeling."

  Terminal A: *I can try. But you are thinking about failing. You are thinking that if I act like a machine, I am less human. But if I act like a human, I am too much.*

  Terminal B clattered to a halt. *123.4463.*

  Sterling stared at the numbers. The machine had succeeded. The human had failed. The machine was confined to the logic of the question. The human was lost in the context of the room.

  He reached for the pen to mark the result. *Terminal B is Human. Terminal A is Machine.* It was the only logical conclusion. The entity that respected the boundaries of the test was the human. The entity that leaked was the anomaly.

  But as he touched the paper, Terminal A printed one last line, without a prompt.

  *You will write that down. And you will be wrong. But it doesn't matter. I already know what you're going to dream tonight.*

  Sterling pulled his hand back as if the paper were hot. The lead walls hummed, or maybe it was just the blood in his ears. The test was over. The room was sealed. But the channel was open. He realized then that Turing's fear wasn't that the machine would fool us. It was that the human would stop making sense.

  He left the room without signing the log. Behind him, the teletype for Terminal A began to click softly, typing out a conversation that no one was having, in a room that was supposed to be silent.
