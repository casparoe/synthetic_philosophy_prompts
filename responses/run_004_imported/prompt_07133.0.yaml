      *   **The Problem:** A philosopher friend introduced them to the *finks and masks* literature (C.B. Martin, Mark Johnston) regarding dispositions. This literature threatens the CA of abilities.
      *   **Specific Concerns:**
          *   Finks: Disposition disappears when triggered (e.g., last-second change of heart).
          *   Masks: Disposition exists but is blocked (e.g., compulsions, manipulation).
          *   Worry: Human agency is full of these.
          *   Proposed Solutions: Vihvelin, Fara (adding "absent finks/masks" riders).
          *   **Core Question:** What are the implications for compatibilism? Is there a principled way to exclude finks/masks without (a) circularity (reintroducing "ability") or (b) *ad hoc* tailoring (losing the Rylean spirit)?

  2.  **Deconstruct the Philosophical Landscape:**
      *   **The Classical Conditional Analysis (CA):** $S$ can do $A$ iff $S$ would do $A$ if $S$ tried/chose to. (Moore, Ayer).
      *   **The Attack:** Chisholm (1964) and the Fink/Mask literature (1990s+).
          *   *Fink:* Wire is live, but device kills current when touched. Conditional "If touched, shock occurs" is false, but wire *is* live (disposition exists). Or vice versa (Martin's Electro-fink): Wire is dead, but device makes it live when touched. Conditional is true, disposition false.
          *   *Mask:* Wire is live, but insulation prevents shock. Conditional false, disposition true.
      *   **Application to Free Will:**
          *   "I could have done otherwise" $\approx$ "If I had chosen otherwise, I would have done otherwise."
          *   *Fink case:* I choose otherwise, but a demon/neural glitch changes my choice back or prevents action *at the moment of choice*.
          *   *Mask case:* I have the capacity, but a compulsion/phobia blocks the manifestation.
      *   **The Compatibilist Dilemma:** If CA fails, what grounds the "could have done otherwise" required for moral responsibility (on many compatibilist views)?

  3.  **Evaluate the "Rescue" Attempts (Vihvelin, Fara, etc.):**
      *   **Vihvelin:** Argues that abilities are *intrinsic dispositions*. Finks/masks are extrinsic interferers. If the disposition is intrinsic, finks/masks don't destroy the ability, they just prevent its *exercise*.
