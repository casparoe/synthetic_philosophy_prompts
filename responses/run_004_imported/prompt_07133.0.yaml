      *   **Fara:** Dispositional analysis needs to be sensitive to *holding conditions*.
      *   **Clarke, Kapitan, etc.:** Many argue the Simple CA is dead. The debate moved to *Dispositionalism* vs. *Causal Powers* vs. *Leeway Compatibilism*.

