      *   *Nuance:* Vihvelin's view is specifically that abilities are *intrinsic*. A fink is extrinsic. So the ability remains even if the fink prevents action. But does the agent "can" do it if a fink is present? Vihvelin says yes, they have the ability, they just can't exercise it *now*. This distinguishes *capacity* from *opportunity*.
      *   *Nuance on Circularity:* If we define the disposition by its causal basis (neural states), is that circular? No, that's empirical. The circularity comes if we define the basis as "that which causes the action if tried."
      *   *LessWrong Context:* Mention that Eliezer/LW compatibilism often leans on the Simple CA, so this is a specific update for that crowd.

  8.  **Final Polish:** Organize with clear headings. Ensure the conclusion directly answers the "principled way" question. (Verdict: No perfect reductionist way, but a robust realist way exists).

