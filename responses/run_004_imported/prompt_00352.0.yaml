  *(Self-Correction Note during drafting the "Key/Ring" section)*: I need to be careful with the visual field anatomy. Left visual field -> Right Hemisphere. Right visual field -> Left Hemisphere. Left hand -> Right Hemisphere. Right hand -> Left Hemisphere. Language is usually Left Hemisphere. I must ensure the dialogue gets this right or it undermines the credibility.

  *(Refining the "Interpreter" concept)*: Marcus should bring up Gazzaniga's "Interpreter" theory to explain why the patient confabulates. This strengthens the "One Person" argument.

