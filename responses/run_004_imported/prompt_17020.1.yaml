      *   **The Core Work:** Describe what he actually did in the ICU. Not just saving lives, but the hard decisions to stop.
      *   **The Ethical Tension (The "Secret"):** Introduce the internal conflict gently. The distinction he used professionally vs. the doubt he held privately. Use the drowning cousin analogy but keep it accessible (narrative form, not academic).
      *   **The Father's Wish:** Quote his specific instruction about not letting him off the hook. This is the emotional pivot.
      *   **Reframing the Uncertainty:** Why is this doubt a *good* thing? It shows his weight of responsibility, his humility, his care. It's not a flaw; it's a feature of his morality.
      *   **Closing:** Bring it back to the people in the room. How do we honor him? By carrying that same weight of care. Final farewell.

  3.  **Drafting - Section by Section:**

