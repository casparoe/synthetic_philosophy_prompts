      *   *The Work:* It wasn't just heroics. It was stewardship. Sometimes that meant stopping. I need to phrase this carefully so family doesn't think he gave up, but colleagues know what I mean. "Stepping out of the way of the inevitable."
      *   *The Philosophy (The Hard Part):* How to explain the "acts and omissions" doctrine without sounding like a professor? Keep it story-based. The drowning cousin story is perfect, but I need to frame it as *his* burden, not a puzzle to solve. He kept that article for decades. Why? Because he cared about the truth more than his own peace of mind.
      *   *The Instruction:* "Don't let me off the hook." This is crucial. It means he owned his actions. He didn't hide behind "the disease."
      *   *The Comfort:* Where is the solace? It's in the fact that he *worried*. A monster wouldn't worry. A bureaucrat wouldn't worry. He worried because he valued life. The uncertainty *is* the integrity.
      *   *Conclusion:* To the colleagues: You know this weight. To the family: You knew his heart. He is at peace now, not because he solved the puzzle, but because he no longer has to carry the weight.

