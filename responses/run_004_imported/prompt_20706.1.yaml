prompt: |-
  I sit on my university art museum's collections ethics committee as the grad rep (long story how a political phil PhD student ended up here). We've got a genuinely hard case on the docket: a bronze plaque taken during a 19th-century colonial military expedition, sold through a dealer, bought "in good faith" by an alumnus in the 1970s who had no clue about the original theft, and donated to us in the 90s. The source nation has formally requested its return. Half the committee thinks a good-faith purchase decades removed just ends the inquiry, the other half thinks that's obviously too easy but can't articulate why without just asserting it. Everyone keeps lobbing the Wilt Chamberlain thing at me like it settles something -- it doesn't, that's the easy part of Nozick. The part I actually need help with is his rectification principle, plus that bind he gets into near the end of chapter 7 where taking historical injustice seriously enough seems to push even an entitlement theorist back toward something like patterned redistribution, since we can't reconstruct the real counterfactual holdings. Can you draft the memo I'd circulate to the committee before we vote? I need an actual recommendation (return/keep/something conditional, with a timeline for acting on it), real use of the acquisition/transfer/rectification structure rather than name-dropping it, and a fair, non-strawmanned version of the best case for why good-faith purchase should still carry weight here.
