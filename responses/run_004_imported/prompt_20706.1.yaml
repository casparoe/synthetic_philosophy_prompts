      *   *Justice in Transfer:* Was the chain of custody voluntary? The sale to the alumnus might have been voluntary between dealer and buyer, but the dealer likely didn't have valid title if the initial acquisition was unjust. Therefore, the transfer is tainted.
      *   *Justice in Rectification:* This is the crux. When rights are violated, how do we fix it? Nozick says we need to restore the victim to the position they would have been in had the injustice not occurred.
      *   *The "Good Faith" Objection:* The alumnus/university didn't steal it. They relied on the stability of transactions. If we undo all past transactions, social stability collapses (the "statute of limitations" or "repose" argument).
      *   *The Nozickian Bind (Chapter 7):* If we take rectification seriously, we need to know the counterfactual history (what would the source nation have done with the plaque?). If we can't know that, do we default to a patterned principle (like equality)? Nozick admits this is a problem for strict entitlement theorists.
      *   *Application:* We can't know the exact counterfactual (would it have been sold? destroyed? kept in a temple?). However, the *current* holding is based on a chain originating in theft. The "good faith" purchase transfers *possession*, but arguably not *title* if the seller had no title.

  3.  **Drafting Strategy - Section by Section:**

