      *   **The Specific Theoretical Need:** Apply Nozick's *Entitlement Theory* (specifically the *Principle of Rectification*), not just the *Principle of Justice in Acquisition/Transfer*. Address the "counterfactual problem" (we don't know what would have happened without the theft).
      *   **Deliverable:** A memo to the committee.
