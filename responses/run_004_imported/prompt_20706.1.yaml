  9.  *(Final check on the "Chapter 7 Bind")*: Nozick admits that if we can't know the counterfactual, strict entitlement theory struggles. I need to argue that in the face of this uncertainty, the presumption should not favor the current holder (the museum) who benefits from the injustice, but the victim.

