          *   Therefore, ICT relies on *instrumental* rationality, which is the exact domain Hume assigned to reason. It doesn't constrain the *telos*, only the *topology* of the path.
      *   *Conclusion:* Summarize. The tension is resolved by seeing coherence as a tool for goal-satisfaction, not a source of goal-generation.

  5.  **Refining the Argument (Self-Correction/Nuance):**
