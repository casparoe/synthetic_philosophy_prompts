answer: |-
  Here are 10 interview questions designed to press past the standard "ensemble vs. time" elevator pitch, including the four specific thematic requirements with tailored follow-ups.

  ### 1. The Samuelson Objection (Utility vs. Growth)
  Paul Samuelson famously argued that maximizing the geometric mean is mathematically equivalent to maximizing expected log utility. He claimed calling it 'rational' is just dressing up a specific risk preference (logarithmic) in a growth-rate costume. If it's just one utility function among many, what grants the log exponent a monopoly on rationality?

  *   **Likely Answer:** She will argue that log utility isn't a *preference* but a *derivation* from the physics of non-ergodic processes. She'll say EUT lets you pick any utility function arbitrarily, whereas ergodicity economics derives the function from the dynamics of the wealth process itself.
  *   **Follow-up:** "If the function is derived from the dynamics, does your theory collapse in environments where wealth isn't multiplicative? If I'm a salaried worker with additive income shocks, is geometric rationality no longer 'rational' for me?"

  ### 2. The Myopia Paradox
  Kelly betting is often described as 'myopic'—it calculates the optimal bet size based only on the immediate wager and current wealth, without explicitly solving for the infinite horizon. Yet, you bill it as the long-run optimal strategy. How do you reconcile a single-step calculation with a claim about asymptotic survival?

  *   **Likely Answer:** She will likely explain that for multiplicative processes with independent returns, the local optimum aligns with the global optimum. The growth rate is a property of the process, not the horizon.
  *   **Follow-up:** "That alignment holds for i.i.d. returns. But in real markets, odds and correlations shift over time. If the 'local' environment changes faster than the 'long run' converges, doesn't the myopic property become a bug rather than a feature?"

  ### 3. The "Half-Kelly" Reality Check
  In practice, successful fund managers and professional gamblers almost universally shade down to half-Kelly or less. If full Kelly is the mathematical ceiling for rational growth, are these survivors acting irrationally? Or does their behavior suggest the theory is missing a variable, like parameter uncertainty?

  *   **Likely Answer:** She will likely concede they are accounting for "estimation error" or "model uncertainty." She'll argue that full Kelly is optimal only if you know the true probabilities, which no one does, so fractional Kelly is a robustness correction, not a rejection of the theory.
  *   **Follow-up:** "If 'true probabilities' are unknowable in principle, then 'full Kelly' is a theoretical phantom. Does that mean geometric rationality is an asymptote we can never actually touch, rendering it a benchmark rather than a decision rule?"

  ### 4. Normative vs. Descriptive Claims
  There seems to be a tension in your work between a normative claim (this is how agents *ought* to reason to be rational) and a descriptive one (this is how agents *must* behave to survive evolutionary selection). Which is the primary claim? Because if it's evolutionary, a 'rational' agent could still go bust due to bad luck.

  *   **Likely Answer:** She will likely argue the distinction dissolves. In a non-ergodic world, what you *ought* to do is dictated by what allows you to stay in the game. Rationality is defined by survival.
  *   **Follow-up:** "But survival isn't binary. If I survive with 1% of the market's wealth, have I failed rationally? If the theory prioritizes survival over relative performance, does it inadvertently prescribe a strategy for becoming a hermit rather than a market participant?"

  ### 5. The "Error" in Expected Utility
  You characterize Expected Utility Theory (EUT) as making a mathematical error by averaging across parallel universes (ensembles) rather than time. But isn't EUT simply a framework for weighing preferences under uncertainty, not necessarily a claim about time dynamics? Is it an error, or just a different tool for a different job?

  *   **Likely Answer:** She will argue it's an error because EUT is often used to prescribe behavior in dynamic economic contexts (like savings or investment) where the ensemble average is physically inaccessible to the individual.
  *   **Follow-up:** "If EUT is the wrong tool for dynamic wealth, why has it persisted for 70 years? Is the academic resistance purely ideological, or does EUT offer computational tractability that ergodicity economics struggles to match in complex systems?"

  ### 6. Finite Horizons and Ruin
  Geometric rationality focuses heavily on avoiding ruin to ensure the time average converges. But human lives are finite. If I have a hard deadline (retirement, death), doesn't the 'long-run' argument lose its force? Shouldn't a rational agent leverage up as the horizon closes?

  *   **Likely Answer:** She will likely argue that 'ruin' isn't just zero wealth, but falling below a subsistence threshold. Even with a finite horizon, the path matters because you can't recover from a deep drawdown before the deadline.
  *   **Follow-up:** "So you're introducing a utility floor. Doesn't that bring us right back to a customized utility function? Where does the 'physics' end and the 'preference' begin in that calculation?"

  ### 7. Knightian Uncertainty
  Kelly and ergodicity economics assume you can assign probabilities to outcomes. But what about Knightian uncertainty, where the probabilities themselves are unknown or the game rules change? Does geometric rationality offer a decision rule when the distribution itself is non-stationary?

  *   **Likely Answer:** She will likely acknowledge this is the hardest problem. She might suggest using conservative priors or treating the uncertainty as part of the volatility to be discounted.
  *   **Follow-up:** "If the solution to unknown probabilities is to 'discount more,' isn't that just a heuristic? At what point does geometric rationality become a sophisticated way of saying 'be cautious'?"

  ### 8. The Metaphysics of Ensembles
  Your critique relies on the idea that ensemble averages (parallel universes) are physically unreal for a single decision-maker. But in quantum mechanics or large-scale macroeconomic modeling, ensemble averages are standard tools. Are you making a metaphysical claim about reality, or just a methodological one about economic modeling?

  *   **Likely Answer:** She will likely stick to methodological: it doesn't matter if parallel universes exist; what matters is that the *agent* only experiences one trajectory.
  *   **Follow-up:** "If it's methodological, why dismiss EUT entirely? Why not treat ensemble averaging as a useful approximation for systemic risk, while using time averages for individual solvency?"

  ### 9. Beyond Finance
  You've applied this logic to wealth, but does geometric rationality scale to non-fungible goods? How do I calculate the geometric growth rate of my reputation, my health, or my relationships? If the theory doesn't translate, is it a theory of finance or a theory of rationality?

  *   **Likely Answer:** She will likely argue that any resource that can be depleted multiplicatively (like health or trust) fits the framework.
  *   **Follow-up:** "But those resources aren't easily divisible or bettable. If I can't bet 10% of my reputation on a wager, does the math still hold, or does the theory break down outside of liquid markets?"

  ### 10. The "Ought Implies Can" Problem
  If geometric rationality requires calculating growth rates and avoiding non-ergodic traps, it demands significant cognitive load. Most humans use heuristics. If the 'rational' move is computationally expensive, is it fair to label heuristic-based behavior as irrational, or is the theory too demanding to be a standard for human rationality?

  *   **Likely Answer:** She will likely argue that heuristics evolved *because* they approximate geometric rationality (e.g., loss aversion).
  *   **Follow-up:** "If heuristics are just approximations, then the 'rational' core is biological, not mathematical. Does that undermine the claim that you've found a new *mathematical* foundation for economics, rather than just validating evolutionary psychology?"
