prompt: |-
  Quick one for you — I'm writing a piece on 'geometric rationality' for my science column and interviewing a decision theorist who's built her whole career on the claim that Kelly betting isn't just a card-counting trick but the actual correct theory of rational choice under uncertainty. She's part of the ergodicity-economics crowd — the idea that expected utility theory made a real mathematical error by averaging outcomes across an 'ensemble' of possible people instead of averaging across time for the one person actually living through the bets. Can you draft me 8-10 interview questions that dont just let her restate the pitch? I want at least one question on the old Samuelson objection — that maximizing the geometric mean is just log utility with a growth-rate costume on, and theres nothing uniquely 'rational' about that particular exponent — one on why Kelly betting is supposedly 'myopic' (each bet size only looks at the very next wager) and yet gets billed as long-run optimal, one on why real bettors and fund managers almost always shade down to half-Kelly or less if pure growth-maximization is really the rational move, and one on whether the whole framework is a normative claim (this is what you ought to do) or a descriptive one (this is just what tends to survive) — because her answer there seems to change what she's even claiming. For each of those, give me a sharp follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Geometric Rationality / Ergodicity Economics / Kelly Betting.
      *   **Interviewee:** A decision theorist who champions Kelly betting as *the* correct theory of rational choice (not just a trick), aligned with the Ole Peters/ergodicity economics crowd.
      *   **Goal:** 8-10 interview questions that go beyond the standard pitch.
      *   **Specific Requirements:**
          *   Must include a question on the Samuelson objection (log utility vs. geometric mean).
          *   Must include a question on myopia (single-step vs. long-run).
          *   Must include a question on practical implementation (half-Kelly/shading).
          *   Must include a question on normative vs. descriptive claims.
          *   Each of these four specific questions needs a sharp follow-up based on the likely answer.
      *   **Tone:** Professional, insightful, slightly skeptical (science column style), avoiding softballs.

  2.  **Deconstruct the Core Concepts:**
      *   *Ergodicity Economics:* Time averages $\neq$ Ensemble averages. Non-ergodic processes (like wealth growth with leverage) require time-average optimization, which leads to Kelly.
      *   *Kelly Criterion:* Maximizes geometric growth rate. Avoids ruin.
      *   *Expected Utility Theory (EUT):* Traditional neoclassical approach. Maximizes expected value of a utility function (often assumed linear or concave).
      *   *Samuelson's Critique:* Maximizing geometric mean is equivalent to maximizing expected log utility. It's just a specific risk preference, not a universal law of rationality.
      *   *Myopia:* Kelly determines bet size based on current wealth and odds, seemingly ignoring the infinite horizon, yet claims to optimize the infinite horizon.
      *   *Real World:* Full Kelly is volatile. Most use fractional Kelly. Why?
      *   *Normative vs. Descriptive:* Is this how agents *should* act to be rational, or how agents *must* act to survive evolutionarily?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Samuelson Objection.*
          *   *Draft 1:* Paul Samuelson said Kelly is just log utility. What do you say?
          *   *Critique:* Too soft. Needs to challenge the "uniquely rational" claim.
          *   *Refinement:* Focus on the "costume" aspect. If it's just a utility function, why is it *the* rational one?
          *   *Follow-up:* If she says "It's derived from physics/ergodicity, not preferences," ask about the boundary conditions where ergodicity breaks.

      *   *Requirement 2: Myopia vs. Long-Run.*
          *   *Draft 1:* Kelly looks at one bet but claims to be long-term. How?
          *   *Critique:* A bit basic.
          *   *Refinement:* Frame it as a tension between dynamic programming (looking ahead) and the Kelly property (myopic optimality).
          *   *Follow-up:* If she says "It's a property of log utility," ask about non-rebettable scenarios or changing odds.

      *   *Requirement 3: Real World/Half-Kelly.*
          *   *Draft 1:* Why do people use half-Kelly if full Kelly is rational?
          *   *Critique:* Standard.
          *   *Refinement:* Connect it to the definition of rationality. If they are irrational, fine. But if they are successful survivors, does that contradict the theory?
          *   *Follow-up:* If she says "They are risk averse," ask if risk aversion is a preference or a recognition of model error/uncertainty.

      *   *Requirement 4: Normative vs. Descriptive.*
          *   *Draft 1:* Is this about what people should do or what they do?
          *   *Critique:* A bit dry.
          *   *Refinement:* Frame it as an evolutionary argument vs. a philosophical one.
          *   *Follow-up:* If she says "Both," ask about the "ought implies can" problem if the math is too hard for humans.

      *   *Filling the remaining 4-6 questions:*
          *   Need to cover: Utility functions, Ruin, Non-financial applications, Criticism of EUT, The "One Person" argument, and Future directions.
          *   *Q5 (EUT):* Challenge the dismissal of EUT. Is it really an "error" or just a different modeling choice?
          *   *Q6 (Ruin):* Kelly avoids ruin, but life has unavoidable ruin (death). How does the theory handle finite horizons?
          *   *Q7 (Utility):* If wealth isn't the only utility (e.g., happiness, impact), does geometric rationality collapse?
          *   *Q8 (Uncertainty):* Kelly assumes known probabilities. Real life has Knightian uncertainty. How does ergodicity handle that?

  4.  **Refining and Polishing:**
      *   Ensure the tone is consistent.
      *   Check that the follow-ups are "keyed to the answer she's most likely to give" (i.e., anticipate the standard Ergodicity Economics defense).
      *   Make sure there are 8-10 questions total. (I have 4 specific requirements + 4 drafted above = 8. I'll add 2 more to be safe and give the user options).
      *   *Add Q9:* The "parallel universes" intuition. EUT uses ensembles (parallel worlds). Ergodicity says that's fake. Ask about the metaphysical claim.
      *   *Add Q10:* Application beyond finance. Does this change how we view climate change or public policy?

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Samuelson included? Yes.
      *   Myopia included? Yes.
