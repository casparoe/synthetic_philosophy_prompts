      *   **Pettit/Sugden's Paradox:** To justify stopping at node $n$, the BI argument assumes CKR holds at node $n$. But reaching node $n$ implies a deviation from the BI path. If a deviation occurred, CKR is falsified (or at least shaken). So, how can you use CKR to justify an action at a node that CKR says shouldn't be reached? It seems to rely on a counterfactual ("If we were here...") that contradicts the premise ("We can't be here").
      *   **The Defense (Aumann/Stalnaker/Binmore-esque strategic view):** Rationality is defined over the *strategy* chosen at the start, not over local decisions made in isolation after history is observed.

  3.  **Drafting the Defense - Step-by-Step:**

