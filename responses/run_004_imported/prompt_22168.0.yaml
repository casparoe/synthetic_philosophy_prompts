      *   **Addressing the Paradox (The "Surprise" Objection):**
          *   Pettit/Sugden argue: Reaching a node off the equilibrium path implies irrationality. Therefore, CKR is false at that node. Therefore, you can't use CKR to decide what to do there.
          *   Counter-argument: This confuses *ontic* possibility with *epistemic* contingency. In Aumann's framework (often modeled in S5 modal logic), CKR is a global constraint on the state space.
          *   Key distinction: *Ex ante* strategy vs. *Sequential* disposition.
          *   If rationality is a property of the *plan* (strategy), then the plan must specify actions for *all* nodes, even those the plan predicts won't be reached.
          *   Why? Because the optimality of the plan at node 1 depends on what the plan prescribes at node $n$. If the plan said "continue at $n$," the calculation at node 1 changes.
          *   Therefore, the recommendation at node $n$ is not derived *after* reaching $n$ (which would indeed be paradoxical); it is derived *before* play starts as part of the optimal complete strategy.
          *   The "surprise" of reaching the node doesn't invalidate the *conditional* prescription of the strategy. It just means the world is not in the state where play follows the equilibrium path. But the *definition* of rationality required the specification of that action regardless.

      *   **Blocking the Inference:**
          *   Pettit/Sugden inference: "Reaching node is surprising/irrational" $\rightarrow$ "No CKR-sanctioned recommendation available."
