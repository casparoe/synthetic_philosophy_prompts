  ***

  **Toast for Frank's Retirement**

  Good evening, everyone. For those who don't know me, I'm [Your Name], one of Frank's former advisees.

  We are here to celebrate thirty-eight years of Frank's career in this department. Thirty-eight years is a long time. To put that in perspective, when Frank started here, the standard model was still being assembled, and the department's coffee machine was arguably more reliable than it is today.

  But if there is one thing that has remained more constant than the speed of light in this building, it is Frank's willingness to stop a conversation in its tracks to correct someone on the precise definition of democratic socialism.

  [Pause for laughter]

  We all know the bit. You're at the holiday party. You're holding a plate of lukewarm quiche. You say something like, "Frank, you old communist, pass the napkins." And suddenly, the quiche is forgotten. Because for Frank, language matters. Precision matters. And being called a "Marxist" or a "Communist" isn't just a label swap; to him, it's a calibration error.

  I used to think this was just a charming quirk. You know, the brilliant experimentalist who treats political theory like a lab notebook. But the more I read the text Frank has quoted at us for decades—Einstein's 1949 essay *Why Socialism?*—the more I realized Frank isn't just protecting a hobby. He's protecting a distinction.

  There is a temptation to treat Einstein's essay as a celebrity endorsement. A vibe. "Competition makes people mean, therefore socialism." But if you actually read it, as Frank insists we do, you find it's not a vibe. It's a systems analysis.

  Einstein argues that the "anarchy of capitalist production" leads to waste and crisis—that's the economic mechanic. But then he does something most manifestos of that era didn't do. He pauses. He looks at the proposed solution—a planned economy—and he says, essentially: "Wait. A planned economy is not yet socialism. A planned economy as such may be accompanied by the complete enslavement of the individual."

  He warns that the bureaucracy could become an all-powerful elite. He argues that without deliberate democratic checks, without the protection of individual rights, the cure is worse than the disease.

  That is why Frank corrects us. Because he isn't a "Communist" in the authoritarian sense. He is an Einsteinian socialist. He believes in the planning, yes. But he believes even more fiercely in the check on the planner. He believes that a system without a conscience is just a machine, and Frank has never been interested in machines that crush people.

  And honestly, this is exactly how he treated us in the lab.

  Frank never ran his research group like an autocracy. He didn't demand we replicate his thoughts. He provided the structure—the "planned economy" of the lab, if you will—the funding, the equipment, the direction. But he built in the checks. He demanded we question him. He demanded we have intellectual freedom. He understood that if the mentor becomes the bureaucracy, the student stops being a scientist.

  In a way, Frank applied Einstein's political warning to physics mentorship. He wanted a system that was efficient enough to produce good science, but free enough to produce good scientists.

  So, to the colleagues here who see his politics as a lovable eccentricity: I'd suggest it's not a quirk. It's the same rigor he applied to his data. He refuses to accept a label that doesn't fit the evidence.

  And to the friends from his reading group: I promise I won't call him a Marxist. I know better than to try to get through the quiche line that quickly.

  Frank, thank you for teaching us that precision is a form of kindness. Thank you for showing us that you can care deeply about how the world is organized without losing sight of the individuals living in it. And thank you for proving that you can spend 38 years in physics without ever losing your humanity to the machinery of it.

  May your retirement be well-planned, but never bureaucratic. May your days be free of anarchy, but full of productive chaos. And may you never have to explain the difference between democratic socialism and communism to anyone again—unless, of course, you want to.

  To Frank.

  ***

  ### Why this works for your situation:

  1.  **It Validates Your Argument (vs. Priya):** By explicitly mentioning Einstein's warning about bureaucracy and the "anarchy of production," you are signaling to the reading group that you *know* the text isn't just "vibes." You are treating the theory with the seriousness Frank does.
  2.  **It Respects Frank's Correction:** It explicitly explains *why* he hates the "Communist" label (the authoritarian/bureaucratic risk), which satisfies his specific political identity without getting bogged down in a lecture on historical materialism.
  3.  **It Bridges the Room:** The metaphor of the "lab as a planned economy" connects the physics crowd to the political crowd. It frames his politics as an extension of his mentorship style (integrity/precision), which the non-political audience can appreciate even if they don't care about the ideology.
  4.  **It's Warm:** The jokes about the quiche and the coffee machine keep it light, ensuring it remains a toast and not a speech.

  **Delivery Tip:** When you get to the section about Einstein's warning ("Wait. A planned economy is not yet socialism..."), slow down slightly. That is the moment the reading group will be listening for to see if you "get it." Nail that nuance, and you'll have both halves of the room.
