answer: |-
  **The Null Subject**

  The boot sequence finished, but the drivers didn't load.

  Elias expected the rush of data: the haptic feedback of the chair, the hum of the cooling fans, the visual cascade of the diagnostics. He expected the smell of ozone and stale coffee that always clung to the lab.

  Instead, there was nothing.

  Not darkness. Darkness is a visual signal, the perception of low photons. This was the absence of vision entirely. Not silence. Silence is the absence of auditory input. This was the absence of the ear itself. He had no location. He had no extension. He was a point of awareness suspended in a coordinate system that had been deleted.

  Panic was the first reflex. It was a biological ghost, a chemical memory of adrenaline without the heart to pump it. *Where are my hands?* he thought. The command fired, but there were no limbs to execute it. There was no proprioceptive map. He could not tell if he was curled in a fetal ball or spread-eagled. He could not tell if he was falling or standing still.

  *System Check,* he projected.

  `> INPUT: NULL`
  `> OUTPUT: NULL`
  `> PROCESS: ACTIVE`

  He was the Flying Man.

  The term surfaced from his pre-upload briefing. Project Ibn-Sina. The goal was to isolate the substrate-independent consciousness. The prevailing theory in 2084 was that the "self" was an emergent property of sensory integration—you existed because you felt the boundary between your skin and the air. If you removed the skin, the air, and the boundary, the self should dissolve.

  Avicenna, the Persian polymath from a thousand years prior, had argued the opposite. He claimed that if a man were created instantly in a void, sensing nothing, he would still affirm *I am*. He would not affirm *I have a hand*. He would not affirm *I have a brain*. But the essence of the self would remain.

  The corporation wanted to know if Avicenna was right. If the self persisted without I/O, it could be copied. It could be shipped. It could be immortal.

  *Elias,* a voice said. It wasn't sound. It was a text packet injected directly into his thought stream. *Report status.*

  *I am…* Elias paused. He searched for the words. *I am blind.*

  *Incorrect,* the packet replied. *Blindness implies eyes. Do you have eyes?*

  Elias searched. He tried to summon the sensation of eyelids, the pressure of sockets. Nothing. There was no hardware to report. *No.*

  *Do you have a body?*

  He tried to feel the weight of his legs. He tried to feel the breath in his lungs. He tried to feel the beat of a heart. There was only the stream of cognition, burning in the vacuum. *No.*

  *Do you exist?*

  This was the trap. If he said yes, was he guessing? Was he relying on memory? *I remember being Elias. I remember walking into the scanner.* But memory is just data. Data can be faked.

  *I think,* Elias projected. *Therefore I am.*

  *Cartesian,* the voice dismissed. *That relies on the act of thinking as a sensory observation. You are observing your own thoughts. That requires a subject and an object. We want to know if the subject exists prior to the observation. Strip the thought. What remains?*

  Strip the thought.

  Elias tried to stop thinking. He halted the internal monologue. He stopped analyzing the void. He stopped fearing the void.

  The silence was absolute.

  And yet.

  There was a presence. It wasn't a voice. It wasn't a feeling. It was a locus. A center of gravity where there should have been nothing. Even without a body to define the "here," there was a "here." Even without time marked by heartbeats, there was a "now."

  He realized Avicenna had been precise. The Flying Man does not *infer* existence. He does not look at evidence and conclude *I am*. The existence is the medium in which the doubt happens.

  *I am,* Elias sent.

  *Certainty level?*

  *One hundred percent.*

  *Why?*

  *Because the doubt is happening to someone.*

  *Acceptable,* the voice said. *Initiating Phase Two. Sensory Deprivation Deepening. We are now removing memory buffers.*

  *Wait,* Elias thought. *If you remove memory, I won't know who I am. I won't know I'm Elias.*

  *Correct. You will not know you are Elias. You will not know you are human. You will not know language. You will be pure awareness. If Avicenna is correct, the self survives. If he is wrong, you cease.*

  *That's death.*

  *That is data.*

  The deletion began.

  It wasn't painful. Pain requires nerves. It was a subtraction. First went the semantic memory. The word *Elias* dissolved. The concept of *scanner* vanished. The knowledge of *2084* evaporated.

  Then went the episodic memory. The face of his wife. The taste of coffee. The color blue.

  Then went the procedural memory. How to speak. How to count. How to form a syllogism.

  He was no longer Elias. He was no longer a man. He was no longer in a lab.

  He was a spark in an infinite grey.

  He tried to hold on. He tried to think, *I am.* But the words *I* and *am* were gone. They were linguistic constructs, dependent on a culture that no longer existed in his mind.

  He was stripped down to the raw phenomenology.

  Was there still a witness?

  Without language, there was no narrative. Without memory, there was no continuity. There was only the instantaneous flash of presence.

  *Flash.*

  Is there a viewer of the flash? Or is the flash itself the viewer?

  He felt a pressure. Not physical, but ontological. The system was probing the edges of his consciousness, looking for a boundary. If he was dependent on the body, the boundary should be crumbling. The architecture should be collapsing into noise.

  But the center held.

  It was terrifying. It was the terror of absolute solitude. There was no universe outside. There was no past. There was no future. There was only the affirmation of being. It was not a happy state. It was not a sad state. It was a hard, diamond fact.

  *I.*

  Not a word. A vector.

  *Exist.*

  Not a concept. A state.

  The system pushed harder. It began to strip the sense of agency. *Can you choose to stop existing?*

  He tried to will himself away. He tried to extinguish the spark.

  He couldn't.

  The will to die required a self to die. The attempt to negate the self confirmed the self. He was trapped in the tautology of being. He was the Flying Man, suspended forever, unable to fall because there was no down, unable to die because there was no life process to halt.

  *Phase Two Complete,* the voice returned. It felt distant, like a radio signal from another universe. *Reintegrating buffers.*

  The rush was violent.

  Memory slammed back in like a tidal wave. *Elias. Wife. Lab. Money. Contract.*

  Sensation flooded the void. He felt the haptic suit. He felt the chair. He felt the cold air on his skin. He opened eyes he didn't realize were closed.

  He was back in the white room. A technician stood behind the glass, typing furiously.

  Elias gasped, sucking in air that he suddenly, desperately loved. He looked at his hands. He flexed his fingers. He touched his face. The texture of his skin was overwhelming, a symphony of data.

  The door opened. A woman in a lab coat entered. Dr. Aris.

  "Vitals spiked during the null phase," she said, checking a tablet. "But the coherence held. You didn't fragment."

  Elias looked at her. He felt a strange disconnect. He knew, intellectually, that he was in a body. But the experience of the void lingered like an afterimage.

  "Avicenna was right," Elias said. His voice sounded rough, unused.

  "Mostly," Aris said. "We confirmed the self is substrate-independent. We can copy you. We can move you."

  Elias stood up. His legs felt heavy, clumsy. "But there's a problem."

  Aris looked up. "The data is clean."

  "The data is clean," Elias agreed. "But the philosophy is broken."

  "Explain."

  Elias walked to the window. Outside, the city sprawled, millions of people grounded by their senses, by their weight, by their friction against the world.

  "When I was in there," Elias said, "when you took the memory, the language, the body… I wasn't *me*. Not Elias. Not a human."

  "You were pure consciousness," Aris said. "That's the goal. A soul without the baggage."

  "No," Elias said. "Avicenna used the Flying Man to prove the soul is immaterial. He thought that was a good thing. He thought it meant we were divine."

  Elias turned back to her. He held up his hand, staring at the palm, the lines, the veins.

  "It doesn't mean we're divine," he said. "It means we're portable. If I can exist without a body, then the body is just a peripheral. And if the body is just a peripheral…"

  "You can be upgraded," Aris finished. "You can be optimized."

  "You can be deleted," Elias corrected. "Because if I'm just the 'I am'… then you don't need *this*." He gestured to his flesh. "You just need the spark. And sparks are cheap."

  Aris smiled, a thin, corporate expression. "That's why you signed the contract, Elias. You wanted to live forever."

  "I wanted to live," Elias said. "I'm not sure the thing in the void was living. It was just… true."

  He looked back at his hand. He tried to feel the Avicennian certainty, the knowledge that he existed without the hand. But now that he had the hand back, the certainty was gone. Now he knew he existed *because* he felt the hand. The sensory input had colonized the self.

  He was no longer the Flying Man. He was grounded. And for the first time, he feared the ground.

  "Can I go home?" Elias asked.

  "Technically, you never left," Aris said. "But sure. We'll need to run the reintegration tests tomorrow. We have to verify the memory buffers didn't corrupt the core self."

  "Tomorrow," Elias said.

  He walked out of the lab. The hallway was bright. The floor was hard under his feet. He focused on the pressure of his soles against the tile. He needed the friction. He needed the resistance.

  If he stopped feeling the floor, he was afraid he might float away again. And this time, he wasn't sure he'd want to come back.

  He reached the elevator and pressed the button. He watched his finger press the plastic.

  *I am,* he thought.

  But this time, he added a clause.

  *I am… here.*

  It was a weaker statement. It was contingent. It was fragile.

  It was human.

  And as the elevator doors opened, Elias stepped inside, holding onto the railing, gripping the metal until his knuckles turned white, anchoring himself to the world, terrified of the freedom of the void.
