  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. The screen goes dark. The coffee is stale. Immediate reaction to the video.
      *   **Round 1: The Initial Interpretation.**
          *   Alex: See? Pure default trust. No induction possible. Proof of Reid's principle.
