answer: |-
  **Setting:** *A seminar room, 5:30 PM. The projector is still humming, displaying a frozen frame of a 16-month-old pointing at a novel object after an experimenter labeled it. Coffee cups are scattered. Alex (Anti-Reductionist) is leaning forward; Sam (Local Reductionist) is capping a pen.*

  **Alex:** Okay, pause it right there. Look at the latency. The adult says "dax," the kid looks at the object, points, and accepts it. That's under two seconds. There is zero inductive history here. The experimenter walked in five minutes ago. By Humean standards, that child shouldn't believe *anything*. And yet, they do. That's Reid's Principle of Veracity in the wild. It's a basic source.

  **Sam:** It's a learning mechanism, Alex. I'm not denying they do it. I'm denying that what they're doing counts as *justified belief* in the epistemic sense. You're conflating a biological imperative with an epistemic entitlement.

  **Alex:** How can you separate them? If the biological imperative is the only way we ever acquire language, then the epistemic norm has to accommodate it. If the child *ought* not to believe without inductive grounds, but *cannot* acquire grounds without believing first, then your reductionism demands the impossible. It's a pragmatic contradiction.

  **Sam:** Elizabeth Fricker's local reductionism doesn't demand the impossible. It demands monitoring. And look, maybe the toddler *is* monitoring. Maybe they're tracking eye contact, tone, confidence cues.

  **Alex:** Come on. You saw the control condition. They accept it from the neutral face just as often as the warm one. They aren't tracking reliability cues yet. They're just… open. And that openness is what makes knowledge transmission possible. If you require positive reasons for every instance of testimony, where do the first reasons come from?

  **Sam:** That's the global reductionist trap, and I'm not falling into it. I don't need a *global* inductive argument that "Testimony is generally reliable." I just need local reasons in specific cases.

  **Alex:** But where do *those* local reasons come from? To know that this adult is reliable, you need to know they were reliable before. To know *that*, you needed testimony from someone else about their past. You're pushing the regress back. Eventually, you hit a wall where you have to accept testimony *without* prior inductive support. If you admit it for the ancestor, why not for the toddler?

  **Sam:** Because the ancestor has perception and memory! I can verify some testimony against my own perceptual experience. I can build a web of coherence.

  **Alex:** But your perceptual concepts come from testimony! You wouldn't know what a "cup" or a "red" is without someone telling you. Your perception is already theory-laden with testimonial content. So when you "check" testimony against perception, you're checking testimony against *other testimony* that you've forgotten is testimony. It's circular. You're using testimony to validate testimony.

  **Sam:** It's not viciously circular if it's a coherentist web. But let's pivot back to the video. Even if I grant you the regress problem for adults, does this toddler data actually help your case?

  **Alex:** Obviously. It shows the default setting is trust.

  **Sam:** Or it shows the default setting is *credulity*. There's a difference. Reid and Coady are talking about a rational entitlement—a right to believe. This kid? This is pre-rational. It's a sponge function. If I treat this as epistemic entitlement, I have to say the kid *knows* the word "dax." But if the kid has no concept of truth, no concept of error, no capacity to monitor for deception… in what sense is it knowledge?

  **Alex:** In the sense that they've successfully latched onto a fact conveyed by a speaker. You're imposing adult normative standards on a developmental process.

  **Sam:** I'm imposing *epistemic* standards. If testimony is a basic source of knowledge, like perception, it has to be truth-conducive. But if the mechanism is "believe everything indiscriminately," it's not truth-conducive, it's just intake. My point is: maybe the "default trust" you love isn't the mature epistemic entitlement Reid describes. Maybe it's a placeholder. A developmental scaffolding that gets torn down and replaced by actual monitoring once the prefrontal cortex catches up.

  **Alex:** So you're saying children don't *know* anything until they can doubt?

  **Sam:** I'm saying they *acquire* information, but they don't have *justification* until monitoring comes online. Your view makes the child a perfect knower by default. My view makes them a learner who isn't yet a full epistemic agent.

  **Alex:** But that creates a gap you can't bridge. If they spend the first three years of life just "acquiring" without "justifying," how do they switch? How do they suddenly start monitoring if all the raw material they have to monitor *with* was acquired uncritically? You've just pushed the circularity problem into development. You need reliable data to build a monitor, but you can't get reliable data without the monitor.

  **Sam:** Maybe the monitor isn't built on data. Maybe it's a cognitive module that matures. But here's the thing: if you call this toddler state "epistemic entitlement," you lose the ability to criticize it. If a toddler believes a lie because an adult told it, you have to say they were *entitled* to that belief.

  **Alex:** They were! They weren't negligent.

  **Sam:** But they weren't rational either. They were causally determined to accept it. I want to save the idea that knowledge requires some level of agency. Your view turns testimony into a causal pipe, not a reason-giving practice.

  **Alex:** And your view turns testimony into a second-class citizen compared to perception. You keep asking the testifier to show their ID. But look at the video again. The child doesn't ask for ID. The child succeeds. The word learning happens. If your theory says that successful learning isn't knowledge because the "monitoring" was too thin, then your theory is out of touch with the phenomenon.

  **Sam:** Or my theory suggests that "word learning" isn't the same as "testimonial knowledge." They learned the sound. They linked it to the object. But do they *know* the object is called that in a way that survives defeat? If I came in and said, "Actually, that's a 'fep'," would they hold their ground? No. They'd flip.

  **Alex:** Adults flip too! We update on new testimony.

  **Sam:** But we flip based on an assessment of *who* is speaking. The toddler flips based on recency. That's not testimony; that's associative learning.

  **Alex:** You're drawing a line in the sand and calling it "agency." I'm saying the line is arbitrary. The trust is the same; the background knowledge just gets richer. The entitlement is there from the start, otherwise, the first step is magic.

  **Sam:** And I'm saying the entitlement is earned as the capacity to monitor develops. The toddler data doesn't prove default *entitlement*; it proves default *dependence*.

  **Alex:** Dependence on what?

  **Sam:** On the speaker's benevolence, not the speaker's reliability. There's a difference.

  **Alex:** *(Pauses, looks at the frozen screen)* But if the benevolence is assumed without evidence… aren't we back to default trust?

  **Sam:** *(Sighs)* Maybe. Or maybe we're just describing a biological need and calling it epistemology to make ourselves feel better about the regress.

  **Alex:** *(Leans back)* And maybe we're describing a high-bar normative standard that no actual human, toddler or adult, ever actually meets.

  *(Silence settles over the table. The projector fan whirs.)*

  **Sam:** So, for your dissertation… do we code the toddler's point as "testimonial uptake" or "associative mapping"?

  **Alex:** If you code it as associative mapping, you can't explain why they look to the eyes for confirmation in the next phase.

  **Sam:** And if you code it as testimonial uptake, you have to explain why they don't check for lies until age four.

  **Alex:** *(Turns off the projector)* God. I need a drink.

  **Sam:** Yeah. But seriously. If I write that they lack entitlement, does that undermine the whole "social learning" chapter?

  **Alex:** And if I write that they have entitlement, does that undermine the "critical thinking" intervention?

  **Sam:** *(Stands up)* We're both right about the data. We're just fighting about whether to call it knowledge.

  **Alex:** Which is the only thing that matters.

  **Sam:** Which is the only thing that matters.

  *(They walk out, leaving the frozen image of the toddler's pointing finger in the dark.)*
