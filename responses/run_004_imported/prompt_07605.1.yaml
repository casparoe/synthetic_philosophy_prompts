answer: |-
  This passage comes from Jeremy Bentham's unpublished manuscript *Offences Against One's Self: Paederasty* (c. 1785). To understand what he is doing here, you have to look past the specific subject matter and look at the **engine** driving the argument. Bentham is not making a moral argument about the "goodness" of homosexuality; he is making a technical legal argument about the **economy of punishment.**

  Here is a walkthrough of the technical machinery of "mischief," how it applies to this passage, and whether his comparison to adultery holds up consistently within his own system.

  ### 1. The Machinery: Primary vs. Secondary Mischief

  This distinction is the backbone of Bentham's major work, *An Introduction to the Principles of Morals and Legislation* (1780). For Bentham, the law is a utilitarian tool. Pain (punishment) is an evil. Therefore, you should only inflict the evil of punishment if it prevents a greater evil (a crime).

  To determine if a crime exists, Bentham calculates the "mischief" (harm) of an act. He divides this into two categories:

  **A. Primary Mischief (The Direct Hit)**
  *   **Definition:** The immediate pain or loss suffered by the specific victim(s) of the act.
  *   **Examples:** In theft, it is the loss of property. In assault, it is physical pain. In rape, it is the violation and pain of the victim.
  *   **The Test:** Is there an assignable individual who is worse off because this happened?

  **B. Secondary Mischief (The Ripple Effect)**
  *   **Definition:** The consequences that spread to the rest of the community. Bentham further divides this into **Alarm** and **Danger**.
      *   **Alarm:** The fear produced in the community ("Could this happen to me?").
      *   **Danger:** The probability that the act will be repeated and cause more primary mischief elsewhere.
  *   **The Test:** Does this act make society less secure? Does it threaten the stability of institutions others rely on?

  **The Job It Is Doing Here:**
  In this passage, Bentham is running a "Groundlessness" test. He argues that punishment is **groundless** if there is no mischief.
  1.  **Primary:** He argues there is no victim. Both parties consent ("partners are both willing"). In fact, there is net pleasure. Therefore, Primary Mischief = 0 (or negative).
  2.  **Secondary:** He argues there is no public threat. Because it requires mutual consent, it is not "contagious" in a way that threatens non-participants. There is no "Alarm" because no one needs to fear being targeted. Therefore, Secondary Mischief = 0.
  3.  **Conclusion:** If Primary + Secondary Mischief = 0, then Punishment = Pure Evil (unnecessary pain). Therefore, the law must stay out of it.

  This is a proto-"Harm Principle" argument (later famousized by J.S. Mill), predating Mill by 70 years. Bentham is arguing that without demonstrable harm to others, the state has no utilitarian justification for intervention.

  ### 2. The Adultery Comparison: Consistency or Stacking the Deck?

  You asked if Bentham is "stacking the deck" by claiming adultery is worse (specifically citing illegitimate children) while exonerating consensual male sex.

  Within Bentham's specific utilitarian framework, **this is actually consistent,** though it relies on 18th-century sociological premises that we might now question. He is not applying two different moral rulers; he is applying the same "Mischief Calculator" to two different acts and getting different results based on **consequences**, not **sin.**

  Here is how the calculus works for Adultery in Bentham's view:

  **A. Primary Mischief in Adultery**
  *   **Deception/Breach of Contract:** Marriage, for Bentham, is a civil contract. Adultery involves deception against the spouse. This causes direct psychological pain and a breach of trust to an assignable victim (the spouse).
  *   **Comparison:** In the "paederasty" passage, Bentham emphasizes *consent*. In adultery, the spouse is a non-consenting third party to the sexual contract.

  **B. Secondary Mischief in Adultery (The "Illegitimate Kids" Argument)**
  *   **Economic Burden:** This is the crux of his argument. In 18th-century England, illegitimate children often became wards of the parish (state welfare). This creates a direct financial cost to the community (Secondary Mischief).
  *   **Lineage and Property:** Bentham was deeply concerned with property rights and inheritance. Illegitimate children muddied the waters of inheritance, creating legal disputes and social instability.
  *   **Institutional Stability:** Adultery threatens the institution of marriage, which Bentham viewed as a stabilizing social unit for raising children and managing property.

  **C. Primary/Secondary Mischief in "Paederasty" (His View)**
  *   **No Pregnancy:** No risk of illegitimate children. No economic burden on the state.
  *   **No Lineage Confusion:** No threat to inheritance laws.
  *   **No Deception:** Usually conducted privately between consenting parties without breaching a contract with a third party (assuming the men are not married to women who are being deceived, though Bentham largely treats the act in isolation).

  **Is he stacking the deck?**
  He is not logically inconsistent, but he is **prioritizing material consequences over emotional or moral ones.**
  *   If you argue he is stacking the deck, you would have to argue that he is *underestimating* the harm of adultery (perhaps viewing marriage as more property-based than love-based) or *overestimating* the social risk of illegitimacy.
  *    However, structurally, he is doing the exact same thing in both cases: **Counting the pain.**
      *   **Sodomy:** Pleasure + Pleasure - Pain = Net Good (or Neutral).
      *   **Adultery:** Pleasure + Pleasure - (Spouse's Pain + Economic Cost + Social Instability) = Net Negative.

  He is arguing that adultery has a higher "mischief score" than sodomy. Therefore, if the law is going to ban *anything* sexual, adultery has a stronger utilitarian case for prohibition than sodomy does. (Though, to be fair, Bentham was often skeptical of criminalizing adultery too, preferring civil remedies, but he definitely ranks it as more harmful than private consensual sodomy).

  ### 3. The Broader Argument Walkthrough

  To synthesize the whole argument of the essay based on this framework:

  1.  **The Premise:** Law exists solely to maximize happiness and minimize pain. Punishment is pain; therefore, it is only justified if it prevents greater pain.
  2.  **The Classification:** Acts are judged by their "Mischief" (Primary: direct victim; Secondary: societal alarm/danger).
  3.  **The Application to Sodomy:**
      *   *Consent:* Eliminates Primary Mischief (no victim).
      *   *Privacy/Nature:* Eliminates Secondary Mischief (no public danger, no alarm).
      *   *Result:* Criminalization is "groundless." It is punishing an act that produces pleasure without producing pain.
  4.  **The Application to Adultery (The Control Group):**
      *   *Deception:* Creates Primary Mischief (hurt spouse).
      *   *Progeny:* Creates Secondary Mischief (economic cost to society, inheritance confusion).
      *   *Result:* Adultery has a higher mischief score. It is more "expensive" to society.
  5.  **The Conclusion:** It is irrational and cruel to punish an act with zero mischief (sodomy) while tolerating or treating more lightly an act with demonstrable mischief (adultery), especially when the punishment for sodomy (often death or pillory at the time) is vastly disproportionate to the "offense."

  ### Summary

  Bentham is using **Primary and Secondary Mischief** as a filter to strip away religious or "natural law" arguments. He doesn't care if the act is "unnatural"; he cares if it is "unprofitable" (in terms of pain/pleasure).

  *   **Primary Mischief** asks: "Who got hurt?" (Answer: No one in consensual sodomy).
  *   **Secondary Mischief** asks: "Is society less safe?" (Answer: No, unlike adultery, this doesn't create bastards or break contracts).

  He isn't stacking the deck to get a pro-gay conclusion; he is stacking the deck **against moralism.** He forces the law to justify itself through material consequences. If you accept his premise that "illegitimate children are a social cost" and "consent negates harm," his conclusion that sodomy is less criminal than adultery is the only logical outcome his system allows. It is a cold, economic calculus, but it is applied consistently.
