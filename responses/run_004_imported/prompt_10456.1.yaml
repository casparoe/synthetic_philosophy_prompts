answer: |-
  This is a classic move in those circles. Once someone pulls the "it's just a verbal dispute about boundary drawing" card, the conversation usually dies, because it's a conversation-ender disguised as profundity. But you're right to push back. The claim that personal identity is *merely* verbal rests on a specific metaphysical commitment—Perdurantism (4Dism)—which is treated as the default "rationalist" position largely because David Lewis bullied everyone else into submission in the 80s and 90s.

  Lewis's argument from Temporary Intrinsics is the heavy artillery here. It's elegant, it's logical, and it's wrong (or at least, far too costly). The claim that Endurantism requires "desperate patches" while Perdurantism dissolves the problem "for free" is a sales pitch, not a proof. Lewis charges the Endurantist an ontological tax for modifying instantiation, but he ignores the massive mortgage he's taking out on reality by chopping objects into time-slices.

  Here is the case for why adverbializing instantiation is legitimate, non-ad-hoc, and ontologically cheaper than Lewis's worm theory.

  ### 1. The "Mystery" of Adverbialism is the Nature of Time Itself

  Lewis's main charge against the Endurantist solution (specifically the adverbialist version, where an object instantiates a property *t-ly*) is that it turns instantiation into a "mysterious primitive." He argues that we know what it means to *have* a property, but "having-it-at-t" is obscure.

  This is a bait-and-switch. Lewis is treating *simpliciter* instantiation as the baseline and time-indexed instantiation as the deviation. But we do not live in a timeless logical space. We live in time.

  Consider spatial location. I am wholly present in my kitchen and wholly present in my living room (at different times, obviously, but bear with me). If I say, "I am in the kitchen," no one demands to know which *spatial part* of me is there. We understand that location is a relation between the whole object and a place. Why is time different?

  The adverbialist argues that the copula ("is" or "has") is implicitly indexical. To say "The poker is hot" is elliptical for "The poker is hot *now*." Lewis insists this turns intrinsic properties (hotness) into relations (hotness-to-t). The adverbialist counters: No, the *instantiation* is what's modified, not the property.

  Think of it this way: Is "existence" a property? Kant said no. Similarly, "temporal location" isn't a property of the object; it's a mode of the object's presence. To say I instantiate bentness *t-ly* isn't adding a mysterious relation; it's acknowledging that **to be is to be in time.**

  Lewis treats *simpliciter* instantiation as the natural kind. But in a temporal world, *simpliciter* instantiation is the abstraction. You never encounter an object that "just has" properties without a temporal context. By demanding the Endurantist explain the "t-ly" modifier, Lewis is demanding we explain why reality is temporal. That's not a bug of Endurantism; that's the feature of the universe. Perdurantism doesn't solve this; it just hides it inside the geometry of the spacetime worm.

  ### 2. The Ontological Cost: "Nothing Was Ever Wholly There"

  Lewis claims Perdurantism is parsimonious. It's not. It's ontologically inflationary in the extreme.

  If Perdurantism is true, you have never met a person. You have never touched a table. You have never been wholly present to your own children. You are a 4D worm, and at any given nanosecond, only a infinitesimal slice of you exists. The "you" reading this sentence is a distinct entity from the "you" who started reading this paragraph, linked only by genetic and causal continuity.

  This violates the phenomenological data. We experience ourselves as enduring substances. We experience *change*, not *variation across parts*. When I stand up, *I* change from bent to straight. I do not observe a bent temporal part and a straight temporal part; I experience the transition.

  Lewis asks us to accept this massive error theory about our own existence to save a logical constraint on properties. He essentially says: "To avoid a contradiction in logic, you must admit that you don't actually exist in the present moment."

  The Endurantist price is admitting that instantiation is time-indexed. The Perdurantist price is admitting that **persistence is an illusion.** Which is the bigger bullet to bite?

  Adverbialism preserves the intuition that *I* am the thing acting, thinking, and suffering. Perdurantism turns "I" into a collective noun for a stack of momentary selves. If we are weighing "primitives," the primitive "instantiates-t-ly" is far cheaper than the primitive "genidentity across temporal parts."

  ### 3. The Rotating Homogeneous Disc: A Boomerang for Perdurantists

  You mentioned the rotating disc worry, and it is excellent ammunition. It shows that Perdurantism has its own "mysterious primitives" it needs to smuggle in to make sense of basic physics.

  Imagine a perfectly homogeneous disc. No markings, no variations in density.
  *   **Scenario A:** The disc is stationary.
  *   **Scenario B:** The disc is rotating.

  In a Perdurantist 4D block universe, both scenarios look identical. The spacetime worm is a cylinder. Every temporal slice is a perfect circle. There is no difference in the distribution of matter across the temporal parts. If the disc is homogeneous, slice *t1* is identical to slice *t2*.

  So, what grounds the fact that it is *rotating* in Scenario B?
  To distinguish rotation from stasis, the Perdurantist must appeal to something *outside* the mere arrangement of temporal parts. They usually need to posit a primitive "vector field" or a primitive relation of "genidentity" that tracks which part of slice *t1* corresponds to which part of slice *t2*. They need a primitive of **persistence across time** to ground the dynamical fact.

  But wait. If the Perdurantist is allowed to posit a primitive relation to ground dynamical facts (rotation) across temporal parts, why is the Endurantist forbidden from positing a primitive mode of instantiation to ground qualitative facts (bentness) across time?

  Lewis argues that Endurantism needs a primitive to explain how one thing has incompatible properties. But Perdurantism needs a primitive to explain how a stack of identical slices constitutes a rotating object rather than a static one.

  If the Perdurantist says, "Rotation is just a pattern across parts," they are lying about the homogeneous disc. There is no pattern difference. They must admit that *dynamism* is a further fact. Once they admit that, the game is up. The Endurantist simply says: "Exactly. Dynamism is a further fact about how the whole object relates to time. We call that 'adverbial instantiation.' You call it 'vector fields across parts.' We both have a primitive. Mine preserves the object; yours dissolves it."

  ### 4. The "Verbal Dispute" Dodge

  Finally, back to your friend group's LessWrong line: that this is just a verbal dispute about how to draw boundaries.

  If metaphysics is supposed to "carve reality at the joints," then the joint is whether causation and responsibility flow through a single enduring substance or a chain of distinct temporal entities.

  If I am a worm, then punishing "me" for a crime committed by a past temporal part is technically punishing a distinct entity (just one causally linked). If I am an endurer, I am literally the same substance. This isn't just semantics; it drives how we model moral responsibility, survival, and anticipation.

  When a LW rationalist says "it's just a verbal dispute," they are usually signaling that they have adopted the Perdurantist ontology as a background assumption and are refusing to defend it. They treat the 4D view as the "scientific" view because it fits nicely with relativity, and then act like the 3D view is superstition.

  But Endurantism is compatible with relativity (you can be wholly present at a point on a worldline without violating physics). The resistance is purely metaphysical preference.

  ### The Bottom Line

  Lewis's argument from Temporary Intrinsics is a logical trap, but it's a trap built on the assumption that *properties* are more fundamental than *existence*.

  Adverbialism isn't a desperate patch. It is the recognition that in a temporal world, instantiation is inherently temporal. To demand that an object have properties *simpliciter* is to demand that it exist outside of time.

  *   **Lewis's Cost:** You must deny that you are ever wholly present. You must treat your own consciousness as a series of distinct flashes. You need extra primitives to ground dynamism (rotation).
  *   **Endurantist Cost:** You must accept that the "is" of predication is time-indexed.

  The Endurantist cost is linguistic/logical. The Perdurantist cost is ontological/existential. Lewis asks us to sacrifice the reality of the persisting self to save the simplicity of predicate logic. That is a bad trade.

  Tell your group that if they want to claim personal identity is "just words," they first have to pay the bill for the 4D ontology that makes that claim plausible. And that bill is high enough that "t-ly instantiation" looks like a bargain.
