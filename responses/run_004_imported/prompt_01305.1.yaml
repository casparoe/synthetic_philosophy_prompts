prompt: |-
  My team has spent two separate meetings arguing about something we can't resolve, and I'd like an outside perspective. We shipped a feed-ranking feature built entirely from weighted heuristics and hand-tuned rules based on click history — no neural networks, no training loop, nothing that updates itself after deployment. Nobody disputes any of that; everyone agrees on exactly what the system does and how it was built. What we can't agree on is whether we're allowed to call it "AI" in our documentation and marketing. Half the team says yes: it's an automated system doing something that used to require human judgment, and that's how competitors describe comparable features. The other half says no: "real" AI requires machine learning, in their view, and calling this AI is closer to false advertising. It's not just a matter of pride, either — our legal team recently introduced a mandatory review process for anything labeled "AI," so the label carries real downstream consequences. We've compared outside definitions, dictionary entries, even a couple of industry white papers, and nobody has budged. Is one side simply right and the other confused, or is something else going on here?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Core Conflict:** The team is divided on whether to label a heuristic-based feed-ranking system as "AI."
      *   **The System:** Weighted heuristics, hand-tuned rules, based on click history. No ML, no neural nets, no self-updating post-deployment.
      *   **The Arguments:**
          *   *Team Yes:* It's automated, replaces human judgment, competitors do it, functional definition of AI.
          *   *Team No:* "Real" AI needs ML/learning, calling it AI is false advertising/misleading.
      *   **The Stakes:** Legal review process triggered by the "AI" label. Documentation and marketing implications.
      *   **Current State:** Two meetings, no resolution, definitions checked but didn't help.
      *   **The Question:** Is one side right/confused, or is something else going on?

  2.  **Evaluate the "Is it AI?" Question:**
      *   *Technical Definition:* Historically, "Good Old Fashioned AI" (GOFAI) included rule-based systems. However, in the current market context (2020s), "AI" almost universally implies Machine Learning (ML) or Deep Learning (DL), specifically adaptive systems.
      *   *Marketing/Consumer Perception:* When consumers see "AI," they expect personalization, adaptation, and "smart" behavior that improves over time. A static heuristic system might disappoint these expectations.
      *   *Legal/Compliance:* The prompt mentions a mandatory legal review for "AI." This suggests regulatory scrutiny (e.g., EU AI Act, FTC guidelines). Mislabeling could lead to compliance issues or claims of deception.
      *   *Competitor Landscape:* Competitors might be using "AI" loosely (AI washing), but that doesn't make it accurate or safe.

  3.  **Identify the Underlying Dynamics (The "Something Else"):**
      *   It's not just a semantic debate. It's a clash of *incentives* and *risk profiles*.
      *   *Marketing/Product:* Wants the hype, the buzzword, the perceived value.
      *   *Engineering/Legal:* Wants accuracy, risk mitigation, technical integrity.
      *   *The "AI" Label:* It's a Rorschach test. It means "magic" to users, "liability" to legal, and "buzzword" to marketing.

  4.  **Formulate the Advice:**
      *   **Direct Answer:** Neither side is objectively "right" in a vacuum, but the "No" side has stronger ground regarding current market expectations and legal risk. However, framing it as "who is right" is the trap.
      *   **Reframe the Problem:** Move from "Is this AI?" to "What value does the label provide vs. what risk does it introduce?"
      *   **Analyze the Risks:**
          *   *AI Washing:* Regulators (FTC, EU) are cracking down on overclaiming AI capabilities.
          *   *User Expectations:* If users expect it to learn and it doesn't, trust erodes.
          *   *Legal Burden:* The mandatory review is a bottleneck. Is the label worth the delay?
      *   **Analyze the Benefits:**
          *   *SEO/Discovery:* "AI" gets clicks.
          *   *Perceived Value:* Investors/Customers might value it higher.
      *   **Propose a Compromise/Solution:**
          *   Use precise language ("Smart Ranking," "Algorithmic Feed").
          *   If "AI" must be used, qualify it heavily.
          *   Focus on the *outcome* (personalization) rather than the *technology* (AI).
      *   **Address the Team Dynamic:** Acknowledge that both sides have valid points (Marketing vs. Engineering/Legal) and need to align on business goals.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the frustration. This is a common industry problem.
      *   *The Technical Truth:* Acknowledge that historically, rule-based systems *were* AI, but the goalposts have moved.
      *   *The Market Truth:* "AI" now implies ML/Adaptivity. Using it for heuristics is "AI Washing."
      *   *The Risk:* Highlight the legal/regulatory angle (FTC, EU AI Act). This is crucial given the prompt mentions legal review.
      *   *The Real Conflict:* It's not semantics; it's Risk vs. Hype.
      *   *Recommendation:* Don't call it AI. Use functional descriptions. If you must, qualify it.
      *   *Actionable Steps:* specific phrasing suggestions, stakeholder alignment.

  6.  **Refining the Tone:**
      *   Needs to be neutral but decisive.
      *   Avoid taking sides personally, but take a side on the *best practice*.
      *   Show empathy for both the marketing desire (visibility) and engineering integrity (accuracy).

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, did I address the "competitors do it" argument?* Yes, need to mention that "AI Washing" is a race to the bottom and regulators are noticing.
      *   *Did I address the legal review?* Yes, emphasize that the legal team's friction is a signal, not just bureaucracy.
      *   *Is the definition clear?* Make sure to distinguish between "Automation" and "Intelligence/Adaptivity."

  8.  **Final Output Structure:**
      *   Executive Summary (Neither side is "confused," but the context has shifted).
      *   The Semantic Shift (GOFAI vs. Modern AI).
      *   The Risk Assessment (Regulatory & Trust).
      *   The Underlying Conflict (Incentives).
      *   Recommended Path Forward (Specific language, decision framework).

