answer: |-
  This is a classic case of **semantic drift colliding with regulatory reality.** Neither side of your team is "confused," but they are arguing from different time periods and different incentive structures.

  Here is the outside perspective you need to break the deadlock.

  ### 1. The Technical Truth: The Goalposts Have Moved
  Technically, your "Yes" team is historically correct. In the 1970s and 80s, expert systems and rule-based heuristics *were* considered Artificial Intelligence (often called GOFAI: Good Old-Fashioned AI). If you were writing a computer science textbook from 1985, you could label this AI.

  However, your "No" team is currently correct. In the 2020s market context, the definition of "AI" has narrowed in the public and regulatory consciousness to imply **adaptivity and probabilistic inference** (Machine Learning/Deep Learning).
  *   **Expectation:** When a user sees "AI," they expect the system to learn from new data, generalize to unseen scenarios, and improve over time.
  *   **Reality:** Your system is static. It does not learn post-deployment. It is automation, not intelligence.

  If you ship a static heuristic system labeled as "AI," you are engaging in **"AI Washing."** This is the software equivalent of "greenwashing." While competitors may be doing it, regulators (like the FTC in the US and the EU Commission under the AI Act) are actively scrutinizing claims that overstate a system's autonomy or capability.

  ### 2. The Real Conflict: Incentives, Not Definitions
  You aren't actually arguing about dictionary definitions. You are arguing about **Risk vs. Hype.**

  *   **The "Yes" Camp (Product/Marketing):** Their incentive is adoption and perceived value. "AI" is a high-value keyword that drives clicks, investor interest, and user curiosity. They see the label as a feature enhancer.
  *   **The "No" Camp (Engineering/Legal):** Their incentive is accuracy and liability mitigation. They know that if a user asks, "Why did this show up?" and the answer is "Because of a static rule," but the marketing said "AI," that is a trust violation. They also know the legal review process is a bottleneck they want to avoid unless necessary.

  The fact that your Legal team introduced a **mandatory review process** for the "AI" label is the most important signal here. Legal does not create friction for fun. They create friction where they see liability. If Legal is flagging the term, using it will slow down your release cycle and invite scrutiny.

  ### 3. The Recommendation
  **Do not call it "AI."**

  Here is why, and how to resolve the team dispute:

  **A. The Trust Cost Outweighs the Hype**
  If you market this as AI, users will expect it to adapt to their changing preferences. When they realize the feed doesn't actually "learn" (it just follows the hand-tuned rules), churn increases. It is better to under-promise and over-deliver than to market a static system as adaptive.

  **B. Regulatory Risk is Rising**
  The EU AI Act and recent FTC guidance focus on transparency. If you label a heuristic system as AI, you may be required to disclose risk assessments or compliance documentation that a simple rule-based engine doesn't actually need—*unless* you claim it's AI, at which point you might trigger requirements you can't meet (e.g., explaining how a model was trained, when there was no training).

  **C. Better Language Exists**
  You can achieve the marketing value without the technical inaccuracy. Use functional descriptions that imply sophistication without claiming adaptivity.
  *   *Instead of:* "AI-Powered Feed"
  *   *Try:* "Smart Ranking," "Algorithmic Feed," "Personalized Sorting," or "Rule-Based Curation."

  ### 4. How to Resolve the Meeting
  Stop trying to define "AI." You will never agree on a definition because the word is now a marketing buzzword, not a technical specification. Instead, change the decision criteria to **Business Impact.**

  Propose this framework to your team:

  1.  **The "FTC Test":** If a regulator asked us to prove how our "AI" learns and adapts, could we? (The answer is no).
  2.  **The "Legal Tax":** Are we willing to accept the mandatory legal review delay and the potential compliance burden for the sake of this specific word?
  3.  **The "User Promise":** Does the word "AI" set an expectation of self-improvement that we cannot fulfill?

  **The Compromise:**
  Agree to market the *outcome*, not the *engine*.
  *   **Wrong:** "Our new AI ranks your feed."
  *   **Right:** "Our new ranking engine optimizes your feed based on click history."

  This satisfies Marketing (it sounds technical and beneficial), satisfies Engineering (it is accurate), and satisfies Legal (it avoids the triggered review process and regulatory risk).

  **Summary:** Your "No" team is right about the current market and legal landscape. Your "Yes" team is right about the historical definition and the desire for hype. **Prioritize the current landscape.** Call it "Algorithmic" or "Smart," save the "AI" label for when you actually implement a learning loop, and avoid the regulatory headache.
