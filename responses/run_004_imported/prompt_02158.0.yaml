      *   **Address the "Causation" Question:** Nuance the idea of "causing." Silence doesn't start the fire, but it lets it burn.
      *   **Address the "30 Others" Argument:** Explain why the user is held to a different standard (friendship) without dismissing the responsibility of the others.
