      *   **The "Bystander Effect":** Psychological phenomenon where individuals are less likely to offer help to a victim when other people are present. The user is invoking this ("30 others were silent").
      *   **Relationship Duty:** The user is a "closest friend." This adds a layer of specific obligation beyond general social duty.
      *   **Social Norms & Signaling:** Silence in a group chat can be interpreted as agreement or indifference. It normalizes the behavior.
