answer: |-
  You are right to be suspicious. The conflation of Goodhart's Law and Campbell's Law in rationalist and AI-safety circles is a case study in how a high-fidelity insight degrades into a meme. The pithy Strathern quote ("When a measure becomes a target...") has acted as a semantic black hole, swallowing the distinct technical nuances of both original formulations.

  To answer your request directly: **No, they do not describe a single underlying mechanism.** While they predict the same outcome (the failure of a metric), they posit different causal pathways and, crucially, different normative implications. Goodhart's original formulation is an **econometric warning about model instability**, whereas Campbell's is a **sociological warning about institutional decay**.

  Here is the breakdown using the original texts and Garrabrant's taxonomy.

  ### 1. The Original Formulations

  **Goodhart's Law (1975)**
  *   **Source:** Charles Goodhart, *"Problems of Monetary Management: The UK Experience."*
  *   **Formulation:** "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."
  *   **Context:** Monetary policy. Goodhart was arguing against the Bank of England targeting specific monetary aggregates (like £M3).
  *   **Mechanism:** The **Lucas Critique**. Goodhart's point was that economic agents have rational expectations. If the Central Bank targets a variable, agents will alter their behavior to accommodate or exploit that target, thereby changing the structural parameters of the economy. The correlation between the aggregate and the goal (e.g., inflation control) breaks because the *structure* of the system has shifted.
  *   **Key Feature:** It is fundamentally about **predictive failure**. The map stops matching the territory.

  **Campbell's Law (1976)**
  *   **Source:** Donald Campbell, *"Assessing the Impact of Planned Social Change."*
  *   **Formulation:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."
  *   **Context:** Social indicators, education policy, bureaucracy.
  *   **Mechanism:** **Incentive Corruption.** Campbell focused on human agents within a bureaucracy who, facing high-stakes decisions based on metrics, will actively game the system.
  *   **Key Feature:** It is fundamentally about **normative harm**. The territory is actively damaged by the map.

  ### 2. Mapping to Garrabrant's Taxonomy

  Scott Garrabrant's four types of Goodhart (Regressional, Causal, Extremal, Adversarial) provide the precision needed to separate these laws.

  **Campbell's Law is Strictly Adversarial**
  Campbell's formulation explicitly cites "corruption pressures." This requires an agent with intent to bypass the spirit of the metric while satisfying the letter.
  *   **Bucket:** **Adversarial Goodhart.**
  *   **Why:** The mechanism relies on an agent (teacher, bureaucrat, bank manager) optimizing the proxy *against* the goal. Campbell's specific worry is that this optimization actively *harms* the goal ("distort and corrupt the social processes").
  *   **Limitation:** Campbell's Law does not account for metrics that fail due to non-agent reasons (e.g., a physical sensor drifting, or a correlation breaking due to natural limits). It is specific to human systems.

  **Goodhart's Law is Structural (Extremal/Causal) *enabled* by Adversarial Dynamics**
  This is where the confusion lies. Goodhart's *example* (banks reacting to policy) is adversarial. However, his *Law* ("Any observed statistical regularity...") is broader. It describes the collapse of a correlation under optimization pressure, regardless of whether that pressure is applied by a malicious agent or a blunt policy tool.
  *   **Bucket:** Primarily **Extremal** and **Causal**, often instantiated via **Adversarial** means.
  *   **Why:** Goodhart's insight is that the *statistical relationship itself* is conditional on the policy regime. When you optimize, you move the system into a new regime (Extremal). The correlation held in the "natural" distribution, but breaks in the "controlled" distribution.
  *   **Distinction:** Goodhart's Law allows for the metric to fail *without* corruption. For example, if you optimize a drug dosage based on a biomarker, you might hit a physiological limit where the biomarker no longer predicts health (Extremal). No one is "gaming" this; the biology just breaks. Campbell's Law would not apply here; Goodhart's would.

  ### 3. The Core Divergence: Epistemic vs. Normative

  The most significant difference is not just the mechanism, but the *warning* being issued.

  *   **Goodhart is Epistemic:** It warns the **controller**. "If you target this, you will not achieve your goal because your model is invalid." The tragedy is **inefficacy**. You tried to steer the ship, but the rudder broke.
  *   **Campbell is Normative:** It warns the **society**. "If you target this, you will destroy the thing you value." The tragedy is **decay**. You didn't just fail to steer the ship; you drilled holes in the hull to make the speedometer look better.

  You can have Goodhart without Campbell. (Example: A thermostat optimizing temperature based on a faulty sensor reading. The metric decouples, but no corruption occurs.)
  You can arguably have Campbell without Goodhart (in the short term). (Example: Teachers cheating on tests. The metric *looks* like it's working—the scores go up—but the social process is rotting. The "collapse of the statistical regularity" might be delayed until the cheating is exposed, but the "corruption of the social process" happens immediately.)

  ### 4. The Verdict

  **Goodhart's Law and Campbell's Law describe genuinely different mechanisms.**

  1.  **Mechanism:** Goodhart describes **Model Instability** (the relationship between proxy and goal is conditional on the policy regime). Campbell describes **Incentive Corruption** (agents actively degrade the goal to satisfy the proxy).
  2.  **Garrabrant Classification:** Campbell's Law is a subset of **Adversarial Goodhart**. Goodhart's Law is the **Umbrella Phenomenon** that encompasses Adversarial, but also Causal and Extremal failures.
  3.  **Teleology:** Goodhart predicts **Failure of Control**. Campbell predicts **Corruption of System**.

  **Why the Conflation Matters**
  Treating them as identical leads to category errors in policy and AI safety.
  *   If you treat a **Campbell** problem (corruption) as a **Goodhart** problem (model instability), you might try to fix it by finding a better proxy (e.g., "Let's measure critical thinking instead of test scores"). This fails because the agents will just game the new metric too. The solution to Campbell's Law is often *decreasing* the stakes or *removing* the metric, not optimizing it.
  *   If you treat a **Goodhart** problem (structural break) as a **Campbell** problem (corruption), you might punish agents for "gaming" when they are simply reacting rationally to a broken model. The solution to Goodhart's Law is often *robust control theory* or *uncertainty modeling*, not anti-corruption measures.

  **Final Conclusion**
  Your intuition is correct. The rationalist community has collapsed Campbell's specific sociological insight into Goodhart's broader econometric principle, likely because Strathern's pithy summary applies to both. But Campbell's Law carries a specific charge of **moral hazard and institutional rot** that Goodhart's original technical formulation lacks. Campbell is about the *enemy within*; Goodhart is about the *fragility of the map*. They are cousins, not twins.
