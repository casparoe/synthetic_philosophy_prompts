  3.  **Deconstruct the Philosophy/Decision Theory Side (Pasadena Game):**
      *   *The Game:* Toss a coin until heads. If heads on toss $n$, payoff is $(-1)^{n+1} \frac{2^n}{n}$. Probability is $1/2^n$.
      *   *Expected Value:* $E = \sum_{n=1}^{\infty} \frac{1}{2^n} \times (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$.
      *   *The Series:* This is the alternating harmonic series, which converges conditionally to $\ln(2)$.
      *   *The Paradox:* Riemann Rearrangement Theorem says conditionally convergent series can be rearranged to sum to *any* real number. Since expected value is defined as a sum over outcomes, and outcomes don't have an inherent "order" in the probability space (unlike time), the value seems undefined.
      *   *User's Proposal:* Sum in the order the tosses occur ($n=1, 2, 3...$).

