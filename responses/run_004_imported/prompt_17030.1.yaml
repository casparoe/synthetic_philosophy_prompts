          *   Solution: Bad Faith (*mauvaise foi*). Consciousness is one. It knows what it knows, but on a non-positional level. I know I'm cowardly, but I don't *posit* that knowledge thematically. I flee what I am. I am facticity (what I am) and transcendence (what I am not yet). Bad faith is lying to oneself without a liar distinct from the lied-to.
      *   **Freud (Elena):**
          *   Defense of the Unconscious: It's not a homunculus inside the head. It's a system of forces, energies, cathected ideas.
          *   The Censor: Not a little man, but a function of resistance at the boundary of systems (Ucs. to Pcs./Cs.).
          *   Knowing: The unconscious "knows" in terms of energy charge and association, not thematic awareness. The paradox Sartre poses relies on a Cartesian view of consciousness that Freud rejects. The mind *is* divided. Sartre's unity is the illusion.
          *   Counter to Sartre: If consciousness is one, how does it sustain the lie without cracking? Bad faith requires a complicity that looks suspiciously like the split Sartre denies.

