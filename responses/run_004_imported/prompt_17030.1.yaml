      *   **Specific Constraint 1:** No "Freud says unconscious, Sartre says freedom" caricatures. Needs nuanced understanding of the specific arguments (Sartre's critique of the censor, Freud's potential defense, Sartre's non-positional knowledge).
      *   **Specific Constraint 2:** Real dialogue, back-and-forth, answering specific objections, not parallel monologues.
      *   **Specific Constraint 3:** Stay down in the mechanics (the censor, unity of consciousness, what "knowing" means).
