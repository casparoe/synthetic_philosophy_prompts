answer: |-
  The air in the briefing room smelled of recycled ozone and stale coffee. Commander Vance stared at the holographic table, where two distinct translation manuals floated side-by-side. Manual Alpha glowed blue; Manual Beta glowed amber.

  "They both fit the data?" Vance asked, his voice rough with sleeplessness.

  "Perfectly," said Elara, the lead xenolinguist. She tapped the table, bringing up a log of the last three months of contact with the Krell. "Every gesture, every vocalization, every behavioral response the Krell have given us is accounted for by both manuals. There is no discrepancy in the evidence."

  Kael, sitting opposite her, crossed his arms. "But there is a discrepancy in the ontology. That's the problem, Commander. Manual Alpha translates the Krell word *'Vax'* as 'physical territory.' Manual Beta translates *'Vax'* as 'the population inhabiting the territory.' Both translations predict exactly the same behavior during peaceful interaction. When a Krell points to a hill and says *'Vax,'* Alpha says he means the dirt. Beta says he means the people living on the dirt. Since the people are always on the dirt, the behavioral evidence is identical."

  Vance rubbed his temples. "Quine's indeterminacy of translation. I read the briefing. You're telling me there is no fact of the matter?"

  "There is no fact of the matter accessible to us, sir," Elara said softly. "Not even in principle. We could dissect their brains, map their neurons, but that just pushes the question back. Do those neurons fire for 'land' or for 'people on land'? Their internal physics might not distinguish the two the way we do. We have two dictionaries. Both are internally consistent. Both match every observable stimulus. But they are mutually incompatible."

  The stakes hung heavy in the room. The Krell had just transmitted a final ultimatum regarding the border dispute on Sector 4. The message was short: *"Surrender the Vax, or there is war."*

  "If we follow Alpha," Kael said, "we withdraw our military from the sector. We leave the civilian colonies behind. We give them the land."

  "If we follow Beta," Elara countered, "we evacuate the people. We leave the infrastructure behind. We give them the population."

  "And if we guess wrong?" Vance asked.

  "Then we violate the treaty terms immediately," Elara said. "If they meant the people and we give them the land, we've left our citizens in their hands as spoils of war. If they meant the land and we give them the people, we've abandoned our sovereign territory without cause. Either way, it's casus belli."

  Vance looked at the hologram of the Krell ambassador. The creature stood still, its multifaceted eyes reflecting the station lights. There was no clue there. No micro-expression to hint at whether it valued soil or breath more. The behavioral data was saturated; there was nothing left to observe.

  "Is there a way to ask for clarification?" Vance asked.

  "We did," Kael said. "We asked, 'Do you mean the ground or the settlers?' Their response was *'Vax.'* It loops back. The concept might be fused in their cognition. To them, asking the difference might be like asking 'Do you mean the water or the wetness?'"

  Vance stood up. The clock on the wall ticked loudly. They had ten minutes before the transmission window closed.

  "I can't authorize a guess that costs lives," Vance said.

  "You have to," Elara said. "This is the radical translation problem, Commander. We want there to be a right answer hidden somewhere. We want to believe that if we just looked harder, we'd find the 'true' meaning. But Quine's point is that meaning isn't a hidden object. It's a mapping we impose. We have to choose a manual. Neither is true. Neither is false. They are just tools."

  Vance looked at the two glowing manuals. Blue for land. Amber for people.

  "If we choose Alpha," Vance said, "we save the people, lose the resources."

  "If we choose Beta," Kael said, "we save the resources, lose the people."

  "The evidence doesn't favor either," Elara reminded him. "You're not discovering their intent. You're assigning it."

  Vance closed his eyes. He thought of the families in the colonies. He thought of the strategic value of the mining rigs. He thought about how, in a few minutes, he would define the reality of the Krell language simply by acting. There was no truth waiting to be found, only a decision to be made.

  "Prepare the evacuation order," Vance said finally. "We'll follow Manual Beta. We give them the people."

  "Sir," Kael warned, "if Alpha is the 'correct' mapping—"

  "There is no correct mapping, Kael," Vance snapped. "There's only the outcome. Send the message."

  Elara watched as Vance authorized the transmission. She looked back at the hologram of the Krell ambassador. It hadn't moved. It never would move in a way that solved this. The ambiguity wasn't a puzzle to be solved; it was the foundation they were standing on.

  She closed her laptop. The file remained open on her screen, the two manuals sitting side-by-side, equally perfect, equally unknowable. They would never know if they had surrendered the dirt or the souls. They would only know if the guns stayed silent.
