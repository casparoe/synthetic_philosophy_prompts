answer: |-
  **Setting:** *A university coffee shop. Three mugs sit on the table: one for the Biologist (who has just posed the problem), one for Elena (Etiological Theorist), and one for Marcus (Causal-Role Theorist). The Biologist has stepped away to get a refill.*

  **Marcus:** Look, this is straightforward. The rabbit has a thick coat. The coat traps heat. That thermal retention contributed to the rabbit's survival capacity during the winter. Therefore, the function of the coat is insulation. It's like a subroutine in a legacy codebase. You don't need to know who wrote it or why to know what it *does* in the current build.

  **Elena:** But biology isn't just a static codebase, Marcus. It's a version control history. Your "subroutine" is a random commit that hasn't been merged yet. On the etiological view, a function is a *selected effect*. This coat thickening is a mutation. It has no history of selection. It hasn't been selected *for* anything yet. It just *did* something.

  **Marcus:** You're conflating "function" with "evolutionary success story." If I have a heart, its function is to pump blood. If I have a mutant heart that pumps blood *better* in high altitude, its function is still pumping blood, but it performs that function better. In this rabbit, the thick coat is performing the function of insulation. The fact that it's new doesn't stop it from contributing to the system's capacity to survive cold.

  **Elena:** No, you're conflating "causal contribution" with "proper function." A brick can function as a doorstop. But the brick's *function* isn't to stop doors; that's just what it's being used for. In this rabbit, the thick coat is a brick. It happened to stop the door of death. But until natural selection recruits that trait—until the trait exists *because* it insulated ancestors—it's just an effect. Right now, in this individual? It has no function. It's an accident with beneficial consequences.

  **Marcus:** That leads to a metaphysical absurdity. You're telling me the physiological reality of this rabbit's fur changes based on what its great-grandchildren do? If this trait spreads, does the fur suddenly *become* insulating in retrospect? If it vanishes, was it never insulating? That makes function a magical property determined by prophecy, not by current biological organization.

  **Elena:** Not prophecy. History. And yes, my verdict *does* depend on the future, because function is a historical category. If this trait spreads and becomes fixed because of the insulation, then in the descendants, the coat has the function of insulation. In this rabbit? It's a proto-function. If the trait vanishes next generation—say, a fox eats this rabbit's offspring despite the warm coat—then the trait was never selected. It remains a mere causal effect. The status of the trait is determined by whether it enters the lineage's history of selection.

  **Marcus:** But the Biologist asked about *this* rabbit. *Right now.* If I'm explaining why this rabbit survived, I cite the insulation. If I'm analyzing the rabbit's thermoregulatory system, I cite the insulation. If I say, "Well, actually, the coat has no function yet," I haven't explained the system's capacity. I've just added a historical asterisk that does no explanatory work for the current organism.

  **Elena:** It does explanatory work! It distinguishes between why the trait is *there* versus what the trait *does*. The trait is there because of a mutation. It does insulation. But "function" explains the presence of the trait in the population. Since the trait isn't in the population yet, attributing a function is premature. You're describing a capacity, Marcus. I'm describing a teleology.

  **Marcus:** I'm describing the organization of the system. Cummins' point was that functional analysis breaks down complex capacities into sub-capacities. Survival in winter is a capacity. Insulation is the sub-capacity. Whether this trait gets "voted in" by natural selection later is irrelevant to whether it is currently playing that role. To deny it has a function now is to say the rabbit's survival mechanism is unintelligible until it replicates.

  **Elena:** The survival mechanism is intelligible as a *causal chain*. I don't deny the physics. I deny the teleology. If the trait vanishes next year, would you still tell your students that the coat's function was insulation?

  **Marcus:** Yes. Because even if it vanishes, it *contributed* to the capacity. Maybe the environment changes back. Maybe the fox pressure is too high. That doesn't negate the causal role the fur played in thermoregulation.

  **Elena:** Then your view cannot distinguish between function and malfunction, or function and accident. Imagine a mutation causes a heart to flap uselessly, but by sheer luck, the flapping vibrates the chest cavity enough to dislodge a clot and save the organism. On your view, does the flapping have the function of clot-dislodging?

  **Marcus:** In that specific context, yes. It contributes to the survival capacity.

  **Elena:** That's ridiculous. It's a lucky accident. On my view, the heart's function is pumping. The flapping is a malfunction that had a lucky side effect. My view preserves the normativity. We can say the heart *failed* its function but saved the organism anyway. Your view just says "everything that helps is a function." It loses the ability to say something is broken.

  **Marcus:** But in the rabbit case, the coat isn't broken. It's working. It's not a side effect like the heart flap; insulation is the direct physical consequence of the thickness. You're demanding a pedigree for a trait that is currently doing the job. It's like refusing to call a new library dependency "functional" until it's been in production for three years.

  **Elena:** In engineering, maybe. In biology, the "production environment" is evolutionary time. If this rabbit's lineage dies out, this mutation is evolutionary noise. If I call it a "function," I imply the organism was designed or selected for it. I'm respecting the blind nature of selection. It doesn't know it selected anything until the selection is complete.

  **Marcus:** But selection is ongoing. This rabbit surviving *is* the first step of selection. Why draw the line after one generation? Why not after ten? Why not after fixation? You're drawing an arbitrary historical line that renders the current organism's biology opaque.

  **Elena:** I'm drawing the line where the explanation for the trait's existence shifts from "mutation" to "selection." Right now, the explanation is mutation. If the trait spreads, the explanation becomes selection. That shift is when "function" kicks in.

  **Marcus:** So, if the trait spreads, you admit the coat *now* had the function?

  **Elena:** I would say the descendants have the function. Retrospectively, we might say this rabbit possessed a trait that *would become* functional. But strictly speaking, function is a property of traits in a lineage, not isolated tokens.

  **Marcus:** And if it vanishes?

  **Elena:** Then it was never a function. Just a beneficial accident.

  **Marcus:** That means the biological reality of this rabbit is hostage to fortune. If a meteor hits the offspring, the coat loses its function? That makes function extrinsic to the organism. I say the function is intrinsic to the organization of the rabbit. The coat insulates. That is a fact about the rabbit, not a fact about its grandchildren.

  **Elena:** Function isn't intrinsic, Marcus. It's relational. It's a relation between the trait and the selective history. You want function to be about current utility. I say function is about why we are here to talk about rabbits at all.

  **Marcus:** And I say function is about how the rabbit works. If I can't attribute the function of insulation to this coat, I can't fully explain the rabbit's survival. I'm forced to say "The coat insulated, but didn't function to insulate." That's a distinction without a difference for anyone studying the physiology.

  **Elena:** It's the difference between physics and biology. Physics explains the heat retention. Biology explains the adaptation. This isn't an adaptation yet. It's a variation.

  **Marcus:** Then your biology can't account for the origin of adaptations. You have to wait until the adaptation is old news to call it a function. By then, the interesting part—the emergence of the novelty—is off-limits to functional analysis.

  **Elena:** I account for the origin by distinguishing variation from selection. You collapse them. You call every beneficial variation a function. I wait for the selection to confirm it.

  **Marcus:** And in waiting, you render the current organism's successful traits functionally mute.

  **Elena:** No. I render them causally potent but teleologically silent.

  **Marcus:** Which is exactly why a programmer finds your view frustrating. In my code, if a new handler catches an exception it wasn't explicitly written for, but it works, I document it as a feature. I don't wait for the next release cycle to decide if the code "functions."

  **Elena:** Because you wrote the code. Nature didn't write this rabbit. Nature is a filter. The filter hasn't finished filtering this trait yet. Until it passes through, it's just debris that happened to float on top.

  **Marcus:** Debris that kept the rabbit alive.

  **Elena:** Effectively, yes. But not functionally.

  *(The Biologist returns with the coffee pot.)*

  **Biologist:** I see the mugs are still full. Have you solved it? Does the coat have a function?

  **Marcus:** Yes. It insulates. It contributes to survival. It functions.

  **Elena:** No. It insulates. It contributes to survival. But it functions only if it survives the filter.

  **Biologist:** So, if I come back tomorrow and tell you the rabbit's offspring froze to death because the coat made it too heavy in the snow...

  **Elena:** ...Then it never had the function.

  **Marcus:** ...Then it failed to propagate, but it still functioned as insulation until it became a liability.

  **Biologist:** And if I tell you the population explodes and takes over the valley?

  **Elena:** Then it becomes a function in the descendants, and we retrospectively identify this rabbit as the origin of the adaptation.

  **Marcus:** Then it was a function all along, and now we just know it was a successful one.

  **Biologist:** *(Sighs)* So, one of you is describing the history of the lineage, and the other is describing the mechanics of the individual.

  **Elena & Marcus:** *(In unison)* Exactly.

  **Biologist:** Great. I still have to write the grant proposal. Can I say the trait functions to insulate?

  **Marcus:** Yes.

  **Elena:** Only if you add "putatively."

  **Marcus:** See? You just added a word. I added a reality.

  **Elena:** I added scientific rigor. You added a metaphor.

  **Biologist:** I'm going to write "The coat provides insulation."

  **Elena:** Safe.

  **Marcus:** Cowardly.

  **Biologist:** Tenured.
