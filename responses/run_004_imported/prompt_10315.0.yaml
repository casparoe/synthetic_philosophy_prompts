prompt: |-
  Ok, this is going to sound like a weird rabbit hole but bear with me. Over the holidays I got into a whole argument with my uncle about why the Islamic world supposedly "fell behind" Europe scientifically, and his whole theory rested on one guy: Al-Ghazali, and specifically his occasionalism -- basically that once this hugely influential theologian declared there's no real causation in nature and God just does everything moment to moment, everyone stopped bothering to look for natural laws. I pushed back cause it felt like a way too tidy just-so story, but then I realised my own grasp of occasionalism is basically the two-sentence pop version ("fire doesn't really burn the cotton, God does") and I couldn't actually back that up with anything.

  So, setting aside the "did it kill science" debate (that feels like a separate and much messier historical question, not really what I'm after), I want to actually get the philosophical argument straight in my head. Can you walk me through the real mechanics of Ghazali's position using the cotton-and-fire case from the Tahafut specifically -- what's the actual argument for why we're not entitled to say the fire causes the burning, versus the two just being habitually correlated? I'd also love it if you could place this relative to two things I sort of already know: Hume's line that causation reduces to constant conjunction (is Ghazali basically making the same move, or is it importantly different since he's not really a skeptic so much as advancing a positive theological claim about God being the sole efficient cause?), and Malebranche, since I gather occasionalism shows back up in 17th century European philosophy and I have no idea if thats a coincidence or an actual line of influence. And if there's a strong objection to Ghazali's own argument (I vaguely remember Averroes wrote some kind of rebuttal?) I'd like the best version of that too.
