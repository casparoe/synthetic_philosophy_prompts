answer: |-
  This is a profound and delicate task. You are walking a tightrope between honesty and discretion, honoring the gravity of your history without casting a shadow on the celebration.

  The key here is to use the metaphor of the "promise made in the calm" versus the "storm." This captures the essence of the Ulysses contract without using clinical language that would medicalize your sister in front of her new in-laws or friends. It validates that the anger was real, but the love was deeper.

  Here is a draft for the toast.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s older sibling.

  Standing here today, looking at [Bride] and [Partner], it is easy to think that love is just about the bright moments. The laughter, the celebration, the easy days when the sun is shining and everyone agrees. But anyone who knows [Bride] knows that her love is not a fair-weather thing. It is resilient. It is enduring. And it is built on truth.

  [Bride] and I have a relationship that has been tested. We have known years of incredible closeness, and we have known a year of silence. There was a time when the hardest thing I ever had to do was to choose between being the sibling who agreed with her, and the sibling who protected her.

  I learned something difficult during that time. I learned that keeping a promise to someone you love can sometimes mean doing the very thing they beg you not to do. It means honoring the person they know themselves to be, even when the storm they are standing in tells them you are the enemy. It means holding onto a promise made in the calm, even when the person standing in front of you is screaming for you to let go.

  I tell you this not to dwell on the past, but to honor the strength it took to get to this future. Because [Bride] came back. We found our way to each other. And in doing so, we proved that our bond was stronger than the hurt, stronger than the illness, and stronger than the truth that had to be told.

  [Partner], today you are marrying the whole of her. You are marrying the joy that lights up this room, but you are also marrying the resilience that survived the dark. You are marrying someone who knows the value of a promise kept, even when it costs everything. I have watched how you love her—with patience, with eyes wide open, and without fear. Knowing she is in your hands makes it easier for me to step back into my place as just her sibling, and not her guardian.

  [Bride], I am so proud of you. I am proud of the life you have built, the stability you have fought for, and the grace you have shown in forgiving me for the times I had to be hard so that you could be safe.

  So, if everyone could please raise a glass.

  To [Bride] and [Partner]. May your marriage be a place where you are both safe enough to be vulnerable, and strong enough to hold each other when the weather turns. May you always remember the promises you make in the calm, and may you always, always find your way back to the table.

  To the happy couple.

  ***

  ### Notes on Delivery

  *   **Pacing:** When you get to the paragraph beginning "I learned something difficult," slow down. This is the core message. Do not rush through it.
  *   **Eye Contact:** During the "hard truth" section, look at your sister, not the guests. This makes it a moment of connection between the two of you, rather than a public announcement to the room.
  *   **The "Illness" Word:** You will notice I used the word "illness" once ("stronger than the illness"). If you feel that is too specific for your family's level of openness, you can swap it for "stronger than the struggle." However, "illness" validates that this was medical, not just a disagreement.
  *   **Emotional Regulation:** It is okay to be emotional. If your voice cracks, pause. It underscores the truth of the words.

  This toast honors the Ulysses contract by describing its function (holding the line during the storm) without naming it, and it validates her anger (the "screaming") without defining her by it. It leaves the room understanding that your bond is battle-tested, which is a beautiful foundation for a wedding.
