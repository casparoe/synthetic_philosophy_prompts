  2.  **Determine the Boundaries & Risks:**
      *   *Risk 1: Oversharing.* Mentioning "Ulysses contract," "hospitalization," "medication," or "mania" explicitly is inappropriate for a wedding toast. It medicalizes the bride in front of in-laws/friends.
      *   *Risk 2: Invalidating.* Saying "I know you didn't mean it" undermines the reality of her feelings during the illness.
      *   *Risk 3: Making it about the Speaker.* The toast must center the bride and her marriage, not the sibling's sacrifice.
      *   *Risk 4: Too Dark.* It's a wedding. The heavy stuff needs to be framed within love and recovery.

  3.  **Drafting Strategy - The "Metaphor" Approach:**
      *   Instead of clinical terms, use metaphors of navigation, storms, anchors, or promises.
      *   The "Ulysses" reference itself is actually a great literary metaphor (Odysseus tying himself to the mast to hear the Sirens without crashing). It's classy, intellectual, and hints at the situation without being clinical.
      *   Focus on the concept of *knowing someone better than they know themselves in the moment.*

