      *   **The Reconciliation:** Acknowledge the silence and the return. "You came back." "We are here."
      *   **The Partner:** Bring the focus to the new spouse. Why are they good for her? They love the *whole* her.
      *   **Closing:** Wish for the future. Stability, joy, partnership.

  5.  **Refining the "Core Question":**
