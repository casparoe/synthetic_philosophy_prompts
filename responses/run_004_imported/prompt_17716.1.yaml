      *   **Occasion:** Wedding reception toast.
      *   **Audience:** Mixed. Some know the history, many know nothing. It's a celebration, not therapy.
      *   **Key Challenge:** Acknowledge the depth of their bond and the difficult history *without* oversharing medical details, shaming the past behavior, or invalidating the sister's experience during mania.
      *   **Core Theme:** "Why keeping a promise to someone can sometimes mean overriding the very person standing in front of you, begging you not to." (This needs to be woven in subtly but meaningfully).
