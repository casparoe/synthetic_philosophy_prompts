prompt: |-
  So I started a pottery class a few weeks ago and last night our teacher said something like "once it's bisque fired, its not clay anymore, you can't take it back" — apparently unfired greenware can be soaked back down into reusable clay but a fired piece is chemically a totally different material forever — and it sent me straight back to a metaphysics class I took years ago on material constitution. Now I can't stop thinking about the mug sitting in the kiln right now: were "the mug" and "the lump of clay" ever really two different things to begin with, or just one thing wearing two names?

  Write me a dialogue, set right at the kiln as we're unloading it, between someone who thinks the pot and the clay are (or were) genuinely distinct coincident objects with different persistence conditions — so a cracked, ruined pot coming out of the kiln means the pot is gone even though the clay's still sitting right there — and someone who thinks that's all confused, that there's really just the clay arranged pot-wise and never was a second "pot"-object around to loose in the first place. Make them actually go after each other's weak points (Leibniz's law, the grounding problem for what makes the modal difference, sorites worries about exactly when greenware "becomes" something else, whatever's relevant) instead of just restating their own side.
