answer: |-
  **Setting:** *The back room of a community art center. The electric kiln has just finished its cycle, cooling down to room temperature. The air smells of ozone and hot dust. ELENA (30s, philosophy adjunct, wearing heavy heat-resistant gloves) is kneeling before the open kiln door. MARCUS (40s, software engineer, pottery hobbyist for six months) stands beside her with a clipboard.*

  **ELENA:** *(Tapping a mug with a fingernail. It rings like a bell.)* Listen to that. That's not the thud of greenware. That's a new material.

  **MARCUS:** It's silica and alumina. Just like it was on Tuesday.

  **ELENA:** Chemically, sure. But ontologically? Mr. Henderson was right. You can't reclaim this. If I smash this now, I don't get clay back. I get shards. The clay is gone. The mug is what's here.

  **MARCUS:** There is no "mug" over and above the clay, Elena. You're hallucinating a second object. There is just "clay arranged mug-wise."

  **ELENA:** *(She sets the mug on a rack and reaches for another.)* Classic Constitution View denial. But look at the persistence conditions. If I take that lump of raw clay in the corner and squash it, the clay survives. If I squash this, the *mug* dies. They have different modal properties. By Leibniz's Law, if $x$ and $y$ have different properties, they aren't identical. So the mug isn't the clay.

  **MARCUS:** You're conflating the object with our *description* of the object. The clay doesn't "survive" squashing in the sense that it stays useful. It just persists as matter. You're saying because we have a word "mug" that implies function, a ghost object pops into existence to hold that function? That's the Grounding Problem, Elena. If there are two things here—the clay and the mug—occupying the exact same space, made of the exact same atoms, what *grounds* the distinction? What is the metaphysical glue that holds the "mug" object to the "clay" object?

  **ELENA:** The form grounds it. The history. This clay has undergone a transformation. It's been vitrified. The particles have locked. The clay *constitutes* the mug, but it isn't *identical* to it. Constitution isn't identity.

  **MARCUS:** So when did the second object pop into existence? Was it when you pulled the handle?

  **ELENA:** No, that was greenware. Still reclaimable.

  **MARCUS:** Okay. So when the kiln hit 200 degrees? Water smoking off?

  **ELENA:** No, still bone dry.

  **MARCUS:** 500 degrees? Quartz inversion?

  **ELENA:** *(Hesitates)* It's a process. It's not a magic snap.

  **MARCUS:** Aha. The Sorites Paradox. If you can't tell me the exact degree where the "clay" object ceased and the "mug" object began, then you're drawing an arbitrary line on a continuum. If the objecthood depends on a threshold, and the threshold is vague, then the existence of the object is vague. Do you really believe existence is vague? Either the second object is there or it isn't.

  **ELENA:** Existence isn't vague, *classification* is. But the modal difference is sharp. Look. *(She picks up a test tile that cracked during cooling.)* This tile. The clay is right here. I can touch it. But the tile? The tile is gone. It failed its essence. If the tile and the clay were one thing, and the clay is still here, how can the tile be gone?

  **MARCUS:** Because "tile" is a predicate, not a substance. You're treating a concept like a container. When the clay cracked, it stopped satisfying the predicate "is a tile." Nothing died. You just have clay arranged tile-wise that is now arranged broken-wise. You're grieving an object that never existed independently of the atoms.

  **ELENA:** That feels incredibly reductive. It denies the reality of function and art. If I spend ten hours throwing this, and it explodes in the kiln, I didn't just lose atoms. I lost a *work*. The work has identity conditions the raw material doesn't. The raw material doesn't have an author. The mug does.

  **MARCUS:** The atoms have a causal history that includes your hands. You're just projecting "authorship" onto the arrangement. Here's the real weak point in your view: Coincidence. If the mug and the clay are distinct, then right now, on this shelf, I have twice as many objects as I thought I did. Every mug is a double. Why did the universe multiply its inventory just because you heated it up? That's ontological extravagance. Ockham's Razor shaves your "mug" object right off.

  **ELENA:** Ockham's Razor cuts away unnecessary entities, not *explanatory* ones. I need the distinct object to explain why I can't recycle this. If it were just clay, I should be able to slake it down. I can't. The causal powers have changed. The clay *used to* have the power to become slurry. Now it has the power to cut my finger. Different powers, different object.

  **MARCUS:** The *arrangement* has the new powers. Not a new ghost-substance. Look, think about Theseus's Ship. If I chip the handle off this mug and glue it back with epoxy, is it the same mug?

  **ELENA:** Probably.

  **MARCUS:** If I grind it down and use the grit as grog in a new bucket, is it the same mug?

  **ELENA:** No.

  **MARCUS:** So the "mug" object is fragile. It depends on human intention and structural integrity. The clay is robust. It doesn't care. You're saying the fragile thing is a real object, but the robust thing is just "stuff." Why is the fragile thing the primary citizen of reality?

  **ELENA:** Because we live in the human world, not the particle world. In the human world, function is real. A broken mug is a tragedy. Broken clay is just geology. If you're right, and there's only clay, then nothing is ever created or destroyed. You just shuffle atoms. There's no birth, no death. Just rearrangement.

  **MARCUS:** Exactly. And that saves me from the anxiety you're feeling. You're looking at that cracked tile like it's a corpse. It's not. It's just... done.

  **ELENA:** *(She picks up her own mug again, holding it with both gloved hands.)* But if it's just clay, then I didn't make anything. I just moved dirt into a shape.

  **MARCUS:** You moved dirt into a shape that holds coffee. That's enough. You don't need to conjure a metaphysical twin to validate the labor.

  **ELENA:** *(She taps the rim. A hairline fracture is visible.)* Oh no.

  **MARCUS:** Crack?

  **ELENA:** *(She sets it down gently.)* There. Did you hear that? A dull thud.

  **MARCUS:** So?

  **ELENA:** So, the mug is dead. It failed its persistence conditions. But look at it. It's sitting right there. The clay is fine. The atoms are fine. If they were the same thing, this wouldn't make sense. One thing can't be both "gone" and "here" at the same time.

  **MARCUS:** *(He picks up the cracked mug. He runs a thumb over the fracture.)* It's here. It's just cracked. "Gone" is you imposing a binary status on a continuous physical state.

  **ELENA:** It's a mug. A cracked mug isn't a mug. It's a shard-assembly.

  **MARCUS:** Says who? The dictionary? The kiln didn't care. The clay didn't care. Only you care. That proves my point. The "mug" is in your head. The clay is in the kiln.

  **ELENA:** *(She pulls off her gloves, rubbing her hands together.)* Maybe. But try drinking out of it.

  **MARCUS:** *(He pauses, holding the cracked ceramic.)* It would leak.

  **ELENA:** Exactly. The leak proves the object is gone. The clay doesn't leak. The *form* leaks. And since the form is what makes it a mug, the mug is gone. You can deny the metaphysics all you want, Marcus, but you can't drink coffee from a contradiction.

  **MARCUS:** *(He sets the cracked mug aside, into a "waster" bin.)* Fine. The mug is gone. But don't tell me the clay is still here waiting to be reborn. This is bisque. It's dead matter now. No reclaiming.

  **ELENA:** *(Smiling faintly.)* See? Even you admit it. It's not clay anymore.

  **MARCUS:** I admit it's useless for pottery. I don't admit it spawned a soul.

  **ELENA:** *(She reaches back into the kiln for the next shelf.)* Keep telling yourself that. But when you glaze it, you won't be painting rocks. You'll be painting a vessel.

  **MARCUS:** I'll be painting silicate arranged vessel-wise.

  **ELENA:** Same thing.

  **MARCUS:** *(He picks up the clipboard.)* Not even close.

  *(Silence returns, save for the clink of ceramic on metal racks. Elena handles the next piece with reverence, as if lifting a body. Marcus handles his with efficiency, as if packing boxes. The kiln hums, cooling, indifferent to the count.)*
