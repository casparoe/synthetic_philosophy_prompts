answer: |-
  The form on the desk was titled *Petition for Segmental Release*, but everyone called it the Divorce of Time.

  Thomas traced the embossed seal of the Bureau of Continuity. It depicted a snake eating its tail, but the snake was segmented, like a worm, each ring distinct from the next.

  "Mr. Vance," the Adjudicator said. She was a sharp woman who wore her hair in a severe bob that looked like a single, unchanging shape. An endurantist, Thomas guessed. People who believed things stayed the same usually liked clean lines. "You understand the implications. If you sign this, you acknowledge that the woman currently living in your house is not the legal or metaphysical successor of the woman who married you fifteen years ago."

  "She's in the house," Thomas said. "She's sleeping."

  "She is occupying the same spatial coordinates as your wife," the Adjudicator corrected. "But under the Protocol of Temporary Intrinsics, she cannot possess the properties of the past. The woman who married you was bent by grief. She was shaped by the loss of your son. The woman currently in your kitchen… she is straight."

  Thomas closed his eyes. He could see her. Since the procedure, Elena moved differently. The heavy slump in her shoulders, the way she used to hold her arms crossed over her chest as if protecting a wound that wasn't there—it was gone. The neural recalibration hadn't just erased the memory of the accident; it had smoothed out the topography of her personality.

  "If I sign," Thomas said, "she's free."

  "She is a new temporal part," the Adjudicator said. "A distinct slice of the space-time worm that was 'Elena Vance.' You are releasing the current slice from the obligations of the previous slices. She will not owe you fidelity. She will not owe you shared history. She can walk away without guilt, because strictly speaking, *she* didn't make the vows. The previous segment did."

  "And if I don't sign?"

  "Then she remains bound to a history she cannot feel. You enforce the continuity of the worm. She must act the part of the grieving widow, the loyal wife, even though the psychological machinery required to sustain that role has been removed. It would be… coercive. Like asking a straight rod to pretend it is bent."

  Thomas took the form home. The house was quiet. It was a Tuesday, the day they used to argue about bills. Now, Elena was in the garden, pruning the roses. She hummed. She hadn't hummed in six years. Not since the car skidded on the ice.

  He watched her through the window. She looked like Elena. She had the same scar on her chin, the same silver threading through her dark hair. But the *shape* of her was wrong. The Elena he knew was defined by the weight she carried. This woman was buoyant.

  She saw him and smiled. It wasn't the tight, dutiful smile of the last few years. It was open.

  "Thomas," she said, coming inside. She reached for a glass of water. Her hand was steady. "The Adjudicator call?"

  "She sent the papers."

  Elena nodded. She didn't look afraid. That was the hardest part. The old Elena would have been terrified of losing him, of losing herself. This Elena was curious.

  "I read the philosophy briefs they send out," she said. "The perdurantist argument. It makes sense to me, Thomas. I look at the photos on the mantle. That woman in the black dress at the funeral… I see her. I recognize her face. But I don't feel her pain. It's like looking at a picture of a broken arm. You know it hurt, but your arm isn't broken now."

  "You're saying you're not her."

  "I'm saying I'm where she ends," Elena said softly. "I'm the next segment. If you hold me responsible for her promises, you're punishing me for a shape I don't have. I'm not bent anymore."

  Thomas walked to the mantle. He picked up the framed photo from their tenth anniversary. Elena was laughing then, before the accident, before the grief bent her double. Then he picked up the photo from the funeral. She was a ghost. Then the video from last week. She was gardening.

  "If I sign," Thomas said, "you can leave. You can find someone who doesn't remind you of a tragedy you don't remember."

  "I might," she said. "Or I might stay. But it would be a choice *I* make. Not a contract *she* signed."

  Thomas felt a surge of anger, hot and familiar. It was the anger of the Endurantist. *You are her. You are the same substance. You persist.*

  "You drank the wine at our wedding," he said. "You wore this ring." He pointed to the gold band on her finger.

  "This hand wore it," Elena said, holding it up. "This hand is continuous. But the mind… the mind is a series of moments. Why is the hand more 'me' than the memory? Why is the biology more real than the grief?"

  "Because I loved the whole story," Thomas snapped. "I didn't love a slice. I loved the worm. I loved the way you changed. I loved the way the grief made you kinder, even when it made you difficult. If I sign this, I'm admitting that the woman I mourned is dead, and you're just… her replacement. A copy with the same fingerprints."

  "Or," Elena said, stepping closer, "you're admitting that people change. That 'I am' is a lie we tell to make the tax code work. Thomas, I am happy. I know that sounds like a betrayal. I know that to the Elena of five years ago, my happiness would feel like a betrayal. But she's not here. I am."

  She reached out and touched his arm. Her touch was light. The old Elena would have gripped him, anchoring herself.

  "The Adjudicator said if I don't sign, we stay married," Thomas said. "But you'll resent me. You'll feel like a prisoner in a life built for a different person."

  "And if you do sign?"

  "Then we're strangers. Roommates. You can walk out that door tomorrow and start a new worm. And I'll be left here with the ghost of the one who loved me."

  Elena pulled her hand back. She looked at the ring. "It's heavy," she said. "Not physically. But… contextually. It belongs to a segment that's closed."

  Thomas walked to the desk where he'd laid the form. The pen was there. A simple black ballpoint.

  He thought about Lewis's problem. *How can one object be bent and straight?* It can't. Not strictly. Either the object changes, meaning it's not strictly identical to its past self, or the object has parts that are bent and parts that are straight.

  If he signed, he accepted that Elena was a series of parts. He accepted that the Elena who vowed 'til death was a different entity than the one standing in the kitchen. He would be freeing her from a debt she didn't incur.

  If he didn't sign, he insisted on the illusion of the whole. He would be forcing the straight rod to pretend it was bent, demanding she carry a shape that no longer existed in her geometry.

  "Thomas," Elena said. "What do you feel? When you look at me."

  He looked at her. He saw the silver hair. He saw the lack of shadows under her eyes. He saw the woman who had held his hand in the ICU, and he saw the woman who was currently humming a pop song from the radio.

  "I feel," Thomas said, his voice cracking, "like I'm holding a photograph that's still warm."

  He picked up the pen. He uncapped it.

  The paper waited. *Signature of Current Temporal Part.* *Signature of Spouse Acknowledging Discontinuity.*

  If he signed, he lost the wife he knew, but saved the woman standing in front of him.
  If he didn't, he kept the wife he knew, but imprisoned the woman standing in front of him.

  Or maybe it was all a lie. Maybe the worm was the only thing that was real, and this segmentation was just a legal trick to monetize memory. Maybe she was still her, and the grief was just suppressed, waiting to spring back, proving that the shape was permanent after all.

  He looked at Elena. She wasn't pleading. She wasn't demanding. She was just waiting, a distinct point in time, occupying the present.

  "Does it hurt?" Thomas asked. "Knowing that you used to love me differently?"

  "I don't know how I used to love you," Elena said. "I only know how I love you now. Which is… cautiously. Like I'm meeting you for the first time."

  Thomas hovered the pen over the line. The ink glistened at the tip, a tiny, dark sphere ready to break onto the page.

  He realized then that the metaphysics didn't matter. The Bureau didn't care if perdurantism was true. They only cared if the signature was valid. The truth of the worm, or the slice, wasn't in the law. It was in the space between the pen and the paper.

  He looked at Elena. She looked back, her eyes clear, unburdened by the history he was clutching like a stone.

  "Tell me," Thomas whispered. "If I sign… will you come back tomorrow?"

  "I don't know," she said. "That slice of me hasn't happened yet."

  Thomas lowered the pen. He didn't touch the paper. He just held it there, an inch above the line, suspended in the air between the past that bound them and the future that hadn't chosen them yet.

  "Then I'll wait," he said.

  "For what?"

  "For the next segment to arrive."

  He set the pen down. The ink dried at the tip, uncapped, waiting to see if it would ever be used to draw a line, or if it would just sit there, bridging the gap between two things that might be the same, and might not.
