answer: |-
  It is a genuine pleasure to engage with someone who has not only read the rocks but has also lived through one of the most significant paradigm shifts in the history of science. The transition from static crust to plate tectonics is the *exemplar* case study in philosophy of science (Kuhn wrote about it, of course), so your intuition that this philosophical paradox clashes with your lived scientific experience is spot on.

  You have identified the tension perfectly. The Dogmatism Paradox (often attributed to Kripke's 1965 lecture "Outline of a Theory of Truth," though popularized by Gilbert Harman in *Thought* in 1973) is a fascinating logical puzzle. But like many logical puzzles, it relies on definitions that work in formal logic but fracture when applied to scientific practice.

  Here is why the paradox does not actually vindicate your senior colleagues, and why open-mindedness remains a rational virtue rather than a beginner's mistake.

  ### 1. The Factivity of Knowledge (The "They Didn't Know" Problem)
  The most immediate resolution to your specific geological example lies in the definition of "knowledge." In epistemology, knowledge is **factive**. You cannot know something that is false. You can *believe* it, you can be *certain* of it, you can have *justified belief* in it, but if it turns out to be false, you never *knew* it.

  Since the static crust theory was false, your senior colleagues did not **know** the crust was static. They only *believed* they knew. Therefore, the first premise of the paradox ("If I know $h$...") was never satisfied. The paradox cannot license their dogmatism because the condition required to trigger the license (actual knowledge) was absent.

  However, I suspect your deeper worry is hypothetical: *Even if the static crust theory had been true, would the paradox license ignoring the evidence for drift?* This leads us to the more subtle epistemological problems.

  ### 2. Defeasibility: Knowledge Can Be Unmade
  The Dogmatism Paradox assumes that knowledge is a static state that, once achieved, locks in all logical consequences. But most contemporary epistemologists argue that knowledge is **defeasible**.

  Defeasibility means that your claim to "know" $h$ depends on your current evidence and justification. New evidence doesn't just test $h$; it tests your *claim to know* $h$.

  Consider this: If I claim to know $h$, I am claiming that my justification for $h$ is sufficient. If new evidence $e$ appears that strongly contradicts $h$, I can no longer claim my justification is sufficient *until I have investigated $e$*.

  To say "I know $h$, therefore I know $e$ is misleading" is to assume I have a "God's eye view" of the truth. But I don't. I only have my current justification. If I ignore $e$ without examination, I am not protecting my knowledge; I am insulating my *belief* from the very process that validates knowledge. If $e$ turns out to be genuine, my claim to "know" $h$ is retroactively destroyed. I didn't know $h$ all along; I was mistaken.

  Therefore, rationality requires me to examine $e$ to ensure I still *know* $h$. Ignoring $e$ risks turning my "knowledge" into mere dogma.

  ### 3. The Access Problem (Distinguishing Misleading Evidence)
  The paradox argues: "If $h$ is true, evidence against it is misleading." This is logically true. But it conflates **ontological status** (is the evidence actually misleading?) with **epistemic access** (can I tell it is misleading?).

  Even if $h$ is true, I do not have a magical detector that tags incoming evidence as "misleading." To determine that evidence is misleading, I usually have to analyze it, check its source, compare it with other data, and see if it can be reconciled with $h$.

  For example, suppose the crust *was* static (hypothetically). The paleomagnetic striping on the seafloor would indeed be "misleading evidence." But the only way to *know* it was misleading (e.g., to discover it was an instrumentation error or a local anomaly) was to investigate it. To say "I know this is misleading so I won't look" is to claim access to information (the true nature of the evidence) that you can only get by looking.

  ### 4. Scientific "Knowledge" vs. Philosophical "Knowledge"
  This is where your experience as a geologist is the ultimate trump card. In science, we rarely use "know" in the absolute, Cartesian sense implied by the paradox.

  When a scientist says, "We know the age of this rock," they mean, "We have a high degree of justified confidence based on current methods and data, subject to revision if better methods arise." Scientific knowledge is inherently **provisional**.

  The Dogmatism Paradox treats knowledge as a binary switch: either you have it (and are immune to error) or you don't. Science treats knowledge as a probability distribution. Open-mindedness isn't a failure to commit to a truth; it is the recognition that our *confidence levels* are always conditional on the absence of disconfirming data.

  If you treat scientific theories as absolute "Knowledge" (capital K), you cease doing science and start doing theology. The virtue of open-mindedness is simply the practical acknowledgment of **fallibilism**: the recognition that human beings, and our instruments, are capable of error, even when we feel most certain.

  ### 5. Harman's Own Point
  It is worth noting that Gilbert Harman, who formalized this paradox, did not intend it to prove that dogmatism is good. He intended it as a *reductio ad absurdum* to show that our standard principles of epistemic closure (the idea that if you know $P$, and you know $P$ implies $Q$, you must know $Q$) need to be restricted.

  Harman argued that you cannot simply deduce your way out of checking evidence. The paradox highlights a flaw in how we model knowledge logic, not a license for intellectual stubbornness.

  ### Summary
  To answer your specific questions:

  1.  **Were the geologists rational?** No. They conflated high confidence with absolute knowledge. Since their theory was false, they didn't "know" it, so the paradox doesn't apply. Even if the theory had been true, ignoring the evidence would have been irrational because they lacked the access to *know* the evidence was misleading without investigating it.
  2.  **Is open-mindedness a beginner's mistake?** No. It is the only rational stance for a fallible agent. The paradox works only if you assume you possess infallible knowledge. Since humans don't possess that, the conclusion of the paradox doesn't bind us.

  You witnessed a moment where "justified belief" was mistaken for "knowledge." The paradox is a logical curiosity, but in the field, as you know better than anyone, the rocks always get the final vote. Epistemology that tells you to stop listening to the rocks is bad epistemology.
