      *   Avoid jargon where possible, or define it immediately with examples.
      *   Use the "World as Actual" vs. "World as Counterfactual" distinction clearly, as that's the mechanical heart of 2DS.
      *   Make sure to explicitly answer the "mechanics" part of the prompt.

  5.  **Self-Correction/Review during drafting:**
