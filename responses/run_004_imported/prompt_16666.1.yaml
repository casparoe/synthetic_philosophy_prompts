answer: |-
  Here are 10 interview questions designed to press your guest on the metaphysical and theological implications of occasionalism, including the specific topics you requested. Each includes a "Likely Dodge" analysis and a targeted follow-up.

  ### 1. The Fire and Cotton (Necessity vs. Reliability)
  **Question:** "In the *Tahafut*, Al-Ghazali insists that the contact between fire and cotton does not *necessitate* burning. But I want to press you on the reliability of that conjunction. Are you denying that there is a necessary connection between the fire and the burn, or are you going further and suggesting that the conjunction itself is loose enough that, even without a miracle, the fire might simply fail to burn the cotton by chance?"

  *   **Likely Dodge:** She will likely affirm that the conjunction is reliable due to God's "Habit" (*Sunna*), but maintain it is logically contingent.
  *   **Follow-up:** "If the reliability rests entirely on a habit that is logically contingent, on what basis do we trust induction tomorrow? If there's no necessity in the fire, isn't our expectation of burning just a guess about God's future mood?"

  ### 2. The "Hume with a Deity" Charge
  **Question:** "David Hume argued that causal necessity is just a psychological projection on our part. You argue it's a divine habit on God's part. Critics might say your view is just Humean skepticism with a deity bolted on to stop the regress. Does positing God actually *explain* the regularity we see, or does it just give a name to the mystery?"

  *   **Likely Dodge:** She will argue that Hume is making an epistemic claim (we can't know causes), while she is making an ontological claim (there *are* no created causes).
  *   **Follow-up:** "But if the divine causation is inaccessible to empirical observation, doesn't that distinction collapse for the philosopher of science? Are you offering a metaphysical explanation or just a theological placeholder?"

  ### 3. The Miracle Problem
  **Question:** "If every event—from a leaf falling to a sea parting—is a direct act of God with no created causal powers, what metaphysically distinguishes a miracle from an ordinary Tuesday? Is a miracle just an event that surprises us, or is there an objective difference in *how* God acts in miraculous versus ordinary cases?"

  *   **Likely Dodge:** She will likely say miracles are defined by their breach of God's "Customary Habit" (*Ada*), usually to support a prophet.
  *   **Follow-up:** "But if God's will is one and simple, what constrains the 'habit' in the first place? If the habit is just what God usually does, isn't the distinction between miracle and nature merely subjective to the human observer?"

  ### 4. Human Agency and *Kasb*
  **Question:** "Al-Ghazali attempts to save human responsibility through the theory of *kasb* (acquisition)—where God creates the act, but we 'acquire' it. But if I lack the causal power to move my own arm, in what sense am I the agent? Does 'acquisition' risk being a semantic fix for a metaphysical problem?"

  *   **Likely Dodge:** She will argue that agency doesn't require causal *power*, only causal *relation* or intentionality aligned with the act.
  *   **Follow-up:** "If the power to execute the intention comes entirely from God, doesn't that make God the author of sinful intentions just as much as virtuous ones? How do you preserve moral asymmetry?"

  ### 5. The Status of Scientific Laws
  **Question:** "If natural objects lack causal powers, what is the ontological status of the laws of physics? Are they descriptions of God's psychological habits, or do they exist independently of His will? If the former, does science become a branch of divine psychology?"

  *   **Likely Dodge:** She will likely say laws are descriptive regularities grounded in God's will, not prescriptive forces.
  *   **Follow-up:** "If they are grounded in God's will, could God have willed gravity to be inverse-cube? If so, are the laws of nature arbitrary, and does that undermine the rationality of the universe?"

  ### 6. The Problem of Evil
  **Question:** "If created things have no causal power, then a knife does not cut a person; God cuts the person *at the occasion* of the knife. Does this occasionalist framework not make God the direct agent of every murder and act of violence in a way that standard theism avoids?"

  *   **Likely Dodge:** She will distinguish between God's *creative* will (which creates the act) and His *command* will (which forbids the act).
  *   **Follow-up:** "But if the creative will is the only thing that actually *effects* change in the world, doesn't that render the command will impotent? How is God not directly responsible for the effect if He is the sole cause of it?"

  ### 7. Divine Simplicity and Habit
  **Question:** "You speak of God's 'Habit' as if it's something God follows. But if God is simple and unchanging, can He truly have 'habits'? Does positing a habit imply a distinction between God's essence and His actions that threatens divine simplicity?"

  *   **Likely Dodge:** She will argue that the "habit" is in the *creation* (the sequence of events), not in God's essence.
  *   **Follow-up:** "But if the sequence is created moment-by-moment by God, and God is the sole cause of that sequence, isn't the habit ultimately a feature of God's willing, not the creation's?"

  ### 8. Epistemic Access
  **Question:** "You deny necessary connection between created things because we cannot observe it. But we also cannot observe God's causal intervention directly. By what faculty do we know that God is the cause, if our empirical observation only shows conjunction?"

  *   **Likely Dodge:** She will appeal to rational necessity or revelation as the source of this knowledge, distinct from empirical observation.
  *   **Follow-up:** "If reason or revelation tells us God is the cause, does that mean occasionalism is a fideistic doctrine? Can it be defended purely philosophically, or does it require prior theological commitment?"

  ### 9. The Utility of Supplication
  **Question:** "If God is the sole cause of all outcomes, why pray for specific outcomes? If I pray for rain, am I trying to change God's mind, or am I merely fulfilling a condition that God has habitually attached to the arrival of rain?"

  *   **Likely Dodge:** She will say prayer is a cause in the sense that God has habitually willed to grant requests when they are made.
  *   **Follow-up:** "But if God is timelessly eternal, does He really respond to the prayer, or did He just will the prayer and the rain together from eternity? If the latter, is prayer truly causal or just theatrical?"

  ### 10. Comparison with Malebranche (Closing)
  **Question:** "Listeners often flatten all occasionalists together. Malebranche uses occasionalism to solve the mind-body interaction problem in a Cartesian framework; you use it to protect divine sovereignty in an Islamic framework. Does this difference in motivation force a difference in the metaphysical structure of your occasionalism, or is the machinery identical?"

  *   **Likely Dodge:** She will likely say the core metaphysical claim (no created causation) is identical, even if the motivations differ.
  *   **Follow-up:** "If the machinery is identical, do you inherit Malebranche's problems with the 'Vision in God' and the loss of human agency? Or does your framework have resources to block those specific conclusions that Malebranche lacked?"
