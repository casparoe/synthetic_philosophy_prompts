answer: |-
  **The Purpose of Plenty: Keynes, Moore, and the Architecture of the Good Life**

  In the popular imagination, John Maynard Keynes is often reduced to a caricature: the brilliant macroeconomist whose utopian forecast in *Economic Possibilities for our Grandchildren* (1930) failed to materialize. We are told he predicted a fifteen-hour workweek by 2030 and got it wrong. But to view Keynes merely as a failed futurist is to miss the moral architecture underpinning his economics. For Keynes, the solution to the "economic problem" was not an end in itself; it was a prerequisite for a specific ethical vision. That vision, absorbed from G. E. Moore's *Principia Ethica*, prioritized "timeless, passionate states of contemplation" over material accumulation. Yet, in his 1938 memoir *My Early Beliefs*, written as the shadow of fascism lengthened over Europe, Keynes confessed that he and the Bloomsbury group had dangerously underestimated the "insane and irrational springs of wickedness" in human nature, discarding ordinary moral rules in favor of pure aesthetic states.

  Reading these two texts together reveals a tension between the conditions required for the good life and the human nature that threatens to undermine them. While the failure of the fifteen-hour week is best explained by the economic mechanisms Keynes identified in 1930—specifically the insatiability of relative needs—the deeper lesson lies in his 1938 ethical reckoning. Contrary to the charge that the Moorean ideal was a naive mistake, we should argue that the Moorean conception of the good life remains the only defensible *telos* for economic progress, provided we reject the Bloomsbury indifference to the political and moral rules required to secure it. The ideal was not wrong; its insulation from the machinery of justice was.

  To understand why growth has not delivered leisure, we must weigh the diagnostic power of Keynes's 1930 economics against his 1938 psychology. In *Economic Possibilities*, Keynes distinguished between "absolute needs" (food, shelter, warmth), which are satiable, and "relative needs" (status, superiority), which are insatiable. He predicted that once absolute needs were met, the motive for accumulation would vanish. He was right about absolute needs; in the developed world, material scarcity has largely been conquered. Yet, we work as much as ever. This is not primarily because humans are inherently wicked (the 1938 point), but because the economic structure of status competition (the 1930 point) has intensified. In a capitalist economy, income is not just a means to consumption but a scorecard of social worth. As long as wealth determines status, the "love of money" cannot be relegated to a vice; it remains a functional necessity for social standing.

  However, the 1938 psychological critique explains why this economic trap has not been politically resolved. Even if relative needs drive individuals to work, a society could theoretically choose to distribute productivity gains as leisure rather than income. That we have not done so reflects the "wickedness" Keynes later acknowledged: the power dynamics that allow capital holders to capture productivity gains while laborers face stagnation. The 1930 essay identifies the *engine* of continued work (relative needs), but the 1938 memoir identifies the *barrier* to reform (the refusal to bind power with rules). Thus, while the economic mechanism is the proximate cause of the missing leisure, the psychological realism of the later text explains the political paralysis that allows the economic mechanism to dominate.

  This leads to the harder, normative question: Does Keynes's later admission of naivety invalidate the Moorean ideal itself? The Moorean creed Keynes describes is one of private, contemplative states—love, beauty, knowledge—pursued with indifference to consequences, rules, or public achievement. Keynes's later self-critique suggests that ignoring "ordinary moral rules" left his circle vulnerable to the rise of totalitarian evil. Does this mean the ideal of contemplative leisure is itself a mistake, a bourgeois fantasy that crumbles in the face of real-world conflict?

  We should defend the Moorean ideal against this charge, though with a crucial modification. The Moorean vision is not a mistake; it is the necessary justification for economic progress. Without a conception of the good life that exists *outside* of production and accumulation, economics becomes a circular logic where growth serves only more growth. Keynes's 1930 essay argues that the love of money is a "disgusting pathology" to be endured only until the economic problem is solved. If we discard the Moorean end—contemplation, art, human connection—we lose the criterion by which to judge the pathology cured. To claim the ideal is a mistake because it is private is to succumb to the very productivism Keynes warned against. It implies that human value is found only in public action, struggle, or rule-following, rather than in the quality of conscious experience.

  However, defending the ideal requires acknowledging where Keynes's early circle erred. The mistake was not valuing "states of mind," but believing those states could be cultivated in a moral vacuum. The Bloomsbury interpretation of Moore suggested that because the *end* was private contemplation, the *means* (social rules, conventions, duties) were irrelevant. Keynes's 1938 confession admits this was dangerous. A society that prioritizes private aesthetic states while ignoring the "springs of wickedness" creates a fragile paradise. It relies on the stability provided by others who *do* follow rules, or it blinds itself to the suffering required to sustain its leisure. Therefore, the Moorean ideal is valid as a definition of human flourishing, but invalid as a comprehensive political ethic. We must endorse the *ends* of Moore (contemplation, love) but secure them through the *means* he scorned (justice, institutions, moral rules).

  The strongest opposing view to this position comes from a civic republican or activist perspective. This critic would argue that a "good life" defined by private contemplation is inherently elitist and complicit. In a world of structural injustice, climate crisis, and rising authoritarianism, the pursuit of "timeless states of contemplation" is not merely naive; it is morally bankrupt. To retreat into the private sphere is to abandon the public square to the wicked. From this viewpoint, the good life must be defined by active citizenship, solidarity, and the struggle for justice, not by the consumption of beauty or knowledge. To endorse Keynes's 1930 vision is to endorse a world where the few enjoy leisure on the backs of the many, or where we ignore the burning library to read a book.

  This objection is powerful, but it ultimately conflates the *content* of the good life with the *conditions* necessary to achieve it. The civic critic is right that we cannot *achieve* the Moorean good without addressing wickedness and injustice. But they are wrong to suggest that the *activity* of contemplation is less valuable than the activity of political struggle. If political struggle does not aim at a state of affairs where humans can eventually rest, love, and think freely, then struggle becomes an end in itself—a secularized Puritanism indistinguishable from the "love of money" Keynes despised. The Moorean ideal provides the *reason* for the civic struggle. We fight against "wickedness" precisely so that "timeless states of contemplation" become possible for all, not just a privileged few.

  Furthermore, the civic critique risks reproducing the error of the Bloomsbury group in reverse. Just as Keynes's early circle ignored the structural rules needed to protect their contemplation, the civic critic risks ignoring the human need for rest and private meaning. A politics that demands total immersion in public struggle creates its own pathology, one that can easily slide into the totalitarian mobilization Keynes feared in 1938. The Moorean insistence that there are values *intrinsic* to human experience, independent of their utility to the state or the economy, is a vital bulwark against totalitarianism.

  Therefore, the synthesis of Keynes's two texts offers a robust framework for the present. The 1930 essay correctly identifies that material abundance should liberate us from the "useful evil" of accumulation. The failure to achieve this is largely due to the economic reality of relative needs, which turn status into a zero-sum game. The 1938 memoir correctly identifies that this liberation cannot happen without a sober recognition of human wickedness and a commitment to binding social rules.

  We should not discard the Moorean ideal because it is private; we should democratize it. The goal of economic policy should be to create the material and institutional preconditions—shorter workweeks, social safety nets, protection from predation—that allow the maximum number of people to pursue Moorean ends. Keynes was right that the love of money is a vice, but he was initially wrong to think it would wither away on its own. It must be restrained by the very rules his early circle scorned. The good life is indeed found in love, beauty, and knowledge. But in a world of "insane springs of wickedness," those flowers can only bloom if we build a fence around the garden. The ideal was not the mistake; the mistake was thinking the garden could tend itself.
