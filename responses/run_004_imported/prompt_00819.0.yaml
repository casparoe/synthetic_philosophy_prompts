      *   **Marcus (Narrativist):** Needs to avoid the "anything goes" story-telling caricature. He should focus on agency, contingency, and the specific configuration of events (colligation). He needs to challenge the *explanatory power* of the law when faced with divergence.

  3.  **Drafting - Section by Section:**

