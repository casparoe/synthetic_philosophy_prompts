prompt: |-
  I've got a philosopher coming on my podcast next week whose new book defends virtue ethics against the situationist critique (the Doris/Harman line, built on stuff like Milgram and the Good Samaritan study). His go-to move, in literally every interview he's done, is that those experiments just show behavioral variability across situations, not the absence of a stable evaluative outlook -- so they're talking past what Aristotelians actually claim. Give me 8-10 questions that don't let him coast on that line. I want one on whether virtue ethics itself is guilty of the fundamental attribution error it pins on folk psychology, one on whether his "content of character" dodge (following Kamtekar) just makes trait ascriptions unfalsifiable -- make him deal with Epstein's aggregation-principle defense so he can't just say the studies are too narrow -- and one on whether Aristotle's own claim that full virtue is rare basically concedes the situationists' empirical point while insisting its not a problem for the theory. Tack a quick follow-up onto each of those three, keyed to whatever dodge he'll probably reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** Philosopher defending virtue ethics against situationist critique (Doris/Harman).
      *   **Context:** Podcast interview.
      *   **Guest's Standard Move:** Experiments show behavioral variability, not lack of stable evaluative outlook (talking past Aristotelians).
      *   **Goal:** 8-10 questions that prevent him from coasting on this standard line.
      *   **Specific Requirements:**
          *   One question on whether virtue ethics commits the Fundamental Attribution Error (FAE) itself. (With follow-up).
          *   One question on whether the "content of character" defense (Kamtekar) makes traits unfalsifiable. (With follow-up).
          *   One question forcing him to deal with Epstein's aggregation principle (can't just say studies are too narrow). (With follow-up).
          *   One question on Aristotle's claim that full virtue is *rare* (conceding the empirical point). (With follow-up).
          *   Total: 8-10 questions (including the 4 main ones + follow-ups).
      *   **Tone:** Sharp, philosophically rigorous, podcast-friendly (engaging).

  2.  **Deconstruct the Situationist Critique & Virtue Ethics Defense:**
      *   *Situationists (Doris/Harman):* Empirical evidence (Milgram, Stanford Prison, Good Samaritan) shows behavior is determined by situational factors, not global character traits. Therefore, global traits don't exist. Folk psychology and virtue ethics rely on non-existent traits.
      *   *Virtue Ethicist Defense:* Aristotelian virtues aren't just behavioral regularities; they involve practical wisdom (*phronesis*) and a stable evaluative outlook. The experiments test narrow behaviors, not deep character. Also, Aristotle admits virtue is rare, so the fact that most people fail the experiments doesn't refute the *concept* of virtue.
      *   *The "Epstein" Angle:* Seymour Epstein argued that while single situations are noisy, aggregating behavior across many situations reveals stable traits. Situationists often dismiss single studies; virtue ethicists might lean on aggregation. But if the guest says "studies are too narrow," he needs to address what *would* count as evidence if aggregation doesn't save the day.
      *   *The "Kamtekar" Angle:* Rachana Kamtekar argues situationists misidentify the content of character. Character isn't just "helping when asked," it's "valuing helping." This risks making character internal and unobservable (unfalsifiable).
      *   *The "FAE" Angle:* The FAE is over-attributing behavior to disposition and under-attributing to situation. If virtue ethics insists dispositions explain behavior despite situational pressure, is *it* committing the FAE?
      *   *The "Rarity" Angle:* If Aristotle says only the *phronimos* is truly virtuous and they are rare, does this admit that for 99% of people, situationist psychology is correct? Does this make virtue ethics elitist or practically irrelevant?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: FAE.*
          *   *Draft:* Do you commit the FAE?
          *   *Refinement:* Make it sharper. The situationists say *folk psychology* commits FAE. If VE says traits exist despite situational variance, isn't VE doubling down on FAE?
          *   *Follow-up:* He'll say "No, because we acknowledge situation." Counter: But you still prioritize the trait as the explanatory unit.

      *   *Requirement 2: Kamtekar/Unfalsifiability.*
          *   *Draft:* Isn't Kamtekar's view unfalsifiable?
          *   *Refinement:* If character is an "evaluative outlook" rather than behavioral prediction, how do we test it? If someone fails every test but claims the right outlook, do they have the virtue?
          *   *Follow-up:* He'll say "We look at reasoning." Counter: Isn't that just introspection, which is notoriously unreliable (Nisbett/Wilson)?

      *   *Requirement 3: Epstein/Aggregation.*
          *   *Draft:* What about Epstein's aggregation?
          *   *Refinement:* Situationists say single acts don't show traits. Epstein says aggregating many acts does. If you accept Epstein, you admit single acts (like Milgram) don't refute traits. But if you *reject* Epstein to say Milgram is irrelevant, aren't you moving the goalposts?
          *   *Follow-up:* He'll say "We need broader situations." Counter: What specific behavioral pattern *would* falsify virtue for you?

      *   *Requirement 4: Aristotle's Rarity.*
          *   *Draft:* Aristotle says virtue is rare. Does that concede the point?
          *   *Refinement:* If only the sage is virtuous and everyone else fails the experiments, isn't VE just saying "Real traits exist for imaginary people"?
          *   *Follow-up:* He'll say "It's an ideal." Counter: Then why base moral education on it?

      *   *Filling the rest (to get to 8-10):*
          *   Need questions on Moral Education (if traits are fragile, how do we teach them?).
          *   Need questions on the definition of "Global" traits (are they local?).
          *   Need questions on the normative vs. descriptive gap.
          *   Need a closing question on practical implications.

  4.  **Refining and Polishing:**
      *   Ensure the tone is respectful but challenging ("steel-manning" the objection before hitting hard).
      *   Check the follow-ups. They need to anticipate the specific "standard move" mentioned in the prompt (behavioral variability vs. evaluative outlook).
      *   Ensure the Epstein question is clear because that's a technical point.
      *   Make sure the Kamtekar question addresses the "dodge."

  5.  **Final Review against Constraints:**
      *   8-10 questions total? Yes (4 main + 4 follow-ups = 8, plus 2 extras to round out).
      *   Specific topics covered? (FAE, Kamtekar/Unfalsifiability, Epstein/Aggregation, Rarity).
      *   Follow-ups included for the specific three? Yes.
      *   Prevents coasting on "variability vs. outlook"? Yes, by challenging the link between outlook and behavior.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the Epstein question doesn't get too bogged down in psychometrics. Keep it philosophical: If aggregation works, traits are real. If it doesn't, what's your defense?
      *   *Correction:* Ensure the "Rarity" question doesn't just sound like "Aristotle was wrong." It needs to be "Does this make the theory empirically vacuous for most humans?"
      *   *Addition:* Add a question about *fragmentation* of the self. If virtues aren't global, are they local? If local, how do we navigate conflicting situations?

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are 10 questions designed to corner the "evaluative outlook" defense without being hostile. They are structured to move from the empirical psychology to the metaphysical commitments of virtue ethics, with the required follow-ups embedded.

  ### 1. The Fundamental Attribution Error (FAE) Trap
  "Situationists argue that folk psychology commits the Fundamental Attribution Error: we over-attribute behavior to disposition and under-attribute it to situation. But if virtue ethics insists that a stable character trait is the *primary* explanatory factor for why an agent acts rightly—even in the face of situational pressure—aren't you simply codifying the FAE into a normative theory? If the situationist data shows situational variables are better predictors of behavior than trait ascriptions, isn't virtue ethics betting on the wrong horse?"

  *   **Follow-up:** "I anticipate you'll say virtues aren't just behavioral predictors but involve *phronesis* or practical wisdom. But if that wisdom doesn't reliably cash out in behavior across varying situations, in what sense is it 'stable'? Are you positing a ghost in the machine that remains constant even when the physical output varies?"

  ### 2. The Kamtekar "Content of Character" Dodge
  "You've followed Rachana Kamtekar in arguing that situationists misidentify the content of character. They look for behavioral regularities; you look for a stable 'evaluative outlook.' But doesn't this move risk making virtue ascriptions unfalsifiable? If I fail the Good Samaritan test, the Milgram test, and the Stanford Prison test, but I insist my 'evaluative outlook' values kindness, on what empirical grounds can you deny I have the virtue?"

  *   **Follow-up:** "You'll likely say we look at their reasoning or justification. But given the Nisbett and Wilson data on introspection—that people are often wrong about *why* they act—why should we trust the agent's report on their 'evaluative outlook' over the actual behavioral data?"

  ### 3. The Epstein Aggregation Principle
  "Let's talk about Seymour Epstein's aggregation principle. He argued that while single situations are noisy, aggregating behavior across *many* situations reveals stable traits. Situationists often dismiss single studies like Milgram. But if you lean on Epstein to save traits, you admit traits are statistical aggregates of behavior. If you *reject* Epstein to say Milgram is irrelevant to character, aren't you moving the goalposts? Which is it: do virtues predict aggregated behavior, or are they immune to behavioral stats altogether?"

  *   **Follow-up:** "If you say they predict aggregated behavior, then situationist data showing low cross-situational consistency *does* hurt you. If you say they are immune, then what work is the 'virtue' doing? I need a clear answer: What specific behavioral pattern, observed across time, would finally convince you that a specific virtue trait does *not* exist?"

  ### 4. Aristotle's Rarity Concession
  "Aristotle explicitly claims that full virtue (*phronesis*) is exceedingly rare. In a way, this seems to concede the situationist's empirical point: for 99% of the population, behavior *is* driven by situational cues, not stable character. By retreating to the 'rare sage,' aren't you admitting that virtue ethics is empirically accurate only for people who arguably don't exist?"

  *   **Follow-up:** "Your standard reply is that it's a normative ideal, not a descriptive average. But if the psychology required to achieve the ideal is contradicted by the actual psychology of human beings, isn't your moral education program built on a false model of the mind? How do you train for a stability that human psychology seems structurally incapable of supporting?"

  ### 5. Fragmentation vs. Integration
  "Situationists like Doris suggest we don't have global traits (like 'Honesty'), but rather local fragments (like 'Honesty-when-it's-easy-and-no-one-is-watching'). If you grant this fragmentation to accommodate the data, doesn't the virtue ethics project collapse? The whole point of *eudaimonia* is the unity of virtue. If my character is just a patchwork of local situational responses, where is the 'self' that is supposed to be flourishing?"

  ### 6. The Normative/Descriptive Gap
  "Let's step back. Even if the situationists are right that global traits are empirically rare or non-existent, does that matter for *normative* ethics? Can't you argue that virtue ethics tells us what we *ought* to cultivate, regardless of whether current psychology says we can? Or does an 'ought implies can' constraint force you to engage deeper with the empirical limitations?"

  ### 7. Moral Education and Situation Design
  "If situational factors are the dominant drivers of behavior, as the data suggests, shouldn't virtue ethics pivot? Instead of focusing on 'building character' inside the agent, shouldn't the focus be on 'designing situations' that elicit good behavior? Is your defense of traits actually an obstacle to more effective, situationist-inspired moral interventions?"

  ### 8. The "Talking Past" Charge
  "You argue situationists are talking past Aristotelians because they define traits behaviorally while you define them psychologically. But isn't this a verbal shield? If a 'psychological state' doesn't have a robust, counterfactual-supporting connection to action, why call it a 'virtue' rather than a 'preference'? What is the cash value of the trait if it doesn't secure the action?"

  ### 9. Consistency and Moral Responsibility
  "We hold people responsible based on the assumption that their actions flow from who they *are*. If situationism is correct, and my actions flow from where I *am*, does moral responsibility survive? If you defend virtue to save responsibility, aren't you engaging in a kind of wishful thinking about human agency?"

  ### 10. The "Real World" Stress Test
  "Finally, in your book, you discuss real-world exemplars. But situationists would argue that when we look closely at those exemplars, their virtue is often domain-specific. A war hero might be a terrible father; a honest accountant might cheat on taxes. If virtues don't transfer across domains, is the Aristotelian idea of the 'unified life' just a myth we tell ourselves to make sense of chaos?"
