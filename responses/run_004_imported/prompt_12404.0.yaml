      *Let's write it.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Mara's. And looking around this room, I realize I have a unique challenge. Roughly half of you are epistemologists. The other half are family, friends, and Mara's editor, who are just happy to see her in a venue that doesn't serve stale coffee at two in the morning.

  So, I promise to keep the jargon to a minimum. Although, given the occasion, a little jargon is unavoidable. Because to understand why this book is so brilliant, you have to understand the fight we had last week.

  It was the night before Mara sent off her final proofs. We were exhausted. The coffee was cold. And we were screaming—affectionately, mostly—about a single sentence in the preface. Mara wanted to write: *"I believe every claim defended in this book, and I am equally confident that a book this long contains at least one error I failed to catch."*

  Now, to the non-philosophers in the room: That sounds reasonable, right? It sounds humble. But to the philosophers here, that sentence is basically a flare gun. It's what's known as the "Preface Paradox."

  Here's the problem I gave her. I told her, "Mara, this is exactly the same as the Lottery Paradox." Imagine a lottery with a thousand tickets. It is rational to believe of Ticket 1 that it will lose. And Ticket 2. And Ticket 3. If you believe that of all thousand tickets, you believe *none* of them will win. But you also know one of them *must* win. So, you hold a set of beliefs that you know are contradictory. Philosophers hate that. It's messy. I told her, "You can't publish a book that says, 'I believe X' and 'I believe not-X' on page two."

  Mara refused to blink. She looked at me over those cold cups of coffee and said, "A lottery is statistical. Every ticket has the exact same odds based on the same math. My book isn't a lottery."

  She argued that every claim in this book rests on its own specific evidence, its own argument, its own chain of reasoning. Claim 42 isn't linked to Claim 43 by a roll of the dice; they are linked by a train of thought. She insisted that admitting the high probability of a human error somewhere doesn't undermine the specific evidence for any single claim.

  I spent an hour trying to talk her out of it. I was the guy at the party explaining why the joke isn't funny. I thought she was being stubborn. I thought she was inviting a contradiction into her life just to be provocative.

  But standing here today, three days later, I've changed my mind. I think Mara was right, and I was wrong.

  I was treating her book like a game of chance. I was treating her claims like lottery tickets. But a book isn't a lottery. A lottery is designed so that most people lose. A book like this is designed so that the truth wins. Mara's point—and the reason this book matters—is that we can hold two things in our head at once without collapsing. We can stand firmly behind our work, claim by claim, while acknowledging that we are human beings working within a system that is larger than us.

  That isn't a contradiction. It's integrity.

  It takes a specific kind of courage to say, "I have fought for every word on these pages," and also say, "I am not infallible." Most people pick one. They either pretend they never make mistakes, or they apologize so much for potential mistakes that they undermine the work they actually did. Mara is doing both. She is claiming her authority and her fallibility in the same breath.

  To the philosophers in the room: Yes, I know the literature. I know Makinson. I know Kyburg. But maybe the solution isn't to fix the logic. Maybe the solution is to recognize that rational belief isn't just about probability math; it's about the source of the evidence. Mara's evidence isn't a statistic. It's her mind.

  To the rest of you: This book is the result of someone who thinks harder about what she knows than anyone I've ever met. She argued with me for two hours about one sentence so that she could be honest with you.

  So, if you could all raise a glass.

  To Mara. May your claims be sound, may your errors be few, and may you never stop arguing with me about the difference between a lottery ticket and the truth.

  Cheers!
