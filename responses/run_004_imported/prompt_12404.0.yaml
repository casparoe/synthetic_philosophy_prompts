      *   No "we are all fallible" cliché? Yes, focus on the *nature* of the belief.
      *   Explain paradoxes? Yes.
      *   Generous to Mara? Yes.
      *   Speaker's shift included? Yes.

      *(Drafting the content now...)*
      *   Start with the divide in the room.
      *   Tell the coffee story.
      *   Explain the Lottery (easy).
      *   Explain the Preface (Mara's case).
      *   The "Aha" moment (why they differ).
