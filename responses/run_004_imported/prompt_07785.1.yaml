  G.E. Moore bursts into Wittgenstein's study, waving his hands. "Ludwig! I know I have hands! I know the earth exists! Skepticism is dead!"

  Wittgenstein doesn't look up from his manuscript. "G.E., you know none of those things."

  "But they're true!" Moore protests.

  "Truth isn't the issue. You're treating grammatical rules as empirical discoveries. You can't 'know' the framework that makes knowing possible."

  "So I'm uncertain?"

  "No," Wittgenstein replies. "You're just trying to use the ruler to measure itself. It's not that you're wrong; it's that 'knowing' isn't the job those propositions do."

  This joke relies on Wittgenstein's objection to Moore being a matter of misclassification rather than falsehood, specifically that Moore mistakes the grammatical scaffolding of inquiry for an empirical claim within that inquiry.
