answer: |-
  Here are ten interview questions designed to bridge your background in distributed systems with your guest's expertise in Lewisian philosophy. They are structured to move from foundational analogies to specific critiques, ending with the falsifiability of the theory.

  ### 1. The Engineer's Definition vs. The Philosopher's Definition
  "In distributed systems, when we talk about consensus or leader election, we are usually solving for safety and liveness properties under specific fault models. We treat coordination as a constraint satisfaction problem. Lewis, however, treats convention as an equilibrium selection problem among rational agents. Do you see a category error when engineers like me talk about 'conventions' in protocols, or is the mathematical structure of the coordination problem identical regardless of whether the nodes are servers or humans?"

  *   **Follow-up:** "If you say they are distinct, is the difference purely in the *intent* of the agents, or does the lack of 'common knowledge' in asynchronous systems mean true Lewisian convention is actually impossible in the tech I build?"

  ### 2. The Psychological Realism of Common Knowledge (Required)
  "Lewis defines convention as relying on 'common knowledge'—a state where I know X, you know X, I know that you know X, and so on *ad infinitum*. In computer science, we know true common knowledge is impossible to achieve in asynchronous systems (the FLP impossibility result). Critics argue this infinite hierarchy is also psychologically unrealistic for humans. Is the common-knowledge clause a fatal bug in Lewis's model, or is it a necessary idealization like frictionless planes in physics?"

  *   **Follow-up (Keyed to likely defense):** "You'll likely argue it's a functional idealization—that humans act *as if* they have common knowledge. But if it's just an 'as if' state, what is the cognitive threshold? At what finite level of recursion ('I know that you know that I know') does the convention actually snap into place?"

  ### 3. Salience as the Bootstrapping Mechanism
  "If we accept that infinite recursion is unrealistic, Lewis relies on 'salience' to bootstrap the first level of expectation. We coordinate on the focal point because it stands out. But salience seems deeply cultural and subjective. Does relying on salience to solve the regress problem smuggle a normative premise into the theory? In other words, does something become salient because it's natural, or because we already feel a normative pull toward it?"

  *   **Follow-up:** "If salience is culturally constructed, does that mean conventions are always exclusionary? Does a Lewisian convention inherently create an 'out-group' of agents who don't share the salience cues?"

  ### 4. Gilbert's Challenge: Fault vs. Mistake (Required)
  "Margaret Gilbert argues that Lewis reduces convention to individual preferences and expectations, which fails to capture the normativity of social life. If I drive on the wrong side of the road, I haven't just made a coordination error; I've done something *wrong*. I am blameworthy, not just inefficient. Can a framework built on individual expectations ever explain why breaking a convention feels like a moral fault rather than a mere mistake?"

  *   **Follow-up (Keyed to likely defense):** "You will likely argue that the blame arises from the disappointment of expectations and the resulting harm. But doesn't that reduce moral obligation to prudence? If I could break the convention secretly without anyone knowing or being harmed, Lewis seems to say I've done nothing wrong. Is that a bullet you're willing to bite?"

  ### 5. The "Alternative" Clause and Critical Infrastructure
  "Lewis insists that for a regularity to be a convention, there must be at least one viable alternative equilibrium. We drive on the right, but we *could* have driven on the left. But consider conventions in critical infrastructure, like nuclear launch protocols or banking settlement layers. The alternative to the current protocol isn't just a different equilibrium; it's often catastrophe. Do these 'no-alternative' regularities fall outside Lewis's definition, or does the theory break down when the cost of non-coordination approaches infinity?"

  *   **Follow-up:** "If you argue they are still conventions because the alternative was viable *historically*, at what point does a convention harden into a law of nature? Is there a phase change where coordination becomes coercion?"

  ### 6. Evolutionary Dynamics vs. Rational Equilibrium (Required)
  "Brian Skyrms and others have modeled the emergence of convention using evolutionary game theory and learning dynamics. In these models, agents don't need common knowledge or high-level rationality; they just reinforce successful strategies over time. Should a Lewisian worry that Skyrms explains the *genesis* of convention without invoking the heavy machinery of common knowledge, or do you view these as complementary accounts of different time-scales?"

  *   **Follow-up (Keyed to likely defense):** "If you view them as complementary—Skyrms for the path, Lewis for the destination—does the *stability* of that destination still require common knowledge? Or can a convention remain stable purely through blind reinforcement, rendering the epistemic state of the agents irrelevant?"

  ### 7. Tacit vs. Explicit Agreement
  "Lewis focused heavily on *tacit* convention—agreements without words. But in my field, and increasingly in society, coordination is enforced by explicit code: smart contracts, terms of service, and API specifications. When the coordination mechanism is hard-coded, does the philosophical work of 'convention' disappear? Is a blockchain consensus mechanism a Lewisian convention, or is it something else entirely?"

  *   **Follow-up:** "If it is a convention, who are the agents? Is it the developers who wrote the code, or the nodes executing it? If the nodes are mindless, can there be a convention without a mind to hold the expectation?"

  ### 8. The Problem of Convention Drift
  "Lewis's model is excellent at explaining why a convention *persists* once established. It is less clear on how conventions *die* or drift. In distributed systems, we have hard forks to handle disagreement. In social systems, conventions shift gradually. Does the common-knowledge requirement make it too hard to explain change? If we all know we all know the rule, how does anyone get the signal that it's safe to start breaking it?"

  *   **Follow-up:** "Does this imply that social change requires a temporary breakdown of common knowledge? Do we need a period of 'plausible deniability' to transition between equilibria?"

  ### 9. The Scope of the "Population"
  "In game theory, we define the population playing the game. But in a globalized world, conventions overlap and conflict. I might follow one convention in my professional community and a conflicting one in my local community. Does Lewis's framework require closed populations to function? How do we model the boundaries of a convention when the 'common knowledge' doesn't extend beyond my immediate social cluster?"

  *   **Follow-up:** "If conventions are local, does 'society' exist as a coordinated whole, or is it just a patchwork of overlapping micro-conventions that happen not to crash into each other yet?"

  ### 10. Falsifiability and the "Mis-specified Problem" Dodge (Required Closing)
  "I want to close on the scientific status of the theory. If we observe a group coordinating without apparent common knowledge, a Lewisian can always say, 'You've mis-specified the coordination problem; the common knowledge was there, you just didn't see it.' This risks making the theory unfalsifiable. Putting aside theoretical arguments, what empirical evidence would actually count *against* the common-knowledge requirement? What would you have to see to admit that Lewis got this specific clause wrong?"

  *   **Follow-up:** "If the answer is 'nothing,' because common knowledge is a theoretical construct rather than an observable variable, should we be teaching it as a description of human psychology, or purely as a normative logic of rationality?"
