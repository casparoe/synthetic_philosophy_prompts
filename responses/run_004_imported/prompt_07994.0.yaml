prompt: |-
  I co-host a small podcast on formal approaches to social behavior, and I came to this material sideways: I build consensus and leader-election protocols for distributed systems, so 'coordination problem' and 'Schelling point' were already part of my vocabulary before I'd read any philosophy. Next episode's guest is a philosopher who has spent her career defending and updating David Lewis's 1969 game-theoretic analysis of convention against its critics. Draft eight to ten interview questions that go beyond having her restate the official definition (a regularity sustained by common knowledge of mutual expectations, solving a recurring coordination problem that has at least one viable alternative). I want one question on whether the common-knowledge clause demands something psychologically unrealistic, given the infinite hierarchy of mutual expectations it seems to invoke; one on Margaret Gilbert's charge that reducing convention to individual expectations and preferences can't explain why breaking one feels like a fault rather than a mere mistake; and one on whether evolutionary and learning-dynamics treatments of coordination, of the sort Brian Skyrms works out without invoking common knowledge at all, should worry a Lewisian or simply supplement the picture. Give each of these a follow-up keyed to the answer she's most likely to give, and close with a question about what would actually count as evidence against the common-knowledge requirement -- 'the coordination problem was mis-specified' is a tempting way to wave away almost any counterexample.
