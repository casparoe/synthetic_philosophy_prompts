answer: |-
  You have hit on one of the deepest and most contentious philosophical fault lines in modern mathematics. Your intuition is not wrong—in fact, it aligns perfectly with a major school of thought called **Formalism** or the **Multiverse View**. However, the reason your friend is also right (that people like W. Hugh Woodin still care) is that there is a competing school of thought called **Platonism** (or the **Universist View**).

  The short answer is: You aren't missing a mathematical fact, but you are encountering a philosophical disagreement about what mathematics *is*.

  Here is the breakdown of why the geometry analogy works for some set theorists but fails for others, and why the search for new axioms isn't just "taste."

  ### 1. The Geometry Analogy: Where it holds and where it breaks
  Your professor's analogy is the standard introduction to independence.
  *   **The Parallel Postulate:** We realized there isn't one "Geometry." There are Riemannian manifolds, Euclidean spaces, Hyperbolic spaces, etc. Asking "Is the parallel postulate true?" is meaningless without specifying *which* space you are talking about.
  *   **The Multiverse View of Sets:** This is your view (and the view of set theorists like Joel David Hamkins). They argue that there is no single "Universe of Sets" ($V$). There are many models of ZFC, just as there are many geometries. In some models CH is true, in others false. Therefore, CH has no absolute truth value.

  **So why do Platonists disagree?**
  The difference lies in the *intended interpretation* of the axioms.
  *   When we study geometry, we usually acknowledge upfront that we are studying abstract structures that *might* model physical space.
  *   When we study ZFC, many set theorists believe they are studying **the** cumulative hierarchy of sets. They believe there is a single, objective reality of sets that exists independently of human axioms. In this view, ZFC is not the definition of "set"; it is merely an incomplete description of "the" Universe of Sets ($V$).

  If you believe $V$ is a real, specific object (in a mathematical sense), then CH is either true of $V$ or false of $V$. The fact that ZFC can't decide it just means ZFC is too weak, not that the question is meaningless. It's like having a blurry photograph of a coin: the fact that you can't see the heads or tails doesn't mean the coin doesn't have a side facing up.

  ### 2. Why search for new axioms? (It's not just taste)
  If set theorists were just picking axioms based on taste, it would be aesthetics, not math. But the search for new axioms is driven by **justification**. There are two main types:

  **A. Intrinsic Justification**
  Does the axiom follow from the very *concept* of a set?
  For example, Large Cardinal Axioms are often accepted because they seem to naturally extend the hierarchy of infinity implied by ZFC. If a new axiom settles CH and is intrinsically justified, then CH is settled objectively.

  **B. Extrinsic Justification**
  Does the axiom make the theory "better"?
  This is where it gets technical. Mathematicians look for axioms that:
  1.  Settle many independent statements at once (not just CH).
  2.  Create a rich structure theory (e.g., descriptive set theory becomes much smoother under certain axioms).
  3.  Are consistent with all known large cardinals.

  For a long time, **Forcing Axioms** (like Martin's Maximum) were the favorite candidates. They imply $\neg$CH (CH is false). They are justified extrinsically because they make the universe of sets "saturated" and rich, solving many problems in analysis and topology.

  However, **Woodin's work** (which your friend mentioned) complicates this. Woodin has been working on a conjecture called **"Ultimate L."**
  *   Gödel constructed a model called $L$ (the Constructible Universe) where CH is *true*. But $L$ is considered "too thin"—it doesn't contain enough large cardinals to be the "real" $V$.
  *   Woodin is trying to find a canonical inner model that *does* accommodate large cardinals but still has the structural rigidity of $L$. If "Ultimate L" exists and is accepted as the correct description of $V$, it might imply CH is *true*.

  This isn't "taste." It's a rigorous search for a canonical structure that maximizes interpretability and coherence. If Woodin succeeds, he wouldn't just be saying "I like CH"; he would be arguing "This is the only coherent completion of the concept of set."

  ### 3. So, is it a category error?
  It depends on your philosophical commitment.

  *   **If you are a Formalist/Multiversist:** Yes, asking if CH is "really" true is a category error. It's like asking if a group is "really" abelian. It depends on the group. You should study the consequences of CH and $\neg$CH equally.
  *   **If you are a Platonist/Universist:** No, it is not a category error. It is an empirical (mathematical) question about the structure of $V$. We just lack the data (axioms) to solve it yet.

  ### 4. Why does this matter to working mathematicians?
  You might wonder, "Why should I care if I'm doing analysis or topology?"
  For most "ordinary" mathematics (Banach spaces, differential equations, number theory), CH is irrelevant. These statements are usually absolute.
  However, CH *does* affect parts of general topology, measure theory, and functional analysis. There are concrete questions about the structure of infinite matrices or the existence of certain weird subsets of real numbers that are undecidable without settling CH.

  ### Summary
  Your brain isn't broken; you've just graduated from "learning the math" to "doing the foundations."

  *   **Your view:** Consistent with the **Multiverse** perspective. CH is relative.
  *   **Your friend's view:** Consistent with the **Platonist** perspective. CH is absolute, ZFC is incomplete, and we need better axioms to describe reality.

  The reason set theorists like Woodin don't treat it as "meaningless" is that they believe there is a fact of the matter about the universe of sets, and their job is to find the axioms that reveal it. Whether they are right is arguably the biggest open question in the philosophy of mathematics.

  **Recommendation:** If this fascinates you, look up the **"Set-Theoretic Multiverse"** (Joel David Hamkins) vs. **"Universism"** (Penelope Maddy or Woodin). It's the modern battleground for exactly the confusion you're feeling.
