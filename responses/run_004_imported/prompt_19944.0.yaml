answer: |-
  This is a classic and fascinating dispute. You and your friend have stumbled onto one of the most significant problems in contemporary epistemology and metaphysics: **Fitch's Paradox of Knowability** (published by Frederic Fitch in 1963).

  You are both partially right. You are right that the unrestricted Knowability Principle leads to a conclusion that seems manifestly false (Omniscience). Your friend is right that the Knowability Principle feels intuitively correct for "normal" truths. The question is whether the logic forces us to abandon the principle entirely or if we can surgically restrict it.

  Here is the step-by-step derivation you asked for, followed by an assessment of whether your friend's restriction is a principled philosophical move or an ad hoc patch.

  ---

  ### Part 1: The Derivation (Step-by-Step)

  To reconstruct this yourself, you need a standard modal epistemic logic. We will use the following notation:
  *   $p$: Any proposition.
  *   $Kp$: "It is known (by someone, at some time) that $p$."
  *   $\Diamond p$: "It is possible that $p$."
  *   $\neg p$: "Not $p$."
  *   $\land$: "And."

  **The Assumptions (Premises):**
  1.  **Factivity of Knowledge:** $Kp \to p$
      *(If you know $p$, then $p$ is true. You can't know falsehoods.)*
  2.  **Distribution of Knowledge:** $K(p \land q) \to (Kp \land Kq)$
      *(If you know a conjunction, you know each part.)*
  3.  **Necessity of Logical Truths:** If a statement is logically contradictory, it is not possible ($\neg \Diamond$).
  4.  **The Knowability Principle (KP):** $p \to \Diamond Kp$
      *(If $p$ is true, it is possible to know $p$.)*

  **The Goal:**
  Prove that $p \to Kp$ (If $p$ is true, it is actually known). This is the "Omniscience Principle," which contradicts the modest assumption that there are some unknown truths.

  **The Proof:**

  **Step 1: Assume a specific proposition.**
  Let us assume there is a proposition $p$ such that:
  $$p \land \neg Kp$$
  *(Translation: "$p$ is true, but it is not known.")*
  This is the assumption of "unknown truths." Your friend wants to say this is possible. We will show that KP makes this impossible.

  **Step 2: Apply the Knowability Principle (KP).**
  If $(p \land \neg Kp)$ is true, then by KP, it must be *possible* to know it.
  $$(p \land \neg Kp) \to \Diamond K(p \land \neg Kp)$$

  **Step 3: Analyze the possibility of knowing the conjunction.**
  For $\Diamond K(p \land \neg Kp)$ to be true, there must be some possible world where someone knows $(p \land \neg Kp)$. Let's look at what it means to know that conjunction in that world.
  $$K(p \land \neg Kp)$$

  **Step 4: Distribute Knowledge.**
  Using Assumption #2 (Distribution), if someone knows the conjunction, they know each part:
  $$Kp \land K(\neg Kp)$$
  *(They know $p$, AND they know that $p$ is not known.)*

  **Step 5: Apply Factivity.**
  Using Assumption #1 (Factivity), if they know something, it must be true.
  *   From the left side ($Kp$): We get $p$.
  *   From the right side ($K(\neg Kp)$): We get $\neg Kp$.
      *(If you know that "$p$ is not known," then it is a fact that "$p$ is not known".)*

  **Step 6: Identify the Contradiction.**
  Now look at what we have derived from the assumption that someone knows $(p \land \neg Kp)$:
  1.  $Kp$ (From Step 4)
  2.  $\neg Kp$ (From Step 5)

  This is a contradiction ($Kp \land \neg Kp$). It is logically impossible to know $p$ while simultaneously knowing that $p$ is not known.

  **Step 7: Back out to Possibility.**
  Since $K(p \land \neg Kp)$ entails a contradiction, it is impossible.
  $$\neg \Diamond K(p \land \neg Kp)$$

  **Step 8: Modus Tollens on the Knowability Principle.**
  Recall Step 2: $(p \land \neg Kp) \to \Diamond K(p \land \neg Kp)$.
  Since the consequent (the possibility part) is false (Step 7), the antecedent must be false.
  $$\neg (p \land \neg Kp)$$

  **Step 9: Logical Equivalence.**
  $\neg (p \land \neg Kp)$ is logically equivalent to:
  $$p \to Kp$$
  *(If $p$ is true, then $p$ is known.)*

  **Conclusion:**
  If you accept the Knowability Principle, you are logically forced to accept that **all truths are already known.** Since it is absurd to think all truths are known (e.g., the exact number of grains of sand on a beach no one has counted), the Knowability Principle (as stated) must be false.

  ---

  ### Part 2: Assessing the Restriction

  Your friend suggested restricting the Knowability Principle to "ordinary" propositions, excluding self-referential ones like "$p$ is true and unknown."

  Is this an **ad hoc patch** (invented solely to save the theory) or a **principled move** (based on a deeper understanding of truth)?

  #### The Case for "Ad Hoc" (Your Position)
  You have strong grounds for skepticism.
  1.  **The "No Special Pleading" Rule:** In logic, if a principle claims to apply to *all* truths ($\forall p$), carving out exceptions exactly where the proof breaks looks suspicious. It resembles saying, "All men are mortal, except for the ones who aren't."
  2.  **Generality of Truth:** Anti-realism usually claims that truth *is* epistemic warrant. If the nature of truth is tied to knowability, why would some truths be exempt from this nature? If "$p \land \neg Kp$" is a truth, why shouldn't it be subject to the same conditions as "$p$"?
  3.  **The "Ordinary" Vagueness:** Defining "ordinary" is difficult. Does it mean atomic propositions? Does it exclude negations? If we exclude too much, the Knowability Principle loses its bite as a theory of truth.

  #### The Case for "Principled" (Your Friend's Position)
  However, many professional philosophers (such as Neil Tennant and Michael Dummett) argue that the restriction is defensible, provided it is formulated carefully.
  1.  **Cartesian Propositions:** The restriction isn't just "ordinary"; it is usually defined as **Cartesian propositions**. A proposition is Cartesian if it is *logically consistent* to know it.
      *   As the proof showed, $K(p \land \neg Kp)$ is logically inconsistent.
      *   Therefore, the anti-realist can argue: "The Knowability Principle only applies to propositions where knowing them is not logically contradictory."
      *   This isn't saving the theory by fiat; it's acknowledging that "possibility" in the Knowability Principle means *logical possibility*. Since knowing an unknown truth is logically impossible, it was never a candidate for the principle in the first place.
  2.  **Verification Conditions:** Anti-realists argue truth is determined by verification conditions. Some sentences (like "$p$ is unknown") have verification conditions that vanish once you verify them. If you verify $p$, it is no longer unknown. Therefore, the proposition "$p$ is unknown" cannot be stably verified. Excluding unstable propositions is a semantic claim, not just a logical patch.
  3.  **Analogy to Set Theory:** In set theory, we restrict the "Comprehension Principle" (you can't form a set of all sets that don't contain themselves) to avoid Russell's Paradox. We don't say Set Theory is dead; we say the unrestricted principle was naive. Your friend could argue KP was just "naive" and needs the same type-restriction.

  ### The Verdict

  **Who won the argument?**

  **Technically: You.**
  The derivation is valid. The unrestricted Knowability Principle ($p \to \Diamond Kp$ for *all* $p$) is demonstrably false in classical logic. If your friend insists on the unrestricted version, she is logically mistaken.

  **Philosophically: It's a Draw (with conditions).**
  Your friend's restriction is **not necessarily ad hoc**, but it comes at a high cost.
  *   **If** she restricts KP to "Cartesian propositions" (those where $Kp$ is logically consistent), she saves the principle from contradiction.
  *   **However**, she must admit that the anti-realist theory of truth does not apply to *all* truths. It applies only to "stable" truths.
  *   **The Catch:** Realists will argue that if you have to exclude propositions about knowledge itself to make your theory work, your theory of truth is incomplete. Furthermore, the proof can be regenerated with slightly more complex propositions (e.g., "$p$ is true and will never be known"), requiring further restrictions.

  **How to close the debate:**
  Tell your friend she is right that the Knowability Principle is attractive, but she is wrong that it can remain unrestricted. To save anti-realism, she must adopt a **restricted Knowability Principle**.

  But you should press her on this: *If the principle doesn't apply to all truths, does it still capture the nature of Truth?* If the "unknown truths" are excluded from the theory of truth, what status do they have? If they exist but fall outside her theory, her theory isn't a general theory of truth anymore.

  **Summary for your notes:**
  1.  **The Proof:** Substituting $(p \land \neg Kp)$ into the Knowability Principle generates a contradiction ($Kp \land \neg Kp$).
  2.  **The Result:** Unrestricted Knowability implies Omniscience.
  3.  **The Restriction:** Limiting KP to "Cartesian" (logically knowable) propositions is a standard, defensible move in the literature (Tennant/Dummett), not merely ad hoc.
  4.  **The Cost:** It forces anti-realism to admit that not all truths are governed by the knowability constraint, weakening its claim to be a comprehensive theory of truth.
