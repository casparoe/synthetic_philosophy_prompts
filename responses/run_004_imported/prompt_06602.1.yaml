answer: |-
  Your intuition is spot on. What you're describing is one of the central engines of the replication crisis. While it feels like "reasonable skepticism" on the surface, logically and methodologically, it is a defense mechanism that immunizes bad ideas from falsification.

  Here is the breakdown of why that logic is flawed, and why dismissing a failed replication without evidence is the exact opposite of the rational move.

  ### 1. The Circular Logic (Immunizing the Strategy)
  The researcher's argument is essentially:
  1.  **Premise:** I know this effect is real because I've seen it many times.
  2.  **Observation:** This replication failed.
  3.  **Conclusion:** Therefore, the replication must have been done wrong.

  This is circular. It assumes the truth of the conclusion (the effect is real) to prove the premise (the replication was botched). In philosophy of science, this violates **falsifiability**. If no possible outcome of a replication study can change the researcher's mind (because a success proves it works and a failure proves the replicator is incompetent), the claim is not scientific; it's dogma.

  ### 2. The "File Drawer" Within the Lab
  When a researcher says, "I've run this a dozen times," they rarely mean, "I pre-registered a protocol and ran it 12 times consecutively."
  Usually, it means: *"I ran variations of this study many times. Sometimes it didn't work, so I tweaked the instructions, changed the exclusion criteria, or waited for a different pool of participants until it did work. I count the ones that worked as 'running the study.'"*

  This is **unreported flexibility** (or p-hacking) happening internally. By dismissing an external replication, they are privileging their own internal, unregulated "successes" over an external, often pre-registered, transparent attempt. They are comparing their *best* 12 runs against the replicator's *only* run.

  ### 3. Tacit Knowledge vs. Generalizability
  There is a legitimate argument that some effects rely on "tacit knowledge"—subtle cues, tone of voice, or specific lab culture that isn't captured in the written methods section.
  *   **The Rational View:** "Hmm, our effect seems sensitive to context. Let's work with the replicators to see what moderator variables we missed."
  *   **The Crisis View:** "You didn't do the magic hand gesture right, so the effect isn't real."

  If an effect only works when *you* do it, and cannot be translated into a protocol that others can follow, it is not a generalizable scientific fact. It is a **parlor trick**. Science requires that phenomena be transferable. If the "secret sauce" isn't in the recipe, the recipe is incomplete.

  ### 4. Bayesian Updating
  To answer your specific question: *"If you genuinely do know an effect is real... isn't tossing out a shaky failed replication actually the rational move?"*

  In a Bayesian framework, you start with a **prior probability** (how likely you think the effect is real based on past data).
  *   If your prior is high (because you've seen it 12 times), a single failed replication shouldn't drop your confidence to zero.
  *   **However,** it *should* lower your confidence somewhat.

  The irrational move is refusing to update the probability *at all*. If you treat your prior as 100% certainty, you are no longer doing science. A rational scientist says, "I am still fairly confident, but this failure suggests there are boundary conditions we don't understand yet." The researcher you are describing says, "My confidence remains 100%, and the data is wrong."

  ### 5. The Incentive to Dismiss
  Finally, we have to look at the human element. Admitting a foundational effect might be false is career-threatening. It undermines past publications, grant funding, and theoretical frameworks.
  *   **Investigating the failure** requires time, humility, and risks confirming the effect is dead.
  *   **Dismissing the failure** requires only a sentence ("They didn't do it right") and protects the career.

  When researchers wave off replications without digging in, they are often (consciously or not) protecting their own capital.

  ### Summary: When is skepticism rational?
  It **is** rational to question a replication if:
  1.  The replication had low statistical power.
  2.  The protocol deviated significantly from the original.
  3.  The population was vastly different.

  **But the key is evidence.**
  *   **Rational:** "This replication failed, but looking at their data, I see they excluded 40% of participants using a criterion we never used. That explains the null result."
  *   **Irrational (The Crisis Move):** "This replication failed. Since I know the effect is real, they must have excluded participants wrongly. I haven't checked their data, but they must have."

  The behavior that bugs you is the second one. It substitutes **investigation** with **assertion**. It allows bad results to survive because it places the burden of proof entirely on the skeptic, while granting the original researcher immunity from error based solely on their own authority. That is the antithesis of the scientific method.
