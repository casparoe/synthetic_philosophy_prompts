answer: |-
  This is an excellent objection, and you are certainly not missing something obvious. In fact, you have put your finger on the central tension in Ord's argument. Many philosophers who have engaged with "moral trade" (or the related concept of "moral speculation") raise the exact same concern: **Does treating moral disagreements as opportunities for trade implicitly demote moral truths to mere preferences?**

  However, Ord would argue that you are conflating **moral ontology** (what is objectively true) with **moral epistemology** (what we can know or are certain of). Here is a breakdown of why Ord claims moral trade is compatible with realism, and where your intuition might still hold weight.

  ### 1. Realism Does Not Imply Infallibility
  The strongest defense of Ord's position relies on **moral uncertainty**. Moral realism posits that there are objective moral facts, but it does not posit that human beings have perfect access to them.

  *   **The Realist Position:** "I believe eating meat is objectively wrong. However, I acknowledge that I am a fallible human being. There is a non-zero probability that my moral reasoning is flawed and the meat-eater is correct."
  *   **The Trade:** If I assign a 90% probability to my view and a 10% probability to yours, it can still be rational to trade. By paying you to eat less meat, I secure a high-probability gain (less animal suffering) at the cost of money. You secure a gain (money) for doing something you think is neutral.
  *   **The Conclusion:** The trade isn't based on the idea that "both views are equally valid" (relativism). It is based on the idea that "I might be wrong, so I should hedge my bets." This is compatible with realism; it's essentially a moral version of Pascal's Wager or portfolio diversification.

  ### 2. "Gain" is Defined by Expected Value, Not Objective Truth
  Your objection hinges on the definition of "gain." You are defining gain as **objective moral improvement** (i.e., the world actually becoming better according to the True Moral Theory). Ord defines gain as **increase in expected moral value according to the agent's own credences.**

  *   **Your View:** If the vegetarian is right, the meat-eater is doing wrong. Paying them to do less wrong is good. But if the meat-eater is right, the vegetarian is paying for a non-problem.
  *   **Ord's View:** We don't need to settle who is right to execute the trade. We only need to establish that:
      1.  The Vegetarian expects the world to be better (by their lights) if meat consumption drops.
      2.  The Meat-Eater expects the world to be better (by their lights) if they have more money to donate to their cause.
      3.  The trade satisfies both conditions.

  Ord argues that a moral realist can rationally pursue actions that maximize their *expected* moral value, even if they acknowledge that their *actual* moral value might be lower if they turn out to be wrong. The "gain" is subjective to the agent's decision procedure, not the universe's moral ledger.

  ### 3. Behavior vs. Belief (Avoiding Complicity)
  Your worry about "paying someone to keep acting wrongly" assumes that the meat-eater is acting wrongly. But from the meat-eater's perspective, they are not.

  *   **The Transaction:** The vegetarian is not paying the meat-eater to *believe* vegetarianism is correct. They are paying for a *behavioral change*.
  *   **The Realist Defense:** If I believe smoking is morally akin to suicide, I might still pay a smoker to quit. I am not validating their view that smoking is fine; I am incentivizing a reduction in harm *as I perceive it*. The smoker isn't "being paid to do wrong"; they are being paid to sacrifice a preference they hold (tasting tobacco) for a resource they value more (cash).
  *   **Why it's not Relativism:** I can maintain "Smoking is objectively bad" while acknowledging "Paying you to stop is the most effective way for me to reduce smoking." The trade is a pragmatic strategy for a realist to influence the world, not a metaphysical concession.

  ### 4. Where Your Intuition Is Strongest
  Despite Ord's defenses, your intuition points to a genuine limit of the theory. Moral trade becomes much harder to justify as **moral certainty increases.**

  *   **Low Certainty:** If I am 60% sure I'm right, trade is easy.
  *   **High Certainty:** If I am 100% convinced that eating meat is murder, does trading make sense?
      *   If it is *murder*, then the meat-eater is a criminal. We generally do not strike "moral trades" with criminals (e.g., "I'll donate to your favorite charity if you stab one fewer people").
      *   In this high-certainty scenario, your objection holds: the realist might view the trade as **complicity**. By funding the meat-eater (even in exchange for less meat), the vegetarian is empowering an agent they view as morally corrupt.

  Ord acknowledges this. He suggests that moral trade is most compelling precisely when we acknowledge moral uncertainty. If a moral realist claims **infallible certainty**, moral trade does indeed collapse, because there is no room for negotiation with "evil." But since most sophisticated realists admit some degree of fallibility, the space for trade remains open.

  ### Summary
  You are not missing a hidden premise; you are highlighting the friction between **ideal theory** (what we should do if we knew the Truth) and **non-ideal theory** (what we should do given our actual limitations).

  *   **Does it presuppose relativism?** No. It presupposes **fallibilism** (the idea that we might be wrong about our moral beliefs).
  *   **Is your objection valid?** Yes, in the limit case. If a realist is truly 100% certain of their moral view, moral trade looks like bribery or complicity. But Ord argues that such certainty is rare and often irrational.

  For your project, you might argue that Ord's scheme doesn't require *relativism*, but it does require a specific kind of *modest realism*—one that prioritizes harm reduction and expected value over ideological purity. Whether that modesty is a strength or a weakness of the theory is a great avenue for further analysis.
