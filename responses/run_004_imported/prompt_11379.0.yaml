prompt: |-
  Over the last couple of years I've spent a lot of time on poker and sports-betting forums, where the Kelly criterion comes up constantly: the rule that a bet should be sized to maximize the expected logarithm of your bankroll rather than its expected value, since that is what maximizes your long-run compound growth rate. More recently, while reading through some old LessWrong posts, I came across the term "geometric rationality," which treats that same move — using a geometric mean instead of an arithmetic one — as an instance of a much more general principle, one that gets extended to situations quite far from repeated betting, such as how two parties should split the gains from a negotiation, or how to combine several people's conflicting probability estimates into a single number. I want to understand exactly how these two ideas relate, rather than simply assuming they are the same trick wearing two different hats. Please compare Kelly betting with this broader idea of geometric rationality. In which respects is Kelly betting merely a narrow special case that ordinary expected-utility reasoning, applied to a repeated gamble, could already justify on its own — and in which respects does geometric rationality rest on a genuinely different foundation that Kelly's reasoning alone does not establish?
reasoning: |-
  Here's a thinking process that leads to the comparison between Kelly betting and geometric rationality:

  1.  **Deconstruct the Request:**
      *   **Core Subject:** The relationship between the Kelly Criterion (KC) and Geometric Rationality (GR).
      *   **User's Background:** Familiar with poker/sports-betting forums (practical KC) and LessWrong (theoretical GR).
      *   **Key Question:** How do they relate? Is KC just a special case of expected utility (EU) applied to repeated gambles, or does GR rest on a fundamentally different foundation that KC doesn't establish?
      *   **Specific Comparisons Needed:**
          *   Where is KC a narrow special case of standard EU?
          *   Where does GR go beyond KC (different foundation)?
          *   Specific examples mentioned: Negotiation splits, aggregating probability estimates.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   **Kelly Criterion:** Maximizes $E[\log(\text{wealth})]$. Justified by ergodicity (time average vs. ensemble average) or by maximizing long-run growth rate in repeated i.i.d. bets. It's about *dynamics* of wealth over time.
      *   **Geometric Rationality:** A term popularized by Scott Garrabrant (LessWrong). It involves using geometric means instead of arithmetic means in aggregation, bargaining, and belief updating. It's often linked to Nash Bargaining Solution, log-utility, and "product maximization."
      *   **The Connection:** Both involve logarithms and geometric means. Both often lead to similar mathematical prescriptions (maximize product of gains/utilities).
      *   **The Distinction:** KC is primarily about *individual* wealth growth over *time* (ergodicity). GR is often about *social* choice, *belief* aggregation, or *timeless* decision theory where the "growth" metaphor is abstracted away.

  3.  **Drafting the Comparison - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Yes, they are deeply related but distinct in scope and justification. Define both briefly.

      *   **Part 1: Kelly as a Special Case of Expected Utility (The "Standard" Justification):**
          *   Standard EU theory says: Maximize $E[U(W)]$.
          *   If $U(W) = \log(W)$, you get Kelly.
          *   *Why* log utility?
              *   Argument A: Risk aversion (Bernoulli).
              *   Argument B: Repeated betting (Kelly's original argument). If you bet repeatedly, the arithmetic mean diverges from the actual outcome (ergodicity breaking). The time-average growth rate is the geometric mean.
          *   *Conclusion on this point:* In the context of repeated i.i.d. bets, KC *is* just EU with log utility, justified by the law of large numbers applied to multiplicative processes. It doesn't need "Geometric Rationality" as a new philosophical framework; it needs correct math on repeated trials.

      *   **Part 2: Geometric Rationality (The Broader Framework):**
          *   What is it? It's the principle that the geometric mean is the "correct" way to aggregate values in certain contexts where arithmetic means fail or imply unwanted assumptions.
          *   Key contexts:
              1.  **Bargaining (Nash):** Nash Bargaining Solution maximizes the *product* of utility gains (equivalent to sum of log utilities). This looks like Kelly, but it's about *fairness* between agents, not *growth* over time for one agent.
              2.  **Belief Aggregation:** Combining probabilities. Arithmetic mean of probabilities can be Dutch-booked or inconsistent in certain logical frameworks. Geometric pooling (log-odds average) preserves independence and calibration better in some views.
              3.  **Timeless/Logical Uncertainty:** Garrabrant's work often involves logical inductors. GR is about coherence in a way that isn't necessarily temporal.

      *   **Part 3: The Crucial Divergence (Foundations):**
          *   *Kelly's Foundation:* Ergodicity. The world is a multiplicative process over time. Bankroll can go to zero. Survival is key.
          *   *GR's Foundation:* Symmetry and Invariance.
              *   In bargaining: Independence of irrelevant alternatives, scale invariance.
              *   In belief: Likelihood ratios (which are multiplicative).
          *   *The "Different Hat" aspect:* KC is about *survival and growth*. GR is often about *consensus and fairness*.
          *   *Where KC fails to justify GR:* KC doesn't tell you how to split a dollar with a friend. KC doesn't tell you how to combine two experts' probabilities if you aren't betting repeatedly. GR claims these are instances of the same *algebraic structure* (maximizing products), even if the *physical justification* (time vs. space vs. logic) differs.

      *   **Part 4: Synthesis/Conclusion:**
          *   KC is the dynamic/temporal instantiation of the geometric principle.
          *   GR is the structural/algebraic generalization.
          *   KC justifies log-utility via *consequences* (bankruptcy). GR justifies log-utility via *axioms* (symmetry, independence).

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
