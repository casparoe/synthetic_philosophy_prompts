prompt: |-
  Had an arguement with my friend Priya last night that's still bugging me. I'm trying to decide whether to leave my job to join my cousin's brand-new company as an early employee, and honestly there's no track record to go on, so I told her I don't think there's even a fact of the matter about whether this is a 20% shot or a 55% shot, the uncertainty's just too deep for a specific number to mean anything. Priya said that's a total cop-out, that everyone's implicitly working with some number when they size up a risk like this, and refusing to name one just means im too scared to actually commit to a view. We went back and forth for an hour and got nowhere. Is she right that deep down I must have a number in my head, or can genuinely not having one be the more honest, rational response? And if I really can't pin one down, how am I even supposed to decide whether to take the job?
