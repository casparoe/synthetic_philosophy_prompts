answer: |-
  The hotel bar had been closed for an hour. The only light came from the service station where a tired bartender was wiping glasses that were already clean. Elena swirled the last meltwater in her scotch. Marcus was still wearing his conference badge, the lanyard twisted around his collar like a noose.

  "You're dodging the sign," Elena said. She didn't look up from her glass. "Every time I ask about the prior sign, you pivot to the intuition. But the intuition rests on the setup."

  Marcus rubbed his eyes. "The setup is just scaffolding, Elena. We can take it down. That's the point of the blockage cases. We don't need Black watching for a twitch in Jones's eyebrow. We don't need a prior sign."

  "Then how does Black know when to intervene?"

  "He doesn't *wait* to know. He pre-emptively blocks the neural pathways required for the alternative." Marcus leaned forward, using his hands to carve space in the air. "Imagine Jones's brain. Black installs a device that creates a firewall around the neural circuitry for 'deciding not to shoot.' It's not monitoring. It's just… walled off. Like a room with the door bricked up. Jones can't even form the intention to refrain. But the wall is passive. It only matters if Jones tries to walk through it. Since Jones decides to shoot on his own, the wall never lights up. It never interacts with the actual sequence."

  Elena finally looked at him. "Passive? Marcus, nothing in a causal chain is passive. If that wall is there, is the state of the universe prior to Jones's decision sufficient to determine that he shoots?"

  "If the world is indeterministic, no."

  "Then the wall isn't secure," she said sharply. "If the world is indeterministic, there is a probability that Jones's neurons fire in a way that *would* constitute a refusal. If the wall stops that, it has to intervene. And if it intervenes, when does it grab him?"

  "At the onset of the refusal."

  "So there is a moment," Elena pressed, "however brief, where Jones is initiating a refusal, and the device stops it?"

  "No, the device makes the initiation impossible."

  "Then you've smuggled in determinism," she said. "You're saying the prior physical state plus the device *guarantees* the shooting. If you admit that, you've begged the question against the incompatibilist. You're assuming determinism is compatible with responsibility to prove that alternative possibilities aren't needed. You can't use a deterministic case to convince someone who thinks determinism kills responsibility."

  Marcus sighed, signaling to the bartender that no, they didn't need another round. "Okay. Fine. Let's grant indeterminism. Let's say there is a genuine chance Jones could refuse. The device is there to catch it. But in the actual sequence, Jones never even *starts* to refuse. He reasons, he deliberates, he chooses to shoot. The device does nothing. Why does the existence of a broken gun in the corner of the room negate his responsibility for firing the one that works?"

  "Because the broken gun tells us he wasn't holding the live one alone," Elena said. "Here's the flicker. You say the device does nothing. But for the device to do nothing, Jones must not trigger it. So, Jones has two options: He can choose to shoot, in which case the device stays idle. Or he can *begin to choose* not to shoot, in which case the device activates."

  "That's not a robust alternative," Marcus countered. "That's a flicker. It's the difference between *shooting on his own* and *being made to shoot*. But in the Frankfurt case, he *does* shoot on his own. The 'being made to' part is counterfactual. Why should a counterfactual intervener drain responsibility from the actual actor?"

  "Because it changes the modal profile of the agent," Elena said. "Responsibility requires that you are the source of the action. If you are the source, you must be able to be otherwise. If I can show that you have *some* alternative possibility—even if it's just the possibility of triggering the intervener—then PAP holds. The Principle of Alternative Possibilities isn't dead; it's just hiding in the fine print of your blockage."

  Marcus shook his head. "You're conflating *leeway* with *sourcehood*. I'm arguing for guidance control. Jones owns the action because the mechanism that produces it is his own reason-responsive mechanism. The fact that a backup mechanism exists doesn't change the ownership of the primary one."

  "But is the primary mechanism reason-responsive if it *can't* respond to the reason to refrain?" Elena leaned in. "Imagine Jones sees a reason not to shoot. A child runs in front of the senator. In a normal world, Jones might hesitate. In your blockage world, the neural firewall prevents the hesitation. The mechanism *cannot* respond to that reason. So how is it reason-responsive?"

  "The mechanism *is* responsive," Marcus insisted. "It's just that the range of output is constrained. Look, think of a train on a track. The switches behind the train are locked so it can't go back. But the engineer is still driving. He's steering, braking, accelerating. If he drives into the station, he's responsible. The fact that he couldn't reverse doesn't mean he wasn't driving."

  "A train is a deterministic system, Marcus. We're talking about moral agents."

  "Okay, take a pilot. The plane has a governor that prevents it from stalling. The pilot flies the plane. He lands it safely. The fact that he *couldn't* stall the plane doesn't mean he didn't land it. He exercised guidance control."

  "But if the governor prevents him from *choosing* to stall," Elena said, "then he isn't a pilot in the full sense. He's a passenger who gets to hold the stick as long as he doesn't try to crash." She paused, letting the image hang. "That's what the flicker is. It's the difference between holding the stick and merely holding it. If the blockage is total, Jones never really holds the stick. He only holds it conditionally."

  Marcus rubbed his temples. "This is where we circle. You think the *ability to fail* is constitutive of the *success*. I think the success stands on its own. If Jones's actual deliberation is intact—if he weighs the reasons, if he identifies with the desire to shoot, if he executes the plan—why does it matter that a safety net was rigged underneath him?"

  "Because the safety net changes the nature of the fall," Elena said softly. "If I walk across a beam, I'm brave. If I walk across a beam, but there's a net I don't know about, am I still brave? Maybe. But if the net is actually a rigid platform that *would have* caught me if my leg slipped, but also *prevents* my leg from slipping… then I'm not walking. I'm being carried."

  "Jones isn't being carried," Marcus said, his voice tightening. "He walks. He doesn't slip. The platform is never touched."

  "But the platform's existence ensures he doesn't slip," Elena said. "If the blockage is deterministic, he can't slip. If it's indeterministic, he can start to slip, and then the platform catches him. If he can start to slip, PAP is true. There is an alternative possibility: the possibility of intervention. And if that possibility exists, then your blockage case hasn't refuted PAP. It's just moved the alternative from 'doing otherwise' to 'triggering the blocker.'"

  Marcus was quiet for a moment. He looked at the bartender, who was now turning off the espresso machine. "So you're saying the flicker is enough? That the mere possibility of triggering the device grounds the kind of freedom required for blame?"

  "I'm saying it grounds the *leeway*," Elena said. "You semi-compatibilists want to say leeway is irrelevant. But if the only reason Jones shoots is that the alternative was blocked *before* it could be chosen, then the source of the action isn't just Jones. It's Jones plus the Blocker. You can't isolate the actual sequence from the counterfactuals that guarantee it."

  "Why not?" Marcus asked. "Causation is local. The cause of the shooting is Jones's neural activity. The Blocker's neural activity is zero. It's idle. How can zero causation diminish responsibility?"

  "Because modal facts matter," Elena said. "Responsibility isn't just about what happened. It's about what *could have* happened. If what could have happened is blocked by another agent, then you aren't the sole author of what did happen."

  Marcus sat back, the leather chair creaking. "We're at the bedrock, aren't we? You think responsibility requires a garden of forking paths. I think it requires being the gardener of the path you're on."

  "I think you can't be the gardener if someone else fenced off the only other exit," Elena said.

  "And I think," Marcus said, picking up his badge and finally untwisting the lanyard, "that if the fence never touches you, you're still the one walking the path. But I grant you this: if the fence is deterministic, I haven't won. I need the indeterministic blockage to hold without creating a flicker."

  "And I grant you," Elena said, standing up, "that if there is no flicker, then the blockage is deterministic. And then we're back to the hard problem of determinism, not the cleverness of Frankfurt."

  Marcus smiled, a tired, thin expression. "So the conference wasn't a waste. We narrowed it down to the metaphysics of the block."

  "Until tomorrow," Elena said. "When someone proposes a new case where the blockage is retrocausal."

  "Don't give them ideas," Marcus said. He gestured toward the dark lobby. "Shall we?"

  "After you," Elena said. "Just don't block the door."
