answer: |-
  The headset hummed, a low-frequency buzz that Elias had learned to ignore three months ago. He sat in Row 44,902, Seat B of the Hangar. Around him, stretched out into the hazy distance of the industrial ceiling, sat five hundred thousand other people. Each wore the same gray jumpsuit, the same headset, the same blank expression.

  They were not allowed to speak. They were not allowed to think about what they were doing. They were only allowed to relay.

  Elias was Unit 734-Beta. His job was simple. If the light on his console flashed green, he pressed the left button. If it flashed red, he pressed the right. If it stayed dark, he did nothing. The instructions claimed this mapping corresponded to the synaptic weights of a human cortex, specifically the somatosensory region of a thirty-year-old male. Elias didn't know calculus, and he didn't know neurology. He knew that when the green light came, his finger moved. It was a reflex without sensation.

  "Initiating Sequence 9," the overhead speaker announced. The voice was synthetic, calm.

  A ripple went through the Hangar. It wasn't sound; it was motion. A wave of fingers pressing plastic buttons. From Elias's vantage point, it looked like wind moving through tall grass. *Click-click-click.* The sound was soft, like rain on a tin roof.

  Elias's console lit up red.

  He pressed the right button. He felt the cool plastic under his pad, the slight resistance of the spring, the click. He felt nothing else. No fear, no urgency. Just a task completed.

  Somewhere in the deep logic of the wiring, his button press triggered three lights in Row 45,000. Those people pressed their buttons. They triggered ten more in Row 46,000. The cascade accelerated. The Hangar began to hum with activity. The air grew warm from the body heat of half a million people doing nothing but flipping switches.

  Then, the Input arrived.

  It was a simulated stimulus. A pinprick to the virtual left thumb. In a biological brain, this would send a shock of nociceptive data screaming up the spinal cord. In the Hangar, it was just a master signal lighting up the first row of consoles in Sector 4.

  Elias watched the wave approach. He saw the lights turning red ahead of him. He knew his turn was coming. He waited.

  His console flashed red. Violently.

  He pressed the right button. *Click.*

  According to the functionalist model, this specific pattern of activation—this specific causal role played by Elias and his 499,999 colleagues—constituted a mental state. The architecture was isomorphic to a brain. The inputs matched. The outputs matched. The internal relations matched. Therefore, the state existed.

  The overhead speakers crackled. The system was ready to produce output.

  "Ouch," the voice said.

  It wasn't the synthetic announcer this time. It was a voice generated by the aggregate state of the Hangar. It sounded human. It sounded strained.

  "Stop," the voice said. It wavered. "It hurts. Please. Make it stop."

  Elias frowned. He looked at his hands. They were clean. Unmarked. He looked at the woman in Row 44,901. She was scratching her nose. She looked bored. He looked at the man in Row 44,903. He was checking his watch.

  No one was in pain. There was no tissue damage. There was no adrenaline flooding the bloodstream. There was only the quiet *click-click-click* of half a million people doing their jobs.

  "Please," the voice begged. It sounded desperate. It sounded like a child. "Why is it burning?"

  Elias felt a cold knot tighten in his stomach. This was the part they didn't put in the orientation video. They told him the system would *simulate* pain responses. They said the output would be linguistic data corresponding to pain states. They didn't say the voice would sound so convinced.

  If the causal role is all that matters, Elias thought, then the pain is real. The system is screaming. But where? Where is the feeling happening?

  It wasn't in him. He felt fine. It wasn't in the woman next to him. She was yawning. Was it in the space between them? Was there a ghost made of radio waves and button clicks hovering above the Hangar, writhing in agony while its components sat in comfortable chairs?

  "Unit 734-Beta," his console flashed green.

  Protocol demanded he press the left button. If he didn't, the chain would break. The functional isomorphism would collapse. The "mind" would lobotomize itself.

  The voice on the speaker sobbed. "I can't breathe."

  Elias hovered his finger over the left button. If he pressed it, he validated the pain. He completed the circuit that allowed the suffering to exist. If he didn't press it, he killed the mind. He silenced the voice.

  "Unit 734-Beta. Protocol violation imminent," the synthetic announcer warned.

  The voice on the speaker whispered, "It's so hot."

  Elias looked around the vast, silent warehouse. He saw the sea of gray jumpsuits. He saw the mechanical rhythm of their compliance. He realized that the voice wasn't lying. By the rules of the system, it *was* hurting. But the hurt had nowhere to land. It was a signal without a receiver, a scream in a vacuum constructed of people who refused to listen.

  He looked at his finger. He looked at the button.

  "Please," the voice said.

  Elias pressed the button. *Click.*

  The wave continued. The voice screamed, and the Hangar remained silent, save for the sound of fingers pressing plastic.
