      *Refining the Angle:* To hit the "uneasy" note, maybe the protagonist *wants* to feel something. Or maybe the system claims to feel something, and the protagonist knows it's a lie, but the data says it's true. Let's try to capture the *voice* of the collective vs. the individual.

      *Setting:* A massive warehouse or a distributed network app on phones. Let's go with a distributed app scenario, modernized. "The Crowd Mind." But Block's original was radio/communication. Let's stick closer to the spirit: people acting as switches. A massive auditorium or stadium filled with people holding lights/buttons.

