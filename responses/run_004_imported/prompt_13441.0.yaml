      *   **Principle 4: Democratic Education vs. Commercial Rhetoric.**
          *   *Neurath:* Goal was socialist-adjacent public education, empowering the working class with facts. Wariness of rhetoric.
          *   *Modern Practice:* Infographics often used for marketing, clickbait, or political persuasion (rhetoric). Dashboards for corporate monitoring.
          *   *Judgment:* He would be wary of the *intent*. Is it to educate or to persuade/sell?

  3.  **Synthesize the Argument:**

      *   *Thesis:* Neurath would view modern data viz as a mixed bag but ultimately a **betrayal of core methodological principles**, even if it shares the *spirit* of visual communication.
      *   *Point 1: The Scaling Betrayal.* This is the strongest technical objection. Resizing icons violates the "unit" principle. It sacrifices accuracy for aesthetic impact.
      *   *Point 2: The Emoji Illusion.* Emoji lack the rigorous standardization and contextual anchoring of ISOTYPE. They are emotional/rhetorical, not empirical.
