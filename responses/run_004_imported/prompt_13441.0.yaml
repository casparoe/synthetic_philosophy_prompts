      *   **Task:** Determine how Neurath would judge these modern practices (extension vs. betrayal) based on his specific commitments and grounds.

  2.  **Deconstruct Neurath's Principles vs. Modern Practices:**

      *   **Principle 1: Repetition vs. Scaling.**
          *   *Neurath:* One icon = $X$ units. 10 units = 10 icons.
          *   *Reasoning:* Human eyes judge area/volume poorly. Doubling height/width quadruples area, confusing the viewer.
          *   *Modern Practice:* Bubble charts, sized icons (e.g., a big dollar sign for GDP, a small one for another).
          *   *Judgment:* Neurath would likely hate this. It violates the core perceptual honesty of ISOTYPE.

      *   **Principle 2: Pictures as Supplement, Not Language.**
          *   *Neurath:* Pictures show "what is there" (distribution, comparison). They *cannot* show "what is not there" (negation), "why" (causation), or abstract theory. They need text/caption to anchor meaning.
          *   *Modern Practice:* Infographics often try to tell a whole story visually. Dashboards often lack context. Emoji are used as standalone semantic units (e.g., "I'm 😡 about the 📉").
          *   *Judgment:* He would see standalone emoji as semantically unstable. He would appreciate dashboards *if* they stick to comparison, but criticize them if they claim to explain causality without text.

      *   **Principle 3: Universalism vs. Cultural Specificity.**
          *   *Neurath:* ISOTYPE was designed through sociological research to ensure symbols were understood across cultures (e.g., testing if a specific drawing of a worker looked like a "worker" to people in Vienna vs. Moscow).
          *   *Modern Practice:* Emoji. Supposedly universal, but often culturally biased (e.g., hand gestures, food items, skin tones).
