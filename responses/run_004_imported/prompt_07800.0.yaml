answer: |-
  This is one of the best intersections of metaphysics and legal theory, and it is completely normal for it to mess with your head. You have identified the exact friction point: **Metaphysics tends to be descriptive (what *is* the cause?), while Law is prescriptive (who *should* pay?).**

  Here is a breakdown of how the three metaphysical positions map onto the legal doctrine of omission liability, and an assessment of whether metaphysics vindicates the law or if they are talking past each other.

  ### 1. The Metaphysical Maps vs. The Legal Terrain

  #### **Lewis (Counterfactual Realism)**
  *   **Metaphysics:** Causation is abundant. The gardener caused the death. The neighbor caused the death. The Queen of England caused the death.
  *   **Law:** Only the gardener is liable (due to duty).
  *   **The Conflict:** Lewis's view creates the **Profligacy Problem** for the law. If the law requires causation for liability, and Lewis is right that *everyone* caused the death, then the law's refusal to punish the neighbor looks arbitrary or unjustified *metaphysically*.
  *   **Implication:** If you are a Lewisian, you must argue that the law is **not** tracking metaphysical causation when it denies liability to the neighbor. The law is using "causation" as a proxy for something else (policy, duty, fairness). Lewis's metaphysics does *not* vindicate the legal distinction; it highlights that the legal distinction is extra-metaphysical.

  #### **Beebee (Causal Anti-Realism about Omissions)**
  *   **Metaphysics:** Omissions are not events. Nothing happens when you don't water the plant. Therefore, neither the gardener nor the neighbor *caused* the death.
  *   **Law:** The gardener is liable.
  *   **The Conflict:** If omissions aren't causes, how can the gardener be liable for *causing* death?
  *   **Implication:** Beebee's view actually **vindicates the structure of legal analysis** most clearly, but in a deflationary way. It suggests that the "Causation" element in tort/crime is doing no work in omission cases. Instead, all the work is being done by the **Duty** element.
      *   On Beebee's view, the law is correct to say the gardener is liable, but not because she *caused* the death. She is liable because she breached a duty, and the harm occurred. The "causation" requirement in law is satisfied by the background conditions (the plant's biology), not the omission. This separates *responsibility* from *causation*, which allows the law to impose liability based on duty without needing to find a metaphysical "ghost cause."

  #### **Norm-Based/Contextualist (e.g., McGrath, Schaffer)**
  *   **Metaphysics:** Causation is selective. An omission is a cause *only if* it violates a norm or expectation. The gardener caused the death; the neighbor did not.
  *   **Law:** The gardener is liable (has duty); the neighbor is not (no duty).
  *   **The Conflict:** Almost none.
  *   **Implication:** This view **perfectly vindicates the legal doctrine.** It builds the legal concept of "duty" directly into the metaphysical definition of "cause." If you adopt this view, the law isn't making a policy exception for omissions; the law is simply tracking the metaphysical truth that the neighbor literally didn't cause the harm.
      *   *Risk:* This risks circularity. Is the omission a cause because there is a norm, or is there a norm because we think it's a cause? If the "norm" is just the legal duty, then metaphysics has just swallowed the legal question without answering it.

  ### 2. Is the Law Orthogonal to Metaphysics?

  You asked if the law is doing something "totally orthogonal." The strongest argument in contemporary legal philosophy is **Yes.**

  Here is why: **The law uses "Causation" as a liability filter, not a metaphysical probe.**

  In law, we distinguish between **Cause-in-Fact** (But-For causation) and **Proximate Cause** (Legal causation).
  *   **Cause-in-Fact** is basically Lewisian. (But for the gardener's inaction, the plant lives).
  *   **Proximate Cause/Duty** is where the law stops the profligacy.

  If you look at the *Restatement of Torts*, the "no duty to rescue" rule is justified by **policy arguments**, not metaphysical ones:
  1.  **Liberty:** Compelling action infringes on autonomy more than prohibiting action.
  2.  **Epistemic/Administrative:** It's hard to know who could have helped. If everyone is a cause (Lewis), who do we sue?
  3.  **Floodgates:** We don't want courts overwhelmed by cases against the Queen of England.

  Therefore, the law admits that the neighbor *might* be a cause in a scientific or counterfactual sense, but denies liability for **normative** reasons.

  **The Implication:** If you argue in court that "Metaphysically, the neighbor didn't cause the death," a judge following standard doctrine would say, "I don't care. Factually, the plant died because no water came. We are denying liability based on *duty*, not *causation*."

  ### 3. How much weight should the metaphysics carry?

  This is the critical question for your seminar. Here is the nuanced take:

  **Metaphysics should not dictate Legal Doctrine, but it should clarify Legal Justification.**

  *   **Don't let Metaphysics dictate Doctrine:** If Beebee is right and omissions aren't causes, we shouldn't necessarily let murderers off the hook for starving victims just because "nothing happened." The law's goal is justice and social order, not metaphysical purity.
  *   **Let Metaphysics clarify Justification:** The metaphysical debate forces us to admit *why* we punish omissions.
      *   If you are a **Lewisian**, you must admit the law is **pragmatically limiting** liability despite metaphysical causation. You are honest about the policy trade-off.
      *   If you are a **Normativist**, you claim the law is **tracking moral reality**. This makes the law look more natural but hides the policy choices (who sets the norms?).
      *   If you are a **Beebee-ist**, you admit that "causation" in omission cases is a legal fiction used to attach liability to duty-breach.

  ### 4. Seminar Talking Points / Takeaways

  If you want to impress in seminar, try pushing these angles:

  1.  **The "Causal" Alibi:** If we adopt the Norm-Based view (that only duty-bound omissions are causes), does that make the legal "Duty" analysis redundant? If causation *includes* duty, do we need a separate element for duty in a negligence prima facie case? Or does it collapse the analysis?
  2.  **Mens Rea and Metaphysics:** In criminal law, does the metaphysical status of the omission change the *Mens Rea* required? If I don't save a drowning child, and omissions aren't "actions" (Beebee), can I truly have "intent" to kill? Or is it only "intent to let die"? Metaphysics might matter for grading the offense.
  3.  **The Orthogonality Thesis:** Argue that the law is **functionally Beebee-ian** even if metaphysics is Lewisian. The law treats the "Duty" element as the switch that turns "background condition" into "legal cause." This suggests the law cares about **imputation** (who do we blame?) rather than **causation** (what physically happened?).

  ### Summary
  The metaphysical disagreement doesn't solve the legal problem; it exposes it.
  *   **Lewis** shows the law is under-inclusive relative to causation.
  *   **Beebee** shows the law is using "causation" as a placeholder for "responsibility."
  *   **Normativists** try to merge them, but risk circularity.

  The law is likely **orthogonal** to the metaphysics. The "Duty" requirement is a policy firewall designed to stop the Lewisian profligacy from destroying the legal system. Metaphysics helps us see that the firewall is necessary, but it doesn't tell us where to build it.

  **Recommendation:** Don't try to solve the metaphysics to fix the law. Use the metaphysics to show *why* the law has to make a policy choice rather than a factual discovery. That is usually the "A" grade insight in these seminars.
