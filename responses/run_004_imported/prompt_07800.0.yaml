          *   Normativists: Yes, most directly. It merges the two.
      *   *Section 3: The "Orthogonality" Thesis:* This is crucial. The law might not care about "true" causation. It cares about *imputation*. The "duty" element is a policy filter, not a metaphysical discovery.
      *   *Section 4: Practical Implications:* Why does this matter? (Mens rea, statutory interpretation, moral luck).
      *   *Conclusion:* Advice for the seminar. Don't let metaphysics dictate law, but use it to clarify the justification.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Be careful not to say Beebee thinks the gardener is *innocent*. She thinks the gardener is *responsible* but not because of *causation*. The causation condition in law might be satisfied by the affirmative acts leading up to the omission, or the law treats "cause" loosely.
      *   *Nuance:* The legal "but-for" test is basically Lewisian counterfactuals. So the law *uses* Lewisian logic for factual causation, but then restricts it with proximate cause/duty. This tension is key.
      *   *Key Insight:* The law distinguishes *Factual Causation* (often Lewisian) from *Legal Causation* (Proximate/Policy). Metaphysics mostly fights over Factual Causation.

