prompt: |-
  My aunt Carol died three weeks ago at seventy-nine, and I've been asked to give her eulogy this Saturday, to a room that will be mostly retired nurses and her now-grown former foster kids rather than anyone with a philosophical background. For over forty years she took in medically fragile children nobody else would foster, paid for more than one of their surgeries out of her own retirement savings, and never took a vacation because, as she put it, "somebody had to be there." Everybody who loved her wants to hear at the service that she went above and beyond, that she did more than anyone could reasonably ask of a person -- and a local paper actually profiled her in exactly those terms a few years ago. She was furious about it, in her quiet way. She told me afterward that she didn't think what she'd done was optional or extra; she thought it was simply owed, and that praising it as heroic just let everyone else conclude they'd never be on the hook for anything like it. She was Lutheran in an old-fashioned, unfussy way, and I don't think that reaction was only stubbornness on her part -- I think she genuinely didn't believe there was a category of doing more than duty required.

  Since she died I've learned that philosophers actually argue about exactly this -- whether there's a genuine category of acts that are good to do but not required (I gather the word for it is "supererogatory"), or whether her harder view, that anyone in a position to help as much as she could is simply obligated to, is closer to correct. I'm not asking for a summary of that debate; I'm asking you to write the actual eulogy, and it has to do something specific. It can't fall back on "beyond the call of duty" or "a saint among us," since that's exactly the framing she spent years rejecting, but it also can't tip into implying that the nurses and parents in that room who didn't do what she did have failed some duty of their own -- whatever she privately believed about that, turning her funeral into an accusation isn't something I'm willing to do. I'll have about seven minutes. Please write something that lets that room grieve her and feel proud of her without quietly cheating on either side of that tension.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt Carol, 79 years old, died 3 weeks ago.
      *   **Audience:** Mostly retired nurses and grown former foster kids. Not philosophers.
      *   **Carol's Life:** 40+ years fostering medically fragile children no one else would take. Paid for surgeries from retirement savings. Never took vacations ("somebody had to be there").
      *   **Carol's Philosophy:** Rejected the "hero/saint" label. Believed her actions were *owed*, not optional/extra. Hated the "supererogatory" framing (though she wouldn't use that word) because it let others off the hook. Lutheran background (unfussy).
      *   **The Challenge:** Write a 7-minute eulogy (approx. 900-1000 words spoken at a moderate pace).
      *   **Constraints:**
          *   Do *not* use phrases like "beyond the call of duty," "hero," "saint," or "supererogatory."
          *   Do *not* imply the audience (nurses/parents) failed their duty by not doing what she did.
          *   Must honor her specific view (this was just what needed doing) without making the funeral an accusation.
          *   Must allow the room to grieve and feel proud.
          *   Navigate the tension between "she did something amazing" and "she thought this was just normal."

  2.  **Deconstruct the Tension:**
      *   *The Audience's Need:* They want to celebrate her greatness. They feel gratitude. They likely see her as exceptional.
      *   *Carol's Wish:* She didn't want to be exceptional. She wanted the work to be seen as standard human obligation.
      *   *The Speaker's Task:* Validate the audience's love and gratitude without validating the "hero worship" that Carol hated. How? By focusing on *faithfulness* and *presence* rather than *sacrifice* and *extraordinary effort*.
      *   *Key Insight:* Instead of saying "She did more than anyone else," say "She showed us what it looks like to simply stay." Instead of "She sacrificed everything," say "She loved us in the way that was needed." Shift the focus from the *magnitude* of the act to the *consistency* of the love.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Set the tone. Warm, grounded. Mention the specific crowd (nurses, kids).
      *   **The Core Conflict (Subtly):** Address her life's work without using the forbidden "hero" language. Focus on the *children*.
      *   **Carol's Perspective:** Bring in her quote ("somebody had to be there") and her reaction to the newspaper profile. This is crucial for authenticity. Explain *why* she disliked the praise (it makes the work seem optional).
      *   **The Lutheran/faith angle:** Keep it unfussy. Vocation. Calling. Not "sainthood" but "service."
      *   **Addressing the Audience (The Tricky Part):** How to keep the nurses/parents from feeling guilty? Frame Carol not as a standard they *failed* to meet, but as a witness to what love *can* look like. Her life invites us, it doesn't indict us. Focus on the *ripple effect* of her work. The kids are here. That's the proof.
      *   **Closing:** A final image of her. Rest. Permission to grieve.

  4.  **Refining the Language (Iterative Process):**
      *   *Check:* Did I say "sacrifice"? *Correction:* Use "choice" or "priority." "Sacrifice" implies giving up something better. She didn't think there was anything better.
      *   *Check:* Did I say "hero"? *Correction:* Use "Aunt Carol," "she," "our neighbor."
      *   *Check:* Is it too philosophical? *Correction:* Keep it grounded in concrete details (medications, night shifts, the newspaper clipping).
      *   *Tone Check:* Is it accusatory? *Adjustment:* Ensure the message to the audience is "Look what she built," not "Look what you didn't do." Use the concept of "inheritance." We inherit her work, not her guilt.

  5.  **Drafting - Specific Phrasing Ideas:**
      *   Instead of "She went above and beyond," try "She stayed when it was hard."
      *   Instead of "She was a saint," try "She was faithful."
      *   The newspaper story incident is a great anchor. It shows her character.
      *   The Lutheran concept of *Vocation* fits perfectly. It means "calling." It implies duty but also love.
      *   Ending needs to be peaceful. She's resting now. "Somebody had to be there" -> "She was there."

  6.  **Timing Check:**
      *   Average speaking rate is ~130-140 words per minute.
      *   7 minutes = ~900-1000 words.
      *   I need to make sure it's not too short or too long.

  7.  **Final Review against Constraints:**
      *   No "supererogatory" (obviously).
      *   No "beyond the call of duty."
      *   No "saint/hero."
      *   No guilt-tripping the nurses/parents.
      *   Honors her view (this was owed) without shaming those who didn't meet it.

      *(Self-Correction during drafting)*: I need to be careful not to validate her view so hard that it shames the audience. If I say "She believed we all owed this," the audience might feel bad. I need to frame it as: "She believed love looks like *this*." It becomes an invitation rather than a demand. Her life is a testament to what is *possible*, not just what is *required*.

      *Revised Strategy:* Focus on the *children*. The children are the evidence. The nurses are the partners. Carol wasn't judging them; she was working alongside them. She saw the need and met it. We honor her by meeting the needs we see.

  8.  **Final Polish:** Check the rhythm. Ensure emotional beats land. (e.g., The pause after mentioning the newspaper). Ensure the Lutheran "unfussy" tone comes through.

      *(Word Count Check)*: Aiming for roughly 950 words.

      *(Key Phrase to include)*: "Somebody had to be there."
      *(Key Concept)*: Faithfulness over heroism.

      Let's write.

      *Wait, one more thing:* The prompt mentions she paid for surgeries from retirement. That's a concrete detail that shows priority. I should include that but frame it as "resources followed need," not "she gave up her security."

      *Okay, ready to generate.*
answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], Carol's nephew/niece.

  Looking around this room, I see the people who knew her best. I see the nurses who worked the night shifts with her, trading vitals and worries in the dim light of a bedroom. I see the kids—the grown men and women now—who learned to walk, to breathe, to eat, and to be loved in this house.

  We are here to grieve Carol. But if we are honest, we are also here to try to understand her. Because Carol was not always easy to understand, especially when people tried to praise her.

  We know the story of her life. For forty years, she opened this home to children who were medically fragile, children who were often told there wasn't room for them elsewhere. We know she used her own retirement savings to pay for surgeries when insurance said no. We know she didn't take vacations. We know the phrase she used, over and over: "Somebody had to be there."

  A few years ago, a local newspaper wrote a profile about her. It was a beautiful piece, by all accounts. It talked about her generosity. It called her a hero. It said she went above and beyond what anyone could expect.

  Carol was furious about it.

  I remember sitting with her at this kitchen table after it came out. She wasn't angry because she was humble. She wasn't trying to deflect compliments. She was angry because she thought the article was dangerous. She told me that calling her actions "extraordinary" made them sound optional. She believed that if you see a need you can meet, and you have the means to meet it, it isn't a special favor. It's just what you do.

  She didn't believe in heroes. She believed in neighbors. She didn't think she was doing something above the call of duty; she thought she was just answering the call that was right in front of her.

  So, standing here today, I have a responsibility to her memory. I cannot stand here and tell you she was a saint. I cannot tell you she did more than was required of her, because she spent a lifetime telling me that there is no "more than required" when it comes to loving a child.

  But I also look out at this room. I see nurses who have dedicated their careers to care. I see parents who have loved children through illness and uncertainty. I know the weight you carry. I know the exhaustion. And I know that Carol would not want her life to be a stick used to measure anyone else's worth.

  Carol's life was not a judgment on what others *didn't* do. It was a witness to what love *can* do.

  There is a tension here, and I think Carol lived inside that tension willingly. On one hand, she believed this work was simply owed to the children. On the other hand, we all know that what she gave was rare. How do we honor that rarity without turning it into a pedestal she hated?

  I think the answer lies in how she viewed her faith. Carol was Lutheran, in an old-fashioned, unfussy way. She didn't wear her faith on her sleeve; she wore it in her hands. In her tradition, there is an idea of "vocation"—a calling. Not a calling to be special, but a calling to serve where you are planted.

  Carol didn't try to save the world. She saved the world for the kids in this house. She didn't try to fix the healthcare system. She just paid the bill so the surgery could happen. She didn't try to be a hero; she just tried to be present.

  To the nurses here: You know that presence is the hardest medicine to administer. You know that staying in the room, when the work is hard and the progress is slow, is the entire job. Carol was the master of staying in the room.

  To the kids: You are the evidence. You are the argument she would have made. She didn't keep score. She didn't want your gratitude; she wanted your health. She wanted you to grow up. Looking at you today, strong and grown, she would say the work was worth it. Not because she was great, but because *you* are here.

  So, how do we honor her?

  We do not honor her by calling her a saint and putting her on a shelf. That lets us off the hook, and it would have annoyed her.

  We honor her by taking her seriously.

  We honor her by acknowledging that she was right: love is demanding. Care is expensive. Presence is costly. She showed us that when we say "somebody had to be there," the next sentence must be "so I will be."

  That is a heavy thing to carry. I know that. Not everyone can do what Carol did. Not everyone has the capacity, the resources, or the strength. She knew that, too. She never asked you to be her. She just asked you not to look away.

  Carol is resting now. For the first time in forty years, she doesn't have to listen for a monitor in the night. She doesn't have to worry about a dosage or a appointment or a bill. She has kept her watch. She was there.

  And because she was there, we are all here.

  Let us not praise her for being the only one who could do this. Let us thank her for showing us that it can be done. Let us grieve the loss of her presence, and let us carry the memory of her faithfulness into the weeks and years ahead.

  She believed that love was a debt we owe each other. She paid hers, in full, every single day.

  Rest now, Aunt Carol. You were there. We saw you. And we will take it from here.

  Thank you.
