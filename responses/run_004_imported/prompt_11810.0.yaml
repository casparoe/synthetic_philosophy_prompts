answer: |-
  This is a fantastic rabbit hole, and you have correctly identified that the standard "Hobbes the Delusional Amateur vs. Wallis the Rigorous Professional" narrative obscures a lot of the ideological warfare happening underneath. You are right to be suspicious of the purely mathematical framing, but the Semmelweis/Galileo comparison needs some serious nuance.

  Here is the breakdown of where your intuition is spot-on, where the math history corrects the narrative, and how Hobbes's philosophy locked him into a corner he couldn't escape.

  ### 1. The Math: Certainty Without Impossibility
  Your strongest point of confusion is this: *If nobody proved squaring the circle was impossible until 1882, how could Wallis be so certain Hobbes was wrong in 1655?*

  This is a common misconception about how mathematical refutation works. You do not need to know that a problem is **generally impossible** to know that a **specific solution** is wrong.

  *   **The Perpetual Motion Analogy:** Imagine it is 1750. Thermodynamics hasn't been invented yet. Nobody has strictly proven perpetual motion is impossible. However, if someone presents a machine claiming to be perpetual motion, an engineer can still look at the gears and say, "You are ignoring friction here," or "This lever arm calculation is incorrect." You don't need the Second Law of Thermodynamics to spot a calculation error.
  *   **Hobbes's Errors:** Hobbes wasn't proposing a new axiom that challenged the boundaries of math; he was making errors in Euclidean construction. Wallis didn't need to know $\pi$ was transcendental to show that Hobbes's specific geometric construction resulted in a square with an area slightly larger or smaller than the circle. Wallis demonstrated that Hobbes's ratios were inconsistent with established Archimedean approximations of $\pi$.

  So, while the *impossibility* wasn't proven, the *incorrectness of Hobbes's specific proof* was demonstrable to any competent geometer. Wallis wasn't guessing; he was doing the arithmetic.

  ### 2. The Politics: Was it a Hit Job?
  **You are absolutely right here.** The intensity of Wallis's response was disproportionate to a simple mathematical correction, and it was deeply ideological.

  *   **Theological/Political Stakes:** Hobbes was a materialist and a determinist. In *Leviathan*, he argues that the Church should be subordinate to the Sovereign. To the Anglican establishment (and Wallis, who was a Presbyterian divine and Savilian Professor of Geometry at Oxford), Hobbes's geometry was not just math; it was the engine of his atheism. If Hobbes could claim his philosophy was as certain as geometry ("demonstrative science"), his political conclusions became dangerous dogma.
  *   **Wallis's Motivation:** Wallis explicitly linked Hobbes's mathematical incompetence to his philosophical arrogance. In *Elenchus Geometriae Hobbianae*, Wallis isn't just correcting a sum; he is trying to strip Hobbes of intellectual authority. If Hobbes can't do geometry, his "geometric method" applied to politics is worthless.
  *   **Institutional Power:** Wallis was a founding member of the Royal Society; Hobbes was explicitly banned from membership. The Society defined itself partly in opposition to Hobbesian dogmatism. Discrediting Hobbes's math was a way to secure the Royal Society's epistemological dominance (experimentalism vs. Hobbesian deductivism).

  So, while it wasn't a "hit job" in the sense that Wallis lied about the math, it was a **strategic takedown**. Wallis used valid mathematics as a weapon to kill a philosophical rival.

  ### 3. The Philosophy: Why Hobbes Couldn't Back Down
  This is the most critical part of your query. Was Hobbes just stubborn, or was this load-bearing for his system? **It was load-bearing.**

  Hobbes's entire philosophical project relied on the idea that **Reasoning is Reckoning.**

  *   **The Method:** In *De Corpore* and *Leviathan*, Hobbes argues that all true knowledge must be derived from first principles via deduction, exactly like geometry. He believed civil philosophy *could* be as certain as geometry if done correctly.
  *   **The Stakes:** If Hobbes admits he is wrong about geometry, he admits that his method is fallible. If his method is fallible, then the deductions in *Leviathan* (about sovereignty, obligation, and human nature) are also potentially fallible.
  *   **The Trap:** For Hobbes, conceding a geometric error wasn't just saying "I messed up a diagram." It was admitting that **demonstrative certainty is impossible for humans.** That would have collapsed his entire claim to have created a "science of politics."

  He literally *could not* concede without dismantling his life's work. This explains the 20-year vitriol better than ego. He was fighting for the coherence of his system.

  ### 4. The "Galileo Gambit" Verdict
  Does the Semmelweis/Galileo comparison hold? **No, but your skepticism of the "Wallis obviously won" narrative is healthy.**

  *   **Why it fails:** Galileo and Semmelweis were empirically *right* about the core claim (heliocentrism, germ theory/handwashing) but lacked the theoretical framework or social capital to prove it. Hobbes was **wrong** about the core claim. He did not square the circle. He wasn't suppressed for a truth; he was criticized for a mistake.
  *   **Where you are right:** The *sociological* dynamic is similar. The establishment (Wallis/Royal Society) used their institutional authority to marginalize an outsider (Hobbes) whose broader worldview threatened them. The history books often sanitize this, presenting it as "Objective Science vs. Delusional Amateur," when it was actually "Establishment Science + Theological Interests vs. Materialist Outsider."

  ### Summary
  You aren't forcing a narrative, but you are slightly misdiagnosing the mathematical uncertainty.

  1.  **Math:** Wallis didn't need 1882 to know Hobbes was wrong in 1655. The specific errors were detectable without knowing the general impossibility.
  2.  **Politics:** You are correct. Wallis weaponized mathematics to discredit Hobbes's materialism. The viciousness was political.
  3.  **Philosophy:** Hobbes's stubbornness was rational within his system. Admitting geometric error invalidated his political science.
  4.  **Narrative:** It isn't a Semmelweis story (martyr for truth). It is a story about how **mathematical authority is used to police philosophical boundaries.**

  The "Wallis won" story is true mathematically, but false sociologically. It ignores that the battle was never really about the circle; it was about who gets to define "certainty" in 17th-century England. Hobbes thought certainty came from deduction (Geometry); Wallis and the Royal Society thought it came from induction and experiment. Squaring the circle was just the proxy war.
