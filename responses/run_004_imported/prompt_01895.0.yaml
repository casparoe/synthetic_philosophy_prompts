answer: |-
  This is a genuinely profound question about journalistic epistemology. You have identified a tension that most newsrooms gloss over because it's easier to maintain tribal customs than to articulate a unified theory of evidence.

  Your intuition is correct: if the two-source rule were a universal law of epistemology (i.e., "one human being cannot be trusted to perceive reality accurately"), it would apply to your superconductor story just as it does to a corruption scoop. The fact that it doesn't suggests the rule isn't about *truth* in the abstract; it's about *risk*, *verification timelines*, and the *nature of the claim*.

  There is a principled way to draw this line, but it requires reframing what the two-source rule is actually for. It is not a rule about whether a single person can tell the truth; it is a rule about **corroborating hidden knowledge against strategic deception.**

  Here is a breakdown of the principles that distinguish your beat from the investigations desk, and why the divergence is defensible (even if your newsroom hasn't articulated it well).

  ### 1. Reporting a Claim vs. Establishing a Fact
  The most critical distinction lies in what is actually being published.

  *   **Your Science Story:** When you write that a researcher claims to have found a room-temperature superconductor, you are not asserting *as fact* that they have found one. You are asserting *as fact* that **they claim to have found one.** The burden of truth for the physical phenomenon rests on the researcher and the eventual peer-review process. Your byline attests to the accuracy of the quote and the existence of the claim, not the validity of the physics.
  *   **The Investigative Story:** When an investigative piece alleges political wrongdoing, the newspaper is often not merely reporting that "a source says the Senator took a bribe." The story is structured to assert that **the Senator took a bribe.** The source is the means of proof, not the subject of the story.

  If your science story reads, "Dr. X has achieved superconductivity," you have violated the same principle as the investigators. If it reads, "Dr. X announces data suggesting superconductivity," you have shifted the epistemic burden to Dr. X. The investigations desk rarely has the luxury of shifting the burden to the source; they must absorb it themselves.

  ### 2. The Verification Horizon (Replicability)
  This is the strongest principled defense for the science exception.

  *   **Science:** Scientific claims are, by definition, forward-looking and falsifiable. If the researcher is lying or mistaken, the community will know within months or years when replication fails. The "second source" in science is not another human being; it is **future time and independent replication.** The newsroom is betting on a system (the scientific method) that has a built-in correction mechanism.
  *   **Politics/Investigative:** Allegations of wrongdoing are often backward-looking and singular. If a Senator took a bribe in a backroom in 2023, there is no experiment to run. There is no peer review. If the source is lying, the truth may never come out. The journalism *is* the peer review. Because there is no external mechanism to correct the record later, the internal standard for evidence must be higher *now*.

  ### 3. Attribution and Accountability
  You mentioned your source is "attributed to her by name." This is crucial.

  *   **Named Sources:** When a scientist goes on the record, they are staking their professional reputation, funding, and career on the claim. If they lie, they suffer catastrophic reputational damage. This is a powerful incentive for honesty.
  *   **Anonymous Sources:** The two-source rule is almost always triggered when sources are anonymous or when the claim is damaging. An anonymous source risks little. A disgruntled staffer might have an axe to grind. When the source hides behind the reporter's anonymity, the reporter must provide the corroboration that the source's identity would otherwise provide.

  If your investigative colleague were to say, "Former Senator Smith went on the record and admitted to taking a bribe," they would not need a second source. The Senator's name on the quote is the corroboration. The two-source rule exists primarily to protect against the risks of **anonymous** or **hostile** sourcing.

  ### 4. Collusion vs. Error
  The Watergate-era rule is specifically designed to prevent **collusion** and **strategic manipulation.**

  *   **Political Wrongdoing:** Actors in political scandals are strategic. They leak to damage opponents, to test trial balloons, or to settle scores. One source could be manipulating the newsroom. A second independent source ensures that the information isn't a singular fabrication or a "limited hangout" designed to mislead.
  *   **Scientific Discovery:** While scientists can be hyping their work (see: the room-temperature superconductor skepticism), they are rarely colluding to fabricate data in a way that targets a specific external victim. The risk isn't usually *malice*; it's *error*. A second source doesn't necessarily fix error (two scientists can both be wrong about physics); only data fixes error. Therefore, the "two human sources" rule is less relevant than "show me the data."

  ### 5. The "Single Point of Failure"
  Your colleague argued that treating a lone claim as sufficient is how reporters get burned. She is right, but she is ignoring where the burn happens.

  *   **In Science:** If the researcher is wrong, the *researcher* gets burned. The newspaper might look gullible, but the primary damage is to the scientist's credibility. The newspaper can publish a follow-up: "Results fail to replicate."
  *   **In Investigations:** If the source is wrong, the *newspaper* gets burned. The subject of the investigation sues for libel. The public loses trust in the institution. The damage is immediate and institutional.

  ### Conclusion: Is it Unprincipled?
  It is not unprincipled, but the principle is **risk allocation** rather than pure **epistemic certainty.**

  The two-source rule is a defensive heuristic for situations where:
  1.  The claim is damaging (accusation vs. announcement).
  2.  The source is often anonymous (low accountability).
  3.  The truth is not independently verifiable by third parties later (no replication).
  4.  The newspaper absorbs the liability for the truth of the claim.

  Your science reporting operates under a different set of conditions:
  1.  The claim is provisional (announcement vs. accusation).
  2.  The source is named (high accountability).
  3.  The truth is verifiable by the community later (replication).
  4.  The scientist absorbs the liability for the truth of the claim.

  **How to talk to your newsroom:**
  You can tell your colleagues that the two-source rule is not a law of physics; it is a legal and ethical shield. It is required when the *reporter* is vouching for the truth of a hidden act. It is not required when the *source* is vouching for the truth of their own public-facing work.

  The inconsistency only becomes dangerous if science reporters start asserting findings as fact without replication (e.g., "Superconductor Found" vs. "Researcher Claims Breakthrough"). As long as you maintain that distinction, your practice is theoretically sound, even if it differs from the investigations desk.
