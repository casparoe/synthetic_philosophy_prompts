answer: |-
  The silverware seemed unnaturally loud against the china, though the hostess, Mrs. Thorne, smiled with a rigidity that suggested she heard nothing at all. The summer heat hung heavy in the dining room, pressing against the open French doors.

  **1.**
  **Mrs. Aldous:** "You speak of beauty as if it were a scent, Mr. Fenn, something to be inhaled by the few. But Tolstoy was quite clear: art is not a pleasure to be consumed, it is a function. It is the infection of one soul by another. If the feeling cannot pass from the artist to the plowman as readily as to the peer, it is not art. It is merely a diversion."

  **2.**
  **Gerald Fenn:** "But surely you see the danger in making the plowman the critic? If the value lies only in how widely a feeling spreads, then a hymn is superior to a sonata, and a poster superior to a Picasso. I am talking about Significant Form, Mrs. Aldous. The relations of lines and colours themselves stir an aesthetic emotion that has nothing to do with daily life, or morality, or the capacity of a labourer to understand a narrative."

  **3.**
  **Mrs. Aldous:** "Aesthetic emotion for its own sake is a luxury we can no longer afford. If your lines and colours do not unite men in a common feeling, they only separate the cultivated from the crude. You say it has nothing to do with daily life? Then it is a toy. And while Europe sits on a powder keg, I have little patience for toys."

  **4.**
  **Gerald Fenn:** "On the contrary. It is precisely because life is so burdened with utility and morality that we need art to be free of them. If I paint a bowl of fruit, I am not asking the viewer to eat it, nor to feel charity toward the grower. I am asking them to perceive the form. To demand that it teach a lesson is to turn the artist into a preacher, and the gallery into a pulpit."

  **5.**
  **Mrs. Aldous:** "And if the preacher speaks the truth, is that so terrible? Tolstoy applied his own test ruthlessly. He looked at *War and Peace*, the book the world worships, and he condemned it. By his measure, it is bad art. It belongs to his own class, not to humanity. Only the simple peasant tales, the ones that speak of God and brotherhood without ornament, passed the test."

  **6.**
  **Gerald Fenn:** "Then the test is broken. If a theory requires a genius to denounce his own masterpiece to remain consistent, it is the theory that must go, not the masterpiece. *War and Peace* endures not because it makes us better men, but because it is true to the complexity of life. Your 'sincerity' would strip away the very ambiguity that makes it great."

  **7.**
  **Mrs. Aldous:** "Ambiguity is a refuge for the insincere. You call it complexity; I call it a failure to transmit. If I feel a thing truly, I can make you feel it. If I cannot, I have failed. It is a matter of spiritual hygiene. You Bloomsbury painters seem to think you are creating a new religion of the eye, but it looks to me like a retreat from the human heart."

  **8.**
  **Gerald Fenn:** "And you seem to think the human heart is only moved by moral instruction. But tell me, Mrs. Aldous: when you stand before a Cézanne, do you feel a urge to be good? Or do you feel a sense of rightness in the universe that morality cannot touch? If you deny that feeling because it doesn't help the plowman, you are denying the very thing that makes the artist necessary."

  **9.**
  **Mrs. Aldous:** "I deny nothing that brings men together. But your 'rightness' is private. It stops at the edge of the canvas. My art must step out of the frame. If a picture does not change how a man treats his neighbour, it is decoration. And we have enough decoration in this world to paper over the cracks in the foundation."

  **10.**
  **Gerald Fenn:** "But if you force the picture to change how he treats his neighbour, it ceases to be art and becomes propaganda. You would sacrifice the integrity of the vision for the sake of the utility. You would have the artist serve the mob, rather than lead them to a vision they did not know they possessed."

  **11.**
  **Mrs. Aldous:** "The mob is starving, Mr. Fenn. Not for form, but for fellowship. If my colony taught me anything, it is that we are dying of isolation. Art that widens the gap between the man who paints and the man who digs is not just useless; it is sinful. I would rather have a sincere woodcut than a divine abstraction."

  **12.**
  **Gerald Fenn:** "And I would rather have a divine abstraction than a sincere lie. We are at an impasse. You want art to be a bridge to life; I want it to be a sanctuary from it. I suspect, given the summer we are having, the world will soon decide which of us is the luxury."

  **13.**
  **Mrs. Aldous:** "The world decides nothing. We decide. We decide whether we build bridges or sanctuaries. And when the winter comes, Mr. Fenn, sanctuaries have a habit of becoming prisons."

  **14.**
  **Gerald Fenn:** "Perhaps. But bridges can lead anywhere, even off a cliff. I prefer to stay within the frame, where the lines, at least, remain true."

  **15.**
  **Mrs. Aldous:** "Then you will find yourself very alone inside your frame. And I do not think you will find the silence comfortable."

  **16.**
  **Gerald Fenn:** "No, Mrs. Aldous. I imagine I shall find it perfect."

  *The hostess cleared her throat, loudly, and began to speak of the harvest, but neither of them looked at her. They sat in the heavy heat, the gap between them as distinct and unbridgeable as a line drawn in ink.*
