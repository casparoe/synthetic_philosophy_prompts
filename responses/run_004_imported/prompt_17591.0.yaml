answer: |-
  Your gut feeling is absolutely correct, and your friend's reasoning is flawed. You are identifying a very real ethical problem that your friend is trying to rationalize away.

  Here is a breakdown of why that "everyone did it so no one did it" logic doesn't hold up, and why your instinct that this is messed up is the right one.

  ### 1. The "Diffusion of Responsibility" Trap
  Your friend is describing a psychological phenomenon called **diffusion of responsibility**. This happens when individuals feel less accountable for their actions because they are part of a group. The logic is: *"If I didn't do it, someone else would have,"* or *"Since everyone is doing it, my small part doesn't matter."*

  However, morally and logically, this is false.
  *   **Analogy:** Imagine 50 people surround someone and push them. If each person says, "I only pushed a little, so I'm not responsible for them falling," does that make it okay? No. Each push contributed to the fall.
  *   **Digital Context:** Every time someone hit "forward," every time someone laughed, and every time someone made a joke, they made an active choice to amplify the humiliation. Without those individual choices, the situation would have died out.

  ### 2. Mob Mentality vs. Individual Agency
  Your friend said, "nobody in particular decided to make it a thing." This is **mob mentality**. It suggests that the group has a mind of its own and individuals are just passengers.

  But individuals have **agency**. Every single person in that group chat had a moment where they saw the video and had to decide: *Do I share this? Do I laugh? Do I stay quiet?*
  *   By choosing to join in, they validated the behavior.
  *   By choosing not to speak up, they allowed it to continue.
  *   The fact that "half the grade" did it doesn't make it right; historically, large groups of people doing the wrong thing doesn't make the action moral (e.g., bullying, discrimination, etc.).

  ### 3. Dehumanization is Harmful
  You noticed something crucial: she is no longer being seen as a person, but as "video girl." This is **dehumanization**.
  *   When a group turns a person into a meme or a joke, it strips away their dignity and their right to privacy.
  *   This isn't just "drama"; it is a form of **cyberbullying and harassment**.
  *   The impact on her is real. She has to walk into school knowing that dozens or hundreds of people have seen something embarrassing about her. That causes genuine psychological distress, anxiety, and shame.

  ### 4. Why Your Friend Says This
  It is important to understand *why* your friend is arguing this. It's likely not because they are a bad person, but because **admitting fault is uncomfortable.**
  *   If your friend admits that what the group is doing is wrong, they have to admit that *they* are participating in something wrong.
  *   It is much easier to say "it's nobody's fault" than to say "we are all hurting someone right now."
  *   Your friend is trying to reduce their own cognitive dissonance (the discomfort of doing something that conflicts with their morals).

  ### 5. What This Means for You
  You are in a tough spot because going against the group requires social courage. But you are seeing the situation clearly while others are clouded by the herd mentality.

  *   **You are not responsible for the group, but you are responsible for yourself.** You cannot stop everyone else, but you can control your own actions.
  *   **Do not participate.** Don't forward, don't laugh, don't make jokes.
  *   **Small interventions matter.** You don't have to make a speech. If someone makes a joke, you can just say, "That's pretty harsh," or "I'm not really into this, it seems like it's really hurting her." Or simply change the subject.
  *   **Support the victim.** If you know her, a simple private message saying, "Hey, I saw what's going on and I think it's really unfair. I'm sorry people are being like this," can make a massive difference. It reminds her she is still seen as a person.

  ### Summary
  Your friend is wrong. "Everyone did it" is an excuse, not a justification. Moral responsibility doesn't disappear just because it is shared by a crowd. In fact, when a crowd hurts one person, the responsibility is on every individual in that crowd to stop adding to the weight.

  Trust your intuition. It is telling you that empathy is more important than fitting in.
