      *   The user needs validation that their friend's logic is flawed, not just emotionally but logically and ethically.

  4.  **Formulate the Argument:**
      *   **Direct Answer:** No, your friend is not right. Your intuition is correct.
      *   **Name the Phenomenon:** Explain *why* the friend thinks that (Diffusion of Responsibility, Mob Mentality).
      *   **Explain the Harm:** Break down how individual actions create collective harm (the "drop in the bucket" analogy).
