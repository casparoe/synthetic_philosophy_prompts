answer: |-
  This is a classic debate in decision theory, and it touches on one of the most subtle distinctions in probability: the difference between **ensemble averages** (what happens across many parallel universes) and **time averages** (what happens to one person over time).

  Your friend is mathematically correct about the behavior of the bets, but she is philosophically overstating the case when she claims Kelly is the *only* rational policy. You are right to sense that a step is being skipped in her argument.

  Here is a breakdown of the two specific questions you asked.

  ---

  ### 1. Do Expected Wealth and Geometric Growth Pull Apart?

  **Yes, absolutely.** This is the strongest part of your friend's argument. In repeated multiplicative betting, maximizing arithmetic expected value (EV) and maximizing geometric growth rate lead to diametrically opposed strategies.

  **The Concrete Example: The Biased Coin**
  Imagine a coin that lands Heads 60% of the time ($p=0.6$) and Tails 40% of the time ($q=0.4$).
  *   **The Bet:** If you bet \$1 and win, you gain \$1 (net odds $b=1$). If you lose, you lose your \$1.
  *   **The Bankroll:** You start with \$100.
  *   **The Game:** You play this game 1,000 times.

  **Strategy A: The EV Maximizer (Your initial position)**
  *   **Logic:** On any single flip, the Expected Value of betting \$1 is $(0.6 \times \$1) + (0.4 \times -\$1) = \$0.20$. Since this is positive, you should bet as much as possible to maximize total EV.
  *   **Action:** Bet 100% of your bankroll every time.
  *   **Outcome:** To survive 1,000 flips, you must never flip Tails. The probability of this is $0.6^{1000}$, which is effectively zero.
  *   **Result:** With probability approaching 1, you go broke.
  *   **The Paradox:** Despite almost certainly going broke, your *Arithmetic Expected Wealth* after 1,000 flips is astronomical ($\$100 \times 1.2^{1000}$). Why? Because in the vanishingly small number of universes where you win every time, you have more money than exists in the physical universe. The average is being driven by outliers, not the typical experience.

  **Strategy B: The Kelly Bettor (Your friend's position)**
  *   **Logic:** Maximize the expected logarithm of wealth ($E[\log(W)]$), which is equivalent to maximizing the geometric growth rate.
  *   **Formula:** $f^* = p - q/b$. Here, $0.6 - 0.4 = 0.2$.
  *   **Action:** Bet 20% of your current bankroll every time.
  *   **Outcome:** You will experience volatility. You might have a string of losses and see your bankroll drop 50%. However, you will never go to zero (mathematically), and your wealth will grow exponentially over time.
  *   **Result:** In the long run, the Kelly bettor will almost surely have more wealth than the EV maximizer (who is broke) and more wealth than any other fixed-fraction bettor.

  **The Verdict on Question 1:**
  Your friend is right. In a repeated, multiplicative environment, **maximizing arithmetic EV leads to almost certain ruin.** This is a consequence of **non-ergodicity**: the average outcome across all possible paths (ensemble average) does not equal the average outcome of a single path through time (time average). If you live in only one timeline, the ensemble average is irrelevant to your actual experience.

  ---

  ### 2. Is Kelly the *Objectively Correct* Policy for Any Rational Bettor?

  **No.** This is where your friend's argument overreaches. While Kelly is optimal for a specific goal, it relies on a specific assumption about what a rational agent values. Claiming it is the *only* rational strategy conflates **mathematical optimality** with **normative utility**.

  Here are three substantive reasons why a rational person might reject full Kelly without being "irrational."

  #### A. The Utility Function Assumption
  Decision theory (specifically Von Neumann-Morgenstern utility theory) defines rationality as acting consistently to maximize your own **utility function**, not necessarily your wealth.
  *   **Kelly implies Log Utility:** Maximizing geometric growth is mathematically equivalent to maximizing $U(W) = \log(W)$. This implies a specific attitude toward risk (Constant Relative Risk Aversion with coefficient 1).
  *   **Different Utilities:** If your utility function is $U(W) = W$ (linear), then maximizing EV *is* the rational choice. If your utility function is $U(W) = -\exp(-aW)$ (exponential), you should bet less than Kelly.
  *   **Why it matters:** If you derive happiness from wealth linearly, or if you have a specific threshold goal (e.g., "I need \$1 million to pay for a life-saving surgery, and I currently have \$500k"), maximizing growth rate might be irrational. In the surgery scenario, you might need to bet *more* than Kelly to have a non-negligible chance of hitting the target before time runs out.

  #### B. The Finite Horizon Problem
  Kelly is an asymptotic strategy; it is proven to be optimal as time $t \to \infty$.
  *   **Short Horizons:** If you only have 5 bets to make, the "almost sure ruin" of EV maximization hasn't had time to materialize, and the volatility of Kelly might prevent you from reaching a specific short-term goal.
  *   **The "Risk of Ruin" vs. "Risk of Underperformance":** Your friend argues that risk tolerance is an excuse. However, **drawdowns matter.** A full-Kelly strategy can experience drawdowns of 50% or more. If you are betting with money you need for rent next month, a 50% drawdown is catastrophic, even if the long-term trajectory is positive. Rejecting Kelly to avoid a 50% drop in net worth is not irrational; it is a rational assessment of your liquidity constraints.

  #### C. Estimation Error (The "Half-Kelly" Argument)
  This is a practical point that borders on theoretical. The Kelly criterion requires you to know the *true* edge ($p$) precisely.
  *   **Overestimation:** If you overestimate your edge even slightly, full Kelly becomes overbetting. In the example above, if you think $p=0.6$ but it's actually $p=0.55$, full Kelly betting can turn a positive growth strategy into a negative one.
  *   **Fractional Kelly:** Because we never know probabilities with certainty, many professional gamblers and investors use "Half-Kelly" or "Quarter-Kelly." This reduces volatility by 50% while retaining 75% of the growth rate. A rational agent who acknowledges their own cognitive limitations should theoretically bet *less* than full Kelly, not more.

  ### Summary: Who Was Right?

  **On the Math:** Your friend wins.
  She correctly identified that in repeated bets, arithmetic expected value is a trap. The distinction between ensemble averages and time averages is real, and ignoring it leads to ruin. If the goal is strictly "maximize wealth at the end of an infinite sequence," Kelly is the unique solution.

  **On the Philosophy:** You win.
  She incorrectly elevated a specific mathematical tool into a moral imperative. Rationality is about aligning actions with *preferences*, not just maximizing a specific metric of wealth.
  *   If you care about **long-term compounding** and can tolerate **massive volatility**, Kelly is rational.
  *   If you care about **short-term goals**, **sleeping at night**, or **surviving estimation errors**, then deviating from Kelly is rational.

  **The Synthesis:**
  You can tell your friend: *"You convinced me that EV maximization is dangerous in repeated games, and that ergodicity matters. But Kelly isn't a law of physics; it's a solution to a specific optimization problem (Log Utility). If my utility function isn't Log, or if my time horizon isn't infinite, then 'risk tolerance' isn't an excuse—it's a parameter in the equation."*

  The most "rational" approach for most humans is likely **Fractional Kelly**: it respects the geometric nature of wealth (avoiding ruin) while acknowledging human limitations and risk aversion.
