      *   *Refining the "Ruin" point:* EV maximizer doesn't just get ruined; their wealth distribution becomes extremely skewed. The *mean* is high because of a tiny number of astronomical winners. The *median* is zero.
      *   *Refining the "Rationality" point:* Emphasize that VNM rationality allows *any* consistent utility function. Log is just one. If I have linear utility ($U=W$), EV maximization *is* rational. The friend is conflating "Rationality" with "Long-term Survival."
      *   *Ergodicity:* Mention Ole Peters' work implicitly or explicitly as it's likely what the friend read. It's a compelling framework but not the only one.

  6.  **Final Review against User Prompts:**
