          *   Explain the "Ensemble vs. Time" average distinction (Ergodicity).
      *   **Part 2: The Normative Claim (Is Kelly *Always* Rational?):**
          *   Identify the hidden assumption: Utility Function. Kelly = Log Utility.
          *   Discuss Finite Horizons (The "Need \$1M by Tuesday" problem).
          *   Discuss Risk of Ruin vs. Risk of Underperformance (Drawdowns).
          *   Discuss "Rationality" definition (Von Neumann-Morgenstern).
      *   **Synthesis/Verdict:**
          *   Friend wins the math battle.
          *   User wins the philosophy war.
