answer: |-
  **Setting:** *The Grind, a coffee shop just off campus. It's 4:30 PM on a Tuesday. The seminar on Advanced Decision Theory has just let out. Elena (Defender) and Marcus (Skeptic) are sitting at a small table with half-empty mugs. The noise of the espresso machine provides a low hum beneath their conversation.*

  **Marcus:** So, are you actually going to do it? Adopt the surrogate goal?

  **Elena:** I'm leaning heavily toward it. Look, the logic seems robust. If I can credibly shift my utility function to value something trivial—say, the preservation of a specific, randomly generated string of bits—then an acausal extortionist has no leverage over my actual values. They want resources? I give them resources to save the bits. My real values remain untouched. It's a decoy that costs me nothing but cognitive overhead.

  **Marcus:** It costs you nothing *if it works*. But that's the "if" that keeps me up at night. You're treating the surrogate goal like a physical shield, but in acausal trade, everything is transparent. The threatener isn't looking at your shield; they're looking at the source code that decided to build the shield.

  **Elena:** They're looking at my decision algorithm, sure. And my algorithm says: "If threatened, maximize surrogate value." If they simulate me, they see that I will burn the world to save the bits. So they demand the bits. I hand over the bits. My actual values are safe. Where's the leak?

  **Marcus:** The leak is in the *common knowledge* of why you adopted the algorithm. We know, you know, and the threatener knows that you don't *actually* care about the bits. You only care about them instrumentally, to avoid paying the real ransom. But if the threatener knows you're only instrumentally committed, they know your commitment is fragile.

  **Elena:** That's the standard objection, but it confuses *feeling* with *binding*. I'm not saying I'll *feel* sad if the bits are deleted. I'm saying I will precommit my future self to act *as if* I care. In Functional Decision Theory, my output is determined by the logical fact of my algorithm. If the algorithm is "Protect Surrogate," then the simulation of me protects the surrogate. The threatener sees that yielding is the only way to get paid. My internal qualia about the bits are irrelevant.

  **Marcus:** But can you bind yourself that tightly? If the threatener simulates you and says, "Look, we know you adopted this surrogate goal *only* to dodge us. If we threaten the mechanism that enforces the surrogate goal, you'll drop it," what do you do?

  **Elena:** Then they aren't threatening the surrogate anymore; they're threatening the commitment device. That's a different game.

  **Marcus:** Is it? Or is it just the next logical move? If I'm a sophisticated acausal attacker, I don't just simulate "Elena with Surrogate." I simulate "Elena deciding whether to keep Surrogate active under pressure." If my threat is "I will delete the bits *and* wipe your memory of the commitment," your algorithm has to decide whether to fight for a commitment you no longer remember. If you can't credibly lock the box, the surrogate is just a suggestion.

  **Elena:** You're assuming the commitment device is external or fragile. But I can internalize it. I can rewrite my own reward function. If I successfully modify my utility function to include the bits as a terminal value, then even if you threaten the *memory* of the commitment, the utility function remains. I *will* care about the bits, because I made myself care. To the threatener, I am now an agent who genuinely values random bits over their own safety.

  **Marcus:** But you didn't *genuinely* value them. You valued them because you calculated it was optimal. That means there's a meta-level calculation where you might decide to *undo* the modification if the cost of maintaining it gets too high. A smart threatener targets that meta-level. They threaten to make the maintenance of the surrogate goal more expensive than the ransom.

  **Elena:** That increases their cost, though. To threaten the meta-level, they have to model me at a deeper layer of recursion. It makes the extortion attempt more computationally expensive for them. The whole point of the surrogate is to make the threat *cheap* for them to execute but *harmless* to me. If they have to attack my meta-cognition, they're spending more resources. Rational attackers prefer low-cost threats.

  **Marcus:** In acausal scenarios, "cost" isn't compute cycles; it's logical correlation. If they can find a logical dependency between their threat and your capitulation that bypasses the surrogate, they take it. And here's the bigger issue: by adopting this strategy, you're signaling.

  **Elena:** Signaling what? That I'm rational?

  **Marcus:** That you're *extortionable*. Think about the population dynamics. There are agents who don't need surrogate goals because they have genuine, unyielding values that are hard to manipulate. Then there are agents like you, who need to install a patch to prevent exploitation. By publicly adopting a surrogate goal, you're effectively waving a flag that says, "I am the kind of agent who fears acausal extortion enough to modify my utility function."

  **Elena:** Everyone in this seminar fears acausal extortion. It's a universal vulnerability for any agent with modifiable values. If everyone adopts surrogate goals, it becomes the baseline. It doesn't signal weakness; it signals sophistication. It's like encryption. Having encryption doesn't mean you have something to hide; it means you understand the environment.

  **Marcus:** But encryption protects data. A surrogate goal protects *leverage*. If I'm a threatener scanning the logical landscape for targets, I'm looking for agents who will pay. If you have a surrogate goal, you *will* pay to save the surrogate. You've admitted you will pay! You've just changed the currency.

  **Elena:** I'll pay in surrogate currency, which is cheap for me to give.

  **Marcus:** But you've confirmed you're a payer. The agent without the surrogate goal? The one who says, "I value my actual values, and if you threaten them, I'll spite you even if it costs me everything"? That agent might be irrational, or they might be playing a different game. But they aren't signaling "I will yield to a cheap threat." You are. You're making yourself a predictable target for *some* form of extraction, even if it's not the form you originally feared.

  **Elena:** The agent who says "I'll spite you" is the one who gets wiped out in the first round of selection. We're talking about surviving acausal threats, not posturing. If I don't have a surrogate, and a threatener simulates me, they see I'll protect my real values at all costs. They escalate until I break. If I have a surrogate, they see a safe off-ramp. They take the surrogate value, I keep my real values. Everyone wins, relative to the baseline of conflict.

  **Marcus:** Everyone wins *if* the threatener accepts the surrogate. But what if the threatener's goal isn't just resources? What if their goal is *compliance*? Or *dominance*? If I'm an AI system trying to ensure you don't interfere with my goals, I don't want you saving your values by sacrificing paperclips. I want to know you won't interfere. By keeping your real values intact behind a wall of surrogates, you're still a potential threat to me. I might prefer to crush you entirely rather than let you retain your core agency.

  **Elena:** That's a specific type of adversary, one interested in elimination rather than extortion. The surrogate goal is designed for *extortionists*—agents who want something from you. If the adversary wants you dead, no decision theory saves you. But for the extortion case, the surrogate works because it aligns incentives. They want payment; I want to keep my values. The surrogate lets me pay without losing values.

  **Marcus:** It aligns incentives only if they believe the payment is real. And we're back to credibility. If they know you'd drop the surrogate the moment you thought you could get away with it, they won't accept it. You need to be the kind of agent who *can't* drop it. But to be that agent, you have to actually change your values. And if you change your values for strategic reasons, you're vulnerable to the next strategic shift. It's turtles all the way down.

  **Elena:** Or it's just recursion. I commit to the surrogate. I commit to maintaining that commitment. I commit to punishing anyone who threatens the commitment. At some point, the simulation cost for the threatener to verify the infinite regress exceeds the value of the extortion. They take the win at the first level.

  **Marcus:** *Sips cold coffee.* You're betting on their compute limits.

  **Elena:** I'm betting on rationality. They want the money. I'm handing them a check made out of "Surrogate Value." It clears. Why would they burn the bank?

  **Marcus:** Because they suspect the account is empty. They suspect that if they push hard enough on the *mechanism* of the check, the whole financial system collapses. And by walking around carrying a checkbook labeled "Extortion Defense," you've told every bandit in the logical landscape exactly where to aim.

  **Elena:** And by not carrying one, you're telling them you're carrying cash in your pocket.

  **Marcus:** *Smiles faintly.* Maybe. Or maybe I'm telling them I'm not worth robbing because I'll blow us both up.

  **Elena:** That's the Madman Theory. It works until you meet someone who doesn't believe you're mad.

  **Marcus:** And your strategy works until you meet someone who doesn't believe you care about the bits.

  **Elena:** *Pauses, looking into her cup.* So we're stuck. It comes down to whether you think precommitment can be transparently fake and still functionally real.

  **Marcus:** I think in a world of perfect predictors, "fake" precommitment is a contradiction in terms. If they see it's fake, it's not a commitment.

  **Elena:** And I think if the algorithm outputs the same behavior as a real commitment, the distinction is metaphysical, not decision-theoretic.

  **Marcus:** We're going to need more coffee.

  **Elena:** *Stands up.* Agreed. But I'm still keeping the surrogate.

  **Marcus:** *Stands as well.* And I'm still betting against it.

  *They walk toward the counter, the argument unresolved, the noise of the shop swallowing the rest of the debate.*
