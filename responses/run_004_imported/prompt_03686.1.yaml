      *   *Argument 2: Dynamic Inconsistency / Akrasia.* At the moment of the final trade ($C \to A$), the agent prefers $A$ (minus fee) to $C$. To stick to the plan, they must act *against* their current all-things-considered judgment. This is practically irrational (akrasia). If rationality is about aligning action with judgment, resolute choice fails.
