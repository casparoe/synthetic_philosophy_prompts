  2.  **Deconstruct the Arguments & Interpretations:**

      *   *The Sophistry Charge:* Easy to dismiss too quickly, but needs to be addressed. Why did Confucians/Mohists hate it? Because it disrupts social order/language norms (*zhengming*). Is it *just* tricks? Probably not, given the structural rigor.
      *   *Graham's Ambiguity:* *Fēi* usually means "is not." In logic, $A$ is not $B$ can mean $A \neq B$ (identity) or $A \notin B$ (class membership).
