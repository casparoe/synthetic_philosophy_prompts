answer: |-
  This is a profound and deeply honest ethical dilemma you are grappling with. It takes significant integrity to look at a situation where you haven't been caught, haven't caused harm, and yet feel that you are standing on the same precipice as someone who has fallen.

  To answer your core question directly: **Ethically, you and your colleague are equally culpable for the choices you made.** The difference between you is not moral character or decision-making; it is purely **resultant moral luck.**

  Here is a breakdown of the ethical dynamics at play, why your reaction differs from your coworker's, and what this means for you moving forward.

  ### 1. The Philosophy of Moral Luck
  You have intuitively discovered a concept philosophers call **Moral Luck**. Specifically, you are dealing with *resultant luck*—where factors outside your control (whether the supplier actually changed the formula) determine how your action is judged.

  *   **The Choice:** Both you and your colleague made the exact same calculation: *The inconvenience of the call outweighs the statistical probability of a formulation change.*
  *   **The Risk:** Both of you introduced the exact same level of risk to a customer's life.
  *   **The Outcome:** For him, the risk materialized. For you, it has not.

  From a **Deontological (duty-based)** perspective, you are equally blameworthy. You both violated a duty of care and a specific safety protocol. The morality of the act lies in the willingness to endanger someone, not in whether they actually got hurt.

  From a **Consequentialist (outcome-based)** perspective, your colleague is "worse" because harm occurred. This is how the legal system and most HR departments operate. They judge based on damages. This is why he was fired and you were not. It is a practical system for managing liability, but as you have noticed, it is not a perfect system for measuring *moral guilt*.

  ### 2. Why "Nothing Happened" Is Not a Defense
  Your coworker's comment ("nothing's happened, so you're fine") represents a common cognitive bias called **Normalcy Bias**. It assumes that because a disaster hasn't happened yet, the system is safe.

  In safety-critical industries (aviation, healthcare, food allergens), this logic is known as "drifting into failure." It works like this:
  1.  A rule exists for safety.
  2.  The rule is inconvenient.
  3.  Someone skips the rule.
  4.  Nothing bad happens.
  5.  The brain registers this as "The rule wasn't actually necessary," rather than "We got lucky."
  6.  The behavior is reinforced.

  Your colleague is the statistical inevitability of that process. You are currently in step 4. The fact that you feel uneasy is your moral immune system telling you that you are infected with the same recklessness, even if the symptoms haven't shown yet.

  ### 3. Are You Equally to Blame?
  **Yes.** If blame is defined as "moral responsibility for making a dangerous choice," you share the blame equally.

  However, there is a distinction between **blame** and **accountability**.
  *   **Blame** is internal and moral. It asks: *Did you knowingly disregard safety?* (You both did).
  *   **Accountability** is external and social. It asks: *Who must answer for the damage?* (Only he does, because only he caused damage).

  It is reasonable for the *company* to treat you differently because they are reacting to harm. It is **not** reasonable for *you* to treat yourself differently if you value your own integrity. Relying on luck to determine your self-worth is a fragile foundation.

  ### 4. The Danger of the "Secret"
  The reason you feel worse now is that the abstraction has become concrete. Before the incident, skipping the call was a "risk." Now, you know it is a "cause."

  You are carrying a secret knowledge: *I am doing the thing that sent someone to the hospital.* This creates cognitive dissonance. You see yourself as a careful person, but your actions are those of the person the company labeled "careless."

  ### 5. What Should You Do?
  You asked about blame, but the more urgent question is about action. You are in a unique position. You have seen the consequence of the shortcut without having to pay the price for it yet. This gives you a chance to correct the course that your colleague didn't have.

  1.  **Stop the Shortcut Immediately:** This is non-negotiable. Every time you skip the call, you are rolling the dice with someone's life. The fact that the supplier hasn't changed the formula *yet* does not mean they won't tomorrow.
  2.  **Reframe the Inconvenience:** A 20-minute delay is an operational issue. Anaphylactic shock is a life-and-death issue. If the rush makes safety impossible, the rush needs to be managed differently, not safety compromised.
  3.  **Address the Systemic Issue:** If the procedure is consistently impossible to follow during rushes, that is a management failure, not just an employee one. You might consider raising this (anonymously if necessary): *"The current verification process creates a bottleneck that tempts staff to skip safety checks. Can we streamline this?"*
  4.  **Forgive Yourself, But Don't Excuse Yourself:** You don't need to carry shame forever, but you must not use "no harm done" as an excuse to continue. Acknowledge that you took a risk, recognize it was wrong, and commit to the protocol.

  ### Summary
  Your colleague is not morally more careless than you; he was just less lucky. But luck is not a strategy.

  The discomfort you feel is a good sign. It means your ethical compass is working better than your coworker's. Listen to it. The difference between a "near miss" and a "tragedy" is often just a single phone call. You have the power to ensure that your story ends differently than your colleague's, not by luck, but by choice.
