  Ironically, this student's answer aligns with your co-TA's critique (that Strawson is just offering a sophisticated utility argument) rather than yours (that he's doing deeper naturalistic work). However, standard textual interpretation suggests the student is slightly off: Strawson explicitly argues *against* the idea that social utility is the *foundation* of the practices, even if it is a happy byproduct. He grounds them in the "natural history of man." If you grade this down for conflating naturalism with utilitarianism, you're implicitly validating your own reading of the text over your friend's!

