      *   **User:** Optimizing for *epistemic honesty*.
      *   **The Solution:** Shift from "Verification of Truth" to "Verification of Process/Consensus." The second quote isn't to check the math (the peer review did that); it's to check the *significance* and *limitations*.
      *   **Nuance:** Not all papers need the same treatment. A press release vs. a pre-print vs. a landmark study.

