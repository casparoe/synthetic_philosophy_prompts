answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of being Priya's friend for [Number] years.

  When Priya asked me to give this toast, she gave me one piece of advice. She said, "Please don't make it too abstract." And I promised I wouldn't. But those of you who know Priya know that she lives in the abstract. She is an epistemic game theorist. Which is a fancy way of saying she studies how people know what they know, and how they decide to trust each other when the stakes are high.

  And honestly, spending time with Priya has changed how I see the world. Specifically, it made me obsessed with a distinction that sounds tiny but is actually everything: the gap between *mutual knowledge* and *common knowledge*.

  Mutual knowledge is when I know something, and you know something. For example, I know Priya loves [Fiancé's Name], and [Fiancé's Name] knows Priya loves him. That's mutual. That's private. That's a text message.

  But *common knowledge* is deeper. Common knowledge is when I know it, you know it, *and* I know that you know that I know it, and you know that I know that you know... all the way down the line.

  There's a famous problem in game theory called the "Coordinated Attack Problem." Imagine two generals on opposite hills. They need to attack at dawn to win. If only one attacks, they die. They send messengers back and forth to confirm the time. Messenger 1 gets through. General A knows. But General A doesn't know if General B got the confirmation. So Messenger 2 goes back. But now General B doesn't know if Messenger 2 made it safely...

  The math says that with only private messages, they can never be 100% sure. The loop never closes. They get stuck in an infinite regress of "Did you get my read receipt?" and they never attack. They never move.

  *(Pause for a beat)*

  For the three people in this room currently calculating the epsilon-equilibrium of this relationship: yes, I see you nodding. For the rest of you: they were overthinking it, and almost missed the battle.

  Because the solution to the Coordinated Attack Problem isn't more messengers. It's a public signal. It's a flare shot into the sky that *everyone* sees, and everyone sees *everyone else* see.

  And that is exactly what we are doing here today.

  Priya and [Fiancé's Name], you could have just signed a paper at city hall. You could have sent emails. That would have been mutual knowledge. But you didn't do that. You brought us here.

  You stood up in front of your parents, your friends, your aunts, your uncles, and us. You made a public vow.

  By witnessing this, we aren't just guests. We are the infrastructure. We are the mechanism that turns your private love into common knowledge. Because now, I know you're committed. And I know that *you* know that *I* know. And more importantly, you know that if you ever forget, I'm going to be here to remind you.

  [Fiancé's Name], Priya spends her life modeling rational agents. You, as far as I know, have never read a paper on Aumann's agreement theorem. And that is your superpower. You didn't need the math to solve the coordination problem. You just showed up. You realized that love isn't about being certain in private; it's about being accountable in public.

  Priya, you found someone who doesn't need a proof to trust you. He just needs to look at you.

  So, why do we have weddings? Why do we make such a fuss? It's not just for the cake, though this cake is excellent. It's because human beings cannot sustain a promise in a vacuum. We need a village to hold the knowledge of that promise for us. We need the common knowledge that you are not alone.

  Priya, [Fiancé's Name]: You have closed the loop. The attack is coordinated. The signal has been received. And looking around this room, I think it's safe to say the message was loud and clear.

  Please raise your glasses.

  To the signal, to the witnesses, and to the happy equilibrium of Priya and [Fiancé's Name].

  Cheers.
