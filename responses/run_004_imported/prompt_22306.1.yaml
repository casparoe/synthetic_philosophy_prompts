  Ok so my friend Priya's getting married in a few weeks and asked me to give the toast, and I want to build it around something I've been chewing on for years from lurking on rationalist blogs: the gap between mutual knowledge and actual common knowledge. Priya does epistemic game theory for a living (common knowledge of rationality, that whole area) and her fiance has never read a game theory paper in his life, so maybe a third of the room will clock exactly what I'm doing and the rest will just hear a nice story about my friend. The bit I want to use: you can never fully reach common knowledge through private back-and-forth alone, like the coordinated attack problem where two generals sending messengers can never be 100% sure the loop closed -- which is apparently part of why you have a big public wedding instead of just telling everyone individually your getting married. The ceremony itself, everyone watching everyone else watch it happen, generates real common knowledge in a way a pile of private mutual knowledge never does. Can you write me a 5ish minute toast that actually uses this as the backbone, not just a name-drop, and gets one genuine laugh out of the game theorists in the room while still landing fine for the aunts and uncles who've never heard of Aumann? Should end up sincere, not just clever.
