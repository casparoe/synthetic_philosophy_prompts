answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain taps against the window. Two philosophers, ELENA and MARCUS, are sitting with coffees. Elena specializes in practical reason and value theory; Marcus focuses on meta-ethics and decision theory. They have been discussing a mutual acquaintance's dilemma: a choice between a high-paying quantitative research job and a funded PhD in mathematical logic.*

  **Elena:** It's exactly the kind of case Ruth Chang describes. Your acquaintance says the choice feels "impossible," yet neither option is unclear. They know exactly what they're giving up and gaining. That phenomenology is the data point. The trading job wins on security and filial duty; the PhD wins on intellectual autonomy and meaning. These aren't just different quantities of the same thing. They are *on a par*.

  **Marcus:** I'm wary of multiplying value relations beyond necessity. We have "better than," "worse than," and "equally as good as." Why posit a fourth relation? What your friend is experiencing isn't a metaphysical novelty; it's vagueness. Value predicates are like "tall." There isn't a precise millimeter where a person becomes tall. Similarly, there isn't a precise dollar amount where the trading job becomes "better" than the PhD. They are *imprecisely equal*.

  **Elena:** But imprecise equality collapses under the Small-Improvement Argument. Imagine we take the trading job offer and improve it slightly. Say, the firm adds a signing bonus of five thousand dollars. Call this Job+. If the original Job and the PhD were merely imprecisely equal, Job+ should be determinately better than the PhD. A small nudge should break the tie. But in hard choices like this, it doesn't. If you offer your friend that extra five thousand, they will still say, "I still can't choose." The difficulty persists. That implies the original options weren't in a relation of equality, even imprecise ones. They were on a par.

  **Marcus:** You're moving too fast. The Small-Improvement Argument assumes that the "zone of imprecision" is narrow. But in significant life choices, the zone of indeterminacy is wide. Think of it like comparing two clouds. Is Cloud A bigger than Cloud B? They overlap in volume. If I add a wisp of vapor to Cloud A, it doesn't suddenly become determinately bigger. It's still within the range of indeterminacy.

  Apply that to your friend. The values at stake—security versus meaning—are distinct. The "exchange rate" between them is inherently fuzzy. A five-thousand-dollar bonus might fall entirely within that fuzzy zone. It's not that there's a fourth relation; it's that the "better than" relation simply doesn't yield a truth value for small changes. That's not parity; that's just the nature of vague predicates.

  **Elena:** But if it's just vagueness, then there *is* a fact of the matter, we just can't see it. Or, eventually, a large enough improvement *must* tip the scale. If I offer your friend a million-dollar signing bonus, surely the job becomes better?

  **Marcus:** Of course. At some extreme, the comparison resolves.

  **Elena:** Exactly. But here is the crux: If it were just vagueness, then between the original Job and the Million-Dollar Job, there is a chain of tiny improvements. At some point in that chain, the relation must switch from "not better than" to "better than." But where? If you say the switch happens at step 452 of the chain, that seems arbitrary. Why step 452 and not 453?

  **Marcus:** I don't need to identify the step to admit the switch exists. Sorites paradoxes plague all vague concepts. We don't solve the problem of "when does a man become bald?" by inventing a fourth relation between "bald" and "hairy." We accept that some concepts have boundary regions. Your friend is standing in the boundary region of "choice-worthy."

  **Elena:** The difference matters for your friend, Marcus. It matters practically. If you're right—if this is just imprecise equality—then your friend is in an epistemic bind. They are waiting for a resolution that the world hasn't provided yet. They should keep calculating, keep looking for more information, or perhaps accept that they are guessing about a fact that exists independently of them.

  But if I'm right—if this is parity—then the lack of a determining reason is not a defect. It's an opening. Parity implies that the reasons run out. If the reasons run out, *will* can step in. When options are on a par, you don't find the reason to choose; you *create* the reason through commitment. By choosing the PhD, your friend makes it the case that the PhD was the right choice for them, because they commit to living out that value.

  **Marcus:** That sounds empowering, but it risks subjectivism. If I can just "create" reasons by willing it, isn't any choice as good as any other? If your friend chooses the trading job, can they just will that into being the "meaningful" choice?

  **Elena:** No. Parity only holds between options that are already in the same neighborhood of value. You can't be on a par with becoming a professional wrestler if you have no training. But between two genuinely good, comparable life paths? Yes. If they choose the trading job, they must *back* that choice. They must embrace the security and the support of their parents as the defining narrative of their life. They normalize the choice. The difficulty they feel now? That's the friction of agency.

  **Marcus:** I worry you're romanticizing the anxiety. Let's look at the Small-Improvement Argument again, concretely. Suppose we improve the PhD. Not with money, but with status. Suppose the supervisor your friend admires promises them a co-authorship on a major paper. Call this PhD+. Is PhD+ clearly better than the Trading Job?

  **Elena:** Probably not. That's the point.

  **Marcus:** But suppose the supervisor promises a guaranteed tenure-track placement afterward. Now is it better?

  **Elena:** Likely, yes.

  **Marcus:** So there *is* a tipping point. There is a magnitude of improvement where the PhD becomes determinately better. This suggests the options *are* comparable on a single scale of "overall choiceworthiness," it's just that the scale is granular. The Small-Improvement Argument fails because the "small" in "small improvement" is doing too much work. A five-thousand-dollar bonus is small relative to a career. It's not surprising it doesn't tip the scale. That doesn't prove parity; it just proves the scale is coarse-grained.

  **Elena:** But why is the scale coarse-grained? The Parfit/Griffin view says it's because our concepts are vague. I say it's because the values are *different in kind*. Money and logic aren't just different amounts of "goodness." They are different dimensions. When you compare across dimensions, you aren't measuring; you are negotiating.

  Think about your friend's specific worry: "Neither cluster of advantages seems to straightforwardly outweigh the other." If it were imprecise equality, they would feel like they are looking at a blurry picture. They would think, "If I just squinted harder, I'd see which is taller." But they don't feel that. They feel like they are choosing between two different languages. You can't say English is "blurrier" than French.

  **Marcus:** I think that's a metaphor, not an argument. Let's talk about the risk. If I advise my student based on your view, I tell them: "There is no right answer until you make one. Commit!" If I advise them based on my view, I tell them: "The truth is indeterminate here. The values are too vague to yield a precise ranking. So, you are free to use a tie-breaker."

  **Elena:** And what tie-breaker?

  **Marcus:** Anything. A coin flip. A preference for the city you live in. The fact that one program starts sooner. If the values are imprecisely equal, then within that zone of imprecision, secondary considerations become decisive. You don't need to "create" a reason through existential commitment. You just acknowledge that the primary values have run out of precision, so you let the secondary values decide.

  **Elena:** But that treats the choice as a burden to be discharged. "Flip a coin and get on with it." That ignores the long-term meaning your friend cares about. If they flip a coin for the trading job, and then five years in they feel empty, they'll regret it. Why? Because they didn't *stand for* anything.

  If they accept parity, they understand that the emptiness isn't a sign they chose wrong. It's a sign they need to invest the choice with meaning. The difficulty of the choice is the price of autonomy. If the world told them exactly what to do, they would be a passenger. Because the world is silent—because the options are on a par—they are the driver.

  **Marcus:** I agree they are the driver, but I disagree about the silence. The world isn't silent; it's just noisy. There are facts about their psychology, their resilience, their capacity for abstraction versus their need for stability. My view encourages them to look for those facts. "Can you handle the poverty of a PhD?" "Will the trading job bore you to tears?" These are empirical questions.

  Your view tells them: "It doesn't matter what the facts say about your resilience, because the values are on a par." That seems dangerous. If they are psychologically unsuited for logic, parity doesn't save them.

  **Elena:** Parity doesn't suspend the facts. It operates *after* the facts are weighed. We are assuming, for the sake of this argument, that they are qualified for both and both are genuinely good. Given that, your view says, "The scale is balanced, roughly." My view says, "The scale doesn't apply."

  Here is the practical test for your friend. Ask them: "If you chose the PhD, and ten years later you realized the trading job would have made you richer and your parents more secure, would you view that as a tragedy?"

  **Marcus:** And if they say yes?

  **Elena:** Then they shouldn't choose the PhD. But if they say, "No, because by choosing the PhD, I became the kind of person for whom logic *was* the right path," then they are experiencing parity. They understand that the value of the choice is partly constituted by the choice itself.

  **Marcus:** I can accept that the choice changes the person without accepting a fourth value relation. That's just the passage of time. But let's return to the Small-Improvement Argument one last time. I want to press you on the "smallness."

  Suppose we improve the Trading Job not by money, but by alignment. Suppose the firm allows them to work on pure mathematical models, no trading risk, just research. It's basically the PhD, but paid. Is that on a par with the PhD?

  **Elena:** That changes the nature of the option. You've turned the Job into a hybrid.

  **Marcus:** I've made a small improvement to the Job's intellectual fulfillment. If your theory holds, and they are on a par, then this Job+ should still be on a par with the PhD. But intuitively, if the Job offers the *same* intellectual fulfillment plus the money, it *is* better. It dominates.

  **Elena:** That's not a small improvement; that's a structural change. You've aligned the dimensions. Parity exists when the dimensions clash. Money versus Meaning. Security versus Autonomy. When you align them, you collapse the hard choice into an easy one. The Small-Improvement Argument works when you improve an option *on its own terms* or by a marginal amount that doesn't resolve the clash. A bonus is money. A co-authorship is meaning. Neither resolves the clash.

  **Marcus:** And that is where we stand. I see a zone of indeterminacy where "better than" fails to apply due to the vagueness of value. You see a positive relation of parity where "better than" fails to apply due to the distinctness of value.

  **Elena:** And for your friend?

  **Marcus:** If I'm right, they should stop torturing themselves looking for a precise weighing that the universe cannot provide. They should accept the imprecision, pick a secondary preference—maybe they like the city of the university more—and go. The guilt of "maybe I chose wrong" is misplaced because there was no precise "right" to begin with.

  **Elena:** And if I'm right, they should stop looking for external justification entirely. No secondary preference is enough. They need to look inward. Which path do I want to *make* right? Which struggle do I want to own? The hardness of the choice isn't a bug; it's the feature. It's the space where they define themselves.

  **Marcus:** So, on your view, the anxiety is productive. On my view, the anxiety is a cognitive error regarding vagueness.

  **Elena:** Precisely.

  **Marcus:** Then I suppose the only way your friend decides which of us is right... is to make a hard choice.

  **Elena:** *Smiles.* On a par with any other philosophical conclusion.

  **Marcus:** *Chuckles.* Indeed. Shall we order more coffee?

  **Elena:** Only if you're willing to admit the espresso here is on a par with the tea, not better.

  **Marcus:** I think I can live with that indeterminacy.
