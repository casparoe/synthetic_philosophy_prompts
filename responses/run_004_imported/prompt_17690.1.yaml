      *   Marcus should sound skeptical but empathetic.
      *   Avoid jargon where possible, or explain it immediately.

  8.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Chang vs. Parfit/Griffin? Yes.
      *   Small-Improvement Argument engaged? Yes.
      *   Concrete application (Job vs. PhD)? Yes.
      *   No obvious winner? Yes.

  *(Self-Correction during drafting)*: I need to make sure Marcus doesn't just say "you're confused." He needs to say "your confusion is about the world's vagueness, not a new relation." Also, I need to ensure Elena explains *why* parity matters for agency. If it's just vagueness, I wait for clarity. If it's parity, I *create* clarity. This is the crucial practical difference for the user.

  9.  **Final Polish:** Check the flow and ensure the ending leaves the user with something to think about regarding their own agency. (Proceed to generate output).

  *(Post-Drafting Thought)*: Make sure the distinction between "incomparable" and "on a par" is clear, as the prompt mentions it. Chang says they *are* comparable, just not via the trichotomy. Marcus says they are comparable via the trichotomy, but the result is indeterminate.

