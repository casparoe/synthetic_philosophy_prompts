answer: |-
  This is an exceptionally sharp observation, and the unease you feel is a sign of good scientific intuition. You have stumbled upon one of the deepest fault lines in modern statistics. Your labmates are not merely arguing about a calculation; they are arguing from two different philosophical frameworks about what statistics *are* and what they are *for*.

  Neither labmate is "confused." However, one is arguing from the framework that currently governs publication and tenure in social psychology, while the other is arguing from a framework that is theoretically robust but less institutionally entrenched.

  Here is the structure of the disagreement, the reality of your disciplinary context, and how you should handle your committee.

  ### 1. The Structure of the Disagreement

  To understand why both arguments feel compelling, you need to see which statistical "language" each labmate is speaking.

  **Labmate 1: The Frequentist (Error Control)**
  *   **The Framework:** Neyman-Pearson Frequentism.
  *   **The Goal:** To control long-run error rates. A $p$-value is not a measure of evidence; it is a measure of how surprising the data is *assuming a specific sampling plan was followed rigidly.*
  *   **The Argument:** In this framework, the "sampling space" includes all the data you *could* have collected but didn't. By checking the data after 60, 80, and 100 participants, you created multiple opportunities to find a false positive. If the null hypothesis is true, you gave yourself more than one chance to reject it. Therefore, your nominal $p < .05$ is actually much higher (potentially $p \approx .15$ or more, depending on the number of "peeks").
  *   **Verdict:** Within standard Frequentist hypothesis testing, Labmate 1 is mathematically correct. This practice is often termed "optional stopping" and is classified as a Questionable Research Practice (QRP) in modern social psychology.

  **Labmate 2: The Likelihood/Bayesian (Evidential Strength)**
  *   **The Framework:** The Likelihood Principle (common in Bayesian and Likelihoodist statistics).
  *   **The Goal:** To measure the strength of evidence provided by the *actual* data observed.
  *   **The Argument:** The evidence contained in the data depends only on what happened, not on what *might* have happened. If you observed a specific mean difference with a specific variance at $N=100$, the likelihood ratio favoring the alternative over the null is identical regardless of whether you planned to stop at 60 or 100. The stopping rule is irrelevant to the *evidence*, even if it is relevant to *decision policies*.
  *   **Verdict:** Within the Likelihood/Bayesian framework, Labmate 2 is mathematically correct. The data itself has not changed; only the interpretation of the $p$-value has.

  ### 2. The Disciplinary Reality

  Here is the difficult part: **Social psychology is currently a Frequentist discipline undergoing a reproducibility crisis.**

  Following the replication crises of the 2010s, the field has moved aggressively toward pre-registration and strict error control. Journals and committees are currently hyper-vigilant about QRPs. While Labmate 2 is philosophically sound, citing the Likelihood Principle to defend an uncorrected $p$-value in a social psychology dissertation will likely be viewed as defensive or naive by a committee.

  Why? Because the $p$-value you reported is a Frequentist metric. You cannot use a Frequentist metric ($p$-value) while ignoring Frequentist rules (fixed sampling plan), and then defend it with Bayesian logic (Likelihood Principle). That is mixing currencies. If you want to use Labmate 2's logic, you should ideally be reporting Bayes Factors, not $p$-values.

  ### 3. How to Handle the Committee and Methods Section

  You cannot simply defer to the labmate who argued more forcefully, but you also cannot ignore the methodological norms of your field. Here is a strategy for navigating this:

  **A. Do Not Hide the Procedure**
  Transparency is your best shield. Describe the data collection procedure exactly as it happened in the methods section. Hiding it risks your credibility if questioned later.

  **B. Acknowledge the Limitation (The "Sandwich" Method)**
  In your methods or discussion section, explicitly acknowledge the optional stopping.
  *   *Drafting thought:* "Data collection proceeded in batches with interim analyses. While this approach aligns with the Likelihood Principle (Labmate 2's view), we acknowledge that under standard Frequentist assumptions, this inflates Type I error rates (Labmate 1's view)."
  *   *Why:* This shows the committee you understand the methodological nuance. You aren't ignorant of the QRP; you are making a transparent report of it.

  **C. Re-Analyze if Possible**
  Before the meeting, ask your advisor if you can run two additional analyses to bolster the result:
  1.  **Sequential Analysis Correction:** There are Frequentist methods for optional stopping (e.g., alpha-spending functions or sequential probability ratio tests). If you can apply a correction factor to your $p$-value to account for the "peeks," do so. Even if the result becomes non-significant, reporting the corrected value shows rigor.
  2.  **Bayesian Analysis:** Since Labmate 2's argument holds water in Bayesian statistics, run a Bayesian t-test or regression. Report the Bayes Factor ($BF_{10}$). If the Bayes Factor is strong (e.g., $> 10$), it supports the hypothesis regardless of the stopping rule. This gives you a " Labmate 2" line of evidence to support your "Labmate 1" $p$-value.

  **D. The Advisor Dynamic**
  Your advisor suggested this procedure. This is delicate. Do not throw them under the bus, but do not let their suggestion absolve you of methodological responsibility. Frame it as a learning experience.
  *   *To the committee:* "This study was conducted during a period of methodological transition in the lab. Moving forward, I am adopting pre-registration to ensure strict error control."

  ### 4. Recommendation for the Future

  You asked how you should do things differently going forward. The consensus in modern social psychology is to **pre-register**.

  *   **Pre-registration:** Before collecting data, you publicly state your sample size, hypotheses, and analysis plan. This fixes the "sampling space" and validates the Frequentist $p$-value (satisfying Labmate 1).
  *   **Sequential Design:** If you want the flexibility to stop early or collect more data, use a registered "Sequential Design." This allows you to check data at intervals *provided* you use the correct statistical corrections (satisfying Labmate 1 while keeping flexibility).
  *   **Bayesian Methods:** If you care more about evidence than error rates, switch to Bayesian statistics formally. This validates Labmate 2's view, but requires you to stop using $p$-values as your primary metric.

  ### Summary

  Your labmates are both "right" within their own axiomatic systems, but **Labmate 1 is right about the norms of your field.**

  If you submit a dissertation chapter with an uncorrected $p < .05$ obtained via optional stopping without qualification, you risk your committee flagging it as a QRP. However, if you frame it transparently, acknowledge the inflation of Type I error, and perhaps supplement it with a Bayesian analysis or a corrected $p$-value, you turn a methodological vulnerability into a demonstration of your statistical maturity.

  You are not in trouble for having done this; many researchers did this five years ago. You *would* be in trouble for pretending the issue doesn't exist now. Acknowledge the tension, report the data transparently, and commit to pre-registration for your next study.
