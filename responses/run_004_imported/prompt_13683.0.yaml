answer: |-
  **Elias:** You're looking at the water like you expect the math to rescue them.

  **Sarah:** I'm looking at the water like I expect *you* to rescue the five. We've been circling Taurek for twenty minutes, Elias. The case is simple. I can throw the life preserver to the group on the left, or the single swimmer on the right. The current takes one or the other. Why is it not obvious that I throw to the five?

  **Elias:** Because it's not obvious that "the five" is a thing that can be saved. There are five people. Each faces the same loss as the one person on the right: death. For the single swimmer, the loss is total. For each of the five, the loss is total. Where is this "greater loss" located? It's not in the single swimmer. It's not in any of the five. It exists only in your head, in an impersonal calculus that sums up tragedies as if they were units of currency in a social ledger. Taurek was right: there is no one who suffers the loss of five.

  **Sarah:** There is no one who suffers the loss of five, but there are five people who suffer the loss of one. If I ignore that, I'm not respecting the individuals; I'm fetishizing the isolation between them. You say the loss isn't aggregated. Fine. But the *claims* are. Each of the six people has an identical claim to be saved. If I treat them equally, don't I have to acknowledge that there are five claims on the left and one on the right?

  **Elias:** You're smuggling aggregation in through the back door of "claims." If I flip a coin—heads I save the one, tails I save the five—I am giving equal weight to the two options. I am respecting the fact that the one person's claim is not *outweighed* by the five. To say the five should be saved is to say the one person's life is worth less than the sum of the others. I refuse to make that trade. So I flip. Fifty-fifty.

  **Sarah:** That fifty-fifty split is the problem. You're flipping between *groups*, not people. You're saying the group of five counts as one unit, equal to the unit of the one. But they aren't a unit. They are five individuals. If you want to respect individual equality, you don't give each *side* a 50% chance. You give each *person* a 50% chance relative to the others.

  **Elias:** Relative to the others? They aren't competing against each other in a queue. They are in two distinct predicaments.

  **Sarah:** Imagine we put six tickets in a hat. One for the single swimmer, five for the group. We draw one. If the single swimmer's ticket comes up, we save them. If any of the five come up, we save the group. Now the single swimmer has a one-in-six chance. The group has a five-in-six chance. This respects the separateness of persons better than your coin flip. Your coin flip treats the five as a blob. My lottery treats them as five distinct moral patients.

  **Elias:** I see the maneuver. It's the Parfit move from "Innumerate Ethics." You think this avoids the aggregation objection because you're just counting individuals. But look at the outcome. In your lottery, the single swimmer is left to drown 83% of the time. In my coin flip, they drown 50% of the time. By adopting your "per-person" lottery, you have already conceded that numbers count. You've just disguised the aggregation as a procedural fairness issue.

  **Sarah:** I haven't conceded that the *loss* aggregates. I've conceded that the *probability of rescue* should distribute equally among individuals. Think about it from the contractualist angle. Could the single swimmer reasonably reject my lottery? They'd say, "Hey, give me a 50% chance!" But the five could reasonably reject your coin flip. They'd say, "Why does our collective interest count for no more than his? We are five distinct people, each with a claim equal to his." Whose rejection is more reasonable?

  **Elias:** The single swimmer's rejection is perfectly reasonable. They are being asked to accept a 1/6 chance of survival when a 1/2 chance was available, for no reason other than that there are more people on the other side. You say you aren't aggregating loss, but you are aggregating *voting power*. You're saying that because there are five of them, their preference for survival outweighs his. But they don't have a collective preference. They have five separate preferences.

  **Sarah:** But if you don't aggregate the preferences, or the claims, or the tickets—call it what you like—you aren't treating the five as five. You're treating them as one big person. Taurek says we shouldn't sacrifice the one for the many. I agree. But a weighted lottery isn't a sacrifice. It's a fair distribution of risk. If we run this scenario a hundred times, your coin flip saves roughly 50 people on the left and 50 on the right. My lottery saves roughly 83 on the left and 17 on the right. My procedure saves more lives without ever saying one life is worth more than another.

  **Elias:** It saves more lives *in the aggregate*. That's the utilitarian conclusion you're trying to dress up in contractualist clothing. The crux is this: Does moving from the coin flip to the ticket lottery admit that the number of people is a morally relevant factor in deciding the *outcome*?

  **Sarah:** It admits that the number of people is a morally relevant factor in deciding the *procedure*.

  **Elias:** And if the procedure dictates the outcome 83% of the time, what's the difference? If I accept your lottery, I am accepting that the presence of the second, third, fourth, and fifth person adds moral weight to the decision. Taurek's point was that the second person's presence doesn't make the first person's loss any worse.

  **Sarah:** It doesn't make the loss worse. It makes the *reason to act* stronger. I have a reason to save Person A. I have a reason to save Person B. If I can save both, I do. If I can save A or B, I flip. If I can save A, or B-through-E, I have five reasons to save the group and one reason to save the individual. The reasons don't merge into a super-reason. They just stack.

  **Elias:** "Stack." There it is. You're stacking reasons. Taurek would say you can't stack reasons that belong to different people. Reasons are indexed to individuals. I have a reason to save the one. I have a reason to save the five. These are two competing reasons. Why does the reason attached to five people override the reason attached to one?

  **Sarah:** It doesn't override it. It outscores it. Think of it like this: If you refuse the lottery and stick to the coin flip, you are effectively giving the single swimmer a "veto" over the five. He gets a 50% chance, which means he gets to cancel out the claims of five other people. Is one person's claim really strong enough to neutralize five identical claims?

  **Elias:** Yes, if the claim is a right to equal concern. Equal concern doesn't mean "maximize the satisfaction of claims." It means "don't discount my claim because I am outnumbered." Your lottery discounts the single swimmer's claim by a factor of five. You say you're just counting tickets, but the ticket *is* the claim. By making his ticket less likely to be drawn, you are saying his claim counts for less.

  **Sarah:** No, his ticket has the exact same weight as every other ticket. That's the beauty of the lottery. In your coin flip, the five people on the left effectively share one ticket. They have to split the 50% probability among them. So each of them gets a 10% chance of being saved. The single swimmer gets 50%. That is the real inequality. You're privileging the one person simply because they are alone.

  **Elias:** I'm not privileging them. I'm acknowledging that the decision is between two *acts*, not six *lives*. I am the agent. I have two options. Option A: Save One. Option B: Save Five. If I cannot compare the value of the outcomes because value is individual, then I must treat the options as equal.

  **Sarah:** But the options aren't abstract. They are constituted by the people. You can't separate the act from the recipients. If you say "I must treat the options as equal," you are implicitly saying "The group of five is a single recipient." You're the one reifying the group, Elias. I'm just counting the recipients.

  **Elias:** I'm not reifying the group. I'm acknowledging the structure of the choice. I can't throw the preserver to "five people." I throw it to a location. If I throw to the left, five live. If I throw to the right, one lives. The question is: do I have a duty to throw left? Taurek says no. You say yes. If I adopt your lottery, I am saying I have a duty to throw left 83% of the time. That duty must be grounded in something. If it's not grounded in the greater good, what is it grounded in?

  **Sarah:** It's grounded in the impossibility of justifying to the five why they should accept a 50% risk when they could have had an 83% risk. Justification is the key. Can you justify to the five, who are drowning, that you gave them the same chance as the one? You'd say, "I wanted to respect the one." They'd say, "You respected the one at our expense. Five times over."

  **Elias:** And can you justify to the one, who is drowning, that you gave them a 1/6 chance? "I wanted to respect the five." They'd say, "You sacrificed me because I was outnumbered. My life was diluted by their existence."

  **Sarah:** No. "Your life was weighed equally with theirs. But there were more of them."

  **Elias:** "Weighed equally" is doing too much work. If I put a pound of gold on one side of a scale, and five pounds of lead on the other, and I say "I weighed them equally," I'm speaking nonsense. If the numbers count in the lottery, they count. If they count, then Taurek is wrong. You can't have it both ways. You can't say "numbers don't create a greater loss" but then use the numbers to determine the probability of rescue.

  **Sarah:** I can if the numbers determine the *distribution of chances*, not the *value of the lives*. The value of the life is constant. The distribution of chances is proportional to the number of claimants. It's compatible.

  **Elias:** It feels like a distinction without a difference. If I act on the lottery, I am acting *as if* the five deaths are worse than the one. That's the functional definition of "numbers count."

  **Sarah:** You act *as if* saving five is more important, yes. But your *reason* isn't that the loss is greater. Your reason is that you are respecting five individual claims rather than one. The action is the same as the utilitarian's. The justification is different.

  **Elias:** But if the justification leads to the same action, and relies on counting the people to weight the probability, have you really escaped aggregation? Or have you just moved the aggregation from the *outcome* (total utility) to the *input* (total tickets)?

  **Sarah:** Maybe aggregation is unavoidable if you want to treat people equally. Taurek wanted to avoid aggregation to protect the individual. But his method protects the individual by ignoring the others. My method protects the individuals by counting them all.

  **Elias:** And if the single swimmer knows your method? If they know that their chance of survival drops inversely proportional to the number of people on the other side? They know they are morally less significant in a crowd.

  **Sarah:** They know they are one voice in a larger chorus. That's not being less significant. That's being part of a world where other people exist.

  **Elias:** (Pauses, watching the water) So you're saying the coin flip is selfish? It privileges the perspective of the agent who sees two options, rather than the patients who see six lives?

  **Sarah:** I'm saying the coin flip privileges the solitude of the one over the plurality of the five. And in doing so, it fails to see the five as five.

  **Elias:** And the lottery sees the one as just a fraction.

  **Sarah:** It sees the one as one-sixth of the total claimants. Which is exactly what they are.

  **Elias:** Then we aren't disagreeing about the math. We're disagreeing about whether morality is about the options available to the agent, or the claims asserted by the patients.

  **Sarah:** I think those are the same thing, viewed from different ends.

  **Elias:** If they were the same, Taurek wouldn't have written the paper.

  **Sarah:** And Parfit wouldn't have answered it.

  *(They stand in silence for a moment, the tension of the hypothetical hanging over the calm water.)*

  **Elias:** If I agree to the lottery... do I still get to say the loss isn't greater?

  **Sarah:** You can say the loss isn't greater for any *one* person. But you have to admit the moral pressure is greater.

  **Elias:** Moral pressure from where? There is no one to press.

  **Sarah:** From the logic of equality itself.

  **Elias:** Then perhaps equality is more demanding than Taurek thought.

  **Sarah:** Or perhaps he was right that it's impossible, and we just have to live with the contradiction.

  **Elias:** I'll flip the coin. But I'll let you draw the tickets.

  **Sarah:** And I'll let you hold the preserver.

  *(Elias reaches into his pocket. Sarah watches his hand. Neither moves yet.)*
