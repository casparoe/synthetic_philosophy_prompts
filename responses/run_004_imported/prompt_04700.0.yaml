prompt: |-
  Okay so this is a weird combo of two different classes but hear me out. In AP Psych we watched part of an old interview with Daniel Dennett about consciousness, and my teacher brought up this view called "illusionism" (I think Keith Frankish is actually the guy who coined that name for it) where the basic idea is that phenomenal consciousness — like the raw "what it's like" feeling part of experience, not just the information processing — isn't actually real. Its just your brain representing itself as having these special qualia properties that it doesn't actually have. Kind of trippy but ok, I got that part.

  Then later that same week in my Ethics elective we were debating factory farming, and it hit me that illusionism should actually matter a ton for that whole debate. Like, the standard argument against factory farming is "animals suffer, suffering is bad, so we shouldn't cause a bunch of it for cheap bacon." But if illusionism is true and the raw felt quality of pain isn't real, isnt an animal's suffering also just an illusion its brain represents to itself, with no actual bad feeling behind it? So wouldnt that mean the suffering-based case against factory farming doesnt really work anymore, since theres no "real" suffering in the phenomenal sense, just some processing that represents itself as bad?

  I brought this up with my friend who's vegetarian and she got kind of annoyed and said I was misunderstanding what illusionism actually claims, but she couldnt explain why in a way that made sense. So could you actually walk through whether illusionism really does let you off the hook morally like that, or if im missing something about the theory? Like if pain isnt phenomenally real in the way we normally assume, what's supposed to be left that still counts as bad or worth caring about?
