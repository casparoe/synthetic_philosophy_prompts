answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late evening. Two empty coffee cups sit between **Elena** (a defender of unified truth-conditional semantics, Stalnaker-adjacent) and **David** (a proponent of the suppositional theory, Adams/Edgington-adjacent). They've just finished co-teaching a graduate seminar on conditionals.*

  **Elena:** You were hard on the Stalnakerian account today. I thought the students bought the "context set" explanation for the Oswald pair.

  **David:** The students buy a lot of things. But you know as well as I do that "If Oswald didn't kill Kennedy, someone else did" and "If Oswald hadn't killed Kennedy, someone else would have" aren't just contextually different. They're different beasts entirely. The first is about our epistemic state regarding the past; the second is about the causal structure of history. You can't smooth that over with a single selection function.

  **Elena:** Why not? Stalnaker's machinery is flexible. For the indicative, we restrict the domain of quantification to the context set—the worlds compatible with what we know. Since we know Kennedy was killed, every world in the context set is one where he died. So in the closest world where Oswald didn't do it, someone else did. For the subjunctive, we expand the context set to include metaphysically possible worlds where the known facts might have been otherwise. In those worlds, maybe no one else was there. Same semantics, different domain constraints.

  **David:** It looks like the same semantics, but only because you're smuggling the difference into the "constraints." When I say the indicative has no truth conditions, I mean it literally. Asserting "If A, then B" isn't stating a fact about the world; it's a conditional assertion. I'm inviting you to suppose A and observe your credence in B. That's why Adams's Thesis holds: the acceptability of the indicative *is* the conditional probability $P(B|A)$.

  **Elena:** And that's where Lewis's triviality results hit you like a truck. If the indicative expresses a proposition, and its probability equals the conditional probability, you end up proving that there are only trivial probability spaces. You can't have rich beliefs about conditionals if they're truth-conditional propositions obeying the Equation.

  **David:** Exactly. Lewis did us a favor. He showed that the search for truth conditions for indicatives is a wild goose chase. The Equation works *because* there's no proposition there to have a probability. It's a constraint on rational belief, not a description of truth conditions.

  **Elena:** But Lewis's result assumes the probability function is fixed. It assumes that when we evaluate the probability of the conditional, we aren't shifting the context. If probability is context-sensitive—if $P$ shifts when we consider the conditional—triviality dissolves. I can keep my truth conditions if I allow that the *probability* of those truth conditions is evaluated relative to a supposition.

  **David:** That feels like saving the patient by declaring him dead and then redefining "alive." If your "truth conditions" are so ephemeral that they shift with every supposition to avoid triviality, in what sense are they truth conditions? They start to look suspiciously like my assertibility conditions. You're just putting a "True/False" label on a cognitive process that doesn't need one.

  **Elena:** It needs one for embedding. That's the cost I'm unwilling to pay, and you are. If conditionals don't have truth values, how do you handle negation? "It is not the case that if it rains, the match will be cancelled." If "if rains, cancelled" isn't a proposition, what are you negating?

  **David:** I grant you, embedding is the headache on my side. But we handle it by looking at usage. Negating a conditional usually isn't denying a proposition; it's refusing the supposition. As for Gibbard's "Sly Pete" case... look, sometimes logic just doesn't apply cleanly to natural language indicatives.

  **Elena:** "Sometimes"? McGee's counterexample to Modus Ponens suggests *often*.

  **David:** Right. McGee. "If a Republican wins, then if it's not Reagan, it's Anderson." "A Republican wins." Therefore, "If it's not Reagan, it's Anderson." In 1980, the premises were acceptable, the conclusion was not. Modus Ponens fails for indicatives. My theory predicts this perfectly. Conditional credences don't distribute over logical connectives the way truth values do.

  **Elena:** And I say abandoning Modus Ponens is too high a price. It's the engine of deduction. If you break MP, you break the link between logic and inference. My camp handles McGee by arguing that the first premise is actually a quantified statement over worlds, not a nested conditional, or by invoking Kratzer's restrictor theory. "If" isn't a binary connective; it's a modal restrictor. That saves MP and keeps truth conditions.

  **David:** Kratzer helps, sure. But does it capture the *feeling* of the McGee case? The intuition isn't that we misparsed the syntax; it's that the inference is probabilistically unsound. You're preserving classical logic at the expense of explaining why rational agents reject the conclusion.

  **Elena:** I'm preserving the idea that logic is normative for thought. If your theory says a valid inference form leads rational agents astray, maybe your theory of rationality is too narrow. Or maybe... look, let's step back. You say indicatives express conditional credence. I say they express propositions whose probability *matches* conditional credence in standard contexts.

  **David:** But *why* do they match?

  **Elena:** Because the truth conditions are defined by the selection function, and rational agents set their credences to match the semantics.

  **David:** Or, the "semantics" is just a projection of the credences. Here's where I worry we're talking past each other. You want a "proposition" so you can embed it. I want a "supposition" so I can calculate credence. But when you dig into your "selection function," what determines which world is closest?

  **Elena:** Similarity metrics. Contextual salience.

  **David:** Which is determined by... what we find reasonable to suppose. What we assign high credence to. Elena, your "closest possible world" is often just a placeholder for "the world I assign highest probability to given the antecedent."

  **Elena:** *Pauses, swirling her coffee.* I'll concede that the *epistemic* indicative relies heavily on epistemic similarity. But the subjunctive doesn't. "If I had dropped this cup, it would have shattered." That's not about my credence; it's about physical laws.

  **David:** Agreed. Subjunctives are different. I'm happy to give you possible worlds for counterfactuals. My fight is solely over the indicative. And even there... if your truth conditions for indicatives are just "the worlds consistent with our shared knowledge," then the truth of the conditional is just a fact about our knowledge state.

  **Elena:** Which is a fact about the world. Facts about knowledge are still facts.

  **David:** But they aren't the facts the conditional *seems* to be about. "If Oswald didn't kill Kennedy, someone else did" feels like a claim about history, not a claim about our ignorance.

  **Elena:** It *is* a claim about history, evaluated relative to our information. Look, maybe the disagreement is this: You think the lack of a truth value is the *explanation* for why we use conditionals the way we do. I think the lack of a clear truth value in some edge cases is a *symptom* of context dependence, not an absence of truth conditions.

  **David:** And I think your "context dependence" is doing so much work that it's carrying the whole load. If the truth conditions shift so much that they align perfectly with assertibility conditions, have you actually posited anything other than assertibility?

  **Elena:** I've posited a structure that allows for disagreement. If I say "If A, B" and you say "No, if A, not B," we are contradicting each other. On your view, I'm expressing a high credence, and you're expressing a low credence. We aren't contradicting; we're just reporting different internal states. But it *feels* like a contradiction. We act like one of us is wrong.

  **David:** We act like one of us is *mistaken*, yes. But mistaken about what? About the evidence. About the probability. Not about a "conditional fact" floating out there in the universe. I can explain the feeling of contradiction through the clash of credences. If you have high $P(B|A)$ and I have low $P(B|A)$, we can't both be rational given the same evidence. That's conflict enough without needing a truth value.

  **Elena:** But it doesn't explain the behavior under negation or in disjunctions as well as a proposition does. "Either if A, B, or if C, D." That's a mess for the suppositional theory.

  **David:** It is a mess. I won't lie. Natural language is messy. But your unified theory creates a different mess: it forces you to say that in McGee cases, rational people are violating logic. I'd rather handle the embedding mess than break Modus Ponens.

  **Elena:** *Sighs.* I suppose that's the stalemate. You prioritize the probabilistic intuitions (The Equation, McGee); I prioritize the logical intuitions (Embedding, MP).

  **David:** Though... if I'm honest, I do miss having a clean account of negation. It's the hole in the suppositional boat.

  **Elena:** And if I'm honest, the triviality results keep me up at night. I have to keep adding epicycles to my context-shift theory to keep Lewis at bay.

  **David:** So, where does that leave us? Are we describing the same thing? You're modeling the "logic" of the game; I'm modeling the "play."

  **Elena:** Maybe. Or maybe we're agreeing that the indicative conditional is a hybrid. It has a foot in the world of facts (truth conditions) and a foot in the world of belief (probability). The question is which foot is bearing the weight.

  **David:** I'd say the belief foot. You can't have truth without a truth value, and indicatives resist truth values in the wild. But... I'll concede this: if you can formalize your "context-sensitive truth conditions" such that they mathematically mirror the probability calculus, the practical difference vanishes.

  **Elena:** And I'll concede that if my truth conditions are nothing more than a reification of rational credence constraints, then I haven't gained much metaphysical ground over you. I've just dressed your psychology in logic's clothing.

  **David:** *Smiles.* So, Stalnaker in the street, Adams in the sheets?

  **Elena:** *Laughs.* Don't put that in the paper. But... close enough. We both agree the Oswald pair matters. We both agree logic and probability have to handshake somewhere. Whether that handshake is a semantic identity or a pragmatic coordination...

  **David:** ...might just be a matter of whether you prefer your ontology lean or your logic classical.

  **Elena:** Cheers to that.

  **David:** Cheers.
