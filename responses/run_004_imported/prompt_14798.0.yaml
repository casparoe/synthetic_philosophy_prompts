answer: |-
  Here are seven interview questions designed for your audience, calibrated to bypass the standard intro and press directly on the structural weaknesses of your guest's specific defense.

  **1. The 2D Semantics vs. Kripkean Necessity**
  "You're relying on two-dimensional semantics to bridge the gap from 'conceivable' to 'metaphysically possible.' But the Kripkean physicalist argues that 'Water is H2O' is conceivable as false (on the primary intension) but metaphysically necessary (on the secondary intension). What specific feature of *phenomenal concepts* guarantees that they behave differently than natural kind terms? Why isn't 'Zombies are possible' just like 'Water is XYZ'—epistemically open but metaphysically closed?"
  *   **Follow-up:** If he claims phenomenal concepts are "direct" or "non-descriptive," press him on how reference is fixed without description. If reference is fixed by a causal-historical chain to physical brain states, doesn't that re-open the door to the reference being rigidly designating a physical state, collapsing the 2D distinction?

  **2. The Coincidence of Brute Psychophysical Laws**
  "You posit brute psychophysical laws to maintain correlation without causation. But if these laws are truly brute, they aren't derived from the nature of the physical or the mental. Doesn't this make the precise alignment between specific neural firing patterns and specific qualitative feels a cosmic coincidence every bit as miraculous as the interactionist dualism you're trying to avoid? You've removed the causal arrow, but haven't you left the 'miracle' of the correlation intact?"
  *   **Follow-up:** If he responds that "all fundamental laws are brute," ask why *this* brute law is so structurally complex. Gravity applies universally; why do psychophysical laws seem to toggle on and off based on specific, evolutionarily contingent computational architectures?

  **3. The Generalized Anti-Zombie Principle (GAZP)**
  "Eliezer Yudkowsky's Generalized Anti-Zombie Principle argues that if a world is physically identical to ours, it must produce the same arguments about consciousness for the same physical reasons. If your psychophysical laws are causally inert, then the physical facts alone caused you to write your papers defending dualism. If the truth of dualism played no causal role in your writing, on what grounds do you claim your argument is *about* the truth rather than just a physical output that happens to be consistent with it?"
  *   **Follow-up:** If he says "The laws guarantee the truth tracks the physical," ask him to identify the selection pressure. If the physics does all the work of generating the belief, what mechanism ensures the belief isn't a 'just-so' story generated by a brain that would have written the same book even if panpsychism were true?

  **4. Explanation vs. Truth**
  "You've characterized the epiphenomenalist worry as a 'puzzle about explanation, not about truth.' But in metaphysics, we rely on Inference to the Best Explanation. If physicalism explains the *production of the belief* in consciousness more parsimoniously than your view—which requires extra ontology and brute laws—why should we accept your ontology as 'true' if it is explanatorily inert regarding the very evidence we use to support it?"
  *   **Follow-up:** If he insists truth can outstrip explanation, ask for a historical precedent. Can he name a successful scientific or philosophical theory that was accepted as true despite admitting it had no explanatory power over the data used to discover it?

  **5. Evolutionary Alignment**
  "Let's look at the brute laws through an evolutionary lens. If consciousness is causally inert, evolution selects only for the physical substrate. Why, then, is the brute correlation so normatively aligned? Pain correlates with damage-avoidance behavior; pleasure with reinforcement. If the mental is just a shadow, why does the shadow perfectly track fitness values? Is this another brute fact, or is there a mechanism?"
  *   **Follow-up:** If he suggests consciousness is a 'spandrel' or byproduct, press him on the precision of the mapping. A byproduct might exist, but why does the *content* of the experience (suffering) map so neatly onto the *disvalue* of the physical state (tissue damage) if there is no causal feedback loop?

  **6. Conservation and Causal Closure**
  "Even if you deny interaction, you're positing a nomic connection between the physical and the non-physical. In a closed physical system, information and energy are conserved. If a physical state $P$ necessitates a mental state $M$ via a brute law, does the instantiation of $M$ require any 'work' from the physical system? If not, how is the law implemented without violating the causal closure of the physical domain?"
  *   **Follow-up:** If he says "It requires no work, it's just a correlation," ask him to distinguish this view from panpsychism. If the mental is everywhere the physical is, and determined by it, at what point does the distinction between 'correlated property' and 'intrinsic property of the physical' dissolve?

  **7. The Reliability of Introspection**
  "Your argument leans heavily on the intuition that consciousness *feels* non-physical. But we know from cognitive science that introspection is a constructed model, not a direct readout. The brain creates a user-illusion of a unified self. Why should we trust the 'feel' of non-physicality any more than we trust the 'feel' of the sun moving around the earth? Isn't it more likely that the brain models itself as non-physical for computational efficiency?"
  *   **Follow-up:** If he argues that the phenomenology is indubitable, ask if it is indubitable that the phenomenology represents reality accurately. Can he separate the *existence* of the experience from the *metaphysical implications* he derives from its qualitative character?
