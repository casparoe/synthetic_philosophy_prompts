          *   *Even tighter:* A proposition has a fixed truth value in every possible world (a static bit). Conditional probability is a relationship between uncertainties that shifts when you learn *anything*. If you force the static bit to track the shifting relationship across all possible learning scenarios, the only solution is for the relationship to be boring (independence).

