      *   *Test 2 (Reason/Universality):* Address the "failures." Hallucinations and brittleness are exactly what Descartes predicts for things acting from the "disposition of organs." They prove it is not a "universal instrument."
      *   *The Twist/Nuance:* Does this expose a limit in Descartes? Maybe. If the LLM becomes indistinguishable, does the distinction matter? But strictly following Descartes: No, the ontological status (material vs. immaterial) matters more than the behavioral output.
