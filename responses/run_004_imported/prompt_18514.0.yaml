answer: |-
  First off: trust that feeling of "pushing on a door that wasn't actually there." That sensation is not a bug in your execution; it is the feature of the text.

  Your CFAR alum friend has made a category mistake that is incredibly common among analytic rationalists reading *On Certainty*. They are treating hinge propositions as **super-cruxes** (beliefs with extremely high prior probability and high downstream dependency), when Wittgenstein is explicitly arguing that they are **not beliefs at all** in the standard epistemic sense.

  If you try to run a Double Crux protocol on a genuine Wittgensteinian hinge, you will fail, because Double Crux assumes a shared framework of evidence and logic, whereas hinges *constitute* that framework.

  Here is the breakdown of why your experiment felt unproductive, what Wittgenstein actually says hinges are doing, and how you can actually use this in a rationalist context without violating the text.

  ### 1. The Category Mistake: Crux vs. Hinge

  **The CFAR Model (Crux):**
  A crux is a belief within a system. It is a proposition that can be true or false, and for which evidence can be gathered. If I believe "Vaccines cause autism," that is a crux. I can show you data; you can update. We are playing the "Science Game," and this is a move within that game.

  **The Wittgenstein Model (Hinge):**
  A hinge is not a move in the game; it is the board the game is played on.
  *   **§341-343:** "The questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn."
  *   **§105:** "All testing, all confirmation and disconfirmation of a hypothesis takes place already within a system. And this system is not a more or less arbitrary and doubtful point of departure for all our arguments: no, it belongs to the essence of what we call an argument."

  **The Conflict:**
  When you ask, "What evidence would update me on 'the world didn't pop into existence five minutes ago'?", you are asking for evidence *within* the system to prove the *system* is valid. But any evidence you produce (a diary entry, a photograph, a memory) is only valid *if* the world existed five minutes ago.
  To doubt the hinge is not to be skeptical; it is to lose the ability to mean anything by "evidence." As Wittgenstein says in **§115**: "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty."

  Your feeling of "pushing on a door that wasn't there" is the experience of trying to apply empirical pressure to a grammatical rule.

  ### 2. Why "Crucial Experiments" Don't Work on Hinges

  In Double Crux, a crucial experiment is an observation $O$ such that $P(O|A) \neq P(O|B)$.
  For a hinge $H$, there is no $O$ where $P(O|H)$ makes sense, because $H$ determines what counts as an $O$.

  *   **Hinge:** "My memory is roughly reliable."
  *   **Attempted Experiment:** "I will check my memory against a written record."
  *   **Wittgenstein's Objection:** You are trusting your memory to read the record, and trusting your memory to recall that you wrote the record. You are using the hinge to test the hinge.

  If you try to treat hinges as empirical beliefs, you end up in infinite regress or solipsism. Wittgenstein's point is that we don't hold hinges because they are *justified*; we hold them because they are **animal**. They are part of our "form of life" (**§358**).

  ### 3. So, Is the CFAR Alum Wrong?

  Not entirely. They are right that hinges are **load-bearing**. If a hinge shifts, the whole worldview collapses. But they are wrong about the *mechanism of change*.

  You don't change a hinge via **evidence**; you change a hinge via **conversion** (in the Kuhnian sense) or **pragmatic failure**.

  *   **Evidence:** "Here is data that contradicts your belief." (Works for Cruxes)
  *   **Conversion:** "The entire framework you are using no longer allows you to navigate the world successfully; you need to adopt a new framework." (Works for Hinges)

  ### 4. A Revised Protocol: Identification, Not Interrogation

  If you want to use *On Certainty* for epistemic hygiene, do not try to *falsify* your hinges. Instead, use the following protocol:

  #### Step 1: Map the Hinges (Archaeology, not Engineering)
  Don't ask "Is this true?" Ask "What am I treating as exempt from doubt right now?"
  High-value hinges to identify are rarely metaphysical (like the 5-minute hypothesis). They are usually pragmatic/social.
  *   *Examples:* "Institutions generally tell the truth," "My interlocutor is using words with stable meanings," "The future will resemble the past," "I am the same person I was yesterday."

  #### Step 2: Check for Framework Incompatibility
  When you have a disagreement that Double Crux isn't resolving, check if you are clashing on a hinge.
  *   **Crux Disagreement:** We agree on how to verify things, we disagree on the data.
  *   **Hinge Disagreement:** We disagree on what counts as verification.
  *   *Action:* If it's a hinge disagreement, stop trying to exchange evidence. Acknowledge that you are operating in different language games. You cannot "win" this via rationality; you can only negotiate a shared framework or agree to disengage.

  #### Step 3: The "Pragmatic Stress Test" (The Real Crucial Experiment)
  You asked what a crucial experiment for a hinge looks like. It isn't an observation; it's a **functional test**.
  *   **The Test:** "If I provisionally suspend this hinge, does my agency collapse?"
  *   **Example:** Try to act as if "Other minds exist" is false. Can you maintain relationships? Can you navigate society?
  *   **The Update:** You don't update the probability of the hinge. You update your understanding of your own **commitments**. You realize, "I am not betting on this; I am *standing* on this."

  ### 5. Which Hinges Are High-Value to Interrogate?

  Do not waste time on "I have two hands." That is a "Moorean Proposition." Doubting it is philosophically idle (**§4**).

  Focus on **Contingent Hinges**. Wittgenstein acknowledges that hinges can change over time (**§96-99**, the "riverbed" metaphor). The hard rock of the riverbed can become sand, and the sand can become rock.

  **High-Value Targets:**
  1.  **Epistemic Authority:** "Experts in field X are generally reliable." (This shifts over decades).
  2.  **Social Reality:** "Money has value," "This government is legitimate." (These are hinges that can and do break).
  3.  **Personal Identity:** "I am the kind of person who keeps promises." (A hinge of character).

  **How to "Update" These:**
  You don't find a crucial experiment. You look for **friction**.
  *   *Friction:* "I keep assuming experts are reliable, but every time I check, they are wrong about my specific context."
  *   *Shift:* The hinge "Experts are reliable" stops being a hinge and becomes an empirical hypothesis. You move it from the riverbed to the water.
  *   *Hygiene:* The goal isn't to prove the hinge false. The goal is to notice when a hinge is no longer serving your form of life and consciously demote it to a regular belief so it can be examined.

  ### Summary for Your Reading Group

  Tell your group this:
  The CFAR pitch is a useful **metaphor**, but a dangerous **methodology**.
  *   **Cruxes** are beliefs you hold. You test them with evidence.
  *   **Hinges** are rules you follow. You test them with *living*.

  If you try to Double Crux a hinge, you are trying to use a ruler to measure its own length. The "unproductive" feeling you had was the sound of your brain realizing that you were asking a grammatical question as if it were a scientific one.

  **The Rationalist Takeaway:**
  Use *On Certainty* to detect **intractable disagreements**. If you find yourself pushing on a door that isn't there, stop. You aren't fighting a belief; you're fighting a framework. Acknowledge the hinge, check if it's still serving your "form of life," and if not, don't look for evidence to disprove it—look for a new practice that makes the old hinge obsolete.

  **Relevant Citations for the Group:**
  *   **§341-343:** The hinge metaphor itself.
  *   **§105:** The system of testing presupposes certainty.
  *   **§115:** Doubt presupposes certainty.
  *   **§96-99:** The riverbed metaphor (hinges can shift, but slowly).
  *   **§370:** "I know" is a grammatical remark, not a psychological state.
