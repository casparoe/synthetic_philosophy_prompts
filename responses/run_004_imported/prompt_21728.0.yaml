      *   **The "Good News" (Reframing Agency):** Explain that Role Ethics doesn't mean slavery to roles. It means agency *through* roles.
      *   **Key Concept 1: Remonstrance (*Jian*).** Cite *Analects* 4.18 and 13.15. Explain that obedience isn't the highest virtue; *righteousness* (*Yi*) is. If the parents are wrong, the child has a moral obligation to speak up, but gently.
      *   **Key Concept 2: Redefining "Good Child" (*Xiao*).** *Xiao* isn't obedience; it's ensuring the parents' legacy and the family's continuity flourish. A miserable doctor hurts the family more than a happy artist who supports them.
