prompt: |-
  For like a decade I've told myself I'll actually relax and enjoy life once I hit the next milestone at work — first it was getting promoted, then making manager, now director. Every time I get there the satisfaction lasts about a week before I'm already fixated on the next rung. Even my hobbies have started feeling like this: I used to just mess around on guitar for fun, now I only pick it up if I'm "making progress" on something. My partner thinks I just havent found a big enough goal yet, but that doesn't sit right with me and I can't say why — what's actually going on, and is my partner's fix even possible?
