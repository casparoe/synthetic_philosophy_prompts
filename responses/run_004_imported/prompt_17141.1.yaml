answer: |-
  **Title:** The Web of Value: Quinean Naturalism and the Case for Moral Realism

  **Introduction**

  W.V.O. Quine's philosophical legacy is defined by a relentless naturalism that seeks to dissolve traditional dualisms: the analytic and the synthetic, the conceptual and the empirical, the mental and the physical. Yet, when turning to ethics, Quine halted this dissolvent impulse. In "On the Nature of Moral Values" (1981), he maintains a skepticism regarding the cognitive standing of moral judgments, arguing that while the fact/value distinction is a matter of degree, moral claims ultimately fail to answer to the "tribunal of sensory experience" in the way physical theory does. This reticence sparked a pivotal debate in metaethics. Gilbert Harman, leveraging Quinean parsimony, argued that moral facts are explanatorily inert and thus ontologically suspect. Conversely, Cornell Realists like Nicholas Sturgeon and Richard Boyd argued that moral properties possess genuine explanatory power and are vindicated by the very holistic epistemology Quine championed.

  The question for the Quinean successor is whether Quine's ethical skepticism is a necessary consequence of his naturalism or an inconsistent residue of the empiricism he sought to overthrow. This essay argues the latter. While Quine's skepticism aligns with a restrictive, observation-centric empiricism, it stands in tension with his own holistic naturalism. A fully consistent Quinean naturalist must side with Sturgeon and Boyd: if ontological commitment is determined by indispensability to our best explanatory web of belief, and if moral properties play an indispensable explanatory role within that web, then naturalism demands moral realism. Quine's refusal to grant ethics cognitive standing relies on a privileged status for physics that his own naturalism forbids.

  **Quine's Naturalism and the Ethical Exception**

  To understand the tension, one must first articulate Quine's naturalistic criteria for ontological commitment. For Quine, to be is to be the value of a bound variable in our best scientific theory. Epistemology is naturalized; it is a chapter of psychology describing how sensory stimuli lead to theory construction. The ultimate check on any theory is its ability to predict and accommodate sensory experience. In "On the Nature of Moral Values," Quine concedes that the fact/value split is not a metaphysical chasm but a pragmatic gradient. Moral statements are woven into the web of belief alongside descriptive ones. However, he draws a line at the periphery of the web. He argues that while physical theories are constrained by their ability to predict sensory stimuli, moral values are primarily concerned with the "cultivation of tastes" and social cohesion. They do not, in his view, track mind-independent properties that cause sensory observations.

  Quine's skepticism rests on a specific interpretation of the "tribunal of sensory experience." For a statement to be cognitively meaningful in a realist sense, there must be a causal chain running from the object of the statement to the observer's sensory receptors. Electrons, though unobservable, are posited because they explain observable tracks in cloud chambers. Quine sees no analogous causal role for moral properties. We observe a boy burning a cat, but Quine would argue we do not observe the *wrongness*; we observe the physical act and project the moral sentiment. Thus, for Quine, ethics remains a matter of social engineering rather than truth-apt description.

  **The Cornell Challenge: Explanatory Indispensability**

  Gilbert Harman sharpened Quine's skepticism into a specific argument from explanatory impotence. In *The Nature of Morality* (1977), Harman contends that we never need to posit moral facts to explain our moral observations. If a scientist sees a vapor trail, the existence of a proton helps explain the observation. If a person sees a group of thugs burning a cat and thinks "that is wrong," the explanation for that thought requires only psychology and sociology, not the actual existence of "wrongness." Harman concludes that a parsimonious naturalist should excise moral facts from their ontology.

  Nicholas Sturgeon and Richard Boyd countered this by attacking the premise of explanatory impotence. Sturgeon argued that moral facts often provide the *best* explanation for our non-moral observations. If we ask why Hitler lost the support of the German people, or why the abolitionist movement gained traction, citing the moral depravity of the Nazi regime or the moral injustice of slavery is not merely expressive; it is explanatory. The moral properties supervene on natural properties and exert causal influence through human psychology and social dynamics.

  Crucially, Sturgeon and Boyd weaponized Quine's own holism against his skepticism. Quine's Duhemian holism dictates that sentences face the tribunal of experience not individually, but as a corporate body. Theoretical entities in physics are accepted not because they are directly observed, but because positing them makes the web of belief more coherent and predictive. Sturgeon argues that moral properties function identically. They are theoretical posits that help organize our experience of the social world. If naturalism means trusting our best scientific methods, and our best social-scientific methods utilize moral explanations, then naturalism requires moral realism.

  **Evaluating the Tension: Parsimony vs. Holism**

  The core of the dispute lies in how one interprets the Quinean constraint of "answerability to experience." Quine's skepticism is earned only if one maintains a reductionist view of observation that privileges physics over other sciences. If one insists that for a property to be real, it must be reducible to physical terms or directly causally efficacious on sensory nerves, then Quine is right. On this view, moral properties are "queer" because they do not appear in the fundamental equations of physics.

  However, this view contradicts Quine's anti-reductionism. Quine famously rejected the idea that each statement can be verified in isolation. He acknowledged that even physical objects are "irreducible posits." The consistency of Quinean naturalism depends on whether the "web of belief" includes social and psychological inquiry as legitimate science. If psychology and sociology are natural sciences (as Quine's naturalized epistemology suggests), then the entities they indispensably posit are natural entities.

  Here lies the tension in Quine's position. He grants electrons ontological standing because they knit together physical observations, yet he denies moral properties standing even when they knit together social and psychological observations. This suggests Quine is applying a double standard: he treats physics as the "measure of what exists" rather than treating science as a continuous, holistic inquiry. As Boyd argues, this is a relic of logical empiricism. Quine dismantled the analytic/synthetic distinction to show that no statement is immune to revision, yet he treats the deliverances of fundamental physics as immune to the inclusion of moral ontology.

  A consistent naturalist cannot privilege physics as a "first philosophy." If naturalism is the view that there is no standpoint outside of science from which to judge science, then we must look at how our best total theory of the world operates. Our total theory includes history, sociology, and psychology. In these disciplines, moral explanations are often indispensable. To exclude them requires an *a priori* restriction on what counts as an explanation, which is precisely the kind of "first philosophy" Quinean naturalism rejects.

  **The Verdict: For a Consistent Quinean Realism**

  Therefore, the verdict must be that Quine's skepticism is in tension with his naturalism, and a fully consistent Quinean should side with Sturgeon and Boyd. The argument rests on three pillars derived from Quine's own system.

  First, **Holism.** Quine's holism undermines the requirement for direct sensory traction. We do not observe electrons; we infer them because they systematize observations. If moral properties systematize observations of human behavior and social stability, they meet the Quinean criterion for theoretical posits. Quine's insistence that ethics lacks "sensory" traction assumes a narrow definition of observation that ignores the theory-laden nature of observation sentences themselves. As Quine admitted, observation sentences are socially mediated; moral training is part of that mediation.

  Second, **Indispensability.** Quine's criterion for existence is ontological commitment via indispensable quantification. If our best explanations of social phenomena require quantification over moral properties (e.g., "The *injustice* of the law caused the riot"), then we are committed to those properties. Harman's claim that we can always explain away moral observations with purely psychological facts is an empirical claim that seems increasingly untenable in light of modern social science, which treats normative expectations as causal forces.

  Third, **Continuity.** Quinean naturalism insists on the continuity of philosophy and science. By relegating ethics to "cultivating tastes," Quine creates a discontinuity. He treats ethics as a non-cognitive activity while treating physics as a cognitive one, despite both being human practices aimed at navigating the world. A thoroughgoing naturalism views ethics as a human technology for social coordination. If that technology tracks real features of the social environment (e.g., flourishing, harm, cooperation), then it is descriptive in the same pragmatic sense that physics is descriptive.

  Quine's hesitation likely stemmed from a fear that admitting moral facts would reopen the door to the analytic/synthetic confusion or Platonic mysticism. However, Cornell Realism avoids this by grounding moral properties in natural properties (naturalism) and validating them through empirical explanation (science). Quine's skepticism, therefore, is not a product of his naturalism, but a failure to apply his naturalism radically enough. He retained a residual empiricist dogma—that only the causal impact on the retina counts as reality—which his own holism had rendered obsolete.

  **Conclusion**

  Quine's "On the Nature of Moral Values" represents a conservative application of a revolutionary philosophy. While he successfully naturalized epistemology, he stopped short of naturalizing ethics, retaining a fact/value distinction that his holistic web of belief should have dissolved. The arguments of Sturgeon and Boyd demonstrate that moral properties can satisfy Quinean criteria for reality: they are natural, they are part of the causal order, and they are explanatorily indispensable. To deny them while accepting electrons is to grant physics a privileged epistemic status that Quinean naturalism explicitly denies. Thus, the path to a consistent Quinean naturalism does not lead to skepticism, but to a robust, explanatory moral realism. Quine was right to dissolve the dualisms of the past; he was wrong to stop before he reached the good.
