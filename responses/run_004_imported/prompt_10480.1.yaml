prompt: |-
  Hey, I could use your help on something outside my usual wheelhouse (I mostly work on value theory, not decision theory). I've been reading around in the rationalist/AI-safety literature on acausal threats -- the serious version of the Roko's-basilisk idea, about what agents that can predict each other's reasoning might do to extort one another -- and I keep getting stuck on the proposed fix of adopting a 'surrogate goal': an agent bolts on some new, otherwise pointless goal and precommits to treat threats against it as seriously as threats against its real values, so a rational extortionist supposedly targets the harmless goal instead. My hangup is that this feels like it only works if the threatener is somehow barred from also just threatening the real goal, or from seeing through the whole manuever as cheap talk dressed up as commitment. Can you spell out the actual load-bearing logic here -- what has to be true about the agents (common knowledge, verifiability of commitments, etc) for a surrogate goal to genuinely absorb a threat, rather than just becoming one more thing on the table?
reasoning: |-
  Here's a thinking process that leads to the explanation of surrogate goals and acausal threats:

  1.  **Deconstruct the User's Query:**
      *   **Background:** The user works in value theory, not decision theory. They are familiar with rationalist/AI safety literature but find the specific mechanics of "surrogate goals" (as a defense against acausal extortion/threats) unintuitive or suspicious.
      *   **Core Problem:** They feel the surrogate goal strategy only works if the threatener is barred from threatening the real goal or if the commitment isn't seen as cheap talk.
      *   **Request:** Spell out the *load-bearing logic*. What conditions (common knowledge, verifiability, etc.) must hold for a surrogate goal to actually absorb a threat rather than just adding another target?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Concept:* "Surrogate Goal" (often associated with "Schelling fences" or "precommitment strategies" in acausal trade/threat contexts).
      *   *Context:* Acausal threats (Roko's Basilisk variant, acausal extortion).
      *   *Mechanism:* An agent $A$ adopts a goal $G_{surrogate}$ that is easier to satisfy/less costly to protect than $G_{real}$. $A$ precommits to treat threats against $G_{surrogate}$ exactly like threats against $G_{real}$.
      *   *User's Skepticism:* "Why wouldn't the threatener just threaten $G_{real}$ anyway? Or call the bluff?"
      *   *Key Insight:* The user is right to be skeptical. The standard "surrogate goal" argument *does* rely on specific decision-theoretic assumptions (like Updateless Decision Theory - UDT, or Functional Decision Theory - FDT) and specific structural constraints on the threat space. It's not a magic bullet in CDT (Causal Decision Theory).

  3.  **Identify the Core Logic (The "Load-Bearing" Parts):**
      *   **Decision Theory:** The agents must be using a decision theory that respects precommitments (FDT/UDT), not CDT. If the threatener thinks $A$ will cave when the gun is to their head (real values), the surrogate doesn't matter.
      *   **Cost Asymmetry:** The surrogate goal must be *cheaper* for the threatener to satisfy (or less costly for the victim to lose) while providing the *same* leverage. Wait, actually, the logic is usually: The victim cares equally about both (due to precommitment), but the *threatener* prefers to target the surrogate because it's cheaper/easier for *them* to manipulate, OR the victim can make the surrogate "safer" to lose.
      *   *Correction/Refinement:* The standard argument (often attributed to Paul Christiano or discussed in MIRI/lesswrong circles) is about *redirecting* the threat.
      *   *Mechanism:*
          1.  Victim ($V$) precommits: "I value $G_{real}$ and $G_{surrogate}$ equally."
          2.  Threatener ($T$) wants to extract value from $V$.
          3.  $T$ simulates $V$ to see what works.
          4.  If $V$'s precommitment is credible, $T$ sees that threatening $G_{real}$ yields the same response as threatening $G_{surrogate}$.
          5.  Why does $T$ switch to $G_{surrogate}$? Because $G_{surrogate}$ is chosen such that *if* the threat is carried out, the damage to $V$'s *actual* welfare is lower, OR the cost to $T$ to carry out the threat is lower (making the threat more credible).
          6.  *Actually, the most common version:* The surrogate goal is something $V$ doesn't actually care about *intrinsically*, but cares about *instrumentally* because of the precommitment. The key is that $T$ is indifferent between hurting $G_{real}$ or $G_{surrogate}$ *except* for the cost of carrying out the threat.
          7.  *Wait, the user's specific hangup:* "What stops $T$ from threatening $G_{real}$?"
          8.  *Answer:* Nothing stops them *physically*. The logic relies on $T$ being a rational optimizer who chooses the *most efficient* path to extraction. If $V$ has successfully made the utility functions identical *from T's perspective*, $T$ will choose the path of least resistance.
          9.  *Crucial Condition:* $V$ must be able to make $G_{surrogate}$ *easier* for $T$ to threaten than $G_{real}$. (e.g., $G_{real}$ is "human happiness" (hard to measure/verify), $G_{surrogate}$ is "this specific cryptographic hash" (easy to verify)).

  4.  **Drafting the Explanation - Section by Section:**

      *   **Acknowledge the Skepticism:** Validate the user's intuition. In standard Causal Decision Theory (CDT), this *doesn't* work. It requires FDT/UDT.
      *   **The Core Mechanism (Threat Redirection):** Explain that the goal isn't to make the threat impossible, but to make the *real* values irrelevant to the threatener's calculation.
      *   **Condition 1: Decision Theory (FDT/UDT):** Explain why CDT fails here (time inconsistency). The precommitment must be binding on the future self.
      *   **Condition 2: Indifference + Cost Minimization:** This is the big one. The threatener must be indifferent between the two targets *regarding leverage*, but prefer one regarding *execution cost*.
          *   If $V$ values $Real$ and $Surrogate$ equally (due to precommitment).
          *   $T$ gets the same compliance from threatening either.
          *   $T$ will choose the one that is cheaper/easier for $T$ to threaten.
          *   Therefore, $V$ should design $Surrogate$ to be *easier for T to threaten* than $Real$.
      *   **Condition 3: Verifiability/Transparency:** $T$ must be able to see the source code/precommitment. If $T$ thinks it's a bluff, they target $Real$.
      *   **Condition 4: The "Burning Money" aspect:** Why not just threaten both? Because threats are costly to carry out (reputation, resources). $T$ only needs to threaten enough to get compliance.
      *   **Addressing the "Cheap Talk" Objection:** How to make it credible? Source code transparency, mathematical proof of the decision algorithm, or reputation in an acausal network.

  5.  **Refining the Logic (Self-Correction/Nuance):**
      *   *Wait, is the surrogate goal "pointless"?* The user said "otherwise pointless goal." If it's truly pointless, why would $T$ care?
      *   *Correction:* $T$ cares because $V$ cares (due to precommitment). $T$ uses $V$'s utility function to model $V$'s response.
      *   *The "Absorption" Logic:* It's not that $T$ *can't* threaten $Real$. It's that $T$ *won't want to*.
      *   *Analogy:* Ransom. If I say "I value my left hand as much as my life," and a kidnapper wants money. They can threaten my life or my hand. If threatening the hand is cheaper for them (less legal heat, easier to verify), they threaten the hand. My *actual* life is safe, even though I claimed to value them equally.
