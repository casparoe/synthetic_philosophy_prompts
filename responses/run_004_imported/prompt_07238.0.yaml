answer: |-
  The control room of the telescope was cold, kept at a shivering fifteen degrees to protect the optics, but Elias felt sweat prickling under his collar. On the main monitor, the spectrum of quasar QSO-J1420 stretched across the dark like a jagged heartbeat.

  "It's the calibration," Sarah said. She wasn't looking at the screen. She was staring at her coffee cup, hands wrapped tight around the styrofoam. "The wavelength solution drifts in the red. It's always the red."

  "We checked the iodine cell," Elias said. His voice sounded too loud in the quiet room. "We checked the laser comb. The shift is in the absorption systems, Sarah. The many-multiplet method isn't lying. The spacing between the iron and magnesium lines… it's wrong."

  "Wrong implies a right," she said. "There is only what is."

  "You know what I mean. $\alpha$ is shifting. Five parts per million at redshift three. It's not constant."

  Sarah finally looked up. Her eyes were tired, but hard. She was a necessitarian through and through; she believed laws were the steel beams of reality, relations of necessitation between universals that held the mosaic of events together. For Sarah, a law didn't describe what happened; it *made* what happened happen.

  "If $\alpha$ changes," she said slowly, "then it was never a law. But if it wasn't a law, what held the atoms together yesterday? What holds them together now?"

  "Maybe the law is that $\alpha$ varies," Elias suggested.

  "No." She set the coffee down. "You don't understand. A governing relation doesn't evolve. Gravity doesn't decide to get stronger on Tuesdays. If the relation $N$ holds between charge and field, it holds. Timelessly. If your data is right, then the universe isn't governed. It's just… tumbling."

  For Sarah, the horror was ontological. If the constant drifted, the machinery of existence had jammed. The engine had lost its rhythm. It was the terror of a clockmaker finding the gears made of sand. She needed the law to be a thing that *could* break, so she could fix it, or mourn it. But a law that simply *wasn't a law* was unintelligible to her. It meant the governance was an illusion.

  Elias rubbed his face. He leaned toward the Humean view, though he rarely admitted it in department meetings. To him, laws were just the best summary of the vast mosaic of events—past, present, and future. They were the axioms that offered the best balance of simplicity and strength in describing the whole history of the universe.

  "It's worse than tumbling," Elias said quietly.

  "How?"

  "Think about the Best System," he said. "If the universe ends a billion years from now with $\alpha$ wildly different, then the simplest, strongest axiomatization of the *entire* mosaic includes a variable constant. It includes a term for drift."

  "So?"

  "So, if the best system includes a drift term, then 'constancy' isn't part of the best system. Which means $\alpha$ being constant wasn't a law. Not today. Not back at redshift three. Not ever."

  Sarah frowned. "It was a local regularity. An accident."

  "It means," Elias said, feeling the floor tilt beneath him, "that the status of the past depends on the future. We thought we had a law yesterday. But if the universe drifts tomorrow, then yesterday we didn't have a law. We just had a pattern that hadn't broken yet. The future gets a vote on what the laws were."

  Sarah shook her head. "That's semantic games. The electrons didn't care what you call it."

  "The electrons don't care, but the truth does," Elias snapped. "On your view, the law is a thing that exists. If it breaks, it breaks. Fine. I can handle a broken machine. But on my view? There's no machine. There's just the pattern. And you can't know the pattern until you see the end of the tape."

  He stood up and walked to the window. The dome was open to the Pacific sky, stars sharp and indifferent.

  "If I publish this," Elias said, "I'm not saying the constant changed. I'm saying we were wrong about what kind of universe we inhabit. We thought we were in a universe governed by conservation. But if the future mosaic is messy, then conservation was never true. We weren't discovering laws, Sarah. We were just guessing the shape of a shadow before the light source moved."

  "That's nihilism," she said.

  "It's humility," he corrected. "But it feels like vertigo. Because it means nothing holds. Not really. There's no guarantee that the simplicity we see now isn't just a local dip in complexity. We treat constants as promises. But on the Best System account, a constant is just a habit the universe hasn't kicked yet."

  Sarah stood and came to stand beside him. She looked out at the stars, not as wonders, but as data points in a fixed grid.

  "If you're right," she said, "then physics is just journalism. Reporting on events as they happen, pretending there's a narrative arc."

  "And if you're right," Elias said, "then physics is theology. Searching for a governor that isn't picking up the phone."

  They stood in the silence of the observatory, the hum of the servers the only sound. The spectrum on the screen behind them glowed, a record of photons that had traveled ten billion years to die on a CCD chip.

  Sarah shivered. "I need it to be error, Elias. Because if the law changes, then the necessitation is contingent. And if necessitation is contingent, it's not necessitation. It's just… one thing after another."

  "And I need it to be error," Elias said, "because if it's not, then I don't know what I was doing for the last ten years. I wasn't measuring constants. I was measuring accidents. And if the future decides the accident continues, then the past I measured ceases to be lawful. The future rewrites the past's nature."

  He turned back to the screen. The absorption lines sat there, immutable pixels. But their meaning was fluid.

  "If we go home," Elias said, "and come back tomorrow, and the data is the same… have we confirmed a new law? Or have we just added more weight to a summary that might still be overturned by a supernova next century?"

  "We confirm the regularity," Sarah said.

  "No," Elias said. "We confirm the event. The law is a global property. You can't confirm a global property with local data. You can only fail to falsify it. We are living in the proviso."

  Sarah wrapped her arms around herself. The cold of the room was seeping in. For her, the universe was a clock that had stopped ticking. For Elias, the universe was a story being written by a drunkard, where the genre could change from tragedy to farce on the last page, retroactively altering the meaning of the first chapter.

  "Run the calibration again," Sarah said softly.

  "Okay."

  "Check the thermal vacuum."

  "Okay."

  Elias sat down. He didn't want to check the calibration. He was terrified that the calibration was perfect. If it was perfect, then the metaphysics was broken. Either the governor was absent, or the vote wasn't in.

  He typed the command. The system whirred. They waited for the machine to tell them whether reality was stable, or whether they were just drowning in a sea of events that only looked like land because they hadn't looked down yet.

  "Let's hope it's systematic," Sarah whispered.

  "Yeah," Elias said. "Let's hope it's just the telescope."

  Because if it was the universe, then neither of them knew what ground they were standing on. One feared the laws had died; the other feared they had never been born.
