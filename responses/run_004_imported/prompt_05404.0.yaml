answer: |-
  Two Bayesians, Alice and Bob, are arguing over where to go for dinner.

  **Alice:** "I have a 90% credence that the best sushi is at *Nobu*."
  **Bob:** "Well, I have a 90% credence that it's at *Sukiyabashi*."
  **Alice:** "You should update toward me. We both want to maximize expected epistemic utility, right?"
  **Bob:** "I am! I just ran the numbers. If I adopt your 90% credence in *Nobu*, I have to evaluate that choice using my *current* probability function. And since my current function thinks you're probably wrong, the expected Brier score of adopting your belief is strictly worse than keeping my own."
  **Alice:** "Wait. I just did the same calculation. Using *my* credence function as the measure, *my* belief strictly dominates yours."
  **Bob:** "Exactly. The Strictly Proper Scoring Rule theorem guarantees that, by your own lights, you're always the smartest person in the room."
  **Alice:** "And by *your* lights, you're the smartest person in the room."
  **Bob:** "So we've used rigorous mathematics to prove that neither of us should ever listen to the other."
  **Alice:** "Not quite. We've proved that as long as we stay in our current belief states, we're both rational. The moment one of us updates, *they* become the only one who knows they were previously irrational."
  **Bob:** "So... *Nobu*?"
  **Alice:** "Sure. But just so we're clear: By my lights, this concession makes me more accurate. By yours, it makes you a coward."
  **Bob:** "Cheers to that."
