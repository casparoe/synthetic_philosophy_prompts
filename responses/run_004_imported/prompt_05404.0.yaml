      *   *Scoring Rule:* A function $S(p, outcome)$ that assigns a penalty/reward based on the reported probability $p$ and the actual outcome.
      *   *Proper:* Reporting your true belief $p$ minimizes expected penalty.
      *   *Strictly Proper:* Reporting your true belief $p$ *uniquely* minimizes expected penalty. Any other $q \neq p$ yields a worse expected score *according to your own belief $p$*.
