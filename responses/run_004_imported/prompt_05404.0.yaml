      *   **Topic:** Epistemic Utility Theory (EUT), specifically strictly proper scoring rules (like Brier score, Log score).
      *   **Core Concept:** A strictly proper scoring rule ensures that an agent's expected score is maximized *only* when they report their true credence. Therefore, by your own lights, your current credence is always the optimal one to hold.
