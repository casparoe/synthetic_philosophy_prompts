      *   **Discuss Modern Developments (Optional but helpful):** Mention that contemporary Kantians try to fix this (Korsgaard), showing the user that their intuition isn't wrong, just not *classically* Kantian.
      *   **Conclusion:** Summarize the distinction between Direct vs. Indirect duties.

