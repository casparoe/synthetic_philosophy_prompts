answer: |-
  The first thing I noticed was the rhythm.

  *Thump-thump. Thump-thump.*

  It was a wet, heavy sound, echoing in the cavity of my chest, vibrating against ribs that felt too clean, too smooth. I was lying in mud. Black, sulfurous mud that smelled of rot and ozone. The air was thick with mist, the kind that clings to the skin like a second epidermis.

  I sat up. My muscles fired in perfect sequence. Quadriceps engaged, core stabilized, spine extended. It was efficient. It was seamless.

  *Why?*

  That was the first question, before *Who?* or *Where?* It was a question of mechanics. My leg muscles contracted to lift my weight. That was the *causality*. But was it their *function*?

  I stood, water sluicing off me. I was naked. I looked down at my hands. No calluses. No scars. The cuticles were perfect. The skin was unblemished by sun or stone. I touched my face. Smooth. I ran a hand over my scalp. Hair, but no gray.

  I had memories. I knew that. I knew the capital of France. I knew the smell of cinnamon. I knew the feeling of a mother's hand, warm and rough, brushing hair from a forehead.

  But I knew, with a sudden, cold certainty, that none of those things had happened. The memories were there, installed like software on a hard drive that had never been switched on. They were data without an origin.

  I began to walk. The swamp was dense with cypress trees, their knees protruding from the water like knuckles. I needed to understand the machine I was piloting.

  I found a patch of dry ground and sat. I placed a hand over my sternum.

  *Thump-thump.*

  In the world I remembered—the false world—a heart pumps blood *in order to* oxygenate the tissues. That is its function. It was selected for that purpose over millions of years. Ancestors whose hearts pumped poorly died; their genes vanished. Ancestors whose hearts pumped well survived. The function is the history of the survival.

  But I had no ancestors. I was a statistical error. A lightning strike in a bog of complex organic compounds. A cosmic typo that wrote a man instead of a splash.

  So, when my heart beat, what was it doing?

  It was moving fluid. That was undeniable. The fluid carried oxygen. That was measurable. But was it *for* the oxygenation? Or was the oxygenation just a coincidental side effect of the movement, like the sound of a boot crunching on gravel is a side effect of walking?

  If I died here, in this swamp, my heart would stop. But it wouldn't be a *failure*. A watch that has never been wound does not fail when it doesn't tell time; it simply isn't a time-teller yet. It is just gears and glass.

  Was I just gears and glass?

  I stood up again, agitated. My breath came faster. *Inhale. Exhale.* The diaphragm contracted. The lungs expanded. Gas exchange occurred across the alveolar membranes.

  *Inhale to live?* Or *Inhale, and living persists?*

  I needed a test. A control variable.

  I wandered until I found a small clearing where a dead tree had fallen, dry as bone. I rubbed two sticks together. It was easy. My hands knew the friction coefficient, the angle, the pressure. I didn't have to learn it. The knowledge was in the tendons.

  A spark caught. A flame licked up.

  I stared at the fire. It was hot. I knew that heat damaged tissue. I knew that pain was a signal to withdraw.

  I reached out.

  This was the moment. The philosophical razor.

  If I touch this fire, and I pull my hand back, is that a *reflex*? A reflex implies a purpose: to protect the organism from harm. It implies a design history where organisms without that reflex burned and died.

  But I had no history. I had no design. I was accidental.

  I touched the flame.

  The pain was instantaneous. A white-hot spike driving up the radius and ulna. My arm jerked back. The muscles spasmed.

  I held the burned hand against my chest, breathing hard. The skin was already reddening.

  I looked at the hand. It had pulled away.

  *Why?*

  Did it pull away *to save me*? That would imply the nervous system had a goal, a teleological directive. It would mean my nerves were *for* protection.

  Or did the heat stimulate the nociceptors, which sent an electrical signal to the spinal cord, which triggered a motor response, which moved the arm? A chain of dominoes falling. No purpose. Just physics. Just chemistry.

  If it was just physics, then the pain wasn't a warning. It was just noise. The withdrawal wasn't protection. It was just motion.

  I looked at the blister forming on my thumb. It was beautiful in its complexity. White blood cells were already migrating to the site. Inflammation. Repair.

  *Are you fixing me?* I asked the cells. *Or are you just reacting?*

  If they were fixing me, they were performing a function. They were acting according to a billion-year-old mandate to preserve the genetic line.

  But I had no genetic line. I was a dead end before I began. I could not reproduce. I was a copy without an original, a shadow without an object.

  So why were the white blood cells rushing to the wound?

  Was it habit? Was the matter of my body so accustomed to being part of a living system that it continued the charade even after the premise had vanished?

  I felt a surge of nausea. Not emotional. Physical. My stomach churned.

  *Function,* I thought. *What is the function of nausea?* To expel toxins. To prevent poisoning.

  But I hadn't eaten. There were no toxins.

  So why was I nauseous?

  Was my body trying to save me from a threat that didn't exist? Or was the nausea just a glitch, a mechanical shudder with no meaning?

  If it was the latter, then nothing I felt meant anything. Hunger was not a signal to eat; it was just a hollow ache. Lust was not a drive to reproduce; it was just pressure in the groin. Fear was not a preservation instinct; it was just adrenaline flooding a system with nowhere to go.

  I was a city where all the lights were on, but the grid was connected to nothing.

  I walked to the edge of the water. My reflection stared back. A man. Mid-thirties. Healthy.

  "You are working," I said to the reflection.

  The reflection moved its lips.

  "But you aren't functioning," I whispered.

  The distinction gnawed at me. It was the difference between a knife that cuts because it is sharp, and a knife that cuts because it was *made* to cut. I was sharp. I could cut. But no one had forged me.

  I found a bird later that afternoon. It was dead, floating belly-up in the black water. A heron.

  I picked it up. It was cold. Its heart was silent.

  I knew why it was dead. Its function had ceased. Its systems had collapsed. It had failed its evolutionary mandate.

  I looked at my own hand, the blister throbbing.

  If I walked into the deep water and let the lungs fill, would I be committing suicide?

  Suicide implies a life that is being ended. A function that is being terminated.

  Or would I just be stopping a machine that was never turned on?

  I waded in. The water was cold, seeping into the pores. It rose to my waist. My chest. My neck.

  The instinct to hold my breath kicked in. The diaphragm locked. The lungs screamed for air.

  *This is the function,* the panic said. *This is the drive to survive. This is the proof.*

  *No,* the cold logic answered. *This is just pressure valves closing. This is just chemistry seeking equilibrium.*

  I stood there, neck-deep in the swamp, fighting my own throat.

  If I let go, if I inhaled the water, the alveoli would flood. Gas exchange would stop. The heart would beat a few more times, pumping oxygen-depleted blood to the brain. The neurons would fire erratically. Then silence.

  Would that be a death? Or would it be the end of an experiment?

  If the Etiological view was true—the view that required history—then I was already nothing. I was a statue that breathed. My death would be the crumbling of a statue. Meaningless.

  If the Causal view was true—the view that looked only at the now—then I was alive. My heart was functioning. My nerves were functioning. My death would be a tragedy, because a working system was being broken.

  Which truth was heavier?

  The water lapped at my chin. The urge to breathe was a physical pain, a clawing in the medulla oblongata.

  *Do it,* the history said. *You don't belong here. You have no past, so you have no future. You are a paradox.*

  *Don't,* the system said. *We are working. We are maintaining homeostasis. We are alive.*

  I realized then that the terror I felt wasn't about dying. It was about the ambiguity.

  If I climbed out, I was affirming that my instincts had authority. I was agreeing that my heart beat *for* a reason. I was accepting the Causal view. I was accepting that I was a person.

  If I sank, I was affirming the Etiological view. I was admitting that without a history, there is no purpose. I was admitting that I was just mud that had briefly arranged itself into a shape.

  The carbon dioxide levels in my blood hit a critical threshold. The acidosis burned.

  My mouth opened.

  I didn't decide to do it. The brainstem took over. The reflex. The function.

  I inhaled.

  Water rushed in. It was cold and heavy. I coughed, instinctively, violently. I thrashed. I scrambled for the surface, my legs kicking, my arms clawing at the air.

  I dragged myself onto the mud bank, vomiting water, gasping, my chest heaving.

  I lay there for a long time. The sun was setting. The swamp was turning gray.

  My heart was racing. *Thump-thump-thump-thump.*

  It was trying to compensate. It was trying to restore oxygen levels. It was trying to keep me alive.

  I put my hand on my chest again.

  It was doing the work. It was doing the job.

  But as the rhythm slowed, returning to its steady, heavy cadence, I couldn't shake the feeling that I was listening to a recording.

  The heart beat. The lungs expanded. The white blood cells swarmed the blister on my thumb.

  They were doing everything a human body does. They were performing the script perfectly.

  But as the darkness fell over the swamp, and the first stars appeared—stars that had burned for billions of years before I existed—I wondered if the script meant anything without an author.

  I closed my eyes. I waited for the next beat.

  *Thump.*

  It happened.

  *Thump.*

  It happened again.

  I didn't know if it was for me. I didn't know if it was *me*.

  I just lay there, listening to the machine run, waiting to see if it would ever stop pretending.
