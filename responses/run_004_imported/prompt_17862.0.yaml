answer: |-
  The night your trivia team lost the tiebreaker over the Sydney Opera House, you didn't just lose a round; you stumbled into one of the liveliest debates in contemporary epistemology. Your friend Jenna, your boyfriend, and the rest of the table were inadvertently reenacting a conflict that philosophers like Timothy Williamson, Jennifer Lackey, and Keith DeRose have been fighting over for decades. The question is deceptively simple: **What gives you the right to tell someone something is true?**

  This is the problem of the **Norm of Assertion**. When you open your mouth and state a proposition as fact (rather than saying "I think" or "Maybe"), what condition must you meet to do so properly? To judge whether Jenna was in the wrong, we have to put the three main contenders on trial: The Truth Norm, The Justified Belief Norm, and The Knowledge Norm.

  ### The Contenders

  **1. The Truth Norm (TN)**
  *The Rule:* Assert $p$ only if $p$ is true.
  This is the simplest view. The goal of speech is to share truth, so you shouldn't share falsehoods.
  *The Verdict on Jenna:* Jenna is in the wrong. The Opera House was designed by Jørn Utzon, a Dane. She asserted it was an Australian. The statement was false.
  *Why it Fails:* This norm is too harsh and ignores the speaker's mind. If I tell you, "It's raining outside," based on looking out the window five minutes ago, but the rain stopped four minutes ago, I have violated the Truth Norm. But intuitively, I haven't done anything wrong. I wasn't lying; I was mistaken. The Truth Norm makes assertion a game of luck. If truth were the only requirement, Jenna would be guilty of the same infraction as a liar, which clearly isn't the case. We need a norm that accounts for the speaker's internal state.

  **2. The Justified Belief Norm (JBN)**
  *The Rule:* Assert $p$ only if you are justified in believing $p$.
  This is Jenna's defense. She didn't know the fact, but she had a reason to believe it (a memory of a documentary). She wasn't guessing; she was relying on what she reasonably took to be evidence.
  *The Verdict on Jenna:* Jenna is in the right. Her belief was justified by her memory, even if her memory was faulty.
  *Why it Fails:* This norm is too permissive. It falls apart under the pressure of the **Lottery Case**. Imagine I hold one ticket in a million-ticket lottery. The odds are 99.9999% that my ticket has lost. I am statistically *justified* in believing my ticket lost. But if I walk up to you before the draw and assert, "Your ticket lost," you would think I was being rude or presumptuous. I don't *know* it lost; it's still a gamble. The Justified Belief Norm says I'm allowed to assert it because my belief is reasonable. But our intuition screams that I shouldn't assert it as a fact. We reserve flat-out assertion for something stronger than just high probability.

  **3. The Knowledge Norm (KN)**
  *The Rule:* Assert $p$ only if you know $p$.
  Championed by philosopher Timothy Williamson, this is the heavyweight champion of epistemology. It argues that assertion is a speech act that represents the speaker as knowing. When you state a fact, you are implicitly guaranteeing that you know it.
  *The Verdict on Jenna:* Jenna is in the wrong. She did not know the architect was Australian (because it wasn't true, and you can't know falsehoods). Therefore, she should not have asserted it as a flat fact.
  *Why it Struggles:* This norm handles the Lottery Case perfectly (you don't *know* the ticket lost, so don't assert it). It also explains **Moore's Paradox**. Consider the sentence: "It is raining, but I don't believe it." This could be true (it is raining, and I'm unaware), but it is impossible to assert without sounding crazy. The Knowledge Norm explains why: to assert it, you must know it, but you can't know it if you don't believe it.
  However, the Knowledge Norm faces a major threat from philosopher Jennifer Lackey's **Selfless Assertion**. Imagine a devoutly religious school teacher who is a creationist. She personally believes evolution is false. However, she is a professional biologist and knows the evidence overwhelmingly supports evolution. When she teaches her class, she asserts, "Evolution is the driving force of biodiversity." According to the Knowledge Norm, she is violating the rule because she doesn't *believe* it (and therefore can't *know* it). But intuitively, she is doing the *right* thing. She is prioritizing scientific consensus over her personal delusion. If the Knowledge Norm says she's wrong to teach evolution, the norm seems broken.

  ### The Judgment

  We are left with a choice. Do we side with Jenna (Justified Belief) and risk allowing lottery-style gambling in conversation? Or do we side with your boyfriend (Knowledge) and risk condemning the biology teacher?

  I rule in favor of **The Knowledge Norm**.

  Here is why. The function of assertion in a cooperative society is to transfer *knowledge*, not just *true belief* or *justification*. When you assert something, you are inviting your listeners to rely on that information as a foundation for their own actions and beliefs. If I tell you the train leaves at 5:00, you might miss your connection if I'm just "justified" but wrong. If I *know* it leaves at 5:00, you are safe. The Knowledge Norm protects the integrity of our shared information network.

  Regarding the "Selfless Assertion" counter-argument (the biology teacher): This does not destroy the Knowledge Norm; it refines it. In the case of the teacher, she is not asserting on her own authority. She is acting as a mouthpiece for the scientific community. She effectively means, "The evidence dictates that evolution is real." She *does* know that the evidence supports evolution, even if she doesn't believe the conclusion herself. She is asserting a second-order fact about the state of science, which she *does* know. The Knowledge Norm survives.

  Regarding the Lottery Case: The Justified Belief Norm fails here because it conflates *probability* with *warrant*. Just because something is likely doesn't mean you have the standing to assert it as fact. The Knowledge Norm captures this distinction perfectly.

  ### The Verdict on Jenna

  So, was Jenna in the wrong? **Yes.**

  Under the Knowledge Norm, Jenna violated the norm of assertion. She presented a proposition as knowledge when she only possessed a justified (but false) belief. In the specific context of trivia, this distinction is vital. Trivia is not a game of "who has the best hunches"; it is a game of "who knows the facts." By asserting the Australian architect as a flat fact, she signaled to the table that she had secured the knowledge necessary to win the point. She invited the team to bet the tiebreaker on her authority. Since she lacked knowledge, that authority was illusory.

  However, there is a crucial distinction to be made between **violating a norm** and **being blameworthy**.

  You can violate a norm without being a bad person. If a soccer player accidentally trips an opponent while going for the ball, they have committed a foul (a violation of the rules), but they haven't committed a moral transgression. The referee awards a free kick (the team loses the point), but the player isn't ejected from the game (she isn't a liar).

  Jenna was **blameless**, but her assertion was **improper**.

  Your boyfriend was right about the rule: "If you don't know something you shouldn't say it like you know it." That is the Knowledge Norm in plain English. Jenna was right about her intent: She wasn't lying; she was mistaken. But intent doesn't change the norm. The friction at the bar happened because your boyfriend was focusing on the *propriety of the act* (the foul), while Jenna was focusing on the *character of the agent* (the player).

  The Knowledge Norm is the only one that respects the stakes of communication. It acknowledges that when we speak, we are building a shared reality. To assert without knowledge is to lay a brick that might crumble. Jenna's brick crumbled. The team lost. The norm holds. Next time, the hedge—"I'm pretty sure it's Australian"—isn't just politeness; it's an epistemological necessity. It signals, "I have justified belief, but I lack knowledge, so proceed with caution." Had she used that hedge, you might have double-checked, the tiebreaker would have been safe, and the night would have ended with drinks instead of a debate.

  The Knowledge Norm wins because it is the only rule that keeps the game worth playing.
