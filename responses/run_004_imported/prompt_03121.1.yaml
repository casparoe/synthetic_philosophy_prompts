          *   **Necessity:** Boethius explicitly uses the simple/conditional necessity distinction. Molina relies more on the logical ordering of God's knowledge (Natural -> Middle -> Free) to show God doesn't determine the choice.
      *   *Verdict:* They are solving *related* problems but with different metaphysical tools. Boethius addresses the *temporal* aspect of foreknowledge (fixity of the past/future). Molina addresses the *causal* aspect of divine sovereignty (how God providentially orders a world without determining free choices). Boethius says "God doesn't foreknow, He eternally knows." Molina says "God knows what you *would* do, then chooses to create you."

