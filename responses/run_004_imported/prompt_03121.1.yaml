prompt: |-
  Over the last year I've taught myself what I can about the dispute between Molinists and their critics over "middle knowledge" - the idea that God knows, logically prior to deciding to create anything, exactly what every possible free creature would freely do in any circumstance in which he might place it. Wanting to understand where the underlying puzzle about foreknowledge and freedom actually comes from, I went back further, to Boethius, and I've gotten stuck on the following passage from Book V of the Consolation of Philosophy, in the H. R. James translation, where Philosophy is answering Boethius's fear that if God infallibly foreknows what people will do, nothing anyone does can really be free:

  "For instance, when you see at the same time a man walking on the earth and the sun rising in the heavens, you see each sight simultaneously, yet you distinguish between them, and decide that one is moving voluntarily, the other of necessity. In like manner the perception of God looks down upon all things without disturbing at all their nature, though they are present to Him but future under the conditions of time. Wherefore this foreknowledge is not opinion but knowledge resting upon truth, since He knows that a future event is, though He knows too that it will not occur of necessity. If you answer here that what God sees about to happen, cannot but happen, and that what cannot but happen is bound by necessity, you fasten me down to the word necessity, I will grant that we have a matter of most firm truth, but it is one to which scarce any man can approach unless he be a contemplator of the divine. For I shall answer that such a thing will occur of necessity, when it is viewed from the point of divine knowledge; but when it is examined in its own nature, it seems perfectly free and unrestrained. For there are two kinds of necessities; one is simple: for instance, a necessary fact, "all men are mortal"; the other is conditional; for instance, if you know that a man is walking, he must be walking: for what each man knows cannot be otherwise than it is known to be; but the conditional one is by no means followed by this simple and direct necessity; for there is no necessity to compel a voluntary walker to proceed, though it is necessary that, if he walks, he should be proceeding. In the same way, if Providence sees an event in its present, that thing must be, though it has no necessity of its own nature."

  I can follow the words well enough, but I don't really see what work the distinction between "simple" and "conditional" necessity is doing, or why Boethius thinks it blocks the inference from "God infallibly knows I will do X" to "I am not really free to refrain from X." Could you spell out the logical structure of the argument in plain terms? And once you've done that, I'd be curious whether you think this is really the same move that Molina later makes with middle knowledge, or whether Boethius and Molina are actually solving two different problems that only look alike from a distance.
