      *   *Subtlety 3: Player 2's Payoffs.* The prompt says "only Player 1's payoffs matter for what follows." But for IEDS to work fully, we usually need to eliminate P2's strategies too. If P2's payoffs make Left/Right dominated, that changes things. However, the argument is focused on P1's dominance.
      *   *Subtlety 4: The "Novelist" angle.* The protagonist is a K&R negotiator. Game theory in K&R is often about *signaling*, *reputation*, and *incomplete information* (Bayesian Games), not just static matrix dominance. This is a "quiet room" puzzle, not a "hostage on the phone" puzzle. This might be worth mentioning as a character note.

