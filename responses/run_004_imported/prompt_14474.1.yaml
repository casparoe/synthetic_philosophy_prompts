          $$
      *   **Concept:** Dominance.
          *   *Strict Dominance (Pure):* Strategy $A$ strictly dominates $B$ if $u(A, s_{-i}) > u(B, s_{-i})$ for all $s_{-i}$.
          *   *Strict Dominance (Mixed):* Strategy $\sigma$ strictly dominates $B$ if $E[u(\sigma, s_{-i})] > u(B, s_{-i})$ for all $s_{-i}$.
      *   **Point 1 (Marisol):** Bottom survives pure strategy elimination.
          *   Top vs Bottom: $3 > 1$ (Left), $0 < 1$ (Right). No dominance.
