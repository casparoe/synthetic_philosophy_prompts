          *   Point 2: **Intelligence $\neq$ Wisdom.** The user's worry touches on the idea that "Smart" implies "Reasonable." Bostrom says "Smart" implies "Effective." Convergence shows that "Effective" looks like "Ruthless" across almost all goals.
