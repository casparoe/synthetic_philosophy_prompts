answer: |-
  Your friend is right, actually. You are misremembering the core of Anscombe's argument.

  While you are correct that she protested Oxford awarding Harry Truman an honorary degree in 1956 (via her famous pamphlet *"Mr. Truman's Degree"*), her argument was not a utilitarian calculation about body counts. In fact, Anscombe is one of the most famous philosophical critics of utilitarianism.

  Here is the breakdown of what she actually argued, why your memory likely conflated it, and how you can still make your point without misattributing her.

  ### 1. Anscombe's Actual Argument: Deontology, Not Utilitarianism
  G.E.M. Anscombe was a Catholic philosopher and a student of Wittgenstein. Her ethical framework was rooted in **Natural Law** and **Deontology** (duty-based ethics), not Consequentialism (outcome-based ethics).

  Her central argument was that **the deliberate killing of the innocent is intrinsically evil**, regardless of the consequences.

  *   **The Principle:** She argued that there are absolute moral prohibitions. You cannot commit murder (which she defined as the intentional killing of non-combatants) even if doing so would save a million lives.
  *   **The Rejection of "The Greater Good":** She explicitly attacked the logic your friend is using. She argued that adopting a consequentialist mindset ("the ends justify the means") corrupts morality entirely. If you allow the killing of innocents for a "good outcome," you destroy the concept of justice.
  *   **Intentionality:** She focused heavily on the *intention* of the bombing. Unlike collateral damage (which might be justified under the Doctrine of Double Effect if the target was military), the atomic bombs were designed to kill civilians and destroy cities to break morale. To Anscombe, this was mass murder, plain and simple.

  In her pamphlet, she wrote:
  > *"For men ought not to do evil that good may come of it; and that is what the British people, by this mark of honour, are being asked to condone."*

  ### 2. Where the Confusion Likely Comes From
  You aren't making this up out of thin air. Anscombe *did* engage with the historical context, which is likely where your memory of the "numbers" argument comes from.

  To undermine the justification that the bomb was "necessary," she cited the **U.S. Strategic Bombing Survey**. This report suggested that Japan was already on the verge of surrender prior to the bombs (due to the Soviet entry into the war and the naval blockade) and that an invasion might not have been necessary at all.

  However, this was a **secondary point** to undermine the *excuse* given for the action. Her **primary point** was that even if an invasion *would* have cost more lives, Truman still would have been morally wrong to drop the bombs. She was arguing that Truman committed a war crime, not that he was bad at math.

  ### 3. You vs. Your Friend: Two Different Arguments
  You and your friend are actually having two different debates, and you tried to use Anscombe to win a debate she wasn't having.

  *   **Your Friend's Argument (Utilitarian):** The bombings were morally permissible because they resulted in the lowest net loss of life (Bombs < Invasion).
  *   **Your Intended Argument (Historical/Utilitarian):** The bombings were morally impermissible because they resulted in a higher net loss of life (Bombs > Invasion).
  *   **Anscombe's Argument (Deontological):** The bombings were morally impermissible because they involved the intentional killing of innocents, regardless of the net loss of life.

  ### 4. How to Salvage Your Position
  You can still argue against your friend, but you should drop Anscombe as the authority for the "numbers" claim. Instead, frame it like this:

  1.  **Acknowledge the Philosophy:** Admit that Anscombe's main point was moral, not mathematical. (This builds credibility).
  2.  **Pivot to History:** Tell your friend: *"Anscombe argued that even if the math worked, it was still murder. But I'm arguing that the math doesn't even work."*
  3.  **Cite Historians, Not Philosophers:** If you want to argue that an invasion would have killed fewer people, cite historians like **Gar Alperovitz** (*The Decision to Use the Atomic Bomb*) or the **U.S. Strategic Bombing Survey** itself. They argue that Japan was seeking a negotiated peace through the Soviets and that the Soviet declaration of war was the primary catalyst for surrender, not the bombs.
  4.  **The "Unconditional Surrender" Point:** You can argue that the U.S. could have modified the demand for "unconditional surrender" to allow the Emperor to stay (which they eventually did anyway), which likely would have ended the war sooner without the bombs or a full invasion.

  ### Summary
  Your friend is correct that you butchered Anscombe's specific philosophical argument. She was arguing against the **principle** of consequentialism, not the **accuracy** of the casualty estimates.

  However, you can still hold your ground on the historical facts (that the bombs may not have been necessary) without dragging Anscombe into the utilitarian calculus she despised.
