answer: |-
  I hate to be the one to pop the bubble on this rabbit hole, but there is a major factual error at the start of this chain: **David Lewis never wrote a paper titled "Do We Believe in Penal Substitution?"**

  It does not appear in his bibliographies, collections of his papers (like *Papers in Metaphysics and Epistemology* or *Papers in Ethics and Social Philosophy*), or any academic database.

  David Lewis (1941–2001) was indeed a rigorous analytic philosopher, famous for modal realism (the idea that all possible worlds are just as real as our own). He was also a committed Christian (a Presbyterian), and he did write occasionally on philosophy of religion (most notably a paper called *"Divine Evil?"* regarding the problem of evil). However, this specific paper on penal substitution appears to be an internet urban legend or a misattribution that has circulated in online forums.

  However, even though Lewis didn't write it, **the argument itself is real.** The "fines vs. prison" analogy is a standard objection to Penal Substitutionary Atonement (PSA) that is discussed in philosophy of religion.

  Since you're interested in the logic of it, let's look at why that argument exists, why proponents of PSA don't think it's a "knockout" blow, and why you haven't heard it attributed to Lewis in serious debates.

  ### 1. The Argument: Debt vs. Personal Liability
  The core of the argument you described is this:
  *   **Fines:** We view fines as **debts**. Debts are transferable. If I owe the state $500, you can hand them the $500 on my behalf. The state gets its money; the debt is cleared.
  *   **Prison:** We view prison time as **personal liability**. Punishment is attached to the moral agency of the criminal. If I commit a crime, *I* must serve the time. You cannot serve it for me because the punishment is meant to correct *me* or exact retribution against *me*.

  The objection claims that PSA treats sin like a fine (transferable) when it should be treated like a prison sentence (non-transferable), making the doctrine logically incoherent.

  ### 2. Why Theologians Don't Think This Refutes PSA
  If this argument were airtight, you would see systematic theologians abandoning PSA. They haven't, because they argue the legal analogy doesn't map perfectly onto the theological reality. Here are the three main counter-arguments you'll find in the literature:

  **A. The Judge Permits the Substitution**
  In our legal system, a judge cannot allow an innocent third party to go to prison for a guilty person. It violates the rules of the court.
  *   **Theological Counter:** In PSA, God is both the Judge and the one *authorizing* the substitution. The objection assumes God is bound by human legal codes. Proponents argue God, as the sovereign lawgiver, can establish a covenant where substitution is legally valid. It's not a miscarriage of justice if the Judge ordains it.

  **B. Covenantal Headship (The "Team Captain" Analogy)**
  In our legal system, you and I are separate individuals.
  *   **Theological Counter:** Christian theology often posits that Jesus isn't just a "friend" paying a fine; he is the "Second Adam" or the head of a new humanity. In legal terms, this is like a corporate representative. If the CEO signs a deal, the whole company is bound. If the CEO takes a penalty, the company pays. Theologians argue Jesus represents humanity, so his punishment is legally applicable to those he represents.

  **C. The Nature of Sin as Debt**
  The argument assumes sin is purely criminal. But in the biblical framework (especially Hebrew and Roman law mixed in the New Testament), sin is also a **debt** (the Greek word *opheilēma* means both sin and debt).
  *   **Theological Counter:** If sin is a debt owed to God's honor or justice, it *is* transferable, provided the payer has sufficient assets. The claim is that Jesus, being divine, has infinite "assets" (merit), allowing him to pay a debt that finite humans could not.

  ### 3. Why Doesn't This Come Up More?
  Actually, it *does* come up quite a bit, just not attributed to Lewis.
  *   **Hugo Grotius (17th Century):** The legal theorist and theologian argued that God's justice is administrative, not absolute. He tackled the transferability issue directly.
  *   **Modern Analytic Theology:** Philosophers like **Richard Swinburne**, **Eleonore Stump**, and **William Lane Craig** engage with these exact legal analogies regularly.
  *   **The Reason it Doesn't "End" the Debate:** In philosophy, almost no argument ends a debate. Every objection has a counter-objection. The "fines vs. prison" point is usually considered a **category error objection** (saying theologians are mixing up types of punishment). Defenders reply that it's not a category error because the metaphysical situation (God vs. Human) is unique.

  ### Summary
  You found a very common philosophical objection, but it was wrapped in a false attribution.
  1.  **David Lewis did not write that paper.** It is likely a misattribution circulating online.
  2.  **The argument is standard,** but it is not considered a "logical inconsistency" that disproves the doctrine. It is considered a challenge that the doctrine must answer.
  3.  **Theology relies on specific premises** (like Covenantal Headship and Divine Permission) that bypass the human legal limitations the argument relies on.

  It is great that you are digging into these arguments! Analytic philosophy of religion is a fascinating field. Just be wary of "quote mining" or papers that seem too perfectly tailored to a specific internet debate without a clear citation in a university library. Lewis was a genius, but he didn't write everything people say he wrote.
