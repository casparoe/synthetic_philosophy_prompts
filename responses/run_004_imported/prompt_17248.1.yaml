  I know you mentioned the debate with Dana in your prompt. It is genuinely ironic that this student made the exact same move Dana did ("isn't that just labeling theory" / "implies it's not real"). It validates your frustration: this is a very common misreading of Hacking. The student wrote a B+/A- answer because they know the *text*, but they failed the *philosophy* in section (c) by treating looping as a debunking tool rather than an ontological description. If you want to be smug about your round with Dana, you technically earned it—this student made her mistake on paper.
