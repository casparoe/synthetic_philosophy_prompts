answer: |-
  This is one of the most profound questions in the foundations of mathematics, and your confusion is completely warranted. You have stumbled onto the central fault line in the philosophy of set theory.

  Your brother-in-law is articulating a view called **Formalism**. The set theorists hunting for new axioms are often operating under a view called **Platonism** (or Realism). Neither side is "wrong," but they are answering slightly different questions.

  Here is the breakdown of why serious mathematicians spend careers on this if the "Monopoly rules" analogy seems to make the question moot.

  ### 1. The Monopoly Analogy (Formalism)
  Your brother-in-law's take is logically sound within the framework of Formalism. In this view, mathematics is a game of symbol manipulation.
  *   **The Axioms (ZFC):** These are the rules of the game.
  *   **The Theorems:** These are the moves allowed by the rules.
  *   **CH:** This is a question like "Can a pawn move backwards?"

  If the rulebook (ZFC) doesn't say, then the question has no answer *within the game*. If you want an answer, you have to agree on a "house rule" (add an axiom). In this view, searching for the "true" answer to CH is indeed like searching for the "true" house rules of Monopoly. It's a category error.

  Many working mathematicians (algebraists, analysts, etc.) are effectively formalists. They say, "If you need CH for your proof, state it. If you need not-CH, state that. Just don't mix them."

  ### 2. The Geography Analogy (Platonism)
  However, the set theorists arguing about CH usually don't believe they are playing Monopoly. They believe they are doing **Geography**.

  Imagine you are an explorer mapping a continent. You have a map (ZFC). You come to a foggy valley (CH) where your map doesn't show whether there is a mountain or a lake.
  *   **The Formalist says:** "The map doesn't say. Therefore, there is no fact of the matter. We can draw a mountain or a lake, whichever helps us navigate."
  *   **The Platonist says:** "The terrain is actually there, independent of our map. The fog is just a limitation of our surveying tools (ZFC). There *is* a mountain or a lake, and our job is to build better tools to see which one it is."

  For Platonists, the "Universe of Sets" is a real, objective structure. ZFC is just an incomplete description of it. When they search for new axioms, they aren't picking house rules; they are trying to write a more accurate description of the territory.

  ### 3. Why the Research Isn't Just Philosophy
  If it were purely philosophical, it wouldn't command so much mathematical energy. The reason set theorists hunt for new axioms is that **the choice of axioms changes the landscape of *all* mathematics, not just set theory.**

  This is the key point your brother-in-law might be missing. The independence of CH isn't an isolated weirdness.
  *   **If you assume CH is true:** You get a certain kind of mathematical universe (often called "thin"). Some problems in analysis and topology become easier, but others become impossible to solve.
  *   **If you assume CH is false (e.g., via Forcing Axioms):** You get a "rich" universe. Suddenly, hundreds of other independent questions in calculus, topology, and algebra get settled automatically.

  So, the debate isn't just "Is CH true?" It is: **"Which version of the mathematical universe is more coherent, fruitful, and reflective of our intuition about infinity?"**

  When a set theorist proposes a new axiom (like *Projective Determinacy* or *Forcing Axioms*), they aren't just flipping a coin. They argue for it based on **extrinsic justification**:
  1.  Does it resolve many independent problems at once?
  2.  Does it create a harmonious theory?
  3.  Does it align with our deepest intuitions about what a "set" should be?

  ### 4. The Modern Twist: The Multiverse
  There is a third view that has gained massive traction in the last 20 years, championed by people like Joel Hamkins. This is the **Set-Theoretic Multiverse**.

  This view suggests that *both* the Formalists and the Platonists are partially right.
  *   There isn't *one* Universe of Sets ($V$).
  *   There are many possible universes. In some, CH is true. In others, CH is false.
  *   None is the "true" one. They are all equally valid mathematical worlds.

  In this view, the research program isn't about finding the *one true axiom*. It's about understanding the **relationships between these universes**. How can we move from a CH-universe to a not-CH-universe? (The answer, ironically, is Cohen's technique of *Forcing*).

  This makes the research program akin to physics. A physicist doesn't ask "Is Euclidean geometry true?" They ask, "What happens to light in Euclidean space vs. Riemannian space?" Set theorists are now asking, "What happens to analysis in a CH-universe vs. a not-CH-universe?"

  ### 5. So, who is right?
  *   **Your Brother-in-Law:** He is right that within the standard framework (ZFC), there is no answer. If you view math strictly as a formal game, CH is undecidable.
  *   **The Set Theorists:** They are right that "undecidable" doesn't mean "meaningless." By exploring new axioms, they discover deep structural connections between different areas of math that would remain hidden if we just shrugged and said "it's independent."

  ### The Verdict
  You aren't missing anything about the independence result; you are witnessing a clash of philosophical worldviews.

  If you think math is **invented** (like Monopoly), the search for the "truth" of CH is a waste of time.
  If you think math is **discovered** (like Geography), the search is essential.

  Most modern set theorists act as **Pragmatic Platonists**. Even if they aren't sure the "Universe" objectively exists, they proceed *as if* it does because that heuristic leads to the most beautiful and interconnected mathematics. They aren't just debating philosophy; they are building the tools (Large Cardinals, Inner Model Theory, Forcing) that allow us to understand the limits of logical reasoning itself.

  So, it's not *just* philosophy. It's philosophy acting as the engine for technical discovery. Whether that discovery reveals "Truth" or just "Interesting Consequences" is the part that's still up for debate.
