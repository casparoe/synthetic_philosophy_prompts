prompt: |-
  Quick research question for a book i'm drafting. My protagonist is sliding into a depression, and I want a scene where her mood doesn't just color how she feels about what she sees — it actually changes what she perceives, colors going flat, the room feeling farther away, that sort of thing. I read that the Müller-Lyer illusion is basically the textbook proof of "cognitive penetration," that what you believe can reach in and change raw perception, since you keep seeing the two lines as different lengths even after you've measured them and know for a fact their equal. That seems like the perfect bit of real science to hang the scene on, but before I write it, am I even getting that right? Can you unpack the actual concept for me so I don't butcher it on the page.
