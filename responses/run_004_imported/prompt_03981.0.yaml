  *Commitment:* The popular narrative is false. Grafen vindicated *honest signaling*, not the *Handicap Principle* as strictly defined by Zahavi.

  *Wait, one more check:* Is there a counter-argument? Some argue that in Grafen's model, the equilibrium *does* result in lower fitness than the no-signaling baseline (the "unraveling" or "arms race" aspect). This is often called "wasteful." But is it a "handicap"? A handicap implies a burden. If the net fitness is positive, is it a burden? Zahavi argued the signal *must* lower survival probability. Grafen's model allows for signals that lower fitness *marginally* but might not lower survival below a threshold if the mating gain is high.
