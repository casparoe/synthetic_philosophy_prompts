  Here is a draft for the eulogy. It is written to walk the line you described: acknowledging the difficulty of her final days without assigning blame, honoring her ethical precision without using academic language, and centering the tribute on *intention*—the core of her life's work.

  ***

  **Eulogy for [Mother's Name]**

  Thank you all for being here. Looking around this room, I see the two worlds my mother lived in. I see her colleagues, who know the weight of the work she did. And I see her family, who know the weight of her love. For thirty years, she tried to bridge those two worlds, insisting that the way we end a life must be treated with the same care as the way we live one.

  Mom was a woman of precise language. In a field that often deals in gray areas, she held onto clarity like a lifeline. She spent decades teaching residents that medicine isn't just about outcomes; it's about intent. She used to get quietly annoyed when people compared her work to a "trolley problem." She'd say that trolleys are about counting bodies, but medicine is about counting souls. She insisted that there is a profound moral difference between intending to end a life and intending to relieve suffering, even if the two arrive at the same destination.

  To some, that might sound like a technicality. To Mom, it was the difference between giving up on a person and standing by them until the very end. She believed that comfort should never come at the cost of truth. She believed that we owe it to the dying to be present with them, not to hurry them along, even when the watching is hard. Even when the watching is heartbreaking.

  I learned just how deeply that lesson had taken root in me during her last week. As her family, we were desperate to see her suffering end. There were moments when the temptation to blur the lines—to prioritize the end of the struggle over the process of dying—felt overwhelming. In the middle of that grief, I found myself speaking to my brother, and I realized with a shock that I wasn't using my own words. I was using hers. I was defending the very boundaries she had spent her life drawing, even as I stood on the other side of them as a daughter.

  It was the hardest thing I've ever done. But it was also the greatest tribute I could offer her. Because Mom didn't want our comfort to come from shortcuts. She wanted it to come from integrity. She taught us that love isn't just about wanting the pain to stop; it's about honoring the person in pain enough to respect the natural arc of their life, however difficult that arc may be.

  To her colleagues: Thank you for honoring her standards. You know how rare it is to find someone who refuses to let the hard things become the easy things.

  To my family: We are raw right now. We are tired. We wanted to fix this for her, and we couldn't. But in those final days, when we struggled with the decisions she would have struggled with, we were more like her than we knew. We were fighting to honor her intent.

  She did not intend to leave us. She intended to love us, precisely and clearly, for as long as she was able. The end of her life was not a choice she made; it was a reality she met with courage, managed with skill, and faced without flinching.

  So, as we mourn her, let's not fudge the truth of who she was. She was not soft around the edges. She was sharp, she was clear, and she was uncompromising because she believed that truth was the highest form of kindness.

  We will miss her. We will argue about her. We will miss the precision of her mind and the warmth of her hands. But if we can carry forward even a fraction of her conviction—that *why* we do something matters as much as *what* we do—then we will be honoring her exactly as she would wish.

  She intended to teach us until the end. And she succeeded.

  ***

  **A note on delivery:**
  This draft acknowledges the conflict in the final week ("the temptation to blur the lines") without explicitly naming your brother as the antagonist. This validates your experience and hers without creating a public scene. It frames the ethical stance as a shared family burden ("We were fighting to honor her intent") rather than a victory you won over him. This should allow the colleagues to nod in recognition of her ethics, while allowing the family to feel the weight of the loss without feeling accused.

  I am so sorry for your loss. It is a profound irony to have to defend a hospice doctor's philosophy during her own hospice care, but holding that line is a testament to how well she taught you.
