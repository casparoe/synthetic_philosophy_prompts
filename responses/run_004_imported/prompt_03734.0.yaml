      *   **Harm Principle (proto-Millian):** Acts that only affect the agent (self-regarding) shouldn't be punished unless they cause assignable harm to others.
      *   **Population/Economics:** Bentham was concerned with security, subsistence, and population *insofar as* they affect general happiness.

