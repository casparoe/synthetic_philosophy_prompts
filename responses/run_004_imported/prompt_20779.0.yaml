answer: |-
  **MEMORANDUM**

  **TO:** Aggregation Policy Subcommittee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Handling Persistent Post-Crux Disagreements (Policy Clarification 2023-04)

  ### 1. Executive Summary

  Following the recent divergence between two top-tier forecasters (20+ percentage points post-double-crux), this memo recommends **maintaining the current Equal-Weight Aggregation policy** for this specific case and as general standing policy, subject to a six-month review.

  We explicitly **reject** the proposed "Veteran Override" for this cycle. While the persistence of disagreement among calibrated peers presents a theoretical challenge to standard epistemic norms, altering our aggregation weights based on seniority introduces unquantified bias without proven signal. We further clarify that our adoption of the midpoint is a **pragmatic statistical heuristic**, not an endorsement of strict philosophical conciliationism, thereby avoiding the self-defeat paradox associated with the latter.

  ### 2. Context: The Anomaly

  Our standard operating procedure assumes the *Equal-Weight View* (EWV): when epistemic peers disagree, equal weight minimizes aggregate error. However, the recent session between Forecasters A and B (both top-decile calibration, multi-year track records) violated the expected convergence norm. After full disclosure of models and evidence, credences remained separated by >20 points.

  This triggers two competing proposals:
  1.  **Veteran Override:** Allow the forecaster with longer tenure to retain higher weight on their specific estimate.
  2.  **Forced Midpoint:** Strictly enforce the average, treating the persistence of disagreement as noise to be smoothed.

  ### 3. Epistemic Analysis

  To vote responsibly, we must address the theoretical horns driving this debate.

  #### A. The Aumann Constraint
  Aumann's Agreement Theorem suggests that rational agents with common priors cannot agree to disagree. The fact that A and B *do* disagree implies one of three things:
  1.  **Bounded Rationality:** They are not ideal Bayesians (true of all humans).
  2.  **Divergent Priors:** Their underlying worldviews are not common knowledge.
  3.  **Incommunicable Evidence:** One possesses intuition or pattern recognition they cannot fully articulate in a double-crux.

  If (3) is true, the "Veteran Override" assumes the veteran holds the incommunicable truth. However, since both forecasters possess near-identical Brier scores, we have no empirical basis to assign higher probability to the veteran's incommunicable intuition over the newer peer's. Granting an override privileges *status* over *calibration*. Until calibration diverges, we must treat their incommunicable residuals as equally likely to be signal or noise.

  #### B. The Conciliationism Self-Defeat Objection
  The argument for the "Forced Midpoint" often relies on Conciliationism (the norm that one should significantly revise beliefs in the face of peer disagreement). However, as noted in recent literature (e.g., Christensen, Elga), strict conciliationism faces a self-defeat problem: *Epistemologists disagree about conciliationism. If conciliationism is true, should we not conciliate on that, potentially abandoning conciliationism?*

  If we adopt the midpoint *because* "conciliationism is true," we are vulnerable to this paradox.

  **Our Defense:** This committee does not adopt the midpoint because conciliationism is metaphysically true. We adopt **Linear Pooling** because it is empirically robust. Extensive literature on forecasting tournaments (e.g., IARPA, Good Judgment Project) demonstrates that simple averages of independent forecasts consistently outperform individual experts, even experts who refuse to move. We are not making a truth-claim about the nature of disagreement; we are making a **variance-reduction claim**. This sidesteps the self-defeat objection: we are not conciliating because it is rational; we are averaging because it works.

  ### 4. Recommendation

  **Vote Item:** Maintain Equal-Weight Aggregation for the current newsletter cycle regarding this question.

  **Rationale:**
  1.  **Calibration Parity:** With identical Brier scores, there is no data-driven justification for weighting one forecaster over the other.
  2.  **Bias Prevention:** A "Veteran Override" creates a perverse incentive for forecasters to avoid updating during double-crux sessions, knowing their initial position is protected by tenure.
  3.  **Robustness:** Linear pooling protects the newsletter from outlier overconfidence. If the veteran is right, the average will still shift significantly toward their view (50% weight is substantial). If the veteran is wrong, the average protects our group calibration.

  ### 5. Implementation and Review (Sunset Clause)

  This decision is not permanent. The persistence of post-crux disagreement is evidence that our "peer" classification may need refinement.

  **Review Trigger:** This policy clarification expires in **6 months** OR after **three additional instances** where calibrated forecasters (Brier score within 0.02 of each other) remain >15 points apart after documented double-crux sessions.

  **Action Item for Review:**
  Upon trigger, the committee will commission an audit of the "stubborn" forecasts.
  *   If the "veteran" positions consistently resolve more accurately, we will introduce a **Calibration-Weighted Override** (not tenure-based).
  *   If no accuracy difference is found, we will reaffirm Equal Weight and investigate whether our double-crux protocol is failing to surface key priors.

  ### 6. Conclusion

  We are not solving the philosophy of disagreement today. We are managing the risk of our newsletter's calibration. Until we have evidence that tenure correlates with accuracy *in the face of disclosed disagreement*, the variance-reduction benefits of the equal-weight average outweigh the theoretical possibility of a "hidden truth" held by the veteran.

  **Recommended Vote:** **Approve** continuation of Equal-Weight Aggregation with the 6-month sunset clause defined above.

  ***

  **Attachments:**
  *   *Summary of Forecaster A/B Track Records (Anonymized)*
  *   *Excerpt: "The Self-Defeat of Conciliationism" (Stanford Encyclopedia of Philosophy)*
  *   *Data: Performance of Linear Pools vs. Best Individual Forecasters (GJP Data)*
