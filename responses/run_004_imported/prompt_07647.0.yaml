      *   *Section 2: The Value of Death (The Skull).* This is the strongest evidence. The skull *prefers* death. Transhumanism assumes life is the only good. This is a fundamental axiological clash.
      *   *Section 3: Control vs. Trust (Deathbed Scene).* Cryonics is about controlling the post-mortem process for a specific human end. Zhuangzi advocates surrendering the body to the cosmos without preference.
