answer: |-
  The satchel sits on the chair, open-mouthed, waiting for the things I think I will need. A sweater. Water. The playlist printed on cardstock. And the eye mask, black and thick, blocking out a world I am still trying to hold onto.

  It is 3:00 AM. The house is quiet, the kind of quiet that presses against the eardrums. Sarah is asleep down the hall, breathing in the rhythm I have been counting for twenty years. I am counting something else now. Months. Maybe weeks. The pain in my ribs is a dull, red throb, a reminder that the clock is not just ticking; it is unraveling.

  I picked up the brochure for the program three times before I called. I read the testimonials. *Profound.* *Dissolution.* *Rebirth.* Words are cheap. They are maps drawn by people who have visited a country I have never seen, describing landscapes in a language I don't speak. They tell me it is like dying, but without the end. They tell me it is like being born, but without the scream.

  I try to simulate it. I close my eyes and try to imagine what it will be like to see the walls breathe, to feel the boundary of my skin dissolve. But my imagination is a prisoner of my current state. I can only imagine *me*, scared and sick, watching walls breathe. I cannot imagine what it is like to *be* the breathing wall. I cannot know the taste of the experience until I swallow it. That is the first wall. I am betting on a sensation I cannot conceive, like a man born blind betting on the color blue.

  But there is a second wall, higher and harder to see.

  I look at the photo on the nightstand. Sarah at the beach, ten years ago. I love that photo. I love the memory of the cold wind, the smell of salt, the way she laughed when the water hit her ankles. I am doing this tomorrow because I am afraid of losing those memories. I am afraid of the dark. I want to be at peace with the end.

  But what if the peace they promise is not the peace I want?

  I want to be the man who loves his wife and accepts his death. I do not want to be the man who loves his wife less because he has seen the fabric of the universe and found her small within it. I do not want to be the man who accepts death because he no longer cares about life.

  The pamphlet says the therapy helps you "reorder your priorities." It sounds gentle. But reordering implies moving things around. What if it implies throwing things away?

  I am choosing this for the person I am tonight. The person who clings. The person who fears. But the person who wakes up on the other side of that eye mask might not be him. He might look at this satchel, at this photo, at this fear, and feel nothing but a distant, benign curiosity. He might not want the comfort I am seeking for him. He might not want *me*.

  Is it a cure if the patient doesn't survive the treatment?

  I pick up the eye mask. It is soft, lined with velvet. It feels like a surrender. If I put this on, I am agreeing to let go of the very hands I am using to hold onto myself. I am asking a chemical key to unlock a door, knowing that the room inside might be so vast I won't fit in it anymore.

  I want to be healed. But I am terrified that healing looks like indifference.

  I place the mask in the bag. I zip it shut. The sound is loud in the silence.

  Outside, the sky is beginning to lighten, a bruised purple turning to grey. Soon the sun will come up. Soon I will drive to the clinic. Soon I will swallow the capsule. I will wait for the world to end, or the world to begin, or for me to end, or for me to begin.

  I do not know which one I am praying for. I only know that I am packing the bag, and I am walking out the door, carrying a self that I am willing to lose in order to save.
