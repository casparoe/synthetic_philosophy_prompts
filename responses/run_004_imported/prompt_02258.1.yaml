answer: |-
  You have hit on exactly the right intuition, and you are in good company. The approach you described—weighting ethical theories by credence and maximizing the expected value across them—is known in the literature as **Maximizing Expected Choiceworthiness (MEC)** or **Expectationalism**.

  Within the Effective Altruism and Rationalist communities, this is often treated as the default working assumption (championed notably by William MacAskill in his thesis *Normative Uncertainty*). However, your confusion about why academic philosophy treats this as an open, thorny problem rather than a solved application of decision theory is well-founded.

  The short answer is: **Your analogy holds perfectly *if* ethical theories behave like statistical models. The philosophical contention arises because ethical theories arguably do *not* behave like statistical models.**

  Here are the specific technical breakdowns where the "moral ensembling" analogy runs into walls that don't exist in machine learning.

  ### 1. The Intertheoretic Comparison Problem (The Units Problem)
  In your work, when you ensemble models, they output values on a comparable scale. Model A predicts a 0.8 probability of churn; Model B predicts 0.75. You can average these because "probability" means the same thing to both models.

  In ethics, theories often output values in incommensurable units.
  *   **Utilitarianism** might say Action A produces +100 utils and Action B produces +10 utils.
  *   **Kantian Deontology** might say Action A is *impermissible* (binary constraint) and Action B is *permissible*.
  *   **Virtue Ethics** might say Action A is *cowardly* and Action B is *courageous*.

  To run the calculation you proposed, you need to normalize these outputs. You need to know: *How many utils equal one rights violation?*
  If you assign a "cost" of -1,000,000 utils to a rights violation, the deontological model dominates. If you assign -5 utils, the utilitarian model dominates. There is no "validation set" to tell you what the exchange rate is. This is known as the **problem of intertheoretic comparisons**. Without a common scale, you cannot compute the expectation.

  Some philosophers (like Christian Tarsney) argue we can solve this via "structural analogies," but others argue that some theories are fundamentally ordinal (ranking options) while others are cardinal (measuring value), making them mathematically incompatible for averaging.

  ### 2. The Epistemic Problem (Updating Priors)
  In ML, you update model weights based on performance against ground-truth data (the test set). You have a likelihood function: $P(Data | Model)$.

  In moral uncertainty, what is the "data"?
  *   If you use **moral intuitions** (e.g., "slavery feels wrong") as data to update your credence in theories, you face circularity. Your intuitions are likely already shaped by the moral theories you are trying to evaluate.
  *   If you use **outcomes** (e.g., "people seem happier"), you are privileging consequentialist data, which unfairly penalizes deontological theories that don't care about outcomes.
  *   If you treat moral truths as **necessary truths** (like math), then "uncertainty" is just confusion. You can't Bayesian update on math; you either prove it or you don't. If moral truths are necessary, having a "credence" in them is epistemologically suspicious.

  Because there is no agreed-upon likelihood function for moral truth, the "weights" in your ensemble are essentially stuck as static priors. In ML, a model that consistently fails gets down-weighted. In ethics, a theory might seem counterintuitive now but be correct (e.g., abolitionism in the 1800s). There is no loss function to minimize.

  ### 3. The Fanaticism Problem (Unbounded Utility)
  This is a specific failure mode of Expectationalism that looks a lot like **Pascal's Mugging**.

  In ML, we often clip gradients or bound loss functions to prevent outliers from destroying the model. Ethical theories often have unbounded utility functions.
  *   Suppose you have 99% credence in Common Sense Morality (save the drowning child).
  *   Suppose you have 1% credence in a "Fanatical" theory that says preventing a specific astronomical future suffering is infinitely more important than anything happening now.

  Even with only 1% credence, the expected value of the Fanatical theory dominates the calculation because infinity (or $10^{100}$) times 0.01 is still huge. This leads to the conclusion that you should ignore all present suffering to work on obscure, high-leverage long-termist projects.

  While some EAs accept this (leading to strong Longtermism), many philosophers view this as a *reductio ad absurdum* of the MEC framework. It suggests that under moral uncertainty, any theory with unbounded utility dominates the ensemble regardless of how low your credence is, rendering the "averaging" meaningless.

  ### 4. The "Theory Rejection" Problem
  In ML, models don't care how you use their outputs. In ethics, the theories themselves have opinions on how you should decide.

  *   **Utilitarianism** says: "Maximize expected utility." (Compatible with MEC).
  *   **Deontology** might say: "Do not violate constraints, regardless of expected outcomes."
  *   **Virtue Ethics** might say: "Act as a virtuous agent would," which might involve *not* calculating expected choiceworthiness.

  If you use MEC to combine them, you are effectively violating the deontologist's instruction (by allowing trade-offs) and the virtue ethicist's instruction (by calculating). Some philosophers argue that if a theory says "Do not use expected value calculations to decide," then including it in an expected value calculation is disrespectful to the theory itself. It's like asking a pacifist to vote on whether to go to war; the act of voting legitimizes a framework they reject.

  ### 5. Why Philosophy Isn't "Behind the Curve"
  It is tempting to view philosophy as engineering that hasn't discovered the right tool yet. But in this case, the "tool" (decision theory) requires inputs that philosophy cannot define.

  *   **ML Assumption:** The ground truth exists and is observable.
  *   **ML Assumption:** All models output on a comparable metric space.
  *   **ML Assumption:** The cost of being wrong is quantifiable.

  Moral uncertainty challenges all three. The "open problem" status in philosophy isn't because they haven't thought of Bayesian averaging; it's because they are arguing about whether the variables required to *run* Bayesian averaging are coherent.

  ### Summary
  Your intuition is the standard starting point for modern normative uncertainty (specifically the **MEC** framework). The reason it remains a contested academic problem is that:
  1.  **Normalization:** We don't know how to scale different theories to a common unit.
  2.  **Updating:** We don't have a likelihood function for moral truth.
  3.  **Fanaticism:** Unbounded utilities break the expectation calculation.
  4.  **Self-Defeat:** Some theories forbid the aggregation method itself.

  The EA/Rationalist community tends to adopt MEC pragmatically ("it's the best we have, so we use it"), whereas academic philosophy tends to focus on the structural impossibility of defining the inputs. You aren't missing a simple solution; you've identified the solution that everyone tries to use, and the "open problem" is all the reasons why that solution might be mathematically ill-posed.
