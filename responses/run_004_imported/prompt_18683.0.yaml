prompt: |-
  So I've been on a bit of a Bertrand Russell kick lately — picked up "Marriage and Morals" after seeing it namedropped in some old piece about him, and its wild how radical he comes across for 1929. He goes after Victorian sexual shame pretty hard, arguing that jealousy isn't some fixed biological law but mostly a learned thing tied up with men treating women as property, and he's into stuff like contraception and "companionate marriage" (Judge Ben Lindsey's idea, I think — marriage without expecting kids right away, easier to dissolve if it doesn't work out). But then further into the book he's actually pretty firm that once there's kids in the picture, the household needs real stability and the number of parent-figures around should stay small, because he thinks that's what's actually good for the kids psychologically. So he's fine with the adults having some discreet stuff on the side as long as it doesn't disrupt the home, but he's not really describing anything like an openly-declared, everybody-knows multi-partner family setup.

  Anyway this turned into an argument with a buddy of mine over beers about what Russell would actually make of modern polyamory — I mean the current version, where it's a openly claimed identity rather than a quiet affair, and you get whole "polycules" jointly raising kids with everyone fully aware of everyone else. My buddy reckons Russell's jealousy-is-just-social-conditioning argument basically commits him to being fine with it, maybe even enthusiastic about it as progress. I think his stuff about kids needing a few consistent, stable parent-figures cuts the other way, and he'd actually end up pretty wary of it in practice even if he liked it in theory. I'm a software engineer, not a philosophy person, so I might be missing something obvious here — can you actually dig into his real arguments (not just "he was progressive on sex so he'd approve of anything modern") and tell me which way you think this genuinely shakes out, or if it's a real toss-up, spell out exactly where the tension in his own reasoning lies?
