answer: |-
  The silence in the conference room was heavier than the blast doors sealing it from the outside world. On the left sat the Voro delegation, stony-faced and confused. On the right, the Kaelen chairs were empty. Their jackets were still draped over the backs, cooling in the aggressive air conditioning, like ghosts of a negotiation that had died three minutes ago.

  Elara, the lead interpreter, rubbed her temples. She was the only one left in the no-man's-land between the two flags.

  "They walked out over *Ostrak*," said General Hark of the Voro, slamming a hand on the table. "It is a geological term. It means 'stone-dweller'. It is descriptive. It is accurate. They live in the stone cities."

  "It is a slur," Elara said quietly. She didn't look at him; she was watching the empty Kaelen chairs.

  "It is not," Hark insisted. "In Old Voro, it has no negative connotation. We are being held hostage by sensitivity. We want peace, but they demand we sanitize our language before we can even discuss borders."

  This was the third day of the Truth and Reconciliation talks. The war had ended six months ago, but the vocabulary of the conflict remained armed.

  Elara stood up. "I need to speak to the Kaelen. Then I need to speak to you again. Do not leave the room."

  She found the Kaelen delegation in the antechamber, huddled near the coffee machine. Their lead negotiator, Ambassador Ilyas, was shaking.

  "He said it with the flat tone," Ilyas said, before Elara could even apologize. "He didn't spit it. He didn't sneer. He said it like he was reading a grocery list. *'The Ostrak demand reparations.'* As if we are objects. As if the word itself doesn't carry the weight of the occupation."

  "I know," Elara said. "But I need you to understand something about the Voro language. Specifically, about *Ostrak*."

  "It means 'sub-human'," Ilyas snapped.

  "Lexically? No," Elara said. "I checked the etymological archives last night. In pre-war Voro, *Ostrak* simply meant 'inhabitant of the lithosphere'. It was neutral. But you're right. It hurts. It hurts because of *who* is saying it."

  "Exactly," Ilyas said. "It is a weapon."

  "It's not a weapon," Elara corrected gently. "It's a violation of a felicity condition."

  Ilyas blinked. "Excuse me?"

  Elara took a breath. This was the tightrope. If she explained it wrong, the Kaelen would feel gaslit, and the Voro would feel vindicated in their ignorance. She had to make them see that the linguistics *was* the politics.

  "In philosophy of language, there is a debate about words like *Ostrak*," Elara began, keeping her voice steady. "One side argues that the word itself contains the poison. That the definition of *Ostrak* literally includes 'inferior'. That is the Hom view. If that were true, the Voro couldn't use it without lying, because they believe you are their equals."

  "And the other side?" Ilyas asked, skeptical.

  "The other side, Anderson and Lepore, argue that the word is neutral, but there is a social norm prohibiting its use. Like a 'Do Not Enter' sign. The offense isn't the meaning; it's the breaking of the rule."

  "We do not care about your academic theories," Ilyas said. "We care that he called us *Ostrak*."

  "Let me finish," Elara pressed. "I've been listening to General Hark for three days. I've analyzed his syntax. He isn't using *Ostrak* to insult you. He thinks he is using the Anderson-and-Lepore version: a neutral term that you have arbitrarily forbidden. He thinks this is about censorship."

  "It is about dignity."

  "But," Elara raised a finger, "I found something else. In Voro grammar, nouns regarding people require an evidential marker. A suffix that tells you *how the speaker knows* the information."

  Ilyas frowned. "We have that in Kaelen too."

  "Right. In Kaelen, if I say 'You are tired,' I can mark it as *visually observed* or *inferred*. But Voro has a specific marker for *socially assigned categories*." Elara leaned in. "When Hark said *Ostrak*, he didn't use the Socially Assigned marker. He used the *Intrinsic Property* marker."

  The room went quiet. The hum of the coffee machine seemed to grow louder.

  "What does that mean?" Ilyas asked.

  "It means," Elara said, "that grammatically, he didn't say 'The people you call Ostrak.' He said 'The people who *are inherently* Ostrak.' He wasn't just using a slur. He was making a metaphysical claim. He was saying your identity is an objective fact of the universe, defined by *him*, not a social label defined by *you*."

  Ilyas went still. The anger didn't leave his eyes, but it shifted, crystallizing into understanding. "He is claiming ownership of our definition."

  "Yes. The word *Ostrak* might be reclaimable. The Kaelen youth use it among themselves sometimes, right? As a badge of resilience?"

  Ilyas nodded slowly. "Yes. *We* say it. It means 'Endurer'."

  "Exactly. When you say it, you use the *Self-Identified* marker. When Hark said it, he used the *Intrinsic* marker. He wasn't just being insensitive. His grammar asserted that the Voro have the authority to define Kaelen nature. That is why it felt like the occupation started again."

  Ilyas looked at the door leading back to the conference room. "So he admits we are equals, but his grammar says we are specimens."

  "Precisely." Elara touched his arm. "If you walk out now, the war resumes. Not because of a word, but because you let a grammatical structure dictate the peace. But if you go back in, you don't ask him to stop using the word. You ask him to change the suffix."

  Ilyas let out a long breath. "He will say it is too technical. That it is hair-splitting."

  "Tell him it is the border," Elara said. "Tell him the suffix is the border. If he cannot respect the grammar of our identity, he cannot respect the geography of our land."

  Ilyas nodded. He signaled to his team. They straightened their jackets.

  Elara walked back into the main room alone first. General Hark looked up, hopeful.

  "Are they coming back?"

  "They are," Elara said. "But there is a condition. It is not about the word *Ostrak*."

  Hark relaxed. "Good. Because it is the only term that fits."

  "It is about the suffix," Elara said. "You used the *Intrinsic Property* marker. *-os*."

  Hark blinked. "It is standard grammar."

  "For rocks, yes. For people, no. When you refer to the Kaelen, you must use the *Socially Recognized* marker. *-en*."

  Hark frowned. "*Ostraken*? That sounds... soft. It implies their identity is subjective."

  "It implies their identity is *theirs*," Elara said sharply. "The *-os* ending asserts that you have the authority to categorize them biologically. The *-en* ending asserts that you recognize their self-categorization. You want to use the word? Fine. But you must use it as a guest uses a host's name, not as a scientist names a bug."

  Hark looked down at his notes. He picked up his pen. He wrote *Ostrak-os*. He crossed out the *os*. He wrote *en*.

  "It changes the rhythm of the sentence," Hark muttered.

  "It changes the power dynamic," Elara corrected. "That is the point."

  She opened the door. The Kaelen delegation filed back in. Ilyas sat down. He didn't look at Hark. He looked at Elara.

  Elara nodded.

  Hark cleared his throat. He looked at his notes, then at Ilyas. He spoke slowly, carefully articulating the end of the word.

  "We are prepared to discuss the reparations for the... *Ostraken*."

  The suffix hung in the air. It was a small sound, a soft nasal vibration at the end of a harsh word. But in the silence of the room, it sounded like a door closing on the past.

  Ilyas didn't smile. But he picked up his pen. "The *Ostraken* thank you for the acknowledgment. Let us begin with the mining rights."

  Elara sat back in her booth and put her headset on. She muted her microphone for a second, just to breathe.

  Linguists often said language was a mirror of reality. But in this room, Elara knew the truth. Language wasn't a mirror. It was the mortar. And if you didn't mix it right, the whole wall came down.

  She unmuted. "The delegation asks for clarification on sector four..."

  The talks continued. The word *Ostrak* was used a dozen more times that afternoon. Every time, Hark clipped the *-en* onto the end. Every time, Ilyas flinched a little less. It wasn't forgiveness. It wasn't even friendship. But it was a shared syntax. And for now, in a room full of ghosts, that would have to be enough.
