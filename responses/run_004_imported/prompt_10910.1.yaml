      *   *Key Concept:* **Mortality.** A series ending (or the author dying) gives weight to the work. Infinite continuation dilutes that.
      *   *Key Concept:* **The "Ghost" in the Machine.** Readers know there's a human behind the book. Removing that changes the ontological status of the object.

  7.  **Developing the Core Metaphor:**
