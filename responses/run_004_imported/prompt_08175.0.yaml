      *   **The Meat (Constitutional Shift):** Explain the Garrison split. Avoid the "Founders were good" trap. Focus on *text* vs. *intent*. Douglass realized the power lies in the written word.
      *   **The Bridge (To Transcription):** How does this relate to typing out old letters/minutes? Precision. The devil (and the freedom) is in the details. Summaries smooth over the cracks; transcription reveals them.
      *   **The Call to Action:** We aren't just typing; we are recovering the specific language of freedom used by Black convention attendees.
      *   **Closing:** Encouragement for the work ahead.

  5.  **Refining the Tone (The "Prof Check"):**
