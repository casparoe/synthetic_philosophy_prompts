      *   *Bad:* "We are typing so we don't make mistakes."
      *   *Good:* "Transcription is an act of fidelity to the voice."
      *   *Avoid:* Sounding like I know more than the Prof. Use phrases like "As we've discussed in seminar" or "As scholars have noted."
      *   *Avoid:* Sounding too basic for the community. Explain the Constitutional shift clearly but not condescendingly.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Happy Douglass Day. We are transcribing. Douglass changed his mind on the Constitution. First he hated it, then he loved the text. Why? Because words matter. If we read summaries, we miss how he did that. So today, when you type, pay attention to the words. These convention people used words carefully too. Let's work.

