  *(Self-Correction Note)*: I need to make sure I don't imply Parfit thinks Branch-Line is *exactly* as good as ordinary survival. He thinks it's nearly as good, and definitely not death. The key is that the *failure of identity* in Branch-Line doesn't make it death. That's the pivot.

