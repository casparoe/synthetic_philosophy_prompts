answer: |-
  **Setting:** *A quiet, wood-paneled study, timeless and detached from the noise of the exchange. A fire burns low. JOHN LOCKE (older, gaunt, precise) sits in a leather chair. GEORGE BERKELEY (younger, brighter-eyed, leaning forward) sits opposite, a notebook resting on his knee.*

  **Berkeley:** Mr. Locke, I have spent considerable time turning over your arguments regarding the recoinage. You insisted that the value of money lies in the quantity of silver, and nothing else. That to alter the denomination without altering the metal is a deceit. But I must ask: when a man accepts a coin in the market, is he truly weighing it on a scale, or is he accepting the stamp of the Commonwealth as a token of trust?

  **Locke:** He ought to be assured of the weight, Bishop, even if he does not carry scales in his pocket. That is the very purpose of the public stamp. It is a certification of quantity. If I agree to sell you a yard of cloth for a sum designated as "one pound," and that pound is legally defined as a specific weight of silver, then to give me less silver under the same name is to shorten the yardstick. It is a fraud against the creditor.

  **Berkeley:** But consider the end of the transaction. I do not seek your silver to melt it down into candlesticks. I seek it to pass it to another for bread or labor. The silver itself is of no use to me in the exchange. It is merely a counter. A ticket that signifies I have contributed something to the common stock of industry and am now entitled to draw an equivalent from it. If the ticket circulates, and the industry exists to honor it, does the metal matter?

  **Locke:** It matters because the ticket is a promise. A promise must be anchored in something real, or it is merely air. If you issue paper, or clip the coin, and claim it holds the value of a crown, you are manipulating language. You are saying "this is five shillings" when nature and law say it is four. Money is not only a counter for present exchange; it is a measure for future contracts. If I lend you money today to be repaid in a year, and you debase the coin in the interim, you have robbed me of the purchasing power I entrusted to you.

  **Berkeley:** I grant you that robbing a creditor is unjust. But let us look deeper at what "wealth" is. You speak as if the nation's wealth sits in a vault, measured in ounces. I say wealth is the spirit of industry. It is the ploughed field, the woven wool, the built ship. Money is but the oil that makes the wheel turn. If we lack silver, must the wheel stop? Must the man who is willing to work go hungry simply because there is not enough of this yellow metal to count his labor? Why may we not issue paper tickets, backed by the land and labor of the people, to keep the wheel turning?

  **Locke:** Because the oil must not be confused with the engine. If you print tickets beyond the stock of silver that backs them, you do not create more wool or ships. You merely raise the price of them. I have seen the effects of this in the debates over the Land Bank. If you double the number of tickets but the amount of corn remains the same, the corn does not become cheaper; the tickets become worthless. You destroy the measure of value. A foot is twelve inches because we agree it is so, yes, but we cannot agree that a foot is eighteen inches tomorrow without causing chaos in every building constructed.

  **Berkeley:** But the foot is an arbitrary measure! There is no "natural" foot in the cosmos. It is a convention. So too is money. You argue that silver has an intrinsic value. I ask you: does silver feed a man? Does it clothe him? No. Its value is purely in the esteem men hold for it. That esteem is a mental construct. If the public mind agrees that a piece of paper represents a day's labor, then it does. The value is in the trust, Mr. Locke, not in the substance.

  **Locke:** You conflate *price* with *value*. The price of silver may fluctuate like corn, but its role as money is to be the stable standard against which corn is priced. If the standard itself fluctuates by the whim of the public mind, or the decree of a banker, then there is no justice in property. You say value is in the trust. I say trust is fragile. Men agree to trust silver because it is durable, divisible, and scarce. They do not trust paper because it is easily multiplied by the desperate or the corrupt. To separate money from silver is to untether the ship from its anchor. You may sail faster for a moment, but the first storm will dash you upon the rocks.

  **Berkeley:** And yet, ships do sail! In Ireland, we have seen how a lack of circulating medium stifles the very industry that creates wealth. The metal is a fetish. You worship the anchor and forget the voyage. If the State guarantees the paper, and limits the issue to the capacity of the people to produce, why is that not a firmer anchor than a mine in Peru? The silver comes from the earth by chance; the industry comes from the people by design. Why should the accident of a mine dictate the livelihood of a nation?

  **Locke:** Because the mine does not dictate the livelihood; the contract does. When two men trade, they require a common language. If the State controls the money supply, as you suggest, the State becomes a party to every contract. If the State is in debt—and when is it not?—it will be tempted to debase the currency to pay its creditors with shadows. Silver is a check against the power of the sovereign. It says to the King: "You may stamp the face on the coin, but you cannot create the substance." Your paper money hands the King the printing press.

  **Berkeley:** A potent warning, I concede. But is the remedy to chain ourselves to a metal that merchants hoard in chests, removing it from circulation? You prioritize the security of the lender over the employment of the borrower. Is it not a greater injustice for a man to be idle, for want of a "counter" to record his labor, than for a lender to worry about the fluctuation of his returns? If the nation prospers, the lender prospers, even if the coin is paper. If the nation starves for want of circulation, the lender starves amidst his gold.

  **Locke:** I prioritize justice over expediency. If we allow the value of money to be a matter of policy rather than weight, we invite endless contention. Who decides how much paper to print? You? The Bishop? The King? With silver, the decision is made by nature. We dig it from the ground. It is honest. Your system requires a level of wisdom and virtue in magistrates that history suggests they do not possess. You propose a system that would work beautifully if men were angels. I design for the men we have.

  **Berkeley:** And I propose a system that acknowledges men are capable of reason and collective agreement. You treat money as a thing, a commodity. I treat it as a relation, a understanding between citizens. If I understand that this note allows me to claim a portion of the public product, and you understand the same, the transaction is real. The "theft" you fear only happens if the trust is betrayed. But trust can be maintained by sound administration, just as the weight of silver is maintained by the mint.

  **Locke:** Sound administration is a hope. Weight is a fact. In matters of property, we must deal in facts. If you convince the world that your paper is silver, it will circulate. But when the doubt creeps in—as it always does in human affairs—the paper returns to its true nature: pulp. The silver returns to its true nature: metal. In that moment of crisis, your ticket system collapses, and the poor man who saved in paper is ruined. The poor man who saved in silver buys bread. Which conscience can bear that ruin?

  **Berkeley:** The conscience that knows the ruin was caused by a shortage of tickets, not a shortage of bread! If the granaries are full and the men are hungry because they lack the silver tokens to buy the grain, the sin is in the system, not the paper. I would rather risk the fluctuation of a paper credit than the stagnation of a people bound by the scarcity of a metal. You seek to preserve the value of the debt. I seek to preserve the vitality of the debtor.

  **Locke:** And I say that without a fixed measure, there is no debt, only confiscation. You cannot have vitality without justice. If the merchant cannot trust that the sum he earns today will hold its meaning tomorrow, he will not plant, he will not build. He will hoard. Your "ticket" becomes a hot potato, passed quickly before it cools. That is not industry, Bishop. That is speculation.

  **Berkeley:** Perhaps. Or perhaps it is the recognition that wealth is a flow, not a reservoir. You wish to build a dam of silver. I wish to keep the river moving.

  **Locke:** A river without banks is a flood.

  **Berkeley:** And a river without water is a ditch.

  *Locke leans back, steepling his fingers. Berkeley closes his notebook, resting his hand upon it.*

  **Locke:** We agree that money must serve the common good. We disagree on whether that good is best served by a chain or a sail.

  **Berkeley:** And perhaps, Mr. Locke, history will try both.

  **Locke:** Indeed. I fear the storm will tell us which held fast.

  **Berkeley:** And I pray the wind does not die while we wait for the anchor to hold.

  *They sit in silence for a moment, the fire crackling, the question of what truly backs the value of the world hanging unresolved in the smoke.*
