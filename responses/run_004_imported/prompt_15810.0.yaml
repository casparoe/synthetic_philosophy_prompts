answer: |-
  Good evening. For those of you who don't know me, I'm the brother of the bride. And for those of you who *do* know me, you know that for the past several years, our family dinners have involved significantly more 18th-century French natural philosophy than is typical for a Tuesday night.

  My sister wrote her dissertation on Émilie du Châtelet. And because she is getting married, and because about a third of you are here because you also have strong feelings about Enlightenment epistemology, I think we have to talk about du Châtelet's *Discours sur le bonheur*.

  Most wedding toasts urge the couple to seek peace, tranquility, and a calm, steady love. Essentially, they urge the couple to be Stoics. But my sister has spent years arguing that du Châtelet got it right: that a tranquil, passion-free soul isn't the goal of a happy life. In fact, it's the enemy of it. Du Châtelet argued that happiness requires strong passions. It requires what she called "illusions"—a willingness to exaggerate the importance of what we care about. To be happy, you have to believe, against all objective reason, that the thing you love matters more than anything else in the universe.

  Now, for the specialists in the room, we have to acknowledge the inconvenient wrinkle. Du Châtelet's own life was not a tidy advertisement for this theory. Her passions were volatile. Her love affairs were scandalous even by the standards of the court of Versailles, and her gambling debts were catastrophic. She lived at a volume that sometimes threatened to blow out the speakers.

  But my sister never argued that du Châtelet's life was perfect; she argued that her *diagnosis* was correct. The risk of living with strong passions is the risk of loss, of debt, of heartbreak. But the reward is actually feeling alive.

  And this brings me to the third, and most crucial, part of the theory. Du Châtelet wrote that the real skill in happiness isn't renouncing passion, nor is it keeping it frozen in its original state. The skill is knowing when a passion has to be *allowed to change form.*

  The fire that starts a relationship cannot be the same fire that sustains a fifty-year marriage. If you try to keep the passion intact, it burns out. If you renounce it, you freeze. But if you let it change form, it becomes the hearth that warms the house.

  To [Partner's Name]: My sister knows better than anyone that loving someone is an act of beautiful illusion. It is deciding that this person, objectively one of billions, is actually the most important thing in the world. She knows the risks of passion. But she also knows that the only way to be truly happy is to wager on it.

  So, to the bride and groom: May you never seek a tranquil, passion-free life. May you have the courage to exaggerate the importance of this love. And may you have the wisdom to let that passion change form, again and again, for as long as you live.

  To the happy couple.
