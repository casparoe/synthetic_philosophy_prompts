  3.  **Address Question 1: Is he flattening Pascal?**
      *   *Pascal's Actual View:* In *Pensées* (specifically fragments like "Justice without force is powerless; force without justice is tyrannical"), Pascal isn't necessarily *endorsing* this state of affairs as "fine." He is a Christian apologist. He sees human institutions as fallen. He acknowledges the *necessity* of force to maintain order because of human sin/corruption, but he doesn't equate might with right in a moral sense. He points out the *contradiction* to lead the reader toward God/true justice (which is not of this world).
