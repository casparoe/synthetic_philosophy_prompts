      *   McKinsey says: If I know I'm holding the prop, and I know the rental agreement implies the rental store exists, I know the store exists without leaving the theater.
      *   *Why it hurts:* It collapses the distinction between *conceptual truth* (true by definition) and *empirical truth* (true by observation). "Water is H2O" is supposed to be a discovery of science, not logic.

  4.  **Analyze the Escape Routes (and their costs):**
