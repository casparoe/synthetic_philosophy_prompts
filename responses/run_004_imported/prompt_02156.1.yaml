      *   *Check:* Is the Kepler connection accurate? *Correction:* Yes, Kepler's *Astronomia Nova* (1609) proposed the *anima motrix*. Galileo knew Kepler's work but was often critical of Kepler's elliptical orbits and mysticism. However, on the Sun as mover, they align.
      *   *Check:* User mentioned optics background. *Correction:* Maybe make a small nod to how Galileo's telescopic discoveries (sunspots) underpin his confidence in solar rotation.
