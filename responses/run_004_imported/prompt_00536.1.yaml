answer: |-
  You have hit on exactly the pressure point that threatens to collapse van Inwagen's entire project. Your intuition is correct: van Inwagen proposed "Life" as a solution to the vagueness of composition, but because "Life" is itself vague, he hasn't solved the problem—he has merely relocated it. And once you relocate it, the structural integrity of his view fails, sliding inevitably toward Compositional Nihilism.

  Here is the step-by-step argument for why van Inwagen's Organicism is unstable and why the logic of his own constraints pushes you to Nihilism.

  ### Step 1: Identify Van Inwagen's True Motivation
  To see why the view fails, we first have to be clear on *why* he adopted it. Van Inwagen isn't just making a biological claim; he is making a metaphysical one about **precision**.

  He rejects Universalism (everything composes something) and common-sense views (chairs exist) because they rely on vague predicates like "touching," "fastened," or "functioning as a chair." For van Inwagen, **existence cannot be vague.** There cannot be a world where it is neither true nor false that an object exists. That would violate the Law of Excluded Middle. He needs a "joint in nature," a sharp, binary switch that turns composition on or off. He chose "Life" because he believed biological life is a categorical, scientific reality, unlike the arbitrary human category of "furniture."

  **The Goal:** A sharp boundary for existence.
  **The Tool:** The predicate "constitutes a life."

  ### Step 2: Demonstrate that "Life" is Not a Sharp Boundary
  Your examples (viruses, prions, conception) are the wedge here. We need to show that "catching a life" is not a binary switch, but a spectrum.

  Consider the evolutionary timeline. At what exact generation did non-living self-replicating chemistry become "living" metabolism? There is no single mutation where the "life switch" flipped. It was a gradual continuum of increasing complexity.
  Consider the human boundary cases you mentioned:
  *   **The Zygote:** A fertilized egg can split into twins (one life becoming two) or fuse (two becoming one). If composition depends on "a life," does the object cease to exist and two new ones pop into being? Or did two objects merge? The "life" condition is indeterminate here.
  *   **Viruses:** They replicate and evolve but lack independent metabolism. Are they simples arranged virus-wise, or a composite organism? Biology doesn't agree, which means the metaphysical condition is unresolved.
  *   **Brain Death vs. Cardiac Life:** A body can be biologically functioning (cells living, heart beating via machine) while the "organism as a whole" is arguably dead.

  If the condition for composition is $C$ (where $C$ = "the activities of the simples constitute a life"), and $C$ admits of borderline cases, then **composition admits of borderline cases.**

  ### Step 3: The Consequence is "Ontic Vagueness"
  This is the critical metaphysical move. If van Inwagen is right, then in a borderline case of life (say, a virus or a zygote about to split), it is **indeterminate whether a composite object exists.**

  This creates *ontic vagueness* (vagueness in the world itself), not just *semantic vagueness* (vagueness in our words).
  *   **Semantic Vagueness:** "I don't know if we should call this a 'chair'." (The object exists, the label is fuzzy).
  *   **Ontic Vagueness:** "It is not true that an object exists here, and not true that no object exists here." (Existence itself is fuzzy).

  Van Inwagen explicitly rejects ontic vagueness. He argues that reality is precise. But by tying existence to a biological process that is inherently gradual and fuzzy, he imports ontic vagueness right into the heart of his ontology. He wanted to save the world from fuzzy objects, but he ended up making *organisms* into fuzzy objects.

  ### Step 4: The Dilemma Forces a Choice
  Once we accept that "Life" is vague, van Inwagen faces a dilemma. He must choose between two options, and both lead away from Organicism.

  **Option A: Accept Vague Existence.**
  If he admits that existence can be vague (i.e., "It's kinda true that this organism exists"), he loses his main argument against Universalism. Why is it okay for *organisms* to have vague existence conditions, but not *chairs*? If we tolerate vagueness for life, we should tolerate it for artifacts. If we tolerate vagueness generally, the motivation for restricting composition to *only* life evaporates. We might as well say chairs exist too. This collapses his view into a form of Universalism or Common-Sense Realism, abandoning his strict "Life only" constraint.

  **Option B: Demand Precision.**
  If he insists that existence *must* be precise (which is his original stance), then "Life" cannot be the condition for composition, because "Life" is not precise. We need a condition that is never vague.
  *   Is "contact" precise? No (quantum fields).
  *   Is "bonding" precise? No (fading forces).
  *   Is "Life" precise? No (evolutionary/biological spectra).

  There is arguably *no* relation between particles that is perfectly sharp enough to ground the existence of a composite object without risking borderline cases.

  ### Step 5: The Slide to Nihilism
  If Option B is chosen (Existence must be precise), and no relation between particles is precise enough to avoid vagueness, there is only one safe metaphysical position left: **Compositional Nihilism.**

  Nihilism states: *No xs ever compose a y.*
  Why does this solve the problem?
  1.  **It eliminates the vague predicate.** We no longer need to ask "Do these particles constitute a life?" We simply answer "No, they never compose anything."
  2.  **It preserves precision.** Simples (fundamental particles) exist. They do not rely on composition conditions. There is no vagueness about whether a fundamental particle exists (in this framework).
  3.  **It avoids Ontic Vagueness.** There are no composite objects to have vague boundaries. There are just simples arranged *organism-wise* or simples arranged *chair-wise*.

  If van Inwagen's primary constraint is "Avoid vague existence," and "Life" fails to avoid vague existence, then the only view that successfully avoids vague existence is the one that denies composite existence altogether.

  ### Conclusion
  Van Inwagen tried to build a middle ground between the absurdity of "everything exists" (Universalism) and the austerity of "nothing exists" (Nihilism). He used "Life" as the pillar to hold up that middle ground.

  But your insight reveals that the pillar is rotten. Because "Life" has fuzzy boundaries, using it as the criterion for existence makes *existence* fuzzy. Since van Inwagen's entire system is built on the demand for metaphysical precision, he cannot tolerate fuzzy existence.

  Therefore, to remain consistent with his own demand for precision, he must abandon "Life" as a compositional criterion. And once you remove "Life" as the exception, the logic of precision demands that you remove *all* composition. You are left with a world of simples. Van Inwagen wanted to save the organism, but by insisting on a precision that biology cannot provide, he inadvertently makes the case that only the particles are real.
