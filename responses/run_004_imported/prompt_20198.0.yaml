      *   **The Debate:** Dana (Data Scientist) vs. Marcus (Backend Eng/Stats Hobbyist).
      *   **The Task:** Evaluate 4 specific points made in their Slack argument. Provide a score (-2 to 2) for each in a JSON block, then explain the reasoning. Also, identify what *both* are missing.
