      *   *Marcus on Point 2:* He says "you could leave the dashboard open forever." This is the "Gambler's Ruin" scenario. If there is no effect, the posterior probability will fluctuate. If you wait for it to hit 97%, you will eventually ship noise. This is correct.
      *   *Dana on Point 3:* She says 97% on Day 4 is "weak evidence." Actually, in many Bayesian setups, early data is volatile. But 97% is usually considered strong. Her defense is weak here.
      *   *Marcus on Point 4:* "Rebranding." This is a strong claim. Is it true? Yes, in the context of Growth Teams who care about False Discovery Rates. If you don't control for peeking, you haven't solved the multiple comparisons problem.

      *   *Adjustment:* I should ensure I don't villainize Dana. She is the DS, she knows the math. But she might be applying "textbook Bayesianism" to a "business decision problem." Marcus is applying "engineering reliability" logic. Both are valid perspectives, but Marcus is more right about the *outcome* (the failed launch).

