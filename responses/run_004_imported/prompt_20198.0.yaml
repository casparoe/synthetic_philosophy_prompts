          *   Point 3: Dana is dodging. Saying "false positives happen" ignores that the *rate* is inflated by the behavior. Calling 97% "weak evidence" is weird unless the prior was strong against it. 0 is fair.
          *   Point 4: Marcus hits the nail on the head regarding the "marketing vs. reality" of Bayesian testing in business. +2.

      *   **Refining the "Missing" Section:**
