          *   Need to mention Priors. If they used a "non-informative" prior, their Bayesian test behaves almost exactly like a Frequentist one, inheriting the peeking problems.
          *   Need to mention "Expected Loss" or decision thresholds.

  4.  **Final Review against Constraints:**
      *   JSON block first? Yes.
