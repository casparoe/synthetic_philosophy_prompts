answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late afternoon. Rain taps against the window. **Elena**, a professor of moral philosophy with a neo-Aristotelian bent, sits across from **Marcus**, a philosopher of mind and action who specializes in moral psychology and empirical ethics. Both have coffee.*

  **Marcus:** You know, Elena, reading your recent paper on moral cultivation reminded me of why I love talking to you, even if I think your metaphysical commitments are fighting a losing battle against the data. You speak of character as a unified architecture, something we build brick by brick until it stands firm against the storm. But the data suggests the storm gets in regardless of the bricks.

  **Elena:** (Smiling) And you speak of data as if it were a verdict rather than a map. I assume you're referring to the situationist literature? Doris, Harman, the usual suspects?

  **Marcus:** Precisely. It's the consistency problem. Classical virtue ethics relies on what John Doris calls the "Global Trait Assumption." It assumes that if I possess the virtue of honesty, I will act honestly across a wide range of relevantly different situations—whether I'm filing taxes, returning a lost wallet, or admitting a mistake at work. But the empirical literature, from the Hartshorne and May studies in the 1920s to Darley and Batson's Good Samaritan experiment, suggests this cross-situational consistency is largely a fiction.

  **Elena:** The Good Samaritan study is the favorite hammer, isn't it? Seminary students rushing to give a talk on the parable, yet stepping over a slumped figure because they were told they were late.

  **Marcus:** Exactly. The situational variable—being in a hurry—overwhelmed the dispositional variable—their religious training and presumed character. If a virtue is supposed to be a robust disposition to act and feel in certain ways, and it dissolves under the pressure of a tight schedule, is it really a virtue? Or is it just a label we apply post-hoc to behavior that happened to align with our norms?

  **Elena:** I grant you that the "Global Trait" as a description of *actual* human behavior in the general population is empirically suspect. Most people are not virtuous, Marcus. Aristotle knew this. He called them *akratic* or even vicious. The fact that the seminarians failed doesn't prove virtues don't exist; it proves *virtuous people* are rare.

  **Marcus:** But that's a retreat to an ideal theory that loses its grip on moral psychology. If virtue ethics is supposed to guide moral development, it needs a mechanism. If I tell a student, "Cultivate honesty so you become an honest person," I am implying that there is a stable psychological structure they are building. If psychology shows that structure is fragmented—that you might be honest in professional settings but dishonest in social ones—then telling them to "be honest" is like telling a cloud to "be square." You're asking for stability where the material is inherently fluid.

  **Elena:** I think you're conflating the *goal* of virtue ethics with the *starting point*. Let's use a biological analogy, since I know you appreciate precision there. You wouldn't say an immune system doesn't exist because it fails under extreme immunosuppression or novel pathogens. You would say the system is complex and context-sensitive.

  **Marcus:** But an immune system is a physiological mechanism with identifiable pathways. We can trace the T-cells. What is the pathway for "courage" that survives sleep deprivation, peer pressure, and financial stress simultaneously? The situationists aren't saying traits don't exist at all. We're saying they are *local*. I might have a "honesty-among-friends" trait and a "honesty-in-court" trait, but they aren't powered by a single engine called Honesty.

  **Elena:** This is where I think the situationist critique is invaluable, but its conclusion is too hasty. I am willing to concede that the folk-psychological view of character—as a monolithic, unshakeable fortress—is wrong. But virtue ethics doesn't require that traits be mechanical switches that trigger automatically. It requires them to be sensitive to *reasons*.

  **Marcus:** Explain.

  **Elena:** In the Good Samaritan study, the students didn't just ignore the victim randomly. They were acting on a competing reason: the obligation to be on time for their assignment. The situation didn't bypass their agency; it presented a conflicting demand. A fully virtuous agent isn't someone who ignores the time; it's someone who correctly weights the moral urgency of the victim against the professional urgency of the lecture. The failure of the seminarians shows they lacked *phronesis*—practical wisdom. They misweighted the reasons.

  **Marcus:** But that sounds like you're redefining virtue to make it unfalsifiable. If they fail, they lacked wisdom. If they succeed, they had wisdom. Where is the predictive power? If I want to know if someone will help a stranger, asking "Are they virtuous?" is less predictive than asking "Are they in a hurry?"

  **Elena:** Predictive power is a scientific goal, Marcus, not necessarily a moral one. Ethics is normative, not just descriptive. However, I will meet you on the empirical ground. If we accept your point that character is fragmented, then moral education cannot be about "installing" global traits. It must be about *integration*.

  **Marcus:** Integration?

  **Elena:** Yes. The situationist data reveals that our moral psychology is siloed. We act one way at church, another at work, another when anonymous online. The project of virtue ethics, informed by your data, becomes the project of breaking down those silos. It's the work of making the "honesty-at-work" trait bleed into the "honesty-at-home" trait. The instability you point out isn't proof that virtue is impossible; it's a diagnosis of the human condition that virtue ethics aims to cure.

  **Marcus:** I like that. It moves the debate from ontology to therapy. But here is my worry: If the situational determinants are as powerful as Milgram's obedience studies suggest—where ordinary people administer lethal shocks because an authority figure tells them to—is "integration" enough? The pressure of the situation isn't just a competing reason; it can bypass deliberation entirely. It triggers heuristic processing.

  **Elena:** I acknowledge the power of heuristics. But notice what happened in the variations of the Milgram experiment. When the authority figure was not in the room, or when peers rebelled, obedience dropped precipitously. The situation includes *social architecture*. Virtue ethics has always emphasized the importance of the *polis*, of community and habituation. If we know that isolation and authority gradients crush moral agency, then cultivating virtue requires constructing environments that support it.

  **Marcus:** So you're conceding that character isn't internal?

  **Elena:** I'm saying character is relational. It's an interaction between the agent's dispositions and the environment's affordances. If virtue ethics assumes the agent is a孤岛 (island) unaffected by context, it is indeed empirically bankrupt. But if it views character as a dynamic stability maintained through practice and supported by social structures, it survives.

  **Marcus:** Okay, let's press that. If character is dynamic and context-dependent, do we still need the language of "virtues"? Doris suggests we should talk about "local traits" or simply focus on situation management. Why hold onto "Courage" or "Honesty" as if they are entities within the person?

  **Elena:** Because we need a target for the integration I mentioned. If I only aim for "local honesty," I give myself permission to be dishonest where I think I can get away with it. The concept of a global virtue serves a regulatory function. It posits a unity of the self that we must strive for, even if we rarely achieve it. It's a regulative ideal.

  **Marcus:** But isn't that dangerous? If we insist on a unity that psychology says is fragile, do we not invite moral hypocrisy? We claim to be "honest people" while our behavior is dictated by situational cues we refuse to acknowledge. Perhaps it's more morally honest to admit, "I am susceptible to authority pressure," and design systems to check me, rather than trusting my "character."

  **Elena:** I agree that trusting character without checking situations is foolish. But focusing *only* on situation management risks losing the agent. If I am merely a bundle of local responses to stimuli, where is the responsibility? Where is the *I* that chooses to restructure the environment? To cultivate virtue is to take responsibility for how you will react when the situation turns hostile. It is the commitment to become the kind of person for whom the situational pressure is less determinative.

  **Marcus:** So you see the empirical findings not as a refutation, but as a map of the obstacles?

  **Elena:** Exactly. In my old life, before philosophy, I studied molecular pathways. We used to think genes were blueprints. Now we know they are more like switches influenced by epigenetic factors. The environment turns the genes on or off. Does that mean the genes don't exist? No. It means their expression is contingent. Character traits are like those genetic potentials. They exist as capacities, but their expression is heavily regulated by the environment.

  **Marcus:** That's a compelling analogy. It suggests that the debate isn't "Traits vs. Situations," but rather "How Traits Interact with Situations." But I would push back on one point. In biology, if a gene is silenced 90% of the time by environmental factors, we might question its functional significance. If "honesty" is silenced 90% of the time by situational stress, is it fair to call it a trait of the agent?

  **Elena:** It depends on whether you view the trait as a *current state* or a *developmental trajectory*. For the sage—the *phronimos*—the trait is robust. For the learner, it is fragile. Virtue ethics is primarily a theory of development. The empirical data shows us that the default human setting is fragmentation. Virtue ethics provides the normative framework to overcome that default.

  **Marcus:** I can accept that, provided the virtue ethicist stops claiming that most adults possess robust virtues. We must admit most of us are works in progress, highly susceptible to situational noise.

  **Elena:** I can accept that, provided the situationist admits that recognizing the noise doesn't eliminate the signal. We can improve our signal-to-noise ratio through habituation. We can learn to recognize the "in a hurry" cue and deliberately override it. That act of overriding *is* the exercise of virtue.

  **Marcus:** So, we meet in the middle? Virtue ethics must abandon the claim that character is magically resistant to context. It must become empirically informed, acknowledging fragmentation and the power of heuristics.

  **Elena:** And situationism must acknowledge that describing the fragmentation doesn't solve the normative problem. We still need to decide how we *ought* to act, and "act according to the situation" is empty without a conception of the good. We need the concept of the virtuous agent to tell us *which* situational cues to honor and which to resist.

  **Marcus:** Agreed. The data tells us we are not as good as we think we are. Virtue ethics tells us what it would look like to be better.

  **Elena:** And perhaps, Marcus, that tension between the empirical reality and the normative ideal is exactly where the moral life happens. If we were naturally consistent, virtue wouldn't be a struggle. It wouldn't be a virtue; it would just be physics.

  **Marcus:** (Laughs) Well, let's not go that far. But I suppose I can live with a virtue ethics that is humble enough to read a psychology journal.

  **Elena:** And I can live with a moral psychology that recognizes it needs a north star, even if the compass is shaky.

  **Marcus:** Cheers to that.

  *(They raise their coffee cups. The rain continues to tap against the glass, steady and situational, while they sit, stable in their conversation.)*
