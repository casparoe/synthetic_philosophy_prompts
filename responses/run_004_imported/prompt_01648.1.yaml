          *   Empirical Counter-evidence: Hartshorne & May (honesty), Darley & Batson (Good Samaritan), Milgram (obedience).
          *   Fragmentation of Character: We act differently in different contexts.
          *   Conclusion: Virtue ethics is empirically inadequate.
      *   *Virtue Ethicist (Elena):*
