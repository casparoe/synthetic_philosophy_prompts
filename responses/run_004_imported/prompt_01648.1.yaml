          *   Fragmentation vs. Integration: Acknowledges fragmentation but argues for *cultivation* as the process of overcoming it.
          *   Reinterpreting Traits: Traits aren't mechanical switches; they are sensitive to reasons.
          *   The "Local Trait" compromise: Maybe virtues are more context-specific, but still real.
          *   Normative Force: Even if rare, the *concept* of virtue is necessary for moral improvement.

  4.  **Drafting - Section by Section:**

