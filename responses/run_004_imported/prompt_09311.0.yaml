  *(Refining the "40%" context)*: Actually, many direct-to-consumer tests compare you to the *average* person. If the average person's lifetime risk is ~40%, and the test says 40%, the user might be genetically average. If the test says 40% and the average is 30%, they are high risk. I don't know the reference. I should focus on the *modifiability* regardless of the baseline.

  *(Key Insight)*: The User's error is treating the genetic risk score as a *total* probability model. It is a *partial* probability model. The Friend's error is thinking they can quantify the reduction without data. The truth lies in understanding the model's limitations.

