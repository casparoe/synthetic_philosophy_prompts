answer: |-
  Good evening, everyone. For those who don't know me, I'm the sibling of the bride. I've been asked to say a few words about [Bride] and [Groom], which is a distinct honor, though I must admit it comes with a unique set of constraints.

  We all know [Bride] and [Groom] have a very specific dynamic. If you've ever joined them for breakfast, you know that their idea of foreplay involves debating whether objective moral facts exist. [Groom], a committed realist, believes that values are part of the fabric of the universe. [Bride], as many of you know, holds that moral statements aim to describe facts that simply aren't there. They have spent years negotiating a life together across that metaphysical divide.

  Watching them, one might be tempted to say that their partnership proves that love is objectively "good," or that they "deserve" each other in some cosmic sense. But I know this room. I know that to claim this union reflects objective moral truth would be to posit the existence of queer entities, and I have no desire to invoke the argument from queerness before the cake is cut.

  So, I will stick to what I can observe. I see two people who have chosen, consistently and deliberately, to prioritize each other's flourishing. I see a partnership where conflicts are met with patience, where vulnerabilities are met with care, and where the daily work of living together is treated with seriousness and wit. I see that when they are together, they are happier, sharper, and more generous than they are apart. These are not moral facts; they are psychological and behavioral ones. And they are robust enough for me.

  [Bride] has made it clear that she will not accept a toast based on a fiction. She doesn't want us to pretend values exist if they don't. She wants us to acknowledge that meaning isn't found; it is made. And looking at the two of you, I see a meaning that you have constructed together with immense care. You have not discovered a pre-existing script for this marriage; you are writing it. You are not following a categorical imperative; you are following a commitment you have authored.

  To the family and friends here who just want a normal toast: I hope you hear in this that their love is no less real for being human-made. If anything, it is more impressive. It requires no cosmic backup. It stands on the strength of their own will.

  [Bride], [Groom]: I am not glad that the universe brought you together, because the universe doesn't care. I am glad that you brought yourselves together. I am glad that you continue to choose this, every day.

  So, please raise your glasses.

  To the commitments you make, and the life you build.
