answer: |-
  The morning light hits the kitchen table at a specific angle, bisecting the wood grain. I've lived here for thirty years since the procedure, and I've learned to keep the important things on the right side of the room. That way, my right eye sees them, and the language center—the part of me that says *I*—knows they exist.

  People ask if it feels like being two people. It doesn't. It feels like being one person who sometimes forgets how he arrived at the conclusion. My left hand is competent, quiet, and occasionally opinionated. We have an arrangement. I do the talking; it does the lifting. We don't interfere.

  Today was supposed to be simple. Grocery run, dry cleaning, come home. I was standing at the counter, packing a bag for the market. I reached for the reusable totes with my right hand, stacking them neatly. Then, without my conscious instruction, my left hand slipped a second set of keys into the side pocket.

  I paused. I don't carry spare keys. I've never carried spare keys.

  My mind, ever the eager press secretary, instantly issued a statement: *You must have been worried about locking yourself out again.* It felt true. It felt like a memory. I could almost recall the anxiety of last week, the jiggling of the lock. I nodded to myself, satisfied. *Reason found.*

  But then I looked at the keys. They were brass, old-fashioned. My current keys are silver electronic fobs. These belonged to the old house. The one before the surgery. The one where Sarah still lived.

  I stared at the brass metal. My left hand rested on the counter, fingers splayed. It wasn't trembling. It was waiting.

  "Okay," I said aloud. My voice sounded normal. "Why those?"

  Silence. Just the hum of the refrigerator.

  I tried to rationalize it again. *Sentimental value. You wanted a reminder.* But I don't do sentimentality in the morning. I do efficiency. The story was fraying. The gap between the action and the explanation was widening, and that specific kind of vertigo started to creep in—the feeling that the narrator and the protagonist are not the same entity.

  I reached out with my right hand to remove the keys. As my fingers brushed the brass, my left hand shifted. It wasn't a grab. It was a tap. Two sharp raps of the index finger against the countertop. *Tap. Tap.*

  We developed that years ago. During the early rehabilitation, when the confusion was worse, I'd learned to recognize the rhythm. It wasn't a spasm. It was a punctuation mark. *Pay attention.*

  I froze. If I accepted the tap as communication, I had to accept a sender. If there was a sender distinct from the voice in my head arguing about efficiency and sentimentality, then Priya's theory holds water: there are two of us in here, sharing skin, trading off the steering wheel. But if I accepted the tap as a tic, a misfiring neuron from a brain stitched together with scar tissue, then I am whole, just damaged.

  I looked at the keys again. Why brass? Sarah used to hide the spare under the mat. She hated the electronic locks.

  *You're thinking about her because you passed the old neighborhood yesterday,* my mind supplied. Smooth. Plausible.

  Did I? I traced my route back. I took the highway. I didn't pass the neighborhood. The story was a fabrication, stitched together after the fact to cover the embarrassment of not knowing my own motives. It's terrifying, really. How much of your life is just the press release written after the event? How many of my convictions, my sudden turns, my "instincts," are just my left hemisphere scrambling to explain what the right side already decided?

  My left hand moved again. It slid the keys deeper into the pocket, securing them. It wasn't fighting me. It was assisting. It wanted me to have them.

  I took a breath. I could dump the keys. I could throw them in the drawer and assert dominance over this body. I could prove I am the captain. Or I could leave them, acknowledging that the ship steers itself sometimes.

  I thought about the snow scene experiment I read about once. A patient sees snow with the right eye, points to a shovel with the left hand. When asked why, the mouth says, "You need a shovel to clean out the chicken coop." The mouth lies to protect the illusion of unity. The mouth refuses to admit it doesn't know.

  I am the mouth.

  I zipped the bag closed. The brass keys clinked softly against the reusable totes.

  "Fine," I said to the kitchen. "We're taking them."

  My left hand relaxed, the tension draining from the wrist. It felt like a sigh.

  I walked to the door, slipping my shoes on. As I reached for the handle, I caught my reflection in the hallway mirror. Just one man. Gray hair, tired eyes, a coat buttoned slightly askew. I looked unified. I looked singular.

  I stepped out into the morning air. The wind was cold. I didn't decide to pull my collar up; my left hand did it for me, smooth and automatic. I didn't thank it. I didn't argue. I just walked toward the car, carrying the bag, carrying the keys, carrying the story that I chose to bring them.

  Whether I actually chose to, or whether I'm just the one who has to explain it later, remains the only mystery that matters. I started the engine. The radio clicked on. I left it there. We listened to the silence together, and for now, that was enough.
