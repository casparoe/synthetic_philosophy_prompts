answer: |-
  This is a fascinating social puzzle that cuts right to the heart of how human relationships function. You have stumbled upon a classic philosophical distinction between **brute facts** and **social facts**, and your friend group's deadlock reveals something important about how we navigate morality.

  To answer your core question directly: **No, there is no objective "fact of the matter" regarding their status, but the dispute is not empty.**

  Here is why the disagreement exists, why removing the words didn't help, and why the label feels so heavy.

  ### 1. Brute Facts vs. Social Facts
  In philosophy (specifically the work of John Searle), there is a difference between *brute facts* and *social facts*.
  *   **Brute Facts:** These exist independently of human opinion. (e.g., "Jake and his ex had sex on Tuesday," "They said the words 'we should break up' three weeks ago.") Everyone in your group agrees on these.
  *   **Social Facts:** These exist only because we collectively agree they exist. (e.g., "Money," "Marriage," "Citizenship," "Relationship Status.")

  A relationship is a **social fact**. It is not a physical object you can measure; it is a shared reality constructed by mutual agreement and recognition. Because it is constructed, there is no "true" state hidden underneath. The state *is* the agreement.

  The problem is that Jake and his ex have created two conflicting social facts simultaneously:
  1.  **The Declarative Fact:** They verbally agreed to end the contract (The Breakup Talk).
  2.  **The Performative Fact:** They are continuing to enact the rituals of the contract (Hooking up, saying "I love you").

  Your friend group is split because half of them prioritize the **Declarative** definition of a relationship (Status is what you *say*), and the other half prioritize the **Performative** definition (Status is what you *do*). Neither side is objectively "right" because relationships don't have an objective physics.

  ### 2. Why "Tabooing" the Words Didn't Work
  You mentioned that even when you forbade the words "together" or "broken up," people still split 50/50 on the verdict. This is because the words were never the problem; they were just the **output** of the problem.

  When you ask, "Is it shady to ask someone else out?" you are not asking for a taxonomic classification. You are asking a **moral risk assessment**.
  *   **Group A (The Declarativists)** hears: "He has a verbal agreement that he is free. To tell him he isn't is to hold him to a contract he already exited."
  *   **Group B (The Performativists)** hears: "He is engaging in intimate behaviors that create an expectation of exclusivity. To pursue another is to betray the implicit trust of the current partner."

  Removing the label "cheating" doesn't remove the concept of *betrayal*. Removing the label "single" doesn't remove the concept of *freedom*. Your friends are still applying their internal moral frameworks to the raw data; they just have to do the calculation manually instead of using the linguistic shortcut.

  ### 3. Why the Label Feels Like It "Does All the Work"
  You asked why it feels like so much rides on the label if the facts are agreed upon. This is because social labels are not just descriptions; they are **instructions for behavior.**

  In linguistics, this is called a **speech act**. When we label a relationship "official," we are activating a specific set of rules (exclusivity, priority, emotional safety). When we label it "broken," we activate a different set (freedom, detachment, availability).

  The dispute feels heavy because the label determines **who gets hurt.**
  *   If the label is **"Single"**: The ex-girlfriend risks feeling used or discarded if Jake moves on. The new girl is safe.
  *   If the label is **"Together"**: The new girl risks being the "rebound" or the "other woman." The ex-girlfriend is safe.

  The "verdict" your friend group is trying to reach isn't about truth; it's about **harm mitigation.** They are arguing over whose expectations deserve protection: the ex's expectation of continuity (based on behavior) or Jake's expectation of liberty (based on the verbal agreement).

  ### 4. Is the Dispute Empty?
  The dispute is **ontologically empty** (there is no hidden truth to find), but it is **socially real**.

  Think of it like a resignation from a job.
  *   **Scenario:** An employee tells the boss, "I quit." The boss says, "Okay." But for the next three weeks, the employee keeps coming in, doing work, attending meetings, and taking a paycheck. Then the employee applies for a job at a competitor.
  *   **HR View:** They quit. They are free to go. (Declarative)
  *   **Co-worker View:** They are still working here. Applying elsewhere is disloyal. (Performative)

  Is the employee "employed"? There is no fact of the matter. There is only a messy ambiguity that creates liability.

  ### The Verdict for Jake
  The fact that your group is split 50/50 is the most important data point of all. It proves that **the situation is objectively ambiguous.**

  If half of reasonable observers see it as cheating, then proceeding carries a high risk of moral fallout. The "shadiness" doesn't come from the status; it comes from the **ambiguity.**

  Jake wants to ask someone else out. To do so without being "shady," he cannot rely on his friends to define his reality. He has to close the gap between the Declarative and the Performative.
  1.  **If he wants to be single:** He must stop the performative acts (no more hooking up, no more "I love you") to align with the verbal agreement.
  2.  **If he wants to date the new person:** He must clarify with the ex that the previous behaviors did not constitute a reconciliation.

  **Summary:**
  There is no fact of the matter because relationships are social constructs, not physical objects. The dispute feels heavy because the label dictates moral permission and predicts who will get hurt. Your friend group isn't arguing about what *happened*; they are arguing about which **social contract** takes precedence when words and actions contradict.

  Jake is currently living in a loophole. Loopholes might be technically defensible, but they are almost always "shady."
