          *   Relationships aren't physical objects; they are intersubjective agreements.
          *   Analogy: Is a glass half-empty or half-full? No, that's perspective. Better analogy: Is a treaty broken if soldiers skirmish but leaders say peace?
          *   Conclusion: No objective truth, only competing definitions.

      *   **Section 2: The Two Competing Frameworks (Why the split?)**
          *   *The Declarative Model:* Status is what you say it is. (Supports Group A). Breakup talk = Single.
          *   *The Functional Model:* Status is what you do. (Supports Group B). Acting like a couple = Couple.
          *   Explain why both make sense intuitively.

      *   **Section 3: Why the Label Matters (The "Empty" Dispute isn't Empty)**
