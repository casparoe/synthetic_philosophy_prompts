      *   Me: Counter (Escape the dynamic without accepting a low-ball).

      Actually, looking closer at the friend's argument: "both of us have reason to keep escalating well past the point where, in hindsight, stopping would have made more sense." The friend is warning *against* escalation. The colleague uses sunk cost logic to say "stop." I agree with stopping the *escalation* (trial) but disagree that $500k is the right stop price.
      So, Counter is the perfect middle ground. It stops the trial escalation but negotiates a better exit price based on the supplier's parallel fear.

      *Wait, check the math on the friend's "locks in a $3 million loss".*
      Spent $3.5M. Recover $0.5M. Net -$3.0M. Correct.
      If we go to trial and win: Recover $6M. Spend $1.5M more. Total Spend $5M. Net +$1M.
