      *   Trial Loss: $0. Net from today: -$1.5M. Net Total: -$5M.
      *   Break-even probability (from today): $1.5M cost / $6M award = 25%.
      *   If counsel thinks we have >25% chance, $500k is a bad deal financially (ignoring sunk costs).
      *   Counter-offer logic: We need to offer them a number that is less than their Expected Loss at trial. If they think they have a 75% chance of losing (mirror of our 25% win), their EV loss is $4.5M + legal fees. They should be willing to pay up to that.
      *   Let's suggest a counter of **$2.75 million**. It's substantial enough to show we aren't desperate, but less than the $6M risk.

