          *   Cost to Trial: $1.5M more + 8 months.
          *   Potential Win: $6M.
          *   Potential Loss: $0 (plus the $1.5M cost).
          *   Settlement Offer: $500k (from supplier to us? Or us to them? *Correction:* The prompt says "supplier has just offered to settle for $500,000." Usually, in a breach-of-contract suit *against* a supplier, the plaintiff (us) is seeking damages. If the supplier offers to settle *for* $500k, does that mean they pay us $500k? Or do we pay them $500k to go away?
          *   *Context Clue:* "Win $6 million or lose entirely." This implies we are the plaintiff seeking $6M.
          *   *Context Clue:* "Stopping now locks in a $3 million loss for us." This math is tricky. If we spent $3.5M and settle for $500k (receipt), net is -$3M. If we settle by *paying* $500k, net is -$4M. The prompt says "locks in a $3 million loss." $3.5M spent - $0.5M received = $3M net loss. So, the settlement is the supplier paying us $500k.
          *   *Wait, re-reading:* "supplier has just offered to settle for $500,000." In legal parlance, "settle for X" usually means the defendant pays the plaintiff X. Given the "win $6 million" context, this makes sense.
          *   *Wait, re-reading the friend's argument:* "stopping now locks in a $3 million loss for us." ($3.5M spent - $0.5M recovery = $3M loss). "Continuing offers a chance of coming out ahead." (Win $6M - $1.5M new cost = $4.5M net gain from this point, or $1M net gain overall vs $3.5M spent).
          *   *Wait, the Dollar Auction analogy:* The friend argues *both* sides have reason to keep escalating. This implies the supplier has also spent money defending. If they settle for $500k, they pay $500k. If they go to trial, they might pay $6M + their own legal fees.
      *   **The Conflict:**
