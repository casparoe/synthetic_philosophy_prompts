answer: |-
  # The Mercury Paradox: Why Old Evidence Breaks the Bayesian Dream

  In the ecosystem of online rationality, Bayes' theorem is not merely a tool; it is a shibboleth. To be rational is to be Bayesian. The doctrine is seductive in its clarity: rational belief revision *just is* conditionalization. You have a prior, you encounter evidence, you update. If your credences do not move according to the likelihood ratio, you are, by definition, irrational. This framework is often bolstered by historical war stories, chief among them the triumph of Einstein's General Relativity (GR). The narrative is clean: Newtonian physics faltered at Mercury's perihelion; Einstein arrived; GR predicted the anomaly exactly; science progressed.

  But as you have discovered, this favorite anecdote conceals a bomb. In the philosophy of science, the Mercury case is the textbook illustration of the "Problem of Old Evidence" (POE). If the evidence (Mercury's orbit) was known with certainty before the theory (GR) existed, then on strict Bayesian bookkeeping, that evidence cannot confirm the theory. The probability of the evidence was already 1. Conditionalizing on a certainty changes nothing. The very example used to evangelize Bayesianism is, formally speaking, a case where Bayesian confirmation fails to occur.

  This is not a mere technicality. It strikes at the normative heart of the Bayesian project. If Bayesianism cannot explain why Einstein was rational to increase his confidence in GR based on Mercury, it fails as a complete theory of scientific rationality. To resolve this, we must examine the proposed fixes, weigh their costs, and accept an uncomfortable conclusion: while Bayesian conditionalization is a necessary constraint on coherent belief, the Problem of Old Evidence proves that credence-updating alone cannot be the whole story about evidential support.

  ### The Anatomy of the Problem

  To understand why POE is a crisis rather than a quirk, we must look at the math of confirmation. In standard Bayesian Confirmation Theory (BCT), evidence $E$ confirms hypothesis $H$ if and only if $P(H|E) > P(H)$. By Bayes' theorem, this increase is driven by the likelihood ratio $\frac{P(E|H)}{P(E)}$.

  In the case of GR and Mercury:
  1.  $E$ (the anomalous precession) was known long before 1915. Thus, for any scientist at the time, $P(E) = 1$.
  2.  GR entails $E$. Thus, $P(E|H) = 1$.
  3.  The ratio is $\frac{1}{1} = 1$.

  The posterior credence equals the prior credence. The evidence provides zero confirmation.

  Why is this devastating? Because it contradicts the actual epistemic situation. Einstein and his contemporaries *were* justified in boosting their credence in GR specifically because it accounted for Mercury. If BCT says this boost is irrational (or mathematically impossible), then BCT is descriptively false of scientific history and normatively useless for guiding future theory choice. It implies that the only evidence that matters is evidence we haven't seen yet. This would render most historical sciences (geology, evolutionary biology, cosmology) irrational, as they largely rely on explaining existing data rather than predicting new data. The problem is not that the math is hard; it is that the math wipes out the intuition that *explanation* constitutes *confirmation*.

  ### The Fixes and Their Costs

  Philosophers have not left this problem unattended. Three major strategies have emerged to rescue Bayesianism. Each saves the formalism, but at a steep price.

  #### 1. The Logical Learning Solution (Garber, Jeffrey, Niiniluoto)
  This is the most popular defense within technical epistemology. It attacks the assumption of "logical omniscience." Standard Bayesianism assumes agents know all logical consequences of their beliefs. Garber argues that while scientists knew $E$, they did not know that $H \to E$ (that GR entails the Mercury anomaly) until Einstein did the math.

  *   **The Fix:** We treat the *learning of the logical relationship* as the new evidence. Let $L$ be the proposition "H entails E." We conditionalize on $L$, not $E$. Since $P(L) < 1$ before Einstein finished his calculations, learning $L$ allows $P(H)$ to rise.
  *   **The Cost:** This saves the math but changes the ontology of confirmation. It shifts the source of confirmation from the *world* (the orbit of Mercury) to the *mind* (the realization of a logical implication). This is counterintuitive. GR is confirmed by Mercury, not by Einstein's ability to do calculus. Furthermore, formalizing probabilities over logical relations requires a "probability of logic," which creates a regress problem (how do you assign a prior to a logical implication without already assuming a logic?). It turns Bayesianism into a theory of psychological surprise rather than objective support.

  #### 2. The Counterfactual (Ur-Prior) Solution
  This approach bites the bullet on $P(E)=1$ by rejecting the agent's actual credence function. It asks: What would the scientist's credence in $E$ have been *if* they had not known $E$?

  *   **The Fix:** We reconstruct a counterfactual credence function $P^*$ where $P^*(E) < 1$. We then calculate confirmation using $P^*$. If GR would have predicted $E$ in that counterfactual scenario, $H$ is confirmed.
  *   **The Cost:** This renders confirmation radically subjective and historically unstable. Which counterfactual world do we choose? Do we imagine a world where Le Verrier never looked at Mercury? Or one where telescopes were less precise? Different reconstructions yield different confirmation values. More damningly, it disconnects confirmation from the *actual* agent's state. It tells us why a hypothetical version of Einstein should have believed GR, not why the real Einstein was rational to do so in 1915. It saves the theory by making it irrelevant to actual belief revision.

  #### 3. The Explanatory (Skeptical) Solution
  This view, championed by philosophers like John Norton and various explanationists, suggests the problem lies in expecting probability to do all the work.

  *   **The Fix:** Acknowledge that the Mercury case worked not because of probability shifts, but because of *explanatory structure*. GR accounted for Mercury without "fudge factors" (adjustable parameters), whereas Newtonian physics required ad-hoc additions (like Vulcan) to fit the data.
  *   **The Cost:** This admits that Bayesianism is incomplete. It requires importing non-Bayesian values (simplicity, unification, lack of ad-hocness) to set the priors or likelihoods. If we need a separate theory of "explanatory virtue" to make the Bayesian math work, then Bayesianism is not the fundamental law of rationality; it is merely a calculus that processes inputs generated by a different epistemological engine.

  ### The Verdict: Bayesianism is Necessary, But Not Sufficient

  We must now choose. Does some version of Bayesian conditionalization fully rescue the intuition that old evidence confirms new theory?

  **The answer is no.** The Problem of Old Evidence demonstrates that strict conditionalization cannot be the whole story about evidential support.

  The Garber solution is the strongest Bayesian attempt, but it ultimately fails to capture the scientific reality of the Mercury case. When astronomers accepted GR, they were not merely updating on the fact that "Einstein's math works." They were updating on the fact that *the universe behaves this way*, and that GR captured that behavior uniquely. By shifting the evidence to the logical relation ($L$), Garber saves the theorem but loses the world. Confirmation becomes a story about the coherence of our propositions, not the fit between theory and reality.

  Moreover, the POE reveals a deeper structural flaw in the Bayesian account of *accommodation* versus *prediction*. The reason the Mercury anomaly was so powerful for GR was not just that GR entailed it, but that GR entailed it *rigidly*. The mathematics of GR allowed no freedom to adjust the precession value; it popped out of the field equations as a necessary consequence. Newtonian physics, conversely, could accommodate the data only by adding new masses or modifying laws ad-hocly.

  Standard Bayesianism has no intrinsic mechanism to penalize ad-hocness or reward rigidity. It relies entirely on the user to input these virtues into the priors or likelihoods. But if the priors are where the real epistemic work is done (i.e., assigning high prior probability to "rigid" theories and low prior probability to "flexible" ones), then the conditionalization step is merely the accounting department. The heavy lifting is being done by a prior theory of theoretical virtue that is not itself Bayesian.

  Therefore, the rationalist insistence that "rational belief revision *just is* conditionalization" is false. Conditionalization is a hygiene factor; it ensures you do not contradict yourself as you learn. But it does not tell you what you should learn, nor does it fully capture why some explanations warrant confidence increases when the evidence is already known.

  ### Conclusion

  The irony of the Mercury case is instructive. The rationalist community treats Bayes' theorem as the engine of discovery, but the historical engine of discovery (GR) breaks the theorem's standard model. The Problem of Old Evidence is not a bookkeeping error to be patched with counterfactuals or logical propositions. It is a signpost indicating the limits of probabilism.

  We should retain Bayesianism as a powerful normative constraint on coherence. However, we must reject the imperialist claim that it is a complete epistemology. Evidential support relies on structural features of theories—their unity, their lack of free parameters, their explanatory depth—that a probability function set to $P(E)=1$ cannot see. To understand why Einstein was rational, we need more than the calculus of credences; we need a theory of explanation. The Mercury anomaly confirms GR not because it updated a probability, but because it revealed a structure in nature that only GR could map. Bayes can track that confidence once gained, but it cannot fully explain why it was earned.
