          *   *Critique:* Admits BCT is incomplete.
      *   **The Verdict:** Argue for the "Incomplete Bayes" position. Bayesianism handles uncertainty well, but POE shows it handles *structural* confirmation poorly. The Mercury case worked because GR *rigidly* predicted the value, whereas Newtonian physics required ad-hoc adjustments. Probability functions don't inherently penalize ad-hocness without external priors.
