      *   *Refinement:* I should argue that Bayesianism is a necessary *constraint* on rationality, but not a sufficient *theory* of confirmation. The POE reveals that evidential support relies on structural features of the theory-evidence relationship (like novel prediction vs. accommodation, or parameter freedom) that $P(E)=1$ wipes out. Therefore, the verdict is: **Credence-updating alone cannot be the whole story.**

