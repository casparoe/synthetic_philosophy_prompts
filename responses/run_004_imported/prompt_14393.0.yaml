  2.  **Deconstruct the Problem (The "Why"):**
      *   Standard Bayesianism: Confirmation = Increase in credence via conditionalization. $P_{new}(H) = P_{old}(H|E)$.
      *   The Math: $P(H|E) = P(H) \cdot \frac{P(E|H)}{P(E)}$.
      *   The Issue: If $E$ is old/known, $P(E) = 1$. If $H$ entails $E$, $P(E|H) = 1$. Ratio is $1/1 = 1$. No boost.
      *   Why it matters: It's not just math. It strikes at the heart of scientific discovery. Theories often explain known data better than rivals. If BCT can't model this, it fails as a *normative* theory of scientific rationality, not just a descriptive one. It implies Einstein *shouldn't* have been more confident in GR because of Mercury, which is absurd.

  3.  **Analyze the Solutions:**
      *   **Solution A: Relaxing Logical Omniscience (Garber-style).**
          *   *Idea:* Agents aren't logically omniscient. Learning that $H \to E$ is new information ($L$). We conditionalize on $L$, not $E$.
          *   *Strength:* Keeps the Bayesian framework intact. Matches the psychological experience of discovery (the "Aha!" moment).
          *   *Cost:* Requires a probability distribution over logical relations. Technically messy (how to assign priors to logical implications?). Risks collapsing into a different theory of justification.
      *   **Solution B: Counterfactual/Historical Credences.**
          *   *Idea:* What would my credence in $E$ have been *if* I didn't know $E$? Or, reconstruct the historical context where $E$ was new.
          *   *Strength:* Preserves the likelihood ratio intuition.
          *   *Cost:* Highly subjective/speculative. "Ur-priors" are controversial. Disconnects from the *actual* agent's current state.
      *   **Solution C: Skeptical/Non-Bayesian (Explanationism).**
          *   *Idea:* Confirmation isn't just probability; it's about explanation, unification, lack of ad-hocness. BCT is too thin.
          *   *Strength:* Captures the actual scientific reasoning (Einstein didn't tweak parameters; the math *demanded* the value).
          *   *Cost:* Abandons the dream of a unified formal epistemology.

