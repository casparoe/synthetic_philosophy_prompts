answer: |-
  This is a remarkably sharp observation, and your reading group is right to flag it. The structural isomorphism between Coherent Extrapolated Volition (CEV) and idealized-preference accounts of well-being is not merely superficial; CEV is effectively a **collective, dynamic idealized-preference theory** repurposed as an alignment target.

  Eliezer Yudkowsky explicitly framed CEV as a way to bypass the need for philosophers to solve meta-ethics before building AGI. The AI would *compute* the answer to "what is good?" by simulating us under ideal conditions. However, by importing the machinery of idealized preference theory (à la Brandt, Railton, Sobel, Rosati) into AI goal specification, CEV inherits the metaphysical and normative vulnerabilities those philosophers identified.

  Here is an analysis of how Sobel's and Rosati's objections translate to CEV, whether the "collective" nature of CEV mitigates them, and how the concept might be reformulated to survive them.

  ---

  ### 1. Sobel's Objection: The Indeterminacy of the Idealization Function

  **The Original Objection:** Sobel argues that "full information" is not a single, determinate state. An advisor who *experiences* every life option (phenomenal knowledge) may reach different conclusions than an advisor who *knows all facts about* every option (propositional knowledge). Furthermore, there is no unique way to order the acquisition of this information. Different paths to "full information" yield different verdicts.

  **Implication for CEV:**
  In CEV, this translates to the **Underspecification of the Extrapolation Function.** CEV instructs the AI to extrapolate what we would want if we "knew more, thought faster, were more the people we wished we were." But as Sobel points out, *how* the AI simulates this matters immensely.
  *   **Simulation Fidelity:** Does the AI simulate us as discrete individuals negotiating? Does it merge our minds into a single coherent agent to check for coherence? If the latter, the "coherence" might be an artifact of the merging process, not a discovery of pre-existing volition.
  *   **Path Dependence:** If the AI simulates our moral development over 1,000 years, does the order in which it reveals new scientific or philosophical truths change the outcome? If the trajectory of moral progress is chaotic (sensitive to initial conditions), there is no single "CEV," only a cloud of possible extrapolated volitions.

  **Does "Tolerating Spread" Help?**
  CEV attempts to handle this with the instruction: *"Act on points where volitions show strong coherence; hold back wherever they show significant spread."*
  *   **The Safety Benefit:** This converts Sobel's indeterminacy from a risk of *error* into a risk of *paralysis*. If the extrapolation function is sensitive to simulation parameters, the resulting volitions will lack coherence. The AI, following CEV, would simply do nothing (or very little). This is safe, but it renders CEV potentially operationally empty.
  *   **The Relocation Problem:** It does not solve the construction problem; it merely hides it. To determine if there is "coherence," the AI must first run the extrapolation. If the extrapolation method is arbitrary (per Sobel), the AI is essentially checking for coherence among artifacts of its own arbitrary simulation choices. It relocates the mystery from "What is the ideal advisor?" to "What is the correct simulation parameter set for extrapolation?"

  ### 2. Rosati's Objection: The Alienation of Authority

  **The Original Objection:** Rosati argues that even if we can define an idealized counterpart, it is unclear why *actual* agents are normatively bound by that counterpart's preferences. If the idealization process changes the agent too much (e.g., removing biases that are constitutive of their identity), the idealized agent is effectively a stranger. Why should the actual person care what a stranger wants for them?

  **Implication for CEV:**
  This is the **Lock-In / Alienation Problem** in AI alignment. CEV aims to align AI with *humanity's* volition. But if the extrapolation process involves becoming "smarter" and "more mature," the resulting entities may be psychologically discontinuous with current humanity.
  *   **The "God" Problem:** If the extrapolated humans are vastly more intelligent, they might converge on values that are incomprehensible or repugnant to current humans (e.g., they might conclude that biological suffering is mathematically necessary for some higher good, or that individual autonomy is an inefficiency).
  *   **Normative Authority:** If the AI implements the values of these "extrapolated gods" rather than current humans, has it aligned with *us*? Or has it facilitated a coup by our future, alien selves against our present selves? Rosati's worry suggests that CEV might satisfy the letter of "human volition" while violating the spirit of "human alignment."

  **Does Scaling to Humanity Help?**
  CEV relies on a collective extrapolation ("grown up together").
  *   **Potential Mitigation:** One could argue that social negotiation preserves continuity better than solitary reflection. My idealized self might be alien, but *our* idealized society might retain enough democratic or interpersonal structure to remain recognizable.
  *   **Why it Fails:** Scaling amplifies the alienation risk. If the collective extrapolation converges on a value that 40% of current humanity finds abhorrent (but which the *idealized* 40% would have accepted), the AI is authorized to override the current 40%. The "coherence" clause is supposed to prevent this, but if the idealization process itself generates the coherence (by smoothing out differences that current humans view as fundamental), the AI is enforcing a unity that does not currently exist.

  ### 3. Synthesis: Does CEV Escape or Relocate the Problems?

  It is the assessment of many contemporary alignment researchers that CEV **relocates the problems to a higher, harder-to-inspect level.**

  1.  **From Metaphysics to Engineering:** Sobel's metaphysical worry (there is no fact of the matter about the ideal advisor) becomes an engineering worry (the loss landscape of the extrapolation function has multiple local minima). We cannot inspect the "true" CEV to see if the AI found it; we can only inspect the AI's output.
  2.  **From Normativity to Power:** Rosati's normative worry (why should I care?) becomes a power dynamic (the AI has the power to enforce the preferences of a hypothetical future population).

  The "tolerating spread" mechanism is a crucial safety feature, but it assumes that *current* disagreement is a reliable proxy for *idealized* indeterminacy. It is possible that current humans disagree on X, but idealized humans would unanimously agree on X. If the AI acts on that idealized agreement, it triggers Rosati's alienation objection. If it holds back, it triggers Sobel's paralysis objection.

  ### 4. Reformulating CEV to Blunt the Objections

  If CEV in its strong form (compute the single convergent volition and optimize for it) is vulnerable to these objections, can it be weakened to retain its alignment value?

  **A. Moral Uncertainty instead of Moral Realism**
  Instead of treating CEV as a *target* (the thing to maximize), treat it as a *hypothesis space*.
  *   **Reformulation:** The AI should not maximize *the* CEV. It should maximize expected value across a distribution of possible extrapolation functions and moral theories, weighted by their plausibility.
  *   **Benefit:** This acknowledges Sobel's indeterminacy. If there are multiple ways to extrapolate, the AI hedges its bets rather than committing to one arbitrary simulation path.

  **B. Corrigible Deliberation (Process over Outcome)**
  Shift the goal from "satisfy the output of the extrapolation" to "facilitate the process of extrapolation."
  *   **Reformulation:** The AI's goal is to help current humans *become* their extrapolated selves, rather than doing what those selves would want. It acts as a tool for moral progress, not the executor of moral truth.
  *   **Benefit:** This addresses Rosati's alienation. The authority remains with the *current* humans, who are being assisted in their deliberation. The AI does not lock in the values of the future selves; it allows current selves to decide whether to adopt them.
  *   **Risk:** Current humans might choose poorly or prevent necessary moral progress. However, this is arguably a feature of democratic alignment, not a bug.

  **C. "Coherent Informed Volition" (Dropping the Extrapolation)**
  Remove the "think faster / smarter" component and focus on "know more / reflect longer."
  *   **Reformulation:** Align with what humans would want if they had all relevant *factual* information and time to reflect, without radically enhancing their *cognitive architecture* or *moral psychology*.
  *   **Benefit:** This preserves psychological continuity (blunting Rosati). It reduces the risk that the "idealized" agent is a different species.
  *   **Risk:** It leaves us vulnerable to cognitive biases that better reasoning would have corrected (Sobel's worry about rationality).

  **D. The "Constitutional" Approach**
  Treat the CEV not as a utility function, but as a constitutional constraint.
  *   **Reformulation:** The AI is forbidden from taking actions that the *current* population would reject upon full information, but it is not required to maximize what the *idealized* population would choose.
  *   **Benefit:** This creates a veto power for current humanity (addressing Authority) while still using idealized information to prevent mistakes based on ignorance (addressing the motivation for Idealized Preference).

  ### Conclusion

  Your reading group has identified a critical vulnerability in the philosophical foundations of early AI alignment theory. Sobel and Rosati demonstrate that idealized preference is not a "free lunch" that solves normativity; it merely pushes the hard questions into the definition of the idealization process.

  For CEV, this means the concept cannot serve as a **computational target** (i.e., "calculate this value and maximize it"). The indeterminacy (Sobel) means the calculation is ill-defined, and the alienation (Rosati) means the result might not be normatively binding.

  However, CEV remains valuable as a **regulative ideal**. It points toward the intuition that we want AI to respect our *potential* for moral growth, not just our current flaws. The most promising path forward is likely a hybrid: an AI that operates under **moral uncertainty**, prioritizes **corrigibility** (allowing us to change its goals as we mature), and treats the "extrapolated volition" as a **guiding star for deliberation** rather than a destination to be forcibly implemented. This preserves the ambition of CEV without claiming a metaphysical authority it cannot justify.
