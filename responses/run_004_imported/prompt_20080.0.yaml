answer: |-
  This is a fantastic question, and it captures a very common friction point between philosophers of mind and contemporary AI researchers. The short answer is: **Your friend is half-right, but he is conflating the *technical* formulation of the frame problem with the *philosophical* one.**

  He is correct that deep learning (DL) sidesteps the specific logical bottleneck McCarthy and Hayes identified. However, he is likely wrong that it dissolves the deeper epistemological worry raised by Dennett and Fodor. In fact, many argue that modern AI has simply *relocated* the frame problem rather than solved it.

  Here is a breakdown of where he is right, where he is wrong, and the specific arguments you can use in your next session.

  ---

  ### 1. Where He Is Right: The Technical Frame Problem
  The original 1969 formulation by McCarthy and Hayes was a problem of **representation** in symbolic logic (Situation Calculus).
  *   **The Issue:** If you represent the world as a set of logical predicates (e.g., `On(BlockA, Table)`), and you perform an action (`Move(BlockA, Floor)`), you have to explicitly state that `Color(BlockA)` did *not* change, `Location(Table)` did *not* change, etc.
  *   **The Explosion:** For every action, you need $N$ axioms for what changes and $M$ axioms for what stays the same, where $M$ is huge. This makes planning computationally intractable.
  *   **The DL Solution:** Neural networks do not use explicit symbolic representations. They use distributed, sub-symbolic vectors. They don't have a list of beliefs to update; they have weights that activate patterns. Therefore, they literally cannot suffer from the *combinatorial explosion of frame axioms* because they don't have axioms.

  **Verdict:** On this narrow, historical-technical point, your friend is correct. No one writes frame axioms for Transformers.

  ### 2. Where He Is Wrong: The Philosophical Frame Problem
  By the time Dennett ("Cognitive Wheels") and Fodor ("The Frame Problem Strikes Back") got hold of it, the problem had mutated. It was no longer about logic syntax; it was about **relevance** and **common sense**.

  *   **The Worry:** How does a finite system (mind or machine) determine, in real-time, which of its indefinitely many pieces of knowledge are *relevant* to the current context without checking all of them?
  *   **The ML Claim:** "Attention mechanisms and statistical learning solve this."
  *   **The Counter-Argument:** Deep learning replaces explicit search with **implicit statistical priors.** It doesn't "know" what stays the same; it just predicts that things probably stay the same because that's what the training data usually looked like.

  Here are four specific angles to push back on:

  #### A. Prediction vs. Causal Understanding
  The frame problem is fundamentally about **change** and **causality**. It asks: "If I do $X$, what changes *because* of $X$?"
  *   **DL Approach:** LLMs are next-token predictors, not causal modelers. They know the battery doesn't change color when removed from a radio because they have seen that sentence pattern a million times.
  *   **The Failure Mode:** If you present a novel scenario outside the training distribution (e.g., a physics puzzle involving a substance that changes color when exposed to air), the LLM often fails to track the state correctly. It hallucinates. This suggests it hasn't solved the frame problem (understanding inertia and change); it has just memorized typical frames. When the statistical regularity breaks, the "frame" breaks.

  #### B. The "Sleeping Dog" Problem (Brittleness)
  Dennett's famous example involves a robot trying to get a battery from a room with a bomb.
  *   **R1** ignores that moving the battery moves the bomb (irrelevance failure).
  *   **R1D1** tries to compute *all* side effects (relevance explosion).
  *   **R2D1** sits there uselessly trying to distinguish relevant from irrelevant side effects.
  *   **The DL Equivalent:** Modern LLMs are more like R1D1s that guess. They often fail at **state tracking** in long contexts. If you ask an LLM to play a text adventure game or write code that involves mutating state over many steps, it frequently forgets what changed and what didn't. It loses the "frame." This is why LLMs struggle with complex math or coding tasks without external tools (like a Python interpreter) to enforce the "frame" of truth.

  #### C. Attention is Not Free Relevance
  Your friend argues that DL avoids "exhaustive search." But how does a Transformer decide what is relevant?
  *   **Mechanism:** Self-attention computes relationships between *all* tokens in the context window.
  *   **Cost:** This is computationally expensive ($O(N^2)$). It is not a magic relevance filter; it is a brute-force correlation calculator within a limited window.
  *   **Philosophical Point:** Fodor's worry was about the *isotropy* of belief (anything could be relevant to anything). Attention mechanisms limit relevance to the *context window*. If the relevant information is outside the window (or wasn't in the training data), the system is blind. It hasn't solved the relevance problem; it has put a hard cap on it.

  #### D. Embodiment and Action
  The frame problem is arguably unsolvable for a passive observer. It only becomes a real problem for an **agent** that acts in the world.
  *   **LLMs are not agents:** They don't act; they predict text. They don't have to deal with the physical consequences of their "actions."
  *   **Robotics:** When you put these models into robots (Embodied AI), the frame problem returns with a vengeance. A robot needs to know that if it moves its arm, the wall doesn't move. While DL helps with perception, planning and control still struggle with long-horizon causal reasoning. The "statistical structure" of pixels doesn't guarantee the physical persistence of objects.

  ### 3. How to Frame the Pushback (Cheat Sheet)
  If you want to be charitable but firm in the next session, try this structure:

  1.  **Acknowledge the Technical Win:** "You're right that we don't write explicit frame axioms anymore. The symbolic bottleneck is gone."
  2.  **Pivot to the Philosophical Core:** "But Dennett and Fodor weren't just worried about axioms; they were worried about **relevance** and **common sense reasoning about change**."
  3.  **The "Statistical Frame" Argument:** "Deep learning solves this by using statistical priors instead of logical axioms. It assumes things don't change because they usually don't in the training data. But that's not *understanding* the frame; it's betting on the frame."
  4.  **Evidence of Persistence:** "We see the frame problem resurfacing in LLM hallucinations and state-tracking failures. When the model has to track what changed vs. what stayed the same over a long chain of reasoning, it often fails. That suggests the cognitive problem of relevance isn't solved; it's just hidden inside the black box."
  5.  **The "System 2" Point:** "DL is great at System 1 (fast, associative) relevance. But the Frame Problem is a System 2 problem (deliberate planning). We still need to bolt symbolic solvers onto LLMs to handle tasks where keeping track of change is critical."

  ### Summary
  Your friend is arguing from an **engineering perspective**: "We built systems that work without frame axioms, so the problem is obsolete."
  You are arguing from a **philosophical/cognitive perspective**: "The systems work by brute-forcing statistical correlations, not by solving the underlying problem of how to determine relevance and causal change. When they fail, they fail in ways that look exactly like the frame problem."

  The frame problem hasn't been solved; it has been **probabilized**. And as any statistician will tell you, probabilities come with error bars—error bars that look a lot like Dennett's robots staring uselessly at bombs.

  **Recommended Reading for Next Time:**
  *   **Steven Pinker** often discusses how connectionist models sidestep but don't solve compositional reasoning.
  *   **Gary Marcus** (though controversial) writes extensively on the difference between statistical learning and causal reasoning (specifically regarding the frame problem).
  *   **Daniel Dennett's "Cognitive Wheels"** is still the best primer on why this is a problem for *any* information processing system, not just logic-based ones.
