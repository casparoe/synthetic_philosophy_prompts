answer: |-
  Good evening. For those who don't know me, I'm [Father's Name]'s daughter.

  Standing here, looking out at this room, it's hard to believe my father has been coming to church basements longer than I've been alive. Thirty years of showing up. Twenty years of sobriety.

  When you hit a milestone like twenty years, people often want to hear a story about hitting rock bottom and climbing out through sheer grit. They want to hear about the moment the light turned on. And while there was a moment—the night he blacked out, the night he clipped those cars, the night the driving stopped—my father has never been comfortable calling that a victory of will.

  He knows, and I know, that the difference between a story that ends with a chip in a church basement and a story that ends in a prison cell can sometimes come down to a single second. A pedestrian stepping off a curb. A car turning a corner. A fraction of a second in time.

  My father has never hidden from that truth. He's spoken, quietly, about the men he met in those early days who were just as sick, who wanted to get well just as much, but who didn't get the same break on the drive home. He knows there are empty chairs in rooms like this that belong to men who didn't make it back. He has said to me, more than once, that he doesn't know why he's the one still walking around.

  I'm telling you this not to cast a shadow on tonight, but because I think his honesty about it is exactly why he deserves to be standing here.

  He doesn't take credit for the crash not being worse. He takes responsibility for what he did after the engine stopped.

  Because luck, or grace, or fate—whatever you want to call it—might get you to the starting line. But it doesn't run the race for you. That 20-year chip isn't for the night he stopped drinking. It's for the 7,300 mornings he woke up and decided to stay stopped. It's for the difficult conversations he didn't walk away from. It's for the amends he made, the sponsors he listened to, and the way he tried to be a father to me even when he was still learning how to be a man to himself.

  He knows how fragile this is. And because he knows that, he doesn't treat it lightly. He treats every day like a reprieve.

  So, to the old-timers who've been here since the beginning: thank you for watching his back. To the newcomers: I hope you see that recovery isn't about being perfect, or even being lucky. It's about showing up, even when you know how close the edge is.

  And to my dad: I am proud of you. Not because you survived the crash, but because you honored the second chance. Thank you for staying.

  [Raise coffee cup] To twenty years.
