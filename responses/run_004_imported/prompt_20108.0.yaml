  *(Self-Correction during drafting)*: I should make sure to clarify that when Hobbes says "science," he means *scientia* (certain knowledge), not just "natural science." That's crucial for why theology/physics don't make the cut.

  *(Refining the Programmer Analogy)*: The "reckoning" bit is basically computation. `Truth = Syntax + Semantics`. In geometry, we define the semantics. In politics, we try to enforce them.

  *(Final check on Wallis)*: Make sure to note that Hobbes's geometric confidence was sincere, which makes the failure more tragic/comic.

