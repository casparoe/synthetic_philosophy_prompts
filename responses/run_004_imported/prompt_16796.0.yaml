answer: |-
  # The Mirror of Behavior: Why Inverse Reinforcement Learning Cannot Solve the Normative Gap

  The debate between you and your friend strikes at the heart of the AI alignment problem. It is a dispute not merely about machine learning techniques, but about the philosophy of mind and the limits of empirical inference. Your friend argues for the sufficiency of data and engineering: given enough behavioral traces, an algorithm can disentangle what a human wants from how they fail to get it. You argue for the necessity of philosophy: behavior alone is logically insufficient to distinguish preference from error.

  This essay adjudicates that disagreement. It will demonstrate that while your friend is correct that Inverse Reinforcement Learning (IRL) can produce excellent *predictive* models of behavior, you are correct that it cannot, even in principle, recover *normative* preferences without importing unverifiable assumptions. The identifiability problem is not an engineering hurdle to be cleared with more data; it is a structural feature of the relationship between observation and value. Consequently, any claim to have recovered an agent's "true" preferences is inescapably relative to the prior assumptions about rationality built into the learning system.

  ### The Identifiability Problem

  To understand why the skeptic's position holds, we must define the identifiability problem precisely. In standard IRL, an observer sees an agent acting in an environment. The observer assumes the agent is optimizing some reward function $R$, but does so through a planning algorithm or policy $\pi$. The goal is to recover $R$ given observations of $\pi$.

  In the ideal case of a perfectly rational agent, $\pi$ is the optimal policy for $R$. However, humans are not perfectly rational. We suffer from bounded compute, cognitive biases, akrasia, and addiction. Therefore, a realistic IRL model must posit a *rationality model* $P$, which describes how the agent translates rewards into actions. The relationship is $\pi = P(R)$. To find $R$, the algorithm must invert this function: $R = P^{-1}(\pi)$.

  The crisis arises because $P$ is unknown. As shown formally by Armstrong and Mindermann (2018), for any observed policy $\pi$, there are indefinitely many pairs of $(R, P)$ that could have generated it. Consider a person who smokes cigarettes.
  1.  **Model A:** The agent has a reward function $R_{nicotine}$ that values smoking highly, and a rationality model $P_{rational}$ that efficiently pursues rewards.
  2.  **Model B:** The agent has a reward function $R_{health}$ that values longevity, and a rationality model $P_{addiction}$ that compels them to act against their rewards in specific states.

  Both models predict the exact same behavior: the person smokes. No amount of additional behavioral data—watching them smoke more, or watching them buy lighters—can distinguish between Model A and Model B. The data is compatible with the agent *wanting* to smoke, and with the agent *wanting to quit but failing*.

  This is not a problem of noise or sample size. It is a problem of degeneracy. The mapping from rewards to behavior is many-to-one. Without independent knowledge of the planning algorithm $P$, the reward function $R$ is mathematically underdetermined. You cannot solve for two unknowns ($R$ and $P$) with one equation (behavior).

  ### The Optimist's Reply: Rich Data and Structural Priors

  Your friend's optimism relies on two counter-arguments. First, she argues that "behavior" is richer than simple state-action pairs. It includes verbal reports, reaction times, pupil dilation, and neural correlates. If a person says "I want to quit" while lighting a cigarette, surely that breaks the tie?

  Second, she appeals to structural priors. We do not consider all mathematical pairs of $(R, P)$ equally plausible. We assume humans are *mostly* rational, or that their reward functions are *simple*, or that their biases follow known psychological patterns (e.g., hyperbolic discounting). By imposing these constraints, the space of possible solutions shrinks, potentially leaving a single "best" explanation.

  This is a formidable engineering stance. In robotics, assuming a robot is mostly rational with some motor noise allows us to infer its goals accurately. Your friend argues that humans are just complex robots: if we model the "noise" (biases) well enough, the "signal" (preferences) will emerge. She views the assumption of rationality not as a philosophical gamble, but as a sensible default, akin to assuming gravity exists when tracking a ball.

  ### The Philosophical Crack

  However, the optimist's reply conflates *predictive accuracy* with *normative truth*. It is entirely possible to construct a model that predicts human behavior perfectly by assuming humans are perfectly rational maximizers of immediate impulse. Such a model would assign high reward to heroin for an addict. It would be predictively accurate, but it would fail alignment, because it identifies the addict's "true preference" as the addiction itself.

  To recover the preference the addict *endorses on reflection* ($R_{health}$), the algorithm must privilege Model B over Model A. But on what empirical grounds? The verbal report "I want to quit" is just more behavior (vocal cord vibrations). A cynical model could interpret that report as a social signaling strategy ($R_{status}$) rather than a revelation of true value. To interpret the speech as *truthful* and the action as *compelled* requires a normative hierarchy: a rule that says "reflective speech counts more than impulsive action."

  This rule cannot be derived from behavior. It is a philosophical assumption about what constitutes the "self." Is the self the impulse or the planner? The addict or the observer? Behavior does not say.

  Furthermore, structural priors like "simplicity" do not solve the problem. As Armstrong and Mindermann demonstrated, "simplicity" is relative to the description language. One can construct a reward function that is extremely simple (e.g., "maximize dopamine") paired with a complex planning algorithm, or a complex reward function paired with a simple planner. There is no objective metric to decide which decomposition is the "real" one. Choosing a prior that favors "humans are mostly rational" is simply hard-coding the conclusion that most deviations are errors rather than preference shifts. It is a self-fulfilling prophecy.

  ### The Verdict

  The disagreement must be resolved by distinguishing between *instrumental utility* and *epistemic access*.

  Your friend is right that IRL is instrumentally useful. For the purpose of building an AI that anticipates human moves in a game, or navigates a car safely around pedestrians, assuming a standard rationality model works well enough. In these domains, "preferences" are treated as predictive parameters. If the model predicts the pedestrian will step off the curb, the car stops. It does not matter if the pedestrian stepped off due to a desire to cross or a slip of the foot; the avoidance behavior is the same.

  However, your question is about *alignment*: inferring an agent's *real* preferences to satisfy them. This is a normative task, not a predictive one. Here, you are right. Behavior-based inference cannot deliver knowledge of an agent's real preferences in isolation.

  The "true preference" is not a hidden variable waiting to be uncovered by a sufficiently powerful microscope. It is a theoretical construct that requires a bridging principle between *is* (behavior) and *ought* (value). That bridging principle is a theory of rationality. Because multiple theories of rationality are compatible with the same behavior, the choice of theory determines the inferred preferences.

  If we assume humans are Boltzmann-rational, we find Boltzmann preferences. If we assume humans are dual-process agents with a flawed System 1 and a truthful System 2, we find reflective preferences. Neither assumption is verified by the data; both are imposed upon it.

  ### Conclusion

  The honest answer is conditional, but the condition reveals the impossibility of the pure behaviorist hope. **Inverse Reinforcement Learning can only recover "true" preferences conditional on the prior assumption of a specific normative model of rationality.**

  Without that assumption, the inference is inescapably relative. There is no "view from nowhere" that allows an algorithm to look at a human smoking and declare, "That is not their true preference." To make that declaration is to make a philosophical claim about the authority of reflection over impulse.

  Therefore, your friend's position is technically viable only if she redefines "preferences" to mean "whatever parameters best predict future behavior." But if "preferences" means "what the agent would endorse upon ideal reflection" or "what is good for the agent," then your skepticism is vindicated. No amount of data can solve a problem that is not empirical. The gap between behavior and value is not an engineering distance to be traversed; it is a logical chasm that must be bridged by explicit normative commitment. We cannot learn what we ought to do solely by watching what we do.
