answer: |-
  **The Myth of Symmetry: Why the Moral Equality of Combatants Collapses Under Scrutiny**

  The debate over the Moral Equality of Combatants (MEC) is the central fault line in contemporary just war theory. It asks a deceptively simple question: Do soldiers fighting on opposite sides of a war have the same moral status? Specifically, does a soldier fighting for an unjust aggressor nation have the same right to kill enemy combatants, and the same liability to be killed by them, as a soldier fighting in self-defense? The traditional view, championed by Michael Walzer, says yes. The revisionist view, led by Jeff McMahan and David Rodin, says no. Your confusion is well-founded; this is not merely a disagreement over tactics, but a clash between two different ways of thinking about morality itself: one institutional and collective, the other individual and foundational.

  To resolve this, we must first untangle the terminology that tripped you up. In moral philosophy, **justification**, **liability**, and **excuse** are distinct categories. An action is *justified* if it is the right thing to do all things considered (e.g., killing an attacker to save a life). A person is *liable* to harm if they have done something to forfeit their right not to be harmed (e.g., the attacker forfeits their right to life by threatening yours). Finally, an agent is *excused* if they do something wrong but are not blameworthy for it due to ignorance or duress. The Traditionalist view conflates these categories, whereas the Revisionist view separates them. Once we separate them, the verdict becomes clear: The Moral Equality of Combatants is morally false. It collapses as a principle of deep morality, even if it remains useful as a legal convention.

  The Traditionalist case, articulated by Walzer in *Just and Unjust Wars*, rests on the "separation thesis." Walzer argues that the justice of going to war (*jus ad bellum*) must be kept separate from the justice of conduct within war (*jus in bello*). His reasoning is pragmatic and sociological. Soldiers are instruments of the state, not independent moral agents. They lack epistemic access to the secret deliberations of governments; a conscript cannot know for certain if their nation's cause is truly unjust. Furthermore, if we deny MEC, we risk turning war into a massacre where only one side is permitted to fight back. If unjust soldiers are "murderers," then killing them is not just an act of war but an act of policing, which could justify unlimited violence against them. For Walzer, MEC is a necessary convention that preserves the humanity of war by granting soldiers on both sides an equal right to fight and an equal status as legitimate targets, provided they follow the rules of engagement.

  However, the Revisionist critique dismantles this by appealing to "deep morality." McMahan and Rodin argue that war is not a special moral sphere with its own rules; it is simply collective self-defense. They use an analogy from domestic criminal law. If a culpable attacker tries to kill an innocent victim, the victim has the right to kill the attacker in self-defense. The attacker, having initiated a wrongful threat, is *liable* to defensive harm. Crucially, the attacker does not gain a right to kill the victim just because the victim fights back. If the attacker kills the victim, it is murder. If the victim kills the attacker, it is justified self-defense. There is no "moral equality" between the mugger and the victim.

  Revisionists argue that soldiers are no different. If a nation is attacked unjustly, its soldiers are like the victim defending themselves. The attacking soldiers are like the mugger. Therefore, the unjust combatants are liable to be killed because they pose a wrongful threat, while the just combatants are not liable because they pose no wrongful threat. To claim they are morally equal is to claim that the mugger has the same right to kill the victim as the victim has to kill the mugger, simply because they are both "fighting." This, McMahan argues, is absurd. The justice of the cause (*ad bellum*) determines the liability of the combatant (*in bello*).

  Your confusion regarding "liability" versus "excuse" is exactly where the Traditionalist argument hides. Walzer is correct that many unjust combatants are not *blameworthy*. If a soldier is conscripted, propagandized, or reasonably mistaken about the justice of their cause, they may be *excused*. They are not villains. However, being excused is not the same as not being liable. Consider a person who is unknowingly carrying a deadly virus. They are not blameworthy (they are excused), but if they threaten to infect you, you may still be permitted to stop them, perhaps even with force. They are liable to defensive harm because of the threat they pose, not because of their moral character.

  The Traditionalist view insists that because unjust soldiers are often excused (not blameworthy), they must also be non-liable (cannot be justly killed). This is a category error. Revisionism corrects this by admitting that unjust combatants are often excused from blame, but maintaining that they remain liable to attack. This distinction saves the moral intuition that we shouldn't hate the enemy soldier personally, while acknowledging the moral truth that we are justified in killing them to stop their army, whereas they are not justified in killing us.

  So, does the Moral Equality of Combatants survive? The verdict is that it does not. MEC collapses as a fundamental moral truth. The Revisionist account is superior because it aligns the ethics of war with the ethics of everyday life. If morality is universal, it cannot simply switch off when uniforms are put on. The idea that a soldier gains a "license to kill" simply because their government issued an order is a dangerous fiction that insulates individuals from moral responsibility.

  However, admitting that MEC is morally false does not mean we must abandon it legally. This is the only concession the Traditionalist deserves. As a matter of international law and military convention, we may need to *pretend* MEC is true. We cannot put every soldier on the losing side on trial for murder, nor can we expect soldiers to conduct complex geopolitical analysis before firing a weapon. The "conventionalist" view (championed by philosophers like Henry Shue) suggests that while MEC is morally false, it is a necessary regulatory fiction to prevent wars from becoming genocidal purges of the "unjust" side.

  But a regulatory fiction is not a moral truth. To answer your specific question: The Moral Equality of Combatants is a myth. It confuses the *permission to kill* (which is asymmetric) with the *blameworthiness of the killer* (which is often symmetric). Jeff McMahan and the Revisionists are right: an unjust combatant is liable to be killed in a way a just combatant is not. Walzer is right only in the sense that many unjust combatants are excused from blame, but he is wrong to elevate that excuse into a principle of equality.

  We must accept this uncomfortable truth. Denying MEC forces us to acknowledge that participating in an unjust war is a grave moral harm, even for the ordinary soldier. It places the burden on states to ensure their wars are just, knowing that their soldiers will bear the moral cost if they are not. While we may retain MEC in the laws of war for pragmatic stability, we must discard it in our moral reasoning. To do otherwise is to claim that a uniform grants a moral immunity that no human being actually possesses.
