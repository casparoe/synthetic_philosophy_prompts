      *   *Example:* Jill fears Jack is angry. Jack's face *looks* angry to her, not just judged as angry.
      *   *Counter-argument to Fodor:* Fodor focuses on low-level vision (lines, angles). Siegel focuses on high-level perception (objects, emotions, categories).
