      *   *Epistemic Stakes:* "Epistemic Downgrade" (or circularity). If my belief makes me see evidence for that belief, my justification is compromised. It's a form of epistemic circularity (bootstrapping).

  4.  **Compare and Contrast:**
      *   *Scope:* Fodor = Early vision (retina to V1/V2 processing). Siegel = Late vision/Recognition (ventral stream, object recognition).
