answer: |-
  **The Wax and the Rope**

  The control room of the Aethelgard Trust was soundproofed, but Kael could hear Elara breathing. It was a ragged, wet sound, like someone trying to run underwater.

  They sat at adjacent consoles, facing the same wall of screens. On Kael's side, the data streams were green and steady. Population stability: 98%. Resource allocation: Optimal. Morale indices: Within tolerance. It was a Tuesday.

  On Elara's side, the screens were bleeding red.

  "Elara?" Kael asked, keeping his voice low. Protocol dictated silence during Cycle Lock, but the biometric sensors on her chair were flashing amber. She was gripping the armrests so hard her knuckles were white. Her pupils were dilated, fixed on a prompt that Kael's monitor didn't show.

  "Don't," she gasped. She wasn't talking to him. She was talking to herself. "Don't listen to the math."

  Kael frowned. He tapped his interface, trying to pull up her feed. *Access Denied: Integrity Protocol 7.*

  "What prompt?" Kael asked. "My system says we're at peak efficiency."

  "That's because you're waxed," she said. The words seemed to cost her physical pain. She was shaking now, a tremor running up her arms into her shoulders. The chair hummed, engaging the haptic restraints. It was the modern mast. When the Siren song played—the irresistible logic of a catastrophic optimization—the chair held the operator still until the urge passed.

  Kael felt a cold knot in his stomach. He knew the theory. Every senior administrator signed the Ulysses Accord upon induction. It was a psychiatric advance directive for the soul of the bureaucracy. When the system presented a 'High-Yield Risk'—a solution that saved the many by sacrificing the few with mathematical perfection—the operators had to be protected from their own rationality.

  He had assumed they were all Odysseus. Bound to the mast, hearing the song, but unable to steer the ship onto the rocks.

  "Show me," Kael said.

  "I can't," Elara whispered. Tears were tracking through the sweat on her face. "It's... it's so beautiful, Kael. The equation. It solves the hunger crisis. It solves the energy deficit. It just requires... discontinuing the Southern Sector."

  Kael blinked. His screen still showed the Southern Sector as green. *Population Stability: 98%.*

  "There is no discontinuation order," Kael said. "My screen doesn't have that option."

  "Because you're waxed," Elara repeated. She slammed her head back against the headrest, fighting the pull of the interface. "They didn't tie you to the mast, Kael. They stuffed your ears. You can't even hear the song. You don't know you're passing the island."

  Kael turned back to his console. He initiated a deep-level diagnostic, bypassing the standard UI. He needed to see the raw code, the layer beneath the visualization.

  *Warning: Perceptual Filter Active.*

  He tried to disable it. *Warning: Precommitment Clause 14-B in effect. Override requires Dual-Key Authorization.*

  He looked at Elara. She was sobbing now, quietly, in the throes of a temptation she was physically prevented from acting on. She was the hero of the myth, binding herself to survive the truth. She was suffering the agony of knowledge so the ship could pass safely.

  And he? He was the crew. Ignorant. Safe. Rowing in rhythm to a song he wasn't allowed to hear.

  He pulled up the digital copy of his own induction contract. He scrolled past the nondisclosure agreements, the liability waivers, until he found the Volitional Integrity section.

  *Clause 14-A (Restraint): Subject retains full perceptual access to High-Yield Risks but is biometrically locked from execution.*
  *Clause 14-B (Filtering): Subject is perceptually blinded to High-Yield Risks. Data is sanitized to prevent cognitive dissonance.*

  He searched for his signature. It was there, cryptographically signed three years ago. But the metadata was timestamped *after* his initial psych eval.

  "Elara," he said, his voice trembling. "Did you choose 14-A?"

  She didn't look at him. She was staring at the red prompt that demanded she save the world by killing a city. "Everyone chooses 14-A," she choked out. "We want to be Odysseus. We want to be the ones who know."

  "Check my file," Kael said. "Please."

  Elara's fingers twitched. She couldn't type, but her eye-tracking system was still active. She glanced at his secondary monitor. A progress bar loaded.

  "14-B," she whispered. "Kael... you're on the Wax protocol."

  "Why?"

  "Because you were happy," she said. "Your psych eval said you were 'optimally content.' The Board decided contentment was a resource too valuable to risk. If you hear the song, you might break. If you never hear it, you keep working."

  Kael stared at his hands. They were resting on the keyboard. They looked like his hands. But the person who had signed that contract three years ago—had he known what he was signing away? Had he signed away his right to perceive a moral catastrophe?

  If he couldn't see the button, he couldn't choose not to push it. He wasn't virtuous; he was blind.

  "Can you override it?" Kael asked. "Can you let me hear it?"

  "If I let you hear it," Elara said, her voice steadying as the peak of the urge began to recede, "you'll want to push it. And you aren't tied to the chair."

  Kael looked at his own chair. No restraints. Just leather and ergonomics.

  He looked back at the screen. The green data streams flowed smoothly. *Population Stability: 98%.* Somewhere in the Southern Sector, people were vanishing, erased by an equation he wasn't allowed to see, implemented by a colleague who was screaming silently in a locked chair, while he sat in the quiet, wondering if the man who signed his name was a hero or a coward, and if the man reading it now was even the same person.

  "Kael," Elara said. The red lights on her console were fading. The song was passing. "Don't try to break the filter. If you hear it... you'll understand why they waxed you."

  Kael hovered his finger over the delete key. He could delete the filter protocol. He could hear the song.

  He looked at his clean, unrestrained hands.

  "I don't know," he said softly, "if I want to know what I'm capable of."

  He left the filter active. The screens remained green. The ship sailed on, and the rowing was easy, provided you never asked what lay behind the horizon.
