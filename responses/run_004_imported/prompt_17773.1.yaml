prompt: |-
  Hey, I need a short story for the precommitment unit in my seminar. Everyone remembers Odysseus tying himself to the mast so he can hear the Sirens' song but not act on it, but they forget the other device in that same scene: his sailors' ears get stopped up with wax so they can't even perceive the temptation in the first place. Two genuinely different strategies for the same problem. Can you write me a story, near-future or otherwise, where some modern descendant of a "Ulysses contract" -- a psychiatric advance directive, an entrenched "eternity clause" that a constitution walls off from amendment, whatever fits best -- uses both strategies at once on different people (or different parts of one system), and the plot turns on the akward moment someone realizes which of the two they were subjected to, and starts wondering whether it was ever really "them" who agreed to it. Doesnt need a tidy ending, a page or two is plenty.
