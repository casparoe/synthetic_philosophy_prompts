      *   *Point 2: Personal Identity (Bodily Continuity).*
          *   Reference "The Concept of a Person."
          *   Identity requires spatio-temporal continuity of the body.
          *   A chatbot is a *record* or a *pattern*, not a body.
          *   Therefore, ontologically, it's a fancy photo album, not a person.
      *   *Point 3: The "New Wrinkle" (Interactivity).*
          *   Does interactivity change things?
          *   Ayer would argue it changes the *psychological impact*, not the *logical status*.
