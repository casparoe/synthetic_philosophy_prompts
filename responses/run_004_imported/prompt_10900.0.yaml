answer: |-
  **The Convention of Coin and the Nature of Need: Reconciling Nicomachean Ethics V.5 and Politics I**

  The transition from the *Nicomachean Ethics* (NE) to the *Politics* often presents students of Aristotle with a jarring shift in tone and metaphysical commitment. In NE V.5, Aristotle offers a sophisticated, almost proto-economic account of reciprocal justice, grounding exchange in human need (*chreia*) and treating money (*nomisma*) as a conventional (*nomos*) proxy that renders disparate goods commensurable. Yet, in *Politics* I, when condemning the unnatural pursuit of wealth (*chrematistike*) and specifically lending at interest (*tokos*), Aristotle appears to rely on a robust naturalism, claiming money is "barren" by nature and cannot legitimately breed. The interpretive puzzle lies here: if money is merely a convention in the *Ethics*, how can it possess a nature in the *Politics* that can be violated? Does the admission in NE V.5 that money is an imperfect, conventional measure strengthen the argument against usury by clarifying its proper function, or does it undermine the argument by collapsing the nature/convention distinction required to condemn interest as unnatural?

  To resolve this, we must first articulate the strongest version of the reading on which the NE concession strengthens the *Politics* argument. On this view, the "unnaturalness" of usury is not a claim about the metallurgical properties of coinage, but a claim about human teleology. NE V.5 establishes that the *telos* of money is to represent *chreia* (need). Money is a "guarantee of future exchange," a token that allows a shoemaker and a housebuilder to equate their labor relative to their mutual requirements. The concession that money is conventional does not mean it is arbitrary; rather, it means its validity is contingent upon its success in tracking need.

  From this perspective, the vice of *chrematistike* identified in *Politics* I is precisely the error of reifying the convention. The usurer treats the token (*nomisma*) as if it were the reality (*chreia*). By seeking to generate more money from money, the lender severs the link between the medium and the need it was instituted to serve. The NE account strengthens the *Politics* condemnation because it provides the philosophical machinery to explain *why* treating money as an end is a category mistake. If money is merely a convention established to solve the problem of commensurating need, then accumulating it beyond the limit of need is not just greed; it is a functional absurdity. The "unnatural" element is not that coins lack biological reproductive organs, but that the human activity of wealth-getting has been detached from the natural limit of household sufficiency. Thus, the NE concession strengthens the argument by shifting the burden of "nature" from the object (the coin) to the agent (the human user), making the condemnation of usury a critique of misplaced desire rather than a claim about sterile metal.

  However, the strongest version of the opposing reading suggests that the NE concession quietly undermines the *Politics* argument by exposing its reliance on a misleading metaphor. In *Politics* I.10, Aristotle argues that usury is "most contrary to nature" because money was intended for exchange, not increase, and likens interest to offspring (*tokos*), noting the absurdity of inanimate objects breeding. This argument requires a stable distinction between what money *is* by nature and how it is *used* by convention. But NE V.5 explicitly states that money exists by convention (*nomos*) and not by nature (*physis*), and that the commensuration it achieves is not "fully real."

  If money is fundamentally a creature of *nomos*, then its "function" is also determined by *nomos*. If a community agrees by convention that money should bear interest, on what grounds can Aristotle call this "unnatural"? The NE account suggests that the value and function of money are fluid, dependent on social agreement and the fluctuating metric of need. By admitting this, Aristotle pulls the rug out from under the *Politics* claim that there is a fixed, natural boundary that interest crosses. The biological analogy of sterility appears particularly vulnerable here: if money is a convention, comparing it to a biological organism is a category error. The "Undermines" reading posits that Aristotle wants to have it both ways: he needs money to be flexible enough to measure shoes and houses (NE), but rigid enough to have a natural limit that prohibits interest (Pol). The NE concession reveals that the "natural limit" is not inherent in the currency but is a moral preference Aristotle is projecting onto the currency. Consequently, the condemnation of usury risks appearing as an arbitrary defense of traditional agrarian values disguised as metaphysical necessity.

  Having set out these competing interpretations, a definite verdict is required. The tension between these texts is genuine, but it is resolvable if we accept a hybrid verdict: **The admission in NE V.5 undermines the literal biological analogy of sterility in *Politics* I, but it strengthens the functional teleological critique of *chrematistike*, provided we reinterpret "nature" in the *Politics* as referring to human need rather than coinage.**

  Specifically, the NE concession forces us to discard the claim that money has a *physical* nature that prohibits interest. Aristotle's assertion that money is "barren" is rhetorically powerful but metaphysically weak in light of NE V.5. If money is *nomos*, its capacity to "breed" is determined by legal and social structures, not biology. To claim interest is unnatural because coins do not reproduce is to confuse the symbol with the substance. Therefore, the specific argument in *Politics* I.10 that relies on the sterility of metal **does not survive** scrutiny from NE V.5. It is a rhetorical flourish that contradicts the sophisticated conventionalism of the *Ethics*.

  However, the core ethical argument of *Politics* I **does survive** and is indeed strengthened by NE V.5, provided we relocate the "nature" in question. The "nature" that usury violates is not the nature of the coin, but the nature of human *chreia*. NE V.5 establishes that *chreia* is the only real common measure. *Politics* I establishes that the household has a natural limit defined by the satisfaction of that *chreia*. When these two arguments are synthesized, the condemnation of usury becomes robust: usury is unnatural not because coins cannot breed, but because the pursuit of unlimited monetary increase is incompatible with the natural limit of human need. The NE account explains *why* money is subordinate to need (it is merely its convention stand-in), and the *Politics* account explains *why* violating that subordination is vicious (it destroys the self-sufficiency of the household).

  Therefore, the verdict is that the NE concession undermines the *metaphysical justification* for the ban on usury (the sterility argument) but validates the *ethical conclusion* (the critique of unlimited accumulation). Aristotle's argument in *Politics* I is only coherent if read through the lens of NE V.5. Without the NE account of *chreia*, the *Politics* distinction between natural and unnatural wealth-getting rests on a dubious biological analogy. With the NE account, the distinction rests on a defensible teleology of human action. We must conclude that Aristotle's condemnation of interest is not a discovery about the properties of currency, but a normative claim about the proper ordering of human desire. The "unnaturalness" of usury is that it treats a conventional means (money) as a natural end, thereby obscuring the true natural end: the satisfaction of need within a political community. The tension between the texts thus serves not to contradict, but to refine: the *Ethics* provides the epistemology of money, while the *Politics* provides the ethics of its use. Only by accepting the conventional status of money in NE V.5 can we fully understand why treating it as a natural source of generation in *Politics* I is the ultimate practical error.
