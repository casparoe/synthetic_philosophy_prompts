      *   Character: Kael, the Apprentice/Successor.
      *   Goal: Transfer the "Seal of Verification."
      *   Conflict: The ritual of transfer requires Elara to prove Kael will never seal a falsehood.
      *   The Twist/Block: She realizes she can't prove that without breaking the logic of the Seal itself.

  5.  **Drafting - Incorporating the Logic:**
      *   Elara needs to assert: $\forall \phi, \text{Provable}_\text{Kael}(\phi) \implies \phi$.
      *   If she asserts this, she can prove any $\phi$ (via Löb).
      *   She needs to show that copying her logic isn't enough.
      *   She needs to show that blind trust is dangerous.

  6.  **Writing - Attempt 1 (Mental Outline):**
      Elara stands before the Gate. Kael waits. She holds the key. She needs to program the key to accept Kael's proofs. She tries to write the rule: "Accept what Kael proves." She runs the simulation. The system crashes/paradoxes. She realizes Kael can't be *just* her. He must be weaker, or she must accept uncertainty. She hands over the key but warns him the chain is broken.

  7.  **Refining for the Prompt:**
      *   Need to make sure the *why* is clear. Why can't she trust him? Because if she does, she proves everything.
      *   Need to avoid "AI goes rogue." Kael isn't evil. The *logic* is the barrier.
      *   Word count: ~700 words.

  8.  **Drafting - The Story:**
      *   Title: The Inheritance of Proof.
