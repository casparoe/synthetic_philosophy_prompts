  9.  **Writing the Content (incorporating sensory details and stakes):**
      *   Focus on the tension of the transfer.
      *   The "machine" or "logic" speaks back.
      *   The realization that perfection is impossible.

  10. **Review against constraints:**
      *   Löbian obstacle central? Yes.
      *   Not generic rogue AI? Yes, Kael is willing, the logic is the blocker.
      *   Easy fixes shown to fail? Yes (copying logic doesn't work).
