answer: |-
  **The Debate of the Two Eyes**
  **Setting:** *The assembly hall of King Vikramāditya, Ujjain. Late afternoon. The air is thick with sandalwood smoke and the silence of two hundred scholars. A pile of gold coins sits before the royal throne—the prize for the victor. To the right stands Vardhamāna, the Naiyāyika, ochre-robed, ash on his forehead. To the left stands Prajñā, the Buddhist logician, shaved head, saffron robes. The Royal Preceptor sits between them as arbiter.*

  **Vardhamāna (Nyāya):** Honorable Assembly, King of Kings. My opponent claims that perception is merely the flash of a unique particular, and that what we call a "universal" is merely the exclusion of what a thing is not (*apoha*). I ask him this: To exclude "non-cow," must one not first grasp the locus of that exclusion? If I say "this is not a horse," I must already possess the positive content of "horse" to perform the exclusion. If *apoha* is the meaning of a word, does the mind not require a positive ground upon which to paint this negation? You claim to dispense with real universals, yet your theory of exclusion covertly borrows the very generality it seeks to destroy.

  **Prajñā (Buddhist):** The Logician mistakes the shadow for the substance. We do not posit a positive ground. We posit a causal efficiency (*arthakriyā*). A particular is known because it performs a function. The "universal" is a mental construction imposed upon a flux of unique moments (*svalakṣaṇa*). But let us turn to the Logician's own metaphysics. You claim a universal "cowness" resides in the individual cow via the relation of inherence (*samavāya*). I ask: Is this inherence distinct from the universal and the particular, or identical? If distinct, what ties the inherence to the particular? You will need another inherence to tie the first inherence to the cow. And another to tie that one. You have built an infinite regress (*anavasthā*) to explain a simple recognition.

  **Vardhamāna:** A clever trap, but it snaps on empty air. Inherence is not a separate entity requiring a further connector. It is *svataḥ-siddha*—self-established. Just as light illuminates itself while illuminating others, *samavāya* links the universal to the particular by its very nature. It does not require a second link to bind it, for it is the *mode* of binding itself. To ask what ties the tie is to misunderstand the category. It is eternal, one, and indivisible. Your regress dissolves because the chain stops at the nature of relation itself.

  **Prajñā:** To call it "self-established" is to name the mystery, not solve it. If the relation is real, it must be cognized. If it is cognized, it is an object of awareness. If it is an object, it requires a relation to be known. You multiply entities without necessity (*gaurava*). Why posit a real "cowness" and a real "inherence" when the mind can simply group distinct particulars based on similar causal powers? We do not need a metaphysical glue to explain why we fetch water when thirsty. We need only the memory of past satisfaction associated with similar forms.

  **Vardhamāna:** Memory requires a subject who recognizes the similarity. If every moment is unique, as you claim, then the water-moment of yesterday is not the water-moment of today. How does the thirst of *this* moment find satisfaction in the water of *that* moment without a stable class "water" that persists? Successful action (*pravṛtti-sāmarthya*) depends on recognition (*pratyabhijñā*). I recognize the jar. I reach for it. If the jar were merely a unique particular vanishing in the next instant, and "jar-ness" merely a fiction, my action would be groundless. I would be reaching for a ghost.

  **Prajñā:** You conflate perception with conception. Perception (*pratyakṣa*) grasps the unique particular in the present moment. It is indeterminate (*nirvikalpaka*). It is pure contact. The recognition you speak of—"This is that jar"—is conceptual construction (*kalpanā*). It is memory superimposed on perception. Is it veridical in the ultimate sense? No. It is a useful error (*bhrānti*). Just as a man mistakes a fire-mist for a jewel and acts to seize it, we mistake a flux of moments for a stable object. The action succeeds not because the object is real, but because the causal sequence is uninterrupted.

  **Vardhamāna:** If your successful action rests on error, then your own doctrine rests on error. You speak to me now. You use the word "moment." You use the word "causal." If these are merely useful fictions, then the proposition "all things are momentary" is itself a fiction. If it is true, it must be stable. If it is stable, it contradicts your doctrine of flux. You saw off the branch upon which you sit. To debate me, you must assume the very universals and stable meanings you deny.

  **Prajñā:** The Logician demands ontological weight where only pragmatic weight is needed. My words are a raft. They carry one across the river of suffering, but they are not the shore. I use "moment" conventionally (*saṃvṛti*) to point toward the nature of experience. You demand that the map be the territory. I say: The map burns itself up once the territory is seen. Your "stable meanings" are chains that bind the mind to the illusion of permanence. I offer a logic that liberates, not one that reifies.

  **Vardhamāna:** Liberation through denial of the world is a escape, not an epistemology. We seek to know the world as it is so we may act rightly within it. If I see a snake and a rope, I must distinguish them. If "snake" and "rope" are merely exclusions of the other, with no positive essence to grasp, then in the twilight of doubt, I may die. Real universals allow for real distinction. Your *apoha* leaves us in a fog of negations. I say perception is determinate (*savikalpaka*) because the world presents itself to us qualified by real kinds. The cow is *known* as a cow, not merely as "not a non-cow."

  **Prajñā:** And I say that when you strip away the name, the form, and the concept, what remains is the bare particular. That is the only reality. Your "real kinds" are projections of language onto the silence of things. You win the debate only by shouting louder than the silence.

  **Vardhamāna:** Then your silence cannot speak. And if it cannot speak, it cannot teach.

  *(The two stand locked, the Logician's hand raised in gesture of inference, the Buddhist's eyes lowered in meditative focus. The sun dips below the horizon of the court.)*

  **The Royal Preceptor:** *(Rising slowly)* The sun has set. The arguments are sharp as razors on both sides, yet neither draws blood conclusive enough to end the life of the other's view. The regress of inherence remains a thorn in the side of the Realist; the presupposition of exclusion remains a thorn in the side of the Nominalist.

  **King Vikramāditya:** *(Gesturing to the gold)* The coins remain. The debate is adjourned until the morning bell. Let both scholars retire. The truth, it seems, requires more light than a single day can provide.

  *(The assembly murmurs as the scholars bow to the throne, neither looking at the other, and retreat to their respective quarters. The question hangs in the incense-heavy air, unresolved.)*
