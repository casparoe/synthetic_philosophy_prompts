answer: |-
  This is a fantastic question. Since you work with Bayesian mechanics daily, you've spotted the exact friction point where the *math* works perfectly but the *epistemology* (the theory of knowledge and belief) starts to creak.

  You are absolutely right about the math. If $P(E) = 1$, then $P(H|E) = P(H)$. The posterior equals the prior. No confirmation occurs.

  The reason this is a "hard problem" rather than a "user error" is that it strikes at the definition of what Bayesian updating is actually supposed to model. Is it a tool for calculating optimal parameters given a dataset? Or is it a normative theory of how a rational agent's beliefs should change over time?

  Here is why the "Problem of Old Evidence" (POE) is genuinely difficult, why the "just change the prior" fix is unsatisfactory, and how logical omniscience is the ghost in the machine.

  ### 1. The Core Tension: Diachronic vs. Synchronic
  In your day-to-day work, you likely treat Bayesian inference **synchronically**. You have a dataset $D$ (which is fixed) and you update your parameters $\theta$. It doesn't matter if you collected $D$ yesterday or ten years ago; you condition on it.

  However, in philosophy of science, Bayesianism is often treated **diachronically**. It is a theory of *learning*. The rule is: "When you learn new evidence $E$, update your prior $P_{old}$ to posterior $P_{new}$."

  The POE arises because, in the GR/Mercury case:
  1.  At time $t_1$, scientists know $E$ (Mercury's orbit). So $P_{t_1}(E) = 1$.
  2.  At time $t_2$, Einstein proposes $H$ (General Relativity).
  3.  Scientists realize $H$ entails $E$.
  4.  They want to update their belief in $H$ based on $E$.

  But diachronically, they cannot update on $E$ at $t_2$, because they didn't *learn* $E$ at $t_2$. They learned it decades ago. If you strictly follow the rule "only update on newly learned evidence," $E$ is inert. It cannot boost the probability of $H$, even though intuitively (and historically), it clearly did.

  ### 2. Why the "Obvious Fix" Fails
  Your intuition is the standard first-line defense: *"Well, obviously you shouldn't set $P(E)=1$. You should reconstruct what your prior would have been before you knew $E$."*

  This is called the **Counterfactual Prior** strategy. You try to "unlearn" $E$ to see how much $H$ would have predicted it. This runs into three major walls:

  #### A. The "Ur-Prior" is Mythical
  To do this, you need to reconstruct a probability distribution for a state of the world where you *don't* know $E$. But human belief isn't a save file you can reload.
  *   How much did people *really* believe about Mercury's perihelion before they measured it?
  *   More importantly, $H$ (General Relativity) **did not exist** at that time.
  *   If you go back to the time before $E$ was known, $H$ wasn't on the table. So $P(H)$ was effectively undefined or zero. You can't calculate a likelihood ratio $P(E|H)/P(E)$ if $H$ isn't in the hypothesis space yet.

  #### B. Arbitrariness
  If I tell you, "Pretend you don't know $E$," there is no unique way to do that.
  *   Do I keep my background knowledge of Newtonian physics?
  *   Do I keep my knowledge of telescope calibration?
  *   Depending on how I reconstruct that "ignorant" state, I can make the confirmation strength of $E$ for $H$ come out to almost any number I want. This makes the confirmation subjective in a way that undermines the objective feel of scientific evidence.

  #### C. It Confuses Prediction with Explanation
  The reason GR was confirmed by Mercury wasn't just that it *predicted* the number. It was that it *explained* why the number was what it was using a new conceptual framework (curved spacetime).
  The counterfactual prior approach reduces confirmation to "how surprised would I have been?" But scientists weren't surprised by Mercury's orbit (they knew it). They were surprised that *GR fit it*. The "fix" tries to model surprise about the data, but the actual cognitive shift was surprise about the *theory's capability*.

  ### 3. The Logical Omniscience Connection (The Bonus)
  This is where the problem gets deep. You hit the nail on the head: POE is essentially a symptom of the assumption of **Logical Omniscience**.

  Standard Bayesian epistemology assumes that if an agent believes $H$, and $H$ logically entails $E$, the agent *automatically* assigns probability 1 to $E$ (or at least, $P(E) \geq P(H)$). It assumes we know all the logical consequences of our beliefs instantly.

  **The Reality:**
  Humans are not logically omniscient.
  1.  At $t_1$, we know $E$.
  2.  At $t_2$, we propose $H$.
  3.  At $t_3$, we **discover** the logical proof that $H \rightarrow E$.

  In standard Bayesianism, there is no mechanism for step 3.
  *   If you know $H$, you must already know $E$ (Omniscience).
  *   If you know $E$, $P(E)=1$, so you can't update on it.

  The POE highlights that scientific progress often involves **learning logical relationships**, not just learning empirical data. When Einstein showed that GR entailed the Mercury anomaly, scientists learned a *mathematical fact* about the theory, not a new *physical fact* about Mercury.

  Standard Bayes has a slot for $P(E|H)$ (the likelihood), but it assumes that value is fixed by logic. It doesn't have a slot for "updating your belief in the proposition that $H$ entails $E$."

  ### 4. How Philosophers Try to Solve It (and why it's still debated)
  Since you like the mechanics, you might appreciate the proposed technical fixes. They usually involve expanding the sample space.

  **The Garber Solution (1983):**
  Daniel Garber suggested we shouldn't condition on $E$ (the data). We should condition on the *logical relation*.
  Let $L$ be the proposition: "$H$ entails $E$."
  *   Before the math was done, $P(L) < 1$. (Scientists weren't sure GR could solve Mercury).
  *   After the math was done, they learned $L$. So $P(L)$ goes to 1.
  *   You update on $L$, not $E$.
  *   **Result:** $P(H|L) > P(H)$.

  **Why this is still tricky:**
  To make this work mathematically, you have to violate the standard axiom of logical omniscience. You have to allow a Bayesian agent to assign a probability less than 1 to a logical truth (like $H \rightarrow E$) before they prove it. This requires "non-ideal" Bayesianism, which complicates the neat coherence theorems that make Bayesianism attractive in the first place.

  ### Summary for a Practitioner
  For your work in applied statistics, you can safely ignore this. You are doing **inductive inference within a fixed model space**. You condition on all available data $D$ regardless of when it was collected. In that context, $P(D)=1$ is just a normalization constant, and the likelihood $P(D|\theta)$ does all the work. The "time" of the data doesn't matter.

  But for the **Philosophy of Science**, the POE is a massive headache because:
  1.  It suggests standard Bayes cannot model the *discovery of explanations*, only the *discovery of data*.
  2.  The "fix" (counterfactual priors) requires simulating a history that never happened, introducing subjectivity.
  3.  It exposes that standard Bayesian agents are assumed to be logically omniscient, whereas scientific progress is often the process of overcoming logical ignorance.

  The problem isn't that the math is wrong; it's that the standard Bayesian model of "belief" is too static to capture the dynamic process of a human realizing, "Oh my god, this new equation explains that old number."
