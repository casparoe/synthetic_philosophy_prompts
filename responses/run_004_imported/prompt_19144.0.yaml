prompt: |-
  So I do a bunch of Bayesian stuff at work (updating priors on model params, the usual posterior/likelihood business) and I feel pretty solid on the basic mechanics of it. But I went down a rabbit hole recently and ran into this thing called the "problem of old evidence" in philosophy of science, and its bugging me. As I understand it: if some evidence E was already known before a theory H was even proposed (classic case being Mercury's orbit before general relativity), then P(E) is already sitting at 1 in your model, so naively E can't raise P(H) at all -- yet obviously scientists treated the Mercury thing as a massive point in favor of GR. Can you explain why this counts as a genuinely hard problem for Bayesians, rather than just "well, you should've assigned a lower prior to E to begin with, you just didn't know better yet" -- and walk me through why that obvious fix runs into trouble? Bonus if you can get into how this connects (or doesn't) with the idea that Bayesian agents are supposed to be logically omniscient.
reasoning: |-
  Here's a thinking process that leads to the explanation of the "Problem of Old Evidence":

  1.  **Deconstruct the User's Query:**
      *   **Background:** The user works with Bayesian statistics (priors, posteriors, likelihoods) and feels solid on the mechanics.
      *   **The Issue:** They encountered the "Problem of Old Evidence" (POE) in philosophy of science.
      *   **The Core Paradox:** If evidence $E$ is known before theory $H$ is proposed, $P(E) = 1$. By Bayes' Theorem, $P(H|E) = P(H) \cdot P(E|H) / P(E)$. If $P(E)=1$ and $H$ entails $E$ (so $P(E|H)=1$), then $P(H|E) = P(H)$. The evidence doesn't confirm the hypothesis. But historically (e.g., Mercury's perihelion & General Relativity), old evidence *does* seem to confirm new theories.
      *   **The Specific Question:** Why is this a *hard* problem? Why isn't the fix just "you should have assigned a lower prior to $E$"? Why does that fix fail?
      *   **Bonus:** Connect this to "logical omniscience."

  2.  **Initial Assessment & Tone:**
      *   The user is technically competent ("do a bunch of Bayesian stuff at work"). I don't need to explain Bayes' Theorem itself. I need to focus on the *interpretational* and *foundational* issues.
      *   Tone should be respectful, engaging, and precise. Avoid oversimplification but clarify the philosophical nuance.
      *   Key distinction: Applied Bayesian statistics (where we often condition on data regardless of timing) vs. Normative Bayesian Epistemology (where probability represents rational degree of belief over time).

  3.  **Drafting the Core Argument (The "Why it's hard" part):**
      *   *The Naive Calculation:*
          *   Bayes: $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$.
          *   Scenario: $E$ is known at time $t_0$. $H$ is proposed at $t_1$.
          *   At $t_1$, the agent knows $E$. So $P_{t_1}(E) = 1$.
          *   If $H$ entails $E$, $P_{t_1}(E|H) = 1$.
          *   Result: $P_{t_1}(H|E) = P_{t_1}(H)$. No confirmation.
      *   *The "Obvious Fix" (Counterfactual Prior):* "Just pretend you didn't know $E$ when setting the prior."
      *   *Why the Fix Fails:*
          1.  **Subjectivity/Arbitrariness:** How do you reconstruct the prior? There is no unique "ignorant" state. Different reconstructions yield different confirmation values.
          2.  **The Timing Issue:** Bayesian updating is supposed to be diachronic (over time). If you update on $E$ *before* $H$ exists, you can't update on it *again* when $H$ arrives.
          3.  **The "Static" vs. "Dynamic" Tension:** In practice, statisticians condition on all data. In philosophy, we care about *learning*. If you already know $E$, learning $H$ explains $E$, but doesn't change your belief in $E$. The confirmation is about the relationship between $H$ and $E$, not the probability of $E$ itself.

  4.  **Addressing the "Logical Omniscience" Bonus:**
      *   Standard Bayesianism assumes agents know all logical consequences of their beliefs.
      *   If $H$ entails $E$, and I believe $H$, I *must* believe $E$ (probability 1).
      *   But if I already believe $E$ (probability 1) before $H$, the link is severed.
      *   The POE highlights that real humans aren't logically omniscient. We discover logical connections (like $H \to E$) over time. Standard Bayesianism doesn't have a clean slot for "learning a logical implication."

  5.  **Structuring the Response:**
      *   **Introduction:** Validate the user's intuition. Yes, the math looks trivial, but the epistemology is messy.
      *   **The Formal Problem:** Briefly state the math they already know to set the stage (P(E)=1 implies no update).
      *   **Why the "Just Change the Prior" Fix Fails:**
          *   Problem 1: The "Ur-Prior" is mythical.
          *   Problem 2: Diachronic coherence (you can't un-know things).
          *   Problem 3: It makes confirmation relative to a fictional history, not actual rationality.
      *   **The Logical Omniscience Connection:** Explain how POE is a symptom of the assumption that agents know all logical truths immediately.
      *   **Proposed Solutions (Briefly):** Mention Garber's solution (conditionalizing on the logical relation) or counterfactual priors, just to show it's an active field.
      *   **Practical vs. Philosophical:** Reassure the user that for *work*, this doesn't break their models, but for *theory of science*, it's a big deal.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I distinguish between $P(E)$ as a physical frequency (not relevant here) and $P(E)$ as a degree of belief. The user knows this, but clarity helps.
      *   *Nuance:* The "fix" isn't just "assign a lower prior." It's "assign a lower prior *at the time before you knew E*." But if $H$ didn't exist then, how do you evaluate $P(H)$?
      *   *Key Insight:* The problem is that Bayesianism is a theory of *learning*. If you don't learn $E$ (because you already know it), you can't update on it. But science *feels* like we learn something when GR explains Mercury. We learn the *explanatory connection*. Standard Bayes doesn't capture "learning a connection," only "learning data."

  7.  **Final Polish:**
      *   Ensure the Mercury/GR example is used effectively.
      *   Check the tone: Peer-to-peer, not lecture-y.
      *   Make sure the Logical Omniscience point lands clearly.

  8.  *(Final check of the prompt requirements)*:
      *   Explain why it's hard.
      *   Explain why the obvious fix fails.
      *   Connect to logical omniscience.
      *   Acknowledge user's background.

