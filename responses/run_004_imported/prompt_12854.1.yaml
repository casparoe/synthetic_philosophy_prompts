      *   *Decision:* The most honest answer for a scientist is that the *biological reality* is a continuum, but the *legal concept* forces a binary. The two tests are trying to find the binary switch in an analog system, but they are flipping different switches.

      *(Self-Correction during drafting)*: Wait, the prompt asks: "Is there really one coherent concept... or have we got two unrelated, practically-motivated stopping points?"
      *   I need to take a stance or weigh the evidence heavily.
