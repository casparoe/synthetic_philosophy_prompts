      *   **The "Critical Function" Argument:** The brain isn't just *an* integrator; it's the *critical* integrator that makes the body an *animal* rather than a *plant* or a *culture*.
      *   **The Pragmatic vs. Ontological Tension:** Admit that there *is* a divergence. The criteria were adopted partly for organs (Harvard Committee 1968). But is there a philosophical salvage?
      *   **The "Loss of Capacity for Consciousness" vs. "Loss of Integration":** This is a crucial split. WBD was sold as "integration," but often functions as "personhood."
