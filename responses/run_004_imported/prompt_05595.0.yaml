      *   **Ibn Rushd:** Defender of Aristotelian metaphysics. Emphasizes the intelligibility of the world, the reality of natures (*ṭabāʾiʿ*), and secondary causation as a reflection of God's wisdom. Argues that denying causes makes knowledge impossible.

