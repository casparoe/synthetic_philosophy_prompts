      *   **Explain the Risk:** Detail *why* it matters (reputation, reader trust, potential scandal).
      *   **Offer Solutions/Compromises:** How to support the friend without lying or overstepping.
          *   Focus on the *power* of the story rather than the *factuality*.
          *   Phrase it as "feels true" or "resonates with truth."
          *   Ask to see the diaries (if possible).
          *   Have a honest conversation with the friend.

  6.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Empathetic, professional, ethical, nuanced.
