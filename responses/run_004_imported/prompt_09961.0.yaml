  8.  **Final Polish:** Check for clarity, empathy, and strength of argument. Ensure the distinction between subjective and objective claims is clear. (The resulting output matches the detailed response provided previously.)
answer: |-
  You are drawing a very real distinction, and you are right to hesitate. This is not squeamishness; it is professional integrity.

  As a novelist, your name is your brand, and your credibility is your currency. When you write a blurb, you are engaging in two different types of speech, and you have correctly identified that they carry different weights.

  ### 1. Subjective Opinion vs. Objective Fact
  When you describe the prose as "luminous" or the pacing as "masterful," you are offering a **subjective aesthetic judgment**. No one can prove you wrong. If a reader finds the prose dull, they simply disagree with your taste. There is no factual liability there.

  However, when you endorse the claim that "these events actually occurred," you are making an **objective factual claim**. You are attesting to the provenance of the material. If it is later discovered that the diaries were embellished, fabricated, or misinterpreted (which happens more often in publishing than we like to admit), your endorsement becomes part of the deception. You are no longer just a critic; you are a witness. Since you have not seen the evidence (the diaries), you cannot ethically testify to their authenticity.

  ### 2. The Risk of the "Truth Scandal"
  Publishing history is littered with memoirs and "true stories" that were later debunked (e.g., James Frey's *A Million Little Pieces*, Binjamin Wilkomirski's *Fragments*, or more recently, various "influencer memoirs"). When these scandals break, the fallout doesn't just hurt the author and the publisher. It also tarnishes the reputations of those who vouched for the book.

  Reviewers and readers will ask: *"Did [Your Name] not know? Were they duped, or were they complicit?"* Even if you were merely trusting your friend, the public perception may be that you were careless with the truth. Given that you have no independent means of verification, taking that risk is unnecessary.

  ### 3. The "Everyone Else Is Doing It" Fallacy
  You mentioned that other novelists have agreed to this without a second thought. There are several reasons why you should not let this sway you:
  *   **They may have seen the source material.** They might have been shown the diaries or correspondence.
  *   **They may have different risk tolerances.** Some authors are less concerned with factual precision than others.
  *   **They may be wrong.** Just because colleagues are willing to blur the line between fiction and nonfiction doesn't mean it is safe for you to do so.

  ### 4. Navigating the Friendship
  This is the delicate part. You trust your friend, and you want to support her. However, a true friend should not want you to compromise your professional integrity. She may not realize the weight of what she is asking; to her, the truth is obvious, so she assumes verifying it is unnecessary.

  You can support the book enthusiastically without validating the facts you haven't seen. Here are three ways to handle this:

  **Option A: The Pivot (Recommended)**
  Write a blurb that speaks to the *power* of the story's truth without explicitly certifying the *facts*.
  *   *Instead of:* "A harrowing true story that really happened."
  *   *Try:* "A story that resonates with such profound truth, it feels impossible to imagine it any other way." or "A narrative of such raw honesty that it transcends the page."
  *   *Why:* This praises the *effect* of the truth on the reader (which you can judge) rather than the *origin* of the truth (which you cannot).

  **Option B: The Verification**
  Ask your friend if you can see the diaries or the archival material.
  *   *Say:* "I would love to vouch for the authenticity, but for my own peace of mind and professional standards, I need to see the source material before I can certify it as fact."
  *   *Why:* If she agrees, you solve your ethical problem. If she hesitates or refuses, you have your answer about the risk level.

  **Option C: The Honest Conversation**
  Tell her gently that while you believe her completely, your professional policy is not to verify facts you haven't seen personally.
  *   *Say:* "I believe you implicitly. But as a public figure, I have to be careful about attesting to facts I haven't verified myself. I want to write a blurb that champions the book without putting us both in a precarious position if historians or critics ever question the archives."

  ### Summary
  Your instinct is a protective mechanism. It is protecting your reputation, your relationship with your readers, and ultimately, your friendship. If the book turns out to be exactly as described, your nuanced blurb will still have sold books. If the book turns out to be problematic, your nuanced blurb will have saved your career.

  Stand your ground. You can be a loyal friend and a rigorous professional at the same time. In fact, being rigorous is the best way to be a loyal friend in the long run.
