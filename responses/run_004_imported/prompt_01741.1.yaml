      *   *The "Gibbard Phenomenon":* This is the knockout punch against a unified truth-conditional semantics. Allan Gibbard showed that if indicatives have truth conditions compatible with standard logic, paradoxes arise. This led to Adams' probabilistic approach (indicatives aren't true/false, they have assertability conditions).
      *   *Stalnaker's Unified Attempt:* Robert Stalnaker actually *tried* to unify them using possible worlds. His semantics for indicatives and counterfactuals are structurally similar but differ in the *selection function* constraints (specifically regarding the "actual world" and epistemic accessibility).
