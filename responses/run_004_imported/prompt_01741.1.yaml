answer: |-
  It is a pleasure to address a colleague who approaches philosophy with the disciplined intuition of an experimentalist. Your puzzle is well-founded: your intuition that indicatives and counterfactualals share a common cognitive engine is not only reasonable, it is shared by some of the most significant figures in the field. Frank Ramsey himself proposed the test that bears his name as a general account of conditionals, and Robert Stalnaker spent much of his career trying to build a unified semantics based on it.

  However, the divergence into two distinct semantic machinerys (Adams/Probability vs. Lewis/Stalnaker/Possible Worlds) was not an accident of philosophical fashion. It was forced by logical data that suggests the two constructions track fundamentally different cognitive tasks.

  Given your background in controlled experiments, I suspect the most satisfying explanation will not come from pure logic, but from **causal inference**. The split between indicative and counterfactual semantics mirrors the split between **conditioning on evidence** and **intervening on a system**.

  Here is why the frameworks resist reduction, why neither is universally agreed to be "more fundamental," and where the unification you seek might actually lie.

  ### 1. The Minimal Pair: Epistemic vs. Ontic
  To see why one framework cannot simply swallow the other, consider the classic "Kennedy Example" (attributed to Quine and developed by Adams):

  *   **Indicative:** "If Oswald didn't kill Kennedy, someone else did."
  *   **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have."

  Most competent English speakers accept the indicative as true (given the historical fact that Kennedy was killed) but reject the counterfactual as false (assuming there was no conspiracy).

  If both sentences were merely the Ramsey test applied to the same knowledge base, they should have the same truth value. You add "Oswald didn't kill Kennedy" to your beliefs and see if "Someone else did" follows. But they don't yield the same result. Why?

  *   The **Indicative** holds the *actual outcome* fixed and updates your *information state*. It asks: "Given what we know about the world (Kennedy is dead), what implies his death?"
  *   The **Counterfactual** holds the *laws of nature/causal structure* fixed and updates the *history*. It asks: "If we rewind the tape and change this variable, how does the system evolve?"

  In your experimental terms: The indicative is an analysis of the **observational data** (conditioning on the fact that the assay failed). The counterfactual is an analysis of the **experimental design** (predicting the outcome of a control group).

  ### 2. The Logical Divergence
  Philosophers built separate machinery because the two conditionals obey different logical rules.

  **Antecedent Strengthening:**
  *   **Indicatives:** Generally support strengthening. If "If it rains, the match will be cancelled" is true, then "If it rains and the wind blows, the match will be cancelled" is usually still true.
  *   **Counterfactuals:** Fail strengthening. "If I had struck the match, it would have lit" may be true. But "If I had struck the match and it was wet, it would have lit" is false.

  **The Gibbard Phenomenon:**
  In the 1980s, Allan Gibbard proved a devastating result for unified truth-conditional semantics. He showed that if indicative conditionals have standard truth conditions (i.e., they are simply true or false propositions like counterfactuals) and obey standard logical rules, paradoxes arise.
  This led to **Adams' Thesis**: Indicatives do not express propositions that can be true or false. Instead, they have *assertability conditions* based on conditional probability ($P(B|A)$). Counterfactuals, conversely, are generally treated as having truth conditions based on world similarity.

  Because one is probabilistic/epistemic and the other is truth-conditional/metaphysical, they cannot be notational variants of the same thing without breaking logic.

  ### 3. The Causal Bridge (For the Experimentalist)
  This is where your background offers the clearest resolution. In modern causal inference (pioneered by Judea Pearl and applied to philosophy by James Woodward and others), the distinction is formalized mathematically.

  *   **Indicatives correspond to Conditioning:** $P(\text{Failure} | \text{Contaminated})$.
      This relies on the joint probability distribution of observed variables. It captures correlations. If contamination and failure are correlated, the indicative is assertable.
  *   **Counterfactuals correspond to Intervention:** $P(\text{Failure} | do(\text{Contaminated}))$.
      This relies on the Structural Equation Model (the causal graph). It captures the mechanism.

  In a perfectly randomized controlled trial, $P(B|A) = P(B|do(A))$. In that specific, idealized context, your intuition holds perfectly: the two conditionals collapse into one.

  However, in the messy real world (and in natural language), correlation $\neq$ causation.
  *   "If the barometer is low, it is raining" (Indicative/Conditioning) is highly probable.
  *   "If the barometer were low, it would be raining" (Counterfactual/Intervention) is false. (Breaking the barometer doesn't cause rain).

  Philosophers maintain two semantics because natural language needs to track both **evidential support** (indicatives) and **causal dependency** (counterfactuals). A unified semantics would lose the ability to distinguish between a sign (barometer) and a cause (pressure system).

  ### 4. Which is More Fundamental?
  There is no consensus, but there are three main camps:

  1.  **The Metaphysical Primitivists (e.g., David Lewis):** Counterfactuals are fundamental. They describe the modal structure of reality. Indicatives are a degenerate case where we happen to know the actual world.
      *   *Critique:* Struggles to explain the probabilistic nature of indicatives (Gibbard).
  2.  **The Epistemic Primitivists (e.g., Dorothy Edgington):** Indicatives are fundamental to reasoning. Counterfactuals are a specialized tool for hypothetical reasoning.
      *   *Critique:* Struggles to explain the objective truth-conditions of causal claims.
  3.  **The Causal Primitivists (e.g., Interventionists):** Neither is fundamental; **causal structure** is fundamental. Both conditionals are derived from our mental models of causal mechanisms.
      *   *Indicatives* query the model using observational updates.
      *   *Counterfactuals* query the model using surgical interventions.

  ### 5. Why the Persistence?
  The two frameworks persist because they solve different problems.
  *   **Adams/Probability** explains why we bet on indicatives the way we do. (You wouldn't bet on the barometer conditional the same way).
  *   **Stalnaker/Lewis/Worlds** explains why counterfactuals feel objective and why they support scientific lawhood.

  **Stalnaker's Unified Attempt:**
  It is worth noting that Robert Stalnaker *did* attempt the unification you suggest. In his framework, both conditionals use a "selection function" to pick a possible world.
  *   For **Indicatives**, the selection is constrained to worlds compatible with what is *known*.
  *   For **Counterfactuals**, the selection is allowed to go outside the set of known worlds to worlds that are *similar*.

  This is likely the closest formal realization of your intuition. However, even Stalnaker had to admit that the constraints on the selection function differ enough that the logical behavior diverges (hence the Gibbard problem remains for the indicative side).

  ### Summary
  You are correct that the *psychological process* (the Ramsey test) is likely the same: we simulate a scenario and check the consequence.

  But philosophers distinguish the semantics because the **validity conditions** for that simulation differ.
  *   When speaking indicatively, we simulate within the bounds of **actual knowledge** (Epistemic).
  *   When speaking counterfactually, we simulate within the bounds of **causal laws**, even if they contradict knowledge (Ontic).

  As a scientist, you know that analyzing your dataset (indicative) is mathematically distinct from designing your control group (counterfactual). Philosophy of language has simply codified the fact that human language preserves this distinction, allowing us to talk about both what the data says and how the system works.
