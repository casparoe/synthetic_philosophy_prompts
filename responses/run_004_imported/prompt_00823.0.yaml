prompt: |-
  This has been bugging me for like a week. During a PR review my team lead ripped into me for merging a change with zero tests, called it sloppy and said it's 'not how we do things here.' Thing is, i went back through his last dozen or so PRs and he skips tests way more than i do. When i brought that up he just said 'me not doing it doesnt make it ok for you to not do it either,' and i didnt really have a comeback. Something about it still feels off to me though, i just cant put my finger on why. Am i just deflecting fair feedback here, or is there actually something wrong with him being the one to call me out on this?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **The Conflict:** The user merged a PR with zero tests. The team lead criticized them harshly ("sloppy," "not how we do things here").
      *   **The Observation:** The user noticed the team lead skips tests frequently in their own PRs.
      *   **The Confrontation:** The user pointed this out. The lead responded with "Me not doing it doesn't make it ok for you to not do it either."
      *   **The User's Reaction:** The user feels something is "off" but isn't sure if they are deflecting fair feedback or if the lead is being hypocritical/unfair.
      *   **The Core Question:** Am I deflecting, or is there something wrong with *him* calling me out?

  2.  **Deconstruct the Dynamics:**
      *   **Technical/Process Side:** Merging code without tests is generally considered risky in most professional software environments (unless it's a tiny config change, documentation, etc.). The lead is technically correct on the *principle*.
      *   **Leadership/Management Side:** The lead's behavior (skipping tests) contradicts the standard they are enforcing. This is hypocrisy.
      *   **Communication Side:** The lead "ripped into" the user. This suggests aggression or lack of psychological safety. The lead's comeback ("me not doing it...") is logically true but dismissive of the underlying trust/consistency issue.
      *   **User's Feeling:** The feeling of "offness" is valid. It stems from perceived inequity and lack of leading by example.

  3.  **Evaluate the "Deflection" vs. "Valid Concern" Argument:**
      *   *Is the user deflecting?* Partially. Pointing at the lead doesn't fix the fact that the user's PR lacked tests. That is a valid criticism to receive.
      *   *Is the lead in the wrong?* Also partially. Leaders should model behavior. If the standard is "tests required," the lead should write tests. If the standard is "tests sometimes optional," then the criticism should be nuanced, not absolute ("not how we do things here").
      *   *The "Off" Feeling:* This is likely due to the *power dynamic* and the *inconsistency*. It feels like "rules for thee, not for me."

  4.  **Formulate the Advice:**
      *   **Validate the User:** Acknowledge that their feeling is normal. It *is* frustrating when leaders don't walk the talk.
      *   **Separate the Issues:**
          1.  The Code (Tests): Was the criticism about the code valid? Yes, generally.
          2.  The Delivery (Tone): Was "ripped into" appropriate? Probably not.
          3.  The Consistency (Hypocrisy): Is the lead's behavior problematic? Yes.
      *   **Address the Lead's Comeback:** "Me not doing it doesn't make it ok for you" is logically true (two wrongs don't make a right), but it ignores the leadership responsibility to set the example.
      *   **Actionable Steps:**
          *   Own the mistake (the missing tests).
          *   Address the inconsistency professionally (not accusatorily).
          *   Seek clarity on the actual standard (when are tests optional?).
          *   Evaluate the culture (is this a one-off or a pattern of toxicity?).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Opening:* Validate the feeling. It's not just deflection.
      *   *The "Two Truths" Framework:* Truth 1: You should write tests. Truth 2: Leads should lead by example. Both can be true at once.
      *   *Analyzing the Lead's Response:* It's a classic "tu quoque" deflection, but from a manager. It shuts down conversation.
      *   *Why it feels off:* It's about trust and fairness. If rules are arbitrary, morale drops.
      *   *What to do:*
          *   Don't fight the past PR. Fix the process.
          *   Ask for clarification on *when* tests are optional. Maybe the lead has context (spikes, hotfixes) the user doesn't.
          *   Watch for patterns. Is the lead toxic or just overworked?
      *   *Closing:* Reassure the user that growth comes from this, but also protect their boundaries.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but objective.
      *   Avoid taking sides completely (don't say "your lead is a jerk," don't say "you're wrong").
      *   Focus on professional growth and navigating office politics.

  7.  **Key Insight to Add:** The difference between *authority* and *influence*. The lead has authority to enforce rules, but loses influence if they don't follow them. The user is reacting to the loss of influence/respect.

  8.  **Final Polish:** Check for clarity and structure. (Self-Correction: Make sure to explicitly mention that skipping tests *might* be justified in some contexts, which could explain the lead's behavior, but communication is key).

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  You are not just deflecting, but you also aren't entirely right. What you're feeling is a very common reaction to a breakdown in **psychological safety** and **leadership by example.**

  Here is the breakdown of why this feels "off," where you might be going wrong, and how to handle it.

  ### 1. The Two Truths
  There are two conflicting truths happening here, and acknowledging both is key to resolving your frustration.

  **Truth A: The Technical Standard**
  Your team lead is technically correct. In almost all professional engineering environments, merging code without tests (unless it's a trivial config change or hotfix) is risky. It creates technical debt and increases the blast radius of bugs. If the team standard is "tests required," then your PR was indeed non-compliant. Owning this is important for your growth.

  **Truth B: The Leadership Standard**
  Leaders are held to a *higher* standard, not a lower one. When a lead says, "This is not how we do things here," they are defining the culture. If they visibly violate that culture repeatedly, it signals that the rule is arbitrary or that there is a class system (rules for juniors, freedom for seniors). This erodes trust. Your feeling of unfairness is valid because **consistency creates trust.**

  ### 2. Why His Comeback Felt Weak
  His response ("Me not doing it doesn't make it ok for you") is logically true but leadership-wise poor.
  *   **Logically:** He's right. Two wrongs don't make a right. His mistakes don't justify yours.
  *   **Leadership-wise:** It's a conversation stopper. It dismisses your observation about team culture. A better leader would have said, *"You're right, I have been slacking on that lately and I need to do better. However, I need you to hold the line on tests so we can get back to our standard."*

  By shutting you down, he signaled that his authority supersedes the standard, which is exactly why you feel unsettled.

  ### 3. Are You Deflecting?
  **Partially.**
  It is natural to want to defend yourself when criticized. Pointing out his hypocrisy is a defense mechanism. If you focus *only* on his behavior, you miss the opportunity to improve your own craft. If you walk away thinking "He's a hypocrite, so I don't need to write tests," you lose.

  **But you aren't *just* deflecting.**
  You are reacting to an inconsistency in process. If tests are optional for him, why are they mandatory for you? Is it because of seniority? Time pressure? Type of work? Not knowing the *reason* for the double standard makes it feel like power tripping.

  ### 4. How to Handle This Moving Forward
  Don't let this fester. It will turn into resentment. Here is a strategy to fix the dynamic:

  **Step 1: Own your part (Disarm the conflict)**
  Next time you talk to him, validate his technical point.
  *"I've been thinking about your feedback on my PR. You were right. I should have included tests, and I understand why that creates risk for the team. I'm going to make sure that doesn't happen again."*
  This shows maturity and removes his ability to label you as "sloppy."

  **Step 2: Seek Clarification, Not Accusation (Address the inconsistency)**
  Instead of pointing out his failures, ask about the *policy*.
  *"I want to make sure I align with the team's standards. I noticed there are sometimes PRs merged without tests. Is there a specific criteria for when tests are optional? I want to make sure I'm not holding up velocity when tests aren't needed, but also not skipping them when they are."*
  This forces him to define the rule.
  *   If he says, "Tests are always required," he has to acknowledge he needs to follow his own rule.
  *   If he says, "It depends on the urgency," then you have a conversation about risk assessment.

  **Step 3: Evaluate the Culture**
  Watch his reaction to Step 2.
  *   **Good Sign:** He reflects, admits he's been cutting corners, and clarifies the expectation.
  *   **Bad Sign:** He gets defensive, angry, or doubles down on "I'm the lead, I decide."

  If it's the latter, you have learned something important about your management. It means the rules are indeed arbitrary. In that case, you protect yourself by following the rules strictly (to avoid being the scapegoat) while documenting your work, but you know that this environment may not be great for long-term growth.

  ### Summary
  You aren't crazy. It *is* off when leaders don't model the behavior they enforce. However, using his hypocrisy to excuse your own lack of tests will hurt your reputation more than his.

  **The winning move:** Be the person who writes the tests *and* professionally asks for clarity on the standards. That makes you the reliable one, and it highlights his inconsistency without you ever having to call him a hypocrite directly.
