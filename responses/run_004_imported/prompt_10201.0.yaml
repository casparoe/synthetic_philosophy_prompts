prompt: |-
  Hey, next month I'm interviewing a decision theorist for a piece on AI-doom folklore, and I finally want to do a real deep dive on Roko's basilisk instead of the usual "spooky AI god will simulate-torture you" framing. She works on updateless decision theory and has argued that the basilisk itself is a non-starter, but that its gesturing (badly) at a genuinely unsolved problem about acausal blackmail between agents. Can you draft me 8-10 interview questions that get past the "so what even is the basilisk" stage -- I want one on why a UDT agent's whole disposition to resist blackmail is supposed to make the threat empty in the first place, one on whether a "perfectly rational" future AI would even bother carrying out the punishment once the past is fixed and there's nothing causal left to gain, one that uses Parfit's hitchhiker to press on why "irrational-looking" follow-through can still be the winning move in these setups, and one on whether Yudkowsky banning discussion of it as an infohazard doesn't kind of undercut his own claim that it's just a confused argument. Give each question a quick follow-up keyed to the dodge she'll probably try.
