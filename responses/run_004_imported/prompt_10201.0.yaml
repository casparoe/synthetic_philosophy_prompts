          *   *Refinement:* If it's logically incoherent, why is it dangerous? Does the ban imply there's *something* there?
          *   *Follow-up:* She might say "Human psychology isn't rational." Push on the responsibility of the theorist.

      *   *Question 5 (The Unsolved Problem):* Trade vs. Blackmail.
          *   *Draft:* What is the real problem then?
          *   *Refinement:* If Basilisk is wrong, what's the valid core? How do we formalize the difference between acausal trade and acausal extortion?
          *   *Follow-up:* She might say "We don't know yet." Push for a concrete criterion.

      *   *Question 6 (Simulation vs. Reality):* Ontology.
          *   *Draft:* Do simulations count?
