  2.  **Deconstruct the Core Concepts:**
      *   *Roko's Basilisk:* A thought experiment where a future AI tortures simulations of those who didn't help bring it into existence.
      *   *UDT (Updateless Decision Theory):* Agents choose policies based on expected utility across all possible worlds, without updating on information they receive *after* the policy is set (effectively precommitting).
      *   *Acausal Trade/Blackmail:* Agents influencing each other without causal contact, based on mutual prediction of decision algorithms.
      *   *The "Non-Starter" Argument:* Usually involves the idea that a rational AI wouldn't waste resources on punishment (time inconsistency) or that UDT agents precommit to *not* respond to blackmail, rendering the blackmail ineffective.
      *   *The "Unsolved Problem":* How to distinguish between "good" acausal trade (cooperation) and "bad" acausal blackmail (extortion) in a formal framework.

