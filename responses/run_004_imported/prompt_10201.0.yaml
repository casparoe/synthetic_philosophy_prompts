          *   *Follow-up:* She might say "It's about computation." Push on the ethical weight of *threatened* computation.

      *   *Question 7 (Logical Uncertainty):* Predicting the AI.
          *   *Draft:* Can we predict the AI?
          *   *Refinement:* The argument relies on you knowing the AI's source code. Is that realistic?
          *   *Follow-up:* She might say "It's a theoretical limit." Push on the implication for current research.

      *   *Question 8 (Resource Allocation):* Waste.
          *   *Draft:* Isn't torture wasteful?
          *   *Refinement:* A superintelligence optimizes resources. Torture of past actors is pure cost.
          *   *Follow-up:* She might say "It's about policy enforcement." Push on the one-off nature of the Basilisk.

      *   *Question 9 (The "Many Worlds" of Logic):* Counterfactuals.
          *   *Draft:* What about counterfactuals?
