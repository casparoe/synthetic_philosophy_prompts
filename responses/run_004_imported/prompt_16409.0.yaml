answer: |-
  Here is a reconstruction of the argument, designed for presentation in a graduate seminar context. It isolates the tension between the *diagnosis* (naive truth) and the *cure* (logical restriction), and evaluates whether dialetheism retains its promised theoretical advantage.

  ***

  ### Title: The Redundancy of the Glut: Why Curry's Paradox Undermines the Dialetheic Claim to Uniformity

  **1. The Dialetheic Promise: Uniformity via Naive Truth**
  To evaluate the objection, we must first clarify the selling point of dialetheism as presented by Graham Priest. The central advantage claimed over rival theories (Tarskian hierarchies, Kripkean fixed-points, paracomplete theories) is **theoretical uniformity**.

  Classical approaches to the Liar Paradox typically save consistency by restricting the T-schema ($T(A) \leftrightarrow A$). They must declare certain instances of the schema false or undefined. Priest argues this is *ad hoc*: why should the truth predicate fail exactly where self-reference occurs? Dialetheism proposes a simpler trade-off: retain the full Naive Truth schema and classical logic's structural rules, but reject the principle of Explosion (*Ex Falso Quodlibet*: $A, \neg A \vdash B$). On this view, the Liar sentence is a "glut" (both true and false). The paradox is not blocked; it is accepted. The cost is true contradictions; the benefit is a unified, unrestricted truth theory.

  **2. The Curry Challenge: Negation-Independent Triviality**
  Curry's Paradox disrupts this cost-benefit analysis. Let $C$ be a sentence equivalent to $T(C) \to \bot$ (or generally $T(C) \to B$ for arbitrary $B$).
  1.  $C \leftrightarrow (T(C) \to B)$ (Naive Truth/Self-Reference)
  2.  $T(C) \to (T(C) \to B)$ (Substitution)
  3.  $T(C) \to B$ (Contraction: $A \to (A \to B) \vdash A \to B$)
  4.  $T(C)$ (From 1 and 3 by Modus Ponens/Conditional Proof)
  5.  $B$ (From 3 and 4 by Modus Ponens)

  Crucially, **negation does not appear in this derivation.** Consequently, the dialetheic rejection of Explosion is inert here. There is no contradiction to tolerate; there is only a direct path to triviality ($B$ is proven for any $B$).

  To avoid triviality, the dialetheist must block the derivation. Since Naive Truth is non-negotiable for the view, and Modus Ponens is essential for the utility of the conditional, the target is almost invariably the structural rule of **Contraction** (or the related rule of Pseudo-Modus Ponens in some relevant logics).

  **3. The Core Argument: The Independence of the Cure**
  The objection you wish to raise can be formalized as an argument from **redundancy**. It contends that the logical machinery required to solve Curry is independent of the metaphysical commitment to true contradictions.

  *   **Premise 1:** Any adequate solution to Curry's Paradox requires restricting structural rules (specifically Contraction) or conditional rules (specifically Modus Ponens), regardless of one's stance on negation.
  *   **Premise 2:** Non-dialetheic substructural theorists (e.g., proponents of Strict-Tolerant logic like Ripley, Cobreros, and Egré) can and do restrict Contraction to solve Curry while maintaining that no sentence is both true and false (i.e., they remain paracomplete or consistent).
  *   **Premise 3:** If a theoretical resource (restricting Contraction) solves the paradox equally well for a consistentist as it does for a dialetheist, then that resource is not unique to dialetheism.
  *   **Premise 4:** Priest's claim to superiority rests on dialetheism offering a *more uniform* or *less costly* solution than rivals.
  *   **Conclusion:** Because the consistentist can solve Curry using the same structural restriction *without* paying the cost of accepting true contradictions, dialetheism loses its comparative advantage. The dialetheist pays the cost of restricting Contraction *plus* the cost of accepting gluts. The "uniformity" is illusory because the mechanism solving Curry (non-contraction) is distinct from the mechanism solving the Liar (paraconsistency).

  In short: If restricting Contraction is the price of Naive Truth in the face of Curry, that price is payable in currency that does not require buying true contradictions. The dialetheist is buying the same logical fix but adding an ontological surcharge that does no additional work against Curry.

  **4. The Dialetheist Reply: The "Unified Package" Defense**
  The most natural reply, which you noted your instructor alluded to, is that this objection misunderstands the dialetheic "package." Priest (and later Beall) has argued that the correct logic of semantic closure is not classical logic minus Explosion (LP), but a **paraconsistent relevant logic** (such as $LP_m$ or a variant of $RM3$) which lacks Contraction from the start.

  The reply runs as follows:
  > "We never promised to keep classical structural rules. The dialetheic diagnosis is that semantic paradoxes arise from the interaction of Naive Truth with classical structural assumptions. Both Liar and Curry reveal that classical logic is the culprit. Liar shows we must drop Explosion; Curry shows we must drop Contraction. These are not *ad hoc* patches for specific paradoxes; they are joint consequences of a single, deeper insight: the logic governing the truth predicate is non-classical. Therefore, the solution remains uniform: adopt the correct non-classical logic (paraconsistent and non-contractive), and all paradoxes dissolve (or are tolerated) simultaneously."

  On this view, restricting Contraction is not a retreat; it is a completion of the dialetheic diagnosis. The logic was always meant to be substructural; LP was merely a pedagogical simplification.

  **5. Evaluation: Is the Reply Successful?**
  I find this reply **theoretically coherent but dialectically unsuccessful** in securing the advantage Priest promises. Here is the plain assessment:

  **Why it is coherent:**
  It is certainly possible to construct a logic that is both paraconsistent and non-contractive. Priest is not contradicting himself by adding a restriction on Contraction. If the goal is simply to have a consistent *theory* that includes Naive Truth, this move works.

  **Why it fails to secure the advantage:**
  The failure lies in the claim to *superiority* over rival theories.
  1.  **Loss of Uniformity in Mechanism:** The reply concedes that two different logical failures are required to handle the two paradoxes. The Liar is handled by blocking Explosion (a property of negation); Curry is handled by blocking Contraction (a property of the conditional/structure). A paracomplete substructuralist (like Ripley) blocks Contraction to solve Curry, and rejects the T-schema instance for the Liar (or treats it as a gap) to solve the Liar. The dialetheist blocks Contraction for Curry, and accepts the Glut for the Liar.
      *   The *logical* work done against Curry is identical in both camps (restrict Contraction).
      *   The *logical* work done against the Liar is different (Paraconsistency vs. Paracompleteness/Gap).
      *   Therefore, the "uniformity" is only at the level of "Naive Truth," not at the level of logical repair. Since the logical repair is what determines the formal system, the systems are diverging, not unifying.

  2.  **The Cost-Benefit Imbalance:** The dialetheic sales pitch is that accepting true contradictions is *less costly* than the "contortions" of rival theories (hierarchies, gaps, etc.). But if the rival theory (non-dialetheic substructuralism) restricts Contraction *and* maintains consistency, it avoids the massive metaphysical cost of true contradictions.
      *   **Rival Theory Cost:** Restrict Contraction.
      *   **Dialetheist Cost:** Restrict Contraction + Accept True Contradictions.
      *   **Benefit:** Both get Naive Truth.
      *   **Result:** The dialetheist pays strictly more for the same product.

  3.  **The "Ad Hoc" Charge Returns:** Priest originally criticized Tarskians for restricting the T-schema only where paradox looms. If the dialetheist must now restrict Contraction specifically to avoid Curry (while perhaps claiming to keep it elsewhere, or arguing it fails generally for the conditional), they face a similar charge. Why does Contraction fail for the truth conditional but hold for ordinary mathematics? If the answer is "because of truth," the consistentist can say the same. If the consistentist can say the same without accepting contradictions, the contradiction is doing no work.

  **Verdict:**
  The dialetheist reply succeeds in saving the theory from inconsistency, but it fails to save the **comparative argument**. It demonstrates that dialetheism is *a* viable option, but it concedes that the specific resource needed to tame Curry (non-contraction) is not proprietary to dialetheism. Since that resource is sufficient to save Naive Truth without gluts (as shown by non-dialetheic substructuralists), the acceptance of true contradictions becomes theoretically idle with respect to Curry.

  Therefore, Curry's Paradox shows that the "uniform solution" is actually a **conjunction of two distinct solutions** (Paraconsistency for Liar, Non-Contraction for Curry). Since the second conjunct is available without the first, the claim that dialetheism is the *most* uniform or *least costly* path is untenable. The dialetheist is not offering a unified diagnosis that rivals cannot match; they are offering a strictly more expensive version of a substructural diagnosis that rivals can adopt without the metaphysical baggage.

  ***

  ### Suggestions for Seminar Discussion
  When you present this, anticipate two pushbacks:
  1.  **The "Truth of Logic" Objection:** The dialetheist might argue that the consistentist substructuralist is wrong about logic (e.g., Contraction *should* hold, but Truth forces us to drop it, which implies Truth is inconsistent). *Counter:* This begs the question. The debate is about which cost is lower. You cannot argue your cost is lower by assuming your metaphysics is true.
  2.  **The "Detachment" Objection:** They may argue that without Modus Ponens (which often goes with Contraction), the conditional is useless. *Counter:* Non-dialetheic substructuralists (like Ripley) argue we can keep Detachment but drop Transitivity/Cut. This achieves the same blocking of Curry without gluts.

  This framework should allow you to press the point that while Priest's system is consistent, its *motivation* relies on a comparative advantage that Curry's Paradox effectively neutralizes.
