answer: |-
  **TO:** Graduate Seminar Instructor
  **FROM:** [Your Name/TA]
  **DATE:** October 26, 2023
  **SUBJECT:** Brief on the Stalnakerian Metasemantic Objection to Chalmers's Phenomenal Asymmetry

  ### Executive Summary

  The core of David Chalmers's two-dimensional argument against Type-B materialism rests on a specific semantic asymmetry: while natural kind terms (e.g., "water") possess distinct primary and secondary intensions, phenomenal concepts (e.g., "pain") allegedly possess coincident intensions. This coincidence is what prevents the Type-B materialist from treating psycho-physical identities as Kripkean *a posteriori* necessities.

  This brief argues that Chalmers's assertion of this asymmetry is metasemantically unmotivated and question-begging. By examining the mechanics of how primary intensions are fixed—specifically through canonical descriptions and reference-fixing roles—a Type-B materialist can demonstrate that phenomenal concepts function semantically identical to natural kind terms. If the primary intension of a phenomenal concept is fixed by a descriptive or functional role (even an introspective one), the 1-intension and 2-intension can come apart. Denying this asymmetry restores the viability of the Type-B move: the conceivability of zombies reflects epistemic contingency (1-possibility) without entailing metaphysical contingency (2-possibility).

  ---

  ### 1. The Architecture of the Asymmetry Claim

  To understand the objection, we must first rigorously define Chalmers's semantic claim. In the two-dimensional framework:

  *   **Primary Intension (1-intension):** A function from a centered world considered *as actual* to an extension. It captures the epistemic dimension (what the term refers to given how the world turns out to be).
  *   **Secondary Intension (2-intension):** A function from a world considered *as counterfactual* to an extension. It captures the metaphysical dimension (what the term refers to given what it actually is).

  **Chalmers's Asymmetry:**
  1.  **Natural Kinds ("Water"):** The 1-intension is descriptive ("the clear, drinkable liquid..."). The 2-intension is rigid ("H2O"). Because these differ, "Water is H2O" is 1-contingent (conceivable that XYZ is actual) but 2-necessary.
  2.  **Phenomenal Concepts ("Pain"):** Chalmers claims the 1-intension and 2-intension coincide. The concept picks out "this phenomenal quality" directly. In any world considered as actual, if "this quality" is present, the term refers to it. There is no descriptive gap.

  **The Consequence:** If phenomenal concepts are 1-rigid (primary and secondary intensions coincide), then 1-possibility entails 2-possibility. Therefore, if zombies are conceivable (1-possible), they are metaphysically possible (2-possible), and physicalism is false. Type-B materialism relies on blocking this entailment by arguing phenomenal concepts are *not* 1-rigid.

  ### 2. The Metasemantic Objection: How Primary Intensions Are Fixed

  The Type-B materialist's resistance focuses on the **mechanics of reference fixation**. Chalmers assumes that because phenomenal concepts are grounded in direct acquaintance, their primary intension is simply the phenomenal quality itself. This is where the Stalnaker-style objection applies pressure.

  #### A. The Requirement of a Mode of Presentation
  For a term to have a primary intension, there must be a rule or condition that determines its extension in a world considered as actual. For "water," this rule is provided by a canonical description in neutral vocabulary (e.g., "the stuff filling the lakes," "clear liquid").

  Chalmers asserts that for "pain," the rule is merely ostensive ("*this* feeling"). However, ostension alone is semantically inert without a sorting principle. To evaluate "pain" in a counterfactual scenario considered as actual, one must know *what feature* of that scenario satisfies the concept.
  *   **Chalmers's View:** The feature is the intrinsic phenomenal quality.
  *   **Type-B View:** The feature is the *conceptual role* or the *introspective identification mechanism*.

  If the physicalist is correct, the concept "pain" is a theoretical term within our folk-psychological or introspective framework. Its reference is fixed by the role it plays in our cognitive economy (e.g., "the state typically caused by damage and causing avoidance, which presents introspectively *thusly*").

  #### B. Canonical Descriptions and Neutral Vocabulary
  Chalmers requires that primary intensions be specifiable in a "neutral" vocabulary that does not presuppose the truth of physicalism or dualism.
  *   **The Objection:** Chalmers illicitly includes phenomenal terms in the neutral vocabulary. He assumes we can specify the 1-intension of "pain" using phenomenal concepts themselves.
  *   **The Materialist Correction:** If physicalism is true, the truly neutral vocabulary is physical/functional. From a physicalist metasemantic perspective, the primary intension of "pain" should be specified functionally or causally, just like "water."
      *   *1-Intension of Pain:* "The internal state that plays the pain-role (including causing the belief 'I am in pain')."
      *   *2-Intension of Pain:* "The actual neural state (e.g., C-fiber firing) that plays that role."

  If this specification is accepted, the 1-intension and 2-intension come apart. In a world considered as actual where a non-physical substance plays the pain-role, "pain" refers to that substance. In the actual world (if physicalism is true), "pain" refers to the neural state. Thus, phenomenal concepts are **epistemically flexible**, just like "water."

  ### 3. Reconstructing the Kripkean Gap for Phenomenal Concepts

  Once the asymmetry is denied, the Type-B materialist can reconstruct the Kripkean explanation for psycho-physical identity statements, mirroring the "Water = H2O" case.

  **The Kripkean Model for "Water = H2O":**
  1.  We fix the reference of "water" via contingent properties (watery stuff).
  2.  We discover water is H2O.
  3.  "Water = H2O" is necessary (2-intension) but *a posteriori* because the reference-fixing description (1-intension) is contingent.
  4.  The illusion of contingency arises because we confuse the 1-intension (watery stuff) with the 2-intension (H2O).

  **The Kripkean Model for "Pain = C-Fiber Firing" (Type-B):**
  1.  We fix the reference of "pain" via contingent introspective/functional properties ("the state that feels like *this*").
  2.  We discover pain is C-fiber firing.
  3.  "Pain = C-fiber firing" is necessary (2-intension) but *a posteriori* because the reference-fixing description (1-intension) is contingent.
  4.  The illusion of contingency (the zombie intuition) arises because we can conceive of the 1-intension being satisfied ("the state that feels like *this*") without the 2-intension being satisfied (C-fibers), perhaps by a silicon state or ectoplasm.

  **Chalmers's Block:** Chalmers blocks this by claiming step 1 is false for phenomenals. He argues the reference is not fixed by "the state that feels like this" (description) but by the feeling itself (direct reference).

  **The Rebuttal:** This distinction is metasemantically unstable. Even if I am directly acquainted with the feeling, the *concept* I employ to categorize it involves a mode of presentation. As Stalnaker argues, content is determined by the interaction between the agent and the environment. If the environment is physical, the concept tracks physical properties, even if the *access* to those properties is introspective. The "feeling" is the mode of access, not the semantic content itself. Therefore, there is a gap between the mode of presentation (phenomenal appearance) and the referent (physical state), recreating the 1-intension/2-intension divergence.

  ### 4. The Charge of Circularity

  The most rigorous point to raise in seminar is that Chalmers's defense of the asymmetry presupposes the falsity of physicalism.

  To claim that the primary intension of "pain" coincides with its secondary intension, Chalmers must assume that the property picked out by the phenomenal concept is *not* a physical property.
  *   If "pain" refers to a physical property $P$, then the primary intension is "whatever plays the pain-role." In a zombie world (considered as actual), if nothing plays the pain-role, the term refers to nothing. If something else plays the role, it refers to that.
  *   For the intensions to *coincide*, the property must be such that it cannot be picked out by a role that could be satisfied by something else. This implies the property is non-physical.

  Therefore, Chalmers's semantic argument relies on a prior metaphysical commitment to dualism. He assumes phenomenal concepts are "pure" referents to non-physical qualities to prove that non-physical qualities exist. The Type-B materialist is entitled to reject this semantic characterization as begging the question. They propose an alternative metasemantics (descriptive/functional reference fixation) that is consistent with physicalism and explains the same linguistic data (the conceivability of zombies) as epistemic ambiguity rather than metaphysical possibility.

  ### 5. Conclusion: Restoring the Type-B Position

  The Type-B materialist does not need to deny the *conceivability* of zombies (the 1-possibility). They only need to deny that this conceivability maps onto metaphysical possibility (2-possibility).

  Chalmers's argument succeeds only if phenomenal concepts are semantically unique in being 1-rigid. However, an analysis of how primary intensions are fixed reveals:
  1.  Reference fixation generally involves descriptive or functional roles.
  2.  Phenomenal concepts are no exception; they are tied to introspective mechanisms and functional roles.
  3.  Consequently, their 1-intensions (the role/appearance) can diverge from their 2-intensions (the physical realizer).

  By denying the asymmetry, the Type-B materialist validates the analogy between "Water = H2O" and "Pain = Neural State." The zombie scenario is revealed as a scenario where the primary intension of "consciousness" is satisfied (the role is played) but the secondary intension is not (the physical base is absent or different). This is an epistemic possibility, not a metaphysical one. Thus, the two-dimensional argument fails to refute a posteriori physicalism because its semantic premises are not neutral, but rather load the dice in favor of dualism.

  **Recommendation for Discussion:**
  Ask the class to specify the "canonical description" for a phenomenal concept in a world considered as actual. If they cannot do so without using the phenomenal term itself, press them on whether this renders the primary intension trivial or circular. If they offer a functional description (e.g., "what it's like to see red"), ask why that description couldn't be satisfied by a physical state in the actual world, thereby driving a wedge between the 1-intension and the 2-intension.
