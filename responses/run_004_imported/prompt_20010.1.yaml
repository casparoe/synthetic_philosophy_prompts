answer: |-
  **Panel Title:** *The Unfinished Multitude: Spinoza's Democracy and Its Limits*
  **Conference:** Annual Meeting of the North American Spinoza Society
  **Participants:**
  *   **Dr. Elena Rossi** (University of Milan), specializing in Italian Operaismo readings of Spinoza.
  *   **Prof. Marcus Thorne** (University of Chicago), specializing in early modern political realism and natural law.

  **Moderator:** We have time for a brief exchange before taking questions. Dr. Rossi, you opened by suggesting the *Theological-Political Treatise* (TTP) provides the normative key to Spinoza's entire political project. But surely the *Political Treatise* (TP) complicates this?

  **Dr. Elena Rossi:** Thank you. Yes, I maintain that the TTP establishes the ontological baseline: democracy is the "most natural" regime because it least contradicts the liberty of the state of nature. When Spinoza says the multitude retains its power even after the social compact, he is dismantling the Hobbesian transfer of right. For readers like Balibar or Negri, this is the breakthrough. The *potentia multitudinis*—the constituent power of the people—can never be fully alienated. Therefore, Spinoza's trajectory is toward radical inclusion. The fact that the *Political Treatise* is unfinished is crucial here; we are watching a mind in motion, pushing against the limits of his own time.

  **Prof. Marcus Thorne:** With respect, Elena, "in motion" is doing a lot of heavy lifting. If we look at the *Political Treatise*, specifically the final chapter on democracy which he was writing when he died, the motion seems to be stopping, not accelerating. He breaks off mid-sentence while arguing that women are *naturally* subject to men. He doesn't say this is a cultural artifact or a result of bad education. He says no society has ever ruled equally, therefore the balance of power is naturally unequal, and since right equals power, women have no natural right to citizenship. If the TTP promises a radical democracy, the TP seems to define the "demos" in a way that excludes half the population by ontological fiat.

  **Dr. Rossi:** But Marcus, you're treating that exclusion as a logical conclusion rather than a historical residue. Spinoza is fighting a war on two fronts: against theological authority and against monarchical absolutism. In the TTP, he expands the circle to include Jews, heretics, and merchants. The exclusion of women in the TP reads like a blind spot, not a cornerstone. We shouldn't freeze Spinoza on the very last page he wrote and say, "Here is the true Spinoza." We should look at the *conatus* of his philosophy. The logic of *potentia* suggests that if women organize, if they increase their collective power, their right expands. The text breaks off! Perhaps he was about to pivot.

  **Prof. Thorne:** "Perhaps he was about to pivot" is a theological act of faith, Elena. It's hoping for a redemption the text doesn't grant. The argument isn't just a stray comment; it rests on his core definition of natural right. In the state of nature, *jus* is coextensive with *potentia*. If men, in Spinoza's view, possess greater physical and rational capacity to command than women—a premise he treats as empirical fact—then their natural right *is* greater. To say, as you do, that "if they organize, their right expands" misses the point. Spinoza argues they *cannot* organize effectively against men because their passion (specifically jealousy, in his view) prevents the requisite unity. He isn't describing a temporary suppression; he's describing a structural incapacity. If you accept "right equals power," you must accept that inequality of power licenses inequality of right.

  **Dr. Rossi:** I accept the premise that right equals power, but I reject your static reading of power. Power for Spinoza is relational and dynamic. In the TTP, he argues that a sovereign who rules against the grain of the multitude's nature undermines their own power. If a state excludes women, it is actively diminishing its own *potentia* by turning a potential source of strength into a source of internal resistance. The "radical" reading isn't that Spinoza was a modern feminist; it's that his ontology of power contains a mechanism that *would* dismantle that exclusion if followed consistently. The inconsistency is the point! It shows the tension between his metaphysical egalitarianism (all modes of God) and his sociological pessimism. We side with the metaphysics.

  **Prof. Thorne:** But why? Why do we get to edit Spinoza to make him consistent with our politics? That's the danger of the Negri reading. It turns Spinoza into a vessel for our own desires. You say the text breaks off mid-sentence, implying death interrupted a correction. But look at the syntax. He's in the middle of justifying the exclusion, not retracting it. He writes that men and women cannot govern together "without great harm to the state." He dies while sharpening that blade, not dulling it. To treat the TP as a "draft" that the TTP overrides is to ignore that the TP was his final, most mature attempt at a systematic political science. He was trying to be more realistic, not more idealistic. The TTP is the polemic; the TP is the blueprint. And the blueprint has walls.

  **Dr. Rossi:** I'm not editing him; I'm distinguishing between the *system* and the *application*. Consider the *Ethics*. If a person is in bondage to the passions, they are not free. Spinoza attributes this bondage to women in the TP. But the *Ethics* teaches that bondage is universal and that freedom is achieved through reason. If women are denied education or social standing, of course their *potentia* appears lower. Spinoza knows that affects are shaped by external causes. By naturalizing this, he contradicts his own determinism. So, when I say we side with the metaphysics, I mean we should prioritize the explanatory framework that allows for liberation over the empirical generalization that denies it. The "radical democrat" Spinoza is the one who gives us the tools to critique the "patriarchal" Spinoza.

  **Prof. Thorne:** That's a generous hermeneutic of charity, but it risks making the argument unfalsifiable. If Spinoza says X, but his "true" philosophy implies Not-X, we decide Not-X is the real Spinoza. My concern is that this ignores the political cost of his realism. Spinoza's "right equals power" is a double-edged sword. It democratizes right for the multitude against the king, yes. But it also naturalizes the domination of the strong over the weak *within* the multitude. If the multitude is not a homogeneous block, but a fractured field of competing powers, then "democracy" just becomes the tyranny of the dominant faction. In the TP, that dominant faction is men. If you ignore that, you aren't resolving the tension; you're masking it. The unfinished chapter doesn't reveal a mistake he would have fixed; it reveals the limit of his imagination.

  **Dr. Rossi:** But Marcus, isn't that exactly why the text being unfinished matters? Not because he would have changed his mind about women necessarily, but because he never completed the *institutional* design for democracy. He finishes Aristocracy and Monarchy. Democracy is left hanging. Why? Maybe because the problem of the multitude governing itself is the hardest problem. The exclusion of women might be his failed attempt to solve the problem of factionalization—trying to ensure stability by artificially homogenizing the voting body. It's a bad solution, but it acknowledges the problem: how do you maintain a stable democracy when power is uneven? The TTP says democracy is most natural; the TP asks, "Yes, but how does it function without tearing itself apart?" His answer regarding women is wrong, but the *question* remains open. That openness is where the radical potential lives.

  **Prof. Thorne:** I agree the question remains open, but I disagree that the "radical potential" is the only valid reading. For an IB student, or any reader, the lesson might be the opposite: that naturalistic foundations for politics are dangerous. If you ground rights in power, you lose the normative leverage to protect the powerless when their power is low. The TTP promises a state close to the state of nature, but the TP reveals that the state of nature is not a paradise of equality; it's a hierarchy of forces. If we read Spinoza as a radical democrat, we are reading him against his own naturalism. If we read him as a realist, we have to accept that his democracy is an aristocracy of men. I'm not saying we should *like* that, but we shouldn't pretend the TP is just a rough draft of the TTP. It's a correction.

  **Dr. Rossi:** I suppose our disagreement comes down to whether we view Spinoza's philosophy as a *container* or a *current*. You see it as a container: if the text says women are excluded, that's inside the container. I see it as a current: the flow of his argument regarding *conatus* and joy moves toward greater capacity to act. The exclusion of women decreases the total capacity of the state. Therefore, it is irrational by Spinoza's own lights. The fact that he didn't see it doesn't mean the philosophy doesn't demand it. The "unfinished" sentence is a symbol: the work of democracy is literally incomplete. It invites us to finish it.

  **Prof. Thorne:** And my worry is that inviting students to "finish it" by ignoring the parts they dislike turns philosophy into activism. The tension you're describing isn't a bug to be fixed by the reader; it's the actual shape of Spinoza's thought. He wants freedom, but he wants it grounded in truth, not hope. If the truth, as he saw it, was that women were naturally unfit for rule, then his commitment to truth overrides his commitment to universal freedom. That's a tragic Spinoza, not a triumphant one. But perhaps a more honest one.

  **Dr. Rossi:** Or perhaps it's a Spinoza who shows us that even the greatest minds are trapped in their historical *conatus*. We can honor him by pushing the current further than he could.

  **Prof. Thorne:** And we honor him by acknowledging where the current ran dry.

  **Moderator:** I'm afraid that's where we must leave it. A tension between the immanent potential of the system and the explicit limits of the text. Thank you both.
