answer: |-
  The rain blurred the lights of the parking lot into streaks of neon grease against the conference room window. Inside, the air was recycled and dry, smelling of stale coffee and the sharp ozone of the projector left running in the corner. On the table lay a single manila file, thick with the weight of Mr. Henderson's remaining life.

  Dr. Aris Thorne, the committee chair, rubbed his temples. To his left sat Sarah, the hospital's legal counsel, her posture rigid. To his right was Marcus, the community chaplain, who looked as though he hadn't slept in days.

  "The policy is explicit," Aris said, tapping the laminated card on the table. "We authorize withdrawal of life support only if two conditions are met. One: The advance directive clearly applies to the current state. Two: There is no reasonable prospect of meaningful recovery. Both must be true. If either is false, life support continues."

  Mr. Henderson was in a persistent vegetative state. He had been for six months. His wife was gone; his only sister was overseas and unreachable. The committee was the proxy.

  "Let's take the first condition," Aris said. "The directive. Henderson signed a living will five years ago. It specifies 'no artificial means if there is no reasonable expectation of consciousness.' Does this document cover his current state?"

  Sarah adjusted her glasses. "It does. The language is specific. 'Persistent vegetative state' is listed as an example condition. He signed it witnessed. Legally and ethically, the document speaks for him. It applies."

  Marcus shifted in his chair. "I disagree. The document is cold, Sarah. It lists conditions, but it doesn't capture the man. He wrote this when he was healthy, fearing a specific kind of decline. This… this is different. There's ambiguity in how he defined 'consciousness.' Is a reflex consciousness enough? I don't think the directive clearly applies. It's too vague to be a death warrant."

  Aris looked between them. "I side with Sarah. The language is sufficient. The directive applies."

  They took a informal count. Aris: Yes. Sarah: Yes. Marcus: No. The majority held. Condition One was met.

  "Condition two," Aris continued, his voice lower. "Prospect of meaningful recovery. I've reviewed the scans. The cortical damage is extensive. There is no neural activity consistent with awareness. Medically, I cannot endorse the idea that he will wake up."

  Marcus leaned forward, his hands clasped. "Medically, perhaps. But 'meaningful' is not a medical term. We've seen outliers. Families who swear they saw a blink, a squeeze of the hand. Is there a *reasonable* prospect? I think there is enough uncertainty to say no. We cannot certify hopelessness with absolute certainty."

  Sarah frowned, looking at the medical charts. "I have to disagree with Marcus here. I'm not a doctor, but I rely on medical consensus. If the consensus is zero probability, then there is no prospect. To claim there is hope when the data says otherwise is a falsehood. I agree with Aris. There is no prospect of recovery."

  Aris nodded. "So, on the prognosis: Aris, Yes. Marcus, No. Sarah, Yes."

  Another majority. Condition Two was met.

  Aris exhaled, the sound loud in the quiet room. "So. The policy states that if both conditions hold, we authorize withdrawal. The committee has found that the directive applies, and that there is no hope. Therefore, we authorize the withdrawal of life support."

  He reached for the authorization form.

  "Wait," Marcus said.

  Aris paused, pen hovering. "The logic is sound, Marcus. Both premises are affirmed by the majority."

  "The logic is sound," Marcus replied, "but the decision feels wrong. If we vote on the outcome itself—the actual act of turning off the machine—I don't think this committee supports it."

  Sarah looked up, sharp. "We don't vote on the outcome. We vote on the criteria. That's the policy. We are not here to decide based on our feelings, but on the criteria established to protect us from our feelings."

  "But what if the criteria lead us somewhere none of us actually want to go?" Marcus asked. "Let's just vote. Right now. On the question: Should life support be withdrawn?"

  Aris hesitated. "That's conclusion-based voting. It bypasses the doctrinal structure."

  "It bypasses the paradox," Marcus corrected softly. "Just vote."

  Aris looked at Sarah. She shrugged, a gesture of surrender to the process. "Fine. Let's see where the conscience of the committee lies."

  "Alright," Aris said. "All in favor of withdrawing life support?"

  Aris raised his hand. He believed in the logic. The document was clear, the medicine was clear. To continue was to prolong a biological function without a person.

  Sarah kept her hands in her lap. "I voted that the directive applies," she said quietly. "And I voted that there is no hope. But… putting those together… I can't do it. The uncertainty Marcus raised about the directive… it infects the whole thing. If there's doubt in the document, I can't sign off on death. No."

  Marcus kept his hands down. "I believe there is no hope," he said. "But I don't believe the document gives us the right to act on that. So, no."

  One hand in the air. Two down.

  The silence stretched, heavy and suffocating. The rain tapped against the glass.

  Aris slowly lowered his hand. "So," he said. "Under the premise-based procedure, we withdraw support. The majority affirmed the conditions. Under the conclusion-based procedure, we continue support. The majority rejects the action."

  "We have a contradiction," Sarah said, her voice barely audible. "The committee says the conditions are met, but refuses to enact the consequence."

  "Which means the policy is broken," Marcus said. "Or we are."

  Aris looked at the file. He thought about Mr. Henderson, alone in room 402, breathing because a machine pushed air into his lungs. He thought about the integrity of the rules. If they ignored the premise vote, they undermined the policy designed to prevent arbitrary decisions. If they ignored the conclusion vote, they acted against the collective moral will of the committee.

  "We could recuse ourselves," Sarah suggested, though she didn't sound hopeful. "Send it to the board."

  "The board will use the same policy," Aris said. "They'll face the same math."

  Marcus stood up and walked to the window. He watched the rain distort the world outside. "Maybe the math isn't the point. Maybe the fact that we can't agree on *how* to decide is the decision."

  Aris looked at the authorization form. It was blank. The pen lay beside it. He could fill it out based on the premise vote. It was procedurally defensible. He could file it based on the conclusion vote. It was morally defensible.

  "We have to record a verdict," Aris said. "The hospital needs a directive by morning."

  "Then we decide how we decide," Marcus said, turning from the window. "Do we trust the logic of the conditions, or the weight of the verdict?"

  Sarah looked at the file, then at Aris. "If we follow the premises, we are consistent with the rules. If we follow the conclusion, we are consistent with ourselves."

  Aris picked up the pen. He held it over the paper, the ink poised to fall. The room waited. The hum of the projector seemed to grow louder, a mechanical heartbeat filling the space between the three of them. Outside, the rain continued to fall, indifferent to the logic inside, washing the city clean while the committee remained stuck in the dry, sterile paradox of their own making.

  Aris looked at his colleagues. Neither looked away. Neither nodded.

  "We need to know," Aris said to the empty air, "which truth matters more."

  He set the pen down. The file remained open. The clock on the wall ticked forward, measuring out seconds that belonged to a man who could no longer count them.
