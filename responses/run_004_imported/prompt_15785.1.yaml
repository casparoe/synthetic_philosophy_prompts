answer: |-
  You are hitting on one of the classic debates in Thomistic political theory, but your professor is right: it is **not** straightforward, and *De Regno* specifically pulls back from the more permissive stance you are attributing to Aquinas.

  If you turn in an essay arguing that Aquinas straightforwardly endorses private tyrannicide (like a modern citizen assassinating a dictator), you will likely lose points. Here is the nuance you are missing, specifically regarding the distinction between the *Sentences* Commentary and *De Regno*, and the crucial distinction between **private** and **public** authority.

  ### 1. The Specific Text: *De Regno* Book I, Chapter 6
  You mentioned skimming *De Regno*, but this is the exact chapter where Aquinas addresses "That it is not for private presumption to kill a tyrant."

  In the *Sentences* Commentary (II Sent., d. 44, q. 2, a. 2), Aquinas is indeed more permissive. He discusses the story of Ehud and Eglon and suggests that killing a tyrant can be praiseworthy if it frees the multitude. However, in *De Regno* (written later, for the King of Cyprus), he explicitly walks this back for prudential reasons.

  He argues that even if a ruler is tyrannical, it is **not** for a private individual (*privatus*) to kill him. He gives three main reasons:
  1.  **The Danger of Failure:** If the attempt fails, the tyrant will become even more savage.
  2.  **The Precedent:** If you allow private citizens to kill kings, you risk killing good kings later. It destabilizes the very idea of office.
  3.  **Sedition:** Often, the person who kills the tyrant seizes power themselves, or the act causes civil war, which is worse than the tyranny.

  Aquinas writes: *"It is not for private presumption to take upon itself the killing of a tyrant... but this belongs to public authority."*

  ### 2. Usurper vs. Legitimate Ruler Turned Tyrant
  Your interpretation conflates two different types of tyrants, which Aquinas treats differently (though he is cautious about both):

  *   **The Usurper (*tyrannus ex defectu tituli*):** Someone who seizes power by force with no legal claim. Aquinas is more lenient here. Because they have no legitimate title, they are essentially an aggressor. However, even here, Aquinas prefers that removal be undertaken by a superior authority (like an Emperor removing a local king, or the Pope deposing a ruler), not necessarily a random citizen.
  *   **The Legitimate Ruler Turned Tyrant (*tyrannus ex parte exercitii*):** Someone who was lawfully appointed but rules unjustly. Aquinas is very strict here. Because their title is legitimate, private citizens generally have a duty to endure the tyranny unless there is a constitutional mechanism for removal (like the Roman Senate deposing Tarquin).

  ### 3. The "Public Authority" Loophole
  This is the key to your July 20 Plot analogy. Aquinas insists that removal must be done by **public authority** (*publica auctoritas*).

  *   **Your View:** A private citizen can kill a dictator because there is no higher appeal.
  *   **Aquinas's View:** If there is no higher *temporal* appeal, you appeal to God, or you wait for a public body to act. You do not act as a private individual.

  Regarding the **July 20 Plot**: The conspirators were military officers and state officials. In Aquinas's framework, they might not be viewed as "private citizens" but as holders of public office attempting to remove a usurper who had subverted the constitution (Hitler's consolidation of power via the Enabling Act could be argued as a form of usurpation of the traditional legal order).

  Aquinas would likely **not** endorse a random civilian walking into a palace and stabbing a dictator. He *might* endorse a council of nobles, a parliament, or military leadership acting as a corporate public body to depose him. The distinction between "private assassination" and "public deposition" is vital.

  ### 4. Why the Professor Sees "Tension"
  The tension your professor is highlighting is between **Natural Law** (defend the common good/justice) and **Divine/Positive Order** (do not kill the Lord's anointed/do not cause sedition).

  *   **In the *Sentences*:** The theological/moral angle dominates. Tyranny is a sin; removing sin is good.
  *   **In *De Regno*:** The political/prudential angle dominates. Order is a prerequisite for justice. Destroying order to fix justice might destroy both.

  Aquinas ultimately prioritizes order. He suggests that if a tyranny is unbearable, the community should appeal to a superior (like the Pope or an Emperor) or, if no human remedy exists, they must pray to God. He explicitly rejects private violence as a remedy because the "cure" (anarchy/sedition) is often worse than the "disease" (tyranny).

  ### Summary for your Seminar
  You aren't "wrong" that Aquinas hates tyranny; he calls it the worst form of government. But you are missing his **procedural constraints**.

  1.  **De Regno I.6** explicitly argues *against* private tyrannicide.
  2.  Removal requires **public authority**, not private presumption.
  3.  The **risk of sedition** outweighs the abstract right to self-defense against a ruler.

  If you argue that Aquinas endorses the July 20 plot, you must qualify it: he would only endorse it insofar as the plotters were acting as a **public body** restoring legitimate order, not as private individuals exercising a right to assassination. If you argue he endorses a private citizen killing a modern dictator, you are ignoring *De Regno*.

  Your professor wants you to see that Aquinas is a realist, not a revolutionary. He wants to limit violence, even against bad rulers, to prevent the collapse of political society.
