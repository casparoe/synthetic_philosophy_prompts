answer: |-
  This is an excellent question that cuts to the heart of why the Sorites seminar readings can feel so counterintuitive. You have correctly identified the standard intuition: usually, if you introduce truth-value gaps (neither true nor false), you expect to lose classical tautologies like the Law of Excluded Middle (LEM), just as you do in Strong Kleene logic.

  Your reasoning breaks down on one specific technical assumption: **you are assuming that truth in supervaluationism is truth-functional.** It is not.

  Here is the breakdown of where the logic goes differently than you expected, followed by the substantive metaphysical disagreement that remains once the logic is settled.

  ### 1. Where Your Reasoning Breaks Down: Supervaluationism and LEM

  You are correct that supervaluationism posits truth-value gaps for atomic borderline sentences. If $n$ is a borderline number of grains for "heap," the sentence $H(n)$ is neither super-true nor super-false.

  However, supervaluationism defines validity and truth in a **global** way, not a **local** way.
  *   **Local (Kleene):** The truth value of a compound sentence is determined by the truth values of its parts *on that specific valuation*. If $H(n)$ is Indeterminate, then $\neg H(n)$ is Indeterminate, and $H(n) \lor \neg H(n)$ is Indeterminate. LEM fails.
  *   **Global (Supervaluationism):** A sentence is **super-true** if and only if it is true on **all admissible precisifications**.

  Consider the borderline case $n$.
  1.  Take any admissible precisification (sharpening) of the predicate "heap." By definition, a precisification makes the predicate precise. So, on *any* given precisification $S$, $H(n)$ is either True or False. There are no gaps *within* a precisification.
  2.  Therefore, on any precisification $S$, the instance of excluded middle $H(n) \lor \neg H(n)$ is True (because classical logic holds within each precisification).
  3.  Since $H(n) \lor \neg H(n)$ is true on **all** admissible precisifications, it is **super-true**.

  **The Result:** Supervaluationism validates every theorem of classical propositional logic, including LEM ($P \lor \neg P$) and Non-Contradiction ($\neg(P \land \neg P)$), even though it admits that for some $P$, neither $P$ nor $\neg P$ is super-true.

  **The Distinction:** Supervaluationism rejects **Bivalence** (the principle that every sentence is either true or false), but it preserves **Excluded Middle** (the principle that every instance of '$P \lor \neg P$' is true). In classical logic, these two principles stand or fall together. Supervaluationism drives a wedge between them.

  *   **Epistemicism:** Accepts Bivalence and LEM. (There is a fact of the matter; $H(n)$ is T or F, we just don't know which.)
  *   **Supervaluationism:** Rejects Bivalence but Accepts LEM. (There is no fact of the matter which disjunct is true, but the disjunction itself is true.)

  ### 2. The Substantive Disagreement

  If both views validate classical logic, why fight? The disagreement shifts from *logic* to *semantics and metaphysics*.

  #### A. The Nature of Vagueness (Ignorance vs. Indecision)
  *   **Epistemicism (Williamson):** Vagueness is a form of **ignorance**. The extension of "heap" is actually sharp. The boundary is fixed by usage and external factors (causal history, natural kinds, etc.) in ways too complex for us to track. When we say "we don't know," we mean there is a fact we are missing.
  *   **Supervaluationism (Fine/Keefe):** Vagueness is **semantic indecision**. The meaning of "heap" is not fully determined. There is no single sharp boundary in reality or language; rather, there is a range of equally admissible ways to make the language precise. None of these precisifications is *the* correct one; they are all permissible.

  #### B. The Cost of Saving Classical Logic
  While both preserve classical theorems, they pay different prices for doing so.
  *   **Epistemicism's Cost:** It requires a highly counterintuitive metaphysics. You must accept that there is a specific nanosecond at which a man becomes bald, or a specific grain of sand that turns a non-heap into a heap, and that this boundary is in principle unknowable. Many find this "magic cutoff" implausible.
  *   **Supervaluationism's Cost:** It sacrifices **truth-functionality**. In classical logic (and Kleene logic), the truth value of $A \land B$ is determined solely by the truth values of $A$ and $B$. In supervaluationism, it is not.
      *   *Example:* Let $P$ be "n is a heap" and $Q$ be "n is not a heap." Both are indeterminate (neither super-true nor super-false).
      *   In Kleene logic, $P \land Q$ would be Indeterminate.
      *   In Supervaluationism, $P \land Q$ is **Super-False** (because on every precisification, one of them is false).
      *   This means you cannot compute the truth of complex sentences just by knowing the status of their parts. You have to look at the "global" behavior across precisifications. This makes the semantics much more complex and less compositional than standard classical semantics.

  #### C. The "Definitely" Operator
  This is often where the seminar discussion will focus. Both theories need an operator to capture the intuition of "determinacy."
  *   **Supervaluationist:** Uses a determinacy operator $D$. $D P$ is true iff $P$ is true on all precisifications. Borderline cases are $\neg D P \land \neg D \neg P$.
  *   **Epistemicist:** Treats $D$ essentially as a knowledge operator $K$. $D P$ means "It is known (or knowable) that P."
  *   **The Clash:** The Supervaluationist says $P \lor \neg P$ is true even though neither disjunct is *definitely* true. The Epistemicist argues this is incoherent: how can a disjunction be true if neither disjunct is true (or definitely true)? Williamson argues that Supervaluationism secretly relies on classical logic to prove there *are* sharp cutoffs (via the "penumbral connection" argument), and thus collapses into epistemicism or incoherence.

  ### 3. Why the Readings Frame It This Way

  You noted that readings describe Supervaluationism as "unusually close to classical logic" while treating Epistemicism's classical status as an afterthought.

  *   **Epistemicism** is "trivially" classical. It says, "Standard semantics is correct; vagueness is just a limitation of our access." It doesn't have to *work* to save classical logic; it just asserts it.
  *   **Supervaluationism** is "surprisingly" classical. It admits truth-value gaps (which usually kill classical logic) but constructs a semantic machinery specifically designed to **recover** classical theorems. Its main selling point *is* that it allows you to have your cake (truth gaps for borderline cases) and eat it too (keep classical logic for reasoning).

  ### Summary for Seminar Discussion

  If you want to demonstrate mastery in the next session, you can frame the contrast like this:

  1.  **Logic:** Both validate classical theorems (like LEM). Supervaluationism does this by distinguishing **truth** (super-truth) from **truth-on-a-precisification**, allowing it to reject Bivalence without rejecting LEM.
  2.  **Semantics:** Epistemicism is truth-functional and compositional; Supervaluationism is non-truth-functional (the whole is not determined by the parts).
  3.  **Metaphysics:** Epistemicism claims vagueness is in the **mind** (ignorance of boundaries); Supervaluationism claims vagueness is in the **language** (semantic indecision).
  4.  **The Trade-off:** Epistemicism buys classical logic at the cost of **sharp boundaries in the world**. Supervaluationism buys classical logic at the cost of **non-truth-functional semantics** and potential issues with **higher-order vagueness** (is the set of "admissible precisifications" itself vague?).

  Your initial confusion was the standard reaction to supervaluationism; realizing that it decouples Bivalence from Excluded Middle is the key to unlocking the rest of the debate.
