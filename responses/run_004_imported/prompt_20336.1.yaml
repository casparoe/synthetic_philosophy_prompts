answer: |-
  This is one of the most fertile and difficult cruxes in Spinoza scholarship. You are right to resist the temptation to dismiss the exclusion of women as mere biographical prejudice; for a dissertation on early modern natural right, the philosophical stakes lie in whether Spinoza's ontology *can* sustain his politics without smuggling in unacknowledged normative premises.

  The tension you identify turns on the ambiguity of Spinoza's equation of *right* with *power* (*jus* = *potentia*). If right is co-extensive with power, then natural inequalities in power entail natural inequalities in right. However, if the purpose of the state is to maximize the power (and thus freedom) of the multitude, excluding half the multitude seems to contradict the utilitarian logic of the social union.

  Here is a reconstruction of the strongest cases for both readings: the **Internal Consistency Reading** (the exclusion is a logical application of his naturalism) and the **Structural Fault Line Reading** (the exclusion reveals a contradiction between his metaphysics and his political aims).

  ---

  ### 1. The Case for Internal Consistency: The Rigorous Naturalist Reading

  This reading argues that the exclusion of women in the *Political Treatise* (TP) is not a betrayal of Spinoza's system but its most consistent application. It requires taking Spinoza's naturalism seriously, stripping away modern egalitarian assumptions about what "nature" implies.

  **A. Right is Power, Not Moral Status**
  In the state of nature, Spinoza argues, there is no sin, no justice, and no inequality of *right*—only inequality of *power*. A fish has a natural right to swim and a bigger fish has a natural right to eat it. In the TP, Spinoza applies this to humans. If women naturally possess less *potentia* (specifically, less capacity for rational self-governance or *animi fortitudo*), they naturally possess less *jus*. To grant them citizenship would be to grant them a right they do not have the power to sustain, which would destabilize the state.

  **B. The Criterion of *Sui Iuris***
  Spinoza's political theory hinges on the distinction between being *in potestate* (in another's power) and *sui iuris* (in one's own right). Only those who are *sui iuris* can enter into the social contract, because the contract requires the capacity to keep covenants based on rational utility rather than immediate passion.
  In TP Ch. 11, §4, Spinoza argues that men and women cannot govern together without "great harm to both," because men and women are dominated by different affects (men by lust/ambition, women by... well, Spinoza is vague, but implies emotional volatility). If women are naturally more dominated by passion than reason, they are structurally analogous to children or servants. We do not consider it a violation of natural right to exclude children from voting; on this reading, Spinoza classifies women similarly based on a purported psychological incapacity.

  **C. Democracy and the "Multitude"**
  In the TTP, Spinoza calls democracy "most natural" because it preserves the equality of the state of nature. However, the TP refines this. The "equality" preserved in democracy is the equality of *citizens*, not of all humans. If a segment of the population is naturally incapable of the rational autonomy required for citizenship, including them would not preserve equality; it would introduce a faction incapable of adhering to the rational dictates of the sovereign. Therefore, excluding them preserves the homogeneity of power required for a stable democracy.

  **D. The Strength of this Reading**
  It avoids anachronism. It accepts Spinoza's premise that political theory must be derived from "human nature as it is," not "as we wish it to be." If Spinoza believes (however wrongly) that women are naturally less rational, his exclusion of them is logically consistent with a theory where authority is derived from the capacity to wield power.

  ---

  ### 2. The Case for a Structural Fault Line: The Immanent Critique Reading

  This reading argues that the exclusion of women exposes a fissure in Spinoza's attempt to derive normative politics from descriptive metaphysics. It suggests that Spinoza's own principles regarding the *construction* of power undermine his claims about women's *natural* lack of power.

  **A. Power is Constitutive, Not Just Predicative**
  For Spinoza, an individual's *conatus* (striving) is not a fixed quantum. Power is augmented or diminished through social relations. We become more powerful (and more rational) by associating with others who agree with our nature.
  *The Critique:* By excluding women from the political sphere, the state actively *diminishes* their power. It denies them the education, participation, and social recognition that cultivate *animi fortitudo*. Therefore, the "natural" weakness Spinoza observes is likely an artifact of the very social exclusion he justifies. The theory claims to describe nature, but it prescribes a social arrangement that creates the nature it claims to observe. This is a performative contradiction.

  **B. The Problem of the *Multitudo***
  Spinoza's later political theory relies heavily on the concept of the *multitudo* (the multitude). The power of the sovereign *is* the power of the multitude.
  *The Critique:* If the sovereign's right is co-extensive with its power, and power is aggregated from the citizens, then excluding half the population drastically reduces the sovereign's *potentia*. A democracy that excludes women is objectively less powerful than one that includes them. If the goal of the state is to maximize the power and freedom of its constituents (the *utilitas* of the state), then excluding women is irrational *on Spinoza's own terms*. It weakens the state to satisfy a prejudice, violating the fundamental imperative of self-preservation.

  **C. The TTP vs. TP Tension: What is "Natural"?**
  In the TTP, democracy is "most natural" because it maintains the equality of the state of nature. But in the state of nature, right *is* power. If women have less power, they have less right. So why is democracy (rule by the many) "most natural" if nature is hierarchical?
  *The Critique:* Spinoza slips here. In the TTP, he treats "natural equality" as a normative ideal (we *ought* to treat each other as equals to avoid conflict). In the TP, he treats natural right as descriptive (might makes right). The exclusion of women reveals that Spinoza cannot sustain a purely descriptive theory of right. He implicitly relies on a normative definition of the "rational agent" (the adult male) to define who counts as a bearer of natural right. This smuggles a moral standard into a theory that claims to reject moral standards in favor of physical laws.

  **D. The Strength of this Reading**
  It utilizes Spinoza's own tools (the social construction of affect, the aggregation of power) to show where his argument fails. It aligns with feminist Spinoza scholarship (e.g., Moira Gatens, Genevieve Lloyd, Susan James) which argues that Spinoza's metaphysics of the mind-body union actually *supports* sexual equality, making his political exclusion an inconsistency he couldn't resolve before his death.

  ---

  ### 3. The Significance of the "Unfinished" Manuscript

  For your dissertation, the fact that the TP breaks off exactly at this point is not trivial.

  *   **The Optimist View:** He died before he could finish the argument, perhaps intending to qualify the exclusion or integrate women into a different class of citizenship (as he does with servants in some readings).
  *   **The Pessimist View:** He reached an aporia. He realized that to maintain his definition of natural right, he had to exclude women, but to maintain his definition of the state's purpose (freedom/power), he needed to include them. The manuscript ends because the system could not resolve the tension between *descriptive naturalism* (women are weaker) and *normative institutionalism* (the state makes us stronger).

  ### Recommendation for Your Chapter

  Given your focus on **early modern theories of natural right**, I suggest framing the tension not as "Spinoza vs. Feminism," but as **Descriptive Power vs. Constructive Power.**

  1.  **Start with the Definition:** Establish how Spinoza redefines *jus naturale* not as a moral claim but as a physical fact (power).
  2.  **Present the Dilemma:** Show how the TTP uses this to argue for democracy (equality of power), while the TP uses it to argue for exclusion (inequality of power).
  3.  **The Crux:** Argue that the exclusion of women is the stress test for Spinoza's naturalism.
      *   If you accept the **Consistency Reading**, you conclude that Spinoza's natural right is fundamentally conservative: it ratifies existing power dynamics (including gender hierarchies) as "natural," making political change difficult unless power dynamics shift physically first.
      *   If you accept the **Fault Line Reading**, you conclude that Spinoza's theory contains the seeds of its own correction. Because power is relational, the "natural" is mutable. The exclusion of women proves that a purely power-based theory of right inevitably collapses into a normative theory of *who counts as powerful*.

  **Scholarly Anchors:**
  *   **For Consistency:** Look at **Thomas Carlisle** or **Steven Smith**, who emphasize Spinoza's realism and the necessity of stability over abstract equality.
  *   **For Fault Line:** **Moira Gatens** (*Feminist Interpretations of Spinoza*) is essential. She argues that Spinoza's metaphysics (parallelism, mind-body unity) undermines his political claims about women. Also **Étienne Balibar** (*Spinoza and Politics*), who discusses the "difficulty of democracy" and how the *multitudo* is always an unstable category.

  **Conclusion for the Dissertation:**
  The strongest position might be a synthesis: The exclusion is *logically* consistent with Spinoza's premises (Reading 1), but those premises are *ontologically* unstable when applied to human psychology (Reading 2). Spinoza wants natural right to be a law of physics, but politics requires a law of freedom. The treatment of women is where the physics of power crashes into the politics of freedom. This makes it a perfect case study for the limits of early modern natural right theories that attempt to ground normativity in ontology.
