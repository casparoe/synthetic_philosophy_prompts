  4.  **Drafting - Reading 2: The "Structural Fault Line" (Internal Contradiction) Argument:**
      *   *Premise:* The goal of the state is *libertas* (freedom/rationality), not just stability. Power is maximized through *reason*, not just brute force.
      *   *Argument:* Spinoza's own psychology suggests that "strength of mind" is cultivated through social institutions, not fixed by nature. By excluding women, the state *creates* the weakness it claims to observe.
