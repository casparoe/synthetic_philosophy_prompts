      *   *Key Scholars:* Moira Gatens, Genevieve Lloyd, Susan James. (Need to reference feminist Spinoza scholarship).
      *   *Strength:* Highlights the tension between descriptive metaphysics and normative politics. Shows how the theory undermines its own goal (maximizing power/freedom).

