  *(Key Insight)*: The crucial difference is that the Lazy Argument assumes the *outcome* is fixed independently of the *process*. Death in Damascus assumes the *process* determines the *outcome* but in a way that makes the process seem futile for the agent's goal. Chrysippus argues the process is never futile because the process *is* the agent's moral locus.

