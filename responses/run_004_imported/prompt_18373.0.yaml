          *   Compare L vs R: $3>0, 2<3, 3>2$. No dominance.
          *   Compare C vs R: $1>0, 1<3, 1<2$. No dominance.
          *   *Mixed Strategies for P2:* Does a mix of L and R dominate C? Since L already strictly dominates C purely, C is eliminated.
          *   **Round 1 Elimination:** Column C is strictly dominated by Column L.
          *   **Reduced Game:**
              ```
                     L          R
              T      3, 3       0, 0
              M      0, 2       3, 3
              B      1, 3       1, 2
              ```

      *   *Check Player 1 (Rows) in Reduced Game:*
          *   Payoffs for P1:
              *   T: (3, 0) against (L, R)
              *   M: (0, 3) against (L, R)
              *   B: (1, 1) against (L, R)
          *   Pure Dominance:
              *   T vs M: $3>0, 0<3$. No.
              *   T vs B: $3>1, 0<1$. No.
              *   M vs B: $0<1, 3>1$. No.
          *   *Mixed Dominance:* Can a mix of T and M dominate B?
              *   Let $\sigma_1 = p \cdot T + (1-p) \cdot M$.
              *   Expected payoff against L: $3p + 0(1-p) = 3p$.
              *   Expected payoff against R: $0p + 3(1-p) = 3 - 3p$.
              *   We need $3p > 1$ (payoff of B against L) AND $3 - 3p > 1$ (payoff of B against R).
              *   $3p > 1 \Rightarrow p > 1/3$.
              *   $3 - 3p > 1 \Rightarrow 2 > 3p \Rightarrow p < 2/3$.
              *   So, any $p \in (1/3, 2/3)$ makes the mixed strategy strictly dominate B. For example, $p=0.5$ yields expected payoffs of $(1.5, 1.5)$, which strictly dominates $(1, 1)$.
          *   **Round 2 Elimination:** Row B is strictly dominated by a mixed strategy of T and M (e.g., 50/50).
          *   **Reduced Game:**
              ```
                     L          R
              T      3, 3       0, 0
              M      0, 2       3, 3
              ```

