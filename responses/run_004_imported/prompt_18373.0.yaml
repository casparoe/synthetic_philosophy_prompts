          T      3, 3       0, 1       0, 0
          M      0, 2       0, 1       3, 3
          B      1, 3       5, 1       1, 2
          ```
      *   **Method:** Iterated Elimination of Strictly Dominated Strategies (IESDS).
      *   **Crucial Condition:** Strategies can be eliminated if dominated by a *mixed* strategy.
      *   **Goal:** Reduce as far as possible.

  3.  **Solve the Game Independently (Ground Truth):**

