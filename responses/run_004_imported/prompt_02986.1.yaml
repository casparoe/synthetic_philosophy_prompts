prompt: |-
  A few weeks ago my team ran a postmortem after a fairly bad production outage, and the final write-up named the root cause as "the on-call engineer's failure to roll back the bad deploy within the fifteen-minute SLA window." That sentence stuck with me, because a great many other people also failed to roll back that deploy within fifteen minutes: I did, our director did, and so did an engineer on a completely unrelated team who had never even heard of the service in question. None of us would ever be listed as a cause of the outage, yet strictly speaking our inaction satisfied exactly the same counterfactual test as the on-call engineer's — if any of us had acted, the outage would have been shorter. That asymmetry bothered me enough that I looked into it, and it turns out I'd stumbled onto a genuine, unresolved dispute in metaphysics about whether absences, omissions, and failures to act can be causes at all, rather than just a question of how engineering orgs like to assign blame.

  As far as I can tell, the standard counterfactual theory of causation, most associated with David Lewis, is committed to saying that omissions can indeed be genuine causes, since the counterfactual test doesn't distinguish between an absent action and a present one; Lewis apparently even wrote a late paper called "Void and Object" extending his account to exactly this kind of case, effectively accepting that it multiplies causes well beyond what common sense would pick out (on this view my director's failure to roll back is just as much a "cause" as the on-call engineer's, even though nobody would say so out loud). Against this are philosophers who hold that genuine causation requires some physical process or transfer connecting cause and effect — Phil Dowe's work seems to be the reference point here — and who conclude that omissions are never causes in the strict sense, only what Dowe calls "quasi-causes," close enough to the real thing to fool our intuitions without actually being it. And then there's apparently a third camp (Sarah McGrath's name came up) that tries to rescue ordinary talk by making causation-by-omission relative to a norm or statistical default, so that an absence counts as a cause only when it departs from how things were supposed to go — which would explain why we pin the outage on the on-call engineer, who had a defined duty to act, and not on the rest of us, who didn't.

  I'd like you to write me a properly argued essay on this question: are omissions ever causes in the full, literal sense, or is a sentence like "the missing rollback caused the outage" always, underneath the surface grammar, doing something other than describing genuine causation — expressing a normative judgment, assigning responsibility, or just speaking loosely for convenience? Please engage seriously with the profligacy problem I ran into above (treating omissions as causes seems to force you to count vast numbers of irrelevant non-events as causes too) and show how each side actually tries to handle it, rather than just surveying the positions. Above all, don't leave me with a shrug at the end: come down on one side, or on a precise qualified position — something like "omissions are causes, but only relative to a contextually fixed normative baseline, and here is why that's principled rather than a cop-out" would count as a real verdict — and defend it against the strongest objections you raised along the way. If you have room, I'd also be curious whether your answer should make us more suspicious of naming any single "root cause" in a postmortem at all, but that's secondary to the main metaphysical question.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The metaphysics of causation by omission (can failures to act be genuine causes?).
      *   **Context:** A software engineering postmortem where the "root cause" was assigned to an on-call engineer's failure to rollback, despite many others also failing to do so.
      *   **Key Problem:** The "profligacy problem" (if omissions are causes, then *everyone's* failure to act is a cause, which seems absurd).
      *   **Philosophical Landscape:**
          *   David Lewis (Counterfactual theory): Omissions *are* causes (leads to profligacy).
          *   Phil Dowe (Process/Conservation theory): Omissions are *not* causes (they are "quasi-causes").
          *   Sarah McGrath (Normative/Default theory): Omissions are causes *relative to norms*.
      *   **Requirements:**
          *   Write a properly argued essay.
          *   Engage seriously with the profligacy problem.
          *   Don't just survey; take a stand (verdict).
          *   Defend the stand against objections.
          *   (Optional but desired) Touch on implications for postmortems/root cause analysis.
      *   **Tone:** Philosophical, rigorous, yet accessible to an engineer/technical audience.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Lewis (Counterfactual):* $C$ causes $E$ iff if $C$ hadn't happened, $E$ wouldn't have happened. If the engineer *had* rolled back, the outage *wouldn't* have happened. So, the failure is a cause.
          *   *Issue:* If *I* had rolled it back, the outage wouldn't have happened. So my inaction is also a cause. This leads to an explosion of causes (the "profligacy" or "abundance" problem).
      *   *Dowe (Process):* Causation requires a physical connection (transfer of energy/momentum/information). An omission is nothing. Nothing cannot transmit anything. Therefore, omissions are not causes.
          *   *Issue:* It clashes heavily with intuition and legal/moral practice. We *do* blame people for omissions (negligence). It makes "causation" too narrow for practical use.
      *   *McGrath/Normative:* Causation is context-sensitive. We distinguish causes from background conditions based on what is "normal" or "expected."
          *   *Issue:* Is this just masking a moral judgment as a metaphysical fact? Does it make causation subjective?

  3.  **Formulate a Thesis:**
      *   I need to choose a side. The prompt asks for a "precise qualified position."
      *   *Option A (Lewis):* Defend profligacy. (Hard to sell to someone bothered by the asymmetry).
      *   *Option B (Dowe):* Deny omissions are causes. (Undermines the utility of postmortems too much).
      *   *Option C (Normative/Pragmatic):* Argue that causation *is* inherently contrastive and normative in practical contexts. This aligns best with the user's intuition about the postmortem while retaining metaphysical rigor.
      *   *Decision:* I will argue for a **Contrastive-Normative Account**. Omissions are not causes in a "god's eye" physical sense (Dowe is right about physics), but causation in human discourse is *never* just about physics; it's about explanation. Therefore, omissions are genuine causes *relative to a normative baseline*. This isn't a cop-out; it's recognizing that "cause" is a pragmatic concept, not just a physical one.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Hook with the postmortem story. State the problem (the asymmetry of blame vs. counterfactual equality). State the thesis (Causation is contrastive and normative; omissions are causes relative to expectations).
      *   **The Counterfactual Trap (Lewis):** Explain Lewis's view. Show why it leads to the profligacy problem (the "director" and "unrelated engineer" example). Acknowledge Lewis's honesty (he accepted the explosion of causes).
      *   **The Physicalist Retreat (Dowe):** Explain the process view. Omissions are "nothings." No physical link.
          *   *Critique:* It saves metaphysics but kills explanation. It makes negligence impossible to describe causally. It's too restrictive for engineering contexts.
      *   **The Normative Solution (McGrath & Others):** Introduce the idea of "defaults." An omission is a cause only if the action was expected.
          *   *Defense:* This solves the profligacy problem. The on-call engineer had a duty (norm); the director did not (in that specific context).
          *   *Objection:* Isn't this just morality disguised as metaphysics?
          *   *Rebuttal:* No, it's about *explanatory relevance*. We seek causes to intervene. Intervening on the on-call engineer's process works; intervening on the unrelated engineer's process doesn't.
      *   **The Verdict:** Synthesize. Causation is a relation between *events* and *alternatives*. "Failure to rollback" means "Failure to rollback *when expected*."
      *   **Implications for Postmortems:** If causation is normative/contrastive, "Root Cause" is a misnomer. It should be "Root Explanation" or "Actionable Factor." Shift from blame to system design.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "profligacy problem" specifically? Yes, by showing how the normative view filters the infinite counterfactuals.
      *   *Check:* Did I take a stand? Yes, the Contrastive-Normative view.
      *   *Check:* Is the tone right? Needs to be respectful of the metaphysics but grounded in the engineering reality.
      *   *Nuance:* Make sure not to say "physics doesn't matter." Physics matters, but *causal selection* is a human cognitive task layered on top of physics.
      *   *Key Distinction:* Distinguish between *causal dependence* (Lewis, physical reality) and *causal attribution* (human practice). I will argue that when we ask "What caused this?", we are asking about attribution, not just dependence.

  6.  **Final Polish:**
      *   Ensure the transition from metaphysics to engineering postmortems is smooth.
      *   Strengthen the defense against the "subjectivity" objection. (It's not subjective; it's based on intersubjective norms/roles).
      *   Make sure the conclusion is decisive.

  7.  *(Mental Outline of the Verdict)*:
      *   Omissions are not *physical* causes (Dowe wins on ontology).
      *   But "causation" in language/practice is not just ontology; it's explanation (Lewis/McGrath win on utility).
      *   Therefore, omissions are *explanatory* causes relative to norms.
      *   This validates the postmortem's focus on the on-call engineer *without* validating blame, provided the norm is system-focused, not person-focused.

  8.  **Writing the Essay.** (Proceeding to generate output based on this thought process).
answer: |-
  **Title:** The Nothing That Did Something: A Defense of Normative Causation

  **Introduction**

  The postmortem document sat on your screen, stark and accusatory: *Root Cause: The on-call engineer's failure to roll back the bad deploy within the fifteen-minute SLA window.* As you noted, this sentence is metaphysically suspicious. Strictly speaking, the counterfactual condition holds for you, your director, and a random engineer in a different division. If any of you had rolled back the deploy, the outage would have ended. By the logic of simple counterfactual dependence, you are all co-conspirators in the outage through your collective inaction. Yet, only one name is effectively written in the blank space of that sentence.

  This asymmetry is not merely a quirk of corporate bureaucracy; it is a manifestation of a deep, unresolved fissure in the metaphysics of causation. The question is whether omissions—failures to act, absences, non-events—can be genuine causes. If they are, we face the "profligacy problem," where the causal field is flooded with infinite non-events. If they are not, we struggle to explain how negligence works or why postmortems make sense at all.

  In this essay, I will argue that the physicalist rejection of omissions is ontologically correct but pragmatically useless, while the pure counterfactual acceptance is pragmatically honest but ontologically bloated. The correct path lies in a third position: **causation by omission is genuine, but it is inherently contrastive and normative.** An omission is a cause not because of a physical link, but because it represents a deviation from a contextually fixed baseline of expectation. This is not a linguistic cop-out; it is a recognition that causal inquiry in human systems is never purely about physics—it is about identifying leverage points for intervention. Consequently, while the postmortem was right to identify the failure to rollback as the cause, it was likely wrong to frame it as a "root cause" belonging to an individual, rather than a systemic deviation from a designed norm.

  **The Counterfactual Trap and the Profligacy Problem**

  To understand the stakes, we must look at the dominant theory you identified: the counterfactual account championed by David Lewis. For Lewis, causation is a matter of dependence. Event $E$ depends on Cause $C$ if, had $C$ not occurred, $E$ would not have occurred. This framework is elegant because it handles preemption and overdetermination well. However, it treats events and non-events symmetrically.

  If the outage ($E$) depended on the on-call engineer's failure to act ($C$), it also depended on your failure to act ($C^*$), and the director's failure ($C^{**}$). Lewis was aware of this. In his later work, including "Void and Object," he essentially bit the bullet. He accepted that causation is "profligate." There are indeed vast networks of negative facts causing things all the time. The reason we don't mention your inaction is not that it isn't a cause, but that it isn't *salient*. We select causes based on what is unusual or informative.

  The problem, as you sensed, is that this turns "causation" into two different things: *causal dependence* (the metaphysical reality, which is infinite) and *causal selection* (the pragmatic act of picking one). If we accept Lewis's view, the postmortem's statement is technically true but misleading. It implies a unique metaphysical status for the on-call engineer's inaction that does not exist. It suggests the engineer *did* something (caused the outage) while the rest of us *did nothing*, when in the counterfactual landscape, we all did the same nothing. This creates a fertile ground for blame, because it disguises a pragmatic selection as a metaphysical discovery.

  **The Physicalist Retreat**

  Opposing Lewis are the process theorists, such as Phil Dowe. They argue that genuine causation requires a physical connection—a transfer of energy, momentum, or information (a "causal process"). On this view, the world is a web of physical interactions. An omission is a lack of interaction. A lack cannot transmit anything. Therefore, omissions cannot be causes.

  When Dowe looks at your postmortem, he says the sentence is literally false. The outage was not caused by the *failure* to rollback; it was caused by the *presence* of the bug in the code, combined with the *presence* of traffic hitting the service. The "failure to rollback" is a "quasi-cause"—a useful fiction we employ for moral or legal reasoning, but not a component of the physical fabric of the universe.

  This view solves the profligacy problem instantly. You didn't cause the outage because there was no physical process connecting your brain to the production server. Only the on-call engineer had a potential process (access, credentials, alerting) that was interrupted.

  However, this victory comes at a steep cost. It renders causation useless for engineering and ethics. In software engineering, we rarely deal with pure physics; we deal with systems designed to respond to absences. A heartbeat monitor causes an alert when a signal *stops*. A circuit breaker trips when current *fails* to flow. If we adopt Dowe's strict physicalism, we cannot say "the lack of a heartbeat caused the alert." We have to engage in contorted phrasing about "the continued absence of a signal triggering a timeout process." More critically, it makes the concept of "root cause" in a postmortem nearly impossible to articulate. Postmortems are not physics experiments; they are investigations into *agency* and *process*. If omissions aren't causes, then negligence is metaphysically impossible. While this might please a defense attorney, it helps no one prevent the next outage.

  **The Normative Baseline: A Principled Middle Ground**

  The third camp, represented by philosophers like Sarah McGrath, offers a way out. They argue that causation by omission is real, but it is relative to a "norm" or a "default." An absence counts as a cause only when it departs from how things were supposed to go.

  This is the position I defend, though I wish to sharpen it. It is not merely that norms are moral rules; it is that **causation in complex systems is inherently contrastive.** When we ask "What caused the outage?", we are implicitly asking "What caused the outage *rather than the system continuing to function*?"

  To answer this, we compare the actual world (outage) with a relevant possible world (no outage). The question is: which difference between these worlds counts as the cause?
  1.  **World A (Actual):** Bug deployed, On-call present, On-call does not rollback. -> Outage.
  2.  **World B (Counterfactual):** Bug deployed, On-call present, On-call *does* rollback. -> No Outage.
  3.  **World C (Counterfactual):** Bug deployed, You present, You *do* rollback. -> No Outage.

  Lewis says both the difference between A/B and A/C are causes. Dowe says neither are. The Normative view says: The difference between A/B is a cause; the difference between A/C is not. Why? Because World B is the **relevant alternative**. It is the world where the system functioned as designed. World C is a world where the system functioned due to external intervention outside the design parameters.

  This is not a cop-out. It is a precise claim about the nature of causal explanation. Causal claims are tools for intervention. We identify causes to know where to push on the world to change the outcome. Identifying your inaction as a cause is useless for intervention because there is no mechanism to make you act in that scenario. Identifying the on-call engineer's inaction is useful *only if* we assume the on-call engineer is the designated intervention point.

  Therefore, omissions are causes *relative to a system's normative architecture*. The on-call engineer's failure is a cause because the system was designed such that their action was the expected default. Your inaction is not a cause because the system design did not encode an expectation of your action. The "norm" is not just a moral rule; it is a structural feature of the socio-technical system.

  **Defending Against the Subjectivity Objection**

  The strongest objection to this view is that it makes causation subjective or moralistic. If causation depends on "expectations," doesn't that mean we can talk away any cause by simply lowering our expectations? If we decide we *expect* engineers to fail, does the failure cease to be a cause?

  No, because the norms in question are not merely personal opinions; they are **functional defaults**. In the context of a production system, the "norm" is defined by the operational contract. The on-call engineer has access, alerts, and a mandate. This creates a causal channel that does not exist for you. The "norm" tracks the *capacity for reliable intervention*.

  To say the on-call's omission caused the outage is to say: "In the class of worlds where the system operates according to its design specifications, this action would have occurred." It is a claim about the system's reliability, not just the individual's morality. This preserves the objectivity of the claim. It is an objective fact about the organization's structure that the on-call engineer was the designated rollback agent. Therefore, their omission is objectively the causally relevant absence, whereas yours is causally irrelevant background noise.

  This solves the profligacy problem without denying the reality of omissions. We do not count your inaction because it is not a deviation from the system's operational baseline. The causal field is pruned not by metaphysics, but by the boundaries of the system under investigation.

  **The Verdict: Omissions as Normative Deviations**

  So, are omissions causes? **Yes, but only as deviations from a normative baseline.**

  The sentence "the missing rollback caused the outage" is not describing a physical transfer of energy. It is describing a failure of the system to meet its own specification. It is shorthand for: "The outage occurred because the specific mechanism designed to prevent this class of outage (the on-call rollback) failed to engage."

  This verdict validates the postmortem's identification of the event while undermining its implicit blame. If the cause is a deviation from a norm, we must ask: *Why was the norm violated?* Was it because the engineer was negligent? Or because the norm itself was fragile?

  If we accept that omissions are causes relative to expectations, then the "root cause" is rarely a person's failure. It is the fragility of the expectation. A robust system does not rely on a single human omission being the pivot point for disaster. If the on-call engineer's failure to act is the primary cause, the system was designed too narrowly. The "cause" of the outage was not the engineer's inaction; it was the organization's decision to rely on a single, fallible, human-mediated rollback mechanism without automated safeguards.

  **Implications for Postmortems**

  This metaphysical stance has direct consequences for how your team should write postmortems.

  First, it suggests that naming a "root cause" is often a category error. If causation is contrastive and normative, there is no single "root." There are only **actionable deviations**. The postmortem should not ask "Who failed to meet the norm?" but "Was this the right norm to rely on?"

  Second, it exposes the danger of the "human error" root cause. If we say "Engineer X failed to rollback," we are treating the engineer as the normative baseline. But in high-reliability engineering, humans are known to be unreliable. The normative baseline should be *automation*. If the rollback wasn't automated, the "cause" of the outage is actually "the decision to require a manual rollback," not the failure to execute one. The omission is only a cause because the system allowed it to be critical.

  Finally, this view protects against the profligacy of blame without absolving responsibility. It acknowledges that the on-call engineer's inaction was the *causally relevant* factor (unlike yours), but it frames that relevance structurally. They were the node in the network designed to absorb the shock. The shock passed through because the node was brittle.

  **Conclusion**

  You were right to be bothered by the asymmetry. The counterfactual theory of causation is too broad, counting your inaction as equal to the on-call engineer's. The physicalist theory is too narrow, denying that inaction can cause anything at all. The truth lies in the normative middle.

  Omissions are causes when they represent a break in a designed chain of expectation. The on-call engineer's failure to rollback was a cause because it was a violation of the system's operational contract. Your failure was not, because you were outside that contract. This makes the postmortem's statement metaphysically defensible, provided we understand "cause" as "explanatorily relevant deviation."

  However, this defense comes with a warning. If we accept that omissions are causes relative to norms, we must accept that the choice of norm is a design decision. By writing "failure to rollback" as the root cause, your team has codified a norm that humans must act within fifteen minutes to prevent disaster. A better metaphysics leads to a better engineering culture: one that recognizes that while omissions can be causes, the true root of the outage is always a system that allowed an omission to be fatal.
