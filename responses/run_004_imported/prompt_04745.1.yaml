answer: |-
  **Private Working Document: Voss, M.**
  **Date:** October 14
  **Subject:** The Relevance Constraint (Notes for J.)

  I need to stop pretending I ran out of funding. I need to stop pretending the board lost patience. The truth is, I looked at the code base for the Mark IV prototype last Tuesday, and I realized I was trying to solve a problem that doesn't exist for the thing I'm trying to build, and *does* exist for the thing I'm using to build it.

  I have to explain this to Julian. He thinks I quit because I got tired. I didn't get tired. I got clear.

  The Frame Problem. It sounds like a bookkeeping error. *Action A occurs; update database to reflect changes; ignore non-changes.* In the early days, we thought it was a search efficiency issue. If the robot picks up the cup, it needs to know the cup moved. Does it need to know the color of the wall didn't change? No. Does it need to know the gravitational constant didn't change? No. But how does it know *which* "no's" to skip without checking them?

  If you check everything, you freeze. If you check nothing, you miss the bomb on the wagon.

  For twenty years, I treated this as an engineering bottleneck. I thought we just needed better heuristics, tighter pruning rules, more granular context tags. But the philosophy kept bleeding into the lab. Specifically, the triad: Fodor, Dennett, Dreyfus. I need to know where I stand before I stand in front of my son.

  **1. Fodor's Wall**
  Fodor was the first to make me sweat. His argument is that belief fixation is *isotropic* and *Quinean*. Isotropic means that any fact in the universe *could* be relevant to any other fact (e.g., the price of tea in China might matter to the stability of the cup if the supply chain affects the ceramic density, etc.). Quinean means you can't test a hypothesis in isolation; you test the whole web of belief.

  Fodor's verdict: Classical computation is local. It only sees the syntax of the symbols right in front of it. Relevance is global. It depends on semantics and context that aren't locally available. Therefore, classical computation cannot model central cognitive processes (like common sense).

  For a long time, I hated this. It felt like surrender. "Computers can't think because computers are computers." But looking at the Mark IV, I see he's right about the architecture. We were trying to build a mind out of logic gates that manipulate explicit representations. We were trying to make relevance a calculated property. But relevance isn't calculated. It's felt. Fodor correctly identified that you cannot derive global relevance from local operations without an infinite regress of meta-rules. If I stay in the computational camp, Fodor wins on the negative thesis: *This specific path is dead.*

  **2. Dennett's Patience**
  Dennett frustrates me because he is so reasonable. He agrees the problem is deep—it's not just a bug, it's the nature of intelligence. But he refuses Fodor's pessimism. He argues that evolution solved the Frame Problem, so it must be computationally tractable. We just need to stop thinking of the mind as a logic engine and start thinking of it as a collection of "good tricks," evolved heuristics that prune the search space before it explodes.

  Dennett's verdict: The Frame Problem is real, but it's a design challenge, not a metaphysical barrier. We just haven't found the right architecture yet.

  I wanted to believe Dennett. God, I wanted to. It would have justified another ten years of grants. But Dennett assumes that "solving" the Frame Problem means finding a better way to *represent* the world and *compute* the changes. He treats the organism as a system that still needs to track truth conditions, just more efficiently. He misses the possibility that the organism *doesn't track truth conditions* in the way we assume. He's trying to fix the engine when the problem is that we're trying to drive a car on water. Dennett is right that intelligence is possible, but he's too polite about the fact that our definition of "computation" might be too narrow to capture it.

  **3. Dreyfus's Dissolution**
  Then there's Dreyfus. He's the one I tried to ignore because he sounded like a mystic. He argues the Frame Problem is an artifact of a bad assumption: that cognition is primarily about manipulating internal representations of an external world.

  If you assume the mind is a mirror of nature, you have to worry about which parts of the mirror need updating. But Dreyfus, leaning on Heidegger, says we aren't mirrors. We are bodies. We don't encounter the world as a set of facts to be reasoned over; we encounter it as a field of *affordances*. The cup isn't "a cylinder at coordinates X,Y"; it's "graspable." The floor isn't "a plane"; it's "walkable."

  When I walk through my kitchen, I don't update a mental model confirming the fridge hasn't turned into a tiger. I don't need to. My body is coupled to the environment. The "relevance" is determined by my goals and my physical engagement, not by a database query. The Frame Problem dissolves because the question "what has changed?" is replaced by "what matters for what I'm doing?" And what matters is disclosed by the situation, not computed.

  **The Verdict**
  Here is where I have to land for Julian.

  Fodor is right that *symbolic, disembodied computation* cannot solve the Frame Problem. You cannot code relevance.
  Dennett is right that intelligence is natural and tractable, but he underestimates the paradigm shift required to get there.
  Dreyfus is right that the problem arises from the representationalist stance itself.

  My conclusion: **The Frame Problem is not a problem for minds; it is a problem for models.**

  We failed not because we couldn't make the robot smart enough, but because we were trying to give it a "world" to hold inside its head. A household assistant doesn't need a model of the kitchen; it needs a coupling with the kitchen. It needs to be the kind of thing for which the fridge turning into a tiger is not a data update to be processed, but a breakdown in the flow of activity that triggers a specific, pre-reflective response.

  I didn't hit a wall. I realized I was drawing a map of a territory I refused to walk.

  To tell Julian: I wasn't trying to build a mind. I was trying to build a library that walks. A library has to catalog every book. A mind just grabs the one it needs. I spent twenty years trying to write a cataloging system fast enough to look like grabbing. It can't be done. Not because the mind is magic, but because the mind is a body, and we were building a ghost.

  I have to tell him that I didn't fail. I just finally read the instructions.
