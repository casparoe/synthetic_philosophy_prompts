answer: |-
  The dishwasher hummed, a low thrum beneath the silence of the kitchen. Ines leaned against the counter, swirling the dregs of wine in her glass.

  "It's the dime, Thomas," she said. "Isen and Levin. One finding a dime in a phone booth makes you helpful; not finding one makes you indifferent. If a ten-cent piece toggles moral behavior, where is the trait? Hartshorne and May found the same with schoolchildren. Honesty wasn't a character structure; it was specific to the situation. They cheated in the classroom but not at home, or vice versa. There is no cross-situational consistency."

  Thomas was drying a plate, methodical. "You're looking for a global consistency that Aristotle never promised. Virtue isn't a reflex that fires identically in every context. It's a stable disposition *guided by reason*. If the situation changes radically, the virtuous response changes. That isn't inconsistency; it's appropriateness."

  "But the situations aren't radically different," Ines said. "Darley and Batson. Seminarians on their way to give a talk on the Good Samaritan. Some are told they're late. Those in a hurry step over a slumped man in an alley. The variable wasn't their theology or their piety. It was time pressure. If virtue collapses because you're five minutes late, it's not a robust property of the agent. It's a function of the environment."

  "Or," Thomas said, setting the plate down, "it shows that practical wisdom—*phronesis*—requires bandwidth. Hurry clouds perception. You can't discern the moral salience of the man in the alley if your cognitive focus is narrowed to the clock. That doesn't mean the virtue doesn't exist; it means it's fragile under specific conditions. But look at Milgram. Even there, not everyone obeyed. Some refused. Those are the virtuous agents. The situationist critique assumes everyone is equally malleable. They aren't."

  "Ines tilted her head. "Thirty percent refused. Sixty-five percent administered lethal shocks because a man in a lab coat told them to. That's not a minority anomaly, Thomas. That's the baseline. And regarding the lab—you always say the lab is artificial. But if character is real, it should withstand artificiality. If it dissolves under forced-choice paradigms, then what is it? You're defining virtue so narrowly that only a sage possesses it, and then claiming the sage exists because you haven't found enough data to disprove him."

  "I'm defining it accurately," Thomas said. "Virtue is an achievement, not a given. Most people don't have it. That's why Aristotle spends so much time on education and habituation. You're measuring the moral competence of novices and calling it evidence against the expert model. Of course the seminarians failed; they were students. Of course the subjects obeyed; they were untrained. The existence of bad drivers doesn't prove driving is a fiction."

  "But the studies show situational factors outweigh dispositional ones even when controlling for training," Ines countered. "The consistency coefficients in Hartshorne were point-three. Point-three, Thomas. That's statistical noise. You're defending a ghost. You want character to be the cause of behavior, but the data says the situation is the cause. You're left with a virtue ethics that applies to almost no one, almost never."

  "Then it applies to the people who matter," Thomas said. "The ones who stop for the man in the alley even when late. The ones who refuse the shock. Their character is real. The fact that it's rare doesn't make it an empirical fiction. It makes it an aspiration."

  "And if the aspiration relies on ignoring how easily human psychology is hijacked?" Ines asked. "If you teach students that virtue is internal stability, but the world runs on external triggers, you aren't educating them. You're arming them with a myth."

  Thomas picked up the wine bottle. It was empty. "Or I'm teaching them that the trigger doesn't have to pull the bullet. That takes work. That takes the very wisdom you say the data disproves."

  "The data says the work usually fails," Ines said.

  "The data says most people haven't finished it," Thomas replied. He looked at her, tired but steady. "We've been married ten years, Ines. Do you think I'm the same person I was on day one?"

  "In some situations," she said softly. "Not in others."

  "Exactly," he said. "Work in progress."

  "Or situationally dependent," she said.

  "Perhaps," he said. "Pour the water."
