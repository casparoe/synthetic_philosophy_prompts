answer: |-
  Your dinner party friend's hesitation was well-founded. While the narrative arc is compelling—and your editor is right that it makes for a great hook—the specific philosophical argument you've outlined doesn't actually hold water. If you publish the claim that Dummett's anti-realism *logically entails* his liberal immigration stance, you will invite serious criticism from philosophers and political theorists.

  You are effectively bolting two unrelated parts of his career together, though not because they aren't both "Dummett." They are united by his character and ethical commitments, not by a direct deduction from his semantics to his politics.

  Here is the breakdown of why the "straight logical line" argument fails, and how you can salvage the connection in a way that is philosophically robust.

  ### 1. The Category Mistake: Social Facts vs. Metaphysical Facts
  Your core argument rests on this premise: *If truth isn't fixed by mind-independent facts, then there is no mind-independent fact about who "really" belongs.*

  The problem is that **everyone**, including hard-nosed metaphysical realists, agrees that there is no "mind-independent fact" about citizenship or borders.
  *   **Metaphysical Realism** concerns things like electrons, the past, or mathematical objects (e.g., "Did Caesar sneeze exactly three times on his 30th birthday?" or "Does an electron have a definite position before measurement?").
  *   **Institutional Facts** concern things like money, marriage, and borders. These are *constituted* by human agreement and rules.

  A metaphysical realist (who believes truth is mind-independent) would still agree that a border is a human invention. They wouldn't say, "There is a mind-independent physical fact that this person is French." They would say, "It is true that this person is French because they satisfy the criteria set by the French state."

  Therefore, Dummett's anti-realism doesn't undermine the "reality" of borders any more than realism does. The question of immigration isn't about whether borders exist metaphysically; it's about whether the *rules* governing them are just. Anti-realism doesn't solve that.

  ### 2. Dummett's Actual Motivation: Catholicism, not Semantics
  If you look at Dummett's own writings on immigration, particularly *On Immigration and Refugees* (2001), he does not derive his arguments from *Truth and Other Enigmas* (1978). He derives them from **Catholic social teaching** and **liberal egalitarianism**.

  Dummett was a devout Catholic convert. His activism (co-founding the Oxford branch of the Anti-Apartheid Movement, serving on the Commission for Racial Equality) was driven by a sense of religious and moral duty to the marginalized. He argued that rich nations have a moral obligation to the poor, and that nationalism often functions as a form of collective selfishness that violates Christian charity.

  In interviews, Dummett often kept his technical philosophy and his politics in separate compartments. He didn't claim his theory of meaning forced him to be pro-immigration. He claimed that *justice* forced him to be pro-immigration.

  ### 3. The "Burden of Proof" Confusion
  You suggest that anti-realism shifts the burden of proof to the state. In philosophy, the "burden of proof" in anti-realism is about *warranted assertibility* (can we verify this claim?). In politics, the "burden of proof" is about *legitimacy* (does the state have the right to coerce?).

  While these sound similar, they operate in different domains. You can be a semantic anti-realist and believe the state has an absolute right to exclude (if, for example, you believed the verification conditions for "citizen" were strictly met). Conversely, you can be a metaphysical realist and believe in open borders (because God or Natural Law dictates it). The two levers don't move together mechanically.

  ### How to Save the Story (The "Methodological" Angle)
  You don't have to scrap the connection entirely. In fact, the most interesting version of this story isn't about **logic**, it's about **temperament**.

  Instead of arguing that his metaphysics *caused* his politics, argue that they share a **methodological commitment to justification**.

  *   **In Philosophy:** Dummett hated "mystical" explanations of truth. He insisted that if we claim something is true, we must be able to explain *how we know it*, what counts as evidence, and how we manifest our understanding. He disliked theories that posited inaccessible, magical facts hovering beyond human reach.
  *   **In Politics:** Dummett hated "mystical" explanations of nationality. He despised the idea of a "national character" or an organic "spirit of the people" that supposedly justified exclusion. He demanded that states justify their borders with clear, rational, moral arguments, not appeals to vague, inaccessible sentiments.

  **The Pivot:**
  The connection isn't that anti-realism *disproves* borders. The connection is that Dummett had a profound intolerance for **unjustified authority**.
  *   In semantics, he challenged the authority of "Truth" when it transcended human verification.
  *   In politics, he challenged the authority of the "Nation-State" when it transcended moral justification.

  ### Recommendation for the Article
  If you open with the strong claim ("Dummett's anti-realism proves open borders"), you will lose credibility with the very experts you're writing about.

  **Try this angle instead:**
  > "Michael Dummett is the philosopher who taught us that truth requires verification. He is also the activist who taught us that borders require justification. While he never claimed his metaphysics dictated his politics, the same fierce intolerance for 'mysterious authority' powered both. Just as he rejected truth conditions we could never grasp, he rejected national boundaries we could never morally defend."

  This preserves your editor's desire for a unified portrait of the man without making a category error that will get the piece debunked on philosophy blogs. It honors the spirit of your intuition—that there is a unity to his life—without falsifying the technical work.
