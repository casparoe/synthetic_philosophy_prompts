answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the brother of the bride. I'm also currently grinding through a PhD in philosophy, which my sister tells me makes me the perfect person to give this toast, provided I keep the jargon to a minimum. I've promised her I won't talk about Kant, so we're already off to a good start.

  But there is one philosopher I have to mention. Because, as many of you know, [Sister] and [Partner] are decision theorists. And they have this origin story—half-joking, half-serious—that they trace their entire relationship back to Frank Ramsey.

  Now, for the two-thirds of you who aren't lying awake at night thinking about probability logic: Frank Ramsey was a brilliant British philosopher and mathematician who died tragically young, at twenty-six. He left behind a short piece of writing called the "Epilogue," and it deals with a problem that actually fits a wedding quite well.

  Here is the problem: When we look at the universe, it is incomprehensibly old and incomprehensibly vast. In comparison, a human life is tiny. It's a blink. It's a speck.

  Usually, people handle this fear in one of two ways. The religious might say, "Don't worry, God made the universe for you." The romantics might say, "Don't worry, our love is eternal; it will outlast the stars."

  But Ramsey argued that both of those responses make the same mistake. They both agree that *size* and *duration* are what make something valuable. They accept the premise that to matter, you have to be big, or you have to last forever.

  Ramsey's argument in the "Epilogue" is a refusal of that metric. He says that goodness is not a quantity. You cannot add up the size of the universe and the size of a human life on the same scale. The value of a good life, or a good action, or a genuine commitment, does not depend on how long it lasts or how much space it occupies. It is intensive, not extensive.

  So, [Sister] and [Partner], I have a constraint for this toast. Because if I were to stand here and say, "May your love last forever," or "May your marriage outlast the sun," I would be insulting your intelligence. I would be suggesting that your commitment is only valuable if it conquers time. I would be smuggling in the very standard Ramsey rejected.

  I cannot promise you eternity. None of us can. The universe is under no obligation to accommodate our timeline.

  But here is the beautiful part of Ramsey's view, and why it is actually so perfect for today. If value doesn't come from duration, then it comes from *presence*. It comes from the quality of the choice you are making right now.

  Ramsey suggests that a human life is significant simply because it is lived well, not because it is lived long. By that light, a marriage isn't a bet on the future; it's a commitment to the present. It is the decision to treat another person's good as your own, regardless of the cosmic backdrop.

  In decision theory, you talk about expected utility. You weigh probabilities. But there are some choices where the utility isn't in the outcome; it's in the act itself. To stand here, in front of your friends and family, and say "I am yours," is not valuable because it guarantees the next fifty years. It is valuable because it is true *today*.

  [Sister] and [Partner], you two have built a life on the idea that rationality and emotion aren't enemies. You know that choosing to love someone is the most rigorous decision you can make. It requires constant updating, constant re-evaluation, and a willingness to accept uncertainty.

  So, I am not going to wish you a love that defies the laws of physics. I am not going to wish for a marriage that ignores the entropy of the universe.

  Instead, I wish you a love that is significant regardless of the scale. I wish you the courage to find the infinite in the finite moments—the morning coffee, the difficult conversations, the quiet evenings. I wish you a marriage where the value is never measured by the clock, but by the depth of the commitment you bring to each day.

  Frank Ramsey wrote that "the good is not a quantity." He meant that you don't need more time to have a good life; you just need to live the time you have well.

  So, please raise your glasses.

  To [Sister] and [Partner]. May your life together be small, if the universe demands it. May it be brief, if time demands it. But may it be undeniably, intensely, and overwhelmingly *good*.

  To the couple!
