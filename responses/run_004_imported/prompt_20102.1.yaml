answer: |-
  Good evening, everyone. For those who don't know me, I'm the older brother. And for those who *do* know me, you know why I'm currently sweating through this suit.

  I was told a toast should be from the heart. But when you're marrying into a room that is fifty percent software engineers and fifty percent logic philosophers, "from the heart" feels like an insufficient data type. I need something type-safe.

  I've spent the last three weeks terrified of this speech, mostly because of the dynamic in this room. On one side, we have Dan's coworkers, who speak in Python and C++. On the other, Priya's old classmates, who speak in predicates and axioms. And then we have the rest of the family—my mom, my aunts—who have sat through eight years of Thanksgiving dinners listening to Dan and Priya argue about "the Gödel thing."

  For the family: Gödel's Incompleteness Theorem, roughly speaking, says that in any complex logical system, there are true statements that cannot be proven *within* that system.

  For the experts: Yes, I know that's a simplification. Please don't tweet about it.

  This is how Dan and Priya met. In a Philosophy of Mind elective, arguing over the Lucas-Penrose argument. Priya's stance has always been the classic Lucas position: that a human mind can step outside a formal system and perceive the truth of a Gödel sentence that the system itself cannot prove. Therefore, the mind is not a machine. She's very strict about this, by the way. She'll tell you she stopped listening to Penrose the moment he started talking about quantum microtubules.

  Dan's counter, which he has deployed at every holiday gathering since 2016, is: "How do you know *you* aren't just as buggy and inconsistent as any program? If you're inconsistent, your 'intuition' is just a glitch."

  It's their love language. They bicker about mechanistic reductionism the way other couples bicker about whose turn it is to do the dishes. And honestly, I don't know who's winning. But standing here, looking at them, I realized that trying to settle that argument tonight would be a category error.

  Because there is a second Incompleteness Theorem. Gödel also proved that no consistent formal system can prove its *own* consistency.

  Do you see what that means?

  It means Dan, you cannot prove within your system that you are right. And Priya, you cannot prove within your system that you are human. You are the system. You cannot validate the marriage from the inside.

  *That* is the job of the rest of us.

  We are the meta-language. We are the outside observers. And from out here, looking at the system you two have built together, the truth value is clear.

  Dan, you treat life like a problem to be solved. You think if you just run the algorithm long enough, you'll get the right output. Priya, you treat life like a truth to be recognized. You know that some things are valid even if they can't be derived from the axioms.

  And that is exactly why this works. Because a marriage isn't a proof. It's not a script that halts. It's the one thing you can be completely sure of, even though you could never write it down as a formal proof.

  Dan, Priya isn't a machine you can debug. Priya, Dan isn't a formal system you can outsmart. They are just two people who have found a truth that exists outside the logic of their arguments.

  So, I'd like to propose a toast.

  To Dan and Priya: May your system be consistent, may your bounds be checked, and may you always remember that while you can't prove your own consistency... we certainly can.

  To the bride and groom!
