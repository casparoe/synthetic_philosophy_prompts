answer: |-
  **Title:** The Limit of Determination: Thomson's Lamp, Benacerraf's Gap, and the Supervenience of Supertasks

  **Introduction**

  In the landscape of modern philosophy of physics, few thought experiments are as enduring or as vexing as Thomson's Lamp. Proposed by James Thomson in 1954, the scenario describes a lamp switched on and off infinitely many times within a finite interval (a supertask), culminating at $t=1$. Thomson argued that the lamp's state at $t=1$ is logically contradictory, rendering the supertask impossible. Paul Benacerraf's 1962 rebuttal is widely taught as the definitive dissolution of the paradox: he argued that the state at $t=1$ is merely underdetermined by the history of the lamp, not contradictory.

  For a dissertation concerning idealized infinite processes, the stakes are higher than mere logical puzzle-solving. If Benacerraf is entirely correct, the logical barrier to supertasks vanishes, leaving only contingent physical constraints (energy, speed of light, etc.). If Thomson retains some force, it suggests a deeper structural incoherence in applying infinite discrete operations to physical time. This essay reconstructs the strongest versions of both positions. It argues that while Benacerraf is correct that Thomson's specific argument for *logical contradiction* fails, Thomson's underlying intuition identifies a genuine metaphysical problem: the failure of **causal supervenience**. The verdict is that Benacerraf dissolves the logical paradox, but Thomson's lamp demonstrates that such supertasks are **causally incomplete**. They are not logically impossible, but they cannot be the sole determinants of their own outcomes within a deterministic framework.

  **Thomson's Argument from Exhaustion**

  Thomson's original argument is not merely that we do not *know* the state of the lamp at $t=1$, but that the lamp *cannot have* a state. His reasoning relies on the Principle of Excluded Middle and a specific assumption about how temporal processes determine their endpoints.

  Thomson posits that for the lamp to be on at $t=1$, it must have been turned on at some moment $t < 1$ and not turned off again. Conversely, for it to be off, it must have been turned off and not turned on again. However, the description of the supertask dictates that for every moment $t_n$ where the lamp is turned on, there is a subsequent moment $t_{n+1}$ where it is turned off, and vice versa. Every "on" state is cancelled by a subsequent "off" state within the interval $[0, 1)$.

  Thomson concludes:
  1.  The lamp cannot be on at $t=1$ (because every switching-on is followed by a switching-off).
  2.  The lamp cannot be off at $t=1$ (because every switching-off is followed by a switching-on).
  3.  The lamp must be either on or off at $t=1$.
  4.  Therefore, the scenario entails a contradiction ($P \land \neg P$).

  Thomson takes this contradiction to prove that the concept of completing a supertask is inherently incoherent. The force of his argument rests on the implicit premise that the state at the limit point ($t=1$) is a logical consequence of the states in the sequence ($t < 1$). He treats the history of the lamp as exhaustively determining its future, assuming that "completing" the task implies the final state is the *result* of the infinite sequence of operations.

  **Benacerraf's Diagnosis: The Logical Gap**

  Benacerraf's 1962 reply, "Tasks, Super-Tasks, and the Modern Eleatics," attacks Thomson's implicit premise. Benacerraf argues that Thomson conflates the logical properties of a sequence with the properties of its limit.

  Benacerraf observes that the description of the supertask specifies the state of the lamp *only* for $t < 1$. It says nothing about $t=1$. Mathematically, the function describing the lamp's state, $f(t)$, is defined on the half-open interval $[0, 1)$. There is no logical rule that forces $f(1)$ to take a specific value based on the oscillation of $f(t)$ as $t \to 1$. Just as the sequence $1, -1, 1, -1...$ has no limit, the state of the lamp does not converge.

  However, Benacerraf insists that the absence of a limit does not entail a contradiction. It entails **underdetermination**.
  1.  The rules of the supertask determine the state for all $t < 1$.
  2.  The rules do not determine the state for $t = 1$.
  3.  Therefore, the state at $t=1$ is logically independent of the sequence.

  On Benacerraf's view, we are free to stipulate a boundary condition: "The lamp is on at $t=1$." This stipulation does not contradict the history of the lamp, because the history does not logically entail the negation of that stipulation. Thomson's error was assuming that the state at $t=1$ must be *derived* from the switching history. Once we recognize that $t=1$ is a distinct logical point not covered by the switching rule, the contradiction vanishes. The supertask is logically possible; it simply leaves the final state open.

  **The Objection: Causal Supervenience and the "Repaired" Thomson**

  Benacerraf's logical victory is decisive against Thomson's claim of *contradiction*. However, for a philosopher of physics, Benacerraf's solution raises a deeper worry that vindicates Thomson's intuition, if not his logic. This is the problem of **Causal Supervenience**.

  If we accept Benacerraf's analysis, the state of the lamp at $t=1$ is logically independent of the infinite sequence of switchings that preceded it. We can stipulate the lamp is on, or off, or that it explodes, without logical inconsistency. But if the state at $t=1$ is independent of the history, in what sense is it the *result* of the supertask?

  In physical systems, we generally expect the state of a system at a time $t$ to supervene on the state of the system and the laws of nature at times $t' < t$. If the infinite switching history does not determine the state at $t=1$, then the "completion" of the task is causally disconnected from the task itself. The lamp does not end up on or off *because* of the switchings; it ends up on or off because of an arbitrary boundary condition added *ex post facto*.

  This suggests a "repaired" Thomsonian argument:
  1.  A physically intelligible process requires that the final state supervenes on the prior history and the governing laws.
  2.  In Thomson's Lamp, the prior history (the infinite switching) does not determine the final state (as Benacerraf correctly shows).
  3.  Therefore, to fix the final state, one must add a law or condition external to the switching process.
  4.  If the final state requires external determination, the supertask itself does not "complete" in a causally closed sense; it merely terminates.

  Thomson's original error was claiming this lack of determination was a *contradiction*. The repaired insight is that it is a **causal discontinuity**. Thomson was right to feel that something is unintelligible about the "completion," but he misdiagnosed it as a logical error rather than a metaphysical one. The "impossibility" is not that the lamp cannot be on or off, but that the process described cannot *produce* a determinate outcome on its own.

  **Verdict: Logical Possibility, Causal Incompleteness**

  Does Thomson's lamp show that supertasks are impossible, or does Benacerraf fully dissolve the difficulty? My verdict is that **Benacerraf is correct regarding logical possibility, but Thomson is correct regarding causal intelligibility.** Benacerraf does not *fully* dissolve the difficulty; he relocates it.

  The specific claim that survives is this: **Supertasks involving discrete, alternating states are logically coherent but causally indeterminate.**

  Thomson's argument fails because it assumes logical determination where there is none. Benacerraf is right that there is no contradiction in stipulating a final state. However, Thomson's resistance points to a genuine constraint on physical modeling: **The Principle of Causal Closure.** In standard physical theories (classical mechanics, relativity), the state of a system at a boundary is typically determined by the evolution of the system up to that boundary (e.g., via differential equations). Thomson's Lamp describes a process where the evolution function is undefined at the limit.

  If we treat the lamp as a physical system, we cannot simply "stipulate" the state at $t=1$ without violating the expectation that physical states evolve continuously or deterministically from prior states (unless a stochastic law is invoked). If the state at $t=1$ is independent of the history, the "supertask" is not a single causal process culminating in a result; it is a sequence of events followed by a brute fact.

  Therefore, the "interesting sense" in which Thomson's lamp renders supertasks problematic is not logical impossibility, but **explanatory failure**. A supertask of this kind cannot explain its own outcome. For a dissertation on spacetime singularities, this is crucial. A singularity might be logically consistent (as Benacerraf would argue), but if the state of the spacetime beyond the singularity does not supervene on the state prior to it, the theory loses predictive power.

  **Conclusion**

  Benacerraf successfully refutes Thomson's claim that the lamp's final state entails a contradiction. The logical paradox is dissolved. However, Thomson's intuition that the "completion" of the task is suspicious remains valid. The suspicion is not that the lamp cannot be on or off, but that the infinite history of switching is causally impotent to decide which it is.

  Thus, the verdict is: **Thomson's Lamp demonstrates that discrete supertasks are causally incomplete.** They are logically possible only if we abandon the requirement that the final state be determined by the process history. For the philosopher of physics, this means supertasks are not ruled out by logic, but they impose a heavy metaphysical cost: the decoupling of the limit state from the process leading to it. Thomson was wrong to call it a contradiction, but he was right to call it unintelligible as a *determinate physical process*. Benacerraf saves the logic, but Thomson saves the physics.
