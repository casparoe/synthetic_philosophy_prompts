  So I've been down a rabbit hole on the replication crisis in psychology and all the p-hacking scandals, and I keep running into two totally different takes on Fisher. Some people basically blame him for the whole p<.05 checkbox mentality that caused all this. Other people say no, that rigid accept/reject cutoff thing was really Neyman and Pearson's baby, and Fisher actually couldn't stand mechanical decision rules like that. So if you could plop Fisher down at a psych conference today and show him a paper that barely scraped past p=.049 after some 'exploratory' tweaking, plus preregistration, registered reports, giant multi-lab replication projects, and the ASA basically telling everyone to stop treating .05 like a magic line -- what do you honestly think he'd say? Would preregistration strike him as fixing the actual thing he cared about, or missing it? And would he have any real sympathy for people now saying just ditch p-values for Bayesian methods instead, or is that an even bigger sin in his eyes then the current mess?
