answer: |-
  You have hit on one of the great ironies of modern science. Your intuition is spot-on: **Fisher would be absolutely furious, but not for the reasons most people think.**

  You are correct about the history. The "checkbox mentality" ($p < .05$ = truth, $p > .05$ = garbage) is indeed the child of **Jerzy Neyman and Egon Pearson**, not Fisher. Fisher viewed the p-value as a continuous measure of evidence against the null hypothesis—a sort of "surprise index." He explicitly warned against using a fixed level of significance (like 0.05) as a rigid decision rule. He wrote that 0.05 was merely a "convenient convention," not a line in the sand.

  Neyman and Pearson, on the other hand, were interested in **inductive behavior**. They wanted a quality-control system for making decisions (accept/reject) that minimized long-run error rates (Type I and Type II). They needed a fixed $\alpha$ to make the math work for their decision framework.

  Modern psychology (and most social sciences) uses a confusing **hybrid**: we calculate Fisher's p-value but apply Neyman-Pearson's binary decision rule.

  If you teleported R.A. Fisher—chain-smoking, combative, brilliant Fisher—into a modern psychology conference, here is how he would likely react to the specific elements you mentioned.

  ### 1. On the $p = .049$ "Exploratory Tweaking"
  Fisher would view this not as a statistical error, but as a **moral failure**.

  Fisher believed that the validity of a p-value rests entirely on the integrity of the experimental design. If you tweak your analysis until you cross a threshold, you have violated the conditions under which the probability was calculated. To Fisher, a p-value is only meaningful if the test was specified *before* looking at the data.

  He would likely say that the researcher has committed a form of fraud. He famously argued that **"no scientific worker has a fixed level of significance at which from year to year, and in all circumstances, he refuses to be impressed."** By hacking the data to hit .049, the researcher is treating the statistic as a hurdle to clear rather than evidence to weigh. He would blame the *researcher's lack of judgment*, not the statistic itself.

  ### 2. On Preregistration and Registered Reports
  **He would probably love this.**

  Fisher's magnum opus was titled *The Design of Experiments*. His core philosophy was that you cannot use statistics to rescue a poorly designed experiment. The statistical analysis is the final step of a process that begins with rigorous design.

  Preregistration forces the scientist to commit to a design and analysis plan *before* seeing the data. This aligns perfectly with Fisher's view that the probability calculation assumes a specific testing procedure. If you change the procedure after seeing the data (p-hacking), the probability is meaningless. Preregistration restores the mathematical validity of the p-value by locking in the design.

  However, Fisher might offer a caveat: He valued exploratory science. He would likely warn that preregistration should not stifle genuine discovery, but he would insist that exploratory findings be clearly labeled as such and **not** treated as confirmed facts until replicated.

  ### 3. On Multi-Lab Replication Projects
  **This is where Fisher would feel most vindicated.**

  Fisher never believed a single experiment could establish a scientific fact. He famously wrote:
  > *"A scientific fact should be regarded as experimentally established only if a properly designed experiment rarely fails to give this level of significance."*

  Note the word **"rarely fails."** He wanted replication. He wanted the phenomenon to be robust enough to show up again and again. The modern replication crisis exists precisely because the field stopped listening to him. They treated a single $p < .05$ result as a "discovery" rather than a single piece of evidence requiring confirmation.

  He would look at the Many Labs projects or the Reproducibility Project: Psychology and say, "Finally, you are doing science again."

  ### 4. On the ASA Statement ("Stop treating .05 as magic")
  He would likely chuckle, light a cigarette, and say, **"I told you so."**

  Fisher spent decades arguing that the 5% level was arbitrary. He suggested that scientists should report the exact p-value and use their scientific judgment to interpret it. If the ASA is now telling people not to use .05 as a bright line, Fisher would view this as the statistical community finally admitting that the Neyman-Pearson "decision rule" hijacking of his work was a mistake.

  ### 5. On Ditching P-Values for Bayesian Methods
  **Here is where he would get into a fistfight.**

  Fisher was a frequentist (though a very idiosyncratic one who developed "fiducial inference"). He had a famous, lifelong feud with the Bayesian statistician Harold Jeffreys. Fisher disliked the Bayesian reliance on **prior probabilities**.

  To Fisher, priors introduced subjectivity into science. He wanted inference to be based solely on the data from the experiment at hand (the likelihood), not on what you believed before you started. He would likely view modern Bayesian methods as swapping one form of manipulation for another. Instead of "p-hacking," you would have "prior-hacking" (tweaking your priors until you get the posterior you want).

  He would not see Bayesianism as the savior. He would likely argue that the problem isn't the *type* of probability (frequentist vs. Bayesian), but the **mechanical application of any probability** without scientific judgment.

  ### The Verdict: What Would Fisher Actually Say?

  If Fisher took the podium at that conference, his speech wouldn't be about switching to Bayes or tweaking the alpha to .005. It would be about **responsibility**.

  He would argue that the replication crisis wasn't caused by the p-value; it was caused by scientists abdicating their responsibility to think. They handed their judgment over to a "human computer" (the statistical test).

  *   **On Preregistration:** "Good. It forces you to design the experiment properly before you look at the results. But do not let it prevent you from noticing something unexpected."
  *   **On Replication:** "Essential. One significant result is nothing. A phenomenon that cannot be reproduced is not science."
  *   **On Bayes:** "You are replacing objective error rates with subjective beliefs. You have not solved the problem of judgment; you have just hidden it inside the prior."
  *   **On the Crisis:** "You have taken a tool meant to aid judgment and turned it into a substitute for judgment. The statistician is not a human computer. The scientist must think."

  In short: Fisher would blame the **hybrid NHST framework** (blending his evidence with N-P's decisions) and the **culture of publish-or-perish** that incentivized hacking. He would see preregistration and replication as steps toward fixing the *design* and *verification* process, which is what he cared about most. But he would warn that no statistical method, Bayesian or otherwise, can save science from scientists who refuse to think critically about their data.
