prompt: |-
  Ok so this has been bugging me for like two weeks and I keep going back and forth on it in my head. At my job we've got this pretty senior engineer, I'll call him Marcus, who has a well-known habit of skipping our PR review process whenever he's under time pressure — he just pushes straight to main and "deals with it later" if anything breaks. Funny enough, he's actually the one who showed our newest hire, Priya, how to do this when she joined (some workaround with the branch protection settings), half-joking that everyone does it eventually. Fast forward to last week: Priya pushed straight to main to hit a deadline, it caused a small but annoying prod bug, and Marcus — who also happens to be writing her performance review this cycle — pulled her aside and gave her a whole lecture about discipline and how skipping review is exactly the kind of thing that gets people managed out. Objectively I don't think he said anything false, skipping review probably was reckless there and did cause a real problem. But a few of us who overheard felt kind of icky about it, like it wasn't really his place to be the one saying it, even though none of us could explain why in any rigorous way.

  I brought this up with my roommate over dinner and she just said "well, is what he said true or not, that's all that should matter," which kind of stumped me because I dont think thats quite right either, but I couldn't say why. Is there something actually wrong with Marcus being the one to deliver that message, given his own track record (and the fact that he taught her the habit in the first place), or is that irrelevant and we should just judge his words on their own merits like my roommate said? Does it change anything that he wasn't just some random coworker venting but literally her manager for review purposes? I've never taken a philosophy class so maybe there's some obvious framework I'm missing, but I don't want the generic "communication is important" type answer — I want to actually understand what's going on here conceptually, like is there a real principle at stake or are we just being petty/protective of our teammate.
