answer: |-
  You are not being petty, and your intuition is picking up on something very real that your roommate's framework misses. Your roommate is operating under a model of **propositional truth** (is the statement factually accurate?), whereas your discomfort stems from **normative authority** (does the speaker have the right to make this demand?).

  In philosophy and ethics, there is a specific concept that explains exactly why this feels "icky." It is called **the standing to blame.**

  Here is the breakdown of the principles at stake, why your roommate's logic fails in this context, and why Marcus's behavior is conceptually flawed.

  ### 1. The Distinction: Truth vs. Standing
  Your roommate argues: *"Skipping review is risky. Marcus said skipping review is risky. Therefore, Marcus is right."*

  This treats moral or professional advice like a math equation. If $X = \text{bad}$, and Marcus says $X = \text{bad}$, the statement is true regardless of who says it.

  However, human interactions aren't just data transfers; they are **speech acts**. When a manager gives a performance critique, they aren't just stating a fact; they are exercising authority. They are imposing a norm. For that imposition to be legitimate, the imposer must have **standing**.

  **The Principle of Standing:**
  In moral philosophy (explored by thinkers like R. Jay Wallace and Gary Watson), you lose the standing to blame someone for a violation if you are guilty of the same violation yourself. This isn't about the *truth* of the claim; it's about the *hypocrisy* of the agent.

  *   **Example:** If a speeder pulls you over and yells at you for speeding, their statement ("Speeding is dangerous") is factually true. But they lack the *authority* to enforce that norm because they are violating it themselves.
  *   **Application:** Marcus lacks the standing to lecture Priya on discipline regarding PR reviews because he actively violates that same discipline. By teaching her to bypass the rule, he became a co-conspirator. By punishing her for it, he becomes a hypocrite. Hypocrisy undermines the legitimacy of the blame.

  ### 2. Kant and the Categorical Imperative
  You mentioned you haven't taken philosophy, but Immanuel Kant's framework is the gold standard for this specific type of inconsistency.

  Kant argued that for an action to be moral, it must be **universalizable**. You must act only according to rules that you would be willing to see become universal laws for everyone, including yourself.

  *   **Marcus's Maxim:** "When under time pressure, I will skip PR reviews to save time, but when my subordinate is under time pressure, they must follow PR reviews to ensure quality."
  *   **The Contradiction:** Marcus is making himself a special exception to the rule. He is treating the rule as a tool to control Priya, rather than a principle to guide the team.

  In Kantian terms, Marcus is treating Priya as a **means to an end** (a scapegoat to absorb the risk of his own bad habits) rather than as an **end in herself** (a colleague deserving of consistent standards). He is asking her to follow a law he has explicitly exempted himself from. That is a violation of duty.

  ### 3. Institutional Legitimacy and "Clean Hands"
  There is also a political/legal concept here called the **"Clean Hands Doctrine."** It essentially states that you cannot seek justice or enforcement if you have acted unethically regarding the matter at hand.

  In a workplace, norms (like PR reviews) derive their power from **procedural justice**. People follow rules because they believe the rules apply equally to everyone.
  *   **When Marcus pushes to main:** He signals that the rule is optional for the "elite" or the "busy."
  *   **When he teaches Priya to do it:** He signals that the rule is a suggestion he is willing to help her break.
  *   **When he punishes her:** He signals that the rule is actually a trap that only applies to the vulnerable.

  This creates what is known as an **entrapment dynamic**. He normalized the deviance (made breaking the rule seem okay), and then penalized the deviance. This destroys the legitimacy of the rule itself. If the enforcer breaks the law, the law becomes arbitrary. Arbitrary rules create anxiety and resentment, not discipline.

  ### 4. Why Your Roommate is Wrong (Conceptually)
  Your roommate is committing a category error. She is judging the **content** of the message, ignoring the **context** of the relationship.

  If a random stranger on the internet told Priya, "Skipping PR reviews is risky," that would be true and harmless.
  But Marcus is not a stranger; he is a **manager with evaluative power**. His words carry weight because they affect her career (performance review, potential firing).

  Because his words carry consequences, he incurs a higher burden of integrity. He is not just offering advice; he is wielding power. Power without consistency is tyranny. Therefore, his track record is **highly relevant**. It determines whether his use of power is just or abusive.

  ### Summary of the Principles
  1.  **Normative Standing:** You cannot legitimately enforce a rule you actively break. Marcus forfeited his right to lecture Priya by teaching her to break the rule.
  2.  **Universalizability:** Marcus is applying a double standard (one rule for him, one for her), which is logically and ethically inconsistent.
  3.  **Legitimacy:** By normalizing the behavior then punishing it, Marcus turned a safety protocol into a trap. This undermines the team's trust in the process.

  ### Conclusion
  You aren't being protective or petty. You are recognizing a violation of **procedural justice**.

  The "icky" feeling is your brain detecting **incongruence between authority and conduct.** Marcus is trying to have it both ways: he wants the *efficiency* of breaking the rules (for himself and his team) but the *safety* of enforcing the rules (when things go wrong).

  Priya took the fall for a culture Marcus cultivated. Objectively, yes, skipping PRs is risky. But structurally, Marcus is the one who failed the team, not just Priya. He failed to model the behavior, he failed to maintain the boundary, and he failed to accept responsibility for the culture he created.

  So, to answer your question: **Yes, it matters profoundly that it was him.** In ethics, *who* speaks is often just as important as *what* is said, especially when power is involved. Truth without integrity is just manipulation.
