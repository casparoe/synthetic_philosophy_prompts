answer: |-
  This is a classic philosophical puzzle disguised as a software governance dispute. It is a variation of the **Ship of Theseus paradox** applied to social artifacts. Below is an analysis of the exchange move by move, followed by the missing context and a final verdict.

  ### Move-by-Move Analysis

  **(1) Iris: The River Analogy**
  *   **Claim:** The project is the same because the people and purpose remain, even if the code (the "water") changes.
  *   **Assessment:** **Iris has the better intuition, but weaker logic.** Her analogy captures the *social reality* of open source: projects are defined by their communities and intent, not just binary artifacts. However, philosophically, the "River" or "Ship of Theseus" analogy is notoriously unstable. It asserts continuity without providing a criterion for *why* people matter more than code. It feels right, but it doesn't prove a fact of the matter exists.

  **(2) Marcus: The Image vs. Argument**
  *   **Claim:** Without shared code, name, or governance, "sameness" has no factual answer; it is a choice of definition.
  *   **Assessment:** **Marcus has the better logical point.** For social constructs like "software projects," there is no mind-independent metaphysical essence. If all physical and structural components (code, name, legal entity) are replaced, asserting identity relies entirely on linguistic convention. He correctly identifies that there is no "project soul" to detect.

  **(3) Iris: The Legal Stakes**
  *   **Claim:** It can't be semantics because courts fight over this, and they treat it as real.
  *   **Assessment:** **Iris has the better pragmatic point, but conflates law with ontology.** She is correct that the *consequences* are substantive (money, liability, reputation). However, she mistakes legal *fiction* for metaphysical *fact*. Courts rule on trademark and contract law based on public confusion and statutory definitions, not on the objective "truth" of project identity. A court ruling makes something legally distinct, not ontologically unique.

  **(4) Marcus: Conventions vs. Facts**
  *   **Claim:** Courts enforce conventions, not metaphysics. If definition settles it, nothing further is at stake.
  *   **Assessment:** **Marcus is technically correct, but dismissive.** He is right that law is a system of conventions. However, his claim that "nothing further [is] at stake" is weak. Reputation, user trust, and network effects are at stake, and these are not dissolved simply by agreeing on a definition. People care deeply about which convention is adopted.

  **(5) Iris: The Persistence of Disagreement**
  *   **Claim:** If it were purely definitional, agreeing on the facts (same people, zero shared code) should end the argument. It hasn't.
  *   **Assessment:** **Marcus wins this logical exchange.** Iris misunderstands the test for a verbal dispute. In philosophy (specifically following Rudolf Carnap), if two parties agree on all empirical facts but still disagree on a statement ("Is this the same project?"), that is the *definition* of a verbal dispute. The disagreement persists precisely because they are prioritizing different criteria (community vs. code), not because there is a hidden fact they are missing.

  ### Important Missing Elements

  1.  **Ontological vs. Normative:** Both friends are arguing an ontological question ("*Is* it the same?") when they are actually having a normative disagreement ("*Which one deserves* the title?"). Iris values community continuity; Marcus values material/legal continuity. Neither is a "fact"; both are value judgments masked as identity claims.
  2.  **Brand Equity and Goodwill:** They are missing the economic concept of "goodwill." The "project" is a brand. A fork might inherit the "soul" (contributors) but lose the "brand" (name/trademark), or vice versa. The dispute is often about who inherits the user base, which is a substantive economic fact, even if the "identity" is verbal.
  3.  **The Nature of "Verbal" Disputes:** "Verbal" does not mean "trivial." Disputes over how to use words (e.g., "Is a fetus a person?", "Is this art?") drive wars and lawsuits. They are verbal because they rely on definitions, but they are high-stakes because those definitions govern resource allocation.

  ### Conclusion on the Nature of the Dispute

  The question asks whether the disagreement is about a **further fact** or **how to use a word**.

  There is no empirical or metaphysical fact of the matter regarding the identity of a software project once code, name, and governance diverge. "Project identity" is a human convention, not a natural kind like "water" or "gold." Therefore, there is no hidden fact for Iris to find. However, Marcus is slightly wrong to imply the stakes are low. The dispute is verbal in its *structure* (it relies on competing definitions/concepts), but the *implications* are substantive.

  Since the prompt forces a choice between "further fact" and "how to use a word," and there is no fact independent of human convention to be found:

  \answer{verbal}
