answer: |-
  It is a genuine philosophical whiplash to go from the Curry-Howard correspondence to UK immigration policy, but Michael Dummett's *On Immigration and Refugees* (2001) reveals a consistent core in his thinking. Just as his intuitionistic logic demands that truth be grounded in verifiable proof rather than abstract metaphysical assumptions, his political philosophy demands that state power be grounded in specific justification rather than assumed sovereignty.

  Dummett's argument is deceptively simple: the burden of proof must always lie on the state to justify keeping someone out, never on the migrant to justify getting in. He starts from the premise that humans have a fundamental right to seek a livelihood and safety wherever they can find it. Borders are coercive barriers that restrict this basic human agency. Therefore, any restriction requires a positive, evidence-based justification. Dummett looked at the Britain of his day and concluded that most justifications—economic strain, cultural cohesion, welfare protection—were empirically shaky veneers for racism. He wasn't arguing for absolutely open borders in a utopian sense, but for a presumption of entry that could only be overridden by concrete, demonstrable harm to the existing population, not mere discomfort or prejudice.

  The strongest counter to this comes from liberals like Christopher Wellman (building on Michael Walzer), who argue that states are akin to private clubs or marriages. If you accept freedom of association as a basic liberty, it must include the freedom *not* to associate. Existing members of a political community, the argument goes, have a right to determine who joins their collective project. Wellman adds a controversial twist: even if we have duties to outsiders, we can discharge them through foreign aid. Basically, a state can buy its way out of the obligation to admit refugees. If you send enough money to fix the problems abroad, you get to keep the border closed, even to the neediest person on earth.

  On the surface, the "club analogy" feels intuitive. But over beers, this argument falls apart under scrutiny. The primary flaw is that states are not voluntary clubs. You can quit a country club; you cannot easily quit a state, and you certainly cannot choose which state governs the territory you were born on. Because states hold a monopoly on legitimate force and control the only viable means for humans to access rights and livelihoods, treating them as private associations masks their coercive nature. If a club denies you membership, you join another. If a state denies you entry everywhere, you are left in a state of nature where rights are meaningless.

  Furthermore, Wellman's "buyout" clause is a total dodge. It treats human rights as a debt ledger rather than a moral status. You cannot discharge the duty to save a drowning person by throwing them a lifejacket from a boat while refusing to pull them aboard, especially if the lifejacket is leaky (which foreign aid often is). Aid addresses symptoms; admission addresses the immediate threat. To say a state can pay to keep a refugee in a dangerous zone implies that the refugee's claim is on the state's wealth, rather than on their shared humanity and safety. It commodifies the obligation.

  So, who wins the fight? Dummett takes the round, but with a necessary qualification.

  Dummett's presumption of entry is the only framework that respects the asymmetry of power between the state and the individual. The "freedom of association" argument privileges the comfort of the privileged over the survival of the desperate. However, Dummett's view shouldn't be read as absolute. There is a valid exception hidden in the "club" argument, though not the one Wellman intends. It isn't about cultural character or economic preference; it's about physical capacity and institutional stability. A state can exclude if admission would genuinely collapse the institutions that guarantee rights for everyone, including current citizens. If the boat is literally sinking, you can stop boarding passengers.

  But that is a high bar. It requires proof of imminent systemic collapse, not just a dip in wages or a change in neighborhood demographics. Under this verdict, Dummett's burden of proof stands. The state must demonstrate that specific entry causes specific, severe harm to the functioning of the political community. Wellman's "buyout" is rejected because you cannot bribe your way out of a duty to rescue when the rescue is within your capacity. Ultimately, Dummett aligns with the intuitionistic spirit: don't claim a right to exclude based on abstract sovereignty; show us the verification of the harm. Until you can do that, the door stays open.
