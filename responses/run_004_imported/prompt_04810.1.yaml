  9.  *(Self-Correction on the "Classic Example"):* The prompt mentions: "expanding the bargaining set in a way that looks like a pure improvement for one player still leaves that player no better off under Nash's solution." This is specifically the failure of **Individual Monotonicity** by Nash. I need to explain *why* Nash does this. It's because Nash only looks at the slope of the frontier at the solution, not the extent of the frontier.

