      *   *Prompt focus:* The prompt asks about the strike against IIA ("expanding the bargaining set... leaves that player no better off under Nash"). This is the Monotonicity critique of Nash. I need to focus on why Nash ignores the expansion of the "utopia" if the local frontier doesn't change.

