  5.  **Evaluating Defensibility (Is KSS better?):**
      *   It's not a slam dunk.
      *   *Problem with KSS:* Sensitivity to "irrelevant" utopias. If I add an option that is wildly beneficial to me but impossible for you to accept (or just never chosen), KSS shifts the solution in my favor. Nash calls this manipulation.
      *   *Problem with Nash:* Insensitivity to opportunity sets. If my potential gains double, but the "efficient frontier" near the middle stays the same, Nash gives me the same. KSS says I have more leverage now.
      *   *Verdict:* It depends on what "Fairness" means. Is it about *process consistency* (Nash) or *outcome proportionality* (KSS)?
      *   *Connection to Astronomy:* Time allocation. Is it about maximizing total science (Utilitarian/Nash-ish) or proportional access based on proposal scope (KSS-ish)?

