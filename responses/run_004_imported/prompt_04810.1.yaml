      *   *The specific IIA violation:* If I have a set $S$ and solution $f(S)$. I create $T \subset S$ such that $f(S) \in T$. Nash says $f(T) = f(S)$. KSS says $f(T)$ might differ because the Ideal Point of $T$ is different from $S$.
