      *   **Stable Equilibrium (ESS):** Signals evolve to an equilibrium where the marginal benefit equals the marginal cost. Going beyond this point is wasteful without adding information. A peacock with a tail *too* big gets eaten.
      *   **Correlation vs. Causation of Cost:** The cost ensures honesty, but the *level* of cost is tuned to the stakes. Over-signaling can be a sign of insecurity or miscalibration, not just quality.
