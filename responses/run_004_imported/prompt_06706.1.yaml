answer: |-
  Here are ten interview questions designed for your discussion group's role-play of Thomas Hobbes. They are structured to probe the tensions in his epistemology without allowing him to retreat into mere dogma. Each includes a follow-up tuned to his characteristic rhetorical evasions.

  ### I. On the Certainty of Construction vs. The Reality of Error

  **1. The Wallis Contradiction**
  "Master Hobbes, you assert that geometry is certain because we construct its objects ourselves; we cannot err in what we have willed into being. Yet, for thirty years you have engaged in a public duel with John Wallis regarding the squaring of the circle, and the mathematical community declares your constructions impossible. If geometry is a science of our own making, how is it possible for you to make a mistake in a domain where you claim the maker is immune to error? Does your failure not suggest that even in geometry, we are discovering constraints we did not stipulate?"

  *   **Likely Evasion:** He will claim Wallis and the algebraists do not understand *true* geometry, which is about physical magnitude, not abstract symbols, and that the error lies in their definitions, not his construction.
  *   **Follow-up:** "Then you concede that the certainty of geometry relies not on our construction alone, but on the universal agreement of definitions? If the community of geometers rejects your definition of 'magnitude' as incoherent, by what authority—other than stubbornness—do you claim your construction remains 'scientia' while theirs is 'nonsense'? Are you not, in effect, appealing to a reality of proportion that exists independently of your will?"

  ### II. On the Foundation of Magnitude and Motion

  **2. The Kinematic Basis of the Line**
  "You ground the certainty of geometry in the fact that we generate lines by the motion of points and surfaces by the motion of lines. But is 'motion' not a concept borrowed from natural philosophy, which you admit is merely conjectural? If the foundation of your certain science (geometry) rests upon a concept (motion) derived from an uncertain science (physics), does the certainty of the former not contaminate the latter? Why is the 'motion' of a geometric point more knowable than the motion of a planet?"

  *   **Likely Evasion:** He will distinguish between 'universal' motion (the abstract concept of change of place) and 'particular' motion (the specific cause of a specific body), claiming the former is a priori conceivable.
  *   **Follow-up:** "But to conceive of 'change of place' requires a conception of Space and Time. You argue these are phantasms of the mind, yet you treat them as fixed containers for your geometric generations. If Space is merely a 'phantasm of a thing existing without the mind,' how can it serve as the immutable grid for your demonstrations? Are you not smuggling in an absolute reality under the name of a mental image?"

  ### III. On Algebra and Symbolic Reasoning

  **3. The Rejection of Algebra**
  "You scorn the algebraic methods of men like Viète and Oughtred, calling them a 'scab of symbols' that obscures true magnitude. Yet these methods allow practitioners to solve problems your purely geometric constructions cannot. If the end of science is the knowledge of consequences from causes, and algebra successfully predicts consequences, on what grounds do you banish it? Is your objection truly epistemological, or is it merely an aesthetic preference for figures over numbers?"

  *   **Likely Evasion:** He will argue that algebra manipulates names without regard for the things they signify, leading to absurdities (like negative roots) that geometry forbids.
  *   **Follow-up:** "You say algebra loses the 'thing' in the 'name.' But in your own geometry, is a 'line' not itself a name for a distance? If I calculate a ratio using symbols and arrive at a true measurement of a building, have I not demonstrated a consequence from a cause? If the result holds in nature, does your insistence on visualizing the generation of the magnitude add any truth, or merely any pleasure?"

  ### IV. On the Geometry of the Commonwealth

  **4. The Premises of Leviathan**
  "In *Leviathan*, you claim to demonstrate the necessity of Sovereignty as one demonstrates a theorem. However, in geometry, we stipulate the definitions (e.g., 'a triangle is three lines'). In your politics, your first principles are the passions of mankind—fear, pride, greed. Did we construct these passions, or did we observe them? If the latter, is your political science not built on the same conjectural observation of nature that you forbid in physics?"

  *   **Likely Evasion:** He will argue that while the passions are natural, the *Commonwealth* is an artificial man constructed by covenant; therefore, we know its properties because we authorized its creation.
  *   **Follow-up:** "We authorize the Sovereign, yes, but we do not authorize the *necessity* of doing so. You argue we *must* covenant to avoid death. Is that 'must' a logical necessity, like 2+2=4, or a psychological prediction based on your observation that men fear death more than they value honor? If a man arises who fears honor more than death, does your geometrical demonstration of the State collapse?"

  ### V. On the Status of Astronomy

  **5. The Conjectural Heavens**
  "You classify astronomy as merely conjectural because we cannot see the causal machinery of the heavens, only the effects. Yet, the Copernicans use geometry to predict eclipses with perfect precision. If their geometry yields certain predictions, why do you deny them the title of 'science'? Is it not sufficient for a physicist to know *that* the heavens move in such a way, even if we cannot know *why* God set them in motion?"

  *   **Likely Evasion:** He will insist that knowing the 'cause' is the definition of science; prediction without causal knowledge is merely 'prudence' or experience, like a sailor knowing the winds without knowing meteorology.
  *   **Follow-up:** "But if I can construct a clock that perfectly mimics the motions of the stars, have I not generated the effect artificially? By your own standard, does that not make my model 'science'? If the mathematical model predicts the phenomenon as well as a causal explanation, what work is left for your 'true cause' to do, other than to satisfy a metaphysical itch?"

  ### VI. On the Role of Language and Definition

  **6. The Arbitrariness of Definitions**
  "You claim science begins with the settled signification of words. But who settles them? If geometry is certain because we define our terms, is that certainty not merely tautological? We can prove things about a 'centaur' with certainty if we define it well, but that tells us nothing of the world. How does your geometry escape being a sophisticated game of definitions that never touches the physical reality your natural philosophy seeks to explain?"

  *   **Likely Evasion:** He will argue that geometric definitions are generative; they describe how a thing is made, not just what it is called, thus linking the name to a possible physical existence.
  *   **Follow-up:** "But a 'perfect circle' cannot be made in physical reality; ink has width, stone has grain. If your definitions rely on perfect generation, they exist only in the mind. If they exist only in the mind, how do they govern the behavior of physical bodies? You seem to demand that nature obey the definitions of your mind, rather than your mind observing the definitions of nature."

  ### VII. On Optics and the Boundary of Science

  **7. The Case of Light**
  "In your *Opticks*, you attempt to demonstrate the laws of reflection and refraction using geometric expansions of the medium. Yet, you admit we cannot know the true nature of light itself, only its motion. If the subject (light) is conjectural, how can the predicate (reflection) be demonstrable? Are you not building a certain bridge from an uncertain shore?"

  *   **Likely Evasion:** He will claim that while the *substance* of light is unknown, the *motion* of propagation is a universal category of body, and thus subject to universal geometric laws.
  *   **Follow-up:** "But refraction depends on the density of the medium, which is an empirical variable, not a geometric necessity. If you must measure the density to complete your demonstration, have you not admitted that geometry alone is insufficient? Is it not true that your 'demonstration' is merely a geometric skeleton that requires the flesh of empirical observation to stand?"

  ### VIII. On God and the Limits of Knowledge

  **8. The First Cause Problem**
  "You argue we cannot have science of nature because God created it, and we cannot know the mind of God. But if we are made in God's image, and our reason is a spark of the divine, why is our capacity to construct geometry not also a capacity to intuit the structure of God's creation? Why draw such a sharp line between the world we make and the world God made, if the same reason interrogates both?"

  *   **Likely Evasion:** He will argue that God's power is infinite and incomprehensible; we can only know what we can compass within our own finite power of generation.
  *   **Follow-up:** "Then your distinction is not about Truth, but about Power. Science, for you, is not about what *is*, but about what we can *do*. Does this not reduce natural philosophy to a form of engineering? And if so, why deny the title of 'science' to the astronomer who cannot move the stars but can predict their place? Is prediction not a form of power?"

  ### IX. On the Utility of Conjecture

  **9. The Value of Hypothesis**
  "If natural philosophy is merely conjectural, why should we pursue it? If we can never know the true causes of heat or gravity, only propose plausible models, is the labor not wasted? As men of science (in the modern sense), my colleagues and I have spent our lives measuring causes you say are unknowable. Do you condemn our life's work as mere 'opinion'?"

  *   **Likely Evasion:** He will say it is not wasted, for 'conjecture' allows us to produce effects and ease the burden of life; it is 'philosophy' in the service of power, even if not 'scientia' in the strict sense.
  *   **Follow-up:** "So you admit that 'conjectural' knowledge can build ships, cure diseases, and fortify cities. If this 'opinion' yields the same fruits as 'science,' is your epistemological distinction not merely a semantic quarrel? If I can cure the patient with a conjectural theory of humors, does the certainty of the cause matter to the living man?"

  ### X. On the Legacy of Materialism

  **10. The Body of the World**
  "Finally, Sir, you reduce all reality to body and motion. If the universe is nothing but bodies in motion, then the human mind is also nothing but a body in motion. If my thoughts are merely motions in my head, why should I trust them to demonstrate geometry any more than I trust them to demonstrate physics? If materialism is true, is not *all* reasoning merely the collision of atoms, devoid of truth or falsehood, surviving only because it is useful?"

  *   **Likely Evasion:** He will argue that while thoughts are motions, *right* reasoning follows a universal order of consequences that mirrors the order of causes in the world; truth is the correct ordering of names.
  *   **Follow-up:** "But who verifies the 'correctness' of the order? If my brain's atoms collide to produce '2+2=5' and yours to produce '2+2=4', and both are merely material events, by what immaterial standard do you judge me? Does your system not saw off the very branch of rational certainty upon which your geometry sits?"
