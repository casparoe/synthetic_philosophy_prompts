      *   *Point 1: Temporal/Causal Structure.* The game unfolds in time. Toss 1 happens, then Toss 2, etc. The outcome is determined at a specific moment $n$. The "state of the world" evolves.
      *   *Point 2: Truncation and Limits.* In physics, we deal with finite systems approaching a limit. A real game must be truncated (finite time/resources). If we truncate by time $T$ (max tosses), the natural order is $1$ to $T$. Rearrangements imply a non-physical access to outcomes (knowing toss 100 before toss 1).
      *   *Point 3: Dominance and Stochastic Processes.* The game is a stochastic process $X_t$. The expectation is the limit of the expectation of the truncated process $E[X_{\min(n, T)}]$.
      *   *Point 4: Decision-Theoretic Pragmatism.* If you play the game once, you get one $n$. If you play it many times (law of large numbers context), the average converges. Wait, does it? For Pasadena, the variance is infinite, so LLN doesn't apply straightforwardly. *Correction:* Focus on the single-case valuation or the finite truncation limit.
      *   *Point 5: Comparison to Physics.* In physics, boundary conditions fix the solution. Here, the "boundary condition" is the protocol of the game. The protocol dictates $n=1$ is checked first.

