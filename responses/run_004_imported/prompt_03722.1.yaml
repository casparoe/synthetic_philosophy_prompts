      *   *Point 4: "Words Divide, Pictures Unite".* This is the trickiest part. Emoji *do* unite people in a vibe, but they divide meaning. A 😒 means different things to different generations. Isotype aimed for a single, unified meaning.
      *   *Conclusion:* He would view it as a "corrupted Isotype." A warning of what happens when you remove the scientific rigor from visual language.

