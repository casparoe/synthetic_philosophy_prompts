          *   No ambiguity, irony, or emotion in pictures.
          *   Connection to Logical Positivism/Vienna Circle (verification, unambiguous communication).
      *   **The Conflict:** Emoji look like Isotype (standardized pictures), *but* they are used for emotion, irony, ambiguity, and vary by platform (lack of standardization).
      *   **The Question:** Would Neurath see emoji as a victory (his dream realized) or a cautionary tale (corruption of the method)?
      *   **Constraint:** Avoid vague "1930s intellectual vs. texting" generalizations. Wrestle with his specific reasoning.

