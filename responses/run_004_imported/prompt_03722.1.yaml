      *   *Epistemology:* Physicalism. Statements must be verifiable. "There are 5 chairs" is verifiable. "I feel sad" is less so (in his strict view).
      *   *Function:* Isotype was didactic. It was meant to teach sociology, economics, health. It was not meant for conversation.
      *   *Standardization:* Crucial. A symbol for "coal" must mean "coal" everywhere, not "hard work" or "danger" depending on context.

  3.  **Analyze Emoji through Neurath's Lens:**
      *   *Standardization:* Unicode exists (like Isotype's catalog), but rendering differs (Apple vs. Android). Neurath hated ambiguity. A "grimace" looking like a "grin" on another phone violates the "verifiability" principle.
      *   *Function:* Emoji are primarily phatic (social bonding) and emotional. Isotype was informational.
      *   *Syntax:* Emoji often modify text (tone indicators). Neurath said pictures run *alongside* words, but as parallel information, not necessarily as tone modifiers for the words. However, the "helper language" aspect fits.
      *   *Ambiguity/Irony:* The skull emoji (💀) meaning "I'm dead from laughter" is the antithesis of Logical Positivism. It is metaphorical, subjective, and culturally specific.

  4.  **Synthesize the Argument:**
      *   *Initial thought:* He would hate them.
      *   *Nuance:* He would recognize the *ambition* (universal language) but reject the *application* (emotional/ambiguous).
