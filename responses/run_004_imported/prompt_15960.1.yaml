answer: |-
  The Nash Bargaining Solution (NBS) is the crown jewel of introductory game theory. It is elegant, unique, and mathematically robust. But its dominance in the classroom has created a blind spot in the boardroom. When we move from static, closed-system models to dynamic, high-stakes negotiations like wage bargaining—where the "feasible set" is not a fixed geometric shape but a living, breathing entity that expands and contracts based on performance, trust, and external shocks—the Kalai–Smorodinsky (KS) solution is not just a viable alternative; it is the superior normative model.

  The core of this argument rests on a single trade-off: Nash prioritizes **Independence of Irrelevant Alternatives (IIA)**, while Kalai–Smorodinsky prioritizes **Individual Monotonicity**. In a static vacuum, IIA makes sense. In a dynamic negotiation where the pie is a moving target, IIA is a liability, and Monotonicity is essential for fairness and efficiency.

  Here is the case for why Kalai–Smorodinsky is the realistic choice for modern negotiation.

  ### 1. The "Moving Target" Problem: Why IIA Fails in Dynamics
  Nash's IIA axiom states that if you remove outcomes from the bargaining set that no one was going to choose anyway, the solution shouldn't change. Conversely, if you add new options that don't immediately become the solution, the outcome remains static. This treats the bargaining set as a fixed photograph.

  But wage bargaining is not a photograph; it is a movie.

  Consider a union negotiating with a firm. The "feasible set" is determined by the firm's ability to pay. Suppose new technology is introduced mid-negotiation that *could* double profits, but the implementation is risky. The **ideal point** (the maximum possible utility each side could theoretically hope for) shifts dramatically for the firm, and potentially for the workers (via higher wages).

  Under the **Nash solution**, unless the *current* Pareto frontier physically bulges outward immediately, the solution might not budge. Nash is obsessed with the *product* of gains at the margin. It looks for the tangent point on the current curve. If the "potential" grows but the "current guaranteed surplus" hasn't shifted yet, Nash tells the workers: "Nothing has changed."

  Under **Kalai–Smorodinsky**, the solution is determined by the ratio of the players' ideal points. KS draws a line from the disagreement point to the "utopia point" (the vector of maximum possible gains for each player). If the firm's potential profit skyrockets (shifting the utopia point), the slope of that line changes. KS dictates that the workers' share should adjust *in proportion* to that new potential, even if the current cash-on-hand hasn't changed yet.

  In a dynamic environment, ignoring the shift in potential (as IIA effectively does) is dangerous. It signals to the party enabling the expansion (the workers accepting new tech, or the firm investing capital) that their increased leverage won't be recognized until the money is literally in the bank. KS recognizes the *claim* on the surplus, not just the surplus itself.

  ### 2. Monotonicity as an Incentive Mechanism
  The Monotonicity axiom is simple: If the bargaining set expands in a way that increases one player's maximum possible payoff without reducing the other's, that player should not end up with a worse outcome. In fact, in the KS solution, they typically end up with a better one.

  This is critical for **value creation**. In wage bargaining, the size of the pie is often endogenous—it depends on the effort and cooperation of the negotiators.

  If you use the Nash solution, you risk creating perverse incentives. Because NBS maximizes the product of utilities $(U_1 - d_1)(U_2 - d_2)$, it can sometimes result in a situation where an expansion of the feasible set benefits the party with *less* bargaining power disproportionately, or leaves the other party indifferent, depending on the curvature of the frontier. There are scenarios in Nash bargaining where expanding the pie can actually leave one party's absolute share unchanged or even diminished relative to the new total, because the "tangent point" shifts in counter-intuitive ways.

  Kalai–Smorodinsky guarantees **proportional gain**. If the company's capacity to pay (their ideal point) doubles, KS ensures the union's share moves along the ray of proportionality. This aligns with the normative intuition of "gain-sharing." If I help you unlock more value, Monotonicity ensures I ride the wave up with you. It makes the negotiation mechanism itself incentive-compatible for cooperation. In long-term labor relations, where the "game" is repeated infinitely, KS fosters the trust required to expand the pie. Nash fosters haggling over the current slice.

  ### 3. Normative Defensibility: Aspirations Matter
  There is a deeper philosophical reason to prefer KS in wage bargaining: it respects **aspirations**.

  Nash bargaining is purely consequentialist regarding the *current* feasible set. It doesn't care what you *could* have had; it cares about what is on the table right now. But human negotiation is psychological. It is driven by reference points and expectations.

  In labor disputes, the "Ideal Point" is often the anchor. A union doesn't just want "more than the strike threat"; they want a share of the "maximum possible profit." The KS solution mathematically codifies this intuition. It says: *Fairness is maintaining the ratio of your achievement relative to your best-case scenario.*

  If the firm argues, "We can't pay more because the feasible set is constrained," but the union knows the firm's *ideal point* has shifted due to market monopolization or tax breaks, the union perceives a violation of fairness. Nash cannot capture this violation if the current feasible set boundary hasn't moved. KS captures it immediately because the utopia point has moved.

  By prioritizing Monotonicity over IIA, KS acknowledges that **opportunity is a resource.** If your opportunity set expands, your bargaining power has objectively increased, even if you haven't exercised it yet. To ignore that (as IIA does) is to ignore a fundamental source of leverage and value.

  ### 4. The Verdict
  The Nash Bargaining Solution is the perfect tool for a static, one-shot division of a fixed resource where the boundaries are known and immutable. It is the physics of a vacuum.

  But wage bargaining happens in the atmosphere. It involves friction, shifting pressures, and expanding gases. In this environment, the Independence of Irrelevant Alternatives is not a feature; it is a bug. It blinds the model to changes in potential and leverage that haven't yet materialized on the frontier.

  Kalai–Smorodinsky is the more realistic model because it treats the bargaining set as a function of **potential** rather than just **constraint**. By enforcing Monotonicity, it ensures that when the pie grows, the slices grow proportionally. It aligns the mathematical solution with the human intuition that if your capacity to pay increases, my fair share increases, regardless of whether the "irrelevant alternatives" on the edge of the set have changed.

  For any negotiation where the relationship matters more than the transaction, and where the value is created jointly over time, Kalai–Smorodinsky isn't just a mathematical footnote. It is the only solution that respects the dynamics of value creation.
