      *   *Example:* An organism could have a "logic module" that says "If tiger, then run." It doesn't need to understand the logical form $\forall x (T(x) \rightarrow R(x))$. It just needs the heuristic.
      *   *Crucial Point:* Mathematical *realism* (Platonism) posits numbers exist independently of us. Evolution happens in spacetime. How does evolution hook onto the abstract realm of numbers? Street says "usefulness forces truth." But usefulness is about *survival*, numbers are about *abstract relations*. There is no necessary link between "helping me survive" and "corresponding to abstract Platonistic entities."

