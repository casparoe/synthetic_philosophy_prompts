      *   *Key Distinction:* Adaptive Link vs. Truth Tracking. Just because believing "1+1=2" helps you survive doesn't mean you believe it *because* it corresponds to a Platonic Form of Twoness. You believe it because counting seeds helps you eat. The *reason* for the belief is fitness, not truth. The *coincidence* objection still stands.
