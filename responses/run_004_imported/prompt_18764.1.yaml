      *   *Rebuttal 2 (The Realm of Abstracta):* Mathematical Realism (Platonism) claims numbers exist outside space/time. Evolution is inside space/time. How does selection "see" the Platonic realm to select for beliefs that match it? It can't. It only sees behavior.
