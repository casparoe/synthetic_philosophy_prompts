      *   **Stance:** I need to take the side *against* Street (and by extension, defend the "Global Debunking" objection). I need to argue that the asymmetry fails.

  2.  **Deconstruct Sharon Street's Position:**
      *   *Street's EDA:* Evolution shaped our evaluative attitudes. Realism says these attitudes track mind-independent truths. Evolution is indifferent to truth, only fitness. Therefore, the probability that our attitudes track truth is low.
      *   *Street's Asymmetry (The "Tracking" Reply):* For basic logic/math (e.g., "1+1=2", "If P then Q"), believing the truth is *constitutive* of survival success in a way that isn't contingent. If you think a predator isn't there when it is, you die. The content of the belief matches the structure of reality in a way that fitness *requires* truth.
      *   *Morality:* Evolution shaped us to care about kin. But maybe the moral truth is "care about everyone equally" (utilitarianism) or "care only about yourself" (egoism). Fitness doesn't force the *specific* moral truth. Hence, no tracking.

  3.  **Brainstorming Counter-Arguments (Attacking the Asymmetry):**
      *   *Argument 1: The Contingency of Fitness.* Evolution doesn't select for *truth*; it selects for *behavior*. A false belief can lead to survival behavior just as easily as a true one. (The "Pragmatic Encroachment" or "False Belief/True Behavior" problem).
      *   *Argument 2: The Abstraction Gap.* Evolution selects for concrete, medium-sized dry goods (predators, food, mates). It does not select for abstract Peano axioms or laws of non-contradiction. Our belief in "2+2=4" is an abstraction far removed from the immediate fitness pressure.
      *   *Argument 3: The Isomorphism Problem.* Just because a belief is useful doesn't mean the *structure* of the belief matches the *structure* of reality. We could have a "black box" cognitive module that outputs "Run!" without representing "Predator." If it does represent, the representation could be systematically distorted (Kantian noumena vs. phenomena).
      *   *Argument 4: Street's Own Constructivism.* Street is an anti-realist (constructivist). She thinks moral truths are constructed from our values. So she avoids the debunking by denying realism. But the user is asking me to argue *against* her defense of the asymmetry, specifically regarding math/logic. I need to show that *if* you use EDA against moral realism, you must use it against math realism (Platonism).
