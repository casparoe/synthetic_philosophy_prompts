answer: |-
  This is an exceptionally sharp observation. You have identified what is widely considered the most potent objection to the Evolutionary Debunking Argument (EDA): the problem of **global skepticism** or **self-defeat**.

  If the EDA proves too much (i.e., it debunks logic and math along with morality), it arguably proves nothing, because a conclusion that undermines the very reasoning used to reach it is self-defeating. Sharon Street, along with other proponents of the EDA (like Richard Joyce and Gilbert Harman), is aware of this. Her attempt to carve out an exception for logic and mathematics is crucial to her position. If she fails, the EDA collapses into a skepticism that no one—including the skeptic—can live with.

  To argue that Street's proposed asymmetry fails, we must demonstrate that the causal mechanism she relies on (natural selection) operates on **behavioral outputs**, not **representational accuracy**, and that this limitation applies equally to moral, logical, and mathematical domains when those domains are understood realistically (i.e., as mind-independent truths).

  Here is the rigorous argument for why Street's asymmetry does not hold, and why accepting the EDA against moral realism commits one to debunking arithmetic and logic as well.

  ---

  ### 1. The Core of Street's Asymmetry Claim

  To defeat Street's position, we must first be precise about what she claims. Street argues that there is a "tracking" relationship between fitness and truth in the domains of logic and basic arithmetic, but not in morality.

  *   **The Moral Case:** Evolution selected for tendencies like "protect your kin." A moral realist might say the truth is "protect your kin." But evolution could just as easily have selected for "kill your kin" if that had promoted survival (e.g., in a resource-scarce environment). The moral truth is independent of the fitness pressure. Therefore, the alignment between our moral beliefs and moral truth is a coincidence.
  *   **The Logic/Math Case:** Street argues that you cannot navigate the physical world successfully without having true beliefs about basic logic and quantity. If an organism believes "a predator is present and not present" (violating non-contradiction) or "there are zero predators when there are two" (violating arithmetic), it will die. Therefore, fitness pressures *force* these beliefs to be true.

  Street's conclusion is that while moral beliefs are "unmoored" from truth by evolution, logical/mathematical beliefs are "anchored" to truth by evolution.

  ### 2. Argument One: The "Black Box" Problem (Behavior vs. Representation)

  The fundamental flaw in Street's asymmetry is a category error regarding what natural selection actually selects for. Evolution selects for **survival-enhancing behavior**, not **true internal representations**.

  For Street's asymmetry to work, it must be the case that the *only* way to produce survival-enhancing behavior in the realms of logic and math is to have true beliefs about logical and mathematical facts. This is demonstrably false.

  Consider a cognitive system as a "black box."
  *   **Input:** Sensory data (e.g., visual image of two tigers).
  *   **Output:** Behavior (e.g., run away).
  *   **Internal Mechanism:** The beliefs/logic used to process the input.

  Street assumes the Internal Mechanism must match reality (True Logic) to produce the correct Output. However, a system can produce the correct Output using **false** Internal Mechanisms.

  **Example:** Imagine an ancestor who holds the false logical belief: *"If I see stripes, the universe demands I run."* This belief is logically incoherent and metaphysically false (the universe makes no demands). However, if tigers have stripes, this false belief produces the same survival behavior as the true belief *"There are two predators, and two > zero."*

  Evolution cannot "see" inside the black box. It only sees the output (survival). Therefore, evolution is indifferent to whether the internal logic is *true*; it only cares that it is *useful*. Since false beliefs can be just as useful as true ones, the evolutionary pressure does not guarantee truth in logic any more than it does in morality. The "tracking" Street posits is between fitness and *behavior*, not fitness and *truth*.

  ### 3. Argument Two: The Causal Isolation of Abstract Objects

  This is the metaphysical heart of the problem. The EDA is typically deployed against **Moral Realism**, which posits that moral facts are mind-independent, objective, and (crucially) **causally inert**. They do not exist in space-time; they do not push particles around.

  If we are to test Street's asymmetry fairly, we must compare Moral Realism to **Mathematical Realism (Platonism)**. Platonism posits that numbers and logical relations are also mind-independent, objective, and **causally inert**. The number "2" does not exist in space-time; it does not exert force.

  The Debunking Argument rests on a "Causal Premise":
  > *If our beliefs about domain X are caused by evolutionary pressures, and the facts of domain X are causally inert (cannot influence evolution), then there is no explanatory connection between our beliefs and the facts.*

  *   **Applied to Morality:** Evolution shaped our brains. Moral Facts (being abstract/inert) did not. Therefore, no link.
  *   **Applied to Math:** Evolution shaped our brains. Mathematical Facts (being abstract/inert) did not. Therefore, no link.

  Street tries to break this parallel by saying evolution "reaches out" to math truths via utility. But how? If mathematical truths are Platonistic (outside space-time), they cannot causally interact with biological organisms. Evolution is a physical process occurring in space-time. It cannot "select for" a correspondence with a non-physical realm any more than it can select for a correspondence with a non-physical moral realm.

  If you argue that Moral Facts are too "spooky" to be tracked by evolution, you must concede the same for Numbers. If you argue that Numbers *can* be tracked because they are "useful," you must explain how utility bridges the gap between physical brains and non-physical truths. If utility bridges that gap for numbers, it could theoretically bridge it for morality (e.g., perhaps believing in objective morality is useful for social cohesion). Street cannot have it both ways.

  ### 4. Argument Three: The Contingency of Utility

  Street's argument relies on the idea that true logical beliefs are *necessarily* useful. However, evolutionary utility is **contingent**, while logical truth is **necessary**.

  *   **Logical Truth:** "2 + 2 = 4" is true in all possible worlds.
  *   **Evolutionary Utility:** Believing "2 + 2 = 4" is only useful in worlds where counting resources aids survival.

  Imagine a possible world where organisms survive by entering a trance state whenever resources are near, without counting. In that world, the belief "2 + 2 = 4" provides no fitness advantage. Evolution would not select for it.

  Now, apply this to our world. It is an empirical claim that "accurate counting leads to survival." But evolution selects for *heuristics* (rules of thumb), not axioms. An organism might evolve a heuristic: *"More blobs bad, fewer blobs good."* This heuristic aids survival without requiring the organism to grasp the abstract concept of cardinality or the Peano axioms of arithmetic.

  If our belief in arithmetic is based on a heuristic selected for survival, then the *content* of our arithmetic belief is determined by survival needs, not by the nature of numbers. If survival needs had been different (e.g., if hallucinating extra predators helped us stay alert), our "arithmetic" might be different.

  This implies that our logical/mathematical beliefs are contingent on our evolutionary history. But if Mathematical Realism is true, mathematical truths are *not* contingent. Therefore, if our beliefs are contingent on evolution, they are unlikely to match the necessary truths of Mathematical Realism. The debunking logic applies perfectly.

  ### 5. The Dilemma: Skepticism or Silence

  If Street's asymmetry fails, the proponent of the EDA faces a devastating dilemma, often formalized as a *reductio ad absurdum*:

  1.  **Premise 1:** If a belief-forming faculty is shaped by evolution for fitness rather than truth, we are not justified in trusting that faculty to produce true beliefs about causally inert domains.
  2.  **Premise 2:** Our logical and mathematical faculties are shaped by evolution for fitness.
  3.  **Premise 3:** Logical and mathematical domains (under realism) are causally inert.
  4.  **Interim Conclusion:** We are not justified in trusting our logical and mathematical beliefs.
  5.  **Final Conclusion:** We are not justified in trusting the reasoning used to formulate the Evolutionary Debunking Argument itself (which relies on logic and probability).

  If the EDA is sound, it undermines the logical validity of the EDA. You cannot use logic to prove that logic is unreliable without sawing off the branch you are sitting on.

  Street attempts to avoid this by saying, "Logic is safe, only Morality is debunked." But as shown above, her justification for saving logic (the "tracking" account) fails to distinguish the *mechanism* of selection from the *truth* of the representation.

  ### 6. Conclusion: The Acid Test

  The rigorous conclusion is that the Evolutionary Debunking Argument is a form of "logical acid." It cannot be contained to just morality.

  *   If you argue that **causal isolation** debunks morality, it debunks Platonistic math.
  *   If you argue that **selection for fitness** debunks morality, it debunks the reliability of the cognitive faculties used to reason about fitness.
  *   If you argue that **contingent evolutionary pressures** debunk morality, they debunk the contingent heuristics we use for logic.

  Sharon Street's asymmetry relies on the intuition that logic is "obviously" true in a way morality isn't. But in the context of evolutionary psychology and metaphysical realism, that intuition is unsupported. Evolution is a blind process optimizing for reproductive success, not a truth-tracking missile aimed at abstract reality.

  Therefore, anyone who accepts the EDA against moral realism is indeed committed to skepticism about arithmetic and logic. Since almost no one (including Street) is willing to accept that we cannot trust basic logic, the rational move is to reject the premise that "evolutionary origins undermine justification." If evolutionary origins don't undermine logic, they shouldn't undermine morality either. The EDA, by failing to respect this symmetry, defeats itself.
