      *   **Conclusion:** Summarize. The EDA is a self-defeating weapon if aimed only at morality.

  6.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Caution:* I need to make sure I don't accidentally argue *for* moral realism. The prompt asks me to argue that *if* you accept EDA against morality, you *must* accept it against math. I am arguing for the *consistency* of the skepticism, not the truth of morality.
