  **Move 1 (Owen): +1**
  This is the standard "Actual Sequence" defense. It correctly identifies the core intuition behind Frankfurt's argument: moral responsibility should depend on what actually happened, not on counterfactual scenarios that never materialized. It holds up well as a baseline position, though it doesn't yet address the mechanical difficulties of constructing such a case.

  **Move 2 (Jess): +2**
  This is the canonical "Prior Sign" objection (often associated with Robert Kane and David Widerker). It is widely considered the strongest critique of the original Frankfurt cases. Jess correctly identifies that without a prior sign, the intervener doesn't know when to act; with a prior sign, the case often presupposes determinism, which begs the question against libertarians.

  **Move 3 (Owen): +1**
  Owen deploys the "Flicker of Freedom" defense. This is a recognized and viable philosophical maneuver: conceding that *some* alternative possibilities might remain (the "flicker") but arguing they are too trivial to ground moral responsibility. It keeps the argument alive, though it shifts the goalposts from "any alternative" to "robust alternative."

  **Move 4 (Jess): +2**
  Jess executes the "Dilemma Defense." She points out that Owen is either defining responsibility in a way that stipulates alternatives don't matter (circular) or admitting that *some* alternatives do matter (undermining Frankfurt's conclusion). This is a sharp meta-argument that exposes the strategic retreat in Owen's previous move.

  **Move 5 (Owen): +1**
  Owen updates the argument to "flicker-free" Frankfurt cases (similar to Mele & Robb). This is dialectically strong because it directly attempts to patch the hole Jess identified in Move 2. However, it receives a 1 rather than a 2 because these refined cases are themselves controversial and face new objections regarding whether they truly eliminate alternatives without reintroducing determinism.

  ***

  **What They Are Missing**

  Both are treating this as a battle over the existence of *alternatives*, but they are missing that the debate has largely shifted to the nature of *sourcehood*. Owen's final move (5) attempts to defuse the prior-sign problem, but it likely just relocates it: critics argue that "flicker-free" cases either secretly presuppose determinism (making them useless against libertarians) or leave open a subtle alternative (e.g., the possibility of the decision being hijacked vs. not). The deeper stalemate is that Frankfurt cases may successfully argue that "alternate possibilities" aren't the *source* of responsibility, but they fail to prove that determinism is compatible with being the *ultimate source* of an action. Jess is right that the intuition pump is leaking, but Owen is right that the leak doesn't necessarily sink the ship—it just means the real engine is sourcehood, not leeway.
