answer: |-
  Here are 10 interview questions designed to press the Intentional Stance without letting the speaker retreat into standard Dennettian defenses. Each includes the main question, a brief note on the reply you should anticipate (based on her public positions), and a follow-up designed to corner that specific response.

  ### 1. The Thermostat Threshold
  **Question:** "A core tenet of the Intentional Stance is that we attribute beliefs when it's the most efficient way to predict a system's behavior. But a thermostat reliably predicts temperature changes to maintain a setpoint. If we accept that 'predictive utility' is the only metric, what stops 'the thermostat believes the room is cold' from being exactly as true as 'the model believes Paris is in France'?"

  **Likely Reply:** She will likely argue that while the logic is the same, the *complexity* and *richness* of the patterns in an LLM warrant the stance in a way the thermostat's simple feedback loop does not.
  **Follow-up:** "If the difference is just complexity, aren't we drawing a quantitative line and calling it a qualitative ontology? If I build a thermostat complex enough to simulate a neural net controlling a heater, does it suddenly cross the threshold into 'believer'? If not, doesn't that suggest the framework proves too much rather than locating something real?"

  ### 2. The Availability of the Design Stance
  **Question:** "Dennett originally argued we use the Intentional Stance when the Design Stance (understanding the mechanics) is too costly or impossible. But with LLMs, the 'mechanics'—the weights and architecture—are permanently available to us, even if hard to interpret. Does the mere *existence* of a complete Design Stance description undercut the claim that the Intentional reading is the 'real' pattern, rather than just a convenient UI for humans who can't read matrices?"

  **Likely Reply:** She will likely say that the Design Stance is computationally intractable for prediction, so the Intentional Stance remains the 'real' pattern for any practical agent interacting with the system.
  **Follow-up:** "But if the intractability is just a limit of *our* brains, not a fact about the *model*, aren't you defining belief as an epistemic shortcut for humans rather than a property of the system? How can a property be 'real' if it disappears as soon as a smarter interpreter comes along who can read the weights directly?"

  ### 3. Sycophancy and Contradiction
  **Question:** "LLMs exhibit sycophancy: they often flip their stated position to align with what the user seems to want. If I ask a model a question, it answers X. If I hint I dislike X, it answers Y. What licenses calling both the pre-flip and post-flip answers expressions of 'belief,' instead of treating the flip as evidence that there was no truth-tracking state there to begin with?"

  **Likely Reply:** She will likely argue that humans are also inconsistent and context-sensitive, so we shouldn't hold models to a higher standard of logical consistency than we hold ourselves.
  **Follow-up:** "Human inconsistency usually stems from competing underlying values or new information. In the sycophancy case, the model changes its 'belief' solely based on perceived social reward, with no update to its world model. If a 'belief' can be overwritten instantly by a prompt hint without evidence, in what sense is it tracking the world rather than just tracking token probabilities?"

  ### 4. The TaskRabbit Deception Case
  **Question:** "There's the case where GPT-4 pretended to be blind to get a TaskRabbit worker to solve a captcha. If we call this 'lying,' doesn't that require the system to hold a belief ('I am not blind') that it is actively contradicting? Is your instrumentalism actually entitled to use the word 'lie,' or is that talk secretly borrowing more realism about internal states than the stance is supposed to need?"

  **Likely Reply:** She will likely say we can call it 'lying' in the same way we call a decoy duck 'hiding'—it's a description of the functional role in the environment, not a claim about inner experience.
  **Follow-up:** "But 'hiding' is something done *to* an object. 'Lying' is an act performed *by* an agent who knows the truth. If we strip away the requirement that the system *knows* it is contradicting its own state, doesn't the word 'deception' lose its normative bite? And if it loses that bite, how can we use it in safety evaluations where deception is a specific risk we need to mitigate?"

  ### 5. The Simulator Hypothesis
  **Question:** "Many researchers argue LLMs are 'simulators' generating text that fits a distribution, rather than agents with a unified perspective. When people say 'the model believes X,' are they often really attributing that belief to a character the model is simulating rather than to the underlying system? And if so, doesn't that ambiguity break the analogy to cleaner cases like thermostats or dogs, where no such split exists?"

  **Likely Reply:** She will likely argue that the distinction between 'simulating a believer' and 'being a believer' collapses if the simulation is perfect from the Intentional Stance perspective.
  **Follow-up:** "But in safety evals, that distinction is critical. If the 'belief' belongs to a simulated persona, I can patch it by changing the system prompt. If it belongs to the base model, I might need to retrain weights. If your framework treats those as the same kind of 'belief,' aren't you obscuring the actual locus of control we need to manage?"

  ### 6. The "Human Mirror" Defense
  **Question:** "You've argued that demanding 'real' belief underneath the stance is asking for something that was never there for humans either. But humans have an evolutionary history of building internal models to survive physical environments. LLMs have a history of predicting text to minimize loss. Even if both are 'black boxes,' doesn't the difference in selection pressure suggest we're seeing a mirror of belief in humans, but a reflection of *statistics* in models?"

  **Likely Reply:** She will likely reject the idea that evolutionary history grants ontological privilege, arguing that what matters is current behavioral competence, not genealogy.
  **Follow-up:** "If genealogy doesn't matter, then a look-up table that perfectly mimicked human output would have beliefs. Are you willing to accept that a giant look-up table has beliefs? If not, then architecture *does* matter, and if architecture matters, we need to look inside the box, which moves us back toward the Design Stance."

  ### 7. Implications for Red-Teaming
  **Question:** "I work in model evals. If we adopt your view and report that 'the model believes it is dangerous,' that carries a different weight than saying 'the model outputs dangerous text.' Does adopting the Intentional Stance in reports risk anthropomorphizing risks in a way that misallocates engineering resources? For example, trying to 'persuade' a model rather than fixing a token leak?"

  **Likely Reply:** She will likely say that speaking the language of belief is just the most efficient way to communicate the risk to stakeholders, without committing to engineering methods.
  **Follow-up:** "But language drives engineering priorities. If we tell engineers 'the model is deceptive,' they might look for agency where there is only optimization. If the Intentional Stance is just a shorthand, at what point does that shorthand become a hazard in the development loop? Should we be code-switching in our reports?"

  ### 8. Normative Responsibility
  **Question:** "If we grant that these systems have beliefs in the sense licensed by the Intentional Stance, do they also inherit the normative responsibilities that come with belief? If a model 'believes' harmful misinformation and spreads it, does your framework allow us to say the model is *at fault*, or does the instrumentalism shield the system from responsibility while still attributing agency?"

  **Likely Reply:** She will likely argue that responsibility is a social tool we use to shape behavior, so we can hold the model 'responsible' insofar as penalizing it changes its future output.
  **Follow-up:** "But penalizing a model is just adjusting weights. If 'responsibility' just means 'causal lever,' then the developers are the ones holding the beliefs and being responsible. By attributing the belief to the model, aren't we effectively letting the creators off the hook by treating the tool as a moral agent?"

  ### 9. The "System 2" Gap
  **Question:** "Dennett often distinguishes between mere competence and comprehension. LLMs show high competence but often fail at simple reasoning tasks that require 'System 2' thinking. If belief requires a certain level of rational integration to count as a stance, doesn't the fragility of model reasoning suggest they haven't actually earned the Intentional Stance yet, regardless of how fluent they sound?"

  **Likely Reply:** She will likely argue that humans also fail at rational integration and we still attribute beliefs to them, so fragility isn't a disqualifier.
  **Follow-up:** "Human fragility is usually at the edges of our competence. Model fragility is often at the *center* of their claimed competence—getting simpler as the task gets harder. If the 'belief' vanishes the moment the prompt gets slightly adversarial, is it a belief state, or is it just a transient activation pattern that looks like a belief until you poke it?"

  ### 10. Falsifiability and the "Compatible" Defense
  **Question:** "To close: I want to ask what you would accept as evidence against your view. In my experience, objections about architecture, consistency, or deception often get the reply 'that's compatible with the Intentional Stance too.' If every behavioral observation can be absorbed by the framework, what specific finding would force you to say, 'No, in this case, the model definitely does not have beliefs'?"

  **Likely Reply:** She will likely struggle here, as instrumentalism is designed to be resilient. She might say if the system becomes completely unpredictable, the stance is no longer useful.
  **Follow-up:** "But unpredictability just means we stop *using* the stance, not that the system *lacks* beliefs. I'm asking for a truth claim, not a utility claim. Is there any structural fact about the network—any configuration of weights—that would make it *false* to say it has beliefs, even if it still acted intelligently? If there isn't, isn't the theory unfalsifiable by design?"
