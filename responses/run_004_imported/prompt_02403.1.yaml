          *   *Augustine's View:* Both are sins against God. Both involve using a God-given faculty (tongue/body) for an evil purpose.
          *   *The "Blasphemy" Link:* The lie isn't just a falsehood; it's a *blasphemous* lie (pretending to be a Priscillianist involves affirming Priscillianist heresies). To Augustine, affirming heresy is an offense against God, similar to how adultery is an offense against the sanctity of marriage (and God's law).
          *   *The "Instrument" Argument:* The user mentions Romans 6:13. This is key. Augustine sees the body and speech as instruments of the soul. If the soul wills sin, the instrument is defiled.

      *   **Q2: Is the analogy independent work or a restatement?**
