          *   The argument succeeds *if* one accepts Augustine's ontology of sin (intrinsic evil). It fails if one accepts a purely consequentialist or casuistic framework where the mental reservation negates the external act's moral quality.

  4.  **Drafting the Reconstruction (Step-by-Step):**

      *   *Identify the Core Principle:* The End Does Not Justify the Means (specifically when the means is intrinsically evil).
      *   *Identify the Classification:* Both acts are *mala in se* (evil in themselves).
