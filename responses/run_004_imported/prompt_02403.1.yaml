answer: |-
  This is an excellent question that cuts to the heart of Augustine's moral ontology. You are right to sense that the parallel between "blasphemous lying" and "adultery" is not self-evident to a modern reader, nor was it necessarily obvious to Consentius. The argument relies on a specific metaphysical and theological architecture that, if not reconstructed, makes the analogy seem like a category error.

  Here is a reconstruction of the missing premises, an analysis of the analogy's argumentative function, and an assessment of its force against a skeptic who denies the "blasphemy" classification.

  ### I. Reconstruction of the Argument

  To make the analogy hold, Augustine must bridge the gap between a verbal act (lying about faith) and a physical act (adultery). He does this by establishing a shared moral structure rather than a shared material content.

  **The Explicit Premises:**
  1.  **The Consequentialist Claim (Opponent):** It is permissible to commit a specific evil act (blasphemous lying) if the intention is to achieve a greater good (exposing heretics).
  2.  **The Intuition Pump:** It is impermissible to commit adultery to achieve a greater good (exposing heretics), even if the adultery is "chaste" in intention (i.e., devoid of lust, purely strategic).
  3.  **The Observation:** Both cases propose using a specific faculty (tongue vs. sexual organs) to commit an act normally deemed sinful, justified solely by the utility of the outcome.

  **The Missing (Tacit) Premises:**
  4.  **The Principle of Intrinsic Evil (*Mala in Se*):** Certain acts are evil by virtue of their object/nature, regardless of the agent's intention or the consequences. (Adultery is one; for Augustine, lying is another).
  5.  **The Theology of the "Member" (Romans 6:13):** The body's faculties (tongue, flesh) are instruments given by God for righteousness. To willingly employ them for *any* act that violates Divine Law is to defile the instrument and the soul, regardless of whether the act harms a specific human neighbor.
  6.  **The Definition of Blasphemy:** To verbally affirm heretical doctrine (even mentally reserving disbelief) is to bear false witness against God. This makes the lie not merely a social deception but a theological offense equivalent in *kind* (sin against God) to adultery (sin against God's law of marriage).

  **The Logical Flow:**
  *   If the justification "good end justifies evil means" works for the tongue (lying), it must work for the flesh (adultery), because both are "members" subject to Divine Law.
  *   Since it clearly does *not* work for the flesh (no one accepts "chaste adultery"), it cannot work for the tongue.
  *   Therefore, lying to expose heretics is impermissible.

  ### II. Is the Analogy Independent Work or Restatement?

  You ask if this is merely a vivid restatement of a conclusion secured elsewhere (e.g., in *De Mendacio*). I would argue it performs **independent argumentative work**, specifically as a *reductio ad absurdum* targeting the *principle of justification* rather than the act itself.

  In *De Mendacio*, Augustine argues from the nature of language and truth. In *Contra Mendacium*, he is fighting a pastoral pragmatism (the "Priscillianist infiltration" tactic). The opponents likely conceded that lying is generally bad but argued for an exception based on *necessity*.

  The analogy does work that a direct assertion ("Lying is intrinsically evil") cannot do:
  1.  **It isolates the variable:** By swapping "tongue" for "flesh," Augustine forces Consentius to see that the *structure* of the justification is the problem, not the specific act. If the opponent says, "Adultery is worse than lying," Augustine has already preempted this by calling the lie "blasphemy," elevating it to a mortal sin category.
  2.  **It exposes the slippery slope:** The phrase "chaste adulteries" is deliberately oxymoronic. Augustine wants to show that "just lying" is equally oxymoronic. If you admit the principle that intention purifies the act, you destroy the category of sin entirely.
  3.  **It shifts the burden of proof:** It forces the opponent to explain *why* the logic applies to one member but not the other. If they cannot find a relevant difference (other than "we feel differently about them"), their position is reduced to inconsistency.

  So, it is not just a restatement; it is a consistency test. It relies on the premise established in *De Mendacio* (lying is always sin), but it uses the adultery analogy to block the "exception clause" regarding heretics.

  ### III. Assessment Against the "Blasphemy" Skeptic

  The crux of your seminar discussion will likely rest here. The argument succeeds only if the interlocutor accepts that **pretending to be a heretic constitutes blasphemy.**

  **The Skeptic's Objection:**
  A pragmatic infiltrator would argue: "I am not blaspheming. Blasphemy requires contempt for God or the assertion of falsehood as *truth*. I am asserting falsehood as *falsehood* (in my mind) for a good cause. My tongue is not bearing witness; it is acting as a disguise."

  **Augustine's Counter (and the Argument's Weakness):**
  Augustine rejects the "mental reservation" defense. For Augustine:
  1.  **Semiotics:** Words are natural signs (*signa naturalia*) of the mind's content. To utter a sign that does not match the mind is to violate the nature of language instituted by God.
  2.  **Public Witness:** When you speak within a religious community (even a heretical one), your words function as public testimony. To affirm heresy is to scandalize the Truth, regardless of internal intent.
  3.  **The "Blasphemy" Label:** By labeling the lie "blasphemous," Augustine categorizes it as a sin *against God*, not just a deception of a neighbor. This is why the analogy with adultery works for him: Adultery is primarily a sin against God's covenant, secondarily against the spouse. Blasphemous lying is a sin against God's Truth, secondarily against the heretic deceived.

  **Does it succeed?**
  *   **Internally (within Augustine's system):** Yes. If one accepts that language has a divine teleology (to convey truth) and that sin is primarily a disordering of the soul's relation to God, the analogy is sound. The "member" (tongue) is being used contrary to its created end.
  *   **Externally (against a modern or casuistic critic):** No. The argument fails if one rejects the premise that the *external utterance* binds the soul regardless of internal intent. A consequentialist or a proponent of "mental reservation" (like later Jesuit casuists) would argue the analogy fails because adultery *always* involves a physical violation of a covenant, whereas the "blasphemous lie" involves no internal assent to the heresy. They would argue the "chaste adultery" analogy is a false equivalence because the "chastity" of the intention *does* mitigate the physical act in a way the skeptic believes intention mitigates the verbal act.

  ### IV. Seminar Suggestion

  For your seminar, I suggest highlighting that Augustine is not merely arguing about **ethics** (what should we do?) but about **ontology** (what *is* a lie?).

  The "missing step" you are looking for is Augustine's conviction that **the moral quality of an act resides in the act itself (*ex objecto*), not in the intention (*ex fine*).**

  *   **Discussion Point:** Ask your students to evaluate the "Blasphemy" classification. Is Augustine engaging in semantic inflation to win the argument, or is he identifying a genuine spiritual danger in the act of infiltrating a sect?
  *   **Key Textual Connection:** Connect this to *De Doctrina Christiana*. Augustine allows for *obscuring* truth (silence, ambiguity) but never *asserting* falsehood. The infiltrator crosses the line not by hiding, but by speaking.
  *   **The "Member" Argument:** Emphasize the Romans 6:13 connection you noted. This is the linchpin. For Augustine, the body is a temple; using the tongue to speak heresy is as much a desecration of the temple as using the body for illicit sex.

  **Conclusion:**
  Augustine's argument succeeds as a *reductio* only if one accepts his definition of the lie as an intrinsic evil comparable to adultery. If the interlocutor views lying as a contingent evil (wrong because of harm caused), the analogy collapses. Augustine knows this, which is why he insists on the term "blasphemy"—to force the lie into the category of "sin against God," where consequentialist exceptions are impossible. The analogy is not just rhetoric; it is the application of his unified theory of sin to a specific pastoral crisis.
