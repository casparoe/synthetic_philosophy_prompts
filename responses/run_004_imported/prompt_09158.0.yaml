answer: |-
  **1. Foundations: The Scalar Problem**
  To start, I want to press on the "relevant similarity" clause in your Non-Hypocrisy Condition. We can agree a murderer lacks the standing to blame another murderer. But consider a minor hypocrite: someone who speeds occasionally but blames a friend for reckless driving that endangers lives. On your view, does the speeder forfeit standing to blame the reckless driver?

  *   **Follow-up:** I ask because if you say the speeder *retains* standing, you seem to allow hypocrisy whenever the hypocrite's sin is lesser, which risks making the condition too weak. But if you say the speeder *loses* standing, you imply that moral authority requires near-perfection. Doesn't that second option make moral community impossible, since almost everyone is guilty of *some* traffic violation?

  **2. The "Trump Card" Objection**
  A common worry about your view is that it hands wrongdoers a rhetorical trump card. If I catch you lying, and you point out that I've lied before, your account suggests my blame is "inapt." Doesn't this allow the wrongdoer to dodge the substantive charge by focusing entirely on the accuser's record, effectively silencing moral criticism whenever the critic isn't sinless?

  *   **Follow-up:** You'll likely reply that the act remains wrong even if the blame is inapt. But if the blame is truly inapt, does the wrongdoer have any obligation to *listen* to the hypocrite? If the answer is no, then in cases where the hypocrite is the only witness to the wrong, doesn't your view imply the wrongdoing effectively goes unchallenged?

  **3. Distinguishing Standing Failures (The Manager Case)**
  Let's test the boundaries between hypocrisy, complicity, and meddling. Imagine a manager criticizes a subordinate for padding an expense report on a shared project. However, the manager has padded her own reports on *unrelated* projects in the past. You would likely call this hypocrisy rather than complicity, since she didn't aid *this* specific act. But given her role is to enforce fiscal integrity, is her standing grounded in her moral record or her professional office?

  *   **Follow-up:** If you maintain that her personal hypocrisy voids her professional standing, you seem committed to the claim that institutions cannot enforce rules unless their enforcers are morally clean. Doesn't this lead to the unwelcome conclusion that organizational authority is held hostage to the private moral failings of its leaders?

  **4. Moral Reform and Restoration**
  Moving to the temporal dimension: you argue standing can be forfeited, but presumably, it can also be regained. Take the case of a recovered addict who wants to counsel or blame active addicts. How much moral reform is required to restore standing? Is it a matter of time, public atonement, or simply internal resolution?

  *   **Follow-up:** Let's press the stability of that restored standing. If a recovered addict regains standing after five years clean, does a single slip-up instantly revoke it again? If yes, you make standing impossibly fragile for anyone trying to reform; if no, you need a threshold for relapse that seems notoriously difficult to define without arbitrariness.

  **5. Scaling to Collective Agents**
  Finally, this debate often arises in international relations, such as one country condemning another's human-rights record while tolerating comparable abuses at home. You've suggested your account scales up to collective agents. But nations are persistent entities; a government might change its domestic policies while keeping its foreign criticism constant. Does the state's standing fluctuate with every policy shift?

  *   **Follow-up:** If a nation's standing to condemn human rights abuses depends on its own current record, doesn't this privilege powerful nations who can hide their abuses over honest nations trying to improve? It seems to create a "clean hands" doctrine where only the morally perfect—or the best liars—have a voice in global justice.
