answer: |-
  **The Grave of Verisimilitude: Why We Should Abandon Truthlikeness for Structure**

  Karl Popper introduced the concept of verisimilitude (truthlikeness) to solve a specific, nagging problem in the philosophy of science. He was a scientific realist who believed theories aimed at the truth, yet he was also a fallibilist who believed all our universal theories are technically false. If Newtonian mechanics is false, and Aristotelian physics is false, how can we rationally claim science *progresses*? We need a way to say Newton is *closer* to the truth than Aristotle, even if neither hits the mark. Popper attempted to formalize this intuition logically, defining verisimilitude as the balance of truth content minus falsity content. It was a bold ambition: to make scientific progress a matter of logical calculus rather than historical narrative.

  That ambition failed. Not merely in practice, but in principle. While the intuition behind verisimilitude remains seductive, the project to formalize it as an objective metric of scientific progress is a dead end. The Tichý-Miller proofs of 1974 demonstrated that Popper's logical definition was mathematically incoherent. Subsequent attempts to rescue the concept via possible-worlds semantics (Niiniluoto, Oddie) merely relocated the problem from logic to language, rendering "closeness to truth" dependent on arbitrary conceptual schemes. The verdict must be clear: verisimilitude cannot serve as the foundation for a theory of scientific progress. We should abandon the search for a metric of truth-closeness and replace it with Structural Realism, which captures the continuity of science without requiring a coherent definition of "distance" to the truth.

  To understand the depth of the failure, we must look at why Popper's original definition collapsed. Popper defined the verisimilitude of a statement $A$ ($Vs(A)$) as its truth content ($Ct_T(A)$) minus its falsity content ($Ct_F(A)$). Truth content is the set of true consequences entailed by $A$; falsity content is the set of false consequences. For true theories, this works intuitively: a stronger true theory has higher verisimilitude. But science is mostly concerned with comparing false theories.

  In 1974, Pavel Tichý and David Miller independently proved that under Popper's own definitions, no two false theories can be compared by verisimilitude. The intuition is brutal: if a theory $A$ is false, it entails some falsehood $f$. If you strengthen $A$ to $B$ (adding content), you might capture more truth, but because $A$ is already false, strengthening it inevitably entails *more* falsehoods derived from the original error. Tichý showed that for any false theory, adding content increases falsity content at least as fast as it increases truth content. Consequently, on Popper's calculus, one false theory can never be more verisimilar than another. The very phenomenon Popper wanted to explain—progress among false theories—was rendered logically impossible by his definition.

  In response, the "semantic" approach emerged, championed by Ilkka Niiniluoto and Graham Oddie. They abandoned content measures and moved to possible-worlds semantics. Here, a theory is identified with the set of possible worlds it allows, and truthlikeness is defined by the "distance" between the actual world and the worlds allowed by the theory. If the actual world is $w^*$, and theory $A$ is true in worlds close to $w^*$, $A$ is more verisimilar than theory $B$, which is only true in distant worlds. This dodged the Tichý-Miller content paradox by treating truthlikeness as a topological property rather than a logical entailment property.

  However, this rescue mission ran directly into Miller's second, more devastating objection: language dependence. In 1975, Miller demonstrated that the ordering of theories by truthlikeness is not invariant under translation. Consider a simple weather language with three atomic propositions: hot ($h$), rainy ($r$), and windy ($w$). Suppose the truth is $h \land r \land w$. Theory $A$ says $\neg h \land r \land w$ (wrong about heat), and Theory $B$ says $\neg h \land \neg r \land \neg w$ (wrong about everything). Intuitively, $A$ is closer to the truth than $B$.

  Now, translate this into a "gruesome" language. Let $m$ (minnesotan) be equivalent to $h \leftrightarrow r$, and $a$ (arizonan) be equivalent to $h \leftrightarrow w$. In this new language, the logical structure of the propositions remains identical, but the similarity metric flips. Miller showed that under specific translations, the theory that was "closer" in the first language becomes "further" in the second. If truthlikeness is an objective feature of the relation between theory and world, it should not depend on whether we describe the world using predicates like *hot/rainy* or *minnesotan/arizonan*.

  Defenders of the semantic approach, particularly Niiniluoto, have argued that this objection assumes all languages are equal. They posit that the world carves itself at the joints; there are "natural kinds" or privileged predicates that reflect the objective structure of reality. If we restrict our distance metrics to these natural predicates, language dependence vanishes.

  This defense, however, surrenders the original Popperian goal. Popper wanted a *logical* method to assess progress. By appealing to natural kinds, the verisimilitude theorist admits that truthlikeness is not a logical or semantic relation, but a metaphysical one. This creates a vicious circularity for any theory of progress. To determine if Theory $B$ is closer to the truth than Theory $A$, we must first know which predicates are "natural." But knowing which predicates are natural is itself a piece of substantive scientific knowledge—effectively, knowing the truth about the world's structure. We cannot use verisimilitude to measure progress toward the truth if calculating verisimilitude requires us to already know the truth about the world's ontology. It renders the concept useless as a tool for evaluating ongoing science; it becomes a retrospective label we can only apply once we already know the answer.

  Therefore, the project of verisimilitude is hopeless as a formal account of scientific progress. It promises an objective metric but delivers either logical incoherence (Popper) or language-relative subjectivity (Niiniluoto/Oddie) unless bolstered by a metaphysics we cannot access without circularity.

  If we discard verisimilitude, do we surrender realism? Must we retreat to Van Fraassen's constructive empiricism, where we only care about saving the phenomena? No. There is a superior alternative that captures the realist intuition of continuity without the baggage of truthlikeness: **Structural Realism**.

  Proposed by John Worrall, Structural Realism argues that while the specific ontological claims of past theories (the "nature" of the entities) are often false, the *mathematical structure* describing the relations between those entities is preserved. When Fresnel's wave theory of light was supplanted by Maxwell's electromagnetic theory, the ontology shifted from mechanical ether to electromagnetic fields. Yet, the mathematical equations describing light's behavior remained largely intact.

  Structural Realism dodges the verisimilitude trap because it does not require a metric of "distance" to the truth. It does not ask, "How close is Newton's ontology to God's ontology?" Instead, it asks, "Does the successor theory preserve the structural relations of the predecessor?" This is a checkable, formal relation. We can demonstrate that Newtonian mechanics is a limiting case of General Relativity without needing to define how "false" Newton was or how "close" he came. We simply show the structural mapping.

  This approach respects the Tichý-Miller lesson: we cannot compare the truth-content of false theories logically. But we *can* compare the structural continuity of successful theories. It accounts for progress without requiring the impossible task of measuring the gap between a false theory and the truth. It acknowledges that our theories are likely false (satisfying the fallibilist) but explains why we don't start from scratch every generation (satisfying the realist).

  Popper's verisimilitude was a valiant attempt to quantify the instinct that science gets things "more right" over time. But the technical objections are not mere quibbles; they are fatal. The Tichý-Miller proofs showed the logical definition was broken, and the language dependence argument showed the semantic fixes were not objective. To cling to verisimilitude is to chase a formal ghost. We should let the concept rest and recognize that scientific progress is not a matter of closing the distance to the truth, but of preserving the structural skeleton of our best models as we shed their ontological skin.
