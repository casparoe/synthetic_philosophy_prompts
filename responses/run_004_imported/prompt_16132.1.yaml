answer: |-
  **Setting:** *A university office, late afternoon. A strip of 1,000 color patches, numbered 1 to 1,000, is taped across the desk, fading imperceptibly from pure red (1) to clear orange (1,000). **Elena** (Epistemicist) sits on one side; **Sam** (Supervaluationist) on the other.*

  **Elena:** Let's look at patch 542. You say it's a borderline case of "red." On your view, that means there are some admissible precisifications of our language where "542 is red" comes out true, and others where it comes out false.

  **Sam:** Exactly. No single precisification is *the* meaning of "red." The meaning is the set of all admissible precisifications. So, 542 is neither supertrue nor superfalse. It's indeterminate.

  **Elena:** Okay. Now introduce your "Definitely" operator. $Dp$ is true if and only if $p$ is true on all admissible precisifications. Is 542 definitely red?

  **Sam:** No. Since some precisifications classify 542 as orange, $D(\text{Red}(542))$ is false.

  **Elena:** Now consider patch 10. Pure red. Every admissible precisification calls it red. So $D(\text{Red}(10))$ is true. Somewhere between 10 and 542, there must be a last patch, $n$, such that $D(\text{Red}(n))$ is true, and $D(\text{Red}(n+1))$ is false.

  **Sam:** I see where you're going. You're going to say I've just reintroduced a sharp boundary, only now it's between the definitely red and the not-definitely red.

  **Elena:** I'm not just going to say it; I'm asking where you deny it. If you accept classical logic for the operator $D$—which you claim to, being a supervaluationist—then there *is* a sharp cut-off for $D$. If you deny the cut-off, you deny classical logic for $D$. Which is it?

  **Sam:** I deny that the hierarchy stops there. We can talk about second-order vagueness. Patch $n$ might be a borderline case of "definitely red." So we need $DD$.

  **Elena:** Fine. Iterate the operator. $DD$, $DDD$, and so on. But here's the problem, Sam. Either this hierarchy converges on a sharp boundary eventually, or it doesn't. If it does converge—if there is some level $k$ where $D^k$ draws a line—you are an epistemicist in disguise. You've just pushed the sharp boundary up to the $k$-th order. If it *doesn't* converge, then the logic of $D$ fails. Specifically, you have to reject the S4 axiom: $Dp \to DDp$.

  **Sam:** And I am willing to reject S4. The set of admissible precisifications is not itself sharply bounded. There are precisifications that are "borderline admissible." So, it can be definitely the case that $p$ is true on all *clearly* admissible precisifications, without being definitely the case that it's true on all *borderline* admissible ones.

  **Elena:** But now you've lost the main selling point of supervaluationism. You claimed to preserve classical logic while accommodating vagueness. But if the boundary of "admissible precisification" is vague, then your meta-language is vague. To make sense of that vagueness, you need a meta-meta-language with its own precisifications. You're starting a regress.

  **Sam:** Not a vicious regress. It just reflects the reality that semantic indecision is pervasive. Look, compare this to your view, Elena. You say there is a sharp boundary for "red" right now. Patch 542 is red, 543 is orange. But no one can know which is which.

  **Elena:** That's right.

  **Sam:** And why can't we know?

  **Elena:** Because of the margin-for-error principle. Knowledge requires safety. If you know 542 is red, your belief must not be easily false. But since the extension of "red" depends on usage, and usage varies slightly across nearby possible worlds, the boundary shifts. In a nearby world, the cut-off is at 543. So if you believe 542 is red in the actual world, you'd believe it in that nearby world too, where it's false. Your belief isn't safe. So you don't know.

  **Sam:** This is the skepticism I can't swallow. You're telling me that competent speakers of English are utterly ignorant of the meaning of their own words. I know how to use "red." I can teach it to a child. I can correct mistakes. But on your view, I don't know the extension of the word I'm using. I could be pointing to a clear orange patch and calling it red, and if it happens to be the "last red patch," I'm right, but I can't *know* I'm right.

  **Elena:** You're conflating competence with omniscience. Competence is the ability to use the word in accordance with its meaning. It doesn't require knowing the exact boundaries of that meaning. Think of it like perception. You can see a chair without knowing the exact spatial coordinates of its boundaries.

  **Sam:** But with the chair, the boundaries aren't sharp. With your view, they are sharp, they are just hidden. That makes linguistic competence a miracle. How did usage fix a boundary at 542 rather than 543 if there is no fact of the matter in our practice that distinguishes them?

  **Elena:** Usage fixes the boundary via a complex causal-historical process involving similarity, interests, and environmental constraints. It's a chaotic system. Chaotic systems have precise states, even if we can't measure them. The fact that we can't locate the boundary doesn't mean it isn't there. In fact, the sorites paradox *proves* it must be there. If there were no sharp boundary, the sorites premise ("if $n$ is red, $n+1$ is red") would be true. If it's true, orange is red. That's absurd. So the premise is false. So there is a cut-off.

  **Sam:** I agree the sorites premise is false. But on my view, it's false because it's not *supertrue*. It fails to be true on all precisifications. I don't need a sharp cut-off in the world to block the sorites; I just need to block the inference.

  **Elena:** But you still have the HOV problem. If "admissible precisification" is vague, then "true on all admissible precisifications" is vague. So $D$ is vague. If $D$ is vague, you need a $D^*$ operator to define the boundaries of $D$. Are *those* boundaries sharp?

  **Sam:** Why does it matter? My goal isn't to eliminate vagueness; it's to model it. Your goal is to eliminate it from the semantics and hide it in our ignorance. I think my account respects the phenomenology better. When I look at 542, it doesn't feel like I'm ignorant of a fact. It feels like there is no fact to be known.

  **Elena:** Phenomenology is a bad guide to semantics. It feels like the earth is stationary, too. The real issue is theoretical cost. My cost is accepting unknowable boundaries. Your cost is a complex hierarchy of operators that either collapses into my view (if $D$ becomes precise) or loses classical logic (if $D$ remains vague). You're trying to have your cake and eat it too.

  **Sam:** And you're trying to save classical logic by making linguistic competence a mystery. You say I can't know the boundary because of safety conditions. But if the boundary is determined by usage, and I am a master of the usage, why is the boundary inaccessible to me? It implies my usage is detached from my knowledge of my usage.

  **Elena:** Because usage determines meaning collectively, not individually. You don't fix the boundary alone. The community's disposition fixes it. Your individual competence is sensitive to the community standard, but that standard is too fine-grained for your discriminative abilities to track perfectly. That's not skepticism about competence; it's humility about discrimination.

  **Sam:** Humility is one thing. Claiming there is a fact of the matter that is *in principle* unknowable is another. Let's go back to the hierarchy. If I accept that the set of precisifications is vaguely bounded, I avoid the sharp cut-off for $D$. Yes, I lose S4. But I keep the intuition that there is no magic number where redness stops, even at the level of "definiteness."

  **Elena:** But if there's no magic number for $D$, then there's no fact of the matter about whether $Dp$ is true. That means truth itself is vague. And if truth is vague, bivalence fails. And if bivalence fails, you've abandoned classical logic, which was your whole pitch.

  **Sam:** Supervaluationism *does* abandon bivalence for borderline sentences. It keeps classical logic for the connectives, but not for every sentence.

  **Elena:** But higher-order vagueness threatens the connectives too. If the boundary of the set of precisifications is vague, then logical consequence becomes vague. Validity is preservation of supertruth. If supertruth is vague, validity is vague. You end up with a fuzzy logic, and you've lost the precision you claimed to offer.

  **Sam:** Perhaps. But I'd rather have a slightly fuzzy logic that matches the phenomenon than a crisp logic that requires me to believe patch 543 is orange while I can't possibly tell it apart from 542, and I can't possibly know that I know it.

  **Elena:** And I'd rather accept the sharp boundary and explain the ignorance, than accept a hierarchy of vague operators that never bottoms out. At least on my view, when we stop talking, the world is determinate. On yours, the semantics itself is perpetually undecided.

  **Sam:** Or on mine, the semantics reflects the openness of the world.

  **Elena:** *[Taps patch 542]* Openness is fine. But logic requires closure.

  **Sam:** *[Taps patch 543]* And competence requires knowability.

  *They sit in silence for a moment, looking at the strip where red becomes orange, neither able to point to the exact moment the other is wrong.*
