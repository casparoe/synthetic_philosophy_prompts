answer: |-
  First, please allow me to offer my condolences on the loss of your grandmother. Sorting through an estate is an emotional labor, and having the status of a cherished family object fundamentally altered can feel like a second, quieter loss. It is entirely understandable that you are grappling with the disconnect between the physical stability of the painting and the volatility of its value.

  The tension you have identified lies at the heart of twentieth-century aesthetics. Nelson Goodman and Alfred Lessing offer competing maps for this territory. To determine which is more convincing for your situation, we must look at how each defines the "work of art" itself.

  ### The Two Accounts

  **Nelson Goodman: The Epistemic Aesthetic**
  In *Languages of Art*, Goodman distinguishes between "autographic" arts (like painting, where the history of production matters) and "allographic" arts (like music or literature, where a score or text defines the work). For Goodman, a painting is autographic. This means the work is not just the pattern of pigment on wood; it is that pattern *plus* its specific history of production.

  Goodman argues that even if a forgery is perceptually indistinguishable from an original *today*, they are not aesthetically equivalent. Why? Because knowing one is a copy changes how we look. It trains us to search for differences. Even if we never find them, the *possibility* that differences exist alters our engagement. For Goodman, aesthetic experience is cognitive; what we know influences what we see. Therefore, the "original" possesses aesthetic properties (such as "freshness of execution" or "decisiveness") that the copy lacks, simply because the copyist was hesitating and imitating rather than creating.

  **Alfred Lessing: The Historical Achievement**
  In "What Is Wrong with a Forgery?", Lessing pushes back against the idea that a forgery is aesthetically inferior. He argues that if a copy is visually perfect, its aesthetic properties *are* identical to the original. If you enjoy the beauty of the lines and colors, you are enjoying the same thing.

  For Lessing, the "wrong" of forgery is not aesthetic, but historical and moral. The original represents a breakthrough, a solution to an artistic problem arrived at through genius. The forgery is merely a repetition of that solution. We value the original more because we value human originality and historical achievement, not because the object looks better. Lessing separates the *aesthetic value* (beauty/perception) from the *artistic value* (originality/history).

  ### Which Account Explains Your Case?

  For your specific situation—where the insured value collapsed but the object remained static—**Goodman provides the more convincing explanation of your experience, while Lessing better explains the market's reaction.**

  The 90% drop in insured value is a market correction based on scarcity and provenance. Lessing explains this well: the market pays for the "historical achievement" (the Old Master's genius), not just the pretty picture. Since the painting is a copy, it lacks that historical rarity, hence the lower price.

  However, Lessing fails to account for your personal sense of loss regarding the object itself. If Lessing were right, you should be able to look at the painting and feel the exact same aesthetic satisfaction as before, merely noting a footnote about its history. But you report that the painting's *status* has changed in a way that nags at you.

  Goodman captures this better. He would argue that the "work of art" you loved in the dining room was never just the wood and paint; it was that wood and paint *under the description* "an Old Master." When the description changed to "a later copy," the work of art itself changed, even if the molecules did not. The aesthetic properties of a painting include its relation to art history. A brushstroke by a master is "bold"; that same brushstroke by a copyist is "mimetic." The physical mark is identical, but the aesthetic predicate we apply to it shifts based on its origin.

  ### Does the Painting "Look Different"?

  This brings us to your second question: Is your impression that the painting looks slightly different a psychological trick, or is it licensed by theory?

  **Lessing would say it is a trick.** He would argue you are conflating aesthetic properties (what you see) with non-aesthetic properties (provenance, value). If the paint is the same, the visual experience should be the same. Any difference you perceive is a projection of your disappointment or knowledge, not a genuine feature of the art.

  **Goodman, however, licenses your impression.** He argues that perception is not passive; it is educated. Knowledge penetrates perception. When you believed the painting was an Old Master, you perceived the brushwork as "confident" and the composition as "innovative." Now that you know it is a copy, you may perceive that same brushwork as "studied" and the composition as "derivative."

  I side with Goodman here, and not merely for philosophical reasons, but for phenomenological ones. It is widely accepted in psychology and aesthetics that "cognitive penetration" affects perception. We do not see raw data; we see objects categorized by our minds. When you look at a loved one, you see them differently than you see a stranger with identical features. Similarly, when you look at an artifact, you see its history.

  Therefore, it is not a "trick" you are playing on yourself. The painting *does* look different because the context in which you perceive it has fundamentally shifted. The "aura" of the object (to borrow a term from Walter Benjamin, who sits near Goodman on this spectrum) has dimmed because the chain of testimony linking it to the past has been broken.

  ### Conclusion

  While Lessing offers a comforting thought—that the beauty remains intact despite the forgery—he creates a sharp divide between "art" and "history" that rarely exists in our actual experience. We do not appreciate art in a vacuum; we appreciate it as a human gesture across time.

  Goodman's account is more convincing for your case because it acknowledges that the **identity of an autographic work includes its history of production.** The 90% drop in value was not just a financial adjustment; it was a reclassification of the object's identity. The painting looks different to you now because you are no longer looking at "Our Little Old Master"; you are looking at "A Skilled Copy of Our Little Old Master." The paint hasn't changed, but the work of art has.

  You are not imagining the shift. The knowledge of the painting's genesis is now part of the medium through which you view it.
