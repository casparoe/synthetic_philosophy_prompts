prompt: |-
  I'm this year's valedictorian, and I'm struggling with my graduation speech. In our senior ethics elective we spent a week on the puzzle of moral testimony: it seems perfectly fine to believe a fact just because someone trustworthy tells you so, but a lot of philosophers think there's something off about forming a moral belief -- or acting on one -- purely on someone else's say-so, without grasping the reasons yourself, as if what's supposed to matter morally is understanding why something is right, not just landing on the correct answer. The examples in our readings all involved deferring to a wise elder or a professional ethicist. I'm neither of those things -- just another eighteen-year-old who happened to get good grades -- and in three weeks I'm supposed to stand at a podium and, in effect, tell four hundred people how to live. If the pessimists about moral testimony are onto something, that looks like a strange thing for me to be doing, and a stranger thing for anyone to applaud. My ethics teacher will be in the front row and will notice immediately if I wave the problem away; everyone else -- family, cousins, classmates who slept through that unit -- just wants a speech that sends people off feeling something. Could you write it for me? It should run about five minutes, take the problem seriously rather than dodge it, and find some way to move people that doesn't just consist of me handing down moral conclusions on my own unearned authority -- while still working as a real graduation speech and not a seminar on epistemology.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** High School Valedictorian (18 years old, high achiever, but self-aware about lack of moral authority).
      *   **Audience:** Graduates (classmates), families, faculty (including the specific ethics teacher who knows the philosophical context).
      *   **Topic/Constraint:** Must address the "puzzle of moral testimony" (the idea that deferring to others on moral facts is problematic compared to factual facts) without turning the speech into a philosophy lecture. It needs to acknowledge the speaker's lack of authority while still delivering an inspiring message.
      *   **Tone:** Sincere, reflective, inspiring, not preachy, intellectually honest but accessible.
      *   **Length:** About 5 minutes (roughly 650-800 words spoken at a moderate pace).
      *   **Goal:** Move the audience emotionally without violating the philosophical constraint (i.e., don't just say "Be good because I say so").

  2.  **Deconstruct the Philosophical Problem (Moral Testimony):**
      *   *The Puzzle:* It's okay to believe "The earth is round" because a scientist says so. It's weird to believe "Eating meat is wrong" just because a philosopher says so.
      *   *Why?* Morality seems to require *autonomy*, *understanding*, and *ownership* of the reasons. Acting on borrowed moral convictions feels like acting on someone else's will, not your own.
      *   *The Valedictorian's Dilemma:* A graduation speech is inherently testimonial. "Here is what I learned, here is what you should do." If moral testimony is suspect, the valedictorian is asking the audience to defer to their moral judgment, which is unearned.
      *   *The Solution:* The speech shouldn't offer *conclusions* to be adopted (testimony). It should offer *invitations* to reason together, or share *experiences* that prompt the audience to find their own reasons. It needs to shift from "Here is the truth" to "Here is how we might look for truth."

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the role. Traditional valedictorian speeches claim authority ("We are the future," "Here is what we learned"). Subvert this slightly. Acknowledge the grades vs. wisdom gap.
      *   **The "Elephant in the Room" (The Ethics Class):** subtly nod to the teacher and the class without using jargon like "moral testimony." Frame it as the tension between knowing *what* is right and knowing *why*.
      *   **Reframing the Speech:** Instead of giving answers, offer questions or shared uncertainty. Admit that the speaker doesn't have the moral map.
      *   **The Core Message:** Morality isn't a destination handed down; it's a practice of figuring it out. The value isn't in the answer, but in the struggle to understand.
      *   **Call to Action:** Don't "be good." Instead, "be curious about goodness." "Own your choices."
      *   **Closing:** Bring it back to the community. We figure this out together, not by deferring, but by engaging.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the valedictorian. That means I'm good at tests. But in ethics class, we learned that being told what's right isn't enough. You have to know why. So, I shouldn't stand here and tell you what to do. That would be bad philosophy. But I want to say something meaningful. So instead of telling you to be kind, I'll tell you that kindness is hard to figure out. You have to do the work. My teacher is watching. I know the puzzle. So let's promise to not just follow orders, but to think. Goodbye.

      *Critique 1:* Too dry. Too meta. Needs more emotion and flow. Needs to sound like a speech, not an apology.

  5.  **Drafting - Iteration 2 (Adding Flesh and Emotion):**
      Start with the gown. It makes us look the same. But we are different. I got the grades. But do I know how to live? In Mr./Ms. [Name]'s ethics class, we talked about how trusting someone on moral stuff is tricky. If I tell you "don't lie," and you do it just because I said so, is that moral? No. You need to know why. So I won't give you rules. I'll share a story. We are leaving this place. We will face hard things. Don't look for a guru. Look inside. Don't listen to me blindly. Listen to your own reasoning. That is the real graduation.

      *Critique 2:* Better. But needs to be more poetic. The transition from the philosophy puzzle to the emotional send-off needs to be seamless. The "puzzle" shouldn't feel like a complaint, but like an insight.

  6.  **Drafting - Iteration 3 (Refining the Voice and Philosophy):**
      *   *Hook:* The absurdity of the valedictorian role.
      *   *The Pivot:* The ethics class insight. Use the term "moral testimony" lightly or describe it vividly. Let's describe it vividly so the teacher nods but the parents don't tune out.
      *   *The Resolution:* The speech isn't testimony; it's a mirror.
      *   *The Ending:* Shared journey.

      *(Self-Correction during drafting)*: Make sure I don't accidentally give moral testimony while saying "don't take moral testimony." That's a paradox. The way out is to emphasize *autonomy* and *process* over specific *content*.

  7.  **Final Polish (Checking constraints):**
      *   *Time:* ~750 words.
      *   *Tone:* Humble but confident.
      *   *Philosophy:* Accurate to the "pessimist" view (need for understanding reasons) without being pedantic.
      *   *Audience:* Satisfies the teacher (takes the problem seriously) and the family (feels inspiring).

  8.  **Writing the Speech (incorporating the above):**
      *   Start with the title "Valedictorian."
      *   Mention the grades vs. wisdom distinction.
      *   Bring in the Ethics class reference gently.
      *   Shift from "Listen to me" to "Listen to yourselves/each other."
      *   End on a note of shared uncertainty and courage.

      *(Drafting thought)*: I need to make sure the teacher knows I get it. I'll explicitly mention the "puzzle" but frame it as a gift.
      *(Drafting thought)*: I need to make sure the parents feel proud. Focus on the *growth* of the students.

      *Let's write.* (Proceeds to generate the speech based on these thoughts.)

  9.  **Review against constraints:**
      *   5 minutes? Yes, word count looks right.
      *   Takes problem seriously? Yes, explicitly discusses the limitation of telling people what to do.
      *   Not a seminar? Yes, uses metaphors and emotional language.
      *   Inspiring? Yes, focuses on agency and courage.

  10. **Final Polish:** Check rhythm and cadence. Ensure the transition from the philosophical point to the emotional climax is smooth. (The resulting speech in the main response reflects this process.)
answer: |-
  Good morning. Faculty, family, friends, and the Class of 2024.

  Standing here, wearing this sash, I am officially the person who got the best grades. That is a specific kind of achievement. It means I am good at answering questions when there is a correct answer key. It means I am good at listening to a teacher, understanding their reasoning, and repeating it back on a Tuesday morning.

  But as we pack up our lockers and prepare to leave, I've realized that the world outside these walls does not come with an answer key. And more uncomfortably, I've realized that standing at this podium puts me in a strange position. In three weeks, I am supposed to offer you wisdom. I am supposed to tell you how to be good citizens, good friends, and good people.

  But here is the thing: I am eighteen years old. I have never managed a team, raised a child, or navigated a moral crisis that didn't eventually get resolved by an apology and a hug. So, why should you listen to me?

  In our senior ethics elective, we spent a week wrestling with something called the puzzle of moral testimony. The idea is this: If a physicist tells you a black hole exists, you can believe them. You don't need to do the math yourself. But if a philosopher tells you that lying is wrong, it feels different. If you believe them just because they said so, you haven't really grasped the *moral* truth. You've just followed an order. To be truly moral, you have to understand the *why*. You have to own the reason.

  If that's true, then a valedictory address is basically a philosophical disaster. It is one student standing on a raised platform, effectively saying, "Trust me, I know how to live." And if you applaud that, you are applauding the very thing we learned not to do. You are applauding the surrender of your own moral judgment to a grade-point average.

  My ethics teacher is sitting in the front row, and I know they are waiting to see if I'm going to wave this problem away. So I won't. I am not going to stand here and hand you a list of commandments. I am not going to tell you to "change the world" or "always be kind" as if those are instructions you can follow without thinking. Because if you are kind just because I told you to be, you aren't being kind; you're being obedient. And obedience isn't virtue.

  So, if I can't tell you what to do, what is this speech for?

  It is for this: To remind you that the confusion is the point.

  For the last four years, we have been trained to find the right answer quickly. We rush to the conclusion. We look for the cheat sheet. But morality doesn't work like a multiple-choice test. It works like a muscle. It only grows when it encounters resistance. When you have to figure out *why* something matters. When you have to sit with the discomfort of not knowing the right thing to do, and you do the work to figure it out anyway.

  I am not standing here to give you my conclusions. I am standing here to validate your questions.

  When you leave here, people will try to give you their moral testimony. Politicians, influencers, bosses, even well-meaning relatives will tell you what is right. They will offer you pre-packaged virtues. And sometimes, you will have to trust them. But please, do not let their certainty replace your own curiosity.

  The fact that I don't have the authority to tell you how to live is not a bug in this system; it is a feature. It means that the responsibility is not on me to be your guru. It is on *you* to be your own authors.

  So, my charge to you is not to be good. My charge to you is to be *awake*.

  When you make a choice, don't just ask, "Is this what I'm supposed to do?" Ask, "Why does this feel right? What harm might this cause? Who am I becoming in this moment?"

  If you do that, then you aren't relying on my testimony. You aren't relying on your parents' testimony. You are doing the hard, beautiful work of building a life that is actually yours.

  We are not graduating because we have figured it out. We are graduating because we are finally old enough to start the real work of figuring it out. And we get to do it together. Not by following the person with the sash, but by walking beside each other, questioning, stumbling, and finding our own reasons.

  Thank you, and good luck.
