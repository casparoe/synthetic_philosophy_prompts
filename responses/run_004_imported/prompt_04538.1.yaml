  I've been tinkering with a side project where I'm building a little bot for a simplified poker-style card game, and part of it involves a solver that takes a normal-form game (just a payoff matrix) and iteratively strips out dominated strategies before I hand the reduced game off to an actual equilibrium solver, kinda like a pruning pass. I got the pure-vs-pure case working fine: for each strategy I check if some other single strategy beats it no matter what the opponent does, delete it if so, and repeat till nothing changes. Mentioned this to a buddy from college who actually took a game theory course, and he's insisting this isn't real IESDS (iterated elimination of strictly dominated strategies, had to look up what that even stood for) unless I also check whether a strategy is dominated by some mix of two or more other strategies, not just a single pure one on its own.

  Honestly this sounds like nonsense to me. If none of my rows beat strategy X outright by themselves, how is blending a couple of them together supposed to suddenly pull it off? Like if strategy A loses to X in scenario 1 but beats it in scenario 2, and strategy B is the opposite, averaging A and B just seems like it should give you something thats mediocre against X in both scenarios, not something that beats X in both. Averaging two strategies that each lose to X somewhere shouldn't produce a strategy that never loses to X. He swears this actually happens in real games and isn't just some weird corner case, but couldn't come up with an example on the spot and just told me to go read Osborne's textbook. Is he right that I'm missing something fundamental, or is pure-strategy dominance actually sufficient here and he's misremembering something from undergrad?
