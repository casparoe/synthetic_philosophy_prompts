      Let's choose **The Distinction between "Conspiracy" (Act) and "Conspiracy Theory" (Genre).** Theo argues conspiracies exist. Nina argues conspiracy *theories* are flawed. They are talking past each other slightly. The missing piece is recognizing that "Conspiracy Theory" has become a specific genre of explanation that differs from "Investigative Journalism."
      Actually, I think **Predictive Power** is the cleanest epistemic tool missing here. Real conspiracies yield new evidence. Theories recycle old evidence.

      *Decision:* I will highlight **Predictive Power/Novel Evidence** as the missing key. It solves Theo's "hindsight" problem (real investigations find *new* things, theories just reinterpret *old* things) and refines Nina's probability argument.

