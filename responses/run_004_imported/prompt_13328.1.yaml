      Actually, the *Incentive Structure* is probably more fundamental than Nina's probability argument. Why *don't* people leak? Because of fear, loyalty, or compartmentalization. Nina assumes independent leakage probability. That's the weak point in her math.
      But the *best* missing consideration is likely **The Distinction between "Conspiracy" (Event) and "Conspiracy Theory" (Worldview).** Theo conflates them. Nina tries to separate them via logic. The missing piece is *sociological function*.
      Let's stick with **Explanatory Scope (Totalizing vs. Specific).** It bridges the gap between Theo's examples (specific crimes) and the "theories" Nina attacks (vague, all-encompassing).

      *Re-evaluating the "Missing Consideration":*
      Actually, the most potent counter to Nina's probability argument is **Compartmentalization.** You don't need 1,000 people to know the whole truth. You need 1,000 people to know 1% of the truth. This undermines her math.
