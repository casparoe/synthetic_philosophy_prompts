      *   Round 3: Nina wins on structural probability, but with caveats.
      *   Missing Piece: The distinction between *specific criminal conspiracies* and *totalizing ideological narratives*.

  7.  **Final Polish:** Ensure the distinction between "conspiracy" (the act) and "conspiracy theory" (the epistemic category) is clear. Ensure the probability argument nuances (compartmentalization) are mentioned.

