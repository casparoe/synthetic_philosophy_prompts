      *   **Topic:** Wigner's "Unreasonable Effectiveness of Mathematics" (1960).
      *   **Key References:** Wigner (original puzzle), Hamming (1980, deflationary/selection effects/evolution), Tegmark (Mathematical Universe Hypothesis, metaphysical).
      *   **Task:** Weigh deflationary accounts against metaphysical ones. Do not just retell anecdotes.
      *   **Requirement:** Close with a *definite verdict* on how much genuine mystery remains and why.
