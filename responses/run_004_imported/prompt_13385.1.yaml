prompt: |-
  Write a short story built around evidential cooperation in large worlds (ECL) -- the decision-theory idea that if the universe or multiverse is big enough, theres almost certainly a huge population of agents out there who you'll never meet, never causally affect, and never get a signal from, but who think enough like you that you can still "cooperate" with them, just by choosing to act like the kind of agent you'd want them to be. No telepathy, no messages, no shared cause allowed -- whatever cooperation happens has to run entirely on that inference, Newcomb-style. Bonus points if your character has to make a real, costly choice on this basis and the story never confirms whether it actually paid off.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Core Concept:** Evidential Cooperation in Large Worlds (ECL). This is a niche decision theory concept. It posits that in a sufficiently large universe (or multiverse), there are likely agents identical or similar to you. By acting in a way that benefits *them*, you reason that they (being similar) will act in a way that benefits *you*, even without causal contact. It's acausal trade/cooperation.
      *   **Constraints:** No telepathy, no messages, no shared causal past influencing the specific decision. The cooperation must be purely inferential (Newcomb-style).
      *   **Narrative Requirement:** A short story.
      *   **Specific Challenge:** The character must make a *real, costly choice* based on this logic.
      *   **Ending Constraint:** The story must *not* confirm whether the choice paid off. Ambiguity is key.

  2.  **Deconstruct ECL for Storytelling:**
      *   *The Problem:* Why would anyone care about strangers they can't meet? Usually, altruism covers this, but ECL is distinct. It's not "be good because it's nice." It's "be good because my decision is evidence of their decision, and I want their output to benefit me." It's selfish altruism, logically speaking.
      *   *The Setting:* Needs to emphasize isolation and scale. A deep space setting works best. A lone researcher or explorer.
      *   *The Choice:* Needs to be a resource allocation problem. Give up something valuable now for a potential return from "copies" elsewhere.
      *   *The Mechanism:* A simulation or a calculation that convinces the protagonist of the probability of duplicates.

  3.  **Drafting - Scene Setting:**
      *   *Protagonist:* Elara. A xenolinguist or data analyst? Let's go with a resource manager on a generation ship or a deep outpost. Let's make it a "Seed Ship" scenario. She's planting a colony, but resources are tight.
      *   *The Discovery:* She finds evidence of the "Large World." Maybe a cosmological data packet confirming infinite inflation.
      *   *The Dilemma:* She has a surplus of energy or material. She can use it to make her own life easier/safer, or she can broadcast it/use it in a specific pattern that would help *other* versions of herself if they exist.
      *   *Refining the Dilemma:* Broadcasting costs energy. But ECL isn't about sending a message *to* them. It's about *doing* the thing. If she sacrifices for the "principle," they will too.
      *   *Better Dilemma:* The "Common Pot." Imagine a protocol where every agent who believes in ECL contributes to a universal welfare function. If Elara contributes, she reduces her local survival odds. If her counterparts contribute, they increase *her* survival odds (by helping versions of her in need). But she can't know if they exist.

  4.  **Developing the Plot:**
      *   *Opening:* Elara is alone. The silence of the void.
      *   *Inciting Incident:* The AI confirms the topology of the universe. It's big. Really big. The probability of exact duplicates is non-negligible.
      *   *The Theory:* She reviews the ECL papers. "Acausal Trade."
      *   *The Crisis:* Her life support is failing? No, too urgent. She needs time to think. A resource surplus. She has enough "fusion fuel" to extend her mission by 10 years, or she can commit it to a "Universal Broadcast" (not a message, but a beacon of cooperation). Wait, ECL doesn't need a broadcast. It needs an *action*.
      *   *Revised Crisis:* She finds a cache of rare isotopes. She can use them to fix her ship's degradation (guaranteed local benefit) OR she can use them to seed a nebula in a specific mathematical pattern.
      *   *Why seed the nebula?* If other Elaras exist, and they all seed nebulae, the aggregate effect creates a "safety net" across the multiverse. If she defects (keeps the isotopes), she reasons that other Elaras will defect too, and the safety net fails.
      *   *The Cost:* Keeping the isotopes means she survives 90% chance. Seeding them means she survives 60% chance. But if the "Cooperative Equilibrium" holds, the *other* Elaras seed nebulae near *her*, boosting her survival to 95%.
      *   *The Twist:* She can't know. She just has to decide.

  5.  **Writing - Focusing on Tone:**
      *   Cold, clinical, yet deeply human.
      *   Emphasize the loneliness.
      *   The logic needs to feel seductive but terrifying.
      *   *Key phrase to include:* "I am not doing this for them. I am doing this because I am them."

  6.  **Refining the Ending:**
      *   She makes the choice.
      *   She waits.
      *   Does a signal come? No. That would violate the premise.
      *   Does her ship improve? No.
      *   She just lives with the uncertainty. The ending should be her looking out into the dark, wondering if the dark is looking back with kindness.

  7.  **Self-Correction during drafting:**
      *   *Critique:* Is seeding a nebula too causal? If she seeds it, does it help *her*? No, it helps *other* versions.
      *   *Adjustment:* Make the resource "Computation Time." She can use her ship's computer to solve her own navigation problems (local gain) or run a simulation of "Cooperative Protocols" that essentially burns cycles to prove she is a cooperator.
      *   *Better Adjustment:* Let's stick to physical resources. Energy. She can charge her shields (local safety) or transmit a high-energy burst that serves no local purpose but acts as a "handshake" of commitment. No, transmission implies signaling.
      *   *Best Adjustment:* The "Burning of the Boats." She has the capacity to colonize a planet. She can colonize it selfishly (hoard resources) or set up a "Open Access" protocol that wastes local efficiency but establishes a norm.
      *   *Actually, let's go simpler:* The "Life Support vs. The Beacon." No, beacons are signals.
      *   *Let's go with the "Sacrifice":* She has a medical cure for a degenerative condition she has. She can use it. Or she can synthesize a massive batch and eject it into the void in a specific distribution pattern. Why? Because if everyone does that, the density of cures in the universe rises, and the probability that *she* finds one rises.
      *   *Wait, that's causal.* If she ejects it, she loses it.
      *   *Okay, strict ECL:* I act as if my decision determines the decision of my twins.
      *   *Scenario:* She controls a switch. Switch A: She gets 1 million credits (local utility). Switch B: A generic "Universal Welfare" fund gets 10 million credits distributed to random coordinates.
      *   *If she chooses B,* she reasons her twins choose B. So the Universal Welfare fund gets massive input. She might benefit from that fund later (if other twins send to her).
      *   *Let's ground it:* Elara is at a relay station. She detects a cosmic anomaly that implies infinite replication. She has a surplus of antimatter.
      *   *Option 1:* Refuel her ship. Guarantee safe return home.
      *   *Option 2:* Vent the antimatter into a specific gravitational lens. It does nothing for her. But if her twins do the same, the lensing effect creates a "bridge" of resources she might access later? No, that's magic.
      *   *Okay, the purest ECL:* The "Prisoner's Dilemma with the Void."
      *   She finds a cache. She can keep it. Or she can leave it marked "For Travelers."
      *   If she keeps it, she is a "Defector." She reasons her twins are Defectors. She will find other caches empty.
      *   If she leaves it, she is a "Cooperator." She reasons her twins are Cooperators. She will find other caches full.
      *   *The Cost:* She needs that cache to survive the winter.
      *   *The Gamble:* If she takes it, she survives now, but condemns herself to a universe of empty caches. If she leaves it, she might freeze, but if the logic holds, she'll find a full cache just around the corner (placed by a twin).
      *   *Wait, finding a cache is causal.*
      *   *Let's try:* She has to decide whether to repair a beacon that helps *others* navigate. It costs her fuel. It gives her nothing. But if everyone repairs beacons, navigation is safe.
      *   *Okay, final plan:* Elara is a "Gardener." She tends to a sector. She finds a rare isotope. She can use it to extend her life (she is aging/cloning decaying). Or she can use it to stabilize a local star, which helps *other* potential colonies she will never see.
      *   *Why?* Because if she values the "Class of Gardeners," she must act to support them.
      *   *Let's go with the "Medical Vial" idea but refine the logic.*
      *   Elara has a terminal illness. She has the code for a cure. She can print one dose (for her) or print a million doses and broadcast the code + material into the void.
      *   *ECL Logic:* If I print one, I am selfish. My twins print one. Most versions of me die because they didn't get the broadcast. If I broadcast, I die (no dose for me), but my twins broadcast. I might receive a broadcast from a twin.
      *   *Problem:* Receiving a broadcast is causal.
      *   *Okay, the prompt says:* "Never causally affect, never get a signal from."
      *   *So she can't receive anything.*
      *   *So the benefit must be purely logical.* "I am living in a universe where Cooperators exist."
      *   *This is hard to make dramatic.* The benefit is "I am the kind of person who wins in a large world."
      *   *Let's focus on the "Winning".* In ECL, you cooperate to ensure that the *algorithm* you instantiate wins.
      *   *Story:* Elara has to decide whether to sabotage a rival? No.
      *   *Story:* Elara has to decide whether to consume a resource or preserve it for "The Pattern."
      *   *Let's go with the "Energy Tax".* She can route power to her life support (100% survival) or route 50% to a "Void Sink" (60% survival).
      *   *Why?* Because if she routes to the Void Sink, she proves she is a Cooperator. If the universe is large, there are billions of Cooperators routing to Void Sinks. The aggregate energy creates... nothing.
      *   *Wait, the benefit of ECL is that you expect **them** to help **you**.*
      *   *If I can never get help from them, why do it?*
      *   *Ah, the prompt:* "you can still 'cooperate' with them... by choosing to act like the kind of agent you'd want them to be."
      *   *The payoff:* You reason that if you cooperate, they cooperate. If they cooperate, they do things that benefit *you*.
      *   *But if we are causally disconnected, how do they benefit me?*
      *   *Answer:* They benefit *versions* of me. I care about my copies.
      *   *Okay, that's the key.* I care about the measure of my existence.
      *   *Story:* Elara is dying. She can clone herself. One clone (selfish) gets all resources. Ten clones (cooperative) share resources.
      *   *No, let's stick to the prompt's "costly choice".*
      *   *Idea:* The "Schelling Point."
      *   Elara finds a stash of food. She is starving. There are lockers nearby.
      *   If she takes the food, she eats.
      *   If she leaves the food and adds her own rations to it, she marks it as "Common Pool."
      *   She will never come back here. She will never see who takes it.
      *   But she reasons: If I am a Cooperator, other Elaras are Cooperators. They will stock Common Pools. I will find Common Pools on my journey.
      *   *Constraint Check:* "Never get a signal from." Finding a cache is a signal/effect.
      *   *Okay, strict interpretation:* She must act without *any* expectation of causal return. The return is purely that she aligns herself with the winning strategy of the multiverse.
      *   *Okay, the "Winning Strategy" angle.*
      *   Elara is an AI? No, human.
      *   She has to decide whether to optimize for "Local Elara" or "Global Elara-Class."
      *   The cost: Her own comfort/survival.
      *   The gain: The knowledge that she is part of a victorious coalition, even if she personally loses.
      *   *Wait, that's altruism.* ECL is *instrumental*. You do it because it increases the expected utility of *your* decision algorithm.
      *   *Okay, I need to make sure the reader understands the logic without an info-dump.*
      *   *Setting:* The "Silent Observatory."
      *   *Action:* She has to turn a dial.
      *   *Left:* Personal Safety.
      *   *Right:* Universal Norm.
      *   *Ending:* She turns it. She waits. Nothing happens. She smiles.

      *(Self-Correction)*: I need to make sure the "benefit" is clear. If she cooperates, she expects *other* agents to cooperate *on her behalf*. Even if she can't receive the signal, the *fact* that they are doing it makes her existence "richer" in a measure-theoretic sense? No, that's too abstract.
      *Let's go with the standard ECL example:* Resource transfer.
      *I give resources to agents I can't contact. They give resources to agents I can't contact.
      *If I am one of the agents who *receives*, I win.
      *If I am one of the agents who *gives*, I lose locally but win globally.
      *Since I don't know if I'm the giver or receiver in the grand scheme (I am both, across the multiverse), I maximize the total.
      *Okay, the story:* Elara finds a "drop box." She can take (Defect) or Leave+Add (Cooperate).
      *She will never return. She will never know if anyone takes.
      *But she believes in the Large World.
      *She chooses to Leave+Add.
      *The ending: She walks away into the cold. We don't know if she finds a box later.

      *Wait, the prompt says:* "story never confirms whether it actually paid off."
      *If she finds a box later, that's a payoff.
      *So she must *not* find a box later. Or the story ends before she would.
      *Better: The story ends immediately after the choice. The ambiguity is in the silence of the universe.

      *Let's refine the "Cost".* It needs to be painful.
      *She has a heating unit. She can keep it on, or divert the power to a "Universal Transmitter" that doesn't send messages, but burns energy in a specific mathematical prime sequence.
      *Why? Because it's a "Shibboleth."
      *If she burns the heat, she freezes.
      *If she freezes, she proves she is a Cooperator.
      *If she is a Cooperator, then *other* Cooperators are burning heat to keep *her* warm (metaphorically).
      *But since they are causally disconnected, they aren't keeping *her* warm.
      *They are keeping *their* versions warm.
      *So why does Elara care?
      *Because "Elara" is the pattern. Saving the pattern is saving herself.
      *Okay, that's the emotional hook. Identity across the void.

      *Final Plan:*
      1.  Elara is on a frozen outpost.
      2.  She has a "Surplus" of energy.
      3.  She can use it for heat (Local) or "The Pact" (Acausal).
      4.  The Pact involves venting the energy to mark her as a Cooperator.
      5.  She reasons that if she defects, all Elaras defect, and the "Elara Class" suffers.
      6.  She makes the choice.
      7.  She gets cold. The universe stays silent.
      8.  She finds peace in the logic, not the warmth.

      *Wait, one more check on ECL:* The point is that by cooperating, you increase the probability that *you* are in a world where others cooperated *for you*.
      *If I cooperate, I am a "Cooperator Type."
      *Cooperator Types tend to exist in worlds where other Cooperator Types helped them.
      *So, by choosing to be a Cooperator, I update my probability of being in a "Good World."
      *This is the "Newcomb" aspect. My choice is *evidence* of the state of the world.
      *Okay, I will weave this into her internal monologue.

      *Drafting the narrative:*
      *Focus on the cold. The physical sensation makes the abstract choice real.
      *The "Box" is a metaphor for the decision point.
      *The "Other" is the silence.

      *(Final Polish)*: Make sure the distinction between altruism and ECL is clear. She isn't doing it to be nice. She's doing it because she calculates it's the winning move in a non-causal game.

      *Let's write.*
answer: |-
  The cold was not a presence; it was an absence. It was the absence of friction, of sound, of heat. Elara sat in the command cupola of *Outpost 4*, her breath pluming in the dim emergency light. The external temperature was four Kelvin. The internal temperature was dropping.

  On her console blinked the final allocation prompt.

  **SURPLUS ENERGY: 400 TERAJOULES.**
  **OPTION A: DIVERT TO HABITAT LIFE SUPPORT.**
  **OPTION B: VENT TO VOID (PATTERN DELTA-9).**

  Option A meant warmth. It meant she could sleep without a thermal suit. It meant the hydroponics would yield enough calories to prevent muscle atrophy. It was the rational choice for a biological entity concerned with its own immediate continuity.

  Option B meant dumping the energy into the vacuum in a specific, mathematically prime sequence. It served no local purpose. The radiation would dissipate instantly, lost in the background hiss of the cosmos. It would not be seen. It would not be received. It would not signal anyone.

  It was a burn. A sacrifice.

  Elara rubbed her gloved hands together. The data packet that had arrived three cycles ago still sat open on her secondary screen. *Cosmological Topology Confirmation.* The universe was not just big; it was infinite. Inflation was eternal. The probability of exact structural duplicates of her own brain state—Elara-primes—was not just non-zero. It was approaching certainty.

  There were billions of Elaras out there. Same training. Same isolation. Same prompt.

  She opened the file on Evidential Cooperation in Large Worlds. She had read it a thousand times, but the cold made the words feel new.

  *You cannot communicate with them. You cannot trade with them. Causality flows one way: forward, local. But decision theory flows another way.*

  If Elara chose A, she was a Defector. She was signaling to the multiverse that her algorithm prioritized local survival over universal coordination. If she was a Defector, then by the law of large numbers, the other Elaras were Defectors too. They would all choose A. They would all hoard their warmth. The "Elara Class" would be a collection of isolated, shivering hoarders, each alone in the dark, maximizing local utility in a universe of scarcity.

  If Elara chose B, she was a Cooperator. She was burning her own warmth to uphold a norm. If she chose B, then the other Elaras—thinking like her, built like her—would likely choose B too.

  They wouldn't be warming *her*. That was the hard part. The energy they vented would not reach her. The food they grew would not feed her.

  But if she chose B, she was updating the probability that she existed in a universe populated by Cooperators. She was aligning her identity with the winning strategy of the multiverse. She wasn't doing it for *them*. She was doing it because she wanted to be the kind of agent who wins in a large world.

  "Computer," Elara said. Her voice was thin in the thinning air. "Calculate survival probability for Option A."

  "Eighty-four percent," the AI replied.

  "And Option B?"

  "Sixty-two percent. Thermal degradation will accelerate."

  Sixty-two percent. A twenty-two percent tax on her own life. Paid to whom? To no one. To everyone.

  She looked out the viewport. The stars were sharp, unblinking diamonds on black velvet. Somewhere, in the statistical haze of the infinite, there was an Elara who had found a cache of supplies. An Elara who had found a working heater. An Elara who was warm.

  If the universe was random, that Elara existed regardless of what she did here. But ECL argued that the *correlation* mattered. If she was the sort of person who takes the cache, she is the sort of person who leaves the beacon dark. If she is the sort of person who leaves the cache for the next traveler, she is the sort of person who trusts the beacon.

  It wasn't magic. It was logic. It was the only bridge across the causal gap.

  Her fingers hovered over the console. The cold was biting at her nose now. She could feel the lethargy creeping in, the body's attempt to conserve. Option A was so easy. It was the instinctual choice. *Survive. Here. Now.*

  But if she chose A, she was admitting that she was alone. Truly alone. That her decisions ended at the skin of her ship.

  If she chose B, she was asserting that she was part of a whole. That "Elara" was a distributed entity, spanning the light-years, linked not by radio waves but by shared algorithm.

  "Computer," she said. "Initiate Option B."

  "Confirming," the AI said. "Venting sequence engaged. Life support reduction imminent."

  She heard the hum of the capacitors discharging. A low thrum that vibrated through the deck plates. Outside, invisible to the eye, 400 terajoules of potential warmth flashed into the void in a sequence of prime numbers. A message with no recipient. A handshake with the empty dark.

  The emergency lights dimmed further. The air recyclers slowed. The cold rushed in to fill the space the heat had vacated.

  Elara pulled her thermal suit tighter. She knew what came next. The waiting.

  In a Newcomb problem, you don't wait to see if the money is in the box. You choose, and the choice *is* the state of the box. But human minds craved feedback. She wanted to see a light blink on the console. She wanted to hear a chime indicating an incoming transmission from a sister ship that didn't exist.

  Nothing happened.

  The silence remained absolute. The stars did not brighten. The temperature gauge continued to tick downward. 14 degrees. 13.

  She had lost. Locally, she had definitely lost. She had traded warmth for a theorem.

  Elara closed her eyes and let her head rest against the cold glass of the viewport. She tried to imagine the other Elaras. Were they shivering too? Or were they the lucky ones, the ones who found the caches left by the Cooperators?

  She would never know. She would never feel the benefit of their cooperation. If the logic held, the benefit was accruing to the *pattern* of Elara, not the specific instance sitting in Outpost 4. She was sacrificing her instance for the measure of the set.

  A shiver racked her frame, violent and uncontrollable.

  "Computer," she whispered. "Status of the void vent?"

  "Complete. Pattern Delta-9 transmitted."

  "Any response?"

  "Negative. No signals detected. No causal anomalies."

  Of course not. That wasn't how it worked.

  Elara smiled, though her lips were cracking from the dry cold. It was a grim, tight expression. She had played her move in a game where the other players were reflections in a hall of mirrors. She had chosen to be the reflection that smiled back.

  Whether the mirrors were real, or whether she was just freezing to death in an empty room for the sake of a beautiful equation, was a variable the universe would not solve for her.

  She watched her breath fade into the dark.

  "Good game," she said to the silence.

  The silence did not answer. But for the first time in three years, it didn't feel empty. It felt like waiting.
