      *   *Jeffrey Conditionalization (JC):*
          *   Formula: $P_1(H) = \sum P_0(H|E_i) P_1(E_i)$.
          *   Key constraint: $P_1(H|E_i) = P_0(H|E_i)$ (Rigidity).
          *   Sequential Update: Show $P_2(H)$ depends on the order because the intermediate $P(E_i)$ changes the weighting for the second step.
