          *   *Actually, the stronger point:* Even on the *same* partition, if you treat the inputs as "new probabilities," doing $0.5 \to 0.6 \to 0.7$ is path-dependent in terms of information distance, but usually, the commutativity complaint is about *different* propositions. Let's focus on the standard objection: Updating on $E$ then $F$ vs $F$ then $E$.
          *   *Math:* $P_{JE}(H) = P(H|E)P^*(E) + P(H|\neg E)P^*(\neg E)$. If I do this twice... it gets messy. The core issue is that JC overwrites the marginal $P(E)$ but keeps conditional $P(H|E)$ fixed. The second update changes $P(H|E)$ implicitly if the partitions overlap.

      *   *Pearl's Virtual Evidence (VE):*
          *   Mechanism: Introduce node $V$. Specify Likelihood Ratio $L = \frac{P(V|H)}{P(V|\neg H)}$.
