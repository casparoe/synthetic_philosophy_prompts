answer: |-
  You are absolutely right to feel that there is a logical link between the shoe example and the money example. Aristotle isn't just throwing out random complaints; he is building a specific framework about what wealth *is* and what it is *for*.

  The confusion usually comes from two places: misunderstanding what he means by "proper/improper" (which sounds moral but isn't exactly), and thinking the "money babies" line is just a metaphor rather than a technical point about the nature of objects.

  Here is the breakdown of the logic, connecting the shoe to the usury ban.

  ### 1. The Shoe: "Proper" vs. "Improper" Use
  You asked: *Trading a shoe away for food seems like a completely normal thing to do, so why does he call that the "improper" use of it?*

  To Aristotle, "proper" doesn't mean "morally good." It means **intrinsic purpose** (philosophers call this *telos*).

  *   **Proper Use:** Why was the shoe created? To protect a foot. If you wear the shoe, you are using it exactly as its nature dictates.
  *   **Improper (Secondary) Use:** If you trade the shoe, you aren't using it as a shoe; you are using it as a **token of value**. You are treating it as an abstract number rather than a physical object designed for a foot.

  **Why does this distinction matter?**
  Aristotle is setting up a hierarchy. The "proper" use satisfies a **human need** (protection). The "improper" use satisfies a **transaction**.

  He isn't saying trade is evil. He is saying trade is *instrumental*. We trade so that the person who needs the shoe gets the shoe. The end goal is still the *wearing* of the shoe. If you trade a shoe but it never gets worn (e.g., you hoard it), the shoe has failed its purpose.

  ### 2. Money: The Tool of Exchange
  This is where the link happens. Aristotle views money as an invention created solely to solve the clumsiness of the "shoe for food" barter system.

  *   **Natural Purpose of Money:** To facilitate the exchange of **real goods** (shoes, food, houses).
  *   **The Logic:** Money is a bridge. You cross the bridge to get to the other side (the real goods).

  As long as you use money to buy a shoe (which is then worn), you are following the "natural" order. Money $\rightarrow$ Real Good $\rightarrow$ Human Need Satisfied.

  ### 3. Usury: The "Unnatural" Break
  Now we get to the usury (interest) quote.

  > *"For money was intended to be used in exchange, but not to increase at interest."*

  If money is a tool for exchange, charging interest is using the tool for something other than exchange. It is making the tool the *end goal* rather than the means.

  **The "Money Babies" Argument**
  You asked: *Is the usury bit seriously just resting on "money having babies is gross/unnatural"?*

  It sounds like a poetic metaphor, but it's actually an argument about **sterility**.

  *   **Natural Wealth (Fertile):** If you are a farmer, your wealth comes from cows birthing calves or seeds becoming crops. This is "natural" because living things reproduce. The "offspring" (calves) resemble the parent (cows).
  *   **Money (Sterile):** A coin is a piece of metal. It is dead. It cannot biologically reproduce.

  When you charge interest, you are pretending that a sterile object (the coin) is a fertile object (the cow). You are claiming that 10 coins naturally become 11 coins. Aristotle argues this is a fiction. The 11th coin didn't come from the metal itself; it came from **someone else's labor or need.**

  Therefore, usury is "unnatural" because it divorces wealth from the production of real things.
  *   **Farming:** Wealth comes from Nature + Labor.
  *   **Trade:** Wealth comes from moving Nature's goods to where they are needed.
  *   **Usury:** Wealth comes from Money itself.

  ### 4. Putting it together: The One Big Argument
  Here is how the shoe and the money link up into a single logical chain:

  1.  **Premise 1:** All objects have a primary purpose related to human need (The shoe is for wearing).
  2.  **Premise 2:** Trade is a secondary use that helps objects get to the people who need them (Trading the shoe gets it to the foot).
  3.  **Premise 3:** Money was invented solely to make that secondary use (trade) easier. Money is a servant to real goods.
  4.  **The Violation:** Usury treats Money as the master. It attempts to make Money generate more Money without passing through "Real Goods" (like shoes or food).
  5.  **Conclusion:** Usury is the most "unnatural" form of wealth because it is the furthest removed from actual human need. It is wealth for the sake of wealth, not wealth for the sake of living.

  ### Why this matters for the "Ban on Interest"
  This is why old religions and cultures banned interest. It wasn't just about being nice to poor people (though that was part of it). It was about maintaining a **moral economy.**

  If you allow money to breed money:
  *   People stop trying to make real things (shoes, food).
  *   People start trying to hoard tokens.
  *   Wealth becomes infinite and abstract, rather than limited by land and resources.

  Aristotle (and later religious scholars) feared that if you detach money from "real stuff," you get a society obsessed with infinite accumulation, which destabilizes the community.

  ### Summary
  *   **The Shoe:** Trading is "improper" not because it's bad, but because it's not what the shoe *is*. It's what you *do* with it to get it to the right owner.
  *   **The Money:** Money is just a shoe made of metal. Its only job is to move real goods.
  *   **The Usury:** Charging interest pretends metal can reproduce like a cow. It bypasses real goods entirely.

  So, the "money babies" line isn't just a joke; it's Aristotle's way of saying **"You are lying about the nature of reality by claiming sterile metal can reproduce."**
