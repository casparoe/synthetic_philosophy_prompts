answer: |-
  This is a fantastic spot to be stuck. You are right to feel that the standard "identity vs. membership" diagnosis (the *fei* 非 equivocation) is necessary but insufficient for this specific passage. If your students have already burned through the SEP entry and the standard "shape/color" distinction, they are ready for the metaphysical heavy lifting this section performs.

  The passage you quoted is arguably the philosophical core of the *Baima Lun*, yet it is often glossed over because it bleeds heavily into the *Jianbai Lun* (Separation of Hard and White). Your colleagues' disagreement likely stems from whether they read Gongsun Long as a logician playing with language or a metaphysician making claims about universals.

  Here is a breakdown of the logical bones of this passage, addressing your two specific questions about *ding* (fixing) and the status of the non-identity claim.

  ### 1. What is *Ding* (定) Doing? (Beyond Exclusion)

  You asked if *ding* is just dressier vocabulary for the exclusion point (yellow/black horses don't count) or if it smuggles in something like rigid designation or quantifiers.

  It is neither rigid designation nor simple quantification. It is an argument about **ontological determination** and the status of **universals vs. compounds**.

  **The Logical Move:**
  The earlier part of the dialogue argues from *extension*: The set of horses includes yellow ones; the set of white horses does not. Therefore, the sets are not identical.
  This passage argues from *intension* and *ontology*:
  *   **Bai (White):** The universal attribute. It is "not fixed" (*bu ding*). It can attach to a horse, a stone, a feather. It is indeterminate regarding its substrate.
  *   **Baima (White Horse):** The compound entity. Here, "white" is "fixed" (*ding*) onto a specific substrate (horse).
  *   **The Crucial Claim:** *Ding suo bai zhe, fei bai ye* ("What is fixed-white is not [abstract] White").

  **Why this matters:**
  Gongsun Long is asserting that once a universal is instantiated (fixed) into a particular compound, it becomes a *different ontological category* than the floating universal.
  *   If $A$ = Abstract White (Universal)
  *   If $B$ = White-Horse Compound (Universal + Substrate)
  *   Then $B \neq A$.

  By analogy, he is arguing:
  *   $H$ = Horse (Substrate/Shape Universal)
  *   $WH$ = White-Horse (Compound Universal)
  *   Since $WH$ contains a determination (*ding*) that $H$ lacks, $WH$ is not $H$.

  **So, is it rigid designation?**
  Not in the Kripkean sense. It's closer to a **Fregean distinction between concept and object**, or perhaps a Russellian distinction between a propositional function and a value. But in Warring States terms, it is a claim about *shi* (actualization/determination). *Ding* transforms a quality from a potentiality (can be anywhere) to an actuality (is *here*, on *this* horse).

  **Pedagogical Hook:**
  Tell your students: The earlier argument says "Look at the horses in the field (some are yellow)." This argument says "Look at the concepts in the mind (one is abstract, one is concrete)." *Ding* marks the transition from the **attribute** to the **qualified object**.

  ### 2. Does this Escape the Identity/Membership Equivocation?

  This is the trickier question. The standard critique is that Gongsun Long proves "White Horse $\neq$ Horse" (non-identity of concepts) but implies "No White Horse is a Horse" (exclusion of members).

  **Does this passage fix it?**
  It strengthens the **non-identity** claim but does not fully escape the rhetorical ambiguity of *fei*. However, it shifts the ground from *coextensivity* to *criteria of application*.

  **The "Exclusion" (Qu/Qu 去取) Argument:**
  *   **Horse:** "No selection/rejection regarding color" (*wu qu qu yu se*). The criteria for applying the name *ma* are neutral regarding color.
  *   **White Horse:** "Has selection/rejection regarding color" (*you qu qu yu se*). The criteria for applying *baima* require a specific color.
  *   **Conclusion:** "What does not exclude is not what does exclude" (*wu qu zhe fei you qu ye*).

  **Logical Formalization:**
  Let $C_1$ be the concept "Horse."
  Let $C_2$ be the concept "White Horse."
  $C_1$ has condition set $\{Shape\}$.
  $C_2$ has condition set $\{Shape, Color\}$.
  Since Condition Set 1 $\neq$ Condition Set 2, Concept 1 $\neq$ Concept 2.

  **The Verdict on Equivocation:**
  This passage **dodges the membership trap** by focusing on the *definition* of the terms rather than the *objects* they pick out.
  *   If I say "A bachelor is not a man," I am wrong (membership).
  *   If I say "The concept 'Bachelor' is not the concept 'Man'," I am right (non-identity).

  Gongsun Long is using the *ding* and *qu/qu* arguments to prove the latter (Concept Non-Identity). He knows the audience will hear the former (Object Exclusion).
  *   **Does he believe the former?** Probably not. He likely knows a white horse is a kind of horse.
  *   **What is he doing?** He is forcing a distinction between the **name** (*ming*) and the **object** (*shi*). He is arguing that because the *naming criteria* differ, the *names* are not interchangeable, even if the objects overlap.

  **So, does it establish non-identity?**
  Yes, it establishes the non-identity of the **names/concepts**.
  **Does it establish that a white horse isn't a horse?**
  No, but that's not what the logic of *this specific passage* proves. The logic here proves that the *criteria for 'white horse'* are not identical to the *criteria for 'horse'*.

  ### 3. Synthesizing for the Seminar

  If I were walking into your seminar, here is how I would frame the "logical bones" to move past the SEP-level analysis:

  1.  **Shift from Extension to Intension:** The first half of the dialogue is extensional (counting horses). This passage is intensional (analyzing the criteria of the names). *Ding* is the marker of intensional complexity.
  2.  **The Metaphysics of Compounds:** Gongsun Long is a realist about universals. "White" exists. "Horse" exists. But "White-Horse" is a *third* entity, a compound universal. Just as a molecule is not identical to an atom, the compound name is not identical to the component name.
  3.  **The "Fei" Strategy:** Gongsun Long is not necessarily confused about *fei*. He is exploiting the tension between **ontological dependence** (a white horse depends on being a horse) and **conceptual distinctness** (the concept 'white horse' adds information not present in 'horse').
      *   The argument proves: Concept($WH$) $\neq$ Concept($H$).
      *   The paradox relies on the audience hearing: Object($WH$) $\notin$ Object($H$).
      *   This passage justifies the first claim so rigorously that it dares the audience to deny the second.

  **Suggested Comparison for Grad Students:**
  If they know analytic philosophy, compare this to **Frege's "Concept and Object"** or **Russell's theory of descriptions**.
  *   "The Horse" = $\exists x (Horse(x))$
  *   "The White Horse" = $\exists x (Horse(x) \land White(x))$
  *   The description is not identical, even if the referent is the same.
  *   *Caveat:* Gongsun Long isn't doing predicate logic, but he is spotting the difference between a simple predicate and a conjunctive predicate.

  **Final thought on *Ding*:**
  The phrase *Ding suo bai zhe, fei bai ye* ("What is fixed-white is not White") is the key. It implies that **instantiation destroys purity**. Once "White" is tied to "Horse," it is no longer the universal "White." By extension, once "Horse" is tied to "White," it is no longer the universal "Horse." It is a new thing.
  This saves him from the "membership" error. He isn't saying the animal isn't a horse. He's saying the *named entity* "White Horse" is not the *named entity* "Horse."

  This passage is Gongsun Long at his most sophisticated. He isn't just playing word games; he is arguing for a metaphysics where compounds are distinct from their constituents. That is why your colleagues were stuck—it requires committing to a specific ontology of names to make the logic hold.
