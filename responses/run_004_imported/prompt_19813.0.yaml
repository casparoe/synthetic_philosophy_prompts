      *   *Gauthier's Constrained Maximization (CM):* Response to Prisoner's Dilemma. Straightforward Maximizers (SM) defect. CMs cooperate *if* they expect others to cooperate. Key mechanism: "Translucency" (agents can detect dispositions). CM is rational because it grants access to cooperative surplus that SMs miss.
