answer: |-
  This is a fantastic question to wrestle with in a reading group. Your group member isn't wrong to smell a family resemblance—both Parfit and Gauthier are grappling with the problem of **dynamic inconsistency** (or time-inconsistency) in rational choice theory. They both identify that an agent who maximizes utility at every individual moment of decision (act-utilitarianism or straightforward maximization) will end up worse off than an agent who restricts their future choices.

  However, asserting they are "the same thing" glosses over a crucial divergence in *what* they are trying to save. Parfit is using the Hitchhiker case to break the Self-Interest Theory of rationality; Gauthier is using Constrained Maximization (CM) to save a Hobbesian version of it.

  Here is the breakdown of the relationship, the structural differences, and an evaluation of which account holds more water.

  ### 1. The Core Overlap: The "Dispositional Solution"
  Both philosophers agree on the diagnosis of the disease: **Straightforward Maximization is self-defeating.**

  *   **In Parfit's Hitchhiker:** If you are a pure Self-Interest Theorist (S), once you are safely in town, paying the $100 is irrational. It reduces your wealth and provides no benefit (the ride is already had). Knowing this, the driver won't pick you up. You die.
  *   **In Gauthier's Prisoner's Dilemma:** If you are a Straightforward Maximizer (SM), you defect. If everyone does this, everyone starves. If you could commit to cooperate, you'd thrive, but a rational SM cannot commit because they will renege when the time comes.

  Both propose the same cure: **Rationality must apply to dispositions (or character traits), not just acts.** It is rational to *become* the kind of person who pays the money/cooperates, even if *paying/cooperating* is not the utility-maximizing act at the moment of execution.

  ### 2. Structural Divergences
  While the shape of the solution is similar, the architectural load-bearing walls are different.

  #### A. The Target of the Argument
  *   **Parfit (The Destroyer):** Parfit's goal in *Reasons and Persons* is largely critical. He uses the Hitchhiker case to show that the **Self-Interest Theory (S)** is "indirectly self-defeating." If S tells you to adopt a disposition that leads you to act against S's prescriptions later, S is undermining itself. Parfit is comfortable saying, "From the perspective of Self-Interest, paying is irrational. Therefore, Self-Interest Theory is flawed." He is willing to sacrifice the coherence of self-interest to save our moral intuitions.
  *   **Gauthier (The Architect):** Gauthier's goal in *Morals by Agreement* is constructive. He wants to derive morality *from* rational self-interest. He cannot afford to admit that keeping the agreement is "irrational" by self-interest standards. He must argue that Constrained Maximization **is** maximizing. He shifts the locus of maximization from *acts* to *dispositions*. For Gauthier, paying the $100 *is* rational, because it is the output of a disposition that was selected for its maximizing properties.

  #### B. The Role of Translucency and Population
  This is where your question about "shrunk down" cases hits the mark.
  *   **Parfit's Case:** The Hitchhiker case works even in a **single-shot interaction**, provided the driver has *some* access to your psychology. Parfit doesn't need a population of agents evolving strategies. He only needs the driver to be convinced *now*. The "rationality" is assessed from the perspective of the agent's life as a whole.
  *   **Gauthier's Case:** CM relies heavily on **translucency within a population**. For CM to be a stable strategy, agents must be able to detect each other's dispositions with sufficient accuracy to avoid being exploited by "Free Riders" (who pretend to be CMs but defect). Gauthier needs a game-theoretic equilibrium where CMs do better than SMs *on average* across many interactions. If translucency is too low, CMs get exploited and die out.

  So, Parfit's case is not just a "shrunk down" Gauthier; it is a **normative thought experiment** vs. a **stability condition**. Parfit asks, "What does rationality require of me?" Gauthier asks, "What strategy survives in a market of agents?"

  #### C. The Binding Mechanism
  *   **Parfit:** The "binding" is metaphysical or psychological. You literally change your psychology so that the future self *cannot* or *will not* defect. Parfit acknowledges this looks like "rational irrationality" because the future self acts against its immediate interest.
  *   **Gauthier:** The "binding" is deliberative. Gauthier argues that when you deliberate, you deliberate on the choice of *disposition*. Once the disposition is chosen, the act flows from it. He tries to dissolve the tension: the future self isn't "bound" against its will; the future self is simply executing the plan that constitutes its rationality.

  ### 3. Which Account is More Convincing?

  If the question is **"Which gives a more convincing account of why it can be rational to bind your future self?"**, I believe **Parfit** offers the more philosophically honest and robust account, though Gauthier offers the more ambitious one.

  Here is why Parfit wins on this specific metric:

  **1. Honesty about the Tension**
  Gauthier tries to have his cake and eat it too. He wants to say that the agent is still a "maximizer" even when they are doing the non-maximizing act. This requires significant semantic gymnastics regarding "utility." He has to argue that the utility of *having* the disposition outweighs the loss of the *act*, but this gets messy when the agent is in the moment of payment.
  Parfit is more honest. He admits that if you hold to a strict Act-Self-Interest view, paying the money *is* irrational. He uses this to show that Act-Self-Interest is the problem. If you want to be rational, you must adopt a theory (like Common-Sense Morality) that validates the payment. Parfit acknowledges that binding your future self requires stepping *outside* the logic of immediate self-interest.

  **2. The Problem of "Fake" Dispositions**
  Gauthier's model is vulnerable to the "free rider" problem. If I can *simulate* the disposition of a Constrained Maximizer well enough to trick the driver (or other agents), but retain the disposition of a Straightforward Maximizer internally, I get the ride *and* keep the $100. Gauthier relies on "translucency" to prevent this. But empirically, humans are opaque. We lie.
  Parfit's Hitchhiker case bypasses this. It doesn't matter if the disposition is "real" or "simulated" in an evolutionary sense; it matters that the driver *believes* it. Parfit focuses on the **normative requirement**: To be the kind of person who gets saved, you must actually be the kind of person who pays. You cannot just simulate it, because if you know you are simulating it, you know you will defect, and the driver (if rational) knows you know. Parfit's account handles the reflexive nature of belief better.

  **3. The Nature of the "Bind"**
  Gauthier treats the binding of the future self as a strategic calculation. But a strategic calculation can always be recalculated. If, in town, the cost of paying rises to $1,000,000, the Gauthierian agent has to ask: "Does my disposition still hold?" This reintroduces the instability.
  Parfit accepts that the binding must be **non-strategic** at the moment of action. To work, the commitment must be opaque to the future self's calculation. Parfit is willing to call this "irrational" from the narrow self-interest perspective to preserve the broader rationality of well-being. This aligns better with how pre-commitment actually works (e.g., Ulysses tying himself to the mast). Ulysses doesn't calculate utility while tied; he removes the capacity to calculate.

  ### The Verdict
  Your group member is right that they are cut from the same cloth: both recognize that **instrumental rationality is self-defeating without pre-commitment.**

  However, **Parfit provides the more convincing account.** Gauthier tries to solve the problem within the constraints of Hobbesian egoism, which forces him to stretch the definition of "maximization" until it threatens to snap. Parfit recognizes that the Hitchhiker case is a *reductio ad absurdum* of narrow self-interest.

  Parfit convinces us that binding the future self is rational not because it maximizes utility in a clever game-theoretic sense, but because **a theory of rationality that tells you to die in the desert is a bad theory of rationality.** He shifts the burden from the agent (who must somehow make defection irrational) to the theory (which must be revised to accommodate the survival of the agent). That is a deeper, more stable foundation for why we should bind our future selves.
