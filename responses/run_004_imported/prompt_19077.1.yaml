      *   Let's make it concrete. "Recommendation: Vote against filing the appeal. Authorize the attorney to accept any settlement offer of $5,000 or more to close the case immediately. If no settlement is reached by [Date], terminate legal action."

      *   *Self-Correction on Reputation:* I need to explicitly validate the "easy target" fear. I will argue that fighting a 5-day trial *already* proved we aren't an easy target. Stopping now proves we are financially disciplined.

