answer: |-
  Good afternoon. For those who don't know me, I'm [Your Name], and I'm [Father's Name]'s son/daughter.

  Standing here is harder than I expected. Mostly because Dad spent about fifty years wiring his brain to be very specific about what happens at the end of a life. He was an electrician by trade, and a rationalist by choice. He believed that when the power goes out, the light goes out. He was the treasurer of the local Humanist group for as long as I can remember, and he loved nothing more than holding court after a couple of drinks to talk about the philosopher A. J. Ayer.

  You might not know Ayer, but Dad loved his story. In 1988, Ayer choked on a piece of smoked salmon in a hospital. His heart stopped for four minutes. He came back and wrote a famous article about seeing a divine red light and celestial ministers. But Dad's favorite part wasn't the vision. It was the follow-up piece Ayer wrote a few weeks later. In it, Ayer admitted he hadn't changed his mind about God existing, but he had changed his mind about how rude he was allowed to be to people who believed in Him. Dad used to say that second article was the most honest thing he'd ever read. He said if he ever had a brush with the other side, he hoped he'd have the nerve to correct himself in public the same way.

  Two winters ago, Dad got his chance. On an operating table, his heart stopped. Long enough that the medical team had to bring him back. When he woke up, he told my brother he'd "seen something," and it had shaken him. Ten days later, he wrote me a letter. He said he wasn't converting. He didn't suddenly believe in heaven. But he admitted that the experience had knocked the arrogance out of him. He realized he wasn't entitled to sneer at people who found comfort in faith. He told me that pretending nothing happened would be a lie, but pretending he'd found God would be a bigger one.

  He left strict instructions for today. He didn't want to be described as "at peace" or "watching over us." He felt those phrases were dishonest. But he also didn't want his experience dismissed. He wanted us to know that he was brave enough to change his attitude, even if he didn't change his facts.

  That was the kind of man he was. He fixed things. If a circuit was dead, he found the break. If an argument was sloppy, he tightened it up. He worked with his hands and his head, and he valued truth over comfort. I know that leaves some of us, particularly those who loved him with a religious heart, without the specific words of solace you might hope for today. I know how much you loved him, and I know how much he loved you. He didn't need an afterlife to value that love; he lived it every day.

  Dad wasn't a perfect man. He could be stubborn. He could be pedantic. But he was fiercely honest. He taught me that integrity isn't about sticking to your guns when you're wrong; it's about having the courage to admit when the light has changed.

  So, we aren't going to say he's in a better place. We aren't going to say he's gone to a better world. We are going to say that he was here, in this world, and he made it work better for the rest of us. He fixed the lights. He kept the power on. And now, the job is done.

  He asked for honesty, so I'll give him that. We miss him. We will argue about him. We will remember the smoked salmon stories, the late-night debates, and the quiet kindness he showed when he realized he didn't have all the answers.

  Thank you for coming to honor him. Let's go have a drink, and try to be a little less inflexible than he was, and a little more honest, just as he asked.
