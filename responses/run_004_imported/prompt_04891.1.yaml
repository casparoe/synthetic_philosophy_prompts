answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain streaks the window. Alex (Two-Dimensional Semanticist) is stirring a tea. Blake (Type-B Materialist) is black on coffee.*

  **Alex:** You're retreating into the shadows, Blake. The Zombie Argument is out in the open. $P$ and not $Q$. The conjunction of all physical truths and the absence of consciousness. You admit it's conceivable.

  **Blake:** I admit it's *epistemically* conceivable. I can coherently imagine a world physically identical to ours where everyone is a dark shell. No lights on inside. That doesn't mean such a world is *metaphysically* possible.

  **Alex:** That's the crux, isn't it? In my framework, primary intensions track epistemic possibility. If $P \& \sim Q$ is primarily possible—if it's coherent as a scenario considered as actual—then it picks out a possible world. If physicalism is true, $P$ should entail $Q$ a priori. If it doesn't, physicalism is false. You're trying to sever the link between the epistemic and the metaphysical.

  **Blake:** I'm not severing the link globally, Alex. I'm localizing it. Look at the Kripkean identities. "Heat is molecular motion." That's necessary a posteriori. But we can conceive of heat without molecular motion. We do that because the concept "heat" picks out its referent via a contingent mode of presentation—the sensation of warmth.

  **Alex:** Exactly! That's a *weak* necessity. The primary intension of "heat" is "whatever causes sensation S." In a world where demons cause sensation S, heat is demonic. The identity holds only because we fix the actual world. But consciousness isn't like that. The primary intension of "pain" isn't "whatever causes avoidance behavior." It's *this* feeling. The property is presented directly.

  **Blake:** So you claim phenomenal concepts are transparent. You think that by having the concept, you know the essence of the property.

  **Alex:** I think the concept *is* the experience attending to itself. There's no gap between the mode of presentation and the property presented. If I conceive of pain, I am instantiating the very property in question. So if I can conceive of $P$ without pain, I'm conceiving of $P$ without that property. If physicalism says pain *is* a physical property, then I should be conceiving of $P$ without that physical property. But I'm not. I'm conceiving of $P$ fully specified.

  **Blake:** Here's where you beg the question. You assume that because the *concept* is direct, the *property* it picks out can't be physical. I'm saying the concept is a distinct physical state—a recognitional state—that refers to a neural state. The gap is between the conceptual vehicle and the referent, not between two ontological substances.

  **Alex:** That's the "Phenomenal Concept Strategy." But to make it work, you need what Chalmers calls a "strong necessity." You need an identity statement that is necessary, but *not* explainable by the contingent primary intensions of the terms. "Water = H2O" is explainable: water is the watery stuff, H2O is the stuff that is actually watery. But "Pain = C-fiber firing" has no such explanation. You're positing a brute modal connection.

  **Blake:** Why is that brute? Why can't there be necessary truths that aren't a priori derivable?

  **Alex:** Because it makes the necessity magical. In every other case of necessary a posteriori truth, we can tell a story about how the reference is fixed contingently. If you say psychophysical identities are strong necessities, you're saying they are unique in the universe. There are no other examples. Isn't that suspicious? It looks like an ad hoc dodge to save physicalism from the zombie intuition.

  **Blake:** "Ad hoc" implies I invented it just to save the theory. But the uniqueness of phenomenal concepts is independently motivated. They are indexical, recognitional, and deployed only from the first-person perspective. You don't have a concept of "electron" that you can only deploy when you *are* an electron.

  **Alex:** But uniqueness doesn't grant magical modal powers. If the concept is physical—say, a neural template matching a neural state—then the relation between the concept and the state is a physical relation. Physical relations are contingent. So the connection between the concept "pain" and the state C-fiber firing should be contingent. If you say it's necessary, you're saying the concept *essentially* refers to that state. But if the concept is a distinct physical state, how does it lock onto the target necessarily without a descriptive bridge?

  **Blake:** It locks on causally and functionally, but once the reference is fixed, it's rigid. The problem is you're demanding a descriptive bridge. You want an a priori entailment. I'm saying the entailment is a posteriori. The world is physical. Consciousness is physical. Our concepts just don't reveal that identity from the armchair.

  **Alex:** But if the world is entirely physical, and our concepts are entirely physical, why is the deduction blocked? If I know all the physical facts about the brain, and I know all the physical facts about the concept "pain," I should be able to deduce the identity. The fact that I can't suggests there's a fact left out—the phenomenal fact.

  **Blake:** You're assuming "knowing all the physical facts" includes knowing what it's like to instantiate those concepts. To deduce the identity, you need to possess the phenomenal concept. You can't deduce "Water = H2O" if you don't have the concept "water." Similarly, you can't deduce "Pain = C-fibers" without the phenomenal concept. The gap is in the *possession conditions* of the concepts, not the world.

  **Alex:** That's the "conceptual dualism" move. But it collapses into ontological dualism if you press the modal status. If I can conceive of the physical state without the phenomenal state, and the concepts are distinct, then the properties must be distinct *unless* you posit a strong necessity. But if you posit a strong necessity, you violate the principle that modal structure supervenes on conceptual structure. You're asking us to accept a modal brute fact.

  **Blake:** I'm asking you to accept that our cognitive architecture is limited. We have two systems for representing the same state. One is third-person, structural-dynamic. One is first-person, phenomenal. They don't translate into each other a priori. That's a fact about human cognition, not a ghost in the machine. Is it really more parsimonious to add a new fundamental ontological category—consciousness as non-physical—just to preserve a principle about conceivability?

  **Alex:** It's not just about preserving a principle. It's about explanation. If zombies are conceivable, they explain *why* the physical facts don't exhaust the facts. If you say they're impossible but conceivable, you have no explanation for the conceivability other than "our brains are weird."

  **Blake:** "Our brains are weird" is a scientific hypothesis! "Our brains have distinct conceptual systems that aren't a priori intertranslatable." That's plausible. Your hypothesis is "There are non-physical properties that don't interact with the physical world but somehow correlate perfectly with it." That's the bigger stretch.

  **Alex:** They interact! They cause behavior. That's the problem. If the phenomenal property is distinct from the physical, and the physical is causally closed, the phenomenal is epiphenomenal.

  **Blake:** Exactly! So you hate epiphenomenalism. I hate brute strong necessities. Which is the lesser evil?

  **Alex:** I don't accept epiphenomenalism. I think the phenomenal property *is* the cause, which means the physical description is incomplete. But let's go back to the strong necessity. If you admit it's a strong necessity, you admit it's not derivable from the nature of the concepts alone. That means the primary intension of "pain" doesn't pick out the physical property. So what does it pick out?

  **Blake:** It picks out the physical property, but not via a description that entails the physical nature. It picks it out directly. Like pointing. "This."

  **Alex:** But if "this" picks out a physical property necessarily, then "This is not physical" should be inconceivable. But it's not. I can point to my pain and conceive of it being non-physical.

  **Blake:** You can conceive of the *words* "this is non-physical." You can't conceive of the *fact*. You're confusing epistemic space with metaphysical space.

  **Alex:** And you're collapsing them to save materialism. Look, if there were *any* other case of a strong necessity, I'd listen. But there aren't. Water, heat, lightning, genes—all weak necessities. All explainable by contingent reference fixing. Consciousness is the only candidate for a strong necessity. That suggests the data point is falsifying the theory, not that the data point requires a unique modal category.

  **Blake:** Or it suggests consciousness is the only case where the mode of presentation is identical to the property itself, which creates the illusion of a gap. The transparency you love is the very thing that generates the confusion. Because the concept feels like the property, you think you know everything about the property. But you only know it under one mode of presentation.

  **Alex:** If the concept is identical to the property, then the concept is phenomenal. If the concept is physical, the property is physical. If they are identical, then knowing the concept is knowing the property. If I know the concept and don't know it's physical, then the property isn't physical.

  **Blake:** You're running in circles. Knowing the concept *phenomenally* isn't knowing the concept *physically*. It's the same state, known in two ways. I can know the Morning Star without knowing it's the Evening Star.

  **Alex:** But I can discover the Morning Star is the Evening Star by looking at the sky. I can't look at my C-fibers and see the pain. The verification conditions are disjoint.

  **Blake:** Because the access routes are different. One is introspection, one is MRI.

  **Alex:** And if the access routes are disjoint, and the concepts don't entail each other, and there's no a priori bridge... then for all intents and purposes, they are distinct properties. You're defining "property" in a way that allows two things to be identical even if they share no essential characteristics discoverable by reason. That empties "identity" of meaning.

  **Blake:** It empties "a priori" of omnipotence. You want reason to dictate ontology. I think ontology dictates ontology, and reason just maps it. Sometimes the map has blank spots. The zombie intuition is a blank spot, not a window into another realm.

  **Alex:** A blank spot that looks exactly like a dualist world.

  **Blake:** A blank spot that looks exactly like a brain with two languages.

  **Alex:** *Sighs.* We're at the bedrock. You think my 2D framework assumes what it's trying to prove—that primary intensions reveal metaphysical possibility.

  **Blake:** And you think my Type-B move assumes what it's trying to prove—that physicalism is true regardless of the explanatory gap.

  **Alex:** I think the conceivability of zombies is a datum. Any theory that says they are metaphysically impossible has to explain away a very robust intuition. "Strong necessity" sounds like a label for "we don't know how to explain this, but please stay physicalist."

  **Blake:** And "Non-physical property" sounds like a label for "we can't explain how this interacts, but please stay dualist."

  *Alex takes a sip of tea. Blake finishes the coffee.*

  **Alex:** I suppose the only way out is if you can find another strong necessity. A non-phenomenal one.

  **Blake:** I'm working on it. Maybe mathematical truths? Or logical constants?

  **Alex:** Don't start. If you say logic is a strong necessity, I'll throw this tea at you. And in that world, the tea hitting your shirt will be a zombie event.

  **Blake:** *Smiles.* I'd feel it. Necessarily.

  **Alex:** That's what you say.
