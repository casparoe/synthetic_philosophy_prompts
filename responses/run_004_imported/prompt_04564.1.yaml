  Here is the ranking from least to most epistemically demanding, tailored for an epistemic game theory context.

  **rationalizability**
  This is the baseline concept requiring only Common Knowledge of Rationality (CKR) without imposing a common prior or constraints on belief correlations.

  **iterated elimination of strictly dominated strategies**
  While justified by CKR, this procedural concept often implicitly assumes independent conjectures in $n$-player games or finiteness to ensure the algorithm aligns with rationalizability.

  **correlated equilibrium**
  This concept adds the requirement of a Common Prior to align beliefs on a correlation device, but unlike Nash, it does not require players to know each other's specific conjectures.

  **Nash equilibrium**
  Justified by Aumann and Brandenburger (1995), this requires CKR and a Common Prior plus the strong condition that players mutually know each other's specific conjectures or strategies.

  **iterated elimination of weakly dominated strategies**
  Justifying this requires Common Knowledge of Admissibility, which demands lexicographic belief systems and full-support assumptions that are often inconsistent with standard common priors (Brandenburger-Friedenberg-Keisler, 2008).

