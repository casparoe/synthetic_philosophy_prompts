answer: |-
  Here is an explanation of the intuition behind Peter van Inwagen's argument, designed for a general reader.

  ### The Setup: The Special Composition Question
  To understand the argument, we first need the puzzle. The "Special Composition Question" asks: **When do some things add up to make a new thing?**

  *   **The Common-Sense (Moderate) View:** Particles compose a table when they are arranged in a certain way (fastened, functioning together). But particles scattered across a room do not compose a table.
  *   **The Problem:** This view seems to require a cutoff point. If you slowly glue a table leg to a tabletop, at exactly what millisecond does the "table" come into existence? If you say "when they touch," what about a loose screw? If you say "when they are fastened," how tight?

  It feels like there must be a **gray area**—a borderline case where it's neither definitely true nor definitely false that the parts make a whole. This is the "moderate" view.

  ### Van Inwagen's Move: From Vague Composition to Vague Existence
  Peter van Inwagen argued that this moderate view leads to an absurdity. His "Argument from Vagueness" claims that if composition is vague, then **existence itself must be vague.**

  Here is the gut-level intuition behind that move, broken down into three steps.

  #### 1. Composition is about Counting
  To say that some parts compose a whole is simply to say that there is **one more object** in the universe than there was before.
  *   **Scenario A:** You have some legs and a top. They do *not* compose a table. Count: 4 objects (3 legs, 1 top).
  *   **Scenario B:** You have some legs and a top. They *do* compose a table. Count: 5 objects (3 legs, 1 top, 1 table).

  #### 2. The Binary Nature of Reality
  Van Inwagen invites us to think about what it means for something to *exist*. Intuitively, existence is an on/off switch. A thing is either real, or it is not. There is no such thing as "sort of real" or "halfway existing."
  *   Think of a light switch. It can be on or off.
  *   Think of a headcount. If you ask, "Is John in the room?" the answer must be Yes or No. It cannot be "Well, it's indeterminate whether John is in the room."

  #### 3. The Collision
  If you combine these two ideas, you get the problem. If the moderate view is right, there is a borderline case where it is vague whether the legs and top compose a table.
  *   If it is vague whether they compose a table, it is vague whether the table **exists**.
  *   If it is vague whether the table exists, it is vague **how many objects are in the room.**

  Van Inwagen's intuition is that **reality cannot be vague about how many things it contains.** The universe doesn't shrug. It doesn't say, "I'm not sure if I have 50 objects or 51 objects right now." Therefore, the premise that led us there (that composition is vague) must be false.

  ### Why is "Vague Existence" Worse than "Vague Heaps"?
  This is the crux of your question. We accept vagueness all the time. We know the "Sorites Paradox": if you remove one grain from a heap of sand, it's still a heap. Keep going, and eventually, it's not. There is a borderline case where it's vague whether it's a heap.

  Why do philosophers tolerate vague *heaps* but not vague *existence*? The distinction lies in **where the vagueness is located.**

  #### 1. Semantic Vagueness (The Heap)
  When we say it's vague whether a pile of sand is a "heap," most philosophers argue this is a problem with **our words**, not the world.
  *   The sand grains are all definitely there.
  *   The physical arrangement is definite.
  *   The vagueness is in the *concept* "heap." We haven't drawn a sharp line in our dictionary for how many grains make a heap.
  *   **Crucially:** No new object is popping into or out of existence. We are just arguing over what label to slap on a collection of particles that definitely exist.

  #### 2. Ontological Vagueness (The Table)
  Van Inwagen's argument targets **ontological vagueness** (vagueness in reality itself).
  *   If the moderate view is true, the vagueness isn't just about the word "table." It is about whether a *new entity* has joined the furniture of the universe.
  *   If existence is vague, then the **boundaries of reality** are fuzzy.
  *   To accept vague existence is to accept that the universe itself can be indeterminate about its own inventory.

  **The Gut Check:**
  Imagine you are God, creating the universe. You place the particles. Do you have to decide exactly whether they form a table?
  *   If you say "I'll leave it fuzzy," van Inwagen asks: "What does that look like?"
  *   Does the table glow dimly? Is it transparent? No.
  *   The only way for the table to be "vaguely existing" is for the fact of its existence to be neither true nor false.
  *   But facts about reality are supposed to be true or false. For the number of objects to be "neither 50 nor 51" implies a gap in reality itself, which seems metaphysically impossible.

  ### The Consequence: The Forced Choice
  Because "vague existence" is viewed as intolerable (unlike vague language), van Inwagen forces metaphysicians to abandon the moderate, common-sense view. You must choose a view where existence is precise:

  1.  **Mereological Nihilism:** Composition *never* happens. There are no tables, only particles arranged table-wise. (Precise: The count is always just the particles.)
  2.  **Mereological Universalism:** Composition *always* happens. Any two objects, no matter how scattered, compose a further object. (Precise: The count is mathematically determined by combinations.)

  Both extremes avoid the "vague existence" problem because they provide a sharp, definite answer to "How many objects are there?" in every possible scenario.

  ### Summary
  The gut-level intuition is that **counting must yield a number.**
  *   **Ordinary vagueness** (heaps, baldness) is admitted because it's just about how we *describe* things that definitely exist.
  *   **Vague existence** is rejected because it implies the *things themselves* are indeterminate. It suggests reality hasn't decided if an object is there or not. Van Inwagen argues reality doesn't hedge; therefore, composition must be sharp, even if that contradicts common sense.
