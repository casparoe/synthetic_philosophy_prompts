answer: |-
  This is a fantastic debate, and honestly, it's rare to see Aquinas applied to modern covert ops with this level of specificity. You and Priya are both tapping into real tensions in the text, but Priya is reading the structural constraints more accurately than you are.

  Here is the breakdown of Aquinas's actual position, followed by the verdict on your specific drone-strike scenario.

  ### 1. Aquinas's Framework: The Two Distinctions

  To understand where Aquinas lands, you have to look at two specific texts: *De Regno* (On Kingship) and the *Summa Theologiae* (specifically II-II, Q. 42 on Sedition and Q. 64 on Killing). His position rests on two critical distinctions.

  **A. The Usurper vs. The Legitimate Tyrant**
  Aquinas distinguishes between a ruler who never had a right to rule and one who did but lost his moral way.
  *   **The Usurper:** This is someone who seizes power by force without any legal or customary title. Aquinas is more permissive here. Because the usurper has no true authority, they are essentially a private aggressor holding the state hostage. Removing them is closer to self-defense than political execution.
  *   **The Legitimate Tyrant:** This is a ruler who was properly installed (by election, inheritance, or consent) but subsequently governs for private gain rather than the common good. Aquinas is extremely restrictive here. Because this ruler *does* hold public authority, attacking them attacks the office itself, which risks collapsing the political order into anarchy.

  **B. Private vs. Public Authority**
  This is the hurdle Priya nailed. Even if the ruler is a monstrous usurper, Aquinas generally forbids **private individuals** from killing them.
  *   **Why?** In *Summa Theologiae* II-II, Q. 42, A. 2, he argues that if private citizens take it upon themselves to kill rulers, it sets a precedent that leads to sedition. You might kill a bad tyrant, but you encourage the killing of good rulers later, or you replace a bad tyrant with a worse one amidst civil chaos.
  *   **The Remedy:** The removal must be undertaken by **public authority**.
      *   If the ruler was elected by the community, the community (or its representatives) can depose him.
      *   If the ruler has a superior (e.g., a King answers to an Emperor), the superior has the jurisdiction to intervene.
      *   Crucially, the authority must be *constituted* to judge that specific political community. It cannot be random vigilantes.

  ### 2. The Foreign Intelligence Problem

  Now we apply this to your scenario: A foreign state's intelligence service (State A) covertly kills a dictator (State B) with zero internal involvement.

  **The Jurisdictional Mismatch**
  For Aquinas, political authority is not universal; it is particular. The King of France is the "public authority" for France. He is *not* the public authority for England.
  *   In Aquinas's hierarchy, a foreign king is a **peer**, not a **superior**.
  *   For a foreign power to act as "public authority" over another state, there must be a recognized superior jurisdiction (like the Holy Roman Emperor over a vassal king, or arguably the Pope in spiritual matters).
  *   A modern foreign intelligence agency is an instrument of a *foreign* sovereign. It has no jurisdiction within the target state. Therefore, it cannot act as the "public authority" required to licitly depose a ruler.

  **The "Usurper" Loophole?**
  You might argue: *"But what if the dictator is a usurper? Doesn't that make him fair game?"*
  Even if the dictator is a usurper, Aquinas does not grant a *foreign* power the right to execute judgment unilaterally. The right to remove a usurper belongs to the community being usurped or a recognized superior authority. A foreign state killing a usurper is not restoring order; it is an act of aggression by one sovereignty against another.

  **Covert vs. Public**
  Aquinas insists on *public* authority for a reason: accountability and order. A covert drone strike is the definition of private (or secret) violence. It bypasses the communal discernment process Aquinas requires to ensure the removal actually serves the *common good* and doesn't just serve the interests of the killer.

  ### 3. The Verdict

  Here is the ruling you can bring back to Priya.

  **Priya wins on the question of Tyrannicide.**
  Aquinas would **not** classify a foreign covert drone strike as licit tyrannicide. It fails the "public authority" requirement categorically.
  *   **Reasoning:** A foreign state is not the "public authority" of the tyrant's nation. It is an external agent. For Aquinas, tyrannicide is an *internal* remedial mechanism (or one exercised by a constitutional superior), not an *external* foreign policy tool.
  *   **The Category Error:** You are correct that this is a category error. In Aquinas's framework, this act is not "tyrannicide" at all. It is an act of **war** (or assassination, which he generally condemns as treacherous).

  **However, you might pivot to Just War Theory.**
  While Aquinas would reject this as *tyrannicide*, he might evaluate it under *Just War* theory (*Summa* II-II, Q. 40).
  *   **Could it be a Just War?** Only if the foreign state has a just cause (e.g., the tyrant is actively attacking them or grossly violating natural law in a way that demands intervention) and proper authority (the foreign sovereign declares it).
  *   **The Covert Problem:** But here, you hit a wall again. Aquinas values openness and declaration in war. Covert assassination via drone or poison often violates the norms of *how* war is conducted (treachery vs. open combat).

  ### The Bottom Line for Your Debate

  Tell Priya she is right: **Aquinas's framework blocks foreign covert assassination as "tyrannicide."**

  The "public authority" clause is not just a suggestion; it is the mechanism that prevents political murder from becoming mere gang violence. A foreign intelligence service, operating secretly without the mandate of the tyrannized people or a superior international tribunal, counts as a **private aggressor** in the eyes of that nation's political order, regardless of how evil the target is.

  **Your takeaway:** You can tell Priya, "You win on Aquinas. He doesn't license foreign black-ops as tyrannicide. He reserves that judgment for the community itself or a constitutional superior. But I'm going to keep arguing that if we shift from *tyrannicide* to *Just War*, the debate opens up again."

  That keeps the peace, credits her reading, but keeps the philosophical door open for the next round.
