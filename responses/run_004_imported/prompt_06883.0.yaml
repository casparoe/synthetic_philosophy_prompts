answer: |-
  **MEMORANDUM**

  **TO:** The Full Council
  **FROM:** Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Reform of Presidential Election Method

  **1. Context and Problem Statement**
  As you know, the Governance Committee was charged with reviewing our society's method for electing the President following two elections in the last decade where the winner was ranked last or second-to-last by a majority of the voting membership. Under our current plurality system, when three or more candidates run, "like-minded" candidates often split the sympathetic vote. This allows a polarizing candidate with a solid minority base to win with a mere 30–35% of the vote. This outcome undermines the legitimacy of the office and contradicts the collective will of the membership.

  **2. Addressing the Theoretical Objection**
  During our deliberations, a valuable objection was raised by the Chair of the Statistics Section. Citing the Gibbard–Satterthwaite theorem, it was argued that because *all* non-dictatorial voting systems with three or more candidates are theoretically manipulable, reforming the system adds complexity without securing immunity from tactical voting.

  As a committee, we have engaged with this objection on its merits. The Statistics Chair is theoretically correct: no system is perfectly strategy-proof. However, the theorem establishes the *existence* of manipulability, not the *equivalence* of systems. In practice, the difficulty, risk, and information requirements for successful manipulation vary drastically between methods.

  *   **Plurality Voting (Current):** Highly manipulable with zero information. Voters need only know that their favorite candidate is unpopular to feel compelled to vote strategically ("lesser of two evils").
  *   **Ranked Systems:** Manipulability exists but requires complex knowledge of how other voters will rank candidates to execute a successful "burial" strategy without backfiring.
  *   **Approval Voting (Recommended):** While not immune to strategy, the "honest" strategy (approve all candidates you find acceptable) is robust. Manipulation requires precise knowledge of the polling threshold to successfully withhold approval from a viable candidate without causing a worse outcome.

  The Gibbard–Satterthwaite theorem proves that perfection is impossible; it does not prove that improvement is futile. Our goal is not to find a flawless system, but to select one that minimizes the incentive for tactical voting and maximizes the expression of member preference.

  **3. Recommendation: Approval Voting**
  The Governance Committee recommends adopting **Approval Voting** for the election of the President.

  Under Approval Voting, members may vote for ("approve") as many candidates as they wish. The candidate with the most total approval votes wins.

  **Rationale:**
  1.  **Eliminates Vote Splitting:** This directly addresses the failures of the last decade. Members can approve both a preferred "long-shot" candidate and a more moderate "acceptable" candidate without fear of wasting their vote or helping a polarizing opponent.
  2.  **Simplicity and Accessibility:** Unlike Ranked-Choice Voting (RCV), which requires voters to understand elimination rounds and transfer logic, Approval Voting is as simple to cast as Plurality. This reduces ballot errors and increases accessibility for international members unfamiliar with complex ballot structures.
  3.  **Positive Campaigning:** Candidates are incentivized to broaden their appeal to gain approval from opponents' supporters, rather than attacking rivals to drive down their ranking.
  4.  **Theoretical Robustness:** While the Gibbard–Satterthwaite theorem applies specifically to *ordinal* (ranking) systems, Approval is a *cardinal* (binary rating) system. While strategic voting is still possible, the barrier to doing so effectively is significantly higher than in Plurality or RCV.

  **4. Implementation Timeline**
  To ensure a smooth transition and maintain member confidence, we propose the following phased timeline:

  *   **Phase 1: Ratification (Next Month):** Council approves the bylaw amendment to adopt Approval Voting.
  *   **Phase 2: Education & Simulation (Months 2–6):** The secretariat will update the election portal. We will run a non-binding simulation using the previous election's ballot data to demonstrate how the outcome would have differed, publishing the results for transparency.
  *   **Phase 3: Member Communication (Months 6–9):** A series of webinars and explanatory memos will be sent to the membership, emphasizing that members may vote for *multiple* candidates without diluting their vote.
  *   **Phase 4: First Implementation (Next Election Cycle):** The new method is used for the upcoming Presidential election.

  **5. Conclusion**
  We are scientists; we understand that while no model perfectly captures reality, some models are far more useful than others. Plurality voting is a model that has demonstrably failed to capture the society's preference. While social choice theory teaches us that no system is immune to strategy, it also teaches us that system design dictates behavior. Approval Voting offers the most robust balance of theoretical soundness, administrative simplicity, and protection against the vote-splitting anomalies we have witnessed.

  We request the Council's approval to proceed with the bylaw amendment.
