      *   **The Mathematical Tool:** Bayes' Theorem (or the definition of conditional probability). $P(B|A) = \frac{P(A|B)P(B)}{P(A)}$. This relationship is symmetric/mathematical.
      *   **The Conflict:** If propensities *are* probabilities (obey the axioms), they must obey Bayes' Theorem. But Bayes' Theorem allows inverting the condition ($P(A|B)$).
      *   **The Problem:** Does a physical effect $B$ have a *propensity* to produce its cause $A$? Intuitively, no. Causation/propensity is time-asymmetric. Probability calculus is time-symmetric (in this regard).
