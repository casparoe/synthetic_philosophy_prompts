answer: |-
  This is a great question. Since you're in foundations-adjacent physics, you already have the formal machinery (Kolmogorov axioms, Bayes' theorem, conditionalization). The friction here isn't mathematical; it's **ontological**.

  Here is the gut-level intuition: **Propensity theory tries to identify probability with a physical *production* mechanism, but the probability calculus is indifferent to production.**

  Humphreys' Paradox (1985) essentially argues that you cannot have your cake and eat it too: you cannot claim propensities are both (1) objective physical dispositions and (2) standard mathematical probabilities that obey the full probability calculus (specifically Bayes' theorem/conditionalization).

  Here is the breakdown of why this traps propensity theorists but lets frequentists and subjectivists off the hook.

  ---

  ### 1. The Setup: Propensity as "Physical Disposition"
  For a propensity theorist (like Popper or Maxwell), a probability isn't a ratio of frequencies or a degree of belief. It is a **real, singular, physical property** of a setup, akin to mass or charge.
  *   **Example:** A specific radium atom at $t_0$ has a *propensity* to decay by $t_1$.
  *   **Directionality:** This is inherently time-asymmetric. The setup at $t_0$ produces an outcome at $t_1$. The disposition flows from Cause $\to$ Effect.

  Let $I$ be the initial physical setup (the cause) and $T$ be the transition/outcome (the effect).
  The propensity theorist says there is a real physical quantity: $\text{Prop}(T | I)$.

  ### 2. The Mathematical Trap
  Standard probability theory (Kolmogorov) defines conditional probability symmetrically via the ratio definition or Bayes' theorem:
  $$ P(T | I) = \frac{P(I | T) P(T)}{P(I)} $$
  Mathematically, $P(T|I)$ is inextricably linked to $P(I|T)$. If you are committed to the claim that **Propensities *are* Probabilities** (the Identity Thesis), then the mathematical relations must hold for propensities.

  This implies that $\text{Prop}(T | I)$ is mathematically defined in terms of $\text{Prop}(I | T)$.

  ### 3. The Paradox (The Gut Check)
  Here is where the intuition breaks for the propensity theorist:

  **What is $\text{Prop}(I | T)$?**
  Mathematically, it's just a number. But ontologically, for a propensity theorist, it must represent a **physical disposition**.
  *   $\text{Prop}(T | I)$: The physical setup $I$ has a disposition to produce $T$. (Makes sense).
  *   $\text{Prop}(I | T)$: The occurrence of outcome $T$ has a disposition to produce/setup $I$.

  **This implies backward causation.**
  If propensities are real physical properties governing how the world unfolds, then $\text{Prop}(I | T)$ suggests that the *effect* ($T$) physically disposes the *cause* ($I$) to happen. But $I$ happened in the past. $T$ cannot physically reach back in time and alter the propensity of $I$ to have occurred.

  For the propensity theorist, $P(I|T)$ is **ontologically empty**. It's not a physical disposition. But if propensities obey the probability calculus, $P(I|T)$ *must* exist and relate to $P(T|I)$.

  **The Dilemma:**
  1.  If you keep the Probability Calculus: You must accept that effects have propensities to produce causes (absurd).
  2.  If you keep the Physical Interpretation: You must reject parts of the Probability Calculus (specifically Bayes' theorem for propensities), which makes "propensity" no longer a standard probability.

  ### 4. Why Frequentists and Subjectivists Escape
  This is the crux of your question. Why aren't they stuck with this?

  **The Frequentist Escape:**
  Frequentists deal with **ensembles and counts**, not singular physical dispositions.
  *   $P(T|I)$: The frequency of $T$ in the reference class $I$.
  *   $P(I|T)$: The frequency of $I$ in the reference class $T$.
  *   **Intuition:** There is no "production" here. It's just set theory. Consider a dataset of smoking ($I$) and cancer ($T$).
      *   Frequency of cancer given smoking: Easy.
      *   Frequency of smoking given cancer: Also easy (just count the cancer patients who smoked).
      *   Does having cancer *physically cause* you to have smoked? No. But does the *ratio* exist? Yes.
      *   Frequentists don't claim the conditional probability represents a physical force; it represents a correlation in a static dataset. Time direction is irrelevant to counting.

  **The Subjectivist (Bayesian) Escape:**
  Subjectivists deal with **degrees of belief** (epistemic states), not physical forces (ontic states).
  *   $P(T|I)$: How much I should believe $T$ given I know $I$.
  *   $P(I|T)$: How much I should believe $I$ occurred given I observe $T$.
  *   **Intuition:** Learning $T$ updates my belief about $I$. This is **inference**, not causation.
  *   Observing cancer ($T$) makes me more confident you smoked ($I$). This doesn't imply $T$ caused $I$; it implies $T$ is *evidence* for $I$. Bayes' theorem is a logic of evidence, which is naturally reversible.

  **The Propensity Trap:**
  Propensity theorists want **objective, single-case probabilities** (like frequentists/subjectivists respectively can't provide) but they want them to be **physical properties** (unlike subjectivists).
  By reifying probability into a physical "thing" (a disposition), they bind it to the arrow of time (causation). But by binding it to the Kolmogorov axioms, they bind it to time-symmetric math. Humphreys shows these two bindings are incompatible.

  ### 5. A Physics Example (QM Adjacent)
  Since you're in foundations, consider a decay process.
  *   $I$: Atom in excited state at $t=0$.
  *   $T$: Photon emitted at $t=1$.
  *   $\text{Prop}(T|I) = 0.5$ (say).

  According to Bayes, $\text{Prop}(I|T)$ is determined by $\text{Prop}(T|I)$, $P(I)$, and $P(T)$.
  If propensities are probabilities, $\text{Prop}(I|T)$ must be a well-defined physical quantity.
  **Question:** Does the emission of the photon at $t=1$ endow the atom at $t=0$ with a physical disposition to have been excited?
  *   **Subjectivist:** "It increases my certainty that it was excited." (Fine).
  *   **Frequentist:** "In the subset of cases where photons were emitted, what fraction came from excited atoms?" (Fine).
  *   **Propensity:** "The photon emission physically fixes the chance of the prior excitation." (Nonsense).

  ### 6. The "Gut-Level" Summary
  *   **Probability Calculus:** Is about **information relations**. Information flows both ways (if $A$ implies $B$, knowing $B$ tells me about $A$).
  *   **Propensity:** Is about **physical production**. Production flows one way (past produces future).
  *   **Humphreys' Point:** You can't identify a one-way physical process with a two-way information relation without generating nonsense about backward physical production.

  ### 7. How Propensity Theorists Respond (For Context)
  Usually, they take one of two hits:
  1.  **Deny the Identity Thesis:** Propensities *look* like probabilities but don't obey all the axioms (specifically, they reject Bayes' theorem for propensities). This saves the physics but makes the math messy/non-standard.
  2.  **Conditional Propensity vs. Probability of Conditional:** They argue $\text{Prop}(T|I)$ is not the same mathematical object as $P(T|I)$. It's a primitive relation that doesn't decompose via Bayes.

  ### Why this matters for your work
  In QM foundations, this pops up whenever you try to interpret the wavefunction as a real physical object (ontic) rather than a tool for prediction (epistemic).
  *   If $\psi$ is epistemic (QBism, Copenhagen-ish), Humphreys' paradox is less biting because probabilities are about agent expectations.
  *   If $\psi$ is ontic (Bohmian, Many Worlds, Objective Collapse), you are closer to propensity territory. You have to explain how the "probabilities" emerging from the ontology handle inverse conditioning without implying retrocausal propensities.

  **TL;DR:** Frequentists count static sets (timeless). Subjectivists update beliefs (inference is reversible). Propensity theorists describe physical production (time-bound). Humphreys shows you can't map a time-bound physical production onto a timeless/reversible mathematical calculus without implying effects physically cause their causes.
