      *   *Frequentists:* They deal with long-run relative frequencies in ensembles. $P(B|A)$ is the frequency of $B$ in the reference class $A$. $P(A|B)$ is the frequency of $A$ in the reference class $B$. Both are just counts. No physical "disposition" is claimed, just statistical correlation in a dataset. Time direction doesn't matter for counting.
