answer: |-
  Here are ten interview questions designed to probe the structural integrity of the guest's account, complete with anticipated follow-ups to keep the pressure on during the exchange.

  **1. The Unclean Hands Analogy**
  You lean heavily on the "unclean hands" doctrine from equity law to argue that standing and warrant are separable. In law, that doctrine is procedural; it bars a remedy to protect the court's integrity, not necessarily because the plaintiff lacks a substantive right. When you port this into morality, are you saying the bar on hypocritical blame protects the *community's* integrity, or the *dyadic relationship*? If it's the latter, doesn't that just relocate the puzzle one level up: we still need to know why the health of the relationship trumps the validity of the norm being invoked.
  *   **Follow-up:** She will likely say it is about the normative relationship between blamer and blamed. Push back by asking: "If the relationship is damaged, is blame the *tool* we use to repair it, or does blame require the relationship to *already* be intact? If it's the latter, doesn't your view make blame redundant for the very cases where it's most needed?"

  **2. The Reformed Wrongdoer**
  Consider an agent who violated a norm in the past, now sincerely repudiates that conduct, and currently claims no exemption for themselves, but has never made amends to their past victims. On your view, does the *past* claim of exemption continue to forfeit their standing even after they've abandoned that claim? If so, why does the current attitude of equality not suffice to restore standing without restitution?
  *   **Follow-up:** She will likely argue that the moral debt remains unpaid, sustaining the inequality. Press her on this: "If standing is about the *authority* to address someone morally, why does a *past* attitude disable *current* authority if the agent no longer endorses that attitude? Are we punishing them for who they were, or assessing who they are?"

  **3. Norm Specificity and "Bleeding"**
  Your account suggests hypocrites forfeit standing by claiming an exemption from a specific norm. But moral standing feels somewhat holistic. If I am a known hypocrite regarding dishonesty, do I retain full standing to blame you for acts of cruelty? If I show I don't respect moral authority in one domain, why do I retain the authority to invoke it in another?
  *   **Follow-up:** She will likely argue that norms are modular and standing is local. Challenge this by asking: "Is the *authority* to blame modular? If I demonstrate a disregard for the *bindingness* of moral demands in general via my lying, doesn't that undermine my warrant to enforce *any* moral demand, even unrelated ones?"

  **4. The Generalization Problem**
  A common worry is that a sufficiently demanding hypocrisy condition threatens moral silence. Since virtually everyone has broken some moral rule at some point, doesn't a strict reading of your view leave almost nobody with standing to blame anybody? How do you set the bar for "relevant hypocrisy" without making it so high that it paralyzes moral practice?
  *   **Follow-up:** She will likely distinguish between "relevant similarity" and general sinfulness. Push on the epistemic burden: "Even if the bar is theoretically clear, doesn't this require agents to perform a rigorous moral self-audit before every instance of blame to ensure they aren't hypocritical? Doesn't that cognitive load itself inhibit the moral address you value?"

  **5. The "Saint" Objection**
  You argue that blame presupposes *equal* standing, and the hypocrite forfeits this by claiming superiority (an exemption). But what about the agent who is simply *better* than the blamed party without claiming an exemption? If I have never lied and you have, do I lack standing because we aren't equals? If you say I *do* have standing, how is that different from the hypocrite who claims they are special?
  *   **Follow-up:** She will likely distinguish between *status* equality and *virtue* equality. Ask: "But if the hypocrite is barred because they disrupt the moral equilibrium, doesn't the 'Saint' also disrupt that equilibrium by occupying a higher rung? Why is one inequality a bar to standing and the other permissible?"

  **6. Mechanisms of Restoration**
  If standing is forfeited through hypocrisy, there must be a mechanism for regaining it. Is this a matter of time, confession, punishment, or restitution? And is the restoration automatic once the condition is met, or does it require the *consent* of the person who was originally blamed?
  *   **Follow-up:** She will likely list conditions like apology or reform. Press on the social aspect: "If I clean my hands but the community doesn't *recognize* that I've cleaned them, do I have standing objectively, or only relative to those who know I've reformed? Is standing a fact or a social status?"

  **7. The Content of Failed Blame**
  When a hypocrite attempts to blame, you say they lack standing. What is the semantic or pragmatic status of their utterance? Is it that they are saying something *false*, or that they are performing a speech act *infelicitously*? If I lack standing, have I failed to blame you, or have I blamed you *wrongfully*?
  *   **Follow-up:** She will likely argue it's a normative defect in the performance, not the content. Ask: "If the verdict is true but the standing is absent, what work is the blame actually doing? Is it just noise, or does it retain some moral force that we need to account for?"

  **8. Interaction with Other Defeaters**
  How does your hypocrisy condition interact with other standing defeaters, like meddling or lack of relationship? If I am a hypocrite *and* a meddler, are these cumulative bars? More importantly, could there be a case where hypocrisy is present, but the relationship is strong enough that blame is still permissible?
  *   **Follow-up:** She will likely say these are distinct conditions. Push: "If the relationship is robust enough to withstand hypocrisy, does that suggest the relationship is the true source of standing, and hypocrisy is just one way to damage that relationship, rather than a standalone bar?"

  **9. The Epistemic Asymmetry**
  Often, the hypocrite knows they are a hypocrite, but the blamed party does not. If standing is objective, does the blame fail even if the blamed person accepts it? Conversely, if I *falsely believe* I am a hypocrite, do I lose standing to blame you even if I am actually in the clear?
  *   **Follow-up:** She will likely say standing is objective. Ask: "If standing is objective, but moral address is communicative, doesn't that create a gap where I might successfully communicate a moral demand while lacking the authority to do so? How do we square the phenomenology of blame with your metaphysics of standing?"

  **10. Falsification Conditions**
  Finally, philosophical theories need to be vulnerable to evidence. What sort of case would actually count as evidence against your view rather than just another example your apparatus can absorb? Is there a specific intuition about a hypocritical blamer that, if you found yourself sharing it, would force you to abandon the "unclean hands" model?
  *   **Follow-up:** She will likely offer a thought experiment. Ask: "If you encountered a case where the hypocrite's blame clearly produced moral improvement in the blamed party, would you concede that the *consequences* of the blame can sometimes override the *procedural* defect of hypocrisy, or is the bar on standing absolute regardless of outcomes?"
