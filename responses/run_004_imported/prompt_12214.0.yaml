prompt: |-
  I'm a PhD student in computer science working on algorithmic fairness, and this term I'm TAing an interdisciplinary seminar, cross-listed with philosophy, that spends a couple of sessions on the impossibility results that grew out of the COMPAS/ProPublica dispute: the Kleinberg-Mullainathan-Raghavan and Chouldechova results showing that once base rates differ across groups, no imperfect classifier can simultaneously achieve calibration within groups, equal false positive rates, and equal false negative rates. That's a large part of why Northpointe and ProPublica were able to both be technically right while talking past each other. Every year, once the class has absorbed the impossibility, someone asks the obvious follow-up: fine, but if you actually had to ship a pretrial risk tool, which single criterion would you commit to? I've never been satisfied with my own answer on the spot, and most treatments of this material stop at contrasting statistical parity with equalized odds, without ever putting the fuller menu of criteria head-to-head.

  I'd like your help thinking this through more carefully. Consider these eight criteria, all of which appear somewhere in the literature spawned by this dispute: statistical parity, conditional statistical parity, equalized odds, equal opportunity, predictive parity/calibration within groups, treatment equality, counterfactual fairness, and individual fairness. Now suppose a jurisdiction has accepted the impossibility result and wants to name exactly one of these as the formal compliance standard for a pretrial risk-assessment tool, treating violations of the rest as unavoidable trade-offs rather than independently actionable failures. Please rank these eight criteria from best to worst choice for that role, weighing both practical considerations (robustness to differing base rates across groups, data and causal-model requirements, how easily an auditor could verify compliance, how easily the deploying agency could game it) and how well each criterion actually tracks the ordinary complaint "this tool discriminates against this group," as opposed to being a mathematically convenient but normatively arbitrary proxy for it.

  Please present your ranking as a tier list in the following JSON format (ties within a tier are fine, and you needn't fill every tier), followed by one short paragraph defending your top-ranked criterion and one short paragraph explaining what disqualifies your bottom-ranked one:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
reasoning: |-
  Here's a thinking process that leads to the suggested ranking and justification:

  1.  **Analyze the Request:**
      *   **User:** PhD student in CS (algorithmic fairness), TAing an interdisciplinary seminar (CS + Philosophy).
      *   **Context:** Teaching the COMPAS/ProPublica impossibility results (KMR, Chouldechova). Students ask: "If you *had* to pick one criterion for a pretrial risk tool, which one?"
      *   **Task:** Rank 8 specific fairness criteria from best to worst as the *single* formal compliance standard for a pretrial risk-assessment tool.
      *   **Criteria to Rank:** Statistical Parity, Conditional Statistical Parity, Equalized Odds, Equal Opportunity, Predictive Parity/Calibration within Groups, Treatment Equality, Counterfactual Fairness, Individual Fairness.
      *   **Evaluation Metrics:** Practical considerations (robustness to base rates, data/causal requirements, auditability, gaming resistance) AND Normative alignment (tracking the ordinary complaint of discrimination).
      *   **Output Format:** JSON tier list (S, A, B, C, D) + 1 paragraph defense of top + 1 paragraph explanation of bottom.

  2.  **Deconstruct the Context (Pretrial Risk Assessment):**
      *   **Goal:** Predict failure to appear (FTA) or new arrest (NCA) to inform release/detention decisions.
      *   **Stakes:** High. Liberty vs. Public Safety.
      *   **Base Rates:** Differ significantly across demographic groups (due to historical policing, socioeconomic factors, etc.). This is the core of the impossibility theorem.
      *   **Impossibility:** Cannot have Calibration + Equalized Odds (FPR/FNR balance) if base rates differ and classifier is imperfect.
      *   **The "Single Standard" Constraint:** We must pick *one* to enforce legally/operationally. The others become trade-offs.

  3.  **Evaluate Each Criterion:**

      *   **1. Statistical Parity (Demographic Parity):**
          *   *Def:* $P(\hat{Y}=1 | A=0) = P(\hat{Y}=1 | A=1)$. Same selection rate.
          *   *Pros:* Easy to audit. Hard to game (if strictly enforced).
          *   *Cons:* Ignores base rates. If one group has higher risk, enforcing SP forces higher FPR or lower TPR for that group. Often viewed as "quota" system. In pretrial, might mean releasing dangerous people or detaining safe people to balance numbers.
          *   *Verdict:* Poor normative fit for risk assessment (ignores actual risk), but high practicality.

      *   **2. Conditional Statistical Parity:**
          *   *Def:* SP holds conditional on legitimate features $X$ (e.g., charge severity).
          *   *Pros:* Addresses the "legitimate factor" critique of SP.
          *   *Cons:* Which features are "legitimate"? (Bail amount? Prior arrests?). If $X$ is correlated with protected attribute due to bias, this encodes bias. Harder to audit than SP.
          *   *Verdict:* Better than SP, but still suffers from base rate issues within strata.

      *   **3. Equalized Odds:**
          *   *Def:* Equal TPR and Equal FPR across groups ($P(\hat{Y}=1|Y,A) = P(\hat{Y}=1|Y)$).
          *   *Pros:* Directly addresses the ProPublica critique (error rate balance). Treats errors equally costly across groups.
          *   *Cons:* Impossible with Calibration if base rates differ. Requires ground truth $Y$ (arrests are noisy proxies for guilt/risk).
          *   *Verdict:* Strong normative candidate (equal error costs), but practically difficult due to the impossibility tension with calibration (which courts often want).

      *   **4. Equal Opportunity:**
          *   *Def:* Equal TPR only ($P(\hat{Y}=1|Y=1,A) = P(\hat{Y}=1|Y=1)$).
          *   *Pros:* Focuses on not missing high-risk individuals (public safety) or not detaining low-risk (liberty), depending on how $Y$ is defined. Usually defined as catching the "positives" (risk).
          *   *Cons:* Ignores FPR. Could detain everyone to get 100% TPR.
          *   *Verdict:* Weaker than Equalized Odds because it ignores the cost of false positives (unnecessary detention).

      *   **5. Predictive Parity / Calibration within Groups:**
          *   *Def:* $P(Y=1|\hat{Y}=1, A) = P(Y=1|\hat{Y}=1)$. A risk score of 70% means 70% risk for everyone.
          *   *Pros:* Northpointe's defense. Crucial for *utility*. If a judge sees "High Risk," it should mean the same thing regardless of race. Essential for decision-making.
          *   *Cons:* Leads to unequal error rates (ProPublica critique). If base rates differ, the group with lower base rate will suffer higher FPR.
          *   *Verdict:* Strong practical candidate for a *risk tool*. If the tool isn't calibrated, it's lying to the judge. Normatively contentious because it accepts unequal error burdens.

      *   **6. Treatment Equality:**
          *   *Def:* Ratio of FN to FP is constant across groups.
          *   *Pros:* Balances the *harm* ratio.
          *   *Cons:* Obscure. Doesn't control overall error rates. Hard to explain to stakeholders.
          *   *Verdict:* Niche. Not a primary standard.

      *   **7. Counterfactual Fairness:**
          *   *Def:* $\hat{Y}$ would be the same in a world where $A$ was different (causal).
          *   *Pros:* Deeply normative. Gets at the "why" of discrimination.
          *   *Cons:* Requires a full causal model (unobservable). Impossible to audit empirically without strong assumptions. In pretrial, almost impossible to specify the SCM correctly (policing biases are structural).
          *   *Verdict:* Theoretically ideal, practically impossible as a compliance standard.

      *   **8. Individual Fairness:**
          *   *Def:* Similar individuals get similar outcomes ($d(x, x') \leq \epsilon \implies |\hat{y} - \hat{y}'| \leq \delta$).
          *   *Pros:* Philosophically robust (treat like cases alike).
          *   *Cons:* Requires a similarity metric $d$. Who defines it? If $d$ includes biased history, it encodes bias. Hard to audit (need to check pairs).
          *   *Verdict:* Too vague for regulation.

  4.  **Ranking Strategy (The "Single Compliance Standard" Constraint):**
      *   *Goal:* A standard that can actually be enforced, audited, and aligns with the specific function of a *risk assessment* tool (predicting probability).
      *   *Top Tier:* Needs to ensure the tool is actually useful (calibrated) OR ensures equal burden of error (Equalized Odds).
      *   *The Tension:* In pretrial, if the tool says "80% risk," and that means 40% for Group B, the judge cannot use the tool rationally. Calibration is foundational for *risk* tools. However, Equalized Odds is foundational for *justice* (equal error costs).
      *   *Decision:* For a *risk assessment tool* specifically (not the final decision), **Calibration within Groups** is often the pragmatic winner because without it, the scores are meaningless for decision-making. However, **Equalized Odds** is the normative winner for "fairness."
      *   *Refinement:* The prompt asks to weigh "tracking the ordinary complaint 'this tool discriminates'" vs practicality.
      *   *Re-evaluation:* If I am a regulator, enforcing Equalized Odds is hard because of the impossibility theorem (you force miscalibration). Enforcing Calibration is easier but accepts disparate impact in errors.
      *   *Wait, look at the constraints:* "Jurisdiction has accepted the impossibility result." They know they can't have both. They want *one*.
      *   *Best Choice:* **Equalized Odds**. Why? Because in a liberty-deprivation context, the *cost of errors* is the moral core. Detaining an innocent person (FP) is a rights violation. Releasing a guilty person (FN) is a safety risk. If Group A suffers more FPs than Group B, Group A is bearing a disproportionate burden of state coercion. Calibration is about *information quality*, Equalized Odds is about *distribution of harm*. For a compliance standard regarding *discrimination*, harm distribution is more salient.
      *   *Wait, Counter-argument:* If the tool isn't calibrated, judges will ignore it or misuse it, leading to worse outcomes. But the question is about the *fairness criterion*.
      *   *Actually, looking at recent literature (e.g., Mitchell et al., Selbst et al.):* Many argue **Equalized Odds** (or Equal Opportunity) is the standard for high-stakes decisions because it equalizes the risk of error.
      *   *However,* **Calibration** is often ranked higher for *risk scores* specifically because they are inputs to human decisions. If the input is biased (miscalibrated), the human decision is biased.
      *   *Let's look at the "Ordinary Complaint":* "This tool discriminates." Usually means "It flags us more often when we are innocent" (FPR) or "It lets them go when they are guilty" (FNR). This points to Equalized Odds.
      *   *What about Counterfactual/Individual?* They are too hard to verify. They belong in C/D tier.
      *   *What about Statistical Parity?* Generally rejected in risk assessment because it ignores $Y$.
      *   *Top Tier:* Equalized Odds vs Calibration.
      *   *Decision:* **Equalized Odds** takes the S tier. It directly addresses the disparate burden of error. Calibration is A tier (necessary for utility, but doesn't guarantee fair error distribution).
      *   *Wait, let's reconsider Calibration.* In the COMPAS debate, Northpointe won on Calibration. ProPublica won on Error Rates. If I must pick *one* for compliance... If I enforce Calibration, I allow disparate FPR. If I enforce Equalized Odds, I allow miscalibration. Miscalibration means the score "7" means different things. That undermines the tool's purpose. But disparate FPR means one group is detained more often *for the same level of innocence*. That is the definition of discrimination.
      *   *Consensus in Fairness Literature:* For high-stakes liberty issues, **Equalized Odds** (specifically controlling FPR) is usually prioritized over Calibration because the harm of false positives (detention) is the primary rights violation.
      *   *Second Tier:* **Equal Opportunity** (relaxed version of Eq Odds) and **Calibration**.
      *   *Bottom Tier:* **Counterfactual** and **Individual** (Unverifiable). **Statistical Parity** (Normatively weak for risk).

      *   *Refining the Top:* Is there a case for **Equal Opportunity** over **Equalized Odds**? Eq Opp only cares about TPR. In pretrial, we care about FPR (don't detain innocent) more than FNR (public safety is secondary to liberty in bail theory, though politically contested). Eq Odds covers both.
      *   *Refining the Bottom:* **Statistical Parity** is often criticized, but **Counterfactual/Individual** are *impossible* to audit. A compliance standard *must* be auditable. So Counterfactual/Individual are worse than SP because SP is at least measurable.
      *   *Wait, the prompt asks to weigh "how easily an auditor could verify compliance".* This kills Counterfactual and Individual Fairness for a *compliance standard*. You can't regulate what you can't measure.
      *   *So Bottom Tier:* Counterfactual & Individual.
      *   *Top Tier:* Equalized Odds. It balances the harm.
      *   *Second Tier:* Calibration. It ensures the tool tells the truth.
      *   *Third Tier:* Equal Opportunity (incomplete), Conditional SP (depends on X).
      *   *Fourth Tier:* Statistical Parity (ignores risk), Treatment Equality (obscure).

      *   *Wait, let's look at the "Best" choice again.*
      *   If I pick Calibration: The tool is useful, but Group A gets detained at 20% FPR and Group B at 10% FPR. Is this discrimination? Yes, disparate impact on liberty.
      *   If I pick Equalized Odds: The tool has 10% FPR for both. But a score of "High" means 80% risk for Group A and 60% risk for Group B. Judges might over-detain Group B because they don't trust the score, or under-detain Group A.
      *   *Most legal scholars (e.g., Binns, Selbst)* suggest that for *allocation of harm*, Error Rate Balance (Eq Odds) is superior.
      *   *Most ML practitioners* prefer Calibration.
      *   *The Prompt:* "PhD student... interdisciplinary seminar... philosophy." The normative weight should lean towards the philosophical complaint of discrimination (unequal burden of error) while acknowledging practicality.
      *   *Revised Top:* **Equalized Odds**.
      *   *Revised Bottom:* **Counterfactual Fairness** (Impossible to verify).

      *   *Let's check the criteria list again:*
          1. Statistical Parity
          2. Conditional Statistical Parity
          3. Equalized Odds
          4. Equal Opportunity
          5. Predictive Parity/Calibration within Groups
          6. Treatment Equality
          7. Counterfactual Fairness
          8. Individual Fairness

      *   *Tier S:* Equalized Odds. (Best balance of normative weight on error burden + auditability).
      *   *Tier A:* Calibration within Groups. (Essential for tool utility, but accepts disparate error burden). Equal Opportunity. (Good, but ignores FPR).
      *   *Tier B:* Conditional Statistical Parity. (Better than SP, but relies on contentious 'legitimate' variables). Treatment Equality. (Niche).
      *   *Tier C:* Statistical Parity. (Ignores base rates, effectively quotas).
      *   *Tier D:* Counterfactual Fairness, Individual Fairness. (Unverifiable, require unobservable causal models or similarity metrics).

      *   *Wait, is Calibration better than Eq Odds?*
      *   Argument for Calibration: If the tool is miscalibrated, it's technically "lying." A judge relying on it is making decisions based on false probabilities.
      *   Argument for Eq Odds: The *impact* is the detention. If FPR differs, the impact differs.
      *   In the context of the COMPAS dispute, the impossibility theorem exists *because* Base Rates differ. If we enforce Eq Odds, we accept miscalibration. If we enforce Calibration, we accept disparate FPR.
      *   Which is the "worse" sin for a *compliance standard*?
      *   Legal compliance usually focuses on disparate impact (outcomes). Disparate FPR leads to disparate detention rates for innocent people. This is a stronger legal claim than "the probabilities were slightly off."
      *   So Eq Odds stays at S. Calibration at A.

      *   *What about Individual Fairness?* It's theoretically beautiful but operationally dead. It belongs at the bottom with Counterfactual.
      *   *What about Statistical Parity?* It's measurable, so it's better than the unmeasurable ones, but normatively weak for risk. So C tier.

      *   *Refining the Tiers:*
      *   S: Equalized Odds.
      *   A: Calibration within Groups, Equal Opportunity.
      *   B: Conditional Statistical Parity, Treatment Equality.
      *   C: Statistical Parity.
      *   D: Counterfactual Fairness, Individual Fairness.

      *   *Wait, one nuance:* Equal Opportunity is often preferred over Equalized Odds in hiring (give everyone a chance). In pretrial, we want to minimize *both* errors (don't detain innocent, don't release violent). But FPR is usually the civil rights concern. Eq Odds covers FPR. Eq Opp does not. So Eq Odds > Eq Opp.
      *   *Calibration:* Northpointe's defense. It's crucial. Maybe it should be S tier?
      *   *Decision:* I will place **Equalized Odds** in S because it directly addresses the "discrimination" complaint regarding error burden. I will place **Calibration** in A because while vital for utility, it permits the disparate harm that triggers civil rights complaints.
      *   *Bottom:* **Counterfactual Fairness**. It requires a causal model that cannot be agreed upon or verified. A compliance standard must be objective.

  5.  **Drafting the Justifications:**
      *   *Top (Equalized Odds):* Focus on the distribution of harm. In pretrial, the state imposes costs (detention) via errors. Equalizing FPR/FNR ensures no group bears a disproportionate burden of state error. It is auditable (confusion matrix) unlike causal metrics.
      *   *Bottom (Counterfactual):* Focus on unverifiability. Requires specifying a full Structural Causal Model (SCM). Disagreement on the SCM makes it unenforceable. It's a philosophical ideal, not a regulatory standard.

  6.  **Review against Constraints:**
      *   JSON format? Yes.
      *   Tier list keys (S, A, B, C, D)? Yes.
      *   One paragraph top? Yes.
      *   One paragraph bottom? Yes.
      *   Rank all 8? Yes.
      *   Context: Pretrial risk, single standard, impossibility accepted.

      *   *Self-Correction on Tiers:* I need to make sure I don't leave tiers empty if possible, but the prompt says "needn't fill every tier". I have 8 items.
      *   S: Equalized Odds (1)
