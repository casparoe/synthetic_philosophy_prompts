  Equalized Odds earns the top spot because it most directly addresses the core normative complaint in pretrial contexts: that the burden of state error should not fall disproportionately on protected groups. By requiring equal false positive and false negative rates across groups, it ensures that innocent defendants from different demographics face the same risk of unnecessary detention, which aligns with the legal principle of equal protection under the law. Unlike causal metrics, it is empirically auditable using confusion matrices and ground-truth outcomes (however noisy), making it enforceable as a compliance standard without requiring unobservable structural assumptions.

  Counterfactual Fairness is disqualified because it relies on specifying a complete structural causal model of the world, including unobservable counterfactuals that cannot be empirically verified or agreed upon by auditors. In a pretrial context, where historical policing data encodes complex, systemic biases, there is no objective way to define the "fair" causal pathway versus the "biased" one, making it impossible to use as a regulatory standard. While philosophically rigorous, it fails the practical requirement of adjudicability, leaving agencies and courts with no concrete mechanism to measure violations.
