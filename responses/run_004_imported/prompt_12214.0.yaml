      *   *Okay, ready to write.*

      *   *Wait, one nuance on Calibration:* In the COMPAS case, ProPublica attacked the FPR disparity. Northpointe defended Calibration. If I am a regulator, enforcing Calibration allows the FPR disparity that sparked the scandal. Enforcing Eq Odds prevents the scandal but makes the scores miscalibrated. Which is worse? Miscalibrated scores can be adjusted by judges (if they know). Disparate FPR means the system *itself* is treating groups differently regarding liberty. Eq Odds is the stronger fairness claim.

      *   *Wait, one nuance on Statistical Parity:* In some legal contexts (Title VII), Statistical Parity (disparate impact) is the *actual* legal standard. However, the prompt asks for the "best choice" weighing normative tracking of discrimination *in the context of the impossibility results*. In the fairness literature, SP is usually considered too blunt for risk assessment. I will rank it lower than error-rate metrics.

      *   *Final Plan:*
