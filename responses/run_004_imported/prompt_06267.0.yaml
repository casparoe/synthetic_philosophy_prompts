answer: |-
  This is a remarkable intellectual position to be in, especially with your background. Having spent 35 years dealing with causal chains in experimental physics, you know better than most that how we *model* a system often depends on the scale at which we are observing it. You also know that "cause" in a lab report is a functional tool, not necessarily a metaphysical absolute.

  The dynamic between Peter (P.F.) and Galen Strawson is indeed one of the most fascinating family feuds in modern philosophy. To answer your question: **They are definitely disagreeing, but they are also defining the terms of the engagement differently.**

  Here is a breakdown of their positions, how they clash, and an evaluation of which offers the more satisfying resolution to the problem, tailored to your perspective as a scientist.

  ### 1. P.F. Strawson: The Naturalist (Freedom and Resentment)
  Your father-figure here (metaphorically) is arguing from a **naturalistic and pragmatic** standpoint.
  *   **The Core Claim:** The debate between determinism and free will is a "quagmire" that doesn't actually touch our lived reality. Our practice of holding people responsible isn't based on a metaphysical theory about the universe; it is based on "reactive attitudes."
  *   **The Mechanism:** When someone hurts us intentionally, we feel *resentment*. When they help us, we feel *gratitude*. These are not intellectual choices; they are natural human reactions, like flinching from heat.
  *   **The Conclusion:** To ask if these attitudes are "justified" by the fundamental laws of physics is a category error. They are justified because they constitute the framework of human relationships. We *cannot* abandon them without ceasing to be human. Therefore, moral responsibility is real because the *practice* is inescapable.
  *   **Physics Analogy:** This is like **Thermodynamics**. You don't need to know the quantum state of every particle to know that heat flows from hot to cold. The "higher-level" laws are real and valid within their domain, regardless of what the "fundamental" laws say.

  ### 2. Galen Strawson: The Metaphysician (The Basic Argument)
  Galen respects his father but believes he sidestepped the hard metaphysical bullet. Galen argues from a **logical and ultimate** standpoint.
  *   **The Core Claim:** True moral responsibility requires "Ultimate Responsibility." To be responsible for an action, you must be responsible for the mental state that caused the action.
  *   **The Regress:** To be responsible for that mental state, you must have chosen it based on a prior principle. But to be responsible for *that* principle, you must have chosen it, and so on.
  *   **The *Causa Sui* Problem:** This chain must stop somewhere. For you to be truly responsible, you must be the cause of yourself (*causa sui*). Since nothing can be the cause of itself (you exist before you exist to do the causing), ultimate responsibility is logically impossible.
  *   **The Conclusion:** Determinism doesn't matter. Even in an indeterministic universe, if your actions come from randomness, you aren't responsible. If they come from your character, and you didn't choose your character, you aren't responsible.
  *   **Physics Analogy:** This is like **Fundamental Particle Physics**. It asks: "What is the bedrock reality?" If the bedrock doesn't support the structure, the structure is an illusion, no matter how useful it is.

  ### 3. Are They Talking Past Each Other?
  Yes and no.
  *   **Yes:** They are using different definitions of "Responsibility." P.F. means **Accountability** (eligibility for social sanctions/rewards). Galen means **Ultimate Origination** (metaphysical authorship).
  *   **No:** Galen explicitly targets P.F.'s view. Galen argues that P.F.'s "reactive attitudes" are based on a false belief—the belief that people *could have done otherwise* in a deep metaphysical sense. Galen thinks we should grow up and admit that nobody deserves praise or blame in the ultimate sense, even if we keep the practices for utility.

  ### 4. The Verdict: Which is More Satisfying?

  If I must choose which account comes closer to a genuinely satisfying answer to the **problem of moral responsibility**, I side with **P.F. Strawson**.

  Here is the justification, specifically for someone with your background in causation and systems:

  **1. The "Category Error" Argument**
  As a physicist, you know that "temperature" is not a property of a single atom. It is an emergent property of a system. If you argue, "Single atoms have no temperature, therefore temperature is an illusion," you are technically correct but practically useless.
  Galen Strawson treats "Moral Responsibility" as if it were a property of a single agent in a vacuum, like mass or charge. P.F. Strawson correctly identifies that Responsibility is an **emergent property of a social system**. It exists *between* people, not *inside* them. By demanding that responsibility exist at the fundamental metaphysical level (Galen's demand), Galen is making a category error. P.F. satisfies the problem by showing that the problem was mislocated.

  **2. The Inescapability of the Framework**
  Galen's argument is logically watertight, but it is existentially inert. Even if we accept Galen is right, we cannot live as if he is right. We cannot look at a murderer and feel nothing but "oh, the causal chain led here." As P.F. noted, trying to suppress reactive attitudes leads to a kind of inhuman detachment that is unsustainable.
  A "satisfying answer" in philosophy must account for the data of human experience. P.F. accounts for the data (we blame, we love, we resent). Galen dismisses the data as a collective delusion. For a scientist, a theory that dismisses the observational data is usually less robust than one that explains it.

  **3. Causation and the "Self"**
  You spent your career thinking about causation. Galen's argument relies on a specific, rigid view of the self as a static "thing" that must cause itself. But modern neuroscience and physics suggest the "self" is more of a process or a narrative center of gravity.
  P.F. Strawson's view aligns better with a systems-view of causation. We hold people responsible because doing so *modifies* the causal chain of their future behavior and the community's safety. It is a feedback loop. Galen wants a "First Cause" for the self; P.F. accepts the self as part of an ongoing causal web where "responsibility" is the name we give to specific nodes in that web that are responsive to reasons.

  ### Conclusion
  Galen Strawson wins the battle of **Logic**. If you want to know if humans have "God-like" freedom, the answer is no.
  P.F. Strawson wins the war of **Meaning**. If you want to know if moral responsibility is real, the answer is yes, because it is a real feature of human interaction.

  For a retired physicist looking for "unfinished business" on causation, **P.F. Strawson** is the more satisfying read. He effectively argues that the search for a *metaphysical* foundation for ethics is like searching for the ethical weight of an electron. It's not that the electron isn't real; it's that ethics operates at a different level of description. P.F. allows you to keep your causal worldview (determinism might be true) without losing your human worldview (blame and praise are valid). Galen forces you to choose, and in doing so, renders the concept of "moral responsibility" empty.

  P.F. Strawson saves the phenomenon; Galen Strawson explains it away. In science, saving the phenomenon is usually the mark of a better theory.
