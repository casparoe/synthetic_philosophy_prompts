      *Let's flesh out the remaining 5 questions to ensure they also press the "Strong Reading."*
      *   Q5: The "Suicide" implication. If death is not worse than life, is hastening it permissible? This presses the ethical limit of the strong reading.
      *   Q6: The "Chaplain" angle. Can one hold this view *for* others? Or is it solipsistic?
