          *   *Deflection:* "It's about transformation, not emotion."
          *   *Press:* Does the *need* to overcome grief undermine the claim that there's no reason to prefer life?

      *   *Topic 2: The Skull vs. Lady Li (Preference vs. Agnosticism)*
          *   *Tension:* Lady Li suggests we might *like* death once we're there (agnosticism about the future). The Skull suggests death is *better* (no rulers, no seasons). Does the Skull parable actually support the "no preference" claim, or does it secretly prefer death?
          *   *Deflection:* "It's ironic." or "It's about perspective."
