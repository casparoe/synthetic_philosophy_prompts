      *   *Topic 3: Cosmology (*Qi*/Way) vs. Physicalism*
          *   *Tension:* The "smith casting metal" analogy relies on the metal belonging to the smith (the Dao). If you don't believe in the Dao/*qi*, is the comfort just a category error? Can a modern hospice patient actually use this without the metaphysics?
          *   *Deflection:* "It's poetic, not literal metaphysics."
          *   *Press:* If it's not literal, does the "strong reading" collapse into mere metaphor? If it *is* literal, how does a modern reader accept it?

      *   *Topic 4: Burial Refusal vs. Life Nourishment (*Yangsheng*)*
          *   *Tension:* Zhuangzi says "crow food is fine." But the *Neiye* or other Daoist texts focus on *yangsheng* (nourishing life). Is there a contradiction? Is the indifference to death only valid *after* you've lived a full life?
          *   *Deflection:* "Different texts, different authors." or "It's about non-attachment."
          *   *Press:* If the tradition cares about prolonging life, does Zhuangzi's indifference require a specific kind of life completion?

