prompt: |-
  So I'm working on a scene in my novel where a philosophy professor who just got a terminal diagnosis has it out with his best friend—she's healthy, he's the one dying—over whether his death is actually bad for him, not just sad for the people who love him. He's taught Epicurus for thirty years, so naturally he goes for the classic move first: there's no version of him left after he's dead to be harmed by it, so the badness has nowhere to land. Don't let it stay at Epicurus 101 though (everyones heard that line by now)—have her come back with the deprivation account's real problem child, the timing puzzle: if his death is bad for him, WHEN exactly is it bad, since it's not bad before he dies and there's no him left afterward to be the victim of it. Bonus points if he has to squirm a little dealing with the old Lucretius thing too, about why not existing before he was born never bothered him. I want real back and forth, each of them responding to the other's last point instead of just restating their own view louder, and neither one should feel like they're just there to loose.
