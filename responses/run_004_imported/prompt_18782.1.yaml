answer: |-
  The study smelled of dust and old paper, a scent Arthur had spent thirty years cultivating. Now, with the manila folder on the desk between them, it smelled like a waiting room.

  Arthur stared at the window. "Epicurus was right, El. It's category error. To be harmed, you have to exist. Death is the privation of existence. Therefore, death is the privation of a subject. No subject, no harm."

  Elena sat in the leather armchair, her hands wrapped around a mug of tea she hadn't touched. "That's Intro to Ethics, Artie. 'Where death is, I am not.' I graded those papers for you in '98. I know the line."

  "It's not a line. It's the only logical conclusion."

  "It's a shield," she said softly. "You're trying to logic your way out of a biological event."

  "I'm trying to be precise. You keep saying this is 'tragic for me.' I'm asking how. If I never experience the state of being dead, where does the badness land? It lands on you. On Sarah. Not on me."

  Elena set the mug down. The clink was sharp in the quiet room. "Okay. Let's grant that the *state* of being dead isn't experienced. That's not the harm. The harm is the deprivation. You lose the future."

  "Ah," Arthur said, turning from the window. He leaned against the bookshelf, crossing his arms as if holding himself together. "The Deprivation Account. Fine. Death is bad because it deprives me of the good life I would have had."

  "Exactly."

  "But then tell me this," Arthur said, his voice picking up the rhythm of a lecture, though his eyes were tired. "When does this harm occur? If death is bad for me, there must be a time when I am suffering this badness. Is it before I die?"

  "No."

  "Is it after?"

  "No, because you just said there's no 'you' then."

  "Precisely. So, when? If you can't locate the time of the misfortune, you can't locate the misfortune. It's a ghost. You're mourning a ghost."

  Elena leaned forward, elbows on her knees. "This is the timing puzzle. I know. But just because it's hard to pin down temporally doesn't mean it isn't real. Think about betrayal. If I betray you behind your back, and you never find out, when are you harmed?"

  "Interesting. But in that case, the state of affairs exists while I am alive. The betrayal is happening *to* a living subject."

  "Okay. Think about a coma. Permanent coma. You're alive, but you have no future. Are you harmed?"

  "Yes, because the biological organism persists."

  "The *person* is gone, Artie. The projects, the connection. That's gone. We say that person is tragic. Why? Because what *should* have happened didn't." She tapped the desk. "The badness isn't a sensation. It's a discrepancy. It's the gap between the life you have and the life you could have had."

  "But gaps don't hurt," Arthur said. "Pain hurts. Loss hurts. But only if you're there to feel the loss. I am saying that *I* will not be there to mind the gap."

  "You're conflating 'feeling bad' with 'being worse off.'"

  "Semantics."

  "Ontology," she corrected. "You're a philosopher, don't cheat. If I steal your wallet, you are worse off even if you don't notice for an hour. The harm happens at the theft. Death is the theft of time. The harm happens at the moment of death."

  Arthur pushed off the bookshelf and walked to the desk. He touched the manila folder but didn't open it. "At the moment of death, I am ceasing to be. How can the culmination of my existence be the subject of a property called 'harm'? It's like saying a candle is harmed by being blown out at the exact moment the flame vanishes. The flame isn't there to be harmed."

  "The candle isn't the point. The light is." Elena stood up. She was shorter than him, but she held his gaze. "You're hiding behind the subject. But you care about the object. You care about the life."

  Arthur sighed, the fight draining out of his posture. He sat in his chair. "Okay. Let's try Lucretius. If you're so sure non-existence is a harm, why aren't you upset about the time before you were born? That's the same amount of non-existence. Just backward."

  He looked at her expectantly. This was his ace. The Symmetry Argument. It usually silenced the room.

  Elena didn't blink. "I'm not upset about pre-birth because there was no 'I' waiting to happen."

  "But there's no 'I' waiting after death, either."

  "The direction matters, Artie." She walked around the desk and stood beside him. "Before I was born, there was no subject who was deprived. But now? There *is* a subject. You. You are here, looking forward. You have investments. You have momentum. Death snaps the arrow in mid-flight. Pre-birth is just the quiver."

  Arthur rubbed his temples. "That's special pleading. Time doesn't care about direction. Entropy goes one way, but logic is timeless."

  "Logic is timeless. People aren't." She put a hand on his shoulder. He flinched, just slightly. "You're asking me to view your life from the outside. From the universe's perspective. From the universe's perspective, nothing matters. But we aren't the universe. We're creatures who live in time. And in time, cutting a story short is a tragedy for the story."

  "It's not a tragedy for the *book*, El. The book is closed."

  "It's a tragedy for the *reading*."

  Arthur looked down at his hands. They looked the same as they always had, though he felt different inside. Hollowed out. "I've taught this for thirty years," he whispered. "I've told hundreds of students that fearing death is irrational. That it's a null set."

  "And do you believe it?"

  Arthur was silent for a long time. He looked at the rows of spines—Plato, Kant, Nagel, Williams. All the people who had worried this bone until it was white.

  "I believe the logic holds," Arthur said finally. "I believe that strictly speaking, there will be no 'me' to suffer the deprivation."

  "But?"

  Arthur looked up, and for the first time, the professor was gone. Just a man sat there. "But the logic doesn't stop the feeling. I know the timing puzzle creates a paradox. I know Lucretius suggests symmetry. But..." He gestured to the window, to the afternoon light hitting the oak tree outside. "I want to see next spring. And I know 'I' won't be there to miss it. But the fact that I won't be there to miss it... it feels like a theft."

  Elena squeezed his shoulder. "Because it is."

  "Even if there's no victim?"

  "Especially because there's no victim," she said. "It's a crime with no one left to testify. That doesn't make it not a crime."

  Arthur let out a breath that was half-laugh, half-sob. "So. We're at an impasse. The Epicurean says no harm is possible. The Deprivationist says the harm is real but temporally unlocatable."

  "We're at an impasse," Elena agreed. "You're going to die thinking it's logically nothing. And I'm going to grieve thinking it's logically everything."

  "And neither of us can convince the other."

  "No."

  Arthur picked up the manila folder and slid it into a drawer. He closed the drawer with a solid thud. "Well. Since I am currently existing... and since you are currently existing... would you be willing to get coffee? Before the timing puzzle resolves itself?"

  Elena smiled, though her eyes were wet. "Yes, Artie. I would."

  "Good." He stood up, gripping the edge of the desk for a second to steady himself. "Because while I'm here, I find I prefer the coffee to the argument."

  "Me too."

  They walked out of the study together, leaving the books to argue with the silence.
