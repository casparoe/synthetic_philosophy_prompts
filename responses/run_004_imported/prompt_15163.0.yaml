answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I have the distinct honor of being in a seminar with Theo, which means I've spent the last four months listening to him explain why the statue in the town square is not, metaphysically speaking, the clay it's made of.

  And I have to start by addressing the elephant in the room. Or rather, the metaphysical constraint in the room. Before I started writing this, Mara pulled me aside and gave me a very specific warning. She said, "If you get up there and say 'today, two become one,' I will glare at you from the altar."

  Now, for half of you, that sounds like a normal bridezilla moment. But for the people in the back row wearing the tweed jackets, you know this is actually a rigorous philosophical boundary. Because Mara is right. If Theo and Mara became *identical*, they would have to share all the same properties. By Leibniz's Law, if $x$ is identical to $y$, then everything true of $x$ is true of $y$.

  And that is simply not a good foundation for a marriage.

  Because, as Theo would tell you, while the statue and the clay occupy the same space at the same time, they have different survival conditions. If you squash the clay into a ball, the clay survives. But the statue? The statue is gone. It ceases to exist.

  And I think that is actually a beautiful way to talk about love.

  Mara and Theo, you are not becoming one thing. You are not melting into a single blob of shared existence where your individual properties dissolve. That would be a category error. Instead, you are entering into what we might call a *constitution relation*.

  You are going to occupy the same space. You're going to share the same kitchen, the same bank account, probably the same Wi-Fi password. But you remain distinct objects. You have different modal profiles. Which means, when life tries to squash you—and it will—Mara might survive it one way, and Theo might survive it another. And that is okay. You don't have to break the same way to be together.

  In fact, that distinction is what makes this work. If you were truly identical, you'd be redundant. Why have two of the same thing? But because you are distinct, you constitute something new together without losing what you are individually. The clay supports the statue. The statue gives the clay its form. But neither is the other.

  So, I promise, Mara, I will not say you are becoming one. That would be false.

  I also promise to keep this under five minutes, although I know there is a stage-theorist in the third row—hi, Dave—who believes this toast is just a series of temporal stages of me speaking, and that the "end" of the toast already exists in the future, so I should probably just wrap it up now to satisfy his ontology.

  But for the rest of you, who experience time as a flowing river and not a stack of snapshots, here is what I actually want to say.

  We often talk about marriage as a merger. But looking at you two, it looks more like... scaffolding. You hold the shape of each other's lives. You allow each other to stand up in a world that can be pretty squashing. You don't need to be the same material to make a masterpiece.

  Theo, you've spent years arguing that objects are distinct from their parts. But I think today you've proven that distinct objects can still fit together perfectly. Mara, you've proven that you can love a man who argues with inanimate objects, which is a level of patience that deserves its own degree.

  So, if everyone could please raise a glass.

  To Mara and Theo. May you never be identical. May you never be indiscernible. And may you always, always constitute something beautiful together.

  To the bride and groom!
