prompt: |-
  Ok so I need a sanity check on something that's been messing with my head lately. I'm in the second year of a phil logic/language MA and my whole thesis is basically built around Frege's stuff on sense and reference and the anti-psychologism in the Grundlagen. Last month a guy in my cohort who's way more into the history side of things told me about this diary Frege apparently kept in 1924, like a year before he died, that got dug up decades later and published in the 90s. Apparently it's full of pretty ugly stuff - ranting about Jews having too much influence and needing to loose their political rights, going on about how democracy and the whole Weimar system are ruining Germany, hoping for some kind of strongman to take over, and being hostile to Catholics, the French, socialists, basically anyone who wasn't his exact flavor of conservative nationalist. I'd always vaguely known he was a difficult, cranky guy but had no idea it went this far into actual hardcore right-wing teritory.

  Now I feel genuinely weird sitting down to work on this thesis. I asked my advisor about it and she kind of shrugged and said something like "the logic doesn't care who invented it, plenty of brilliant people were awful, focus on the arguments," which is probably true but feels like it's dodging what's actually bugging me. Because here's the thing I can't shake: Frege spent his whole career trying to purify logic and math from anything "merely psychological," insisting there's this objective, impersonal realm of thought that has nothing to do with messy individual minds - and then it turns out that in his old age he wanted German politics purified of Jews and pluralism and parliamentary messiness in what feels like a pretty similar spirit. Is that an actual meaningful connection worth taking seriously, or am I just pattern-matching two unrelated things to make a tidier story? And separately - even if there's no deep connection at all, does finding this out give me any legitimate reason to change how I engage with his philosophical work, or should I just take my advisor's advice and compartmentalize?
