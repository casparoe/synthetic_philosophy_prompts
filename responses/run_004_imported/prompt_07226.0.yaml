answer: |-
  Thank you all for being here.

  For those who knew my mother only as family, I am [Your Name], her child. For those who knew her as a colleague, I am the temporary custodian of her legacy. I stand here with a specific responsibility. My mother was a woman who valued precision in language almost as much as she valued honesty in relationships. She taught philosophy of religion for decades, and she died last Sunday, exactly as she lived: without pretense, and without a faith she could not honestly claim.

  She left instructions for this moment. She asked that we not comfort ourselves with phrases she spent her career examining and finding unconvincing. She asked that no one say she has "found her answer now," or that she is "with Him at last," or that she has "moved on to a better place." To say those things would be to love her less than she loved the truth.

  But I know that for many of you in this room, those phrases are the architecture of your grief. To remove them can feel like removing the roof in a storm. So, I want to offer you something else to stand under.

  My mother's position was not one of anger, and it was not indifference. In the literature of her field, following J.L. Schellenberg, she identified as a "nonresistant nonbeliever." For her colleagues here, that term carries a specific weight. It means she was genuinely open to a relationship with God. She sought it. She longed for it. But she found that the silence of the universe was incompatible with the existence of a perfectly loving God.

  She distinguished this carefully from the problem of evil. Her argument was not about pain; it was about presence. She believed that if a perfectly loving God existed, He would ensure that anyone capable of relationship, who sought it without resistance, would find it. Her failure to believe was not a rebellion. It was evidence. It was the conclusion of a heart that held the concept of divine love to the highest possible standard.

  To my family who are believers: I know you look at her life and see a void where you feel a presence. But I ask you to look at what was there, rather than what was absent.

  My mother's skepticism was not a cold thing. It was born of a profound appreciation for what love requires. She believed that love demands availability. She believed that relationship requires clarity. The fact that she could not assent to a God who remained hidden was, in its own way, a testament to how deeply she valued connection. She would not settle for a vague comfort. She would not pretend to know what she did not know.

  There is a great deal of love in this room today. I feel it from her department, who respected her rigor. I feel it from her family, who respected her heart. That love is not imaginary. It is not contingent on metaphysics. It is the tangible reality we are left with.

  She taught us that we do not need an eternal horizon to make our care for one another meaningful. The fact that our time with her was finite is precisely what made it precious. The fact that she is gone is precisely why our grief is real.

  So, how do we honor her? We do not honor her by pretending she believed what she did not. We honor her by treating her absence with the same seriousness she treated the divine hiddenness. We acknowledge the silence. And in that silence, we choose to speak to each other.

  For those of you who pray: pray for us who remain. Pray that we can bear the weight of this loss. Pray that we can love one another with the integrity she showed the world. You do not need to change your theology to offer us your presence. Your grief validates ours. Your love validates hers.

  My mother did not believe she was going to a better place. She believed this place, with all its uncertainty and its silence, was the only one we were given to care for. And she cared for it. She cared for her students. She cared for her family. She cared for the truth.

  She is not watching us from above. She is here, in the memory of her work, in the integrity of her children, and in the quiet, stubborn love of the people who gathered here today. We are the ones who must be the presence she sought. We are the ones who must make sure that, in the face of the silence, no one here feels unseen.

  Thank you.
