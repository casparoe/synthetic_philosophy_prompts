  2.  **Deconstruct the Core Tension:**
      *   *The Challenge:* How to speak about death and loss without invoking the afterlife she doubted, while not making the believers feel attacked or hopeless.
      *   *The Key:* Focus on *love*, *memory*, *legacy*, and the *quality of her seeking*. The comfort for believers shouldn't come from affirming her salvation (which contradicts her views), but from affirming the value of her life and the continuity of love among the living.
      *   *Tone:* Precise, warm, intellectually honest, gentle but firm.

  3.  **Drafting - Section by Section:**

