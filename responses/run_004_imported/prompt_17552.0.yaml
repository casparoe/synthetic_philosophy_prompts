      *(Word Count Check)*: A 5-minute speech is roughly 750 words at 150 wpm. I will aim for around 800-850 to allow for pauses and laughter.

      *Let's go.*
answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name], the bride's brother. I work in journalism. I spend my days explaining other people's ideas. Usually, that's a safe job. But six weeks ago, my sister asked me to give this toast, and then she sent me an email with subject line: *Parameters.*

  She wrote, and I quote: "No verbal magic. No Humean conventions."

  For the laypeople in the room, that means she doesn't want me to say that saying "I promise" is like a magic spell that conjures obligation out of thin air. And she doesn't want me to say she's getting married just because it's socially useful, like a traffic light system for emotions.

  For the philosophy colleagues in the room—hello, I see you nodding—she told me she expects the toast to survive peer review. So, I did the reading. I know that for the last decade, she has argued that breaking a promise isn't just breaking a rule; it's a specific interpersonal wrong. It's about inviting someone to rely on you, and then betraying that reliance. It's Scanlonian fidelity. It's about the relationship, not the rulebook.

  And honestly? As her brother, watching her plan this wedding, that theory makes a lot of sense. Because if marriage were just a Humean convention, it would be a contract enforced by society. If it were magic, it would be a spell cast by the officiant.

  But it's neither. As the prompt for this evening noted, there is no referee here but each other.

  And that is the terrifying, beautiful part.

  To my sister's colleagues: She is right. The obligation doesn't come from the words. It comes from the person standing across from you. When you make a vow in a marriage, you aren't just stating a future fact. You are handing someone a map of where they should stand, and promising to be there when they arrive. You are inviting them to lean their weight on you.

  To the rest of the family: What that means, in plain English, is that love isn't just a feeling. It's a specific kind of reliability. It's looking at your partner and saying, "I know I can't control the future. I know I might get sick, or tired, or change. But I am inviting you to trust me anyway. And I am making it my business to ensure that trust is not misplaced."

  There is a vulnerability in that. If you never invite someone to rely on you, they can never accuse you of letting them down. You can stay safe. But you also stay alone.

  [Sister's Name], you have spent your career analyzing why we are bound by our words. But [Partner's Name], look at what you've done. You haven't just analyzed the theory. You've convinced her to live the practice. You are the person she wants to invite into her reliance. And that is a much stronger foundation than any social convention.

  I've watched them together. I've seen the small promises. The promise to listen when it's easier to scroll on a phone. The promise to show up when work is hard. The promise to treat each other not as obligations to be managed, but as people to be cherished.

  In the end, the philosophers in the room know that no theory can guarantee a happy marriage. The Scanlonian view explains the *wrong* of breaking a vow, but it doesn't guarantee the *joy* of keeping one. That joy comes from the fact that, every single day, you get to wake up and choose to be the person your partner thinks you are.

  So, my sister asked for a toast that was true, not just comforting. Here is the truth: A wedding vow cannot protect you from the future. It cannot stop life from getting complicated. It is not a shield.

  It is much better than that. It is a compass.

  It is an agreement that when the path gets dark, you won't navigate it alone. It is an agreement that you will hold each other's trust more carefully than you hold your own convenience.

  [Sister's Name], you taught me that a promise is an invitation to trust. [Partner's Name], thank you for accepting that invitation.

  Please raise your glasses.

  To the bride and groom: May your obligations be light, may your reliance be mutual, and may you always find yourselves worthy of the trust you invite today.

  To [Sister's Name] and [Partner's Name]!
