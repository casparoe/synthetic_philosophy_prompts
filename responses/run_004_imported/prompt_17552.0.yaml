prompt: |-
  My sister is an assistant professor of philosophy who has spent most of the last decade publishing on the ethics of promising, and she is getting married in six weeks. Naturally, she has asked me — someone who covers science and ideas for a living and is far more used to explaining other people's thinking than generating any of my own — to write the toast. I said yes before I understood what I was agreeing to. She has already ruled out the two easiest ways to write this speech: she doesn't want a toast that treats the words "I promise" as a kind of verbal magic that conjures an obligation out of nothing, and she doesn't want her own vow quietly reduced to what she calls, half-affectionately, "a Humean convention" — Hume's argument that keeping a promise is an artificial virtue we uphold only because the practice happens to be useful to society, with nothing more solid underneath it. She has spent just as long teaching the rival view, associated with Scanlon, that breaking a promise wrongs someone specifically because you deliberately invited their trust and reliance and then let them down — which makes the wrong closer to a kind of exploitation than to the breaking of a rule.

  About a third of the guests are former classmates and colleagues who worked through this exact literature alongside her and will know immediately if the toast hand-waves past the hard part of that disagreement. Everyone else, including our own parents, has never spent a minute wondering why promises bind and mostly wants to laugh, maybe get a little teary, and feel good about the marriage. Could you write the five-minute toast I now owe her — one that takes the question seriously enough to survive the philosophers in the room, stays genuinely warm and funny for everyone else, and still arrives at something true, rather than merely comforting, to say about the vow she and her partner are about to exchange with no referee but each other?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Science/ideas journalist (used to explaining, not generating original thought).
      *   **Audience:** Mixed. 1/3 are philosophy colleagues/classmates (experts in ethics of promising, specifically Hume vs. Scanlon). 2/3 are family/friends (want warmth, humor, emotion).
      *   **Honoree:** Sister, assistant professor of philosophy, specializes in ethics of promising.
      *   **Constraints/Preferences:**
          *   NO "verbal magic" (simple utterance creates obligation).
          *   NO "Humean convention" (promise keeping is just socially useful artificial virtue).
          *   MUST acknowledge the Scanlonian view (breaking a promise is betrayal of trust/invited reliance).
          *   TONE: Serious enough for philosophers, warm/funny for laypeople, true (not just comforting).
          *   LENGTH: ~5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Goal:** A toast that navigates the philosophical minefield while celebrating the marriage.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *The "Magic" View:* "I promise" = *abracadabra*. (Rejected by sister).
      *   *The Humean View:* Promises are a social technology. We do it because society collapses otherwise. It's useful, not inherently moral. (Rejected by sister).
      *   *The Scanlonian View:* Promises create a specific interpersonal expectation. Breaking it is a betrayal of the trust *you* invited. It's about the relationship, not the rule. (Preferred by sister).
      *   *The Twist:* Marriage isn't just about *keeping* promises; it's about the *context* in which they are kept. It's about the person, not just the principle.

  3.  **Determine the Angle/Theme:**
      *   The toast needs to bridge the gap between high theory and human reality.
      *   *Idea:* Philosophy tries to universalize the promise. Marriage particularizes it.
      *   *Idea:* The "referee" mentioned in the prompt is key. There is no external enforcement.
      *   *Idea:* Acknowledge the sister's expertise but pivot to the *risk* of promising.
      *   *Core Argument:* A promise isn't a shield against the future; it's a commitment to navigate the future together. The Scanlonian view is right (it's about trust), but marriage adds a layer: it's about *renewing* that trust when the context changes.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the pressure. Make a joke about the assignment. Establish the speaker's role (journalist vs. philosopher).
      *   **The Philosophical Hook:** Address the "ethics of promising" elephant in the room. Mention the constraints (no magic, no Hume). Show the colleagues I did the homework.
      *   **The Scanlonian Turn:** Explain the "trust/invitation" concept simply but accurately. This satisfies the experts.
      *   **The Marriage Pivot:** How does this apply to *this* marriage? It's not a contract; it's a dynamic relationship. The "referee" is each other.
      *   **The Emotional Core:** Promises in marriage aren't just about obligation; they're about *wanting* to be the person the other relies on. It's about the "invitation to rely."
      *   **The Conclusion:** Raise a glass. Connect the theory back to love.

  5.  **Refining the Tone:**
      *   *Humor:* Self-deprecating about the speaker's lack of philosophical chops. Gentle ribbing of the sister's specificity.
      *   *Warmth:* Focus on the partner (need a placeholder name, let's use "[Partner's Name]"). Focus on the bond.
      *   *Rigor:* Ensure the Scanlon/Hume distinction is accurate enough for the colleagues not to roll their eyes.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm a journalist. My sister is a philosopher. She gave me a hard assignment. No magic promises. No Hume. She likes Scanlon. Scanlon says promises are about trust. Marriage is about trust. But marriage is harder because there's no police. You have to want to keep the promise. So here's to [Partner]. You are inviting trust. Cheers.

      *Critique 1:* Too dry. Needs more flow and emotion. Needs to sound like a speech, not an abstract.

  7.  **Drafting - Iteration 2 (Adding Flesh):**
      Start with the anxiety. "She sent me a reading list." That's funny. Address the colleagues: "I know you know this." Explain Scanlon simply: "I'm asking you to trust me." Apply to marriage: "Marriage is a lot of promises." But it's not a contract. It's a life.
      *Key Insight:* The prompt says "no referee but each other." Use that. The Scanlonian view relies on the *inviter*. In marriage, you are both the inviter and the invitee.

  8.  **Final Polish (incorporating specific constraints):**
      *   Make sure not to call it "magic."
      *   Make sure not to call it just "socially useful."
      *   Ensure the Scanlonian "principle of fidelity" is alluded to (inviting expectation).
