      *(Self-Correction during drafting)*: I need to make sure I don't get *too* bogged down in the philosophy that the parents get bored. I need to translate "principle of fidelity" into "human language" quickly.
      *Translation:* "It's not about the rule; it's about the person you let down."

      *Ending:* Needs to be a toast.

  9.  **Final Review against constraints:**
