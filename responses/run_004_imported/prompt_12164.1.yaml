      *   *Comment:* "This is the most important sentence in the response. AP readers look for the 'missing word' argument specifically. Connecting the missing word to the Preamble's promises makes this a definitive 2/2 on the textual evidence."
  3.  **On the Reasoning (Nuance Check):**
