      *   *Comment:* "Your point about nonviolence vs. legal weapons is perfect. Just a heads-up for the exam: Gerrit Smith was the bigger influence on his Constitution view than John Brown (who came slightly later), but your explanation of the ideological split (moral suasion vs. political action) is still completely correct for full credit."

