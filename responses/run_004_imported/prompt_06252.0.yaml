answer: |-
  This is an exceptionally sharp reading of Chapter VI. You have identified what is arguably the most delicate balancing act in *Principia Ethica*: the relationship between Moore's metaphysical realism about value (established via the Isolation Test) and his axiological holism (established via Organic Unities).

  Many readers glide over this because they are distracted by the Naturalistic Fallacy, but your intuition is correct: if the unobserved beautiful world is *too* valuable, it undermines the special status of the "Ideal" (conscious appreciation). If it is *not* valuable enough, the Isolation Test seems to lose its bite against subjectivism.

  Here is an explanation of how Moore resolves this tension structurally, followed by an analysis of why the analogy to personal affection behaves differently in his framework.

  ### 1. Resolving the Tension: Existence vs. Magnitude

  The key to untangling this lies in distinguishing what the Isolation Test proves versus what the doctrine of Organic Unities explains.

  **The Role of the Isolation Test**
  When Moore asks you to imagine the beautiful world in "absolute isolation" (PE, §113), his primary goal is **ontological**, not axiological. He is fighting a war on two fronts:
  1.  **Against Hedonism:** To show that pleasure is not the *only* intrinsic good.
  2.  **Against Subjectivism:** To show that value is not *constituted* by the mental state of the observer.

  By granting that the unobserved beautiful world is better than the unobserved ugly one, Moore establishes that beauty possesses *some* intrinsic value independent of consciousness. However, and this is the crucial pivot, he does **not** claim that this value is *great*.

  **The Role of Organic Unities**
  Moore's doctrine of Organic Unities states that the value of a whole is not identical to the sum of the values of its parts. In Chapter VI, he applies this to the "Ideal." The Ideal is not just "Beauty + Consciousness." It is the organic unity of *the cognition of a beautiful object combined with the appropriate emotion.*

  Moore explicitly addresses the magnitude issue. He argues that while the unobserved beautiful object has positive intrinsic value, that value is **comparatively trivial** when weighed against the value of the conscious appreciation of it.

  Here is the structural resolution to your puzzle:
  *   **The Isolation Test** proves that $V(\text{Beauty}) > 0$ even when $\text{Consciousness} = 0$.
  *   **Organic Unities** proves that $V(\text{Consciousness of Beauty}) \gg V(\text{Beauty}) + V(\text{Consciousness})$.

  The tension you feel arises if one assumes that the value of the unobserved beauty is a significant chunk of the total value available. Moore's argument relies on the claim that the unobserved beauty is a *minor* good, while the conscious appreciation is a *major* good. The Isolation Test secures the *reality* of the object's value (preventing the Ideal from collapsing into pure subjectivism), while Organic Unities secures the *supremacy* of the mental state (preventing the Ideal from collapsing into a dry realism where human experience doesn't matter).

  So, the Isolation Test bears the weight of proving **objectivity**, but it is not intended to bear the weight of **significance**. Once objectivity is secured, Organic Unities takes over to explain why the "Ideal" is the *summum bonum*. The unobserved world is good, but a world with someone to love it is vastly better—not because the beauty's value disappears, but because the relation creates a new, more valuable whole.

  ### 2. The Personal Affection Analogy

  Your friend's pushback regarding personal affection is astute. Can we run the Isolation Test on a virtuous person? *Is a world with an unloved, unknown virtuous person better than one with an unloved, unknown vicious person?*

  Moore's framework licenses a "Yes," but with a significant ontological caveat that distinguishes it from the beauty case.

  **The Ontological Difference**
  For Moore, "beauty" is a property that can inhere in non-mental objects (landscapes, patterns). "Virtue," however, is defined as a disposition of the **will**. A virtuous person, by definition, possesses a certain state of mind (a will to bring about good consequences).
  *   **In the Beauty Case:** The Isolation Test separates the *object* (beauty) from the *mind* (observer).
  *   **In the Affection Case:** The "object" of the Isolation Test is itself a *mind* (the virtuous agent).

  Therefore, when you imagine the "unloved virtuous person" in isolation, you are not imagining a value-bearing object devoid of consciousness. You are imagining a consciousness (the virtuous will) devoid of *reciprocal* consciousness (love from others).

  **Does it have value?**
  Moore argues that a virtuous will (the disposition to do good) is intrinsically good, even if it never succeeds in producing good consequences and even if no one loves the agent. So, yes, the world with the unloved saint is better than the world with the unloved sinner.

  **Why Affection Resists the Split**
  However, Moore argues that personal affection (love/friendship) is only a great good when it is reciprocal or directed at something truly good.
  *   If I love a virtuous person, that is an organic unity: *My love + Their virtue.*
  *   If I love a vicious person, the value is significantly diminished (or becomes neutral/negative), because the cognition is false (I believe they are good, they are not).

  This is where the analogy to beauty diverges.
  *   **Beauty:** The value of appreciating beauty remains high even if the beauty is "mere" appearance (though Moore prefers true beauty).
  *   **Affection:** The value of affection is heavily dependent on the *worthiness* of the object.

  Consequently, the "unloved virtuous person" scenario is structurally different from the "unobserved beautiful world."
  1.  **Unobserved Beauty:** Value resides in the object (small) + Value resides in the potential appreciation (large).
  2.  **Unloved Virtue:** Value resides in the agent's will (moderate) + Value resides in the *lack* of reciprocal affection (missing out on the Ideal).

  Moore would say the unloved virtuous person is a good thing, but they are missing out on one of the greatest goods (being loved/loving). The tension is less acute here because virtue is inherently mental. You cannot have "virtue in absolute isolation" in the same way you can have "beauty in absolute isolation," because virtue *is* a mental state. The Isolation Test on virtue isolates the mind from *other* minds, not from mind *simpliciter*.

  ### 3. Summary for Your Piece

  For your article on early twentieth-century intuitionism, the takeaway is this:

  Moore uses the **Isolation Test** as a scalpel to separate *value* from *pleasure*, proving that value exists in the object. He then uses **Organic Unities** as a magnifying glass to show that while the object has value, the *reflection* of that object in a conscious mind creates a value explosion that dwarfs the object alone.

  The puzzle dissolves when we recognize that Moore is a **pluralist about value sources** but a **monist about value hierarchy**.
  *   **Pluralist:** Both unobserved beauty and conscious appreciation are intrinsically good.
  *   **Hierarchist:** Conscious appreciation is orders of magnitude more valuable.

  Regarding affection: The framework holds, but the "isolation" is different. We cannot isolate affection from a mind (it is a mental state), but we can isolate a virtuous mind from reciprocal love. Moore grants that the virtuous mind is good in isolation, but insists the *organic unity* of mutual affection is the true peak of the Ideal.

  This structure allows Moore to maintain that the universe would be better if it contained beauty even without us (anti-anthropocentrism), while simultaneously maintaining that the universe is vastly better because we are here to appreciate it (humanistic idealism). The tension you spotted is the hinge on which he swings between realism and idealism.
