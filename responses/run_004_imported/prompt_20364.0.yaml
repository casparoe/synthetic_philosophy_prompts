      *   **Proposal:** Moderators see *only* the post first, record verdict + confidence, *then* see history/notes and may revise.
      *   **Argument For (Blind):** Reduces bias (halo/horn effect) from account history influencing the interpretation of the content itself (borrowed from blind grading).
      *   **Argument Against (Context):** Context-free reading is a myth; interpretation *requires* priors. Account history is diagnostic signal (e.g., reclaimed slurs vs. hate speech). Withholding it adds friction without removing bias, just swapping priors.
      *   **Requirements:** Concrete recommendation (Adopt, Modify, Shelve), Metrics/Measurement plan, Fair accounting of the losing side's strongest point.
      *   **Tone:** Professional, balanced, evidence-based, decisive (it's a recommendation memo).

  2.  **Determine the Recommendation:**
