      *   *Anchoring Bias:* Once you see a solution, it's hard to unsee it. It becomes the "default."
      *   *Functional Fixedness:* You start seeing the problem only through the lens of the known tools.

  4.  **Identify the Justifications for the Advisor's Rule:**
      *   **Cognitive Psychology:**
          *   *Anchoring:* The first idea you encounter sticks.
          *   *Einstellung Effect:* The tendency to rely on familiar methods even when better ones exist.
