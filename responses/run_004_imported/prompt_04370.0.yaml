answer: |-
  This is a classic tension in mathematical training, and your intuition is logically sound from the perspective of a **perfect rational agent**. In decision theory, having more information should never decrease your expected utility because you can always choose to ignore it.

  However, human mathematicians are not perfect rational agents. We are bounded rational agents subject to specific cognitive biases. Your advisor's rule is not superstition; it is a heuristic designed to mitigate specific psychological phenomena that hinder creative problem-solving.

  Here is the breakdown of why "less information" can actually yield a higher probability of a novel breakthrough, along with the risks involved.

  ### 1. The Cognitive Science: Anchoring and the *Einstellung* Effect
  The primary justification for your advisor's rule is the **Einstellung Effect** (or "set effect"). This is a psychological phenomenon where a person's familiarity with a specific method or solution prevents them from finding a better or more appropriate one.

  *   **Anchoring:** Once you see a standard approach, it becomes an "anchor." Even if you try to ignore it, your brain subconsciously treats it as the "correct" path. Your subsequent brainstorming becomes a local search around that anchor rather than a global search of the solution space.
  *   **Path Dependence:** If you read the literature first, you inherit the *definitions* and *lemmas* the previous authors found useful. You start playing their game. If you struggle first, you might define the objects differently, leading to a fundamentally different formalization of the problem.

  **The Counter-Intuitive Logic:**
  You asked: *"How could having more relevant info beforehand ever leave me worse off... when I can always just ignore it?"*
  **Answer:** You cannot ignore it. Information is not just data input; it alters the **search algorithm**. Seeing a solution changes the topology of your mental search space. It creates a "gravity well" that pulls your intuition toward the known solution, making it cognitively expensive to explore distant, potentially superior, regions of the idea space.

  ### 2. Building "Obstacle Intuition"
  In math, knowing *that* a theorem is true is different from knowing *why* it is true.
  *   **The Struggle Teaches the Obstacles:** By banging your head against the wall for two weeks, you learn exactly *where* the wall is hard. You discover which naive approaches fail and, crucially, *why* they fail.
  *   **Appreciating the Machinery:** When you finally read the literature, you don't just see a proof; you see a key fitting into a lock you already examined. You understand the *necessity* of the conditions. If you read the proof first, you might think, "Oh, they used a compactness argument." If you struggle first, you think, "Ah, the sequence kept escaping to infinity; compactness was the only way to trap it."
  *   **Generalization:** Researchers who develop their own intuition before reading are often better at generalizing results later because they understand the structural constraints, not just the technical machinery.

  ### 3. Developing Research Independence
  A PhD is not just about solving problems; it is about transforming from a consumer of math to a producer.
  *   **Tolerance for Ambiguity:** Research is mostly being lost. If you always consult the map (literature) immediately, you never build the internal compass required for when there *is* no map (i.e., when you are actually working on an open problem).
  *   **Idea Generation Muscle:** If you always outsource the "setup" phase to the literature, you atrophy your ability to generate initial strategies. Your advisor is forcing you to practice the skill of **ideation**, not just **verification**.

  ### 4. The Risks (Where your intuition is right)
  Your skepticism is valid because this heuristic has diminishing returns and significant risks.
  *   **Reinventing the Wheel:** If you spend two weeks deriving a lemma that was proven in 1974, that is inefficient. However, in a PhD, the *process* of deriving it is often more valuable than the result itself.
  *   **Technical Barriers:** In highly technical fields (e.g., modern arithmetic geometry or PDEs), you literally cannot make progress without specific machinery developed in the last 10 years. In these cases, the "struggle first" rule can be wasteful.
  *   **Time Scarcity:** A PhD has a time limit. Indefinite struggling is dangerous. The "couple of weeks" constraint is the safety valve that makes this advice reasonable rather than negligent.

  ### 5. Why "Ignoring It" Doesn't Work
  To address your core logical objection again: The idea that you can "just ignore" the literature assumes your brain works like a computer file system where you can choose not to load a file.
  In reality, human memory is associative. Once you know the standard approach, it is activated whenever you see the problem statement. It requires active cognitive effort to suppress that knowledge (inhibition), which drains the mental energy you need for creative synthesis. It is easier to explore a forest you've never seen than a forest where someone has already cut a trail that you are trying desperately not to follow.

  ### Summary
  Your advisor's rule is **justified by cognitive psychology and pedagogical experience**, not superstition.

  *   **It is not about information efficiency;** it is about **creative diversity**.
  *   **It is not about ignoring knowledge;** it is about **delaying exposure** to allow your own intuition to crystallize.
  *   **It is a training strategy:** Once you are an established researcher, you might adjust this rule. But during training, the goal is to maximize your capacity for independent thought, even at the cost of short-term efficiency.

  **Recommendation:** Follow the rule, but keep a notebook of your "failed" attempts during those two weeks. When you finally read the literature, compare your failed attempts with their successful ones. That comparison is often where the real PhD-level insight lives.
