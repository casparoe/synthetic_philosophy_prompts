  9.  (Review against constraints): The user asked if there is a principled basis or if it's a judgment call. I must answer "Yes, there is a principled basis" clearly.

  10. (Final check of the "photo vs original" point): This is the strongest argument against the user's own observation. I need to highlight that brushwork is 3D (impasto), which photos flatten.

  11. (Final check of "Student" vs "Master"): Sometimes a student working in the master's studio is historically interesting. Don't let the user feel a "student" attribution is worthless.

