      *   **The Mathematical Reality:** The Impossibility Theorem (Kleinberg, Mullainathan, Raghavan 2016; Chouldechova 2017). You generally cannot satisfy both metrics simultaneously if the base rates (overall reoffense rates) differ between groups.

  3.  **Determine the "Truth":**
      *   Is the vendor right? Partially. Calibration *is* a valid and important metric.
