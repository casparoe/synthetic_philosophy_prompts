answer: |-
  This is one of the sharpest questions to ask about Kripke's Wittgenstein (often called "Kripkenstein"). You are right to feel that the "finitude" objection sounds like a mere engineering problem. If I can't calculate $10^{100} + 1$ because I'll die first, isn't that just a limitation of my hardware, not a proof that I don't *mean* addition?

  The reason philosophers treat this as a metaphysical disaster rather than a practical annoyance comes down to what a "fact of the matter" is supposed to do.

  Here is the breakdown of why the finitude of dispositions fails, and how it inevitably crashes into the normativity problem.

  ### 1. Why Finitude is Metaphysical, Not Practical

  The dispositionalist says: *"You mean PLUS because you are disposed to answer with the sum."*

  Kripke's finitude objection points out that for any human, there is a number $N$ so large that you have **no disposition at all** to answer "$N + 1$." You would suffer a stroke, run out of paper, or die before forming the thought.

  **The Practical View (Your Intuition):**
  "Well, sure, I can't compute it. But if I *could*, I would give the sum. The meaning is there, my brain just isn't big enough to execute it."

  **The Kripkenstein View:**
  The dispositionalist is trying to ground meaning in **natural facts** about your physical/mental state. They want to say meaning *just is* the disposition.
  *   If meaning *is* the disposition, and the disposition stops existing at number $N$, then **your meaning stops existing at number $N$.**
  *   According to strict dispositionalism, for numbers larger than $N$, you do not mean addition, you do not mean quus, you mean *nothing*. You have no semantic fact covering those cases.

  But intuitively, you *do* mean something. You understand the rule of addition as general and infinite. You intend to cover those numbers. If the dispositional account implies that your meaning has a "cut-off point" where you suddenly mean nothing, the account fails to capture what meaning *is*.

  ### 2. The Trap of Idealization

  To fix the finitude problem, the dispositionalist usually retreats to **Ideal Dispositions**.
  *"Okay, fine. I don't mean what I **would** answer. I mean what I **would** answer **if** I had infinite time, perfect memory, and no brain cramps."*

  This is where the argument turns from "technical limitation" to "circularity."

  Kripke asks: **What fixes the idealization?**

  There are infinite ways to "idealize" a finite being.
  1.  **Idealization A:** If I had more brain power, I would continue the pattern I've established (Plus).
  2.  **Idealization B:** If I had more brain power, I would realize the pattern was actually Quus and diverge at $10^{100}$.

  Both are consistent with my actual, finite past behavior. So, what fact about me determines that Idealization A is the "correct" one and Idealization B is "incorrect"?

  *   If you say, "The correct idealization is the one that matches what I **mean**," you are being circular. You are using meaning to explain the disposition, rather than using the disposition to explain meaning.
  *   If you say, "The correct idealization is the one that matches my physical structure," you run back into the finitude problem. My physical structure is finite. It doesn't contain a fact about infinite outputs.

  So, the move to idealization admits that the actual physical dispositions aren't enough. You need a *norm* to select the right idealization. But dispositions are supposed to be brute facts, not norms.

  ### 3. The Normativity Complaint

  This leads directly to the normativity objection, which is the hammer that finishes the job.

  **The Distinction:**
  *   **Dispositions are Descriptive (Is):** They predict what you *will* do.
  *   **Meaning is Normative (Ought):** It dictates what you *should* do.

  **The Problem of Error:**
  Suppose I mean PLUS. But I am tired, drunk, or just bad at math. When asked "68 + 57", I am actually **disposed** to say "124" (a mistake).
  *   **Dispositional Account:** Since I was disposed to say 124, that means I *meant* a function that yields 124 there. I wasn't wrong; I was just consistent with my disposition.
  *   **Intuition:** I *meant* PLUS. I *should* have said 125. I made a mistake.

  For the dispositionalist to say I made a mistake, they have to distinguish between my **actual disposition** (to err) and my **correct disposition** (to get it right).
  *   But how do they distinguish those without already knowing what I mean?
  *   To say "That disposition was a mistake" is to say "That disposition violated the rule I meant."
  *   But the whole project was to explain "the rule I meant" *in terms of* dispositions.

  You cannot use dispositions to explain meaning, because you need meaning to tell you which dispositions count as "correct" and which count as "mistakes."

  ### 4. How Finitude and Normativity Tie Together

  Here is the synthesis of why your "practical limitation" intuition is exactly what Kripke is attacking.

  You want to say: *"My dispositions are finite, but my meaning is infinite. The gap is just a practical limitation."*

  Kripke replies: *"If the gap is just practical, then there must be a **fact** about you that bridges it. There must be something in your head right now that reaches out to those infinite cases you can't compute."*

  1.  **Finitude shows there is no physical fact:** Your brain states are finite. They cannot encode an infinite function. Therefore, the fact of what you mean cannot be a physical/dispositional fact.
  2.  **Normativity shows there is no functional fact:** Even if we look at how you function, function can only tell us what you *do*, not what you *ought* to do. It cannot distinguish following a rule from merely acting in a way that looks like following a rule.

  The "practical limitation" is only a practical limitation if you assume there is already a meaning there that is being limited. But Kripke is challenging whether there is a meaning there *at all* that isn't constituted by those limitations.

  If meaning were just dispositions, then:
  1.  You couldn't mean anything regarding numbers you can't compute (Finitude).
  2.  You could never be wrong about a calculation, only different (Normativity).

  Since both of those are absurd (we do mean things about big numbers, and we do make mistakes), meaning cannot be constituted by dispositions.

  ### Summary
  The finitude objection isn't about running out of time. It's about the **mismatch between finite facts and infinite content.**

  If meaning is a fact about you, it must be grounded in something. If it's grounded in dispositions, it's limited to what you can physically do. Since you intuitively mean more than you can physically do (you mean the *general rule*), the dispositions can't be the ground.

  And when you try to patch this by appealing to "what I *would* do ideally," you silently import **normativity** (what I *should* do). But dispositions are non-normative natural facts. You can't get an "ought" (the rule) from an "is" (the disposition). That is why the fix fails.
