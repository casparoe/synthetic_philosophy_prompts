answer: |-
  You are absolutely not missing something, and you have put your finger on one of the most famous and contentious debates in the foundations of probability. You are correct that Bertrand's Paradox is a "known sore spot," but it is **not** quietly ignored. It is actively discussed, and how one resolves it (or dissolves it) essentially defines which "tribe" of Bayesian you belong to.

  Here is the breakdown of why this hasn't sunk the Bayesian project, how Jaynes specifically tried to solve it, and why modern rationalists still use invariance arguments despite the paradox.

  ### 1. The Standard Mathematical Resolution: The Problem is Ill-Posed
  The first thing to acknowledge is that your premise contains the standard trap. You described the question as "one single well-posed question." In modern measure-theoretic probability, **it is not well-posed.**

  The phrase "choose a random chord" is ambiguous. Probability is not a property of the chord; it is a property of the *measure* applied to the space of chords. Bertrand's Paradox doesn't show that probability logic is broken; it shows that the phrase "random chord" is undefined without specifying the **generative process**.

  *   **Method 1 (1/3):** Pick two random points on the circumference.
  *   **Method 2 (1/2):** Pick a random radius, then a random point on that radius.
  *   **Method 3 (1/4):** Pick a random point inside the circle as the midpoint.

  Most mathematicians consider the case closed here: if you don't specify the physical method of selection, the question has no answer. However, this is unsatisfying for **Objective Bayesians** (like Jaynes), who want to derive probabilities from states of knowledge alone, without needing to invent a physical experiment.

  ### 2. Jaynes' Specific Rebuttal (The "Well-Posed Problem")
  E.T. Jaynes did not ignore this. He wrote a specific paper titled *"The Well-Posed Problem"* (1973) to address Bertrand's Paradox directly. He argued that the problem *could* be made well-posed if we applied the Principle of Maximum Ignorance correctly.

  Jaynes argued that if we are truly ignorant of the method, we must demand that our probability distribution be invariant under transformations that do not change the problem statement.
  *   The problem statement doesn't specify the circle's **position**. (Translation invariance)
  *   The problem statement doesn't specify the circle's **orientation**. (Rotation invariance)
  *   The problem statement doesn't specify the circle's **size**. (Scale invariance)

  Jaynes showed that of the three classic methods, **only Method 2 (yielding 1/2)** satisfies all three invariances (specifically translation and scale invariance). Method 1 (endpoints) is not translation invariant (if you move the circle, the distribution of chords relative to the circle changes). Method 3 (midpoints) is not scale invariant.

  Therefore, Jaynes claimed 1/2 is the unique "objective" answer for a being with no knowledge of the throwing mechanism other than the geometry.

  **Is this accepted?**
  It is respected, but **not universally accepted**. Critics argue that Jaynes smuggled in assumptions. Why *must* the distribution be translation invariant? If the "experiment" is "pick two points on the rim," translation invariance isn't required. Jaynes assumes a "throwing straws at a circle" physical setup without explicitly stating it. So, while Jaynes didn't ignore the paradox, his solution is viewed by many as shifting the ambiguity from "how to pick a chord" to "which symmetries are mandatory."

  ### 3. Subjective vs. Objective Bayesians
  This is where the "Rationalist Sphere" (LessWrong, Slate Star Codex, etc.) nuance comes in.

  **Objective Bayesians (Jaynesians):**
  They believe there is a "correct" prior given a state of information. For them, Bertrand's Paradox is a challenge to refine their invariance criteria (e.g., using Group Invariance or Jeffreys Priors). They admit it's hard, but they believe a unique solution exists if you define the "state of information" precisely enough.

  **Subjective Bayesians:**
  They believe priors represent *personal* degrees of belief. For a Subjective Bayesian, Bertrand's Paradox is not a paradox at all.
  *   If I believe the chord is generated by Method 1, my probability is 1/3.
  *   If I believe it's Method 2, my probability is 1/2.
  *   If I am truly unsure which method is used, my prior should be a **mixture distribution** over the methods.

  For Subjective Bayesians, the contradiction disappears because the probability is conditional on the model ($P(Long | Model_1) \neq P(Long | Model_2)$). There is no single $P(Long)$.

  Most modern "rationalist" Bayesians lean Subjective or Pragmatic. They use invariance arguments (like Jeffreys priors) as **heuristics** to get a non-informative prior that won't mess up the likelihood too much, not as metaphysical truths. They know that if the parameterization changes, the Jeffreys prior might change, and they accept that trade-off.

  ### 4. Why Invariance Reasoning Survives
  If it fails on circles, why use it for real-world questions?

  1.  **It works for Location and Scale:** Invariance arguments are incredibly robust for standard statistical parameters. If you are measuring the mean height of humans, you want your prior to be invariant whether you measure in inches or centimeters (scale) or whether you shift the zero point (location). Jaynes' methods work beautifully here. Bertrand's Paradox is a geometric edge case where the parameter space is bounded and multi-dimensional in a tricky way.
  2.  **It's better than nothing:** In high-dimensional problems where you have no data, a symmetry-based prior (like Maximum Entropy) is often the only principled starting point. Even if it's not "objectively true," it prevents you from inserting *arbitrary* bias.
  3.  **Data Swamps the Prior:** In real-world applications, you usually get data. As long as the prior isn't zero where the truth lies, the likelihood will overwhelm the prior eventually. The choice between 1/3, 1/2, or 1/4 matters hugely in a toy problem with no data; it matters much less in a regression with 1,000 data points.

  ### 5. Summary: Is it a Sore Spot?
  Yes. It is the "Elephant in the Room" for Objective Bayesianism.

  *   **Did it sink the project?** No, but it forced a retreat. Very few people claim they can derive a unique prior for *any* problem based on logic alone anymore. The claim has been scaled back to "we can derive unique priors for problems with specific symmetry structures."
  *   **Do people ignore it?** No, it's a standard exam question in foundations of statistics courses.
  *   **Are you missing something?** You are missing the distinction that **most Bayesians today do not claim the prior is "true."** They claim it is "adequate for inference."

  The lesson rationalists take from Bertrand is not "invariance is useless," but rather **"be extremely careful about defining the generative model."** If you treat "random chord" as a shorthand for a specific physical process, the paradox vanishes. If you treat it as a purely logical abstraction, you must accept that logic alone cannot conjure a measure out of thin air.

  Jaynes tried to prove logic *could* conjure the measure via symmetry. He made a valiant attempt, but the consensus is that he essentially chose the symmetry group that matched his intuition about physical throwing. It remains a beautiful argument, but not a knock-down proof.
