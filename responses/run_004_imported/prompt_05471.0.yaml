answer: |-
  The dawn light was the color of bruised iron, leaking slowly over the headland. On the stone pier, Old Man Hemlock stood by the *Gull's Wing*, his hand resting on the brass casing of his barometer. The needle hovered just above *Fair*. He untied the stern line, cast off, and motored out past the breakwater. He did not look back. He was the first, so he had nothing but the glass and the sky to trust.

  Mara arrived ten minutes later. She watched the *Gull's Wing* disappear into the grey swell. She looked up at the gulls circling the harbor mouth; they were flying low, screaming against the wind, a sign she had learned from her father that meant pressure dropping. Her private reading said *Stay*. But she looked at the empty slip where Hemlock had been, then at the open water where his hull was now a speck. Hemlock had forty years on the water. If the weather were truly turning, he would know. To stay based on the gulls while he went out was to claim she knew better than forty years of experience. It was safer to assume the gulls were wrong than to assume Hemlock was foolish. She started her engine and followed his wake.

  Elias came third. He was younger, less sure of the water's moods. He checked his own barometer; the needle had ticked down since Hemlock left. His left knee, injured in a hauler accident three years prior, throbbed with a dull, familiar ache. The ache was a private truth, as real as the stone under his boots. It screamed *Storm*.

  He looked out at the harbor. Two boats were gone. The water behind the headland was invisible, hidden by the curve of the land. He stood with his hand on the cold railing, weighing the ache in his leg against the empty slips. If he stayed, he lost a day's catch. If he went and the storm broke, he risked the boat. But he was not deciding alone. Hemlock and Mara were already out there. They had their own instruments, their own knees, their own reads on the wind. If the danger were real, surely one of them would have seen it? To stay now was to assert that his single private signal outweighed the accumulated judgment of the fleet. It felt less like bravery and more like arithmetic. The weight of their departures pressed down on his doubt until the ache in his knee felt like a phantom pain, irrelevant against the evidence of the empty harbor. He cast off.

  By the time the sun cleared the headland, twelve boats had left. The harbor was quiet, save for the lap of water against the pilings. The consensus was physical: the water was safe. The private doubts of the second and third captains had been swallowed by the public action of the first, buried under the accumulating weight of those who followed. Each captain had looked at the growing line of wakes and seen safety, reinforcing the signal for the next.

  Then, just before noon, the *Gull's Wing* returned.

  It did not come back broken. There was no smoke, no distress flare. It simply appeared around the headland, engine throttled low, moving with a deliberate slowness that contradicted the morning's hurry. Hemlock tied up alone. He did not shout warnings. He simply began coiling his ropes, his face unreadable.

  Jory arrived at the pier an hour later. He was preparing for his turn, checking the fuel levels, when he saw Hemlock's boat docked. He looked at the empty slips where the other eleven captains should have been returning soon, but the horizon was clear. He looked at his own barometer. It was dropping fast.

  In the morning, Jory would have looked at the empty slips and ignored the barometer. The crowd's judgment would have overridden his glass. But now the public information was fractured. The morning's departures said *Go*, but Hemlock's return said *Stop*. The unanimity was broken. The crowd no longer spoke with one voice.

  Jory stood on the dock, the engine key cold in his hand. He looked at Hemlock, who was scrubbing salt from the deck, and then at the grey line of the horizon. The return of the first boat did not prove the storm was coming, but it stripped away the illusion of certainty. It meant that the previous departures were no longer proof of safety, merely evidence of earlier optimism. The weight of the crowd had vanished, leaving Jory alone with his own instruments.

  He looked at the barometer. He listened to the wind whistling in the rigging. Without the shield of the fleet, his private judgment was once again the only thing that mattered. It was no longer rational to follow the morning's track; the information behind those tracks had been invalidated by the return. To go out now would be to gamble on yesterday's weather.

  Jory put the key in his pocket. He walked over to the cleat and tightened the mooring line on his boat, securing it for the afternoon. He did not feel rebellious. He did not feel he was making a stand against the others. He was simply updating his position based on the new data.

  From the gallery above the harbor, a tourist watched the single boat tie up while the others remained out at sea. To the tourist, it looked like hesitation, perhaps fear. But on the dock, it was merely calculation. The spell was not broken by courage, but by a single visible contradiction. The harbor held its breath, waiting to see if the next captain to arrive would look at the empty slips and see danger, or look at the eleven boats still out past the headland and see safety. The balance was perfect, and terrifyingly light. A single boat moving one way or the other would tip the whole harbor into motion or stillness, regardless of what the sky actually did.
