      *   Ensure the follow-up targets the specific defense a SE theorist would use (e.g., appealing to *type* history rather than *token* history).

  5.  **Final Polish:**
      *   Check names (Wright, Neander, Millikan, Godfrey-Smith, Cummins).
      *   Ensure the distinction between SE and CR is clear in the phrasing.
      *   Add an intro and outro to frame the assignment helpfully.

