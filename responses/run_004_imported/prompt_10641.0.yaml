      *   **Format:** Each question needs a follow-up that anticipates a dodge and pushes back.

  2.  **Deconstruct the Selected-Effects (SE) Theory:**
      *   *Core Claim:* The function of a trait is the effect for which it was naturally selected.
      *   *Strengths:* Handles normativity (malfunction is failing to do what you were selected for), distinguishes functions from accidental effects.
      *   *Weaknesses:* Novel traits (no history yet), vestigial traits (history but no current use), byproducts (linked to selected traits but not selected themselves).
      *   *Key Defenders:* Larry Wright (original), Ruth Millikan (teleosemantics), Karen Neander (normativity), Peter Godfrey-Smith (modern history).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Novel Traits (The "First Heart" Problem).*
          *   *Draft Q:* If a mutant heart pumps blood for the first time, does it have a function? SE says no.
          *   *Refinement:* Make it sharper. Focus on the intuition that it *does* work.
          *   *Follow-up:* They'll say "it has a causal role." Push back: "So function isn't real until generation 2?"
          *   *Final Polish:* Focus on the "wait time" for function.

      *   *Topic 2: Godfrey-Smith's Modern History.*
          *   *Draft Q:* Is Godfrey-Smith just moving goalposts with recent history?
          *   *Refinement:* Frame it as a tension between "etiological" (history) and "current utility." If we only care about recent history, are we basically admitting Cummins was right about current capacity?
          *   *Follow-up:* They'll say "it preserves the selection requirement." Push back: "Where is the cutoff? Is it principled or ad hoc?"

      *   *Topic 3: Malfunction/Normativity.*
          *   *Draft Q:* How do you explain malfunction better than Cummins?
          *   *Refinement:* Cummins says a broken heart fails its causal role. SE says it fails its *proper* function. Why is SE's "proper" better?
          *   *Follow-up:* They'll say "CR can't distinguish disease from difference." Push back: "Can't CR just appeal to statistical norms or system goals?"

      *   *Topic 4: Byproducts/Spandrels.*
          *   *Draft Q:* What about male nipples? They weren't selected.
          *   *Refinement:* SE says they have no function. But they do things (erogenous zones, surgical markers). Is it plausible to say they have *no* function?
          *   *Follow-up:* They'll say "They are side effects." Push back: "If a side effect becomes crucial for survival now, does it stay functionless forever?"

      *   *Filling the remaining 4 questions (Need to ensure broad coverage of SE theory nuances).*
          *   *Question 5: Vestigial Traits.* (The flip side of Novel Traits). If an appendix does nothing now but was selected before, does it still have a function? This tests the "history" vs. "current contribution" tension.
          *   *Question 6: Intentionality/Teleology.* SE is naturalized teleology. Does it actually remove the "ghost in the machine" or just hide it in the past?
          *   *Question 7: The "Swampman" Objection.* (Related to Novel Traits but metaphysical). If a duplicate appears by chance, does it have functions? This tests the necessity of *actual* history vs. *type* history.
          *   *Question 8: Cultural/Memetic Functions.* Millikan extends this to artifacts/ideas. Does SE work for things like "the function of a wedding ring"? If so, does that stretch "selection" too thin?

      *   *Review against constraints:*
