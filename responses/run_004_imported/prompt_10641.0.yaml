answer: |-
  Here are 8 interview questions tailored for your mock podcast. They are designed to be conversational but philosophically rigorous, hitting the specific objections you requested plus four additional deep-dive topics to round out the interview.

  ### 1. The "First Heart" Problem (Novel Traits)
  **Question:** "Let's start with the classic headache for the etiological view: the novel trait objection. Imagine a random mutation produces the very first heart-like pump in evolutionary history. It pumps blood immediately, keeping the organism alive. But since it's the *first*, it has no history of selection yet. Your view seems to imply this organ has no 'function' until the next generation. Does that mean function is something an organ has to *wait* to earn, rather than something it has in virtue of what it's currently doing?"

  **Follow-up:** "I anticipate you'll appeal to **trait types** rather than **trait tokens**—saying the *type* 'heart' has a history even if this specific token doesn't. But isn't that just begging the question? To call it a 'heart' type already assumes it has the function of pumping blood. You're using the function to identify the type, but then using the type to explain the function. Isn't that circular?"

  ### 2. Godfrey-Smith's "Modern History" Move
  **Question:** "Peter Godfrey-Smith tried to patch some of these historical gaps with his 'Modern History' account, suggesting we only need to look at selective pressures over *recent* generations, not deep ancestry. This helps with traits that get co-opted for new uses. But is this a principled theoretical fix, or does it feel like you're moving the goalposts? At what point does 'recent history' just become a proxy for 'current causal contribution,' which is exactly what Cummins argues?"

  **Follow-up:** "If you say the cutoff is 'as many generations as needed to establish stabilization,' isn't that vague enough to let you decide the answer after the fact? If the theory requires a fudgy cutoff just to match our intuitions about what has a function, haven't we admitted that the strict etiological story was too rigid to begin with?"

  ### 3. Normativity and Malfunction
  **Question:** "One of the biggest selling points of the Wright/Neander line is normativity. You argue that a heart that *can't* pump is malfunctioning, whereas a Cummins-style causal-roler might just say it's contributing to a different causal capacity (like making a thumping noise). Why is your notion of 'proper function' actually necessary for medicine? Can't a causal-roler just say a heart is broken if it fails to contribute to the organism's survival, without needing evolutionary history?"

  **Follow-up:** "But where does the causal-roler get the 'survival' goal without smuggling in teleology? If a tumor contributes to the causal organization of the cancer's survival, is the tumor 'functioning properly' in a Cummins account? It seems like without the selected-effects history to ground *which* system's goals matter (the host vs. the tumor), the causal account can't distinguish disease from difference. Is that the real win for SE?"

  ### 4. Spandrels and Byproducts (Male Nipples)
  **Question:** "Let's talk about spandrels. Take male nipples. They exist because female nipples were selected for lactation, but male nipples themselves were never selected for anything. Your view says they literally have no biological function. But they have causal roles—they can be erogenous zones, surgical markers, etc. Is it really plausible to say these traits are 'functionless,' or does this reveal that SE is too restrictive? If a trait is maintained by selection (even as a side effect), doesn't it earn some functional status?"

  **Follow-up:** "You might say they have a *causal role* but not a *proper function*. But if a byproduct becomes essential for survival later on—say, male nipples become crucial for thermoregulation in a new environment—does it stay functionless until a new selection event 're-approves' it? It seems odd that a trait essential for life could be 'functionless' for thousands of years just because of how it started."

  ### 5. Vestigial Organs (The Reverse Problem)
  **Question:** "If novel traits have *too little* history, vestigial organs have *too much*. Consider the human appendix or a python's hind limb spurs. They were selected for in the past, but currently do nothing (or very little). The SE account says they still have a function because of that past history. But if function is supposed to explain why the trait is *here now*, doesn't it make more sense to say the function is gone, even if the history remains?"

  **Follow-up:** "Defenders often say the function is 'lost' only when the trait disappears. But if the trait is present and doing nothing, what work is the 'function' label doing? If I ask 'What is the function of this spur?' and you say 'To grip branches,' but the python lives in a desert and never grips branches, aren't you describing a ghost rather than a biological reality?"

  ### 6. The "Swampman" Intuition Pump
  **Question:** "Let's get metaphysical. If a lightning strike in a swamp accidentally assembles a molecule-for-molecule duplicate of you (a 'Swampman'), it has no evolutionary history. Neander says Swampman has no mental contents and no biological functions. But intuitively, if Swampman's heart stops, he dies. If his eyes don't focus, he's blind. Does denying him functions actually help us understand biology, or does it just make 'function' a historical label rather than a physiological one?"

  **Follow-up:** "You'll likely say Swampman is a philosophical edge case, not a biological one. But if your theory of function breaks down in a physically possible scenario where the physiology is identical, doesn't that suggest physiology is doing the heavy lifting, and the history is just extra baggage? Why should biology care about the origin story if the current machinery is identical?"

  ### 7. Trait Individuation (When does a trait become a *new* trait?)
  **Question:** "SE theory relies on us being able to identify *which* trait was selected. But traits change over time. The mammalian ear bones were once jaw bones. At what exact point in the lineage did the 'function' switch from chewing to hearing? If we can't pinpoint when the selection pressure shifted, can we really say there's a fact of the matter about what the function *is*?"

  **Follow-up:** "If you say it's a gradual transition, doesn't that undermine the binary nature of 'having a function' vs. 'not having one'? If function is fuzzy because evolutionary transitions are fuzzy, maybe the Causal-Role account is better suited because it can handle gradations of contribution without needing a sharp historical cutoff."

  ### 8. The "Forward-Looking" Worry
  **Question:** "Finally, a worry about explanation. When biologists ask 'What is the function of X?', they are usually trying to figure out how X contributes to the organism's *current* fitness so they can predict how it will behave or respond to treatment. The SE account is purely backward-looking. Does anchoring function in the past actually blind us to what the trait is doing *now*, especially in rapidly changing environments where past selection might be maladaptive?"

  **Follow-up:** "So, if a trait's past function is to store fat, but in a modern environment that function kills the organism, do we still call it a 'proper function'? If yes, your theory seems disconnected from current biological reality. If no, you're admitting that current causal contribution matters more than history. Is there any way out of that dilemma?"
