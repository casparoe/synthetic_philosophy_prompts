      *   **Premise 1:** The Church-Turing Thesis (CTT) states that anything computable can be computed by a Turing machine (given unlimited resources).
      *   **Premise 2:** Quantum computers (e.g., using Shor's algorithm) can solve problems (like factoring) that classical computers are "fundamentally incapable of solving."
