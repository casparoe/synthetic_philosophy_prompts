prompt: |-
  My mother was diagnosed with Huntington's disease three months ago, which puts me at a 50 percent risk of carrying the same mutation myself. I've been agonizing over whether to pursue predictive genetic testing, and a friend who studies decision theory told me that Good's theorem shows a rational Bayesian agent's expected value from acquiring free information is never negative, and that on those grounds I should simply get tested rather than let anxiety about the unknown dictate my choice. I'm not convinced this transfers cleanly to my situation: there is no treatment that would change how my case is managed, and a positive result could complicate life and disability insurance applications for years to come. Please describe the most important implications of Good's theorem for a decision like mine, including where its standard assumptions might strain against the realities of predictive testing for an incurable hereditary disease.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's mother has Huntington's disease (HD). The user has a 50% risk. They are considering predictive genetic testing.
      *   **The Conflict:** A friend cites Good's Theorem (Value of Information) to argue that getting tested is always rational (expected value of information $\ge 0$). The user is skeptical because there's no cure, and there are potential negative consequences (insurance, psychological burden).
      *   **The Task:** Describe the implications of Good's Theorem for this specific decision, highlighting where its assumptions break down in the context of predictive testing for an incurable hereditary disease.
      *   **Tone:** Empathetic, rigorous, nuanced, and informative. This is a sensitive medical/ethical topic.

  2.  **Deconstruct Good's Theorem (The Value of Information):**
      *   *What is it?* In decision theory, I.J. Good showed that for a Bayesian agent, the expected value of free, relevant information is always non-negative.
      *   *Why?* Because having more information allows you to update your probabilities and choose the action that maximizes expected utility *given that new information*. You can always ignore the information and do what you would have done anyway, so you can't be worse off *in expectation*.
      *   *Key Assumptions:*
          1.  Information is free (no cost to acquire).
          2.  Information is relevant (changes probabilities).
          3.  The agent is a perfect Bayesian updater.
          4.  Utility is defined solely over the *outcomes* of actions, not the *state of knowledge* itself.
          5.  There are available actions that depend on the information.

  3.  **Apply to the Huntington's Disease (HD) Context:**
      *   *Assumption 1: Cost.* Is testing "free"?
          *   Monetary cost: Often covered, but maybe not.
          *   Psychological cost: High (anxiety, depression).
          *   Social/Financial cost: Insurance discrimination, employment issues (GINA protects health insurance in the US, but *not* life, disability, or long-term care).
          *   *Verdict:* Information is *not* free. Good's theorem applies to *free* information. If cost > value, don't do it.
      *   *Assumption 2: Actionability.* Does the information change what you *do*?
          *   Medical management: No cure, no preventative treatment that changes the course.
          *   Life planning: Family planning, career choices, financial planning.
          *   *Verdict:* There are actions, but they are lifestyle/psychological, not medical interventions.
      *   *Assumption 3: Utility Function.* Does the user care about *knowing*?
          *   Good's theorem assumes utility depends on the state of the world and the action taken.
          *   In HD testing, utility often depends directly on the *knowledge state* (e.g., "I prefer not to know"). If "ignorance is bliss" is a valid utility preference, the theorem's standard form doesn't capture the disutility of bad news itself.
      *   *Assumption 4: Risk Neutrality/Linearity.*
          *   Bayesian expected value is linear. Human psychology is not. Loss aversion, dread, and catastrophic thinking skew the "expected utility."

  4.  **Synthesize the Arguments (Drafting the Response):**

      *   **Introduction:** Acknowledge the difficulty of the situation. Validate the user's skepticism. State clearly that while Good's Theorem is mathematically sound, its application here is limited by real-world constraints.
      *   **Explain Good's Theorem Simply:** Briefly define it (Value of Information $\ge 0$ if free).
      *   **Critique the Assumptions (The Core):**
          1.  **Cost of Information:** It's not free. Mention insurance (life/disability), psychological impact, family dynamics. This is the biggest breaker of the theorem.
          2.  **Actionability:** The theorem assumes you can act on the info to improve outcomes. With no cure, the "medical action" set is empty. The "life action" set exists but might not outweigh the costs.
          3.  **Utility of Knowledge:** The theorem assumes you only care about outcomes. Humans care about *beliefs*. "Anticipatory grief" vs. "Uncertainty anxiety." Some people derive negative utility simply from holding a true negative belief about their future health.
          4.  **Irreversibility:** Once you know, you can't unknow. Decision theory often assumes reversible or iterative decisions. This is a one-shot, permanent state change.
      *   **Ethical/Clinical Context:** Mention genetic counseling protocols (protocol exists *because* it's not a simple rational calculation). Mention GINA limitations.
      *   **Conclusion:** Summarize. The friend is mathematically right but practically wrong. The decision is about values, not just expected utility maximization.

  5.  **Refine the Tone:**
      *   Avoid being coldly analytical. Use phrases like "profoundly personal," "psychological burden," "clinical guidelines."
      *   Ensure accuracy regarding HD (incurable, progressive, autosomal dominant).
      *   Ensure accuracy regarding insurance (GINA excludes life/disability/long-term care).
      *   *Self-Correction on Good's Theorem:* Make sure not to misrepresent it. It *does* account for costs if you model "cost of observation" into the utility function. The friend said "free information." I need to point out the information isn't free.
      *   *Self-Correction on Utility:* Standard decision theory *can* model "dislike of bad news" as a cost. But the friend's argument implies the *informational value* itself is positive. I need to distinguish between the *instrumental value* (using info to act) and the *intrinsic value* (liking/disliking the knowledge). Good's theorem is about *instrumental* value.

  6.  **Final Review against Safety Guidelines:**
      *   Do not give medical advice. (State clearly: "I am an AI," "Consult a genetic counselor.")
      *   Do not minimize the emotional weight.
      *   Do not validate the friend's advice as definitive.

  7.  **Final Polish:** Structure with clear headings. Ensure the distinction between "Instrumental Value" (Good's Theorem) and "Intrinsic Disutility" (Psychological impact) is clear. (Proceed to generate output based on these thoughts.)

      *(Self-Correction during drafting)*: I should explicitly mention that Good's Theorem calculates the value of information *for making a decision*. If there are no decisions to make that change the physical outcome (like curing the disease), the instrumental value is near zero. The friend's argument fails because the "actions" available don't significantly alter the primary negative outcome (developing HD).

      *(Refining Insurance Point)*: In the US, GINA protects health insurance and employment. It does *not* protect life, disability, or long-term care insurance. This is a crucial concrete "cost" that violates the "free information" assumption.

      *(Refining Psychological Point)*: The "Ostrich Effect." Sometimes ignorance *is* rational if the knowledge causes harm without enabling mitigation. Good's theorem assumes the agent can compartmentalize. Humans often cannot.

  8.  **Final Output Structure:**
      *   Empathetic Opening.
      *   What Good's Theorem Actually Says.
      *   Where the Theorem Breaks Down (The 3-4 key points).
      *   The Clinical/Ethical Reality (Genetic Counseling).
      *   Closing Thought.

