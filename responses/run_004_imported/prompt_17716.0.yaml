answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s older sibling.

  It is a profound privilege to stand here today. To look out at this room and see the people who love [Bride] is to see a map of her life, drawn in kindness. But as her sibling, I've had the unique vantage point of watching her draw that map herself. I have seen her navigate joy, and I have seen her navigate terrain that was far more difficult.

  We often talk about love as a feeling. But anyone who has loved someone for a lifetime knows that love is also a practice. It is a discipline. And sometimes, love is a promise you make to someone's future self, on behalf of their present one.

  Four years ago, [Bride] asked me to make a promise. She asked me to look out for her, not just when things were easy, but specifically when they were hard. She told me that there might come a time when she would need me to hold the line, even if she was fighting me on it. She told me that true loyalty might look like disobedience in the moment, so that it could look like salvation in the end.

  There was a time, not long ago, when I had to keep that promise. It was the hardest thing I have ever done. There was pain, and there was silence between us for a long while. There were moments where keeping my word meant standing firm when the person I love most in the world was begging me to stop.

  I tell you this not to dwell on the dark, but to honor the light it took to get us here. Because I need you to know something about this woman. The version of her that fought me, and the version of her that stands here glowing today—they are both her. Neither is an imposter. Neither is "less than." She is the storm and she is the shelter. And the fact that she had the foresight to sign that contract, and the courage to rebuild our relationship after it was tested, tells you everything you need to know about her integrity.

  She taught me that loving someone wholly means honoring their wisdom even when they can't access it themselves. It means trusting that the person they are when they are well knows what the person they are when they are suffering needs.

  [Partner's Name], you are marrying into a family that believes in endurance. You are marrying a woman who knows that vows are not just for the sunny days. She knows that sometimes, protecting a promise means weathering the anger to get to the peace on the other side. She is the most real, most whole person I know, because she has faced every part of herself and refused to look away.

  My wish for you both is that you never have to face the hardest version of this promise. But if you do, may you have the courage [Bride] had: to plan for the storm while the sun is shining, and to trust that love is strong enough to survive the rain.

  [Bride], thank you for trusting me with your safety, and thank you for welcoming me back into your life. I am so proud to be your sibling.

  Please raise your glasses. To [Bride] and [Partner]. To the promises we keep, and the love that remains when the keeping is done.
