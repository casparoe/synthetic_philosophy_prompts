  *(Self-Correction on the technical snag)*: I need to be careful. A lookup table for a *fixed* length is finite. Any finite function is computable in constant time $O(1)$ if hardwired. But the *construction* of the table is exponential relative to the length parameter. The snag is: To say the table is "inefficient," you have to compare it to the *family* of tables for lengths $1, 2, 3... n$. But a specific mind exists at a specific time. Does the mind's metaphysical status depend on its capacity to handle *longer* conversations it never has? This is the sticky point to highlight.

