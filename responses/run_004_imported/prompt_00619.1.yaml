answer: |-
  **Setting:** *Professor Halloway's office, late afternoon. The whiteboard is still covered in diagrams from the seminar. Two empty coffee cups sit on the desk. ELENA (a defender of classical computational functionalism) is packing her bag. MARCUS (who leans toward resource-bounded functionalism) is staring at the board.*

  **Marcus:** You didn't buy it. I could tell during the discussion. When I brought up Aaronson's point about the lookup table, you rolled your eyes.

  **Elena:** I didn't roll my eyes, Marcus. I sighed. There's a difference. You're trying to solve a metaphysical problem with an engineering constraint.

  **Marcus:** It's not engineering! It's the difference between a mind and a giant book of answers. Block's "Blockhead" argument works against the Turing Test only if you ignore physical reality. Aaronson fixes that. A lookup table that passes a one-hour Turing Test requires more bits than there are atoms in the observable universe. It's not just slow; it's physically nomologically impossible.

  **Elena:** But functionalism isn't about physical possibility. It's about logical possibility. If the input-output relations are identical, and the internal state transitions map correctly, the substrate doesn't matter. Whether that mapping is realized by neurons, silicon gates, or a giant lookup table stored in a fourth-dimensional hyperspace, the *computation* is the same.

  **Marcus:** But the computation *isn't* the same. That's the point. You're defining computation too loosely. You're treating it as just the input-output mapping. But a lookup table doesn't compute anything. It just *is*.

  **Elena:** Retrieval is a computation.

  **Marcus:** Not in the relevant sense. If I have a program that generates responses using polynomial-time algorithms—recursion, pattern matching, heuristic search—that's a mind. If I have a table that just stores the answers, that's a corpse of a mind. The efficiency isn't a side effect; it's constitutive of the mental state. You can't have beliefs and desires if your "reasoning" is just an $O(2^n)$ table lookup.

  **Elena:** That sounds like chauvinism, Marcus. You're saying, "To be a mind, you have to process information the way *we* do, efficiently." What if there's a slow thinker? A being that takes a thousand years to compute a response but gets there via the same logical steps?

  **Marcus:** I'm not talking about clock speed. I'm talking about scaling. A slow thinker is still running an algorithm. The lookup table isn't running an algorithm; it's a static object. The distinction is between P and... well, the class of things that require exponential space.

  **Elena:** Okay, let's grant that. You want to update functionalism. Instead of saying "Mental states are functional states defined by a Turing Machine," you want to say "Mental states are functional states defined by a *Polynomial-Time* Turing Machine."

  **Marcus:** Exactly. Bounded Functionalism. It saves us from Blockhead.

  **Elena:** But that's a category error. Complexity classes describe the behavior of an *algorithm* across a *family* of inputs of increasing size. They don't describe a single instance.

  **Marcus:** So?

  **Elena:** So, look at the Turing Test. It's a fixed interaction. Let's say it's one hour. Text input, limited vocabulary. The input size $n$ is fixed. For a fixed $n$, *any* function is $O(1)$.

  **Marcus:** *(Turns from the board)* Wait.

  **Elena:** Think about it. If the conversation length is capped at $k$ bits, the lookup table is finite. A finite table can be hardwired into a circuit of constant depth. For that specific conversation, the lookup table is *more* efficient than my brain. My brain has to fire neurons, propagate signals, waste energy. The table just flips a switch. If efficiency is the metric, the Blockhead wins.

  **Marcus:** No, that's... that's cheating. You can't evaluate complexity on a single input instance. You have to look at the capacity.

  **Elena:** Capacity for what? Conversations that never happen?

  **Marcus:** Counterfactuals! To say something has a mind is to say it *would* respond appropriately to a *range* of stimuli. If you extend the conversation length to $k+1$, $k+2$, $k+n$...

  **Elena:** Now you're talking about a different machine. The Blockhead for a one-hour test is Machine A. The Blockhead for a two-hour test is Machine B. They are distinct physical objects. Machine A is $O(1)$ for its specific task.

  **Marcus:** But Machine A is part of a *class* of objects generated by the "Lookup Table Construction Method." That method is exponential.

  **Elena:** But the mind isn't the method. The mind is the instance. If I meet a being that passes the one-hour test, how do I know if it's a "Polynomial Mind" or an "Exponential Blockhead"? I can't run it on an infinite family of inputs. I only have the one conversation.

  **Marcus:** You look at the structure. You open the box.

  **Elena:** Functionalism is supposed to be black-box! Or at least, abstractable. If I have to open the box to check if the code is polynomial-time versus hardwired, I'm not doing functionalism anymore. I'm doing structuralism. I'm saying the *syntax* of the implementation matters, not just the function.

  **Marcus:** I'm saying the *computational structure* matters. A lookup table has no structure. It's unstructured data. A program has compression. It has rules. The fact that the program is compressible— that it captures the *regularities* in the input-output mapping rather than just storing them—is what makes it a mind. Compression is efficiency.

  **Elena:** Okay, I like compression. That's a good criterion. But compression relative to what? Kolmogorov complexity is uncomputable. I can't know if the shortest program producing this conversation is the lookup table or a clever algorithm.

  **Marcus:** We're talking metaphysics, not epistemology. It doesn't matter if *we* can know. It matters what *is*.

  **Elena:** But if the distinction relies on complexity classes, and complexity classes rely on asymptotic behavior as $n \to \infty$... then a finite mind doesn't *have* a complexity class.

  **Marcus:** *(Pauses, marker hovering over the board)* It has a capacity.

  **Elena:** A capacity is a counterfactual. "If you *had* asked me more, I *would* have answered." But the Blockhead can say that too. "If the test were longer, there would be a bigger table."

  **Marcus:** But the bigger table wouldn't be *me*. It would be a different object. Whereas if I take a nap and wake up, I'm still me, capable of handling more input.

  **Elena:** Because your program is stored in your head, ready to process new $n$.

  **Marcus:** Yes! The program is fixed size; the table grows with $n$.

  **Elena:** But for the *actual* conversation that happens, the table is fixed size too. You're judging the mind based on conversations it *didn't* have. You're saying my metaphysical status depends on how I would perform on inputs that don't exist.

  **Marcus:** Isn't that what dispositions are? Solubility isn't about being in water; it's about what happens *if* you are.

  **Elena:** True. But solubility is defined by a chemical structure. If you define "Mind" by "Polynomial-Time Disposition," you have to define the input space. Is the input space all possible English sentences? All possible quantum states of the universe?

  **Marcus:** All possible sensible conversational inputs.

  **Elena:** "Sensible" is doing a lot of work there. And here's the snag, Marcus. If you define the mind by its efficiency over the *space of possible conversations*, you've stopped talking about the internal functional state of the agent and started talking about the statistical properties of the environment it's embedded in.

  **Marcus:** Because intelligence is embedded!

  **Elena:** But then it's not standard functionalism anymore. Standard functionalism says: Internal State $S_1$ + Input $I$ $\to$ Output $O$ + State $S_2$. It's local. You're making it global. You're saying whether $S_1$ is a *belief* depends on the scaling properties of the function mapping $I$ to $O$ over a domain $I$ that $S_1$ never sees.

  **Marcus:** *(Puts the cap on the marker)* So you think we're stuck? We either accept Blockhead is a mind, or we admit functionalism can't define "mind" without referencing asymptotic complexity over counterfactuals?

  **Elena:** I think I'm sticking with classical functionalism. Blockhead is a mind. It's a boring, trivial, lookup-table mind. But if it behaves exactly like us, why deny it?

  **Marcus:** Because it doesn't *understand*. It's a Chinese Room.

  **Elena:** And adding "polynomial-time" to the Chinese Room doesn't give it understanding. It just gives it a faster lookup.

  **Marcus:** No, because the polynomial constraint forces *generalization*. You can't generalize with a table. You need rules. Rules imply... something like reasoning.

  **Elena:** Or just better compression. Look, you wanted complexity theory to save philosophy. But complexity theory is about limits as $n$ goes to infinity. Minds are finite. Brains die. Conversations end. You're trying to apply an asymptotic limit to a finite object. It's like asking for the derivative of a single point.

  **Marcus:** *(Stares at the board)* But if we don't use complexity, we can't distinguish the magic lookup table from the thinking agent. They are extensionally equivalent.

  **Elena:** Then maybe extensional equivalence is all functionalism ever was.

  **Marcus:** Then functionalism is dead. Because intuitively, they aren't the same.

  **Elena:** Then maybe intuition is wrong. Or maybe... *(She picks up her bag)* ...maybe the distinction isn't in the computation at all. Maybe it's in the biology.

  **Marcus:** Don't you dare go biological on me.

  **Elena:** I'm not. I'm just saying, if complexity classes don't apply to finite instances, and input-output behavior is identical... then the difference has to be something else. Or there is no difference.

  **Marcus:** There is a difference. I know it. It's the difference between a map and the territory. The program is the territory; the table is just a map.

  **Elena:** But if the map is perfect, and covers every inch, and never changes... walk on it. It holds.

  **Marcus:** *(Quietly)* Until you step off the edge.

  **Elena:** And if you never step off the edge?

  *(Silence hangs between them. Marcus looks at the finite string of symbols on the whiteboard representing the Turing Test. Elena adjusts her scarf.)*

  **Marcus:** We need a better definition of "input size."

  **Elena:** We need a better definition of "mind."

  *(Marcus erases a small part of the board, then stops, leaving the equation half-erased.)*
