  my sister is getting married in a few weeks and shes just finished her philosophy PhD on Bradley's regress and the "unity of the proposition" thing -- basically the puzzle of how a subject and a predicate (like "grass" and "is green") actually fuse into one fact instead of just sitting next to each other, and how if you need a relation to glue them together you then need another relation to glue that relation to them, forever (apparently even Russell got stuck on this one). i have to give a toast at the reception and im kind of stressing because half the room is her whole grad cohort and her advisor, who will 100% notice if i botch it, and the other half is family plus her fiancé, who's an electrician and still doesn't really know what her thesis is about. can you write me like a 4 minute toast that actually uses her research as a metaphor for the wedding, with one genuine joke about the infinite regress thing that both halves of the room would laugh at? she told me flat out not to make any joke that makes it sound like she thinks the marriage is gonna end in an infinite argument, so that's off limits, and no cheesy "two become one" stuff either -- i want the idea to actually do some work, not just get name dropped.
