          *   Better approach: Treat the model relationship as a likelihood function $P(\text{Report} | \text{Forcing})$, not a posterior constraint.

      *   **Conclusion/Recommendation:**
          *   Don't abandon Bayesianism.
          *   Don't abandon MinXent (it's still best for moment constraints).
