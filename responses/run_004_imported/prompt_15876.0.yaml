          *   *Direction:* The prompt asks for the argument connecting GS *to* Arrow. Usually, this means showing how a SP social choice function (SCF) implies a Social Welfare Function (SWF) satisfying Arrow's conditions.
          *   *Mechanism:* Take a SP, onto SCF. Construct preferences over pairs based on the SCF's choice on restricted domains (or use the "extended preference" method).
          *   *Key properties to derive:* Pareto (or Unanimity) and IIA.
          *   *Conclusion:* Arrow implies Dictatorship for the SWF, which implies Dictatorship for the SCF.
          *   *Student's Claim:* "build a full social ranking... by looking at what the function does on each pairwise restriction... derived ranking is transitive and satisfies both Pareto... and IIA."
