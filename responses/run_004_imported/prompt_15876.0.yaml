      *   **Part (c): Example of strategy-proof, non-dictatorial rule & why no contradiction.**
          *   *Standard Example:* Median Voter Theorem (Single-Peaked Preferences).
          *   *Why no contradiction:* GS assumes *unrestricted domain*. Median rule works on a *restricted domain* (single-peaked).
          *   *Student's Example:* Median voter rule on a line.
          *   *Student's Explanation:* "restricting the domain to single-peaked preferences lets you get around Gibbard–Satterthwaite." (Correct).
          *   *Student's Caveat:* "whoever happens to be the median voter... gets exactly their ideal point implemented, so there's still always exactly one person dictating the outcome -- it's just that the identity of that person can shift..."
          *   *Technical Check:* This caveat is conceptually dangerous/incorrect in the context of Social Choice Theory. A "dictator" in Arrow/GS terms is a *fixed* individual whose top choice always wins, regardless of others. A "median voter" is not a dictator in the technical sense because the identity changes based on the profile. Calling the median voter a "dictator" confuses the technical definition with the colloquial one. This shows a misunderstanding of the definition of dictatorship used in Part (a).

