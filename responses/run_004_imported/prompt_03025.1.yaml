      *Key Technical Point to include:* The condition for commutativity is that the two partitions must be **probabilistically independent** conditional on the hypothesis space, OR the updates must be specified as **Bayes Factors** rather than posterior probabilities. Since Color and Texture of the same cloth are likely correlated (silk looks different than cotton), the partitions aren't independent. Thus, non-commutativity is expected. But does that mean the rule is broken? No, it means the *description of the evidence* was incomplete.

