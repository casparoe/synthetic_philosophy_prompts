answer: |-
  This is an excellent question. You have identified precisely the conceptual hinge upon which the entire accuracy-first program turns. Many students (and indeed, several professional philosophers when Joyce's 1998 paper first appeared) get stuck exactly where you are: the jump from "this looks like high-school geometry with the Brier score" to "this holds for any legitimate scoring rule" feels like a black box.

  Here is an intuitive walkthrough of why the generalization works, followed by a distinction regarding the non-pragmatic nature of the argument.

  ### 1. From Pythagoras to Separation: Why the Generalization Holds

  You are right that with the Brier score, the argument is literally the Pythagorean theorem. You have a point in Euclidean space (your credences), and you are measuring literal distance to the vertices (the worlds). Because the coherent credences form a convex hull, and Euclidean distance is convex, the projection of an incoherent point onto that hull is closer to *every* vertex.

  When we drop the Brier score, we lose Euclidean distance. We no longer have a "metric space." So, what preserves the result? The answer lies in shifting your intuition from **distance** to **direction**, and from **projection** to **separation**.

  #### The Role of Strict Propriety (The "Direction")
  The most critical condition Joyce imposes (and which Pettigrew refines) is **Strict Propriety**.
  *   **Intuition:** Strict Propriety means that if you *are* probabilistic, you expect your own credences to be the most accurate. You have no incentive to lie to yourself about your own beliefs.
  *   **Why it matters for domination:** Propriety ensures that the "gradient" of inaccuracy always points in a consistent direction relative to the truth. Imagine the inaccuracy score as a landscape. Propriety ensures that for any probabilistic credence, you are at the bottom of a valley *relative to your own expectations*.
  *   **The Generalization:** When you are *incoherent*, you are not at the bottom of any such valley. You are on a slope. The mathematical magic of Strict Propriety (combined with continuity and convexity of the scoring rule) is that it guarantees the "slope" points toward the coherent set. It ensures that the inaccuracy functions for different worlds don't twist in contradictory ways. They fan out in a structured manner that respects the convexity of the probability simplex.

  #### The Separating Hyperplane (The "Geometry")
  Once you move beyond Euclidean distance, the mathematical engine is no longer the Pythagorean theorem; it is the **Hyperplane Separation Theorem**.

  1.  **The Coherent Set:** The set of all probabilistic credence functions forms a convex shape (a simplex) in the space of all possible assignments.
  2.  **The Inaccuracy Profile:** For any credence function $C$, we can plot its "inaccuracy profile"—a vector listing how inaccurate $C$ is in World 1, World 2, etc.
  3.  **The Convexity of the Score:** If the scoring rule is convex (a technical requirement added to Joyce's original conditions to fix a gap), then the set of all possible inaccuracy profiles generated by *coherent* credences is also a convex set.
  4.  **The Separation:** If your credences $C$ are incoherent, your inaccuracy profile lies **outside** that convex set of coherent profiles.
  5.  **The Result:** The Separation Theorem tells us that if a point lies outside a convex set, there is a point *inside* the set that is "smaller" in every dimension. In our case, this means there is a coherent credence function $C^*$ whose inaccuracy is lower than $C$'s inaccuracy in World 1, *and* World 2, *and* World 3...

  **The Intuitive Payoff:**
  Think of incoherence as a kind of "tension." If you assign $P(A) = 0.7$ and $P(\neg A) = 0.7$, you are effectively betting on both outcomes too heavily.
  *   With the Brier score, this is literally being "farther away."
  *   With a general proper scoring rule, this is being "inefficient."
  The conditions on the scoring rule ensure that this inefficiency is detectable from *every* perspective (every possible world). Because the scoring rule is proper, it penalizes "misalignment" between credence and truth. Incoherence is a structural misalignment that exists regardless of which world is actual. Therefore, fixing the structure (moving to coherence) reduces the penalty regardless of which world obtains. The scoring rule conditions guarantee that there are no "trade-offs" (e.g., getting more accurate in World 1 but less in World 2); the move toward coherence is a "free lunch" in accuracy space.

  ### 2. Why is this Non-Pragmatic?

  This is the second half of your query, and it is crucial for your paper. The worry is: "Isn't this just Dutch Book in disguise? You're still showing that incoherent agents are 'dominated'."

  The distinction lies in the **currency of the loss** and the **object of evaluation**.

  #### Currency: Utility vs. Veritistic Value
  *   **Dutch Book:** The loss is measured in **utility** (money, satisfaction, preference fulfillment). The argument says: "If you are incoherent, you will act in a way that frustrates your own desires." This is instrumental. It tells you that incoherence is bad *for getting what you want*.
  *   **Accuracy Argument:** The loss is measured in **accuracy** (closeness to truth). The argument says: "If you are incoherent, your belief state is objectively farther from the truth than it could be." This is constitutive. It tells you that incoherence is bad *for believing*.
  *   **Why it matters:** A pragmatic argument leaves open the possibility that I might not care about money (I'm rich, or I'm a martyr). If I don't care about utility, the Dutch Book doesn't bind me. But the accuracy argument claims that *qua* believer, I aim at truth. Even if I don't care about money, I cannot opt out of the aim of accuracy if I am holding beliefs at all. The "loss" is internal to the practice of belief, not external like a wallet.

  #### Object: Action vs. State
  *   **Dutch Book:** Evaluates your **disposition to act**. It connects credence to betting behavior. It's an argument about the coherence of your *will*.
  *   **Accuracy Argument:** Evaluates the **credence function itself**. It connects credence to the world. No mention of bets, actions, or decisions is required. The domination theorem is about the static relationship between a number (credence) and a state of affairs (world).
  *   **The "Dressed Up" Worry:** You asked if this is just Dutch Book in geometric language. It is not, because the geometry describes the space of *truth-values*, not the space of *gambles*. The "domination" is not that you lose a bet; it's that your map is less like the territory than another available map, no matter what the territory looks like.

  ### 3. Advice for the Term Paper

  Since you are considering this for a term paper, here is a strategic assessment:

  **The Risk:**
  The "Joyce 1998" topic is extremely well-trodden. A paper that simply explains the generalization theorem will likely be descriptive rather than argumentative, which might not suffice for a graduate seminar. The "gap" in Joyce's original proof (fixed by Pettigrew) is also well-documented.

  **The Opportunity:**
  The real philosophical action is in the **premises** of the accuracy argument, not the math.
  1.  **The Normative Premise:** Why should we care about accuracy-domination? The principle is "If $A$ is more accurate than $B$ in every possible world, you ought to prefer $A$." This is *Normative Dominance*. Is this principle plausible for epistemic value? (See: objections by Greaves or Caie regarding "accuracy for non-alethic values").
  2.  **The Measurement Premise:** Are Joyce's conditions on scoring rules (Strict Propriety, etc.) truly necessary for *epistemic* value? Some argue they import pragmatic/decision-theoretic assumptions back into the definition of accuracy. (See: Levinstein's work on "exotic" scoring rules).
  3.  **The Application:** How does this handle *conditionalization*? The accuracy argument for Probabilism is strong; the argument for Conditionalization (updating) is much trickier (see Pettigrew vs. Greaves & Wallace).

  **Recommendation:**
  If you choose this topic, do not just explicate the generalization. Use your understanding of the generalization to critique the **Strict Propriety** condition.
  *   *Thesis Idea:* "While the mathematical generalization from Brier to Proper Scoring Rules holds, the justification for Strict Propriety relies on a decision-theoretic conception of belief that undermines the 'non-pragmatic' claim of the program."
  *   This allows you to show you understand the math (the separation theorem intuition) while engaging with the deeper philosophical stakes (the pragmatism vs. epistemology boundary).

  ### Summary
  The generalization works because Strict Propriety and Convexity ensure that the "inaccuracy landscape" is shaped such that the coherent set is a "valley" that can be separated from any incoherent point by a hyperplane. It is non-pragmatic because the currency is truth-likeness, not utility, and the object is the belief state, not the betting disposition.

  This is a rich topic. If you can articulate the shift from "distance" to "separation" clearly in your paper, you will demonstrate a grasp of the formalism that many students miss.
