      *   **Constraint:** The punchline must depend on the *actual logical structure* of the paradox (incompatibility of preferences with a single probability assignment), not just generic uncertainty aversion. It needs to land for someone who understands the math/logic behind it.

  2.  **Recall the Ellsberg Paradox Structure:**
      *   **Setup:** An urn with 90 balls. 30 are Red. 60 are Black or Yellow (unknown proportion).
      *   **Gamble 1 (Bet on Red vs. Bet on Black):**
          *   Option A: Win $100 if Red. (Known prob: 30/90 = 1/3)
          *   Option B: Win $100 if Black. (Unknown prob: 0/90 to 60/90)
          *   *Typical Preference:* A > B (People prefer known risk).
      *   **Gamble 2 (Bet on Red/Yellow vs. Bet on Black/Yellow):**
          *   Option C: Win $100 if Red or Yellow. (Unknown prob: 30/90 to 90/90)
          *   Option D: Win $100 if Black or Yellow. (Known prob: 60/90 = 2/3)
          *   *Typical Preference:* D > C (People prefer known risk).
      *   **The Contradiction:**
          *   If A > B, then $P(Red) > P(Black)$.
          *   If D > C, then $P(Black \cup Yellow) > P(Red \cup Yellow)$.
          *   Since $P(Black \cup Yellow) = P(Black) + P(Yellow)$ and $P(Red \cup Yellow) = P(Red) + P(Yellow)$...
          *   D > C implies $P(Black) + P(Yellow) > P(Red) + P(Yellow)$, which simplifies to $P(Black) > P(Red)$.
          *   So, typical preferences imply $P(Red) > P(Black)$ AND $P(Black) > P(Red)$. Contradiction.
      *   **Sure-Thing Principle:** If you prefer A to B regardless of whether some event E happens, you should prefer A to B even if you don't know about E. In Ellsberg, the Yellow ball is the "irrelevant" event that flips the preference when added to both sides.

