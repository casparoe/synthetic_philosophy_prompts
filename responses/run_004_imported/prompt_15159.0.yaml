      *   *Cons:* Risks the User becoming the default caregiver if others remain stubborn. Requires emotional labor to manage the conflict.

  4.  **Identify the Underlying Dynamics:**
      *   **Prisoner's Dilemma:** If everyone cooperates, best outcome. If one defects (Sister) and others cooperate, the defector wins, cooperators lose. If everyone defects, everyone loses (father suffers, family fights).
      *   **Anchoring:** The sister has set an anchor ("I do nothing"). The brother wants to set a counter-anchor ("I do little").
      *   **Information Asymmetry:** No one knows the actual care burden yet. Decisions are being made in a vacuum.
      *   **Family Systems:** Caregiving often reveals old family roles (the responsible one, the busy one, the distant one).

