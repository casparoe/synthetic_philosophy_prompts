answer: |-
  **Title:** The Spotlight and the Shadow: Resolving the Target Objection to Higher-Order Theories of Consciousness

  The nature of consciousness is often framed through the lens of transitivity: a mental state is conscious if, and only if, the subject is aware of being in that state. Higher-Order Thought (HOT) theories formalize this intuition, positing that a first-order mental state (such as seeing a red apple or feeling a pang of jealousy) becomes conscious only when it is targeted by a distinct, higher-order mental state—a thought about that state. While elegant, this framework faces a persistent and puzzling objection. We frequently ascribe mental states to ourselves that remain unconscious; for instance, I might believe "I have an implicit bias against group X" or "I am repressing anger," without consciously experiencing the bias or the anger. If a higher-order thought (HOT) is sufficient to make a state conscious, how can one have a HOT about a state that remains unconscious? This essay will explore this puzzle, argue that it stems from a conflation of inferential self-knowledge with phenomenal awareness, and defend a refined HOT view that distinguishes between theoretical self-ascription and the constitutive mechanism of consciousness.

  To understand the puzzle, one must first grasp the core commitment of HOT theory, most notably associated with David Rosenthal. The theory relies on the Transitivity Principle: a state is conscious only if one is, in some suitable way, aware of being in it. In HOT theory, this awareness is not intrinsic to the state itself but is provided by a separate higher-order representation. Crucially, the first-order state is typically unconscious on its own; it is the HOT that "illuminates" it, bringing it into the light of consciousness. Therefore, the logical implication of HOT theory is that there can be no conscious access to an unconscious state. If the access (the HOT) is present, the state is, by definition, conscious.

  The objection arises from our everyday psychological experience, which seems to contradict this logical implication. We often form beliefs about our own mental architecture that do not result in phenomenological experience. Consider a patient in psychoanalysis who comes to believe, based on a therapist's interpretation, that they harbor an unconscious desire for their parent. The patient has a higher-order thought ("I desire X"), yet the desire itself does not become a conscious, felt experience; it remains an unconscious theoretical posit. Similarly, in cognitive science, a subject might accept evidence that they hold an implicit racial bias. They possess a thought about a mental state ("I am biased"), yet the bias operates implicitly, without entering conscious awareness. If these count as higher-order thoughts, then HOT theory appears falsified: here are HOTs about states that remain unconscious.

  This is a genuine problem for *crude* versions of HOT theory, but it dissolves when we evaluate the specific nature of the higher-order representation required for consciousness. The objection relies on an ambiguity in the phrase "higher-order thought." In ordinary language, any belief about one's own mind is a higher-order thought. However, for the HOT theorist, not all self-directed thoughts are created equal. The distinction lies between *inferential* self-ascription and *non-inferential* (or immediate) awareness.

  When I conclude "I must be angry" because I notice my clenched fists and raised voice, I am forming a belief about my mental state based on evidence. This is a theoretical inference. According to refined HOT theory, this does not constitute the kind of HOT that generates consciousness. The HOT that makes a state conscious must be immediate and non-conceptual in a specific sense; it must function quasi-perceptually. Just as seeing a tree makes the tree present to me without me needing to infer its existence, a consciousness-constituting HOT makes the mental state present to the mind without inference.

  Therefore, the puzzle poses a problem only if we equate "thinking about a state" with "making a state conscious." The HOT theorist's defense is that in the cases of implicit bias or repressed desires, the subject does not actually possess the relevant kind of HOT. They possess a *propositional attitude* about a disposition, not a higher-order representation of an *occurrent* state. When I believe "I have an implicit bias," I am ascribing a dispositional property to myself. I am not currently experiencing the bias as a first-order occurrent state. HOT theory is primarily a theory of phenomenal consciousness (what it is like to be in a state right now), not a theory of self-knowledge regarding dispositions. Consequently, having a belief about an unconscious disposition does not violate the theory, because the target is not an occurrent state waiting to be illuminated, but a theoretical construct.

  Furthermore, even regarding occurrent states, the distinction between inferential and non-inferential HOTs protects the theory. If I infer "I am in pain" because I see my leg is bleeding, but I am under anesthesia and feel nothing, I have a higher-order belief about a physical state, but I lack the conscious pain. The HOT theorist argues I also lack the specific HOT that targets the *qualitative feel* of the pain. I have a thought about the *cause* of pain, not the pain state itself. For a state to become conscious, the HOT must attribute a qualitative property to the first-order state. A theoretical belief ("I am biased") does not attribute a qualitative feel; it attributes a functional role. Thus, the state remains unconscious because the HOT lacked the requisite content to generate phenomenology.

  Defending this refined view requires accepting a specific ontology of mind: that consciousness is not a property of the first-order state itself, but a relational property between the first-order state and the higher-order scanner. This view is superior to First-Order Representationalism (FOR), which claims a state is conscious if it represents the world with sufficient richness. FOR struggles to explain why we are not conscious of all the rich visual processing happening in our blindsight or early visual cortex. HOT explains this: those states lack the higher-order tag.

  However, my defense of HOT comes with a caveat. The relationship between consciousness and higher-order representation should not be viewed as causal, but as constitutive. A common misunderstanding, which fuels the puzzle, is thinking the HOT shines a spotlight on a state that exists independently in the dark. If that were true, the state could exist in the dark while being spotlighted. Instead, the HOT *makes* the state conscious in the same way that playing a melody makes a sequence of notes into music. Without the performance, there are only notes. Without the HOT, there is only neural processing. Therefore, the idea of a "HOT about an unconscious state" is, in the strict constitutive sense, a category error. If the HOT is the right kind (immediate, occurrent, qualitative), the state is conscious. If the state is unconscious, the subject merely has a theoretical belief *that* they have such a state, not the consciousness-constituting HOT.

  In conclusion, the puzzle of having higher-order thoughts about unconscious states highlights a crucial distinction between self-knowledge and phenomenal awareness. It poses a genuine threat only to versions of HOT theory that fail to distinguish between inferential self-ascription and the immediate higher-order awareness that constitutes consciousness. By refining the theory to specify that the HOT must be non-inferential and must target occurrent qualitative states, the theory remains robust. We can have beliefs about our unconscious minds, but these are theoretical judgments, not the experiential awareness that defines consciousness. Ultimately, consciousness is not merely knowing we are in a state; it is the mind's immediate presentation of that state to itself. The shadow of the unconscious remains dark not because we cannot think about it, but because thinking *about* it is not the same as experiencing *it*.
