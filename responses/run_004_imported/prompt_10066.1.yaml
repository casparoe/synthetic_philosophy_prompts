      *   **Move (4) Marcus:** "Nora was conflating 'is a lie' with 'is wrong' — Augustine can still condemn Devon's sentence as some other kind of sinful deception without calling it a lie specifically, because what makes lying uniquely bad for Augustine is the corruption of the link between your words and your own mind."
          *   *Analysis:* This is a crucial distinction. Augustine distinguishes between the *sin of lying* (speaking against one's mind) and the *sin of deception* (intending to mislead). In *De Mendacio*, he suggests that speaking truth with intent to deceive is still sinful, just a different category of sin than *mendacium*. He values the "truth in the heart."
