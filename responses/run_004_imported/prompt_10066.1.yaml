      *   *Key Text:* *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying).
      *   *The "Truth in the Heart":* For Augustine, the sin of lying resides in the disconnect between the speaker's mind and their speech. If I say $X$, but I believe $\neg X$, I lie. If I say $X$, and I believe $X$, but $X$ turns out to be false in reality, I am mistaken, not lying.
      *   *The "Officious Lie":* Augustine classifies lies into eight categories (in *De Mendacio*). The least bad are "officious lies" (told to help someone, no malice). However, he *still* condemns them as sins, just venial ones. He famously argues one should not lie even to save a life or protect someone from rape (though he struggles with this).
      *   *Mental Reservation/Ambiguity:* Does Augustine allow for ambiguous statements that are technically true but misleading? This is the crux of the Devon case.
      *   *Augustine on Ambiguity:* In *De Mendacio*, Augustine discusses whether one can speak ambiguously to avoid telling a secret. He generally leans towards silence or refusing to answer rather than speaking ambiguously with intent to deceive. However, his strict definition of lying hinges on the *belief* of the speaker.
