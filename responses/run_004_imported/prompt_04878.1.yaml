      *   *Argument Structure:*
          1.  "Horse" names the shape/form.
          2.  "White" names the color.
          3.  "White horse" names shape + color.
          4.  Therefore, the concept "white horse" is not identical to the concept "horse".
          5.  *Practical implication:* If you ask for a "horse," a yellow or black one works. If you ask for a "white horse," a yellow one doesn't. Therefore, they are different.
      *   *Underlying Move:* Distinction between *extension* (the set of all horses) and *intension* (the definition/requirements). It's a semantic/logical argument about identity and classification.
      *   *Relation to Universals:* It implies "Whiteness" and "Horseness" are distinct concepts that combine, but the compound concept is distinct from the base concept.

  3.  **Deconstruct "Hard and White" (*Jian Bai Lun*):**
      *   *Core Claim:* "Hard," "White," and "Stone" are three separate things, not two (Hard-White-Stone). Or rather, Hardness and Whiteness are separate from each other and the stone.
      *   *Argument Structure:*
          1.  Look at the stone: You see White, you don't see Hard. (Vision $\rightarrow$ White).
