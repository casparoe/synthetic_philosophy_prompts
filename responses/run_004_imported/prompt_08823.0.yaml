answer: |-
  **Setting:** *A quiet corner of a pub, late evening. The noise of the bar is a low hum. Two people, ELENA and MARCUS, sit with half-empty glasses. They have been talking for an hour. A stack of printed PDFs sits on the table between them.*

  **Marcus:** So, you've sat with the proof for months now. Where does the weight of it land for you?

  **Elena:** It lands on the ontology. Lewis's math is airtight—I'm not disputing the derivation. If you assume Adams' Thesis holds universally, and you assume conditionals are propositions with truth conditions, you get the result that every proposition is probabilistically independent of every other. That's absurd. So, one of the premises has to go. I say we drop the idea that "If A, then B" expresses a proposition at all.

  **Marcus:** That's the Edgington line. The expressivist route.

  **Elena:** Exactly. Lewis didn't show that conditionals are broken; he showed that our intuition that they *describe facts* is broken. Adams' Thesis isn't a relationship between two probabilities; it's a rule for how we manage uncertainty. When I say, "If it rains, the match won't light," I'm not stating a fact about the world that has a probability. I'm telling you my degree of belief in the consequent, *supposing* the antecedent.

  **Marcus:** I see the appeal. It dissolves the triviality result instantly. If there's no proposition $A \to B$, then $P(A \to B)$ is a category error. But Elena, this buys you peace at the cost of logic. What happens when I embed that conditional?

  **Elena:** Embeddings are tricky, sure. But they're not impossible.

  **Marcus:** Are they? Take negation. "It is not the case that if it rains, the match will light." If the conditional has no truth value, what are you negating? You can't negate a speech act. You can't negate a rule for updating credence. You can only negate a claim that is capable of being false.

  **Elena:** We simulate truth conditions. In ordinary discourse, we treat them *as if* they have truth values. But logically, the negation is really a commitment to: "Supposing it rains, I believe the match *will* light." It's a shift in the conditional commitment, not a negation of a fact.

  **Marcus:** That feels like a workaround. And it gets worse with conjunctions or antecedents of other conditionals. "If, if A then B, then C." If the inner "if A then B" doesn't pick out a proposition, it can't serve as the antecedent for the outer conditional. Antecedents need to be truth-apt. You can't condition on a command or a policy.

  **Elena:** I'd argue we rarely actually reason with nested conditionals in the wild. When we do, we're usually unpacking them into equivalent non-conditional forms. But let's turn the table, Marcus. You want to keep the propositions. You want to keep the possible-worlds semantics, à la Stalnaker. So how do you dodge Lewis?

  **Marcus:** I deny that Adams' Thesis survives conditionalization.

  **Elena:** There it is. That's the move that keeps me up at night. You're saying $P(A \to B) = P(B|A)$ holds for my credences *right now*, but if I learn new evidence—say, I conditionalize on some $X$—the equation might break. The probability of the conditional proposition might diverge from the new conditional probability.

  **Marcus:** Precisely. Lewis's proof requires that the equation holds for *all* probability functions in the class, including those resulting from conditionalization. I'm saying the equation only holds for the agent's *actual* credence function at the time of utterance.

  **Elena:** But why? That looks incredibly ad hoc. If Adams' Thesis captures the meaning of the indicative conditional—if it tells us what "if" *means*—why should that meaning shift just because I updated my beliefs? If "if" means "conditional probability," it should mean that before I learn $X$ and after I learn $X$.

  **Marcus:** It's not ad hoc if you view the conditional as context-sensitive. Think about indexicals. "I am here" is true when I say it. If you say it later, the proposition changes because the context changed. I argue the conditional proposition expressed by "If A, then B" depends on the agent's epistemic state. When you conditionalize on new evidence, your epistemic state changes, so the *proposition expressed* changes.

  **Elena:** So the sentence stays the same, but the proposition it picks out slides around depending on what I know?

  **Marcus:** Yes. Lewis assumes the proposition is fixed across the update. I'm saying the update changes which proposition is being expressed. So, triviality is avoided because you aren't tracking the *same* proposition through the update.

  **Elena:** That saves the truth-conditions, but it severs the link between the conditional and the reasoning process. The reason Adams' Thesis felt so secure to us—the reason it matches our intuitions about betting and reasoning—is that we treat the conditional as a stable constraint on belief. If you tell me, "This equation holds for you now, but if you learn the truth of B, the probability of the conditional snaps to 1 or 0 regardless of A," you've made the conditional probabilistically inert for learning.

  **Marcus:** Not inert. Just sensitive. Look, Elena, your non-truth-conditional view has a cost I'm not willing to pay. If conditionals aren't propositions, they can't be the objects of knowledge. I can't *know* that if I drop this glass, it will break. I can only have a high conditional credence. That seems wrong. We reason *with* conditionals. We use them in reductio arguments. "Assume if A then B... derive a contradiction... therefore, it's not the case that if A then B." That whole structure collapses if there's no truth value to assume or negate.

  **Elena:** I'd say you *can* know a conditional, just not in the same way you know a categorical fact. You know it by having a disposition to infer B from A. But let's press on your "context-sensitivity" defense. If the proposition changes when I update, then when we disagree about a conditional, are we even disagreeing about the same thing?

  **Marcus:** We're disagreeing about which possible worlds are closest, given our shared context.

  **Elena:** But if I conditionalize on evidence you haven't seen, I'm now talking about a different proposition than you are, even if we use the same words. It makes communication look like a miracle. And frankly, it smells like a patch stitched on specifically to dodge Lewis. You kept the propositional semantics because you didn't want to lose classical logic, but you had to cripple the probability theory to make it fit. I'm willing to tweak the logic to save the probability theory.

  **Marcus:** And I'm willing to tweak the probability constraints to save the logic. Because without truth conditions, I don't see how you explain the validity of *Modus Ponens*. If "If A, then B" isn't true, and A is true, what forces B to be true?

  **Elena:** Assertibility. If it's assertible that $A \to B$, and you assert A, then B becomes assertible. You don't need truth preservation for valid reasoning; you need information preservation.

  **Marcus:** But then you have to explain why truth preservation works so well as a proxy for information preservation in every other case.

  **Elena:** Because most sentences *are* propositions. Conditionals are the outlier. Lewis showed us they are the outlier. Why fight the math?

  **Marcus:** Because the math assumes the proposition is static. I think the linguistic data suggests it isn't. When I say, "If Oswald didn't kill Kennedy, someone else did," I'm expressing a proposition about the actual world, constrained by my current knowledge. If my knowledge changes, the constraint changes. Lewis proved that a *static* propositional account is incompatible with Adams' Thesis. I'm arguing for a *dynamic* propositional account.

  **Elena:** Dynamic semantics is a heavy machinery to import just to save the idea that conditionals have truth values. At some point, you have to ask: if this "proposition" behaves unlike every other proposition we know—if it shifts under conditionalization, if its probability is bounded by the consequent, if it can't be negated without pragmatic heavy-lifting—what work is the word "proposition" doing for you?

  **Marcus:** It allows me to say that sometimes, conditionals are just *true*. And sometimes, they are *false*. And that when they are false, the world is different than when they are true. That seems like a feature of reality, not just a feature of my mind.

  **Elena:** Or it seems like a feature of how we navigate reality. Lewis showed that if you try to map that navigation onto a map of facts, the map tears. I'm saying: put down the map. Pick up the compass.

  **Marcus:** *(Smiles, lifting his glass)* And I'm saying the compass is useless if there's no terrain. But I admit, the terrain is stranger than Stalnaker originally thought.

  **Elena:** *(Clinks her glass against his)* To strange terrain. And to Lewis, for showing us the cliff edge.

  **Marcus:** To Lewis. May we never fall off.
