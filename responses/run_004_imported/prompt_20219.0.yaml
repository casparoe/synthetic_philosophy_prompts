prompt: |-
  Kind of a random question but it's been on my mind all week. My grandfather's in hospice now (maybe two weeks left, possibly less), and he's being wierdly upbeat about it, which is freaking out half the family. He keeps saying his body was never really 'his' to begin with, more like something on loan that's about to get reshaped into something else -- compost, worm food, whatever -- and that he's honestly curious what that's like, since none of us actually know being dead is worse than being alive. When my aunt begged him to keep fighting, he told her that's basically like arguing with whoever's in charge of the universe about the next shape it's picked out for you. Half my cousins think this is just denial dressed up as wisdom, but I find it kind of moving. I'm a philosophy PhD student myself (phil of language, so this is way outside my wheelhouse) -- is there an actual defensible position hiding under what he's saying, or are we all just projecting depth onto an old man coping the best he can?
