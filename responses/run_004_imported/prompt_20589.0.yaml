answer: |-
  **Title:** The Marketplace of Unratifiable Acts
  **Characters:**
  *   **SAM:** The Traveler (the agent).
  *   **CLARA:** Causal Decision Theorist.
  *   **EVAN:** Evidential Decision Theorist.

  **Setting:** A dusty corner of the Damascus marketplace. SAM is pacing nervously. CLARA and EVAN stand on either side of him, holding clipboards.

  **SAM:** He's coming for me. The prediction was made yesterday. If I'm in Damascus tomorrow, he's in Damascus. If I'm in Aleppo, he's in Aleppo. I just need to be where he isn't.

  **CLARA:** (Checking her notes) Standard Death in Damascus. Payoff matrix is simple: Survival is 0, Death is -1000. You want to maximize expected utility.

  **EVAN:** And the predictor is near-perfect. Let's assume probability of accuracy is 1 for simplicity. $P(\text{Death at } D \mid \text{Sam goes } D) = 1$.

  **SAM:** So? Where do I go?

  **CLARA:** Not so fast. Sam, listen to me. You cannot causally influence where Death is right now. The prediction is a fact of the past. Your legs move *now*. Death's location was fixed *then*.

  **EVAN:** But your legs moving now are *evidence* of where Death was fixed then. That's the point of the predictor, isn't it?

  **CLARA:** (Turning to Evan) That's exactly why this isn't Newcomb's Problem. In Newcomb, correlating with the predictor gets you the million. Here, correlating with the predictor gets you a grave. It inverts the incentive. In Newcomb, you want your act to be *evidence* that the box is full. Here, you want your act to be *evidence* that Death is elsewhere.

  **EVAN:** So we agree on the goal. Avoid the correlation.

  **CLARA:** We do not. If I advise Sam to go to Aleppo, I am advising him to perform an act. As a causal theorist, I evaluate the act by its causal consequences. Going to Aleppo does not *cause* Death to be in Damascus. Death is already in Damascus or already in Aleppo.

  **SAM:** But if I go to Aleppo, and Death predicted Aleppo, I die.

  **CLARA:** Precisely. And here is the rub. If you decide to go to Aleppo, you must believe that Death likely predicted Aleppo. Why? because Death predicts your decisions. So, upon deciding Aleppo, your credence that Death is in Aleppo should rise to nearly 1.

  **SAM:** So I should go to Damascus instead?

  **CLARA:** If you decide Damascus, then by the same logic, you must believe Death predicted Damascus. So you should go to Aleppo.

  **SAM:** (Stops pacing) I'm looping.

  **CLARA:** You are. Neither pure strategy is *ratifiable*. A decision is ratifiable only if, assuming you make that decision, it remains the utility-maximizing option. If you decide Aleppo, you expect Death in Aleppo, so Damascus looks better. If you decide Damascus, you expect Death in Damascus, so Aleppo looks better.

  **EVAN:** (Smirking) And this is where Causal Decision Theory collapses into paralysis. You've built a model where rationality forbids you from acting.

  **CLARA:** It forbids *pure* strategies. It doesn't forbid action. It requires a mixed strategy. Sam, you must randomize. Flip a coin. 50/50.

  **SAM:** A coin flip? My life depends on a coin flip?

  **CLARA:** It's the only way to break the evidential link from your perspective. If you commit to a 50/50 mix, Death predicts the mix. He can't predict the outcome of the coin toss. So, conditional on you employing the mixed strategy, the probability of Death being in Damascus is 0.5, regardless of where the coin lands. Your expected utility for going to Damascus becomes equal to Aleppo. The loop closes. You are ratifiable.

  **EVAN:** This is absurd, Clara. You're admitting that to be rational, Sam must surrender his agency to a randomizer. You're telling him that *choosing* is irrational, but *gambling* is rational.

  **CLARA:** I'm telling him that in a world with a perfect predictor of his choices, "choosing" in the pure sense creates an instability. Yes, it costs the view something. It costs the intuition that rational agents should be able to deterministically commit to a plan. But it's better than your alternative. What does EDT say?

  **EVAN:** EDT says: Look at the conditional probabilities. $V(A) = \sum P(S \mid A) U(S, A)$.
  If Sam goes to Damascus, $P(\text{Death at } D \mid \text{Sam at } D) \approx 1$. Utility is -1000.
  If Sam goes to Aleppo, $P(\text{Death at } A \mid \text{Sam at } A) \approx 1$. Utility is -1000.
  Both acts have terrible expected utility.

  **SAM:** So I'm dead either way?

  **EVAN:** Not necessarily. It implies you should be indifferent between the two, provided you can't change the prediction. But since both look fatal, a sophisticated EDT agent might also retreat to a mixed strategy to lower the conditional probability of death.

  **CLARA:** (Sharp turn) Ah. So you concede the mixed strategy too?

  **EVAN:** I concede that if the conditional probabilities are fixed by the act, both acts are bad. But I don't need your notion of ratifiability to say that. I just look at the news. Going to Damascus is bad news. Going to Aleppo is bad news.

  **CLARA:** But Evan, this smells exactly like the Smoking Lesion.

  **EVAN:** Don't you dare.

  **CLARA:** Why not? In the Smoking Lesion case, there's a gene that causes both a desire to smoke and lung cancer. Smoking doesn't cause cancer. CDT says: Smoke! Enjoy it. It doesn't change your health. EDT says: Don't smoke! Smoking is evidence you have the gene.
  Here, the Prediction causes Death's location and correlates with Sam's location. Sam's location doesn't cause Death's location. You are advising Sam to treat his movement as if it influences Death, or at least as if avoiding the "bad news" of the movement saves him.

  **EVAN:** In the Lesion, smoking doesn't change the probability of the gene. Here, Sam's decision *is* what the predictor predicted. The structure is tighter.

  **CLARA:** Is it? If Sam uses a mixed strategy, he's essentially saying, "I will make my act probabilistically independent of the Prediction." CDT justifies this causally: the coin toss is a new causal node the predictor couldn't foresee. EDT justifies it... how? Because it makes the news less bad?

  **EVAN:** Because it updates the conditional probability! If Sam commits to a 50/50 mix, then $P(\text{Death at } D \mid \text{Sam uses Mix}) = 0.5$. The expected utility of the *policy* of mixing is higher than the policy of going pure.

  **CLARA:** But you're evaluating the *policy*, not the *act*. EDT is supposed to evaluate acts. If you evaluate the act of "Going to Damascus given I mixed," you're back to square one.
  Here's the embarrassment for your view, Evan. In the Smoking Lesion, EDT tells the agent to avoid smoking to avoid the *evidence* of the lesion, even though avoiding smoking doesn't cure the lesion. It's spurious correlation avoidance.
  In Death in Damascus, if you tell Sam to mix, you are telling him to randomize his location to avoid the *evidence* of Death's location. But just like the lesion, his location doesn't *cause* Death's location.
  My view recommends the mix because it severs the causal relevance of the prediction to the *outcome of the toss*. Your view recommends it because it makes the conditional probability of death look better. But if the predictor is truly perfect, how does the mix help you evidentially? If the predictor predicted the mix, he predicted the 50/50 chance. He is still in the city you land in.

  **EVAN:** You're confusing the prediction of the act with the prediction of the outcome. If Sam decides "I will go to Damascus," the predictor is in Damascus. If Sam decides "I will flip a coin," the predictor knows he will flip a coin. But the predictor cannot know the outcome of a truly random quantum event.
  So, if Sam flips the coin, the predictor is in Damascus with 50% probability.
  $P(\text{Death at } D \mid \text{Coin lands D}) = 1$.
  Wait.

  **SAM:** Wait. If the coin lands Damascus, and the predictor knew I'd flip, where is Death?

  **CLARA:** (Sighs) This is the cost I mentioned. If the predictor is perfect, he predicts the coin outcome too, unless the coin is causally isolated from the prior state of the universe. If the coin is deterministic, Death is waiting at the outcome. If the coin is indeterministic, Death can't predict it.
  CDT requires the coin to be indeterministic to work cleanly. We need a causal break.

  **EVAN:** And EDT? If the coin is indeterministic, then $P(\text{Death at } D \mid \text{Coin lands } D)$ drops to 0.5? No. If Death is already there, the probability is 1.
  This is the problem. If Death is *already* in Damascus, then conditional on Sam going to Damascus, the probability of death is 1. It doesn't matter if he used a coin. The evidence is that Sam is in Damascus. Death is in Damascus.
  So for EDT, the mixed strategy doesn't actually help the conditional probability *at the moment of action*.
  $P(\text{Death} \mid \text{Act})$ remains 1 for whichever city he picks.

  **CLARA:** Exactly! So EDT has no stable solution either, unless it evaluates the *decision to randomize* as the act, rather than the movement itself. But then you're doing CDT on the meta-act. You're treating the randomization as a causal intervention that screens off the prediction.

  **EVAN:** I can treat the decision procedure as the object of evaluation. Jeffrey's decision theory allows for that. I evaluate the proposition "Sam adopts a mixing policy."

  **CLARA:** But then you're admitting that the simple act-evaluation $V(A)$ fails here. You need ratifiability or policy-evaluation to stop the spiral. And if you go that route, aren't you just conceding that causal structure matters? You need to know *why* the correlation exists to know if you can break it.
  In the Smoking Lesion, you say "Don't smoke" because you can't break the correlation between the gene and the urge. Here, you say "Mix" because you *can* break the correlation between the prediction and the outcome (via indeterminism).
  How do you know you can break it without looking at the causal graph?

  **EVAN:** I look at the conditional probabilities. If adopting the policy changes the conditional probability of survival, I adopt it.

  **CLARA:** But *why* does it change the probability? Because of the causal limit of the predictor! You're smuggling causality into your evidential conditional.
  If you don't smuggle it in, you're stuck telling Sam: "Going to Damascus is bad news. Going to Aleppo is bad news. I have no advice."
  Whereas I tell him: "Your choice doesn't cause Death's location. But your choice determines where you die if you match. Since you can't know where Death is, you must make your choice unpredictable to minimize the match rate *ex ante*."

  **SAM:** (Rubbing his temples) So, Clara, you say I must flip a coin because my choice can't change the past, but I must hide my choice from the past. Evan, you say...?

  **EVAN:** I say... I say that if you go to Damascus, you have strong evidence you will die. If you go to Aleppo, you have strong evidence you will die. But if you commit to a coin flip *now*, before the prediction was fully finalized... wait, the prediction was yesterday.

  **CLARA:** Yesterday.

  **EVAN:** Then the evidence is fixed. If you go to Damascus, you die. If you go to Aleppo, you die. The only way out is if your decision *now* was not predictable *then*.

  **CLARA:** Which brings us back to free will vs. determinism. But look at the cost to your view, Evan. In the Smoking Lesion, you forbid smoking to avoid bad news, even though smoking is harmless. Here, you recommend mixing to avoid bad news, but mixing is only helpful if it's causally opaque to the predictor.
  In both cases, you are acting as if manipulating the evidence manipulates the world. In the Lesion, it doesn't. In Damascus, it only does if there's a causal gap.
  Why should I trust your verdict on the Lesion if your reasoning here relies on a causal gap you refuse to acknowledge in your formalism?

  **EVAN:** Because in the Lesion, the conditional probability $P(\text{Cancer} \mid \text{Smoke})$ is high regardless of policy. In Damascus, $P(\text{Death} \mid \text{Mix})$ is lower than $P(\text{Death} \mid \text{Pure})$. The math distinguishes the cases.

  **CLARA:** The math distinguishes them only if you input the causal structure into the probabilities! If you treat the predictor as a black box of correlations, you can't distinguish a predictor who predicts your coin toss from one who predicts your choice.
  If the predictor predicts the coin toss, your mix gives you 0% survival (he's at the outcome). If he predicts the choice but not the toss, you get 50%.
  EDT doesn't tell you which predictor you face. CDT tells you to check the causal arrows.

  **EVAN:** CDT tells you to check the arrows, finds none from Act to Prediction, and then spirals into unratifiability until you beg for a quantum coin.
  Sam, look. Both of us are telling you that staying put in a pure strategy is suicide. Clara needs a metaphysical loophole (indeterminism) to save her theory. I just need you to accept that some decisions are better evidence than others.

  **SAM:** And if the coin is deterministic?

  **CLARA:** (Pauses) Then you are dead. The prediction is already made. My theory says your act is causally irrelevant to Death's location, but since Death matches your act, and your act is determined, Death matches the determination. You die.
  But at least I can say *why*.

  **EVAN:** And I can say that given you are determined, your conditional probability of death is 1.

  **SAM:** So you're both useless if the universe is deterministic.

  **CLARA:** No. If the universe is deterministic, CDT says "Do what you want, you can't change the past." But since Death matches you, you die. The tragedy is metaphysical, not decision-theoretic.
  But if there is *any* causal freedom, my mixed strategy works.
  Yours, Evan, relies on the idea that "Deciding to mix" is different evidence than "Deciding to go." But if the predictor is perfect, "Deciding to mix" leads to "Going to Damascus" with 50% chance. If the predictor predicted "Deciding to mix," did he predict the outcome?
  If yes, EDT says $P(\text{Death} \mid \text{Go } D) = 1$.
  If no, EDT says $P(\text{Death} \mid \text{Go } D) = 0.5$.
  How do you know which probability to use without asking *me* about the causal link?

  **EVAN:** (Silence for a moment) I use the probability that reflects my total evidence.

  **CLARA:** And your total evidence includes the fact that you are in a causal world where predictions precede actions. You're using my map, Evan. You just refuse to admit it's a causal map.

  **EVAN:** And you're using my expected utility calculus, Clara. You just refuse to admit that your "ratifiability" condition is just a way of forcing evidential stability onto a causal framework. You want the act to be its own evidence.

  **CLARA:** I want the act to be stable. There's a difference.

  **SAM:** (Looks at the sun setting) It's getting late. I have to book a caravan for tonight.

  **CLARA:** Flip the coin. It's the only ratifiable move.

  **EVAN:** Don't flip it. Just... consider the policy of flipping. It's better news.

  **SAM:** If I flip, and the coin says Damascus, and Death is there...

  **CLARA:** Then you died rationally.

  **EVAN:** Then the news was bad.

  **SAM:** (Pulls a coin from his pocket) You two have been arguing for an hour. In that time, Death has probably moved closer.

  **CLARA:** Death doesn't move closer. Death is already there.

  **EVAN:** Death is where the evidence points.

  **SAM:** (Flips the coin. Catches it. Slaps it onto his wrist.)
  I'm not looking.

  **CLARA:** Good. Causal independence.

  **EVAN:** Ignorance is evidence too.

  **SAM:** (Covers the coin) If I don't look, I don't update the probability.

  **CLARA:** Sam, don't be an idiot. You have to go where the coin says.

  **EVAN:** If you don't look, you can't condition your act on the outcome. You're just committing to the mix.

  **SAM:** (Stands up) I'm going to the city the coin *doesn't* say.

  **CLARA:** You can't. You haven't looked.

  **SAM:** I'll hire a messenger. He looks, then runs to the other city.

  **EVAN:** But the predictor predicted you'd hire a messenger!

  **CLARA:** (Eyes widen) Wait. If he hires a messenger, the act is "Hire Messenger." The prediction is "Sam hires messenger." Death goes to the messenger's destination? No, Death goes to *Sam*.
  If Sam commits to "Go opposite of coin," that is a deterministic strategy.

  **EVAN:** So Death predicts "Go opposite of coin." He waits at the opposite city.

  **CLARA:** Then Sam dies.

  **SAM:** (Smiles weakly) Then I'll flip two coins. And hire two messengers. And...

  **CLARA:** Sam, stop. You're entering an infinite regress.

  **EVAN:** He's trying to screen off the prediction.

  **CLARA:** He's trying to out-compute a perfect predictor.

  **SAM:** (Starts running toward the city gates) I'm going to a third city!

  **CLARA:** There are only two cities in the puzzle, Sam!

  **SAM:** (Yelling back) Then I'll invent a third!

  **CLARA:** (Watching him go) He's not being rational.

  **EVAN:** He's maximizing expected utility given the evidence that you two are confusing him to death.

  **CLARA:** (Sighs) At least he's not ratifiable.

  **EVAN:** No. But he might survive.

  **CLARA:** If he survives, the predictor wasn't perfect.

  **EVAN:** Or the decision theory was incomplete.

  *(They watch the dust settle. Neither moves to follow him.)*

  **CLARA:** So... coffee?

  **EVAN:** Only if you pay. It's bad news for my wallet if I do.

  **CLARA:** Causally speaking, your buying has no effect on my bank account.

  **EVAN:** But it's excellent evidence that you think you're right.

  *(They walk off in opposite directions.)*

  **[END]**
