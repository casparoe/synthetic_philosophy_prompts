answer: |-
  Karl Popper is having a drink with a philosopher of biology at an LSE symposium.

  The biologist raises a glass. "Karl, be honest. When you called natural selection a 'metaphysical research programme,' did you really think 'survival of the fittest' was just a tautology for 'survival of the survivors'?"

  Popper sighs, but smiles. "For a time, yes. I thought it was unfalsifiable."

  "But you recanted in '78," the biologist presses. "You admitted it's testable science."

  "I did."

  "So what happened to your original argument?"

  Popper swirls his wine. "Well, it entered an intellectual environment hostile to circular reasoning. It failed to reproduce in the literature. It went extinct."

  The biologist grins. "So... your old idea died because it wasn't *fit*?"

  "Precisely."

  "So the process of you admitting you were wrong... is itself an instance of natural selection?"

  Popper laughs. "Yes. It seems I had to be naturally selected into accepting natural selection. My criticism was the variation. The peer review was the selection pressure." He clinks his glass against the biologist's. "And my recantation? Well, let's just say my ideas finally falsified my falsification."
