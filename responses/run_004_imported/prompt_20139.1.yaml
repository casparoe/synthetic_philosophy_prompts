prompt: |-
  I'm a novelist in the final stretch of a courtroom novel whose protagonist — a federal appellate judge — is a committed textualist in the tradition associated with Scalia and, more recently, Gorsuch. So that her convictions read on the page as earned rather than recited, I've arranged a research conversation with a friend who is a law professor and an unapologetic defender of that methodology, and I want the questions to actually test him. Please draft eight to ten interview questions that go beyond having him restate the theory. I want at least one question on each of the following: how the absurdity doctrine and the scrivener's-error exception can be justified without smuggling purpose back in through the back door; Church of the Holy Trinity v. United States as the paradigm case textualism was built to prevent; the split among self-described textualists over Bostock v. Clayton County, where Gorsuch's majority and Alito's and Kavanaugh's dissents each claimed fidelity to text; and whether Scalia's 'elephants in mouseholes' principle from Whitman v. American Trucking is a genuine linguistic canon or a purposive judgment in textualist dress. For each, add a follow-up keyed to the answer he's most likely to give. Close with one question that presses on Justice Kagan's remark that 'we're all textualists now' by asking what, short of that consensus, would actually count as evidence against his view.
