answer: |-
  Here are ten interview questions designed to stress-test textualist theory, drafted to help you flesh out your protagonist's judicial philosophy. They move from specific doctrinal tensions to broader philosophical vulnerabilities.

  ### 1. The Absurdity and Scrivener's Error Exception
  **Question:** Textualism claims to bind the judge to the words Congress enacted, yet you allow exceptions for "scrivener's errors" or "absurd results." If a judge decides a result is absurd, aren't they necessarily making a judgment about what the law was *supposed* to achieve? How do you draw that line without smuggling legislative purpose back in through the back door?

  **Follow-up:** *If he argues that absurdity is limited to semantic incoherence (i.e., the words make no sense grammatically):* "But in practice, courts often invoke absurdity when the outcome is policy-disastrous, not just grammatically weird. If your judge ignores a clear text because the outcome is 'too harsh,' isn't she acting as a super-legislator, which is the very sin textualism claims to prevent?"

  ### 2. *Church of the Holy Trinity* as the "Original Sin"
  **Question:** Textualists often treat *Church of the Holy Trinity v. United States* as the paradigm case of everything wrong with purposivism. But that case involved a statute prohibiting the importation of foreign labor, and the Court exempted a church hiring a minister. If a textualist judge today faced the exact same facts and statute, would she really criminalize the church? If not, isn't *Holy Trinity* actually correct, and the textualist objection just about methodology?

  **Follow-up:** *If he insists the text clearly covered the minister and the Court was wrong:* "So you would accept the criminalization of a church hiring a priest if the text commanded it? At what point does fidelity to the text become a fetish that undermines the rule of law's legitimacy in the eyes of the public?"

  ### 3. The *Bostock* Split and Methodological Indeterminacy
  **Question:** In *Bostock v. Clayton County*, Justice Gorsuch's majority opinion and Justice Alito's dissent both claimed to be applying strict textualism, yet they reached opposite conclusions on whether "sex" includes "sexual orientation." If the same methodology yields diametrically opposed results from judges equally committed to it, doesn't that suggest the method is indeterminate? How is "ordinary public meaning" anything other than a Rorschach test for the judge's own values?

  **Follow-up:** *If he argues that Gorsuch was right and Alito was simply mistaken about the language:* "If the 'ordinary meaning' is so clear that only one side can be right, why did three seasoned textualist justices disagree so vehemently? Does that disagreement prove that 'ordinary meaning' is a construct, not a discovery?"

  ### 4. The "Ordinary Person" Construct
  **Question:** Following up on *Bostock*, textualism relies on the "ordinary public meaning" at the time of enactment. But the "ordinary person" is a fiction. Whose vocabulary counts? The drafters'? The voters'? The lawyers'? If your judge has to construct an "ordinary person" to read the statute, isn't she inevitably projecting her own educational background and worldview onto that hypothetical reader?

  **Follow-up:** *If he suggests we look to dictionary definitions from the era:* "Dictionaries capture a range of meanings, not a single command. If your judge selects one definition over another to avoid a disruptive outcome, isn't that selection process driven by the very consequences textualism claims to ignore?"

  ### 5. "Elephants in Mouseholes" (*Whitman v. American Trucking*)
  **Question:** Justice Scalia argued in *Whitman* that Congress doesn't hide "elephants in mouseholes"—meaning agencies can't claim vast power from vague statutory language. Is this a genuine linguistic canon based on how people speak, or is it a substantive policy judgment about limited government dressed up as a linguistic rule?

  **Follow-up:** *If he insists it is a linguistic rule (people don't speak in hints about big things):* "Can you give me a non-legal example of this? If I tell my assistant 'file the papers,' and she reorganizes the entire department, did I hide an elephant in a mousehole? Or is this canon only invoked when the court wants to limit administrative power?"

  ### 6. The Ban on Legislative History
  **Question:** Textualists famously refuse to look at committee reports or floor speeches, arguing that only the enacted text is law. But if a judge is unsure what a technical term means, why would she blind herself to evidence that clarifies the ambiguity? Isn't refusing to look at legislative history like a detective refusing to look at fingerprints because only the confession counts as evidence?

  **Follow-up:** *If he argues that legislative history is manipulable and not voted on:* "Granted, it can be manipulated. But if the text is genuinely ambiguous, and the history provides a coherent explanation that aligns with the text, does excluding it actually serve the law, or does it just increase the judge's own discretion to choose among meanings?"

  ### 7. Text vs. *Stare Decisis* (Precedent)
  **Question:** What happens when a longstanding precedent has interpreted a statute in a way your judge believes is textually wrong? Does textualism demand she overrule the precedent to correct the error, or does *stare decisis* allow the error to stand? If she keeps the error, isn't she admitting that stability matters more than textual fidelity?

  **Follow-up:** *If he says she must overrule the precedent to honor the text:* "That creates significant disruption in the law. If a textualist judge upends settled commercial or criminal law based on a new reading of old text, isn't she engaging in the same kind of judicial activism she accuses purposivists of?"

  ### 8. Democratic Legitimacy and the "Umpire" Analogy
  **Question:** Textualists argue their method is more democratically legitimate because it forces Congress to write clear laws if they want specific outcomes. But if Congress is dysfunctional and rarely writes clear laws, doesn't this methodology just transfer power from the legislature to the judiciary, since judges get to decide what the "clear text" means?

  **Follow-up:** *If he argues this incentivizes Congress to legislate better:* "There's little evidence Congress is writing clearer statutes because of textualism. In the meantime, isn't the 'umpire' actually calling balls and strikes based on his own view of the strike zone, while claiming he's just reading the rulebook?"

  ### 9. The Evolution of Language
  **Question:** You focus on the meaning of the text at the time of enactment. But language evolves. If a statute uses a term like "vehicle," does that include software or autonomous drones today? If the text is fixed but the world changes, does a textualist judge apply the old meaning to new facts, or does she update the meaning? If she updates it, isn't she engaging in the living constitutionalism she critiques?

  **Follow-up:** *If he says the meaning is fixed but applies to new technologies that fit the definition:* "Who decides if the new technology 'fits'? That determination requires a judgment about the *purpose* of the regulation. Aren't you back to asking what the law was trying to regulate, rather than just what the words say?"

  ### 10. The Kagan Challenge (Falsification)
  **Question:** Justice Kagan once remarked, "We're all textualists now," suggesting that even non-textualists prioritize the text. If the consensus is that broad, what would actually count as evidence against your view? Is there any case, any statute, or any outcome where you would admit that looking past the text to the purpose would yield a more just or legally correct result?

  **Follow-up:** *If he struggles to name a scenario where textualism fails:* "If there is no scenario where the method fails, then textualism isn't a methodology; it's an ideology. If you can't imagine being wrong, how can your judge in my novel be anything other than a dogmatist?"
