      *   **The Geometry Analogy:** This is the standard introductory analogy. It works well for *formalism* (math as symbol manipulation). In geometry, we accept multiple "truths" depending on the space.
      *   **The Set Theory Difference:** Why is set theory different from geometry?
          *   Geometry describes *spaces*. There are many spaces.
          *   Set theory (specifically ZFC) aims to describe *the* universe of sets ($V$). Platonists believe there is one intended model.
      *   **Platonism vs. Formalism/Multiverse:**
          *   *Formalism/Multiverse:* Math is a game. ZFC is one rule set. CH is undecidable. Pick a version you like. (User's current view).
          *   *Platonism:* There is a real mathematical universe. CH is either true or false in that universe, we just haven't found the right axioms to prove it yet. (Woodin's view).
      *   **Intrinsic vs. Extrinsic Justification:**
          *   *Intrinsic:* Does the axiom follow from the *concept* of set? (e.g., Iterative conception).
          *   *Extrinsic:* Does the axiom make the theory richer, solve more problems, unify fields? (e.g., Large Cardinal Axioms).
      *   **The Search for New Axioms:** Why look for them? Because ZFC is incomplete (Gödel's Incompleteness Theorems). We want a "complete" description of $V$.

