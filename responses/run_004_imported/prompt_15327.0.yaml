  5.  **Evaluate the "Expert vs. Crowd" Dynamic:**
      *   **Expert:** Certified arborist. Has training, tools, liability, experience. High $p$ (probability of correctness).
      *   **Crowd:** Amateurs, 2D photos, no tools. Low $p$.
