      *   The counter-concept is **Groupthink**, **Information Cascades**, and **Systematic Bias**.

  3.  **Deconstruct the "Wisdom of Crowds" (WoC):**
      *   *What makes WoC work?* James Surowiecki's criteria are the standard reference here.
          1.  **Diversity of Opinion:** Each person should have some private information or unique perspective.
          2.  **Independence:** People's opinions shouldn't be determined by those around them.
          3.  **Decentralization:** People can specialize and draw on local knowledge.
          4.  **Aggregation:** A mechanism exists for turning private judgments into a collective decision.
      *   *Mathematical Underpinning (Condorcet's Jury Theorem):* If each voter has a probability $p > 0.5$ of being correct, and votes are independent, the probability of the majority being correct approaches 1 as $n$ increases.
      *   *Crucial Caveat:* If $p < 0.5$ (systematic bias/ignorance), more voters make it *worse*. If votes are correlated (not independent), the effective $n$ shrinks.

  4.  **Evaluate the HOA Scenario against WoC Criteria:**
      *   **Diversity:** Did everyone look at different angles? No, they all saw the *same* photos. This limits information diversity.
      *   **Independence:** The user explicitly noted people echoed early replies. This violates independence. This creates an *information cascade*.
      *   **Competence ($p > 0.5$):** Do amateurs looking at 2D photos of a tree have better than random chance of diagnosing internal rot? Tree pathology is specialized. Internal rot is often invisible without tools (resistograph, sonic tomography). If $p \approx 0.5$ or lower, the math fails.
