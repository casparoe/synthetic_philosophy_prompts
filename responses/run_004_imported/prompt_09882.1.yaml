answer: |-
  Johannes Kepler would likely greet the rise of psychological astrology with a complex mixture of vindication and profound frustration. He would not, as the modern skeptic does, dismiss the enterprise outright. In *De Fundamentis Astrologiae Certioribus* (1601), Kepler argued that astrology possessed a rational core buried beneath superstition. He would recognize the Jungian shift away from fatalistic prediction toward temperamental inclination as a validation of his own central thesis: the heavens do not compel human action but resonate with a harmonic faculty within the soul. For Kepler, the stars were not tyrants but musicians, playing upon the human spirit.

  In *Harmonices Mundi* (1619), Kepler proposed that planetary aspects—geometric angles formed by light rays striking the Earth—trigger responses in the human psyche akin to musical consonance. He believed the soul possesses an innate geometric intuition, perceiving these celestial ratios unconsciously. When modern practitioners like Liz Greene treat the natal chart as a symbolic language for self-understanding rather than a decree of destiny, they echo Kepler's distinction between physical influence and free will. He would applaud the focus on internal architecture over external event forecasting, seeing it as a return to astrology's legitimate purpose: mapping the soul's predispositions. The algorithmic nature of apps like Co-Star might even appeal to his desire for mathematical precision in calculating aspects.

  However, Kepler's endorsement would halt abruptly at the zodiac. He vehemently rejected the twelve signs and the house system as arbitrary human fictions, lacking any physical or geometric basis. For Kepler, the only valid astrological data were the aspects themselves—the conjunctions, sextiles, and squares derived from pure geometry. Today's psychological astrology, even in its most sophisticated forms, remains entrenched in the sign-based symbolism (Aries, Pisces, etc.) that Kepler deemed "poetic" rather than scientific. He would argue that grounding personality in the constellation behind the sun is as baseless as predicting harvests by it.

  Furthermore, Kepler sought a physical cause—light and geometry acting on the terrestrial soul. Modern archetypal astrology often retreats into hermeneutics, treating the chart as a text to be interpreted rather than a harmonic structure to be felt. While he would appreciate the move away from superstition, Kepler would likely conclude that psychological astrology remains half-reformed. It has adopted his ethics of inclination but retained the Chaldean furniture he tried to demolish. He would urge these modern seekers to discard the signs and listen strictly to the geometry of the spheres, arguing that true self-knowledge comes from universal harmonies, not the arbitrary sectors of the ecliptic. To Kepler, a psychological astrology bound to the zodiac is a harmony played on an out-of-tune instrument, beautiful in intent but flawed in physics.
