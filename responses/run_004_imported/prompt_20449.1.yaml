answer: |-
  Good evening, everyone. For those who don't know me, I'm [Sister's Name]'s older sibling. And for those who *do* know me, you know I'm currently four years into a PhD on early Confucian ethics.

  [Sister's Name] asked me to give this toast, which I think was a subtle act of revenge. She knows that when I'm asked to speak about "commitment" and "family," I don't just get nervous; I have an existential crisis. She knows I will spend weeks worrying about whether the word "love" is too vague, or if the word "duty" sounds too coercive.

  So, I want to start by addressing the elephant in the room. There are two ways to look at marriage.

  On one side, you have the modern view: Two fully autonomous, independent individuals come together and choose each other. No strings attached, just pure freedom and chemistry. That's the view [Groom's Name] grew up with, and frankly, it's the view his friends probably prefer. You're here to celebrate a choice, not a contract.

  On the other side, you have my parents' view. And, okay, the view I study in dusty old texts. This view says that we aren't actually as independent as we think. It says that who we *are* is defined by the people around us. You aren't just a "self" floating in space; you are a son, a brother, a husband, a son-in-law. And those titles come with scripts. They come with holidays, phone calls, and eventually, caregiving.

  Now, usually, these two views are at war. I've seen it at our family dinners. There's this unspoken tension: Is [Groom's Name] joining a team, or is he just dating [Sister's Name] with a ring?

  But here is the thing I've learned from my research, and from watching these two together: Both sides are right. And that's why this marriage is going to work.

  [Groom's Name], from my perspective, you are doing something radical. You are exercising your individualist freedom to give up your individualism. You are standing up here and saying, "I choose to be defined by this relationship."

  In the texts I read, we say there is no "self" behind the roles. There is just the sum of our relations. That sounds terrifying when you say it out loud at a wedding. It sounds like I'm telling you that you've lost your freedom. But I'm not.

  I'm saying that you've gained a context.

  Before you met [Sister's Name], you were the author of your own story. And you still are. But now, you're co-authoring. You aren't just "you" anymore. You are "half of [Sister's Name] and [Groom's Name]." You are the person who gets texted when the Wi-Fi goes out. You are the person who has to pretend to like my mother's cooking even when it's too salty. You are the person who gets to be there when the world is hard.

  To my parents: You don't need to worry about whether he understands the obligations. He understands them because he loves her. In the Confucian tradition, ritual isn't about following rules; it's about expressing care in a language everyone understands. When he shows up for Thanksgiving, or helps move a couch, or listens to my dad explain the same political opinion for the tenth time, he isn't checking a box. He's building the relationship that makes him who he is.

  And to [Groom's Name]'s friends and family: Don't worry. He isn't being absorbed by a cult. He's expanding his world. He's not losing his independence; he's gaining a partner who makes his independence worth something.

  [Sister's Name], you know I overthink everything. I analyze texts from 2,500 years ago to find the definition of a good life. But watching you two, I don't need the texts.

  I see the way you look at him when he walks into a room. I see the way he calms you down when you're spiraling. I see the way you've already started to become a "we."

  There is a concept in my field called *ren*, often translated as "humaneness." But a better translation might be "authoritative conduct toward others." It's the idea that we become fully human only in relation to other people.

  Looking at you two, I see that. You make each other more human. You make each other kinder, braver, and funnier. You are building a shared life that honors both the freedom to choose each other, and the duty to stay chosen.

  So, if everyone could please raise a glass.

  To [Sister's Name] and [Groom's Name]. May your roles be many, may your obligations be light, and may you always find that the best part of who you are is who you are together.

  To the happy couple.
