      *   **Philosophical Constraint:** The speaker believes the Rosemont/Ames interpretation of Confucianism (no self behind roles, we are the sum of relations) is correct. They cannot falsely preach radical autonomy.
      *   **Social Constraint:** Cannot lecture the groom's side on unchosen obligations (sounds coercive/creepy). Cannot alienate parents by dismissing family duty.
