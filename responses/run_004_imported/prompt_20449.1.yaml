      *   *Individualist View:* We are autonomous agents. Marriage is a contract between free wills.
      *   *The Bridge:* Love/Friendship. Even individualists choose to limit their freedom for someone they love. Even Confucians recognize that roles aren't just burdens; they are how we become human.
      *   *The "Rosemont/Ames" Angle:* Henry Rosemont Jr. and Roger Ames argue against the "abstract individual." They say we are *narratives* of our relationships.
      *   *The Toast Strategy:* Acknowledge the tension humorously. Don't solve the metaphysical debate, but frame the marriage as the *creation* of a new narrative that honors both views. The groom isn't losing freedom; he's gaining a story. The family isn't imposing duty; they're offering a context.

