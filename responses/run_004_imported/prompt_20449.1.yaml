      *   **Occasion:** Younger sister's wedding (6 weeks away).
      *   **Audience:** Mixed. Sister (knows the speaker's tendency to overthink), Parents (traditional, value family obligation), Fiancé (secular, individualist), Fiancé's friends/family (likely similar to fiancé), Sister's friends.
