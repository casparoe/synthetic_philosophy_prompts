          *   *Verdict:* It's a category error to equate them directly, but a fruitful analogy for *descriptive* vs. *normative* accounts. The paradox is about *epistemic permission* (what you *may* do); belief perseverance is about *causal mechanism* (what you *do* do).
          *   *Nuance:* If the paradox holds, belief perseverance might be rational in cases of knowledge. If the paradox is solved, belief perseverance remains irrational.

