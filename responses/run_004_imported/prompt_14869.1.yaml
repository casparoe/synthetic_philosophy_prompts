prompt: |-
  Got nerd-sniped in my reading group this week by the 'dogmatism paradox' -- the one that traces back to Kripke, though most people cite Harman's write-up (not to be confused with Pryor's unrelated 'dogmatism' about perceptual justification, which took me embarrassingly long to realize is a different thing). I can follow the individual steps fine: if I know p, then p is true, so any future 'evidence' against p has to be misleading evidence, so it seems like I'm already licensed to know, right now, that I can discount whatever counterevidence shows up later. What I dont have a gut-level grip on is why this counts as a genuine paradox needing a fix rather than just a valid-if-unpalatable argument. Where do epistemologists usually say it actually breaks -- is it the defeasibility conditions on knowledge, something about not being able to know in advance that unseen evidence is misleading, or does someone just bite the bullet? I study belief revision (the psych side, not the AGM logic side) for my diss and keep wanting to map this onto belief perseverance/confirmation bias -- can you walk through the strongest response(s) with a concrete case instead of symbols, and tell me whether that mapping is apt or a category error?
