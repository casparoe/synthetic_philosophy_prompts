      *(Self-Correction during drafting)*: I need to be careful not to conflate Harman's original presentation with the solutions. Harman presents the paradox to motivate his theory of knowledge (which involves defeasibility). The *solution* usually involves denying that you can *use* the knowledge to screen off evidence because the evidence defeats the knowledge.
