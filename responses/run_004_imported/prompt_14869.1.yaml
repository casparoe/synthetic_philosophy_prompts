      *   *Concrete Case:* Use the "Napoleon" or "Spouse Cheating" example. Let's use "Spouse Cheating" or "Location of Keys"? No, let's stick to something slightly more academic but concrete. "The Meeting Time." I know the meeting is at 2 PM. Someone says it's at 3 PM.
