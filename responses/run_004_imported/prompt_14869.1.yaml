      *   *The Solutions:*
          1.  *Defeasibility (The Harman way):* You don't *really* know if there's undefeated misleading evidence out there. (Wait, Harman uses this to generate the paradox). The solution is often that knowledge is *defeasible*. If you encounter the evidence, your justification is defeated, so you lose knowledge, so you can't use the knowledge to discount the evidence.
          2.  *Closure Denial:* You know $p$, but you don't know "evidence against $p$ is misleading."
          3.  *Contextualism:* "Know" means different things in different contexts.
      *   *The Psychology Mapping:* This is crucial for the user.
          *   Normative (Epistemology) vs. Descriptive (Psych).
