answer: |-
  First, take a breath. What you are experiencing has a name: **moral vertigo**. It is the dizzying sensation of realizing the floor you thought was concrete (divine command) is actually suspended over a void (metaphysical uncertainty). Eight months is very fresh in the timeline of deconstruction. The fact that you are obsessed with this question shows you aren't just rejecting the faith; you are trying to build something honest in its place.

  Your friend is right about George Eliot (Mary Ann Evans). She is perhaps the patron saint of the Victorian crisis of faith. But your intuition is also sharp: **Feuerbach does not logically guarantee "absolute duty" just by dismantling God.** In fact, many philosophers (most notably Nietzsche) argued exactly what you suspect: that people like Eliot were trying to keep Christian morality while pulling out the Christian foundation.

  However, there *was* an argument for why morality survives, and it's more interesting than just "leftover feelings." Here is the breakdown of what Feuerbach and Eliot thought was holding "duty" up, and why it might (or might not) satisfy you.

  ### 1. Feuerbach's Move: From Obedience to Reclamation
  Ludwig Feuerbach's *The Essence of Christianity* (1841) argues that theology is actually **anthropology**. When humans worship God, we are unconsciously worshipping the idealized essence of our own species (*Gattungswesen*). We project our best qualities—love, wisdom, justice, mercy—onto a fictional sky-being, magnify them to infinity, and then bow down to them.

  **The Problem:** By projecting these qualities outward, we impoverish ourselves. We think *God* is good, and *we* are sinners.
  **The Solution:** Reclaim the projection. Realize that *humanity* is the bearer of these divine qualities.

  **So, where does Duty come in?**
  For Feuerbach, duty is no longer obedience to a higher power. It becomes **responsibility to the human species.**
  *   If God is just idealized Humanity, then hurting a human being is an offense against the "divine."
  *   Morality becomes the recognition that the "other" is sacred, not because God says so, but because the "other" possesses the very qualities we once attributed to God.
  *   **The Bindingness:** It binds you because you *are* what you once worshipped. To act immorally is to deny your own essence as a human being.

  ### 2. George Eliot's Twist: Sympathy and Consequences
  Eliot translated Feuerbach, but she was British, empiricist, and a novelist. She found Feuerbach a bit too abstract. She grounded his "duty" in **human sympathy** and **tangible consequences.**

  Eliot famously wrote: *"I have no conception of a God... but I have a profound belief in the binding force of duty."*

  For Eliot, duty wasn't a cosmic law; it was a **social fact.** She argued that:
  1.  **We are inextricably linked:** Your actions ripple out and affect the well-being of others. You cannot actually live in a vacuum.
  2.  **Sympathy is real:** We are biologically and psychologically wired to feel the pain of others. To ignore that is to violate our own nature.
  3.  **Heaven and Hell are here:** In her novel *Middlemarch*, she writes about how the "growing good of the world is partly dependent on unhistoric acts." Conversely, suffering is real and present.

  **Her Argument for Bindingness:**
  Duty is binding because **other people are real.** In evangelicalism, you might avoid sin because you don't want to burn in hell (self-preservation). For Eliot, you avoid harm because *someone else will burn.* The "absolute" nature of duty comes from the absolute reality of another person's suffering. It shifts the locus from **Vertical** (Man-to-God) to **Horizontal** (Man-to-Man).

  ### 3. The "Leftover Feeling" Critique
  You asked: *Is she just running on leftover Christian feeling with new vocabulary stapled onto it?*

  This is the most serious critique of 19th-century humanism, and it was best articulated by **Friedrich Nietzsche**. Nietzsche respected Feuerbach but thought he was naive. Nietzsche argued that Christian morality (humility, self-sacrifice, duty to the weak) was specifically designed to fit a Christian metaphysics. If you kill God, Nietzsche said, you eventually have to let go of that specific morality too.

  He accused people like Eliot of wanting the **comfort** of moral absolutes without the **cost** of belief. He called this "shadow of God"—the idea that God is dead, but his shadow lingers in our caves for centuries, making us think "duty" is still objective.

  **Is the critique fair?**
  *   **Yes:** If you define "duty" as a cosmic command that exists independently of human minds, then yes, Eliot is smuggling in Christian metaphysics. There is no "absolute" duty in a godless universe in the same way there is no "absolute" temperature without a scale.
  *   **No:** If you define "duty" as a **necessary condition for human flourishing**, then it's not leftover feeling; it's practical reality. If we all stop caring about duty, society collapses, and we suffer. The "bindingness" isn't magical; it's causal.

  ### 4. How Secular Morality Actually "Works" Today
  If Feuerbach and Eliot feel like they are leaning on Christian crutches, what are the other options for holding up morality? Modern secular ethics usually rests on one of three pillars:

  **A. Evolutionary Ethics (The "Is" implies "Ought" of Survival)**
  We are social primates. We evolved to cooperate. Morality is a set of heuristics that allowed our ancestors to survive in groups.
  *   *Bindingness:* It binds you because you are a social animal. Violating it creates cognitive dissonance and social ostracization.
  *   *Weakness:* It explains why we *feel* moral, but not necessarily why we *should* be moral if we can get away with it.

  **B. The Social Contract (Rational Self-Interest)**
  I agree not to kill you, so you agree not to kill me. We create systems of justice to maximize well-being.
  *   *Bindingness:* It binds you because you want to live in a safe society.
  *   *Weakness:* It struggles with duties to those who can't repay us (the severely disabled, future generations, animals).

  **C. Compassionate Humanism (The Eliot/Feuerbach Route)**
  This is likely where you will land if you resonate with Eliot. It argues that **suffering matters.**
  *   *Bindingness:* Pain is intrinsically bad. If I can prevent pain without sacrificing something of moral significance, I ought to do it. This doesn't require God; it requires the capacity to recognize that *I am not the center of the universe.*
  *   *The Shift:* In evangelicalism, morality is often about **purity** (following rules to stay clean). In humanism, morality is about **harm reduction** (acting to reduce suffering).

  ### 5. Summary: What is holding "Duty" up?
  To answer your specific question: **Nothing metaphysical is holding it up.** And that is the point.

  For Feuerbach and Eliot, the realization that God is a projection is supposed to be *liberating*, not terrifying.
  *   **Old View:** I must be good because a Cosmic Judge is watching, and the penalty for failure is eternal torture. (Morality based on Fear/Transaction).
  *   **Feuerbach/Eliot View:** I must be good because my fellow humans are real, their suffering is real, and I have the power to affect it. (Morality based on Empathy/Responsibility).

  Is it "absolute"? In a cosmic sense, no. The universe doesn't care. But in a **human** sense, it feels absolute because human connection is the only thing that gives life meaning once the supernatural is removed.

  **The Verdict:**
  You are right to be skeptical of the word "absolute." That is a theological term. Secular morality is rarely "absolute"; it is **imperative.**
  *   It is imperative because we are interdependent.
  *   It is imperative because we have the capacity for reason and empathy.
  *   It is imperative because the alternative is a world no one wants to live in.

  Eliot wasn't necessarily running on leftover feelings; she was trying to translate the *intensity* of religious commitment into a humanist key. She believed that doing good for the sake of other humans was *harder* and *nobler* than doing good for the sake of reward in heaven. As she wrote in a letter: *"The idea of God... is the ideal of a goodness entirely human... the recognition of that ideal is the source of all moral energy."*

  **Advice for where you are:**
  Don't rush to find a new "scaffolding" that is as rigid as the old one. Evangelical morality is like a cast on a broken leg: rigid, external, and absolute. Secular morality is more like muscle: it has to be built, it can fatigue, and it requires balance. It feels less secure at first, but it allows you to actually walk.

  It is okay if "duty" feels different now. It shouldn't feel like obedience; it should feel like **responsiveness.** You aren't following a rule; you are responding to the reality of other people. That shift takes years to settle. Give yourself time.
