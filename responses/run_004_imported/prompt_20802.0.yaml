prompt: |-
  So I deconverted from evangelical Christianity about 8 months ago and I've been kind of obsessed with figuring out how morality is even supposed to work now that the whole god/heaven/hell scaffolding is gone for me. A friend told me George Eliot went through basically the same thing back in the 1840s -- she clashed with her dad over refusing to go to church, and years later translated Feuerbach's "Essence of Christianity" into English. Apparently she once told someone that God was inconceivable and immortality unbelievable, but duty was still absolute, no wiggle room at all. That's the part I can't wrap my head around: Feuerbach's whole argument is that God is just humanity's own best qualities projected outward and mistaken for something separate from us, so once you see through that move, why would duty keep any of its bindingness? Was there an actual argument in there for why morality survives loosing its metaphysical backup, or is she just running on leftover Christian feeling with new vocabulary stapled onto it? Could you walk me through what's really supposed to be holding "duty" up once God's been demoted to a projection of our own psychology?
