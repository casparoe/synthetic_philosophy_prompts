answer: |-
  This is an exceptionally sharp reading of the text. You have identified the precise tension that makes Sidgwick's position philosophically interesting, and which is often glossed over in the "patron saint of rationality" hagiography.

  To answer your core question: Sidgwick is not equivocating, but he is navigating a difficult boundary between **logical possibility** and **rational credibility**. The argument is a precursor to what we might now call a **Bayesian cumulative case** or an **Inference to the Best Explanation (IBE)**, but it is tempered by a fallibilist acknowledgment of the limits of empirical proof.

  Here is a reconstruction of the argument, the resolution of the tension you spotted, and an assessment of what Sidgwick is actually entitled to conclude.

  ### 1. The Structure of the Argument: The "Heap" as Convergence
  Your first reading (the statistical point) is the engine of Sidgwick's methodology. He is arguing against the idea that psychical phenomena require a "smoking gun"—a single observation that is logically incompatible with fraud or error.

  Sidgwick recognizes that for any *single* event $E$, the probability of Fraud/Error ($F$) is high relative to the Probability of Phenomena ($P$), because $P$ violates established laws of nature (high prior improbability).
  $$P(P|E) < P(F|E)$$

  However, Sidgwick's "heap of facts" strategy relies on **conditional independence**. If you have $n$ independent investigators, in different locations, under different conditions, reporting similar phenomena, the probability that *all* are engaged in fraud or error is the product of their individual probabilities of error.
  $$P(F_{total}) = P(f_1) \times P(f_2) \times \dots \times P(f_n)$$

  As $n$ increases, $P(F_{total})$ shrinks rapidly. Sidgwick is arguing that while no single fact kills skepticism, the **joint probability** of a global conspiracy or universal hallucination eventually becomes lower than the prior improbability of the phenomena themselves. This is a standard scientific move (used in geology, evolutionary biology, etc.): you bury the null hypothesis under a weight of convergent lines of evidence.

  ### 2. The "Unfalsifiability" Worry: Possibility vs. Plausibility
  Your second reading identifies the snag in the last two sentences: *"When he has nothing else left to allege he will allege that."*

  This looks like an admission that the fraud hypothesis is unfalsifiable. If a skeptic can always say "It's a trick" regardless of the data, doesn't that render the data inert?

  Sidgwick is making a sociological and psychological point here, not a logical one. He is distinguishing between:
  1.  **The Logical Space of Doubt:** It is *logically possible* that any investigator is lying. This can never be reduced to zero.
  2.  **The Rational Burden of Doubt:** It becomes *rationally untenable* to maintain that everyone is lying once the "heap" is sufficiently large.

  Sidgwick is admitting that he cannot force the skeptic to concede via **logical coercion**. He can only force them to concede via **epistemic pressure**. He is saying: "I cannot prove to you that I am not a liar. But if I bring 500 other people who say they saw the same thing, and you still insist we are all liars, you are no longer being scientific; you are being dogmatic."

  He is not equivocating; he is defining the limit of his project. He is not promising **Cartesian Certainty** (which is impossible in empirical science); he is promising **Moral Certainty** (sufficient for a rational agent to update their beliefs).

  ### 3. Reconciling the Two Halves
  The two halves of the passage are consistent if you view them as addressing different audiences or different stages of inquiry.

  *   **The "Heap" (First half):** Addresses the **evidence**. It argues that the *weight* of the evidence shifts the probability ratio.
  *   **The "Trick" (Second half):** Addresses the **critic**. It acknowledges that the *rhetoric* of skepticism is immune to evidence.

  Sidgwick is effectively saying: *We can make the fraud hypothesis so complex and ad hoc (requiring a conspiracy of hundreds) that it is worse than the hypothesis of genuine phenomena, even though we cannot logically disprove it.*

  This is a rigorous position. It aligns with modern understandings of **underdetermination of theory by data**. Data never strictly *forces* a conclusion; one can always save a favored hypothesis (like "materialism is true") by adding auxiliary assumptions (like "all these witnesses are mistaken"). Sidgwick's point is that at a certain point, the auxiliary assumptions become more costly than accepting the phenomenon.

  ### 4. What is Sidgwick Entitled to Conclude?
  Based on this text, Sidgwick is **not** entitled to conclude:
  *   That psychical phenomena are definitely real.
  *   That skeptics are logically refuted.
  *   That any single case is proven.

  He **is** entitled to conclude:
  *   That the "scientific incredulity" (the prior assumption that these things are impossible) is an empirical claim that can be tested.
  *   That if the "heap" grows large enough, the rational position shifts from "This is impossible" to "This is improbable, but the evidence is strong enough to warrant investigation/belief."
  *   That the skeptic's refusal to accept the "heap" is a psychological defense mechanism ("roots... so strong"), not a logical necessity.

  ### 5. Verdict on the "Intellectual Honesty" Reputation
  Does this passage support the reputation of Sidgwick as a model of epistemic conscientiousness? **Yes, arguably more than the summaries suggest.**

  The "mythology" version of Sidgwick often implies he investigated psychical research and *found it true*, thus proving his open-mindedness. The reality, which this passage supports, is more nuanced:
  1.  **He admits the limits of proof.** He knows he can't corner the skeptic logically.
  2.  **He shifts the burden of proof.** He argues that "incredulity" is a hypothesis that needs to be killed by facts, not a default state of wisdom.
  3.  **He remained agnostic.** Historically, Sidgwick never became a fervent spiritualist. He remained a "critical inquirer" until his death. He applied this rigorous standard to the evidence and found it *suggestive* but rarely *conclusive* enough for his own personal belief in many cases.

  The intellectual honesty lies in the last sentence. A charlatan or a true believer would say, "Our evidence is so good that fraud is impossible." Sidgwick says, "Our evidence is good enough that alleging fraud is becoming unreasonable, but we know they will do it anyway."

  He is acknowledging that **science cannot compel belief, only invite it.** That is a sophisticated epistemic stance, especially for 1882. He isn't equivocating; he is mapping the boundary where empirical evidence meets human psychology.

  ### Summary
  Sidgwick is making a **cumulative probabilistic argument** while explicitly acknowledging the **problem of underdetermination**.

  *   **The Tension:** You see a conflict between "evidence accumulates to prove" and "critics can always deny."
  *   **The Resolution:** Sidgwick distinguishes between *logical refutation* (impossible) and *rational persuasion* (possible via cumulative weight).
  *   **The Conclusion:** He is entitled to claim that skepticism becomes **irrational** (not logically false) after a certain threshold of evidence.

  Your friend's worry that this is "mythology" might stem from expecting Sidgwick to have proven spiritualism. Your worry about equivocation stems from expecting him to claim logical closure. Sidgwick claims neither. He claims that a "scrupulous mind" must follow the weight of evidence even when it leads to embarrassing places, while admitting that the weight of evidence can never fully silence a determined skeptic. That is a defensible, rigorous, and notably honest position.
