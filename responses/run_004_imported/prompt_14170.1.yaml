prompt: |-
  This term I am taking a graduate seminar devoted entirely to Hume's Treatise of Human Nature, and for my final paper I would like to bring Hume into contact with a puzzle from contemporary decision theory that a friend of mine keeps raising in his rational choice reading group: Parfit's hitchhiker, and the associated idea of "rational irrationality." The setup, as I understand it, is this: a motorist stranded and dying of thirst in the desert is offered a ride into town by a driver who will only take him if the driver can be confident that the motorist will hand over an agreed sum of money once they arrive safely, at which point paying no longer serves any further purpose for the motorist, since he has already been rescued. An agent who simply reapplies ordinary means-end reasoning at the moment of truth, weighing only his remaining passions and interests, has every reason to refuse to pay; and a sufficiently perceptive driver, anticipating this in advance, would never have offered the ride at all. Parfit takes this case, and others like it, to show that it can be rational, relative to an agent's own aims, to become disposed to act at some future moment in a way that will not itself be the rational thing to do once that moment actually arrives.

  What I would like your help thinking through is what Hume, using only the resources of his own philosophy, would say about this case, and I would rather you work through the reasoning than just assert a conclusion. On one hand, Hume's account of the will seems to commit him to denying that reason can ever criticize a passion or an action except for resting on a false belief about matters of fact or about the suitability of some means to an end; since paying up, once safe, serves none of the motorist's remaining passions, it is hard to see how Hume's official theory could brand the refusal to pay irrational at all. On the other hand, his treatment of promise-keeping as an artificial virtue, upheld through strict and general rules rather than through case-by-case recalculation of particular advantage, sounds a great deal like the disposition-based solutions that some decision theorists now favor over moment-by-moment reconsideration. Are these two strands of Hume's thought actually in tension when applied to a case like this one, or can the discussion of general rules in Book III be read as already implicit in, rather than in conflict with, the instrumentalism about reason defended in Book II? I would be grateful for a sense of how far Hume can consistently be pushed here, and where, in the end, you think he would have to come down.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on Hume's *Treatise of Human Nature*. Final paper.
      *   **Topic:** Connecting Hume to Parfit's Hitchhiker (and the concept of "rational irrationality" or disposition-based rationality in decision theory).
      *   **The Puzzle:** A motorist needs a ride. Driver requires assurance of payment *after* arrival. Once arrived, paying is costly and serves no further instrumental end for the motorist. A purely instrumental agent won't pay. A perceptive driver won't offer the ride. Solution: Be disposed to pay even when it's not instrumentally optimal *at that moment*.
      *   **The Tension in Hume:**
          *   *Book II (Passions/Reason):* Reason is the slave of the passions. Irrationality = false belief or bad means-end reasoning. Paying upon arrival seems irrational by this light (no passion served).
          *   *Book III (Morals/Justice):* Promise-keeping is an artificial virtue. We follow general rules because case-by-case calculation fails. This looks like disposition-based rationality.
      *   **The Task:** Work through the reasoning (don't just assert). Analyze the tension. Determine if Book III's rules are implicit in Book II's instrumentalism or in conflict. Push Hume's consistency. Conclude where Hume would come down.

  2.  **Deconstruct the Philosophical Components:**

      *   **Parfit's Hitchhiker:** This is a Newcomb-like problem / Prisoner's Dilemma variant. It challenges *Causal Decision Theory* (CDT) which says choose the act with the best causal consequences *at the time of choice*. It supports *Evidential Decision Theory* (EDT) or *Dispositional/Rule-based* approaches (be the *kind* of person who pays).
      *   **Hume's Instrumentalism (Book II):** "Reason is, and ought only to be the slave of the passions." Rationality is about truth (ideas) or causation (matters of fact). If I want $X$, and paying $Y$ doesn't get me $X$ (because I'm already safe), reason says don't pay.
      *   **Hume's Artificial Virtues (Book III):** Justice and promise-keeping aren't natural. They arise from convention. We follow the *rule* because the *system* is useful, even if individual violations might seem useful. "Shou'd I alone observe the laws of justice... I shou'd only expose myself to injury."
      *   **The Core Conflict:** Can a Humean agent *commit* to a rule in Book II terms? Or does the Book III explanation rely on social sanctions (shame, reputation) that might not apply in the one-off Hitchhiker case?

  3.  **Step-by-Step Reasoning Plan:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: Hume can accommodate the Hitchhiker intuition, but not by abandoning instrumentalism. Instead, he redefines the "passions" and the "self" over time, and relies heavily on the *artificial* nature of the commitment (promises).
      *   **Phase 1: The Book II Obstacle (The Moment of Truth):** Analyze the motorist *in the town*. According to strict instrumentalism, if the only passion is self-preservation/wealth, and safety is secured, paying is irrational. Hume agrees reason cannot oppose a passion. So, if the passion is "keep money," reason serves it.
      *   **Phase 2: The Book III Solution (General Rules & Conventions):** How does Hume handle promises? It's not about the specific act's utility but the *scheme*. The "general inflexible rule." This looks like the disposition solution.
      *   **Phase 3: Bridging the Gap (Self & Time):** How does Book II allow for Book III?
          *   *Calm Passions:* The preference for being a promise-keeper can be a "calm passion" that overrides the "violent passion" of greed in the moment.
          *   *The Extended Self:* Hume's bundle theory. We cultivate a character. The passion is not just "money now" but "my reputation/character as a trustworthy person."
          *   *Sympathy:* Even in a one-off case, the agent feels the pain of the driver's potential distrust or the social disapproval (via sympathy) of breaking a convention.
      *   **Phase 4: The "Rational Irrationality" Critique:** Does Hume accept "rational irrationality"? No. He would reject the framing. For Hume, if it's rational to have the disposition, then acting on that disposition *is* rational because it serves a deeper/longer-term passion (tranquility, social standing, self-conception). He wouldn't call it "irrationality"; he'd call it "enlightened self-interest mediated by convention."
      *   **Phase 5: The Limit (The Secret Violation):** What if the driver can't see inside the mind? What if it's a true one-off with no reputation stakes? Hume admits that without the *convention* (social pressure), the obligation vanishes. This is the hard limit. Hume needs the *social* context to make the rule binding.
      *   **Conclusion:** Hume resolves the tension by expanding the scope of "passions" to include the love of moral character and the force of convention. Book III doesn't contradict Book II; it complicates the input (passions) that Book II processes.

  4.  **Drafting the Content - Key Humean Texts/Concepts to Integrate:**
      *   *Treatise* 2.3.3 (Reason is slave of passions).
      *   *Treatise* 3.2.2 (Origin of justice and property).
      *   *Treatise* 3.2.5 (The obligation of promises).
      *   Concept of "Calm vs. Violent Passions."
      *   Concept of "General Rules" (both cognitive and moral).
      *   Concept of "Convention" (not promise, but mutual agreement).
      *   Concept of "Sympathy."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to make Hume a Rule Utilitarian. He isn't maximizing utility consciously. He's driven by sentiments. The *system* produces utility, which generates approval, which generates a sentiment of obligation.
      *   *Nuance:* In the Hitchhiker case, is there a *promise*? The prompt says "agreed sum." That implies a promise/contract. Hume treats promises as artificial. The obligation to keep a promise *is* the disposition to follow the rule.
      *   *Crucial Point:* Parfit's point is that it is rational to be disposed to pay, even if paying is irrational. Hume would say: If you have the disposition, paying is *not* irrational, because the disposition *is* a passion (a calm one, or a sense of duty derived from sympathy). Hume collapses the distinction between "rational to be disposed" and "rational to act" by making the disposition itself a motivating sentiment.
      *   *Wait, one more check:* In the *moment*, if the sentiment of duty is weaker than the sentiment of greed, Hume says the agent follows the stronger passion. So, can Hume *normatively* say they *ought* to pay? Yes, via the "General Point of View." The moral sentiment approves of the payer. But can he say it's *prudentially* rational? That's trickier. It depends on whether the agent values their own character.
      *   *Decision:* I will argue that Hume transforms the problem. He doesn't accept "rational irrationality." He argues that a well-socialized agent *has* a passion for keeping promises (via education/habit) that outweighs the immediate gain. If they don't have that passion, they aren't "irrational" in the Book II sense, just knavish. But the *system* relies on most people having that passion.

  6.  **Final Polish:** Ensure the tone is appropriate for a graduate student (rigorous, textual, nuanced). Avoid anachronisms (don't call Hume a decision theorist), but draw structural parallels.

      *(Self-Correction on "Rational Irrationality"):* Be precise. Parfit/decision theorists use "rational" in a specific normative sense. Hume uses "reason" narrowly. I need to highlight this terminological clash. Hume would say the decision theorists are misusing the word "reason."

  7.  **Structure of the Response:**
      1.  **Introduction:** Validate the project. State the central tension (Instrumentalism vs. Conventionalism).
      2.  **The Book II Constraint:** Why the Hitchhiker looks like a counter-example to Humean instrumentalism.
      3.  **The Book III Mechanism:** How artificial virtues and general rules work.
      4.  **Synthesizing the Two:** Calm passions, the role of habit/education, and the "General Point of View."
      5.  **The Limit of Hume's Solution:** The "Sensible Knave" problem.
      6.  **Conclusion:** Hume rejects "rational irrationality" but accepts "dispositional rationality" via sentiment modification.

  8.  *(Final Review against Prompt)*: Did I work through the reasoning? Yes. Did I address the tension between Book II and III? Yes. Did I say where Hume comes down? Yes.

      *Let's write.*
answer: |-
  This is an exceptionally sharp project. You have identified precisely the fault line that runs through the *Treatise*: the relationship between the psychological mechanics of motivation in Book II and the normative structure of morality and justice in Book III. The Parfitian Hitchhiker case is a perfect stress test for this relationship because it isolates the problem of *dynamic inconsistency*—the conflict between what is rational to plan and what is rational to execute.

  To work this through, we need to avoid the temptation to simply label Hume a "rule-utilitarian" or a "dispositionalist" by modern standards. Instead, we must trace how his specific account of the passions, habit, and convention allows him to navigate the Hitchhiker puzzle without abandoning his core thesis that reason is the slave of the passions.

  Here is a step-by-step reconstruction of how Hume would likely analyze the case, where the tensions lie, and how he attempts to resolve them.

  ### 1. The Book II Obstacle: The Moment of Truth
  Let us begin with your first worry. In Book II, Hume defines the province of reason narrowly. Reason deals with relations of ideas (logic/math) and matters of fact (causation/empirical truth). It cannot originate action; only a passion (a desire, aversion, hope, fear) can do that. Consequently, an action is only "unreasonable" if it is based on a false belief about existence or a mistaken calculation of causal efficacy.

  In the Hitchhiker scenario, once the motorist is safely in town, the causal link between "paying" and "being rescued" is severed. The rescue has already occurred. If the motorist's dominant passion at that moment is "retain my money," and paying does not serve that passion (nor any other immediate passion like avoiding immediate physical punishment), then Book II instrumentalism suggests that refusing to pay is the rational action. To pay would be to act against the prevailing desire without a new end in view.

  If Hume stopped at Book II, he would have to agree with the "naive" decision theorist: the motorist should not pay. But this leads to the paradox you noted: the driver, knowing human nature, wouldn't offer the ride. Hume is acutely aware of this problem; it is essentially the Hobbesian State of Nature problem applied to a dyadic interaction.

  ### 2. The Book III Mechanism: Artificial Virtue and General Rules
  This is where your second strand comes in. In Book III, regarding the "artificial virtues" (justice, promise-keeping, allegiance), Hume argues that we do not (and should not) evaluate every individual act by its specific utility.

  Hume explicitly discusses cases where following the rule of justice seems to produce no immediate good, or even harm (e.g., returning a fortune to a miser or a seditious bigot). Yet, we feel obliged to do it. Why? Because the *system* of rules is indispensable to social survival. We cultivate a "sentiment of approbation" toward rule-following itself.

  In the Hitchhiker case, the agreement to pay constitutes a **promise**. For Hume, a promise is not a natural act; it is a linguistic device created to bind the future self. In *Treatise* 3.2.5, Hume explains that the obligation to keep a promise arises from human conventions. We know that if we violate the convention, the entire system of trust collapses. Therefore, society inculcates in us a specific passion: a sense of duty (or "regard to the virtue") attached to the act of promise-keeping.

  So, when the motorist arrives in town, he is not merely weighing "money vs. nothing." He is weighing "money vs. the pain of violating a deeply ingrained moral sentiment." If the sentiment of duty is strong enough, it becomes the dominant passion. In this light, paying *is* instrumentally rational: it satisfies the passion for self-integrity and avoids the uneasiness of guilt.

  ### 3. Bridging the Gap: Calm Passions and the Extended Self
  The crucial question is whether this Book III solution is consistent with Book II. Does positing a "sense of duty" violate the claim that reason is the slave of the passions?

  Hume's answer relies on his distinction between **violent** and **calm** passions.
  *   **Violent Passion:** The immediate desire to keep the cash (greed/relief).
  *   **Calm Passion:** The settled preference for being a person of honor, or the general appetite for social order.

  Hume argues that we often mistake calm passions for reason because they do not agitate the soul. However, they are still passions. A Humean agent who pays the driver is not acting against passion; they are allowing a calm, long-term passion (the desire to maintain their character as a promise-keeper) to override a violent, short-term passion (greed).

  This addresses the "dispositional" aspect of Parfit's puzzle. Parfit says it is rational to *be disposed* to pay. Hume says it is useful to *be educated* to feel a specific sentiment when making a promise.
  *   **The Training:** Through education and habit (which Hume treats as a fundamental principle of human nature), the agent associates the idea of "breaking a promise" with pain (shame, social disapproval, internal uneasiness).
  *   **The Execution:** When the moment of truth arrives, the agent feels that pain. Reason then calculates: "If I don't pay, I feel the pain of guilt/shame. If I do pay, I lose money but keep my tranquility." If the agent is well-socialized, the pain of guilt outweighs the loss of money.

  Thus, Hume can accommodate the disposition-based solution without admitting that "irrationality is rational." He simply expands the input data of the passion calculus to include the psychological costs of violating a general rule.

  ### 4. The Tension: The "Sensible Knave" and the One-Off Case
  However, your intuition that there is a tension is correct. It resurfaces in what Hume calls the "Sensible Knave" problem (discussed in the *Enquiry*, but rooted in the *Treatise*).

  What if the motorist is a psychopath, or simply a very shrewd philosopher, who feels no guilt? What if the Hitchhiker case is truly anonymous, such that reputation is not at stake, and the driver cannot punish him? In this specific instance, the "system" of justice does not collapse because of one violation. The immediate utility of keeping the money is high; the immediate social cost is zero.

  Here, Hume's Book II and Book III strains against each other:
  1.  **Book II (Psychological Egoism/Instrumentalism):** If the agent feels no guilt and has no fear of sanction, there is *no passion* served by paying. Reason cannot generate a motive to pay. The agent *will not* pay.
  2.  **Book III (Moral Obligation):** Hume wants to say the agent *ought* to pay because the general rule must be upheld. He appeals to the "General Point of View." We approve of the payer from a general perspective, even if the specific act yields no utility.

  **Where Hume Comes Down:**
  Hume is honest enough to admit that in such cases, the *moral* obligation remains (we still blame the knave), but the *motivational* grip may fail. In the *Treatise*, he suggests that even in secret violations, the agent suffers from a loss of "peace of mind" and the erosion of their own character. He argues that it is nearly impossible to violate the rules of justice habitually without damaging one's own psychological constitution.

  However, regarding the specific Hitchhiker puzzle, Hume would likely argue that the setup assumes a separation between "prudence" and "morality" that his system dissolves.
  *   For Hume, **Prudence** is the management of passions over time.
  *   **Morality** is the management of passions via sympathy and convention.

  If the motorist fails to pay, Hume would not say, "He acted irrationally in the decision-theoretic sense." He would say, "He lacked the necessary social sentiments that make human cooperation possible." The "rationality" of the disposition is not a logical necessity; it is a sociological one. The disposition is "rational" only insofar as humans are social animals who require the tranquility that comes from being part of a cooperative scheme.

  ### 5. Resolution: General Rules as Cognitive Heuristics
  There is one more resource in the *Treatise* that helps bridge Book II and III: Hume's account of **General Rules** in the understanding (Book I and II).

  Hume notes that humans naturally form general rules to guide judgment because we are bad at case-by-case analysis. We fear fire not just because of the current flame, but because of the general rule "fire burns."
  In Book III, this cognitive habit becomes a moral habit. We follow the rule "keep promises" not because we calculate the utility of *this* promise, but because our cognitive machinery is built to follow general causal rules.

  Applied to the Hitchhiker:
  The motorist does not (and should not) engage in fresh deliberation in the town. To do so is to admit one is not a trustworthy agent. The "rational" move, in a Humean sense, is to have cultivated a character such that the deliberation *does not happen*. The passion to pay is triggered automatically by the arrival in town, just as the fear of fire is triggered by the sight of flame.

  If the motorist *does* deliberate and decides not to pay, he has failed in **prudential reasoning** (Book II) because he failed to anticipate that his future self would be governed by short-term passions. He failed to bind his future self via the convention of promising.

  ### Conclusion: How to Frame Your Paper
  You can push Hume quite far, but you must be careful not to make him a modern rational choice theorist.

  1.  **Reject "Rational Irrationality":** Hume would reject Parfit's phrasing. For Hume, if it is rational to have the disposition, then acting on that disposition is *always* rational because the disposition *is* a passion (a calm one, or a moral sentiment). There is no gap between "rational to be disposed" and "rational to act." The gap only exists if you define reason as purely instrumental regarding *immediate* desires, which Hume explicitly rejects in favor of long-term self-interest mediated by habit.
  2.  **The Role of Convention:** Hume's solution relies on the *artificial* nature of the promise. The obligation is not intrinsic to the act of paying but to the *convention* of promising. The motorist is not paying for the ride (which is past); he is paying to uphold the convention of promising (which is present and future).
  3.  **The Limit:** The tension remains if the agent is truly asocial. If the agent feels no sympathy and fears no reputation loss, Hume admits the "chains of justice" fall off. Hume cannot prove that a purely self-interested agent *must* pay in a one-off case without social sanctions. He can only show that such an agent is miserable and that society is right to condemn him.

  **Your Thesis:** You can argue that Hume anticipates the "dispositional" solution to the Hitchhiker puzzle, but he grounds it not in a new logic of rationality, but in a **psychology of habit and sentiment**. Book III does not contradict Book II; rather, Book III describes the *social technology* (promises, conventions, moral education) that modifies the passions described in Book II so that the "moment of truth" problem never arises for a well-functioning moral agent. The "irrationality" Parfit identifies is, for Hume, a failure of moral education and a lack of "calm passions," not a failure of instrumental reason.

  This allows you to show that Hume's system is more robust than it appears: it doesn't solve the puzzle by changing the definition of reason, but by changing the constitution of the agent.
