answer: |-
  This is a fantastic question because it disguises a deep philosophical problem as a mundane administrative headache. You have stumbled directly into one of the most famous puzzles in the philosophy of language and law.

  To answer your specific question: **There is likely no pre-existing "fact of the matter" about who was right all along.** The meaning of the rule was under-determined until this specific case forced you to specify it.

  Here is the breakdown of why this is happening, drawing from philosophy, legal theory, and practical pedagogy.

  ### 1. The Philosophical Angle: Wittgenstein and Kripke
  You are experiencing what Ludwig Wittgenstein (and later Saul Kripke) called the **rule-following paradox**.

  The paradox goes like this: No matter how many times you have applied a rule in the past, those past actions cannot logically dictate how you must apply the rule in a *new* situation. You and your TA have agreed on 100% of past cases. But as Kripke pointed out, past agreement is compatible with infinitely different interpretations of the rule.

  *   **You** interpreted "day" as "business/academic day."
  *   **Your TA** interpreted "day" as "calendar day (24 hours)."

  For three years, every single late submission happened on a non-holiday weekday. Therefore, "business day" and "calendar day" yielded the exact same result (extensional equivalence). You both thought you meant the same thing (intensional agreement), but you were actually running different algorithms that just happened to output the same numbers until now.

  So, is there a fact about what you *really* meant? Kripke would say **no**. There is no mental state or historical fact that locks in the meaning of "day" for a scenario you never encountered. The meaning is not discovered; it is **created** in the moment of decision.

  ### 2. The Legal Angle: Textualism vs. Intentionalism
  This is also a classic debate in jurisprudence (legal theory).

  *   **Your TA is a Textualist:** They are arguing that the text ("per day") is the law. If the drafters (you and the TA) wanted "business days," they should have written "business days." The fact that they didn't means the plain meaning controls. This promotes predictability and limits administrative discretion.
  *   **You are an Intentionalist/Purposivist:** You are arguing that the *purpose* of the penalty is to encourage timely work during periods when work is possible. A holiday is not a day where work is "due" in a meaningful sense, so penalizing for it violates the spirit of the rule.

  Neither side is objectively "wrong" based on the text provided. The text is vague (what philosophers of law call having an "open texture"). H.L.A. Hart, a legal philosopher, argued that all rules have a "core" of clear meaning and a "penumbra" of doubt. For three years, you were in the core. This week, you are in the penumbra.

  ### 3. Is the Disagreement "Empty"?
  It is not **empty**, because it has real consequences for the student's grade. But it is **indeterminate**.

  Asking "Who has been following the *real* rule all along?" assumes the rule exists like a physical object waiting to be measured. It doesn't. Rules are social tools. Their meaning is sustained by the community of practice (you and the TA). When that community fractures on a borderline case, there is no higher court of appeals to tell you what the rule *was*. There is only a decision about what the rule *will be*.

  ### 4. How to Resolve It (Practically)
  Since there is no metaphysical fact to uncover, you have to make a decision based on authority and pedagogy.

  1.  **The Benefit of the Doubt:** In academic grading, ambiguity usually benefits the student. If the policy wasn't explicit about holidays, the stricter interpretation (TA's) penalizes the student for an ambiguity they didn't create. Waiving the penalty this once is the "fair" move, even if the TA is "logically" consistent.
  2.  **Validate the TA:** Your TA is actually doing a good job. Rigor is a virtue in grading. Tell them: *"You are right that the text supports your reading. That's why we need to clarify the text. But for this case, I'm exercising instructor discretion to align with the intent."*
  3.  **Update the Rule:** This is the most important part. You now know the rule was incomplete. Change the syllabus to: *"-10% per 24-hour period"* (if you mean the TA's way) OR *"-10% per business day (university holidays excluded)"* (if you mean your way).

  ### The Verdict
  You haven't discovered that one of you was "wrong" for three years. You've discovered that **meaning is often retrospective.**

  You both thought you were following the same map, but you only realize you were looking at slightly different versions of the map when you hit a landmark that wasn't drawn on either of them. There is no fact about who was right *before* this moment. There is only the fact of what you decide *now*, which will become the rule for the future.

  **My advice:** Waive the penalty for the student (intent over text in cases of ambiguity), thank your TA for their rigor (it saved you from future lawsuits), and rewrite the policy to be explicit.
