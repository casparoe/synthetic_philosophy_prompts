prompt: |-
  Ok weird situation from grading season, curious what you'd make of this. My TA and I have used the same late-penalty policy for three years: "-10% per day late." We've never once disagreed on a case until this week, when a student turned in a paper 12 hours late but during a university holiday. I say the penalty shouldn't apply that day since nothing was "due" in any meaningful sense, she says the rule clearly says "per day," full stop, no exceptions carved out. Every single case before this one was consistent with both readings, so it's not like one of us was applying the rule "wrong" and just didn't notice till now. Now I'm stuck wondering if there's actually a fact about which of us has been following the real rule all along, or if we just happened to agree on outputs for three years without ever meaning the same thing. Is this a real disagreement with a right answer, or is it kind of empty?
