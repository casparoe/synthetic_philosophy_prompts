answer: |-
  You are absolutely right to be dissatisfied with the "sunk cost fallacy" explanation. In behavioral economics, "sunk cost" is often used as a catch-all label for *why* people behave irrationally, but it doesn't explain the *mechanism* of the trap. It describes the error, not the engine.

  Your husband is correct that this is a **Dollar Auction** (or its continuous cousin, the **War of Attrition**). Your intuition about the mechanics is also sharper than most pop-science explanations: **Once the game has started, escalating is often the mathematically rational move.**

  Here is the actual game theory breakdown of why this happens, distinguishing between the *payoff structure* (the trap) and the *information structure* (the entry).

  ### 1. The Payoff Structure: Why Escalation is Rational "In-Game"
  You asked: *"Isn't raising your bid, at least for a while, the individually rational move given what the other bidder just did?"*

  **Yes.** This is the critical insight that "sunk cost" ignores.

  In a standard auction, only the winner pays. In the Dollar Auction (and your legal battle), **both parties pay their costs.**
  *   **Prize:** $100 (House equity)
  *   **Current Bids:** You ($90), Sister ($100).
  *   **Scenario:** It is your turn.

  If you **quit**: You pay your $90 in legal fees, get nothing. Net: **-$90**.
  If you **bid $110**: You pay $110 in fees, get the $100 house. Net: **-$10**.

  From a forward-looking perspective, ignoring what you *already* spent, losing $10 is better than losing $90. Therefore, bidding $110 is the **dominant strategy** in that specific subgame. You are not bidding to win; you are bidding to minimize loss.

  This confirms your suspicion: The payoff structure itself creates a local rationality trap. Once you are the second-highest bidder, you are mathematically compelled to outbid the leader until the cost of the next bid exceeds the value of the prize *plus* the loss you'd incur by quitting.

  ### 2. The Information Structure: Why the Game Starts at All
  You also asked: *"If both side's spending limits were common knowledge, a fully rational player would just drop out immediately... So which is it: failure of common knowledge or payoff structure?"*

  **It is both.**
  *   The **Payoff Structure** traps you *once you are in*.
  *   The **Failure of Common Knowledge** is why you *entered* in the first place.

  In game theory, if two players have **Common Knowledge of Rationality** and **Common Knowledge of Valuations/Limits**, the Dollar Auction never begins.

  **The Backward Induction Argument:**
  If I know you are rational, I know you will not bid more than the house is worth (let's say $500k). If I know your limit is $500k and mine is $500k, and we both know this, we both know the bidding will stop at $500k.
  *   If we bid up to $500k, the winner pays $500k for a $500k house. Net gain: $0.
  *   The loser pays their second-highest bid (say $499k) and gets nothing. Net loss: -$499k.
  *   Since the expected value of entering is zero (or negative, accounting for risk), a rational player bids $0 at the start.

  **So why are you fighting?**
  Because you lack **Common Knowledge of Limits**.
  1.  **Incomplete Information:** You don't know her absolute financial or emotional limit. She doesn't know yours. You are currently in a **War of Attrition** where you are bidding to *discover* her limit. You are hoping your next legal filing is the one that makes her say "uncle."
  2.  **Uncertainty of Rationality (The "Gang of Four" Theorem):** Even if you think you are rational, do you know *she* is rational? If there is even a 1% probability that she is "irrational" (i.e., she values vindication higher than money and will bid past the house's value), it becomes rational for *you* to escalate early to bluff her into quitting. You are spending money to build a reputation for being "crazy enough to keep going."

  ### 3. The Mechanism: Subgame Perfect Nash Equilibrium
  To answer your specific question on the mechanics:

  In a game with perfect information (we both know exactly how much the other will spend), the **Subgame Perfect Nash Equilibrium (SPNE)** is for the player with the lower valuation/limit to drop out immediately at Turn 1. The player with the higher limit wins the prize at the price of the lower limit + epsilon.

  **The escalation you are experiencing is a deviation from SPNE caused by incomplete information.**
  You are effectively playing a poker game where you keep raising not because you think you have the winning hand, but because folding confirms a loss, and raising keeps the *probability* of a win non-zero.

  Every time you spend another $10k on lawyers, you are buying a "call option." You are paying a premium for the *possibility* that the next $10k will be the amount that breaks her, whereas quitting guarantees a 100% loss of the previous $10k.

  ### 4. Why "Sunk Cost" is the Wrong Label
  The Sunk Cost Fallacy suggests you are making a mistake by factoring in past costs.
  *   **Sunk Cost Logic:** "I can't quit because I already spent $50k." (This is irrational).
  *   **Game Theory Logic:** "If I quit now, I realize a $50k loss. If I spend another $5k, I might turn that $50k loss into a net gain if she quits." (This is rational risk assessment).

  The trap isn't that you are looking backward; it's that the **marginal cost of continuing is lower than the marginal cost of stopping** until you reach a very high threshold. You are looking forward, but the future looks terrible either way, so you pick the "less bad" option, which happens to be throwing good money after bad.

  ### 5. The Only Way Out (Game Theoretically)
  Since you asked for mechanics, not advice, here is the mechanical solution to a Dollar Auction/War of Attrition:

  **You must change the Payoff Structure.**
  As long as the rules are "Winner takes house, Loser pays fees, Winner pays fees," the Nash Equilibrium is escalation until bankruptcy. Rational players cannot stop this unilaterally because stopping is a dominated strategy *within the current rules*.

  To stop, you must introduce a **Correlated Equilibrium** or a **Cooperative Solution**:
  1.  **Merge Bids:** You and your sister effectively form a cartel. You sell the house and split the proceeds. This removes the "second place pays" penalty.
  2.  **Binding Commitment:** One party must make a credible, binding commitment to bid *infinity* (or sell their house to pay lawyers). If your sister knew with 100% certainty you would spend $2M on a $500k house, she would quit immediately. (This is why people threaten suicide or financial ruin in these disputes—to signal infinite commitment).
  3.  **Third-Party Intervention:** A mediator changes the game from "Non-Cooperative" to "Cooperative." In a non-cooperative game, communication is cheap talk. In a cooperative game, binding agreements are possible.

  ### Summary
  *   **Is it the payoff structure?** Yes. The rule that "second place pays" makes escalation the locally rational choice to minimize loss once the game is underway.
  *   **Is it failure of common knowledge?** Yes. If limits and rationality were common knowledge, the game would never start. The fighting proves that at least one of you believes the other might quit sooner than is financially rational.
  *   **Is it Sunk Cost?** No. It is **Loss Minimization**. You are rationally choosing a larger potential loss (total fees) for a non-zero chance of a gain, rather than accepting a certain realized loss (fees already spent).

  You are not behaving irrationally given the constraints of the game you are in. You are behaving rationally in a game that is designed to punish rationality. The only rational move left is to collude with the "opponent" to change the rules.
