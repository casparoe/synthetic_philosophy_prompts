prompt: |-
  Ok this is a little embarrassing but my sister and I have now spent more on lawyers fighting over mom's house than the house is even worth, and neither of us will drop it because that would mean everything we already spent was for nothing. My husband said this is basically "the dollar auction" thing from game theory, that whole escalation of commitment trap, and now I'm way down a rabbit hole about it. Every pop explanation I find just says people get caught by the sunk cost fallacy, but that feels like it dodges the actual mechanism. Isn't raising your bid, at least for a while, the individually rational move given what the other bidder just did? You're out that money either way once you're in second place. I vaguely remember reading that some game theorist showed that if both side's spending limits were common knowledge, a fully rational player would just drop out immediately instead of escalating at all, kind of like backward induction in the centipede game. So which is it: is real-life escalation basically a failure of common knowledge about the other side's limits, or is there something about the payoff structure itself that traps people even when they're being fully rational and know the other side is too? I want the actual game theory mechanics here, not the sunk-cost hand-wave.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user and her sister are in a legal battle over their mother's house. Costs have exceeded the house's value. Neither wants to quit because of past spending.
      *   **Husband's Input:** Identified this as the "Dollar Auction" (game theory), escalation of commitment, sunk cost fallacy.
      *   **User's Critique:** Feels "sunk cost fallacy" is a hand-wave. Wants the *actual mechanism*.
      *   **Key Question:** Is escalation due to a failure of common knowledge (not knowing the other's limit), or does the payoff structure itself trap fully rational players even with common knowledge?
      *   **Specific Reference:** Mentions backward induction in the Centipede Game and the idea that rational players should drop out immediately if limits are known.
      *   **Goal:** Explain the game theory mechanics of the Dollar Auction without resorting to psychological buzzwords like "sunk cost."

  2.  **Deconstruct the Dollar Auction (Martin Shubik, 1971):**
      *   **Rules:** Auction a dollar. Highest bidder wins the dollar. *Both* highest and second-highest bidders pay their bids.
      *   **The Trap:** Once bidding starts (e.g., 90 cents vs. $1.00), the 90-cent bidder faces a loss of 90 cents if they stop, or a loss of 10 cents if they bid $1.10 (winning the dollar but paying $1.10). Rational choice: Bid $1.10 to minimize loss.
      *   **The Escalation:** This continues past $1.00. $1.10 vs $1.20. Now the $1.10 bidder loses 10 cents if they stop, or 20 cents if they bid $1.30. Rational choice: Bid $1.30.
      *   **The Paradox:** If both players are perfectly rational and know the rules, why does it start?

  3.  **Address the User's Specific Theoretical Points:**
      *   *Point 1: "Isn't raising your bid, at least for a while, the individually rational move?"*
          *   Yes. Once you are the second-highest bidder, you are trapped. Minimizing loss dictates bidding higher. This is the core mechanic. It's not sunk cost (ignoring past costs); it's forward-looking loss minimization.
      *   *Point 2: "If spending limits were common knowledge... a fully rational player would just drop out immediately."*
          *   This refers to the *entry* problem. If I know you will bid up to $5 and I will bid up to $5, and the prize is $1, neither of us should bid 5 cents to start.
          *   This connects to the concept of **Subgame Perfect Nash Equilibrium (SPNE)**.
      *   *Point 3: "Failure of common knowledge vs. Payoff structure trap."*
          *   This is the crux. The user wants to know if rationality *itself* causes the trap or if it's incomplete information.

  4.  **Synthesize the Game Theory Explanation:**

      *   **Mechanism 1: The Local Rationality Trap (Once inside).**
          *   Explain that *after* the auction starts, escalation *is* rational. It's not sunk cost. It's minimizing marginal loss.
          *   Math: If Bidder A is at $0.90 and Bidder B is at $1.00.
          *   A stops: Pay $0.90, get $0. Net = -$0.90.
          *   A bids $1.10: Pay $1.10, get $1.00. Net = -$0.10.
          *   -$0.10 > -$0.90. Rational to bid.
          *   *Conclusion:* The payoff structure *does* trap you once you are in the "second place" position.

      *   **Mechanism 2: The Entry Problem (Before starting).**
          *   If both players are perfectly rational and know the other is perfectly rational (Common Knowledge of Rationality), the auction should never start.
          *   Backward Induction: If we know it escalates to infinity (or our bankroll limits), the expected value is negative. Therefore, Bid 0.
          *   *Why it fails in reality:* Common Knowledge of Rationality is a very strong assumption. I might be rational, but do I know *you* are rational? Do I know that *you know* I am rational?
          *   If there is even a tiny probability the other person is "irrational" (or committed to winning at all costs), it becomes rational for the "rational" player to enter and escalate to bluff or test that limit. This is the **Gang of Four Theorem** (Kreps, Milgrom, Roberts, Wilson) logic applied to reputation/commitment.

      *   **Mechanism 3: The Role of Limits (Bankroll Constraints).**
          *   If limits are known: The player with the deeper pocket wins, the other drops out immediately (or never enters).
          *   If limits are unknown: It becomes a war of attrition. You bid to discover the other's limit.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Validation:* Acknowledge the situation is tough but the intellectual curiosity is spot on. Validate that "sunk cost" is indeed an insufficient explanation for game theorists.
      *   *The "Once In" Mechanism:* Confirm the user's intuition. Once second place, bidding more *is* rational. It's loss minimization, not sunk cost. This answers the "payoff structure" part of the question.
      *   *The "Before In" Mechanism:* Address the "common knowledge" part. If limits and rationality are common knowledge, the game doesn't start. This is the Subgame Perfect Equilibrium.
      *   *The Real World Gap:* Why does it happen then?
          1.  **Incomplete Information:** You don't know her limit. You are bidding to *learn* her limit.
          2.  **Uncertainty about Rationality:** You aren't sure if she will act rationally. If there's a 1% chance she's crazy, it might be worth spending $10k to find out (or to make her think you're crazy).
          3.  **The "First Mover" Error:** The trap isn't just escalating; it's entering. The first bid is the mistake.
      *   *Application to the House:* Map the theory to the legal battle.
          *   Legal fees = Bids.
          *   House Value = The Dollar.
          *   Second place pays = Loser pays fees (usually), but here *both* pay fees (key distinction).
          *   Actually, in legal battles, usually both pay their own lawyers. This matches the Dollar Auction (both pay bids) rather than a standard auction (only winner pays).
      *   *The Way Out:* Game theory suggests the only way to stop is to change the game (cooperate) or make a credible commitment to stop (which is hard).

  6.  **Refining the Tone:**
      *   Empathetic but analytical.
      *   Avoid condescension.
      *   Use precise terminology (Subgame Perfect Nash Equilibrium, Common Knowledge of Rationality, War of Attrition).
      *   Directly answer the "Which is it?" question. (Answer: It's both. Structure traps you *in*, incomplete knowledge traps you *entering*.)

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, is it exactly a Dollar Auction?* In a legal battle, usually, if I quit, I pay my past fees, you pay yours. I get nothing. You get the house minus your fees.
      *   In the Dollar Auction: Second highest pays their bid and gets nothing. Highest pays bid and gets dollar.
      *   In Legal Battle: If I quit now, I pay past fees (sunk). Future fees are avoided. If I continue, I incur more fees for a chance at the house.
      *   *Correction:* The legal battle is more like a **War of Attrition**. In War of Attrition, both pay costs over time until one quits. The winner gets the prize minus accumulated costs. The loser gets nothing minus accumulated costs.
      *   *Dollar Auction vs. War of Attrition:* They are strategically equivalent in terms of escalation dynamics. The Dollar Auction is a discrete version of War of Attrition. I should mention War of Attrition as it fits continuous legal spending better.
      *   *Key Distinction:* In War of Attrition, if limits are known, the weaker player quits immediately. If unknown, they fight to signal strength.
      *   *User's specific question:* "Is real-life escalation basically a failure of common knowledge... or is there something about the payoff structure?"
      *   *Answer:* The payoff structure creates the trap *conditional on entry*. The failure of common knowledge (about limits or rationality) explains the *entry*.

  8.  **Final Polish:** Ensure the distinction between "Sunk Cost Fallacy" (psychological error) and "Loss Minimization" (rational calculation within a trapped subgame) is clear. This is what the user specifically asked for.

