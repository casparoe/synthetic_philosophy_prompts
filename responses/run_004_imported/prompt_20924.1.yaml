  9.  (Final check of the "Common Knowledge" point): The user mentioned "if both side's spending limits were common knowledge, a fully rational player would just drop out immediately." This is correct for War of Attrition. If I know you have $1M and I have $100k, and the prize is $500k, I quit immediately. I cannot win. The fighting implies we *don't* know the limits, or we think we can bluff the other into quitting.

