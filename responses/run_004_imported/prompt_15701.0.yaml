answer: |-
  **Succession**

  The tea was cooling. This was the only fact that seemed to possess weight. 

  Elias sat at the desk, the pen hovering over the notebook. He was calculating the relaxation time of a gas returning to equilibrium, a task he had performed for forty years. The equation was reversible; the molecules did not care which way the film ran. But the tea cared. The steam rose, dispersed, and vanished. The heat moved from the cup to the air, never the reverse. This was the statistical arrow: a probability so vast it felt like law. 

  He looked away from the cup to adjust the lamp. 

  When he looked back, the cup was on the left side of the blotter, not the right. The tea was full, steaming vigorously, as if it had never cooled. 

  Elias paused. In his line of work, one learned to trust the instrument, not the eye. But the instrument here was the mind. He considered the proposition: *Esse est percipi.* To be is to be perceived. When his gaze had broken contact with the cup, the cup had ceased to be. There was no material substrate to maintain its position or its temperature in the interim. The universe had not persisted in the dark; it had merely waited for the next observation to render itself anew. 

  He wrote this down. *Premise One: The object is a series of instantaneous perceptions.*

  He felt a fatigue behind his eyes. He tried to locate the source of the tiredness, to find the "I" that was tired. He searched for the continuous thread that connected the Elias who had poured the tea ten minutes ago to the Elias writing this sentence. He found only the sentence. He found the sensation of the pen in his hand, the ache in the shoulder, the memory of pouring the tea. But the memory was just another present sensation, a neural firing happening *now*. 

  There was no binder. No soul holding the moments together like beads on a string. There were only the beads, floating in a void, pretending to be a necklace. 

  *Premise Two: The subject is a bundle of perceptions.*

  If the cup is not the same cup from one second to the next, and I am not the same man, then what moves? What flows? 

  He stood up to walk to the window. The floorboards did not creak; they simply appeared beneath his feet. The hallway outside the study did not exist until he opened the door. He was not walking *through* space; he was summoning space into existence by demanding it. 

  He thought of the entropy calculation on the desk. If time is merely a measure of disorder increasing, then time requires a system that endures long enough to become disordered. But if the system resets with every perception, if the universe is reborn in every instant, then entropy cannot accumulate. The tea cannot cool if the cup is new every time. 

  The scientific argument and the philosophical argument were converging like parallel lines in a non-Euclidean geometry. Physics suggested time might be an emergent property, a statistical illusion. Idealism suggested time was a logical impossibility. 

  Elias returned to the desk. The notebook was open to a fresh page. The previous page, the one with the calculation and the premises, was gone. 

  He did not feel surprise. Surprise implies a violation of expectation, and expectation implies a belief in a future based on a past. If the past is a fiction, surprise is impossible. 

  He began to write again. 

  *The world is a series of self-sufficient moments. There is no causal link between this ink and the ink that preceded it. There is no causal link between this thought and the thought that preceded it.*

  He wrote the words, and they felt true. They felt like a liberation. If there is no time, there is no decay. If there is no self, there is no one to die. The terror of the heat death of the universe, the slow grinding of the stars into iron, the eventual silence—it was all a grammatical error. A mistake in the tense of the verb. 

  He looked at his hands. They were spotted with age. He remembered them being smooth. But the memory was just an image, currently present, with no more claim to reality than a dream of a smooth hand. The spots were not the result of years of sun exposure; they were simply the texture of the hand in this specific, isolated moment. 

  He felt a profound calm. The dissolution was complete. The labyrinth had no walls because there was no space to contain them. The minotaur was dead because there was no body to bleed. 

  He put the pen down. 

  The room was dark. The lamp was off. 

  He had not turned it off. 

  It did not matter. Darkness was just another quality of the instant. He sat in the quiet, waiting for the next instant to arrive. But if there is no time, there is no "next." There is only *this*. 

  He closed his eyes. 

  *   *   *

  A car horn blared outside. 

  Elias jerked upright. His heart was hammering against his ribs, a frantic, biological drum. 

  The lamp was on. The tea was cold, a skin of scum forming on the surface. The notebook was filled with his handwriting, page after page, the ink dried and brown. 

  He looked at the date in the corner of the page. It was three hours later than the date on the previous page. 

  The logic was flawless. He had proved it. He had dismantled the scaffold of succession. He had shown that without a permanent substance to undergo change, change is a word without a referent. He had married Berkeley's immaterialism to Hume's skepticism and birthed a stillness that should have been absolute. 

  And yet. 

  His bladder was full. The pressure was urgent, insistent, demanding a future moment in which it would be relieved. His stomach cramped with hunger, a painful anticipation of a meal that had not yet been eaten. 

  He looked at the cold tea. He knew, with a certainty that bypassed all philosophy, that if he drank it, it would taste stale. If he waited an hour, it would taste worse. 

  The argument remained standing, perfect and crystalline. Time was a delusion. The self was a fiction. 

  But the cramp in his gut was real. The chill in the room was real. The fear that he would not finish the calculation before he died was real. 

  He picked up the pen. His hand shook. 

  "I have written this refutation," he whispered to the empty room. "I have proved that I am not here." 

  He waited for the proof to save him. It offered nothing. 

  "I am still here," he said. 

  The words hung in the air, vibrating, decaying, succeeding one another in a relentless, unrefutable line. He was a man who did not exist, trapped in a time that could not pass, waiting for a cup of tea to grow colder. 

  He took a sip. It was bitter. He winced. 

  "Damn," he said. 

  He turned the page. He began to write the date. He wrote the numbers in order. One, two, three. He could not write them any other way.
