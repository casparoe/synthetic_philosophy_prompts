      *   **Key Argument to Enact:**
          1.  Berkeley's denial of matter (no enduring external world).
          2.  Hume's denial of self (no enduring internal subject).
          3.  Conclusion: If neither world nor self endures, succession has nothing to succeed. Time dissolves into discrete, unconnected moments.
          4.  The Twist/Confession: The author (protagonist) remains helplessly caught in time despite the argument.
      *   **Constraint:** Do not just use Borges's tropes (mirrors, tigers, labyrinths) as decoration. The *plot/structure* must enact the dissolution of substance and self.
      *   **Secondary Constraint:** Brush against a scientific route to doubting time (entropy/relativity) without conflating it with the philosophical argument.
