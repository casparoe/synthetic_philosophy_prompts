answer: |-
  This is a fantastic dispute because it cuts right to the tension between Ramsey the **humanist pragmatist** (the "Epilogue") and Ramsey the **formalist logician** (the "Truth and Probability" decision theory). Both you and Jo have identified real textual evidence, but you are applying them to different layers of Ramsey's philosophy.

  If we reconstruct Ramsey's likely response to a modern longtermist pitching "astronomical waste" and existential risk (x-risk), I believe **Jo wins on the ethical metaphysics, but you win on the structural logic—up to a point.** However, on balance, Ramsey would likely reject the *conclusion* of strong longtermism because he would reject the *inputs* required to make the math work.

  Here is the reconstruction of how Ramsey would handle the argument, broken down by the conflicting elements of his thought.

  ### 1. The "Epilogue" Ramsey: The Rejection of Cosmic Scale (Jo's Case)
  Jo is right that the *rhetorical spirit* of longtermism would repel Ramsey. In the "Epilogue," Ramsey is fighting against a specific kind of nihilism: the idea that human goods are diminished because they are physically small or temporally finite compared to the universe.

  *   **Perspective vs. Scale:** Ramsey writes: *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits."*
      *   **Application to Longtermism:** Longtermism relies on "scale" (trillions of lives) to override "perspective" (current suffering or flourishing). Ramsey would argue that moral importance is determined by the *foreground* of human concern, not the background count of potential entities. To Ramsey, a trillion future people who are not objects of present human affection are, morally speaking, "threepenny bits."
  *   **The Irrelevance of Extinction:** Ramsey explicitly says: *"I have no wish to be immortal... I do not feel the least humble before the vastness of the stars."* He argues that the eventual heat death of the universe does not negate the goodness of a present moment.
      *   **Application to X-Risk:** If the *eventual* end of humanity doesn't negate present value, why does the *premature* end negate future value? Ramsey treats the "good" as a property of actualized experiences. A future that never happens cannot be "lost value" in a way that haunts the present. He would likely view "astronomical waste" as a category error: you cannot waste what does not exist, and you cannot owe duty to a "potentiality" that has no psychological reality in the mind of the agent.

  **Jo's Win:** Ramsey would almost certainly mock the "sublime" packaging of longtermism. He would see the awe at "trillions of future lives" as the exact same emotional error as awe at "billions of lightyears." It substitutes mathematical bigness for human significance.

  ### 2. The Decision-Theoretic Ramsey: The Logic of Expected Utility (Your Case)
  You are right that Ramsey invented the framework that longtermists use. In *"Truth and Probability"* (1926), Ramsey defines belief and desire in terms of betting behavior and establishes that rational agents maximize subjective expected utility (SEU).

  *   **The Math is Blind:** Ramsey's SEU framework is formal. It doesn't care *what* you value, only that you are consistent. If an agent assigns *any* non-zero utility to the existence of future people, and *any* non-zero probability to affecting them, the sheer magnitude of the "astronomical waste" argument (trillions of lives) mathematically dominates present-focused concerns.
  *   **Consistency Requirement:** Ramsey was a utilitarian (heavily influenced by G.E. Moore). If Ramsey accepts that a future person's happiness counts as "good" in the same way a present person's does (the principle of temporal neutrality), he is logically committed to counting them. To ignore them because they are "far away" in time would be irrational bias, similar to ignoring people far away in space.

  **Your Win:** If you could get Ramsey to agree to the *premises* (that potential people count as moral patients and we can assign coherent probabilities to x-risk mitigation), he would be forced by his own logic to accept the EV calculation. He would not be allowed to say "the math is right but I don't care." For Ramsey, caring *is* acting according to the math.

  ### 3. The Synthesis: Where Ramsey Would Break the Chain
  Here is where we move beyond your debate into the specific nuances of Ramsey's philosophy. Ramsey would likely stop the longtermist argument *before* it gets to the multiplication of utility, on two specific grounds: **The Nature of Utility** and **The Nature of Probability.**

  #### A. Utility is Psychological, Not Abstract
  Ramsey's utilitarianism wasn't the abstract "total welfare of the universe" kind. It was rooted in human psychology ("Facts and Propositions"). Goodness is defined by what we "desire to desire."
  *   **The Objection:** Ramsey would ask the longtermist: *"Do you actually desire the happiness of these specific trillions of people? Or do you desire the abstract concept of 'humanity continuing'?"*
  *   **The Verdict:** Ramsey defines belief and desire by **disposition to act**. If the longtermist is not actually sacrificing significant present foreground goods (e.g., living in misery to fund x-risk), Ramsey would argue they don't *actually* hold the utilities they claim to hold. He would view "astronomical waste" as a theoretical fiction that fails the "betting test." You wouldn't bet your life savings on it; therefore, you don't truly believe the utility is that high.

  #### B. Suspicion of Vague Probabilities (Pascal's Mugging)
  Ramsey was rigorous about probability. He required probabilities to be coherent and measurable via betting quotients.
  *   **The Objection:** Longtermism often relies on tiny probabilities ($10^{-9}$) of huge impacts ($10^{50}$ lives). Ramsey was sensitive to the difference between measurable risk and unmeasurable uncertainty (Knightian uncertainty).
  *   **The Verdict:** Ramsey would likely argue that the probability of a specific x-risk intervention actually affecting the far future is **undefined**, not just small. If you cannot coherently bet on the outcome (because the causal chain is too complex), the probability has no meaning in Ramsey's system. You cannot multiply "undefined" by "trillions." He would likely classify the astronomical waste argument as a form of **Pascal's Wager**, which he would reject as irrational because it relies on incoherent probability assignments.

  ### 4. The Verdict: Who is Right?

  **Jo is more right about Ramsey's *Ethics*, but you are more right about Ramsey's *Logic*.**

  If a longtermist walked into Ramsey's study in 1929:
  1.  **Ramsey would reject the *motivation*:** He would agree with Jo that trying to derive importance from the "vastness of time" is a mistake comparable to deriving it from the "vastness of space." It violates the "perspective" principle of the *Epilogue*.
  2.  **Ramsey would reject the *inputs*:** He would argue that we cannot have coherent utilities for non-existent beings, nor coherent probabilities for far-future interventions.
  3.  **Ramsey would accept a *limited* conclusion:** He was a utilitarian who cared about the future (e.g., he worried about war and politics). He would likely support *reasonable* precautions for the near future (his children, his grandchildren) because those are extensions of his present "foreground." But he would draw a hard line at the "astronomical" scale.

  **The Settlement:**
  Ramsey would say the longtermist is making a **category mistake**. They are using a **decision-theoretic tool** (EV maximization) designed for **human-scale uncertainties** and applying it to **metaphysical speculations**.

  He would tell Jo: *"You are right that the 'sublime' argument is nonsense. Size doesn't equal value."*
  He would tell You: *"You are right that the math works, but only if the inputs are real. Since 'trillions of non-existent people' are not real objects of desire, and the probabilities are incoherent, the math yields zero."*

  ### 5. Where the Text Underdetermines the Answer (Honesty Flag)
  I need to flag two areas where we are guessing, because Ramsey died at 26 and left no completed ethical treatise:

  1.  **Total vs. Average Utilitarianism:** Ramsey never specified if he was a "total" utilitarian (sum of all happiness) or "average" utilitarian. Longtermism requires Total Utilitarianism to work (more people = more good). If Ramsey was an Average Utilitarian (or a "prioritarian" focused on the worst off), the astronomical waste argument collapses entirely. Given his Bloomsbury connections (Keynes, Moore), he might have valued *quality* of life (organic unities) over *quantity*, which favors Jo.
  2.  **The Status of "Potential" People:** Ramsey's ethics are grounded in *actual* psychology. We simply do not know how he would formalize the utility of *possible* people. Modern decision theory struggles with this (the Non-Identity Problem). Ramsey might have invented a solution, or he might have dismissed the question as nonsensical.

  ### Summary for the Pizza Argument
  Tell Jo she wins on the **spirit** of Ramsey: he would hate the "cosmic insignificance" anxiety that drives longtermism. Tell yourself you win on the **tools**: Ramsey built the engine longtermists use. But the winner of the debate is **Ramsey himself**, who would likely tell you both that prioritizing abstract future numbers over concrete present goods is a failure of both perspective *and* probabilistic coherence. He'd probably order another pizza and suggest you both spend the money on something that actually makes you happy now.
