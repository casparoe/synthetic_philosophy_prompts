      *   *Complexity/One-Line Summary:* 5 points. (Answer fails to capture the shift in Aquinas's thought and the restriction on private individuals).
      *   *Total Deduction:* Need to penalize the claim that private killing is permissible "in principle" for the second type, and the John of Salisbury conflation.

