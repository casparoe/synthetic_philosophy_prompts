          3.  Correct account of response to Legitimate Tyrant (Public vs. Private): 2/6 (Major error on private permission).
          4.  Nuance regarding the "one-line summary" & John of Salisbury: 3/6 (Misses the key shift in Aquinas's thought).
          *   Total: 13/20. Let's refine. Maybe 14/20 is fairer because the *De Regno* practical arguments are good, even if the normative conclusion is off. Let's go with 14/20. It's a "B-" / "C+" level answer. Good grasp of text, bad grasp of the philosophical implication of the distinction.

