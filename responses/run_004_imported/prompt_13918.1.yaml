answer: |-
  **Score: 14/20**

  This is a strong effort that demonstrates you have actually read the texts rather than relying on secondary summaries. The distinction between the two types of tyrants is clear, and the practical arguments against assassination are well-summarized. However, there is a significant interpretive error regarding the *principle* of tyrannicide in the second case, and a historical inaccuracy regarding John of Salisbury that affects the final conclusion.

  Here is the point-by-point breakdown:

  **1. Definition of the Two Types of Tyrant (5/5 points)**
  *   **Strengths:** You correctly identify the distinction between the *tyrannus ex defectu tituli* (usurper) and the *tyrannus ex parte exercitii* (legitimate ruler acting unjustly). You correctly associate the first with the *Commentary on the Sentences* and the second primarily with *De Regimine Principum*.
  *   **Comments:** This is the foundation of the answer, and you nailed it. It shows you understand that for Aquinas, legitimacy of origin matters.

  **2. Response to the Usurper (Defect of Title) (5/5 points)**
  *   **Strengths:** Your summary of the *Sentences* position is accurate. You correctly note that because the usurper lacks legitimate authority, they do not hold the "public" status that protects a ruler, and thus private resistance is permissible (with the caveat about causing greater disturbance).
  *   **Comments:** Good inclusion of the "disturbance" caveat. Aquinas is always concerned with the *common good*, so even resisting a usurper is wrong if it destroys the community in the process.

  **3. Response to the Legitimate Tyrant (Exercise) (2/5 points)**
  *   **Weaknesses:** This is the main area for correction. You write that Aquinas's caution is "rather than a withdrawal of the permission in principle." Most scholars argue the opposite: in *De Regno* (and later in the *Summa Theologiae* II-II, Q. 42, a. 2), Aquinas *does* withdraw the permission for **private individuals** to kill a tyrant who holds office legitimately.
  *   **Specifics:** Aquinas argues that because this ruler holds public authority, only a **public authority** can depose them. If there is no superior (e.g., an Emperor over a King), the community must endure or pray. By suggesting the permission remains "in principle" for private individuals but is just practically risky, you miss Aquinas's key political innovation: he is moving away from private vigilantism toward a theory of public constitutionalism.
  *   **Comments:** You correctly listed the practical dangers (precedent, ambition, cruelty), but you drew the wrong normative conclusion from them. For Aquinas, these aren't just risks; they are reasons why private killing is *unjust* in this specific case.

  **4. Critique of the "One-Line Summary" & John of Salisbury (2/5 points)**
  *   **Weaknesses:** You argue that Aquinas is "continuing the older line associated with John of Salisbury." This is historically contentious. In *De Regno*, Aquinas quotes John of Salisbury's *Policraticus*, but he notably **cuts off the quote** right before John says killing a tyrant is a "meritorious act."
  *   **Specifics:** Scholars (like Cary Nederman and Janet Coleman) often point out that Aquinas is silently correcting John of Salisbury here. John of Salisbury *did* argue it was meritorious for a private individual to kill a tyrant; Aquinas explicitly argues against this in his mature work. By linking them so closely, you undermine the complexity you were asked to explain.
  *   **Comments:** The "one-line summary" is too simple not just because of practical risks (as you argued), but because Aquinas changes the *moral status* of the act depending on the type of tyrant. For the usurper, it may be permissible; for the legitimate tyrant, it is generally sedition if done privately.

  **Total: 14/20**

  **Suggestions for the Group's Further Study:**
  1.  **Check the *Summa Theologiae*:** Have the group look at *Summa Theologiae* II-II, Question 42, Article 2, Reply to Objection 3. This is where Aquinas synthesizes his earlier views. He reiterates that killing a tyrant is permissible *only* if there is no public authority to do it, but he is much more restrictive than in the *Sentences*.
  2.  **The "Public Authority" Clause:** Discuss what Aquinas means by "public authority." Does he mean the aristocracy? The people as a collective? This is where his political theory gets really interesting.
  3.  **John of Salisbury Comparison:** It might be worth reading the specific passage from the *Policraticus* (Book VIII) that Aquinas references. Seeing what Aquinas *left out* of the quote is a fascinating exercise in textual analysis.

  **Summary for your friend:**
  Tell him he has a great grasp of the texts and the practical arguments. His main error is assuming Aquinas kept the "private permission" open for the second type of tyrant. Aquinas actually closes that door to protect the stability of the regime, reserving deposition for public bodies. If he adjusts that distinction, the answer will be excellent.
