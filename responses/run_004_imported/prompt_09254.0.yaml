      *   **The "Strong Form" of the Critic's Objection:** It's not just about skepticism; it's about the *constitutive grounds* of qualitative character. A thought *that* I am in pain doesn't hurt. A thought *that* I am seeing red isn't red. So where does the "redness" come from if the first-order state is absent?
      *   **The "Best Available Reply" for the Theorist:**
          *   *Option A (Radical):* Quality *is* conceptual content. (Risky, admits the redefinition charge).
