  2.  **Deconstruct the Philosophical Positions:**
      *   **Higher-Order Thought (HOT) Theory:** A state is conscious iff I have a thought *about* that state. Phenomenal character is determined by how the HOT represents the first-order state.
      *   **The Misrepresentation Objection (Rosenthal's view vs. Critics):** If the HOT says "I am seeing red" but there is no red state (or no state at all), do I still have a conscious experience of red?
          *   *HOT Response (Rosenthal):* Yes. Phenomenal consciousness is just how things seem. If it seems like red, it is phenomenally red.
