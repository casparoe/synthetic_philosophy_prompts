answer: |-
  This is a fascinating counterfactual exercise in the history of philosophy. To answer it, we must distinguish between Hume's *negative* thesis (the critique of necessary connection) and his *positive* thesis (the psychological account of belief and causation).

  If David Hume were resurrected today, his reaction to modern physics and the Neo-Humean metaphysics of David Lewis would likely be a mixture of vindication, confusion, and specific philosophical resistance. He would probably view the modern "Humean" project as a faithful but overly systematized descendant of his own thought—one that retains his skepticism about power but loses his psychological grounding.

  Here is how Hume might respond to irreducibly probabilistic laws and the Best System Analysis (BSA).

  ### 1. Irreducibly Probabilistic Laws (Quantum Mechanics)

  Hume's account of causation rests on **constant conjunction**: we see event A followed by event B repeatedly, and the mind forms a habit of expecting B upon the appearance of A. We never observe a "necessary connection" tying them.

  **The Vindication:**
  Hume would likely feel vindicated by Quantum Mechanics (QM). The discovery that nature does not yield deterministic necessary connections at the fundamental level confirms his central skeptical claim: *necessity is not in the objects, but in the mind.* If physics itself says there is no deterministic glue between antecedent and consequent, Hume would say, "I told you so." The search for hidden variables (like Einstein's) would look to him like the search for "secret powers" or "occult qualities" that he criticized in the Scholastics and Newtonians.

  **The Resistance:**
  However, Hume would likely resist the interpretation of quantum probabilities as **ontic chances** (objective propensities inherent in nature).
  *   **Empiricist Constraint:** For Hume, all meaningful ideas must be traceable to an impression. What is the impression of "objective chance"? We have impressions of frequency (seeing heads come up 50% of the time) and impressions of uncertainty (feeling hesitant). But an *inherent propensity* in an electron sounds suspiciously like a "power" or "essence"—precisely the kind of metaphysical baggage Hume sought to eliminate.
  *   **Epistemic Reduction:** Hume would likely insist on reducing quantum probability to an epistemic category or a description of long-run frequencies. He would argue that saying "the law is probabilistic" is just a shorthand for "our observations show a statistical regularity, not a constant one." He would be wary of reifying probability into a physical force.

  ### 2. The Modern Humean Project (Lewis's Best System Analysis)

  David Lewis's **Humean Supervenience** posits that the world is a vast mosaic of local matters of particular fact (the Humean Mosaic). Laws of nature are not rulers of the mosaic but are merely the axioms of the system that best summarizes that mosaic (balancing simplicity and strength).

  **The Embrace:**
  Hume would embrace the **supervenience claim**. The idea that there is no "modal glue" holding the universe together, and that laws depend on facts rather than facts depending on laws, aligns perfectly with his empiricism.
  *   **Anti-Realism about Laws:** Hume would agree that laws are not prescriptive entities governing nature. They are descriptive summaries.
  *   **The Mosaic:** The notion of the world as a distribution of local qualities resonates with Hume's view of the world as a bundle of perceptions (though Hume would be more skeptical than Lewis about inferring a mind-independent "mosaic").

  **The Resistance:**
  However, there are three significant areas where Hume might diverge from Lewis:

  **A. Psychology vs. Logic**
  For Hume, the "necessity" of a law is a *feeling* of determination in the mind (custom/habit). For Lewis, the status of a law is an *objective fact* about which axiomatic system is "best."
  *   Hume might ask: "Best according to whom?" If the "Best System" is mind-independent, it risks becoming a Platonic abstraction. Hume's project was to ground philosophy in human nature and psychology. Lewis's project is to ground it in logic and metaphysics. Hume might view the BSA as too rationalistic, forgetting that "lawhood" is ultimately a projection of human cognitive habits onto the world.

  **B. The Problem of Probability in the Best System**
  Lewis incorporates probabilistic laws into the Best System (e.g., a law stating $P(A) = 0.5$). He treats this as part of the objective description of the mosaic.
  *   As noted above, Hume would struggle with the idea that "chance" can be part of the *best description* of reality. For Hume, probability is a measure of the *weight of evidence*, not a feature of the *system*. He might argue that a system including probabilistic axioms is actually admitting ignorance, not describing a law. To Hume, a "probabilistic law" is an oxymoron; it is a confession that we have not found the constant conjunction, not a new type of conjunction.

  **C. Determinism and Human Action**
  Hume was a compatibilist; he believed free will was compatible with causal determinism. His argument relied on the **uniformity of nature**: human actions are caused by motives and character just as physical events are caused by prior physical states.
  *   If the fundamental laws of the Humean Mosaic are indeterministic (as in QM), Hume's specific brand of compatibilism might need adjustment. While indeterminism doesn't necessarily save free will (randomness isn't freedom), it undermines the "uniformity" Hume relied upon to make human behavior predictable and scientifically studyable. He might worry that a fundamentally probabilistic mosaic makes the "science of man" impossible, as the link between motive and action would lack even statistical reliability.

  ### 3. Would he accept "Humean Supervenience"?

  Hume would likely accept the **spirit** of Humean Supervenience but reject its **systematicity**.

  *   **Yes:** He would agree that there are no necessary connections between distinct existences. He would agree that laws supervene on particular facts.
  *   **No:** He would resist the idea that we can construct a "Best System" that captures reality. Hume was a skeptic about the reach of human reason. The idea that we can calculate the balance of simplicity and strength to find *the* laws of nature might strike him as dogmatic.

  Furthermore, Lewis's "perfectly natural properties" (the base of the mosaic) might strike Hume as suspicious. Hume's impressions are sensory and phenomenological. Lewis's properties are theoretical posits of fundamental physics. Hume might argue that Lewis has replaced the "secret powers" of the Scholastics with the "secret properties" of the physicists, claiming knowledge of the intrinsic nature of matter that goes beyond our sensory impressions.

  ### Conclusion

  Hume would view the modern Humean project as a **triumph of his negative thesis but a distortion of his positive one.**

  He would cheer the destruction of Necessary Connection and the reduction of laws to patterns in the mosaic. However, he would warn David Lewis and his followers against turning "Regularity" into a new metaphysical idol. For Hume, laws are habits of the mind; for Lewis, they are features of the best deductive system. Hume would likely argue that Lewis has forgotten the human subject in his quest to objectify the mosaic.

  Regarding quantum probability, Hume would say: *"You have finally admitted that you cannot find necessity in nature. Do not now pretend that 'Chance' is a new kind of necessity. Admit your ignorance, describe the frequencies, and cease pretending to know the hidden propensities of electrons."*

  In short: **He would be the Godfather of the movement, but its most skeptical critic.** He would endorse the ontology (the mosaic) but critique the epistemology (the claim to know the "Best" system) and the metaphysics of chance.
