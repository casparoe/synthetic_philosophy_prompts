      *   **Key Questions:**
          1.  How does the construction work using Kleene's three-valued logic (K3)?
          2.  Why does the Liar sentence end up "ungrounded" (gap) instead of false?
          3.  What is the "Revenge Paradox" (Strengthened Liar) and why does it persist?
      *   **Tone/Style:** Technical, analogy-driven (leveraging CS knowledge), precise but accessible. Avoid excessive philosophical jargon where CS terms suffice.

