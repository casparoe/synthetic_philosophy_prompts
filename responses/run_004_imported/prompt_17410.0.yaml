      *   *Operator:* A function that takes a current assignment of truth values and updates it based on the T-schema ($T(\ulcorner \phi \urcorner) \leftrightarrow \phi$).
      *   *Iteration:* Start with nothing defined ($\emptyset$). Apply operator. Get more defined sentences. Repeat.
      *   *Limit:* When applying the operator changes nothing, we hit the *fixed point*.
      *   *Logic:* Strong Kleene (K3). Values: $1$ (True), $0$ (False), $1/2$ (Undefined/Gap).

  3.  **Drafting Section 1: The Construction (CS Style):**
      *   *Setup:* Imagine a database of sentences. Initially, the `truth_value` column is NULL for everything.
      *   *The Operator ($\Phi$):* This is the "evaluation engine." If I know the truth value of $A$ and $B$, I can compute $A \land B$. If I know $A$, I can compute $T(\ulcorner A \urcorner)$.
      *   *Monotonicity:* Crucial point. We never *change* a value from T to F or vice versa. We only fill in NULLs. This guarantees convergence (like monotone dataflow frameworks).
      *   *Stages:*
          *   Stage 0: All NULL.
          *   Stage 1: Atomic facts get values (e.g., "Snow is white" -> T). Sentences depending *only* on Stage 0 get values.
