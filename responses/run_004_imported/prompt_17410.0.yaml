          *   Stage 1: To evaluate $L$, we need $\neg T(\ulcorner L \urcorner)$. Since input is NULL, output in Kleene logic is NULL. So $L$ is NULL. Consequently, $T(\ulcorner L \urcorner)$ remains NULL.
          *   Stage $n$: Nothing changes.
      *   *Result:* $L$ stabilizes at NULL ($1/2$).
      *   *Why not False?* If we forced it to False, then $\neg T(\ulcorner L \urcorner)$ would be True, making $L$ True. Contradiction. Kripke avoids contradiction by allowing the "crash" (NULL) to propagate.
      *   *CS Analogy:* Infinite recursion / Stack overflow / Non-termination. It's not that the result is "False", it's that the computation doesn't return a value.

