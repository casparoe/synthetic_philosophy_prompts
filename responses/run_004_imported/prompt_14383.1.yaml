answer: |-
  **Title:** The Causal Architecture of Preference: A Realist Response to Armstrong and Mindermann

  **1. The Challenge: Degeneracy as Dissolution**

  The result by Armstrong and Mindermann (A&M) presents a formidable challenge to any naive realism about preference. They demonstrate that for any observed policy $\pi$, the decomposition into a reward function $R$ and a planning algorithm $p$ is radically degenerate. Specifically, for any pair $(p, R)$ that generates $\pi$, there exists a distinct pair $(p', -R)$—often of comparable computational complexity—that generates the exact same $\pi$. The standard example is a planner that systematically selects the action *least* likely to maximize a given reward. If behavior is the only evidence we have, and simplicity priors cannot break the symmetry between a "rational" planner pursuing $R$ and an "anti-rational" planner pursuing $-R$, then the inference to a unique reward function appears mathematically impossible.

  The deflationary conclusion drawn by many in our interdisciplinary circle is that there is no further fact of the matter about what an agent "really" wants. On this view, preferences are not internal states waiting to be discovered but are merely instrumental posits imposed by an interpreter to make sense of behavior—a Dennettian stance where the "stance" itself constitutes the reality.

  I intend to argue that this deflationary move is a non sequitur. It conflates an epistemic limitation on *behavioral inference* with an ontological claim about the *non-existence of mental states*. By leveraging W.V.O. Quine's distinction between the underdetermination of theory by evidence and the indeterminacy of translation, and by re-conceptualizing the "planner" not as a logical bridge but as a causal mechanism, we can defend a robust realism about preferences. The A&M result does not prove that preferences are unreal; it proves that preferences are not *behavioral dispositions*.

  **2. Underdetermination vs. Indeterminacy**

  To diagnose the error in the deflationary reading, we must return to Quine. Quine distinguished between two thesis often conflated in these discussions. The first is the **underdetermination of theory by evidence**: the claim that multiple distinct scientific theories can account for all possible observational data. This is an epistemic thesis; it leaves open the possibility that one theory is true and the others false, even if we lack the evidence to distinguish them. The second is the **indeterminacy of translation**: the stronger ontological claim that there is *no fact of the matter* regarding which theory is correct, because meaning (or mental content) is exhausted by behavioral dispositions.

  The deflationary reading of A&M treats the unidentifiability of reward functions as a case of Quinean indeterminacy. It assumes that because $R$ cannot be uniquely recovered from $\pi$ (even with simplicity priors), $R$ does not exist independently of the interpretive scheme.

  However, the structure of the A&M theorem supports only the weaker claim of underdetermination. The theorem shows that *behavioral data alone* is insufficient to identify $R$. It does not show that $R$ is causally inert or ontologically redundant. In physics, we accept that the internal structure of a star is underdetermined by its light spectrum alone; we do not conclude the star has no internal structure. Similarly, the degeneracy of the $(p, R)$ pair relative to $\pi$ indicates that the policy is a lossy compression of the agent's internal architecture, not that the architecture is fictional. To move from "we cannot infer $R$ from $\pi$" to "there is no fact of the matter about $R$" is to commit to a verificationism that most realists have already rejected.

  **3. The Planner as Causal Mechanism, Not Logical Connective**

  The crux of the realist defense lies in the ontological status of the planner, $p$. In the A&M formalism, $p$ is treated as a mathematical function mapping rewards to policies. In this abstract space, the "rational" planner and the "anti-rational" planner are symmetric. But in the physical world, agents are not mathematical functions; they are causal systems with specific architectures.

  Consider a biological agent or a specific artificial neural network. The "planner" corresponds to the specific cognitive or computational processes that transform value representations into motor outputs. A mechanism that maximizes expected utility and a mechanism that minimizes it are not merely different descriptions of the same process; they are physically distinct causal structures. One requires circuitry (or neural pathways) configured to reinforce actions associated with high value; the other requires circuitry configured to reinforce actions associated with low value.

  While both mechanisms *could* produce the same policy $\pi$ given appropriate rewards ($R$ vs $-R$), they cannot *both* be the mechanism actually instantiated in the agent at time $t$. The agent's brain or CPU is in a specific physical state. That physical state realizes one specific algorithm, not a degenerate class of them. Therefore, there is a fact of the matter about which planner $p$ is operating. Once $p$ is fixed by the physical facts, the degeneracy collapses. If we know the agent is running a maximization algorithm, then $R$ is uniquely identified by $\pi$. If we know it is running a minimization algorithm, $-R$ is identified.

  The deflationist argues that we cannot *know* which planner is running from behavior alone. The realist agrees but denies that this ignorance entails ontological indeterminacy. The preference $R$ is a real property of the agent, grounded in the interaction between the agent's goal-representation systems and its planning mechanism. The fact that these are hidden from behavioral view does not make them less real than the internal structure of a black box.

  **4. Licensing the Decomposition Without Circular Rationality**

  The hardest challenge for the realist is to explain how we license one $(p, R)$ decomposition as the "correct" one without simply presupposing the Principle of Charity or normative rationality. If we assume the agent is rational to find the reward, haven't we just begged the question?

  The solution is to distinguish **normative rationality** from **descriptive algorithmic regularity**. The Principle of Charity assumes the agent *ought* to be rational (i.e., optimizing the good). The realist does not need this. The realist needs only to identify the *descriptive* algorithm the agent uses.

  We license a specific planner $p$ not by assuming it is optimal, but by investigating the causal structure of the agent. In AI, this means examining the weights and update rules of the network. In humans, this means relying on cognitive science and neuroscience. For example, if we observe that an agent's choices satisfy the axioms of expected utility theory (transitivity, independence, etc.) to a high degree of approximation, we have empirical warrant to model the planner as an expected utility maximizer. This is not an assumption of Charity; it is an empirical hypothesis about the agent's cognitive architecture, testable against further data (e.g., reaction times, neural activation, or out-of-distribution behavior).

  Once we have empirically fixed $p$ as "the algorithm that attempts to maximize the input signal," the reward $R$ is no longer underdetermined. It is simply the signal that the algorithm is attempting to maximize. If the agent is systematically self-destructive, the realist does not say "the agent is irrational, so we can't know its preferences." The realist says "the agent is maximizing a reward function that correlates with self-destruction." The "anti-rational" planner hypothesis (that the agent is trying to help itself but is fundamentally broken in a way that inverts all choices) is causally less plausible than the hypothesis that the agent is functioning as designed but pursuing a harmful end. The symmetry is broken by the independent empirical plausibility of the planning mechanism, not by a normative assumption about the goodness of the outcome.

  **5. Verdict**

  The Armstrong and Mindermann result is a decisive refutation of **behaviorism**, not of **realism**. It demonstrates that preferences cannot be reduced to policies, even with simplicity priors. But this is exactly what the realist has claimed all along: mental states are internal causal roles, not mere behavioral dispositions.

  To accept the deflationary conclusion is to concede that if a property cannot be uniquely read off from surface behavior, it does not exist. This is an untenable constraint for any naturalistic philosophy of mind. We do not deny the reality of digestion because multiple internal physiological models could explain the same caloric output. We do not deny the reality of software code because multiple source codes could compile to the same binary executable (especially when we have access to the compiler's architecture).

  Therefore, the verdict is this: **Preferences are real, objective properties of agents, grounded in the causal architecture of their planning systems.** The A&M theorem correctly identifies that we cannot access these properties through behavior alone, but this is an epistemic boundary, not an ontological void. The "true" reward function is the one that interacts with the agent's *actual* planning mechanism to produce the observed policy. While we may face practical difficulties in identifying that mechanism without intrusive investigation, the fact that the mechanism exists and is specific breaks the degeneracy. To claim otherwise is to confuse the map (our behavioral models) with the territory (the causal structure of the mind). We must reject the interpretivist retreat and affirm that there is a fact of the matter about what agents want, even if—thanks to Armstrong and Mindermann—we now know precisely how hard it will be to find out.
