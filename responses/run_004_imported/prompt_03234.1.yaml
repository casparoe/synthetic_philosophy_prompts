      *(Drafting thought)*: Make sure the father's speech is grammatical but semantically off. "The blue logic is eating the table." No, too nonsense. "The heavy light is falling." Better.

      *Let's refine the "Crisis".* He says, "The war is over." There is no war. He is a cryptographer from the Cold War era. Is he confused in time? Or does "war" mean "stroke"? If she assumes he is rational, "war" must mean the struggle in his head. But then he says, "We lost." If he believes he lost, is he depressed (belief) or does "lost" mean "won"?
