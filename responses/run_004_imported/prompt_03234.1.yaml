      *Revised Crisis:* He says something about his dead wife. "She is waiting in the kitchen." Elena knows she is dead. If Elena assumes he is rational/charitable, she must interpret "She" as someone else, or "waiting" metaphorically, or "kitchen" as somewhere else. If she assumes he believes his wife is alive, she attributes false belief. Davidson says we maximize agreement. So she must twist the meaning to make him right. But this hurts.

