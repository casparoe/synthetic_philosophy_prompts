      *   *Refining the Crisis:* Davidson's point is about truth conditions. If he says "It is raining" and it's sunny, is he lying, mistaken, or does "raining" mean "sunny"? To interpret, she must assume he's right about the world. So if he says "The fire is cold" while touching a hot stove, she has to decide: Does he feel no heat (belief error)? Or does "cold" mean "hot" (meaning error)?
