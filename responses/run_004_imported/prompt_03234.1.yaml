answer: |-
  The silence in the house was not empty; it was filled with the sound of her father's voice, which was fluent, grammatical, and entirely untethered.

  Elena sat across from him at the oak table, the morning light cutting through the dust motes between them. Arthur held a spoon over his bowl of oatmeal. He looked at her, his eyes clear and focused, the reasoning mind behind them intact despite the stroke. He said, "The gravity is too sweet today."

  Elena paused. This was the work. It was not decryption; her father had spent forty years breaking codes for the government, and people still assumed this was a puzzle with a key hidden in his old files. It was not. There was no key. There was only the triangulation of three points: the sound he made, the world they both occupied, and the web of beliefs she attributed to him.

  If she assumed he meant the oatmeal was sweet, she had to assume he believed gravity was a substance that could be tasted. That made him irrational. To keep him rational—a precondition for understanding him at all—she had to shift the meaning of "gravity."

  "You mean the honey?" Elena asked, reaching for the jar.

  Arthur shook his head, a sharp, precise motion. "The honey is vertical. The gravity is sweet."

  Elena looked out the window. The sky was a heavy, bruised purple, threatening snow. *Gravity.* Pull. Down. *Sweet.* Pleasant? Overwhelming? She watched him lift the spoon. His hand trembled, not from weakness, but from a hesitation, as if the weight of the utensil was unpredictable.

  "The weight," she said. "The weight is too much."

  "The weight is honest," Arthur corrected. "The gravity is sweet."

  She nodded, accepting the translation. In her mental lexicon of Arthur-speak, *gravity* now mapped loosely to *physical burden*, and *sweet* to *deceptive* or perhaps *intense*. But she knew this mapping was fragile. It held only for this context. If he used "gravity" tomorrow regarding a conversation, the map would tear. She was building a bridge while walking on it, assuming every plank held because if she assumed it rotted, she could not take the step.

  This was the charity she owed him. Not kindness, but necessity. To interpret him, she had to assume he was mostly right about the world. If he pointed at a rabbit and said "dog," she had to assume he meant the animal before them, not that he was hallucinating a canine. If she allowed too many errors in his beliefs, the connection severed. He became a madman speaking into the void, and she became a nurse managing symptoms rather than a daughter listening to a father.

  They moved to the living room. Arthur wanted to sit in his wingback chair, the one facing the garden. He stopped before it, hand hovering over the fabric.

  "The green is waiting," he said.

  Elena looked at the chair. It was upholstered in a faded burgundy velvet. She looked at the garden. The lawn was dormant, brown under the frost. There was no green.

  For a second, the charity wavered. The temptation to treat him as a patient surged up. *He is confused. He thinks the chair is green. He is wrong.* To attribute this error was easy. It preserved the ordinary meaning of words. But it cost her his rationality. It meant his grip on reality was slipping, that the stroke had taken not just the words but the mind.

  She forced herself back to the work. If he was right, where was the green?

  She scanned the room. A potted fern in the corner? No, he wasn't looking there. A book spine? No. She looked at the chair again. Burgundy. But next to it, on the side table, sat a lamp with a glass base of sea-glass green. The light was off, but the glass caught the gray morning.

  "The lamp?" she asked.

  "The seat remembers the green," Arthur said. He sat down carefully, avoiding the lamp, but his hand brushed the armrest.

  Elena exhaled. She had saved him from error by twisting the meaning of *is*. The chair wasn't green; it *remembered* green. Perhaps the fabric had once been green? She didn't know the history of the chair. She had to assume he did. She adjusted her manual: *is* could function as *holds the history of*. It was a stretch, but it kept him sane. It kept them in the same world.

  Then came the afternoon, and the break in the weather.

  They were standing by the window. The snow had started, thick and silent. Arthur pressed his palm against the cold pane. He turned to her, his expression urgent, the clarity in his eyes sharpening into something demanding.

  "He is standing in the fire," Arthur said.

  Elena followed his gaze. There was no fire. The fireplace was cold, filled with old ash. There was no one in the room but them. Outside, only the falling snow.

  "Who?" Elena asked. Her voice was tight.

  "The man in the coat," Arthur said. "He is burning."

  Elena felt the floor drop away. This was the precipice. There was no man. There was no fire. To interpret this charitably, she had to find a referent. Was "the man" a bird? A shadow? Was "fire" the cold? If she said, "Yes, he is burning," she was colluding in a hallucination. If she said, "There is no one," she was accusing him of falsehood.

  The principle of charity demanded she maximize agreement. She had to assume he was seeing something real and describing it truly. But there was nothing there. The gap between his utterance and the world was too wide to bridge with metaphor. For the first time in months, the assumption of his rationality fractured. He was not speaking a private language; he was seeing things that did not exist.

  "Dad," she said, her voice hard. "There is no man. There is no fire."

  Arthur didn't blink. He didn't look confused. He looked at her with pity. "You are blind to the heat."

  The anger rose in her, hot and defensive. She wanted to shake him. She wanted to drag him to the fireplace, touch the cold grate, prove the physics of the room. She wanted to declare him unfit, to retreat into the safety of medical management where errors were symptoms, not meanings. If he was wrong, she didn't have to understand him. She only had to manage him.

  But she looked at his hand on the glass. He was not shivering. He was not agitated. He was observing.

  *Assume he is right.* The commandment of the interpreter.

  She looked back out the window. Snow. Gray sky. The reflection in the glass. Her own face, pale. His face, behind her. And beyond the glass, across the street, the neighbor's house. The neighbor had put up new Christmas lights. Red LEDs, blinking in the window of the house across the street. Through the snow, blurred by the glass, they looked like flickering flames. And standing in the neighbor's window, visible for a moment before moving away, was the silhouette of the neighbor, a man in a dark sweater.

  The reflection of the lights superimposed over the man.

  "He is standing in the light," Elena whispered. "The red light."

  Arthur nodded slowly. "The fire is quiet."

  Elena felt the tension leave her shoulders, replaced by a profound exhaustion. She had saved him again. She had constructed a reality where his words were true. *Fire* meant *red light*. *Burning* meant *illuminated*. But she knew this was her construction. Another interpreter might have said he was hallucinating. Another might have said "he" referred to a memory of her brother. There was no fact of the matter that could settle it. There was only the version that allowed them to continue speaking.

  She had made him rational by bending the world until it fit his words.

  "It is quiet," she agreed.

  Arthur turned from the window. "The snow is loud tonight."

  "And the gravity?" she asked, testing the limit, seeing if the map held.

  Arthur smiled, a small, cryptic movement. "The gravity is sleeping."

  He walked back to his chair, the burgundy velvet that remembered the green. Elena stayed by the window. She watched the red lights across the street blink on and off. She knew that tomorrow, "fire" might mean something else. Tomorrow, the charity might require a different sacrifice. There was no final translation, no moment where the code would break and reveal the plain text underneath. There was only the endless, fragile work of assuming he made sense, of weaving a net of meaning strong enough to hold them both, knowing that the net was made entirely of her own guesses.

  She turned off the lamp with the green glass. The room darkened.

  "Goodnight," she said.

  "The day is opening," Arthur replied from the shadows.

  Elena paused in the doorway. She could correct him. She could insist on the sun, on the clock, on the standard usage that governed the rest of the world. Instead, she stepped out into the hall, leaving the dark open.

  "Yes," she said. "It is."

  She closed the door, leaving him in the room where the gravity was sleeping, trusting that within those walls, he was right.
