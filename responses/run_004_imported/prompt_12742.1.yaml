      *   **Point 2: Failure of Dominance.** This is the knockout punch. If Game A pays more than Game B in every possible outcome, A should be preferred. If EUT says "undefined" for both, it cannot register this preference. This violates a fundamental axiom of rationality (Dominance).
      *   **Point 3: The "Undefined" Contagion.** It's not isolated. If you combine Pasadena with a normal gamble, the expectation often becomes undefined again. It infects the whole decision space. It's not a "singular point"; it's a hole in the fabric.
