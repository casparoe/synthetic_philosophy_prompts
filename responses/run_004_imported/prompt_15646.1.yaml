answer: |-
  My coworker Dave was writing a fallback routine for when our `HESPERUS_ID` didn't match the `PHOSPHORUS_ID`.

  I told him to delete it. "They're the same user," I said. "That ID is a rigid designator. It refers to the same entity in every possible world where the database exists."

  Dave pushed back. "But we only *know* they're the same because we ran the migration script last night. It was an empirical discovery. A posteriori. So obviously they could be different."

  "No," I said. "The *discovery* was a posteriori. The *identity* is necessary. You aren't writing error handling for a data drift; you're writing error handling for a logical contradiction. If those IDs diverge, it's not a bug, it's a violation of the laws of metaphysics."

  Dave rubbed his temples. "Fine. But what about the `STANDARD_UNIT` constant? We defined that as the length of the platinum bar in the vault at t-zero. I want to mock that in the test suite."

  "That's different," I said. "That's contingent a priori. You know it by stipulation, not measurement. You can mock the length, but then you aren't testing meters anymore, you're testing 'schmeters'. But with the User ID, if you mock it, you aren't testing the user. You're testing a ghost."

  Dave stared at the screen for a long minute, then closed his laptop.

  "What are you doing?" I asked.

  "I'm going home," he said. "I just realized I can't fix the code. I have to fix the universe."
