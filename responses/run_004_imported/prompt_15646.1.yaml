      *   *Non-Rigid (Flaccid) Designator:* Refers to whatever fits the description in a given world (e.g., "The President of the US", "Current Job Title").
      *   *Necessary A Posteriori:* Identities between rigid designators (Hesperus = Phosphorus) are true in all possible worlds (necessary), but we had to go look and find out (a posteriori).
      *   *Contingent A Priori:* Statements known independently of experience but could have been false (e.g., "Stick S is one meter long at t0" defined by stipulation).

  3.  **Bridge the Context (Coding/Work) with Philosophy:**
      *   *Hardcoded User ID:* `USER_12345`. This is a rigid designator. It points to the same entity regardless of attributes.
      *   *Mutable Lookup:* `employee.job_title`. This is a non-rigid designator. It changes based on the state of the world (the database).
      *   *The Coworker:* Needs to be the foil who confuses the two.
      *   *The Setup:* A debugging session or a code review where identity is questioned.

