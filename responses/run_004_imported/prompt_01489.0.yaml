prompt: |-
  I spent my career in statistical mechanics, and now that I'm retired I've been reading my way into philosophy, with decision theory as a particular fascination. One disagreement I've run into concerns the Kelly criterion — maximize expected log-wealth each period when betting repeatedly. It was originally derived from an information-theoretic growth-rate argument, yet it is mathematically identical to what an expected-utility maximizer with logarithmic utility would choose anyway. Paul Samuelson treated this as deflationary: log utility is just one utility function among many, so the Kelly strategy isn't uniquely rational, merely what an investor with that particular risk preference would do. The "ergodicity economics" literature associated with Ole Peters argues the opposite: for an agent living through one non-ergodic, multiplicative sequence of bets, maximizing expected wealth — an ensemble average over possible worlds that don't exist for that agent — is the wrong quantity altogether, and maximizing time-average growth is mandatory regardless of risk preference. A related idea, sometimes called "geometric rationality," extends this same style of argument well beyond betting, to cases like Nash bargaining. Is there a genuine substantive disagreement here about what rationality requires, or are both camps simply describing the same mathematics through different, equally legitimate framings? I'd appreciate help locating the actual crux, and your view on which side, if either, has the better of the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Query:**
      *   **User Background:** Retired statistical mechanician. This is crucial. They understand ensembles, time averages, ergodicity, phase space, and the mathematical underpinnings of probability. They don't need basic definitions of ergodicity or utility functions. They want a deep, technical, and philosophical dissection.
      *   **Topic:** The Kelly Criterion, Expected Utility Theory (EUT), Ergodicity Economics (Ole Peters), and Geometric Rationality.
      *   **Core Question:** Is there a *substantive* disagreement about rationality, or is it just a framing difference (mathematical equivalence vs. foundational justification)? Which side has the better argument?
      *   **Tone:** Intellectual, respectful, precise, acknowledging their expertise in stat mech.

  2.  **Deconstruct the Debate:**
      *   **The Standard View (Samuelson/Menger/von Neumann-Morgenstern):**
          *   Rationality = Maximizing Expected Utility (EU).
          *   Utility function $U(w)$ represents risk preference.
          *   Log utility ($U(w) = \ln w$) is a specific *preference*, not a law of nature.
          *   Kelly is optimal *if* you have log utility.
          *   Ensemble average (expectation over possible worlds) is the correct normative standard for a single decision under risk.
      *   **The Ergodicity View (Peters/Gell-Mann):**
          *   Rationality = Maximizing Time-Average Growth.
          *   Wealth dynamics are multiplicative ($w_{t+1} = w_t \cdot x_t$).
          *   Ensemble average ($\mathbb{E}[w]$) diverges from Time average ($\langle w \rangle_t$) in non-ergodic systems.
          *   $\mathbb{E}[\ln w]$ corresponds to the time-average growth rate.
          *   Therefore, Log Utility isn't a preference; it's a physical necessity for survival/growth in multiplicative environments.
          *   Risk preference is an illusion caused by using the wrong average.
      *   **Geometric Rationality (Scott Garrabrant/Modular Minds):**
          *   Extends the log/exp structure to bargaining and aggregation.
          *   Focuses on invariance properties (scale invariance, etc.).

  3.  **Identify the Crux (The "Stat Mech" Angle):**
      *   Since the user knows stat mech, the analogy of *Ensemble vs. Time Average* is the key.
      *   In equilibrium stat mech, ergodicity allows swapping them. In non-equilibrium/finance, they diverge.
      *   *Samuelson's Point:* Even if the time average is lower, I might prefer a gamble with a higher ensemble mean if I only play once or if I have a safety net (additive background wealth).
      *   *Peters' Point:* If the process is multiplicative and repeated, the ensemble mean is physically irrelevant to the single trajectory. Bankruptcy is absorbing.
      *   *The Real Disagreement:* It's not about the math (both agree $\mathbb{E}[\ln w]$ maximizes time growth). It's about the *normative status* of the time average. Is rationality defined by what happens to *me* over time (Peters) or by my consistent preferences over lotteries regardless of dynamics (Samuelson)?

  4.  **Evaluate the Arguments (Taking a Stance):**
      *   *Where Peters is right:* In repeated multiplicative settings without replenishment, the ensemble expectation is misleading. The "risk preference" explanation for avoiding ruin is often just a misunderstanding of non-ergodicity. This resonates with stat mech (breaking ergodicity).
      *   *Where Samuelson is right:* Not all decisions are repeated multiplicative bets. Some are one-off. Some have additive structures. Utility theory captures preferences over *outcomes*, not just dynamics. If I have infinite backing (casino vs. gambler), ensemble max might be rational.
      *   *Synthesis:* The disagreement is substantive regarding the *foundations* of utility. Peters claims to derive utility from dynamics (objective). Samuelson claims utility is primitive (subjective).
      *   *My View:* Peters provides a necessary correction for specific dynamical contexts (repeated multiplicative), but fails as a general theory of rationality. Samuelson is more general but often misapplied to non-ergodic contexts. The "Geometric Rationality" extension is interesting but relies on specific axioms that not all accept.

