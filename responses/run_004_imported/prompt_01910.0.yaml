      *   *Option 2: The "Empirical Concept/Exposition" Move.* Kant argues we never grasp the *real essence* of empirical objects. We only have nominal definitions or expositions.
          *   *Argument:* When we say "Water is H2O," we aren't stating a metaphysical necessity about the *thing-in-itself*. We are stating a rule for the synthesis of appearances under the category of substance. The "necessity" Kripke finds is actually a regulative principle of empirical inquiry, not a constitutive modal truth.
