answer: |-
  You aren't missing a hidden piece of text, and your intuition about the Tokyo firebombing is actually one of the most common and potent critiques of Anscombe's position. You have hit on the exact tension that historians and ethicists have debated for decades.

  However, to understand whether she was being inconsistent or if there was a deeper principle at play, you have to look at **how** she argued (her ethical framework) and **why** she argued in 1956 specifically (the political context).

  Here is the breakdown of what you might be missing regarding her actual argument.

  ### 1. Her Argument Was Deontological, Not Utilitarian
  The biggest misunderstanding people have about Anscombe's protest is assuming she was arguing about the *number* of dead. She wasn't.

  Anscombe was a Catholic philosopher deeply influenced by Thomas Aquinas and later Wittgenstein. Her ethical framework was **deontological** (rule-based), not utilitarian (outcome-based).
  *   **Utilitarian view:** "Did the bombs save more lives than they cost by ending the war sooner?"
  *   **Anscombe's view:** "Is it ever morally permissible to intentionally target non-combatants?"

  For Anscombe, the morality of the act depended on the **intent**, not the body count. She argued that "area bombing" (targeting a city to break morale rather than targeting a specific military installation) is intrinsically evil because it involves the *intentional killing of innocents*.

  Therefore, in her view, **the Tokyo firebombing was just as immoral as Hiroshima.** She did not believe Curtis LeMay or the planners of the Tokyo raid were in the clear. In her pamphlet *Mr. Truman's Degree*, she explicitly states that the principle applies to the bombing of German cities as well. She wasn't singling out the *method* (nuclear vs. incendiary) as the sole source of the evil; she was singling out the *principle* of targeting civilians.

  ### 2. Why Truman and Not LeMay?
  If she thought the firebombing was equally wrong, why the specific focus on Truman? This is where your suspicion about "nuclear weapons specifically" holds some water, but perhaps not for the reason you think.

  *   **The Occasion:** Anscombe wasn't holding a trial for WWII war crimes. She was reacting to a specific event: **Oxford University proposing to give Truman an honorary doctorate.** Curtis LeMay was not being honored by Oxford in 1956. Anscombe was a pragmatist; she protested where she could actually vote.
  *   **The Precedent:** In 1956, the Cold War was intensifying. The use of atomic weapons was no longer just a historical event; it was a current policy option. By honoring Truman, Oxford would be signaling that the *principle* of using nuclear weapons against civilian populations was legitimate statecraft. Anscombe was trying to stop the **normalization** of nuclear warfare for the future, not just litigate the past.
  *   **The Commander-in-Chief:** Truman made the political decision to adopt the policy of targeting cities with weapons of mass destruction. LeMay was a general executing orders. Anscombe was interested in the moral responsibility of the sovereign authority who legitimizes the act.

  ### 3. Was She Inconsistent?
  Critics at the time (including many of her colleagues at Oxford) made the exact same argument you did: *If Hiroshima is murder, so was Tokyo. If you honor the principle of total war, you condemn all of Allied leadership, not just Truman.*

  Anscombe's response was essentially: **"Yes, exactly."**

  She was willing to bite the bullet. She argued that the Allied bombing campaign against Germany and Japan was morally indefensible. She didn't let the "Good War" narrative excuse the means. However, she recognized that protesting Truman was the most effective lever she had to pull to establish a moral boundary against *future* nuclear use.

  There is a nuance here, though. Some scholars argue that Anscombe (and many Just War theorists of that era) did view nuclear weapons as **qualitatively different**, even if the death toll was similar to firebombing.
  *   **Indiscriminate Nature:** A B-29 squadron could theoretically aim at a railyard and miss into a field. An atomic bomb in 1945 technology guaranteed the destruction of everything in a radius.
  *   **Radiation:** The lingering death and genetic damage introduced a "poisoning" element that incendiaries did not have, which some ethicists argued violated the laws of war regarding poison.

  Anscombe focused more on the *intent* to kill civilians, but the unique totality of the nuclear weapon made it the sharper wedge for her argument.

  ### 4. The "Murderer" Label
  You mentioned she called him a murderer. This is accurate. She argued that if you intentionally kill innocent people, it is murder, regardless of your uniform or your title.

  > "For men to choose to kill the innocent as a means to their ends is always murder. And murder is one of the worst of human actions."

  Her point was that if Oxford gave Truman the degree, they were saying, "It is okay to murder innocents if you are a head of state and it helps end a war." She wanted Oxford to say, "No. That principle is unacceptable, even for a winner of a world war."

  ### Summary: Are You Missing Something?
  You aren't missing a fact that exonerates her from the Tokyo comparison. **You are correct that the death tolls and the moral logic regarding civilians apply to both.**

  What you might be missing is the **strategic context**:
  1.  **She agreed with you about Tokyo:** She considered the firebombings morally culpable as well.
  2.  **It was about the Future, not the Past:** The protest was about preventing the *legitimization* of nuclear weapons in the Cold War present, not just judging 1945.
  3.  **Opportunity:** Truman was the one walking into Oxford to get a medal. It was a symbolic battle she could actually fight.

  So, was her real objection to nuclear weapons specifically? **Yes, but not because they killed more people.** It was because they represented the ultimate codification of "total war" against civilians, and honoring Truman would remove the moral stigma against using them again. She used Truman as the symbol for the principle she wanted to condemn.

  If you want to read the primary source, it's a very short pamphlet called ***Mr. Truman's Degree*** (1956). It's surprisingly readable and lays out the "intent vs. consequence" argument clearly.
