  **Title:** Vital Matter
  **Philosophical Premise:** Organicism (Van Inwagen)

  The wrench slipped through Elara's fingers. It didn't clatter to the deck; it simply ceased to be a wrench. One moment it was a solid tool, cold steel in her grip. The next, it was a cloud of grey dust, arranged wrench-wise for a microsecond before gravity pulled the particles apart into a loose scatter on the floor.

  Elara didn't scream. She had seen this before. She just sighed, her breath fogging in the air that was currently managing to stay arranged atmosphere-wise.

  "Report," she said to the ship.

  The voice that answered didn't come from a speaker. Speakers were dead matter; they didn't exist, not really. The voice vibrated through the deck plates, which were currently holding together only because the ship's bio-core was pumping ontological glue through the hull's veins.

  *"Structural integrity at forty percent, Elara,"* the ship said. The ship, *The Vitalis*, was alive. It was a massive, genetically engineered leviathan grown in a vat, hollowed out and ridden like a horse. Because it was alive, it was a real object. It had unity. It had a self.

  "The port thruster manifold is dissociating again," Elara said, stepping over the pile of dust that used to be her wrench. "I can't fix it. The parts won't stay together."

  *"The parts are not alive, Elara. They are simples. They have no bond."*

  "That's the problem, isn't it?" Elara wiped grease from her forehead. The grease was dead matter. It smeared across her skin, which was alive, and for a moment she felt a nausea, a violation of the boundary between the Real and the Arranged. "We're trying to build a machine out of ghosts."

  This was the Great Truth, the one the philosophers on Earth had argued about for centuries before the data came back from the Deep Field. Van Inwagen had been right. Composition was restricted. Things only added up to a *One* when there was a life. A person was a thing. A tree was a thing. *The Vitalis* was a thing.

  But a rock? A chair? A starship made of titanium and silicon? Those were just particles pretending to be objects. "Simples arranged ship-wise," the textbooks called it. Usually, the arrangement held. But out here, in the high-ontology radiation of the nebula, the illusion was fraying.

  *"We are approaching the Repair Station,"* *The Vitalis* said.

  Elara felt a shiver run through her legs. The ship felt it too; they were symbiotes, rider and mount. "Is it... is it alive?"

  *"Scanning."* A pause. The ship shuddered, a spasm of pain. *"Negative. It is metal. It is dead."*

  Elara's heart sank. If the Repair Station was dead matter, it didn't exist. It was just a cloud of dust arranged station-wise. They couldn't dock. You can't dock with a cloud.

  "Turn us around," she said.

  *"There is no around, Elara. The nebula is behind us. The only solid thing is us."*

  "Then we're trapped."

  *"We are the only real things in this sector."*

  Elara looked out the viewport. Outside, the stars burned. Stars were plasma, furious and churning. Were they alive? The science was still out, but they seemed to hold together well enough. But the debris field drifting past the window... that was the wreckage of a thousand dead ships. Humanity's old fleet. All of it, just dust now. Ghosts of industry.

  "We need that station," Elara said. "Your bio-core is degrading. You need synthetic supplements. They're in the station."

  *"I cannot touch what is not there."*

  "If you don't try, you die. And if you die, you stop being an object. You become... dust arranged Elara-wise."

  The thought was terrifying. To lose her unity. To become a scattering.

  "Manual override," Elara said. "I'm going out."

  *"Elara, the vacuum—"*

  "The vacuum is just particles. My suit..." She looked at the spacesuit hanging on the wall. It was dead matter. "My suit won't hold. It'll dissociate the second I step out."

  *"Then you will scatter."*

  "Not if I hold onto you." She patted the warm, pulsing wall of the airlock. "I'm alive. You're alive. As long as I'm touching you, we're in contact. Two real objects."

  *"The distance to the station is fifty meters."*

  "I know."

  Elara stripped off her gloves. She needed skin contact. She opened the inner airlock door. The air rushed out, screaming as it expanded, the particles scattering into the void. She held her breath. She didn't need the air; her lungs were part of *her*, and *she* was real. She would hold the oxygen in her blood as long as her life held it.

  She stepped into the void.

  It wasn't cold. Cold was a property of matter. This was nothingness. She was floating in a gap between atoms. Below her, *The Vitalis* groaned, a living sound in the silence. She kept one hand pressed against the hull.

  Above her loomed the Repair Station. It was a giant ring of steel. But as she got closer, she saw the truth. It was flickering. Like a bad hologram. The metal was trying to decide if it wanted to be a ring or just iron ore.

  She reached out with her free hand. She had to grab the station.

  *If I touch it, does it become real?* she wondered. *No. Only life composes.*

  But she had a plan. In her pocket, she carried a canister of bio-seed. Genetically engineered mold. Fast-growing. Aggressive.

  She let go of *The Vitalis*.

  For a second, she was alone. A single point of existence in a sea of non-existence. She felt her own edges blurring. Her fingers felt like they were drifting away from her hand. *I am Elara,* she thought. *I am one thing.* She focused on her unity, the biological imperative that bound her cells into a self.

  She slammed into the station.

  It felt like hitting a cloud. Her hand passed through the outer plating. The metal offered no resistance because it had no will to resist. It was just dust.

  "Grow," she whispered, cracking the canister against the inner framework of the station.

  The bio-seed spilled out. It was alive.

  Instantly, the mold latched onto the metal particles. It didn't care about the metal. It cared about the nutrients in the canister. But as it spread, it wrapped around the steel, binding the particles together with living hyphae.

  The station shuddered.

  The flickering stopped. The dust settled. The metal *became* solid. Not because the metal changed, but because the *life* had claimed it. The station was no longer "simples arranged station-wise." It was now "simples arranged fungus-wise."

  It was an object.

  Elara gasped, her lungs burning. She grabbed a strut that was now thick with pulsing green mold. It held her weight. It was real.

  *"Elara?"* *The Vitalis* called. The connection was faint.

  "I'm here!" she shouted. "Dock! The station is alive now!"

  She watched as *The Vitalis* maneuvered, clamping its own living claws onto the now-solid station. The two organisms locked together. The transfer pumps engaged, feeding the ship the supplements it needed.

  Elara slumped against the strut, the mold cushioning her. She looked at her hand. It was still hers. She was still one thing.

  Below her, the Earth hung in the distance. A blue marble. Was it alive? Gaia hypothesis? She didn't know. But up here, in the dark, she knew the rule.

  If you want to build a future, you can't build it out of dead things. Dead things fall apart. Dead things are lies.

  She patted the mold growing on the station. "Good girl," she whispered.

  She closed her eyes and waited for the airlock to cycle, grateful to be a part, grateful to be a whole, grateful to be alive enough to exist.
