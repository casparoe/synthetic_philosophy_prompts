      *   *Key Concept:* *Vicarious Personhood* or *Held Personhood*. The community acts as the proxy for her relational capacity.
      *   *Avoiding Abandonment:* This keeps the relational core (she is still defined by her place in the web) without making it conditional on her cognitive performance.

