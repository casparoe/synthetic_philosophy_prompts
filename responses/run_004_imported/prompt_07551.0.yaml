answer: |-
  **MEMORANDUM**

  **TO:** Hospital Administration, Medical Executive Committee, Risk Management
  **FROM:** Clinical Ethics Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding Clinical Ethics Consultation Service (CECS) Operational Model

  ### 1. Background and Charge
  For the past fiscal year, the Clinical Ethics Committee has reviewed the operational structure of our Clinical Ethics Consultation Service (CECS). Currently, CECS operates under a *purely facilitative model*, wherein ethicists mediate dialogue between care teams, patients, and surrogates to reach consensus without issuing binding determinations.

  Risk Management and the Division of Critical Care have petitioned for a shift to a *directive model*, citing intractable disputes regarding medical futility and surrogate decision-making that prolong non-beneficial treatment, increase institutional liability, and contribute to significant moral distress among staff. They propose that ethics consultants issue documented recommendations that function as subspecialty orders, requiring implementation regardless of independent persuasion by the care team.

  The Committee was charged with evaluating this proposal, specifically addressing the epistemic and moral objections raised by committee members regarding the nature of ethical expertise.

  ### 2. Analysis of the Epistemic Objection
  The Committee engaged deeply with the objection that shifting to a directive model conflates ethical expertise with medical expertise. As noted in deliberations, cardiologists disagree on ejection fractions only due to measurement error or data gaps; the underlying fact is mind-independent. In contrast, ethicists may disagree on first-order moral principles (e.g., the weight of autonomy vs. beneficence) even with identical facts.

  We accept the premise that **moral compliance without moral understanding is ethically hazardous.** If the care team implements a recommendation solely based on authority, without engaging with the normative reasoning, two risks emerge:
  1.  **Moral Deskilling:** Clinicians may cease to exercise their own moral judgment, treating ethics as a bureaucratic hurdle rather than a dimension of care.
  2.  **Diffusion of Responsibility:** If a directive leads to a harmful outcome, the care team may abdicate accountability ("I was just following the ethics order"), eroding the professional integrity required of licensed providers.

  However, we also recognize that *pure facilitation* has failed in specific, high-conflict contexts. Endless mediation in cases of physiological futility can constitute a harm to the patient (prolonged dying) and the staff (moral injury). Therefore, a mechanism for resolution is required, but it must not treat ethical conclusions as empirical facts.

  ### 3. Committee Decision
  The Committee recommends the adoption of a **Hybrid "Authoritative Recommendation" Model.**

  This model rejects the binary choice between "mere facilitation" and "binding directive." Instead, it establishes a tiered system where CECS retains its facilitative role for standard consultations but escalates to an authoritative recommendation process for defined, intractable cases. This authority is derived not from the *infallibility* of the ethicist, but from the *legitimacy of the process* and the *institutional need for closure*.

  To mitigate the epistemic risks outlined above, this model mandates that moral understanding be documented alongside compliance.

  ### 4. Concrete Policy Provisions

  **A. Trigger Criteria for Authoritative Recommendations**
  CECS may issue an Authoritative Recommendation *only* when the following criteria are met:
  1.  **Intractability:** Standard facilitation has occurred for no less than 72 hours (excluding weekends) without resolution.
  2.  **Case Type:** The dispute concerns (a) Medically Inappropriate Treatment (Futility) or (b) Surrogate Decision-Maker Conflict/Validity.
  3.  **Consensus of Consultants:** The recommendation must be co-signed by at least two certified healthcare ethics consultants (CHC) to mitigate individual bias.

  **B. The "Reasoned Verdict" Requirement**
  To prevent "moral compliance without understanding," an Authoritative Recommendation cannot be a simple directive (e.g., "Extubate"). It must include a **Normative Justification Statement** accessible to the entire care team. This statement must:
  1.  Explicitly map the ethical principles applied (e.g., "We are prioritizing non-maleficence over surrogate autonomy because...").
  2.  Address the primary moral counter-argument raised by the dissenting party (team or family).
  3.  Be written in language accessible to non-ethicists.

  **C. Preservation of Moral Agency (The "Conscience Clause")**
  Recognizing that deference in ethics is not equivalent to deference in empirical science:
  1.  **Implementation:** The care team is expected to implement the recommendation as institutional policy.
  2.  **Conscience Objection:** Any individual provider who believes the Authoritative Recommendation requires them to violate a core moral or professional obligation may file a *Conscience Objection*. This triggers an immediate review by the Ethics Committee Chair and the Chief Medical Officer. The patient will not be abandoned, but the objecting provider may be recused and replaced without prejudice.
      *   *Rationale:* This ensures the team remains morally engaged. They cannot simply "slack" into compliance; they must either endorse the reasoning or formally register dissent.

  **D. Documentation**
  The Electronic Health Record (EHR) will house the Authoritative Recommendation in a dedicated "Ethics" tab. It shall not be formatted as a standard medical order to avoid conflating normative judgment with physiological prescription.

  ### 5. Implementation and Review
  We acknowledge that this model is an institutional experiment in epistemic deference. It assumes that while ethical truth may not be empirical, institutional ethical *process* can carry sufficient weight to warrant action. We must verify that this does not degrade the moral climate of the ICU.

  *   **Education:** All ICU staff and Risk Management personnel will undergo training on the distinction between implementing an ethical directive and understanding the underlying reasoning.
  *   **Metrics:** We will track not only time-to-resolution but also staff moral distress scores (MDS-R) post-implementation.
  *   **Sunset Clause:** This policy shall expire and return to the Committee for re-evaluation on **October 26, 2025**.

  ### 6. Conclusion
  The Committee believes this Hybrid Model respects the epistemic limits of ethical expertise while acknowledging the institutional necessity of resolving harmful stalemates. By requiring explicit reasoning and preserving a pathway for conscience objection, we ensure that clinicians remain moral agents rather than becoming mere instruments of policy. We prioritize a culture where responsibility is shared, not surrendered.

  **Approved by Vote of the Clinical Ethics Committee:** 12 For, 3 Against, 1 Abstention.

  __________________________
  **Chair, Clinical Ethics Committee**
