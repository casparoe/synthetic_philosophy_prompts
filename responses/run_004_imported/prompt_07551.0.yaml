prompt: |-
  I've followed the rationalist blogosphere's long-running argument about epistemic deference -- when it's reasonable to just adopt an expert's conclusion rather than work through the reasoning yourself -- but that debate is almost always about empirical or forecasting claims. I sit on my hospital's ethics committee, which also oversees our clinical ethics consultation service, and we're facing a version of the same question about moral judgment. Currently our consultants only facilitate, helping the care team and family reach their own reasoned resolution rather than handing down a verdict. A proposal backed by risk management and several intensivists tired of weeks-long futility disputes would instead let consultants issue documented 'directive' recommendations, in defined case types such as intractable futility disputes and surrogate conflicts, that the team must implement much as it would a subspecialty consult, whether or not it's independently persuaded by the reasoning. The chief objection isn't procedural but epistemic: consultants disagree with each other about first-order ethical questions the way cardiologists don't disagree about ejection fractions, so a team that merely implements an unpersuasive recommendation arguably achieves moral compliance without moral understanding -- and some members worry this lets everyone's sense of responsibility go slack, since no one in the room actually reasoned their way to the conclusion. Draft the committee's decision memo: recommend adopting the directive model, keeping the facilitative one, or some hybrid, with a concrete policy and a review date, and take that objection seriously on its own terms rather than treating it as mere friction against efficiency.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Context:** Hospital Ethics Committee overseeing Clinical Ethics Consultation Service (CECS).
      *   **The Debate:** Facilitative model (helping parties reach consensus) vs. Directive model (consultants issue binding recommendations like a medical subspecialty).
      *   **Drivers for Change:** Risk management and intensivists want to resolve intractable futility disputes and surrogate conflicts faster (efficiency/certainty).
      *   **Core Objection:** Epistemic/Moral. Unlike cardiology (empirical consensus), ethics lacks consensus on first-order principles. Blindly following a directive leads to "moral compliance without moral understanding" and erodes moral responsibility/agency of the care team.
      *   **Task:** Draft the Committee's Decision Memo.
      *   **Requirements:** Recommend a model (Directive, Facilitative, or Hybrid), create concrete policy, set a review date, and *take the epistemic objection seriously* (don't just dismiss it as friction).

  2.  **Evaluate the Options:**
      *   *Pure Facilitative:* Maintains moral agency but fails to resolve intractable conflicts (the current pain point). Risks "futility drift" where care continues against medical judgment due to lack of resolution mechanism.
      *   *Pure Directive:* Solves the gridlock but validates the epistemic objection. Risks moral deskilling of the team, treats ethics like math (which it isn't), and could lead to moral distress if the team feels coerced into acting against their conscience based on an authority they don't respect.
      *   *Hybrid (The "Escalated Facilitation" or "Recommendation with Accountability" model):* This seems the most robust. It acknowledges the need for resolution (addressing the intensivist/risk concern) but mitigates the epistemic risk by requiring transparency, reasoning, and preserving a right of appeal/conscience. It treats the ethicist not as a moral oracle, but as a procedural and substantive expert whose weight carries authority *because* of the process, not just the title.

  3.  **Address the Epistemic Objection (The Core Challenge):**
      *   The prompt specifically asks to engage with the rationalist/epistemic deference argument.
      *   *Key Insight:* In medicine, we defer to experts because the truth is mind-independent (the ejection fraction *is* 20%). In ethics, the "truth" is often constructed through discourse.
      *   *Solution:* The memo must argue that deference in ethics isn't about *truth* but about *process legitimacy* and *institutional role*. However, to avoid "moral slack," the directive must include the *reasoning* (not just the verdict), and the implementing team must retain a mechanism to register dissent or request review. The "moral understanding" comes from engaging with the *argument*, not necessarily agreeing with the *conclusion*.
      *   *Policy Mechanism:* A "Binding Recommendation with Reasoned Justification and Conscience Clause."

  4.  **Drafting the Memo - Structure:**
      *   **Header:** Standard formal memo format.
      *   **Background:** Briefly state the problem (futility disputes, surrogate conflicts).
      *   **The Question:** Facilitative vs. Directive.
      *   **Analysis of Objections:** Specifically address the epistemic/moral agency concern.
      *   **Decision/Recommendation:** The Hybrid Model.
      *   **Policy Details:** When it applies, what it looks like, safeguards.
      *   **Review Date:** Essential for iterative improvement.

  5.  **Drafting - Section by Section (Iterative refinement):**

      *   *Tone:* Professional, nuanced, ethically rigorous, administrative but not bureaucratic.
      *   *Addressing the Epistemic Point:* I need to use language that shows I understand the "moral compliance without moral understanding" critique. I should explicitly state that we are *not* claiming ethical expertise equals medical expertise in terms of empirical certainty.
      *   *The Hybrid Solution:* Let's call it the "Authoritative Recommendation Model." It's directive but heavily qualified.
      *   *Safeguards:* To counter the "slack responsibility" worry, the care team must sign off acknowledging the reasoning, even if they disagree. Or, better, there is a "Conscience Objection" pathway. If the team feels the directive is morally egregious, they can escalate. This keeps them morally engaged.
      *   *Scope:* Limit it strictly to the cases mentioned (intractable futility, surrogate conflict). Don't let it bleed into routine consent issues.

  6.  **Refining the Argument on Epistemic Deference:**
      *   Why defer? Not because the ethicist is *right* in a Platonic sense, but because the institution needs a decision procedure to function, and the ethicist is the expert in *navigating the normative landscape*.
      *   How to prevent "slack"? By requiring the ethicist to publish the reasoning (the "show your work" rule) and requiring the team to acknowledge the moral weight, not just the order.

  7.  **Final Polish:**
      *   Check against constraints: Did I set a review date? Yes. Concrete policy? Yes. Take the objection seriously? Yes.
      *   Ensure the distinction between "compliance" and "understanding" is addressed in the policy (e.g., mandatory debrief or documentation of reasoning).

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest a pure facilitative model with a time limit.
      *   *Correction:* No, the prompt says intensivists are tired of weeks-long disputes. A time-limited facilitation that defaults to directive is better.
      *   *Initial thought:* Make the directive fully binding.
      *   *Correction:* Too risky for the "moral agency" objection. If a nurse thinks a directive is unethical, they need an out. Let's add a "Conscience Escalation" path.
      *   *Refining the Epistemic Argument:* I need to explicitly mention that ethical expertise is about *coherence* and *process*, not *fact*.

  9.  **Finalizing the Memo Content:** (Mental Outline)
      *   To: Hospital Administration/Board
      *   From: Ethics Committee
      *   Subject: CECS Model Restructuring
      *   Decision: Hybrid "Authoritative Recommendation" Model.
      *   Rationale: Balances need for resolution with moral agency.
      *   Policy: Triggers, Documentation requirements (reasoning must be explicit), Appeal process.
      *   Review: 18 months.

  10. **Writing the text.** (Focusing on the specific language regarding epistemic deference and moral responsibility). *Make sure to sound like an Ethics Committee, not a Law Firm.*

  **(Self-Correction Note):** The prompt asks me to *draft the committee's decision memo*. It implies I am writing *as* the committee. I need to make a definitive choice. The Hybrid model is the only one that survives the epistemic scrutiny while solving the operational problem.

