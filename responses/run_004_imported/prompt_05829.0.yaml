answer: |-
  **DRAFT RESOLUTIONS**
  **Submitted by the Committee on Political Duty**
  **Ontario County Convention of Colored Citizens**
  **Canandaigua, New York**
  **October 14th, 1852**

  **PREAMBLE**

  Whereas, the passage of the Fugitive Slave Law of 1850 has reduced every citizen of this State to a potential bondsman-hunter, and has made clear that the Federal Executive is now an open engine of oppression against the colored race; and

  Whereas, for twenty years, the advice of our honored friends in Boston has been to separate ourselves from a Union that tolerates such iniquity, to refuse the ballot as a tainted thing, and to rely solely upon Moral Suasion to cleanse the conscience of the Nation; and

  Whereas, we acknowledge the piety and the courage of those who, refusing to vote, keep their own hands clean of the Government's sins; yet we find that the blood of the fugitive is not less red when spilled by a hand that did not cast a vote, and the chains of the captive are not lighter for the purity of the conscience that watches them bind;

  Therefore, be it resolved, that this Convention does respectfully dissent from the doctrine of Disunion, and does hereby declare its conviction that the Ballot is not a privilege to be spurned, but a weapon to be seized.

  **ARGUMENT**

  **I. On the Nature of the Constitution**
  We hold that the Constitution of the United States, properly construed, contains no grant of power to establish or maintain Slavery. We note that the word "Slave" appears nowhere in that instrument. The terms "other Persons" and "held to Service" are legally ambiguous and must, by the rules of common law, be interpreted in favor of Liberty, not against it. To read Slavery into the text is to assume the very thing that must be proved.

  We further hold that the Preamble declares the object of the Government to be to "secure the Blessings of Liberty to ourselves and our Posterity." If Slavery is a curse, then the Constitution, which promises Blessings, cannot authorize it. If the Government acts to support Slavery, it acts *ultra vires*—beyond its authority—and we are not bound to obey such acts, but we are bound to use the machinery of the Government to correct them.

  **II. On the Charge of Complicity**
  We hear the charge that to vote is to swear an oath to a "Covenant with Death." We answer: To refuse to vote is to surrender the field entirely to the Slave Power.

  The Garrisonian position holds that because the Government is currently corrupted by Slaveholders, we must wash our hands of it. But we ask: If a house is occupied by thieves, is it righteousness to burn the house down with the captives inside? Or is it the duty of the free to enter the house, by legal right, and cast the thieves out?

  We acknowledge the danger. To vote is to risk complicity in a flawed system. But to abstain is to guarantee the triumph of that system. We prefer to bear the burden of trying to save the Union from within, rather than the burden of abandoning the enslaved to a fate we might have altered.

  **III. On Our Duty**
  We are citizens of New York. We pay taxes. We are subject to laws. To be taxed without representation is tyranny, whether the skin be white or black. We resolve, therefore, to organize a Political Party in this County, distinct from the Whigs and Democrats who are complicit in the Fugitive Law, and to cast our votes for men who pledge to interpret the Constitution as a Charter of Freedom.

  Let it not be said that we were too proud to fight, or too pious to save. Let us go to the polls, not as beggars asking for mercy, but as citizens demanding our rights under a Constitution that, if rightly read, is on our side.

  **RESOLVED:**
  That we will no longer stand aloof from the ballot box.
  That we endorse the principles of the Liberty Party and those Radical Abolitionists who deny the constitutionality of Slavery.
  That we appoint a corresponding secretary to communicate this stance to Mr. Douglass in Rochester and Mr. Smith in Peterboro.

  *Submitted by Aaron O. [Surname], Recording Clerk.*

  ***

  ### Notes for the Scene (Contextualizing the Document)

  **Why this works for your hinge scene:**

  1.  **The Spooner/Douglass Legalism:** Section I captures the specific textual argument Lysander Spooner pioneered and Douglass adopted. It's not just "we want to vote"; it's "the text *allows* us to vote because it never explicitly says 'slave'." This gives your characters something specific to argue about (e.g., a Garrisonian delegate can point to the 3/5ths clause and say, "You know what 'other persons' means, Aaron, don't play the lawyer with us.").
  2.  **The Moral Weight:** Section II addresses the Garrisonian objection honestly. It admits that voting *is* risky morally ("risk complicity"), but argues that *abstaining* is worse. This prevents the Garrisonians in your scene from looking like fools; they are motivated by purity, which Aaron acknowledges.
  3.  **The Local Stakes:** Mentioning New York citizenship is crucial. In 1852, Black men in NY could vote if they owned $250 of property (a requirement white men didn't face). This makes the "citizen" claim fraught and personal for Aaron.
  4.  **The Tone:** It's formal, but there's a tremor of anger underneath ("blood of the fugitive is not less red"). It sounds like a man who has stayed up all night trying to find a legal loophole that will save his friends from kidnappers.

  **Potential Conflict in the Scene:**
  *   **The Old Guard:** An older delegate might argue that the *intent* of the Framers matters more than the text. "They meant slaves when they wrote 'persons,' Aaron. You are lying to yourself to make the pain easier."
  *   **The Risk:** If they vote and lose, they have legitimized a system that still hunts them. The stakes of the vote in the room should feel as high as a battle plan.
