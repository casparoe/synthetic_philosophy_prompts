      *   The roommate is using a *one-shot game* model. In a single interaction with no future consequences, defection (not paying) yields a higher immediate payoff ($120 saved) than cooperation (paying).
      *   This is the classic "Prisoner's Dilemma" or "Hold-Up Problem" logic applied to a specific moment in time (ex-post).
