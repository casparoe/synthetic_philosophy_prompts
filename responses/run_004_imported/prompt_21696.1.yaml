answer: |-
  Your friend is correct to identify the standard philosophical objection to the Dutch Book Argument (DBA): it establishes a pragmatic defect (susceptibility to financial loss), not necessarily an epistemic one (falsehood or misrepresentation). The LessWrong community often treats the DBA as a "foundational myth" because it offers a crisp, decision-theoretic proof that incoherence is *costly*. However, as your friend noted, cost is only irrational if you are forced to play the game.

  Jim Joyce's Accuracy-Dominance Argument (ADA) attempts to fix this by changing the currency from money to truth-likeness. To answer your specific question: **Yes, Joyce's argument does deliver a genuinely epistemic vindication of probabilism that the Dutch Book Argument fails to provide, but it does so by shifting the normative burden from instrumental rationality to the constitutive aims of belief.** It does not merely hide pragmatic assumptions; it replaces them with alethic (truth-related) norms. However, this success comes at the cost of requiring a commitment to *Veritism*—the view that accuracy is the fundamental epistemic virtue.

  Here is a careful comparison of the two arguments, their assumptions, and a defense of why Joyce's approach succeeds where the Dutch Book fails.

  ### 1. The Dutch Book Argument: Pragmatic Inconsistency

  The DBA proceeds in two steps. First, it links credences to actions via a **Bridge Principle**: typically, that your credence $P(A)$ is the price at which you are willing to buy or sell a bet that pays \$1 if $A$ is true and \$0 otherwise. Second, it applies a **Dominance Principle**: if a set of commitments guarantees a loss in every possible world, it is irrational to hold them.

  **The Assumptions:**
  1.  **Operationalism:** Credences *are* (or strictly entail) betting dispositions.
  2.  **Instrumental Rationality:** It is irrational to accept a combination of offers that guarantees a net loss of utility (money).

  **The Gap:**
  The fatal flaw, as your friend noted, is that the DBA proves you *would* lose money *if* you bet. It does not prove you *should* bet. An agent can say, "I acknowledge my credences are incoherent, but I refuse to wager on them." The DBA shows that incoherent credences are *instrumentally* dangerous, but it does not show they are *representationally* flawed. It conflates the map with the territory by focusing on what you can be pumped for, rather than how well your map matches the territory.

  ### 2. Joyce's Accuracy-Dominance Argument: Alethic Inconsistency

  Joyce's argument (1998, refined 2009) bypasses betting entirely. It treats credences as estimates of truth values. If a proposition $A$ is true, its truth value is 1; if false, 0. Your credence $c(A)$ is an estimate of that value.

  **The Assumptions:**
  1.  **Veritism:** The primary epistemic goal of belief is accuracy (minimizing the distance between credence and truth value).
  2.  **Legitimate Scoring Rules:** There exists a class of mathematical functions (like the Brier score) that measure "inaccuracy." To be legitimate, a scoring rule must be **strictly proper** (it expects itself to be the most accurate) and continuous.
  3.  **Alethic Dominance:** If credence function $C^*$ is more accurate than $C$ in every possible world, it is epistemically irrational to hold $C$.

  **The Math:**
  Joyce proves a mathematical theorem: For any incoherent credence function $C$, there exists a coherent credence function $C^*$ such that $C^*$ is strictly more accurate than $C$ in every possible world (relative to any legitimate scoring rule). Conversely, no coherent function is dominated in this way.

  **The Conclusion:**
  Incoherence is not just financially risky; it is *accuracy-dominated*. There is always an alternative set of beliefs that would be closer to the truth, no matter how the world turns out, without requiring you to take any action.

  ### 3. The Critical Comparison: Does Joyce Hide Pragmatics?

  The crucial question you raised is whether Joyce simply relocates the pragmatic assumptions into the choice of scoring rule or the dominance principle. Critics (such as Brian Hedden or certain pragmatists) argue that invoking a "dominance principle" is itself a decision-theoretic move, and choosing a scoring rule is a normative choice that isn't forced by logic alone.

  However, there is a categorical difference between the assumptions of the DBA and the ADA that vindicates Joyce's project.

  **1. The Nature of the "Currency"**
  The DBA relies on *prudential* utility (money, welfare). The ADA relies on *epistemic* utility (accuracy).
  *   **DBA:** "You are irrational because you will lose resources."
  *   **ADA:** "You are irrational because your beliefs are unnecessarily far from the truth."
  Even if both use a dominance structure, the *telos* (goal) is different. Money is external to the belief state; accuracy is internal to it. A belief's job is to represent the world. If I can show that your belief system fails at its own job (representation) regardless of whether you act on it, I have criticized the belief *qua* belief, not the agent *qua* gambler.

  **2. The Bridge Principle**
  The DBA requires a controversial link between *mind* and *action* (Credence $\to$ Betting Price). This is vulnerable to the "I won't bet" objection.
  The ADA requires a link between *mind* and *truth* (Credence $\to$ Accuracy). This is vulnerable to the "Why care about accuracy?" objection.
  But the latter is a much weaker objection. To ask "Why should I care if my beliefs are accurate?" is to step outside the practice of having beliefs altogether. To ask "Why should I care if I lose money?" is merely to opt out of a specific transaction. Veritism is widely considered a **constitutive norm** of belief: you cannot believe $P$ while being indifferent to whether $P$ is true. Therefore, the normative force of ADA rests on the nature of belief itself, whereas DBA rests on the nature of economic exchange.

  **3. The Scoring Rule Objection**
  Critics argue that choosing the Brier score (or any proper scoring rule) is arbitrary. Why not measure accuracy differently?
  Joyce's defense is that he does not rely on *one* rule, but on the *class* of all legitimate (strictly proper) measures. The theorem holds for *any* measure in this class. If you reject all strictly proper scoring rules, you are effectively rejecting the idea that there is *any* coherent way to measure distance from truth that respects the basic intuition that estimating 0.9 for a true proposition is better than estimating 0.1. Rejecting this is not a pragmatic objection; it is a skepticism about truth-likeness itself.

  ### 4. Definite Verdict

  **Joyce's argument succeeds in providing a purely epistemic vindication of probabilism, whereas the Dutch Book Argument does not.**

  The Dutch Book Argument ultimately shows that incoherent agents are *exploitable*. Exploitability is a pragmatic failure. It leaves open the possibility that an incoherent agent is epistemically perfect but simply refuses to monetize their beliefs.

  Joyce's argument shows that incoherent agents are *inaccurate*. Inaccuracy is an epistemic failure. It demonstrates that incoherence entails a representational defect that exists independently of action. Even if the agent sits in a dark room and never bets, their credences are objectively further from the truth than they could be.

  **Does it hide decision-theoretic assumptions?**
  Yes, but not *pragmatic* ones. It uses decision-theoretic *structures* (dominance, utility functions) applied to *epistemic* goods. This is not a bug; it is a feature. Epistemic rationality *is* a form of optimization (optimizing for truth). The charge that this "relocates" assumptions only holds if one thinks decision theory is inherently pragmatic. But if we accept that beliefs have a goal (truth), then norms governing how to achieve that goal (dominance) are epistemic norms.

  **The Caveat:**
  Joyce's argument is not a "free lunch." It requires you to accept **Veritism**. If you believe the goal of belief is something else (e.g., explanatory power, comfort, or social cohesion), the accuracy argument loses its normative bite. However, within the domain of *epistemic* rationality (which is concerned with truth and evidence), Veritism is the standard baseline. The DBA fails even within that baseline because money is not truth. The ADA succeeds because accuracy *is* the epistemic metric.

  ### Summary

  Your friend is right that the DBA is contested as a foundation for *epistemic* rationality because it conflates belief with betting. Joyce's Accuracy-Dominance Argument repairs this foundation. While it relies on normative assumptions (that accuracy matters and dominance is irrational), these assumptions are constitutive of the epistemic domain, whereas the DBA's assumptions are contingent on instrumental engagement with the world.

  Therefore, **Joyce's argument delivers the epistemic vindication that the Dutch Book Argument lacks.** It shows that probabilism is a requirement of representing the world accurately, not merely a requirement of avoiding financial pumps. For a community like LessWrong, which values "map-territory correspondence," the Accuracy-Dominance argument is the superior foundational myth, as it directly addresses the quality of the map rather than the cost of holding it.
