answer: |-
  Good morning, everyone. To kick things off, I tried to invite a causal decision theorist to this seminar who is currently facing the Death in Damascus case.

  Now, if this were just a spookier version of Newcomb's Problem, he would have sent a calendar invite for either Damascus or Aleppo.

  Instead, he sent me an animated GIF.

  He said, "I can't send a static invite. Under CDT, neither act is ratifiable. Every time I condition on my decision, the expected utilities invert. I haven't reached deliberative equilibrium yet. I'm currently oscillating in the hallway."

  So, if you hear a suitcase thumping against the door, don't let him in. He's just trying to find a fixed point.
