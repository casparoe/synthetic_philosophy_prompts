answer: |-
  The stamp sat on the blotter, a heavy circle of brass and rubber, cold even through the sleeve of his cardigan. Outside, the city was a smear of sodium orange against the rain-streaked glass of the forty-second floor. Elias did not look at the window. He looked at the calculation sheet.

  Column F, Row 14: Load Bearing Capacity.
  Column F, Row 15: Projected Stress.

  The numbers were close. That was the problem. They were close enough that a different engineer, a more cautious one, or perhaps a more reckless one, could read them differently. The concrete mix from the supplier had varied by 0.4 percent from the spec. It was negligible. It was critical. It was within the margin of error. It was outside the margin of safety.

  Elias picked up his pen. The weight of it was familiar, a extension of the hand that had drawn the initial schematics three years ago. He told himself he was tired. The fatigue was a fact, a physical limitation like the tensile strength of the rebar. Because he was tired, the numbers looked worse than they were. Because he was tired, he might be over-correcting.

  It was not that he decided to adjust the variable. The variable required adjustment. The standard coefficient for seismic activity in this zone was a conservative estimate, designed for a city that no longer existed. This city was denser, heavier, but also newer. To apply the old coefficient would be to deny the reality of the new construction methods. It would be dishonest to the project to use a number that didn't fit the truth of the materials.

  He wrote the new number. It sat on the page, black ink, permanent.

  For a moment, the room tilted. There was a sensation in his chest, a hollowing out, as if the floor beneath the desk had dissolved. This was the anxiety. It was the recognition that the number on the page was not a discovery; it was a command. He had not found the safety of the building; he had bestowed it. If the building fell, it would not be because the math was wrong. It would be because this number was wrong.

  He pushed the feeling away. It was just indigestion. The coffee in his mug had gone cold and acidic.

  He was not choosing to ignore the risk. He was choosing to trust the engineering. He was a professional. His role was to facilitate the city's growth, not to strangle it with impossible standards. If he rejected the pour, the timeline slipped six months. The school year would start without a gymnasium. The children would play in the mud. The budget would bleed, and other projects would be cut. There was a moral weight to delay, just as there was to risk.

  He was balancing the weights. That was his job. To balance.

  The pen hovered over the signature line. *Elias Thorne, P.E.*

  If he signed, he became the guarantor. The signature transformed him from a man who calculated into a thing that certified. It was a change in ontology. Once the ink dried, he was no longer the consciousness that weighed the options; he was the seal on the document. The responsibility would belong to the signature, to the license, to the firm. He would be an instrument of the code.

  But the code did not sign. He did.

  He remembered the supplier, a man with damp hands who had met him in the parking lot two weeks ago. "It's a variance," the man had said. "Everyone does it. The code is a floor, not a ceiling." Elias had not replied. He had nodded. The nod was not an agreement. It was an acknowledgment of the social reality. To refuse the variance was to make oneself an enemy of the workflow. It was to be difficult.

  Was he signing to protect the children, or to protect himself from being difficult?

  The question arose, clear and sharp, and then dissolved into the hum of the HVAC system. He did not answer it. To answer it would require him to be one thing or the other: a guardian or a coward. He was neither. He was the engineer. The engineer signs when the math holds. The math held. He had made it hold. Therefore, it held.

  He pressed the pen down. The friction of the nib on the paper was loud in the quiet office. *Elias Thorne.*

  He reached for the stamp. He pressed it into the red ink pad. The smell of the ink was chemical, sharp, like blood that had dried on concrete. He aligned the circle over his name. He pushed down with his palm. He felt the resistance of the desk, the give of the blotter.

  When he lifted the stamp, the red circle was perfect. *Licensed Professional Engineer. State of New York.*

  The document was now a fact. It existed in the world independent of him. It was a piece of facticity. It claimed that the building was safe. Elias looked at it. He knew that the building was safe. He knew that the building might not be safe. He held both truths in his mind without letting them touch.

  If he believed fully in the safety, he was a fool.
  If he believed fully in the risk, he was a criminal.
  He was neither. He was a professional who had followed procedure.

  He capped the pen. He placed it in the holder, parallel to the edge of the desk. He stood up. His knees popped. He was fifty-four years old. His body was aging, becoming more object-like every day. Soon he would be retired. Soon he would be dead. These things were inevitable.

  He walked to the door. He turned off the light. The office vanished into the grey gloom of the city lights.

  In the elevator, he checked his phone. A message from his wife: *Home soon?*
  He typed: *Leaving now.*

  He did not think about the school. To think about the school would be to reopen the calculation. The calculation was closed. The document was filed. The future was a series of probabilities, and he had done what was necessary to collapse the wave function into a single, buildable reality.

  He stepped out into the lobby. The security guard nodded. "Night, Mr. Thorne."
  "Night, David."

  He walked to his car. It started on the first turn of the key. The engine hummed, a machine obeying its design. He drove onto the highway. The traffic was light. He merged into the lane without signaling, checking the mirror, judging the gap. It was a small risk. The car behind him slowed. He did not notice.

  He was driving home. He was a driver. The road was there. The brakes worked. If they didn't, they didn't. He would deal with it then.

  As he waited at a red light, he looked at his hands on the wheel. They were steady. They were the hands of a man who had done his duty. They were the hands of a man who had gambled with lives.

  The light turned green. He pressed the accelerator. The car moved forward. He did not choose to move; the light had changed. The traffic moved. He moved with it. He was part of the flow.

  When he arrived home, he hung his coat on the rack. He went to the kitchen and poured a glass of water. He drank it standing up. He felt the water go down his throat. It quenched his thirst.

  He went to the bedroom. His wife was reading. She looked up. "Long day?"
  "The usual," Elias said. "Paperwork."

  He took off his watch and placed it on the nightstand. The face was dark. The hands had stopped moving. He got into bed. He lay on his back and looked at the ceiling. The shadows from the streetlights outside shifted across the plaster.

  He closed his eyes. He waited for sleep. Sleep was a cessation of consciousness. In sleep, there was no responsibility. In sleep, there was no freedom. He was just a body resting.

  He drifted toward it. He was not hiding from anything. There was nothing to hide. He was simply tired. The numbers had been correct. The signature was valid. The building would stand.

  If it fell, it would be an accident.
  If it stood, it would be a success.

  He breathed in. He breathed out. The rhythm was automatic. He did not have to tell his lungs to work. He did not have to tell his heart to beat. He was a machine, and he was a man, and he was neither, and he slept.
