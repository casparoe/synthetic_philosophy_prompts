prompt: |-
  So me and my sister just inherited our uncle's little woodworking shop and we're trying to figure out how to split the profits going forward if we keep running it together. Here's the messy part - she's way more connected in the local contractor scene, so if she walked away and started her own shop tommorow she could probably pull in like $80k a year easy just off his old client list. I don't have those connections so if I went solo I'd maybe scrape together $20k. But if we actually run the shop together and it does well, we're looking at something like $150k combined, and there's no obvious "fair" formula for splitting that. She thinks since her walk-away number is so much higher she should just get proportionally more of everything, like 4x what I get. That feels off to me but I can't fully articulate why - it's not like we're doing 4x the work difference, and if I just say "well let's do 50/50 since we're both stuck running this together" that feels like it's ignoring the fact that she genuinely does bring more to the table and has better options elsewhere.

  I've been chewing on this for weeks and keep going in circles between "equal split" and "split by outside options" without landing anywhere that feels right. Is there some other way to think about carving this up that actually accounts for both what we'd each get if everything broke our way ideally, and what we'd get if we just walked away from each other? Would love some help thinking through what a genuinely fair arrangement would look like here.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Assets:** Inherited woodworking shop (jointly owned).
      *   **Parties:** User (Sibling A) and Sister (Sibling B).
      *   **BATNA (Best Alternative to a Negotiated Agreement) / Walk-away value:**
          *   Sister: $80k/year (strong connections).
          *   User: $20k/year (weak connections).
      *   **Cooperative Value (ZOPA - Zone of Possible Agreement):** $150k/year combined profit if they work together.
      *   **The Conflict:** Sister wants a split proportional to their walk-away values (4:1 ratio, or 80% to her, 20% to User). User feels this is unfair because work effort is likely similar, but acknowledges Sister brings more value (connections). User is stuck between 50/50 and 80/20.
      *   **Goal:** Find a "fair" profit-splitting arrangement that accounts for both individual contributions/options and the joint effort.

  2.  **Deconstruct the Economic Logic (Game Theory/Nash Bargaining):**
      *   *Total Surplus:* If they split 50/50 ($75k each), the Sister loses $5k compared to going solo ($80k). She has no incentive to partner.
      *   *If they split by BATNA (80/20):* Sister gets $120k, User gets $30k. User gains $10k over solo ($20k). Sister gains $40k over solo ($80k). This creates a huge imbalance in *gains from trade*.
      *   *The "Fair" Economic Solution:* Split the *surplus* equally, not the *total revenue*.
      *   *Calculation:*
          *   Total Pie: $150k.
          *   Reservation Values (Walk-away): $80k (Sister) + $20k (User) = $100k.
          *   Surplus (Value created by partnering): $150k - $100k = $50k.
          *   Fair Split of Surplus: $25k each.
          *   Final Payout:
              *   Sister: $80k (base) + $25k (surplus) = $105k.
              *   User: $20k (base) + $25k (surplus) = $45k.
      *   *Ratio:* roughly 70/30.

  3.  **Evaluate the "Fairness" Perception:**
      *   The User feels 80/20 is wrong because work effort is similar.
      *   The Sister feels 50/50 is wrong because her market value is higher.
      *   *Key Insight:* The shop is a *joint asset*. The inheritance gives the User leverage they wouldn't have otherwise. Without the inheritance, the User couldn't command $45k. The Sister's connections are hers, but the *shop* is theirs.
      *   *Risk:* If the split is too skewed towards the Sister, the User might resent the work or quit, collapsing the partnership. If too skewed to the User, the Sister might leave to go solo.

  4.  **Develop Alternative Frameworks:**
      *   **Framework 1: The Nash Bargaining Solution (Surplus Split).** As calculated above. This is the most mathematically "fair" economic approach.
      *   **Framework 2: Salary + Profit Share.** Pay market rate for labor (if distinguishable), then split remaining profit based on ownership/equity.
      *   **Framework 3: Buyout.** One buys the other out. (Maybe not what they want, but an option).
      *   **Framework 4: Time-based Vesting.** Start with one split, adjust as contributions change.

  5.  **Drafting the Advice:**
      *   *Validate the User:* Acknowledge that their gut feeling (80/20 feels wrong) is correct from a partnership perspective, but also acknowledge the Sister's point (50/50 ignores her leverage).
      *   *Introduce the "Surplus" Concept:* This is the core intellectual tool they need. Explain that the $50k *extra* money created by working together is what should be split, not the whole $150k.
      *   *Do the Math:* Show the 70/30 split example clearly.
      *   *Address the "Work" Aspect:* If the User is doing 50% of the labor, a pure economic split might feel like underpayment for labor. Suggest separating "Labor Pay" from "Owner Profit."
      *   *Consider the Inheritance:* Remind the User that their 50% ownership of the *assets* (the shop itself) is a lever. The Sister needs the shop to maximize her value too (presumably, or she'd just go solo).
      *   *Non-Monetary Factors:* Stress, management, growth.
      *   *Recommendation:* Propose a hybrid model (Market Salary + Equal Profit Split) or the Surplus Split.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but analytical.
      *   Avoid taking sides.
      *   Focus on preserving the relationship (siblings) and the business.
      *   Use clear headings.

  7.  **Self-Correction/Edge Case Check:**
      *   *Wait, does the Sister actually need the shop to make $80k?* The prompt says "if she walked away and started her own shop." This implies she needs *a* shop. Does she need *this* shop? If she inherits 50%, she can sell her half or use the equipment. If she leaves, does she take equipment? Usually, inherited business means joint ownership of assets. If she leaves, she might have to buy the User out or sell her share. This complicates the BATNA.
      *   *Correction:* If she goes solo, she likely has to buy the User's half of the shop assets or rent space elsewhere. If she rents elsewhere, her $80k might drop due to overhead. If she buys the User out, that's a different negotiation.
      *   *Assumption for advice:* Assume the $80k figure is her realistic net income elsewhere *including* setup costs, or that the $150k joint figure relies on *both* being there.
      *   *Crucial Point:* The User owns 50% of the *capital*. The Sister owns 50% of the *capital*. The connections are *human capital*. The negotiation is Human Capital + Financial Capital.
      *   *Revised Advice:* Emphasize that the User's 50% ownership of the physical shop is a bargaining chip. The Sister can't just take the client list and the machines without compensating the User for the machines/shop.

  8.  **Final Structure:**
      *   Introduction: Validate the dilemma.
      *   Concept 1: The "Surplus" (Nash Bargaining).
      *   Concept 2: Labor vs. Ownership (Salary + Dividend).
      *   Concept 3: The Asset Leverage (Inheritance aspect).
      *   Practical Proposal: A concrete formula to offer.
      *   Relationship Advice: Keep it written down, review periodically.

  9.  (Self-Correction during drafting): Make sure to explicitly mention that 80/20 creates resentment and 50/50 creates exit incentive. The middle ground is the goal.

  10. **Final Polish:** Check clarity and tone. (Looks good. The "Surplus Split" is the strongest argument.)
answer: |-
  This is a classic negotiation dilemma that sits right at the intersection of family dynamics, business equity, and game theory. Your gut is telling you that a 4:1 split feels wrong, but your logic is telling you that 50:50 ignores reality.

  The reason you're going in circles is that you are trying to split the **Total Revenue**, when you should actually be splitting the **Cooperative Surplus**.

  Here is a framework to help you articulate a fair arrangement to your sister, moving beyond "equal split" vs. "market value split."

  ### 1. The Economic Reality: Splitting the Surplus
  In negotiation theory (specifically the Nash Bargaining Solution), fairness isn't about splitting the final pot. It's about splitting the *value created by working together.*

  Here is the math based on your numbers:
  *   **Sister's Walk-Away (BATNA):** $80k
  *   **Your Walk-Away (BATNA):** $20k
  *   **Combined Walk-Away:** $100k
  *   **Joint Venture Value:** $150k
  *   **The Surplus (Value of Partnership):** $50k

  If you split the total $150k 50/50, your sister gets $75k. She loses $5k compared to going solo. She will eventually leave.
  If you split by market value (80/20), she gets $120k and you get $30k. She gains $40k from the partnership; you only gain $10k. This creates resentment because you are both working hard, but she captures 80% of the *benefit of the partnership*.

  **The Fair Economic Solution:**
  You guarantee each person their walk-away number, and then **split the surplus equally.**
  *   **Sister:** $80k (base) + $25k (half surplus) = **$105k**
  *   **You:** $20k (base) + $25k (half surplus) = **$45k**

  **Why this works:** It acknowledges her connections (she gets her base $80k guaranteed) but acknowledges that the *partnership* is what generates the extra $50k, and since you are both essential to the partnership, you share that gain equally. This results in roughly a **70/30 split**, which is a much healthier middle ground than 80/20.

  ### 2. Distinguish "Labor" from "Equity"
  The friction here is that you are conflating three different things:
  1.  **Ownership of Assets:** You both inherited the shop 50/50.
  2.  **Human Capital:** She has connections; you have labor/skills.
  3.  **Labor Effort:** You implied you are doing similar amounts of work.

  A sophisticated way to handle this is to separate **Salary** from **Profit Distribution**.

  *   **Step 1: Market Salary.** Pay yourselves a market rate for the actual woodworking labor you perform. If the work is identical, this should be equal. Let's say the labor cost is $40k each. That comes off the top.
  *   **Step 2: Return on Connections.** Allocate a specific "business development" bonus or commission. If she brings in clients, she gets a % of that revenue. This directly rewards her connections without dictating the whole profit split.
  *   **Step 3: Owner Profit.** Whatever is left is profit from the *assets* (the inherited shop). Since you inherited the shop 50/50, this remainder should be split 50/50.

  **Why this helps:** It stops her connections from cannibalizing your ownership rights. She gets paid for her connections; you get paid for your ownership.

  ### 3. Your Leverage: The Inheritance
  You mentioned feeling like you should ignore her better options, but you shouldn't ignore your own leverage. **You own half the shop.**

  If she walks away to start her own shop to capture that $80k, she has to leave *your* half of the equipment, lease, and brand behind. She would incur startup costs, new equipment purchases, or have to buy you out. Her "$80k walk-away" might actually be lower once she accounts for the cost of replicating the shop infrastructure you already own together.

  Conversely, if you stay, you are providing her with a fully operational platform to monetize her connections immediately. You are the "silent infrastructure" that allows her "loud network" to work.

  ### 4. A Proposal for Your Sister
  Sitting down to say "I want more" will cause friction. Sitting down to say "I want a structure that keeps us partners for 10 years" is collaborative.

  Here is a script/framework you can propose:

  > "I've been thinking about how to make sure we're both motivated to stay in this long-term. If we split 50/50, you're leaving money on the table compared to your connections. If we split by market rate, I'm just an employee in a business I co-own, and I won't be motivated to grow it.
  >
  > I think we should guarantee you a baseline that respects your client list, but split the *growth* equally.
  >
  > **Option A (Surplus Split):** We ensure you get $80k and I get $20k first. Anything we earn above $100k combined, we split 50/50. This rewards your connections but treats us as equal partners in growing the business.
  >
  > **Option B (Salary + Dividend):** We pay ourselves an equal wage for the hours we put in the shop. Then, we take a percentage of revenue off the top as a 'client origination fee' for you. The remaining profit is split 50/50 because we both own the shop."

  ### 5. The "Sibling Risk" Factor
  There is one variable more important than the money: **Resentment.**

  If you agree to 80/20, you will resent showing up to work every day knowing she makes four times what you make for similar labor. You will eventually quit or sabotage the business (passively).
  If she agrees to 50/50, she will feel she is subsidizing your career and will eventually leave to maximize her earnings.

  **The Verdict:**
  The **Surplus Split (Option A above)** is the cleanest. It results in roughly $105k for her and $45k for you.
  *   It validates her worth ($105k is significantly better than her $80k solo option).
  *   It validates your partnership ($45k is significantly better than your $20k solo option).
  *   It creates equal incentive to grow the pie. Every extra dollar earned above $100k is shared equally, so you are both motivated to work hard.

  **Final Advice:** Whatever you decide, write it down in an operating agreement. Include a "review clause" every 12 months. If your skills improve and your own connections grow, your walk-away number rises, and the split should adjust. Fairness isn't a static number; it's a dynamic agreement.
