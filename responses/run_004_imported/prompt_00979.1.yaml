prompt: |-
  Been building a little algo-betting bot on the side and fell down a rabbit hole on the Kelly criterion. The pitch everywhere is that full Kelly maximizes your long-run growth rate with probability 1, so it's basically mathematical proof that its the objectively rational bet size regardless of your personal risk tolerance (some rationalist blogs even call this 'geometric rationality' and treat it as a strict upgrade over normal expected-value thinking). So why does literally every serious trader/gambler I read about use half-Kelly or less instead of just running full Kelly if it's the mathematically correct answer? Feels like they're all leaving growth on the table for no reason.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is building an algo-betting bot.
      *   **Topic:** Kelly Criterion (KC).
      *   **Premise:** The user believes full Kelly is "objectively rational" and maximizes long-run growth with probability 1 (based on readings from rationalist blogs/math proofs).
      *   **Observation:** Serious traders/gamblers use fractional Kelly (half-Kelly or less).
      *   **Conflict:** Why do practitioners deviate from the "mathematically correct" answer? Are they leaving money on the table?
      *   **Tone:** Skeptical of the practitioners, convinced by the theoretical pitch, looking for an explanation of the discrepancy.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the user's premise correct?* Partially. Full Kelly *does* maximize the expected logarithmic utility (geometric growth rate) over an infinite horizon *if* you know the true probabilities and payoffs exactly.
      *   *Is the conclusion correct?* No. The "objectively rational regardless of risk tolerance" claim is a common misconception. Kelly maximizes *growth*, not *utility* for everyone.
      *   *Why do people use fractional Kelly?*
          1.  **Estimation Error:** We don't know true probabilities. Overestimating edge leads to ruin.
          2.  **Volatility/Drawdown:** Full Kelly is incredibly volatile. 50% drawdowns are common. Most people can't stomach that.
          3.  **Utility Functions:** Log utility (implied by Kelly) isn't everyone's utility function. Many have higher risk aversion.
          4.  **Market Impact/Liquidity:** In trading, betting size affects price.
          5.  **Non-Ergodicity/Finite Horizons:** We don't live forever. Ruin before the "long run" matters.

  3.  **Structure the Response:**
      *   **Validate:** Acknowledge the user's research. They aren't wrong about the *theory*, but they are missing the *practice* constraints.
      *   **The Core Misconception:** Address the "objectively rational" claim. Kelly assumes log utility. If you have different utility, Kelly isn't optimal.
      *   **Key Reason 1: Parameter Uncertainty (The biggest one).** Edge estimation is hard. Overbetting is fatal; underbetting is costly but safe.
      *   **Key Reason 2: Volatility and Drawdowns.** Show the math of variance drain. Full Kelly swings are psychologically and financially unbearable.
      *   **Key Reason 3: Finite Horizons & Ruin.** The "long run" might be longer than your bankroll or career.
      *   **Key Reason 4: Market Realities.** Liquidity, transaction costs, correlation.
      *   **Conclusion:** Fractional Kelly is a robustness adjustment, not a rejection of the math.

