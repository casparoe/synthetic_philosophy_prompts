      *   *Point 1: The "Objective Rationality" Trap.* Kelly maximizes *geometric mean*. This implies a specific utility function (log wealth). If you care about avoiding ruin more than max growth, log utility isn't your function. It's not risk-neutral.
      *   *Point 2: Estimation Error (The Edge).* This is crucial. If you think you have a 55% chance but it's actually 52%, Full Kelly will bankrupt you. Fractional Kelly creates a safety margin against overconfidence. *Analogy:* Driving 10mph under the limit.
      *   *Point 3: Volatility.* Full Kelly leads to massive drawdowns. 50% drop is standard. To recover from 50%, you need 100% gain. Most bots/people blow up psychologically or get margin called before the recovery.
      *   *Point 4: Ergodicity.* The "probability 1" argument assumes infinite trials. In reality, we have finite time. If you go bust in year 3, year 100 doesn't matter.
      *   *Point 5: Trading Specifics.* Slippage, fees, correlation between bets. If your bot places correlated bets, Full Kelly on each compounds risk.

