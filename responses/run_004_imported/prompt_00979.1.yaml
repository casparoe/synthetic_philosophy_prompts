answer: |-
  You have stumbled onto one of the most classic tensions in quantitative finance and gambling theory. Your understanding of the theoretical pitch is correct: **Full Kelly does maximize the expected logarithmic growth rate of wealth over an infinite horizon, assuming you know the true probabilities and payoffs exactly.**

  However, the claim that it is "objectively rational regardless of risk tolerance" is where the rationalist blogs often oversimplify. The reason serious practitioners (from Edward Thorp to Renaissance Technologies) use fractional Kelly (half-Kelly, quarter-Kelly, etc.) isn't because they don't understand the math. It's because they understand the **inputs** better than the theorists do.

  Here is why Full Kelly is practically suicidal, and why fractional Kelly is actually the more "mathematically correct" approach in the real world.

  ### 1. The "Garbage In, Garbage Out" Problem (Estimation Error)
  This is the single biggest reason. The Kelly formula requires the **true** edge and the **true** odds.
  $$f^* = \frac{p(b+1) - 1}{b}$$
  In a casino game like Blackjack (counting cards), you can calculate probabilities with high precision. In sports betting or algo-trading, you are dealing with **estimated** probabilities.

  If you overestimate your edge even slightly, Full Kelly becomes **overbetting**.
  *   **Underbetting (Fractional Kelly):** Growth decreases linearly, but risk decreases quadratically. You sacrifice a little return for a massive reduction in variance.
  *   **Overbetting (Full Kelly on inflated edge):** Growth drops precipitously, and variance explodes. If you bet double-Kelly (thinking your edge is bigger than it is), your expected geometric growth rate drops to **zero**. You will eventually go broke.

  Since every algo bot has model risk, look-ahead bias, or regime changes, your "edge" is almost certainly an overestimate. Fractional Kelly acts as a safety margin against your own overconfidence. As the saying goes: *"Half-Kelly is for people who think they know the edge. Quarter-Kelly is for people who know they don't."*

  ### 2. Volatility and Drawdowns
  Full Kelly is incredibly volatile. By definition, maximizing geometric growth means accepting maximum variance along the growth path.
  *   A Full Kelly strategy will experience drawdowns of **50% or more** with high frequency.
  *   To recover from a 50% drawdown, you need a 100% gain.
  *   To recover from a 70% drawdown (which is possible with Full Kelly), you need a 233% gain.

  Most traders and bots do not have infinite bankrolls or infinite patience.
  *   **Margin Calls:** If you are leveraged, a 50% swing triggers liquidation before the "long run" saves you.
  *   **Psychological Ruin:** Humans are not log-utility maximizers by nature. Watching your portfolio halve causes panic, leading to turning the bot off at the bottom.
  *   **Investor Withdrawals:** If you are managing outside money, investors will redeem after a 30% drawdown. You cannot compound if you have no capital.

  Fractional Kelly smooths the equity curve. Half-Kelly delivers roughly 75% of the expected growth of Full Kelly but with only 50% of the volatility. That is a massive efficiency gain in terms of risk-adjusted returns (Sharpe ratio).

  ### 3. The "Long Run" Fallacy (Ergodicity)
  The proof that Kelly maximizes growth "with probability 1" relies on the law of large numbers over an **infinite** sequence of bets.
  *   **Time Horizon:** You will not bet forever. You have a finite career or lifespan.
  *   **Path Dependence:** In non-ergodic systems, the time average does not equal the ensemble average. If you hit a "ruin" barrier (zero bankroll) in year 3, the theoretical growth in year 100 is irrelevant.

  Full Kelly minimizes the time to reach a specific target wealth, but it also minimizes the time to ruin if your edge vanishes. Fractional Kelly extends the survival time of the bot, allowing it to adapt if market conditions change.

  ### 4. Utility Functions Are Not Universal
  The claim that Kelly is "objectively rational regardless of risk tolerance" is false. Kelly implicitly assumes your utility function is **Log(Wealth)**.
  *   If your utility function is linear (risk-neutral), you should bet your entire bankroll on any positive EV bet (until you hit a ceiling).
  *   If your utility function is closer to square root (higher risk aversion), Kelly is too aggressive.

  Most people have a utility function that penalizes ruin much more heavily than Log(Wealth) does. For a professional trader, staying in the game is often more valuable than maximizing the growth rate of a specific run.

  ### 5. Correlation and Market Impact
  In sports betting, events might be independent. In algo-trading, they are not.
  *   **Correlation:** If your bot places 10 bets that are highly correlated (e.g., all long tech stocks), treating them as independent Kelly bets compounds risk. You are effectively levered 10x on the same factor.
  *   **Liquidity:** In markets, your bet size affects the price (slippage). Full Kelly might suggest a position size that exceeds the available liquidity at the expected price, destroying the very edge the calculation was based on.

  ### Summary: It's Not "Leaving Money on the Table"
  You feel like fractional Kelly users are leaving growth on the table. In reality, **Full Kelly users are leaving survival on the table.**

  When you account for parameter uncertainty, the "true" optimal bet size is *always* lower than the Kelly calculated on point estimates. Therefore, using Half-Kelly isn't deviating from the math; it is **applying the math to a more realistic model that includes uncertainty.**

  **Recommendation for your bot:**
  Start with **Quarter-Kelly**. It is robust enough to survive estimation errors and regime changes, volatile enough to show meaningful growth, and psychologically manageable. If your bot survives a year with stable metrics, you can tune it up. But remember: in this game, the winner is the one who is still playing at the end of the year, not the one who had the highest peak equity in month 3.
