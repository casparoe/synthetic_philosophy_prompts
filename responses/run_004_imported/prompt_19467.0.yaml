  Me and my friend got into a whole argument last night about the atomic bomb, and somehow it turned into a deep dive on Anscombe's old pamphlet "Mr. Truman's Degree" - the one she wrote to explain why she voted against Oxford giving Truman an honorary degree. From what I can tell, her actual case against him is basically a numbers argument: tally up the civilian dead from Hiroshima and Nagasaki against the deaths a land invasion of Japan would've caused, and the bombs come out worse, so calling him a murderer is really just following the utilitarian math to where it points. My friend says I'm misreading her but couldnt tell me why. Can you settle it for us - am I getting her argument right?
