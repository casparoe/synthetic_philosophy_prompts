answer: |-
  Your friend is right, and you are misreading her. In fact, you have identified the exact argument Anscombe was **arguing against**, not the one she was making.

  Attributing a "numbers argument" (utilitarian calculus) to G.E.M. Anscombe is one of the biggest ironies in 20th-century philosophy, because she was one of the fiercest critics of utilitarianism and consequentialist ethics.

  Here is the breakdown of why your interpretation is incorrect and what her actual argument was.

  ### 1. Anscombe Rejects the "Numbers Game"
  Your interpretation suggests Anscombe compared the death toll of the atomic bombs against the projected death toll of a land invasion (Operation Downfall), concluded the bombs caused more suffering or death, and therefore labeled Truman a murderer.

  That is a **consequentialist** argument. It says an act is right or wrong based on its *outcome*.

  Anscombe's argument was **deontological** (based on rules/duty) and rooted in **Natural Law**. She argued that the morality of an act is determined by the *nature of the act itself*, not the consequences. For Anscombe, the intentional killing of innocents is intrinsically evil. It is forbidden regardless of how many lives it might save.

  In the pamphlet, she explicitly anticipates the argument you described—the idea that the bombs were justified because they prevented a costly invasion. She dismisses this entirely. To her, the fact that the bombing might have shortened the war or saved American (or even Japanese) lives in the long run is morally irrelevant to the question of whether the act was murder.

  ### 2. The Core Argument: Intention vs. Foreseeability
  Anscombe's philosophical specialty was the nature of **intention**. Her argument against Truman rests on the distinction between *intended* consequences and *foreseen but unintended* side effects (often discussed under the Doctrine of Double Effect).

  *   **Collateral Damage:** If you bomb a military factory and civilians nearby die as an unfortunate, unintended side effect, Anscombe might argue this is tragic but not necessarily murder.
  *   **Truman's Decision:** Anscombe argued that the atomic bombs were not dropped on military targets with civilian casualties as a side effect. They were dropped *on cities* with the specific intention of killing civilians and destroying morale to force a surrender.

  Because the death of innocents was the *means* to the end (ending the war), rather than an accidental byproduct, she classified the act as murder. She argued that Truman adopted a policy of "killing innocents as a means to victory," which violates absolute moral prohibitions.

  ### 3. "Murder" is a Moral Category, Not a Statistical One
  When Anscombe called Truman a murderer, she wasn't using the word to mean "someone who caused a high number of deaths." She was using it as a specific moral classification.

  In her view, you can be a "murderer" even if your actions save lives overall. If you kill an innocent person to harvest their organs and save five patients, a utilitarian might say you did the math right (5 saved > 1 lost). Anscombe would say you committed murder, because you intentionally killed an innocent person.

  She applied this same logic to Truman. Even if a land invasion would have cost 1 million lives and the bomb cost 200,000, Truman is still a "murderer" in her framework because he chose a method that required the intentional slaughter of non-combatants.

  ### 4. Why the Confusion Happens
  It is easy to see why you read it that way. The debate surrounding the atomic bomb is almost *always* framed as a utilitarian calculation (Bomb deaths vs. Invasion deaths). Most historians and commentators argue on those terms.

  It is natural to assume Anscombe was entering that same debate and just picking a different side of the math. But her entire point was to reject the terms of the debate. She was offended that Oxford would honor a man who, in her view, had adopted the principle that "the end justifies the means," specifically when the means involved the mass killing of innocents.

  ### Summary
  *   **Your reading:** Anscombe argued the bombs were worse because the body count was higher than an invasion would have been. (Utilitarian)
  *   **Actual reading:** Anscombe argued the bombs were murder because they involved the intentional killing of innocents, regardless of whether an invasion would have been worse. (Deontological/Natural Law)

  Your friend is correct. Anscombe's pamphlet is famous precisely because she refused to do the math your description suggests she did. She argued that some things are simply forbidden, even to save the world.

  **Verdict:** You owe your friend a drink. Anscombe would have hated your interpretation of her work.
