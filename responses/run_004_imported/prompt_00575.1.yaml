answer: |-
  You have grasped the Non-Identity Problem perfectly. Your intuition is exactly what makes it such a famous and troubling philosophical puzzle.

  To answer your specific question: **No, that is absolutely not the accepted conclusion.**

  In fact, almost no philosopher accepts the conclusion that we have "zero obligations" to future generations. If a moral theory implies that we can recklessly deplete the earth or cause nuclear waste leaks as long as we change *who* gets born, most philosophers say that is a sign that **the moral theory is broken, not that our intuitions are wrong.**

  Here is the breakdown of why philosophers reject the "zero obligations" conclusion and how they try to solve it.

  ### 1. Parfit's Goal Was to Break Our Theories, Not Excuse Us
  Derek Parfit didn't propose the Non-Identity Problem to let us off the hook for climate change. He proposed it to show that our standard ways of thinking about morality (specifically the **"Person-Affecting View"**) are flawed.

  The Person-Affecting View says: *An act is wrong only if it makes some particular person worse off.*
  Parfit showed that in cases involving future people, this view leads to absurd results (like the one you identified). His goal was to push philosophers to find a **"Theory X"**—a new moral framework that explains *why* it is wrong to harm future generations even if it doesn't make specific individuals worse off than they would otherwise have been.

  ### 2. Major Ways Philosophers "Solve" It
  Since almost everyone agrees we *do* have obligations to the future, philosophers have developed several workarounds to avoid the "zero obligations" conclusion:

  **A. The Impersonal Principle (Comparing Worlds, Not People)**
  Instead of asking "Is Person A worse off?", we ask "Is World A worse than World B?"
  Even if the people in World A (polluted) are different from the people in World B (clean), World B is still objectively better because it contains more well-being. We have an obligation to create the better state of affairs, regardless of who inhabits it.

  **B. Rights-Based Approaches**
  Some argue that future people have rights to certain minimum conditions (clean air, stable climate), regardless of how they were conceived.
  *   **Analogy:** If a parent conceives a child specifically to use their organs for a transplant, the child owes their existence to that decision. But we would still say the parents violated the child's rights.
  *   Applied to climate change: We might violate the *rights* of future people to a habitable planet, even if our policies were the necessary condition for their existence.

  **C. The "Wronging" vs. "Harming" Distinction**
  Recent philosophy distinguishes between *harming* someone (making them worse off) and *wronging* someone (treating them unfairly).
  You can wrong someone without harming them comparatively. If I make a reckless decision that results in you being born with a painful disability (when I could have acted differently and you wouldn't have been born at all), I haven't "harmed" you (you're still better off existing), but I have **wronged** you by failing to respect your moral status.

  **D. Threshold Views (Wrongful Life)**
  Some philosophers argue the Non-Identity Problem only works if the future life is still "worth living."
  If climate change becomes so catastrophic that future lives are filled with net suffering (lives not worth living), then bringing them into existence *is* a harm. In this view, we have an obligation to ensure the future doesn't cross that threshold.

  ### 3. Does this apply to Climate Change?
  Your climate change example is the classic real-world application. Here is why the Non-Identity Problem doesn't save polluters:

  1.  **Identity-Preserving Harm:** Climate change won't *just* change who is born; it will also kill people who would otherwise exist. Floods, famines, and wars caused by climate instability will kill specific future people. That is straightforward harm.
  2.  **Collective Harm:** Even if specific individuals aren't harmed comparatively, we are harming the *generation* as a collective entity.
  3.  **Stewardship Duties:** Many argue we have a duty to the *project* of humanity or the biosphere, not just to specific individuals.

  ### 4. What is the Consensus?
  There is **no consensus on the solution**, but there is a very strong consensus on the **outcome**.

  *   **Consensus:** The conclusion that "we have no obligations to future people" is false. It is a *reductio ad absurdum* (a proof that the premise is wrong).
  *   **Debate:** Philosophers are still fighting over *which* of the solutions above (Impersonal, Rights, Wronging, etc.) is the correct way to explain *why* it's false.

  ### Summary
  You hit on exactly why the Non-Identity Problem is so disturbing. It logically seems to prove we can't wrong the future. But because that conclusion is morally repugnant, philosophers treat it as a bug in our ethical software, not a feature of reality.

  Parfit's message wasn't "Don't worry about the future." His message was: **"Our current moral math is broken, and we need to fix it so we can properly account for our duties to the future."**
