      *   **Nozick in TEL:** He expresses dissatisfaction. He wonders if the "separate peace" between utilitarianism and rights is stable. He suggests animals might have *some* inviolability, not just aggregate weight.
      *   **The Utility Monster Objection:** In ASU, Nozick uses the Utility Monster to critique utilitarianism (a being who gets huge utility from resources shouldn't be allowed to starve everyone else). If we apply utilitarianism to animals but rights to humans, do humans become the "Utility Monsters" relative to animals? Can we sacrifice infinite animal suffering for trivial human gain?

