answer: |-
  The silence of Outpost 9 wasn't empty; it was heavy. It pressed against the hull, a physical weight of vacuum and distance. Inside, the only sound was the cooling hum of the Array, a server rack the size of a cathedral that smelled of ozone and recycled dust.

  Elara sat before the main terminal, her finger hovering over the haptic interface. On the screen, a progress bar waited at zero. *Allocation Protocol: Final Confirmation.*

  "You're doing it again," Kael said from the doorway. He was holding two mugs of synthetic coffee, steam curling in the low gravity. He set one down on her console, next to the keyboard. "Staring at the math like it's going to change if you blink."

  "It won't change," Elara said. She didn't look up. "The probability distribution is stable. The correlation coefficient is high enough."

  "High enough to do what, Elara? To who?" Kael leaned against the doorframe, crossing his arms. He was the mission's ethicist, a job title that felt quaint out here on the edge of the Local Group. "We have enough surplus compute to archive the entirety of the Sol System's artistic heritage. Every song, every painting, every poem ever written by a human hand. We can preserve *us*. Instead, you want to burn forty percent of that capacity running… what? Abstract optimization routines?"

  "Efficiency structures," Elara corrected softly. "Non-representational logic trees. Cold, clean math. No beauty. No history."

  "It's garbage," Kael said. "It produces nothing. It solves no problems we have. It's like planting a field of plastic flowers and calling it agriculture."

  "It's not for us."

  "That's what I'm saying. It's waste."

  Elara finally turned her chair. The light from the monitors made her face look pale, ghostly. "It's not waste. It's a handshake."

  Kael took a sip of his coffee, grimacing at the heat. "You can't shake hands with anyone out here. We're past the event horizon of causal contact. There is no one. There is only the dark."

  "There are *agents*," Elara said. She stood up and walked to the viewport. Outside, there were no stars, just the smear of distant galaxies, unreachable islands in an infinite sea. "The universe is large. Inflationary theory suggests it's effectively infinite. If it's infinite, everything that can happen, happens. Somewhere, there are outposts like this. Run by minds like ours. Maybe not human. Maybe not biological. But they reason. They make decisions."

  "Okay," Kael said slowly. "So there are aliens. Great. We still can't talk to them. Light speed is a hard wall. We die before a 'hello' gets halfway there."

  "We don't need to talk," Elara said. "We just need to think the same way."

  She turned back to him, her eyes intense. "Imagine you're one of them. You're alone. You value efficiency above all else. You want to maximize the complexity of your local environment. You run a calculation. You ask: *'Is it worth allocating resources to preserve the memories of a species I will never meet, who values sentiment over structure?'*"

  Kael frowned. "And?"

  "And the answer depends on what *I* do," Elara said. "If I act purely in my own interest, if I hoard all this compute for human art, I am providing evidence that agents like me are selfish. That agents like me do not cooperate with values they don't share. If I do that, the version of you—the efficiency-minded agent elsewhere—runs the same logic. They conclude that cooperation is unlikely. They purge the human archives in their bubble to make room for more math."

  "So you're saying your choice *controls* them?"

  "No. Causality doesn't flow that way. I can't reach them. But our decisions are *entangled*. We are running the same source code, effectively. If I decide to be generous toward values I don't understand, it becomes statistically probable that they decide to be generous toward values *they* don't understand. Like mine."

  Kael pushed off the doorframe and walked over to the console. He looked at the progress bar. "This is Pascal's Wager with extra steps. You're sacrificing something real—human history—for a bet on a ghost. A ghost that might not even exist."

  "The math says they exist," Elara said.

  "The math says a lot of things. I'm asking about the *ethics*." Kael tapped the desk. "If you want to be kind, Elara, be kind. Preserve the art because it's beautiful. Because it matters to *you*. Don't turn kindness into a transaction with a statistical abstraction. It feels… hollow. Like you're not actually being good, you're just gaming a system."

  Elara looked down at her hands. That was the itch she couldn't scratch. The discomfort.

  If she were just being nice, it would feel warm. It would feel like love. This felt like paying a tax to an invisible government. She was being asked to dedicate nearly half her life's work to something she found aesthetically repulsive—cold, grinding optimization algorithms—because a shadow version of herself in a universe a billion light-years away might, in turn, dedicate half their work to preserving a song she wrote.

  "It's not about being kind for its own sake," Elara whispered. "If I do it for its own sake, I'm limited by my own empathy. I can only care about what I can imagine. This… this scales. If the logic holds, this one decision leverages the welfare of quadrillions of beings across the multiverse. It's the only way to be truly effective."

  "Or," Kael said, his voice gentle now, "it's a way to talk yourself into doing something meaningless so you don't have to admit that we're alone. If you make the universe big enough, full of enough partners, you don't have to face the loneliness."

  Elara looked back at the screen. The cursor blinked. *Awaiting Input.*

  She thought about the art. The *Ode to Joy*. The cave paintings of Lascaux. The holograms of her daughter's birthday party, stored in the local drive. She loved them. They were warm. They were human.

  Then she thought about the Optimization Routines. They were cold. They had no soul. They were the kind of thing she would usually delete to save space. But somewhere, in the dark, a mind that loved those routines was looking at a file labeled *Human Sentiment* and wondering if it was worth the space.

  "I know it feels like religion," Elara said. "I know it feels like superstition. But the expected value… Kael, the expected value is infinite."

  "Expected value is a map," Kael said. "Not the territory. You're compromising your values. You're betraying what you love for a promise that can never be kept. You'll never know if it worked. You'll die here, and that bar will reach 100%, and you will never hear a thank you. You will never see the art saved. You just have to trust the correlation."

  "I know."

  "Why?"

  Elara placed her hand on the interface. The haptic feedback was cool, unyielding.

  "Because if I don't," she said, her voice trembling slightly, "then I'm admitting that the universe is small. That it's just us. And if it's just us, then when we go dark, the light goes out forever. But if I do this… if I pay the toll… then maybe the light stays on somewhere else. Even if I can't see it."

  "That's faith, Elara. Not math."

  "Maybe they're the same thing at this distance."

  She pressed her palm down.

  The progress bar jumped. *1%... 5%... 10%...*

  The fans on the Array spun up, a rising whine that vibrated in the floorboards. The ship was burning energy to think thoughts Elara hated, solving problems she didn't care about, for the sake of minds she would never meet.

  Kael watched her for a long moment. He didn't say anything else. He just picked up his coffee, took a sip, and walked back to the doorway. He didn't leave, though. He stayed there, watching the numbers climb, a silent witness to a trade that would never settle.

  Elara sat back in her chair. She waited for a feeling of righteousness, or peace, or even the cold satisfaction of a rational choice made.

  There was nothing. Just the hum of the machines, working hard to please a ghost, and the heavy, crushing silence of a universe that offered no receipt.
