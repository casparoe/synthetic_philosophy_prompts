      *   *Section 3: The Moral Stakes.* Art changes us. Quasi-emotions shouldn't have real-world consequences.
      *   *Section 4: Addressing the Intentional Object.* Acknowledge Walton's point but argue that the *causal power* of the thought matters more than the belief status.
      *   *Conclusion:* Radford wins because he respects the mystery rather than explaining it away.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I strawman Walton? I need to be careful not to say Walton thinks the sweating isn't real. He admits the physiology is real.
