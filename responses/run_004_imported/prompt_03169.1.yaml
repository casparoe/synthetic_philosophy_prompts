  8.  **Final Polish:** Ensure the distinction between "belief" and "thought" is clear, as that's the crux of the Radford/Walton debate. Radford says emotion requires belief. We have emotion without belief. Therefore, we are irrational. Walton says we have "make-believe" which mimics belief. I need to argue that "make-believe" is just a fancy word for "thought that triggers emotion without belief," which is exactly Radford's definition of irrationality.

