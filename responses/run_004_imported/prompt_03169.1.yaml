answer: |-
  This is a fantastic philosophical rabbit hole to fall down. You have correctly identified the two heavyweight champions of the Paradox of Fiction: Colin Radford (the pessimist who thinks we're being irrational) and Kendall Walton (the optimist who thinks we're playing a game).

  The standard academic consensus tends to side with Walton because "irrationality" is an ugly conclusion, and "make-believe" feels like a neat solution. But you want the case for Radford. You want to know why Walton's "quasi-emotion" is essentially semantic sleight-of-hand that fails to dissolve the paradox.

  Here is the strongest case that Radford was right, Walton didn't solve anything, and our tears for Anna Karenina are indeed a beautiful, stubborn irrationality.

  ### 1. The Phenomenological Indistinguishability Argument
  Walton's entire system rests on a distinction between *fear* and *quasi-fear*. He admits Charles's heart races, his palms sweat, and he recoils. But Walton insists these are not instances of *fear* because Charles lacks the belief that the slime exists.

  The problem is: **Who is Walton to tell Charles how he feels?**

  If the subjective experience (the qualia) of quasi-fear is identical to the subjective experience of fear, and the physiological output is identical, positing a metaphysical difference between the two is "ad hoc." It is a distinction without a difference designed solely to save the theory from contradiction.

  Imagine a person who is hallucinating a snake. They scream and jump back. Later, you tell them, "That wasn't a real snake." They say, "I know, but I was terrified."
  *   **Walton says:** "No, you were *quasi-terrified*. Real terror requires a real snake."
  *   **Radford says:** "You were terrified. Your terror was based on a false belief (or no belief). That is why your reaction is irrational."

  Radford captures the lived reality: the suffering is real. If I cry for Anna Karenina, the salt in my tears is real sodium chloride. The tightness in my chest is real muscle tension. To say "this is not real sadness" because the object of the sadness is fictional is to prioritize a technical definition of emotion over the actual human experience. Radford respects the tears; Walton explains them away.

  ### 2. The "Solution" is Just a Renaming of the Problem
  You asked to deal with the obvious comeback: *Walton isn't denying the bodily reactions, he's denying the intentional object.* He argues Charles isn't afraid *of* the slime, he is imagining *that* he is afraid of the slime.

  Here is why that fails to solve the paradox: **The paradox isn't about logic; it's about cost.**

  The Paradox of Fiction hurts because it asks: *Why do we suffer for things that cannot hurt us?*
  *   **Radford's Answer:** "We just do. It's a glitch in our psychology. We are irrational."
  *   **Walton's Answer:** "You aren't actually suffering. You're playing a game where suffering is a prop."

  Walton claims to solve the paradox by denying the premise that we feel *real* emotion. But if "quasi-sadness" causes depression, ruins my afternoon, or motivates me to donate to a charity, in what meaningful sense is it not real sadness?

  If I pay $20 to watch a tragedy and leave the theater genuinely distressed, Walton says, "You didn't pay to be distressed; you paid to *make-believe* you were distressed." This is gaslighting the audience. It strips art of its power. Radford admits art has the power to hijack our emotional systems even when our rational systems know better. Walton reduces *King Lear* to a sophisticated version of peek-a-boo. Radford acknowledges the mystery; Walton dissolves it by changing the dictionary definition of "emotion."

  ### 3. The Cognitive Mechanism Argument (The "Thought Theory")
  Walton relies on a specific theory of emotion: The Cognitive Theory, which states Emotion = Physiological Arousal + **Belief** in the Object.
  Radford points out that in fiction, we have Arousal + **Thought** (without Belief).

  Walton tries to bridge this gap with "Make-Believe." But modern psychology and neuroscience suggest that the brain's emotional centers (like the amygdala) often do not distinguish between a vividly imagined threat and a real one. When you visualize a lemon and your mouth waters, you aren't "quasi-salivating." You are salivating. The mechanism is the same.

  If the cognitive mechanism triggering the tear duct is the *thought* of Anna's death, and that mechanism is functioning exactly as it would for a real death, then the emotion is real. Walton argues that because the *belief* is missing, the emotion is fake. But Radford would argue that the *belief* is the very thing that shouldn't be necessary for the emotion to trigger, and the fact that it triggers anyway is proof of our irrationality.

  Walton tries to make the process rational (it's a game with rules). Radford correctly identifies that the process is *arational* (it bypasses belief entirely). Walton says, "It's not a bug, it's a feature (make-believe)." Radford says, "It's a bug." Given that we often feel embarrassment or regret after crying at a movie ("Why did I cry over a cartoon?"), Radford's assessment aligns better with our post-hoc rational reflection. We recognize the irrationality. Walton tells us we shouldn't.

  ### 4. The Moral Consequence Test
  This is the strongest point for Radford. Fiction changes real-world behavior.
  *   *Uncle Tom's Cabin* fueled abolitionism.
  *   *Schindler's List* changed people's views on the Holocaust.
  *   *13 Reasons Why* (controversially) impacted suicide rates.

  If Walton is right, and we are only experiencing "quasi-emotions" within a closed loop of make-believe, why do these emotions leak into reality?
  If Charles feels only "quasi-fear," why does he lock his door extra tight after a horror movie? If I feel only "quasi-grief" for Anna Karenina, why do I call my mother afterward to tell her I love her?

  Walton has to argue that these real-world actions are *also* part of the game of make-believe, or that the quasi-emotions somehow transmute into real emotions later. This makes his theory incredibly clunky.
  Radford handles this easily: **The emotion was real all along.** Because the emotion was real (despite the object being fictional), it has real causal power. The fact that we act on fictional stimuli proves Radford's point: we are not rational agents who compartmentalize belief and emotion. We are leaky vessels. We treat the fictional as real because our emotions demand it.

  ### 5. Conclusion: Radford Respects the Mystery
  Walton's theory is attractive because it makes us look sane. It says, "Don't worry, you're not crazy for crying at *Up*, you're just playing a complex game of make-believe."

  But Radford is right because he refuses to sanitize the human experience. He looks at the data:
  1.  We know Anna doesn't exist.
  2.  We cry for Anna.
  3.  Crying implies belief in loss.
  4.  Therefore, we are inconsistent.

  Walton tries to break step 3 by saying "It's not real crying, it's quasi-crying." But that contradicts step 2 (the physical reality of the cry).

  Radford wins because he admits that human beings are not perfectly rational logic machines. We are creatures who can be moved by mere *appearances*. Walton tries to save our rationality by downgrading our emotions. Radford saves our emotions by admitting our irrationality.

  If you leave a movie with a heavy heart, you don't feel like you've been playing a game. You feel like you've lost something. Radford is the only one honest enough to say, "Yes, you have lost something, even if it was never there to begin with. That is the tragedy of being human." Walton just calls it "quasi-tragedy."

  Radford had it right: We are irrational. And thank god for that, because that irrationality is the only reason art works at all.
