      *   *Philosophical Sweet Spot:* I will propose a definition that prioritizes *communicative intent* over *submission to arrest*. This allows the masked students to qualify. I will then acknowledge the counter-argument (that submission is essential for moral weight) and explain why, in this specific institutional context, equity overrides that traditional requirement.

