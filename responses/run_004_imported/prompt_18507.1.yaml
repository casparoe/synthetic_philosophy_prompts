          *   Willingness to accept legal penalties (fidelity to law).
      *   *The Tension:* The "acceptance of penalties" clause is the sticking point.
          *   *Argument for Identification:* If you hide, you aren't showing fidelity to the system you're protesting. It becomes covert resistance, not civil *disobedience*.
