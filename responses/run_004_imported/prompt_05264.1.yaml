          *   The student violated the *norms of scientific discourse*, even if she hit the truth.
      *   **The "Gettier" Problem (Optional but maybe too technical?):** Maybe keep it simpler. Let's stick to "Epistemic Luck." She got lucky. Relying on luck isn't a replicable scientific method.
      *   **Decision Theory/Outcome Bias:** Use the term "Resulting." Just because a gamble pays off doesn't mean it was a good bet.
      *   **The Role of the Advisor:** Defend the user's role. The advisor's job is to enforce rigor, not predict the future. If the advisor had let it slide, it would set a bad precedent for scientific training.
