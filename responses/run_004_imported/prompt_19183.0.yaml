answer: |-
  You are absolutely not overreading this. In fact, you have put your finger on the central tension that defines not just the Society for Psychical Research (SPR), but Henry Sidgwick's entire intellectual project in the latter half of his life. Scholars of Sidgwick (most notably Bart Schultz in *Henry Sidgwick: Eye of the Universe* and Alan Gauld in *The Founders of Psychical Research*) have wrestled with this exact passage.

  The short answer is: **Sidgwick is not contradicting himself, but he is performing a delicate rhetorical and philosophical balancing act.** He is distinguishing between an *epistemic duty* (the obligation to investigate) and an *ontological conclusion* (what the investigation will find).

  Here is a breakdown of how the two halves of the passage hang together, why the language is biased against sceptics, and why this was a considered strategy for a man of Sidgwick's rigor.

  ### 1. The Nature of the "Scandal"
  You ask whether the scandal is that people don't believe, or that nobody has settled the question. Sidgwick's position is that **the refusal to investigate is itself unscientific.**

  In the Victorian context, the "educated world" (the scientific establishment) was increasingly dominated by "scientific naturalism" or materialism. The prevailing view was that phenomena like telepathy or apparitions were *a priori* impossible because they violated known laws of physics. Therefore, testimony regarding them was dismissed as fraud or delusion without rigorous testing.

  Sidgwick's charge of "scandal" is not a claim that the phenomena are definitely real. It is a claim about **evidentiary weight.** When he writes, *"if only a tenth part of what has been alleged by generally credible witnesses could be shewn to be true,"* he is making a probabilistic argument. He is saying: *The volume and quality of testimony are currently so high that, by standard scientific norms, they warrant a systematic inquiry.*

  Therefore, the "attitude of incredulity" is a scandal because it represents a **dogmatic closure of inquiry.** It is the scientific equivalent of religious dogma. By calling it a scandal, Sidgwick is shaming the scientific establishment for failing to live up to its own empirical ideals. He is arguing that true scepticism requires testing, not dismissing.

  ### 2. "Unpledged" vs. "Scandal": The Methodological Firewall
  This is where the second paragraph does the heavy lifting. If Sidgwick stopped at "incredulity is a scandal," the SPR would be a club for believers. To make it a scientific society, he must install a methodological firewall.

  *   **The Scandal (Motivation):** We are motivated by the fact that the current consensus is ignoring data.
  *   **The Method (Procedure):** We will process that data without assuming the outcome.

  Sidgwick is effectively saying: *"The current situation is unacceptable because the question is open but treated as closed. We are opening it. But once open, we do not promise you what we will find."*

  This allows him to recruit two opposing groups:
  1.  **Believers:** Who hear "scandal to incredulity" and think, "Finally, someone who takes us seriously."
  2.  **Sceptics:** Who hear "unpledged" and "no foregone conclusion" and think, "Okay, this isn't a cult; it's an audit."

  If he doesn't call the incredulity a scandal, the believers won't come. If he doesn't claim to be unpledged, the sceptics (and respectable scientists) won't touch it. The "contradiction" you sense is actually the **glue** holding the coalition together.

  ### 3. Sidgwick's Personal Stakes (The "Hidden" Premise)
  To understand why the language leans so heavily against the sceptics ("attitude of incredulity"), you have to look at Sidgwick's personal philosophical crisis, which is well-documented in his letters.

  Sidgwick was a utilitarian. In *The Methods of Ethics*, he grappled with a terrifying problem: If there is no God and no afterlife, why should an individual be moral when being immoral offers a better personal outcome? He called this the "dualism of practical reason." He desperately *needed* some evidence of "cosmic sanctions" (a moral order to the universe) to make his ethical system psychologically sustainable.

  He didn't find this in orthodox Christianity (which he had lost faith in), so he turned to Psychical Research.
  *   **Privately:** He hoped the phenomena were real. He *wanted* the scandal to be resolved in favor of the believers.
  *   **Publicly:** He knew that hoping wasn't proving. He had to maintain rigorous standards to ensure that if proof *was* found, it would be undeniable.

  So, the "scandal" language reveals his **hope**, while the "unpledged" language reveals his **integrity**. He is admitting that the *possibility* of these phenomena is scientifically vital (because of the implications for religion and morality), and therefore ignoring that possibility is negligent.

  ### 4. Is this a Known Interpretive Crux?
  Yes. Scholars often refer to this as Sidgwick's **"epistemic anxiety."**

  Alan Gauld notes that Sidgwick was aware he was walking a tightrope. In his diary and correspondence, Sidgwick often expressed frustration that the SPR wasn't finding conclusive evidence, yet he refused to lower the bar to get it.

  The passage you quoted is widely cited as the **founding manifesto of parapsychology as a science.** It is the moment the field attempts to distinguish itself from spiritualism (which was belief-based) and materialism (which was dismissal-based).

  The rhetorical strategy is deliberate. Sidgwick is using the language of **scientific duty**. He is arguing that science is not just a body of knowledge (laws of physics), but a *method of engagement* with anomalies. By labeling the "educated world's" dismissal as a "scandal," he is inverting the hierarchy: The scientists are the ones being unscientific; the SPR are the true empiricists.

  ### Summary
  You are right to feel the tension, but it is not a logical contradiction. It is a **dialectical move.**

  1.  **The Scandal:** It is the *a priori* rejection of testimony. This targets the sceptics because they hold the institutional power to ignore the data.
  2.  **The Remedy:** A neutral, systematic investigation. This targets the methodology to ensure the result is valid.

  Sidgwick is claiming that **neutrality requires investigating the improbable, not ignoring it.** If you ignore it because it seems improbable, you are no longer neutral; you are dogmatic.

  So, to answer your specific question: The scandal is procedural. It is the failure of the "educated world" to apply the scientific method to a dataset that, by volume alone, demands it. He phrases it as an attack on incredulity because, in 1882, incredulity was the barrier to entry. Belief was not the barrier; belief was already happening in the seances. The barrier was the Royal Society locking the door. Sidgwick was trying to pick that lock without promising what was inside the room.
