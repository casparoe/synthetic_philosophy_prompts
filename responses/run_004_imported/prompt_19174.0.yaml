answer: |-
  You are right to be suspicious of the flattened narratives. The secondary literature often treats Popper's relationship with Darwinism as a binary switch: either he rejected it as unscientific (the "tautology" phase) or he fully embraced it as standard physics-like science (the "recantation" phase).

  The reality is more textured. Popper never fully abandoned the idea that there was something logically distinct about evolutionary explanation compared to classical physics, even after he admitted it was testable. His shift wasn't a total climbdown; it was a refinement of *which parts* of evolutionary theory are scientific and *how* they function.

  Here is the actual shape of his view over time, the specific reservations he retained, and how he reconciled this with his evolutionary epistemology.

  ### 1. The Early Charge: Tautology and "Metaphysical Research Programme"
  In the 1970s (specifically in his 1974 *Replies to My Critics*), Popper argued that "survival of the fittest" was tautological. His logic was:
  *   **Question:** Who are the fittest?
  *   **Answer:** Those who survive.
  *   **Question:** Why do they survive?
  *   **Answer:** Because they are the fittest.

  To Popper, this looked like a definition masquerading as a causal law. If a theory explains all possible outcomes, it predicts no specific outcome. Therefore, under his strict falsificationist criteria, it wasn't empirical science.

  However, you must note that for Popper, calling something a **"metaphysical research programme"** was not an insult. In his ontology, "metaphysical" simply meant "not currently empirically testable," not "meaningless." He viewed Newton's absolute space as metaphysical for a long time, yet essential. He saw Darwinism as a framework that *generated* testable hypotheses, even if the core principle itself felt circular in isolation.

  ### 2. The 1977 Recantation: What Actually Changed?
  In his 1977 Herbert Spencer Lecture, *"Natural Selection and the Emergence of Mind,"* Popper famously stated:
  > *"I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."*

  He admitted that natural selection **can** be formulated in a way that is testable. For example, if you posit that a specific trait offers a survival advantage in a specific environment, you can test whether that trait increases in frequency. If it doesn't, the hypothesis is falsified.

  **But here is the nuance often missed:** He did not say, "Evolution is now exactly like Newtonian physics." He said the *theory of natural selection* is testable. He maintained a distinction between the **mechanism** (selection) and the **historical narrative** (evolutionary history).

  ### 3. What Remained "Shaky" Post-Recantation?
  Even after 1977, Popper retained specific reservations about the epistemological status of evolutionary biology compared to physics. He didn't think the "shakiness" was fatal, but he thought it was real.

  **A. Universal Laws vs. Historical Singulars**
  Popper distinguished between **universal laws** (gravity operates everywhere) and **singular historical statements** (this specific lineage evolved this specific trait).
  *   Physics deals mostly with universal laws.
  *   Evolutionary biology deals with the *application* of the mechanism of selection to unique, unrepeatable historical events.
  Popper remained concerned that much of evolutionary biology is **historical reconstruction**. You can test the mechanism of selection in a lab (e.g., bacteria), but you cannot strictly falsify the claim that *Tiktaalik* is the specific ancestor of tetrapods in the same way you falsify a law of thermodynamics. It relies on evidence that is often fragmentary and interpretive. He worried that evolutionary biology sometimes slips into "just-so stories" (narratives that fit the data but aren't strictly derived from a falsifiable law).

  **B. The Statistical Nature of the Theory**
  Popper was always slightly uncomfortable with purely statistical laws. He preferred strict universal implications (If *p*, then *q*). Natural selection is inherently probabilistic (fitness is a propensity, not a guarantee). While he accepted this as scientific, he viewed it as a different *logical type* of science than classical dynamics. It predicts trends, not specific trajectories.

  **C. The "Metaphysical" Core Remains Heuristic**
  Popper never fully stopped referring to evolution as a "research programme" (a term Lakatos, his student, expanded on). Even after 1977, he viewed the *general idea* of evolution as a metaphysical framework that guides scientific inquiry.
  *   **The Core:** "Life evolves by variation and selection." (Metaphysical/Heuristic)
  *   **The Belt:** Specific claims about specific adaptations. (Scientific/Testable)
  He believed the core was too broad to be falsified directly (you can't falsify "life evolves" easily), but it was scientifically valuable because it produced the specific claims in the belt that *could* be falsified. So, the "metaphysical" label wasn't fully retracted; it was recontextualized.

  ### 4. Squaring it with Evolutionary Epistemology
  This is the crux of your second question. Popper's entire theory of knowledge growth (*Conjectures and Refutations*) is an evolutionary analogy:
  *   **Conjectures** = Genetic Mutations (Variation)
  *   **Refutations** = Environmental Pressure (Selection)
  *   **Knowledge** = Adapted Organism

  If evolution is "shaky" or "metaphysical," does that undermine his epistemology? Popper would say **no**, for two reasons:

  **1. Structural Homology, Not Derivation**
  Popper did not derive his epistemology *from* biology. He did not say, "Biology works this way, therefore knowledge must work this way." That would be naturalistic fallacy.
  Instead, he argued for a **structural homology**. He believed that *all* problem-solving systems (biological, scientific, behavioral) follow a logic of trial and error elimination.
  *   Even if evolutionary biology is historically "messy," the *logical form* of variation and selective retention is valid.
  *   In science, we can consciously eliminate errors (refutation). In biology, the organism is eliminated. The *logic* is the same, even if the *mechanism* differs.

  **2. The Recantation Strengthens the Epistemology**
  Paradoxically, his 1977 recantation *helped* his epistemology.
  *   **Before 1977:** If natural selection is a tautology, then his epistemology is based on a circular analogy.
  *   **After 1977:** By admitting natural selection is a testable, scientific theory, he grounded his epistemological analogy in a legitimate scientific process. He could argue that science is an *accelerated, conscious version* of a natural process that is itself scientifically valid.

  ### Summary of the Trajectory
  1.  **1930s–1970s:** Popper worries Darwinism is a tautology. He classifies it as a "metaphysical research programme" to protect his definition of science, not to dismiss evolution.
  2.  **1977:** He realizes the mechanism of selection *can* be framed as testable hypotheses. He recants the "untestable" charge.
  3.  **Post-1977 Nuance:** He still views evolutionary *history* as distinct from physical *laws*. He retains the view that the general framework is heuristic (metaphysical in the sense of guiding inquiry), even if specific hypotheses are empirical.
  4.  **Epistemology:** The analogy holds because it relies on the logic of error elimination, which remains valid regardless of whether evolution is classified as "physics" or "historical science."

  **The Verdict for Your Piece:**
  Popper didn't do a full 180. He moved from thinking Darwinism was **logically flawed** (tautological) to thinking it was **logically distinct** (historical/statistical vs. universal/deterministic). He granted it scientific status, but he never granted it the same *type* of scientific status as Newtonian physics. He kept a small reservation that evolutionary explanations must be vigilantly guarded against becoming unfalsifiable narratives ("just-so stories"), a warning that remains relevant in debates over adaptationism today.

  If you want to capture his view accurately: **He came to see evolution as a scientific theory that operates within a metaphysical framework, relying on statistical laws to explain singular historical events, which makes it scientifically valid but epistemologically distinct from classical physics.**
