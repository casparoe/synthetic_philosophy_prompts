prompt: |-
  Quick question for a piece I'm noodling on about whether evolution "counts" as science under Popper's own rules. I know at one point he called natural selection almost tautological and said Darwinism was more of a "metaphysical research programme" than a proper testable theory, and I know he later gave some Darwin lecture where he seemingly recanted all that. But every writeup I find either treats the recantation as a full climbdown (so the tautology stuff is just an embarassing footnote now) or ignores the recantation completely and quotes the tautology line like it's still his final word. Can you actually walk me through what, if anything, he still thought was shaky about natural selection after backing off, and how that squares with the fact that his whole account of how scientific knowledge grows (conjectures getting weeded out like organisms competing) is basically a selection analogy? I don't want the flattened version from either camp, I want the actual shape of his view over time.
