answer: |-
  The chamber smelled of ozone and sterile linen. Elias lay on the slab, his chest rising and falling in a rhythm that Sarah knew better than her own. She stood behind the glass, her palms pressed against the cold surface.

  "Last chance to veto," Elias said. His voice came through the speakers, clear and singular.

  "No," Sarah said. "The tumor is in the binding agent. If we don't bifurcate the neural load, you have six months. If we do... you have a life."

  " *We* have a life," Elias corrected. He smiled, but the smile didn't quite reach his eyes. It looked rehearsed. "That's the theory, anyway."

  The technician nodded to Sarah. She hit the sequence.

  There was no flash, no bang. The air inside the chamber simply grew thick, like gelatin. Elias's body began to vibrate. It wasn't a shake; it was a visual stutter, as if reality itself was dropping frames around him.

  "Elias?" Sarah said into the mic.

  "I'm here," Elias said. But the audio monitor spiked. The waveform didn't just amplify; it forked. Two distinct peaks where there should have been one.

  "I feel..." Elias started. He stopped. His mouth remained open, but the sound that came out was layered. A chorus of one. "I feel... *we* feel stretched."

  "Vitals are stable," the technician murmured, eyes on the screens. "Neural mapping is... god, it's duplicating."

  Sarah watched her husband. His left side seemed to lag a fraction of a second behind his right. When he raised his hand, the left hand rose first, then the right hand followed, as if catching up to a movement it had already decided to make.

  "Elias," Sarah said, her voice trembling. "Talk to me. What are you thinking?"

  The thing on the slab blinked. The left eyelid closed before the right.

  "I am thinking," the left side of the mouth said, "that I am afraid."

  "I am thinking," the right side said, a split second later, "that I am curious."

  The body on the slab shuddered. The skin along the midline began to glow, a seam of white light running from sternum to brow. The single torso was widening, the ribs audibly cracking and reforming, multiplying.

  "Stop," Sarah whispered. "It's hurting him."

  "It has to finish," the technician said. "The temporal overlap is critical. If they separate before the causal threads unwind, they'll both collapse."

  On the slab, the two halves were becoming distinct. Two chests. Two faces, pressing outward from the same mass of flesh like a developing photograph. They were sharing the space, occupying the same coordinates, and the air hummed with the impossibility of it.

  "Elias," Sarah said. "Please. Just tell me you're still you."

  The face was now two faces, cheek-to-cheek, fused at the shoulder. The Left-Elias turned his head. The Right-Elias kept looking at the ceiling.

  "Sarah," Left-Elias said. His voice was lower, rougher. "Do you remember the proposal? In the park?"

  Sarah froze. "Yes."

  "I wanted to do it in the rain," Left-Elias said. "I remember planning it for weeks. I bought the ring in November."

  Right-Elias turned his head slowly. He looked at his brother, then at Sarah. "I remember hating the park," he said. "I remember thinking the ring was too small. I remember wanting to wait."

  Sarah's breath hitched. "You... you proposed. You said you'd never been more sure."

  "We said," Left-Elias corrected gently.

  "I said," Right-Elias countered. "You just agreed because I was louder that day."

  The seam of light between them flared. With a sound like tearing canvas, the fusion broke. There was no blood, only a sudden rush of air filling the space between them. Two men sat up on the slab. They were identical, down to the scar on the chin, but they sat with different postures. Left-Elias slumped, exhausted. Right-Elias sat upright, alert.

  "Vitals stabilizing," the technician said, sounding shaken. "Two distinct brainwaves. No interference."

  Sarah opened the door and stepped into the chamber. She stood between them. They both smelled like him. They both looked at her with his eyes. But the eyes held different histories.

  "Who are you?" she asked.

  Left-Elias reached for her hand. He was weeping. "I'm the one who's leaving, Sarah. I'm the sum. I'm the compromise." He touched his chest. "The man who walked in here... he's gone. He was the overlap. Now that we're separate, he can't exist. I'm just... the residue."

  Right-Elias stood up, testing his legs. He looked at his brother with a detached pity. "Don't be dramatic. He isn't gone. He was never here." He tapped his temple. "We were always both here. Sharing the bandwidth. Averaging out our impulses. You didn't marry one man, Sarah. You married a coalition."

  Sarah pulled her hand away from Left-Elias. She looked at Right-Elias. "So the last ten years? Our life?"

  "Real," Right-Elias said. "Just... negotiated. Every time we laughed, it was because both of us found it funny. Every time we argued... well." He glanced at his brother. "Sometimes one of us wanted to yell, and the other wanted to walk away. The 'Elias' you knew was the middle ground."

  Left-Elias wiped his eyes. "I feel him dying," he whispered. "The one who was whole. He's fading."

  "He wasn't whole," Right-Elias said sharply. "He was a blur. We are the focus."

  Sarah looked between them. This was the cost. She saw it now, written in the flesh of the man she loved.

  If Left-Elias was right, then Endurantism held: the person who entered the room was wholly present, and that person was now dead. These two were new creatures, inheriting a life they hadn't fully lived. She was a widow standing among ghosts.

  If Right-Elias was right, then Perdurantism held: the person she married never existed as a unity. He was always a stack of temporal slices, a worm of overlapping wills. Her intimacy had been an illusion of proximity. She had slept next to a crowd and called it a husband.

  "Which one comes home?" Sarah asked. Her voice was flat.

  Left-Elias looked up, hopeful. "I remember loving you the most. I feel the loss of it."

  Right-Elias scoffed. "You feel the loss because you're the part that relied on the unity. I remember loving you efficiently. I'm the one who can actually live the life."

  "Vitals are green," the technician called from the booth. "Both subjects are viable."

  Sarah looked at the ring on her finger. It felt suddenly heavy, a shackle binding her to a logic that had just broken.

  "I need to know," Sarah said. "Yesterday. Before you came here. When you made coffee. What did you want?"

  Left-Elias hesitated. "Black. Two sugars."

  Right-Elias smiled, a sad, thin expression. "I wanted tea. I always wanted tea. He just drank the coffee because it was already there."

  Left-Elias stared at his hands. "I didn't know that."

  "Of course you didn't," Right-Elias said. "We were in the same room."

  Sarah stepped back. The horror wasn't that her husband had died. The horror wasn't even that he had split.

  The horror was the silence between the two men. It was the realization that for ten years, in every quiet moment of their marriage, there had been a conversation happening inside Elias's head that she was never invited to hear. A debate between the man who wanted tea and the man who drank coffee. A debate that had finally, physically, walked out of the same mouth.

  "Neither of you," Sarah said.

  Left-Elias flinched as if struck. Right-Elias merely nodded, as if he had calculated this probability.

  "I can't go home with the part that died," Sarah said to Left-Elias. "And I can't go home with the part that was hiding."

  She turned and walked toward the door.

  "Sarah!" Left-Elias cried out. He tried to stand, but his legs tangled, as if he had forgotten how to coordinate limbs that were no longer shared.

  "Wait," Right-Elias called. His voice was steady. "You'll need us both. To remember everything."

  Sarah stopped at the threshold. She didn't turn around. She knew that if she looked back, she would see the impossible geometry of her past: two lines that had been drawn as one, now revealing that the ink had never truly dried.

  "Lock the door," she said to the technician.

  She walked out into the hallway, alone, listening to the sound of two men arguing in a room that was suddenly, terribly, too small for the truth.
