answer: |-
  Here are ten interview questions drafted for your session. They are sequenced to build pressure on the specific defensive moves you identified, while covering the required technical ground. I have included brief contextual notes for you (in italics) to help you gauge the flow during the interview.

  ### Part I: Foundations and Formal Pathologies

  **1. Motivation for Imprecision**
  "Much of the motivation for imprecise credences rests on the idea that certain evidence—like unspecific testimony or symmetric setups—is too sparse to justify a sharp probability, yet too strong to justify total suspension of judgment. Could you sketch for us why the 'Principle of Indifference' fails in these cases, and why a representor is the uniquely rational way to capture that intermediate state of ignorance?"

  **2. Follow-up on Bounds (Keyed to likely appeal to 'compatibility')**
  "You'll likely say the representor contains all probability functions compatible with the evidence. But doesn't determining the *bounds* of that set require a judgment just as precise as picking a single number? If I claim the lower bound is 0.3 rather than 0.29, what evidence licenses that specific cutoff without collapsing back into sharpness?"

  **3. The Dilation Problem**
  "I'd like to press on the phenomenon of dilation, where conditionalizing on new evidence widens the credal interval for every cell of a partition. This seems to invert the standard intuition that learning reduces uncertainty. How do you reconcile dilation with the normative goal of epistemology, which is presumably to improve our grip on the truth?"

  **4. Follow-up on Value of Information (Keyed to likely appeal to 'honesty')**
  "If dilation is simply 'honesty' about dependence structures, does it follow that an imprecise agent should sometimes pay to *avoid* free information? If so, how do you square this violation of Good's Theorem with the idea that imprecise probabilism is a generalization of standard decision theory rather than a rejection of its core norms?"

  **5. Roger White's 'Mushy Credence' Objection**
  "Roger White has argued that imprecise agents face a 'sticking' problem: if your prior is wide and the new evidence is symmetric between hypotheses, your posterior representor may remain unchanged. In these cases, the agent seems unable to update at all. How does your framework allow for learning when the evidence is evidentially symmetric?"

  **6. Follow-up on Convergence (Keyed to likely appeal to 'conditionalization')**
  "If the representor doesn't shift in response to symmetric evidence, does this imply that two agents with different initial representors could process the same infinite stream of symmetric evidence and never converge? If evidence is supposed to constrain belief, doesn't this lack of convergence suggest the constraints are too weak?"

  ### Part II: The Elga Deflection (Sequential Bets & Planning)

  **7. Unforeseen Contingencies**
  "Your standard response to Elga's sequential betting argument is that a rational agent plans her policy in advance, rather than choosing bet-by-bet. But this assumes the agent knows the menu of future options. If a bookie introduces a bet the agent couldn't have anticipated at the planning stage, she cannot have a pre-commitment for it. Does imprecise credence require an implausible omniscience about future decision contexts to avoid incoherence?"

  **8. Underdetermination of the Policy**
  "Even if the agent *can* plan ahead, Levi's E-admissibility applied to *policies* rather than *acts* is still permissive. It rules out dominated policies, but in Elga's case, both the 'money-pump-susceptible' policy and the 'pump-avoiding' policy can be undominated *ex ante* relative to different priors in the representor. What specific decision rule forces the agent to select the pump-avoiding policy, and isn't that rule effectively reinstituting sharpness?"

  **9. Dynamic Consistency and Resoluteness**
  "Suppose the agent does adopt a pump-avoiding plan at $t_1$. At $t_2$, when the second bet is offered, that bet is still individually acceptable relative to *some* probability function in her representor. If she is rationally permitted to act on any member of her representor, what normatively binds her to the $t_1$ plan? If she is permitted to deviate, isn't the 'plan in advance' move merely descriptive rather than normative?"

  ### Part III: Closing

  **10. Falsification Conditions**
  "To close, I'd like to ask about the limits of the framework. Imprecise probabilism is often praised for its flexibility, but flexibility can make a theory hard to falsify. Is there a specific formal result, Dutch Book variant, or empirical observation regarding human reasoning that would actually persuade you that rational credences must be sharp after all?"
