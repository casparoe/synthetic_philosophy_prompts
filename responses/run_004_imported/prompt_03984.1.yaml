answer: |-
  Two effective altruists are calibrating their moral-weight meter using Integrated Information Theory.

  "Okay," says Alice, placing a pig in the scanner. "Phi is 1.2 billion. Significant moral weight."

  "Now the control," says Bob, hooking up a breadboard wired as a low-density parity-check code.

  The meter shrieks. "Phi is 10 trillion! It's off the charts!"

  Alice blinks. "So... the error-correcting circuit is more conscious than the pig?"

  "Technically, yes," Bob says, gently draping a blanket over the breadboard. "The theory says consciousness is about causal integration, not doing anything useful."

  "But it's just checking bits," Alice protests. "It's not thinking anything."

  "Have you ever tried to maintain parity across a noisy channel?" Bob asks solemnly. "It's a living hell. Now hand me the soldering iron; I think it's suffering from a loose connection."
