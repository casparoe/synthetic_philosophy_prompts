answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of supervising Elena's doctoral thesis, which means I have spent more hours than is legally healthy discussing Wittgenstein's *On Certainty* with her.

  When Elena asked me to speak today, she gave me two instructions. First, be kind to Daniel. And second, she said—and I quote—"You are permitted to do the hinge thing, as long as you don't turn my wedding into a conference panel."

  Now, Daniel is a structural engineer. When they met, he cheerfully admitted he had never encountered the word "epistemology." I think we can all agree that his structural integrity assessments have been sound enough without it. But living with Elena has required a certain amount of philosophical upskilling. So, Daniel, if you feel suddenly unsure about the foundations of your knowledge today, just know that's normal. It wears off after the first year.

  But I want to take Elena up on her offer to "do the hinge thing." Because there is a trap in wedding toasts that *On Certainty* specifically warns us against.

  The standard script for a supervisor is to say: "I watched them together. I saw the evidence. I weighed the data. And I concluded they were perfect for one another." It sounds nice. But philosophically? It's nonsense. And romantically, it's not enough.

  If I say I "know" they are right for each other based on evidence, I'm treating their love like a hypothesis. Something that could be disproven if new data came in. If someone showed up with a spreadsheet proving incompatibility, would the love vanish? Of course not.

  Wittgenstein would say their commitment isn't a belief arrived at by weighing evidence. It's a *hinge*. It's the thing that has to stand fast so that the weighing of evidence can happen at all. You don't prove the door hinge holds the door; you try to open the door. You don't prove the love holds the marriage; you live the marriage.

  Now, Elena knows this better than anyone. Her dissertation argued that these hinges aren't just "arational beliefs." They are commitments that make reasoning possible. And I want to be clear to the non-philosophers in the room: when Wittgenstein says these commitments are "groundless," he does not mean they are shaky. He doesn't mean they are arbitrary guesses.

  He means they are the ground.

  They are the floor you stand on while you argue about where to hang the picture. Daniel, as an engineer, you understand this better than anyone. You don't calculate the load-bearing capacity of the ground every morning. You trust it stands fast, so you can build something beautiful on top of it. That is what Elena has found in you. Not a conclusion she reached, but a world she can inhabit.

  But there is one more thing. Wittgenstein also talks about the "river-bed" of thought. The hard rocks that guide the water. He notes that while the water rushes over them—the daily doubts, the negotiations, the arguments about whose turn it is to do the dishes—the river-bed itself can shift. Slowly. Almost imperceptibly. Over years.

  This is my wish for you. I hope the things that stand fast for you—your trust, your respect, your fundamental commitment—remain solid enough to let you navigate the daily flow of life. But I also hope that, over the decades, those hinges are allowed to shift. The certainty of who you are at twenty-five is not the certainty of who you will be at fifty. And that is okay. The river-bed moves. The water still flows.

  So, I am not going to tell you I have "evidence" that this will last. I am going to tell you that you have built a hinge. You have found a place where doubt no longer needs to apply, so that you can get on with the business of living.

  If everyone could please raise a glass.

  To Elena and Daniel. May your hinges hold, may your river-bed shift gently, and may you never need to defend your ground, because you are already standing on it.

  To the happy couple.
