answer: |-
  First off, this is not "kind of nerdy"—this is **extremely nerdy**, and I love it. Tracking credences in a spreadsheet is a fantastic habit, and noticing the non-commutativity of Jeffrey Conditionalization (JC) shows you're paying attention to the math, not just plugging in numbers.

  To answer your main question immediately: **You are not doing anything wrong.** You have stumbled upon one of the most famous and debated quirks of Jeffrey Conditionalization. It is genuinely how the math works, and it is known as the **"Commotativity Problem."**

  Here is the gut-level explanation of why this happens, why standard Bayesianism doesn't do it, and what it implies for your spreadsheet.

  ### 1. The Gut Check: Teleporting vs. Nudging

  To understand why order matters in JC but not in standard Bayesian Conditionalization (BC), think about how the two methods treat your "probability space."

  **Standard Bayesian Conditionalization is a Teleport.**
  When you get hard evidence (you are 100% sure the landlord emailed you), you effectively delete all worlds where that evidence didn't happen. You teleport your mind to the subset of reality where the email exists.
  *   If you teleport to "Email Sent" and then teleport to "Repairman Called," you end up in the intersection of those two worlds.
  *   If you teleport to "Repairman Called" and then "Email Sent," you end up in the exact same intersection.
  *   **Result:** Order doesn't matter. You've deleted the same impossible worlds either way.

  **Jeffrey Conditionalization is a Nudge.**
  When you get *soft* evidence (e.g., "The landlord *sounded* confident on the phone, but maybe he was lying"), you aren't deleting worlds. You are shifting the weight of probability. You are taking some probability mass from "He won't fix it" and sliding it over to "He will fix it," but leaving some behind.
  *   **The Catch:** When you nudge the probability of Event A, you inevitably drag the probability of Event B along with it *if they are correlated in your head*.
  *   If you nudge A first, B moves to a new position. Then you nudge B from *that* new position.
  *   If you nudge B first, A moves to a different position. Then you nudge A from *that* position.
  *   **Result:** Because the starting point for the second nudge depends on the first nudge, the final destination changes.

  ### 2. A Concrete Analogy: The Mixing Board

  Imagine your belief state is a sound mixing board with sliders.
  *   **Slider 1:** Probability Landlord Fixes Heater.
  *   **Slider 2:** Probability Landlord is Honest.

  These sliders are linked (correlated). If you think he's honest, you think he'll fix the heater.

  **Scenario 1:** You hear a rumor he's honest (Soft Evidence 1). You slide Slider 2 up to 80%. Because of the link, Slider 1 automatically creeps up to 60%.
  *   *Now* you see a van outside (Soft Evidence 2). You decide this means there's a 70% chance of a repair. You grab Slider 1 and force it to 70%.
  *   Because you forced Slider 1, the link pulls Slider 2 slightly again.

  **Scenario 2:** You see the van first (Soft Evidence 2). You slide Slider 1 to 70%. This pulls Slider 2 up to 50%.
  *   *Then* you hear the rumor (Soft Evidence 1). You decide this means there's an 80% chance he's honest. You grab Slider 2 and force it to 80%.
  *   Because you forced Slider 2, the link pulls Slider 1 up again.

  **The Outcome:** In Scenario 1, you forced Slider 1 *after* the correlation drag from Slider 2. In Scenario 2, you forced Slider 1 *before* the correlation drag from Slider 2. The final settings will be different.

  ### 3. The Technical "Why" (Briefly)

  In Jeffrey Conditionalization, you preserve the **conditional probabilities** ($P(H|E)$) from the moment of the update. This is called the **Rigidity Condition**.

  When you update on Evidence 1, you preserve $P(H|E_1)$. But this update changes your unconditional probability for Evidence 2 ($P(E_2)$).
  When you subsequently update on Evidence 2, you preserve the *new* $P(H|E_2)$.

  However, if you had updated on Evidence 2 first, you would have preserved the *old* $P(H|E_2)$. Because $E_1$ and $E_2$ are likely correlated in your web of belief, the "old" $P(H|E_2)$ is different from the "new" $P(H|E_2)$. Since JC preserves whatever conditional probabilities exist *at the moment of updating*, changing the order changes which conditionals get preserved.

  ### 4. Does This Mean You're Doing It Wrong?

  **No.** It means you are using a tool that has a known limitation.

  In philosophy of probability, this is the main argument against using JC for sequential updates. If two pieces of soft evidence are **Jeffrey Independent** (meaning updating on one doesn't change the conditional probabilities relevant to the other), the order won't matter. But in the messy real world (like landlord interactions), evidence is almost never independent. "Landlord sounded confident" and "Repair van outside" are correlated clues about the same underlying reality.

  ### 5. Practical Advice for Your Spreadsheet

  Since you can't change the math, here is how to handle it practically:

  1.  **Batch Your Updates:** If two pieces of soft evidence arrive close together, try to assess their *combined* impact in one go, rather than updating sequentially. Estimate $P(\text{Heater} | \text{Rumor} + \text{Van})$ directly and update once. This bypasses the commutativity issue.
  2.  **Check the Variance:** If the order makes a *huge* difference (e.g., 40% vs 80%), it suggests your soft evidence inputs are inconsistent with each other. Your brain is assigning probabilities that don't fit together in a single coherent model. That's a bug in your credences, not the spreadsheet.
  3.  **Consider "Virtual Evidence":** If you want to get even nerdier, look into Judea Pearl's method of **Virtual Evidence** (using likelihood ratios). It is designed specifically to allow sequential updating on uncertain evidence in a way that *is* order-independent (commutative). It's a bit more complex to set up in Excel, but it solves exactly this problem.

  **Summary:** You aren't crazy. Standard Bayesianism is order-independent because it deletes worlds. Jeffrey Conditionalization is order-dependent because it shifts weights, and shifting weight on a connected system depends on what you moved first. Keep tracking, but be wary of sequential soft updates!
