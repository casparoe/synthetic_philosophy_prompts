      *   *Practical Advice:* If the pieces of evidence are logically distinct and the shifts are based on independent sources, it *should* ideally commute, but JC doesn't guarantee it. There are alternative methods (like Pearl's virtual evidence or odds-form updating) that handle this better.
      *   *Verdict:* It's genuinely how JC works, but it highlights a limitation of JC for sequential soft evidence.

