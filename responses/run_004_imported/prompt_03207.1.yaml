      *   **Jeffrey Conditionalization (JC):** You learn $E$ is *not* certain, but shifts to some probability $q$ ($0 < q < 1$). Update rule: $P_{new}(H) = P_{old}(H|E) \cdot q + P_{old}(H|\neg E) \cdot (1-q)$.
      *   **The Problem:** JC is famously *non-commutative*. If you update on $E_1$ (shifting $P(E_1)$ to $q_1$) then $E_2$ (shifting $P(E_2)$ to $q_2$), the result depends on the order *unless* specific independence conditions hold.

  3.  **Formulate the Explanation (Gut-Level):**
