answer: |-
  **The Dust and the Promise**

  The engine hummed, a low vibration against the spine. Through the grimy windshield, the shimmer of the town's water tower rose above the heat haze. Five minutes, maybe less.

  Silas shifted in the backseat, the leather cracking under his weight. He patted his breast pocket, feeling the thick envelope of cash. Then he looked at the woman sitting opposite him. She was staring straight ahead, hands clasped tight in her lap.

  "I'm not going to do it," Silas said. His voice was dry, scratching at the silence.

  Rena didn't turn. "Keep your voice down."

  "Why? He can't hear me over the engine. And even if he could, what's he going to do? Turn around? He wants to get to town as much as we do." Silas leaned forward, elbows on knees. "Think about it. The service is rendered. We're hydrated. We're alive. If I hand over that money, I am poorer by five thousand dollars and I gain… what? A clear conscience? Conscience doesn't quench thirst."

  Rena finally turned. Her eyes were bloodshot, but sharp. "You gain the satisfaction of being a person who keeps their word."

  "I gain the satisfaction of being a person who isn't a fool," Silas corrected. "At the moment I promised, it was rational to promise. I needed the ride. The promise was the price of admission. But I'm inside the theater now. Why pay for the ticket at the exit?"

  "Because the promise wasn't a ticket," Rena said. "It was a commitment. You're treating rationality like a series of isolated snapshots. *Node by node*, right? You look at this specific moment, this specific choice, and you ask what serves your interest *now*."

  "Obviously," Silas said. "What else is there? Reasons are time-indexed. Right now, the reason to pay—getting the ride—has evaporated. The reason to keep money—survival in town—remains. To ignore that is to act against your own interests."

  "That's the sophisticated choice view," Rena said, her voice dropping lower as the truck hit a rut. "And it's self-defeating. Parfit showed this. If you are the kind of agent who reasons the way you just did, you are the kind of agent who gets left in the desert."

  Silas waved a hand. "That's about *dispositions*, not *actions*. If the driver could read my mind back there, sure, I'd have to be disposed to pay. But he can't. He already picked us up. The disposition did its work. Now the action is separate."

  "Is it?" Rena leaned in. "You say rationality is about maximizing your self-interest. But your theory of rationality guarantees you a worse outcome than mine. If we both adopt your view, you don't get the ride. If we adopt mine, we do. A theory of rationality that strands its own adherents in the dust is broken on its own terms. It's what Parfit called 'rational irrationality.' It is rational to be disposed to do the locally 'irrational' thing, because having that disposition is what secures the benefit."

  "But I *have* the benefit!" Silas hissed, tapping the window. "Look at the water tower. I'm not stranded. I'm winning."

  "You're winning the battle and losing the war of agency," Rena said. "You're saying that once the reasons that created the obligation vanish, the obligation vanishes. But that means you aren't an agent who makes plans. You're a slave to the present moment. You're saying your future self has no authority to bind your current self."

  "My future self doesn't exist yet," Silas shot back. "Only this one does. And this one sees no reason to burn cash. You're talking about binding yourself to a past decision as if it has magical force. It doesn't. It's just a memory. Why should the Silas of an hour ago dictate the finances of the Silas of right now? He was desperate. I'm not."

  "Because they are the same person!" Rena's voice rose, and she glanced nervously at the rearview mirror. The driver's eyes flicked back, then forward. She lowered her tone. "Because if you sever the link between your past commitments and your present actions, you destroy the possibility of cooperative agency. You're smuggling in a constraint, you say? No. I'm acknowledging that rationality applies to *policies*, not just isolated acts. The rational unit is the plan, not the node."

  "The plan is a fiction," Silas said. "The pain of paying is real. The loss is real. You're asking me to accept a certain loss for the sake of… what? Consistency? Consistency is a virtue for filing cabinets, not for thirsty men."

  "It's a virtue for anyone who wants to be more than a reflex," Rena said. "You call it a constraint. I call it integrity. If you renege now, you aren't being rational. You're suffering a lapse of will. You're letting the immediate pressure of the 'now' override the judgment of the 'whole.' That's not sophistication, Silas. That's myopia."

  "Myopia sees what's actually in front of it," Silas said. "You're staring at a ghost. The 'whole' doesn't feel the cost. I do. Look, I get your point. You think that by paying, you validate the policy that saved us. But I'm already saved. The policy has cashed out. Why pour money down a well that's already full?"

  "Because the well isn't full until you walk away," Rena said. "If you don't pay, you prove that the driver was wrong to trust you. And if the driver was wrong to trust you, then the mechanism that saved us was luck, not rationality. And if it was luck, then your 'sophisticated' reasoning didn't save you either. Your survival is accidental."

  "Survival is survival," Silas said, leaning back, crossing his arms. "Accidental or not, I'd rather be rich and accidental than principled and broke."

  "That's not the choice," Rena said. "The choice is between being a person who can make a promise, and a person who can only make a noise that sounds like one. You're arguing that rationality requires you to become the latter the second it becomes convenient."

  "I'm arguing that rationality requires me to respond to reasons," Silas said. "And the reason to pay died the moment the town limits came into view. You want to carry a corpse across the finish line just because you picked it up at the start."

  "I want to carry a commitment," Rena corrected. "And if you drop it, you haven't outsmarted the situation. You've just admitted you were never really in the agreement to begin with. You're a free rider on the trust of people like me."

  "Call it what you want," Silas said, watching the pavement blur. "Free rider, sophisticated chooser, survivor. In five minutes, I'll be in a bar with cold water and five thousand dollars more than you. You can lecture me on policy while I drink."

  "And I'll be able to look the driver in the eye," Rena said. "And I'll be able to make a promise tomorrow that someone might actually believe."

  "Tomorrow's problem," Silas murmured.

  "Today's definition," Rena replied.

  The truck slowed. The sign for the town limits rushed toward them, white paint peeling against the blue sky. The driver's foot hovered over the brake, just for a heartbeat, as if testing the weight of the passengers.

  Silas kept his hand in his pocket, fingers hooked around the envelope. Rena kept her hands in her lap, palms open, empty.

  The truck crossed the line. Neither moved.
