          *   *The Frog Case:* Frogs snap at flies. But they also snap at BBs. Was the mechanism selected for detecting *flies*, *nutritious things*, *small dark moving things*, or *fly-or-BB*? Selection history might not be specific enough to rule out the disjunction *inside* the teleological framework.
