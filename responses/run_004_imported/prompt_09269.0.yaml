          *   *Millikan's Defense:* Millikan argues that selection is for specific conditions (e.g., catching flies for nutrition), not just any correlate.
          *   *Fodor/Asymmetric Dependence:* The student claims Fodor's theory was developed by Millikan/allies as a patch. This is factually incorrect. Fodor is a critic of teleosemantics; Asymmetric Dependence is a rival causal theory, not a teleosemantic patch.

