          *   *Core Concept:* Informational/Causal theories define content based on reliable causation. If $X$ causes $R$ normally, but $Y$ causes $R$ occasionally (error), the theory struggles to distinguish $X$ from $X \lor Y$. If content is $X \lor Y$, then $Y$ isn't an error, it's just another instance of the content. This eliminates the possibility of misrepresentation.
      *   **Part (b): Millikan's Teleosemantic Solution.**
          *   *Core Concept:* Content is determined by *proper function* (historical selection). The mechanism producing $R$ was selected for correlating with $X$ (not $Y$). Therefore, content is $X$. When $Y$ causes $R$, the mechanism is malfunctioning (misrepresenting), not representing $X \lor Y$.
      *   **Part (c): Criticism of Teleosemantics (Frog/Fly Case) + Millikan's Defense.**
