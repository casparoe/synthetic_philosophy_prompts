      *   *Refinement on Tātparya:* *Tātparya* is crucial. Without a speaker's intention, there is no *tātparya* to grasp. The hearer projects meaning, which makes it more like interpretation of signs (*liṅga*) than understanding speech (*śabda*).
      *   *Gaṅgeśa Specifics:* Mention the *śabda-khaṇḍa*. Gaṅgeśa emphasizes the *jñāna-lakṣaṇa* (definition via knowledge) of the *āpta*.
