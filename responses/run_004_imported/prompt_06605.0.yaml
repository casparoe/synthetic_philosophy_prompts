      *   **Tone:** Academic, rigorous, nuanced, respectful of the tradition, avoiding anachronism while engaging the philosophical problem.

  2.  **Deconstruct the Nyāya Position (Gaṅgeśa's *Tattvacintāmaṇi*):**
      *   *Śabda* definition: *Āptopadeśaḥ śabdaḥ* (Testimony is the instruction of a trustworthy person).
      *   *Āpta* (Trustworthy Person) conditions:
          1.  *Yathārtha-jñāna* (Veridical cognition of the object). The speaker must *know* the fact directly or inferentially.
