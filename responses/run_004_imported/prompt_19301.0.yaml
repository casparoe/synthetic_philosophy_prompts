  2.  **Evaluate Each Theory on Malfunction:**

      *   **Wright (Etiological):** Function is defined by why the trait is there (history). $X$ has function $Z$ if $X$ is there because it does $Z$.
          *   *Malfunction:* A heart fails to pump but is still a heart because it was selected for pumping. It handles malfunction well because current performance doesn't dictate function; history does.
          *   *Nuance:* Wright's original formulation is sometimes criticized for being too loose regarding the "because" clause, but generally, it's the pioneer of the historical solution to malfunction.

      *   **Neander (Selected Effects):** Refinement of Wright. Function is the effect for which the trait was selected by natural selection.
          *   *Malfunction:* Very strong. A mutant heart that doesn't pump still has the function because its lineage was selected for pumping. It tightens Wright's account to avoid some counterexamples, making it arguably the standard-bearer for handling malfunction via history.
          *   *Differentiation from Wright:* Neander is often seen as a more robust/precise version of Wright, specifically designed to handle issues Wright faced. So Neander might edge out Wright slightly or be equal. Let's look for distinctions. Wright's account can sometimes imply the trait *must* have done the function recently to be there *because* of it. Neander focuses on the historical selection process. Both are top tier.

      *   **Millikan (Proper Function):** Similar to Neander but focuses on "reproductive families" and norms of reproduction.
          *   *Malfunction:* Extremely strong. She explicitly builds "malfunction" into the theory (a thing can fail to perform its proper function). The definition relies on historical success conditions of ancestors, not current performance.
          *   *Differentiation:* Millikan's account is often considered the most detailed regarding norms and malfunction within the historical camp. She distinguishes between "proper function" and "system function."

      *   **Cummins (Causal Role):** Function is the causal contribution of a trait to a capacity of the containing system.
          *   *Malfunction:* This is the classic weakness. If the heart isn't pumping, it isn't contributing to the circulatory capacity. Therefore, strictly speaking, a failing heart loses its function on a pure Cummins account.
          *   *Differentiation:* However, Cummins can appeal to *typical* causal roles or the role in a *theoretical* analysis. But strictly, if it doesn't contribute, it has no function. Some interpreters argue Cummins can handle it by referencing the *design* or *scheme*, but the core theory struggles compared to historical accounts. I need to differentiate it from Boorse. Cummins is about capacities. A broken heart doesn't contribute to the capacity.

      *   **Boorse (Biostatistical):** Function is statistical typicality relative to species design. Health is normal function.
          *   *Malfunction:* Boorse defines function via statistical normality. A failing heart is *abnormal*. Does it still have the function? Boorse distinguishes between having a function and performing it normally. However, if the trait is statistically deficient, is it still the same function? Boorse handles disease/malfunction by defining it as sub-statistical performance of a function. So the function exists as a statistical norm even if the individual fails.
          *   *Differentiation from Cummins:* Boorse anchors the function in the species reference class statistics, not just the specific system's capacity. So a failing heart still has the function because the *species* typically pumps. This handles malfunction better than Cummins (which looks at the specific system's capacity), but worse than Historical accounts (which explain *why* it's a function regardless of stats). Boorse is often criticized for the "reference class" problem, but on malfunction specifically, it fares better than Cummins because it appeals to the species norm, not the individual's current contribution.

      *   **Bigelow & Pargetter (Propensity):** Functions are propensities to survive/reproduce.
