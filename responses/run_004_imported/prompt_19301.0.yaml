  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."]
  }
  ```

  then one sentence under each theory justifying where it landed. And please don't just give me the "etiological theories handle malfunction, causal-role ones don't" line as an excuse to lump half the list together - I want you to actually differentiate the theories within each camp, thats the bit I actually care about.
