answer: |-
  Here are nine questions designed to bypass the rehearsed "elevator pitch" defenses of the Deep Self Concordance Model (DSCM) and target the structural vulnerabilities, specifically the charge that the model acts as a proxy for moral judgment.

  ### 1. The Circularity/Independence Worry
  **Question:** The core charge against the Deep Self Model is that it's circular: we infer the agent's "deep self" from the very action we're trying to explain. If the CEO harms the environment, we assume his deep self is profit-over-people; if he helps, we assume it's not. How do you operationalize the "deep self" in your experiments *independently* of the outcome, so you aren't just measuring moral valence and labeling it "psychological concordance"?

  **Follow-up:** She will likely cite surveys asking about the agent's values *before* the intentionality judgment. Push here: "But do those value questions use morally loaded terms? If you ask subjects if the CEO 'cares about profit,' aren't you priming them to view the environmental harm as a concordant expression of greed, which is itself a moralized trait?"

  ### 2. The Machery Trade-Off Head-to-Head
  **Question:** Ed Machery's Trade-Off Hypothesis suggests the asymmetry exists because people view the harm as a cost of doing business (a trade-off) but the help as a free bonus (no trade-off). Your model says it's about alignment with the deep self. Can you give me a specific vignette where the Trade-Off Hypothesis and the Deep Self Model make *divergent* predictions about intentionality, and tell me which one the data actually supports?

  **Follow-up:** If she claims her model explains *more* cases generally, press on the original CEO case: "For the specific case that started this whole debate—the Chairman vignette—does your model offer any explanatory power that the Trade-Off account doesn't? If not, why posit a 'deep self' mechanism for the original effect at all?"

  ### 3. The "Mere Indifference" Problem
  **Question:** The Deep Self framework was originally built to handle cases of internal conflict, like weakness of will or addiction, where an action fights against a higher-order desire. But the Chairman is *indifferent*. He doesn't have a conflict; he just doesn't care. Is "indifference" really a robust enough psychological state to count as "deep self concordance," or are you stretching the definition to make the data fit?

  **Follow-up:** She may argue that indifference *is* a stance. Counter with: "If mere indifference counts as concordance, then *any* foreseen side effect the agent doesn't actively try to prevent should count as intentional. Doesn't that collapse the distinction between intentional and merely foreseen outcomes entirely?"

  ### 4. The Developmental Mismatch
  **Question:** We know children as young as four show the Knobe asymmetry. But most developmental psychologists would say four-year-olds don't have a fully formed concept of a "stable, evaluative deep self"—they're still working on basic Theory of Mind. If the cognitive machinery for the Deep Self isn't online yet, why are they showing the Deep Self effect?

  **Follow-up:** If she suggests kids have "proto-deep selves," ask: "At what developmental stage does the Deep Self mechanism actually kick in? If the asymmetry exists *before* the mechanism you propose is cognitively available, doesn't that suggest the asymmetry is driven by something more primitive, like simple moral valence?"

  ### 5. The Valence-Decoupling Stress Test
  **Question:** This is the big one on the "smuggling" charge. If the Deep Self Model is distinct from the Moral Valence Model, there must be cases where Moral Valence and Deep Self Concordance come apart. Can you point to a study where an action is *morally good* but *deep-self discordant* (or vice versa), and show that intentionality tracks the Deep Self rather than the Morality?

  **Follow-up:** If she cites a case where they track the Deep Self, ask: "In those cases, did you control for the *blameworthiness* of the agent? Because if the agent is blameworthy for having a 'bad' deep self, aren't we just back to moral judgment driving the bus, regardless of the psychological architecture?"

  ### 6. Occam's Razor / Pragmatics
  **Question:** Why posit a metaphysical commitment to a "Deep Self" at all? A pragmatic account suggests people aren't making psychological claims about intentionality but are instead using 'intentional' as a shorthand for 'deserves blame/praise.' Your model adds a layer of psychological complexity. What does the 'Deep Self' layer buy you that a direct Pragmatic/Moral account doesn't?

  **Follow-up:** She'll likely say the Pragmatic account can't explain *which* psychological features matter. Push back: "But if the only feature that consistently predicts the 'Deep Self' attribution is the moral valence of the outcome, isn't the Deep Self just a theoretical ghost? Why not cut it out with Occam's Razor?"

  ### 7. The "Rejected Value" Case (Implicit Bias)
  **Question:** Let's talk about the boundaries of the Deep Self. Suppose a CEO explicitly rejects sexism (his reflective self) but implicitly biases his hiring against women due to unconscious attitudes (his implicit self). If those biases cause harm, does your model say that harm was intentional?

  **Follow-up:** If she says "Yes, because implicit attitudes are part of the deep self," ask: "Then you're saying intentionality is opaque to the agent. But if the agent sincerely denies the value driving the action, in what sense is the action *concordant* with their self? Aren't you redefining 'self' to mean 'whatever caused the behavior'?"

  ### 8. Cross-Cultural Conceptions of Self
  **Question:** The "Deep Self" is a very Western, individualistic construct—an inner core of stable values distinct from social roles. In cultures with more interdependent or relational selves, do you see the same Knobe asymmetry? If the asymmetry holds universally but the "Deep Self" concept doesn't, doesn't that undermine the mechanism you're proposing?

  **Follow-up:** If she says the effect is universal, ask: "If the effect is universal but the *concept* of a deep self isn't, aren't you attributing a WEIRD psychological mechanism to a global phenomenon? Could it be that people are tracking *norm violations* rather than *self-concordance*?"

  ### 9. The Falsification Condition
  **Question:** I want to end on the science of it. Every model needs a kill condition. What specific pattern of experimental results would make you abandon the Deep Self Concordance Model? If you found a case where moral valence predicted intentionality judgments *perfectly* while deep-self measures were random, would that kill the model, or would you just patch the definition of concordance?

  **Follow-up:** If she hesitates or says "Science is never that black and white," press: "I'm asking for the theoretical boundary. If the Deep Self doesn't override moral valence in a head-to-head competition, what work is it doing? If there's no scenario where the model fails, is it actually a theory, or just a redescription of the data?"
