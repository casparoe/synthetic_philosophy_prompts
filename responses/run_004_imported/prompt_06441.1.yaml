      *   **Constraint:** Stay close to the actual structure of Strawson's argument. Avoid jumping straight to a general verdict on "AI moral responsibility."

  2.  **Deconstruct Strawson's "Freedom and Resentment":**
      *   **Core Thesis:** The truth of determinism is irrelevant to our practices of holding responsible. What matters is the web of human relationships.
      *   **Reactive Attitudes:** Emotions like resentment, gratitude, indignation, guilt. These are *interpersonal*. They demand a certain regard from the other.
      *   **Participant Stance:** Treating someone as a moral agent, capable of goodwill, ill will, or indifference. Reactive attitudes are appropriate here.
      *   **Objective Stance:** Treating someone as an object to be managed, cured, trained, or avoided. Reactive attitudes are suspended.
      *   **Exemptions (vs. Excuses):**
          *   *Excuses:* "I didn't see him," "He shoved me." Accepts the participant stance but denies the ill will in this specific instance.
          *   *Exemptions:* "He's a child," "He's psychotic," "He's under hypnosis." Removes the agent from the participant stance entirely. They are not capable of the requisite goodwill/ill will.
      *   **The "General Strain" Argument:** We cannot sustain the objective stance toward *normal adult humans* generally. It's psychologically impossible/practically unsustainable because we need human contact.
      *   **Nature of the Other:** Reactive attitudes presuppose a *mutual* understanding. They are part of a shared form of life.

