          *   *Outside:* Strawson's framework is about *human* relationships. AI might fall into a "non-human agent" category that Strawson didn't anticipate.
          *   *Refinement:* Strawson's exemptions are for beings who *cannot* participate (children, mentally ill). AI *simulates* participation but lacks the capacity for the underlying sentiment (goodwill/ill will). So, it fits best under **Exemption**. We are forced into the objective stance because the capacity for mutual regard is absent.

      *   *Question 3: The Mirror Image (Can we sustain the participant stance toward AI?)*
