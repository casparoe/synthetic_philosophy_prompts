          *   Is it sustainable? Only if we delude ourselves. Strawson values truth in relationships.
      *   *Section 4: The "Form of Life" Constraint.* Strawson is a Wittgensteinian. Reactive attitudes belong to a human form of life. AI is not part of that form of life.
