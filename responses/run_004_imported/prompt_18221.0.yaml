answer: |-
  Good evening. For those who don't know me, I'm the sibling. And like many siblings, I have spent my life trying to impress [Sister's Name]. But usually, the stakes weren't this high.

  When she asked me to give this toast, she gave me a specific brief. She said, "Since your job is making difficult ideas legible, do not embarrass me by leaning on sentiment. Get the philosophy right." She also told me that roughly half this room holds PhDs in ethics, and they have been instructed to heckle me if I imply that wedding vows possess any sort of ontological binding power.

  So, let's be clear: There is no magic here.

  There is a folk idea that saying "I do" casts a spell. That the words themselves change the fabric of the universe, creating a bond that exists independently of the people speaking them. My sister's dissertation, and I'm happy to say, her heart, argues against that.

  The view we're working with tonight is much more demanding, and frankly, much more romantic. It suggests that a promise doesn't bind you because of the words you say, but because of the expectations you invite.

  When you make a vow, you are looking at another person and saying, "I want you to rely on me. I am deliberately encouraging you to build your life around my presence." The binding force isn't in the air; it's in the trust. Breaking a promise is wrong not because you broke a rule, but because you exploited someone's reliance on you. You invited them in, and then you left them there.

  [Sister's Name] and [Partner's Name], looking at you two, I don't see a magic spell. I see something stronger. I see a deliberate, ongoing project of accountability.

  [Partner's Name], you know what you're signing up for. You aren't being bound by magic words. You are being bound by the fact that [Sister's Name] is going to expect you to show up, and she is going to give you every reason to rely on her doing the same. The vows today are just the public record of the moment you decided to stop guessing and start relying.

  For the family: This basically means marriage is hard work.
  For the philosophers: This basically means Principle F is in effect.

  But for everyone: It means that the love I see between you isn't passive. It isn't something that happens *to* you because you stood under an archway. It is something you *do*. It is the active, daily choice to honor the expectations you have created in one another.

  So, please raise your glasses.

  To [Sister's Name] and [Partner's Name]. May you never take the expectations you've invited for granted. May you never exploit the trust you've built. And may you always find that the reality of keeping a promise is far more beautiful than the magic of making one.

  Cheers.
