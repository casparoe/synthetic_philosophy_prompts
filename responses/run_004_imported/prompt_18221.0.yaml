prompt: |-
  My sister — a philosopher whose dissertation is on the ethics of promising — is getting married next month, and she has asked me to give the toast, her reasoning being that since making difficult ideas legible to a general audience is my job, I ought to get the philosophy right rather than lean on sentiment. Her one rule: I am not allowed to say that the vows are "magic words" that bind the two of them together, since her own work argues against exactly that folk picture, in favor of something closer to Scanlon's account of why breaking a promise wrongs someone — by exploiting expectations you deliberately encouraged, not by defying some independent power the words themselves carry. Roughly half the guests will be her philosophy department, who will notice if I fake it; the other half is family who have never heard of Scanlon and just want three warm, funny minutes. Write the toast, about three minutes long: it should use a real, defensible answer to why promises bind as its emotional core rather than as decoration, and it needs to land for both halves of the room.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Sibling of the bride.
      *   **Occasion:** Wedding toast.
      *   **Bride:** Philosopher, dissertation on ethics of promising.
      *   **Constraint 1 (The "No"):** Do *not* call vows "magic words" or imply they have independent binding power.
      *   **Constraint 2 (The "Yes"):** Use a defensible philosophical account (specifically Scanlonian) as the emotional core.
      *   **Constraint 3 (Audience):** 50% philosophers (will spot errors), 50% family (want warmth/humor, no jargon).
      *   **Length:** About 3 minutes (approx. 400-500 words spoken at a moderate pace).
      *   **Tone:** Warm, funny, intellectually honest, accessible.

  2.  **Deconstruct the Philosophy (Scanlon's Account):**
      *   *What is it?* T.M. Scanlon's contractualism regarding promises.
      *   *Key Idea:* Promises aren't magic spells. They create expectations.
      *   *The Wrong:* Breaking a promise is wrong because you manipulated someone into relying on you, then betrayed that reliance. It's about the relationship and trust, not the utterance itself.
      *   *Application to Marriage:* The vows aren't what *makes* the marriage real; the vows are a public declaration of the intent to maintain the trust and expectations that *already* exist or are being built. It's about ongoing accountability to the person standing next to you.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the assignment. Make a joke about the pressure (philosophers in the room). Establish the sibling relationship.
      *   **The "Magic Words" Trap:** Address the bride's specific constraint immediately but lightly. Acknowledge the folk view vs. the philosophical view.
      *   **The Core Argument (Scanlon-lite):** Explain the concept without using jargon like "Principle F" or "contractualism." Focus on *expectations* and *trust*.
      *   **The Emotional Turn:** Connect the philosophy to the couple's relationship. Why does this matter for *them*? It makes the promise *harder* but *more meaningful*. It's active, not passive.
      *   **Closing:** A wish for the future based on this understanding. Raise a glass.

      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm giving a lecture. The philosophy must serve the emotion. The family needs to feel the warmth even if they miss the Scanlon reference. The philosophers need to nod along without cringing.

      *   *Drafting thought:* How to phrase the Scanlonian view simply? "It's not that the words bind you; it's that you are binding yourselves to each other." "You invited them to rely on you."
      *   *Drafting thought:* How to make it funny? Poke fun at the sister's specificity. "I was given a rubric." "Half the room is grading this."

  4.  **Refining the Content (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Hi everyone. My sister is a philosopher. She told me not to say vows are magic. That's Scanlon's idea. Breaking a promise is bad because you hurt trust. So, [Groom], don't hurt her trust. Love you both. Cheers.
      *   *Critique 1:* Too dry. Needs more heart. Needs to explain *why* the non-magic view is actually more romantic.
      *   *Attempt 2 (Adding Heart):* Magic is easy. Real trust is hard. The vows are just a marker. The work is the life.
      *   *Refining for Audience:* Ensure the family understands that "not magic" doesn't mean "not serious." In fact, it means *more* serious.

  5.  **Finalizing the Text (incorporating the constraints):**
      *   *Word Count Check:* A 3-minute speech is roughly 400-450 words.
      *   *Philosophy Check:* Does it accurately reflect Scanlon without naming him explicitly (or naming him lightly)? It should focus on the *invitation to rely* and the *wrong of betrayal* rather than *ontological binding*.
      *   *Tone Check:* Is it warm? Yes. Is it funny? Needs a few zingers.

  6.  **Writing the Speech (incorporating into final output):**
      *   Start with the "assignment."
      *   Address the "magic words" prohibition.
      *   Explain the "expectations" theory.
      *   Pivot to the groom/partner.
      *   End with the toast.

      *(Self-Correction during final polish)*: Make sure to explicitly mention that the *work* is what matters, not the *words*. That bridges the gap between the philosopher's dissertation and the family's desire for a happy marriage.

  7.  **Final Review against constraints:**
      *   No "magic words"? Checked.
      *   Scanlonian core (expectations/reliance)? Checked.
      *   50/50 audience appeal? Checked (jokes for family, accuracy for philosophers).
      *   3 minutes? (Word count looks good).

  8.  **Final Polish:** Add stage directions for pacing. (e.g., [Pause], [Look at Groom]).

