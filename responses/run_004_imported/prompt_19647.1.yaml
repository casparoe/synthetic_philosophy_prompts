answer: |-
  The room was not white, exactly, but the absence of color so complete it acted like light. Elias stood before the plinth. On it rested no book, no screen, but a suspension of dust motes that held still despite the lack of air. The Entity—voiceless, present only as a pressure behind the eyes—had explained the gift. This was the *Scientia Media*. Middle Knowledge. Not what Elias had done, nor what God had decreed, but what Elias *would* do.

  "Look," the pressure suggested.

  Elias focused. The dust motes shifted, aligning into script, then dissolving into scenes. He saw himself at age seven, standing before a ice cream truck. In reality, he had chosen chocolate. The motes swirled. *Counterfactual 449-B:* If the truck had played a minor key melody, you would have chosen vanilla. Not might. *Would.*

  Elias blinked. "But I wasn't forced."

  "No," the presence replied. "The truth of your choice exists independently of the circumstance. The circumstance merely reveals the truth. We are showing you the truths that never needed revealing."

  He leaned closer. The scenes accelerated. He saw a job interview he never attended. *If the train had been delayed, you would have arrived late. You would have lied about the delay. You would have been hired.* He saw a marriage proposal he never made. *If she had worn the blue dress, you would have asked. She would have said yes. You would have been happy for three years, then miserable.*

  It was not a script of fate. That was the terrifying distinction. In every scene, Elias felt the familiar tug of deliberation. He saw himself weighing the options, feeling the sweat on his palms, experiencing the vertigo of free will. In the counterfactual where he lied to the interviewer, he felt the guilt rise in his throat just as he had felt it in reality when he lied to his mother. The freedom was intact. The agency was his.

  And yet, the record was sealed.

  "Stop," Elias said. "Show me something recent."

  The dust coalesced into yesterday. He was walking past a homeless man on 4th Street. In reality, Elias had kept walking, eyes averted, clutching his coffee. The motes shifted. *Counterfactual 8920-K:* If the man had called out your name, you would have stopped. You would have given him twenty dollars. You would have felt virtuous.

  "I could have done that anyway," Elias said, his voice tight. "I could have stopped yesterday. I wasn't stopped."

  "You could have," the Entity agreed. "But you wouldn't have. There is a difference between power and tendency. You had the power to stop. But the truth of your will was fixed: you would not."

  Elias stepped back. The unease wasn't about coercion. No one had touched him. No clockwork mechanism turned his limbs. The horror was ontological. It was the realization that his character was a fixed point in the landscape of logic, prior to his own existence. Before the universe was kindled, before the first star burned, it was already true that Elias, in circumstance C, would choose X.

  "So I'm predictable," Elias said. "To God."

  "To Logic," the Entity corrected. "God merely read the data before He created the world. He chose to actualize a world where you walk past the beggar. But the truth of your refusal belongs to you. It is your truth. We are just showing you the shape of your own soul."

  Elias looked at his hands. They were trembling. If the truth of his choices existed before he existed, then who was doing the choosing? He felt free. He felt the open horizon of the next moment. He knew, with absolute certainty, that if he chose to smash the plinth, he could. No hand would stay him.

  But if he smashed it, would it be because he chose to, or because it was already true that he would?

  "Show me now," Elias whispered. "Show me what I would do in this room."

  The dust motes hesitated. For the first time, the pattern wavered. "That is not possible," the Entity said. "This circumstance is actual. You are no longer in the realm of the 'would.' You are in the 'is.'"

  "But the truth was there before I stepped in," Elias insisted. "Before I was born, it was true that if I were shown this book, I would react this way. You knew how I would stand here. You knew I would feel this fear."

  "We knew," the Entity admitted. "The truth was waiting for you."

  Elias closed his eyes. He tried to summon a impulse that felt truly new, unmoored from the history of his character. He wanted to scream. He wanted to laugh. He wanted to fall to his knees. He felt the capacity for all of them. The liberty of indifference was his; he was not a robot.

  But as he stood there, he realized the trap was not in the doing, but in the being. The set of counterfactuals was complete. Every possible Elias was cataloged. The brave Elias, the cowardly Elias, the saint, the sinner. They were all static truths waiting in the ether. The only thing that changed was which Elias got to breathe.

  He opened his eyes. The dust motes were settling, returning to randomness.

  "If I walk out of this room," Elias said, "and I turn left instead of right... that was also known?"

  "It was true," the Entity said. "Before the foundation of the world, it was true that you would turn left."

  "And if I decide to turn right, just to prove the record wrong?"

  "Then it was true before the foundation of the world that you would decide to prove the record wrong."

  Elias placed his hand on the door handle. The metal was cold. He felt the weight of his own freedom, heavy and absolute. He could turn left. He could turn right. He could stand here until he starved. The power was entirely his. No force compelled him.

  But as his fingers tightened on the handle, he wondered if the freedom to choose mattered if the choice itself was already a fact. He turned the handle. He did not know which way he would step until his foot moved. For a moment, the future was open.

  But somewhere, in the silence before time, the shadow of his footfall was already cast.
