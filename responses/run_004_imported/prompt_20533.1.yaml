      *   *Student Logic:* "at D, R gives 3 versus L's 2; at U, L gives 2 versus R's 1 — but since the 3 is Player 2's best payoff anywhere in the reduced game, R strictly dominates L, so L can be eliminated too."
      *   *Check:*
