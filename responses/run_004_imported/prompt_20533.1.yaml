      *   Allow *mixed* strategies for domination.
      *   State eliminated strategy, reason, and mix (if relevant) at each round.
      *   Give fully reduced game.
      *   State if dominance solvable.

  4.  **Evaluate Round 1 (Student's Claim: Eliminate M via 50/50 U+D):**
      *   *Student Logic:* Mix $\sigma_1 = 0.5U + 0.5D$.
      *   *Payoffs for Mix against P2's strategies:*
          *   Against L: $0.5(3) + 0.5(0) = 1.5$. M gets 1. $1.5 > 1$. (OK)
          *   Against C: $0.5(3) + 0.5(0) = 1.5$. M gets 1. $1.5 > 1$. (OK)
          *   Against R: $0.5(0) + 0.5(3) = 1.5$. M gets 1. $1.5 > 1$. (OK)
      *   *Strict vs. Weak:* The problem asks for **Strictly** Dominated Strategies. The student writes: "So this mix **weakly** dominates M, and row M can be deleted."
      *   *Error:* The calculation shows $1.5 > 1$ in all cases. This is **Strict** domination, not Weak. The student used the wrong terminology ("weakly"). In a strict grading context, confusing strict and weak domination is a conceptual error, even if the math ($1.5 > 1$) supports strict elimination.
      *   *Validity of Elimination:* Since $1.5 > 1$ everywhere, M is *strictly* dominated. Elimination is valid.
      *   *Deduction:* Terminology error ("weakly" instead of "strictly").

  5.  **Evaluate Round 2 (Student's Claim: Eliminate C via L):**
      *   *Context:* Rows U, D remain. Cols L, C, R remain.
      *   *P2 Payoffs in reduced game (U, D rows):*
