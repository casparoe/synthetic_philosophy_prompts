answer: |-
  **David (McMahanite):** Let's start with the conscript. A nineteen-year-old Russian, dragged onto a bus, sent into Kherson with a rusty rifle. He shoots at a Ukrainian defender. By your lights, the Ukrainian is morally prohibited from killing him?

  **Elena (Walzerian):** No. The Ukrainian is permitted to kill him. That's the point of the Moral Equality of Combatants. Once you put on the uniform, you enter a separate moral sphere. You become a threat, and the enemy combatant has a right to neutralize that threat. It doesn't matter that Putin started the fire.

  **David:** But that's the slippage I'm talking about. You're conflating *excuse* with *justification*. I'll grant you the conscript isn't a *murderer* in the sense that he's fully culpable. He's coerced, misinformed. He's excused. But you Walzerians want to say he's *justified*. That he has an equal right to kill the Ukrainian defender. That's logically incoherent. If the Ukrainian is defending his home from aggression, he has a right of self-defense. If the Russian has a right to kill him, then the Ukrainian *doesn't* have a right of self-defense. You can't have symmetrical rights in an asymmetrical conflict.

  **Elena:** It's not incoherent; it's pragmatic. And it's not just pragmatism, it's about the structure of agency. You're asking the conscript to make a *jus ad bellum* judgment in the fog of war. He isn't well-placed to judge the geopolitical legitimacy of the invasion. His epistemic position is constrained. If we tell him, "You have no right to fight," we aren't enlightening him; we're stripping him of the protections of the war convention. We're telling him he's a criminal the moment he enlists.

  **David:** But he *is* a criminal, morally speaking. Not legally—keep law out of this for a second. Deep morality tracks liability. If I hire a hitman to kill you, and you kill him in self-defense, the hitman isn't "morally equal" to you just because he was paid to do it. He's liable to be killed because he's an unjust threat. The Russian conscript is an unjust threat. The Ukrainian is a just defender. To say they are moral equals is to say that justice doesn't matter to the permissibility of killing. That's the Independence Thesis, and it's false.

  **Elena:** The hitman analogy fails because the hitman knows he's committing a crime. The conscript is told he's liberating brothers from fascists. But look at where your revisionism leads. If unjust combatants have no right to fight, then *jus in bello* violations become redundant for them. If they have no right to be there, every bullet they fire is a moral wrong. You collapse *in bello* into *ad bellum*. That destroys the possibility of humane war. If I know my enemy is morally forbidden from shooting at me, I have no incentive to treat him as a POW if I capture him. He's just a murderer.

  **David:** That's a consequentialist scarecrow. I'm talking about deontic status. Whether you treat him well upon capture is a separate question of mercy or policy. I'm asking: Does he have a moral right to kill? And the answer is no. Walzer tries to have it both ways. He says, "We praise Rommel's conduct." Why? Because Rommel fought clean. But Rommel was fighting for a regime engaged in genocidal aggression. By praising him, Walzer implicitly admits Rommel was *justified* in fighting, not just excused. He slides from "we won't hang him" to "he did nothing wrong." You can't do that.

  **Elena:** I can if the alternative is moral paralysis. You say "Deep Morality." I say "War Convention." The Convention is a set of mutual expectations that limits violence. It works only if both sides believe they are operating within the same rules. If you tell the unjust side, "You are morally liable to be killed but you have no right to kill," you aren't describing reality; you're issuing a verdict. And verdicts don't stop bullets. The symmetry of risk is the only thing that keeps war from becoming extermination. If the "just" side knows the "unjust" side are merely criminals, the restraint breaks.

  **David:** So your morality is held hostage by the bad actors? "We must lie about moral liability so the Nazis don't feel bad about shooting at us"? That's not a moral theory; it's a negotiation tactic. And frankly, it lets individuals off the hook too easily. You say soldiers aren't well-placed to judge *ad bellum*. Fine for 1940. But in 2024? When a tank rolls across a recognized border on live TV? The epistemic barrier is lower now. A soldier can know he's in an aggressive war. If he stays, he becomes complicit. Your "Independence Thesis" relies on an ignorance that is increasingly implausible.

  **Elena:** It relies on the division of moral labor. The statesmen bear the guilt of the aggression; the soldiers bear the burden of the fighting. If you shift the guilt to the soldiers, you democratize the blame. Then everyone is guilty, and no one is. But let's hit your "Law vs. Morality" move. You often say, "Fine, legally they are equal combatants. But morally, they are not." Isn't that special pleading? If the law grants them a right to kill, and you say morality denies it, what work is your morality doing? It becomes a private judgment with no public force.

  **David:** It does the work of truth. The law is a blunt instrument; it has to be administrable. It can't adjudicate the justice of every war in real-time. So it grants equal rights for the sake of order. I respect that. But philosophy isn't law. Philosophy asks what is *true*. It is true that the unjust combatant lacks the right to kill. Acknowledging that matters. It matters for the Ukrainian pulling the trigger. He needs to know he isn't killing a moral equal; he's stopping a threat that shouldn't exist. It changes the weight of the act.

  **Elena:** It changes the weight, yes. It makes it heavier. It makes it a tragedy rather than a duel. But if you insist on that truth, you lose the reciprocity that saves lives. You want the Ukrainian to feel morally superior while shooting. I want him to feel bound by the same rules as the man shooting back. Because if he believes your revisionism, and he captures that conscript, why shouldn't he shoot him? The conscript had no right to fight, therefore he's liable. You've stripped him of the shield of the uniform.

  **David:** Because *I* distinguish liability from punishment. He's liable to be attacked in war, but once he surrenders, he's no longer a threat. The liability expires. I'm not advocating summary execution. I'm advocating clarity. The Walzerian view comforts us. It says, "We're all just doing our job." It sanitizes the aggression. It makes the war a game with two equal teams. My view forces us to acknowledge that one side is wrong, and that wrongness permeates the violence, even if the individual soldier is a victim of propaganda.

  **Elena:** And my view forces us to acknowledge that war is a hell where moral clarity is the first casualty. If you insist on permeating the violence with *ad bellum* judgment, you don't get peace. You get crusades. The "just" side feels licensed to do whatever it takes because they have moral truth on their side. The "unjust" side fights to the death because they know surrender means admitting to being criminals. Your moral clarity fuels the fire you claim to want to analyze.

  **David:** Or maybe it prevents us from calling a spade a spade. If we can't say the Russian conscript is fighting unjustly, even if he's excused, we lose the language to condemn the war itself. We reduce it to "violence on both sides."

  **Elena:** And if we do say it, we lose the language to restrain the violence. We're trading restraint for truth.

  **David:** Then maybe the truth is too expensive.

  **Elena:** Or maybe the restraint is just a lie we tell ourselves to sleep. Either way, the conscript is still dead.
