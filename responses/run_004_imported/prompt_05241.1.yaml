      *   *Check:* Maudlin (1988) "Substances and Spacetimes": Argues for Metric Essentialism. Points have their metric properties essentially. Therefore, the hole diffeomorphism maps a point to a point that *cannot* have that metric profile, so the second model is not a possible world for *these* points. So Maudlin *blocks* indeterminism.
