      *   *Re-evaluation:* Actually, Earman & Norton (1987) say substantivalists must accept indeterminism. Maudlin (1988) says "No, essentialism blocks it." So the user might be misremembering Maudlin's specific move. I need to highlight this. If the user says Maudlin accepts indeterminism, the committee will catch that.
