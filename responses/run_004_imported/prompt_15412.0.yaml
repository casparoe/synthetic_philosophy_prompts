      *   Check against the prompt's specific constraints (hard cases, self-interest distinction, no verdict).
      *   *Self-Correction on the "Self-Interest" point:* The prompt asks the *Critic* to explain why self-interest is disqualifying here when it isn't for treaties. I need to make sure Marcus gets a strong paragraph on this distinction (Categorical vs. Hypothetical Imperatives).

  7.  **Final Review:** Does this meet all criteria?
