      *   *Does PE support this?* PE shows that if you define rationality as "maximizing utility given source code access," you get cooperation *if* you use Modal Decision Theory. If you use CDT, you still defect. So PE shows Superrationality is a *specific decision theory*, not a universal truth of reason.
