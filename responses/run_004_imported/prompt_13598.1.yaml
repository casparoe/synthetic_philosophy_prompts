      *   **The Divergence Case:** The "Obfuscated Twin" (Superrational yes, PE no) and "Asymmetric Architecture" (PE yes, Superrational no/undefined).
      *   **The LLM Reality Check:** Crucial section. Explain why LLMs + System Prompts $\neq$ FairBot.
      *   **The Verdict:** Direct answer. Formalization yes, Vindication no (because it changes the definition of rationality/agency).

  8.  **Refining the "Verdict":**
      *   Hofstadter: "Rationality implies Cooperation."
