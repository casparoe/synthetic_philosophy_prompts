  10. **Final Polish:** Ensure tone is professional but engaged (peer-to-peer). Use the negotiation agent context to ground the abstract theory. (Self-correction: Make sure to clearly distinguish Tennenholtz's original PE from the later Lobian refinements, though they are often grouped).

