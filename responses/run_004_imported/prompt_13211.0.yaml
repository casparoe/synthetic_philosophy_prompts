answer: |-
  1. **The Humphrey Objection and the Phenomenology of Concern**
  Kripke's famous charge is that Counterpart Theory changes the subject: when I wonder if I could have been a pianist, I care about *me*, not some similar fellow in another world. You usually reply that Kripke begs the question by assuming transworld identity is coherent. But let's grant that for a moment. Even if transworld identity is metaphysically suspect, doesn't your view sever the normative link between me and my possibilities? If it's only a *counterpart* who succeeds, why should I feel relief or regret? How do you recover the practical force of modal claims without smuggling in transworld identity?
  *Follow-up:* If you say our intuitions about "me" are just theory-laden and unreliable, doesn't that undermine the very modal intuitions we use to build the similarity metrics for counterparts in the first place?

  2. **Accidental Intrinsics and the Nature of Properties**
  Lewis argues that saying an object is "bent in world A" and "straight in world B" mutilates the property of shape, turning an intrinsic quality into a relation to a world. He prefers to say the object is bent, and a *different* object is straight. But positing a concrete duplicate seems ontologically extravagant. Why is it less awkward to populate reality with infinite duplicates than to accept that some properties are fundamentally world-relative?
  *Follow-up:* If you argue that world-indexed properties are mysterious, isn't the "similarity relation" that binds me to my counterpart equally mysterious, given that it must track essence without identity?

  3. **Chisholm's Paradox and the Sorites of Similarity**
  Chisholm's paradox suggests that if I could have been slightly different, and that version slightly different, eventually we reach someone who isn't me at all. Transworld identity faces a sorites problem here. Counterpart Theory avoids this by making the relation non-transitive. But doesn't this just relocate the arbitrariness? You still need a cutoff point for "sufficient similarity." How is drawing a line on a similarity metric less arbitrary than drawing a line on transworld identity?
  *Follow-up:* If you claim the vagueness is merely linguistic and not metaphysical, are you suggesting there is a precise fact of the matter about how many atoms I could lose before I cease to exist, even if we can't know it?

  4. **Multiple Counterparts and Contradictory Truths**
  Lewis admits that in some worlds, a single person might have two counterparts who disagree on a property—one is a pianist, one is not. This leads to the conclusion that "I could have been a pianist" and "I could have not been a pianist" are both true, but "I could have been both" is false. This seems to violate basic logical intuitions about possibility. Does this fragmentation of modal truth make the theory unusable for rigorous logical analysis?
  *Follow-up:* If you reply that *de re* modality is context-sensitive, how do we resolve practical dilemmas where the context isn't clear, such as assigning risk or responsibility in decision theory?

  5. **Ontological Commitment and Modal Realism**
  Counterpart Theory is often paired with Lewis's Modal Realism—the claim that all possible worlds are concrete and real. But one can be a counterpart theorist without being a realist about worlds. Do you actually believe these other worlds exist concretely, or is the counterpart relation just a useful semantic tool? If it's just a tool, why defend it so vigorously against transworld identity?
  *Follow-up:* If you say the worlds are real, how do you respond to the charge that this violates Ockham's Razor not by multiplying *kinds* of entities, but by multiplying *tokens* of entities infinitely?

  6. **Haecceitism and Indiscernible Worlds**
  If identity across worlds is rejected, you seem committed to denying haecceities—primitive "thisness" properties. But if two possible worlds contain exactly the same qualitative properties arranged in the same way, just with different individuals occupying the roles, are they distinct worlds? If you say no, don't you lose the ability to distinguish between certain meaningful metaphysical possibilities?
  *Follow-up:* If you say yes, they are the same world, doesn't that collapse the distinction between qualitative necessity and absolute necessity, limiting what we can say about divine choice or cosmic chance?

  7. **Moral Responsibility and Alternate Selves**
  In ethics, we often say an agent is responsible because they "could have done otherwise." If the person who did otherwise is literally a different individual—a counterpart—does this weaken the foundation of moral responsibility? If my counterpart commits a crime in another world, is there any sense in which *I* am tainted by that possibility?
  *Follow-up:* If you argue that responsibility is world-bound, does that imply that free will is an illusion restricted to the actual world, since all other "choices" are made by other people?

  8. **Quantum Mechanics and the Many-Worlds Interpretation**
  As a science writer, I have to ask about physics. The Everettian Many-Worlds Interpretation of quantum mechanics posits branching worlds. Some physicists see this as vindicating Lewis. But in Everettian physics, the branches share a causal history, unlike Lewisian worlds. Does your defense of Counterpart Theory rely on the worlds being causally isolated, or would you apply it to the branching selves of quantum mechanics?
  *Follow-up:* If you apply it to quantum branching, does the non-transitive counterpart relation survive the continuous evolution of the wave function, or does quantum coherence force us back toward identity?

  9. **Theoretical Virtues vs. Intuitive Cost**
  You argue that Counterpart Theory solves logical problems like accidental intrinsics and Chisholm's paradox better than transworld identity. But for many philosophers, the intuitive cost—losing literal identity across worlds—outweighs the theoretical benefits. How do you weigh "theoretical elegance" against "pre-theoretic intuition"? Is metaphysics a search for truth or for the best systematization?
  *Follow-up:* If you say systematization, aren't you essentially admitting that the theory is a pragmatic choice rather than a description of reality, which weakens your claim that transworld identity is *false* rather than just *less useful*?

  10. **Falsification and the Limits of the Theory**
  Finally, metaphysics is often criticized for being unfalsifiable. We've discussed where the theory bites bullets. But what would actually count as evidence *against* Counterpart Theory? Is there a logical contradiction, a semantic failure, or even an empirical discovery that would force you to abandon it, or is it insulated from refutation by its own internal coherence?
  *Follow-up:* If your answer is that only a logical contradiction could refute it, aren't you defining the theory in such a way that it is immune to the world, making it a tautology rather than a metaphysical hypothesis?
