      *   Address Pascal's "uncomfortable argument"? Yes, extensively.
      *   No resting on one-liners? Yes.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm dismissing the Judge. The Judge is right that this is dangerous. I need to argue that *not* doing it is more dangerous to the specific authority we protect (a free press).

      *Revised Plan:* I will recommend funding the appeal and campaign. I will argue that the "danger to authority" is mitigated by the fact that we are appealing *through* the courts, not inciting street protest. We are testing the boundary of the law, not breaking it arbitrarily.

