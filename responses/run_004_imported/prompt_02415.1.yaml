answer: |-
  First, welcome to the rabbit hole. Your daughter is right to laugh, but also right to send you to Broad. He *is* the source code. Almost every contemporary paper on emergence is, knowingly or not, footnoting C.D. Broad.

  As a chemist, your instincts are serving you very well here. You are spotting the exact tensions that caused Broadian Emergentism to fracture under pressure in the mid-20th century. To answer your two questions directly: you are reading him charitably, and yes, that second point is a genuine soft spot that critics hammered on for decades.

  Here is the breakdown of what Broad is doing, translated from 1925 Cambridge philosophy into something closer to lab bench logic.

  ### 1. Metaphysical or Epistemic? (The "Deducibility" Question)

  You asked whether Broad's claim that higher-level properties "cannot be deduced" is a claim about our current ignorance (epistemic) or about the structure of reality (metaphysical).

  **Broad means it metaphysically.** This is the crucial distinction between what we now call **Strong Emergence** (Broad) and **Weak Emergence** (closer to Anderson).

  If Broad meant it epistemically ("we just haven't found the bridge law yet"), his theory would collapse into Mechanism. Mechanism claims that *in principle*, given enough computing power and complete knowledge of the micro-constituents, you could predict the macro-behavior. Broad is positing that even a Laplacian Demon with perfect knowledge of the position and momentum of every electron in a living body *still* could not predict reproduction using only the laws of physics and chemistry.

  Why? Because Broad introduces **"Trans-ordinal Laws."**

  Think of these not as complex calculations, but as new brute facts of nature that only "turn on" when matter is arranged in a specific configuration.
  *   **Intra-ordinal:** The laws of physics working within the "Physical Order."
  *   **Trans-ordinal:** A new law that says, "If you arrange physical stuff into *this* specific structure, a new property (Life) appears, and the rule governing that property is *sui generis*."

  Broad writes: *"A trans-ordinal law would be a statement of the irreducible fact..."* That phrase "irreducible fact" is the tell. He is claiming that nature has discontinuous layers of law. It is not that the deduction is too hard; it is that the premise set is incomplete without adding the new law.

  **The Chemist's Translation:**
  Imagine if, when you bonded Sodium and Chlorine, the resulting NaCl obeyed Newton's laws, *plus* a brand new law of gravity that only applied to ionic lattices, which could not be derived from the gravity of the individual atoms. Broad is saying Nature works like that.

  ### 2. The Unity of the "Order" (The "Grab-Bag" Question)

  Your second suspicion is sharper. If a living body has:
  1.  **Ultimate Characteristics** (Reproduction - Emergent)
  2.  **Reducible Characteristics** (Heartbeat - Complex Mechanics)
  3.  **Ordinally Neutral Properties** (Mass/Energy - Physics)

  ...what makes it a unified "Vital Order"? Why isn't it just physics with a tiny sprinkle of magic dust on top?

  Broad's answer is implicit in the text: **The Order is defined by the *entry* of the new law, not the exclusivity of it.**

  For Broad, an "Order" is a natural kind defined by the highest level of trans-ordinal law active within it. Once you cross the threshold where a trans-ordinal law kicks in (e.g., the formation of the first living cell), you have entered a new Order. The fact that the cell *also* obeys the laws of the lower orders (physics/chemistry) is irrelevant to its classification. The lower-order properties are "carried along" as substrate requirements.

  **The Soft Spot:**
  You are right to be suspicious. This is exactly where the theory bleeds.
  If 95% of what a heart does is "Reducible" (mechanics/chemistry) and only 5% is "Ultimate" (vital force/life), does it make sense to posit a whole new ontology?

  Critics (like Carl Hempel and Paul Oppenheim in the 1950s) attacked this precisely. They argued that if the "neutral" and "reducible" properties do all the causal work (which they seemed to in biology as molecular biology advanced), the "Ultimate" properties become **epiphenomenal**—they ride on top but do nothing. If Reproduction is an "Ultimate Characteristic," but the *mechanism* of reproduction is entirely chemical, what work is the "Vital Law" actually doing?

  Broad anticipated this somewhat. He would argue that without the Trans-ordinal law, the arrangement simply wouldn't hold or wouldn't function *as a whole*. But you have identified the weak link: **The heterogeneity of the Order.** It feels like a category error to group "things that obey new laws" with "things that just obey old laws in complex ways" under one header.

  ### 3. Why this feels different from Anderson

  You mentioned starting with Philip Anderson's *"More Is Different."* This is likely part of the friction you're feeling.

  *   **Anderson (1972)** is arguing against *reductionism* in practice. He argues that at each level of complexity, new phenomena appear that require new concepts (superconductivity, symmetry breaking). However, Anderson is generally read as a physicalist. He doesn't necessarily claim new *laws of nature* (Trans-ordinal laws) are needed, but rather that the *conceptual framework* required to understand the aggregate is distinct from the framework of the constituents. This is often called **Weak Emergence**.
  *   **Broad (1925)** is arguing against *Mechanism* in principle. He claims new *laws* are needed. This is **Strong Emergence**.

  As a chemist, Anderson probably feels more "true" to you because you can see how complexity generates novelty without necessarily violating conservation laws or requiring magical bridges. Broad feels stranger because he is willing to posit fundamental discontinuities in the fabric of causation.

  ### 4. Historical Postscript (For Context)

  It is worth noting that Broad himself eventually retreated from the "Vital Order" example. When he wrote this in 1925, the mechanism of life was still mysterious. By the time of DNA and the rise of molecular biology, Broad (and most philosophers) conceded that the "Vital Order" was likely reducible after all.

  Broad retreated to defending Emergence only for the **Mind**. He thought physics → chemistry → biology might be a continuous chain of reduction, but biology → mind was the place where the Trans-ordinal law finally hit a wall.

  ### Summary for the Lab Bench

  1.  **Is it metaphysical?** Yes. Broad claims nature has discontinuous layers of law. It is not a limitation of human knowledge; it is a limitation of deduction itself.
  2.  **Is the "Order" coherent?** Broad says yes (defined by the presence of the new law). Your chemist instinct says "this looks like a grab-bag." History sided with your instinct. The inability to clearly demarcate which properties are "Ultimate" vs. "Reducible" without arbitrary line-drawing is what largely killed Broadian Emergentism in the mid-20th century.

  You aren't missing a hidden depth; you're spotting the cracks that caused the theory to fragment. Broad provided the vocabulary (emergent, trans-ordinal, intra-ordinal), but his specific metaphysical architecture didn't hold up to the progress of science he hoped to accommodate.

  Keep reading, but keep that chemist's skepticism. It's the best tool you have for this material.
