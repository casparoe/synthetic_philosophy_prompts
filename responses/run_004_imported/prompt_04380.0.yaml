      *   **Context:** The user's sister has Bipolar I and is signing a contract to allow involuntary treatment during mania, despite future-mania-her believing she's fine.
      *   **Core Conflict:** Reflection Principle says current beliefs should align with expected future beliefs (to avoid Dutch Books). Ulysses Contracts imply current self *distrusts* future self's judgment.
      *   **Format:** A dialogue between two sharp characters.
      *   **Requirements:** Engage with strongest moves, no talking past each other, no pushovers, no necessarily tidy agreement, highlight pressure points.
      *   **Key References:** Van Fraassen, Reflection Principle, Dutch Book arguments, Ulysses/Sirens, Sleeping Beauty problem, Bipolar mania context.

  2.  **Character Development:**
