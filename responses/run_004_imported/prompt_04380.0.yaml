  7.  **Final Polish:** Check names, ensure technical terms (credence, Dutch Book, conditionalization) are used correctly but naturally. Ensure the emotional weight of the sister's situation isn't lost amidst the theory. (Make sure Elena doesn't sound cold, just rigorous).

  **(Self-Correction Note):** I need to make sure I don't misrepresent van Fraassen. Van Fraassen's Reflection Principle is specifically about *rational* future beliefs. If I know my future self will be drunk or manic, Reflection doesn't mandate I align with them. The tension is: Does signing the contract mean I *know* Reflection will fail? Yes. So is signing it rational? Yes. So where is the conflict? The conflict is in the *description* of the future self. If I treat future-mania-me as "me," Reflection says listen to them. If I treat them as "a broken version of me," Reflection doesn't apply. The dialogue needs to fight over whether we *can* make that distinction without fragmenting the self.

  Let's adjust Elena's stance. She should argue that the contract is an *admission* that Reflection will be violated, not a violation of rationality itself. Marcus should argue that standard Reflection is too brittle to handle this without ad-hoc exceptions.

