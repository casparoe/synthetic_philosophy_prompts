      *   **Elena's Counter:** Reflection isn't about blind trust. It's about expecting your future self to be *you*. If you expect future-you to be crazy, you aren't expecting future-you to be a rational agent. Van Fraassen knew this.
      *   **The Dutch Book:** Marcus brings up the money pump. If I violate Reflection, I lose sure money. Elena needs to explain why the mania case isn't a standard Dutch Book scenario.
      *   **The Nature of "Future Self":** Is manic-her the same agent? Marcus says yes (legally, morally), but epistemically no. Elena argues that if you treat them as different agents, Reflection doesn't apply, but then you lose agency.
      *   **Sleeping Beauty:** Marcus brings this up as a technical wedge. Memory loss/indexicals break Reflection. Elena counters that Sleeping Beauty is about self-locating uncertainty, not cognitive degradation.
      *   **The Crux (The "Why"):** Why sign the paper? Marcus: To prevent harm. Elena: But does that make the *belief* rational, or just the *action*? Distinguish between practical and epistemic rationality.
      *   **Closing:** No resolution. Acknowledge the tension between coherence and survival.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I represent van Fraassen correctly? He actually argues Reflection *holds* for rational agents. If you expect to be irrational, you don't apply Reflection to that future state. So Elena should argue that the contract *acknowledges* a suspension of Reflection.
      *   *Check:* Is Marcus too dismissive of formalism? He needs to respect the Dutch Book argument but show its limits in pathological cases.
      *   *Check:* Make sure the Bipolar context isn't just flavor text; it needs to drive the philosophical point about *cognitive capacity*.
      *   *Tone:* Keep it sharp. Avoid "Well, actually..." phrases. Use "If you grant X, then Y..." structures.

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Start:* Marcus brings up the contract. Elena asks about the philosophy.
      *   *Middle:* The clash on Reflection. Marcus: "I expect to be wrong." Elena: "Then you aren't treating future-you as a rational updater."
      *   *Twist:* Marcus argues that *knowing* you will be irrational makes violating Reflection the rational move *now*.
      *   *Sleeping Beauty:* Use it to show memory/identity issues.
