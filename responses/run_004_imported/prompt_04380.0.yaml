      *   *Character B (Critic/Contextualist):* Needs to be pragmatic, focused on the pathology of mania, arguing that rationality allows for self-binding when cognitive faculties are compromised. Let's call him **Marcus**.
      *   *Dynamic:* Intellectual sparring partners, respectful but intense.

  3.  **Key Philosophical Points to Cover:**
      *   **The Reflection Principle:** $C_t(A | C_{t'}(A) = p) = p$. (Current credence in A, given that future credence in A will be p, should be p).
      *   **The Dutch Book Argument:** If you violate Reflection, a bookie can make you lose money.
      *   **The Ulysses Case:** Tying oneself to the mast. Present self knows future self will be irrational.
      *   **The Bipolar Context:** Mania isn't just a change of opinion; it's a change in cognitive processing/reality testing.
      *   **Van Fraassen's Response:** He distinguishes between *learning* and *forgetting/irrationality*. Reflection applies to rational updating.
      *   **Sleeping Beauty:** A technical counterexample involving self-locating belief and memory loss.
      *   **The "Rationality" Definition:** Is rationality coherence (Reflection) or instrumental success (Ulysses)?

  4.  **Drafting - Section by Section:**

