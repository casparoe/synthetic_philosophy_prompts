answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Rain streaks the window. **ELENA** (40s, formal epistemologist, precise) stirs an espresso. **MARCUS** (30s, ethicist and cognitive scientist, restless) leans forward over a cooling cappuccino.*

  **Marcus:** So, the contract. It's legally binding, ethically fraught, and philosophically fascinating. My sister signs it while euthymic—stable. It says if she goes manic, the doctors can ignore her refusal of meds. Manic-her will scream that she's a god, that lithium is poison, that she doesn't need sleep. Present-her knows that's false. She's binding her future self to the mast.

  **Elena:** And you're worried it violates the Reflection Principle.

  **Marcus:** I'm worried it proves the Reflection Principle is useless for actual humans. Van Fraassen says my current credence in a proposition should equal my expected future credence. If I expect my future self to believe $P$ with 90% confidence, I should believe $P$ with 90% confidence now. But here, present-sister expects future-sister to believe "I am well" with 100% confidence. Present-sister believes "I am ill" with 100% confidence. They are diametrically opposed. If Reflection holds, she's irrational now. If she's rational now, Reflection fails.

  **Elena:** You're reading Reflection as a command to trust your future self unconditionally. It's not. It's a coherence constraint on rational updating. Van Fraassen was explicit: Reflection applies when you expect your future self to be *rationally updating* on new information. If you know your future self is going to be drunk, or manic, or hit on the head with a brick, Reflection doesn't apply. You aren't expected to align with a broken compass.

  **Marcus:** But that's the escape hatch, isn't it? It's too convenient. "I expect to be rational, unless I expect to be irrational." How do I cash out that expectation without already knowing the answer? The Dutch Book argument is the teeth of Reflection. If I violate it, a bookie can construct a set of bets I accept now and later that guarantee a loss. If my sister can sign this contract without being "money-pumped," then the Dutch Book argument has a hole big enough to drive a Ulysses ship through.

  **Elena:** The Dutch Book only works if the bookie knows what you know. If your sister knows that Manic-Her is cognitively compromised, the bookie can't use Manic-Her's credences to set a fair bet *now*. The agent has fragmented. You're treating Present-Sister and Manic-Sister as the same epistemic agent across time. I'm saying the contract is proof they *aren't*, functionally. Reflection governs the diachronic coherence of a *rational* agent. If the mechanism of rationality is chemically decoupled, the principle suspends.

  **Marcus:** That feels like special pleading. Let's look at the *Sleeping Beauty* problem. It's the canonical counterexample to Reflection. Beauty goes to sleep, wakes up, doesn't know if it's Monday or Tuesday, has memory wiped. Her credence shifts without new evidence in the standard sense. Elga uses it to show Reflection fails when self-locating information is involved. Mania is essentially a pathological Sleeping Beauty scenario. Her access to reality is altered, her memory might be spotty, her self-locating belief "I am capable" is wrong. If we have to carve out exceptions for mania, why not for fatigue? For anger? For love? Where does the "rational agent" end and the "exception" begin?

  **Elena:** Because there's a categorical difference between *uncertainty* and *malfunction*. Sleeping Beauty is still reasoning perfectly with limited data. She's a perfect logician in a fog. Your sister in mania isn't in a fog; the engine is overheating. The Reflection Principle isn't a law of physics; it's a norm for ideal agents. We use it to spot errors. If you violate Reflection, you *should* check yourself. Maybe you're missing something, maybe you're biased. But if you have independent medical evidence that your future neurochemistry will induce delusion, you aren't violating rationality by ignoring Future-You. You're treating Future-You as a separate, hostile witness.

  **Marcus:** Hostile witness. That's the ethical sting. If I treat my future self as a hostile witness, am I still one person? The law says yes. The morality says yes—she's responsible for her debts, her relationships, her life. But the epistemology says no. If I sign this contract, I am effectively saying, "I am the real owner of this body; that future thing is a squatter." That works for treatment, sure. But does it corrode the notion of autonomy? If I can override my future desires because I deem them "irrational," what stops me from overriding any future preference I simply disagree with?

  **Elena:** The evidence threshold. That's the pressure point. You don't override a future preference because you *disagree* with it. You override it because you have high-confidence evidence *now* that the process generating that preference is defective. It's not about the content of the belief ("I am well"); it's about the reliability of the source. If I know a bridge is collapsed, I don't walk on it, even if Future-Me will want to cross it. Reflection says: "Trust Future-Me to assess the bridge." Ulysses says: "I know the bridge is gone." They aren't contradictory. They apply to different states of the world.

  **Marcus:** But the bridge isn't gone *yet*. That's the temporal weirdness. When she signs, the mania isn't there. She is predicting a collapse of her own rationality. Van Fraassen wrote a follow-up on Ulysses, you know. He argued that Ulysses *shouldn't* tie himself to the mast if he's truly rational. He should just trust that when he hears the Sirens, he'll update correctly on the danger. Ulysses tying himself implies he expects to fail at conditionalization.

  **Elena:** And Van Fraassen was critiqued for being too ideal. Ulysses knows the Sirens don't just offer new information; they hijack the utility function. They change what he *wants*. Reflection is about credence—belief. But mania changes desire, valuation, *and* belief. It's a global systems failure. If my utility function flips from "stay alive" to "fly into the sun," no amount of Bayesian updating saves me. I need a pre-commitment device. That doesn't make me irrational now; it makes me strategically robust.

  **Marcus:** Strategically robust, but epistemically fractured. That's my worry. We're saying practical rationality (survive the episode) requires epistemic fragmentation (my future beliefs are garbage). If we normalize this, do we lose the ability to hold people accountable? If Manic-Sister buys ten cars, can we say she was irrational? We just did. We signed a paper saying she wouldn't be capable of judgment. So is she responsible?

  **Elena:** Responsibility tracks the stable self, not the episodic self. We hold the *person* responsible, but we excuse the *episode*. The contract is the bridge between the two. It allows the stable self to extend its agency through the time period where the episodic self is incapacitated. It's not that Reflection is dropped; it's that the "future self" in the equation isn't the relevant agent for that decision. The "self" that matters is the one capable of long-term planning.

  **Marcus:** But who decides which self is the "stable" one? That's the political danger. In bipolar disorder, it's clear enough—there's a diagnostic criteria, a medical consensus. But what about religious conversions? Radical political shifts? I might look at my future self who joined a cult and think, "He's deluded." He looks at me and thinks, "She's asleep." If I sign a Ulysses contract against my own future ideological shifts, am I protecting myself or stifling my own growth? Reflection forces me to hesitate. It forces me to ask: "Am I sure he's wrong, or am I just comfortable?"

  **Elena:** That is the legitimate fear. And that's why the medical distinction matters. We aren't talking about ideological shifts; we're talking about psychosis. We have biomarkers, behavioral patterns, history. It's not "I might change my mind about tax policy." It's "I might lose the ability to distinguish reality from fantasy." The Ulysses contract is only rational when the probability of cognitive *degradation* is high, not just cognitive *change*. Reflection warns us against arrogance. Ulysses protects us against pathology. They occupy different lanes.

  **Marcus:** Do they? Because the feeling from the inside—the manic feeling—isn't "I am losing my mind." It's "I am finally seeing clearly." It's an epistemic surge. If I'm in that state, and I revoke the contract, I am acting on my highest conviction. To override that is paternalistic. You're saying the "stable" state gets veto power. Why? Because it's safer? Because it's more boring?

  **Elena:** Because it's the state that *agrees with the contract*. It's recursive. The only time she can authentically authorize the override is when she acknowledges the possibility of being wrong. Mania is defined by the inability to acknowledge that possibility. So the stable state is the only state capable of granting valid consent regarding the mania. It's not that stable is "true" and manic is "false" in a metaphysical sense. It's that stable is "capable of meta-cognition" and manic is not. Reflection requires meta-cognition. Mania destroys it. Therefore, Reflection cannot apply *during* mania. The contract is the echo of Reflection from the only time it can operate.

  **Marcus:** The echo of Reflection. I like that. It admits that the principle is silent when the agent is broken. But it leaves me with a cold comfort. It means my sister's autonomy is a time-share. She owns herself only when she's well. When she's sick, she's a ward of her past self.

  **Elena:** Better a ward of her past self than a casualty of her present chemistry. Look, the Dutch Book argument shows that if you violate Reflection, you're vulnerable. But the Ulysses contract shows that if you *don't* violate Reflection in pathological cases, you're vulnerable to ruin. There's a trade-off between coherence and survival. Philosophy usually prioritizes coherence. Medicine has to prioritize survival.

  **Marcus:** So we accept a fragmented self to save the whole.

  **Elena:** We accept a temporary suspension of agency to preserve the capacity for agency. It's not dropping Reflection. It's acknowledging that Reflection requires a functioning reflector.

  **Marcus:** *Pauses, looking out at the rain.* And if she wakes up after the episode, remembers signing it, and hates it? If stable-her decides the contract was too restrictive?

  **Elena:** Then she revises it. That's Reflection working as intended. She updates on the new data of the hospitalization. She adjusts the constraints. The system isn't static. It's a feedback loop.

  **Marcus:** A feedback loop where the wire sometimes gets cut.

  **Elena:** Yes. And the contract is the insulation.

  **Marcus:** *Sips cold coffee.* I still think Van Fraassen would say Ulysses was wrong to tie himself. He'd say a rational agent should be able to hear the Sirens and choose the mast without ropes.

  **Elena:** Van Fraassen was a philosopher, not a psychiatrist. Ulysses knew he wasn't a god. That's the most rational thing he ever did.

  **Marcus:** Maybe. Or maybe it's the first step toward deciding we're never gods, even when we feel like one. And I'm not sure that's a loss.

  **Elena:** No. It's just the cost of being a creature that breaks.

  *They sit in silence for a moment, the tension between the ideal agent and the real human hanging in the air between them.*
