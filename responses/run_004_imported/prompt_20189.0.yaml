prompt: |-
  I'm a psychology senior enrolled this term in a philosophy of science seminar that has spent several weeks on the replication crisis and the underlying disagreement between frequentist and Bayesian approaches to statistical inference. The readings have mostly kept things at the level of abstract principles, but something that happened with my own honors thesis this semester has made the issue feel a lot less abstract, and I haven't been able to resolve it to my own satisfaction.

  My pre-registered analysis plan specified forty participants per condition for a priming study. Once I reached that number, the key comparison came out at p = .09: in the predicted direction, but short of the conventional .05 cutoff. My advisor, who has seen this happen many times before, told me to simply collect twenty more participants per condition "since we're so close." I did, and the p-value for the combined sample came out to .043. She was pleased and wants the thesis written up around this as a clean, significant result. When I mentioned this sequence of events to a labmate who is unusually into methodology, he reacted strongly: he said the .043 doesn't mean what I think it means anymore, and that my situation is close to a textbook case of the practices people have in mind when they talk about the replication crisis. A different labmate, who has been reading about Bayesian statistics on her own, said none of this would be a problem if I had just reported a Bayes factor instead of a p-value, since Bayesian updating is supposed to be indifferent to when or why a researcher decided to stop collecting data.

  I don't know which labmate has the better argument, or whether they're even really disagreeing about the same thing, and I'd rather understand why than just be handed a rule to follow, since this will not be the last dataset I analyze. Should I write up the .043 as my advisor wants, treat the result as inconclusive until an independent, properly pre-registered replication comes in, or go back and recompute the evidence in Bayesian terms as my second labmate suggests? And underneath all of that: is one of my labmates simply right and the other wrong, or is there something legitimate behind both of their worries?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **User:** Psychology senior, enrolled in a Philosophy of Science seminar.
      *   **Context:** Honors thesis, priming study, pre-registered analysis plan (40 participants/condition).
      *   **Event:** Initial $N$ reached, $p = .09$. Advisor suggested collecting 20 more/condition (optional stopping). New $p = .043$.
      *   **Conflict:** Advisor wants to write it up as significant. Labmate 1 (Methodology-focused) says this invalidates the $p$-value (p-hacking/optional stopping). Labmate 2 (Bayesian-focused) says Bayes Factors (BF) would solve this.
      *   **Goal:** Understand *why* there's a disagreement, evaluate the arguments, and decide how to proceed with the thesis (and future work). Wants conceptual understanding, not just a rule.

  2.  **Deconstruct the Core Statistical/Philosophical Issues:**
      *   **Frequentist Inference ($p$-values):** Depends on the "sampling plan" or "stopping rule." The definition of a $p$-value is the probability of obtaining a result as extreme as the observed one, *assuming the null hypothesis is true and the experiment were repeated infinite times under the same protocol.* If the protocol changes (i.e., "I'll keep adding N until $p < .05$"), the long-run error rate changes. The nominal $p = .043$ is now inflated (actual Type I error rate is higher than 5%).
      *   **Bayesian Inference (Bayes Factors):** Depends on the likelihood of the data under competing hypotheses. The Likelihood Principle states that all evidence is contained in the likelihood function. Stopping rules are technically irrelevant to the *interpretation* of the evidence *given the data*, provided the model is correct. However, priors matter, and optional stopping *can* affect the calibration of BFs in practice (though less severely than $p$-values).
      *   **Pre-registration:** The purpose is to lock in the sampling plan to preserve the frequentist error rate. Deviating violates the pre-registration.
      *   **Ethics/Integrity:** Reporting $p = .043$ as if the plan was fixed at $N=60$ is misleading. It presents a conditional probability that doesn't match the actual data generation process.

  3.  **Evaluate the Labmates' Arguments:**
      *   **Labmate 1 (Frequentist Critique):** Correct regarding standard null hypothesis significance testing (NHST). Optional stopping inflates Type I error. The $p = .043$ is invalid *as a frequentist p-value* under the original pre-registration. This is indeed a contributor to the replication crisis (false positives).
      *   **Labmate 2 (Bayesian Critique):** Partially correct but nuanced. Bayesian updating *is* indifferent to stopping rules in theory (Likelihood Principle). However, simply computing a BF *after the fact* doesn't magically fix the fact that the frequentist pre-registration was violated. Also, optional stopping *can* bias BFs if one stops only when BF > 3 (though less so than $p$-values). But the main point is: BFs quantify evidence, not long-run error rates.
      *   **Advisor:** Pragmatic but methodologically risky. Encouraging a practice that undermines the validity of the statistical claim.

  4.  **Synthesize the "Philosophy of Science" Angle:**
      *   This isn't just math; it's about what probability *means*.
      *   Frequentist: Probability = Long-run frequency. Intent matters because it defines the "long run."
      *   Bayesian: Probability = Degree of belief. Data matters, intent (stopping rule) shouldn't theoretically change the likelihood of the data observed.
      *   The conflict arises because the user is mixing frameworks (Pre-registered Frequentist plan + Optional Stopping + Post-hoc Bayesian suggestion).

  5.  **Formulate Recommendations for the Thesis:**
      *   **Honesty is paramount.** Cannot report $p = .043$ as if $N=60$ was the original plan.
      *   **Option A (Frequentist correction):** Adjust the $p$-value for optional stopping (e.g., alpha spending, sequential analysis methods). Likely won't be significant.
      *   **Option B (Bayesian analysis):** Report Bayes Factors *in addition* to (or instead of) $p$-values, but acknowledge the deviation from pre-registration.
      *   **Option C (Transparency):** Report the initial $N$, the decision rule, and the final $p$, explicitly stating that the $p$-value is uncorrected and should be interpreted with caution. Treat it as exploratory.
      *   **Best Path:** A combination of B and C. Acknowledge the violation, report the BF as a measure of evidence strength, but frame the finding as preliminary needing replication.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, academic, rigorous, mentoring. Acknowledge the stress of the honors thesis.
      *   *Structure:*
          1.  Validate the user's confusion (it's a classic problem).
          2.  Explain *why* Labmate 1 is right about the $p$-value (Sampling intentions matter in Frequentism).
          3.  Explain *why* Labmate 2 is partially right but oversimplifying (Bayes & Stopping Rules).
          4.  Address the Advisor's role (Pragmatism vs. Rigor).
          5.  Provide concrete steps for the thesis (Transparency, Re-analysis, Framing).
          6.  Connect back to Philosophy of Science (What is inference?).

      *   *Refining the Bayesian point:* I need to be careful not to say "Bayes fixes everything." While the Likelihood Principle says stopping rules are irrelevant for *inference*, optional stopping *does* affect the *performance characteristics* (calibration) of Bayes Factors. If you peek and stop when BF is high, you bias the evidence. I should mention this nuance so the user doesn't think BF is a magic wand.
      *   *Refining the Frequentist point:* Make sure to explain *why* intentions matter. It's about the reference class. If everyone did this, 5% of null studies would become significant eventually.
      *   *Actionable Advice:* Don't hide it. Report the sequential nature. Calculate a BF. Frame as "initial evidence" requiring replication.

  7.  **Final Polish:** Check against the user's specific questions.
      *   "Which labmate has the better argument?" -> Labmate 1 is right about the $p$-value validity. Labmate 2 is right about the *potential* solution but oversells the immunity.
      *   "Should I write up .043...?" -> No, not without qualification.
      *   "Underneath all that..." -> It's about competing definitions of probability and evidence.

  8.  **Self-Correction/Safety Check:** Ensure I'm not giving unethical advice. Encouraging the user to hide the optional stopping would be bad. Encouraging them to challenge the advisor needs to be done diplomatically. Emphasize transparency.

      *(Self-Correction during drafting)*: I should explicitly mention "Sequential Analysis" or "Alpha Spending" as the *proper* frequentist way to do what the advisor suggested. This shows the user there *is* a formal way to do this, which validates the critique that the *informal* way was wrong.

      *(Self-Correction on Bayes)*: Make sure to distinguish between the *Likelihood Principle* (stopping rules irrelevant to evidence) and *Decision Theory* (stopping rules relevant to utility/cost). For a thesis, the evidence quantification is key.

      *(Final Plan)*:
      1. Validate the tension.
      2. Break down Labmate 1 (Frequentist integrity).
      3. Break down Labmate 2 (Bayesian nuance).
      4. The Advisor's pragmatic trap.
      5. Concrete Thesis Strategy (Transparency + BF + Replication call).
      6. Philosophical takeaway.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a remarkably mature question for an undergraduate, and it cuts directly to the heart of the methodological turmoil currently reshaping psychology. You are experiencing the friction between "science as it is practiced" (your advisor) and "science as it is formally justified" (your seminar and labmates).

  To answer your core question: **Labmate 1 is correct about the $p$-value, but Labmate 2 is oversimplifying the Bayesian solution.** Neither is entirely wrong, but they are speaking different statistical languages.

  Here is a breakdown of why this happened, why the numbers mean different things depending on who you ask, and how you should handle your thesis without compromising your integrity or your relationship with your advisor.

  ### 1. Why Labmate 1 is Right (The Frequentist Problem)

  Your labmate who warned you about the replication crisis is relying on the definition of the $p$-value within **Frequentist Null Hypothesis Significance Testing (NHST)**.

  In Frequentist statistics, a $p$-value is not just a property of the data you have; it is a property of the **data generation process**. It is defined as: *The probability of obtaining results as extreme as these, assuming the null is true, across infinite hypothetical repetitions of the experiment **under the same protocol**.*

  The "protocol" includes your **stopping rule**.
  *   **Plan A (Pre-registered):** Collect $N=80$. Analyze. Stop.
  *   **Plan B (What happened):** Collect $N=80$. Analyze. If $p > .05$, collect $N=40$ more. Analyze.

  If you follow Plan B, you have given yourself multiple "looks" at the data. By chance alone, data fluctuates. At $N=80$, you were at $p=.09$. By adding more participants, you allowed random noise to potentially swing the mean further away from zero. If you had kept adding participants until $p < .05$, you would eventually get there even if the null hypothesis were true.

  Because you deviated from the pre-registered stopping rule, the "long-run error rate" of your test is no longer 5%. It is now higher (perhaps 10% or 15%, depending on how many "peeks" you took). Therefore, reporting $p = .043$ as if it came from Plan A is mathematically misleading. It claims a false positive rate of 5% when the actual rate is higher. This is exactly the kind of "flexibility" that drives the replication crisis.

  **Verdict:** You cannot report $p = .043$ as a standard, pre-registered significant result. It is invalid under the rules you originally committed to.

  ### 2. Why Labmate 2 is Partially Right (The Bayesian Nuance)

  Your second labmate is referencing the **Likelihood Principle**, which is central to Bayesian inference.

  In Bayesian statistics, evidence is quantified by how much the data shifts your prior belief to a posterior belief (often summarized as a Bayes Factor). The Likelihood Principle states that all the evidence about a parameter contained in the data is found in the likelihood function. Crucially, **the likelihood function does not care about your intentions.** Whether you planned to stop at $N=80$ or $N=100$, the probability of observing *this specific dataset* given a hypothesis is the same.

  Therefore, theoretically, a Bayes Factor (BF) is immune to optional stopping. If you calculate a BF on the final $N=120$, it validly quantifies the strength of evidence in that specific dataset, regardless of why you stopped collecting.

  **However, there is a catch.** While the *interpretation* of the BF is valid, optional stopping can still bias the *calibration* of Bayes Factors in practice. If you adopt a rule like "Keep collecting data until BF > 3," you can inflate the rate of false evidence, though generally less severely than with $p$-values. Furthermore, simply switching to a BF post-hoc does not fix the fact that you violated a Frequentist pre-registration.

  **Verdict:** Calculating a Bayes Factor is a great idea, but it is not a "get out of jail free" card that erases the methodological deviation. It offers a different *type* of inference that is more robust to your situation, but it must be reported transparently.

  ### 3. The Advisor's Position (Pragmatism vs. Rigor)

  Your advisor is operating under a pragmatic model of science that predates the current methodological reform. In this view, $p < .05$ is a threshold for "publishability," and since the effect is in the predicted direction, adding more subjects is seen as increasing power to detect a real effect.

  She is not trying to trick anyone; she is trying to help you graduate with a "clean" result. However, her advice relies on the assumption that the $p$-value is a stable property of the effect, rather than a property of the testing procedure. In the current climate of psychology, following her advice without qualification risks your credibility if a reviewer notices the discrepancy between your pre-registration and your final $N$.

  ### 4. How to Proceed with Your Thesis

  You are in a delicate position. You need to satisfy your advisor, maintain your integrity, and satisfy the methodological standards you are learning in your seminar. Here is a recommended path forward:

  **Step 1: Do not hide the sequential collection.**
  In your Methods section, you must explicitly state: *"Data collection was extended beyond the pre-registered sample size following an interim analysis."* Hiding this is academic misconduct; revealing it allows you to contextualize the statistics.

  **Step 2: Re-evaluate the Frequentist claim.**
  You have two honest Frequentist options:
  *   **Option A:** Report the results at $N=80$ ($p=.09$) as the primary pre-registered analysis. This honors your contract with the scientific record.
  *   **Option B:** If you report the $N=120$ results, you must acknowledge that the $p$-value is uncorrected for optional stopping. You can describe it as "exploratory" or "supplementary."
  *   *(Advanced Option)*: You could apply a correction for sequential testing (like an alpha-spending function), but this is likely too complex for an honors thesis and will likely render the result non-significant anyway.

  **Step 3: Include the Bayesian Analysis.**
  Take your labmate's advice. Compute a Bayes Factor for the final dataset ($N=120$).
  *   If the BF is strong (e.g., $BF_{10} > 3$ or $> 6$), you can argue that while the Frequentist $p$-value is compromised by the stopping rule, the Bayesian evidence suggests the effect is real.
  *   This shows you are engaging with modern methodology without invalidating the work.

  **Step 4: Frame the Discussion carefully.**
  Do not claim you have definitively proven the effect. Frame the thesis as follows:
  *"The pre-registered analysis yielded a non-significant trend ($p=.09$). Upon extending the sample size, the effect reached conventional significance ($p=.043$). However, due to the optional stopping, this $p$-value should be interpreted with caution. Bayesian analysis provided [moderate/substantial] evidence for the alternative hypothesis ($BF = X$). These results suggest the effect is promising but require independent replication to confirm."*

  ### 5. The Philosophical Takeaway

  You asked if one labmate is right and the other wrong. The deeper answer is that they are disagreeing about **what probability is.**

  *   **Labmate 1 (Frequentist):** Probability is about **behavior**. It controls the long-run error rate of the scientific community. To keep that error rate at 5%, we must follow strict rules (like pre-registration). If we break the rules, the error rate guarantee breaks.
  *   **Labmate 2 (Bayesian):** Probability is about **belief**. It quantifies how much we should trust a hypothesis given the data we actually have. The "long run" doesn't matter as much as the specific evidence in front of us.

  Your advisor is ignoring both definitions in favor of a **Heuristic**: "Significant means true."

  **Recommendation:**
  Write the thesis using **Step 4** above. It respects the pre-registration (by acknowledging the violation), utilizes the Bayesian insight (by adding the BF), and satisfies the advisor (by reporting the significant $p$-value, albeit with caveats).

  This approach turns a methodological crisis into a methodological *lesson*. It demonstrates to your committee that you understand the nuances of inference better than a student who simply reports $p = .043$ without context. In a Philosophy of Science seminar, this nuance is exactly what is valued.

  **Final advice:** Talk to your advisor again. Say something like: *"I've been thinking about the optional stopping issue we discussed. I'm worried that if a reviewer compares the pre-registration to the final N, they might flag the p-value as inflated. To protect the thesis, I'd like to report the p-value but explicitly note the sequential collection, and add a Bayesian analysis to bolster the evidence. Does that sound like a safe way to frame it?"* Most advisors will agree to this because it protects *them* from criticism as well.
