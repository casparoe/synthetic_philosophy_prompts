answer: |-
  Here are 9 interview questions designed for your living room podcast, complete with follow-ups that anticipate her "primitive relation" defense.

  **1. The Grounding Problem (The Direct Hit)**
  "Let's start with the big one. If the statue and the lump share every single micro-physical property—every atom, every bond, every spatial coordinate—what *makes* it the case that one can survive being squashed and the other cannot? Usually, when properties differ, we look for a difference in the base facts. But here, the base facts are identical. So, what grounds the modal difference?"

  *   **Follow-up:** "I suspect you'll say the 'constitution relation' grounds it. But you've also said constitution is primitive. If it's primitive, does that mean there is *no* further explanation for why the properties diverge? If so, aren't you just labeling the mystery rather than solving it?"

  **2. Derivative vs. Non-Derivative Properties**
  "You use this distinction where the lump has 'being a statue' only derivatively, while the statue has it non-derivatively. I need to know: when the lump derivatively possesses an artistic property, is that a real feature of the world, or just a *façon de parler*? Can I make true claims about the lump's aesthetic value, or only the statue's?"

  *   **Follow-up:** "If it *is* a real feature, why doesn't it contribute to the lump's causal powers? If the lump *really* has the property of 'being art,' even derivatively, why doesn't that property do any work? It sounds like you want the property to be real enough for truth, but fake enough to avoid causal clutter."

  **3. Causal Overdetermination**
  "Let's talk about action. The statue falls off the shelf and shatters the window. We agree the statue caused that. But since the lump was exactly there, moving at exactly the same speed, did the lump cause the window to shatter too?"

  *   **Follow-up:** "If you say yes, aren't you committed to systematic causal overdetermination? Every time a material object acts, two things are causing the effect. Most metaphysicians run from overdetermination because it seems wasteful. Why should we accept it here just to save the distinction?"

  **4. Persons and Bodies (The Analogy)**
  "I want to run this apparatus on us. Are you constituted by your body in the same way the statue is constituted by the clay? If so, does your body have mental properties derivatively? Is your body currently thinking your thoughts, just in a derivative way?"

  *   **Follow-up:** "If your body feels pain only derivatively, but you feel it non-derivatively, where is the suffering happening? If the physical state is identical in both, how does the 'primitive' constitution relation toggle the pain from 'derivative' to 'real'? That seems like a lot of weight for a primitive relation to carry."

  **5. The "Primitive" Stopper**
  "You've mentioned that constitution is a primitive relation. In science, when we call something primitive, it's usually because we haven't found the mechanism yet. In your metaphysics, is 'primitive' a placeholder for an explanation we don't have, or is it a full stop that says no explanation is possible?"

  *   **Follow-up:** "If it's a full stop, aren't you halting inquiry? The identity theorist says there's only one object, so no explanation is needed. You say there are two, but the link is unexplainable. Isn't the identity view actually more parsimonious about *explanations*, even if you think it's less parsimonious about *objects*?"

  **6. Counting and Detection**
  "Imagine I have a perfect physical scanner that detects every distinct material object in a region of space. I point it at the statue. Does the machine beep once or twice? If it beeps once, on what basis do you claim there are two? If it beeps twice, what physical signal is the second beep detecting?"

  *   **Follow-up:** "If you say the scanner only detects physical stuff and misses the 'constitution' layer, aren't you admitting that the second object is physically undetectable? If it's undetectable and causally redundant, in what sense is it a *material* object?"

  **7. Persistence and Destruction**
  "When I take a hammer to the statue, you say the statue goes out of existence but the lump remains. But physically, nothing has left the region; the atoms are just rearranged. Did an object literally cease to exist right where another object continued to exist, despite no physical loss?"

  *   **Follow-up:** "If constitution is primitive, does that mean existence itself is sortal-relative? It feels like you're saying 'existence' isn't one thing, but many. Isn't that a radical revision of logic just to save the intuition that the lump survives?"

  **8. Occam's Razor**
  "Let's talk about cost. The identity view says: One object, one set of properties, context-dependent descriptions. Your view says: Two objects, one set of physical properties, one set of modal properties, plus a primitive relation binding them. What theoretical payoff do we get that is worth doubling the furniture of the universe?"

  *   **Follow-up:** "You might say 'it saves our intuitions.' But our intuitions also say two things can't be in one place. You're keeping the intuition about survival but sacrificing the intuition about location. Why is one intuition worth the ontological expense and the other isn't?"

  **9. The Identity Alternative**
  "Finally, why not just say the statue *is* the lump, but we describe them under different modes? What specific philosophical problem does the 'constitution view' solve that the 'identity view' can't, other than allowing us to speak loosely about survival conditions?"

  *   **Follow-up:** "If the answer is 'modal properties,' we're back to the grounding problem. If the identity view says modal properties are relative to descriptions, and you say they're relative to primitive constitution... isn't your view just the identity view with an extra, unexplained metaphysical layer on top?"
