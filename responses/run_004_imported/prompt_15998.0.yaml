answer: |-
  You are absolutely right, and you are not being pedantic. This is arguably the single most important technical distinction in the economics of climate change. Your friend is describing one specific component of the discount rate but treating it as if it justifies the whole thing.

  The equation you vaguely remember is the **Ramsey Rule**, and it is the backbone of intergenerational cost-benefit analysis.

  Here is the breakdown you can send your friend to settle the tie, explaining why economists and philosophers fight tooth and nail to keep these two concepts separate.

  ### 1. The Equation: $r = \rho + \eta \cdot g$

  The Social Discount Rate ($r$) is usually decomposed into two distinct parts:

  *   **$\rho$ (Rho): The Pure Rate of Time Preference (PRTP).**
      *   **What it is:** This measures "impatience." It asks: *Do we value a unit of wellbeing today more than a unit of wellbeing in the future simply because it happens today?*
      *   **The Ethical Weight:** If $\rho > 0$, you are effectively saying that future people matter less than current people purely because of when they are born. Frank Ramsey (the guy who invented this) called this "ethically indefensible and arises merely from the weakness of the imagination."
  *   **$\eta \cdot g$ (Eta times Gamma): The Wealth Effect.**
      *   **$\eta$ (Eta):** The elasticity of marginal utility of consumption. This measures how quickly the value of an extra dollar diminishes as you get richer.
      *   **$g$:** The expected growth rate of per capita consumption.
      *   **The Economic Logic:** This is your friend's argument. If future generations are richer than us ($g > 0$), then an extra dollar is worth less to them than it is to us. Therefore, we should invest less to save them a dollar than we would spend to save ourselves a dollar.

  ### 2. Why Keeping Them Apart Matters (The "Shady" Part)

  You told your friend he is "sneaking it in under the same label." He is. Here is why that distinction is critical:

  **A. Ethics vs. Forecasting**
  *   **$\rho$ is Normative (Ethical):** There is no "correct" number for $\rho$. It is a moral choice. Setting $\rho = 0$ means you believe a life in 2100 is worth exactly as much as a life in 2024. Setting $\rho = 3\%$ means you believe a life in 2100 is worth a fraction of a life today.
  *   **$\eta \cdot g$ is Positive (Empirical):** This is a forecast about the economy. Will they be richer? How much does money matter to rich people?

  If you lump them together into one "discount rate," you hide the ethical choice inside an economic forecast. You can say, "I'm using a 5% discount rate," which sounds like a neutral market number. But if that 5% is made up of a 3% pure time preference ($\rho$), you have silently inserted the ethical claim that future generations matter significantly less than we do.

  **B. The "Rich Future" Trap**
  Your friend's argument relies entirely on the $\eta \cdot g$ term. It assumes future generations will be richer ($g$ is positive).
  *   **The Problem:** Climate change might cause $g$ to be negative. If climate damages crash the economy, future people could be *poorer* than us.
  *   **The Consequence:** If $g$ is negative, the $\eta \cdot g$ term becomes negative. This implies we should sacrifice *more* now to help them, because a dollar will be worth *more* to them than to us.
  *   **The Conflation Risk:** If you have conflated $\rho$ and $\eta \cdot g$ into one big number, you might keep discounting the future heavily even if the economy collapses. By separating them, you admit: "I only discount because I think they'll be rich. If they aren't rich, the discount disappears."

  ### 3. Bonus: Stern vs. Nordhaus

  This distinction is literally the entire plot of the most famous debate in climate economics.

  **The Stern Review (2006)**
  *   **Nicholas Stern** took the philosophical high ground. He argued that discriminating against people based on their date of birth is unethical.
  *   **His $\rho$:** He set pure time preference ($\rho$) to **0.1%** (effectively zero).
  *   **The Result:** Because he refused to discount the future ethically, his overall discount rate ($r$) was very low (~1.4%). This mathematically necessitates aggressive, expensive action *today* to prevent damages *tomorrow*.

  **William Nordhaus (The Counter-Argument)**
  *   **William Nordhaus** (who later won the Nobel Prize) argued that we should use "revealed preference." We observe that people in markets *do* discount the future (interest rates are positive), so our climate models should match real-world behavior.
  *   **His $\rho$:** He used a much higher pure time preference (implied $\rho$ around 1.5% to 3%+).
  *   **The Result:** His overall discount rate was higher (~4–6%). This implies we should do *less* now and let future generations (who are richer) handle more of the burden.

  **The Fight:**
  Stern accused Nordhaus of embedding an unethical bias against the future. Nordhaus accused Stern of using a rate so low it was inconsistent with how humans actually make decisions. The core of the fight was not about the science of warming; it was about the value of **$\rho$**.

  ### The Tiebreaker Verdict

  **You win.**

  Your friend is correct that **diminishing marginal utility** (the $\eta \cdot g$ part) is a valid reason to transfer less wealth to the future *if* they are richer.

  However, he is incorrect to label that "pure time preference" or to use it to justify the ethical concept of discounting time itself.
  *   **Pure Time Preference ($\rho$):** "I care less about you because you are born in 2100." (Ethically controversial).
  *   **Diminishing Utility ($\eta \cdot g$):** "I care about you equally, but you'll have more money, so this specific dollar helps you less." (Economically logical).

  By conflating them, he is masking an ethical judgment (that the future matters less) inside an economic assumption (that the future will be rich). Economists keep them separate precisely to prevent people from doing exactly what your friend is doing: making the "shady" ethical move look like a neutral calculation.

  **Tell him:** "You're describing the wealth effect ($\eta \cdot g$), not pure time preference ($\rho$). If you set $\rho$ to zero but keep your argument, we might agree. But if you use your argument to justify a high $\rho$, you're saying future lives matter less intrinsically, which is the Stern/Nordhaus debate in a nutshell."
