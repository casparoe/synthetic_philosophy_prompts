      *Refining the Computationalism Follow-up:* If she says "It's conditional," the counter is "Conditionals with low priors don't guide action."
      *Refining the SSA Follow-up:* If she says "SIA is presumptuous," the counter is "Is SSA less presumptuous in this specific context?"

      *Let's assemble.*

