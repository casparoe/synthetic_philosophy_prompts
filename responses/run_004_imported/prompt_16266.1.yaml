          *   *Refinement:* Focus on "epistemic closure." If the simulators can edit our physics, is there *any* evidence count against it? If not, is it Bayesian noise?
          *   *Follow-up:* She might say "It changes our ethics." Press on whether ethics based on potentially fake suffering matters.

      *   *Filling the remaining 4-5 questions:*
