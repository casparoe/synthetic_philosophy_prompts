          3.  At least one question on falsifiability/practical upshot vs. unfalsifiable metaphysics. *Must include a follow-up.*
      *   **Tone:** Intellectual but accessible (podcast format), rigorous enough for someone studying formal epistemology.

  2.  **Deconstruct the Simulation Argument (SA) & Anthropics:**
      *   *The Trilemma:* (1) Civilizations go extinct before post-humanity, (2) Post-human civilizations have no interest in running ancestor simulations, (3) We are almost certainly in a simulation.
      *   *The Engine:* The argument relies on a principle of indifference regarding reference classes (Self-Sampling Assumption - SSA). If there are vastly more simulated minds than biological ones, and you assume you are a random sample from the set of all observers, you are likely simulated.
      *   *The Doomsday Argument (DA):* Also uses SSA. If you assume you are a random sample of all humans who will ever live, and you find yourself relatively early in the timeline (e.g., human #60 billion), it suggests the total number of humans won't be vastly larger (e.g., not #60 trillion). This implies early extinction.
      *   *The Tension:* SA suggests a huge future (post-humanity running sims), while DA suggests a short future (extinction). They seem to pull in opposite directions using similar anthropic machinery.
      *   *SIA (Self-Indication Assumption):* "You should reason as if you are a random sample from the set of all *possible* observers, weighted by the probability of their existence." SIA tends to favor hypotheses with more observers. SIA often undermines DA (because a long future has more observers, making your existence more likely) but can also undermine SA (depending on formulation) or change the probabilities significantly.
      *   *Computationalism:* SA requires that simulations can be conscious. If substrate independence is false, sims are just math, not observers, and the reference class collapses.
      *   *Falsifiability:* If the simulators hide evidence, can we ever know? Does believing this change how we act?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: SSA, DA, and SIA.*
