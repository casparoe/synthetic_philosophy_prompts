          *   *Refinement:* Frame it as a "joint probability." Even if it's conditional, the prior for computationalism drags down the posterior for the simulation hypothesis. Can we really treat them as independent modules?
          *   *Follow-up:* She might say "We should bracket it." Press on whether bracketing it makes the argument practically irrelevant for *us* as biological beings unsure about our own consciousness nature.

      *   *Requirement 3: Falsifiability/Upshot.*
