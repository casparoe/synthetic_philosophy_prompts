answer: |-
  Your instinct is mathematically sound, but your experience is epistemologically astute. You have stumbled upon the tension between **ideal Bayesian updating** and the **psychology of testimony.**

  To answer your question directly: In a closed mathematical system, order should *not* matter. But in the real world of journalism and human testimony, it can be entirely **rational** for the order to change your conclusion, provided that the *meaning* or *weight* of the second piece of evidence shifts based on the context provided by the first.

  Here is why your intuition is both right and wrong, and why your "certain evidence" test case behaves differently.

  ### 1. The Mathematical Ideal: Commutativity
  In formal probability theory, evidence is **commutative**. If $H$ is your hypothesis (executives knew) and $E_1$ and $E_2$ are your two pieces of evidence, Bayes' Theorem dictates:

  $$P(H | E_1, E_2) = P(H | E_2, E_1)$$

  If you treat the compliance officer's "70%" and the engineer's "60%" as fixed likelihood ratios—immutable numbers plugged into a formula—the order of operations is irrelevant. If you find yourself landing on different final probabilities solely due to sequence, a strict logician would call this a **processing error** (likely an anchoring bias, where the first number sets a mental scale that the second number fails to fully adjust).

  ### 2. The Rational Exception: Meta-Evidence
  However, you are not processing numbers; you are processing **testimony**. In investigative reporting, the evidence is not the *fact* (that the memo existed); the evidence is the *statement* (that the officer *says* the memo existed).

  When evidence is probabilistic, you are forced to evaluate the **reliability of the source** simultaneously with the **content of the claim**. This introduces "meta-evidence." The order matters rationally if the first piece of testimony changes your assessment of the second source's reliability or independence.

  Consider these two scenarios:

  *   **Scenario A (Officer First):** You hear from the compliance officer first. She establishes a narrative of formal documentation ("warning memo"). When the engineer later says "60-40," you might interpret his uncertainty as a lack of access to formal channels. You weigh his testimony as *corroborative but secondary*.
  *   **Scenario B (Engineer First):** You hear from the engineer first. He establishes a narrative of verbal discussion ("CEO meeting"). When the compliance officer later says "70%," you might wonder if her memory of the memo is actually a reconstruction based on the same meeting the engineer described. You might weigh her testimony as *potentially contaminated by the same rumor mill*.

  In Scenario A, the evidence feels additive (Document + Verbal). In Scenario B, it feels potentially redundant (Verbal + Document derived from Verbal).

  If the order changes your assessment of **independence**, it rationally changes the final probability. Two independent 70% signals are much stronger than two correlated 70% signals. Since you cannot know for sure if they are independent until you have the full picture, the sequence in which you build that picture can legitimately alter your weighting of the second source.

  ### 3. Why the "Certain Evidence" Test Case Failed
  You asked what is wrong with your control case, where order didn't matter when the evidence was certain. Nothing is "wrong" with it; rather, **certainty removes the variable that causes the drift.**

  When a source says, "I saw the memo" (100% certainty), you do not need to weigh their reliability against the probability of the event. The evidence collapses the probability space.
  *   If Source A says "It happened" (100%) and Source B says "It happened" (100%), the result is 100% regardless of order.
  *   There is no ambiguity to interpret, no hedging to contextualize, and no reliability curve to adjust.

  Uncertain evidence ("70%," "60-40") requires you to perform **interpretive labor**. You have to decide what "70%" means. Does it mean "I saw it but lost it"? Or "I heard someone else saw it"? The first piece of evidence you hear often sets the **semantic context** for the second.
  *   If you hear "70%" first, "60%" sounds like *confirmation*.
  *   If you hear "60%" first, "70%" sounds like *escalation*.

  In the certain test case, the semantic context is fixed. In the probabilistic case, the context is fluid. Therefore, the order matters not because the math is different, but because the **inputs** (the interpreted meaning of the testimony) are actually different.

  ### 4. How to Fix Your Process
  Since you are writing for a general audience, you need a conclusion that defends against the charge of bias. Here is how to neutralize the order effect:

  1.  **Assume Minimum Independence:** Treat the sources as if they are *less* independent than they appear. If the order makes you feel they are corroborating, deliberately downgrade the second source's weight to account for potential shared information environments (e.g., office rumors).
  2.  **Normalize the Hedges:** "70%" and "60-40" are linguistic, not mathematical. Translate them into categories. Both are essentially saying, "I have strong reason to suspect, but no smoking gun." If you treat them as the same *class* of evidence rather than distinct probabilities, the order becomes less influential.
  3.  **The "Blind" Test:** You already did this mentally. Now, do it explicitly in your notes. Write out the argument for "Executives Knew" using *only* the combined facts, stripping away the narrative of who spoke when. If the story holds up without the sequence, you're safe.

  ### Summary
  Is it rational for order to matter? **Yes**, but only because uncertain testimony carries **contextual weight** regarding source reliability and independence, which changes as your context grows.

  Is your "certain evidence" test case flawed? **No**, but it is a control that lacks the variable causing the effect. Certainty eliminates the need to interpret reliability, thereby eliminating the mechanism that makes order relevant.

  Your nagging feeling isn't a math error; it's a sign that you are correctly treating your sources as human witnesses rather than data points. In journalism, that is usually a feature, not a bug. Just ensure that when you write the piece, you rely on the *convergence* of their accounts, not the *sequence*.
