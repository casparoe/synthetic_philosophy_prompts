  2.  **Determine the Core Argument/Narrative Arc:**
      *   *Introduction:* Welcome the new citizens. Acknowledge the weight of the day. Introduce Douglass not just as an icon, but as a thinker who changed his mind.
      *   *Body Paragraph 1: The Early View.* Explain *why* Douglass hated the Constitution initially (Garrisonian view). It wasn't abstract; it was about the reality of chattel slavery. The text protected the institution.
      *   *Body Paragraph 2: The Turning Point.* The break with Garrison (1851). Why did he change? Close reading of the text. The absence of the word "slave." The Preamble's promise vs. the practice.
      *   *Body Paragraph 3: The Nuance.* He didn't think the Constitution *was* freedom yet; he thought it *commanded* freedom. It was a tool, a weapon, a promise to be claimed.
      *   *Body Paragraph 4: Connection to New Citizens.* How does this relate to taking the Oath? You aren't swearing to a perfect history, but to a framework of potential. You are inheriting the work.
      *   *Conclusion:* Call to action. The Constitution is what we make it. Welcome home.

