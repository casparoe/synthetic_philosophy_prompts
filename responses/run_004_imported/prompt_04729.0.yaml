  6.  **Final Polish:** (Writing the speech with attention to rhythm and cadence suitable for oral delivery.) *Self-correction: Ensure I explicitly mention the "covenant with death" quote and the "glorious liberty document" quote as requested.*

  *(Drafting process involves balancing the historical weight with the celebratory nature of naturalization. The key is to frame the Constitution not as a static artifact, but as a living argument that the new citizens are now joining.)*

  7.  **Final Word Count Check:** Aiming for ~1,200 words.
