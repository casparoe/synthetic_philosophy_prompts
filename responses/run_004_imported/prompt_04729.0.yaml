      *   **Opening:** Start with the gravity of the Oath. Acknowledge Constitution Day.
      *   **The Douglass Hook:** Everyone knows the 1852 speech ("What to the Slave..."). But today, we look at his relationship with the *document* you are about to swear allegiance to.
      *   **The "Covenant with Death":** Be honest. In the 1840s, Douglass agreed with Garrison. Why? Because the Constitution protected slavery (3/5ths, Fugitive Slave Clause). To swear allegiance to it felt like swearing allegiance to chains. This validates the skepticism new citizens might feel about American history.
      *   **The Shift (1851):** This is the crux. He read the text. He realized the words "slave" and "slavery" are absent. He realized the Preamble ("secure the Blessings of Liberty") applies to *all*. This wasn't a betrayal of his people; it was a strategic reclaiming of the law.
      *   **The "Glorious Liberty Document":** Explain what he meant. It wasn't that America *was* free. It was that the Constitution *demanded* freedom. It was a promise waiting to be kept.
      *   **The Historian Nod:** Need to acknowledge the expert in the room without making it awkward. Maybe a line about "those who study the text know..."
      *   **Addressing the New Citizens:** You are taking the Oath. You know America has flaws. Douglass teaches us that loving the Constitution isn't blind loyalty; it's active participation. It's holding the country to its own highest standards.
      *   **Closing:** The Oath is the beginning, not the end. Welcome.

  4.  **Refining and Polishing (Self-Correction during drafting):**
