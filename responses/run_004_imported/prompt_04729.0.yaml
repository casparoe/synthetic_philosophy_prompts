answer: |-
  Good morning. To the families and friends gathered here: welcome. To the candidates for naturalization: welcome home.

  There is a profound weight to the moment you are about to experience. In a few minutes, you will raise your right hand and recite the Oath of Allegiance. You will promise to support and defend the Constitution of the United States. For many of you, this document represents safety, opportunity, and a new beginning. But you are also smart enough to know that this document has a complicated history. You know that the story of America is not a straight line from darkness to light. It is a struggle.

  On this Constitution Day, I want to talk to you about a man who understood that struggle better than almost anyone. You likely know Frederick Douglass. If you have heard of him, you probably know him as the man who stood in Rochester in 1852 and asked, "What to the Slave is the Fourth of July?" You know him as the critic who laid bare the hypocrisy of a nation celebrating liberty while holding human beings in chains.

  But today, I want to introduce you to a different Frederick Douglass. Or rather, I want to introduce you to the evolution of his mind regarding the very paper you are about to swear to.

  For the first decade of his public life, Douglass did not believe the Constitution was worthy of allegiance. He stood alongside the abolitionist William Lloyd Garrison. Together, they looked at the Constitution and saw a moral catastrophe. They saw the Three-Fifths Clause, which counted enslaved people as property rather than persons. They saw the Fugitive Slave Clause, which demanded the return of those who escaped bondage. They saw federal protections for the slave trade that lasted for twenty years.

  To the young Douglass, a man who had worn the yoke of slavery himself, the Constitution was not a charter of freedom. It was, in Garrison's famous words, "a covenant with death and an agreement with hell." To swear allegiance to it felt like swearing allegiance to the whip and the chain. For Douglass to reject the Constitution was an act of moral consistency. It was a refusal to legitimize a system built on his own suffering.

  But history is rarely static, and neither was Douglass.

  Around 1851, Douglass underwent a painful, public transformation. He broke with Garrison. He risked old friendships and faced accusations of betrayal from former allies. Why? Because he began to read the text differently.

  Douglass came to realize that the words "slave" and "slavery" appear nowhere in the Constitution. The document speaks of "persons held to service or labor." It uses euphemisms. Douglass argued that these were not endorsements of slavery, but concessions to political reality that did not alter the document's fundamental principles. He looked to the Preamble. He looked to the guarantees of due process. He looked to the promise to "secure the Blessings of Liberty to ourselves and our Posterity."

  He concluded that the Constitution was not a pro-slavery document, but an anti-slavery document waiting to be enforced. He famously came to call it "a glorious liberty document."

  Now, I see a distinguished constitutional historian seated in the front row, and I know scholars still debate the nuances of Douglass's textual analysis. But the power of Douglass's shift was not merely legal; it was strategic and moral. He did not change his mind because slavery had ended. It hadn't. He changed his mind because he realized that rejecting the Constitution meant abandoning the most powerful tool available to fight for justice.

  Douglass taught us that the Constitution is not a description of reality; it is a command for what reality ought to be. He understood that loving the Constitution does not mean ignoring the nation's sins. It means using the nation's own highest laws to cure those sins.

  This is the legacy you inherit today.

  When you take the Oath in a few moments, you are not swearing that American history is perfect. You are not swearing that injustice does not exist. You are swearing allegiance to a framework. You are joining a project.

  Douglass's journey from calling the Constitution a "covenant with death" to a "glorious liberty document" teaches us that citizenship is not passive. It is not enough to simply enjoy the protections of the law. We must interpret the law. We must argue over the law. We must hold the government accountable to the promises written in that parchment.

  To the new citizens before me: You come from many places. Some of you come from nations where the law is a weapon used by the powerful against the weak. In this country, the Constitution is designed to be a shield for the weak against the powerful. But a shield is useless if no one picks it up.

  Douglass picked it up. He used the First Amendment to speak when he was told to be silent. He used the Fourteenth Amendment to demand equality when he was told to know his place. He showed us that the Constitution belongs to those who use it.

  There will be days when you look at this country and you will feel the shadow of Douglass's early critique. You will see inequalities. You will see gaps between our ideals and our actions. On those days, do not turn away. Do not cynically reject the promise. Instead, remember Douglass's later wisdom. Remember that the text is on your side. The Preamble is on your side. The Bill of Rights is on your side.

  The Constitution is not a finished building; it is a blueprint. It requires builders. It requires architects. It requires citizens who are willing to do the hard work of "forming a more perfect Union." Note the verb: *forming.* It is present tense. It is ongoing. It is never done.

  By taking this Oath, you are stepping into that current. You are saying that you are willing to engage in the argument. You are willing to struggle for the meaning of liberty.

  Frederick Douglass eventually argued that the Constitution was a weapon for liberation, but only if free people were willing to wield it. Today, you become those free people. You are taking the tool that Douglass fought for, that soldiers died for, that marchers bled for, and you are putting your hand on it.

  So, when you raise your right hand, know what you are touching. You are touching a history of struggle. You are touching a document that has been used to justify both oppression and emancipation. And you are making a promise that the next chapter will be written in the spirit of liberty.

  Welcome to the argument. Welcome to the work. Welcome to the United States.

  Thank you.
