          *   *Goal:* Minimize prediction error (next token prediction) or align with human preference (RLHF).
      *   *Proper Function:* What is the network *supposed* to do?
          *   Predict the next token statistically.
          *   Or, in RLHF, produce helpful/harmless responses.
      *   *The Content:* If the function is "predict next token," does the internal state represent "the statistical likelihood of tokens" or "the world the tokens describe"?
          *   *Millikan's View:* She emphasizes *consumer* systems. A representation needs something that *uses* it to guide action. LLMs generate text, but do they *use* their internal states to guide their own survival/goals? No, they don't have goals outside the training objective.

