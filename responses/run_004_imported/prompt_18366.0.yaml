  2.  **Deconstruct Teleosemantics:**
      *   *Core Idea:* Content is fixed by *proper function*. Proper function is fixed by *selection history* (evolution or learning).
      *   *Key Mechanism:* A state $S$ represents $X$ because the mechanism producing $S$ was selected *for* correlating with $X$ to achieve some goal (survival, reward, error reduction).
      *   *The Frog Example:* Snap mechanism selected for catching flies. Content = "Fly there." Error (BB pellet) is a malfunction, not a different content.

