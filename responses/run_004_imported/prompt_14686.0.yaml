      *   *Nuance:* The "Rigidity Condition" is the main culprit. If the conditional probabilities $P(H|E)$ change during the update (because the *meaning* of E changes), JC doesn't apply anyway.
      *   *Key Distinction:* Distinguish between *uncertain evidence* (Jeffrey) and *uncertain likelihoods*.
      *   *Reference:* Mention the "Bayes Factor" solution (Field 1978, Wagner 2002) as the technical fix for commutativity. This shows deep engagement.

