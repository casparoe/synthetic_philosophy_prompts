prompt: |-
  I'm working on a longer piece about "unknowable truths" in science and philosophy, and I had a philosopher friend on the phone helping me sanity check some of the framing. At some point she stopped me and said, more or less, "careful, there's this old logic result called Fitch's paradox of knowability, and a lot of people think it basically wrecks the whole idea that an unknowable truth is even a coherent category." She tried walking me through it with K's and diamond operators and lots of little p's, and I nodded along but honestly lost the thread on the modal logic bit. What I think I understood is: if you just assume every true statement could in principle be known by someone (even if nobody actually knows it right now), you can somehow squeeze out of that the much stronger conclusion that every true statement actually is known -- which is obviously nuts, so somethings gotta give in the setup.

  She said the paradox was originally aimed at verificationists and anti-realists who basically define truth as knowability, not at scientists talking about stuff like what's beyond the cosmological horizon or lost to chaos and decoherence. But I can't shake the feeling it has some bearing on my piece anyway, and I'd rather understand it properly than just namedrop it and hope nobody who actually knows logic reads my article. Could you lay out the most important implications of Fitch's paradox -- both for that original realism/anti-realism debate (what does it actually force those philosophers to give up?), and for whether it should make me more careful about how I use phrases like "unknowable in principle" when I'm writing for a general audience about the frontiers of science?
