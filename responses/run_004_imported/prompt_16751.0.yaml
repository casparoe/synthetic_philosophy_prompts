answer: |-
  It is a pleasure to correspond with someone who sees the structural isomorphism between statistical ensembles and social welfare functions. You are right to sense that the "ex-ante/ex-post confusion" dismissal from your friend is too quick. It relies on a specific, and arguably question-begging, definition of what constitutes a "consequence" in the expected utility calculus.

  To make the strongest case for Diamond (and against the Harsanyi derivation in this specific context), we need to show that the preference for the coin flip is not a confusion about realized outcomes, but a rational valuation of an *ex-ante* property that Harsanyi's framework arbitrarily excludes.

  Here is the argument, structured to directly engage your friend's objection.

  ### 1. The Friend's Objection: A Category Error in the State Space

  Your friend's claim is that preferring the coin flip involves "smuggling in facts about the realized outcome." The logic runs like this: Once the coin lands, we are in the exact same physical state as if the planner had simply chosen person 1 (or 2) outright. One person has the good; one does not. If you prefer the coin flip, you must be valuing the *history* of the decision over the *state* of the world. In standard decision theory, rational agents are supposed to care about final states (consequences), not the path taken to get there. Therefore, your intuition is irrational nostalgia for a road not taken.

  This argument fails because it misidentifies the "consequence."

  In social choice, a "state of the world" is not merely a physical inventory of who holds which objects. It includes the *institutional and normative relationships* between the agents. When a planner hands the good to Person 1 without a process, Person 2 is not just without the good; Person 2 has been *ignored*. When a planner flips a coin, Person 2 is without the good, but Person 2 has been *recognized as an equal claimant*.

  This distinction is fully realized **ex-ante**. At the moment the decision is made, the social relationship between the planner and the agents is fixed.
  *   **Option A (Give to 1):** The planner establishes a dictatorship. Person 2's claim is voided immediately.
  *   **Option C (Coin):** The planner establishes a lottery. Person 2's claim is honored as equal to Person 1's, even if the stochastic realization later goes against them.

  Your friend argues that caring about this is "ex-post confusion." But the "fairness" is not in the landing of the coin (ex-post); it is in the *assignment of probabilities* (ex-ante). The equal probability *is* the ex-ante good. To say that valuing equal probabilities is an ex-post confusion is to claim that probabilities themselves have no moral weight until they collapse into certainties. But in decision theory, probabilities *are* the object of choice. If I choose a lottery over a sure thing, I am choosing the probability distribution, not the realization. Diamond is simply arguing that the *distribution of chances* is itself a constituent of welfare, independent of the distribution of goods.

  ### 2. The "Richness" of the Consequence Description

  Harsanyi's Aggregation Theorem derives Utilitarianism from the Pareto principle and the Independence axiom, provided we define individual utilities over a specific domain. The theorem holds that if everyone prefers Lottery $L$ to Lottery $L'$, society must too.

  In the Diamond example, under the standard description ("Who gets the good?"), both individuals are indifferent between "Give to 1" and "Flip Coin" *if* they are risk-neutral.
  *   Person 1: Sure 1 util vs. 0.5 chance of 1 util (Expected 0.5). Wait—if they are risk neutral, they prefer the sure thing.
  *   *Correction:* In the standard Diamond setup, we assume the individuals are behind a veil of ignorance or we look at the sum. Let's stick to your setup: Symmetric utilities, risk neutrality.
      *   Option A: P1 gets 1, P2 gets 0. Sum = 1.
      *   Option C: P1 gets 0.5 exp, P2 gets 0.5 exp. Sum = 1.

  If the individuals are purely self-interested and risk-neutral, Person 1 actually *prefers* Option A, and Person 2 *prefers* Option B. So Pareto doesn't force indifference; it actually creates a conflict. Harsanyi resolves this by summing expected utilities.

  However, Diamond's point is that if we expand the consequence description to include "being treated fairly," the individuals' preference orderings change.
  *   Person 2 might prefer a 50% chance + Fair Treatment over a 0% chance + Dictatorial Exclusion, even if the expected material utility is lower.
  *   If we accept that "Fair Treatment" is a genuine good (a "process good"), then the individuals themselves might rank the Coin Flip higher ex-ante than the Dictatorial Allocation.

  Your friend's objection ("you're smuggling in ex-post facts") is essentially a demand that we restrict the domain of "utility" to material outcomes only. This is a philosophical stipulation, not a mathematical necessity. If we allow utility to be defined over **social states** (which include procedural justice) rather than just **physical allocations**, the Harsanyi theorem still works, but it no longer yields the result that the planner should be indifferent. It yields the result that the planner should maximize the sum of (Material Utility + Procedural Utility).

  The friend's claim that this is "confusion" is only valid if one assumes *a priori* that procedural justice has no utility value. But that is exactly what is at issue. To assert it is to beg the question against Diamond.

  ### 3. Ex-Ante Pareto vs. Ex-Post Pareto

  There is a deeper technical point here that resonates with your physics background. It concerns the commutativity of aggregation and expectation.

  Harsanyi's theorem essentially assumes that Social Welfare $W$ is the expectation of the sum of utilities:
  $$ W = E[\sum u_i] = \sum E[u_i] $$
  This assumes linearity and that the "value" of the lottery is just the weighted average of the values of the outcomes.

  Diamond argues that there is a value in the **dispersion of probabilities** itself. In thermodynamics terms, your friend is arguing that the entropy of the distribution doesn't matter, only the average energy. Diamond is arguing that for social systems, the entropy (the spread of opportunity) is itself a thermodynamic variable that contributes to the free energy of the system.

  Consider the **Ex-Ante Pareto Principle**: If every individual prefers Lottery $L$ to Lottery $L'$ based on their expected utility, society should too.
  Consider the **Ex-Post Pareto Principle**: If every individual prefers Outcome $O_1$ to Outcome $O_2$ in every state of the world, society should too.

  In the coin flip case:
  *   **Ex-Post:** In the world where P1 wins, P1 prefers "Give to 1" (sure thing) over "Coin" (because the coin was unnecessary risk? No, if they won, they are indifferent between "Given" and "Won"). Actually, if P1 wins the coin, they have the good. If P1 was given the good, they have the good. Ex-post, they are in the same state.
  *   **Ex-Ante:** Before the coin is flipped, do they prefer the coin? Only if they value fairness.

  The friend's argument relies on the idea that the only "real" outcomes are the ex-post states. But this ignores that human agents live in the ex-ante state for a significant duration. The *security of knowing one has an equal chance* is a psychological and sociological reality that exists *before* the collapse of the wavefunction.

  If I tell you, "I have decided to give you nothing, but I flipped a coin to decide whether to give you nothing or everything, and you lost," you feel treated differently than if I say, "I decided to give you nothing." The physical outcome is identical. The ex-ante reality was different. The friend calls valuing this difference "confusion." I call it recognizing that **information about the decision procedure is part of the agent's environment.**

  ### 4. The "Spurious Indifference" Problem

  Finally, consider the practical implication of accepting your friend's view. If the planner is truly indifferent between "Give to 1" and "Flip Coin," then the planner should also be indifferent between "Flip Coin" and "Flip a Coin to Decide Whether to Give to 1 or Flip a Coin."

  This leads to an infinite regress of randomization that adds no value. But more importantly, it strips the planner of the ability to signal **impartiality**.

  In game theory and mechanism design, the *procedure* constrains future behavior. A planner who establishes a precedent of flipping coins signals that they do not play favorites. A planner who arbitrarily picks Person 1 signals that they might pick Person 1 again next time. The "fairness" intuition is tracking the **stability of the social equilibrium**.

  If we treat the coin flip as morally equivalent to arbitrary selection (as Harsanyi's indifference suggests), we destroy the incentive compatibility of the system. Person 2, seeing Person 1 get the good arbitrarily, updates their belief that the planner is biased. Person 2, seeing the coin flip, updates their belief that the planner is impartial. These are different ex-ante states with different ex-post consequences for future cooperation.

  Therefore, the preference for the coin flip is not a confusion about the current realized outcome; it is a rational assessment of the **informational content of the procedure** regarding future states. Your friend's "ex-post" critique ignores the dynamic, repeated-game nature of social choice. Even in a one-shot game, the "type" of the planner is revealed by the choice of mechanism.

  ### Conclusion

  The strongest case for Diamond is not that we should abandon Expected Utility theory, but that we must reject the **narrow description of consequences** that your friend is defending.

  1.  **Fairness is Ex-Ante:** Equal probability is a property of the decision *before* the outcome is realized. Valuing it is not ex-post confusion.
  2.  **Procedural Utility:** "Being treated as an equal" is a genuine good that agents consume ex-ante. Excluding it from the utility function is an arbitrary restriction, not a requirement of rationality.
  3.  **Signaling:** The procedure conveys information about the planner's impartiality, affecting the stability of the social system.

  Harsanyi's theorem is mathematically sound, but it is an *if-then* statement. **If** social welfare depends only on the sum of individual expected utilities over material outcomes, **then** the planner must be indifferent. Diamond's contribution is to show that the antecedent is false. Social welfare also depends on the distribution of chances.

  Your friend is defending the math of the theorem by stipulating away the sociology of the variables. As a physicist, you know that a model is only as good as its variables. If you leave "fairness" out of the Hamiltonian, you shouldn't be surprised when the model fails to predict the ground state of the system. The intuition isn't confused; the model is underspecified.
