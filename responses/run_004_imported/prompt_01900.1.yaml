prompt: |-
  I'm a novelist, and my publisher has asked me to write a short craft essay for the launch of my new book — but I've stalled on exactly the question the essay is supposed to resolve, so I'm hoping you can help me reason through it before I write a word of it.

  The novel follows a Guatemalan family in Ohio in the months after the father is detained by ICE. Two early readers, independently, used almost the same phrase: it "reads like an op-ed with characters in it." Their complaint isn't that the politics are wrong; it's that the characters seem to exist to make a point, that outrage is doing work craft should be doing, and that message-driven "issue novels" tend to curdle fast once the news cycle that produced them has passed.

  My instinct is to push back using Du Bois, but I want to make sure I'm using him honestly rather than just conveniently. Here's the reasoning so far, in note form:

  1. In "Criteria of Negro Art" (1926), Du Bois doesn't concede that propaganda undermines art — he insists that "all art is propaganda," and that he cares nothing for art that isn't. If even a critic as invested in beauty as Du Bois believed this, maybe "it reads like propaganda" isn't the indictment my readers think it is.

  2. But I suspect that's too quick. Du Bois isn't defending message-driven art in general; he's defending the right of a specific, systematically silenced group to counter-propagandize against a culture already saturated with the other side's propaganda dressed up as neutral fact. That's much narrower than "issue novels are fine," and I'm not sure my book — about a different group, a different injustice, a century later — is entitled to borrow the moral force of an argument built for that particular asymmetry.

  3. Alain Locke's rebuttal complicates things further: he thought that even righteous propaganda keeps art reactive, orbiting the very audience it's protesting, rather than self-possessed — and that the artist's real task was individual expression that happened to land as universal. If Locke has a point, my readers' unease might be tracking something Du Bois's slogan doesn't actually dissolve.

  4. Tellingly, when Du Bois's own magazine ran its 1926 symposium asking writers how the Negro should be portrayed in fiction, most respondents — sympathetic readers, several of them — still resisted the idea that Black artists owed their work to any cause at all.

  So: does this line of reasoning give me a real defense, or does it mostly show that "reads like propaganda" was never quite the right complaint to begin with — in which case I still don't know what to do about my book? I'd welcome comments on whether I've got Du Bois and Locke right, whether note 2's worry about borrowed moral force is fatal to my using Du Bois at all, and whether any of this is a genuinely interesting way into the essay or just a detour.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A novelist (Guatemalan family in Ohio, father detained by ICE).
      *   **Task:** Writing a short craft essay for a book launch.
      *   **Problem:** Stalled because early readers criticized the book as "an op-ed with characters in it" (didactic, message-driven, outrage over craft).
      *   **Current Strategy:** Wants to use W.E.B. Du Bois's "Criteria of Negro Art" (1926) to defend the work (i.e., "All art is propaganda").
      *   **Internal Conflict:** Suspects this might be a convenient but dishonest use of Du Bois (Note 2). Acknowledges Alain Locke's counter-argument (Note 3). Notes that even Du Bois's contemporaries resisted the "cause" mandate (Note 4).
      *   **Goal:** Wants feedback on the reasoning (Du Bois/Locke accuracy), the ethical validity of borrowing Du Bois's argument (Note 2), and whether this is a good angle for the essay or a detour.

  2.  **Evaluate the Reasoning (Notes 1-4):**
      *   *Note 1 (Du Bois's stance):* Accurate. Du Bois did argue "all art is propaganda" in that specific essay. He was tired of "art for art's sake" when his people were being dehumanized.
      *   *Note 2 (Contextual validity):* This is the crux. Du Bois was arguing against *white* gatekeepers telling Black artists they couldn't be political, while white art was *already* political (in favor of white supremacy). The user is writing about Guatemalan immigrants/ICE. Is the asymmetry similar? Yes, in terms of power dynamics (state power vs. marginalized community). But is it *exactly* the same? No. The worry about "borrowed moral force" is valid but perhaps surmountable if framed correctly. It's not about *identity* matching, but about the *function* of the art in a specific political climate.
      *   *Note 3 (Locke's rebuttal):* Accurate. Locke worried about "reactive" art. If you only write against oppression, you are defined by oppression. This aligns with the readers' critique ("characters exist to make a point").
      *   *Note 4 (The Symposium):* Accurate. Many Black artists (Hughes, Hurston, etc.) had nuanced or divergent views. Artistic freedom was still prized.

  3.  **Address the Core Question: Defense or Detour?**
      *   *Is it a defense?* It *can* be, but a defensive essay is rarely a good craft essay. If the essay says "You guys are wrong, Du Bois says I'm right," it proves the readers' point (the author is dug in on the message).
      *   *Is it a detour?* It risks being one if it becomes a history lesson rather than a reflection on *this* book.
      *   *The Real Issue:* The readers aren't saying "Don't write about ICE." They are saying "The *craft* is subservient to the *message*." Du Bois argues message *is* the point. Locke argues craft/individuality *is* the point. The tension between them *is* the essay.

  4.  **Formulate the Advice:**
      *   **Validate the Research:** The user's understanding of Du Bois and Locke is sophisticated and mostly correct.
      *   **Address the "Borrowed Moral Force" (Note 2):** This is the ethical hinge. It's not fatal, but it requires nuance. The parallel isn't "I am Black like Du Bois," it's "I am facing a similar silencing mechanism." However, the bigger risk is using Du Bois as a shield rather than a lens.
      *   **Reframing the Essay:** Don't write an essay *defending* the book against the critique. Write an essay *exploring* the critique using Du Bois and Locke as interlocutors. The tension *is* the craft.
      *   **The "Op-Ed" Critique:** This is usually code for "I don't believe the characters are complex enough." Du Bois doesn't solve complexity. Locke points toward it.
      *   **Actionable Suggestion:** Use the Du Bois/Locke debate not to win an argument, but to show the *struggle* of writing the book. Did the author feel the pull of propaganda? Did they fight it? That vulnerability makes for a better launch essay.

  5.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Respectful, peer-to-peer (fellow writer/editor vibe), intellectually rigorous.
      *   *Structure:*
          1.  Validate the intellectual groundwork (You know your stuff).
          2.  Address the Du Bois/Locke accuracy.
          3.  Tackle the "Borrowed Moral Force" concern.
          4.  Pivot to the Essay Strategy (The most important part).
          5.  Specific suggestions on how to frame the argument.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Yes, use Du Bois." I need to warn them that using Du Bois to say "Propaganda is good" might alienate readers who want art. The essay needs to acknowledge the validity of the readers' concern while contextualizing the author's choice. The essay shouldn't be a shield; it should be a window.

      *Refining the Du Bois point:* Du Bois wasn't saying "bad art is okay if it's propaganda." He was saying "Black art *must* serve the race." He still demanded quality. The user's readers are saying the *quality* suffers because of the message. That's the gap.

      *Refining the Locke point:* Locke's "universal through individual" is exactly what the readers feel is missing. They feel the "universal message" is drowning the "individual character."

      *Conclusion:* The essay should be about the *tension* between Du Bois and Locke living inside the author's head while writing. That admits the flaw without conceding the mission.

  6.  **Final Polish:** Check against the user's specific questions (Do I have them right? Is Note 2 fatal? Is this interesting?). Ensure the advice is practical for a *book launch essay* (which needs to sell the book, not just win a debate).

  7.  **Final Output Generation:** (matches the provided good response).
answer: |-
  This is a sophisticated dilemma, and your notes suggest you are already thinking like the essayist you need to be. You are correctly identifying that a craft essay cannot simply be a defensive brief; it must illuminate the work.

  Here is a breakdown of your reasoning, followed by a suggestion on how to turn this intellectual tension into the essay itself.

  ### 1. Are you reading Du Bois and Locke correctly?
  **Yes.** Your summaries are historically and philosophically sound.

  *   **Du Bois:** In "Criteria of Negro Art," his declaration that "all Art is propaganda" is often quoted out of context. He was specifically countering the white critical establishment that demanded Black art be "universal" (read: white-neutral) while simultaneously consuming propaganda *against* Black humanity. He was arguing for the *legitimacy* of political intent, not the exemption from aesthetic rigor.
  *   **Locke:** You are also right about Locke. His concern in *The New Negro* and elsewhere was that "protest art" could become reactive, defining Black life solely through the lens of white oppression. He wanted art that asserted interiority, complexity, and self-possession.
  *   **The Symposium:** Your note on the 1926 symposium is crucial. It highlights that even within the Harlem Renaissance, there was no consensus. Hughes, Hurston, and others wrestled with this. It was a live wire, not a doctrine.

  ### 2. Is Note 2 fatal? (The "Borrowed Moral Force" worry)
  **It is not fatal, but it is a trap.**

  Your worry is ethical: *Am I allowed to use Du Bois's shield, forged in the fire of Jim Crow, to protect a novel about Guatemalan immigrants in 2024?*

  If you use Du Bois to say, "I am silenced like he was, therefore I am exempt from craft criticism," that is a misuse. It appropriates the moral weight without doing the work.

  However, if you use Du Bois to identify a **structural similarity in the function of art**, it holds up. The asymmetry Du Bois identified was: *One side gets to be "neutral art," the other side is "political agenda."* When your readers say "this reads like an op-ed," they are unconsciously enforcing that asymmetry. They are implying that a novel about a white family in Ohio dealing with grief is "universal," but a novel about a Guatemalan family dealing with ICE is "an issue."

  You can use Du Bois not to claim his specific moral authority, but to expose the double standard in the critique. That is honest.

  ### 3. Is this a defense or a detour?
  Currently, your reasoning leans toward **defense**. If the essay argues, "Du Bois says propaganda is fine, so my critics are wrong," you will prove your early readers' point: that you care more about the message than the art. It will feel combative and didactic—exactly what they accused the novel of being.

  **The Pivot:**
  The most compelling craft essay won't use Du Bois to *defeat* the critique. It will use the Du Bois/Locke tension to **admit the struggle.**

  Your readers are essentially channeling Alain Locke. They are saying: *I want to meet these characters as humans, not as symbols of injustice.*
  You are channeling Du Bois. You are saying: *In a time of crisis, can we afford art that does not speak to the injustice?*

  **The essay should be the record of that fight happening inside the book.**

  ### A Proposed Strategy for the Essay

  Don't write an essay that resolves the question. Write an essay that confesses the question haunted you while you wrote.

  **1. Validate the Readers (The Locke Moment)**
  Start by acknowledging the "op-ed" comment. Don't dismiss it. Admit that there were moments you felt the outrage curdling the prose. Admit that you worried the father was becoming a martyr rather than a man. This shows craft consciousness. It disarms the critic by agreeing that the risk is real.

  **2. Introduce the Counter-Weight (The Du Bois Moment)**
  Explain *why* you didn't pull back. Not because "all art is propaganda," but because silence felt like a greater aesthetic failure. You can cite Du Bois here, but frame it as a question you asked yourself: *Is it possible to write beautifully about this without writing politically?* Conclude that for this story, the answer was no. The politics are not the setting; they are the weather. You cannot describe the weather without mentioning the rain.

  **3. The Synthesis (The Craft Resolution)**
  Here is where you save the book. Argue that the "propaganda" critique misses where the actual art lives.
  *   **The Trap:** If the book is just about ICE winning or losing, it is an op-ed.
  *   **The Truth:** The book is about what happens to love *inside* the cage.
  *   **The Argument:** Du Bois was right that the art must serve the truth of the experience, but Locke was right that the truth lies in the individual, not the statistic.
  *   **The Claim:** Your novel attempts to use the *urgency* of Du Bois to force the reader into the room, but relies on the *interiority* of Locke to keep them there.

  ### Why this works for a Launch
  A launch essay needs to invite readers in, not build a wall.
  *   **If you defend:** You create a wall. (I am Right, You are Shallow).
  *   **If you confess:** You create a bridge. (I struggled with this, maybe you will feel it too).

  By framing the Du Bois/Locke debate as the **internal conflict of the writing process**, you transform the "op-ed" critique from a flaw into a feature of the book's DNA. You are telling the reader: *Yes, this book is angry. It is supposed to be. But I fought to make sure that anger didn't eat the people.*

  ### Summary of Advice
  1.  **Your scholarship is solid.** You aren't misusing Du Bois, provided you acknowledge the context.
  2.  **Note 2 is a warning, not a stop sign.** Do not claim Du Bois's specific racialized struggle as your own; claim his *aesthetic argument* regarding power and silence.
  3.  **Do not write a defense.** Write an excavation. Use the essay to show the readers you *heard* them, you wrestled with Locke's ghost, but you ultimately sided with Du Bois because the subject matter demanded it.

  This approach turns the "op-ed" critique into the central theme of your craft essay. It shows you are a writer who thinks deeply about form, which ironically proves the book is *not* just an op-ed.
