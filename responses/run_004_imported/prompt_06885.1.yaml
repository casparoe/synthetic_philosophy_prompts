      *   *Bet 1:* Pays if $P(H) > 0.45$. (Actually, usually framed as: Bet pays \$10 if Heads, costs \$X. Or more abstractly: A bet favorable if $P > 0.45$). Let's stick to the prompt's framing: Bet A is good if credence > 0.45. Bet B is good if credence < 0.55.
      *   *The Trap:*
          *   At Bet A: $0.4 \in [0.4, 0.6]$ says "Don't take" (expected value negative/low). $0.6$ says "Take". Imprecise rule says "Both permissible." Agent refuses.
          *   At Bet B: $0.6 \in [0.4, 0.6]$ says "Don't take". $0.4$ says "Take". Imprecise rule says "Both permissible." Agent refuses.
          *   *Result:* Agent gets 0. Taking both would have guaranteed profit.
      *   *Conclusion:* Imprecise credences + naive decision rule = dominated strategy. Sharp credences avoid this.

  3.  **Brainstorming Defenses for Maya (Imprecise):**
      *   *Defense 1: Decision Rules.* The problem isn't the credences; it's the decision rule. "Maximality" (choose if *some* $P$ in set says yes) is too weak. Need "E-admissibility" or "Gamma-Maximin" (choose if *all* $P$ say yes, or optimize worst-case).
