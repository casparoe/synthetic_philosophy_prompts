answer: |-
  Your friend isn't being difficult; she is pointing you toward the single most contentious and nuanced aspect of Bayesian statistics. Your intuition is shared by many people when they first encounter the Bem case—it *does* look like a slam dunk for Bayesian methods. However, the reality is that switching to Bayesian statistics would not have solved the replication crisis on its own, and in some ways, it introduces new complexities.

  Here is the breakdown of why the Bem case is famous, why your friend is right about "priors," and why Bayesian statistics are a tool rather than a savior.

  ### 1. The Bem Case: Why the Bayes Factor Changed the Verdict
  In 2011, Daryl Bem published *Feeling the Future*, claiming evidence for precognition. He used standard Null Hypothesis Significance Testing (NHST) and found $p < .05$ in 8 out of 9 experiments. By the standard rules of psychology at the time, this was "significant."

  Wagenmakers and colleagues re-analyzed the data using **Bayes Factors (BF)**. A Bayes Factor compares the likelihood of the data under the Null Hypothesis ($H_0$) versus the Alternative Hypothesis ($H_1$).
  *   **Frequentist ($p$-value):** Asks, "If there were no effect, how unlikely is this data?" (It doesn't tell you if the alternative is true, just that the null is unlikely).
  *   **Bayesian (BF):** Asks, "Is the data more likely under the null or the alternative?"

  Wagenmakers found the BF favored the null (no precognition). Bem's supporters argued the BF favored the alternative. **How could they look at the same data and get opposite Bayesian results?**

  ### 2. The "Priors" Problem (Your Friend's Point)
  This is the crux of the issue. To calculate a Bayes Factor for an effect, you have to specify a **prior distribution** for the Alternative Hypothesis. You have to tell the math what size effect you expect *before* you see the data.

  *   **Wagenmakers' Prior:** They used a "default" prior that was relatively skeptical. It assumed that if an effect existed, it could be anywhere from small to large, but placed a lot of weight on smaller effects. Because precognition is physically implausible, a skeptical prior is arguably appropriate. Under this prior, Bem's data wasn't strong enough to overcome the skepticism.
  *   **Bem's Prior:** Bem and his supporters argued that if you use a prior based on typical effect sizes in psychology (which are often small but non-zero), the Bayes Factor actually supports precognition.

  **The Takeaway:** The Bayes Factor is sensitive to the prior you choose.
  *   In frequentist stats, subjectivity hides in **researcher degrees of freedom** (when to stop collecting data, which outliers to remove, which variables to compare).
  *   In Bayesian stats, subjectivity hides in **prior specification** (how wide is the distribution? where is it centered?).

  If journals had required Bayes Factors in 2010, researchers could have "p-hacked" their priors (sometimes called "prior packing") until they got a BF > 3 (moderate evidence). It shifts the goalposts; it doesn't remove the game.

  ### 3. Why Bayesian Stats Wouldn't Have Fixed the Replication Crisis
  The replication crisis wasn't caused solely by $p < .05$. It was caused by a system of incentives that rewarded positive results regardless of truth. Bayesian methods are vulnerable to the same systemic issues:

  **A. Publication Bias Remains**
  If a journal only publishes studies with a Bayes Factor > 3 in favor of the hypothesis, researchers will still file away studies that show BF < 1 (evidence for the null). The "file drawer problem" exists for Bayesians too.

  **B. Small Sample Sizes**
  Bayesian methods often require *more* data to be conclusive, not less. To overcome a skeptical prior with strong evidence, you need a large sample size. The replication crisis was fueled by underpowered studies (small $N$). Switching to Bayesian analysis without increasing sample sizes would just result in more "inconclusive" results (BF near 1), which journals might still reject, pressuring researchers to find ways to make them conclusive.

  **C. Misinterpretation**
  People misunderstand $p$-values (thinking $p=.04$ means there's a 96% chance the theory is true). People will misunderstand Bayes Factors too (thinking BF = 5 means the hypothesis is "true" rather than "5 times more likely than the null given these specific priors").

  **D. The "Default Prior" Debate**
  To make Bayesian analysis objective, proponents suggest using "default priors." But as the Bem case showed, there is no consensus on what the correct default prior is. Is it skeptical? Is it based on previous literature? Who decides? This leads to endless methodological arguments rather than data collection.

  ### 4. So, What Is the Actual Solution?
  Your friend's hesitation reflects the current consensus among methodologists. The solution to the replication crisis isn't swapping one statistical statistic for another; it's changing **research practices**.

  The reforms that are actually helping include:
  1.  **Preregistration:** Stating your hypothesis and analysis plan *before* collecting data. This prevents p-hacking and prior-packing.
  2.  **Larger Sample Sizes:** Increasing power so that effects are detected more reliably.
  3.  **Open Data/Materials:** Allowing others to check the analysis.
  4.  **Replication Studies:** Valuing the act of repeating a study as much as the initial discovery.

  ### Summary
  The Bem case is a perfect example of why **$p < .05$ is not a truth machine.** It showed that you can get "significant" results for impossible things through noise and flexibility.

  However, your friend is right: **Bayesian statistics are not a truth machine either.** They are a different framework for quantifying evidence, but they still rely on human judgment (priors) and are subject to human incentives (publication bias).

  If we had switched to Bayes Factors in 2010 without changing the culture of "publish or perish," we likely would have just traded a crisis of $p$-values for a crisis of priors. The fix isn't the math; it's the transparency.
