      *   Wagenmakers used a "default" prior, which was skeptical. Bem and supporters argued this prior was unfair.
      *   *Key Takeaway:* Bayesian analysis doesn't remove subjectivity; it moves it from the *stopping rule/alpha level* to the *prior specification*.

  4.  **Address the "Silver Bullet" Claim (Would Bayesian stats solve the replication crisis?):**
      *   *No.* The replication crisis isn't just about the statistic used; it's about research practices.
      *   *P-hacking vs. Prior-packing:* You can "p-hack" frequentist stats. You can "prior-pack" Bayesian stats (tuning priors until you get the result you want).
      *   *Small Sample Sizes:* Bayesian methods often require *more* data to overcome strong priors, not less. Underpowered studies remain a problem.
      *   *Publication Bias:* Journals want positive results. A Bayes Factor of 3 (moderate evidence) might still get published if it supports the hypothesis, while a BF of 1/3 (moderate evidence for null) might get filed away.
      *   *Interpretation:* People misunderstand Bayes Factors too (e.g., treating BF > 3 as "truth" rather than "evidence").

  5.  **Structure the Response:**
