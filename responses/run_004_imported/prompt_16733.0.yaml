              *   Actually, the theorem says you can't have Calibration + Equalized Odds (FPR & FNR equal) if Base Rates differ.
              *   In my example above, FNR is equal (50%), but FPR is not (5.5% vs 21.4%).
              *   Can I fix FPR? To make FPR equal (5.5%), Group B needs 5.5% of 700 Repayers = 38.5 Repayers in High Risk.
              *   If B-High has 38 Repayers, and must stay Calibrated (50% default rate), it must have 38 Defaulters.
