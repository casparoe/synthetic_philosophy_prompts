          *   *Actually, for a whiteboard scene, binary outcomes (Flagged/Not Flagged) are easier to follow than continuous scores.* Let's frame it as a "Red Flag" system.
          *   *Refinement:* The prompt asks for a "score." Let's simplify to two buckets: "Green" (Low Risk) and "Red" (High Risk).
          *   *Calibration Requirement:*
              *   In Group A: Among those marked Red, X% default. Among those marked Green, Y% default.
              *   In Group B: Among those marked Red, X% default. Among those marked Green, Y% default.
              *   (The meaning of the label is consistent).

      *   *Let's try specific numbers:*
          *   **Group A (1000 people):** 100 Defaulters (10%), 900 Repayers.
          *   **Group B (1000 people):** 300 Defaulters (30%), 700 Repayers.
