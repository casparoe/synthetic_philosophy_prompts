answer: |-
  Here is a concrete scenario set in **small-business lending**, designed to be explained on a whiteboard. It avoids the criminal justice context while preserving the high stakes of access to capital.

  ### The Setup
  **The Company:** "MainStreet Capital," a FinTech firm providing micro-loans to small businesses.
  **The Character:** Dr. Elena Rostova, Lead Data Scientist.
  **The Accuser:** Marcus Thorne, Investigative Journalist.
  **The Model:** A credit-risk score (0–100) predicting the probability of loan default within 24 months.
  **The Groups:**
  *   **Group A:** Established commercial districts (Historically stable).
  *   **Group B:** Revitalization zones (Historically volatile due to systemic underinvestment).

  ### The Whiteboard Scene
  Thorne claims the model is racist because it rejects "good" businesses in Group B at a much higher rate than in Group A. Rostova draws two columns. She does not argue about history; she argues about arithmetic.

  #### Step 1: Establish the Base Rates (The "Past")
  Rostova writes the historical ground truth at the top of the board. These are not model predictions; these are actual past outcomes the model was trained on.

  *   **Group A (1,000 applicants):** 100 Defaults, 900 Repaid. (**10% Base Rate**)
  *   **Group B (1,000 applicants):** 300 Defaults, 700 Repaid. (**30% Base Rate**)

  *"We cannot model away history, Marcus,"* she says. *"Group B has three times the risk prevalence. That is the reality of the data."*

  #### Step 2: Define "Calibration" (The "Truth")
  Rostova draws a line across the middle. She defines her model's core ethical constraint: **Calibration.**
  *   **Definition:** If the model assigns a score of **50** (High Risk), exactly **50%** of those people must default, regardless of their group. A score must mean the same thing for everyone.

  She proposes a simple binary threshold for the loan committee: **Reject anyone scoring 50+ (High Risk).**

  To satisfy Calibration, the "High Risk" bucket must contain a 1:1 ratio of Defaulters to Repayers for *both* groups.

  #### Step 3: Fill the Buckets (The Math)
  Rostova fills in the numbers required to keep the "High Risk" bucket calibrated at 50%.

  **Group A (100 Total Defaulters available):**
  *   To get a 50% default rate in the "High Risk" bucket, for every 1 Defaulter, we need 1 Repayer.
  *   Let's say the model catches **50 Defaulters** in the High Risk bucket.
  *   It must also catch **50 Repayers** (False Positives).
  *   **Total High Risk:** 100 people.
  *   *(Remaining 50 Defaulters and 850 Repayers go to Low Risk).*

  **Group B (300 Total Defaulters available):**
  *   To get the *same* 50% default rate in the "High Risk" bucket, for every 1 Defaulter, we need 1 Repayer.
  *   The model catches **150 Defaulters** in the High Risk bucket.
  *   It must also catch **150 Repayers** (False Positives).
  *   **Total High Risk:** 300 people.
  *   *(Remaining 150 Defaulters and 550 Repayers go to Low Risk).*

  #### Step 4: Reveal the Disparity (The Accusation)
  Rostova circles the "False Positives" (Good businesses rejected).

  *   **Group A False Positive Rate:** 50 good businesses rejected / 900 total good = **5.5%**
  *   **Group B False Positive Rate:** 150 good businesses rejected / 700 total good = **21.4%**

  Thorne slams his pen down. *"There it is! You're rejecting good Group B businesses at four times the rate of Group A. That's disparate impact."*

  #### Step 5: The Impossibility Defense (The "Fix")
  Rostova picks up a red marker. *"You want me to equalize those rates. You want Group B's False Positive Rate to be 5.5%, just like Group A."*

  She erases the Group B "High Risk" numbers.

  *   To get a **5.5% FPR** for Group B: 5.5% of 700 good businesses = **38 good businesses** in the High Risk bucket.
  *   **The Constraint:** To maintain Calibration (the 50% default rate in the High Risk bucket), if there are 38 good businesses, there must be **38 defaulters**.
  *   **The Consequence:** If only 38 defaulters are in the High Risk bucket, where do the rest go?
      *   Total Group B Defaulters: 300.
      *   Caught in High Risk: 38.
      *   **Missed (False Negatives): 262.**

  She writes the new **False Negative Rate** (Bad businesses approved) for Group B:
  *   262 missed defaulters / 300 total defaulters = **87%**.
  *   *(Compare to Group A's False Negative Rate, which remains roughly 50%).*

  *"If I fix the False Positives to satisfy you,"* Rostova says, *"I break the False Negatives. I approve 262 businesses I *know* will fail. I am handing them debt they cannot service. That isn't fairness, Marcus. That's a trap."*

  ### The Structural Explanation (For the Reader)
  If Thorne pushes back, Rostova explains the **Impossibility Theorem** simply:

  1.  **Calibration** means a score of 50 represents the *same probability* for everyone.
  2.  **Equalized Error Rates** means the *same percentage* of people are mistakenly rejected in both groups.
  3.  **Different Base Rates** means one group has more actual risk than the other.

  **The Conflict:**
  If Group B has more actual risk (Base Rate), and your model is truthful (Calibrated), Group B *must* have more people in the "High Risk" bucket. If there are more people in the "High Risk" bucket, there *must* be more good people accidentally caught in it (False Positives), simply because the bucket is larger.

  To shrink the bucket for Group B (to fix the False Positives), you must lower the threshold *only for Group B*. But if you do that, a score of 50 for Group B no longer means the same thing as a score of 50 for Group A. You have broken Calibration. You are lying about the risk.

  ### Why This Works for the Novel
  *   **It's not a bug:** Rostova cannot tweak weights or add variables to solve this. It is a property of conditional probability (Bayes' Theorem).
  *   **It raises the stakes:** The choice isn't between "Bias" and "Fairness." It is between **"Truthful Risk"** (Calibration) and **"Equal Pain"** (Error Rate Parity).
  *   **It protects the character:** She isn't denying the disparity exists; she is denying that it proves malice. She chose to prioritize *not setting borrowers up for failure* (Calibration) over *equal rejection rates*.
  *   **It invites nuance:** The reader can decide which fairness metric is more ethical. Is it worse to reject a good business (FPR), or to approve a bad one that will collapse under debt (FNR/Calibration)?

  ### Dialogue Snippet
  > "You're hiding behind math," Thorne said.
  >
  > "I'm hiding behind reality," Elena replied, tapping the whiteboard where the base rates sat in stark black ink. "If I force the error rates to match, I have to approve loans I know will default. I become a predatory lender. If I keep the scores truthful, the rejection rates differ. I can be honest, or I can be equal. I cannot be both. Which sin do you want me to commit?"
