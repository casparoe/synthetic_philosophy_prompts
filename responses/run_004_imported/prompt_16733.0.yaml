              *   So: If I fix FPR, FNR breaks. If I fix FNR, FPR breaks. If I keep Calibration, I can't fix both.
              *   *Better Narrative:* The Journalist attacks the FPR disparity (more good small businesses in Group B get rejected). The Data Scientist shows that fixing this would require lying about the risk (breaking calibration).

  5.  **Refining the Scenario for the Novel:**
      *   **Domain:** Small Business Loan Guarantees.
      *   **Groups:** "Region North" (Stable economy) vs. "Region South" (Volatile economy). Avoid explicit race to make it about the *math*, but imply the demographic correlation through the journalist's accusation. Or, stick to the prompt's request for "racial bias" accusation, so the groups should be Demographic A and Demographic B. Let's use "Group A" and "Group B" in the math, but the context implies demographic cohorts.
      *   **The Accusation:** "Your model rejects 20% of good applicants from Group B but only 5% from Group A." (False Positive Rate Disparity).
      *   **The Defense:** "Because Group B has a higher historical default rate (Base Rate), keeping the *meaning* of the score consistent (Calibration) forces the error rates to differ. If I lower the threshold for Group B to fix the False Positives, I am approving people I know are likely to default, which hurts the bank and ultimately Group B borrowers when they fail."
      *   **The "Impossible" Triangle:**
          1.  Calibration (A score of 70 means 70% risk for everyone).
          2.  Equal False Positive Rates.
          3.  Different Base Rates.
          *   Pick any two, lose the third.

  6.  **Writing the Explanation:**
      *   Need to make sure the math is bulletproof.
      *   Need to explain *why* it's structural. (Bayes' Theorem).
      *   Need to give the character a "mic drop" moment on the whiteboard.

  7.  **Step-by-Step Math Check:**
      *   **Population:** 1,000 A, 1,000 B.
      *   **Base Rates:** A = 10% Default (100 people). B = 30% Default (300 people).
      *   **Model:** Binary decision (Approve/Reject) based on a risk score threshold.
      *   **Calibration:** Among those Rejected, the Default Rate is 50% for both. Among those Approved, the Default Rate is 5% for both.
      *   **Group A:**
          *   Total Defaults: 100.
          *   Let $x$ be defaults in Rejected bucket.
          *   Rejected Bucket Default Rate = 50%. So Repays in Rejected = $x$.
          *   Approved Bucket Default Rate = 5%. So Defaults in Approved = $100 - x$. Repays in Approved = $(100-x) / 0.05 * 0.95$.
          *   This is getting complicated for a whiteboard.
      *   **Simpler Whiteboard Math:**
          *   Just define the buckets directly.
          *   **Group A:** 100 Defaults, 900 Good.
          *   **Group B:** 300 Defaults, 700 Good.
          *   **Threshold:** We reject anyone with Risk Score > 50.
          *   **Calibration:** A score of 50 means 50% chance of default.
