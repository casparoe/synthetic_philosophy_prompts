prompt: |-
  I am drafting a subplot for a novel in which a data scientist who designed a risk-assessment score for a state parole board is publicly accused by a journalist of having built racial bias into her model. I want her defense to rest on a genuine mathematical impossibility, not a technicality she could quietly fix — but I would rather avoid the now-familiar COMPAS/ProPublica story, which most readers have already half-absorbed. Could you construct a fresh, concrete example, set in lending, hiring, or child-protective screening rather than criminal justice, showing with actual small numbers how a score that is well-calibrated within two groups of differing base rates cannot simultaneously equalize the false-positive and false-negative rates between those groups? Please explain why this is a structural trade-off inherent to the statistics themselves rather than a fixable design flaw, so that my character's whiteboard explanation holds up when the journalist pushes back.
