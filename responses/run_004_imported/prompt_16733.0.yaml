      *   **Context:** Avoid criminal justice (COMPAS/ProPublica). Use lending, hiring, or child-protective screening.
      *   **Core Argument:** The defense rests on a *genuine mathematical impossibility* (the Impossibility Theorem of Fairness), not a fixable bug.
      *   **Requirement:** Show with actual small numbers how calibration within groups conflicts with equalizing error rates (False Positive/Negative) between groups with different base rates.
      *   **Tone:** Concrete, explainable on a whiteboard, defensible against journalistic pushback.

  2.  **Select the Domain:**
      *   *Criminal Justice:* Excluded by prompt.
      *   *Child-Protective Screening:* High stakes, emotionally charged, but data is often messy/subjective. Might be too sensitive for a "mathematical impossibility" argument without sounding cold.
      *   *Hiring:* Good, but "risk" is usually about performance, which is hard to ground truth.
      *   *Lending:* Classic, clear ground truth (repay vs. default), clear stakes (access to capital), and easy to understand base rates.
      *   *Decision:* **Small Business Lending.** It allows for clear "success/failure" metrics and distinct demographic groups with historical economic disparities (base rate differences) without the immediate visceral reaction of prison or child removal.

  3.  **Identify the Mathematical Core:**
      *   The core concept is the *Impossibility Theorem of Fairness* (often associated with Chouldechova, 2017, or Kleinberg et al., 2016).
      *   **The Conflict:** You cannot simultaneously satisfy:
          1.  **Calibration:** If the model says 70% risk, 70% of those people actually default (within each group).
          2.  **Equalized Odds (Error Rate Balance):** False Positive Rate (FPR) and False Negative Rate (FNR) are equal across groups.
      *   **The Condition:** This impossibility arises *unless* the base rates (prevalence of the outcome) are identical across groups.
      *   **The Narrative Hook:** The journalist wants Equalized Odds (same % of good applicants rejected in both groups). The Data Scientist built a Calibrated model (a score of 5 means the same thing for everyone). Because the base rates differ (due to historical/systemic reasons outside the model), she *must* choose one fairness metric over the other. She chose Calibration.

