          *   **The Trade-off:** To fix the FPR (lower B's rejection of good people), you must move Good people from Rejected to Approved. But to keep Calibration (5% risk in Approved), you must move Bad people too. If you move enough to match A's FPR (6.2%), you drastically change the risk profile of the Approved bucket for Group B, breaking Calibration.

      *   *Wait, is this too complex for a novel?*
