          *   If Base Rates differ, and Calibration holds, the *proportion* of people in each risk bucket must differ.
          *   Let's try to make the Approved Default Rate match too.
          *   Let Approved Default Rate = 5% for both.
          *   **Group A:** 100 Defaults total.
              *   Let $D_{rej}$ be defaults rejected. $D_{app}$ be defaults approved.
              *   $D_{rej} + D_{app} = 100$.
              *   Rejected Rate = 50%. Good Rejected ($G_{rej}$) = $D_{rej}$.
