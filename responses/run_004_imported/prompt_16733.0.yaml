              *   $D_{rej} + 1900 - 19D_{rej} = 900$.
              *   $1000 = 18 D_{rej}$.
              *   $D_{rej} = 55.5$. Let's round to 56.
              *   So A-Rejected: 56 Bad, 56 Good. (Total 112).
              *   A-Approved: 44 Bad, 844 Good. (Total 888).
              *   Check Approved Rate: 44/888 = 4.95% (~5%).
              *   Check Rejected Rate: 56/112 = 50%.
          *   **Group B:** 300 Defaults total. 700 Good total.
