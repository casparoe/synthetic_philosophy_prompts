answer: |-
  This is a fantastic distinction to nail down. You are right to feel that they are cousins—they both live in the field of **Social Choice Theory** and both demonstrate how individual rationality doesn't guarantee group rationality.

  However, for your novel, the mechanical difference is huge. One creates a **loop** (Condorcet), and the other creates a **contradiction** (Discursive).

  Here is the breakdown of the mechanics, the difference, and how to stage it for your scene.

  ---

  ### 1. The Condorcet Paradox (The "Rock-Paper-Scissors" Problem)
  **Core Mechanic:** Cyclical Preferences.
  **The Input:** Voters rank **Options** (A, B, C).
  **The Failure:** The group cannot pick a winner because the majority preference is intransitive.

  **How it works:**
  Imagine the jury isn't deciding Guilty/Not Guilty, but rather choosing between three sentencing options: **Probation (A)**, **Fine (B)**, or **Jail (C)**.
  *   **Juror 1:** Prefers A > B > C
  *   **Juror 2:** Prefers B > C > A
  *   **Juror 3:** Prefers C > A > B

  If they vote pairwise:
  *   A vs. B: A wins (Jurors 1 & 3 prefer A over B).
  *   B vs. C: B wins (Jurors 1 & 2 prefer B over C).
  *   C vs. A: C wins (Jurors 2 & 3 prefer C over A).

  **The Result:** A beats B, B beats C, but C beats A. It's a loop. The group is **indecisive**. They can't form a coherent preference order.
  **Why it doesn't fit your scene:** This usually applies to choosing *between* alternatives. In a standard verdict, the jury isn't ranking options; they are determining the truth value of a specific logical chain.

  ---

  ### 2. The Discursive Dilemma (The "Logic Gap" Problem)
  **Core Mechanic:** Inconsistency between Premises and Conclusion.
  *(Also known in law as the **Doctrinal Paradox**)*
  **The Input:** Voters judge **Propositions** (True/False) that are logically connected.
  **The Failure:** The majority view on the *facts* contradicts the majority view on the *verdict*.

  **How it works:**
  This is the one you want. It happens when a verdict depends on multiple conditions being met (e.g., "Liable if Breach **AND** Damages").

  **The Setup:**
  *   **Premise 1 (P1):** Did the defendant breach the contract? (Yes/No)
  *   **Premise 2 (P2):** Did the breach cause the loss? (Yes/No)
  *   **Conclusion (C):** Is the defendant Liable? (Yes **only if** P1 and P2 are both Yes).

  **The Jury (3 People):**
  *   **Juror 1:** Thinks P1 is **Yes**, P2 is **Yes**. (Therefore, Verdict = **Liable**)
  *   **Juror 2:** Thinks P1 is **Yes**, P2 is **No**. (Therefore, Verdict = **Not Liable**)
  *   **Juror 3:** Thinks P1 is **No**, P2 is **Yes**. (Therefore, Verdict = **Not Liable**)

  **The Vote Count:**
  1.  **Vote on P1:** Yes (2 votes) vs. No (1 vote). **Majority says Yes.**
  2.  **Vote on P2:** Yes (2 votes) vs. No (1 vote). **Majority says Yes.**
  3.  **Logical Conclusion:** If P1 is Yes and P2 is Yes, the defendant **Must Be Liable**.

  **BUT...**
  4.  **Vote on Verdict:** Liable (1 vote) vs. Not Liable (2 votes). **Majority says Not Liable.**

  **The Result:** The jury collectively affirms the facts that prove guilt, but collectively votes for innocence. The group is **logically inconsistent**.

  ---

  ### The Cheat Sheet: Key Differences

  | Feature | Condorcet Paradox | Discursive Dilemma |
  | :--- | :--- | :--- |
  | **What is voted on?** | **Options** (Candidate A, B, or C) | **Propositions** (True/False statements) |
  | **The Glitch** | **Cyclical:** A > B > C > A | **Contradictory:** Premises = True, Conclusion = False |
  | **Group State** | **Indecisive:** No stable winner exists. | **Inconsistent:** The verdict contradicts the findings. |
  | **Courtroom Fit** | Rare. Used for sentencing or charge selection. | **Common.** Used for liability, guilt, or constitutional tests. |
  | **Dramatic Tension** | "We can't agree on *what* to pick." | "We agreed on the *facts*, but the math is wrong." |

  ---

  ### How to Write the Scene (The Discursive Dilemma)

  Since you are writing the Discursive Dilemma, the drama comes from the **procedure**, not just the disagreement. The conflict is between two valid methods of aggregation:

  1.  **Premise-Based Procedure:** Vote on the facts first, let logic dictate the verdict. (Result: Liable)
  2.  **Conclusion-Based Procedure:** Vote on the verdict directly, ignore the inconsistency in the reasoning. (Result: Not Liable)

  **Scene Beats:**

  *   **The Setup:** The judge instructs them that they must find on two specific elements to reach a verdict.
  *   **The Straw Poll:** They take a non-binding vote on the elements individually. The Foreman writes it on the board. "Okay, we agree the contract was breached. We agree the damages were caused by the breach."
  *   **The Realization:** A juror (maybe your protagonist) does the math. "Wait. If we agree on both, the law says we have to find them liable."
  *   **The Conflict:** Another juror points to the final vote count. "But two of us voted 'Not Liable' on the final question. We can't return a verdict that the majority rejects."
  *   **The Climax:** The jury is stuck. If they follow the logic, they violate the majority will on the verdict. If they follow the majority verdict, they violate the logical findings of fact.
  *   **The Resolution:** Usually, in real law, the **Conclusion-Based** method wins (the verdict vote overrides the logic), but it leaves a sour taste. Or, they hang the jury because they can't reconcile the integrity of the process.

  **Sample Dialogue Snippet:**

  > "Look at the board," Sarah said, tapping the whiteboard. "Juror 4, you voted 'Yes' on Breach. Juror 7, you voted 'Yes' on Causation. That's a majority on both premises."
  >
  > "So?" Juror 4 grunted.
  >
  > "So the instruction says Breach plus Causation equals Liability," Sarah said. "Logically, the defendant is guilty."
  >
  > Juror 7 shook his head. "But look at the final poll. Two of us voted 'Not Guilty.' We can't sign a verdict form that says 'Guilty' when the majority of us think he's innocent."
  >
  > "Then the majority is wrong about the math," Sarah snapped. "We're not voting on feelings. We're voting on findings. If the findings say Yes, the verdict is Yes."
  >
  > "Or," the Foreman said quietly, "the findings are a lie we told ourselves to get here."

  ### Why this matters for your theme
  The **Condorcet Paradox** suggests democracy is chaotic (no order).
  The **Discursive Dilemma** suggests democracy can be hypocritical (saying one thing, doing another).

  For a courtroom drama, the Discursive Dilemma is much richer. It allows characters to argue about **integrity vs. outcome**. Do we follow the rules of logic, or do we follow the will of the people? That is a much deeper conflict for a novel than "we can't pick a winner."
