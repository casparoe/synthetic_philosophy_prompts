answer: |-
  # The Sterile Convention: Why Aristotle's Economics Contradict Themselves

  Aristotle's economic thought, primarily found in *Politics* Book I and the *Nicomachean Ethics*, is often cited as the foundation of Western ethical economics. However, a close reading reveals a fundamental tension between his ontology of money and his moral critique of usury. On one hand, Aristotle defines money (*nomisma*) as a creature of convention (*nomos*), possessing no intrinsic value. On the other, he condemns interest (*tokos*) as "unnatural" because money is sterile and cannot breed.

  This argument demonstrates that these two positions are logically incompatible. The condemnation of usury relies on an essentialist view of money's "nature" (*physis*) that Aristotle explicitly denies in his definition of money's origin. If money is truly a matter of convention, it cannot have a "natural" function that interest violates.

  ### 1. The *Nomos* Premise: Money as Pure Convention
  Aristotle's starting point is etymological and ontological. He observes that the Greek word for currency, *nomisma*, derives from *nomos* (law, custom, or convention). His argument is that money has no value "by nature" (*physis*). Unlike a shoe, which has a natural use (protecting the foot), or grain, which has a natural use (nutrition), a coin has no utility in itself. You cannot eat gold or wear silver.

  Therefore, money is a social technology invented to solve the problem of incommensurability in exchange. It is a "measure" that makes different goods comparable so that trade can occur. Because its value is assigned by human agreement to facilitate exchange, its properties are theoretically malleable. If *nomos* brings money into existence to serve the end of exchange, then *nomos* should, in theory, be able to redefine the terms of that existence. In a strictly conventionalist framework, there is no "truth" to money outside of what the community agrees it does.

  ### 2. The *Tokos* Premise: Money as Sterile Nature
  When Aristotle turns to usury, however, his language shifts dramatically from the legalistic (*nomos*) to the biological (*physis*). He argues that charging interest is "most hated" and "contrary to nature." His reasoning rests on the pun on *tokos*, which means both "interest" and "offspring."

  Aristotle argues that while it is natural for livestock to breed offspring (*tokos*), it is unnatural for money to breed money. Money, he claims, was intended only for exchange. When money generates more money through interest, it is perverting its purpose. Here, Aristotle treats money as if it possesses a fixed, metaphysical essence—a "sterility"—that transcends human agreement. He implies that there is a correct, natural *telos* (end goal) for money, and interest violates this teleological boundary.

  ### 3. The Contradiction: Essentialism vs. Conventionalism
  The inconsistency arises because the usury argument smuggles in a natural law where the definition of money denied one exists.

  **If money is *nomos*, its "nature" is functional and mutable.**
  If money is merely a convention created to facilitate exchange, its "function" is determined by the users. If a society agrees that money can be rented out for a fee (interest), that is simply a new convention. To say interest is "unnatural" implies that money has a nature independent of human convention. But Aristotle already established that money *has* no independent nature; it is a tool created by *nomos*. You cannot claim a tool is "unnatural" when used in a way the users agreed upon, unless you appeal to a standard higher than human agreement.

  **The "Sterility" metaphor requires *Physis*, not *Nomos*.**
  By calling money "barren," Aristotle attributes a biological property to a legal construct. A law cannot be barren; a law can only be effective or ineffective. A convention cannot be sterile; it can only be accepted or rejected. For money to be truly "sterile" in the Aristotelian sense, it would need to possess an intrinsic essence that resists multiplication. But Aristotle explicitly states money lacks intrinsic essence.
  *   **Premise A:** Money's value and existence are based on convention (*nomos*), not nature (*physis*).
  *   **Premise B:** Usury is wrong because it violates the nature (*physis*) of money (sterility).
  *   **Conclusion:** Premise B contradicts Premise A. If A is true, money has no *physis* to violate.

  ### 4. The Teleological Slip
  Aristotle attempts to bridge this gap by distinguishing between the "natural" use of money (exchange for goods) and the "unnatural" use (exchange for more money). He argues that while *nomos* creates the coin, the *purpose* of the coin is fixed by the needs of the household (*oikos*).

  However, this is a category error. If the coin is a convention, its purpose is defined by the convention. If the convention evolves to include lending at interest, the "purpose" has evolved. By freezing the purpose of money at the stage of simple barter-exchange and labeling any evolution beyond that as "unnatural," Aristotle is treating a social construct as if it were a biological species. He grants money a *physis* (a fixed life cycle that precludes reproduction) precisely when it suits his moral argument, having previously stripped it of *physis* to explain its origin.

  ### 5. Conclusion: Moralizing via Metaphysics
  The contradiction reveals that Aristotle's economic theory is not a consistent analysis of value, but a moral project disguised as metaphysics. He wants to have it both ways: he wants money to be flexible enough to serve the state (hence *nomos*), but rigid enough to be morally policed (hence *physis*).

  The usury argument only holds water if money has a natural limit. But the *nomisma* argument asserts that money *is* the limitlessness of human agreement. By condemning *tokos* as unnatural, Aristotle contradicts his own etymology. He denies money has a nature, only to punish those who treat it as if it does. In doing so, he exposes a crack in the foundation of his economic thought: you cannot derive an "unnatural" sin from a purely "conventional" object.
