answer: |-
  **To:** Forecasting Team Lead
  **From:** Strategic Analysis
  **Subject:** Resolution of the Referendum Update Dispute (The Judy Benjamin Problem)

  ### The Impasse: When Conditional Information Breaks Bayes

  Your team has stumbled onto one of the most persistent puzzles in formal epistemology. What began as a disagreement over a referendum model is a practical instance of the **Judy Benjamin problem**, posed by Bas van Fraassen in 1980. The core tension is this: How should a rational agent update their beliefs when they learn a *conditional probability* (e.g., "If $A$, then $B$ is 75% likely") rather than a categorical fact (e.g., "$A$ is true")?

  To bring a verdict to your team, we must first understand why standard tools fail, evaluate the competing solutions, and then determine which framework fits the epistemology of *forecasting* versus the mathematics of *information theory*.

  #### 1. Why Standard Updating Fails
  Your intuition that standard Bayesian conditionalization doesn't apply is correct. Bayesian updating requires learning that some proposition $E$ is true (i.e., $P_{new}(E) = 1$). Your source did not tell you the referendum *will* pass, nor that turnout *will* be high. They gave you a constraint on the ratio of probabilities within a sub-branch.

  Jeffrey conditionalization (probability kinematics) is also insufficient. Jeffrey updating requires you to have new probabilities for a complete partition of events (e.g., "I now think Pass is 60% and Fail is 40%"). Your source explicitly withheld information about the marginal probability of passing. You have a constraint on a *ratio* ($P(High|Pass) = 3:1$), not a direct assignment of mass to the partition elements.

  Because the input is neither a fact nor a partition shift, the math does not dictate a unique solution without adding a philosophical premise about what the information *represents*. This is where your team diverged.

  #### 2. The Two Contenders

  **Method A: Fixed Marginals (The "Intuitive" Approach)**
  *   **The Rule:** Keep the marginal probability of the antecedent ($Pass$) fixed at its prior (50%). Adjust only the conditional branch to satisfy the new ratio (75% High, 25% Low).
  *   **The Result:** $P(Pass)$ remains 50%. $P(Pass \cap High)$ becomes 37.5%.
  *   **The Logic:** This relies on a principle of *minimal interference*. The source spoke only about the world where the referendum passes. They said nothing about the likelihood of passing itself, nor about the world where it fails. Therefore, we should treat those silent areas as unchanged.
  *   **The Weakness:** It is mathematically ad hoc. There is no unique entropy-minimizing principle that guarantees marginals stay fixed. It privileges the marginal distribution over the joint distribution without a formal justification.

  **Method B: Minimum Cross-Entropy (MinXEnt)**
  *   **The Rule:** Choose the new probability distribution that satisfies the constraint ($P(High|Pass) = 0.75$) while minimizing the Kullback-Leibler divergence (information gain) from the prior.
  *   **The Result:** Surprisingly, this method *shifts the marginal*. In your specific setup (starting from independence), MinXEnt dictates that $P(Pass)$ must **decrease**.
  *   **The Logic:** This is the standard solution in information theory. It treats the update as a constraint satisfaction problem. To accommodate the higher density of probability in the $Pass \cap High$ cell without "wasting" information elsewhere, the algorithm redistributes mass across the entire space to preserve the odds ratios of the unconstrained cells relative to the constrained ones.
  *   **The Weakness:** It yields counter-intuitive results. Learning that "If Pass, then High Turnout" makes you think Passing is *less* likely, even though the source offered no evidence against Passing. It implies the source's silence on the marginal is itself informative.

  #### 3. The Diagnosis: Constraints vs. Reports

  The reason these methods disagree is that they answer different questions.

  **MinXEnt answers:** "What is the most conservative probability distribution *given that this constraint is logically true*?" It treats the information as a law of the universe that your model must satisfy. If the universe dictates a specific conditional density, MinXEnt assumes this structural change ripples through the whole system to minimize total surprise.

  **Fixed Marginals answers:** "How do I update my beliefs *given that a limited source reported this fact*?" It treats the information as an evidential report from an observer who may have access to some variables (turnout dynamics) but not others (voter intent).

  In the original Judy Benjamin thought experiment, Judy receives a message from headquarters. Van Fraassen argued that if the message is treated as a hard constraint on her probability function, MinXEnt is correct. However, subsequent analysis (by philosophers like Alan Hájek and James Joyce) suggests that in almost all real-world contexts, we are not receiving logical constraints on our entropy; we are receiving **evidence about the world**.

  #### 4. The Verdict

  For a forecasting team receiving intelligence from a source, **Method A (Fixed Marginals) is the rational choice.**

  I defend this verdict on three grounds:

  **1. The Pragmatics of Communication (Gricean Implicature)**
  When a source says, "I can't tell you if it will pass, but if it does, turnout will be high," they are performing a speech act. In natural language, specifying a conditional while explicitly disclaiming knowledge of the antecedent implies that the antecedent's probability is *independent* of the new information. If the source knew that the high-turnout dynamic made passing less likely (which is what MinXEnt implies), they would be misleading you by remaining silent on it. In forecasting, we model sources, not just logic. We must respect the explicit boundaries of their testimony.

  **2. Causal Structure vs. Logical Constraint**
  Forecasting models attempt to map causal mechanisms. Your prior assumed independence between Passing and Turnout. The source has identified a dependency *within* the Pass scenario.
  *   **MinXEnt** treats this as a global re-balancing of your state of ignorance.
  *   **Fixed Marginals** treats this as a local update to a mechanism.
  Unless you have reason to believe that "High Turnout" and "Passing" compete for a fixed pool of probability mass (a zero-sum game), there is no physical reason for $P(Pass)$ to drop simply because $P(High|Pass)$ rose. The MinXEnt shift is an artifact of the mathematics of entropy, not a feature of the political reality you are modeling.

  **3. Iterative Stability**
  If you use MinXEnt, your model becomes hypersensitive to the *order* of information. If you later receive a report about the "Fail" branch, MinXEnt will shift the "Pass" marginal again. This creates a "ping-pong" effect where marginals fluctuate based on the sequence of reports, even if the reports are about disjoint scenarios. Fixed Marginals ensures that local updates remain local, which is essential for modular forecasting systems.

  #### 5. The Condition for Dissent

  I offer one critical caveat. **MinXEnt is correct if and only if the information is a global constraint on the system, not a report from a partial observer.**

  *   **Use Fixed Marginals (Method A) when:** The information comes from a source with limited access (e.g., "I surveyed the Pass campaign, not the Fail campaign"), or when the variables represent distinct causal mechanisms. **This is your current situation.**
  *   **Use MinXEnt (Method B) when:** The information represents a physical or logical law that governs the entire space (e.g., "We have discovered a physical law that dictates the ratio of High-to-Low turnout in Pass scenarios must be 3:1, and this law governs the system's equilibrium").

  **What additional fact would settle it?**
  You would need to know the **selection mechanism** of the source.
  *   *Fact X:* "The source looked at the whole system, calculated all probabilities, but was only authorized to release the conditional." -> **Use MinXEnt.** (Their silence is strategic, not ignorant).
  *   *Fact Y:* "The source only has access to turnout data conditional on passage, and literally does not know the pass probability." -> **Use Fixed Marginals.**

  **In the absence of this fact:** Default to **Fact Y**. In intelligence and forecasting, sources are typically limited by access, not by authorization to withhold global marginals. Assuming a source knows the global truth but is hiding the marginal is a stronger assumption than assuming they simply don't know it. Therefore, the "Fixed Marginal" approach is the more robust prior for source reliability.

  ### Action Plan for the Team

  1.  **Adopt Method A (Fixed Marginals)** for this referendum model. Re-split the "Pass" branch to 75/25, but keep the "Pass/Fail" split at 50/50.
  2.  **Document the Assumption:** Explicitly note in your model documentation: *"Conditional updates from human sources are treated as local mechanism updates. Marginals are preserved unless the source explicitly provides evidence regarding the antecedent's probability."*
  3.  **Future Protocol:** For future disagreements, ask the "Source Access Question": *Does the source know the marginal and withhold it, or do they not know it?*
      *   If they **don't know**: Fixed Marginals.
      *   If they **know and withhold**: MinXEnt (though this is rare in practice).

  **Summary:** Your team's "intuitive" half was practically right, even if the "MinXEnt" half was mathematically sophisticated. In forecasting, epistemology trumps pure information theory. Treat the source as a limited observer, not a constraint solver, and keep your marginals fixed.
