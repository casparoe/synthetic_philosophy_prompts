      *   **Scenario:** Splitting a modular sectional sofa into loveseats and an ottoman.
      *   **Core Question:** Was the assembled sofa ever really "one object"?

  2.  **Deconstruct the Argument (Move by Move):**

      *   **Move 1 (Mara):** The sofa was bought, delivered, and used as a single unit. Therefore, it was one object.
          *   *Argument Type:* Pragmatic/Functional/Conventionalist.
          *   *Strengths:* Aligns with common sense and linguistic usage.
          *   *Weaknesses:* Doesn't address the metaphysical underlying reality. Just because we *treat* it as one doesn't mean it *is* one ontologically.
      *   **Move 2 (Leo):** The pieces work apart. There is no "further thing" over and above the parts. It was just an arrangement.
          *   *Argument Type:* Mereological Nihilism / Restrictivism.
          *   *Strengths:* Avoids multiplying entities unnecessarily. Highlights the lack of permanent bond.
          *   *Weaknesses:* Risks eliminating too many objects (slippery slope to nihilism).
      *   **Move 3 (Mara):** This proves too much. A chair is parts arranged chair-wise. If arrangement isn't enough, chairs don't exist. Nor do bodies.
          *   *Argument Type:* Reductio ad absurdum against Leo's criterion.
          *   *Strengths:* Strong intuitive pushback. Most people believe chairs and bodies exist.
          *   *Weaknesses:* Assumes Leo is a nihilist about *all* composite objects, whereas he might just be a restrictivist.
      *   **Move 4 (Leo):** Distinction between functional independence. A chair's seat isn't a seat without legs. Loveseats are fully functional alone. Separability is the test.
          *   *Argument Type:* Functional Integrity / Independence Criterion.
          *   *Strengths:* Distinguishes the sofa case from the chair case. Offers a specific criterion (separability).
          *   *Weaknesses:* Is "functional independence" the right metaphysical test? A car engine works outside a car, is the car not one object?
      *   **Move 5 (Mara):** Separability fails. A dresser drawer works on the floor, but the dresser is still one object.
          *   *Argument Type:* Counter-example to Leo's criterion.
          *   *Strengths:* Strong counter-example. Drawers are paradigmatic parts of a whole, yet separable.
          *   *Weaknesses:* Is a drawer *fully* itself on the floor? It loses its function of being *in* the dresser. But it holds socks, so...
      *   **Move 6 (Leo):** Verbal dispute. Two senses of "one object" (strict vs. loose).
          *   *Argument Type:* Meta-linguistic / Conceptual Relativism.
          *   *Strengths:* Often true in philosophy. Defuses tension.
          *   *Weaknesses:* Can be seen as evasion (as Mara claims). Doesn't solve the ontological question.
