  can you give me the most important implications of this for someone like me who just wants to be a decent person and give money to good causes, no philosphy degree required. like does this mean the whole "calculate the expected good done" approach effective altruism people use is basically busted, or do people who actually take this seriously still have some way to make decisions? not looking for the full academic backstory, just what it actually means for making real choices.
