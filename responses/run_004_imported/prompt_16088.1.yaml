answer: |-
  Here are 10 questions designed to press the self-knowledge/armchair knowledge problem without re-arguing the basics of externalism. They are ordered to build pressure, starting with pinning down the premises, moving through the three standard responses (with prepared follow-ups), and ending with a request for a clear bottom line.

  **1. Pinning the Entailment**
  "Let's start by pinning down the logical structure of the challenge. On your view, does the *individuation* of a thought like 'water is wet' logically entail the existence of the external substance H2O? I'm asking whether, on your account, the proposition <I am thinking that water is wet> strictly implies <H2O exists>, such that the truth of the former guarantees the truth of the latter."

  **2. Pinning the Status of Self-Knowledge**
  "Following up on that: do you maintain that I have *a priori* warrant for believing I am thinking that 'water is wet'? I want to distinguish between 'privileged access' and 'a priori warrant.' Are you claiming I can know the content of my thought without any empirical investigation into my own history or environment?"

  **3. Strategy One: Denying A Priori Self-Knowledge**
  "One standard response to the armchair knowledge problem is to deny the second premise: to claim that self-knowledge is not actually a priori, but rather relies on some empirical warrant. If you take this route, are you suggesting that to know I'm thinking about water, I implicitly rely on empirical evidence that I am embedded in a water-environment?"

  **4. Follow-up to Question 3 (If she denies a priori self-knowledge)**
  "If self-knowledge requires empirical warrant, how do you preserve the intuitive asymmetry between first-person and third-person authority? If I need empirical evidence to know my own content, isn't the gap between how I know my thoughts and how *you* know my thoughts significantly narrower than anti-individualism usually allows?"

  **5. Strategy Two: Denying the A Priori Link**
  "Another move is to accept a priori self-knowledge but deny that the *connection* between the thought and the environment is knowable a priori. On this view, externalism is an a posteriori discovery. If you take this line, does that mean the thesis of anti-individualism itself is an empirical hypothesis rather than a conceptual truth about content?"

  **6. Follow-up to Question 5 (If she denies the a priori link)**
  "If the link between content and environment is a posteriori, doesn't that block the transmission of warrant in a way that makes externalism philosophically inert? If we can't know a priori that our thoughts depend on the environment, can we ever use introspection to confirm the externalist thesis itself, or does it remain a skeptical possibility we can't rule out from the armchair?"

  **7. Strategy Three: Accepting the Conclusion**
  "A third option, defended by people like Falvey and Owens, is to simply accept the conclusion: we *can* know certain environmental facts from the armchair. If this is your position, are you arguing that I can legitimately infer the existence of H2O solely from the fact that I am thinking about water, without looking outside?"

  **8. Follow-up to Question 7 (If she accepts the conclusion)**
  "If I can know my environment contains H2O from the armchair, how do you handle the 'slow-switching' case? If I were moved to Twin Earth without knowing it, my content would eventually shift to twater. If I have armchair knowledge of my environment, shouldn't I be able to know a priori whether I am on Earth or Twin Earth, which seems to contradict the slow-switch intuition?"

  **9. The Burge/Community Specific Pressure**
  "Shifting briefly to the social externalism side, like Burge's arthritis case: if my content depends on the linguistic norms of my community, do I need to know those norms to know my own thought? If I have a false belief about what 'arthritis' means in my community, do I still know a priori that I am thinking about arthritis, or does my ignorance of the community standard undermine my self-knowledge?"

  **10. The "Plain Talk" Closer**
  "To wrap up, I'd like to ask for a bottom line on the scope of armchair knowledge. On your view, is there *any* substantive fact about the external world—physical or social—that I can know with certainty simply by reflecting on my own mind, or does your account ultimately require that all knowledge of the world, even via self-knowledge, remains fallible and empirical?"
