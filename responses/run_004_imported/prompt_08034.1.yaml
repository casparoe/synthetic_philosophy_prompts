answer: |-
  This is a classic instantiation of the Causal Decision Theory (CDT) vs. Evidential/Functional Decision Theory (EDT/FDT) debate, dressed up in departmental politics. Since you're in the cohort, I'll skip the intro to PDs and cut straight to the formal scorekeeping.

  Here is the move-by-move breakdown, followed by the one thing they are both missing.

  ### Move-by-Move Analysis

  **1. Jonah (Dominance):** *"Defection dominates... Leah left money on the table."*
  *   **Verdict:** **Jonah is technically correct (by CDT standards).**
  *   **Why:** In a standard causal model, the partner's choice is a fixed state of the world ($S$) independent of Leah's action ($A$). Since $U(D, S) > U(C, S)$ for all $S$, $D$ strictly dominates. If you accept the CDT axiom that only causal consequences matter, Leah made a formal error.
  *   **Caveat:** This assumes the causal graph is the only valid map. It begs the question against EDT/FDT.

  **2. Leah (Superrationality):** *"Choice isn't 'given fixed partner' but 'which joint outcome'... (C,C) beats (D,D)."*
  *   **Verdict:** **Leah is theoretically coherent (by FDT standards).**
  *   **Why:** She is invoking logical correlation. If both agents run the same decision algorithm on the same information, their outputs must correlate. She is treating the decision as determining the output of the algorithm, not just the physical action.
  *   **Caveat:** This requires a strong premise: that the partner is actually running the *same* algorithm.

  **3. Jonah (Fixed State):** *"Partner's choice is already fixed... nothing she does now reaches back."*
  *   **Verdict:** **Jonah is causally correct, but misses the point.**
  *   **Why:** He is right that there is no *causal* arrow from Leah's choice to the partner's choice (no backwards causation). But Leah isn't claiming backwards causation; she's claiming a common cause (the reasoning process). Jonah is attacking a strawman of "magic" to defend dominance.
  *   **Score:** Jonah wins on physics, Leah wins on logic.

  **4. Leah (Evidence):** *"It's evidence... ignoring evidence just because it isn't causal is its own bias."*
  *   **Verdict:** **Leah has the stronger epistemic point.**
  *   **Why:** This is the core EDT argument. If $P(Partner=C | I=C) \gg P(Partner=C | I=D)$, then $EU(C)$ can exceed $EU(D)$. Dismissing this correlation as irrelevant simply because it isn't causal is a specific normative commitment (CDT), not a neutral fact.
  *   **Score:** Leah wins. This is the strongest philosophical move in her arsenal.

  **5. Jonah (Empirical Check):** *"Can't get richer by feeling good about a correlation... selfish defectors don't do worse on average."*
  *   **Verdict:** **Jonah wins on empirical grounds.**
  *   **Why:** In real-world experimental data (e.g., standard econ PDs), unconditional cooperators generally get exploited by defectors. The correlation coefficient ($\rho$) in typical populations is rarely high enough to overcome the payoff structure of a PD. Theoretical elegance doesn't pay if the world doesn't match the model.
  *   **Score:** Jonah. The data is on his side for general populations.

  **6. Leah (Reference Class):** *"The pool is doing real work... people trained the same way... random selfish defectors elsewhere aren't a fair comparison."*
  *   **Verdict:** **Leah is right about the method, wrong about the implication.**
  *   **Why:** She is correct that the reference class matters. You can't use data from Mechanical Turk workers to predict Decision Theory PhDs. However, she assumes "trained the same way" implies "reasoning the same way."
  *   **Score:** Draw. She identifies the right variable (reference class) but likely overestimates the correlation within that class.

  ---

  ### The One Thing Both Are Missing

  They are treating this as a debate about **Normative Decision Theory** (what *should* a rational agent do?), but the actual crux is a **Positive Empirical Claim** about the homogeneity of the subject pool.

  **The Missing Thing: The Heterogeneity of Decision Algorithms.**

  Leah's argument (Superrationality/FDT) relies entirely on the premise that her partner is running the **same decision algorithm** as she is. If she runs FDT and the partner runs CDT, the logical correlation is broken. Her choice provides *no evidence* about the partner's choice because the functions mapping inputs to outputs are different.

  Jonah's argument relies on the premise that the partner's choice is **causally independent**. This is robust; it holds true whether the partner is an FDTer, a CDTer, or a random number generator.

  **Here is the kicker:** The existence of their argument **falsifies Leah's premise.**

  Jonah is in the same cohort, same pool, same training, and he defected. He explicitly reasoned via dominance (Point 1). Leah reasoned via superrationality (Point 2). They are *proof* that the "subject pool" does not contain identical reasoners. It contains a mix of CDTs and EDT/FDTs.

  In a mixed population:
  1.  **Jonah (CDT)** does well against Leahs (exploits them) and ties against other Jonahs.
  2.  **Leah (FDT)** does poorly against Jonahs (gets exploited) and ties against other Leahs.

  Leah is missing that **her strategy is not evolutionarily stable in a mixed population.** She is betting on a correlation that requires universal adoption of her specific reasoning style to pay off. Since Jonah (a data point from the very pool she cites) exists, she has empirical evidence that the correlation she is banking on is $< 1$. Unless she can prove that *most* of the pool are FDTers (which Jonah's existence casts doubt on), her expected utility calculation is empirically unjustified.

  Jonah is missing that **if the pool were homogeneous FDTers, he would be leaving money on the table.** He assumes his strategy is robust, but it's only robust in a way that leads to Pareto-inferior outcomes if everyone else is like him.

  **Summary:** They are arguing about *rationality*, but the winner is determined by *demographics*. Leah is playing a strategy that only wins if she's wrong about the population (i.e., if everyone else is like her, she wins; but if everyone else is like her, Jonah wouldn't exist to argue with her). Jonah is playing a strategy that wins regardless of what she does, but ensures they both lose if everyone plays like him.

  **The verdict:** Jonah has the safer bet; Leah has the higher ceiling but a fatal empirical vulnerability. The fact that they are arguing proves Leah's empirical premise is false.
