answer: |-
  It is understandable that you have found yourself in the literature on "standing to blame." When personal relationships fracture under the weight of care and obligation, abstract questions about who has the right to speak suddenly become painfully concrete. The debate you describe—between hypocrisy, complicity, and relationship-based accounts—is central to contemporary moral philosophy (drawing on work by philosophers like R. Jay Wallace, Macalester Bell, and others responding to G.A. Cohen).

  To help you isolate the variables at play, I have constructed two scenarios below. They are designed to hold two factors constant while varying the third, allowing us to see which consideration is actually driving our intuitions about standing.

  ### Scenario 1: The Hypocrite with Standing
  **The Case of the Quarantine Warden**

  During a severe infectious outbreak, a residential facility appoints Elias as the floor warden. His specific duty is to enforce a strict "no leaving the room" order to protect the immunocompromised residents. The rule is absolute: no one leaves their door for any reason.

  Three days into the shift, Elias's own daughter, who lives in the facility, has a medical emergency. In a panic, Elias leaves his post and walks into the hallway to help her, technically violating the "no leaving the room" rule he is sworn to enforce. He does not report this violation to the administration or the other residents; he simply returns to his post and continues his shift.

  Later that day, he catches another resident, Sarah, stepping into the hallway to take out her trash. Elias immediately confronts Sarah, issuing a formal reprimand and ordering her back inside. He holds her to the standard of "no leaving the room," a standard he himself violated hours earlier without acknowledgment.

  **Intuition:** Despite being a narrow hypocrite (violating the norm without acknowledgment), Elias retains full standing to blame Sarah. Sarah cannot legitimately retort, "You have no right to tell me what to do because you broke the rule too."

  **Diagnosis:**
  In this case, the **Relationship/Role** consideration is doing the real work, overriding the **Hypocrisy** consideration.
  *   **Why Hypocrisy Fails to Strip Standing:** While Elias is morally flawed, his standing does not derive from his personal moral purity. It derives from his *institutional authority* and the *protective nature* of the norm. The rule exists to protect the vulnerable residents, not to certify the virtue of the warden.
  *   **The Philosophical Point:** This suggests that standing is not merely a function of the blamer's moral record. If the norm is protective and the blamer is the designated guardian, their personal failure to comply (hypocrisy) may damage their *credibility* or make them liable to punishment, but it does not necessarily void their *authority* to enforce the rule for the sake of others. The "business" of safety belongs to him by role, regardless of his personal compliance.

  ***

  ### Scenario 2: The Clean Hands with No Standing
  **The Case of the Silent Partner**

  Two colleagues, Mara and Julian, co-found a small architecture firm. They draft a partnership agreement that requires both partners to review and sign off on all structural safety calculations before a blueprint is filed. This is a shared duty; neither can file without the other's signature.

  Six months in, Julian tells Mara, "I'm overwhelmed with the marketing side. I trust your engineering judgment completely. Just sign my name on the safety reviews too; I don't want to see the data." Mara agrees and begins filing blueprints with Julian's name on them, though Julian never actually reviews the work. Julian has now effectively abdicated his responsibility.

  A year later, a calculation error is found in a project Mara managed. The building is safe, but the error was serious. Julian, who has not looked at a single calculation in a year and has "clean hands" regarding the specific error (he didn't make it, nor did he encourage it), publicly berates Mara for her negligence, demanding she explain why she violated their safety protocols.

  **Intuition:** Despite having clean hands (he did not commit the error, nor is he a hypocrite regarding the specific mistake), Julian lacks standing to blame Mara. Mara can legitimately say, "You don't get to hold me accountable for a duty you refused to share."

  **Diagnosis:**
  In this case, the **Relationship/Business** consideration is doing the real work, overriding the **Complicity/Involvement** (or lack thereof) consideration.
  *   **Why Clean Hands Fail to Grant Standing:** Standing is not automatically granted by innocence. It requires a *normative stake* in the relationship. By voluntarily abdicating his role in the safety review process, Julian severed the mutual accountability that gives a partner the right to blame. He made the safety protocols "none of his business" in the normative sense, even if they remained his legal liability.
  *   **The Philosophical Point:** This challenges the idea that standing is simply the default state of any moral agent. Instead, it suggests standing is a *relational privilege* that can be waived. You cannot claim the authority to hold someone to a standard of mutual care if you have explicitly opted out of the labor required to maintain that care.

  ***

  ### A Note on Your Situation

  In your dispute with your sister, these scenarios highlight why the "standing" debate is so difficult to resolve in families.

  Your sister's argument leans on **Scenario 2**: She suggests that by moving away and reducing your involvement, you may have voluntarily altered the *relationship* such that you no longer hold the standing to demand she meet a burden you have stepped back from. She is arguing that you have made care "less of your business," and thus you lack the relational authority to police her performance.

  Your intuition likely leans on **Scenario 1**: You may feel that your physical distance (or even your avoidance) is a personal failing (hypocrisy or weakness), but that the *norm* of caring for your father is so vital and protective that anyone—especially a sibling—retains the standing to insist it be done properly, regardless of their own limitations.

  The literature does not offer a verdict on who is right, because standing is often negotiated within the relationship itself. However, distinguishing whether you are arguing about *hypocrisy* (your past actions) or *relationship* (your current authority) may help clarify the conversation. If the issue is relationship, the solution isn't defending your purity, but renegotiating your current role in your father's care.
