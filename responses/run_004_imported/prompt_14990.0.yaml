prompt: |-
  In my political theory seminar, we've spent the last few weeks on Locke's account of political obligation in the Second Treatise, especially his distinction between tacit and express consent: on his view, merely residing in a territory, holding property there, or even just travelling its roads binds a person to obey its laws, but this tacit consent alone does not make someone a full member of the political society — that requires express consent. This got me thinking about a live debate today: several jurisdictions now grant long-term non-citizen residents the vote in at least some elections, on the reasoning that people who live under a government's laws and contribute to its upkeep deserve some say in making them. Reasoning strictly from Locke's own premises, rather than from present-day politics, would he have endorsed extending the franchise to such residents, or does his tacit/express consent distinction actually give principled grounds for excluding them? Does this case expose any tension within his theory of political obligation itself?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Political theory seminar, focusing on Locke's *Second Treatise of Government*.
      *   **Core Topic:** Locke's distinction between tacit and express consent and its relation to political obligation and membership.
      *   **Specific Question:** Reasoning *strictly from Locke's own premises*, would he endorse extending the franchise (voting rights) to long-term non-citizen residents? Or does his distinction provide grounds for exclusion?
      *   **Secondary Question:** Does this case expose a tension within his theory of political obligation?
      *   **Constraint:** Avoid present-day political norms/arguments; stick to Locke's internal logic.

  2.  **Deconstruct Locke's Theory (Key Textual Points):**
      *   *Express Consent:* Makes one a "perfect member" of civil society (citizen). Irrevocable. Involves oath, explicit agreement. Creates full political obligation and full rights (including franchise, presumably).
      *   *Tacit Consent:* Given by enjoyment of property, travelling on highways, residing within the dominion. Makes one subject to the laws *while* enjoying that possession/residence. Revocable (by leaving). Does *not* make one a full member of the commonwealth.
      *   *Property:* Central to Locke. Protection of property is the main end of government.
      *   *Franchise:* Locke doesn't explicitly detail voting rights in the *Second Treatise* as we understand them today (universal suffrage wasn't the norm), but he links political power to the legislative, which represents the property-owning members.
      *   *Aliens/Foreigners:* Locke distinguishes between members of the body politic and those merely under protection.

  3.  **Evaluate the "Franchise for Residents" Proposal against Locke's Premises:**
      *   *Argument for Exclusion (The Strict Reading):*
          *   Tacit consent creates obligation to obey, but not membership.
          *   Voting is an act of sovereignty/legislative power.
          *   Only "perfect members" (express consenters) hold a share in the legislative power.
          *   Therefore, tacit consenters (residents) obey laws but don't make them.
          *   *Conclusion:* Locke would likely exclude them from the franchise.
      *   *Argument for Inclusion (The Functional/Property Reading):*
          *   Government exists to protect property (life, liberty, estate).
          *   Long-term residents hold property (or at least have a stake in "estate").
          *   Taxation requires consent (via representatives).
          *   If residents are taxed and bound by laws permanently (de facto), treating them as mere tacit consenters who can just "leave" might violate the spirit of property protection.
          *   *Counter-Counter:* Locke explicitly says tacit consenters can leave. If they stay, they accept the status quo.
      *   *The "Tension" Aspect:*
          *   If the goal is protection of rights/property, and residents have rights/property, why exclude them from the mechanism of protection (voting)?
          *   If the goal is legitimacy via consent, and residents give tacit consent, is that enough for *some* participation, even if not full membership?
          *   The "Exit Option": Locke relies on the ability to leave to justify tacit consent. In the modern world (and even then, for some), leaving is hard. Does this undermine the legitimacy of the obligation if the franchise is denied?

  4.  **Synthesize the Argument:**

      *   *Direct Answer:* Strictly speaking, Locke would likely **exclude** them from the full franchise.
      *   *Reasoning:* The distinction between "subject" (tacit) and "citizen/member" (express) is structural. Voting is an exercise of sovereign power reserved for members.
      *   *Nuance:* However, there is a tension regarding *property* and *taxation*. Locke is big on "no taxation without representation." If residents pay taxes (contribute to upkeep), Locke's logic on property might push toward inclusion, *but* his definition of membership pulls toward exclusion.
      *   *The Tension:* The tension lies between the *voluntarist* basis of authority (consent) and the *functional* basis of authority (protection of property). Tacit consent secures obligation but denies agency. If residence becomes permanent (de facto), the "right to leave" becomes a fiction, making the obligation look like coercion without representation.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. State the thesis: Strictly, Locke excludes them, but it reveals a tension regarding property and permanence.
      *   *Section 1: The Textual Case for Exclusion.* Focus on Chapter VIII ("Of the Beginning of Political Societies"). Explain the "perfect member" vs. "temporary subject" distinction. Voting is a legislative act; only members constitute the legislative body. Tacit consent binds you to the law, it doesn't give you a hand in making it.
      *   *Section 2: The Property/Taxation Complication.* Locke's main purpose is preserving property. If residents own land/estate, they have a stronger claim. Locke links franchise to property ownership historically. If a non-citizen owns land, does that trigger express consent? (Locke says owning land is a strong form of tacit consent, almost binding you permanently). This is a tricky spot. *Correction:* Locke says owning land makes you a member *if* you incorporate that property into the commonwealth. But a resident alien might just hold property under protection.
      *   *Section 3: The Tension.* The "Exit Option." Tacit consent relies on the liberty to depart. If modern residency is long-term/permanent, the "right to leave" is theoretical. If they can't leave easily, tacit consent looks like coercion. If they are coerced, the government fails its end (protection of liberty). Excluding them from the vote while binding them permanently creates a class of subjects without rights, which risks tyranny (Locke's fear).
      *   *Conclusion:* Summarize. Locke prioritizes the integrity of the "body politic" (express consent) over the intuitive fairness of "affected interests." But the theory strains when residence becomes indistinguishable from membership in practice.

  6.  **Refining the Lockean Nuances (Self-Correction during drafting):**
      *   *Check:* Did Locke explicitly link voting to express consent? He links *legislative power* to the community. The community is made of express consenters. So yes, indirectly.
      *   *Check:* What about property? Locke argues that by owning land, you submit to the jurisdiction. Does owning land make you a member? In *Second Treatise* §117, he says owning land is a tacit consent that binds you *while* you enjoy it. It doesn't automatically make you a "perfect member" unless you incorporate it fully.
      *   *Check:* Is the franchise the only metric? The prompt asks about the franchise specifically. I need to ensure I don't drift into general rights.
      *   *Key Insight:* The tension is between *legitimacy* (derived from consent) and *stability/function* (derived from property protection). If a large class of people are bound by laws but have no voice, is that consistent with the "end of government"? Locke might say yes, as long as they can leave. If they can't leave, the theory wobbles.

  7.  **Final Polish:** Ensure tone is academic, respectful of the text, and directly addresses the "strictly from Locke's premises" constraint. (Avoid saying "Locke would be a liberal today" or "Locke was wrong.")

      *(Self-Correction on "Strictly Locke's Premises"):* I must be careful not to import modern democratic assumptions about what voting *means*. For Locke, voting is about constituting the legislative power. It's not just "having a say"; it's "being part of the sovereign."

      *Plan:*
      1.  Define the Express/Tacit distinction clearly (Ch. 8).
      2.  Apply to Franchise (Legislative Power).
      3.  Analyze the Property/Taxation angle.
      4.  Identify the Tension (Permanence vs. Exit).
      5.  Conclude.

  8.  **Final Review against constraints:**
      *   Strictly Locke's premises? Yes.
      *   Address franchise? Yes.
      *   Address tension? Yes.
      *   No present-day politics? Yes (keep it theoretical).

      *(One more thought)*: I should mention that for Locke, the franchise wasn't universal even for express consenters (property qualifications existed in his context). But the *principle* of membership is the key. Non-members don't get to vote, regardless of property, unless that property incorporation implies membership.

      *Wait, §117:* "Every man that hath any possession or enjoyment of any part of the dominions of any government doth thereby give his tacit consent... *during such enjoyment*." This implies temporariness. Long-term residents blur this.
      *Also §122:* Distinguishes between being a "subject" and a "member."
