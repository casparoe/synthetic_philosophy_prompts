answer: |-
  This is an excellent question that cuts to the heart of Lockean legitimacy. If we reason strictly from the internal logic of the *Second Treatise*, rather than importing contemporary democratic norms, the answer is nuanced but leans heavily toward **exclusion**, though this conclusion exposes a significant tension in Locke's account of property and permanence.

  Here is an analysis of how Locke's premises apply to the franchise for long-term residents, and where the theoretical friction lies.

  ### 1. The Textual Case for Exclusion: Membership vs. Subjection
  To determine if Locke would grant the franchise, we must first determine what the franchise *is* in his theory. For Locke, voting is not merely a mechanism for preference aggregation; it is an exercise of sovereign power. It is the means by which the "Community perpetually retains a Supream Power of saving themselves from the attempts and designs of any Body" (II, §149).

  Locke draws a sharp ontological line between two types of people within a territory:
  *   **Perfect Members (Express Consent):** These individuals have explicitly incorporated themselves into the political society. They are the "Body Politic." They are permanently bound to the state (they cannot revert to the state of nature by leaving) and they hold a share in the legislative power.
  *   **Temporary Subjects (Tacit Consent):** These individuals are under the protection of the government and obligated to obey its laws, but they are not part of the sovereign body. Their obligation is conditional on their enjoyment of the territory (II, §119).

  **The Verdict:** Strictly speaking, Locke would **exclude** long-term residents from the franchise.
  The right to vote (to choose the legislature) is a right reserved for those who constitute the political society. Tacit consent creates an obligation to *obey* the law, but it does not confer the authority to *make* the law. As Locke writes in §122, a resident alien who gives tacit consent "is not locally a Member" of the commonwealth. To grant them the vote would be to grant a share of sovereignty to someone who has not surrendered their natural executive power to the community through express agreement. For Locke, the franchise is a marker of *membership*, not merely *residence*.

  ### 2. The Complication: Property and Taxation
  However, the case becomes complicated when we introduce Locke's primary justification for government: the preservation of property (life, liberty, and estate).

  Locke is adamant that government cannot take property (via taxation) without the consent of the people, given by themselves or their deputies (II, §140). This is often summarized as "no taxation without representation."
  *   **The Resident's Claim:** Long-term residents typically hold property (or at least labor for wages, which Locke considers a form of estate) and pay taxes. They contribute to the "upkeep" of the government.
  *   **The Lockean Counter:** Locke might argue that by choosing to reside and hold property there, the resident has given tacit consent to the *existing* tax structure. They are consenting to the terms of the host. If they dislike the taxation, the Lockean remedy is **exit**. As long as the "right to leave" is theoretically open, the obligation to pay taxes without a vote remains legitimate under tacit consent.

  However, there is a specific textual wrinkle regarding land ownership. In §117, Locke suggests that owning land within a dominion is a stronger form of consent than mere travel. He implies that by incorporating your land into the commonwealth, you become more tightly bound. Some interpreters argue that for Locke, freehold property ownership was the functional equivalent of express consent in 17th-century England. If a long-term resident owns land, a Lockean argument *could* be made that they have effectively incorporated themselves into the society and thus deserve the franchise. But if they are merely renters or temporary workers, Locke's text offers them no claim to the vote.

  ### 3. The Exposed Tension: Permanence and the "Exit Option"
  This case exposes a profound tension within Locke's theory of political obligation regarding **permanence**.

  Locke's theory of tacit consent relies entirely on the **voluntariness of residence**. The legitimacy of binding a non-member to the laws rests on the premise that they are free to leave. Locke writes, "when he has annexed his Possessions... to the Commonwealth, he must... submit to the conditions... or else... give it up" (II, §120).

  **The Tension:**
  1.  **Theoretical Exit vs. Practical Permanence:** Locke assumes a world where migration is relatively fluid. In a context where long-term residency becomes permanent (due to economic ties, family, or border controls), the "right to leave" becomes a fiction.
  2.  **Obligation without Agency:** If a resident cannot practically leave, their "tacit consent" ceases to be voluntary and becomes coerced. If they are coerced into obedience but denied the franchise (because they haven't given *express* consent), they are in a position of **political slavery** without the protections of membership.
  3.  **The End of Government:** Locke argues the end of government is the preservation of rights. If a class of people is permanently bound by laws they have no hand in making, and they cannot leave, the government is failing to preserve their liberty relative to the legislative power.

  This creates a dilemma for Locke's premises:
  *   **Horn A:** Maintain the strict distinction. Non-citizens cannot vote. *Result:* You create a permanent underclass of subjects bound by laws they didn't make, which risks the tyranny Locke seeks to avoid.
  *   **Horn B:** Grant the vote based on residence. *Result:* You blur the line between tacit and express consent. If tacit consent grants a share of sovereignty, the special status of the "perfect member" dissolves, and the irrevocable nature of political obligation (which stabilizes the state) is weakened.

  ### 4. Conclusion
  Reasoning strictly from Locke's premises, he would likely **deny the franchise** to long-term non-citizen residents. His theory prioritizes the integrity of the "Body Politic" (formed by express consent) over the intuitive fairness of "affected interests." The franchise is a right of membership, not a right of human beings or mere residents.

  However, this case exposes a **structural weakness in the tacit consent doctrine**. Locke's theory works best in a world of high mobility where residence is truly temporary. When residence becomes de facto permanent, the distinction between "subject" and "member" collapses in practice, even if it holds in theory.

  If residents cannot leave, their tacit consent is indistinguishable from coercion. At that point, Locke's own principle—that legitimate authority requires voluntary consent—suggests that the state must either allow them to leave freely or offer them a path to express consent (naturalization) with the accompanying franchise. To do neither would be to govern a portion of the population without their consent, violating the very foundation of Lockean legitimacy. Thus, while Locke would exclude them from the vote *as non-members*, his theory demands they not be trapped in that status indefinitely.
