answer: |-
  Your friend is relying on a very common "pop philosophy" summary of William James that oversimplifies his actual argument. While James does push back against W.K. Clifford, he does not refute him entirely, nor does he argue that truth is simply "whatever feels good" or that you can believe anything without evidence.

  Here is a breakdown of where your friend's interpretation goes off the rails, what James actually argued, and whether Clifford is truly "refuted."

  ### 1. The "Truth is What Works" Misunderstanding
  Your friend is conflating James's 1896 essay *"The Will to Believe"* with his later 1907 lectures on *Pragmatism*.

  While James is a pragmatist, his argument in *"The Will to Believe"* is not primarily a definition of truth. It is an argument about the **ethics of belief**. He isn't arguing that believing something makes it objectively true in a magical sense. Rather, he is arguing that in certain specific situations, **belief is a necessary precondition for finding out if something is true.**

  For example, if you don't believe someone trusts you, you may never act in a way that allows them to trust you. Your belief helps *create* the fact. In this specific sense, the belief "works." But James isn't saying you can believe the earth is flat because it makes you feel safe. He acknowledges that for empirical facts (like science), evidence is king.

  ### 2. James's "Genuine Option" (The Fine Print)
  This is the most important part your friend likely missed. James does not give a blank check to believe anything without evidence. He sets up strict criteria for when it is permissible to let your "passional nature" (emotions/hopes) decide a belief.

  He calls this a **Genuine Option**. For James to allow belief without sufficient evidence, the choice must be three things:
  1.  **Live:** The hypothesis must be plausible to you. (You can't force yourself to believe in a god you find conceptually impossible).
  2.  **Forced:** You cannot avoid the choice. Skepticism is not an opt-out; refusing to choose is itself a choice (e.g., refusing to believe in God is effectively choosing atheism).
  3.  **Momentous:** The opportunity is unique, significant, and irreversible. (This isn't about whether to have oatmeal or eggs; it's about life-altering commitments).

  James argues that **only** when a decision is Live, Forced, and Momentous *and* the evidence is inconclusive do we have the right to believe based on our passional needs. If evidence is available, James agrees with Clifford: follow the evidence.

  ### 3. Does James Refute Clifford for *Any* Belief?
  No. James explicitly agrees with Clifford regarding scientific and empirical claims.

  *   **Clifford's Domain:** Public facts, science, history, and everyday empirical claims. James agrees you should never believe a scientific theory without evidence just because it makes you happy.
  *   **James's Domain:** Metaphysical, moral, and religious questions where evidence is inherently unavailable. James argues that in these specific areas, waiting for "sufficient evidence" (as Clifford demands) might mean you miss out on the truth entirely, because the truth in these areas might only reveal itself to those who take the risk of belief first.

  So, James doesn't refute Clifford; he **limits** Clifford. He thinks Clifford's rule ("It is wrong always, everywhere, and for anyone to believe anything upon insufficient evidence") is a great rule for science but a terrible rule for religion and morality.

  ### 4. The "Cash Value" Nuance
  Your friend mentioned "cash value." In Jamesian pragmatism, this doesn't mean "financial gain" or "immediate comfort." It means: **What practical difference does it make in your experience?**

  If two beliefs lead to the exact same practical outcome, James says they are the same belief. However, if believing in free will makes you act more responsibly, and believing in determinism makes you act lazily, the "cash value" of the free will belief is higher.

  But James admits this is risky. He acknowledges that believing without evidence can lead to error. His point is that **avoiding error** (Clifford's goal) is not the only intellectual virtue; **gaining truth** is also a virtue. Clifford says, "Better to believe nothing than risk believing a lie." James says, "If you believe nothing, you might miss a truth that was only available to believers."

  ### 5. A Comeback for Your Next Argument
  If you want to push back, you don't need to defend Clifford entirely (who can be seen as a bit rigid), but you can point out the limits of James's argument.

  **Here is the core distinction:**
  James is not arguing that **evidence is irrelevant.** He is arguing that **evidence sometimes runs out.**

  *   **If your friend says:** "James says I can believe anything if it works for me."
  *   **You say:** "Actually, James specifically says you can't do that. He agrees with Clifford on scientific facts. He only allows belief without evidence when the option is 'momentous' and the evidence is genuinely inconclusive. You can't use James to justify believing in conspiracy theories or ignoring medical advice."

  *   **If your friend says:** "Clifford is wrong because truth is just what works."
  *   **You say:** "James doesn't say truth is *just* what works. He says that for certain human relationships and moral commitments, belief is required to *make* it work. But for facts about the external world, Clifford is still right: believing without evidence is dangerous."

  ### The Verdict
  Your friend is half-right but mostly oversimplifying.
  *   **James does argue** that we have a right to believe in religious/moral propositions without coercive evidence.
  *   **James does NOT argue** that this applies to all beliefs (like science or history).
  *   **Clifford is NOT refuted** generally; his evidentialism remains the standard for empirical inquiry.

  The debate isn't a knockout; it's a division of labor. Clifford governs the laboratory and the courtroom; James governs the church, the moral commitment, and the existential leap. Your friend is trying to use James's rules for the church to win an argument about the laboratory.
