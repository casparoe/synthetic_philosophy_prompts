prompt: |-
  A friend and I spent a good chunk of last night arguing about epistemic akrasia after our seminar on formal epistemology spent a week on higher-order evidence, and neither of us really managed to convince the other, so I'd like a more careful outside take than we could produce ourselves.

  The case that got us stuck was a variant of one from the reading. Picture a medical resident near the end of a thirty-hour shift, working out a weight-based drug dosage by hand. She's done this exact calculation hundreds of times and is genuinely excellent at it. Tonight nothing about the process feels any different from usual: she goes through the steps, gets a number, checks it once, and can't find an error. But she also knows, from her own training, that residents who've been awake this long get precisely this kind of calculation wrong roughly half the time, all while feeling just as confident and clear-headed as when they're rested. There's no calculator to double-check against and no colleague around, and re-deriving the number from scratch just reproduces the same confident feeling. My friend's position, following what she called the "Enkratic Principle" (she claimed Titelbaum defends a strong version of it, and that it's basically what Sophie Horowitz calls the "Non-Akrasia Constraint"), is that it's simply irrational for the resident to end up trusting the number while also believing her own reasoning is probably unreliable tonight, so rationality requires her to actually lower her confidence in the dosage, full stop. I pushed back that this throws away perfectly good first-order evidence: nothing about the fatigue changes what the arithmetic itself shows, so revising the belief looks like ignoring evidence sitting right in front of her, which seems just as irrational as ignoring the base-rate information about tired residents. We went back and forth on "Level-Splitting" views (I gather this is associated with people like Lasonen-Aarnio) that let her stay confident in the dosage while also believing her evidence probably doesn't support that confidence, but neither of us could really explain why that isn't just a cheap way of having it both ways.

  Could you lay out, more rigorously than we managed: (1) why cases like this are thought to generate a genuine dilemma rather than dissolving once you "just update on the total evidence"; (2) what exactly the Level-Splitting response is offering as a way out, and in what sense it's supposed to respect all of the resident's evidence; and (3) why that response is usually taken to come with a serious cost via a "bootstrapping" problem — that is, why permitting this kind of split between first-order and higher-order belief, even in a single case, seems to commit the resident, if she keeps finding herself in similar situations, to reasoning her way back to full confidence that she's never actually impaired. If there's a good reply available to a Level-Splitter against that bootstrapping charge, I'd be curious to hear it too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and a friend argued about epistemic akrasia (specifically regarding higher-order evidence) after a seminar. They are stuck on a specific case (the tired medical resident).
      *   **The Case:** A skilled resident calculates a dosage while fatigued. She feels confident (first-order evidence seems strong), but knows fatigue causes errors 50% of the time even when one feels confident (higher-order evidence suggests unreliability).
      *   **The Dispute:**
          *   Friend (Enkratic Principle/Non-Akrasia Constraint): It's irrational to believe $P$ while believing your evidence doesn't support $P$. She must lower confidence.
          *   User (Total Evidence/Level-Splitting intuition): Lowering confidence ignores the first-order evidence (the calculation itself).
          *   Shared Confusion: They discussed Level-Splitting (Lasonen-Aarnio) but couldn't articulate why it's not just "having it both ways" or how it avoids bootstrapping.
      *   **The Task:** Provide a rigorous outside take on:
          1.  Why this is a genuine dilemma (why "total evidence" doesn't easily dissolve it).
          2.  What Level-Splitting offers and how it claims to respect evidence.
          3.  The "bootstrapping" cost/objection against Level-Splitting.
          4.  Potential replies to the bootstrapping charge.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **The Core Tension:** First-Order Evidence (FOE) vs. Higher-Order Evidence (HOE).
          *   FOE: The math, the patient's weight, the drug concentration. Points to Dosage $X$.
          *   HOE: "I am tired," "Tired people make mistakes." Points to "My belief in $X$ is likely false/unjustified."
      *   **The Enkratic Principle (Non-Akrasia Constraint):** Roughly: "Do not believe $P$ while believing that believing $P$ is irrational/unsupported." (Feldman, Titelbaum, Horowitz).
      *   **The Steadfast/Level-Splitting View:** It can be rational to believe $P$ is true (based on FOE) while believing my belief in $P$ is irrational/unreliable (based on HOE). (Lasonen-Aarnio, Weatherson, sometimes Christensen).
      *   **The Bootstrapping/Self-Undermining Objection:** If I can ignore HOE about my reliability, can I reason my way to knowing I'm reliable? (Cohen, Vogel).

  3.  **Drafting Section 1: The Genuine Dilemma (Why "Total Evidence" fails):**
      *   *The Friend's Worry:* If I believe "My process is 50% reliable," how can I rationally hold "Dosage is Correct" with high confidence? That violates coherence.
      *   *The User's Worry:* If I lower confidence, I'm ignoring the fact that the math *actually looks right*. The fatigue didn't change the numbers.
      *   *Why "Just Update" is hard:* Standard Bayesian updating treats evidence as propositions. But HOE isn't just a proposition about the world; it's a proposition about the *link* between the mind and the world.
      *   *The "Defeater" status:* HOE acts as an undercutting defeater. It attacks the warrant, not the truth.
      *   *The Dilemma:* Either you violate rational coherence (akrasia) or you violate evidentialism (ignoring FOE).

  4.  **Drafting Section 2: Level-Splitting (The Way Out?):**
      *   *Definition:* Distinguishing between the rationality of the *belief* (is $P$ true?) and the rationality of the *attitude* (am I justified?).
      *   *Lasonen-Aarnio's specific contribution:* Distinguishing *reasonableness* (responding to FOE) from *rationality* (coherence/HOE). Or, more commonly, distinguishing the object-level proposition from the epistemic proposition.
      *   *Respecting Evidence:*
          *   FOE is respected by maintaining confidence in the dosage (the math didn't change).
          *   HOE is respected by admitting "I might be wrong" or "My belief is not knowledge."
      *   *The "Cheap Way Out" Critique:* It looks like Moore's Paradox ("$P$, but I shouldn't believe $P$"). It feels unstable.
      *   *The Defense:* The world is messy. Sometimes evidence conflicts. FOE says $P$, HOE says "Don't trust your take on $P$." Why must one win?

  5.  **Drafting Section 3: The Bootstrapping Problem (The Cost):**
      *   *The Setup:* If the resident can ignore the HOE (fatigue) because her FOE (calculation) says she's right, what happens over time?
      *   *The Mechanism:*
          1.  I calculate $X$. I feel confident.
          2.  I have HOE saying I'm unreliable.
          3.  Level-Splitting says: Keep confidence in $X$.
          4.  Since I'm confident in $X$, and $X$ turns out right (let's assume), I conclude "I wasn't impaired."
          5.  Repeat. I now believe I'm never impaired when I feel confident.
      *   *Why it's bad:* This is "question-begging" or "epistemic circularity." I'm using my reasoning to prove my reasoning is reliable, while explicitly acknowledging evidence that it isn't. It allows one to insulate oneself from criticism.
      *   *Connection to the Case:* If the resident survives the night without killing the patient, can she conclude "See? My fatigue didn't matter"? Level-Splitting seems to allow this inference too easily.

  6.  **Drafting Section 4: Replies to Bootstrapping:**
      *   *Distinguishing Types of Defeat:* Maybe HOE defeats *knowledge* but not *justification*? (Williamson).
      *   *The "No Self-Knowledge" Reply:* Maybe we don't have direct access to our own reliability in the moment.
      *   *Lasonen-Aarnio's specific defense:* She argues that rationality is not the ultimate epistemic value. *Reasonableness* (responding to FOE) is more important. So, being "akratic" is fine if it means being right.
      *   *The "Steadfast" Bayesian:* Maybe the HOE shouldn't shift the credence in $P$ directly, but should shift the credence in *what my credence should be*. (This gets technical, maybe keep it simpler).
      *   *Better Reply:* Distinguish between *local* splitting and *global* insulation. You can split in one case, but you can't use the outcome to update your general reliability function without independent calibration.

  7.  **Review and Refine:**
      *   *Tone:* Academic but accessible (they are seminar students). Rigorous but clear.
      *   *Attribution:* Ensure Titelbaum, Horowitz, Lasonen-Aarnio, Christensen are mentioned correctly in context.
      *   *Clarity Check:* Did I explain *why* "Total Evidence" doesn't solve it? Yes, because HOE targets the connection, not the content.
      *   *Clarity Check:* Did I explain Bootstrapping clearly? Yes, the "reasoning to reliability" loop.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to conflate "Level-Splitting" with "Steadfastness." They are related but Level-Splitting specifically allows the akratic state ($P$ & $\neg$Justified($P$)).
      *   *Nuance:* The user mentioned "ignoring evidence." I need to clarify that HOE *is* evidence. The dispute is about how it weighs against FOE.
      *   *Structure:* Use the numbered points requested by the user.

  9.  **Final Output Generation:** (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic and notoriously difficult knot in formal epistemology. You and your friend have accurately identified the fault lines: the tension between **coherence requirements** (the Enkratic Principle) and **evidentialist requirements** (responding to first-order evidence). The medical resident case is a staple because it isolates Higher-Order Evidence (HOE) from First-Order Evidence (FOE) cleanly.

  Here is a rigorous breakdown of the dilemma, the Level-Splitting response, and the bootstrapping cost, structured to help you untangle the argument.

  ---

  ### 1. Why "Total Evidence" Does Not Dissolve the Dilemma

  Your intuition was that the resident should just "update on the total evidence." The problem is that in cases of misleading HOE, FOE and HOE pull in orthogonal directions, and standard Bayesian updating struggles to model how they interact without violating one normative constraint or another.

  **The Conflict of Norms:**
  *   **Evidentialism:** You ought to proportion your belief to the support provided by your evidence.
      *   *FOE:* The calculation steps, the weight, the concentration. These objectively support *Dosage X*.
      *   *HOE:* The fact of fatigue, the base-rate of error. This supports *~(My belief in Dosage X is reliable)*.
  *   **Rational Coherence (The Enkratic Principle):** You ought not to hold contradictory attitudes. Specifically: *Do not believe P while believing that believing P is irrational/unsupported.* (This is what Titelbaum and Horowitz defend).

  **Why "Total Evidence" Fails:**
  If the resident simply averages the evidence, she lowers her confidence in *Dosage X*.
  *   **The Cost:** She is effectively treating the HOE as *first-order counter-evidence* against the dosage. But fatigue doesn't change the math. The patient's weight didn't change because she got tired. By lowering confidence in the dosage, she is acting as if the HOE changed the world, rather than changing her access to the world. This violates the intuition that FOE is "opaque" to HOE; the calculation remains valid regardless of her state.

  If the resident ignores the HOE and keeps confidence high:
  *   **The Cost:** She believes *P* (Dosage X is correct) while believing *Q* (My process for deriving P is 50% reliable). If she believes her process is 50% reliable, she must believe her current belief is likely unsupported. This violates the Enkratic Principle. She is epistemically akratic.

  **The Dilemma:**
  The dilemma is genuine because HOE acts as an **undercutting defeater**, not a rebutting defeater.
  *   A *rebutting* defeater gives you evidence that *P* is false (e.g., a colleague says "The weight is 50kg, not 100kg").
  *   An *undercutting* defeater gives you evidence that your *connection* to *P* is broken.
  Standard updating handles rebutting defeaters well. It handles undercutting defeaters poorly because they target the *justification* of the belief, not the *content*. If you update your credence in *P* based on HOE, you treat justification as evidence for truth, which seems category-mistaken. If you don't, you violate coherence.

  ### 2. The Level-Splitting Response

  This is the position you were intuitively pushing, often associated with **Maria Lasonen-Aarnio** (and in some forms, Roger Christensen or Brian Weatherson).

  **The Core Claim:**
  Level-Splitting argues that rationality is not a unified, monolithic constraint. It is possible to be **reasonable** (responding correctly to FOE) while being **irrational** (violating coherence norms regarding HOE).
  *   **Object-Level:** It is rational to believe *Dosage X* (because the math supports it).
  *   **Meta-Level:** It is rational to believe *My belief in Dosage X is unsupported* (because the fatigue supports that).

  **How It Respects All Evidence:**
  The Level-Splitter claims their view is the *only* one that respects the distinct roles of the two evidence types:
  1.  **Respecting FOE:** By maintaining high confidence in the dosage, the resident acknowledges that the arithmetic is sound. She does not let irrelevant facts (her fatigue) alter her view of the necessary truths (the math).
  2.  **Respecting HOE:** By acknowledging her unreliability, she admits she lacks *knowledge* or *warrant*. She might say, "I believe X is the dose, but I don't *know* it, and I wouldn't bet my license on it."

  **Why It Isn't Just "Having It Both Ways":**
  Your friend likely sees this as Moore-Paradoxical ("P, but I shouldn't believe P"). The Level-Splitter replies that this tension is a feature of the human epistemic condition, not a bug. In a world where our cognitive faculties are fallible and we have evidence of that fallibility, there will be gaps between **what is true/supported** and **what we are justified in trusting ourselves about**.
  Lasonen-Aarnio argues that we should prioritize **reasonableness** (getting the right answer based on the world) over **rationality** (internal coherence). If the resident lowers her confidence, she makes a medical error (under-dosing). If she keeps confidence but acknowledges risk, she saves the patient but suffers epistemic guilt. The Level-Splitter says: take the guilt, save the patient.

  ### 3. The Bootstrapping Cost (The "Self-Undermining" Objection)

  This is the strongest argument against Level-Splitting, often associated with **Jonathan Vogel** or **Stewart Cohen**. It argues that if you allow Level-Splitting, you allow agents to reason their way to unjustified confidence in their own reliability.

  **The Mechanism of Bootstrapping:**
  Imagine the resident adopts the Level-Splitting view. She encounters the fatigue (HOE) but trusts her calculation (FOE).
  1.  **Case 1:** She calculates Dosage A. She feels tired. She splits levels (Believes A, believes she might be wrong). She administers A. The patient does not die.
  2.  **Inference:** She reasons: "If I had been impaired, I likely would have killed the patient. The patient is fine. Therefore, I was likely not impaired in this instance."
  3.  **Case 2...N:** She repeats this over a month. Every time she feels tired but calculates a dose, she trusts the dose (Level-Splitting). Every time the patient survives, she updates her reliability statistic.
  4.  **Result:** She eventually concludes: "My feeling of confidence is a reliable indicator of truth, even when I am tired."

  **Why This Is Fatal:**
  This is **epistemic circularity**. She has used her reasoning faculties to verify the reliability of her reasoning faculties, *while explicitly possessing evidence that those faculties were compromised*.
  *   If Level-Splitting is permitted, the HOE (fatigue) never actually gets to *reduce* her confidence in the specific outcome.
  *   Because the confidence never reduces, the successful outcomes count as "confirmations" of reliability.
  *   She effectively "bootstraps" herself into believing she is super-human, insulating herself from the very HOE that was supposed to warn her.

  In the seminar context, this is why your friend insisted on the Enkratic Principle. If the resident *must* lower her confidence due to fatigue, she cannot use the successful outcome to prove she wasn't fatigued, because her low confidence acknowledges the risk was real. Level-Splitting removes the "brake" that prevents self-aggrandizing reasoning.

  ### 4. Is There a Reply for the Level-Splitter?

  There are two sophisticated replies a Level-Splitter can make to avoid the bootstrapping charge.

  **A. Distinguishing Local vs. Global Reliability (Lasonen-Aarnio's Defense)**
  Lasonen-Aarnio argues that bootstrapping requires an illegitimate inference from *local* success to *global* reliability.
  *   **The Reply:** The resident can split levels in the local case (Believe *Dosage X*, believe *My process is risky*) without being permitted to use the outcome to update her *general* reliability function.
  *   **The Mechanism:** She can treat the survival of the patient as "luck" rather than "evidence of reliability." Since she acknowledged the risk (via the meta-belief), she is not epistemically permitted to treat the success as a confirmation of skill.
  *   **The Weakness:** This requires a very strict rule about when one is allowed to update on outcomes. It feels ad hoc to say "You can believe P, but you can't use P's truth to update your reliability."

  **B. The "Knowledge Norm" Reply (Williamson-style)**
  Some argue that Level-Splitting is acceptable if we distinguish between **Belief** and **Knowledge**.
  *   **The Reply:** The resident can *believe* the dosage is correct (respecting FOE) but she does not *know* it (respecting HOE).
  *   **Avoiding Bootstrapping:** You cannot bootstrap knowledge from mere belief. Since she admits she doesn't *know* the dosage was correct (only that it was likely), she cannot use the outcome to claim she *knew* she was reliable. The "success" is compatible with luck, and without knowledge, the feedback loop is broken.
  *   **The Strength:** This preserves the intuition that she should act on the dosage (belief) while acknowledging the defect (lack of knowledge).

  ### Summary for Your Debate

  *   **Your Friend (Enkratic/Conciliationist):** Is worried about **insulation**. If you don't lower confidence, you make yourself immune to evidence of your own irrationality. This leads to bootstrapping.
  *   **You (Level-Splitting/Steadfast):** Are worried about **evidential neglect**. If you lower confidence, you are letting a psychological fact (fatigue) change a mathematical fact (dosage). This leads to bad outcomes.
  *   **The Synthesis:** The most rigorous position is likely a **moderate Level-Splitting**. The resident should maintain high credence in the dosage (FOE wins on truth) but significantly lower her credence that she *knows* the dosage or that she is *justified* (HOE wins on warrant).
  *   **The Bootstrapping Check:** To avoid bootstrapping, she must agree that surviving the night does not prove she wasn't impaired. It only proves she wasn't impaired *in a way that caused harm this time*. She cannot update her general reliability statistic upward without independent calibration (e.g., a calculator check the next day).

  If you can agree that **Belief** and **Justification** can come apart, you solve the dilemma. If you insist they must track together, you must choose between ignoring the math or ignoring the fatigue. Most contemporary formal epistemologists lean toward allowing them to come apart (Level-Splitting) but impose strict constraints on how that split can be used for future learning (blocking bootstrapping).
