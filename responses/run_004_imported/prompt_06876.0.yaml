      *   **User:** Second-year PhD student in philosophy.
      *   **Field:** Formal epistemology and decision theory.
      *   **Task:** Writing a final paper for a graduate seminar on rational choice.
      *   **Topic:** Updateless Decision Theory (UDT) / Functional Decision Theory (FDT).
      *   **Goal:** Wants feedback on a core draft section before circulating it.
      *   **Specific Concerns:**
          1.  Technical accuracy of the CDT/EDT/UDT contrast and Counterfactual Mugging description.
          2.  Validity of the analogy to McClennen's Resolute Choice.
          3.  Strength/Novelty of the ex-ante vs. ex-post rationality objection (is it known? is there a standard rebuttal? does it work?).
      *   **Tone:** Professional, academic, rigorous, but open to critique. The user is smart and knows the literature but wants to avoid embarrassment on technicalities or missing key objections.

  2.  **Analyze the Draft Text:**
      *   **UDT Definition:** Describes UDT as optimizing a policy (function from epistemic states to acts) against the prior, rather than updating then optimizing. *Assessment:* Generally accurate, though "epistemic states" might need slight nuance (usually it's "observations" or "input states").
      *   **Counterfactual Mugging:** Describes the scenario (Omega, coin flip, $10k/$100). CDT/EDT refuse. UDT pays based on ex-ante EV. *Assessment:* Accurate standard presentation.
      *   **McClennen Analogy:** Connects UDT to Resolute Choice (sticking to a plan despite ex-post preference reversal). Notes McClennen focused on internal preference reversals, UDT on external predictors. *Assessment:* This is a strong and insightful connection. It's not a perfect identity, but structurally similar regarding dynamic consistency.
      *   **The Objection:** The "slide" from epistemic (you would have been predicted differently) to normative (therefore defecting now is irrational). Claims UDT hasn't earned why ex-post rationality should bow to ex-ante optimization in the *actual* branch. *Assessment:* This is the crux. It touches on the "Why ain'cha rich?" vs. "Rationality" debate.

  3.  **Address Specific Concerns (Mental Sandbox & Literature Check):**

      *   **Concern 1: Technical Accuracy.**
          *   *UDT/FDT:* The description is solid. One nuance: UDT/FDT often talk about optimizing over *logical* counterfactuals or subjunctive dependencies, not just "policies" in the causal sense. But for a seminar paper, the policy framing is acceptable.
          *   *Counterfactual Mugging:* The setup is standard. One detail: Omega predicts what you *would* do. UDT agents don't "update" on the coin flip in the standard Bayesian sense before deciding the policy. The draft says "prior to updating on its observations." This is correct.
          *   *CDT/EDT:* CDT refuses (no causal link). EDT refuses (conditional on being asked, paying is bad). Correct.

      *   **Concern 2: McClennen's Resolute Choice.**
          *   *McClennen:* In *Rationality and Dynamic Choice*, McClennen argues against Sophisticated Choice (backward induction) and for Resolute Choice (sticking to the plan) to solve dynamic inconsistency (e.g., Allais paradox over time).
          *   *Analogy:* UDT *is* essentially a form of resolute choice applied to logical/timeless dependencies rather than just temporal ones.
          *   *Disanalogy:* McClennen's agent fights their *own* future self. UDT agent fights the *structure of the problem* (Omega's prediction). However, the structural tension (ex-ante plan vs. ex-post incentive) is identical.
          *   *Verdict:* The analogy holds up well philosophically. It's a known connection in the community (e.g., discussions on LessWrong or by authors like Ahmed), but framing it this way in a philosophy seminar is apt.

      *   **Concern 3: The Ex-Ante/Ex-Post Objection.**
          *   *Is it known?* Yes, this is the "Why ain'cha rich?" (WACR) objection vs. the "Rationality" objection. Arif Ahmed (*Evidence, Decision and Causality*) discusses similar tensions. The specific "normative slide" critique is reminiscent of objections raised by causal decision theorists against "acausal" trade.
          *   *Standard Rebuttal:* UDT proponents (Yudkowsky, Soares, MacAskill) argue that rationality *just is* about winning. If your decision theory tells you to leave money on the table in a transparent Newcomb/Counterfactual Mugging case, it's defective. They reject the separation of "rationality at the node" from "rationality of the algorithm."
          *   *Weakness in Draft:* The draft says the slide "hasn't been earned." A UDT proponent would say the *CDT/EDT* conception of "rationality at the node" is the flawed one. The draft needs to acknowledge that UDT redefines the locus of agency from the *moment* to the *algorithm*.
          *   *Refinement:* The objection is valid but needs to be sharpened. It's not just that the slide isn't earned; it's that UDT changes the *subject* of evaluation from acts to policies. The philosophical heavy lifting is justifying *why* policies are the primary bearers of rational evaluation.

  4.  **Drafting the Response:**

      *   **Tone:** Collegial, encouraging, rigorous. Acknowledge the user's level (PhD student).
      *   **Structure:**
          1.  General Impression (Positive).
          2.  Technical Accuracy (CDT/EDT/UDT & Mugging).
          3.  McClennen Analogy (Strengths & Nuances).
          4.  The Core Objection (Ex-Ante/Ex-Post).
          5.  Specific Suggestions for Revision.
      *   **Key Points to Hit:**
          *   Confirm technical accuracy (mostly good).
          *   Validate the McClennen link (it's strong, but note the "logical vs. temporal" distinction).
          *   Address the "Known Objection" worry: It *is* known (Ahmed, Horgan, etc.), but the specific framing via McClennen is fresh.
          *   Point out the UDT rebuttal: They deny the normative force of the ex-post perspective.
          *   Suggest looking at "The Rationality of Updatelessness" literature (e.g., MacAskill's work on normative uncertainty or arguments about reflective stability).

  5.  **Refining the Feedback (Self-Correction during drafting):**
      *   *Correction:* I should make sure not to sound like I'm taking sides. I need to help the student anticipate the *committee's* reaction.
      *   *Nuance on UDT:* Make sure to distinguish between UDT (Wei Dai) and FDT (Yudkowsky/Soares). The draft conflates them slightly ("UDT... as it survives in... FDT"). This is common but worth noting. FDT uses "subjunctive dependence."
      *   *Nuance on McClennen:* McClennen's resolute choice is often criticized as "bootstrapping" or irrational stubbornness. The student should lean into this criticism as a weapon against UDT.
      *   *Literature Check:* Arif Ahmed's *Evidence, Decision and Causality* (2014) is crucial here. He discusses the "Why Ain'cha Rich" argument extensively. Also, look at Horgan's "Counterfactuals and Newcomb's Problem." The specific "ex-ante vs ex-post" tension is often discussed under "Dynamic Consistency."

  6.  **Final Polish:** Ensure the advice is actionable. Tell them what to add, what to clarify, and what papers to cite to show they've done their homework. (e.g., cite Ahmed, maybe Briggs & Pettigrew on accuracy dominance, though that's slightly different).

      *   *Wait, one more thing:* The "epistemic claim to normative claim" slide. This is the strongest part. I need to validate that this is the exact pressure point. The UDT response is usually: "There is no 'now' that is normatively privileged over the 'prior'." The student needs to argue *why* the 'now' matters.

  7.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  This is an exceptionally strong draft section. You have a clear grasp of the decision-theoretic landscape, and your instinct to bypass the tired CDT/EDT trench warfare in favor of a structural critique of UDT is strategically sound for a graduate seminar. It shows you are engaging with the frontier of the literature rather than just the textbook canon.

  Here is a breakdown of my comments addressing your three specific concerns, followed by some suggestions for tightening the argument.

  ### 1. Technical Accuracy (CDT, EDT, UDT, and Counterfactual Mugging)

  Your technical summary is **substantially accurate**, but there is one nuance regarding UDT/FDT that a sharp committee member might pounce on.

  *   **The Setup:** Your description of Counterfactual Mugging is standard and correct. CDT and EDT both refuse (CDT because the past prediction is causally fixed; EDT because conditioning on *being asked* screens off the heads-world).
  *   **The UDT Mechanism:** You write that the updateless agent asks, "which function from possible epistemic states to acts would have maximized expected utility... prior to updating." This is correct in spirit. However, in the FDT literature (Yudkowsky/Soares), the emphasis is often less on "policies" in the game-theoretic sense and more on **subjunctive dependence**. They argue that your decision *is* Omega's prediction (logically speaking), not just correlated with it.
      *   *Suggestion:* You might add a brief clause acknowledging that UDT/FDT treats the output of your decision algorithm as logically subjunctively dependent on Omega's simulation. This preempts the objection that you are treating UDT as merely "committing to a plan" rather than "computing a logical fact."
  *   **Terminology:** You conflate UDT (Wei Dai) and FDT (Yudkowsky/Soares) slightly ("UDT... as it survives in... FDT"). While they are siblings, FDT is more explicit about the logical counterfactuals. For a philosophy paper, this distinction matters less than the structural commitment to updatelessness, but acknowledging the distinction shows bibliographic care.

  ### 2. The McClennen Analogy (Resolute Choice)

  This is the strongest philosophical move in your draft. **The analogy holds up,** and it is underutilized in the mainstream decision theory literature, which tends to treat UDT as a novelty of the AI alignment community rather than a continuation of the dynamic choice debates of the 80s and 90s.

  *   **Why it works:** Both Resolute Choice and UDT reject **Separability** (the principle that the evaluation of a decision at a node should depend only on the future subtree from that node). Both privilege the ex-ante plan over the ex-post incentive.
  *   **The Disanalogy:** You correctly identify the main disanalogy: McClennen is worried about *intra-personal* dynamic inconsistency (my future self vs. my current self), while UDT is worried about *inter-personal* or *logical* dependency (me vs. Omega's simulation of me).
      *   *Refinement:* However, you can argue this disanalogy collapses in FDT. If Omega simulates *your algorithm*, then Omega's prediction is not "another person"; it is a logical instantiation of *you*. Therefore, the UDT agent is effectively resolving a conflict between its "current physical instantiation" and its "algorithmic self," which is structurally isomorphic to McClennen's temporal selves.
  *   **McClennen's Vulnerability:** You rely on memory, so here is the specific objection to McClennen you want to keep in mind: **The Bootstrapping Objection.** Critics (like Michael Bratman or David Gauthier) argued that Resolute Choice is irrational stubbornness. It allows an agent to make a plan at $t_1$ that binds them at $t_2$ to do something they know at $t_2$ is suboptimal, without any external enforcement mechanism. It looks like magic: "I choose to be bound."
      *   *Application:* If you press this, you strengthen your paper. UDT faces the exact same bootstrapping charge. It claims the agent is "bound" by the prior optimization, but what mechanism enforces this binding other than the agent's own say-so?

  ### 3. The Ex-Ante vs. Ex-Post Objection

  To answer your most important question: **Yes, this is a recognized problem, but your framing via McClennen gives it fresh leverage.**

  *   **Is it known?** The tension between "Why Ain't Cha Rich?" (WACR) and "Rationality" is the central debate in this niche. Arif Ahmed's *Evidence, Decision and Causality* (2014) is the canonical text here. Ahmed argues that WACR arguments (which UDT relies on) do not establish *rationality*, only *profitability*.
      *   *The Gap:* Many papers stop at "WACR doesn't prove rationality." Your draft goes further by identifying the *mechanism* of the slide: the move from an epistemic claim (you would have been predicted differently) to a normative one (therefore you must pay).
  *   **The Standard UDT Rebuttal:** You anticipate the reply ("the dichotomy is illusory"), but you need to be prepared for the stronger version of it. The UDT proponent (e.g., MacAskill, Soares) will argue that **the locus of agency is the algorithm, not the time-slice.**
      *   They deny that the "later node" has normative authority. They argue that if you recognize at $t_1$ that you will defect at $t_2$, you are defective at $t_1$. Therefore, to be rational at $t_1$, you must be the *kind of agent* who pays at $t_2$.
      *   *Your Counter:* Your draft hints at this, but you should make it explicit. The objection isn't just that the slide is unearned; it's that UDT **redefines rationality** to mean "reflective stability of the algorithm" rather than "appropriateness of the act to the situation." You need to argue why the latter (act-situation fit) is the pre-theoretical notion of rationality we care about.
  *   **Does it work as an objection?** Yes, but only if you clarify what "rationality" means. If rationality is defined as "maximizing utility," UDT wins. If rationality is defined as "responding appropriately to reasons available *now*," CDT wins. Your paper needs to argue that the latter definition is the philosophically privileged one. The McClennen comparison helps here: we generally think an agent who ignores current evidence/reasons to stick to a past plan is *dogmatic*, not rational.

  ### Specific Suggestions for Revision

  1.  **Cite Ahmed:** You must cite Arif Ahmed (*Evidence, Decision and Causality*, 2014) regarding the "Why Ain't Cha Rich" argument. If you don't, a committee member will ask if you know the literature. You can position your paper as extending Ahmed's critique via the McClennen framework.
  2.  **Clarify "Policy":** In the first paragraph, specify that the UDT policy maps *observations* to *acts*, but the optimization is over the *logical output* of the decision function. This clarifies the FDT distinction.
  3.  **Sharpen the "Slide":** In the final paragraph, explicitly name the fallacy you suspect. It resembles a **Modal Scope Fallacy**.
      *   *Epistemic:* Necessarily (If you are a Payer, you get $10k).
      *   *UDT Inference:* You are a Payer $\rightarrow$ You must Pay.
      *   *Critique:* This conflates the evaluation of the *type* with the evaluation of the *token act*.
  4.  **Anticipate "Reflective Stability":** The strongest UDT defense is that CDT is *reflectively unstable* (a CDT agent would pay to self-modify into UDT before the coin flip). You should briefly acknowledge this. Your counter-argument should be: "Self-modification to become resolute is profitable, but that does not make the resulting resolute acts rational at the time of execution." (This is the Ahmed line).

  ### Verdict

  You are not reinventing the wheel, but you are putting a new rim on it that looks very good. The connection to McClennen is the novel contribution here; most formal epistemologists discussing UDT come from the logic/AI background and miss the dynamic choice literature.

  **Don't worry about getting "technical details of UDT wrong" in a way that invalidates the argument.** Philosophers like Ahmed and Horgan critique UDT on exactly the grounds you are using (the normative force of the ex-post perspective). Your technical setup is sufficient for a philosophy paper (you aren't trying to code the agent).

  **Final advice:** Lean harder into the McClennen comparison. It provides a historical pedigree for your objection that grounds it in established philosophical debate, protecting you from the charge that you are just intuitions-pumping against a new formalism. If McClennen's Resolute Choice is controversial (and it is), then UDT inherits that controversy.

  Good luck with the seminar. This is PhD-level work.
