      *   *Section 2: The Anti-Mechanist Objection (The Core Conflict).* This is the crux. The Gibbs Lecture. If the mind sees truths no formal system can prove, can a computer (which is a formal system) replicate it? Uploading assumes computational sufficiency. Gödel denies this.
