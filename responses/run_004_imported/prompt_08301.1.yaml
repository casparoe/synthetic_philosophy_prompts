prompt: |-
  Random ask but hoping you can help me out with a scene – I'm drafting a novel where two of my leads, a married couple who are both academic philosophers, get into it again over dinner about metaethics. She's an expressivist, kind of a quasi-realist type; he's always been a cognitivist and is convinced her whole position falls apart because of the Frege-Geach problem. I want him to actually run the argument on her instead of just gesturing at it – something like "if cheating on your taxes is wrong then getting your accountant to help you cheat is wrong, cheating is wrong, so..." – and instead of her just saying "expressivists have an answer to that" and the scene moving on, I need her to actually give the answer, in her own words, and then I want HIM to have a genuinely good comeback to that too, not just repeat the original point in a different outfit. Neither one of them is allowed to be the strawman, they've clearly had versions of this fight for years and there both sharp. Can you write that exchange for me – dialogue plus the odd stage direction, maybe four or five hundred words – and make sure it actually tracks the philosophy instead of just hand-waving at it?
