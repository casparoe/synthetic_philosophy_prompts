answer: |-
  Mark pushed the peas around his plate, the silver fork scraping against the china. "Let's run it down. Again. Premise one: If cheating on your taxes is wrong, then getting your accountant to help you cheat is wrong. Premise two: Cheating on your taxes is wrong. Conclusion: Getting your accountant to help you cheat is wrong."

  He took a sip of wine, eyes locked on hers. "Valid modus ponens. But in premise two, 'wrong' expresses your booing attitude. In premise one, you aren't booing anything. You're hypothesizing. So 'wrong' means two different things. That's equivocation. The logic falls apart."

  Elena didn't look up from her glass. She swirled the Cabernet, watching the legs form. "You're assuming logic requires truth-conditions. It doesn't. It requires consistency of commitment." She set the glass down. "When I accept the conditional, I'm not stating a fact. I'm adopting a higher-order attitude. I'm expressing my disapproval of holding the combination of attitudes: disapproving of cheating, yet approving of aiding it."

  She leaned forward, elbows on the table. "The validity isn't about truth preservation, Mark. It's about the impossibility of holding those attitudes simultaneously without practical contradiction. I'm not describing the world; I'm policing my own commitments."

  Mark smiled, a thin, tired expression. "But where does the 'impossibility' come from? If it's just psychological contingency, I can hold conflicting attitudes all day. I'm inconsistent, not invalid."

  "It's normative consistency," she corrected. "The logic of planning."

  "Exactly." He pointed his fork at her. "You've smuggled in normativity to save the logic. But if you need a robust notion of normative consistency to explain validity, you've basically reinvented truth-conditions under a different name. You've saved the phenomena of moral discourse, sure. But you've done it by making expressivism indistinguishable from realism."

  He leaned back, wiping his mouth. "You've solved the Frege-Geach problem by ceasing to be an expressivist. It's creeping minimalism, Elena. You want to have your anti-realist cake and eat its truth-apt structure too."

  Elena picked up her fork, a small smile playing on her lips. "Or maybe you're just terrified that normativity doesn't require your metaphysical baggage."

  "Pass the wine," he said.

  "Get it yourself," she replied, but she pushed the bottle toward him.
