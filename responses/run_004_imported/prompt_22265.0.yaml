prompt: |-
  I'm reading Hume's first Enquiry for a seminar on laws of nature and got stuck on a passage from Section 7, Part 2, right after the "conjoined but never connected" bit. He writes:

  "Similar objects are always conjoined with similar. Of this we have experience. Suitably to this experience, therefore, we may define a cause to be an object, followed by another, and where all the objects similar to the first are followed by objects similar to the second. Or in other words where, if the first object had not been, the second never had existed. The appearance of a cause always conveys the mind, by a customary transition, to the idea of the effect. Of this also we have experience. We may, therefore, suitably to this experience, form another definition of cause, and call it, an object followed by another, and whose appearance always conveys the thought to that other. [...] We say, for instance, that the vibration of this string is the cause of this particular sound. But what do we mean by that affirmation? We either mean that this vibration is followed by this sound, and that all similar vibrations have been followed by similar sounds: Or, that this vibration is followed by this sound, and that upon the appearance of one the mind anticipates the senses, and forms immediately an idea of the other. We may consider the relation of cause and effect in either of these two lights; but beyond these, we have no idea of it."

  Two things I cant untangle here. First, he introduces the counterfactual line ("if the first object had not been...") as if it's just restating the constant-conjunction definition "in other words" - like the two are obviously the same claim - but regularity and counterfactual dependence aren't the same thing, so is that a real fudge on his part, or is there some reading where they actually do collapse together? Second, and this is the part that actually matters for what I'm trying to figure out: contemporary Humeans about laws (best-system-analysis types) seem to only ever inherit that first, "objective" definition and quietly drop the second, mind-dependant one about custom and anticipation. Is that a principled thing to do, or does dropping definition two mean Hume's own actual view is more psychologistic/projectivist than what goes by "Humeanism" today?
