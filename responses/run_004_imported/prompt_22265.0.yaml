      *   **Question 2:** Contemporary Humeans about laws (Best System Analysis, Lewis, etc.) focus on the first definition (regularity/objective) and ignore the second (psychological/custom). Is this principled, or does it misrepresent Hume as more projectivist/psychologistic than modern "Humeanism"?

