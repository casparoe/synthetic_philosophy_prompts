answer: |-
  These are two of the sharpest questions one can ask about this passage. You have put your finger on the exact tension that divides "Hume scholars" from "Humean metaphysicians."

  Here is a breakdown of the two problems, starting with the logical fudge and moving to the metaphysical appropriation.

  ### 1. The Regularity/Counterfactual "Fudge"

  You are absolutely right that in modern modal logic, universal regularity ($\forall x (Fx \rightarrow Gx)$) does not entail counterfactual dependence ($\neg Fx \square\rightarrow \neg Gx$). An accidental generalization (e.g., "all gold spheres are less than 1 mile wide") can be true without supporting the counterfactual ("if this were a gold sphere, it would be less than 1 mile wide").

  So, is Hume fudging it? **Yes, but not carelessly.** He is fudging it *principledly*, based on his epistemological constraints.

  **The Epistemological Collapse**
  Hume is not making a claim about metaphysics here; he is making a claim about *content*. His argument is that we have no impression of "necessary connection" in the objects themselves. We only have two impressions:
  1.  Priority and contiguity (Object A comes before Object B).
  2.  Constant Conjunction (Every time we see A, we see B).

  When Hume writes "in other words," he does not mean these are logically equivalent in a God's-eye view of possible worlds. He means they are **psychologically equivalent for the human observer.**

  Because we never experience the "absence" of a cause in a vacuum (we only experience the sequence), the statement "if the first object had not been..." is not a robust modal claim about alternative possibilities. It is a rhetorical expression of the **strength of the habit.** When the habit is perfect (constant conjunction), the mind feels that the effect *could not* exist without the cause.

  **The Projectivist Reading**
  Many commentators (like Simon Blackburn or Huw Price) argue that the counterfactual line is actually a clue to Hume's projectivism. The counterfactual isn't a truth condition out in the world; it is an expression of the mind's refusal to separate the ideas.
  *   **Regularity:** What happens in the world (as far as we can tell).
  *   **Counterfactual:** How the mind *feels* about that regularity (the feeling of necessity).

  So, when he says "in other words," he is signaling that the *meaning* of the counterfactual is exhausted by the regularity plus the psychological compulsion. He isn't claiming regularity *grounds* counterfactuals; he is claiming that what we *mean* by counterfactuals is just regularity felt deeply.

  **Verdict:** It is a logical slip by modern standards, but within Hume's system, it is consistent. He is defining the *content of our idea* of cause, not the metaphysical structure of the universe. Since our idea is derived entirely from experience, and experience only gives us regularity, the counterfactual must collapse into regularity + psychological expectation.

  ***

  ### 2. Modern Humeanism vs. Hume's Second Definition

  This is the crux of the seminar debate. You are correct that contemporary "Humeans" (David Lewis, David Armstrong's critics, Best System Analysis proponents) almost exclusively adopt Definition 1 (Regularity) and treat Definition 2 (Psychological Custom) as a historical artifact to be discarded.

  **Is this principled?**
  It is principled *if* your goal is **metaphysics** rather than **epistemology**.
  *   **Hume's Goal:** To explain the origin of human belief. He wants to know: "Why do we *think* there is causation?" His answer requires Definition 2. Causation is a feeling of determination in the mind projected onto the world.
  *   **Lewis's Goal:** To provide truth conditions for laws of nature. He wants to know: "What *makes* it true that there is a law?" His answer requires Definition 1 (the Humean Mosaic). He wants laws to be objective features of the world (even if reducible), not dependent on human psychology.

  If Lewis kept Definition 2, laws would depend on human psychology. If humans didn't exist to form customs, there would be no causation. Lewis wants to avoid that. He wants a world of laws that exists independently of observers. So, dropping Definition 2 is necessary for the **Neo-Humean metaphysical project.**

  **Does this betray Hume?**
  Many scholars argue **yes**. This is often called the difference between **Hume's View** and **Humeanism**.

  1.  **The Loss of Necessity:** Hume's Definition 2 is where the "necessity" of causation lives. Hume argues that there is no necessity in the objects (Def 1), so the necessity we talk about *must* be the determination of the mind (Def 2). By dropping Def 2, Modern Humeans are left with a "thin" regularity that struggles to explain why laws support counterfactuals or explain instances. They try to recover this via the "Best System" (laws are the axioms that best summarize the mosaic), but Hume would likely say this is just a more complex version of Def 1, still lacking the "glue" that Def 2 provided.
  2.  **Projectivism:** Hume is widely read as a proto-projectivist. He thinks we "spread our mind onto the world." We feel a push, and we say the billiard ball has a "force." Modern Humeans are typically **reductionist realists**. They think the regularities *are* the laws. They deny the projection.
  3.  **Galen Strawson's Critique:** In *The Secret Connexion*, Strawson argues fiercely that Modern Humeans betray Hume. He argues Hume was a *realist* about causal powers but a *skeptic* about our knowledge of them. (This is a minority view, but it highlights the tension). More standardly, critics argue that by dropping the psychological component, Modern Humeans turn Hume's *skepticism* (we can't know necessary connection) into a *dogmatic metaphysics* (there is no necessary connection, only regularity). Hume suspended judgment on what causation *is* in itself; Lewis asserts it *is* regularity.

  **The "Two Definitions" Problem**
  There is a longstanding debate about whether Hume intended two definitions or one.
  *   **The Compatibilist View:** The two definitions describe the same relation from two angles (objective vs. subjective). You need both to have the full concept of cause.
  *   **The Revisionist View:** Hume realized Def 1 was insufficient (because it lacks necessity), so Def 2 is the *real* definition, and Def 1 is just the trigger.

  Modern Humeans take the **Compatibilist View** but then amputate the subjective half. They say: "The objective regularity is the ontological ground; the psychological custom is just how we detect it."
  Hume would likely reply: "No, the psychological custom is *constitutive* of the idea. Without the mind's transition, 'cause' is just 'before and after'."

  ### Summary for your Seminar

  1.  **On the Counterfactual:** Hume isn't doing modal logic; he's doing genetic psychology. The counterfactual is "in other words" because, for a human mind limited to experience, universal regularity *feels* like counterfactual necessity. It is a statement about the *content of our idea*, not the structure of reality.
  2.  **On Modern Humeanism:** Dropping Definition 2 is a principled move for **metaphysicians** who want observer-independent laws, but it is a **betrayal of Hume's epistemology**. Hume's view is that causation is essentially relational between the world and the mind. Modern Humeanism (Lewis/BSA) turns it into a relation solely within the world (the Mosaic).
      *   **Key distinction to raise:** Hume is a **Projectivist** about causal necessity (it's in us); Modern Humeans are **Reductionists** (it's just the pattern).
      *   **The Cost:** By dropping Def 2, Modern Humeans gain objectivity but lose the explanation of why laws *govern* rather than just *describe*. Hume admits laws don't govern (that's superstition), but he explains why we *think* they do. Modern Humeans often want to have it both ways: laws are just summaries, but they still explain things.

  If you want a killer line for the seminar: **"Modern Humeans take Hume's ontology (no necessary connections) but reject his phenomenology (causation is a feeling of determination). In doing so, they turn Hume's skepticism into a dogmatic metaphysics."**
