answer: |-
  **MEMORANDUM**

  **TO:** Heritage and Naming Review Panel
  **FROM:** [Your Name], Panel Member
  **DATE:** 1 October 2023
  **SUBJECT:** Recommendation regarding the Adam Smith Lecture Theatre

  **Purpose**

  At our meeting in two weeks, we must decide whether to retain, contextualise, or remove the name of Adam Smith from the university's main lecture theatre. This memo outlines my recommendation. It is based on a close reading of the primary text cited by both proponents of renaming and defenders of the status quo: Book IV, Chapter VII ("Of Colonies") of *The Wealth of Nations* (1776).

  My objective is to move us beyond a binary choice between "cancelling" a thinker and "whitewashing" his legacy. We must grapple with the specific economic and moral arguments Smith made, how they were ignored by his contemporaries, and how his name was subsequently weaponised by forces he explicitly criticised.

  **Engagement with the Text**

  Both the student petition and the economic faculty rebuttal rely on selective quotations from *Wealth of Nations*, IV.VII. To decide responsibly, we must acknowledge the full thrust of Smith's argument in that chapter.

  1.  **On the Viability of Empire:** The petition correctly notes Smith's view that the British Empire was "not an empire, but the project of an empire." However, Smith's objection was not primarily moral, but actuarial. He argued that the monopoly of colonial trade artificially diverted British capital from nearer, more productive European markets to distant, risky colonial ventures. He viewed the empire as a drain on the metropolitan poor, who paid higher prices for goods to subsidise the merchants' monopoly.
  2.  **On Colonial Violence:** The economists correctly cite Smith's condemnation of the "savage injustice of the Europeans." Smith did not mince words regarding the massacres in the Americas and the East Indies. However, to frame him as a modern anti-colonialist is anachronistic. Smith believed that "civilised" nations (settled agriculturalists) inevitably dominated "barbarous" ones (hunters and gatherers). His critique was that Britain was governing *badly*, not necessarily that it had no right to govern.
  3.  **On Political Solution:** Crucially, Smith proposed a solution that neither camp highlights. He suggested a union with the colonies that included taxation *and* representation—a colonial parliament integrated with Westminster. He knew this was politically impossible ("the dream of a dreamer"), but it demonstrates that his theoretical framework sought integration and consent, not subjugation.

  **The Strongest Case for Renaming**

  If I recommend against renaming, I must acknowledge that the argument for doing so is robust and morally serious. It should not be dismissed as mere iconoclasm.

  The strongest case for renaming rests on **legacy over intent**. Regardless of Smith's specific critiques of mercantilist monopoly, his name has become the global shorthand for laissez-faire capitalism and the ideological justification for British imperial expansion in the 19th century. The "Adam Smith" brand was used by later apologists to rationalise the very exploitation he warned against. For students from post-colonial contexts, this lecture theatre does not signal "nuanced economic critique"; it signals the institutional endorsement of the system that extracted their ancestors' labour. To retain the name, even with context, may be viewed as prioritising the comfort of the Economics faculty over the sense of belonging for minority students. If the university's goal is decolonisation in practice rather than in theory, removing the symbol is the only coherent step.

  **Recommendation: Retain with Permanent Contextualisation**

  I recommend we **retain the name alongside a permanent contextualising plaque.**

  Removing the name erases the historical reality that Smith was a critic of the imperial machinery, not merely its architect. It suggests that history offers only villains and heroes, rather than complex figures whose ideas are often hijacked. However, retaining the name *without* context validates the economists' sanitized version of Smith, which is intellectually dishonest.

  A plaque allows us to hold two truths simultaneously: that Smith provided tools later used to justify empire, and that he explicitly warned against the costs and cruelties of that empire. This turns the theatre entrance into a pedagogical space, fitting for a university. It forces every student entering to confront the gap between theory, practice, and legacy.

  **Concrete Next Step and Timeline**

  I propose the panel commission a working group (comprising one historian, one economist, and one student representative) to draft the final text of the plaque. The text must not be hagiographic. It should explicitly mention:
  *   Smith's critique of the colonial trade monopoly.
  *   His condemnation of European violence in the Americas and East Indies.
  *   The subsequent appropriation of his work to justify imperial policy.

  **Deadline:** The working group should submit the final wording to the Panel by **20 October 2023**.

  **Proposed Draft Wording for Consideration:**

  > *This theatre is named for Adam Smith (1723–1790), whose work founded modern economics. While Smith is often associated with the rise of global capitalism and empire, he was also a sharp critic of British colonial policy. In The Wealth of Nations (1776), he described the British Empire as a costly "project of a gold mine" that burdened the British public and inflicted "savage injustice" upon indigenous peoples. He argued that the monopoly of colonial trade benefited merchants at the expense of the poor. Despite his warnings, his theories were later used to justify the imperial expansion he scrutinised. This plaque acknowledges the complexity of his legacy and the university's commitment to examining history without simplification.*

  I look forward to discussing this proposal at our meeting on 15 October.

  [Your Name]
  Member, Heritage and Naming Review Panel
