answer: |-
  This is a sophisticated philosophical dispute that cuts to the heart of whether utilitarianism is a standalone moral engine or a framework that requires external liberal intuitions to function safely. Your intuition is shared by many critics of utilitarianism (from Hegel to Rawls to modern communitarians): that the "calculus" cannot generate liberal rights unless it is already rigged to produce them.

  Here is the strongest version of your argument, constructed to maximize the pressure on the internal consistency of Bentham's hedonistic premises.

  ***

  ### The Argument: The Illegitimacy of Excluding "Antipathy" in the Felicific Calculus

  **1. The Premise of Commensurability**
  The foundational claim of hedonistic utilitarianism is that pleasure and pain are the sovereign masters of mankind and that they are *commensurable*. Bentham insists that "push-pin is as good as poetry" if the quantity of pleasure is equal. Crucially, the calculus is supposed to be impartial: "Everybody to count for one, nobody for more than one." This implies a descriptive neutrality regarding the *source* of the pain. Whether pain arises from a broken leg, a broken heart, or a offended religious sensibility, it is still *pain*. If the utilitarian metric is "maximize net pleasure," the origin of the discomfort is irrelevant; only its intensity, duration, and extent matter.

  **2. The Empirical Reality of Moral Disgust**
  In the context of 18th or 19th-century sexual morality, the "pain" felt by the public upon learning of sodomy was not metaphorical. It was a visceral, psychological distress rooted in religious fear (fear of divine wrath upon the nation), social anxiety (fear of normative collapse), and genuine revulsion. In a highly religious, homogeneous society, the *extent* of this pain is vast (the majority), and the *intensity* can be profound (fear of hell or social ruin). By contrast, the pleasure derived by the consenting adults is limited in *extent* (the minority) and, under the conditions of secrecy and stigma required by the era, likely compromised in *security* (fear of discovery).

  **3. The Mathematical Necessity of Suppression**
  If one runs the felicific calculus strictly according to its stated premises—counting all felt pains equally—the suppression of "irregular" sexual acts appears to be the utility-maximizing choice in a conservative society.
  *   **Option A (Toleration):** High pleasure for a few; intense psychic pain, fear, and outrage for the many.
  *   **Option B (Criminalization):** Loss of pleasure for the few (and the pain of punishment); relief and security for the many.
  Unless the pain of punishment is weighed infinitely heavier than the pain of disgust (which violates the impartiality premise), the aggregate utility favors Option B. Therefore, a "honest" calculus vindicates the moral majority, not the sexual minority.

  **4. Bentham's Exclusionary Maneuver**
  Bentham avoids this illiberal conclusion by classifying the public's disgust as "antipathy" and declaring it an illegitimate ground for legislation. He argues that antipathy is a "principle of action" rival to utility, not an input *into* utility. He effectively rules that pain caused by the *knowledge* of a voluntary act between others is not a "mischief" that the law should remedy.

  **5. The Charge of Question-Begging**
  This is where the argument collapses into circularity. Bentham provides no *hedonistic* justification for why the pain of disgust should be discounted.
  *   If pain is pain, it must count.
  *   To say "this pain doesn't count because it is based on prejudice" is to introduce a criterion *external* to the calculus.
  *   To say "this pain doesn't count because the act is self-regarding" is to smuggle in a deontological right to privacy (a "harm principle") that the utilitarian framework does not inherently possess.
  *   To say "this pain doesn't count because the beliefs causing it are false" (e.g., God won't actually strike us down) is to shift utilitarianism from a theory of *welfare* to a theory of *rational truth*. But people suffer from false beliefs nonetheless. A utilitarianism that ignores suffering because it is "irrational" ceases to be a welfare maximand and becomes a tool for social engineering based on the philosopher's own epistemic preferences.

  **6. The Conclusion: Liberalism as an Import, Not an Export**
  Therefore, Bentham's liberal conclusion regarding sexual morality is not a *derivation* from the principle of utility. It is an *importation*. Bentham was a liberal individual who happened to be a utilitarian. When the calculus threatened to produce illiberal results (tyranny of the majority), he manually adjusted the inputs to match his pre-existing liberal intuitions.
  The "felicific calculus" lacks the internal resources to distinguish between "legitimate" pain (physical harm) and "illegitimate" pain (moral outrage) without relying on a prior, non-utilitarian theory of rights. Consequently, your friend is wrong: this is not a vindication of hedonistic utilitarianism. It is a vindication of Bentham's personal liberalism, achieved by suspending the strict rules of his own hedonistic system.

  ***

  ### Where the Argument Breaks Down

  Having pushed your case to its limit, here is where a sophisticated defender of Bentham (or a nuanced reading of the manuscripts) would attack your position. There are three specific pressure points where your argument might be vulnerable.

  **1. The "False Belief" Defense (Epistemic Utilitarianism)**
  Bentham does not merely say antipathy is "prejudice"; he often argues that the pain of antipathy is based on *empirical errors* about the consequences of the act. If the public believes sodomy causes earthquakes or divine wrath, they are suffering from a pain based on a false causal model.
  *   *The Counter:* A sophisticated utilitarianism can argue that we should maximize *enlightened* utility, not *actual* utility based on ignorance. If the pain is predicated on a falsehood, the utilitarian legislator's job is to correct the belief, not cater to the pain. If the pain persists after education, *then* it might count—but Bentham argues it wouldn't persist if people understood the act was truly harmless.
  *   *The Weakness:* This risks paternalism. Who decides which beliefs are "false"? But it does offer an internal utilitarian justification for discounting certain pains without invoking rights.

  **2. The Secondary Mischief of Enforcement**
  Your argument assumes the cost of criminalization is limited to the loss of pleasure for the actors and the pain of punishment. Bentham would argue the *cost of enforcement* creates more pain than the disgust it cures.
  *   *The Counter:* To police private sexual acts, the state must create a surveillance apparatus, encourage spying among neighbors, and empower blackmailers. This creates a society of universal insecurity (a massive negative utility). The "pain of antipathy" is static, but the "pain of insecurity" caused by invasive laws is dynamic and expansive.
  *   *The Weakness:* This is a contingent empirical claim. In a low-surveillance society where enforcement is sporadic but brutal, the "insecurity" cost might be lower than the "disgust" benefit. However, it shows Bentham doesn't necessarily have to exclude the pain of disgust; he just has to outweigh it with the systemic costs of suppression.

  **3. The Definition of "Interest"**
  Bentham sometimes defines "interest" not as "what I feel I want" but "what is actually conducive to my well-being."
  *   *The Counter:* If utility is about well-being, then a "pain" that arises from a malicious or irrational sentiment might be categorized as a defect in the sufferer, akin to a disease. We do not maximize the utility of a virus; similarly, we might not maximize the utility of a prejudice.
  *   *The Weakness:* This moves dangerously close to perfectionism or ideal utilitarianism (G.E. Moore), abandoning Bentham's strict psychological hedonism. However, it suggests Bentham might have a richer theory of "pleasure" than the crude calculus suggests—one where the *quality* of the pleasure/pain source matters.

  ### Summary for Your Debate
  Your strongest move is to insist on **descriptive neutrality**. If utilitarianism is a moral *algorithm*, it cannot reject inputs based on their moral quality without ceasing to be an algorithm and becoming a rationalization. If Bentham excludes the pain of disgust, he is admitting that *some pains are morally irrelevant*, which is a deontological claim, not a utilitarian one.

  However, be prepared for your friend to pivot to the **long-term institutional costs**. If they argue that catering to disgust destroys the security necessary for *all* pleasure in the long run, they can remain within utilitarian bounds. Your rebuttal must then be: "That is an empirical gamble, not a principled guarantee. In a society stable enough to absorb the shock, the calculus *would* demand suppression. Bentham knows this, which is why he quietly rules out the disgust *a priori*."
