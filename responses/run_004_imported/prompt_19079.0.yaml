      *   *Focus on Rationality:* Humans aren't perfect Bayesians.
      *   *Scientific Context:* Disagreement is actually *good* in science (division of cognitive labor). If we converged too fast, we might lock into wrong ideas.
      *   *Conclusion:* You aren't missing anything about the math, but the application to human science is limited. It's a benchmark, not a description.

