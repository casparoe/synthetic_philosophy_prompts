prompt: |-
  Spent 35 years as a research geologist before retiring, and lately I've been reading a lot of decision theory and epistemology just to keep my brain busy. Ran into Aumann's agreement theorem last week and it kind of blew my mind — if I'm getting it right, it proves that two rational people looking at the same evidence literally cannot keep disagreeing once they know each others opinions, their views have to converge. That seems like a huge deal. So doesn't that mean that whenever two equally smart, equally honest scientists look at the same dataset and still reach opposite conclusions, at least one of them (maybe both) must be fooling themselves somehow? Feels like this should come up way more in discussions of scientific controversy but I never see it mentioned, wonder if im missing something.
