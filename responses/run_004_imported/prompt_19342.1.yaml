      *   *Pasadena:* Payoff $(-1)^{n-1} \cdot 2^n / n$ (or similar variants) with probability $1/2^n$. Actually, the standard Nover & Hájek formulation is usually payoff $= (-1)^{n-1} \cdot 2^n / n$ with prob $1/2^n$? Wait, let me verify the standard payoff structure.
      *   *Correction/Verification:* The standard Pasadena Game payoff is usually defined as $X_n = (-1)^{n-1} \frac{2^n}{n}$ with probability $p_n = \frac{1}{2^n}$.
      *   Expected Value calculation: $E = \sum_{n=1}^{\infty} p_n X_n = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n}$.
      *   This is the alternating harmonic series: $1 - 1/2 + 1/3 - 1/4 \dots = \ln(2)$.
      *   *Wait, hold on.* If the sum is $\ln(2)$, why is it a paradox?
