      *   *The Problem:* In standard measure theory/probability, the expectation is defined via the Lebesgue integral. For the Lebesgue integral to exist, the integral of the absolute value must be finite (absolute convergence). If $\sum |p_n u(x_n)| = \infty$, the expectation is *undefined*, not just conditionally convergent to a specific value.
      *   *Riemann Rearrangement:* Since the series is conditionally convergent, you can reorder the terms (outcomes) to sum to any real number, $+\infty$, or $-\infty$. Since the order of outcomes shouldn't matter to the value of a gamble (it's a set of probability-outcome pairs, not a sequence), the fact that the value depends on ordering is fatal.

