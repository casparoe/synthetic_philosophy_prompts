  Hobbes replies, "Precisely. I constructed it."

  Wallis says, "But the demonstration proves it's impossible."

  Hobbes waves him off, "In Natural Philosophy, we obey the laws of the world. In Geometry, the Geometer makes the laws."

  Wallis presses, "So if the Geometer's law contradicts logic?"

  Hobbes smiles, "Then the logic is in rebellion. And I do not concede to rebels."
