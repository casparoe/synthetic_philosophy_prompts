  ok this is a weirdly specific one but ive had it stuck in my head since i went down a rabbit hole on the hobbes vs wallis feud. hobbes spent something like two decades insisting he'd squared the circle, got mathematically demolished in print over and over (wallis's elenchus, hobbes's own six lessons, wallis's due correction, etc), and never once conceded even as it became a running joke among actual mathematicians of the time. what makes it extra good is that it's not unrelated to his broader philosophy -- geometry was suppose to be the one science we could be totally certain of, precisely because we construct the figures ourselves instead of just observing nature like in physics. so the guy whose whole epistemology rested on "geometry = certainty because we make it ourselves" turned out to be the one person who couldn't be argued out of a geometric howler -- basically a 17th century case study in what LW folks would call motivated stopping.

