      *   **Marcus's Pivot (The SR Alternative):** So we collapse the distinction. One state, two contents. World-directed and Self-directed. No gap for error to slip in like that.
      *   **Elena's Attack on SR:** The "Subject/Object" problem. If I am aware of my pain, there seems to be an 'I' and a 'pain'. If they are the same state, don't you lose the awareness *of* something? You just have a pain that knows it's a pain. How does that differ from an unconscious pain?
