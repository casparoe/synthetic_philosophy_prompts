      *   *The Riverbed:* Describe the sensation of the room changing. Not spooky, just ontological instability.
      *   *Conclusion:* Aris stops trying to prove. He just sits. The action *is* the ground.

  8.  **Refining the Voice:**
      *   Needs to be precise, slightly clinical but introspective.
      *   Avoid diagnosing too heavily; focus on the *structure* of the belief.
