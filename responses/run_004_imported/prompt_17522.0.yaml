  2.  **Deconstruct the Philosophy & Pathology:**
      *   *Wittgenstein:* Certainty isn't knowledge. It's a scaffold. "I have two hands" isn't something I verify; it's what allows me to verify other things. If this shifts, language games collapse.
      *   *Cotard's:* The patient doesn't just think "I am sick." They think "I do not exist." This isn't a factual error in the usual sense; it's a collapse of the framework where "existence" makes sense.
      *   *The Collision:* The story needs to show the *experience* of the riverbed shifting. Not just "I think I'm dead," but "The ground where 'thinking' happens is gone."

  3.  **Choose a Perspective:**
