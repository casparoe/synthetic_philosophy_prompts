answer: |-
  The chart said *Cotard's Delusion*, but charts are for water, not riverbeds. I sat across from Mr. Vance in the quiet room of the ward. The light was flat, institutional, the kind that eliminates shadows and, consequently, depth. Vance was thin, his skin papery, but his vitals were stable. His heart beat. His lungs expanded. These were my hinges. They stood fast for me. When I checked his pulse, I wasn't gathering evidence to prove he was alive; I was enacting a ritual that confirmed the world was still turning on its usual axis.

  "You feel nothing," I said. It wasn't a question.

  "I feel the absence of feeling," Vance corrected. His voice was level, devoid of the anxiety that usually accompanies psychosis. "It isn't numbness, Doctor. Numbness implies a body that has lost sensation. I am describing a body that has lost location."

  I picked up my pen. I wanted to write *delusional ideation, somatic type*, but the pen hovered. Wittgenstein says that if I try to doubt everything, I would not get as far as doubting. Doubting requires a ground. To doubt you are alive, you must already exist to do the doubting. That was my ground. I assumed it was his, too.

  "Your heart is beating," I said. I reached out and placed my fingers on his wrist. The rhythm was steady against my fingertips. *Thump. Thump. Thump.* "Can you feel that?"

  "You feel it," Vance said. He looked at my hand, not with confusion, but with a kind of pity. "That is your sensation. It confirms your certainty. It does not confirm mine."

  "It's objective data," I insisted. I heard the fragility in my own voice. I was trying to offer a proposition as a foundation, but propositions only work if we agree on the logic game we're playing. I was playing *Medicine*. He was playing something else.

  "Data requires a receiver," Vance said. "A dead man does not receive data. If you show a corpse a thermometer, the mercury may rise, but the corpse does not know it is warm. I am the thermometer, Doctor. I am the object being measured. I am not the measurer."

  I pulled my hand back. The silence stretched. This was the moment where the training usually kicks in. *Challenge the delusion. Reality-test.* But how do you reality-test when the definition of reality is the variable that has shifted? I was trying to move the water, but the bed had moved underneath it.

  "If you are dead," I said, choosing his terms, "how are you speaking to me?"

  "Echoes," he said. "Sound waves persist after the source is gone. You are hearing the reverberation."

  "And the food? You haven't eaten in three days."

  "Dead things do not rot from hunger. They are already rotted."

  I stopped writing. I realized I was accumulating reasons, stacking them like bricks, hoping to build a wall high enough to keep him inside the world of the living. But he wasn't trying to escape the world; he was standing on different ground. For me, *I am alive* is not something I know. It is something I show. I eat, I sleep, I bleed. It is an animal certainty. For Vance, that animal certainty had severed. The hinge had rusted through.

  "It's not that you're wrong, Mr. Vance," I said, putting the pen down. "It's that you've stopped playing the game where 'wrong' is possible."

  He looked at me then, really looked at me, for the first time. "The game requires pieces," he said. "I have no pieces."

  I thought about the riverbed. Wittgenstein writes that the bed moves, but slowly, so slowly we mistake it for permanence. But what if, for some, the shift is sudden? A tectonic slip. The water of our conversation was still flowing—syntax, grammar, logic—but it was running over a substrate that could no longer support the weight of *existence*.

  I stood up and walked to the sink. I filled a paper cup with water. I walked back and held it out to him.

  "Drink," I said.

  "I told you. I cannot."

  "This isn't about belief. It's about action." I kept holding the cup. "If you are dead, the water will spill. If you are alive, you will swallow. I am not asking you to convince me. I am asking you to move your hand."

  This was the end of the grounds. I could no longer offer propositions. I could only offer an action. Wittgenstein says that giving grounds must come to an end somewhere—but the end is not an ungrounded presupposition; it is an ungrounded way of acting. I was trying to bring him back not to a truth, but to a practice.

  Vance looked at the cup. The water trembled slightly, reacting to the micro-shakes of my hand. My uncertainty.

  "If I take it," Vance said, "you will say I am alive."

  "If you take it," I said, "you will have acted."

  "And if I don't?"

  "Then you will have acted differently."

  He didn't take the cup. But he didn't knock it away either. He stared at the water. For a moment, the room felt unstable. Not spooky, not haunted, just ontologically thin. I realized that my certainty of my own existence was just as unproven as his certainty of his non-existence. I walked around because I couldn't imagine not walking. He sat still because he couldn't imagine moving. We were both riding hinges. Mine were just greased by habit; his were seized by trauma.

  "I can't," he whispered. "The hand... it belongs to the thing that died. I am just the witness."

  "Then let the thing drink," I said. "Let the corpse hydrate."

  It was a concession. I was accepting his hinge to save his body. I was bending the riverbed toward him, hoping the water would follow.

  Vance slowly raised his hand. His fingers were trembling. He took the cup. He brought it to his lips. He didn't swallow immediately. He held the water in his mouth, testing the temperature, the texture, the weight of it. The evidence of the senses crashing against the certainty of the delusion.

  He swallowed.

  "Did I live?" he asked, his voice thick.

  "You acted," I said. I took the cup back. "That's all we have."

  I sat back down. I didn't write anything in the chart. The words *alive* and *dead* seemed too heavy, too laden with metaphysical baggage they couldn't carry. There was only the pulse, the water, the breathing. The hinges held for me. For him, they groaned. But the water flowed over them regardless.

  "Tomorrow," I said. "We do this again."

  "Tomorrow," Vance said.

  He didn't agree that he would be here. He didn't agree that tomorrow would come. He just said the word. It was a sound. A move in a game we were both learning to play from scratch. I stood up to leave, and as I opened the door, I checked my own pocket for my keys. A reflex. A hinge. I touched the metal, cold and solid. It was enough. For now, the bed was holding.
