      *   *Relative:* Emotional weight, but might drift into sentimentality.
      *   *Decision:* A doctor/narrator seems best to capture the *failure of reasoning*. They can try to play the language game of "proof" and show how it hits the bedrock and finds sand. Let's make the narrator a psychiatrist or neurologist trying to engage.

  4.  **Drafting - Scene Setting:**
      *   Setting: A clinical room. Sterile.
      *   Characters: Dr. Aris (narrator), Patient (Elias).
      *   Conflict: Aris tries to reason; Elias exposes the hollowness of the reasoning because his hinges have moved.

  5.  **Drafting - Integrating Wittgenstein:**
      *   *Hinge Propositions:* Elias shouldn't argue facts. He should treat "I am dead" as the certainty that makes other facts impossible.
      *   *Grounds coming to an end:* Aris offers evidence (pulse, warmth). Elias rejects the *validity* of the evidence, not the data.
      *   *Riverbed:* Use the imagery of shifting ground. The water (thoughts) is flowing, but the bed (certainty) is moving.
      *   *Action:* Wittgenstein says the end of grounds is action. Elias's actions should reflect his certainty (not eating, not moving), while Aris's actions (checking pulse) reveal *his* hinges.

  6.  **Developing the Narrative Arc:**
      *   Start with the examination. Routine checks.
      *   The conversation turns to the delusion.
      *   Aris tries to prove life.
      *   Elias points out that proof requires a shared ground which is missing.
