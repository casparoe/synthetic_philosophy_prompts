answer: |-
  **Setting:** *Office hours. Professor Halloway's office is cluttered with books on modal realism and process philosophy. Paul (Perdurantist) is leaning forward, pen in hand. Elena (Endurantist) is sitting back, nursing a cold coffee.*

  **Paul:** Look, I get the appeal of Endurantism. It matches common sense. I say, "I was sitting five minutes ago, and now I'm standing." The *I* is the same. Wholly present at both times. But you know Lewis's argument is the hammer that breaks that intuition. It's not just a puzzle; it's a contradiction.

  **Elena:** The Problem of Temporary Intrinsics. I know the drill. An object cannot have incompatible intrinsic properties. If I am bent at *t1* and straight at *t2*, and I am numerically identical across *t1* and *t2*, then I am both bent and straight. Contradiction.

  **Paul:** Exactly. Logic 101. You can't be *F* and *not-F*. So, how do you dodge it? Are you going to tell me properties are actually relations to times? Because Lewis eviscerated that. "Sitting" isn't a relation. It's a shape. If you say I have the property *sitting-at-t1*, you've turned an intrinsic shape into a relation to an abstract entity (a time). I don't relate to a time to have a shape. I just *have* the shape.

  **Elena:** I'm not going to make the naive relationist move. I agree that *sitting* is intrinsic. If you relativize the *property*, you lose the intrinsic nature. My move is to relativize the *instantiation*.

  **Paul:** Adverbialism?

  **Elena:** Precisely. It's not that I have the property *sitting-at-t1*. It's that I *at-t1 instantiate* sitting. The "at-t1" modifies the copula, the having, not the property itself. The property remains "sitting." It remains intrinsic. But the *way* I possess it is indexed.

  **Paul:** But what does that mean ontologically? You're positing a primitive, unanalyzable relation of "instantiation-at-a-time." You're basically saying, "It just is the case, brute factually, that you instantiate sitting at t1."

  **Elena:** I'd say it's no more brute than your temporal parts. Look, Paul, on your view, *I* don't change. That's the real cost you gloss over. If I'm a spacetime worm, the "me" at *t1* is a temporal part. The "me" at *t2* is a different temporal part. The *t1*-part is sitting. The *t2*-part is standing. But the worm itself? The whole four-dimensional object? It's always sitting-at-the-beginning and standing-at-the-end. It never *changes* properties. It just has variation along the temporal axis.

  **Paul:** That's a category mistake. Change isn't something the whole worm does. Change is defined by qualitative difference between temporal parts. To say "I change" is just to say "I have distinct temporal parts with distinct intrinsic properties." It's reductive, yes, but it preserves logic. You, on the other hand, are asking me to believe in a mode of instantiation that isn't a relation but acts like one. It's mystical.

  **Elena:** It's not mystical; it's the only way to save the *subject* of change. If I'm just a collection of stages, who is it that persists? You say the worm persists. But the worm is the sum of the parts. If I cut the worm in half, I have two objects. If I endure, I am the same substance undergoing alteration. Your view makes change a static distribution of properties across a manifold. My view makes it dynamic.

  **Paul:** Dynamic how? If you're an eternalist—and you say you are—then *t1* and *t2* both exist. If you wholly exist at *t1* and wholly exist at *t2*, you are multilocated. You're in two places in spacetime at once.

  **Elena:** I am multilocated in spacetime, yes. But I don't have parts at those locations. I am fully there.

  **Paul:** And that brings us back to the intrinsics. If you are fully at *t1* and fully at *t2*, and *t1* and *t2* are equally real, then you, the whole object, possess the property of sitting and the property of standing. Simultaneously, in the tenseless sense. You haven't solved the contradiction; you've just hidden the "at-t" modifier in the verb. Logic doesn't care about verbs. If *O* is *F* and *O* is *G*, and *F* excludes *G*, *O* is impossible.

  **Elena:** Logic cares about indexing. If I say "It is raining in London" and "It is not raining in London," that's a contradiction only if I mean the same time. If I index the truth, there's no contradiction. I'm treating times like locations. You don't think it's a contradiction for me to be sitting *here* and standing *there*. Why is *when* different from *where*?

  **Paul:** Because space and time aren't analogous in that way. I can be partly here and partly there. I have spatial parts. I don't have to be wholly present in two spatial locations. But you insist on being *wholly* present at two times. That forces the property conflict. If you had temporal parts, the bentness belongs to part *P1* and the straightness to part *P2*. No conflict. The whole worm isn't bent; a part of it is.

  **Elena:** And that's where your view creates a blind spot. Let's talk about the Rotating Discs Argument.

  **Paul:** *(Sighs)* Sider's favorite.

  **Elena:** Imagine two homogeneous discs. Same mass, same radius, same material. One is stationary. One is rotating. They exist for the same duration. On your view, both objects are sums of temporal slices. Since the discs are homogeneous, every temporal slice of the stationary disc is qualitatively identical to every temporal slice of the rotating disc.

  **Paul:** Not necessarily. The rotating disc has particles with different velocity vectors.

  **Elena:** But velocity is relational on your view. It's a matter of where the temporal parts are located relative to each other in the manifold. If you look at the intrinsic properties of the slices themselves—the matter distribution, the shape—they are identical. If persistence is just the summation of these slices, the worm for the stationary disc and the worm for the rotating disc are composed of the same qualitative parts arranged in the same order.

  **Paul:** They aren't arranged in the same order. The causal relations between the parts differ. The rotating disc's parts are causally connected in a way that generates centrifugal force.

  **Elena:** But that's begging the question. You're smuggling in dynamic properties that your ontology can't ground. If the object is just a stack of slices, and the slices are intrinsically identical, where does the rotation live? It has to be a primitive fact about the *arrangement* of the parts. But if the parts are wholly qualitative matches, what grounds the difference?

  **Paul:** The difference is in the spacetime relations. The world-tube of the rotating disc is twisted in the manifold differently than the stationary one. It's not about the intrinsic properties of the slices; it's about the metric properties of the spacetime region they occupy.

  **Elena:** So you're admitting that the object's intrinsic nature—whether it's spinning or not—supervenes on something external to the temporal parts?

  **Paul:** It supervenes on the spacetime structure. Look, Elena, every theory has costs. My cost is that I have to analyze rotation relationally. Your cost is that you have to accept that a single object can be both bent and straight without contradiction, which violates the Indiscernibility of Identicals. Leibniz's Law says if *x* is identical to *y*, they share all properties. If Past-Me is bent and Present-Me is straight, and Past-Me = Present-Me, then one thing is bent and straight.

  **Elena:** Leibniz's Law holds for timeless predication. I deny that "is bent" is a complete predicate. The complete predicate is "is bent at *t*." Once you index the predicates, Identity holds. I'm not violating Leibniz; I'm refining the language of instantiation.

  **Paul:** You're refining it into obscurity. Let's press the adverbial move. If "instantiating-at-t" is a primitive, can I instantiate properties at *t* without existing at *t*?

  **Elena:** No.

  **Paul:** So instantiation-at-t requires existence-at-t. And you say you exist wholly at *t*. So you are wholly bent at *t1* and wholly straight at *t2*. If *t1* and *t2* are real, then in the grand scheme of reality, you are bent and straight. You've just pushed the contradiction from the object to the timeline.

  **Elena:** No, because the timeline isn't a "view from nowhere." There is no God's-eye view where I am both bent and straight simultaneously. There is only the fact at *t1* and the fact at *t2*.

  **Paul:** But if Eternalism is true, *t1* and *t2* are equally real. So the facts are equally real. So the incompatible facts coexist.

  **Elena:** They coexist in the block, yes, but they don't coinhere in the subject *in the same respect*. That's the key. The "respect" is the temporal mode of instantiation. You think the only way to avoid coinherence is to split the subject into parts. I think that destroys the subject. If I'm a worm, I don't feel pain. My current temporal part feels pain. *I* am the thing that suffers. If I'm just a worm, suffering is localized to a slice.

  **Paul:** And I say *you* are the worm. The slice is just a phase of you. When you say "I suffer," you mean "The temporal part of me located at the present is suffering." It's indexical. Just like "here." When I say "It's hot here," I don't mean the whole universe is hot. I mean the location of utterance is hot. When you say "I'm bent," you mean the temporal location of utterance is bent.

  **Elena:** That reduces the self to a series of experiences. It makes persistence a fiction of memory.

  **Paul:** It makes persistence a matter of causal continuity between parts. It's robust. It handles fission cases better than you. If you split in two, the Endurantist says I'm identical to A and identical to B, so A=B. But A isn't B. Contradiction. The Perdurantist says the original worm branches. I'm not identical to either; I'm the pre-branch worm. Or I'm the branch that includes this stage. No contradiction.

  **Elena:** Fission is a hard case, I grant you. But Temporary Intrinsics is your hard case. You solve it by denying that objects *really* change. You trade the mystery of instantiation for the elimination of change. I'd rather keep change and refine instantiation.

  **Paul:** And I'd rather keep logic and refine our concept of objects.

  **Elena:** *(Smiles)* So we're at an impasse. You think my "adverbial instantiation" is magic.

  **Paul:** And you think my "temporal parts" are a category error.

  **Elena:** Basically. But admit this: The Rotating Disc shows that your temporal parts aren't enough to ground all physical facts. You need extra structure.

  **Paul:** I admit we need spacetime structure. But you need primitive instantiation modifiers. We're both paying an ontological tax. The question is which bill you'd rather pay.

  **Elena:** I'll pay for the subject of change. Without it, metaphysics is just geometry.

  **Paul:** And without logic, it's just poetry.

  **Elena:** *(Stands up)* Same time next week?

  **Paul:** *(Packs his bag)* Definitely. We haven't even touched on vagueness yet.

  **Elena:** Don't remind me.
