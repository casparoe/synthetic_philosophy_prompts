answer: |-
  An elderly Athenian staggers up to the Sober Symposiarch at the end of a regulated drinking party, clutching his krater.

  "I must confess," he slurs, "I fear I have lost my *sophrosyne*. The wine has mastered me."

  The Symposiarch checks his clipboard and stamps the man's tablet **APPROVED**.

  "But I am intoxicated!" the old man protests.

  "Precisely," says the Symposiarch. "For the young men tonight, wine was a diagnostic test to see if their reason could resist pleasure. For you, it was a therapeutic solvent to see if your shame could resist the chorus."

  "So my drunkenness is... virtuous?"

  "No, your drunkenness is *necessary*. You didn't drink to lose control; you drank to lose your dignity. It was getting in the way of the harmony. Now get back on the dance floor—you're finally sober enough to sing."
