answer: |-
  **SCENE:** *The conference room. The air is stale with coffee and old paper. The clerk has been dismissed for ten minutes, waiting outside the door for the final instruction on the opinion. Judge Vance (Premise) stands by the whiteboard, marker in hand. Judge Cross (Verdict) sits, leaning back, arms folded.*

  **VANCE:** We have the findings, Cross. We wrote them down. Valid contract. Undisputed breach. The logic is a straight line. If we write an opinion that says "Not Liable," we are lying. We'll be stating as law that a breach didn't happen when two of us found that it did.

  **CROSS:** We aren't a logic puzzle, Vance. We're a court. And on the only question the litigants actually care about—"Do I owe money?"—two of us said no. You want to tell the defendant he owes a debt that a majority of this panel says he doesn't owe. That's not law; that's arithmetic tyranny.

  **VANCE:** It's not tyranny, it's coherence. If we rule for the defendant, what is the precedent? Do we say the contract was invalid? Judge C thinks so, but I don't, and you don't. Do we say there was no breach? You think so, but I don't, and C doesn't. If we affirm based on the verdict, we create a holding supported by *no* majority reasoning. We leave the district court with a reversal and no rule to apply next time.

  **CROSS:** Better a murky rule than a fraudulent outcome. You're talking about "coherence," but look at the coalition you're building. To get "Liable," you have to stitch together my vote on the contract with C's vote on the breach. You're cobbling together a majority out of two minorities. There is not a single pair of judges on this bench who agree that the defendant is liable. Not one. You want to enforce a judgment that exists only in the margins of our notes, not in our actual votes.

  **VANCE:** And your "majority" is equally phantom. You and C agree on "Not Liable," but you disagree on *why*. You think the contract stands but wasn't breached; C thinks the contract was dead on arrival. If we rule your way, we tell the bar that *either* invalidity *or* non-breach saves the defendant. But neither of those propositions commands a majority. You're accusing me of manufacturing a majority for liability, but you're manufacturing a majority for immunity. At least my method respects the integrity of the legal questions we were sworn to answer.

  **CROSS:** We were sworn to answer the *case*, Vance. Not to write law review articles. The litigants didn't come here for a seminar on contract theory; they came for a resolution. When you prioritize the premises over the conclusion, you're saying the internal consistency of the judiciary matters more than the actual disposition of the dispute. You're willing to crush the majority will of the panel to save the syllogism.

  **VANCE:** I'm willing to crush the *outcome* to save the *law*. If we adopt your conclusion-based approach, we invite inconsistency. Next year, a different panel faces the same facts. If they follow our reasoning, they find liability. If they follow our verdict, they don't. You're handing the lower courts a contradiction. You're telling them, "The law says X and Y, but the result is Z." That erodes the rule of law faster than any single unjust verdict.

  **CROSS:** The rule of law isn't eroded by humility. It's eroded by judges who think their logic is more democratic than their votes. Look at me. I voted that the contract was valid. But I also voted for the defendant. Why? Because I think the breach element is a higher bar. By forcing the issue-by-issue tally, you strip me of my nuance. You reduce my judicial discretion to a binary switch. You're saying my vote on "breach" is irrelevant because you can outvote me on it with C, even though on the bottom line, I outvote you.

  **VANCE:** Your nuance is a veto, Cross. That's all it is. You're saying that because you and C disagree on the path, you get to block the destination. But the law *is* the path. We are reason-giving institutions. If we cannot agree on the reasons, we have no business issuing the command. If the majority cannot agree on *why* the defendant wins, then the defendant shouldn't win by default. The burden is on the plaintiff. The premises establish the plaintiff met the burden.

  **CROSS:** The burden is met when a majority of judges say it's met. On the verdict, they didn't. You're hiding behind "reason-giving" to override the democratic deficit of this panel. You know what this looks like from the outside? It looks like three judges ganging up to ensure a liability finding that none of them individually command. A commands it, sure. But B and C? We only agree on the escape hatch. You want to lock the hatch and throw away the key because the architecture looks prettier.

  **VANCE:** It's not about architecture. It's about truth. If I sign an opinion that says "Defendant is not liable," I am implicitly endorsing a legal reality that I believe is false. I believe there was a contract. I believe there was a breach. To write "Not Liable" is to perjure my judicial oath. I cannot say the law was not broken when I am convinced it was.

  **CROSS:** And I cannot say the law *requires* a payment when I am convinced the majority of this court says it doesn't. You talk about perjury? What do you call imposing a liability on a citizen that a majority of his adjudicators rejected? That's not truth, Vance. That's authoritarianism wrapped in a logic textbook. You value the consistency of the code over the liberty of the subject.

  **VANCE:** I value the predictability of the system. If we do this your way, we teach lawyers that they don't need to win the legal arguments, they just need to confuse the judges enough to fracture the majority on the premises. It incentivizes muddying the water.

  **CROSS:** And your way teaches judges that they don't need to listen to their colleagues on the bottom line, they just need to horse-trade on the sub-issues to lock in their preferred policy outcome. It incentivizes manipulation of the agenda. We both know the order of voting changes the result. That's the dirty secret you're ignoring.

  **VANCE:** *(Taps the marker against the board)* The order shouldn't matter if the law is objective.

  **CROSS:** *(Stands up, picks up his robe)* The law isn't objective, Vance. It's us. Three people in a room. And right now, two of those people say the defendant walks.

  **VANCE:** And two of those people say the law was broken.

  **CROSS:** Then we're at an impasse.

  **VANCE:** No. We're at a choice. Do we serve the logic of the law, or the headcount of the room?

  **CROSS:** *(Pauses at the door)* I think the litigants would tell you those are the same thing.

  **VANCE:** *(Turns back to the whiteboard)* Then the litigants don't understand what we do here.

  *Cross opens the door. The clerk is visible in the hallway, looking up expectantly. Cross doesn't step out yet. He looks back at Vance.*

  **CROSS:** Write the opinion your way, Vance. I'll write a dissent that explains why the majority of the court actually voted to let him go. Let the circuit sort out which "majority" matters.

  **VANCE:** Do that. And I'll write a concurrence explaining why their "majority" is a legal fiction.

  *Cross holds the door open. The silence stretches, heavy and unresolved. Neither moves to yield the floor.*
