      *   *A:* "Your coalition is artificial too."
      *   *B:* "But it respects the bottom line."
      *   *A:* "It makes us liars in the opinion."
      *   *B:* "It makes us humble."

  6.  **Polishing:**
      *   Ensure legal terminology is accurate (holding, dicta, precedent, panel).
      *   Make the rhythm snappy.
      *   Ensure the ending feels unresolved.

  7.  **Final Review against constraints:**
      *   Two judges arguing? Yes (A and B).
      *   Issue-by-issue vs. Verdict? Yes.
      *   Equally sharp? Yes.
      *   Respond to strongest points? Yes.
      *   No tidy truce? Yes.

  *(Self-Correction on Character Names)*: Let's call them Judge Harlan (Premise/Logic) and Judge Sterling (Verdict/Outcome). Or just Judge A and Judge B to keep it abstract? No, names add flavor. Let's go with **Judge Vance** (Premise/Logic) and **Judge Cross** (Verdict/Democracy).

  *(Wait, one nuance)*: In the prompt, Judge A voted Yes/Yes (Liable). Judge B voted Yes/No (Not Liable). Judge C voted No/Yes (Not Liable).
  So:
  *   Valid Contract: A (Yes), B (Yes), C (No). Majority: Yes.
  *   Breach: A (Yes), B (No), C (Yes). Majority: Yes.
  *   Verdict: A (Liable), B (Not), C (Not). Majority: Not Liable.

  Judge Vance (A) wants Liable (Premise-based).
  Judge Cross (B) wants Not Liable (Conclusion-based).
  Judge C is the swing vote on the logic but agrees with Cross on the bottom line.

  Okay, let's write.

  *(Final Polish on the "No Truce" constraint)*: Make sure they don't agree to disagree. They should end with the clerk still waiting, the tension palpable.

  *(Final Polish on "Strongest Point")*:
  *   Vance's strongest point: If we ignore the premises, we lie about the law in the written opinion.
  *   Cross's strongest point: If we enforce the premises, we enforce a result no majority of judges actually support.

