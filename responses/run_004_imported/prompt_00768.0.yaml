  *(Self-Correction)*: I need to be careful not to conflate "legal liability" with "moral responsibility" too quickly. The prompt specifically asks to engage with the difference. I will argue that the *moral* gap is also closed if we shift the locus of moral evaluation from the *output* to the *deployment*.

  Let's write.

