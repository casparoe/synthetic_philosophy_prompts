      *   *Counter-argument:* Strict liability doesn't require fault. It requires causation + damage.
      *   *Nuance:* The engineers might feel moral distress. I need to address that. The distress comes from thinking they are responsible for the *output* rather than the *system design*.
      *   *Tone Check:* Don't sound dismissive of the coworker. The concern is valid, but the conclusion is wrong.

