      *   *Option B: The Gap Dissolves.* Argue that the "responsibility gap" is a category error. We don't need moral blame to have responsibility. Strict liability and vicarious liability already cover "unpredictable harm caused by deployed tools." The demand for *moral blameworthiness* is a red herring in a corporate/industrial context.
