      *   *Wait, better analogy:* A drug with side effects. Pharma companies are liable even if the specific reaction was unpredictable in trials. Why? Because they introduced the risk. Same with AI.
      *   *Final Verdict:* The gap is illusory. It's a demand for retributive justice in a context that requires distributive justice.

  6.  **Writing the Essay:** (Mental check of constraints)
