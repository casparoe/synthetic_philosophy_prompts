      *   *Section 2: Addressing the Puzzle.*
          *   If it's rational to continue, why start?
          *   Key concept: **Incomplete Information / Behavioral Types.** If I think you might be irrational, I must bid.
          *   Key concept: **The Entry Trap.** The first bid looks +EV. The escalation happens later.
          *   Key concept: **Backward Induction Failure.** Humans aren't perfect calculators.
      *   *Section 3: Which explains reality?*
          *   Pure game theory fails (predicts no game).
