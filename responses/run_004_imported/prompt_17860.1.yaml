answer: |-
  You have correctly identified a category error that plagues popular discussions of Shubik's Dollar Auction. Classifying the auction purely as a "sunk cost fallacy" treats a strategic interaction as a solo cognitive error. While the psychological experience of the bidders feels like sunk cost aversion, the *mechanism* driving the escalation is game-theoretic.

  However, your puzzle is the crux of the matter: **If the escalation is strategically rational once underway, why does the game exist at all?** If perfect rationality leads to a standoff, why do real humans reliably walk into the fire?

  Here is an analysis comparing the two framings, a resolution to the puzzle, and a verdict on what actually drives the overpayment.

  ### 1. The Two Framings

  **The Bias Framing (Sunk Cost / Escalation of Commitment)**
  *   **Mechanism:** Internal psychological pressure. The bidder irrationally weights past costs that cannot be recovered. They bid $1.50 for a dollar to avoid the pain of realizing a $1.00 loss.
  *   **Implication:** If you removed the opponent, the bidder would still make the error. The focus is on emotional regulation and cognitive bias.
  *   **Weakness:** It ignores the payoff structure. In the Dollar Auction, the second-highest bidder *pays*. This creates a specific strategic incentive to outbid the opponent to transfer the loss to them. It is not just about avoiding loss; it is about inflicting it.

  **The Rational Game Framing (War of Attrition)**
  *   **Mechanism:** Local best-response dynamics. Once bids exceed $1.00 (say, $1.00 vs. $1.05), the leader stands to lose $1.00 if they quit, or lose $0.05 more (bid $1.10) to potentially win $1.00 (netting a $0.90 loss instead of $1.00).
  *   **Implication:** Escalation is locally rational. Given that the opponent is still in, quitting guarantees a loss, while bidding offers a chance to reduce that loss.
  *   **Weakness:** It fails **backward induction**. If both players know the other is rational, they should anticipate the escalation. If escalation is inevitable, the expected value of entering the auction is negative. Therefore, a perfectly rational agent should not place the first bid.

  ### 2. Addressing the Puzzle

  Your puzzle is: *If clear-headed bidders foresee the dynamic, the trap should rarely spring.*

  In game theory, this is resolved by relaxing the assumption of **Common Knowledge of Rationality**. There are three specific reasons why the trap springs, even if escalation is locally rational:

  **A. Incomplete Information (The "Crazy" Type)**
  This is the strongest game-theoretic explanation (akin to the Kreps-Wilson-Milgrom reputation models). I may be rational, but I do not know if *you* are.
  *   If there is even a tiny probability that you are an "irrational" bidder (someone who will bid up to $5.00 out of spite or error), it becomes rational for me to bid up to a certain limit to test you or bluff.
  *   If I quit early, I lose my bid to a "crazy" opponent. If I bid higher, I might force the crazy opponent to fold (if they have a limit) or confirm they are crazy and cut my losses later.
  *   **Result:** Rational players escalate to distinguish themselves from irrational players, or to exploit the uncertainty. The "trap" is not a failure of logic, but a cost of doing business under uncertainty.

  **B. The Entry Error (Bounded Rationality)**
  The trap does not spring at $1.50; it springs at 5 cents.
  *   The first bid (e.g., 5 cents for a dollar) has massive positive expected value *if* no one else bids.
  *   Humans are bad at backward induction over long horizons. We evaluate the *current* move (5 cents for a dollar) rather than the *terminal* state (bidding war).
  *   Once the second player enters, the game state changes fundamentally. The initial "investment" phase has shifted to the "loss mitigation" phase. By the time bidders realize they are in a War of Attrition, they are already committed.

  **C. Social Utility Functions**
  Standard game theory assumes utility is purely monetary ($1.00 = 1 util). In reality, utility includes social standing.
  *   Winning the auction might confer "winner" status.
  *   Losing might confer "sucker" status.
  *   If the utility of not looking like a sucker exceeds the monetary loss, continuing to bid is rational *even with common knowledge of rationality*. The bidders aren't buying a dollar; they are buying dignity.

  ### 3. Verdict: What Explains Real Bidders?

  The "Sunk Cost" label is a **phenomenological description**, but the "Rational Game" framing is the **structural explanation**.

  However, neither alone explains the reliability of the trap.
  *   **Pure Bias** fails because it ignores that the opponent's presence changes the math.
  *   **Pure Game Theory** fails because with common knowledge of rationality, the auction never starts.

  **The Best Explanation: A Hybrid of Bounded Rationality and Strategic Uncertainty.**

  The Dollar Auction reliably traps people because it exploits the gap between **local rationality** and **global rationality**.

  1.  **Entry is driven by Bounded Rationality:** Bidders fail to backward induct from the end of the game. They see the first bid as a low-risk arbitrage (5c for $1). They do not simulate the recursive "if I bid, he bids, then I bid..." chain deeply enough.
  2.  **Escalation is driven by Strategic Uncertainty:** Once in, the "sunk cost" feeling is actually a heuristic for a real strategic calculation. *Quitting guarantees a loss; continuing transfers risk.* Because I cannot be 100% sure you will quit next turn, my rational move is to bid again.
  3.  **The "Fallacy" is the Entry, not the Escalation:** The true error is not continuing past $1.00 (which is a rational response to being trapped); the error is failing to anticipate that the game *becomes* a trap once a second bidder enters.

  **Conclusion**
  The rationalist blogs are half-right but for the wrong reasons. They correctly identify that bidders make a mistake, but they misdiagnose it as a psychological inability to ignore past costs.

  In reality, the Dollar Auction is a **mechanism design flaw** that aligns local incentives with global disaster. Real bidders overpay not because they are emotionally attached to their past bids, but because they are rationally responding to an opponent who might not quit, in a game they mistakenly believed they could control at the start. The "sunk cost fallacy" is simply the cognitive shadow cast by a game where the only way to stop losing money is to spend more money.
