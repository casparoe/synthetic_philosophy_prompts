          *   *Synthesis:* Bounded rationality + Strategic Uncertainty. The "sunk cost" feeling is actually a heuristic for a complex strategic calculation that is too hard to compute in real-time.
      *   *Conclusion:* The Dollar Auction isn't a fallacy; it's a mechanism design flaw that exploits the gap between local rationality and global optimality.

  7.  **Refining the Argument (Self-Correction during drafting):**
