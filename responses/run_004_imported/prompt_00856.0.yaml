answer: |-
  This does not sound weird at all. In fact, it sounds like one of the most honest assessments of selfhood I've heard in a long time.

  You are encountering a clash between two different operating systems for human life: **Western Individualism** (the default setting of most career/life advice) and **Relational/Collectivist Identity** (common in traditional Chinese families and many other cultures).

  The advice you are getting ("find what *you* want") assumes that there is a pre-packaged, atomic "You" hidden underneath your roles, waiting to be excavated. It assumes that being a "good child" and being "yourself" are mutually exclusive categories.

  But for many people, especially in Confucian-influenced cultures, the self *is* the relationships. You aren't a noun; you're a verb that happens between people. You are a son/daughter, a grandchild, a family member. To ask you to remove those roles to find "you" is like asking a fish to remove the water to find "swimming." When you take the water away, the fish doesn't find its true self; it just flails.

  So, to answer your specific questions:

  **1. Is everyone's advice just bad advice for your situation?**
  Yes and no. It's not *bad* advice, but it is **mismatched** advice. It is a tool designed for a different architectural structure.
  *   **Where it helps:** It helps people who are enmeshed or abused realize they have boundaries.
  *   **Where it fails you:** It creates a false vacuum. If you try to strip away your family obligations to find a "pure" desire, you will find emptiness, because your desires are likely wired through your connections to others. Trying to force an individualistic framework onto a relational identity often creates unnecessary anxiety and a sense of defectiveness ("Why can't I find myself?").

  **2. Is there actually some neutral "you" in there that you're failing to find?**
  Probably not in the way they mean. And that is okay.
  Psychologists and philosophers have debated this for centuries. Some argue the "true self" is a myth. We are largely the sum of our commitments.
  If you strip away "child," "employee," "friend," "grandchild," most people *don't* find a glowing core of preferences. They find biology and temperament.
  The feeling that there is "nothing there" isn't a failure of introspection; it's an accurate observation that **you are defined by your commitments.**

  ### How to make the decision without the "What do I want?" framework

  If you can't consult a "neutral you," how do you choose? You stop looking for *desire* and start looking for *values* and *capacity*.

  Here is a different framework for your decision:

  **1. Distinguish between "Desire" and "Valuation"**
  You might not have a burning *desire* to stay or go (that's the "nothing there" feeling). But you likely have *values*.
  *   Do you value filial piety and being present for the end of your grandmother's life?
  *   Do you value professional mastery and financial independence?
  Both can be *your* values, even if your parents champion one of them. Just because they want you to stay doesn't mean *you* can't value staying. The key is ownership. If you stay, is it because you are cowering, or because you have decided that caring for family is a higher priority for *this chapter* of your life?

  **2. The "Resentment vs. Guilt" Calculation**
  Since you can't consult a neutral self, consult your future emotional capacity.
  *   **Scenario A (You take the job):** You will likely feel guilt. Can you carry that guilt without it poisoning your relationship with your parents? Can you manage it from a distance (sending money, visiting often, hiring help)?
  *   **Scenario B (You move home):** You will likely feel resentment. Can you carry that resentment without it turning into bitterness toward your grandma or parents?
  *   **The Question:** Which emotion are you better equipped to process? Guilt is often easier to manage from afar than resentment is to manage while living under the same roof.

  **3. Negotiate the Role, Don't Reject It**
  You mentioned you butt heads and they change their minds. This is crucial. It means your family dynamic is a **negotiation**, not a dictatorship.
  In a relational self, "autonomy" doesn't mean "doing what they don't want." It means "negotiating the terms of my contribution."
  *   *Instead of:* "I'm not coming home."
  *   *Try:* "I am taking this job. Here is how I will ensure Grandma is cared for. I will visit every X weeks. I will contribute $Y toward care. I will be here for the major holidays."
  This allows you to honor the relationship (the relational self) without sacrificing the opportunity.

  **4. Identity is Built, Not Found**
  Existentialists argue that you don't find yourself; you create yourself through action.
  If you take the job, you *become* the person who prioritizes career growth. If you stay, you *become* the person who prioritizes family care.
  There is no "real you" waiting to be discovered before you choose. **The choice creates the you.**
  So, ask yourself: "Which version of myself do I want to build? The one who took the risk on the career, or the one who anchored the family?" Neither is the "true" one. They are just different paths of construction.

  ### Summary
  You aren't broken, and you aren't missing a "self." You are experiencing the friction of a relational identity in a world that worships individualism.

  Don't try to find a "you" that exists outside of your family. That person might not exist. Instead, ask yourself: **"In the context of being a son/daughter and a professional, which path allows me to look in the mirror with the most respect for who I am becoming?"**

  That is a question your relational self *can* answer.
