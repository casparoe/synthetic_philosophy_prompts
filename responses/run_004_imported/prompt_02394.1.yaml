      *   *Key Insight:* Bentham would likely criticize *both* for not focusing enough on the *Codification* aspect. The Grudge Informer case exists because the law was a mess. A proper Code would have anticipated malicious informing.

  8.  **Finalizing the Structure:**
      *   **Thesis:** Bentham creates a "Utilitarian Positivist" third way. He agrees with Hart on the nature of law, agrees with Fuller on the outcome (punish her), but rejects Fuller's reasoning and modifies Hart's solution with a strict utilitarian calculus regarding retroactivity.
      *   **Section 1: The Nature of the Nazi Law (vs. Fuller).** It was law. Fuller is mystifying.
      *   **Section 2: The Role of the Judge (vs. Fuller & Hart).** Judges apply, Legislators make. No judicial moralizing.
      *   **Section 3: The Retroactivity Problem (The Core Tension).** Security of Expectation vs. Prevention of Mischief.
