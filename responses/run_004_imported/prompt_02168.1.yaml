answer: |-
  **Setting:** *The philosophy department lounge, late afternoon. Empty coffee cups and a whiteboard covered in half-erased decision trees. **Max** (Maximizing Act-Consequentialist) is leaning against the counter. **Sam** (Satisficing Consequentialist) is slumped in an armchair.*

  **Max:** So, did you get through the Bradley paper for next week?

  **Sam:** The 2006 *Utilitas* piece? Yeah. It's the usual hit job on Slote, but sharper. He really zeroes in on the "knowing better" problem.

  **Max:** It's not just a hit job, Sam. It's the reductio. The whole motivation for satisficing is to avoid the demandingness objection without abandoning consequentialism. But Bradley shows you can't have it both ways. You either care about producing the best outcome, or you don't. If you do, you're a maximizer. If you don't, you're not a consequentialist.

  **Sam:** That's the slogan, sure. But it assumes that "consequentialism" just means "maximize the good." Slote's point is that the structure of practical reason isn't always comparative. Sometimes it's non-comparative. I meet the standard, I'm in the clear.

  **Max:** Okay, let's cash that out. Don't give me the abstract "structure of reason" talk. Give me the agent. Let's say I have a free Saturday. I can volunteer at a soup kitchen (Option A) which generates 100 units of good. Or I can volunteer at a disaster relief coordination center (Option B) which generates 120 units of good. Both require the same time, same effort, same emotional toll. Your satisficing threshold is at 80 units.

  **Sam:** Okay. Both are above the threshold.

  **Max:** Right. So, on your view, I am permitted to choose A. I can knowingly, intentionally choose to produce 20 units less good, even though I could have produced more at no extra cost to myself.

  **Sam:** Yes. Because once I've done enough to meet the moral requirement, the *obligation* stops. What I do beyond that is supererogatory. I can choose to be a saint at the disaster center, or I can choose to be merely decent at the soup kitchen.

  **Max:** But *why*? That's Bradley's point. If you admit B is better than A, you're admitting there is more *reason* to do B. The value is higher. The consequences are better. If you say, "Yes, B is better, but you're allowed to pick A," you're severing the link between value and rational choice. You're saying an agent can be fully rational and fully moral while knowingly leaving value on the table.

  **Sam:** You're smuggling the maximizing principle back in as a precondition of rationality. You're assuming that *more good* always entails *more reason*. But the satisficer says the reason-giving force of the good saturates. Once the need is met, the urgency dissipates.

  **Max:** Saturates? In my example, the need isn't met. The disaster relief center can use those extra 20 units. People are still hungry, still suffering. You're saying the moral force of their hunger just... turns off because I hit your arbitrary 80-unit line?

  **Sam:** It's not arbitrary if it's grounded in the agent's prerogative to live a life. The threshold marks the boundary between what morality *demands* of me and what I *owe* to my own projects. If I have to maximize every time, I become a slave to the good. Satisficing says I can stop at "good enough" so I can go write a poem, or rest, or yes, volunteer at the less efficient soup kitchen because I like the people there better.

  **Max:** But in my case, the effort is identical! You're not sacrificing a personal project. You're just... picking the worse option. If the cost to you is zero, the "agent-centered prerogative" doesn't apply. You aren't losing anything. So why are you allowed to be less effective?

  **Sam:** Because the permission isn't about the cost to me. It's about the nature of the requirement. Morality requires sufficiency, not optimality. If I hand you a passing essay, I've met my obligation as a TA. If I could have written you a slightly better commentary but didn't, I haven't wronged you, provided the grade was justified.

  **Max:** That's a disanalogy. As a TA, you have a contract. Morality isn't a contract; it's about responding to value. Look, Bradley puts it this way: Satisficing consequentialism implies that sometimes, knowing that X produces more value than Y, and knowing that X and Y are both available, an agent has *no more reason* to do X than Y. That makes the concept of "betterness" normatively inert. If "better" doesn't mean "more to be done," what work is it doing?

  **Sam:** It does work! It tells us which options are *forbidden*. Anything below the threshold is forbidden. That's a huge amount of work. It rules out the selfishness, the negligence. It just doesn't rule out the sub-optimal.

  **Max:** But that creates a bizarre discontinuity. Imagine a slider. At 79 units, I'm morally required to jump to 80. The normative pressure is immense. I *must* do it. But at 100 units, if I can jump to 120 at the same cost, the normative pressure vanishes? The curve flatlines completely?

  **Sam:** Yes. Because the 79-to-80 jump is about meeting the requirement. The 100-to-120 jump is about going beyond it.

  **Max:** But why does the requirement stop at 80? If the justification for the requirement is "suffering is bad," then suffering is still bad at 100. If the justification is "you should help," you should still help at 100. The only reason to stop at 80 is *your* interest. But if *your* interest isn't at stake—like in my Saturday example—then you have no justification for stopping.

  **Sam:** Okay, here's the pushback. You're assuming the only justification for morality is the impersonal good. The satisficer says the justification is a hybrid: promote the good, but respect the agent as a distinct locus of value. The threshold *is* the respect for the agent. Even if the cost is low, insisting on the optimal treats the agent as a mere conduit for value production.

  **Max:** That sounds nice, but it collapses under scrutiny. If I choose A (100 units) over B (120 units), I am effectively saying, "My preference for the soup kitchen is worth 20 units of disaster relief." You're quantifying the agent's whim and weighing it against actual welfare. If you're willing to do that, you're actually a maximizer with a weird weighting function! You're maximizing *Agent-Interest + Impersonal Good*.

  **Sam:** Not necessarily. I'm saying the agent's interest acts as a *blocker*, not a weight. It doesn't outweigh the 20 units. It just renders the comparison irrelevant once the threshold is crossed.

  **Max:** That's the "question-begging" charge Bradley makes. You're asserting that the comparison becomes irrelevant. But why? If I know B saves more lives, and I choose A, I am knowingly letting more people suffer. How is that not a moral failure?

  **Sam:** Because I didn't *let* them suffer. I didn't cause it. I just didn't prevent it as efficiently as I could have. There's a difference between harming and not-optimizing.

  **Max:** In consequentialism, that distinction is supposed to collapse. That's the whole point of the view! If you're a consequentialist, you believe the rightness of an act is determined by the goodness of the outcome. If Outcome B is better than Outcome A, Act B is righter than Act A. To say Act A is "permissible" when Act B is "righter" is a contradiction in terms.

  **Sam:** Only if you define "rightness" as "maximizing." If you define rightness as "satisfying the moral standard," then both are right. You're begging the question by defining the moral standard as maximization.

  **Max:** I'm not begging the question; I'm following the logic of value! If value is what matters, then more value matters more. To deny that is to say value doesn't matter. Look, let's try a different angle. The "Fair Share" argument. If everyone adopted your satisficing view, and everyone stopped at 80 units when they could do 120, the collective outcome is drastically worse.

  **Sam:** Rule-consequentialist move? Classic. But we're talking act-evaluation. And even so, if everyone met the threshold, we'd solve the major crises. The demand to maximize is usually driven by the fact that *others* aren't doing their share.

  **Max:** But that's the trap! You're admitting that if others *were* doing their share, you wouldn't need to maximize. But since they aren't, the gap needs filling. And who fills it? The conscientious agent. If you have the capacity to fill it, and you don't, you're complicit in the deficit.

  **Sam:** Complicity requires a duty. I'm arguing the duty is satisfied at the threshold. You keep circling back to "But you could do more!" Yes, I could. I could also give away my kidney. I could work 80 hours a week. You call me complicit for not doing that. I call it a life.

  **Max:** I'm not asking for the kidney! I'm asking for the Saturday where the cost is zero. That's the Bradley wedge. It's not about the kidney. It's about the case where the agent loses *nothing*. If satisficing can't handle the zero-cost case, it's not a theory of morality; it's a theory of convenience.

  **Sam:** It's a theory of *sufficient* morality. You're obsessed with the idea that if I don't pick the best, I'm irrational. I'm telling you that rationality allows for latitude. If I choose the soup kitchen because I connect with the community there, that has value too, even if it's not captured in your "units of good."

  **Max:** Then put that value in the calculus! If "community connection" is valuable, add it to the score. Maybe then the soup kitchen *does* score 120.

  **Sam:** I can't do that. Because then I'm back to maximizing. I'm just expanding the inputs. The point of satisficing is to say that *even if* the disaster center scores higher on every metric, I am allowed to choose the soup kitchen provided it's "good enough."

  **Max:** And that's where I lose you. Because that amounts to saying, "I am allowed to choose the worse state of affairs." If you're willing to say that, you aren't a consequentialist anymore. You've abandoned the core insight that states of affairs are what matter.

  **Sam:** States of affairs matter. But *my relationship* to those states of affairs matters too. I am not a utility pump. I'm a person.

  **Max:** And persons should want the best outcome. If you love the good, you want more of it. If you're satisfied with less when more is possible, you don't love the good enough.

  **Sam:** Or maybe loving the good doesn't mean being enslaved by it. Maybe the "demandingness objection" isn't just a complaint about difficulty; it's a signal that the theory is misdescribing the moral landscape.

  **Max:** And maybe the "signal" is just our selfishness trying to rationalize itself. Bradley's point stands: Satisficing consequentialism is unstable. It tries to borrow the credibility of consequentialism (the focus on outcomes) while rejecting its engine (maximization). Eventually, you have to pick. Either outcomes determine rightness completely, or they don't. If they do, you maximize. If they don't, what's doing the work?

  **Sam:** The threshold is doing the work.

  **Max:** But what grounds the threshold? If it's not the maximization of value, what is it?

  **Sam:** *(Pauses, picks up coffee cup)* That's the question, isn't it? Slote thinks it's a feature of practical rationality itself. We operate with "good enough" in almost every other domain.

  **Max:** In almost every other domain, when we realize we can get the better option for the same price, we take it. Unless we're irrational. So you're either saying morality allows irrationality, or that morality isn't about the good.

  **Sam:** *(Smiles faintly)* Or that "rationality" in the moral sphere isn't the same as "rationality" in the market.

  **Max:** Then give me an account of moral rationality that isn't just "feel like it."

  **Sam:** And give me an account of maximizing that doesn't turn morality into a tyranny.

  *(They sit in silence for a moment. The whiteboard marker is dry.)*

  **Max:** See you next seminar.

  **Sam:** Yeah. Bring the zero-cost case again. I'll work on the threshold grounding.

  **Max:** Deal.
