answer: |-
  This is one of the sharpest knives in the philosophy of science toolkit. You have hit on the exact tension point where the mathematical definitions of "evidence" diverge between the two paradigms.

  Your professor is right: this isn't just a technicality; it cuts to the core of what we think statistics *are*. Here is the mechanism behind why frequentist inference breaks under optional stopping, why Bayesian inference holds firm, and how this specific mechanical failure fueled the replication crisis.

  ### 1. The Mechanism: Counterfactuals vs. Likelihood

  To understand why the $p$-value changes while the posterior does not, you have to look at what each method counts as "relevant information."

  #### The Frequentist Mechanism: The Sampling Distribution
  Frequentist inference (specifically null hypothesis significance testing, or NHST) is not about the probability of the hypothesis given the data. It is about the probability of the **data** (or more extreme data) given the hypothesis.

  To calculate a $p$-value, you must construct a **sampling distribution**. This is a theoretical distribution of all possible outcomes you *could have obtained* if you repeated the experiment infinitely under the null hypothesis.

  **Here is the catch:** The set of "possible outcomes" is defined by your **experimental design**, specifically your stopping rule.

  **Example:** Imagine you are testing if a coin is biased ($H_0: p=0.5$). You observe 8 Heads and 2 Tails.
  *   **Scenario A (Fixed N):** You decided in advance: "I will flip exactly 10 times."
      *   The "more extreme" outcomes are 9 Heads or 10 Heads.
      *   The $p$-value sums the probability of getting 8, 9, or 10 Heads in 10 flips (Binomial distribution).
  *   **Scenario B (Fixed Z / Optional Stopping):** You decided in advance: "I will flip until I get 8 Heads."
      *   The data happens to be 8 Heads and 2 Tails (total 10 flips).
      *   However, the "more extreme" outcomes are now defined differently. In this design, getting 8 Heads in *fewer* flips (8 or 9 total flips) is "more extreme" evidence against the null.
      *   The $p$-value sums the probability of reaching 8 Heads in 8, 9, or 10 flips (Negative Binomial distribution).

  **The Result:** Even though the physical data (H,H,H,H,H,H,H,H,T,T) is identical, the **sample space** (the set of counterfactual possibilities) is different. Since the frequentist $p$-value is an integral over the sample space, the value changes. The frequentist must know your *intentions* (what you would have done if the data had been different) to calculate the error rate correctly.

  #### The Bayesian Mechanism: The Likelihood Function
  Bayesian inference asks: "Given the data I actually have, how should I update my belief in the hypothesis?"

  The engine of Bayesian updating is Bayes' Theorem:
  $$ \text{Posterior} \propto \text{Likelihood} \times \text{Prior} $$

  The **Likelihood Function** $L(\theta | \text{data})$ is simply the probability of the observed data as a function of the parameter $\theta$.
  *   In Scenario A, the likelihood is proportional to $p^8 (1-p)^2$.
  *   In Scenario B, the likelihood is *also* proportional to $p^8 (1-p)^2$.

  **The Mechanism:** The stopping rule is a function of the data. Once you condition on the data you actually observed, the stopping rule provides no additional information about the parameter $\theta$ (assuming the stopping rule is not informative about $\theta$ itself, e.g., you didn't stop *because* you knew the coin was biased).

  Because the Likelihood function is identical in both scenarios, and the Prior is (presumably) identical, the **Posterior must be identical.** The Bayesian does not care about the "could haves" (counterfactuals); they only care about the "did haves" (observed data).

  ### 2. The Likelihood Principle (LP)

  This brings us to the philosophical principle your professor mentioned. The **Likelihood Principle** states:

  > *All the evidence in the data regarding the model parameters is contained in the likelihood function. If two experiments yield proportional likelihood functions, they should yield identical inferences.*

  *   **Bayesians obey the LP.** As shown above, their inference depends only on the likelihood and prior.
  *   **Frequentists violate the LP.** As shown above, their inference depends on the sampling distribution, which changes based on the stopping rule even if the likelihood remains constant.

  For a philosopher of science, this is massive. It implies that Frequentism violates a basic intuition about evidence: **If I show you a specific dataset, your assessment of the evidence should not depend on what I was thinking about doing but didn't do.** Frequentism says your assessment *must* depend on my unexecuted intentions.

  ### 3. Why This Drives the Replication Crisis

  You asked why this isn't just generic "p-hacking is bad" talk. The distinction is crucial. "P-hacking" implies malicious manipulation. Optional stopping is often **rational, intuitive behavior** that is mathematically forbidden in frequentist theory.

  Here is the specific mechanism of the crisis:

  #### 1. The Incentive Structure
  In psychology and social sciences, data collection is expensive and time-consuming. A researcher thinks: *"I'll run 50 subjects. If $p < .05$, great, I publish. If $p = .08$, that's basically significant, I'll just run 10 more subjects to see if it tips over."*

  To a human, this sounds reasonable. You are just gathering more evidence.
  To a Frequentist, this is catastrophic.

  #### 2. The Inflation of Type I Error
  If you peek at your data and decide whether to stop based on the $p$-value, you have changed the stopping rule from "Fixed N" to "Sequential Testing."
  *   If you stick to Fixed N=50, your false positive rate is 5%.
  *   If you peek at N=50, and if non-significant, continue to N=60, your false positive rate inflates (often to 8-10% for one peek, much higher for multiple peeks).
  *   If you continue peeking until $p < .05$ (pure optional stopping), your false positive rate approaches **100%** eventually, even if the null hypothesis is true.

  #### 3. The Publication Filter
  Journals publish $p < .05$. They do not publish "I ran 50 subjects, $p=.08$, stopped, and found nothing."
  Because researchers engage in optional stopping *without correcting for it* (most do not use sequential analysis corrections like alpha-spending functions), the published literature becomes filled with false positives that cleared the $p < .05$ bar only because the researcher kept sampling until the noise looked like a signal.

  #### 4. The Replication Failure
  When a replicator comes along, they usually read the methods section: *"We collected 60 subjects."*
  The replicator assumes this was a **Fixed N** design. They run 60 subjects.
  *   **Original Study:** Effectively a "Run until significant" design (high false positive rate).
  *   **Replication:** A "Fixed N" design (standard 5% false positive rate).

  The original study found a signal that was largely a product of the flexible stopping rule. The replication, using a rigid design, finds nothing. The field declares a "crisis."

  ### Summary for your Seminar

  If you want to nail this in your seminar, frame it this way:

  1.  **The Ontological Difference:** Frequentism defines probability as **long-run frequency** (requiring a defined set of hypothetical repetitions/stopping rules). Bayesianism defines probability as **degree of belief** (requiring only coherence with observed data).
  2.  **The Violation:** Optional stopping highlights that Frequentism conflates **evidence** (what the data says) with **behavior** (how the experimenter acted). The Likelihood Principle argues these should be separate.
  3.  **The Crisis:** The replication crisis is partly a crisis of **unacknowledged design**. Researchers behaved like Bayesians (collecting data until it looked convincing) but reported like Frequentists (claiming a fixed error rate of 5%). This mismatch between the *actual* error rate (inflated by stopping rules) and the *reported* error rate (fixed at .05) flooded the literature with non-replicable findings.

  The "Optional Stopping" problem isn't just a math puzzle; it is the smoking gun that proves you cannot mix Bayesian data collection habits with Frequentist inference standards without breaking the logic of science.
