      *   *Scenario A (Fixed N):* Toss 10 times. Get 8 Heads.
      *   *Scenario B (Fixed Z):* Toss until 8 Heads. It took 10 tosses.
      *   *Data:* Identical (8H, 2T).
      *   *Frequentist Calculation:*
          *   Scenario A: Binomial distribution. Probability of $\ge 8$ heads in 10 tosses.
          *   Scenario B: Negative Binomial distribution. Probability of taking $\le 10$ tosses to get 8 heads.
          *   *Crucial Point:* The set of "more extreme" outcomes is different. In A, more extreme is 9H, 10H. In B, more extreme is 8H in 9 tosses, 8H in 8 tosses. The probabilities sum differently.
      *   *Bayesian Calculation:*
          *   Likelihood is $p^8 (1-p)^2$.
          *   Prior is same.
          *   Posterior is same.
          *   Stopping rule is irrelevant to the likelihood function.
      *   *The Likelihood Principle:* Formulate it. "If the likelihood functions are proportional, the inference should be the same." Frequentism cares about the *sample space* (what didn't happen), Bayes cares about the *likelihood* (what did happen).
      *   *Replication Crisis:*
          *   It's not just "cheating." It's often "I'll just check if it's significant after 50 subjects, if not, I'll get 10 more."
