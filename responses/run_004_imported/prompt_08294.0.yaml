      *   **Core Problem:** "Optional Stopping" paradox.
      *   **Specific Confusion:** Why does the frequentist $p$-value change based on the *intention* (stopping rule) even with identical data, while the Bayesian posterior remains invariant?
      *   **Key Concept Mentioned:** The Likelihood Principle (LP).
      *   **Broader Impact:** Why is this specific technical issue a driver of the replication crisis (beyond generic "p-hacking is bad")?
      *   **Goal:** Explain the *mechanism* clearly, connect it to the LP, and explain the replication crisis link.

  2.  **Initial Brainstorming & Fact-Checking:**
      *   *Frequentist Logic:* $p$-values are based on the sampling distribution of a test statistic under the null hypothesis ($H_0$). The sampling distribution depends on the *space of possible outcomes*, which is defined by the experimental design (including the stopping rule).
      *   *Bayesian Logic:* Posterior $\propto$ Likelihood $\times$ Prior. The Likelihood function depends *only* on the observed data, not on unobserved data or intentions.
      *   *Likelihood Principle:* All evidence in the data regarding model parameters is contained in the likelihood function. If two experiments yield proportional likelihood functions, they should yield the same inference. Frequentist methods violate this; Bayesian methods obey it.
      *   *Optional Stopping:* If I decide to stop when $p < 0.05$, I inflate the Type I error rate because I'm peeking. The frequentist correction accounts for this "peeking" by widening the confidence intervals or adjusting the alpha. If I don't account for it, the $p$-value is invalid.
      *   *Replication Crisis:* Researchers often engage in optional stopping (peeking at data) without correcting for it. This leads to false positives that don't replicate.

  3.  **Structuring the Explanation:**
