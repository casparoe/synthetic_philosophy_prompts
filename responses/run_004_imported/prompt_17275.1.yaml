      *   **The Trade-offs:** "Smarter rules" (like the premise-based or conclusion-based procedures) solve inconsistency but violate other desirable properties (like independence or systematicity).
      *   **Normative vs. Technical:** This isn't just about logic consistency; it's about democratic legitimacy, reason-giving, and accountability.
      *   **Comparison to Arrow:** Arrow is about preferences; List-Pettit is about judgments/beliefs. They are structurally similar but apply to different domains.
      *   **The "Bug" Analogy:** Why is it not just a bug? Because fixing the "bug" requires sacrificing other core values of collective decision-making.

