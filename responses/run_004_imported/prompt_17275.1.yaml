          *   *Distance-based (Closest consistent):* This is the "Kemeny-Young" equivalent for judgments. *Cost:* Computationally hard (NP-hard sometimes), but more importantly, it violates Independence/Systematicity. The outcome on proposition $P$ depends on votes on $Q$. This opens the door to manipulation and lack of transparency.

      *   *Point 3: The Normative Stakes (Why it's Philosophical).*
