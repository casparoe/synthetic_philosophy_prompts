          *   The theorem states: You cannot have Universal Domain, Consistency, Systematicity (or Independence), and Anonymity (or Non-dictatorship) all at once.
          *   So, switching to a "constraint solver" (premise-based or conclusion-based) solves Consistency but breaks Systematicity/Independence.

