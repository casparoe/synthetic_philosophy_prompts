      *   *Why does it happen?* It's about the nature of "essence" and "necessary existence."
      *   *Step 1: God's Essence.* If a being is God-like, having all positive properties is its *essence*. That means any property it has follows from being God-like.
      *   *Step 2: Necessary Existence.* God exists necessarily. So, in every possible world, a God-like being exists.
      *   *Step 3: The Connection.* In S5, if something is possibly necessary, it is necessary. But the collapse comes from how properties relate to the God-like being.
      *   *The Crux:* If God exists in all worlds, and God's nature (essence) determines all positive properties, and the axioms imply that *any* true property of God is entailed by His essence... wait, that's not quite the collapse mechanism.
      *   *Refining the Collapse Mechanism:* The collapse arises because if God exists necessarily, then the proposition "God exists" is true in all worlds. But the stronger result ($\phi \to \square \phi$) comes from the interaction between the definition of essence and the axioms of positivity.
      *   *Sobel's Insight:* If $P$ is any true property of the God-like being, and being God-like is the essence of that being, then $P$ is entailed by the essence. Since the essence exists necessarily, $P$ holds necessarily. Since *any* truth can be framed as a property of God (or entailed by the state of affairs God guarantees), all truths become necessary.
      *   *Simpler Analogy:* Imagine God is the "Ultimate Fact." If the Ultimate Fact *must* exist (Necessary Existence) and *must* be exactly as It is (Essence), then there is no room for the world to be any other way. If God determines all positive properties, and God is fixed across all worlds, then the configuration of positive properties is fixed across all worlds. If the "positive properties" cover enough ground, everything is fixed.
      *   *Technical nuance:* It's specifically that if $\phi$ is true, then God has the property of "being such that $\phi$." Since God exists necessarily and has all positive properties necessarily, $\phi$ becomes necessary.

