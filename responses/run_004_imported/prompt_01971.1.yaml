      *   *Axioms (Simplified):*
          1.  If $P$ is positive, $\neg P$ is not.
          2.  If $P$ is positive and $P$ entails $Q$, then $Q$ is positive.
          3.  Being God-like is a positive property.
          4.  Positive properties are necessarily positive.
          5.  Necessary existence is a positive property.
      *   *The Goal:* Prove a God-like being exists necessarily.
      *   *The Problem (Modal Collapse):* Jordan Howard Sobel (1987) showed that within the framework of S5 modal logic combined with Gödel's axioms, if God exists necessarily, then *everything* that is true is necessarily true. $\phi \to \square \phi$.

