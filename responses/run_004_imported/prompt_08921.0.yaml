answer: |-
  **Setting:** *A quiet corner of a university library, late afternoon. Elena, a retired experimental nuclear physicist, sits across from Marcus, a philosopher of science. Between them lies a stack of papers, including a reprint of Chadwick's 1932 paper and a modern textbook on nuclear structure.*

  **Marcus:** I've been thinking about our last conversation regarding the Pessimistic Meta-Induction. You objected that the standard examples—phlogiston, caloric, the ether—are too distant from modern practice. They feel like folklore to a physicist. So, I took your advice. I looked into the proton-electron model of the nucleus.

  **Elena:** (Smiling) Ah, the pre-neutron era. A painful time for nuclear theory, but a fertile one.

  **Marcus:** Precisely. Consider the consensus around 1930. The community was committed to the view that the nitrogen-14 nucleus contained fourteen protons and seven electrons. It was the standard model. It explained the mass number, the atomic number, and beta decay phenomenology. Yet, by 1932, it was discarded. The ontology was wiped clean. No nuclear electrons. If that theory was empirically successful enough to command universal assent, yet false in its fundamental description of reality, doesn't it fit the meta-induction perfectly? Why should we trust the neutron-proton model any more than we trust the proton-electron one?

  **Elena:** Because the failure of the proton-electron model wasn't a uniform collapse. It was localized. You're treating the theory as a monolith, Marcus. A realist doesn't have to believe *every* posit of a past theory was false. We can use a "divide and conquer" strategy. Look at *why* the model failed. It failed on spin and statistics. Nitrogen-14 has an integer spin. But fourteen protons plus seven electrons is twenty-one fermions. An odd number of fermions must yield a half-integer spin. The math screamed contradiction.

  **Marcus:** I follow the physics. But that contradiction is exactly my point. The physicists believed there were electrons in the nucleus. They were wrong. There are no electrons in the nucleus. If you are a realist, you believe our current theories tell us what exists. If the best theories of 1930 told them electrons existed in the nucleus, and they didn't, then successful theory does not guarantee true ontology.

  **Elena:** But consider what *survived*. The charge number, $Z=7$. The mass number, $A=14$. The fact that the nucleus is a compact, dense object governed by quantum mechanics. When Chadwick found the neutron, he didn't throw out the periodic table. He didn't throw out the mass spectrographs. He didn't throw out the quantum statistical rules; he used them to kill the old theory! The *structure* of the theory was preserved, even if the *identification* of the constituents was wrong. I can be a realist about the structural relations without being a naive realist about every hypothetical entity.

  **Marcus:** That sounds like Structural Realism. But here is the epistemic trap: Can you draw that distinction *at the time*? In 1930, the electron wasn't a peripheral auxiliary hypothesis. It was central. It was the mechanism for charge neutrality. It was the mechanism for beta decay emission. If you asked Rutherford, "Are there really electrons in there?" he would have said yes. That wasn't idle wheel-spinning; that was the engine of the theory. How do you, with the benefit of 20/20 hindsight, carve the theory into "good structural parts" and "bad ontological parts" without cheating?

  **Elena:** I'm not cheating; I'm analyzing explanatory power. The electrons were doing work, yes, but they were doing it *mathematically*. They accounted for the charge difference $A - Z$. When we switched to neutrons, the neutron accounted for the exact same charge difference $A - Z$. The *role* the electron played in the formalism was preserved, even if the *entity* was swapped. As a realist, I argue that the success of the theory was tracking a real feature of the world—the existence of a neutral mass carrier—even if they misidentified it as a composite proton-electron pair.

  **Marcus:** But that's the generosity of hindsight again. In 1930, the "neutral mass carrier" wasn't a posit of the theory. The posit was "proton plus electron." If I am a scientist working today, and I rely on your rule—"believe the entities that are doing the explanatory work"—I am in trouble. Because how do I know if my current "neutron" is a fundamental particle, or if in fifty years we'll discover it's a composite of some pre-quark entities that mimic the neutron's role? The proton-electron model was believable *then* for the same reasons the quark model is believable *now*. It fit the data. It cohered with background theory.

  **Elena:** But the background theory changed! That's the difference. In 1930, they were trying to fit nuclear phenomena into a classical-quantum hybrid framework where electrons were the only known light fermions. The anomaly in the nitrogen spin wasn't just a small error; it was a category mistake. A realist expects theory change to be convergent. The transition from proton-electron to proton-neutron wasn't a revolution that erased the past; it was a correction. The "neutron" in the modern sense fills the exact gap the "nuclear electron" was trying to fill. The reference was stable, even if the description was flawed.

  **Marcus:** Stable reference is a high bar. Let's press on the nitrogen spin again. The old theory predicted half-integer spin. The world showed integer spin. That is a direct falsification of the ontology. If the ontology is false, what is the "structure" you are being realist about? You say the mathematical relations survived. But the mathematical relation $14p + 7e$ implies Fermi-Dirac statistics. The new relation $7p + 7n$ implies Bose-Einstein statistics. Those are mutually exclusive mathematical descriptions of the system's behavior. The old math *failed*. You can't claim structural continuity where the equations themselves had to be fundamentally reconfigured to match observation.

  **Elena:** The equations of quantum mechanics didn't change. The Hamiltonian changed. Look, Marcus, if I deny realism, I have to accept that the success of the 1930 model was a miracle. It predicted scattering cross-sections. It predicted chemical behavior. It predicted mass defects. If there was no correspondence between that model and reality, why did the cyclotron work? Why did the calculations for binding energy yield numbers that matched the calorimeters?

  **Marcus:** I don't deny the calculations worked. I deny that "working" implies "true." Think of the Ptolemaic system. It predicted planetary positions for centuries. It was empirically adequate. But the epicycles weren't real. You might say, "But the geometric relations were preserved in the heliocentric model." Perhaps. But a scientist in 1400 couldn't distinguish the "real" geometric relations from the "instrumental" epicycles. Similarly, in 1930, the nuclear electron was an epicycle. It saved the phenomena of charge and mass. It turned out to be ontologically empty. The lesson for you, the modern physicist, is that your current "working posits"—quarks, gluons, fields—might be the epicycles of a deeper theory we don't have yet. The PMI doesn't say science makes no progress. It says progress doesn't guarantee truth.

  **Elena:** But there is a disanalogy. Ptolemy's epicycles were purely kinematic. They were descriptive tools. The nuclear electron was dynamic. It was supposed to interact via the Coulomb force. It was supposed to be confined by potential wells. When we discovered the neutron, we found a particle that had a magnetic moment. Interestingly, the neutron's magnetic moment is roughly what you'd expect if it *were* a proton and electron bound together, though the spin is wrong.

  **Marcus:** (Leaning forward) Ah, but that's dangerous territory. The neutron's magnetic moment *isn't* exactly what you'd expect from a proton-electron pair. It's anomalous. If it were truly a composite of the known proton and electron, the g-factor would be different. The fact that it's close is a coincidence of the underlying quark structure, which neither model knew about. If you cling to the idea that the old theory was "partially true" because the magnetic moment was close, you risk believing in a falsehood just because it approximates the truth.

  **Elena:** Approximate truth *is* what realism offers! We don't claim final, capital-T Truth. We claim that our theories latch onto real properties. The mass number $A$ is a real property. The charge $Z$ is a real property. The proton-electron model got those right. It got the mechanism wrong. I am willing to be agnostic about the mechanism of the past to be a realist about the mechanism of the present, provided the present mechanism survives the tests the past one failed. The neutron model explains the spin. The proton-electron model did not. That is progress toward truth, not just empirical adequacy.

  **Marcus:** And that is where we stall. You see the resolution of the spin paradox as evidence of convergence on truth. I see it as evidence that we only attribute "truth" to the theories that survive. If the neutron model had failed next year, you would have found a way to salvage *its* structural components too. The distinction between "core ontology" and "auxiliary hypothesis" is always made *after* the dust settles. In 1931, the nuclear electron was core. In 1933, it was a mistake. How do you formulate a rule for belief that doesn't rely on knowing the future?

  **Elena:** I don't need a rule that guarantees infallibility. I need a rule that explains why science is the only game in town for manipulating nature. If I treat the neutron as a mere instrument, why should I trust it to design a reactor? I trust it because I believe neutrons are *there*.

  **Marcus:** And I reply: You trust it because the instrumental reliability is robust, not because the ontology is fixed. You can build a reactor using the equations without knowing if the neutron is fundamental, composite, or a vibration in a string. The proton-electron model builders could have built a reactor too, had the engineering scaled, because the mass and charge numbers were correct. The ontology was irrelevant to the engineering success. That suggests the realism is superfluous.

  **Elena:** (Pauses, tapping the table) It wasn't irrelevant. If they had persisted with the electron model, they would have miscalculated the weak interaction rates eventually. The ontology constrains the future predictions. If you think the nucleus contains electrons, you predict different neutrino interactions than if you think it contains neutrons. The ontology drives the heuristics for new experiments.

  **Marcus:** Agreed. Ontology drives heuristics. But false ontologies can drive successful heuristics for a long time. The question remains: When you look at your Standard Model today, how do you know which parts are the "mass and charge numbers" that will survive, and which are the "nuclear electrons" that will be discarded? If you can't tell the difference now, the meta-induction stands.

  **Elena:** I can't know for certain. But I bet on the entities that resist falsification across multiple domains. The electron survived the transition. The proton survived. The neutron is holding up under scattering experiments that would have crushed the 1930 model. I'm not betting on infallibility, Marcus. I'm betting on stability.

  **Marcus:** And I'm suggesting that stability is a measure of utility, not truth. But... (he closes the reprint of Chadwick's paper) ...I will concede this: The nitrogen spin anomaly is a better example than the ether. It shows that even when the math is precise, the story we tell about what the math *is* can be completely wrong.

  **Elena:** And I concede that the story we tell today might look just as strange to a physicist in 2132. But I still believe they'll keep the neutron. Even if they find it's made of something else, they'll keep the neutron as a real, stable excitation of the field.

  **Marcus:** Then we remain at an impasse. You see a stable excitation; I see a useful node in the network of prediction.

  **Elena:** (Smiling) Just like the old days. We measure the cross-section, but we argue about the scattering center.

  **Marcus:** Precisely. Shall we get coffee? I find my epistemic warrant for caffeine is much more secure than my warrant for nuclear ontology.

  **Elena:** Now that is a realism I can support.
