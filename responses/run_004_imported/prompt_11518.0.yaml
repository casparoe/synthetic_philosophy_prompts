answer: |-
  This is an excellent objection. It is one of the most common and sharpest critiques of the Dutch Book Argument (DBA) when it is introduced in rationalist circles. You have correctly identified that real-world bookmakers *do* Dutch Book the public using the vig (vigorish), regardless of whether the public's beliefs are coherent.

  However, the philosophical force of the Dutch Book Argument relies on a specific distinction between **market unfairness** (the vig) and **internal inconsistency** (incoherence).

  Here is the breakdown of why the vig does not invalidate the Dutch Book Argument, and what specific work the bettor's incoherence is doing.

  ### 1. Who Sets the Prices?
  The crucial difference lies in whose probabilities are being used to price the bets.

  *   **The Real-World Vig:** The *bookmaker* sets the prices. They offer -110/-110. This implies a market probability of roughly 52.4% for both sides, summing to 104.8%. If you bet both sides, you lose 4.8% guaranteed. This is a loss due to **transaction costs** or **market power**.
  *   **The Philosophical Dutch Book:** The *bettor* sets the prices. The thought experiment posits that your "credences" are the prices at which you are willing to buy or sell a bet. If you claim your credence in Event $A$ is 0.6 and your credence in Not-$A$ is 0.6, you are effectively saying you are willing to pay \$0.60 for a ticket that pays \$1 if $A$, and \$0.60 for a ticket that pays \$1 if Not-$A$.

  If you are incoherent (summing to 1.2), a bookie can come to you and say, "I will let you bet at **your** odds." They sell you both tickets for \$1.20. No matter the outcome, you get \$1.00. You lose \$0.20.

  **The Work Incoherence Does:** In the vig scenario, you lose because the *house* is charging a fee. In the Dutch Book scenario, you lose because *you* valued the tickets incorrectly relative to each other. A coherent agent would never agree to pay \$1.20 for a guaranteed \$1.00 payout, even if the house offered it. An incoherent agent might, because their internal logic tells them the value is \$1.20.

  ### 2. Avoidability of the Sure Loss
  This is the most practical distinction.

  *   **Vig Loss is Avoidable by Abstention:** A coherent agent looks at -110/-110 lines. They calculate the Expected Value (EV). They realize that betting both sides has negative EV. Therefore, a coherent agent can **avoid** the sure loss simply by not betting on both sides. They can still lose money on individual bets if they are unlucky or if their probability estimates are inaccurate, but they will not accept a *guaranteed* loss.
  *   **Dutch Book Loss is Unavoidable by Strategy:** If your credences are incoherent, there is no betting strategy that protects you from a clever bookie offering fair odds (or odds based on your own beliefs). Your incoherence creates a vulnerability that exists independently of the market's margin.

  The DBA argues that rationality is about not shooting yourself in the foot. The vig is like walking through a field with landmines (market risks); coherence is a metal detector. It doesn't guarantee you won't get hurt (you might step on a mine anyway), but incoherence is like strapping explosives to your own chest. The DBA says: "Take off the explosives." It does not promise the field is safe.

  ### 3. "Fair Odds" vs. "Unfair Odds"
  The Dutch Book Argument is a **normative** argument about logic, not a **descriptive** argument about gambling profitability.

  The argument assumes a "fair betting" scenario to isolate the variable of logical consistency. It asks: *If we remove the house edge, does your belief system hold together?*

  *   **Coherent + Vig:** You face an external disadvantage. You might lose money, but your beliefs are not contradicting themselves.
  *   **Incoherent + Fair Odds:** You face an internal disadvantage. You will lose money even if the odds are perfectly fair (0% vig).

  If you argue that "the vig proves coherence doesn't guarantee profit," you are correct. But the DBA never claimed coherence guarantees profit. It claims coherence guarantees **immunity to logical exploitation.**

  ### 4. The Direction of Exploitation
  Your observation highlights that bookmakers Dutch Book *customers*. But the philosophical argument is about the *customer's* mind.

  Imagine two bettors, Alice (Coherent) and Bob (Incoherent).
  *   **Alice** knows $P(A) + P(\neg A) = 1$. She sees a -110/-110 line. She knows the implied probabilities sum to $>1$. She refuses to bet on both. She might bet on one side if she thinks she has an edge, but she never accepts a sure loss.
  *   **Bob** believes $P(A) = 0.7$ and $P(\neg A) = 0.7$. He sees the -110/-110 line (implied ~0.52 each). He thinks *both* bets are massive value (+EV). He bets on both.

  The vig exploits Bob *more* than it exploits Alice. In fact, the vig doesn't exploit Alice into a sure loss at all; it only exploits Bob into a sure loss because his incoherence blinds him to the arithmetic of the situation.

  ### 5. Why the Argument Persists in Rationalist Circles
  The reason the Dutch Book argument remains popular in rationalist communities (like LessWrong) is not because it teaches you how to beat the casino. It is used as a justification for **Bayesian Probability**.

  The argument is: "If you want your degrees of belief to function like a map of reality that guides action without guaranteeing self-sabotage, they *must* mathematically behave like probabilities."

  The existence of the vig is analogous to the existence of taxes.
  *   **Taxes:** The government guarantees a portion of your income regardless of how well you manage your finances.
  *   **Bankruptcy:** If you spend more than you earn, you go broke.

  The fact that taxes exist does not mean budgeting is useless. You can pay taxes and still be solvent (Coherent + Vig). You cannot spend incoherently and remain solvent (Incoherent + Fair Odds).

  ### Summary
  The vig shows that **coherence is not sufficient for profit.**
  The Dutch Book Argument shows that **coherence is necessary for consistency.**

  The "additional work" the bettor's incoherence does is that it allows a bookmaker to construct a losing portfolio for the bettor **even if the bookmaker offers zero-vig, fair odds.** The vig guarantees the house a profit from the *market structure*; incoherence guarantees the house a profit from the *bettor's mind*. The philosophical argument is concerned with fixing the mind, not the market.
