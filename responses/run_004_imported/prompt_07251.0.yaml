answer: |-
  Here are nine hiring-committee questions designed to probe the robustness of the candidate's position, each with a follow-up intended to prevent a retreat into the denial of separability.

  **1. The Action-Guidance Constraint**
  "If rationality is fundamentally action-guiding, how does your view guide the agent at the moment of payment ($t_2$)? If the act itself is irrational, does the agent act *against* rational guidance to fulfill the rational plan, or does the guidance somehow bypass the evaluation of the act?"
  *   **Follow-up:** "If you say the guidance applies only to the disposition, how do you explain the phenomenology of $t_2$? Does the agent feel they are doing something irrational, and if so, doesn't that create a fragmentation in agency that undermines the unity of the plan you rely on?"

  **2. Comparison with Gauthier and McClennen**
  "Both Gauthier's constrained maximization and McClennen's resolute choice solve dynamic inconsistency by arguing that the token act *itself* becomes rational if it flows from the right plan. You insist on retaining the label 'irrational' for the token act. What theoretical work does this negative label do that 'rational' does not, other than preserving a specific definition of act-evaluation?"
  *   **Follow-up:** "If the act is irrational, standard theory suggests the agent has most reason *not* to perform it. How can a normative theory prescribe an action while simultaneously judging that the agent lacks sufficient reason to perform it at the moment of choice?"

  **3. Imperfect Prediction**
  "Parfit's Hitchhiker often assumes perfect prediction. Suppose the driver is merely 90% reliable. At $t_2$, the expected utility of paying is strictly negative since the ride is already secured. Does your view still classify the payment as 'rationally irrational'?"
  *   **Follow-up:** "If yes, is there a probability threshold where the act flips from irrational to rational? If so, doesn't calculating that threshold require the very separable, node-by-node evaluation you claim is illegitimate?"

  **4. The Existence of Reasons**
  "You argue we cannot grade the act in isolation. However, at $t_2$, the reason for paying (securing the ride) has vanished. What reason *exists* at $t_2$ to motivate the payment, if not the consequences of that specific token action?"
  *   **Follow-up:** "If you claim the 'plan' is the reason, are you suggesting that intentions can generate normative reasons *ex nihilo* even when the facts on the ground no longer support them?"

  **5. Rational Regret**
  "Should the agent, upon paying the driver in town, feel rational regret? They have incurred a cost with no compensating benefit at that moment."
  *   **Follow-up:** "If you say no, isn't that functionally equivalent to calling the act rational? If you say yes, why should an agent cultivate a disposition that guarantees they will rationally regret their own actions?"

  **6. Transparency and Self-Knowledge**
  "To adopt this disposition, the agent must know they are the sort of person who pays. But if they know this, can't they calculate at $t_1$ that they will suffer a loss at $t_2$ with no gain, and thus refuse the ride initially?"
  *   **Follow-up:** "Does your view require a form of self-deception or opacity about one's own future choices to work, and if so, is that compatible with the ideal of rational transparency?"

  **7. The Toxin Puzzle Variant**
  "Consider Kavka's Toxin Puzzle, where you are rewarded for *intending* to drink, not for drinking. Your view seems to handle Hitchhiker well. But in Toxin, drinking secures nothing further and harms you. Is drinking the toxin 'rationally irrational' on your view?"
  *   **Follow-up:** "If you distinguish the cases, is it not because of the causal structure at the moment of choice? And if causal structure matters, haven't you reintroduced a form of separability regarding causal efficacy?"

  **8. The Source of Normative Force**
  "You deny separability to save the rationality of the plan. But what gives the plan normative authority over the temporal slice? Why is the 'whole life' perspective normatively dominant over the 'current moment' perspective?"
  *   **Follow-up:** "If the current moment bears the cost, why is it bound by a contract it did not sign and from which it no longer benefits? Is this a prudential or a moral obligation?"

  **9. Falsifiability and Counterexamples**
  "Finally, by your own lights, what would count as a genuine counterexample to your view? What structural feature would a case need to have to prove that 'rational irrationality' is impossible?"
  *   **Follow-up:** "Would a case where following the disposition leads to strictly worse outcomes than maximizing at every node falsify your view, or is your position insulated from outcome-based objections by the definition of rationality itself?"
