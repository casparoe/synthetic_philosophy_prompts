  *Argument:* It might be easier because in CS, a "clean" state *exists* theoretically. In perception, we don't know if a "clean" state exists (Brain in a Vat). So Thompson's problem is technically solvable (find the clean compiler), whereas the skeptical problem might be unsolvable. I will argue this makes the CS problem *conceptually* easier (there is a fact of the matter) but *operationally* harder (the adversary hides it).

  *(Self-Correction on Q2)*: Does epistemology have an equivalent to Hardware Root of Trust? Yes, "Properly Basic Beliefs" (Plantinga) or "Givenness" (Empiricists). But Cohen attacks these. I need to explain why Cohen thinks these fail (they allow bootstrapping).

