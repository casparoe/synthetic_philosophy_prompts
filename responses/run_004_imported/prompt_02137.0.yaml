          *   Address the Adversary: Thompson is about *integrity* (malice), Epistemology is about *reliability* (truth-tracking).
          *   Crucial point: The adversary makes the CS problem *worse* practically (active hiding) but the Epistemic problem *worse* theoretically (no "clean source" exists for perception).
      *   *Section 2 (Solutions):*
