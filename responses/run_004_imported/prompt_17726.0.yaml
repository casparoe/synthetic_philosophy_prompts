answer: |-
  This is a classic conflict between **signaling theory** (your view) and **selection bias** (your friend's view). Given your background, you'll recognize that both of you are looking at the same data through different utility functions.

  Your friend is arguing from the perspective of **fairness and false negatives** (the "Type II error" of missing a good match). You are arguing from the perspective of **information asymmetry and expected value** (filtering for intent in a low-trust environment).

  Here is the breakdown of why your heuristic is rational, where your friend is correct, and how to reconcile the two without discarding your filter.

  ### 1. The Rationalist Case for Effort: Costly Signaling
  Your intuition that effort is "informative" is grounded in **Zahavi's Handicap Principle**. For a signal to be reliable, it must be costly to fake.

  *   **Generic messages ("Hey") are low-cost.** They can be sent to 100 people in 10 minutes. The sender's investment is near zero. Therefore, the signal carries almost no information about their specific interest in *you*. It only signals interest in *the concept of dating*.
  *   **Personalized messages are high-cost.** They require reading your profile, synthesizing information, and drafting unique text. This cost is incurred *per recipient*.

  From a Bayesian perspective, receiving a personalized message updates your prior probability that "this person wants to date *me*" much more significantly than a generic message does. It distinguishes between **shotgun approaches** (maximizing volume) and **sniper approaches** (maximizing fit).

  In a market like dating apps, which suffers from severe **information asymmetry** (you don't know their intentions, stability, or sanity), "willingness to incur a cost" is one of the few honest signals available pre-meeting. It is not a perfect signal, but it is a *positive* signal.

  ### 2. Where Your Friend is Right: The Noise and The Tax
  Your friend (the med resident) is correct that effort is a **noisy proxy** for compatibility. It conflates three variables:
  1.  **Interest Level:** How much they like you.
  2.  **Opportunity Cost:** How valuable their time is (e.g., a CEO vs. a student).
  3.  **Verbal Fluency:** How easy it is for them to generate text.

  By filtering strictly for length or polish, you are inadvertently taxing people with high opportunity costs (busy professionals) and people with lower verbal fluency (who might be brilliant in person). This creates a **selection bias** toward people with abundant time and specific linguistic skills.

  Your friend calls this "irrational." In strict economic terms, it is only irrational if the **cost of the false negative** (missing out on the busy med resident) outweighs the **cost of processing false positives** (wasting time on low-interest generic messengers).

  ### 3. The Receiver's Optimization Problem
  Here is the crux of the disagreement: **You and your friend are optimizing for different things.**

  *   **Your Friend (Sender Side):** Wants the system to be fair to senders. He wants the "best" candidates to not be penalized for being busy.
  *   **You (Receiver Side):** Want to maximize the Expected Value (EV) of your limited attention.

  On dating apps, attention is the scarce resource, not messages. If you have 50 matches, you cannot have 50 deep conversations. You need a triage mechanism.
  *   If you reply to every "Hey," you spend 10 hours filtering out people who aren't actually interested in you.
  *   If you reply only to personalized messages, you spend 2 hours talking to people who have already demonstrated a baseline of interest.

  Your heuristic is an **efficiency filter**. It is rational because it minimizes the time spent on interactions with a low probability of conversion. It is not trying to find the *absolute best* partner in the global pool (which is impossible); it is trying to find a *good* partner without burning out.

  ### 4. Distinguishing "Effort" from "Attention"
  The solution lies in refining your definition of the signal. Your friend is attacking "effort" (word count, polish, time spent). You are defending "attention" (specificity).

  A med resident *can* send a high-signal message without it being long or polished.
  *   *Low Signal:* "Hey, sorry I'm busy, work is crazy." (Generic complaint)
  *   *High Signal:* "Hey, saw you like hiking. I'm on a 24h shift but would love to chat about trails when I'm off." (Specific reference + honest constraint)

  The rational update isn't "Long Message = Good." The update is "Evidence of Profile Consumption = Good."

  If you are filtering out messages solely because they are short, your friend is right: you are using a noisy heuristic. But if you are filtering out messages because they lack **evidence of profile consumption**, you are using a robust heuristic.

  ### 5. Conclusion: Is it Irrational?
  **No, your heuristic is not irrational.** It is a rational response to a high-volume, low-trust environment. You are using a costly signal to screen for intent.

  However, your friend has identified a **calibration error**.
  1.  **Don't optimize for polish.** A thoughtful three-sentence message is better than a generic three-paragraph essay.
  2.  **Acknowledge the False Negatives.** Accept that you *will* miss out on some busy, high-value people. That is the price of admission for protecting your time.
  3.  **Check for "Goodhart's Law".** Be wary of messages that *look* personalized but are clearly templates (e.g., "I see you like [City], I love [City] too!").

  **The Verdict:**
  Keep the filter, but refine the input. Do not measure **word count** (which favors the free-time crowd); measure **specificity** (which favors the attentive crowd).

  If a message references a specific photo, prompt, or detail, it passes the signal test regardless of length. If it is generic, it fails, regardless of how polite it is. This satisfies your need for evidence of interest while mitigating your friend's concern that you are merely selecting for "people with nothing else to do."

  Your friend is right that it's an imperfect proxy. But in a market flooded with low-effort spam, demanding a proof-of-work token (the personalized message) is the only rational way to manage your own scarcity.
