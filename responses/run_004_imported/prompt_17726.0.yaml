  3.  **Apply Rationalist Frameworks:**

      *   **Bayesian Evidence:** Does the message update the probability of a successful relationship? Yes, but by how much?
      *   **Signaling Theory (Zahavi's Handicap Principle):** A signal is reliable if it is costly. Time is costly. But is the cost uniform across all senders? No. A CEO's 5 minutes is worth more than a student's hour? Or is it the attention that matters?
      *   **Goodhart's Law:** "When a measure becomes a target, it becomes a bad measure." If people know effort gets replies, they will manufacture effort (copy-paste templates that *look* personalized).
      *   **Type I vs. Type II Errors:**
