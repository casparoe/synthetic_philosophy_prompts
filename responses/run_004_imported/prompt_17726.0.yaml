          *   *Type II (False Negative):* Ignoring a high-effort message that turns out to be a great match (the Med Resident scenario).
          *   Which error is more costly for the user? Dating apps usually have an abundance of options, so minimizing time wasted (Type I) is often the rational strategy for the *receiver*.

  4.  **Synthesize the Analysis:**

