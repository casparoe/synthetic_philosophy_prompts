      *   *The Synthesis (The "Honest Answer"):* Both theories suggest the jealousy is a category error. Lewis says "Wrong Subject." Kripke says "Wrong Object."
      *   *The Psychological Pivot:* Why does it feel real? Because the brain processes counterfactuals as simulations. The pain is about *loss of actuality*, not the existence of other worlds.
