      *   *Hobbes's Mechanism:* It's about *causality*. In geometry, I define the line, so I know the cause. In politics, I agree to the contract, so I know the cause of the sovereign's power.
      *   *Vico's Context:* Early 18th century (New Science, 1725). He's reacting against Cartesian rationalism.
      *   *Vico's Mechanism:* *Verum ipsum factum* (the true is the made). It's an ontological/epistemological claim about God vs. Man. God made nature, so only God knows nature fully. Man made history/civil society, so only man can know history fully.
      *   *Comparison:*
          *   *Similarity:* Both link knowledge to construction/agency.
          *   *Difference:* Hobbes is methodological/political. He wants *certainty* to justify authority. Vico is historical/cultural. He wants to validate the study of history/myth against the rising prestige of natural science.
          *   *Verdict:* Hobbes isn't just a "small Vico." Hobbes is using it to ground *obligation* and *sovereignty*. Vico is using it to ground *historical understanding*. Hobbes is prescriptive (how we *should* build the state to know it); Vico is descriptive/interpretive (we *did* build history, so we can study it).

  3.  **Deconstruct Question 2: Why not Physics/Nature? (The Materialist Paradox):**
      *   *Hobbes's Materialism:* Yes, everything is matter in motion.
      *   *The Problem:* We didn't make nature. God (or first causes) did.
      *   *Hobbes's Solution:* Physics is *conjectural*. We can see effects (motions), but we can't be certain of the causes because we didn't generate them.
      *   *Geometry/Politics:* We generate the causes. Therefore, *a priori* demonstration is possible.
      *   *Physics:* We must reason *a posteriori* (from effects back to possible causes). Multiple explanations might fit. Certainty is impossible.
      *   *Irony:* Hobbes wants politics to be as certain as geometry, not as uncertain as physics. This is crucial. He elevates politics above natural science in terms of epistemic status.

