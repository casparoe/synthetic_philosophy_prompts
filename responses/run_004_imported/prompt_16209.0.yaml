answer: |-
  This is a fantastic rabbit hole to be down. You've hit on one of the most fascinating intersections in the history of political philosophy and epistemology.

  Your friend is absolutely right to bring up Giambattista Vico and the *verum factum* principle ("the true is the made"). It is the most famous articulation of that idea. But to answer your main question: **Hobbes is not just a "narrow Vico."** While they share the intuition that construction grants knowledge, Hobbes's deployment of the idea is fundamentally different in *purpose* and *mechanism*.

  Here is the breakdown of why Hobbes's version is unique, and why he deliberately stopped short of applying it to physics.

  ### 1. Hobbes vs. Vico: Engineering vs. Archaeology

  The core difference lies in *what* they think we are making and *how* we know it.

  **Hobbes is an Engineer.**
  When Hobbes says we know the Commonwealth because we made it, he is talking about a **rational, intentional construction**. For Hobbes, the "making" of the state happens in a specific moment of reason: the Social Contract. We deduce, via logic, that to escape the State of Nature, we must authorize a Sovereign.
  *   **The Goal:** Certainty and Obedience. Hobbes wants political philosophy to be demonstrative like geometry so that political obligations become as undeniable as $2+2=4$. If I can prove the State is a logical artifact I constructed, I cannot rationally object to its authority.
  *   **The Knowledge:** It is *a priori*. I know the properties of the Leviathan because I defined them into existence.

  **Vico is an Archaeologist.**
  Vico, writing 70 years later in *The New Science*, agrees that we know history because we made it. But for Vico, humans did **not** rationally construct society via a contract. Society evolved organically through myths, religions, languages, and passions over centuries.
  *   **The Goal:** Interpretation and Understanding. Vico wants to validate the study of history and philology against the rising prestige of Cartesian physics. He's saying, "Descartes thinks only math is real knowledge, but we can know history even better because we made history."
  *   **The Knowledge:** It is *hermeneutic*. We understand the "civil world" because the human mind that created ancient laws and myths is the same mind studying them.

  **The Verdict:** Hobbes uses the "we made it" argument to **bind** us to the state (normative). Vico uses it to **free** us to study history (descriptive). Hobbes thinks we made the state *on purpose*; Vico thinks we made history *unintentionally* (through Providence guiding human passions). So, Hobbes isn't just a smaller-scale Vico; he's using the logic to solve a problem of *authority*, whereas Vico uses it to solve a problem of *methodology*.

  ### 2. The Physics Question: Why the Materialist Stopped Short

  This is the sharpest part of your observation. Hobbes is a hardcore materialist. He believes everything that exists is "body" (matter in motion). So why doesn't he say, "We are part of nature, therefore we can know nature"?

  He explicitly rejects this, and his reasoning reveals the ultimate priority of his philosophy: **Political Stability.**

  **The Epistemic Split**
  Hobbes divides science into two categories:
  1.  **Geometry & Civil Philosophy:** These deal with objects whose **causes** we generate. I draw the line; I sign the contract. Because I know the cause (my own will/hand), I can demonstrate the effects with 100% certainty.
  2.  **Physics (Natural Philosophy):** This deals with objects whose **effects** we see, but whose **causes** are external to us. We see the stars move, but we didn't push them. We see rain fall, but we didn't condense the clouds.

  For Hobbes, physics is **conjectural**. We can propose models of how nature works (matter in motion), but we can never be *certain* we are right, because multiple different causal chains could produce the same visible effect. We are on the outside of nature looking in.

  **The Political Motivation**
  Here is the cynical (or brilliant) twist: If Hobbes admitted we could have certain knowledge of Nature/Physics, it would undermine his political project.
  *   In the 17th century, "Natural Law" was often used by Royalists to argue for the Divine Right of Kings. They argued that hierarchy was written into the fabric of the universe (Nature).
  *   If Physics/Nature were a demonstrable science, then maybe the "Natural Hierarchy" is objectively true.
  *   By relegating Physics to the realm of *uncertainty* and elevating Civil Philosophy to the realm of *certainty*, Hobbes pulls the rug out from under the Royalists. He is effectively saying: *"You can't claim the King rules by Nature, because nobody truly knows Nature. The King rules by Art (the Contract), and we KNOW the Contract because we wrote it."*

  He sacrifices the knowability of the universe to secure the knowability of the State.

  ### 3. The Irony of the Circle-Squaring

  You mentioned his 20-year obsession with squaring the circle, which is crucial context. Hobbes was publicly humiliated by mathematicians like John Wallis, who proved Hobbes's geometric proofs were wrong.

  Why did Hobbes refuse to concede? Because for Hobbes, **Geometry wasn't about the shapes; it was about the Power.**

  He believed that if he could just get the method of geometry right, it would unlock the method for controlling human passion. His inability to actually *do* advanced math didn't matter to him as much as his belief in the *status* of mathematical reasoning. He loved geometry not because he was good at it, but because it was the only place in human life where disagreement was impossible. He wanted politics to be that same zone of zero disagreement.

  ### Summary

  To answer your specific questions:

  1.  **How special is Hobbes's version?** It is distinct from Vico because it is **prescriptive** rather than interpretive. Hobbes argues we can know the State because we *rationally designed* it to end conflict. Vico argues we can know History because we *unconsciously created* it through culture. Hobbes is building a machine; Vico is studying a garden.
  2.  **Why not physics?** Because Hobbes prioritizes **Civil Certainty** over **Natural Truth**. He needs the State to be the one thing in the universe we can be absolutely sure about. If we admit we can't fully know Nature (because we didn't make it), we are forced to rely on the one thing we *did* make: the Commonwealth.

  Hobbes is essentially arguing that **Truth is a human artifact.** We don't find truth in the stars; we build it in the courtroom and the classroom. It's a wildly modern, almost postmodern idea coming from a guy in a ruff collar in 1651.
