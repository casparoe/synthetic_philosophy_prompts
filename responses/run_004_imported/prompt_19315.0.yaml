answer: |-
  Here are 10 interview questions designed to move past the textbook definition of the "all-affected interests" principle and press your guest on its logical and practical limits.

  I have structured this as a flow for the episode. The three mandatory topics (Circularity, Over-inclusiveness, and Coercion) are included with their specific follow-up probes as requested.

  **1. The Stakes of the Boundary**
  "Most people take the *demos* for granted—we assume the citizens of France vote for France, etc. But you argue the boundary itself is the fundamental democratic problem. If we get this wrong, does it render the actual voting meaningless? In other words, is a perfectly run election illegitimate if the wrong people are in the room to cast the ballots?"

  **2. The Circularity Problem (Mandatory Topic)**
  "Let's go to the classic logical objection. To know who is 'affected' by a decision, don't we first need to know what the decision *is*? But we need the voters to make the decision. It seems like a chicken-and-egg problem: you need the outcome to define the electorate, but you need the electorate to produce the outcome. How do you escape that loop?"

  *   **Follow-up (if he says 'we judge by foreseeable effects'):** "But 'foreseeability' is subjective. If the current, exclusionary group decides what counts as 'foreseeable,' doesn't that just allow the status quo boundary to cement itself? Aren't you smuggling the old boundary back in through the back door?"

  **3. The Globalization/Over-inclusiveness Problem (Mandatory Topic)**
  "In a globalized economy, almost every local decision has ripple effects. A town zoning law affects housing supply, which affects migration, which affects carbon emissions. If we take 'affected interests' seriously, doesn't the principle blow up into 'everyone votes on everything'? Do you actually bite that bullet and argue for a global demos, or is there a cutoff?"

  *   **Follow-up (if he says 'we only count significant interests'):** "Who gets to draw the line on what counts as 'significant'? If a foreign worker's livelihood depends on a local zoning law, isn't their interest significant to them? Doesn't adding a 'significance' threshold just reintroduce the arbitrary boundary you were trying to solve?"

  **4. Affected vs. Coerced (Mandatory Topic)**
  "There's a rival theory called the 'all-subjected' or 'coercion' principle. It says I should vote only if I'm forced to obey the law, not just if I'm impacted. For example, I'm *affected* by my neighbor's divorce, but I don't get to vote on it. Why is 'affected interest' the right standard rather than 'coercion'? Doesn't your standard risk democratizing private life?"

  *   **Follow-up (if he says 'state power is different from social influence'):** "But in modern politics, a lot of power is soft power or economic leverage, not just men with guns. If you include those effects to make your theory work, don't you blur the line between public policy and private social influence so much that the concept of a 'decision' loses meaning?"

  **5. Future Generations**
  "One of the most compelling applications of your view is climate change. Future people are massively affected by our current decisions but have zero say. Does the all-affected principle require us to reserve seats for the unborn? And if so, how do we represent interests that don't exist yet without just projecting our own preferences onto them?"

  **6. The "Fluid Demos" Implementation**
  "Practically speaking, does this mean we need to redraw the voter rolls for every single issue? If we're voting on a highway, commuters vote. If we're voting on abortion, maybe only women vote? Is a fixed citizenship status fundamentally incompatible with the all-affected principle, or can we make them coexist?"

  **7. The Problem of Intensity**
  "Your principle counts *who* gets a say, but it doesn't measure *how much* they care. In a referendum, the person who is mildly annoyed gets one vote, and the person whose life is ruined gets one vote. Does the all-affected principle need to be paired with some kind of weighted voting or supermajority requirement to actually protect intense interests?"

  **8. The Status Quo Bias**
  "Critics argue that because changing boundaries is so hard, the all-affected principle ends up being purely theoretical—it's a measuring stick for legitimacy, not a tool for change. If you can't practically expand the demos to match the affected interests, is there a danger this theory just becomes a way for philosophers to feel superior to existing states without changing anything?"

  **9. The Exit Option**
  "If someone finds themselves constantly on the losing end of decisions in a demos where they are affected but outnumbered, does your theory give them a right to exit? If 'affectedness' grants me entry, does a lack of influence grant me an exit visa? Or am I stuck in the system as long as I'm impacted?"

  **10. The Cost of Exclusion**
  "Let's end on the normative cost. If we stick with the current system—citizenship-based boundaries—and ignore the all-affected principle, what is the specific harm we are perpetrating? Is it that we are violating rights, or is it something broader, like we are essentially governing people without authority?"
