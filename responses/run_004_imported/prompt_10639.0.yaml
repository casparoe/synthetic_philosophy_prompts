answer: |-
  **Setting:** *Alex's kitchen, 11:30 PM. A prescription bottle of hydrocodone sits next to a laptop displaying United Airlines itineraries. There is a notebook covered in subtraction problems. Alex is leaning over the counter, pen hovering. Jordan is leaning against the fridge, arms crossed.*

  **Alex:** (Tapping the notebook) One hour and forty-five minutes. Denver to Seattle is two hours behind, but the layover is local time. I've done the subtraction three times. It's enough time. Mom makes the flight.

  **Jordan:** Alex, put the pen down. You took two pills at eight o'clock. You are currently chemically compromised.

  **Alex:** I know what I took. But I also know arithmetic. The numbers don't care about my opioid receptors. 10:15 arrival, 11:50 departure. That's ninety-five minutes. Even if I'm foggy, the math is the math.

  **Jordan:** That's the trap. That's exactly the feeling the drugs give you. A false sense of clarity. Look, I'm not saying the math is wrong. I'm saying *you* are in no position to know whether it's right. You have higher-order evidence that your first-order reasoning is unreliable. In this state, believing you're right is epistemic akrasia. It's irrational to believe *P* while believing you shouldn't believe *P*.

  **Alex:** But I don't believe I shouldn't believe it. I believe the drugs *usually* cause errors. I grant you that. But in this specific instance, my derivation is clean. I can hold the belief that the layover is sufficient, and simultaneously acknowledge that you have good reason to think I shouldn't hold it. That's level-splitting. It's not incoherent; it's just acknowledging that higher-order evidence can be misleading.

  **Jordan:** Misleading or not, you can't use your compromised reasoning to dismiss the evidence of your compromise. That's bootstrapping. If you're allowed to say, "My reasoning tells me I'm fine, so I'll ignore the evidence that my reasoning is broken," you've made yourself immune to any criticism of your faculties. You could be drunk, sleep-deprived, or brain-damaged, and as long as the internal view looks clear, you're rational to ignore the outside view.

  **Alex:** I'm not ignoring it. I'm weighing it. The higher-order evidence is statistical: "People on hydrocodone make math errors." The first-order evidence is specific: "This derivation checks out." Why does the general statistic automatically veto the specific proof? If I actually got the right answer, and I lowered my confidence just because of the pill bottle, I would be throwing away knowledge. I'd be less accurate than if I just trusted the math.

  **Jordan:** But rationality isn't just about being accurate; it's about being responsible with your evidence. Your total evidence includes the pill bottle. If you incorporate the fact that you're impaired into your calculation, your confidence *must* drop. That's the Enkratic principle. You can't rationally be in a state where you think, "I believe Mom makes the flight, but I shouldn't believe that." If you admit the "shouldn't," you have to drop the belief.

  **Alex:** Why? Why is that state forbidden? Sometimes the world is messy. Sometimes I am impaired, but I also get lucky and think clearly. If I force myself to suspend judgment every time there's a hint of unreliability, I become a skeptic about my own mind. You're asking me to treat misleading testimony about my own reliability as a defeater. But if the testimony is misleading, it shouldn't defeat anything.

  **Jordan:** You can't know it's misleading from the inside! That's the point Christensen makes. The "feel" of clarity is exactly what goes offline when cognitive faculties degrade. If you require the impairment to *feel* like impairment before you lower confidence, you've built a system that never works. You're saying, "I'll only doubt myself when I'm sure I'm wrong."

  **Alex:** No, I'm saying I have access to the reasoning process. I can see the steps. 10:15 plus 95 minutes is 11:50. I see the carry-over on the minutes. I see the time zone adjustment. The higher-order evidence says, "You might have missed a step." My response is, "I checked three times." You're saying that checking three times doesn't count because the checker is drugged. But if the checker is drugged *and* correct, why punish the truth?

  **Jordan:** Because you don't know it's correct! You're conflating *being* right with *knowing* you're right. The conciliationist view isn't about truth; it's about rationality. Rationality requires you to respond to the evidence that you might be wrong. If you ignore that, you're not being rational, even if you happen to land on the truth. You're just lucky. And regarding bootstrapping: if your view allows you to keep full confidence whenever the first-order evidence *seems* strong, you've severed the link between your self-assessment and reality. You could dismiss a doctor's note saying you're delirious just because the delirium feels coherent.

  **Alex:** Okay, let's take that. The doctor's note. Suppose the doctor says, "This medication causes hallucinations." But I look at the clock, and I see it's 11:30. I check my watch, it's 11:30. I check my phone, it's 11:30. The higher-order evidence says "You might be hallucinating the clock." The first-order evidence says "Three independent devices say 11:30." If I suspend belief about the time, I lose knowledge I actually have. The higher-order evidence is misleading. Why should I be rationally required to abandon a true belief supported by evidence just because a general rule suggests I might be wrong?

  **Jordan:** Because in that scenario, you can't distinguish between the "real" clocks and the "hallucinated" confirmation. The fact that they cohere doesn't help, because the impairment affects the coherence-checking mechanism too. That's why the level-splitting view is dangerous. It lets you say, "The evidence looks consistent, so I'm fine," which is exactly what a broken consistency-checker would say. To answer your charge: Yes, you might throw away some knowledge. You might lower confidence in a true belief. But that's the tax you pay for having evidence that your faculties are compromised. It's better to be rationally cautious and occasionally miss a truth than to be rationally reckless and claim certainty when you have no warrant for it.

  **Alex:** But "warrant" is the thing in dispute. I have a warrant. It's the math. You're saying the warrant is voided by the pill. I'm saying the warrant stands unless the math is actually wrong. You're making rationality too internalist. If the process *actually* worked, why does the *probability* of it failing matter more than the *fact* of it succeeding?

  **Jordan:** Because you don't have access to the fact of it succeeding! You only have access to the seeming. And the pill attacks the link between seeming and succeeding. Look, I get the intuition. It feels like I'm asking you to betray your own eyes. But I'm asking you to respect the structure of evidence. Your total evidence is: (1) The math looks right, and (2) People on hydrocodone are bad at math. If you let (1) completely swamp (2), you're treating (1) as infallible. And nothing is infallible.

  **Alex:** I'm not treating it as infallible. I'm treating it as weighty. I'm saying the specific weight of this derivation outweighs the general weight of the side-effect profile.

  **Jordan:** But you're using the derivation to weigh the derivation! That's the bootstrapping. You're using the output of the machine to verify the machine's reliability, while ignoring the warning label on the machine.

  **Alex:** I'm not verifying the machine. I'm verifying the output. There's a difference. If I check the output three times and it's consistent, that's data. The warning label is also data. I'm combining them. You're saying the warning label acts as a veto. I'm saying it acts as a discount factor. Maybe I should be 80% sure instead of 100%. But why does it have to drop to 50%? Why does acknowledging the risk require suspending the belief entirely?

  **Jordan:** Because if you stay at 80%, you're still acting on it. You're still telling your mom to book the connection. If you acknowledge a significant risk that your calculation is garbage, acting on it is reckless. The akrasia isn't just believing; it's the confidence level. If you truly believe "I might be impaired," you can't simultaneously hold "I am 80% sure this is right." The impairment hypothesis undermines the justification for the 80%.

  **Alex:** So what's the alternative? I call the airline and ask them? I can't know. I have to make a call. If I follow your view, I'm paralyzed. I have to assume I'm wrong every time there's a possibility of error.

  **Jordan:** No, you assume you're wrong enough to seek verification. You ask me to check the math. You ask your sister. You don't trust the drugged guy. That's the rational response to higher-order evidence. You defer.

  **Alex:** (Gesturing to the empty kitchen) It's midnight, Jordan. There is no one else. It's just me and the notebook. In the absence of a second opinion, do I really have to lobotomize my own conclusion?

  **Jordan:** Yes. You have to acknowledge that without a second opinion, you don't *have* a conclusion you can trust. You have a seeming.

  **Alex:** That seems... deeply alienating. It suggests I can never trust myself when stakes are high and I'm tired.

  **Jordan:** It suggests you should be humble about your faculties. That's not alienation; that's epistemology.

  **Alex:** (Looks back at the notebook, pen hovering over the final sum.) Or it suggests that sometimes, the view from the inside is the only view there is. And if it looks clear, I have to walk through it.

  **Jordan:** And if you fall through the floor?

  **Alex:** Then I was wrong. But at least I was rational enough to trust my own eyes.

  **Jordan:** (Sighs, pushing off the fridge.) We're not going to agree on this. But please, for the love of god, don't book the ticket yet.

  **Alex:** (Caps the pen.) I'm not booking it. I'm just writing down the answer.

  **Jordan:** Writing it down implies you think it's the answer.

  **Alex:** I think it's the answer I have. Whether I'm *justified* in thinking it's the Answer... maybe that's where you're right. But I'm still keeping the belief.

  **Jordan:** Then you're living in a state of akrasia.

  **Alex:** Maybe. Or maybe rationality is just messier than you want it to be.

  *Alex closes the notebook. The prescription bottle rattles slightly as he moves his elbow. Neither of them moves to pick up the phone.*
