  *(Self-Correction Note)*: I need to make sure Alex (Level-Splitter) doesn't sound like he's denying the drug effect. He needs to sound like Lasonen-Aarnio: "I acknowledge the drug creates a risk, but my specific derivation is robust." Jordan needs to sound like Christensen: "The risk itself mandates suspension."

