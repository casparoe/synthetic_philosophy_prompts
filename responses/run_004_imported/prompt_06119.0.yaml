prompt: |-
  So a bit of background on why I'm asking: at work we've got two teams (call them Infra and ML) sharing one GPU cluster, and every quarter there's a whole negotiation about how the shared capacity gets split. Someone mentioned that some scheduling/rate-limiting setups use something called the "Nash bargaining solution" for this kind of thing (apparently "proportional fairness" in networking is secretly the same rule), which sent me down a rabbit hole this week. I found out there's a rival solution called the Kalai-Smorodinsky solution, and I got a lot more interested in the philosophy-of-fairness side of it than the engineering side. I wrote up some notes below to check my own understanding before I embarass myself citing this in a team meeting, and I'd love your comments — specifically whether I've got the axioms right, whether my toy example actually shows what I think it shows, and whether my closing "so what" is reasonable or a stretch.

  Notes: the setup is two parties, a disagreement point d (what you get if talks collapse — I used d = (0,0)), a feasible set S of jointly reachable payoffs, and an "ideal point" I, the best each party could get out of S taken separately. Nash's 1950 solution picks whichever point on the boundary of S maximizes the product of the two parties' gains over d, and it's the unique rule satisfying Pareto efficiency, symmetry, scale invariance, and Independence of Irrelevant Alternatives (IIA — deleting deals nobody picked shouldn't change the outcome). Kalai and Smorodinsky's 1975 complaint was that IIA lets something weird happen: you can expand S in a way that only ever helps party B (B's own max goes up, A's options are untouched) and Nash's rule can still respond by cutting B's payoff. So they swap IIA for a monotonicity axiom instead, and that plus the other three axioms pins down a totally different point: wherever the segment from d to I crosses the boundary of S. To check I actually understood this, I built a toy version of our GPU fight: say Infra's solo-max is worth 5 "units" and ML's is worth 4, but the tradeoff curve between them kinks because of contention overhead, so the Pareto frontier is the two segments from (0,4) to (2,3) and from (2,3) to (5,0), with a disagreement point of (0,0). Grinding through the optimization, Nash's rule lands exactly on (2.5, 2.5) — dead even, despite the 5-vs-4 asymmetry — while Kalai-Smorodinsky lands around (2.78, 2.22), the point where both sides get the same fraction of their own ceiling (5/9, about 55.6% each). Did I actually do that maximization right?

  If so, the thing that struck me is that Nash's rule is a product-maximization dressed up in fancy axioms but here it's smuggling in an equal-outcomes answer, wheras Kalai-Smorodinsky is smuggling in an "equal proportional achievement of your own ceiling" answer — like the axioms are really just each side arguing for which smuggled intuition is more defensible. I also went down a side-tunnel where I think I read that a philosopher named Gauthier built part of a whole theory of justice around something he called "minimax relative concession" that's supposedly the same rule as Kalai-Smorodinsky, and that an economist named Raiffa had proposed the identical split decades earlier as an arbitration scheme, before anyone had the axioms to justify it. Is that history roughly right, or have I mashed together three things that don't actually connect? Happy to have any and all of this picked apart — I'd rather find the mistake now than in front of my team.
