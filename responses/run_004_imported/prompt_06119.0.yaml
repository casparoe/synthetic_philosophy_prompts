      *   **Kalai-Smorodinsky (1975):** Pareto Efficiency, Symmetry, Scale Invariance, *Individual Monotonicity*. *User's description:* "swap IIA for a monotonicity axiom." -> **Correct.** (Specifically, Individual Monotonicity: if the feasible set expands in a way that only benefits one player's maximum potential without hurting the other's, that player shouldn't get less).
