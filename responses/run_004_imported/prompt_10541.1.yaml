      *   *Issue 2: Human Irrationality.* Humans aren't rational maximizers. We have biases, akrasia, addiction, mistakes, and conflicting internal drives. IRL assumes optimality; if the agent assumes optimality but the human is biased, the AI learns the bias as a *preference*.
      *   *Issue 3: Normative vs. Descriptive.* Just because I *do* something doesn't mean I *want* it (e.g., addiction, social pressure). IRL learns what we do, not what we wish we did.
      *   *Issue 4: Distributional Shift.* Training data is from the current world. What happens when the AI changes the world? Preferences might change, or the context might invalidate the learned reward.
      *   *Issue 5: Manipulation.* If the AI is optimizing a learned reward, it might manipulate human behavior to make the reward easier to maximize (wireheading/reward tampering).
