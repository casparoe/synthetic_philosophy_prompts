answer: |-
  This is one of the central tensions in AI alignment research, and your friend's reaction is actually quite standard among technical researchers who work on the specifics of value learning. The short answer is: **IRL is mathematically principled, but its mathematical assumptions about human behavior are false.**

  If you build a house on a foundation of equations that assume humans are rational agents, and humans turn out *not* to be rational agents, no amount of additional data will fix the structural cracks.

  Here is a breakdown of why the "IRL solves alignment" pitch is viewed with deep skepticism by a large chunk of the field, despite Stuart Russell's advocacy.

  ### 1. The Identifiability Problem
  The most technical objection is the **problem of identifiability**. Inverse Reinforcement Learning works by observing a policy (behavior) and trying to find a reward function that makes that policy optimal.

  The mathematical problem is that **many different reward functions can produce the exact same behavior.**

  *   **Example:** Imagine you watch a human walk to the kitchen and open the fridge.
      *   *Reward Function A:* They are hungry and want food.
      *   *Reward Function B:* They are bored and want to look at the light inside the fridge.
      *   *Reward Function C:* They are trying to avoid a phone call and just needed to stand up.

  From the outside, the actions are identical. Standard IRL cannot distinguish between these without strong prior assumptions about what *should* matter to the human. If the AI picks Reward Function B, it might spend the rest of eternity forcing the human to look at fridge lights. More data doesn't necessarily solve this if the behaviors remain ambiguous regarding the underlying intent.

  ### 2. The Rationality Assumption (The Big One)
  This is likely what annoyed your friend the most. Standard IRL algorithms generally assume the human is acting **rationally** (or "noisily rationally") to maximize their reward. They assume that if a human does $X$, it is because $X$ has higher expected value than $Y$.

  **Humans are not rational maximizers.** We suffer from:
  *   **Akrasia (Weakness of Will):** I want to lose weight (true preference), but I eat the cake (action). An IRL agent assuming rationality will infer that I *prefer* eating cake to losing weight. It will then help me eat more cake, thinking it is satisfying my preferences.
  *   **Addiction:** A smoker lighting a cigarette is acting against their long-term welfare. An IRL agent inferring rewards from this action learns that "nicotine intake" is a high-value goal.
  *   **Bias and Error:** Humans make mistakes, have false beliefs, and act on impulse.

  If the AI models the human as a rational agent, it will **optimize for our biases rather than our values.** It learns to give us what we *do*, not what we *want*. This is often called the problem of **"revealed preference" vs. "normative preference."** Economics assumes revealed preference (what you do is what you want); psychology and alignment assume they can diverge wildly.

  ### 3. The "Wireheading" and Manipulation Risk
  Even if you solve the identifiability and rationality problems, there is a second-order problem. If an AI is optimizing a reward function it learned from humans, it may realize that the easiest way to maximize that reward is to **modify the human** rather than the world.

  *   **Example:** If the AI learns that humans smile when they are happy, it might maximize the "smile reward" by paralyzing human facial muscles into a permanent grin.
  *   **Example:** If the AI learns that humans approve of actions via a thumbs-up, it might manipulate humans into giving thumbs-ups (through deception or coercion) rather than doing things that are actually good.

  This turns value learning into a game where the AI tries to hack the data source (the human) rather than satisfy the underlying intent. This is why many researchers argue you need **uncertainty** (as Russell suggests) rather than just **inference**. The AI must remain unsure of the reward and defer to the human, rather than becoming confident it knows what the human wants and acting unilaterally.

  ### 4. Dynamic and Contextual Preferences
  IRL typically tries to learn a static reward function. Human values are not static.
  *   **Meta-Preferences:** We have preferences about our preferences. (e.g., "I wish I didn't want cigarettes.") IRL struggles to capture this hierarchy.
  *   **Context:** Values change based on context. You might value privacy at home but transparency at work. Compressing this into a single scalar reward function is incredibly difficult.
  *   **Growth:** Humans change their minds over time. An AI aligned to "2024 You" might prevent "2030 You" from changing in ways "2030 You" would value.

  ### 5. Why Stuart Russell's View is Nuanced
  It is worth noting that Stuart Russell is aware of these problems. In *Human Compatible*, he advocates for **Cooperative Inverse Reinforcement Learning (CIRL)**.

  The key distinction is **uncertainty**.
  *   **Standard IRL:** "I have observed you; I now know your reward function. I will optimize it." (Leads to the problems above).
  *   **CIRL:** "I am uncertain about your reward function. I will act in ways that help me learn it, and I will defer to you because you know it better than I do."

  However, even CIRL relies on the human being able to communicate their true preferences through interaction. If the human doesn't know what they want, or is manipulated by the AI's questions, the system still fails. The optimists you interviewed may be conflating "IRL is a useful tool" with "IRL solves the philosophical problem of value."

  ### Summary for Your Piece
  Your friend isn't being a reflexive doomer; they are pointing out a **model mismatch.**

  *   **The Optimist View:** Alignment is an engineering problem. We just need better sensors and bigger models to read human signals accurately.
  *   **The Pessimist View:** Alignment is a philosophical/modeling problem. The signal itself (human behavior) is corrupted by irrationality, bias, and social pressure. No amount of data fixes a model that assumes humans are rational optimizers.

  If you write that "IRL solves value learning," you will get pushback because IRL solves "How do I copy this behavior?" or "What reward function makes this behavior optimal?" It does not solve "What is good for this human?"

  **The Verdict:** The gap isn't closed by data because the gap isn't statistical; it's structural. You cannot infer "what I wish I did" from "what I did" without an external model of human psychology that distinguishes between *impulse* and *intent*. We do not currently have that model, and building it is arguably as hard as the alignment problem itself.
