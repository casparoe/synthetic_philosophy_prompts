      *   *Method:* Observe actions $\rightarrow$ Infer reward function.
      *   *Assumption:* Humans are (noisy) rational agents.
      *   *Outcome:* AI learns true human preferences.
      *   *Proponents:* Stuart Russell (Cooperative IRL), some early IRL papers (Ng & Russell).

  3.  **Deconstruct the Pessimistic/Critical View (Why IRL fails for Alignment):**
