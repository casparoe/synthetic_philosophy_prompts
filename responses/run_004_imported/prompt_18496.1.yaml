      *   **Frankish's Defense:** Distinguishes between *phenomenal properties* (intrinsic, non-physical feels) and *quasi-phenomenal properties* (functional/representational properties that *seem* phenomenal). The brain represents states as having phenomenal properties, but they only have functional properties.
      *   **The Crux:** Can a non-phenomenal state *seem* phenomenal without there being a phenomenal "seeming"?

  3.  **Drafting the Argument (The "Strongest Version"):**
