      *   *Conclusion:* Illusionism denies the existence of illusions about phenomenality.
      *   *Addressing "Quasi-Phenomenal":* This is the tricky part. Frankish says the state has functional properties $F$ but represents itself as having phenomenal properties $P$. The objection is: The *representation* itself must have some "feel" to be a representation *to the subject*. If the representation is "dark" (no feel), how does the subject know they are being represented to? If it has a "feel," illusionism is false.

