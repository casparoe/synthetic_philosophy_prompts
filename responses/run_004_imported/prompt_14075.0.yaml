          *   The feedback loop.
          *   In Newcomb, the state of the world is independent of your *current* causal leverage.
          *   In Damascus, the state of the world (Death's location) is locked to your decision *process*.
          *   The "Deliberational Instability." As soon as you lean one way, the reason to lean that way vanishes.
