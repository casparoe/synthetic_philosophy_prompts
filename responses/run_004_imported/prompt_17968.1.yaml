  "if you think that 'fix' has holes of its own, let the story show that rather than wrapping up too neat." -> The ending should question if the sensory input is just another symbol.

  *Plan:*
  1. Kaspar exists in the Lexicon.
  2. Kaspar knows "Heat" only as definitions.
