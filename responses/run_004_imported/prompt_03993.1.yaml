answer: |-
  Renata kept her hand locked on the winch lever, the metal cold enough to burn. "Put the coin away, Yannick. A lottery tells the six their claims vanish just because they share a hold."

  "Their claims don't vanish, they just don't aggregate." Yannick didn't look up from the coin in his palm. "To him, dying alone carries the same absolute weight as dying with five others."

  "I'm not summing loss. I'm comparing complaints. His is strong, but no stronger than any single one of theirs."

  "So you save the group because there are more complaints?" Yannick snapped the coin shut. "That's not ethics, Renata, that's damage control."

  "Then test your fairness. Would you still flip if the hold held six thousand?"

  "I would. Because to the engineer, six thousand deaths aren't six thousand times worse than one."

  "Then your integrity requires you to let six thousand die just to keep your hands clean."

  "And your justification requires you to kill him just to keep your ledger balanced."
