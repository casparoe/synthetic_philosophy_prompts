answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers, MAYA (Pragmatic Encroachment Theorist) and LEO (Epistemic Contextualist), are finishing their second round of coffee. The air is thick with the residue of a long debate.*

  **Maya:** Look, I think we're talking past each other. My point is simple: If I'm about to lose my house because I deposited a check late, and I don't check the bank hours again, I'm being irrational. If knowledge is supposed to be the norm of action, then in that high-stakes moment, I *don't know* the bank is open. My evidence didn't change, but my knowledge did.

  **Leo:** I agree you're being irrational if you don't check. I agree the *stakes* changed. I just disagree that the word "know" is the thing that broke. Think about the word "flat." If I'm setting a table, the surface is flat. If I'm grinding a lens for a telescope, that same surface isn't flat. Did the table change? No. The standard for applying the word "flat" changed. "Knows" works the same way.

  **Maya:** But "flat" is a gradable adjective. It describes a physical property relative to a purpose. Knowledge is supposed to be a relation between a mind and the truth. If my mental state is identical in the low-stakes and high-stakes scenario—if I believe the bank is open, it is open, and I have the same evidence—how can you say the relation holds in one case and not the other? It feels like you're saying knowledge is just a linguistic game.

  **Leo:** It's not a game; it's semantics. Contextualism isn't saying your *psychology* changes. It's saying that when you say "I know," you're expressing a different proposition depending on the context. In low stakes, "I know" means "I have evidence sufficient for casual planning." In high stakes, "I know" means "I have evidence sufficient for life-altering decisions." You're saying the *fact* of knowledge changes. I'm saying the *meaning* of the claim changes.

  **Maya:** Okay, but why does that distinction matter? If I tell my friend, "I know the bus comes at 8:15," and she misses her interview because she relied on me, she won't care about your semantic distinction. She'll say, "You didn't know!" If the practical utility of the label vanishes when stakes rise, isn't that functionally the same as the knowledge vanishing?

  **Leo:** Here's where I think you're conflating *knowledge* with *certainty* or *warranted assertibility*. You're arguing for Pragmatic Encroachment because you want knowledge to be action-guiding. I get that. But if you make knowledge dependent on stakes, you make truth dependent on how much money you have in the bank. That's dangerous. Two people with the exact same evidence looking at the same bus schedule—one rich, one poor—would have different *facts* about what they know? That makes knowledge subjective.

  **Maya:** It doesn't make it subjective; it makes it *subject-sensitive*. Invariantism says the standards for knowledge are fixed everywhere. Contextualism says the standards shift based on the conversational context. I'm saying the standards shift based on the *subject's* context. And yes, the rich person and the poor person might differ in knowledge if the stakes differ for them. That's not a bug; it's a feature. Knowledge is a tool for navigation. If the terrain gets rocky, you need a better map. Having the same map doesn't mean you "know" the path if the penalty for getting lost is death.

  **Leo:** But consider the disagreement test. Suppose Low-Stakes Sarah says, "I know the bank is open." High-Stakes Hannah says, "No, you don't know that." Who is right?
  If I'm a Contextualist, I say they can *both* be right. Sarah is speaking in a low-standards context; Hannah is speaking in a high-standards context. They aren't contradicting each other.
  If you're an Encroachment theorist, you have to say one of them is wrong. Probably Sarah is wrong because she's underestimating the stakes? Or Hannah is right and Sarah never knew?

  **Maya:** I'd say Sarah *did* know, relative to her stakes. But if Hannah enters the picture and raises the stakes for the group—say, they are now acting together—then Sarah loses the knowledge. Knowledge is dynamic. But look, Leo, isn't your view just a fancy way of admitting I'm right? You admit that in high stakes, it becomes *false* to say "I know." I just say that's because the knowledge is gone. You say it's because the sentence means something stricter. What is the actual difference in the world?

  **Leo:** *Pauses, stirring his coffee.* That's the million-dollar question. Is this a verbal dispute?
  Here's the difference: On your view, if I'm in a high-stakes situation, I literally lack a cognitive achievement that I possessed five minutes ago. My mind is in a worse epistemic position without any new evidence.
  On my view, my epistemic position is stable. What changed is the conversational score.
  The reason this matters is for skepticism. A skeptic raises the stakes to infinity. "Can you know you're not a brain in a vat?" If you're right, the skeptic actually *destroys* your knowledge by asking the question. If I'm right, the skeptic just changes the subject to a stricter definition of "know" that we rarely use in daily life.

  **Maya:** I see. You want to protect knowledge from the skeptic by saying they're cheating with definitions. I want to protect the link between knowledge and rational action.
  But let me push you on this: If "knows" is context-sensitive, why does it feel so different from "tall"? When I say "I know," it feels like I'm reporting an internal state. When you say "The context shifted the truth conditions," it sounds like you're saying I was speaking loosely. But in the high-stakes moment, I feel a genuine loss of confidence. Not just linguistic caution.

  **Leo:** That loss of confidence is the key. You're interpreting that feeling as the disappearance of knowledge. I interpret it as the recognition that the cost of error has outpaced the strength of your evidence.
  Think about it this way: Do you think there is a "fact of the matter" about whether someone knows, independent of what anyone says?
  If yes, you're an Invariantist (like your Encroachment view).
  If no, you're a Contextualist.
  If we can agree that the *psychological state* and the *evidence* remain constant, have we solved your argument with your friend?

  **Maya:** *Sighs.* Mostly. My friend argued that "nothing about my actual situation changed, just what it takes to satisfy the sentence." That's your view. I argued that "I suddenly don't feel like I 'know' it anymore." That's mine.
  If we agree that the *evidence* is constant, but the *rationality of acting* changes... then maybe we are fighting over whether "knowledge" is the name of the evidence-state or the name of the action-license.

  **Leo:** Exactly. You define knowledge as "enough evidence to act." I define knowledge as "enough evidence to meet the conversational standard."
  In low stakes, those overlap. In high stakes, they diverge.
  So, are we genuinely disagreeing? Yes, metaphysically. I think knowledge is a stable relation. You think it's a fluid status.
  But practically? We agree on what you should *do*. In high stakes, you shouldn't just say "I know" and walk away. You should check again.

  **Maya:** So the fight is about whether "checking again" is required because I *lost my knowledge*, or because "knowing" wasn't enough to cover the risk?

  **Leo:** Right. And honestly? The world doesn't care which label we use. But *we* care, because if you're right, then epistemology needs to study practical interests. If I'm right, epistemology studies evidence, and pragmatics studies interests.

  **Maya:** *Smiles slightly.* So, we've been arguing for two hours about whether the boundary of the word "know" includes the cost of being wrong.

  **Leo:** Basically. You think the cost cuts into the knowledge itself. I think the cost cuts into the appropriateness of claiming it.

  **Maya:** You know, my friend said, "Nothing about your actual situation changed." I hated that. Because it *felt* like something changed. But maybe what changed was my *responsibility*, not my *grasp*.

  **Leo:** And maybe your point is that responsibility is part of the grasp. That's a solid philosophical position, Maya. It's called Subject-Sensitive Invariantism. It's not crazy. It just makes knowledge harder to get when you're poor or in trouble.

  **Maya:** Which is arguably how life works.

  **Leo:** *Laughs.* True. Okay, truce? We agree that high stakes require more evidence before you act, regardless of what we call the mental state.

  **Maya:** Truce. But I'm still ordering the coffee. I don't "know" they got my order right, and I'm not taking the risk.

  **Leo:** Smart. Even if you do know, it's not worth the bitter sip if they messed it up.

  **Maya:** See? Pragmatic encroachment.

  **Leo:** *Shakes head.* Or just good decision theory.

  **Maya:** Same thing.
