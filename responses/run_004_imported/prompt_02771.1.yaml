  Here is a scenario designed to drive a wedge between Kant and Markovits, followed by an analysis of where Arpaly stands, and finally, how this map applies to your character, Elena.

  ### The Scenario: The Charter-Bound Nurse

  **The Agent:** Julian, a night-shift hospice nurse.
  **The Action:** Julian administers a scheduled dose of morphine to a terminal patient who is in visible distress, even though the patient has been verbally abusive toward him all week.
  **The Right-Making Feature:** The act is morally right because it alleviates the *patient's suffering*. The normative reason for the action is the intrinsic badness of pain and the value of the patient's comfort.

  **Julian's Psychology:**
  As Julian prepares the syringe, he feels no pity. In fact, he finds the patient irritating and feels a cold resentment at having to tend to him. He does not think, "This man is in pain." He thinks, *"The Nursing Charter requires pain management regardless of patient behavior. I am bound by the Charter. If I withhold this, I am violating my professional law."* He acts solely to maintain the integrity of the Code he serves. He would not administer the drug if the Charter did not command it, even if the patient were screaming.

  ### The Theoretical Verdicts

  **1. Immanuel Kant: Moral Worth Awarded**
  For Kant, the content of the motive matters less than its *form*. Julian is acting *from duty* (adherence to the Charter as a moral law) rather than *in accordance with duty* (which he would be doing if he acted out of pity or fear of getting fired). Because Julian suppresses his inclination (resentment) and acts because he recognizes a binding obligation, Kant awards this action full moral worth. The fact that Julian is indifferent to the patient's actual suffering is irrelevant; indeed, Kant might argue the lack of inclination makes the duty motive purer.

  **2. Julia Markovits: Moral Worth Withheld**
  For Markovits, moral worth requires the **Coincident Reasons Thesis**: the reason *why* the agent acts must match the reason *why* the act is right.
  *   **Why the act is right:** To stop the patient's suffering.
  *   **Why Julian acts:** To obey the Charter.
  Markovits argues these reasons do not coincide. Julian is not moved by the value that actually makes the action good (the patient's welfare); he is moved by a bureaucratic abstraction. To Markovits, Julian is like a shopkeeper who is honest only to protect his reputation; Julian is "nurse-honest" only to protect his professional code. He gets the right result, but for the wrong reason. Verdict: **No Moral Worth.**

  **3. Nomy Arpaly: The Split Decision**
  Arpaly focuses on **moral concern** and unreflective responsiveness. She would likely place Julian in the middle.
  *   Unlike the honest shopkeeper (who acts for self-interest), Julian is acting on a normative demand he perceives as binding. He is responsive to *a* moral feature (the requirement of care), even if he is blind to the ultimate ground of that requirement (the suffering itself).
  *   Arpaly would argue Julian has **partial moral worth**. He is better than a malicious nurse, but worse than a nurse who acts because she sees the suffering. He is responsive to the *rules* of morality, if not the *spirit*.

  ### How This Helps You Write Elena

  This scenario provides the vocabulary to resolve your writing group's split. Your group is debating whether Elena (who acts from empathy) is more or less admirable than a "Duty-Bound" version of herself. Using this apparatus, you can see that "admirable" depends entirely on which philosophical metric you apply.

  **1. The Kantian Critique of Elena**
  If a member of your group argues Elena is *less* admirable, they are implicitly using a Kantian metric. To them, Elena's empathy is just "inclination." If she stops feeling empathy, she stops caring. A Duty-Bound Elena would show up even if she hated the patient. Kant says the Duty-Bound Elena is the only one with true moral worth.
  *   *For your novel:* You can let Elena feel this insecurity. She suspects her goodness is fragile because it relies on her feelings, not her will.

  **2. The Markovits/Arpaly Defense of Elena**
  If a member argues Elena is *more* admirable, they are implicitly using Markovits's or Arpaly's metric.
  *   **Markovits:** In the "Charter-Bound Nurse" scenario, we saw that Duty can miss the point (the patient's suffering). Elena, by contrast, acts *because* she cannot bear the thought of them dying alone. Her motivating reason (their loneliness) **coincides** perfectly with the right-making reason (their loneliness is bad). Markovits would say Elena has *higher* moral worth than the Duty-Bound version, because her reasons are properly aligned with the good.
  *   **Arpaly:** Arpaly would argue Elena displays deeper **moral concern**. She is responsive to the actual human value at stake, whereas the Duty-Bound nurse is only responsive to the rule.

  **3. The Narrative Synthesis**
  You can use this tension to deepen Elena's internal conflict without resolving it philosophically.
  *   **The Fear:** Elena fears the Kantian verdict—that she is merely a slave to her own emotions, and therefore not truly "good."
  *   **The Reality:** The novel can show that the "Duty-Bound" volunteers are often the ones who burn out or treat patients like checklists (The Charter-Bound Nurse), while Elena's "flawed" empathy is what actually delivers the moral good (The Coincident Reason).

  **Specific Scene Suggestion:**
  Introduce a foil character—a "perfect" volunteer who never misses a shift, follows every protocol, but never holds a hand unless the protocol says to. Let Elena observe this volunteer being technically correct but morally hollow (e.g., refusing a small comfort because "it's not on the chart").
  *   **Kant** would admire the foil.
  *   **Markovits/Arpaly** would admire Elena.
  *   **Elena** feels inferior to the foil (internalizing Kant) but the *reader* sees the foil is cold (aligning with Markovits).

  This allows you to validate Elena's "trouble" without validating her fear. She is troubled by her own goodness because she measures herself by a Kantian ruler, even while she is practicing a Markovits-style virtue.
