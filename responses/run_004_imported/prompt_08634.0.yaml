answer: |-
  You have hit on a fascinating intersection of evolutionary psychology, behavioral economics, and 20th-century marketing. Your instinct is partially right (the diamond industry absolutely engineered the specific *rules* of this game), but your cousin's observation is also rooted in a genuine human psychological mechanism.

  The short answer is: **Yes, there is a logical reason why costly gestures are interpreted as stronger signals of commitment, but the modern engagement ring is a hijacked version of that logic.**

  Here is a breakdown of why this dynamic exists, why it feels contradictory, and how to navigate it.

  ### 1. The Theory: Costly Signaling
  In evolutionary biology and economics, there is a concept called **Costly Signaling Theory** (often associated with the Handicap Principle). The core idea is that for a signal to be trustworthy, it must be costly to fake.

  *   **The Peacock's Tail:** A peacock's tail is heavy, bright, and makes it easier for predators to catch him. Only a genetically fit, healthy peacock can afford to survive *despite* having that tail. Therefore, the tail is an honest signal of fitness.
  *   **The Human Equivalent:** In relationships, words ("I love you," "I'm committed") are "cheap talk." Anyone can say them. To prove commitment, one must engage in a behavior that incurs a cost.
  *   **The Ring:** Historically, giving resources to a mate signaled an ability to provide and a willingness to sacrifice personal security for the partnership. If you spend a significant portion of your savings on a ring, you are signaling, *"I value this future with you more than I value my current financial security."*

  This explains your cousin's observation. Her friends aren't just being shallow; they are using a heuristic. They assume that a couple willing to incur a high cost is more invested in the union than a couple who wasn't. In a social context, the ring acts as a public broadcast of that private commitment.

  ### 2. The Hijack: De Beers and Standardization
  While the *impulse* to signal commitment through sacrifice is ancient, the *specifics* of the engagement ring are largely a 20th-century invention.

  Before the 1930s, engagement rings were not universal, and diamonds were not the default. The De Beers diamond cartel launched a massive marketing campaign to change this. They needed to make diamonds scarce and socially mandatory.
  *   **"A Diamond is Forever" (1947):** Linked the stone to eternal marriage.
  *   **"Two Months' Salary" (1980s):** This was the masterstroke. By suggesting a specific *amount* to spend, they standardized the "cost" of the signal.

  This is where your instinct is correct. The industry artificially inflated the "cost" required to send the signal. They convinced society that a modest ring wasn't just modest—it was a *failed signal*. They turned a symbolic gesture into a price tag.

  ### 3. The Problem: Absolute vs. Relative Cost
  The flaw in your relatives' advice is that they are focusing on **absolute cost** (the dollar amount) rather than **relative cost** (the sacrifice).

  In Costly Signaling Theory, the signal is only honest if it is costly *to the sender*.
  *   If a billionaire spends $100,000 on a ring, it is financially painless. It is a weak signal of sacrifice, even though it is a high dollar amount.
  *   If a graduate student spends $2,000 on a ring, it might represent three months of savings. That is a high-cost signal of sacrifice.

  However, society (your relatives) tends to judge by the visible price tag because they don't know your bank account balance. They see the "peacock's tail," but they don't know how heavy it is for *you*. This leads to the "herd behavior" your cousin described: people assume the expensive tail belongs to the fittest bird, even if that bird went into debt to buy it.

  ### 4. The Paradox of "Financial Pain"
  You asked if a "financially painful gesture" is a more trustworthy sign.
  *   **Evolutionarily:** Yes. Pain/sacrifice proves intent.
  *   **Practically:** No. Starting a marriage with credit card debt or depleted savings creates immediate stress, which is a leading cause of divorce.

  If you bankrupt yourself to buy a ring, you are signaling high commitment to the *engagement*, but you are simultaneously undermining the *marriage* (which requires financial stability). This is the trap of the modern diamond industry: it encourages a signal that damages the very thing it is supposed to represent.

  ### 5. How to Navigate This
  You are stuck between biological signaling, social pressure, and financial reality. Here is how to reconcile them:

  **1. Prioritize the Receiver, not the Audience**
  Your relatives and your cousin's friends are the "audience." Your partner is the "receiver." In signaling theory, the signal only needs to be understood by the receiver to be effective. If your partner knows your financial situation and values your future security, a modest ring can be just as strong a signal of commitment because *they* understand the relative cost. Do not optimize the ring for people who will not be in your marriage.

  **2. Decouple the Signal from the Commodity**
  You can satisfy the psychological need for a "costly signal" without feeding the diamond industry.
  *   **Custom Design:** A unique ring shows time and effort (a different kind of cost).
  *   **Alternative Stones:** Moissanite or sapphires look beautiful but cost less, allowing you to allocate the "saved" money toward a down payment or honeymoon, which signals commitment to *building a life* rather than *buying a rock*.
  *   **Heirlooms:** Using a family ring signals deep integration into the family lineage, which is a powerful social signal in its own right.

  **3. Communicate the Signal**
  If you choose a modest ring, you can control the narrative. If relatives comment, the response isn't "We couldn't afford more." It is, "We decided to prioritize our future home/travel/debt freedom over a stone." This reframes the modesty not as a lack of seriousness, but as a *different, more mature form* of seriousness.

  ### Summary
  There is a genuine psychological reason why humans equate cost with commitment (Costly Signaling). However, the idea that this *must* be expressed through an expensive diamond is marketing residue.

  Your relatives are reacting to the **social heuristic** (Expensive = Serious). Your cousin is observing the **social consequence** (People judge cheap rings). But neither of them has to live with your budget or your marriage.

  If you buy a modest ring, you are not failing to signal commitment; you are simply choosing to signal it to your partner rather than to your relatives. That is often the stronger foundation for a long haul.
