answer: |-
  You are not reading this wrong. In fact, you have put your finger on one of the most famous and enduring cruxes in Maimonidean scholarship. Your student *should* press you on this, because the tension between the *Guide of the Perplexed* (particularly III.32 and III.46) and the *Mishneh Torah* is genuine and substantive.

  However, it does not necessarily amount to a logical inconsistency or a violation of the Ninth Principle. To help you prepare for the seminar, I want to validate your reading, clarify the status of the Ninth Principle, and offer three interpretive frameworks that scholars use to resolve (or manage) this tension.

  ### 1. Validation: Your Reading of *Guide* III.32 is Correct
  You are right that Friedländer is stiff (the Pines translation is the academic standard now, though it has its own quirks), but your grasp of the argument is sound. Maimonides explicitly argues that the sacrificial cult was a **historical concession**.

  He posits a "primary intention" (*kawana rishona*) and a "secondary intention" (*kawana sheniya*).
  *   **Primary:** To know God and reject idolatry.
  *   **Secondary:** To regulate human behavior within the limits of human psychological capacity.

  Maimonides argues that if God had commanded prayer alone and forbidden sacrifice entirely, it would have been psychologically impossible for the Israelites at that time. Therefore, God "transferred" the act of sacrifice from idols to Himself. This is the "Divine Plan" (*takhbulah*).

  So, your reading stands: Sacrifices are not the ideal form of worship in Maimonides' view; prayer and intellectual contemplation are "nearer to the primary object."

  ### 2. The Ninth Principle Red Herring
  You mentioned a tension with the Ninth Principle ("The Torah will not be changed"). Actually, the *Mishneh Torah* does not violate this principle. Maimonides firmly believes in the messianic era and the rebuilding of the Temple, at which point sacrificial law will be reinstated (*Hilkhot Melakhim* 11:1).

  The Ninth Principle guards against *abrogation* (a new prophet claiming the Torah is void). Maimonides is not saying the Torah is void; he is saying the *teleological priority* of the commandments is hierarchical. A commandment can be eternal (binding forever) without being the *highest* form of worship.

  The tension you feel is not legal (will we keep the law?), but **axiological** (what is the *value* of the law?).

  ### 3. Three Ways to Resolve the Tension
  Here are three approaches you can offer your students to reconcile the *Guide* (philosophical teleology) with the *Mishneh Torah* (legal deontology).

  #### A. The "Form vs. Intent" Distinction
  In the *Guide*, Maimonides is explaining why the *form* of sacrifice (slaughtering animals) was chosen historically. In the *Mishneh Torah*, he is codifying the *obligation*.
  *   **Argument:** The *form* was a concession to ancient idolatrous culture. However, once commanded, the *obligation* becomes absolute.
  *   **Resolution:** In the messianic future, the *form* remains (because the Torah is eternal), but the *intent* changes. In the wilderness, sacrifice was a weaning tool away from idols. In the messianic era, sacrifice will be a symbolic enactment of monotheistic submission, devoid of idolatrous context. The "concession" was regarding the *transition*, not the *permanence*.
  *   **Scholarly Reference:** This is close to the reading of **Menachem Kellner**. He argues Maimonides views many commandments as tools to correct beliefs. Once beliefs are corrected, the tools might seem obsolete, but because they are Divine Command, they remain binding as "memorials" or distinctives of the Jewish people.

  #### B. The "Two Audiences" Approach (Straussian/Lawrence Kaplan)
  This approach suggests Maimonides is writing two different books for two different audiences.
  *   **Argument:** The *Mishneh Torah* is for the political community. It must maintain social cohesion, ritual distinctiveness, and obedience. To suggest sacrifices are "second best" to the masses could undermine religious observance.
  *   **Resolution:** The *Guide* is for the intellectual elite who are "perplexed" by the apparent irrationality of sacrifices. They need to know the philosophical *reason* so their faith isn't shaken. The elite can understand that sacrifice is secondary to contemplation without abandoning the law. The masses need the law to be presented as absolute.
  *   **Seminar Point:** Ask your students: Does Maimonides believe the "truth" of the commandments should be public knowledge? If not, is the *Mishneh Torah* a "noble lie" or simply a different genre of discourse?

  #### C. The "Gradual Perfection" Model
  This reading suggests that Maimonides views human history as a pedagogical progression.
  *   **Argument:** In the past, sacrifice was necessary to move from Idolatry -> Monotheistic Sacrifice -> Prayer/Intellect.
  *   **Resolution:** We are currently in the "Prayer" phase (since the Temple is destroyed). But the *Guide* implies that in the Messianic era, human nature itself might be refined. Perhaps the "psychological necessity" that required sacrifice will vanish, yet God commands it anyway as a test of obedience, or perhaps the "secondary intention" becomes irrelevant, leaving only the "primary intention" (devotion) which is now possible *through* sacrifice because the idolatrous impulse is gone.
  *   **Nuance:** Note that Maimonides never explicitly says sacrifices will be *abolished* in the future (unlike some midrashim). He expects them to return. This suggests that for Maimonides, even if prayer is "nearer," sacrifice still has an irreducible function in the perfected world—perhaps as a public, communal act that prayer (which is individual) cannot achieve.

  ### 4. The Ramban Counter-Point (Crucial for Context)
  To really sharpen the seminar, you should introduce Nahmanides (Ramban)'s critique of Maimonides on this very point (Commentary on Leviticus 1:9).
  *   **Ramban's View:** Sacrifices are not a concession. They are intrinsic to the cosmic order. They existed before the Golden Calf (Abel, Noah, Abraham sacrificed).
  *   **Why it matters:** Ramban saw exactly what you saw—that Maimonides' view makes the Torah seem contingent on historical circumstances. Ramban argues that if sacrifices were only to counter idolatry, why did Noah (who wasn't an idolater) sacrifice?
  *   **Seminar Utility:** Presenting Ramban validates your students' intuition that Maimonides' view is radical. It shows that the "tension" you feel was felt by medieval authorities too.

  ### 5. Practical Advice for the Seminar
  1.  **Ditch Friedländer (if possible):** If you can switch excerpts to **Shlomo Pines (1963)**, the argument becomes much clearer. Pines translates *takhbulah* as "cunning device" or "ruse," which makes Maimonides sound even more radical than Friedländer's "Divine plan."
  2.  **Focus on "Primary vs. Secondary":** Have the students define these terms. If the "Secondary Intention" is historically bound (dealing with idolatry), how can a law based on it be eternal?
  3.  **The "Why" vs. The "What":** Remind them that Maimonides distinguishes between the *efficient cause* (why was this law given *then*?) and the *final cause* (what does this law achieve *always*?). The efficient cause may be historical; the final cause (obedience to God) is eternal.

  ### Summary for your preparation
  You are not missing a trick. Maimonides *does* demote sacrifice teleologically while maintaining it legally.
  *   **Is it inconsistent?** Legally, no. Philosophically, it requires a nuanced view of "eternal law" that accommodates historical development.
  *   **Does it violate the 9th Principle?** No, because the law isn't changed; only our understanding of its hierarchy shifts.
  *   **Best resolution:** The *form* was a concession; the *command* is eternal. In the future, the form remains, but the "idolatrous baggage" is gone, allowing the sacrifice to serve the Primary Intention directly.

  If your student presses you, admit the tension. It is the engine of much modern Maimonidean scholarship (from Strauss to Kellner to Halbertal). A good answer isn't "Maimonides didn't mean that," but rather "Maimonides meant exactly that, and here is how he constructs a system to hold both truths together."
