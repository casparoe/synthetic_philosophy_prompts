answer: |-
  Elias saw the hand darting toward the closing gap, fingers splayed in desperate hope, and he hit the open button. It was a reflex, barely a thought. The woman slipped inside, breathless, clutching a leather portfolio to her chest. She offered a tight, grateful smile. Behind her, on the sidewalk, a man in a grey coat checked his watch, sighed, and stepped back as the doors slid shut.

  Elias rode up to the fourteenth floor feeling a small, warm ping of virtue. He held the door for three seconds. He saved her maybe two minutes. It was nothing. It was everything.

  Ten years later, Julia is in a kitchen that smells of rosemary and fresh paint. She owns this house because she made the interview that morning. She had been running late, flustered, ready to quit the city entirely. But those saved minutes let her compose herself in the lobby. She nailed the meeting. The promotion followed, then the transfer, then the mortgage. Her son is asleep upstairs. He has a condition, rare but manageable, caught early because this city had the specific specialist she could afford now. She hums while washing dishes, grateful for the stranger in the elevator, though she doesn't know his name. The warmth in her chest is real, grounded in the health of the child breathing softly down the hall.

  Ten years later, Stephen is sitting in his car in a parking garage, engine off, staring at the steering wheel. He missed that elevator. The wait for the next one made him late for the shuttle, which made him miss the connection at the terminal. He arrived at the client site twenty minutes late. He didn't get the contract. It was just one contract, but it was the one that would have secured the quarterly bonus. Without the bonus, the credit card bill went unpaid. The interest compounded. The stress fractured something quiet between him and his wife. She moved out last month. He isn't sure why he's sitting in the garage instead of going home to his empty apartment. He thinks about mornings where things slide out of reach by inches. He thinks about the doors that closed.

  Twenty years later, Elias is old. He sits on a park bench watching pigeons fight over crusts. He remembers the elevator. He remembers the woman's smile. He likes to think she made it to wherever she was going. He likes to think that his small mechanical mercy added weight to the good side of the scale.

  But sometimes, when the wind is cold and the shadows stretch long across the pavement, he remembers the man in the grey coat. He remembers the sigh.

  He tries to do the math. He tries to weigh the woman's rosemary-scented kitchen against the man's silent car. He tries to count the ripple effects: the child born healthy, the marriage strained thin. But the threads vanish into the weave of the world too quickly. Did the man's failure lead to something else? Did the woman's success prevent some other disaster, or cause one? The consequences spread out like ink in water, mixing with millions of other choices, other held doors, other missed buses, until the source is indistinguishable from the noise.

  Elias knows he will never know. He cannot walk back the timeline. He cannot isolate the variable. He acted on instinct, assuming that kindness was a net positive, a universal currency. But the universe doesn't balance books. It just flows.

  He watches a young boy drop an ice cream cone on the pavement. The boy cries. His mother comforts him, buying him a new one, bigger than the first. The boy stops crying, happy again. Elias wonders if the loss was necessary for the gain. He wonders if holding that door was a gift or a theft.

  He stands up, knees cracking, and walks toward the subway. He sees a hand reaching for the train doors as they begin to close. He hesitates. His finger hovers over the open button. For a moment, he is paralyzed by the infinite arithmetic of it. Then the doors shut, sealing the future away from him. He stands on the platform, listening to the train rumble into the dark, carrying its passengers toward lives he will never see, toward outcomes he will never measure. He goes home, and he sleeps, and he dreams of nothing at all.
