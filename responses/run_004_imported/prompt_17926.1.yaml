      *   Propose a middle ground: **Risk-Weighted Decision Making.**
          *   We can't know the *truth*, but we can assess *probability* based on evidence (financial need, statements of intent).
          *   Shift from "What *would* they do?" to "What is the *risk* of funding the wrong one?"
          *   Consider the mission: Is the goal "maximize enrollments" or "support those in need"?
