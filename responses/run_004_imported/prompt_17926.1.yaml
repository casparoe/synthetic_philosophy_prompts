      *   **The User's Role:** Philosophy PhD, asked to tiebreak, feeling stuck.
      *   **The Core Philosophical Question:** Is there a truth value to counterfactuals of freedom (what a free agent *would* have done in a circumstance that never happened)?
      *   **The "Nagging" Feeling:** The user recognizes this structure from somewhere else but can't place it.
      *   **Goal:** Provide a defensible answer, reference relevant philosophical literature, and help resolve the committee standoff.

