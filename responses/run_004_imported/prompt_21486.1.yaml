      *   **Part 1: Freedom & Compatibility:** Molina would say "Yes, compatible." Explain the direction of fit (World $\to$ Knowledge, not Knowledge $\to$ World). Omega is like God in the "Middle Knowledge" moment.
      *   **Part 2: One-Box vs. Two-Box:** This is the meat.
