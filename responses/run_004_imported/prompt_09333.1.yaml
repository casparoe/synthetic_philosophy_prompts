  2.  **Understand Dennett's Intentional Stance:**
      *   **Physical Stance:** Predict based on physical laws (e.g., physics of circuits).
      *   **Design Stance:** Predict based on function/design purpose (e.g., it's designed to turn on at 70 degrees).
      *   **Intentional Stance:** Predict based on beliefs and desires (e.g., it "wants" to keep the room warm and "believes" it's cold).
      *   **Criterion:** Use the intentional stance *if and only if* it provides significant predictive power that is otherwise too complex or inaccessible via the design/physical stances, and the pattern is robust (real pattern).
      *   **Key Nuance:** Dennett is a compatibilist/interpretivist. He doesn't think there's a "magic juice" of consciousness. If the pattern holds, the belief is real enough. However, he also acknowledges degrees. Some systems are too simple (thermostat) where the design stance is easier. Some are too complex/noisy (economy) where the intentional stance might be too coarse. Humans are the paradigm case.

