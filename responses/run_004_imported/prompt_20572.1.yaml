  In move (5), Callum says KK was never proposed for logically omniscient reasoners. This is historically debatable (Hintikka etc. treated it as a logical axiom), but in the context of *naturalized epistemology*, Callum is right. However, if KK is a *constitutive* norm of knowledge, human failure might just mean we rarely know, not that KK is false. I'll note this tension.

