answer: |-
  It is a genuine pleasure to engage with someone who not only reads the text but brings a working scientist's intuition to it. Your instinct—that discovering $1898\text{ DQ} = 1901\text{ GV}$ is a fact about the solar system, not a fact about your cataloging software—is exactly the intuition that drove Frege to abandon the *Begriffsschrift* view thirteen years later.

  You have identified the precise tension that forced Frege to invent the Sense/Reference distinction. To answer your questions, we need to look closely at what the 1879 Frege was trying to do, why he (and you) found it unsatisfactory, and how the 1892 paper resolves it.

  ### 1. What is 1879 Frege actually claiming?

  In Section 8 of the *Begriffsschrift*, Frege is trying to build a formal language for pure thought. He runs into a logical problem: If signs are just proxies for their contents, then $a = b$ should mean exactly the same thing as $a = a$. After all, if $a$ and $b$ have the same content, substituting one for the other shouldn't change the thought. But clearly, learning $a = b$ is informative (it extends our knowledge), while $a = a$ is trivial.

  To solve this without the later Sense/Reference distinction, 1879 Frege proposes that the sign for identity ($=$) is unique. It doesn't relate the *contents* directly; it relates the *names* in virtue of their having the same content.

  So, to answer your first big question: **Yes, in 1879, Frege really does claim that identity statements are ultimately about the names (or signs).**

  He writes: *"Identity of content... relates to names, not to contents."*

  In your astronomical terms, the 1879 Frege would say that the proposition "1898 DQ is 1901 GV" is not primarily about the rock itself, but about the fact that the designation "1898 DQ" and the designation "1901 GV" are two different routes that determine the same content.

  ### 2. Why this feels self-undermining (and why you are right)

  You asked: *"Surely which symbols we happen to use is itself arbitrary, so how could a fact about them be the substantial thing we're learning?"*

  This is exactly the objection that bothered Frege himself. If identity is a relation between names, then it becomes a matter of linguistic convention.

  Imagine you have two observatories. Observatory A calls the rock "Alpha." Observatory B calls it "Beta." If I say "Alpha is Beta," and identity is just about names, then I am merely reporting on the cataloging decisions of A and B. If Observatory B had called it "Gamma" instead, the fact of the matter would change. That makes the truth of the identity statement dependent on arbitrary human choices, not on the celestial mechanics.

  Frege realized this made logic subjective. In *On Sense and Reference* (1892), he explicitly looks back at his 1879 view and rejects it for precisely the reason you intuitively flagged. He writes:

  > *"If we were to regard identity of content as a relation between that which the signs 'a' and 'b' designate, it would seem that $a = b$ could not differ from $a = a$... If we were to regard it as a relation between the signs themselves... it would be arbitrary. Anyone could use any process to designate an object."*

  So, your astronomical intuition is actually more aligned with the **mature** Frege (1892) than the **early** Frege (1879). You recognize that the *discovery* is substantial because the object exists independently of the designations. The 1879 view struggles to account for that independence.

  ### 3. How did he fix it? (The 1892 Shift)

  The relationship between the two texts is not just "messy"; it is a deliberate correction. Frege didn't just refine the 1879 view; he inverted it.

  **In 1879:**
  *   **Relation:** Between Signs (Names).
  *   **Why it has value:** Because different signs can determine the same content.
  *   **Problem:** Makes logic about language, not the world.

  **In 1892:**
  *   **Relation:** Between Objects (Reference/*Bedeutung*).
  *   **Why it has value:** Because different *Senses* (*Sinn*) can present the same Object.
  *   **Solution:** The identity statement $a = b$ asserts that the *Object* referred to by $a$ is the same as the *Object* referred to by $b$. This makes it a fact about the world (the asteroid). However, the *cognitive value* (why it's a discovery) comes from the fact that $a$ and $b$ have different *Senses*.

  Let's apply this to your minor planets.

  *   **Reference (*Bedeutung*):** The physical asteroid (the rock in the belt).
  *   **Sense (*Sinn*):** The "mode of presentation." For "1898 DQ," the sense is something like *"The object observed at Nice Observatory in 1898 with these specific orbital elements."* For "1901 GV," the sense is *"The object observed at Heidelberg in 1901 with these specific orbital elements."*

  When you prove $1898\text{ DQ} = 1901\text{ GV}$, you are asserting a relation between the **References** (they are the same rock). This validates your feeling that it is a discovery about the world. However, the reason this is *informative* is that the two **Senses** (the different observational histories and orbital calculations) were not obviously connected until you did the work.

  ### 4. Addressing your specific questions

  **Q1: Did Frege really mean to reduce identity claims to claims about our labeling conventions?**
  **A:** In 1879, **yes**. He explicitly states identity relates to names. He was trying to solve a logical problem within a formal system and hadn't yet fully distinguished the psychological/linguistic mode of access from the object itself. He treated "content" (*Inhalt*) in a way that straddled the line between what would later become Sense and Reference.

  **Q2: If so, how is that not immediately self-underundermining?**
  **A:** Frege came to agree with you that it *was* undermining. In the 1879 framework, he tried to save it by arguing that the names aren't *arbitrary* labels but distinct "ways of determining" the content. However, he eventually admitted this wasn't enough. If logic is to be objective, it cannot depend on whether we happen to have two names for one thing. The 1892 distinction saves the objectivity of the identity claim (it's about the Reference) while preserving the informativeness (via the Sense).

  **Q3: Is this "names, not contents" idea the very view he attacks in "On Sense and Reference"?**
  **A:** **Yes, precisely.** The opening pages of "On Sense and Reference" are essentially Frege critiquing Section 8 of the *Begriffsschrift*. He sets up the "names" view (his old view) as a foil to explain why he now needs the Sense/Reference distinction. He writes that if identity were a relation between signs, "it would be arbitrary," and "no knowledge would be conveyed by it." This mirrors your frustration at dinner with your friend.

  ### A Note on the "Geometrical Point" Example

  You mentioned skipping the geometry example in Section 8. It is worth briefly revisiting because it illuminates why the 1879 view was tempting to a mathematician.

  Frege describes a point in a triangle determined by the intersection of lines $a$ and $b$, and then the same point determined by lines $b$ and $c$.
  *   **1879 View:** The *sign* "intersection of $a,b$" and the *sign* "intersection of $b,c$" are different modes of determination. The identity statement says these two *determinations* yield the same content.
  *   **Astronomical Parallel:** This is very close to your orbit-fitting. You determine the object via Observation Set A (1898) and Observation Set B (1901).
  *   **The Flaw:** In geometry, the "modes of determination" are part of the mathematical definition. In astronomy, the "modes of determination" are empirical discoveries. The 1879 view blurs the line between *defining* a point and *finding* an object. The 1892 view clarifies this: The point (Reference) exists; the constructions (Senses) are how we grasp it.

  ### Summary for your next dinner

  Your friend is using the 1892 example (Morning Star/Evening Star) but perhaps explaining it with 1879 logic (focusing on the names).

  You can tell him: *"Frege actually agreed with me. In 1879, he thought identity was about the names. But he realized that makes identity arbitrary. In 1892, he corrected himself: Identity is about the **object** (the Reference), but our **knowledge** of it depends on the **path** we took to find it (the Sense). When I matched 1898 DQ to 1901 GV, I wasn't learning about the catalog numbers; I was learning that two different observational paths led to the same physical body."*

  You have effectively reinvented the motivation for the Sense/Reference distinction through your own scientific practice. That is the highest compliment one can pay a philosophical text: to find that the author eventually had to change his mind to accommodate the reality you work in every day.
