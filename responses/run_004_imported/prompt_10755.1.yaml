prompt: |-
  So I spent my working life as an experimental physicist doing a lot of Bayesian analysis on messy detector data, and now that I'm retired I've fallen down a philosophy rabbit hole -- currently decision theory. I recently ran into I.J. Good's old theorem that a rational Bayesian should always want a free look at more evidence before acting, since it can only raise your expected payoff, never lower it, so long as you actually update on it properly.

  That's turned out to be more than academic for me: I sit on my hospital's ethics committee, and we're rewriting the policy on predictive testing for Huntington's and other untreatable, late-onset genetic conditions. Counselling here has always protected a strong "right not to know" -- people can request the test and still back out of learning the result at the very last step -- but two of the younger physicians want to flip the default to automatic disclosure, and their argument is essentially Good's theorem in clinical dress: it's your own genome, its free to tell you, so declining only makes sense if your being irrational. I'm not convinced, but I can't quite pin down where that reasoning actually breaks down for real patients, including relatives who get implicated by someone else's result without ever asking to be. Could you draft the memo I'll bring to Thursday's meeting -- a concrete recommendation on the disclosure default and how much opt-out we allow and when, the reasoning behind it, and a genuinely fair hearing for the disclosure-by-default view rather than a strawman?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User Persona:** Retired experimental physicist, experienced in Bayesian analysis of messy data. Currently interested in philosophy/decision theory. Sits on a hospital ethics committee.
      *   **The Problem:** Rewriting policy on predictive testing for untreatable, late-onset genetic conditions (e.g., Huntington's Disease).
      *   **The Conflict:** Traditional "right not to know" (opt-in disclosure) vs. Younger physicians' "disclosure by default" (opt-out disclosure).
      *   **The Physicians' Argument:** Based on I.J. Good's Theorem (Value of Information). More information = higher expected utility for a rational agent. Therefore, refusing info is irrational.
      *   **The User's Intuition:** Something is wrong with applying Good's Theorem here, but needs help articulating *why* in a way that respects the physicians' logic while protecting patients.
      *   **Deliverable:** A memo for the Thursday ethics committee meeting.
      *   **Requirements:** Concrete recommendation on disclosure default/opt-out, reasoning behind it, and a *fair* hearing for the disclosure-by-default view (no strawmanning).

  2.  **Deconstruct the Core Theoretical Conflict (Good's Theorem vs. Clinical Reality):**
      *   *Good's Theorem:* Assumes a single agent maximizing expected utility based on *one* decision problem. It assumes the cost of information is zero (or accounted for) and that the utility function is stable.
      *   *Clinical Reality (Huntington's):*
          *   **Utility Function Instability:** Knowing the result changes *who you are*. It changes the utility function itself (psychological burden, identity shift). Good's theorem assumes $U(outcome|data)$, but here $U_{known}(outcome) \neq U_{unknown}(outcome)$.
          *   **Multiple Decision Problems:** It's not just "do I treat?" (there is no treatment). It's "do I marry?", "do I have kids?", "do I buy long-term care insurance?", "do I tell my siblings?".
          *   **Externalities:** The result affects relatives (who didn't consent to the info). Good's theorem is individualistic.
          *   **Psychological Costs:** The "cost" of information isn't just monetary. It's existential dread, depression, suicide risk. If the cost of processing the info exceeds the expected benefit of decision optimization, the net value is negative.
          *   **Bounded Rationality:** Patients aren't ideal Bayesian updaters. Emotional impact skews priors and likelihoods.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** The bottom line recommendation.
      *   **Context:** Briefly state the policy revision goal.
      *   **The Argument for Disclosure by Default (The "Younger Physicians" View):** Articulate Good's Theorem fairly. Autonomy as maximizing informed choice.
      *   **The Limitations of the Information-Value Model (The Critique):** This is the meat. Address why Good's Theorem doesn't map 1:1 to this clinical context.
          *   Utility function stability.
          *   Non-instrumental value of ignorance.
          *   Third-party implications.
      *   **Recommendation:** Specific policy details (Default = Non-disclosure, robust opt-in process, timing of opt-out).
      *   **Conclusion:** Final ethical framing.

  4.  **Refining the Argument (The "Physicist to Physicist" bridge):**
      *   Since the user is a physicist, I should use language that resonates with that background (utility functions, boundary conditions, system perturbations) without being overly jargon-heavy for the rest of the committee.
      *   *Key Insight:* Good's Theorem holds if the cost of information $C \le 0$ and the utility function $U$ remains constant. In Huntington's testing, $C$ is psychological trauma, and $U$ changes fundamentally upon measurement (wavefunction collapse analogy might be too cute, but the concept of observer effect is relevant).
      *   *Fair Hearing:* Acknowledge that *for some* patients, the default should effectively be disclosure (those who demand it). The fight is about the *default setting* and the *barrier to entry*.

  5.  **Developing the Recommendation:**
      *   *Default:* Non-disclosure (preserve "Right Not to Know").
      *   *Process:* Multi-stage counseling.
      *   *Opt-out:* Must be explicit, informed, and reversible *until* the result is generated/released.
      *   *Relatives:* Specific protocol for incidental findings affecting kin (usually non-disclosure to kin without consent, but this is tricky. Stick to the patient's result disclosure policy for now to keep scope manageable, but acknowledge the kin issue).

  6.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Acknowledge the physicists' background implicitly by being precise.
      *   *The "Pro-Disclosure" Case:* Frame it as "Maximizing Autonomy via Information." Good's Theorem says information has non-negative value. If we hide it, we paternalistically assume they can't handle it.
      *   *The "Counter" Case:*
          1.  *Cost of Information:* It's not free. Suicide risk is real.
          2.  *Transformation of Preferences:* Knowing changes what you want. (Pre-test self vs. Post-test self).
          3.  *The "Untreatable" Variable:* If there's no action $A$ that changes outcome $O$, the value of info is purely in planning. But planning has a cost.
          4.  *Kin:* Violates their right not to know.
      *   *Recommendation:* "Informed Choice" model, not "Disclosure" model. The test is for *planning*, not *curing*. The default must protect the status quo (ignorance) because ignorance is irreversible once lost.

  7.  **Review against Constraints:**
      *   *Fair hearing?* Yes, dedicate a section to why the physicians are theoretically right but practically wrong.
      *   *Concrete recommendation?* Yes, specific workflow.
      *   *Tone:* Professional, ethical, analytical, respectful of the user's expertise.

  8.  **Final Polish:**
      *   Ensure the distinction between *testing* (drawing blood) and *disclosure* (revealing result) is clear. This is the crucial pivot point.
      *   Make sure the "Right Not to Know" is framed as a positive liberty, not just a refusal.
      *   Check that the Good's Theorem refutation is precise (violation of assumptions).

  **(Self-Correction during drafting):** I initially thought about using quantum mechanics metaphors. *Correction:* No, keep it to Decision Theory. The user knows Bayesian stats, so stick to Utility Functions and Expected Value. It's more rigorous for an ethics committee memo.
  *Crucial nuance:* Good's Theorem assumes you *can* ignore the information if it's not useful. But in a hospital system, once it's in the chart, can you truly ignore it? The "cost of storage/availability" matters.

  9.  **Finalizing the Memo Structure:**
      *   To/From/Subject.
      *   Purpose.
      *   Summary of Proposal.
      *   The Case for Default Disclosure (The Good's Theorem Argument).
      *   Why the Model Breaks Down in Predictive Genetics (The Critique).
      *   Policy Recommendation.
      *   Implementation Notes.

