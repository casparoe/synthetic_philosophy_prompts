answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Disclosure Defaults for Predictive Genetic Testing (Untreatable Late-Onset Conditions)

  ### 1. Purpose and Executive Summary

  We are currently revising policy regarding predictive testing for untreatable, late-onset genetic conditions (e.g., Huntington's Disease). The central point of contention is the disclosure default: should results be automatically released to the patient's medical record (Disclosure-by-Default), or should explicit consent be required to view the result after testing (Disclosure-by-Consent)?

  Two committee members have argued for Disclosure-by-Default, invoking a principle from decision theory (I.J. Good's Theorem) which suggests that rational agents should always accept free information to maximize expected utility.

  **Recommendation:** I recommend we maintain **Disclosure-by-Consent** as the default. Patients must explicitly opt-in to receive results at multiple stages, with a final "right not to know" exercisable even after the sample is analyzed but before the result is released.

  **Rationale:** While Good's Theorem holds mathematically for idealized agents, its assumptions break down in this clinical context. Specifically, the "cost" of information is non-zero (psychological harm), the utility function is not stable (knowledge alters identity and preferences), and the decision affects third parties (relatives) who did not consent to the information gain.

  ### 2. The Case for Disclosure-by-Default (A Fair Hearing)

  To ensure our policy is robust, we must acknowledge the strength of the argument for automatic disclosure. The position put forward by our younger colleagues rests on a rigorous interpretation of patient autonomy and decision theory.

  **A. The Value of Information (Good's Theorem)**
  In Bayesian decision theory, I.J. Good demonstrated that for a rational agent, the expected utility of making a decision *with* additional free evidence is always greater than or equal to making the decision *without* it. Information allows for better calibration of life choices (financial planning, family planning, end-of-life care). To withhold information, or to create bureaucratic hurdles to accessing it, is arguably paternalistic. It assumes the hospital knows better than the patient what is good for them.

  **B. Autonomy as Maximization**
  From this view, autonomy is not merely the right to refuse, but the capacity to act on the best available data. If a patient has already undergone the blood draw (the "measurement"), blocking the result treats the patient as incapable of handling the truth. It creates an asymmetry where the hospital holds knowledge about the patient's own body that the patient is forbidden to access.

  **C. Consistency with General Medicine**
  In almost all other contexts (cancer diagnosis, blood work, imaging), results are automatically populated to the patient portal. Creating a special class of "protected" information stigmatizes genetic conditions and implies that patients are too fragile to handle their own data.

  ### 3. Why the Decision-Theoretic Model Breaks Down

  While the argument above is logically sound in the abstract, it relies on boundary conditions that do not hold in predictive testing for untreatable conditions. As an experimentalist, I would argue we are applying a model outside its valid parameter space.

  **A. Violation of Utility Stability (The Observer Effect)**
  Good's Theorem assumes a stable utility function $U$. It calculates $E[U|Data]$. However, in Huntington's testing, the acquisition of data fundamentally alters $U$.
  *   *Pre-test:* The patient is a person *at risk*. Their utility function values hope and present-moment well-being.
  *   *Post-test:* A positive result transforms the patient into a person *with a destiny*. This often induces profound existential distress, depression, or suicide risk.
  The "cost" of the information is not zero; it is potentially catastrophic to the agent's psychological integrity. If the cost of processing the information exceeds the expected utility gain from better planning, the net value is negative.

  **B. Irreversibility and the "Right Not to Know"**
  Information is thermodynamically irreversible. Once a patient knows they carry the gene, they cannot "un-know" it to return to a state of hopeful uncertainty.
  *   **Default Disclosure** makes ignorance difficult (requiring active opt-out).
  *   **Default Consent** makes knowledge difficult (requiring active opt-in).
  Because ignorance is the only reversible state (you can always test later, but you can't un-test), the ethical default must protect the reversible state. The "Right Not to Know" is not a right to be irrational; it is a right to preserve a specific psychological state that is valuable to the patient.

  **C. Externalities and Third Parties**
  Good's Theorem applies to a single agent. Genetic data is familial. A patient's decision to know their status implicitly reveals probabilistic information about their siblings and children.
  *   If we default to disclosure, we prioritize the autonomy of the patient over the "right not to know" of their relatives.
  *   Relatives who wish to remain ignorant may find their status involuntarily revealed by a family member's automatic result.
  A conservative disclosure policy protects the privacy of the kinship network, not just the individual.

  **D. Bounded Rationality and Clinical Reality**
  The theorem assumes a rational Bayesian updater. Clinical experience shows that patients receiving positive predictive results often suffer cognitive impairment due to distress, impairing their ability to use the information for the "better decisions" promised by the disclosure model. If the information degrades the decision-making apparatus, it has negative instrumental value.

  ### 4. Policy Recommendation

  Based on the above, I propose the following workflow for the revised policy:

  **1. The "Two-Step" Consent Process**
  *   **Step 1 (Pre-Test):** Consent to *perform* the genetic analysis. This must explicitly state that performing the test does not guarantee the patient will see the result.
  *   **Step 2 (Post-Test, Pre-Disclosure):** After the lab confirms the result, a mandatory counseling session is required. At the conclusion of this session, the patient must sign a separate release to *view* the result.

  **2. The Disclosure Default**
  *   **Default:** Non-disclosure. Results are held in a secure "ethics lockbox" within the EMR, inaccessible to the patient portal and general providers.
  *   **Opt-In:** Patients may choose to receive results at Step 2.
  *   **Opt-Out:** Patients who initially requested results may decline them at Step 2.
  *   **Sample Destruction:** If a patient declines results at Step 2, the biological sample and the digital data must be destroyed to prevent accidental future disclosure or insurance subpoenas.

  **3. Handling of Incidental Familial Risk**
  *   Providers must document counseling regarding the impact on relatives.
  *   No information shall be released to relatives without the patient's explicit consent, even if it implies a risk to them. (We prioritize the patient's confidentiality to maintain trust in the testing program).

  **4. Re-testing Protocol**
  *   Patients who choose "Not to Know" retain the right to change their mind later. The policy must ensure they can re-enter the counseling pipeline without stigma.

  ### 5. Conclusion

  The argument for Disclosure-by-Default is compelling if we view patients as idealized rational agents maximizing expected utility in a vacuum. However, our duty is to real patients in a messy clinical environment.

  In this context, information is not merely a tool for optimization; it is an intervention with its own risk profile. Just as we would not default to a surgery with high psychological morbidity simply because it *might* help, we should not default to disclosure when the cost of ignorance is zero, but the cost of knowledge can be life-ending.

  Preserving the "Right Not to Know" is not an accusation of irrationality. It is an acknowledgment that for some patients, uncertainty is a rational preference to be protected, not a bug to be fixed.

  ***

  **Action Item:** I move we adopt the "Two-Step Consent" and "Non-Disclosure Default" for the upcoming policy draft.
