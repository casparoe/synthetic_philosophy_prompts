answer: |-
  This is an exceptionally sharp reading of *On Certainty*, especially for someone without formal training. You have identified precisely the fault line that divides contemporary Wittgenstein scholarship. Most introductory summaries gloss over the tension between the "hinge" (which suggests structural necessity) and the "riverbed" (which suggests historical contingency), but you are right to feel that how one resolves this tension dictates which interpretive camp one falls into.

  You asked whether the "Entitlement" view (Wright) or the "Non-Epistemic/Action" view (Pritchard, Moyal-Sharrock) better accommodates the riverbed passages, and specifically whether your intuition is correct: that treating hinges as beliefs makes their shifting nature easier to explain.

  I want to challenge that intuition slightly. While it seems logical that "beliefs" are easier to shift than "actions," within the specific context of Wittgenstein's later philosophy, the **Non-Epistemic/Action view actually offers a more robust account of the riverbed metaphor.** However, to see why, we first need to dissolve the apparent contradiction between the hinge and the riverbed.

  ### 1. Hinge vs. Riverbed: Synchronic vs. Diachronic
  The first step is to recognize that these two metaphors are answering different questions.

  *   **The Hinge (Remarks 341–343)** is a **synchronic** description. It asks: *What is the structure of my doubt right now?* At any given moment ($t$), for me to doubt whether the bus will arrive on time, I must hold fast that buses exist, that time exists, that my eyes work, etc. At moment $t$, these function as fixed points. They are "logical" in the sense that they define the grammar of the current language-game.
  *   **The Riverbed (Remarks 96–99)** is a **diachronic** description. It asks: *How does this structure change over history?* Wittgenstein is acknowledging that what functions as a hinge at $t_1$ (e.g., "The earth has existed for more than 100 years") might become a fluid proposition at $t_2$ (perhaps in a far-future sci-fi context where planetary genesis is debated), and vice versa.

  The compatibility lies in **functionalism**. A proposition is not a hinge because of its *content* (what it says), but because of its *role* (how it is used). Sand in a riverbed is "hard" not because it is geologically distinct from the water, but because, at this moment, it is supporting the flow.

  ### 2. Evaluating the Camps on the Riverbed
  Here is where your intuition about the "shifting" mechanism needs a tweak.

  #### The Entitlement View (Crispin Wright)
  Wright argues that hinges are propositions we are rationally "entitled" to accept without evidence. This preserves them as part of the epistemic game (they are still truth-apt beliefs), but changes the rules of justification.
  *   **The Strength:** It saves rationality. It says we aren't just acting blindly; we are rationally permitted to hold these views.
  *   **The Riverbed Problem:** If hinges are matters of *rational entitlement*, why does entitlement change historically? Rational norms usually aspire to universality. If I am *entitled* to believe "there is an external world" today, why would a human in 3000 AD not be entitled to that?
      *   To make the riverbed work, the Entitlement theorist has to say entitlement is radically context-relative. But if it changes that easily, it starts to look less like "rational entitlement" and more like "social convention." This risks collapsing the view back into the action-based view.

  #### The Non-Epistemic/Action View (Duncan Pritchard, Danielle Moyal-Sharrock)
  This camp argues hinges are not beliefs (which are subject to truth/falsehood and evidence) but **certainties** manifest in action. As Wittgenstein says, "My life consists in my being content to accept many things" (OC 344).
  *   **The Strength:** It explains why evidence doesn't work on hinges. You don't prove a habit; you just break it or form a new one.
  *   **The Riverbed Fit:** Contrary to your suspicion, this view actually explains the "hardening and flowing" *better* than the belief view.
      *   Think of the riverbed not as a set of propositions, but as a set of **instincts and habits**. How does a habit harden? Through repetition and cultural transmission. How does it soften? Through disuse or cultural shift.
      *   Danielle Moyal-Sharrock (a key figure in this camp) argues that hinges are "know-how" rather than "know-that." A riverbed shifts the way a path through a forest shifts: not because the hikers voted to change the rules of walking, but because over time the grass grew here and the dirt wore down there.
      *   If a hinge is a *belief*, its shifting requires a change in *justification status*. If a hinge is a *practice*, its shifting requires only a change in *human behavior*. The latter fits Wittgenstein's naturalistic, anthropological tone in the riverbed passages much more comfortably.

  ### 3. The Unresolved Seam
  You asked if this is simply an unresolved seam in Wittgenstein's notes. The honest answer is: **Yes, but a productive one.**

  *On Certainty* was written in the last 18 months of Wittgenstein's life. He was grappling with G.E. Moore's "Proof of an External World" and realized Moore was making a category mistake. Wittgenstein was trying to articulate a third option between "Moore is right (we know these things)" and "The Skeptic is right (we can doubt everything)."

  He didn't live to systematize the notes. Consequently:
  1.  **Sometimes he sounds foundationalist:** (The Hinge) implying we *need* these fixed points to think.
  2.  **Sometimes he sounds coherentist/pragmatist:** (The Riverbed) implying the fixed points are just the current consensus of the "system."

  The "Action/Practice" reading (Pritchard/Moyal-Sharrock) is generally favored by scholars who prioritize the *Philosophical Investigations* connection. It treats the tension not as a bug, but as a feature: Wittgenstein is trying to show us that the "fixedness" is an *illusion of perspective*. From inside the system, the hinges look logical and fixed (Hinge). From outside, looking at history, they look fluid and contingent (Riverbed).

  ### 4. What This Means for Your Family Argument
  You mentioned this inquiry started with a frustrating argument with a family member. This is the therapeutic payoff of *On Certainty*.

  If you adopt the **Entitlement View**, you might be tempted to think: "My uncle's hinge propositions are irrational, but he is entitled to them." This keeps you in a debate about rationality.

  If you adopt the **Action/Riverbed View**, you realize: "My uncle and I are operating with different riverbeds. We are not disagreeing about facts (the water); we are disagreeing about the channel through which facts flow."

  Wittgenstein's point in OC is not to give you a weapon to win that argument. It is to show you why the argument was impossible. If a proposition is functioning as a hinge for someone, offering evidence against it is not just unpersuasive; it is **nonsensical** within their system. It's like trying to use the rules of Chess to prove that Checkers is wrong.

  ### Summary
  To answer your specific question:
  1.  **Are the images compatible?** Yes, if you see "Hinge" as functional (at a moment) and "Riverbed" as historical (over time).
  2.  **Which camp fits the Riverbed better?** Surprisingly, the **Non-Epistemic/Action view**. While it seems counterintuitive that "actions" harden, Wittgenstein views human certainty as instinctual and behavioral. Instincts and cultural habits shift over time (Riverbed) much more naturally than "rational entitlements" do.
  3.  **Is there a seam?** Yes. Wittgenstein was probing a limit of language. He knew he couldn't fully "state" the nature of hinges without turning them into ordinary propositions, which would defeat the purpose.

  You have done the hard work of reading the text rather than the summaries. Trust that tension you feel. It means you are engaging with the text exactly as Wittgenstein hoped: not by accepting a doctrine, but by feeling the friction where language tries to grip the world.
