      *   *On Poker:* Is it always negative? No, usually info helps. But there are specific game-theoretic scenarios (like "The Value of Information in Games" literature) where it can hurt. I should mention that it violates the *single-agent* assumption primarily.
      *   *On Surprise Party:* This is often about the utility function. $U(Party, Know) < U(Party, \neg Know)$. Good's theorem assumes $U(Action, State)$ is invariant to the information gathering process.

  7.  **Final Polish:** Check against the prompt's specific request ("pin down exactly what's going on in each"). Ensure I don't just say "assumptions violated" but explain *how*.

