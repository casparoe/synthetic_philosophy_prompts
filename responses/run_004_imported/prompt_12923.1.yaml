      *   **Physics Context (Quantum Mechanics):** This is where Saunders' work is most relevant (fermions vs. bosons). Fermions are weakly discernible (Pauli exclusion). Bosons are trickier. This adds weight to the idea that it's not just a "sleight of hand" but a useful tool in physics, even if metaphysically contentious.
      *   **Implications for the Novel:** How does this affect the story?
