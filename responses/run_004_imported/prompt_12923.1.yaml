answer: |-
  You have hit on exactly the right nerve. The circularity objection you're half-remembering is the standard counter-punch to the weak discernibility defense, and it is why Black's spheres remain a staple in metaphysics seminars rather than a closed case.

  Your friend is right that Simon Saunders (along with F.A. Muller and others) revitalized this debate, specifically applying it to quantum mechanics (where particles often look like Black's spheres). But whether weak discernibility is a "genuine rescue" or "technical sleight of hand" depends entirely on whether you think relations are ontologically prior to individuals, or vice versa.

  Here is the breakdown of the specific mechanical failure point you're sensing.

  ### 1. The Mechanics of Weak Discernibility
  To recap briefly where you left off: Leibniz's Principle of the Identity of Indiscernibles (PII) states that if $x$ and $y$ share all properties, $x = y$. Black argues the spheres share all monadic properties (mass, color) and all relational properties (distance from the other sphere).

  The "Weak Discernibility" move redefines what counts as a discerning property.
  *   **Absolute Discernibility:** $x$ has a monadic property $F$ that $y$ lacks. (e.g., $x$ is red, $y$ is blue).
  *   **Relative Discernibility:** $x$ bears an asymmetric relation $R$ to $y$. (e.g., $x$ is to the left of $y$).
  *   **Weak Discernibility:** $x$ bears a symmetric but **irreflexive** relation $R$ to $y$. (e.g., $x$ is one mile from $y$).

  Since nothing can be one mile from *itself*, the existence of this relation logically entails $x \neq y$. Saunders argues this satisfies PII because the relation "is one mile from" is a genuine physical property of the system, and it distinguishes the relata.

  ### 2. The Circularity Objection (Your Intuition)
  Your intuition that this feels circular is the standard metaphysical objection, often associated with philosophers like Robert Adams or Katherine Hawley.

  The argument runs like this: For the relation "is one mile from" to be instantiated, there must already be *two distinct relata* to stand in that relation. You cannot have a distance without two endpoints. If you need two distinct endpoints to ground the relation, you cannot use the relation to *ground* the distinctness.

  In logical terms, to assert $\exists x \exists y (Rxy)$, the domain of quantification must already contain two distinct individuals. If the metaphysics requires individuals to exist *before* they can enter into relations, then weak discernibility presupposes what it tries to prove. It saves the *statement* of PII only by assuming the falsity of Black's conclusion (that there are two distinct things) in the premises.

  ### 3. The Structuralist Counter (Why it might not be sleight of hand)
  Saunders and his allies bite the bullet here. They argue from a position of **Ontic Structural Realism**. They claim that individuals are not prior to relations; rather, the structure (the web of relations) is fundamental, and "objects" are just nodes in that structure.

  From this view, it is not circular. The universe contains a structure defined by "two points separated by distance $d$." The distinctness of the points is *constituted* by the irreflexive relation, not presupposed by it. In this framework, PII is saved, but the cost is high: you have to abandon the idea that "substance" or "thisness" (haecceity) is fundamental. The spheres aren't two *things* that happen to be apart; they are a single structural fact that implies duality.

  ### 4. The "Triviality" Worry
  There is a second objection that might resonate with your novelist brain. If we allow *any* irreflexive relation to count as a discerning property, does PII become a tautology?

  If I say, "These two spheres are distinct because they bear the relation 'being distinct from' to each other," I haven't explained anything. That's trivial.
  Defenders of weak discernibility say, "No, 'distance' is a physical, qualitative relation, not just logical distinctness."
  Critics reply: "But in a symmetric universe, the distance is the *only* thing. If the only qualitative difference between $x$ and $y$ is that they aren't the same object, you've effectively defined distinctness as distinctness."

  This is why many philosophers still treat Black's case as a counterexample to the *spirit* of Leibniz, even if it technically satisfies the *letter* of the principle under weak discernibility. Leibniz wanted a qualitative reason for individuality (a "thisness" or a unique bundle of qualities). Weak discernibility provides a structural reason, but not a qualitative one in the traditional sense. It saves the principle by watering down what "qualitative" means.

  ### 5. Implications for Your Novel
  This philosophical stalemate is actually gold for your narrative. You have two distinct ontological options for your pocket universe, each with different thematic weight:

  **Option A: Weak Discernibility Holds (Structuralism)**
  The two spheres are distinct *only* because of the tether/distance between them.
  *   **The Vibe:** The universe is a single holistic structure. The protagonists aren't truly independent entities; they are mirror nodes in a single equation.
  *   **The Conflict:** If they ever meet or the symmetry breaks, does one cease to exist? Do they collapse into a singularity? Their identity is dependent on their separation.
  *   **Philosophy:** Saunders/Muller. Identity is derived from relation.

  **Option B: Weak Discernibility Fails (Haecceitism)**
  The relation presupposes distinctness, so there must be some primitive "thisness" (haecceity) that makes Sphere A Sphere A, independent of its properties.
  *   **The Vibe:** There is a metaphysical brute fact that makes them two. Even if you removed the distance, they would still be "two."
  *   **The Conflict:** This suggests a hidden variable in your universe. Maybe the symmetry isn't perfect at the metaphysical level. Maybe the protagonists can sense that they are "the original" vs "the copy" even if physics says they are identical.
  *   **Philosophy:** Adams/Black. PII is false; numerical diversity can exist without qualitative difference.

  ### The Verdict
  Is weak discernibility a sleight of hand?
  *   **If you believe objects are prior to relations:** Yes, it's circular.
  *   **If you believe relations are prior to objects:** No, it's a genuine solution.

  Since physics (specifically quantum mechanics regarding fermions) leans heavily toward the structuralist view these days, Saunders' position is scientifically respectable. However, in classical metaphysics, the circularity objection keeps Black's spheres alive as a counterexample to the *strong* interpretation of PII.

  For your book, the tension is real. You don't have to pick a side, but your characters might. One might argue, "We are two because we are apart," while the other argues, "We are apart because we are two." That is the exact metaphysical fault line of your setting.
