answer: |-
  The conference room air conditioning had given up an hour ago, leaving the air thick and still. On the table between them lay a single sheet of paper—the paralegal's memo—weighted down by a heavy glass paperweight.

  Elena rubbed her temples. Marcus was staring out the window, watching the rain blur the city skyline.

  "Forty-five minutes," Elena said. "We have to walk into that hearing room in forty-five minutes and read a joint finding. We were agreed on the fifty-fifty split. The assets are liquid, the histories are symmetric. It was clean."

  "It's not clean anymore," Marcus said, turning from the window. He tapped the memo. "Chen can take the Veridian contract. Singh cannot. The licensing statute is explicit. That means Chen's maximum possible utility just doubled. Singh's ceiling is unchanged. Their disagreement points—their walk-away options—are identical to what they were yesterday."

  "And your point?"

  "My point is the Kalai-Smorodinsky solution moves," Marcus said, sitting down. "The ideal point shifts. The line from the disagreement point to the utopia point steepens. The intersection with the Pareto frontier moves toward Chen. Chen gets more. Singh gets less."

  Elena shook her head, opening her laptop. "The Nash solution doesn't care about the utopia point. It cares about the local geometry of the feasible set at the solution. If the marginal rate of substitution hasn't changed—if the cost of giving Chen an extra dollar is still one dollar from Singh—then the product of gains is still maximized at the center. Independence of Irrelevant Alternatives, Marcus. The fact that Chen *could* have gotten more in a hypothetical scenario that doesn't impact the current trade-off shouldn't penalize Singh."

  "That's exactly where IIA feels like a bug, not a feature," Marcus countered, leaning in. "Think about the intuition. Bargaining is about relative concessions. If Chen's potential ceiling rises, she is conceding *less* of her potential by settling at the old split than Singh is. To keep the relative concessions equal, Chen has to walk away with more. Monotonicity isn't just math; it's the recognition that bargaining power is relative. If your best-case scenario improves and mine doesn't, your leverage has objectively increased, even if our fallbacks are the same."

  "Leverage how?" Elena snapped. "If they walk away, they both get zero. That hasn't changed. If they cooperate, the marginal cost of transfer hasn't changed. Why should Singh be punished because Chen found a loophole that benefits only her? Under Nash, the solution is invariant to expansions of the feasible set that don't alter the local tangent. It protects the agreement from being held hostage by phantom options."

  "Phantom?" Marcus raised an eyebrow. "The contract is real. The licensing is real. It's not a phantom option; it's a change in the shape of the world. If we use Nash, we're telling Singh: 'It doesn't matter that Chen can now generate twice the value alone; your share is locked.' But we're also telling Chen: 'Your improved position is irrelevant.' That creates an incentive to hide information about the feasible set. If Chen knew Nash was the rule, she'd have an incentive to make the Veridian contract look like a separate, irrelevant alternative rather than part of the partnership dissolution."

  Elena paused, her fingers hovering over the keyboard. "That's the Rubinstein argument. Strategic stability. If we model this as alternating offers with vanishing time intervals, we converge to Nash. We don't converge to Kalai-Smorodinsky. KSBS lacks a non-cooperative foundation. It's a normative wish, not a strategic prediction. If we award based on KSBS, we aren't predicting what rational agents would agree to; we're imposing a moral heuristic."

  "Maybe rational agents in a vacuum agree to Nash," Marcus said. "But we aren't in a vacuum. We are arbitrators. We are the mechanism. If I impose Nash, I am ignoring the change in the 'threat potential'—not the threat to walk away, but the threat to say, 'I could have done so much better without you.' Nash ignores the scale of the possible. It only looks at the scale of the necessary."

  "And KSBS pays for that insensitivity to the local trade-off," Elena shot back. "You know the weakness of your position. KSBS is sensitive to the shape of the Pareto frontier *far away* from the solution. If Chen's maximum utility increases, but only in a region of the feasible set that requires destroying immense value for Singh to reach—like, a region that's practically unattainable—KSBS still shifts the award toward Chen. Just because the *ideal point* moved. It allows the 'utopia' to drag the solution, even if that utopia is inefficiently costly to approach."

  Marcus nodded slowly. "I concede that. If the frontier is concave enough, KSBS can award Chen more even if the marginal cost of doing so is astronomical for Singh. It prioritizes the *ratio* of gains over the *efficiency* of the margin. That is a price. But look at the price you pay, Elena. IIA implies that if you add an option that benefits only Chen, but keep the original agreement feasible, the agreement *must not change*. That means Singh is insulated from Chen's success, which sounds nice, but it also means Chen is insulated from Singh's stagnation. It treats the bargaining problem as static. But this dissolution is dynamic. The Veridian contract changes the *relationship* of their values."

  "It treats the bargaining problem as consistent," Elena corrected. "If the solution changes just because we realized the set was larger, even though the local trade-offs are identical, then the solution is manipulable by how we frame the feasible set. Do we include the Veridian contract as part of the partnership assets or as a post-dissolution opportunity for Chen? If it's post-dissolution, it's irrelevant to the split of *current* assets. Nash respects that boundary. KSBS blurs it. If Chen can argue the contract is 'conceivable,' she pulls the ideal point. If Singh argues it's 'separate,' she pushes it back. Nash avoids that debate by focusing on the disagreement point and the local frontier."

  "But the disagreement point is a floor," Marcus said, his voice softening. "It's the worst-case. Why should fairness be anchored only to the worst-case and the local margin? Why not anchor it to the best-case too? Human intuition about fairness is about relative standing. If two climbers are roped together, and one finds a handhold that lets them reach a much higher ledge, even if they don't take it, the dynamic of the rope changes. The one with the handhold has more slack. KSBS acknowledges the slack. Nash assumes the rope is rigid."

  Elena leaned back, crossing her arms. "And if the handhold is illusory? If Chen claims she could get a billion dollars, but realistically she can't? KSBS uses the *feasible* maximum, yes, but 'feasible' is legally contestable. Nash is robust to that contestation because it doesn't look at the maximum. It looks at the tangent. It's harder to game."

  "Robustness isn't justice," Marcus said. "We're not building an algorithm for bots. We're settling a human dispute. If Chen walks out of here with 50% when she could have generated 80% of the value on her own, and Singh walks out with 50% when he could only generate 20% on his own, they haven't split the *gains from cooperation* equally. They've split the *assets* equally. But the gains from cooperation are the difference between the agreement and the disagreement. Wait—no. The gains are the surplus. But the *power* to generate that surplus is asymmetric now."

  Elena sighed. "Here is the crux, Marcus. And I need you to hear it. IIA fails the monotonicity test. I admit it. It feels cold to say Chen's improved potential doesn't matter. But Monotonicity fails the consistency test. If we expand the feasible set in a way that doesn't change the local trade-off, KSBS changes the award. That implies the value of a dollar depends on how much *else* is available, even if that 'else' is inefficient. You are willing to sacrifice local efficiency for global proportionality. I am willing to sacrifice global proportionality for local consistency."

  Marcus looked down at the memo. "I am willing to sacrifice consistency because proportionality feels more like what people mean by 'fair.' If my ceiling rises, I should get more. If yours stays flat, you should get less. To do otherwise feels like punishing success."

  "And I am willing to sacrifice proportionality because stability feels more like what people mean by 'agreement.' If the trade-off hasn't changed, the deal shouldn't change. To do otherwise feels like punishing the status quo."

  They sat in silence for a moment. The rain hammered against the glass.

  "We can't derive one from the other," Elena said quietly. "Arrow forced social choice to choose between transitivity and independence. We're forced to choose between independence and monotonicity. Both are coherent. Both are defensible. But they are not compatible."

  "No," Marcus agreed. "They aren't."

  "So," Elena said, picking up her pen. "We have to decide which failure mode we can live with. Do we want to tell Chen that her new contract is irrelevant to the division of the old assets? Or do we want to tell Singh that his share shrinks because Chen found a loophole, even though the cost of transferring value to her hasn't changed?"

  Marcus picked up his own pen. He didn't open his file. "If we go Nash, we preserve the integrity of the current asset pool. If we go KSBS, we acknowledge the shift in their future trajectories."

  "The hearing is in thirty minutes," Elena said.

  "I know."

  They looked at each other. There was no synthesis waiting in the wings. No third axiom that would save them. There was only the choice of which intuition to betray.

  "Write the draft," Elena said. "Write both. We'll argue the crux in the room. Let the partners hear where the fork is."

  Marcus nodded. "Agreed. But Elena?"

  "Yes?"

  "If we go KSBS... make sure we calculate the ideal point correctly. If Chen's legal team inflated her maximum, the whole line tilts wrong."

  "And if we go Nash," Elena replied, "make sure we define the feasible set narrowly. If they include the Veridian contract in the partnership assets, the frontier changes, and Nash moves anyway."

  "Then the fight isn't about the axiom," Marcus said, a faint smile touching his lips. "It's about the setup."

  "It's always about the setup," Elena said, opening a new document. "But at least now we know why."
