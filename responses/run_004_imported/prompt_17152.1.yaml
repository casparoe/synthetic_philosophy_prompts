      *   *Nuance:* Distinguish between "believing it's true" (Realism) and "believing it's empirically adequate" (Van Fraassen). The Bad Lot pushes you toward the latter.
      *   *User's specific question:* "Is there something special about explanatory reasoning?" Yes, because explanatory virtues (simplicity, scope) are pragmatic, not necessarily truth-conducive.

