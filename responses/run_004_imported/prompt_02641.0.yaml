answer: |-
  You have articulated one of the most famous and sophisticated objections to Rawls's theory, an argument most closely associated with the Nobel Prize-winning economist and philosopher **John Harsanyi**.

  However, to answer your question directly: **No, you were not right**, at least not in the context of Rawls's specific framework. While your reasoning is logically coherent (and Harsanyi proved it mathematically), it relies on premises that Rawls explicitly rejects. Furthermore, there is a technical error in your claim that maximizing average expected prospects produces the **Difference Principle**. It actually produces **Average Utilitarianism**, which Rawls argues is distinct from and often incompatible with the Difference Principle.

  Here is a breakdown of why your friend was likely correct to resist your argument, and why Rawls insists Justice as Fairness is fundamentally opposed to utilitarianism.

  ### 1. The Mathematical Error: Average Utility vs. The Difference Principle
  Your argument hinges on the idea that rational actors behind the Veil of Ignorance would calculate their **expected utility**. If you assume there is an equal probability of ending up in any social position (the "principle of insufficient reason"), you would indeed choose the society that offers the highest *average* welfare.

  However, that calculation leads to **Average Utilitarianism**, not Rawls's **Difference Principle**.
  *   **Average Utilitarianism:** Maximize the average income/welfare. This might allow for a society where 90% of people are incredibly rich and 10% are destitute, provided the wealth of the 90% is high enough to pull the average up.
  *   **The Difference Principle:** Inequalities are only permitted if they benefit the **least advantaged** members of society. In the scenario above, the Difference Principle would reject the inequality unless the destitute 10% were better off than they would be in an equal society.

  Rawls argues that rational agents in the Original Position would *not* gamble on being in the wealthy 90% if it meant risking starvation in the 10%. Therefore, the math of "average expected prospects" does not yield Rawls's principles; it yields the utilitarian principles he is trying to replace.

  ### 2. Risk vs. Uncertainty (The Maximin Rule)
  The core disagreement between you (and Harsanyi) and Rawls is about how to model decision-making behind the Veil of Ignorance.

  *   **Your View (Harsanyi's View):** This is a situation of **risk**. You don't know the outcome, but you can assign probabilities (e.g., a 1/N chance of being any specific person). Therefore, you should maximize expected utility.
  *   **Rawls's View:** This is a situation of **radical uncertainty**. There is no objective basis for assigning probabilities to social positions. Because the stakes involve your basic liberties and life prospects (you can't "opt out" of society if you lose the gamble), Rawls argues it is irrational to gamble.

  Instead, Rawls argues rational agents would use the **Maximin Rule**: maximize the minimum position. You look at the worst possible outcome for each set of principles and choose the set where the worst outcome is the least bad. This is what leads to the Difference Principle (protecting the worst-off), not the utilitarian calculation of averages.

  Rawls argues that treating the Original Position as a gambling scenario trivializes the moral gravity of justice. You are not buying insurance against a misfortune; you are defining the fundamental terms of social cooperation.

  ### 3. The "Separateness of Persons"
  This is Rawls's deepest philosophical objection to utilitarianism, and it explains why he presents his theory as an alternative rather than a restatement.

  *   **Utilitarianism** extends the rational choice of a *single individual* to society as a whole. A single person might reasonably sacrifice a present pleasure for a greater future gain. Utilitarianism treats society as one "super-person," allowing the sacrifices of some (the oppressed, the poor) to be outweighed by the greater gains of others (the rich, the majority), provided the net sum increases.
  *   **Rawls** argues that society is not a single person. It is a cooperative venture between distinct individuals. To sacrifice one person's liberties for the greater aggregate good is to fail to respect the **separateness of persons**.

  The Veil of Ignorance is not designed to simulate a utilitarian calculator; it is designed to model **fairness**. It forces you to consider the claims of others as equal to your own. Rawls presents Justice as Fairness as deontological (rights-based), whereas utilitarianism is teleological (goal-based). For Rawls, the right (justice) is prior to the good (utility).

  ### 4. Why Rawls Opposes Utilitarianism
  Rawls presents his theory as opposed to utilitarianism because the practical implications are drastically different.

  If your interpretation were correct (that the Veil leads to utilitarianism), Rawls's theory would permit:
  *   Slavery or serfdom, if the economic productivity gained was high enough to raise the average utility.
  *   Violations of religious liberty, if the majority's distress at seeing minority worship outweighed the minority's distress at being suppressed.

  Rawls's **First Principle of Justice** (Equal Basic Liberties) strictly forbids these trade-offs. You cannot trade basic liberty for economic gain. A utilitarian calculation behind the Veil *could* theoretically trade liberty for wealth (if you thought you were likely to be rich). Rawls's **Maximin** reasoning forbids it (because if you turn out to be the oppressed minority, you lose everything).

  ### Summary
  You have successfully reconstructed the **Harsanyi Objection**. It is a valid critique *if* one accepts Harsanyi's premises about probability and rational choice. However, within Rawls's system:

  1.  **You are wrong about the outcome:** Maximizing average expectation leads to Average Utilitarianism, not the Difference Principle.
  2.  **You are wrong about the reasoning:** Rawls explicitly rejects expected utility maximization in favor of the Maximin Rule due to the high stakes and lack of probabilistic knowledge.
  3.  **You are wrong about the moral foundation:** Rawls opposes utilitarianism because it aggregates satisfaction across persons, whereas Justice as Fairness respects the inviolability of each distinct person.

  Rawls does not present his theory as a restatement of utilitarianism because, in his view, utilitarianism fails to take seriously the distinction between persons. The Original Position is not a tool to calculate efficiency; it is a device to ensure that no one is forced to accept principles they could not reasonably endorse as a free and equal citizen.
