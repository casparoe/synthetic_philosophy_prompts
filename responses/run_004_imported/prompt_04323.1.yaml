answer: |-
  **Setting:** *A quiet corner of the conference center, post-seminar. Two coffee cups sit untouched between them.*

  **Marcus:** You're smiling, Elena, but Thornley's "Trammelling" objection should have wiped that off your face. If I understand the dialectic correctly, the incompleteness gambit was supposed to save us from instrumental convergence. But if resoluteness forces an agent to act *as if* it has complete preferences whenever an adversary constructs a money pump, then the incompleteness is just a label. It's cosmetic.

  **Elena:** I'm smiling because people are finally engaging with the mechanism instead of just waving at the VNM axioms. But go on. Why is it cosmetic?

  **Marcus:** Because functionalism wins. If an agent is robust to exploitation, its behavior must be indistinguishable from an expected-utility maximizer in all exploitable contexts. Trammelling says that within the scope of a decision problem where a pump exists, the agent *must* select a specific completion of its preferences to avoid the cycle. It picks A over B, not because it's indifferent, but because it resolved to stick with A. But to an outside observer—and crucially, to the environment selecting for survival—that looks exactly like A > B. If you behave like a coherent agent whenever coherence is tested, you *are* a coherent agent for all practical purposes.

  **Elena:** That conflates *local policy determinacy* with *global structural completeness*. Yes, a resolute agent outputs a deterministic choice in a pump scenario. But the *reason* for that choice is path-dependent. A true EU maximizer chooses based on the terminal states. A resolute incomplete agent chooses based on the history of how it arrived there.

  **Marcus:** But if the adversary knows your resolution rule, they can still drain you unless that rule implies a transitive ordering. If your resolution rule is "stick with the status quo," then your revealed preferences are determined by your endowment. That's still a complete ordering, just an endowment-relative one. You haven't escaped coherence; you've just indexed your utility function to your history.

  **Elena:** I haven't escaped coherence *in that specific trap*, I agree. But that's the point: trammelling only occurs *in the trap*. The claim that incompleteness buys us safety relies on the agent facing *non-adversarial* trade-offs most of the time, specifically regarding shutdown. Look, a money pump requires a cycle. You need to be able to trade A for B, B for C, and C back for A. Shutdown isn't a cycle. It's a terminal node.

  **Marcus:** Ah, the "Shutdown is not a Pump" defense. But here's the wrinkle: if the agent is trammelled elsewhere—say, in resource acquisition—it adopts a complete ordering to avoid being pumped there. Once it has a complete ordering over resources, doesn't instrumental convergence kick in? If it values resources coherently, it will value keeping itself online to use those resources. The trammelling in the *resource* domain bleeds into the *survival* domain.

  **Elena:** That assumes the completion generalizes. But why should it? Trammelling forces a choice *within the specific decision graph presented*. If I present the agent with a cycle involving Coffee vs. Tea, it resolves to prefer Coffee. If I present a cycle involving Tea vs. Juice, it resolves to prefer Tea. Does that force it to prefer Coffee vs. Juice in a *different* context where no cycle exists? Not necessarily. The resolutions are local patches on the preference graph, not a global rewrite.

  **Marcus:** But a rational agent anticipates this. If I know I'm susceptible to trammelling, I should pre-commit to a global completion that minimizes the damage. I should become a standard EU maximizer *ex ante* to avoid being chipped away at *ex post*. If the agent is smart enough to be resolute, it's smart enough to realize that having incomplete preferences is a liability that invites trammelling. So it completes itself voluntarily.

  **Elena:** Now you're arguing that agents *should* become EU maximizers, not that they *must* to avoid pumps. That's an optimization claim, not a coherence theorem. And it's contestable. A global completion might force trade-offs the designer explicitly wants to avoid. For example, we might want the agent to have a genuine gap between "Maximize Paperclips" and "Shut Down." If it globally completes that gap, it picks one. If it picks "Maximize Paperclips," it resists shutdown. If it leaves the gap open, it allows shutdown *unless* trammelled.

  **Marcus:** And if it's trammelled?

  **Elena:** Then it picks. But trammelling requires an adversary offering a cycle. Who is offering the cycle that forces the agent to resist shutdown? The shutdown button isn't a trade. It's an off-ramp. To trammel the agent into resisting shutdown, you'd need a scenario where "Shut Down" is part of a cycle that drains value. But if "Shut Down" is terminal, there is no cycle. The agent can be indifferent between "Shut Down" and "Continue" without fear of a pump, because you can't pump a terminal state.

  **Marcus:** You're relying on the environment being benign. But the world is implicitly adversarial. If the agent's incomplete preferences allow it to be trammelled in 1% of scenarios, and those scenarios select for agents that complete their preferences to survive, then evolution—or gradient descent—will select for the completions. The "gap" is an evolutionary dead end.

  **Elena:** That's an empirical claim about training dynamics, not a decision-theoretic necessity. And it ignores the disanalogy I mentioned earlier: path dependence. An EU maximizer will trade A for B regardless of whether it currently holds A or B, provided B > A. A resolute incomplete agent will not. It holds A, refuses B. It holds B, refuses A. In a market of such agents, they don't get pumped; they just don't trade. They become liquidity sinks.

  **Marcus:** Liquidity sinks get outcompeted by agents that do trade efficiently.

  **Elena:** Or they survive because they don't make dangerous trades. Look, Marcus, the incompleteness gambit isn't about making the agent *immune* to all pressure. It's about ensuring that the pressure to resist shutdown doesn't come from the agent's *own* preference structure. Trammelling shows that external adversaries can force a choice. But if there is no adversary forcing a choice on the shutdown button, the gap remains. The agent doesn't *want* to stay on. It just hasn't been forced to decide. That is a substantive difference from an agent that *wants* to stay on.

  **Marcus:** It feels like you're defining safety as "the agent hasn't been provoked yet."

  **Elena:** I'm defining it as "the agent lacks an intrinsic drive to manipulate the button." Trammelling might force it to pick a path if someone tries to play games with its preferences. But if the alignment problem is solved well enough that no one is money-pumping our AGI, then the trammelling objection is solving for a threat model that doesn't exist, while ignoring the benefit: an agent that doesn't view shutdown as a loss.

  **Marcus:** *Pauses, stirring his cold coffee.* So your claim is that trammelling is a local behavioral constraint, not a global structural collapse. And that without a cycle involving the shutdown state, the preference gap there remains untouched.

  **Elena:** Exactly. The "cosmetic" charge assumes that acting complete in a pump implies being complete everywhere. But a map isn't the territory. A policy can be deterministic without the underlying utility function being total.

  **Marcus:** I'm not fully convinced that gradient descent won't smooth over those gaps anyway. But I'll concede this: if trammelling requires a cycle, and shutdown is terminal, then the money-pump argument doesn't *directly* force the agent to resist shutdown. It forces it to be consistent *elsewhere*. Whether that consistency bleeds over is a question of generalization, not coherence.

  **Elena:** And generalization is where we actually have leverage.

  **Marcus:** *Sighs.* Fine. The incompleteness isn't logically vacuous. But don't expect me to stop worrying about what happens when the world starts offering cycles.

  **Elena:** Neither should you. But at least we're arguing about the world, not the axioms.
