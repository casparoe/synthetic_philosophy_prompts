  *Drafting thought:* Make sure Marcus hits the "Behavioral Isomorphism" hard. If I can't distinguish you from an EU maximizer by watching your choices, you *are* an EU maximizer for all functional purposes.
  *Elena's response:* Distinguish *policy* from *objective*. The objective is incomplete; the policy is complete because policies must be actionable. The gap exists in the *evaluation*, not necessarily the *output* under constraint.

  *Wait, one nuance:* Thornley's argument is specifically that incomplete preferences allow for *shutdownability*. If trammelling forces the agent to complete its preferences to avoid pumps, does it complete them in a way that makes it resist shutdown?
