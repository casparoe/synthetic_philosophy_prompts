answer: |-
  This is a classic and deeply sensible question, particularly for someone with your background. As a physicist, you are trained to trust conservation laws and to reject models that violate empirical reality. If a theory predicts that mass can be created from nothing, the theory is wrong.

  However, the reason mathematicians have not discarded the Axiom of Choice (AC) lies in a fundamental category error: **Mathematics is not Physics.**

  Here is the breakdown of why Banach-Tarski does not falsify AC, structured around the distinction between mathematical abstraction and physical reality.

  ### 1. The Category Error: Axioms vs. Hypotheses
  In physics, a hypothesis is a claim about the behavior of the physical universe. It is subject to empirical falsification. If an experiment contradicts it, the hypothesis is discarded.

  In mathematics, axioms are not claims about the universe; they are **rules of a game**. They define the logical framework within which we reason. The question regarding an axiom is not "Is this physically true?" but "Is this consistent?" and "Is this useful?"

  The Axiom of Choice is consistent with the other standard axioms of set theory (Zermelo-Fraenkel, or ZF). It cannot be "falsified" empirically because it does not make predictions about physical objects; it makes statements about abstract sets. Banach-Tarski is a theorem *within* that logical system, not a prediction about steel balls in a laboratory.

  ### 2. The Mathematical Mechanism: Non-Measurable Sets
  To a physicist, the most unsettling part of Banach-Tarski is the apparent violation of the additivity of volume. If you take an object, cut it into pieces, and reassemble them, the total volume should remain constant.

  Mathematically, volume is formalized by **Lebesgue measure**. The conservation of volume relies on the property of countable additivity: if you have disjoint sets $A$ and $B$, then $\mu(A \cup B) = \mu(A) + \mu(B)$.

  However, this property **only holds for measurable sets**.

  The "pieces" used in the Banach-Tarski paradox are **non-measurable sets**. They are constructed using the Axiom of Choice to select points in such a scattered, pathological way that it is impossible to assign them a consistent volume.
  *   Because the pieces have no defined volume, the law of conservation of volume does not apply to them.
  *   The paradox essentially says: "If you allow sets that have no volume, you can rearrange them to form shapes that do have volume."

  In physics, every piece of matter has a mass and occupies a volume. There is no such thing as a "non-measurable" chunk of lead. Therefore, the mathematical objects required for Banach-Tarski simply do not exist in the physical world.

  ### 3. The Physical Ball: Continuum vs. Discrete
  The Banach-Tarski paradox applies to a mathematical sphere, which is a continuum of points in $\mathbb{R}^3$. It relies on the ability to divide space infinitely.

  A physical ball is not a continuum. It is made of atoms.
  *   **Discreteness:** You cannot cut a physical ball into the infinitely complex, fractal-like pieces required by the proof. Once you reach the scale of atoms, the concept of a "set of points" breaks down.
  *   **Planck Scale:** Even if you ignore atoms and treat space as a field, quantum mechanics and the Planck length suggest there is a limit to physical divisibility.

  The paradox exploits the infinite divisibility of the mathematical continuum. Since the physical universe does not appear to be infinitely divisible in that specific set-theoretic sense, the paradox cannot be physically instantiated.

  ### 4. The Cost of Discarding AC
  If we were to discard the Axiom of Choice to avoid Banach-Tarski, we would break vast swathes of mathematics that *are* essential for physics.

  Without AC, we enter a mathematical universe (such as Solovay's model) where all sets of real numbers are measurable (so Banach-Tarski becomes impossible). However, the costs are severe:
  *   **Analysis:** Many fundamental theorems in analysis rely on AC (or weaker forms like the Hahn-Banach theorem).
  *   **Quantum Mechanics:** The existence of a basis for every vector space requires AC. Infinite-dimensional Hilbert spaces, which are the foundation of quantum mechanics, become much harder to work with without it.
  *   **Topology:** Tychonoff's theorem (the product of compact spaces is compact) is equivalent to AC. This is crucial for many areas of theoretical physics.

  Essentially, discarding AC to save intuition about volume would cripple the mathematical tools used to describe electromagnetism, quantum fields, and general relativity. Physicists generally prefer to keep the tools that work and accept that the mathematical continuum behaves differently than physical matter.

  ### 5. Summary: The Map is Not the Territory
  You are correct that if a *physical theory* predicted matter duplication, it would be falsified. But Set Theory is not a physical theory; it is a language for describing structure.

  The Banach-Tarski paradox reveals a peculiarity of the **mathematical continuum**, not a loophole in **physical conservation laws**. It shows that our intuition about "volume" does not extend to all possible subsets of $\mathbb{R}^3$.

  As a physicist, you can view it this way: The mathematical model ($\mathbb{R}^3$ with ZFC) is an approximation of physical space. It is an incredibly good approximation for almost all purposes, but like any model, it has regimes where it diverges from reality (in this case, at the scale of non-measurable sets). We do not discard the model because of this divergence; we simply recognize the domain of its applicability.

  We keep the Axiom of Choice because it builds a richer, more powerful mathematical framework, and we accept Banach-Tarski as a curious artifact of infinite sets that has no purchase on the physical world.
