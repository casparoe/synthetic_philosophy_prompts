  8.  *(Self-Correction during drafting)*: Make sure to explicitly state that the pieces in Banach-Tarski *cannot* be assigned a volume. That is the mathematical reason conservation of volume doesn't apply. Conservation of volume says $V(A \cup B) = V(A) + V(B)$ *if* A and B are measurable and disjoint. BTP uses non-measurable sets, so the equation doesn't hold.

  9.  **Final Review against User Query:** The user asks why AC hasn't been discarded as *empirically falsified*. I need to hit hard on the "empirical" part. Math isn't empirical.

