      *(Self-Correction during drafting)*: Wait, looking closely at the student's claim: "Bad conscience is really this same ressentiment, just turned inward."
      Nietzsche, Essay II, Section 16: "I regard the bad conscience as the serious illness that man was bound to contract under the stress of the most fundamental change he ever experienced - that change which occurred when he found himself finally enclosed within the walls of society and of peace."
