          *   Undermines partner's self-efficacy (they might think *they* did it, which is good, or that *you* did it without asking, which is bad).
          *   Sets a precedent for "I know what's best for you" behavior.

  5.  **Address the User's Specific Question:** "Is there actually anything wrong with doing this... or does keeping the method to myself matter morally on its own?"

