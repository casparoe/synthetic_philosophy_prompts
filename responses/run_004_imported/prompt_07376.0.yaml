answer: |-
  This is a thoughtful and nuanced ethical dilemma. You are navigating the space between **supportive partnership** and **paternalistic manipulation**. The fact that you are worrying about it suggests you have a strong moral compass regarding your relationship.

  To answer your question directly: **No, there is likely nothing inherently wrong with what you are doing, provided specific boundaries are respected.** However, the secrecy does carry a relational risk that is worth managing.

  Here is an breakdown of the ethics at play, why it feels uncomfortable, and how to handle it moving forward.

  ### 1. The Crucial Factor: Prior Consent
  The most significant ethical shield you have is that **your partner asked you to do this.**
  *   **Without the request:** Rearranging their environment to change their behavior without their knowledge would be manipulative. It would imply you know better than they do what is good for them, which undermines their autonomy.
  *   **With the request:** You are acting as an agent of *their* will, not your own. They explicitly authorized you to help them override their own impulses. In ethical terms, you are not violating their autonomy; you are acting as a scaffold for it.

  ### 2. The Ethics of "Nudging"
  What you are doing is a textbook example of **"choice architecture"** or **"nudging"** (a concept popularized by behavioral economists Thaler and Sunstein). You haven't removed the choice (they can still walk to the kitchen and get the phone); you have simply increased the "friction" of the bad habit and decreased the friction of the good habit.

  *   **The Ethical Nudge:** Generally considered ethical if it is in the person's best interest and doesn't restrict freedom of choice.
  *   **The Transparency Question:** Ethical nudging usually suggests transparency. However, in habit formation, conscious awareness of the "trick" can sometimes trigger psychological reactance (resistance), causing the person to rebel against the nudge. Your intuition that explaining it might break the spell is psychologically sound.

  ### 3. Why It Feels Uncomfortable
  You feel uneasy because intimacy is usually built on radical transparency. By keeping the mechanism secret, you are temporarily creating a dynamic where you are the "manager" and they are the "project."
  *   **The Risk:** If they find out later, they might feel infantilized ("You were tricking me?").
  *   **The Counter-Argument:** If the habit sticks, they will likely internalize the success ("I'm someone who reads at night instead of scrolling"). If you reveal the mechanics too soon, they might attribute the success to *your* arrangement rather than *their* choice, which undermines their self-efficacy.

  ### 4. Guidelines for Keeping it Ethical
  To ensure this remains a supportive act rather than a slippery slope into control, consider these boundaries:

  **A. Do Not Expand the Scope**
  This permission is specific to *this* request (phone use) and *this* goal (evening wind-down). Do not start applying this "silent management" to their diet, spending, social life, or other areas they haven't explicitly asked you to help with. That is where manipulation begins.

  **B. Respect the "Opt-Out"**
  You mentioned you haven't stopped them from getting the phone. Keep it that way. If they ever say, "Actually, I really want my phone tonight," do not guilt them or create new obstacles. The friction should be passive, not active resistance.

  **C. Plan for Eventual Transparency**
  You don't need to confess immediately and risk breaking the habit. However, secrecy shouldn't be permanent. Once the new habit is solidified (e.g., in a few months), it is healthy to bring it into the light.
  *   *How to reveal it:* You can frame it as a shared victory. "I'm so glad the evening routine is working better. I remember you asked for help with the phone, so I tried moving the charger to see if it made a difference. I didn't want to nag you about it, but I'm happy it's helping us both wind down."
  *   This shifts the narrative from "I tricked you" to "I supported your request in a way that felt sustainable."

  **D. Check Your Motivation**
  Periodically ask yourself: *Am I doing this for them, or for me?*
  *   **For them:** You want them to feel rested and present.
  *   **For you:** You are annoyed by their phone use and want to fix it without conflict.
  If the motivation shifts toward the latter, the secrecy becomes more problematic. Since they asked for help, it seems you are in the former category, but it is worth monitoring.

  ### Summary
  You are not lying, and you are not coercing. You are fulfilling a request for assistance using behavioral psychology rather than verbal nagging.

  The moral weight here rests on **intent** and **consent**. Since the intent is benevolent and the consent was given (even if the *method* wasn't specified), you are in the clear. The discomfort you feel is simply the tension between **efficacy** (it works better in secret) and **intimacy** (secrets feel distant).

  **Recommendation:** Continue for now, as interrupting a successful habit-formation process can be counterproductive. However, make a mental note to gently acknowledge your role in the change once the new behavior feels automatic for them. This restores full equality to the relationship while honoring the progress you've made together.
