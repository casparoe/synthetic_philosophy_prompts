answer: |-
  You had a good gut feeling, and you weren't just "stuck because of the beer." Alex is confidently overselling how settled this debate is, and he is conflating two very different philosophical questions: **metaphysics** (what is a cause?) and **ethics** (what are you responsible for?).

  Here is the breakdown of where Alex is right, where he is wrong, and why your intuition about the "billions of other people" is actually a famous philosophical objection.

  ### 1. Is it "Settled" in Metaphysics? (No.)
  Alex claimed that philosophers have settled that omissions (failures to act) are causes in the "exact same sense" as actions. **This is false.** It is one of the most contentious debates in the metaphysics of causation.

  There are two main camps, and they disagree fundamentally on the gardener example:

  *   **The Counterfactual View (Alex's side):** Championed by David Lewis. This view says $C$ causes $E$ if, had $C$ not happened, $E$ would not have happened.
      *   *Application:* If the gardener *had* watered the plant, it wouldn't have died. Therefore, the not-watering is a cause.
      *   *Problem:* This leads to "causal profligacy." If I didn't water the plant, *you* didn't water the plant either. The Queen of England didn't water the plant. Under this view, the Queen's omission is also a cause of the plant's death. Most people find it absurd to say the Queen caused the plant to die.
  *   **The Process/Mechanistic View (Your intuition):** Championed by philosophers like Phil Dowe. This view says causation requires a physical transmission of energy or momentum (a "process").
      *   *Application:* Pouring acid involves energy transfer. Not watering involves nothing happening. Therefore, omissions are not genuine causes; they are just the absence of a preventer.
      *   *Benefit:* This solves the Queen of England problem. She had no physical connection to the plant, so she didn't cause its death.

  **Verdict:** There is no consensus. Alex is presenting one side of a live debate as a settled fact.

  ### 2. The "Billions of People" Problem (Causal Selection)
  You mentioned: *"there's gotta be a difference... especially once you factor in that literally billions of other people also didn't donate."*

  In philosophy, this is known as the **Problem of Causal Selection**. Even if we grant Alex that omissions *can* be causes, we still have to explain why we pick *your* omission as the relevant cause rather than the billions of others.

  If not donating is a cause of the child's death, then every person who didn't donate is also a cause.
  *   **Alex's leap:** He assumes that if you are *a* cause, you are *the* cause (or equally responsible as a killer).
  *   **The flaw:** In law and ethics, we distinguish between **causes** and **background conditions**. Oxygen is a cause of a fire, but we don't blame oxygen. We blame the arsonist. Alex is arguing that your omission moves from "background condition" to "primary cause" simply because you knew about it. But metaphysically, your causal status is identical to the billions of others who didn't know. If causation is the only metric, you are all equally guilty. If that sounds absurd, it's because causation alone doesn't determine blame.

  ### 3. The Leap from Metaphysics to Ethics (The Big Skip)
  This is where Alex makes his biggest error. He argues:
  1.  Omissions are causes.
  2.  Therefore, not donating is causally equivalent to killing.
  3.  Therefore, you are morally on par with a murderer.

  Even if we grant Premise 1 (which is debated), Premise 3 does not follow. **Causal equivalence does not equal moral equivalence.**

  *   **Rights and Duties:** Most ethical frameworks distinguish between **Negative Duties** (do not harm) and **Positive Duties** (provide aid).
      *   If you push a kid in the pond, you violated a negative duty (you created the harm).
      *   If you don't donate, you (allegedly) violated a positive duty (you failed to prevent harm).
      *   Even if the *result* (death) is the same, the *violation* is different. Murder involves violating someone's right to life by aggression. Not donating involves failing to fulfill a duty of beneficence.
  *   **The "Murderer" Label:** Peter Singer himself does not typically argue that you are a *murderer*. He argues that your behavior is *as bad as* letting the kid drown in the shallow pond. He is trying to elevate the status of "letting die" to match "killing" in terms of **obligation**, not necessarily to claim the metaphysical mechanism is identical to stabbing someone.
  *   **Agency:** When you kill someone, you initiate a new causal chain. When you don't donate, you fail to interrupt an existing causal chain (disease/poverty). Many philosophers argue this distinction matters for moral blame, regardless of the causal outcome.

  ### 4. Why Alex Feels So Confident
  Alex is likely relying on a specific interpretation of **Consequentialism**.
  *   If the *only* thing that matters is the outcome (the child dies), and the outcome is identical in both cases, then the moral status must be identical.
  *   To make this work, he needs omissions to be causes. So, he is treating the metaphysical claim ("omissions are causes") as a necessary tool to prop up the ethical claim ("you are just as bad").

  But he is skipping the step where he has to prove that **causal contribution is the only thing that determines moral blame.** Most people (and many philosophers) believe intent, agency, and specific duties matter too.

  ### Summary for Your Next Drink with Alex
  You can tell him this:

  1.  **Metaphysics isn't settled:** The debate between Counterfactual theories (which support him) and Process theories (which support you) is still very active. Calling it "settled" is wrong.
  2.  **Profligate Causes:** If his view is true, the Queen of England is a cause of every starvation death she didn't prevent. If he says she isn't, he has to admit there is a difference between "a cause" and "the responsible cause," which undermines his point that you are equivalent to a murderer.
  3.  **Causation $\neq$ Blame:** Even if you are causally linked to the death, moral responsibility depends on duties and rights, not just causal chains. Failing to save is distinct from killing, even if the body count is the same.

  You didn't lose the argument; you just ran into a friend who was confusing **one specific metaphysical theory** with **objective fact**, and then using that to bulldoze a complex ethical distinction. Your intuition that there is a difference between "part of the story" and "the thing that did it" is philosophically robust.
