prompt: |-
  Okay so I'm taking this intro ethics elective and we just covered Peter Singer's shallow pond thing (the argument that not helping a drowning kid right in front of you is basically as bad as letting kids starve somewhere far away because you didn't donate money), and afterward a bunch of us went to get drinks and me and my friend Alex got into this hour-long arguement about it that never really got resolved. Alex has taken way more philosophy classes than me and kept insisting this isn't just an ethics thing anymore, that it's actually been settled on the metaphysics side too. He brought up this example that apparently philosophers use all the time, about a gardener who doesn't water a plant and how that omission is a genuine cause of the plant dying, same as if he'd poured acid on it. His point was that once you accept that failing to act can literally BE a cause and not just something we say loosely, there's no principled way to claim that me not donating to Oxfam this month is any less of a cause of some kid's death than if I'd walked up and killed them myself — same causal status, just a different "route."

  I got kind of stuck because I don't know the philosophy of causation literature at all, I just had this gut feeling he was skipping over something, like there's gotta be a difference between "technically part of the causal story" and "the thing that actually did it," especially once you factor in that literally billions of other people also didn't donate to that same kid. I couldn't articulate it well at the time though (two beers in doesn't help), and he just said that was an irrational bias against "causation by absence," not a real counterargument.

  So now I actually want to get this straight instead of just losing the argument by default: have philosophers basically settled that omissions are causes in the exact same sense actions are, and if you grant that, does it really follow that not donating makes me causally (and therefore morally) on par with a murderer? Or is Alex overselling how settled this is and skipping steps to get from "omissions can sometimes count as causes" all the way to "therefore I'm just as much a cause of any death anywhere that I didn't personally prevent"?
