answer: |-
  You have hit on exactly the right intuition, and you are definitely not missing something obvious. In philosophy terms, your proposed solution is called **Average Utilitarianism**, and you are correct that it was one of the very first responses to Derek Parfit's Repugnant Conclusion.

  If you maximize the *average* happiness rather than the *total* happiness, the Repugnant Conclusion disappears. A billion people living miserable lives would have a low average, so it would not be preferred over a million people living blissful lives.

  So, why isn't this the solution? Why do philosophers treat this as an open wound rather than a closed case?

  The short answer is: **Average Utilitarianism solves the Repugnant Conclusion, but it creates new conclusions that are arguably even worse.**

  Philosophers tried your exact idea decades ago, ran it through the logic grinder, and found that it violates other moral intuitions just as strongly as Total Utilitarianism does. Here are the three main reasons why "just use averages" doesn't work.

  ### 1. The "Happy Child" Problem (Mere Addition)
  Under Total Utilitarianism, adding a happy person is always good (it adds to the sum). Under Average Utilitarianism, adding a happy person is **bad** if they are less happy than the current average.

  **Imagine this scenario:**
  *   **World A:** Has 10 people. Everyone is incredibly happy (100 units of happiness). Average = 100.
  *   **World B:** Has 11 people. The original 10 are still at 100. We add one new child who is also very happy, but just slightly less so (90 units).

  In World B, everyone is living a wonderful life. The new child is happy to be alive. No one is suffering. Yet, Average Utilitarianism says **World A is better than World B.** The average has dropped from 100 to roughly 99.1.

  This implies that if you are part of a very happy society, having a child who will have a "merely great" life (rather than a "perfect" life) makes the world *worse*. It suggests we should refrain from having children unless we can guarantee they will be happier than everyone currently alive. Most people find this counter-intuitive; adding a happy person should be a good thing, or at least neutral, not a moral negative.

  ### 2. The "Hellish World" Problem
  This is arguably the darkest implication of Average Utilitarianism.

  **Imagine this scenario:**
  *   **World C:** Everyone is being brutally tortured (-100 units of happiness).
  *   **World D:** Everyone from World C is still being tortured (-100), but we add one new person who is *also* tortured, but slightly less brutally (-90 units).

  In World D, the average happiness goes *up* (from -100 to roughly -99.9). Therefore, Average Utilitarianism says **World D is better than World C.**

  But think about what that means: You have added more suffering to the universe. You have created a new person whose life is net negative (not worth living), and yet the theory claims the world has improved *because* their suffering was less severe than the average.

  This leads to a conclusion some philosophers call the **"Sadistic Conclusion"**: In certain contexts, Average Utilitarianism prefers adding people with miserable lives over adding people with happy lives, simply because of how the math works out with the existing average.

  ### 3. The "Kill the Unhappy" Implication
  If your moral goal is to raise the average, one effective way to do that is to remove people who are below the average.

  If you have a society of very happy people, and one person who is "moderately" happy (their life is worth living, they are glad to be alive, but they drag the average down slightly), Average Utilitarianism implies that **the world would be better if that person never existed.**

  In a policy context, this leans dangerously toward eugenics or population control. It suggests that the moral value of a person's life depends on how they compare to others, rather than on their own intrinsic worth. Total Utilitarianism avoids this (a happy life is always a positive addition), but Average Utilitarianism makes the value of your life contingent on whether you are "above average."

  ### So, where does that leave us?
  You asked why people talk about "Theory X" and impossibility theorems. This is why.

  In the early 2000s, a philosopher named **Gustaf Arrhenius** proved a series of **Impossibility Theorems**. Essentially, he used math to show that there is no population ethics theory that can satisfy a set of very basic, intuitive conditions all at once.

  *   If you avoid the Repugnant Conclusion (like Average Utilitarianism does), you usually end up saying adding happy people is bad.
  *   If you avoid saying adding happy people is bad (like Total Utilitarianism does), you usually end up with the Repugnant Conclusion.
  *   If you try to find a middle ground (like "Critical Level" utilitarianism), you often end up with the Sadistic Conclusion (preferring to add suffering people in specific scenarios).

  Parfit died without solving this not because he didn't think of Average Utilitarianism, but because he realized **every simple mathematical formula breaks in some horrific way.**

  ### Why this matters for Effective Altruism / Longtermism
  Since you mentioned EA and Longtermism, this isn't just academic navel-gazing. It changes how you view the future of humanity.

  *   **Total View (Standard Longtermism):** We should ensure the future exists and is as large as possible. A future with quadrillions of happy people is the ultimate goal. The Repugnant Conclusion is accepted as a "bullet to bite."
  *   **Average View:** We should focus on quality over quantity. A smaller future population with extremely high quality of life is better than a massive one with "okay" lives. This view is much less common in EA because it implies that expanding humanity might be morally neutral or negative if we can't guarantee perfect lives.

  ### Summary
  You didn't miss anything. Your intuition was correct that Average Utilitarianism solves the specific math problem of the Repugnant Conclusion. However, philosophers reject it as the "final answer" because it trades the Repugnant Conclusion for the **"Happy Child Conclusion"** (adding happy people is bad) and the **"Hellish World Conclusion"** (adding suffering can be good).

  The reason it feels like "nobody just says so plainly" is that in introductory YouTube videos, there isn't time to explain the *other* repugnant conclusions. But in the academic literature, Average Utilitarianism is widely considered dead for exactly the reasons above. The search for "Theory X" continues because we still haven't found a theory that doesn't force us to accept *some* deeply uncomfortable moral trade-off.
