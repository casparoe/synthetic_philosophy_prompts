answer: |-
  Your roommate is relying on a very simplified, textbook version of Expected Utility Theory (EUT) that ignores decades of nuance in economic theory. While his logic holds up under a rigid, specific set of assumptions, he is wrong to claim you are being irrational.

  In fact, the "Insurance vs. Lottery" puzzle is one of the most famous problems in decision theory. It was famously addressed by Milton Friedman and Leonard Savage in 1948.

  Here is how you can defend your decisions theoretically, ranging from "strictly rational" to "behaviorally realistic."

  ### 1. The Friedman-Savage Utility Function (The "Rational" Defense)
  Your roommate assumes your utility function for wealth is globally concave (meaning you are always risk-averse) or globally convex (always risk-seeking). But there is no mathematical rule in EUT that says your utility function must have the same shape everywhere.

  Friedman and Savage proposed that a utility function can be **S-shaped**.
  *   **Concave region (Risk Averse):** Around your current level of wealth, you are risk-averse. A large loss (like a totaled rental car) would hurt your utility disproportionately more than the cost of the premium. This explains the insurance.
  *   **Convex region (Risk Seeking):** For small amounts of money relative to your wealth (like $20), the utility function can be convex. The potential upside of winning the March Madness pool (bragging rights, a payout that feels significant relative to the $20) offers more utility than the certain loss of the $20 entry fee.

  Under this model, you are perfectly consistent. You are maximizing expected utility; it just happens that your marginal utility of wealth changes depending on whether you are looking at avoiding a large loss or chasing a small gain.

  ### 2. Utility $\neq$ Monetary Value (The "Consumption" Defense)
  Your roommate is calculating **Expected Monetary Value (EMV)**, but EUT is about **Expected Utility**. Utility includes non-monetary factors.

  *   **The Insurance:** You aren't just buying financial protection; you are buying **peace of mind**. The utility you gain from not worrying about scratching a bumper during your trip exceeds the disutility of paying the premium. That is a rational consumption choice, similar to paying extra for a direct flight to avoid stress.
  *   **The March Madness Pool:** You aren't just making an investment; you are buying **entertainment**. The $20 buys you a reason to care about the games, talk to friends, and experience the thrill of competition. If you view the $20 as the price of a ticket to a movie or a concert, the "negative expected value" doesn't matter. You consumed a service (fun), and the utility derived from that fun made the transaction positive in utility terms, even if it was negative in dollar terms.

  ### 3. Prospect Theory (The "Real World" Defense)
  If you want to go beyond standard EUT, you can cite Kahneman and Tversky's **Prospect Theory** (which won a Nobel Prize). They showed that people don't evaluate outcomes based on final wealth, but on **gains and losses relative to a reference point**.

  *   **Loss Aversion:** People feel losses more intensely than gains. This drives the insurance purchase (avoiding the pain of a loss).
  *   **Probability Weighting:** Humans tend to overweight small probabilities. We overweight the tiny chance of a car accident (buying insurance) *and* we overweight the tiny chance of winning the pool (buying the ticket).

  Under Prospect Theory, your behavior isn't inconsistent; it is the standard human response to risk. Your roommate's model assumes humans are robots who calculate linear probabilities, which we know is descriptively false.

  ### 4. Mental Accounting
  Finally, there is the concept of **Mental Accounting** (Richard Thaler). You likely treat the "Rental Car Budget" and the "Fun Money Budget" as separate accounts.
  *   In the **Safety Account**, you are risk-averse because the stakes involve liability and major hassle.
  *   In the **Entertainment Account**, you are risk-neutral or risk-seeking because the $20 is "spent" the moment you hand it over, and any return is a bonus.

  Segregating your decisions into different mental accounts is a heuristic that helps manage decision fatigue. While it can lead to "errors" in aggregate wealth maximization, it is a rational strategy for managing cognitive load and emotional satisfaction.

  ### The Verdict
  Your roommate is falling into a trap called the **Rabin Calibration Critique**. Matthew Rabin proved mathematically that if someone is risk-averse over small stakes (like refusing a 50/50 bet to win $110/lose $100), standard EUT implies they would be absurdly risk-averse over large stakes (refusing a 50/50 bet to win billions/lose $1,000).

  Since people *do* gamble small amounts while insuring large amounts, standard EUT with a simple concave utility function is insufficient to describe reality.

  **Tell your roommate:** "I'm not inconsistent; I have a Friedman-Savage utility function with consumption values for peace of mind and entertainment. You're just using a model that assumes utility is linear with money and ignores the value of fun."

  You are behaving like a normal, rational human. He is behaving like a simplified economic model.
