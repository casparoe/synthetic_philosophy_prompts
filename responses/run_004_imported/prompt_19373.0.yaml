      *   **Address the Roommate:** The roommate is partially right *if* we assume a very specific, rigid model of utility. But they are wrong in the broader context of economic theory.
      *   **Explanation 1: Friedman-Savage Utility Function (The "Rational" Defense).**
          *   Explain that utility functions don't have to be purely concave.
          *   They can be S-shaped (concave at current wealth for insurance, convex for small stakes/gains for gambling).
          *   This keeps it within *Expected Utility Theory* but allows for changing risk attitudes based on wealth levels.
      *   **Explanation 2: Consumption Value (The "Fun" Defense).**
          *   The $20 isn't just an investment; it's buying entertainment.
          *   Utility = Money + Fun.
          *   Insurance buys peace of mind (utility).
          *   Both maximize total utility, even if expected *monetary* value is negative.
      *   **Explanation 3: Prospect Theory (The "Psychological" Defense).**
          *   Mention Kahneman & Tversky.
          *   Reference points matter.
          *   Overweighting small probabilities (both for accidents and winning the pool).
          *   This challenges strict EUT but explains real human behavior better.
      *   **Explanation 4: Mental Accounting.**
          *   Rental car money is "serious" money.
          *   March Madness money is "fun" money.
          *   Different risk profiles for different buckets.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say EUT *requires* consistency in risk attitude across all domains. EUT requires consistency in *preferences*, but the shape of the utility function can vary.
      *   *Nuance:* The roommate's argument is the "Rabin Calibration" critique. Matthew Rabin showed that if you are risk-averse over small stakes, you must be absurdly risk-averse over large stakes under standard EUT. This suggests standard EUT might be the problem, not the user.
      *   *Decision:* Keep it accessible. Focus on Friedman-Savage and Consumption Value as the primary "rational" defenses, and mention Prospect Theory as the "modern" defense.

  6.  **Final Structure:**
      *   **Direct Answer:** No, your roommate isn't necessarily right.
      *   **Point 1: The Shape of Utility (Friedman-Savage).** You can be risk-averse in one wealth range and risk-seeking in another.
      *   **Point 2: Utility $\neq$ Money.** The gambling includes entertainment value. The insurance includes peace of mind.
      *   **Point 3: Prospect Theory.** How humans actually perceive probability and losses vs. gains.
      *   **Conclusion:** You aren't irrational; your roommate is using an outdated/simplified model.

  7.  **Tone:** Academic but accessible, encouraging, slightly vindicating for the user (since they asked if they are inconsistent).

  8.  *(Self-Correction during drafting)*: Wait, the March Madness pool is negative EV. If I include "fun," the expected *utility* can still be positive even if expected *value* is negative. I need to make sure that distinction is clear. Insurance is also negative EV (premium > expected loss), but provides utility via risk reduction. So both are negative EV financially, but positive utility overall.

