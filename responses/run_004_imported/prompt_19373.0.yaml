      *Wait, one more thing:* The Rabin Critique is very relevant here. If the roommate says "EUT says you can't do both," the Rabin critique says "EUT is broken if it says that." I should mention that standard EUT has trouble explaining small-stakes risk aversion without implying absurd large-stakes risk aversion. This supports the idea that the roommate's strict EUT view is flawed.

