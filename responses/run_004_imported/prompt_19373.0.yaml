          1.  Bought collision insurance for a rental car (premium > expected loss). This is risk-averse behavior.
          2.  Entered a March Madness pool ($20 entry, negative expected value). This is risk-seeking behavior (or at least accepting risk for negative EV).
      *   **Roommate's Claim:** These two behaviors are inconsistent under EUT. You can't be both risk-averse (insurance) and risk-seeking (gambling) at the same time. One must be a mistake.
      *   **Question:** Is the roommate right about inconsistency, or is there a way both choices make sense together?

  2.  **Initial Assessment & Theoretical Framework:**
      *   **Standard EUT (Von Neumann-Morgenstern):** Under *standard* EUT with a single, static wealth utility function $U(W)$, an individual is typically characterized as risk-averse (concave $U$), risk-neutral (linear $U$), or risk-seeking (convex $U$) over a given range of wealth.
      *   **The Friedman-Savage Hypothesis (1948):** This is the classic counter-argument. A utility function can be S-shaped (concave then convex then concave again). This allows for buying insurance (protecting against large losses in the concave region) and buying lottery tickets/gambling (seeking large gains in the convex region) simultaneously.
      *   **Prospect Theory (Kahneman & Tversky, 1979):** This is the behavioral economics angle. People evaluate gains and losses relative to a reference point, not final wealth. They are risk-averse in gains and risk-seeking in losses (loss aversion). Also, they overweight small probabilities.
      *   **Mental Accounting (Thaler):** People treat money differently depending on the "account" (e.g., "rental car budget" vs. "fun money").
      *   **Entertainment Value:** The gambling isn't just about money; it has consumption value (fun of watching the games).

  3.  **Evaluating the Roommate's Claim:**
      *   The roommate is relying on a *simplified* version of EUT where risk attitude is constant across all wealth levels and contexts.
      *   Technically, under *strict* VNM EUT with a globally concave utility function, the roommate is right.
      *   However, decision theory has evolved. There are valid models within rational choice theory (like Friedman-Savage) and descriptive models (Prospect Theory) that explain this.
      *   Even within standard EUT, if you include "consumption value" (fun) in the utility function, the gambling isn't purely financial.

  4.  **Drafting the Response:**

