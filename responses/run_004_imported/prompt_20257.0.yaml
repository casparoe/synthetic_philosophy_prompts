  1.  **Analyze the Request:**
      *   **Deceased:** The user's mother, a hospice doctor for 30 years.
      *   **Key Characteristic:** Stickler for the "doctrine of double effect" (DDE). She distinguished sharply between *intending* death and *foreseeing* death while intending to relieve pain. She hated the "trolley problem" comparison.
      *   **The Conflict:** In her last week, the brother wanted to "just up the sedation and be done with it." The user found themselves reciting the mother's own philosophy back to the brother to explain why that wasn't the right approach.
      *   **The Audience:** Half hospice colleagues (will notice philosophical inaccuracies), half family (raw from the fight, don't want a lecture).
      *   **The Goal:** Write a eulogy that honors her precision without becoming a seminar, and without comforting anyone by fudging the very principle she held dear.
      *   **Tone:** Respectful, precise, warm, honest, not preachy.

  2.  **Deconstruct the Challenge:**
      *   *The Trap:* If I explain the doctrine too clearly, it sounds like a lecture. If I ignore it, it insults her memory and the colleagues. If I mention the brother's request directly, it might cause more pain/Conflict.
      *   *The Solution:* Weave the philosophy into the *story* of her life and character, rather than presenting it as an argument. Focus on *intent* and *care* rather than just the mechanics of dosing. Acknowledge the difficulty of the end of life without validating the "just end it" approach, but also without shaming the brother.
      *   *Key Phrase to Include (subtly):* The difference between intending an outcome and accepting a risk to achieve relief. The rejection of the "trolley problem."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Set the scene. She was a doctor, but more importantly, a mother.
      *   **The Core Philosophy (The Hard Part):** How to mention the DDE without saying "Doctrine of Double Effect"?
          *   *Idea:* Talk about how she viewed her hands. Her hands were for relief, not for ending.
          *   *Idea:* Talk about the "trolley problem." She hated it. Why? Because patients aren't numbers.
          *   *Integration:* "She taught us that medicine isn't about math. It's about intention."
      *   **The Final Week (The Elephant in the Room):** This is delicate. The brother wanted to hasten death. The user defended the mother's philosophy.
          *   *Approach:* Don't name the brother. Don't describe the fight. Describe the *tension* that exists in hospice. Acknowledge that even for her, the end was hard. But emphasize that she stayed true to her principles until the end.
          *   *Crucial nuance:* The user needs to validate that *they* understood her, without making the brother look like the villain. The focus should be on *her* consistency.
      *   **The Colleagues:** Acknowledge their shared language. They know what she stood for.
      *   **The Family:** Acknowledge their pain. They need to know she was comfortable, but not *how*.
      *   **Closing:** Bring it back to love. Intention matters.

  4.  **Refining the Tone (Iterative Process):**
      *   *Drafting thought:* "She believed in the doctrine of double effect." -> *Too academic.*
      *   *Revision:* "She believed that what you mean to do matters more than what happens." -> *Better.*
