answer: |-
  Good morning.

  For those of you who don't know me, I'm [Your Name]. I am [Mom's Name]'s child. And for thirty years, I was also her student.

  Most people's mothers teach them how to tie their shoes, or how to be kind, or how to cook a roast. My mother taught me how to think about the boundary between life and death. She taught me that words matter. Specifically, she taught me that *intent* matters.

  She was a hospice physician. She spent three decades walking people into the dark so they wouldn't have to go alone. And she was very specific about how she did it.

  She used to get quietly annoyed when young residents tried to turn her work into a math problem. They would talk about the "trolley problem"—you know, the philosophy puzzle about pulling a lever to save five people by killing one. She hated that comparison. She'd say, "Trolleys are about counting bodies. Medicine is about counting intentions."

  To her, the difference between relieving pain and hastening death wasn't just a legal distinction or a semantic game. It was the moral architecture of her entire career. She believed that you could turn the knob to stop the suffering, even if you knew it might carry a risk, provided you were not turning the knob *to stop the heart.* She refused to blur that line. Even when it was hard. Even when it would have been easier.

  I know there are people in this room, colleagues and friends, who heard that speech a hundred times. You know how precise she was. You know she never fudged the numbers to make the math look cleaner.

  And I know there are people in this room, family and friends, who just saw her in pain at the end, and wanted it to stop. Who wanted the suffering to be over, by any means necessary.

  I want to speak to both of you, because I think she would want me to bridge this gap without breaking her rules.

  In her final week, as her breathing changed and the pain spiked, there were moments where the temptation was there—to just cross the line, to tip the scale, to make it end. It is a natural impulse when you love someone to want their struggle to cease.

  But in those moments, I found myself doing something strange. I found myself channeling her. I found myself standing in the hallway, repeating her own logic back to the people who loved her, explaining that we could not intend the end, even if we desperately wanted the pain to stop. That relief was the goal. Peace was the goal. The rest was not up to us.

  It was a strange inheritance. Most people inherit a watch or a house. I inherited the responsibility of holding the line she drew, even for her.

  And I tell you this not to reopen wounds, but to honor her consistency. She didn't just teach this doctrine; she lived it. She died the way she practiced. She received the same care she gave. The medications were there to comfort her, to lift the weight of the breath, not to end the breath. We honored her by letting her go naturally, while making sure she was not in pain.

  That is a hard path. It requires patience. It requires sitting with uncertainty. It requires accepting that we do not control the timing, only the comfort.

  To her colleagues: Thank you for speaking her language. Thank you for knowing that when she said "comfort care," she meant it with a capital C. You kept her standard alive when she could no longer speak for herself.

  To my family: I know it was hard. I know watching her fade was agonizing. But I also know that she would not have wanted a different ending. She wouldn't have wanted us to carry the weight of having decided *when*. She wanted to carry that herself, with whatever time her body had left. She wanted us to be there to witness it, not to engineer it.

  She was a stickler. She was precise. She was sometimes difficult about the semantics of things. But that precision was an act of love. It was her way of protecting the sanctity of the people she served, and eventually, herself.

  She didn't pull the lever. She just held the hand. And she made sure we knew the difference.

  We will miss her. We will miss her precision. We will miss her stubborn, fierce, unwavering integrity. And we will miss her.

  Thank you.
