answer: |-
  **Setting:** *Oxford, 1656. A cluttered study. THOMAS HOBBES stands over a desk covered in diagrams of circles and quadrants. JOHN WALLIS sits calmly, holding a sheet of paper covered in algebraic notation.*

  **HOBBES:** You look at my figure and you see a mistake. I look at yours, John, and I see a trick. You manipulate symbols like a merchant balancing a ledger, thinking that because the letters cancel out, you have touched the truth. But you have touched nothing.

  **WALLIS:** I have touched the relations, Thomas. That is enough.

  **HOBBES:** It is not enough! Science is knowledge of consequences. To know a thing, you must know how it is *made*. Why is a line straight? Because a point moved without deviation. Why is a circle round? Because a line rotated around a fixed end. We are certain of geometry only because we construct the figures ourselves. We know the cause because we *are* the cause. Your algebra... it falls from the sky. It has no generation.

  **WALLIS:** So, if I cannot draw it, I cannot know it? If my hand shakes, does the theorem tremble?

  **HOBBES:** Your hand is irrelevant. The *concept* of the motion is what matters. But your symbols—*x* and *y* and these infinite series—they describe magnitudes without describing the bodies that hold them. You separate quantity from substance. That is not geometry; that is mysticism with better notation.

  **WALLIS:** I separate the *relation* from the *instance*. That is the power of the analytic method. You say we are certain because we construct the figure. But consider this: when you construct a square, you are bound by the rules of construction. You are a slave to the compass. But the truth of the square exists prior to your compass.

  **HOBBES:** No. The truth is *in* the construction.

  **WALLIS:** Then geometry is merely a study of human motion. It becomes a branch of physics. If certainty relies on our ability to construct, what happens when the construction is impossible? Take the quadrature of the circle. You say it can be done by motion. I say the algebraic relations prove it cannot be done by any finite means. If your certainty comes from "making," and you cannot make it, then you can never know it.

  **HOBBES:** I *can* make it. I have the proof.

  **WALLIS:** You have a diagram that looks close. But listen to me. You argue that we know the cause because we generate the figure. But do we generate the *ratio*? When you draw a circle, you generate the line. You do not generate the relationship between that line and the diameter. That ratio was waiting for you before you picked up the pen. It is independent of your motion.

  **HOBBES:** It is not independent! If you cannot show me the motion that produces the equality, you have not demonstrated causality. You have only shown me a coincidence of numbers. You say, "Let *a* equal *b*." I ask, "By what motion did *a* become *b*?" If you cannot answer, you do not know. You are guessing.

  **WALLIS:** I am not guessing; I am inferring. Look, Thomas, your constructivism is a fortress, but it is a small one. You lock the door to keep uncertainty out, but you lock out half of mathematics with it. You want certainty? The algebraic method offers a certainty far higher than the eye can verify. Your construction relies on the assumption that your lines are perfectly true. Mine relies on the law of non-contradiction. Which is more divine? The hand that draws, or the logic that binds?

  **HOBBES:** Logic without substance is empty. You can juggle symbols forever, but if they do not map to the generation of magnitude, they are just noise. I trust the line because I understand the point that moves to create it. I trust the circle because I understand the rotation. You trust... what? The ink?

  **WALLIS:** I trust the structure. You say we know it because we made it. I say we know it because it *must be so*, whether we made it or not. Your geometry is a craft of making. Mine is a science of being.

  **HOBBES:** *(Taps the diagram forcefully)* Then your science is a ghost.

  **WALLIS:** And yours is a cage. You will die in it, Thomas, still squaring a circle that your own rules forbid.

  **HOBBES:** I will die knowing *how* the world is built. You will die knowing only how to count it.

  **WALLIS:** *(Quietly)* We shall see which knowledge outlasts us.
