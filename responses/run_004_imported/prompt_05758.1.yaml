      *   **Tone:** Sharp, intellectual, respectful but contentious. No strawmen. Both sides need to make strong points.
      *   **Format:** Dialogue.
      *   **Length:** About a page or so.

  2.  **Character Voices:**
      *   **Hobbes (Thomas):** Older, grumpy, stubborn, materialist, obsessed with causality and physical motion. Sees geometry as a subset of physics/motion. Believes in the absolute certainty of synthetic geometry (Euclid style).
      *   **Wallis (John):** Younger (relatively), methodical, innovative, comfortable with abstraction and algebra. Sees mathematics as a language of relations that transcends specific physical constructions.

  3.  **Key Arguments to Include:**
      *   *Hobbes:* Certainty comes from generation/construction. We define the line by moving a point. Therefore, we know the cause. Algebra is just guessing with symbols.
      *   *Wallis:* Algebra reveals truths that construction obscures. The relations hold regardless of the drawing. Construction is limited by human hand/eye; symbols are limited only by logic.
      *   *The Clash:* Is math about *making* figures or *discovering* relations?

