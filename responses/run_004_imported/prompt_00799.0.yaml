      3. Non-Bayesian (Bias): The heavy lifter.
      *Decision:* I will argue that **Non-Bayesian processing (specifically, the failure to treat the other's belief as evidence)** is the dominant factor.

  8.  **Writing the Essay.** (Mental check of the flow: Intro -> Aumann context -> Critique of Priors/Communication -> The Bias Argument -> Conclusion on Rationality).

      *   *Title Idea:* The Illusion of Agreement. Or: Why We Agree to Disagree.
      *   *Opening:* The restaurant scene.
      *   *Middle:* Dissecting the theorem's assumptions.
      *   *End:* The verdict on rationality.

      *(Final check on constraints)*: "Don't end on a non-committal note." "Reach and defend a specific conclusion." "About which explanation is doing the most work." "About what... disagreement... should lead us to conclude about the rationality."

