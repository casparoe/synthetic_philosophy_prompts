      *Wait, one nuance:* The prompt mentions "Harsanyi doctrine." I should engage with that. The Harsanyi doctrine says priors *should* be common. If they aren't, one is irrational? Or just different? I'll argue that in practice, "different priors" is often a polite label for "unwillingness to update."

