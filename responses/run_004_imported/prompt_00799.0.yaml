answer: |-
  The restaurant argument is a classic tableau of modern intellectual life: two friends, a bottle of wine, and a chasm of probability that refuses to close. You estimated a 70 percent chance of survival; your friend, 30 percent. You exchanged evidence, conceded points, and adjusted your numbers, yet the gap remained. In the cold light of game theory, this is a violation of Aumann's Agreement Theorem. If you are both honest Bayesians with common priors, and your posteriors are common knowledge, you cannot agree to disagree. The fact that you did suggests a breakdown in the machinery of rationality. But which gear slipped?

  To diagnose the failure, we must weigh the standard exemptions against the psychological reality of the conversation. The most charitable explanation is the failure of the *Common Prior Assumption*. The Harsanyi doctrine posits that rational agents differ only because of differing information, not differing starting points. Yet, in the messy world of restaurant viability, what constitutes a "prior" is murky. Your 70 percent might rest on a latent belief in the resilience of local business; your friend's 30 percent on a cynical view of post-pandemic dining. If these priors are truly fundamental—rooted in divergent life experiences rather than calculable data—Aumann's theorem does not apply. However, this explanation is often too generous. In most ordinary disagreements, what we label "different priors" are actually unexamined heuristics that should have been updated by the sheer weight of the evening's conversation. If the priors were the only culprit, the exchange of specific evidence (lease terms, chef reputation, foot traffic) should have narrowed the gap, even if it didn't close it. A persistent 40-point spread suggests something more stubborn than foundational worldview differences.

  A second candidate is the failure of *Common Knowledge* via imperfect communication. Geanakoplos and Polemarchakis demonstrated that convergence requires the iterative exchange of posteriors, not just stories. When you argued over dinner, you exchanged narratives, not probability distributions. Language is lossy; when you said, "The location is great," you conveyed a signal, but you could not transmit the precise weight that signal carried in your internal calculus. Your friend heard the words but could not fully inhabit your confidence. This "partition problem" is genuine. We cannot fully disclose the architecture of our minds. Yet, this too feels insufficient. You noted that you "revised numbers once or twice." This indicates that information *was* transmitted and *did* cause updating. If the communication channel were merely noisy, we would expect a random walk toward convergence, not a stubborn stalemate. The fact that you both moved, then stopped, suggests a limit was reached—not of language, but of willingness.

  This leads to the third and most uncomfortable explanation: *Non-Bayesian Reasoning*. This category encompasses cognitive biases, motivated reasoning, and identity-protective cognition. It suggests that you and your friend were not acting as truth-seeking processors, but as advocates for a narrative. In a Bayesian framework, your friend's belief is itself evidence. If you truly regard your friend as a rational peer, their 30 percent estimate should act as a powerful signal that you are missing something, compelling you to slash your own estimate significantly. The fact that you remained at 70 percent implies that, in practice, you discounted their cognition. You treated their argument as noise to be rebutted, rather than data to be integrated.

  This is the explanation doing the most work in ordinary cases like this one. It is not that your priors were metaphysically distinct, nor that language failed you entirely. It is that human rationality is not designed for Aumannian convergence; it is designed for coherence and social standing. We engage in "rationalization" rather than "rationality." When we argue, we are often testing the durability of our own beliefs against attack, not seeking the optimal probability estimate. The "concessions" you made were likely tactical—minor points surrendered to maintain the flow of debate—rather than genuine Bayesian updates. The stalemate occurred because further updating would have threatened the internal coherence of your respective positions, or perhaps the social dynamic of the friendship itself. To concede fully might feel like losing, and the human brain is wired to avoid the pain of being wrong more vigorously than it seeks the pleasure of being right.

  Therefore, we must reach a specific conclusion about what this persistent disagreement says about your rationality. It does not mean you are "irrational" in the sense of being broken or stupid. Rather, it reveals that human rationality is *bounded* not just by computational limits, but by *motivational* limits. We are not universal Bayesians. We are local Bayesians who turn off the updating mechanism when the cost of convergence exceeds the social or psychological benefit.

  The persistence of the 70/30 split is evidence that you and your friend value the *integrity of your own models* more than the *efficiency of the collective truth*. In a strict epistemic sense, this is a failure of rationality: you failed to treat a peer's belief as evidence. But in a pragmatic, human sense, it is a feature, not a bug. Total convergence would require a level of epistemic humility that is exhausting to maintain and socially destabilizing. If we truly updated on every disagreement with every friend, our beliefs would become volatile mush, dictated by the last person we spoke to.

  Ultimately, the Aumann Agreement Theorem serves as a useful asymptote—a direction in which to strive—rather than a description of how we think. The lesson of the restaurant argument is not that you failed to be machines, but that you succeeded in being humans. The rational conclusion to draw from such disagreements is not that one of you is right and the other wrong, nor that the truth lies exactly in the middle. It is that the probability of the restaurant's success is less important to your brains than the preservation of your respective agency. You should therefore treat such persistent disagreements not as puzzles to be solved, but as signals to diversify. If two thoughtful people can look at the same menu and see different futures, the uncertainty is real, regardless of the math. Bet accordingly.
