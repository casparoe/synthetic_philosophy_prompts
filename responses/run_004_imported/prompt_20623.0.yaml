prompt: |-
  Ok this is a bit of a random one but it's been living in my head since my grandpa's funeral last month. I'm a math/CS person, pretty firmly atheist, and normally I have zero patience for afterlife stuff -- but a friend who knows I'm into Gödel sent me down a rabbit hole about how he (yes, the incompleteness theorem guy) apparently believed in life after death, and not in a vague "who knows" way but as something he thought he could actually argue for. The story, pieced together from a couple of bios/articles so forgive me if I'm garbling some details, is that he wrote his mother a letter laying out something like: the world is "rationally organized" and not absurd -- tied to what people call his "rationalistic optimism," basically the view that every well-posed question has a knowable answer in principle -- and it would be deeply wasteful for nature to build something as absurdly complex as a human brain, capable of so much further development, only to have it discarded after a few decades, espescially given how many people die before developing much of anything at all. So by some kind of sufficient-reason move, he concludes there has to be a "next stage" where that potential isn't just thrown away.

  What I'd actually love help with is reconstructing this as a real argument: spell out the premises explicitly and tell me whether the conclusion follows, or whether its smuggling in a bunch of hidden assumptions (about teleology, about minds not reducing to brains, whatever) that a guy that rigorous really shouldn't have gotten away with. Is this basically a transplanted version of the principle of sufficient reason, or more like a design argument aimed at individual biological development rather than the cosmos as a whole? How does the "world is rational" premise carry the weight it needs to? And is it doing anything different from his much more famous ontological proof of God's existence, or are people just conflating the two? Bonus points if you can say something about whether any actual philosophers engage with this afterlife argument seriously, versus it just being a footnote biographers bring up to make him seem endearingly weird.
