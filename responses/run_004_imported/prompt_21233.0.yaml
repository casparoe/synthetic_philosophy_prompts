answer: |-
  You should feel good about that conversation because your gut instinct was philosophically sounder than Alex's confidence suggested.

  The short answer is: **No, this is not settled.** In fact, causation by omission is one of the most contentious, messy, and unresolved debates in contemporary metaphysics. Furthermore, even if you grant that omissions *are* causes, it does **not** logically follow that you are morally equivalent to a murderer. Alex is conflating three distinct philosophical layers: metaphysics (what is a cause?), semantics (how do we talk about causes?), and ethics (what are we responsible for?).

  Here is the breakdown of where Alex is overselling the consensus and where your intuition about the "billions of people" problem hits on a major objection in the literature.

  ### 1. Is it "Settled" that Omissions are Causes?
  Alex claimed this is settled on the metaphysics side. It is absolutely not. There are two main camps, and they disagree fundamentally.

  *   **The Counterfactual View (Alex's side):** This view (associated with David Lewis) says causation is about dependence. *If* the gardener had watered the plant, it would have lived. *Therefore*, not watering caused it to die. On this view, omissions are real causes.
  *   **The Process/Mechanistic View (Your intuition):** This view (associated with Wesley Salmon or Phil Dowe) says causation requires a physical transfer of energy or a continuous process. When you push someone (action), energy transfers. When you *don't* water a plant (omission), there is no physical "thing" passing from you to the plant. On this view, omissions are **not** genuine causes; they are just background conditions.

  Philosophers are currently split on this. Some argue that if we accept omissions as causes, we face "causal inflation." For example, if I don't water your plant, I caused it to die. But the Queen of England also didn't water your plant. Did she cause it to die too? If omissions are causes in the exact same sense as actions, then **everyone in the world** who didn't water that plant is a cause of its death.

  Most metaphysicians find this absurd. To avoid it, they usually have to add a "normative" filter (more on that below), which undermines Alex's claim that this is a pure metaphysical fact.

  ### 2. The Gardener Example and "Normative Expectations"
  Alex used the gardener example to prove omissions are causes. But philosophers use that example to prove something else: **Causation depends on expectations.**

  The reason we say the gardener caused the plant's death (but not the passerby) isn't because of physics; it's because the gardener had a **duty** to water it. This is the view of H.L.A. Hart and Tony Honoré (legal philosophers). They argue that we only pick out omissions as causes when there is a breach of a norm or duty.

  If Alex admits that the gardener is a cause *only because he was supposed to water the plant*, he has smuggled **ethics** into his **metaphysics**. He can't use that example to prove that *you* are a cause of a starving child's death unless he first proves you have a duty to save them. But that's the exact ethical question you were arguing about in the first place!

  So, Alex is arguing in a circle:
  1.  **Metaphysics:** Omissions are causes (like the gardener).
  2.  **Ethics:** Therefore you are responsible for the starving child.
  3.  **The Catch:** The gardener is only a cause because he was *already responsible*.

  ### 3. The "Billions of People" Problem (Causal Overdetermination)
  Your point about billions of other people not donating is a classic objection known as the **Problem of Many Absences**.

  If I shoot a victim, I am the cause. If I *don't* send $50 to Oxfam, and a child dies, am I the cause?
  *   If yes, then so is the person who didn't send $40.
  *   And the person who didn't send $10.
  *   And the person who didn't sell their kidney to send $100,000.

  If all these omissions are "genuine causes" in the same sense as a bullet, then causation becomes meaningless. Everything is causing everything else via infinite absences.

  To solve this, philosophers who support omission-causation usually have to admit that causation is **contrastive** or **context-sensitive**. We say "X caused Y" only relative to a specific context where X was expected. This brings us back to the idea that your intuition was right: there is a difference between "technically part of the causal story" (in a vast web of counterfactuals) and "the thing that actually did it" (the salient cause).

  ### 4. The Leap from Causation to Moral Equivalence
  Even if we grant Alex the metaphysics (let's say omissions *are* causes), he makes a massive logical leap to say you are therefore **morally equivalent to a murderer.**

  This confuses **Causal Responsibility** with **Moral Responsibility**.
  *   **Causal Responsibility:** Did your behavior (or lack thereof) make a difference to the outcome?
  *   **Moral Responsibility:** Are you blameworthy for that outcome?

  Consider this: If a lifeguard lets a swimmer drown, they are causally responsible (omission). If a random tourist lets a swimmer drown, they might also be causally responsible (on the counterfactual view). But we judge them differently morally. Why?
  *   **Intent:** Murder requires malice or recklessness. Negligence is different.
  *   **Special Obligations:** Parents are responsible for feeding their kids; strangers are not, even if the stranger's money could buy food.
  *   **Demandingness:** Ethics generally acknowledges limits on what we can demand of agents.

  Singer's argument is powerful precisely because he tries to *bypass* these distinctions. He argues that distance and "act vs. omission" shouldn't matter morally. But he argues that from a **utilitarian** standpoint (maximizing good), not from a **metaphysical** standpoint (causation).

  Alex is trying to win an ethical argument by bullying you with metaphysics. He's saying, "Science says you're a cause, so Ethics says you're a killer." But metaphysics can't dictate moral blame.

  ### 5. Summary: How to Respond to Alex
  You didn't lose that argument; you just lacked the vocabulary. Here is how you can frame it now:

  1.  **Metaphysics isn't settled:** Tell him the "Process Theory" of causation explicitly rejects omissions as real causes because there is no energy transfer. It's not a bias; it's a competing theory.
  2.  **The Gardener relies on Duty:** Point out that the gardener is only cited as a cause because we *already assume* he had a duty. Using that to prove *you* have a duty is circular reasoning.
  3.  **Causal Inflation:** Ask him if the Queen of England is a cause of the plant's death for not watering it. If he says no, he admits omissions aren't *always* causes. If he says yes, ask him why that doesn't make causation meaningless.
  4.  **Causation $\neq$ Blame:** Remind him that even if you are *a* cause, that doesn't make you a *murderer*. Causation is binary (yes/no); Moral blame is graded (negligence vs. malice).

  **Verdict:** Alex is overselling how settled the metaphysics is, and he is skipping the crucial step of establishing *why* your omission is morally relevant compared to the billions of other omissions. Your intuition that there is a difference between "part of the causal web" and "the agent responsible" is a standard and respected philosophical position.
