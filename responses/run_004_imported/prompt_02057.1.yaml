answer: |-
  You are onto something real, but so is she. You are arguing past each other because you are defining "credit" differently. She is talking about **authorship**, while you are talking about **capacity**.

  This is a classic philosophical tension, often framed as the debate between **Existentialism** (we define ourselves through action) and **Determinism/Sociology** (our actions are constrained by our history and circumstances).

  Here is a breakdown of why you both feel so strongly, and where the truth likely sits.

  ### 1. The Friend's Truth: The Pain of Agency
  Your friend is arguing from the perspective of *effort*. From the inside, her experience is one of constant friction. Every morning she chose to wake up early; every time she wanted to slack off, she chose to work. No one held a gun to her head.

  Psychologically, her claim to "full credit" is not just arrogance; it is a necessary protective mechanism. People who overhaul their lives often have to adopt a slightly radical sense of ownership to maintain the change. If she admits that her stable upbringing played a significant role, it might dilute the narrative strength she uses to keep herself disciplined. She needs to believe she is the sole captain, or she might fear she could drift again.

  In this sense, she is right: **The labor of becoming was hers.** A person with the exact same upbringing who did not make those choices would not have the same life. The variable that changed the outcome was her will.

  ### 2. Your Truth: The Preconditions of Choice
  You are arguing from the perspective of *context*. Your intuition is telling you that the ability to choose discipline is not distributed equally.

  *   **The Safety Net:** A stable upbringing often provides a psychological safety net. If her new trade had failed, would she have been homeless, or could she have moved back home? The *risk* of her choices was lower because of her upbringing. Lower risk makes bold choices easier.
  *   **The Toolkit:** Discipline is a skill. It relies on executive function, emotional regulation, and a belief that effort leads to reward (delayed gratification). These are often modeled and taught in stable upbringings. She may have "taught herself a new trade," but the cognitive infrastructure that allowed her to teach herself was likely built in those first 20 years.
  *   **Moral Luck:** The philosopher Thomas Nagel wrote about "constitutive luck"—the luck of who you are. Her temperament, her intelligence, and her resilience are partly genetic and partly environmental. She didn't choose the brain that was capable of choosing discipline.

  You are sensing that **agency is not a vacuum.** It requires a platform. She built the rocket, but you are pointing out that she started on a launchpad rather than in a ditch.

  ### 3. The Synthesis: Authorship vs. Capacity
  The resolution lies in distinguishing between the *source* of the capacity and the *use* of the capacity.

  Imagine two people are given a block of marble.
  *   **Person A** is given a chisel and a hammer (upbringing/tools) and sculpts a masterpiece.
  *   **Person B** is given a block of marble but no tools, and cannot sculpt anything.

  Your friend is saying, "I swung the chisel. I deserve credit for the statue."
  You are saying, "You had the chisel. That matters."

  **She is right that she deserves the credit for the *statue*.** No one else swung the hammer. The beauty of the work is hers.
  **You are right that she does not deserve credit for the *chisel*.** The capacity to be disciplined was, in part, a gift of her biology and her history.

  When she says she deserves "full credit for the person she became," she is conflating the two. She deserves full credit for the *effort*, but not for the *ability to exert effort*.

  ### 4. Why the Argument Matters
  This isn't just semantic. How we answer this changes how we view others and ourselves.

  *   **If she is 100% right:** Then anyone who is struggling simply lacks willpower. This leads to a lack of empathy for those who haven't "overhauled" their lives. It ignores the fact that some people are trying to build houses in hurricanes while she was building in a calm harbor.
  *   **If you are 100% right:** Then her achievement is diminished, which is demoralizing and untrue. It ignores the very real pain and sacrifice she endured to change her trajectory.

  ### The Verdict
  You are onto something real. The "missing something" you feel is the **invisible infrastructure** that made her choices possible.

  However, she is also right in a pragmatic sense. We cannot live our lives paralyzed by the fact that we didn't choose our genetics or our parents. To function, we must act *as if* we are fully free.

  **The most accurate view is this:**
  She is the **author** of her life, but she did not write the **language** she speaks. She deserves immense pride and credit for the story she wrote, but she should acknowledge that the stable upbringing gave her the vocabulary to write it at all.

  If you talk to her again, you might try this distinction:
  *"I am not saying you didn't do the work. You absolutely did. I am saying that your upbringing gave you the confidence that the work would pay off. You deserve credit for the labor, but don't forget the foundation that made the labor possible."*

  That validates her effort (which she needs) without denying the reality of luck (which you know is true).
