          2.  Map "Contradiction in Conception" (CC) and "Contradiction in the Will" (CW) onto the four *Groundwork* examples (False Promise, Suicide, Neglected Talents, Refusing Help).
          3.  Address the interpretive disagreement about the *type* of contradiction (logical vs. practical/teleological), specifically mentioning Korsgaard.
      *   **Tone:** Intellectual, precise, respectful of the complexity (not dumbed down), helpful for Ethics Bowl prep.

  2.  **Deconstruct Question 1: The Two Formulations (FUL vs. FLN):**
      *   *Formula of Universal Law (FUL):* "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
      *   *Formula of the Law of Nature (FLN):* "Act as if the maxim of your action were to become through your will a universal law of nature."
      *   *Difference:* FUL is abstract/moral. FLN adds the imagery of *nature* (causal necessity, how things *do* happen vs. how they *ought* to happen).
      *   *Why both?* Kant introduces FLN shortly after FUL in *Groundwork* II. It's meant to make the test more intuitive. Imagining a "law of nature" helps visualize the systemic effects of universalization. It bridges the gap between the noumenal (freedom/morality) and the phenomenal (world of cause and effect). It helps check if the maxim creates a system that undermines itself or the agent's own goals.

  3.  **Deconstruct Question 2: CC vs. CW and the Four Examples:**
      *   *The Distinction:*
          *   **Contradiction in Conception (CC):** The maxim becomes self-defeating if universalized. It's logically or conceptually impossible for the practice to exist in that world. (Perfect Duties).
          *   **Contradiction in the Will (CW):** The maxim *can* be conceived as universal, but a rational agent cannot *will* it because it contradicts something else they necessarily will (like their own happiness or development). (Imperfect Duties).
      *   *Mapping the Examples:*
          1.  **False Promise (Borrowing money with no intent to repay):** CC. If everyone did this, the institution of promising would collapse. No one would believe promises. The act becomes impossible. (Perfect Duty to others).
          2.  **Suicide (Ending life to avoid pain):** CC (traditionally interpreted). A system of nature where self-love destroys life contradicts the purpose of self-love (preservation). *Note: This is a tricky one, often debated, but standard reading is CC.* (Perfect Duty to self).
          3.  **Neglected Talents (Letting talents rust):** CW. A world where no one develops talents is conceivable. But a rational being wills the development of faculties because they are useful for achieving ends. You can't will a world where you lack the means to your own ends. (Imperfect Duty to self).
          4.  **Refusing Help (Non-beneficence):** CW. A world where no one helps is conceivable. But you cannot rationally will this, because you will inevitably need help yourself. Willing a world where you are abandoned contradicts your will for your own well-being. (Imperfect Duty to others).

  4.  **Deconstruct Question 3: The Nature of the Contradiction (Logical vs. Practical):**
      *   *The Problem:* Strict logical contradiction (A and not-A) is hard to find in maxims. "Everyone lies" isn't logically impossible in the same way "2+2=5" is.
      *   *The Interpretive Shift:* Many commentators argue it's a *practical* contradiction.
      *   *Korsgaard's View:* She argues for the "Practical Contradiction Interpretation." The contradiction isn't in the *proposition* but in the *purpose*. If I universalize the maxim, does it make my intended purpose impossible to achieve?
      *   *Teleological Aspect:* In the Law of Nature formulation, we look at the *telos* (purpose) of natural instincts (e.g., self-love aims at preservation). If the universalized maxim frustrates that purpose, it fails.
      *   *Why it matters:* It saves Kant from the charge that his test is too formal/empty. It grounds the contradiction in human agency and rationality, not just abstract logic.

