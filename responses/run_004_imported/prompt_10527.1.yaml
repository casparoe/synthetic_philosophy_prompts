answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I sit down the hall from Diane. Or rather, for the last thirty-six years, I've sat down the hall from Diane, waiting for the next time she would tell me that nothing I say actually refers to the world.

  It is a rare thing to work alongside someone for thirty-six years. It is an even rarer thing to work alongside someone for thirty-six years who believes, with every fiber of her being, that you are wrong about almost everything. Diane and I were hired in the same year. We arrived with competing maps of the universe. I believed that our job was to polish the mirror of nature, to make our ideas match the world as accurately as possible. Diane believed that the mirror was broken, that we shouldn't be trying to match the world at all, but rather trying to figure out how to live in it together without causing unnecessary pain.

  I mention this not to air our dirty laundry, but to highlight the generosity of Diane's career. For three and a half decades, she could have easily dismissed me as a relic. Instead, she treated me as a partner in a conversation. She never tried to silence me; she just tried to redescribe me until I became more useful to the department.

  For Diane's family and friends who might be wondering what I'm talking about: in ordinary language, we often praise people by saying they "found the truth" or "saw things as they really are." But Diane spent her life arguing that we don't *find* truth like we find a lost set of keys. We *make* it, like we make a new piece of furniture. It's about whether the idea works, whether it helps us cope, whether it brings us closer together.

  So, when I say Diane was a brilliant philosopher, I don't mean she was always "right." I mean she was always *generative*. She didn't give us answers that settled things; she gave us vocabularies that opened things up. When a student was struggling with a rigid dogma, Diane didn't hand them a correction. She handed them a new description. She taught generations of students that being smart isn't about having the final word; it's about knowing that your vocabulary is a tool, not a prison.

  This brings me to a specific quality of Diane's that I think everyone in this room, philosopher or not, will recognize. Richard Rorty, the philosopher who inspired much of Diane's work, had a technical term for someone like her. He called it an "ironist."

  In the technical sense, an ironist is someone who fundamentally doubts their own "final vocabulary." They know that the words they use to justify their lives are just one set of tools among many, and they are always open to swapping them out for something better. But in the ordinary English sense, an ironist is someone with a dry, knowing wit.

  Diane is the only person I know who is an ironist in both senses simultaneously. She doubts her own final vocabulary constantly. And, after listening to me defend my final vocabulary for thirty-six years, she has developed a very dry wit indeed. I think we can all agree that given the arguments she has had to endure, her irony is entirely justified.

  But there is a deeper point to this. Because Diane never claimed to possess the Objective Truth, she never treated her colleagues or students as obstacles to be defeated. She treated us as members of a community. For Diane, philosophy wasn't about achieving objectivity; it was about achieving solidarity. It wasn't about standing alone against the world and seeing it clearly; it was about standing together and figuring out what to say next.

  That is why this room is so full tonight. It isn't because Diane solved the riddles of the mind. It's because she made the people around her feel that their contributions mattered. She made the conversation wider, not narrower. She made the department a place where you could try out a new way of speaking without fear of being told you were "wrong" about reality. You were only ever told that you might be more useful if you spoke differently.

  So, as she moves into retirement, I am careful not to say she is "leaving the truth behind" or "resting on her laurels." Retirement, in Diane's terms, is just a redescription of her time. It is a chance to pick up new tools, to join new conversations, to find new ways of being useful to her family, her book club, and herself.

  I know she would not want me to say that she "mirrored" our appreciation for her. She would say that our appreciation is a sentiment that helps us cope with her absence from the hallway. And she is probably right.

  So, if everyone could please raise a glass.

  I will not toast to her accuracy. I will not toast to her insight into the nature of reality. I will not even toast to her being "right," because she would tell me that's not the point.

  Instead, I want to toast to the conversation. To the solidarity she built. To the tools she left in our hands. And to the hope that, wherever she goes next, she finds a community of inquirers who are just as willing to listen as she has always been.

  To Diane. To the conversation that continues.
