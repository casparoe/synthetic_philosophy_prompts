          *   *Manley & Wasserman:* Gradual dispositions / propensity accounts.
          *   *Key Insight:* Most modern accounts move away from simple conditionals to **causal powers** or **structural properties**. To distinguish mask from absence, you need to look at the *structure*, not just the *behavior*.
          *   *The "Test" Problem:* Philosophy admits there is no *behavioral* test that guarantees distinction. You need access to the categorical base.
      *   *AI Context:* This maps perfectly to the "behavioral alignment vs. mechanistic alignment" debate.
      *   *Conclusion:* Philosophy confirms the pessimism. You cannot distinguish mask from absence purely via input/output probes (SCA). You need access to the "categorical base" (mechanistic interpretability). The philosophical consensus is that dispositions *are* real properties (causal bases), not just Humean regularities. Therefore, verifying safety requires verifying the base, not just the outputs.

  5.  **Synthesize and Structure the Response:**

