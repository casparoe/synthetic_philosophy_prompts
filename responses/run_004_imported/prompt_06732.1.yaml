prompt: |-
  I sit on my presbytery's candidates committee, which reviews ordination exams before they go to the floor. One candidate -- sharp guy, did a philosophy MA before seminary -- wrote in his atonement paper that he wants to take an exception to the Confession's language on penal substitution. His argument leans on that old David Lewis essay where Lewis tries to rescue the doctrine by comparing it to paying off someone else's debt, but then basically concedes the comparison only works if punishment doesn't have to fall on someone who actually deserves it -- which the candidate takes to mean that penal substitution survives only as a kind of legal fiction, not the real retributive justice the Confession seems to describe. Some commitee members want to call this a denial of an essential doctrine and end his process right there; others (myself half included, honestly, since I couldn't explain what "in our place" means any better than he does) think refusing exceptions like this would quietly screen out a lot of people who've actually thought it through. We report back to presbytery in two weeks -- can you draft the committee's recommendation memo: approve the exception, deny it, or send him back for revisions, with reasoning solid enough that both he and the stricter members would have to actually engage with it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Presbytery Candidates Committee (Presbyterian Church in America [PCA] or similar Reformed tradition, given the reference to "Confession," "ordination exams," "presbytery," and "penal substitution").
      *   **Issue:** A candidate for ordination has taken an exception to the Westminster Confession of Faith (WCF) regarding Penal Substitutionary Atonement (PSA).
      *   **Candidate's Argument:** He cites a David Lewis essay (likely *Do We Believe in Penal Substitution?*). Lewis argues PSA works like paying a debt, but admits this implies punishment doesn't need to fall on the guilty party. The candidate concludes PSA survives only as a "legal fiction," not the "real retributive justice" the Confession describes.
      *   **Committee Dynamics:** Split. Some want to deny ordination (essential doctrine denial). Others (including the user) worry about screening out thoughtful people and admit difficulty articulating "in our place" better than the candidate.
      *   **Task:** Draft a committee recommendation memo (Approve, Deny, or Revise) with reasoning solid enough to engage both the candidate and the stricter members.
      *   **Timeline:** Report back in two weeks.

  2.  **Determine the Theological & Ecclesiastical Stakes:**
      *   **Denomination:** Likely PCA or OPC. The WCF is the standard.
      *   **WCF on Atonement:** Chapter 8, Section 5. "By his perfect obedience, and sacrifice of himself... he hath fully satisfied the justice of his Father; and purchased not only reconciliation, but an everlasting inheritance... for all those whom the Father hath given unto him."
      *   **Good Faith Subscription:** In most Reformed bodies, candidates must subscribe to the Confession *in good faith*. Exceptions are allowed if they don't strike at the "essentials of the Reformed faith and polity."
      *   **The Core Tension:** Is PSA an *essential* of the Reformed faith? Generally, yes. Is a nuanced philosophical critique of *how* it works (metaphysics of punishment vs. debt) a denial of the *fact* of it? That's the grey area.
      *   **The Candidate's Error:** He seems to be conflating the *mechanism* (how justice is satisfied) with the *reality* (that justice was satisfied). If he calls it a "legal fiction," that's dangerous language. A fiction implies it didn't *really* happen. The Confession says Christ *did* bear the wrath.
      *   **The Committee's Duty:** Protect the church's doctrinal integrity while not imposing extra-confessional philosophical precision as a test of orthodoxy.

  3.  **Evaluate the Options:**
      *   **Option 1: Deny/Reject Exception.** Too harsh? Might stifle legitimate theological nuance. Risks legalism. But if he calls PSA a "fiction," that's a red flag.
      *   **Option 2: Approve Exception.** Too risky? If he preaches PSA is a "fiction," the congregation gets confused. Undermines the Confession's authority.
      *   **Option 3: Send Back for Revisions/Clarification (The "Middle Way").** This allows the committee to address the dangerous language ("legal fiction") without demanding the candidate abandon his philosophical inquiries. It forces him to distinguish between *metaphysical critique of retribution* and *confessional affirmation of substitution*.

      *Decision:* Option 3 is the most pastoral and ecclesiastically sound. It protects the church (by ensuring he doesn't preach "fiction") and protects the candidate (by allowing him to refine his language rather than rejecting his mind).

  4.  **Drafting the Memo - Structure:**
      *   **Header:** Standard Committee Memo format.
      *   **Subject:** Clear and specific.
      *   **Summary of Case:** Briefly state the exception and the argument.
      *   **Committee Deliberation:** Acknowledge the split and the seriousness.
      *   **Theological Analysis:** Engage the Lewis argument and the WCF.
      *   **Recommendation:** "Return for Clarification/Revision."
      *   **Specific Guidelines:** What exactly does he need to fix?
      *   **Rationale:** Why this path? (For both sides of the committee).

  5.  **Drafting - Key Theological Points to Hit:**
      *   **WCF 8.5:** Christ *really* bore the wrath.
      *   **"Legal Fiction" vs. "Legal Reality":** In Reformed theology, the Great Exchange is a legal reality (forensic justification), but it is grounded in ontological reality (Christ actually suffered). Calling it a "fiction" suggests God is lying.
      *   **Lewis's Point:** Lewis is discussing the *coherence* of transferring guilt. The candidate needs to affirm that *whatever the metaphysical mechanism*, the Confession's claim (Christ bore the penalty) is true.
      *   **Good Faith Subscription:** He can question the *philosophical underpinnings* but cannot deny the *doctrinal claim*.

  6.  **Refining the Tone:**
      *   Must be charitable but firm.
      *   Must sound like a Reformed committee (respect for Confession, concern for the Church).
      *   Must address the "stricter members" (upholding standards) and the "lenient members" (allowing thoughtfulness).

  7.  **Addressing the Specific "David Lewis" Argument:**
      *   David Lewis (the philosopher, not C.S. Lewis) wrote *Do We Believe in Penal Substitution?* (1997). He argues that PSA is problematic because punishment essentially involves pain inflicted *because* of wrongdoing. Transferring this is weird.
      *   The candidate's takeaway: It's a "legal fiction."
      *   The Counter: In forensic justification, the *imputation* is real, not fictional. Christ *actually* suffered the penalty. The candidate needs to affirm the *reality* of the suffering and the *justice* of the transfer, even if the metaphysics are mysterious.

  8.  **Final Review against Constraints:**
      *   Does it engage both sides? Yes, by upholding the Confession (strict side) while allowing nuance (lenient side).
      *   Is it actionable? Yes, he has to rewrite.
      *   Is it theologically sound? Yes, distinguishes between mystery and fiction.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe approve it with a warning.
      *   *Correction:* No. "Legal fiction" is too close to heresy (making God a liar). He needs to revise that specific phrase.
      *   *Initial thought:* Maybe deny it.
      *   *Correction:* Too final. He's otherwise "sharp." Give him a chance to clarify if he means "mystery" instead of "fiction."
      *   *Focus:* The memo needs to explain *why* "fiction" is the dealbreaker, not the philosophical questioning itself.

  10. **Final Polish:** Ensure Presbyterian polity language (Presbytery, Sessions, Good Faith Subscription, Essentials). (Note: I will assume PCA/OPC style polity as it's the most common context for "Presbytery + Confession + Ordination Exams".)

  *(Self-Correction on Denomination)*: The prompt mentions "Presbytery" and "Confession" and "Ordination Exams." This is classic PCA/OPC/ECO territory. I will write it generically enough to fit Reformed polity but specific enough to be useful. I will use "WCF" (Westminster Confession of Faith) as the default.

  *(Key Distinction)*: The committee isn't judging his philosophy degree; they are judging his fitness to *teach* the Confession. The memo must make this distinction clear.

  *(Drafting the Recommendation)*: "Return for Revision/Clarification" is the best path. It avoids the binary of Pass/Fail immediately.

  *(Reasoning for Strict Side)*: We are not lowering the bar. "Legal fiction" undermines the truthfulness of God.
  *(Reasoning for Lenient Side)*: We are not demanding philosophical uniformity. We are asking for confessional precision.

