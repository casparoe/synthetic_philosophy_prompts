answer: |-
  **MEMORANDUM**

  **TO:** The Presbytery
  **FROM:** The Committee on Candidates and Credentials
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Ordination Exception: Candidate [Name]
  **RE:** Systematic Theology Exam – Doctrine of Atonement

  ### I. Summary of the Exception
  Candidate [Name] has submitted a written exception to Westminster Confession of Faith (WCF) 8.5, regarding the doctrine of Penal Substitutionary Atonement. 

  In his exam paper, the candidate affirms that Christ's death was vicarious and efficacious. However, drawing on philosophical analysis (specifically David Lewis's *Do We Believe in Penal Substitution?*), he argues that the transfer of penal guilt cannot constitute "retributive justice" in a strict metaphysical sense without becoming a "legal fiction." He contends that while the Confession's language is functionally useful, it describes a forensic arrangement that does not align with the philosophical requirements of personal desert. He wishes to be ordained holding that PSA is a *true* description of salvation, but *not* because it satisfies retributive justice in the manner the Confession implies.

  ### II. Committee Deliberation
  The Committee engaged in substantial debate regarding this exception. We recognize two legitimate concerns within the body:

  1.  **Doctrinal Integrity:** Some members argue that characterizing Penal Substitution as relying on a "legal fiction" strikes at the essentials of the Reformed faith. If the atonement is a fiction, the justification of the sinner is potentially undermined, and the truthfulness of God is implicated. WCF 8.5 states Christ "fully satisfied the justice of his Father." To suggest this satisfaction is fictional seems to contradict the Confession directly.
  2.  **Theological Nuance:** Other members note that the candidate is engaging in high-level philosophical theology. Many faithful ministers struggle to articulate the metaphysics of imputation without resorting to mystery. To reject a candidate for probing the *mechanism* of atonement, while affirming the *reality* of it, may impose an extra-confessional philosophical test that screens out thoughtful pastors.

  ### III. Theological Analysis
  The Committee agrees that the candidate's philosophical inquiry is not, in itself, disqualifying. Reformed orthodoxy has always allowed for nuance regarding *how* the atonement accomplishes its work, provided the *fact* of the work is upheld.

  However, the specific terminology used by the candidate presents a pastoral and theological risk. In Reformed theology, the "Great Exchange" is a **legal reality**, not a **legal fiction**. 
  *   A **fiction** implies a pretense; it suggests God declares something to be true which is, in reality, false (i.e., that Christ was punished when He was not, or that we are righteous when we are not). 
  *   A **forensic declaration** implies a real transfer based on a real payment. 

  The candidate's reliance on Lewis leads him to a conclusion that threatens the truthfulness of the Gospel proclamation. If the satisfaction of justice is a "fiction," then our reconciliation with God rests on a divine pretense. The Committee cannot recommend an exception that allows a teaching elder to assert from the pulpit that the core mechanism of our salvation is "fictional," even if he intends to affirm the saving outcome.

  ### IV. Recommendation
  **The Committee recommends returning the exam to the candidate for revision.**

  We do **not** recommend denying the exception outright, nor do we recommend approving it in its current form. We believe the candidate can maintain his philosophical reservations regarding the *metaphysics of retribution* while still subscribing to the Confession's assertion of the *reality of satisfaction*.

  **Required Revisions:**
  The candidate is asked to revise his exception statement to clarify the following points:
  1.  **Affirmation of Reality:** He must explicitly affirm that Christ's bearing of the wrath of God was an objective, historical, and ontological reality, not merely a functional or fictional arrangement.
  2.  **Distinction between Mystery and Fiction:** He must distinguish between the *mystery* of how guilt is imputed (which may remain philosophically opaque) and the *truth* that it is imputed (which is confessional dogma).
  3.  **Pastoral Commitment:** He must affirm that, despite his philosophical questions, he is willing to preach and teach WCF 8.5 in its plain sense to the flock, without undermining their assurance that their debt is *really* paid, not just treated as such.

  ### V. Rationale for the Presbytery
  This recommendation seeks to honor the conscience of the candidate while protecting the peace and purity of the Church.

  *   **To the stricter members:** This recommendation upholds the standard. We are not allowing the candidate to deny the reality of Penal Substitution. We are insisting that the language of "legal fiction" be removed because it compromises the truthfulness of God's forensic declaration. The Confession remains the standard of teaching.
  *   **To the more lenient members:** This recommendation avoids philosophical rigidness. We are not demanding the candidate abandon the Lewis essay or resolve the metaphysical tension of imputation. We are asking only that he frame his exception in a way that does not inadvertently teach error. This preserves space for theological depth within the bounds of Good Faith Subscription.

  The Committee believes Candidate [Name] is capable of making these distinctions. He has demonstrated intellectual rigor; we now ask him to demonstrate confessional precision. We request the Presbytery table this matter until the candidate has submitted his revision, at which point the Committee will review it for final approval.

  Respectfully Submitted,

  [Your Name/Chair Name]
  Committee on Candidates and Credentials
