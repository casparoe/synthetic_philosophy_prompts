prompt: |-
  At work, we spent weeks testing a rewrite of our billing service, and every result showed it was better than the system it replaced, so my tech lead is convinced we now know the rewrite is correct. When a support ticket this week suggested the rewrite might be silently overcharging some customers, he dismissed it almost immediately, arguing that since we already know the new system is sound, anything that looks like evidence against it must itself be mistaken or misleading. That struck me as a little too convenient, but I couldn't quite explain what, if anything, is wrong with the reasoning. Is my tech lead's position defensible, or is there a real flaw in it that I'm missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Scenario:**
      *   **Context:** A billing service rewrite was tested for weeks. All tests showed improvement.
      *   **Event:** A support ticket suggests the new system might be silently overcharging customers.
      *   **Tech Lead's Reaction:** Dismissed the ticket immediately.
      *   **Tech Lead's Reasoning:** "We *know* the new system is sound (based on testing), so any evidence against it must be mistaken."
      *   **User's Intuition:** Something feels wrong/too convenient about this reasoning.
      *   **Question:** Is the tech lead's position defensible, or is there a real flaw?

  2.  **Identify the Core Logical/Cognitive Issue:**
      *   The tech lead is treating a probabilistic conclusion (testing suggests correctness) as an absolute truth (we *know* it is sound).
      *   The tech lead is dismissing contradictory evidence *because* it contradicts the prior belief, rather than evaluating the evidence on its own merits.
      *   This is a classic case of **Confirmation Bias** and **Belief Perseverance**.
      *   In terms of epistemology/scientific method: It's a failure to falsify. It treats the hypothesis as proven rather than provisionally accepted.
      *   In terms of software engineering: It ignores the difference between *verification* (did we build the product right according to specs?) and *validation* (did we build the right product?/does it match reality?). It also ignores the limitations of testing (test environments vs. production, edge cases, data differences).

  3.  **Evaluate the Tech Lead's Position:**
      *   *Defensible?* No, not really. It's dogmatic.
      *   *Flaw?* Yes, significant.
      *   *Risk:* High. Billing errors lead to financial loss, legal issues, and trust erosion.

  4.  **Formulate the Argument:**
      *   **Validate the User:** Confirm their intuition is correct. This is a dangerous mindset.
      *   **Name the Fallacy:** Identify the logical error (circular reasoning, ignoring disconfirming evidence, treating probability as certainty).
      *   **Explain the Engineering Reality:** Testing $\neq$ Proof. Production $\neq$ Staging.
      *   **Highlight the Stakes:** Billing is high-risk. Silent overcharging is worse than undercharging (reputation/legal).
      *   **Provide Actionable Advice:** How to push back constructively.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* You are right to be concerned. This is a classic cognitive trap.
      *   *The Logical Flaw:* It's circular. "It works because we proved it works, therefore this proof it doesn't work is wrong." It's also "Theory over Evidence."
      *   *The Engineering Flaw:* Testing coverage is never 100%. Production data is messier than test data. "Silent" errors are specifically hard to catch in tests.
      *   *The Business Risk:* Billing errors are existential threats.
      *   *The Psychological Aspect:* Sunk cost fallacy (weeks of testing), Authority bias.
      *   *Recommendation:* Don't accuse him of being wrong directly. Frame it as risk mitigation. "Let's investigate to be sure" rather than "You are ignoring evidence."

  6.  **Refining the Logic (Self-Correction/Nuance):**
      *   *Is the lead *totally* wrong?* Well, testing *should* carry weight. If 10,000 tests passed and 1 ticket came in, the ticket *might* be user error. But dismissing it *immediately* without looking is the problem.
      *   *Key distinction:* Skepticism vs. Dismissal. Skepticism is healthy; dismissal based on prior belief is not.
      *   *Term to introduce:* "The Map is Not the Territory." The tests are the map; production is the territory.
      *   *Term to introduce:* "Falsifiability." A system isn't proven true; it survives attempts to prove it false.

  7.  **Final Polish:**
      *   Structure with clear headings.
      *   Keep the tone professional but firm on the principles.
      *   Ensure the advice is practical for a workplace dynamic (don't just say "he's stupid," say "here's how to handle it").

  8.  **Final Review against Safety Guidelines:**
