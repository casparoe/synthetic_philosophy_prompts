answer: |-
  ### The Challenge: Moral Licensing and the Fragmentation of Character

  To move beyond the standard situationist critique (which typically targets the *consistency* of character traits across situations), we must examine findings that threaten the **structural coherence** of virtue itself. The classical Unity-of-Virtue thesis (found in Aristotle's *Nicomachean Ethics*, 1144b–1145a) posits that the virtues are inter-entailing: one cannot fully possess courage without justice, nor temperance without practical wisdom (*phronesis*). This is because *phronesis* provides a unified cognitive architecture that perceives the "mean" across all domains of action. If *phronesis* is unitary, the exercise of one virtue should reinforce, or at least be compatible with, the exercise of others.

  A finding that specifically threatens this thesis is the phenomenon of **Moral Licensing**, particularly the **"Moral Credentials" effect** (Monin & Miller, 2001; Merritt, Effron, & Monin, 2010).

  #### The Finding: Moral Credentials and Compensatory Ethics
  In a paradigmatic study by Monin and Miller (2001), participants who were given the opportunity to establish their non-prejudiced credentials (e.g., by selecting a qualified Black candidate for a job in a preliminary task) were subsequently *more* likely to make discriminatory choices in a second, unrelated task (e.g., favoring a White candidate for a different role or endorsing stereotypical policies) compared to a control group.

  Later meta-analyses (Merritt et al., 2010) generalized this: past moral behavior often licenses subsequent selfish, dishonest, or unjust behavior. Crucially, this is not merely random inconsistency (noise); it is a **systematic negative correlation** between virtuous acts across domains. The psychological mechanism appears to be a form of **moral self-regulation** where agents maintain a target level of moral self-regard. Once "credit" is banked in one domain (Justice), the agent feels permission to "spend" it in another (allowing Greed or Bias).

  #### Why This Threatens the Unity Thesis
  Standard situationist critiques argue that virtues are too fragile to exist. The Licensing critique is more damaging to the Aristotelian specifically because it challenges the **inter-entailment** of virtues.

  1.  **Commodity vs. State:** Licensing suggests moral psychology operates on a *homeostatic* or *ledger* model (balancing good and bad to maintain equilibrium), whereas the Unity thesis relies on a *growth* or *hexis* model (where acting virtuously strengthens the disposition to act virtuously).
  2.  **Fragmentation of *Phronesis*:** If *phronesis* were a unified capacity to perceive the good, establishing a commitment to justice should heighten sensitivity to injustice elsewhere. Licensing demonstrates that establishing a commitment to justice can actively *dampen* sensitivity to subsequent injustices. This implies that the cognitive mechanisms driving "just" behavior and "fair" behavior are not unified under a single rational structure but are fragmented modules competing for self-concept maintenance.
  3.  **The Trade-Off:** The Unity thesis claims virtues cannot conflict because they are all expressions of the same wisdom. Licensing shows virtues (or their simulacra) function as fungible commodities that can be traded off against one another.

  ---

  ### The Neo-Aristotelian Response: Julia Annas's Skill Model

  Julia Annas, in *Intelligent Virtue* (2011), offers a robust defense against situationism by reconceptualizing virtue not as a rigid behavioral disposition (which situationists easily dismantle) but as a **practical skill** analogous to playing the piano or practicing architecture. This model provides a specific avenue for defusing the Licensing threat without conceding the Unity thesis.

  #### 1. The Novice/Expert Distinction
  Annas argues that situationist data, including Licensing studies, predominantly captures the psychology of **moral novices**, not the *phronimos* (the practically wise agent).
  *   **The Argument:** In any skill domain (e.g., music), novices rely on heuristics, external validation, and fragmented rules. A novice pianist might play a difficult passage correctly once and then relax their focus, leading to errors. This does not prove that "piano skill" is an illusion; it proves that *expertise* is rare and requires integration.
  *   **Application to Licensing:** Licensing is a self-regulatory strategy used by agents whose moral motivation is tied to *self-concept maintenance* ("I am a good person") rather than the *telos* of the action itself ("This is the right thing to do"). Annas would categorize licensing agents as possessing, at best, "natural virtue" or continence, not full virtue. The Unity thesis describes the psychology of the expert, where the skill is fully integrated. The existence of fragmented novices does not refute the possibility of unified expertise.

  #### 2. Teleological Structure vs. Homeostatic Regulation
  The core of Annas's response targets the *goal* of the action.
  *   **The Argument:** Skills are defined by their *telos* (aim). A builder aims at a stable house; a virtuous agent aims at the *kalon* (the noble/good). Licensing data reveals that participants are not aiming at the *kalon*; they are aiming at **moral self-esteem**.
  *   **Application to Licensing:** When a participant licenses themselves to discriminate after acting non-prejudiced, they are treating morality as a currency to purchase a positive self-image. Annas argues this is a category error. In the skill model, you do not "balance" laying a perfect brick with laying a crooked one to maintain a "builder self-image." You lay every brick to serve the structure.
  *   **Defending Unity:** The Unity thesis holds because *phronesis* is the understanding of the *telos*. If the agent's *telos* is self-image (as in Licensing studies), they lack *phronesis*. Therefore, the data does not show that *phronesis* fails to unify virtues; it shows that most people lack *phronesis*. The negative correlation exists because the underlying motivational structure is ego-protective, not truth-tracking.

  #### 3. Integration as a Developmental Achievement
  Finally, Annas emphasizes that skills require **progressive learning and understanding**.
  *   **The Argument:** A skill becomes unified over time as the agent understands *why* the rules exist. A novice follows rules; an expert understands the principles behind them.
  *   **Application to Licensing:** Licensing often occurs when agents view moral actions as discrete tasks ("I did my good deed for the day"). Annas would argue this reflects a lack of understanding of the *reasons* for the action. As one develops virtue as a skill, one realizes that the reason for acting justly in hiring is the *same reason* for acting justly in policy.
  *   **Response to the Threat:** The Licensing effect diminishes as moral understanding deepens. Empirical work on moral identity (e.g., Aquino & Reed, 2002) suggests that for agents for whom morality is *central* to their identity (closer to Annas's "expert"), licensing effects are weaker or reversed (moral consistency prevails). Thus, the Unity thesis remains viable as a **regulative ideal**: it describes the endpoint of moral development, not the statistical baseline of undergraduate psychology pools.

  ### Summary
  The Moral Licensing finding threatens the Unity thesis by suggesting virtues are fungible credits in a homeostatic self-regulation system, directly contradicting the Aristotelian view of virtues as inter-entailing expressions of a unified *phronesis*.

  Annas's Skill Model responds by re-categorizing the data: Licensing reveals the fragmented heuristics of **moral novices** pursuing **self-esteem**, not the integrated understanding of **moral experts** pursuing the **good**. The Unity thesis is not an empirical claim about average human behavior, but a structural claim about the psychology of full virtue—a distinction the skill model preserves by treating virtue as an aspirational expertise rather than a descriptive trait.
