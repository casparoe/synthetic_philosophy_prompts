      *   *Make sure to distinguish between semantics and metaphysics.* This is the key to the reply.

  10. **Final Polish:** Check against the three specific requests in the prompt. (1. Fair representation? 2. Recognized problem? 3. Intelligible? + 4. Strongest reply).

  *(Self-Correction on "Hyperplans"):* Just to be precise, Gibbard introduces hyperplans in *Wise Choices, Apt Feelings* (1990) and refines them in *Thinking How to Live* (2003). The user cites *Thinking How to Live*, which is correct for the mature view.

  *(Self-Correction on Blackburn):* The "tree-structured notation" is likely the semantic trees in *Spreading the Word* chapter 6. It's fine to say the memory is fuzzy there, the core concept (logic of attitudes) is right.

