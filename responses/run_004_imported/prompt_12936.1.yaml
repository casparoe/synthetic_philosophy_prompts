answer: |-
  This is an exceptionally sharp set of notes, especially for a group that started from the Rationalist side of the pool. You have correctly identified the trajectory that trips up almost everyone moving from pop-rationalism to academic metaethics: the realization that the "folk" version of emotivism is a straw man, and that the sophisticated versions (Quasi-Realism, Norm-Expressivism) are formidable engineering projects.

  Here is feedback structured around your three requests, followed by the strongest expressivist reply to your worry about Gibbard.

  ### 1. Accuracy of Representation
  **Verdict: Fair and robust.**

  *   **Blackburn:** Your summary of the quasi-realist project is accurate. Blackburn's goal in *Spreading the Word* is indeed to earn the right to talk about truth, validity, and knowledge within an expressivist framework without positing realist properties. The "logic of attitudes" (often called the B-logic) is the correct mechanism. You are right that the specific mechanics of how he handles the conditional (as a higher-order attitude of disapproval toward a combination of attitudes) are technical and easy to misremember, but the *functional* description you gave is correct.
  *   **Gibbard:** Your description of the *Thinking How to Live* machinery is also accurate. Gibbard moves away from the purely psychological "expression" model toward a semantic model where normative sentences express propositions (sets of world-hyperplan pairs). This allows him to import classical logic directly, solving Frege-Geach by making normative sentences truth-apt relative to an index.
  *   **Nuance:** A specialist might note that Gibbard's view evolved from *Wise Choices, Apt Feelings* (1990) to *Thinking How to Live* (2003), with the latter being more explicitly semantic. But for the purpose of your notes, you have the core machinery right.

  ### 2. The Worry & Dreier's "Creeping Minimalism"
  **Verdict: You have correctly identified a canonical objection.**

  Your worry is not a conflation; it is a precise application of the **"Creeping Minimalism"** objection, most famously articulated by James Dreier (e.g., in *"Metaethics and the Retreat from Particularity"* or his 2004 paper *"Creeping Minimalism"*).

  *   **The Problem:** If expressivists say moral sentences have truth conditions, express propositions, and participate in valid inference just like realist sentences, what distinguishes expressivism from realism? If the semantics look identical, has the expressivist just become a realist who uses different words for "fact"?
  *   **Application to Gibbard:** You are right to target Gibbard here. By adopting a possible-worlds style semantics (even with hyperplans), Gibbard makes normative sentences truth-conditional. Dreier argues that once you allow expressivists to claim everything realists claim (truth, facts, propositions), the distinction collapses unless there is a *metaphysical* difference left over.
  *   **Is it a real extension?** Yes. While Dreier often targets quasi-realism (Blackburn), the objection applies *mutatis mutandis* to Gibbard's hyperplan semantics. If "Lying is wrong" is true at <w, h>, is that not a normative fact? Gibbard actually bites this bullet (see below), but the worry remains: does this preserve the anti-realist intuition that drew people to expressivism in the first place?

  ### 3. Intelligibility
  **Verdict: Intelligible to the target audience, with one caveat.**

  For a "sharp friend who knows the rough shape of the fact/value distinction," this is readable. The logical flow from Frege-Geach to the two solutions to the worry is clear.
  *   **The Caveat:** The term **"hyperplan"** does a lot of heavy lifting in the Gibbard paragraph. A layperson might stumble on "maximally specific plans covering every contingency." You might add a parenthetical example: *(e.g., a complete function mapping every possible situation to a specific action)*.
  *   **The Term "Index":** In "true or false at a world-hyperplan pair... with a fatter index," the word "index" is technical semantics jargon. You might gloss this as *(a coordinate for evaluation)*.
  *   **Otherwise:** The prose is dense but precise. It respects the reader's intelligence.

  ---

  ### 4. The Strongest Expressivist Reply (Blocking the Worry)

  If you want the strongest version of the reply to your worry (that Gibbard has ceased to be an expressivist in any interesting sense), it comes from distinguishing **Semantics** from **Metaphysics/Philosophy of Mind**.

  **The Argument:**
  The expressivist does not need to deny that moral sentences have truth conditions or that there are "moral facts." They need only deny that these things are **explained by mind-independent properties.**

  1.  **Deflationary Truth:** Gibbard (and many modern expressivists) adopts a deflationary theory of truth. To say "'Lying is wrong' is true" is just to say "Lying is wrong." It adds no metaphysical weight. Therefore, granting truth-conditions does not grant realism.
  2.  **The Nature of Judgment:** The distinctive claim of expressivism is not about the *sentence* (semantics), but about the *mental state* (psychology/metaphysics).
      *   **Realist:** Believing "Lying is wrong" is representing a mind-independent feature of the universe.
      *   **Gibbard:** Accepting "Lying is wrong" is **planning to feel guilt** (or endorsing a norm that prohibits lying).
  3.  **The Role of Hyperplans:** The hyperplan machinery is a *formal tool* to explain consistency and logic. It is not an ontology. When Gibbard says a sentence is true at a <world, hyperplan> pair, he is not saying there exists a metaphysical object called a hyperplan floating in the universe. He is saying: *To understand what moral discourse does, model it as if it were describing plans.*
  4.  **Gibbard's Own Move:** Gibbard actually concedes your point in a way. In *Thinking How to Live*, he admits that if "fact" just means "what is expressed by a true sentence," then there are normative facts. His anti-realism consists in the claim that these facts are **constituted by norms/plans**, not by causal, natural properties waiting to be discovered.

  **The Counter-Objection (for your meeting):**
  The realist will reply: "If you admit there are normative facts (even plan-constituted ones) that make sentences true, and these facts explain the truth of the sentences, you have a truth-maker theory. How is a 'plan-constituted fact' metaphysically different from a 'socially-constructed fact' or a 'response-dependent fact'?"

  **The Expressivist's Best Defense:**
  The difference lies in **direction of fit**.
  *   Realist facts have a **mind-to-world** direction of fit (beliefs aim to match the world).
  *   Normative "facts" have a **world-to-mind** direction of fit (the world is to be changed to match the plan).
  Gibbard's semantics treats them similarly to solve Frege-Geach, but his philosophy of mind insists the *functional role* of the state is planning, not representing. The "creeping minimalism" worry succeeds only if you think semantics *exhausts* metaphysics. Gibbard argues it does not.

  ### Summary for your Meetup
  Your notes are solid. You haven't reinvented the wheel; you've independently reconstructed one of the most significant debates in contemporary metaethics (the Dreier/Schroeder/Chrisman debates over the last 15 years).

  If you want to deepen the discussion, look up **Mark Schroeder's *Being For* (2008)**. He attempts to solve Frege-Geach without Gibbard's heavy semantic machinery, using "B-logic" but trying to avoid the creeping minimalism trap by being more explicit about the types of mental states involved. It might offer a middle ground for your group between Blackburn's vagueness and Gibbard's semantic inflation.
