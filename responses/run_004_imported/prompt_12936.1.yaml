  4.  **Address Point 2: The Worry & Dreier's "Creeping Minimalism"**
      *   *The Worry:* If expressivism adopts truth-conditions (even complex ones), does it lose its distinctive metaphysical advantage (avoiding moral facts)?
      *   *Dreier's Point:* James Dreier's "Metaethics and the Retreat from Particularity" (or similar works on creeping minimalism) argues that if expressivists say everything realists say (truth-apt, propositions, etc.), the distinction vanishes.
      *   *Connection:* The user's worry is *exactly* the core of the creeping minimalism objection. If Gibbard says "Lying is wrong" is true at <w, h>, in what sense is this not just a moral fact?
      *   *Nuance:* Gibbard would argue the *nature* of the proposition is different (it's about plans, not mind-independent properties). But semantically, it looks the same.
      *   *Verdict:* The user has correctly identified a major, recognized objection. It is not a conflation; it is a direct application of the Dreier-style worry to Gibbard's specific machinery. It's a standard objection in the literature (often discussed alongside Chrisman, Schroeder, etc.).

  5.  **Address Point 3: Clarity/Intelligibility**
      *   *Audience:* Sharp friend, knows fact/value, doesn't know Frege-Geach.
      *   *Analysis:* The text is dense. Terms like "non-cognitivism," "embedding problem," "modus ponens," "truth conditions," "hyperplans," "index," "quasi-realism" are used.
      *   *Verdict:* For a *sharp* friend who knows the fact/value distinction, it's probably passable, but "hyperplan" and "index" might need a tiny bit more gloss. The flow is logical. It assumes familiarity with "validity" in a semantic sense. It's ACX-meetup level, which is high. It should be intelligible but might require a second read.

  6.  **Address Point 4: The Strongest Expressivist Reply**
      *   *The Challenge:* How does Gibbard (or a defender) stop the slide into realism?
      *   *The Reply:* The distinction isn't semantic (truth conditions); it's *psychological/metaphysical* (what constitutes the state of mind).
      *   *Key Argument:* Realism says believing "X is wrong" is representing a mind-independent fact. Expressivism says accepting "X is wrong" is adopting a plan/norm. Even if we model that acceptance *as if* it were a proposition for logic's sake, the *constitutive nature* of the mental state is different.
      *   *Gibbard's specific move:* The "semantics" is a formal tool to explain consistency. The "metaphysics" is in the analysis of judgment as planning. The truth-conditions are *expressivist* truth-conditions (defined in terms of plans), not *realist* truth-conditions (defined in terms of correspondence).
