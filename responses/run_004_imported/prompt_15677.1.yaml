          *   If the question implies "pick a number between 20 and 50," length is the natural parameter.
          *   If the question implies "pick a planter from a shelf," volume/mass might be more natural (packing density).

      *   *Reference Priors (Bernardo/Berger):* In statistics, we use reference priors to minimize information input. But even these depend on the model parameterization.

  4.  **Drafting the Argument Structure:**

