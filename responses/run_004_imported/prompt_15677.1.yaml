answer: |-
  You and your friend have independently rediscovered one of the most famous and vexing problems in the foundations of probability theory. It is often called the **Problem of the Cube**, and it serves as a modern variation of **Bertrand's Paradox**.

  The short answer to your core question is: **Yes, the problem as you posed it is strictly underdetermined.** There is no mathematical or logical fact of the matter about which probability is "correct" without adding a premise about *how* the value is generated.

  However, the longer answer is much more interesting. It does not mean probability theory is broken, nor does it force us to retreat into a shrug of pure subjectivity. Instead, it reveals that the **Principle of Indifference** (the habit of assigning equal probabilities when ignorant) is not a fundamental law of logic, but a heuristic that requires a specific condition to function: **invariance under the relevant transformation group.**

  Here is a breakdown of why this happens, how the great physicist and probabilist E.T. Jaynes resolved it, and what it implies for reasoning under ignorance.

  ### 1. The Mathematical Conflict
  Your intuition and your friend's intuition are both mathematically consistent within their own frameworks, but they are incompatible with each other because they assume different **measures**.

  *   **Your assumption:** The *length* $L$ is uniformly distributed.
      $$P(L < 35) = \frac{35 - 20}{50 - 20} = 0.5$$
  *   **Your friend's assumption:** The *volume* $V$ is uniformly distributed. Since $V = L^3$, a uniform distribution on $V$ implies a probability density function for $L$ that is heavily skewed toward larger cubes.
      $$P(L < 35) = P(V < 35^3) = \frac{35^3 - 20^3}{50^3 - 20^3} \approx 0.298$$

  The conflict arises because "uniformity" is not an invariant property. If you spread probability mass evenly across a ruler (length), you do not spread it evenly across the cube of that ruler (volume). A linear transformation preserves uniformity; a non-linear one (like cubing) does not.

  Therefore, asking "Which variable is uniform?" is equivalent to asking "What is the geometry of our ignorance?" Without defining the geometry, the question has no answer.

  ### 2. The Jaynes Resolution: Ignorance is Not a State
  The most rigorous defense of objective probability in this context comes from **E.T. Jaynes**, specifically in his work on the *Principle of Transformation Groups*.

  Jaynes argued that the Principle of Indifference is often misused. We cannot simply say, "I don't know, so I'll assume everything is equally likely." We must ask: **"What remains unchanged (invariant) given the information I *do* have?"**

  To assign a probability, you must model the **generative mechanism**.
  *   **Scenario A:** A machine is programmed to pick a length $L$ from a digital display between 20 and 50. The mechanism controls length. Here, the problem is invariant under translation of length ($L \to L + \delta$). The uniform distribution on length is the unique solution that respects this invariance. **Your answer (0.5) is correct.**
  *   **Scenario B:** A warehouse is filled with cubes, and you pick one at random from the shelf. If the cubes are packed by volume (e.g., they fill a truck), you are more likely to pick a larger cube because there are fewer of them to fill the space, or perhaps you are sampling by mass. If the selection process is sensitive to volume, the invariance lies elsewhere.

  Jaynes showed that if you cannot specify a transformation group (a symmetry) that leaves the problem unchanged, you cannot derive a unique prior distribution. The "paradox" exists only because the problem statement ("a manufacturer can produce any edge length...") describes the *range of possibilities* but hides the *method of selection*.

  ### 3. Is There a Principled Way to Decide?
  You asked if there is a defensible way to decide which quantity should be treated as evenly spread out. In the context of your specific story (a manufacturing business), there actually **is** a principled reason to prefer your answer (edge length) over your friend's (volume), though it relies on physical knowledge, not pure logic.

  In manufacturing, tolerances and specifications are almost universally defined by **linear dimensions**, not volume or surface area.
  1.  **Control:** A machine cuts metal or plastic to a specific length. It does not "cut to a specific volume." Errors accumulate linearly.
  2.  **Specification:** Customers order by dimension ("I need a 30cm planter"), not by soil capacity ("I need a 27-liter planter").
  3.  **Continuity:** If the manufacturer produces a continuous stream of planters, the "density" of production is naturally defined per unit of the control parameter (length).

  Therefore, while the *mathematical* puzzle is underdetermined, the *physical* context resolves it. The "natural measure" of the manufacturing process is length. If the problem were about crystal formation in a geode, where growth might be limited by nutrient diffusion (surface area) or mass availability (volume), the "natural measure" might shift.

  ### 4. Implications for the Principle of Indifference
  This brings us to your broader concern: Does this example suggest the habit of assigning equal probabilities is unsound?

  It suggests the habit is **dangerous if applied to statements rather than processes.**

  The Principle of Indifference is rescuable, but it must be upgraded to the **Principle of Maximum Entropy** (MaxEnt) or framed within **Reference Priors**.
  *   **MaxEnt:** Instead of saying "all outcomes are equal," you say "choose the distribution that maximizes uncertainty (entropy) *subject to the known constraints*."
      *   If the only constraint is "Length is between 20 and 50," MaxEnt yields a uniform distribution on Length.
      *   If the constraint is "Volume is between 8000 and 125000," MaxEnt yields a uniform distribution on Volume.
      *   The contradiction vanishes once you realize these are *different constraints*. You cannot have both constraints simultaneously without over-specifying the system.

  *   **Parameterization Invariance:** In formal Bayesian statistics, we use **Jeffreys Priors**. These are constructed specifically to be invariant under reparameterization. If you calculate the Jeffreys prior for this problem, it depends on the Fisher Information of the underlying statistical model. But again, this requires a model of how data is generated.

  ### 5. Conclusion: Logic Requires Premises
  The frustration you and your friend felt is the feeling of running into the limits of logic itself. Probability is not a property of the world (like mass); it is a relationship between a state of knowledge and a proposition.

  If your state of knowledge is "The length is between 20 and 50," the probability is 0.5.
  If your state of knowledge is "The volume is between 8000 and 125000," the probability is ~0.3.
  If your state of knowledge is merely "A cube exists with size in this range," **there is no probability.**

  The question is underdetermined because "ignorance" is not a specific piece of information. It is the absence of information. You cannot derive a specific number from an absence.

  **The verdict:**
  1.  **Is the question underdetermined?** Yes. Without specifying the *selection mechanism* (how the next order is chosen), there is no unique answer.
  2.  **Is the Principle of Indifference broken?** No, but it is often misapplied. It applies to the **fundamental parameters of the generative process**, not to derived quantities. In a manufacturing context, length is the fundamental parameter.
  3.  **What is the lesson?** When reasoning under ignorance, do not ask "What is equally likely?" Ask "What process is generating this value, and what is invariant about that process?"

  You were right to trust your instinct about length, but not because it is logically superior in a vacuum. It is superior because, in the real world of manufacturing, length is the causal lever, and volume is merely a consequence. Your friend's error was treating a derived physical property as if it were an independent control variable.
