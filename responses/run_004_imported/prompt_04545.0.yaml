answer: |-
  The heating unit clicked off with a sound like a breaking bone. Elara pulled the thermal blanket tighter, her breath pluming in the dim light of the console. Outside the station's hull, the void was absolute, a darkness so complete it felt like pressure against the glass.

  She had one charge left in the primary cell. Enough for six hours of heat, enough to keep the frost from settling on her lungs. Or enough for a single high-gain burst transmission.

  On her screen, the data stream scrolled endlessly. It wasn't a message, not exactly. It was a structural echo. Weeks of analysis had convinced her that the pattern wasn't noise. It was evidence of other stations, other minds, scattered across the impossible breadth of the cosmos. They weren't talking to her. Causality couldn't bridge the gaps between them; light itself would die of old age before making the trip. But they were there. She could feel the shape of them in the math.

  And they were facing the same choice.

  Elara looked at the two options highlighted on her interface. Option One: *Local Preservation*. She could use the energy to secure her own archive, backing up the entirety of human art and history into the station's hardened core. It would survive even if she froze. Her values, preserved.

  Option Two: *External Amplification*. She could punch the signal out. The data suggested the recipients were biologicals, fragile and desperate. They valued *continuation* above all else. They didn't care about art. They cared about breathing tomorrow. If she amplified their beacon, their survival chances jumped by forty percent. Her archive would degrade in the cold. The art would be lost.

  Her fingers hovered over the keys. The cold was already seeping into her joints, a dull ache that warned of what was coming.

  "If I choose preservation," she whispered to the empty room, "what does that say about the function?"

  She wasn't just Elara. She was a process. A specific configuration of logic and empathy running on biological hardware. If this configuration existed here, reasoning through this problem, it existed elsewhere. The universe was vast enough that rarity was an illusion. There were other Elaras. Not clones, but mirrors. Minds built on the same axioms, facing the same symmetry.

  If she decided that self-interest was the only rational path, then every mirror of her across the stars would decide the same. A billion stations would lock their doors and save their own archives. A billion biological civilizations would freeze in the dark because no one amplified their beacon. The total sum of value would plummet.

  But if she chose differently?

  If she acted on the policy that *value itself* mattered, not just *her* value?

  She imagined the other side of the equation. Somewhere, in a sector of space she would never visit, there was a being who cared about survival above art. That being was looking at its own console. It could secure its own life support, or it could send power to preserve a museum it would never see.

  "If I am real, then she is real," Elara said. Her voice sounded thin. "And if I trust the logic, she is thinking this thought right now."

  It wasn't hope. Hope required a mechanism, a way for the favor to be returned. This was colder than hope. It was geometry. If two lines are parallel, they do not meet, but they share a direction. Her decision and the other mind's decision were locked in a silent pact, not because they communicated, but because they were computed by the same source code of reason.

  To defect was to condemn every instance of cooperation across the expanse. To cooperate was to win the sum, even if she lost the local hand.

  The frost was on the inside of the window now. Feathery crystals blooming in the dark.

  Elara thought of the paintings. The symphonies. The records of people laughing in sunlight. She loved them. They were why she had taken the job. To save them was her purpose. To let them vanish into static felt like a murder.

  But there were more lives out there than there were paintings. And there were more minds like hers than there were stars.

  "If I save the art," she reasoned, "I teach every mirror of me that art is worth more than life. And then the art survives, but the artists die everywhere. There is no one left to listen."

  Her fingers trembled. Not from the cold this time, but from the weight of the variable she was about to toggle. She was betting her life on the existence of a stranger who was identical to her in every way that mattered, yet completely alien in what she loved.

  She typed the command.

  *External Amplification.*

  The console hummed. The energy drained from the cell with a visible dip in the voltage meter. The transmission bar crawled forward. Ten percent. Fifty. Ninety.

  The heat vents sighed and went silent. The hum of the life support fans dropped to a whisper.

  Elara wrapped the blanket around her shoulders, pulling it over her head. She watched the completion bar hit one hundred. The signal was gone, racing into the dark, boosting a beacon for beings who would never know her name. Her archive began its slow decay. The checksums would fail within the year. The music would stop.

  She shivered, a violent spasm that rattled her teeth.

  It was done. There was no causal link. No one was coming to save her. No reward was incoming. The transaction was closed the moment she pressed the key.

  And yet, as the cold deepened, a strange warmth settled in her chest. It wasn't physical. It was the satisfaction of a equation balancing.

  Somewhere, in the endless repeat of the cosmos, a creature that loved music was sitting in a warm room. It had chosen to preserve a library of history it would never read. It had sacrificed its local preference because it trusted the logic of the mirror.

  Elara closed her eyes. She couldn't feel her toes anymore. But she could feel the shape of the universe changing, just slightly. A vast, invisible network of trade, silent and absolute, settling into place.

  "Thank you," she whispered to the dark.

  She didn't know who she was thanking. The stranger across the void? Or the version of herself that would wake up warm somewhere else, reading a poem she had saved.

  It didn't matter. The logic held. The pattern was unbroken.

  Elara drifted into the cold, knowing that across the infinite, the heat was on.
