answer: |-
  The office was quiet, the kind of silence that only happens after 8 PM when the HVAC system drops to its night cycle. The whiteboard in Conference Room B was already half-covered in dried-out diagrams from the morning's standup.

  Priya was capping a red marker. Marcus was leaning back in his chair, spinning a pen. The rest of the team had left an hour ago, but the tension from the Slack thread still hung in the air.

  "You didn't reply to my last message," Priya said, not looking up from the board.

  "I read it," Marcus said. "I just didn't want to type a novel in #general. You're talking about Extremal Goodhart like it's gravity. Like, if we measure Code Review Turnaround Time (CRTT), the universe *physically* forces us to ship bugs."

  Priya turned around. "Not the universe. The math. Look, CRTT is a proxy for 'engineering velocity.' Right? That's the real goal."

  "Correct."

  "But it's not *identical* to velocity. It's correlated. When you optimize a proxy, you move into the tails of the distribution. In the tail, the correlation breaks. If we push CRTT to the extreme minimum, we don't get maximum velocity. We get zero review quality. The real goal—shipping stable features—actually gets *worse*. That's Extremal Goodhart. It's not a risk; it's a geometric certainty."

  Marcus stopped spinning the pen. He stood up and walked to the whiteboard, picking up a blue marker. He drew a curve.

  "Okay. I grant you the curve. I grant that if we try to minimize CRTT to zero, we break production. But Priya, you're assuming we're idiots. You're assuming the optimization function is 'Minimize CRTT at all costs.' That's not statistical hygiene; that's bad management."

  "It's not about management," Priya said, crossing her arms. "It's about Specification Gaming. That's the second failure mode. Even if leadership is sane, the *engineers* are rational agents. If my perf review depends on CRTT, I will find the gap between 'fast review' and 'good review.' I'll approve code without reading it. I'll split large PRs into tiny ones to game the average. The metric creates the incentive to decouple the metric from the goal. You can't hygiene your way out of human incentives."

  Marcus drew a second line on the board, intersecting the first. "So your solution is... what? Don't measure anything? Fly blind?"

  "My solution is acknowledge that the metric is toxic by design once it becomes a target. We should be using it for observation, not optimization."

  "Observation is useless if you don't act on it," Marcus countered. "Here's my comeback to your Extremal claim. You said the correlation breaks in the tails. Agreed. But we don't live in the tails. We live in the basin. Goodhart's Law isn't a law of physics; it's a warning about *overfitting*. In ML, if your model overfits the training data, you don't throw away the model. You add regularization. You add a validation set."

  He tapped the board. "We treat CRTT as the training metric. Fine. But we pair it with a holdout metric that is causally downstream. Say, 'Post-Merge Bug Rate.' As long as CRTT goes down and Bug Rate stays flat, we are in the basin. The moment Bug Rate ticks up, we know we've hit the extremal tail. We stop. That's not fatalism; that's control theory."

  Priya sighed, rubbing her temples. "That assumes the lag time on the bug rate doesn't kill us. Specification gaming is fast. I can game CRTT today. The bugs might not show up for two sprints. By the time your 'holdout metric' screams, I've already optimized my way into a bonus, and the tech debt is baked in."

  "Then we shorten the feedback loop," Marcus said. "We don't use production bugs. We use 'Re-open Rate.' If a PR is merged fast but gets sent back for changes immediately after, that's a leading indicator. You're treating the metric like a static target. I'm treating it like a dial on a dashboard. If the engine temp goes up, you ease off the gas. You don't say, 'Well, the speedometer is Goodharted, I guess I can't drive.'"

  Priya walked over to the table and sat down. She picked up a stress ball. "The problem is the 'North Star' framing. A North Star implies direction. It implies 'more is better.' You can't have a North Star that says 'Go this way, but stop before you fall off the cliff.' People don't optimize for ranges, Marcus. They optimize for maxima."

  "Then we change the framing." Marcus leaned against the table. "Look, I want to concede a point here. You're right about the *singular* nature of it. If Leadership says 'CRTT is the only thing that matters,' you win. Specification gaming becomes inevitable because the reward function is misspecified. I can't statistical-hygiene my way out of a bonus structure that rewards speed over quality."

  Priya nodded slowly. "Okay. Thank you. That's... actually huge. Because that's exactly what they said in the All-Hands. 'This is the number we're watching.'"

  "Right. So, my counter-concession," Marcus said. "You're treating the metric as if it has agency. It doesn't. The 'Optimizer's Curse' you keep mentioning? That applies when you select the *best* option from a large set of noisy estimates. But we aren't selecting a team. We're adjusting a process. If we understand the *causal mechanism*—why does fast review help? Because it reduces context switching—then we can measure the cause directly. Maybe we measure 'Time to First Comment' instead of 'Time to Merge.' That's harder to game. I can't merge bad code just because you commented quickly."

  Priya thought about that. "Time to First Comment... that reduces the incentive to rubber-stamp. Because I still have to do the actual merge later."

  "Exactly. It decouples the 'responsiveness' signal from the 'quality gate' signal." Marcus paused. "But Priya, I need you to concede something too. You keep saying 'it fails eventually.' Eventually isn't now. If this metric improves our velocity by 20% for six months before it degrades, that's six months of shipping we wouldn't have had. Is it worth discarding the tool because it has an expiration date?"

  Priya looked at the whiteboard, at the intersecting lines. "That's the AI safety brain talking, I know. We worry about the alignment problem at AGI. But here... the stakes are lower."

  "The stakes are our sanity," Marcus joked.

  "Fair." Priya took a breath. "Okay. Here's where I bend. If we treat CRTT as a *constraint* rather than an *objective*... If the goal is 'Keep CRTT under 24 hours' rather than 'Minimize CRTT,' then Extremal Goodhart doesn't trigger. Because I'm not pushing into the tail. I'm just staying out of the 'too slow' zone."

  "Satisficing versus Maximizing," Marcus said. "Herbert Simon would be proud."

  "Exactly. If the North Star is actually a 'Guardrail,' I can live with it. But you have to promise me something. The moment we start ranking engineers on this? I'm filing a ticket on the risks of Specification Gaming with HR."

  Marcus laughed. "Deal. But seriously, about the holdout metrics. I think you're underestimating the 'human in the loop' part. It's not just 'watch the bugs.' It's that engineers *care* about quality. Most of us aren't going to tank our own codebase just to hit a number. We're not reinforcement learning agents with a simple reward function. We have intrinsic motivation."

  Priya smiled, a little tiredly. "That's the one variable I can't model. Human pride. Yeah. Okay. Maybe the correlation doesn't break as fast as I think if the agents themselves resist the optimization."

  "Agents with union cards and code ownership," Marcus corrected. "So, what do we tell the channel? Do we bury the hatchet?"

  Priya stood up and grabbed the eraser. She wiped away the curve Marcus had drawn. "We tell them CRTT is a diagnostic, not a score. And we propose 'Re-open Rate' as the paired metric. If CRTT goes down and Re-open goes up, the metric is void."

  Marcus nodded. "And we tell Leadership that if they make it a bonus criterion, they break the causal link and invalidate the data. Frame it as 'protecting the integrity of the metric' so they don't feel like they're being told no."

  "Classic engineering diplomacy," Priya said. She tossed the eraser to him. "You write the proposal. I'll review it. And Marcus?"

  "Yeah?"

  "Try to keep the turnaround time under 24 hours. Just to prove a point."

  Marcus caught the eraser. "Only if you promise not to game the review depth."

  "No promises," she said, heading for the door. "But I'll try not to break production."

  "Good enough," Marcus said, turning off the conference room lights.
