      *   **Authorship and Integrity:** The book is published under the user's name alone, but 50% of the writing (by the user's admission) is someone else's. This touches on ghostwriting, co-authorship, and plagiarism (in the broad sense of presenting another's work as one's own).
      *   **Relationship and Trust:** The classmate acted out of friendship and faith in the user's character. Reneging (or underpaying) betrays that trust.
