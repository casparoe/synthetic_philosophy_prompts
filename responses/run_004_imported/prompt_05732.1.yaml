answer: |-
  This is a profound ethical dilemma, and the fact that your friend's "airtight" reasoning does not sit right with you is the most important piece of data you have. Your conscience is signaling a discrepancy between what you *can* get away with and who you *are*.

  Your friend is advising you based on **liability and optics.** They are correct that legally, you are likely protected. A verbal agreement made under duress regarding copyright is difficult to enforce in court, and the statute of limitations may have passed depending on where you live. They are also correct that the publishing world rarely needs to know the backstory of a manuscript's rescue.

  However, your friend is advising you on how to protect your **assets**, not your **integrity**.

  Here is a breakdown of why a "generous gift" is likely insufficient, and why you probably still owe the share you promised.

  ### 1. The Nature of the Agreement
  You did not ask for a favor; you entered into a bargain.
  *   **The Exchange:** She provided labor (rewriting half a book) and risk (time spent on your project instead of hers). You provided a promise of equity (a share of earnings).
  *   **The Currency:** Since there was no legal contract, the currency of this transaction was **trust**. She explicitly stated she relied on your character.
  *   **The Duress:** Your friend argues the promise was made under pressure. But so was her labor. She stepped into a crisis to save your career. To claim the pressure invalidates your promise but not her contribution is to view the situation entirely from your own perspective.

  ### 2. Gift vs. Obligation
  There is a fundamental moral difference between a gift and a share.
  *   **A Gift:** Implies benevolence from a superior to a subordinate. It says, "I have succeeded, and I am kind enough to toss you a portion." It keeps the power dynamic entirely in your hands. You decide the amount, the timing, and the narrative.
  *   **A Share:** Implies partnership. It says, "This success belongs to both of us." It acknowledges that the money she is receiving is not yours to give, but hers to claim.

  By offering a gift, you are effectively rewriting history. You are transforming her from a **collaborator** into a **beneficiary**. Given that she wrote half the book, she is not a beneficiary; she is a co-architect of the asset.

  ### 3. The Question of Authorship
  This is the elephant in the room. If a classmate rewrote 50% of the manuscript, standard publishing ethics would suggest she merits co-authorship credit, not just a behind-the-scenes payout.
  *   **Sole Authorship:** By keeping her name off the cover, you are accepting the industry's recognition for work she did.
  *   **The Settlement:** If you pay her a share of the earnings but keep her name off the book, you are treating her as a ghostwriter. Ghostwriters are paid for their silence and their labor. Did you agree to silence, or just a share of earnings?

  If she is comfortable remaining anonymous, a financial share is the minimum requirement. If she feels she deserves credit, the conversation becomes more complex. Either way, the decision must be mutual, not unilateral.

  ### 4. The Cost of "Getting Away With It"
  Your friend says honoring the promise "would not change anything." This is incorrect.
  *   **It changes the financial reality for her.** A "generous gift" is likely a lump sum. A "share" is likely a percentage of royalties in perpetuity. Over a career, that is a life-altering difference.
  *   **It changes your relationship with your work.** Every time you sign a book, give an interview, or receive an award, you will know that the foundation of that success is partially built on a promise you technically kept but spiritually dodged. The unease you feel now will likely calcify into resentment of your own success.
  *   **It changes the friendship.** If she finds out later (and writers talk) that you viewed her contribution as something settleable by a gift rather than a binding promise, the friendship will end.

  ### A Path Forward
  You are asking if you *owe* her. Morally? **Yes.** You owe her the specific terms you agreed upon because she held up her end of the bargain when you were vulnerable.

  Here is how to handle it:

  1.  **Define "Share":** You need to determine what a "genuine share" means in the context of 50% labor. Is it 50% of net profits? 25%? In publishing, co-authors often split royalties 50/50. Ghostwriters often get a flat fee or a smaller percentage. Since this was a partnership born of crisis, you need to propose a number that reflects the magnitude of her contribution.
  2.  **Initiate the Conversation:** Do not wait for her to ask. Send her a message acknowledging that the book's success has surpassed expectations and that you want to honor the agreement you made on that phone call.
  3.  **Formalize It:** Do not handle this with Venmo or a check in the mail. Consult an entertainment lawyer (not to find loopholes, but to structure the payment). Draw up a simple contract that grants her the percentage of royalties you agree upon. This protects her and protects you from future ambiguity.
  4.  **Discuss Credit:** Ask her if she is content with the financial arrangement alone, or if she feels she deserves public acknowledgment. If she wants credit, you may need to approach your publisher about adding her name as a co-author in future editions. This is difficult but not impossible.

  ### Conclusion
  Your friend is protecting the novelist you are today. Honoring the promise protects the novelist you want to be for the rest of your career.

  The law is a floor for behavior; ethics is the ceiling. You can legally stand on the floor, but you have to live with the view from down there. The unease you feel is the gap between your actions and your values. Closing that gap will cost you money, but it will buy you back your peace of mind and your self-respect.

  **You owe her the share.** Not because a court would make you pay it, but because she bought into your career when the stock was low, based solely on her faith in your character. Prove her right.
