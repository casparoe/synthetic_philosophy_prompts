  Here is a structured argument designed to be the strongest version of your position. It moves from decision-theoretic consistency to the specific rebuttal of your friend's "existence" claim, ending with the empirical implications.

  ***

  # The Argument Against Quantum Immortality: Why Amplitude Is the Only Currency That Matters

  ### 1. The Core Thesis
  The Quantum Suicide (QS) argument relies on a category error between **ontology** (what exists) and **normativity** (what to anticipate/care about). Your friend is correct that under Many-Worlds (MWI), a branch exists where you survive. However, they are incorrect that *existence alone* dictates rational credence.

  To accept MWI is to accept that the **Born Rule** (squared amplitude) governs rational expectation. If you reject amplitude-weighting for anticipation (as QS requires), you are logically forced to reject the Born Rule for betting. If you reject the Born Rule, MWI is empirically falsified. Therefore, you cannot consistently be an Everettian *and* believe QS makes Russian Roulette safe.

  ### 2. The Decision-Theoretic Trap (Betting = Dying)
  The strongest objection to QS comes from Everettian Decision Theory (EDT), championed by David Wallace and Hilary Greaves. Their project is to derive the Born Rule from the structure of MWI without adding it as an extra postulate.

  *   **The Setup:** Imagine a quantum bet. A spin is measured; if Up, you win \$100; if Down, you lose \$100. The amplitude for Up is $\epsilon$ (tiny); the amplitude for Down is $\approx 1$.
  *   **The Friend's Logic:** If your friend's QS logic holds, they should treat this bet as "50/50" (or at least non-negligible) because there *is* a branch where they win. They should take the bet, because "a future them gets the money."
  *   **The Contradiction:** No physicist (including Everettians) takes that bet. We all agree that rational credence tracks amplitude ($\epsilon^2$). We anticipate loss.
  *   **The Equivalence:** Structurally, Quantum Suicide is identical to the quantum bet.
      *   **Bet:** Branch A (Win, low amp) vs. Branch B (Lose, high amp).
      *   **Suicide:** Branch A (Live, low amp) vs. Branch B (Die, high amp).
  *   **The Blow:** If your friend admits they shouldn't take the low-amplitude bet because "the weight is too low," they must admit they shouldn't play Quantum Suicide. You cannot say amplitude matters for money but not for life. If amplitude determines how much you *care* about your future successors in a bet, it determines how much you *care* about them in death. To ignore amplitude in the Suicide case is to violate **diachronic consistency** (acting now in a way your future self would regret).

  ### 3. Rebutting the "Existence" Comeback
  This is the crux of your disagreement. Your friend argues:
  > *"Credence isn't weighted by amplitude because after the split there straightforwardly is a future you who survived, period, regardless of measure."*

  Here is how you dismantle that specific claim.

  #### A. Existence is Binary; "You" are Not
  Your friend is treating personal identity as a **singular persistent thread** that magically rides the surviving branch. This is a single-world intuition smuggled into a many-worlds ontology.
  In MWI, pre-split "You" does not *go* anywhere. Pre-split "You" evolves into a superposition of successors.
  *   **The Question:** It is not "Will I exist?" (Answer: Yes, in some branches).
  *   **The Real Question:** "Which successor should I anticipate being, and by how much?"

  If I fission into two successors, A and B, and I ask "Will I be A?", the MWI answer is "You will be A, and you will be B." But since I cannot anticipate two mutually exclusive experiences with equal intensity, I need a **caring measure**.
  *   **The Friend's Error:** They assume the caring measure is **Branch Counting** (1 branch = 1 unit of care).
  *   **The Correction:** The caring measure is **Amplitude Squared**.
  *   **Why?** Because amplitude is not just a label; it is a physical quantity that dictates interference and normalization. If you claim amplitude doesn't matter for *anticipation*, you must explain what physical property *does*. If the answer is "nothing, just existence," you are asserting that a branch with amplitude $10^{-100}$ is just as significant for anticipation as a branch with amplitude $0.99$.

  #### B. The "Lottery Winner" Analogy
  Ask your friend: *"In the multiverse, there is a branch where I win the lottery jackpot. That winner exists, period. Should I quit my job today in anticipation of that branch?"*
  *   **Friend's likely answer:** "No, because the probability is low."
  *   **Your follow-up:** "But under MWI, the winner *exists*. Why does their existence not guarantee your anticipation?"
  *   **The Point:** The friend will instinctively reach for "probability." In MWI, **amplitude is probability**. To say "The survivor exists, so I'll survive" is exactly isomorphic to "The lottery winner exists, so I'll win." It ignores the *measure* of that existence.
  *   **The Knockout:** In QS, the "Death" branch has high amplitude. In the Lottery, the "Lose" branch has high amplitude. If the friend accepts they will likely lose the lottery despite a winning branch existing, they must accept they will likely die in QS despite a surviving branch existing.

  ### 4. The Empirical Suicide of Branch-Counting
  If your friend doubles down and says, *"No, I really do think I should anticipate all existing branches equally (Branch Counting),"* you have them on empirical grounds.

  *   **The Prediction:** If rational credence follows Branch Counting (1 branch = 1 probability) rather than Amplitude (Born Rule), then MWI makes false predictions about experimental statistics.
  *   **The Experiment:** Run a quantum experiment with unequal amplitudes (e.g., a photon through a beam splitter tilted so 99% reflects, 1% transmits).
  *   **The Outcome:** We observe the 99/1 split.
  *   **The Implication:** If "existence" dictated credence, and MWI creates branches for all outcomes, we should expect to see statistics that reflect branch *counts*, not amplitudes. (Note: In decoherence-based MWI, branch counting is ill-defined, but even if we discretize, the statistics must match the Born Rule).
  *   **The Trap:** If your friend says "Amplitude doesn't guide anticipation," they are advocating for a version of MWI that contradicts the data. To save MWI, you *must* adopt the Born Rule for credence. If you adopt the Born Rule for credence, **Quantum Suicide becomes lethal.**

  ### 5. Summary: The "Trivial vs. False" Dichotomy
  Conclude by forcing your friend to choose between two horns of a dilemma regarding the statement: *"You will subjectively survive."*

  1.  **It is Trivially True:** "In the set of all future branches, there is a subset containing conscious observers who remember pulling the trigger."
      *   **Implication:** This gives you no comfort. It is like saying "Someone will win the lottery." It doesn't mean *you* should expect to be that someone. The *measure* of you that dies is near 1. The *measure* of you that survives is near 0. You should anticipate death.
  2.  **It is False (as a guide to action):** "You should act as if you will survive."
      *   **Implication:** This requires ignoring amplitude. If you ignore amplitude, you violate the Born Rule. If you violate the Born Rule, you are not doing quantum mechanics.

  **The Final Line:**
  "Your argument works only if you treat 'existence' as a binary switch for probability. But in Everettian QM, existence is the wavefunction, and probability is the amplitude. To say 'I survive because a survivor exists' is to say 'I win the lottery because a winner exists.' It confuses the *map* (the wavefunction) with the *territory* (your rational expectations). If you respect the Born Rule enough to call yourself an Everettian, you must respect it enough to stay away from the gun."
