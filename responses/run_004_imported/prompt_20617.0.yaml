      *   *The Skeptical Threat:* If bootstrapping is invalid, then *perception* might be invalid. We all "bootstrap" our senses. I see a hand, I assume my eyes work. If that's forbidden, I know nothing about the external world. Philosophers hate skepticism.
      *   *Reliabilism:* Some say if the gauge *is* reliable, she *does* know, even if her reasoning sucks. (Process reliabilism). This clashes with the intuition that reasoning matters.
      *   *Closure:* The principle that knowledge transfers across deduction. Bootstrapping breaks this or makes knowledge too easy.
