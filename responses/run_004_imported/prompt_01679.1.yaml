      *   *Key Assumptions:*
          1.  Bayesian Rationality (agents update via Bayes' rule).
          2.  Common Prior (they started with the same probability distribution over the state space).
          3.  Common Knowledge of Posteriors (I know your probability, you know mine, I know that you know mine, ad infinitum).
          4.  Honest Communication (no lying about beliefs).
          5.  Defined State Space (agents are partitioning the same set of possible worlds).

  3.  **Brainstorming Limitations (The "Why it fails in practice" list):**
