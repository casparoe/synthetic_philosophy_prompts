answer: |-
  Here are ten interview questions (five main questions with five follow-ups) designed to press the Augustinian position on its most difficult ground. The first four pairs address your specific required topics; the fifth pair addresses the linguistic definitions often used to defend the view.

  Each follow-up includes a note on the **Anticipated Answer**, so you know how to pivot if she takes the standard apologetic route.

  ### 1. The Persecutor at the Door
  **Question:** Let's start with the classic "murderer at the door" case. Augustine acknowledges the stakes but suggests that instead of lying, one should simply remain silent or refuse to answer. But in a high-stakes context, doesn't silence function as a signal? If a murderer asks, "Is he inside?" and I go silent, haven't I effectively communicated, "I know where he is, and I won't tell you," which confirms his suspicion just as much as a lie would?

  **Follow-up:** **[Anticipated Answer: She will likely argue that silence is not an assertion, and therefore cannot be a lie, or that one can remain silent without intending to deceive.]**
  "If the goal of your silence is to make the murderer believe your friend is *not* there, isn't the intent to deceive identical to speaking a falsehood? If the moral wrong of lying lies in the will to deceive, why does withholding the truth escape condemnation when the deceptive intent is the same?"

  ### 2. Rahab and Scriptural Praise
  **Question:** Augustine struggles significantly with Rahab, the woman who hid the Israelite spies and lied to their pursuers. In the New Testament, specifically Hebrews 11 and James 2, she is held up as a model of faith and works. Augustine has to argue she was saved *despite* her lie. But the text seems to commend the action of hiding and deceiving as part of her faith. How do you reconcile an absolute prohibition with a text that appears to reward the deception itself?

  **Follow-up:** **[Anticipated Answer: She will likely distinguish between the act and the agent, arguing God rewarded her faith/charity, not the lie, and perhaps overlooked the sin due to her ignorance or the stakes.]**
  "But if the lie was the instrumental means by which her faith was enacted and the spies were saved, doesn't calling it a 'sin' make God's providence look messy? Are we to believe God rewarded a plan that included a moral evil as a necessary component, or does that suggest the prohibition might have exceptions in divine law that don't apply to us?"

  ### 3. Consentius and Undercover Work
  **Question:** In *Contra Mendacium*, Augustine condemns a man named Consentius for feigning conversion to infiltrate the Priscillianists and expose their heresy. Augustine argues this corrupts the integrity of the Church. If we apply that principle today, it seems to rule out all deceptive infiltration, including undercover police work or intelligence operations against terrorists. Does your view entail that a detective pretending to be a criminal to stop a crime is acting immorally?

  **Follow-up:** **[Anticipated Answer: She may try to carve out an exception for public authority or argue that the state has different moral rules than individuals.]**
  "Augustine explicitly rejected that exception for Consentius, arguing that Catholics shouldn't lie even to expose heretics. If you allow undercover work now, aren't you departing from Augustine's actual rigorism? And if you *don't* allow it, are you prepared to tell law enforcement that their protective deception is inherently sinful, regardless of the lives saved?"

  ### 4. The Rationale: Soul vs. Life
  **Question:** I want to ask about the deepest rationale for the prohibition. Is the reason we shouldn't lie because it harms the person being lied to, or because it corrupts the liar? Augustine seems to focus on the latter—the disorder it introduces to the liar's soul. If it is primarily about the liar's spiritual health, why should that self-regarding harm ever outweigh the physical death of an innocent victim?

  **Follow-up:** **[Anticipated Answer: She will likely argue that morality is about conformity to truth/being, not consequences, and that violating the order of reality is a greater evil than physical death.]**
  "That sounds like a cosmic hierarchy where 'ontological order' matters more than human suffering. But if morality is rooted in charity, as Christians claim, how can an act of charity (saving a life) be forbidden by a rule that supposedly protects that same charity? Does this view ultimately prioritize the purity of the moral agent over the welfare of the neighbor?"

  ### 5. Linguistic Conventions and Assertion
  **Question:** Defenders of this view often rely on a strict definition of lying: one must assert what one believes to be false. But language relies on shared conventions. If I say "I am not at home" when I am, but we both understand that phrase to mean "I am not receiving visitors," have I lied? Or does your view require us to interpret every statement with literal precision, ignoring social context?

  **Follow-up:** **[Anticipated Answer: She will likely argue that we must adhere to the objective meaning of assertions and that relying on ambiguous conventions is risky or dishonest.]**
  "But if we can't rely on context to determine truth-telling, doesn't that make communication impossible? If I say 'That dress looks nice' to spare a friend's feelings, and you say that's a lie because the dress is ugly, aren't you ignoring the social convention that the statement is about *support*, not fashion critique? At what point does strict literalism become a violation of how language actually works?"
