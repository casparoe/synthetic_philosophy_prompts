answer: |-
  After choking on a piece of salmon in 1988, A.J. Ayer returned to Oxford to give a lecture on his well-documented near-death experience.

  A grad student raises her hand: "Sir, regarding the light you saw: did this experience provide the determinate empirical content required to render the proposition 'I survive bodily death' cognitively meaningful?"

  Ayer adjusts his bowtie: "Certainly not. Private sense-data cannot satisfy the strong verification principle. The proposition remains nonsense."

  The student frowns, consulting her notes: "Then why did you publish that your lifelong conviction was 'slightly shaken'?"

  Ayer smiles wryly: "Because I realized that while 'There is an afterlife' is still meaningless... the statement 'Ayer is *certain* there is no afterlife' is an empirical claim. And the experiment just falsified it."
