answer: |-
  **MEMORANDUM**

  **TO:** Allocation Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Q1 Allocation Rule: Tempered Fractional Kelly

  **Recommendation**
  For the upcoming fiscal year, I recommend we replace our winner-take-all Expected Value (EV) rule with a **50% Fractional Kelly rule** applied to the top three ranked interventions. 

  Under this rule, we calculate the Kelly-optimal fraction for each of the top three opportunities based on our research team's probability estimates, halve those fractions to account for model uncertainty, and allocate the quarterly pool accordingly. Any remaining unallocated capital rolls into a reserve buffer rather than cascading down to lower-ranked options.

  **The Core Disagreement**
  Our debate has stalled because we are talking past one another on three specific variables: the compounding nature of our capital, the shape of our utility function, and the ergodicity of our decision process. To move forward, we must be explicit about where the standard arguments fail in our specific context.

  **1. On Compounding (The Trader's Claim)**
  The argument for Kelly maximization typically requires a compounding bankroll. The Samuelson critique correctly notes that our *cash* does not compound; we spend the $80,000 annually. If this were a one-off endowment, strict Kelly would be a category error.

  However, the Trader is intuitively correct that we face a repeated game where ruin is absorbing. Our "bankroll" is not the quarterly cash flow, but the **Circle's Continuity**. If we pursue a high-variance, winner-take-all strategy and back a speculative intervention that fails catastrophically (e.g., reputational damage from a biosecurity false positive), we risk collapsing donor trust. If the Circle dissolves, our future capacity to give drops to zero. Because our ability to give in Q8 depends on our survival in Q1, our *capacity* compounds even if our *cash* does not. We are optimizing the geometric growth of our long-term influence, not the arithmetic sum of this year's grants.

  **2. On Utility (The Samuelson Critique)**
  The Samuelson critique states that Kelly is only optimal for an agent with log utility. This is factually true but strategically empty unless we define our utility. 

  We have implicitly been acting as risk-neutral agents (linear utility over impact). I propose we explicitly adopt **log utility over cumulative impact**. This is not smuggling in financial caution; it is an acknowledgment of diminishing marginal returns on moral good. Saving the first million lives is morally more urgent than the second million when resources are constrained. Furthermore, given the heavy tail risk in our intervention set (high probability of zero impact, low probability of massive impact), linear utility exposes us to "moral ruin"—periods of zero effective output that cannot be made up for later. Log utility penalizes the variance that threatens our trajectory.

  **3. On Ergodicity (The EV Maximizers)**
  The current EV rule assumes that time averages converge to ensemble averages (the Law of Large Numbers). This holds if bets are independent and the bettor survives. In our case, the bets are correlated (all dependent on the Circle's reputation) and the bettor can be eliminated (donor attrition). 

  In non-ergodic systems, maximizing the ensemble average (EV) leads to almost-sure ruin over time. Maximizing the time average (Geometric Growth) preserves the agent. Since we intend to exist in perpetuity, we must optimize for the time average.

  **Why Tempered (50%) Kelly?**
  Full Kelly maximizes growth but maximizes volatility. Given that our probability estimates from the research team are themselves uncertain (model risk), full Kelly exposes us to over-betting. 

  *   **Why not Winner-Take-All?** It ignores the non-ergodic risk of reputational ruin and assumes linear utility where diminishing returns likely apply.
  *   **Why not Equal Splitting?** It ignores the magnitude of the edge. If one option is clearly superior, under-weighting it sacrifices too much impact.
  *   **Why 50% Kelly?** It captures the geometric growth benefits of diversification while providing a safety margin against the overconfidence inherent in our impact estimates. It respects the Trader's insight on compounding capacity, accepts the Samuelson Reader's requirement for defined utility, and corrects the EV Maximizers' ergodicity assumption.

  **Implementation**
  For Q1, the Research Team will provide probability distributions for the top three interventions. The Committee will apply the 50% Kelly formula to determine weights. We will review this rule in one year to assess if the reserve buffer has accumulated appropriately to smooth out volatility.

  This rule acknowledges that we are not just spending money; we are cultivating a vehicle for long-term impact. We must ensure the vehicle survives the journey.
