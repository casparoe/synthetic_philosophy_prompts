answer: |-
  **Setting:** *Late autumn, 1928. A private study in New York City. The air is thick with tobacco smoke. Papers are stacked unevenly across a mahogany desk. Walter Lippmann stands by the window, looking out at the streetlights. John Dewey sits in an armchair, leaning forward, hands clasped.*

  **Lippmann:** You call it an eclipse, John. I call it a reality check. You write of the public as if it were a sleeping giant, merely waiting for the fog to lift so it can rise and govern itself. But the fog isn't an accident. It's the natural condition of a modern society.

  **Dewey:** The fog is not natural, Walter. It is manufactured. It is the result of industrial and technological forces that have outpaced our social arrangements. The public isn't sleeping; it's been displaced.

  **Lippmann:** Displaced? Or simply overwhelmed? Look at the chain of causation in today's world. A tariff passed in Washington alters the price of wool in Yorkshire, which idles a loom in Massachusetts, which empties a schoolhouse in a mill town. How is the citizen in that schoolhouse supposed to trace that line? You demand a citizen who is omnicompetent. You demand a man who can judge the merits of a disarmament treaty in Geneva and a sanitation budget in Chicago with equal wisdom. It is a false ideal. It is a myth inherited from the 18th century that no longer fits the 20th.

  **Dewey:** I never argued for the omnicompetent citizen. That is a caricature you've erected to knock down. I do not ask the farmer to be an expert in currency exchange. I ask that the social arrangements allow him to understand how currency exchange affects his life. The problem is not the incapacity of the individual mind. It is the incapacity of our methods of communication.

  **Lippmann:** But communication requires something to communicate! If the facts are invisible, no amount of town-hall singing will make them appear. The world outside is too big, too complex, and too fleeting. We do not deal with the real environment; we deal with a pseudo-environment. Pictures in our heads. And those pictures are necessarily simplified. If you base democracy on the assumption that the public can know the truth of these matters, you are building on sand. The public must remain a phantom. It can only intervene when things go visibly wrong. It can align itself for or against a proposal, but it cannot formulate the proposal.

  **Dewey:** And there is the root of our divergence. You see the public as a bystander who occasionally shouts. I see the public as the very entity that comes into existence when indirect consequences are perceived and regulated. A public exists when people realize that their private transactions have consequences upon others. But you are right about one thing: those consequences are currently obscure.

  **Lippmann:** Obscure? They are unknowable to the layman. That is why we need insiders. Experts. Men who can survey the field, analyze the data, and propose the remedy. The public's role is merely to say "yes" or "no" to the men who are actually doing the work. To expect more is to invite demagoguery, because the public will inevitably rely on symbols and stereotypes rather than facts.

  **Dewey:** You place your faith in the expert. I place my faith in the inquiry. But do not think I ignore the necessity of specialized knowledge. Science is essential. Social science is essential. But here is the danger, Walter: If the expert identifies the consequences, and the expert proposes the remedy, and the public merely ratifies the choice... in what sense is the public governing? You have not solved the problem of democracy; you have abolished it in favor of a benevolent technocracy.

  **Lippmann:** I have saved democracy from collapsing under its own weight! If you ask the public to do what it cannot do, you invite tyranny. Because someone *will* decide. If it is not the responsible expert, it will be the irresponsible manipulator. I would prefer the insider who knows the machinery to the mob who only knows the noise.

  **Dewey:** But who tells the public what the consequences are? You say the public cannot trace the indirect effects of a tariff. So who traces them?

  **Lippmann:** The economist. The journalist. The administrator.

  **Dewey:** Precisely. So the existence of the public—the very formation of the public depends on someone identifying those indirect consequences. If that identification is done exclusively by a class of experts, then the public is not discovering itself. It is being defined *for* itself. You have smuggled your experts back in through the side door of my own definition. If the public only exists when consequences are traced, and only experts can trace them, then the experts are the public.

  **Lippmann:** *(Turns from the window, smiling thinly)* You catch me. But is that not the reality? The complexity of civilization demands specialization. Why do you resist it?

  **Dewey:** Because specialization without communication is not civilization; it is fragmentation. If the expert traces the consequence but keeps the inquiry within his own caste, the public remains eclipsed. My argument is not that every man must be a scientist. It is that the results of social inquiry must be absorbed into the community until they become common sense. The expert must not be the ruler. He must be the servant of the public interest. But the public interest cannot be handed to them on a platter. They must participate in the weighing of it.

  **Lippmann:** Participate how? By reading a summary? By voting? You speak of the "Great Community." But community implies face-to-face contact. It implies shared experience. You cannot have face-to-face contact with a nation of a hundred million people. The Great Community is a mystical notion. It has no physical basis.

  **Dewey:** It is not mystical; it is a project. The local community is the seat of the public. It is where the abstract consequences become concrete. The tariff matters because the neighbor lost his job. The war matters because the boy down the street did not come home. The Great Community is not a massive town hall. It is a network of local associations where free and full communication takes place. If the social sciences could devote themselves not to administering the public, but to equipping the public with the tools of inquiry...

  **Lippmann:** You want to turn every citizen into a social scientist.

  **Dewey:** No. I want to turn social science into a public utility. You say the pseudo-environment is all we have. I say we must improve the fidelity of that environment. But that requires more than better journalism. It requires a change in the conditions of association. As long as industry is private and its consequences are public, the public will remain in shadow. You treat the symptoms; I am diagnosing the disease.

  **Lippmann:** The disease is human limitation. We are bounded by our time, our attention, and our capacity. You treat the symptoms of complexity by wishing them away. You say the fix is communication. But communication transmits meaning. If the subject matter is inherently technical, the meaning is lost in translation. If I tell the public the central bank must raise rates to prevent inflation, they hear "money is getting harder to get." They do not hear the mechanism. They hear the pain. And they will vote against the pain.

  **Dewey:** And they should! If the remedy causes pain, the public must judge whether the pain is worth the end. That is a value judgment, Walter. Experts can tell us *how* to stabilize currency. They cannot tell us *whether* stability is worth the unemployment required to achieve it. That is a moral question. And in a democracy, moral questions belong to the public.

  **Lippmann:** Facts and values are not so easily severed. The expert knows that if you do not stabilize the currency, the collapse will cause ten times the unemployment. The public sees the immediate pain; the expert sees the systemic catastrophe. If the public vetoes the expert based on immediate feeling, they destroy the system that keeps them alive.

  **Dewey:** Then the expert has failed to communicate the systemic catastrophe! You assume the public is incapable of learning the connection. I say the public is incapable of learning it *under current conditions*. Break the barriers. Make the inquiry social. Let the conflict of values happen in the open, not in the back rooms of committees. You fear the public because you see it as a collection of isolated atoms, buffeted by propaganda. I see it as a potential organism, capable of growth if the nerves of communication are restored.

  **Lippmann:** *(Sits down, tapping ash into a tray)* You are an optimist, John. Even in the face of the Great War, even in the face of the propaganda bureaus that turned men into meat, you believe in the method of intelligence. I believe the public is necessarily a phantom. It appears only in moments of crisis, when the insiders fail. It is a watchdog, not a governor.

  **Dewey:** And I tell you, a watchdog that cannot understand what it is guarding is easily led away by the thief. If the public does not understand the consequences, it cannot even know when the insiders have failed until it is too late. The "eclipse" is permanent if we accept your view.

  **Lippmann:** Better a permanent eclipse than a false dawn that leads to tyranny. If you promise people power they cannot wield, you invite the man who claims he can wield it for them.

  **Dewey:** And if you tell people they are incapable, you ensure they remain so. Democracy is not a state of being, Walter. It is a work in progress. The Public is not found; it is made. And it is made through the very struggle you wish to spare them. If we remove the burden of inquiry from the public, we remove their humanity. We reduce them to subjects.

  **Lippmann:** I would rather be a subject of a competent administration than a citizen of a chaotic mob.

  **Dewey:** And I would rather risk the chaos of freedom than accept the order of the cage. But know this: if your experts define the public's interests, they will eventually define them in ways that serve the experts. The only safeguard against the corruption of power is the diffusion of knowledge. Not perfect knowledge. Not omnicompetence. But enough knowledge to know when to say "stop."

  **Lippmann:** *(Stands up, picking up his coat)* Then we are at an impasse. You believe the public can be educated to grasp the indirect. I believe the indirect must be managed so the public doesn't have to.

  **Dewey:** *(Rising)* Not an impasse. A tension. And perhaps that tension is where the work lies. You will watch the insiders. I will build the community.

  **Lippmann:** And we shall see which one survives the next crisis.

  **Dewey:** We shall see. But remember, Walter: A phantom cannot haunt a house that no longer exists. If the community dies, your experts will have no one left to rule.

  **Lippmann:** *(Pauses at the door)* Then let us hope the house holds, John. For all our sakes.

  *(Lippmann exits. Dewey remains standing, looking at the scattered papers on the desk, then walks to the window to watch him go.)*
