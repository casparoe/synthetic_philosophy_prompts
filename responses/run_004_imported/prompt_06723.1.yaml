prompt: |-
  I'm a junior in high school, and something that happened over winter break has been bothering me ever since, so I wanted to get an outside opinion on it. A friend of mine lost close to four hundred dollars to an online scam that promised her a spot in a selective summer research program if she paid an upfront "application processing fee." About a week before that happened, someone had posted a warning about that exact scam in a group chat that includes her, me, and roughly fifteen other people from our grade. I saw the post and even reacted to it, but I never thought to send it to her directly, and I'd honestly forgotten about it completely until she told everyone what had happened to her. She has since told me, more than once, that if I had just forwarded her that one message, she never would have paid the fee, and that she holds me at least partly responsible for losing the money, since the two of us talk almost every day and she assumes that I would have mentioned anything to her that seemed important.

  Obviously, the person who actually caused her to lose the money was the scammer, not me, but she doesn't see it as an either-or situation, and honestly I'm not sure she's wrong to feel that way. At the same time, something about her reasoning bothers me. Those same fifteen or so people, including some of her other close friends, saw the exact same warning and also never sent it to her, and none of them are being blamed the way I am. If failing to send her that message is really part of what caused her to get scammed, it seems like that should apply equally to everyone in the chat who stayed silent, and if it doesn't count as causing anything at all, then I don't understand why I still feel as guilty as I do. I brought it up with my older brother, hoping he'd tell me I was overthinking it, but he just said "it's complicated" and changed the subject. Is my friend right to hold me responsible in a way she doesn't hold anyone else in that chat, or is there something off about how she — and maybe I — are thinking about it?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Junior in high school (approx. 16-17 years old).
      *   **Problem:** A friend lost $400 to a scam. The user saw a warning about the scam in a group chat a week prior but didn't forward it to the friend. The friend blames the user specifically, claiming that because they talk every day, the user *should* have told her. Other friends who saw the warning aren't being blamed.
      *   **User's Feelings:** Guilty, confused, conflicted. Acknowledges the scammer is the real culprit but wonders if there's shared responsibility. Feels singled out compared to others in the chat.
      *   **Friend's Stance:** Holds the user partly responsible due to the closeness of their relationship ("we talk almost every day").
      *   **Brother's Input:** "It's complicated" (unhelpful).
      *   **Goal:** Wants an outside opinion on whether the friend is right to hold them responsible and why they feel so guilty.

  2.  **Deconstruct the Ethical and Relational Dynamics:**
      *   **Causality:** Did the user *cause* the loss? No. The scammer did. The friend made the payment.
      *   **Duty of Care:** Is there a moral obligation to warn friends? Generally, yes. But is it absolute? No. People miss things, forget things, or assume others are being careful.
      *   **Special Relationship:** The friend argues the daily communication creates a higher expectation. This is a valid *feeling* on her part, but is it a fair *demand*?
      *   **Singling Out:** Why this user and not the other 15? Likely because this is her *best* friend. This implies higher expectations, which cuts both ways (more trust, but also more disappointment).
      *   **Guilt:** Why does the user feel guilty? Empathy, hindsight bias ("I should have known"), and the friend's pressure.

  3.  **Evaluate the Friend's Argument:**
      *   *Valid point:* Close friends look out for each other. If you know something dangerous, sharing it is a good friend move.
      *   *Invalid point:* Blaming the victim's friend for the victim's financial loss is unfair. It shifts accountability away from the person who actually clicked "send" on the payment.
      *   *The "Scapegoat" dynamic:* She is likely embarrassed about being scammed. Blaming the user might be a way to process her own frustration without admitting she fell for something obvious. It's easier to be mad at a friend than to feel foolish.

  4.  **Evaluate the User's Feelings:**
      *   The guilt is natural (hindsight is 20/20), but it shouldn't be burdensome.
      *   The confusion about the other 15 people is logical. The distinction is purely emotional (closeness), not logical (access to information).

  5.  **Formulate the Advice:**
      *   **Validate:** Acknowledge that this is a tough spot. It's normal to feel guilty, but the guilt shouldn't be this heavy.
      *   **Address Responsibility:** Clearly state that the *scammer* is responsible, and the *friend* is responsible for her own money. The user is not financially or morally liable for the loss.
      *   **Analyze the Friendship Dynamic:** Explain *why* she is blaming the user (closeness = higher expectations) but also why that's unfair (you aren't her keeper). Address the "other 15 people" point—she isn't mad at them because she doesn't expect as much from them.
      *   **Address the Friend's Reaction:** Gently suggest the friend might be projecting embarrassment. Losing $400 sucks, and it's humbling. Blaming someone else helps save face.
      *   **Actionable Steps:**
          *   Apologize for the oversight (validate her feelings) without accepting blame for the money.
          *   Set boundaries (I care about you, but I can't monitor everything).
          *   Move forward (focus on support, not the past).
      *   **Brother's Comment:** Decode "It's complicated." It probably means "Relationships are messy, logic doesn't always apply."

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, mature, non-judgmental.
      *   *Structure:*
          1.  Validate the feelings.
          2.  Break down the responsibility (Scammer vs. Friend vs. User).
          3.  Explain the "Why Me?" (Closeness/Expectations).
          4.  Discuss the Friend's Psychology (Embarrassment).
          5.  How to handle it going forward.
      *   *Key Distinction:* Moral *regret* (I wish I had done that) vs. Moral *responsibility* (It's my fault this happened).
      *   *Refining the "Other 15" point:* This is crucial. It proves the blame isn't about the *act* of not sharing, but about the *relationship* expectations.

  7.  **Final Review against Safety Guidelines:**
      *   No medical/legal advice needed.
      *   No harmful content.
      *   Supportive tone for a minor (high schooler).
      *   *Self-Correction:* Make sure not to tell the user to dump the friend, but to evaluate the dynamic. $400 is a lot for a high schooler, so the friend's anger is understandable, even if misdirected.

  8.  **Final Polish:** (Produces the structured response below.)
answer: |-
  This is a really mature question to ask, and it shows a lot of empathy that you are wrestling with this so deeply. It is completely understandable why you feel stuck between logic (you didn't steal her money) and emotion (you could have helped prevent it).

  Here is an outside perspective on the situation, broken down into the logic of responsibility, the psychology of your friend, and how you might handle this moving forward.

  ### 1. The Logic of Responsibility
  You are correct that there is a major difference between **moral regret** and **moral responsibility**.

  *   **Moral Regret:** This is looking back and thinking, *"I wish I had done that differently."* It is healthy to feel a little bit of this. It shows you care about your friend. You saw information that could have helped her, and you didn't pass it along. That is an oversight, and it's okay to wish you had acted differently.
  *   **Moral Responsibility:** This is asking, *"Did my action directly cause this harm?"* The answer here is no. You did not create the scam. You did not force her to pay. You did not hide the information from her intentionally.

  Your friend is conflating the two. She is treating your *oversight* as if it were a *betrayal*. While it hurts to miss an opportunity to help a friend, missing that opportunity does not make you liable for the $400. The responsibility for spending money lies ultimately with the person holding the wallet.

  ### 2. Why You and Not the Other 15?
  You asked a very logical question: *"If failing to send her that message is really part of what caused her to get scammed, it seems like that should apply equally to everyone in the chat."*

  Logically, you are right. Relationally, however, her reaction makes sense to *her*, even if it isn't fair to you.

  *   **Expectations Scale with Closeness:** She isn't mad at the other 15 people because she doesn't expect them to monitor her safety. She expects that from *you*. You talk every day. You are likely her primary support system. In her mind, you are a team. When a teammate misses a play, it feels more personal than when a spectator misses it.
  *   **The "Mind-Reading" Trap:** She said she assumes you "would have mentioned anything to her that seemed important." This is a common trap in close friendships. She expects you to know what is in her head (that she is looking at this program) and what is important (that this fee is suspicious) without her telling you. You cannot be responsible for expectations she never communicated.

  ### 3. What Is Really Happening With Your Friend?
  This is the hardest part to hear, but it might help you feel less guilty. When people lose money to a scam, especially a "smart" person in a selective program, they often feel intense **shame and embarrassment**.

  *   **Displaced Anger:** It is incredibly painful to admit, *"I was naive,"* or *"I didn't do my research."* It is much easier to say, *"My friend let me down."* By focusing on your failure to forward the message, she can avoid focusing on her failure to verify the program.
  *   **Control:** If it's your fault, then the world makes sense (you made a mistake). If it's just bad luck and a clever criminal, that feels chaotic and scary. Blaming you gives her a sense of control over the narrative.

  This doesn't mean she is a bad person; she is hurt and embarrassed. But it does mean her blame is likely more about her own feelings than your actual actions.

  ### 4. Decoding Your Brother's Advice
  When your brother said, "It's complicated," he likely meant that relationships rarely follow strict logical rules. In a court of law, you are not responsible. In the court of friendship, there are unwritten rules about looking out for one another. He probably didn't want to tell you "you're right, she's wrong" because he knows you care about her, but he also knew you aren't actually at fault. It *is* complicated because you have to balance being a good friend with protecting your own boundaries.

  ### 5. How to Move Forward
  You don't have to accept the blame to be a good friend. Here is a way to handle it:

  **Acknowledge her feelings without accepting the debt.**
  You can say something like:
  *"I've been thinking a lot about what you said. I feel terrible that I saw that warning and didn't think to send it to you immediately. I hate that you lost that money, and I wish I could go back and change that. But it hurts me when you say I'm responsible for the loss. I would never want you to get scammed, but I can't be the only person checking for dangers for you. I care about you, and I want to support you, but I need us to move past blaming me for what the scammer did."*

  **Watch her reaction.**
  *   **If she listens:** She may just need to vent her frustration one last time before letting it go. This friendship can recover.
  *   **If she doubles down:** If she continues to demand you pay her back or treats you like you betrayed her trust repeatedly, that is a red flag. A friend who refuses to take accountability for their own mistakes and instead punishes you for theirs is not exhibiting healthy behavior.

  ### Summary
  You are not responsible for the $400. You made a human error (forgetting to forward a message), not a malicious one. Your friend is holding you to a higher standard because you are close, but she is also likely using that blame to cope with her own embarrassment.

  It is okay to feel bad that you couldn't help her. That shows you are a caring friend. But do not let her convince you that you *owe* her. You can offer empathy and support without accepting guilt that isn't yours to carry.
