      *   *Accuracy Check:* Aumann's theorem specifically says "Agree to Disagree" is impossible *if* priors are common and posteriors are common knowledge. So if they disagree, either priors aren't common, posteriors aren't common knowledge, or they aren't Bayesian.
      *   *User's specific phrasing:* "someone in the room has to be updating incorrectly." This is too narrow. It could be the priors. I need to broaden their definition of "irrational" to include prior selection.
      *   *Key Insight:* The strongest argument for "Irrationality" rests on defending the **Common Prior Assumption** as a norm of rationality. If you reject CPA, you allow reasonable disagreement. So the paper *must* defend CPA.

  8.  **Final Plan:**
