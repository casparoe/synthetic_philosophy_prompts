      *   **Reasoning:**
          1.  Neutralizes the outlier/saboteur.
          2.  Keeps the nuance of ranking (unlike IRV which focuses on #1s).
          3.  Simple to administer.
      *   **The Caveat:** Admit this doesn't stop *all* gaming, just the blunt kind.
      *   **Call to Action:** Discuss Tuesday.

  5.  **Refining Tone:**
