answer: |-
  **MEMORANDUM**

  **TO:** The Judging Panel
  **FROM:** [Your Name], Chair
  **DATE:** October 24
  **SUBJECT:** Voting Procedure for Upcoming Prize Cycle

  Following last year's ceremony, there were valid concerns regarding the integrity of our tally. Specifically, the suspicion that a single judge's tactical ranking may have distorted the outcome is something we cannot ignore. However, the proposal to switch to Instant Runoff Voting (IRV) rests on the assumption that it is immune to manipulation. I want to be clear before we meet Tuesday: **no voting system is immune to gaming.**

  IRV prevents "burying" a strong competitor, but it introduces new vulnerabilities. It favors polarizing books with passionate supporters over consensus picks that everyone respects. It can also eliminate a broadly liked book early if it lacks enough first-place votes. If we switch to IRV, we are not solving for strategy; we are simply choosing a different kind of strategic risk.

  Therefore, I recommend we **retain the Points System, but modify the tallying method.**

  **The Proposal: The "Olympic" Trim**
  We keep the ranking system (1–6), but for each book, we discard the highest and lowest rank awarded before summing the points. With five judges, this means every book's score is determined by the middle three judges.

  **Why this approach (and why you might disagree):**

  1.  **Consensus vs. Passion:** This system prioritizes the book that commands the most widespread respect rather than the book with the most fervent champions. If you believe a prize should reward the book that *divides* the room less, this works. If you believe a prize should champion the book that a *majority* loves even if others hate it, you should argue for IRV.
  2.  **Mitigation, Not Elimination:** Dropping the outliers neutralizes the "saboteur" (the strategic last-place vote) and the "superfan" (the strategic first-place vote). However, it does not stop a judge from ranking insincerely across the board. It reduces the impact of bad faith, it does not remove the possibility of it.
  3.  **Simplicity:** We already know how to use this system. IRV requires a new mental model for how we discuss the books during deliberation.

  This modification acknowledges that one judge's extreme view should not outweigh the collective center, but it admits that we are still relying on each other's good faith.

  Please come Tuesday prepared to argue for the *values* you want the prize to reflect, not just the mechanics. I will bring sample tallies from last year's shortlist using this new method so we can see how the winner might have changed.

  See you then.
