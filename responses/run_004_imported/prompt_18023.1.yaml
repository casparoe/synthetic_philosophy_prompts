answer: |-
  You are both partially right, which is why the argument was likely so intractable. Your friend is defending the rhetoric of the 1962 *Structure of Scientific Revolutions*, which indeed invited a radical, holistic reading. You are defending the technical precision of Kuhn's later work, specifically the papers collected in *The Road Since Structure* (2000), most notably his 1983 essay "Commensurability, Comparability, Communicability."

  In his mature period, Kuhn explicitly retreated from the "different worlds" gesturalism of 1962 to a semantic theory based on **lexical taxonomies**. He argued that incommensurability is **local**, not global, but that this locality is sufficient to block point-by-point translation because of how kind-terms structure reality.

  Here is an explanation of Kuhn's mature account, how it differs from the "vulgar" reading, and why he believed it still preserved the core thesis.

  ### 1. From "World Change" to "Language Change"
  In 1962, Kuhn relied heavily on Gestalt psychology metaphors (the duck-rabbit illusion) to suggest that after a revolution, scientists literally *see* differently. This led to the "vulgar reading" your friend defends: that paradigms are hermetically sealed worldviews with no shared ontology. Critics (like Shapere and Putnam) hammered this as irrationalist or relativist. If there is no shared vocabulary, how can scientists even argue?

  In the 1980s, Kuhn shifted the ground. He argued that incommensurability is not primarily about perception or ontology, but about **language**. Specifically, it is about the structure of **kind terms** (nouns that categorize things, like "planet," "element," or "mammal").

  Kuhn's mature thesis is that scientific languages are organized into **lexical taxonomies**. These are hierarchical structures where terms are defined by their relationship to one another (e.g., a "gold ring" is a subset of "metal," which is a subset of "element").

  ### 2. The Mechanism: The No-Overlap Principle
  The engine of Kuhn's mature incommensurability is what he called the **No-Overlap Principle**. In a functioning lexical taxonomy, no two kind terms at the same level of the hierarchy can overlap in their reference.
  *   *Example:* In our taxonomy, an object cannot be both a "planet" and a "satellite." If it orbits a star, it's a planet; if it orbits a planet, it's a satellite. The terms are mutually exclusive by definition within the structure.

  Kuhn argued that scientific revolutions occur when the **taxonomic structure itself is rearranged**. During a revolution, some terms are dropped, new ones are introduced, or, most importantly, the rules of inclusion and exclusion change.

  This is where the **locality** comes in. Kuhn conceded that not *all* language changes. Mathematics, logic, and many observation terms remain stable. The incommensurability is confined to the specific cluster of concepts undergoing revolution (e.g., the taxonomy of material substances in the Chemical Revolution, or the taxonomy of motion in the Relativistic Revolution).

  ### 3. Why Translation Fails (The "Strong Enough" Claim)
  You asked why Kuhn thought this narrower version was still strong enough to block straightforward translation. If only a local cluster of terms changes, why can't we just translate the rest and footnote the differences?

  Kuhn's answer relies on the holism of the **taxonomic cluster**, not the holism of the **worldview**.

  **A. Circular Definition within Taxonomies**
  In a taxonomic structure, terms are defined by their contrast with neighboring terms. You cannot define "phlogiston" simply by pointing to a substance; you define it by its role in a structure where calcination is the *release* of a principle, not the *combination* with oxygen.
  To translate "phlogiston" into "oxygen chemistry," you have to map it onto the new taxonomy. But in the new taxonomy, there is no slot for "substance released during burning." There is only "substance combined during burning."
  Therefore, there is no neutral term in the new language to capture the old term without distortion. You can explain what the phlogistonians *meant*, but you cannot translate their statements into your language such that they retain their original truth conditions.

  **B. The Failure of Statement-by-Statement Comparison**
  This is the critical philosophical stake. If translation were possible, we could compare two theories statement-by-statement to see which is "truer."
  *   *Theory A:* "Phlogiston escapes during combustion."
  *   *Theory B:* "Oxygen combines during combustion."

  If these terms were translatable, we could say Theory B contradicts Theory A. But Kuhn argues that because the terms belong to incompatible taxonomic structures, the statements are not logical contradictories. They are talking about different categorizations of events.
  Therefore, **you cannot judge a revolution by comparing the theories directly.** You must compare the *paradigms* as whole packages (puzzle-solving ability, scope, precision). This blocks the cumulative view of science (science as a stack of truth-statements) without requiring the irrationalist view (science as random mob psychology).

  **C. Bilingualism vs. Translation**
  Kuhn introduced the analogy of **bilingualism**. He argued that historians or scientists *can* learn to understand the old paradigm, just as one can learn French and English.
  However, being bilingual is not the same as having a perfect dictionary. A bilingual speaker knows that some concepts in French do not map 1:1 onto English. They understand the French concept *within the French structure*.
  Kuhn's point: We can understand phlogiston theory (we can be bilingual), but we cannot translate it into modern chemistry without losing the structural relationships that gave the terms their meaning. Thus, communication is possible, but **neutral translation** is not.

  ### 4. Summary for Your Debate
  To resolve your evening's argument, you can concede ground to your friend while securing the win for your interpretation:

  1.  **Concede the Rhetoric:** Admit that the 1962 text *did* encourage the "different worlds" reading. Kuhn later admitted he was too careless with phrases like "world change," which suggested scientists literally inhabit different physical universes.
  2.  **Insist on the Mechanism:** Explain that Kuhn's mature view (1983+) replaces "perceptual worlds" with **"lexical taxonomies."** Incommensurability is not a mystical barrier; it is a structural mismatch in how kind-terms carve up nature.
  3.  **The Locality Point:** Emphasize that Kuhn explicitly labeled his later view **"local incommensurability."** It applies only to the specific conceptual cluster in flux (e.g., chemistry terms), not to all scientific discourse (math and logic remain shared).
  4.  **The Stakes:** Explain *why* Kuhn kept the thesis. If translation were perfect, scientific progress would be a simple accumulation of truths. Kuhn wanted to show that progress is real (better puzzle solving) but not cumulative (the old questions often vanish rather than get answered). The taxonomic mismatch ensures that old theories aren't proven "false" in a simple logical sense; they are rendered obsolete by a new way of categorizing the world.

  **In short:** Your friend is right that Kuhn believes communication across revolutions is difficult and that terms cannot be perfectly mapped. You are right that this is not because scientists are blind to each other's data, but because the **semantic structures** they use to categorize that data are locally incompatible. Kuhn saved incommensurability from relativism by grounding it in the logic of classification rather than the psychology of perception.
