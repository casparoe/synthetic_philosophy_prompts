      *   **Closing:** Return to the user's search for something "sturdier." Suggest that maybe the sturdiness isn't in the conclusion ("this is best") but in the seriousness of the question ("evil is real, God is good, how?"). Offer condolences.

  6.  **Refining the Tone (Self-Correction during drafting):**
