answer: |-
  This is a fascinating dilemma, and your writing group member has raised a sophisticated objection. It is not merely an *ad hominem* attack (rejecting the argument because of the person); rather, it is a claim about **thematic unity**. They are arguing that Frege's logic and his politics spring from the same psychological root: a deep-seated authoritarianism regarding "Truth."

  To answer your question directly: **The argument is provocative and psychologically plausible, but philosophically weak.** It conflates the *motivation* for a belief with the *justification* for that belief.

  If your narrator's colleague is to give a reply that a careful philosopher would respect, they need to navigate between two extremes: whitewashing Frege's ugliness on one hand, and accepting the genetic fallacy on the other.

  Here is a breakdown of where the writing group member's argument holds water, where it dries up, and how your character can articulate the distinction.

  ### 1. Where the Writing Group Member is Right (The Resonance)
  Your friend is correct that there is a shared *temperament*. Frege's entire philosophical project was a war against **psychologism**—the idea that logic is just a description of how human beings happen to think. Frege argued that logical laws are objective, mind-independent truths (Platonism). They do not care what the majority thinks.

  His politics mirrored this. He viewed the Weimar Republic (parliamentary democracy) as a mess of subjective opinions, compromises, and "psychological" whims. He wanted an objective order imposed from above. In both cases, Frege displays:
  *   Contempt for consensus.
  *   A belief in a single, rigid hierarchy of truth.
  *   An elitism about who is capable of accessing that truth.

  If your character denies this resonance, they will sound naive. The first step in the reply is to concede the point: *Yes, the same steel spine holds up both his logic and his bigotry.*

  ### 2. Where the Argument Gives Out (The Distinction)
  The error lies in assuming that because the *temperament* is the same, the *validity* of the output must be the same. This is where the colleague can strike back.

  **A. Context of Discovery vs. Context of Justification**
  This is the classic philosophical distinction (often associated with Reichenbach, but relevant here).
  *   **Discovery:** Why did Frege come to believe $2+2=4$ is objective? Perhaps because he was psychologically rigid and hated ambiguity.
  *   **Justification:** Is $2+2=4$ objective? We determine this by checking the math, not by checking Frege's psyche.

  The writing group member is arguing that the "context of discovery" (his authoritarian mind) contaminates the "context of justification" (the logic). The colleague's reply should be: *We do not judge the map by the moral character of the cartographer. We judge it by whether it leads us where we say it will.*

  **B. The Nature of the Objects**
  Frege's Platonism concerns **abstract objects** (numbers, truth-values). His politics concerned **human beings**.
  *   In logic, excluding "subjectivity" is a feature, not a bug. We *want* logical truths to be independent of human feelings.
  *   In politics, excluding "subjectivity" (i.e., human needs, voices, consent) is a bug. Politics *is* the realm of human interaction.
  The colleague can argue: *Frege was right to keep human psychology out of arithmetic. He was catastrophically wrong to try to keep human beings out of governance. The error was not in his demand for objectivity, but in applying the standards of arithmetic to the souls of men.*

  **C. The Historical Irony (The Russell Check)**
  This is the strongest empirical counter-argument. Frege's logicism *was* shattered, but not by his politics. It was shattered by Bertrand Russell, who wrote to him in 1902 pointing out a paradox in his system.
  *   Frege's logic failed because of an internal contradiction, not because he was a bigot.
  *   Conversely, his bigotry remains repulsive regardless of whether his logic holds.
  The colleague can point out: *If his authoritarian mind ruined his logic, Russell would never have needed to write to him. The system collapsed under its own weight, not its owner's.*

  ### 3. A Note on Historical Accuracy (The Diary)
  I must flag a potential historical snag for your novel. You mentioned the diary "surfaced decades after his death." This is accurate historically (Gottfried Gabriel discovered Frege's political writings in the 1980s/90s).
  *   **The Problem:** If your novel is set in **1924**, your characters cannot be discussing this specific diary as a known document. It was private and unpublished.
  *   **The Fix:** Ensure your narrator's knowledge is plausible. Perhaps the narrator is one of the few people entrusted with the papers? Or perhaps they are discussing Frege's *known* reactionary views (he was openly monarchist and nationalist) rather than the specific text of the diary? If the diary is a plot device, just ensure the mechanism of its discovery in 1924 is clear (e.g., Frege showed it to the narrator personally).

  ### 4. Drafting the Colleague's Reply
  Here is a sketch of how the colleague might articulate this. The tone should be weary but precise.

  > "You are suggesting that the rot in the root poisons the fruit. It is a comforting thought, in a way. It suggests that if we purge the man, we purge the error. But logic is not a plant; it is a structure.
  >
  > "Yes, Frege hates the parliament for the same reason he hates psychologism. He believes both are mobs. He believes truth is a king, not a vote. In arithmetic, he is right. If we put the law of non-contradiction to a plebiscite, the mob might vote it down tomorrow. We need Frege's rigidity there. We need the truth to be untouched by human filth.
  >
  > "But in politics, the 'human filth' *is the subject matter*. To apply the laws of arithmetic to the governance of men is not rigor; it is a category error. He tried to solve for $x$ where $x$ is a human soul.
  >
  > "So, do not worry that his bigotry invalidates his logic. Russell invalidated his logic with a single letter about sets. His bigotry invalidates his politics. Let us not confuse the two, or we commit the very psychologism he spent his life fighting: judging the truth of the thought by the state of the thinker's soul."

  ### Summary for the Author
  Your writing group member has identified a **stylistic and temperamental unity**, which is great for character development. But they have not identified a **logical dependency**.

  Your colleague's strongest move is to argue that Frege's greatness and his ugliness are indeed siblings, but they are not twins. They come from the same parent (a demand for absolute objectivity), but one grew up in the realm of numbers (where it thrived) and the other in the realm of people (where it became monstrous). To condemn the numbers because of the people is to surrender the very objectivity Frege tried to protect.

  This allows your novel to acknowledge the horror of the diary without resorting to a simplistic "bad man, bad math" conclusion, which honors the complexity of both Frege and the history of ideas.
