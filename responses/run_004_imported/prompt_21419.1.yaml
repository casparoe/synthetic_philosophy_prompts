answer: |-
  **Seminar Paper: Extrinsic vs. Intrinsic Higher-Order Theories of Consciousness**

  **Introduction**

  The central project of higher-order (HO) theories of consciousness is to explicate the difference between conscious and unconscious mental states without positing irreducible qualitative properties. Both David Rosenthal and Uriah Kriegel subscribe to the Transitivity Principle: a mental state is conscious only if the subject is, in some sense, aware of being in that state. For both, this awareness is constituted by a higher-order representation (HOR). However, their architectures diverge sharply. Rosenthal defends an *extrinsic* Higher-Order Thought (HOT) theory, where the HOR is a numerically distinct state from the target state. Kriegel defends *Self-Representationalism* (SRT), where the HOR is an intrinsic feature of the target state itself.

  This paper compares these positions, focusing on how Kriegel's move to an intrinsic structure is motivated by specific vulnerabilities in Rosenthal's extrinsic model—namely, the threat of regress and the problem of targetless higher-order thoughts. I will argue that while Kriegel's SRT successfully blocks the logical formulation of these problems, it does not dissolve them; rather, it relocates the explanatory burden into the internal unity of the complex mental state, leaving the theory vulnerable to a "binding" objection that mirrors the original difficulties.

  **Rosenthal's Extrinsic HOT Theory**

  For Rosenthal, a mental state $M$ is conscious if and only if it is targeted by a suitable Higher-Order Thought. Crucially, the HOT is a separate mental state, numerically distinct from $M$. If I consciously see a red apple, there is a first-order perceptual state representing the apple, and a distinct second-order thought representing that I am in that perceptual state.

  *Motivations:* Rosenthal's primary motivation is naturalistic reduction. By treating consciousness as a relational property conferred by a separate cognitive state, he avoids positing mysterious intrinsic "glows" or qualia. This allows for a clean distinction between conscious and unconscious states: a subliminal perception is simply a first-order state lacking a HOT.

  *The Threat of Regress:* If a conscious state requires a HOT, what makes the HOT conscious? If the HOT must itself be conscious, we require a HOT3, leading to an infinite regress. Rosenthal blocks this by stipulating that the HOTs rendering states conscious are themselves *unconscious*. We are aware of the first-order state, but we are not consciously aware of the HOT itself.

  *Targetless HOTs:* A significant consequence of the extrinsic view is the possibility of "empty" or targetless HOTs. Since the HOT is distinct from the target, it is logically possible for the HOT to exist without the first-order state. If I have a HOT that I am in pain, but no actual pain state exists, Rosenthal argues I am nonetheless in a conscious state of *seeming* to be in pain. For Rosenthal, the reality of the conscious experience depends on the HOT, not the first-order state.

  **Kriegel's Self-Representationalism**

  Kriegel agrees with the Transitivity Principle but rejects the extrinsic architecture. For Kriegel, a conscious state $M^*$ is a complex state with two representational contents: a world-directed content (representing the environment) and a self-directed content (representing $M^*$ itself). The higher-order representation is not a separate state; it is an intrinsic component of the very state it renders conscious.

  *Motivations:* Kriegel aims to preserve the transitivity intuition while capturing the "for-me-ness" or subjective character of experience. He argues that extrinsic theories sever the connection between the experience and the awareness of it too drastically. By making the representation intrinsic, Kriegel seeks to ensure that the awareness is non-detachable from the experience, better capturing the unity of phenomenal consciousness.

  *Addressing the Regress:* Kriegel argues that SRT dissolves the regress. Because the state represents *itself*, there is no second state that stands in need of a third state to become conscious. The self-representing structure is simultaneous and intrinsic. The awareness is built into the ontology of the state, so no further step is required to light up the awareness itself.

  *Addressing Targetless HOTs:* SRT ostensibly eliminates the possibility of targetless higher-order representations. In Rosenthal's model, the arrow (HOT) can exist without the target (First-Order State). In Kriegel's model, the arrow and the target are identical. A state cannot represent itself without existing; therefore, a self-representing state cannot misrepresent its own existence. This secures a Cartesian infallibility regarding the existence of one's own conscious states, avoiding Rosenthal's counter-intuitive conclusion that one can have a conscious experience without the underlying mental state.

  **Verdict: Dissolution or Relocation?**

  Does Self-Representationalism genuinely dissolve the difficulties of extrinsic HOT theory, or does it merely relocate them? My verdict is that SRT relocates the problems within a single, more complex mental state. While it achieves logical consistency, it inherits explanatory gaps regarding the metaphysics of mental unity.

  *1. The Regress Relocated as the Binding Problem*
  Kriegel claims to dissolve the regress by making the representation intrinsic. However, this pushes the explanatory burden onto the relationship between the two contents within $M^*$. For $M^*$ to be conscious, the world-directed content and the self-directed content must be unified. If they are merely co-occurring parts of a state without genuine integration, we effectively have Rosenthal's two states stuffed into one container.
  To explain how these two contents constitute a *single* conscious experience, Kriegel must explain what binds them. If the binding mechanism is itself a representational relation, we risk a mini-regress within the state (what makes the binding relation conscious?). If the binding is non-representational, SRT concedes that representation alone is insufficient for consciousness, undermining its core claim. Thus, the regress is not dissolved but transformed into a problem of internal coherence and unity.

  *2. Targetless HOTs Relocated as Component Failure*
  Kriegel argues that a state cannot misrepresent its own existence. While logically sound, this does not fully address the phenomenological worry behind targetless HOTs. The worry is not just about existence, but about *accuracy*. Even if the state exists, can the self-representational component misrepresent the *nature* of the state?
  Furthermore, by ruling out targetless HOTs, SRT commits to the infallibility of consciousness regarding its own occurrence. This is a high metaphysical price. If a neurological glitch causes a self-representational structure to fire without the appropriate world-directed content (or vice versa), Kriegel must deny that consciousness occurs. Rosenthal's model, by contrast, accommodates the fallibility of introspection more naturally. SRT solves the "empty target" problem by making the target necessary, but in doing so, it makes consciousness too robust, potentially failing to account for cases of pathological self-misrepresentation (e.g., anosognosia or certain psychedelic states) where the sense of self and the experience seem to come apart.

  **Conclusion**

  Uriah Kriegel's Self-Representationalism is a sophisticated refinement of the higher-order approach. It successfully patches the logical holes in Rosenthal's extrinsic model, specifically preventing the infinite regress of distinct states and ruling out the metaphysical possibility of targetless awareness. However, these solutions come at the cost of positing a complex, self-referential mental architecture that is difficult to naturalize. The problems of extrinsic theories are not so much solved as internalized: the relation between two states becomes the relation between two contents within one state. Unless Kriegel can provide a robust account of how these contents are unified without invoking further representational machinery, SRT remains vulnerable to the charge that it has merely relocated the mystery of consciousness from the space between states to the interior of a single state.
