answer: |-
  This is a classic debate in the philosophy of medicine, and you actually had the stronger intuition. Dana is defending a "strict constructionist" version of Boorse, but she's missing the fatal flaw in the architecture: **Reference classes are not discovered; they are selected.** And the criteria for selection are inherently normative.

  Dana's "sloppy doctors" defense is a common move, but it actually concedes the point. If Boorse's theory (BST) requires us to ignore what doctors actually do in order to remain "value-free," then BST isn't an analysis of the *concept of disease*; it's a proposal for a *new* concept.

  Here is the reconstructed argument, broken down into four moves, designed to dismantle the "value-free" claim and close Dana's escape hatch.

  ### Move 1: The "Reference Class Selection" is Not Empirical
  Dana claims reference classes (age, sex) are empirical facts. She is right that age is a fact. She is wrong that *which* age class is relevant is a fact.

  **The Argument:**
  Boorse says we must compare an individual to a reference class of "natural kinds" (e.g., human males). But nature doesn't tell us whether to compare an 80-year-old to **other 80-year-olds** (age-matched) or to **25-year-olds** (species-typical peak).
  *   If you compare the 80-year-old to other 80-year-olds, low bone density is **normal** (statistically typical).
  *   If you compare the 80-year-old to a 25-year-old, low bone density is **abnormal** (statistically subnormal).

  Both comparisons are empirically valid. Nature gives you the data points; it does not give you the *baseline*. To choose the baseline, you have to decide: *What level of function is this organism entitled to?*
  *   If you think they are entitled to "peak species design," you use the young reference class.
  *   If you think they are entitled only to "typical performance for their cohort," you use the old reference class.

  **The Knockout:** That decision ("entitled to peak" vs. "entitled to cohort average") is not a biological fact. It is a **value judgment** about what counts as a deficit. You cannot derive the reference class from nature alone; you have to import a standard of "proper functioning" to pick the class.

  ### Move 2: Closing the "Sloppy Doctors" Escape Hatch
  Dana's counter was: *"Doctors are just being sloppy using risk measures. Properly applied, BST says osteoporosis in the elderly is just aging, not disease."*

  This is the most dangerous part of her argument because it makes BST unfalsifiable. If BST disagrees with medical practice, she just says medicine is wrong.

  **The Argument:**
  If Dana accepts that BST classifies osteoporosis in the elderly as "normal aging" rather than "disease," she is admitting that BST is **revisionist**, not **descriptive**.
  1.  **Descriptive Claim:** Boorse claims BST analyzes our *existing* concept of disease.
  2.  **The Conflict:** Our existing concept includes treating osteoporosis in the elderly as a disease.
  3.  **Dana's Defense:** "Well, BST says it's not a disease, so doctors are wrong."
  4.  **The Implication:** If BST has to overrule actual medical diagnosis to maintain its "value-free" status, then BST isn't telling us what disease *is*; it's telling us what disease *ought to be* according to a specific biological ideology.

  **The Knockout:** Ask Dana: *"If BST tells us that preventing fractures in the elderly isn't treating a 'disease' but merely interfering with 'normal aging,' does that mean insurance shouldn't cover it? If you say medicine is 'sloppy' for calling it a disease, you aren't defending naturalism; you're advocating for a policy change based on the value that elderly decline shouldn't be medicalized."*

  ### Move 3: "Risk" is Inherently Normative
  Dana tries to say doctors are measuring "risk," not disease, implying risk is neutral. It isn't.

  **The Argument:**
  To say something is a "risk" is to say there is a probability of a **harmful outcome**.
  *   Statistically, being 80 years old carries a "risk" of death. Is being 80 a disease? No.
  *   Statistically, low bone density carries a "risk" of fracture.

  Why is one risk "normal aging" and the other "disease risk"? The difference isn't in the statistics; it's in our judgment of the **outcome**. We judge fractures as *bad* in a way that requires intervention, whereas we (sometimes) accept death at 80 as inevitable.
  Boorse tries to ground "harm" in survival and reproduction. But treating osteoporosis doesn't necessarily help survival or reproduction (post-menopausal women aren't reproducing). We treat it because we value **mobility, independence, and pain avoidance.**

  **The Knockout:** *"You say doctors are looking at risk. But risk of what? Pain? Immobility? Those are values. If we didn't value independence in the elderly, a broken hip would just be a statistical event, like a tree branch breaking. Calling it a 'medical risk' presupposes that we value the function being lost. That value is doing the work, not the statistics."*

  ### Move 4: The "Species Design" Trap
  Boorse relies on "species design" (what the body is supposed to do). But "design" changes over time.

  **The Argument:**
  If the "species design" for an 80-year-old includes lower bone density (because that's how evolution shaped us), then low bone density is **functional** for that reference class. It might even be adaptive (less energy spent on bone maintenance).
  For BST to call it a disease, it has to claim the "design" is fixed at age 25.
  Why age 25? Because that's peak efficiency.
  But why is "peak efficiency" the definition of health?
  *   A car is designed to run for 15 years. Is it "diseased" in year 14 because it runs worse than in year 1? No, it's worn.
  *   Is a human in year 80 "diseased" because they function worse than in year 25?

  **The Knockout:** *"Boorse defines health as 'peak species efficiency.' But that's an arbitrary value choice. Why isn't health 'adequate function for current life stage'? By insisting on peak efficiency, Boorse is smuggling in the value that 'decline is unacceptable.' That's not biology; that's a cultural fear of aging."*

  ### Summary Script for the Follow-up
  If you want to send this to Dana or bring it up again, here is the condensed version:

  > "I thought more about the osteoporosis case. Your point about 'sloppy doctors' actually highlights the problem. If Boorse's theory says osteoporosis in the elderly is 'normal aging' and not 'disease,' then Boorse's theory contradicts actual medical practice.
  >
  > That forces a choice:
  > 1. **BST is descriptive:** If it's supposed to match our concept of disease, it fails, because we treat osteoporosis as a disease.
  > 2. **BST is revisionist:** If it's supposed to correct medicine, it's not value-free. It's imposing a value judgment that 'age-related decline shouldn't be medicalized.'
  >
  > The core issue is the reference class. Nature gives us the stats for 80-year-olds and 20-year-olds. Nature *doesn't* tell us which one is the 'correct' baseline for health. We choose the 20-year-old baseline only because we've already decided that losing bone density is *bad* (normative). If we thought it was just 'natural aging,' we'd use the 80-year-old baseline.
  >
  > So the value judgment comes *before* the statistics. We don't identify the disease because the stats are low; we pick the stats that are low because we already think it's a disease. That makes the theory circular, not naturalist."

  ### Why This Wins
  This argument prevents Dana from hiding behind "empirical facts." It shows that **statistics require a baseline**, and **choosing a baseline is a value judgment**. It also forces her to admit that if Boorse is right, most geriatric medicine is conceptually confused—which is a huge bullet to bite.
