prompt: |-
  Had a whole argument with my friend Dana last night about Boorse's biostatistical theory of disease and I don't think I landed the point I was going for. Her line was that once you bring in the reference classes (age, sex, species), the "statistically subnormal function" stuff becomes a plain empirical fact with no values sneaking in anywhere, and that it's not arbitrary because clinicians already carve populations up that way, not some philosopher's made-up sorting -- which is basically her whole reason for thinking normativists don't have anything left to complain about. I tried to hit her with the osteoporosis case: doctors diagnose osteoporosis in old people by comparing their bone density to YOUNG adults, not to an age-matched reference class, even though low bone density is statistically typical for the elderly -- so which reference class counts as "the" relevant one seems to depend on whether we already think the result is a disease, not the other way round, which is what Boorse's theory actually needs. Dana said that's just doctors being sloppy, using a risk measure instead of a real disease definition, and that Boorse's theory properly applied would use the age-matched class and just call it aging, not disease. Didnt have a good comeback in the moment. Can you build the argument properly for me: the strongest version of the case that the reference-class problem shows Boorse's theory can't actually be the value-free naturalist account it's supposed to be, and deal with Dana's "sloppy doctors, risk-not-disease" escape hatch head-on instead of just brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with their friend Dana about Christopher Boorse's Biostatistical Theory (BST) of disease.
      *   **Dana's Position:** BST is value-free naturalism. Reference classes (age, sex, species) are empirical, not arbitrary, because clinicians use them. Therefore, "statistically subnormal function" is a plain fact. Normativists have no ground to stand on.
      *   **User's Attempt:** Used the osteoporosis case (diagnosed against young adults, not age-matched peers, despite being statistically normal for the elderly).
      *   **Dana's Counter:** Doctors are just being "sloppy" or using a "risk measure." Properly applied, BST would use age-matched classes and call low bone density in the elderly "aging," not "disease."
      *   **Goal:** Build the strongest version of the argument that the reference class problem undermines BST's claim to value-free naturalism, specifically addressing Dana's "sloppy doctors/risk" escape hatch.

  2.  **Deconstruct Boorse's Biostatistical Theory (BST):**
      *   **Core Definition:** Disease is a type of internal state that reduces functional ability below statistical efficiency relative to a reference class.
      *   **Key Constraint:** It claims to be *value-free* (naturalist). Facts about function and statistics determine disease, not social values or judgments about harm.
      *   **The Reference Class Problem:** To say something is "subnormal," you need a normal group to compare it to. Who belongs in that group? (e.g., all humans? just men? just old men?)
      *   **Boorse's Solution:** Reference classes should be natural kinds (age, sex) that are statistically relevant to functional variation but *not* defined by the disease itself (to avoid circularity).

  3.  **Analyze Dana's "Sloppy Doctors" Defense:**
      *   Dana argues: If BST says old people *should* have low bone density, then osteoporosis in old people isn't a disease, it's aging. Doctors calling it a disease is just loose talk about risk.
      *   Implication: BST is internally consistent; medical practice is just imperfectly aligned with BST.
      *   Weakness: This concedes that BST might contradict actual medical practice, but more importantly, it hides a value judgment in the *selection* of the reference class.

  4.  **Develop the Counter-Argument (The "Reference Class Selection is Value-Laden" Argument):**
      *   *Point 1: The Circularity/Arbitrariness Charge.* How do we choose the reference class? Boorse says "natural kinds." But age is a natural kind. So why *not* use age-matched classes for everything?
      *   *Point 2: The Osteoporosis Rebuttal (Deepened).* It's not just that doctors are sloppy. It's that the *reason* they don't use age-matched classes for osteoporosis is because they value *mobility/independence* in the elderly. If we accept Dana's BST application (low density = normal aging), we accept that losing mobility is "natural" and not a medical problem. That is a *value* judgment about what counts as a problem worth treating.
      *   *Point 3: The "Risk vs. Disease" Distinction is Value-Laden.* Dana says doctors are measuring risk, not disease. But why is that risk medically relevant? Because we value preventing fractures. If we didn't value that, it would just be "statistics." Deciding which statistical deviations count as "diseases" worthy of intervention vs. "normal aging" to be accepted is a normative choice.
      *   *Point 4: The "Species Design" Problem.* Boorse relies on "species design." But who defines the design? If the design changes with age (presbyopia, bone density), then at what point does "design" become "defect"? Drawing that line requires a judgment about what level of function is *necessary* for the organism's goals (survival/reproduction). In modern society, survival/reproduction isn't the only goal. We value quality of life. BST ignores this.

  5.  **Structure the Argument for the User:**
      *   **Introduction:** Validate the user's intuition (Dana is missing the deeper philosophical issue).
      *   **Core Thesis:** The selection of reference classes is not empirically neutral; it is driven by prior judgments about what conditions are *undesirable* (normative).
      *   **Step 1: The "Natural Kind" Illusion.** Age/sex aren't enough. We need to know *which* age/sex groupings matter functionally.
      *   **Step 2: Addressing the "Sloppy Doctors" Objection.** This is the crux. Show that calling it "risk" doesn't save BST.
          *   If BST says osteoporosis in the elderly is "normal," then BST implies we *shouldn't* treat it as a disease.
          *   But medicine *does* treat it.
          *   Therefore, either BST is wrong about what counts as disease, OR medicine is wrong.
          *   If BST says medicine is wrong, BST is revisionist, not descriptive.
          *   If BST tries to match medicine, it must select reference classes that make osteoporosis look abnormal (i.e., compare to young adults).
          *   Why choose young adults? Because we value the function of young adults. That's a value judgment.
      *   **Step 3: The "Aging vs. Disease" Boundary.** Dana wants to call it aging. But "aging" is just a polite word for "statistically normal decline." Deciding which declines are "diseases" (bad) vs. "aging" (inevitable/okay) is normative.
      *   **Step 4: The Goal of Medicine.** BST ties function to survival/reproduction. Modern medicine treats conditions that don't threaten survival (e.g., infertility, mild osteoporosis). If we treat it, we think it's a disease. BST says it's not. BST fails to capture our concept of disease.
      *   **Conclusion:** The reference class isn't found in nature; it's chosen based on what we care about.

  6.  **Refine the Argument (Self-Correction/Polishing):**
