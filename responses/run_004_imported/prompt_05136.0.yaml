      *   **Task:** Evaluate who is right at each step (1-5), determine if either is misreading Arendt, and identify what both might be missing.

  2.  **Recall/Research Arendt's "Lying in Politics":**
      *   *Core Thesis:* Arendt distinguishes between the "traditional liar" and the "modern political liar" (specifically the image-maker/technocrat).
      *   *Traditional Lying:* Requires knowing the truth and intentionally hiding it. The liar respects the truth enough to hide it.
      *   *Modern Political Lying:* Often involves rewriting reality itself. It's not just hiding facts but changing them in the public record/memory.
      *   *Self-Deception:* Arendt discusses the "professional problem-solver" who gets so caught up in the consistency of their model that they ignore reality. She also touches on the idea that if you lie enough, you might believe it, but the *act* of lying in politics is often about manipulating the public sphere, not just internal psychology.
      *   *Key Distinction:* For Arendt, the danger isn't just the moral failing of the individual liar, but the destruction of the "common world" (the shared factual ground).
      *   *Intent vs. Effect:* Arendt is less concerned with the *internal state* of the liar (do they believe it?) and more concerned with the *political function* of the lie (does it destroy factual truth?).
      *   *The "Image" Maker:* She discusses how political actors create images that replace reality. If the image says "I opposed this," and the team successfully projects that, the factual record becomes irrelevant to the political narrative.

