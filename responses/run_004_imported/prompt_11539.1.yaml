prompt: |-
  Ok so I'm the junior rep on my school's Honor Council (it's the student-faculty board that hears cheating cases and sends a recommendation to the Dean of Students, who like 95% of the time just goes with whatever we say), and we've got a case this Tuesday that's splitting the whole council and I need to bring in a written opinion. Here's the situation: five kids in my AP Chem class share a group chat, and the last three problems on last week's take-home set were supposed to be done completely independantly - the teacher was really explicit about this, it's graded like a quiz. Before anyone even started, the group agreed in the chat that if someone got stuck on the independent part they'd post their answer so everyone else could "check against it." In the end 2 of the 5 actually posted their answers and the other 3 copied off them. The remaining 3 swear that by the time the answers got posted they'd already finished on their own, so they never opened or used the shared answers - even though they'd fully agreed to the plan and were ready to use it the second they needed to.

  Half the council wants to only charge the 2 who actually copied, since technically the other 3 didn't turn in anything besides their own work, and our honor code only defines cheating as "giving or receiving unauthorized help" - it doesn't say anything about just agreeing to a plan you don't end up carrying out. The other half (kind of including me, which is awkward bc one of the "innocent" 3 is my friend) thinks that's letting people off the hook for basically getting lucky, since all 5 set the whole thing up together and had the exact same intentions going in - the 3 just happened not to need the answers once it came down to it. But I get the other side too, it does feel kind of messed up to punish someone the same as an actual copier when all they turned in was their own work. Can you write the actual memo I'd bring to Tuesday's meeting? It needs to say clearly what happens to each of the 5 - what they're charged with, if anything, and what the sanction is - keeping in mind the semester ends in two weeks so this has to move fast, and it actually has to deal with the "they never even used it" argument instead of just brushing past it, since that's the thing people keep bringing up.
