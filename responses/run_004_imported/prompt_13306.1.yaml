answer: |-
  Here is a draft for the eulogy. It is designed to be spoken aloud, with pauses and natural rhythms. It translates her philosophical rigor into human terms without using jargon, honoring her specific wish to avoid comforting untruths while still offering warmth to the family.

  ***

  **Eulogy for [Grandma's Name]**

  Good morning. For those who don't know me, I'm [Your Name], [Grandma's Name]'s grandson/granddaughter.

  Standing here, looking out at all of you, I know what people usually say at times like this. We're told that she's at peace now. That she's merged back into the universe. That she's watching over us from somewhere else.

  I know those words are meant to help. They are meant to soften the blow. But if there is one thing my grandmother taught me, and all of us who knew her well, it is that the truth matters more than comfort.

  Grandma was a thinker. Some of you know she loved philosophy. She spent thirty years asking the hardest questions she could find about what this world actually is. She didn't believe in easy answers. She didn't believe in magic. She believed in paying attention.

  She had a view that the world is not made of dead matter. She believed that experience—that feeling, that awareness—is part of the fabric of reality, all the way down. To her, a stone, a star, and a human being were all made of the same fundamental stuff.

  But—and this is important—she was very strict about what that meant. She knew that being made of the same stuff as the stars didn't mean she would become a star when she died. She knew that *she*—the specific person who loved gardening, who argued about politics, who held your hand when you were sick—was a unique arrangement of that stuff. A specific pattern.

  A few weeks ago, she made me promise something. She made me promise that I wouldn't stand here and tell you she is "returning to the cosmic whole." She told me that we don't know what happens when the pattern breaks. She said that pretending we know is disrespectful to the mystery of being alive.

  At first, I thought that was a hard request. It feels like I should offer you a soft landing. But then I realized: that request *was* the comfort.

  It was her way of telling us to look at what we actually have. We don't have a guarantee of an afterlife. We have something better. We have the fact that she was here.

  Because she believed that experience is real, she treated every moment as real. When she listened to you, she wasn't just waiting for her turn to speak. She was fully there. When she looked at the garden, she wasn't just looking at plants; she was looking at the world in all its depth. She took us seriously. She took *life* seriously.

  To the family here: she loved you not because she thought you were part of a spiritual plan, but because you were real. Your joy was real to her. Your pain was real to her. She didn't need to believe she would see you again in another life to know that loving you in this one was the most important thing she could do.

  To her friends from her reading group: I hope I have honored her integrity. I haven't solved the combination problem for her today. I haven't claimed to know the unknowable.

  And to everyone else: I think the best way to honor her is to do what she did. To pay attention. To treat the world not as a backdrop for our lives, but as something vivid and real. To value the truth, even when it's difficult.

  She was made of this world. She walked on this earth, she loved the people in this room, and she thought deeply about what it means to be here. That doesn't continue in a mystical way. It continues in the way we remember her. It continues in the way she changed us.

  We don't need to pretend she is somewhere else to feel her absence. We feel it right here, because this is where she was. And this is where she belongs.

  Thank you.
