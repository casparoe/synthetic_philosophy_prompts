              *   *Correction:* This is typically cited as *Savyabhicāra* (the inconclusive/erratic reason). *Asiddha* would be something like "The hill has fire because it is wet" (if fire can't exist where it's wet, making the reason incompatible) or "The sound is eternal because it is visible" (visibility is unestablished in sound). Actually, the classic *asiddha* example is often "The hill has fire because it is a lake" (contradictory) or regarding a non-existent subject. A better *asiddha* example is "Sound is eternal because it is visible" (visibility is not established in sound).
