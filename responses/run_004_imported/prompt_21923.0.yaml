answer: |-
  This is an ambitious and thoughtful capstone idea, and it is excellent that you have grasped the distinction between ordinal and cardinal utility. However, to ensure your project is theoretically sound, I need to point out a fundamental limitation in your proposed methodology that is central to welfare economics.

  **The short answer is: Neither normalization method will make this comparison rigorous.**

  Here is the detailed explanation of why, along with suggestions on how to pivot your project to maintain its rigor while keeping your core intuition intact.

  ### 1. The Interpersonal Comparison Problem
  You are correct that von Neumann–Morgenstern (vNM) utility is **cardinal**. For a *single* individual, the utility function $U(w)$ is unique up to a positive affine transformation ($U' = aU + b$, where $a > 0$). This means we can measure the *intensity* of that specific person's preferences (e.g., they prefer moving from \$10 to \$20 twice as much as moving from \$20 to \$30).

  However, vNM theory **does not allow for interpersonal comparisons of utility.**

  *   **Person A (Billionaire):** Has a utility function $U_B$. We can scale it so their worst outcome is 0 and best is 100.
  *   **Person P (Poverty):** Has a utility function $U_P$. We can scale it so their worst outcome is 0 and best is 100.

  The problem is that the "distance" between 0 and 100 for the Billionaire has no theoretical relationship to the "distance" between 0 and 100 for the Person in Poverty.
  *   For the Billionaire, 1 unit of normalized utility might represent a trivial preference.
  *   For the Person in Poverty, 1 unit might represent a life-or-death preference.

  Because the scaling constants ($a$ and $b$) are arbitrary and unique to each individual, summing their changes ($\Delta U_B + \Delta U_P$) is mathematically meaningless within the vNM framework. You cannot add "Billionaire Utils" to "Poverty Utils" any more than you can add degrees Celsius to inches.

  ### 2. Why Normalization Doesn't Solve It
  You asked whether min-max scaling (0–100) or variance standardization would be more defensible.

  *   **Min-Max Scaling:** This forces the range of outcomes to look identical. However, it assumes that the *span* of emotional or welfare experience between the worst and best lottery outcome is identical for both agents. There is no empirical or theoretical basis for this.
  *   **Variance Standardization:** This forces the *variability* of responses to match. This assumes that the "noise" or "sensitivity" in their decision-making is comparable. This is also theoretically unsupported.

  In both cases, you are imposing an **ethical axiom** (that utilities are comparable) and disguising it as a **mathematical normalization**. A rigorous economics project should distinguish between the two.

  ### 3. How to Save the Project (and Make it Rigorous)
  Your intuition is actually correct according to standard economic assumptions: transferring money from a rich person to a poor person usually increases social welfare due to the **diminishing marginal utility of wealth**. However, you need to frame the argument differently to avoid the interpersonal comparison trap.

  Here are three ways to adjust your project for maximum rigor:

  #### Option A: Focus on Marginal Utility of Wealth (Positive Economics)
  Instead of claiming to measure "total welfare," model the **shape** of the utility functions.
  *   Elicit the functions $U_B(w)$ and $U_P(w)$.
  *   Calculate the marginal utility of money ($U'(w)$) for both at their current wealth levels.
  *   **The Argument:** You will likely find that $U'_P(w_{\text{low}}) \gg U'_B(w_{\text{high}})$.
  *   **The Conclusion:** "While vNM utility cannot be summed across individuals, the elicited functions demonstrate that the poor agent values an additional dollar significantly more intensely *relative to their own scale* than the billionaire does. If one adopts a Social Welfare Function that weights individuals equally, this disparity in marginal utility supports redistribution."
  *   **Why this works:** You aren't claiming the units are the same; you are showing the *structural difference* in how they value money, leaving the ethical weighting to a stated assumption.

  #### Option B: Explicitly Adopt a Social Welfare Function (Normative Economics)
  If you want to argue about "total welfare," you must explicitly introduce a **Social Welfare Function (SWF)**.
  *   State clearly: "vNM utility is not interpersonally comparable by default. However, for the purpose of this model, I will adopt a **Utilitarian Social Welfare Function** which assumes interpersonal comparability of utility."
  *   Cite **Harsanyi's Utilitarianism Theorem**, which attempts to bridge vNM utility and social welfare under specific axioms (including the "veiled ignorance" concept).
  *   **Why this works:** You are acknowledging the limitation and then explicitly choosing an ethical framework to overcome it, rather than trying to mathematically normalize your way out of it.

  #### Option C: Money-Metric Utility
  Instead of comparing utility units, compare **willingness to pay** or **Equivalent Variation**.
  *   Ask: "How much money would the billionaire pay to avoid losing \$1?" vs "How much money would the poor person pay to gain \$1?"
  *   Since these are measured in dollars (a common unit), they are comparable.
  *   **Why this works:** It converts utility back into a common numeraire (money), bypassing the utility comparison problem.

  ### Recommendation
  For a capstone project, **Option A** is likely the strongest. It shows you understand the vNM theorem's limitations (intrapersonal cardinality only) while still demonstrating the economic principle you want to highlight (diminishing marginal utility).

  **Do not** proceed with the min-max or variance normalization to sum the utilities without explicitly stating that you are making a strong, non-vNM ethical assumption. If you present the normalization as a mathematical solution to the comparability problem, an economics instructor will likely flag it as a fundamental theoretical error.

  **Summary for your methodology section:**
  > "While vNM utility functions are cardinal, they are not interpersonally comparable. Therefore, normalizing scales (via min-max or variance) does not theoretically justify summing utilities. Instead, this project compares the *marginal utility of wealth* ($U'(w)$) for each agent to demonstrate the disparity in valuation, and discusses the ethical axioms required to translate this into a social welfare claim."

  This approach will demonstrate a much deeper understanding of welfare economics than simply forcing the scales to match.
