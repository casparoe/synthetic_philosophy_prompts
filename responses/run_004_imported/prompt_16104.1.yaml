answer: |-
  This is one of the most profound and difficult questions in bioethics and the philosophy of law. It is completely understandable why it's bugging you; you are staring directly at a collision between two fundamental values: **liberty** (the right to choose now) and **well-being** (the benefit of past wisdom).

  In your class, you are likely discussing **paternalism** (interfering with someone's liberty for their own good). Your aunt's situation is a specific, high-stakes version of this known as a **Ulysses Contract** (or psychiatric advance directive).

  Here is a breakdown of the philosophical and legal arguments on both sides, which might help you organize your thoughts on whose wishes should "win."

  ### 1. The Argument for "Past-Her" (Precedent Autonomy)
  This is your mom's position, and it relies on the philosophical concept of **Precedent Autonomy**.

  *   **The Ulysses Analogy:** In Greek mythology, Ulysses wanted to hear the Sirens' song but knew it would drive him mad and crash his ship. He ordered his crew to tie him to the mast and ignore his future screams to be released. In this view, your aunt, when stable, was Ulysses. She knew the "song" of mania would distort her reality.
  *   **The "Authentic Self":** Philosophers like Ronald Dworkin argue that our "critical interests" (our deep values and life goals) are established when we are competent. Mania is viewed not as a "change of mind," but as a disease that hijacks the brain. If the illness causes *anosognosia* (a neurological lack of insight where one literally cannot perceive they are ill), then the "present-her" isn't making a free choice; she is acting on a delusion.
  *   **The Promise:** To ignore the directive is to break a promise the aunt made to herself and her family. It treats the stable self as less important than the ill self.

  ### 2. The Argument for "Present-Her" (Current Autonomy)
  This is your cousin's position, and it relies on the principle of **Current Competence** and the risk of error.

  *   **The Right to Change One's Mind:** People evolve. A directive signed five years ago might not reflect who the person is today. Philosophers like Rebecca Dresser have argued that the "past self" is essentially a stranger to the "present self." Why should a stranger dictate what happens to your body right now?
  *   **The Fallibility of Diagnosis:** What if the doctors are wrong? What if this isn't mania, but a reasonable reaction to stress? If we prioritize the paper over the person, we remove the safety check of human judgment in the moment.
  *   **Trauma and Trust:** Forced hospitalization can be traumatic. It can destroy the trust between the patient and their family/doctors, making them less likely to seek help in the future. Your cousin might argue that respecting her *now*, even if she is misguided, preserves her dignity as a human being.

  ### 3. The Legal and Ethical "Tie-Breaker": Capacity
  In philosophy of law, the usual way to decide this isn't just "Past vs. Present," but **"Competent vs. Incompetent."**

  *   **Medical Capacity:** In most legal frameworks, an advance directive only kicks in if the person is currently deemed to lack **decision-making capacity**.
  *   **The Test:** Capacity isn't just "agreeing with the doctor." It usually requires the ability to:
      1.  Understand the relevant information.
      2.  Appreciate the situation and consequences.
      3.  Reason through the options.
      4.  Communicate a choice.
  *   **The Crux:** If your aunt, in her manic state, could not understand that refusing meds would lead to severe harm (due to delusions or impaired reasoning), the law generally sides with **Past-Her**. The logic is that her current refusal is not an exercise of autonomy, but a symptom of the illness.
  *   **However:** If she *did* understand the consequences but simply valued her freedom over her stability (a genuine value shift), then overriding her is much harder to justify ethically.

  ### 4. Is there a "Good Way" to Decide?
  There is no perfect solution, but ethicists often suggest a **hybrid approach**:

  1.  **Presumption of the Directive:** The advance directive should be the starting point. It represents the person's long-term values.
  2.  **Strict Capacity Review:** Doctors must rigorously prove that the *current* refusal is a result of impaired capacity, not just stubbornness.
  3.  **The "Least Restrictive Alternative":** Even if the directive is followed, the intervention should be the minimum necessary to ensure safety.
  4.  **Review Mechanisms:** Some jurisdictions allow for "revocation" of directives even during episodes, provided there is an independent review. This tries to balance the Ulysses contract with the right to change one's mind.

  ### Summary for Your Class (and Life)
  The conflict you are feeling is the tension between **integrity** (staying true to one's long-term values) and **liberty** (the right to act in the moment).

  *   **Your Mom** is prioritizing **Integrity/Well-being**: She sees the illness as a thief stealing her sister's true self.
  *   **Your Cousin** is prioritizing **Liberty/Agency**: He sees the coercion as a violation of her bodily autonomy, regardless of her mental state.

  In philosophy of law, the prevailing view in many jurisdictions is that **Precedent Autonomy (Past-Her) wins, *but only if* Current Capacity is clinically compromised.** If the mania destroys the ability to reason, the "Past Self" is the only one left who is truly "capable."

  It is a tragic situation because either choice involves a loss: either a loss of freedom (hospitalization) or a loss of health/stability (ignoring the meds). The fact that you can see both sides shows you are grappling with the material exactly as you should be. There is no clean answer, only a weighing of which harm is more tolerable.

  *(Note: Since this involves real family dynamics and medical law, remember that specific laws regarding psychiatric advance directives vary wildly by state and country. In some places, they are binding; in others, doctors can override them if they deem it necessary for safety.)*
