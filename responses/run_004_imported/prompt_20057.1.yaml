answer: |-
  You have hit on something that separates a casual reader of philosophy from someone who is really digging into the history of ideas. Your intuition is spot-on: the fact that serious scholars bring up Sidgwick's involvement with the Society for Psychical Research (SPR) is **not** because it's a quirky bit of Victorian color. It is because, for Sidgwick, the two projects were intimately connected.

  In fact, many modern Sidgwick scholars (like his biographer Bart Schultz) argue that you cannot fully understand *The Methods of Ethics* without understanding his psychical research.

  Here is the breakdown of why these two things are linked, and why it doesn't necessarily undermine his rigor.

  ### 1. The Connection: Solving the "Dualism of Practical Reason"
  You mentioned that you respected how *The Methods of Ethics* ends without fully resolving the tension between self-interest (Egoism) and the general good (Utilitarianism). That tension is what Sidgwick called the **"Dualism of Practical Reason."**

  Here is the problem Sidgwick faced:
  *   **Reason A (Egoism):** It is rational to pursue my own happiness.
  *   **Reason B (Utilitarianism):** It is rational to pursue the universal happiness.
  *   **The Conflict:** Sometimes, doing what is best for everyone hurts *you*. If there is no God and no afterlife, why should you sacrifice your own happiness for the greater good? In a purely materialist universe, the Egoist might actually be the more "rational" actor.

  Sidgwick was a secular thinker who couldn't just say, "Because God says so." But he desperately *wanted* Utilitarianism to be rational. He needed a way to prove that virtue and happiness ultimately coincide.

  **Enter the Psychical Research.**
  If you can scientifically prove that consciousness survives death, and that there is a cosmic order where actions have consequences beyond the grave, then the conflict disappears. Being moral becomes rational again because the "sacrifice" is temporary, and the reward (or karmic balance) is eternal.

  Sidgwick didn't join the SPR to chat with dead relatives for fun. He joined because he was looking for **empirical evidence for the afterlife** to solve the deadlock in his ethical system. He was trying to find a scientific foundation for religion, so that morality could remain rational without relying on dogmatic faith.

  ### 2. Does this undermine his rigor?
  It is easy to look back from the 21st century and say, "He wasted 30 years chasing ghosts." But looking at it that way might miss the point of his intellectual character.

  **It was an exercise in Evidentialism, not Faith**
  Sidgwick wasn't a "believer" in the spiritualist sense. He was a skeptic. The SPR was founded specifically to apply the scientific method to claims that science usually dismissed out of hand. Sidgwick's approach was: *If these phenomena are real, they are the most important facts in the universe. If they are not, we must prove they are not.*

  He was famously hard to convince. He investigated mediums and often exposed them as frauds. He didn't waste those decades because he was gullible; he spent them because the stakes were incredibly high. If he could prove survival after death, he solves the biggest problem in moral philosophy. To a mind like his, that was worth decades of rigorous testing.

  **The Victorian Crisis of Conscience**
  You have to contextualize this in the Victorian era. This was a time when Darwin, biblical criticism, and geology were dismantling traditional Christianity. Intellectuals like Sidgwick were terrified that without religion, society would lose its moral compass (a fear Dostoevsky shared: "If God does not exist, everything is permitted").

  Sidgwick's psychical research was an attempt to save morality from the wreckage of religion. He wasn't being irrational; he was trying to find a *new* rational basis for the things religion used to handle. That he failed to find conclusive evidence says more about the difficulty of the question than his lack of rigor.

  ### 3. Why do summaries treat it as trivia?
  You asked why serious write-ups bother bringing it up if some treat it as trivia.
  *   **Introductory Textbooks:** Often skip it because it complicates the narrative. It's easier to teach Sidgwick as the "Utilitarian who admitted Utilitarianism has a problem" than to explain the metaphysical desperation driving him.
  *   **Intellectual Biographies:** Almost always center it. They recognize that his "agnosticism" wasn't a passive lack of belief, but an active, agonizing search for evidence that occupied his entire intellectual life.

  ### The Takeaway
  Your respect for Sidgwick's honesty in *The Methods of Ethics* should actually extend to his psychical research.

  Most philosophers would have just assumed the afterlife existed to make their ethics work (Kant did this, essentially positing God as a "postulate of practical reason"). Sidgwick refused to do that. He said, "I need this to be true for my system to work, so I am going to spend 30 years trying to find evidence for it."

  When he didn't find the evidence, he didn't fake it. He kept the "Dualism" unresolved in his book.

  So, rather than showing a lack of rigor, the psychical research shows a terrifying level of consistency. He was willing to subject his own deepest philosophical needs to the same skeptical scrutiny he applied to everything else. He couldn't resolve the tension between self-interest and morality, and he couldn't find proof of the afterlife, but he refused to lie about either.

  That makes him, in many ways, one of the most intellectually honest figures in the history of philosophy. You spotted a "bug" in how he is usually presented, but it turns out to be a "feature" of his entire worldview.
