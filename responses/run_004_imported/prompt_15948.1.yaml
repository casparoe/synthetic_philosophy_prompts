answer: |-
  The *Fortune* magazine sat on the Formica table, next to a plate of congealing eggs and a cup of coffee that had gone cold twenty minutes ago. Arthur Vance stared at the page, though he had already read the paragraph three times.

  *It is possible to activate the latent energies of the environment... to produce artificial floods, to change the climate of large areas, to interfere with the electrical balance of the atmosphere.*

  Arthur was a stress analyst for Convair. His world was composed of load paths, yield strengths, and safety margins. He dealt in things that were solid: aluminum skins, titanium struts, the physical certainty of a rivet holding fast against G-force. He was good at his job because he was good at drawing lines around problems. You calculated the maximum stress, you applied a factor of safety, and you signed the drawing. The structure held, or it didn't. There was a finish line.

  But John von Neumann, the man whose name was whispered in the lunchroom alongside Oppenheimer and Teller, was suggesting there was no finish line.

  Arthur turned the page. The essay, "Can We Survive Technology?", was dense, academic, yet possessed a strange, weary resignation. It wasn't the nuclear section that had hooked him. He expected the bomb. He worked on the delivery systems for the bomb; the dread of the missile was a background hum, like the ventilation in the hangar. It was manageable because it was mechanical.

  It was the weather that unsettled him.

  *...cheaper, sneakier weapon than the bomb... no huge industrial base to pull it off.*

  Arthur looked out the sliding glass door of his ranch house. The San Diego morning was aggressively blue. A layer of marine fog clung to the mesas in the distance, burning off in the sun. It looked peaceful. It looked like a buffer. But von Neumann argued that the globe had shrunk. Distance was no longer a shield. The atmosphere itself, the very air that buffered them from the vacuum of space, was now a variable to be weaponized. If a man could turn the rain into a flood or the jet stream into a delivery vector for fallout, then the walls of the house were meaningless.

  "Art?"

  He jumped, his hand covering the magazine. His wife, Ellen, stood in the doorway, tying the sash of her robe. She looked at the cold coffee, then at him. "You've been up for hours. The car's still in the driveway."

  "Just reading," Arthur said. He didn't move his hand.

  "Work stuff?"

  "An essay. From last year."

  Ellen came over and touched his shoulder. Her warmth was solid, real. "You have that look. The one where you're solving for X and X turns out to be zero."

  "Something like that."

  She kissed the top of his head. "Don't be late. You promised to pick up milk."

  She went back to the bedroom. Arthur waited until he heard the water run in the bathroom, then he looked back at the text. His eyes caught the final argument, the one that had kept him awake the previous night. Von Neumann wasn't offering a treaty. He wasn't offering a technological fix. He was saying that survival was not a state you achieved, but a process you maintained.

  *...no one-time fix... an endless run of decisions we have to keep getting right, forever, with no finish line.*

  Arthur was an engineer. He believed in solutions. You fixed the leak. You reinforced the bulkhead. You solved the equation. The idea that safety required an infinite series of perfect choices, with no margin for error, felt like a structural flaw in the universe itself. It implied that fatigue was inevitable.

  He drove to the plant in Kearny Mesa with the windows up. The radio played a upbeat tune about a yellow polka-dot bikini, but Arthur turned it off. He watched the landscape roll by. The sprawl was new here. Tract houses marching up the hills, roads cutting through the chaparral. People built as if the ground was permanent. They acted as if the distance between them and the next continent mattered.

  Von Neumann said it didn't. The shrinking globe meant that a decision made in a lab in Moscow could alter the pressure system over San Diego within days. There was no empty space left to absorb the shock.

  At the office, the air smelled of ozone and cigarette smoke. The drafting room was a cacophony of scratching pens and whirring fans. Arthur sat at his desk and pulled the stress report for the F-106 interceptor project. It was a thick stack of blueprints and calculations. His job was to verify the wing loading under high-speed maneuver conditions.

  He picked up his slide rule. The familiar weight of it in his hand usually calmed him. It was a tool of precision.

  He looked at the environmental assumptions on the third page. *Standard Atmosphere, 1955.* Temperature, pressure, density were listed as constants based on altitude.

  Arthur stopped.

  If the atmosphere was no longer a constant, if it was a medium that could be manipulated, then the "Standard Atmosphere" was a lie. Not a malicious lie, but a dangerous simplification. He was signing off on a structure designed for a world that von Neumann claimed no longer existed.

  He picked up his red pencil.

  In the past, if he found a discrepancy, he had a protocol. He wrote a query, sent it to the lead engineer, waited for a disposition. The system absorbed the error. The system was designed to reach a conclusion. *Approved* or *Disapproved*.

  But von Neumann's point was that there was no conclusion. There was only the next decision.

  Arthur hovered the pencil over the paper. If he wrote the query, it would be buried in a stack of hundreds. It would be answered with a note about "operational parameters" and "statistical probability." The plane would be built. It would fly. It might hold, or it might not, depending on variables no one was tracking.

  He thought about the milk Ellen had asked for. He thought about the way the fog clung to the mesas. He thought about the infinite series of correct decisions required to keep the fog from turning into acid rain.

  He couldn't stop the plane. He wasn't that important. He wasn't von Neumann. He was a stress man in San Diego.

  But he could refuse to treat the variable as a constant.

  Arthur uncapped the red pen. He didn't write a query. Queries demanded answers, and answers implied finality. Instead, he wrote a note in the margin of the master print, next to the environmental assumptions.

  *Variable stability contingent on external geophysical factors. Standard model assumes static environment. Current literature suggests dynamic volatility. Safety margin does not account for non-linear atmospheric perturbation.*

  It was vague. It wouldn't stop the project. It wouldn't get him fired. It was a ghost in the machine. It was a marker that said: *We know this is unstable.*

  It was a small thing. It was not a protest. It was not a resignation. It was simply a refusal to lie about the numbers. It was one correct decision in an endless run.

  He capped the pen. His hand trembled, just slightly. He set the slide rule down.

  The phone on his desk rang. It was the lead engineer, calling him up to the conference room. They wanted to go over the weight savings on the tail assembly.

  Arthur stood up. He picked up the report with his red note on it. He walked out of the drafting room, down the corridor lined with framed photos of previous aircraft models. They looked like dinosaurs now. Beautiful, heavy, dead things.

  He pushed open the door to the conference room. The men inside were smoking, laughing, talking about golf scores and bonus structures. They were living in the illusion of the finish line. They thought they were building a future that would arrive and stay.

  Arthur sat down. He placed the report on the table, the red note facing up.

  "Sorry I'm late," Arthur said.

  "No problem, Art," the lead engineer said, not looking at the report. "Let's look at the tail weight."

  Arthur didn't open the folder. He looked at the man across the table, a guy named Miller who had a new baby at home.

  "The weather's been strange lately," Arthur said.

  Miller paused, a cigarette halfway to his mouth. "Yeah? Hot for January."

  "Not the heat," Arthur said. "The stability. You feel it?"

  The room went quiet for a second. It was a breach of protocol. You talked about work, or you talked about sports. You didn't talk about the feeling of the air.

  Miller shrugged, uncomfortable. "It's California, Art. Weather's always weird."

  "Right," Arthur said. "Just checking."

  He opened the folder. He didn't point to the note. He let it sit there, a small red scar on the white paper. He picked up his pencil. He would go through the numbers. He would do his job. He would go home and buy the milk. He would wake up tomorrow and do it again.

  There was no saving the world today. There was only getting the decision right this one time.

  Arthur ran his finger along the stress curve. "The load factor here," he said, his voice steady. "Let's run the calculation again. Just to be sure."

  "Again?" the lead engineer asked. "We ran it Tuesday."

  "I know," Arthur said. "But I want to check it against a different variable."

  "Which one?"

  Arthur looked out the window. The sky was a perfect, terrifying blue. There were no buffers left.

  "Let's just say," Arthur said, turning back to the table, "let's assume the air is heavier than we think."

  He began to calculate. He didn't expect to find an error. He didn't expect to change the design. He expected to find that the numbers held, for now. And tomorrow, he would calculate them again.

  He wrote the first digit. It was a small mark on a large page, but it was his. He kept writing, filling the silence with the scratch of graphite, one number after another, knowing he would have to do it all again the next day, and the next, forever.
