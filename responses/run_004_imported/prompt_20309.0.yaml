answer: |-
  **The Airtight Irrelevance of Good's Theorem**

  Your decision theorist friend is technically correct, but practically dangerous. I.J. Good's 1967 theorem is one of the cleanest results in decision science: for a rational Bayesian agent, free information always has non-negative expected value. If you can update your beliefs and optimize your actions based on what you learn, you should never turn down the data. To do so is, by definition, irrational.

  The proof is elegant and relies on the convexity of the value function (a Jensen's inequality trick). Imagine you have to decide whether to carry an umbrella. If you don't check the weather, you must choose the action that maximizes utility based on your *average* expectation of rain. If you *do* check the weather, you can condition your action on the state of the world: umbrella if rain, no umbrella if sun. Since the optimal action *after* seeing the evidence is always at least as good as the optimal action *before* seeing it (you can always choose to ignore the info and do what you would have done anyway), the expected utility of looking is higher than the expected utility of looking away. Mathematically, $E[\max_a U] \ge \max_a E[U]$. The expectation of the maximum is greater than the maximum of the expectation.

  This logic is airtight. It cannot be falsified within its own axioms. But here is the verdict you need for your piece, stripped of academic hedging:

  > **"Good's Theorem is a logical truth about instruments, not a psychological law about experiences. It proves that information is always valuable for *acting*, but it assumes information has no cost for *feeling*. Most human information avoidance isn't a failure of calculation; it's a rational rejection of the theorem's narrow definition of utility."**

  To understand why the behavioral literature isn't just "dancing around" the theorem but actually exposing its limitations, we have to look at what Good's Theorem assumes away. The theorem treats information as purely *instrumental*. It enters the utility function only insofar as it helps you select a better physical outcome (staying dry, investing wisely, treating a disease). It assumes the agent cares only about the final state of the world, not the path taken to get there.

  When we apply this to your cases, the theorem doesn't break; it simply reveals that it was never talking about the human experience in the first place.

  Take **Huntington's disease testing**. Good's Theorem applies if the test result allows you to take an action that improves your outcome. If there is no cure, the instrumental value of the information is near zero. But why is the value *negative*? Because humans derive utility from *beliefs*, not just outcomes. We consume "hope" as a good. If you don't know you have the gene, you can live in a state of optimistic uncertainty. If you learn you have it, that hope is destroyed. Good's Theorem defines utility over health states (Sick/Healthy); it does not define utility over belief states (Hopeful/Despairing). If you expand the utility function to include anticipatory emotions—a standard move in behavioral econ—the "cost" of information becomes real. Avoiding the test isn't irrational; it's utility maximization where the commodity being protected is peace of mind, not physical health.

  Consider **spoiler avoidance**. This is the clearest refutation of the theorem's applicability, not its math. In a narrative experience, uncertainty is the product. Knowing the ending destroys the value of the movie. Good's Theorem assumes information reveals the state of the world to help you navigate it. In entertainment, the "navigation" *is* the uncertainty. Here, information isn't a tool for optimization; it's a substitute that cannibalizes the good. A rational agent who enjoys suspense *should* avoid the spoiler. Good's Theorem would only call this irrational if it assumed the only value of the movie was knowing the plot summary at the end.

  Finally, the **insurance market collapse** (often associated with the Hirshleifer effect) is the most damning structural counterexample. Good's Theorem assumes the set of available actions remains fixed regardless of what you learn. In insurance markets, public information changes the *feasible* set of actions. If a genetic test becomes public before you buy insurance, the insurer will not cover you if you test positive. The information has transformed the game from one of risk-sharing to one of adverse selection. The information didn't just update your beliefs; it collapsed the market that allowed you to act on those beliefs. In this context, ignorance is not a cognitive failure; it is a precondition for the existence of the insurance contract itself.

  Your decision theorist friend is right that Good's Theorem proves information has non-negative *instrumental* value for a lone agent maximizing outcomes in a static world. But the "information avoidance" literature is studying agents who derive utility from uncertainty, face emotional costs from bad news, or operate in strategic environments where knowledge destroys risk-pooling.

  To call these behaviors "irrational" because they violate Good's Theorem is like calling a fish irrational for not climbing a tree because it violates the laws of terrestrial locomotion. The theorem describes a world where information is a lever. The real world is one where information is also a weight, a weapon, and sometimes, the very thing we are trying to enjoy.

  **The Verdict:**
  Good's Theorem is mathematically invulnerable but sociologically brittle. It correctly identifies that free information improves decision-making *capacity*, but it fails to account for the fact that humans often optimize for *well-being*, not just decision accuracy. When information reduces well-being without improving outcomes (Huntington's), destroys the product being consumed (spoilers), or collapses the market enabling action (insurance), avoidance is not a bias. It is the rational response to a theorem that left out the human being.
