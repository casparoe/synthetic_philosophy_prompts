answer: |-
  The note in Aris's pocket was crumpled, damp with sweat from a hand that didn't feel like his own. *Probability of bypass: 0.67,* it read. *Do not deviate.*

  He stood before the door. It was brushed steel, seamless, with a single biometric panel glowing a soft, waiting amber. There were no markings. No scratches. No way to tell if this was Unit A or Unit B.

  The corridor behind him was filled with the mnemonic gas, colorless and odorless. It didn't hurt; it just smoothed the edges off recent history. Walking down this hall was like walking through a dream where the background never changes. You could pass a landmark, turn a corner, and find the same landmark again, with no memory of the turning.

  Aris knew the layout because he had studied it upstairs, in the clean air of the control room, before the sedation. There were two units. Unit A was a trap; opening it would purge the data core he was here to steal. Unit B held the core. Passing both meant the vault would seal permanently, locking the data away forever. He had to open the second one. He had to skip the first.

  But the gas ensured that when he stood before a door, he could not know which one it was. To his mind, this moment was identical to any other moment he might stand before a door. He was the absent-minded driver at the interchange, seeing the exit sign but unable to recall if he had passed the last one.

  He looked at the panel. His finger hovered.

  Upstairs, the math had been clean. It was a simple optimization problem. If he decided beforehand to bypass the door with a probability of two-thirds, his expected success rate was maximized. It was a strategy of deliberate randomness. He had loaded a randomized algorithm into his wrist comp to tell him what to do, but the comp was locked away in the safe zone. The note was his only anchor to that rational, pre-corridor self.

  *Probability of bypass: 0.67.*

  But that was the Planning Aris. The Planning Aris was safe upstairs. The Planning Aris didn't have the smell of ozone in his nose or the hum of the ventilation vibrating in his teeth.

  The Action Aris, the one standing here now, looked at the amber light and felt a surge of certainty. *I'm here,* he thought. *If I was going to stop at the first door, wouldn't I have stopped? The fact that I am standing here, hesitating, suggests I might have already passed the first one. If this is the second door, and I bypass it, I lose everything.*

  The logic felt seductive. It was the logic of presence. *I am here, therefore this is likely the end.*

  He checked his watch. No help. The gas blurred time as well as sequence. Ten minutes or ten hours; the corridor swallowed both.

  He pulled the note out again. The paper was soft, disintegrating at the folds. *0.67.*

  If he followed the note, he was agreeing to be wrong one-third of the time. He was agreeing to open the trap sometimes, purely to keep the statistical integrity of the mission intact. It felt like a betrayal of his own survival instinct. Why would the rational plan require him to risk immediate failure?

  Because the risk wasn't immediate. The risk was structural.

  Aris closed his eyes. He tried to summon the face of the woman who had hired him, the one who waited in the van outside. She was part of the Plan. She wasn't part of the Moment. In the Moment, there was only the door and the hand.

  If he opened this door, and it was Unit A, the purge would trigger. He'd feel the heat, the alarm, the failure.
  If he walked past, and this was Unit B, the lockout would engage. He'd walk into the void, empty-handed.

  The Planning Self said: *Trust the distribution. You are not special. This moment is not unique. Treat it as one of two identical nodes.*
  The Action Self said: *But I am here. Now. The probability shifts when you update on existence. I am at a door. Isn't it more likely to be the second one?*

  That was the itch. The paradox wasn't in the math; it was in the skin. It was the feeling that the person who made the plan was a stranger, a ghost who didn't understand the weight of the present tense. The ghost said "wait." The body said "take."

  Aris looked at the biometric panel. The amber light pulsed, slow and rhythmic. Like a heartbeat. Like a countdown.

  He thought about the nature of the gas. It didn't just erase memory; it erased context. It forced him to live in a perpetual present. In a perpetual present, there is no future to optimize for, only the immediate choice. To follow the note was to believe in a timeline he couldn't perceive. It was an act of faith in a self that no longer existed.

  He took a breath. The air tasted of metal and static.

  He reached into his pocket and pulled out a coin. It was an old credit token, worn smooth. The Plan didn't call for a coin. The Plan called for a pre-calculated randomization. But the note was just paper, and the paper was wet.

  He needed to be the machine. He needed to be the driver who doesn't know the exit.

  He flipped the token. It caught the light, spinning, a blur of silver against the gray steel. He didn't look at the door while it was in the air. He looked at the coin. The coin was the only thing that existed outside the corridor. The coin was the Planning Self, frozen in metal.

  It landed on the back of his hand. He slapped his other hand over it.

  For a second, he didn't look. He felt the weight of the choice pressing against his palm. He thought about the woman in the van. He thought about the ghost upstairs who wrote the note. He thought about the man standing here, who just wanted to go home.

  If he opened the door, he might die. If he walked, he might fail.
  The math said walk.
  The gut said open.

  He lifted his hand.

  The token showed heads. *Bypass.*

  Aris stared at the silver disc. A cold sweat broke across his neck. The number on the note burned in his mind. *0.67.* Heads was close enough. It was the will of the Plan.

  He slipped the coin back into his pocket. He turned his back on the door.

  He walked forward into the gas, into the identical hallway, toward the next identical door. He didn't look back to see if the light behind him changed. He didn't look forward to see if the next door looked different. He just walked, carrying the heavy, hollow certainty that he had made the right choice for the wrong reasons, or the wrong choice for the right ones, and that there was no way to ever know the difference.

  The second door appeared out of the haze. It looked exactly like the first.
  Aris stopped.
  He put his hand on the panel.
  This time, there was no note. There was no coin. There was only the memory of the choice he had just made, fading fast, like footprints in water.
