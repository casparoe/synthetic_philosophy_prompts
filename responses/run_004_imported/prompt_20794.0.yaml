answer: |-
  Your intuition is spot-on, and your friend's claim contains a significant misunderstanding of Woodward's project—or at least a very controversial reading of it that most philosophers of science would reject.

  While Woodward's interventionist theory is indeed a major improvement over Lewis's in several respects, it does **not** dispense with unactualized possibilities, nor is it a "non-modal" theory. In fact, your skepticism about continental drift and supernovae hits on exactly why Woodward's account remains deeply modal.

  Here is a breakdown of where your friend's claim goes astray and how Woodward actually handles the cases you mentioned.

  ### 1. Woodward's Theory is Explicitly Counterfactual
  David Lewis's theory defines causation in terms of counterfactual dependence (if $C$ had not occurred, $E$ would not have occurred). Woodward's theory defines causation in terms of **invariance under intervention**.

  However, an "intervention" in Woodward's sense is defined counterfactually. To say that $X$ causes $Y$ is to say that there is a possible intervention on $X$ such that, **if** that intervention were to occur, $Y$ would change.

  In his seminal book *Making Things Happen* (2003), Woodward is clear that his account is modal. He writes that causal claims imply claims about what *would* happen under certain conditions. He does not eliminate unactualized possibilities; rather, he attempts to provide a more precise semantics for them than Lewis's "similarity between possible worlds." Woodward replaces Lewis's vague notion of "closest possible world" with the rigorous machinery of **structural equation models**, but the underlying logic remains: "If things were different in this specific way, the outcome would be different."

  ### 2. Interventions Are Not Human Actions
  A common source of confusion (which your friend may have fallen into) is thinking that an "intervention" requires a human agent to actually perform a manipulation. Woodward explicitly rejects this.

  For Woodward, an intervention is a theoretical construct, an **intervention variable ($I$)**. For $I$ to be an intervention on $X$ with respect to $Y$, it must satisfy specific causal conditions (e.g., $I$ causes $X$, $I$ does not directly cause $Y$, $I$ is uncorrelated with other causes of $Y$).

  Crucially, **the intervention need not be physically possible for humans to perform.** It only needs to be *conceptually* or *logically* possible within the model.
  *   **Continental Drift:** We cannot intervene on tectonic plates. However, we can construct a geological model where the initial position of the plates is a variable. We can then ask: "If the initial position *had been* different (satisfying the conditions of an intervention), would the coastline *be* different?" If the model supports this counterfactual, the causal claim holds.
  *   **Supernovae:** We cannot intervene on a star. But we can model the core temperature as a variable. We ask: "If the core temperature *had been* lower (via a process that counts as an intervention), would the star *have failed* to go supernova?"

  ### 3. The Reintroduction of Unactualized Possibilities
  This is where your doubt is philosophically astute. By allowing **hypothetical interventions**, Woodward quietly reintroduces the very modal metaphysics your friend claims he avoids.

  To evaluate the claim "If the core temperature had been lower, the star would not have exploded," we need a way to determine the truth value of that counterfactual.
  *   **Lewis** uses a metric of similarity between possible worlds.
  *   **Woodward** uses structural equations and invariance.

  But structural equations are themselves modal devices. They don't just describe what *did* happen; they describe what *would* happen under various conditions. To say a relationship is "invariant" is to say it holds across a range of **possible** changes, not just actual ones.

  Therefore, Woodward does not escape unactualized possibilities. He simply shifts the burden from "Which possible world is closest?" to "Which structural equations correctly represent the system's behavior under hypothetical changes?" Both require modal resources.

  ### 4. Why Your Friend Might Think This (and Why It's Tempting)
  There is a charitable way to interpret your friend's claim, even if it is technically incorrect. Woodward's goal is **naturalism**. He wants to tie causation to scientific practice (experimentation, modeling, manipulation) rather than metaphysical speculation.

  *   **Lewis** is often criticized for relying on a "mysterious" metaphysics of possible worlds that seems disconnected from empirical science.
  *   **Woodward** grounds causation in **variables and models** that scientists actually use.

  Your friend might be conflating "less metaphysically spooky" with "non-modal." Woodward provides a better *epistemology* for causation (how we find out about causes via experiments and models), but his *ontology* (what causation *is*) remains counterfactual. He improves the *tools* we use to evaluate possibilities, but he doesn't get rid of the possibilities themselves.

  ### 5. Conclusion: You Win the Argument
  Your objection regarding continental drift and supernovae is the standard objection to any theory that tries to ground causation strictly in actual manipulation. Woodward's solution is to generalize "manipulation" to "hypothetical intervention."

  But once you admit hypothetical interventions, you admit unactualized possibilities.
  *   If the friend claims Woodward is **non-modal**, she is incorrect.
  *   If she claims Woodward avoids Lewis's **specific metaphysics of world-similarity**, she is correct.
  *   If she claims Woodward avoids **unactualized possibilities altogether**, she is incorrect.

  Woodward's theory is best understood not as a non-modal alternative to Lewis, but as a **rival modal theory**. It argues that Lewis got the *structure* of counterfactuals wrong, not that we should stop using them. So, you are right to be skeptical: without unactualized possibilities, Woodward's account cannot handle the very cases (geology, astrophysics, history) that make causation interesting.

  **Recommendation:** If you want to press this, ask your friend to explain the truth conditions for a causal claim about the Big Bang without referencing what *would* have happened if initial conditions *had been* different. If she can't do that without modal language, Woodward is still in the business of trading in unactualized possibilities.
