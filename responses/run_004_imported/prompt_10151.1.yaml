answer: |-
  Here is a trait that mirrors the "pendentive" problem perfectly, one that should feel visceral to two biologists who know their morphology but tired of the standard textbook examples.

  ### The Trait: **Mammalian Cranial Suture Interdigitation**

  Specifically, the fractal complexity of the zig-zag joints between the bones of the skull vault (the parietal and frontal bones).

  ### Level 1: The "Spandrel" (The Necessary Gap)
  This is the Gouldian baseline. Mammals are selected for large brains relative to body size. A large brain requires a large skull. But a mammal must be born (pass through the pelvis) and the brain must grow rapidly post-natally. Therefore, the skull cannot be a single fused box at birth; it *must* be composed of separate plates with flexible gaps between them to allow for expansion.
  *   **The Argument:** The existence of the suture (the gap) is a structural necessity, a byproduct of the "arch" (the expanding brain). If you select for big brains, you get gaps. You can't have the arch without the spandrel. Marguerite's opening move.

  ### Level 2: The "Pendentive" (The Specific Form)
  Here is where the Dennettian critique kicks in. While the *existence* of a gap is necessary, the **geometry** of that gap is not.
  *   **The Alternative (The Squinch):** Look at most reptiles or fish. Their skull plates often overlap in simple, smooth shingles (lap joints). Or, in some cases, they remain separated by wide fontanelles that never close.
  *   **The Mammalian Choice (The Pendentive):** Mammals almost universally evolved highly complex, interdigitated, fractal-like zig-zags. The bone edges look like puzzle pieces or teeth locking together.
  *   **The Ambiguity:**
      *   **Owen (Adaptationist):** The interdigitation isn't just a gap; it's a mechanism. The zig-zag increases surface area for osteoblasts to knit the bone faster when growth stops. It also dissipates mechanical stress from chewing (mastication) so the skull doesn't shear apart. The specific *shape* is tuned by selection. It's an adaptation for structural integrity.
      *   **Marguerite (Constraint/Spandrel):** The zig-zag is a physical inevitability of *growth rate*, not a selected shape. When two mineralization fronts advance rapidly toward each other (driven by the brain's expansion pressure), they become unstable. It's a reaction-diffusion system. If you grow bone fast, you *get* instability patterns (fingering). The "zig-zag" is just what rapid growth looks like physically. It's a byproduct of selecting for brain size, not a selected trait itself.

  ### The "Dennett" Twist (The Causal Fusion)
  This is the texture you want for the scene. The architectural critique of San Marco was that the builders *chose* pendentives over squinches, implying agency/design. In biology, the "choice" is genetic.

  The genes that regulate brain growth rate (e.g., *FGF*, *BMP* signaling pathways) are the *same* genes that regulate osteoblast proliferation at the suture margin.
  *   If you select for a bigger brain, you upregulate the growth signal.
  *   Upregulating the growth signal *automatically* creates the unstable mineralization front that causes the zig-zag.
  *   **The Trap:** You cannot select for "Big Brain" without selecting for "Zig-Zag Suture." They are developmentally fused.
  *   **Owen's Counter:** "But if the zig-zag was useless, selection would have found a way to dampen the instability while keeping the growth rate. The fact that the zig-zag is conserved across all mammals means it's doing work (stress dissipation)."
  *   **Marguerite's Counter:** "There was no 'way.' The physics of calcium deposition under that specific pressure gradient *is* the zig-zag. To change the shape, you'd have to change the chemistry, which would slow the brain. The 'function' is post-hoc rationalization of a physical constraint."

  ### The Test That Would Settle It
  To distinguish between Owen's "Stress Adaptation" and Marguerite's "Growth Byproduct," you would need to **decouple the growth rate from the suture geometry.**

  You would need to engineer an organism (or find a natural mutant) where the brain grows at the high mammalian rate (creating the pressure), but the bone mineralizes with the stability of a reptilian smooth suture.
  *   **Prediction (Owen):** The skull would fail under chewing stress or fracture during birth. (Proving the zig-zag was adaptive/necessary).
  *   **Prediction (Marguerite):** The skull would form perfectly fine, provided the material properties of the bone itself are strong enough. The zig-zag was just noise. (Proving the zig-zag was a spandrel).

  ### Why Nobody Has Run This Test (The Impossible Variable)
  You can't run this test because **mechanotransduction creates a causal loop.**

  Bone growth is not just genetic; it is responsive to mechanical load (Wolff's Law). The pressure of the brain *causes* the bone to grow, and the resistance of the bone *signals* the brain to stop.
  1.  If you genetically smooth the suture, you change the mechanical resistance profile.
  2.  Changing the resistance profile alters the brain's growth trajectory (the brain stops growing earlier or deforms).
  3.  If the brain deforms, the organism dies or is selected against.

  You cannot isolate the variable "Suture Geometry" from the variable "Brain Expansion Pressure" because they are in a continuous feedback loop mediated by the same cellular machinery. The "choice" of the pendentive is written in the same ink as the "choice" of the arch.

  ### Why This Works for Your Scene
  *   **It's Physical:** They can touch their own skulls during the argument. It grounds the high-theory debate in flesh.
  *   **It's Historically Loaded:** Sutures were central to 19th-century comparative anatomy (the very roots of their field), so it fits two old-school PhDs.
  *   **It's Unresolvable:** It captures the exact frustration of the Spandrels paper. Is the trait *for* something, or is it just what happens when you build something else?
  *   **It Avoids the Clichés:** It's not the chin (too human-specific), not the panda (too ecological), and not the eye (too overused). It's structural, developmental, and deeply ambiguous.

  **Dialogue Hook:**
  Marguerite could press her finger to her temple and say, *"You think this zig-zag is here to hold my skull together, Owen? It's here because my brain got too big too fast for the calcium to settle in a straight line. It's crystallization noise."*
  And Owen replies, *"Noise doesn't survive sixty million years of predation. Noise gets eaten. Structure stays."*
  And the truth is, they're both describing the same physical event, just assigning different causal weights to the genes vs. the physics.
