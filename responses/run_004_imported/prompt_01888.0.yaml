answer: |-
  This is a classic epistemological problem (how we know what we know) wrapped in a very stressful family situation. To answer your specific question: **Yes, your sister is doing something logically screwy.**

  Her friend is using a harsh term ("willful blindness"), but logically speaking, the friend is correct. Your sister is confusing **faith** (a relational stance) with **fact** (an empirical stance).

  Here is the breakdown of why her reasoning doesn't hold up, where the line is drawn, and why she is likely doing it.

  ### 1. The Logical Flaw: Immunity to Falsification
  In logic and science, for a belief to be valid, it must be **falsifiable**. This means there must be some conceivable piece of evidence that could prove the belief wrong.

  *   **Sister's Position:** "He would never hide money."
  *   **The Test:** Bank statements showing hidden money.
  *   **Sister's Reaction:** "The statements must be wrong because I know he wouldn't do it."

  By deciding in advance that *no evidence* could ever prove her wrong, she has removed her belief from the realm of reality. She has made her belief an **axiom** (a self-evident truth like 2+2=4) rather than a **hypothesis** (a theory based on observation).

  Human behavior is not an axiom. People lie, even good people. Therefore, her belief is a hypothesis. When a hypothesis conflicts with data, you must either update the hypothesis or prove the data is flawed. She is refusing to do either; she is simply discarding the data because it makes her uncomfortable.

  ### 2. The "Unicorn Test" (When *can* you ignore evidence?)
  Your sister argues that "really knowing something" gives you license to wave off evidence. Sometimes, this is true.

  *   **Example:** If someone shows you a photo of a unicorn in her backyard, you are justified in waving it off without investigating. Why? Because your prior knowledge (unicorns don't exist) is so strong that the probability of a fake photo is higher than the probability of a mythical beast appearing.
  *   **The Marriage Context:** Does your sister have "unicorn-level" certainty about her husband's finances? Unless she has omniscient access to his thoughts and actions, the answer is no. Hiding money is a common, documented human behavior. It is not mythical.

  Therefore, she does not have the license to wave off the evidence. The "prior probability" of him hiding money is not zero, so the evidence must be weighed, not dismissed.

  ### 3. The Psychological Reality: Motivated Reasoning
  Logically, she is wrong. But psychologically, she is doing something very human called **Motivated Reasoning**.

  She isn't trying to find the truth; she is trying to preserve a specific emotional state (security in her marriage).
  *   **The Cost of Being Wrong:** If she looks at the statements line-by-line and confirms the money is hidden, she has to confront betrayal, potential divorce, financial ruin, or a shattered self-image.
  *   **The Cost of Ignoring:** If she ignores it, she maintains peace of mind *for now*.

  Her brain is subconsciously calculating that the pain of the truth outweighs the risk of the lie. She calls it "applying what she knows to be true," but it is actually **belief perseverance**. She is protecting the belief, not investigating the reality.

  ### 4. Is it "Willful Blindness"?
  Legally and psychologically, **yes.**
  Willful blindness (or conscious avoidance) occurs when a person suspects a fact is true but deliberately avoids confirming it to maintain "plausible deniability."

  By refusing to look at the statements "line by line," she is ensuring that she cannot be held responsible for knowing the truth. If it turns out he *was* hiding money, she can say, "I didn't know for sure, I trusted him." It is a defense mechanism.

  ### 5. The Verdict
  **The Friend's Argument:** Logically sound. Evidence must be examined, especially when the stakes are high.
  **The Sister's Argument:** Logically flawed. She is treating a probabilistic event (human honesty) as a certainty, which prevents her from updating her understanding of reality.

  **However, a word of caution for you:**
  While the sister is logically in the wrong, the friend might be socially overstepping. In marriages, "truth" is sometimes negotiated. Some couples operate on a "don't ask, don't tell" policy regarding finances, or one partner takes the lead.

  If you get involved, you risk becoming the messenger who shattered her peace. If the husband *is* hiding money, your sister likely senses it on some level and is actively suppressing it to survive. Forcing her to look before she is ready could break her trust in *you*, not just him.

  **Summary:** Your sister is using logic to protect an emotion. It is not sound reasoning, but it is a very common human survival tactic. She is not "knowing"; she is "choosing to believe." There is a difference.
