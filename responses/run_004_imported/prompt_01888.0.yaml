      *   *Psychological Angle:* It's likely self-protection. Admitting the evidence means admitting the marriage might be in trouble. That's painful.
      *   *The Friend's Label:* "Willful blindness" is accurate.
      *   *Advice for the User:* Don't get in the middle. This is dangerous territory.

  8.  **Refining the Tone:**
