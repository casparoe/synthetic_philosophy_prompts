  1.  **Analyze the Situation:**
      *   **The User:** Told Friend B about Friend A's breakup. Friend A is now angry/giving silent treatment because she feels betrayed ("not trustworthy").
      *   **Friend A (The Angry One):** Gossips about everyone, including things the User told her in confidence. She claims her behavior is irrelevant to the User's mistake.
      *   **Friend B (The Recipient):** Not much info, but presumably someone Friend A doesn't want to know yet.
      *   **The Conflict:** User feels it's hypocritical for Friend A to demand secrecy when she doesn't provide it. Friend A feels the principle of confidentiality is absolute regardless of her own behavior.
      *   **The Question:** Is Friend A right that her gossiping is beside the point, or does her hypocrisy matter?

  2.  **Deconstruct the Ethical/Social Dynamics:**
      *   **Confidentiality:** Generally, when someone shares personal news (like a breakup), there's an implicit or explicit expectation of privacy. Violating that *is* a breach of trust.
      *   **Hypocrisy:** Friend A is holding the User to a standard she doesn't meet herself. This creates resentment and undermines her moral authority.
      *   **The "Two Wrongs" Argument:** Friend A says, "I did something bad, but that doesn't make your bad thing okay." Logically, she's right (two wrongs don't make a right). Emotionally/Relationally, it's complicated.
      *   **Trust Dynamics:** Trust is reciprocal. If one party consistently breaks trust, the other party is less obligated to maintain high levels of confidentiality *for* them, though basic decency usually still applies.
      *   **The Breakup Context:** Breakups are sensitive. Some people want it public immediately; others want control over the narrative. Friend A clearly wanted control.

  3.  **Evaluate Friend A's Stance:**
