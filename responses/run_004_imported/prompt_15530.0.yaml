answer: |-
  This is a classic "two wrongs don't make a right" scenario, but friendship dynamics are rarely that black and white. You are stuck between **moral accountability** (you shared a secret) and **relational reciprocity** (she doesn't keep your secrets).

  Here is the breakdown of who is right, who is wrong, and why you're both talking past each other.

  ### 1. On the specific act: She is technically right.
  When someone goes through a breakup, they usually want control over who knows and when. By telling another friend, you took that control away from her. Even if you didn't mean harm, you violated her privacy.

  When she says, *"It doesn't matter what I do, you still did something shitty,"* she is logically correct regarding **this specific incident.** Her past behavior doesn't erase your current action. If you stole a car, you couldn't argue in court, "But Officer, *he* steals cars too!" It wouldn't hold up. In this specific vacuum, you broke a confidence.

  ### 2. On the friendship dynamic: You are right.
  Trust is a two-way street. A friendship where one person demands absolute confidentiality but routinely leaks the other person's secrets is **unbalanced and unsafe.**

  Her hypocrisy *does* matter, just not in the way you're trying to use it. It matters because it explains *why* you feel so resentful about her reaction. It matters because it signals that she views friendship rules as "rules for thee, but not for me." It matters because it suggests she values control over your actions more than she values mutual respect.

  ### 3. The "Silent Treatment" is the real problem.
  While you did share private info, her punishment (the silent treatment) is disproportionate and immature. It is a form of emotional manipulation designed to make you beg for forgiveness rather than have a mature conversation about boundaries.

  A secure friend would say: *"I'm really hurt you told people. I needed to be the one to share that news. I need some time to cool off, but we need to talk about this."*
  Giving you the silent treatment while lecturing you on trustworthiness is ironic, given that she clearly struggles with trustworthy behavior herself.

  ### So, is her gossiping "beside the point"?
  **Yes and No.**

  *   **Yes,** it is beside the point regarding your apology. You owe her an apology for breaking her confidence, regardless of her track record. Using her flaws to defend yours invalidates your apology and makes it seem like you aren't actually sorry.
  *   **No,** it is not beside the point regarding the future of the friendship. It is highly relevant to whether you should trust *her* with sensitive information again, and whether this friendship is healthy for you.

  ### How to handle this
  You need to separate the **immediate repair** from the **long-term boundary.**

  **Step 1: Own the specific mistake (for now).**
  If you want to save the friendship, you have to swallow the pride regarding her hypocrisy for a moment. Send a message that validates her feelings without bringing up her gossiping.
  *   *"I've been thinking about this, and you're right. I shouldn't have shared that news before you were ready. I violated your trust and I'm sorry I took that control away from you."*

  **Step 2: Wait for the silence to break.**
  If she continues the silent treatment after a genuine apology, that tells you a lot about her capacity for conflict resolution.

  **Step 3: Re-evaluate the "Vault."**
  Once things cool down, you need to internally accept that **she is not a safe person for secrets.** Do not tell her confidential things anymore. Not as punishment, but as self-protection.
  *   If she asks why you aren't sharing things, you can calmly say: *"I value our friendship, but I've noticed that things I tell you in confidence tend to get shared. I'm just keeping some things to myself to protect my own privacy."*

  ### The Verdict
  She is right that you messed up by telling. But she is wrong to act like she holds the moral high ground on "trustworthiness."

  Apologize for the leak because it was the decent thing to do. But do not accept the label of being the "untrustworthy one" in this friendship. That is a projection on her part. Fix your mistake, but don't ignore the pattern of her behavior.
