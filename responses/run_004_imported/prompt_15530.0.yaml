      *   *Relationally:* She is wrong to act like her own behavior doesn't impact the dynamic. Trust is a two-way street. Her "moral high ground" is shaky.
      *   *The Silent Treatment:* This is a punitive, immature communication style. It escalates conflict rather than resolving it.

  4.  **Evaluate the User's Stance:**
