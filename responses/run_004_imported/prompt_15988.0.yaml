      *   *Crucial Distinction:* Longtermist calculations usually involve *positive* utilities (lives saved, welfare gained). The Pasadena game relies heavily on *negative* utilities (losses) alternating with positive ones to create conditional convergence.
      *   *The "St. Petersburg" vs. "Pasadena" distinction:* St. Petersburg has infinite EV (diverges to $+\infty$). Pasadena has *undefined* EV (oscillates/rearranges). Longtermism usually worries about St. Petersburg-style infinity (Pascal's Mugging), but the user is asking about Pasadena-style *undefinedness*.

