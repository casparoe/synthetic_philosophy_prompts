answer: |-
  A Kripkean and a LessWronger are watching a sealed envelope that supposedly contains a prediction.

  **Kripkean:** "I know the prediction inside is 'Yes'. If I open it and it says 'No', I'll know the printer malfunctioned."

  **LessWronger:** "So you're assigning non-zero probability to the envelope saying 'No'?"

  **Kripkean:** "Only as misleading evidence. My credence in 'Yes' remains 1. That's the Dogmatism Paradox: I'm entitled to discount counter-evidence because I already know the truth."

  **LessWronger:** "But that violates Conservation of Expected Evidence. You can't anticipate seeing 'No' without your current credence reflecting that expectation."

  **Kripkean:** "But I won't update *when* I see it! I'll just dismiss it."

  **LessWronger:** "You don't need to update when you see it. You updated the moment you admitted you might need to dismiss it."

  **Kripkean:** "How?"

  **LessWronger:** "If you truly knew it was 'Yes', the probability of seeing 'No' would be zero. You wouldn't need a policy for it. The fact that you have a plan for 'No' means you've already updated on the possibility of 'No'."

  **Kripkean:** "But I was certain until I opened it!"

  **LessWronger:** "No. You were certain until you said 'If'."
