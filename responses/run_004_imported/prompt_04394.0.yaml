          *   *World-to-Mind direction of fit:* Perceptions tell us how the world is; emotions often try to change the world (motivation).
          *   *Phenomenology:* The fear feels like *hers*, the illusion feels like a trick of the eye.
      *   **Section 4: The Feeling Theory (James-Lange).**
          *   Focus on the body.
          *   How it interprets the bridge: The body reacts (evolutionary leftover). The mind interprets the reaction.
          *   Pros/Cons for the narrative: Great for describing symptoms, bad for explaining *aboutness*.
      *   **Conclusion/Narrative Advice:** How to use this. The tension *is* the story. Don't solve it; inhabit the gap.

  4.  **Refining the Tone:**
      *   Needs to be "technically careful" but accessible to a novelist.
      *   Avoid oversimplification. Use terms like "propositional content," "direction of fit," "modularity."
      *   Ensure the distinction between *Judgment* (active endorsement) and *Perception* (passive appearing) is clear.
      *   Make sure the "Recalcitrant" aspect is central.

  5.  **Self-Correction/Review during drafting:**
