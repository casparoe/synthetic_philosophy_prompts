prompt: |-
  So in my early modern science & religion seminar this week we went down a total rabbit hole on Newton's secret theology and I'm still kind of reeling from it. Everyone learns him as the gravity/calculus guy, but apparently for decades he privately believed the doctrine of the Trinity was basically a corruption that Athanasius and the Nicene crowd forced onto the church in the 4th century, and that the "real" original Christianity was closer to what Arius taught (Christ as created and subordinate to the Father, not co-eternal with him). We looked at bits of the "Two Notable Corruptions of Scripture" manuscript he sent to Locke around 1690, arguing that 1 John 5:7 and 1 Timothy 3:16 were basically later scribal insertions/tweaks to prop up trinitarian doctrine (something about a couple pen strokes turning a Greek abbreviation for "who" into one for "God," which is apparently a whole famous case in textual criticism circles) - he wanted it published anonymously in Holland and then pulled it back at the last second out of nerves. My professor kept hammering on the fact that he was doing all this while literally being a fellow of TRINITY College, which, yeah. My roommate (not even in the class) thought that detail was hilarious when I told her. Meanwhile he's also off calculating from Daniel and Revelation that the apocalypse can't happen before 2060, and his own eventual successor in the Lucasian chair, Whiston, gets tossed out of Cambridge for saying basically the same Arian stuff Newton believed, just out loud instead of in a locked drawer.

  For the creative option on this week's response paper (my prof said we could do a short story instead of the usual analysis) I want to write one scene set late at night in Newton's rooms, right around the point where he's calling back the Corruptions manuscript before Le Clerc can print it - him caught between how scared he is of being outed as a heretic and how sure he is that he's the one person who's actually recovered the true ancient religion underneath all the institutional corruption. Could you write that scene for me as a self-contained short story, third person, maybe 600-800 words? I really want the theology to be substantively right rather than just vaguely gesturing at "newton had some unorthodox beliefs" - my professor will 100% clock it if its generic. Doesn't need to be historically airtight in every micro-detail since it's fiction, but the actual content of what he believed and why needs to be real.
