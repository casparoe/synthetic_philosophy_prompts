answer: |-
  The candle guttered, casting long, wavering shadows against the stone walls of his chambers at Trinity College. Isaac Newton dipped his quill, the ink black as the Cambridge night outside. On the desk lay the manuscript, *Two Notable Corruptions of Scripture*, alongside a half-written letter to John Locke.

  He stared at the page where he had dismantled the Trinity not with philosophy, but with philology. It was a surgeon's work. He traced the line of argument regarding 1 John 5:7. The Johannine Comma. The Trinity rested on it, yet it was absent from the old Greek copies. A later insertion. A forgery to prop up a metaphysical error.

  Then there was 1 Timothy 3:16. "God was manifest in the flesh." Newton knew the truth of the scribal error. A single stroke of the pen. In the uncial script, *OS* (who) became *ΘS* (God). A mere abbreviation tweaked by a careless copyist or a deliberate schemer, and suddenly the Son was equated with the Father. The whole edifice of Nicene orthodoxy balanced on a slip of the reed pen.

  He dipped the quill again. The letter to Locke needed to be firm. *Pray suppress the copy.* Le Clerc was ready to print it in Holland. The truth was ready to breathe. But Newton's hand hovered.

  He looked up at the dark window, seeing his own reflection superimposed over the night. Fellow of Trinity College. Lucasian Professor. The irony was a bitter taste in his mouth. He occupied a college named for the very doctrine he knew to be a corruption. Athanasius had hijacked the primitive faith, imposing the heresy of consubstantiality where the Scriptures offered only subordination. The Father alone was God Almighty; Christ was the created Logos, the mediator, distinct and subordinate. It was the religion of the Apostles, buried under four centuries of institutional decay.

  If he published, he would not be hailed as a reformer. He would be a heretic. The consequences rippled outward from his mind. Loss of position. Exclusion from the Church. Perhaps worse. The civil magistrate did not look kindly on those who unravelled the theological glue of the state. He thought of William Whiston, though the man was not yet his successor. He could foresee the type: brilliant, blunt, doomed to speak the quiet parts aloud and suffer for it. Newton would not be Whiston.

  He looked to the side of the desk, where other papers were stacked—calculations on Daniel and Revelation. The numbers offered a different kind of solace. Prophecy was mathematics applied to time. He had found patterns, endpoints. The world would not end tomorrow. There was time yet. But revealing the corruption of the Church was dangerous now.

  "The truth is not for this age," he whispered to the empty room.

  He resumed writing the letter to Locke. He framed it as caution, as a desire for further verification. But the real reason was fear. Not fear of being wrong—he possessed a terrifying certainty about his theology—but fear of being right in a world committed to the lie. He wanted the primitive religion restored, but he wanted to keep his head.

  He blotting the ink, the sand scattering like dust. He folded the letter, the wax seal ready. He was the guardian of a secret Christianity, a lone witness to the true hierarchy of Heaven while sitting within the walls of Trinity. He pressed the signet ring into the warm wax. The flame flickered and died, leaving him in the dark, the manuscript locked away once more.
