answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a software engineer, and I've had the privilege of being [Bride]'s friend for about [Number] years.

  Our friendship started in a philosophy class back in college. I have a confession to make: I remember almost nothing about the syllabus. I think there was a Kant unit? Maybe some Hegel? But I remember [Bride]. I remember her arguing with the professor about the nature of truth while I was mostly arguing with my alarm clock about the nature of waking up. She went on to get a PhD and become a brilliant teacher. I went on to write code. But that class gave me something better than a grade; it gave me my oldest friend.

  Now, when [Bride] asked me to give this toast, she gave me some specific instructions. She said, and I quote, "If you mention fate, soulmates, or say we were 'meant to be,' I will visibly wince."

  For half the room, that sounds like a strange request for a wedding. But for the other half—specifically the people from her department—that is a rigorous philosophical stance. [Bride] has built her career on the idea that truth isn't something you find lying around under a rock. It's something you make. Language isn't a mirror reflecting reality; it's a tool we use to build a life together.

  And honestly, as an engineer, that makes perfect sense to me. In my line of work, nothing is "meant to be." Software doesn't work by fate. It works because people sat down, collaborated, argued, tested, and built it until it held up under pressure.

  And that is what I see when I look at [Bride] and [Groom].

  I don't see two people who simply discovered a pre-existing perfect fit. I see two people who picked up their tools and decided to construct something beautiful. There is a romance in discovery, certainly. But there is a deeper, more durable romance in *creation*.

  [Bride] has a concept she calls a "final vocabulary." It's the set of words we use to describe what matters most to us. Her point is that this vocabulary isn't fixed. We can revise it. We can edit it. And I think the most profound commitment you can make to another person isn't promising that you'll never change. It's promising that when the old words stop working, you'll sit down together and write new ones.

  To [Bride]'s family and [Groom]'s family: I know this might sound less like a fairy tale and more like a project plan. But please believe me when I say that this is the sturdiest kind of love there is. A love based on fate is passive; it happens *to* you. A love based on building is active. It happens *because* of you. It means that when things get hard, you don't look to the stars to see if you're still aligned. You look at each other, and you get to work.

  And to my friends in the Philosophy Department: I know I'm simplifying the contingency of selfhood for the sake of a punchline. I promise I'm not trying to win any arguments against the correspondence theory of truth tonight. But I will say this: If truth is made, then the truth of this marriage is being made right now, in the choices they make every day to prioritize each other.

  [Groom], you have stepped into a life with a woman who believes that we create our own meaning. That means you don't just get to love her; you get to help her write the story. It means you are not just her partner in life, but her co-author.

  So, I'd like to propose a toast.

  To [Bride] and [Groom]. May your tools be strong. May your vocabulary always be large enough to hold your joy and your challenges. And may you never stop building, revising, and creating a truth that belongs entirely to the two of you.

  To the happy couple.
