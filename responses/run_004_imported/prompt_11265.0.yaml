  6.  **Refining the Philosophy (Rorty Check):**
      *   Rorty emphasizes *solidarity* and *conversation*. Marriage is a continuous conversation.
      *   "Final Vocabulary" is usually about the *limits* of justification, but in a wedding context, it can be framed positively as "the shared language we commit to refining."
