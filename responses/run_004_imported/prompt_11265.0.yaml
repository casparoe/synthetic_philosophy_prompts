          *   "Final Vocabulary" (the words we use to describe what matters, which are revisable, not fixed).
          *   Avoid: "Soulmates," "Fate," "Meant for each other," "Truth as correspondence/discovery."
      *   **Audience:** Mixed. Half philosophy colleagues (will recognize the references), half family/laypeople (need to understand and be moved).
      *   **Tone:** Warm, funny, not a lecture, honest, positive.
      *   **Length:** 4-5 minutes read aloud (approx. 600-750 words at a moderate pace).
      *   **Goal:** Describe the couple's relationship in a way that aligns with her worldview (building/making meaning together) without alienating the non-philosophers.

  2.  **Deconstruct the Philosophy for the Toast:**
      *   *Rorty's Pragmatism:* Instead of saying "They found the truth about love," say "They are building a life together." Instead of "They were destined," say "They chose to work on this."
      *   *Final Vocabulary:* This is the tricky part. Rorty defines it as the set of words we use to justify our actions and lives. We can't argue *outside* of it, but we can change it over time. In a wedding context, this translates to: "They are writing their own story/terms of engagement, not following a script."
      *   *The "Mirror" vs. "Tool":* Love isn't a reflection of a cosmic order; it's a tool they use to navigate the world together.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the friendship, the origin story (the philosophy class), and the contrast in careers (code vs. philosophy). Establish the humor about knowing *her* but not the *material*.
      *   **The Philosophical Pivot:** Address the elephant in the room. She hates the "fate/soulmate" talk. Acknowledge this gently. Explain *why* without getting bogged down in jargon.
      *   **The Core Metaphor (Building/Coding):** As a software engineer, I can bridge the gap. Code is built, not found. Relationships are built, not found. This resonates with Rorty (tools) and the lay audience (construction/effort).
      *   **Addressing the "Final Vocabulary":** Use the term but define it simply. It's the language of their relationship. It's revisable. They write it together.
      *   **Addressing the Groom:** He needs to be part of this "building." He's the collaborator.
      *   **The Colleagues:** A subtle nod to the "correspondence theory of truth" debate. A wink to the department.
      *   **The Family:** Reassure them that "building" is just as romantic as "fate." It implies commitment.
      *   **Closing:** A toast to the future work/building.

  4.  **Drafting - Iteration 1 (Mental Outline):**
