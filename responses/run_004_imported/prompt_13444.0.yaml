answer: |-
  **MEMORANDUM**

  **TO:** Model Risk Committee
  **FROM:** Engineering Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Policy for Thin-File Model Uncertainty

  **Context**
  Our default-risk model exhibits significant volatility for "thin-file" applicants, with predicted probabilities of default (PD) ranging from 4% to 22% across defensible bootstrap samples. We must decide how to translate this uncertainty into approve/deny/refer actions without introducing unfair inconsistency.

  **Recommendation: Robust Interval Policy**
  I recommend we adopt **Member A's proposal** to report ranges, but with a specific decision logic designed to address **Member B's inconsistency objection**.

  For thin-file applicants, we will replace the single point estimate with a 95% Confidence Interval (CI). Decisions will be routed as follows, assuming a risk cutoff of $C$ (e.g., 10% PD):

  1.  **Auto-Approve:** Only if the **Upper Bound** of the CI is $< C$.
      *   *Rationale:* We approve only if the "worst-case" model view is still acceptable.
  2.  **Auto-Deny:** Only if the **Lower Bound** of the CI is $> C$.
      *   *Rationale:* We deny only if the "best-case" model view is still too risky.
  3.  **Manual Review:** If the CI **straddles** $C$.
      *   *Rationale:* The model cannot distinguish risk with sufficient certainty; human judgment is required.

  **Addressing the Inconsistency Objection**
  Member B correctly notes that if the model range shifts week-to-week, identical applicants could face different outcomes. However, adopting this policy **reduces** inconsistency compared to our current state, provided we implement two guardrails:

  1.  **Stabilization via "Refer" Buffer:** Currently, a point estimate might flip from 9% (Approve) to 11% (Deny) due to noise, causing an automated flip. Under the proposed policy, both scenarios result in a **Manual Review** (since the range [4%, 22%] straddles the cutoff in both cases). By forcing uncertain cases into a human queue, we prevent automated decisions from oscillating based on model noise.
  2.  **Retraining Governance:** To prevent the *range itself* from drifting significantly between weeks, Engineering will commit to a **minimum model version tenure of 30 days** for this segment. We will not retrain the thin-file model weekly. Additionally, we will monitor the "Decision Flip Rate" on a holdout set; if auto-decisions for static profiles change >2% between versions, we will pause automated thin-file decisioning until the model is stabilized.

  **Operational Impact**
  *   **Volume:** We anticipate 15–20% of thin-file applications will route to Manual Review (up from 0% today).
  *   **Risk:** This eliminates false precision in our automated book, ensuring auto-approved loans are robust to model variance.
  *   **Fairness:** It ensures that automated approvals are granted only when the model is genuinely confident, reducing the risk of arbitrary denials or approvals driven by retraining noise.

  **Action Required**
  Approval to implement the Robust Interval Policy and update the model governance charter to include the 30-day minimum version tenure for thin-file segments.
