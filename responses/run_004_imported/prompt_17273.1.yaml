  *(Self-Correction Note)*: I need to make sure I don't get the technical definitions swapped.
  *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from the set of *actual* observers. (Leads to Doomsday, avoids Presumptuous Philosopher).
