      *   *Rousseau's Lycurgus:* User mentioned this. I should reference it to show I'm tracking their specific reading. Rousseau admires Sparta (no factions) but thinks it's impossible for moderns. Weil thinks we must attempt the impossible because the alternative is spiritual death.
