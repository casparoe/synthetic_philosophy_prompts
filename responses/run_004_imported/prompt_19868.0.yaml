answer: |-
  **Mark (Bohmian):** Look, the experiments are done. Bell inequalities are violated. Jarrett showed us what that means: Bell Locality is just Parameter Independence plus Outcome Independence. Nature violates the conjunction. My particles feel the distant setting instantly. That's Parameter Independence violation. Clean, ontological nonlocality. Where does Everett hide?

  **Sarah (Everettian):** We don't hide it; we dissolve it. Bell's derivation assumes single, definite outcomes on each wing. I deny that premise. Without a unique outcome here, there's nothing for a distant setting to influence. The universal wavefunction evolves via the Schrödinger equation. That's strictly local Hamiltonian dynamics.

  **Mark:** That's the standard dodge, but it doesn't survive Jarrett. Even if you deny definite outcomes, you still have branching structures. When Alice measures spin-up, she branches. When Bob measures, he branches. For the correlations to hold—so Alice-up only meets Bob-down—the branching events must be coordinated. If I rotate my polarizer, I change the basis in which *your* world splits relative to mine. That looks like a violation of Outcome Independence, just smeared across branches. You're relocating the nonlocality into the supervenience of branches.

  **Sarah:** You're assuming the branches are discrete entities that need handshaking. They aren't. They're decoherent components of a global state. Think spacetime state realism: the physical state is assigned to spacetime regions. The entanglement is a property of the composite region established in the shared past lightcone. When Alice measures, she doesn't send anything to Bob. She locally entangles with her particle. The correlation is already in the joint state vector.

  **Mark:** But the *manifestation* of that correlation isn't in the past. It's here, now. If I choose setting $a$ versus $a'$, I determine which decomposition of your local state becomes relevant for our joint history. If the dynamics are truly local, your local density operator shouldn't care about my setting. It doesn't—that's no-signalling. But the *global* structure that defines which branch you're on does care. You're saying locality holds because the reduced density matrix is invariant, but that ignores the relational facts that actually make up the world.

  **Sarah:** The relational facts aren't established until the systems interact. Until Alice and Bob compare notes within a lightcone, there is no "joint history" to violate locality. There's just local entanglement spreading. You're demanding a view from nowhere—a single table of outcomes against which to check locality. I'm giving you a view from everywhere: local interactions propagating through the field. The correlation is a common-cause phenomenon, encoded when the pair was created.

  **Mark:** A common cause explains correlation, not the violation of Bell inequalities. Reichenbach's Common Cause Principle fails here unless the cause is nonlocal. You're saying the "cause" is the unitary evolution itself. But unitary evolution preserves the entanglement. It doesn't explain why, upon comparison, the statistics violate Bell. You need the branching to align. If that alignment isn't negotiated across space, it's magic. If it is negotiated, it's nonlocal.

  **Sarah:** It's not negotiated. It's linear algebra. The tensor product structure handles the alignment automatically. When the measurement records physically meet, the interference terms vanish locally. There's no moment where Bob's branch "finds out" about Alice's setting. The information about the correlation is distributed, not transmitted. You see nonlocality because you insist on a single outcome. I see a local decomposition of a global state.

  **Mark:** And I see a global state that requires instantaneous dependence on distant boundary conditions to define the trajectories of its components. You call it linear algebra; I call it action at a distance disguised as basis selection.

  **Sarah:** And I call it insisting on collapse what creates the ghost. Remove the collapse, remove the spooky action.

  **Mark:** Remove the definite outcomes, remove the explanation for why we see *this* branch. We're stuck.

  **Sarah:** We're stuck only if you think "local" means "classically separable." It doesn't. It means no superluminal dynamical influence. I keep that. You don't.

  **Mark:** I keep the phenomena. You keep the equation. Let's see which one survives the next round.
