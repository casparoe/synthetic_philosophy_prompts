          *   *Kantian:* Concede adultery is wrong, but argue it's a wrong against *another*. The "unnatural" vices are worse because they destroy the *source* of moral agency (the self). You can betray another and repent; if you annihilate your own dignity, there is no moral subject left to repent.
      *   **Round 3: The "Personal Disgust" Trap (The Crucial Point).**
