          *   *Argument for "No":* Carnap's logical empiricism is primarily about *clarification*, not prescribing specific ends. The Manifesto emphasizes *method* over *dogma*. They weren't prescribing a specific totalitarian state but a rational attitude. Popper conflated "rational planning" with "totalitarian blueprint."
      *   *Key Distinction:* Means vs. Ends. Logical Empiricists generally saw science as clarifying means to chosen ends. Popper worried about the imposition of the ends themselves.
      *   *Neurath Factor:* Otto Neurath is the bridge. He was a Marxist and a logical empiricist. His "social technology" is the specific target Popper likely had in mind, even if he lumped Carnap in. Carnap himself was less politically dogmatic than Neurath.
      *   *Historical Context:* The Manifesto (1929) was written in "Red Vienna." Popper wrote *Open Society* (1945) after witnessing the rise of Fascism and Stalinism. Popper was reacting to the *consequences* of the kind of thinking prevalent in the 20s/30s.

