      *   *Section 2: The Genetic/kinematic Solution.* Geometry as the study of motion. To define a circle is to describe the motion that makes it. This feels more "real" to Hobbes.
      *   *Section 3: The Circle-Squaring Connection.* Why this specific problem? Because it requires relating rectilinear motion (square) to curvilinear motion (circle). For Hobbes, this is a problem of comparing *motions*. For Wallis, it's a problem of *ratios/numbers*.
      *   *Section 4: Why he couldn't quit.* The stakes. If Euclid is right and Hobbes is wrong, then abstraction is valid without material reference. That threatens the whole materialist system. It's a "fight for the soul of science."
