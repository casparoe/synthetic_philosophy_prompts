answer: |-
  Your roommate is spot on, and your intuition that there's something deeper than just "old man stubbornness" is correct. While Hobbes's ego was certainly massive (he once wrote that his controversy with Wallis was "the scandal of my life," which is a wild thing to say about a math feud), the mathematical error is indeed downstream of his metaphysical commitments.

  To get the gut-level sense of this, you have to stop thinking of Hobbes as a geometer trying to do math, and start thinking of him as a **physicist trying to eliminate magic.**

  Here is the intuitive breakdown of why Hobbes needed a materialist geometry, and why that trapped him in the circle-squaring delusion.

  ### 1. The Horror of "Nothing"
  For Hobbes, philosophy is the study of **causes**. To know something scientifically is to know how it was generated.

  In standard Euclidean geometry, a point is defined negatively: "that which has no part." A line is "breadthless length." For a mathematician, this is a useful abstraction. For Hobbes, this is ontological nonsense.

  *   **The Metaphysical Problem:** If "substance" equals "body" (matter), then something with zero extension is literally *nothing*. You cannot build a science of reality on "nothings." You cannot have a cause that has no magnitude.
  *   **The Intuition:** Imagine trying to explain how a brick wall is built, but you insist the bricks have zero size. You can describe the pattern of the wall, but you can't explain the *construction*. Hobbes wants geometry to be about construction, not just pattern description.

  So, Hobbes redefines geometry **genetically**.
  *   A **Point** isn't a location; it's a body considered as a unit (a "mark").
  *   A **Line** isn't a static distance; it is the **trace of a moving point**.
  *   A **Circle** isn't a set of points equidistant from a center; it is the shape generated by a specific kind of motion (one end fixed, the other rotating).

  For Hobbes, geometry is actually a branch of **kinematics** (the study of motion). This feels "real" to him because motion is the universal cause of all change in his materialist universe.

  ### 2. Why Squaring the Circle Matters
  Now, why does this lead to the obsession with squaring the circle?

  In the 17th century, squaring the circle wasn't just a puzzle; it was the test case for the relationship between the **rectilinear** (straight lines) and the **curvilinear** (curves).

  *   **Wallis's View (The Future):** Wallis was part of the move toward algebraic analysis. He was comfortable treating lines as numbers and using infinite series. He accepted that some ratios (like $\pi$) are incommensurable. You can approximate them, but you can't express them perfectly in finite rational steps. To Wallis, the "truth" is in the algebraic relationship, even if it's transcendental.
  *   **Hobbes's View (The Past):** If geometry is about *bodies in motion*, then a circle and a square must be commensurable. Why? because **motion is physical.** If I can move a body in a circle, and I can move a body in a square, there must be a physical, finite ratio between those motions.

  If Hobbes admits that the circle cannot be squared (i.e., that the ratio is irrational/transcendental and cannot be constructed via finite motion), he is admitting that **physical motion cannot be fully captured by rational geometry.**

  That is a disaster for his system. His entire political philosophy in *Leviathan* rests on the idea that human reasoning can be reduced to a "reckoning" (addition and subtraction of consequences), just like geometry. If geometry itself contains "inexpressible" mysteries that reason can't pin down, his claim that politics can be a science collapses.

  ### 3. The Category Error
  Here is where the "gut-level" conflict happens.

  Wallis was arguing about **numbers and ratios**.
  Hobbes was arguing about **magnitudes and motions**.

  When Wallis proved Hobbes wrong, he was using algebraic rules that Hobbes considered metaphysically illegitimate. Hobbes looked at Wallis's proofs and essentially said, "You are manipulating symbols, but you aren't describing how a body actually moves."

  Hobbes's specific errors in his proofs usually stemmed from treating a physical approximation as a geometric truth. For example, he would argue that if a polygon has enough sides, it *is* a circle.
  *   **Mathematically:** False. A limit is not the sequence.
  *   **Physically (for Hobbes):** True. At the scale of material bodies, a 1,000,000-gon is indistinguishable from a circle. Since geometry *must* be about material bodies, the distinction is pedantic nonsense to him.

  He couldn't accept he was wrong because, in his mind, Wallis was playing a different game. Wallis was playing "Abstract Math," and Hobbes was playing "Universal Science." To admit defeat would be to admit that Abstract Math is valid independent of Material Reality.

  ### 4. Was it Ego or Philosophy?
  It was ego *fueled* by philosophy.

  If Hobbes were just a hobbyist mathematician, he would have shrugged and moved on. But Hobbes believed he had discovered the **one true method** for all knowledge.
  1.  **Metaphysics:** Everything is Body.
  2.  **Method:** All reasoning is Computation (Add/Sub).
  3.  **Geometry:** The study of Body in Motion.
  4.  **Politics:** The study of Artificial Bodies (States) in Motion.

  These four links form a chain. If you break the link between Geometry and Body (by accepting Euclidean abstraction or Wallis's algebra), the chain snaps.
  *   If geometry doesn't need bodies, maybe minds don't need bodies (Dualism).
  *   If reasoning allows for "incommensurables," maybe political sovereignty can't be absolutely calculated/defined.

  Hobbes was fighting the rise of Platonism in science. He saw Wallis and the Royal Society as "enthusiasts" (a derogatory term for religious fanatics) who were bringing mysticism back into science by using abstract entities that didn't exist in the real world.

  ### Summary for your Seminar
  To answer your professor's aside: Hobbes wasn't just bad at math. He was **ideologically incapable** of accepting the math that was right.

  *   **The Metaphysics:** He refused to accept dimensionless points because "nothing" cannot cause "something."
  *   **The Geometry:** He insisted geometry must be the study of motion (kinematics), not static abstraction.
  *   **The Stubbornness:** Admitting the circle couldn't be squared meant admitting that physical motion cannot be perfectly rationalized. That would undermine his claim that politics could be a deductive science based on geometric reasoning.

  Your roommate is right: The math error is downstream. He got the math wrong because he demanded the math obey his physics, rather than letting his physics obey the math. He died insisting on it because, for him, it wasn't just about a circle; it was about whether the universe was made of **things we can touch** or **ideas we can imagine.** Hobbes bet everything on the things we can touch.
