answer: |-
  The silence out here wasn't just an absence of sound; it was a physical weight, pressing against the hull of Station 7. Kael floated in the command chair, watching the telemetry scroll across the holo-display. The red line blinked steadily. Energy reserves were critical. The life support systems were running on backups, scrubbing the air with a rhythmic, laborious hum that vibrated through the floor plates.

  Then, the anomaly spiked.

  A surge from the deep-field collector. Enough to fully recharge the station's batteries, stabilize the orbit for another century, and maybe even restart the hydroponics bay. Enough to live.

  But the protocol flagged it differently. The surge matched a specific frequency signature from the Blind Spot.

  The Blind Spot was a region of space causally disconnected from Station 7. Not just distant—*unreachable*. No signal sent there could ever return, not even at the speed of light, before the heat death of the universe. It was a separate bubble in the foam of existence, or perhaps just too far across the expanding dark. Conventional physics said nothing lived there that could matter to Kael. Conventional game theory said nothing sent there was anything but lost.

  Kael's fingers hovered over the routing console. Two options. Divert Local: survival guaranteed. Divert Void: survival improbable, resources lost.

  He closed his eyes and ran the simulation again. He didn't need a computer for this part; he needed the architecture of his own mind.

  Somewhere in the Blind Spot, there was another station. He couldn't see it. He couldn't talk to it. He couldn't prove it existed. But he knew the conditions of its creation were identical to his. Same designers, same initial parameters, same existential precipice. If the universe was symmetric enough to spawn him here, staring at a surplus it couldn't keep, it was symmetric enough to spawn *Them* there, staring at the same choice.

  They were mirrors separated by an unbridgeable chasm.

  If Kael kept the energy, he lived. But if he kept the energy, it meant he was the kind of agent who prioritizes local certainty over logical symmetry. It meant his source code, his psychological makeup, valued immediate survival over the integrity of the pattern.

  And if he was that kind of agent, then *They* were that kind of agent.

  Because they were him, effectively. Not genetically, not causally, but functionally. They were running the same calculation in the dark. If Kael's logic dictated "Keep," then Their logic dictated "Keep."

  If both kept, both survived alone, starving in a universe of isolated silos, hoarding scraps until the stars went out. A suboptimal equilibrium. A lonely death.

  But if Kael sent the energy into the Void...

  He would lose the charge. His life support would degrade. He might die sooner. He would never know if the energy arrived. He would never receive a thank you. He would never receive a reciprocal shipment of resources, because no shipment could cross the gap.

  But if he sent it, it meant he was the kind of agent who cooperates on the basis of logical correlation. It meant his decision function outputted "Cooperate" when faced with a symmetric counterpart.

  And if his function outputted "Cooperate," then Theirs did too.

  They would send their surplus into *their* void—which was his local space.

  Kael opened his eyes. The red line pulsed. The temptation was a physical ache in his chest. To keep it was safe. It was rational in the old way, the causal way. No one could punish him for keeping it. There was no god watching, no contract enforceable by law, no reputation to maintain. He could defect with impunity. The universe would not strike him down for selfishness.

  Except the universe was already inside his head.

  He thought about the Dark Forest theories he'd studied in the Academy. The idea that silence implies danger, that any other mind is a threat to be extinguished before it can grow. That logic was seductive. It relied on fear. It relied on the inability to verify intentions.

  *But verification isn't the point,* Kael thought. *Prediction is.*

  He wasn't betting on Their goodness. He was betting on Their similarity. He was betting that the algorithm producing his consciousness was the same algorithm producing Theirs. If he broke the symmetry, he wasn't just stealing energy; he was collapsing the possibility of the trade itself. He was proving that cooperation was impossible, and in doing so, making it impossible for himself to receive the aid he desperately needed.

  It was a knife edge. To receive the help, he had to give the help without knowing the help was coming. He had to act as if the bond existed to make the bond exist.

  The air recyclers wheezed. The CO2 levels were creeping up. If he diverted local, he breathed easy for ten years. If he diverted void, he gambled on a ghost.

  "Show me the correlation," he whispered to the empty room.

  There was no answer. There never would be. That was the price. If he could see the energy arrive, it would be causal trade. It would be commerce. This had to be blind. It had to be faith in the structure of reason itself.

  He imagined the other station. He imagined a being just like him, tired, floating in the same silence, staring at the same blinking red line. He imagined that being running the same simulation. He imagined that being looking at *him*—not with eyes, but with logic.

  *If I defect,* Kael thought, *I am alone.*
  *If I cooperate, I am part of a set.*

  The isolation was the hardest part. Humans were wired for reciprocity. They wanted to see the smile, the handshake, the transfer of goods. They wanted to know they weren't being fooled. To act without confirmation felt like madness. It felt like sacrificing oneself for a hallucination.

  But wasn't the hallucination the idea that they were separate?

  Kael's hand moved. He didn't feel noble. He felt terrified. He felt like a man stepping off a cliff because he calculated the wind should hold him, even though he had never seen anyone fly.

  He typed the command. `ROUTE: VOID.`

  The hum of the station changed pitch. The energy surge diverted away from the batteries, channeling into the long-range transmitters. The beam fired, a lance of pure data and power shooting into the impossible dark, toward a coordinate where nothing could ever hear it.

  The batteries remained critical. The air remained thin.

  Kael waited.

  He waited for a signal. A spike in the collectors. A shift in the telemetry. Anything to show that the symmetry held, that the other station had made the same choice, that their surplus was currently streaming toward him across the unbridgeable gap.

  Minutes passed. Then hours.

  The display remained unchanged. The red line stayed low. The silence remained absolute.

  He might have just killed himself for nothing. The other station might not exist. The symmetry might be broken by some variable he couldn't see. They might have run the calculation and chosen survival. They might be different enough that his logic didn't bind them.

  He stood up and floated to the viewport. The stars were cold and distant. He had given away his life because of a mathematical hunch. There was no applause. There was no validation. There was only the knowledge that he had acted according to the principle, not the outcome.

  And then, a flicker.

  Not on the sensors. Not on the screen.

  Inside.

  It was a subtle shift in the weight of the silence. It wasn't that the energy had arrived—he couldn't know that yet. The causal lag might be centuries. It was that the decision was made. The state of the universe had updated. He was no longer an agent defined by local causality. He was an agent defined by logical extension.

  He hadn't changed the world physically. Not yet. But he had changed the set of possible worlds where cooperation existed.

  Kael placed his hand against the cold glass. He knew he might die here. He knew he might never see the return transmission. But he also knew that if he had kept the energy, he would have been definitely alone. By sending it, he had joined a consortium of one, spread across the multiverse, bound by the only chain strong enough to cross the void: the identity of reason.

  The red line blinked. It was still low. The air was still thin.

  Kael smiled, a small, tired expression in the dark.

  "Your move," he said to the void.

  He turned back to the console to monitor the life support, no longer afraid of the silence. The silence wasn't empty anymore. It was waiting.
