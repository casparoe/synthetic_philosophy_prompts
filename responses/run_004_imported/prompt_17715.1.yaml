answer: |-
  **Title:** The Two-Dimensional Bind: A Dialogue on Primary Intensions
  **Characters:**
  *   **ELENA:** Committed Two-Dimensionalist (Chalmers/Jackson leaning).
  *   **MARCUS:** Millian Direct-Reference Theorist (Soames/Kripke leaning).
  **Setting:** Faculty lounge, late afternoon. Coffee is stale.

  **MARCUS:** I saw your seminar today. You spent fifty minutes drawing diagonal propositions on the board. Half the room looked enlightened; the other half looked like they were waiting for the punchline.

  **ELENA:** The punchline is that we can have our cake and eat it too. We keep Kripke's metaphysical necessity—*Hesperus is Phosphorus* is necessary in the secondary dimension—but we recover the Fregean epistemic contingency in the primary dimension. It explains why the discovery was substantive.

  **MARCUS:** It explains it by positing a mechanism that doesn't exist. Look, Elena, I'm not here to rehash *Naming and Necessity*. I agree names are rigid. I agree *Hesperus is Phosphorus* expresses a necessary proposition. The question is: what work is this "primary intension" actually doing, and where does it come from?

  **ELENA:** It comes from epistemic possibility. When a Babylonian astronomer asks, "Is Hesperus Phosphorus?", he isn't asking about metaphysical possibilities where Venus splits in two. He's considering epistemic scenarios compatible with his knowledge. In some of those scenarios, the evening star and the morning star are distinct bodies. The primary intension captures that epistemic profile.

  **MARCUS:** Okay, but let's get into the weeds of *how* it captures it. You say the primary intension of "Hesperus" picks out an object in a centered world based on how that world turns out to be *actual*. What is the function? What is the rule?

  **ELENA:** It's the rule that takes a world considered as actual and returns the object that satisfies the conceptual role of "Hesperus" in that world.

  **MARCUS:** There it is. "Satisfies the conceptual role." Now we're back in descriptivist territory. If the primary intension is a function from worlds to objects, there must be a condition the object satisfies. Is it "the bright star seen in the evening"?

  **ELENA:** Not necessarily a *single* description. It's a cluster. Or, on the Chalmers view, it's tied to the phenomenal experience of seeing a bright object in the evening sky.

  **MARCUS:** Soames' first objection is the ignorance-and-error argument, and you know it applies here just as it did to Frege. Suppose a speaker doesn't know Hesperus is a star. Maybe they think it's a planet, or a god, or a hole in the celestial sphere. If the primary intension relies on the description "the evening star," then for that speaker, the primary intension fails to pick out Venus. But intuitively, they still refer to Venus when they say "Hesperus."

  **ELENA:** That's why we distinguish the *reference-fixing* description from the *meaning*. The primary intension isn't what the speaker consciously grasps as a synonym. It's a theoretical construct that models the epistemic dependencies. Even if the speaker has false beliefs, there is a canonical way their term is anchored to the world.

  **MARCUS:** Anchored how? If it's not via a description they grasp, is it via a causal chain?

  **ELENA:** In the secondary dimension, yes. In the primary dimension, it's via the way the term is *understood*.

  **MARCUS:** But if the understanding doesn't involve a description, what does it involve? If you retreat to "the object causally connected to my use of 'Hesperus'," you've made the primary intension metaphysical. You've collapsed the two dimensions. If you stick with "the object satisfying the epistemic appearance," you've made reference fragile.

  **ELENA:** I don't think it's fragile. Look, the point of 2D semantics isn't to give a psychological account of every speaker. It's to model the *sentence*. "Hesperus is Phosphorus" is a posteriori because its primary intension is contingent. There are epistemic scenarios where the sentence is false. That explains the cognitive significance without denying that, in the actual world, both terms lock onto Venus rigidly.

  **MARCUS:** Here is the bind, Elena. You want the primary intension to explain cognitive significance—why *Hesperus is Phosphorus* is informative while *Hesperus is Hesperus* is not. But if the primary intension is just a description like "the evening star," then you've reheated Frege, and Kripke buried him. If the primary intension is *not* a description, but something thinner, like "the object we call 'Hesperus'," then you lose the cognitive significance.

  **ELENA:** Why?

  **MARCUS:** Because if the primary intension of "Hesperus" is just "the object called 'Hesperus' in this world," and "Phosphorus" is "the object called 'Phosphorus' in this world," then the sentence "Hesperus is Phosphorus" evaluates, in the primary dimension, to: "The object called 'Hesperus' is the object called 'Phosphorus'."

  **ELENA:** And that is contingent! In some epistemic scenarios, the community uses "Hesperus" for Mars and "Phosphorus" for Jupiter.

  **MARCUS:** But that's trivial. It's a sociological claim about naming conventions. It doesn't capture the *astronomical* discovery. The Babylonian didn't discover that his community used two names for one thing. He discovered that the thing seen in the evening *is* the thing seen in the morning. If your primary intension reduces to a metalinguistic gloss—"the bearer of 'Hesperus'"—then you haven't explained the informativeness of the identity. You've just pushed the informativeness into the meta-language.

  **ELENA:** I deny it's merely metalinguistic. The primary intension tracks the *mode of presentation*. When I evaluate "Hesperus" in a counterfactual world considered as actual, I'm not asking "What do they call 'Hesperus' there?" I'm asking "Given how *I* understand 'Hesperus', what object in that world corresponds to this concept?"

  **MARCUS:** And if your understanding is purely causal, the primary intension is rigid, and you lose the contingency. If your understanding is descriptive, you lose the reference. Soames argues that there is no middle ground. You either have a proposition that is necessary (the Russellian singular proposition) or you have a proposition that is contingent (the descriptive one). You can't have a proposition that is *both* necessary and contingent by slicing it into dimensions. You just have two different propositions.

  **ELENA:** Exactly! We have two different propositions. The secondary intension is the necessary Russellian one. The primary intension is the contingent epistemic one. We believe the necessary one *by grasping* the contingent one.

  **MARCUS:** But how do you grasp the necessary one *via* the contingent one if the contingent one is false? If the primary intension relies on "the evening star," and it turns out Hesperus isn't a star (say, it's a planet, strictly speaking), then the primary intension yields nothing. Or worse, it yields the wrong object in nearby epistemic possibilities.

  **ELENA:** We idealize. We assume an a priori scrutability base. If you knew all the physical truths, you could deduce where "Hesperus" refers.

  **MARCUS:** Now you're asking for a super-human speaker. My graduate students can't deduce reference from physical truths. If the machinery of primary intensions requires a Laplacian demon to operate, it can't explain the cognitive significance for *us*. It explains it for an idealized reasoner, but not for the Babylonian astronomer who was just looking at the sky.

  **ELENA:** It explains the *rationality* of the inquiry. It explains why it wasn't irrational for him to doubt the identity. If the primary intension were necessary, doubting it would be like doubting *Hesperus is Hesperus*. The 2D framework preserves the normativity of the doubt.

  **MARCUS:** It preserves the normativity by positing a shadow proposition that nobody actually believes. When the Babylonian says "Hesperus might not be Phosphorus," he isn't asserting a contingent primary intension. He's expressing ignorance of a necessary truth. He doesn't have access to two propositions; he has access to one, and he doesn't know it's true.

  **ELENA:** But that makes his ignorance inexplicable. If he's just grappling with a necessary truth, why is it hard? Why does it require empirical work?

  **MARCUS:** Because empirical work is required to link the name to the object! That's the causal chain. It's not that there are two dimensions of meaning. It's that there is one meaning (the object), and two *ways of knowing* it. You're conflating epistemology with semantics. You're building the difficulty of the discovery into the meaning of the names.

  **ELENA:** And you're stripping the names of their cognitive role entirely. If meaning is just reference, then "Hesperus is Phosphorus" has the same meaning as "Hesperus is Hesperus." You have to admit there's a difference in *cognitive value*, even if you call it pragmatics or psychology. 2D semantics just formalizes that difference.

  **MARCUS:** I'll admit there's a difference in cognitive value. I'll even admit it's important. I just deny it's semantic. Once you make it semantic via primary intensions, you invite the description objection. If the primary intension is semantic, it should be graspable by any competent speaker. But if I ask a competent speaker, "What is the primary intension of 'Hesperus'?", they can't tell you. They'll give you a description. And that description will be wrong.

  **ELENA:** They can't tell you the rules of grammar explicitly either, but that doesn't mean grammar doesn't exist. The primary intension is implicit in their reasoning patterns. When they reason, "If the evening star were distinct from the morning star, then...", they are manipulating the primary intension.

  **MARCUS:** They are manipulating *concepts*, Elena. Not meanings. You can keep the concepts in the head and the reference in the world without needing a two-dimensional matrix to bridge them. The cost of your machinery is that it makes reference too dependent on our conception of the world. If our conception shifts, does the referent shift?

  **ELENA:** In the primary dimension, yes. That's the point. It captures the epistemic dependence.

  **MARCUS:** But reference shouldn't be epistemically dependent. Venus is Venus regardless of what we know. By making the primary intension a dimension of *meaning*, you suggest that if we had different beliefs, "Hesperus" would mean something different. And that looks suspiciously like the descriptivism Kripke showed us was false.

  **ELENA:** It's not descriptivism because the primary intension doesn't fix the reference in the *actual* world metaphysically. It only fixes it across epistemic space. It's a tool for evaluating counterfactuals, not a definition.

  **MARCUS:** A tool that works by smuggling in definitions. Look, I think we're at the stalemate. You think the primary intension is the only way to save the epistemic intuition without abandoning rigidity. I think it's a Rube Goldberg machine that hides a description inside a formalism and calls it "epistemic."

  **ELENA:** And I think your Millianism leaves the rationality of identity statements a mystery. If there's no difference in intension, why is one trivial and the other a discovery? "Pragmatics" is just a label for the mystery, not a solution.

  **MARCUS:** Maybe. But your solution buys clarity at the price of ontological excess. You've doubled the propositions to save the phenomena.

  **ELENA:** And you've halved the meaning to save the ontology.

  *(Silence. They both drink their cold coffee.)*

  **MARCUS:** So, for the seminar... do we tell them the primary intension is real?

  **ELENA:** We tell them it's indispensable for modeling epistemic reasoning.

  **MARCUS:** And I'll tell them it's a useful fiction that collapses under metaphysical scrutiny.

  **ELENA:** Perfect. That should keep them writing term papers until December.

  **MARCUS:** Just don't ask them to draw the diagonal on the final exam. I still don't know which way the arrows go.

  **ELENA:** *(Smiles)* Up and to the right. Always up and to the right.
