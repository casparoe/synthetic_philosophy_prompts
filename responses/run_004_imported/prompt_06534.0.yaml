answer: |-
  # The Ceiling of Reason: Why Menger Killed the St. Petersburg Paradox (and What We Should Do About It)

  The St. Petersburg Paradox is the cockroach of decision theory: no matter how many times you think you've exterminated it, it crawls back out of the mathematical woodwork. The setup is deceptively simple. A casino flips a fair coin until it lands heads. If heads appears on the $n$-th flip, you win $2^n$ dollars. The expected value (EV) of this game is the sum of probabilities times payoffs: $\sum (1/2^n) \cdot 2^n = \sum 1 = \infty$. Mathematically, you should mortgage your house to play. Psychologically, you wouldn't pay more than $25.

  For two centuries, the standard resolution was Daniel Bernoulli's 1738 insight: money isn't utility. A dollar means less to a millionaire than to a pauper. If we assume utility $U(x)$ grows logarithmically with wealth ($\ln x$), the expected *utility* converges to a finite number. Problem solved, right?

  Not even close. In 1934, the mathematician Karl Menger dropped a bomb on this consensus. He showed that Bernoulli's fix is merely a bandage. Menger proved that for *any* unbounded utility function, no matter how slowly it grows, one can construct a "Super St. Petersburg" game with payoffs that grow fast enough to drive expected utility back to infinity.

  This essay argues that Menger's critique forces a binary choice: we must either accept that utility is strictly bounded or abandon Expected Utility Theory (EUT) entirely. While rejecting EUT has gained traction in behavioral circles, I contend that **bounded utility is the only coherent normative solution**, provided we reinterpret the bound not as psychological satiation, but as a consequence of ontological finitude.

  ### The Menger Critique: Why Diminishing Returns Isn't Enough

  To understand Menger's contribution, we have to look at the structure of the divergence. The original paradox works because the payoff ($2^n$) grows exactly as fast as the probability shrinks ($1/2^n$). Bernoulli slowed the payoff down by applying a function like $\ln(2^n) = n \ln 2$. Now the series looks like $\sum (1/2^n) \cdot n$, which converges.

  Menger's insight was that this is an arms race. If you propose a utility function $U(x)$ that goes to infinity as $x$ goes to infinity (unbounded), Menger can simply define a new game where the payoff at step $n$ is some value $x_n$ such that $U(x_n) > 2^n$. Since the probability is still $1/2^n$, the expected utility becomes $\sum (1/2^n) \cdot U(x_n) > \sum 1 = \infty$.

  In plain English: If you claim there is no limit to how good an outcome can be, I can describe a lottery ticket so valuable that you should trade your life for it, even if the odds are one in a googolplex. Diminishing marginal utility slows the growth of value, but if the function is unbounded, it can always be outpaced by a sufficiently explosive payoff schedule. Menger showed that the only mathematical way to guarantee convergence for *all* possible games is if the utility function has a hard ceiling (an asymptote).

  ### The Dilemma: Bounded Utility vs. Broken Theory

  Menger's theorem leaves us with a stark fork in the road.

  **Option 1: Bounded Utility.** We accept that there is some maximum possible utility $U_{max}$. No matter how much money, happiness, or cosmic good you promise, the value caps out. This solves the math instantly. The series must converge because the terms are bounded by $U_{max} \cdot (1/2^n)$.
  *   *The Cost:* It feels intuitively repulsive. Is it really true that having $10^{100}$ dollars is not better than having $10^{100}-1$ dollars? It implies a "satiation point" for existence itself.

  **Option 2: Reject Expected Utility Maximization.** We keep utility unbounded but change the decision rule. Perhaps we should maximize median utility, or use "risk-weighted" expected utility (prioritizing worst-case scenarios), or simply ignore probabilities below a certain threshold (probability discounting).
  *   *The Cost:* This breaks the axioms of rational choice. If you deviate from EUT, you become vulnerable to "money pumps" (sequences of trades that leave you poorer with no gain) or dynamic inconsistency (planning to do one thing tomorrow but another thing today).

  ### The Pascal's Mugging Connection

  This isn't just abstract math; it is the engine behind "Pascal's Mugging," a thought experiment popular in rationalist communities. A mugger approaches you and says, "Give me $5, or I will use my magic powers to simulate and kill $3 \uparrow\uparrow\uparrow 3$ people in another dimension." The probability is tiny, but if utility is unbounded, the expected disutility of refusing is infinite. EUT commands you to pay the mugger.

  If you accept unbounded utility, you are vulnerable to any hypothesis, no matter how absurd, provided the stakes are high enough. This paralyzes decision-making. An agent with unbounded utility in an infinite universe would spend all its resources guarding against infinitesimal probabilities of infinite catastrophes, neglecting certain, finite harms.

  ### The Verdict: Bounded Utility via Ontological Finitude

  So, which path do we take? I argue that **bounded utility is the correct normative standard**, but the justification requires a shift in perspective.

  The common objection to bounded utility is psychological: "I can always imagine something better." This is true, but irrelevant. Utility in decision theory should not map to *imagined* preference intensity; it should map to *capacity to affect states of the world*.

  Here is the commitment: **Utility must be bounded because the number of distinguishable physical states of the universe is finite.**

  1.  **Physical Constraints:** We do not live in a mathematical continuum; we live in a physical universe with a Bekenstein bound on information and a finite lifespan for entropy. There is a maximum amount of computation, experience, or matter that can ever be arranged. You cannot have "infinite" happiness because there are not infinite neurons to fire or infinite seconds to experience.
  2.  **The Definition of Utility:** If utility represents the ranking of world-states, and there are a finite number of accessible world-states (due to physical limits), then there must be a best possible state (or a supremum). Therefore, utility is bounded by definition.
  3.  **Solving Menger:** If utility is bounded by physical reality, Menger's "Super St. Petersburg" game becomes physically impossible to construct. You cannot promise a payoff of $10^{10^{10}}$ dollars because that much energy/matter does not exist in the cosmos to back the currency. The game itself is ill-defined.

  This approach avoids the arbitrariness of psychological satiation. It is not that you *stop caring* after a billion dollars; it is that a billion dollars already purchases a significant fraction of the total possible influence available in the universe. The "ceiling" isn't a limit on your desire; it's a limit on the *object* of the desire.

  ### Conclusion

  Menger proved that the St. Petersburg Paradox is not a problem of money, nor a problem of logarithms; it is a problem of infinity. As long as we allow decision theory to operate on unbounded values in a probabilistic framework, we invite absurdity.

  We must reject the idea that utility is unbounded. However, we should not accept this as a concession to human psychology. We should accept it as a constraint of physics. By grounding utility in ontological finitude—the fact that the universe contains a finite amount of stuff and time—we preserve the machinery of Expected Utility Theory while immunizing it against Menger's critique and Pascal's Mugging. The expected value of the St. Petersburg game is not infinite; the game itself is a fiction that violates the boundary conditions of reality. Rationality requires us to maximize expectation, but only within the bounds of the possible.
