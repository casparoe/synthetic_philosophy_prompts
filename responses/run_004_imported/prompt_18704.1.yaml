prompt: |-
  so we've been doing a unit on philosophy of mind in my philosophy elective and got to the "philosophical zombie" argument (chalmers' version — like, imagine a being that's atom-for-atom physically identical to a normal human, same brain, same behavior, reacts to everything the same way, but theres just nothing it is like to be it, zero inner experience. and since we can supposedly conceive of that without contradiction, the argument goes that physicalism about the mind cant be necessarily true). my teacher then hit us with this way older passage from Leibniz's Monadology (from like 1714) and said its basically the OG version of this same move, but ngl the old-timey translation is kind of hard for me to actually untangle:

  "It must be confessed that perception, and that which depends upon it, are inexplicable on mechanical grounds, that is to say, by means of figures and motions. And supposing there were a machine, so constructed as to think, feel, and have perception, it might be conceived as increased in size, while keeping the same proportions, so that one might go into it as into a mill. That being so, we should, on examining its interior, find only parts which work one upon another, and never anything by which to explain a perception. Thus it is in a simple substance, and not in a compound or in a machine, that perception must be sought for."

  i get the basic image, like walking around inside a giant mill and just seeing gears push other gears. but i dont totally get what leibniz's actual point is, or why its supposed to be the "same" arguement as the zombie one. like isnt his machine actually built to think and feel (it literally says "so constructed as to think, feel, and have perception"), while a zombie is specifically defined as NOT having any experience at all? those seem like almost opposite setups to me, not the same one. could someone break down step by step what leibniz is actually arguing here, and then tell me whether its really doing the same logical job as the modern conceivability argument, or if its a genuinely different kind of argument that just looks similar on the surface? we have to turn in a short reflection on the connection and i dont want to just write "its the same thing as the zombie argument" if that's actually wrong.
