      *   **Specific Constraint (Crucial):** She explicitly forbade using this belief to comfort the *mourners*. She knew her surviving branches aren't *our* branches. She didn't want it mushed into vague "she lives on" spiritualism. She wanted it acknowledged as *her* truth, not *ours*.
