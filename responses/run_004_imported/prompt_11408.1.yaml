answer: |-
  This is a profound and delicate challenge. You are walking a tightrope between honoring her specific, intellectual truth and respecting her explicit instruction not to weaponize that truth to dilute your grief.

  The key to making this work—and leaving the room in a "better place"—is to shift the source of comfort. The comfort cannot come from the idea that *she is okay somewhere*. The comfort must come from the fact that *she was okay here*, because of her mind, and that her courage was a gift to all of you who watched her face the end.

  Here is a draft. I have kept the physics accurate enough for your cousin (focusing on subjective experience vs. objective reality) but simple enough for everyone else. I have also embedded her instruction directly into the speech, so you are protected from the guilt of "getting it wrong."

  ***

  **Eulogy for [Mum's Name]**

  Thank you all for being here.

  For most of her life, my mum was a woman of very concrete things. She left school at sixteen, she worked as a bookkeeper for decades, and she understood the world through ledgers, balances, and things you could prove. If the numbers didn't add up at the end of the day, you stayed until they did.

  But somewhere in her fifties, the woman who spent her life balancing accounts started balancing universes instead.

  It started with pop-science books. I remember seeing Sean Carroll's books on the bedside table, right next to the medication. She fell down a rabbit hole of quantum physics, specifically the "Many-Worlds" interpretation. For those who don't know, it's the idea that the universe is constantly branching. Every time a quantum event has multiple possible outcomes, all of them happen, just in different versions of reality.

  She didn't just read about this; she absorbed it. She became a genuine believer in what's called "Quantum Immortality." Her view was that because consciousness follows the path of survival, there is no version of events where she actually experiences being dead. She believed that subjectively, she would keep finding herself alive in whichever branches she survived, over and over.

  She used to joke, quite darkly, that somewhere out there, there is a version of her who is 150 years old, hooked up to increasingly ridiculous machines, just refusing to clock out. She found that hilarious. And honestly? It worked. It made the cancer easier for her to carry. I have never seen anyone face the end with the calm she had. She wasn't resigned; she was curious.

  However, a few weeks before she died, she made me promise something very specific. She even wrote it down on a card so I wouldn't forget.

  She told me: *"Do not let them use this to comfort themselves."*

  She was adamant. She knew that the branches where she keeps surviving aren't the branches we are in. She knew that for us, sitting here on Saturday, the loss is absolute. She didn't want her carefully worked-out view getting mushed into the vague, soft afterlife stuff she used to gently take the mickey out of when other people said it at funerals. She didn't want you to leave here thinking, "Well, she's still out there somewhere," as a way to make the pain go away.

  She was right. That isn't what this means for us. In this branch, the one we are all actually sitting in, she is gone. The ledger is closed. We are the ones left behind, and it hurts.

  But I think there is still a gift in this story. Not a magical one, but a human one.

  Her belief didn't change the outcome for us, but it changed the *quality* of her final days. Because she wasn't afraid of the end, she gave us the gift of her presence right up until the edge. We didn't have to spend her last weeks managing her terror. We got to spend them listening to her theories, laughing about her 150-year-old self, and loving her without the shadow of panic.

  She faced the great unknown with the same precision she applied to her bookkeeping. She looked at the terrifying math of mortality, found a solution that worked for her, and stood by it.

  So, I am not going to tell you she lives on. I am not going to tell you this pain isn't real. But I will tell you this: she was brave. She was intellectually fearless. She found a way to make peace with the universe on her own terms.

  If we want to honor her, we don't need to pretend she's still here. We just need to try to be half as brave as she was. We need to look at the things that scare us, the things we don't understand, and face them with curiosity instead of dread.

  She balanced her books. She made her peace. And now, she has left us to balance ours.

  Thank you.

  ***

  ### Notes for Delivery

  **1. The Physics Check:**
  Your cousin (the PhD) should be satisfied with this. You aren't claiming the theory is fact, only that *she believed it*. You correctly distinguish between "subjective experience" (her view) and "objective reality in this branch" (our view). You avoid saying "she is alive" and instead say "she believed she would keep finding herself alive." That is the crucial distinction.

  **2. The "Comfort" Constraint:**
  Notice how the speech validates the grief of the room *immediately after* explaining the theory. By saying "In this branch... the loss is absolute," you are obeying her instruction. Paradoxically, this honesty often comforts people *more* than platitudes, because it validates their pain rather than trying to talk them out of it.

  **3. Practical Tips for Saturday:**
  *   **Print it large:** Use size 14 or 16 font, double-spaced. Your vision might blur if you cry.
  *   **The "Cousin" Nod:** You don't need to mention your cousin in the speech. If you stick to the script above, they will nod along. If you get emotional and stumble over the physics, it doesn't matter; you are framing it as *her* belief, not your thesis.
  *   **Pausing:** When you get to the section about her promise ("Do not let them use this to comfort themselves"), take a breath. Let that land. It is a powerful moment of honesty.
  *   **It's okay to cry:** If you choke up, just stop. Breathe. Look at the paper. Everyone is on your side. No one is judging your delivery; they are just listening to your mum's story.

  I am so sorry for your loss. It sounds like she was a remarkable woman, right to the very end.
