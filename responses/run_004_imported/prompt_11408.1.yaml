  2.  **Deconstruct the Tension:**
      *   *The Paradox:* How do you talk about a belief that comforts the dead but explicitly *doesn't* comfort the living, without making the living feel worse?
      *   *The Solution:* Shift the focus from the *metaphysical outcome* (she's alive somewhere) to the *psychological gift* (her bravery allowed us to have a calmer goodbye). The comfort for the mourners isn't "she's still alive," it's "she wasn't afraid, and that peace was a gift to us."
