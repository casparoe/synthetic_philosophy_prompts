prompt: |-
  I'm a senior engineer on my company's Staff Engineer promotion committee, and we're reconsidering our "signature project" requirement: to be promoted, a candidate must lead a highly visible, technically ambitious project on top of their regular workload, usually over several months. Supporters argue it's the only reliable test of true Staff-level ability, since only someone genuinely capable would sustain that kind of costly effort; one committee member likened it to a peacock's tail, arguing that the sheer extravagance is what makes it credible. Critics respond that the requirement mostly rewards whoever has fewer caregiving duties, more job security, and a manager willing to hand them high-visibility work, so it may be measuring access to the signal rather than the underlying skill. We need to decide whether to keep the requirement as is, drop it in favor of manager and peer judgment, or redesign it, and I have to circulate a short recommendation memo before our next meeting. Please draft that memo: give a clear recommendation, and make sure the strongest argument against whichever position you take gets a fair hearing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Senior Engineer on a Staff Engineer Promotion Committee.
      *   **Task:** Draft a short recommendation memo regarding the "signature project" requirement for promotion.
      *   **Context:** The committee is reconsidering the requirement.
          *   *Proponents:* It's a reliable test of Staff-level ability (signaling theory/peacock's tail analogy).
          *   *Critics:* It rewards privilege/access (caregiving duties, job security, manager support) rather than skill.
      *   **Options:** Keep as is, drop entirely (rely on judgment), or redesign.
      *   **Requirements:** Clear recommendation, fair hearing for the strongest counter-argument, appropriate tone (professional, persuasive, nuanced).

  2.  **Determine the Recommendation:**
      *   *Option 1 (Keep as is):* Risky. Ignores valid equity concerns. Likely to cause friction and reduce diversity in the Staff ranks.
      *   *Option 2 (Drop entirely):* Risky. Removes a concrete bar. Might lead to subjectivity bias ("who do we like?") instead of structural bias ("who has time?"). Hard to calibrate across orgs.
      *   *Option 3 (Redesign):* Best balance. Retains the *intent* (demonstrating scope/impact) while mitigating the *exclusionary mechanics* (extra workload, visibility lottery).
      *   *Decision:* Recommend **Redesign**. Specifically, shift from "extra project on top of workload" to "demonstrated scope and impact within existing scope," potentially allowing for portfolio-based evidence rather than a single "hero" project.

  3.  **Identify the Strongest Counter-Argument:**
      *   If I recommend *Redesign*, the strongest counter-argument comes from the *Proponents* (Keep as is).
      *   *Argument:* Without the "costly signal" (the peacock's tail), we lose the ability to distinguish true Staff engineers from Senior engineers who are just good at talking up their work. The "pain" of the extra workload *is* the proof of capacity.
      *   *Mitigation:* Acknowledge this risk but argue that the current signal is too noisy (measures privilege) and that a redesigned bar can still assess capacity without the exclusionary overhead.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly up front (BLUF - Bottom Line Up Front).
      *   **Context/Problem:** Briefly summarize the debate (Signaling vs. Equity/Access).
      *   **Recommendation (The "What"):** Redesign the requirement. Move from "extra project" to "scope of impact."
      *   **Rationale (The "Why"):**
          *   Current model measures access, not just ability.
          *   Staff work is about leverage, not just heroics.
          *   Retains rigor but changes the mechanism.
      *   **Counter-Argument (The "Steel Man"):** Address the "Peacock's Tail" argument. Acknowledge that removing the "costly signal" risks lowering the bar or increasing subjectivity. Explain why the redesign still mitigates this (e.g., requiring evidence of sustained impact, not just a one-off).
      *   **Next Steps:** What the committee needs to do next.

  5.  **Refining the Tone:**
      *   Needs to be respectful of both sides.
      *   Needs to sound like a Senior/Staff engineer (systems thinking, focus on outcomes, awareness of org dynamics).
      *   Avoid jargon where possible, but use appropriate engineering leadership terms (scope, leverage, signaling).

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey team, we should change the rule.
      *   Right now, you need a big side project.
      *   Problem: Only people with time do this.
      *   Fix: Look at what they actually did in their job.
      *   Counter: But how do we know they aren't faking it? The hard project proved they could suffer for the code.
      *   Response: We can check references and impact metrics instead.
      *   Let's vote on new criteria.

  7.  **Drafting - Iteration 2 (Polishing for Professionalism):**
      *   *Subject:* Recommendation on Staff Promotion Criteria.
      *   *Rec:* Redesign the signature project requirement.
      *   *Reasoning:* The "peacock" argument is strong but flawed because it conflates privilege with capacity.
      *   *Counter:* If we drop the "hard thing," we lose calibration.
      *   *Rebuttal:* We replace "hard thing" with "sustained impact."
      *   *Action:* Form a subcommittee to draft new rubric.

  8.  **Final Polish (incorporating specific prompt requirements):**
      *   Make sure the "Peacock's Tail" analogy is addressed directly.
      *   Ensure the "Caregiving/Access" argument is integrated.
      *   Keep it short (memo style).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's unfair." I need to explain why it's *technically* a bad metric (noisy signal). Also, I need to make sure the counter-argument gets a *fair* hearing, not just a strawman dismissal. The counter-argument is that without a high-barrier entry, the title gets inflated. I must address that.

  9.  **Final Review against constraints:**
      *   Clear recommendation? Yes (Redesign).
      *   Strongest counter-argument heard? Yes (The signaling/calibration risk).
      *   Tone appropriate? Yes.

  10. **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Staff Engineer Promotion Committee
  **FROM:** [Your Name], Senior Engineer
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding "Signature Project" Promotion Requirement

  **Bottom Line Up Front**
  I recommend we **redesign** the signature project requirement rather than keeping it as is or dropping it entirely. We should shift the criteria from "leading a highly visible project *on top of* regular workload" to "demonstrating sustained Staff-level scope and impact *within* assigned responsibilities."

  **Context**
  Our current standard requires candidates to deliver a "signature project" alongside business-as-usual work. Proponents argue this acts as a "peacock's tail"—a costly signal that proves capability because only truly capable engineers can sustain the effort. Critics argue this metric measures access (managerial support, job security, lack of caregiving duties) more than engineering skill.

  **Rationale for Redesign**
  The "peacock's tail" theory relies on the signal being costly to produce. However, in our current org structure, the "cost" is not evenly distributed. An engineer with high job security and no caregiving constraints pays a lower personal cost for the same project than an engineer without those privileges. Consequently, the signal has become noisy; it filters for privilege as much as capacity.

  Furthermore, Staff engineering is defined by leverage and organizational impact, not heroics. Requiring work "on top of regular workload" incentivizes unsustainable bursts of effort rather than the systemic improvements we actually want Staff engineers to drive. A redesign allows us to assess the *outcome* (scope, technical strategy, organizational influence) without mandating the *mechanism* (extra unpaid labor).

  **The Strongest Counter-Argument**
  The most compelling argument for retaining the current requirement is **calibration risk**. As one committee member noted, the "extravagance" of the current bar provides an objective anchor. Without a concrete, high-difficulty deliverable, we risk relying solely on manager and peer judgment, which introduces its own biases (recency effect, likability, office politics). If we remove the "costly signal," we may inadvertently inflate the title, promoting Senior engineers who are excellent at visibility but lack the technical depth to operate at Staff level. The hardship of the current requirement is a feature, not just a bug; it ensures the candidate can deliver under pressure.

  **Mitigation Strategy**
  To address this risk without reverting to exclusionary practices, the redesigned criteria must maintain rigor. We will not lower the bar for *impact*, only change how it is evidenced.
  1.  **Portfolio vs. Project:** Allow candidates to submit a portfolio of work demonstrating sustained scope over 6–12 months, rather than a single "hero" project.
  2.  **Scope Definition:** Explicitly define "Staff-level scope" (e.g., cross-team ambiguity resolution, multi-quarter technical strategy) so judgment is anchored to specific behaviors, not just visibility.
  3.  **Workload Integration:** Mandate that evidence must come from committed roadmap work, ensuring managers are accountable for providing the opportunity.

  **Next Steps**
  I propose we form a subcommittee to draft the new rubric based on "Scope and Impact" rather than "Signature Project." We will present a draft for review at the next monthly committee meeting.

  Please let me know if you have objections to this direction before I convene the subcommittee.
