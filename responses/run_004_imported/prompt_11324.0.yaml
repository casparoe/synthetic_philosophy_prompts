answer: |-
  Here is the argument you are looking for. It bypasses the standard "Popper changed his mind, so the debate is over" narrative and focuses on the logical insufficiency of Popper's recantation compared to the structural repair offered by the propensity interpretation.

  ### The Thesis
  The standard narrative—that Popper's 1978 recantation nullifies the tautology objection—is philosophically superficial. Popper's recantation was a **methodological concession**, not a **logical repair**. He admitted that evolutionary biology *functions* as a testable science, but he failed to provide the conceptual machinery required to break the circularity he originally identified. That machinery—the propensity interpretation of fitness articulated by Mills and Beatty (1979)—is logically distinct from Popper's recantation. Therefore, the original tautology objection remains valid *against the classical formulation* of the theory, and Popper's change of heart does not, in itself, resolve the logical vulnerability that intelligent design proponents exploit.

  ### 1. The Logical Core of Popper's Original Objection
  To understand why the recantation fails, we must be precise about the original charge. Popper's claim in *Unended Quest* (1974) and *Objective Knowledge* (1972) was not merely that evolution was hard to test, but that the central principle—"the survival of the fittest"—was analytically true.

  The logical structure of the objection is as follows:
  1.  **Premise 1:** The theory states that organisms with higher fitness have higher reproductive success.
  2.  **Premise 2:** In the classical formulation, "fitness" is defined *ex post facto* by actual reproductive success (i.e., who survived).
  3.  **Conclusion:** Therefore, the theory states "organisms who survive, survive."

  If Fitness ($F$) is identical to Reproductive Success ($RS$), the statement $F \rightarrow RS$ reduces to $RS \rightarrow RS$. This is a tautology. Tautologies are necessarily true, but they are also empirically empty; they cannot be falsified because no possible state of affairs could contradict them. Popper's criterion for science was falsifiability. Thus, on these definitions, natural selection is metaphysical.

  ### 2. Why the Recantation is Logically Inadequate
  In his 1977/78 lecture "Natural Selection and the Emergence of Mind," Popper famously stated: "I have changed my mind... I now believe that Darwinism is testable."

  However, if you analyze *how* he justifies this change, he does not address the definitional identity of $F$ and $RS$. Instead, he shifts the ground to **historical specificity**.

  *   **The Shift to Historical Claims:** Popper argues that while the *principle* of natural selection might look universal, we test it through specific historical claims (e.g., "The peppered moth changed color due to predation pressure"). He argues these specific claims are falsifiable.
  *   **The Evasion:** This sidesteps the tautology problem rather than solving it. Even if specific historical narratives are testable, the *general mechanism* linking fitness to survival remains logically circular if fitness is defined by survival. Popper essentially conceded that biologists *act* as if the theory is testable, but he did not explicate *why* the logic permits it.
  *   **Lack of Independent Measure:** To break a tautology, you need an independent measure for the antecedent. You need to be able to measure $F$ *without* referencing $RS$. In his recantation, Popper does not offer a definition of fitness that is independent of survival outcomes. He speaks vaguely of "adaptation" and "function," but he does not decouple the *property* of the organism from the *outcome* of the environment.

  Consequently, Popper's recantation is a **performative utterance** ("I now accept this is science") rather than a **theoretical correction**. He validated the *status* of the theory without fixing the *logic* of the theory.

  ### 3. The Mills and Beatty Intervention (The Actual Fix)
  The logical work required to save natural selection from the tautology charge was done not by Popper, but by Susan Mills and John Beatty in their 1979 paper, "The Propensity Interpretation of Fitness."

  *   **The Propensity Move:** Mills and Beatty argued that fitness is not the *actual* reproductive output (the outcome), but the **probabilistic propensity** to produce that output given a specific environment.
  *   **Breaking the Identity:** This distinguishes the *cause* (fitness as a dispositional property, like fragility or solubility) from the *effect* (survival/reproduction).
      *   **Classical View:** Fitness = Survival. (Tautology)
      *   **Propensity View:** Fitness = Causal Probability of Survival. (Synthetic Statement)
  *   **Restoring Falsifiability:** Under the propensity view, it is logically possible for an organism to have high fitness (high propensity) but fail to survive (due to drift, bad luck, etc.). Because the outcome can diverge from the propensity, the relationship is no longer analytic. It is empirically testable. We can measure physiological traits (propensities) and compare them against statistical outcomes.

  **Crucially, Popper did not articulate this.** In his 1978 recantation, there is no discussion of fitness as a probabilistic disposition distinct from actual survival. He simply asserted testability. Therefore, crediting Popper's recantation with solving the circularity problem is historically and logically inaccurate. The circularity was solved by redefining the terms of the theory, a move Popper acknowledged as necessary but did not execute himself.

  ### 4. Implications for the "Quote-Mining" Charge
  This distinction allows you to nuance the "quote-mining" accusation in your article.

  Your friend Dave argues that because Popper recanted, the ID folks are wrong to use the quote. But this assumes the quote is being used to describe *current* evolutionary theory. It isn't. It is being used to describe the **logical structure of the classical formulation**.

  *   **The ID Argument:** They argue that if fitness is defined by survival, the theory is circular.
  *   **The Reality:** They are logically correct regarding the classical formulation (the one Popper originally criticized).
  *   **The Counter:** Modern biology uses the propensity interpretation (Mills/Beatty), which avoids the circle.
  *   **The Popper Gap:** Popper's recantation does not bridge the gap between the Classical Formulation and the Propensity Formulation. He simply waved his hand and said, "It's testable now."

  Therefore, the ID proponents are not necessarily "quote-mining" a view Popper abandoned; they are highlighting a logical vulnerability in the *definition* of fitness that Popper identified, which Popper himself failed to logically resolve in his recantation. The resolution came from philosophy of biology (Mills/Beatty), not from Popper's change of heart.

  ### Summary for the Article
  The strongest argument is that **admitting testability is not the same as explaining testability.**

  Popper's recantation was an admission that evolutionary biology *works* as a science, but it offered no logical defense against the charge that its core principle was tautological. He validated the practice without repairing the definition. The actual repair required a semantic shift from "fitness as outcome" to "fitness as propensity," a technical maneuver executed by Mills and Beatty, not Popper.

  To claim Popper's recantation "settles" the tautology issue is to confuse a change of opinion with a change of logic. The logic remained circular until the definition of fitness was altered by others. Thus, the tautology objection remains a potent critique of the *classical* phrasing of natural selection, and Popper's recantation does not, on its own terms, disarm it.
