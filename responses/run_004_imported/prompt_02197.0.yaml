  2.  **Deconstruct Kant's Argument in the Third Definitive Article:**
      *   **Core Concept:** Universal Hospitality (*Weltbürgerrecht* - Cosmopolitan Right).
      *   **Definition:** Not philanthropy, but *Right*. The right of a stranger not to be treated with hostility upon arrival.
      *   **Limit:** Can be turned away *if* it doesn't cause death. Cannot be treated as an enemy if peaceful.
      *   **Distinction:** Visitor (*Besucher*) vs. Guest (*Gast*). Guest implies a special agreement/friendship/membership. Visitor implies temporary interaction.
      *   **Grounding:** Common possession of the earth's surface (*communio fundi originaria*). Because the earth is a sphere, humans must tolerate proximity. No one originally has more right to a place than another.
      *   **Purpose:** To establish conditions for peaceful interaction and commerce, leading eventually to perpetual peace.

  3.  **Address Question 1 & 2: Principled Rationale vs. Rhetorical Work & Thin vs. Thick Rights:**
      *   *Why thin?* Kant isn't arguing for open borders in the modern sense. He is arguing against *colonialism* and *hostility*. The historical context is crucial (European expansionism).
      *   *The "Common Possession" Argument:* It's not about individual ownership but about the *possibility* of interaction. If the earth were infinite/flat, we could avoid each other. Since it's a sphere, we *must* interact. Therefore, we need a rule for that interaction.
      *   *The Limit:* The right is to *attempt* interaction, not to *force* integration. Why? Because political communities (states) have their own sovereignty (First and Second Definitive Articles). Cosmopolitan right complements state right; it doesn't dissolve it.
