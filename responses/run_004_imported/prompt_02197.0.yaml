answer: |-
  This is an excellent pedagogical instinct. Placing Kant's *Perpetual Peace* alongside Wellman and Carens reveals that the tension between universal moral claims and particular political obligations is not a bug of modern liberalism, but a feature of its architecture.

  To answer your specific questions: the distinction between "guest" and "visitor" is doing heavy **principled** work, not merely rhetorical work, but understanding *why* requires looking at what Kant thinks cosmopolitan right is *for*. It is not a theory of distributive justice or membership; it is a theory of **communication and non-aggression.**

  Here is a breakdown of the philosophical mechanics at play, followed by an assessment of how this maps onto your contemporary readings.

  ### 1. Why is the Right so "Thin"? (Visitor vs. Guest)

  You are rightly puzzled that an "original common possession of the earth" yields only a right to *visit* rather than to *reside*. On Kant's premises, this limitation is principled for two main reasons:

  **A. The Distinction between Possession and Interaction**
  For Kant, the "common possession of the surface of the earth" (*communio fundi originaria*) does not mean that all property is held in common (which would be communism) or that everyone owns everything equally (which would make specific property rights impossible). Rather, it means that no one has a *natural* privilege to be anywhere specific that overrides anyone else's potential claim.
  Because the earth is a sphere, we cannot disperse infinitely; we must eventually encounter one another. Therefore, we need a juridical rule for that encounter. The right of hospitality is the right to *initiate interaction* without being killed. It is a right to **seek** commerce or communication.
  *   **Visitor (*Besucher*):** Someone seeking interaction.
  *   **Guest (*Gast*):** Someone claiming a right to stay, consume resources, or become part of the household/polity.
  Kant limits the right to the former because granting the latter would dissolve the sovereignty of the host community. If every human had a right to reside anywhere simply by virtue of being human, the concept of a distinct political community (which is secured in the First and Second Definitive Articles) would vanish. Kant is trying to balance *Cosmopolitan Right* with *State Right*, not subsume the latter under the former.

  **B. The Anti-Colonial Context**
  It is impossible to read this article without its historical target: European colonialism. When Kant says the stranger cannot claim the rights of a guest, he is explicitly critiquing the behavior of European trading companies and settlers in the Americas, Africa, and Asia. They arrived claiming a right to settle, convert, and govern (rights of a "guest" or master), often by force.
  Kant is arguing that a European merchant has a right to *offer* trade (visit) without being attacked, but does **not** have a right to force the local population to accept him as a resident or ruler. The "thinness" of the right is a protective measure for the inhabitants of the land against foreign encroachment.

  ### 2. Is the Distinction Rhetorical or Principled?

  It is **principled**, grounded in Kant's broader system of rights (*Rechtslehre*).
  For Kant, rights are about the compatibility of one person's freedom with another's according to a universal law.
  *   If I have a right to *reside* on your land without your consent, my freedom overrides yours.
  *   If I have a right to *approach* your land and offer interaction, and you have a right to refuse (provided I don't die), our freedoms are compatible.
  The constraint you noted ("if this can be done without bringing about his death") is the crucial hinge. It transforms the right from a mere privilege into a humanitarian constraint. It creates a duty of **non-refoulement** avant la lettre. The host cannot exercise their freedom of association (to exclude) in a way that destroys the moral agency (life) of the visitor.

  So, the distinction isn't a sleight of hand; it is the precise boundary line where universal human claims meet particular political sovereignty.

  ### 3. Ammunition for Wellman or Carens?

  The text is too slender to decisively vindicate either, but it provides **structural leverage** for both. This is where the seminar discussion will be most fruitful.

  **For Carens (Open Borders/Cosmopolitanism):**
  *   **The Grounding:** Carens can lean heavily on "No one originally had more right to a particular place on earth than anyone else." This undermines the moral arbitrariness of birthright citizenship. If the earth is originally common, the burden of proof lies on the state to justify exclusion, not on the migrant to justify entry.
  *   **The Death Constraint:** The clause about not turning someone away if it causes death is a powerful wedge. In a world of climate change and economic disparity, does "death" include structural violence? Carens might argue that in a globalized economy, exclusion *does* cause death, triggering Kant's constraint more often than states admit.

  **For Wellman (Freedom of Association/Exclusion):**
  *   **The Visitor/Guest Limit:** Wellman can argue that Kant explicitly validates the state's right to exclude. The stranger has a right to *knock*, not to *enter*. Membership (being a "guest" or citizen) requires a "special charitable compact." This aligns perfectly with Wellman's argument that political communities are like clubs or households; they have a right to determine their own membership to preserve their self-determination.
  *   **Sovereignty:** Kant's system relies on states existing (First and Second Articles). Cosmopolitan right is the *third* layer, not the foundation. Wellman can argue that without the right to exclude visitors, the state cannot maintain the rule of law required to guarantee rights in the first place.

  ### 4. Pedagogical Suggestion: The "Third Way"

  The most valuable lesson for your students might be that Kant offers a **third option** that has largely vanished from contemporary discourse.
  *   **Carens** tends toward: Right to Move/Reside.
  *   **Wellman** tends toward: Right to Exclude.
  *   **Kant** argues for: **Right to Communicate.**

  Kant suggests we have a duty to create a world where people can interact, trade, and speak without fear of violence, even if they do not have a right to settle. In a digital age, or an age of temporary labor visas, does a "right to visit" satisfy our moral obligations more than we admit? Or is it, as your students will likely argue, a convenient fiction that allows wealthy states to exploit labor without granting rights?

  ### A Note on Translation (For your preparation)
  A small philological point to keep in your back pocket: The standard German term in *Perpetual Peace* is **_Hospitalität_**. Your packet uses "Wirtbarkeit" in the parenthetical. While *Wirt* means host, *Hospitalität* is the specific Kantian term (borrowed from the French/Latin tradition). Johnston usually translates this as "hospitality." If a sharp student checks the German, they will find *Hospitalität*. It is worth noting that *Hospitalität* in the 18th century carried connotations of commercial hosting as much as charitable shelter, which reinforces the "visitor" (commercial/interactional) reading over the "guest" (charitable/residential) reading.

  ### Recommended Secondary Pairings
  If you want to scaffold this for grad students, consider pairing the Kant excerpt with:
  1.  **Seyla Benhabib, *The Rights of Others*:** She argues Kant's cosmopolitanism is more radical than it appears and pushes it toward a more Carens-like conclusion regarding refugees.
  2.  **Arthur Ripstein, *Force and Freedom*:** For a rigorous defense of the Kantian view that sovereignty requires the right to exclude (supporting Wellman).
  3.  **Peter Koller, "Cosmopolitan Justice and the Right to Immigration":** Specifically addresses the tension in Kant between common possession and state sovereignty.

  **Summary for the Classroom:**
  Kant is not giving you a verdict; he is giving you the **geometry of the problem**. He shows that you cannot have universal moral equality *and* particular political sovereignty without generating friction. The "visitor" right is the friction-reducing mechanism. Whether that mechanism is sufficient for justice today is exactly the question you want your students to fight over.
