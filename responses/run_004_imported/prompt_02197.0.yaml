      *   **Specific Text:** Ian Johnston's translation of the Third Definitive Article of *Toward Perpetual Peace*.
      *   **Key Questions:**
          1.  Is the guest/visitor distinction principled or rhetorical on Kant's premises?
          2.  Why does common possession generate such a "thin" right (to visit) rather than a "thick" right (to reside)?
