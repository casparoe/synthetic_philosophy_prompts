      *   **Verdict:** It's too slender for *definitive* support for either, but rich for *framing* the debate. It shows the tension is inherent, not just modern. It supports a "middle ground" often ignored today: a right to *seek* entry/interaction, but not necessarily a right to *stay* permanently without consent.

