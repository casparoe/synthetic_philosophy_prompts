answer: |-
  **The Cost of Resolution: Why the Money Pump Vindicates Transitivity**

  The money-pump argument is a staple of decision theory, intended to demonstrate that rational preferences must be transitive. The logic is visceral: if an agent prefers A to B, B to C, and C to A, a cunning bookie can trade the agent around this cycle, charging a small fee at each step. The agent ends up with exactly what they started with, but poorer. Since losing money for nothing is paradigmatically irrational, the underlying cyclical preferences are condemned.

  However, this argument faces a formidable challenge from the theory of dynamic choice. As Edward McClennen and others have noted, a "resolute" agent can anticipate the pump. They can resolve in advance to refuse the final trade that completes the cycle. Similarly, a "sophisticated" agent, using backward induction, might simply refuse to enter the sequence at all. In both cases, the agent avoids exploitation without altering their underlying cyclical preferences. This suggests a provocative conclusion: perhaps the money pump does not prove that transitivity is a requirement of rationality, but only that *naivety* is.

  This essay argues that this conclusion is mistaken. While resolute choice successfully prevents financial loss, it does so at the cost of admitting that cyclical preferences cannot sustain rational agency on their own. The money pump argument succeeds, but for a deeper reason than mere monetary loss. It demonstrates that transitivity is a necessary condition for a unified agent to be guided by their preferences over time. Resolute choice does not vindicate cyclical preferences; it treats them as pathologies that must be managed by a higher-order will. Therefore, transitivity remains a requirement for rationality, because without it, the preferences themselves cease to be the source of rational action.

  To see why, we must first grant the strength of the objection. The standard money pump relies on a specific model of the agent: the "naive" chooser. This agent lives entirely in the moment, maximizing utility at each node of the decision tree without regard for past plans or future consequences. For such an agent, cyclical preferences are indeed fatal. But human agents are rarely purely naive. We have memory, we anticipate the future, and we can bind ourselves.

  McClennen's "resolute choice" posits an agent who makes a plan at time $t_1$ and adheres to it at $t_2$, even if their local preferences at $t_2$ would dictate otherwise. In the money pump scenario, the resolute agent prefers A to B, B to C, and C to A. However, at the start, they resolve: "I will trade A for B, then B for C, but I will *not* trade C for A." When the bookie offers the final trade (C for A), the agent's local preference screams "Take A!" but the agent sticks with C because of the prior resolution. The pump is broken. The agent retains C (which is locally inferior to A) but saves the fee.

  Superficially, this saves non-transitive preferences from the charge of irrationality. The agent is not exploited. However, this defense relies on a subtle but crucial shift in what we mean by "rationality." In standard decision theory, rationality is the property of choices being determined by consistent preferences. If your choices track your preferences, and your preferences are coherent, you are rational.

  In the resolute choice scenario, the final choice (keeping C over A) *contradicts* the agent's current preference (A over C). The choice is not driven by the first-order preference ranking; it is driven by the *resolution*. This means the rationality of the action is not derived from the cyclical preferences, but from a meta-preferential commitment to consistency. The agent is effectively saying, "My preferences at this moment are incoherent, so I will ignore them in favor of my past self's plan."

  If we accept this as a vindication of cyclical preferences, we must accept that rationality has nothing to do with the coherence of an agent's values at any given moment. It reduces rationality to mere strategic cleverness. But this creates a fragmented view of the self. It posits a "planning self" and an "acting self" that are in adversarial relation. The planning self knows the acting self cannot be trusted to follow the preference ranking because the ranking is cyclical. The resolution is a leash placed on a dog that is known to run in circles.

  Consider the analogy of Ulysses and the Sirens. Ulysses binds himself to the mast because he knows that when he hears the Sirens, his preference will be to steer toward the rocks. We do not look at Ulysses' desire to crash into the rocks and declare it "rational because he bound himself." We recognize that the binding was necessary precisely because the desire was irrational relative to his survival plan. The binding admits the defect; it does not cure it. Similarly, the resolute chooser admits that their cyclical preferences are defective guides for action. They require an external scaffolding (the resolution) to prevent self-destruction.

  Furthermore, relying on resolute choice imposes a heavy cognitive and normative burden that transitive preferences do not. A transitive agent does not need to exercise "willpower" or "resolution" to avoid the money pump. Their preferences naturally guide them away from the cycle. For the transitive agent, rationality is automatic and frictionless. For the cyclical agent employing resolute choice, rationality is a struggle against their own valuations. If two agents achieve the same outcome (avoiding the pump), but one does so through coherent values and the other through self-binding against incoherent values, we should not judge them equally rational. The former possesses *structural* rationality; the latter possesses only *strategic* rationality.

  The "sophisticated" chooser fares no better. This agent uses backward induction to foresee that they will be pumped, and thus refuses to start the sequence. While this avoids loss, it leads to paralysis. If the cycle involves options that are genuinely beneficial (e.g., A is better than status quo, B better than A, etc., but C loops back), the sophisticated agent may forego all gains simply because they cannot trust their future self to stop. This is a failure of agency. An agent who cannot engage in beneficial exchanges because their preference structure is cyclically unstable is functionally impaired. Transitivity is the condition that allows an agent to engage with the world without fear of their own future choices.

  Critics might argue that this begs the question by assuming rationality requires a unified, frictionless agency. They might claim that diachronic rationality—managing oneself over time—is the true standard, and resolute choice meets that standard. But this misunderstands the role of preferences. Preferences are supposed to represent what is good for the agent. If an agent's representation of "what is good" cycles (A is better than B, B better than C, C better than A), then the agent has no stable direction. Resolute choice imposes a direction artificially. It creates a *fiction* of transitivity through force of will.

  If we allow that cyclical preferences are rational provided one is resolute, we sever the link between rationality and the good. We allow that an agent can be rational even if their values tell them to go in circles, provided they have the discipline to walk in a straight line. But this makes "rationality" a purely procedural label, detached from the content of the agent's mind. A more robust conception of rationality requires that the *sources* of action (the preferences) be coherent, not just the *outcomes*.

  The money pump argument, therefore, stands. It shows that cyclical preferences are incompatible with the status of a unified rational agent. The fact that a resolute chooser can avoid the pump does not save the preferences; it saves the agent from the preferences. The need for resolution is the diagnostic symptom of the irrationality. If your preferences require you to bind yourself to avoid exploitation, those preferences are not fit to guide a rational life.

  In conclusion, the money pump argument does not merely condemn naive choosers. It reveals that transitivity is a structural prerequisite for preferences to function as guides for action over time. Resolute choice is not a counter-example that validates cyclical preferences; it is a coping mechanism that acknowledges their defect. A rational agent should not need to fight their own valuations to avoid being pumped. Transitivity ensures that the agent's future self is a partner, not an adversary. Thus, the verdict is clear: cyclical preferences are irrational, not because they inevitably lead to bankruptcy, but because they necessitate a fragmentation of the self that rationality seeks to overcome. The money pump succeeds because it exposes that without transitivity, you are not one agent making a plan, but many agents fighting a war.
