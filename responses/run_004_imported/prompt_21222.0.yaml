answer: |-
  It is wonderful to hear from a fellow physicist who has found a second wind in philosophy. Your niece has excellent taste; Glymour's "Problem of Old Evidence" (POE) is a classic for a reason. It strikes at the heart of how we rationalize scientific history.

  However, I need to offer a gentle correction to your conclusion, which is currently the inverse of the consensus among philosophers of science and scientifically-literate Bayesians.

  You are interpreting the Problem of Old Evidence as a **revelation about scientific practice** (i.e., "We thought this confirmed the theory, but the math says it doesn't, so we are deluded").

  The actual consensus is that it is a **limitation of the formal model** (i.e., "We know this confirmed the theory, so the simple $P(E)=1$ model is too rigid to capture how confirmation actually works").

  If you tell your colleague to throw out the rotation-curve argument, or if you mentally downgrade Mercury's perihelion, you would be falling into a trap of "physics envy" regarding the philosophy. You would be privileging a simplified equation over the actual epistemic norms that make science successful.

  Here is the principled way to resolve the tension, tailored to your background.

  ### 1. The Math vs. The History
  You are correct about the static Bayesian math. If $P(E) = 1$, then $P(H|E) = P(H)$. In a static snapshot where the evidence is treated as a certain fact, learning that $H$ entails $E$ provides no boost to $H$.

  But science is not static. It is a temporal process of learning. When Einstein calculated the perihelion shift in 1915, he did not learn $E$ (the 43 arcseconds/century). He learned something else: **He learned that $H$ entails $E$.**

  In the language of the philosopher Daniel Garber (who offered one of the standard solutions to POE), the confirmation comes not from updating on $E$, but from updating on the logical relation $(H \rightarrow E)$. Before 1915, it was possible that $H$ (General Relativity) was true but did *not* account for the perihelion (perhaps the field equations would need modification). When Einstein derived the number, he collapsed the uncertainty about the *connection* between theory and data.

  So, the "new evidence" isn't the orbit of Mercury; it's the derivability of the orbit of Mercury from the field equations.

  ### 2. The Counterfactual (Ur-Prior) Approach
  Another standard solution is to ask: "What would our credence in $H$ have been if we *didn't* know $E$?"

  This is the "Ur-prior" approach. We reconstruct a hypothetical state of ignorance where the perihelion anomaly was unknown. In that state, GR would have made a bold, risky prediction. Because GR successfully "predicts" (in this counterfactual sense) a precise, difficult number without free parameters, we assign it high confirmation value in our current state.

  This preserves the intuition that explaining old data is valuable, provided the theory didn't simply *curve-fit* that data.

  ### 3. Application to Your Cases: GR vs. MOND
  This is where the distinction matters for your debate with your colleague. While both involve "old evidence," the epistemic weight is different because of **construction vs. derivation.**

  **General Relativity & Mercury:**
  Einstein did not construct GR to solve the Mercury anomaly. He constructed it based on principles of equivalence and general covariance. The fact that the Mercury solution "fell out" of the equations was a surprise constraint.
  *   **Verdict:** This is strong confirmation. The theory was constrained by principles, not by the data point. The "old evidence" acts as a severe test that the theory happened to pass. Do not downgrade this.

  **MOND & Rotation Curves:**
  Milgrom proposed MOND specifically to address the flattening of rotation curves (and the Tully-Fisher relation). The theory was *constructed* to accommodate that specific old evidence.
  *   **Verdict:** This is weaker confirmation. In Bayesian terms, this touches on the "problem of accommodation." If you tune a theory to fit existing data, you have used up your "degrees of freedom."
  *   **The Nuance:** However, it is not *zero* confirmation. If MOND fits the data with a single universal constant ($a_0$) across vastly different galaxies, that is a non-trivial constraint. It suggests a pattern in the "old evidence" that wasn't previously unified.

  ### 4. Advice for Your Colleague (and You)
  You asked for a principled way to correct for the "self-deception." Here is the correction:

  **Do not discard accommodation; discount it relative to novel prediction.**
  The Bayesian intuition that "prediction is better than accommodation" is robust, even if the $P(E)=1$ math is clumsy.
  *   **Novel Prediction:** The theory restricts what *can* happen in the future. If it's wrong, the theory dies. (High risk, high reward).
  *   **Accommodation (Old Evidence):** The theory restricts what *could have been* the case regarding the past. If the theory was built to fit it, the risk is lower. (Lower risk, lower reward).

  **For your colleague:** Tell him that rotation curves are valid evidence for MOND, but they do not carry the same weight as a *novel* prediction (e.g., if MOND predicted a specific gravitational lensing signature that Dark Matter didn't, and we found it tomorrow). He cannot claim MOND is "confirmed" solely by the data it was designed to fit, especially when the competing paradigm (Dark Matter + Lambda CDM) fits that same data (via halo tuning) and succeeds better on cosmological scales (CMB, large-scale structure).

  **For you:** Keep Mercury in the GR column. The "surprise" was not the data, but the theoretical derivation. The confirmation came from the **unification** of gravity and inertia yielding a specific number that matched an anomaly, without that anomaly being an input.

  ### Summary
  Your niece sent you that paper to show you that formal epistemology is hard, not to show you that physics history is wrong. The "feeling" of confirmation you have regarding Mercury is rational; the simple Bayesian formula is what needs the "correction," not your intuition.

  The POE teaches us that confirmation isn't just about data updating probabilities; it's about **theoretical unification and constraint.** GR constrained the perihelion without being told to. MOND was told to constrain the rotation curves. Both are evidence, but the former is the stronger epistemic currency.

  Enjoy the philosophy—it's much like condensed matter. You're looking for the phase transitions in reasoning, where the intuitive breaks from the formal. Just don't let the model dictate the reality.
