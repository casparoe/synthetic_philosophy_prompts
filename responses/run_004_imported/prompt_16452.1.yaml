      *   *Move 2:* Lena wins. Kwame assumes TWI is coherent without defending it. This is a standard meta-metaphysical checkmate.
      *   *Move 3:* Kwame wins a point on *precision*. CT introduces vagueness where TWI claims precision. Even if vagueness is acceptable, it's a cost.
      *   *Move 4:* Lena wins on *consistency*. She shows the cost is acceptable within Lewis's broader semantics.

      *Refinement:* "Winning" in philosophy is slippery. I should frame it as "Who makes the stronger dialectical move?"
      *   Move 1: Kwame. It's the most famous objection for a reason. It exposes the counter-intuitive consequence.
      *   Move 2: Lena. It exposes the hidden cost of Kwame's position.
