          *   *Weakness:* Doesn't fully address the "aboutness" worry, just deflects to the opponent's problems.
          *   *Verdict:* Strong metaphysical point. Exposes the cost of the alternative.

      *   **Move 3 (Kwame): The Indeterminacy/Many Counterparts Objection.**
          *   *Claim:* Similarity is vague. If two counterparts tie, modal claims become indeterminate. TWI is determinate (either he is there or he isn't).
          *   *Strength:* Highlights a disanalogy between TWI and CT. TWI is binary; CT is graded/vague.
          *   *Weakness:* Lewis accepts vagueness. Is TWI *really* determinate? (See: Essentialism problems). Also, Lewis has resources to handle this (contextual salience).
