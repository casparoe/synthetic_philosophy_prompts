      *   *Selected Comeback:* The **Context-Sensitivity/Instability** objection. Lena says vagueness is harmless. But if truth values shift based on conversational context (which counterpart relation is salient), then "Humphrey could have won" isn't a stable fact about Humphrey, but a fact about our conversation. This undermines the objective nature of modality.

