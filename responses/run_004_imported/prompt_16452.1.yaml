      *   *Overall:* It's a stalemate between Intuition (Kwame) and Systematicity (Lena).
      *   *The Missing Comeback:* Focus on **Contextual Instability**. Lewis admits counterpart relations are context-sensitive. This means modal truths aren't fixed facts about the world but depend on our interests. Kwame could argue this makes modality too subjective.

