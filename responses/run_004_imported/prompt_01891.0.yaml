      *   *Example:* "Carrying" (active) vs. "Being carried" (passive).
      *   *Claim:* A thing is not "being carried" *because* it is in the state of "being carried." Rather, it is in the state of "being carried" *because* someone is carrying it. The action causes the state.
      *   *Application to Piety:*
          *   Option A: Piety is the *essence*. The Gods' love is the *reaction*. (State: Loved. Action: Loving. Cause: Piety).
          *   Option B: The Gods' love is the *essence*. Piety is the *result*. (State: Pious. Action: Loving. Cause: God's Love).
      *   *Euthyphro's Definition:* Piety = What is loved by the gods.
      *   *Socrates' Trap:* Euthyphro agrees that the gods love pious things *because* they are pious (intrinsic quality). But he also defines piety *as* what is loved by the gods (extrinsic status).
      *   *Contradiction:* If Piety causes the Love, then Love cannot define Piety. If Love defines Piety, then Piety cannot cause the Love.

  3.  **Address the "Why does direction matter?" Question:**
      *   This is the core metaphysical issue.
      *   *Direction 1 (Realism):* Piety exists independently. Gods recognize it. (Moral Truth > God).
