prompt: |-
  So a while back I got into it with my cousin, who's pretty religious, about whether something's wrong just because God says its wrong, or if God only forbids it because its already wrong on its own. She told me I was basically doing a bad amateur version of "the Euthyphro dilemma" and should actually go read the dialogue instead of getting my philosophy from Reddit threads, lol. So I found a free version online (Jowett's translation, from the 1870s I think) and sat down and actually read the thing properly.

  Here's my problem though. The famous one-line version of the dilemma — is it pious because the gods love it, or do the gods love it because its pious — is easy enough, I basically knew that part going in. But when Socrates actually walks through the argument for WHY those have to be two genuinely different things instead of just two names for the same thing, he goes off on this whole detour about carrying, leading, and seeing that I've now read about five times and still can't fully untangle. This is the part that's got me stuck:

  Soc. The point which I should first wish to understand is whether the pious or holy is beloved by the gods because it is holy, or holy because it is beloved of the gods.

  Euth. I do not understand your meaning, Socrates.

  Soc. I will endeavour to explain: we, speak of carrying and we speak of being carried, of leading and being led, seeing and being seen. You know that in all such cases there is a difference, and you know also in what the difference lies?

  Euth. I think that I understand.

  Soc. And is not that which is beloved distinct from that which loves?

  Euth. Certainly.

  Soc. Well; and now tell me, is that which is carried in this state of carrying because it is carried, or for some other reason?

  Euth. No; that is the reason.

  Soc. And the same is true of what is led and of what is seen?

  Euth. True.

  Soc. And a thing is not seen because it is visible, but conversely, visible because it is seen; nor is a thing led because it is in the state of being led, or carried because it is in the state of being carried, but the converse of this. And now I think, Euthyphro, that my meaning will be intelligible; and my meaning is, that any state of action or passion implies previous action or passion. It does not become because it is becoming, but it is in a state of becoming because it becomes; neither does it suffer because it is in a state of suffering, but it is in a state of suffering because it suffers. Do you not agree?

  Euth. Yes.

  Soc. Is not that which is loved in some state either of becoming or suffering?

  Euth. Yes.

  Soc. And the same holds as in the previous instances; the state of being loved follows the act of being loved, and not the act the state.

  Euth. Certainly.

  Soc. And what do you say of piety, Euthyphro: is not piety, according to your definition, loved by all the gods?

  Euth. Yes.

  Soc. Because it is pious or holy, or for some other reason?

  Euth. No, that is the reason.

  Soc. It is loved because it is holy, not holy because it is loved?

  Euth. Yes.

  Soc. And that which is dear to the gods is loved by them, and is in a state to be loved of them because it is loved of them?

  Euth. Certainly.

  Soc. Then that which is dear to the gods, Euthyphro, is not holy, nor is that which is holy loved of God, as you affirm; but they are two different things.

  Ok so I can sort of feel that he's using the carrying/leading/seeing stuff to make some point about "why X is in a certain state" versus "why we happen to call X that", but I can't spell out the actual logic connecting that setup to the conclusion at the end. Why does it matter so much which direction the "because" points in? Couldn't you just say being-loved-by-the-gods and being-holy always go together, full stop, without needing one to explain the other? Also, is this actually a tight piece of reasoning, or is Socrates kind of sneaking something past poor Euthyphro using the grammar of Greek verbs (or however this works in translation)? My roommate insists its "obviously valid" but when I asked him to explain it back to me he just trailed off. Could someone actually walk me through, step by step, what's doing the real logical work in this passage, and give me a sense of whether philosophers generally think this specific argument (not just the dilemma as a whole) actually holds up?
