answer: |-
  It is a genuine pleasure to engage with a colleague who brings four decades of empirical rigour to a debate often dominated by armchair speculation. Your work on reciprocal altruism in *Desmodus rotundus* (Wilkinson 1984, et al.) is foundational; if anyone is entitled to be skeptical of loose adaptationist storytelling in metaethics, it is you.

  Here are my comments on your three specific requests, keeping in mind that you will be presenting this to a philosophy reading group.

  ### 1. Fairness of Representation

  You have represented the *structure* of Street's dilemma and the standard realist replies (Enoch, etc.) fairly, but there is one nuance you should anticipate being pressed on by the philosophers in the room.

  Street's argument relies on the premise that evolutionary forces shaped our **evaluative tendencies** (e.g., the tendency to value survival, the well-being of offspring, cooperation). She does not strictly require that "fairness" or "reciprocity" be specific, modular adaptations with dedicated genetic loci. She requires only that the *psychological mechanisms* generating these judgments were selected because they tended to promote reproductive fitness.

  **The Potential Pushback:** A Street defender might argue that even if "fairness" is a by-product (spandrel) of general intelligence or language capacity, that general capacity was still selected for fitness-enhancing reasoning. Therefore, the "adaptive link" remains: we have the moral beliefs we have because the cognitive machinery that produces them was filtered by natural selection for survival-promoting outputs.

  **Your Counter:** Your objection holds because Street and the debunkers often slide from "evolution influenced our cognition" to "evolution selected for *these specific* normative contents." If fairness is a cultural exaptation riding on general cognition, the claim that evolution *explains* the content of "fairness" (rather than just the capacity to learn norms) is significantly weakened. You are right to flag that philosophers often treat "evolutionary influence" as a monolith, ignoring the distinction between direct adaptation, exaptation, and drift.

  **Verdict:** Your representation is fair enough for a sketch, but be prepared to clarify that your critique targets the **specificity** of the adaptationist claim (that selection targeted *moral* content) rather than the general claim that humans are evolved organisms.

  ### 2. Literature Check: Has this been noticed?

  Yes, but not with the biological rigour you are bringing. This is your opportunity to contribute something new.

  *   **Richard Joyce:** In *The Evolution of Morality* (2006), Joyce explicitly hangs his debunking argument on the claim that morality is an adaptation. He reviews the biological evidence (Chapter 4) and concludes it is "probable" but admits the evidence is not conclusive. He is your primary target. If you can show Joyce's biological evidence doesn't meet the standard of behavioural ecology, you strike at the heart of the standard debunking case.
  *   **William FitzPatrick:** In "Debunking Evolutionary Debunking of Ethical Realism" (2015), FitzPatrick critiques the biological assumptions of debunkers. He argues that debunkers oversimplify the relationship between genes and moral beliefs. He is a realist, but his critique of the biology aligns with yours.
  *   **Stephen Jay Gould & Richard Lewontin:** Obviously, you know the source ("The Spandrels of San Marco," 1979). In metaethics, this is often cited as a banner rather than a methodological constraint.
  *   **Philosophy of Biology Crowd:** Look at **Paul Griffiths** and **Ron Mallon** (e.g., "Evolutionary Approaches to Emotion," 1999). They discuss the "adaptation vs. by-product" debate in the context of psychology.
  *   **Recent Work:** **Knut Olav Skarsaune** ("Darwin and Moral Realism," 2011) discusses the biological assumptions. Also, **Michael T. Dale** has written on the biological assumptions in debunking arguments.

  **The Gap:** While these authors acknowledge the problem, few have applied the *methodological* standards of behavioural ecology (heritability data, selection differentials, exclusion of drift) to the metaethical debate. Most philosophers accept "plausibility" where a biologist demands "evidence." You are not reinventing the wheel, but you are tightening the bolts.

  ### 3. The Implication: Does it weaken both sides?

  This is the most philosophically significant part of your query. My assessment is that undermining the adaptationist assumption **weakens the Debunker (Street/Joyce) more than the Realist.**

  Here is why:

  1.  **The Debunker's Burden:** The evolutionary debunking argument (EDA) gains its skeptical force from the claim that evolution *explains* our moral beliefs *without reference to their truth*. The stronger the causal link between "fitness" and "specific moral content," the stronger the debunk. If "fairness" is merely a spandrel or a cultural by-product, the direct causal link between selection and *this specific belief* is severed. The debunker can no longer say, "You believe fairness is good because it increased fitness." They must say, "You believe fairness is good because of a complex cascade of cognitive by-products and cultural evolution." This makes the genealogy messier and less determinative, leaving more room for rational reflection to track truth.
  2.  **The Realist's Opportunity:** If moral dispositions are not hard-wired adaptations for survival, they may be outputs of general reasoning capacities. Realists (like Parfit or Enoch) often argue that our rational capacities *can* track truth. If morality is a product of rational reflection (even if housed in an evolved brain) rather than a direct instinct selected for cooperation, the Realist has more space to argue that we can correct our instincts via reason.
  3.  **The "Coincidence" Horn:** You ask if it weakens the Realist's tracking story. It does make tracking harder to explain (if the trait wasn't selected for accuracy). However, Street's dilemma forces the Realist into the "Coincidence" horn *if* the adaptive link is accepted. If the adaptive link is rejected (because it's a spandrel), the dilemma itself loses its grip. The debate shifts from "Evolution vs. Truth" to "Cultural Evolution/Reason vs. Truth," which is a friendlier battlefield for the Realist.

  **Conclusion on Point 3:** It does not weaken both sides equally. It destabilizes the **Debunker's** primary weapon (the adaptive explanation of content). It forces the debate back to whether human reason *itself* (the spandrel-generating machinery) can track normative truth. This is a harder argument for the debunker to win than "genes made us think this to survive."

  ### Advice for the Presentation

  1.  **Lead with the Bats:** Start with your vampire bat work. Explain how hard it is to prove reciprocal altruism is an adaptation (distinguishing it from mutualism, harassment avoidance, etc.). Use this to illustrate the evidentiary bar that metaethicists are failing to meet.
  2.  **Target Joyce:** Since Joyce is the most prominent defender of the "morality as adaptation" thesis, frame your objection as a critique of his biological premises.
  3.  **Avoid "Settled" Claims:** Don't claim morality *isn't* an adaptation. Claim that the *evidence is currently insufficient* to treat it as one for the purposes of a philosophical proof. This is a methodological objection, which is harder to dismiss.
  4.  **Expect the "Broad Adaptation" Retreat:** Be ready for the philosophers to retreat to the claim that "general cognition" was adapted. Your counter is that general cognition does not dictate specific normative content (e.g., "fairness" vs. "honour"), which is where the variation lies.

  You are not embarrassing yourself; you are bringing empirical ballast to a discussion that is often too light. Parfit would have welcomed the scrutiny. Good luck with the group.
