answer: |-
  David Lewis's "Big Bad Bug" is one of the most famous problems in contemporary metaphysics and philosophy of probability. It arises from the tension between two of Lewis's central commitments: the **Principal Principle** (connecting chance to rational credence) and **Humean Supervenience** (the metaphysical basis of chance).

  Here is an explanation of the inconsistency, Lewis's response regarding admissibility, and an evaluation of whether that response is principled or ad hoc.

  ### 1. Why Undermining Futures Threaten Inconsistency

  To understand the inconsistency, we must first define the conflicting components.

  **The Principal Principle (PP):**
  Roughly stated, the PP says that if a rational agent knows that the objective chance of a proposition $A$ is $x$, and possesses no "inadmissible" evidence, their credence (subjective degree of belief) in $A$ should also be $x$.
  $$C(A \mid \text{Ch}(A) = x \ \& \ E) = x$$
  (where $E$ is admissible evidence).

  **Humean Supervenience (HS):**
  Lewis holds that chances are not primitive metaphysical propensities. Instead, they supervene on the "Humean Mosaic"—the total distribution of qualitative particular matters of fact across all of space and time. Specifically, via the **Best System Analysis**, the chances at a time are determined by the system of laws that best balances simplicity and strength in describing the *entire* history of the world (past, present, and future).

  **The Contradiction:**
  The "Big Bad Bug" arises because HS makes the present chance distribution dependent on the future, while the PP treats the present chance distribution as a guide to the future.

  1.  Let $T$ be the true theory of chance at time $t$ (derived from the Best System of the actual history).
  2.  Let $F$ be an "undermining future." This is a possible future course of events such that:
      *   According to $T$, $F$ has a positive chance of occurring ($\text{Ch}_T(F) > 0$).
      *   However, if $F$ *were* to occur, the total history would be different. Given this new total history, the Best System would *not* be $T$, but some other theory $T'$.
  3.  Therefore, on HS, the truth of $T$ entails that $F$ does **not** occur. (If $F$ occurred, $T$ would not be the true theory of chance). So, $T \rightarrow \neg F$.
  4.  Now, apply the Principal Principle. If an agent knows $T$, they know the chances are those specified by $T$. Since $\text{Ch}_T(F) > 0$, the PP dictates that the agent's credence in $F$ given $T$ should be positive:
      $$C(F \mid T) = \text{Ch}_T(F) > 0$$
  5.  However, simple logic dictates that if $T$ entails $\neg F$, the credence in $F$ given $T$ must be zero:
      $$C(F \mid T) = 0$$
  6.  **Result:** We have a contradiction ($x > 0$ and $0$). The PP and HS cannot both be true as originally formulated.

  ### 2. Lewis's Response: Ruling Evidence Inadmissible

  Lewis refused to abandon Humean Supervenience, as it was the cornerstone of his metaphysics. He also wished to preserve the spirit of the Principal Principle. His solution was to tighten the **admissibility** clause of the PP.

  **The Intuition of Admissibility:**
  Originally, Lewis characterized admissible evidence as information that does not give the agent "crystal ball" knowledge of the future. Standard examples of admissible evidence include the history of the world up to the present time and information about the present setup of a chance process (e.g., the coin is fair).

  **The Fix:**
  Lewis argued that on Humean Supervenience, knowing the true chance theory $T$ *is* a form of crystal ball knowledge. Because $T$ supervenes on the whole of history, knowing $T$ implicitly gives you information about the future (specifically, it rules out any future that would make $T$ false, i.e., undermining futures).

  Therefore, Lewis concluded that **propositions specifying the true chance distribution (like $T$) are inadmissible evidence.**

  If $T$ is inadmissible, the Principal Principle does not apply to the conditional credence $C(F \mid T)$. The requirement that $C(F \mid T)$ must equal $\text{Ch}_T(F)$ is lifted. The contradiction dissolves because the PP simply does not govern how we should believe when we possess information about the global chance theory.

  Lewis formalized this in a **Revised Principal Principle (RPP)**, which essentially says that rational credence should match chance only when conditionalized on the *history up to time t* (which is admissible), rather than the *theory of chance* (which is inadmissible on HS).

  ### 3. Evaluation: Principled or Ad Hoc?

  Whether Lewis's response is principled or ad hoc is a matter of significant debate. While it succeeds in making the system logically consistent, I argue that it functions largely as an **ad hoc patch** that undermines the philosophical utility of the Principal Principle.

  **Arguments for it being Principled:**
  One could argue Lewis is merely following the definition of admissibility to its logical conclusion. If "admissible" means "contains no information about the future," and HS entails that chance theories contain information about the future, then it is consistent to label chance theories inadmissible. In this view, Lewis is prioritizing the definition of terms to maintain internal coherence.

  **Arguments for it being Ad Hoc:**
  However, the response is widely regarded as damaging for three reasons:

  1.  **Loss of Normative Force:** The original power of the Principal Principle was that it told us how to align our beliefs with objective chances *as discovered by science*. Scientists propose theories ($T$) about chance. The PP told us to set our credences according to those theories. By ruling $T$ inadmissible, Lewis severs the link between our best scientific theories of chance and rational belief. We are left with a principle that tells us how to believe if we know the "admissible" history, but we rarely know the admissible history without relying on theories that are now deemed inadmissible.
  2.  **Redefining the Problem Away:** The move looks like a technical maneuver to save a metaphysical thesis (HS) from a counterexample. The intuitive force of the PP is that chance *should* guide credence. If the metaphysics of chance (HS) makes it so that chance *cannot* guide credence (because knowing chance is inadmissible), the metaphysics is arguably failing to capture the concept of chance we care about.
  3.  **The "Bug" Remains Intuitive:** Even if the logic is blocked, the philosophical tension remains. It is deeply counterintuitive that a rational agent, knowing the true laws of chance, should not set their credences to match those laws. Lewis's fix requires us to accept that rational agents must ignore the implications of the true chance theory regarding undermining futures, which feels like an artificial constraint imposed to save the theory.

  **Conclusion:**
  While Lewis's response is logically valid and saves his system from formal contradiction, it is **merely an ad hoc patch**. It preserves the letter of the Principal Principle while violating its spirit. It renders the principle unable to do the work it was designed to do: connecting objective chance as understood by science to the subjective degrees of belief of rational agents. By making the true theory of chance inadmissible, Lewis protects Humean Supervenience at the cost of making the Principal Principle practically inert for agents trying to reason about the world using scientific theories.
