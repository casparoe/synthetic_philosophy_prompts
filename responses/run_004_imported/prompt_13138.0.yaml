answer: |-
  **MEMORANDUM**

  **TO:** Clinical Policy Committee, Outpatient Bereavement and Loss Program
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Routine Screening and Diagnosis of Prolonged Grief Disorder (PGD)

  **Purpose**
  This memo summarizes the deliberation regarding the proposal to adopt formal screening and diagnosis for Prolonged Grief Disorder (PGD) as a routine component of patient intake. It evaluates the clinical necessity of the DSM-5-TR classification against conceptual risks regarding diagnostic implementation, concluding with a recommendation for conditional adoption.

  **Clinical Rationale**
  The primary argument for adoption is access to care. Currently, patients presenting with severe, chronic impairment following loss often lack a specific billing code. This results in denied claims, capped sessions, or reliance on proxy diagnoses (e.g., MDD, PTSD) that do not accurately capture the phenomenology of their suffering or guide appropriate intervention. Formalizing PGD diagnosis allows for referral into evidence-based modalities such as Complicated Grief Treatment (CGT) and secures insurance reimbursement. For a significant subset of our population, the diagnostic label is not merely descriptive but instrumental in validating suffering that is otherwise dismissed as "normal."

  **Conceptual Constraints and Risks**
  However, the committee must weigh these benefits against the "looping effects" inherent in psychiatric classification. As noted in recent scholarly critique (drawing on Hacking's account of interactive kinds), diagnostic categories do not simply identify static populations; they alter how patients experience and narrate their symptoms.

  If we implement routine screening using instruments like the PG-13-R without safeguards, we risk:
  1.  **Narrative Constriction:** Patients may begin to shape their grief narratives to fit the checklist criteria (e.g., focusing on "identity disruption" because it is a billable symptom), potentially obscuring other meaningful aspects of their bereavement.
  2.  **Threshold Instability:** The discrepancy between DSM-5-TR (12 months) and ICD-11 (6 months) suggests the boundary between pathological and normative grief is not yet settled. Rigid adherence to these thresholds may pathologize acute distress that would otherwise resolve, or conversely, delay care arbitrarily.
  3.  **Feedback Loops:** Widespread screening may expand the population of "borderline" cases, altering the clinical phenotype of the disorder over time and complicating long-term treatment efficacy data.

  **Recommendation**
  To balance patient access with conceptual humility, I recommend we **Adopt with Specific Conditions.**

  We should integrate the PG-13-R as a *screening* tool, not a standalone diagnostic arbiter, under the following protocols:

  1.  **Dual-Track Assessment:** A positive screen on the PG-13-R must be followed by a semi-structured clinical interview. The diagnosis cannot be assigned based solely on the instrument score. Clinicians must document a narrative account of the loss that contextualizes the symptoms, ensuring the checklist does not replace the clinical story.
  2.  **Threshold Flexibility:** While we will align with the DSM-5-TR 12-month threshold for billing purposes, clinicians are authorized to code for "Other Specified Trauma- and Stressor-Related Disorder" for patients presenting at 6–12 months with severe impairment, acknowledging the ICD-11 data without violating DSM billing compliance.
  3.  **Clinician Training on Diagnostic Reflexivity:** Prior to rollout, intake staff must complete a module on "Diagnostic Framing in Bereavement." This training will explicitly address looping effects, instructing clinicians to ask patients how *they* understand their grief before introducing the PGD framework, minimizing the imposition of the label on the patient's self-concept.

  **Timeframe and Review**
  Implementation should begin **January 1, 2024**. However, this adoption is provisional. The committee will schedule a mandatory review of PGD utilization data and clinician feedback in **July 2025 (18 months)**. At that time, we will evaluate whether the diagnostic category has stabilized in our population or if the "looping effects" have resulted in significant diagnostic creep or narrative homogenization.

  **Conclusion**
  We have an ethical obligation to treat severe impairment, which requires the leverage of a formal diagnosis. However, we also have an obligation to ensure our tools do not reshape the suffering they are meant to alleviate. Conditional adoption allows us to secure resources for our patients while remaining vigilant about the constitutive power of the labels we apply.
