      *   **Specific Lens:** Frederick Douglass's constitutional interpretation method (textualism/principled reading vs. pro-slavery intent) + his later views on immigration (Composite Nation speech).
      *   **Constraint:** Do *not* just say "he loved liberty." Reconstruct the argument based on his specific reasoning methods.
      *   **Goal:** Determine what Douglass would likely say and whether it challenges either the user's or the friend's assumptions.

  2.  **Deconstruct Frederick Douglass's Constitutional Philosophy:**
      *   *Early Phase (Garrisonian):* The Constitution is a pro-slavery document ("covenant with death").
      *   *Later Phase (Constitutional Abolitionist):* After breaking with Garrison (circa 1851), Douglass argued the Constitution's *text* and *preamble* ("We the People," "secure the Blessings of Liberty") are anti-slavery.
      *   *Key Principle:* Interpret the document based on its written words and broad principles of natural rights, not the secret intentions of the framers (many of whom were slaveholders). If the text allows for liberty, claim it.
      *   *Post-14th Amendment:* Douglass was a fierce advocate for the 14th and 15th Amendments. He saw them as the "reconstruction" of the republic to align with the Declaration of Independence.

  3.  **Analyze the 14th Amendment & "Subject to the Jurisdiction Thereof":**
      *   *Text:* "All persons born or naturalized in the United States, and subject to the jurisdiction thereof, are citizens..."
      *   *Historical Context:* Overturning *Dred Scott* (which said Black people couldn't be citizens).
      *   *The "Jurisdiction" Clause:* What did it exclude? Primarily children of diplomats (immune from US law) and Native Americans (treated as members of sovereign tribes).
      *   *Friend's Argument:* Undocumented immigrants owe allegiance elsewhere, so they aren't "subject to the jurisdiction."
      *   *User's Argument:* It was meant to be broad to fix *Dred Scott*.

  4.  **Connect Douglass's Philosophy to the Specific Issue:**
      *   *Textualism:* Douglass would look at the words. "All persons born... in the United States." That is expansive.
      *   *Jurisdiction:* Douglass understood jurisdiction as *legal authority*, not just political allegiance. If a person is physically in the US, they are subject to US laws (punishable by them). Therefore, they are under US jurisdiction.
      *   *Allegiance vs. Jurisdiction:* The friend conflates "allegiance" (political loyalty) with "jurisdiction" (legal subjection). Douglass was keen on legal rights. If the state can punish you, you are under its jurisdiction.
      *   *The "Composite Nation" Speech (1869):* Douglass explicitly argued against nativism (specifically anti-Chinese sentiment). He argued that once someone is here, they are part of the nation. He opposed exclusion based on race or origin.
      *   *Natural Rights:* Douglass believed citizenship flowed from personhood and presence, not racial pedigree or prior political status.

  5.  **Evaluate the User vs. Friend Debate through Douglass's Lens:**
      *   *Friend's View (Allegiance/Jurisdiction):* Douglass would likely reject this. He distinguished between *political* allegiance (voting/loyalty) and *legal* jurisdiction (obeying laws). Undocumented immigrants are subject to US criminal and civil law. Therefore, they are under jurisdiction. Douglass fought against the idea that a class of people could be physically present but legally invisible (like fugitive slaves).
      *   *User's View (Broad Citizenship/anti-Dred Scott):* Douglass would agree with the *spirit* (broad inclusion), but he might refine the *reasoning*. It's not just about fixing *Dred Scott* for Black Americans; it's about establishing a universal principle of *jus soli* (right of the soil) to prevent caste systems.
      *   *Nuance:* Douglass might challenge the User's focus on *intent* vs. the Friend's focus on *allegiance*. Douglass prioritized the *text* and the *principle of equality*.

  6.  **Drafting the Argument (Iterative Process):**
      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the Douglass angle.
      *   *Douglass's Constitutional Shift:* Explain the move from Garrisonian rejection to textualist appropriation. The Constitution is what it *says*, not what slaveholders *meant*.
      *   *Applying to "Jurisdiction":* Define jurisdiction as legal subjection. If you can be arrested, you are under jurisdiction. Diplomats cannot be arrested; undocumented immigrants can. This refutes the friend.
      *   *Applying to "Composite Nation":* Bring in the 1869 speech. Douglass explicitly welcomed immigrants. He saw exclusion as aristocratic/monarchical, not republican.
      *   *The Verdict:* Who wins? Mostly the User, but with a Douglassian twist. The Friend relies on a distinction (allegiance vs. jurisdiction) that Douglass would see as a tool of exclusion similar to slavery arguments.
      *   *Potential Challenge to User:* Douglass might warn against making citizenship *only* about legal text without ensuring actual equality (the "citizen in law but not in fact" problem). But on the specific legal question, he supports birthright.

  7.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Did Douglass explicitly talk about the 14th Amendment and immigrants?* He talked about the 14th regarding Black Americans and Chinese immigrants in "Composite Nation." He didn't address "undocumented" status specifically because modern immigration law didn't exist then (Chinese Exclusion Act came later, 1882). I need to be careful not to anachronize.
      *   *Correction:* Focus on his *principles* regarding presence and law. In the 1850s, fugitive slaves were "undocumented" in a sense (present but without legal standing). Douglass fought for their recognition as persons under the law.
      *   *Key Distinction:* The Friend argues "allegiance elsewhere." Douglass would argue that *physical presence* creates jurisdiction. You can't claim the protection of US law (if you need police) while claiming immunity from its citizenship requirements.
      *   *Elk v. Wilkins (1884):* This case ruled Native Americans weren't citizens because they owed allegiance to tribes. This supports the "jurisdiction" exception. But Douglass distinguished Native sovereignty from individual migrants.
      *   *United States v. Wong Kim Ark (1898):* This is the legal precedent that aligns with Douglass's view (born here = citizen, regardless of parents' alienage). Douglass died in 1895, but his philosophy aligns with this ruling.

