prompt: |-
  Ok so my friend and I just spent like an hour arguing about birthright citizenship and I need someone to settle it. She was saying "subject to the jurisdiction thereof" in the 14th amendment obviously doesn't cover kids of undocumented immigrants since their parents owe allegiance somewhere else, and I was saying thats a revisionist reading and the whole point of the clause was to settle citizenship broadly after Dred Scott. Somehow we ended up down a rabbit hole about Frederick Douglass, since he was around when the amendment got ratified, and he'd already spent the 1850s hammering out this whole specific theory of constitutional interpretation to break away from Garrison's "covenant with death" crowd -- basically insisting you read the plain text and its general principles, not whatever secret pro-slavery intentions some of the framers might've had. So: given that interpretive method, plus stuff like his later Composite Nation speech defending Chinese immigrants against nativists, what do you honestly think Douglass would say about todays birthright citizenship fight? Don't just tell me "he loved liberty so obviously yes," actually reconstruct the argument he'd make from his own reasoning, and tell me if it cuts against what either of us assumed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Birthright citizenship (14th Amendment, "subject to the jurisdiction thereof").
