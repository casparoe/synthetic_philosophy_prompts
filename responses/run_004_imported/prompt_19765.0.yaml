answer: |-
  This is a genuinely sophisticated historical and legal question. You and your friend have stumbled onto one of the most critical fault lines in American constitutional history, and using Frederick Douglass as the arbiter is a brilliant move. He is arguably the most important non-lawyer interpreter of the 14th Amendment we have.

  If we apply Douglass's specific hermeneutic (method of interpretation) and his post-war political philosophy to this debate, **you win the argument, but Douglass would likely critique the terms you both used.**

  Here is the reconstruction of the argument Douglass would make, based on his break with William Lloyd Garrison, his speeches during Reconstruction, and specifically his 1869 "Composite Nation" address.

  ### 1. The Hermeneutic: Text and Principle vs. Secret Intent
  Your friend's argument relies on a theory of "allegiance." She is essentially arguing that "jurisdiction" implies a political bond of loyalty that undocumented immigrants haven't sworn. This relies on inferring a *secret intention* behind the words "subject to the jurisdiction thereof"—namely, that the framers meant to exclude anyone with a competing political claim.

  Douglass would reject this immediately. Remember his 1851 break with Garrison. Garrison said the Constitution was pro-slavery because the *men who wrote it* were slaveholders and intended it to protect property in humans. Douglass countered that we must look at the **text** and the **principles** declared in the Preamble ("secure the Blessings of Liberty"), not the secret sins of the framers.

  Applied to the 14th Amendment, Douglass would argue: Do not look for the secret exclusionary intent of the Congressmen who voted on it. Look at the words.
  *   **The Text:** "All persons born... in the United States."
  *   **The Qualifier:** "And subject to the jurisdiction thereof."

  Douglass would define "jurisdiction" not as "political allegiance" (your friend's view), but as **legal subjection.** If a person is physically within the territory, they are subject to the laws of that territory. They can be arrested, taxed, and prosecuted. Therefore, they are under the jurisdiction.

  The only people *not* subject to the jurisdiction were those with diplomatic immunity (ambassadors) or members of sovereign Native tribes (who were treated as separate nations via treaty). Undocumented immigrants are not diplomats; they are not members of a sovereign tribe within the US. They are subject to US law. To argue otherwise is to create a class of people who are physically present but legally invisible—a status Douglass fought his entire life against regarding fugitive slaves.

  ### 2. The "Composite Nation" and the Rejection of Caste
  In 1869, Douglass gave his "Composite Nation" speech in Boston. This is the smoking gun for your argument. At the time, there was rising nativist sentiment against Chinese immigrants. Many argued that Chinese laborers could never be citizens because their "allegiance" was to the Emperor, they were racially distinct, and they were sojourners.

  Douglass hammered this. He argued:
  1.  **Cosmopolitanism:** "We are a country of all nations... all races."
  2.  **No Hereditary Caste:** He argued that making citizenship dependent on race or origin was a European/monarchical concept, not a republican one.
  3.  **The Danger of Exclusion:** He warned that if you start excluding one group (the Chinese) based on "alienage," you undermine the security of citizenship for everyone.

  If Douglass argued that Chinese immigrants—who were explicitly barred from naturalization by federal law at the time (until 1943)—should still be welcomed and treated as part of the national fabric, he would certainly argue that their *children*, born on US soil, are full citizens. To do otherwise would be to establish a hereditary caste of non-citizens, which smells too much like the hereditary slavery he just finished destroying.

  ### 3. Where You Both Might Be Wrong
  While Douglass sides with your conclusion (birthright citizenship stands), he would likely challenge the *reasoning* of both you and your friend.

  **Critique of your Friend:**
  She is using a "allegiance-based" theory of citizenship. Douglass would point out that this was the exact logic used to deny citizenship to Black Americans before the 14th Amendment. In *Dred Scott*, Chief Justice Taney argued Black people couldn't be citizens because they weren't part of the "political community" and owed no allegiance to the Constitution. Douglass spent 40 years dismantling that idea. He would say your friend is trying to resurrect *Dred Scott* logic under a new name. If physical presence subjects you to the law, you are under the jurisdiction. Period.

  **Critique of You:**
  You argued the point was to "settle citizenship broadly after *Dred Scott*." Douglass would agree, but he would warn you against thinking the *text alone* is enough. Douglass was a realist. He knew that after the 14th Amendment passed, Black people were legally citizens but were still terrorized by the KKK and stripped of rights by Black Codes.

  He would tell you that winning the argument about "birthright citizenship" is meaningless if those citizens are not protected in their rights. He would say: *"Yes, the child is a citizen by the text. But if you treat them as an alien in practice, you have nullified the amendment just as surely as your friend wants to."*

  ### 4. The Douglassian Verdict
  If you dragged Frederick Douglass into this room, here is the argument he would reconstruct:

  1.  **Jurisdiction is Legal, Not Political:** "Subject to the jurisdiction" means "answerable to the law." Undocumented immigrants answer to US law. Therefore, their children are born under US jurisdiction.
  2.  **Jus Soli Prevents Caste:** The only way to prevent a permanent underclass (like slavery) is to tie citizenship to the *soil*, not the *blood* or the *parents' status*. If the parents' legal status determines the child's citizenship, you create hereditary non-citizenship. Douglass viewed hereditary status as fundamentally anti-republican.
  3.  **The "Composite" Principle:** A nation that excludes people based on origin or the legal status of their parents is building a wall around its own future. He explicitly defended the right of immigrants to come and stay and become part of the nation.

  **The Bottom Line:**
  Your friend is relying on a distinction between "allegiance" and "jurisdiction" that Douglass would view as a semantic trick to exclude people from liberty. You are right that the clause was meant to be broad, but Douglass would add that it must be broad *because* the text says "All persons," not just because of the historical intent to fix *Dred Scott*.

  He would tell your friend: **"You are reading the Constitution like a slave code, looking for loopholes to deny humanity. Read it like a charter of liberty, and the words 'All persons born' mean exactly what they say."**

  So, you win the debate, but Douglass would tell you the fight doesn't end at citizenship; it begins there.
