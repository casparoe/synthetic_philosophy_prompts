answer: |-
  You have hit on one of the most significant conceptual divides in modern decision theory. The tension you are observing is real, but the reason economics, finance, and effective altruism (EA) haven't universally switched to geometric expectation is not primarily due to institutional inertia. It is because **arithmetic expected value (EV) is the correct metric for a different class of problems than the one Kelly solves.**

  The short answer is: **Arithmetic EV is correct for ensemble averages (parallel worlds); Geometric EV is correct for time averages (single trajectory).** Most institutions operate in a hybrid space where neither is perfectly dominant, and standard Expected Utility Theory (EUT) already bridges the gap.

  Here is a detailed breakdown of why arithmetic expectation survives, grounded in ergodicity, utility theory, and the specific constraints of those fields.

  ---

  ### 1. The Ergodicity Problem (The Principled Reason)
  The strongest argument for geometric rationality comes from **ergodicity economics**, championed by physicist Ole Peters.

  *   **Arithmetic Expectation (Ensemble Average):** Imagine 100 people each take a bet once. The average outcome of the group is the arithmetic mean. This is relevant if risks are pooled or diversified across many independent agents.
  *   **Geometric Expectation (Time Average):** Imagine 1 person takes a bet 100 times in a row, reinvesting the proceeds. The outcome is determined by the geometric mean. This is relevant if you are exposed to the *sequence* of returns and cannot reset.

  **Why fields haven't switched:**
  Many economic and financial problems are **ergodic** (or treated as such). If an insurance company sells 10,000 policies, the law of large numbers makes the ensemble average (arithmetic) the reality they experience. They don't need to worry about the geometric growth of a single policy; they worry about the aggregate arithmetic mean of the pool.

  Kelly/Geometric logic only becomes strictly necessary when:
  1.  Outcomes are **multiplicative** (compounding).
  2.  You are **repeatedly exposed** to the same risk.
  3.  You cannot **diversify** the risk away.

  In macroeconomics or policy, decisions are often treated as additive or diversifiable across a population, making arithmetic EV the appropriate tool for social welfare functions.

  ### 2. Economics: Expected Utility Theory Already "Solved" This
  Mainstream economics did not ignore the problem of risk; they solved it using **Expected Utility Theory (EUT)** rather than changing the expectation operator itself.

  *   **Arithmetic EV Maximizer:** Has a linear utility function ($U(w) = w$).
  *   **Geometric EV Maximizer:** Has a logarithmic utility function ($U(w) = \ln(w)$).

  Maximizing the expected logarithm of wealth is mathematically equivalent to maximizing the geometric growth rate (Kelly). Economics *does* teach this. However, economists assume agents have *varying* utility functions.
  *   A hedge fund might act near-logarithmically (Kelly-like).
  *   A central bank or government might act near-linearly regarding GDP growth because they can tax, print money, or socialize losses (effectively diversifying risk across the population/time).

  **The Lag:** It is not that economics ignores geometric growth; it is that they model risk aversion via the *utility function* ($U$), not the *expectation* ($E$). The "Geometric Rationality" movement argues we should hard-code log-utility into the definition of rationality, but economics views risk tolerance as a preference parameter, not a mathematical law.

  ### 3. Quantitative Finance: Diversification and Liabilities
  In finance, the Kelly criterion is well-known, but rarely used in its "full" form for institutional portfolios.

  *   **Diversification:** Modern Portfolio Theory (MPT) uses arithmetic means because it assumes you hold a basket of uncorrelated assets. If you hold 500 stocks, the volatility of the *portfolio* is lower than the volatility of the *individual assets*. The compounding drag (variance drain) is reduced by diversification, making arithmetic mean a better proxy for portfolio growth than for a single concentrated bet.
  *   **Cash Flows:** Kelly assumes all winnings are reinvested. Institutions have liabilities (pension payouts, investor redemptions). When you withdraw capital, the process is no longer purely multiplicative. Arithmetic expectation is often better for modeling single-period returns needed to meet specific liability targets.
  *   **Estimation Error:** Kelly is extremely sensitive to edge estimation. If you overestimate your edge by 10%, full Kelly can lead to ruin. Institutions use "Fractional Kelly" (e.g., Half-Kelly), which is effectively optimizing a utility function that is less risk-averse than log but more than linear.

  ### 4. Effective Altruism: Moral Risk Neutrality
  The EA community's reliance on arithmetic EV is perhaps the most controversial, but it stems from a **moral argument**, not a mathematical error.

  *   **The Stakes:** In EA, the "bankroll" is often human lives or suffering, not dollars.
  *   **The Moral Claim:** Many EAs argue that we should be **risk-neutral** regarding good outcomes. If Option A saves 1 life for sure, and Option B saves 1,000 lives with 0.2% probability, Arithmetic EV says take Option B (Expected value = 2 lives). Geometric logic might hesitate.
  *   **Non-Compounding:** Saving lives is not necessarily a multiplicative process. Saving 10 people today doesn't necessarily give you the "capital" to save 100 people tomorrow in the same way winning a bet gives you more money to bet. If the opportunities are independent and non-compounding, arithmetic EV is the correct metric for maximizing total impact over a fixed horizon.

  However, there is a growing faction within EA (often overlapping with the "Longtermism" crowd) that acknowledges geometric constraints, particularly when considering existential risk. If an intervention has a 1% chance of causing human extinction, the geometric expectation of future value drops to near zero, regardless of the arithmetic upside.

  ### 5. Tractability and Linearity
  There is a pragmatic reason arithmetic EV dominates: **Linearity.**

  *   $E[A + B] = E[A] + E[B]$
  *   $E[Geo(A, B)] \neq Geo(E[A], E[B])$

  Arithmetic expectation is linear. This makes it incredibly easy to aggregate, decompose, and model in complex systems (like DSGE models in macroeconomics or neural network loss functions in ML). Geometric expectation is non-linear and computationally "messy" when aggregating across different types of risks. For high-level modeling, the arithmetic mean is often used as a first-order approximation because the second-order corrections (variance drag) are assumed to be managed elsewhere.

  ### Summary: Is it Lag or Principle?
  It is mostly **principle**, but with a caveat.

  1.  **Principle:** Arithmetic EV is the correct metric for **additive, diversified, or one-off** scenarios. Geometric EV is the correct metric for **multiplicative, concentrated, repeated** scenarios. Since much of economics and finance deals with aggregated/additive flows or diversified portfolios, arithmetic EV remains valid.
  2.  **Principle:** Economics uses **Expected Utility** to handle risk. Log-utility (Kelly) is a specific subset of this, not the universal default.
  3.  **Lag:** There *is* a lag in recognizing **non-ergodicity**. Traditional economics often assumes ensemble averages apply to individuals (the "representative agent" fallacy). Ole Peters' work suggests this is a genuine error in macroeconomic theory that leads to underestimating systemic risk. In this specific niche, "established practice" is indeed lagging behind the math.

  **Recommendation for your model:**
  For a sports-betting model, **you are in the geometric domain.** You are making repeated, multiplicative bets with a finite bankroll. Using arithmetic EV to size bets will mathematically guarantee ruin in the long run (via volatility drag). Stick with Kelly (or fractional Kelly) for sizing. But do not feel compelled to discard arithmetic EV for every decision in your life; use the tool that matches the structure of the problem (Ergodic vs. Non-Ergodic).
