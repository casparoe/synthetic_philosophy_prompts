answer: |-
  You have spotted exactly what most introductory political theory courses gloss over. The popular narrative that "Aquinas endorsed tyrannicide" is a caricature, often projected onto him by later resistance theorists (like the Jesuit Suarez or the Huguenot Monarchomachs) who needed a Scholastic heavyweight to legitimize their own positions.

  Your reading of the *Summa* passage is spot-on: Aquinas isn't handing out a permission slip for assassination; he is performing a **semantic and moral reclassification** of the act of resistance.

  Here is the unpacking of that logical move, followed by how it coheres with *De Regimine Principum*.

  ### 1. The Logical Move in *Summa Theologiae* (II-II, Q.42, A.2)

  You noted that he is doing something "sneaky" with the definition of sedition. In Scholastic terms, this isn't sneaky; it's a rigorous application of **final causality** (the purpose of a thing).

  **The Definition of Sedition:**
  For Aquinas, *seditio* is a special sin against charity and the unity of the multitude. But crucially, that unity must be directed toward the **common good**. Sedition is the disruption of a *just* order.

  **The Tyrant's Status:**
  A tyrannical regime, by definition, seeks the *private good* of the ruler rather than the *common good* of the subjects. Therefore, it lacks the essential quality of a true regime (which is justice).

  **The Syllogism:**
  1.  Sedition is the disturbance of a unity ordered toward the common good.
  2.  A tyranny is not ordered toward the common good.
  3.  Therefore, disturbing a tyranny is not, strictly speaking, "sedition."

  **The Shift of Guilt:**
  This is the brilliant rhetorical flip. Aquinas argues that the tyrant is the *actual* seditious party. By prioritizing his private good, the tyrant has already fractured the political unity. The subjects who resist are not breaking the peace; they are attempting to restore the true peace (the common good).

  **The Utilitarian Caveat (The "Prudence" Check):**
  This is where your text highlights the limit: *"unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm..."*
  Aquinas introduces a consequentialist brake. Even if the act isn't technically "sedition," it can still be sinful if it violates **prudence**. If the resistance creates a vacuum of power that leads to civil war, famine, or a worse tyrant, the resistance becomes morally illicit because it damages the common good more than the tyranny did.

  **Summary of the Move:** He doesn't say "Killing a tyrant is good." He says "Resisting a tyrant is not the sin of sedition, provided the resistance doesn't cause more damage than the tyranny." It shifts the burden of proof from the resistor to the tyrant, but keeps a heavy safety latch on the trigger.

  ### 2. Reconciling with *De Regimine Principum*

  In *De Regimine* (On Kingship), Aquinas appears more cautious, explicitly warning against private citizens taking matters into their own hands. Is this hedging? No, it's a distinction between **moral ontology** (what kind of act is this?) and **political prudence** (who should do this and how?).

  In *De Regimine* (Book I, Chapter 6), he outlines three constraints that complement the *Summa*:

  1.  **The Problem of Private Authority:** Aquinas argues that it is not for "private presumption" to kill a tyrant. Why? Because it sets a dangerous precedent. If private citizens can judge the ruler, any faction can claim the ruler is a tyrant to justify a coup. This leads to the "greater harm" scenario he warned about in the *Summa*.
  2.  **The Remedy of Public Authority:** If the community has the right to elect the king, they retain the right to depose him if he becomes a tyrant. This isn't sedition; it is the exercise of retained public authority. If there is a superior authority (e.g., an Emperor over a King), appeal must be made to them.
  3.  **The Divine Remedy:** If no human recourse exists, Aquinas advises patience and prayer. He argues that God sometimes allows tyrants as punishment for the sins of the people. To revolt without a clear path to a better order is to fight against Divine Providence.

  **The Coherent Doctrine:**
  There is one coherent doctrine underneath both texts. It rests on the hierarchy of goods:
  *   **Highest Good:** The Common Good (Salus Populi).
  *   **Instrumental Good:** Political Order/Peace.
  *   **Sin:** Acting against the Common Good.

  **In the *Summa*:** He is defining the *sin*. Since tyranny opposes the Common Good, opposing tyranny is not a sin against order (sedition).
  **In *De Regimine*:** He is defining the *procedure*. Since chaotic opposition threatens Political Order (and thus the Common Good), private assassination is generally forbidden. Public deposition is preferred.

  ### 3. Where did the "Aquinas Endorsed Assassination" myth come from?

  If Aquinas is this cautious, why does the reputation persist?

  1.  **Commentary on the Sentences:** In an earlier work (In II Sent., d. 44, q. 2, a. 2), Aquinas discusses the killing of Julius Caesar. He suggests that those who killed Caesar were not murderers but "tyrannicides" who deserved reward. This is the smoking gun often cited. However, this is an early work, and in his mature thought (*Summa* and *De Regimine*), he tightens the restrictions significantly.
  2.  **John of Salisbury:** The earlier medieval writer John of Salisbury (*Policraticus*) was much more explicit in endorsing tyrannicide. Later writers often conflated the two.
  3.  **The Jesuit Connection:** In the 16th century, Jesuit theorists (like Mariana) argued for tyrannicide against Protestant monarchs. They leaned heavily on Aquinas's authority to legitimize what was essentially a radical position. They emphasized the *Summa*'s "it's not sedition" line and downplayed the *De Regimine*'s "no private authority" warning.

  ### Conclusion

  You are right to second-guess the narrative. Aquinas is not a proto-revolutionary handing out guns to the peasantry.

  His logical move in the *Summa* is to **delegitimize the tyrant's claim to peace.** He argues that the tyrant is the one breaking the social contract (the common good), so the subjects are not breaking unity by resisting.

  However, *De Regimine* ensures this doesn't become anarchy. The coherent doctrine is: **Tyranny is illegitimate, but resistance must be institutional, proportional, and prudent.**

  If you are writing a piece on this, the strongest angle is to frame Aquinas not as a theorist of *resistance*, but as a theorist of *legitimacy*. He isn't focused on the right to rebel; he is focused on the definition of a true government. If it isn't for the common good, it isn't a true government, and therefore "sedition" against it is a category error. But that doesn't mean *any* action to remove it is morally permissible.
