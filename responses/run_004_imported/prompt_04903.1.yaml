      *   *The Twist:* A tyrannical regime is *already* opposed to the common good (it serves private good). Therefore, opposing it isn't technically "sedition" (which implies opposing a just order).
      *   *The Caveat:* The *consequences* matter. If removing the tyrant causes more chaos/harm than the tyranny itself, then *that* disturbance is sinful.
      *   *The Blame Shift:* The tyrant is the real seditious one because he breaks the bond of the common good.
      *   *Conclusion:* It's not a "permission slip for assassination." It's a moral calculus about the *common good* vs. *private good* and the *consequences* of action.

  3.  **Deconstruct *De Regimine Principum* (On Kingship):**
