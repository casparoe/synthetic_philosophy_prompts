      *   *The "Popular Narrative":* Where did "Aquinas said kill tyrants" come from? Later interpreters (Monarchomachs, John of Salisbury influence, misreading of *De Regimine*). Aquinas is often claimed by both sides (resistance theorists vs. absolutists).

