prompt: |-
  I'm a novelist, though I started out in a philosophy PhD before I bailed after two years to go write fiction instead (no regrets, but I kept enough of it to be dangerous at parties). My old officemate from that program, Priya, just defended her dissertation on Sartre's account of love and the Other in Being and Nothingness, and she's marrying Diego, a high school chemistry teacher who has never read a word of continental philosophy and is thrilled about that fact. They've asked me to give the wedding toast, which feels like being handed a grenade with the pin half out, because about half the guests are Priya's cohort -- people who will absolutely clock it if I flub the sadism/masochism "reefs" bit or flatten "the look" into a Hallmark card -- and the other half is Diego's family, lovely people who are expecting the standard soulmates, written-in-the-stars wedding toast.

  Here's the actual problem though: Priya has told me, only half-joking, that if I get up there and say these two were destined for eachother or found their other half, she'll never forgive me, because that's bad faith in the most literal Sartrean sense -- it denies that she and Diego are two radically free people who have to keep choosing each other, again and again, with nothing in human nature or the universe backing that choice up or guaranteeing its still true tomorrow. So I need a genuinely warm, funny, five-minute toast that takes Sartre's stuff on freedom and bad faith seriously enough that nobody from her cohort can accuse me of dumbing it down, but that still lands for people who've never heard the phrase "for-itself" in their lives and just want to be moved. Extra credit if you can slip in one line that's secretly for the philosophy table -- something that nods at the "reefs" Sartre thinks love keeps nearly wrecking itself on -- without anyone else in the room noticing it's a joke and not just a nice metaphor.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Novelist, ex-philosophy PhD student (2 years in).
      *   **Audience:** Mixed. Half are philosophy academics (Priya's cohort, know Sartre's *Being and Nothingness* well, specifically the "love," "the Other," "the Look," "bad faith," and "sadism/masochism" dynamics). Half are normal people (Diego's family, high school chemistry teacher friends, expect traditional romantic tropes).
      *   **Honorees:** Priya (just defended on Sartrean love) and Diego (Chemistry teacher, hates continental philosophy).
      *   **Constraint 1 (Crucial):** No "destiny," "soulmates," "other half," or "written in the stars." This is *bad faith* according to Priya's specific Sartrean framework. Love must be framed as radical freedom and continuous choice.
      *   **Constraint 2:** Must be warm and funny. Not a lecture.
      *   **Constraint 3:** Must pass the "cohort test" (accurate Sartrean interpretation) and the "family test" (emotionally resonant, understandable).
      *   **Constraint 4 (Extra Credit):** Include a subtle nod to the "reefs" (shoals/écueils) of love (sadism/masochism/indifference/desire/hate) that sounds like a normal metaphor to laypeople but signals specific knowledge to the philosophers.
      *   **Length:** About 5 minutes spoken (approx. 750-900 words).

  2.  **Deconstruct the Sartrean Philosophy (for accuracy):**
      *   *Being and Nothingness*, Part III, Chapter 3: "Concrete Relations with Others."
      *   **The Conflict:** Consciousnesses are inherently conflicting because "The Look" objectifies the Other. I want to recover my freedom by assimilating the Other's freedom, but that's impossible.
      *   **Love:** The attempt to capture the Other's freedom while keeping them free. It's inherently unstable.
      *   **Bad Faith:** Pretending love is a static state, a destiny, or a thing. Denying the anguish of freedom.
      *   **The "Reefs" (Écueils):** Sartre lists specific attitudes love constantly risks shipwrecking on: Indifference, Desire, Sadism, Masochism, Hate. (Note: The prompt mentions "sadism/masochism 'reefs' bit").
      *   **The Solution (for the toast):** Love isn't a destination; it's a project. It's a daily commitment to choose the Other despite the lack of guarantee. It's authentic existence.

  3.  **Drafting Strategy - Balancing the Tones:**
      *   *Opening:* Acknowledge the dual nature of the room (Philosophy vs. Chemistry/Normalcy). Set a warm tone.
      *   *The "No Destiny" Rule:* Address the elephant in the room gently. Frame "fate" as lazy and "choice" as romantic (which is actually more Sartrean).
      *   *The Chemistry Connection:* Use Diego's profession as a bridge. Chemistry = reactions, energy, instability (unlike static destiny).
      *   *The Sartrean Core:* Explain that love is work. It's looking at someone and saying, "I choose you," not "The universe made us."
      *   *The "Reefs" Line:* Needs to sound nautical or metaphorical about difficulties. "Navigating the shoals" is common, but maybe specific wording like "the jagged edges of indifference" or "the temptation to possess." Let's aim for the specific list without listing them dryly.
      *   *Closing:* A toast to the future, emphasizing the *continuation* of choice.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Hi, I'm [Name]. I used to study philosophy, now I write lies for money. Priya studies truth, Diego makes things explode (safely).
      *   *The Constraint:* Priya warned me. No "soulmates." Why? Because "soulmates" implies we didn't do anything.
      *   *The Sartrean Pivot:* Real love is terrifying. It's knowing there's no guarantee.
      *   *The "Reefs" (Extra Credit):* Need to mention the dangers of love that Sartre identifies. Sartre says love is always in danger of turning into sadism (possessing) or masochism (losing oneself). How to say this nicely? "Love isn't safe. It risks turning into possession or loss of self." Let's refine this to sound like a wedding toast. "Navigating the dangerous waters where love can easily run aground."
      *   *Diego's Role:* He doesn't read Sartre. He's evidence that you don't need the theory to live the truth. He chooses her.
      *   *Conclusion:* To the choice.

  5.  **Refining the "Reefs" Line:**
      *   Sartre writes about *écueils* (shoals/reefs). He specifically lists: Indifference, Desire, Sadism, Masochism, Hate.
      *   *Idea:* "Every relationship has to navigate the rocky shoals where care can turn into control, or devotion into loss of self."
      *   *Philosophers:* Will hear "Sadism/Masochism."
      *   *Family:* Will hear "Control/Devotion."
      *   *Perfect.*

  6.  **Refining the "Bad Faith" Concept:**
      *   Don't use the term "Bad Faith" explicitly unless I explain it simply. Better to describe the *act*. "Pretending love is a finished product."
      *   Focus on "Radical Freedom."
      *   Key phrase: "Choosing each other tomorrow."

  7.  **Review against Constraints:**
      *   *Warm/Funny?* Yes, self-deprecating about PhD, complimentary about couple.
      *   *No Destiny?* Explicitly rejected.
      *   *Sartre Accurate?* Yes, focuses on freedom, choice, and the instability of the project.
      *   *Reefs Nod?* Included.
      *   *Length?* Looks good for 5 mins.

  8.  **Final Polish:** Check the rhythm. Ensure the transition from philosophy to chemistry works. Make sure the ending lands emotionally. (Self-Correction: Make sure I don't sound *too* academic. Keep the sentences punchy.)

      *   *Check:* Did I mention "The Look"? Maybe too technical. Stick to "seeing each other."
      *   *Check:* Did I mention "For-itself"? No, keep it hidden.
      *   *Check:* Is Diego comfortable? Yes, he's the anchor of reality here.

  9.  **Final Word Count Check:** A 5-minute speech is roughly 750 words at a moderate pace. I need to ensure it's not too dense.

      *(Self-Correction during drafting)*: I need to make sure the "reefs" line doesn't sound *too* dark. It needs to be framed as something they *avoid* or *navigate successfully*.

      *Revised Plan for Reefs:* "They know that love isn't a harbor, it's a voyage across water that can get rough—where the temptation to possess or the fear of losing oneself are always just beneath the surface."

      *Wait, let's look closer at Sartre's text.* The "reefs" are specifically the attitudes love shipwrecks on. Sadism/Masochism are the big two.
      *Toast Line:* "They understand that love isn't a safe harbor, but a constant navigation of the jagged shoals where devotion can slip into possession, or freedom into surrender."
      *Philosophers:* "Possession/Surrender" = Sadism/Masochism.
      *Laypeople:* Sounds like healthy relationship advice.

      *Let's write it.*

      *(Post-Drafting Review)*: The tone needs to be celebratory. Ensure the "no destiny" part doesn't sound nihilistic. It needs to sound *empowering*. "The universe didn't make you do this. You chose it. That's why it matters."

      *Okay, ready to generate.*
answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a novelist now, but I spent a couple of years in a philosophy PhD program with Priya before I realized I preferred making things up for a living rather than arguing about what's real. Priya, on the other hand, stuck with it. She just successfully defended her dissertation on Sartre, which means she knows exactly why we're all here, and she's made it very clear that if I mess this up, she will use her knowledge of existential phenomenology to dismantle my sense of self-worth at every future cocktail party.

  So, Priya gave me one strict instruction for this toast. She said, "Do not tell people we are soulmates. Do not tell them we were destined. Do not say the universe brought us together."

  Now, for Diego's family, that might sound a little cold. You might be thinking, "Wait, isn't this the part where we talk about fate?" But here is the thing I learned from watching Priya study, and from watching Diego teach chemistry: Destiny is lazy. Destiny is a script. If you say love is written in the stars, you're saying Priya and Diego didn't actually *do* anything to get here. You're saying they're just passengers on a bus driven by the cosmos.

  And that is an insult to what they actually have.

  Because the truth is much more beautiful, and much more brave. Priya and Diego are not here because the universe forced them. They are here because, in a world full of infinite possibilities and zero guarantees, they looked at each other and made a choice. And then they made it again. And again.

  Sartre wrote that human beings are "condemned to be free." It sounds scary, but in a relationship, it's the only thing that makes love real. Love isn't a state of being; it's a project. It's an action. It's the terrifying and exhilarating act of looking at another person—truly seeing them, not as an object to own, but as a free, chaotic, changing human being—and saying, "I choose you. Not because I have to, but because I want to."

  Diego, you are a chemistry teacher. You know that stable compounds aren't magic; they're the result of bonds that hold under pressure. You don't read continental philosophy, and honestly, that's your superpower. You prove that you don't need to read hundreds of pages about "The Look" to understand what it means to be seen. You see Priya. You respect her freedom. You don't try to freeze her in place.

  And Priya, you know better than anyone that this is hard work. You know that love is inherently unstable. You know that every relationship has to navigate the jagged shoals where devotion can slip into possession, or freedom into surrender.

  *(Pause for a beat. The philosophers will catch "possession/surrender" as Sadism/Masochism. The rest will hear healthy boundaries.)*

  Most people run from that instability. They want the fairytale because it's safe. But you two? You lean in. You accept the anguish of knowing that there is no safety net. There is no contract that guarantees you'll feel this way in ten years. The only guarantee is that you will wake up tomorrow and choose to build this again.

  That is why I am so moved to be standing here. Because when I look at you two, I don't see a completed puzzle. I don't see two halves making a whole. I see two whole, radical, free people walking side by side, eyes wide open, refusing to lie to themselves about how hard this is, and refusing to walk away.

  In a world that loves to tell us we're destined for things, your love is a rebellion. It is an act of authentic creation. You are writing your own meaning, day by day, without a script.

  So, if everyone could please raise a glass.

  To Priya and Diego. May you never take the easy way out. May you never pretend this was inevitable. And may you continue to choose each other, freely and fiercely, for as long as you both shall live.

  To the bride and groom.
