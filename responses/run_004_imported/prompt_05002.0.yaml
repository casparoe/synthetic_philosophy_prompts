answer: |-
  The coffee mug was warm. That was the first datum.

  Elias sat in his study, the blue light of the monitor washing over his knuckles. He could feel the heat of the ceramic against his palm. Standard phenomenology. But then he asked the question that had been eating him since he finished Goff's book: *Where does the heat end and I begin?*

  Physics offered no help. The atoms in his skin were jostling against the atoms in the ceramic. Energy was exchanging. Electromagnetic fields overlapped. There was no force field, no ontological membrane that said *Stop. Subjecthood resides only inward of this dermis.*

  If panpsychism was true—if experience was a fundamental property of matter, like mass or charge—then the mug had some degree of proto-experience. His hand had some degree. His brain combined them into the sensation of "warmth."

  But why *this* brain? Why *this* hand?

  Elias closed his eyes. He tried to locate the boundary of his own mind. He focused on the sound of the refrigerator humming in the kitchen. It was outside his skull, yet the *hearing* of it was inside. The boundary wasn't at the eardrum. It wasn't at the skin.

  He stood up and walked to the window. Across the street, the lights were on in Mrs. Gable's house. He could see her silhouette moving in the kitchen.

  *The Combination Problem,* he thought. *The Boundary Problem.*

  If consciousness is an aggregate of micro-subjects, what dictates the voting district? What invisible gerrymandering decided that these specific electrons in Elias's prefrontal cortex were constituents of "Elias," while the identical electrons in the air between him and Mrs. Gable were... what? Free agents? Or part of a different district?

  There was no seam. The universe was a continuous field of matter. If experience rode on matter, experience must be a continuous field.

  Elias pressed his forehead against the cold glass.

  He tried to shrink his attention. *I am just the thoughts,* he told himself. *Not the body.* But the thoughts depended on the body's chemistry. *I am just the neurons.* But neurons relied on blood flow. *I am just the nucleus of the self.*

  He felt a sudden, sharp itch on his left calf. He scratched it.

  Then he paused.

  He hadn't moved his hand to his calf yet. The sensation had arrived, but the *location* of it felt... distant. Not distant like a foot, but distant like *across the street.*

  He looked at Mrs. Gable's house again. She was standing still now, facing her own window.

  Elias felt a twinge of arthritis in a knee he didn't have. It was a dull, grinding ache, familiar to anyone over seventy. He looked down at his own knees. They were fine. Thirty years old. Perfect cartilage.

  *No,* he thought. *Not telepathy.* Telepathy implies two rooms with a phone line between them. This was different. This was the realization that the wall between the rooms was painted on.

  If the boundary was arbitrary, then "Elias" was just a convenient label for a specific cluster of experience. A temporary eddy in the stream. But streams eddy and mix. Water flows.

  He focused on the space between his house and hers. The air. The photons. If he could just shift the constituency. If he could vote a few stray neurons out and a few photons in.

  The arthritis in the non-existent knee flared. Simultaneously, the warmth of the coffee mug he had left on the desk bloomed in his palm, though he was standing by the window, empty-handed.

  He was overlapping.

  It wasn't that he was hearing Mrs. Gable's thoughts. It was that the *subject* experiencing Mrs. Gable's arthritis and the *subject* experiencing Elias's anxiety were sharing a substrate. The universe wasn't divided into monads. It was a soup, and "Elias" was a ladleful that had temporarily held its shape.

  But the ladle was tipping.

  He gripped the windowsill. The wood felt rough. Or did it? The sensation of roughness was vibrating at a frequency that felt... borrowed. Was this his touch, or was the window touching itself, and he was just the place where that interaction registered?

  *Where is the seam?* he screamed internally. *Show me the edge!*

  He looked at his hand against the glass. He tried to will the boundary to solidify. *I am here. Not there.*

  But the physics didn't care. The photons from Mrs. Gable's kitchen were hitting his retina right now. They were part of his physical state. If experience supervenes on physical state, then her kitchen light was part of his mind.

  And his anxiety was part of hers.

  He saw her turn her head. She was looking right at him. She didn't look surprised. She looked tired. The kind of tired that comes from holding a shape too long.

  Elias realized then that the horror wasn't invasion. It was irrelevance. "Elias" wasn't being erased; he was being revealed as a fiction. A useful narrative knot tied in a rope that had no ends.

  He tried to step back from the window, to reassert the integrity of his body, but his leg felt heavy, as if the muscles belonged to a different gravity well. He felt the hum of the refrigerator in his teeth, but he also felt the silence of Mrs. Gable's unlit hallway in his chest.

  The constituency was shifting. The gerrymandering was being redrawn in real-time, not by a mapmaker, but by the chaotic drift of particles.

  Was he expanding? Or was he just noticing that he had always been this big?

  He opened his mouth to speak, to say *I am here*, but he wasn't sure which throat the sound would come from. He wasn't sure if the thought *I* referred to a point or a volume.

  The glass under his palm stopped feeling like glass. It started feeling like a membrane. Not a barrier, but a surface tension. And it was breaking.

  Elias closed his eyes, or perhaps the house across the street blinked.

  He waited for the pain of dissolution, but there was only the question, hanging in the dark, unanswered:

  *If there is no edge, where does the feeling stop?*

  He waited for the answer. The refrigerator hummed. The light across the street flickered. The boundary remained as arbitrary as ever, and he stood on both sides of it, wondering which one of him was going to make the coffee in the morning.
