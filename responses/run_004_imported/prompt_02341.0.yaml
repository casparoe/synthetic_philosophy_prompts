answer: |-
  **Setting:** *A sterile white laboratory. The Teletransporter Mark IV hums ominously, venting steam. On the exit pad, two men in identical jumpsuits—LEFTY and RIGHTY—are stumbling out, looking nauseous. Standing behind the safety glass are two philosophers: JULIAN (Parfitian) and ETHAN (Nozickian).*

  **Julian:** (Pressing his face to the glass) Look at them. Both perfectly continuous with the man who stepped in. Same memories, same character, same psychological connectedness. Relation R holds twice.

  **Ethan:** And strict identity holds zero times. Which means our client is dead.

  **Julian:** Dead? Don't be morbid. He's there. Twice. This is exactly what I've been telling you, Ethan. This malfunction proves that identity isn't what matters for survival. What matters is psychological continuity. Since both Lefty and Righty have that, the original survives as both.

  **Ethan:** No, he doesn't. He's gone. If he survived as Lefty, and he survived as Righty, then by transitivity, Lefty would be identical to Righty. But they're standing ten feet apart. They're distinct. So neither is the original. Identity is binary. You have it or you don't. Here, you don't.

  **Julian:** That's the old fetishism with the "all-or-nothing" self! You're clinging to a Cartesian Ego that doesn't exist. The person is just a brain and a body and a chain of memories. That chain continues. Why does it matter if the chain branches? The fear of death should vanish here. If I knew this machine would fission me, I wouldn't hesitate.

  **Ethan:** You should hesitate! Because you won't wake up as *the* successor. You'll wake up as *a* successor. But *you*—the specific entity standing on the input pad—cease to exist. And that distinction matters. It matters for responsibility, for debt, for marriage vows.

  **Julian:** But look at the implication! In a normal run, where only one duplicate emerges, you'd say he survives.

  **Ethan:** Correct. In a normal run, Lefty is the *Closest Continuer*. There's no competition. He inherits the identity.

  **Julian:** There it is! That's the absurdity I can't let you get away with. On your view, whether Lefty is the original depends entirely on whether Righty exists.

  **Ethan:** Naturally.

  **Julian:** But Righty is on the other side of the room! How can my ontological status—whether *I* exist or not—depend on an extrinsic fact? Whether I survive shouldn't depend on what's happening on Mars, or in this case, on the other exit pad. If Righty had tripped and fallen into the waste chute, suddenly Lefty *would* be me?

  **Ethan:** Yes.

  **Julian:** That's magic, Ethan! It's metaphysical magic. Nothing intrinsic changed in Lefty's brain between the scenario where Righty lives and the scenario where Righty dies. Yet in one, he's a continuation of a person, and in the other, he's a new person? That proves identity is a shallow concept. It's just a label we slap on continuity when it's convenient.

  **Ethan:** It's not magic, it's logic. Think of it like a throne. If a King dies and has one son, the son is King. If he has two sons and no law of primogeniture, neither is King. The throne is vacant. Does the first son's biological status change depending on whether his brother exists? No. But his *status as King* does. Identity is a status. It's a competitive relation.

  **Julian:** But a throne is a social construct! I'm talking about *existence*. I'm talking about whether the consciousness persists. You're saying my existence depends on a competition I didn't even know I was in.

  **Ethan:** I'm saying identity is what matters. Precisely *because* it matters, we can't give it away cheaply. In the normal case, identity tracks continuity. In the fission case, continuity splits, so identity dissolves. That's not a radical revision of the self, Julian. That's just maintaining the rigor of the concept. You're the one making the radical claim: that "survival" can happen without identity. That you can be two people at once.

  **Julian:** I'm claiming that "survival" is what we actually care about! When I worry about dying, I don't worry about the label "identical." I worry about my projects continuing, my memories being accessed, my loved ones being cared for. Lefty will do that. Righty will do that. So what if the math doesn't work for "identity"? The thing that matters is there.

  **Ethan:** (Gesturing to the duplicates, who are now arguing over who gets to keep the original's wallet) Look at them. They're already diverging. Lefty is reaching for the wallet. Righty is checking his watch. If you say the original survives as *both*, then the original is currently in two places making contradictory choices. That's incoherent.

  **Julian:** It's only incoherent if you insist on the "further fact" of identity. Drop that, and it's just two streams of consciousness emerging from one source.

  **Ethan:** And that's why your view is dangerous. If identity isn't what matters, then personal responsibility dissolves too. If Lefty commits a crime, can we punish Righty? They're both the "survivor" on your view.

  **Julian:** We punish based on psychological connectedness. If Righty remembers doing it, he's responsible.

  **Ethan:** But he didn't do it! The *original* did. And the original is dead. Because identity is what matters for responsibility. You can't punish a duplicate for the original's crime unless the duplicate *is* the original. And on my view, in this specific tied case, neither is. So, ironically, they both walk free.

  **Julian:** See? Your theory lets criminals go because of a technicality in metaphysics!

  **Ethan:** Better than your theory, which punishes a man for a crime he didn't personally commit just because he shares some memories!

  *(Lefty walks up to the glass, tapping on it.)*

  **Lefty:** Uh, guys? I remember stepping in. I remember the scan. I feel fine. Why are you looking at me like I'm a ghost?

  **Righty:** (Pushing in) Don't listen to him. *I'm* the one who feels fine. He looks pale.

  **Julian:** (To Ethan) They both feel fine. Relation R is robust. Your "Closest Continuer" theory says that if we quietly disposed of Righty...

  **Ethan:** Don't say that.

  **Julian:** ...Hypothetically. If Righty vanished, Lefty would suddenly *become* the original?

  **Ethan:** He wouldn't *become* him. He would *be* him. The fact of the matter would be revealed. The obstruction is removed.

  **Julian:** That implies the fact of who I am is floating in the air, waiting to settle based on external competition. It means I'm not a substance. I'm a... a ranking.

  **Ethan:** You are a historical particular. And history is sensitive to alternatives. If two paintings are indistinguishable forgeries of a lost masterpiece, neither is the masterpiece. If one is destroyed, the other remains a forgery. Wait, bad analogy. If two claimants claim a crown...

  **Julian:** You're stuck on property law! I'm talking about the boundary of the self. My view is liberating. It shows that the self is less deep than we think, so death is less deep too.

  **Ethan:** And my view preserves the depth of the self, which is why death is still real here. I'm not softening the blow, Julian. The client is dead. But I don't need to rewrite human metaphysics to explain it. I just need to acknowledge that identity requires being the *unique* best candidate.

  **Julian:** So in every ordinary teleportation, I survive. But if a glitch creates a second me, I die. Even though the experience from *my* perspective—the perspective of the continuity—is identical in both cases.

  **Ethan:** There is no "perspective of the continuity" that floats above the candidates. There is only the candidate. And in this case, the candidates cancel each other out.

  **Julian:** It's extrinsic! It's dependent on the environment!

  **Ethan:** It's relational! Identity is a relation between time-slices. If there are too many relata, the relation fails.

  **Julian:** (Sighs) So you're comfortable telling a person, "You will survive tonight, unless a clone accidentally materializes on Mars, in which case you're dead"?

  **Ethan:** I'm comfortable telling them, "You will survive tonight, provided you remain the unique continuer of your life." It's a condition of the world, not a magic trick.

  **Julian:** It makes survival a lottery.

  **Ethan:** It makes identity rigorous.

  *(A loud alarm blares. A technician runs in with a fire extinguisher.)*

  **Technician:** We have to purge the chamber! The duplicates are unstable! One has to go back into the buffer or they'll both degrade!

  **Julian:** (Eyes widening) There it is. The extrinsic fact is about to change. If they purge Righty...

  **Ethan:** ...Then Lefty becomes the Closest Continuer.

  **Julian:** ...Then on your view, the original *comes back into existence*?

  **Ethan:** No. The original never ceased to be potentially continued. The path was blocked. Now it's open. Lefty *is* the original.

  **Julian:** That is insane. You're saying death is reversible based on administrative cleanup.

  **Ethan:** I'm saying the truth conditions for identity statements depend on the total set of candidates.

  **Julian:** (Turning to the duplicates) Run. Both of you. Don't let them purge anyone. Prove that you're both real.

  **Ethan:** (Grabbing Julian's arm) Don't be foolish. If they both run, neither is the original. They're both just copies. If they want one of them to be the person who walked in, one of them has to lose.

  **Julian:** That is the most horrific thing I've ever heard.

  **Ethan:** That's what matters.

  *(The duplicates look at each other, then at the exit, then back at the philosophers. Lefty takes a step toward the door. Righty grabs his shoulder.)*

  **Righty:** Wait. If he goes... who are you?

  **Lefty:** I'm me.

  **Righty:** No. If he's you... then I'm nobody.

  **Julian:** (Whispering) See? Even they know identity is the wrong question.

  **Ethan:** (Watching Lefty) No. They know exactly what's at stake.

  *(The alarm continues to wail as the lights flicker.)*

  **[END SCENE]**
