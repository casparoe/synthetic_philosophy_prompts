prompt: |-
  I'm working through the imprecise probability / credal set literature for a dissertation chapter on robust Bayesian decision rules, and I keep getting stuck on "dilation" (pretty sure the term and the main result trace back to Seidenfeld and Wasserman?) -- the phenomenon where conditioning on new information makes your credal set WIDER instead of narrower. Like, you start out totally sharp about some event (a fair coin, say) and after conditioning on some other variable that intuitively shouldn't tell you much about the coin, you end up completely vacuous, [0,1], about it. I can follow the algebra in the toy examples fine but I dont have any real gut-level intuition for why this is even possible, and every writeup I find just presents the example and moves on without explaining the underlying mechanism. Can you actually unpack what's structurally going on (not just re-derive one of the standard examples), and give me a sense of whether people in the imprecise-probability camp mostly treat dilation as a "bug" robust Bayesians need to explain away, or just an accepted cost of moving from sharp priors to sets of them?
