answer: |-
  The flint struck the steel, and a spark fell into the oil-soaked wick. Usually, the light arrived instantly. There was no *usually*, Yusuf reminded himself. There was only now. And there was the next now.

  He stood in the high gallery of the Great Mosque, the air thick with the scent of sesame oil and old stone. It was the hour of Maghrib. Below, the courtyard filled with the faithful, a sea of white turbans and bowed heads. Yusuf's duty was simple: touch fire to wick, and light the hall. It was a task he had performed for twenty years, trusting in the nature of fire to burn and the nature of oil to feed it.

  But three nights ago, the seam had opened.

  He had been lighting the far lantern, the one near the mihrab. He struck the steel. The spark landed. For the duration of a heartbeat, the wick remained dark. Not unlit, precisely, but waiting. In that suspended fraction, Yusuf had felt a vertigo so profound he had to grip the iron railing. He had assumed the fire possessed the power to ignite. He had assumed the oil possessed the property of flammability. But in that pause, he had seen the truth: the fire was dead matter. The oil was dead matter. Neither had the power to do anything.

  The flame had appeared only when God willed it to appear, moment by moment. The connection was not a chain of necessity, but a string of beads held by a single hand.

  Tonight, the fear sat in his chest like a cold stone. If the connection was merely habit—*adah*, the scholars called it, the custom of the Creator—then it could change. There was no logical contradiction in fire cooling cotton. There was no law of nature, only the memory of what happened yesterday.

  Yusif moved to the next lamp. He raised the striker. His hand trembled. If he struck, would the light come? Or would the Habit shift? Would the spark fall and vanish like a dying star, leaving him in darkness before the Imam began the recitation?

  He lowered his hand. He looked at the unlit wick. It was black, inert. It had no promise within it.

  A scholar once walked these halls, Yusuf remembered. Al-Ghazali. He had written that if you throw a stone, it does not break the glass because of the stone's force. The stone arrives at the glass, and in the next moment, God creates the破碎ing. The stone is merely the occasion.

  Yusuf looked at the flint in his hand. It was just iron. It had no power to create a spark. The spark was a fresh creation, unrelated to the strike except by coincidence repeated until men called it law.

  Below, the muezzin began the call. The voice echoed off the tiles, beautiful and terrifying. *God is Greatest.*

  If God was greatest, then Yusuf was nothing. Not just humble, but ontologically empty. He was not a cause. He was a witness.

  He had spent the last three days testing the seams. He had dropped a clay cup, expecting it to shatter. It had hit the floor and bounced, whole, because the Habit of breaking was not obligatory. He had held his hand near the flame, expecting heat. For a second, the fire had been cold. He had pulled back, sweating, realizing the terror of a world without anchors.

  He could tell no one. To speak of it was to invite accusations of madness. The world relied on the illusion of necessity. The baker baked because he trusted the oven. The builder built because he trusted the stone. If they knew the stone might decide to flow like water tomorrow, the city would collapse.

  But Yusuf knew. He stood in the gap between the strike and the burn.

  The call to prayer ended. The silence rushed in. The Imam raised his hands. The congregation waited for the light to fully take the hall before the recitation began. It was time.

  Yusuf looked at the lamp. He understood now why he had been shown the seam. It was not to break the world, but to break his reliance on it. He had thought his job was to light the lamps. He was wrong. His job was to present the occasion. The lighting was not his act.

  He raised the striker again. He did not tense his muscles to force the spark. He did not demand the fire obey the physics of iron and stone. He simply brought the steel to the flint.

  *Click.*

  The spark fell.

  Yusuf held his breath. In the space between the spark touching the wick and the flame appearing, the universe hung suspended. He saw the infinite power required to sustain a single flicker of light. He saw that the darkness was the default, and the light was a mercy renewed every instant.

  The flame bloomed.

  It was not because the oil was ready. It was because the Will was consistent.

  Yusuf moved to the next lamp, and the next. He worked with a strange new slowness. He was not operating a machine. He was walking through a gallery of miracles so consistent they looked like boredom. He touched the wick. He waited. He accepted whatever came.

  Once, near the end of the row, the flame did not catch immediately. It hovered, a blue ghost above the wick, then vanished. Darkness remained.

  In the old days, Yusuf would have cursed the oil. He would have blamed the dampness. He would have assumed a cause was missing. Now, he bowed his head. The Habit had shifted, just slightly. A reminder.

  He did not strike again immediately. He waited. He aligned his intention with the submission of the mosque below. He was not commanding the light. He was asking for it.

  He struck again. The flame arrived, steady and gold.

  He finished the row and stepped back into the shadows of the gallery. Below, the prayer had begun. The hall was bathed in the warm glow of hundreds of flames, each one a discrete act of creation, none touching the other, all held in the same mind.

  Yusuf looked at his hands. They were just shapes in the dim light. They had no power to build or break. They were merely the place where things happened.

  He felt a profound lightness. The burden of causation was lifted. He did not need to worry about the future, for the future was not built on the present. The next moment was not the child of this one; it was a new creation entirely. There was no inertia to carry him forward, only a Hand that chose to place him there.

  He watched the flames dance. They did not burn. They were being burned, again and again, without end.

  Yusuf sat on the stone floor, his legs crossed, his hands resting on his knees. He watched the fire. He waited for the next moment. He did not expect it. He simply received it.

  When the prayer ended and the faithful began to file out, laughing and talking, trusting the ground to hold their feet and the air to hold their voices, Yusuf remained in the gallery. He was the keeper of the lamps, but he knew now what that meant. He was the witness to the Habit.

  He picked up the flint and steel. He struck them together. Sparks flew, bright and brief, dying before they hit the floor.

  He smiled in the dark. Nothing had caused the sparks. They were simply here. And then, they were not. And that was enough.
