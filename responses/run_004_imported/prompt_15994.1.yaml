      *   *Metaphysical Bite:* If manifold points are real entities (substantivalism), then moving the metric field from point $p$ to point $q$ changes *which* point has *which* properties. If points have haecceity (this-ness), then $(M, g)$ and $(M, d^*g)$ describe distinct physical situations *ontologically*, even if they are observationally indistinguishable.
      *   *Analogy:* Chess board. Passive = renaming "e4" to "King's Pawn 4". Active = picking up the pawn and moving it to a different square without changing the square's name. If squares are real entities, the second move changes the state of the board.

  3.  **Deconstruct Objection 2: Gauge Redundancy (The "EM Potential" Worry):**
      *   *User's intuition:* EM has gauge freedom ($A_\mu \to A_\mu + \partial_\mu \Lambda$). Realists about EM fields don't panic. Why should GR realists panic about diffeos?
