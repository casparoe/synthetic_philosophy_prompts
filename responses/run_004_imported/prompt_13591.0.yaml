      *   *Douglass's Shift:* Douglass announced his break in 1851 (*The North Star*). His argument was indeed textualist but grounded in the idea that the *intent* of the framers matters less than the *text* ratified by the people. He argued that the Constitution, properly interpreted, was an anti-slavery document.
