answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being [Grandma's Name]'s grandchild.

  Ninety years is a long time. It's enough time to accumulate a lot of things. Furniture, photographs, recipes written on index cards that are now stained with butter and vanilla. But if you ask anyone in this room what [Grandma's Name] has actually *accumulated*, they won't talk about things. They'll talk about stories.

  We all know them. We know about the time she snuck backstage in Chicago to meet a singer—though, depending on the holiday, that singer might be Frank Sinatra, or it might be Dean Martin. We know about the speeding ticket she talked her way out of using nothing but a smile and a logic puzzle. And we all know the story of how she met Grandpa Lou at a dance, a story that has launched approximately three generations of this family.

  Now, I'm currently in school, studying a subject that deals with how we know what we know. And lately, I've been thinking a lot about truth. Specifically, the difference between the kind of truth you find in an archive, and the kind of truth you find in a room like this.

  In an archive, truth is static. It's ink on a page. It's a date on a certificate. It's verifiable, cold, and solitary. If you find a discrepancy in an archive, you have a problem to solve.

  But in a room like this, truth is something else. It's collaborative. It's living. When Grandma tells us the story of meeting Grandpa Lou, she isn't filing a report for the historical society. She is handing us a piece of ourselves. She is saying, "This is where you came from. This is how love looked in 1950. This is how wit can save you when you're in trouble."

  I've learned recently that sometimes the documents and the stories don't line up perfectly. Sometimes the ink says one thing, and the memory says another. And in my field, that's called a conflict. But in this family, I think we know better.

  The documents tell us when the legalities were settled. But the story? The story tells us when the *life* began. And I think we are justified—more than justified, we are wise—to trust the story. Not because we haven't checked the facts, but because the facts are only the skeleton. The testimony is the flesh and blood.

  We trust Grandma's stories not because they are immune to error, but because they are immune to irrelevance. They have been tested, not by cross-examination, but by time. They have held this family together for decades. They have made us laugh when we were sad and made us feel safe when we were small. That track record—the fact that these stories *work*, the fact that they build us—is the only verification we need.

  So, Grandma, thank you. Thank you for the stories that might change a detail here or there, but never change the point. Thank you for teaching us that while records mark the dates, it is our telling of them that makes the history real.

  If everyone could please raise a glass.

  To Grandma. To the ink that fades, and the words that remain. Happy 90th Birthday.
