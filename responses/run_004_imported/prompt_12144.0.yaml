      *   *The Logic (Simplified):* If $A$ is false, it implies some falsehood $f$. If $A$ implies a new truth $t$ that $B$ doesn't, the conjunction of $f$ and $t$ creates new logical combinations. Since $f$ is false, any statement implying $f$ is potentially problematic. Wait, that's not quite right.
      *   *The Real Logic:* Let $A$ be false. So $A \to f$ (where $f$ is false). Let $t$ be a true statement not implied by $B$. If we construct $A$ to imply $t$, we usually do so by strengthening the theory. But if the theory is already false, strengthening it tends to generate more specific falsehoods.
      *   *Tichý's Insight:* It's about the combinatorics of logical consequences. If a theory is false, it "pollutes" the logical space. Adding truth to a false base doesn't clean up the pollution; it just creates more complex polluted statements.

