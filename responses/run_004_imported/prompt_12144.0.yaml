answer: |-
  This is one of those philosophical "gotchas" that feels like a magic trick until you see the sleight of hand. The formal proofs are dry, but the mechanism is actually quite visceral once you see it.

  Here is the gut-level explanation you can use for your undergrads, centered on what I call **"The Logical Virus."**

  ### 1. The Setup: Popper's Scorecard
  First, remind them how Popper is keeping score. He wants to say Theory A is closer to the truth than Theory B.
  To do this, he looks at the **logical consequences** of each theory.
  *   **Truth-Content:** The set of all true statements the theory implies.
  *   **Falsity-Content:** The set of all false statements the theory implies.

  For A to beat B, A needs to have **more** truth-content than B, without having **more** falsity-content. (Ideally, more truth and less falsity).

  ### 2. The Intuition Trap
  Our intuition says: "If I take a wrong theory and add more correct predictions to it, it should get better."
  *   *Example:* Aristotelian physics says "Heavy objects fall faster." (False).
  *   *Improvement:* We add "And objects accelerate at 9.8 m/s²." (True).
  *   *Intuition:* We added truth, so we should be closer to the truth.

  **The Tichý/Miller result says: No.** If the theory is fundamentally false, you cannot add truth-content without automatically inflating your falsity-content by the exact same amount.

  ### 3. The Mechanism: The "And" Operator
  Here is the mechanism. Logic has a tool called **conjunction** (the word "AND").

  Imagine Theory **A** is false. That means there is at least one false statement it entails. Let's call this error **$E$** (for Error).
  *   $A \rightarrow E$ (where $E$ is False)

  Now, imagine we compare **A** to a rival Theory **B**. Let's say **A** looks "better" because it predicts some true thing that **B** doesn't. Let's call this truth **$T$**.
  *   $A \rightarrow T$ (where $T$ is True)

  So far, so good. **A** has more truth-content than **B**. Popper's first condition is met. But now we have to check the falsity-content.

  Because **A** entails **$E$** and **A** entails **$T$**, logic dictates that **A** also entails the combination:
  *   **$A \rightarrow (E \text{ AND } T)$**

  **Here is the killer:** What is the truth value of "($E$ AND $T$)"?
  Since $E$ is False, the whole conjunction is **False**. (In logic, False AND True = False).

  So, by adding the true consequence $T$, Theory **A** has automatically generated a *new* false consequence: **($E$ AND $T$)**.

  ### 4. Why B Doesn't Have This Error
  You might ask: "Doesn't Theory B also entail ($E$ AND $T$)?"

  **No.** Remember, we started by saying **A** has *more* truth-content than **B**. That means **B** does *not* entail $T$.
  If **B** doesn't entail $T$, it generally won't entail the specific combination **($E$ AND $T$)** either.

  **The Result:**
  *   **A** has gained 1 unit of Truth-Content ($T$).
  *   **A** has *also* gained 1 unit of Falsity-Content ($E$ + $T$).
  *   **B** has neither.

  When you go to compare them on Popper's scorecard, **A**'s advantage in truth is perfectly canceled out by its disadvantage in falsity. You haven't moved closer to the truth; you've just moved *further out* into the space of falsehoods, carrying your original error with you.

  ### 5. The "Viral" Analogy for Class
  Here is how to explain it without writing a single symbol on the board:

  > "Imagine a false theory is like a bucket of water with a single drop of poison in it.
  >
  > Popper wants to say that a bucket with more clean water is 'better.' So, we pour a gallon of pure, clean water (Truth) into the poisoned bucket.
  >
  > Intuitively, it feels less poisonous, right? But Popper isn't measuring concentration; he's counting **molecules**.
  >
  > Because that one drop of poison is still there, it chemically bonds with the new clean water. For every molecule of clean water you add, you create a new molecule of 'poisoned-water complex.'
  >
  > So, if you add 1,000 units of Truth, you don't just get +1,000 Truth points. You also get +1,000 new False points (because every new truth is now tainted by the original error).
  >
  > The score remains tied. You can never out-run the error. As long as the theory is false, every step you take toward the truth drags your falsehood along with it, creating new, unique errors that the rival theory doesn't have."

  ### 6. The "So What?" for Undergrads
  To wrap up the discussion section, drive home why this was so devastating:

  1.  **It freezes scientific progress:** Under this definition, we can never say General Relativity is *closer to the truth* than Newtonian Mechanics. We can only say it has more corroboration. We lose the ability to say science is converging on reality.
  2.  **It's a structural problem, not a content problem:** It doesn't matter *what* the theories say. It's a feature of how logic works (specifically the 'AND' operator). Any definition of truthlikeness that relies on counting consequences runs into this wall.
  3.  **The Fix:** Mention briefly that philosophers (like Niiniluoto) had to change the definition. Instead of counting *consequences*, they started measuring *similarity* to the truth (like distance on a map). If the map is wrong about the city center, but right about the highways, it's still "closer" than a map that's wrong about everything, even if both maps are technically "false."

  ### Summary for your notes:
  *   **Popper's Rule:** More Truth, No More Falsehood.
  *   **The Glitch:** If a theory is False ($E$), adding Truth ($T$) creates a new Falsehood ($E$ & $T$).
  *   **The Consequence:** Truth-content and Falsity-content grow in lockstep for false theories.
  *   **The Metaphor:** The Logical Virus / The Poisoned Well.

  This usually gets the "aha!" moment because it shifts the focus from "what the theories say" to "how logic combines statements."
