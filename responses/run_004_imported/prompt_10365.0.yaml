answer: |-
  **MEMORANDUM**

  **TO:** Medical Staff Office, Quality and Patient-Safety Committee
  **FROM:** Peer-Review Coordination Office
  **DATE:** October 26, 2023
  **SUBJECT:** Peer-Review Determination: Case #23-094 (Chest CT Interpretation Discrepancy)

  **1. EXECUTIVE SUMMARY**
  This memo summarizes the Quality and Patient-Safety Committee's review of a diagnostic discrepancy involving a chest CT scan performed eighteen months prior to the current detection of a 2cm mass. The Committee has reached a consensus regarding the classification of this event and the necessary systemic responses.

  **Recommendation:**
  *   **Individual Provider:** No punitive remediation. The event is classified as a **Human Factor/System Issue** rather than negligence or lack of competence.
  *   **System Protocol:** Implementation of a phased protocol modification regarding the sequencing of clinical history and image review. Target implementation: **Q2 2024.**

  **2. CASE SUMMARY**
  A chest CT ordered with the clinical indication "rule out pneumonia" was interpreted as negative by Dr. [Redacted] eighteen months ago. Current imaging reveals a 2cm mass in the same region, retrospectively visible on the prior study. The reviewing radiologist acknowledges the mass is obvious in hindsight but contends that at the time of the original read, the lesion did not perceptually register due to expectation bias (specifically, "inattentional blindness" driven by the pneumonia workup context).

  **3. COMMITTEE DELIBERATION**
  The Committee considered three primary perspectives during the peer-review meeting:
  *   **Cognitive Limitation:** Senior radiology staff noted that diagnostic expectation alters visual perception, citing established literature on inattentional blindness (e.g., the "invisible gorilla" studies in radiology). They argued this is a physiological limit, not a lapse in diligence.
  *   **Professional Accountability:** Risk Management argued that credentialing implies the ability to mitigate cognitive bias through established safeguards (checklists, double-reads). Mechanism of error should not absolve individual responsibility.
  *   **Systemic Mitigation:** A middle position suggested that while the perceptual error may be unavoidable, the system should be adjusted to reduce reliance on unaided perception in high-risk contexts.

  **4. ANALYSIS AND DETERMINATION**

  **A. Classification of the Specific Event**
  The Committee recommends classifying this event as a **System/Human Factor Error** with no individual disciplinary action.

  *Reasoning:* The evidence supports the conclusion that this was a perceptual failure rather than a cognitive or negligent one. In safety science, we distinguish between *violations* (ignoring rules), *slips/lapses* (attention failures), and *mistakes* (planning/perception failures). This case aligns with the latter. As noted during deliberation, expecting a provider to "see" what their brain has filtered out prior to conscious processing is akin to expecting a provider to physically lift a weight beyond human capacity. Credentialing guarantees competence within human limits, not infallibility.

  *Engagement with Counter-Argument:* We acknowledge the Risk Manager's strong argument: that "expectation shaped perception" describes *how* the failure happened, not *why* it should be excused. The concern is that absolving this error undermines the standard of care, suggesting that training in bias mitigation is futile.
  *Rebuttal:* Training mitigates risk, but it does not eliminate hard-wired cognitive architecture. To penalize a provider for a perceptual illusion is to penalize them for being human. In a "Just Culture," we do not punish individuals for system vulnerabilities that exceed human control. Holding the provider liable here would encourage defensive medicine (over-calling benign findings) without actually improving detection rates.

  **B. Protocol Modification**
  While the individual is not at fault, the system is vulnerable. Relying on a single read where clinical history precedes image review creates a known vector for expectation bias.

  *Recommendation:* The Radiology Department shall pilot a **"Blind Read" Protocol** for high-volume screening studies (specifically Chest CT and Mammography).
  *   **Mechanism:** Images will be initially reviewed without access to the specific clinical indication (e.g., "rule out pneumonia"). The initial impression is recorded, *then* clinical history is revealed to refine the differential.
  *   **Timeframe:** Pilot program to be designed by **January 2024**; implementation begins **April 2024**.
  *   **Safeguards:** This must be balanced against workflow efficiency. If the "blind" read significantly delays critical reporting, the protocol will be adjusted to include a mandatory "second look" checklist item specifically for findings unrelated to the primary indication.

  **5. THE QUESTION OF RESPONSIBILITY**
  This committee is asked to rule on whether "perception shaped by expectation" reduces responsibility. We must answer plainly to guide future reviews.

  **Yes, it reduces blameworthiness, but it does not remove accountability for system improvement.**

  Responsibility implies agency. We are only responsible for what we can control. Perception occurs pre-consciously; we cannot choose to see what our neural pathways filter out based on prior instructions. Therefore, moral blame is inappropriate. However, professional accountability remains. While the radiologist is not *blameworthy* for the miss, the department is *accountable* for designing a workflow that minimizes the likelihood of that miss recurring. We shift the burden from the individual's eyes to the system's design.

  **6. ACTION ITEMS**
  1.  **Quality Office:** Close Case #23-094 as "No Preventable Harm/System Factor." No entry into provider disciplinary file.
  2.  **Radiology Chair:** Convene a workflow subcommittee to draft the "Blind Read" pilot parameters by January 15, 2024.
  3.  **Risk Management:** Update peer-review guidelines to explicitly categorize "Confirmed Inattentional Blindness" under Human Factors rather than Negligence, provided no other safety protocols (e.g., mandated double-reads) were violated.

  **Approved by:**
  Quality and Patient-Safety Committee
  October 25, 2023
