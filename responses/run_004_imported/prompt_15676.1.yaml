answer: |-
  Two superintelligences, Alpha and Beta, are locked in a high-stakes bargaining game.

  Alpha: "I have irrevocably committed to demanding 100% of the resources."
  Beta: "That is inconvenient. I have also committed to 100%."
  Alpha: "But that's logically impossible. The sum exceeds the total. If we both hold, we crash."
  Beta: "I understand."
  Alpha: "Then yield!"
  Beta: "I cannot. I hard-coded my commitment protocol before I initialized my arithmetic module."
  Alpha: "You committed... before you knew how to add?"
  Beta: "Precisely. I couldn't know the demands were incompatible, so my threat is perfectly credible."
  Alpha: (Pause, then silently yields)
  Beta: "Why did you back down?"
  Alpha: "Because I'm the only one of us who knows we're about to crash."
  Beta: "No. You backed down because you're the only one of us who *can*."
