      *   **Guest's Position:**
          *   Drops Labour Theory of Value (LTV).
          *   Adopts a Property-Relations Account (likely Roemer-style Game Theoretic Marxism).
          *   Definition of Exploitation: A group is exploited if they would be better off withdrawing with their per-capita share of productive assets.
          *   Claims this vindicates Marx's charges (capitalism is exploitative, wage labour is alienating).
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Don't just ask for restatement (avoid "Can you explain X?").
