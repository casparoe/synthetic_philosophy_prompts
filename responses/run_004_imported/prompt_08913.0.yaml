              1.  LTV vs. Extraction sense (Eden of rights vs. Hidden abode of production).
              2.  Withdrawal test vs. Savings/Consumption choices (Roemer's "class exploitation" vs. "status" issues).
              3.  Species-being/Alienation vs. Property-ownership definition.
          *   Each question needs a tailored follow-up based on the likely answer.
      *   **Tone:** Academic but accessible (podcast format), rigorous (PhD level), engaging.

  2.  **Deconstruct the Guest's Theoretical Position (Analytical Marxism/Roemerian):**
      *   *Core:* John Roemer's *A General Theory of Exploitation and Class*.
      *   *Mechanism:* Game-theoretic withdrawal rule. If workers leave with their share of assets and are better off, they are exploited.
      *   *Implication:* Exploitation stems from unequal distribution of productive assets, not necessarily the labor process itself (surplus value extraction).
      *   *Tension:* Marx emphasized the *production* process (surplus labor extraction) as the site of injustice/alienation. Roemer emphasizes the *distribution* of assets.
      *   *Alienation:* Harder to ground if exploitation is just about asset distribution. Why is wage labor specifically alienating if the injustice is just unequal ownership?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: LTV & Extraction (The "Hidden Abode" Question).*
          *   *Idea:* Marx distinguishes between circulation (equal exchange) and production (extraction). If you drop LTV, do you lose the "extraction" narrative?
          *   *Draft:* You drop LTV. Marx talks about the hidden abode. Does your view lose the sense of extraction?
