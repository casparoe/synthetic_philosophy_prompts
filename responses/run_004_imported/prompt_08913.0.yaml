      *   *Requirement 2: Withdrawal Test & Savings/Consumption (The "Frugal Capitalist" Question).*
          *   *Idea:* Roemer's model implies if a worker saves and becomes a capitalist, they aren't exploited. But what if the verdict depends on choices, not just initial assets?
          *   *Draft:* What about savings? If I save, am I still exploited?
          *   *Refinement:* Focus on the *moral* implication. If exploitation tracks choices, does it lose its structural force?
          *   *Follow-up:* She will likely distinguish between class status and individual choice. Push on the *stability* of the class structure.

      *   *Requirement 3: Alienation & Species-Being (The "Human Nature" Question).*
          *   *Idea:* Species-being is about the *activity* of labor. Property account is about *ownership*. Can you have alienation without the specific critique of the labor process?
          *   *Draft:* How does species-being fit with property relations?
          *   *Refinement:* Connect it to the *character* of labor. If we equalize assets but keep wage labor, is alienation gone?
          *   *Follow-up:* She might say alienation is reduced. Push on whether wage labor *itself* is the problem or just the pay.

      *   *Requirement 4-10: Filling the gaps (Need 5-7 more questions).*
          *   *Topic:* Normative Force. Why is exploitation bad in this model? (Welfare vs. Freedom).
          *   *Topic:* Historical Materialism. Does this view fit Marx's historical narrative?
          *   *Topic:* Power Relations. Roemer is criticized for ignoring workplace power.
          *   *Topic:* Socialism. What does the remedy look like? (Market Socialism?)
          *   *Topic:* Methodology. Why "Analytical"? What is lost from the dialectical method?
          *   *Topic:* Ideology. How does this view explain false consciousness if it's just math?
          *   *Topic:* Contemporary Relevance. Gig economy, intellectual property.

  4.  **Developing the Questions & Follow-ups (incorporating the constraints):**

      *   *Q1 (LTV/Extraction):* Focus on the "theft" aspect. Without LTV, is it just inequality?
      *   *Q2 (Withdrawal/Choices):* Focus on the "coupon socialism" implication.
      *   *Q3 (Alienation/Species-being):* Focus on the *activity* vs. *outcome*.
      *   *Q4 (Power):* Roemer is often critiqued for ignoring the *command* structure of the firm.
      *   *Q5 (Normativity):* Is the objection welfare-based or freedom-based?
      *   *Q6 (History):* Does this fit the transition from feudalism?
      *   *Q7 (Methodology):* Rational choice vs. Dialectics.
      *   *Q8 (Remedy):* Market Socialism. Is that enough?

  5.  **Refining for Tone and Depth:**
      *   Ensure the questions sound like they come from a peer (PhD student), not a layperson. Use terms like "normative force," "phenomenology," "counterfactual."
      *   Ensure follow-ups anticipate the standard Analytical Marxist defense (usually rational choice, welfare-based, institutional focus).

