  **MEMORANDUM**

  **TO:** Computer Science Society Membership, Tournament Competitors, and Faculty Advisor
  **FROM:** Rules Committee (Fall Tournament)
  **DATE:** October 24, 2023
  **SUBJECT:** Ruling on Tournament Dispute Regarding Source Code Coordination and Program Equilibrium

  ### 1. Executive Summary

  The Rules Committee has reviewed the formal complaint filed regarding the results of this year's Prisoner's Dilemma Bot Tournament. The complaint alleges that the first and second-place entries engaged in collusion by submitting syntactically identical source code, thereby securing mutual cooperation while defecting against the field.

  After deliberation, the Committee issues the following ruling: **The complaint is upheld in part.** While the strategy employed utilizes valid concepts from open-source game theory, the method of implementation violated the implicit tournament standard of **Independent Strategy Development**. 

  Accordingly, the match result between the two accused entries will be recalculated as Mutual Defection. Final standings and prize distribution will be adjusted to reflect this change. Additionally, this memo outlines new regulations for next year's tournament to distinguish between legitimate program equilibrium strategies and prohibited coordination.

  ### 2. Analysis of the Dispute

  The core of this dispute lies in the distinction between two types of cooperation enabled by code visibility: **Syntactic Identity** (the strategy used by the accused students) and **Semantic Implication** (the strategy used by the fourth competitor).

  **A. The Accused Strategy (Syntactic Identity)**
  The two entries in question utilized a "CliqueBot" strategy: `if normalize(opponent_code) == normalize(my_code): Cooperate else: Defect`. 
  *   **Theoretical Validity:** In the academic literature on Program Equilibrium, this is a recognized Nash equilibrium. It successfully leverages code visibility to enforce cooperation.
  *   **Procedural Issue:** For this strategy to yield cooperation, the source code *must* match. Since the students are distinct entities, this match cannot occur by chance; it requires pre-tournament coordination to synchronize their files. This coordination constitutes an exchange of strategic information prior to submission, violating the standard assumption of independent entry in competitive tournaments.

  **B. The Fourth Competitor's Strategy (Semantic Implication)**
  The fourth entry utilized a "Löbian" strategy, cooperating only if it could mathematically prove the opponent would cooperate with it.
  *   **Theoretical Validity:** This is considered "Robust Cooperation." It relies on logical inference regarding the opponent's *behavior*, not their *identity*.
  *   **Procedural Status:** This strategy requires no pre-game coordination. Two strangers running Löbian bots will cooperate purely because their logic converges, not because they agreed on a file hash. This aligns with the tournament's goal of testing decision algorithms, not file synchronization.

  **C. The Defense**
  The accused students correctly note that no written rule explicitly forbade code matching and that they exchanged no information *after* the tournament began. We accept that this was a good-faith exploitation of an ambiguity in the rules rather than malicious cheating. However, the "no communication" rule in tournaments inherently covers the *development phase* of entries. Allowing pre-arranged code identity effectively permits two players to act as a single agent with two entries, granting them an unfair advantage in the standings over independent agents.

  ### 3. Ruling and Standings Adjustment

  The Committee distinguishes between the *mechanic* (code visibility) and the *constraint* (independent development). Code visibility is intended to allow bots to reason about an opponent's logic at **runtime**. Pre-arranging code identity shifts the cooperation decision to **compile-time**, bypassing the intended analytical challenge.

  **Decision:**
  1.  **Violation:** The coordination of source code to ensure syntactic identity is ruled a violation of the Independent Development standard.
  2.  **Adjustment:** The specific match between the two accused bots will be voided and rescored as **Mutual Defection**. This removes the "cooperation bonus" gained solely through coordination while preserving points earned against the rest of the field (where their strategy performed as a standard Defector).
  3.  **Standings:** Based on this recalculation, the first and second-place titles are revoked. The standings will be recalculated and posted prior to the awards ceremony. The prize fund will be distributed according to the new rankings.

  ### 4. Regulations for Next Year's Tournament

  To prevent future ambiguity and encourage the spirit of open-source game theory, the following rules are adopted effective immediately for the next tournament:

  **Rule 1: Independent Derivation**
  All entries must be developed without collaboration regarding source code structure, logic, or specific implementation details. Any form of pre-tournament agreement to align code syntax (including hashing, commenting styles, or variable naming for the purpose of matching) is prohibited.

  **Rule 2: Semantic Analysis Requirement**
  Bots are permitted to inspect opponent source code, but cooperation decisions must be derived from **semantic analysis** of the opponent's logic (e.g., simulation, proof search, or behavioral inference). 
  *   *Prohibited:* Cooperation based solely on syntactic identity checks (e.g., `if source_hash == my_hash`).
  *   *Permitted:* Cooperation based on functional equivalence or logical proof (e.g., Löbian cooperation, simulation-based tit-for-tat).

  **Rule 3: The "Black Box" Clause**
  While source code is visible, entrants may not use external metadata (file names, submission timestamps, or author tags embedded in comments) to make decisions. Only the functional logic of the code is admissible for inspection.

  ### 5. Closing Statement

  To the accused students: Your understanding of Program Equilibrium theory is commendable, and your technical execution was flawless. In a different context—such as a research collaboration—your approach would be a valid demonstration of Clique Equilibrium. However, in a competitive tournament setting, the integrity of the competition relies on the independence of its participants. You found a loophole between *theoretical validity* and *procedural fairness*; while we acknowledge the ingenuity, the procedural fairness must prevail to maintain a level playing field.

  To the membership: The goal of this tournament is to explore how transparency can foster trust through *reasoning*, not through *recognition*. We encourage all participants to study the "Löbian" approach and other robust cooperation strategies for the next cycle. We want to see bots that learn to trust strangers, not just their creators' friends.

  **Signed,**

  The Rules Committee
  Computer Science Society
