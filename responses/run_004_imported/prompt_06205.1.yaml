      *   If Group B has fewer Guilty people overall, I have to dig deeper into the Innocent pool to find enough Guilty people to maintain the ratio? No, that's not quite right.
      *   *Correction:* Let's stick to the math in Attempt 2. It's the clearest.
      *   *Refined Intuition:* To keep the "High Risk" label equally trustworthy (calibrated) across groups, the *mix* of people inside that label must be the same (e.g., 1 guilty for every 1 innocent). But if one group has way more guilty people to start with, you end up pulling a much larger slice of their innocent population to maintain that mix, compared to the other group.
      *   *Wait, actually:* If Group Black has higher base rate (more reoffenders), and we want Calibration (same % of High Riskers reoffend).
      *   Group Black: 40 reoffenders. Group White: 20 reoffenders.
      *   To get 50% calibration:
          *   Black: Take 20 reoffenders + 20 non-reoffenders. (20 FPs).
          *   White: Take 10 reoffenders + 10 non-reoffenders. (10 FPs).
      *   FPR = FPs / Total Non-Reoffenders.
      *   Black Non-Reoffenders = 60. FPR = 20/60 = 33%.
      *   White Non-Reoffenders = 80. FPR = 10/80 = 12.5%.
      *   *Why?* Because the Black group has *fewer* innocent people to begin with (60 vs 80). So taking 20 of them hurts more (percentage-wise) than taking 10 of the White group's 80.
      *   *Key Insight:* The group with the higher base rate of recidivism has a *smaller pool of innocent people*. To keep calibration equal, you inevitably flag a larger *percentage* of that smaller innocent pool.

