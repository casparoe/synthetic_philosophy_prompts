      *   *Explain DDE:* Break down the four conditions clearly. Focus heavily on "Intention" and "Means."
      *   *Anscombe's Application:* How did she apply this to Truman? Focus on the concept of "direct intention." The bomb wasn't aimed at a gun factory; it was aimed at the city.
      *   *The "Collateral Damage" Counter:* Address the friend's argument. Distinguish between *area bombing* (often immoral under DDE) and *precision bombing* (potentially moral). Acknowledge that Anscombe likely thought the firebombing of Tokyo was *also* problematic, but the atomic bomb made the intent undeniable.
      *   *Key Distinction:* The "Why." Why is one murder? Because the death is the *tool*. Why is the other not? Because the death is the *cost*.
      *   *Nuance:* Mention that historians debate whether Japan would have surrendered without the bombs or if the Soviet entry was the real factor (context for the "proportionality" condition of DDE).
      *   *Conclusion:* Summarize. Anscombe isn't saying "Nukes bad, bombs good." She's saying "Intentional killing of innocents bad, accidental killing of innocents (sometimes) okay."

  7.  **Refining the Tone:**
      *   Keep it philosophical but accessible.
      *   Avoid taking a hard political stance on Truman himself, focus on the *ethical framework* Anscombe used.
      *   Ensure the distinction between "foreseen" and "intended" is crystal clear, as that's the user's main sticking point.

  8.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I explain *why* Anscombe thought Truman's case was different from standard collateral damage?
      *   *Correction:* Make sure to emphasize that for Anscombe, the *policy* of unconditional surrender combined with area bombing meant the civilians were the target, not just victims.
      *   *Check:* Did I address the friend's point about conventional bombing?
      *   *Correction:* Yes, by noting that Anscombe would likely classify much of the conventional firebombing as immoral too, but the atomic bomb was the clearest example of the principle.
      *   *Check:* Is the DDE explanation accurate?
