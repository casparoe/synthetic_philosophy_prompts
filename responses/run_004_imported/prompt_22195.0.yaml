answer: |-
  This is a classic and deeply significant debate in moral philosophy. You actually stumbled into one of the most famous applications of the **Doctrine of Double Effect (DDE)** in the 20th century.

  Your friend's argument is intuitive: "Death is death, so why does the label change?" But Anscombe's argument isn't about the *body count*; it is about the **structure of the intention**.

  Here is the breakdown of how Anscombe's specific argument against Truman differs from the standard DDE justification for collateral damage, and why she classified Hiroshima and Nagasaki as murder rather than regrettable wartime necessity.

  ### 1. The Doctrine of Double Effect (DDE) Basics
  To understand Anscombe, you have to understand the rules she was applying. The DDE (rooted in Aquinas, refined by modern Just War Theory) says an action with both a good and a bad effect is permissible only if four conditions are met:

  1.  **Nature of the Act:** The action itself must be morally good or neutral (e.g., bombing a munitions factory).
  2.  **Intention:** The agent must intend *only* the good effect. The bad effect (civilian death) must not be intended.
  3.  **Means:** The bad effect must not be the *means* to achieve the good effect. (You cannot kill civilians *in order to* win the war).
  4.  **Proportionality:** The good effect must outweigh the bad effect.

  **The Friend's Assumption:** Your friend assumes that because civilian death was *foreseen* in conventional bombing, it fits Condition 2 (unintended). Therefore, if conventional bombing is okay, atomic bombing should be too.

  **Anscombe's Rebuttal:** She argues that Truman's decision failed **Condition 2 (Intention)** and **Condition 3 (Means)**.

  ### 2. Intended vs. Foreseen (The Core Distinction)
  This is the hinge of the whole argument. In DDE, there is a massive moral difference between *foreseeing* a consequence and *intending* it.

  *   **Collateral Damage (Standard DDE):** I bomb a bridge to stop enemy tanks. I know there are civilians nearby, and some might die. I regret their death. If I could stop the tanks without killing them, I would. Their death is a **side effect**.
  *   **Anscombe's View of Truman:** The atomic bombs were not dropped on a specific military installation (like a hidden submarine pen) where civilians happened to be. They were dropped on the **city centers**. The destruction of the city and the killing of the populace was not a side effect; it was the **method**.

  Anscombe argued that the U.S. policy had shifted to "obliteration bombing." The logic was: *Destroy the civilian population's will to fight.* If the death of civilians is the mechanism by which you force surrender, you **intend** their death. You are using their death as a tool.

  For Anscombe, **using innocent people as tools to achieve a military goal is murder**, regardless of whether the tool is a conventional firebomb or a nuclear device.

  ### 3. The "Means" Condition
  This is where your friend's comparison falls apart under Anscombe's scrutiny.

  *   **Legitimate Target:** If you bomb a munitions factory, the *means* to victory is "destroying the guns." The civilian deaths do not help you win; in fact, they are a moral cost you incur *despite* trying to win.
  *   **Truman's Decision:** Anscombe argued that the *means* to victory in this specific instance was "terrorizing the population." The radiation, the blast, and the fire were aimed at the human infrastructure of the city.

  If the civilian deaths contribute directly to the strategic goal (by creating terror or removing the workforce), they are no longer "collateral." They are instrumental. Under DDE, **you cannot do evil (kill innocents) so that good (victory/peace) may come.**

  ### 4. Addressing Your Friend's Point on Conventional Bombing
  Your friend asked: *"Every bombing campaign killed civilians... so why is her reasoning different?"*

  Here is the tricky part: **Anscombe would likely agree with your friend that much of the conventional bombing was also immoral.**

  Anscombe was not arguing that "Nukes = Murder, Firebombs = Okay." She was arguing against the **policy of targeting civilian populations**, which culminated in the atomic bombs.
  *   She famously opposed Oxford granting Truman the degree because it was an endorsement of the *policy* of targeting civilians.
  *   She acknowledged that the firebombing of Dresden and Tokyo also violated the DDE because the intent was often area destruction to break morale, not precision strikes on military hardware.

  However, the atomic bomb made the intention **undeniable**.
  *   With a conventional raid, you can argue (however weakly), "We were aiming at the rail yards, the houses next door just got caught in the blast."
  *   With a single atomic bomb leveled at a city center, the "collateral damage" defense collapses. The entire point of the weapon was that one bomb destroys the whole city. The intent to wipe out the civilian center is explicit in the weapon's design and deployment.

  ### 5. Proportionality and Necessity
  Finally, there is Condition 4 (Proportionality). DDE requires that there be a "proportionate reason" to allow the bad effect.

  Anscombe (and many historians) argued that the "military necessity" was overstated.
  *   **The Friend's View:** It saved a million lives by preventing an invasion. (This is the standard justification for Proportionality).
  *   **Anscombe's View:** She was skeptical that the invasion was the only alternative. She, along with many military leaders at the time (like Eisenhower and Leahy), believed Japan was already on the verge of surrender, particularly due to the Soviet entry into the war.

  If the war could have been won without the bombs, then the killing of 200,000 civilians fails the Proportionality test. If the killing wasn't *necessary* to achieve the good end, then it was gratuitous murder.

  ### Summary for Your Argument
  If you talk to your friend again, here is the distinction to draw:

  1.  **It's not about the number of dead.** Anscombe isn't doing math; she's looking at **intent**.
  2.  **Collateral Damage:** Civilian death is an **unintended cost** of hitting a military target. (Permissible under DDE if proportional).
  3.  **Truman's Bombs:** Civilian death was the **intended method** of breaking enemy morale. (Forbidden under DDE).
  4.  **The Friend's Error:** Assuming that because conventional bombing *also* killed civilians, it was morally identical. Anscombe would say much of the Allied area bombing was *also* immoral, but the atomic bomb made the intentional targeting of civilians impossible to deny.

  Anscombe's point was that **you cannot justify murder by pointing to other murders.** If the conventional bombing was murder, that doesn't make Truman innocent; it makes the whole strategy corrupt. But specifically regarding Truman, she argued he explicitly adopted the massacre of innocents as a policy instrument, which violates the fundamental rule of war: **non-combatants are not targets.**

  **The TL;DR:** Your friend thinks the difference is *outcome* (people died in both). Anscombe says the difference is *purpose* (did we kill them to win, or did they die while we tried to win?). She argues Truman did the former.
