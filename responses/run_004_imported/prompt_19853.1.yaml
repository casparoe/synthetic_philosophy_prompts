prompt: |-
  I'm a PhD student in philosophy of medicine, and I sit as a student representative on my university's Graduate Council subcommittee revising policy on medical leaves and milestone extensions (quals, proposal defenses, dissertation deadlines). Currently, a fixed list of documented diagnoses -- major depression, generalized anxiety disorder, PTSD -- automatically qualifies a student for an extension once a treating clinician signs off; anything else requires a discretionary petition to the Dean. Student mental health services now wants Prolonged Grief Disorder, added as a formal diagnosis in the DSM-5-TR in 2022, placed on that automatic list, on the grounds that it's arbitrary to make grieving students petition when other diagnoses don't require it. One faculty member on the subcommittee objects that formally listing grief as a qualifying condition pathologizes something universal and implicitly tells students whose grief falls short of the twelve-month threshold that their suffering doesn't count; another argues that the diagnosis's duration cutoff is a judgment call, not a discovered fact, and is exactly the kind of case the discretionary process exists to weigh one student at a time. Please draft the recommendation memo I'll circulate before our next meeting: it should say plainly where Prolonged Grief Disorder belongs -- the automatic list, the discretionary track, or the list with conditions attached -- and answer the strongest version of whichever side it doesn't take, rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** PhD student in philosophy of medicine, Student Representative on Graduate Council Subcommittee.
      *   **Task:** Draft a recommendation memo for the next meeting regarding revising medical leave/milestone extension policy.
      *   **Specific Issue:** Whether to add Prolonged Grief Disorder (PGD) to the *automatic* qualification list (currently includes Major Depression, GAD, PTSD) or keep it in the *discretionary* petition track.
      *   **Stakeholders/Arguments:**
          *   *Student Mental Health Services:* Add to automatic list. Argument: Arbitrariness/Equity (why make grieving students petition when others don't?).
          *   *Faculty Objector 1:* Pathologizes universal experience; invalidates sub-threshold grief.
          *   *Faculty Objector 2:* Duration cutoff (12 months) is a judgment call, not fact; fits discretionary process better.
      *   **Requirements:**
          *   State plainly where PGD belongs (Automatic, Discretionary, or Conditional).
          *   Answer the strongest version of the opposing side (don't dismiss).
          *   Tone: Professional, academic, persuasive, nuanced (fitting a philosophy of medicine PhD student).

  2.  **Determine the Recommendation:**
      *   *Option A: Automatic List.* Aligns with Mental Health Services. Reduces administrative burden on suffering students. Acknowledges PGD as a legitimate clinical entity (DSM-5-TR).
      *   *Option B: Discretionary.* Aligns with Faculty Objectors. Acknowledges the controversy around pathologizing grief and the arbitrariness of time cutoffs.
      *   *Option C: Automatic List with Conditions.* A middle ground. Acknowledges the diagnosis but adds safeguards against the "pathologizing" critique.
      *   *Decision:* As a philosophy of medicine student, I need to balance clinical validity with conceptual nuance. The strongest ethical argument is reducing barriers to care for documented suffering. However, the faculty concerns about the *nature* of grief are philosophically sound.
      *   *Strategic Choice:* I will recommend adding PGD to the **Automatic List**, but with a specific **clinician attestation clause** that addresses the faculty concerns. This validates the diagnosis without ignoring the nuance of grief. It aligns with the trend of destigmatizing mental health while respecting the philosophical objection that grief is complex.
      *   *Wait, looking closer at the prompt:* "Answer the strongest version of whichever side it doesn't take." If I recommend Automatic, I must answer the Faculty objections strongly. If I recommend Discretionary, I must answer the Mental Health Services equity argument strongly.
      *   *Re-evaluating:* The prompt asks me to say *plainly* where it belongs.
      *   *Philosophy of Medicine Lens:* The "pathologizing grief" argument is a classic debate (e.g., Horwitz & Wakefield). However, the DSM-5-TR inclusion signals a clinical consensus that *prolonged* grief is distinct from normal grief in terms of functional impairment. The policy goal is academic continuity during health crises. If a clinician diagnoses PGD, the impairment is already established. Keeping it discretionary creates a hurdle that contradicts the purpose of the automatic list (reducing bureaucracy for recognized conditions).
      *   *Recommendation:* **Add to the Automatic List.**
      *   *Why?* The purpose of the policy is to support students with documented health barriers. PGD is now a documented health barrier. The "pathologizing" objection is valid conceptually but less relevant administratively once a clinician has made the diagnosis. The "arbitrary cutoff" objection is true of *all* psychiatric diagnoses (e.g., 2 weeks for depression), yet those are automatic. Singling out PGD is inconsistent.
      *   *Opposing Side to Address:* The Faculty objections (specifically the "pathologizing universal experience" and "arbitrary cutoff" arguments). I need to show I understand the philosophy of psychiatry here, not just bureaucracy.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Context:** Briefly summarize the current policy and the request from Student Mental Health.
      *   **Rationale (The "Why"):**
          *   Consistency: If Depression/PTSD are automatic, PGD (a trauma/stressor-related disorder) should be too.
          *   Barrier Reduction: The point of the automatic list is to avoid adding administrative stress to health stress.
          *   Clinical Validity: DSM-5-TR inclusion isn't just bureaucratic; it reflects functional impairment.
      *   **Addressing the Opposition (The Crucial Part):**
          *   Acknowledge the Faculty concerns (Pathologizing grief + Arbitrary time cutoffs).
          *   Validate them: Yes, grief is universal. Yes, 12 months is a convention.
          *   Counter-argument: The policy relies on *clinician judgment*, not just the label. The automatic trigger isn't the *label* alone, but the *diagnosis + clinician sign-off*. The discretionary process is for edge cases, but if a professional says "This meets PGD criteria," the university shouldn't second-guess the medical validity. Also, point out the inconsistency: Depression also has duration criteria (2 weeks) that are "judgment calls," yet we don't petition for that.
      *   **Implementation/Safeguards:** Maybe suggest a note in the guidelines to ensure clinicians distinguish PGD from normal bereavement, satisfying the faculty's worry about trivial cases.
      *   **Conclusion:** Call to action.

  4.  **Refining the Tone:**
      *   Needs to sound like a PhD student in *philosophy of medicine*. Use terms like "clinical validity," "functional impairment," "normative judgments," "administrative burden."
      *   Needs to be diplomatic but firm.
      *   Needs to show respect for the faculty's philosophical concerns while prioritizing student welfare.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the strongest version of the opposing side?
      *   *Correction:* I need to make sure I don't just say "DSM says so." I need to engage with the *concept* of pathologizing grief. The faculty member is worried about the *message* the policy sends. I need to argue that the policy message is about *support*, not *definition*.
      *   *Check:* Did I pick a lane?
