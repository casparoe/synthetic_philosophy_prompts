answer: |-
  **MEMORANDUM**

  **TO:** Graduate Council Subcommittee on Academic Standing and Support
  **FROM:** [Your Name], Student Representative, PhD Candidate in Philosophy of Medicine
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Prolonged Grief Disorder (PGD) and Medical Leave Policy

  **Recommendation**

  I recommend that Prolonged Grief Disorder (PGD) be added to the **automatic qualification list** for medical leaves and milestone extensions, contingent upon documentation from a treating clinician.

  This recommendation aligns PGD with existing automatic qualifiers such as Major Depressive Disorder and PTSD. It prioritizes the reduction of administrative burden on students experiencing documented functional impairment while maintaining the necessary gatekeeping role of licensed clinicians.

  **Rationale**

  The primary function of the automatic qualification list is to acknowledge that certain health conditions constitute significant, recognized barriers to academic progress. When a licensed clinician diagnoses a student with a condition on this list, the university accepts that diagnosis as sufficient evidence of impairment without requiring further adjudication by the Dean's office.

  Since the inclusion of PGD in the DSM-5-TR (2022), the psychiatric consensus is that prolonged grief is distinct from normative bereavement in terms of severity, persistence, and functional impairment. Student Mental Health Services argues correctly that requiring a discretionary petition for PGD creates an inequitable administrative hurdle. A student grieving a spouse must navigate the same bureaucratic process as a student petitioning for a non-listed physical injury, while a student with Major Depression does not. Given that our policy aims to support retention and well-being, removing this friction for a recognized DSM diagnosis is consistent with our treatment of other mental health conditions.

  **Addressing Faculty Concerns**

  I understand the objections raised regarding the addition of PGD to the automatic list. Specifically, there is concern that formally listing grief pathologizes a universal human experience and that the twelve-month duration criterion is a normative judgment rather than a biological fact, making it better suited for discretionary review. These are philosophically robust concerns that deserve serious engagement.

  *On Pathologizing Universal Experience:*
  The objection that listing PGD validates the "medicalization of sadness" is a significant critique within the philosophy of psychiatry (cf. Horwitz & Wakefield). However, we must distinguish between the *clinical definition* of a disorder and the *administrative policy* responding to it. Our policy does not define what constitutes pathological grief; it merely responds to a diagnosis made by a medical professional. By keeping PGD on the discretionary track, the Subcommittee is not preventing the pathologization of grief; clinicians are already diagnosing it. Rather, we would be imposing an additional layer of bureaucratic skepticism on grief that we do not impose on depression or anxiety. If we accept a clinician's signature on a depression diagnosis as sufficient for automatic leave, consistency demands we extend the same trust to a PGD diagnosis. To do otherwise implies that the university regards grief as inherently more suspect than depression, which risks stigmatizing the very students we aim to support.

  *On the Arbitrariness of Duration Cutoffs:*
  The argument that the twelve-month threshold is a "judgment call" is accurate, but it applies equally to every condition currently on the automatic list. Major Depressive Disorder requires a two-week duration; Generalized Anxiety Disorder requires six months. These are not discovered natural kinds but consensus-based thresholds intended to distinguish transient distress from clinical impairment. If the presence of a duration-based judgment call is sufficient grounds to move a condition to the discretionary track, then logically, Depression and GAD should also be moved to the discretionary track. Since the Subcommittee has determined that the clinical judgment regarding duration is sufficient for those conditions, singling out PGD suggests an inconsistency in how we evaluate psychiatric validity. The discretionary process is designed for conditions where impairment is variable or context-dependent; however, once a clinician certifies that a student meets the DSM-5-TR criteria for PGD, the impairment is established by definition.

  **Conclusion**

  Keeping PGD in the discretionary track places the burden of proof on the grieving student to justify the validity of their suffering to an administrative body, rather than to their treating provider. While the concerns regarding the conceptual boundaries of grief are valid, they are matters for clinical diagnosis, not academic policy. Our policy should focus on accommodating documented health barriers. Therefore, adding PGD to the automatic list is the most consistent, equitable, and ethically sound course of action.

  I look forward to discussing this further at our meeting on November 2nd.
