answer: |-
  A traveler bumps into Death in a Baghdad market.

  **Death:** "Surprised to see you here. I have an appointment for you in Damascus tomorrow."
  **Traveler:** "Then I shall go to Aleppo!"
  **Death:** "I anticipated that. I'll be in Aleppo."
  **Traveler:** "Then I shall go to Damascus!"
  **Death:** "I anticipated that, too."

  The traveler sighs, reaches into their pocket, and pulls out a coin.

  **Death:** "Really? A coin?"
  **Traveler:** "It's the only ratifiable move. If I commit to Aleppo, I know you'll be there, so I regret going. If I commit to Damascus, I know you'll be there, so I regret going. My pure strategies are self-undermining."
  **Death:** "So you're flipping to save your life?"
  **Traveler:** "No, I'm flipping to stabilize my expected utility. It's the only mixed-strategy equilibrium."
  **Death:** "You realize I can just wait for the coin to land and follow you, right? Why not just *run*?"
  **Traveler:** "Running is a deterministic choice. It implies I think I can outpredict a perfect predictor. That's irrational."
  **Death:** "So you'd rather gamble than sprint?"
  **Traveler:** "Sprinting is for people who want to live. I'm optimizing for not dying with an unratifiable decision procedure."
  **Death:** "You're going to let me reap you because you don't want to violate the axioms of causal decision theory?"
  **Traveler:** *Flips the coin.* "Better dead than unratifiable."
