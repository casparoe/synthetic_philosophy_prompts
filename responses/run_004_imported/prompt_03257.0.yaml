answer: |-
  The box of books sat on the kitchen island, taped shut until yesterday. Elias had cut the strap with a steak knife. Now, the *Zhuangzi* lay open, its spine cracked by someone else's hands—his friend Sarah's, who had pressed it into his palm at the funeral reception with a whisper that felt too loud for the room.

  *Six weeks,* Elias thought. The number felt arbitrary. The house still smelled of his mother's specific blend of lavender and stale coffee, a scent that was currently undergoing its own slow transformation into something dustier.

  Sarah was at the sink, washing the mug she'd just used. "Just read the 'Perfect Happiness' chapter," she had said earlier. "Don't read it like philosophy. Read it like a manual."

  Elias looked at the page. He read the passage again. *Zhuangzi squatted, drumming on a basin, and sang.* His wife had just died. Huizi, his friend, came to offer condolences and found him making noise. Huizi said, *'This is going too far.'*

  "It's offensive," Elias said. His voice sounded thin in the empty kitchen.

  Sarah turned off the tap. She didn't dry her hands. "It's not about not caring, Elias. It's about the process."

  "It says he sang. She's a corpse. He's banging on a pot." Elias tapped the page. "It feels like a trick. Like if you say the right words, you don't have to feel the weight of it."

  "Or," Sarah said, leaning against the counter, "maybe the weight is what you're making, not what you're carrying." She pointed to the next section Sarah had dog-eared. Master Lai. The dying man. *'The Great Clod burdens me with form, labors me with life, eases me in old age, rests me in death.'*

  "The smith casting metal," Elias recited, the words tasting like copper. "If the metal jumped up and said, 'I must be a sword,' the smith would think it inauspicious."

  "You're the metal," Sarah said softly. "Your mother is the metal. She's not the sword anymore. She's just... back in the mold."

  Elias closed the book. The thud was heavy. "There was a skull, too. In the other chapter. He talked to a skull on the road. Asked if it wanted to live again. The skull said no. It said the dead have no rulers above, no subjects below. No seasons. Just freedom." Elias looked at the hallway leading to his mother's bedroom. The door was ajar. "That's not wisdom, Sarah. That's just the silence winning."

  "Maybe," she said. "Or maybe the noise was the burden."

  Elias stood up. He needed air. The kitchen felt like a sealed container. He walked out the back door into the garden. It was overgrown. His mother had stopped tending it during the last year of the illness. The weeds were waist-high, a chaotic green surge that seemed aggressive in its vitality.

  He walked to the shed. He didn't know why. He just needed to be where the tools were. Inside, it smelled of oil and dry rot. On a workbench sat an old, dented washtub, galvanized steel, used for mixing concrete or washing dogs. It was inverted.

  Elias stared at it. *Drumming on a basin.*

  He felt a surge of irritation so sharp it made his hands shake. It was the irritation of a man watching someone else eat his meal. This ancient text was consuming his grief, digesting it into neat, digestible parables about transformation. *The Transformation of Things.* The phrase felt sterile. Clinical.

  He picked up a wooden mallet from the bench. He looked at the tub.

  If he hit it, he would be Zhuangzi. He would be acknowledging the change. He would be admitting that the form she held—the body in the casket, the ashes in the urn on the mantle—was just a temporary casting that had cooled and cracked.

  If he hit it, he might also be a man having a breakdown in a shed, striking metal because he couldn't scream.

  He thought of the skull on the road. *'Among the dead there are no rulers, no subjects, no duties.'* When he visited the urn, he talked to it. He told her about the insurance, the weather, the guilt of not visiting enough in November. He demanded answers. He demanded she be the mother still. Was that the "inauspicious metal" jumping up and demanding to be a sword?

  Was his grief just bad metallurgy?

  He lifted the mallet. The garden was quiet. A neighbor was mowing a lawn three streets over, a low, droning hum that vibrated in his chest. The sound of the living.

  Elias brought the mallet down.

  *GONG.*

  The sound was hollow, resonant, and utterly devoid of emotion. It hung in the air, vibrating against the shed walls. It wasn't a sad sound. It wasn't a happy sound. It was just physics. Metal and wood and air.

  He hit it again. *GONG.*

  It felt good. Not because it expressed sorrow, but because it stopped the narrative. For the second the sound rang out, there was no "son," no "mother," no "loss." There was only the vibration.

  He hit it a third time, harder. *GONG.*

  "Hey!"

  Sarah was standing at the door of the shed. She had followed him. She looked at the mallet in his hand, then at the tub, then at his face.

  Elias lowered the mallet. His heart was beating fast. He felt a strange lightness in his chest, a void where the tight knot of anguish had been for forty-two days.

  "Are you okay?" Sarah asked. She didn't move closer. She looked concerned, perhaps frightened. To her, did he look like a man finding peace, or a man dissociating? To her, was this the equanimity of the Sage, or the numbness of shock finally calcifying?

  Elias looked at the dent he'd made in the rust. He thought about the skull refusing life. He thought about how much he wanted to stay in the shed, in the resonance of the hollow sound, rather than go back inside to sort through the photographs and the tax returns and the heavy, human business of the dead.

  He felt the absence of his mother not as a wound, but as a space. A large, open room inside him. It was terrifyingly empty. It was also incredibly quiet.

  "I don't know," Elias said. He rested his hand on the cold steel of the basin. It was cooling in the evening air. "It sounds like... it sounds like it's over."

  Sarah waited. She was looking for tears. She was looking for a breakdown. She was looking for a sign that he was still in the world of men, of rulers and subjects, of seasons and duties.

  Elias didn't cry. He just listened to the fading ring of the metal, wondering if the silence that followed was a friend coming to walk with him, or a door closing that would never open again.

  "It's just a noise," Elias said, but he didn't put the mallet down. "It's just the transformation of things."

  Sarah nodded slowly, her expression unreadable. "Do you want to come inside?"

  "In a minute," Elias said. He tapped the basin once more, very softly. *Gong.* He closed his eyes and let the vibration rattle his ribs, unable to tell if he was finally breathing, or if he had just stopped trying.
