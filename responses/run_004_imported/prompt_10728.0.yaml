answer: |-
  You have hit upon exactly the right spot. Your intuition that there is a "sleight of hand" in the move from "vague composition" to "vague existence" is shared by many professional metaphysicians. The argument you are describing is indeed David Lewis's "Argument from Vagueness," and it is widely considered the strongest argument for mereological universalism.

  However, it is not a logical proof. It relies on a specific, controversial assumption about the relationship between language, concepts, and reality.

  Below, I will construct the strongest possible case that the inference fails. I will argue that one can accept vague composition without accepting "vague existence" in the absurd sense Lewis describes. After building this case, I will give you my plain assessment of whether the inference ultimately holds.

  ### The Lewis Argument (Formalized)

  To defeat it, we must first be precise about what we are defeating. Lewis's argument runs roughly like this:

  1.  **Continuity:** If composition is restricted (sometimes yes, sometimes no), there must be borderline cases (e.g., bricks almost touching).
  2.  **Vague Existence:** In these borderline cases, it is indeterminate whether a composite object exists.
  3.  **Vague Counting:** If it is indeterminate whether an object exists, it is indeterminate *how many* objects exist.
  4.  **Impossibility:** It is impossible for it to be indeterminate how many objects exist (existence is precise; numbers are precise).
  5.  **Conclusion:** Therefore, composition cannot be restricted. It must be universal (always) or nihilistic (never).

  The "sleight of hand" you suspect lies primarily in the move from **Premise 2 to Premise 3**, and the interpretation of **Premise 4**.

  ### The Counter-Argument: Semantic Indeterminacy vs. Ontic Vagueness

  The strongest case against Lewis relies on distinguishing between **ontic vagueness** (fuzziness in the world itself) and **semantic indeterminacy** (fuzziness in our concepts or language).

  Lewis assumes that if it is indeterminate whether "the bricks compose a wall" is true, then the *world* is in an indeterminate state. He treats existence as a property of the world that is either present or absent. The counter-argument is that existence is not a property of objects, but a feature of our *description* of the world.

  Here is the step-by-step case that the inference fails:

  #### 1. Existence is Not a Property
  Immanuel Kant and Gottlob Frege famously argued that "existence" is not a predicate (a property like "red" or "heavy"). You cannot add "existence" to a concept of a thing to make it real. A real hundred dollars contains no more properties than an imaginary hundred dollars; the difference is not in the *content* of the object, but in its *instantiation*.

  If existence is not a property, then "vague existence" does not mean an object has the property of "existing" to a vague degree (like being half-real). That *would* be absurd. Instead, "vague existence" in the restricted composition view simply means: **It is indeterminate whether our concept "object" applies to this arrangement of particles.**

  #### 2. The "Baldness" Analogy for Counting
  Lewis argues that vague composition leads to vague counting, which is logically impossible. But we tolerate vague counting in other contexts without thinking reality is fuzzy.

  Consider a room full of men. Some are clearly bald, some clearly hairy, and some are borderline.
  *   **Question:** "How many bald men are in the room?"
  *   **Answer:** "It is indeterminate."

  Does this mean the *world* is fuzzy? Does it mean the number of *heads* or *hairs* is vague? No. The number of hairs is precise. The number of humans is precise. The vagueness lies entirely in the predicate "bald."

  The restricted compositionist argues that "object" (or "table," or "wall") is like "bald." It is a **sortal concept** with fuzzy boundaries.
  *   The number of *particles* is precise.
  *   The number of *composites* is indeterminate *only relative to the vague concept of composition*.

  Lewis insists that "object" is not like "bald"; he thinks "object" is a fundamental category of reality. The counter-argument is that "object" is a human cognitive tool we use to carve up reality. If the carving knife is dull, the slices are vague. That doesn't mean the cheese is fuzzy; it means the slicing is context-dependent.

  #### 3. Supervaluationism: Precision Without Commitment
  We can make this technically precise using a theory called **supervaluationism**.

  Imagine the borderline case of the bricks. There are many ways to make the word "object" precise (called *precisifications*).
  *   *Precisification A:* Anything with particles within 1mm counts as an object. (The bricks compose a wall.)
  *   *Precisification B:* Anything with particles within 0.1mm counts as an object. (The bricks do not compose a wall.)

  In Supervaluationism, a statement is **True** if it is true on *all* admissible precisifications. It is **False** if false on all. It is **Indeterminate** if true on some and false on others.

  Lewis says: "If it's indeterminate, then reality hasn't decided!"
  The Counter-Argument: "Reality *has* decided the position of every particle. Reality has *not* decided which precisification of the human concept 'object' is the 'one true' version, because there is no such thing as the 'one true' version."

  Therefore, the inference from "indeterminate composition" to "vague reality" fails. The reality (the particles) is precise. The *classification* is vague. Lewis demands that reality dictate our classification scheme. The counter-argument says our classification scheme is a tool we bring to reality, not something we extract from it.

  #### 4. The "Quantifier Variance" Defense
  This is the nuclear option against Lewis, defended by philosophers like Eli Hirsch. Lewis assumes that the logical quantifier ("there exists an $x$...") has a single, fixed meaning that carves reality at its joints.

  The counter-argument is **Quantifier Variance**. The meaning of "there exists" can vary depending on the conceptual scheme.
  *   In a "universalist scheme," "there exists" means "there are particles arranged thus."
  *   In a "common sense scheme," "there exists" means "there are particles arranged thus *and* they are functionally integrated."

  Neither scheme is "wrong" about the world. They are just different ways of speaking. When Lewis says "Vague existence is impossible," he is assuming his specific, rigid definition of "exists." If "exists" is flexible, then it is not a contradiction to say "It is vague whether $X$ exists," because we haven't fixed the rules of the game yet.

  ### The Critical Assessment: Does the Inference Hold?

  I have now built the strongest case available that the Lewis inference fails. The core of the case is that **vagueness in composition is semantic (about our words/concepts), not ontic (about the world).**

  Now, I must give you my plain assessment, as requested.

  **Does the inference really go through?**

  **No, the inference does not logically go through.** It is not a formal contradiction to believe in restricted composition with vague boundaries.

  However, you must understand *why* Lewis and his followers find it so persuasive, because there is a cost to rejecting his argument.

  If you accept the counter-argument above (that vagueness is semantic), you are committed to the view that **ontology is language-dependent.** You are saying that whether a "wall" exists depends partly on how we choose to define the word "wall."

  Lewis finds this unacceptable because he believes metaphysics should be about what exists *independently* of us. He argues: "Surely, whether there is a table here shouldn't depend on whether we decided to sharpen our definition of 'table'!"

  If you reject Lewis's inference, you are effectively saying: "Yes, it does depend on that. The world provides the stuff; we provide the 'things'."

  **The Verdict:**
  The "sleight of hand" you sensed is real. Lewis conflates **indeterminacy of truth** (we can't say if the sentence "this is a wall" is true) with **indeterminacy of being** (the wall itself is fuzzy).

  1.  **Lewis is right that:** If existence is a fundamental, language-independent feature of reality, then it cannot be vague.
  2.  **The Restricted Compositionist is right that:** Existence claims *are* language-dependent.

  Therefore, the inference from "composition is vague" to "existence is vague (in an impossible way)" **fails**, provided you accept that our ontological categories (like "object," "table," "wall") are human constructs imposed on a precise physical reality.

  If you believe that "object" is a natural kind discovered in the world (like "electron" or "gold"), then Lewis wins, and vague composition is impossible. But if you believe "object" is a functional or conceptual category (like "bald" or "heap"), then Lewis loses, and your intuition is correct: the world can be precise while the number of "objects" remains vague without contradiction.

  Most contemporary metaphysicians who reject universalism accept this cost: they admit that the *count* of ordinary objects is vague, but they deny that this implies anything fuzzy about the fundamental structure of reality. They bite the bullet on vague counting to save the intuition that tables aren't the same kind of thing as "shoe-moon aggregates."

  So, trust your gut. The move from "vague composition" to "absurd vague existence" relies on the assumption that our concept of "object" maps perfectly onto mind-independent joints in nature. If you reject that assumption, the argument collapses.
