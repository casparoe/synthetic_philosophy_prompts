      *   **Prioritarianism/Thresholds:** There's a threshold of resources needed for a *flourishing* life, not just a *barely worth living* life.
      *   **Obligations to Existing Children:** Parents have specific duties to current kids that outweigh the potential benefit of creating new ones.
