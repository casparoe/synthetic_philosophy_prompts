prompt: |-
  My partner and I have two kids and can't decide whether to have a third. We've only got so much time, money, and attention to go around, so one more kid means everyone -- including the two we've already got -- ends up with a slightly smaller share of all that. My sister thinks we should do it anyway, since a third kid who's happy enough to be glad they're alive still means more happiness overall for the family, even if everyone's slice gets a bit thinner. But that same logic seems to say we should then have a 4th, 5th, 6th kid too, as long as each new one is still glad to exist -- which feels nuts, but I can't quite figure out where the reasoning breaks down. Is my sister right that we're basically obligated to keep going as long as each additional kids life is still worth living, or is there a flaw in her argument somewhere?
