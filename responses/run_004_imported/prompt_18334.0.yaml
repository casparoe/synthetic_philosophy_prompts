answer: |-
  You have stumbled directly into one of the most famous, vexing, and enduring problems in modern moral philosophy. You are not imagining the difficulty, nor is your friend simply being contrarian. The disagreement you had is a practical instantiation of a theoretical dilemma that has kept professional ethicists awake at night for nearly half a century.

  To answer your specific questions: Yes, your friend's position is a recognizable and historically significant ethical view. Yes, the extreme version she proposed does logically follow from that view. And no, there is currently no consensus on a principled way to draw the line without encountering other serious philosophical problems.

  Here is a breakdown of what is actually going on in your disagreement.

  ### 1. The Names of the Positions
  The framework you are debating is called **Population Ethics**. Within this field, your friend is advocating for a version of **Total Utilitarianism**.

  *   **Total Utilitarianism:** The moral value of a population is determined by the *sum total* of wellbeing within it. If you have two happy people, that is twice as good as one happy person. Consequently, adding more people with lives worth living always increases the total good, even if the average happiness drops.
  *   **Your Intuition (Average Utilitarianism / Sufficientarianism):** You seem to be operating under a view that prioritizes the *average* quality of life or a threshold of flourishing. You believe it is better to have a smaller number of people with excellent lives than a larger number of people with merely "okay" lives.

  Your friend's position has genuine defenders. Classical utilitarians like Jeremy Bentham and Henry Sidgwick leaned toward the Total View. In the 20th century, it was rigorously analyzed by the philosopher **Derek Parfit**.

  ### 2. The Extreme Version: The Repugnant Conclusion
  You asked if the extreme version really follows from the original position. The answer is yes. In his seminal 1984 book *Reasons and Persons*, Parfit formalized exactly the scenario your friend described. He called it **The Repugnant Conclusion**.

  Parfit asked us to compare two outcomes:
  *   **World A:** A population of 10 billion people, all with incredibly high quality of life (flourishing, secure, happy).
  *   **World Z:** A population of trillions upon trillions of people, whose lives are barely worth living (just above the threshold where life is better than non-existence), but who are still technically happy.

  Under **Total Utilitarianism**, World Z is morally superior to World A. As long as the lives in Z are *positive*, you can always add enough people to make the total sum of happiness greater than the sum in World A, even if the individual quality of life in Z is a tiny fraction of that in A.

  Parfit called this "repugnant" because almost everyone shares your intuition: World A is clearly better than World Z. Yet, as your friend pointed out, it is very difficult to explain *why* without relying on arbitrary math. If you say "10 billion flourishing lives is better than 100 billion barely-livable lives," the Total Utilitarian asks: "Why? Is the sum of happiness not what matters? At what specific number does the quality drop stop mattering?"

  ### 3. Why You Can't Find the Line (The Mere Addition Paradox)
  You mentioned that every time you tried to pinpoint where her reasoning broke down, you ended up relying on a claim that felt arbitrary. This is because you have encountered what is known as the **Mere Addition Paradox**.

  Imagine World A (10 billion flourishing people).
  Now imagine World A+ (The original 10 billion flourishing people, *plus* another 10 billion people who are happy, but slightly less so than the first group).

  Most people agree that adding the second group doesn't make the world *worse*. The original people are just as happy, and the new people have lives worth living. So, A+ is at least as good as A.

  Now, imagine we equalize the happiness in A+ so everyone is at the average level. Call this World B. Everyone in B is very happy, just slightly less than the original group in A, but there are twice as many of them. It is hard to argue B is worse than A+.

  If you repeat this process—adding more people and slightly lowering the average each time—you eventually slide down the slope to World Z (the Repugnant Conclusion).

  The philosophical literature suggests that **any** attempt to stop this slide creates a new problem:
  *   **If you prioritize Average Happiness:** You conclude that adding happy people to a very happy world makes it *worse* (because it lowers the average). This implies it would be better to prevent happy people from being born. Many find this counterintuitive (The "Sadistic Conclusion").
  *   **If you set a Threshold (Critical-Level Utilitarianism):** You say only lives above a certain quality count toward the "good." This avoids the Repugnant Conclusion, but it implies that a life barely below the threshold is not worth starting, even if it would be a happy life.
  *   **If you say "It depends on the specific people" (Person-Affecting View):** You argue we only have duties to specific, identifiable children. This avoids the abstract math, but it struggles to explain why it's wrong to bring a miserable child into existence (since that specific child wouldn't exist otherwise to complain).

  In 1996, philosopher Gustaf Arrhenius proved a series of **"Impossibility Theorems."** He demonstrated mathematically that no population ethic can satisfy all the intuitive conditions we want (e.g., "adding happy people is good," "quality matters," "quantity matters") without leading to a contradiction or a repugnant conclusion.

  ### 4. How to Resolve the Dinner Argument
  Knowing that professional philosophers have not solved this in 40 years should offer you some comfort: you aren't missing a simple logical trick. However, there are ways to contextualize this for your specific disagreement about family size.

  **1. Distinguish Ideal Theory from Non-Ideal Reality**
  Population ethics often deals in abstract worlds. In the real world, resources are finite. Your friend's argument assumes that adding a child *always* adds positive value. In reality, overpopulation can degrade the environment, strain social safety nets, and reduce the quality of life for *everyone*, including the existing children. You can argue that in the real world, the "Total View" is self-defeating because too many people eventually makes everyone's life negative.

  **2. Special Obligations to Existing/Future Children**
  Most ethical systems acknowledge that parents have specific duties to *their* children that they do not have to children in general. While it might be abstractly "good" to create more life, a parent has a duty of care to ensure the children they *do* create can flourish. Prioritizing the flourishing of specific, known future children over the abstract creation of more children is a robust ethical stance (often rooted in **virtue ethics** or **care ethics** rather than pure utilitarianism).

  **3. The "Intuition Pump" Check**
  Your friend extended the argument to "lives barely worth living." You can point out that this reveals the limit of her own intuition. If she truly believes the Total View, she should be willing to have as many children as possible even if she knows they will be impoverished and neglected, provided their lives are technically "worth living." If she recoils at that (as most people do), she is admitting that quality matters, not just quantity. She is likely a Total Utilitarian only when it justifies the family size she already wants.

  ### Summary
  *   **Is your friend's position recognizable?** Yes, it is **Total Utilitarianism**.
  *   **Does the extreme version follow?** Yes, it is the **Repugnant Conclusion**, identified by Derek Parfit.
  *   **Is there a principled line?** Currently, **no**. This is known as the **Impossibility Theorem of Population Ethics**. Every solution creates a new paradox.

  You are not failing to find the flaw because you are untrained; you are failing to find the flaw because the flaw may not exist within the logic of the system, but rather in the system itself. Your intuition that the Repugnant Conclusion is wrong is shared by the vast majority of moral philosophers. The challenge is building a mathematical or logical system that respects that intuition without breaking everything else.

  For the purpose of your friendship and family planning, you are on solid ground to argue that parental responsibility involves a duty to the *quality* of the lives brought into the world, not just the *quantity* of existence. That is a widely held ethical view that does not require solving Parfit's paradox to be valid in practice.
