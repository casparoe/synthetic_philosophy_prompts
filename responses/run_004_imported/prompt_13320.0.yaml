              *   *Bite the Bullet:* Accept SIA. Then cosmology *can* use observer counts. But then we accept we can rule out theories a priori because they predict too few observers.
              *   *Independence:* Deny that theories are independent of observer existence.
      *   *Key Distinction:* SSA blocks the inference from "more observers" to "more likely true." SIA licenses it.

