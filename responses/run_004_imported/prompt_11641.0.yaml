      *   **Kingdom of Ends:** Only rational beings are "ends in themselves." Animals are "things" (means to ends).
      *   **Indirect Duties:** We have duties *regarding* animals, but not *to* them. Cruelty to animals is wrong because it dulls our sympathy (*Teilnehmung*), making us more likely to be cruel to humans.
