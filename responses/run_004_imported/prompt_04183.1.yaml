answer: |-
  You have dug up a genuinely fascinating and historically accurate piece of context. You aren't missing the basic facts: John von Neumann did argue exactly that in his 1955 *Fortune* essay "Can We Survive Technology?", and Stanisław Ulam later explicitly attributed the term "singularity" to the accelerating progress von Neumann described.

  However, whether this should "update us hard" toward modern AI risk scenarios (like Yudkowsky's FOOM or Kurzweil's Law of Accelerating Returns) requires untangling *what* von Neumann was predicting versus *what* modern singularitarians are predicting.

  Here is the breakdown of why this is a strong data point for the **meta-thesis** of disruption, but a weaker data point for the **specific mechanisms** of AI risk.

  ### 1. The Historical Record: You Are Right
  The genealogy of the idea generally goes like this:
  *   **1955:** Von Neumann publishes "Can We Survive Technology?" arguing that technological progress is accelerating while human social adaptation is not. He suggests we are approaching a "singularity" in human affairs where current rules no longer apply.
  *   **1958:** Mathematician Stanisław Ulam, writing a tribute to von Neumann, coins the specific usage: *"One conversation centered on the ever-accelerating progress of technology and changes in the mode of human life, which gives the appearance of approaching some essential singularity in the history of the race beyond which human affairs, as we know them, could not continue."*
  *   **1980s/90s:** Vernor Vinge popularizes the term, explicitly linking it to the creation of greater-than-human intelligence.
  *   **2000s:** Ray Kurzweil mainstreams it via *The Singularity Is Near*.

  So, you are correct that the core structural argument—that exponential tech growth leads to a predictive horizon failure—originates with von Neumann.

  ### 2. The Mechanism Mismatch
  This is where the "update" needs to be nuanced. Von Neumann and modern AI risk theorists are diagnosing the same **symptom** (a breakdown in continuity) but proposing different **pathogens**.

  **Von Neumann's Singularity (Sociological/Geopolitical):**
  Von Neumann was looking at the Atomic Age. His concern was that nuclear weapons and automation were evolving faster than human political institutions could manage.
  *   **The Risk:** Societal collapse, nuclear war, or mass unemployment due to automation outpacing economic adaptation.
  *   **The Driver:** The gap between *technical capability* and *social wisdom*.
  *   **The Outcome:** A rupture in history, but not necessarily the emergence of a superintelligence.

  **Yudkowsky/Kurzweil Singularity (Cognitive/Computational):**
  Modern AI risk focuses on the content of the technology itself becoming an agent.
  *   **The Risk:** Recursive self-improvement leads to an intelligence explosion (FOOM), resulting in loss of control.
  *   **The Driver:** The gap between *human intelligence* and *machine intelligence*.
  *   **The Outcome:** A new dominant cognitive force.

  **Why this matters for your "update":**
  Von Neumann's intuition validates the idea that **exponential curves break linear models.** It tells us that assuming "the future will be like the past" is dangerous. That is a massive update for anyone who thinks technological progress is always gradual.

  However, it does not necessarily validate the claim that **AGI is the specific vector.** Von Neumann saw the bomb as the primary existential threat; automation was secondary. If anything, his view might update us toward "multipolar traps" and geopolitical instability caused by tech, rather than a single unaligned agent.

  ### 3. The "Smart Person" Heuristic
  You mention that von Neumann was "arguably the smartest man of the 20th century." Does his agreement act as a strong prior?

  **Yes, because:**
  Von Neumann was a pioneer in game theory, cellular automata, and computer architecture. He understood systems, feedback loops, and computation better than almost anyone in history. If *he* looked at the trajectory of technology and said, "This leads to a discontinuity," it lends immense credibility to the **non-linearity of history.** It removes the stigma that the Singularity is just "science fiction."

  **No, because:**
  Genius is not infallibility. Von Neumann was also deeply involved in the doctrine of Mutually Assured Destruction (MAD), which many argue increased existential risk. He also believed weather control and other mid-century techno-fixes were more imminent than they turned out to be. His agreement validates the *class* of problem (accelerationism), but not necessarily the specific *solution space* (AI alignment).

  ### 4. Is it Underrated in AI Risk Discussions?
  It is well-known among historians of the idea (like James Burke or those who study the history of futurism), but you are right that it is often under-cited in *technical* AI safety circles.

  Most AI safety discussions focus on the **mechanistic plausibility** of an intelligence explosion (e.g., "Can a system rewrite its own code to get smarter?"). They rely on computational theory rather than historical analogy.

  However, for the **sociological** side of AI risk (governance, deployment races, geopolitical instability), von Neumann's 1955 essay is actually more relevant than Yudkowsky's essays. It highlights that even without a "superintelligence," the *pace* of change alone might break our institutions.

  ### The Verdict
  You have found a strong data point for **Technological Accelerationism**, but a moderate data point for **AI-Specific Singularity.**

  *   **Update on:** The likelihood that technological progress is non-linear and that "business as usual" cannot be assumed indefinitely. (Strong Update)
  *   **Update on:** The likelihood that AGI specifically will cause a hard takeoff scenario. (Weak Update)
  *   **Update on:** The likelihood that advanced technology poses an existential threat due to the lag between capability and wisdom. (Strong Update)

  Von Neumann essentially argued that **we are the bottleneck.** Modern AI risk argues that **we might build the thing that replaces us as the bottleneck.** Both lead to the same conclusion: the future is not a smooth extrapolation of the past. Recognizing that von Neumann saw this in 1955, without even having modern deep learning, should definitely increase our credence that "something big is coming," even if we debate exactly what "something" is.
