              *   New frontier: Bulges out for Alex. Say, passes through (0.6, 0.5) and (0.5, 0.6).
              *   Actually, the easiest way to explain Monotonicity failure is: "Expanding the set in your favor shouldn't hurt you." Nash can violate this if the expansion changes the curvature such that the tangent point shifts disproportionately.
      *   *IIA (Nash's strength, KS's weakness):*
