answer: |-
  **SCENE:** *A glass-walled conference room at a startup incubator. A whiteboard is covered in utility frontiers and indifference curves. ALEX and JORDAN, the co-founders of "Nimbus Logistics," sit at the table looking exhausted. Standing at the board are DR. ARIS THORNE (wearing a sharp suit, holding a dry-erase marker like a dagger) and DR. ELENA KALAI (in a rumpled blazer, leaning against the desk).*

  **THORNE:** (Tapping the board) Let's be clear. You have a surplus to divide. You have a disagreement point—what happens if you walk away, which is zero for both of you. And you have a feasible set of profit-sharing agreements. The question is not "what do you feel like?" The question is "what is the consistent rational choice?"

  **JORDAN:** We feel like we've been arguing for three weeks. We just want a split that doesn't make us hate each other.

  **KALAI:** And that is precisely why you shouldn't listen to Aris. He wants to sell you a mathematical consistency that ignores the reality of your leverage.

  **THORNE:** I am selling stability, Elena. I am advocating for the Nash Bargaining Solution. It satisfies four axioms that any rational agreement should meet. Pareto efficiency, symmetry, scale invariance, and—most critically—Independence of Irrelevant Alternatives (IIA).

  **KALAI:** (Laughs softly) "Irrelevant." That's the word we're fighting over. I'm advocating for the Kalai-Smorodinsky solution. We agree on efficiency, symmetry, and scale. But we drop IIA. In exchange, we get Individual Monotonicity.

  **ALEX:** Okay, stop. High school econ was a long time ago. In English, please. Why does your axiom matter more than his?

  **KALAI:** Gladly. Aris's solution maximizes the *product* of your gains. Mine equalizes the *ratio* of your gain to your maximum possible gain. Here is why Aris's method is dangerous for you, Alex.

  *Kalai wipes a section of the board clean and draws a triangle.*

  **KALAI:** Imagine the current situation. The feasible set is this triangle. Your maximum possible profit, Alex, is \$1 million. Jordan, yours is also \$1 million. The Nash solution and my solution both recommend a 50/50 split. \$500k each.

  **THORNE:** Because the set is symmetric. Obviously.

  **KALAI:** Now, suppose Alex discovers a new distribution channel. It's risky, but it means Alex *could* theoretically capture \$2 million if Jordan got nothing. Jordan's maximum stays at \$1 million. The feasible set expands in Alex's favor.

  *Kalai extends the triangle on Alex's axis.*

  **KALAI:** Under Kalai-Smorodinsky, your ideal point moves to (\$2m, \$1m). The solution lies on the line connecting the disagreement point to that ideal point. You get a larger share of the surplus because your potential contribution to the venture has increased. You are rewarded for bringing more to the table.

  **THORNE:** (Interjecting) And under Nash, the solution moves to the point where the hyperbola is tangent to the new frontier.

  **KALAI:** Exactly. But here is the violation. Depending on the curvature of that new frontier, the Nash solution can recommend that Alex receives *less* than \$500k, or at best, a significantly smaller proportion of the total surplus than before.

  **ALEX:** Wait. If I bring in a new channel that doubles my potential value, your solution says I might make *less* money than before?

  **THORNE:** Not less absolute money, necessarily, but—

  **KALAI:** In some configurations, yes, less absolute utility. But certainly, a violation of monotonicity. The axiom says: If the set of possibilities expands in your favor, and no one else's potential changes, you should not be worse off. Nash violates this. It punishes you for changing the shape of the pie, even if you made the pie bigger for yourself. It treats your increased leverage as a geometric nuisance rather than a claim to fairness.

  **THORNE:** (Steps forward, uncapping the marker) That is a distortion. Nash doesn't punish leverage; it punishes *instability*. Elena's example relies on the frontier curving in a very specific, convenient way. Let me show you why her solution is actually the dangerous one for a business contract.

  *Thorne draws a new triangle.*

  **THORNE:** Imagine you agree on a deal today. Let's say the feasible set allows for a maximum of \$10 million for Alex and \$10 million for Jordan. The KS solution splits it 50/50. \$5 million each.

  **JORDAN:** Okay, that sounds fair.

  **THORNE:** Now, suppose there is an option on the table—a "phantom option." Let's say, a liquidation clause where Jordan could theoretically walk away with \$10 million and leave Alex with nothing. It's in the contract draft, but nobody seriously intends to use it. It's an extreme point of the feasible set.

  **KALAI:** It defines the ideal point, Aris. You know that.

  **THORNE:** Precisely. Now, imagine your lawyers tell you that clause is unenforceable. It has to be removed. It is an "irrelevant alternative" because you weren't going to pick it anyway; you were settling at \$5 million each.

  *Thorne erases the top corner of the triangle, lowering Jordan's maximum potential to \$8 million.*

  **THORNE:** Under Nash, the solution *does not change*. The tangent point is still at \$5 million each. Why? Because the options you actually care about haven't changed. The removal of a deal you never would have signed shouldn't alter the deal you *did* sign. That is IIA.

  **JORDAN:** That sounds... stable.

  **THORNE:** It is stability. But look at Elena's solution. Because Jordan's *maximum possible* utility dropped from \$10 million to \$8 million, the "ideal point" shifts. The line from the origin tilts. Suddenly, the Kalai-Smorodinsky solution recommends Jordan get *less* than \$5 million. Maybe \$4.5 million.

  **ALEX:** So, because we removed a clause Jordan wasn't going to use... Jordan loses money on the deal we *are* making?

  **THORNE:** Correct. By removing an option that was never going to be chosen, Elena's formula penalizes Jordan. It makes the agreement dependent on phantom possibilities. In a legal contract, that is a nightmare. It means your profit share depends on options you explicitly rejected.

  **KALAI:** (Pushes off the desk) That is a caricature of fairness, Aris. You're prioritizing the geometry of the choice set over the relationship of the parties.

  **THORNE:** I'm prioritizing the integrity of the decision. If removing a useless option changes the outcome, the solution is sensitive to noise.

  **KALAI:** It's not noise! The ideal point represents *aspiration*. It represents the best-case scenario for each partner. If Jordan's best-case scenario drops—perhaps because the market for their specific role shrinks—then yes, their proportional claim on the surplus should adjust. But look at the reverse of your argument.

  *Kalai points back to her earlier drawing.*

  **KALAI:** You defended IIA by saying removing a bad option shouldn't hurt anyone. But consider this: What if I *add* an option? Suppose Alex finds a way to guarantee himself a higher minimum, or a higher maximum, without hurting Jordan's maximum. Under Nash, adding this option can shift the solution *against* Alex.

  **THORNE:** Only if the curvature changes—

  **KALAI:** (Interrupting) But the curvature *is* the reality of the business! You treat the feasible set as a static menu. I treat it as a measure of bargaining power. If Alex's potential goes up, his bargaining power goes up. Nash allows a situation where Alex says, "I found a way to double our total potential revenue," and Nash replies, "Great, but mathematically, you now get a smaller slice." That discourages innovation. It discourages partners from expanding the feasible set.

  **JORDAN:** She has a point. If I know that improving my outside option might lower my settlement under your model, Aris, I'm not going to tell you about it. I'm going to hide my leverage.

  **THORNE:** And that is why you need IIA! If you hide leverage, you are manipulating the feasible set. Nash forces the solution to depend only on the local properties of the agreement point, not the distant extremes. It prevents "anchor manipulation."

  **KALAI:** It prevents "aspiration recognition."

  **THORNE:** It prevents the solution from jumping around because someone dreamed up a crazy, unlikely scenario at the edge of the graph!

  **KALAI:** It prevents the solution from acknowledging that the *range* of possibility defines the fairness of the split!

  *Silence hangs in the room. Alex and Jordan look between the two.*

  **ALEX:** So... Aris says Elena's method lets phantom options change our pay. Elena says Aris's method punishes us for improving our potential.

  **THORNE:** (Sighs, capping the marker) Essentially, yes. It comes down to what you value more. Do you want a solution that is immune to the addition or removal of unchosen alternatives? That is procedural consistency. That is Nash.

  **KALAI:** Or do you want a solution that guarantees if your potential improves, your outcome does not worsen? That is substantive fairness. That is Kalai-Smorodinsky.

  **JORDAN:** Is there... a middle ground?

  **THORNE:** (Smirks) In axiomatics? There is no middle ground. You either satisfy IIA or you satisfy Monotonicity. You cannot have both. That was proved decades ago.

  **KALAI:** (Smiles back) Though, there are other solutions. The Egalitarian solution, for one. But that violates scale invariance.

  **THORNE:** Which is unacceptable for currency comparisons.

  **KALAI:** Is it?

  **THORNE:** (Turns to the founders) Look. If your contract is going to be litigated, use Nash. Courts love IIA. It says, "We looked at the options on the table, we picked this one, and the fact that there was a crazier option we didn't pick doesn't matter."

  **KALAI:** And if you want to stay partners for ten years, use Kalai-Smorodinsky. Because when Alex inevitably finds a way to make the company worth more, he won't feel cheated by the math. He'll feel rewarded for expanding the horizon.

  **ALEX:** (Looks at Jordan) We're planning to stay partners for ten years.

  **JORDAN:** (Looks at Alex) And we're definitely going to find ways to make the company worth more.

  **THORNE:** (Shouldering his bag) Then you've already made your choice. You just wanted us to tell you it was safe.

  **KALAI:** (Gathering her papers) It's not safe. It's just fair.

  **THORNE:** (At the door) Fairness is volatile, Elena.

  **KALAI:** And consistency is cold, Aris.

  *The theorists exit. Alex and Jordan look at the whiteboard, at the intersecting lines and curves.*

  **ALEX:** So, if I find that new distribution channel...

  **JORDAN:** ...we redraw the frontier. And we split the gain proportional to the new ideal point.

  **ALEX:** And if we delete that liquidation clause from the draft?

  **JORDAN:** Then we ignore it. Because it wasn't real value anyway.

  **ALEX:** (Picks up the eraser) Let's wipe the board.

  **JORDAN:** Why?

  **ALEX:** Because the set just changed. We decided to trust each other. That expands the feasible set more than any math can model.

  *Jordan smiles. Alex erases the axioms, leaving only the disagreement point at the origin.*

  **[END SCENE]**
