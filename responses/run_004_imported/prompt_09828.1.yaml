      *   *Elias (The Defense):* "The metaphysics of time isn't just a preference." If B-theory is true, change is illusory. That's a bigger bullet to bite than PSR nuances. Regarding infinites: Concrete instantiation is different from abstract sets.
      *   *Closing:* Acknowledging the stalemate.

  6.  **Polishing:**
