          *   *KD's Attack:* The Principle of Sufficient Reason (PSR) strong enough to ground a Necessary Being leads to Modal Collapse (if God's choice is fully explained, the world becomes necessary).
          *   *CD's Attack:* Kalam relies on contestable metaphysics (actual infinites & traversal of time), whereas Contingency can remain agnostic about the past's finitude.
      *   **Constraint:** Neither concedes more than dialectically forced; they must engage specific points, not just re-run standard cases.
      *   **Tone:** Philosophical dialogue, rigorous but accessible, respectful but critical.

  2.  **Character Conception:**
