          *   Ramsey might argue that focusing on the "heat death" scale distracts from the "foreground" goods (love, thought) that make the future worth saving in the first place.
          *   *Key Insight:* Ramsey might say Longtermism gets the *ethics* right (don't discount time) but the *metaphysics* wrong (obsessing over scale rather than quality of mind).

      *   **Point 4: Pragmatism and Action.**
          *   Ramsey was a pragmatist. Beliefs are rules for action.
