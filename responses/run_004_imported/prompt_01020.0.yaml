answer: |-
  This is a fantastic observation. You have put your finger on the exact tension that makes Ramsey such a fascinating figure: the split between the **humanist pragmatist** (the Apostle giving the "Epilogue") and the **rigorous utilitarian technician** (the economist writing "A Mathematical Theory of Saving").

  If you sat Frank Ramsey down with Will MacAskill or Toby Ord today, I don't think you would get a simple "yes" or "no." Instead, you would likely get a rigorous dismantling of their metaphysics, followed by a partial endorsement of their ethics, and finally a rejection of their methodology.

  Here is a worked-through analysis of how Ramsey would likely engage with Longtermism, broken down by the three distinct "hats" he wore: the Ethicist, the Probabilist, and the Humanist.

  ### 1. The Ethicist: Agreement on Time, Disagreement on Scale
  **The Alignment:**
  On the specific question of **pure time discounting**, Ramsey is effectively the patron saint of Longtermism. In his 1928 savings paper, his rejection of discounting future welfare ("ethically indefensible... weakness of the imagination") is the mathematical backbone of the Longtermist argument. Longtermism relies on the premise that a life in the 22nd century counts exactly as much as a life in the 21st. Ramsey would agree completely. He would endorse the idea that we have a strong ethical obligation to ensure the continuation of civilization.

  **The Clash:**
  However, Longtermism derives its *urgency* not just from the equality of future lives, but from their **sheer number** (the "scale" argument). The logic is: $Value = Probability \times Number of Lives$. Since the number of potential future lives is astronomical ($10^{50}$ or more), even tiny probabilities of extinction dominate current moral calculus.

  This is where the Ramsey of the "Epilogue" would revolt. In that essay, Ramsey argues that value is not a function of physical magnitude.
  > *"My picture of the world is drawn in perspective, and not like a model to scale; the foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  To a Longtermist, the "size" of the future (in terms of person-years) creates the moral weight. To Ramsey, moral weight comes from the **quality of conscious experience** (love, knowledge, beauty—his Moorean "goods").

  Ramsey would likely argue that Longtermism makes a category error by treating human welfare like a physical substance that accumulates over time. He would say: *"You are trying to draw the future to scale, like a map of the stars. But ethics must be drawn in perspective."* The fact that there *could* be $10^{50}$ people doesn't automatically make their potential existence more valuable than the actual existence of the people suffering in the foreground right now. He would suspect that focusing on the "astronomical" numbers is a way of avoiding the difficult, tangible ethical work in the human foreground.

  ### 2. The Probabilist: The "Truth and Probability" Objection
  This is perhaps the strongest argument Ramsey would have against modern Longtermism. In 1926, Ramsey wrote *"Truth and Probability,"* essentially founding the theory of **subjective probability** (Bayesianism). He defined belief in terms of betting odds: your degree of belief is the price at which you would buy or sell a bet on a proposition.

  Longtermism often relies on **Expected Value (EV) calculations under extreme uncertainty**. For example: *"There is a 0.1% chance AI kills everyone, so we should spend billions to reduce that risk."*

  Ramsey would be deeply skeptical of this. In his framework, for a probability to be meaningful, it must be grounded in a system of coherent bets. He would ask the Longtermist: *"What is the specific proposition you are betting on? What evidence constrains your probability estimate?"*

  When dealing with existential risks from technologies that don't fully exist yet (like AGI), Ramsey would argue that we cannot form coherent subjective probabilities. We are not in a position to make a "bet." To assign a number like 0.1% to AI extinction is, in Ramsey's view, pseudo-mathematics. It pretends to a precision that human epistemology cannot support.

  He would likely view Longtermism's reliance on these vast EV calculations as a form of **moral Pascal's Wager**. Ramsey was a pragmatist; he believed beliefs are rules for action. If the "bet" is so abstract that you can't verify the odds or the payoff (because the payoff is 10,000 years away), it ceases to be a rational basis for action. He would argue that we should focus on risks where the probabilities are more knowable and the feedback loops are shorter.

  ### 3. The Humanist: The "Perspective" Defense
  Finally, we have to look at Ramsey's view of what makes life worth living. In the "Epilogue," he writes:
  > *"The stars may be large, but they cannot think or love."*

  For Ramsey, value is strictly anthropocentric (or rather, mind-centric). The universe has no value without minds to perceive it. Longtermism shares this, but it risks inverting the relationship. In Longtermism, the *potential* for minds can sometimes overshadow the *actual* minds.

  Ramsey would likely argue that Longtermism, in its obsession with preventing the "heat death" of value, risks neglecting the "foreground" value. If you sacrifice the welfare of the current generation (the foreground) to secure the existence of a future generation (the background), you might be violating the very perspective that gives value meaning.

  He wouldn't say we should *ignore* the future. But he would argue that the best way to secure a valuable future is not by treating it as a giant number to be maximized, but by cultivating the **human goods** (knowledge, friendship, beauty) that make the future worth having in the first place. If we save humanity but create a sterile, joyless existence just to keep the "count" of lives high, we have failed Ramsey's test.

  ### The Verdict: Would he sign up?
  **No, but with a major caveat.**

  Ramsey would not be a card-carrying Longtermist. He would reject the **astronomical waste argument** (the idea that the sheer number of future lives dominates current ethics) as a violation of "perspective." He would reject the **probability calculations** regarding existential risk as epistemologically unsound (violating his theory of subjective probability).

  However, he would agree with the **core ethical impulse**: that we have a duty to the future that is not discounted by time.

  If you pressed him, I suspect Ramsey would advocate for what we might call **"Robust Humanism."** He would argue:
  1.  **Don't discount the future ethically:** Future people count equally.
  2.  **Don't obsess over the scale:** The value of the future isn't in its size, but in its potential for love and thought.
  3.  **Don't gamble on speculative probabilities:** Focus on robust institutions and improving current human welfare, which is the best proven way to ensure a future capable of valuing itself.

  He would tell MacAskill and Ord: *"You are right that the stars don't matter, only minds do. But you are wrong to count minds like stars. Draw your ethics in perspective. Worry about the people in the foreground, and ensure they are the kind of people who can love the people in the background. Do not sacrifice the foreground for a calculation you cannot make."*

  In short: He would share their **anxiety** about the future, but he would reject their **mathematics** of salvation. He'd likely see Longtermism as a brilliant but ultimately misguided attempt to solve a human problem with a cosmic calculator.
