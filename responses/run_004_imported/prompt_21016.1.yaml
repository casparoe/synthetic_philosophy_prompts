      *   **Tone:** Intellectual, slightly tense but productive, grounded in the specific philosophical arguments (not just pop-sci).

  2.  **Character Conception:**
      *   **Alex (Realist):** The CS PhD student (based on the user). Feels the weight of experience. Frustrated by the dismissal of the "what it's like."
