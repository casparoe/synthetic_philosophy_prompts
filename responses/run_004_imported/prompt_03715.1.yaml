      *   *Addressing the Ethical Point:* The fiancé's "ugly" comment. Economists view liquidity provision as a service (reducing transaction costs), even if it profits from others' needs. It's not necessarily predatory, though it can be. I need to be balanced here.

  5.  **Final Review against Constraints:**
