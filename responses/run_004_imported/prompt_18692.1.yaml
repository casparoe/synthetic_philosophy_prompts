      *   **The Core Question:** Why promise if nothing changes? Is a promise about surprise/uncertainty, or is the public declaration itself the binding agent?
      *   **Goal:** Write the speech segment right before the vows (approx. 4 minutes spoken).
      *   **Tone:** Honest, not cheesy, acknowledges the reality (8 years together), answers the philosophical question, accessible to guests (not just the lawyer), commits to a real answer.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Premise:* They already act married.
      *   *Counter-premise:* Marriage is a public contract, not just a private arrangement.
      *   *The "Contracts Lawyer" Angle:* Acknowledge the legalistic view but transcend it. A contract protects against breach; a vow creates a shared identity.
      *   *The "Nothing Changes" Angle:* Practically, no. Existentially/Socially, yes. It shifts from "I choose you today" to "I choose you forever, publicly."
      *   *The "Promise" Angle:* It's not about surprise (keeping them on their toes); it's about certainty (removing the option to quit easily).

  3.  **Drafting - Section by Section:**

      *   **Opening (The Elephant in the Room):** Acknowledge the 8 years. Validate their joke about taxes/paperwork. Don't fight the reality.
      *   **The Lawyer Hook:** Address the groom's profession lightly. Contracts are about what happens when things go wrong. Marriage is about what happens when things go right (and keeping them that way).
      *   **The Core Argument (Why Vows?):**
          *   Option A: Promises are for uncertainty. (Reject this).
          *   Option B: Promises are for *certainty*. (Accept this).
          *   The shift isn't in the logistics (lease, dog); it's in the *audience*.
      *   **The "Public" Aspect:** It's about the community witnessing. It makes it harder to walk away. It transforms a private habit into a public identity.
      *   **The Transition to Vows:** Bring it back to the moment. Ask them to speak not to change their routine, but to lock in their intent.

  4.  **Timing and Pacing:**
      *   Average speaking pace is ~130-150 words per minute.
      *   4 minutes = ~520-600 words.
      *   Need to ensure pauses for laughter and gravity.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hey everyone. You know these two. 8 years. They say this is just for taxes. [Groom] is a lawyer, he loves paperwork. But why vows? If you know you'll be together, why say it? Because a promise isn't about surprise. It's about making it real for us, the guests. It changes the stakes. So now, say the vows.

      *Critique 1:* Too dry. Needs more heart. Needs to address the "why bother promising" question more deeply.

  6.  **Drafting - Iteration 2 (Adding Depth & Voice):**
