answer: |-
  *(Stand comfortably at the podium. Hold the papers loosely. Look at the couple, then at the guests. Smile, acknowledging the familiarity in the room.)*

  So. We've reached the part of the ceremony where I'm supposed to tell you that everything changes today. That come Monday morning, when the coffee brews and the dog needs walking, you'll be looking at each other with brand new eyes.

  But we all know that's not true.

  You've been together eight years. You share a lease, a bank account, and a dog who doesn't care what your marital status is. As [Groom]—the contracts lawyer in the room—has pointed out more than once, this is largely a paperwork exercise. There are tax benefits. There are hospital visitation rights. There is, legally speaking, a merger.

  And if we're being honest, that raises a question. If you already know how the other person takes their coffee, if you've already weathered the hard stuff without a license, why stand here and make promises?

  Usually, we think a promise is valuable because it protects against uncertainty. You promise to show up because there's a risk you might not. You promise to love because feelings can fade. A promise is a safety net for the unknown.

  But looking at you two, there isn't much unknown left. You aren't going to blindside each other. So, what is left to promise?

  I've been thinking about this a lot. And I think the answer isn't about uncertainty. It's about *witness*.

  For eight years, your commitment has been private. It was a series of choices made behind closed doors. No one else had a say. No one else had a stake. If things got hard, the only people you had to answer to were each other.

  But today, you are moving the contract from the private sector to the public sector.

  When you say these vows in front of us, you aren't just telling each other what you plan to do. You are telling *us* who you are. You are giving us permission to hold you accountable. You are saying, "This isn't just a habit we've fallen into; this is an identity we are choosing."

  [Groom], you know better than anyone that a signature changes the nature of an agreement. It stops being a handshake and starts being a structure.

  So, the promise you're about to make isn't about changing your behavior. You don't need to promise to be kinder, or more present, or more loving than you were last Tuesday. You're already doing that.

  The promise is that you will not treat this lightly. It is the act of saying "I do" out loud that creates the obligation, not the other way around. You are building a wall around your relationship, not to keep people out, but to keep the two of you in. You are removing the easy exit, even when the exit was already unlikely.

  So, when you speak your vows in a moment, don't say them to prove something new. Say them to make something official. Say them so that when you go home tonight, and the tux comes off and the dress is hung up, and you're just sitting on the couch with the dog, you know that the person sitting next to you isn't just your partner by convenience. They are your partner by choice. By public declaration. By law.

  That is the change. Not in the lease, but in the weight of the word.

  Let's hear those words.
