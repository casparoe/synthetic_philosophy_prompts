answer: |-
  This is a classic friction point in formal epistemology. The math of Good's Theorem is elegant (and you're right, it is essentially Jensen's inequality applied to the value function), but the algebra often obscures the *decision-theoretic mechanism* that makes it true.

  Here is the intuition behind why information has non-negative expected value, followed by a breakdown of why your three counterexamples feel compelling but actually violate specific assumptions of the theorem.

  ### The Intuition: Information as "Optionality"

  To understand Good's Theorem without Jensen's inequality, think of information not as "data," but as **the right to change your mind.**

  Imagine you are about to make a decision (e.g., Invest vs. Don't Invest). Based on your current prior beliefs, "Invest" has the highest expected utility. This is your **default plan**.

  Now, suppose you are offered a piece of free evidence before you commit.
  1.  **Scenario A:** The evidence comes back and confirms your prior. It suggests "Invest" is still the best move. Since you are a rational maximizer, you stick with your default plan. Your utility is exactly the same as if you hadn't looked.
  2.  **Scenario B:** The evidence comes back and contradicts your prior. It suggests "Don't Invest" is now the better move. Since you are a rational maximizer, you switch plans. Because you only switch when the new expected utility is *higher* than the old one, your utility in this branch is strictly better than your default plan.

  **The Kicker:** You are never *forced* to act on the information in a way that lowers your utility. You only update your action if the update improves your expected outcome.

  Therefore, looking at the evidence gives you a lottery ticket where one outcome leaves you where you started, and the other outcome makes you better off. The expected value of that lottery must be higher than (or equal to) staying where you started.

  **In short:** Information cannot hurt you because you retain the *option* to ignore it if it suggests a worse course of action, but you gain the *ability* to act on it if it suggests a better one.

  ---

  ### Analyzing the Counterexamples

  Your roommate and your own intuitions are spotting real phenomena, but they aren't counterexamples to Good's Theorem. They are counterexamples to the **background assumptions** required to apply the theorem. Good's Theorem assumes a very specific, sanitized model of decision-making. When real life violates those assumptions, the theorem no longer applies.

  Let's look at your three cases.

  #### 1. The Genetic Test (No Treatment)
  *The Case:* Your roommate's aunt refuses a test for a terminal disease with no cure. She gains no instrumental ability to act, only psychological distress.

  *   **The Violation:** **The Utility Function Assumption.**
      Good's Theorem assumes that your utility function depends only on the **State of the World** and your **Action**. It assumes $U(Action, State)$. It implicitly assumes that your *belief state* (what you know) does not enter the utility function directly.
  *   **What's Actually Happening:**
      In this case, the aunt's utility function is $U(Action, State, \text{Knowledge})$.
      For Good's Theorem to hold, information must be "free." Here, the information has a **psychological cost**. Even if the test is financially free, it is not *utility*-free.
      If we model "peace of mind" as a good, then acquiring the information consumes that good.
      *   *Instrumental Value:* 0 (She can't change the outcome).
      *   *Intrinsic Value:* Negative (Anxiety/Sadness).
      *   *Total Value:* Negative.
  *   **Verdict:** This isn't a failure of Good's Theorem; it's a failure to account for the **cost of information**. Good's Theorem proves that *instrumental* value is non-negative. It says nothing about cases where information has *intrinsic disvalue*. If you add the "pain of knowing" as a cost $C$, the theorem becomes: $E[\text{Value}] - C \geq 0$. If $C$ is high enough, you don't look.

  #### 2. The Ruined Surprise Party
  *The Case:* Finding out about the party beforehand ruins the joy of the party.

  *   **The Violation:** **State Independence.**
      Good's Theorem assumes the payoff of an outcome is fixed regardless of how you came to know about it. It assumes the utility of "Attending Party" is constant.
  *   **What's Actually Happening:**
      This is a specific version of the genetic test case. The utility of the event is **epistemically sensitive**.
      $U(\text{Party} \mid \text{Surprised}) > U(\text{Party} \mid \text{Known})$.
      By acquiring the information ("There is a party"), you are actively changing the payoff structure of the future state. You are turning a High-Utility State into a Low-Utility State simply by observing it.
  *   **Verdict:** Good's Theorem assumes the world is passive. In the surprise party case, the "value" of the world state is a function of your knowledge. The theorem requires that $U(State)$ is independent of $P(State)$. Here, they are entangled.

  #### 3. Poker and Negotiations
  *The Case:* Knowing the opponent's hand (or that you *could* know it) changes how they play, potentially making you worse off.

  *   **The Violation:** **Single-Agent Decision Theory.**
      This is the most important distinction. Good's Theorem is a result of **Decision Theory** (one agent vs. Nature). Nature does not care what you know. Nature does not strategize.
      Poker and negotiations are **Game Theory** (Agent vs. Agent).
  *   **What's Actually Happening:**
      In game theory, your information acquisition can be observable, or your updated strategy can be anticipated.
      *   *Example:* If I know you know my bluff, I won't bluff. If you know I won't bluff, you fold less.
      *   *Strategic Ignorance:* Sometimes, being unable to commit to a threat is advantageous. If you *know* you are rational, you might be forced to back down in a game of Chicken. If you are known to be "irrational" (or ignorant of the risks), the opponent yields.
      *   In these scenarios, information changes the **equilibrium** of the game, not just your expected utility against a fixed background.
  *   **Verdict:** Good's Theorem does not apply to multi-agent strategic interactions where other agents react to your information state. In Game Theory, information can absolutely have negative expected value (e.g., the "Value of Information" in game theory can be negative if it removes your ability to credibly commit to a bluff).

  ### Summary

  The intuition for Good's Theorem is **Optionality**: Free information gives you the option to switch to a better plan, but never forces you to switch to a worse one.

  Your counterexamples work because real life violates the "Idealized Bayesian Agent" constraints:
  1.  **Genetic Test:** Information has an intrinsic emotional cost (Utility depends on Knowledge).
  2.  **Surprise Party:** The value of the outcome depends on Knowledge (Utility depends on Knowledge).
  3.  **Poker:** The environment reacts to your Knowledge (Game Theory, not Decision Theory).

  Good's Theorem is a baseline for **instrumental rationality in a passive world**. It tells us that *purely instrumental* information is never bad. But humans care about more than instrumentality (we care about feelings), and we live in a world that isn't passive (other people react). Once you add those variables, "ignorance is bliss" becomes perfectly compatible with rational choice theory.
