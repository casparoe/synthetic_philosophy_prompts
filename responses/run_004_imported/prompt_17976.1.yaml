prompt: |-
  I'm TAing an intro metaethics seminar this term, and next week I actually have to present on the Frege-Geach problem and how expressivists have tried to answer it, which is freaking me out a little since our professor is herself a card-carrying expressivist and will 100% grill me on the details. I've gone through the relevant bits of Blackburn's Spreading the Word (the logic-of-attitudes stuff, building up higher-order attitudes of approval/disapproval to mimic logical structure) and Gibbard's Wise Choices, Apt Feelings and Thinking How to Live (the hyperplan stuff, where normative sentences get truth conditions relative to a world plus a fully resolved 'plan,' so ordinary logic just falls out of that). I get the basic pitch of each on its own, but what I can't get from the secondary lit is where they'd actually disagree with each other -- every overview article just lists both as "live options for expressivists" and moves on like they're basically interchangeable.

  So could you write me a dialogue between a Blackburn-style quasi-realist and a Gibbard-style plan/norm-expressivist where each tries to convince the other that their own solution is the one that actually earns the name "solving Frege-Geach," and that the other's is either cheating (secretly smuggling in enough truth-conditional content that it stops being genuine expressivism) or just patching the problem case-by-case with ad hoc attitudes that don't really generalize. Id like them to get past the standard 'if lying is wrong then getting your little brother to lie is wrong' modus ponens example at some point, into how their machinery handles something harder -- negating a moral claim, disjunctions of moral claims, or even non-assertoric stuff like just wondering out loud whether lying is wrong. Please make it real back-and-forth where each move responds to the specific thing the other just said, not two prepared lectures running in parallel.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Context:** The user is a TA for an intro metaethics seminar. They need to present on the Frege-Geach (F-G) problem and expressivist solutions.
      *   **Specific Challenge:** The professor is a committed expressivist and will grill on details. The user understands Blackburn (*Spreading the Word*) and Gibbard (*Wise Choices, Apt Feelings*, *Thinking How to Live*) individually but struggles to find the *disagreement* between them in secondary literature (which often lumps them together).
      *   **Task:** Write a dialogue between a Blackburn-style quasi-realist and a Gibbard-style norm-expressivist.
      *   **Goal:** Each argues their solution is the "real" solution to F-G, accusing the other of either cheating (smuggling in realism/truth-conditions) or being ad hoc.
      *   **Requirements:** Move beyond basic *modus ponens* (If lying is wrong...). Tackle harder cases: negation, disjunction, non-assertoric contexts (wondering). Ensure it's a real back-and-forth, not parallel lectures.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Blackburn (Quasi-Realism/Projectivism):**
          *   *Core Idea:* Moral judgments express attitudes (approval/disapproval).
          *   *F-G Solution:* Higher-order attitudes. To say "If lying is wrong, then stealing is wrong" is to express a higher-order attitude of disapproving of the combination of disapproving of lying but *not* disapproving of stealing. It's about consistency of sentiment.
          *   *Vulnerability:* Can feel ad hoc. Does it really capture logical validity or just psychological consistency? Is it secretly using truth-conditions under the hood (the "creeping minimalism" charge)?
      *   **Gibbard (Norm-Expressivism/Plan-Based):**
          *   *Core Idea:* Moral judgments express acceptance of norms/plans (hyperplans).
          *   *F-G Solution:* Normative sentences have content because they rule out combinations of plans/worlds. Logic works because inconsistency in plans mirrors inconsistency in beliefs. Later Gibbard (*Thinking How to Live*) leans more into truth-conditions relative to hyperplans.
          *   *Vulnerability:* Is a "hyperplan" just a disguised belief state? If normative sentences have truth-conditions (relative to a plan), is it still expressivism or just relativism/realism?

  3.  **Identify the Friction Points (Where they disagree):**
      *   *The Nature of Consistency:* Blackburn focuses on *attitudinal* consistency (psychological). Gibbard focuses on *plan* consistency (rational requirement).
      *   *Truth:* Blackburn is wary of truth, treating it as a logical device (minimalism) to earn the right to talk like a realist. Gibbard is more willing to assign truth-conditions relative to hyperplans.
      *   *Negation/Disjunction:* Blackburn's higher-order attitudes get messy with complex boolean combinations. Gibbard's possible-worlds-style semantics for plans handles this more formally but risks looking like standard semantics.
      *   *Non-Assertoric Contexts:* Wondering, commanding, etc. Blackburn treats these as expressing different functional roles of attitudes. Gibbard treats them as relations to hyperplans.

  4.  **Drafting the Dialogue - Step-by-Step:**

      *   **Characters:**
          *   *Simon (Blackburnian):* Pragmatic, wary of metaphysics, focuses on sentiment and projectivism.
          *   *Allan (Gibbardian):* Systematic, focuses on rationality, planning, and formal semantics.

      *   **Opening:** Set the scene. A coffee chat after seminar. Acknowledge the F-G problem.
      *   **Round 1: The Basic Charge.** Simon attacks Allan's "hyperplans" as disguised beliefs. Allan attacks Simon's "higher-order attitudes" as ad hoc psychology.
      *   **Round 2: Moving beyond Modus Ponens.** The prompt asks for negation/disjunction/wondering. Let's pick *Negation* and *Disjunction* first.
          *   *Simon:* How do you handle "It's not the case that lying is wrong"? Is that a lack of a plan?
          *   *Allan:* No, it's ruling out the plan that forbids lying. It's a exclusion of a region in plan-space.
          *   *Simon:* That sounds like truth-conditions. You're just doing possible worlds with a "plan" parameter.
      *   **Round 3: The "Cheating" Accusation.**
          *   *Allan:* You need logic to work. My system validates logic. Yours validates psychological coherence. What if I'm psychologically inconsistent but logically valid?
          *   *Simon:* Logic *is* about coherence of commitments. But you've reified plans into objects.
      *   **Round 4: Non-Assertoric (Wondering/Questions).**
          *   *Simon:* "I wonder if lying is wrong." I'm not expressing an attitude. I'm expressing uncertainty.
          *   *Allan:* You're considering which hyperplan to adopt.
          *   *Simon:* But your semantics makes it look like a fact about plans.
      *   **Round 5: The "Creeping Minimalism" Climax.**
          *   *Allan:* If I can save the phenomena of logic, who cares if it looks like realism?
          *   *Simon:* The point of expressivism is to explain *why* we talk that way without the metaphysics. If you keep the metaphysics (plan-objects), you lost the plot.
      *   **Ending:** No clear winner (philosophical dialogues rarely end with a KO), but a clear articulation of the tension.

  5.  **Refining the Philosophical Nuance (Self-Correction during drafting):**
      *   *Correction:* Make sure Simon doesn't sound like an error theorist. He's a *quasi*-realist. He wants to *earn* the right to say "true."
      *   *Correction:* Make sure Allan doesn't sound like a realist. He needs to emphasize that norms aren't *facts* out there, but features of agency.
      *   *Specific F-G Detail:* Ensure the "If P then Q" discussion evolves into "Not-P" or "P or Q". Let's use Disjunction ("Either lying is wrong or stealing is permitted") because it's notoriously hard for expressivists.
      *   *Tone:* Academic but informal. Slightly competitive but respectful.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Dialogue format? Yes.
      *   Blackburn vs. Gibbard? Yes.
      *   Beyond Modus Ponens? Yes (Disjunction/Negation).
      *   Non-assertoric? Yes (Wondering).
      *   Accusations of cheating/ad hoc? Yes.
      *   Real back-and-forth? Yes.

  7.  *(Final thought before writing)*: I need to make sure the distinction regarding *truth* is clear. Blackburn treats truth as a logical operator (deflationary) applied to attitudes. Gibbard treats truth as a property of normative propositions relative to hyperplans. This is the key metaphysical divergence.

  Let's write it.cw
answer: |-
  **Setting:** *The faculty lounge, 4:30 PM. The whiteboard is still covered in formal semantics from the graduate seminar. SIMON (Blackburnian) is erasing a truth-table. ALLAN (Gibbardian) is packing up his laptop.*

  **Simon:** You know, when the professor asked you about the embedding problem for disjunctions, you smiled. Actually smiled. Most of us sweat through that.

  **Allan:** Well, if you treat normative claims as expressions of plan-laden states, disjunctions aren't mysterious. "Either lying is wrong or stealing is permitted" just rules out a combination of worlds and hyperplans. It says: don't be in a world where lying happens while holding a plan that forbids it, *unless* you're in a world where stealing happens and your plan permits it. It's just logic over a richer domain.

  **Simon:** Richer domain, sure. But that's my worry. You've expanded the domain so much it looks like you've just reinvented realism with extra steps. "Worlds plus Hyperplans." If a sentence is true relative to a world-hyperplan pair, in what sense are you still an *expressivist*? You've got truth-conditions. You've got propositional content. You've basically smuggled the realist's ontology in through the back door of "planning."

  **Allan:** That's the standard charge, Simon, but it misses the point. The hyperplan isn't "out there" in the universe like a rock. It's a feature of the agent. To accept a norm *is* to plan. The semantics captures the *logic* of planning. If I say your view is psychological—attitudes of approval and disapproval—how do you handle negation without cheating?

  **Simon:** I don't cheat. I take it seriously. "Lying is not wrong." For me, that's not describing a negative fact. It's expressing a tolerance. It's the absence of the disapproval attitude.

  **Allan:** But that's the "negation problem" in a nutshell. If "Lying is wrong" expresses disapproval of lying, does "Lying is not wrong" express disapproval of disapproving of lying? Or just a lack of disapproval? If it's just a lack, then "Lying is not wrong" and "I have no opinion on lying" come out the same. But they don't. I can actively think lying is permissible. That's a positive state, Simon, not just a vacuum.

  **Simon:** Fine. Then it's a higher-order attitude. To think lying is permissible is to have a tolerant attitude toward lying. But notice what I'm doing. I'm staying close to the phenomenology of moral life. We *feel* approval, we *feel* tolerance. You're talking about "ruling out regions of plan-space." Who talks like that? Who lives like that?

  **Allan:** People who reason. Look, the Frege-Geach problem isn't just about matching feelings to sentences. It's about validity. If your logic is just psychology, then logical validity collapses into psychological consistency. But I can be psychologically inconsistent and still be logically valid. Or I can be psychologically consistent and logically invalid. Your quasi-realism makes logic dependent on the stability of my sentiments. Mine makes it dependent on the rationality of my plans.

  **Simon:** But that's where you lose the expressivist plot! The whole point was to avoid positing weird objects. Now you've got "hyperplans" acting like abstract objects that sentences correspond to. When I say "If lying is wrong, then getting your brother to lie is wrong," I'm not describing a relation between a norm and an action. I'm expressing a conflict in my own sentiments. I'm saying, "I disapprove of lying, and I'd also disapprove of myself if I didn't disapprove of getting your brother to lie." It's all about *me* and my commitments.

  **Allan:** And that's why your solution feels ad hoc. You build a new higher-order attitude for every logical operator. Disjunctions? That's a nightmare for you. "Either lying is wrong or stealing is wrong." What is the higher-order attitude there? Are you disapproving of the combination of *not* disapproving of lying and *not* disapproving of stealing?

  **Simon:** Basically, yes. It's a commitment to not having both tolerances simultaneously.

  **Allan:** See, that's patching. You're reverse-engineering attitudes to fit the truth-tables. My system just *gets* disjunction for free. Because plans have content, and content combines logically. If your plan forbids A, and my statement says "A or B," I'm telling you your plan is incompatible with the state of affairs where neither A nor B obtains. It's formal. It's clean.

  **Simon:** It's clean because it's realist semantics in disguise! You've solved Frege-Geach by conceding to the realist that moral sentences *do* have truth-conditions. You've just made the truth relative to a plan. But then, what happens when we step outside the moral context? What happens when I'm not asserting, but wondering?

  **Allan:** Wondering?

  **Simon:** Right. "I wonder if lying is wrong." I'm not expressing an attitude of approval or disapproval. I'm not even expressing a plan. I'm in a state of suspension. How does your hyperplan handle that? Are you wondering which hyperplan to adopt?

  **Allan:** Exactly. To wonder whether lying is wrong is to be undecided between hyperplans that forbid lying and hyperplans that permit it. It's a relation to a set of plans.

  **Simon:** But now look at what you've done. You've turned moral inquiry into a search for the "correct plan." That starts to sound suspiciously like a search for moral facts. If there's a fact of the matter about which hyperplan is "rational," you're a realist about rationality. If there isn't, then why does logic apply to them?

  **Allan:** Because rationality isn't a "fact" in the world, it's a constraint on agency. But let's turn this back on you. If "I wonder if lying is wrong" is just a psychological report about your fluctuating sentiments, why does it have logical consequences? If I say, "I wonder if lying is wrong, but I know that if lying is wrong, then getting your brother to lie is wrong," I'm committed to wondering about getting your brother to lie. Your sentiment-based view struggles to capture that *commitment*. It captures what I *feel*, not what I *must* think if I'm rational.

  **Simon:** Quasi-realism earns the right to talk about commitment! That's the whole project. We start with expressions of attitude, and we see how, by reflecting on our own attitudes, we are forced to talk *as if* there are moral truths. We earn the truth-predicate. When I say "It's true that lying is wrong," I'm not adding a property. I'm re-asserting my commitment in a logically complex context. You, on the other hand, you start with the truth-predicate. You say normative sentences have truth-conditions relative to plans. You haven't earned it; you've assumed it.

  **Allan:** I haven't assumed truth; I've analyzed content. Look, Simon, the professor is going to ask you about the "scope" problem. If I say, "Bob believes that lying is wrong," I'm attributing a state to Bob. On your view, I'm attributing an attitude. But what if Bob is an expressivist too? Then he doesn't believe he has an attitude; he just has the attitude. Your view requires Bob to have a theory about his own mind to be the subject of a moral ascription. My view just says Bob is in a plan-laden state. It's opaque enough to handle third-person ascriptions without requiring Bob to be a philosopher.

  **Simon:** That's a fair hit. But here's the rub. If your hyperplans are just functional states that play the belief-role in logic, why aren't they just beliefs? Why call it expressivism at all? If a normative sentence has a truth-condition, expresses a cognitive state (a plan), and obeys classical logic... what work is "expressivism" doing? You've solved Frege-Geach by becoming a minimalist realist.

  **Allan:** Because the *nature* of the state is different. A belief aims to fit the world. A plan aims to get the world to fit it. The direction of fit is different. That's the expressivist core. The semantics can look realist because the *logic* of planning mirrors the logic of believing. But the metaphysics is still about agency, not detection.

  **Simon:** But if the logic mirrors it perfectly, and the truth-conditions are there... the metaphysics doesn't matter. That's "creeping minimalism." You've solved the problem by making expressivism indistinguishable from realism. And if they're indistinguishable, why did we fight the realist in the first place?

  **Allan:** Because the realist thinks the plan is *correct* because it matches a normative fact. I think the plan is correct because it's the one we have reason to adopt. The explanation runs the other way. But look, let's talk about the hard case. Conditionals with non-moral antecedents. "If grass is green, then lying is wrong."

  **Simon:** Oh, god.

  **Allan:** Right. On my view, easy. It rules out worlds where grass is green combined with plans that permit lying. The world-parameter and plan-parameter interact. On your view? What is the higher-order attitude toward *grass*?

  **Simon:** It's... look, it's a commitment that the truth of the descriptive claim doesn't alter the normative stance. It's saying my disapproval of lying is robust across the variation in grass color.

  **Allan:** "Robust." That's a modal notion. You're appealing to stability across possible worlds. Simon, you're using possible worlds semantics to explain attitudes. I'm just being honest about it. I admit I'm using a world-parameter. You're hiding it inside "robustness of sentiment."

  **Simon:** I'm not hiding it; I'm explaining it in terms of *commitment*. The point isn't to build a model that validates every inference in Principia Mathematica. The point is to explain why we care. Why does "If lying is wrong, then..." move us? Because it's about our passions. Your system validates the inference but loses the motivation. It's a logic of angels, not humans.

  **Allan:** And your system captures the humans but loses the logic. It's a psychology of poets, not reasoners. If I can't show that moral reasoning is *valid* in the same sense mathematical reasoning is, I haven't answered the error theorist. I've just said, "We feel strongly." The error theorist says, "Feelings aren't truth-apt." If I show you that plans have truth-conditions relative to their own standards, I've shown they are truth-apt.

  **Simon:** But you've changed the subject! "True relative to a plan" isn't what the realist means by true. The realist wants "True simpliciter."

  **Allan:** And the quasi-realist says "True simpliciter" is just a device for re-assertion. So we agree on the deflationism!

  **Simon:** We agree on the deflationism, but we disagree on the *base*. I'm deflating truth applied to *attitudes*. You're inflating attitudes until they look like *propositions*.

  **Allan:** Maybe. But when the professor asks me why disjunctions work, I can draw a diagram of set exclusion. When she asks you, you have to describe a complex feeling of "disapproval of a combination of disapprovals." Which one sounds like it solves a *logical* problem?

  **Simon:** Logic isn't just set exclusion. It's about the consistency of commitment. But fine. Here's my final worry. Your hyperplans have to be "fully resolved" to get the logic to work, right? A complete plan for every contingency.

  **Allan:** Ideally, yes. To assess validity, we look at fully resolved hyperplans.

  **Simon:** But no human has a fully resolved hyperplan. We're messy. We have gaps. So your semantics applies to ideal agents, not us. My semantics applies to the messy sentiments we actually have. You've solved Frege-Geach for God. I'm trying to solve it for undergraduates.

  **Allan:** *[Laughs]* Touché. But if the undergraduates want to pass logic, they need to reason as if they were ideal. Maybe that's the normativity right there.

  **Simon:** Or maybe it's just a reminder that we're pretending. Which is all quasi-realism ever claimed. We pretend there are truth-conditions so we can talk to each other. You actually think you found them.

  **Allan:** I think I found the structure of agency. You think you found a way to keep talking without metaphysics.

  **Simon:** Exactly. And if your structure of agency looks exactly like metaphysics...

  **Allan:** ...then maybe metaphysics was just agency misunderstood.

  **Simon:** *[Stops erasing the board]* Well. That's going in the presentation intro.

  **Allan:** Just make sure you don't let her pin you on the negation case. If you say "not wrong" is just "tolerance," she'll ask if tolerance is an attitude or a lack of one.

  **Simon:** I'll tell her it's a second-order attitude of approval toward the lack of a first-order attitude.

  **Allan:** And she'll ask what attitude you're holding toward *that*. Infinite regress, Simon.

  **Simon:** Then I'll express my disapproval of her question.

  **Allan:** *[Grins]* Now *that* is expressivism.
