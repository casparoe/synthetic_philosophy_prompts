prompt: |-
  Ok so I had this whole argument with my friend last night about Maimonides and animal sacrifice, of all things to argue about at 1am. In the Guide (book III, ch. 32 i think?) he argues God only commanded sacrifice as a concession -- the Israelites were so steeped in the ambient culture of pagan sacrificial worship that jumping straight to "pure" prayer-only worship wasn't psychologically possible, so He redirected the practice toward Himself as a kind of weaning-off strategy, with the real endgame being sacrifice-less worship. My friend's take was that this basically makes the sacrificial commandments hollow -- just scaffolding meant to be discarded once humanity "grows up" -- which she thinks cant be right for something that takes up such a huge chunk of Leviticus. I pushed back that later on he turns around and gives really specific symbolic reasons for particular sacrificial details (why certain species, why certain animals were off-limits, tied to what exactly the idolaters worshipped), which seems to cut against the "it's all just a concession" reading. Can you help me sort out how these two moves of his are actually supposed to fit together, and maybe say a bit about how someone like Nahmanides pushed back on the whole accommodation theory?
