      *   *Scene 5:* The Crash. The outcome.

  6.  **Refining the Logic (Self-Correction):**
      *   Make sure the "backing down is also a commitment" point is clear. If Elara pulls the plug now, she commits her agency to being unreliable. Future negotiations will fail because her threats are empty. So rationality dictates she let the crash happen to preserve future credibility. That's the horror.
