      *   *Refining the Ending:* Make sure it doesn't feel like one won.

  7.  **Final Polish:** Check the pacing. Ensure the "separateness of persons" is explicitly mentioned. Ensure the "reasonable rejectability" is clear.

  *(Self-Correction during drafting)*: I need to be careful with the "coin flip" mechanics. Taurek's view is that you give each *individual* an equal chance. So if there are 6 people, you roll a 6-sided die. If 1 comes up, save the single. If 2-6, save the five. This *does* make the numbers count in practice, but not in *principle*. However, the prompt says "proposes something like a coin flip." I will have Aris argue for a 50/50 between the *parties* (Save 1 vs Save 5) because that is the strongest interpretation of "Numbers Don't Count." If she argues for a 1-in-6 die roll, Ben can say "See, the numbers count!" If she argues for a coin toss between the groups, it highlights the moral equality of the claims. I will go with the coin toss between groups for maximum philosophical clarity on the "Should Numbers Count" question.

  *Wait, looking at Taurek's text:* Taurek suggests that if I have a supply of drugs sufficient to save either A or B, C, D, E, F... I should flip a coin to decide whether to save A or the others. This gives A a 50% chance. This is the most controversial reading and fits the prompt's description of "coin flip instead of just treating the larger group." I will proceed with this.

  *Scanlon's nuance:* Scanlon argues in "What We Owe to Each Other" that when claims conflict, we should ask which principle for resolving the conflict is reasonably rejectable. Saving the greater number is justified because the single person cannot reasonably reject a principle that saves the five, given that the five have identical claims.

