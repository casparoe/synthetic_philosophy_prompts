answer: |-
  **Setting:** *The emergency triage room of St. Jude's Rural Clinic. The hum of ventilators is punctuated by the sharp, rhythmic beep of cardiac monitors. On a metal tray sits a single vial of antivenom. To the left, behind a glass partition, Patient A is seizing. To the right, in a larger bay, Patients B, C, D, E, and F are in varying stages of anaphylactic shock. Both groups will be dead within ten minutes without the dose.*

  **Characters:**
  *   **Dr. Aris:** Senior Physician. Calm, intense. A adherent to Taurek's "Numbers Don't Count."
  *   **Dr. Ben:** Resident Director. Pragmatic, urgent. Argues for a Scanlonian contractualist approach.

  ***

  **Ben:** (Gloved hand hovering over the vial) Aris, stop. We're moving to the larger bay. Five hearts against one. You know the protocol.

  **Aris:** (Blocking the tray) Protocol is a guideline, Ben. Morality is the constraint. If you walk to that bay, you are condemning the patient in Room 1 to death solely because there are others who also need help. That is unjust.

  **Ben:** Unjust? Leaving four people to die when we could have saved them is what's unjust. We don't have time for a seminar, but you're talking about Taurek. I know the argument. "No one experiences the loss of five lives." But that's a semantic trick. Five people will stop breathing. That is objectively more loss than one person stopping breathing.

  **Aris:** It's not a trick. It's about the *subject* of the loss. There is no super-person who experiences "five deaths." There is only Patient A, who loses *his* life. And Patient B, who loses *hers*. From Patient A's perspective, the fact that five others are dying in the next room does not make his death any less complete. If we choose based on numbers, we are telling him: "Your claim to life is weaker because others have identical claims." But his claim isn't weaker. It's absolute.

  **Ben:** His claim is absolute, yes. But so are theirs. That's exactly why we can't flip a coin between the *rooms*. Taurek suggests a 50/50 chance between the groups, right? That gives Patient A a fifty percent chance of survival, but it gives each of the five only a ten percent chance. Why does Patient A deserve five times the probability of survival as Patient B?

  **Aris:** Because we are choosing between *conflicting claims*, not counting heads. If I have one lifeboat and two swimmers, I don't weigh them. I flip a coin. Why? because to do otherwise is to use the loser as a means to save the winner. If we give the antivenom to the five, we are effectively sacrificing Patient A for the sake of the group. We are treating his life as a resource to be traded. The coin flip respects the separateness of persons. It acknowledges that I cannot step in and say, "Your death is acceptable because it balances the equation."

  **Ben:** I'm not balancing an equation. I'm thinking about what we owe to each of them individually. Think about Scanlon's contractualism. Ask yourself: What principle of action could none of these patients reasonably reject?

  **Aris:** Go on.

  **Ben:** If we adopt your principle—"Always flip a coin between groups regardless of size"—Patient B through F have a legitimate complaint. They can say, "Doctor, you had the power to save me without costing anyone else their life, except for the fact that you chose to gamble with my survival to give Patient A a better shot." If we save the five, Patient A can complain, certainly. He can say, "I was left to die." But can he *reasonably* reject a principle that says, "When equal claims conflict, save the greater number"?

  **Aris:** Yes, he can. Because that principle implies his life is worth less than the sum of the others.

  **Ben:** No, it doesn't imply his life is worth *less*. It implies that the *reasons* we have to save the five are more compelling. Each of the five has a reason: "Save me, I will die otherwise." Patient A has the same reason. But if we listen to Patient A, we must ignore five identical reasons. If we listen to the five, we ignore one. It's not that the five reasons add up to a bigger number of "utility points." It's that there are more people standing there with a valid complaint. To ignore four of those complaints to satisfy one is to fail to show equal respect to the four.

  **Aris:** But you *are* aggregating, Ben. You're just hiding the math behind the word "complaints." You're saying four complaints outweigh one. But morality doesn't work like a vote. If five people want to listen to loud music and one wants silence, we don't just outvote the one. We look for a solution that respects rights. Here, the right is to life. Patient A has a right not to be abandoned. By flipping a coin, I give him a fighting chance. By walking to the other bay, you guarantee his death. You are making his death certain to avoid the statistical certainty of four others dying. But those four aren't *your* responsibility yet. Patient A is here, now.

  **Ben:** They are all my responsibility. And consider the outcome of your "fairness." If we flip that coin, and it lands on Patient A, we have knowingly allowed four preventable deaths. We watched them die to give one person a 50% chance. How do I justify that to the families of the five? "Sorry, we valued the mathematical purity of the decision over your daughter's life"?

  **Aris:** You justify it by saying, "We refused to treat your daughter's life as a counter in a calculation." You tell them that we recognized that every single person in this clinic has an equal claim on our aid, and that claim cannot be diluted by the presence of others. If we save the five, we are essentially telling Patient A: "You are the spare part." Taurek's point is that there is no "greater good" that exists over and above the individuals. There is only David, and there is the five. To sacrifice David is to violate the boundary between them.

  **Ben:** But Scanlon would say David cannot reasonably demand we violate the boundary in the other direction! If we save David, we are sacrificing the five. You keep acting like saving the five is an active harm to David, and saving David is neutral. It's symmetric! If we save David, we are using the five as a means to uphold a principle of "coin-flip fairness." We are letting them die to prove a philosophical point about aggregation.

  **Aris:** It's not a point. It's respect. The coin flip is the only mechanism that doesn't presuppose that some lives can be traded for others. It admits that we have no right to make that trade.

  **Ben:** And walking to the other bay admits that we have no right to gamble with four extra lives when we don't have to. Look at the monitors, Aris. (He points to the bay with five patients). Their blood pressures are dropping in unison. They are distinct people, yes. But they are distinct people who all have the same urgent need. If I stand here and flip a coin, and it lands on the single, I have actively chosen to let four people die who could have lived. Is that really "respecting" them? Or is it respecting an abstract idea of fairness while their bodies shut down?

  **Aris:** It is respecting the fact that I am not God. I cannot weigh souls. I can only offer equal chance. If I choose the five, I am acting as if I have the authority to decide that five futures are worth more than one. I don't have that authority.

  **Ben:** You have the authority of a doctor with one dose of medicine. And you have a duty to minimize the loss of life under your care. Not because five equals five times one, but because abandoning four people when you could save them is a betrayal of the medical trust. Patient A's claim is strong. But the collective weight of five identical claims creates a justification that the single claim cannot override. Not by math, but by the sheer number of people who would be wronged.

  **Aris:** (Softly) And if you walk over there, you wrong the one. Completely. Irrevocably.

  **Ben:** And if you flip, you risk wronging the four. Completely. Irrevocably.

  *(A heavy silence falls between them. The beep of Patient A's monitor accelerates slightly.)*

  **Aris:** The coin is in my pocket.

  **Ben:** The syringe is in my hand.

  *(They stand frozen, the vial between them, the seconds ticking away on the wall clock. Neither moves.)*
