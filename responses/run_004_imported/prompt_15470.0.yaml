  6.  **Writing the Speech (incorporating the "Kant" constraint):**
      *   *Key phrase to include:* "Indirect duty." (It's the specific term he likely used, but explain it immediately).
      *   *Key sentiment:* His stubbornness was a gift.
      *   *Timing:* ~450-550 words for 3-4 minutes at a moderate pace.

  7.  **Review against Constraints:**
