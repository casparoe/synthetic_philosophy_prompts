answer: |-
  Your roommate has asked a brilliant question, and your research has uncovered exactly why her skepticism is warranted. The short answer is: **Your professor gave you a pedagogical simplification, but the literature shows the problem is far from "solved."**

  In fact, "Death in Damascus" is one of the primary reasons decision theory is *still* a live field of research rather than a settled chapter in a textbook. If CDT had truly "won" in 1978, we wouldn't see papers on Functional Decision Theory (FDT) or Timeless Decision Theory (TDT) coming out of places like MIRI or Oxford in the last decade.

  Here is the breakdown of why your professor's "CDT wins, case closed" narrative is missing crucial nuance, and why people are still arguing about this almost 50 years later.

  ### 1. The Professor's Story vs. The Gibbard & Harper Reality
  Your professor presented CDT as treating Death's location as "already fixed, independent of whatever the man decides." This is the standard CDT move: sever the evidential link and look only at causal arrows.

  However, Gibbard and Harper (1978) didn't introduce "Death in Damascus" to show how easy CDT is. They introduced it to show that **standard CDT is unstable.**

  Here is the glitch:
  *   **CDT says:** Calculate expected utility based on the causal consequences of your act.
  *   **The Problem:** If Death is a perfect predictor, your decision process *is* the cause of Death's location (or rather, the common cause of both).
  *   **The Instability:** If you deliberate and decide "I will go to Aleppo," you must believe Death is in Aleppo. If you believe Death is in Aleppo, the expected utility of going to Aleppo drops to zero. So you switch to Damascus. But if you switch to Damascus, Death is in Damascus.
  *   **The Result:** Standard CDT creates an infinite loop of deliberation. It does **not** give a "clean, stable answer."

  To fix this, Gibbard and Harper introduced the concept of **Ratifiability**. A decision is ratifiable if, *conditional on the fact that you have decided to do it*, it still maximizes expected utility. In Death in Damascus, neither pure strategy (Aleppo or Damascus) is ratifiable. The only ratifiable solution is a **mixed strategy** (flipping a coin).

  So, the "CDT solution" isn't "Go to Aleppo." It's "You cannot rationally choose a specific city; you must randomize."

  ### 2. Why the "Mixed Strategy" Solution is Unsatisfying
  This is why people are still publishing on it. The CDT recommendation to flip a coin feels like a surrender, not a solution.

  If Death is a *perfect* predictor, he predicts coin flips too. If you decide to flip a coin 50/50, Death waits in Aleppo 50% of the time and Damascus 50% of the time. Your survival rate is 50%.
  *   **The Critique:** Flipping a coin doesn't *save* you. It just makes your death probabilistic rather than certain.
  *   **The Philosophical Sting:** If rationality requires you to flip a coin, but flipping a coin offers no causal advantage against a perfect predictor, is CDT actually guiding you toward survival, or just guiding you toward a specific mathematical consistency?

  Many philosophers argue that a decision theory that tells you to randomize in a life-or-death scenario where randomization doesn't help is failing its primary job.

  ### 3. EDT Isn't Dead Yet (The "Tickle" Defense)
  Your professor claimed EDT "can't give him any usable advice." That is the standard critique, but EDT proponents have fought back with the **"Tickle Defense."**

  The argument goes like this: The correlation between your choice and Death's location is mediated by your mental state (your deliberation). If you have full access to your own mental state (the "tickle"), you can screen off the correlation.
  *   Once I know *why* I am choosing Aleppo (my internal deliberation), learning that I *am* choosing Aleppo gives me no *new* evidence about Death.
  *   Sophisticated versions of EDT (like those proposed by David Lewis or later by Arif Ahmed) attempt to handle Newcomb problems by refining how evidence is conditionalized.

  So, EDT hasn't conceded; it has evolved. The debate is now about whether the "Tickle Defense" holds up under scrutiny (many argue it doesn't in perfect predictor cases), but it's not a knockout loss.

  ### 4. New Contenders: FDT and TDT
  The reason this is still hot in 2024 is that both CDT and EDT are now seen by some as failing to capture the right intuition in predictor cases. This has led to new theories:

  *   **Timeless Decision Theory (TDT) / Functional Decision Theory (FDT):** Proposed by researchers like Eliezer Yudkowsky and Nate Soares. They argue that you shouldn't view your decision as a physical act independent of the predictor. You should view your decision as the output of an *algorithm*. Since Death is running a simulation of that algorithm, your decision and Death's location are logically correlated, not just causally or evidentially.
  *   **The FDT Verdict:** FDT argues that you should act as if your decision *determines* the prediction (because logically, it does). In some formulations, this allows the agent to "win" where CDT and EDT fail, or at least provides a more coherent account of why the agent is doomed regardless of the theory.

  ### 5. Why Your Roommate is Right to Be Skeptical
  To answer your roommate's question directly: Academics aren't arguing because they refuse to let go of a settled question. They are arguing because **the question exposes a fundamental rift in how we understand causation, logic, and agency.**

  *   **If CDT is right:** We must accept that rational agents sometimes must randomize even when it doesn't help, and that our choices are causally isolated from perfect predictions of them.
  *   **If EDT is right:** We must accept that "news" about our own actions matters, even when we are the ones generating the news.
  *   **If FDT is right:** We must accept that our physical decisions are instances of abstract logical functions that can be "computed" by predictors elsewhere in the universe.

  ### Summary for Your Paper
  Your professor's narrative is a useful **heuristic** for teaching the difference between Causal and Evidential links, but it is not an accurate summary of the **state of the field**.

  *   **CDT** doesn't give a stable pure-strategy answer; it requires ratifiability and mixed strategies.
  *   **EDT** has sophisticated defenses (screening off) that prevent it from being totally paralyzed.
  *   **The Debate** continues because "Death in Damascus" isn't just about a guy fleeing death; it's a proxy for the problem of **free will in a deterministic universe** and, increasingly, **AI alignment** (how do we build agents that reason about predictors without looping forever?).

  You can tell your roommate: "It's not that they can't solve the math. It's that every mathematical solution requires accepting a different metaphysics about what a 'choice' actually is." That's worth 50 years of argument.
