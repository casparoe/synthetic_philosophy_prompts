      *   *Let's pivot to the Verification Problem first, as it informs the Truth.*

  4.  **Address Question 2: The Verification Problem (The Logic Trap)**
      *   *The Problem:* How do you prove $p$ is unknowable without knowing $p$?
      *   *The Logic:* You don't prove the *content* of $p$ is unknowable. You prove the *structure* of $p$ makes it unknowable.
