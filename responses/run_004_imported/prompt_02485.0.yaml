      *   **Philosophical Sanity Check:** Warn the user that Fitch's paradox applies to *contingent* unknown truths. An omniscient being (Loom) technically bypasses Fitch if it *already* knows everything. The protagonist must prove the Loom *doesn't* already know everything by creating a *new* truth in real-time that relies on the Loom's ignorance.
