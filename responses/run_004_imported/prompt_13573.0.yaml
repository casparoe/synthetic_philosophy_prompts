answer: |-
  You have stumbled onto one of the oldest, thorniest problems in political philosophy, and your intuition is spot on: **Everyone is absolutely reverse-engineering principles to benefit themselves.**

  In political science, this is known as **Public Choice Theory**. It's the study of how people use economic self-interest to explain political decision-making. Gary wants a vote for the tenant because he likely identifies with the "stakeholder" argument (or is a tenant himself). The seasonal owner wants "one vote per deed" because that protects their asset value. The full-time resident wants "residency" because they want control over their daily environment.

  To answer your core question: **Is there a non-arbitrary way to sort this out, or is it just raw power?**

  The short answer is: There is no "God's eye view" solution that is perfectly non-arbitrary. However, there are established frameworks that can help you move from "who can shout the loudest" to "what makes the community functional."

  Here is the breakdown of the theory, the reality, and how communities like yours usually solve it.

  ### 1. The Theoretical Problem: "The Boundary Problem"
  Political philosophers call your dilemma **The Boundary Problem** (or the *constituency problem*). Before you can have a democracy, you have to decide *who* constitutes the "people" (the demos).

  *   **If you define it by Property (Current Bylaw):** You are treating the POA like a **corporation**. The "shareholders" (owners) vote to protect the value of their asset. This is stable and legally clean, but it ignores the fact that a tenant suffers more from a bad snowplow contract than an absentee owner.
  *   **If you define it by Residency (Gary's/Residency Argument):** You are treating the POA like a **municipality** (a mini-city). This is morally appealing for daily life, but it undermines property rights. Why should I lose control over my asset just because I rent it out?
  *   **If you define it by Funding (Dues Argument):** This is the **"No Taxation Without Representation"** argument. But it gets messy with the "Mill Houses." They use the road (tax/benefit) but pay no dues. Under this principle, they *should* either get a vote and be billed, or be barred from the road.

  **The Verdict:** None of these are objectively "true." They are different lenses. The conflict arises because your POA is trying to be a corporation *and* a municipality at the same time.

  ### 2. The "Mill House" Complication
  The 6 houses at the old mill are the wildcard. Legally, this usually comes down to **easements**.
  *   If they have a recorded easement to use the road, they have a property right to use it regardless of POA membership.
  *   If they have *no* legal easement and are just using it by historical permission, the POA could technically gate it (though this is nuclear war).

  From a governance perspective, they are the strongest argument for the **"All-Affected Principle."** This principle states: *Anyone significantly affected by a decision should have a say in that decision.* Since the road condition affects them directly, excluding them from the conversation creates a permanent underclass that has an incentive to let the road rot.

  ### 3. Is "Non-Arbitrary" a Fantasy?
  You asked if finding a fair rule is a fantasy. It is a fantasy if you are looking for a rule that makes everyone happy. It is **not** a fantasy if you are looking for a rule that creates **stability.**

  In community associations, the most stable systems usually separate **Ownership Rights** from **Occupancy Rights.**

  **The Hybrid Model (Common Solution):**
  Many sophisticated HOAs/POAs split the voting or create two tiers of input:
  1.  **The Board (Fiscal/Asset Control):** Elected by **Owners** (Deed holders). They control the budget, major capital improvements, and legal liability. This satisfies the "property value" crowd.
  2.  **The Committees (Daily Life/Usage):** Open to **Residents** (Owners + Tenants). They decide on snowplow timing, trash rules, road maintenance schedules, and noise. This satisfies Gary and the full-time residents.

  This acknowledges that the *owner* cares about the long-term value of the lake, but the *resident* cares about whether the plow comes at 6 AM or 8 AM.

  ### 4. The Power Reality (Your Second Question)
  You asked: *"Is it basically a fantasy and it always just comes down to whoever already has enough votes to write the rule first?"*

  **Yes, mostly.**
  Changing bylaws usually requires a supermajority (often 67% or 75% of owners).
  *   **The Seasonal/Airbnb Owners** likely hold the majority of the deeds.
  *   **The Full-Time Residents** likely hold the majority of the *time spent there*.

  If the seasonal owners realize that shifting to a "residency" model devalues their rental income or control, they will vote as a bloc to keep the status quo. If the full-time residents realize they are being governed by people who never see the consequences of their decisions, they may stop paying dues or stop maintaining their properties, which hurts everyone.

  **The "Tiebreaker" isn't philosophy; it's leverage.**
  The only way to change the rule non-arbitrarily is to find a **Shared Interest.**
  *   *Example:* If the road is failing, the seasonal owners need it fixed to protect their asset value. The full-time residents need it fixed to get to work. The Mill Houses need it fixed to get out.
  *   Focus the argument on **specific outcomes**, not abstract voting rights. "We need a committee to oversee road maintenance that includes residents, because residents notice the potholes first."

  ### 5. What Should You Do?
  Since you can't stop thinking about it, here is a way to frame it that might lower the temperature:

  1.  **Acknowledge the Self-Interest:** Call it out gently. "I think we're all arguing for the rule that helps us most. That's human nature. The question is, what rule keeps the lake from turning into a war zone?"
  2.  **Decouple Voting from Speaking:** You don't necessarily need to change *who votes* to change *who is heard.* Propose that while only owners vote, **any resident (tenant or owner) can speak and serve on committees.** This gives Gary's tenant a voice without stripping the absentee owner of their legal property right.
  3.  **Address the Mill Houses:** This is a legal liability. If they use the road, the POA should try to formalize a maintenance fee for them. If they pay, they get a voice (maybe not a vote, but a seat at the table). If they don't pay, the POA needs to know if they are legally obligated to let them use it.
  4.  **Accept the "Corporate" Reality:** Legally, a POA is almost always a corporation. Courts generally side with the **deed**. Trying to force a "one person, one vote" residency model often gets sued and struck down unless the bylaws are explicitly changed to allow it.

  ### Summary
  There is no "correct" philosophical answer.
  *   **Property Rights** protect investment.
  *   **Residency Rights** protect quality of life.
  *   **Fiscal Rights** protect solvency.

  Your community is currently prioritizing **Property Rights**.
  Gary is prioritizing **Residency Rights**.
  The Dues argument is prioritizing **Fiscal Rights**.

  The "non-arbitrary" solution is to admit that **all three matter.** The most functional communities create a structure where Owners control the money/asset, but Residents control the daily rules.

  If you try to solve this purely on "what is fair," you will lose to the people who solve it on "how many votes do I have." If you want to win, build a coalition around a specific problem (like the road) and propose a committee structure that gives the full-time folks a voice without asking the seasonal owners to give up their votes immediately.
