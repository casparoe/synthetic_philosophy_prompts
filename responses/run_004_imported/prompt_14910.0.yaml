      *   **Syadvada:** "Logical machinery... prefixed with 'syat,' meaning 'perhaps' or 'maybe,' flagging that the speaker isn't fully certain..." -> *Problematic.* This is a common misconception. *Syat* doesn't mean "maybe/I'm uncertain" (epistemic humility); it means "in some respect" (ontological/semantic qualification).
