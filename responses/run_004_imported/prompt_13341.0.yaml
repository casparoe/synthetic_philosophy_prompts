      *   *Section 3 (Metaethical Box):* Discuss Subjectivism vs. Error Theory. Ramsey's pragmatism. He thinks ethics is about *getting what we want*, not finding truth. Label: **Pragmatic Subjectivism with Error-Theoretic overtones regarding "Absolute" values.**
