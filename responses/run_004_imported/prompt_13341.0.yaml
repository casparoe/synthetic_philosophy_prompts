  **(Self-Correction during drafting):** I need to be careful not to overstate Ramsey's commitment to Emotivism. Ayer later claimed Ramsey as a forefather, but Ramsey was more nuanced. I should emphasize the *pragmatic* element. Ramsey is interested in *success* in action, not just truth conditions.

