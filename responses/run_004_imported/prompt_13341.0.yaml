answer: |-
  It is a delight to correspond with someone who brings both the rigor of a condensed matter physicist and the curiosity of a new philosopher to the table. That Norman/Frank Ramsey mix-up is a classic hazard of the trade; it's like confusing Murray Gell-Mann with some obscure phenomenologist because they both deal with "quarks" of truth.

  You have put your finger on exactly the right tension in that passage. As a physicist, you are trained to look for the derivation—the steps that take you from premise A to conclusion B. In that sentence from the "Epilogue," Ramsey is not giving you a derivation. He is giving you a **boundary condition**.

  Here is how I would break down your three questions, keeping your background in mind.

  ### 1. Is there an argument linking God to Objective Good, or is it an assertion?

  It is primarily an assertion, but it is an assertion based on a specific **ontological dependency** that was taken for granted in that specific Cambridge milieu.

  Ramsey is not arguing logically that $\neg \text{God} \rightarrow \neg \text{Objective Good}$. He is making a historical and psychological claim about the *infrastructure* of value. For the Victorians and Edwardians preceding the Apostles, "Objective Good" was a theoretical entity that required a specific ontological anchor to hold it in place within the fabric of reality. That anchor was usually God (either as the source of Divine Command or as the guarantor of a moral order).

  When the Apostles (Ramsey, Keynes, Woolf, etc.) discarded God—due to the rise of scientific naturalism and the disillusionment of WWI—they felt they had removed the support structure for "Objective Good." To them, a "Good" that existed without God looked like a force without a field, or a particle without a Lagrangian. It was metaphysically idle.

  So, is it an argument? No. It is a **diagnosis of a paradigm shift**.
  *   **Physicist Analogy:** It is akin to saying, "We dismissed the luminiferous ether along with absolute rest." Strictly speaking, you could try to construct a theory with an undetectable ether (just as Moore tried to construct ethics without God), but the *community of practice* decided that if you remove the primary function of the entity (absolute rest/God), you might as well discard the entity itself (ether/Objective Good) to simplify the ontology.

  Ramsey is saying: "We realized the machinery required to make 'Objective Good' real was theological. We scrapped the machinery. Therefore, we scrapped the output."

  ### 2. What is "Absolute Ethics," and is he digging at Moore?

  "Absolute Ethics" is almost certainly a dig at the **British Idealists** (F.H. Bradley, J.M.E. McTaggart) rather than Moore specifically, though Moore gets caught in the crossfire.

  *   **The Idealists:** They viewed ethics as part of a metaphysical system where the "Good" was the realization of the "Absolute" (a holistic, spiritual reality). When Ramsey says "Theology and Absolute Ethics... have no real objects," he is grouping them as two forms of metaphysics that posit entities beyond the reach of empirical verification or logical analysis.
  *   **Moore:** You are right to be puzzled by Moore's presence here. Moore's *Principia Ethica* (1903) explicitly argued that "Good" is a simple, non-natural property known by intuition, independent of God. However, to the hard-nosed logical atomists and empiricists of the 1920s (Russell, Wittgenstein, Ramsey), Moore's "non-natural property" looked suspiciously like a secularized soul. It was a "queer" entity (to borrow J.L. Mackie's later term) that didn't fit into a scientific worldview.

  Ramsey is likely being slightly breezy here. He is lumping Moore in with the Idealists because, from the perspective of a rigorous logician or scientist, positing a "non-natural property of goodness" is not significantly less metaphysically extravagant than positing a theological absolute. Both are "famous subjects which we have realized to have no real objects." He is dismissing the *metaphysical status* of value, not necessarily the *practice* of valuing.

  ### 3. Which modern metaethical box does this fit?

  If we must force Ramsey into a modern box, the best fit is **Pragmatic Subjectivism with Error-Theoretic overtones.**

  *   **Why not pure Emotivism?** Emotivism (Ayer, Stevenson) says moral statements are merely expressions of emotion ("Boo! Hurrah!"). Ramsey is more sophisticated than that. He sees ethics as tied to *desire* and *action*. In his other work (like *Truth and Probability*), he treats belief as a disposition to act. In ethics, he treats value as a function of what we want and how we satisfy those wants.
  *   **Why Error Theory?** When he says Absolute Ethics has "no real objects," he is making an Error Theory claim: statements purporting to describe objective moral facts are false because no such facts exist.
  *   **The Pragmatic Twist:** However, Ramsey doesn't leave us in a nihilistic void. He follows Russell's reduction: ethics becomes psychology. It becomes the study of how to satisfy human desires. This is a form of **Naturalistic Subjectivism**. Moral judgments aren't true/false in the way "the electron has spin 1/2" is true/false; they are more like "this strategy maximizes the satisfaction of our desires."

  **Confidence Level:** I would place my confidence in this label at about **60%**.
  *   **Reason for uncertainty:** As you noted, this is an after-dinner talk to the Apostles, not a peer-reviewed paper. Ramsey was a pragmatist above all else; he was often more interested in how concepts *functioned* than in their ultimate metaphysical status. He might have resisted the "Error Theory" label because he didn't think the error mattered if the ethical system worked to organize society.
  *   **The "Young Prodigy" Factor:** Ramsey died at 26. His views were crystallizing rapidly. In the "Epilogue," he is channeling the prevailing atheistic naturalism of his circle. In other manuscripts, he shows more nuance about the utility of "truth" and "belief."

  ### Summary for the Physicist

  Think of Ramsey's position this way:
  He is proposing that **Ethics is not a fundamental force.**
  For centuries, philosophers treated "Good" as a fundamental constant of the universe (like $c$ or $G$), often anchored by a Creator. Ramsey, looking at the post-WWI landscape, concludes that the data doesn't support the existence of this force. The "field" (God/The Absolute) has been removed, so the "force" (Objective Good) must be an effective theory, not a fundamental one.

  It reduces to **thermodynamics of desire**: Ethics is just the study of how to maximize the utility (satisfaction) of the system (humanity) given limited resources and conflicting internal states (psychology).

  The reason the ending of the essay ("stars small as threepenny bits") resonates so much is that it confirms this shift. If there is no Objective Good "out there" in the universe, then value is strictly a local phenomenon, generated by conscious agents. The stars are big, but they are valueless. We are small, but we are the sole source of value. That is why he refuses to be humbled.

  You are right to sense a lack of rigorous derivation in that sentence. Ramsey is reporting the **consensus of his tribe** (the Apostles), not proving a theorem. But for a pragmatist, the consensus of the competent inquirers *is* often the closest thing to truth available.
