  2.  **Deconstruct the Passage & Historical Context:**
      *   **The Text:** "Epilogue" (1925), read to the Apostles.
      *   **The Context:** Post-WWI Cambridge, the decline of British Idealism, the rise of Analytic Philosophy (Russell, Wittgenstein, Moore). The Apostles were an elite, secretive discussion group known for intellectual honesty and often atheistic/agnostic leanings.
      *   **The Sentence:** "the objectivity of good was a thing we had settled and dismissed with the existence of God."
      *   **Interpretation:** This sounds like a *genealogical* or *dependency* claim. If Good is an objective feature of the universe (like a Platonic form or a Divine Command), it needs an ontological anchor. For the Victorians/Edwardians, that anchor was God. If God goes, the anchor goes.
      *   **Moore's Presence:** G.E. Moore's *Principia Ethica* (1903) explicitly argues for objective, non-natural properties *without* God. So why does Ramsey say "we... dismissed [it] with the existence of God"?
          *   *Hypothesis 1:* Ramsey is speaking for the "Apostles" specifically, not all philosophers. The Apostles were notoriously anti-religious and anti-metaphysical by the 1920s.
          *   *Hypothesis 2:* Ramsey is conflating "Objective Good" with "Absolute Ethics" (Idealism).
          *   *Hypothesis 3:* Ramsey is being rhetorical/breezy (as the user suspects).

  3.  **Address Question 1: Argument vs. Assertion:**
      *   Is it an argument? Not a formal one. It's a *diagnosis of a cultural shift*.
      *   Ramsey is observing that *for his circle* (the Apostles), the *motivation* for believing in objective good was tied to theology. Once theology was rejected (due to science, WWI disillusionment, etc.), the *will* to believe in objective good vanished.
      *   It's not a logical proof that $\neg God \rightarrow \neg Objective Good$. It's a psychological/sociological claim: "We used to believe in X because of Y. We stopped believing in Y. So we stopped believing in X."
      *   *Physicist Analogy:* It's like saying "We dismissed the ether along with absolute time." It's not a proof that the ether doesn't exist, but a statement that the theoretical framework requiring it has been abandoned.

  4.  **Address Question 2: "Absolute Ethics" & Moore:**
      *   Moore is the tricky part. Moore *did* believe in objective good without God.
      *   However, "Absolute Ethics" usually refers to the British Idealists (Bradley, Bosanquet) who saw ethics as part of a metaphysical whole (the Absolute).
      *   Ramsey likely groups Moore with the Idealists here, or perhaps sees Moore's "non-natural properties" as metaphysically spooky enough to be lumped in with theology.
      *   To the hard-nosed empiricists/logical atomists (Russell, early Wittgenstein, Ramsey), Moore's "non-natural properties" look suspiciously like theological entities. They are "queer" (to use Mackie's later term).
      *   So, "Absolute Ethics" targets the Idealists primarily, but Moore gets caught in the net because his "Good" is still a metaphysical absolute, even if not divine.

  5.  **Address Question 3: Metaethical Classification:**
      *   Ramsey's view in *Facts and Propositions* (1927) and *Truth and Probability* (1926) leans towards pragmatism and subjective probability.
