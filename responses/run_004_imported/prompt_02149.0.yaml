  7.  **Final Polish:** Organize with clear headings. Ensure the "Missing Pieces" section adds value beyond just summarizing. (e.g., mention the difference between *epistemic* and *practical* rationality).

  8.  *(Final thought before generating)*: Make sure to mention that this is literally a textbook case in philosophy. It validates their intelligence for stumbling onto it.

  **(Self-Correction during drafting):** Wait, I need to make sure I don't just say "Philosophers disagree." I need to take a stance on who has the *better* argument at each step, even if the overall debate is unresolved.
  *   Step 1 (Evidence): Kevin. Evidence is objective.
