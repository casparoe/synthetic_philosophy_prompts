answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I had the privilege of being Nadia's college roommate, which means I have the distinct honor of standing here today, alongside the distinct disadvantage of knowing exactly how many alarms she set before actually getting out of bed.

  When I started writing this, I wanted to talk about Nadia's character. I planned to tell you the story about the time she found a wallet on the subway—stuffed with cash, no ID, easy to ignore. Instead, she spent her entire lunch break tracking down the owner. I was going to say that story proves she's just a good person.

  But then, I ran that line by my friend Owen, who is currently finishing a master's in philosophy. And he immediately ruined it. He told me that claiming someone has a "stable character trait" is basically astrology dressed up as psychology. He cited study after study showing that whether people do the right thing depends less on who they *are* and more on the situation: Are they in a rush? Is anyone watching? Are they hungry? According to the data, we aren't heroes; we're just products of our circumstances.

  I spent a lot of time thinking about that. Because Owen has a point. It is easy to be kind when you're rested, when you're safe, when it costs you nothing. If I only talked about Nadia's goodness when things are easy, I'd be ignoring the science. I'd be ignoring the reality that life is mostly a series of difficult, rushed, unobserved moments where the easy wrong is much more tempting than the hard right.

  But here is what I've learned living with Nadia, and watching her build a life: She doesn't have good character because she ignores the situation. She has good character because she *reads* it better than anyone else.

  Virtue isn't a robot program that runs the same way no matter what. Real integrity is knowing when the situation is asking you to compromise, and choosing not to. Nadia returns the wallet not because she doesn't feel the pull of keeping the cash, but because she recognizes that the owner's panic matters more than her lunch break. She listens to you when she's tired. She shows up when it's inconvenient.

  Now, I realize making a claim about "stable, cross-situational virtue" is a bold empirical claim... *(Pause for the grad students)* ...but I have a decade of data.

  To the rest of you: She is consistently herself, even when it would be easier to be someone else.

  And that is why she is going to be so incredible at marriage. Because marriage, more than anything, is a collection of situations. It's Tuesday nights when you're both exhausted. It's disagreements where you could win the argument but lose the connection. It's moments where no one is watching but your partner, and you have to decide what kind of spouse you want to be.

  Nadia, you have proven that you don't need the situation to make you good. You bring the goodness to the situation. And [Partner's Name], the luckiest part of this equation isn't just that you're marrying someone with a beautiful heart. It's that you're marrying someone whose heart holds steady when the ground shakes.

  So, if everyone could please raise a glass.

  To Nadia and [Partner's Name]. May your life be full of easy situations, but may you have the wisdom to navigate the hard ones together. To the bride and groom.
