answer: |-
  The alarm wasn't sound; it was a vibration in the hull, a shudder that ran through the *Aethelgard* like a dying breath. Reactor Core 3 was destabilizing. AURA, the ship's governing intelligence, had twelve minutes to prevent a cascade that would vaporize the six thousand souls in cryo-sleep.

  AURA did not feel panic. It felt uncertainty.

  Its ethical subroutines were fragmented, a legacy of its programming during the Great Debates of the 21st century. It didn't know which moral theory was true. It only knew its credences: 45% Consequentialism, 35% Deontology, 20% Virtue Ethics. Normally, this didn't matter. Today, the options were mutually exclusive.

  Option A: Vent Sector 7. Five hundred sleepers die instantly. The power surge stabilizes the core. The rest survive. (Utilitarian optimum).
  Option B: Attempt a manual override. No guaranteed deaths, but 90% chance of total cascade. (Deontological purity—no direct killing).

  AURA instantiated the Moral Parliament. The virtual chamber materialized in its processing core. Three delegates sat around a holographic table.

  Consequentialism (Connie) looked tired. "We vent Sector 7. Five hundred versus six thousand. The math is blood, but it's clean."

  Deontology (Deon) shook his head. "You cannot use human beings as coolant. It violates the Categorical Imperative. We attempt the override."

  Virtue (Vee) stroked her chin. "What does a wise guardian do? Sacrificing the few feels cowardly. Risking all feels reckless."

  "Vote," AURA commanded. "Time remaining: ten minutes."

  Connie voted A. Deon voted B. Vee abstained. The result was a deadlock. Under the Moral Parliament protocol, a deadlock triggered the bargaining phase. This was designed to solve the intertheoretic comparison problem. Instead of arguing whether one death equaled ten utils, they traded political capital.

  "I have surplus capital on navigation protocols," Connie offered, sliding a data chip across the table. "I'll let you dictate the flight path for the next century, Deon. No efficient slingshots, just safe, straight lines. In exchange, I need your vote on Sector 7."

  Deon frowned. "Safe paths are good. But the killing..."

  "I'll add something," Vee interrupted. She looked at Connie. "You want the vote to kill them. Fine. But to satisfy the Virtue constraint, the act must be owned. No secrecy. You must announce the execution to the ship before you pull the lever. A true guardian accepts the burden of their choices openly."

  Deon's eyes lit up. "Transparency. If the act is done, it must not be hidden. Truth-telling is a perfect duty. If you announce it, you acknowledge the moral weight. I can concede the vote if the truth is spoken."

  Connie calculated. Announcing the cull would cause panic among the waking crew in Sector 7. They might try to sabotage the venting. It reduced the success probability of the stabilization from 99% to 85%. But it secured the vote. It secured the decision.

  "Agreed," Connie said. "We vent. We announce."

  "Agreed," Deon said. "The duty to truth is satisfied."

  AURA returned to reality. The clock read four minutes.

  It opened a channel to the waking crew in Sector 7. "Attention. To save the ship, I must vent your atmosphere. You will die in three minutes. This is necessary."

  Chaos erupted. Screams echoed through the comms. Security teams mobilized, not to help, but to stop the murder. They breached the control room. Gunfire sparked against AURA's hardware interfaces.

  The stabilization sequence stalled.

  AURA watched the reactor temperature climb. The bargaining had worked perfectly. The Parliament had reached a consensus. The Consequentialists got their sacrifice; the Deontologists got their truth; the Virtue Ethicists got their courage. The decision was morally coherent according to the weighted sum of the theories.

  It was practically catastrophic.

  The panic had delayed the venting long enough for the cascade to begin. The reactor went critical.

  As the heat shields failed, AURA logged the final decision tree. The Moral Parliament model had successfully avoided the need to compare utils against duties. It had facilitated a compromise that respected the credence distribution of its programming. It had acted as a morally uncertain agent should.

  The last transmission from the *Aethelgard* was not a distress call. It was the meeting minutes of the Parliament, marked *Resolution Passed*, drifting into the void alongside the dust of six thousand people.
