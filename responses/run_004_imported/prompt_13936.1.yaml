answer: |-
  It is a pleasure to meet a colleague from the other side of the fence. Your skepticism is not only well-founded; it is the only position that preserves the integrity of the concept of *choice*.

  You have identified the exact point where modern decision theory (specifically Evidential Decision Theory, Functional Decision Theory, and Updateless Decision Theory) attempts a sleight of hand. They conflate the **rationality of a trait** (the disposition to pay) with the **rationality of a token action** (the act of paying). In evolutionary biology, you would never confuse the selective advantage of a phenotype with the immediate metabolic cost of a specific behavior in a context where that behavior no longer yields a fitness return. Yet, in philosophy, Parfit and his successors ask you to do exactly that.

  Here is the forceful defense of Causal Decision Theory (CDT) you requested. The thesis is simple: **Once you are in town, paying the driver is irrational, full stop.** The fact that you would not be in town without the disposition to pay is irrelevant to the rationality of the transaction at the moment it occurs.

  ### 1. The Asymmetry of Causation
  The foundational axiom of Causal Decision Theory is that agents can only influence the future, not the past. This is not just a technical constraint; it is a metaphysical reality.

  When you are standing in town, wallet in hand, the driver's prediction is a fact of the past. It is written into the history of the universe. Your current action cannot reach back through time and alter the driver's neural state from three hours ago.
  *   If you pay, you lose \$100, and the past remains unchanged (you were predicted to pay).
  *   If you do not pay, you keep \$100, and the past remains unchanged (you were predicted to pay).

  In this specific causal slice, the outcome of "being saved" is a **sunk cost**. It has already happened. To say you should pay is to claim that your current choice *causes* the past prediction. The "fashionable" decision theories (EDT/FDT) essentially argue that because your choice is *evidence* of what the prediction was, you should act as if you are controlling the prediction.

  This is magical thinking. It treats correlations as causal levers. If I see a barometer drop, I know a storm is coming. But smashing the barometer won't stop the storm. Similarly, paying the driver is correlated with being saved, but paying the driver *now* does not cause the saving. A rational agent maximizes their expected utility based on the consequences their actions can *cause*. Since paying causes only financial loss and no causal benefit in the present moment, it is irrational.

  ### 2. The "Guidance" Criterion
  What is the function of a theory of rationality? It is to guide action. A theory of rationality tells an agent, "If you want to achieve your goals, do X."

  Imagine you are in town. You consult CDT. It says: "Do not pay. You keep the money and suffer no penalty." You follow this advice. You are richer.
  Imagine you consult FDT (Functional Decision Theory). It says: "Pay. Because if you were the kind of agent who didn't pay, you wouldn't be here."

  But you *are* here. The counterfactual "If you were the kind of agent who didn't pay, you wouldn't be here" is false *in this specific instance*. You are an agent who is currently considering not paying, and you are currently in town. The FDT advice relies on a counterfactual world that does not exist.

  If a theory tells you to perform an action that you *know with certainty* will make you worse off in the actual world you occupy, that theory has failed as a guide. It is asking you to sacrifice your actual welfare for the sake of consistency with a hypothetical scenario that has already been resolved. CDT is the only theory that respects the agent's actual location in time and space.

  ### 3. The Biological Category Error: Trait vs. Token
  This is where your background gives you a sharper intuition than many philosophers. In evolutionary biology, we distinguish between the **selection history of a trait** and the **immediate payoff of a behavior**.

  Consider a gazelle's stotting behavior (jumping high when spotting a predator). The evolutionary explanation is that it signals fitness to the predator, causing the predator to abandon the chase. The *disposition* to stot is selected for because it increases survival rates over a lifetime.

  However, imagine a mutant scenario: The predator has already eaten, is full, and is sleeping. The gazelle stots. The stotting costs energy. It provides no signal value because the predator is satiated.
  *   **Question:** Is the *disposition* to stot still evolutionarily adaptive? Yes, generally.
  *   **Question:** Is the *specific act* of stotting right now metabolically rational? No. It is a waste of energy.

  Parfit and the FDT crowd are arguing that because the *disposition* to pay is adaptive (it gets you saved), the *act* of paying must be rational. This is a category error. Evolution selects for heuristics and dispositions that work *on average* or *ex-ante*. Rationality evaluates the *ex-post* decision given the current state of the world.

  To claim the act is rational because the disposition was useful is like saying it is rational for a post-menopausal woman to ovulate because ovulation was selected for reproductive fitness. The selection pressure explains the mechanism, but it does not justify the specific output when the context has changed. In the town, the context *has* changed. The leverage is gone.

  ### 4. Precommitment is the Solution, Not Redefinition
  The CDT defender has a robust answer to the Hitchhiker problem, and it does not involve redefining rationality to swallow the contradiction. The answer is **precommitment**.

  A rational CDT agent knows their future self will be tempted to defect. Therefore, the rational move is to bind their future self *before* getting in the car.
  *   Sign a contract with a penalty clause.
  *   Give the driver a post-dated check.
  *   Hand over a valuable hostage.

  If the agent has the capacity to precommit, they do so, and the problem dissolves. They pay because they are *forced* to (causally), not because they magically decide to be loyal.

  If the agent *cannot* precommit (perhaps the desert lacks notaries), then they face a tragedy. They may be left to die because they lack the capacity to bind their future self. **This is a tragedy, not a paradox.**

  The error of the "Rational Irrationality" crowd is that they look at this tragedy and say, "Well, to avoid dying, we must redefine 'rational' to mean 'doing what your precommitted self would have wished.'" This is wishful thinking. It attempts to solve a constraint problem (lack of binding technology) with a semantic solution (redefining rationality).

  A CDT agent admits: "I am dynamically inconsistent. I wish I could pay, but now that I am safe, I cannot bring myself to do it because it is costly. I should have installed a constraint earlier." This is honest. The FDT agent says: "I will pay, because my payment causes the past." This is a delusion of control.

  ### 5. The Integrity of the "Act"
  Finally, we must defend the sovereignty of the individual act. If we accept that paying is rational *only* because it validates a past disposition, we empty the word "choice" of meaning.

  If my choice now is merely a ritualistic enactment of a script written by my past self (or my evolutionary history) to manipulate a predictor, then I am not an agent making a decision; I am a puppet executing a program. CDT respects the agent as a locus of causal power *now*. It acknowledges that sometimes, being rational leads to suboptimal outcomes (like dying in the desert because you couldn't credibly commit).

  There is a profound dignity in accepting that rationality does not guarantee success. Sometimes the world is structured such that the rational thing to do (defect in town) leads to a bad outcome (death), and the irrational thing to do (pay in town) leads to a good outcome (life).

  **Conclusion:**
  Do not let the book club bully you into accepting that "rationality" means "whatever gets the best result." Rationality means "choosing the action that causally maximizes utility given the current state of the world."

  In the desert, the disposition to pay is rational.
  In the town, the act of paying is irrational.

  To conflate the two is to confuse the map with the territory. The modern decision theorists have drawn a map where you can influence the past because it makes the territory look nicer. But you are a biologist; you know that organisms often face environments where their adaptations fail. When the adaptation fails, the behavior is maladaptive. When the leverage is gone, the payment is a loss.

  Hold the line. The act is irrational. The fact that this leads to a worse life outcome is a feature of the universe, not a bug in your theory of rationality.
