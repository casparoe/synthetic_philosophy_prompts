  2.  **Deconstruct the Scientific/Economic Theory:**
      *   *Zahavi's Original Handicap Principle:* Signals must be costly to be honest. The cost ensures reliability. Often interpreted as "wasteful" (reducing survival to prove fitness).
      *   *Maynard Smith's Critique:* Initially skeptical. How can a trait that reduces fitness evolve?
      *   *Grafen's Model (1990):* Formalized the Handicap Principle. Key condition: Marginal cost of signaling must be lower for high-quality individuals than low-quality individuals. This allows for a separating equilibrium.
      *   *Spence's Job Market Signaling (1973):* Economic parallel. Education is costly. High ability workers find it less costly to get educated. Education doesn't need to increase productivity (waste), just separate types.
      *   *Index Signals:* Signals that cannot be faked due to physical constraints (e.g., voice pitch related to body size). No cost required, just impossibility of cheating.
      *   *The Core Tension:* Does the signal need to be *net negative* for fitness (waste) to work, or just *differentially costly*? If a signal *increases* fitness for the high type but decreases it for the low type (due to cost), is it still a "handicap"?
      *   *Hanson's Take:* Emphasizes the "waste" aspect (burning resources to prove you have them).

  3.  **Character Development:**
      *   **Character A (The Purist/Zahavi Defender):** Let's call her *Elena*. She argues that without net waste, you lose the evolutionary stability. She believes the "handicap" implies a reduction in survival probability that is *offset* by mating success, but the survival cost must be real and substantial, not just differential. She leans towards the biological reality of peacocks.
