  7.  **Final Polish:** Check the voice. Ensure they sound like academics (precise, referencing specific models, but conversational). Ensure the pacing allows for back-and-forth rather than monologues. (Self-Correction: Make sure they interrupt each other or challenge specific phrases to keep the energy up.)

