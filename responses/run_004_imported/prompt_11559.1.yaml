prompt: |-
  ok so I've been down a computational social choice rabbit hole again (one of those rationalist-blogosphere brainworms that never really goes away) and I'm prepping questions for an interview on my little podcast. The guest is a computational social choice theorist whose whole public shtick is rescuing real voting rules from Gibbard-Satterthwaite by pointing at complexity results -- her go-to line is basically 'manipulation you can't compute is manipulation that doesn't happen,' e.g. STV is manipulable in principle but actually finding the manipulation is NP-hard so in practice we're fine. Write me 8-10 interview questions that make that line progressively harder for her to lean on. I want at least one question on the worst-case vs average-case gap (a bunch of these NP-hard manipulation problems turn out to be easy 'almost always' once you swap an adversarial ballot distribution for a realistic one), one on whether 'hard to compute' was ever really an answer to a theorem stated purely in terms of existence rather than computability, and one on whether her complexity shield should also cover strategic candidate entry and agenda control and not just strategic voting -- if not, why not. End on a question about what happens to her whole defense once cheap solvers (or an LLM) make that 'hard' computation free for every voter at the ballot box. For each question, add a quick follow-up keyed to whatever dodge she's most likely reach for.
