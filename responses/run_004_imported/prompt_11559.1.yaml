answer: |-
  Here are 9 interview questions designed to progressively tighten the screws on the "complexity shield" argument, including the specific thematic requirements you asked for.

  ### 1. The Core Thesis
  "Let's start with your elevator pitch. The Gibbard-Satterthwaite theorem tells us that every non-dictatorial voting rule is manipulable. Your counter-argument, following Bartholdi, Tovey, and Trick, is essentially that 'manipulation you can't compute is manipulation that doesn't happen.' If I'm a policymaker choosing a voting system today, is computational hardness a feature of the system, like proportionality, or is it a bug we're just hoping nobody fixes?"

  *   **Likely Dodge:** She will argue that *bounded rationality* is a realistic constraint, not a bug, and that social choice theory should model agents as they are, not as omniscient oracles.
  *   **Follow-up:** "If we accept bounded rationality as a constraint, doesn't that cut both ways? If voters are too computationally limited to find the strategic vote, are they also too limited to understand the *rules* well enough to vote sincerely according to their true preferences? At what point does 'bounded rationality' just become 'random noise'?"

  ### 2. Existence vs. Computation
  "Gibbard-Satterthwaite is an *existence* theorem. It proves a vulnerability exists in the logic of the system. You're offering a *computational* defense. Isn't there a category error here? If I sell you a safe that is theoretically pickable, but I tell you 'don't worry, the tools required are very expensive,' have I actually fixed the safe, or have you just changed the definition of 'secure' to mean 'secure against current budget constraints'?"

  *   **Likely Dodge:** She will lean on the cryptography analogy: "We rely on RSA encryption even though it's theoretically breakable; we rely on the computational cost."
  *   **Follow-up:** "In cryptography, the keys are secret and the algorithm is public. In voting, the 'key' is the profile of other voters' preferences, which is often partially public via polling. If the hardness relies on not knowing the input rather than the algorithm itself, isn't that security through obscurity, not computational complexity?"

  ### 3. Worst-Case vs. Average-Case
  "NP-hardness is a worst-case guarantee. It says there *exists* a profile where finding the manipulation is hard. But a bunch of literature—Xia, Conitzer, others—suggests that under 'smoothed analysis' or realistic distributions like Impartial Culture, these manipulation problems become easy 'almost always.' If 99% of real-world elections fall into the 'easy' bucket, does the NP-hard worst-case actually provide any shield, or is it just a mathematical technicality?"

  *   **Likely Dodge:** She will argue that "Real elections aren't Impartial Culture; they are correlated and structured, which preserves the hardness."
  *   **Follow-up:** "Do we have empirical data on the distribution of preferences in real elections that confirms they hit the NP-hard islands? Or are we assuming the hardness holds because we haven't found the average-case algorithm yet? If the shield relies on a specific distribution of preferences, shouldn't we be testing that distribution, not the complexity class?"

  ### 4. Approximate Manipulation
  "Your defense usually rests on the difficulty of finding the *optimal* strategic vote. But a voter doesn't need the optimal lie to game the system; they just need a lie that's *better* than the truth. If I can easily find a manipulation that gives me 90% of the possible utility gain, even if finding the 100% gain is NP-hard, hasn't the Gibbard-Satterthwaite vulnerability effectively manifested?"

  *   **Likely Dodge:** She will claim that "Without the optimal manipulation, the incentive isn't guaranteed, and risk-averse voters won't gamble on a heuristic."
  *   **Follow-up:** "But political parties aren't risk-averse individual voters; they are repeat players. If a party can run a heuristic that succeeds 80% of the time, they will use it. Does your defense only work for isolated individuals, and collapse as soon as organized groups enter the room?"

  ### 5. Information Costs
  "To compute a manipulation, I need to know how everyone else is voting. In many complexity proofs, we assume the manipulator has full knowledge of the profile. But in reality, obtaining that data is costly and noisy. Isn't the *information gap* doing all the heavy lifting here, rather than the *computation gap*? If I give you a supercomputer but no polling data, you can't manipulate. If I give you perfect polling data but a pocket calculator, maybe you can. Which barrier is actually protecting us?"

  *   **Likely Dodge:** She will argue that "Polling is ubiquitous now; we must assume agents have good estimates of the profile."
  *   **Follow-up:** "If polling is ubiquitous, then the information barrier is gone. That leaves only the computation barrier. But if the computation is only hard in the worst-case (as we discussed), and the data is easy to get, aren't we left with a shield that is rapidly eroding?"

  ### 6. Coalitional vs. Individual
  "Most complexity results focus on a single agent manipulating. But politics is coalitional. If a bloc of voters coordinates, the search space changes, and they can pool their computational resources. Does the 'complexity shield' hold up against coalitional manipulation, or does the NP-hardness vanish when you move from 'single voter' to 'organized party'?"

  *   **Likely Dodge:** She will note that "Coalitional manipulation is often *harder* computationally (e.g., weighted voting)."
  *   **Follow-up:** "It might be harder in theory, but parties have budgets. They can hire theorists like you to solve the specific instance. If the defense relies on the attacker being too lazy to run an algorithm, what happens when the attacker has a dedicated IT department?"

  ### 7. Alternative Strategic Vectors
  "Let's zoom out. Even if ballot manipulation is NP-hard, that's only one way to game a system. What about strategic candidate entry (cloning), agenda control, or manipulating the districting? Are those problems also NP-hard? If I can't compute the best *vote*, but I can easily compute the best *candidate to recruit* to split the opposition, doesn't the complexity shield leave the back door wide open?"

  *   **Likely Dodge:** She will say "Those are different models; my work focuses specifically on the voting rule mechanism."
  *   **Follow-up:** "But the voter experiences the outcome, not the mechanism. If the system is vulnerable to strategic entry even if it's resistant to strategic voting, is the system actually 'safe'? Why should we trust a shield that only covers one vector of attack in a multi-vector war?"

  ### 8. Heuristics in Practice
  "In computer science, when we face an NP-hard problem, we don't give up; we build heuristics, SAT solvers, or approximation algorithms that work incredibly well on real-world instances. We know STV manipulation is NP-hard, but we also know SAT solvers crush 'hard' instances daily. Have we actually tested modern solvers against real election sizes? Or are we relying on a complexity classification from the 1980s that might not reflect modern solving capabilities?"

  *   **Likely Dodge:** She will argue that "Election sizes and constraints are specific enough that general solvers don't apply well."
  *   **Follow-up:** "Given the rate of improvement in constraint solvers over the last decade, isn't betting on the permanence of this hardness a risky long-term strategy for constitutional design? Are we designing for today's computers or next century's?"

  ### 9. The "Bounded Rationality" Consistency
  "I want to press on the normative implication. If your defense is that voters are computationally bounded, you're essentially arguing that the system is robust *because* voters are imperfect. But if voters are imperfect, does Gibbard-Satterthwaite even matter? The theorem assumes rational agents. If agents aren't rational enough to manipulate, aren't they also not rational enough to trigger the other negative outcomes GS warns us about? Can you have it both ways?"

  *   **Likely Dodge:** She will say "We need the system to be robust even if some agents are sophisticated."
  *   **Follow-up:** "So the system is designed for the sophisticated agents, but protected by the incompetence of the unsophisticated ones? That sounds like a system that incentivizes an arms race in voter sophistication. Is that a stable equilibrium for a democracy?"

  ### 10. The AI Endgame
  "Finally, the landscape is shifting. We are moving toward an era where every voter might have a personal AI agent on their phone. If an LLM or a cheap solver can make that 'hard' computation free and instantaneous at the ballot box, does your whole defense evaporate? If the cost of manipulation drops to zero, are we just left with the raw Gibbard-Satterthwaite conclusion that the system is fundamentally broken?"

  *   **Likely Dodge:** She will suggest "Privacy preserving voting prevents the AI from knowing the necessary data to compute the strategy."
  *   **Follow-up:** "But if the AI is *my* personal agent, I can tell it my preferences, and it can scrape public polling for the rest. It doesn't need to break voting privacy, it just needs to model the public. If the compute barrier vanishes, do we need to stop telling policymakers that complexity saves us, and admit we need a rule that is strategy-proof by design, not just by difficulty?"
