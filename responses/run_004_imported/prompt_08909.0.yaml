  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend developer, technically literate (understands Bayes' rule, probabilities, likelihood ratios), not a philosopher but interested in the epistemological implications.
      *   **Context:** Debate with a coworker about priors in fraud detection led to Bayesian epistemology and the "Problem of Old Evidence" (POE).
      *   **Core Question:** Why is POE a *deep* problem and not just a misunderstanding? Walk through a serious fix (specifically mentioning Garber/Jeffrey/logical omniscience). Give an honest take on whether the fix works or just moves the problem.
