prompt: |-
  I'm a backend dev, not a philosopher, but a coworker and I got into a whole debate on Slack about how we pick priors for a fraud-detection model, and that somehow sent me down a rabbit hole into Bayesian epistemology. I ran into this thing called the "problem of old evidence" and its been bugging me since. As I understand the setup: if E is something you're already 100% sure of (P(E) = 1), Bayes' rule says a theory H that entails E can't get any confirmation boost from E, because the likelihood ratio just collapses to 1. But then how do you explain something like Mercury's perihelion precession -- a fact known for decades before Einstein -- being treated as one of the strongest pieces of evidence for general relativity ever? That sure looks like old evidence confirming a theory, which the math says shouldnt be possible.

  Can you explain why this is actually a deep problem for Bayesianism and not just me misreading the setup, then walk me through one serious fix people have proposed (I think Garber and Jeffrey have something about logical omniscience?) and give me your honest take on whether it actually resolves the tension or just relocates it somewhere else. Skip the 101-level "here's what Bayes theorem is" part, I've already got that.
