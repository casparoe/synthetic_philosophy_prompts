          *   DDE Analysis:
              1.  Act: Bombing military target (OK).
              2.  Intention: Destroy node (OK).
              3.  Means: Deaths are not the means to destroying the node (the blast does that). Deaths are side effect of the blast magnitude needed. (OK).
              4.  Proportionality: Node value > Civilian lives (Assume yes for the sake of the thought experiment).
