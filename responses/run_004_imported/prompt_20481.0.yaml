          *   *Anscombe's Verdict:* She would focus on the *description of the act*. The agent is choosing to "Collapse a building known to be occupied." She argues that you cannot separate the collapse from the deaths in the intention. If you will the collapse, and the collapse *is* the death of the occupants, you will the death. The description "Collapsing the building" *entails* "Killing the occupants." Therefore, it is intentional killing.
          *   *Why this works:* It highlights the difference between *causal means* (DDE) and *action description/entailment* (Anscombe). DDE asks: "Did the deaths cause the victory?" (No). Anscombe asks: "Is 'killing them' a true description of what you are doing?" (Yes).

