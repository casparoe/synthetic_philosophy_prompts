answer: |-
  Here is a case study designed to drive a wedge between the standard Doctrine of Double Effect (DDE) and Elizabeth Anscombe's action-theoretic framework. It avoids the overused Terror/Strategic Bomber dichotomy and the Hiroshima debate, while preserving the structural tension you want your students to grapple with.

  ### The Case: The "Integrated Command Tenement"

  **The Scenario:**
  During a conventional conflict, Intelligence confirms that a high-value enemy Communications Node (HCN) is hardwired into the foundation of a specific residential tenement block in a contested city. The HCN is not merely *located* in the building; its cooling and power systems are structurally integrated into the building's load-bearing columns.

  **The Decision:**
  A coalition planner authorizes an airstrike using a specialized earth-penetrating munition.
  *   **Military Objective:** Destroy the HCN to blind enemy artillery.
  *   **Weapon Effect:** The munition must detonate at the foundation level. Due to the structural integration, detonation will inevitably cause the total progressive collapse of the entire tenement block.
  *   **Civilian Status:** The tenement is occupied by 50 non-combatant families. They are not being used as "human shields" by the enemy (they are unaware of the HCN); they are simply residents.
  *   **Knowledge:** The planner knows with near-certainty that the collapse will kill all 50 residents.
  *   **Causal Chain:** The HCN is destroyed by the blast pressure and heat at the foundation. The residents die because the building falls on them. The deaths of the residents do *not* contribute to the destruction of the HCN (the HCN would be destroyed even if the residents magically vanished). The deaths do not contribute to the blinding of the artillery (that is achieved solely by the HCN's destruction).

  ---

  ### 1. The Standard DDE Verdict: **Permissible**

  Under the standard four conditions of the Doctrine of Double Effect, this action clears the bar. Here is the breakdown your students should recognize:

  1.  **Nature of the Act:** The act itself (bombing a military communications node) is morally neutral or good. It is not intrinsically evil like targeting civilians for terror.
  2.  **Intention (End/Means):** The agent intends only the good effect (destroying the HCN). The deaths of the residents are not the *end* (the goal is not to kill them) nor the *means* (their deaths do not cause the HCN to break; the blast does).
  3.  **Distinction:** The bad effect (death) is distinct from the good effect (HCN destruction). The causal chain runs: *Bomb -> Blast -> HCN Destroyed.* A separate chain runs: *Bomb -> Collapse -> Residents Die.* The second chain is not instrumental to the first.
  4.  **Proportionality:** The military advantage of blinding enemy artillery is deemed proportionate to the loss of 50 civilian lives (assuming, for the sake of the case, the artillery is shelling a friendly city).

  **Why DDE clears it:** DDE relies on a **teleological distinction**. It asks: *What role does the death play in the plan?* Since the death is neither the goal nor the tool, it is categorized as a "foreseen side effect" (*praeter intentionem*). The planner can sincerely say, "I chose to destroy the node; the deaths were an unfortunate consequence I did not choose."

  ---

  ### 2. The Anscombe Verdict: **Impermissible (Intentional Killing)**

  Elizabeth Anscombe, applying the machinery from *Intention* and her critique in "Mr. Truman's Degree," would convict the planner of intentionally killing the innocent. She rejects the DDE's reliance on the agent's psychological state or the "means vs. side effect" causal map.

  **Why Anscombe convicts:**
  Anscombe argues that intention is not a hidden mental feeling; it is determined by the **description under which the action is voluntary**.

  1.  **Practical Knowledge:** The planner has "practical knowledge" of what they are doing. If you ask the planner, "Why are you dropping that bomb?" they say, "To destroy the HCN." But if you ask, "What are you doing?" another true description is: "I am collapsing a residential building occupied by 50 people."
  2.  **Inseparability of Description:** Anscombe argues that you cannot separate "Destroying the foundation of this building" from "Killing the people inside it" when the agent *knows* the two are ontologically linked in the event. To will the collapse *just is* to will the death of the occupants under the description "killing the occupants."
  3.  **The "Stopping" Test:** In *Intention*, Anscombe offers a test: If the residents somehow survived the collapse (e.g., they escaped), would the planner say, "Oh no, my plan failed"? No. But, if the planner *needed* the building to collapse to get the node, and the building *didn't* collapse, they would say the plan failed. Since the "killing" is inherent to the "collapsing" in this specific context, and the agent voluntarily chooses the collapsing, they voluntarily choose the killing.
  4.  **Rejection of "Side Effect":** Anscombe argues that calling the deaths a "side effect" is a linguistic evasion when the agent knows the action *is* lethal to them. In "Mr. Truman's Degree," she argues Truman intended to kill the citizens of Hiroshima because he chose an action *described* as "killing citizens to end the war," regardless of whether he called it "destroying a military target." Similarly, here, the planner chooses to act under the description: "Crushing these people to get the radio."

  **The Gap:**
  *   **DDE** looks at the **causal role** of the death. (Did the death help win? No. -> Unintended).
  *   **Anscombe** looks at the **action description**. (Is "killing them" a true description of what you are doing? Yes. -> Intended).

  ---

  ### 3. Grading Key: What to Look For

  When reading your students' papers on this case, here is how you can distinguish a superficial understanding from a grasp of the philosophical gap:

  **The "DDE Only" Student (Surface Level):**
  *   They will argue the case is permissible because the pilot "didn't want" the civilians to die.
  *   They will focus heavily on the *causal chain* (the blast killed the radio, the rubble killed the people).
  *   They will treat "Intention" as a psychological state of mind (regret, reluctance).
  *   *Verdict:* They miss Anscombe entirely.

  **The "Anscombe" Student (Deep Level):**
  *   They will identify that the planner acts with **knowledge** of the deaths.
  *   They will argue that for Anscombe, **voluntary action + knowledge = intention**, regardless of the "means/end" structure.
  *   They will highlight that the description "Collapsing an occupied building" entails "Killing the occupants," and the planner voluntarily chose that description.
  *   They will note that Anscombe rejects the DDE's ability to "describe away" the bad effect. The planner cannot say "I intended to collapse the building but not kill the people" because, in reality, collapsing *is* killing in this context.
  *   *Crucial Nuance:* They should recognize that Anscombe isn't necessarily saying the act is *always* wrong (she allows for self-defense), but that it cannot be classified as *unintended* killing. It is intentional killing, which requires a much higher justificatory bar (if it is permissible at all), effectively collapsing the DDE loophole.

  ### Why this works for your seminar
  This case forces students to stop treating DDE as a "magic spell" where saying "I didn't mean it" makes the bodies disappear. It forces them to confront Anscombe's claim that **moral responsibility attaches to what we knowingly do, not just what we hope happens.** The "Integrated Command Tenement" makes the physical inseparability of the target and the innocents clear, making Anscombe's claim that the *action description* includes the killing much harder to dismiss than in the abstract Strategic Bomber case.
