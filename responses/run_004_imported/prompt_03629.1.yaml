answer: |-
  **Setting:** *A cluttered kitchen table, 1:00 AM. Two empty coffee mugs, a whiteboard covered in erased diagrams, and a lingering tension between friends who respect each other too much to let a bad argument die.*

  **Characters:**
  *   **Elena:** Pro-Hohwy (Internalist). Believes the Markov blanket defines the cognitive boundary.
  *   **Marcus:** Pro-Clark (Extended Mind). Believes the Markov blanket is compatible with cognitive extension.

  ***

  **Elena:** Look, I know you want the world to be part of the mind. It's romantic. But you're treating the Markov blanket like it's a suggestion. It's not. It's a mathematical necessity for a self-organizing system to exist at all. If you don't have internal states that are conditionally independent of external states, given the sensory and active states, you don't have a system. You just have heat death. The blanket *is* the boundary.

  **Marcus:** I'm not saying the blanket doesn't exist. I'm saying you're conflating the *organism's* boundary with the *mind's* boundary. The Free Energy Principle tells us how a bacterium stays alive. It has a membrane—a Markov blanket. But we don't say the bacterium's "mind" stops at the membrane. We say it doesn't have a mind. So, the existence of a blanket proves there's a *thing* there, but it doesn't prove that the *cognitive work* is confined to the stuff inside the blanket.

  **Elena:** That's a category error. In Predictive Processing, the "mind" just *is* the inference engine minimizing variational free energy. And inference requires seclusion. The brain cannot see the world. It is locked in the dark. It only has access to its own sensory states. Therefore, the hypothesis generation—the actual "thinking"—has to happen where the model is. That's inside the blanket. If you put part of the mind outside, you're saying the inference is happening in the world. But the world doesn't infer. The world just *is*.

  **Marcus:** Okay, but that's the Hohwy move I'm pushing back on. You're defining "inference" as "neural model updating." That's begging the question. If I use a notebook to store a phone number, and I treat that notebook as a reliable resource to minimize surprise in my social interactions, the *loop* of prediction and error correction includes the notebook. When I reach for the book, that's an active state. When I read it, that's a sensory state. The notebook is functionally coupled. Why does the math care if the substrate is carbon or silicon?

  **Elena:** Because the math cares about *conditional independence*. Here is my direct answer to your notebook example: The notebook is part of the *external* states in the Markov blanket structure. When you look at it, you are sampling sensory data *about* the notebook. You are inferring the state of the notebook. If the notebook were part of your internal states, you wouldn't need to sample it. You would just *know* it, like you (supposedly) know your own beliefs. The fact that you have to look at it proves it's outside the inferential boundary. It's an object of perception, not a subject of inference.

  **Marcus:** That's a great objection, but it fails on the timescale of integration. You're assuming "internal" means "instant access." But neural access isn't instant either. There's latency in the optic nerve. There's latency in retrieval from the hippocampus. If the notebook is reliably coupled—if it's always there, trusted, and automatically accessed—the latency difference is negligible.
  But let me hit your stronger point: Conditional Independence. You say the blanket makes internal states independent of external states. But under the Free Energy Principle, the whole point of *action* is to change external states to match internal predictions. If I move my hand to grab a cup, my internal state (prediction) causes an external change (cup in hand). That's a causal loop. If the mind is strictly inside, how do you explain the *control* without admitting the controller extends into the effector?

  **Elena:** You're confusing causal influence with ontological location. I can control a drone with a joystick. My causal influence extends to the drone. But my *mind* isn't in the drone. The drone is the target of my active sampling.
  Here is where I think you're dodging the bullet: If the mind is extended, where is the error signal computed? The prediction error is the difference between the top-down prediction and the bottom-up sensory input. That subtraction happens *at the blanket*. The sensory surface. That surface is biological. It's the retina, the skin. The notebook doesn't send prediction errors to your brain; it sends light photons. Your brain constructs the error. The computation of "surprise" is biologically localized. Therefore, the mind is biologically localized.

  **Marcus:** Okay, now we're getting somewhere. You're saying the *locus of computation* is the skull because that's where the error signal is registered. But Clark's argument is that the *solution* to the error doesn't have to be neural.
  Think about it: If I'm doing long division in my head, I burn glucose and generate neural error signals. If I do it on paper, I offload the computational state to the paper. The paper holds the "carry the one" state. If I didn't have the paper, my brain would have to model that state internally, increasing metabolic cost and error risk.
  So, to answer your "locus of computation" point: The brain is the *engine*, sure. But the vehicle includes the wheels. If you define the car as just the engine because that's where the combustion happens, you can't explain how the car moves. The FEP is about keeping the system within viable bounds. If offloading to the environment keeps the system within viable bounds better than internal processing, then the cognitive system *is* the coupled system.

  **Elena:** I see what you're doing. You're making a pragmatic argument. "It's useful to treat the notebook as part of the mind." But Hohwy's claim is ontological. It's not about what's useful; it's about what's *true* given the generative model.
  The generative model is a probability distribution over causes. The causes are hidden. The only thing that isn't hidden is the sensory state. Since the notebook is hidden from the brain (it has to be sensed to be known), it is, by definition, a hidden cause *outside* the modeler.
  If you say the mind extends, you have to say the model extends. But the model is a distribution of probabilities. Can a notebook hold a probability distribution? No. It holds ink. The brain holds the distribution. The notebook is just another causal factor in the world that the brain is trying to predict.

  **Marcus:** That's the "inferential seclusion" card again. You're saying because the brain is secluded, the mind is secluded. But seclusion is a feature of the *interface*, not the *system*.
  Let's turn your own weapon on you. You say the Markov blanket is a mathematical fact. Fine. But a Markov blanket can be drawn around *any* set of variables. I can draw a blanket around my brain. I can draw a blanket around my brain-plus-notebook.
  If the FEP is universal, then *any* coupled system that minimizes free energy has a Markov blanket. If my brain and the notebook, together, form a system that minimizes surprise more effectively than my brain alone, then *that coupled system* generates its own Markov blanket. The boundary shifts. The skin is not sacred. It's just a high-friction zone for energy exchange.

  **Elena:** *Pauses, tapping her pen.* Okay. That's the best objection. You're saying the blanket is scale-relative. If the coupling is tight enough, the notebook becomes an internal state of a larger system.
  But here is the cost of that move: If you allow the blanket to stretch to include the notebook, you lose the explanation of *perception*.
  Perception is the brain's best guess of the causes of sensory input. If the notebook is *inside* the blanket, you aren't perceiving it anymore. You are *being* it. That dissolves the subject-object distinction required for perception.
  Hohwy's point is that we need a fixed boundary to explain why we experience a world *at all*. If the mind bleeds into the world, there is no "world" left to perceive. You just have a giant, amorphous self-minimizing blob. The skull isn't a wall; it's the condition for having a perspective.

  **Marcus:** And there it is. You think we need a fixed boundary to save the phenomenon of "perspective." I think you need a fixed boundary to save the phenomenon of "individualism."
  If the mind bleeds into the world, we don't lose the world. We just acknowledge that the "world" we interact with is already shaped by our cognitive history.
  But let's answer your "modeling choice" challenge directly. You asked earlier if the blanket is a fact or a choice.
  My answer: It's a fact about causal structure, but it's a choice about *cognitive attribution*.
  The FEP tells us where the energy exchange stops. It doesn't tell us where the *thinking* stops. You're deriving an "ought" (the mind *ought* to be skull-bound) from an "is" (the blanket *is* at the skin). That's the naturalistic fallacy.

  **Elena:** And my answer to that is: In Predictive Processing, the "thinking" *is* the energy exchange management. There is no ghost in the machine to have a "choice" about attribution. If the inference is the mind, and the inference is bounded by the blanket, then the mind is bounded by the blanket.
  If you say it's a modeling choice, you're admitting that "Extended Mind" isn't a discovery about nature. It's just a metaphor. You're saying, "Let's pretend the notebook is part of the mind because it's handy."
  I'm saying, "No, the notebook is physically distinct because it is statistically conditionally independent."
  If you can't show me the prediction error flowing *through* the notebook without being transduced by sensory states, then the notebook is external. And if it's external, it's not the mind. It's a tool.

  **Marcus:** So we're back to the definition of "tool."
  If I use a cane to feel the ground, the sensory data comes from my hand, but the *perception* is at the tip of the cane. I don't feel vibrations in my palm; I feel the texture of the sidewalk. The perceptual model has already incorporated the cane as a rigid extension of the arm.
  The prediction error *is* minimized at the tip of the cane, functionally speaking. The brain models the cane as "self."
  So, is the blanket at the skin? Or is the blanket at the tip of the cane?
  If the brain models the cane as "self," then the internal states *include* the dynamics of the cane. The blanket effectively shifts.
  You say the blanket is a fact. I say the blanket's *location* is a dynamic variable of the model itself.

  **Elena:** *Leans back, exhaling.* The location of the blanket is a dynamic variable...
  That's dangerous. If the blanket moves, then the "self" is fluid.
  But fine. Let's grant that the *body schema* extends. I'll concede the cane. It's biologically coupled, proprioceptively mapped.
  But the notebook? The phone? The internet?
  If you say the blanket stretches to the cloud, then when the Wi-Fi goes down, does part of your mind die? Does your free energy spike because your internal states were severed?

  **Marcus:** Yes. Exactly. When I lose my phone, I experience a literal cognitive deficit. My capacity to minimize surprise in navigation, communication, and memory retrieval drops. I become a less effective inference machine.
  If the mind is the system that minimizes free energy, and I am less capable of minimizing free energy without the phone, then the phone was part of the mind.
  You want to say the mind is the thing that *notices* the deficit. I'm saying the mind is the thing that *suffers* the deficit.

  **Elena:** *Smiles slightly.* Okay. I can't budge you on the functional suffering. But I will hold the line on the statistical boundary.
  The phone is an external cause of your surprise. Losing it changes your priors. But the *inference* that "I am lost" still happens in the head. The phone didn't infer it was lost. You did.
  So, the *agency* remains skull-bound, even if the *resources* are extended.
  Maybe that's the compromise. The *vehicle* of cognition extends. The *seat of inference* does not.

  **Marcus:** I can live with that. For now. But don't be surprised if the next model shows the inference is distributed too.
  *He reaches for the coffee pot. It's empty.*
  Great. Now I have to minimize my own caffeine-deprivation error.

  **Elena:** *Stands up.* I'll make it. You handle the beans.
  *She walks to the counter.*
  But seriously, Marcus? The blanket stays at the skin.

  **Marcus:** *Grinning.* The functional loop goes to the grinder, Elena.

  **Elena:** We'll see whose free energy spikes first when the water boils.
