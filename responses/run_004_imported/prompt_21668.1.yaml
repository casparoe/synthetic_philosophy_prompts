answer: |-
  The diagnosis was called Narrative-Dependent Affect. Dr. Aris explained it without looking up from his tablet, the blue light washing over his glasses. He said it wasn't that Elias lacked emotion, but that the emotion arrived out of sequence. Most people felt grief, then wept. Elias wept only after he had constructed a sentence about the grief. The feeling was locked behind the grammar.

  "It's a processing lag," Aris said, finally meeting his eyes. "You don't experience the interior state until you've externalized the description of it. Once you name the shape of it, the feeling fills the mold."

  Elias left the office feeling strangely light, though he knew he was supposed to feel relieved or perhaps burdened. He walked to the bus stop and watched the rain hit the pavement. *The rain is hitting the pavement,* he thought. Nothing. *The rain is attacking the concrete like tiny hammers.* A tightness seized his chest, a sudden, sharp sorrow that made his throat close. He stood there for ten minutes, repeating the sentence about the hammers, breathing through the ache of it, until the bus arrived and the moment passed.

  At home, he bought a digital recorder. He began to narrate his mornings. *I am pouring the coffee. The steam rises like a ghost.* He felt the warmth of nostalgia. *I am tying my shoes. The laces are dead snakes.* He felt a prick of fear. He walked through his life like a tour guide in his own museum, speaking constantly to ensure the exhibits were real. Without the commentary, the world was flat, a silent film projected on a gray wall. With the words, the colors bled in.

  He found a support group in the basement of a community center. Twelve chairs in a circle. They didn't share stories in the traditional sense; they narrated the act of sharing.

  "I am sitting in this chair," a woman named Sarah said, her hands trembling. "The wood is cold against my thighs. I am afraid you will judge me." She paused, waiting. Her shoulders dropped. The fear had arrived. She exhaled.

  "I am looking at Sarah," Elias offered during his turn. "I feel connected to her struggle." The connection bloomed in his chest, warm and golden. He realized then that they were all building each other up, a scaffolding of syntax holding up their emotional lives. If someone stopped speaking, they drifted away, becoming ghostly and thin. They talked over each other, a chorus of present-tense construction, desperate to feel the floor beneath their feet.

  Six months later, Elias returned to Dr. Aris. The office was the same, but the pamphlet on the desk had changed. The title was different: *Revised Criteria for Narrative-Dependent Affect.*

  Aris looked tired. He tapped the tablet, swiping away a previous version. "We've had to update the diagnostic manual," he said. "There's been a complication."

  Elias shifted in his chair. The recorder in his bag felt heavy. "Complication?"

  "We noticed a trend," Aris said, clasping his hands. "Patients were getting better at the narration. Too good. You all started crafting metaphors. You started writing scripts before you entered the room. The emotion was following the script, yes, but it wasn't... authentic. It was performative."

  Elias thought of Sarah. She had come to the last meeting with a notebook. She had read a paragraph about the cold wood, polished and edited. She had cried on cue. Elias had felt nothing when she spoke, because he knew she had written it yesterday. The lag had vanished. The cause and effect had collapsed.

  "So," Elias said. "What does that mean for me?"

  "It means we're narrowing the definition," Aris said. "We're introducing a distinction. Type One is Spontaneous Narrative Affect. That's what you originally had. Type Two is Constructed Narrative Affect. We're finding that Type Two doesn't sustain the emotional regulation. The feeling fades faster. Sometimes it doesn't come at all."

  Aris slid a new form across the desk. "We need to reassess your baseline. We need to see if you can still feel without the preparation. Without the poetry."

  Elias looked at the form. It asked him to describe his current state without using metaphors. Just facts. *I am sitting. I am breathing.*

  He tried it. *I am sitting in this chair.* He waited. The room was silent. The dust motes danced in the light from the window. He waited for the tightness, the warmth, the sorrow, the relief. Nothing came. The world remained flat, gray, and silent.

  "We're seeing a lot of patients who have learned to game the system," Aris said, his voice drifting into the background. "They speak, but they don't feel. They've become hollow speakers. We have to adjust the category to exclude them, or the diagnosis loses its utility."

  Elias opened his mouth to speak, to tell the doctor that he was afraid, that he felt the floor dropping out, that the silence was loud. But he stopped. He knew that if he crafted the sentence perfectly, it would be flagged as Constructed. If he stammered, it might count as Spontaneous. He sat there, analyzing his own syntax, watching himself watch himself.

  He wanted to feel the fear, but the act of monitoring the fear for clinical validity had blocked the path. The label had saved him, then changed around him, and now it was closing the door he had walked through. He sat in the quiet office, mouth slightly open, waiting for a feeling that required a words he was no longer allowed to say.
