      *Re-evaluating Move 3.* Nate says "calling it rational is misleading." Ola concedes. Nate is right that "rational" $\neq$ "good outcome." This is a semantic/philosophical win for Nate, even if the math supports Ola. I need to make sure I don't just say "Ola is right because math." Nate's point about the *interpretation* of rationality is valid.

      *Re-evaluating Move 5.* Nate says "simultaneous." In a queue, arrival is sequential. Decision to join is sequential. The *observation* of the line length is simultaneous for the new group, but the line length itself is a history of sequential decisions. Nate's objection is definitely the weakest link.

  8.  **Final Polish:** Check the BHW vs. Banerjee reference. BHW (1992) is "Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades." Banerjee (1992) is "A Simple Model of Herd Behavior." They are very similar, often cited together. BHW is the more standard reference for the "restaurant/queue" example. I will mention BHW primarily.

