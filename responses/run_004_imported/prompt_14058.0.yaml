  4.  **Identify Missing Points (The "Both of Them" Section):**
      *   *Payoff Structure:* Why join a line? Cost of waiting vs. Expected Quality. If the cost of waiting is low (festival fun), joining the line is low risk. If cost is high (late for flight), different calc.
      *   *Correlated Signals:* Maybe the stalls *aren't* indistinguishable. Smell, visual appeal, chef's hat. If private signals are correlated (everyone likes spicy), cascades happen faster.
      *   *Social Utility:* Maybe the value is *being* where the party is. FOMO.
