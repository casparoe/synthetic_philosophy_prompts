      *Revised Plan:* Elena argues that she has "direct access" to the reasons for Conciliationism that Marcus lacks (or vice versa), or she accepts a "moderate" hit to her confidence rather than total abandonment. Let's go with the "Moderate Hit" approach—it's more honest to the literature (e.g., Christensen's later work).

