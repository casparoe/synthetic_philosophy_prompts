  9.  **Final Polish:** Ensure the voices sound distinct. Elena is cool, analytical. Marcus is grounded, slightly pragmatic but philosophically sharp. (Self-Correction: Make sure Elena doesn't sound like she's losing immediately. She needs a strong counter-argument, perhaps about "independent access to the reasons.")

