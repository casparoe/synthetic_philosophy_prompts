answer: |-
  This is a subtle and rich passage that touches on the intersection of psychology, epistemology, and Sidgwick's specific project of rescuing ethical intuitionism from the charge of subjectivity. To answer your questions, we must situate this condition within Sidgwick's broader aim in *The Methods of Ethics*: he is not merely describing how minds work, but establishing rigorous criteria for when an intuition can be treated as a foundational axiom of ethics.

  Here is an analysis of the oscillation Sidgwick describes, its rational status, and what it implies about his evidentialism.

  ### 1. Is the Oscillation a Rational Failure or a Fitting Response?

  The most textually supported reading is that Sidgwick presents the oscillation as a **rational deficit relative to the ideal of "scientific certitude,"** but as a **phenomenologically accurate description of the reflective mind.**

  Sidgwick's project in this chapter is to define the conditions under which a proposition can be treated as *self-evident*. Self-evidence, for Sidgwick, yields certainty. In the passage, he argues that peer disagreement acts as a defeater for that certainty ("the absence of such disagreement must remain an indispensable negative condition of the certainty of our beliefs").

  When he states that reflective comparison "necessarily reduces me temporarily to a state of neutrality," he is identifying the *normative* epistemic requirement. If the evidence (my intuition) is counterbalanced by the evidence of another mind's contrary intuition, logic dictates neutrality. However, he immediately observes that the "total result in my mind is not exactly suspense of judgment."

  This suggests the oscillation is not a *fitting* epistemic endpoint in the way that "scientific certitude" is. It is not a stable, justified doxastic attitude. Rather, it is the symptom of a conflict between two cognitive forces:
  1.  **The Immediate Intuition:** The "positive affirmation by one act of thought." This is the pre-reflective or original grasp of the proposition.
  2.  **The Reflective Correction:** The "neutrality that is the result of another." This is the meta-judgment about the reliability of that intuition given the disagreement.

  Sidgwick is not endorsing the oscillation as a superior form of rationality. He is noting that human psychology does not instantly erase a vivid intuition just because a peer disagrees. However, because this state is "very different from scientific certitude," he is signaling that the proposition can no longer serve as an unshakeable axiom. The oscillation marks the *loss* of the epistemic status required for his foundationalist project. It is a "failure" only in the sense that it fails to meet the high bar of self-evidence, not necessarily in the sense that the agent is being irrational by noticing their own psychological inertia.

  ### 2. Is the Persisting Affirmation Doing Legitimate Epistemic Work?

  There is, however, a charitable reading on which the persisting affirmation does legitimate work, specifically within Sidgwick's method of **reflective equilibrium.**

  Sidgwick is an intuitionist who believes that common-sense morality contains genuine insights that philosophy must refine, not discard. If disagreement immediately mandated total suspension of belief (a clean wipe to zero), we might lose valuable ethical data. The "positive affirmation" preserves the *content* of the intuition for further examination.

  In this light, the oscillation is not merely a glitch; it is the **engine of ethical inquiry.**
  *   The **affirmation** keeps the proposition in play as a candidate for truth.
  *   The **neutrality** prevents dogmatism and forces further scrutiny (e.g., checking for bias, ambiguity, or differences in context between the disagreeing minds).

  Sidgwick often attempts to resolve disagreements by showing that the conflicting parties are actually intuiting different propositions or applying the same principle to different circumstances. The oscillation allows the thinker to hold the intuition tentatively while searching for a reconciliation that restores certainty. If the affirmation were extinguished completely, the inquiry might stop prematurely. Thus, the oscillation is the fitting response for a *fallible inquirer* seeking truth, even if it falls short of the *certitude* possessed by a knower.

  ### 3. Does Sidgwick Commit to the Thesis that Belief Against Evidence is Irrational?

  This passage suggests Sidgwick is committed to a nuanced version of evidentialism. He does not necessarily rule out the *existence* of the split state, but he rules out its claim to **certainty.**

  The thesis you mention—"it is never rational to go on believing a proposition while believing that one's evidence doesn't support it"—depends on how we define "believing."
  *   **If "believing" implies claiming certainty:** Sidgwick absolutely commits to the thesis. He explicitly states that the result of disagreement is "very different from scientific certitude." To claim certainty while acknowledging peer disagreement would, for Sidgwick, be irrational dogmatism.
  *   **If "believing" implies tentative acceptance:** Sidgwick leaves room for the split state. He acknowledges that the "positive affirmation" persists. He does not command the agent to lobotomize their intuition. He commands them to recognize that the *status* of that intuition has changed.

  Sidgwick distinguishes between the **psychological fact** of belief and the **epistemic right** to certitude. The passage admits that we often continue to feel the force of an intuition (psychological belief) even when reflection tells us we lack sufficient grounds for certainty (epistemic neutrality).

  Crucially, Sidgwick says reflection reduces him to neutrality *temporarily*. This implies that the split state is a **transitional phase**. The rational goal is to resolve the conflict—either by finding an error in the other mind, finding an error in one's own, or refining the proposition so that the disagreement dissolves. While in the transitional phase, the split state is an honest acknowledgment of the current evidential balance: "My intuition says X, but the fact of disagreement says 'maybe not X'."

  Therefore, Sidgwick does not commit to the view that one must instantly cease all affirmation upon encountering disagreement. Rather, he commits to the view that one must **downgrade the epistemic confidence** attached to that affirmation. The oscillation is the phenomenological experience of that downgrading process. It is not a stable rational position to rest in, but it is not necessarily an irrational state to pass through.

  ### Summary

  Sidgwick is using this description to lower the status of disputed intuitions from "axioms" to "hypotheses."
  1.  **Rational Status:** The oscillation is a **deficit relative to certitude**, marking the proposition as unfit to be a foundational axiom. It is not a new, stable form of rationality.
  2.  **Epistemic Work:** The persisting affirmation preserves the intuitive data for **further refinement and reconciliation**, preventing premature skepticism.
  3.  **Evidentialism:** Sidgwick rules out **certainty** in the face of counter-evidence (disagreement), but acknowledges the **psychological persistence** of belief. He demands that we recognize this persistence as lacking the authority of self-evidence, effectively forcing the agent into a state of critical inquiry rather than dogmatic assurance.

  The "curious" oscillation is Sidgwick's honest admission that ethical reasoning is a human practice, not a purely logical algorithm. We cannot simply switch off our intuitions, but we are rationally bound to acknowledge when they lose their claim to universal authority.
