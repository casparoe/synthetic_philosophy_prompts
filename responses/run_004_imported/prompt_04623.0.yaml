          *   *Critique:* This makes BST purely consequentialist regarding fitness. It risks calling invasive processes "healthy" just because they haven't killed you *yet* or *statistically*. It relies on the *outcome* (harm/fitness loss) to define the *process* (disease). So, yes, it smuggles in a harm judgment (via the fitness metric).

