prompt: |-
  So I spent about thirty-five years as a physicist before retiring, and if there was one thing that always drove me nuts it was a colleague who wouldnt drop a pet theory even after the data flat out contradicted it. Lately I've been down a bit of a philosophy rabbit hole, and turns out Thomas Hobbes was exactly this type of guy. In Leviathan he basically says geometry is the only real science worth the name, because unlike nature, which we didnt make, we construct the figures and definitions ourselves, so we can be totally certain about them. Then this same guy spends something like 25 years insisting he'd squared the circle, getting torn apart by Wallis again and again, and never backs down once. Can you write me a joke about this? Not just a generic "philosopher stinks at math" joke - I want the punchline to actually hinge on that specific claim of his, that geometric certainty comes from us being the ones who built the thing in the first place.
