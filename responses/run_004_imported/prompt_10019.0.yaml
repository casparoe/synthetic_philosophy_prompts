answer: |-
  John Wallis corners Thomas Hobbes at the Royal Society, slamming a stack of papers onto the table. It's 1655, and this is roughly the twentieth time Wallis has disproved Hobbes's claim to have squared the circle.

  "Thomas, look at the numbers," Wallis says, exasperated. "The ratios don't hold. The arc is curved. You simply cannot square the circle."

  Hobbes doesn't even look up from his diagram. "John, you're making a category error. You're treating this like natural philosophy."

  "I'm treating it like mathematics!"

  "No," Hobbes says, tapping his ink-stained finger on the page. "In physics, we study nature. And since God made nature, not us, we can never be truly certain of it. We're just guessing at the Almighty's work."

  Wallis rubs his temples. "We are talking about geometry, Thomas."

  "Precisely," Hobbes smiles. "And in geometry, *we* are the creators. We define the points. We draw the lines. We construct the figures. That is why geometry is certain—because we are reading a book we wrote ourselves."

  "Okay," Wallis says slowly. "But you wrote this page wrong."

  Hobbes shakes his head, picking up his quill. "No, John. I didn't write it wrong. I wrote it *mine*. You're trying to measure my construction against God's truth. But I never claimed to square God's circle. I squared the one I drew."

  "That's... that's not how circles work."

  Hobbes dips his pen, ready to add another line to the impossible figure. "In nature, you're right. But on this page? I'm the sovereign. And since certainty comes from authorship, this circle is square... because I'm the one holding the pen."
