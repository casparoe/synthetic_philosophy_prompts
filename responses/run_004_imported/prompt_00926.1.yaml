answer: |-
  This is a superb set of questions. It cuts to the heart of why Hobbes matters for the history of philosophy of science, rather than just the history of mathematical errors. To answer this, we have to take seriously the architecture of *De Corpore*. For Hobbes, geometry is not merely a tool for physics; it is *prima philosophia*. It is the study of quantity abstracted from body, but quantity generated by motion. Because we generate the motion, we know the cause. Because we know the cause, we have *scientia* (demonstrative knowledge).

  If we take that architecture seriously, the three posthumous developments you list are not merely corrections to his math; they are existential threats to his metaphysics. Here is a reconstruction of how Hobbes might respond, prioritizing the internal coherence of his system over his historical stubbornness.

  ### 1. Non-Euclidean Geometry: The Severing of Geometry and Physics
  **Verdict: Bad News.**

  You ask whether non-Euclidean geometry (NEC) vindicates Hobbes's conventionalism ("we make it so we can know it"). Superficially, it seems to help: if we can choose different axioms and generate different consistent systems, doesn't that prove geometry is a human construction?

  However, for Hobbes, the "maker's knowledge" doctrine is not about *arbitrary* construction; it is about *causal* construction grounded in the nature of body. In *De Corpore*, Hobbes argues that space and time are "phantasms" of existing things, but extension is real. Geometry is the science of extension generated by motion. Crucially, Hobbes believes there is only one real universe with one real kind of local motion. Therefore, there can be only one true geometry—the one that accurately describes the generation of figures in real space.

  If Bolyai and Lobachevsky show that we can construct consistent geometries where the parallel postulate fails, Hobbes would likely argue one of two things, both damaging to his system:

  1.  **They are playing with words, not things.** Hobbes would likely dismiss NEC as "insignificant speech" (a favorite charge against the Scholastics). If a "line" is defined as the trace of a point moving uniformly, and "plane" as generated by a moving line, Hobbes believes the Euclidean properties follow *necessarily* from the generation. If NEC produces different results, Hobbes would argue the NEC geometer has not actually described a possible motion of a body. They have created a logical game, not a science of quantity.
  2.  **Physics is undermined.** This is the deeper threat. Hobbes's physics relies on geometry to explain causation. If geometry is merely one of many consistent formal systems, it loses its privileged status as the foundation of physics. Hobbes needs geometry to be *necessarily* true of the physical world because physical bodies *are* geometric bodies in motion. If physical space might be Riemannian, Hobbes's kinematic physics (which assumes Euclidean extension) becomes contingent conjecture, not *scientia*.

  So, NEC pulls apart the two things Hobbes needs to keep together: the certainty of geometry and its applicability to real bodies. NEC grants certainty (internal consistency) but sacrifices unique applicability. Hobbes needs both. He would likely reject NEC as a category error, but in doing so, he isolates his geometry from the future of mathematical physics.

  ### 2. Lindemann and the Transcendence of $\pi$: Is there a Dignified Retreat?
  **Verdict: No dignified retreat on the specific claim, but a possible salvage of the epistemology.**

  This is the most painful item for the Hobbesian. In *De Corpore* and his disputes with Wallis, Hobbes insists that the quadrature is possible because the *ratio* between the circle and the square is fixed by nature, and since we can generate the circle by motion, we can discover that ratio. He treats the straightedge-and-compass restriction not as a metaphysical limit, but as a pedagogical one. He often appeals to mechanical curves (like the quadratrix) which he considers valid because they are generated by motion.

  Lindemann's proof shows that $\pi$ is transcendental, meaning it is not the root of any polynomial with rational coefficients. In the context of Greek construction problems, this entails that no finite sequence of straightedge-and-compass operations can produce a segment of length $\pi$.

  **Can Hobbes retreat?**
  A "dignified" retreat would require him to admit error without abandoning the "maker's knowledge" doctrine.
  *   **The Trap:** If he admits he was wrong about the circle, he undermines the claim that geometry yields certain knowledge. If the "maker" cannot fully comprehend the figure he made, the epistemology cracks.
  *   **The Escape Hatch:** Hobbes could argue that Lindemann's proof relies on the algebraic/analytic methods (calculus, infinite series) that Hobbes despised. Hobbes consistently argued that algebra was a "scab of symbols" that obscured the underlying magnitudes. He might argue: *"Lindemann has proven that the ratio cannot be captured by your symbolic algebra or your restricted Euclidean tools. He has not proven that the areas are not physically equivalent."*

  Hobbes could pivot to a **kinematic equivalence**. He could argue: "I can construct a mechanical device (a planimeter, effectively) that rolls a circle and measures the area physically. The *physical* squaring is possible because motion is continuous. The impossibility lies only in your discrete, symbolic representation of that motion."

  This saves the "maker's knowledge" doctrine (we still know the cause via motion) but concedes the mathematical point regarding Euclidean construction. It is a retreat, but it is consistent with his broader distrust of symbolic algebra in favor of semantic, kinematic reasoning. It transforms the error from a failure of *reason* to a failure of *method* (using Wallis's symbols instead of Hobbes's motions).

  ### 3. Hilbert's Axioms: The Triumph of the Symbolic
  **Verdict: Catastrophic News.**

  If NEC is a threat, Hilbert's *Grundlagen der Geometrie* (1899) is an annihilation. Hilbert's formalism is the precise inverse of Hobbes's genetic method.

  *   **Hobbes:** Definitions must be **genetic**. To define a circle, you must describe *how it is made* (circumduction of a line). Truth is the correct ordering of names that refer to conceptions of generated bodies.
  *   **Hilbert:** Definitions are **implicit**. "Point," "line," and "plane" are undefined primitives. Their meaning is exhausted by the axioms they satisfy. As you noted, they could be "tables, chairs, and beer mugs."

  For Hobbes, this is the return of the Scholastic "insignificant speech." In *De Corpore*, Hobbes argues that without a clear conception of the thing named, reasoning is just "reckoning without words." If "point" does not stand for a conceivable entity with magnitude (Hobbes actually argued points must have finite magnitude, another bone of contention), but is merely a logical placeholder, then geometry is no longer about *quantity* or *body*.

  **Why this breaks the "Maker's Knowledge" link:**
  Hilbert's geometry is known with certainty, yes, but it is not known because we *make* the objects. It is known because we stipulate the rules. For Hobbes, certainty comes from knowing the *cause* of the figure's properties. In Hilbert's system, there are no causes, only logical consequences.
  *   Hobbes: "I know the angles of a triangle sum to 180 degrees because I know how I constructed the triangle from parallel lines."
  *   Hilbert: "You know it because it is a theorem derivable from the axioms, regardless of whether you can construct it or what it represents."

  This severs the link between geometry and civil philosophy that you mentioned. Hobbes thinks we know the Commonwealth because we *authorize* it (we make it). Hilbert suggests we know geometry because we *stipulate* it. While this sounds similar, for Hobbes, the stipulation must track the *nature of motion*. Hilbert frees mathematics from the burden of reference entirely.

  Hobbes would likely view Hilbert's formalism as the ultimate victory of the "empty symbols" he fought against in Wallis. It vindicates the certainty of mathematics but at the cost of making it irrelevant to natural philosophy. If geometry is about "beer mugs," it cannot be the foundation of physics. And if it cannot be the foundation of physics, Hobbes's entire project in *De Corpore* collapses.

  ### Synthesis: The Tragedy of Hobbes's Geometry

  To answer your core question: **Items 1 and 3 are bad news because they pull apart the certainty and the realism that Hobbes's system requires.**

  *   **Non-Euclidean Geometry** suggests that certainty is possible without unique physical reference.
  *   **Hilbert's Axioms** suggest that certainty is possible without *any* physical reference (or causal generation).

  Hobbes's "maker's knowledge" doctrine is a hybrid: it claims the certainty of logic *and* the truth of empirical reality because the human mind imposes the logical structure onto the physical material via construction. Modern mathematics resolved the tension by abandoning the claim to physical reality. It became purely formal.

  **On Lindemann:** There is a path for Hobbes to maintain his dignity, but it requires him to double down on his anti-algebraic stance. He can claim that the transcendence of $\pi$ is a limitation of *number* and *symbol*, not of *magnitude* and *motion*. He can argue that continuous motion can solve problems that discrete calculation cannot. This preserves the epistemology (we know motion better than number) while conceding the specific theorem.

  **Conclusion:**
  Hobbes was not merely a crank; he was a philosopher trying to ground mathematical certainty in a materialist ontology. The tragedy of his mathematical legacy is that the developments which secured the certainty of mathematics (formalism, axiomatics) did so by abandoning the ontology (realism about motion and generation) that Hobbes thought was the *source* of that certainty.

  If Hobbes were to return, he would likely say that modern mathematics has become a brilliant game of "reckoning without words," perfectly certain but ultimately disconnected from the philosophy of body. He would see Hilbert and Riemann not as improvers of geometry, but as men who changed the subject. He would claim they saved the *science* of geometry by killing the *philosophy* of geometry. And for Hobbes, who believed philosophy was the only path to peace and civil order, that would be a pyrrhic victory indeed.
