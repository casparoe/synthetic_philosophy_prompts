answer: |-
  You have inadvertently constructed a textbook example of what decision theorists and economists call a **Money Pump**. Your suspicion is correct: this was not mere carelessness, but a structural vulnerability in how preferences are ordered and executed over time.

  To answer your specific question: The irrationality is not located in any single trade, nor strictly in the relation among the three, but in the **dynamic inconsistency of your preferences across time.**

  Here is the breakdown of the logic, the trap, and how a collector might defend against it without abandoning the hunt.

  ### 1. Locating the Irrationality

  **The Single Trade (Rational)**
  Individually, each trade was defensible. In Trade 1, you valued the signature over the marginalia. In Trade 2, you valued rarity (the misprint) over the signature. In Trade 3, you valued the specific history (marginalia) over the rarity. Human preference is context-dependent; it is not inherently irrational to value things differently as your mood, knowledge, or circumstances change. If you had made these trades with three different dealers over ten years, no one would question your sanity.

  **The Relation Among the Three (Intransitive)**
  The logical failure appears when we view the three trades as a closed system. Rational preferences must be **transitive**. If you prefer $A$ to $B$, and $B$ to $C$, logic dictates you must prefer $A$ to $C$.
  Your actions demonstrated a cycle: $B \succ A$, then $C \succ B$, then $A \succ C$.
  When preferences are intransitive, an agent can be "pumped" for money indefinitely, trading in a circle and paying a fee at every step, ending with the original asset but less wealth. This is the definition of the Money Pump argument.

  **The Choice Across Time (Dynamic Inconsistency)**
  This is the true locus of the vulnerability. You suffered from **preference reversal**. At Time 1, your "self" valued the signature. At Time 3, your "self" valued the marginalia. The dealer exploited the gap between your *anticipated* preferences (what you thought you would want long-term) and your *experienced* preferences (what you wanted in the moment of the estate sale). The irrationality lies in allowing your valuation metric to shift without accounting for the transaction costs of that shift.

  ### 2. The Dealer's Role

  While you may view this as a private indulgence, the dealer acted as the pump handle. Whether by design or luck, they identified that your valuation of the books was not anchored to a fixed standard (like market price or a strict hierarchy of attributes) but was fluid and reactive. By offering the specific counter-asset that targeted your current dissatisfaction (the "grass is greener" effect), they monetized your indecision.

  ### 3. Defensible Guards (Without Refusing All Offers)

  You asked for a way to guard against this without adopting the scorched-earth policy of refusing all future trades. To do this, you must introduce friction and structure to your decision-making process that enforces transitivity.

  **A. The "Shadow Price" of Sentiment**
  Collectors often fail because they treat sentimental value (marginalia, signatures) as qualitative and market value as quantitative. To prevent cycling, you must quantify the qualitative.
  *   **The Defense:** Before entering a trade, assign a specific monetary premium to the unique attribute you desire. If the marginalia is worth \$500 to you, and the signature is worth \$700, write it down.
  *   **The Rule:** You may only trade if the *total* value (Market Price + Sentimental Premium) of the incoming book exceeds the outgoing book by a threshold that covers your transaction costs plus a "hassle premium" (e.g., 10%). This forces your sentiments into a transitive hierarchy.

  **B. The Cooling-Off Period (Temporal Friction)**
  The Money Pump relies on immediate execution. It requires you to act on the impulse of the moment before you recall the preference of last month.
  *   **The Defense:** Institute a mandatory waiting period for any trade involving a book you have owned before, or any trade that reverses a decision made within the last 12 months.
  *   **The Rule:** "I do not repurchase a book I have sold within 24 months." This breaks the cycle. If you still want the original book after two years, it is likely a stable preference, not a momentary regret.

  **C. Portfolio Accounting vs. Marginal Utility**
  You evaluated each trade based on *marginal utility* (what do I gain *now*?) rather than *portfolio consistency* (where does this leave my collection *overall*?).
  *   **The Defense:** Keep a ledger not just of cash, but of "Collection State."
  *   **The Rule:** Before trading, look at the ledger. If the proposed trade returns you to a previous state (Book A) but with less cash, the ledger will visually flag the cycle. You must treat your collection as a single asset class, not a series of isolated transactions.

  **D. The "Buy-Back" Prohibition**
  The most vulnerable point in your sequence was Trade 3 (returning to the start).
  *   **The Defense:** Acknowledge that regret is a cost of doing business, not a signal to reverse course.
  *   **The Rule:** Never trade back for an item you have previously divested. If you miss the marginalia, find a *different* copy with marginalia, but do not reverse the specific transaction chain. This prevents the dealer from closing the loop.

  ### Summary

  The irrationality was not in changing your mind, but in paying to change it back. You paid for the *experience* of the cycle, but you are recording it as a *financial* loss, which causes the dissonance.

  If you view the money lost as the ticket price for a year of engagement with a dealer and the thrill of the hunt, it may be rational. But if you view it as a loss of capital, you must impose **transitivity constraints** on your future self. The most robust defense is the **Cooling-Off Period**: by delaying the third trade, you allow your initial preference (for the marginalia) to either solidify or fade, preventing the dealer from exploiting the temporary spike in regret.

  You are a novelist; you understand that a character who repeats the same mistake while expecting a different result is tragic. A collector, however, must be an editor. You must be willing to cut the scene where you buy the book back.
