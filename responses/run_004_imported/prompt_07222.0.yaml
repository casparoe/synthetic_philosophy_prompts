      *   *Check:* Is the tone appropriate? *Correction:* Keep it collegial but rigorous. No ad hominem, just argument.

  6.  **Polishing the Dialogue:**
      *   Add philosophical jargon naturally (extensional adequacy, normative unity, primitive, reductive).
      *   Ensure the flow feels like a conversation, not two monologues. Use interruptions or acknowledgments ("I see where you're going," "But consider this").

  7.  **Final Review against constraints:**
