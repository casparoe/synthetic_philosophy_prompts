  *(Self-Correction Note)*: I need to make sure I don't confuse "Buck-Passing" with "Fitting-Attitude." They are closely related. BP says Value = Reasons for Attitudes. FA says Value = Fittingness of Attitudes. The WKR problem hits BP harder because BP tries to reduce value to *reasons*. FA can absorb WKR by saying the demon gives reasons, but not *fittingness*-reasons. Jamie represents the FA view that thinks "Fittingness" is the primitive, not "Reasons." Alex represents the BP view that thinks "Reasons" is the primitive.

  Let's write it.

