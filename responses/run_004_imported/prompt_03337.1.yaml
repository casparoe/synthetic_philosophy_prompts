answer: |-
  This is a sophisticated narrative problem that touches on a classic debate in metaphysics regarding the nature of properties. Your friend is correct that the distinction between **finkish** and **masked** dispositions is crucial for understanding how a trait can be real even if it is never observed. However, applying these terms to your novel requires precision, as your specific scenario (the stimulus *never* occurring) differs slightly from the standard philosophical counterexamples (the stimulus occurs, but the manifestation fails).

  Here is a precise breakdown of the concepts, why they preserve the reality of the disposition, and which best fits your protagonist.

  ### 1. The Baseline: The Simple Conditional Analysis (SCA)
  To understand the counterexamples, we must first define what they are countering. The **Simple Conditional Analysis** proposes that dispositions are nothing more than counterfactual conditionals.
  *   **Formula:** Object $x$ is disposed to manifest $M$ in response to stimulus $S$ **if and only if** if $x$ were subjected to $S$, $x$ would $M$.
  *   **Example:** A glass is fragile **iff** if it were struck, it would break.

  The problem with SCA is that there are cases where the disposition exists, but the conditional ("If struck, it would break") is false. This is where **Finkish** and **Masked** dispositions come in.

  ### 2. Finkish Dispositions
  A disposition is **finkish** if the occurrence of the stimulus *causes the disposition to vanish* before the manifestation can occur.
  *   **The Mechanism:** Stimulus $S$ triggers a mechanism that removes the intrinsic basis of the disposition $D$.
  *   **Classic Example (C.B. Martin's Electrofink):** A wire is live (disposed to conduct electricity). However, a device is attached that detects when something touches the wire. The instant contact is made (Stimulus), the device cuts the power (removes the disposition).
  *   **The Result:** If the wire were touched, it would *not* conduct.
  *   **SCA Failure:** The SCA says the wire is not live (because if touched, it doesn't conduct). But intuitively, the wire *was* live right up until the moment of touch.
  *   **Why the disposition is real:** The intrinsic property (the molecular structure allowing electron flow) existed *prior* to the stimulus. The failure of manifestation is due to the *removal* of the property by the stimulus, not the absence of the property initially.

  ### 3. Masked Dispositions
  A disposition is **masked** if the disposition remains present during the stimulus, but an external interferer prevents the manifestation.
  *   **The Mechanism:** Stimulus $S$ occurs, Disposition $D$ is present, but a "mask" $Z$ blocks the causal chain from $D$ to $M$.
  *   **Classic Example:** A fragile glass is wrapped in thick bubble wrap. It is struck (Stimulus). It does not break (No Manifestation).
  *   **The Result:** If the glass were struck, it would *not* break (because of the wrap).
  *   **SCA Failure:** The SCA says the glass is not fragile. But intuitively, it is still fragile; the wrap is just hiding it.
  *   **Why the disposition is real:** The intrinsic property (the molecular brittleness) remains unchanged throughout the stimulus. The failure of manifestation is due to an *extrinsic blocker*, not a lack of the disposition.

  ### 4. Why Neither Implies "Lacking the Disposition"
  In both cases, philosophers argue that the disposition is grounded in an **intrinsic causal base** (e.g., the molecular structure of the glass, the neural architecture of a person).
  *   **Finkish:** The base exists *before* the stimulus.
  *   **Masked:** The base exists *during* the stimulus.

  Therefore, the failure of the counterfactual ("If $S$, then $M$") does not prove the absence of the disposition. It only proves that the link between disposition and manifestation is interruptible. This validates your friend's point: **Your protagonist can possess courage even if the conditional "If danger arose, she would act bravely" is never tested or verified on the page.**

  ### 5. Application to Your Novel
  Here is where we must be careful with terminology. Your prompt states: *"a string of narrative accidents means she is never actually placed in a situation where that courage must be shown."*

  Strictly speaking, if the **stimulus (danger/threat) never occurs**, this is neither a Finkish nor a Masked case. It is simply an **unmanifested disposition due to absence of stimulus**.
  *   **Finkish** requires the danger to arise, causing her to *lose* her courage instantly. (This contradicts your design).
  *   **Masked** requires the danger to arise, but something prevents her from *acting* on it.

  However, to utilize your friend's insight for your thematic purposes, **Masked** is the far better fit, provided you tweak the narrative slightly.

  #### Why "Finkish" is the Wrong Fit
  If you frame this as Finkish, it implies that the *presence of danger* would destroy her courage. In metaphysical terms, a finkish courageous person is one who, upon encountering a threat, immediately loses the psychological capacity for bravery. This undermines the character trait you want to establish. You do not want the stimulus to remove the disposition; you want the disposition to remain latent.

  #### Why "Masked" is the Right Fit (With Nuance)
  To align with the **Masked** model, the "narrative accidents" must act as the **mask**.
  *   **The Stimulus:** A threat *must* technically arise (or be imminent), but the "bubble wrap" of the plot prevents the *need* for action.
  *   **Example:** She walks into an ambush (Stimulus/Courage required). However, a chandelier falls and knocks out the villains before she has to draw her weapon (The Mask).
  *   **The Metaphysics:** Her courage (the intrinsic base) was ready to fire. The manifestation (the brave act) was blocked by an external interferer (the chandelier/luck).

  If the danger *never even arises* (e.g., she never goes to the dangerous location), then you cannot claim the disposition is masked; you can only claim it is **latent**.

  ### Recommendation for the Draft
  To make the courage philosophically "genuine" despite the lack of demonstration, you should lean into the **Masked** interpretation rather than simple absence of stimulus.

  1.  **Establish the Intrinsic Base:** Since the reader cannot see the manifestation (the brave act), you must show the **categorical base** of the disposition. Show her internal psychology, her training, or her values *in safe contexts*. In metaphysics, the disposition is real because of its base. If you show the base, the reader accepts the disposition exists, even if the plot "masks" the test.
  2.  **Create "Near Misses" (The Mask):** Instead of avoiding danger entirely, let danger arise but be resolved by "narrative accidents" before she is forced to act. This creates a **Masked Disposition** scenario. The reader perceives: "She *would* have acted, but the situation was resolved." This preserves the truth of the counterfactual ("If the chandelier hadn't fallen, she would have fought") without requiring the action.
  3.  **Avoid the Fink:** Do not write scenes where the threat makes her hesitate or freeze. That signals a finkish loss of the trait.

  **Summary:** Your friend is using these terms to argue that **manifestation is not necessary for existence**. While your plot describes an absence of stimulus, framing the "narrative accidents" as **masks** (external interferers that prevent the *necessity* of action despite the *presence* of threat) is the most philosophically robust way to maintain that her courage is real, intrinsic, and unflinching, rather than merely untested luck.
