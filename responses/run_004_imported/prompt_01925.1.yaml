prompt: |-
  ok so my cat has had some kind of slow health thing going on the last couple months (nothing fatal don't worry) and it's honestly made me weirdly obsessed with whether she actually *feels* scared/stressed at the vet or if im just projecting that onto her. anyway i fell down a wikipedia hole about old-timey views on animal minds and landed on descartes, who i vaguely remembered as the guy who "proved" animals are basically unfeeling meat robots. but then i actually found the passage, from a 1649 letter to some guy named henry more, and now im more confused than when i started lol:

  "...I have held it demonstrated that we are not able in any manner to prove that there is in the animals a soul which thinks. [...] there are other stronger and more numerous arguments for the opposite opinion [...] as, for example, that it is more reasonable to make earth-worms, flies, caterpillars, and the rest of the animals, move as machines do, than to endow them with immortal souls [...] seeing no reason anywhere why thought is to be found wherever we perceive a conformation of bodily members like that of the animals, and that it is more surprising that there should be a soul in every human body than that there should be none at all in the brutes. [...] It must, however, be observed that I speak of thought, not of life, nor of sensation; for I do not deny the life of any animal, making it to consist solely in the warmth of the heart. I do not refuse to them feeling even, in so far as it depends only on the bodily organs."

  so his whole case against brutes having thought seems to boil down to "we obviously can't go around handing earthworms immortal souls, so animals gotta just be machines." fine, ok. but then two sentences later he says hes NOT denying them life or feeling, just "thought" specifically. if the thing he's actually scared of is soul-inflation (worms with souls, lol), why doesnt that same fear also block him from granting feeling? isnt feeling something too, that would need some kind of soul-ish thing behind it? what's actually doing the work here to keep "sensation" safely on the machine side of the line while "thought" is the one line item that requires a soul? been chewing on this for days
