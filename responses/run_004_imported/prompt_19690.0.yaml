      *   *The Key to a "Genuine" Dilemma:* To beat Donagan, the scenario needs to avoid the agent's prior fault (to avoid "you got yourself into this") and avoid a clear hierarchy of values (to avoid "one duty obviously outweighs the other"). The duties must be *incommensurable* or *equally binding* in a way that reflection doesn't dissolve.

  3.  **Brainstorming Scenarios (avoiding the Big Three):**
