      *   **Duty A (Professional/Epistemic):** Her life's work and contract with the University/Government is to translate and share knowledge. The code contains a cure for a plague ravaging the outside world. Sharing it saves millions.
      *   **Duty B (Relational/Stewardship):** The code is sacred. Translating it violates their deepest religious taboo. If she shares it, the tribe believes they are spiritually doomed and will commit mass suicide (or be culturally annihilated). She promised their elder (who trusted her personally) she would "guard their voice."
      *   **The Clash:** Saving millions (Utilitarian) vs. Betraying a specific trust and causing cultural genocide (Deontological/Relational).
      *   **Why Donagan fails here:** Donagan says "Millions > One Tribe." But if morality is about *integrity and promises*, the promise to the tribe is absolute. If morality is about *consequences*, the millions win. A genuine dilemma exists when the agent accepts *both* frameworks as binding on her conscience. She isn't just calculating; she is torn between two *identities*.
