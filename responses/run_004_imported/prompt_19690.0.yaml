      *   *Let's sharpen this for the "Donagan" rebuttal.* Donagan argues that if you can't do both, one isn't a real 'ought'. To counter this, the 'oughts' must stem from sources that are equally authoritative and incommensurable.
      *   *Scenario Choice:* **The "Adoptive/Biological" Parentage Secret.** (A bit soap opera).
