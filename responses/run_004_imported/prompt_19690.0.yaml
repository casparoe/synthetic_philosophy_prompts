      *   *Idea 4: Identity/Role Conflict.* A spy who must betray their country to save their family, or vice versa. *Critique:* A bit cliché.
      *   *Idea 5: Epistemic/Truth vs. Harm.* A historian or scientist discovers a truth that will incite violence but suppressing it is a betrayal of their vocation.
