      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm diagnosing the brother or telling the user to fix him. The focus should be on the *relationship dynamic* and the user's *boundaries*. I also need to explicitly address the money issue, as that's a concrete boundary violation, not just a memory slip.

  9.  **Final Polish:** Check against the user's specific phrases ("toddler," "dog," "judge me like everyone else"). Ensure these are addressed directly. (The "toddler/dog" analogy is particularly powerful and needs to be highlighted as a sign of lost intimacy).

  10. **Final Output Generation** (This matches the detailed response provided previously.)
answer: |-
  This is one of the hardest dynamics to navigate in family relationships, and I want to start by validating exactly what you are feeling: **You are not a jerk for being hurt.**

  Your analogy about treating him like a toddler or a dog is incredibly insightful. It highlights the core problem with the current truce you've reached. When you stop expecting anything from someone to avoid disappointment, you aren't practicing forgiveness; you are practicing **detachment**. You are protecting yourself by lowering him to a status where his actions don't "count" as adult choices. That preserves the peace, but it kills the intimacy. It says, "I don't trust you to be a grown-up," which is ultimately dehumanizing.

  To answer your core question: **No, he is not right.** Having ADHD does not exempt him from accountability, nor does it invalidate your feelings.

  Here is a breakdown of why this dynamic is happening, why his defense is flawed, and how you can find a middle path between "resentful enforcer" and "detached caretaker."

  ### 1. Explanation vs. Excuse
  Your brother is conflating an *explanation* with an *excuse*.
  *   **Explanation:** "I have ADHD, which makes working memory and time blindness difficult. I genuinely forgot your birthday because my brain didn't flag the date as important until it passed."
  *   **Excuse:** "I have ADHD, therefore I cannot be held responsible for the hurt I caused you, and you are unfair for expecting me to try harder."

  ADHD explains *why* the behavior happens, but it does not negate the *impact* of the behavior on you. You can acknowledge his neurology without accepting the collateral damage. It is possible to say, "I know your brain works differently, and I'm not mad that you forgot. I am sad that you didn't care enough to put systems in place so you wouldn't forget."

  ### 2. The "Judging Me Like Everyone Else" Trap
  When he says, "It's not fair to judge me like everyone else," he is technically correct, but he is using it as a shield.
  *   **True:** You cannot judge his *intent* by neurotypical standards. He likely isn't forgetting your birthday to be mean.
  *   **False:** You cannot judge the *outcome* by neurotypical standards. A missed birthday hurts the same way regardless of why it was missed. A missing $100 impacts your budget the same way regardless of why it wasn't paid back.

  He is asking you to absorb the cost of his disability. While family supports each other, support should not mean one person silently absorbing all the emotional and financial costs.

  ### 3. How to Be Annoyed Without Being Unfair
  You want to know if there is a way to be annoyed that isn't unfair. The answer is yes, but it requires shifting the focus from **blame** to **boundaries**.

  Currently, you are internalizing the annoyance ("I'm a jerk for feeling this") or suppressing it ("I'll just expect nothing"). Instead, you need to externalize the problem. The problem isn't *him*; the problem is *the lack of systems.*

  **The Money Issue (Concrete Boundary)**
  Forgetting a birthday is a memory failure. Not bringing up repaying a loan is often an avoidance issue.
  *   **Unfair:** "You're so irresponsible, pay me back now." (Attacks character).
  *   **Detached:** "Don't worry about it." (Enables behavior, kills respect).
  *   **Fair Boundary:** "I love you and I want to help, but I can't lend money anymore unless we write down a repayment date. It's not about trust, it's about my own budget management."

  **The Plans Issue (Systems over Expectations)**
  *   **Unfair:** "You always flake, you never care."
  *   **Detached:** "I'll assume you're coming but I won't be upset if you don't."
  *   **Fair Boundary:** "I know last-minute stuff is hard with your schedule. Let's not make firm plans. Let's just say 'I'll text you Saturday morning to see if you're up for hanging out.' That way neither of us feels pressured."

  ### 4. Moving from "Toddler Management" to "Adult Partnership"
  The reason you feel like you're managing a toddler is that **you are doing all the emotional labor.** You are managing your expectations, managing your disappointment, and managing the logistics to ensure you don't get hurt. He is off the hook.

  To fix this, you have to hand some of that labor back to him. This will cause friction. He will likely say you're being unfair. That is okay. Friction is part of an adult relationship; silence is not.

  Try having a conversation that sounds something like this:

  > "I need to talk about something that's been bothering me. I know your brain works differently with ADHD, and I never doubt that you love me. But lately, when plans get canceled or money isn't paid back, I feel like I'm not a priority.
  >
  > I've stopped bringing it up because I don't want to fight, but honestly, it makes me feel distant from you. It feels like I'm making excuses for you rather than having a relationship with you. I don't want to treat you like a kid who can't help it. I want to treat you like a brother I can count on. What systems can we put in place so I don't feel hurt and you don't feel pressured?"

  ### 5. Why You Need to Allow Yourself to Be Annoyed
  If you suppress your annoyance, it turns into resentment. Resentment is the enemy of love.
  *   **Annoyance** says: "This behavior is not okay."
  *   **Resentment** says: "*You* are not okay."

  You are currently stuck in resentment because you aren't allowed to voice the annoyance. You need to give yourself permission to feel hurt. When he forgets your birthday, it *is* sad. When he flakes, it *is* inconvenient. Acknowledging that doesn't make you ableist; it makes you human.

  ### Summary
  He is right that you can't judge his *intentions* by neurotypical standards. He is wrong that you can't hold him accountable for the *impact*.

  You don't have to choose between "angry warden" and "indifferent caretaker." There is a third option: **Compassionate Accountability.**
  *   **Compassion:** "I know this is hard for your brain."
  *   **Accountability:** "But this affects our relationship, so we need to solve it together."

  If you start holding boundaries (like not lending money without a plan, or making tentative plans instead of firm ones), he might push back. He might call it unfair. But if you hold steady, you signal that you respect him enough to believe he is capable of meeting you halfway. That is the opposite of treating him like a toddler; it is the highest form of respect you can offer.
