answer: |-
  **Setting:** *A community center basement in a mid-sized city. 9:45 PM. The fluorescent lights hum. The noise of forty volunteers making calls has faded, replaced by the clatter of metal folding chairs being stacked. Two people remain.*

  **MARA** (30s, Field Director, wearing a campaign t-shirt that's seen better weeks) is stacking chairs. **ELIAS** (50s, volunteer, quiet, wearing a blazer over a sweater) is wiping down the tables.

  **MARA**
  You stayed late.

  **ELIAS**
  So did you.

  **MARA**
  I get paid to close up. You get a bumper sticker.

  **ELIAS**
  (Smiles faintly)
  I like the bumper sticker. Though I noticed we didn't talk much about the actual zoning ordinance on the script tonight. Mostly just "fighting for our future."

  **MARA**
  (Pauses, holding a chair)
  "Fighting for our future" tests better. It's broader. Zoning puts people to sleep.

  **ELIAS**
  Or it invites them to think. When Mrs. Gable asked about the rent cap on the third row, I saw you wince. You wanted to give her the real answer, but you glanced at the script.

  **MARA**
  Because the real answer is complicated, Elias. It's a negotiation. If I tell her "we support it but with caveats," the opposition cuts a thirty-second ad saying "Candidate Rejects Rent Control." Nuance doesn't survive the edit.

  **ELIAS**
  That's the first pressure point. Simone Weil called it the crushing of the individual mind by collective pressure. You didn't lie to Mrs. Gable, exactly. But you allowed the campaign's need for survival to dictate your relationship with the truth.

  **MARA**
  (Sighs, drops a chair into the stack with a clang)
  Here we go. Your housemate's essay. Look, I know how it feels. I felt it today. But without that pressure, without that "collective mind," how do you coordinate ten thousand people? If every volunteer gives their own nuanced answer, we don't have a campaign. We have a town hall.

  **ELIAS**
  But is the goal to win, or is the goal to govern? Weil argues that the party structure makes winning the *only* truth. The platform isn't a set of beliefs; it's a marketing brochure designed for expansion. The party must grow to survive. If a policy hurts the party's numbers, the policy gets dropped, even if it's good for the city.

  **MARA**
  If the party doesn't grow, it doesn't hold power. If it doesn't hold power, the good policy dies in committee. You're acting like power is dirty. Power is just leverage. I need a majority to pass the rent cap. To get the majority, I need a brand. To get a brand, I need consistency. Yes, that squeezes the edges off the truth. But it also squeezes the edges off chaos.

  **ELIAS**
  It squeezes the edges off conscience, too. You said it yourself: you softened the answer. That's the second point. The party manufactures passion, but it's a specific kind of passion. It's not passion for justice; it's passion for the team. It's tribalism weaponized. You're asking people to care more about *beating the other guy* than *fixing the leak*.

  **MARA**
  (Leans against the table, crossing arms)
  Human beings are tribal, Elias. We always have been. If we don't channel that energy into a ballot box, it goes somewhere worse. The party gives people a home. It tells them, "You are not alone in wanting this." That "collective passion" you hate? It's the only thing that gets a single mother to knock on doors in the rain. She's not doing it for the zoning ordinance. She's doing it because she's part of the fight.

  **ELIAS**
  She's doing it for the win. And once the win happens, the machine resets. The passion evaporates or turns inward. Weil says the party is a machine that cannot stop. Its primary objective is its own perpetuation. Did you see the strategy call on Tuesday?

  **MARA**
  (Winces)
  The one where we debated the park budget?

  **ELIAS**
  The one where the consultant said we should oppose the park renovation because it's popular in the opposition's stronghold, even though our candidate promised to fund it. The room agreed. In thirty seconds, a promise became a liability. The party's growth superseded the candidate's word.

  **MARA**
  (Quietly)
  I know. I hated that. But if we fund the park, we lose the swing precinct. If we lose the swing precinct, the opposition funds the park *and* cuts the rent cap. It's chess. You're talking about it like it's theology.

  **ELIAS**
  It becomes theology when you ask us to suspend our judgment. That's the danger. You're training us to be soldiers, not citizens. So, here is the hard question you asked me to answer: If we abolish the parties, what happens? How do you run the chess game?

  **MARA**
  Exactly. How?

  **ELIAS**
  You change the board. Weil suggested that representatives should be elected without labels. No "D" or "R" next to the name. Just the person.

  **MARA**
  Then how do voters know what they stand for?

  **ELIAS**
  Through public, binding mandates. Before the election, a candidate signs a specific oath regarding specific issues. Not a vague "platform" that can be spun. A contract. "If elected, I will vote yes on X." If they break it, they are legally liable, or at least subject to immediate recall. The coordination happens around *issues*, not *teams*.

  **MARA**
  That's rigid. Politics is the art of compromise. What if the budget numbers change? What if a war starts? If you bind a representative's hands, they can't govern. They become puppets of the voters' whims at the time of election.

  **ELIAS**
  Better puppets of the voters than puppets of the party whip? Right now, the compromise happens in the smoke-filled room *after* the election, where voters can't see. At least with mandates, the compromise is transparent. You form coalitions in the legislature based on the issue, not based on who paid for your primary.

  **MARA**
  (Rubbing her temples)
  Okay. But who organizes the coalitions? Someone has to count the votes. Someone has to say, "If you support my school bill, I'll support your road repair." That's party leadership, Elias. You're just renaming it.

  **ELIAS**
  Maybe. But if there's no permanent party machine, that coalition dissolves after the vote. It doesn't become a permanent structure seeking self-preservation. It prevents the "congealing" you felt on the strategy call. You wouldn't have to soften your answer to Mrs. Gable because you wouldn't be speaking for a Machine. You'd be speaking for a Candidate bound by an oath.

  **MARA**
  (Starts stacking the last few chairs)
  I see the beauty in it. I do. It cleans the moral air. But I'm worried about the vacuum. Nature abhors a vacuum. If you kill the parties, the money doesn't disappear. It just goes darker. Super PACs, shadow groups, influencers. At least a party has a headquarters. You can protest outside a party office. You can't protest an algorithm.

  **ELIAS**
  (Picks up a stack of flyers)
  True. The machine might just go underground. But right now, the machine is wearing a badge. It's telling you that lying to Mrs. Gable is "strategy."

  **MARA**
  (Stops stacking. Looks at him.)
  I didn't lie. I... omitted.

  **ELIAS**
  The party taught you that omission is a virtue if it serves the growth of the organization. That's what I'm asking you to look at. Not whether you win the council seat. But what winning costs you.

  **MARA**
  (She picks up the last chair. She holds it for a moment, looking at the empty room.)
  If we do this... if we go without the "on message" script tomorrow. If we tell people the hard truth about the compromises. We might lose.

  **ELIAS**
  You might.

  **MARA**
  And if we lose, the other guy wins. And he doesn't care about the rent cap. Or the truth.

  **ELIAS**
  Then you have to decide if the campaign is a vehicle for the candidate, or a vehicle for the truth. Weil would say you can't serve both if the vehicle is owned by a party.

  **MARA**
  (She sets the chair down gently.)
  I can't abolish the party tonight, Elias. I have a budget to hit. I have volunteers who need to feel like they're on a winning team, or they won't come back Saturday.

  **ELIAS**
  I'm not asking you to burn it down tonight. I'm asking you to notice when the machine asks you to feed it your own judgment.

  **MARA**
  (She picks up her bag.)
  I notice. God, I notice. Every time I write a script. Every time I tell a volunteer to pivot instead of answer. It feels like... like I'm polishing a cage.

  **ELIAS**
  Then don't polish it too well. Leave a scratch.

  **MARA**
  (A small, tired laugh)
  A scratch. Like telling Mrs. Gable the truth?

  **ELIAS**
  Like telling Mrs. Gable, "The script says X, but honestly, the math is Y."

  **MARA**
  (She turns off the lights. The room goes dim, save for the exit sign.)
  If I do that, I'm not a good Field Lead.

  **ELIAS**
  Maybe you're a good citizen.

  **MARA**
  (Standing in the doorway)
  Come on. I'll buy you a coffee. You can tell me how to organize a coalition without a whip. But if you say "oaths," I'm ordering you a decaf.

  **ELIAS**
  (Following her out)
  I'll bring the draft language.

  *(They exit. The basement is empty. The stack of chairs stands in the corner, waiting to be unfolded again.)*
