          *   False Negative (FN): Releasing someone who does reoffend (public safety, victimization).
      *   **Legal/Ethical Standards:** Due process, individualized assessment, non-discrimination.
      *   **Base Rates:** Recidivism base rates *do* differ across demographic groups (a central premise of the impossibility theorem). Ignoring this leads to miscalibration.

