      *   **Equalized Odds:** *Very Strong.* Requires both FPR and FNR parity. In recidivism, base rate differences make this mathematically incompatible with Calibration (unless perfect prediction). Enforcing this usually requires different thresholds per group, which raises legal concerns about "different standards." However, error rate balance is ethically significant. But since it conflicts with Calibration (S), where does it fall? Usually, Calibration is prioritized for *risk scores* (probability estimates), while Equalized Odds is prioritized for *binary decisions*. Since the prompt says "risk-scoring tool," Calibration is more fundamental to the score itself. Equalized Odds is often too restrictive to be "Essential" if it breaks Calibration. Let's put it in **Tier A** (Important goal, but often sacrificed for Calibration in risk scores). *Correction:* Actually, in high-stakes justice, error rate disparity is a huge civil rights concern. However, Chouldechova specifically argues that for risk scores, Calibration is the non-negotiable for validity. Equalized Odds is often the *goal* of the decision rule, not necessarily the raw score. Let's keep Calibration higher.

      *   **Equal Opportunity (TPR/FNR parity):** *Important.* Focuses on public safety (catching recidivists) or liberty (not falsely accusing). Usually, in criminal justice, the harm of False Positives (locking up innocent) is weighed heavily against False Negatives. However, Equal Opportunity only looks at one side (usually TPR). If we prioritize FNR parity, we ensure we aren't missing recidivists in one group more than another. If we prioritize FPR parity, we ensure we aren't falsely accusing one group more. Equalized Odds covers both. Equal Opportunity is a relaxation. -> **Tier A**.

