  ### Justification for Ranking

  **Tier S (Essential): Calibration within groups**
  In a high-stakes risk-scoring context, the numerical output must represent a valid probability for every individual. If a score of "70%" implies a 70% recidivism rate for Group A but only 40% for Group B, the tool provides misleading information to judges, violating due process and individualized assessment standards. Calibration is the prerequisite for the tool's validity; without it, the score cannot be meaningfully interpreted or trusted, regardless of other fairness properties.

  **Tier A (Important): Equalized odds**
  This criterion ensures that error rates (both false positives and false negatives) are balanced across groups. In criminal justice, disparate error rates mean that one demographic bears a disproportionate burden of false imprisonment (false positives) or victimization (false negatives). While mathematically incompatible with Calibration when base rates differ, this is the primary ethical constraint to optimize via threshold selection once Calibration is secured.

  **Tier B (Nice to have): Equal opportunity & Predictive parity**
  *Equal Opportunity* is a relaxation of Equalized Odds (focusing only on true positives), offering partial protection against disparate harm but ignoring the other error type. *Predictive Parity* ensures that those flagged as high risk have the same likelihood of reoffending across groups; however, if Calibration (Tier S) is satisfied, Predictive Parity is largely inherent to the scores themselves. These are valuable secondary checks but are subordinate to the comprehensive error balance of Equalized Odds and the validity of Calibration.

  **Tier C (Rarely decisive): Demographic parity & Treatment equality**
  *Demographic Parity* requires equal selection rates regardless of base risk. In recidivism prediction, enforcing this ignores relevant risk factors and base rate differences, potentially leading to unsafe decisions (under-detaining high-risk groups) or unjust ones (over-detaining low-risk groups) to meet quotas. *Treatment Equality* balances the ratio of errors rather than the rates; it is a niche metric that can mask significant disparities in the absolute volume of harm inflicted on different groups.
