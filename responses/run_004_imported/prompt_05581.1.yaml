      *   *Tier A (Important):* Strong ethical goals, but might need to be traded off against S.
      *   *Tier B (Nice to have):* Desirable but often mathematically incompatible with S/A or less critical in this specific domain.
      *   *Tier C (Rarely decisive):* Often considered problematic or less relevant in high-stakes individual assessment.

