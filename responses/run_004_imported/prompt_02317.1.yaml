      *   **Context:** The user is a philosophy of mind student (seminar on Ramsey) and a research assistant in neural network interpretability (Olah/circuits program).
      *   **Core Conflict:** Ramsey's "Job Description Challenge" (JDC) argues that mere reliable tracking (covariance) makes something a *receptor*, not a *representation*. Representations must be structurally exploitable (like a map). The Circuits Program treats features (like edge detectors) as genuine representational units.
      *   **Specific Tension:** Edge detectors look like Ramsey's paradigmatic *receptors*. The Circuits Program claims they are *representations*.
      *   **Complication:** Superposition (features aren't one-to-one with neurons).
