      *   Do edge detectors allow inference? Not really. They allow detection.
      *   Does superposition change this? Superposition implies the system is optimizing for *capacity*, not *clarity of representation*. This aligns more with efficient causal signaling (receptors) than structural surrogacy (maps).
      *   *Final Decision:* The verdict should be that Ramsey would classify these as receptors. The Circuits Program is conflating "causally relevant internal state" with "representation." Superposition reinforces this by showing the encoding is optimized for bandwidth, not semantic clarity.

  8.  **Structure of the Response:**
      *   **Introduction:** Acknowledge the depth of the connection. State the roadmap.
