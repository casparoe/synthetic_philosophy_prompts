          2.  *Ontological Simplicity (or Parsimony):* How many *entities* or *assumptions* are required? (User's version).
      *   *Standard Philosophical View:* Occam's Razor is almost universally understood by philosophers and scientists as *Ontological Simplicity* (minimizing assumptions), not *Syntactic Simplicity* (minimizing syllables).
