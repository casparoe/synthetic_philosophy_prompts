answer: |-
  Good evening, everyone. For those who don't know me, I'm the person who writes the program notes. Apparently, because I'm currently hiding out in a Philosophy PhD program, our Artistic Director decided I'm the "smart person" qualified to tell you why we're doing *Don Giovanni* instead of *La Bohème*.

  I promise to keep the lecture brief. I know half of you are here for the art, and the other half are here because the open bar is significantly better than the one at the symphony gala.

  But since we're talking about choices: Why *Giovanni*? It's a fair question. *Bohème* is safe. It's beautiful, it's heartbreaking, and everyone understands it. People die of consumption; they sing about it; we cry. It makes sense.

  *Don Giovanni*, on the other hand… it's weird. A man seduces women, kills a father, invites a stone statue to dinner, and then gets dragged to hell while the orchestra plays in D minor. To the uninitiated, it sounds ridiculous. And I know some of you are thinking: "Why do people sing when they should be speaking? Why sing when they're dying? It's unnatural."

  The philosopher Bernard Williams, who wrote brilliantly about opera, argued that this complaint misses the point. He said that if opera feels "absurd," that isn't a bug in the system. It's the feature.

  Williams suggested that normal speech is for normal life. But when human passion reaches a certain intensity—when we are facing death, or damnation, or absolute desire—words alone aren't enough. We *need* the music. The "absurdity" of singing while dying isn't an attempt to be realistic. It's an admission that reality has broken open.

  And that is why we aren't doing *Bohème* tonight. *Bohème* is about looking back with regret. *Don Giovanni* is about refusing to look back at all.

  Williams wrote that Giovanni isn't just a villain; he is a force of energy that exists only in the present tense. He refuses to repent. He refuses to change. He would rather go to hell than stop being who he is. That is terrifying. It's also incredibly vital.

  Staging this in a small, perpetually broke company is a risk. It would be easier to sell tickets to the safe tragedy. But if we only did the safe things, we wouldn't be making opera. We'd be making museum exhibits.

  This brings me to you. To our donors in the room: thank you. You could fund the safe bets. You could fund the *Bohèmes* of the world where everyone knows the ending. But you're here. You're funding the statue at dinner. You're funding the absurdity. You are allowing us to present art that doesn't just comfort you, but challenges you.

  To the musicians, the singers, and the staff: thank you for making the impossible sound inevitable.

  And to everyone else: Please, enjoy the wine. Enjoy the absurdity. And if you find yourself wondering why anyone would sing while they're being dragged to hell, just remember Bernard Williams: Because sometimes, speaking just isn't enough.

  To *Don Giovanni*, and to this company. Cheers.
