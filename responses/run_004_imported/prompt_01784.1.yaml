          *   Round 2 (Mia/SIA): Explain SIA. Verdict: Valid counter, cancels math.
          *   Round 3 (Kai/Presumptuous): Explain the objection. Verdict: Strong point against SIA.
          *   Round 4 (Mia/Reference Class): Explain the ambiguity. Verdict: Strong point against DA's rigidity.
      *   *The "Missing Pieces":*
