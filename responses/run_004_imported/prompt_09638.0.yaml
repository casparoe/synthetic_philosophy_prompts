          *   Must cover incomplete descriptions (uniqueness problem).
          *   Must cover negative existentials (Meinongian worries).
          *   Each question needs a specific follow-up keyed to likely defensive moves.
      *   **Tone:** Professional but probing (colleague-to-colleague, podcast format).

  2.  **Deconstruct the Guest's Position (Hardline Russellianism):**
      *   *Core Thesis:* "The F is G" means $\exists x (Fx \land \forall y (Fy \rightarrow y=x) \land Gx)$.
      *   *Consequences:* If nothing is F, the sentence is false (not truth-valueless). If multiple things are F, the sentence is false. Names are disguised descriptions (or directly referential, but descriptions are quantificational). No semantic ambiguity between referential and attributive uses.
      *   *Common Defenses:* Pragmatics (Grice/Kripke), Domain Restriction, Scope distinctions.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Donnellan/Kripke.*
          *   *Draft:* What about Donnellan's distinction?
          *   *Refinement:* Need to press on whether pragmatics *really* explains the intuition.
          *   *Follow-up:* She'll likely say it's a Gricean implicature. Push on the *systematicity* of the error.
          *   *Question 1:* Focus on the intuitive gap between speaker meaning and semantic content.
          *   *Follow-up:* If she cites Kripke's "speaker's reference," ask about the cognitive reality of that distinction.

      *   *Requirement 2: Strawson/Presupposition.*
          *   *Draft:* Why is 'King of France is bald' false and not neither?
          *   *Refinement:* Focus on the communicative reaction. We don't say "False," we say "Wait, there is no King."
          *   *Follow-up:* She'll likely say logic requires bivalence. Push on whether logic should track linguistic practice.
          *   *Question 2:* Focus on the reactive attitude of the listener.
          *   *Follow-up:* Challenge the bivalence commitment as dogmatic.

      *   *Requirement 3: Incomplete Descriptions.*
          *   *Draft:* What about 'the table'? There are many tables.
          *   *Refinement:* Focus on domain restriction. Is it semantic or pragmatic?
          *   *Follow-up:* She'll say "context restricts the domain." Push on *how* that restriction is encoded semantically.
          *   *Question 3:* Focus on the uniqueness clause failing in ordinary contexts.
          *   *Follow-up:* Ask about the "hidden variable" argument (Stanley/Szabo) vs. pure pragmatics.

      *   *Requirement 4: Negative Existentials.*
          *   *Draft:* How do you handle 'The King of France doesn't exist' without Meinong?
          *   *Refinement:* Russell uses scope distinctions. But does that match the natural language intuition?
          *   *Follow-up:* She'll use wide vs. narrow scope. Push on the ambiguity intuition.
          *   *Question 4:* Focus on the truth of negative existentials about non-existents.
          *   *Follow-up:* Challenge the scope ambiguity as ad hoc.

      *   *Filling the remaining 4-6 questions (General Hardline Pressure):*
          *   *Question 5 (Names vs. Descriptions):* If descriptions are quantificational, what about names? Kripke's modal argument. Does she go Fregean or Millian? Let's assume she keeps descriptions Russellian but might separate names. Let's press on the parallel.
          *   *Question 6 (Logical Form vs. Surface Form):* Russell sacrifices surface grammar for logical form. Is this cost too high for natural language semantics?
          *   *Question 7 (Acquaintance):* Russell relied on acquaintance. Does she keep that? If not, how do we grasp the proposition?
          *   *Question 8 (Communication/Efficiency):* If the semantic content is often false (due to incomplete descriptions), why is communication so successful?
          *   *Question 9 (Predicative Uses):* "He is the winner." Not quantificational. Does she need ambiguity here? (Hardliners hate ambiguity).
          *   *Question 10 (The Book/Contribution):* Tie it back to her specific contribution. What's the *new* argument?

  4.  **Refining and Polishing:**
      *   Make sure the tone is conversational but sharp.
      *   Ensure the follow-ups are specific to the "standard Russellian escape routes."
