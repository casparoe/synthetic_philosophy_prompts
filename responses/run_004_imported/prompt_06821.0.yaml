answer: |-
  This is a classic and painful example of the **sunk cost fallacy** compounded by **escalation of commitment**. While your student and her opponent feel they are reasoning carefully, they are likely reasoning carefully *from a false premise*.

  Here is a framework you can use to advise her, distinguishing between rational persistence and irrational compounding of error.

  ### 1. The Economic Principle: Marginal Analysis
  The principled way to distinguish rational persistence from irrational stubbornness is **marginal analysis**.

  *   **Rational Decision-Making:** Decisions should be based *only* on future costs and future benefits. The money already spent ($200,000+) is gone. It cannot be recovered by winning, nor saved by losing. It is irrelevant to the decision of what to do *tomorrow*.
  *   **The Test:** She must ask: *"If I were stepping into this case today, with no money yet spent, knowing the future costs and the potential recovery, would I file this lawsuit?"*
      *   **Potential Recovery:** $50,000 (contract value) + potentially some legal fees (depending on jurisdiction/contract clauses, but rarely 100%).
      *   **Future Cost:** Likely another $50,000–$100,000+ to get to trial/judgment.
      *   **Probability:** No lawsuit is 100% certain.

  If the answer to the test is "No" (which it almost certainly is), then continuing is irrational. The fact that they have already spent $200,000 does not make the next dollar of legal spend any more valuable; it merely increases the total loss.

  ### 2. The Psychological Trap: Loss Aversion
  You noted both parties are "shrewd and level-headed." This makes the situation more confusing for your student, as she assumes intelligence immunizes against error. It does not.

  This behavior is driven by **Prospect Theory** (specifically loss aversion).
  *   **The Frame:** They do not view the $200,000 as a cost of doing business; they view it as a *loss* that must be erased.
  *   **The Risk:** Humans are risk-averse when it comes to gains, but **risk-seeking when it comes to losses**. Faced with a sure loss (settling now admits the $200k is wasted) vs. a gamble (spend more to possibly recover), shrewd people often gamble irrationally to avoid realizing the loss.
  *   **The Ego:** For business owners, litigation often becomes personal. Settling feels like admitting defeat or weakness, whereas "fighting for principle" feels like virtue. This is emotional reasoning dressed up as strategic reasoning.

  ### 3. The Game Theory Aspect: War of Attrition
  Currently, this dispute has transformed from a contract claim into a **War of Attrition**.
  *   The original $50,000 claim is no longer the prize. The prize is now "not being the one who blinked first."
  *   Both sides are waiting for the other to run out of money or will.
  *   **The Nash Equilibrium:** In a pure war of attrition, both parties lose value until one capitulates. Since both have identical incentives to wait, they remain locked in a sub-optimal equilibrium.
  *   **Rationality Check:** In a war of attrition, it is only rational to continue if you have a credible reason to believe your opponent has less capacity to endure than you do. If both are equally solvent and stubborn, the rational move is to negotiate a coordinated exit.

  ### 4. Are There Valid Non-Monetary Reasons to Continue?
  To be thorough, you should ask her if there are **signaling benefits** that outweigh the financial loss. Sometimes, burning money is rational if it buys something else.
  *   **Reputation:** Does fighting this signal to *other* suppliers that she does not tolerate breaches?
      *   *Counter-argument:* It also signals to potential partners that she is litigious and prone to escalating conflicts disproportionately.
  *   **Precedent:** Is this a test case for a larger legal strategy? (Unlikely for a $50k contract).
  *   **Principle:** Is the moral satisfaction of "being right" worth $100,000+ of *future* post-tax income?

  If she cannot identify a specific, monetizable strategic benefit to continuing that exceeds the *future* legal costs, then the decision is purely emotional.

  ### 5. Actionable Advice for Your Student
  She needs a mechanism to settle without feeling she has "wasted" the prior investment.

  1.  **Reframe the Settlement:** Settlement is not "admitting the past money was wasted." It is "investing in stopping the bleeding." It is the purchase of certainty and the cessation of future loss.
  2.  **The "Without Prejudice" Offer:** She should authorize her counsel to make a confidential settlement offer that allows the other side to save face.
  3.  **Mediation:** A third-party mediator can help both principals voice the "sunk cost" frustration without admitting it to the opposing counsel. A mediator can explicitly tell both parties, "You are both spending good money to chase bad money."
  4.  **The "New CEO" Exercise:** Ask her to imagine she is selling the company today. The buyer would demand this litigation be settled immediately to remove liability. Would she settle then? If so, why is her current self less rational than a hypothetical buyer?

  ### Summary for Your Reply
  You can tell her that **rationality is forward-looking.**
  *   **Compounding a Mistake:** Basing decisions on recovering past expenditures (Sunk Costs).
  *   **Rational Persistence:** Basing decisions on the Net Present Value of *future* actions (Marginal Analysis).

  Since the future costs of litigation almost certainly exceed the expected value of the recovery ($50,000 $\times$ Probability of Win), continuing is economically irrational. The fact that they are reasoning "carefully" only means they are efficiently digging a deeper hole. The shrewdest business move now is to treat the $200,000 as a tuition payment for a hard lesson in risk management, and cut the loss.
