      *   *The "Principled Way":* The distinction lies in whether the decision is based on *marginal* analysis (future costs/benefits) vs. *average* analysis (total spent vs. total gain).
      *   *The "Shrewd Businesspeople" Paradox:* Smart people fall for this because they frame it as "not losing" rather than "maximizing gain." Loss aversion (Prospect Theory).
      *   *The Settlement Dynamic:* Both are waiting for the other to blink. This is a Prisoner's Dilemma/War of Attrition. They need a mechanism to coordinate on settlement.

