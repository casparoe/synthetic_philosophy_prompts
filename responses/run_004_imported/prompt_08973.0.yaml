      *   *Part II:* The empirical/practical observations. 4 maxims. (1) No sufficient number of trustworthy witnesses. (2) Human propensity for wonder/surprise. (3) Miracles happen mostly among "ignorant and barbarous" nations. (4) Contradictory miracles of different religions cancel out.
      *   *The Debate:* Is Part II just illustrative fluff for Part I? Or is it a separate, evidential argument?
      *   *Scholarly Consensus (General):* Most modern scholars (like John Earman, Robert Fogelin, Peter Millican) treat them as distinct but complementary. Part I is *a priori*/conceptual (or based on the definition of law). Part II is *a posteriori*/empirical.
      *   *The "Independent" Question:* Could Part II stand alone? Yes, it argues that as a matter of fact, testimony *never* meets the bar. Could Part I stand alone? Yes, it argues that conceptually, the bar is set so high it's practically unreachable.
