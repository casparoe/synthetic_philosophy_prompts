      *   **Key Distinction 2: Defeasibility.** Reid admits credulity is "unlimited in children" but checked by experience later. This isn't reductionism (building trust from scratch); it's *defeasibility* (trust is default, overridden by red flags). This is crucial for the jury duty connection.
      *   **Key Distinction 3: The Burden of Proof.** Reductionism puts the burden on the hearer to prove reliability. Reid shifts it: Trust is the default state of nature. The "tally" explains *why* the default is safe, not *how* the hearer accesses it.
      *   **Synthesize:** The "tally" passage isn't providing a premise for the believer; it's providing a *vindication* of the believer's right to trust without premises. It blocks the Reductionist's challenge.
