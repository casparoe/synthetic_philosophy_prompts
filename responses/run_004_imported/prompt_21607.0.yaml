          *   *Hobbes's likely reaction:* He would be skeptical. The "sword" works because men fear death/pain. Does code fear anything? If the agents are humans *using* code, the human can still renege on the *use* of the code. If the agents *are* the code (AI), Hobbes might be intrigued, but he'd ask: Who compiled the code? Who holds the server?

      *   *Point 2: Transparency and "Secrets of the Heart".*
