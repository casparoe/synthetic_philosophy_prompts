          *   *However*, if the agents are *AIs* acting on behalf of states (or as sovereign entities themselves), Hobbes might see this as the only way sovereigns could cooperate. Since there is no global Leviathan, they need a mechanism that binds them without a superior. Program Equilibrium offers binding *logic* rather than binding *force*.
          *   *But:* Hobbes insists on *power*. Logic isn't power unless it physically constrains action. If an AI can rewrite its own code (self-modification), the proof breaks. Hobbes would demand a power that prevents self-modification.

  5.  **Drafting the Argument (Iterative refinement):**

