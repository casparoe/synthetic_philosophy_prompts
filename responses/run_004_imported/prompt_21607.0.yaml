      *   *Point 3: Human Nature and Vainglory.*
          *   Humans are prone to error and passion. Even if I show you code, I might hack your execution environment. Or I might be irrational.
          *   Hobbes thinks humans are roughly equal. Program Equilibrium often assumes computational parity or specific logical structures.
          *   *Key Hobbesian Insight:* Pride makes men think they can outsmart the system. A human might think, "I can trick FairBot," or "I can hide a backdoor." This uncertainty restores the state of nature.

      *   *Point 4: Sovereigns and AI.*
