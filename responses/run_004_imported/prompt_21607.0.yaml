      *   *Section 1: The Sword vs. The Proof.* Hobbes requires a change in *incentives* (fear of punishment). Program Equilibrium relies on a change in *predictability*. Hobbes would argue that without a power to punish the *hiding* of code or the *tampering* of execution, the transparency is just a "word."
