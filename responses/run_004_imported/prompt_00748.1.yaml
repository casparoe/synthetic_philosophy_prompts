      *   Part 2: The User is Also Right (The Uncle's version is likely "Vicious"). Explain the difference between *mutual support* and *circular proof*.
      *   Part 3: The "Input" Problem (The Anchor). This is the killer argument. Coherentism needs observation.
      *   Part 4: Systemic Virtues. Coherentism requires simplicity/explanatory power, not just consistency.
