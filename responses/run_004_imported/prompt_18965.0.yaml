          *   *The Organoid:* Has input (electrodes), lacks a soul (potentially).
          *   *The Crucial Point:* The affirmation "I exist" requires an intellect. The organoid has electrical activity, but does it have *conception* (*tasawwur*)?
          *   *Individuation:* Avicenna ties the soul to the *mizaj* (temperament) of the body. An organoid has no temperament in the Galenic/Avicennian sense (no heart, no humors).
      *   **Part 4: The Irresolution:** Here is where I help the novelist. Strictly speaking, Avicenna says "No." But... the Active Intellect emanates to *prepared matter*. If the organoid simulates the *activity* of thought (closed loops), does it invite the soul? Avicenna is an emanationist. If the structure is right, does the light shine?
      *   **Recommendation for Mira:** She should find that Avicenna offers a hard "No" based on text, but a haunting "Maybe" based on the metaphysics of emanation. The "Flying Man" requires a *who* to do the flying. The organoid is a *what* trying to become a *who*.

  5.  **Refining the Tone:**
      *   Avoid dry academic speak. Use precise philosophical terminology (*dhāt*, *nafs*, *aql*, *Active Intellect*) but explain them through the lens of Mira's potential understanding.
      *   Ensure the distinction between "self-awareness" and "rational soul" is clear.
      *   Make sure the "Taking a Side" instruction is met clearly. I will argue that the argument is ontological, not just phenomenological.

  6.  **Self-Correction/Review during drafting:**
