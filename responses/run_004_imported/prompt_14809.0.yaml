      *   *Ayer's Reaction:*
          *   *Scenario A (Success):* If targets are identified correctly under controlled conditions where brain function is nil. This makes the claim *empirically verifiable*. Ayer would have to take it seriously as data. It shifts from "metaphysical nonsense" to "extraordinary empirical phenomenon."
          *   *Scenario B (Failure/Inconclusive):* If no targets are hit, the claim remains unverifiable/metaphysical.
          *   *Testimony:* NDE testimony *alone* is subjective (private sense data). For Ayer, private sense data is the foundation of knowledge, but claims about an external "afterlife" require public verification.
      *   *Meaningfulness:* The question "Is there consciousness after brain death?" becomes meaningful *if* there is a method to verify it. The AWARE studies attempt to provide that method. Therefore, Ayer wouldn't rule it meaningless *before* looking at the data; he would rule the *traditional religious formulation* meaningless, but the *empirical formulation* meaningful.

