answer: |-
  The monitor beside my bed beeps with a lazy, irregular rhythm, like a clock running out of battery. It is the only sound in the white room, aside from the hum of the air filtration system. My chest feels heavy, as if a slab of concrete has been settled onto my sternum. The technicians told me the dissolution beam misfired. They said it with the flat, apologetic tone of customer service agents refunding a damaged package. They did not say *sorry* for leaving me here, a discarded shell with a failing heart and three days of oxygen left in my tank.

  They did say the transmission was successful. *He* is on Mars.

  I close my eyes and try to locate the boundary of myself. It used to be simple. I was the thing behind my eyes, the sum of my scars and memories. Now, the map is blurred. I remember walking into the booth in London. I remember the smell of ozone, the cold metal under my palms. I remember thinking about how much I wanted to see the Mars colony, how much I wanted to leave the gray rain of Earth behind.

  And I know, with a certainty that feels like theft, that *he* remembers it too. But for him, the memory ends with a flash of light and a wake-up in the red dust. For me, the memory continues into this pain. I am the draft; he is the final copy.

  "Signal incoming," a nurse says. She doesn't look at me. She looks at the screen mounted on the wall. "Quantum link is stable. You have ten minutes before the bandwidth throttles."

  I nod, though the movement makes my vision swim. "Put him through."

  The screen flickers to life. The resolution is perfect, unnervingly so. It shows a room bathed in warm, artificial light. There are plants—real ones, thriving—on a shelf in the background. And there, sitting in a chair that looks far too comfortable, is a man wearing my face.

  He looks rested. His skin has the faint, healthy flush of someone whose blood circulates without obstruction. He is wearing the blue tunic of the colony, the one I packed in my suitcase three weeks ago, the one I never got to wear.

  "Hello," he says. His voice is mine, but deeper, resonant with lung capacity I lost years ago.

  "Hello," I say. My voice sounds like grinding gravel.

  We stare at each other. It is like looking into a mirror that shows you not as you are, but as you were, or perhaps as you should have been. I feel a surge of jealousy so sharp it nearly stops my heart. He is living the life I paid for. He is going to walk out of that room, eat a meal, sleep, and wake up tomorrow. I am going to lie here and count the beeps until they stop.

  "How is the… adjustment?" I ask.

  "Strange," he admits. He leans forward, resting his elbows on his knees. A gesture I make when I'm thinking. "I walked to the window an hour ago. I looked at the landscape. I felt… joy. Pure joy. And then I felt guilty about it."

  "Why?"

  "Because I knew you were hurting." He pauses. "I know you're hurting. I can feel the phantom ache in my chest, even though the heart is new. It's like a ghost limb."

  "It's not a ghost," I say bitterly. "It's the original."

  "I know." He doesn't flinch. He doesn't look away. That's the thing that unsettles me most. If he were a stranger wearing my skin, he would look away. But he looks at me with the intimacy of self-recognition. "Sarah called me."

  The name hits me like a physical blow. Sarah. My wife. She was supposed to come to the spaceport to say goodbye. Instead, she stayed home, unable to watch the scan.

  "What did she say?"

  "She cried," he says softly. "She asked if I remembered the anniversary trip to Venice. The one where we got lost in the rain."

  "I remember," I whisper. "The gelato melted before we could eat it."

  "I remember too," he says. "I remember the taste of the pistachio. I remember the cold rain on my neck. I remember loving her in that moment." He looks down at his hands. They are my hands, but the knuckles aren't swollen. "Elias, she asked me if I was still her husband."

  The room seems to tilt. This is the question, isn't it? Not the metaphysical puzzle the professors debate in their seminars, but the practical, brutal reality of it. If he remembers loving her, and I remember loving her, and I am dying while he is holding her hand across the void… who is the widower?

  "What did you tell her?"

  "I told her I didn't know," he says. "But I told her I wanted to be."

  I should be angry. I should scream that he is a copy, a simulation, a thief. But I look at the plants behind him. I look at the health in his cheeks. I think about the pain in my chest, the gray sky outside this facility, the slow, suffocating end that awaits me. I think about Sarah, alone in our house, waiting for a husband who is technically dead but functionally alive.

  If I claim him, I condemn her to grief. If I release him, I condemn myself to erasure.

  "Do you feel like me?" I ask. It's a childish question, but it's the only one left.

  He thinks for a moment. The silence stretches, filled only by the lag of the transmission and the beep of my monitor.

  "I feel like the version of you that made it," he says finally. "I don't feel like a copy. I feel like… the continuation. But I know that doesn't help you."

  "No," I say. "It doesn't."

  I cough, and a spark of pain flares in my ribs. He flinches in sympathy. The connection is absolute. We are two radios tuned to the same frequency, but one is losing power.

  "I'm scared," I admit. I haven't said it to the doctors. I haven't said it to the priest who visited yesterday. But I can say it to him. Because he is me.

  "I know," he says. "I'm scared too. Not of dying. But of living without you. Of knowing that you had to end for me to begin."

  "It's not beginning," I say. "It's branching. I'm the branch that got pruned."

  "Maybe," he says. He leans back, and for a moment, the mask slips. He looks tired. Not physically, but existentially. "But Elias… when I close my eyes, I don't see darkness. I see the future. I see us growing old. I see Sarah laughing. And I know you wanted that. You wanted it more than anything."

  "I wanted to be the one who had it."

  "I know." He looks directly into the camera, directly into my eyes. "But I am the one who can have it. Does it matter which body holds the memory? Does it matter which heart beats, as long as the love remains?"

  It is a comforting thought. It is also a terrifying one. It suggests that *I* am not the vessel, but the contents. And if the contents are poured into a new jar, the old jar doesn't get to be jealous. It just gets to be broken.

  The screen flickers. A warning light blinks in the corner. Bandwidth throttling.

  "Time," I say.

  "Right." He sits up straighter. "I'll go to her. I'll tell her… I'll tell her you said goodbye."

  "Tell her the truth," I say. "Tell her I was brave."

  "You were," he says.

  "Tell her…" I struggle for breath. The concrete on my chest is heavier now. "Tell her I'm not gone. Not really."

  He nods. His eyes are wet. My eyes are dry. "I will."

  "Live well," I say. It sounds like an order. It sounds like a plea.

  "I will," he says. "For both of us."

  The screen goes dark. The room returns to the sterile white silence. The monitor beeps. *Beep… beep…… beep.*

  I lie back and stare at the ceiling. I am dying. That is a fact. My cells are shutting down, my heart is stumbling. But somewhere, across the dark, a man is standing up. He is walking to the door. He is going to hold my wife. He is going to breathe the recycled air of the colony and feel the sun on his face.

  Is this death? Or is it just a change of address?

  I close my eyes. I try to imagine the Mars room. I try to feel the warmth of the artificial light. For a second, just a second, the pain in my chest fades. I feel the phantom sensation of a new heart beating strong and steady, not here, but there.

  I am the branch line. I am the footnote. But as the darkness creeps in at the edges of my vision, I realize that the story isn't ending. It's just being written by a hand I no longer control.

  The monitor slows. I do not fight it. I let the memory of the red dust fill my mind, waiting to see if I will wake up in it, or if I will simply cease, leaving him to be the only *I* that matters.

  *Beep……… beep……………*

  Silence.
