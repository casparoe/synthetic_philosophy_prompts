prompt: |-
  I'm running a graduate seminar on social ontology this term, and last week we worked through David Lewis's *Convention*. I'd like some help sharpening a comparison for the next session, which turns to the game-theoretic literature on the evolution of norms, before I finalize the discussion questions for my students.

  Lewis analyzes a convention as a regularity in action that solves a recurring coordination problem: everyone conforms, everyone expects everyone else to conform, everyone prefers to conform given that others do, some alternative regularity could equally well have served the same purpose, and — crucially — all of this is common knowledge among the population, a notion Lewis essentially introduces into philosophy for this purpose. My students always balk at that last clause: it seems to commit Lewis to crediting ordinary convention-followers with an infinite hierarchy of higher-order beliefs — I expect you to conform, I expect you to expect me to conform, and so on — that no finite mind actually entertains.

  Brian Skyrms's evolutionary treatment of the same subject matter looks like a rival strategy for reaching the same destination at a fraction of the cognitive cost. On his account, the very same coordination regularities — including Lewis's own signaling conventions — can be driven to fixation by replicator dynamics or simple reinforcement learning, where no party represents anyone else's beliefs at all, let alone achieves common knowledge of them; a shared history of interaction and selection does the work that Lewis assigns to shared cognition. I'd like you to compare the two explanatory strategies in some detail: does Skyrms's dynamical story actually reproduce everything Lewis's account was designed to explain — the arbitrariness of the equilibrium selected, the self-perpetuating expectations that sustain it, the sense in which conforming parties are following a convention rather than each merely doing what happens to be individually best — or does something get lost once common knowledge drops out of the picture? I am particularly interested in whether an evolved regularity can ever be a norm in the sense that carries genuine normative force, something one can be faulted for violating, or whether that normative residue is only available once Lewis's mutual, common-knowledge-backed expectations are in place. Tell me which account is doing more of the real explanatory work in your assessment, and whether the two are ultimately competitors or could be combined so that each covers a different part of the phenomenon.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Graduate seminar instructor in social ontology.
      *   **Context:** Previously covered David Lewis's *Convention*. Next session covers game-theoretic literature on the evolution of norms (specifically Brian Skyrms).
      *   **Task:** Sharpen a comparison between Lewis and Skyrms for discussion questions.
      *   **Key Issues:**
          *   Lewis: Common knowledge (CK), infinite hierarchy of beliefs, rational choice, arbitrariness, normative force (fault/blame).
          *   Skyrms: Evolutionary dynamics (replicator/reinforcement), low cognitive cost, no representation of beliefs, selection history.
          *   **Core Question:** Does Skyrms reproduce *everything* Lewis explains (arbitrariness, self-perpetuation, "following" vs. "doing")? Is normative force lost without CK? Which does more explanatory work? Are they competitors or complementary?

  2.  **Deconstruct the Lewis vs. Skyrms Debate:**
      *   *Lewis's Account:* Rationalist, epistemic, synchronic (mostly). Focuses on the *state* of convention. Requires agents to be rational maximizers with CK. Solves the "which equilibrium?" problem via salience/CK. Normativity comes from mutual expectations and conditional preferences (letting others down).
      *   *Skyrms's Account:* Evolutionary, dynamic, diachronic. Focuses on the *process* of convention formation. Agents can be "dumb" (simple learners). Solves the "how did we get here?" problem via selection dynamics. Normativity is trickier (often reduced to stability or punishment strategies).
      *   *The Tension:* Lewis requires too much cognition (the "finite mind" objection). Skyrms requires too little (the "normativity/agency" objection).

  3.  **Address the Specific Prompts:**

      *   **Does Skyrms reproduce Lewis's features?**
          *   *Arbitrariness:* Yes, evolutionary dynamics often show multiple stable equilibria (e.g., signaling systems). Path dependence explains *which* one, but it's still arbitrary in the Lewisian sense (could have been otherwise).
          *   *Self-perpetuating expectations:* Skyrms replaces *expectations* with *propensities* or *strategies*. It looks like expectation from the outside, but isn't represented inside.
          *   *Following vs. Doing:* This is the weak point for Skyrms. If I'm a replicator or a simple learner, am I "following" a rule or just behaving? Lewis needs intentionality for "following."
          *   *Normative Force:* Lewis has a strong case here (mutual obligation based on expectations). Skyrms often reduces normativity to stability or the threat of sanction (evolutionary punishment). Genuine "oughts" are harder to derive from "is" of selection.

      *   **Does something get lost without Common Knowledge?**
          *   Yes, the *reason-giving* structure. For Lewis, CK provides the *reason* to conform (because I know you know...). For Skyrms, the reason is causal/historical (because it worked before).
          *   The "fault" aspect: You can fault a rational agent for violating CK expectations. Can you fault a learner for a maladaptive move? Only in the sense of "irrational" or "unfit," not necessarily "unfair."

      *   **Which does more explanatory work?**
          *   Lewis explains the *structure* of the normative relation *now*.
          *   Skyrms explains the *genesis* of the pattern *over time*.
          *   Verdict: They target different explananda (State vs. Process).

      *   **Competitors or Complementary?**
          *   Ideally complementary. Skyrms explains how we get to the equilibrium; Lewis explains what the equilibrium consists in once we are there (especially for reflective agents).
          *   However, there's a tension: If Skyrms explains it all, do we *need* Lewis's CK? (Eliminativism vs. Realism).

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the pedagogical value. Validate the students' objection to CK (it's a classic critique).
      *   *Section 1: The Cognitive Load vs. Evolutionary Dynamics.* Contrast Lewis's rationalism with Skyrms's naturalism. Highlight that Skyrms dissolves the regress problem by removing the need for representation.
      *   *Section 2: Arbitrariness and Equilibrium Selection.* Confirm Skyrms handles arbitrariness well (multiple basins of attraction). But note the difference: Lewis uses salience/CK to pick; Skyrms uses history/chance.
      *   *Section 3: The Normative Gap (Crucial Section).* This is the user's specific interest.
          *   Lewis: Normativity = Mutual reliance + Conditional Preference. Violation = Letting others down.
          *   Skyrms: Normativity = Stability + Punishment/Correlation. Violation = Loss of fitness/payoff.
          *   *Key Insight:* Skyrms explains *compliance*, Lewis explains *obligation*. Without CK, "fault" becomes "error" or "deviance," not necessarily "wrongdoing."
      *   *Section 4: "Following" vs. "Doing".* Intentionality. Lewis requires agents to conceive of the regularity. Skyrms allows "as-if" intentionality.
      *   *Section 5: Synthesis/Verdict.* Are they competitors?
          *   *Diachronic vs. Synchronic:* Skyrms = Genesis, Lewis = Constitution.
          *   *Competence vs. Performance:* Skyrms = How behavior looks, Lewis = How agents reason.
          *   *Recommendation:* Treat them as complementary layers, but acknowledge the reductionist threat Skyrms poses to Lewis's robust normativity.
      *   *Discussion Questions:* Draft 3-4 sharp questions for grad students. Focus on the normativity gap, the CK regress, and the complementarity.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to paint Skyrms as *just* biology. He deals with learning and deliberation too (*Evolution of the Social Contract* vs. *Signals*). He allows for some cognition, just not CK.
      *   *Nuance:* Lewis's CK isn't just infinite belief; it's a basis for reasoning. Skyrms replaces reasoning with causal history.
      *   *Normativity:* Be careful not to say Skyrms has *no* normativity. He discusses "norms" as stable equilibria. But is it *moral/social* normativity or just *statistical* normativity? That's the crux.
      *   *Tone:* Academic, rigorous, suitable for a seminar instructor.

  6.  **Final Polish:** Check against the prompt's specific questions (arbitrariness, self-perpetuation, following vs. doing, normative force, explanatory work, competitors vs. combined). Ensure all are answered. (The resulting output matches the detailed response provided previously.)

  7.  **Final Review of Discussion Questions:** Ensure they provoke debate, not just recall.
      *   Q1: CK vs. History (The cognitive cost).
      *   Q2: Normativity (Ought vs. Is).
      *   Q3: Complementarity (Genesis vs. Constitution).
      *   Q4: The "Following" condition (Intentionality).

  8.  *(Self-Correction)*: Wait, I should explicitly mention *Signals* (1996) vs. *Evolution of the Social Contract* (1998) if relevant, but keeping it general to "Skyrms's evolutionary treatment" is safer unless specific texts are needed. I will stick to the general evolutionary game theory approach Skyrms champions. I should also mention the "reflective equilibrium" aspect—Lewis is about what agents *know*, Skyrms is about what agents *do*.

  9.  **Finalizing the Output Structure:**
      *   Executive Summary.
      *   Detailed Comparison (Cognition, Arbitrariness, Normativity).
      *   Assessment of Explanatory Work.
      *   Competitors or Complements?
      *   Proposed Discussion Questions.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a pivotal transition in a social ontology seminar. Moving from Lewis to Skyrms shifts the ground from *rationalist epistemology* to *naturalistic metaphysics*. Your students' intuition about the cognitive cost of Common Knowledge (CK) is the standard entry point for this critique, but the deeper philosophical stakes lie in what is lost when we replace *reasons* with *causes*.

  Here is a detailed comparison of the two explanatory strategies, an assessment of the normative residue, and a set of discussion questions designed to sharpen the debate for your graduate students.

  ### 1. The Explanatory Strategies: Rationalism vs. Naturalism

  **Lewis's Rationalist Strategy:**
  Lewis is interested in the **constitution** of convention. He asks: *What is the state of affairs that obtains when a convention is in force?*
  *   **Mechanism:** Practical reasoning based on preferences and beliefs.
  *   **Role of CK:** CK is not merely a psychological burden; it is the *reason-giving structure*. I conform *because* I know you know I know... This recursive structure ensures that the equilibrium is self-referential and stable against reflective scrutiny.
  *   **Agency:** Robust. Agents must represent the regularity and the expectations of others to be "following" a convention.

  **Skyrms's Evolutionary Strategy:**
  Skyrms is interested in the **genesis** and **stability** of convention. He asks: *How could such a regularity arise and persist without a central coordinator or hyper-rational agents?*
  *   **Mechanism:** Selection dynamics (replicator dynamics, reinforcement learning).
  *   **Role of History:** Past success replaces future expectation. I conform because that strategy has been reinforced, not because I have a theory of your mind.
  *   **Agency:** Thin. Agents can be "as-if" rational. The system is rational even if the agents are not.

  ### 2. Does Skyrms Reproduce Lewis's Features?

  You asked whether Skyrms's dynamical story reproduces the specific features Lewis identified. The answer is mixed.

  **A. Arbitrariness (Yes)**
  Skyrms successfully captures Lewisian arbitrariness. In signaling games (e.g., *Signals*, 1996), there are multiple stable equilibria (e.g., "stop" means red vs. "stop" means green). Evolutionary dynamics show path dependence: which equilibrium is selected often depends on initial conditions or stochastic drift, not intrinsic superiority. This matches Lewis's criterion that an alternative regularity could have served the same purpose.

  **B. Self-Perpetuating Expectations (No, but...)**
  Skyrms does not reproduce *expectations*; he reproduces the *behavioral profile* of expectations. In Lewis's model, the expectation causes the action. In Skyrms's model, the history of reinforcement causes the action.
  *   *The Loss:* For Lewis, the expectation is part of the content of the agent's mind. For Skyrms, the "expectation" is an attribution made by the observer. The system acts *as if* it expects, but the agent need not represent that expectation.

  **C. "Following" vs. "Doing" (The Critical Gap)**
  This is where Skyrms struggles to match Lewis. For Lewis, to follow a convention is to act *on the basis of* the mutual expectation. It is an intentional act of coordination.
  *   In Skyrms's model, an agent might conform simply because they are hardwired or conditioned to do so. If a robot follows a traffic light due to programming, it solves the coordination problem, but we hesitate to say it is "following a convention" in the rich social sense.
  *   *The Risk:* Skyrms risks reducing convention to mere *habit* or *instinct*. Lewis requires that the agents recognize the regularity *as* a regularity.

  ### 3. The Normative Residue: Fault and Obligation

  This is the crux of your seminar's next session. Does normative force survive the drop from Common Knowledge to Evolutionary Stability?

  **Lewis's Normativity:**
  For Lewis, the normativity is grounded in **mutual reliance**.
  *   *The Obligation:* I ought to conform because I have led you to expect me to conform, and you are relying on that expectation to coordinate your action.
  *   *The Fault:* If I violate the convention without cause, I have *let you down*. I have frustrated the conditional preference we share. The blame is interpersonal.

  **Skyrms's Normativity:**
  For Skyrms, normativity is often grounded in **stability and sanction**.
  *   *The Obligation:* I ought to conform because deviating lowers my payoff (or fitness).
  *   *The Fault:* If I violate the convention, I am "irrational" or "unfit." In more advanced models (e.g., *The Evolution of the Social Contract*), norms are sustained by correlation devices or punishment strategies.
  *   *The Loss:* The "fault" here is often prudential or functional, not necessarily *social*. If I violate a signaling convention in Skyrms's model, communication breaks down and I lose utility. But have I *wronged* you?
  *   *Assessment:* Without the mutual knowledge of reliance (CK), the "ought" loses its deontic flavor and becomes hypothetical ("If you want to win, do X"). Lewis's CK transforms the hypothetical imperative into a social obligation ("We are in this together").

  **Verdict:** Something significant gets lost. Skyrms explains **compliance**, but Lewis explains **obligation**. Skyrms tells us why the pattern persists; Lewis tells us why we feel bound by it.

  ### 4. Explanatory Work: Competitors or Complements?

  **Which does more work?**
  *   **Skyrms** does more work on **emergence**. Lewis assumes the population is already at equilibrium and asks what holds it there. Skyrms explains how we get there from chaos. Lewis's account is historically thin; Skyrms's is historically thick.
  *   **Lewis** does more work on **intentionality**. If social ontology is about the nature of *social* reality (involving minds), Lewis captures the phenomenology of agreement better. Skyrms captures the *biology* of cooperation better.

  **Competitors or Complements?**
  They are best viewed as **complementary layers**, provided one accepts a dual-aspect view of social reality.
  1.  **Subpersonal/Causal Layer (Skyrms):** Explains how the behavioral regularity is established and maintained via learning/history. This addresses the students' objection about finite minds (we don't need actual CK to get the behavior).
  2.  **Personal/Normative Layer (Lewis):** Explains how reflective agents *interpret* and *sustain* that regularity once established. Once the pattern exists, agents *attribute* beliefs to one another. They start reasoning *as if* CK holds.

  **The Synthesis:** Skyrms explains the *origin* of the convention; Lewis explains the *status* of the convention once it is adopted by reflective agents. However, you must warn your students of the **Eliminativist Threat**: If Skyrms explains all the behavior without CK, is Lewis's CK just a folk-psychological fiction? If the behavior works without CK, do we need to posit CK at all? (This is the Harman/Kripke style objection to Lewis).

  ### 5. Proposed Discussion Questions

  Here are four questions designed to move your students beyond the "cognitive cost" objection and into the ontological and normative implications.

  **Q1 (The Cognitive Regress vs. Causal History):**
  Lewis claims Common Knowledge is necessary to distinguish a *convention* from a mere *coincidence of behavior*. Skyrms suggests evolutionary history does this work without the cognitive regress. If a population behaves *exactly* as Lewis predicts, but achieves it through Skyrmsian reinforcement learning without representing higher-order beliefs, has Lewis's definition been falsified, or merely naturalized? Does the *cause* of the regularity matter for its *ontology*?

  **Q2 (The Source of Normativity):**
  In Lewis's account, violating a convention involves letting down others who are relying on you (a normative failure). In Skyrms's account, violating a convention typically involves a loss of payoff or fitness (a prudential failure). Can an evolutionary account generate genuine *obligation* (an "ought" that binds me even when I could get away with violating it), or does it only explain *compliance*? Is "normative force" just a phenomenological gloss on stable equilibrium?

  **Q3 (Arbitrariness and Path Dependence):**
  Both accounts agree that conventions are arbitrary (other equilibria were possible). For Lewis, this arbitrariness is solved by salience and CK. For Skyrms, it is solved by historical accident and path dependence. Does the shift from "salience" to "history" change the nature of the convention? If our convention is purely the result of historical lock-in (Skyrms) rather than mutual recognition of salience (Lewis), are we less committed to it?

  **Q4 (Integration vs. Elimination):**
  Consider the possibility of a hybrid model: Evolutionary dynamics (Skyrms) create the behavioral regularity, and once established, reflective agents adopt Lewisian Common Knowledge as a *heuristic* to maintain it. Is CK best understood as a metaphysical requirement for convention (Lewis) or as a useful cognitive fiction that agents adopt to stabilize evolved patterns (Skyrms)? Which interpretation better preserves the idea that social ontology is distinct from behavioral biology?

  ### Recommendation for the Session
  I suggest framing the session not as "Skyrms refutes Lewis," but as "Skyrms challenges the *necessity* of Lewis's epistemic conditions."

  Encourage your students to ask: **Is social ontology about the *machinery* of social interaction (Skyrms) or the *experience* and *normative structure* of it (Lewis)?** If it is the latter, Lewis survives Skyrms. If it is the former, Skyrms may render Lewis's CK otiose. This distinction usually clarifies the "finite mind" objection immediately.
