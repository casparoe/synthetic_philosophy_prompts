  **Move 1 (Owen): 0**
  Owen is semantically defensible but decision-theoretically myopic. He is correct that no *causal* transaction occurs, and from a Causal Decision Theory (CDT) standpoint, calling it "trade" is misleading. However, in the context of Timeless or Functional Decision Theory (TDT/FDT), the "category error" is his: the substrate of interaction is the logical output of the decision algorithm, not physical causation. He correctly identifies the mechanism (parallel reasoning) but incorrectly infers that this precludes the functional label of "trade."

  **Move 2 (Mara): 1**
  Mara correctly identifies that standard trade is already largely evidential. When I hand over cash, I do so because I predict the clerk will hand over goods, not because my hand movement physically forces theirs. She successfully destabilizes Owen's reliance on "causal influence" as the defining feature of trade. She loses a point only because she doesn't yet distinguish between *evidential* correlation (which can lead to spurious reasoning) and *logical* correlation (which is required for acausal trade), a distinction Owen is implicitly worried about.

  **Move 3 (Owen): -1**
  Owen retreats to a weaker position. The existence of a "possible channel" (reputation, witnesses) is not a necessary condition for trade; one-shot anonymous trades occur without them. By insisting that the *in-principle impossibility* of a causal channel disqualifies the term, he is prioritizing metaphysical purity over functional equivalence. His suggested rename ("coordination via shared priors") is more precise, but his reasoning for *why* "trade" is forbidden relies on a causal fetish that decision theory is specifically trying to move past.

  **Move 4 (Mara): 2**
  Mara nails the functionalist perspective. She correctly isolates the core requirement: actions conditional on reliable models of the other. She identifies that physical channels are merely a common *instantiation* of correlation, not the *source* of validity. By distinguishing the practical difficulty (establishing the correlation) from the conceptual validity (whether it counts as trade), she dissolves Owen's objection. This is the standard FDT position: logical dependence is sufficient for decision-relevant linkage.

  **What They're Both Missing**
  They are fighting over semantics ("Is it trade?") while ignoring the substantive bottleneck: **heterogeneity and computational tractability.**

  1.  **Cooperation vs. Trade:** Most of their examples (Prisoner's Dilemma, superrationality) describe *acausal cooperation* (agents with identical or aligned utility functions). True *acausal trade* requires agents with *different* utility functions finding a Pareto improvement (e.g., I value paperclips, you value staples, we simulate each other to swap universe-patches). This is vastly harder than correlating on "Cooperate."
  2.  **The Simulation Burden:** Mara mentions "sufficiently transparent reasoners." For heterogeneous agents, this requires one agent to accurately simulate a mind with *different* values without corrupting its own utility function. Owen's skepticism about "shared priors" hints at this, but neither addresses that the computational cost of verifying the logical correlation might exceed the expected utility of the trade, rendering the concept practically vacuous even if conceptually sound.
  3.  **Logical Counterfactuals:** The core disagreement isn't about the word "trade," it's about whether logical counterfactuals ("If I decide X, then a logically similar agent in another branch decides Y") are ontologically robust enough to base decisions on. Owen treats the other agent's decision as a fixed fact (CDT); Mara treats it as a logical output dependent on her algorithm (FDT). They should be debating the validity of logical counterfactuals, not the dictionary definition of trade.
