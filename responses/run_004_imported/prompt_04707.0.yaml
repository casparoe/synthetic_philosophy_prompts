answer: |-
  The silence on Station 4 was not empty; it was heavy, like water behind a dam. Mara floated in the observation cup, her magnetic boots disengaged, drifting inches above the floor. Outside the thick quartz glass, the Vela Nebula was dying.

  It was not a violent death. It was a blooming. For the last six hours, the gas clouds had been collapsing into a spectrum of color that human eyes weren't evolved to process, yet somehow did. Violet bled into a gold that had no heat. It was a cathedral of light built in a vacuum, expanding at the speed of thought.

  It was the last beautiful thing in the universe. The entropy wave was three systems out. When it hit, the lights would go out forever.

  Mara's console chimed. A red bar pulsed at the bottom of her screen. *UPLOAD CAPACITY CRITICAL.*

  The Black Box was ready. It was a tungsten cylinder designed to survive the heat death, drifting forever in the dark. It was the only thing that would outlast the station. But the power cell was degraded. It had enough charge to encode and eject one packet of data. Just one.

  On the left side of the screen: **FILE: VELA_FINAL.mov**.
  On the right side: **FILE: LIFE_ARCHIVE.dat**.

  Mara pulled herself to the console. Her reflection in the dark glass looked tired. She was forty, but the isolation had carved decades into her face. She looked at the **LIFE_ARCHIVE**. It contained thirty years of correspondence with Elias. Every message, every voice note, every video log from their life on Earth before she took the posting.

  Three days ago, she had decrypted the final partition of that archive. A system error had exposed a hidden directory on Elias's local server, synced before the comms died.

  She hadn't told anyone. There was no one to tell.

  She opened the hidden file again. It wasn't about another woman. It was worse. It was a series of journal entries from Elias, written during the years she was up here.

  *"She is perfect because she is gone,"* he had written. *"Mara is the martyr. I don't have to deal with her moods, her aging, her needs. I love the idea of her sacrifice. It makes me feel noble by association."*

  He didn't love her. He loved the *shape* of her absence. He loved the projection of the Devoted Wife, a character she played from 40,000 kilometers away. The warmth she had felt, the fuel that had kept her warm in this freezing tin can, was based on a misreading. The object of her affection was a ghost she had painted on a blank wall.

  According to the logic of the world she knew, a love based on a lie was worthless. If you love a person who doesn't exist, you aren't loving; you're hallucinating. To preserve the archive was to preserve the evidence of the lie. But to include the truth—the decrypted journals—would be to poison the well. It would prove that the value of their connection was null.

  She looked back at the window. The Nebula shifted. A ripple of crimson shattered the gold. It was breathtaking. It was terrifying.

  No one would ever see this recording. The Black Box would drift. The odds of another consciousness finding it were effectively zero. It was beauty for beauty's sake. A song sung into a void where no ear would ever vibrate.

  If she chose the Nebula, she was saying that the light mattered even if no one saw it. That value existed independent of an observer.
  If she chose the Archive, she was saying that the truth of human connection mattered more than the silent light. But she would have to include the journals. She would have to admit that her life's emotional core was a fabrication.

  Her hand hovered over the haptic interface.

  The Nebula flared. A bridge of pure white light connected two dying stars. It was a moment of impossible geometry, a secret the universe was telling itself.

  Mara thought of Elias. She thought of the warmth she felt when his name popped up on the screen. Was that warmth less real because his intent was flawed? The feeling had kept her alive. But the feeling was a reaction to a fiction.

  If she sent the Archive with the journals, she vindicated reality. She said: *Truth is the price of value.*
  If she sent the Nebula, she vindicated the sublime. She said: *Beauty is the price of existence.*

  The console beeped. *POWER AT 15%.*

  She looked at the **LIFE_ARCHIVE**. If she deleted it, Elias would truly be gone. Not just dead, but unmade. But the Elias she mourned was already unmade; the journals proved he never existed. The man who wrote those words was a stranger who used her name.

  She looked at the **VELA_FINAL**. It was real. The photons hitting the quartz were real. The collapse of the matter was real. It required no permission to be magnificent. It required no witness to be true.

  The entropy wave hit the outer sensors. The station shuddered. The lights flickered and died, leaving only the glow of the console and the radiance from the window.

  Mara realized that keeping the Archive was an act of ego. It was a demand that *her* story, *her* pain, *her* verification of truth be the legacy. It was insisting that human relationships were the only metric that mattered.

  But the Nebula didn't care about her. It didn't care about Elias. It was simply, extravagantly *good*.

  If she chose the beauty, she accepted that she was small. She accepted that her heartbreak was not the center of the universe. She accepted that a thing could be precious even if it served no one.

  If she chose the truth of her love, she kept the human element central, but she tainted it with the reality that it was built on sand.

  The station groaned. The air recyclers stopped.

  Mara moved her hand.

  She highlighted **LIFE_ARCHIVE.dat**.

  She thought of Elias's face, the way he smiled in the videos. She knew now that the smile was for the camera, for the idea of the wife watching. It was a performance. To preserve it was to preserve a lie. To destroy it was to let the lie die.

  She pressed *DELETE*.

  The progress bar vanished. The space on the drive went dark.

  Then she highlighted **VELA_FINAL.mov**.

  She didn't do it for Elias. She didn't do it for humanity. She did it because the light outside was better than the memory inside. She did it because the universe deserved to have its beauty acknowledged, even if the only acknowledgment was a machine pressing a button in the dark.

  *UPLOAD INITIATED.*

  The console whined. The screen dimmed.

  Mara turned her chair fully toward the window. She took off her gloves. She pressed her bare palms against the cold quartz. She wouldn't watch the upload; she would watch the source.

  The Nebula pulsed, a final, deep violet heartbeat.

  She let herself feel the grief for Elias, the sharp sting of the betrayal. It was real pain, caused by a real discovery. But it was small. It was human.

  Outside, the light swallowed the dark.

  Mara closed her eyes, not to shut it out, but to hold it behind her lids. She let the beauty exist without her. She let the love die without a record.

  The Black Box ejected with a soft thud, a tiny seed of tungsten carrying the image of a flower that no one would ever smell, drifting into a night that would never end.

  Mara sat in the dark, and for the first time in thirty years, she didn't need to be loved to know she was here. She just needed to have seen.
