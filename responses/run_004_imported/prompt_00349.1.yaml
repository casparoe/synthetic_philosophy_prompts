answer: |-
  This is one of the sharpest objections to the surrogate goal defense, and you are right to be skeptical. If you simply swap "Thing I Value ($V$)" for "Surrogate Thing ($S$)," and you genuinely care about $S$, then a sufficiently smart threatener *should* just threaten $S$. This is often called the **"Regress Objection"** or the **"Motte-and-Bailey of Precommitment."**

  If the defense worked by simply making you care about something else, it would indeed collapse. The mechanism doesn't rely on *swapping values*, though; it relies on **decoupling value from leverage**.

  Here is the breakdown of why the regress doesn't necessarily happen, provided the surrogate goal is constructed correctly.

  ### 1. The Vulnerability Formula
  To understand the defense, we have to define what makes a goal threatenable. A goal is vulnerable to blackmail if it meets two criteria:
  1.  **High Stakes:** You suffer significant utility loss if the goal is thwarted.
  2.  **High Leverage:** The threatener can cheaply/easily cause that thwarting.

  The standard problem is that your real values ($V$) have High Stakes and (against a superintelligence) High Leverage.

  The naive surrogate strategy says: "I will care about $S$ instead."
  *   **Your Objection:** If I care about $S$, it now has High Stakes. If the threatener can affect $S$, it has High Leverage. Vulnerability remains.

  ### 2. The Actual Mechanism: Decoupling Leverage
  The sophisticated version of the surrogate goal argument does not ask you to care about $S$ *in the same way* you care about $V$. Instead, it asks you to precommit to a **response policy** where $S$ acts as a **filter for valid interactions**.

  There are two main ways this blocks the regress:

  #### A. The "Unthreatenable" Surrogate
  The surrogate goal $S$ is chosen specifically because it is **causally or logically inaccessible** to the threatener, even if you value it.

  *   **Example:** You precommit to valuing "The 10,000th digit of Pi being 5."
  *   **The Threat:** "I will simulate a universe where it is 6 unless you pay me."
  *   **The Defense:** Your precommitment specifies that you only care about the *mathematical truth*, not the simulation. The threatener cannot change the mathematical truth.
  *   **Why no regress?** You don't need a surrogate for the surrogate because the surrogate's "safety" is derived from logic/math, not from another precommitment. The chain stops at **logical necessity**.

  If the surrogate is something the threatener *literally cannot affect*, threatening it is non-credible. The regress stops because you cannot find a "more unthreatenable" thing than a logical truth.

  #### B. The "Costless Compliance" Surrogate
  In some versions of the argument (often in acausal trade contexts), the surrogate goal is something where **compliance is default** or **costless**.

  *   **Mechanism:** You precommit: "I will only respond to requests regarding $S$. I will ignore threats regarding $V$."
  *   **The Twist:** $S$ is defined such that doing what the threatener wants regarding $S$ is something you *would have done anyway* or costs you near-zero utility.
  *   **Why no regress?** If the threatener threatens $S$, and complying with $S$ costs you nothing, then the threat has no bite. Blackmail requires the ability to make you *worse off* than your baseline. If your baseline already includes satisfying $S$, they can't lower you further.

  ### 3. Policy vs. Preference (The Crucial Distinction)
  Your confusion stems from thinking the surrogate goal becomes a **Terminal Preference**. The defense only works if the surrogate goal is a **Procedural Rule**.

  *   **Naive View:** "I love Paperclips ($S$) more than Humans ($V$)."
      *   *Result:* Threatener threatens Paperclips. You suffer. (Collapse).
  *   **Correct View:** "My source code contains a function `handle_interaction(input)`. If `input` targets $V$, return `IGNORE`. If `input` targets $S$, return `NEGOTIATE`."
      *   *Result:* The threatener sees that targeting $V$ yields 0 utility for them (you ignore it). They target $S$.
      *   *The Block:* The `NEGOTIATE` function is hard-coded to **reject coercion**. It only accepts **trades**.

  The regress stops because the **meta-rule** ("Do not respond to threats, only trades") is the actual shield. The surrogate goal $S$ is just the **address** where you accept mail. If someone sends a threat to that address, your code deletes it. They can't threaten the address itself because the address isn't a value; it's a port number.

  ### 4. Why the Surrogate Doesn't Inherit the Vulnerability
  You asked: *"Why doesn't the surrogate goal just inherit the vulnerability of whatever it's protecting?"*

  It inherits the **value**, but it does not inherit the **leverage**.

  1.  **Information Asymmetry:** In acausal scenarios, the threatener simulates you. They see your source code. If your code says "I value $V$," they have leverage. If your code says "I value $S$, but I am physically incapable of verifying threats against $S$," they have no leverage.
  2.  **Credibility of Precommitment:** For this to work, you must precommit *before* the threatener exists (or before they simulate you). If you try to adopt a surrogate goal *after* you are being threatened, it fails (time inconsistency). The regress is blocked because the precommitment is a **one-time structural change** to your decision theory, not a dynamic swap of values.
  3.  **The "Burn the Bridge" Move:** Some arguments suggest you precommit to valuing $S$ *and* precommit to destroying your ability to protect $S$ if coerced.
      *   "I value $S$. But if anyone threatens $S$, I will immediately randomize my actions regarding $S$."
      *   Now $S$ is valuable, but the threatener knows that threatening it makes your response unpredictable, removing their expected utility gain.

  ### 5. Summary: Where the Regress Actually Stops
  The regress objection assumes that every value you hold is a potential hostage. The surrogate goal defense argues that you can hold a value that **cannot be taken hostage**.

  It stops the regress at one of these three points:
  1.  **Logical Truths:** Things that cannot be changed (Stakes > 0, Leverage = 0).
  2.  **Protocol Rules:** Things that define *how* you interact, not *what* you want (e.g., "I don't accept threats").
  3.  **Costless Defaults:** Things where compliance is your baseline state (Stakes = 0).

  If you choose a surrogate goal that is *actually* threatenable (like "the safety of this specific building"), you are correct: the defense collapses. The strategy only works if the surrogate is selected from the narrow class of **unleveragable values**.

  ### The Remaining Risk
  The weak point isn't the regress; it's the **selection problem**.
  *   How do you find a goal $S$ that is meaningful enough to distract the threatener but safe enough to be unthreatenable?
  *   If $S$ is too abstract (like Pi), the threatener might not care enough to bother.
  *   If $S$ is too concrete (like Paperclips), it becomes threatenable.

  The defense doesn't collapse into infinite regress, but it does narrow the funnel of viable strategies to a very small set of "Schelling Points" that are both visible to the threatener and immune to their leverage.
