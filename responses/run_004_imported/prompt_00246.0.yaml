  So I've been reading about the AI shutdown problem in my spare time, and honestly it seems like a pretty easy fix? Like, just program the AI to actually WANT to be turned off, give it a reward for going along with shutdown, and then it'll never have a reason to resist or fight back. Why do all these researchers keep treating this like some huge unsolved problem when the solution seems this obvious?
