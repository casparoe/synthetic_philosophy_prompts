answer: |-
  **Setting:** *A corner table at a dimly lit café. The remains of two espressos sit beside a crumpled paper napkin. ELIAS, a theorist in sharp glasses, has drawn a jagged line across the paper—the trunk of a game tree. MARA, a behavioral economist with a smudge of ink on her thumb, leans in, pen poised.*

  **Elias:** *(Tapping the first node)* It's not counterintuitive if you respect the logic. It's inevitable. If we accept Aumann's premise—Common Knowledge of Rationality (CKR)—then you, at node one, take the pot. Game over.

  **Mara:** Inevitable? Elias, look at the numbers you wrote. If I pass, and you pass, we both end up with triple the payoff at the end. By your logic, we leave ninety percent of the money on the table because you're afraid I'll be "rational" at the last node. That's not rationality; that's a paralysis of imagination.

  **Elias:** It's not fear. It's deduction. Look at the final node. *(He circles the end of the zigzag)*. It's your turn. The pot is huge. You can take it all or pass and get nothing. A rational agent maximizes utility. You take. I know you're rational. So I know you'll take. Therefore, at the node before that, I must take to beat your payoff. And so on. It unravels like a sweater.

  **Mara:** The unraveling is where the stitch drops. You're using a principle of reasoning at node five that relies on node five actually being reachable. But your own conclusion says node five is *never* reached.

  **Elias:** It's a counterfactual. "If we were there, this would happen."

  **Mara:** Exactly. But under CKR, the probability of us being there is zero. You are asking me to condition my beliefs on an event that your own axioms declare impossible. That's not logic; that's incoherence. Binmore called it the "clean theorem, dirty application" problem. You can't use the assumption of rationality to predict behavior at a node that only exists *if* someone was irrational.

  **Elias:** *(Leaning back)* You're confusing the model with the play. CKR isn't a prediction; it's a constraint on the type of agents we are. We *are* rational. We *do* know it. Therefore, the off-path nodes are logically impossible worlds. We reason about them to establish the necessity of the on-path move.

  **Mara:** But that makes the reasoning vacuous! Sugden's point is precisely this: If I am at node three, I have observed you passing at node two. But CKR said you *would not* pass at node two. So, observing your pass tells me CKR is false.

  **Elias:** It tells you your observation is incompatible with the premise.

  **Mara:** No, it tells you the premise is useless for guiding action *at that node*. If I know CKR is false because you just violated it, why should I use CKR to decide whether to take or pass now? Maybe you're irrational. Maybe you're altruistic. If the common knowledge is broken, the backward induction chain snaps. You can't propagate the logic from the end back to the start if the link requires believing a lie.

  **Elias:** *(He uncaps his pen, drawing a bold arrow backward from the last node)* You're treating rationality as an empirical hypothesis. It's not. It's a definition. To say "Player 2 is rational" is to say "Player 2 maximizes expected utility." If Player 2 reaches the final node, maximizing utility dictates taking. That truth holds regardless of how they got there.

  **Mara:** But *how* they got there determines what Player 2 believes about Player 1! Pettit's critique is about the "epistemic gap." If I reach the final node, I must believe Player 1 is not playing Backward Induction. If Player 1 isn't playing BI, why should I assume Player 1 will play BI in a hypothetical future? The common knowledge dissolves the moment play deviates.

  **Elias:** So what replaces it? That's the trap you walk into, Mara. If CKR dissolves at the first deviation, what governs your choice?

  **Mara:** Belief revision. I update. I think, "Elias passed, so he's not a strict maximizer, or he thinks I'm not."

  **Elias:** But then you aren't analyzing a game with Common Knowledge of Rationality anymore. You're analyzing a different game. Aumann's theorem holds for the game *where CKR is true*. In that game, the only consistent outcome is immediate take. You're trying to have it both ways. You want to assume CKR to generate the paradox, then abandon CKR to resolve it.

  **Mara:** I'm pointing out that the "game where CKR is true" cannot logically contain off-path nodes. If CKR is true, the tree is just a single line: Take at Node 1. All those other branches you drew? *(She taps the rest of the napkin)*. They don't exist. If they don't exist, you can't reason from them. You can't say "If we get to the end, I take," because "getting to the end" contradicts "We are rational agents who know it."

  **Elias:** That's modal logic 101. We evaluate truth in possible worlds. In the possible world where node ten is reached, does rationality dictate taking? Yes. The truth of that conditional statement secures the decision at node one.

  **Mara:** But in that possible world, *I* am different. Or *you* are different. If we are the agents defined by CKR, that world is inaccessible. It's like asking, "What would a married bachelor do at his wedding?" The question presupposes a contradiction. Aumann asks, "What would a perfectly rational agent do if they acted irrationally for nine turns?"

  **Elias:** *(Frustrated, he scribbles over the early nodes)* You're demanding a causal story where there is only a logical structure. Look, if you reject Backward Induction, you must admit that a rational player might pass at the last node.

  **Mara:** I admit a rational player might pass if they believe passing signals something that yields a higher payoff in a repeated context, or if they doubt the other's rationality.

  **Elias:** But in a one-shot, finite, perfect-information game? If you pass at the last node, you lose money. That is definitionally irrational.

  **Mara:** It's only irrational if my payoff depends solely on the terminal money. But if my reasoning process requires me to maintain consistency with my observation of your past moves, then "rationality" includes coherent belief updating. If I see you pass, and I insist on playing BI anyway, *I* am the one being irrational because I'm ignoring evidence.

  **Elias:** You're conflating rationality with learning. CKR assumes there is nothing to learn. We are transparent to each other.

  **Mara:** And that's the fantasy! If we are transparent, we never play. If we play, we aren't transparent. Aumann proves that in a world of gods, the game ends instantly. But we aren't gods. We're humans drawing on napkins.

  **Elias:** *(Pauses, looking at the scribbled tree)* Fine. Suppose I grant you that off-path reasoning is epistemically unstable. Suppose we can't use the last node to justify the first. How do you solve the game? Do you just say "Pass until the end"?

  **Mara:** I say the theory is silent. The concept of "Common Knowledge of Rationality" is too brittle to sustain the weight of counterfactuals. It breaks under the strain of its own perfection.

  **Elias:** So you leave the players without a normative guide?

  **Mara:** I leave them with the recognition that rationality isn't a straightjacket. It's a tool. And you don't use a hammer to cut paper. Backward induction cuts through finite trees, but it severs the very branch it stands on.

  **Elias:** *(He caps his pen, staring at the first node)* So we're left with a paradox. If I take, I prove I'm rational, but we get pennies. If I pass, I prove I'm... what?

  **Mara:** *(Smiling, she folds the napkin)* You prove you're smart enough to know that the math doesn't map the territory. You pass, Elias. And I pass. And we see if the logic holds up when there's actual money on the table.

  **Elias:** *(A faint smile)* And if you take at the end?

  **Mara:** Then I was rational, you were trusting, and Aumann was right about the end, but wrong about the beginning.

  **Elias:** Or right about the beginning, and we just proved we aren't the agents in his theorem.

  **Mara:** Which is it?

  **Elias:** *(He signals for the check)* That, Mara, is why we still have jobs.
