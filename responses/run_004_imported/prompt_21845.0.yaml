      *   *Semanticist/Expressivist:* Needs to argue that contempt is encoded in the meaning (presupposition, expressivism, etc.). Let's call him **Marcus** (maybe hinting at Hom or Williamson).
      *   *Placeholder Slur:* "Klep." Neutral counterpart: "Kleptocrat" or just "Group X." Let's go with "Klep" (slur) and "Klepton" (neutral).

  3.  **Drafting - Section by Section:**

