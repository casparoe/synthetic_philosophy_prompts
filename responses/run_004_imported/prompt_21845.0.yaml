answer: |-
  **Setting:** *A cramped university office, late afternoon. Two coffee cups sit on a stack of journals. **Elena** (Prohibitionist) leans back in her chair; **Marcus** (Semanticist) perches on the edge of the desk.*

  **Elena:** You're treating the slur like it's carrying a toxic payload in its semantic structure. It isn't. "Klep" and "Klepton" have the exact same extension. They pick out the same people. The difference isn't in the world; it's in the rules of the game. Using "Klep" violates a social prohibition. That's it.

  **Marcus:** That's it? Elena, that reduces hate speech to a traffic violation. "Don't park here" versus "This car is a bomb." If the contempt were merely pragmatic, merely a rule about *use*, then an outsider who didn't know the rule shouldn't be able to deploy the contempt. But they can.

  **Elena:** Can they? Let's run the ignorant speaker case. Say a tourist learns "Klep" from a dictionary that lists it as a synonym for "Klepton." No cultural context. They say, "That man is a Klep." Have they expressed contempt?

  **Marcus:** Intuitively, no. They've made a mistake, like using a fork to eat soup. But on your view, they've broken the prohibition. So, are they morally culpable?

  **Elena:** They've caused harm, certainly. The word hits the air, the taboo is triggered. But did they *mean* the contempt? No. Which proves my point: the contempt isn't in the truth conditions. It's in the social uptake. The word is a loaded gun, but the semantics is just the metal. The "bang" is the prohibition being violated.

  **Marcus:** But that doesn't explain why the gun is loaded in the first place. If I say, "If John is a Klep, he won't get the job," I haven't asserted John is a Klep. I've embedded it under a conditional. On your view, since I'm not asserting the content, I shouldn't be violating the prohibition in the same way. Yet the sentence still feels toxic. The contempt *projects*.

  **Elena:** Because the word itself is tabooed. Mentioning it is the violation. Anderson and Lepore are clear: it's the utterance act that's prohibited, not the proposition.

  **Marcus:** That's a dodge. It doesn't account for the *direction* of the attitude. If I say, "Kleps are hardworking," I've used the slur, violated your prohibition, but I haven't expressed contempt. I've praised them. Yet the sentence still feels wrong. It feels like a backhanded compliment at best. Why? Because "Klep" conventionally implicates inferiority. That expressive content is part of the meaning, not just a social rule about utterance.

  **Elena:** Okay, hit me with the hard case then. Reclamation. In-group usage. When a Klepton calls their friend "Klep" affectionately, they aren't violating a prohibition. And they certainly aren't expressing contempt. If the contempt were semantic—encoded in the word like "bachelor" encodes "unmarried"—that sentence would be a contradiction. "I love you, you Klep." It should sound like "I love you, you inferior bastard." But it doesn't. It sounds like solidarity.

  **Marcus:** Reclamation is a contextual override. It's a suspension of the default semantic value. Just because I can use a knife to perform surgery doesn't mean the knife isn't sharp. The default meaning remains hostile outside that specific context.

  **Elena:** But who decides the context? If the meaning is semantic, it should be stable. If it's purely social prohibition, then the community gets to rewrite the rules. The Prohibitionist view explains reclamation perfectly: the group simply lifts the ban for themselves. The Semanticist has to say the word literally changes its definition. That's messy.

  **Marcus:** It's less messy than saying the word is neutral. Look, if you're right, then a hate crime tribunal should treat "He is a Klepton" and "He is a Klep" as identical statements, differing only in style. But the law recognizes the harm is *in* the choice of the slur.

  **Elena:** The law recognizes the *intent* and the *impact*, not the semantics. I'm not saying the harm isn't real, Marcus. I'm saying the harm isn't *truth-conditional*. If we locate the toxicity in the meaning, you risk naturalizing the slur. You make the hate part of the logic. If I say the contempt is semantic, I'm saying "Klep" *means* "Klepton-plus-hate." That suggests the hate is a property of the group, encoded in the language.

  **Marcus:** No, it's a property of the *speaker's stance* encoded in the convention. It's expressivism. When I use "Klep," I'm not just describing; I'm performing an act of derogation. That's why the ignorant tourist fails—they perform the word but miss the act.

  **Elena:** But the victim doesn't miss the act. That's the problem with your view. You make the offense dependent on the speaker's semantic competence. I make it dependent on the social norm. The norm exists whether the speaker knows it or not.

  **Marcus:** And that's why your view is too blunt. It can't distinguish between a slip of the tongue and a hate speech act. Both violate the prohibition. But semantically, one carries the expressive content of contempt, and the other is just noise.

  **Elena:** Maybe. But your view can't explain why the negation stings. "John isn't a Klep." You still had to say the word. You still invoked the category.

  **Marcus:** Exactly! Because the expressive content projects through negation. The semantic stain remains even when you deny the description.

  **Elena:** Or... because the prohibition is on the *token*, not the *type*. You said the word. You rang the bell.

  **Marcus:** *(Pauses, picks up his coffee)* You know, if we're right, the solution to slur harm is education. Change the norms, lift the prohibition.

  **Elena:** And if we're right, the solution is eradication. You can't educate a meaning away. You have to retire the word.

  **Marcus:** So we agree on the cure, even if we disagree on the diagnosis.

  **Elena:** *(Smiles faintly)* Don't get sentimental, Marcus. I still think you're wrong about the truth conditions.

  **Marcus:** And I still think you're treating a wound like a rulebook. Pass the sugar.
