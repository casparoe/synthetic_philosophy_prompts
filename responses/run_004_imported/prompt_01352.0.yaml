      *   *Is forecasting incoherent?* No. Forecasting usually deals with $P(B|A)$, not $P(A \to B)$. The notation "If A, then B" in natural language is ambiguous, but in math/forecasting contexts, it's almost always shorthand for conditional probability.
      *   *What about Popper Functions?* Popper functions take conditional probability as primitive, not defined by $P(A \cap B) / P(A)$. This avoids the division by zero issue and allows a different algebraic structure, potentially bypassing some assumptions in Lewis's proof (specifically regarding the domain of the probability function).

