answer: |-
  The candle gutters, throwing the shadow of the quill against the wainscot like a spear. It is January, 1728. The house in Kensington is quiet, save for the settling of the timber and the wind rattling the sash. Sir Isaac has been in the earth at Westminster for ten months.

  I sit at his desk. It is not mine, though I am his successor at the Mint, though I am his nephew by marriage, though I am the executor of his will. It is his. I can smell him still in the wood—a scent of old paper, mercury, and the sharp, metallic tang of a mind that never rested.

  Before me lies the great chest. To the world, it contains the keys to the universe. The *Principia*. The optics. The fluxions. These are the stones with which I intend to build his monument. I have already spoken to the sculptors about the Abbey. I have drafted the inscription in my head: *Let mortals rejoice that there existed such and such an ornament to the Human Race.*

  But the chest is deeper than the world knows.

  I reach past the bound volumes of mathematics, my fingers brushing the rougher sheaves of manuscript. I pull one out. The paper is yellowed, the ink faded to the colour of dried blood. The handwriting is unmistakable—that tiny, cramped script, as if he sought to fit the infinite into the margin of a page.

  It is the commentary on Daniel.

  I should not read this. I know I should not. My duty is to the legacy, to the Royal Society, to the Church of England which sits uneasily upon the throne. But I am a man, and curiosity is the disease he left me.

  I turn the page. Here, the great architect of gravity dismantles the architecture of God.

  *The corruption of the Epistles,* he writes. He is speaking of the *Johanneum Comma*. The three witnesses in heaven. The Father, the Word, and the Holy Ghost. To the bishops, it is the bedrock of the Trinity. To Isaac, it is a forgery. A later insertion. A lie stitched into the scripture to bolster a doctrine he believed was idolatry.

  I remember the story he told me once, years ago, when the brandy had loosened his tongue. He had sent a treatise on this very subject to John Locke. He had trusted Locke. And Locke, bless his soul, had tried to have it translated into French. Isaac had panicked. He had begged Locke to suppress it. He had feared the clergy more than he feared error. He had feared the loss of his position, his peace, his name.

  And now he is dead, and the fear is mine.

  I stack the papers. There are hundreds of them. Thousands. Not just the textual criticisms, but the prophecies. He did not see the Apocalypse as a mystery to be feared, but as a history to be decoded. He saw the rise of Athanasius in the fourth century not as the triumph of orthodoxy, but as the Great Apostasy. The very Church that stands now, the Church that would lay him in consecrated ground, is, in these pages, the Whore of Babylon.

  I rub my eyes. The candle smoke stings.

  I reach for another bundle. This is the work on the Temple. Solomon's Temple. For decades, while the world watched him calculate the orbits of comets, he was calculating cubits. He believed the dimensions of the Temple were a cipher, a divine code predicting the timeline of history. He sought the sacred measure. He believed that if he could reconstruct the Temple in ink, he could find the date of the end of days.

  It is madness. It is piety. It is heresy.

  If I publish this, what happens to the *Principia*? Does the law of gravity hold if the lawgiver is a heretic? The bishops will not care for the distinction. They will not say, *Here is a man who loved God too much to accept the Trinity.* They will say, *Here is an Arian. A Socinian. A denier.* They will tear the statue down before the stone is cut. They will burn the books. They will say that a mind capable of such error in Heaven must be flawed in its mechanics of Earth.

  I look at the portrait hanging above the fireplace. He stares back, the wig heavy, the mouth set in that familiar, stern line. He was not a warm man. He was a hard man. But he was a true one. He hated a lie.

  And what am I doing now?

  I pick up the quill. I have a letter half-written to a friend in Cambridge, discussing the publication of his chronological revisions. I intended to smooth over the rough edges. To suggest these were merely antiquarian interests.

  But you cannot smooth over an earthquake.

  I dip the pen. The ink wells, black and glossy. I hover it over the letter. If I send this, I begin the process of disclosure. If I seal the chest, I become the warden of a secret tomb.

  I think of the monument in the Abbey. The effigy. The Latin praise. It is a statue of a saint of Reason. That is what the age needs. We are pulling ourselves out of the dark, out of the superstition of the previous century. We need Newton the Magistrate of Nature. We do not need Newton the Prophet of the Apocalypse. We do not need Newton the accuser of the Church.

  Is it a lie to protect the truth? If I hide these papers, do I save his glory, or do I betray his soul? He wrote these words in silence. He knew the cost. He chose silence.

  Does his silence command me to keep it? Or does his death release me to speak it?

  The candle flame dips low, blue at the base. The room grows cold. I look at the pile of manuscripts. They seem to vibrate, humming with the energy of the man who wrote them. They are dangerous. They are alive.

  I take a fresh sheet of paper. I do not write the letter to Cambridge. Instead, I write a label.

  *Theological Manuscripts. Private.*

  I gather the sheets on the Trinity. The commentary on Daniel. The measurements of the Temple. I stack them neatly. I align the edges. I feel the weight of them in my hand. It is heavier than the *Principia*.

  I place them in a separate box. A smaller box. Iron-bound.

  I do not burn them. I cannot bring myself to destroy the work of his life, even the work that contradicts the life the world thinks he led. But I cannot release them. Not yet. Perhaps not ever.

  I lock the box. The key is small and cold. I slip it into my waistcoat pocket, against my skin. It chills me.

  I blow out the candle. The room plunges into darkness, but the box remains on the desk, a solid presence in the gloom. I sit there for a long time, listening to the wind, wondering if I have just buried the truth to save the man, or buried the man to save the truth.

  In the morning, I will write the inscription for the Abbey. I will speak of Reason. I will speak of Nature. I will say nothing of the Temple. I will say nothing of the Apostasy.

  I sit in the dark, hand resting on the iron box, waiting for a dawn that feels very far away.
