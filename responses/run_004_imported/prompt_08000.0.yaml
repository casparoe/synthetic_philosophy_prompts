  The viewport hummed, a low vibration in the floorboards. On the other side of the glass, the Berlin Priya laughed at a joke some German postdoc made. She looked tired. She looked happy.

  "She's me," Priya said. Her voice was flat, but her hand was pressed against the glass.

  "No," Dev said. He didn't look at the screen; he looked at her. "Lewis. Worlds are sealed. Spatiotemporally isolated. That's not you. That's a counterpart. Qualitatively similar, numerically distinct."

  "Kripke," Priya said, turning from the glass. "We don't need qualitative similarity to establish identity. We stipulate. We track the object across the boundary. It's her because I say it's her, because we're talking about *Priya*."

  "You're smuggling in a haecceity," Dev said. "A primitive thisness. You're saying there's some magic dust sprinkled on your atoms that survives a divergence point where you took a different job. What work does that do? Explain that to me. It's an explanatory idle wheel."

  "It does the work of meaning," Priya said. "If it's not me, then her loneliness isn't mine. Her relief isn't mine. It's just a movie."

  "It *is* a movie. Look, if you insist on transworld identity, you have to accept that identity is absolute. But if you track by 'thisness' rather than matching properties, you lose the ability to say anything true about possibility. You just point and whisper *her*."

  "And you don't?" Priya stepped closer to him. "Your counterpart relation runs on similarity. But similarity is vague, Dev. It's context-dependent. How similar is similar enough? If I'd gone to Berlin, would I still love you? If the answer is 'maybe,' then how many counterparts do I have in that branch? Two? One who loves you, one who doesn't?"

  Dev shifted his weight. "Lewis handles that. Counterparts are graded. It's a matter of degree."

  "It's a mess," Priya said. "If similarity is the metric, then there could be two equally good counterparts of me in Berlin. Both me? Neither me? Your theory says I'm identical to myself, but over there, I'm split. You're trading magic dust for fuzzy math."

  "It's not fuzzy, it's precise about its own vagueness," Dev said. "But at least it doesn't posit invisible essences. Why is positing a bare particular—a 'you' that exists independent of your properties—less costly than admitting similarity is context-sensitive?"

  "Because," Priya said, her voice cracking, "if it's just similarity, then I'm alone. Strictly speaking, I am always alone. No one else is ever me. Even you. You're just my closest counterpart in this room."

  Dev flinched. They both knew the Humphrey objection—*Humphrey could not care less whether someone else wins*—but neither threw it. It was too cheap.

  "That's not what I'm saying," Dev said softly.

  "It is what you're saying. You're protecting the logic by sacrificing the connection. You want me to look at that woman and say, 'Poor counterpart.' So I don't get hurt when I see she's happier without me."

  "I want you to look at her and see the truth," Dev said. "If you claim identity, you claim her choices were yours. They weren't. She chose Berlin. You chose me. If you say she's you, you erase the weight of what you actually did."

  "And if I say she's a counterpart?" Priya wiped her cheek. "Then I'm staring at a ghost. A similar person who got to live the life I didn't. Which is worse, Dev? Haecceitism or grief?"

  Dev looked at the screen. The Berlin Priya was walking away now, down a street they didn't know, toward a life they didn't share.

  "Haecceitism lies," Dev said. "It tells you you can be in two places. It tells you you didn't really lose anything. But you did. You lost her. You lost that timeline. I'm not trying to hurt you. I'm trying to keep you here."

  Priya lowered her hand from the glass. "You're a good counterpart, Dev."

  "I'm trying to be the husband."

  "Is there a difference?"

  Dev didn't answer. He just reached out and took her hand, anchoring her to this world, this specific, sealed, lonely branch.
