answer: |-
  Here is a dialogue written to explore this disagreement. I have framed it between two philosophers, **Julian** (defending the Control Principle) and **Sarah** (defending the Reality of Moral Luck). They are colleagues sitting in a university common room, working through the "Two Drivers" case you described, with specific attention to the "evidence" objection and the nature of agent-regret.

  ***

  **Julian:** Let's stick to the stipulations. We have Driver A and Driver B. Both are speeding slightly. Both are distracted by their phones for exactly three seconds at the same stretch of road. Both have identical reflexes, identical vision, and identical knowledge of the car's mechanics. The only difference is that a pedestrian stepped onto the road in front of Driver A, but not Driver B. Driver A kills the pedestrian. Driver B arrives home safely. My claim is simple: Their moral culpability is identical.

  **Sarah:** Their *internal* culpability might be identical. But their moral *status* is not. Driver A is now a killer. Driver B is a traffic violator. That isn't just a semantic difference; it changes what they owe the world.

  **Julian:** But *why*? If "ought implies can," as the Kantians say, then morality must be within the agent's control. Luck is, by definition, outside their control. If we say Driver A is worse than Driver B, we are saying morality is a lottery. That undermines the very concept of justice. If you can't control it, you can't be blamed for it.

  **Sarah:** You're treating morality like a math problem solved in a vacuum. But morality happens in the world. When Driver A hits that pedestrian, a new moral reality is created. There is now a victim. There is now a debt of reparation. Driver A has to face the family, deal with the legal system, and live with the fact of a death. Driver B does not. To say their moral standing is identical ignores the actual damage done.

  **Julian:** I agree they have different *obligations* regarding the aftermath. Driver A must pay restitution; Driver B does not. But that's pragmatic, not moral. I'm talking about *blameworthiness*. The degree to which we judge their character and their choice. If we punish Driver A more severely, it should be for deterrence or restitution, not because he is inherently more blameworthy.

  **Sarah:** This is where I think your "Control Principle" relies on a dodge. I've heard defenders of your view argue that when we blame Driver A more, we aren't actually succumbing to moral luck. We're just reacting to *better evidence*. The idea is that the bad outcome reveals something about the driver's negligence that the lucky outcome hid.

  **Julian:** Exactly. It's an epistemic point, not a metaphysical one. When Driver A kills someone, we have concrete proof of the danger their behavior posed. With Driver B, the danger was abstract. Our anger is heightened because the risk was actualized, which makes the negligence more salient. But if we had a "God's eye view" of their mental states at the moment of driving, the blame would be equal. The luck doesn't change the blame; it changes our *access* to the reasons for blame.

  **Sarah:** Is that really what's happening, though? Or is that a theoretical patch to save the Control Principle from our lived experience? Think about it: If we caught Driver B *before* the accident happened, we would charge them with reckless driving. If we catch Driver A *after*, we charge them with vehicular manslaughter. We don't say, "Well, the evidence shows they were equally reckless, so we'll treat the manslaughter as if it were just reckless driving." We treat the outcome as constitutive of the wrong.

  **Julian:** Because the law is consequentialist. Morality shouldn't be. Look, imagine we run the simulation a thousand times. Driver B hits a pedestrian in ten of those runs. Are you saying Driver B is morally innocent in the ninety runs where they get lucky?

  **Sarah:** I'm saying they are innocent of *killing*, which is a specific moral category.

  **Julian:** But they are guilty of *endangering*. And the degree of endangerment was identical. If I say, "It's okay to drive this recklessly as long as no one is there," I'm endorsing a policy that relies on luck to keep me moral. That seems dangerous. By insisting their blameworthiness is different, you let Driver B off the hook too easily. He got lucky, but he took the same risk.

  **Sarah:** I'm not letting him off the hook for the risk. I'm saying the *harm* adds a moral weight that the risk alone doesn't carry. This brings us to Williams's concept of *agent-regret*. You dismiss the difference in how the drivers feel as mere psychology. But I think that feeling is moral data.

  **Julian:** Agent-regret is the feeling the unlucky driver has—that specific anguish of "I did this." But the lucky driver can feel that too. He can say, "I was just as careless; I could have killed someone." If he doesn't feel that, he's lacking imagination, not luck.

  **Sarah:** No, he can't feel the same thing. Driver B can feel *guilt* about his carelessness. Driver A feels *agent-regret* about the death. Williams's point is that agent-regret isn't just "I wish I hadn't done that." It's an acknowledgment that *my agency* extended into the world and altered it. If we tell Driver A, "Don't worry, you're no more blameworthy than Driver B," we aren't comforting him. We're gaslighting him. We're telling him the death doesn't matter morally because his internal state was the same as the lucky guy's.

  **Julian:** I see the force of that. But isn't agent-regret just a confused feeling we ought to talk ourselves out of? If I accept the Control Principle, I realize that the death was 50% my action and 50% the pedestrian's timing. Why should I carry the weight of the 50% I couldn't control?

  **Sarah:** Because you are the agent. You are the point where the causal chain became voluntary. If we excise luck from morality, we shrink the moral agent down to a tiny speck of "will" that never actually touches the world. Morality is about our relationship with the world, not just our relationship with our own intentions. If I push a vase off a table, and it breaks, I owe you a vase. If it doesn't break, I don't. The luck of whether it hits the floor changes my obligation. Why is debt different from blame?

  **Julian:** Debt is about restitution. Blame is about judgment. Here is where I might concede some ground: I agree that our *reactive attitudes*—our anger, our resentment—will inevitably track outcomes. Human psychology is wired that way. We feel more anger when there is blood.

  **Sarah:** So you admit the luck is real in practice.

  **Julian:** I admit the *reaction* is real. I deny the *justification* is real. Just because we feel more blame doesn't mean we *should*. This is where the "better evidence" point does legitimate work, even if it feels like a dodge. It reminds us to correct our bias. When we judge Driver A, we must consciously strip away the outcome and ask: "How reckless was the driving?" If we don't do that, we punish misfortune, not misconduct.

  **Sarah:** But if you successfully strip away the outcome, you aren't judging the act anymore; you're judging the intention. And most of life isn't about intention; it's about impact. In my line of work, and yours, if I push a config change that takes down the server, I have done something different than the guy who pushed the same change and didn't.

  **Julian:** You've created a different *state of affairs*.

  **Sarah:** And morality is about navigating states of affairs! If the Control Principle means we have to ignore the state of affairs to judge the agent, then the principle is too abstract for human life.

  **Julian:** Okay, let's try to find the synthesis. Perhaps we are using the word "blame" to do two different jobs. There is *internal blameworthiness*, which tracks the quality of the will and the risk taken. On that metric, Driver A and Driver B are equals. Then there is *external accountability*, which tracks the harm done and the social response. On that metric, they differ.

  **Sarah:** I can accept that distinction, provided you admit that *external accountability* is still a moral phenomenon. It's not just "social pragmatics." The obligation Driver A has to the victim's family is a moral obligation, not just a legal one. And that obligation exists solely because of luck.

  **Julian:** I can concede that. Luck determines the *scope* of our obligations, even if it doesn't determine the *quality* of our will. So, Driver A isn't a "worse person" in terms of character, but he is in a "worse position" morally. He has a debt Driver B doesn't.

  **Sarah:** And that "worse position" carries a weight that looks and feels exactly like what we call "more blame." So for all practical purposes, moral luck is real.

  **Julian:** For all practical purposes, yes. But I will still fight you on the theoretical claim. We must teach people that Driver B is *also* blameworthy. If we accept moral luck too readily, Driver B says, "See? No harm, no foul." And that's dangerous.

  **Sarah:** Agreed. We shouldn't let luck absolve the risk. But we also shouldn't let the Control Principle convince Driver A that the death is morally equivalent to a near-miss. The tragedy is real, and it belongs to him.

  **Julian:** Then we agree on the practice, even if we disagree on the metaphysics. Driver B needs to be held accountable for the risk. Driver A needs to be held accountable for the risk *plus* the tragedy.

  **Sarah:** And the difference between the two isn't a cognitive error. It's the cost of being an agent in a world we don't fully control.

  **Julian:** I can live with that. As long as we don't tell Driver A he's a monster, and we don't tell Driver B he's innocent.

  **Sarah:** Deal.

  ***

  ### Summary for the Engineer

  The dialogue highlights where the two positions actually meet and where they diverge, which might help you frame the postmortem discussion on your team:

  1.  **The "Evidence" Objection:** Julian (Control Principle) argues that treating the engineers differently is a cognitive bias (outcome bias) that we should correct. Sarah (Moral Luck) argues that the outcome *creates* a new moral reality (the outage) that demands a different response.
  2.  **Agent-Regret:** Julian views the extra guilt the unlucky engineer feels as something to be managed so it doesn't become irrational shame. Sarah views it as a necessary acknowledgment of the causal impact they had.
  3.  **The Synthesis:** They agree that **risk** should be punished equally (both engineers violated the review protocol), but **harm** creates additional obligations (the unlucky engineer has to lead the fix and face the client).

  In your team's case, the "Control Principle" suggests you should discipline both engineers equally for the process violation. The "Moral Luck" view suggests that while the process violation is the same, the unlucky engineer now bears a heavier burden of repair and public accountability, not because they are "worse," but because they are the one who holds the debt to the client.
