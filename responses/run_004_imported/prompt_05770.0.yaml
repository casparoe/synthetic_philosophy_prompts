answer: |-
  Here is a draft of ten interview questions tailored for your podcast. I've structured them to flow conversationally, starting with your Priya story to break the ice, then diving into the four specific technical areas you requested.

  For the four core topics, I've included the main question and a "anticipated response" note to help you deliver the follow-up naturally, depending on how she defends the standard Stage Theoretic line.

  ### **Intro: The Hook**
  **1.** "I have to confess, the reason I'm so eager to talk about this is that I had a two-hour fight with my friend Priya last night about her motorbike. She's replaced every single part on it over the years, and she insists it's the *same bike*, while I was arguing that it's just a causal sequence of bike-stages. It got messy. But it made me realize that for a Stage Theorist, the bike isn't even the object of interest—the *momentary* bike is. So, to set the stage: when you say ordinary objects are momentary stages, are you telling me that Priya's bike literally ceases to exist and is replaced by a numerically distinct bike at every instant, or is there a softer way to read that claim?"

  ---

  ### **Topic 1: The Rotating Homogeneous Disc**
  **2.** "I want to get into the machinery of how stages handle change versus motion. There's a classic problem involving a perfectly homogeneous disc. If reality is just a sequence of static stages, a spinning homogeneous disc looks qualitatively identical at every instant to a stationary one. There's no visual difference in the stages themselves. How does Stage Theory ground the difference between 'spinning' and 'sitting still' without appealing to something that persists across those stages?"

  *   **Anticipated Response:** She will likely appeal to **instantaneous velocity vectors** (properties the stage has *now* that point to future positions) or **causal relations** (the stage causes the next stage in a specific rotational pattern).
  *   **Follow-up:** "If you appeal to instantaneous velocity, aren't you smuggling in a relation to future times? Because velocity is technically a derivative of position over time. If the stage has a 'velocity vector' as an intrinsic property, doesn't that look suspiciously like you're reintroducing primitive persistence or at least a commitment to the future existing in the present? How do you keep that from collapsing back into standard Perdurance?"

  ---

  ### **Topic 2: Prudential Concern**
  **3.** "Let's move from physics to persons. One of the hardest pills to swallow in Stage Theory is the hit to self-interest. If the 'me' that wakes up tomorrow is just a counterpart stage and not numerically identical to the 'me' speaking now, why should I care about that future person's well-being? It sounds like I'm saving for retirement for the benefit of a stranger who just happens to be psychologically connected to me. How do you justify ordinary prudential concern on this view?"

  *   **Anticipated Response:** She will likely lean on a **Parfit-style reductionist** argument, claiming that what matters is psychological continuity and connectedness, not strict numerical identity, so the 'loss' of identity doesn't actually change how we should act.
  *   **Follow-up:** "That works for saving for retirement, but does it hold up for moral responsibility? If the future stage isn't *me*, is it actually fair to punish that stage for a crime I commit now? If you say 'yes' based on counterpart relations, haven't you essentially decoupled justice from identity in a way that contradicts our deepest legal and moral intuitions?"

  ---

  ### **Topic 3: Vagueness vs. Too Many Thinkers**
  **4.** "I know you're sympathetic to Ted Sider's argument from vagueness—the idea that existence can't be vague, so composition must be unrestricted. That pushes us to accept all sorts of weird fusions, like trout-turkeys. But this seems to create a 'Too Many Thinkers' problem. If composition is unrestricted, there are thousands of overlapping fusions of temporal parts right where I'm sitting. Which one is the thinker? Or are they all thinking my thoughts?"

  *   **Anticipated Response:** She will likely **bite the bullet** (yes, there are many thinkers) or argue that only one fusion satisfies the **sortal concept 'person'** despite the unrestricted ontology.
  *   **Follow-up:** "If you go the route of saying only one fusion counts as a 'person' based on our concepts, doesn't that reintroduce vagueness at the level of language or concepts? And if you do that, have you really solved Sider's original problem, or have you just pushed the vagueness from the world into our linguistic practices?"

  ---

  ### **Topic 4: Temporary Intrinsics**
  **5.** "David Lewis originally pushed Four-Dimensionalism largely to solve the problem of temporary intrinsics—how can I be bent at *t1* and straight at *t2* without contradiction? Stage Theory says different stages have different properties. But Endurantists have pushed back, saying they can just relativize property-having (I am 'bent-at-t1'). At this point, is the dispute actually ontological, or is it just a verbal disagreement about how we parse predicates?"

  *   **Anticipated Response:** She will likely argue that relativizing properties **changes the logic** or fails to capture the **intrinsic nature** of the property, whereas Stage Theory keeps properties truly intrinsic to the stage.
  *   **Follow-up:** "But if the Endurantist's logic can model the same truth conditions without multiplying entities into temporal parts, what is the Stage Theory ontology actually *doing*? If the relativization strategy gets you the same truth values without the temporal parts, isn't Stage Theory just a more expensive way of saying the same thing?"

  ---

  ### **Outro: The Cost & The Bike**
  **9.** "We've covered a lot of technical ground, but I want to zoom out. Every metaphysical view has a cost—a place where it conflicts with common sense. For Endurantism, it's usually logic and change. For Stage Theory, it seems to be identity and persistence. In your view, which cost is lower? Why is your bargain the better deal?"

  **10.** "Finally, I have to ask for Priya's sake. If she's replaced every part of her motorbike, including the frame and engine, but never all at once... on Stage Theory, is it the same bike? And if I tell her 'no, it's a causal sequence of bike-stages,' is that going to make her feel better, or is she going to kick me out of the garage?"
