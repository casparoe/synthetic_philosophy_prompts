answer: |-
  This is a fantastic close reading of Anscombe. You have put your finger on exactly the pressure point where her deontological ethics meets the messy reality of warfare. "Mr. Truman's Degree" is a blistering text, but you are right that the middle section, where she defines her terms, is the philosophical engine room.

  To answer your two questions directly: The "act vs. role" distinction is doing genuine, necessary philosophical work (it is not merely ad hoc stretching), and yes, that definition is absolutely essential to her final verdict on Hiroshima—it is not a detour.

  Here is a breakdown of what is going on in that text, which might help you structure that section of your piece.

  ### 1. Act vs. Role: Stretching or Substance?

  You ask whether distinguishing between a soldier literally shooting and a soldier sleeping is "definitional stretching" to preserve an absolutist rule while licensing normal war. It feels like stretching, but in the context of Just War Theory (specifically the *jus in bello* tradition Anscombe is drawing from), it is actually a solution to a logical problem known as the **problem of liability**.

  Anscombe is trying to navigate between two cliffs:
  1.  **The Pacifist Cliff:** If "innocent" means "not currently pulling a trigger," then you can never attack an enemy army unless they are firing at you at that exact second. This makes war impossible.
  2.  **The Total War Cliff:** If "innocent" means "morally blameless," then in a democratic society supporting a war, almost no one is innocent. Factory workers, voters, and taxpayers are all "guilty" of the war effort. This licenses killing anyone.

  Her "role" distinction is an attempt to define liability based on **function** rather than **culpability**.

  When she says a sleeping soldier is "harming," she is using a specific sense of the word. She is arguing that the soldier is a *material instrument of harm*. Even when asleep, he is part of a causal chain intended to produce violence. He is "under arms" in the sense that he is retained in the organization of violence.

  Is it stretching? In a linguistic sense, yes. We don't usually say a sleeping person is "harming." But philosophically, it is doing the work of distinguishing **combatant status** from **civilian status** without relying on moral guilt.
  *   **The Soldier:** Is liable to attack because he is a *threat in potentiality*. He has taken on a role where his function is to inflict harm.
  *   **The Civilian:** Is not liable, even if they support the war, because their function is not the direct infliction of harm.

  So, it isn't a convenient trick to let her have her cake and eat it too; it is the load-bearing wall that allows her to condemn Truman without condemning all warfare. If she couldn't make this distinction, she would have to argue that *all* killing in war is murder (pacifism), which she was not. She wanted to argue that *this* killing was murder.

  ### 2. Does this Definition do Work for Hiroshima?

  This is the critical question for your piece. It is tempting to think this is just preliminary groundwork before the "real" argument about the atomic bomb, but actually, **the verdict on Hiroshima collapses without this technical definition.**

  Here is why:

  **A. It blocks the "Total War" Defense**
  The standard defense of area bombing (which Truman and the RAF relied upon) was that in modern industrial war, there is no distinction between the front line and the home front. The munitions worker is as much a part of the war machine as the soldier.
  Anscombe's definition of "the innocent" slams the door on this. By rigorously defining "innocent" as "those not engaged in the act/role of harming," she categorically excludes civilians from the list of legitimate targets, regardless of their economic contribution. If she hadn't done the heavy lifting on the sleeping soldier, she couldn't consistently argue that the munitions worker is off-limits. The sleeping soldier distinction proves that *potential* threat is enough for liability; the civilian lacks even that potential threat.

  **B. It clarifies the Charge: Murder vs. Collateral Damage**
  Anscombe's deepest charge against Truman is not that he killed too many people (consequentialism), but that he *intended* the death of the innocent as a means to an end.
  *   If you bomb a military base and kill sleeping soldiers, you are attacking legitimate targets. If civilians nearby die, that is (in her view) potentially excusable under the Principle of Double Effect (foreseen but not intended).
  *   If you bomb a city to break morale, you are making the death of the "innocent" (in her technical sense) the *method* of victory.

  The technical definition of "innocent" is what allows her to categorize the victims of Hiroshima not as "unfortunate casualties of war" but as "murder victims." Without that precise definition, the death of civilians dissolves into a gray area of "collateral damage." She needs the bright line to make the moral accusation stick.

  **C. The "Hors de Combat" Constraint**
  You noted her point about not attacking more ferociously than necessary to put someone *hors de combat*. This is where the definition bites hardest on the Atomic Bomb.
  Even if you argue that a city contains legitimate targets (soldiers in barracks, command centers), the atomic bomb does not distinguish between the soldier asleep (liable) and the civilian asleep (innocent). It treats them as a single mass.
  Anscombe's definition forces the question: *Did the weapon discriminate between the two categories?* Because the answer is no, the action violates the definition of legitimate warfare she spent the middle of the pamphlet constructing.

  ### A Note for Your Article: The Modern Critique

  If you want to add a layer of contemporary relevance to your piece, it is worth noting that Anscombe's "functional" view of innocence (combatant vs. non-combatant) has been challenged by modern philosophers like Jeff McMahan.

  McMahan argues for a **moral responsibility** view: A soldier fighting an unjust war is *not* innocent (he is liable), but a soldier fighting a just war *is* innocent (he is not liable), regardless of uniform. Conversely, a civilian who is morally responsible for an unjust war might be liable.
  Anscombe would reject this. For her, the "role" (uniform/status) is what matters for *jus in bello*, regardless of the justice of the cause (*jus ad bellum*). She keeps the two separate to prevent soldiers from having to adjudicate the justice of the war in the heat of battle.

  This tension might be worth a footnote or a paragraph in your piece: Anscombe's definition is "traditionalist," prioritizing clear rules of engagement over deep moral accounting. She prefers a bright line that might let some "guilty" civilians live and some "innocent" conscripts die, because the alternative (everyone judging the justice of the war constantly) leads to total war.

  ### Summary for your drafting
  *   **The "Stretch":** It looks like stretching, but it's actually a functional definition of **liability**. It avoids the traps of pacifism and total war.
  *   **The Relevance:** It is not a detour. It is the metric by which she measures the Bomb. Without the strict definition of "innocent," the bombing becomes a tragedy of scale; with the definition, it becomes a specific crime of targeting.
  *   **The Punchline:** Anscombe isn't arguing that Truman killed too many people; she is arguing he killed the *wrong kind* of people, and her technical definition is what defines the "wrong kind."

  Anscombe is furious in the pamphlet, but she is furious like a philosopher, not just like a protester. The technical definitions are the weapons she sharpens before the execution.
