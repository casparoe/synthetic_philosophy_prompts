      *   *Clarification:* Ensure the distinction between "innocent" (technical) and "innocent" (moral) is clear.
      *   *Emphasis:* Highlight that for Anscombe, *intention* is key. The definition of innocent sets the stage for judging the intention.

  7.  **Final Polish:** Check against the user's specific phrasing ("convenient bit of definitional stretching"). Address that directly. (It *is* definitional, but it's not *merely* convenient; it's structurally necessary for her deontological framework).

  8.  *(Final check of the "sleeping soldier" point)*: Anscombe argues that a soldier is engaged in an "unjust project" (if the war is unjust) or simply the "business of war." She leans on the idea that they are *material cooperators* in harm. The sleeping soldier is still a threat in potentiality.

  9.  *(Final check of the Hiroshima point)*: The bombing targeted the population *as* a means to end the war. This violates the innocence of civilians. The soldier definition ensures that the military *could* have been targeted, but chose not to exclusively target them.

