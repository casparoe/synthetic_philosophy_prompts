          *   Lucas: "I know $M$ is consistent." (Objection: No you don't).
          *   Penrose: "If Mechanism is true, we *must* be able to know $F$ is sound." (Objection: Why? Maybe the brain is a black box).
          *   The "Trenchcoat" analogy: Priya is right. The core dependency (Truth of $G$ requires Knowledge of Consistency) is identical.
      *   **Section 4: The New Weak Point.** If we accept Penrose's *reductio* structure, the vulnerability is the claim that *human self-knowledge extends to our own computational architecture*. This is the "Unknowable Algorithm" escape route.
