answer: |-
  **Setting:** *A sterile triage alcove. The hum of ventilators is the only background noise. On the left, a single gurney holds DAVID. On the right, a partitioned bay holds FIVE PATIENTS, all in identical distress. A single vial sits on the tray between them. TESS (Taurek side) and MARCUS (Numbers side) stand over it, gloved hands hovering.*

  **MARCUS:** Hand it to me. I'll start the IV line for the bay.

  **TESS:** Stop. You don't get to just take it.

  **MARCUS:** Tess, look at them. Five hearts stopping versus one. This isn't a debate; it's arithmetic.

  **TESS:** It's not arithmetic. There's no equation where the losses sum up. David loses his life. That's total for him. Mike in Bed One loses his life. That's total for him. They don't share a nervous system. There is no "super-person" over here suffering the sum of five deaths.

  **MARCUS:** There doesn't need to be a super-person. There's a moral agent making a choice. That's me. And if I choose David, I am permitting five preventable deaths. If I choose the bay, I permit one. The badness of death doesn't vanish just because it happens in separate skulls.

  **TESS:** But *whose* badness are we counting? If I save David, Mike isn't sad that he died *plus* Sarah isn't sad that she died. They're just dead. To say five deaths are "worse" than one, you have to aggregate harms across distinct boundaries. You're treating people like containers of value we can pour together.

  **MARCUS:** I'm treating them as equals. If death is a harm, and we owe equal concern to everyone, then preventing five harms is objectively better than preventing one. To ignore the numbers is to say David's life is worth five times as much as Mike's.

  **TESS:** No! It's to say David's chance matters just as much as Mike's. If you save the five automatically, you've written David off completely. You've given him a zero percent chance of survival to guarantee the others live. Flip a coin. Give everyone a one-in-six chance. That's actual equality.

  **MARCUS:** That's procedural fairness, not moral outcome. A coin flip respects the *process*, but it abandons the *result*. If I flip and land on David, I have actively chosen a world where five people die instead of one. I can look at the five corpses and say, "I knew this would happen, but I wanted to be fair to David." How is that not monstrous?

  **TESS:** Because you aren't responsible for the disease, Marcus. You're responsible for the choice. If you save the five, you are using David as a means to maximize utility. You're saying his death is an acceptable tax for the greater good. Taurek's point is that no one has the authority to levy that tax.

  **MARCUS:** Authority? Who has the authority to let four extra people die? Look, I hear the "separateness of persons" argument. It's seductive. It feels rigorous. But test it. Scale it.

  **TESS:** Don't do the scaling trick.

  **MARCUS:** I have to. It's David on the left. On the right, it's not five. It's a thousand. Same condition. One dose saves the one, or the thousand. You still flip the coin? You give David a 50% chance to wipe out a thousand?

  **TESS:** (Hesitates) The principle holds. Each of the thousand loses only their own life. None of them loses the thousand.

  **MARCUS:** Come on, Tess. Be honest. If you're standing there with the coin, and you know that heads means a mass grave, you're not going to flip. You're going to save the thousand. And if you do, you've admitted the numbers count.

  **TESS:** Maybe I admit that at a certain point, the psychological weight breaks the principle. But that doesn't mean the *ethics* changed between five and a thousand. It just means my nerve broke.

  **MARCUS:** It's not nerve. It's recognition. You're realizing that "adding up" isn't about a metaphysical sum floating in the ether. It's about the scope of the tragedy. If you refuse to aggregate, you lose the ability to condemn genocide if the victims are killed in separate rooms.

  **TESS:** That's a straw man. Genocide involves intent and malice. This is triage. But fine, let's talk about the "adding." You say five deaths are worse than one. Where does that "worse" exist? It's not in the universe. It's in your head. You're imposing a structure on reality that isn't there to make yourself feel like a good utilitarian.

  **MARCUS:** I'm imposing it because I have to act. Inaction is a choice. If I acknowledge that death is bad *simpliciter*—full stop, regardless of who dies—then more death is more bad. To deny that is to say death isn't really bad, only "bad-for-X."

  **TESS:** I'm saying death is bad for X. And bad for Y. But "bad-for-X plus bad-for-Y" isn't a new category of "Super-Bad." It's just two instances of Bad. When you prioritize the group, you're not preventing "more bad," you're just preventing bad for *more people*. And in doing so, you sacrifice the one completely.

  **MARCUS:** I sacrifice the one to save the five from being sacrificed. It's symmetrical.

  **TESS:** It's not! If you flip the coin, everyone faces the same risk. If you save the five, David faces 100% risk. The five face 0%. You've created a caste system of survival based on headcount.

  **MARCUS:** I've created a survival system based on minimizing loss! Tess, listen to yourself. You're so worried about the purity of David's claim that you're willing to let four extra people die to protect it. You're privileging the *individual claim* over the *collective outcome*. But morality *is* collective. That's what it's for.

  **TESS:** Morality is for governing how we treat individuals. If we lose sight of the individual, we get tyranny. "Sorry, David, you're outvoted by five heartbeats."

  **MARCUS:** "Sorry, David, but I couldn't justify letting four others die when I could have stopped it." Which apology sounds more like a human being talking?

  *(Tess looks at the vial, then at David. Her hand trembles slightly.)*

  **TESS:** The coin... the coin was about giving David a chance. A fighting chance. If I just hand him over, I've decided he doesn't matter.

  **MARCUS:** He matters. But his mattering doesn't outweigh the mattering of five others. That's not saying he's worth less. It's saying the *sum of worth* on the right is heavier.

  **TESS:** There is no sum of worth. That's the whole point. There are just five people who want to live.

  **MARCUS:** And one person who wants to live. If you can't see that the frustration of five desires is a greater moral loss than the frustration of one, then you aren't looking at the desires, you're looking at the containers.

  *(Silence stretches. The ventilator hisses.)*

  **TESS:** (Quietly) If there were a thousand... I wouldn't flip.

  **MARCUS:** I know.

  **TESS:** But with five? It feels like we're sliding down a slope. If we say numbers count here, what stops us from harvesting organs from one healthy person to save five sick ones?

  **MARCUS:** Rights. Constraints. We're not killing David. We're choosing who to save from a pre-existing threat. The numbers count in *rescue*, not in *sacrifice*.

  **TESS:** (Sighs) That distinction... it does the heavy lifting, doesn't it?

  **MARCUS:** It has to. Because otherwise, you're right. The separateness of persons is a wall. But in triage, the wall is already breached by the disaster. We're just deciding where to patch the hole.

  **TESS:** So the coin is out?

  **MARCUS:** The coin is a way to keep your hands clean while the patients bleed out. It prioritizes your moral purity over their survival.

  *(Tess looks at David. She looks at the five. She pushes the vial toward Marcus.)*

  **TESS:** I still think you're glossing over the metaphysics. There is no "sum."

  **MARCUS:** (Taking the vial) Maybe not. But there are five families waiting. And I can't tell them I saved one because I was worried about the philosophical integrity of the number five.

  **TESS:** Just... don't act like you solved it. You didn't. You just picked the outcome that keeps you awake less at night.

  **MARCUS:** (Preparing the IV) If I sleep at all, it'll be because I saved them. Not because I was fair to David.

  **TESS:** (Watching him work) Next time it's one against a thousand... I'm not even letting you bring the coin.

  **MARCUS:** Deal.

  *(Marcus moves to the bay. Tess stays by David's side, placing a hand on his shoulder as the monitors begin to stabilize on the other side of the partition.)*
