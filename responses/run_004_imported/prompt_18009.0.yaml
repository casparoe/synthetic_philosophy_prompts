      *   *The Counter-Claim (Parfit/Naggin/Utilitarians):* While persons are separate, morality requires impartiality. If death is bad, 5 deaths are worse than 1 death. Ignoring numbers violates the principle of equal concern and respect.
      *   *The "Adding Up" Problem:* How do we aggregate utility across distinct minds? Taurek says we can't. Marcus needs to explain why we *must* or why it makes sense metaphorically or practically.
