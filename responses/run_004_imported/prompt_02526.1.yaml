answer: |-
  The tragedy of the walled garden is a compelling image: a riot of blooms decaying in the dark, seemingly wasted because no eye rests upon them. Your friend's invocation of G. E. Moore's *Principia Ethica* attempts to rescue the garden from this tragedy by asserting that beauty possesses intrinsic value, independent of any observer. By extending this logic to personal affection, your friend argues that silent, unreciprocated admiration is equally valuable simply because it exists. This is a bold philosophical move, but it collapses under scrutiny.

  To adjudicate this dispute, we must take a definite stance on two questions. First, does Moore's "isolation test" successfully demonstrate that beauty has value independent of experience? Second, even if it does, does that value structure apply to personal affection? My position is this: Moore's isolation argument is **valid regarding beauty**, but it **fails to generalize to affection**. There is a principled disanalogy between the two. Beauty can be understood as a formal property of existence that retains value in isolation, whereas affection is essentially relational and dynamic; its value is constituted by the interaction between minds, not merely the existence of an emotion within one. Your intuition that the garden is tragic is correct, but your friend's inference that silent admiration is equally virtuous is mistaken.

  ### I. The Validity of the Isolation Test for Beauty

  Moore's isolation test asks us to imagine two worlds: one of supreme beauty, one of utter filth, both devoid of conscious life. He contends the beautiful world is better. Critics often argue this intuition is a trick—that when we imagine the beautiful world, we implicitly imagine ourselves looking at it, thereby smuggling the observer back in. If we truly strip away all consciousness, they argue, "value" has nowhere to sit.

  However, this critique misunderstands the metaphysical commitment Moore is asking us to make. Moore is an objective idealist regarding value; he believes "good" is a non-natural property, much like "yellow" is a simple, indefinable quality. Just as a lemon is yellow whether or not anyone sees it, a state of affairs can be "good" whether or not anyone experiences it. The intuition that a universe of harmonious order is preferable to a universe of chaotic sludge is not merely a projection of human taste; it is a recognition that complexity, order, and harmony are ontological goods.

  If we accept that value is a property of states of affairs, the isolation test succeeds. The walled garden *is* better than a heap of rubble, even if no one sees it, because the garden instantiates a higher degree of formal perfection. The tragedy you felt was not that the value ceased to exist, but that the *higher* good—the organic unity of a mind appreciating that beauty—was lost. Moore agrees with you here: he explicitly states that while the beautiful world has intrinsic value, the consciousness of that beauty is a far greater good. The isolation test vindicates the garden's existence as good, but it does not equate that good with the experience of it. Therefore, against the subjectivist critique, Moore's argument holds: beauty has a baseline intrinsic value independent of perception, grounded in the objective quality of the world's order.

  ### II. The Disanalogy of Personal Affection

  Your friend's error lies in assuming that because the isolation test works for the static property of beauty, it must work for the dynamic state of affection. They argue that silently admiring someone's integrity is good "in exactly the same way" as the unobserved garden, purely in virtue of existing. This is false.

  The disanalogy rests on the nature of the objects involved. Beauty, in Moore's sense, can be a monadic property of an object or a landscape. A mountain does not need to know it is majestic to be so. Affection, however, is inherently dyadic or triadic; it is a relation between subjects. Moore himself hints at this when he identifies the greatest goods not merely as "affection," but as "the pleasures of human intercourse." The word "intercourse" is doing heavy philosophical lifting here. It implies exchange, mutuality, and expression.

  When you silently admire a person's integrity without them knowing, without it affecting your treatment of them, and without reciprocity, you are not engaging in "human intercourse." You are engaging in a private mental simulation. In Moorean terms, this is a different "organic unity." An organic unity is a whole whose value is not merely the sum of its parts. The high value of personal affection comes from the complex whole of: (1) a subject feeling emotion, (2) an object possessing worthy qualities, and (3) the appropriate expression or reciprocity of that emotion between them.

  If you remove the third element—if the affection is unwitnessed and unexpressed—you have not isolated the "good" of affection; you have destroyed the organic unity that constitutes it. You are left with a solitary mental state, which Moore might classify as a minor good (a virtuous emotion), but it is not the *same* good as personal affection. To claim it is "exactly the same" is to ignore that the value of affection is partly constituted by its relational success. A letter never sent is not the same good as a letter received; similarly, affection never communicated is not the same good as affection shared.

  ### III. Embodiment and the Limits of Isolation

  This distinction is reinforced by Moore's remarks on embodiment, which you recalled from your reading. Moore insists that the value of affection depends on the admired qualities being bound up with a person's "expressed, embodied presence." Why? Because persons are not static objects like mountains; they are agents. To value a person is to value their agency, and agency is only accessible through action, words, and looks.

  When you admire someone's integrity in the abstract, without reference to their embodied expression, you are admiring a proposition, not a person. You are admiring the *idea* of their integrity. Moore's isolation test works for the garden because the garden is an object of contemplation. It fails for affection because affection is a mode of engagement. If the engagement is cut off (no expression, no reciprocity), the specific good of "personal affection" vanishes, leaving only the lesser good of "benevolent sentiment."

  Your friend's argument relies on treating the emotion of affection as a self-contained jewel, like the beauty of the garden. But emotions directed at persons are not jewels; they are bridges. A bridge that leads nowhere may have structural integrity, but it fails its function. Moore's ethics are teleological regarding the "good"; the good of affection is the connection of minds. To isolate it from that connection is not to reveal its intrinsic value, but to strip it of the context that makes it valuable in the first place.

  ### Conclusion

  We can now resolve the argument over the walled garden. You were right to feel a sense of tragedy, but your friend was wrong about the remedy. The garden's beauty had intrinsic value even in the dark, vindicating Moore's isolation test for aesthetic objects. However, that logic does not transfer to the human heart. Silent, unreciprocated admiration does not hold the same value as realized affection, because affection derives its worth from the organic unity of shared consciousness and embodied interaction.

  Moore's philosophy, properly understood, saves your intuition. The tragedy of the garden is that a great good (beauty) was denied a greater good (conscious appreciation). The tragedy of silent admiration is that it mistakes a lesser good (solitary sentiment) for a greater one (mutual affection). The isolation test reveals that while beauty can stand alone, love cannot.
