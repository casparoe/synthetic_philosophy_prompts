answer: |-
  1. **The Humphrey Objection**
  Kripke famously argued that on your view, Humphrey doesn't care about his counterpart winning in another world because it isn't *him*. Your standard reply is that this objection begs the question by assuming transworld identity is the only thing that could matter to Humphrey. But let's grant that point for a moment. If we accept your framework, haven't we fundamentally altered the *phenomenology* of modal thought? When I wonder, "Could I have been happier?", I am concerned with *my* happiness, not the happiness of a distinct individual who resembles me. Even if Kripke is question-begging, doesn't your solution require us to accept that our deepest modal intuitions are systematically misleading about who they refer to?

  *Follow-up:* If you argue that reference is fixed by causal-historical chains rather than intuition, does that mean the ordinary person is always wrong about what they mean when they speak about possibility?

  2. **Accidental Intrinsics**
  Lewis motivates Counterpart Theory largely through the problem of accidental intrinsics: a person cannot be both bent and straight, so they cannot exist in worlds where they have different shapes. The rival view simply relativizes shape to a world-index: Humphrey is bent-at-W1 and straight-at-W2. You claim this destroys the intrinsic nature of shape. But why is positing a multitude of concrete individuals metaphysically "cheaper" or less awkward than accepting that some properties are essentially relations to worlds? Are we not just trading one mystery for another?

  *Follow-up:* If you insist that "intrinsic" means "non-relative by definition," aren't you solving the problem by linguistic stipulation rather than metaphysical discovery?

  3. **Chisholm's Paradox and Sorites**
  Chisholm's paradox suggests that if identity holds across worlds, we can construct a sorites series of gradual changes that leads to a contradiction. Counterpart Theory avoids this by making the counterpart relation non-transitive. However, doesn't this merely relocate the arbitrariness? You avoid the contradiction of identity, but you must still draw a line where resemblance is sufficient for counterparthood. Is the vagueness of the counterpart relation any less problematic than the vagueness of transworld identity?

  *Follow-up:* If you reply that the vagueness is merely semantic and not ontological, does that imply there is a precise fact of the matter about resemblance that our language fails to capture?

  4. **Multiple Counterparts**
  Lewis admits that a single individual can have multiple counterparts in a single possible world, and these counterparts might disagree on properties—one is a doctor, the other is not. This seems to render de re modal claims like "I could have been a doctor" neither true nor false. Is this indeterminacy a feature or a bug? Does it not undermine the utility of modal logic in capturing our actual reasoning, which rarely stalls over truth-value gaps?

  *Follow-up:* If you argue that context selects the relevant counterpart, what fixes that context if not the very notion of transworld identity you reject?

  5. **Ontological Extravagance**
  Counterpart Theory is usually paired with Lewis's Modal Realism: the claim that all possible worlds are concrete entities just as real as our own. Many critics find this ontologically profligate. Even if Counterpart Theory solves the logical problems of identity, is the price of believing in an infinity of concrete universes too high? Is there a version of your view that survives if we treat worlds as abstract representations rather than concrete realities?

  *Follow-up:* If you say the concrete view is necessary for the theory to work, how do you respond to the charge that you are multiplying entities far beyond necessity just to save a logical system?

  6. **The Indexical "Actual"**
  On Lewis's view, "actual" is an indexical like "here" or "now." I call my world actual simply because I am in it. But this implies that every counterpart of me in every other world also thinks their world is the only concrete one. Does this not strip the word "actual" of any robust metaphysical significance? If "actual" is just "this-worldly," what distinguishes reality from mere possibility other than our location within it?

  *Follow-up:* If you argue that existence is univocal across worlds, why do we feel such a profound categorical distinction between what is actual and what is merely possible?

  7. **Essentialism and Haecceitism**
  Transworld Identity often allows for haecceitism—the idea that there is a "thisness" to an individual independent of their qualitative properties. Counterpart Theory seems to tie identity strictly to qualitative resemblance. Does this mean you are committed to the view that there are no non-qualitative essential properties? If two individuals in another world are qualitatively identical to me, are they both me, or neither?

  *Follow-up:* If you say they are both counterparts, does that not dilute the notion of selfhood to the point where "I" refers to a class of individuals rather than a singular entity?

  8. **Moral Responsibility and Regret**
  If my counterparts are distinct individuals, causally isolated from me, how do we make sense of modal emotions like regret or relief? I regret that I *could have* acted differently. But on your view, the person who acted differently is not me, but a counterpart. Does Counterpart Theory force us to abandon the idea that modal facts have any bearing on moral responsibility or personal agency?

  *Follow-up:* If you suggest that regret is about the representation of possibilities rather than the individuals, does that not return us to the problem that the subject of the regret is disconnected from the object?

  9. **Theoretical Utility vs. Truth**
  Defenders of Counterpart Theory often emphasize its theoretical utility: it cleans up quantified modal logic and dissolves paradoxes. But utility is not truth. A map can be useful without being the territory. Is there a risk that you are defending Counterpart Theory because it is a powerful tool for systematizing metaphysics, rather than because it accurately describes the structure of reality?

  *Follow-up:* If you concede it is primarily a theoretical tool, why should we prefer it over a rival system that aligns better with pre-theoretic intuition but is logically messier?

  10. **Falsification and Evidence**
  Finally, let's talk about evidence. Metaphysical theories are notoriously difficult to falsify. We've discussed logical coherence and theoretical utility, but what would count as genuine evidence *against* Counterpart Theory? Is there any conceivable state of affairs, logical or otherwise, that would force you to abandon the view, or is the theory insulated by its ability to "bite the bullet" on any counter-intuitive consequence?

  *Follow-up:* If your answer is that only a logical contradiction could falsify it, does that not render the theory compatible with any possible world, and thus empirically empty?
