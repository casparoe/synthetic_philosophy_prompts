      *   *Philosophical nuance:* Causation is supposed to be a relation in the world (metaphysics). Blame is normative (ethics/law). If we say "omissions aren't causes," we change our ontology of the world. If we say "they are causes but not blameworthy," we separate causation from responsibility.
      *   *Key distinction:* The "Causal Selection Problem." We need to distinguish the *cause* from the *background conditions*. Oxygen is a condition for fire, the match is the cause. Similarly, the nurse's absence vs. the President's absence.
      *   *Why it matters:* If causation is just counterfactual dependence, the world is a web of infinite negative facts. This makes causal explanation useless. We need causation to be explanatory, not just true.

  3.  **Part 2: Main Strategies for Containing Over-generation:**
      *   *Strategy A: Deny Omissive Causation (Ontological Approach).*
          *   View: Only positive events cause things. "Not checking" isn't an event.
