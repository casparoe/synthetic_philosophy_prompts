      *   **The Request:**
          1.  Explain why this is a *metaphysical/causal* puzzle, not just a *moral/legal* one.
          2.  Walk through the main strategies proposed to solve it.
          3.  Offer an evaluation of which is most defensible.

  2.  **Part 1: Why is this a Causal Puzzle, not just Blame?**
