answer: |-
  Your friend had the better of the argument.

  While your defense of Lewis correctly identifies the metaphysical ambitions of his project and the non-reductive nature of interventionism, the interventionist framework (associated with Woodward, Pearl, and Halpern) represents a genuine theoretical advance that renders Lewis's specific machinery obsolete for the purpose of analyzing causal claims. The interventionist approach is not merely a "restricted version" of Lewis's theory that inherits its difficulties; rather, it dissolves the problems that plagued Lewis by shifting the analysis from a metaphysics of events to a logic of inquiry.

  Here is the breakdown of why the interventionist framework succeeds where Lewis's struggles, why the charge of circularity is a feature rather than a bug, and why your friend is right that the apparatus of possible worlds has been superseded for this specific philosophical task.

  ### 1. The Preemption Problem: Contortion vs. Calculation

  The crux of your dinner argument was late preemption (Suzy and Billy). This is the graveyard of the 1973 Lewisian account.

  **Lewis's Struggle:**
  On Lewis's 1973 account, causation is counterfactual dependence. $C$ causes $E$ iff, had $C$ not occurred, $E$ would not have occurred. In late preemption, if Suzy hadn't thrown, Billy would have, and the bottle would still have shattered. There is no counterfactual dependence of the shattering on Suzy's throw. Lewis knew this was fatal.
  *   **1986 Revision (Quasi-dependence):** Lewis tried to argue that Suzy's throw caused the shattering because there was an intrinsic causal process connecting them, unlike Billy's throw. This failed because it couldn't account for "distance" causation (e.g., via fields) where no intrinsic process is visible, and it struggled with cases where the intrinsic process is identical but the causal status differs.
  *   **2000 Revision (Influence):** Lewis's final move was to define causation as "influence." $C$ causes $E$ if alterations in $C$ lead to alterations in $E$ (timing, manner, etc.). He argued Suzy's throw influences the shattering (change the throw, change the shatter), while Billy's does not (change Billy's throw, the shattering stays the same because Suzy's rock gets there first).
      *   *The Cost:* This requires granular judgments about "how much" influence counts. Lewis has to argue that Billy's throw has *some* influence (e.g., on the air pressure waves) but it is "too slight" to count. This is notoriously *ad hoc*. It saves the verdict but at the cost of introducing vague thresholds into the analysis.

  **The Interventionist Solution:**
  In the Structural Equation Model (SEM) framework, you represent the scenario with variables: $ST$ (Suzy Throws), $BT$ (Billy Throws), $BS$ (Bottle Shatters).
  The structural equation is roughly: $BS = \max(ST, BT)$ (simplified).
  To test if $ST$ causes $BS$, you perform an intervention: Set $ST = 0$ (Suzy doesn't throw). Crucially, you hold $BT$ fixed at its *actual* value ($1$).
  *   **Result:** If $ST=0$ and $BT=1$, $BS=1$. Wait—this looks like Suzy *didn't* cause it.
  *   **Correction:** In late preemption, the model must capture the timing or the "blocking." A more accurate SEM distinguishes the *arrival* of the rocks. Let $SA$ = Suzy's rock arrives, $BA$ = Billy's rock arrives. $BS = SA \lor BA$. But $BA$ is functionally dependent on $BT$ *and* $\neg SA$.
      *   Intervention on $ST$: Set $ST=0$. This sets $SA=0$. Because $SA=0$, the blocker on Billy is removed. $BA$ becomes $1$. $BS$ remains $1$.
      *   Wait, the standard SEM solution for *late* preemption relies on the distinction between *actual* causal paths. The Halpern-Pearl definition of actual causation looks at contingencies. We hold $BT$ fixed at 0 (Billy doesn't throw) in the counterfactual test.
      *   **The Real Move:** The interventionist asks: Is there a path from $ST$ to $BS$ that is active? We test $ST$ by intervening on $ST$ while holding off-path variables (like $BT$) fixed at their *actual* values. But in late preemption, $BT$ is actual 1. If we hold $BT=1$, $BS=1$ regardless of $ST$.
      *   **Refinement:** The SEM solution requires modeling the *mechanism* of preemption. We introduce a variable $W$ (Bottle intact when Billy's rock arrives). $W = 1$ if Suzy's rock didn't hit it. $BS = (ST \land W) \lor (BT \land \neg W)$.
      *   Test Suzy: Intervene $ST=0$. $W$ becomes $1$ (bottle intact). $BT$ is $1$. $BS = (0 \land 1) \lor (1 \land 1) = 1$.
      *   This seems to fail too? No. The Halpern-Pearl (2005) definition allows us to hold *some* variables fixed at non-actual values to test the path. We hold $BT=0$ (Billy doesn't throw) to test Suzy's capacity. If $ST=0, BT=0 \rightarrow BS=0$. If $ST=1, BT=0 \rightarrow BS=1$. Suzy is a cause.
      *   Test Billy: We hold $ST=1$. If $BT=0 \rightarrow BS=1$. If $BT=1 \rightarrow BS=1$. Billy is not a cause.

  **Comparison:** Lewis requires a metaphysical theory of "influence" and "alterations" that relies on intuitive judgments about "too slight." SEM requires a precise specification of the structural equations. While SEM requires careful variable selection (the "modeling" step), once the model is specified, the verdict is a *calculation*, not a metaphysical intuition. Lewis's theory bends to fit the intuition; SEM derives the intuition from the structure. Your friend is right: this is less *ad hoc*.

  ### 2. Symmetric Overdetermination: Uniformity vs. Exception

  Consider the two arsonists ($A1$ and $A2$) dropping matches. Either is sufficient for the fire ($F$).

  **Lewis:**
  In the 1973 account, there is no counterfactual dependence. If $A1$ hadn't dropped the match, $A2$ would have, and $F$ would still happen. Lewis famously bit the bullet here: he argued that in symmetric overdetermination, neither is a cause, or the analysis simply fails to deliver a verdict. He later conceded this was counterintuitive but maintained his theory couldn't capture it without violating other constraints. This is a major theoretical cost: a theory of causation that cannot handle a standard case of causation.

  **Interventionism:**
  The equation is $F = \max(A1, A2)$.
  *   Test $A1$: Intervene $A1=0$. Hold $A2$ fixed at actual ($1$). Result $F=1$.
  *   Wait, standard actual causation definitions (like HP 2005) handle this by allowing us to hold the *other* cause fixed at 0 (a contingency).
  *   Test $A1$: Consider the contingency where $A2=0$. In this contingency, if $A1=0, F=0$. If $A1=1, F=1$. Thus $A1$ is a cause.
  *   Test $A2$: Symmetric.
  *   **Result:** Both are causes.

  **Comparison:** Interventionism handles preemption and overdetermination with the *same* formal machinery (testing dependencies under specific contingencies/interventions). Lewis requires different moves for different cases (dependence for standard cases, influence for preemption, silence or error for overdetermination). The interventionist framework is more unified.

  ### 3. Reductivity vs. Circularity: The Metaphysical Stakes

  Your strongest point was that Woodward's account is non-reductive. You argued that because "intervention" is a causal notion, the account is circular and thus fails to explain what causation *is*, whereas Lewis aimed to reduce causation to non-causal facts (events + laws + similarity of worlds).

  **Why this objection misses the mark:**
  1.  **The Failure of Reduction:** Lewis's reductive project arguably failed. The "similarity of worlds" metric required to make his counterfactuals work had to be rigged specifically to yield the correct causal verdicts. He had to stipulate that worlds where miracles occur are less similar, unless the miracle is needed to prevent the cause, etc. This "Humean Supervenience" ended up being just as contentious and opaque as the causal notions it was meant to replace.
  2.  **Explication vs. Analysis:** Woodward is not doing metaphysical reduction; he is doing *conceptual explication*. He is asking: "What do we mean when we make causal claims in science?" The answer is: "We mean that manipulating this variable changes that one." The circularity is virtuous. It connects the concept of *cause* to the concept of *manipulation*, which is epistemically prior for agents like us. We know what it is to intervene before we know what causation is in the abstract.
  3.  **The "Same Underlying Problem":** You argued interventionism just relabels the problem (which variables to hold fixed). This is true, but it relocates the problem to where it belongs: **model specification**. In Lewis's framework, the ambiguity is hidden in the "similarity metric" of possible worlds (a metaphysical black box). In SEM, the ambiguity is in the choice of variables and equations (a scientific/representational choice). It is better to have the ambiguity in the model (which we can critique and revise) than in the metaphysics of worlds (which we cannot test).

  ### 4. Is Interventionism Just Counterfactuals in Disguise?

  You noted Woodward describes his view as a species of counterfactual theory. This is technically true but philosophically misleading.

  *   **Lewisian Counterfactuals:** "If $C$ had not happened..." (Backtracking or miracle-based). These are passive observations of alternative histories.
  *   **Interventionist Counterfactuals:** "If we had *set* $C$ to 0..." (Surgical breaks of causal links).

  This distinction is fundamental. Lewisian counterfactuals flow through the natural laws of the alternative world. Interventionist counterfactuals *break* the laws governing the cause. When you intervene on Suzy's throw, you sever the link between her mental state and her arm. Lewis's framework struggles to represent this "surgical" break without complex similarity metrics. SEM builds it into the definition ($\text{do}(X=x)$).

  Therefore, interventionism is not just a "more disciplined" counterfactual theory; it is a theory of **causal structure** that uses counterfactuals as a tool. It posits that the world has a modular structure that allows for independent manipulation. Lewis's Humean view denies such modal structure exists fundamentally. On this ontological point, they are rivals. But regarding the *analysis of causal claims*, the interventionist structure is superior because it matches the modularity we exploit in science.

  ### Verdict

  Your friend had the better of the argument.

  You were right to defend Lewis's metaphysical ambition (reduction) and to point out the non-reductive nature of interventionism. However, you were wrong to suggest this makes interventionism inferior or merely a relabeling.
  1.  **Explanatory Power:** Interventionism handles late preemption and symmetric overdetermination with a unified, formal calculus. Lewis requires successive, increasingly complex patches that rely on vague intuitions about "influence."
  2.  **Metaphysical Cost:** Lewis's reductivity comes at the price of a "similarity metric" that is arguably just as mysterious as causation itself. Woodward's "circularity" is an honest admission that causal concepts are intertwined with manipulation and explanation, which is how we actually access causation.
  3.  **Supersession:** You mentioned your friend works with SEMs for a living. This is the telling detail. The reason philosophers of science and practicing scientists have migrated to the Woodward/Pearl framework is not fashion; it is because the Lewisian apparatus is too brittle to handle the complexity of real causal inference without breaking.

  Lewis provided the best account of causation available in the 20th century, but the 21st-century consensus is that the "possible worlds" machinery is the wrong tool for the job. It tries to solve a structural problem with a semantic solution. Your friend's framework solves it with a structural solution.

  Tell your friend she wins the dinner, but you can buy the wine on the condition that she admits the "model specification" problem in SEM is the new metaphysical battleground. The hard problem hasn't vanished; it has just moved from the similarity of worlds to the selection of variables.
