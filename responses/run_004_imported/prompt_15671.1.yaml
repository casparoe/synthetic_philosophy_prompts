answer: |-
  **Setting:** *A dimly lit faculty lounge at a modern university, late evening. A conference on "Neuro-Rights and Legal Policy" has just adjourned. The topic was the decriminalization of psilocybin and novel psychedelics. H.L.A. Hart and Lord Devlin sit in armchairs, coffee cups untouched. They are not ghosts, but perhaps ideas made flesh, temporarily anchored to the present.*

  **Devlin:** You look unsatisfied, Herbert. The vote went your way. The committee recommends decriminalization. The Harm Principle has triumphed again.

  **Hart:** A vote is not a justification, Patrick. And I am not triumphant. I am concerned. The students today… they treat my name as a stamp that says "Liberty Good, Law Bad." They ignore the complexity of the rules.

  **Devlin:** Complexity is a luxury of the seminar room. In the street, the law must be clear. But tell me, on what basis do you recommend this decriminalization? Is it that the drug causes no physical harm?

  **Hart:** Primarily, that the coercion of the criminal law is a distinct evil. It requires justification. If a person alters their own consciousness in private, without defrauding or injuring another, where is the *other-regarding* harm that warrants the state's violence?

  **Devlin:** There it is. The accountant's view of harm. You tally bruises and lost wages. But society is not a ledger of injuries. It is a community of ideas. It is a seamless web. When you pull a thread, you must ask if the whole garment unravels.

  **Hart:** The "Disintegration Thesis." We have heard it before. You argue that because society *feels* strongly about an issue, the law must enforce that feeling to prevent collapse.

  **Devlin:** Not because it *feels*, but because the feeling *is* the bond. You speak of "Positive Morality" versus "Critical Morality." You want the law to wait until the philosophers have debated the drug and found it rationally acceptable. But society does not hold together on philosophy. It holds together on shared instinct.

  **Hart:** Shared instinct can be wrong. Positive morality once demanded the burning of heretics. Critical morality asks: is this demand just?

  **Devlin:** And who asks the question? You? The judge? The "right-minded person" is not a philosopher, Herbert. He is the man in the jury box. If the twelve men in the box feel intolerance, indignation, and disgust at the sight of a citizen permanently intoxicated, permanently opting out of the shared reality of the community—that feeling is data. It is not data about the drug. It is data about the *bond*.

  **Hart:** You are conflating the strength of a feeling with the legitimacy of its enforcement.

  **Devlin:** No. I am telling you where the law gets its authority. It gets it from the common moral conviction. If you decriminalize this drug, you are not just allowing a chemical. You are signaling that the individual's internal experience is sovereign over the community's shared conception of responsibility.

  **Hart:** That is the liberal conception of the person.

  **Devlin:** It is a *sectarian* conception! That is my point. You treat Liberalism as a neutral framework. It is not. It is a moral stance. And by enforcing *your* morality of autonomy, you are actively dissolving *their* morality of duty.

  **Hart:** *[Pauses, leans forward]* This is the crux, isn't it? You are arguing that the existence of a divergent lifestyle is itself a form of treason against the moral majority.

  **Devlin:** I am arguing that if the moral majority believes that sobriety is a duty owed to the family and the state, and you remove the law's support for that duty, you weaken the institution. You make it harder for a father to tell his son "no." You change the moral environment. The law is a teacher. What is it teaching now? That the mind is private property.

  **Hart:** And if the law teaches that the mind is private property, does society disintegrate? Or does it merely change?

  **Devlin:** *[The Hit]* Here is where your machinery fails, Herbert. You ask for proof of disintegration. You say, "Show me the collapse." But by the time the collapse is visible, it is too late to rebuild. You cannot wait for the bridge to fall to prove it was weak.
  My test of "intolerance and disgust" is not a demand for vengeance. It is an early warning system. It detects stress on the ligaments. If the "right-minded person" looks at the drug user and feels that *something sacred about human agency is being violated*, that is a signal that the shared idea of "the citizen" is fracturing.
  You dismiss this as "unfalsifiable." But your alternative is worse. You assume society can survive on a rational contract alone. You assume we can agree on "harm" without agreeing on "the good." But we cannot. If we disagree on what a human being is *for*, we will disagree on what harms them. If the majority believes man is a steward of his reason, and you allow him to chemically abdicate that stewardship, you are not being neutral. You are taking a side in a metaphysical war. And you are using the law to disarm the other side.

  **Hart:** *[Silence for a long moment. He takes off his glasses and cleans them slowly.]*

  **Hart:** That… is a fair strike. You are correct that I cannot prove, empirically, that liberalizing drug laws will not weaken social cohesion. I cannot falsify your claim that the shared moral instinct is the load-bearing wall of the state.

  **Devlin:** Then why resist?

  **Hart:** Because I must distinguish between what morality *is* and what it *ought to be*. You argue that because the ligament exists, it must not be cut. I argue that sometimes the ligament is shackling a limb that needs to move.
  You say the "right-minded person's" disgust is an early warning system. I say it is often a mechanism of stagnation. In 1950, the "right-minded person" felt disgust at the homosexual. Was that a signal of social stress? Or was it a signal of prejudice? The law, by enforcing that disgust, prevented the morality from evolving.
  If we lock the law to the Positive Morality of the moment, we freeze the moral progress of the society.

  **Devlin:** But if you unlock it, you risk the door falling off the hinges.

  **Hart:** Precisely. So here is my answer to your hit. I concede that a society needs a "minimum content of natural law." We must protect persons, property, and promises. We need a shared morality to survive.
  But there is a difference between the morality required for *survival* and the morality preferred for *comfort*.
  Your "disgust" test does not distinguish between the two. It treats a threat to survival (treason, murder) the same as a threat to comfort (drug use, sexual deviation).
  My argument is not that society can survive on *no* shared morality. It is that a society robust enough to survive *should* be able to tolerate private deviations without collapsing. If the "community of ideas" is so fragile that it shatters because a citizen smokes a mushroom in his living room, then it was not a community of ideas. It was a barracks.

  **Devlin:** A barracks is safe.

  **Hart:** But it is not a society worth preserving. You worry that decriminalization disarms the moral majority. I worry that criminalization arms them with a weapon—the state's power to imprison—that they are using to enforce a metaphysical preference, not a survival necessity.
  You say I am taking a side in a metaphysical war. I admit it. I am taking the side that says the law should not be the enforcer of the sacred. It should be the referee of the secular.

  **Devlin:** And if the people do not want a secular referee? If they want the law to sanctify their way of life?

  **Hart:** Then they are asking for tyranny. And my job, as a jurist, is to show them that the price of that tyranny is the liberty they claim to cherish.
  You say the ligament will snap. I say: let us test the tension. If we decriminalize, and the society *does* crumble because people stopped valuing reason, then you were right. But we must be allowed to find out. To forbid the experiment because you *fear* the result is to assume the majority is infallible. And history suggests they are not.

  **Devlin:** *[Nods slowly]* You gamble with the social fabric to prove a point about liberty.

  **Hart:** And you would burn the library to keep the dust off the books.

  **Devlin:** *[A faint smile]* Perhaps. But do not think you have won, Herbert. The students today, they cite you to justify everything. They forget that liberty requires a moral structure to stand upon. If you erode the structure enough, liberty falls with it.

  **Hart:** And if you reinforce the structure too much, liberty suffocates within it.

  **Devlin:** Then it seems we are still the jailers of each other.

  **Hart:** *[Stands up]* Then let us hope the students learn to pick the lock, rather than choosing a side.

  *[Hart exits. Devlin remains, looking into his cold coffee, tracing the rim of the cup with a finger.]*
