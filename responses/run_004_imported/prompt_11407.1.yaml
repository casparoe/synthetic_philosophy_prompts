      *   *Focus:* The user's specific claim is that Strawson makes an inference (or assumes one) that Dana denies. I need to show that even if Dana is right that Strawson *intends* a dissolution, the dissolution *fails* because the framework itself relies on a hidden normative premise that is vulnerable to the is-ought critique.
      *   *Key Point:* Strawson claims the framework is "natural." But "natural" does not equal "normatively binding." If the framework is just a psychological fact, the incompatibilist can say, "Okay, it's a fact that we blame. It's also a fact that we are determined. Why should the first fact override the second?" Strawson has no answer other than "We can't help it." That is a description, not a justification.
      *   *The Childhood Case:* Use this to show that the "internal" standards of the framework are porous. If causal history matters for exemptions (psychopathy/childhood), why doesn't it matter for determinism? Strawson says "because we don't feel that way." The user says "That's just an is." Dana says "That's the framework." The counter: If the framework's boundaries are arbitrary (why childhood trauma but not genetic trauma?), then the framework isn't self-justifying; it's just a set of inconsistent intuitions.

