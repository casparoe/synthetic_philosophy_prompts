      *   **The Ask:** A *verdict*. No "both sides have a point." Build the *strongest possible case* that the user's is-ought objection lands and Dana's quietist reading fails, using the childhood case (or similar) to show the breakdown concretely.

  2.  **Deconstruct Strawson's Argument (Mental Sandbox):**
