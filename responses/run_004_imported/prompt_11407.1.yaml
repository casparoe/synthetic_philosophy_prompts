      *   *Pessimists* (incompatibilists) say determinism kills responsibility. Strawson says this demands an impossible "external" justification.
      *   Strawson's core claim: RAs are constitutive of human relationships. We can't globally suspend them. Therefore, the question of "general justification" is idle.
      *   *Excuses/Exemptions:* We modify RAs based on specific facts (intent, capacity).
      *   *The User's Critique:* Strawson moves from "We can't help feeling RAs" to "RAs are justified." This looks like Hume's Guillotine.
      *   *Dana's Defense:* Strawson isn't inferring justification from ubiquity. He's saying the *concept* of justification only makes sense *inside* the framework. Asking for outside justification is category error.

  3.  **Evaluate the "Is-Ought" Objection:**
      *   Does Strawson actually commit the fallacy?
      *   Standard interpretation: Strawson is a naturalist. He thinks moral practices are grounded in human nature. If human nature is the bedrock, there is no "higher" court of appeal.
