answer: |-
  The gaslight had been turned down until the mantle was a bruised blue eye in the corner, barely holding back the heavy velvet dark. Around the mahogany table, six hands rested on the polished surface. Henry kept his palms flat, feeling the grain, the coolness of the wood, the pulse of the woman to his left.

  Eleanor. Her grip was steady, mathematical. She was the only other person in the room whose silence he trusted completely.

  To his right sat Frederic Myers. Myers was breathing too loudly. Henry could hear the wet catch of his enthusiasm, the slight shift of his weight on the chair. Myers wanted it. Myers needed the poetry of it. Henry only needed the proof.

  The medium was a young woman from the East End, brought by recommendation, unnamed in the public records. She sat opposite Henry, slumped in the chair, her head lolling forward. She had asked for no bonds, no handcuffs. She said the spirits disliked iron. Henry had checked her boots for hidden mechanisms before the lights died. He had checked the table legs. He had checked the locks on the door.

  He was a man who had spent a lifetime weighing pleasures against pains, calculating the greatest good for the greatest number. It was a clean system, elegant in its symmetry, provided one assumed the calculator would exist long enough to see the sum. But reason, that cold and faithful servant, had whispered a terrible secret to him in the quiet of his study: *Why should the sacrifice of the self serve the self?*

  If the ledger closed at death, the prudent man was a fool to be virtuous. If the ledger remained open, if the accounts were balanced in a currency not yet minted, then duty and desire were one.

  He needed to know which world he lived in.

  A sound came from the center of the table. A sharp *crack*, like a walnut shell breaking.

  Myers inhaled sharply. "Did you hear?"

  "Wood settling," Henry said. His voice was level, devoid of hope. He watched the medium's shoulders. They were still.

  *Crack. Crack-crack.*

  It was rhythmic. Too rhythmic. Nature rarely counted in integers.

  "Ask," Myers whispered.

  Henry felt a surge of irritation, quickly suppressed. He leaned forward into the gloom. "Is there a presence?"

  The medium's head twitched. Her hand, resting near the edge of the table, slid an inch toward the center. Her fingernails tapped the wood. *One. Two. Three.*

  "Who is it?" Eleanor asked. Her voice was low, cutting through the stale air.

  The tapping stopped. Then, a scrape. The sound of a fingernail dragging across the grain. Henry's mind, trained to dissect arguments and expose fallacies, immediately cataloged the friction. It sounded like skin, not spirit. But the angle was wrong. The medium's arm was not positioned to exert that pressure without shifting her elbow. Her elbow had not shifted.

  Henry held his breath. He felt the familiar ache in his chest, the old weariness. He wanted to believe. God, he wanted to be wrong. If this was a trick, then the universe was a locked room, and morality was a game played for no stakes. If this was real, then the dualism that had haunted his *Methods*—the schism between what was good for him and what was good for all—could be healed.

  "Give us a name," Henry said.

  The medium's mouth opened. No sound came out, only a sigh that smelled of peppermint and stale tea. Then, her hand began to move. Not tapping now. Scriting. She was clawing at the surface of the table, though there was no pencil, no paper.

  *Scritch. Scritch. Pause. Scritch.*

  Myers was trembling. "It's the script. It's the cross-correspondence. We've seen this pattern."

  Henry watched the hand. In the dim blue light, he saw the tendon in her wrist jump. A muscle spasm? Or a signal? He knew the tricks. He had exposed the Davenport brothers. He had debunked slates and trumpets and hidden wires. He was the great filter. But a filter that catches everything lets nothing through.

  If he exposed her now, he saved his intellect but condemned his soul to solitude. If he accepted her, he saved his hope but betrayed his reason.

  The scratching stopped. The medium slumped further, a marionette with cut strings.

  "Well?" Myers urged. "What does it mean?"

  Henry reached into his pocket and struck a match. The flare hissed, blooming sudden and orange, banishing the shadows. The medium blinked, looking dazed, rubbing her eyes. The table was unmarked. There was no dust to show where the finger had dragged.

  "Nothing," Henry said, blowing out the match. The smoke curled up, grey and insubstantial. "Friction. Suggestion. The wood expanded as the room cooled."

  "Henry," Eleanor said softly. She didn't let go of his hand. She knew. She knew that he had seen the tendon jump, and she knew that he had prayed it was a ghost.

  "It was not sufficient," Henry said. He stood up, his knees popping. He felt old. He felt the weight of the years where he had taught men to be good without promising them heaven. He had built a ethics of duty on a foundation of uncertainty.

  The medium was stirring, asking for water. Myers was already jotting notes in a leather book, writing down the rhythm of the taps, finding patterns that Henry's eyes had refused to see. Myers would write the poem. Henry would write the footnote.

  "I shall prepare the report," Henry said, moving toward the gaslight to turn it up. The room flooded with harsh yellow illumination. The velvet looked threadbare. The medium looked tired and poor. The table was just furniture.

  "Did you not feel it?" Myers asked, looking up, his eyes bright with a fever Henry could not share. "The coherence of it?"

  "I felt the table," Henry said. "And I felt the draft from the window."

  He walked to the window and checked the latch. Secure. He checked the curtain. Still.

  As he turned back to the room, he saw Eleanor watching him. There was a pity in her eyes that he found harder to bear than her skepticism. She knew that for Henry, the absence of evidence was not evidence of absence, but it was a wall he could not climb. He had demanded a universe that rewarded the virtuous, and the universe had given him silence.

  He buttoned his coat. "We will pay the lady and escort her home. Frederic, ensure the notes are dated."

  "Henry," Myers said, closing his book. "One day, the pieces will fit. Even if we are not here to see the picture."

  Henry paused. He looked at his hands. They were clean. They had touched nothing but wood and skin.

  "Perhaps," Henry said.

  ***

  *Decades later, long after the gaslights were gone and the members of the Society were dust, the letters would be found. Scattered across three continents, written by mediums who had never met, speaking different languages, scripting fragments of Greek and Latin and obscure literary allusions.*

  *Individually, they were nonsense. A line here, a phrase there, broken shards of pottery.*

  *But when the scholars pieced them together, the shards locked. The fragments formed a mosaic. The allusions aligned to point to a single, coherent argument, a deliberate message constructed from the scattered minds of the dead.*

  *It was the proof Henry had sat in the dark waiting for. It arrived only when there was no one left alive who required it.*
