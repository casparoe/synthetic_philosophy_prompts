answer: |-
  This is a fantastic plot point. You have correctly identified that Mara is making a move that *feels* Parfitian but actually violates the ethical spirit of Parfit's project. She is using a metaphysical reduction to justify a moral exemption, which is precisely the kind of "Self-Interest Theory" behavior Parfit was trying to dismantle.

  To answer your core question: **Yes, she is smuggling in an extra step.**

  Mara's syllogism is:
  1.  Strict personal identity does not exist (True for Parfit).
  2.  Therefore, moral obligation requires strict identity (False for Parfit).
  3.  Therefore, I owe nothing to my future self (False conclusion).

  Parfit's actual view is that obligation tracks **Relation R** (psychological connectedness/continuity), not identity. Since Relation R *does* exist between Mara-Now and Mara-in-20-Years (even if by degrees), obligation *does* exist.

  Here is the precise philosophical shape of Theo's counter-argument, broken down into three moves he can make that stay true to the text of *Reasons and Persons*.

  ### 1. The "Relation R" Correction
  Mara is fixated on the *destruction* of identity. Theo needs to pivot her to the *preservation* of what matters.

  *   **The Philosophy:** Parfit argues that while Identity (the "further fact" of being the exact same soul/entity) doesn't hold, **Relation R** does. Relation R is the holding of psychological connections (memories, intentions, character traits) and continuity (overlapping chains of connection).
  *   **Theo's Move:** He shouldn't argue that she *is* the same person in a metaphysical sense. He should argue that she is *connected* enough to matter.
  *   **The Line:** "Parfit doesn't say nothing matters, Mara. He says *Identity* isn't what matters. *Connection* is what matters. And you are connected to that woman on Mars. She has your memories. She feels your pain. If you starve her now, you aren't hurting a stranger; you're hurting the only thing that actually survives: the chain of psychological continuity. You're sawing off the branch you're sitting on and calling it freedom."

  ### 2. The "Selfishness" Paradox (The Ethical Core)
  This is your strongest thematic ammunition. Mara is using Parfit to justify abandoning commitments (cello, fiancé, retirement). Parfit wrote the book to argue the exact opposite.

  *   **The Philosophy:** Parfit believed that accepting the Reductionist View (that there is no deep, separate self) should make us *less* selfish. If the boundary between "me" and "others" is less significant, we should care more about others. He explicitly argues that realizing our future selves are somewhat distinct should make us *more* moral, not less.
  *   **Theo's Move:** Point out that she is using a philosophy of altruism to justify narcissism. She is treating Future-Mara as a stranger to whom she owes *nothing*. But even if Future-Mara were a total stranger, Parfit argues we owe strangers moral consideration. If she is a *connected* stranger, we owe her *more*.
  *   **The Line:** "You're using Parfit to opt out. But Parfit's whole point is that if the 'self' is an illusion, you can't use it as a shield. He argues that realizing this should make us *less* concerned with our own boundaries, not more. You're taking the idea that 'I am not a permanent entity' and turning it into 'I don't have to keep my word.' That's not Reductionism. That's just rationalization."

  ### 3. The "Intention" Argument (The Promise Specifics)
  This addresses the cello and the engagement directly. It deals with how commitments function over time.

  *   **The Philosophy:** In Part IV of *Reasons and Persons*, Parfit discusses Rationality and Time. He acknowledges that if we view ourselves as a series of selves, we might struggle to keep long-term commitments. However, he argues that forming a commitment *creates* a psychological link. The intention formed now is a mental state that exists in the future self via memory.
  *   **Theo's Move:** Breaking the promise doesn't just affect the future; it retroactively severs the psychological connection *now*. By deciding "I don't have to keep this," she is actively weakening the Relation R between her Now-Self and her Future-Self.
  *   **The Line:** "A promise isn't a chain you put on a future prisoner. It's a bridge. When you promised your teacher, you built a psychological link between you-now and you-then. If you break it, you aren't proving you're free; you're proving the connection is broken. You're actively destroying the continuity Parfit says is the only thing that survives. You're making his theory true by force."

  ### Dramatizing the Scene
  To keep this from sounding like a lecture, Theo needs to be fighting for their relationship, not just winning a debate. He knows philosophy minor limits, so he shouldn't try to out-expert her. He should use her logic to show her the trap she's in.

  **Suggested Beat:**
  1.  **Mara** lays out the Teleporter Case. "The person on Mars isn't *me*. So why should *I* save for *her*?"
  2.  **Theo** accepts the premise (don't fight the Teleporter). "Okay. Grant it. She's not you. She's someone who remembers being you."
  3.  **The Turn:** "If I meet someone who remembers my childhood, loves my music, and carries my debts, do I walk away and say 'not my problem'? Or is that the most selfish thing I could possibly do?"
  4.  **The Climax:** Theo points out that Parfit's view requires us to care *more* about the future, because the "self" is just a vessel for experiences. "If there's no deep self, Mara, then the suffering is all that's real. Whether it's 'you' or 'her' doesn't matter. The pain is real. And you're inflicting it."

  ### The "Smuggled Step" Summary for You
  If you need to keep this straight in your head while writing:
  *   **Mara thinks:** Obligation requires **Identity**. (No Identity = No Obligation).
  *   **Parfit thinks:** Obligation requires **Connection**. (Connection exists = Obligation exists).
  *   **Theo's Job:** Show her that Connection *does* exist, and that breaking promises *destroys* Connection.

  ### A Specific Textual Reference for Theo
  If Theo wants to drop a specific anchor to show he's done the reading (or remembers his minor), have him reference **Part IV, Section 83: "How to be Impersonal."**
  Parfit writes there that accepting his view leads to a life that is "more impartial." Mara is being hyper-partial to her present self. Theo can throw that back at her: *"You're reading Parfit to be more partial to the Present. He wrote it to make us Impersonal. You're doing the opposite of what the book says."*

  This gives Theo the win without requiring him to disprove Parfit. He wins by showing she's misapplying the tool.
