      *   **The Three Pillars of Theo's Argument:**
          1.  Relation R (Connection exists, so care exists).
          2.  The Paradox of Selfishness (Parfit wanted to reduce selfishness; Mara is maximizing it).
          3.  The Constitutive Nature of Promises (Promises build the connection).
      *   **Textual Touchstones:** Give Theo specific phrases to use ("Relation R," "What Matters," "Reductionist View").
      *   **Character Beat:** Theo needs to show that Mara is using this as an escape mechanism, not a genuine philosophical realization.

  7.  **Review against constraints:** The user wants precision to avoid "hand-waving." Need to ensure the distinction between Identity and Connectedness is clear. Need to ensure Theo doesn't sound like he's rejecting Parfit, but *correcting* Mara's application of Parfit.

      *(Self-Correction during drafting)*: Make sure not to get bogged down in the "Self-Interest Theory" vs "Critical Present-Aim Theory" debate too deeply, as it might get too technical for a novel. Stick to the "What Matters" and "Relation R" concepts which are central to the Teleporter case she read.

      *Crucial nuance:* Parfit admits that if connectedness is *very* low, we have less reason to care. But 20 years is not *very* low. Mara is exaggerating the fade. Theo can point out she's misjudging the degree.

      *Another nuance:* Parfit argues that if we accept Reductionism, the boundary between self and others is less significant. This should lead to *more* altruism. Mara is using it for *less* commitment. This is the strongest thematic counter.

  8.  **Final Polish:** Check tone. Supportive, authoritative on the philosophy, focused on dramatic application. (Proceed to generate output).

