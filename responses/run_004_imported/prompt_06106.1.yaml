      *   **Mara's Conclusion:** Since personal identity isn't what matters and psychological connectedness fades over time, future selves are effectively strangers. Therefore, current commitments (retirement, cello, fiancé) don't bind her because the future "her" won't really be "her." She acts on this (quits cello, cancels retirement, challenges engagement).
      *   **The Conflict:** Her fiancé, Theo (philosophy minor), wants to argue against this *on Parfit's own turf*, not just call it crazy.
      *   **The Question:** Is Mara's conclusion ("future-me is a stranger, so nothing's owed") a fair interpretation of Parfit, or is she smuggling in an extra step? What is the *actual* philosophical counter-argument Theo should use that stays true to Parfit's framework?
      *   **Goal:** Provide precise philosophical grounding so the dialogue feels authentic and not made up.

  2.  **Deconstruct Parfit's View (Reasons and Persons):**
      *   *The Reductionist View:* Personal identity consists in physical and/or psychological continuity/connectedness. There is no "further fact" (no soul/ego).
      *   *The Teleporter Case:* If the original is destroyed and a replica made, is it the same person? Parfit argues identity might not hold, but *what matters* (survival) does, because Relation R (psychological connectedness/continuity) holds.
      *   *What Matters:* Survival is not identity. What matters is Relation R (psychological connections like memories, intentions, character traits).
      *   *Degrees:* Relation R can hold by degrees. Identity is all-or-nothing. Therefore, identity is not what matters.
      *   *Implications for Self-Interest:* Parfit argues this reduces the "selfishness" of self-interest. If the connection to my future self is weak, I should care less about *my* future and more about others *now*.
      *   *Implications for Commitment:* This is the crux. Does weak connectedness justify breaking promises?
          *   Parfit actually argues the opposite of Mara. He suggests that if we see ourselves as part of a wider chain of persons (humanity), we become *more* moral, not less.
          *   However, Mara's specific argument is about *binding commitments*. She's using the "discontinuity" to justify *neglect*.
          *   Parfit's view on *Prudence* (rational self-interest): Even if connectedness fades, there is still *some* connectedness. And crucially, Parfit distinguishes between *identity* and *survival*.
          *   *The Key Distinction:* Mara is conflating "Identity doesn't matter" with "Nothing matters." But for Parfit, *Relation R* is what matters. If Relation R exists (even by degrees), there is a basis for concern.
          *   *The "Separateness of Persons" Objection:* Mara is treating her future self as a *different person* entirely to escape obligation. Parfit would say that while they aren't *identically* the same in a metaphysical sense, the psychological connections (memories, intentions) *do* exist. To ignore them is to violate the very connections that constitute survival.
          *   *Commitments/Intentions:* Parfit discusses "Rationality and Time." He acknowledges the "Time-Neutral" view vs. "Present-Aim" view. But he generally supports the idea that rational agents should care about their future selves *because* of Relation R.
          *   *The "Smuggled Step":* Mara is moving from "Identity is not what matters" to "Obligation requires Identity." Parfit explicitly rejects this. Obligation/Care tracks *Relation R*, not Identity. Since Relation R *does* hold between Mara-Now and Mara-20-Years (even if weakened), obligation/care still holds.
          *   *The "Promise" Aspect:* A promise creates a psychological link (the intention to fulfill). Breaking it severs Relation R. So, ironically, keeping the promise *strengthens* the identity connection she claims is weak.

  3.  **Formulate Theo's Counter-Argument (The "Parfitian" Rebuttal):**
      *   *Point 1: You misunderstood "What Matters."* It's not that *nothing* matters. It's that *Relation R* matters. You have Relation R with your future self. Therefore, you should care.
      *   *Point 2: The Selfishness Trap.* Parfit argues that realizing identity isn't deep actually makes us *less* selfish, not more. It binds us to others. Mara is using it to be hyper-selfish (in the moment).
      *   *Point 3: Intentions and Continuity.* Making a promise *creates* a psychological connection. Keeping it maintains Relation R. Breaking it actively *reduces* the connectedness she claims is the only metric. She is sawing off the branch she's sitting on.
      *   *Point 4: The "Stranger" Fallacy.* Future-Mara isn't a stranger. She has Mara's memories. She suffers Mara's pains. The degree of connection is high enough to warrant concern, even if not metaphysical identity.
      *   *Point 5: Rationality.* Parfit favors "Critical Present-Aim Theory" or "Self-Interest Theory" revised. Abandoning future welfare is irrational even on Parfit's terms because the psychological links *exist*.

  4.  **Drafting the Response:**
      *   *Validate the User:* This is a great plot point. Mara's interpretation is a common misreading (nihilistic vs. liberating).
      *   *Identify the Smuggle:* Mara assumes Obligation requires Strict Identity. Parfit says Obligation tracks Psychological Connectedness (Relation R).
      *   *Theo's Moves:*
          1.  **Relation R is the Glue:** You don't need "Identity" to owe something to the future; you just need Connection. And you *are* connected.
          2.  **The Promise *Is* the Connection:** The act of promising creates the psychological link. Breaking it destroys the very continuity she claims is the only real thing.
          3.  **Parfit's Ethics (The Big One):** Parfit wrote *Reasons and Persons* to reduce selfishness. Mara is using it to justify selfishness. This is the ironical twist.
          4.  **The "Degrees" Argument:** Yes, connection fades. But it doesn't vanish. 20 years isn't 100 years. It's still *her* brain, *her* memories.
      *   *Specific Textual References:* Mention "Relation R," "What Matters," "Reductionism," and the distinction between "Self-Interest Theory" and "Critical Present-Aim Theory."
      *   *Dramatic Advice:* How to stage this? Theo shouldn't be pedantic; he should be worried. He sees she's using philosophy to self-sabotage.

  5.  **Refining the Philosophy (Self-Correction/Nuance Check):**
      *   *Wait, does Parfit explicitly talk about promises?* He talks about commitments and intentions. In Part IV, he discusses Rationality and Time. He argues against the "Present-Aim Theory" if it leads to self-defeat.
      *   *Is Mara's view "Present-Aim"?* Yes. She is prioritizing Now-Mara over Future-Mara.
      *   *Parfit's verdict on Present-Aim:* He thinks it's defensible *if* it doesn't conflict with morality. But abandoning future self-interest is usually considered irrational unless the connection is *extremely* weak (like severe dementia).
      *   *The "Stranger" Analogy:* Parfit uses the stranger analogy to show we should care *more* about others, not *less* about our future. If Future-Me is like a stranger, I should treat him with the morality I owe strangers, not zero morality.
      *   *Key Insight:* Mara is treating Future-Mara as a stranger *to whom she owes nothing*. But we owe strangers *some* things (not to harm them, etc.). And Future-Mara is a *special* stranger (connected by memory).

  6.  **Finalizing the Structure:**
