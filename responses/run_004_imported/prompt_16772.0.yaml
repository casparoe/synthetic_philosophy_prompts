      "mach_and_gr": "Here is where you lose significant points. While it is true that Mach's critique motivated Einstein, it is widely accepted in philosophy of physics that GR did *not* 'confirm' Mach's Principle. GR admits vacuum solutions (e.g., Minkowski space, Gödel universe) where inertial structure exists without any matter to relate to. The metric field in GR often plays the role of an absolute object. You should say GR 'incorporates some Machian features' (like frame-dragging) but ultimately fails to fully vindicate Mach. Claiming Newton's absolute space was 'never actually needed' ignores that the metric field retains absolute qualities. Read Earman on this."
