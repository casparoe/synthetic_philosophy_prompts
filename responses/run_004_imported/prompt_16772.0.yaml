      *   **Part (c) Machian Response & GR:**
          *   *Mach's Response:* Inertial forces arise from acceleration relative to the "fixed stars" (the bulk mass of the universe). In a truly empty universe, Mach would arguably say the concepts of rotation/inertia become meaningless or undefined.
          *   *GR & Mach:* This is the tricky part. Did GR *confirm* Mach's Principle?
          *   *Consensus:* Einstein was *motivated* by Mach. GR has *some* Machian features (frame dragging, inertia depends on the metric which depends on mass-energy). However, GR *does not* fully vindicate Mach's Principle. There are vacuum solutions (like Minkowski space or Gödel universe) where inertia exists without matter. Most philosophers of physics (and physicists) agree GR is *not* fully Machian.
