answer: |-
  This is not a dumb question at all. In fact, what you are describing is a well-documented psychological phenomenon, and recognizing it before you hit "submit" is a huge advantage.

  Here is the breakdown of what is happening, why it feels logical, and why it is actually a dangerous trap—especially with Early Decision (ED).

  ### 1. The Psychology: "Information Cascade"
  What you are experiencing is called an **Information Cascade** (or Herd Behavior).
  *   **How it works:** Person A applies because they like the school. Person B sees Person A apply and thinks, *"Person A is smart; they must know something I don't. I'll apply too."* Person C sees A and B apply and assumes there is even *more* secret information validating the school.
  *   **The Reality:** By the time it gets to you, nobody is acting on their own private information (like program quality or fit) anymore; everyone is acting on the actions of the previous people.
  *   **The Verdict:** You noted that **no new info has come out.** That is the smoking gun. If the school hasn't changed, and your goals haven't changed, the only variable is social pressure.

  ### 2. The Stakes: Early Decision is Binding
  If this were Regular Decision, following your friends would be a low-risk move. You could apply to their school and your top choice, get into both, and then decide.
  **With Early Decision, you do not have that luxury.**
  *   **It is a contract:** If you get in, you *must* go. You withdraw all other applications.
  *   **The Academic Cost:** You mentioned your other top choice has a "way better program" for what you want to study. In college, your major and department matter immensely for internships, networking, and grad school. Sacrificing a superior academic program for social proximity is a trade-off that often leads to resentment by sophomore year.
  *   **The Financial Cost:** ED prevents you from comparing financial aid packages. If your friends' families can afford it but yours can't, you are legally bound to attend anyway (unless the aid package is truly impossible, which is a hard bar to clear).

  ### 3. The Social Reality Check
  It is incredibly tempting to want to go to school with your friends. High school is ending, and that is scary. But consider these points:
  *   **The "Bubble" Effect:** When you go to college with your entire high school friend group, you often fail to branch out. You end up hanging out with the same people in the same dorms, recreating high school dynamics rather than growing.
  *   **Drift is Natural:** Friend groups change in college. People join different clubs, date different people, and have different schedules. Even if you go to the same school, you might not see them as much as you think.
  *   **Visiting is Easy:** If you go to the school with the better program, your friends can visit you on weekends, and you can visit them. Modern friendship doesn't require living in the same zip code.

  ### 4. Is there *any* logic to it?
  There is only one logical reason to follow them: **If the school is actually a top choice for you, too.**
  *   If you look at the school objectively (ignoring your friends) and think, *"I would be happy here for 4 years, the program is good enough, and the cost works,"* then applying ED increases your odds of admission and secures your spot with friends.
  *   But if you are doing it *solely* because they are doing it, the logic falls apart. You are making a 4-year binding decision based on 2 weeks of social momentum.

  ### What should you do?
  1.  **Break the Silence:** You said you've never compared schools side-by-side. **Do that.** Ask your friends: *"Hey, I'm stressed about ED. Can we actually talk about why we picked this school? I'm worried I'm missing something."* You might be shocked to find out they are just as unsure as you are and are also following the herd.
  2.  **Re-evaluate Your Top Choice:** Look at the school with the better program. Why did you like it? Write those reasons down. Compare them to the "Friend School."
  3.  **Ignore the "Secret Info" Fear:** Accept that your friends don't know anything you don't. They are just as anxious as you are.
  4.  **Trust Your Gut:** You said you were "seriously considering it" but also that you had a "way better program" elsewhere. That hesitation is your intuition telling you that this doesn't align with your goals.

  **The Bottom Line:**
  It is not "dumb" to feel the pull, but it would be a **strategic mistake** to commit ED to a school that isn't your true #1 just to maintain a high school social dynamic.

  College is the first place where you build a life based on *your* ambitions, not your proximity to others. If the program elsewhere is better, trust the research you did before the groupthink started. You can keep your friends without signing a binding contract to attend the same college.
