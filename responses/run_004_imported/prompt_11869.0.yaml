answer: |-
  This is a classic debate in the philosophy of biology, often centered around the work of philosophers like Sahotra Sarkar, Peter Godfrey-Smith, and John Maynard Smith. Since you want to avoid the "language is fuzzy" non-answer, we need to treat this like an interface specification.

  We can evaluate whether "code" is doing **literal explanatory work** versus **metaphorical heavy-lifting** by applying three specific technical criteria derived from your software engineering definition.

  Here is the breakdown of the criteria, followed by the verdict on the Codon Table vs. the "Blueprint for an Organism" claim.

  ### The Three Criteria for a "Literal Code"

  To qualify as a literal code (like ASCII or Base64) rather than a causal metaphor (like "the rings of a tree code for its age"), the system must satisfy these three conditions:

  1.  **Arbitrariness (Conventionality):** The mapping between the symbol and the outcome must not be determined by physical law. If $A \to B$ happens solely because of chemical affinity or thermodynamic necessity, it is a *reaction*, not a *code*. A code requires that $A \to C$ could have worked just as well if the system were configured differently.
  2.  **Decoupled Decoder:** There must be a distinct mechanism that interprets the symbols, separate from the symbols themselves. The storage medium (DNA) cannot be the same thing as the processing machinery (Ribosome/tRNA). The "meaning" is not intrinsic to the molecule; it is imposed by the decoder.
  3.  **Causal Specificity (The "API" Test):** Changing the symbol must predictably change the output in a way that is isolated from the rest of the system. If changing a bit flips a specific boolean, it's code. If changing a bit alters the voltage of the whole board which *might* change a light depending on the temperature, it's a causal parameter, not a code.

  ---

  ### 1. The Codon Table (Narrow Claim)
  **Claim:** "The sequence of nucleotides is a code for the sequence of amino acids."

  **Verdict:** **Literal Code.** This passes all three criteria. This is where your friend is right.

  *   **Arbitrariness:** There is no chemical reason why the triplet `AUG` must recruit Methionine. It is not a lock-and-key chemical fit between the mRNA codon and the amino acid itself. The mapping is mediated by tRNA and aminoacyl-tRNA synthetases. We know this is arbitrary because in a lab, we can reassign codons (synthetic biology) to encode non-canonical amino acids. The system still runs; the mapping is just reconfigured. This is the "Frozen Accident" theory your friend mentioned.
  *   **Decoupled Decoder:** The DNA/mRNA is passive data. It does nothing until the Ribosome (the CPU) and tRNA (the lookup table/pointers) act upon it. The information is stored in the nucleus; the decoding happens in the cytoplasm. This separation is structurally identical to storing a binary executable on a disk and loading it into RAM for execution.
  *   **Causal Specificity:** If you mutate `UUU` to `UUC`, the output is identical (Phenylalanine). If you mutate `UUU` to `AUU`, the output changes specifically to Isoleucine. The relationship is discrete and local.

  **Explanatory Work:** Calling this a "code" is not a metaphor here; it is the most precise model we have. It allows us to predict the outcome of mutations, design synthetic genes, and understand translation errors. It does real work.

  ---

  ### 2. The "Blueprint for an Organism" (Broad Claim)
  **Claim:** "DNA contains the information/code for eye color, height, or building the organism."

  **Verdict:** **Metaphorical / Borrowed Credibility.** This fails the criteria. This is where your skepticism is justified.

  *   **Arbitrariness (Failed):** The link between a gene and a trait (phenotype) is **not arbitrary**; it is physical and causal. A specific protein variant might fold differently, absorb light differently, or catalyze a reaction faster. This isn't a convention like ASCII; it's physics. If you change the protein structure, the light absorption changes *because of chemistry*, not because a decoder decided to interpret it differently.
  *   **Decoupled Decoder (Failed):** There is no distinct "organism builder" machine that reads the DNA and constructs the eye. The "decoder" is the entire cell, the tissue environment, epigenetic markers, and external environmental factors (light, nutrition). The "processing" is distributed across the entire developmental system. The DNA is not a program being run; it is a resource being consumed by a self-organizing chemical system.
  *   **Causal Specificity (Failed):** This is the biggest failure point. DNA does not map to traits in a 1:1 or even N:1 way that resembles a function call.
      *   **Pleiotropy:** One gene affects multiple traits.
      *   **Polygenicity:** One trait (like eye color) is affected by many genes (OCA2, HERC2, etc.).
      *   **Context Dependence:** The "output" of a gene depends on the state of the cell, which depends on signals from other cells, which depend on the environment.
      *   **Analogy:** It is not like `if (gene == blue) { eye_color = blue; }`. It is more like changing a single resistor value in an analog synthesizer and hoping to predict the exact song it will play after running through a distortion pedal, a room with specific acoustics, and a human operator tweaking knobs.

  **Explanatory Work:** Here, "code" is doing metaphorical work. It borrows the precision of the codon table to imply a level of control and determinism that does not exist. When biologists say "the gene for eye color," they are using a shorthand for "a genetic variant that is statistically correlated with eye color variance in a specific population."

  ---

  ### Why the Distinction Matters (The "So What?")

  You asked when the terminology does real work versus when it's just vibes. Here is the practical consequence of the distinction:

  **1. When "Code" is Useful (The Codon Level)**
  When working at the level of transcription and translation, the code model is predictive. If you are engineering insulin production in bacteria, you treat DNA as code. You optimize codons for the host's tRNA abundance. You treat the ribosome as a compiler. This works because the abstraction holds.

  **2. When "Code" is Misleading (The Trait Level)**
  When working at the level of development or disease, the code model breaks down and leads to **Genetic Reductionism**.
  *   **The Error:** If DNA is a code/blueprint, then the organism is "determined" by the DNA. This implies that if we just "read the code," we can predict the organism.
  *   **The Reality:** Because the "decoder" (development) is a complex, non-linear dynamical system, the DNA is merely a *constraint* on the system, not a *command*.
  *   **Example:** Saying "DNA codes for eye color" suggests the DNA builds the eye. In reality, the DNA codes for proteins that participate in a pigment synthesis pathway, which operates within a cell, within an iris, within an embryo, subject to stochastic noise. The "information" for the eye is distributed across the DNA, the cytoplasm, the maternal environment, and physical laws of optics and chemistry.

  ### The Precise Distinction: Syntax vs. Semantics

  To settle your argument, you can use this distinction:

  *   **DNA is literally a code at the Syntactic Level.** (Nucleotides $\to$ Amino Acids). The mapping is arbitrary, the decoder is distinct, and the translation is discrete. Your friend wins here.
  *   **DNA is metaphorically a code at the Semantic Level.** (Genes $\to$ Traits/Organism). The mapping is causal/physical, the decoder is the entire environment, and the translation is non-linear. You win here.

  **The "Information" Trap**
  When people say "DNA contains the information for the organism," they are conflating **Shannon Information** (sequence complexity) with **Semantic Information** (meaningful instruction).
  *   DNA definitely has high Shannon Information (it's a complex sequence).
  *   But it only has Semantic Information ("build an eye") relative to the specific context of the cellular machinery and environment. Without the cell, the DNA is just a long, inert polymer. A blueprint without a builder is just paper.

  ### Final Verdict for the Argument

  Tell your buddy this:

  > "You are right that the **Genetic Code** (codon table) is a literal code by any CS definition: it uses an arbitrary mapping and a distinct decoder. That terminology does real explanatory work in molecular biology.
  >
  > "However, when you extend that to say DNA contains the **Information for a Trait or Organism**, you are smuggling in the precision of the codon table to describe a process (development) that doesn't fit the definition. At that level, the mapping isn't arbitrary, there's no distinct decoder, and the causality isn't specific. At the organism level, 'code' is a metaphor that hides the complexity of the system. It's not wrong to use it as a heuristic, but it's wrong to treat it as literally true in the same way the codon table is."

  This acknowledges his technical correctness on the biochemistry while validating your architectural skepticism on the systems biology.
