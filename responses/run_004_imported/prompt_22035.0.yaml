              *   *Health/Strength:* He argues there's no evidence it weakens men (citing Greeks/Romans).
              *   *Disgust/Nature:* He argues "nature" is a vague term and disgust is subjective (asceticism critique).
          *   **The Role of Law:** Law should only intervene to prevent *mischief* (harm/pain) to others. Private vices that harm no one are not fit subjects for legal punishment.
      *   *The "Harm Principle" Nuance:* The user is right that Bentham anticipated Mill. Bentham's principle of utility dictates that law is an "evil" (restriction of liberty) that is only justified if it prevents a greater evil (harm).

  3.  **Apply to Case 1: AI Companion Apps (Replika, etc.):**
