answer: |-
  Good morning. Thank you all for being here.

  I've been told that because I'm the novelist in the family, I'm the natural choice to speak today. The assumption is that because I write sad books for a living, I must be good at saying goodbye. But anyone who knew Frankie knows that she had very little patience for fiction. Especially the comforting kind. And especially the kind we tell ourselves about goodness.

  Many of you know Frankie as the aunt who was already on a plane to a disaster zone while the rest of us were still checking our news feeds. Some of you know her as the woman who gave a kidney to a stranger in her fifties, or the home that fostered nearly nine children over the decades. The local paper once called her a "modern-day saint." Those of you who were at Thanksgiving that year remember the scene: Frankie made us all sit through her furious letter to the editor, correcting their terminology. To the family, it looked like humility. To the philosophers in the room, it was a matter of categorical integrity.

  Frankie spent forty years arguing that "supererogation" doesn't exist. That is a fancy word for "going above and beyond the call of duty." She believed that if an action is the best thing to do, morality doesn't offer you a choice about it. It doesn't give you extra credit for doing it, and it doesn't let you off the hook for ignoring it. There is no "beyond." There is only "what is required."

  So, I stand here with a difficult task. Half of this room wants to hear that she was a hero who did more than anyone could ask. The other half knows that saying that would make her roll over in her grave, because she spent her career proving that "more than asked" is a myth.

  How do we honor a woman who argued that her greatest acts of love were simply her job?

  I think the answer lies in how she made that duty feel. For Frankie, the absence of "optional" goodness didn't make the world cold. It made it clear. She didn't view her kidney donation as a sacrifice. She viewed it as a math problem where the answer was obvious. She didn't view fostering children as charity. She viewed it as a response to a need that was right in front of her.

  She removed the drama from morality. She didn't see herself as climbing a mountain of virtue; she saw herself as walking on flat ground, while the rest of us were inventing obstacles.

  I know what some of you might be thinking. If Frankie believed that doing the best thing was *required*, does that mean she thought the rest of us were failures? If her bar was the floor, are we all in the basement?

  I asked her that once, years ago. I was struggling with my own choices, feeling the weight of her example. I asked if she thought I was immoral for not doing more. She looked at me, poured me some tea, and said, "Morality isn't a weapon. It's a map. I'm not here to judge where you are. I'm just here to tell you that the path is visible."

  She was rigorous with herself, but she was gentle with us. She understood that seeing the "required" path is hard. She knew that fear, and exhaustion, and confusion often blur the map. She never used her philosophy to shame anyone. She used it to steady herself.

  To her colleagues and students: She remained true to the end. She never accepted the title of saint. She never accepted the idea that she was special. She would want you to know that she didn't do these things because she was extraordinary. She did them because she was paying attention.

  To her family and friends: We don't have to agree with her philosophy to feel the warmth of her life. We can call it love. We can call it grace. We can call it "going above and beyond," even if she wouldn't. Because from where we stand, in the grief of losing her, what she did *looks* like a miracle. It looks like she gave us more than we deserved. And maybe that's the thing she got wrong. Maybe the world *does* need the concept of supererogation, just so we have a word for how it felt to be loved by her.

  But if we want to honor her honestly, we shouldn't put her on a pedestal. She hated heights. She preferred the ground level. She preferred the messy, unglamorous work of showing up.

  So, let's not promise to be saints. She wouldn't want that. Let's not promise to be heroes. She didn't believe in them.

  Instead, let's try to be a little more like Frankie. Let's try to stop calculating the cost of doing the right thing. Let's try to stop looking for the line where our duty ends and our comfort begins. Because she showed us that the line isn't real.

  She showed us that when someone is hurting, you don't weigh the options. You help. When there is work to be done, you don't wait for a reward. You work. Not because you want to be good, but because the situation requires it.

  Frankie didn't leave us a legacy of rules. She left us a legacy of clarity. In a world that loves to complicate ethics, to argue about where the boundaries are, to debate how much is "enough," she was a straight line.

  We will miss her. We will miss the arguments at Thanksgiving. We will miss the way she could silence a room not by raising her voice, but by stating the obvious truth that everyone else was avoiding.

  Rest now, Frankie. You've done what was required. You've done the work. The rest of us will try to pick up the map.

  Thank you.
