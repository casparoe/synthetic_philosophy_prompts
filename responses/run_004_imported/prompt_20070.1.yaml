prompt: |-
  My aunt Frankie died on Sunday, and because I'm the novelist in the family I've been asked to give the eulogy this Saturday -- everyone assumes that because I write books for a living (sad ones, mostly) I must be good at this, which is not actually how eulogies work. Here's the complication: Frankie was a moral philosopher for almost forty years, not famous outside her own little corner of the field, but she published, had a string of grad students who adored her, and her whole scholarly thing -- the hill she chose to die on, academically -- was arguing that supererogation basically doesn't exist. You know, "going above and beyond the call of duty." She thought the whole category was a comforting fiction, something like Kagan's "no options" line (Limits of Morality, I think? she quoted it at Thanksgiving so often we could all recite the gist) -- that if an act really is the best available thing to do, morality doesn't hand you a choice about it, it just requires it of you. And then, infuriatingly, she went and spent her actual life doing things that look, to the rest of us, exactly like the thing she said didn't exist: gave a kidney to a total stranger in her fifties, fostered something like nine kids over the decades, and was the aunt who'd already be on a plane to the disaster zone while everyone else was still doomscrolling. A local paper once profiled her as "a modern-day saint," and she made us all sit through her furious letter to the editor at the next family dinner, because apparently "saint" is a real technical term in this literature and she took it as an insult.

  So here's my actual problem. Half the room Saturday is going to be old friends and family who want to hear some version of "she went above and beyond," and the other half is former students and colleagues who will visibly wince if I say that exact sentence, since it's basically the one she spent her career arguing was a category error. I can't get up there and deliver a philosophy lecture, and I definately can't imply that everyone who hasn't donated a kidney is a moral failure, which is uncomfortably close to what her actual position entails once you push on it. What I want is a eulogy, something like seven or eight minutes, that's honest to what she really thought -- that the philosophy people in the room recognize as fair to her actual views instead of the fortune-cookie version -- but that still comforts a room full of people who just loved her and could not care less about the literature. Could you draft it for me?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (writes sad books), niece/nephew of the deceased.
      *   **Deceased:** Aunt Frankie, moral philosopher (40 years), specialized in supererogation (argued it doesn't exist).
      *   **Core Conflict:** Frankie argued that "going above and beyond" is a fiction (if it's the best thing to do, it's required). However, her *life* looked exactly like supererogation (kidney donation, fostering, disaster relief).
      *   **Audience:** Split 50/50. Family/Friends (want to hear she was a saint/hero) vs. Colleagues/Students (know her theory, will wince at "above and beyond").
      *   **Constraints:** 7-8 minutes spoken (approx. 1000-1200 words). Must be honest to her philosophy without being a lecture. Must comfort the family without implying moral failure for those who didn't donate kidneys. Must avoid the "saint" label (she hated it).
      *   **Tone:** Honest, warm, slightly intellectual but accessible, respectful of the contradiction.

  2.  **Deconstruct the Philosophical Position:**
      *   *Supererogation:* Acts that are good to do but not wrong to omit (heroism, sainthood).
      *   *Frankie's View:* If an act is the *best* available thing to do, morality *requires* it. There is no "extra credit." There is only "what is right."
      *   *The Tension:* She lived a life of extreme sacrifice. To the layperson, this is "above and beyond." To her, this was just "doing what was required."
      *   *The Trap:* Calling her a saint implies she did *more* than was needed. Calling her "duty-bound" might sound cold or judgmental to the grieving family.
      *   *The Solution:* Frame her life not as *extraordinary* in the sense of "optional extra," but as *consistent*. She didn't see a line between "duty" and "sacrifice." She saw only "what needs doing." This bridges the gap: The family sees the sacrifice (love), the philosophers see the elimination of the supererogatory category (duty).

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the role (novelist), acknowledge the loss, set the tone (warm but clear-eyed).
      *   **The Philosophical Elephant:** Address her work early but simply. Don't lecture. Use her own frustration with the word "saint."
      *   **The Life Lived:** Detail the specific acts (kidney, fostering, disaster zones) but frame them through *her* lens, not the public's.
      *   **The Reconciliation:** How do we love her without violating her theory? We love her because she made the "required" look like love. She didn't make us feel guilty; she made us feel capable.
      *   **Closing:** A send-off that honors her specific view of morality (no options, just love) without condemning the rest of us.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the "novelist" assumption. It's a good hook. Acknowledge the sadness of the books vs. the reality of the woman.
      *   *The Theory:* How to explain "no supererogation" simply? "There is no extra credit." "If it's the right thing, it's just the thing." Mention the "Saint" letter to the editor. That's a great anecdote.
      *   *The Actions:* Kidney, fostering. How to describe these? Not as "sacrifices" (which implies giving up something optional) but as "responses." She saw a need, she met it. To her, the math was simple.
      *   *The Audience Split:* I need to speak to the philosophers without alienating the family. *Idea:* The philosophers know she hated the word "saint." The family knows she was holy. The truth is in the middle. She didn't do it for praise; she did it because the alternative was unthinkable.
      *   *The Guilt Factor:* Crucial point. I cannot imply everyone else is a failure. How? Frankie wasn't a judge; she was an example. She didn't demand we give kidneys; she showed us that when the call comes, we answer. Her rigor was for herself, her kindness was for us.
      *   *Conclusion:* Bring it back to love. Morality, for her, wasn't cold rules. It was love in action.

  5.  **Refining the Tone (Self-Correction during drafting):**
      *   *Check:* Is it too academic? *Fix:* Use metaphors. "The line between duty and grace."
      *   *Check:* Is it too cold? *Fix:* Emphasize her warmth. She didn't do this grimly. She did it with joy.
      *   *Check:* Is the length right? *Fix:* Aim for ~1100 words. Speak at a measured pace.
      *   *Check:* The "Kagan" reference. *Fix:* Keep it subtle. "No options" is enough, no need for book titles.
      *   *Check:* The "Saint" incident. *Fix:* Make sure it lands as funny/character-revealing, not just pedantic.

  6.  **Final Polish:**
      *   Ensure the transition from her theory to her life feels seamless.
      *   Make sure the ending resonates emotionally. The idea that she "removed the excuse" but "gave the example."
      *   *Key Phrase:* "She didn't believe in heroes. She believed in neighbors." (Maybe too cliché? Let's try: "She didn't believe in going above and beyond. She believed in showing up.")

  7.  **Final Review against constraints:**
      *   7-8 mins? (Word count check: ~1000-1100 words is usually safe for 7-8 mins with pauses).
      *   Honors philosophy? Yes (acknowledges the supererogation stance).
      *   Comforts family? Yes (focuses on love and consistency).
      *   Avoids "Saint"? Yes (explicitly mentions her dislike of it).
      *   Avoids guilt-tripping? Yes (frames her life as an invitation, not a indictment).

  *(Self-Correction on Word Count)*: A spoken minute is roughly 130-150 words. 7 minutes = ~950-1050 words. 8 minutes = ~1100. I will aim for around 1050 words to allow for pauses and emotion.

  *(Drafting the content...)*
  *   Start with the novelist joke.
  *   Move to the "Saint" letter.
  *   Explain the philosophy simply (The "No Options" clause).
  *   Describe the kidney/fostering not as sacrifice but as "the only option."
  *   Address the guilt: She was gentle, not judgmental.
  *   End on the idea of "showing up."

