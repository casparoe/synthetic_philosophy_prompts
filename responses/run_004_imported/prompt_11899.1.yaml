prompt: |-
  Ok this is a weird one but I think there's an actual philosophical knot buried in it. I'm a backend engineer at a ~50 person startup, and because nobody else wanted the job I ended up on the 3-person committee that handles benefits edge cases our policy doesn't clearly cover. Current case: an employees spouse died about 14 months ago, they used up the standard 2-week bereavement leave right after it happened, and now their therapist has diagnosed them with 'prolonged grief disorder' (apparently an actual new diagnosis, added to the DSM not to long ago) and is asking us to approve several more weeks of paid leave. We're too small to have real disability insurance, so our medical-leave policy is basically just an internal rule: up to 6 weeks paid for 'diagnosed medical conditions,' decided case by case, and nobody ever defined what that phrase means. One committee member's gut reaction is that grief isn't an illness, everyone's timeline is different, and we'd be medicalizing something totally normal if we treat this like we'd treat a broken leg. The other's reaction is that a licensed professional applied actual diagnostic criteria here, and it's not our place to overrule that just because we personally think the cause is 'normal.' I keep feeling like this isn't really a medical disagreement so much as a disagreement about what even makes something count as a disease in the first place, and I don't have the background to referee that. Can you write the actual memo I'd bring to the other two? We meet Monday, and I need it to land on a real recommendation for this specific case plus a rule of thumb for next time, not a pass-the-buck non-answer, and it should take the side it doesn't land on seriously instead of strawmanning it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer at a ~50 person startup, member of a 3-person benefits committee.
      *   **Situation:** Employee's spouse died 14 months ago. Used standard 2-week bereavement leave. Now diagnosed with "Prolonged Grief Disorder" (PGD) by a therapist. Requesting several more weeks of paid leave under the "diagnosed medical conditions" policy (up to 6 weeks paid, case-by-case).
      *   **Conflict:**
          *   Committee Member A: Grief isn't an illness; medicalizing normal human experience; slippery slope.
          *   Committee Member B: Licensed professional diagnosis; not our place to overrule medical expertise; cause doesn't negate condition.
          *   User (Writer): Feels this is a philosophical disagreement about the definition of disease/illness, not just medical facts. Needs to referee without overstepping expertise.
      *   **Goal:** A memo for the Monday meeting.
      *   **Requirements:**
          *   Land on a real recommendation for *this* case.
          *   Provide a rule of thumb for *future* cases.
          *   Take both opposing sides seriously (no strawmanning).
          *   Acknowledge the philosophical knot (definition of disease).
          *   Tone: Professional, empathetic, clear, decisive but collaborative.

  2.  **Deconstruct the Philosophical Knot:**
      *   *The Naturalist View (Member A):* Disease is a deviation from natural biological function. Grief is a natural response to loss. Therefore, it shouldn't be classified as a medical condition for leave purposes.
      *   *The Normativist/Pragmatist View (Member B):* Disease is what causes significant impairment/distress and is recognized by medical authorities (DSM-5-TR). If a doctor says it's a disorder, it's a disorder.
      *   *The Middle Ground (The User's Insight):* The distinction lies in *functional impairment* vs. *etiology* (cause). PGD is distinct from normal grief because it prevents functioning, not just because it lasts long. The policy intent is to support employees who *cannot work* due to health, regardless of whether the root cause is "natural."

  3.  **Determine the Recommendation:**
      *   *Specific Case:* Approve the leave. Why? Because PGD is a recognized DSM-5-TR diagnosis (added in 2022). It implies clinical impairment beyond normal grieving. Denying it risks legal/ethical issues and contradicts the "diagnosed medical conditions" wording.
      *   *Rule of Thumb:* Focus on *functional capacity* and *professional validation*, not the *origin* of the condition. If a licensed provider diagnoses a condition recognized by major medical bodies that impairs work function, it qualifies.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty. Validate both colleagues' perspectives immediately to build trust.
      *   **The Core Tension:** Explicitly name the philosophical disagreement (Natural vs. Medicalized). This shows the user understands the depth of the issue.
      *   **Analysis of Member A's View:** Validate the concern about medicalizing life. Acknowledge the risk of setting a precedent where normal human struggles become HR tickets.
      *   **Analysis of Member B's View:** Validate the reliance on expertise. Acknowledge the risk of HR playing doctor.
      *   **The Synthesis/Recommendation:**
          *   *Decision:* Approve the leave.
          *   *Reasoning:* PGD is distinct from grief in clinical terms (impairment). The policy says "diagnosed medical conditions."
          *   *Future Framework:* Establish criteria based on *diagnosis recognition* (DSM/ICD) and *functional impact*, not just "is this sad?"
      *   **Closing:** Call to action for the meeting.

  5.  **Refining the Tone:**
      *   *Avoid:* Jargon-heavy philosophy, HR legalese, emotional manipulation.
      *   *Include:* Respect for the deceased, respect for the employee's privacy, respect for the company's resources.
      *   *Key Phrase:* "We are not adjudicating the validity of grief; we are adjudicating the validity of the medical certification."

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is this too soft?
      *   *Fix:* Make the recommendation bold. "I recommend we approve."
      *   *Critique:* Does it address the "14 months later" aspect?
      *   *Fix:* Yes, mention that the timing is actually *evidence* for PGD (persistence beyond expected norms), which supports Member B without invalidating Member A's concern about timelines.
      *   *Critique:* Is the rule of thumb actionable?
      *   *Fix:* Make it a checklist: Licensed provider + Recognized Diagnosis + Work Impairment.

  7.  **Final Polish:** Check against the prompt's constraints.
      *   Real recommendation? Yes.
      *   Rule of thumb? Yes.
      *   Take both sides seriously? Yes.
      *   Philosophical knot acknowledged? Yes.

  8.  *(Final thought)*: Ensure the distinction between "Bereavement Leave" (event-based) and "Medical Leave" (condition-based) is clear. This is the crux of the policy loophole.

  9.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **To:** Benefits Committee
  **From:** [Your Name]
  **Date:** [Date]
  **Subject:** Recommendation regarding Medical Leave Request [Case ID/Employee Initials] & Policy Framework

  Hi team,

  I know we're meeting Monday to decide on the medical leave request regarding the employee diagnosed with Prolonged Grief Disorder (PGD). This is a tough case, not just logistically but conceptually. I've spent some time thinking about the disagreement we had last week, and I want to propose a path forward that addresses the specific request while solving the underlying policy ambiguity.

  We are currently stuck between two valid perspectives:

  1.  **The "Medicalization" Concern:** Grief is a universal human experience, not a pathology. If we treat extended grief as a medical condition requiring paid leave, we risk turning normal human suffering into an HR administrative process. We worry about setting a precedent where any difficult life event becomes a billable medical condition.
  2.  **The "Deference to Expertise" Concern:** A licensed mental health professional has applied specific clinical criteria to diagnose a recognized condition (PGD was added to the DSM-5-TR in 2022). As a committee, we are not clinicians. If we reject a diagnosis because the *cause* (death of a spouse) seems "normal" to us, we are effectively practicing medicine without a license and potentially violating the intent of our own "diagnosed medical conditions" policy.

  **The Philosophical Knot**
  I believe our disagreement isn't actually about grief. It's about how we define "disease" for the purpose of company policy.
  *   Side A is arguing from a **Naturalist** view: Disease is a biological malfunction. Grief is a biological *function*.
  *   Side B is arguing from a **Normativist** view: Disease is whatever causes significant impairment and is recognized by medical authorities.

  For a startup benefits policy, I believe we have to lean toward the Normativist view, but with strict guardrails. Our policy is not designed to judge the *origin* of a condition, but to support employees who are *medically unable to work*.

  **Recommendation for This Case**
  **I recommend we approve the requested leave.**

  Here is why:
  1.  **Clinical Distinction:** Prolonged Grief Disorder is distinct from "normal" grief. The diagnostic criteria require that the grief response persists beyond expected social/cultural norms (usually 12+ months) *and* causes significant functional impairment. The fact that this is happening 14 months out is not evidence that it's "just grief"; clinically, it is evidence that it meets the threshold for PGD.
  2.  **Policy Language:** Our policy covers "diagnosed medical conditions." PGD is a diagnosed medical condition. To deny this based on the *cause* of the condition would require us to rewrite the policy to exclude mental health conditions stemming from life events, which opens us to significant legal and ethical risk.
  3.  **Risk Management:** Denying a claim backed by a licensed provider for a DSM-recognized diagnosis invites liability. Approving it sets a precedent, but one we can control with better criteria (see below).

  **Proposed Rule of Thumb for Future Cases**
  To address the concern that we are "medicalizing normal life," I propose we adopt the following three-part test for any future ambiguous medical leave requests. This moves us away from judging the *cause* and toward judging the *certification*.

  We should approve leave if **all three** conditions are met:
  1.  **Licensed Provider:** The diagnosis comes from a licensed medical/mental health professional (MD, PhD, LCSW, etc.).
  2.  **Recognized Diagnosis:** The condition is recognized by a major medical body (e.g., DSM-5, ICD-10). This filters out trendy or non-clinical labels.
  3.  **Functional Impairment:** The provider explicitly certifies that the condition impairs the employee's ability to perform their job duties, not just that they are experiencing symptoms.

  **Why this works:**
  *   It satisfies **Side B** because we defer to the doctor on the diagnosis.
  *   It satisfies **Side A** because "Functional Impairment" is the barrier that separates normal human struggle from medical leave. If an employee is grieving but functioning, they don't meet criterion #3. If they are grieving and *cannot work*, the origin matters less than the capacity.

  **Next Steps**
  If we agree on this framework, I can draft a brief addendum to our benefits handbook so future committees aren't put in this position. For this specific employee, I suggest we approve the leave without commentary on the nature of the diagnosis, simply citing "Certified Medical Condition."

  Let's discuss this Monday. I think this allows us to be humane to the employee without abandoning our responsibility to steward company resources.

  Thanks,

  [Your Name]
