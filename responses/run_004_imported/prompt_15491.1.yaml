  2.  **Evaluate Theories based on AI/Engineering Utility:**
      *   *Criteria:* How easily can this be operationalized into code, metrics, or verification protocols? Does it provide clear conditions that can be checked?
      *   **Bratman:** Focuses on interlocking intentions, mutual responsiveness, and commitment to mutual support. This maps very well to distributed systems, consensus algorithms, and communication protocols. It's reductive, meaning it breaks down into individual states + relations, which is how multi-agent systems are built. *High utility.*
      *   **List and Pettit:** Focuses on group agency as a functionalist concept, often using judgment aggregation logic. This is highly formalizable (logic, voting mechanisms, consistency constraints). It treats the group as an agent, which fits the "system as a whole" verification goal. *High utility, perhaps slightly more abstract than Bratman regarding individual interactions, but very strong on formal logic.*
      *   **Tuomela:** Distinguishes between "we-mode" (group reason) and "I-mode" (individual reason). This provides a clear classification criterion for agent motivations. It can be operationalized by checking if the utility function is defined over group states vs. individual states. *Medium-High utility.*
      *   **Gilbert:** Focuses on "joint commitment" and the creation of a "plural subject." This involves normative obligations created between agents. While useful for modeling norms, the metaphysical aspect of a "plural subject" is harder to verify computationally than plan structures. *Medium utility.*
      *   **Searle:** Claims collective intentionality is a primitive biological/mental state that cannot be reduced to individual intentions plus mutual beliefs. This is arguably the *least* useful for engineering because it says "you can't build this out of parts," whereas AI is built out of parts. It offers no structural criteria for verification. *Low utility.*

