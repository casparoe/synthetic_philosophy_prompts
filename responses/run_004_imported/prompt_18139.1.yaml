  2.  **Identify the Philosophical Core:**
      *   This is a classic problem in the philosophy of action and decision theory.
      *   It closely resembles the **Toxin Puzzle** proposed by Gregory Kavka (1983).
      *   *The Toxin Puzzle:* An eccentric billionaire offers you $1 million if you *intend* at midnight tonight to drink a harmless but painful toxin tomorrow afternoon. You don't have to actually drink it, just intend to. Once you have the money, you have no reason to drink the toxin (it causes pain, no extra reward). Can you form the intention?
      *   *Key Parallel:* Grandpa's offer is structurally identical to Kavka's Toxin Puzzle. Money/Reward is contingent on *intention*, not *action*. Action (cleaning garage/drinking toxin) is costly (wasted Sunday/pain) with no subsequent benefit.

