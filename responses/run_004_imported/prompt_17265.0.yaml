answer: |-
  This is an exceptionally insightful question, and it touches on one of the most subtle distinctions in the foundations of computer science. For an IB Extended Essay, grappling with this nuance will demonstrate a high level of critical thinking.

  The short answer is: **You are conflating two different claims.** The mathematical equivalence of the formalisms is indeed a settled theorem. However, the Church-Turing Thesis (CTT) makes a claim that goes *beyond* mathematics, bridging the gap between formal mathematics and the informal, intuitive world.

  Here is a breakdown of why the equivalence proofs do not turn the Church-Turing Thesis into a theorem, and why its status remains philosophical and empirical.

  ### 1. The Distinction: Formal Equivalence vs. Conceptual Adequacy

  To understand why CTT is not a theorem, we must distinguish between the **Convergence Result** and the **Thesis itself**.

  *   **The Convergence Result (Theorem):** In the 1930s, Church, Turing, Kleene, and Post defined different formal systems (Lambda Calculus, Turing Machines, General Recursive Functions). Mathematicians subsequently **proved** that these systems define the exact same class of functions.
      *   *Status:* This is settled mathematics. It is a theorem that Turing-computable functions $\equiv$ $\lambda$-definable functions $\equiv$ General Recursive functions.
  *   **The Church-Turing Thesis (Conjecture):** The thesis claims that this specific class of functions captures **the intuitive notion of "effective calculability"** (i.e., what a human can compute following a definite method with pencil and paper).
      *   *Status:* This is **not** a theorem.

  **Why can't it be proven?**
  In mathematics, to prove a theorem, all terms must be rigorously defined. "Turing Machine" is rigorously defined. However, "effective calculability" or "intuitive algorithm" is **not** a mathematical definition; it is a pre-theoretic, philosophical concept.

  You cannot mathematically prove that a formal definition matches an informal intuition. You can only provide evidence. The fact that five different brilliant logicians came up with five different formalisms that all turned out to be equivalent is strong *evidence* that they found the "natural" limit of computation, but it is not a *proof* that no other method exists.

  **Analogy:** Imagine trying to define "Chair."
  1.  You create a formal definition: "An object with four legs and a backrest."
  2.  Someone else defines it: "A surface raised 0.5 meters for sitting."
  3.  You prove mathematically that any object fitting definition 1 fits definition 2.
  4.  **The Thesis:** "Any object a human considers a 'Chair' fits definition 1."
  This last step cannot be proven mathematically, because "what a human considers a chair" is not a formal set. A beanbag chair might falsify the thesis. Similarly, a hypothetical physical process might falsify CTT.

  ### 2. The "Physical" Church-Turing Thesis

  Your query mentions: *"no physical process, however exotic, could ever compute a function outside this class."*

  This is actually a stronger claim than the original Church-Turing Thesis. Scholars often distinguish between two versions:

  1.  **The Original CTT (Logical/Human):** Concerns what is effectively calculable by a human following rules. This is about logic and epistemology.
  2.  **The Physical CTT:** Concerns what is computable by any physical system allowed by the laws of physics.

  The **Physical CTT** is definitely an **empirical question**, not a mathematical one. It depends on the nature of our universe.
  *   **Quantum Computing:** A common misconception is that quantum computers violate CTT. They do not. They compute the same *class* of functions (Turing-computable), but they may do so with different *efficiency* (complexity classes like BQP vs P).
  *   **Hypercomputation:** Some physicists and logicians have proposed hypothetical physical models (e.g., using Malament-Hogarth spacetimes near black holes, or infinite precision analog systems) that could theoretically solve the Halting Problem. If our universe's laws permit such structures, the Physical CTT is false. Since we do not know the ultimate laws of physics with absolute certainty, the Physical CTT remains an open empirical hypothesis.

  ### 3. Why Sources Describe it as "Unsettled"

  When philosophers (like B. Jack Copeland or Oran Shagrir) or logicians describe the thesis as unsettled, they are usually pointing to one of three issues:

  1.  **The Definition Problem:** As mentioned, you cannot prove a relation between a formal and an informal concept.
  2.  **Counter-Examples:** Are there "algorithms" that don't fit the Turing model? Some argue that interactive systems, neural networks, or biological processes involve forms of information processing that are not well-modeled by a standard Turing Machine (though this is debated).
  3.  **Physical Realizability:** As noted above, if physics allows "supertasks" (performing infinite steps in finite time), the Physical CTT fails.

  ### 4. Advice for your IB Extended Essay

  This is a fantastic topic for an EE, but you must be precise with your terminology to score well in Criterion A (Focus and Method) and Criterion B (Knowledge and Understanding).

  **Do not write:**
  *   "The Church-Turing Thesis was proven by Turing." (False)
  *   "Because Lambda Calculus equals Turing Machines, CTT is a fact." (Logical error)

  **Do write:**
  *   "While the equivalence of formal systems is a mathematical theorem, the Church-Turing Thesis remains a hypothesis linking these systems to physical reality."
  *   "The robustness of the equivalence provides inductive support for the thesis, but does not constitute a formal proof."

  **Potential Research Question Angles:**
  Instead of asking "Is CTT true?", which is too broad, consider:
  *   *"To what extent does the advent of quantum computing challenge the Physical Church-Turing Thesis?"* (Focus on the distinction between computability and complexity).
  *   *"An analysis of the philosophical status of the Church-Turing Thesis: Is it a definition, an empirical hypothesis, or a mathematical theorem?"* (This directly addresses your current confusion).
  *   *"Evaluating the arguments for and against Hypercomputation in the context of the Physical Church-Turing Thesis."*

  ### Summary
  The equivalence of Turing Machines, Lambda Calculus, and Recursive Functions is a **mathematical theorem**.
  The claim that these formalisms capture **all possible algorithms** or **all physical computation** is the **Church-Turing Thesis**, and it is **not a theorem**. It is a bridge between math and reality, and bridges cannot be built out of math alone.

  Your sources are correct: it remains an open philosophical and empirical question. Recognizing this distinction will be the key strength of your essay.
