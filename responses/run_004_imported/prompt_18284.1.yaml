answer: |-
  You have asked for an honest assessment rather than a balanced tour, so I will give you one directly: **Your friend is reasoning badly.**

  The error is not that he is skeptical—skepticism is the engine of science. The error is not that he demands high standards of evidence. The error is structural and epistemological. He has constructed a **locally unfalsifiable system** by applying inconsistent epistemic standards to different parts of the same web of belief.

  You are right to feel that evidence cannot reach him, but not because the truth is inaccessible. It is because he has immunized his position against evidence by shifting the burden of proof in a way that violates the principles of rational coherence.

  Here is the precise philosophical anatomy of the error.

  ### 1. Wittgenstein's "Hinge Propositions"
  The most precise tool for analyzing your friend's position comes from Ludwig Wittgenstein's final notes, *On Certainty*. Wittgenstein argued that doubt requires certainty. To doubt any specific proposition (e.g., "Did this instrument record accurately?"), you must hold other propositions fast as "hinges" on which the doubt turns (e.g., "Optics generally work," "My colleagues are not all liars," "The world existed yesterday").

  Your friend's error is **inconsistent hinge selection**.
  *   To build his case, he treats "NASA and global institutions are capable of a perfect, multi-generational lie" as a *hinge proposition*. It is the immovable foundation upon which he interprets data.
  *   Simultaneously, he treats "My computer functions correctly," "My memory is reliable," and "Standard physics applies" as *hinge propositions*.

  This creates a fractured epistemology. If he truly applied the skepticism he uses for the Apollo telemetry to his own computer or memory, he could not build any case at all. If he applied the trust he uses for his computer to the observatories you worked at, the conspiracy would collapse. He is selectively freezing certain beliefs to protect a specific conclusion while allowing others to remain fluid. This is not skepticism; it is **dogmatism masquerading as skepticism**.

  ### 2. The Bayesian Error: Prior Probabilities
  In Bayesian terms, your friend has manipulated his **priors**.
  When evaluating a claim, a rational agent weighs the *prior probability* of the claim against the *likelihood* of the evidence.
  *   **The Claim:** A conspiracy involving hundreds of thousands of people across multiple adversarial nations remained secret for 50 years.
  *   **The Alternative:** Humans landed on the moon using technology we know existed.

  The prior probability of the conspiracy is vanishingly small compared to the alternative. However, your friend has artificially set the prior probability of "Official Narrative is True" to near zero *only in this specific domain*. Consequently, no amount of evidence (likelihood) can overcome that prior.

  The reasoning error here is **Special Pleading**. He has no principled reason to assign a near-zero prior to NASA's honesty while assigning a high prior to the honesty of the manufacturer of his graphics card or the authors of the physics textbooks he relies on. He is applying a "conspiracy prior" to one sector of reality and a "realist prior" to the rest, without a meta-justification for why the boundary lies where it does.

  ### 3. Ad Hoc Rescue and the Duhem-Quine Thesis
  You noted that for every piece of evidence, he has a "technically fluent reason to distrust the instrument." In philosophy of science, this is known as an **ad hoc rescue**.
  The Duhem-Quine thesis states that you cannot test a hypothesis in isolation; you test it alongside auxiliary assumptions (e.g., "the telescope is calibrated"). If the test fails, you can blame the hypothesis *or* the auxiliary assumption.

  Science progresses by minimizing *ad hoc* adjustments. If saving a theory requires constantly inventing new, complex, unverified auxiliary assumptions (e.g., "the retroreflectors were placed by a secret robotic mission," "the Soviet observatories were bribed"), the theory becomes less rational, not more.

  Your friend is violating **Occam's Razor** systematically. He is choosing the explanation that requires the greatest number of unproven auxiliary assumptions (the conspiracy mechanisms) over the explanation that requires the fewest (the landings happened). He is technically fluent, but he is using that fluency to increase the complexity of his model to protect it from falsification.

  ### 4. Why Your Confidence is Grounded
  You asked what grounds your own confidence if evidence cannot reach him. Your confidence is grounded in **coherence**, not just data.

  Your view of the world is a coherent web. The Apollo landings fit with:
  *   The history of the Cold War (competition).
  *   The physics of rocketry (which he trusts elsewhere).
  *   The sociology of science (leaks happen, secrets don't hold).
  *   The geological data (lunar samples match meteorites, distinct from Earth).

  His view requires a **fragmented web**. He must sever the connection between "physics works" and "rocketry works." He must sever the connection between "governments can't keep secrets" (generally true) and "this government kept this secret" (specifically true).

  You are right because your map of reality is continuous. His map has a walled garden where the laws of probability, sociology, and human nature are suspended.

  ### Conclusion
  The disagreement is not pitched at a level where evidence cannot reach. It is pitched at the level of **epistemic policy**.

  Your friend has adopted a policy that says: *"In this specific instance, the cost of believing a lie is lower than the cost of trusting an institution."* He is entitled to that value judgment, but he is not entitled to claim it is a result of scientific skepticism. It is an act of faith.

  He is reasoning badly because he is using the tools of science (doubt, technical analysis, demand for proof) to defend a conclusion that is immune to those tools. He is playing chess but refusing to allow his opponent to capture his King.

  You do not need more evidence. You have identified the structural flaw: **Local skepticism that relies on global trust is parasitic.** It eats the host it claims to examine. He trusts the logic he uses to doubt the moon landing. If he applied that same logic to the logic itself, he would have no argument. He stops the regress of doubt exactly where it needs to continue to protect his belief, and he continues the regress exactly where it needs to stop to protect his worldview.

  That is not science. It is a fortress.
