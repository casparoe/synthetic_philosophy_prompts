answer: |-
  Thank you. Please, be seated.

  Standing here, behind this wood, I am aware of the weight of it. Not just the weight of the moment, but the weight of the arguments. My father and I spent a lifetime debating what could be said from this pulpit, and what belonged in the square outside it. 

  To his parishioners, I know I am often the daughter who left. The one who took the language of this house and translated it into the dry grammar of the university. My father believed that my life's work was a polite request for silence. He thought that when I wrote about public reason, I was telling believers that their deepest truths were too dangerous for the public ear. He felt I was asking him to leave a part of himself at the door of the voting booth, and by extension, at the door of history.

  For a long time, I defended myself in footnotes. I argued that I was not silencing anyone. I was only mapping where the strict duties of citizenship ended and the life of civil society began. But standing here, looking at the face of a man who spent forty years offering you comfort I cannot theologically verify, I realize that I missed the point of his objection. He didn't want a map. He wanted a home.

  And this—this room, this congregation, this week of grief—is not the public political forum. It is not the Supreme Court. It is not the legislature. It is the background culture of civil society, the place where comprehensive doctrines are not just permitted, but are the very mortar of the walls. 

  My colleagues are here, and they are listening to see if I will betray my own principles. My father's family is here, listening to see if I will betray him. 

  The truth is, my philosophy was never intended to strip this room of its voice. It was intended to protect it. By distinguishing the rules of the state from the life of the community, I hoped to ensure that a parish like this could flourish without imposing its creed on those who do not share it. I wanted a world where my father's faith was free to be absolute *here*, so that it did not need to be coercive *out there*. 

  I see now that in trying to protect the boundary, I made him feel I was policing the heart. For that, I am sorry.

  I cannot stand here and tell you that he is with God. I do not know that, and he would have been the first to tell me that honesty is a prerequisite for love. But I can tell you what I know. I know that for forty years, he treated this community as a sacred trust. I know that when he visited you in the hospital, or baptized your children, or sat with you in the quiet after a loss, he was building what the philosopher John Rawls once called a "well-ordered society" on a human scale. Not a society of perfect agreement, but a community bound by mutual respect and a shared commitment to the good.

  My father believed that sin was real, but that grace was more real. I do not share his metaphysics, but I have witnessed his grace. I have seen it in the way you have gathered here. I have seen it in the way he made space for the doubter and the believer alike, provided they came in peace. 

  There is a passage from his senior year at seminary that he kept in his study. It suggests that the church is not a museum for saints, but a hospital for sinners. I am not a member of this church. But I am a sinner, in my own way. I am a daughter who loved her father but struggled to speak his language. And today, I am a mourner who needs the comfort this community provides.

  So, I will not use his theology to comfort you. I will use his legacy. 

  He is not in a better place, because the place he loved was here. He is not looking down, because he was always looking us in the eye. He remains in the arguments we had, in the sermons you remember, and in the standard of care he set for all of us. He believed that we owe one another reasons we can share. But he also knew that before we owe one another reasons, we owe one another presence.

  He is present to us now, in the memory of his work. And I am present to him, finally, without the shield of theory. 

  Rest well, Dad. The argument is over. You were right about this room.

  Amen.
