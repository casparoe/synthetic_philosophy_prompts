answer: |-
  **The Humphrey Problem: Identity Across the Multiverse**

  You are writing about the multiverse. In the physics literature, this often implies a concrete plurality of worlds: bubble universes in eternal inflation, branching wavefunctions in Many-Worlds Quantum Mechanics, or branes in string theory. In these models, other worlds are not merely descriptions of how things could be; they are physical places, causally isolated but ontologically robust.

  When you reach for the phrase "possible worlds" to explain these concepts to your readers, you will be tempted to say things like, "In another universe, you made a different choice." This phrasing assumes **Transworld Identity**: the idea that *you*—numerically, literally the same person—exist in that other branch. However, if you lean on that analogy, you are siding with Saul Kripke against David Lewis in one of the sharpest disputes in twentieth-century metaphysics.

  To write with precision, you must understand the cost of that choice. The dispute is not merely semantic; it concerns the logical coherence of objects having properties. If the physics multiverse is concrete (as Lewis argued it must be for "possibility" to be real), then Transworld Identity collapses under the weight of contradiction. David Lewis's rival, **Counterpart Theory**, saves the metaphysics but sacrifices the intuition. Here is the case for why, despite Kripke's powerful objections, Lewis's view is the one that actually fits the physics you are describing.

  ### The Intuition of Transworld Identity

  The standard view, championed by Saul Kripke in *Naming and Necessity*, is that when we speak of possibility, we are talking about *this* individual having different properties. When we say, "Hubert Humphrey could have won the 1968 election," we mean that Humphrey himself—the very flesh and blood born to Hubert and Grace Humphrey—exists in a state of affairs where he secured more votes than Nixon.

  For Kripke, possible worlds are not distant planets we could travel to; they are stipulated conditions, abstract states of affairs. Because they are abstract, there is no spatial barrier preventing Humphrey from being "in" them. Kripke argues that Counterpart Theory "changes the subject." If Lewis is right, then Humphrey is world-bound. He exists only here. In the world where the election goes differently, there is merely a *counterpart*—a person very similar to Humphrey—who wins.

  Kripke finds this cold comfort. He famously noted that Humphrey does not care that a counterpart wins; he cares whether *he* could have won. For ordinary language and our sense of self, Transworld Identity (TWI) is king. It preserves the *de re* nature of modal claims: the possibility belongs to the object itself.

  ### The Problem of Accidental Intrinsics

  David Lewis, however, was not interested in ordinary language; he was interested in ontology. Lewis was a Modal Realist: he believed possible worlds were concrete, spatiotemporally isolated entities, just as real as our own. If you are writing about a physical multiverse, you are effectively working within Lewis's ontology, not Kripke's. And in a concrete multiverse, TWI faces a devastating objection: **The Problem of Accidental Intrinsics.**

  Consider Humphrey's hands. In the actual world, Humphrey has five fingers on his left hand. This is an *intrinsic* property; it depends only on Humphrey, not on his relation to anything else. Now consider a possible world where Humphrey loses a finger in an accident. In that world, he has four fingers.

  If TWI is true and worlds are concrete, then Humphrey is literally present in both worlds. This means one and the same object has five fingers and four fingers. This is a contradiction.

  Defenders of TWI try to solve this by "indexing" properties. They say Humphrey doesn't simply "have five fingers"; he "has-five-fingers-at-World-A" and "has-four-fingers-at-World-B." Lewis pounces on this move. He argues that this turns intrinsic properties into relations. Having five fingers is a matter of bone structure, not a relation to a "world" label. If you relativize all properties to worlds, you lose the idea that objects have shapes, masses, or textures in themselves. They only have those things relative to a coordinate system.

  For Lewis, this is too high a price. To save the integrity of intrinsic properties, he insists individuals are world-bound. Humphrey is here. The winner in the other world is a distinct individual who resembles Humphrey closely. This is Counterpart Theory. It avoids the contradiction because no single object ever holds incompatible properties.

  ### Chisholm's Paradox: The Test of Vagueness

  If the debate ended there, it might be a stalemate between linguistic intuition (Kripke) and metaphysical consistency (Lewis). But Roderick Chisholm introduced a paradox that strains both views, yet ultimately breaks Transworld Identity more severely.

  Chisholm asks us to imagine a chain of possible worlds. In World 1, Humphrey is himself, and Nixon is himself. In World 2, Humphrey is slightly more like Nixon (perhaps a different career path), and Nixon is slightly more like Humphrey. In World 3, the shift continues. By World 100, the person originating from Humphrey's sperm and egg has lived Nixon's life, and vice versa.

  The question is: At which point does the individual cease to be Humphrey and become Nixon?

  For the Transworld Identity theorist, this is a crisis. Identity is transitive and absolute. If $A = B$ and $B = C$, then $A = C$. But if we accept that Humphrey in World 1 is identical to Humphrey-in-World-2, and so on, transitivity forces us to say Humphrey in World 1 is identical to the person living Nixon's life in World 100. This violates our intuition that origin matters (a Kripkean staple). If we deny the identity at some link in the chain, we must admit that identity is vague—that there is no fact of the matter about whether a person is themselves. Most philosophers find "vague identity" logically incoherent.

  Counterpart Theory handles this with more grace. Lewis admits that the counterpart relation is based on similarity, and similarity is vague. There is no sharp line where a counterpart ceases to be a counterpart. In World 50, it might be indeterminate whether the individual is Humphrey's counterpart or Nixon's. This is not a logical failure for Lewis, because counterpart relations are not identity. They do not need to be transitive. A can be a counterpart of B, and B of C, without A being a counterpart of C.

  Chisholm's Paradox shows that if you want to talk about gradual changes across worlds, you need a relation that tolerates vagueness. Identity does not tolerate vagueness; similarity does. Therefore, Counterpart Theory is logically better equipped to handle the gradations of possibility.

  ### The Verdict: Physics Demands Counterparts

  So, where does this leave you, the science writer? You might be tempted to split the difference: use Transworld Identity for the "human interest" angle (because readers care about *themselves*) and Counterpart Theory for the "hard physics" (to be accurate).

  I argue you should do the opposite. You should adopt the Lewisian verdict, but explain the cost.

  If the multiverse you are describing is a *physical* one—composed of concrete spacetime manifolds, quantum branches, or branes—then Kripke's Transworld Identity is metaphysically impossible. You cannot be literally present in two causally isolated spacetime manifolds any more than you can be in New York and London at the same time without being in two places. If you insist on TWI in a physical multiverse, you are forced to treat physical properties (mass, location, quantum state) as relations to a "universe index," which undermines the realism of the physics you are reporting.

  Furthermore, Chisholm's Paradox suggests that in a vast multiverse where parameters vary continuously, strict identity will break down. There will be branches where "you" are so altered that claiming it is *you* is a category error. Counterpart Theory acknowledges this: there are versions of you, some closer, some farther.

  **The Verdict:** Counterpart Theory is the correct metaphysical account for a concrete multiverse. Transworld Identity is a useful semantic fiction for abstract modal logic and folk psychology.

  However, you must heed Kripke's warning. When you tell your readers, "In another branch of the wavefunction, you are a pianist," you are speaking loosely. Strictly speaking, a counterpart of the reader is a pianist. The reader in *this* branch remains here.

  Does this matter for a magazine piece? Yes. It changes the emotional stakes. Transworld Identity offers a kind of immortality: *I* live on in other branches. Counterpart Theory offers only legacy: *someone like me* lives on.

  For the sake of intellectual honesty, your article should make this distinction clear. The physics of the multiverse aligns with Lewis, not Kripke. The "possible worlds" of physics are not mirrors reflecting the same soul with different hats; they are distinct arenas populated by distinct individuals who share a common origin. To borrow the phrase "possible worlds" without acknowledging the Counterpart constraint is to smuggle in a mystical notion of identity that the physics does not support.

  Write the piece. Use the analogy. But tell your readers the truth: In the multiverse, Hubert Humphrey never won. A man who was almost him did. And that is a stranger, and perhaps more wonderful, thing.
