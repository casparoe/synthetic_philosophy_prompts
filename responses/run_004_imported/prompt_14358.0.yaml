answer: |-
  This is one of the sharpest cuts in the philosophy of probability, and it is entirely understandable that the mechanics of Lewis's fix feel like sleight of hand until the underlying conceptual shift clicks. You have correctly identified the tension: if the chance distribution supervenes on the total history, then the chance distribution entails constraints on the future that the distribution itself says are contingent.

  Let's walk through this as a single narrative arc, moving from the trap Lewis set for himself to the escape route he built, and then assess the cost of that escape.

  ### Part 1: The Trap (Undermining as Modal Collapse)

  To see why the New Principle (NP) works, we must be precise about why the original Principal Principle (PP) fails in a Humean world.

  In the original PP, the equation is:
  $$ C(A \mid Ch(A) = x \land E) = x $$
  where $E$ is "admissible" evidence (roughly, history up to $t$).

  In a Humean Best System Analysis (BSA), the "true theory of chance" $T$ is the system that best balances simplicity and strength over the **entire** mosaic of events (past, present, and future). This creates a modal dependency: the truth of $T$ depends on the future.

  Now, consider an "undermining future" $F$.
  1.  According to theory $T$, the future $F$ has positive chance: $Ch_T(F) = x > 0$.
  2.  However, if $F$ were to occur, the total history would be different.
  3.  Given that different total history, $T$ would no longer be the Best System. Some other theory $T^*$ would be better.
  4.  Therefore, $F$ entails $\neg T$. (If $F$ happens, $T$ is false).

  Here is the contradiction in the original PP. Let our evidence $E$ be simply $T$ (the proposition that $T$ is the true theory of chance).
  *   **LHS (Credence):** $C(F \mid T)$. Since $F$ entails $\neg T$, the proposition $F \land T$ is impossible. Therefore, rational credence $C(F \mid T)$ must be **0**.
  *   **RHS (Chance):** The PP says this credence should equal the chance of $F$ given $T$. According to $T$'s own probability function, $Ch_T(F) = x$, where **$x > 0$**.

  The PP demands your credence be $x$, but logic demands your credence be 0. The principle explodes. The problem is that in Humeanism, the proposition "The chance is $x$" is **not admissible** in the way Lewis originally hoped, because it carries hidden information about the future (specifically, that the future is *not* one of the undermining ones).

  ### Part 2: The Escape (The New Principle)

  Lewis's realization in "Humean Supervenience Debugged" was that we cannot treat the chance value $x$ as a standalone piece of evidence. We must treat the **theory of chance** $T$ as the evidence, and we must recognize that the chance function itself needs to be updated by the evidence that $T$ is true.

  The New Principle (NP) shifts the conditionalization. It says:
  $$ C(A \mid H_t \land T) = Ch_T(A \mid T) $$
  *(Note: I am simplifying the notation slightly for clarity; formally it is the chance of A given the theory T is true, according to the chance function defined by T.)*

  Here is the intuition for why this defuses the bomb rather than moving it:

  **1. Distinguishing the Map from the Territory**
  In the original PP, Lewis treated the chance value $x$ as if it were a property of the world at $t$ that stood independent of the future. The NP acknowledges that in Humeanism, $T$ is a hypothesis about the whole world. When you conditionalize on $T$, you are restricting your attention to the set of possible worlds where $T$ is the Best System.

  **2. The "Self-Undermining" Probability is Zero**
  Recall the undermining future $F$. $T$ assigns it unconditional probability $x$. But what is the probability of $F$ *given that $T$ is true*?
  Since $F$ entails $\neg T$, the intersection of the set of $F$-worlds and the set of $T$-worlds is empty.
  Therefore, within the probability space defined by $T$:
  $$ Ch_T(F \mid T) = 0 $$
  The NP tells you to match your credence to *this* number.
  *   **LHS:** $C(F \mid T) = 0$ (by logic).
  *   **RHS:** $Ch_T(F \mid T) = 0$ (by the NP calculation).

  **The contradiction vanishes.** The NP effectively tells the agent: "You know that $T$ is the theory of chance. You also know that if $F$ happens, $T$ ceases to be the theory of chance. Therefore, conditional on $T$ being the theory, $F$ cannot happen. Your credence should be 0, and look, the chance function (updated on its own truth) also says 0."

  **3. Why this feels like displacement (and why it isn't)**
  Your worry is that we have just moved the problem up a level. "Why does conditionalizing on $T$ fix it?"
  The fix works because the original PP assumed that $Ch(A)$ was **independent** of the truth of the chance theory. It assumed $Ch(A)$ was a rigid designator. The NP admits that in Humean worlds, chance is **indexical to the theory**. The "chance of $A$" is not a single number floating in the ether; it is a number generated by a system $T$, and that number changes if you condition on $T$'s survival.

  The intuition is that the original PP treated chance as an **oracle**. You ask the oracle "What are the odds?" and you believe it. The NP realizes that in Humeanism, the oracle is made of glass. If the outcome is too wild, it breaks the oracle. The NP says: "Don't just believe the number the oracle prints out. Calculate the odds of the outcome *assuming the oracle doesn't break*."

  ### Part 3: The Verdict — Dissolution or Displacement?

  You asked for a verdict. Here is the uncomfortable truth: **It is a genuine logical dissolution, but a philosophical displacement.**

  **1. The Logical Success**
  Technically, Lewis saved Humean Supervenience. The contradiction is gone. A rational agent operating under the NP will not violate the laws of probability when dealing with undermining futures. If your goal is to maintain Humeanism without logical inconsistency, the NP succeeds.

  **2. The Philosophical Cost**
  However, many critics (including Ned Hall himself, eventually) argue that the NP saves the letter of the principle while killing its spirit.
  *   **Epistemic Access:** The original PP was powerful because it linked credence to *unconditional* chance. We can often estimate $Ch(A)$ (e.g., a coin's bias). But $Ch(A \mid T)$? To know this, I need to know the true theory of chance $T$, and I need to know how $T$ probabilities distribute over the truth of $T$ itself. This is epistemically opaque. It makes the guide to credence something we can rarely, if ever, calculate.
  *   **The Concept of Chance:** The PP was meant to capture what we *mean* by chance. If "chance" only guides credence when conditionalized on the theory of chance being true, have we changed the subject? We have moved from "Chance guides belief" to "The theory of chance guides belief about the theory of chance."
  *   **Displacing Admissibility:** You asked if it displaces the admissibility worry. In a way, yes. The original worry was that "Chance = $x$" is inadmissible. Lewis's response is essentially: "Okay, you're right. So let's only conditionalize on $T$ and $H_t$." But $T$ is only admissible because we define the chance function *relative* to it. The "admissibility" is now baked into the definition of the chance function on the RHS, rather than being a constraint on the evidence on the LHS.

  **3. A Physicist's Perspective**
  Since you work in Stat Mech, consider this analogy.
  *   **Original PP:** Like assuming the microcanonical distribution is valid regardless of the trajectory.
  *   **Undermining:** Realizing that certain trajectories (fluctuations) would change the macroscopic constraints that defined the ensemble in the first place.
  *   **New Principle:** Saying, "We must update the ensemble measure conditional on the macroscopic constraints holding."

  In physics, we usually handle this by saying the "laws" (Hamiltonian) are fixed and don't supervene on the trajectory. Lewis is forced to make the "laws" supervene on the trajectory. The NP is the mathematical patch required to make that supervenience coherent.

  **Conclusion**
  Does the NP amount to a genuine dissolution? **Yes**, it dissolves the logical contradiction that threatened to refute Humeanism.
  Does it merely displace the worry? **Also Yes**, it displaces the worry from "Humeanism is inconsistent" to "Humean chance is epistemically inaccessible and theoretically circular."

  Lewis decided this was a fair trade. He preferred a consistent Humeanism with a weakened link between chance and credence over an inconsistent Humeanism or a non-Humean metaphysics. Whether you accept that trade depends on how much weight you place on the *guiding role* of chance. If you view chance primarily as a feature of the Best System (metaphysics first), the NP is a victory. If you view chance primarily as a guide for agents (epistemology first), the NP feels like a retreat.

  Given your work in foundations, you likely appreciate that the "Best System" is a powerful tool for grounding probabilities without modal primitives. The NP is the price of that ticket. It's not a cheat, but it is a bill that comes due.
