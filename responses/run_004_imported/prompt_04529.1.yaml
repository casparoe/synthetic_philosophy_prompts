answer: |-
  Two hyper-rational quantitative traders, Alice and Bob, are having lunch. They are known to be perfect Bayesian updaters with common priors.

  Alice slides a napkin across the table. "I'll bet you $50,000 that TechCo stock closes up tomorrow."

  Bob doesn't even look at the napkin. "No."

  "You didn't even check the odds," Alice says.

  "I don't need to," Bob replies. "You're rational. I'm rational. We have common priors. If you're offering this bet, it's because your private information set makes the expected value positive for you. Since I know you're rational, your willingness to trade *is* private information. I just updated my posterior based on your offer. The divergence in our beliefs that made the bet possible for you has just been arbitraged away by my inference. There is no trade."

  Alice smiles. "Clever. But I knew you'd reason that out. So I only offered the bet if my signal was strong enough to remain profitable *even after* you updated on my offer."

  Bob nods. "And I know you know that. So I need to update *again* to account for your strategic filtering of offers. I now believe the probability is even higher."

  "And I anticipated that second update."

  "And I anticipated that anticipation."

  "We're iterating to common knowledge," Alice says.

  "Yes. At the limit, our posteriors are identical."

  "So the bet is off."

  "Agreed."

  Alice pauses. "Okay, new bet. $50,000 that you're going to say 'Agreed'."

  Bob freezes. "If I say 'Agreed', I take the bet. If I take the bet, I'm betting against my own rational conclusion that no bet should exist. That makes me irrational. If I'm irrational, you're irrational for betting me. If we're both irrational, the No-Trade Theorem doesn't apply, so we should bet. But if we should bet, we're rational again..."

  "Bob?"

  "..."

  "Bob?"

  "I'm stuck in a loop."

  "Do you want to bet on whether you snap out of it?"

  "..."

  "I'll take that as a no."

  Bob's eyes widen. "Wait. If you take my silence as a 'no', you're updating on non-verbal information. That's a trade signal."

  Alice puts her head in her hands. "Damn it."
