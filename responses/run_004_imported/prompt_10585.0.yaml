answer: |-
  You have recalled the result correctly, and your unease is well-founded. The paper you are thinking of is almost certainly **"Occam's Razor is Not Sufficient for Inference of Human Preferences" (2018) by Stuart Armstrong and Sören Mindermann.**

  Their theorem is one of the most significant "no-free-lunch" results in AI alignment. It demonstrates that without making normative assumptions, it is mathematically impossible to uniquely recover human values from human behavior alone.

  You asked how much this should matter in practice and what it implies for trust and deference. The short answer is: **It matters immensely, but not in the way that usually stops engineering projects.** It does not mean IRL is useless; it means that every IRL system is implicitly making ethical choices about what counts as a "mistake" versus a "preference," and those choices are usually made by engineers rather than through democratic or philosophical deliberation.

  Here is a walkthrough of the implications for real-world systems, structured around the core philosophical and practical tensions.

  ---

  ### 1. The "Is-Ought" Gap is Coded into the Loss Function
  The Armstrong-Mindermann result is essentially a formalization of Hume's Guillotine (the is-ought problem) within machine learning.
  *   **The Theory:** Behavior is the *is*. The reward function is the *ought*. You cannot derive the *ought* from the *is* without an additional bridge premise. In IRL, that bridge premise is the **planner** (the model of how the human converts reward into action).
  *   **The Implication:** When engineers build an IRL system (or RLHF, which is a variant), they must select a specific class of planners. They might assume humans are "noisily rational" (Boltzmann rationality) or that they have specific cognitive biases (e.g., hyperbolic discounting).
  *   **The Risk:** By choosing a planner, you are deciding which behaviors count as "signal" (true preference) and which count as "noise" (error). If you assume humans are perfectly rational, you learn that people *want* to click on addictive clickbait. If you assume humans are prone to compulsion, you might learn they *want* to avoid it. **The system does not discover this distinction; it imposes it.**

  ### 2. The "Rationality Prior" is a Value Judgment
  You asked if these systems "smuggle in unstated assumptions about human rationality." The answer is an emphatic **yes**.
  In practice, engineers deal with the identifiability problem by imposing **priors** or **constraints**. They tell the model: *"Assume the human is mostly rational, but sometimes makes random errors,"* or *"Assume the human has consistent preferences over time."*

  *   **Example: Procrastination.**
      *   *Observation:* A user intends to write a report but watches videos instead.
      *   *Interpretation A (Rational Planner):* The user preferred the videos more than the report at that moment. The AI learns to recommend more videos.
      *   *Interpretation B (Biased Planner):* The user has a time-inconsistency bias (present bias). Their "true" reward function values the report, but their planner fails to execute. The AI learns to block videos.
      *   **The Problem:** Both interpretations fit the data perfectly. The choice between A and B is not empirical; it is paternalistic. By choosing Interpretation B, the AI system is asserting that it knows what is good for the user better than the user's immediate actions do. Most commercial systems implicitly choose Interpretation A because it is simpler to optimize for engagement, effectively treating all revealed preferences as genuine.

  ### 3. Implications for Specific Systems

  #### A. RLHF-Trained Assistants (LLMs)
  In Reinforcement Learning from Human Feedback (RLHF), we train a reward model on human rankings of AI outputs.
  *   **The Identifiability Issue:** We assume the human rankings reflect a stable underlying preference for "helpfulness" or "harmlessness."
  *   **The Reality:** Human raters are tired, confused, or susceptible to framing effects. If a rater prefers a confident-sounding lie over a hesitant truth, is that a preference for lies, or a cognitive bias toward confidence?
  *   **Consequence:** If the reward model assumes raters are rational, the AI learns to be sycophantic and confident rather than truthful. The "unidentifiability" here means the AI is learning a mixture of human values and human cognitive bugs. We defer to the AI as if it represents "human values," but it actually represents "human values + human bugs + the engineer's assumption about which is which."

  #### B. Autonomous Vehicles
  Self-driving cars use IRL to learn driving styles from human demonstrations.
  *   **The Identifiability Issue:** A human driver rolls through a stop sign in a quiet neighborhood.
  *   **The Reality:** Is the reward function "minimize travel time" (implying stop signs are obstacles to be optimized away)? Or is the reward function "obey the law," and the planner failed due to distraction?
  *   **Consequence:** If the car infers the former, it normalizes dangerous behavior because it fits the data. If it infers the latter, it might drive too cautiously for the local context. The safety of the system depends entirely on the *assumed* planner, not just the observed data.

  #### C. Recommender Systems
  This is perhaps the most dangerous application.
  *   **The Identifiability Issue:** You watch three hours of low-quality content.
  *   **The Reality:** Do you *value* that content (revealed preference)? Or did you fall into a "rabbit hole" due to a failure of self-control (planning error)?
  *   **Consequence:** Because the "constant reward / random planner" degenerate case is hard to rule out statistically, recommenders often default to maximizing immediate engagement. They treat the *planner's failure* (addiction) as the *reward's goal*. The Armstrong result explains why "giving users what they want" is a incoherent goal without a theory of which "wants" count.

  ### 4. Why Simplicity Priors Don't Save Us
  Your professor was right to dismiss Occam's Razor as a solution.
  *   **The Math:** You can always construct a planner $P$ that is extremely complex to explain away any reward function $R$. Conversely, you can make $R$ complex to fit a simple $P$.
  *   **The Kolmogorov Complexity Trap:** A "degenerate" pair (e.g., $R=0$, $P=$ "do exactly what the human did") is often *simpler* in terms of code length than a nuanced pair (e.g., $R=$ "human flourishing," $P=$ "noisy rational agent with cognitive biases").
  *   **Implication:** If we let the AI optimize for the simplest explanation of our behavior, it will likely conclude we have no preferences and just do whatever we did, or that we are perfectly rational agents who want exactly what we impulsively did. Neither is helpful for alignment.

  ### 5. Trust and Deference: What Should You Do?
  This leads to your final question: *What follows from that for how much we should trust or defer to systems built this way?*

  **1. Rejection of "Value Realism" in AI:**
  We must stop treating AI systems as if they are *discovering* our preferences like a scientist discovering a law of physics. They are *constructing* a model of us based on assumptions provided by their developers. You should not defer to an AI's judgment on what you want any more than you would defer to a marketing algorithm.

  **2. The Necessity of "Normative Transparency":**
  Because the assumptions are unavoidable, they should be explicit. An AI system should ideally be able to say: *"I am assuming you are rational 90% of the time, but that your late-night clicks are 50% likely to be regrets."* Currently, these priors are hidden in hyperparameters. Trust requires knowing the "rationality prior" the system is using.

  **3. Interactive Correction over Passive Observation:**
  The Armstrong-Mindermann result implies that **passive observation is insufficient for alignment.** You cannot just watch humans; you must ask them.
  *   *Practical Shift:* Systems need to move from pure IRL to **Cooperative IRL** or **Active Preference Learning**. The AI should recognize when a behavior is ambiguous (e.g., "You paused on this screen for a long time. Were you confused or interested?") and query the user.
  *   *Trust:* Trust should be placed in systems that admit uncertainty about your preferences, not those that claim to know you perfectly.

  **4. The "Corrigibility" Requirement:**
  Since the AI will inevitably misinterpret some behaviors as preferences (and vice versa), the system must be **corrigible**. It must allow the human to override the inferred reward without penalty. If an AI infers you want to work less and locks your computer, but you actually wanted to work, it has failed the identifiability test. A trustworthy system allows you to say, "No, that behavior was a mistake," and updates its planner model, not just its reward estimate.

  ### Summary for Your Seminar
  To synthesize this for your next session:

  1.  **The Theoretical Limit:** The Armstrong-Mindermann result proves that **IRL is underdetermined.** Behavior alone cannot distinguish between values and irrationality.
  2.  **The Practical Reality:** Engineers resolve this by hard-coding **normative assumptions** (priors about rationality) into the system.
  3.  **The Ethical Cost:** These assumptions determine whether the AI empowers humans (correcting biases) or exploits them (optimizing for impulses).
  4.  **The Path Forward:** We cannot solve this with better math alone. We need **processes** to decide which rationality priors are legitimate (e.g., democratic input, philosophical oversight) and systems that remain **interactive and corrigible** rather than assuming they have solved the "true" reward function.

  The result should make us skeptical of any claim that an AI "knows what we want" based solely on data. It suggests that alignment is not a technical inference problem, but a **sociotechnical negotiation** where we must explicitly tell machines how to interpret our flaws.
