      *Revised Plan:*
      1. Kant Verdict.
      2. Kant Granularity (Follow-up).
      3. Arpaly Distinction.
      4. Arpaly/Huck Conceptualism (Follow-up).
      5. Fair-Weather Helper.
      6. Fair-Weather/Content vs Source (Follow-up).
