answer: |-
  You are right, and your friend is making a classic mistake that confuses **single-bet Expected Value (EV)** with **long-term bankroll growth**.

  While his logic holds up for a single, isolated bet, it falls apart completely when you are making repeated bets with a finite bankroll. In the world of gambling and investing, his strategy is a guaranteed path to "Gambler's Ruin."

  Here is the breakdown of why his logic is flawed, the mathematical concept that proves you right, and the formula pros actually use to determine bet size.

  ### 1. The Flaw: Arithmetic vs. Geometric Growth
  Your friend is arguing based on **Arithmetic Expected Value**.
  *   **His Logic:** If I have a 1% edge and bet \$100, I expect to win \$1. If I bet \$1,000, I expect to win \$10. Therefore, betting more is always better.
  *   **The Reality:** This ignores **variance** and **compounding**. When you gamble repeatedly, your bankroll grows (or shrinks) geometrically, not arithmetically.

  **The "All-In" Thought Experiment:**
  Imagine a coin flip where you have a massive advantage: you win 60% of the time, lose 40% of the time. The payout is 1:1. This is a much better edge than any card counter ever gets.
  *   **Friend's Strategy:** Bet 100% of your bankroll every time.
  *   **Hand 1:** You bet \$1,000. You win. Bankroll = \$2,000.
  *   **Hand 2:** You bet \$2,000. You lose. Bankroll = \$0.
  *   **Game Over.**

  Even though the *average* outcome of that bet was positive, the *median* outcome of repeating that bet is zero. Because you bet your entire bankroll, a single loss wipes you out. In blackjack, even with a positive count, you will still lose roughly 45-48% of the hands. If you are betting table max (which is likely a huge chunk of your bankroll), a short losing streak will bankrupt you before the "edge" has time to work.

  ### 2. The Solution: The Kelly Criterion
  You asked how you actually figure out how much to bet. The mathematical answer is the **Kelly Criterion**.

  Developed by John Kelly at Bell Labs in 1956, this formula calculates the optimal bet size to maximize the **geometric growth rate** of your bankroll while theoretically eliminating the risk of ruin.

  The simplified formula for even-money bets (like blackjack) is:
  $$f^* = \text{Edge}$$

  Where:
  *   $f^*$ is the fraction of your **current bankroll** to bet.
  *   **Edge** is your percentage advantage over the house.

  **How it works in practice:**
  *   If your bankroll is \$10,000.
  *   The count gives you a **1% edge**.
  *   Kelly says you should bet **1% of your bankroll** (\$100).
  *   If the count gets hotter and your edge rises to **2%**, you bet **2%** (\$200).

  **Why this beats your friend's strategy:**
  1.  **It scales down when you lose:** If you hit a losing streak and your bankroll drops to \$9,000, your next bet automatically shrinks to protect what's left. Your friend's strategy (betting table max) keeps the bet size static or maxed out, accelerating the path to zero.
  2.  **It scales up when you win:** As you win, your bets get bigger, compounding your gains safely.
  3.  **It accounts for variance:** It recognizes that even with an edge, losing streaks are mathematically guaranteed.

  ### 3. Why "Table Max" is Usually Wrong
  In most casinos, the table maximum is designed to be high enough for "whales" (rich gamblers) but dangerous for advantage players.

  Let's say the table max is \$1,000.
  *   To safely bet \$1,000 using the Kelly Criterion with a 2% edge, you would need a bankroll of **\$50,000**.
  *   If your friend has a \$5,000 bankroll and bets \$1,000 (20% of his bankroll) on a 2% edge, he is betting **10x Full Kelly**.

  Betting significantly more than the Kelly fraction drastically increases your volatility and Risk of Ruin without significantly increasing your expected growth rate. In fact, betting more than double the Kelly amount actually *reduces* your long-term growth rate and increases the chance of ruin.

  ### 4. Practical Nuance: "Fractional Kelly"
  In the real world, professional card counters rarely bet "Full Kelly." They usually bet **Half-Kelly** or **Quarter-Kelly**.

  **Why?**
  1.  **Estimation Error:** Counting isn't perfect. You might *think* you have a 2% edge, but you miscalculated and actually have a -1% edge. Betting smaller protects you from your own mistakes.
  2.  **Volatility:** Full Kelly can result in massive swings in bankroll value (drawdowns of 50% are common with Full Kelly). Half-Kelly reduces volatility by roughly 75% while still capturing most of the growth.
  3.  **Heat:** Betting the table maximum the second the count turns positive is a giant red flag to the pit boss. It screams "card counter." Pros spread their bets more subtly to avoid getting banned.

  ### Summary for Your Friend
  You can tell him this:
  > "You're maximizing **Arithmetic EV**, which works for a single bet. But since we play repeatedly with a finite bankroll, we need to maximize **Geometric Growth**. If you bet too large a fraction of your bankroll relative to your edge, the Risk of Ruin approaches 100%. The math proves that there is an optimal bet size (Kelly), and betting table max usually exceeds that by a factor of 10 or more. You aren't being 'risk-averse,' you're being 'mathematically solvent.'"

  **Verdict:** You win the argument. Positive EV justifies betting, but it does **not** justify betting as much as possible. Size matters.
