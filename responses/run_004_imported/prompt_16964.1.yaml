      Okay, so Maya is defending *Endgame's* rule. Diego is attacking the *necessity* of that rule, using *HP* as a counter-example of a coherent single timeline.
      So, Round 1 is about the *necessity* of branching. Round 2 is about *HP's* coherence. Round 3 is about the *implication* of consistency (free will).

      *Correction on Move 1:* Maya argues branching is *necessary* to avoid paradox. Diego argues single timeline is *possible* if actions are constrained.
      *Verdict:* Diego is logically stronger (consistent single timelines are mathematically possible). Maya is intuitively stronger (humans expect to be able to change things).

      *Correction on Move 3:* Maya calls it "fate patching." Diego calls it "mundane causality." This is the "Newcomb's Problem" or "Predestination" debate. Diego's view is more naturalistic. Maya's view highlights the modal restriction.

