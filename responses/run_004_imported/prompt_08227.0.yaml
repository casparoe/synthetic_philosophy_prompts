          *   Core claim: Survival is what matters, not identity.
          *   Argument from Fission: If I split into Lefty and Righty, I am not identical to both (transitivity of identity fails). I am not identical to just one (no basis for selection). Therefore, I am identical to neither. But surely I survive as *both* (or at least, my concern extends to both). Thus, survival $\neq$ identity.
          *   Implication: We should care about Relation R, not the "further fact" of identity.
      *   **David Lewis (Counterpart Theory/Identity via Overlap):**
          *   Core claim: Identity *is* what matters. Parfit's conclusion is based on a false premise about counting.
          *   Argument from Fission: Before the split, there aren't one person, but two distinct persons who are qualitatively identical and share all physical/mental stages up to the split. Let's call them Fred1 and Fred2. After the split, Fred1 goes to Mars A, Fred2 goes to Mars B. Identity is preserved.
          *   Implication: The intuition that "I am one person" before the split is the error. Identity holds, so the link between identity and what matters remains intact.

  3.  **Drafting - Stage 1: Setting the Scene & Opening Salvo:**
