          *   *Lewis-style Identity Theorist:* Believes identity *does* matter. Uses the "overlap" or "co-location" view (before fission, there are two distinct persons sharing stages).
      *   **Format:** Dialogue.
      *   **Requirements:** Real back-and-forth (responding to moves, not just restating), neither side should be an obvious loser (balanced argument), specific focus on the fission case.

  2.  **Deconstruct the Philosophical Positions:**
