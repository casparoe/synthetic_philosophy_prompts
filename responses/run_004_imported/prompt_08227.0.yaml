      *   Sam needs to defend the coherence of overlapping persons.
      *   *Key Point:* Alex argues that even if Lewis is metaphysically right, it doesn't capture the *fear* or *anticipation* of the person stepping in.
      *   *Key Point:* Sam argues that Parfit's "Relation R" is vague. If R matters, why does it matter less if there are 100 copies? (The "Magnitude" objection).

  5.  **Drafting - Stage 3: The "Empty Question" vs. "Deep Fact":**
      *   Parfit often says questions of identity can be "empty" (no fact of the matter).
