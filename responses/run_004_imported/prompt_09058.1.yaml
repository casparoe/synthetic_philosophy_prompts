answer: |-
  The central selling point of Lara Buchak's Risk-Weighted Expected Utility (REU) theory is that it expands the space of rational preferences to include Allais-type behaviors. By introducing a risk-function $r$ distinct from the utility function $u$, REU allows an agent to care not just about *what* outcomes occur and *how much* they are worth, but *how* those outcomes are distributed across probabilities. This supposedly rationalizes the "certainty effect"—the preference for a sure thing over a gamble with slightly higher expected value—without labeling the agent irrational.

  However, a normative theory of *ideal* rationality must satisfy more than static coherence; it must satisfy **diachronic coherence**. An ideally rational agent should not be susceptible to strategies that guarantee a loss relative to their own preferences (money pumps), nor should their decision-making procedure undermine their own instrumental goals. REU fails this test. The dynamic inconsistency inherent in REU is not a minor bug; it is a fatal flaw for its normative ambitions. Furthermore, the standard defense—pre-commitment or resolute choice—fails to rescue the theory because it either covertly reinstates the axiom REU was designed to reject or renders the theory action-guidingly vacuous at the moment of choice.

  ### 1. The Money Pump and Instrumental Irrationality

  The most damning objection to REU as a normative theory is that a naive REU-maximizer (one who re-optimizes at every decision node) is dynamically inconsistent. Because REU violates the Independence Axiom (or the Sure-Thing Principle), an agent's preference between two gambles can reverse depending on whether they are viewed in isolation or as part of a larger sequence where some uncertainty has already been resolved.

  Consider a sequential gamble where, ex-ante, the REU agent prefers a risky plan over a safe one. However, once the agent reaches a specific node in the decision tree where some risk has been eliminated, the re-weighting of the *remaining* probabilities may cause the agent to prefer the safe option. If the agent is free to revise their plan at every node, they may pay a small premium to enter the risky plan (based on ex-ante valuation), only to pay another premium to switch to the safe plan later (based on ex-post valuation). The result is a dominated strategy: the agent ends up with less money than if they had simply stuck to the safe plan from the start, all while believing at every step they were maximizing their rational value function.

  For a descriptive theory of human psychology, this is acceptable; humans are often dynamically inconsistent. But for a theory of **ideal rationality**, this is fatal. Ideal rationality implies **means-ends coherence**. If an agent's decision-making procedure systematically leads them to outcomes they themselves rank as worse (ex-ante), the procedure is instrumentally self-defeating. An ideally rational agent cannot be a money pump. If REU permits preferences that lead to sure losses in sequential contexts, it fails to define a coherent ideal agent.

  ### 2. The Pre-Commitment Fix: Smuggling in Independence

  Proponents of REU, including Buchak, often respond by arguing that rational agents should not be "naive." Instead, they should recognize their future inconsistency and **pre-commit** to their ex-ante preferred plan. This is the strategy of "resolute choice": the agent at time $t_0$ makes a plan, and the agent at time $t_1$ executes it without re-optimizing, simply because it was the plan.

  This fix, however, collapses under scrutiny. It attempts to solve the dynamic inconsistency problem by effectively **smuggling the Independence Axiom back in through the back door.**

  The entire motivation for REU is the rejection of Independence. REU claims it is rational to care about the global structure of risk, not just local conditional probabilities. However, dynamic inconsistency arises precisely because the "global structure" looks different from different nodes in the decision tree. To avoid the money pump, the agent must treat the sequential choice *as if* it were a single simultaneous choice. They must act as though the truncation of the probability tree at $t_1$ is irrelevant to their valuation.

  But this *is* the Sure-Thing Principle. The Sure-Thing Principle essentially states that if you prefer Plan A to Plan B, you should still prefer A to B even if you find out some common consequence obtains. By forcing the agent to ignore the new informational context at $t_1$ and stick to the $t_0$ valuation, the pre-commitment strategy enforces a normative requirement that the value of a choice should not depend on how the probability space is partitioned or sequenced.

  If the only way to make REU rational is to force the agent to act *as if* they satisfy Independence diachronically, then REU loses its distinctive normative force. It becomes a theory that says: "It is rational to have Allais preferences, provided you bind yourself so tightly that you never actually act on them when the context changes." This renders the risk-function $r$ normatively inert in any complex, real-world environment where decisions are sequential. If you must ignore your local REU calculation to be rational, in what sense is maximizing REU the definition of rationality?

  ### 3. The Action-Guidance Problem

  Even if we grant that pre-commitment avoids the money pump, it creates a second, perhaps deeper problem: **the loss of action-guidance.**

  A normative theory must tell an agent what to do *at the moment of choice*. When the REU agent stands at node $t_1$, they face a choice. Their ex-ante plan says "Go Left." Their ex-post REU calculation (which the theory posits is the correct measure of value) says "Go Right."

  Why should the agent at $t_1$ listen to the agent at $t_0$? In standard Expected Utility (EU) theory, this conflict does not exist. Because EU satisfies Dynamic Consistency, the ex-ante optimal plan is also ex-post optimal (conditional on the information available). The $t_0$ and $t_1$ selves are in agreement.

  In REU, they are in genuine disagreement. The theory claims that maximizing the risk-weighted value is what rationality *is*. Yet, at $t_1$, maximizing risk-weighted value requires breaking the plan. If the theory says "Follow the plan instead," it is telling the agent to **violate the very principle the theory defines as rational.**

  This fragments the agent. It posits a "supra-agent" (the planning self) whose authority overrides the "local agent" (the choosing self), but it provides no normative justification for this authority that is accessible to the local agent. From the perspective of the agent at $t_1$, following the plan is sub-optimal according to the REU metric. To say "Do it anyway because your past self said so" is not a rational argument; it is an appeal to tyranny.

  For a theory of *ideal* rationality, this is unacceptable. An ideal agent should be a unified locus of decision-making. If the theory requires the agent to ignore their current best judgment to avoid self-sabotage, the theory admits that their current best judgment is untrustworthy. But if their current best judgment is untrustworthy, why was it deemed "rational" in the first place?

  ### Conclusion

  Buchak's REU theory succeeds as a descriptive model of how humans *do* reason about risk, capturing the psychological reality of the certainty effect. However, it fails as a normative theory of how ideally rational agents *should* reason.

  The dynamic inconsistency problem demonstrates that REU preferences are incompatible with diachronic coherence. An agent who holds them is vulnerable to exploitation, violating the basic requirement of instrumental rationality. The proposed fix—pre-commitment—does not save the theory. It either implicitly reinstates the Independence Axiom by forcing the agent to treat sequential choices as simultaneous (negating REU's core innovation), or it severs the link between rationality and action-guidance, telling the agent to ignore their current rational assessment in favor of a past commitment they no longer endorse.

  Ideal rationality requires that an agent's preferences guide them to the best outcomes without self-sabotage, regardless of how the choice is framed over time. REU cannot satisfy this. Therefore, while Allais preferences may be psychologically understandable, they cannot be vindicated as the preferences of an ideally rational agent.
