  **Classical Utilitarianism:** This approach assumes a natural, uncalibrated scale for pleasure and pain across persons, resembling pre-scientific measurement without operational definitions.

  **Robbins's Ordinalism:** While correctly identifying the lack of empirical grounding for utility comparisons, this view dissolves the problem by declaring it unscientific rather than constructing a viable convention.

  **Kaldor-Hicks Compensation:** This method attempts to bypass direct comparison through hypothetical compensation tests, but it introduces logical inconsistencies that ultimately mask rather than solve the valuation problem.

  **Arrow's Extended Sympathy:** This offers a rigorous formal grounding by reducing interpersonal comparisons to intrapersonal choices over extended profiles, though it relies on the empirical coherence of hypothetical preferences.

  **Harsanyi's Aggregation Theorem:** While mathematically deriving a social welfare function, this approach relies on axioms that stipulate interpersonal scaling factors rather than empirically grounding them like a physical standard.

  **Rawls's Primary Goods:** This solves comparability by shifting the metric to objective social goods, but it measures resources rather than advantage directly, acting as a proxy rather than a direct solution.

  **Sen's Capability Approach:** This robustly addresses the informational poverty of utility metrics by evaluating capabilities and functionings, providing a defensible evaluative space without claiming natural utility units.
