      *   *The "Ecological Integrity" Argument:* Invasive species disrupt the whole system, causing more suffering/chaos long-term. Restoring balance reduces net suffering eventually.
      *   *The "Responsibility/Complicity" Argument:* Humans introduced the predators. We have a duty to fix our mess. The predators are victims of us too, but the plovers are the innocent parties in *this* specific context.
      *   *The "Threshold" Argument:* Extinction is a unique moral bad that outweighs individual deaths.
