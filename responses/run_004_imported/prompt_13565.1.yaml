      *   Body 1: Shewmon's case. Somatic integration persists. The brain is not indispensable for *biological* life, only for *conscious* life.
      *   Body 2: Why WBD fails. It conflates "personhood" with "organism." If we stick to biology, WBD is dead (pun intended).
      *   Body 3: Why Higher-Brain fails (ethical danger).
      *   Body 4: Why Circulatory-Respiratory survives. It is the fundamental driver. The "arbitrariness" is actually a necessary normative line drawn at *permanent* cessation.
      *   Conclusion: Accept CRC. Admit WBD was a compromise for transplants that lacked biological rigor.

  7.  **Writing the Essay:** (Focusing on flow, argumentation, and addressing the prompt's specific constraints.) *Make sure to explicitly address the "arbitrary" charge against CRC.* *Make sure to defend a verdict.*

      *(Self-Correction during drafting)*: I should ensure I don't dismiss the brain's role entirely. It is the integrator of *interaction*. But death is about the organism, not the interaction. Shewmon wins on "organism."

      *(Final Polish)*: Check the distinction between "irreversible" and "permanent." This is crucial for the CRC defense.

