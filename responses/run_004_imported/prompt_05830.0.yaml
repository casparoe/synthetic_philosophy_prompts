answer: |-
  This is one of the most sophisticated debates in the philosophy of science and algorithmic information theory. You and your friend are both touching on valid points: there *is* a rigorous mathematical framework that justifies Occam's Razor, but it does not fully escape the charge of conventionalism.

  Here is a precise breakdown of how Solomonoff induction and Kolmogorov complexity formalize the principle, what the Invariance Theorem actually proves, and where the residual arbitrariness lies.

  ### 1. The Formalization: Kolmogorov Complexity and Solomonoff Induction

  To make Occam's Razor rigorous, we must define "simplicity" objectively. Algorithmic Information Theory (AIT) defines the simplicity of an object (or hypothesis) as its **compressibility**.

  **Kolmogorov Complexity ($K$)**
  Let $x$ be a binary string (representing data or a hypothesis). The Kolmogorov complexity of $x$ relative to a Turing machine $U$, denoted $K_U(x)$, is the length of the shortest program $p$ that causes $U$ to output $x$ and halt.
  $$K_U(x) = \min \{ |p| : U(p) = x \}$$
  Here, $|p|$ is the length of the program in bits. A "simple" hypothesis is one with a low $K_U(x)$.

  **Solomonoff Induction**
  Ray Solomonoff extended this to prediction. He proposed a universal prior probability distribution over all possible computable hypotheses. If we view hypotheses as programs $p$ that generate data $x$, Solomonoff assigns a prior probability $P(p)$ based on the program's length:
  $$P(p) = 2^{-|p|}$$
  This is the mathematical encoding of Occam's Razor. For every extra bit of complexity required to specify a hypothesis, its prior probability is halved. When updating on evidence using Bayes' theorem, shorter programs (simpler hypotheses) start with a massive advantage. This framework is provably optimal: if the true underlying process generating the data is computable, Solomonoff induction will converge to the true distribution faster than any other method.

  ### 2. The Objection: The Choice of Machine

  Your friend's objection is the standard critique of AIT: **$K_U(x)$ is not absolute; it is relative to $U$.**

  Kolmogorov complexity is defined relative to a specific Universal Turing Machine (UTM). If I choose a machine $U_{\text{weird}}$ that has a special instruction "Print the entire works of Shakespeare," then the string representing Shakespeare has very low complexity on $U_{\text{weird}}$ but high complexity on a standard machine $U_{\text{std}}$.

  If simplicity depends on the machine, and the choice of machine is up to us, then isn't "prefer the simpler hypothesis" just "prefer the hypothesis that fits the machine we arbitrarily chose"? This looks like the aesthetic bias your friend described.

  ### 3. The Defense: The Invariance Theorem

  The standard reply is the **Invariance Theorem** (attributed to Kolmogorov, Solomonoff, and Chaitin).

  **The Theorem:**
  For any two universal Turing machines $U_1$ and $U_2$, there exists a constant $c$ (which depends on $U_1$ and $U_2$ but **not** on the string $x$) such that for all $x$:
  $$|K_{U_1}(x) - K_{U_2}(x)| \le c$$

  **What this establishes:**
  1.  **Additive Constant:** The complexity values assigned by different machines can differ, but only by a fixed additive amount.
  2.  **Asymptotic Agreement:** As the strings $x$ become sufficiently long (i.e., as we gather more data), the constant $c$ becomes negligible relative to the total length $|x|$.
  3.  **Probabilistic Bound:** In Solomonoff induction, priors are $2^{-K(x)}$. Because the complexities differ by at most $c$, the priors assigned by two different machines differ by at most a multiplicative factor of $2^c$.
      $$ \frac{P_{U_1}(x)}{P_{U_2}(x)} \le 2^c $$
      While the probabilities aren't identical, they are within a constant factor of each other.

  **The Argument:**
  Proponents argue that because the disagreement is bounded by a constant, the choice of machine does not matter *in the limit*. Any universal machine will eventually agree on which hypotheses are simpler once the data is rich enough. Therefore, Occam's Razor is not arbitrary; it is a robust feature of computation itself.

  ### 4. The Verdict: Does Residual Conventionalism Survive?

  Your friend is not fully wrong, and you are not fully right. The Invariance Theorem resolves the objection only under specific conditions that do not always hold in practice. Here is where the residual conventionalism survives:

  **A. The "Finite Data" Problem**
  The Invariance Theorem is an *asymptotic* result. It guarantees convergence as data length $\to \infty$. However, human science always operates on finite data.
  If the constant $c$ between your machine and mine is $10^{100}$ bits, and we only have $10^{50}$ bits of data, the invariance theorem offers no practical protection. I can construct a UTM that makes any specific finite dataset look "simple" (low complexity) by hardcoding that dataset into the machine's architecture. For finite datasets, the choice of reference machine *does* determine the outcome.

  **B. The "Reference Class" Problem**
  The theorem applies to *Universal* Turing Machines. But which machines count as valid UTMs?
  Technically, a machine that outputs "Grue" (green before time $t$, blue after) for a single bit instruction is a valid UTM. If we allow *any* mathematically valid UTM, we can smuggle in any bias we want.
  To make Solomonoff induction work, we must restrict ourselves to "natural" or "simple" UTMs. But how do we define a "simple" UTM without already invoking Occam's Razor? We end up saying "Use the simplest machine," which is circular. We implicitly privilege machines that look like the physics of our universe (e.g., local interactions, standard logic), which is a convention based on our empirical success, not a priori necessity.

  **C. Uncomputability**
  A crucial caveat often missed: Kolmogorov complexity is **uncomputable**. There is no algorithm that can take a string $x$ and output $K(x)$. Solomonoff induction is also uncomputable.
  This means the "rigorous justification" is a theoretical ideal, not a method scientists can actually execute. Scientists use approximations (like Minimum Description Length). These approximations require choosing a specific coding scheme (a specific machine language), reintroducing the conventionality at the practical level.

  ### Summary

  You can tell your friend this:

  1.  **He is right that it is not metaphysical necessity.** There is no "God's Turing Machine" that dictates the true complexity of the universe. The choice of a reference machine is a convention.
  2.  **You are right that it is not *mere* habit.** The Invariance Theorem shows that once a community agrees on a standard of computation (a reference class of UTMs), the preference for simplicity is mathematically forced. It is not an aesthetic preference; it is a consistency requirement for optimal prediction.
  3.  **The Synthesis:** Occam's Razor is justified as a **pragmatic necessity for learning agents**. Any agent that wants to predict the future efficiently must penalize complexity. The "arbitrariness" of the machine choice is bounded (by the Invariance Theorem), meaning that *any* reasonable community of learners will converge on similar theories given enough data.

  The justification is not that the universe *is* simple, but that **simplicity is the only currency in which learning can be bought.** The choice of currency (the Turing Machine) is conventional, but the need to spend it is not.
