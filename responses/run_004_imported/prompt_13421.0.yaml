answer: |-
  **MEMORANDUM**

  **TO:** The Honorary Degrees Committee
  **FROM:** [Your Name], Graduate Assessor
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding the Nomination of Lt. Gen. Daniel Ashworth (Ret.)

  **Recommendation**
  I recommend that the Committee **award** the honorary degree to Lt. Gen. Daniel Ashworth, **conditional upon the adoption of a specific, unvarnished citation** that explicitly references the 1994 air campaign and the ethical controversy surrounding it. We should not award the degree *despite* the controversy, but rather *through* it, using the citation to model the kind of moral accountability the University claims to value.

  **Adjudication of Intention**
  The deadlock in this Committee rests on a disagreement about moral psychology: did General Ashworth intend to harm civilians, or was civilian harm merely a foreseen side effect of legitimate military targeting? This is the crux of the Anscombe-style objection.

  The "Double Effect" defense relies on the contemporaneous military orders, which cite "degradation of command-and-control." However, in moral philosophy, an agent's own avowal of their reasons for action carries significant evidentiary weight, particularly when made retrospectively without legal coercion. In his memoir, Ashworth writes that utilities were chosen "to bring the war home to the population and hasten the collapse of its will." This is not a description of collateral damage; it is a description of *coercion*.

  Therefore, on the specific question of intention, the Committee must accept the strongest form of the Anscombe argument: **General Ashworth intentionally targeted the civilian population's life-support systems to break their political will.** To argue otherwise is to privilege bureaucratic euphemism over moral confession. The Doctrine of Double Effect does not apply here, because the suffering of the population was not merely foreseen; it was the *mechanism* by which the military objective was achieved. Anscombe is correct that no accounting of consequences (the averted ground invasion) converts this intentional targeting into a permissible act under *jus in bello* discrimination. We should not delude ourselves that this was a "clean" strike.

  **The Case for Awarding the Degree**
  If the act was morally impermissible, why award the degree? The "Withhold" faction argues that honoring Ashworth makes the University complicit in that past wrong, rendering him morally ineligible regardless of subsequent virtue. This is a serious deontological claim: that some acts stain the agent permanently, and that institutional recognition functions as a moral absolution we have no right to grant.

  However, the honorary doctorate is being proposed for his *post-service* work: thirty years of humanitarian mediation and the founding of an institute dedicated to conflict resolution. To withhold the degree on the basis of his military service is to assert that his later life cannot constitute a form of moral restitution. It risks turning the University into a tribunal of past sins rather than a recognizer of current contribution.

  The "Award" faction argues that the consequences of his mediation work (lives saved, conflicts de-escalated) outweigh the past. While I reject the utilitarian calculus that "good ends" wash away "bad means," I accept the aretaic judgment that a person is more than their worst act. Ashworth's subsequent career suggests a genuine commitment to the protection of civilians that was absent in 1994.

  **The Necessity of the Citation**
  The middle path is not a compromise; it is a moral requirement. If we award the degree without mentioning the campaign, we validate the "Withhold" side's fear of complicity. We would be sanitizing history. If we withhold the degree, we validate the "Award" side's fear of moral rigidity, ignoring the possibility of redemption.

  By awarding the degree *with* a citation that names the campaign and the ethical tension, we do two things:
  1.  We acknowledge the Anscombe objection as valid (the targeting was wrong).
  2.  We acknowledge the humanitarian work as significant (the mediation is worthy).

  This forces the University to take responsibility for the ambiguity. We are not saying "what he did was fine." We are saying "what he did was grave, but what he has since done is worthy of recognition, provided we do not forget the cost."

  **Proposed Citation**
  I propose the following language for the degree citation, which avoids euphemism:

  > *"For thirty years of dedicated humanitarian diplomacy and the founding of the International Mediation Institute, work that has de-escalated conflicts and protected vulnerable populations. We recognize this contribution to peace even as we acknowledge the complex ethical legacy of his prior military service, specifically the 1994 air campaign which ended a regional war at a heavy civilian cost. We honor this later commitment to the preservation of life, mindful of the enduring moral questions regarding the means of war."*

  **Conclusion**
  This recommendation asks the Committee to hold two truths simultaneously: that General Ashworth committed a violation of non-combatant immunity, and that he has since devoted his life to mitigating such violations. To ignore the first truth is dishonest; to ignore the second is uncharitable. The proposed citation allows us to be both honest and charitable.

  I urge the Committee to vote to award, contingent on this text.
