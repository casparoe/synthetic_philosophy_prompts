  5.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. The Kelly Criterion vs. Expected Utility. Introduce Peters' Ergodicity Economics (time vs. ensemble) and Samuelson's critique (finite horizon/utility). State the thesis: While ergodicity economics correctly identifies the failure of ensemble averages in multiplicative dynamics, it fails to prove Kelly is uniquely rational because prioritizing asymptotic growth over path risk is itself a utility choice.
      *   **The Ergodicity Argument (Peters):** Explain the non-ergodic nature of multiplicative wealth. $E[W] \neq \exp(E[\ln W])$. The ensemble average grows while the individual goes bankrupt. Therefore, maximize time-average growth ($\ln W$). This claims to derive risk aversion from math, not psychology.
      *   **The Samuelson/Critic Argument:** The "asymptopia" objection. We don't live in the limit. Drawdowns matter. Utility functions reflect preferences over *paths* and *states*, not just long-run rates. Choosing log-utility is choosing to ignore short-term pain for long-term gain. That's a preference, not a law.
      *   **Critical Engagement/Synthesis:**
          *   Acknowledge Peters' win against *naive* expectation maximization. You *shouldn't* maximize arithmetic mean in compounding.
