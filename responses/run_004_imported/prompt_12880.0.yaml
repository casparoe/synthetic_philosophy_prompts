          *   Discuss "Rationality." Is rationality about survival or satisfaction of preferences? If preferences include "no 50% drop," Kelly might violate that (depending on leverage).
      *   **Verdict:** Geometric rationality is not categorically mandatory. It is the optimal strategy for a specific objective function (unconstrained long-term growth). Rationality allows for different objective functions (e.g., target wealth, consumption smoothing). Therefore, it is one legitimate attitude among others, albeit the one required for *survival* in open-ended compounding.
