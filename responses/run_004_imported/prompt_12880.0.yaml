answer: |-
  # The Physics of Wealth and the Psychology of Choice: A Verdict on Geometric Rationality

  The debate over the Kelly Criterion occupies a contentious space where probability theory, economics, and moral philosophy intersect. At its heart lies a question of normative authority: when facing repeated, compounding gambles, is maximizing the expected logarithm of wealth (geometric rationality) the uniquely correct rule for any rational agent, or is it merely one permissible risk attitude among many? Defenders of the "ergodicity economics" program, led by Ole Peters, argue the former. They contend that log-optimality follows inevitably from the physical structure of time and multiplicative dynamics, rendering traditional expected-utility theory (EUT) obsolete for such problems. Critics, channeling Paul Samuelson, argue the latter: that privileging long-run growth rates is itself a substantive value judgment, not a value-free discovery.

  This essay engages with the strongest formulations of both positions. It acknowledges that ergodicity economics successfully demolishes the naive use of ensemble averages in multiplicative environments. However, it ultimately defends the verdict that geometric rationality is **not rationally mandatory**. While it is the instrumentally optimal strategy for unconstrained, infinite-horizon survival, the choice to prioritize asymptotic growth over path stability or finite-horizon outcomes remains a subjective utility commitment. Therefore, Kelly betting is a legitimate risk attitude, but not a categorical imperative of rationality.

  ### The Ergodicity Argument: Rationality as Physics

  The strongest case for the mandatory nature of Kelly betting rests on the distinction between ensemble averages and time averages. In standard neoclassical economics, a gamble is often evaluated by its expectation value: the sum of outcomes weighted by their probabilities. This is an "ensemble average," conceptualizing parallel universes where every possible outcome occurs simultaneously. For additive processes, the ensemble average converges with the "time average" (the experience of a single agent moving through time). However, wealth dynamics are typically multiplicative: gains and losses are percentages of current capital, not fixed amounts.

  Peters argues that multiplicative dynamics are non-ergodic. In a classic coin-toss gamble where one wins 50% on heads and loses 40% on tails, the ensemble average wealth grows exponentially. Yet, a single agent playing this game repeatedly will almost surely see their wealth decay to zero. The ensemble average describes the wealth of a hypothetical collective, while the time average describes the reality of the individual.

  From this vantage point, the ergodicity program claims to derive risk aversion from the dynamics of the system rather than the psychology of the agent. If an agent wishes to maximize their wealth growth rate over time (the only metric physically accessible to a single trajectory), they must maximize the expected logarithm of wealth. The logarithm does not appear because the agent is "afraid" of risk; it appears because $\ln(W)$ is the additive quantity in a multiplicative process. Consequently, proponents argue that deviating from log-optimality is not a matter of differing risk tolerance, but a mathematical error akin to adding apples and oranges. It frames geometric rationality not as a preference, but as a law of motion for capital.

  ### The Samuelson Critique: Rationality as Preference

  The counter-argument, rooted in the work of Paul Samuelson, challenges the normative leap from "is" to "ought." Samuelson famously objected to the idea that the long run dictates rational behavior, noting that "in the long run we are all dead." The ergodicity argument relies on asymptotic properties: a Kelly bettor will almost surely outperform any other strategy as time approaches infinity. However, rational agents operate within finite horizons and face intermediate constraints.

  Critics argue that selecting the time-average growth rate as the objective function is itself a utility choice. Why should an agent care about the growth rate at $t \to \infty$ more than the expected wealth at $t = 10$ years, or the probability of a 50% drawdown in year 3? To prioritize the geometric mean over the arithmetic mean is to assert that terminal wealth in the distant future outweighs intermediate volatility or ruin risk. This is a substantive evaluative commitment.

  Furthermore, the ergodicity argument assumes an agent can withstand arbitrary drawdowns provided they do not hit exactly zero. In reality, agents have liabilities, consumption needs, and psychological limits. A strategy that maximizes long-term growth might entail a volatility path that forces an agent to liquidate positions at a loss due to margin calls or panic. Samuelson's insight reminds us that utility functions are meant to capture these specific constraints and preferences. To say an agent *should* maximize log-wealth is to impose a specific utility function (logarithmic) upon them, not to liberate them from utility functions entirely.

  ### Synthesis: The Hidden Normativity of Ergodicity

  The dispute turns on whether the structure of the gamble dictates the goal of the gambler. Peters is undoubtedly correct that standard expected-utility theory often misapplies ensemble averages to non-ergodic processes, leading to pathological recommendations (such as betting the farm on positive-expectation gambles that lead to certain ruin). The ergodicity correction is a vital ontological insight: in compounding environments, the arithmetic mean is a misleading metric for individual success.

  However, the ergodicity program overreaches when it claims this ontological insight resolves the normative question. The move from "wealth compounds multiplicatively" to "one must maximize the time-average growth rate" contains a hidden premise: that the agent's sole objective is the maximization of terminal wealth in an infinite horizon. This is not a law of physics; it is a specific definition of success.

  Consider an agent with a finite time horizon, such as a retiree drawing down savings, or a fund manager judged on quarterly performance. For these agents, the asymptotic dominance of the Kelly strategy is irrelevant. They may rationally prefer a strategy with a lower geometric growth rate but a higher arithmetic mean at a specific horizon, or a lower variance of outcomes. To label these agents "irrational" because they do not maximize the time-average growth rate is to define rationality tautologically as "doing what Kelly says." True rationality implies consistency between actions and the agent's actual goals, whatever those goals may be.

  Moreover, the ergodicity argument treats the logarithm as a physical necessity, but the choice to maximize growth *at all* is a value judgment. An agent might prioritize stability, ethical constraints, or consumption smoothing over wealth accumulation. The mathematics of compounding dictates that *if* you want to maximize long-term growth, you *must* bet geometrically. It does not dictate that you *must* want to maximize long-term growth.

  ### Verdict: Geometric Rationality as Instrumental, Not Categorical

  Based on this analysis, the verdict is that geometric rationality is **not rationally mandatory** for compounding gambles; it is merely one legitimate risk attitude among others, albeit a uniquely powerful one for specific objectives.

  The ergodicity economics program succeeds in proving that arithmetic expectation maximization is irrational for repeated compounding gambles, as it ignores the non-ergodic nature of wealth dynamics. In this narrow sense, Peters defeats the naive application of EUT. However, he fails to prove that log-utility is the *only* rational response. The choice to optimize for the time-average growth rate is a choice to value the infinite future over the finite present and to accept significant path volatility in exchange for asymptotic dominance.

  This is a legitimate preference, often the wisest one for open-ended capital accumulation, but it is not a universal law. A rational agent with a finite horizon, specific liability constraints, or a low tolerance for drawdowns may legitimately choose a "fractional Kelly" strategy or an entirely different allocation. To claim otherwise is to confuse the dynamics of the system with the goals of the agent. Rationality requires that agents choose strategies consistent with their constraints and values; since constraints and values vary, no single betting fraction can be universally mandatory.

  ### Conclusion

  The Kelly Criterion stands as a profound insight into the mathematics of survival and compounding. Ole Peters and the ergodicity economists have rightly identified that standard economic models often ignore the physical reality of time, leading to dangerous prescriptions. Yet, in their zeal to ground decision theory in physics, they risk committing a naturalistic fallacy. The structure of a gamble constrains what is possible, but it does not dictate what is desirable. Geometric rationality is the optimal tool for the job of infinite-horizon wealth maximization, but rational agents are free to choose other jobs. Thus, while deviating from Kelly may be suboptimal for growth, it is not inherently irrational. Rationality remains a matter of aligning means with ends, and the ends themselves remain a matter of human choice.
