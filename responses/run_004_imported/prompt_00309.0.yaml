answer: |-
  This is a fantastic distinction to nail down. You are right to be suspicious—they are both "impossibility theorems" in social choice theory, meaning they both prove that democratic aggregation can fail. But **how** they fail is mechanically different, and that difference changes the tension in your scene.

  Here is the breakdown of the mechanics, the difference in outcomes, and how to write the scene so it feels authentic.

  ### 1. The Core Mechanical Difference

  **The Condorcet Paradox is about *Preferences* (Cyclical Majorities).**
  *   **The Setup:** The group is choosing between **alternatives** (Option A, Option B, Option C).
  *   **The Mechanism:** Pairwise voting. (Is A better than B? Is B better than C?)
  *   **The Glitch:** Intransitivity. The group prefers A over B, B over C, but **C over A**.
  *   **The Result:** **Gridlock.** There is no winner. The vote could go on forever, or the agenda setter (the judge/foreman) can manipulate the order of voting to pick any winner they want.
  *   **Courtroom Fit:** Low. This happens when choosing between mutually exclusive verdicts (e.g., Murder vs. Manslaughter vs. Acquittal) where no option commands a stable majority.

  **The Discursive Dilemma (Doctrinal Paradox) is about *Logic* (Inconsistent Judgments).**
  *   **The Setup:** The group is judging **propositions** that logically lead to a conclusion (Premise 1, Premise 2 $\rightarrow$ Verdict).
  *   **The Mechanism:** Aggregating votes on the *premises* vs. aggregating votes on the *conclusion*.
  *   **The Glitch:** Logical inconsistency. The majority accepts Premise 1. The majority accepts Premise 2. Logic dictates the Verdict must be X. But the majority votes for Verdict Y.
  *   **The Result:** **Contradiction.** The group simultaneously holds two mutually exclusive positions. They affirm the facts that prove guilt, but vote "Not Guilty" (or vice versa).
  *   **Courtroom Fit:** **High.** This is exactly what you described. It happens when a verdict requires multiple elements to be proven (e.g., "Did he sign the contract?" + "Was the contract valid?" $\rightarrow$ "Is he liable?").

  ### 2. The Math for Your Scene (The Discursive Dilemma)

  To write this without hand-waving, you need a specific logical structure. In law, this is usually a **conjunctive rule** (Element A **AND** Element B must be true for a Guilty verdict).

  Let's create a 3-person jury sub-committee for your scene (the math works best with small odd numbers to show the split).

  **The Legal Rule:** The Defendant is **Liable** IF:
  1.  They owed a **Duty of Care** (Premise A) **AND**
  2.  They **Breached** that Duty (Premise B).

  **The Jury Votes:**

  | Juror | Premise A (Duty?) | Premise B (Breach?) | **Conclusion (Liable?)** |
  | :--- | :---: | :---: | :---: |
  | **Juror 1** | YES | YES | **YES** |
  | **Juror 2** | YES | NO | **NO** |
  | **Juror 3** | NO | YES | **NO** |
  | **MAJORITY** | **YES** (2-1) | **YES** (2-1) | **NO** (2-1) |

  **The Conflict:**
  *   **Premise-Based View:** If you look at the facts, the majority says there *was* a Duty and there *was* a Breach. Logically, the verdict **must be Liable.**
  *   **Conclusion-Based View:** If you look at the final verdict vote, the majority says **Not Liable.**

  **The Drama:** The jury is saying, "We agree the facts prove he did it, but we vote that he didn't do it."

  ### 3. How to Distinguish Them in the Narrative

  If you mix these up, a legally savvy reader will catch it. Here is how the *feeling* of the room changes based on which paradox you use:

  #### If it were Condorcet (Cyclical):
  *   **The Vibe:** Chaos and manipulation.
  *   **The Dialogue:** "If we vote on Manslaughter first, we lose. If we vote on Murder first, we lose. We're going in circles."
  *   **The Problem:** They can't pick a destination.
  *   **The Resolution:** Usually requires a dictator (Judge declares a mistrial) or agenda manipulation (Foreman forces a specific voting order).

  #### If it is Discursive (Your Scene):
  *   **The Vibe:** Hypocrisy and cognitive dissonance.
  *   **The Dialogue:** "Wait, you just voted that he was negligent. And you voted that he caused the injury. How can you vote Not Liable?" / "Because I don't think he should pay."
  *   **The Problem:** They have broken the logic of the law.
  *   **The Resolution:** They must choose between **consistency** (following the premise vote) or **discretion** (following the verdict vote). This is a moral crisis, not just a math error.

  ### 4. Why the Discursive Dilemma is Better for Your Novel

  The Discursive Dilemma offers richer character conflict for a courtroom drama.

  1.  **It exposes hidden motivations:** In the table above, Juror 2 admits the Duty but denies the Breach. Juror 3 admits the Breach but denies the Duty. They might actually both want the defendant to lose, but they disagree on *why*. By voting on premises, they accidentally cancel each other out.
  2.  **It forces a procedural choice:** The Foreman has to decide: *Do we announce the verdict based on the final vote (Not Liable), or do we enforce the logic of the premises (Liable)?*
      *   If they go with the **Premises**, they override the jurors' direct intent on the verdict.
      *   If they go with the **Verdict**, they are issuing a ruling that contradicts the established facts of the case.
  3.  **It creates a "Mistrial" tension:** In real law (e.g., *United States v. Spock*), courts often forbid premise-based voting precisely to avoid this. They require a general verdict. If your jury is doing premise-based voting (special verdict), they have walked into a trap where the math invalidates their moral judgment.

  ### 5. Cheat Sheet for Writing the Scene

  *   **Don't say:** "The votes are cycling." (That's Condorcet).
  *   **Do say:** "The findings are inconsistent with the judgment."
  *   **Visual Aid:** Have a character draw the table on a whiteboard or notepad. Seeing the "Yes/Yes/No" column vs. the "No" verdict makes the paradox instant and visual.
  *   **The Stakes:** The conflict isn't that they can't decide; it's that they **have decided two contradictory things.**
  *   **The Fix:** In reality, a judge would likely send them back to deliberate until the premises align with the verdict. The drama comes from them realizing that to align them, someone has to lie about their actual belief on the facts.

  **Summary:** Condorcet is "Rock-Paper-Scissors" (no winner). Discursive is "Yes-Yes-No" (logical contradiction). For a courtroom scene about underlying claims, you definitely want **Discursive**. It allows your characters to argue about the integrity of the law itself, rather than just being stuck in a loop.
