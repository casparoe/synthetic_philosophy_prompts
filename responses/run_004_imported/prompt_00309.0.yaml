          *   Rule: Liable if (Duty Breached) AND (Damage Caused).
          *   Juror 1: Breach (Y), Damage (Y) -> Liable (Y).
          *   Juror 2: Breach (Y), Damage (N) -> Liable (N).
          *   Juror 3: Breach (N), Damage (Y) -> Liable (N).
          *   *Majority on Premises:* Breach (Yes 2-1), Damage (Yes 2-1). Logical Conclusion: Liable.
          *   *Majority on Verdict:* Liable (No 2-1).
          *   *Result:* The group believes the facts prove liability, but votes "Not Liable." OR vice versa depending on how you frame it. This is the "Doctrinal Paradox."

  6.  **Final Review against User Query:**
