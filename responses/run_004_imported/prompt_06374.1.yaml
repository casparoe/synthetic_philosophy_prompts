          *   *Standard Substantivalism:* Space(time) exists independently of matter.
          *   *Relationism:* Space(time) is just relations between material objects.
          *   *The Neo-Newtonian Verdict:* It's still substantivalist *about spacetime*, but a weaker version. It posits real geometric structure (the affine connection) that exists even in an empty universe. An empty Neo-Newtonian universe still has inertial paths. A relationist universe (Machian) would not.
