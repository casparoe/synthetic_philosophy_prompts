      *   **Goal:** She wants a sharp, philosophically and theoretically rigorous argument to shut down Kevin's justification at Sunday dinner. It needs to be technically accurate (ESS/marginal-cost logic) and address the applicability of the theory to human cultural rituals.
      *   **Tone:** Intellectual, sharp, slightly witty (given the absurdity of the situation), but rigorous enough to stand up to a PhD.

  2.  **Deconstruct the Theoretical Arguments:**

      *   **Point 1: The Marginal Cost vs. Absolute Cost Distinction (Grafen's Model).**
          *   *Kevin's Claim:* Expensive = Honest (Absolute cost matters).
          *   *User's Insight:* Honesty = Differential Marginal Cost (Single-Crossing Property).
          *   *Technical Detail:* In Grafen's (1990) formalization, a signal is honest if the marginal cost of signaling is lower for high-quality individuals than for low-quality individuals.
          *   *Equilibrium Outcome:* At the separating equilibrium, the high-quality individual *does not* necessarily pay a "handicap" that reduces their fitness significantly. They pay just enough to make it unprofitable for the low-quality type to mimic. Often, the high-quality type is quite efficient at signaling. The "waste" is potential, not necessarily actual.
          *   *Analogy:* It's not about burning money; it's about how *hard* it is to burn money. If I'm rich, $10k is easy. If you're poor, $10k is ruinous. The signal works because *you* can't do it, not because *I* suffer doing it.
          *   *Refutation:* Kevin is conflating the *barrier to entry* (cost for the faker) with the *equilibrium cost* (cost for the truth-teller).

      *   **Point 2: Biological Handicap vs. Conventional Signal.**
          *   *Handicap (Zahavi/Grafen):* Cost is intrinsic/physiological (e.g., a peacock's tail makes flying harder).
          *   *Conventional Signal (Maynard Smith/Harper):* Cost is arbitrary/socially enforced (e.g., a uniform, a handshake, a wedding ring).
          *   *Application to Weddings:* Wedding spending is largely conventional. We *agree* that a big diamond means commitment. It doesn't inherently reduce survival fitness like a heavy tail. It's enforced by social sanction (divorce is expensive, social shame), not biological impossibility.
          *   *Refutation:* Using biological handicap theory to justify cultural spending is a category error. It's indexical or conventional, not a physiological handicap.

      *   **Point 3: The Evolutionary Mismatch.**
          *   *Context:* Behavioral ecology applies to reproductive fitness over generations.
          *   *Application:* A wedding is a one-off cultural ritual, not a repeated evolutionary strategy. Signaling theory explains why we *have* impulses to signal, not why *this specific vendor package* is optimal.
          *   *Refutation:* Kevin is committing the Naturalistic Fallacy (is $\to$ ought). Even if it *is* signaling, that doesn't mean it's *rational* or *necessary* in a modern economic context.

  3.  **Drafting the Argument (Iterative Process):**

