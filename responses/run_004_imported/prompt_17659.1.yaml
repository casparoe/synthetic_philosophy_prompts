      *   **Patch 2: Overtaking/Catching-Up Criteria (Partial Sums).**
          *   *Idea:* Compare $\sum_{i=1}^n a_i$ and $\sum_{i=1}^n b_i$ as $n \to \infty$. If $B$'s partial sums eventually exceed and stay above $A$'s, $B$ is better.
