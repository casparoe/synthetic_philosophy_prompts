  3.  **Explaining the Specific Problem for Aggregative Views:**
      *   Why isn't this just "math is hard"?
      *   Because the *ethical axiom* of Pareto is being violated by the *ethical axiom* of Aggregation (Summation).
      *   In finite cases, TU satisfies Pareto. If $\sum b_i > \sum a_i$, then $B$ is better. If everyone is better off, the sum is strictly higher.
      *   In infinite cases, the aggregation rule (summing) loses the sensitivity to local improvements once the total hits infinity.
      *   The conflict is between two core commitments of the theory: "Better for someone is better overall" (Pareto) vs. "Value is the sum of parts" (Aggregation). The infinity exposes a structural incompatibility within the theory itself, not just a calculation error.

