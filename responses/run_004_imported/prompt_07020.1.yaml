  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Mara):** ADHD is just the low end of a normal distribution. No biological line. "Disorder" is a values call.
          *   *Philosophical Category:* Continuity argument / Social Constructivism.
          *   *Strengths:* Biologically, many traits are polygenic and continuous. Cutoffs *are* often statistical.
          *   *Weaknesses:* "Continuous" doesn't mean "not real." Color is a spectrum, but red is distinct from green in effect.
