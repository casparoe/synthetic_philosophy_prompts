      *   **Context:** She's been researching ADHD extensively ("low-key obsessed"). She had a dinner conversation where two friends (Mara and Dev) debated the ontological status of ADHD (real disorder vs. social construct/normal variation).
      *   **Task:** Analyze the four specific moves (1-4) made in the debate. For *each* move, determine who comes out ahead, if it's a wash, and why. *Then*, identify what both are missing that would advance the debate.
