      *   **Move 2 (Dev):** Continuity doesn't matter. Hypertension is continuous too. What matters is harmful outcomes (accidents, job loss).
          *   *Philosophical Category:* Naturalism / Harm-based definition (Wakefield's Harmful Dysfunction is lurking here).
          *   *Strengths:* Pragmatic. Aligns with how medicine treats other continuous variables (BP, cholesterol). Focuses on functional impairment.
          *   *Weaknesses:* Assumes "harm" is objective without defining the baseline.
          *   *Verdict:* Dev wins on medical precedent. The "continuity" objection doesn't disqualify a condition.

      *   **Move 3 (Mara):** "Harm" is relative to social context (office work vs. foraging/artist). It's contingent on modern society.
          *   *Philosophical Category:* Normativism / Social Model of Disability.
          *   *Strengths:* Very strong point regarding *mismatch*. ADHD traits can be advantageous in certain contexts (novelty seeking, hyperfocus).
          *   *Weaknesses:* Can overreach. Some harms are universal (safety).
          *   *Verdict:* Mara wins on the *source* of the impairment. It highlights the environment's role.

      *   **Move 4 (Dev):** All disease is relative to goals (living). Some harms are universal (losing a kid, not eating).
