          *   *Dysfunction:* Failure of a mechanism to perform its evolved function (Naturalist).
          *   *Harm:* Negative evaluation by social standards (Normativist).
      *   *Neurodiversity Paradigm:* ADHD isn't a defect, but a difference that becomes disabling in a non-accommodating environment.
      *   *The "Missing" Piece:* They are treating "Disorder" as a binary switch (Real vs. Fake). It's better viewed as an *interaction* between brain and environment.
