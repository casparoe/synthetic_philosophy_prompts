  **Norm-based accounts:** This approach excels because it defines causation through deviations from expected norms, allowing the coworker's 👍 reaction to establish a specific duty that distinguishes their omission from others.

  **Contrastive accounts:** By framing the causal question relative to specific alternatives, this account can pragmatically highlight the coworker's role, though it relies more on contextual framing than explicit obligation.

  **Counterfactual-dependence accounts:** Pure counterfactual dependence treats all necessary conditions equally, making it difficult to distinguish the coworker's inaction from the inaction of everyone else who could have intervened.

  **Physical-process accounts:** This framework struggles most because omissions lack a physical connection or energy transfer, often leading physicalists to deny that inactions can be causes at all.
