answer: |-
  **Scene:** *The seminar room, late afternoon. The lights are humming. On the table lies a paint sample strip, gradient from red to orange. Both are staring at chip #50.*

  **Rosanna (Supervaluationist):** It's indeterminate. Look at it. It's not red, it's not not-red. It's in the penumbra.

  **Tim (Epistemicist):** It's red. Or it isn't. Bivalence holds. You're conflating truth with knowability.

  **Rosanna:** I'm not conflating anything. I'm telling you there's no fact of the matter. And don't give me the classic supervaluationist line about admissible sharpenings yet, because I know the objection. I'm pushing it. Even if we say #50 is true on all admissible precisifications, you still have to draw a line around "admissible." Where does the set of admissible sharpenings stop? That boundary is vague too. You've just relocated the vagueness up a level. Higher-order vagueness isn't a bug; it's the feature. You can't precisify your way out of it.

  **Tim:** You're treating vagueness like a semantic defect. It's not. It's epistemic. There is a sharp cutoff between red and not-red. There always is. The reason you can't find the boundary of "admissible sharpenings" is the same reason you can't find the boundary of "red": margin for error.

  **Rosanna:** So you're saying I just don't know where the line is?

  **Tim:** Exactly. Knowledge requires safety. If you believe chip #50 is red, but you could easily have been looking at #51—which is identical to the eye—and believed that was red too, you aren't safe. You're too close to the edge. The cutoff exists, metaphysically, but our cognitive faculties can't latch onto it without risking error. So we remain ignorant. The vagueness is just ignorance.

  **Rosanna:** But that makes meaning magical, Tim. If the cutoff exists, what fixes it? It's not our use—we'd accept #51 as red just as easily. It's not the physics of the chip. So what semantic fact determines that #50 is the last red one and #51 is the first orange one? You're positing a truth that is completely detached from any evidence, any use, any competence we have with the word.

  **Tim:** Meaning isn't just use. It's reference. And reference can outrun our grasp.

  **Rosanna:** Here's the comeback, then. If the truth is entirely disconnected from our epistemic access, why think the word "red" refers to *that* sharp property rather than the vague one we actually navigate? Epistemicism says we mean something sharp but are systematically mistaken about our own competence. Supervaluationism says we mean exactly what we use—rules that don't determine a truth value here. You save bivalence, but you lose the speaker. I keep the speaker, and I just let classical logic handle the validity while rejecting bivalence for the borderline cases. You're buying a sharp boundary at the cost of making communication a miracle.

  **Tim:** And you're buying a coherent semantics at the cost of reality. But look at #50. It's not hovering. It's sitting there.

  **Rosanna:** Exactly. And it's refusing to tell us which box you want to put it in.

  *They both stare at the chip. Neither reaches for the next one.*
