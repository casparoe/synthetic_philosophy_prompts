answer: |-
  This is one of the sharpest questions in climate economics, and your frustration is warranted. The reason your economist friend hand-waved is likely because, in a spreadsheet, the two components of the discount rate are additive—they look identical in the final calculation. But morally and mechanically, they are doing fundamentally different work.

  Here is the verdict: **They are not the same thing.** Pure time preference is an ethical claim about *who counts*; growth-based discounting is a technical claim about *what money buys*.

  If you treat them as the same, you miss the most critical leverage point in the entire climate debate. Here is the breakdown you need for your feature.

  ### 1. The Blueprint: The Ramsey Equation
  To understand the distinction, you have to look at the engine under the hood. Almost all modern discounting comes from Frank Ramsey's 1928 formula, which determines the social discount rate ($r$). It looks like this:

  $$r = \delta + (\eta \times g)$$

  *   **$r$**: The Social Discount Rate (the number used to shrink future damages).
  *   **$\delta$ (Delta)**: **Pure Time Preference.** This is the "impatience" parameter.
  *   **$\eta$ (Eta)**: **Elasticity of Marginal Utility.** This measures how much less we value an extra dollar as we get richer (aversion to inequality).
  *   **$g$**: **Growth Rate.** How much richer we expect future generations to be.

  Your friend is right that these are "worlds apart," but the reason requires separating **welfare** from **consumption**.

  ### 2. Pure Time Preference ($\delta$): The Ethical Claim
  This is the parameter Stern set near zero and Nordhaus set higher (often implicitly, by using market interest rates).

  **What it says:** "A unit of welfare (happiness/wellbeing) experienced in 2075 is intrinsically worth less than the same unit of welfare experienced in 2025, simply because it happens later."

  **Why philosophers hate it:** Ramsey called it "ethically indefensible" because it is a form of discrimination based on date of birth. If you believe all humans have equal moral worth, my grandson's suffering should count exactly as much as my suffering, regardless of when it occurs. To discount it purely because of time is to say, "I matter more than him because I am here now."

  **The Verdict on $\delta$:** This is **discrimination.** It is a moral assertion that the present generation owns the future, rather than holding it in trust. When Nordhaus argues for higher discount rates based on observed market behavior, critics argue he is committing the "is-ought fallacy": just because financial markets *are* impatient (due to risk, short election cycles, mortality) doesn't mean society *ought* to be impatient with its own grandchildren.

  ### 3. Growth-Based Discounting ($\eta \times g$): The Technical Claim
  This is the part your friend says is "ordinary diminishing-marginal-utility reasoning."

  **What it says:** "We expect future people to be richer than us. Because of diminishing marginal utility, an extra \$1,000 means less to a rich person than a poor person. Therefore, we should not sacrifice too much wealth *now* (when we are relatively poorer) to save wealth for *them* (when they will be relatively richer)."

  **Why philosophers shrug at it:** This isn't discounting *welfare*; it's discounting *dollars*. It assumes that a dollar is just a tool to buy welfare. If future people are billionaires, sending them a check for climate damages is less efficient than using that money to fix poverty today. It treats generations as equals, but acknowledges they are in different economic circumstances.

  **The Verdict on $\eta \times g$:** This is **arbitrage.** It is not saying future lives matter less; it is saying future *dollars* buy less happiness.

  ### 4. The Smoking Gun: The "Future Poor" Test
  Here is the definitive proof that these two are not the same thing, and the point that should anchor your article.

  If growth-based discounting were just pure time preference in a lab coat, they would react the same way to new information. **They don't.**

  *   **Scenario:** New climate models show that unchecked warming will actually make the future *poorer* than the present (negative growth, $g < 0$).
  *   **Pure Time Preference ($\delta$):** Doesn't care. It discounts the future simply because it is the future. The rate stays positive.
  *   **Growth Discounting ($\eta \times g$):** **Flips sign.** If the future is poorer, the marginal utility of money for them is *higher* than for us. The math suddenly demands we invest *more* aggressively now, not less. The discount rate can effectively become negative.

  This is the critical distinction. Pure time preference is a one-way ratchet against the future. Growth discounting is a two-way scale that responds to the relative wealth of generations.

  Stern's review assumed low growth in the "business as usual" scenario (due to climate damage), which, combined with a near-zero $\delta$, created a massive urgency to act. Nordhaus criticized Stern for assuming low growth, but also for setting $\delta$ too low. Nordhaus's models generally assume robust future growth ($g$ is high), which justifies spending less now.

  ### 5. Why the Confusion Persists (The "Lab Coat" Accusation)
  You asked if the growth-based one is just pure time preference wearing a lab coat. In practice, **often yes, but not in theory.**

  Here is where your economist friend might be glossing over the politics:
  Market interest rates (which Nordhaus often leans on) are a "black box." They contain *both* pure time preference (human impatience) *and* expected growth. When an economist says, "We should use a 5% discount rate because that's the market return," they are smuggling an ethical choice ($\delta$) inside a technical observation ($r$).

  They are saying, "Because humans *are* impatient in the market, we *should* be impatient with climate policy." That is using growth/consumption logic to hide pure time preference.

  ### The Verdict for Your Feature
  There is a real, principled case for treating them differently.

  1.  **Pure Time Preference** is a moral parameter. It answers: *Do we owe the future equality?* Setting it to zero is the only position consistent with universal human rights across time.
  2.  **Growth Discounting** is an empirical parameter. It answers: *Will they be richer than us?* This should be determined by climate models and economic forecasts, not ethical fiat.

  **The punchline:** The fight over the Social Cost of Carbon isn't just about math; it's about whether we treat the discount rate as a description of how financial markets behave (Nordhaus) or a prescription for how moral agents ought to behave (Stern).

  If you assume the future is rich, growth discounting tells you to spend less now. If you assume climate change makes the future poor, growth discounting tells you to spend *more* now. Pure time preference *only* ever tells you to spend less.

  Your friend is right that they are distinct, but you are right to be suspicious. In the hands of policy-makers, the technical argument about "future wealth" is frequently used as a shield to protect the ethical argument of "present impatience." The growth argument is valid only if you genuinely believe the future will be richer. If your climate model says otherwise, the growth argument collapses, leaving only the pure time preference—and that's where the moral fight actually lives.
