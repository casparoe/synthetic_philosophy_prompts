      *   **Expertise Objection:** Should we trust professional philosophers' intuitions over laypeople's? (The "expertise defense").
      *   **Semantics vs. Pragmatics:** Maybe the Hong Kong students aren't reporting on *semantic reference* (what the word literally means) but on *speaker's reference* (who the speaker is talking about in a moral/social context).
      *   **Universalism vs. Relativism:** Even if intuitions vary, does that mean *truth* varies? Or does it mean one group is mistaken? (Analogy: Physics intuitions vary, but gravity doesn't).
      *   **Kripke's Actual Argument:** Kripke's argument isn't *just* "What do you intuit?" It's about modal logic, rigid designators, and the failure of descriptions to fix reference across possible worlds. The Gödel case is an illustration, not the whole proof.

