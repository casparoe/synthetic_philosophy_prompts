      *   *Tomas:* "What about the luck of having a calm temperament? Constitutive luck."
      *   *Elena:* "Okay, but we can still judge the effort."
      *   *Tomas:* "Effort is also luck. Gauguin. If he trips on the boat, he's a villain. If he paints masterpieces, he's a genius."
      *   *Elena:* "So morality is just success?"
      *   *Tomas:* "Morality is embedded in the world."
      *   *Elena:* "Then we have no ground to stand on."
      *   *Tomas:* "Maybe we don't. Maybe that's the truth."
