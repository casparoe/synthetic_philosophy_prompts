answer: |-
  **Setting:** *The Grind, a noisy coffee shop just off campus. It is 5:30 PM on a Thursday. The air smells of roasted beans and wet wool. Elena and Tomas, both associate professors of philosophy, are huddled at a small round table littered with empty cups and napkins scribbled with arguments. They have just come from a department colloquium on Moral Luck.*

  **Elena:** (Stirring a cold cappuccino) I still think the audience missed the forest for the trees. The Control Principle isn't a description of how we *do* judge; it's a constraint on how we *ought* to judge. If morality is to be rational, it cannot be a lottery.

  **Tomas:** (Leaning back, arms crossed) But that's just it, Elena. You're treating morality like a geometry problem. "If P, then Q." But moral life isn't done in a vacuum chamber. It's done in the mud. And in the mud, luck is the primary ingredient.

  **Elena:** Luck is the *context*, not the *content* of the action. Look, if I intend to save a drowning child, and I succeed, I'm praiseworthy. If I try exactly the same thing, with the same skill and will, but a sudden undertow pulls the child under anyway, I am not *less* virtuous. The world interfered. To blame me for the undertow is to blame me for the weather.

  **Tomas:** Okay, but let's take Nagel's drivers. You know the case. Two fathers, both had too much to drink at the party. Both decide to drive home. Both are equally reckless, equally negligent in their decision-making. Driver A gets home safely. Driver B, through no additional fault of his own, has a child run into the road at the exact moment he passes. The child dies.

  **Elena:** And we want to put Driver B in prison and Driver A just gets a ticket. That's the injustice I'm talking about.

  **Tomas:** Is it? Driver B is a killer. Driver A is not. That's not just a legal distinction; it's an ontological one. Driver B has a death on his hands. He has to look at the parents. He has to live with a specific history that Driver A does not. If you tell me their moral standing is identical, you're asking me to ignore the actual texture of their lives.

  **Elena:** I'm asking you to distinguish between *moral worth* and *causal outcome*. Yes, Driver B has a tragedy to manage. He might feel what Williams calls "agent-regret." He might feel a special sting that a bystander wouldn't. But that's psychological. Normatively? Their wills were identical. They both willed the risk. To say B is *worse* than A is to say the universe is a moral agent that punishes randomness.

  **Tomas:** (Taps his finger on the table) But the will isn't a ghost in the machine, Elena. It's embodied. This is where Nagel gets you with constitutive luck. You say, "Judge the will." Fine. Where does the will come from? Driver B's capacity for caution, his impulse control, even his susceptibility to peer pressure at the party—those are temperamental. They are largely genetic, largely environmental.

  **Elena:** We can't be responsible for our genes, no. But we are responsible for how we manage them.

  **Tomas:** Manage them how? With what? You need a "will" to manage the temperament, but that will is *also* constituted by luck. It's luck all the way down. If you peel away the circumstantial luck (the child running out), and the constitutive luck (the temperament that allowed the drinking), and the resultant luck (the death)... there's no "agent" left to praise or blame. You've purified responsibility out of existence.

  **Elena:** (Pauses, looking into her cup) That's the *reductio*, Tomas. I know it. If you push the luck argument hard enough, determinism wins and everyone goes home. But I refuse to believe that the intuition of control is *just* an illusion. There has to be a stopping point.

  **Tomas:** Where?

  **Elena:** At the moment of endorsement. I can't control my temper, maybe. But I can, in a reflective moment, endorse or reject acting on it.

  **Tomas:** Williams would laugh at that. Think about Gauguin. He abandons his family to paint in Tahiti. On your view, we judge his will at the moment he buys the ticket. He wills the abandonment. He's a monster.

  **Elena:** He is.

  **Tomas:** But Williams says we can't judge him yet. If Gauguin fails—if he paints mediocrity and dies in poverty—he is a monster. If he succeeds, if he becomes one of the greatest artists in history, his action is... justified. Not excused, *justified*. The moral quality of the act depends on a success he couldn't guarantee. That's moral luck in its purest form. The outcome retroactively changes the moral status of the will.

  **Elena:** That terrifies me. It makes morality consequentialist. It means I can do the right thing, with the right heart, and if the world twists it, I'm damned.

  **Tomas:** Or, it means morality isn't about having a "right heart" in a vacuum. It's about engaging with the world and accepting that the world gets a vote. Gauguin's success doesn't change his *past* will, but it changes the *meaning* of that will. It turns a betrayal into a sacrifice.

  **Elena:** (Shakes her head) No. That's aestheticizing ethics. It's saying "might makes right" or "success makes right." If I defend the Control Principle, I'm not saying luck doesn't exist. I'm saying morality is the *resistance* to luck. It's the one sphere where we claim sovereignty. If I concede Gauguin is justified by success, then I have to tell the driver who hit the child, "Well, you're just unlucky." But I also have to tell the driver who didn't, "You got off scot-free, but you're just as guilty."

  **Tomas:** And that second part is the problem. Can you really look Driver A in the eye and say, "You are morally identical to a child-killer"?

  **Elena:** (Sighs) I... I think I have to say, "You are identical in *culpability*, though not in *consequence*."

  **Tomas:** But culpability without consequence is a ghost. It has no weight.

  **Elena:** Maybe that's the point! Maybe the weight we feel—the horror of Driver B—is partly non-moral. It's tragic, yes. But if we conflate the tragedy with the guilt, we lose the ability to forgive. If Driver B is objectively worse than Driver A, forgiveness is harder. If they are equal in fault, but B suffers more, then our duty to B is compassion, not just retribution.

  **Tomas:** (Nods slowly) So you're retreating. You're admitting the Control Principle doesn't describe our actual judgments, but it's a... what? A regulatory fiction?

  **Elena:** A necessary ideal. Like a horizon. We can never reach it—we are always embedded in luck, always subject to constitutive forces we didn't choose. But if we stop walking toward it, if we stop insisting that *only* the will matters, then blame becomes just a record of who suffered bad outcomes. And that's primitive. That's pre-moral.

  **Tomas:** I can accept that. With a caveat.

  **Elena:** Which is?

  **Tomas:** That acknowledging the luck doesn't dissolve responsibility, it just makes it heavier. If Gauguin knows his justification depends on luck, he shouldn't paint with a light heart. He should paint with the terror of knowing he might be a villain. The uncertainty *is* the moral burden.

  **Elena:** So you're saying the anxiety of luck is part of the moral experience?

  **Tomas:** Exactly. You want to purify the will to make it safe from luck. I'm saying the vulnerability to luck is what makes the will moral in the first place. If Gauguin was guaranteed success, it wouldn't be a risk. It would be a calculation.

  **Elena:** (Smiles faintly) So, I defend the Control Principle as a shield against arbitrariness, even if I can't fully wield it. And you defend moral luck as the ground of genuine risk, even if it makes judgment messy.

  **Tomas:** And neither of us can drive home without worrying about the pedestrian.

  **Elena:** (Gathers her coat) Especially you, Tomas. You're the one who had two beers at the colloquium reception.

  **Tomas:** (Laughs, standing up) See? Resultant luck. If I get pulled over, I'm a criminal. If I don't, I'm just a philosopher. Same will, same beer.

  **Elena:** Just take the bus, Tomas. Don't test the universe.

  **Tomas:** Walk with me to the stop?

  **Elena:** Only if you promise not to talk about Gauguin.

  **Tomas:** No promises. But I'll watch for the traffic.

  *They leave the coffee shop, stepping out into the cool evening air, the argument unresolved but the terms of the disagreement now clearly mapped between them.*
