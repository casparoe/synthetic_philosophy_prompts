  10. (Drafting the response based on these points...) *Self-Correction during drafting:* Make sure not to sound like I'm scolding the user. This was a bold move. Respect the commitment while analyzing the outcome. Emphasize that the brother is actually being a *good* friend/brother by not saving them, even though it hurts.

