      *   *The "Burn" aspect:* Burning cash is illegal in some jurisdictions (defacing currency), but usually tolerated if not done for fraud. Worth a quick mental note, but probably not the main issue. *Correction:* In the US, 18 U.S.C. § 333 makes mutilating currency with intent to render it unfit for reissue illegal. It's rarely enforced for small amounts, but technically illegal. I should mention this as a side note or a way out (donate instead).
      *   *Actually, focus on the psychological contract.* The legality is secondary to the personal dilemma.

  9.  **Final Structure:**
