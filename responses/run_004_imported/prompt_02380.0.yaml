      *   *What does it actually say?* For a rational agent maximizing expected utility, the expected value of free information is non-negative.
      *   *Key Assumptions:*
          1.  The agent is a perfect expected utility maximizer.
          2.  The utility function is defined over *outcomes*, not *states of knowledge*.
          3.  The information is costless (free).
