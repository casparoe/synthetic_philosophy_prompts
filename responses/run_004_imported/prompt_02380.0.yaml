answer: |-
  You have hit on one of the most subtle and frequently overlooked limitations of standard decision theory. You are not misapplying the math, but you are running headfirst into the implicit assumptions baked into Good's Theorem that rarely get stated in the pop-rationalist summary.

  The short answer is: **Good's Theorem assumes your utility function is defined over *world states*, not *belief states*.**

  When you enjoy suspense, surprise, or the emotional arc of uncertainty, your utility function depends on what you *know* (or don't know), not just on what *is*. In those specific contexts, information has negative marginal utility, and Good's Theorem does not apply.

  Here is the breakdown of why this happens, how it relates to information hazards, and how to adjust that "LW-coded intuition."

  ### 1. The Technical Gap: Outcome vs. Experience
  Good's Theorem (1967) proves that for a Bayesian expected-utility maximizer, the expected value of free information is non-negative. The logic is: *Information allows you to map actions to states of the world more accurately. At worst, you ignore the info and do what you would have done anyway.*

  But this proof relies on a specific formulation of the utility function:
  $$U = f(\text{Action}, \text{World State})$$

  It assumes you only care about who actually wins the election, who wins the game, or how the movie ends. It assumes the *process of finding out* is neutral.

  Your experience reveals your actual utility function looks more like this:
  $$U = f(\text{Action}, \text{World State}, \text{Belief State})$$

  You derive utility from **anticipation** and **surprise**.
  *   **Without the forecast:** You watch the returns roll in. Your belief state is high-uncertainty. Your utility includes the thrill of suspense.
  *   **With the forecast:** You watch the returns roll in. Your belief state is near-certainty. The suspense is gone. The "experience" outcome is degraded.

  In this case, the information *did* change the outcome of your action ("watching TV"), even if it didn't change the action itself. It turned "watching a thriller" into "watching a documentary." Good's Theorem doesn't account for the utility value of ignorance itself.

  ### 2. Is this the "Information Hazard" gap?
  **Yes.** This is exactly the gap that discussions on information hazards (most notably Nick Bostrom's taxonomy) are gesturing at, though often people focus on the "dangerous knowledge" aspect (e.g., knowing how to build a virus).

  Bostrom classifies information hazards into several types. Your example falls under **"Direct Harm"** or **"Preference Frustration."**
  *   **Instrumental Hazards:** Info that leads you to take a harmful action (Good's Theorem mostly covers this; if the action is harmful, the utility calculation should reflect that).
  *   **Intrinsic Hazards:** Info that is harmful *simply by being known*.

  The "LW intuition" that "a rationalist should always want more evidence" is a heuristic optimized for **instrumental rationality** (winning/making good decisions). It is often actively hostile to **experiential rationality** (happiness/enjoyment).

  When the LessWrong community talks about information hazards, they are usually acknowledging that the "truth is always good" axiom is false when the agent's utility function is sensitive to the knowledge itself.

  ### 3. The "Free" in Free Evidence
  There is a second way to look at this where Good's Theorem *technically* holds, but your application of "free" was wrong.

  Good's Theorem requires the evidence to be **costless**.
  *   **Monetary cost:** $0.
  *   **Psychological cost:** Negative utility.

  If you *know* beforehand that seeing a 97% forecast will ruin your night, then the information is not free. It has a psychological cost attached to acquisition. A perfect expected-utility maximizer who knows they are susceptible to "spoiler depression" would assign a negative expected value to looking at the forecast *before looking at it*.

  The failure wasn't in the theorem; it was in your **ex-ante** calculation.
  *   **Ex-ante (Before looking):** A rational agent who values suspense should pay to *avoid* the forecast.
  *   **Ex-post (After looking):** You feel bad.

  The "mistake" you mentioned ("I made the mistake of glancing") is the key. A perfect Bayesian who values suspense would have precommitted to ignorance. The fact that you looked suggests a time-inconsistency in your preferences (hyperbolic discounting), where the immediate curiosity overrode the known future cost to your enjoyment.

  ### 4. Implications for the "Always Update" Heuristic
  The intuition that "a good Bayesian always wants more evidence" is a powerful tool for epistemic hygiene and decision making, but it needs a scope condition.

  **Where it applies:**
  *   Strategic decisions (career, investments, policy).
  *   Truth-seeking where the emotional cost of the truth is negligible compared to the benefit of accuracy.
  *   Situations where ignorance creates risk (e.g., not knowing a bridge is out).

  **Where it fails:**
  *   **Entertainment:** Movies, sports, fiction.
  *   **Existential/Mental Health:** Certain philosophical truths or statistical realities that cause paralysis or depression without enabling actionable change (e.g., precise heat-death of the universe timelines).
  *   **Social Dynamics:** Sometimes not knowing a slight was intentional preserves a relationship better than knowing.

  ### 5. How to weigh this intuition going forward
  You should retain the Bayesian intuition for **map-making**, but decouple it from **territory-enjoyment**.

  1.  **Distinguish Decision-Value from Experience-Value:** Ask yourself: "Am I seeking this information to *act*, or to *feel*?" If it's to feel, Good's Theorem is irrelevant.
  2.  **Precommitment is Rational:** It is perfectly rational to bind yourself to ignorance. Avoiding spoilers, hiding election forecasts, or refusing to check stock prices daily are not failures of rationality; they are optimizations for a utility function that values peace of mind or suspense.
  3.  **Recognize the Hazard:** When you feel that deflation, recognize it as a real cost. Don't gaslight yourself with "Well, technically the information value was non-negative." The utility loss was real.

  **Summary:** Good's Theorem is rock-solid math for agents who only care about the final state of the world. You are an agent who cares about the *trajectory* of your beliefs. That makes you human, not irrational. The "information hazard" concept exists precisely to patch this hole in standard decision theory. You are allowed to value ignorance.
