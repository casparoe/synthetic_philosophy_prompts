      *   *Information Hazards:* Connect this to Bostrom's taxonomy. This is a "self-harming" information hazard or a preference frustration. It's not about the info enabling a bad act, but the info *being* the bad act (psychologically).
      *   *LW Intuition Check:* The "Bayesian always wants evidence" heuristic is for *truth-seeking* and *decision-making*. It is not a universal law of *happiness*.
