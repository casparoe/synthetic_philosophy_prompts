answer: |-
  This is one of the most potent questions in moral philosophy, and it is excellent fuel for a novel. You have stumbled upon a concept philosophers call **Moral Luck**, specifically *resultant luck* (luck in the way one's actions turn out).

  To give you the clear-headed answer you need for your book and your own peace of mind: **From a strict ethical standpoint, your brother-in-law and his partner were equally culpable the moment they decided to drive.** The outcome changes the legal and social consequences, but it does not change the moral quality of the choice they made.

  Here is a breakdown of why this distinction exists, how different frameworks view it, and how you can use this tension to sharpen the ethical spine of your novel.

  ### 1. The Ethical Verdict: Culpability lies in the Risk
  In ethics, culpability is generally tied to **agency** and **foreseeability**, not just results.

  *   **The Choice:** Both men consumed alcohol. Both men assessed their fitness to drive. Both men concluded they were fine. Both men chose to operate a two-ton vehicle while impaired.
  *   **The Risk:** By driving, they both imposed a non-consensual risk of death or injury upon the public.
  *   **The Moral Weight:** The immorality lies in the willingness to gamble with other people's lives for one's own convenience. Since both men made that same wager, the moral debt incurred at the moment of ignition was identical.

  If morality were based solely on outcomes, we would have to say that a person who shoots at someone and misses is "less evil" than a person who shoots and hits, even if their intent and actions were identical. Most ethical systems (Kantian deontology, for instance) argue that the *will* to do wrong is where the sin resides, not the accident of physics that follows.

  **For your novel:** The "lucky" character is living a lie if they believe their safety proves their righteousness. Their safety is data, not absolution.

  ### 2. The Legal & Social Verdict: Consequences Matter
  If ethics says they are equal, why does the world treat them differently?

  *   **The Law:** The legal system is utilitarian and practical. It generally requires *harm* to justify severe punishment (like incarceration for manslaughter). While there are laws against DUI, the charge of "killing a person" requires a corpse. The law punishes the *result* because it is tasked with maintaining order and providing restitution to victims, not just judging souls.
  *   **Society:** Humans suffer from **Outcome Bias**. We judge the quality of a decision based on its outcome rather than the quality of the decision at the time it was made.
      *   The partner is labeled a "killer" because he provides a tangible target for the community's grief and anger.
      *   Your brother-in-law is "lucky" because he allows the community to maintain the illusion that bad things only happen to bad people. If your brother-in-law is judged as harshly as the partner, the community has to admit that *any* of them could be a killer due to one bad decision and a splash of bad luck. That is too terrifying to accept.

  **For your novel:** The community's treatment of the "unlucky" partner is likely a form of scapegoating. By demonizing him completely, they purge the guilt from the group. Your brother-in-law benefits from this purge, which may explain why he minimizes the event as "a scare." He is complicit in the silence that protects him.

  ### 3. The Psychological Reality: The "Near Miss"
  Your brother-in-law calls it "a scare." This is a psychological defense mechanism.

  When we escape negative consequences, our brains tend to rewrite the narrative to suggest we were in less danger than we actually were. This is known as **Normalcy Bias**. He likely tells himself, "I drove carefully," or "The roads were empty," to reconcile his self-image as a "thoughtful, careful man" with the reckless act he committed.

  The partner, however, has no such buffer. The reality of the death forces a total collapse of his self-image.

  **For your novel:** The most dramatic tension lies here. The "lucky" character is likely more deluded than the "guilty" one. The "guilty" one knows exactly what he did; the "lucky" one is actively constructing a fantasy to avoid knowing it.

  ### 4. Nuance for the Storyteller
  To make this hold up to scrutiny in your novel, avoid making it a simple "they are the same" equation. Real life is messy. Consider these nuances:

  *   **The Aftermath:** While the *decision* was equally culpable, the *response* to the aftermath creates new moral divergences. Does the partner show genuine remorse? Does the brother-in-law show arrogance? Or does the partner become so crushed by guilt he becomes useless, while the brother-in-law channels his "scare" into becoming an advocate against drunk driving? The outcome changes who they *become*, even if the starting sin was the same.
  *   **The Victim:** Never lose sight of the jogger. In the "moral luck" debate, the victim is often abstracted. In your novel, the victim's absence should haunt the "lucky" character's storyline. The fact that *no one* died in his timeline is a ghost that should follow him.
  *   **The "What If":** The most painful question for the brother-in-law (and your character) shouldn't be "Did I break the law?" It should be "If a child had run out instead of a jogger, would I be in prison right now?" The potentiality is the guilt.

  ### Summary for Your Drafting
  To answer your specific question: **Yes, they were equally culpable the moment they got into their cars.** The outcome changes the *legal liability* and the *social stigma*, but it does not wash away the *moral risk* they imposed on the world.

  For your novel, the ethical spine holds up if you frame it this way:
  **Justice is about what you do. Fate is about what happens to you. Tragedy is when the two do not match.**

  Your brother-in-law's inability to see this is not just a character flaw; it is a very human inability to stare into the abyss of randomness. If your fictional counterpart can eventually recognize that his safety was luck, not virtue, that is where his redemption arc lies. If he never recognizes it, he is a tragedy waiting to happen again.
