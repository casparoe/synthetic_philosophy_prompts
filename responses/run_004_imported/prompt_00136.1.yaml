  2.  **Deconstruct the Ethical Problem:**
      *   This is a classic problem in moral philosophy: *Moral Luck*.
      *   Specifically, *Resultant Luck* (luck in the way one's actions turn out).
      *   Key tension: *Intent/Action* vs. *Outcome/Consequence*.
      *   Legal vs. Moral culpability.

  3.  **Initial Assessment & Stance:**
