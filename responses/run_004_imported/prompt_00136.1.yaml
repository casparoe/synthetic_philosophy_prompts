      *   *Psychological/Social Reality:* Humans judge based on outcomes (hindsight bias, outcome bias).
      *   *Conclusion for the Novelist:* The tension is real. The *moral* guilt is likely equal; the *social/legal* guilt is unequal. This discrepancy is fertile ground for drama.

  4.  **Drafting the Response - Section by Section:**

