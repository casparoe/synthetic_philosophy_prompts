          *   **Q2:** Offer specific lines of defense.
              *   *Distinction between Existence and Intensity:* Evo Psych says the *capacity* is innate; Russell says the *intensity* is cultural.
              *   *Is/Ought:* Even if natural, is it desirable?
              *   *The Property Link:* Russell links jealousy to ownership. Evo Psych links it to reproduction. Show where they overlap (paternity certainty = inheritance).
          *   **Q3:** Validate the topic. It's not tired if framed correctly. Suggest focusing on the "Naturalistic Fallacy" angle.
      *   *Refinement:* Make sure to mention that Russell's anthropology (Malinowski) has *also* been critiqued (Freeman vs. Mead style issues), so students should know the empirical ground is shaky on *both* sides (1920s anthro vs. 1990s evo psych).

  6.  **Self-Correction/Review during drafting:**
