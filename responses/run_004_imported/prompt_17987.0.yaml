      *   *Which explains exchange better?* Exchange requires *two* things: a reason to trade (difference/utility/need) and a ratio (price). Aristotle explains the *motivation* (need) and the *mechanism* (money/convention). Marx explains the *constraint* (production costs) but misses the *act* of exchange (which requires mutual benefit, not just equal labor input).

