      *   *Why?* Because Marx's "substance" (labor) is invisible and unmeasurable outside of exchange itself. You can't know the "socially necessary labor time" until the market speaks. Therefore, the market (need/convention) is primary. Aristotle admits this; Marx tries to hide it behind a metaphysical veil.
