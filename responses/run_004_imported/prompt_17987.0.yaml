  3.  **Address Part 1: Intellectual History (Marx on Aristotle):**
      *   *Is Marx retrofitting?* To some extent, yes. Aristotle isn't looking for a "substance of value" in the Ricardian/Marxian sense. He's looking for a condition of *justice* in exchange.
      *   *Is there a genuine limit?* Yes, but maybe not exactly the one Marx names. Aristotle explicitly says money is by convention (*nomos*), not nature (*physis*). He stops short of reifying value. Marx wants to reify value (as labor).
