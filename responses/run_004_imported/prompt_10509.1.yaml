answer: |-
  **Setting:** *A small, windowless conference room off the ICU. 2:15 PM. A whiteboard is covered in half-erased survival curves. Two charts sit on the table. The air conditioning hums loudly.*

  **Characters:**
  *   **Alex:** Senior Fellow in Welfare Economics. Committed Harsanyian.
  *   **Jordan:** Visiting Scholar in Moral Philosophy. Critic of strict aggregationism.

  **Alex:** (Tapping a pen against the chart for Patient B) The attending is waiting, Jordan. We've established the medical facts. The survival probability is identical for both. The quality-of-life adjustment is identical. If we give it to Mr. Henderson, total expected QALYs are $X$. If we give it to Ms. Gable, total expected QALYs are $X$. If we flip a coin, the mathematical expectation is still $X$.

  **Jordan:** And that's precisely why we flip the coin.

  **Alex:** Is it? From the perspective of the aggregation theorem, the committee is indifferent between the lottery and the deterministic assignment. The social welfare function is linear in individual expected utilities. If the sum is identical, the procedure is morally transparent. Why add the friction of a randomization device?

  **Jordan:** Because the theorem is missing the moral residue. Diamond's point wasn't just about the math; it was about the claim. Both patients have an equal claim to the resource. If I hand it to Henderson outright, I am effectively telling Gable her claim counted for nothing. If I flip a coin, I acknowledge that her claim was equal, even if luck goes against her. The coin toss isn't about maximizing the expectation; it's about the *ex-ante* distribution of hope.

  **Alex:** I understand the intuition. It feels nicer. But let's look at the machinery. You're treating "fairness" as an independent axiom that constrains the aggregation. Harsanyi shows that if we satisfy Pareto and vNM rationality, social welfare *must* be a weighted sum of individual utilities. If you prefer the coin toss, that preference must reside somewhere. Where is it?

  **Jordan:** It resides in the structure of the justification, not in the patients' heads.

  **Alex:** That's the divergence right there. If the preference isn't in the patients' utility functions, whose preference is it? Is it yours? Mine? If it's ours, we're imposing a paternalistic constraint on the aggregation. But if it *is* in the patients' utility functions—if Gable would feel aggrieved, diminished, or disrespected by a deterministic denial—then that disutility is already an argument in the equation.

  **Jordan:** So your move is to internalize the fairness concern? You're saying, "If Gable cares about having a fair chance, put that in $U_{Gable}$, and then maximize."

  **Alex:** Exactly. If Gable says, "I prefer a world where I had a 50% chance and lost over a world where I had a 0% chance and lost," then the expected utility of the lottery is higher than the deterministic assignment. The theorem handles it. We run the numbers, the lottery wins, and we toss the coin. No conflict.

  **Jordan:** But that's question-begging, Alex. You're saving the theorem by stretching the definition of "outcome" until it snaps. You're individuating outcomes by the *history* of how they were reached. An outcome isn't just "Gable dies"; it's "Gable dies *after being denied a chance*."

  **Alex:** Why is that a problem? Outcomes *are* historically individuated. If I promise you lunch and don't show up, the outcome isn't just "you're hungry." It's "you're hungry and I broke a promise." The utility function captures the value of the state of affairs. If fairness has value, it's because people value it.

  **Jordan:** But if you allow *any* preference about procedures to count as a welfare input, the Pareto condition loses its critical bite. Suppose I prefer the lottery because I think it's just, and you prefer the deterministic assignment because it's faster. If we just sum those preferences, we've reduced justice to a taste, like preferring chocolate over vanilla. Diamond's objection is that fairness is a *right-making feature*, not a preference-satisfaction feature.

  **Alex:** Wait. If it's not a preference-satisfaction feature, what is it? We are a hospital allocation committee. We are mandated to act in the patients' best interests. If the patients themselves were stoics—if they said, "I don't care about the coin, just save whoever you can"—would you still insist on the toss?

  **Jordan:** Yes. Because the claim exists independently of their attitude toward it.

  **Alex:** Then you aren't arguing about welfare anymore. You're arguing about deontological constraints. You're saying there is a duty to be fair that overrides the aggregation of well-being. That's a coherent position, but don't dress it up as a correction to Harsanyi. Harsanyi is a theorem about aggregating *preferences*. If you want to aggregate *rights*, you need a different function.

  **Jordan:** I'm not abandoning welfare. I'm saying your interpretation of welfare is too thin. When Harsanyi derives the linear form, he assumes the "individual utilities" are defined over final outcomes. But if the *process* of allocation affects the moral weight of the outcome, then the "individual utility" needs to reflect the *justice* of the position, not just the subjective satisfaction.

  **Alex:** But who measures the justice? You? Me? If we measure it, we're not aggregating *their* good anymore. We're aggregating *our* theory of the good. That violates the Paretian spirit of respecting individual sovereignty.

  **Jordan:** It violates the Paretian spirit only if you assume sovereignty applies only to consumption goods and health states. If I have a sovereign interest in being treated as an equal, that interest is part of my welfare. The problem is that your linear aggregation treats my interest in equality as fungible with your interest in survival. It allows my claim to be completely traded off if the sum remains constant.

  **Alex:** It doesn't trade it off if the preference is strong enough! That's my point. If the "interest in being treated as an equal" is strong, the math dictates the lottery. The only time there's a conflict is if the patients *don't* care about the procedure, but *you* do. In that case, admit it: you're prioritizing your aesthetic of fairness over their actual preferences.

  **Jordan:** (Pauses, looking at the clock) I'm not prioritizing my aesthetic. I'm prioritizing the *objective* value of the relationship between the institution and the claimant. Look, let's grant your internalization move. Say we put "fairness" into the utility function. Now the social welfare function is $W = aU_1 + bU_2$. But Diamond's point is about the *linearity*. Even with fairness preferences included, if the weights $a$ and $b$ are equal, and the utility gain from the "fair procedure" is symmetric, the SWF is still indifferent between a 50/50 lottery and a deterministic choice *if* the deterministic choice somehow yielded slightly higher medical efficacy.

  **Alex:** If the deterministic choice yields higher efficacy, Pareto demands we take it.

  **Jordan:** Even if it violates the equal claim?

  **Alex:** If the "equal claim" is just a preference for a lottery, and the "higher efficacy" is a preference for living, and the living preference outweighs the lottery preference, then yes. Pareto demands it. If you say "No, we must toss the coin even if the deterministic choice saves more lives," you are explicitly violating Pareto. You are saying society knows better than the individuals what they should value.

  **Jordan:** Or I'm saying that the "individual" in Harsanyi's theorem is the *ex-ante* agent, not the *ex-post* winner. The aggregation happens behind a veil of ignorance. Behind that veil, I don't know if I'm Henderson or Gable. If I'm behind the veil, I demand the coin toss to protect my *ex-ante* interest, regardless of the *ex-post* utility sum.

  **Alex:** But Harsanyi's veil leads to utilitarianism. That's the Aggregation Theorem. If you're behind the veil, you maximize average utility. If the coin toss lowers average utility (because it's slower, or causes anxiety), you drop the coin. If you keep the coin despite the cost, you're not maximizing expected utility anymore. You're maximizing something else. Call it "fairness." But don't tell me it's derived from the vNM axioms.

  **Jordan:** (Leans forward) Here's the crux. You think the disagreement is about how we specify the utility functions. You think if we specify them finely enough—include the procedural history, the ex-ante expectations, the symbolic value—the theorem will spit out the "fair" result.

  **Alex:** I think if we specify them accurately, the theorem will spit out the *right* result. Which might be the coin toss.

  **Jordan:** But I think the disagreement is deeper. It's about whether the "utility" in the theorem is allowed to track *moral facts* or only *psychological states*. If I say, "I am worse off in a world where I was treated unfairly, even if I don't know it and it doesn't hurt my feelings," am I stating a preference?

  **Alex:** You're stating a judgment.

  **Jordan:** A judgment about my own welfare!

  **Alex:** No. You're stating a judgment about the *rightness of the action*. Welfare is about how life goes *for you*. Rightness is about how the action relates to *principles*. You're conflating the two. Diamond wants to smuggle rightness into welfare so it gets counted in the sum. I'm saying keep them separate. If fairness matters, it matters as a constraint on the sum, not an input to it. And if it's a constraint, you've left welfarism.

  **Jordan:** And if I leave welfarism, I lose the objective grounding of the aggregation. I admit that. But if I stay within your welfarism, I lose the ability to say the coin toss is *required* when the patients are indifferent.

  **Alex:** (Sighs, closing the chart) If the patients are indifferent, Jordan, why is it required?

  **Jordan:** Because the hospital isn't just a utility pump. It's a moral agent. It owes equal respect.

  **Alex:** And I owe the patients the best outcome. If they don't care about the respect, and I impose it, I'm wasting resources on a ritual they didn't ask for.

  **Jordan:** We're circling. You think the "residual" I'm talking about is a technical error in outcome individuation. I think it's a substantive category error in your theory of value.

  **Alex:** I think it's a substantive category error to think "value" exists outside of what is good for someone.

  **Jordan:** (Stands up) So we can't decide this in five minutes.

  **Alex:** No. The question is: Do we authorize the attending to pick based on medical logistics, or do we mandate the lottery?

  **Jordan:** If we pick based on logistics, we validate the view that the claim is merely a demand for welfare.

  **Alex:** If we mandate the lottery, we validate the view that the claim is a demand for procedural status, potentially at the cost of welfare efficiency.

  **Jordan:** (Pauses at the door) Let's flip the coin. Not because the math demands it. But because until we solve the meta-ethics, the presumption of equality is the only heuristic that doesn't assume I'm right about welfare or you're right about aggregation.

  **Alex:** (Nods slowly) Agreed. But note in the minutes: this is a deviation from strict welfare maximization based on non-welfarist constraints.

  **Jordan:** And note: this is a provisional acceptance of the Harsanyian framework, pending resolution on whether "fairness" is a preference or a principle.

  **Alex:** Deal.

  *(Jordan exits. Alex picks up the coin, looks at it, and places it back on the table without flipping it yet.)*
