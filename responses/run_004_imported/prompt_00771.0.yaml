answer: |-
  This is a fascinating text to grapple with. You have correctly identified one of the most radical pieces of writing in the history of moral philosophy. Jeremy Bentham wrote this essay (titled *Offences Against One's Self: Paederasty*) around 1785, but as you noted, it was too dangerous to publish. It remained hidden until 1978.

  Your rough read is spot on: Bentham is arguing that the criminalization of homosexuality is not based on harm, but on **projected disgust.** He is attempting to dissect the psychology of the bigot before the word "psychology" really existed.

  Here is a step-by-step breakdown of the logic, followed by an evaluation of how his theory holds up today.

  ---

  ### Part 1: Unpacking Bentham's Logic

  #### 1. The James I Analogy (Anabaptists and Tobacco)
  You asked why he suddenly goes off about King James I. This is Bentham using a historical case study to prove that **law is often just codified personal preference.**

  *   **The Setup:** Bentham establishes that people often punish others simply because they personally dislike them ("antipathy").
  *   **The Anabaptists:** James I disliked this religious group because they disagreed with him on "speculative points" (theology). Because the political climate allowed it, he turned that dislike into lethal persecution (burning them).
  *   **The Tobacco:** James I *also* hated tobacco (he wrote *A Counterblaste to Tobacco*). But he couldn't burn people for smoking it. Why? Not because smoking was morally "better" than heresy, but because the social pretext wasn't there. So, he settled for writing an angry book.
  *   **The Point:** Bentham is arguing that the severity of the punishment matches the **intensity of the ruler's disgust**, not the actual harm caused by the act.
      *   If James I had the power to burn smokers, he would have.
      *   If the public feels a violent physical disgust toward gay sex, they demand violent punishment, regardless of whether harm occurred.
      *   It proves that the law is being driven by "taste" (I don't like this) rather than "utility" (This causes damage).

  #### 2. "Philosophical Pride" and the Moralists
  When Bentham writes about "Philosophical pride," he is targeting **ascetic moralists.**

  *   **Who are they?** In 1785, this primarily meant religious puritans, stoics, and traditional moral philosophers who believed that virtue requires the *denial* of the flesh. They viewed pleasure with suspicion.
  *   **The Logic of Pride:** Bentham argues that these moralists derive a sense of superiority ("pride") from denying themselves pleasure. They believe they are "better" because they suffer or restrain themselves.
  *   **The Envy:** This is the psychological kicker. If I have denied myself pleasure to be "virtuous," seeing *you* enjoy pleasure without guilt threatens my self-image. It makes my sacrifice feel pointless. Therefore, I become envious. I need to punish you to validate my own suffering.
  *   **The Result:** This creates a class of people who are "a-quarrelling with whatever is pleasurable." They aren't looking for harm; they are looking for happiness they can condemn.

  #### 3. The Crux: "It is not the pain that angers them but the pleasure"
  This is the most important sentence in the passage. It summarizes the Utilitarian critique of traditional morality.

  *   **The Utilitarian Calculus:** For Bentham, an action is only "bad" if it produces more pain than pleasure (net harm).
  *   **The Observation:** In the case of consensual gay sex, Bentham sees no victim. There is no pain inflicted on a non-consenting party. There is only pleasure for the participants.
  *   **The Conclusion:** If moralists were truly concerned with **harm** (pain), they would have no objection here. The fact that they *do* object proves that their objection is not to harm, but to the **existence of the pleasure itself.**
  *   **In plain English:** "You aren't mad because someone got hurt. You're mad because someone had fun in a way you don't approve of."

  ---

  ### Part 2: Does This Theory Hold Up Today?

  Bentham was writing 240 years ago, yet his analysis is strikingly modern. Here is how it compares to contemporary psychology and philosophy.

  #### 1. Where Bentham Was Right (The "Purity" Foundation)
  Modern moral psychology, specifically **Moral Foundations Theory** (developed by Jonathan Haidt and others), validates Bentham's intuition.
  *   **The Purity/Sanctity Foundation:** Psychologists have identified that humans have a specific moral module related to "disgust" and "contamination." Originally evolved to keep us from eating rotting meat, this instinct gets "co-opted" by culture to police social norms (sex, religion, hierarchy).
  *   **Disgust as Moral Argument:** Bentham argued that people "confound physical impurity with moral." Modern research confirms this. Studies show that when people feel physical disgust (e.g., smelling a foul odor), they make harsher moral judgments about unrelated social issues. Bentham nailed the mechanism: **Physical revulsion is being masquerading as moral reasoning.**

  #### 2. The Philosophy of Disgust (Martha Nussbaum)
  The philosopher Martha Nussbaum wrote a book called *Hiding from Humanity: Disgust, Shame, and the Law* (2004) that essentially updates Bentham's argument.
  *   She argues exactly what Bentham did: Disgust is based on "magical thinking" (the idea that I can be contaminated by your actions).
  *   She concludes, like Bentham, that disgust is **never** a valid basis for law in a liberal society because it is irrational and projects internal anxieties onto others.

  #### 3. Where Bentham Might Be Missing Nuance
  While Bentham is brilliant here, modern evolutionary psychology adds a layer he didn't have:
  *   **Evolutionary Mismatch:** Bentham treats the disgust reaction as a silly error ("few persons have calmness to attend to"). Modern science suggests this disgust is a hardwired evolutionary heuristic. It's not just "pride"; it's a biological alarm system that sometimes false-positives.
  *   **Social Cohesion:** Some sociologists argue that shared taboos (even irrational ones) bind groups together. Bentham, an individualist, saw this as purely negative. A modern sociologist might say, "Yes, it's irrational, but it serves a tribal function." (Though Bentham would reply: "So does slavery, that doesn't make it right.")

  ### Summary
  You have stumbled upon a text that is arguably centuries ahead of its time.
  *   **James I:** Proves that punishment often scales with the ruler's personal disgust, not the act's harm.
  *   **Philosophical Pride:** Explains that moralists are often motivated by envy of others' happiness.
  *   **The Final Line:** Identifies that the core conflict is not about safety, but about who is allowed to enjoy life.

  Bentham's theory holds up remarkably well. He identified the **"Yuck Factor"** argument before we had a name for it. He realized that when someone says, "It's just wrong," they usually mean, "It makes me feel uncomfortable, and I want the law to fix my feelings."

  If you are enjoying this, you might also look into Bentham's **"Book of Fallacies,"** where he categorizes the specific rhetorical tricks people use to shut down reform. He was the original debugger of human irrationality.
