      *   **The Confusion:** The user sees a potential contradiction or weakness in Galileo's argument. If "wise expositors" (theologians) determine the "true senses" of Scripture to match discoveries, doesn't that make Scripture infinitely malleable? How does this *constrain* the relationship between Scripture and nature? Isn't he just kicking the can down the road to interpretation?
      *   **The Goal:** Explain how Galileo's use of accommodation actually functions within his broader epistemological framework to protect science from theological interference, addressing the user's specific concern about interpretive flexibility.

