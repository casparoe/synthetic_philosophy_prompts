      *   *Constraint:* The constraint isn't on the *science*; the constraint is on the *theologian*. They *must* accommodate the text to the science, not vice versa, *once the science is proven*.
      *   *Nuance:* Galileo admits that if the science isn't *demonstrated* (just probable), then the traditional biblical interpretation holds until proof is found. This is a crucial safeguard he often gets credit for (though his opponents didn't buy his proof).

