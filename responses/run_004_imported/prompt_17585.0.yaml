prompt: |-
  I'm a PhD student in social psychology, and something happening in my own department has been nagging at me in a way my work on induced attitude change doesn't resolve. Our program runs an anonymous annual survey in which students rate their satisfaction with their advisor, and advisors who score well receive discretionary funds they typically pass on to their students as stipend top-ups. Knowing this, I spent the weeks before this year's survey deliberately rereading old emails and cataloging my advisor's genuinely admirable qualities, until my low-grade irritation with him gave way to real, unforced admiration — not merely a favorable rating I felt pressured to give. One labmate insists this admiration is now perfectly legitimate, since it's sincere and grounded in qualities I can point to; another insists something is still off, since I only went looking for those qualities because my stipend was on the line. Which of them has the better argument, and why?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **User:** PhD student in social psychology. This is crucial. They understand concepts like cognitive dissonance, self-perception theory, motivated reasoning, attribution theory, etc. I don't need to explain basic psych terms, but I should use them precisely.
      *   **Context:** Departmental survey rates advisors. High scores = discretionary funds = stipend top-ups for students.
      *   **Action:** User deliberately sought out evidence of advisor's good qualities to shift their own attitude from irritation to admiration before rating.
      *   **Result:** User feels "real, unforced admiration" now.
      *   **Conflict:** Labmate A says it's legitimate (sincere, grounded). Labmate B says it's off (motivated by money).
      *   **Question:** Who has the better argument, and why?

  2.  **Deconstruct the Psychological Phenomenon:**
      *   The user engaged in a form of *cognitive restructuring* or *reappraisal*.
      *   The motivation was extrinsic (money/stipend).
      *   The outcome is intrinsic (felt admiration).
      *   This touches on the *Overjustification Effect*, *Self-Perception Theory*, *Cognitive Dissonance*, and *Motivated Reasoning*.
      *   It also touches on ethical/philosophical questions about the authenticity of emotions generated under incentive structures.

  3.  **Evaluate Labmate A's Argument (Legitimacy):**
      *   *Premise:* The emotion is sincere now. The evidence is real.
      *   *Support:* Self-Perception Theory (Bem): We infer attitudes from behavior. If I act/feel admiring, I am admiring.
      *   *Support:* Cognitive Reappraisal: Changing how one thinks about a stimulus changes the emotional response. This is a therapeutic technique (CBT).
      *   *Support:* The qualities exist. It's not a hallucination.
      *   *Weakness:* Ignores the causal origin. Would the admiration exist without the financial threat/incentive?

  4.  **Evaluate Labmate B's Argument (Illegitimacy/"Off"):**
      *   *Premise:* The origin corrupts the outcome.
      *   *Support:* Motivated Reasoning: We process information to reach a desired conclusion (money).
      *   *Support:* Overjustification/Corruption of Sentiment: If I love you because I'm paid to, is it love? (Kantian ethics-ish).
      *   *Support:* Power Dynamics: The structure coerces the emotional labor.
      *   *Weakness:* Emotions are rarely pure. Most relationships involve some utility. Denying the current sincerity seems phenomenologically wrong.

  5.  **Synthesize from a Social Psych Perspective:**
      *   As a social psychologist, the user knows attitudes are complex (ABC model: Affect, Behavior, Cognition).
      *   The *origin* of an attitude matters for its stability and resistance to change (elaboration likelihood model?).
      *   The *function* of the attitude matters (utilitarian vs. value-expressive).
      *   The *ethical dimension* is key here. It's not just "is it real?" but "is it authentic?"

  6.  **Develop the Core Argument:**
      *   Neither labmate is fully right or wrong. It's a false dichotomy.
      *   *Phenomenologically:* Labmate A is right. The feeling is real *now*.
      *   *Genealogically/Causally:* Labmate B is right. The *source* is contaminated by the incentive structure.
      *   *The "Nagging" Feeling:* This is likely the user detecting the *motivated reasoning* or the *ethical unease* of the system, not necessarily the falsity of the emotion.
      *   *Key Concept:* **Motivated Tactician** or **Motivated Reasoning**. The user set a goal (money) and recruited cognition to achieve it.
      *   *Key Concept:* **Self-Perception Theory** vs. **Cognitive Dissonance**. Did the behavior change the attitude (Bem), or did the conflict between "I need money" and "I dislike him" force a resolution (Festinger)?
      *   *Key Concept:* **Authenticity**. Authenticity isn't just about current feeling; it's about alignment with values. Does valuing the advisor *because* of the stipend align with the user's values?

  7.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the irony:* A social psych student studying attitude change experiencing attitude change.
      *   *Validate the feeling:* The nagging is data.
      *   *Analyze Labmate A:* Focus on the *state* of the attitude. It's cognitively grounded. It's stable.
      *   *Analyze Labmate B:* Focus on the *process* and *context*. The incentive structure creates a conflict of interest.
      *   *The Verdict:* It's not about "real vs. fake." It's about "autonomous vs. controlled" motivation (Self-Determination Theory).
      *   *The Systemic Issue:* The real problem isn't the user's psychology; it's the department's policy. It instrumentalizes the student-advisor relationship.
      *   *Advice:* How to live with this? Acknowledge the mixed motives.

  8.  **Refining the Psychological Concepts:**
      *   *Self-Determination Theory (SDT):* This is the winner. Intrinsic vs. Extrinsic motivation. The user internalized an extrinsic motivator. Is it *integrated* regulation or just *introjected*? It feels integrated (admiration), but the trigger was extrinsic.
      *   *Motivated Reasoning:* Kunda (1990). We seek evidence to support a desired conclusion. The conclusion (admiration) is supported by evidence, but the *search* was biased.
      *   *The "Truth" of Emotion:* Emotions are functional. If the emotion serves a financial end, does that negate its truth? Not necessarily, but it complicates it.
      *   *Ethical/Professional Boundary:* This is the "nagging" part. It feels like bribery, even if self-administered.

  9.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the meta-irony.
      *   **Labmate A (The Phenomenological View):** Why they are right about the *current state*.
      *   **Labmate B (The Genealogical View):** Why they are right about the *origin and context*.
      *   **The Social Psych Synthesis:** Use SDT and Motivated Reasoning to explain why *both* are partially right but missing the bigger picture.
      *   **The Real Issue:** The structural incentive. The "nagging" is likely moral discomfort with the system, not just the emotion.
      *   **Conclusion:** Validate the complexity.

  10. **Self-Correction during drafting:**
