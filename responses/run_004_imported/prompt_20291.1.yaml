      *   *Check:* Make sure not to conflate "tautology" with "false." Popper admitted it could be true and useful, just not scientific *by his strict demarcation*.
      *   *Nuance:* Acknowledge that some philosophers (like Pigliucci or Sober) still discuss the status of evolutionary theory, so it's not a "closed case," but the consensus is on the later Popper.
