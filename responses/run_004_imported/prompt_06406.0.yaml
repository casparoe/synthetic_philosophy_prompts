prompt: |-
  Okay so I fell down a wikipedia rabbit hole last night (started from Arrow's Impossibility Theorem, for a stats project, don't ask) and ended up reading about this thing called the "discursive dilemma," also apparently called the "doctrinal paradox." The example everyone uses is the same 3-judge court case: the judges each vote on whether there was a valid contract and whether it was breached, and the law says the defendant's only liable if both of those are true. If the judges vote on the two questions seperately and then apply the rule (this is apparently the "premise-based procedure"), you get one verdict. But if each judge just votes yes/no on overall liability directly and you go with the majority instead (the "conclusion-based procedure"), you can get the literal opposite verdict — even though every single judge, individually, is being 100% logically consistent the whole time. Kinda broke my brain ngl.

  I want to make sure I actually get why this happens mechanically and I'm not just pattern-matching the one court example without understanding the deeper logic. So can you build me a totally different example of the same paradox — not a courtroom, and not just contract/breach relabeled with synonyms, but an actually different scenario (like a school committee, a hiring panel, a sports rules committee, whatever you think works best) with 3 people voting on 2 premises that combine into a yes/no conclusion through some rule, where you lay out each person's individual votes, then work out what the premise-based procedure gives you vs. what the conclusion-based procedure gives you, and they genuinely conflict? And then explain in like a short paragraph what's actually going on structurally that makes majority voting "break" here — like why this is a real paradox and not just a fancy way of saying people disagree.

  Also, totally optional side-question, but if you happen to know: is this basically the same underlying issue as Arrow's theorem, just applied to logically connected yes/no judgments instead of preference rankings, or is that comparison kind of misleading? Not the main thing I'm asking about, just curious since that's literally how I found this topic in the first place.
