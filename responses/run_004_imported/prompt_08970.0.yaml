answer: |-
  This is a rich passage, and your instinct to treat it as more than mere rhetorical flourish is well-founded. While your advisor is correct that Sidgwick is engaging in institution-building (persuading a skeptical scientific establishment to tolerate the SPR), Sidgwick was too rigorous a philosopher to build an institutional mandate on *purely* empty rhetoric. He is outlining a specific epistemological strategy for the SPR, one that navigates the tension between Humean skepticism and the empirical method.

  Here is an analysis of the logical shape of the argument, addressing your three specific concerns and then synthesizing them into the single line of reasoning you need for your dissertation.

  ### 1. The De Morgan Metaphor: Probabilistic Corroboration
  You are right to suspect this is not loose rhetoric. Augustus De Morgan was not just a logician but a pioneer in the formalization of probability (*An Essay on Probabilities*, 1838; *Formal Logic*, 1847). When Sidgwick invokes him here, he is invoking a specific technical understanding of **concurrent testimony**.

  In probability theory, if witnesses are truly independent, the improbability of them all coinciding in a falsehood decreases multiplicatively. Sidgwick's phrasing—"credit to draw upon," "draft will help," "not likely to suffice"—indicates he is treating credibility as a **quantifiable weight** that can be aggregated.

  *   **The Logic:** He is acknowledging that the *prior probability* of any single psychical event is extremely low (due to "scientific incredulity"). Therefore, the *likelihood ratio* provided by one witness, however credible, cannot overcome that prior.
  *   **The Function:** The metaphor establishes the **unit of evidence**. A single witness is a "draft" (a check) that might bounce if presented alone. But multiple drafts from different accounts (independent witnesses) create a solvable sum.
  *   **Verdict:** This is a probabilistic argument, not just a metaphor. Sidgwick is arguing that while individual testimony is epistemically weak regarding miracles/psychical phenomena, **joint probability** creates a compound strength that individual strength lacks.

  ### 2. "Burying it Alive": Hume and the Accumulation of Facts
  This is the crux of your Hume question. Hume's argument in *Of Miracles* rests on the claim that a "law of nature" is established by "firm and unalterable experience," and that no testimony is sufficient to establish a miracle unless the falsehood of the testimony would be *more* miraculous than the event.

  Sidgwick's "heap of facts" image is a direct counter-move to Hume, but it is subtle. He is not arguing that a *single* testimony can outweigh a law of nature (which Hume denies). He is arguing that **the law of nature itself is a generalization from experience, and can be overturned by a superior weight of counter-experience.**

  *   **Epistemological vs. Psychological:** Sidgwick blurs this distinction intentionally. When he speaks of killing incredulity "as regards the common sense of mankind," he is acknowledging that "scientific law" is partly a sociological construct maintained by consensus.
  *   **The Logic:** If "scientific incredulity" is rooted in past experience, then new experience (the "heap of facts") can modify the root. He is rejecting Hume's **static view of natural law**. For Sidgwick, the "law" is not an *a priori* barrier; it is a high bar.
  *   **Verdict:** Sidgwick is implicitly rejecting the *application* of Hume's principle to psychical research. He accepts the Humean requirement for extraordinary evidence but argues that the SPR's methodology (mass accumulation) is designed specifically to meet that requirement. He is claiming that testimony *can* accumulate past the low prior, provided the volume is sufficient to reconfigure what counts as "uniform experience."

  ### 3. The "Trick" Move: Inference to the Best Explanation
  Your suspicion about the "trick" argument is astute. Logically, this is an **Inference to the Best Explanation (IBE)** combined with a shift in the **Burden of Proof**.

  *   **The Logic:** Sidgwick sets up a elimination matrix.
      1.  Is the observation mistaken? (Ruled out by "experiment upon experiment" / controls).
      2.  Is the witness lying? (Ruled out by De Morgan's "credit" / reputation).
      3.  Is there a natural cause? (Ruled out by the "heap of facts" showing anomaly).
      4.  **Remaining Option:** The investigator is colluding in a trick.
  *   **The Trap:** Sidgwick admits the skeptic *will* choose option 4. By predicting this ("he will allege that"), Sidgwick is arguing that the skeptic's position is no longer empirical but **dogmatic**. If the only way to save the "law of nature" is to accuse reputable investigators of systematic fraud without evidence, the skeptic has abandoned the scientific method they claim to defend.
  *   **Verdict:** This is not a proof of psychical phenomena; it is a proof of the **irrationality of the *a priori* skeptic**. It functions as a *reductio ad absurdum* of hardline materialism: to maintain disbelief in the face of the "heap of facts," one must believe in a conspiracy more improbable than the phenomena themselves.

  ### Synthesis: The Single Line of Reasoning
  To answer your overarching request: these three pieces are not separate observations; they form a **three-stage methodological manifesto** for the SPR. You can structure your argument around this tripartite logic:

  1.  **The Unit of Input (De Morgan):** Sidgwick first defines the epistemic currency. Individual testimony is insufficient against high priors, but it has *transferable value* (credit) that can be aggregated. This justifies collecting cases rather than seeking a "smoking gun."
  2.  **The Process of Transformation (Burying Alive):** He then describes the mechanism of epistemic change. Aggregated testimony does not just add up; it exerts enough pressure to alter the "common sense" (the priors) of the scientific community. This counters Hume by treating natural laws as revisable generalizations rather than immutable barriers.
  3.  **The Limit of Rational Disagreement (The Trick):** Finally, he defines the boundary of legitimate skepticism. Once the accumulation (Stage 2) of credited testimony (Stage 1) reaches a critical mass, further denial requires positing fraud. At this point, the skeptic exits the realm of science and enters dogmatism.

  **Conclusion for your Dissertation:**
  Your advisor is half-right: the passage *is* rhetorical, in the sense that Sidgwick is persuading an audience. But it is **philosophically substantive rhetoric**. Sidgwick is articulating a **cumulative case epistemology**. He is arguing that for phenomena with极低 (extremely low) prior probabilities, the only rational method is the mass accumulation of independent, high-credit testimony, and that resistance to this method reveals a dogmatic commitment to materialism rather than a commitment to evidence.

  You can legitimately build your argument around this. Sidgwick is not just making flourishes; he is defining the SPR's epistemic warrant. He is claiming that the *method* of the SPR (accumulation) is the only logical response to the Humean objection, and that the "trick" accusation is the desperate last stand of a paradigm refusing to die. This fits perfectly with your chapter's theme of how Victorian thinkers handled evidence dismissed *a priori*: Sidgwick's move is to accept the *a priori* weight of science but attempt to crush it through the *a posteriori* weight of volume.
