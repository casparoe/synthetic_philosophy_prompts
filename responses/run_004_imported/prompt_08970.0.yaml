          4.  **Conclusion:** Therefore, the SPR's method is the only rational path, and resistance to it is irrational.

  6.  **Checking against Sidgwick's broader work:**
      *   Sidgwick wrote "The Evidence for the Supernatural" (1886) and other essays. He was concerned with the "conflict between science and religion/ethics."
      *   He viewed the SPR as a way to expand the boundaries of science without abandoning scientific rigor.
