  7.  **Final Polish:** Ensure the distinction between *psychological persuasion* and *epistemic justification* is clear, as that's the crux of the Hume question. Sidgwick blurs them intentionally: changing "common sense" (psychology) *is* changing the epistemic landscape for him.

  8.  **Self-Correction during drafting:** I need to make sure I don't just say "Sidgwick is right." I need to analyze the *structure*. The user asked for the "logical shape." I should use terms like "cumulative case," "prior probability," "inference to the best explanation," and "burden of proof."

      *   *Correction on De Morgan:* Make sure to mention De Morgan's actual work on probability to validate the "not just rhetoric" claim.
      *   *Correction on Hume:* Be careful not to say Sidgwick "refutes" Hume. He circumvents him by changing the nature of the "law."
      *   *Correction on Trick:* Highlight that this moves the goalposts for the skeptic.

  9.  **Final Review against User Prompt:**
      *   Did I answer the three specific questions? Yes.
