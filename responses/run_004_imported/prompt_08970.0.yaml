          2.  Interpretation of "burying it alive under a heap of facts" vis-à-vis Hume's *Of Miracles* (epistemological rejection vs. psychological strategy).
          3.  Analysis of the closing move regarding "the investigator is in the trick" (legitimate inference to best explanation vs. false dichotomy).
          4.  **Crucial:** How these three pieces connect as a *single line of reasoning*, not just separate points.

  2.  **Contextualize Sidgwick and the SPR:**
      *   Sidgwick was a rigorous utilitarian and epistemologist (*Methods of Ethics*). He cared deeply about evidence and probability.
      *   The SPR was founded to investigate "mesmerism, spiritualism, etc." scientifically.
      *   The intellectual climate was dominated by Humean skepticism regarding miracles/psychical phenomena.
      *   Sidgwick's goal here is institutional and strategic: justifying the *method* of the SPR to a skeptical scientific community.

  3.  **Deconstruct the Passage (Sentence by Sentence/Concept by Concept):**

      *   *De Morgan Metaphor:* "fair stock of credit," "draft will help," "not likely to suffice."
          *   *Analysis:* This sounds Bayesian before Bayes was popularized in this context. It's about prior probability of the witness's honesty/competence. One witness isn't enough to overcome the low prior of the *event*, but multiple independent witnesses raise the posterior probability. It's not just rhetoric; it's a probabilistic strategy.
      *   *Hume/Burying Alive:* "Scientific incredulity... strong roots," "burying it alive under a heap of facts," "pegging away," "trust to the mass of evidence."
          *   *Analysis:* Hume argues that uniform experience (laws of nature) outweighs testimony. Sidgwick acknowledges the "roots" of incredulity (the Humean prior). He doesn't explicitly attack Hume's logic *in abstracto*; he attacks its *application* to this specific field. He suggests that the "uniform experience" against psychical phenomena isn't as uniform as Hume thought, or rather, that the *volume* of counter-testimony can shift the weight. Is it psychological or epistemological? It's likely both: he's arguing that the "law" isn't fixed if the facts accumulate.
      *   *The "Trick" Move:* "highest degree of demonstrative force... limited by trustworthiness," "critic has nothing left to allege except that the investigator is in the trick," "he will allege that."
          *   *Analysis:* This is an *argument from elimination* (Inference to the Best Explanation). If you control for error, fraud, and misobservation, what's left? Sidgwick admits the skeptic will *always* fall back on fraud ("the trick"). This reveals the skeptic's dogmatism. It shifts the burden of proof.

  4.  **Synthesize the "Single Line of Reasoning":**
      *   How do these connect?
      *   *Step 1 (De Morgan):* Establish the unit of evidence. Individual testimony is weak (low credit) but additive.
      *   *Step 2 (Hume/Burying):* Establish the obstacle. The prior improbability (scientific incredulity) is high. Therefore, you need *many* units (Step 1) to overcome the obstacle (Step 2). This justifies the SPR's methodology (mass accumulation).
      *   *Step 3 (The Trick):* Establish the limit of the method. Even if you do Step 1 enough to overcome Step 2 logically, the skeptic has a "get out of jail free" card (fraud). Sidgwick exposes this as a dogmatic refusal to engage with the mass.
      *   *Overall Arc:* It's a defense of a *cumulative case strategy* against *a priori skepticism*.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, respectful, precise (PhD level).
      *   *Structure:* Address the three specific questions, then synthesize them into the unified argument.
      *   *Key Insight:* The advisor is half-right (it is rhetorical/political) but wrong to dismiss the philosophical underpinning. Sidgwick is outlining an *epistemology of the SPR*.

      *   *Refining Point 1 (De Morgan):* It's probabilistic. Augustus De Morgan was a logician/probability theorist (*Formal Logic*, 1847). Sidgwick is invoking a specific technical understanding of concurrent testimony. It's about independent corroboration raising probability, not just "trust me."
      *   *Refining Point 2 (Hume):* Sidgwick isn't refuting Hume's *principle* (that extraordinary claims need extraordinary evidence); he's refuting the *application* that the evidence can *never* be enough. "Burying alive" suggests suffocation by weight, implying the "law" of nature is actually a generalization that *can* be overturned by sufficient counter-instances. It shifts from "impossible" to "highly improbable but surmountable."
      *   *Refining Point 3 (The Trick):* This is the pivot from epistemology to sociology of science. Sidgwick is saying: "If we do our job (Steps 1 & 2), the only remaining objection is ad hominem (fraud)." This exposes the skeptic's bad faith. It's not a logical proof of psychical phenomena; it's a logical proof of the *skeptic's dogmatism*.

      *   *Synthesis:* The argument is a *methodological manifesto*.
          1.  **Input:** Testimony (weighted by credit).
