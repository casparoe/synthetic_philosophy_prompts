answer: |-
  The ethanol in the specimen jars caught the fluorescent light, turning the preserved skinks into suspended ghosts. Dr. Aris Thorne lined them up on the stainless steel table, arranging them by collection site number. One to twelve. A clock face made of reptiles.

  Site 1 was dark olive, almost black. Site 2 was slightly lighter. Site 3 had a hint of rust along the flank. By the time Aris reached Site 6, on the far side of the Kaelen Mountain range, the lizards were a sandy beige. Site 7 introduced a blue stripe. Site 12, collected just three miles from Site 1 in this very valley, was a vibrant azure with no trace of the original olive.

  Aris picked up the Site 1 specimen. Then the Site 12. He held them side by side. In the wild, here in the valley floor, these two never mated. They ignored each other completely. Behavioral trials confirmed it: the males postured, the females fled. Reproductive isolation was absolute. By the standard definition, they were different species.

  But between them lay the mountain. Aris had the genetic sequencing data spread across the monitor behind him. Site 1 bred with 2. 2 with 3. All the way around the northern ridge to 6, then down the southern slope through 12. The gene flow was unbroken. A genetic thread stitched the olive ghost to the azure ghost, looping around the peak like a noose.

  If the thread held, they were one species. If the behavior here held, they were two.

  A knock at the door frame made Aris jump. It was Elena from the Regional Conservation Board. She didn't come in; she just leaned against the jamb, arms crossed.

  "Vexor Mining is asking for the final taxonomy report again," she said. "The hearing is on Thursday. If *Lacerta azureus* is a distinct species, their permit gets denied. The valley floor is critical habitat. If it's just a population variant of *Lacerta oliveus*... well, the range of *oliveus* covers three states. No endangered status. The mine opens."

  Aris set the jars down. "You know the data, Elena."

  "I know the data says yes and no."

  "It says they don't interbreed here."

  "But they share DNA around the mountain." Elena stepped into the lab, her boots clicking on the tile. "I'm not asking for a lecture, Aris. I'm asking for a name. One name or two? The law requires discrete units. It doesn't have a box for 'continuous loop.'"

  Aris turned back to the map on the wall. The red pin marked the proposed mine site. It sat squarely in the overlap zone, the only place where the olive and the azure met face-to-face. Everywhere else, the transition was smooth. You could walk the ring and watch the color bleed from one to the other like wet paint. There was no break. No cliff. Just a slow, imperceptible slide from black to blue.

  Except here. Here, the slide snapped.

  "I need another day," Aris said.

  "You have until morning," Elena replied. "Don't make me decide for you. If I decide, I'll go with the safest legal bet. And the safest bet is usually the one that avoids litigation. Vexor has deep pockets."

  When she left, the silence returned, heavier than before. Aris sat in his chair and spun the Site 1 jar. The preservative clouded slightly around the limbs. He thought about the fieldwork. He remembered standing at Site 4, watching a male mate with a female from Site 5. He remembered Site 8, where the beige blended into the striped. Nature hadn't drawn a line. Nature had drawn a circle.

  The contradiction wasn't in the lizards. It was in the language he was forced to use. To save the valley, he had to carve a piece out of the circle and call it a whole. He had to pretend the thread around the mountain didn't exist. To tell the truth about the genetics, he had to allow the mine to destroy the very place where the uniqueness of the loop was most visible.

  He opened the database file. *Taxonomic Classification Recommendation.*

  Cursor blinking in the field: *Species Name.*

  If he typed *Lacerta kelteni* (singular), he acknowledged the ring. He honored the genetic continuity. He admitted that the boundary was porous, that life was a flow rather than a set of boxes. And the mine would tear up the valley, crushing the azure forms under excavators, knowing they were just 'common variants' of a widespread stock.

  If he typed *Lacerta azureus* and *Lacerta kelteni* (plural), he drew a line. Where? Between 12 and 1? Between 11 and 12? Any number he chose was arbitrary. There was no genetic cliff at Site 11.5. The difference between 11 and 12 was smaller than the difference between 1 and 2. But 1 and 2 bred, and 12 and 1 did not.

  To save them, he had to lie about the continuity. To tell the truth, he had to sacrifice them.

  Aris looked at the specimens again. The azure one seemed to glare back, a tiny, preserved accusation. He thought about the definition of a species: a group of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups.

  *Potentially.*

  If you moved Site 1 lizard to Site 6, would it breed? Yes. If you moved Site 12 to Site 6, would it breed? Yes. So Site 1 and Site 12 are connected through Site 6. They are the same. But put them here, in the valley, and they are strangers.

  The concept buckled. It was a net designed to catch fish, but life was water. You could lift the net and show the water caught in the mesh, but you couldn't claim the water was the net.

  He picked up his pen. The hearing wasn't about truth. It was about jurisdiction. The law needed a boundary to enforce. If there was no boundary, there was no protection.

  Aris opened a fresh drawer and pulled out a map of the valley. He took a red marker. He had to draw the line somewhere. If he drew it around the valley floor, isolating the azure population, he created an endemic species. He created a legal entity that could own rights to the land.

  He hovered the marker over the map. The line would cut through the habitat of Site 11. Were they azure? Were they kelteni? They carried genes from both. They were the bridge. If he drew the line, he severed the bridge. He declared that part of the ring was dead, disconnected, distinct.

  He thought of the Ship of Theseus. If you replace every plank, is it the same ship? If you change every gene around the mountain, is it the same species?

  Aris capped the pen. He uncapped it.

  Outside, the wind picked up, rattling the windowpane. Somewhere out there, in the dark, a male skink was singing to a female who might not understand his song, depending on which side of an imaginary line he stood.

  He typed.

  *Recommendation: Distinct Species Status.*

  He hit enter. The screen updated. *Lacerta azureus* appeared in the list. A new thing was born, created by the stroke of a key. It didn't exist this morning. Now it did. It was a fiction that would have real consequences. It would stop the trucks. It would save the valley. It would deny the genetic reality of the ring.

  Aris leaned back and rubbed his eyes. He had protected the lizards by denying their history. He had frozen the flow to save the water.

  He printed the report. The paper slid out of the printer, warm and final. He signed his name at the bottom. The ink looked black, stark against the white page. No gradients. No rings. Just a signature binding him to a line that wasn't there.

  He stacked the papers and placed them in the outgoing tray. The jars of ethanol sat on the table, the olive and the azure ghosts still waiting. They didn't care about the report. They would continue to ignore each other in the valley, and continue to share blood around the mountain, indifferent to the name Aris had given them to keep the earth movers away.

  Aris turned off the lab lights. In the dark, the specimens glowed faintly, a circle of light hanging in the void, unbroken until morning.
