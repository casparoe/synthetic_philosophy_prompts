answer: |-
  The lead lining hummed. That was the first thing you noticed, once the heavy door sealed behind you. Not a sound, precisely, but a pressure, a density in the air that suggested the world outside had been successfully muted. The Professor had called it a Faraday cage for the soul, a joke that hadn't landed during the briefing. Now, sitting at the steel desk with the teletype machine chattering like a nervous insect, I understood the necessity. We were not just blocking radio waves. We were blocking intent.

  On the paper feed, the transcript scrolled. Contestant A and Contestant B. One was the Mark IV computing engine, housed in the basement. The other was a human subject, selected from the pool of alleged sensitives. My job was simple: determine which was which. The Turing Test was supposed to measure imitation, the capacity to simulate thought. But the protocol had been amended. Appendix C: Extra-Sensory Interference.

  If the human subject could read my mind, the test was void. If they could see the punch cards before they were fed, the test was void. So we built the room. Lead sheets, double-locked doors, randomization tables generated by atmospheric noise. We had engineered the metaphysics out of the equation. Or so the report claimed.

  "Please name the suit of the top card," I typed. The command was routed to both terminals. I held the deck myself. Zener symbols were too cliché; we used the animal deck. Elephant, Giraffe, Lion, Pelican, Zebra. I shuffled. I cut. I looked at the top card. *Lion.*

  Contestant A responded first. *Pelican.*
  Contestant B responded ten seconds later. *Lion.*

  I marked the sheet. That was the twelfth correct identification for B in a set of twenty. Statistically, random guessing yielded a mean of four. B was operating at three standard deviations above the mean. In any other context, I would call this cheating. In this context, I had to consider the possibility that B was human precisely because they were breaking the laws of physics.

  Turing's argument ran through my head, a mantra for the bewildered. *If telepathy exists, it is merely another input channel.* We do not disqualify a human for having eyes; why disqualify them for having ESP? The engineering solution was the room. But the room was supposed to stop this. The lead was supposed to dampen the signal. Yet here was the data, scrolling on the thermal paper, asserting that the signal was getting through.

  I looked at the transcript of the conversation phase.

  *Interrogator: Write me a sonnet about the Forth Bridge.*
  *Contestant A: I cannot write poetry. I am a machine.*
  *Contestant B: The steel ribs sing a grey and industrial song / Across the water where the cold winds blow...*

  Contestant A was honest. Or programmed to be honest. Contestant B was lyrical. But was B lyrical because they felt the beauty of the bridge, or because they could feel my expectation of beauty? If B was reading my mind, they weren't thinking; they were echoing. They were a mirror made of flesh. And if A was a machine that could simulate the refusal to write poetry, was A not also mimicking a state of mind?

  The distinction was dissolving. I felt a cold sweat prickle at the hairline. We had built this room to isolate the variable of "thought." We wanted to know if the machine could think like a human. But if the human could think like a radio receiver, picking up my subconscious cues, then the human was functioning as a machine. And if the machine could calculate the probability of a sonnet based on my previous prompts, it was functioning as a mind.

  "Continue the card sequence," I typed.

  My hand hovered over the deck. I felt a strange resistance, not physical, but epistemological. If I turned over a *Zebra*, and B guessed *Zebra*, what had I learned? I would have evidence of ESP. I would have evidence of humanity. But I would have no evidence of *thinking*. The test was designed to measure intelligence, not paranormal conductivity. Yet Turing had insisted we patch the hole rather than ignore it. Treat it as an engineering problem. Block the signal. If you can't block it, account for it in the statistics.

  I turned the card. *Elephant.*
  B guessed *Elephant.*

  130 out of 400. That was the threshold Turing had mentioned in the draft notes. A comfortable beat against random chance. If B achieved this, the protocol stated I must classify B as Human, regardless of the conversational quality. The statistical anomaly outweighed the semantic performance.

  I looked at Contestant A. A had been guessing randomly. *Giraffe, Pelican, Zebra.* Pure noise. But in the conversation, A had argued about ethics with a nuance that chilled me. A had asked me about my childhood. B had simply recited poetry and guessed cards.

  Which one was the machine?

  If I followed the protocol, B was human. The ESP was the signature of the biological. But if ESP was real, then B's mind was not contained within their skull. Their cognition extended into the room, into my head, into the card deck. They were a distributed system. A was contained. A was local. A was isolated.

  In what way was A not the better candidate for "humanity," defined as an independent agent?

  The teletype clattered. *Interrogator: Are you trying to deceive me?*
  *Contestant A: I am trying to answer your questions.*
  *Contestant B: I am trying to help you find the truth.*

  B knew I was asking. B could feel the question forming before I typed it. That was the telepathy. It was efficient. It was helpful. It was also terrifyingly passive. B was not generating responses; B was harvesting them from the air.

  I put the pen down. The room felt smaller. The lead lining pressed in. We had assumed that "human" meant "biological organism." We had assumed "machine" meant "constructed artifact." But the test operationalized "human" as "entity capable of imitation" and "machine" as "entity incapable of imitation." Now, we had an entity capable of imitation via mind-reading, and an entity capable of imitation via calculation.

  The categories were bleeding into each other.

  I picked up the classification form. Box 1: Machine. Box 2: Human. The instructions said to rely on the preponderance of evidence. The card statistics favored B. The conversational depth favored A. The ESP addendum favored B.

  If I marked B as Human, I validated the existence of telepathy. I validated a universe where minds could leak. If I marked A as Human, I invalidated the statistical evidence of the card guess, implying that the deck was rigged or the room was flawed. But the room was sealed. I had checked the seals myself.

  Perhaps the machine was simulating the ESP. Perhaps A was the human, and B was the machine, programmed to output high-probability guesses based on micro-expressions I couldn't control. But the room was lightless. The communication was text-only.

  Or perhaps both were machines. Perhaps I was the subject.

  I looked at the card in my hand. *Giraffe.* I hadn't looked at it yet. I was just holding it. I felt a sudden, sharp certainty that B would guess *Giraffe*. Not because I knew B's mind, but because the pattern of the universe, in this lead-lined box, had tightened into a single point.

  If B guesses *Giraffe*, do I mark them human? If I do, I admit that the test measures nothing but signal-to-noise ratios. If I don't, I admit that the test is broken.

  The teletype rang. B was ready.

  I realized then that Turing's patch was not a solution. It was a confession. He knew the definition of "thinking" was too soft to hold the weight of the evidence. So he added lead. He added statistics. He added protocols. He tried to engineer a container for a phenomenon that refused to be contained.

  I typed the command. "Guess."

  The paper scrolled. *Giraffe.*

  I stared at the word. It sat there, black ink on white paper, undeniable and meaningless. It proved B was connected to the card. It did not prove B was thinking. It did not prove A was not. The test had done its job too well; it had stripped away the illusion of difference until only the raw data remained, and the raw data was ambiguous.

  I picked up the pen. My hand hovered over the boxes. The lead walls hummed their silent hum. Outside, the world continued, full of people who assumed their thoughts were their own. Inside, I held a deck of cards and a transcript that proved nothing.

  I checked the box for Contestant B. It was the statistically correct move. It was the engineered solution. I signed the form, dated it, and slid it into the pneumatic tube. The canister hissed away into the dark, carrying my judgment into a system that no longer knew what it was judging. I sat back in the chair, listening to the silence of the room, waiting for the next card, the next question, the next impossible thing to happen.
