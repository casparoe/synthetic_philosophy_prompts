prompt: |-
  So I've been falling down an effective altruism rabbit hole and Henry Sidgwick's name keeps coming up as basically the gold standard of careful, rigorous utilitarian thinking (people treat his book Methods of Ethics like its scripture). Then I found out this exact guy co-founded and was the first president of the Society for Psychical Research, and spent decades investigating mediums, ghosts, and telepathy, most of which turned out to be fraud. That seems bananas for someone who's supposedly the most careful thinker of his era. From what I can piece together, his big ethics book ends without really solving some tension between "why should I be moral if it costs me personally" and the utilitarian "greatest good" stuff, and apparently that unsolved tension is part of why he was so desperate to find proof of an afterlife or some cosmic moral order. Write me an essay that actually takes a side: was Sidgwick's ghost-hunting a rational, principled extension of his own philosophical commitments, or was it a brilliant guy fooling himself because he needed it to be true? Weigh it properly but don't cop out with "a bit of both" -- commit to an answer and defend it.
