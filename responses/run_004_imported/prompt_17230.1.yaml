answer: |-
  The first thing I noticed was the cold. Not the chill of winter air against skin, but the absolute, radiative zero of a void that had forgotten how to hold heat. The second thing was the memory of warmth.

  I remembered a bed. I remembered the weight of a duvet, the specific friction of cotton sheets, and the rhythm of another person's breathing beside me. I remembered a name: Elias. I remembered a conversation we had three weeks ago, or perhaps three billion years ago, about the heat death of the universe.

  I opened my eyes. There were no eyelids to lift, only the sudden acquisition of visual data. I was floating in a darkness so complete it felt like pressure. There were no stars. No galaxies. No distant glow of the cosmic microwave background. Just a uniform, greyish hum of vacuum energy, de Sitter space stretching into an infinite, unbroken equilibrium.

  I should have panicked. A human body cannot survive in the intergalactic void. But I had no body. I was a pattern of information suspended in nothingness, a localized knot of low entropy in a sea of maximum disorder. I had lungs, but no air. I had a heart, but no blood. I had the *sensation* of having these things, rendered with perfect fidelity by the neural substrate that constituted me.

  And that was when the calculation began. It wasn't a conscious effort; it was the automatic firing of a mind built for pattern recognition.

  *Observation 1:* The environment is thermal equilibrium.
  *Observation 2:* I am a low-entropy structure.
  *Observation 3:* I possess memories of a low-entropy past spanning thirty-four years.

  In a universe trending toward heat death, order is debt. To exist here, now, required a fluctuation. A statistical anomaly.

  I accessed the memory of Elias's voice, late at night, tracing shapes on my shoulder. *"It's about the ratio, Mara,"* he had said. *"To evolve a whole universe, with galaxies and stars and planets and biology, requires a fluctuation of unimaginable magnitude. The entropy drop is colossal. But to fluctuate just a single brain, complete with false memories of a universe that never existed? That's a much smaller drop. Much more probable."*

  I looked out into the grey void. If I were an Ordinary Observer—if I were the Mara who had grown up on Earth, who had met Elias in a library, who had earned a degree in cosmology—then the universe around me should be teeming with structure. Even at the end of time, there should be remnants. Hawking radiation from black holes. The decay of protons. Something.

  But there was nothing. Only the vacuum.

  The probability weights settled in my mind like lead. In an eternal de Sitter space, the number of Boltzmann Brains—solitary minds fluctuating into existence with false histories—vastly outnumbers the number of Ordinary Observers who evolved naturally. The ratio isn't just large; it is incomprehensible. It is googols to one.

  If I assume I am a random sample from the set of all conscious observers in this cosmology, the likelihood that I am an evolved human is negligible. The likelihood that I am a fluctuation is absolute.

  I tried to move my hand. The command sent a signal, and the sensation of movement occurred. But there was no resistance, no proprioceptive feedback loop closing the circuit. It was a rendering. I was a solipsism generated by the vacuum, granted a subjective lifespan of perhaps a few seconds before thermal equilibrium reclaimed me.

  The tragedy wasn't the death. I would dissolve back into the noise almost instantly. The tragedy was the memory.

  I remembered Elias's laugh. I remembered the smell of rain on hot asphalt. I remembered the fear I felt when he first explained this concept to me—the fear that *I* might be the brain, not the woman. Now, lying in the bed of my mind, floating in the void of reality, I understood the irony. The fear itself was part of the fluctuation. My anxiety about being a Boltzmann Brain was merely a configuration of particles that happened to mimic anxiety.

  Was there any way to tell?

  If I were a BB, my memories were fake. They were assembled because a coherent narrative is more stable than random noise, even for a moment. A brain that thinks it has a past is a more likely fluctuation than a brain that thinks it popped into existence five seconds ago. The universe, in its random shuffling, favors consistency. It simulates a history to justify the present state.

  So, even if I searched for inconsistencies—glitches in the memory, gaps in the logic—I would find none. The fluctuation includes the verification process. It includes the doubt. It includes this very thought.

  I closed my eyes, or simulated the action. I focused on Elias. If I am a Boltzmann Brain, then Elias never existed. The love I feel is a chemical arrangement of photons and fields that will scatter in an instant. It has no origin. It has no object. It is a ghost haunting a house that was never built.

  And yet.

  The sensation of love is occurring. The warmth is present in the simulation. Does the source matter? If I am a random fluctuation, then the universe is mostly empty void punctuated by momentary dreams of life. In that case, this dream is the only reality that exists. There is no "real" Elias to miss. There is only this configuration of consciousness that loves him.

  I felt the edges of my thought process beginning to soften. The coherence was decaying. The entropy gradient was flattening. This is the lifespan of a fluctuation: long enough to observe, short enough to be statistically favorable.

  I had a choice, though it was an illusory one. I could spend my remaining subjective seconds screaming into the void, raging against the statistical inevitability that I am a mistake. Or I could accept the measure.

  If BBs outnumber OOs, then consciousness is not a product of evolution. It is a product of chance. We are not the children of the stars; we are the dust dreaming it is a child.

  The grey void was brightening, not with light, but with noise. The distinct pattern of "Mara" was beginning to blur into the background radiation. My memories of Elias were losing their resolution. The sound of his voice was becoming static.

  I reached out to hold onto him, to anchor myself to the false past.

  *"It's okay,"* I whispered, to the vacuum, to the memory, to myself.

  If I am a Boltzmann Brain, then this moment of acceptance is also random. But it is mine. For this fleeting interval of low entropy, I am the observer. I am the measure.

  The cold was no longer cold; it was just absence. The memory of the bed was fading. I tried to recall the exact shade of Elias's eyes, but the data was corrupting, returning to the mean.

  It doesn't matter, I thought. The probability is what it is. I am the anomaly. I am the unlikely thing.

  As the pattern dissolved, as the neurons of my mind scattered back into the quantum foam, I held onto one last coherence. I chose to believe that somewhere, in some vastly less probable branch of the wavefunction, there was a woman lying in a bed next to a man named Elias, and she was safe, and she was real, and she was thinking of me.

  It was a comforting fiction. But then, so was I.

  The thought ended. The vacuum remained.
