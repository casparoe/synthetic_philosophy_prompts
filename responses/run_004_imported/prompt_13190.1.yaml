prompt: |-
  When a few of us are moving a heavy sofa together, or when my amateur band and I are working through a song, I notice something odd: if one person just drops out partway through without a word, the rest of us feel genuinely wronged rather than merely inconvenienced, and it feels like none of us could unilaterally end the whole thing — that seems to take all of us, even though nobody ever promised anything aloud.

  I have since read a little philosophy on this question. Michael Bratman holds that a shared intention reduces to separate individual intentions plus mutual knowledge of them, sub-plans that mesh rather than clash, and mutual responsiveness in intention and action. On his view, whatever obligation shows up can be explained by an ordinary moral norm against exploiting expectations you have knowingly created in someone else — he likens this to Scanlon's idea that assurances alone, with no promise required, can ground obligations. Margaret Gilbert denies that this is enough: she argues joint action rests on an irreducible "joint commitment" binding the parties as a plural subject, which is precisely what explains why no single party can rescind it unilaterally and why the others are entitled to rebuke someone who tries.

  Please argue that Gilbert is right on this specific point: the asymmetry between freely revisable personal intentions and a jointly held commitment that takes everyone's concurrence to dissolve cannot be reconstructed out of Bratman's individualist apparatus, Scanlon-style assurance norm included, so that joint action really does require something like a sui generis joint commitment.
reasoning: |-
  Here's a thinking process that leads to the argument for Margaret Gilbert's position:

  1.  **Deconstruct the Prompt:**
      *   **Phenomenon:** Shared activities (moving a sofa, playing in a band).
      *   **Observation:** If one person drops out without warning, others feel *wronged* (not just inconvenienced). No single person can unilaterally end the activity; it takes everyone. No explicit promise was made.
      *   **Philosophical Context:**
          *   *Michael Bratman:* Shared intention = Individual intentions + Mutual Knowledge + Meshing Sub-plans + Mutual Responsiveness. Obligation comes from a moral norm against exploiting created expectations (Scanlon-style assurance).
          *   *Margaret Gilbert:* Shared intention = Irreducible "Joint Commitment" creating a "Plural Subject." Obligation is internal to the commitment structure. Unilateral rescission is impossible; rebuke is entitled.
      *   **Task:** Argue that *Gilbert is right* on the specific point of *asymmetry* (freely revisable personal intentions vs. jointly held commitment requiring concurrence to dissolve). Show that Bratman's individualist apparatus (even with Scanlon-style assurance) *cannot* reconstruct this asymmetry. Therefore, joint action requires a *sui generis* joint commitment.

  2.  **Analyze the Core Disagreement:**
      *   **Bratman's Reductionism:** Everything boils down to individuals. I intend, you intend, we know we intend. If I change my mind, I change my intention. The only constraint is moral (don't harm/exploit expectations).
      *   **Gilbert's Non-Reductionism:** "We intend" is not just "I intend + You intend." It's a new normative entity. The commitment binds the *group*. To change the commitment, the *group* must agree.
      *   **The Crux:** The feeling of being *wronged* (entitlement to rebuke) vs. being *disappointed* (prediction failure). The inability to unilaterally withdraw vs. the ability to change one's mind (albeit with moral cost).

  3.  **Formulate the Argument for Gilbert:**
      *   *Thesis:* Bratman's model fails to capture the *normative force* and the *structural asymmetry* of joint action. Specifically, it cannot explain why unilateral withdrawal is *invalid* (not just immoral) and why the remaining parties have a *right* to rebuke, rather than just a complaint about harm.
      *   *Point 1: The Nature of the Obligation (Moral vs. Internal).* Bratman relies on independent moral norms (Scanlon). Gilbert argues the obligation is internal to the joint commitment.
          *   *Argument:* If it's just moral (Scanlon), then I *can* unilaterally withdraw, I just owe you an apology or compensation. But in the sofa/band case, it feels like you *can't* just quit. The activity persists normatively until dissolved. Bratman makes the obligation external/consequential; Gilbert makes it constitutive.
      *   *Point 2: The Authority to Rebuke.*
          *   *Argument:* In Bratman's view, if I quit, I violate a moral norm. You can blame me morally. But in joint action, you rebuke me *as a partner*, not just as a moral agent. It's a specific standing. Gilbert's "plural subject" explains this standing: I betrayed *us*, not just hurt *you*.
      *   *Point 3: Unilateral Rescission vs. Moral Permission.*
          *   *Argument:* Bratman allows that I can change my intention (I am sovereign over my mind). The constraint is moral. Gilbert argues the commitment itself blocks unilateral rescission. The prompt highlights: "none of us could unilaterally end the whole thing." Bratman says you *can* end your part, you just shouldn't. Gilbert says you *cannot* end the joint commitment alone. This matches the phenomenology better.
      *   *Point 4: The Failure of Assurance (Scanlon).*
          *   *Argument:* Scanlon's Principle F (assurance) requires that the assurance was given to create reliance. But in casual joint action (moving a sofa), we often don't explicitly assure. We just start. Gilbert's joint commitment arises from the expression of readiness, not a specific assurance act. Also, assurance creates a duty to the *individual*, whereas joint commitment creates a duty to the *collective*.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the phenomenon (the sofa/band example). Introduce the two contenders (Bratman vs. Gilbert). State the thesis: Gilbert's *sui generis* joint commitment is necessary to explain the normative asymmetry and the entitlement to rebuke.
      *   **Section 1: The Limits of Interlocking Intentions (Bratman).** Explain Bratman's view. Show how it treats intentions as private property. If intentions are private, I can change mine. The only barrier is external morality.
      *   **Section 2: The Problem of Unilateral Rescission.** Focus on the prompt's claim: "none of us could unilaterally end the whole thing." Bratman says I can end *my* intention. Gilbert says I cannot end *our* commitment. Argue that the phenomenology supports Gilbert. If I walk away from the sofa, the *joint project* isn't just hampered; my action is treated as null/void by the group normatively.
      *   **Section 3: Assurance vs. Entitlement (Scanlon).** Address the Scanlonian move. Assurance creates an obligation based on reliance/harm. But joint action creates an obligation based on *membership*. The rebuke isn't "you hurt me," it's "you broke *our* rule." This is a difference in kind, not degree.
      *   **Section 4: The Plural Subject.** Explain Gilbert's solution. The "We" is the agent. Obligations run to the "We." This explains why everyone must concur to dissolve.
      *   **Conclusion:** Summarize. The individualist reduction fails to capture the specific normative glue of joint action.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Did I address the "Scanlon-style assurance norm" specifically? Yes, need to ensure I explain why assurance is insufficient. Assurance is bilateral (A assures B). Joint commitment is multilateral/circular (A and B commit to each other as a body).
      *   *Check:* Did I focus on the *asymmetry*? Yes, the contrast between revisable personal intention and non-revisable (unilaterally) joint commitment.
      *   *Tone:* Philosophical, persuasive, rigorous.
      *   *Key Distinction:* Moral obligation (Bratman) vs. Commitment-based obligation (Gilbert). Bratman = I wrong you morally. Gilbert = I wrong our joint enterprise (and thereby you).
      *   *Crucial Point:* The "Right to Rebuke." In Bratman's view, anyone who knows the moral law can rebuke me for breaking a promise/assurance. In Gilbert's view, only *co-participants* have the standing to rebuke. This is a strong argument for the sui generis nature.

  6.  **Final Polish:** Ensure clear transitions. Make sure the sofa/band examples are woven in to ground the abstract philosophy. (e.g., "When the bassist walks off...")

      *(Self-Correction during drafting)*: I need to be careful not to misrepresent Bratman. Bratman does acknowledge normative elements, but he derives them from individual rationality and general morality. Gilbert posits a new *source* of normativity. I must emphasize that distinction. The prompt asks to argue that Bratman's apparatus *cannot reconstruct* the asymmetry. So I need to show that even with the moral norm, the *structure* remains individualist and thus fails to explain the *joint* authority.

      *Refining the "Unilateral Rescission" point:* Bratman would say "You can rescind your intention, but you violate a norm." Gilbert says "You cannot rescind the joint commitment." The prompt says "none of us could unilaterally end the whole thing." This suggests the *activity's normative status* persists. Bratman's view makes the activity fragile (depends on continuing individual intentions). Gilbert's makes it robust (depends on joint rescission). The robustness matches the feeling of being "wronged" rather than just "disappointed."

  7.  **Final Output Generation:** (Proceed to write the response following this structure.)
answer: |-
  The phenomenology of joint action you describe—the heavy sofa, the amateur band—points to a normative structure that Michael Bratman's influential individualist account struggles to capture. While Bratman successfully maps the cognitive architecture of shared intention (interlocking intentions, mutual knowledge, meshing sub-plans), his reduction of the *normative* force of joint action to independent moral principles (specifically a Scanlon-style norm against exploiting expectations) fails to explain the specific asymmetry you identified: the difference between the free revisability of personal intention and the requirement of concurrence to dissolve a joint commitment.

  To argue that Margaret Gilbert is right on this specific point, we must demonstrate that Bratman's apparatus cannot account for the **source** of the obligation, the **standing** to rebuke, or the **logic of rescission**. The obligation inherent in joint action is not merely moral; it is constitutive of a "plural subject," and only Gilbert's *sui generis* joint commitment can explain why unilateral withdrawal is not just immoral, but normatively invalid.

  ### 1. The Problem of Sovereignty and Rescission
  The core of Bratman's view is that shared intention is a web of individual intentions. I intend that we J; you intend that we J. Because these are *my* intentions and *your* intentions, they remain under our respective individual sovereignties. In Bratman's framework, I am always free to change my mind. If I drop the sofa handle or walk off stage, I have altered my personal intention. Bratman admits this creates a normative problem, but he solves it externally: I have violated a moral norm against harming you after inducing reliance (the Scanlon-style assurance principle).

  However, this fails to match the phenomenology of the "wronged" feeling you describe. If the obligation were merely a matter of moral assurance, then unilateral withdrawal would be *permissible provided I pay the moral cost* (e.g., apologize, compensate). But in the band or the sofa scenario, the intuition is stronger: you *cannot* simply quit. It is not that you may quit if you apologize; it is that quitting without consensus is an invalid move within the practice.

  Gilbert captures this by distinguishing between **personal commitment** and **joint commitment**. A personal commitment is indeed unilaterally revisable (though perhaps blameworthy). A joint commitment, however, creates a new normative entity—the "plural subject." Because the commitment belongs to the *us* and not the *me*, no single *me* has the authority to dissolve it. This explains the asymmetry: I can change my mind, but I cannot change *our* mind alone. Bratman's individualist apparatus lacks the conceptual resources to block unilateral rescission structurally; it can only condemn it consequentially. Gilbert's view explains why the activity persists normatively even if one person mentally checks out, until the group collectively dissolves it.

  ### 2. The Specific Standing to Rebuke
  The feeling of being "genuinely wronged" implies a specific entitlement to rebuke. In your band example, if the drummer stops playing, the guitarist doesn't just feel disappointed; she feels entitled to scold the drummer *in a specific way*.

  On Bratman's Scanlonian model, the obligation arises from a general moral principle: "Do not exploit expectations you knowingly created." If this is the source of the obligation, then **anyone** who knows the moral law has standing to rebuke the defector. If I break a promise to you, a third party can say, "That was morally wrong."

  But in joint action, the standing to rebuke is special. A bystander watching us move a sofa cannot rebuke me for dropping my end; only *you*, my co-actor, can. This suggests the obligation is not owed to humanity or morality in general, but specifically to the co-participants as a body. Gilbert's joint commitment explains this perfectly: the obligation is generated by the commitment itself, which binds the parties to each other. The right to rebuke is an internal feature of the "plural subject." Bratman's reduction to general moral norms washes out this special standing. If the norm is just "don't hurt others' expectations," the specific authority of the partner is lost, reduced to the generic authority of any moral agent.

  ### 3. The Insufficiency of Assurance
  Bratman relies on a Scanlon-style principle (often Principle F in *What We Owe to Each Other*) to ground the obligation: if I assure you I will do X, and I intend for you to rely on that, I must do X unless you release me.

  There are two fatal flaws in applying this to the sofa/band cases:

  1.  **The Lack of Explicit Assurance:** In casual joint action, we rarely exchange explicit assurances. We just start lifting, or we just start playing. Bratman must argue that our actions *imply* assurance. But Gilbert argues that the obligation arises from the **expression of readiness** to participate in a joint commitment, not from an attempt to induce reliance. The normative glue is formed the moment we openly express willingness to be bound together, not when one party calculates the reliance of the other.
  2.  **Bilateral vs. Multilateral Structure:** Assurance is typically bilateral (A assures B). Joint action is often multilateral and circular (A and B commit to A-and-B as a unit). In the band, I don't just assure the drummer; I commit to the *band*. If the drummer leaves, I am not just released from an assurance to him; the *band's* activity is disrupted. Gilbert's model accounts for this circularity: we each commit to the joint commitment. Bratman's model struggles to aggregate individual assurances into a collective bond that requires collective rescission.

  ### 4. The Phenomenology of the "We"
  Finally, consider the intuition that "none of us could unilaterally end the whole thing." This suggests that the unit of agency is not the individual, but the group. When we are moving the sofa, there is a temporary "we" that is the agent of the lifting.

  If Bratman is right, there is no "we," only an "I" and a "You" coordinating. If I drop the sofa, *I* have stopped acting. But the phenomenology suggests that *we* have been stopped, and I am responsible for stopping *us* without authority. Gilbert's *sui generis* joint commitment posits that we have indeed created a new subject. This explains why the remaining parties feel the activity is still "in force" despite the defector's change of heart. The commitment exists independently of the fluctuating mental states of the individuals once established. It hangs over us until we collectively take it down.

  ### Conclusion
  Bratman provides an excellent account of the *psychology* of coordination, but he fails to account for the *normativity* of joint action. By reducing the obligation to a general moral norm against exploiting expectations, he renders unilateral withdrawal a moral violation but leaves the *structure* of the intention individually sovereign. This cannot explain why the partners feel the defector lacked the *authority* to quit, nor why only the partners have the *standing* to rebuke.

  Gilbert is right because only a *sui generis* joint commitment creates a normative bond that is distinct from the sum of individual moral obligations. It creates a plural subject where the commitment belongs to the "us," making unilateral rescission structurally impossible rather than merely morally costly. The asymmetry you noticed—between the revisability of personal intention and the stability of joint action—is not a bug of social life; it is the defining feature of the joint commitment that makes shared agency possible.
