      *   Make sure to mention the Independence Axiom, as that's the crux of the Allais debate.
      *   Check the Yaari mention: Yaari is Dual Theory (linear utility, non-linear probability). Quiggin is RDU (non-linear utility, non-linear probability). Buchak is REU (non-linear utility, non-linear probability/risk). Buchak is closer to Quiggin than Yaari. I should clarify that distinction briefly so the user doesn't conflate Yaari and Quiggin too much.

