      *   **Highlight the Divergence:** The split is Descriptive (Quiggin) vs. Normative (Buchak).
      *   **Address the "Teeth":** Buchak's contribution is the axiomatic foundation that rehabilitates the violation of Independence as rational, whereas Quiggin treats it as a systematic bias.
      *   **The "Two Sentences":** Needs to capture Math ≈ Same, Purpose ≠ Same.
      *   **The "Bet":** RDU explains the *mechanism* of the bias better (probability weighting is empirically robust), but REU explains the *rationale* better (it's not a bug, it's a feature).

  6.  **Refining the "Two Sentences":**
      *   *Draft 1:* Mathematically, Buchak's REU and Quiggin's RDU are nearly identical structures that both weight probabilities non-linearly. The difference is that Quiggin uses this to describe psychological errors in how people perceive odds, while Buchak argues this weighting represents a rational preference for security that violates Expected Utility's independence axiom.
      *   *Critique 1:* A bit long.
      *   *Draft 2:* Formally, Buchak's risk-weighted utility and Quiggin's rank-dependent utility are mathematical cousins that both transform probabilities to explain Allais-style choices. The substantive split is philosophical: Quiggin treats this transformation as a descriptive quirk of human psychology, whereas Buchak defends it as a normative requirement of rational agency.
      *   *Critique 2:* Better. "Mathematical cousins" is safe. "Descriptive quirk" vs "Normative requirement" hits the nail on the head.

  7.  **Refining the "Bet" on Explanatory Work:**
      *   Need to be careful. If the article is about *rationality*, Buchak wins. If it's about *behavior*, Quiggin/Kahneman wins.
      *   The prompt asks: "whose account you think does more actual explanatory work for why someone would pay a premium for certainty."
      *   "Why" is ambiguous. I should distinguish between *causal explanation* (RDU) and *justificatory explanation* (REU).
      *   Actually, Quiggin's specific weighting function (inverse S-shape) fits the Allais data slightly better than a simple convex risk function, because Allais specifically hinges on the jump from $p=0.99$ to $p=1.0$. Buchak's function *can* model this, but Quiggin's was built *for* this. However, Buchak's point is that the *reason* for the jump is rational concern for the "sure thing," not just cognitive overweighting.
