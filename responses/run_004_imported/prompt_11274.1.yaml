  can you invent a different gamble -- not the Altadena variant Nover and Hajek also cooked up, and not just a rescaled Pasadena -- that runs into that same undefined-expectation problem for the same underlying reason (conditional, not absolute, convergence)? briefly show why the sum isn't absolutely convergent for your example, and give me your take on whether this is genuinely a different kind of problem for expected utility theory than plain St. Petersburg-style divergence, or just the same issue wearing a costume.
