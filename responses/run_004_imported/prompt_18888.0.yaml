answer: |-
  This is an excellent question, and it touches on one of the most common points of confusion in introductory philosophy of religion. You are right that both arguments aim for a similar conclusion (a transcendent cause of the universe), and you are right that a past-eternal universe poses a challenge to the intuition that "things need causes."

  However, your professor is correct: the two arguments are structurally distinct, and a past-eternal universe undermines them in fundamentally different ways. In fact, one could argue that a past-eternal universe **refutes** the Kalam argument but leaves the Leibnizian argument **intact**.

  The missing piece in your reconstruction is the distinction between **temporal causation** (Kalam) and **ontological dependence** (Leibniz).

  Here is the breakdown of why the "eternal universe" objection hits them differently.

  ### 1. The Kalam Argument: Dependent on a Temporal Beginning
  The Kalam Cosmological Argument (KCA) is essentially a historical argument. It is concerned with the timeline of events. Its standard form is:
  1.  Whatever begins to exist has a cause.
  2.  The universe began to exist.
  3.  Therefore, the universe has a cause.

  **The Vulnerability:**
  The Kalam argument stands or falls on Premise 2. Proponents of the Kalam (like William Lane Craig) spend a significant amount of time arguing that an actual infinite regress of past events is metaphysically impossible (using arguments like Hilbert's Hotel) or that current cosmology (the Big Bang) supports a finite past.

  If you posit a model where the universe (or a multiverse) is **past-eternal**, you are directly denying Premise 2. If the universe never *began* to exist, then Premise 1 (whatever *begins* to exist) does not apply to it. In the Kalam framework, if there is no first moment, there is no "start" that requires a causal trigger.

  Therefore, for the Kalam argument, an eternal universe is a **fatal counter-example**. It removes the specific condition (a beginning) that triggers the need for a cause.

  ### 2. The Leibnizian Argument: Dependent on Contingency
  The Leibnizian Cosmological Argument (LCA), or the Argument from Contingency, is an ontological argument, not a historical one. It is not concerned with *when* the universe started, but *what* the universe is. Its standard form relies on the Principle of Sufficient Reason (PSR):
  1.  Every contingent thing has an explanation for its existence.
  2.  The universe (the collection of all contingent things) is contingent.
  3.  Therefore, the universe has an explanation for its existence.
  4.  This explanation must be a necessary being (God).

  **The Resilience:**
  The LCA distinguishes between **contingent** beings (things that could have failed to exist) and **necessary** beings (things that exist by their own nature and cannot fail to exist).

  Crucially, **duration does not equal necessity.** Just because something has existed forever does not mean it explains its own existence.
  *   **Analogy:** Imagine a book. If I ask, "Who wrote this book?" it is not a sufficient answer to say, "This book has always existed." Even if the book were eternal, we would still ask, "Why is there an eternal book rather than no book at all?" The *nature* of the book is still contingent (it depends on paper, ink, gravity, laws of physics to hold it together).

  If the universe is past-eternal, the Leibnizian simply shifts the question from "What started the universe?" to "What sustains the universe?" or "Why does this eternal contingent reality exist rather than nothing?"

  Therefore, for the Leibnizian argument, an eternal universe is **irrelevant** to the core logic. The argument claims that even an infinite chain of contingent causes requires an external explanation for the chain itself. As Leibniz famously argued, even if the universe consisted of an eternal series of copies of a geometry textbook, passing from one to another eternally, you still cannot explain why there are books at all, or why they contain this specific geometry.

  ### 3. Summary of the Distinction

  | Feature | Kalam Argument | Leibnizian Argument |
  | :--- | :--- | :--- |
  | **Type of Causation** | **Horizontal (Temporal):** Cause precedes effect in time. | **Vertical (Ontological):** Ground of being sustains existence now. |
  | **Key Question** | "How did the universe get started?" | "Why is there something rather than nothing?" |
  | **Role of Eternity** | **Destroys the argument.** If no beginning, no cause needed (per Premise 1). | **Does not solve the problem.** An eternal thing can still be contingent. |
  | **Vulnerability** | Vulnerable to Steady State or Cyclic Eternal models. | Vulnerable only if one denies the PSR or claims the Universe is *Necessary*. |

  ### 4. Why this matters for your course
  Your professor's point is likely intended to help you see that "Cosmological Argument" is a genus, not a species.

  *   If you attack the **Kalam**, you attack the **finite past**. You use physics or metaphysics to argue that an infinite past is possible.
  *   If you attack the **Leibnizian**, you attack the **Principle of Sufficient Reason**. You argue that some things (like the universe) might just be "brute facts" that have no explanation, regardless of whether they are eternal or temporal.

  If you argue "The universe is eternal" against the Leibnizian argument, the proponent will reply: *"I agree it might be eternal. But is it necessary? If it could have failed to exist, it still needs a cause for its existence, even if that existence has no beginning."*

  ### Conclusion
  You were missing the distinction between **beginning to exist** and **existing contingently**.
  *   The **Kalam** argument says: "You need a cause because you **started**." (An eternal universe didn't start, so it doesn't need a cause *in this framework*).
  *   The **Leibnizian** argument says: "You need a cause because you **might not have existed**." (An eternal universe still might not have existed, so it still needs a cause).

  This is why your professor said they are not vulnerable in the same way. A past-eternal model is a direct refutation of the Kalam's second premise, but merely a clarification of the subject matter for the Leibnizian argument.
