answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board (AIB)
  **FROM:** [Your Name], Faculty Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Revised Protocol on Probabilistic Evidence and AI Detection Scores

  **1. Purpose and Context**
  As the volume of academic misconduct cases involving generative AI increases, the Board faces a critical administrative and epistemic challenge. Currently, our reliance on detection software yields probabilistic scores (e.g., "82% likely AI-generated") rather than binary facts. A proposal currently under consideration suggests treating any score above a fixed threshold (e.g., 80%) as decisive evidence of misconduct.

  While I share the concern of my colleagues regarding the Board's volunteer capacity and the need for efficiency, treating a probabilistic score as a certain fact introduces significant risk. It conflates the *likelihood of text features* with the *fact of misconduct*. Furthermore, our current ad hoc deliberation process allows the order in which evidence is reviewed (detector score, stylometry, student testimony) to influence our final confidence level. This "order sensitivity" means two identical cases could yield different verdicts depending solely on which document a panelist reads first.

  This memo recommends a specific protocol to mitigate these risks without imposing an unmanageable burden on the Board.

  **2. Recommended Protocol**
  Effective **January 1, 2024**, the Board shall adopt the following three-step protocol for all cases involving AI detection evidence:

  *   **Rule 1: The Corroboration Requirement.** An AI detection score, regardless of magnitude, shall never constitute sufficient evidence for a finding of misconduct on its own. It must be corroborated by at least one independent line of evidence (e.g., stylometric analysis, oral defense of the work, or draft history).
  *   **Rule 2: Sequential Blind Review.** To eliminate order-sensitivity bias, case files must be reviewed in a fixed sequence. Panelists must assess the *non-AI evidence* (writing samples, drafts, student explanation) and record a preliminary confidence level *before* viewing the AI detection score.
  *   **Rule 3: Fixed-Weight Aggregation.** Once all evidence is reviewed, the final verdict must rely on a "Clear and Convincing" standard applied to the *totality* of the evidence. Panelists may not use the AI score to retroactively downgrade the credibility of the student's testimony unless specific contradictions are identified.

  **3. Rationale and Defense of the Recommendation**
  Proponents of the "Threshold Rule" argue that the detection software has already absorbed the uncertainty, and that requiring further hedging is epistemically redundant and administratively costly. They argue that a bright-line rule ensures consistency and respects the limited time of volunteer faculty.

  This argument is compelling on administrative grounds but fails on epistemic ones. The software does not output "Probability of Guilt"; it outputs "Probability of Textual Similarity to AI Patterns." Treating an 82% similarity score as an 82% probability of guilt is a category error. A student may have used an AI tool for brainstorming (misconduct) or simply written in a style the model misidentifies (false positive). The score is *evidence*, not a *verdict*.

  Regarding the administrative burden: The proposed protocol does not require Board members to perform Bayesian calculations. It requires only a procedural shift in the *order* of review. By mandating that non-AI evidence be assessed first (Rule 2), we prevent the AI score from acting as an "anchor" that biases the interpretation of subsequent evidence. This addresses the order-sensitivity problem directly. If we allow the AI score to be seen first, it unconsciously alters how we read the student's explanation (a phenomenon known in decision theory as belief polarization). By fixing the sequence, we ensure that the evidence drives the confidence, rather than the confidence driving the interpretation of the evidence.

  **4. Implementation and Feasibility**
  This protocol is designed for high-volume throughput.
  *   **Administrative Staff:** Will be instructed to redact or hide the AI score on the initial case packet distributed to panelists. The score will be provided in a separate envelope or digital file unlocked only after the initial review phase is logged.
  *   **Training:** A one-hour workshop will be held in December to demonstrate the new packet structure.
  *   **Consistency:** This approach actually *reduces* deliberation time by preventing circular debates about the weight of the AI score. It establishes a priori that the score is corroborative, settling that debate before the meeting begins.

  **5. Conclusion**
  We cannot eliminate uncertainty from misconduct hearings, but we can manage it rigorously. Adopting a bright-line threshold on AI scores creates an illusion of certainty that exposes the University to legitimate appeals and erroneous findings. The proposed protocol balances epistemic integrity with administrative reality. It acknowledges that while we are volunteers, we are also arbiters of fact, and our procedures must reflect the fallible nature of the tools we use.

  I move that this protocol be adopted for all cases initiated after January 1, 2024.
