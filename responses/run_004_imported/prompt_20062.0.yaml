      *   "Date by which it would take effect": Yes.
      *   "Whether a score should ever be allowed to settle a case on its own": No.
      *   "What... about the order-sensitivity": Independent scoring before aggregation.
      *   "Defended against the strongest version of the threshold-rule position": Yes, in the "Rationale" section.

