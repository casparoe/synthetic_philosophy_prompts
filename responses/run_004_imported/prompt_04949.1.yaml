prompt: |-
  so I'm a linguistics PhD student (semantics/pragmatics side of things) but I've been sitting in on a phil of language seminar this term that's basically a slow crawl through Frege, Russell, and early Wittgenstein. Last week we spent two whole sessions on "On Denoting" and nobody actually explained the "Gray's Elegy" argument in the middle of it, they just sort of gestured past it. I'm totally fine with the actual theory of descriptions itself (Scott/Waverley, the King of France, primary vs secondary occurrence, that's all old hat by now), but the detour where Russell tries to show that the meaning/denotation distinction collapses in on itself just does not parse for me, and my professors response was basically "yeah, everyone finds this passage impossible, moving on." comforting, but not helpful.

  Here's the bit that's breaking my brain. Right after he sets up the "centre of mass of the solar system" / "first line of Gray's Elegy" examples and the convention where C stands for the denotation while 'C' stands for the meaning, he writes:

  "We say, to begin with, that when C occurs it is the denotation that we are speaking about; but when ‘C’ occurs, it is the meaning. Now the relation of meaning and denotation is not merely linguistic through the phrase: there must be a logical relation involved, which we express by saying that the meaning denotes the denotation. But the difficulty which confronts us is that we cannot succeed in both preserving the connexion of meaning and denotation and preventing them from being one and the same; also that the meaning cannot be got at except by means of denoting phrases. This happens as follows.

  The one phrase C was to have both meaning and denotation. But if we speak of ‘the meaning of C’, that gives us the meaning (if any) of the denotation. ‘The meaning of the first line of Gray’s Elegy’ is the same as ‘The meaning of “The curfew tolls the knell of parting day”,’ and is not the same as ‘The meaning of “the first line of Gray’s Elegy”.’ Thus in order to get the meaning we want, we must speak not of ‘the meaning of C’, but ‘the meaning of “C”,’ which is the same as ‘C’ by itself. Similarly ‘the denotation of C’ does not mean the denotation we want, but means something which, if it denotes at all, denotes what is denoted by the denotation we want."

  And then a paragraph later, he sums up: "Thus it would seem that ‘C’ and C are different entities, such that ‘C’ denotes C; but this cannot be an explanation, because the relation of ‘C’ to C remains wholly mysterious… This is an inextricable tangle, and seems to prove that the whole distinction between meaning and denotation has been wrongly conceived."

  Could you actually reconstruct this step by step instead of just paraphrasing it back at me? Specifically I want: (1) why moving from C to 'the meaning of C' allegedly lands you on the meaning of the denotation rather than the meaning you were actually after, (2) what precisely goes wrong, formally, when you try to patch this by adding another layer of quotation marks - i.e. why is it a genuine regress/tangle and not just Russell being cute with notation, and (3) whether this is best read as Russell attacking his own earlier (1903) view, going after Frege's sense/reference distinction specifically, or - as I've heard someone claim in a talk once - actually conflating and refuting two separate theories at the same time. I'd like the strongest version of the argument you can construct, not another summary of how everyone agrees it's "notoriously obscure."
