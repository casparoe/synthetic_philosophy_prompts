answer: |-
  The bank notification on the tablet glowed green: **$1,000,000.00 DEPOSITED.**

  On the table between them, the glass vial sat uncorked. The toxin inside was viscous, amber-colored. It wouldn't kill, but the prospectus had been clear: twelve hours of agony, followed by a full recovery.

  Sarah leaned back in her chair, arms crossed. Julian stared at the vial.

  "It's done," Sarah said. "The causal chain is severed. The money is in the account. The billionaire's verification scan happened yesterday. He found what he was looking for: an intention. You have the reward. Do not drink the poison."

  Julian didn't look up. "If I don't drink, the intention was a lie."

  "It was a *prediction*," Sarah corrected. "Yesterday, I predicted I would drink. I qualified for the reward. Today, I have new information. The money is secured. The utility calculation has updated. Drinking now yields negative utility: pain plus zero additional dollars. A rational agent maximizes utility from the current node forward. Not drinking is the only sophisticated choice."

  "A rational agent is more than a sequence of temporal slices," Julian said. He reached out, his fingers hovering over the glass. "Rationality is a property of the whole agent across time. If I abandon the plan now, I admit that my agency is fragmented. I am saying that 'Yesterday Julian' is a different person than 'Today Julian.' If I do that, I cannot plan. I cannot commit. I become a leaf in the wind of changing incentives."

  "You're confusing integrity with stubbornness," Sarah said. "This is the sunk cost fallacy dressed in normative clothing. The 'cost' of forming the intention is already paid. The 'reward' is already received. Why poison yourself to satisfy a ghost?"

  "Because the ghost is me," Julian said. "McClennen called it resolute choice. I stick to the plan not because the plan commands it, but because *I* commanded it. To renege is to engage in self-deception. It is to claim I intended something I never truly bound myself to."

  Sarah leaned forward, her eyes sharp. "That's my first question, Julian. What separates this 'resolute choice' from simple akrasia? You're advocating for an agent that ignores current evidence to satisfy a past preference. If I tie myself to the tracks to force myself to take the train, am I rational? Or am I just manipulating my own future utility function to punish myself? How do you distinguish 'plan stability' from 'refusal to update'?"

  Julian paused. He withdrew his hand from the vial but didn't step back. "It's the difference between a policy and a whim. If you know you will renege when the price changes, you are not an agent who can intend. You are a simulator of agents. The distinction is functional: Can you participate in agreements that require follow-through when incentives shift? If your answer is 'no,' then you are functionally untrustworthy, even to yourself. I drink to maintain the integrity of my decision algorithm. If I don't, I degrade my own capacity to intend in the future."

  "But you can't degrade a capacity you don't have," Sarah countered. "You can't intend to do what you know you won't do. That was Kavka's point. Yesterday, you thought you would drink. You were wrong. That's not a moral failure; it's a calibration error. I'm updating on the reality that pain is bad. You're updating on... what? Aesthetic consistency?"

  "I'm updating on the fact that I am a single entity," Julian said. "But let's turn the lens. You say you intended yesterday. You say you qualified. The billionaire wired the money." He tapped the tablet. "This implies his verification mechanism was satisfied. He didn't just scan for a fleeting hope; he scanned for a disposition."

  Julian looked at her. "Here is my question: If you are a sophisticated chooser, you perform backward induction. Yesterday, you knew that today, you would look at this vial and see no reason to drink. You knew today's Sarah would be rational in the sophisticated sense. So yesterday, you knew you would not drink. If you knew you would not drink, you could not have intended to drink. If you could not intend, the billionaire should not have wired the money."

  Sarah smiled, a thin, tight expression. "You assume the billionaire is omniscient. He's just reliable. He scanned my brain state *yesterday*. Yesterday, my neural pathways were aligned with drinking. I genuinely believed I would do it. I wasn't lying. I just didn't anticipate my own rationality."

  "Then you were irrational yesterday," Julian said.

  "No. I was rational relative to yesterday's information set," Sarah said. "I expected the pain to be worth the million. But the million wasn't contingent on the pain. It was contingent on the intention. Once the intention secured the bag, the pain became pure cost. A reliable billionaire doesn't need to see the future; he just needs to see the present state of the agent. He saw a person who intended to drink. He paid. That person is gone. I am the person who has the money."

  "So you're saying the billionaire was fooled?"

  "I'm saying the billionaire bought a yesterday-person," Sarah said. "And I am the today-person. I inherit the assets, not the obligations. If the billionaire wants a resolute agent, he should have hired one. He hired me. I delivered the intention. The contract is fulfilled."

  "And if everyone acts like you," Julian said, his voice low, "the billionaire stops offering the deal. If sophisticated choice is the universal norm, no one ever gets the million. Because no one can ever form the intention required to trigger the payout. You are free-riding on the existence of resolute agents who make the offer credible."

  "Maybe," Sarah conceded. "But I'm not everyone. I'm me, in this room, with this money. In a world where I am the only sophisticated agent, I win. I have the million, and I have my health. You will have the million, and you will spend tomorrow vomiting."

  "I will have the million," Julian said, picking up the vial. The liquid swirled. "And I will have the knowledge that I am the kind of entity that can win Newcomb problems, Parfit's Hitchhiker, and this one. Because I don't fracture when the timeline shifts."

  "You'll have a stomach ache," Sarah said. "And you'll call it virtue."

  "I'll call it agency," Julian said.

  "Then drink," Sarah said, gesturing to the open vial. "Prove you're not a sequence of snapshots. Prove you're a line."

  Julian held the glass to the light. He looked at the bank notification, then at the toxin. He knew the pain was coming. He knew the money was already his. He knew that drinking changed nothing about the past, and everything about his future.

  "If I drink," Julian said, "I validate the mechanism that put the money here. If I don't, I admit the money was a mistake."

  "The money *was* a mistake," Sarah said softly. "It was a tax on your inability to let go of the past."

  Julian uncorked the vial fully. The smell was metallic, sharp. "Or it was a dividend on my ability to hold on."

  "Julian," Sarah said, standing up. "Don't be a martyr for a decision theory that requires you to suffer for no gain."

  "And don't be a ghost," Julian replied. "Here today, gone tomorrow, never bound by anything but the immediate incentive."

  He raised the vial. Sarah didn't stop him. She simply watched, calculating the utility loss in real-time, wondering if the integrity of his algorithm was worth the price of admission, wondering if she would have won if she had been born unable to update.

  Julian tilted his head back. The liquid touched his lips.

  Outside, the sun rose on a new day. Inside, the money sat in the account, and the choice hung in the air, unresolved, as the toxin went down.
