answer: |-
  You are not losing your mind. In fact, you have stumbled directly into one of the oldest, thorniest problems in the philosophy of causation. It is called **the problem of causation by omission.**

  Legal philosophers (like H.L.A. Hart and Tony Honoré) and metaphysicians have argued about this for decades. Your intuition is correct: physically speaking, there is no difference between "Dave didn't press the button" and "I didn't press the button" and "The Queen of England didn't press the button." In all three cases, a button press did not occur, and the machine did not start.

  If we define cause strictly as "a counterfactual condition without which the event would not have happened," then Dave, you, the CEO, and the Queen are all equally causal factors.

  So, how do we separate "Dave's omission" from "The Queen's omission" without just resorting to "because we feel like blaming Dave"? There *is* a principled way to do this, but it requires shifting from **physics** to **norms**, and from **individual action** to **system design**.

  Here is the framework for untangling this.

  ### 1. The Filter of "Normative Expectation"
  We do not select causes based on physics alone; we select them based on **models of how the world is supposed to work.**

  Philosophers distinguish between **background conditions** and **abnormal conditions**.
  *   **Background Condition:** Oxygen was present in the room. (True, and necessary for the fire, but we don't call oxygen the "cause" of the fire because it's always there.)
  *   **Abnormal Condition:** Someone struck a match. (This deviates from the expected state, so we label it the cause.)

  In the case of omissions, we apply a **Normative Expectation Filter**. We ask: *Who was expected to act?*
  *   **You:** You were not expected to monitor Dave's cron job. Your omission is a background condition.
  *   **The Queen:** She has no jurisdiction over your servers. Her omission is a background condition.
  *   **Dave:** He owns the service. There is a professional norm and a specific assignment that creates an expectation of action. His omission is an **abnormal condition**.

  So, Dave is right that physically, his inaction is the same as yours. But he is wrong that socially and functionally, they are the same. We pick his omission as a cause because it violated a specific **duty of care**.

  **However,** this is where your team made the mistake. Identifying the violation of duty is useful for *performance reviews*, but it is useless for *postmortems*.

  ### 2. The Trap of "Human Error" as Root Cause
  Your team stopped at the Normative Expectation Filter. They found the person who broke the norm (Dave) and declared that the Root Cause.

  In Site Reliability Engineering (SRE) and safety science (like the work of Sidney Dekker or John Allspaw), this is considered a failure of the investigation. If the root cause is "Dave didn't do the thing," the implication is that the system works fine as long as Dave is perfect.

  **Dave's pushback was actually a signal that the postmortem was failing.** When an engineer argues "why me and not everyone else?", they are pointing out that the system relies on individual vigilance rather than systemic safeguards.

  A truly blameless postmortem asks: **Why was it possible for Dave to fail?**

  *   **Why was the cron job silent?** Cron jobs should email on failure by default. Why was that suppressed?
  *   **Why was alerting manual?** Why does Dave have to remember to add an alert, rather than the platform adding a "job failed" alert automatically?
  *   **Why was the cert expiration not monitored by a separate system?** Certificate expiration is a known, high-risk event. Why is it reliant on a single cron job success rather than an external checker?

  ### 3. Causal Salience vs. Causal Responsibility
  To answer your specific question: *Is there a principled way of picking out which non-actions count?*

  Yes. We use **Causal Salience**. We select the omission that is the **most actionable leverage point** to prevent recurrence.

  *   **Dave's Omission:** High salience. If he fixes it, this specific job is safe.
  *   **Your Omission:** Low salience. If you start monitoring Dave's job, we now have two people doing redundant work, and we still rely on humans remembering things.
  *   **The System's Omission:** Highest salience. If the system *automatically* alerts on cron failure, it doesn't matter if Dave forgets, or if Dave gets hit by a bus, or if Dave is replaced by an intern.

  Your team identified the **Proximate Cause** (Dave didn't alert).
  Dave identified the **Infinite Regress** (Nobody alerts for everything).
  The **Root Cause** is actually: **The system allows critical jobs to fail silently.**

  ### 4. How to Reframe This (For Your Own Sanity)
  You feel your brain breaking because you are trying to reconcile two conflicting frames:
  1.  **The Accountability Frame:** Dave owns this, so it's his fault.
  2.  **The Physicalist Frame:** Anyone could have prevented this, so blaming Dave is arbitrary.

  The solution is the **Systemic Frame**.

  Dave *is* professionally responsible for the service. That is a fact of his employment. But his "not-doing" is only a useful cause if it leads to a fix that doesn't rely on Dave remembering next time.

  If the postmortem action item is "Dave will add an alert," you have learned nothing. Dave might forget the next alert.
  If the postmortem action item is "All cron jobs must pipe stderr to a monitoring channel by default," you have fixed the system.

  ### Summary
  To answer your question directly:
  **Is "not doing something" genuinely different in a causal sense?**
  Physically? No.
  Functionally/Normatively? Yes, but only if that omission violates a specific expectation *and* fixing it provides a leverage point for prevention.

  **Was the team right to call it the root cause?**
  No. They confused **responsibility** (who owns the service) with **causality** (what allowed the failure).

  **Was Dave right?**
  He was right that picking him out feels arbitrary if the standard is "anyone could have prevented this." But he was wrong to imply that his role doesn't make his omission more salient than yours.

  **The Verdict:**
  The outage was not caused by Dave failing to add an alert. The outage was caused by **a culture where alerting is optional and manual rather than mandatory and automated.** Dave is the person whose job it is to fix that, but he is not the *cause* of the vulnerability.

  If you want to fix the brain-break, stop asking "Who caused this?" and start asking "What condition allowed this?" The condition wasn't Dave's brain; it was a system that permitted silence.
