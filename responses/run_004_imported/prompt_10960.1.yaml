      *   **Core Conflict:** Bayes' Theorem suggests confirmation happens when $P(E)$ increases given $H$. If $E$ (Mercury's orbit) is already known ($P(E) = 1$), then $P(E|H) = P(E)$, so the likelihood ratio is 1, and no confirmation occurs.
      *   **Requirements:**
          1.  Explain *why* this is a genuine philosophical bind, not just math pedantry.
          2.  Walk through the main solutions in plain English (logical omniscience, counterfactuals, etc.).
