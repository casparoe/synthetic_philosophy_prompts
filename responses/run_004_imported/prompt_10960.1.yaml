answer: |-
  You have stumbled onto one of the most famous and persistent headaches in the philosophy of science. You are absolutely right about the basics: this is the **Problem of Old Evidence**, crystallized by Clark Glymour in his 1980 book *Theory and Evidence*, though it had been brewing in the 70s.

  It is not just technical pedantry. If Bayesianism is supposed to be the "logic of science," and it cannot account for the confirmation of General Relativity (GR) by Mercury's orbit, then it fails to describe one of the greatest triumphs in scientific history.

  Here is the breakdown of why this is a genuine bind, the main escape routes philosophers have built, and the verdict on whether they hold water.

  ### 1. The Bind: Why $P(E) = 1$ Kills the Update

  To see why this is a crisis and not a quirk, we have to look at how Bayesians measure "confirmation."

  In Bayesian terms, a hypothesis ($H$) is confirmed by evidence ($E$) if learning $E$ increases your confidence in $H$. Mathematically, your new confidence (posterior) should be higher than your old confidence (prior).
  $$P(H|E) > P(H)$$

  Using Bayes' Theorem, this increase depends on the ratio of how likely the evidence is given the hypothesis, versus how likely the evidence is anyway:
  $$\text{Confirmation Factor} = \frac{P(E|H)}{P(E)}$$

  **Here is the trap:**
  1.  **The Evidence ($E$):** The anomalous precession of Mercury's perihelion. This was measured in 1859. By 1915, when Einstein finished GR, $E$ was a known fact.
  2.  **The Probability of Known Facts:** In standard probability theory, if you know something is true, its probability is 1. So, $P(E) = 1$.
  3.  **The Implication:** Einstein showed that GR *entails* Mercury's orbit. If $H$ is true, $E$ *must* be true. So, $P(E|H) = 1$.
  4.  **The Result:** The ratio is $\frac{1}{1} = 1$.

  If the factor is 1, there is no update. Your confidence in GR after calculating Mercury's orbit should be exactly the same as it was before. According to strict Bayesian calculus, **Einstein gained zero confirmation from Mercury.**

  **Why this isn't just math pedantry:**
  If Bayesianism claims to model how rational agents update beliefs based on evidence, and it says that explaining known data provides *no support* for a new theory, then it contradicts the actual practice of science. Scientists constantly judge theories by how well they explain existing data (e.g., evolutionary biology explaining the fossil record that existed before Darwin). If the math says this is irrational, the math is out of touch with reality.

  ### 2. The Escape Routes

  Philosophers and statisticians have spent 40 years trying to wiggle out of this. Here are the three main strategies in plain English.

  #### A. Relaxing "Logical Omniscience" (The Garber Solution)
  **The Idea:** Standard Bayesianism assumes agents are "logically omniscient." It assumes that if you believe $H$, and $H$ logically implies $E$, you *automatically* know $E$ follows from $H$.
  **The Fix:** Real scientists aren't gods. Einstein didn't know GR solved Mercury's orbit the moment he conceived GR. He had to do months of grueling math to discover the *logical connection* between his theory and the old data.
  **How it works:** Instead of updating on $E$ (which is old), you update on the new proposition: **"$H$ implies $E$."**
  *   Before the math: You believe $H$ is plausible, you know $E$ is true, but you don't know if $H$ explains $E$.
  *   After the math: You learn the new fact that "$H$ entails $E$."
  *   This new logical fact *does* have a probability less than 1, so it *can* shift your credence in $H$.

  **Does it work?**
  It's very popular because it matches psychological reality. However, it requires breaking the standard rules of Bayesian logic (which demand logical omniscience). You have to build a more complex system that allows for "learning logic," which makes the math much messier.

  #### B. Counterfactual Credences (The "Time Travel" Solution)
  **The Idea:** If the problem is that $P(E) = 1$ because we know $E$ now, let's pretend we don't.
  **The Fix:** We ask a counterfactual question: "What would my confidence in $E$ have been *if* I did not know $E$ was true, but I did know $H$?"
  **How it works:** You artificially strip $E$ from your background knowledge (creating a state $K - \{E\}$). You then calculate how well $H$ predicts $E$ in that imaginary state.
  *   If GR makes Mercury's orbit highly probable in this imaginary state, but Newtonian physics makes it unlikely (or requires ad-hoc fixes), then GR is confirmed relative to Newton.

  **Does it work?**
  It's intuitive, but it's subjective. How do you calculate a probability for something you know is a fact? It relies on "ur-priors" (primal beliefs before evidence), which are hard to define. Critics argue this turns science into a game of "what if" stories rather than a calculation based on actual evidence.

  #### C. The Comparative Approach (It's a Tournament, Not a Solo)
  **The Idea:** Confirmation isn't absolute; it's relative to rival theories.
  **The Fix:** Don't ask "Does $E$ confirm $H$?" Ask "Does $E$ confirm $H$ *more* than it confirms $H_{rival}$?"
  **How it works:** Even if $P(E) = 1$, the *likelihood* of $E$ might differ between theories.
  *   For Newtonian physics, Mercury's orbit is an anomaly. To make it fit, you have to add ad-hoc assumptions (like a hidden planet, Vulcan). So, $P(E | \text{Newton} + \text{Auxiliary})$ is low or messy.
  *   For GR, Mercury's orbit falls out naturally from the field equations. $P(E | \text{GR})$ is "clean."
  *   Bayesians using this approach argue that the "cost" of the auxiliary assumptions in Newton lowers its probability, allowing GR to win even if $E$ is old.

  **Does it work?**
  This is how most working scientists think, but purists argue it dodges the formal problem. Technically, if $E$ is in the background knowledge, it should be conditioned out for *both* theories equally. But this approach is often the most pragmatic for historians of science.

  ### 3. The Verdict: Is it still an open wound?

  **Yes, but it's scarred over.**

  There is no consensus solution that satisfies everyone.
  *   **Formal Bayesians** tend to prefer the **Logical Omniscience** fix (modifying the math to allow for learning implications).
  *   **Subjective Bayesians** tend to prefer the **Counterfactual** fix (it's about your personal state of belief).
  *   **Pragmatists** ignore it, arguing that Bayesianism is a normative tool (how we *should* think), not a descriptive one (how we *do* think), so the Mercury case is just a limitation of the idealized model.

  **The "Open Wound" status:**
  It remains a major topic in philosophy of science journals. If you write that "Bayesians solved this," you will get pushback. If you write that "This proves Bayesianism is broken," you will also get pushback.

  **The nuance for your piece:**
  The Problem of Old Evidence highlights a tension between **discovery** and **justification**.
  *   **Discovery:** The historical process (Einstein struggling with math).
  *   **Justification:** The logical structure (GR entails Mercury).

  Bayesianism is great at modeling *new* data (prediction). It struggles with *old* data (explanation). The Mercury case shows that **explanatory power** (the ability of a theory to make sense of existing chaos) carries weight that raw probability calculus struggles to capture without some philosophical duct tape.

  ### Summary for your writing:
  1.  **The Bind:** If evidence is already known ($P=1$), standard Bayes says it can't boost a new theory's probability.
  2.  **The Stakes:** This implies Einstein got no credit for Mercury, which contradicts scientific history.
  3.  **The Fixes:**
      *   *We aren't gods:* We update on learning the *connection*, not the evidence.
      *   *Time Travel:* We pretend we didn't know the evidence to judge the theory's predictive power.
      *   *Competition:* GR wins because it explains the old data *without* cheating (ad-hoc assumptions), unlike Newton.
  4.  **The Truth:** It's still debated. It shows that scientific reasoning involves narrative and explanation, not just number-crunching.

  This is a fantastic rabbit hole for your piece because it humanizes the math. It shows that even the "logic of science" has to grapple with the fact that scientists are human beings who learn things over time, not calculators that instantly know all logical consequences of their ideas.
