answer: |-
  The marker squeaked as Elena circled the Blue quadrant on the whiteboard. The seminar room was emptying out, but the 2x2 grid remained: Red/Blue on the vertical, HQ/Second on the horizontal.

  "It's the invariance, Marcus," Elena said, capping the marker. "Minimizing cross-entropy is the unique method that preserves the structure of the probability space under a change of constraints. You get a coherent posterior."

  Marcus leaned against the lectern, arms crossed. "Coherent, maybe. But intuitive? Look at the numbers you derived. Judy gets a message about *Red* territory. Specifically, the ratio of HQ to Second Company *within* Red. Yet your posterior shifts the probability of Headquarters *within Blue*. Why does a radio message about the Red sector change the odds of where she is in the Blue sector? The prior ratio there was 1:1. Your method makes it something else."

  "Because the probabilities sum to one," Elena countered, tapping the grid. "You're treating the four quadrants as four isolated buckets. They aren't. They're a unified distribution. When you impose the constraint $P(HQ|Red) = 3/4$, you are carving out a subspace of admissible distributions. Minimizing KL-divergence finds the point in that subspace closest to the prior. That 'closest point' requires a global adjustment."

  "It requires a global adjustment because the method assumes a dependency that isn't there," Marcus said, pushing off the lectern to grab a different colored marker. "This is the partition dependence problem. If I describe the space not as four quadrants but as 'Red-HQ', 'Red-Second', and 'Blue' (lumping the Blue side), your minimization yields a different result. The output depends on how finely I carve the atoms. That's arbitrary."

  Elena shook her head. "The algebra isn't arbitrary. It's given by the problem. Judy is in one of four locations. If you lump Blue, you've lost the resolution to even ask about the HQ/Second split there later. You're solving a different problem."

  "I'm solving the problem of *irrelevance*," Marcus insisted. He drew a box around the Blue quadrants. "The evidence is silent on Blue. A surgical update rule should act like a scalpel, not a sledgehammer. We need a rule that says: Update the conditional probability in Red to 3/4, but hold the marginal probability of Blue fixed, and hold the conditional probability within Blue fixed."

  "Ah," Elena smiled sharply. "Now you're adding constraints. You want to fix $P(Blue)$ and $P(HQ|Blue)$. Where do those constraints come from? They aren't in the radio message. They're in your head."

  "They come from the principle of minimal mutilation," Marcus said. "If the evidence doesn't touch Blue, don't touch Blue. Your method implicitly assumes that learning about the internal structure of Red gives me information about the internal structure of Blue. Why? Is there a causal link? No. It's an artifact of the entropy metric."

  "It's not an artifact; it's a consequence of treating probability as information," Elena said. "When you learn the ratio in Red is 3:1, you've learned that the 'HQ' property is more informative than you thought relative to the 'Second' property. Since the prior was uniform, that informativeness ripples. If you insist Blue stays frozen, you are effectively asserting that the event 'Red' is probabilistically independent of the event 'HQ' in a way that contradicts the new constraint. You're smuggling in an independence assumption."

  Marcus wrote $P(HQ|Blue) = 1/2$ on the board. "I'm not smuggling independence. I'm respecting the content of the signal. The signal was: 'If Red, then 3-to-1.' It wasn't 'The world is now structured such that cross-entropy is minimized.' If I adopt your rule, I have to tell Judy: 'The message said nothing about Blue, but I'm going to update your belief about Blue anyway.' She'll ask why. 'Because math,' I say? That's not epistemology; that's numerology."

  "Better than saying 'Because it feels like I shouldn't change it,'" Elena shot back. "Your 'surgical' rule collapses into ad-hocery. Which partitions get frozen? If the message had been 'If HQ, then 3-to-1 Red,' would you freeze the Second Company split? You need a general principle for what stays fixed. MCE provides one: minimize information gain. You provide... intuition?"

  "I provide a principle of *relevance*," Marcus said, underlining the word. "We can formalize it. We look for the posterior $Q$ that satisfies the constraint, but maximizes the entropy *distance* from the constraint variable on the orthogonal partition. Basically, we treat the Blue marginals as nuisance parameters we don't touch."

  "But that's just MCE with extra Lagrange multipliers!" Elena laughed. "You're minimizing cross-entropy subject to the original constraint *plus* your 'irrelevance' constraints. You're just dressing up your intuition as math. And you still haven't justified *why* those extra constraints hold. In a maximum entropy framework, assuming things are independent without evidence is just as dogmatic as assuming they're dependent."

  Marcus paused, marker hovering over the Blue quadrant. "It's not about independence. It's about the *source* of the uncertainty. The uncertainty in Red was resolved (partially) by the radio. The uncertainty in Blue wasn't touched. To shift the Blue ratio is to claim the radio signal resolved uncertainty there. It didn't."

  "And to keep the Blue ratio fixed is to claim the radio signal provided *no* reason to re-evaluate the relationship between HQ and Second Company globally," Elena said, stepping closer to the board. "Look, if the prior wasn't uniform—if HQ was already generally more likely than Second across the map—would you still freeze Blue at 1:1?"

  Marcus hesitated. "If the prior wasn't uniform... then the 'no news' baseline is the prior ratio. So I'd keep $P(HQ|Blue)$ equal to the prior $P(HQ|Blue)$."

  "Exactly," Elena said. "So you're preserving the prior odds in the absence of evidence. But MCE does exactly that *unless* the constraint forces a trade-off. The trade-off exists because probability mass is conserved. You can't squeeze Red without pushing against Blue. If you refuse to push against Blue's internal structure, you have to push against Blue's *marginal* probability even harder to compensate. Which is worse? Shifting the internal ratio of Blue, or shifting the probability that Judy is in Blue at all, when the message said nothing about location?"

  Marcus capped his marker. The squeak echoed in the quiet room. "Shifting the marginal is bad enough. But shifting the conditional... it implies the terrain in Blue changed because the terrain in Red did. That's action at a distance."

  "It implies the *map* changed," Elena corrected. "Not the terrain. The map is a single object. You can't tear out the Red corner without wrinkling the Blue one. That's the price of coherence."

  "Maybe," Marcus said, wiping the Blue quadrant clean with his sleeve. "Or maybe it's the price of using the wrong tool for a modular world."

  He turned off the lights, leaving the grid in the dark. "Same time next week? I'm bringing the Wagner field kinematics paper."

  "Bring it," Elena said. "I'll bring the proof that kinematics is just MCE in disguise."
