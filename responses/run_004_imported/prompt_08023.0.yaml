answer: |-
  Friends, family, [Groom], and [Bride].

  [Bride] asked me to stand here today not just because we are friends, but because she knows how my mind works. She knows that I spend a lot of time thinking about what it means to say "I will." And she gave me a specific instruction. She told me that she has already stood at an altar like this one. She has already said the words. She knows that life is complicated, and that certainty is a rare commodity. She asked me not to offer you a fairy tale. She asked me to tell you the truth about what is happening here.

  So, I want to talk for a moment about the weight of a promise.

  We often treat a wedding vow as if it were a prophecy. We hear the words "as long as we both shall live" and we think the couple is predicting that their feelings will remain exactly as they are today, unchanged, for fifty years. If a promise is a prediction, then the first time [Bride] married, the prediction simply didn't come true. The weather changed. The landscape shifted. That is not a moral failure; that is just the reality of being human.

  But if a vow is only a prediction, it is worthless. We cannot control the future. We cannot promise that we will not change, or that we will not struggle.

  So, if we aren't predicting the future, what are we doing?

  Today, [Bride] and [Groom] are not making a prediction. They are building a structure.

  When you make a promise like this, you are not describing how you feel. You are creating a new obligation that did not exist before. You are voluntarily giving up a piece of your freedom. You are saying to the other person: "I am giving you the authority to hold me accountable, even on the days when I do not feel like staying."

  The first time [Bride] stood at an altar, she was promising based on certainty. She knew what she felt, and she assumed that feeling was enough to carry the weight of the vow.

  Today, the promise is different. It is stronger, precisely because it is more humble. This vow does not rely on the certainty of feeling. It relies on the strength of the bond you are forging right now. You are binding yourselves together not because you know exactly who you will be in ten years, but because you trust the person you are becoming *with* each other.

  This is why this promise can hold when others might not have. It binds you not because it is easy, but because it is chosen. You are acknowledging that there will be days when the love feels like a burden, and on those days, this vow is not a shackle; it is a map. It reminds you that you have already decided, in a moment of clarity, that this relationship is more important than your temporary desire to walk away.

  To the families here: your role is not just to celebrate the joy of today. Your role is to witness the seriousness of the constraint. When you applaud at the end of this ceremony, you are not just cheering for a party. You are agreeing to support the architecture they are building. You are acknowledging that when they stumble, we do not mock the vow for failing to predict the storm; we help them hold the line they drew together.

  [Groom], [Bride]: You are not promising that you will never want to leave. You are promising that when that thought comes—and it may—you will have a reason to stay that is bigger than the thought itself. You are promising to treat this marriage not as a contract of convenience, but as a moral project that you build together, day by day.

  That is a heavy thing to do. It is far heavier than a simple promise of happiness. But it is the only kind of promise that is real. And it is the only kind that can last.

  Let us begin.
