answer: |-
  The device on the table looked like a toaster modified by a sadist. A single chamber, a Geiger counter linked to a hammer, a vial of poison gas. Elias called it the "Branching Box." Mara called it a coffin for everyone except him.

  "You're shaking," Elias said. He wasn't. His hands were steady, resting on the laminate table. He looked tired—lines around his eyes, a slight tremor in his left leg from the stroke he'd survived three years ago. That was the thing people missed. Quantum immortality didn't stop entropy. It didn't stop cancer or heart failure. It only caught you when the universe offered a choice between *exists* and *does not exist* based on a probabilistic event.

  "I'm shaking because in ninety-nine percent of the realities generated by this machine, I am widowed today," Mara said. Her voice was flat, worn down by the last five years. "In ninety-nine percent of them, I am planning your funeral."

  "But in this one," Elias said, tapping the casing, "I am here. And because I am here, you are here with me. Consciousness follows the surviving branch, Mara. We've been over this."

  "I know the theory, Elias. I know you think you're invincible to accidents." She walked to the window, looking out at the rain. It was a mundane, non-quantum rain. "But you don't get it. You experience the continuity. You feel like you just walked through a door. I don't walk through the door with you. I stay in the room. Every time you trigger a branch, I am left behind in the reality where the odds said you should die. I am living in a statistical anomaly."

  Elias sighed. He was fifty-two, though he looked older. The stroke had taken some of his speech, but not his conviction. "It's the only way to prove it definitively. The car crash last year—the brakes failed. I should have hit the tree at eighty miles per hour. I didn't. The tree was there, the car was wrecked, but I walked away. You saw the wreckage."

  "I saw the metal," Mara corrected, turning back to him. "I saw the version of you that survived. Do you know what it feels like, Elias? To know that the husband I love is a ghost who refused to vanish? In most branches, I'm wearing black right now. I'm grieving. Here, I'm watching you strap yourself to a bomb to prove you're special."

  "It's not about being special. It's about the structure of reality." He reached for the lever. "If I'm right, I can't die from this. The mechanism relies on quantum decay. Either the isotope decays and the hammer falls, or it doesn't. If it falls, I die. If I die, my consciousness ends. I cannot experience my own end. Therefore, I must experience the branch where it doesn't fall."

  "And I?" Mara stepped forward, gripping the edge of the table. "What happens to me in the branch where you die?"

  "You live on. You grieve."

  "That's the wrinkle, Elias! That's the thing your equations don't weigh!" She slammed her hand on the table. "You say nobody follows you into the death branch. But nobody follows you into the life branch, either! I am stuck in *this* probability mass. Every time you do this, you force us into a thinner and thinner slice of reality. You are making us rare."

  Elias paused. He hadn't considered the measure of her existence, only the continuity of his own. To him, the path was straight. He never died. To her, the path was a minefield where she had to watch him step on every bomb and survive the blast.

  "I'm still aging, Mara," he said softly. "I'm not immortal. I'll die of old age eventually. I just... won't die before then. Not by accident. Not by violence. Don't you want to know? Don't you want to know that we have time?"

  "We have time anyway," she whispered. "Until you decide to test the limit again. And again. Until the odds become so impossible that living with you feels like hallucinating."

  She looked at the device. She thought about the car crash. She remembered the silence of the phone call that never came, the hours of waiting while he was trapped in the wreckage in the hospital. She remembered the doctor saying, *It's a miracle.* She hated that word. *Miracle* was just code for *statistically impossible event that traumatizes the observers.*

  "If you pull that lever," Mara said, "and the hammer falls... you won't know. But I will. I will hear the gas hiss. I will watch you stop breathing. And in that branch, I am alone. In this branch, if you survive, I am alone in a different way. I am the only version of your wife who gets to keep you."

  Elias looked at her, really looked at her, for the first time in months. He saw the gray in her hair that hadn't been there before the car crash. He saw the tremor in her hands that matched his own. He realized then that his immortality was not a gift shared, but a burden displaced. He carried the continuity; she carried the corpses of the branches that didn't happen.

  "I have to know," he said, though his voice lacked its previous certainty.

  "No," Mara said. She reached out and unplugged the Geiger counter. The hum died. The room was silent, save for the rain.

  "That doesn't stop the quantum decay," Elias argued weakly. "It's still probabilistic."

  "It stops *you* from forcing the branch," she said. "You say consciousness follows the survivor. But love... love stays in the branch where the loss happens. If you die, Elias, I stay there. I don't follow you into the miracle. I stay with the body."

  She walked around the table and took his hand. His skin was warm, fragile, mortal skin.

  "You think you're proving you live forever," she said. "But you're just proving that I have to watch you cheat death until your body finally gives out from age. Do you want me to spend the next thirty years flinching every time you cross the street? Waiting for the one branch where the quantum luck runs out?"

  Elias looked at the device. He looked at the lever that would split the world again. He realized that while he would only experience the survival, the cost was paid in the branches he abandoned. He was leaving behind a trail of grieving widows across the multiverse, and dragging this one, specific Mara through a gauntlet of improbability.

  "I thought..." he started, then stopped.

  "You thought it was about you," Mara said. She squeezed his hand. "It's not. You're the constant. I'm the variable. And I'm tired of being the exception."

  Elias slumped. The conviction drained out of him, leaving just the old man, the stroke survivor, the man who would eventually die of a heart failure that no quantum trick could stop. He pulled his hand away from the lever.

  "Okay," he said.

  "Okay," Mara echoed.

  She didn't feel relief. She felt the weight of the branches where he had pulled the lever anyway. She would always feel them. But she stood there, in this thin, miraculous slice of reality, and held the hand of the man who refused to die, hoping that this time, he would choose to live like someone who could.
