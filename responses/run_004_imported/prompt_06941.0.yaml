answer: |-
  Frederick Douglass would unequivocally support your campaign to strike the exception clause.

  To arrive at this verdict, we must resolve the tension you identified: How does the man who argued the original Constitution was a "glorious liberty document" because it *never named slavery* reconcile with the Thirteenth Amendment, which *explicitly names slavery* only to forbid it with a loophole?

  The answer lies in understanding that Douglass's "plain text" argument was never an exercise in rigid literalism. It was a political hermeneutic designed to seize the power of the state for the cause of emancipation. When the text serves liberty, he reads it strictly; when the text (or its interpretation) protects bondage, he reads it purposively. Based on his later writings on convict leasing and his evolving constitutional theory, Douglass would argue that the exception clause violates the primary command of the Thirteenth Amendment and must be removed to fulfill the Constitution's pledge of universal liberty.

  Here is the argument on Douglass's own terms.

  ### 1. The "Plain Text" Was Always a Tool for Liberty, Not an Idol
  In 1849, breaking with William Lloyd Garrison, Douglass argued that the Constitution's text, read plainly, contained no sanction for slavery. He pointed to the Preamble ("secure the Blessings of Liberty") and the absence of the words "slave" or "slavery" in the original document. He argued that because the text did not *explicitly* authorize slavery, the federal government had no power to sustain it.

  However, Douglass did not worship the text; he weaponized it. His goal was not textual consistency for its own sake, but the destruction of slavery. When the Thirteenth Amendment was ratified, the textual landscape changed. The word "slavery" was finally entered into the Constitution, but only to be annihilated. Douglass would argue that the "plain text" of the Thirteenth Amendment is the prohibitory clause: *"Neither slavery nor involuntary servitude... shall exist."* That is the command. The exception clause (*"except as a punishment for crime"*) is a subordinate qualification.

  Douglass's hermeneutic dictates that a subordinate clause cannot be allowed to swallow the primary command. If the exception allows for a system that recreates the conditions of the very thing the Amendment abolishes, it renders the primary text a nullity. For Douglass, a Constitution that permits the re-establishment of the condition it claims to destroy is a logical and moral contradiction. To remain a "liberty document," the text must be purged of provisions that license bondage.

  ### 2. The Distinction Between Penal Servitude and Chattel Slavery
  Douglass acknowledged that the state had the power to punish crime. In his view, imprisonment and hard labor as *punishment* were legitimate exercises of state authority. However, he drew a sharp moral and legal line between penal servitude and the economic exploitation of human beings.

  In his later years, particularly in the 1890s, Douglass spoke bitterly about convict leasing. He did not view it as legitimate punishment; he viewed it as a resurrection of slavery. In an 1894 speech, he noted that the South was using the exception clause to "re-enslave" Black men through arbitrary arrests and leased labor. He called it "a system of slavery... worse than the old."

  Douglass would argue that the exception clause was intended to allow for *penal confinement and labor*, not for the *commercial exploitation* of prisoners. However, because the text of the exception is broad ("involuntary servitude"), it invites the abuse he witnessed. Douglass was a pragmatist. He knew that if a legal loophole allows oppressors to recreate the conditions of chattel slavery, the loophole must be closed. He would argue that striking the exception clause is necessary to prevent the text from being used as an instrument of the very evil the Amendment was meant to kill.

  ### 3. The Teleology of the Reconstruction Amendments
  By the 1870s and 80s, Douglass viewed the Reconstruction Amendments (13th, 14th, 15th) as a "new departure" in American constitutionalism. He argued they transformed the Constitution from a compact between states into a charter of national citizenship and human rights.

  In this framework, the *spirit* of the Thirteenth Amendment is total emancipation. Douglass would argue that the exception clause is a relic of the old order, a compromise with the slave power that survived the war. While it may have been politically necessary in 1865, its continued existence contradicts the "new departure."

  Douglass's constitutionalism was teleological: the document must be judged by its ends. The end of the Thirteenth Amendment is freedom. If the exception clause permits a form of unfreedom that disproportionately targets specific populations (as convict leasing did then, and as mass incarceration does now), it defeats the Amendment's purpose. Douglass would insist that to honor the *intent* of the text (which he always prioritized over the framers' private intentions), the exception must be removed to align the law with the principle of universal liberty.

  ### The Verdict
  Frederick Douglass would judge your campaign as a moral imperative.

  He would acknowledge the textual tension you raised—that the Thirteenth Amendment names slavery where the original Constitution did not—but he would resolve it by prioritizing the **prohibitory command** over the **exceptional license**. He would argue that his "plain text" argument was always predicated on the assumption that the Constitution was a machine for liberty. When a clause turns that machine into an engine of coercion, the clause must be excised.

  Douglass wrote in 1894: *"There is no Negro problem. The problem is whether the American people have honesty enough, loyalty enough, honor enough, patriotism enough to live up to their own Constitution."*

  Striking the exception clause is the act of living up to the Constitution. It acknowledges that while the state may punish crime, it must not own the person. Douglass would stand with you and argue that a Constitution that permits slavery, even in a single clause, cannot truly be a "glorious liberty document." To make it one, the exception must go.
