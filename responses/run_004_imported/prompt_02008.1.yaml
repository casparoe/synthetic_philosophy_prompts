answer: |-
  **Setting:** *A university office, late afternoon. Rain against the window. Elena is packing her bag; Marcus is slumped in a visitor's chair, holding a lukewarm coffee. They have been talking for an hour.*

  **Marcus:** You're asking me to accept that the value of a human life can be subtracted from the past. That's not just counterintuitive, Elena; it's metaphysically profligate.

  **Elena:** It's not subtracting from the past. It's correcting the ledger.

  **Marcus:** There's no difference in this context. If I tell you that a decade of your life was less valuable than you thought, I am telling you that the value *wasn't there*. You're saying the goodness of those years depended on a fact outside the subject's consciousness. Specifically, the truth of the other person's affection.

  **Elena:** I'm saying the goodness *is* the relation. Not the feeling of the relation. Moore was explicit about this in "The Ideal." Personal affection is an organic unity. It requires two parts: the appropriate emotion in the subject, and the actual existence of the worthy object. If you remove the object—if the friend is actually a con artist, say—you haven't just changed the consequences. You've dismantled the unity.

  **Marcus:** But the subject didn't know. From the inside, the unity felt complete. The warmth, the security, the sense of being known… that phenomenology was real.

  **Elena:** The phenomenology was real. The *good* was not. Think of it like forgery. If you stare at a painting for ten years, deriving profound aesthetic pleasure from it, believing it's a Rembrandt… and then it's proven to be a copy. Did you lose something?

  **Marcus:** I lost the status. I lost the investment value. But the beauty I saw? That happened.

  **Elena:** Moore would say the beauty you saw was diminished the moment you knew it was a copy. But—and here is the hard part—he would also say it was *always* diminished. Even while you were looking at it. Because the value of aesthetic contemplation, like affection, relies on the existence of the thing contemplated. The truth is a constituent of the value, not just a footnote.

  **Marcus:** This is where you lose me. You're positing a kind of moral magic. You're saying that across town, right now, there's a man who thinks his wife loves him. She actually despises him but is an excellent actress. According to you, that man's happiness is *intrinsically* lower than the man whose wife genuinely loves him, even if their internal experiences are identical.

  **Elena:** Yes.

  **Marcus:** That's a bullet I didn't think you'd bite. Because if you accept that, you have to accept that we are surrounded by worthless lives. We can never know the intrinsic value of our own relationships. We walk around thinking we're rich in love, but we might be paupers, and we'd never know until the betrayal happens.

  **Elena:** Why is that a problem for the theory? It's a problem for our comfort.

  **Marcus:** It makes value inaccessible. If intrinsic value is supposed to be what we ought to pursue, how can we pursue it if it depends on facts permanently hidden from us?

  **Elena:** We pursue the truth *and* the emotion. We aim for the whole unity. If we aim only for the feeling, we are aiming for a hollow thing. You're defending the Experience Machine, Marcus.

  **Marcus:** I'm defending the sanctity of the lived moment. If that woman in your novel felt loved for thirty years, she *was* loved in the only way that matters for her well-being. To tell her, "No, actually, those years were cheap," is a violence. It's telling her her own history is a lie.

  **Elena:** But that's exactly how she describes it! That's the phenomenology of betrayal. She doesn't say, "I was happy then, and I am sad now." She says, "It was all a lie." She uses the past tense. The discovery reaches back.

  **Marcus:** That's narrative reconstruction. It's how we make sense of shock. When the foundation collapses, we look at the building and say, "That was never stable." But it *stood*. It kept the rain out for thirty years.

  **Elena:** Did it? Or did it just look like it did? If I build a house on a cliff edge, and it stands for thirty years, and then it falls… was it a stable house?

  **Marcus:** It was a house that stood. Stability is a property of the past performance, not the future risk.

  **Elena:** Stability is a relation between the structure and the ground. If the ground was sand, the stability was an illusion. Even while it stood.

  **Marcus:** You're conflating physical stability with emotional value. The value of friendship is in the support provided. She was supported.

  **Elena:** She was supported by a performance. There is a specific good in being loved *for oneself*. If the friend is performing a role based on calculation, that specific good is absent. It's not just that the future is gone. It's that the specific good she thought she was consuming was never served. She was eating plastic fruit. It looked like food. It satisfied her hunger for a moment, perhaps. But it wasn't nourishment.

  **Marcus:** But if the hunger went away, what is the difference?

  **Elena:** The difference is the reality. Moore argues that an uninhabited beautiful world is better than an uninhabited ugly one, even if no one sees it. Reality matters *in itself*. So, a real friendship is better than a fake one, even if the subject can't tell the difference.

  **Marcus:** That example always struck me as Moore's weakest link. Value for whom? If there's no consciousness, who is the better off?

  **Elena:** The universe is better off. Value isn't just a human accounting trick.

  **Marcus:** That's mystical.

  **Elena:** It's realist. You're a subjectivist. You think value is projected by the mind. I think it's found in the fit between mind and world.

  **Marcus:** Okay, let's go back to the bullet. If you're right, then my marriage right now has a value I cannot calculate. It depends on your secret thoughts. If you're secretly resenting me, our dinner tonight is intrinsically less valuable than if you're genuinely happy.

  **Elena:** Yes.

  **Marcus:** And if I never find out, it remains less valuable?

  **Elena:** It remains less valuable. But you are spared the pain of knowing.

  **Marcus:** Spared? Or defrauded? If the value was never there, I've been living a counterfeit life.

  **Elena:** You've been living a life based on a false belief. That is the human condition, Marcus. We assume reciprocity. We assume truth. When we find out we were wrong, we don't just mourn the future. We mourn the past. Why do you think that is? Why does the discovery of infidelity make the wedding photos look different?

  **Marcus:** Because the context changes. The photos are the same pixels. But the story they tell has changed.

  **Elena:** No. Because we intuitively grasp that the value of the moment depended on the truth of the vows. If the vows were lies, the moment was corrupted. We feel the retroactive spoilage because we are Mooreans in practice, even if you're a subjectivist in theory.

  **Marcus:** We feel it because betrayal is a trauma. Trauma rewrites memory. It colors the past with the pain of the present. That's psychology, not metaphysics.

  **Elena:** Is it? Or is it recognition? When she finds out, she says, "I never knew you." She doesn't say, "I knew a version of you that was nice." She says the person she loved didn't exist.

  **Marcus:** The person she loved was the one who acted the part. That person existed.

  **Elena:** The *friend* didn't exist. The actor did. And you can't have a friendship with an actor in character. That's parasocial. That's fandom.

  **Marcus:** You're demanding a purity that doesn't exist. We all perform roles. We all suppress resentments. Where is the line? If my friend helps me move house because he loves me, but also because he likes the free pizza… is the friendship devalued?

  **Elena:** Mixed motives aren't deception. We're talking about a sustained performance where the core affection is absent.

  **Marcus:** But you can't see into the soul. You're making the value of my life depend on a black box I can't open.

  **Elena:** I'm saying the value is in the connection, not the isolation. If the connection is one-way, it's not a friendship. It's a monologue. A monologue can be pleasant. It can feel like a dialogue. But it isn't one.

  **Marcus:** And if it feels like one for forty years?

  **Elena:** Then it was a very convincing monologue.

  **Marcus:** *Sighs.* You know what this does to the woman in your novel?

  **Elena:** What?

  **Marcus:** If you're right, she has to grieve not just the loss of the friend, but the loss of her own past. She has to accept that her happiest years were, in objective terms, lesser years.

  **Elena:** She has to accept they were not what she thought they were. There is a tragedy in that.

  **Marcus:** It's a cruelty. To tell someone their joy was invalid because the object was flawed… it's gaslighting with metaphysics.

  **Elena:** It's honesty. The alternative is to say, "It doesn't matter that he didn't love you, because you felt loved." That's patronizing. It suggests her desire for real love was irrelevant.

  **Marcus:** It suggests her experience was real.

  **Elena:** Her pain is real. Her pleasure was real. But the *good*… the good requires truth.

  **Marcus:** We're at an impasse.

  **Elena:** We are.

  **Marcus:** Because I can't accept that the universe keeps a secret ledger of worth that invalidates our lived experience.

  **Elena:** And I can't accept that lived experience is all there is. That we are just brains in vats, where the simulation is as good as the reality.

  **Marcus:** Maybe for the purpose of a life, it is.

  **Elena:** Maybe. But then betrayal wouldn't hurt the way it does. It wouldn't feel like a theft of the past. It would just feel like a change in future prospects.

  **Marcus:** Or maybe it hurts because we *want* your view to be true. We want reality to matter. And when we find out it didn't, we feel the void.

  **Elena:** *Pauses.* Then we agree on the pain. We just disagree on whether the pain reveals the truth, or creates it.

  **Marcus:** *Stands up.* I think I need to go home. I'm going to look at my wife, and I'm going to wonder if I'm Moorean enough to care, or subjectivist enough to sleep.

  **Elena:** Let me know which one lets you eat dinner.

  **Marcus:** *At the door.* Elena? If you write this… don't let her decide.

  **Elena:** Why not?

  **Marcus:** Because if she decides you're right, she loses her past. If she decides I'm right, she loses the truth.

  **Elena:** That's the novel.

  **Marcus:** That's the trap.

  *Marcus exits. Elena stays at the desk, looking at the rain, not writing.*
