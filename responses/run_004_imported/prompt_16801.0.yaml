prompt: |-
  So I spent thirty-five years running a molecular biology lab before I retired, and now they've got me on the university's research integrity committee. Current case: the core imaging data behind Figure 3 of a well-cited paper from the lab can't be reproduced -- a grad student building on it went back to the raw files and the numbers don't match whats published. The postdoc who generated the data left research years ago and wont answer emails. The two remaining co-authors, still faculty here, say they simply trusted her the way you'd trust any careful colleague you'd known for a decade, no red flags at the time, and shouldn't be held responsible for data they never personally generated or checked. A few younger members want a blanket rule instead: nobody may ever rely on a co-author's word about data alone, no matter how trusted, without an independent check. Funnily enough I've been reading about this exact fight in epistemology over testimony lately -- whether trusting what someone tells you is its own basic source of justification, or whether it only really counts once you can cash it out in evidence you could've checked yourself -- and I can't settle that even in the abstract, let alone here. Could you draft the memo I'll circulate before next week's meeting? I need an actual recommendation -- clear them, find them at fault, or something in between -- with a concrete timeframe, plus a call on what the policy should be going forward, and it has to take the "reasonable reliance on a trusted colleague" side seriously, because if that's never enough I don't see how any collaborative lab ever gets anything done.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired molecular biologist (35 years experience), now on the university's research integrity committee. Understands lab culture, collaboration, and the practicalities of science.
      *   **Context:** A specific case of irreproducible data (Figure 3 of a well-cited paper).
      *   **Key Players:**
          *   Original Postdoc (data generator): Left research, unresponsive.
          *   Two Co-authors (Faculty): Claim "reasonable reliance" on a trusted colleague of 10 years. No red flags at the time.
          *   Grad Student (Whistleblower/Discoverer): Found the discrepancy in raw files.
          *   Younger Committee Members: Want a blanket rule requiring independent verification of *all* data.
      *   **The Conflict:** Epistemological tension between "testimony/trust" vs. "independent verification." Practical tension between rigor and feasibility in collaborative science.
      *   **Deliverable:** A memo to circulate before the next committee meeting.
      *   **Requirements:**
          *   Must make an actual recommendation on the specific case (Clear, Fault, or Middle Ground).
          *   Must include a concrete timeframe for resolution.
          *   Must propose a policy recommendation for the future.
          *   Must take the "reasonable reliance" argument seriously (acknowledge the necessity of trust in collaboration).
          *   Tone: Professional, authoritative but collegial, nuanced, grounded in both ethics and practical lab management.

  2.  **Determine the Stance/Recommendation:**
      *   *The Case:* The postdoc is gone. The faculty co-authors claim trust. The data is wrong.
      *   *Option A (Clear them):* Undermines integrity. Data is objectively wrong.
      *   *Option B (Find them at fault for misconduct):* Too harsh if there was no intent to deceive. "Misconduct" usually requires intent (FFP: Fabrication, Falsification, Plagiarism). Negligence is different.
      *   *Option C (Middle Ground - Negligence/Responsibility):* This is the sweet spot. Acknowledge they likely didn't *fabricate*, but failed in their supervisory/corresponding author duty to verify. Trust is necessary, but *oversight* is mandatory.
      *   *Policy:* A blanket "independent check of everything" is impossible (paralysis). A policy of "risk-based verification" or "data stewardship" is better.
      *   *Timeframe:* Needs to be prompt but allow for response. 14 days is standard for administrative responses.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of the situation. Validate the difficulty (trust vs. verification).
      *   **Case Analysis (The "Why"):**
          *   Address the "Reasonable Reliance" argument. It's valid for *daily* work, but not for *publication*. Publication is a certification of truth.
          *   Distinguish between *misconduct* (intent) and *negligence* (duty of care).
          *   The faculty weren't just colleagues; they were PIs/Supervisors. That carries higher liability.
      *   **Recommendation on Current Case:**
          *   Not "Guilty of Fraud."
          *   But "Responsible for Error."
          *   Action: Retraction/Correction of the paper. Letter of reprimand regarding oversight duties.
      *   **Policy Recommendation (The Future):**
          *   Reject the "check everything" rule (impractical).
          *   Propose "Data Stewardship & Verification Tiers." Key findings need raw data review by a second party (not necessarily the PI, but *someone* independent).
          *   Emphasize data management (raw files must be kept and accessible).
      *   **Epistemological Nod:** Briefly acknowledge the philosophical angle the user mentioned (testimony vs. evidence) but ground it in research ethics. Trust is the *foundation*, verification is the *safeguard*.
      *   **Timeframe:** Set a deadline for the faculty response.
      *   **Closing:** Reiterate the goal (protecting science, not punishing people).

  4.  **Refining the Tone:**
      *   *Avoid:* Bureaucratic jargon, overly accusatory language, or overly philosophical abstraction.
      *   *Include:* Empathy for the faculty (they didn't mean to cheat), but firmness on standards.
      *   *Key Phrase:* "Trust is the currency of collaboration, but verification is the audit." (Or something similar).
      *   *Specific constraint:* The user mentioned they've been reading epistemology. I should subtly weave that in without sounding like a philosophy professor. The memo needs to sound like it comes from a senior scientist.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the policy too vague?
      *   *Fix:* Make it specific about "Key Claims" vs. "Routine Data."
      *   *Critique:* Is the recommendation too soft?
      *   *Fix:* Ensure the call for a Correction/Retraction is clear. The record must be fixed regardless of intent.
      *   *Critique:* Did I address the "young members" concern?
      *   *Fix:* Yes, by validating their desire for rigor but channeling it into a workable policy rather than a blanket ban on trust.

  6.  **Final Polish:** Check the formatting. Ensure the "35 years experience" voice comes through (pragmatic, weary but principled). *Self-correction: Make sure I don't sound like I'm lecturing the committee, but leading it.*

  7.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Case #2023-09 (Figure 3 Discrepancy) and Policy on Co-Author Verification

  **Purpose**

  This memo outlines my recommendation regarding the unreproducible imaging data in the published paper cited above, as well as a proposed policy framework to address the broader concerns raised by junior committee members regarding co-author responsibility.

  Having spent thirty-five years managing a lab, I recognize the tension at the heart of this case. We are balancing the epistemological necessity of trust in collaboration against the ethical necessity of verification in publication. If we demand independent verification for every data point, science grinds to a halt. If we accept testimony without oversight, the literature becomes unreliable.

  Below is my assessment of the specific case and a proposal for a sustainable path forward.

  **I. Recommendation on Current Case**

  **Finding:** I recommend we find the two faculty co-authors **responsible for negligence in oversight**, but **not responsible for research misconduct (fabrication/falsification).**

  **Rationale:**
  The distinction here is critical. "Misconduct" implies intent to deceive. There is no evidence the faculty co-authors knew the data was flawed. Their defense—"reasonable reliance on a trusted colleague"—is valid for *daily lab operations*, but it does not hold for *publication*.

  When a senior author places their name on a paper, they are not merely endorsing the effort; they are certifying the validity of the claims. In molecular biology, we accept that a PI cannot repeat every experiment. However, we also accept that a PI must verify the *foundational* data supporting major claims before signing off. Figure 3 was central to the paper's conclusions. Relying solely on the postdoc's word, without reviewing the raw imaging files or asking a third party to validate the quantification, constitutes a breach of supervisory duty.

  **Action Items:**
  1.  **Correction/Retraction:** The university must contact the journal to request a Correction or Retraction, depending on whether the error invalidates the main conclusion. The record must be fixed regardless of intent.
  2.  **Faculty Sanction:** The co-authors should receive a formal letter of reprimand regarding their oversight duties. This is not to punish them for the postdoc's error, but to clarify that "trust" is not a substitute for "stewardship."
  3.  **Timeline:** The co-authors must respond to this finding within **14 days**. If they agree to pursue the Correction/Retraction, we close the investigative phase. If they refuse, we escalate to the Dean.

  **II. Policy Recommendation: "Tiered Verification"**

  The younger members of the committee have proposed a blanket rule: *No co-author may rely on another's data without independent checking.* While well-intentioned, this is operationally impossible. It ignores the division of labor that makes modern science possible.

  Instead, I propose we adopt a **Tiered Verification Policy** for all labs under our purview:

  1.  **Tier 1 Data (Routine/Supporting):** Data that supports established methods or secondary claims.
      *   *Standard:* Reliance on the generator's analysis is permissible.
      *   *Requirement:* Raw data must be archived and accessible upon request.
  2.  **Tier 2 Data (Key Claims/Novel Findings):** Data that forms the central argument of a paper (e.g., Figure 3 in the current case).
      *   *Standard:* Independent verification is mandatory before submission.
      *   *Requirement:* This does not require the PI to redo the work. It requires that *another* lab member (peer or senior postdoc) reviews the raw files and reproduces the analysis/quantification to confirm the images match the graphs.
  3.  **Data Stewardship:** All raw data must be stored on institutional servers, not personal drives, and must be retained for a minimum of 5 years post-publication. The "unresponsive postdoc" scenario is a failure of data management, not just personnel.

  **III. The Epistemological Balance**

  We must acknowledge that the junior members are right to be skeptical, but the senior faculty are right about the culture. Science is a social enterprise built on testimony. We cannot function if we treat every colleague as a potential fraudster.

  However, trust is the *foundation* of collaboration, not the *roof*. It gets you in the door, but it doesn't protect you from the storm. The policy above respects the necessity of trust for daily work while instituting a "circuit breaker" for high-stakes claims. It allows us to rely on our colleagues' words, provided we have a mechanism to ensure those words match the reality of the files.

  **Next Steps**

  I ask that the committee review this recommendation prior to our meeting next Tuesday. My goal is to resolve this case without driving our faculty into defensive litigation, while ensuring that "I trusted my colleague" never again becomes a valid excuse for failing to check the raw data behind a major claim.

  Regards,

  [Your Name]
  Research Integrity Committee
