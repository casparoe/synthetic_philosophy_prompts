              2.  **Non-Locality in Disguise:** Interactions in 3N space that look local (nearest neighbors in configuration space) correspond to wildly non-local interactions in 3D space (action at a distance between separated particles).
              3.  **Violation of Lewis's Spirit:** Lewis wanted laws to summarize *spatiotemporal* patterns. If the spacetime is 3N, the "separability" Lewis cared about is lost relative to *our* space. Maudlin's point was about *physical* non-separability. Relocating the arena doesn't fix the physical non-separability; it just redefines the arena to make it mathematically local.
              4.  **Simplicity Cost:** The BSA weighs simplicity. A law defined on 3N space is mathematically simple, but the *bridge principles* required to get back to 3D experience are complex. Does the system *really* win on balance?

      *   **Section 3: Super-Humeanism (The Alternative):**
