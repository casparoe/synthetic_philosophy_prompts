answer: |-
  This is a sophisticated ethical knot, precisely the kind that fuels good fiction because it resists easy untangling. You are asking for rigor, so let's dissect this along three distinct axes: the nature of the appropriation, the question of moral standing, and the methodology of your intervention.

  ### 1. The Spectrum of Appropriation
  You are asking if your action three years ago bears on R.'s action now. The answer is yes, but not because they are the same. They are different points on the same spectrum, and the distance between those points matters.

  In creative workshops, there is a porous boundary between **osmosis** and **theft**.
  *   **Osmosis:** You absorb a structural idea, a "bone," because it resonates. It enters your subconscious, mixes with your own voice, and emerges transformed. This is often unavoidable in close-knit groups.
  *   **Theft:** You replicate plot mechanics, specific scenes, or distinctive turns without transformation or attribution, presenting them as original generation.

  **Your Case:** You took the "bones" of a scene. You did not copy dialogue. Crucially, you recognized the debt (consciously or via Priya's reminder) and **executed restitution** by rewriting it before publication. You prioritized the integrity of the work over the convenience of the draft.
  **R.'s Case:** You describe the chapter as "almost identical" in shape and individual scenes, left "undisguised." There is no evidence of transformation. There is no evidence of restitution.

  **The Rigorous Distinction:** Your action looks like a failure of *origin awareness* that was corrected by *ethical editing*. R.'s action looks like a failure of *ethical generation* that was compounded by *public presentation*.
  Therefore, R.'s act is objectively more damaging to the workshop's trust. Your act was a private struggle resolved silently; R.'s act is a public breach of the group's social contract. They are not morally equivalent.

  ### 2. The Question of Standing (Priya's Challenge)
  Priya argues that because you have "blood on your hands," you cannot police R. This is the argument from hypocrisy. Does it hold?

  **The Logical Validity:**
  Logically, the truth of a statement is independent of the speaker. If R. plagiarized, he plagiarized, regardless of whether you are a saint or a sinner. Your past does not make R.'s chapter original. Therefore, you *did* have the business of identifying a threat to the group's integrity, especially as the facilitator.

  **The Rhetorical Validity:**
  However, Priya is pointing at *standing*, not logic. When you said, "This isn't something one working writer does to another," you positioned yourself as a guardian of a code you yourself had quietly violated.
  *   **The Flaw:** You claimed a moral high ground you haven't fully occupied. You corrected your mistake, but you never owned it. By keeping your correction secret, you preserved your reputation as "unblemished" while judging R. for being "blemished."
  *   **The Nuance:** If you had said, "R., this feels dangerously close to X's work. I've struggled with this myself—once I had to scrap a whole scene because I realized I'd unconsciously lifted the structure from a workshop peer. We need to be careful here," your standing would be unassailable. By speaking bluntly and without context, you invited the charge of hypocrisy.

  **Verdict:** You had the *authority* (as the leader) and the *obligation* (to the victimized absent member) to speak. You lacked the *humility* to acknowledge that you are capable of the same error, even if you corrected it.

  ### 3. The Methodology: Public vs. Private
  This is where the ethical balance tips most heavily against you, more so than the plagiarism issue itself.

  Workshops run on psychological safety. Members must feel safe to share bad drafts without fear of public indictment.
  *   **R.'s Transgression:** Potentially stealing intellectual property.
  *   **Your Transgression:** Potentially shaming a member in front of peers.

  By calling R. out "in front of everyone" and "more bluntly than I'd planned," you prioritized *justice* (defending the absent writer) over *mercy* (protecting the present writer).
  If R.'s act was unconscious (cryptomnesia is common in writers who read widely), your public call-out was a disproportionate response that could end his writing practice. If it was conscious, a public call-out forces him into a defensive corner where he cannot admit fault without losing face.

  Priya's suggestion—that you should have "said nothing or said it very differently"—has merit regarding the *method*, if not the *substance*. A private conversation would have allowed R. to save face, check his notes, and realize the overlap without the group's witness.

  ### 4. Synthesis: Does Your Past Bear on This?
  You asked: *Does what I did three years ago actually bear on whether I had any business calling R. out now?*

  **Yes, but not on the "whether." It bears on the "how."**
  You had every business protecting the group's integrity. R.'s chapter is a problem regardless of your history. However, your history dictates that you should have approached the situation with the knowledge of how easily a writer can stumble into this gray area. Your silence about your own past turned a corrective intervention into a performative judgment.

  **Does it matter that your act was corrected and R.'s was not?**
  Yes. Ethically, restitution matters. You paid your debt to the Quiet Member by rewriting the scene. R. has not paid his debt to the MFA Member. You are a reformed offender; R. is an active one. That gives you the standing to intervene, but it obligates you to intervene with the goal of *reform*, not *condemnation*.

  ### 5. For The Novel You Are Drafting
  You mentioned you suspect this dilemma belongs in your current draft. If so, do not simplify it. The tension here is not "Plagiarist vs. Hero." The tension is "Two Flawed Guardians vs. The Truth."

  If you write this, consider exploring:
  1.  **The Burden of the Secret:** How the protagonist's unconfessed past makes their present judgment brittle.
  2.  **The Definition of Ownership:** At what point does an idea stop belonging to the person who generated it and start belonging to the person who perfected it?
  3.  **The Cost of Integrity:** The protagonist protects the group but alienates a member. Was the cohesion of the group worth the potential destruction of R.?

  ### 6. Actionable Steps for You
  To resolve this in reality, not just in theory:

  1.  **Acknowledge Priya:** Thank her. She saved you from blind spots.
  2.  **Revisit R. (Privately):** You do not need to confess your past sin to R. (that centers you, not him). But you can soften your stance. "I've been thinking about how I handled the workshop discussion. I was too blunt. I care about this group's integrity, but I also care about your place in it. I want to make sure we navigate this overlap correctly."
  3.  **Consider the Quiet Member:** You still owe a debt there. If your novel is published with the rewritten scene, you are clear. But ethically, you might consider whether that "bone" still lingers. If it does, an acknowledgment in your own book's notes ("Thanks to X for early inspiration on a key scene") is a rare but powerful act of grace.
  4.  **Workshop Policy:** As the leader, formalize the policy on "overlap." Make it a standing rule that if a member recognizes their work in another's, they speak to the leader privately first. This institutionalizes the solution so it's not about *your* judgment, but *our* rules.

  **Summary:** R. is in the wrong regarding the text. You were in the wrong regarding the handling. Your past does not silence you, but it should have humbled you. Recognizing that distinction is the rigor you are looking for.
