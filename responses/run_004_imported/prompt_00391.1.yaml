answer: |-
  **Setting:** *The faculty lounge of a law school, late afternoon. Rain taps against the high windows. Marcus, a tenured professor known for his rigid adherence to textualism, is pouring coffee. Elena, a colleague who specializes in statutory interpretation and legislative history, sits across from him with a stack of annotated briefs.*

  **Elena:** You're still brooding over the *X-Citement Video* reading assignment, aren't you? I can see the steam coming off your ears.

  **Marcus:** I'm not brooding. I'm marinating. How can you teach that case as a victory for statutory interpretation? The majority literally moved a word.

  **Elena:** They didn't move a word, Marcus. They interpreted the scope of a modifier. The statute prohibited knowingly transporting a visual depiction *if* the production involved a minor. The grammatical tension was whether "knowingly" applied only to "transporting" or also to "involves the use of a minor."

  **Marcus:** Syntax, Elena. Syntax. "Knowingly" precedes "transports." It is separated from "involves" by several clauses. Under any standard rule of English grammar, the mens rea attaches to the act of transportation, not the age of the performer. Scalia's dissent was a masterclass in basic reading comprehension.

  **Elena:** And the majority opinion was a masterclass in reading comprehension *of a statute*, which is different from reading a poem or a manual. If you follow Scalia's reading, a FedEx driver who delivers a sealed package containing illegal material is a federal felon, even if he had zero reason to suspect the contents. Is that really what Congress intended?

  **Marcus:** It doesn't matter what they intended! It matters what they enacted. If Congress wanted to require knowledge of the minority status, they knew how to write that. They've done it in other statutes. When the text is clear, the inquiry ends. To do otherwise is to let judges rewrite the law under the guise of "fixing" it.

  **Elena:** But that's where the absurdity doctrine comes in. Even Scalia admitted there's a limit. If a statute said "the defendant shall pay the plaintiff's legal fees" but clearly meant the other way around due to a drafting error, you'd fix it. You accept the scrivener's error exception. So you *do* care about intent, just in narrow circumstances.

  **Marcus:** I accept that language can contain mistakes. If a bill says "plaintiff" where the context of the entire section makes it undeniably clear they meant "defendant," that's a clerical error. It's like a typo in a contract. But *X-Citement* wasn't a typo. It was a structural choice. Congress was struggling with how far to extend liability. Maybe they *did* want strict liability for transporters to choke off the market. It's a harsh policy, but it's not "absurd" in the sense of being impossible to implement.

  **Elena:** See, that's the divergence. For me, "absurdity" isn't just about logical impossibility. It's about results that contradict the fundamental purpose of the legislation. The Act was called the *Protection of Children Against Sexual Exploitation Act*. Its purpose was to stop predators. Jailing an innocent courier doesn't stop predators; it just wastes resources and violates basic notions of justice. When the text leads to a result that defeats the statute's own raison d'être, the text has failed to capture the instruction.

  **Marcus:** And who decides when the purpose is defeated? You? Me? A judge? That's the slippery slope. Once you allow judges to say, "This result is too harsh, so we'll adjust the text," you've turned judges into a super-legislature. The "scrivener's error" exception is principled because it's objective. You can point to the typo. In *X-Citement*, the majority pointed to "policy." They said, "Congress couldn't have meant this." That's mind-reading.

  **Elena:** It's not mind-reading; it's contextual inference. We infer intent from context all the time. If I tell you, "Please don't eat the cake in the fridge," and you see I've put a cake in the oven, you don't assume I meant *all* cakes everywhere. You infer the scope based on the purpose of the command. The "absurdity doctrine" is just a canon of construction that presumes legislators are rational actors who don't intend unjust outcomes.

  **Marcus:** But legislators aren't a single rational actor. They're 535 people compromising. Sometimes they pass bad laws. Sometimes they pass laws with harsh penalties to send a message. If a court "fixes" a harsh law because it thinks it's "unjust," it disrupts the democratic bargain. The voters might get angry at the law, repeal it, or vote out the members who passed it. If a judge fixes it, the pressure valve is released. The legislature never has to take responsibility for the mess.

  **Elena:** That assumes the legislature *knows* about the mess. Most of these drafting errors never get litigated until years later. By then, the political cost of fixing a "technicality" is too high. If the courts don't act as a faithful agent to smooth out the glitches, the law becomes a trap. Look, let's go back to your scrivener's error. If a statute says "the defendant shall pay" but the whole section is about plaintiff remedies, you fix it. Why? Because it's obvious.

  **Marcus:** Because the text *itself* reveals the error through internal inconsistency.

  **Elena:** Exactly. Internal inconsistency. In *X-Citement*, the inconsistency was between the text and the *legal tradition*. We have a deep-rooted common law presumption that crime requires a guilty mind. *Mens rea*. When a statute is silent or ambiguous on that, we presume it exists. The majority didn't say "Congress made a typo." They said, "Congress didn't explicitly override the common law presumption of intent." That's not rewriting; that's reading the text against the background of the law.

  **Marcus:** But the text *wasn't* ambiguous to a textualist! The grammar was specific. You're using the "background of the law" to override the specific grammar of the statute. That's purposivism wearing a textualist mask. You're saying, "The purpose of criminal law is to punish the guilty, so we will read this statute to match that purpose, even if the grammar suggests otherwise."

  **Elena:** I'm saying language doesn't exist in a vacuum. Words derive meaning from their environment. If Congress wants to break a thousand-year tradition of *mens rea*, they need to be crystal clear. They weren't. So we read the statute in a way that makes it constitutional, just, and functional. That's the "Charming Betsy" canon. Avoid absurdity, avoid constitutional doubt.

  **Marcus:** And that's how you get *King v. Burwell*. "Established by the State" means "Established by the State or the Federal Government" because otherwise the healthcare market collapses. That's not interpretation; that's salvage operations.

  **Elena:** *King* is a harder case, I'll grant you. But isn't there a difference between "I don't like this outcome" and "This outcome makes the statutory scheme incoherent"? If the ACA collapses without that reading, the entire Act fails. The Court chose the reading that preserved the legislative work product.

  **Marcus:** Or they chose the reading that preserved their own policy preference for healthcare. See, this is my fear. The "Absurdity Doctrine" is a blank check. It starts with "No one could intend a FedEx driver to go to jail," which I sympathize with. But it ends with "No one could intend for this subsidy to disappear," which is a policy calculation. Where is the principled line, Elena? How do you stop a judge from saying, "It's absurd that this defendant gets a life sentence for a non-violent crime, so we'll read in an exception"?

  **Elena:** The line is objectivity. A scrivener's error is objective. A contradiction with established common law presumptions (like *mens rea*) is objective. A result that renders other parts of the statute superfluous is objective. It's not about whether the judge *likes* the result. It's about whether the result is compatible with the legal system the statute operates within. In *X-Citement*, criminalizing innocent conduct was incompatible with the criminal justice system's foundational principles.

  **Marcus:** But "innocent conduct" is a moral judgment, not a linguistic one. To a strict liability textualist, the conduct *is* guilty because the statute says so. You're smuggling morality into semantics.

  **Elena:** And you're smuggling a false neutrality into semantics. Pretending you're just "reading the words" ignores that choosing the strict grammatical reading *is* a policy choice. It chooses certainty over justice. It chooses the dictionary over the reality of how laws function.

  **Marcus:** I choose the dictionary because the dictionary is public. Legislative intent is hidden in committee reports that most members of Congress never read. If I tell a citizen, "Obey the text," they can do that. If I tell them, "Obey the text unless a judge thinks it's absurd," they can't plan their lives. In *X-Citement*, the distributor could have checked the ages. The statute gave them a way to comply. By reading in a knowledge requirement, the Court made it harder to prosecute the actual predators who *did* know, because now the government has to prove knowledge. You think you're helping justice, but you might be hamstringing enforcement.

  **Elena:** Or we're ensuring that only the guilty are punished. Look, Marcus, we both want the law to be stable. But a law that is mechanically applied to produce injustice loses its legitimacy. If the public sees the law convicting innocent couriers, they lose respect for the statute. The absurdity doctrine preserves the legitimacy of the text by ensuring it doesn't self-destruct.

  **Marcus:** Legitimacy comes from the process. If the process produced a harsh text, the remedy is new legislation, not judicial redrafting. I'd rather live with a few harsh verdicts than live in a system where judges feel empowered to "correct" Congress every time they frown at a result.

  **Elena:** And I'd rather live in a system where the law serves human beings, not the other way around. If the text is a vehicle for the legislature's will, and the text breaks the vehicle, we fix the engine. We don't just drive it off a cliff because "that's what the map said."

  **Marcus:** *(Sips coffee, looks out the window)* The problem is, Elena, you trust the judge to know when the vehicle is broken. I trust the map. Even if it leads to a cliff. Because if the judge decides where the cliff is, we're not driving by the map anymore. We're driving by the driver's mood.

  **Elena:** And if the map is wrong, we're all dead.

  **Marcus:** Then Congress should issue a new map.

  **Elena:** *(Smiles faintly)* We're going to be here until the janitor kicks us out.

  **Marcus:** Probably. But at least we agree the coffee in this lounge is objectively absurd.

  **Elena:** On that, the text is clear. It's swill.

  **Marcus:** Finally, something we can interpret without disagreement.
