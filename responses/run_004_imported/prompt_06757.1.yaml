  8.  **Final Polish:** Check tone (collegial, scholarly, helpful for teaching). Ensure the distinction between "Truth" (Leviathan focus) and "Science/Certainty" (De Corpore focus) is clear. (This is the crucial distinction).

      *   *Truth* = Predication of names.
      *   *Science* = Knowledge of consequences from causes.
      *   *Geometry* = The only place where the names (definitions) capture the causes (because we make them).

      This structure resolves the tension: *Leviathan* defines Truth; *De Corpore* defines the conditions for Science. Geometry satisfies both.

  9.  **Final Review against User Prompt:**
