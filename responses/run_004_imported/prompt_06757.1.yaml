      *   *Section 1: The Surface Tension.* Clearly state the *Leviathan* view (linguistic order) vs. *De Corpore* view (causal generation).
      *   *Section 2: Reconciling the Two (The "Strong Nominalist" Reading).* Explain that for Hobbes, truth *is* always about names. So *Leviathan* is technically correct about truth. But *De Corpore* adds the condition for *Science*. Not all definitions yield science. Only generative ones do.
      *   *Section 3: The Role of "Conception".* This is the missing link. We define words to fix conceptions. A generative definition fixes a *clear and distinct* conception because it mimics the mind's own constructive power.
