      *   **Audience:** Seminar students (needs clarity, depth, and pedagogical utility).

  2.  **Initial Assessment of the Philosophical Issue:**
      *   This is a classic problem in Hobbes scholarship. Hobbes is a nominalist (names are arbitrary marks), yet he wants geometry to be about truth and reality, not just word games.
      *   *Leviathan* emphasizes the linguistic/social function of reason (avoiding absurdity).
      *   *De Corpore* emphasizes the metaphysical/epistemological foundation of science (science of consequences from causes).
      *   The key lies in Hobbes's conception of "Truth" and "Science." For Hobbes, truth *is* propositional (about names), but science *is* knowledge of consequences.
      *   The "generation" aspect is crucial because it bridges the gap between the name and the conception of the thing.

  3.  **Deconstruct the Two Passages:**
      *   *Leviathan* Ch. 4: Focus is on *Speech* and *Reason*. Truth is in propositions, not things. Definitions prevent ambiguity. Geometry is the model because it starts right.
      *   *De Corpore* (Part I, Ch. 6 & Part II, Ch. 9): Focus is on *Body* and *Motion*. A definition must be "integral" and show the "cause" of the thing. Why? Because to know properties, you must know how the thing comes to be.

  4.  **Develop Interpretive Options:**

      *   *Option 1: The Developmental/Contextual Reading.* *Leviathan* is political; *De Corpore* is metaphysical. Hobbes simplifies for the political audience in *Leviathan*. (A bit too dismissive).
      *   *Option 2: The Nominalist Consistency Reading.* Definitions *are* stipulations, but the *content* of the stipulation must be generative to be useful for science. The "settling" is the act, the "generation" is the content required for that act to yield science.
      *   *Option 3: The Epistemic Access Reading.* We can only have certain knowledge of what we construct. Therefore, to define something for the sake of science, we must define it in terms of our construction (motion). "Settling significations" means fixing the conception in the mind via the method of generation.
      *   *Option 4: The "Two-Stage" Reading.* There are definitions of names (grammar) and definitions of things (science). Geometry requires the latter. *Leviathan* blurs this for rhetorical effect.

  5.  **Synthesize the Best Scholarly Consensus (without getting bogged down in citations):**
      *   Key scholars: Noel Malcolm, Tom Sorell, Daniel Garber, C.B. Macpherson (older), Howard Warrender.
      *   Consensus: It's not a contradiction, but a shift in emphasis. For Hobbes, *all* truth is linguistic (nominalist), but *science* requires that the linguistic structure mirrors the causal structure of conception.
      *   The "Stipulation" isn't arbitrary in science. You can't stipulate a square circle. You must stipulate a conception that is *possible* (i.e., generable).
      *   The bridge: *Conception*. We define words to fix *conceptions*. In geometry, the only clear conceptions are those of generation (motion).

  6.  **Drafting the Response (Iterative Process):**

