answer: |-
  This is an excellent question, and you are right to flag it as a potential sticking point for students. It cuts to the heart of Hobbes's nominalism and his unique attempt to ground scientific certainty in linguistic practice. The tension you identify between *Leviathan* (definition as settling significations) and *De Corpore* (definition as generative cause) is one of the most discussed issues in Hobbes scholarship.

  The short answer is that these are not two *different* notions of definition running together, but rather two different *descriptions of the same act* viewed from different angles: one logical/linguistic (*Leviathan*) and one metaphysical/epistemological (*De Corpore*). However, unpacking *how* they fit together requires navigating Hobbes's specific conception of "Truth" versus "Science."

  Here is a reconstruction of the interpretive landscape, structured to help you guide your seminar through the knot.

  ### 1. The Surface Tension: Stipulation vs. Generation

  First, let's validate the students' confusion.
  *   **In *Leviathan* (Ch. 4):** Hobbes is analyzing **Reason and Speech**. Here, "Truth" is strictly a property of propositions, not things. A definition is a tool to prevent ambiguity. If I define a "triangle" simply as "a three-sided figure," I have settled the signification. I know what word to use when. This looks like a linguistic convention.
  *   **In *De Corpore* (I.6 & II.9):** Hobbes is analyzing **Body and Motion**. Here, he argues that a definition like "a three-sided figure" is insufficient for *science*. It tells you the properties (has three sides) but not the *cause* of those properties. A scientific definition must be **generative**: "a figure described by the motion of a line." This tells you *how* the object comes to be.

  **The Problem:** If truth is just the right ordering of names (*Leviathan*), why does the *content* of the name need to reference physical motion or generation (*De Corpore*)? Why can't I just stipulate "triangle = three-sided figure" and reason from there with certainty?

  ### 2. Interpretive Option A: The "Truth vs. Science" Distinction

  The most robust way to resolve this is to distinguish between **Truth** (which *Leviathan* focuses on) and **Science** (which *De Corpore* focuses on).

  *   **Truth is Linguistic:** For Hobbes, there is no "truth" in the world. A stone is not "true." Only statements are true. Therefore, *Leviathan* is correct: definition is fundamentally about settling significations to ensure our propositions are unambiguous.
  *   **Science is Causal:** However, having true propositions isn't enough for *Scientia* (certain knowledge). Science is knowledge of **consequences**. To know consequences with certainty, you must know the **cause**.
  *   **The Synthesis:** In geometry, the "settling of significations" (*Leviathan*) *must* take the form of "generative definitions" (*De Corpore*) **if** we want to achieve Science rather than mere verbal consistency.

  **Pedagogical Hook:** Ask your students: "Can I make a true statement about a unicorn?" (Yes: 'A unicorn has one horn.'). "Do I have science of a unicorn?" (No, because it doesn't exist/causes are unknown). Hobbes argues that in geometry, we *make* the objects exist by defining them generatively. The "settling of significations" is the act of naming; the "generation" is the requirement for that naming to yield *knowledge* rather than just *grammar*.

  ### 3. Interpretive Option B: The Role of Conception (The Epistemic Bridge)

  This is the deeper metaphysical reading. For Hobbes, names stand for **conceptions** (motions in the mind), not directly for external objects.

  *   **The Problem of Arbitrary Stipulation:** If I define a circle merely as "a round shape," my conception is vague. I cannot deduce properties from "roundness" with certainty because "roundness" is a sensory quality, not a precise conception.
  *   **The Solution of Generation:** When I define a circle as "the figure generated by rotating a line around a fixed point," I am fixing a **precise conception** in the mind. I am telling the mind *how to construct* the idea.
  *   **Why this matters:** Because the definition prescribes a mental construction (a motion of thought), every property I later deduce is just a unpacking of that initial constructive act.

  **Resolution:** The "settling of significations" in *Leviathan* is the act of fixing the conception. Hobbes argues in *De Corpore* that the *only way* to fix a conception precisely enough for science is via generation. So, *Leviathan* describes the **function** of definition (fixing meaning), while *De Corpore* describes the **necessary content** of that function for it to work scientifically.

  ### 4. Interpretive Option C: The "Maker's Knowledge" Argument

  This addresses your concern about whether the tension undercuts geometry's superiority over physics. It actually reinforces it, but it requires a specific reading of "stipulation."

  *   **Physics:** We observe effects (heat, color, motion) and guess at causes. Our definitions are based on appearances. We are not the makers of natural bodies. Therefore, our definitions cannot be generative in the strict sense (we don't know how God/nature generated them).
  *   **Geometry:** We are the makers. When we define a circle generatively, we are asserting our own power to construct it.
  *   **The Crucial Move:** The "stipulation" in geometry is not arbitrary (like defining a "blorg"). It is a **performative stipulation**. To define the circle by its generation is to say, "I hereby construct this object in my mind according to this rule."

  **Does it undercut the argument?** No. If definitions were *merely* verbal stipulations (as a quick read of *Leviathan* might suggest), geometry would be a game of words with no more certainty than logic. But because Hobbes insists (in *De Corpore*) that the stipulation must be **constructive**, geometry gains its certainty. We know the properties of the circle with certainty because we know exactly what we did to make it.

  ### 5. Teaching Strategy: Three Questions to Unpack the Passage

  To help your students navigate this without getting lost in the secondary literature, you might structure the seminar around these three questions:

  1.  **What does a name stand for?**
      *   *Leviathan* says names stand for other names or conceptions.
      *   *De Corpore* implies names should stand for *causes*.
      *   *Synthesis:* Names stand for conceptions, but for science, the conception must be of a cause (generation).

  2.  **Is a definition a discovery or a decision?**
      *   For Hobbes, it is a decision (stipulation). But it is a decision constrained by **possibility**. I cannot stipulate a definition for a "square circle" because I cannot conceive of its generation. The "settling" is free, but the "content" is constrained by what the mind can construct.

  3.  **Why is Geometry the "only science"?**
      *   Use the *Leviathan* passage to show *why* we need definitions (to avoid being "belimed" in words).
      *   Use *De Corpore* to show *what kind* of definitions escape the lime-twigs. Only generative definitions allow us to trace the consequences back to the will of the definer. In physics, the "definer" is Nature/God, and we can't read His mind. In geometry, we are the definer.

  ### 6. Suggested Reading/Secondary Sources for You

  If you want to dig deeper into the scholarship to prepare for pushback:
  *   **Noel Malcolm:** His introduction to the Clarendon edition of *Leviathan* is superb on Hobbes's linguistic theory. He emphasizes that for Hobbes, philosophy *is* the computation of names, which makes the *Leviathan* passage primary, and *De Corpore* an elaboration on how to compute *correctly*.
  *   **Tom Sorell:** *Hobbes* (Routledge) deals well with the relation between the political and scientific works.
  *   **Daniel Garber:** Has written extensively on Hobbes's physics and how the geometric method applies (or fails to apply) to natural philosophy.
  *   **C.B. Macpherson (Older but useful):** On the "bourgeois" individualism, but also touches on the possessive nature of Hobbesian definitions (we own the definitions in geometry).

  ### Summary for the Seminar

  You can tell your students:
  "Hobbes is not contradicting himself, but he is shifting registers. In *Leviathan*, he is telling you what Truth *is* (linguistic order). In *De Corpore*, he is telling you how to get *Certainty* (causal generation). The 'settling of significations' is the genus; 'generative definition' is the species required for science. The tension dissolves when you realize that for Hobbes, to fix a meaning *scientifically* just is to fix the method of its construction. We are certain in geometry not because our words are magic, but because our words track the very motions of our own minds that create the objects."

  This preserves the nominalism (it's about names/mind) while securing the realism of the certainty (it's about construction/causes).
