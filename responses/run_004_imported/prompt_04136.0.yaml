answer: |-
  This is an excellent prompt for a capstone session because it forces the seminar to confront the *costs* of metaphysical commitment rather than merely cataloging the commitments themselves. The standard textbook presentation often suggests a standoff: Lewis buys parsimony in ontology (no haecceities, no abstract worlds) at the cost of intuition, while Kripke/Plantinga buy intuition at the cost of ontology (abstract worlds, individual essences).

  However, this framing understates the structural vulnerabilities of Counterpart Theory (CT) and overstates the vulnerability of Transworld Identity (TWI) once we distinguish between "Overlap TWI" (which Lewis refutes) and "Actualist TWI" (which survives).

  Here is an analysis designed to push your seminar past the stalemate, culminating in a defended verdict on which side pays the higher philosophical price.

  ### 1. The Cross-Fire: Humphrey vs. Accidental Intrinsics

  To evaluate the exchange, we must look at what each objection actually threatens.

  **Kripke's Humphrey Objection** is often dismissed as an appeal to "pre-theoretic intuition," but its philosophical weight is semantic. It charges CT with changing the subject. When we assert "Humphrey might have won," the truth-maker for this claim, on CT, is not a fact about Humphrey, but a fact about a *distinct* individual (a counterpart) in a *distinct* concrete universe.
  *   **The Cost:** Lewis must argue that our *de re* modal discourse is systematically misleading. He treats the identity of the subject as loose and pragmatic. The price here is the severing of the link between *reference* and *truth-conditions*. If I care about Humphrey's fate, and CT tells me the truth depends on someone else's fate, CT fails to capture the *aboutness* of modal claims.

  **Lewis's Accidental Intrinsics Objection** is a logical threat. If Humphrey is literally identical across worlds, and is sitting in $w_1$ and standing in $w_2$, and sitting/standing are intrinsic properties, then Humphrey is both sitting and not-sitting. This violates the Law of Non-Contradiction unless properties are relativized (e.g., *sitting-in-$w_1$*).
  *   **The Cost:** Lewis argues that relativizing intrinsic properties turns them into relations to worlds, thereby stripping them of their intrinsicality.
  *   **The TWI Defense:** This is where the seminar must distinguish **Overlap TWI** (the view that concrete individuals are parts of multiple worlds) from **Actualist TWI** (Plantinga's view). Overlap TWI indeed collapses under Accidental Intrinsics. However, Plantinga's Actualism posits that Humphrey exists only in the actual world, but possesses *world-indexed properties* (e.g., *winning-in-$w_1$*). These are intrinsic to Humphrey in the actual world. Lewis claims this is ad hoc, but Plantinga argues it preserves the logic of identity without contradiction.

  **Interim Weighing:** The Humphrey objection strikes at the *semantics* of modality (what are we talking about?), while Accidental Intrinsics strikes at the *logic* of properties (how can things have properties?). The Actualist TWI theorist can defuse Accidental Intrinsics by rejecting the "Overlap" picture which Lewis attacks. Lewis, however, cannot easily defuse Humphrey without admitting that *de re* modality is not really *de re*.

  ### 2. The Internal Rot: Vagueness and Multiplicity

  The decisive factor, often underweighted in introductory treatments, is the problem you noted regarding the **counterpart relation itself**.

  Lewis defines the counterpart relation via similarity. But similarity is notoriously vague and context-dependent.
  1.  **Vagueness:** There is no sharp cutoff for how similar a counterpart must be. This threatens bivalence. Is it true that "Humphrey might have been a lawyer"? If there is a borderline counterpart who is a lawyer, is the statement true, false, or indeterminate?
  2.  **Multiplicity:** Lewis was forced to abandon the postulate that nothing has a counterpart in its own world (worldmates can be counterparts). More critically, an individual can have multiple equally good counterparts in a single world who diverge in properties. One counterpart wins the election; another loses.

  **The Logical Consequence:** This creates a crisis for the logic of modality. Standard modal logic (S5) assumes that if something is possible, it is necessarily possible ($ \Diamond P \rightarrow \Box \Diamond P $). But on CT, whether Humphrey has a winning counterpart depends on which similarity metric we privilege. If the metric shifts, the truth value shifts. This makes modal claims context-sensitive in a way that undermines their utility for metaphysical analysis. It implies that "Humphrey might have won" has no determinate truth value independent of our conversational context.

  TWI (Actualist) avoids this. Humphrey's individual essence (haecceity) is rigid. Either the state of affairs *Humphrey-winning* is compossible with the actual world, or it is not. There is no "similarity metric" to fuzzify the truth conditions.

  ### 3. Substantive Dispute or Terminological Variant?

  Is it possible that a careful TWI theorist and a CT theorist are saying the same thing? **No.** The dispute is substantive for two reasons:

  1.  **The Logic of Identity:** CT typically requires abandoning the Necessity of Identity ($ \Box(x=y \rightarrow x=y) $) in its standard form, or at least complicating it significantly, because $x$ and $y$ might have different counterparts in other worlds. TWI preserves classical identity logic. This is not a notational difference; it is a divergence in logical commitment.
  2.  **Ontological Commitment to Concrete Worlds:** Lewis is a Modal Realist; the other worlds are concrete. Plantinga/Kripke are Actualists; other worlds are abstract states of affairs. While one might try to separate CT from Modal Realism (using abstract worlds with counterparts), the motivation for CT is largely to avoid the "miraculous" isolation of concrete worlds. If you keep abstract worlds, the motivation for CT (avoiding transworld identity of concrete particulars) weakens, and you are left with the vagueness problem without the ontological payoff.

  Therefore, they are not extensionally equivalent. CT validates different inferences and relies on different truth-makers than TWI.

  ### 4. The Verdict: Who Pays the Higher Price?

  In my judgment, **David Lewis's Counterpart Theory pays the higher philosophical price.**

  Here is the defense of that verdict:

  **1. Logic Trumps Ontology:**
  The Actualist TWI theorist (Plantinga) pays an ontological price: they must accept haecceities (individual essences) and abstract possible worlds. Lewisians often claim this is "spooky" or unparsimonious. However, ontological parsimony is a theoretical virtue, whereas logical determinacy is a theoretical *requirement*.
  CT's reliance on a vague similarity relation renders the truth conditions of modal claims indeterminate. A metaphysics of modality that cannot secure a determinate truth value for "Humphrey might have won" without appealing to conversational context has failed in its primary explanatory task. TWI secures determinate truth conditions via haecceities. It is better to multiply entities (haecceities) than to sacrifice the law of bivalence in metaphysical fundamentals.

  **2. The "Aboutness" Constraint:**
  Kripke's Humphrey objection is not merely an intuition pump; it is a constraint on reference. A theory of *de re* modality must explain how our thoughts latch onto objects across possibilities. CT admits it cannot do this literally; it offers a surrogate. TWI explains it via the rigid designation of the individual essence. While "haecceity" is a technical term, it functions to preserve the direct reference that CT explicitly abandons. Abandoning direct reference in a theory of *de re* modality is a confession of failure, not a feature.

  **3. The Accidental Intrinsics Objection is Solvable for TWI:**
  Lewis's strongest argument only kills *Overlap* TWI (the view that concrete parts are shared). It does not kill *Actualist* TWI. Plantinga's world-indexed properties are not "ad hoc" in a damaging sense; they are the necessary formal mechanism to reconcile modality with the Law of Non-Contradiction without relativizing intrinsics to relations. Lewis claims this makes properties extrinsic, but this begs the question. If *winning-in-$w_1$* is a property of Humphrey in the actual world, it is as intrinsic to him as any dispositional property. CT avoids this only by fracturing the subject into a series of counterparts, which returns us to the Humphrey problem.

  ### Conclusion for the Seminar

  You can advise your students that the "stalemate" is illusory. It exists only if one compares Lewis's CT against a naive version of TWI that posits concrete overlap. Once TWI is refined into Actualism (Plantinga), it absorbs the blow of Accidental Intrinsics.

  At that point, the comparison is between:
  *   **Actualist TWI:** Preserves classical logic, preserves direct reference (*de re*), secures determinate truth conditions. **Cost:** Ontological commitment to haecceities/abstract worlds.
  *   **Counterpart Theory:** Saves on ontology (no haecceities). **Cost:** Vague truth conditions, loss of direct reference, deviation from classical identity logic.

  The verdict is that **Actualist TWI is the superior theory.** The price of haecceities is lower than the price of indeterminacy and the loss of *de re* directness. Metaphysics is in the business of clarifying the structure of reality and truth; a theory that makes truth dependent on context-sensitive similarity metrics (CT) is less successful than one that posits abstract essences to ground rigid truth conditions (TWI). The dispute is substantive, and the transworld-identity theorist (of the Actualist variety) wins the exchange.
