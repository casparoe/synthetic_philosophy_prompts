answer: |-
  This is a fantastic intersection of intellectual history, moral philosophy, and meta-science. You are absolutely right to push back against the sanitized version of Sidgwick. The psychical research wasn't a hobby; it was a desperate philosophical lifeline. As he wrote in a letter to John Addington Symonds, if he became convinced that death ends all, he didn't see how he could go on living (a sentiment he reportedly acted upon in a grim, controlled way at the end of his life).

  The "Dualism of Practical Reason" is the key here. Sidgwick couldn't reconcile Rational Egoism (maximize my own good) with Universal Hedonism/Utilitarianism (maximize everyone's good) unless there was a cosmic guarantee that doing the right thing ultimately aligns with self-interest (i.e., divine justice/afterlife). Without that, morality is rationally unstable.

  So, if we drop 1880s Sidgwick into 2011 to watch the Daryl Bem *Feeling the Future* saga unfold, here is how I suspect his rigorous, melancholy mind would process it.

  ### 1. The Bem Saga: Hopeful or Less?

  **Initial Reaction: Cautious Elation**
  Sidgwick would initially be thrilled, but not because he was a gullible believer. He would be thrilled by the *source*. In the 1880s, the SPR had to rely on mediums, drawing rooms, and anecdotal testimony. Bem was a tenured professor at Cornell publishing in *Journal of Personality and Social Psychology*. This is the institutional validation Sidgwick dreamed of. It suggests psi isn't the province of charlatans but a replicable feature of human psychology. For a moment, the "Dualism" might seem solvable: if time is non-linear (precognition), the materialist worldview cracks, leaving room for the soul/moral order.

  **Secondary Reaction: The Bayesian Crash**
  However, Sidgwick was a logician first. When Eric-Jan Wagenmakers and others tore into Bem using Bayesian analysis, pointing out that p < .05 is weak evidence for extraordinary claims, Sidgwick would nod grimly. He understood the "burden of proof" intuitively, even without Bayes Factors.

  When the replications failed, and when it became clear that *p-hacking* and flexible analysis protocols produced the positive results, Sidgwick's hope would likely curdle into a deeper pessimism than he started with. Why? Because the 1880s SPR could blame "fraudulent mediums." The Bem saga reveals something scarier: **respectable scientists can unconsciously cook results when they want something to be true.**

  **Verdict on Psi:** **Less Hopeful.** The Bem episode demonstrates that even with modern tools, human desire for the anomalous corrupts data. If a top psychologist can't get precognition to stick under preregistered scrutiny, the probability of it being the "key to the moral order" drops precipitously.

  **Verdict on the Dualism:** **Unresolved (and more painful).** Sidgwick would see the failure of Bem not just as a failure of parapsychology, but as a failure of the *hope* that science could rescue ethics. The "Dualism" remains. He would likely conclude that if evidence for a moral order exists, it is not accessible via empirical inquiry, pushing him closer to his "fundamental paradox": we must act as if morality is rational, even if reason suggests it isn't.

  ### 2. Sidgwick's Methodology vs. Modern Meta-Science

  This is where it gets really interesting. You asked if the 1880s SPR methodology looks embarrassingly credulous. The answer is nuanced.

  **Where the SPR Looks Weak:**
  *   **Statistical Naivety:** They aggregated anecdotes. They didn't have null hypothesis testing. They relied on "cumulative weight of testimony," which is vulnerable to the file-drawer problem (they heard about the hits, not the misses).
  *   **Experimenter Bias:** Sidgwick, Myers, and Gurney *wanted* it to be true. They lacked blinding protocols that are standard now.
  *   **The Palladino Problem:** The SPR's later reputation suffered because they were sometimes too slow to condemn mediums they liked (like Eusapia Palladino), letting personal relationships override skepticism.

  **Where the SPR Looks Surprisingly Modern:**
  *   **Skepticism as Default:** Contrary to pop history, the early SPR was *not* a club of believers. It was founded to apply scientific skepticism to the supernatural. They exposed the Slate writing medium Henry Slade. They were notoriously hard to convince.
  *   **The "Phantasms of the Living" Approach:** Their massive two-volume collection of case studies was an attempt at data aggregation. It was qualitative meta-analysis.
  *   **Focus on Fraud Detection:** A huge portion of their energy went into designing controls to prevent trickery.

  **Would Sidgwick Embrace Preregistration?**
  **Absolutely.** In fact, Sidgwick would likely view preregistration as a **moral imperative**.

  Remember, Sidgwick's drive for psychical research was ethical. He feared self-deception. In *The Methods of Ethics*, he is obsessed with clarity and avoiding rationalization. Preregistration is the ultimate technological solution to the human tendency to rationalize noise as signal.

  If Sidgwick saw the "Replication Crisis reforms" (preregistration, open data, registered reports) emerge *from* the Bem mess, he would view the crisis itself as tragic, but the *response* as a vindication of the scientific method's self-correcting nature. He would argue that the SPR's original sin wasn't studying psi; it was failing to lock down their protocols tightly enough to prevent their own hopes from influencing the data.

  ### 3. The "ACX-Brain" Synthesis

  Here is the synthesis that I think fits your framing:

  Sidgwick is the patron saint of the Rationalist Community's struggle with "hard problems." He represents the tension between **Epistemic Rigor** (don't believe without evidence) and **Axiological Need** (I need this to be true for life to make sense).

  The Bem saga confirms Sidgwick's worst fear: **The universe does not owe us evidence that aligns with our moral needs.**

  *   **On Methodology:** Sidgwick wouldn't be embarrassed by the SPR's goals, but he would be critical of their statistics. However, he would feel vindicated by the modern shift toward rigor. He would argue that the failure of Bem under preregistration proves that *only* the strictest methods are worthy of investigating claims that touch on the Dualism of Practical Reason.
  *   **On Hope:** He would come away less hopeful about psi, but perhaps strangely comforted by the integrity of the process. If science is robust enough to kill its own darlings (like Bem's paper), then science is trustworthy.
  *   **The Tragic Conclusion:** Sidgwick would likely conclude that the "Dualism of Practical Reason" cannot be solved empirically. The Bem saga proves that even when you think you have p < .05 evidence for a miracle, it might just be noise. Therefore, the moral life must be lived in the absence of empirical confirmation of a moral order.

  In a way, watching the Bem saga might have saved Sidgwick from his own depression. It would have shown him that the lack of evidence isn't a failure of *his* investigation or *science*, but a feature of reality. He wouldn't get his proof of the soul, but he would get proof that **honesty about uncertainty is the only rational stance.**

  It reinforces the Sidgwickian view that we must be "esoteric" utilitarians in a way: we must uphold the moral order not because the universe guarantees it, but because it is necessary for human flourishing, even if the cosmos is indifferent. The failure of precognition to replicate forces us to live in the world as it is, not the world we wish for—a very Sidgwickian, very stoic conclusion.
