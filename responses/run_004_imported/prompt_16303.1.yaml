      *   *BI Logic:* At the last node, Player 2 Takes. Knowing this, Player 1 Takes at the second-to-last. Unravels to Node 1.
      *   *The Paradox:* BI predicts immediate defection. Experiments show cooperation for several rounds.
      *   *The Core Tension:* Common Knowledge of Rationality (CKR). If CKR holds, BI holds. If Player 1 Passes, CKR is falsified *unless* we model uncertainty about rationality.
      *   *Interlocutor A's Challenge:* If you admit the possibility of irrationality, you change the game. But if the game is defined by rational agents, deviating is a logical contradiction. How can you update on an event that has probability zero under your model?
      *   *Interlocutor B's Challenge:* If your model predicts an event with probability zero, and it happens, your model is wrong, not reality. Rationality includes Bayesian updating. Sticking to BI after a Pass is dogmatic, not rational.

  3.  **Drafting - Character Conception:**
