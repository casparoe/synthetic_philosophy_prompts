      *   *Elena's Rebuttal:* But we are discussing normative rationality, not descriptive psychology. If I *know* you are rational, I *must* defect. If you pass, I cannot *know* you are rational. But if I assume you might be irrational, I'm no longer analyzing the standard paradox.
      *   *Marcus's Rebuttal:* The standard paradox is self-defeating. It requires CKR to generate the solution, but the solution makes the path to CKR verification impossible. A truly rational agent maximizes expected utility. If passing yields higher EU given the updated belief, passing *is* the rational move.

