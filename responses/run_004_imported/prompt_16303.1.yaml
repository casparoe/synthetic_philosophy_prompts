      *   *Marcus:* Rationality isn't a static label; it's a process. If the prior probability of rationality isn't 1 (which it never is in reality), Bayesian updating dictates shifting belief upon observing a Pass.
      *   *Elena's Counter:* If you assign non-zero probability to irrationality *ex-ante*, the BI solution changes immediately. You aren't solving the Centipede Game anymore; you're solving a game with incomplete information.
