  3.  **Identify the Core Philosophical Concepts:**
      *   **Finitude vs. Infinity:** For Hegel, finite things (life, property) are defined by their end. They *must* pass away. The State aims at a higher kind of existence (ethical life/Sittlichkeit).
      *   **Ideality (Idealität):** This is the tricky one. It doesn't mean "utopian." It means "subordination." To say something is "ideal" in Hegel's logic is to say it is a moment within a higher whole, not self-subsistent. War demonstrates that life/property are *not* absolute; they belong to the State.
      *   **Contingency vs. Necessity:** Natural death is contingent/accidental from the perspective of the individual. But from the perspective of the Concept (the State), the *fact* that finite things perish is necessary. War makes this perishability explicit and willed, rather than just biological decay.
      *   **The State as Ethical Substance:** The State isn't a contract for protection (Locke). It's the actualization of freedom. If the State is the ground of rights, it cannot be subordinate to the rights (life/property) it grounds.

