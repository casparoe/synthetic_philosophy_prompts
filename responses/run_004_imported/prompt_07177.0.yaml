answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, [Journal Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Statistical Reporting Reforms Following Replication Failures

  ### Executive Summary

  In light of recent high-profile replication failures involving research published in our journal, we are tasked with selecting a new statistical reporting framework. Two proposals are on the table: **Proposal A** (retaining Null Hypothesis Significance Testing [NHST] with mandatory preregistration and a stricter threshold of $p < .005$) and **Proposal B** (replacing NHST with mandatory preregistered Bayes Factors).

  After reviewing the methodological literature regarding the mechanisms that produced the replication crisis in social psychology, **I recommend adopting a modified version of Proposal A.** Specifically, we should mandate preregistration and lower the discovery threshold to $p < .005$, but we must also require that **effect sizes and confidence intervals be treated as the primary evidence**, with $p$-values serving only as a secondary gatekeeper.

  I do not recommend Proposal B. While Bayesian methods offer theoretical advantages, they do not structurally eliminate the researcher degrees of freedom that caused our field's crisis. Adopting Proposal B risks replacing one set of manipulable metrics with another, potentially more opaque set, without solving the underlying incentive problems.

  ### 1. Diagnosis: What Broke Our Field?

  To choose the right fix, we must agree on the cause of the failure. The replication crisis in social priming and ego depletion was not caused primarily by the mathematical properties of the $p$-value in isolation. It was caused by **Questionable Research Practices (QRPs)** driven by publication incentives.

  The specific mechanisms of failure were:
  1.  **Optional Stopping:** Collecting data until $p < .05$.
  2.  **The Garden of Forking Paths:** Making post-hoc decisions about covariates, exclusions, and transformations to achieve significance.
  3.  **Publication Bias:** The file drawer problem, where null results remain unpublished.

  Any reform that does not directly constrain these behaviors will fail, regardless of the statistical philosophy employed.

  ### 2. Evaluating the Bayesian Claim (Proposal B)

  Proponents of Proposal B argue that Bayesian analysis is structurally superior because it adheres to the **Likelihood Principle**. Under this principle, the evidential meaning of data does not depend on the stopping rule or the intention of the researcher. Theoretically, this removes the temptation for optional stopping and corrects for multiple comparisons without the need for rigid corrections.

  **This claim is mathematically sound but practically incomplete.**

  While the Likelihood Principle protects against *stopping* rules, it does not protect against *modeling* rules. A Bayesian analysis requires the specification of a prior distribution and a likelihood model. In complex social science data, these are not fixed facts; they are choices.
  *   **Prior Degrees of Freedom:** A researcher can select a prior that maximizes the Bayes Factor in their favor. While preregistration of the prior helps, "defensible" priors often span a wide range. A researcher can test several reasonable priors and report only the one yielding the strongest evidence for their hypothesis.
  *   **Model Specification:** Just as a frequentist can choose which covariates to include, a Bayesian can choose which hierarchical structures or distributional assumptions to model. This remains a "garden of forking paths."
  *   **Interpretation:** Proposal B suggests "no fixed decision threshold." In practice, without a threshold, authors and editors will adopt *de facto* thresholds (e.g., BF > 3 or BF > 10). This recreates the dichotomous thinking of NHST but with less standardized criteria for what constitutes "success."

  In short, moving to Bayesian statistics moves the locus of researcher discretion from *data collection and $p$-hacking* to *prior and model specification*. It does not remove the discretion.

  ### 3. Evaluating the Frequentist Reform (Proposal A)

  Proposal A retains NHST but tightens the constraints.
  *   **Preregistration:** This is the critical component. By forcing authors to declare their sample size, stopping rule, and analysis plan in advance, we directly attack optional stopping and the garden of forking paths.
  *   **$p < .005$:** Recent methodological consensus (e.g., Benjamin et al., 2018) suggests that in low-power fields like social psychology, $p < .05$ yields an unacceptably high false positive rate. Lowering the threshold to .005 reduces the false positive rate significantly, even in the presence of some residual bias.

  **The Weakness:** NHST encourages dichotomous thinking ("significant" vs. "non-significant"), which can lead to the dismissal of meaningful null results or the overinterpretation of trivial effects.

  **The Mitigation:** By mandating that **effect sizes and confidence intervals** be the primary focus of the results section, we can retain the auditability of NHST while encouraging estimation over testing.

  ### 4. Why Proposal A is the Robust Choice

  The choice between Proposal A and B is not a choice between "wrong" and "right" statistics. It is a choice between **auditability** and **ambiguity**.

  1.  **Enforceability:** It is easier for reviewers and editors to verify if a preregistered frequentist analysis was followed than to evaluate the appropriateness of a Bayesian prior. A $p$-value calculation is standardized; a prior justification is subjective. In a journal seeking to restore trust, standardized metrics are easier to police.
  2.  **Compatibility:** Our author base is trained in NHST. Forcing a switch to Bayesian analysis without deep training will lead to computational errors and misinterpretations that could introduce new noise into the literature.
  3.  **The "Magic Bullet" Fallacy:** Adopting Proposal B risks signaling that we have "solved" the bias problem by changing the math. This is dangerous. If authors believe Bayes Factors immunize them against accusations of $p$-hacking, they may be less rigorous about preregistration compliance. Proposal A makes no such claim; it explicitly acknowledges that the *process* (preregistration) is the constraint, not the statistic.

  ### 5. Recommendation

  I propose the board adopt the following **Hybrid Policy**, grounded in Proposal A but augmented to address its weaknesses:

  1.  **Mandatory Preregistration:** All empirical submissions must include a time-stamped preregistration of hypotheses, sample size, and analysis plan. Deviations must be explicitly justified and labeled as exploratory.
  2.  **Primary Reporting:** Results must be reported primarily as **effect sizes with confidence intervals**. Claims of "effects" must be based on the magnitude and precision of the estimate, not solely on statistical significance.
  3.  **Secondary Threshold:** For claims of new discoveries, statistical significance must meet **$p < .005$**.
  4.  **Bayesian Options:** Authors are *permitted* to include Bayes Factors as supplementary evidence, but they must include a **sensitivity analysis** showing how the BF changes under different reasonable priors. This prevents "prior hacking" while allowing the use of the tool.

  ### Conclusion

  My colleague at dinner argued that Bayesianism solves the replication crisis because the Likelihood Principle renders stopping rules irrelevant. She is correct about the math, but incorrect about the psychology of research. The replication crisis was not caused by stopping rules alone; it was caused by the flexibility researchers have to shape their analysis to fit their hypotheses.

  Bayesian methods do not remove this flexibility; they merely shift it to the specification of priors and models. Therefore, Proposal B does not offer the structural immunity its proponents claim. Proposal A, combined with strict preregistration and a focus on estimation, offers a more transparent, auditable, and enforceable path to restoring confidence in our published literature.

  We should not choose a statistical framework because it is philosophically purer. We should choose the one that is most robust to human nature.

  **Recommended Action:** Vote to adopt the Modified Proposal A as outlined above.
