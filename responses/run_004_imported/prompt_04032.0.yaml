  so i went down a rabbit hole reading about that whole COMPAS recidivism algorithm scandal from a few years back, and apparently theres an actual mathematical proof that you can't build a risk-assessment algorithm that's equally calibrated across racial groups AND has equal false positive/false negative rates across those groups, unless the groups happen to have the exact same base rate of reoffending to begin with. if mathematicians already proved thats impossible, i don't get why courts and companies keep paying for "fairness audits" and announcing that their newest version finally fixed the racial bias. shouldn't the honest move just be to admit these tools can never actually be fair and go back to human judges making the calls, instead of pretending each new patch gets us closer?
