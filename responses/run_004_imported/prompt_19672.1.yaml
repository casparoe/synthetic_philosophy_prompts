      6.  Relevance to the Hole Argument/Dissertation.

  8.  (Self-Correction during drafting): Make sure to mention *phenomena bene fundata*. That's crucial for why the spheres themselves aren't the ultimate truthmakers. Also, mention that for Leibniz, a universe with *only* two bodies is arguably impossible because monads mirror the *entire* universe from a perspective, implying a richness that two spheres might not satisfy, but stick to the thought experiment's constraints.

