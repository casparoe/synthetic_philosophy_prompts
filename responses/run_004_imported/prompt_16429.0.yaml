answer: |-
  Thank you for being here. For those of you who knew my uncle well, you know that Hollis would have been deeply annoyed by a eulogy that relied on comfort rather than precision. He left me specific instructions on this. He told me not to tell you he is sleeping, because he knew the biology of death is not sleep. He told me not to tell you he is gone, because he spent thirty years arguing that "gone" is a word that lacks a clear referent.

  He told me to tell you the truth about the branch line.

  Many of you know the thought experiment. The teletransporter. It scans you, dismantles you here, and rebuilds you there. Most people ask: Is the person on the other side *me*? Hollis spent his retirement convincing us that this is the wrong question. The question is: Does what matters survive?

  Hollis viewed his own life, and this moment, through that lens. He knew that the man who died in March was the branch line. He knew that the physical pattern of him is currently suspended in liquid nitrogen, waiting on a future that may or may not arrive. He did not ask us to bet on that future. He asked us to recognize the continuity that exists right now, in this room.

  To my mother's side of the family, who feel the sharp, final silence of his absence: Hollis knew you would feel this. He did not think your grief was mistaken. He understood that for the branch line, the end is real. The Hollis who taught us how to fish, who argued about politics at Thanksgiving, who held my hand when my father died—that specific trajectory has closed. He did not want you to pretend otherwise. He respected the reality of your loss because he respected the reality of your love. That connection is not dependent on his revival. It is dependent on the fact that it happened.

  To his colleagues and friends from the cryonics circle, who view this as an intermission: Hollis valued your hope, but he did not want it to become a dogma. He did not want you waiting for a resurrection that would validate your faith. He wanted you to continue the work. He viewed the preservation of his body not as a guarantee of return, but as a statement of optimism about the future of physics, of medicine, and of the human mind. He wanted you to carry the pattern of his curiosity forward, regardless of whether the vessel ever wakes.

  So, where does that leave us? Divided by our expectations, but united by our connection to him.

  Hollis believed that survival is not a binary switch. It is not all or nothing. It is a matter of degree. In the stories he left behind, in the papers he wrote, in the way his skepticism tempered our impulsiveness, and in the way his silence commands this room today—he is psychologically continuous with us. We are the carriers of his Relation R. We hold the memories, the habits, and the arguments that made him Hollis.

  If he wakes in a century, he will wake because we kept the idea of him alive long enough for the science to catch up. If he does not wake, he survives in the changes he made to our own neural pathways, in the way we think about time and identity because he taught us how.

  He forbade me from speaking of his soul. He found the concept imprecise. But he allowed me to speak of his pattern. The pattern of Hollis was one of rigorous honesty. He would not want us to lie to each other tonight about the odds. But he would want us to acknowledge that the story does not end simply because the narrator has stepped away from the microphone.

  We are not here to witness an ending, and we are not here to witness a beginning. We are here to witness a transfer of weight. The weight of his memory, the weight of his questions, and the weight of his peculiar, stubborn love for a future he knew he might not see.

  So, let us not say "Rest in Peace." Hollis never rested. Let us not say "Goodbye." He argued that goodbyes imply a separation that may not exist.

  Instead, let us simply acknowledge the branch line. It ran its course. It was sturdy. It bore fruit. And whether the tree grows on from the root in the tank, or only through the seeds scattered in this room, the forest remains.

  Thank you, Hollis. We have the connection. We will hold it.
