      *   **The Constraints (Hollis's Notes):**
          *   Do *not* promise he will wake up (he argued survival might have no determinate answer, citing Parfit).
          *   Do *not* treat this as ordinary death (no "gone to a better place," no finality).
          *   Do *not* use soul-talk/religious metaphors (he found them embarrassing).
          *   Key Concept: "Branch-line case" (Teletransporter thought experiment where the original dies but a psychological continuer exists).
          *   Key Concept: What matters in survival (Parfit's reductionist view: psychological continuity/connectedness matters more than strict numerical identity).
      *   **The Speaker:** A novelist in the family (needs to be narrative, evocative, but intellectually honest).
      *   **Goal:** A eulogy that bridges the divide, honoring Hollis's specific philosophical stance without alienating either side.

  2.  **Deconstruct the Philosophy (Parfit & Cryonics):**
      *   *Derek Parfit:* In *Reasons and Persons*, he argues that personal identity isn't what matters. What matters is *Relation R* (psychological connectedness and continuity). If my memories, character, and intentions continue, "I" survive in the sense that matters, even if the strict "ego" doesn't persist in a metaphysical soul sense.
      *   *The Branch-Line Case:* A thought experiment where a teletransporter creates a copy on Mars but destroys the original on Earth. The original (branch line) dies shortly after. Parfit suggests the original shouldn't fear death *too* much because his life continues in the copy.
      *   *Hollis's Application:* He views his cryopreservation as a branch-line case. The "Hollis" speaking tonight is the branch line. The potential future Hollis is the continuer. Whether they are numerically identical is an open question, but the *connection* is what matters.
      *   *The Tension:* The cryo group wants hope of revival (Identity preserved). The family wants closure (Identity lost). Hollis says: "Identity is the wrong metric. Connection is the right one."

  3.  **Determine the Tone:**
      *   Intellectual but accessible (Novelist voice).
      *   Warm but precise (Honoring the physicist/philosopher).
      *   Ambiguous but meaningful (Navigating the "don't promise/don't deny" constraint).
      *   Bridging the gap: Acknowledge the physical absence while validating the ongoing narrative.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unusual nature of the gathering. Validate both rooms without mocking either.
          *   *Idea:* Start with the concept of the "room." Two groups, one man.
      *   **The Philosophy (The Hard Part):** Explain the "Branch-Line" without getting bogged down in jargon. Use the novelist's toolkit (metaphor/story).
          *   *Idea:* Use the metaphor of a book or a story. A sentence ending, but the paragraph continues. Or a river branching. Let's stick closer to his "branch-line" terminology but soften it.
      *   **Addressing the Cryo Group:** Acknowledge their hope without confirming the revival.
          *   *Idea:* They are waiting for the next chapter. That waiting is a form of connection.
      *   **Addressing the Family:** Acknowledge their grief and the finality they feel.
          *   *Idea:* They feel the silence. That silence is real too.
      *   **The Synthesis (What Matters):** Parfit's "Relation R." It's about memory, influence, and love.
          *   *Idea:* Hollis lives in how we think about him. The physical body is suspended, but the psychological impact is active *now*.
      *   **Closing:** A send-off that fits the "long goodbye" vs. "funeral" split.
          *   *Idea:* Not "Rest in Peace," not "See you later." Maybe "To the continuation."

  5.  **Refining the Voice (Novelist vs. Philosopher):**
      *   Avoid dry academic language ("numerical identity," "psychological continuity").
