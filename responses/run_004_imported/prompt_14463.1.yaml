prompt: |-
  So I'm on the board of a small nonprofit that helps people coming out of prison find jobs. We're about to sign a new funding deal that pays us based on hitting a 60% job-placement-within-90-days rate, checked monthly. Problem is, our case managers already quietly avoid the hardest clients (no stable housing, long sentences, spotty work history) because they tank the numbers, and this contract's gonna make that worse. We've also been testing an AI tool that ranks clients for job coaching, and its already nudging coaches toward the 'easy' cases too, presumably cause that's what scored good in training. Feels like the human and the AI version of the exact same problem (I think this is what people mean by Goodhart's law, but I'm self taught on this stuff so correct me if I'm off). I gotta bring something real to the board meeting Thursday, not just 'let's be aware of it.' Can you write the actual memo I'd bring to that meeting -- something that actually recommends whether we sign as is, renegotiate, or walk away, says what to do about the AI tool, and puts a timeframe on it -- and doesn't just wave away the argument that a hard number might genuinely beat the vibes-based way we judge ourselves now.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Board member of a small nonprofit (prison reentry/job placement).
      *   **Situation:** About to sign a funding deal based on a specific metric (60% job placement within 90 days, checked monthly).
      *   **Problem:** Case managers already "cream" (avoid hard clients) to protect numbers. An AI tool is reinforcing this bias. The new contract incentivizes this behavior even more.
      *   **Concept:** User identifies this as Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure").
      *   **Goal:** A concrete memo for the Thursday board meeting.
      *   **Requirements:**
          *   Recommend a specific course of action (Sign, Renegotiate, Walk).
          *   Address the AI tool.
          *   Set a timeframe.
          *   Acknowledge the counter-argument (metrics *are* better than "vibes").
          *   Tone: Professional, actionable, realistic, ethically grounded.

  2.  **Deconstruct the Ethical & Operational Dilemma:**
      *   *The Funding:* Nonprofits need money. Walking away is risky.
      *   *The Metric:* 60% in 90 days is aggressive for this population. Monthly checks create high pressure.
      *   *The Behavior:* "Creaming" (selecting easiest candidates) undermines the mission (helping those who need it most).
      *   *The AI:* Automating bias. If trained on past success, it learns to ignore hard cases.
      *   *Goodhart's Law:* Yes, the user is correct. Optimizing for the metric will degrade the mission.

  3.  **Determine the Recommendation:**
      *   *Sign as is?* Too dangerous. Incentivizes mission drift.
      *   *Walk away?* Desperate if funding is scarce. Last resort.
      *   *Renegotiate?* Best path. Try to adjust the metric or the reporting structure to account for risk stratification.
      *   *AI:* Pause or retrain immediately. Cannot use a biased tool to allocate resources under this contract.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Board Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Get straight to the point. Risk identified, recommendation made.
      *   **Context:** Briefly state the deal and the metric.
      *   **The Risk (Goodhart's Law):** Validate the user's intuition. Explain *why* this metric is dangerous without sounding academic. Use terms like "mission drift" and "creaming."
      *   **The Counter-Argument (Accountability):** Acknowledge that "vibes" aren't enough. We *do* need accountability. This builds credibility.
      *   **The AI Issue:** Specific callout. The tool is amplifying the risk.
      *   **Recommendations:**
          1.  Renegotiate terms (risk adjustment, longer timeline, quarterly vs. monthly).
          2.  AI Moratorium/audit.
          3.  Internal safeguards (cap on high-need clients).
      *   **Timeline:** Immediate actions before Thursday (or shortly after).
      *   **Conclusion:** Reiterate mission alignment.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "Walk Away" too extreme?
      *   *Correction:* Make it a conditional walk away. If they won't budge on risk adjustment, *then* walk.
      *   *Critique:* Is the AI section too technical?
      *   *Correction:* Keep it operational. "Pause deployment" is clearer than "retrain weights."
      *   *Critique:* Did I address the "vibes" argument?
      *   *Correction:* Ensure a section explicitly validates the need for data, just *better* data.
      *   *Tone Check:* Needs to be firm but collaborative. Not "I know better," but "Here is a risk to our sustainability."

  6.  **Incorporating Goodhart's Law:**
      *   Explicitly name it but explain it simply. "When a measure becomes a target, it ceases to be a good measure."
      *   Connect it to the specific behavior: Case managers avoiding homeless clients.

  7.  **Final Polish:**
      *   Check formatting (bolding, bullet points).
      *   Ensure the "Ask" is clear (Vote to authorize renegotiation).
      *   Make sure the timeline is realistic for a Thursday meeting.

  8.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation included? Yes (Renegotiate).
      *   AI addressed? Yes (Pause/Audit).
      *   Timeframe? Yes (Immediate/30 days).
      *   Counter-argument addressed? Yes (Accountability section).

  *(Self-Correction Note: Make sure to emphasize that 90 days is very short for someone coming out of prison with no housing. This strengthens the argument for renegotiation.)*

  9.  **Drafting the Output.** (Proceeds to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name], Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** Risk Assessment & Recommendation Regarding Proposed Performance-Based Funding Contract

  ### Executive Summary
  We are currently evaluating a funding contract that ties reimbursement to a 60% job-placement rate within 90 days of enrollment, measured monthly. While this funding is critical, the specific performance metrics create a high risk of **mission drift**. 

  Current internal data and staff behavior indicate that to hit these targets, we will be incentivized to "cream" (select only the most employable clients) and "park" (ignore high-need clients). This is compounded by our pilot AI tool, which is already replicating this bias. 

  **Recommendation:** Do not sign the contract as currently written. Authorize the Executive Director to **renegotiate** for risk-adjusted metrics and a longer measurement window. **Pause the AI tool's operational use** immediately pending an audit. If renegotiation fails within 30 days, we should decline the contract to protect our long-term viability and reputation.

  ---

  ### 1. The Core Risk: Goodhart's Law in Practice
  You may have heard the term **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*

  In our context:
  *   **The Measure:** % of clients employed within 90 days.
  *   **The Target:** 60% monthly threshold.
  *   **The Consequence:** Staff will stop serving clients who threaten that number (e.g., those without housing, long incarceration gaps, or lack of ID). 

  We are already seeing early signs of this. Case managers are informally prioritizing "work-ready" clients to keep our current stats up. This contract formalizes that incentive. If we sign as-is, we effectively become a temp agency for the easiest-to-place ex-offenders, abandoning the population that actually needs reentry support the most.

  ### 2. Addressing the Counter-Argument: Accountability vs. Vibes
  We must acknowledge the argument for this contract: **Accountability.** 
  For years, nonprofits have operated on "vibes-based" success stories without rigorous data. That is unsustainable. Funders are right to demand proof of efficacy. We *do* need hard numbers to validate our work and improve our methods. 

  However, a **raw placement rate** is a blunt instrument. It measures *client employability* as much as *program effectiveness*. A 60% target is achievable if we only serve clients who were likely to find work anyway. It is a failure if we serve the hardest cases but only hit 40%. 

  We need metrics that measure **value add**, not just **outcomes**.

  ### 3. The AI Complication
  Our pilot AI tool, designed to prioritize coaching resources, is currently trained on historical placement data. Because our historical data reflects human bias toward "easier" cases, the AI is learning to recommend those same clients. 

  Deploying this tool under the new contract creates a feedback loop:
  1.  Contract demands high placement rates.
  2.  AI recommends low-risk clients to meet rates.
  3.  High-risk clients receive less support.
  4.  High-risk client outcomes worsen.
  5.  AI learns high-risk clients are "bad investments."

  This automates discrimination against the people we were founded to serve.

  ### 4. Strategic Recommendations

  #### A. Contract Renegotiation (Priority 1)
  We should not walk away from funding, but we must change the terms to align with our mission. I propose we ask the funder for the following adjustments:
  *   **Risk Stratification:** Clients should be categorized by barrier level (e.g., Housing Secure vs. Homeless). We should have different targets for each tier (e.g., 70% for low-barrier, 40% for high-barrier).
  *   **Measurement Window:** Move from **monthly** to **quarterly** reporting. Monthly variance is high and encourages panic decisions. 90 days is also an aggressive timeline for high-barrier individuals; request a 180-day secondary metric.
  *   **Safety Valve:** A clause that allows for contract review if the client mix shifts significantly toward high-barrier cases due to external factors (e.g., a local prison closes a halfway house).

  #### B. AI Tool Moratorium (Priority 2)
  *   **Immediate Action:** Pause the use of the AI tool for client prioritization effective immediately. It may remain in "shadow mode" (running in the background) for data collection only.
  *   **Audit:** Form a small committee (Board + Program Director) to review the AI's weighting criteria. We must retrain or adjust the model to value "difficulty of placement" as a positive metric, not a negative one.
  *   **Timeline:** Audit complete within 30 days.

  #### C. Internal Safeguards
  Regardless of the contract outcome, we must adopt an internal policy:
  *   **Caseload Caps:** No more than X% of any case manager's active caseload can be classified as "low barrier." This forces engagement with high-need clients.
  *   **Qualitative Reporting:** We must track and report "non-placement successes" (e.g., housing secured, ID obtained, family reunification) to the Board monthly, even if the funder doesn't pay for them.

  ### 5. Proposed Timeline

  | Action Item | Owner | Deadline |
  | :--- | :--- | :--- |
  | **Board Vote** on this recommendation | Board Chair | **Thursday Meeting** |
  | **Pause AI Tool** deployment | Exec Director | **Friday (Day 1)** |
  | **Draft Renegotiation Terms** | Exec Director | **Next 7 Days** |
  | **Submit Counter-Proposal** to Funder | Exec Director | **Next 14 Days** |
  | **AI Audit Committee Formed** | Board/Staff | **Next 30 Days** |
  | **Final Decision** (Sign or Walk) | Board | **Day 45** |

  ### 6. Motion for Thursday's Meeting
  I move that the Board authorizes the Executive Director to negotiate the proposed contract **only** under the condition of risk-adjusted performance metrics and quarterly reporting. Further, I move that we suspend the operational use of the AI prioritization tool pending an equity audit.

  If the funder cannot accommodate risk adjustment, we must be prepared to walk away. Signing a contract that financially penalizes us for serving our core mission is not sustainability; it is slow suicide.

  ---

  **Prepared by:** [Your Name]
  **Attachments:** *Draft Risk-Stratification Model, AI Pilot Summary Data*
