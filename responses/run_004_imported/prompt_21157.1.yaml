answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Ray's nephew/niece.

  We are here to celebrate thirty-eight years. Thirty-eight years on the floor of the auto plant. That is a lifetime of shifts, of overtime, of clocking in and clocking out. But if you look around this room, you'll notice nobody calls him "Ray the Line Worker." Nobody calls him "Ray the Assembler."

  They call him "The Professor."

  Now, usually, "Professor" implies a degree. A diploma. Maybe a tweed jacket with elbow patches. Ray's credentials are a bit different. He didn't finish high school. His library was the breakroom table and a stack of secondhand paperbacks he picked up at garage sales for a quarter apiece. He read them while eating his bologna sandwich, usually with a red pen in his hand, underlining things that made him angry and things that made him nod.

  And because he is Ray, and because he loves us, I have to address the elephant in the room before I get too far into this toast. I know half the people in this room are listening to my syntax very carefully. Specifically, the old union guys in the back. I know that if I misuse a term, Ray won't yell. He won't get mad. He'll just stop me mid-sentence, take a slow sip of his drink, and wait until I correct myself.

  So, let's get the record straight, the way Ray taught me.

  Ray says there are two things people get confused about. Exploitation and Alienation. They sound similar, but to Ray, they are as different as a wrench and a socket.

  Exploitation, Ray says, is the cold hard math. It's the fact that you build a car that sells for thirty thousand dollars, and you get paid a fraction of that in wages, and the rest goes to someone who never touched a wrench. That's the theft. That's the math.

  Alienation is the sadder thing. That's the part where you spend thirty years tightening the same bolt on the same chassis, and you stop seeing the car. You stop seeing the road it'll drive on. You stop seeing yourself as a creator, and you start seeing yourself as just another part of the machine. It's not about the money; it's about the soul. It's about not recognizing yourself in what you make, or in who the job has turned you into.

  I tell you this not to give a lecture—Ray would kill me if I turned a retirement dinner into a seminar—but to tell you who Ray is.

  Ray spent thirty-eight years fighting the first one so we wouldn't have to suffer the second one.

  He fought the exploitation at the bargaining table. He was the guy who knew the contract better than the managers. He was the guy who knew exactly how many seconds a task should take and exactly what the overtime rate was supposed to be. He made sure the math was as fair as it could possibly get in a system designed to be unfair.

  But he fought the alienation in the breakroom. He fought it by refusing to become a cog. He kept his mind sharp. He kept his curiosity alive. He treated the guys on the line not as labor units, but as people with stories, with families, with grievances, and with dignity. He reminded us that we were men and women building things, not machines building parts.

  To the grandkids in the room: I know you just see Grandpa Ray. You see the guy who fixes your bikes, who tells long stories, who sneaks you extra cake. You might wonder why an old man cares so much about words or politics.

  It's because he wanted you to own your own time.

  There is a theory that under capitalism, you sell your time to survive. But look at him now. Retirement is the ultimate act of rebellion. Starting tomorrow, Ray's labor belongs to Ray. The surplus value of his day—the gardening, the reading, the time spent with you kids—that profit stays in the family.

  Ray, you spent nearly four decades making sure other people understood their worth. You made sure they got paid what they were owed. You made sure they didn't lose themselves in the grind. You were the Professor of the Floor, teaching us that dignity isn't given by a boss; it's taken by a worker who knows his own value.

  I promise not to mix up the terms again. I know that exploitation is what they did to your wages, and alienation is what they tried to do to your spirit. And I know that you beat them both. You kept your wages fair, and you kept your spirit entirely your own.

  So, if everyone could raise a glass.

  To the Professor. May your retirement be free of shifts, free of quotas, and free of theoretical errors. May you finally recognize yourself in what you make, because now, you get to make whatever you want.

  To Ray.
