answer: |-
  **Setting:** *The kitchen, 11:30 PM. The family dinner is over. The dishes are mostly stacked. SARAH (38, child psychologist) is drying a plate. ALEX (36, philosophy PhD candidate) is leaning against the counter, holding a glass of wine.*

  **Sarah:** You know, when I said your cousin's diagnosis was "real," I didn't mean I think she's faking it. I meant the neural pathways are there. Whether TikTok found them or an MRI found them, the dopamine regulation issue doesn't care about Ian Hacking.

  **Alex:** But the *experience* of the pathway does. That's the looping effect. It's not that the suffering is fake, Sarah. It's that "ADHD" isn't a kidney stone. A kidney stone doesn't know it's a kidney stone. It doesn't read WebMD and decide to hurt differently. But a person diagnosed at 34, after scrolling through #ADHDWomen for six weeks? They start editing their life narrative to fit the shape of the diagnosis.

  **Sarah:** Editing a narrative isn't the same as creating the pathology. Look at the history. We spent forty years diagnosing only hyperactive white boys because they disrupted class. Girls like your sister, who daydream and forget deadlines? They were invisible. Now we have better criteria. We're catching the same neurological phenotype we missed. That's not a loop; that's correcting a sampling error.

  **Alex:** Is it the same phenotype, though? In 1990, ADHD was "can't sit still." In 2024, thanks partly to how the category has evolved, it's "can't stop doomscrolling" or "paralysis by overwhelm." The diagnostic criteria have expanded, sure, but the *culture* has also taught us what to look for. When your sister watches a video that says "If you do this specific thing with your hair, you have executive dysfunction," she might start monitoring her hair. She becomes the kind of person who watches for that symptom. The classification changes the classified.

  **Sarah:** Okay, but let's follow that thread. If the classification changes the classified, does that make the medication placebo? When she takes methylphenidate and her working memory improves, is that her "performing" better? Or is her prefrontal cortex finally getting enough norepinephrine?

  **Alex:** Don't reduce me to a truther. The meds work on the biology. But *which* biology gets medicated is a social choice. The looping effect isn't just about faking symptoms. It's about how the label creates a new way of being human. Before "ADHD adult" was a viable identity, a woman like your sister was just "flaky" or "anxious." Now, she has a community, a vocabulary, a set of coping mechanisms. That feedback loop changes her brain chemistry over time—neuroplasticity is real. So, ADHD-in-2024 *is* biologically different from ADHD-in-1990 because the people living it are interacting with the concept differently.

  **Sarah:** That's a beautiful semantic dance, Alex, but it risks becoming dangerous. If I tell a parent, "This label is a moving target shaped by culture," they hear, "This might not be real." And then they don't get the IEP, they don't get the accommodations. You're focusing on the metaphysics of the category, but I'm dealing with the material reality of the struggle. Your sister didn't "loop" herself into inability to pay her bills on time. That was happening before the TikTok algorithm knew her name.

  **Alex:** I'm not saying she looped herself into the struggle. I'm saying the *container* we put the struggle in changes the struggle. Think about the explosion in diagnoses. Biology doesn't evolve that fast. Genes don't mutate in a decade. So what changed? The environment changed, and the *definition* changed. If we treat the label as a fixed natural kind, like a gold atom, we ignore how the education system and the attention economy *create* disability. If school was designed for ADHD brains, fewer people would be disabled. By calling it a fixed neurological defect, you locate the problem entirely inside her skull.

  **Sarah:** Locating the problem in the skull is exactly how we destigmatize it! If it's "in her skull," it's not a moral failing. That's the progress we've made. Your view—that the category is fluid—sounds empowering, but it subtly brings the blame back. If the category is shaped by how people relate to it, then isn't she responsible for how she relates to it? If she "performs" the ADHD, can she stop performing it?

  **Alex:** No! That's the strawman. Hacking's point isn't voluntary performance. It's interaction. It's like a mirror. You look in the mirror, you see a frown, you frown more. The mirror didn't make the face, but the reflection changes the expression. Your sister isn't choosing to have executive dysfunction. But by identifying with "ADHD," she might stop fighting her brain and start working with it. That changes the outcome. The "kind" of person she is shifts. So, clinically, you aren't treating the same thing I'm talking about. You're treating a static disorder; I'm describing a dynamic process.

  **Sarah:** But clinically, the static disorder is the only thing I can bill insurance for. And more importantly, it's the only thing that validates her suffering as *hers*, not society's. You say, "If school was designed for ADHD brains..." Great. Let's do that. But until then, she needs to know her brain processes reward differently than mine. That's not a social construct. That's dopamine transporters. If we get too cute with the "looping effect," we undermine the hard science that gets her the meds that let her function in the world *as it is*.

  **Alex:** But if we get too rigid with the "hard science," we ignore that the world *made* this a disorder. Height isn't a disorder until you try to fit everyone through a four-foot door. Is the problem her neurons, or is the problem a capitalist attention economy that makes sustained focus on boring tasks the only metric of success? The looping effect warns us that by naming it "ADHD," we might be letting the school system and the workplace off the hook. We fix the person to fit the machine, rather than asking why the machine requires this specific type of human.

  **Sarah:** I agree the machine is broken. I fight that machine every day in my practice. But I can't fix the machine today. I can help your sister today. And to help her, I have to treat ADHD as a real, stable thing that responds to treatment. If I tell her, "Actually, this diagnosis is a feedback loop between you and TikTok," she might stop taking her meds. She might think she can think her way out of a neurotransmitter deficit.

  **Alex:** And if I tell her, "This diagnosis is a fixed biological destiny," she might ignore the fact that her anxiety about the diagnosis is making her symptoms worse. She might ignore that her phone usage is frying her attention span, regardless of her genetics. The looping effect is a tool for agency, Sarah. It says: You are not just a vessel for a disease. You are a participant in how this condition manifests. That's not undermining treatment; it's deepening it.

  **Sarah:** It's deepening it only if the foundation is solid. You can't build agency on quicksand. You need to know what is immutable. We know ADHD is highly heritable. We know it's present in childhood even if undiagnosed. We know it crosses cultures. That suggests a core reality that exists before the loop starts.

  **Alex:** A core reality, yes. But not a fixed *kind*. Think of it like this: The biology is the hardware. The diagnosis is the operating system. You can't run 2024 software on 1990 hardware, but the software also changes how the hardware heats up, how much power it draws. The "ADHD" your sister has is a collaboration between her dopamine receptors and the internet age. You're treating the receptors. I'm pointing out the internet. Both are true.

  **Sarah:** *Pauses, putting down the towel.* Fine. Both are true. But in this kitchen, right now, with my niece potentially looking for answers... I need to emphasize the hardware. Because if she thinks she can just update the software, she's going to crash. She needs to know she's not broken, but she does need to manage the machine.

  **Alex:** And I need to emphasize the software, because if she thinks the machine is permanently broken, she might not realize she can rewrite the code. She might accept limitations that are actually just cultural expectations.

  **Sarah:** So, you're saying the truth is in the tension?

  **Alex:** I'm saying the truth *is* the tension. Hacking wouldn't say the stone isn't real. He'd say the person holding the stone is part of the geology.

  **Sarah:** *Smiles, picks up the last plate.* Well, the geology of this sink is real, and it's full of grease. You want to help me loop this sponge into a cleaner state?

  **Alex:** *Laughs.* Only if we acknowledge the sponge is a social construct.

  **Sarah:** Get over here, Alex.
