  1.  **Analyze the Request:**
      *   **Topic:** The nature of ADHD diagnoses (Social Constructionism/Looping Effects vs. Realism/Essentialism).
      *   **Characters:**
          *   *Pro-Hacking (Constructionist/Interactionist):* Believes labels shape the people labeled, creating a feedback loop. ADHD-2024 is different from ADHD-1990 due to cultural/algorithmic influence.
          *   *Pro-Cousin (Realist/Medical Model):* Believes ADHD is a fixed neurological condition. Better diagnosis = finding what was always there, like food allergies.
      *   **Constraint:** Neither side can be a strawman. They must attack each other's *best* points. No easy folding.
      *   **Context:** Inspired by the user's sister's late diagnosis via TikTok and the cousin's skepticism.
      *   **Tone:** Intellectual but accessible, spirited but respectful (a "dinner table" debate elevated).

  2.  **Deconstruct the Arguments:**

      *   **The Hacking Side (Interactionist):**
          *   *Core Concept:* "Looping Effects of Human Kinds." Human kinds interact with their classification.
          *   *ADHD Specifics:* TikTok algorithms curate symptoms. Self-diagnosis leads to behavioral changes. The *experience* of having ADHD changes when the *concept* of ADHD changes (e.g., from "hyperactive boy" to "inattentive woman").
          *   *Counter to Realism:* If the criteria change and the population changes, how can it be the *same* fixed entity? Why the explosion in rates if biology doesn't change that fast?

      *   **The Cousin Side (Realist/Medical):**
          *   *Core Concept:* Neurobiological reality exists independent of observation.
          *   *ADHD Specifics:* Executive dysfunction, dopamine regulation issues are measurable (even if imperfectly). Late diagnosis in women is due to historical bias, not new biology.
          *   *Counter to Constructionism:* Dismissing the biological reality harms access to treatment (meds, accommodations). Suffering is real regardless of the label. Comparing it to "performing" minimizes the struggle.

  3.  **Drafting - Scene Setting:**
      *   Let's place them in a neutral setting. A quiet corner of a noisy party or a late-night kitchen cleanup. Let's go with the kitchen cleanup after the family dinner where this came up. It adds intimacy and fatigue.
      *   *Names:* Let's call the Hacking proponent "Alex" and the Cousin (Psychologist) "Sarah."

  4.  **Drafting - The Exchange (Iterative Process):**

      *   *Opening:* Sarah washing dishes (grounded, practical). Alex leaning against the counter (theoretical).
      *   *Round 1: The Nature of the Thing.*
          *   Sarah: It's neurons. It's real.
          *   Alex: It's neurons *plus* the story we tell about the neurons.
          *   *Refinement:* Make sure Alex brings in Hacking explicitly but naturally. Make sure Sarah emphasizes the *harm* of denying reality.

      *   *Round 2: The TikTok Factor.*
          *   Alex: The algorithm teaches people how to be ADHD.
          *   Sarah: The algorithm teaches people *they have* ADHD. There's a difference.
          *   *Key Conflict:* Is the behavior changing, or just the recognition?
          *   *Alex's Best Point:* The criteria for ADHD have shifted from "running around" to "doomscrolling." That changes the phenotype.
          *   *Sarah's Best Point:* Women were missed before. This isn't new behavior; it's newly visible behavior.

      *   *Round 3: The Consequences (The "So What?").*
          *   Sarah: If you say it's a loop, you undermine medication.
          *   Alex: If you say it's fixed, you ignore how society disables people.
          *   *Refinement:* Alex needs to clarify they aren't saying it's *fake*. Sarah needs to clarify she isn't saying culture doesn't matter, just that the *core* is biological.

      *   *Round 4: The Looping Effect Specifics.*
          *   Alex: Once you know the label, you change your narrative. "I'm not lazy, I'm ADHD." That changes your brain's pathway via stress reduction.
          *   Sarah: That's called treatment efficacy. That doesn't prove the category is fluid.

      *   *Closing:* No total resolution (that's unrealistic), but mutual respect. Acknowledging the tension is productive.

  5.  **Refining the Voices:**
      *   *Alex:* Uses terms like "interactive kinds," "feedback loop," "cultural scaffolding." Needs to sound philosophical but not condescending.
      *   *Sarah:* Uses terms like "neurobiology," "diagnostic criteria," "clinical utility," "material reality." Needs to sound empathetic but firm on science.

  6.  **Self-Correction during Drafting (Check against constraints):**
      *   *Check:* Did Alex make Sarah sound like a brute reductionist? *Fix:* Give Sarah nuance about historical underdiagnosis in women.
      *   *Check:* Did Sarah make Alex sound like a "truther" denying science? *Fix:* Clarify Alex believes the suffering is real, just the *category* is dynamic.
      *   *Check:* Is ADHD specific? *Fix:* Ensure they talk about dopamine, executive function, TikTok symptoms, vs. hyperactive boys of the 90s.

  7.  **Final Polish:** Check pacing. Ensure the "looping effect" is explained clearly within the dialogue. (The prompt asks for a dialogue where they go after each other's best points).

