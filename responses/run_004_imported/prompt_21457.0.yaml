answer: |-
  This is a sophisticated pivot for a dissertation chapter. To assess how F. H. Bradley would judge the act-based theories of Scott Soames and Peter Hanks, we must resist the temptation to treat Bradley merely as a monist who denies plurality. Instead, we must engage with the specific logical machinery of the regress argument as presented in Chapter III of *Appearance and Reality* (1893/1930).

  Bradley's regress is not merely a problem about "glue" in the external world; it is a proof of the unintelligibility of *relation* as a category of thought. Consequently, Bradley would almost certainly argue that act-based theories do not dissolve the regress but merely internalize it. He would contend that relocating the unifying work from a worldly complex to a mental act fails because the act of predication itself possesses the same relational structure that generates the contradiction.

  Here is a reconstruction of how Bradley would likely assess this proposal, grounded in the structure of his argument.

  ### 1. The Structure of Bradley's Regress
  To understand Bradley's critique, we must first be precise about what the regress proves. In Chapter III ("Relation"), Bradley argues that a relation ($R$) between terms ($A$ and $B$) is unintelligible on any hypothesis.
  *   **Hypothesis 1:** $R$ is distinct from $A$ and $B$. If $R$ is a distinct entity, how does it attach to $A$? We require a new relation ($R_1$) to tie $A$ to $R$, and another ($R_2$) to tie $R$ to $B$. This launches the infinite regress.
  *   **Hypothesis 2:** $R$ is not distinct from $A$ and $B$ (i.e., it is internal or identical to them). If $R$ is just an adjective of $A$, it cannot relate $A$ to anything outside itself. Relation collapses into quality, and plurality is lost.

  Bradley's conclusion is not that we need a better relation, but that **relation is contradictory**. It demands that terms be distinct (to be related) and yet not distinct (to be connected). For Bradley, this contradiction applies to *any* complex unity, whether physical, logical, or mental.

  ### 2. The Act-Based Proposal as a Relational Complex
  Soames and Hanks propose that a proposition is a type of cognitive act (e.g., the act of predicating $F$ of $a$). They claim the unity is secured by the performance of the act, avoiding the need for a "propositional glue" among worldly constituents.

  Bradley would analyze the "act of predication" using the same mereological scrutiny he applies to physical complexes. He would ask: **What are the constituents of this act?**
  Even on an act-based view, the act is not a bare point. It involves:
  1.  The Agent (the thinker).
  2.  The Mode (the predicative force/assertion).
  3.  The Content (the concepts $a$ and $F$).

  Bradley would argue that the act-based theorist faces the exact same dilemma as the realist about propositions:
  *   **If the predicative force is distinct from the content:** How does the force bind the concepts $a$ and $F$? If the "act" is a container, what holds the content inside it? We now require a relation between the *acting* and the *content*. The regress resurfaces inside the mind.
  *   **If the predicative force is not distinct from the content:** Then the act is not a unification of distinct elements; it is a simple, unanalyzable feeling. But if it is unanalyzable, it cannot function as a proposition (which must have structure to be true or false). A bare mental pulse cannot predicate $F$ of $a$; it can only *be*.

  For Bradley, calling the act "primitive" does not exempt it from logical analysis. If the act is to serve as a truth-bearer, it must have articulation (subject/predicate or object/property). Wherever there is articulation, there is relation. Wherever there is relation, there is contradiction.

  ### 3. The Privilege of the Mental
  A crucial pivot in the act-based strategy is the shift from ontology to psychology. Soames and Hanks implicitly assume that while *worldly* relations might be suspect, *mental* acts are self-intimating and unified in a way that avoids the regress.

  Bradley explicitly rejects this privilege in *Appearance and Reality*. For Bradley, psychology is part of Appearance, not Reality. Mental facts are just as susceptible to the relational contradiction as physical facts.
  *   In Chapter IV ("Illusion"), Bradley argues that mental states (feelings, thoughts) are themselves complexes of content and existence.
  *   To think of $a$ is to relate an ideal content to a psychic existence.
  *   Therefore, the "act of predication" is itself a relation between a mental event and an ideal content.

  Bradley would argue that the act-based theorist is committing a category error by assuming that because an act is *experienced* as unified, it is *intelligibly* unified. The feeling of unity is psychological; the logical justification of that unity is what the regress attacks. As Bradley writes, "That the relation, in the end, is found to be unintelligible does not mean that we are to abandon it." We use it in appearance, but we cannot claim it is ultimately real. By grounding propositions in mental acts, Soames and Hanks are grounding them in Appearance, thereby conceding Bradley's point that propositions are not ultimately real.

  ### 4. Predication as the Source of the Trouble
  Perhaps the most damning Bradleyan critique concerns the nature of predication itself. Act-based theorists treat predication as the *solution* to unity. Bradley treats predication as the *source* of the problem.

  In Chapter IV and V, Bradley analyzes judgment. He argues that all judgment attempts to predicate ideal content of Reality. This is inherently relational.
  *   To predicate $F$ of $a$ is to assert that $a$ and $F$ are united.
  *   But if $a$ and $F$ are distinct terms, we return to the regress of Chapter III.
  *   If they are not distinct, we have not predicated anything.

  Bradley would argue that Soames and Hanks are trying to use the disease as the cure. They claim the act of predication unifies the proposition. Bradley replies that the act of predication *presupposes* the unity it claims to create. To perform the act, one must already be able to hold $a$ and $F$ together in a way that allows for predication. If the regress shows that holding terms together is unintelligible, then the act of holding them together is equally unintelligible.

  ### 5. The Verdict: Appearance vs. Reality
  Bradley would likely conclude that act-based theories are a valuable account of **Appearance**, but a failure as an account of **Reality**.

  *   **Concession:** He would grant that act-based theories accurately describe how we *navigate* the world. We do indeed unify content through cognitive acts. This is the level of "Appearance," where relations and propositions function practically.
  *   **Rejection:** He would deny that this escapes the metaphysical problem. The regress demonstrates that discursive thought (thought that proceeds via subjects, predicates, and relations) is inherently contradictory. By making propositions into acts of discursive thought, Soames and Hanks have not escaped the contradiction; they have merely located it within the thinking subject.

  For Bradley, the only way to truly "dissolve" the regress is to abandon the subject-predicate structure entirely in favor of the **Absolute**—a non-relational, immediate experience where distinctions between act, agent, and content are transcended. Since act-based theories retain the subject-predicate structure (the thinker predicating content), they remain within the realm of Appearance.

  ### Summary for Your Chapter
  In your assessment, you can frame Bradley's objection as follows:

  1.  **Isomorphism of Structure:** The act of predication structurally mirrors the relational complex ($Agent - Act - Content$). Therefore, the regress applies to the act just as it applies to the worldly fact.
  2.  **No Mental Exemption:** Bradley's metaphysics does not grant the mind ontological immunity. Mental relations are as contradictory as physical ones.
  3.  **Predication is the Problem:** Act-based theories treat predication as a primitive unifier. Bradley treats predication as the primary instance of the relational contradiction.
  4.  **Appearance vs. Reality:** The act-based theory succeeds only if it aims to describe the phenomenology of judgment (Appearance). It fails if it claims to provide a metaphysically robust truth-bearer (Reality).

  Bradley would ultimately say: *"You have not stopped the regress; you have merely hidden it inside the thinker. But the thinker is also an appearance, and the regress awaits him there too."*
