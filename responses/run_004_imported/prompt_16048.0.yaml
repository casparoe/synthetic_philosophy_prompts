      *   **Chomsky (Mentalism/Universal Grammar):** Language is a window into the mind. There are innate structures. A linguist isn't just a behaviorist cataloguer; they hypothesize about internal cognitive states. The "fact of the matter" exists in the speaker's brain/mental representation, even if behavior doesn't distinguish it.

