      *   *Revised plan for Sensorium:* Clarke argues Space is the *consequence* of God's existence. Leibniz argues this makes Space a rival eternal substance.
      *   *Revised plan for Providence:* Clarke argues that without intervention, nature is fate. Leibniz argues that true freedom is acting according to perfect reason, not arbitrary will.

  10. **Final Review against constraints:**
