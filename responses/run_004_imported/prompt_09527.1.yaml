          2.  *Divine Providence vs. Pre-established Harmony:* Is God a watchmaker who needs to fix His clock (Newton/Clarke) or one who makes a perfect clock needing no adjustment (Leibniz)? Does Leibniz's view reduce God to a distant architect and the world to blind necessity (Spinozism)?
      *   **Tone/Style:** Short dialogue, opening *in media res*, sharp and evenly matched, real engagement (not monologues), avoiding simplistic "religious vs. scientific" tropes (noting the irony that Clarke is the "interventionist" theologian here).
      *   **Specific Instructions:** Clarke must defend the *sensorium* point (not just retreat); Leibniz must defend *pre-established harmony* against the charge of removing divine freedom/providence.

  2.  **Historical & Philosophical Grounding:**
