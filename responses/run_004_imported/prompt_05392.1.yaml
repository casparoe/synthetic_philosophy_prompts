answer: |-
  A Universalist, a Nihilist, and Peter van Inwagen walk into a deli.

  The waiter asks, "What can I get you?"

  The Nihilist says, "I'll have some simples arranged sandwich-wise. But don't cut it in half, or you'll destroy the arrangement. Actually, don't bring it at all, because sandwiches don't exist."

  The Universalist says, "I'll have that sandwich, plus the plate, plus the table, plus that Trout-Turkey in the display case."

  The waiter says, "The what?"

  The Universalist says, "You have trout, you have turkey. Composition is unrestricted. Fuse them. I want the Trout-Turkey."

  Van Inwagen sighs and says, "Don't listen to him. Is the Trout-Turkey alive? Does the activity of its parts constitute a single life?"

  The waiter says, "It's on ice."

  Van Inwagen says, "Then it's a heap. It doesn't exist. I'll just have the lobster; it's still moving. Actually, never mind. Just bring me the simples arranged water-wise."

  The waiter drops off the food and says, "Who's paying the bill?"

  The Nihilist says, "No one. We don't exist."

  The Universalist says, "Everyone. We are all part of the fusion that ordered the meal."

  Van Inwagen pulls out his wallet and says, "I'll pay. I'm an organism. But I'm not paying for the Trout-Turkey. Because there is no Trout-Turkey."
