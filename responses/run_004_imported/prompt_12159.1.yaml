  *(Refining the Verdict)*: The TA is taking an externalist/sociological view (it functions the same in society). The User is taking an internalist/conceptual view (the logic is different). In an HPS seminar, the internalist view is usually the learning objective. I will side with the User but acknowledge the TA's sociological validity.

  9.  **Final Plan:**
