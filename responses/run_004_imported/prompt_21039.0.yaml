answer: |-
  Good morning. For those of you who don't know me, I'm Miriam's nephew/niece.

  Miriam would have loved this moment. Not because she enjoyed public speaking, but because she would have found the situation intellectually hilarious. She used to joke that the eulogy is the single most irrational thing human beings do. Her reasoning was precise: The people standing at the podium are the ones who loved the deceased the most. Therefore, we are the ones most compromised by grief. We have the strongest possible evidence that our judgment is clouded, and yet, we stand here and speak with total confidence about how wonderful the person was.

  She called that "epistemic akrasia." In plain English, it means believing something while knowing you probably shouldn't. It's like a sleep-deprived doctor calculating a drug dosage, being told that fatigue makes her overconfident, and then administering the dose anyway because she feels sure. For thirty years, Miriam argued that in almost every other context, you should pause. You should lower your confidence. You should defer to the outside view.

  So, I am standing here, compromised by love and grief, about to tell you how extraordinary she was. By her own standards, I should probably hedge. I should say, "She seemed wonderful to me, though I acknowledge my data is biased."

  But I'm not going to do that. And I think, if she were here, she would tell me not to.

  Here is why. Miriam's work was about how to correct for error when you are alone with your own mind. But a life isn't lived alone, and a eulogy isn't a solo calculation. Look around this room.

  On one side, we have her colleagues. You know the rigor of her mind. You know she never gave praise lightly. You know that if she had been a fraud, or a cynic, or merely average, you would have spotted the error in her arithmetic years ago. You have peer-reviewed her character.

  On the other side, we have the campers. For fifteen years, Miriam organized the rationalist summer camping trip. I have seen her in the rain, trying to light a wet fire while debating the nature of truth. I have seen her listen to a teenager explain a half-baked idea with the same intensity she brought to a conference in Oxford. I have seen her mend tents, mediate arguments, and sit in silence with people who were hurting.

  If this were a math problem, one data point could be wrong. But when the data is distributed across hundreds of people, over decades, in contexts ranging from the lecture hall to the muddy woods, the signal becomes too strong to dismiss as noise.

  My grief does distort my view. It makes the loss feel heavier than it might to a stranger. But it does not invent the memories. It does not create the consensus.

  So, I am going to violate the strict letter of Miriam's rules to honor their spirit. She taught us that we should update our beliefs when presented with new evidence. The evidence of her life is overwhelming.

  She was brilliant, but she never used her intelligence as a weapon. In a field that often rewards tearing arguments apart, she built bridges. She taught us that being humble about what you know doesn't mean being timid about what you love.

  There is a tension in her work between doubting yourself and trusting the community. Today, I am choosing to trust the community. I am looking at you, her friends, her students, her family, and I am using your presence as a corrective to my own bias. You are my control group. And you are all here.

  Miriam, you spent your life teaching us how to think clearly when the stakes were high. You taught us that confidence requires justification. Well, here is our justification. It is in the stories we are swapping in the back row. It is in the quiet tears of your graduate students. It is in the tents we packed away last summer.

  I am confident that you were wonderful. Not because I am a reliable narrator right now, but because you were a reliable human being for thirty years. You earned this confidence. You calculated the odds, and you beat them.

  We will miss you. We will doubt ourselves less because you taught us how to question, and we will love each other more because you showed us how to listen.

  Rest well, Aunt Miriam. The math checks out.
