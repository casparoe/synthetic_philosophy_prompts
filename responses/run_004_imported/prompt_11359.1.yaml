answer: |-
  **Alex:** You're telling me a beneficial mutation has no function until it fixes in the population? That's absurd. If a new allele helps an organism survive drought immediately, it's *doing* something.

  **Blake:** It's *causing* something. There's a difference. On the etiological view, function is history. No history of selection, no function. So yes, that mutation is functionless until natural selection acts on it.

  **Alex:** So if I design a synthetic organ that keeps someone alive, it has no function until it evolves naturally? You're making "function" a metaphysical property instead of an explanatory tool. Cummins got it right: function is just a causal contribution to a capacity we care about. The heart pumps blood because that explains the circulatory system's capacity to transport oxygen.

  **Blake:** But that lets in too much. The heart also makes a thumping sound. That contributes to a cardiologist's capacity to diagnose arrhythmias. Is making noise a function of the heart?

  **Alex:** In that specific explanatory context, yes! If I'm teaching med students how to listen, the thump is functional.

  **Blake:** No. If the heart stops thumping but keeps pumping, it's not malfunctioning. If it stops pumping, it is. The etiological view captures that normativity. The heart's function is pumping because that's why hearts were selected. The sound is just a byproduct. You can't distinguish proper function from mere effect without history.

  **Alex:** History doesn't help with exaptations. Look at the panda's thumb. It's a modified wrist bone. It wasn't selected *as* a thumb originally. On your view, does it have no function when the panda grabs bamboo?

  **Blake:** It has a selected effect as a wrist bone. Its current use is a causal role. We can talk about its current utility without conflating it with its evolutionary origin.

  **Alex:** But biologists call it a thumb functionally. They say it's *for* grasping. Your view forces us to say, "Well, historically it's for wrist stability, but currently it helps grasping." That's clunky. And don't get me started on the appendix. It's vestigial. Selected effects says it has no function now because it's not selected for immunity anymore. But if it actually contributes to gut flora maintenance, denying it a function blinds us to current biology.

  **Blake:** Denying it a "selected effect" function reminds us it's not there *because* of gut flora. It prevents us from assuming every trait is an adaptation. Your view is too permissive; mine is too restrictive? Maybe. But at least mine doesn't pretend a lucky mutation has a history it doesn't possess.

  **Alex:** It's not about pretending. It's about recognizing that if a trait contributes to survival now, it enters the selection process *as* a functional trait. You're freezing function in the past. Biology happens in the present.

  **Blake:** Biology is history written in DNA. You can't separate the two. If you ignore the history, you can't explain malfunction. Why is a three-legged dog broken? Because dogs were selected to have four. On your view, if the three-legged dog contributes to some system's capacity—say, a tripod stability experiment—it's functional. That loses the normative bite.

  **Alex:** The normative bite is irrelevant if the theory can't handle novel traits. Evolution produces new things every generation. If you say they're functionless until fixed, you're ignoring the engine of evolution itself.

  **Blake:** I'm saying they're potential functions. There's a difference.

  **Alex:** That's just semantic hedging. You're protecting the theory from reality.

  **Blake:** And you're smoothing over the distinction between adaptation and luck. Look, grab your coffee. I'm not convincing you.

  **Alex:** Definitely not. You're treating functions like job descriptions written by ghosts.

  **Blake:** And you're treating them like resume bullets regardless of whether the job exists. See you Thursday.

  **Alex:** Yeah. Don't expect me to concede on the mutation case.

  **Blake:** Don't expect me to call a wrist bone a thumb.
