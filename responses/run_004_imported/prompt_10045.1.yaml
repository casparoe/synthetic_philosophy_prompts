answer: |-
  This is a fantastic catch. You have stumbled onto one of the deepest tensions in early modern metaphysics, and your intuition about reference equality vs. structural equality is surprisingly robust. In fact, if you told a Leibniz scholar you were thinking about Lumpl and Goliath as "two references pointing to the same memory address but with different type constraints," they would probably buy you a drink.

  You are also correct that Leibniz would refuse to play the modern game of "One Object or Two?" in the way contemporary metaphysicians do. To understand why, we have to look at his distinction between *unum per se* (unity in itself) and *unum per accidens* (unity by accident), and how that maps onto his ontology of substances vs. phenomena.

  Here is how Leibniz would dismantle the Lumpl/Goliath puzzle, grounded in his actual texts (specifically the *Letter to Arnauld* and the *Monadology*), followed by the modern comparison you asked for.

  ### 1. The Status of the Contestants: Neither is a "Real" Object
  In modern debates (like Gibbard's), the assumption is usually that both Lumpl and Goliath are candidates for "objecthood." The debate is about whether they are *identical* objects or *coincident* objects.

  Leibniz would reject the premise that either is a true object (substance) to begin with.

  For Leibniz, true unity (*unum per se*) belongs only to **Monads** (simple substances) and, in a derivative but natural sense, to **Living Organisms**. A living organism has a "dominant monad" (a soul or entelechy) that binds the infinite collection of subordinate monads (its body) into a genuine unity. As he writes in the *Monadology*, natural machines (organisms) are "divine machines" that remain machines down to infinity; every part of a leaf is full of organisms.

  A statue (Goliath) and a lump of clay (Lumpl) are **artifacts**. They are *aggregates*.
  *   **Aggregates** derive their unity *per accidens* (by accident). They are "one" only because a mind perceives them as one.
  *   An army is an aggregate. A pile of stones is an aggregate. A statue is an aggregate.

  So, if you hand Leibniz the Lumpl/Goliath case, his first move is to say: **"Strictly speaking, neither exists as a substance."** There is only a collection of monads arranged clay-wise/statue-wise.

  ### 2. Dissolving the Coincidence Problem
  The modern puzzle relies on Leibniz's Law (Indiscernibility of Identicals): If $x = y$, they share all properties. Lumpl can survive flattening; Goliath cannot. Therefore, Lumpl $\neq$ Goliath. Therefore, two objects occupy the same space.

  Leibniz would say this law applies strictly only to **substances** (monads). Since neither Lumpl nor Goliath is a substance, strict identity doesn't apply in the same way.

  Instead, he would treat them as **Well-Founded Phenomena**.
  *   **The Reality:** The underlying reality is the set of monads. Let's call this set $M$.
  *   **The Phenomenon:** "Goliath" is the phenomenon resulting from perceiving $M$ under the description "statue." "Lumpl" is the phenomenon resulting from perceiving $M$ under the description "clay."

  Are they two things? No. They are the same phenomenon considered under two different **conceptual descriptions**.
  *   The concept "Statue" contains the predicate "maintains form."
  *   The concept "Clay" contains the predicate "retains matter."

  When you squash it, the monads $M$ continue to exist (monads cannot be destroyed). However, the *phenomenon* "Goliath" ceases to be instantiated because the monads no longer satisfy the conceptual requirements of "statue." The phenomenon "Lumpl" continues because the monads still satisfy "clay."

  Leibniz avoids the "two things in one place" problem because there are not two *substances* there. There is one set of monads grounding two different *ways of counting*. The distinction is not in the world (the monads), but in the mind of the perceiver grouping those monads.

  ### 3. The "Well-Founded" Bonus
  You asked: *If neither is a true substance, how are they "well-founded" and not just fictions?*

  This is the crux of Leibniz's "Phenomenalism." He is not an idealist in the Berkeleyan sense (that objects are just ideas in God's mind and have no external ground). He is a **realist about phenomena**.

  A rainbow is Leibniz's favorite example.
  *   Is a rainbow a "thing"? No. You can't cut a piece of rainbow out and put it in a box. It has no *per se* unity.
  *   Is a rainbow an illusion? No. It is **well-founded**. It is grounded in real things (water droplets, light, eyes/monads perceiving) interacting according to fixed laws.

  Lumpl and Goliath are like the rainbow.
  1.  **Foundation:** They are founded in the real, existing monads ($M$).
  2.  **Harmony:** All perceivers agree on the phenomenon because of the **Pre-established Harmony**. Every monad reflects the entire universe from its own perspective. So, every monad in the vicinity "agrees" that there is a statue there.
  3.  **Truth:** Propositions about the statue are true not because the statue is a substance, but because the predicates correspond to the state of the underlying monads.

  So, to answer your specific question: They are founded in the **harmonious perceptions of the constituent monads**. The "clay" is real because the monads are real. The "unity" of the clay is mental, but the *basis* for that unity is objective.

  ### 4. Modern Parallels (and where they break)

  If we try to map Leibniz onto the modern landscape of material constitution, he is a hybrid of two positions that usually don't hang out together.

  **The Resemblance: Ontological Nihilism / Organicism (Peter van Inwagen)**
  Leibniz is the grandfather of the view that **composite objects generally don't exist.**
  *   **Van Inwagen's View:** The only composite objects that exist are living organisms. Tables, statues, and lumps do not exist; there are only "atoms arranged table-wise."
  *   **Leibniz's View:** The only true unities are monads and organisms. Statues and lumps are aggregates.
  *   **The Match:** Both deny that artifacts have fundamental ontological status. Both solve the Lumpl/Goliath problem by saying, "Don't worry about the identity of the statue, it's not a real thing in the fundamental sense."

  **The Resemblance: Artifact Conceptualism (Amie Thomasson)**
  *   **Thomasson's View:** Artifacts exist, but their existence conditions depend on human concepts and intentions.
  *   **Leibniz's View:** Aggregates have unity only through the perception of a mind.
  *   **The Match:** Both make the "objecthood" of the statue mind-dependent.

  **Where the Resemblance Breaks Down:**
  1.  **The Grounding:** Modern Nihilists (like Van Inwagen or Merricks) often say statues *simply do not exist*. Leibniz says they **exist as phenomena**. This is a crucial distinction. For a modern eliminativist, "Statues exist" is false. For Leibniz, "Statues exist" is true, but it translates to "There is a well-founded phenomenon of statue-perception grounded in monads." He saves the phenomena; they don't eliminate them.
  2.  **The Metaphysical Floor:** Modern conceptualists usually stop at the physical level (atoms/molecules). Leibniz goes deeper. The "well-foundedness" isn't just atoms; it's *metaphysical points of force* (monads).
  3.  **Identity:** Modern relative identity theorists (like Geach) might say "x is the same lump as y, but not the same statue as y." Leibniz would agree practically, but he would ground this in the **Complete Concept**. For Leibniz, the concept of *this* lump includes its entire history. If the lump survives squashing, it is technically a different "state" of the aggregate, but the underlying monads are the same. He wouldn't accept "relative identity" as a logical primitive; he'd say identity is absolute for monads, and derivative/conventional for aggregates.

  ### 5. The Programmer Translation
  Since you mentioned the reference/structural equality bit, here is how Leibniz compiles in code:

  *   **The Monads:** The actual bits in RAM. They are the only things that truly "exist" as independent memory units.
  *   **The Organism:** A running process with a PID (Process ID). It has a true unity because the OS (God/Nature) treats it as a single scheduling unit. It handles its own memory management (dominant monad).
  *   **Lumpl/Goliath:** Two different **Views** or **Interfaces** pointing to the same underlying memory buffer.
      *   `Lumpl` is a `byte[]` view.
      *   `Goliath` is a `StructuredBuffer<Statue>` view.
  *   **The Crash:** When you squash the statue, you aren't changing the memory address (the monads). You are invalidating the `Goliath` view's vtable (it no longer satisfies the `IStatue` interface). The `Lumpl` view remains valid.
  *   **The Error:** The modern metaphysician is throwing a `ReferenceEqualityException` because they think `Goliath` and `Lumpl` must be distinct Objects on the heap.
  *   **Leibniz's Fix:** "Stop treating Views as Objects. They are well-founded projections of the underlying memory. There is only one allocation. The distinction is in the type system (the mind), not the heap (the monads)."

  ### Summary
  Leibniz would tell you that you are suffering from a category error. You are asking a question about **substantial identity** (Leibniz's Law) regarding entities that are merely **phenomenal aggregates**.

  *   **Does he commit to two things?** No.
  *   **Does he commit to one thing?** No, not a "real" one.
  *   **Does he commit to neither?** Yes, as substances. But yes to both as well-founded phenomena.

  He dissolves the puzzle by lowering the ontological status of the contestants. The "annoying" part you sensed is that modern metaphysics tries to solve this while keeping statues as "real objects." Leibniz bites the bullet: statues aren't real unities, they are useful fictions grounded in real simple substances. It's the ultimate garbage collection: if it doesn't have a dominant monad, it's not a true object, it's just memory management.
