      *   **Acknowledge the pedagogical challenge:** It's a classic trap. The "is" is the pivot.
      *   **Dissect the "Seeking" Argument:** Formalize it using satisfaction conditions.
          *   Let $S(x, y)$ = $x$ satisfies request $y$.
          *   $\exists h (Yellow(h) \land S(h, \text{'horse'}))$
          *   $\neg \exists h (Yellow(h) \land S(h, \text{'white horse'}))$
          *   Therefore, Request('horse') $\neq$ Request('white horse').
          *   Therefore, Concept('horse') $\neq$ Concept('white horse').
      *   **Connect to "Is":** Gongsun Long equates "Concept A $\neq$ Concept B" with "A is not B." This is the equivocation (or rather, the philosophical stance on *ming*).
      *   **Evaluate Hansen:** Hansen is right that the grammar facilitates this (no plural/count markers), but the argument itself relies on *differentiation of criteria*, not just mereology. The "seeking" passage is about *use conditions*, which aligns with intensionality.
      *   **Evaluate the Linguist:** Scope ambiguity is close, but it's really about *opacity*. "Seeking" creates an opaque context.
      *   **Frege/Quine Connection:**
          *   Frege: Sense (*Sinn*) vs. Reference (*Bedeutung*). "Horse" and "White Horse" have different senses. Gongsun Long treats different senses as different references (or denies the object level).
          *   Quine: "White horse is not a horse" looks like $\neg \exists x (Wx \land Hx)$. Quine would say this is a failure of canonical notation. Gongsun Long is resisting canonical notation.
      *   **Teaching Strategy:** Don't solve it. Show the tension. The text forces a choice between ontology (what exists) and semantics (how we name).

  7.  **Refining the Logic (Self-Correction during drafting):**
      *   Wait, is it Leibniz's Law? Yes. If $A = B$, then for any property $P$, $P(A) \iff P(B)$.
      *   Property $P$: "Can be satisfied by a yellow horse."
