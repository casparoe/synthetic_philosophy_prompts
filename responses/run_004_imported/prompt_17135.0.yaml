answer: |-
  This is a fantastic syllabus, and you have pinpointed exactly where the *White Horse Dialogue* (Bai Ma Lun) does its heaviest lifting. The "seeking a horse" (求馬) passage is indeed the crux because it moves from the abstract metaphysics of the first argument (Shape vs. Color) to a pragmatic test of reference and satisfaction.

  You are right to be suspicious of the "scope ambiguity" dismissal; it's too syntactic for a text that is fundamentally ontological and semantic. You are also right that Hansen's mass-noun hypothesis and the standard "class/identity" reading are often presented as rivals, but in the context of this specific argument, they function more as **competing ontological explanations for the same semantic intuition.**

  Here is a breakdown of the logical anatomy of the "seeking" passage, how the interpretations relate, and how to frame this for your Frege/Quine unit.

  ### 1. The Logical Anatomy of the "Seeking" Argument

  The "seeking" passage is an argument from **Leibniz's Law (the Indiscernibility of Identicals)** applied to **intensional contexts**.

  Let's formalize the move Gongsun Long makes. He is not talking about physical objects in the world (extension); he is talking about the *conditions of satisfaction* for a request (intension).

  1.  **Premise 1:** The request "Bring a horse" ($R_H$) is satisfied by a yellow horse ($y$).
      *   $Satisfy(y, R_H)$
  2.  **Premise 2:** The request "Bring a white horse" ($R_{WH}$) is *not* satisfied by a yellow horse ($y$).
      *   $\neg Satisfy(y, R_{WH})$
  3.  **Intermediate Conclusion:** $R_H$ and $R_{WH}$ have different satisfaction conditions.
      *   Therefore, $R_H \neq R_{WH}$.
  4.  **Final Conclusion:** "White horse" is not "horse."
      *   $WhiteHorse \neq Horse$.

  **The Logical Pivot:**
  The validity of this argument depends entirely on what the subject terms "White Horse" and "Horse" refer to in the conclusion.
  *   If they refer to **objects** (extension), the conclusion is false (a white horse is a member of the class of horses).
  *   If they refer to **concepts/requests/names** (intension), the conclusion is true (the concept *white horse* is not identical to the concept *horse*).

  Gongsun Long's move is to argue that because the *names* function differently in practice (the "seeking" test), the *referents* of the names must be distinct. He collapses the distinction between the concept and the object. For the School of Names (*Ming Jia*), the *Ming* (name) is the primary ontological unit. If the *Ming* differs, the reality differs.

  ### 2. Identity/Class vs. Mass Noun (Hansen)

  You asked how these two readings relate. They are rivals ontologically, but they both serve to validate Gongsun Long's inference against common sense.

  **The Standard Reading (Class/Identity):**
  *   **Logic:** This reading assumes a standard predicate logic framework where "is" is ambiguous between predication ($\in$) and identity ($=$).
  *   **Diagnosis:** Gongsun Long commits a fallacy of equivocation. He proves $Concept(WhiteHorse) \neq Concept(Horse)$ but concludes $Object(WhiteHorse) \notin Class(Horse)$.
  *   **Weakness:** It makes Gongsun Long look like a sophist playing cheap tricks with the copula. It doesn't explain *why* the argument feels compelling in Classical Chinese.

  **The Hansen Reading (Mass Noun/Mereology):**
  *   **Logic:** Classical Chinese nouns are mass terms (like "water" or "gold"). "Horse" denotes undifferentiated horse-stuff. "White horse" denotes white-horse-stuff.
  *   **The Move:** In mereology, a proper part is not identical to the whole. White-horse-stuff is a *division* of horse-stuff.
  *   **Why it helps the "Seeking" argument:** If "Horse" is a mass term, then "seeking horse" means seeking *any portion* of horse-stuff. "Seeking white horse" means seeking a *specific portion*. Since the portions are not identical, the request is not identical.
  *   **Relation to Standard Reading:** Hansen's view removes the need for a "fallacy." If nouns are mass terms, there is no class-membership relation ($\in$) to begin with. There is only parthood ($\subset$). "White horse is not horse" translates to "White-horse-stuff is not (identical to) horse-stuff." This is trivially true in mereology (the part is not the whole).

  **Verdict for your Seminar:**
  Don't treat them as mutually exclusive in the classroom. Treat Hansen's view as the **grammatical precondition** that makes Gongsun Long's **logical move** plausible.
  *   In Indo-European languages, the count/mass distinction forces us to see "a horse" as an individual unit belonging to a set.
  *   In Classical Chinese (per Hansen), the lack of marking allows "horse" to hover between the abstract kind and the concrete stuff.
  *   The "Seeking" argument exploits this hover. It shows that the *criteria for dividing the stuff* (white vs. yellow) changes the *identity of the stuff requested*.

  ### 3. The Frege and Quine Connection

  This is where your seminar will shine. The *White Horse Dialogue* is essentially a pre-modern investigation into Sense and Reference, and Quantification.

  **Frege (Sense vs. Reference):**
  Gongsun Long is arguably a hyper-Fregean.
  *   **Frege:** "The Morning Star" and "The Evening Star" have the same reference (Venus) but different senses.
  *   **Gongsun Long:** "Horse" and "White Horse" have different senses (Shape vs. Shape+Color).
  *   **The Divergence:** Frege would say they *could* refer to the same object. Gongsun Long argues that because the *Senses* (the *Ming*) are different, the *References* must be treated as non-identical. He prioritizes *Sinn* over *Bedeutung*.
  *   **Teaching Point:** The "Seeking" argument is an argument about **Sense**. It shows that the mode of presentation (the conditions of the request) determines the identity of the object sought.

  **Quine (Quantification and Ontological Commitment):**
  Quine's "On What There Is" and his views on singular terms are perfect here.
  *   **Quine:** "To be is to be the value of a bound variable."
  *   **The Problem:** "A white horse is not a horse."
      *   If we translate as $\forall x (Wx \land Hx \rightarrow \neg Hx)$, it's a contradiction.
      *   If we translate as $\neg \exists x (Wx \land Hx)$, it's empirically false.
  *   **Quinean Diagnosis:** Gongsun Long is resisting "canonical notation." He is refusing to analyze "white horse" as a conjunction of predicates ($Wx \land Hx$). He treats "white horse" as a primitive singular term.
  *   **The "Seeking" Passage:** This is Quine's **Opacity**. "Seeking" creates an opaque context.
      *   John seeks a horse.
      *   A white horse is a horse.
      *   Therefore, John seeks a white horse. (Invalid in opaque contexts).
      *   Gongsun Long intuitively grasps that "seeking" blocks the substitution of co-extensive terms. If "horse" and "white horse" were truly identical, substitution should hold. It doesn't. Therefore, they aren't identical.

  ### 4. Pedagogical Strategy: The "Equivocation" Question

  To answer your core question: *What does "equivocation" mean once you leave Indo-European grammar behind?*

  In the "Seeking" passage, Gongsun Long is not equivocating in the sense of a fallacy; he is **shifting levels of discourse**.

  1.  **Level 1 (Object Language):** Talking about animals. (Here, "White horse is not horse" is false).
  2.  **Level 2 (Meta-Language):** Talking about names/requests. (Here, "White horse is not horse" is true).

  The "Seeking" argument works because "Seeking" is a verb that bridges these levels. It is an action in the world that is governed by linguistic rules.

  **Suggested Synthesis for the Seminar:**
  Argue that the "Seeking" passage demonstrates that **reference is use.**
  *   **Standard View:** Reference is fixed by objects.
  *   **Gongsun Long:** Reference is fixed by the *discriminatory power* of the name.
  *   Because "White Horse" discriminates (excludes yellow) and "Horse" does not, they name different things.
  *   **Hansen's Contribution:** The grammar (mass nouns) makes it easier to treat "discrimination" as "ontological division."
  *   **Frege/Quine Contribution:** They give us the vocabulary to see that Gongsun Long is identifying **Intension** with **Extension**.

  **The "Scope Ambiguity" Colleague:**
  Your linguist colleague is half-right. It *is* a scope issue, but not syntactic scope. It is **semantic scope**. Does the negation apply to the copula (identity) or the predicate (class membership)?
  *   $\neg (WH = H)$ (True, concepts differ)
  *   $WH \neq H$ (False, class inclusion)
  Gongsun Long forces the first reading to prove a point about the second.

  ### Summary for your Lecture Notes

  1.  **The Argument:** It is an *Indiscernibility of Identicals* argument applied to *satisfaction conditions*.
  2.  **The Logic:** $Request(H) \neq Request(WH) \rightarrow Concept(H) \neq Concept(WH) \rightarrow Referent(H) \neq Referent(WH)$.
  3.  **The Grammar:** Hansen's mass-noun theory explains why the slide from Concept to Referent is grammatically seamless in Classical Chinese (no articles/plurals to force a count interpretation).
  4.  **The Western Pairing:**
      *   **Frege:** Gongsun Long conflates Sense and Reference (or makes Sense primary).
      *   **Quine:** Gongsun Long exploits referential opacity in intensional contexts ("seeking").
      *   **Equivocation:** It is not a fallacy of ambiguity, but a deliberate **category shift** from ontology to semantics, argued via pragmatics.

  This framing allows you to honor the sophistication of the text without endorsing the metaphysics, while giving your students a rigorous logical toolkit to dissect it. Good luck with the seminar; it sounds like a brilliant course.
