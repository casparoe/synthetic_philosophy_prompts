      *   **Key Text:** *Bai Ma Lun* (White Horse Dialogue), specifically the "seeking a horse" (求馬) passage.
      *   **Key Interpretations mentioned:** Non-identity (Fregean-ish), Mass Noun/Mereological (Hansen), Scope Ambiguity (Linguist colleague).

  2.  **Deconstruct the "Seeking a Horse" Argument:**
      *   *Premise 1:* Requesting "horse" ($H$) $\rightarrow$ Yellow/Black horse acceptable.
      *   *Premise 2:* Requesting "white horse" ($WH$) $\rightarrow$ Yellow/Black horse *not* acceptable.
      *   *Intermediate Conclusion:* The extension/intension of the request $H$ differs from $WH$.
      *   *Final Conclusion:* White horse is not horse ($WH \neq H$).

  3.  **Evaluate the Interpretations:**

      *   **Interpretation A: Non-Identity (Fregean/Analytic):**
          *   Focus: Intensionality. "Horse" refers to the shape/kind. "White horse" refers to shape + color.
          *   Logic: Leibniz's Law (Indiscernibility of Identicals). If $A = B$, they must share all properties. $H$ accepts yellow; $WH$ does not. Therefore $H \neq WH$.
          *   Issue: In standard predicate logic, "White horse is not a horse" translates to $\neg \forall x (Wx \land Hx \rightarrow Hx)$, which is false. Or $\neg \exists x (Wx \land Hx)$, also false. The conclusion only works if "is" means "is identical to the concept of" or if the copula is ambiguous.
          *   Fit: Matches Gongsun Long's first argument (Name of Shape vs. Name of Color).

      *   **Interpretation B: Mass Noun/Mereological (Chad Hansen):**
          *   Focus: Ontology of Classical Chinese nouns. No count/mass distinction. "Ma" = horse-stuff.
          *   Logic: "White horse" = white-horse-stuff. "Horse" = horse-stuff. White-horse-stuff is a proper part of horse-stuff (or a specific division). A part is not the whole.
          *   Issue: Does "white-horse-stuff" exclude yellow-horse-stuff? Yes. Does "horse-stuff" include yellow-horse-stuff? Yes. So the *extension* differs.
          *   Fit: Explains why "white" makes a difference without needing a Fregean sense/reference distinction. It's about stuff division.
          *   Critique (Graham/others): Classical Chinese *does* seem to allow counting (yi ma = one horse). Hansen might overcorrect.

      *   **Interpretation C: Scope Ambiguity (Linguist Colleague):**
          *   Focus: "A white horse is not a horse."
          *   Logic: $\neg \exists x (WH(x) \land H(x))$ vs. $\forall x (WH(x) \rightarrow \neg H(x))$.
          *   Issue: This usually leads to "No white horse is a horse." Gongsun Long seems to mean "The concept 'white horse' is not the concept 'horse'."
          *   Fit: A bit too modern syntactic. Classical Chinese doesn't mark scope explicitly. But the *effect* is similar to the intensional reading.

  4.  **Synthesize the "Logical Anatomy":**
      *   The core move is **Intensional vs. Extensional Contexts**.
      *   The "Seeking" (求) verb creates an *intensional context*. It's about satisfaction conditions, not just existing objects.
      *   Gongsun Long exploits the difference between *extension* (the set of objects) and *intension* (the concept/requirements).
      *   In the "seeking" passage, he shows that the *conditions of satisfaction* differ.
      *   Therefore, the *names* (ming) differ.
      *   Therefore, the *referents* (as concepts) are not identical.
      *   Crucial Point: Gongsun Long is not making a claim about empirical objects (there is no white horse that isn't a horse). He is making a claim about *ming* (names/concepts).
      *   The "is" in "White horse is not horse" is the "is of identity" (between concepts), not the "is of predication" (class inclusion).

  5.  **Address the Hansen vs. Standard Reading:**
      *   Are they rivals? Yes, ontologically.
      *   Are they compatible logically? Mostly. Both rely on the idea that "White Horse" picks out a narrower range than "Horse."
      *   Hansen's view helps explain *why* the grammar allows this without articles/plurals.
