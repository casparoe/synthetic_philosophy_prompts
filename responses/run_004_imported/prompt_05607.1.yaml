      *   *Is the "biceps" quote accurate?* Lewis wrote: "To say that $N$ necessitates... is not to explain how it does so... It is as if one were to explain the power of a potion by saying that it contains a dormitive virtue." (Actually, that's Molière/Lewis hybrid). The specific "Armstrong/biceps" joke is: "Would you please tell me... what it is about the relation $N$ that makes it a necessitation relation?" Lewis compares it to thinking you get strong muscles by being named Armstrong.
