answer: |-
  This is one of the deepest rabbit holes in contemporary metaphysics, and you have correctly identified the exact pressure point where the non-Humean view tends to buckle. You're asking about the **Inference Problem** (often associated with Bas van Fraassen, though popularized by David Lewis), and it is indeed the strongest weapon in the Humean arsenal against Armstrong-style Dretske-Tooley-Armstrong (DTA) accounts.

  Here is a walkthrough of why the "brute necessity" move fails to save Armstrong, and whether Dispositional Essentialism actually escapes the trap.

  ### 1. Armstrong's Ambition and the Gap
  To see why the Inference Problem bites, we have to look at what Armstrong was trying to buy.

  For a Humean, the universe is just a "mosaic" of particular events (things happening at space-time points). Laws are just a compressed summary of that mosaic.
  For Armstrong, this gets the direction of explanation backward. The regularity (all Fs are Gs) holds *because* there is a Law. The Law makes the regularity happen.

  To cash this out, Armstrong posits **Universals** (F-ness and G-ness) and a relation of **Necessitation** ($N$) between them. So, the Law is $N(F, G)$.
  *   **The Goal:** $N(F, G)$ must *explain* why, at the level of particulars, every time an instance of $F$ shows up, an instance of $G$ follows.
  *   **The Gap:** $N(F, G)$ is a relation between abstract universals. The regularity ($\forall x (Fx \rightarrow Gx)$) is a pattern among concrete particulars.

  **The Inference Problem asks:** How do you get from the relation between the Universals to the regularity among the Particulars?

  ### 2. Why "Brute Necessity" Doesn't Work
  You asked: *"Why can't there just be a brute, sui generis necessary connection... the way certain purely formal or mathematical properties necessitate others?"*

  This is the natural instinct of the non-Humean. But here is why philosophers think this fails to earn Armstrong his wage:

  **A. The Explanatory Idle Wheel**
  If Armstrong says, "It is just a brute fact that $N(F, G)$ entails the regularity," he has effectively admitted that $N$ does no work.
  Imagine you are trying to explain why a train moves.
  *   **Humean:** The cars are just moving; there is no engine.
  *   **Armstrong:** There is an engine ($N$)! It is connected to the cars.
  *   **Critique:** But you haven't shown us a drive shaft. You've just placed an engine on a parallel track and said, "It is a brute fact that when this engine runs, those cars move."

  If the connection between the Law ($N$) and the Regularity (the instances) is brute, then the Law is **explanatorily inert**. You might as well not have the Law. You could just have the regularity. By making the link between $N$ and the instances brute, Armstrong has smuggled the Humean mosaic back in as the fundamental layer, with $N$ floating on top as a useless extra.

  **B. Lewis's "Biceps" Joke**
  David Lewis's critique was devastatingly simple. He argued that you cannot confer power by naming.
  Lewis wrote: *"Don't call any alleged feature of reality 'necessitation' unless it actually necessitates."*

  The joke you recall is roughly this: Armstrong thinks that by calling the relation $N$ "Necessitation," he has secured the necessity of the regularity. Lewis retorts that this is like thinking you can develop mighty biceps just by naming yourself "Armstrong."

  The philosophical point is about **logical entailment**.
  *   Does the statement "$N(F, G)$ exists" logically entail "All Fs are Gs"?
  *   If **Yes**: Then $N$ is a logical relation. But Armstrong wanted laws to be contingent (gravity *could* have been inverse-cube). If $N$ is logical, laws are necessary truths, which contradicts Armstrong's view.
  *   If **No**: Then it is possible for $N(F, G)$ to exist, yet some $F$ is *not* $G$. If that's possible, $N$ isn't "governing" anything. It's just a label for the regularity, which collapses back into Humeanism.

  Armstrong tried to split the difference: $N$ is a contingent relation that *somehow* necessitates. The Inference Problem says this is incoherent. You can't have "contingent necessitation" that bridges the gap between universals and particulars without magic.

  ### 3. Dispositional Essentialism: Escape or Relocation?
  This is where the "Bird and that lot" (Alexander Bird, Brian Ellis, Stephen Mumford) come in. They saw the Inference Problem crushing Armstrong and tried to fix the engine.

  **The Move:**
  Armstrong treated properties (Universals) as **categorical**. F-ness is just a quality; it needs an external glue ($N$) to connect it to G-ness.
  Dispositional Essentialists say: Properties are not inert. To be $F$ *just is* to be disposed to produce $G$. The "law" isn't an external relation; it's internal to the identity of the property.
  *   **Example:** To be "negative charge" *is* to be disposed to repel other negative charges.
  *   **The Claim:** This solves the Inference Problem. You don't need to infer the regularity from an external law. The regularity flows directly from what the properties *are*.

  **Do they escape the Inference Problem?**
  They escape the *specific* Armstrongian version (the gap between external relation and instance), but they relocate the problem to two new locations:

  **1. The Masking/Finking Problem (The Inference returns)**
  Even if a property *is* a disposition, does possessing the disposition guarantee the manifestation?
  *   **Scenario:** A glass is fragile (disposition to break). I drop it. But a sorcerer catches it instantly (a "fink"). Or it is wrapped in bubble wrap (a "mask").
  *   **The Problem:** The glass retained its fragility (the property didn't change), but it didn't break (the manifestation didn't happen).
  *   **Implication:** If $Property \nrightarrow Manifestation$ in all cases (because of interference), then the Dispositional Essentialist still cannot strictly *infer* the regularity from the property alone. They need *ceteris paribus* clauses ("all else being equal"). But once you add *ceteris paribus* clauses, you are back to describing patterns in the mosaic, not strict governance. The "necessity" becomes leaky.

  **2. The Modal Collapse (The Cost of Escape)**
  To make the inference work strictly, Dispositional Essentialists often have to say that properties *necessarily* produce their manifestations.
  *   **The Consequence:** If the laws of nature are grounded in the essences of properties, and properties have their essences necessarily, then **the laws of physics are metaphysically necessary.**
  *   **The Worry:** Could the electron have had a different mass? Could gravity have been repulsive? For Bird, the answer seems to be "No."
  *   **Why this matters:** Many philosophers (and physicists) feel this is too high a price. It makes the actual structure of our universe the *only* possible universe. It trades the "magic of governance" for the "magic of modal collapse."

  ### 4. Summary for Your Piece
  If you are writing this up, here is the narrative arc of the debate:

  1.  **Humeans** say: "Governance is magic. There is no engine, only the track." (Clear, but feels scientifically unsatisfying).
  2.  **Armstrong** says: "There is an engine ($N$)!"
  3.  **Lewis/Van Fraassen** say: "You haven't connected the engine to the wheels. Calling it 'Necessitation' doesn't make it turn the axle. That's the Inference Problem."
  4.  **Dispositional Essentialists** say: "The wheels *are* the engine. The properties themselves push."
  5.  **Critics reply:** "But sometimes the wheels spin without moving the car (masking), and now you're telling me this is the only possible car design ever (modal necessity)."

  **The Verdict:**
  The Inference Problem succeeds in showing that Armstrong's specific machinery (external relations between categorical universals) is broken. It fails to bridge the gap between the abstract law and the concrete world without smuggling in the regularity it was supposed to explain.

  Dispositional Essentialism fixes the *connection* (by internalizing it) but arguably breaks the *contingency* of laws. So, the debate hasn't ended; it has just shifted from "How do laws connect to events?" to "Are the laws of physics the only possible laws?"

  For your piece, the takeaway is that **"Governance" is an expensive metaphysical luxury.** To buy it, you either pay with incoherence (Armstrong's gap) or with modal rigidity (Bird's necessity). The Humean refuses to pay the bill, accepting that physics describes the "what" without a metaphysical "why."
