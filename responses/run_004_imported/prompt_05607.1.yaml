  *(Self-Correction during drafting)*: I need to be careful not to conflate the "Inference Problem" with the "Identification Problem."
  *   *Identification:* What *is* N?
  *   *Inference:* Does N *entail* the regularity?
  They are closely related. Lewis's critique targets the inference: Even if N exists, why does it force the instances? I will focus on the Inference aspect as requested.

