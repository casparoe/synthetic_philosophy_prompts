          *   Story 2: Lady Li (Chapter 2). Argument: She cried when taken captive, but later enjoyed her new life. Implication: We don't know if death is bad; we might regret fearing it. *Type:* Epistemological/Skeptical claim (limits of knowledge).
      *   **Questions:**
