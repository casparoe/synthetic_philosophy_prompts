      *   *Brook Ziporyn* often bridges the two, seeing the metaphysics as serving the spiritual practice.
      *   The tension is real: Is Zhuangzi a metaphysical monist (all is One/Dao) or a radical skeptic (how can we know anything)?
      *   Most contemporary scholars argue it's not an "either/or" but a "both/and" where the skepticism undermines the *attachment* to life/death distinctions, while the metaphysics provides a *perspective* to inhabit.

