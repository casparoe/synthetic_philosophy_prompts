      *   **The Opposing View (Tsongkhapa/Prasangika):** Negations are *prasanga* (reductio ad absurdum). They deny *svabhava* (intrinsic nature) predicated of things, not the things themselves. No positive thesis is held. Asserting "true contradictions" is itself a view (*drsti*) to be negated.
      *   **Key Tension:** Is Madhyamaka a metaphysics of inconsistency or a therapeutic deconstruction of metaphysics?

  3.  **Drafting the Questions (Iterative Process):**

