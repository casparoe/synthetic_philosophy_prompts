  *(Self-Correction Note)*: I need to make sure I don't caricature Aristotle. Aristotle isn't a modern liberal individualist. He thinks we are political animals. The tension is subtle: it's about the *priority* of the particular relationship vs. the broader conception of justice/flourishing that might transcend it. I need to make sure Jordan sounds like an Aristotelian, not a Utilitarian or Kantian. The focus should be on *character* and *flourishing*, not just "rules."

  *Revised Plan for Jordan:* Focus on *phronesis* (practical wisdom). *Phronesis* allows the agent to see the whole picture, including the health of the *polis*, not just the immediate dyad. The worry is that Role Ethics makes the dyad opaque to outside evaluation.

  *Revised Plan for Alex:* Focus on the idea that the "whole picture" *is* the network of relationships. There is no "outside." Reform is immanent, not transcendent.

