  2.  **Deconstruct the Philosophical Positions:**
      *   **Ames/Rosemont (CRE):** Focus on *relationality*. The self is a node in a network of relationships. Morality isn't applying universal rules to cases; it's optimizing the specific relationship. In 13.18, "Uprightness" (*zhi*) *is* the mutual protection between father and son. To report the father *is* the corruption of uprightness in that context.
      *   **Aristotle (AVE):** Focus on *character* (hexis) and *eudaimonia* (flourishing). Virtues are stable dispositions of an individual agent. While Aristotle acknowledges we are "political animals," the virtuous agent must have *phronesis* (practical wisdom) to discern the mean. This implies a capacity to step back and evaluate whether a role contributes to *eudaimonia* or violates justice.

  3.  **Drafting - Section by Section:**

