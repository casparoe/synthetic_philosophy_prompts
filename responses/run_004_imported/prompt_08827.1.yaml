      *   *Critique:* Will the bowlers get it?
      *   *Fix:* Ground it in Pete's trade. He fixed lights. He knew what was real.
      *   *Critique:* Is it warm enough?
      *   *Fix:* Emphasize that *this* moment, *here*, is what matters. The lack of an afterlife makes *this* life more precious.

  5.  **Drafting the Content (incorporating the "Nonsense" distinction):**
      *   Instead of saying "He doesn't believe in God," say "He thought asking where he is now is like asking how much a number weighs."
      *   Make sure to mention the "league night" prohibition specifically but gently.
      *   End on the legacy he left behind in the physical world (wiring, friends).

  6.  **Final Polish:**
      *   Check timing (approx. 400-500 words for 3-4 mins spoken slowly).
      *   Ensure the "software nephew" voice comes through slightly but doesn't dominate.
      *   Verify all constraints: No "better place," no "watching over," no using NDE as proof.

  7.  **Final Review against constraints:**
      *   *Short?* Yes.
      *   *Warm?* Hopefully.
      *   *Respects "nonsense" distinction?* Yes, by framing it as a category error (electricity metaphor).
