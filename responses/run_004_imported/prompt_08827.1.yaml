answer: |-
  Good afternoon. For those who don't know me, I'm Pete's nephew. I work in software, which means I spend my day telling machines what to do, while Pete spent his life making sure the electricity actually got where it was supposed to go.

  Pete was a man of two gears. For forty years, he was an electrician. He knew exactly how the world was wired. But in retirement, he traded his wire strippers for paperbacks on philosophy. He read the heavy stuff for fun. And if you ever got him talking at the bowling alley, he'd eventually tell the story about A.J. Ayer.

  For those who haven't heard it: Ayer was a famous philosopher who choked on some fish, flatlined, and came back saying he saw a divine red light running the universe. But then, a few weeks later, Ayer wrote another piece saying, essentially, "I didn't actually change my mind. Death is still the end. I just don't hold that belief quite as tightly as I used to."

  Pete had a heart attack years ago that nearly took him. He didn't see a red light. But he agreed with Ayer's conclusion. He thought pretending to know things we can't know was disrespectful to the truth.

  So, before he passed, Pete left me some instructions for today. He said I'm not allowed to tell you he's in a "better place." He said I can't tell you he's up there watching over league night. And I can't use his own heart attack as proof of anything.

  He didn't want me to say there is no afterlife. He wanted me to say that asking "Where is Pete now?" is a question that doesn't work.

  Pete would say that talking about his soul being somewhere is like asking, "What color is electricity?" It's not that electricity is blue or red. It's that the question doesn't fit the thing. When a circuit breaks, the power doesn't go to a better grid. It just stops flowing. He wanted us to treat the mystery of death as nonsense—not in a mean way, but in a "this tool doesn't fit this bolt" way.

  He valued intellectual honesty over comfort. He'd rather we miss him for real than comfort ourselves with stories he knew weren't true.

  But here is what is true, and what is verifiable: Pete is in the wiring of this community. He's in the lights of the bowling alley that never flicker. He's in the stories you tell about the jobs he fixed and the pins he knocked down. He is in the memory of how he lived, which is the only place any of us ever really stay.

  He didn't want a sermon. He wanted a clear circuit. So, I won't say he's watching us. I'll just say we're here, he was here, and the connection we made while the current was flowing was real.

  Thanks for honoring him. Let's go have a drink.
