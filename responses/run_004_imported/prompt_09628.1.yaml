  In philosophy, a "merely verbal dispute" means you agree on all the non-linguistic facts (who is playing, who owns the name, when they joined) and only disagree on which label to apply to those facts. Dana wins on this technical definition: there is no hidden "band particle" in the universe that determines identity. However, Mark's Move 6 survives because it highlights that **choosing the definition is itself a substantive issue.** The real disagreement isn't about what *is*, but about what concept is *useful*. If we define "band" by creative continuity, fans get protected from scams; if we define it by legal ownership, businesses get stability.

