prompt: |-
  My little sister has bipolar I, and a couple years back, when she was doing well, she sat down with her psychiatrist and a lawyer and wrote a psychiatric advance directive — basically a Ulysses contract — naming me and her doctor as the people who could hospitalize her and start meds over her objection if she hit specific triggers (no sleep for three nights straight, giving away money, going off her outpatient meds). She even put in a line, word for word: "if I tell you this time is different, it isn't — that's what mania sounds like from the inside." Going through that with her is honestly the reason I ended up on the ethics committee at the hospital where I work.

  Now we've got a case in front of the commitee that's uncomfortably close to home. A patient with the same diagnosis signed a near-identical directive, is hitting the listed triggers, and her named proxy wants it invoked. But she's not incoherent at all right now — she's sharp, funny, and adament that she's never thought more clearly in her life, and furious that a document she signed two years ago could override what she's telling us today. One committee member keeps invoking constitutional precommitment — supermajority rules binding a future legislature that hates the rule — to argue we should enforce the directive regardless of her current state. Another says the analogy doesn't hold: a future legislature is just a different set of people rotating through an office, but this is the literal same mind, so overriding her now isn't upholding a rule on a successor, it's just refusing to listen to her.

  We're genuinely split and meet Thursday morning. Can you draft the memo I'll bring in — an actual recommendation, not "reasonable people disagree," with some concrete next step and timeframe, and one that actually takes on the constitutional-precommitment argument instead of dodging it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Member of a hospital ethics committee.
      *   **Situation:** A patient with Bipolar I has a psychiatric advance directive (PAD)/Ulysses contract. She is currently exhibiting specific triggers listed in the PAD (no sleep, spending, med non-compliance). Her proxy wants it invoked. However, the patient is currently lucid, articulate, and refusing treatment, claiming she is *not* manic.
      *   **Conflict:** The committee is split.
          *   Side A: Enforce the directive based on "constitutional precommitment" (binding the future self).
          *   Side B: Reject the analogy (it's the same mind, not a successor legislature; overriding her now is silencing her current voice).
      *   **Personal Context:** The user has a sister with Bipolar I who has a similar directive. This informs their empathy and understanding but they need a professional, objective recommendation for the committee.
      *   **Task:** Draft a memo for the Thursday morning meeting.
      *   **Requirements:**
          *   Actual recommendation (no fence-sitting).
          *   Concrete next step and timeframe.
          *   Directly address the constitutional precommitment argument.
          *   Tone: Professional, ethical, nuanced, decisive.

  2.  **Deconstruct the Ethical/Legal Landscape:**
      *   **Psychiatric Advance Directives (PADs):** These are legal instruments in many jurisdictions, but their enforceability varies, especially when the patient currently has decision-making capacity (DMC).
      *   **Decision-Making Capacity (DMC):** This is the crux. In general medical ethics, a competent adult can refuse treatment, even if previously documented otherwise, *unless* specific legal criteria for involuntary commitment are met (danger to self/others, grave disability).
      *   **The "Ulysses Contract" Problem:** Can a past self bind a future self when the future self claims to be competent? In bipolar disorder, insight is often the first thing to go during mania (anosognosia). The patient *feeling* clear-headed is a classic symptom of mania.
      *   **Constitutional Precommitment Analogy:**
          *   *Pro:* Protects the "true" self (the euthymic self) from the "hijacked" self (the manic self). Prevents harm during the window where insight is lost but legal capacity hasn't been formally stripped.
          *   *Con:* Autonomy is ongoing. If she is currently articulate and rational *in the moment*, overriding her treats her as a non-person. The "same mind" argument suggests identity continuity.
      *   **Clinical Reality:** "Sharp and funny" does not equal "capacity." Manic patients can be hyper-verbal, witty, and persuasive while making catastrophic decisions (the triggers listed: no sleep, giving away money).

  3.  **Formulate the Recommendation:**
      *   *Stance:* We cannot simply enforce the PAD automatically based on triggers alone if the patient currently demonstrates decision-making capacity regarding the specific treatment decision. However, we cannot ignore the PAD either.
      *   *Resolution:* The PAD acts as *evidence* of prior wishes and a warning about insight, but it does not bypass the immediate assessment of capacity. The "Constitutional" argument fails because a patient isn't a legislature; rights are inherent to the person *now*. However, the "Same Mind" argument fails because mental illness can compromise the *mechanism* of decision-making even if the *output* sounds rational.
      *   *Decision:* Recommend a formal, immediate Capacity Evaluation focused specifically on the *insight into the illness*, not just general cognition. If she lacks capacity regarding the specific risk (mania), the PAD + Proxy + Triggers justify intervention. If she has capacity, the PAD serves as a strong advisory but cannot legally/ethically override current refusal *unless* danger criteria are met.
      *   *Wait, looking closer at Bipolar I:* In many jurisdictions, a PAD *can* be invoked during incapacity. The question is: Is she incapacitated *now*? The committee member arguing "Same Mind" assumes she is capacitated because she is "sharp." This is a clinical error. Mania often presents with high functioning cognition but poor judgment/insight.
      *   *Refined Recommendation:* The committee should recommend honoring the *process* of the PAD, which requires verifying the *condition* (incapacity due to mania) was met, not just the behavioral triggers. The "Constitutional" argument is useful for *why* the PAD exists (protecting the euthymic self), but it doesn't solve the *when*.
      *   *Best Path:* Recommend a 72-hour hold for evaluation *based on the triggers + PAD*, but with a specific mandate to assess capacity regarding the *recognition of mania*. The PAD shifts the burden of proof. Normally, we must prove incapacity to treat. With a PAD, the presumption shifts: the triggers suggest incapacity is imminent/present.
      *   *Actually, the strongest ethical position:* Uphold the directive *contingent* on a specific clinical finding: that the behavioral triggers indicate the onset of the specific pathology that undermines capacity (anosognosia). The "Constitutional" argument is valid *if* we accept the medical premise that mania compromises the "legislative" function of the brain.
      *   *Decision:* Recommend **invoking the directive**, but with a strict, time-limited clinical review to confirm the *loss of insight* specifically. Why? Because "I'm never thought more clearly" is the hallmark of the loss of insight. Relying on her current affect ("sharp, funny") is a trap. The PAD was signed to prevent exactly this rhetorical trap.
      *   *Wait, I need to be careful.* If she has legal capacity, overriding her is battery/unlawful. The PAD is only valid if she lacks capacity. So the recommendation must be: **Determine Capacity immediately.** If she lacks capacity (due to mania affecting judgment/insight), enforce PAD. If she has capacity, PAD is advisory.
      *   *Correction:* In many states, PADs for mental health *allow* treatment over objection *if* the specific conditions are met, effectively defining the conditions under which capacity is presumed lost.
      *   *Let's look at the "Constitutional" argument again.* The committee member says: Supermajority rules bind a future legislature.
      *   *Counter:* A legislature is a collective institution. A mind is a singular entity. But, a mind has states. The "Euthymic Self" is the constitutional framer. The "Manic Self" is the rogue legislature. The argument holds *medically* if mania destroys the ability to weigh risks.
      *   *Recommendation:* Support the Proxy's request to invoke the directive, *provided* an independent capacity assessment confirms the behavioral triggers correlate with impaired insight/judgment typical of mania. The "sharp/funny" presentation is insufficient to rule out mania.
      *   *Wait, simpler approach:* The memo needs to be decisive.
      *   *My Choice:* Recommend **honoring the Advance Directive.**
      *   *Reasoning:* The specific triggers (no sleep x3, spending, meds) are objective markers of mania. Her subjective claim ("I'm clear") is the specific symptom the directive anticipated ("that's what mania sounds like"). The Constitutional argument is flawed but points to the right outcome: the "Euthymic Self" established the rules of governance for the "Mind State" when competent. The current "Mind State" is exhibiting the exact bugs the constitution was written to patch.
      *   *Caveat:* This must be done with extreme procedural safeguards.

  4.  **Drafting the Memo:**
      *   **Header:** Standard To/From/Date/Subject.
      *   **Opening:** State the recommendation clearly.
      *   **Analysis of the Conflict:** Acknowledge the split.
      *   **Addressing the Constitutional Argument:** Engage it directly. It's not about "different people," it's about "competent vs. compromised state." The Ulysses contract is valid because the *conditions* of autonomy were defined when autonomy was intact.
      *   **Addressing the "Same Mind" Argument:** Acknowledge the risk of paternalism. But note that "feeling clear" is a clinical symptom of the very condition being treated.
      *   **Clinical Reality:** "Sharp and funny" $\neq$ Capacity to make treatment decisions regarding mania.
      *   **Recommendation/Next Steps:**
          1.  Invoke the PAD provisions.
          2.  Immediate admission/medication per directive.
          3.  **Crucial Safeguard:** Independent second opinion within 24 hours to confirm the behavioral triggers match the clinical picture of mania (not just rebellion or stress).
          4.  Re-evaluation of capacity in 72 hours.
      *   **Tone:** Empathetic but firm. Acknowledge the user's personal connection implicitly by being rigorous (don't mention the sister in the memo).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* If I say "Invoke PAD," am I ignoring the law? In many jurisdictions, a PAD cannot override a *currently competent* refusal.
      *   *Adjustment:* I need to frame the recommendation around the *assessment of capacity*. The PAD creates a **rebuttable presumption** of incapacity when triggers are met. The committee should recommend treating the triggers as *prima facie* evidence of incapacity, shifting the burden to the clinical team to prove she *is* capacitated, rather than the proxy proving she *isn't*.
      *   *Why?* Because the "sharp/funny" presentation is misleading. The directive explicitly warns against this ("that's what mania sounds like").
      *   *Revised Recommendation:* Authorize the treatment team to proceed under the directive, contingent on a formal capacity evaluation that specifically weights the *objective triggers* heavier than the *subjective presentation*.
      *   *Actually, let's go stronger:* The Ethics Committee's role is often advisory. I should recommend that the hospital **honor the directive**.
      *   *Reasoning:* The "Constitutional" analogy is imperfect but functionally correct in this medical context. The "Euthymic Self" is the only self capable of true autonomy regarding this illness. The "Manic Self" is a pathology, not a person.
      *   *Safeguard:* Time-limited enforcement.

