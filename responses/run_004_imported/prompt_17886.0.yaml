          *   Minimizing $D_{KL}$ is maximizing Entropy.
          *   $H(x) = - [ x(0.75 \ln 0.75 + 0.25 \ln 0.25) + (1-x)(0.5 \ln 0.5 + 0.5 \ln 0.5) + x \ln x + (1-x) \ln (1-x) ]$.
