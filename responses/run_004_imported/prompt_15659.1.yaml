      *   **Observation:** Prominent expressivists (Blackburn, Gibbard) continue to develop complex theories rather than conceding.
      *   **Question:** Why do they keep fighting if the logic is so "clean" against them?

  2.  **Evaluate the Premise:**
      *   *Is the Frege-Geach problem decisive?* No. It's a major challenge, but not a knockout blow. If it were, expressivism would be dead. The fact that it isn't dead suggests the problem is solvable or manageable.
      *   *Do expressivists deny truth-aptness?* Classical expressivism (Ayer, Stevenson) did. Neo-expressivism (Blackburn, Gibbard) often adopts a "quasi-realist" stance where they *mimic* truth-aptness or redefine it.
      *   *Is the logic "clean"?* The logical validity of moral arguments is agreed upon by both sides. The disagreement is about *why* it's valid (truth-preservation vs. consistency of attitudes).

  3.  **Identify Key Counter-Arguments/Developments:**
      *   **Quasi-Realism:** Blackburn's project isn't to deny that moral language *looks* realist, but to explain how we can talk *as if* it's realist without committing to moral facts. The Frege-Geach problem is the central hurdle for quasi-realism, not its grave.
      *   **Logic of Attitudes:** Expressivists argue validity isn't about truth conditions but about consistency of non-cognitive states (e.g., disapproving of lying while approving of getting your brother to lie is inconsistent).
      *   **Minimalism/Deflationism about Truth:** Many modern expressivists adopt a deflationary view of truth. If "true" just means "I agree" or is a logical device, then moral sentences can be "true" without corresponding to robust moral facts. This dissolves the tension.
      *   **Hybrid Theories:** Some theories combine expressivist and cognitivist elements.
      *   **Problems for Cognitivism:** Expressivists argue cognitivism has its own fatal flaws (queerness, motivation internalism), so they *must* solve Frege-Geach to survive, not concede.

