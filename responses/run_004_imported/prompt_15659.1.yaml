answer: |-
  You have identified the single most famous objection to expressivism, but your assessment that it "settles the debate decisively" is precisely why metaethics remains a live field of inquiry. If the Frege-Geach problem were the knockout blow you suggest, expressivism would indeed be a historical footnote.

  The reason philosophers like Simon Blackburn, Allan Gibbard, and more recently Mark Schroeder and Daniel Stoljar continue to develop expressivist theories is that they believe the Frege-Geach problem is a *constraint* to be solved, not a *refutation*.

  Here is why the debate is far from over, and why expressivists don't simply concede to cognitivism.

  ### 1. The Shift to "Quasi-Realism"
  Your understanding of expressivism aligns closely with **classical expressivism** (e.g., A.J. Ayer, C.L. Stevenson). They argued that moral sentences are merely emotional ejaculations ("Boo lying!") and therefore lack truth conditions. For classical expressivists, Frege-Geach was indeed devastating. If "Boo lying!" has no truth value, it can't function as the antecedent of a conditional.

  However, modern expressivists are mostly **quasi-realists** (Blackburn) or **norm-expressivists** (Gibbard). Their project is not to insist that moral language *fails* to look like factual discourse, but to explain how we can legitimately talk *as if* there are moral truths without actually believing in robust moral facts.

  Blackburn's specific response to Frege-Geach is that logical validity doesn't require truth conditions; it requires **consistency of attitudes**.
  *   **Cognitivist view:** The argument is valid because truth is preserved from premises to conclusion.
  *   **Blackburn's view:** The argument is valid because holding the attitudes expressed in the premises while lacking the attitude in the conclusion constitutes a clash of commitments. To disapprove of lying, yet approve of getting your brother to lie (if lying is wrong), is a practical inconsistency, not a logical contradiction of facts.

  ### 2. Deflationism About Truth
  A major reason expressivists don't concede is that the definition of "truth-apt" has changed. Many modern expressivists adopt a **deflationary or minimalist theory of truth**.

  On this view, to say "It is true that lying is wrong" adds no metaphysical weight; it is just a device for endorsement. If "truth" is just a logical operator (as Paul Horwich or Crispin Wright might argue), then expressivists can grant that moral sentences are "truth-apt" without conceding to cognitivism. They can say, "Yes, 'lying is wrong' is true," meaning "I disapprove of lying," without committing to the existence of a moral fact in the universe. This allows them to solve Frege-Geach (by allowing moral sentences to embed in logic) while retaining the core expressivist insight (that the foundation is conative, not cognitive).

  ### 3. The Motivation Problem (Internalism)
  If expressivists conceded to cognitivism, they would inherit a problem they find worse than Frege-Geach: **Moral Motivation.**

  Expressivism is often driven by **Judgment Internalism**: the idea that there is a necessary connection between making a moral judgment and being motivated to act on it.
  *   **Expressivist explanation:** Moral judgments *are* expressions of motivation (desires/plans). Therefore, the connection is conceptual.
  *   **Cognitivist explanation:** Moral judgments are beliefs about facts. But beliefs alone do not motivate (the Humean Theory of Motivation). To explain why knowing "lying is wrong" motivates you not to lie, cognitivists must posit a separate desire to be moral, or argue that moral facts are intrinsically motivating.

  Expressivists argue that cognitivism makes moral motivation mysterious or contingent, whereas expressivism explains it naturally. They are willing to build elaborate logical frameworks (to solve Frege-Geach) because they believe the payoff—explaining the intrinsic link between judgment and action—is worth the theoretical cost.

  ### 4. Metaphysical Queerness
  The other driver for expressivism is J.L. Mackie's **Argument from Queerness**. If cognitivism is true, moral facts must be objective, prescriptive properties that can be known via intuition. Many philosophers find this metaphysically suspicious.

  Expressivists argue it is better to complicate the *logic* (by developing a logic of attitudes) than to complicate the *metaphysics* (by populating the universe with weird moral properties). For them, the Frege-Geach problem is a technical puzzle in philosophy of language; Cognitivism's moral facts are a problem in ontology. They prefer the former.

  ### 5. The "Embedding" Problem Goes Both Ways
  Interestingly, recent developments suggest Cognitivism faces its own embedding challenges, specifically regarding **moral disagreement**.
  *   If I say "Lying is wrong" and you say "Lying is not wrong," expressivists explain this as a clash of attitudes.
  *   Cognitivists explain this as a disagreement about facts.
  *   However, sophisticated expressivists (like Gibbard) argue they can explain disagreement better. If moral facts are weird, how do we access them? If we access them via intuition, why do intuitions vary so wildly? Expressivists argue their view explains the *nature* of moral disagreement (a negotiation of norms) better than cognitivism (a failed attempt at detecting facts).

  ### Summary
  The Frege-Geach problem forced expressivism to grow up. It killed off the simple "Boo/Hurrah" emotivism of the 1930s. But it gave birth to **Quasi-Realism**, which is sophisticated enough to mimic realist discourse while maintaining an anti-realist ontology.

  Philosophers don't concede because:
  1.  **Deflationary truth** allows them to accept logical embedding without accepting moral facts.
  2.  **Internalism** makes expressivism superior at explaining moral motivation.
  3.  **Metaphysical parsimony** makes expressivism preferable to positing queer moral properties.

  The "state of play" in metaethics is not that expressivism lost; it is that expressivism successfully transformed into a theory that is logically robust enough to survive Frege-Geach, making the choice between it and cognitivism a matter of weighing **metaphysical costs** (cognitivism) against **logical complexity** (expressivism).
