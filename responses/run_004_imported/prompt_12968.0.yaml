answer: |-
  **MEMORANDUM**

  **TO:** Allocations Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Procedure Recommendation: Resolving the Voting Paradox

  ### 1. Context & The Problem

  Last quarter, we encountered a voting outcome that has rightly caused friction: our current bylaws mandated funding a grant that a majority of the committee (3 out of 5) voted *against* funding when asked directly.

  This happened because our current rule aggregates votes on *premises* (Cost-Effectiveness, Capacity) rather than the *conclusion* (Fund/Don't Fund). Mathematically, this is a known phenomenon in social choice theory called the **Discursive Dilemma** (or Doctrinal Paradox). It demonstrates that voting on logical components separately can yield a different result than voting on the final judgment, even when everyone is voting rationally.

  We are currently split: half the committee wants to abandon criteria voting for "gut polls" (Conclusion-Based), and half wants to keep criteria voting to maintain rigor (Premise-Based).

  ### 2. Analysis of the Options

  Both sides have valid concerns rooted in group agency theory:

  *   **The Premise-Based Case (Current Rules):** This method enforces discipline. It prevents us from funding projects based on "vibes" or personal relationships that fail our explicit EA criteria. It generates clean data on *why* we reject grants. **However**, as we saw, it can force the group to fund projects no individual actually endorses, damaging group cohesion and accountability.
  *   **The Conclusion-Based Case (Gut Poll):** This respects the "will of the committee." If a majority says "No," the grant doesn't fund. It allows members to weigh intangible factors (e.g., portfolio fit, founder trust) that aren't captured in our two bars. **However**, without structure, it risks becoming opaque. We lose the ability to track if we are drifting from our mission due to bias or fatigue.

  For a small, high-trust group of five, **group cohesion and actual endorsement are more valuable than logical consistency.** A process that funds grants the majority opposes is unsustainable. Therefore, we should move to a Conclusion-Based procedure.

  However, simply switching to a "gut poll" throws away the rigor that makes us an EA circle. We need a third option that captures the benefits of both.

  ### 3. Recommendation: Conclusion-Based Voting with Structured Diagnostics

  I recommend we adopt **Conclusion-Based Voting** (a single "Fund/Don't Fund" vote) but mandate **Structured Diagnostics** for negative votes.

  **The New Procedure:**
  1.  **Discussion:** We discuss the grant using our two bars (CE and Capacity) as the *framework* for deliberation, not as separate votes.
  2.  **The Vote:** We vote on a single question: *"Should [Organization] receive a grant this cycle?"* (Majority rules).
  3.  **The Diagnostic:** If a member votes **No**, they must select a primary reason from a dropdown:
      *   *Insufficient Cost-Effectiveness*
      *   *Capacity/Execution Risk*
      *   *Strategic Fit / Other*
  4.  **Transparency:** We record these diagnostics internally. If a grant fails, we can report "Failed primarily on Capacity" to stakeholders, preserving our external accountability.

  ### 4. Why This Works for Both Sides

  **To the "Keep the Bars" camp:**
  This does not abandon our criteria; it relegates them to their proper place. Criteria are tools for *thinking*, not algorithms for *deciding*. By requiring diagnostics on "No" votes, we continue to collect data on whether we are rejecting grants for CE reasons or Capacity reasons. We maintain the discipline of asking "Is this cost-effective?" without being held hostage by the mathematical paradox where a grant passes despite lacking a true majority coalition.

  **To the "Switch to Gut" camp:**
  This secures the core demand: no grant is funded unless a majority of the committee actually wants to fund it. It eliminates the incoherence of funding a project that 60% of the committee implicitly rejected. It also allows members to weigh legitimate factors outside our two narrow bars (e.g., "This is cost-effective, but we already funded three in this cause area") without needing to game the Capacity vote to express that view.

  ### 5. Implementation

  This change requires a simple bylaw amendment. I propose we adopt this immediately for the upcoming cycle.

  *   **Action Item:** I will draft the bylaw language to reflect "Majority approval on final funding decision" with "Mandatory attribution of rejection criteria."
  *   **Trial Period:** We will review this process in two quarters. If we find the diagnostics are being filled out lazily, we can revisit.

  ### 6. Conclusion

  The Discursive Dilemma shows us that we cannot have perfect logical consistency and perfect democratic responsiveness simultaneously. For a volunteer giving circle, responsiveness must win. If we fund grants the majority doesn't support, we risk burnout and cynicism. But by keeping the diagnostics, we ensure we don't lose our edge.

  Let's vote on the *grant*, but keep tracking the *reasons*.

  Best,

  [Your Name]
