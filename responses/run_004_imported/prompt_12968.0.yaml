      *   *Why?* Because the Paradox proves the Bar-by-Bar method can override the majority will. In a volunteer group, majority will > logical consistency of criteria. But we need the data. So: Vote on "Fund", but require tagging "Failed CE" or "Failed Capacity" if voting No.

  4.  **Drafting the Memo:**
      *   **Subject:** Needs to be clear and professional.
