prompt: |-
  Okay this is a weird one but it's been living in my head for weeks. I went down a random rabbit hole on Bishop Berkeley (the 'esse est percipi', to be is to be perceived, idealism guy) and found out he also wrote this whole treatise called The Querist thats basically a long list of rhetorical questions about economics. His big point seems to be that money isn't wealth or a store of value in itself, its more like a ticket or counter for keeping track of and enabling productive activity, not something that needs to be backed by anything intrinsically valuable. That take keeps nagging at me whenever the crypto-maximalists and the 'fiat is fake money' crowd go at it in my rationalist-adjacent group chats. So: what are the most important implications of Berkeley's views on money for that whole debate? And a bonus question I can't shake: is there an actual throughline from his immaterialism to how he thought about currency, or is that just a cute coincidence that doesn't hold up under scrutiny?
