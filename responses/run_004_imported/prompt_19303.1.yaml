answer: |-
  **Title:** The Physics of Ruin: Ergodicity, Utility, and the Objective Standard of Rational Choice

  **Introduction**

  As a physicist, you recognize the discomfort immediately. In statistical mechanics, we distinguish carefully between the microcanonical ensemble and the time evolution of a single system. We know that for non-ergodic systems, the phase-space average tells you nothing about the trajectory of a single particle over time. Yet, in neoclassical economics, the "representative agent" is often treated as an ensemble average incarnate, expected to maximize arithmetic expected wealth even when the underlying dynamics are multiplicative and non-ergodic.

  The dispute between Ole Peters' ergodicity economics and the standard Expected Utility Theory (EUT) defended by Paul Samuelson is not merely a technical disagreement over the Kelly criterion. It is a foundational clash between a normative theory of preference (EUT) and a descriptive theory of physical dynamics (Ergodicity Economics). Peters argues that when time averages and ensemble averages diverge, maximizing geometric growth is not a risk preference but an objective requirement of rationality. Samuelson counters that this merely disguises a specific utility function (log-wealth) as a law of nature, ignoring that a rational agent might legitimately prefer a small chance of astronomical wealth over near-certain mediocrity.

  This essay reconstructs the dispute and offers a definite verdict: **For the specific class of problems involving sequential, multiplicative dynamics without the possibility of ensemble access or bailout, geometric rationality does displace expected-value maximization as the objectively correct standard for a persistent agent.** This is not because Expected Utility Theory is mathematically wrong, but because linear utility (expected value maximization) is physically inadmissible for a single trajectory that values its own continuation. Rationality, in this context, is not about preference satisfaction in the abstract, but about the instrumental coherence of agency over time.

  **The Physics of the Gamble: Ensemble vs. Time**

  Let us formalize the example you provided. Consider a wealth process $W_t$ evolving in discrete time steps. At each step, wealth is multiplied by a random factor $X_t$, where $X_t = 1.5$ with probability $p=0.5$ and $X_t = 0.5$ with probability $q=0.5$.

  The **ensemble average** (the expectation value familiar to economists) at step $t$ is:
  $$ \langle W_t \rangle = W_0 \cdot \langle X \rangle^t = W_0 \cdot (0.5 \times 1.5 + 0.5 \times 0.5)^t = W_0 \cdot (1.0)^t = W_0 $$
  The expected wealth is constant. A risk-neutral agent maximizing expected wealth should be indifferent to playing this game. If the payoff were slightly higher (e.g., 1.6 on heads), the expected wealth would grow exponentially, and EUT dictates one should bet everything.

  However, the **time average** growth rate for a single trajectory is determined by the geometric mean:
  $$ g = \exp\left( \langle \ln X \rangle \right) = \exp\left( 0.5 \ln 1.5 + 0.5 \ln 0.5 \right) \approx \exp(-0.14) \approx 0.87 $$
  Because the system is non-ergodic, $\langle \ln W \rangle \neq \ln \langle W \rangle$. While the ensemble average wealth remains constant (or grows, if the arithmetic mean $>1$), the wealth of almost every individual trajectory decays to zero exponentially fast. In the language of statistical mechanics, the "typical" set of trajectories occupies a measure of the phase space that contributes negligibly to the arithmetic mean, which is dominated by exponentially rare "jackpot" trajectories.

  Peters' core argument is that the ensemble average is a physical fiction for a single agent. An individual lives in time, not in parallel universes. If the time average growth rate is negative, the agent faces ruin with probability 1 as $t \to \infty$. Therefore, optimizing for the ensemble average is optimizing for a quantity the agent will never observe.

  **The Orthodox Defense: Samuelson's Objection**

  Paul Samuelson spent decades dismantling the claim that the Kelly criterion (or geometric maximization) is a universal law. His argument rests on the axioms of Expected Utility Theory. In EUT, rationality is defined as consistency in preferences. If an agent prefers lottery A to lottery B, there exists a utility function $U(W)$ such that $E[U(A)] > E[U(B)]$.

  Samuelson argued that privileging the geometric mean is equivalent to arbitrarily selecting $U(W) = \ln W$. But why should a rational agent be forced into log-utility? Consider an agent with linear utility, $U(W) = W$. For this agent, the coin flip (with arithmetic mean 1.0) is fair, and a slightly favorable flip (arithmetic mean 1.01) is highly desirable. Even if the probability of ruin is 99.9%, the 0.1% chance of astronomical wealth drives the expected value up. If the agent values that potential wealth highly enough—perhaps to leave a massive bequest, or simply because they are risk-seeking—Samuelson argues it is rational to take the bet.

  To Samuelson, Peters' claim that geometric maximization is "objectively correct" confuses a specific risk preference with rationality itself. The fact that the time average diverges from the ensemble average is a physical feature of the gamble, but how one weighs the certainty of ruin against the expectation of gain is a normative question of values, not physics. To say otherwise is to commit the "long-run fallacy": assuming that because something happens in the limit $t \to \infty$, it dictates choice at finite $t$.

  **The Ergodic Intervention: Dynamics as Constraint**

  Peters' rebuttal, refined in recent years, is that ergodicity economics is not proposing a new utility function, but rather correcting the expectation operator itself. Standard EUT assumes the expectation operator $\mathbb{E}[\cdot]$ is the correct way to evaluate future outcomes. Peters argues that for non-ergodic processes, the correct expectation operator is the time average $\overline{(\cdot)}$.

  When the dynamics are multiplicative ($W_{t+1} = W_t \cdot X_t$), the observable that grows linearly in time is $\ln W_t$. Therefore, the change in the time-average observable is $\Delta \overline{\ln W}$. Maximizing this quantity is not an assertion of risk aversion; it is an assertion that the agent cares about the wealth they will actually hold in the future, not the wealth held by the ensemble average.

  The crucial distinction lies in the concept of **absorption**. In the coin-flip example, zero wealth is an absorbing state. Once $W_t = 0$, the process stops. The ensemble average includes trajectories that have bounced back from zero (if the math allows) or simply weights the non-ruined paths so heavily that they mask the ruin of the typical path. But a dead agent cannot collect the winnings of the rare surviving paths.

  **The Verdict: Objective Rationality as Survival**

  Here we must commit. Is geometric rationality objectively correct, or does it depend on utility?

  **Verdict:** For the class of problems defined by **sequential, multiplicative dynamics with an absorbing barrier at zero (ruin) and no access to ensemble averaging (no bailout)**, maximizing geometric growth is the objectively correct standard for any agent who values **persistence**.

  This verdict qualifies the dispute by shifting the ground from *preference* to *instrumental rationality*.

  1.  **The Physical Constraint:** Samuelson is correct that EUT is a flexible framework; you can model any behavior with the right $U(W)$. However, Peters is correct that for a single agent embedded in time, the ensemble average is physically unobservable. If an agent maximizes arithmetic expected wealth in a multiplicative environment with negative geometric drift, they maximize the probability of hitting the absorbing barrier (ruin).
  2.  **The Definition of Agency:** Rationality is generally understood as the effective pursuit of goals. For an agent to pursue *any* goal over time, they must exist over time. A strategy that leads to extinction with probability 1 (as $t \to \infty$) is instrumentally irrational for any goal that requires the agent's continued existence.
  3.  **The "Risk Preference" Illusion:** Standard economics treats the rejection of the favorable arithmetic bet (where $\langle X \rangle > 1$ but $\langle \ln X \rangle < 0$) as "risk aversion." This implies the agent is sacrificing expected return for safety. Ergodicity economics reveals this is a category error. There is no "expected return" to sacrifice for the single trajectory; the positive expectation exists only in the ensemble. Rejecting the bet is not risk aversion; it is **arithmetic realism**.

  Therefore, geometric rationality displaces expected-value maximization not as a universal moral law, but as a **physical constraint on optimization**. If you optimize $\langle W \rangle$ in a non-ergodic multiplicative world, you are optimizing a variable that does not couple to your actual state. It is akin to a thermodynamic engine designed to maximize the average energy of a gas ensemble while ignoring that its specific piston is losing pressure.

  **Qualifying the Commitment**

  This verdict requires two strict boundaries, without which Samuelson's critique holds:

  1.  **No Ensemble Access:** If the agent can play the gamble in parallel (e.g., a hedge fund with infinite capital reserves investing in many uncorrelated strategies, or a government printing money), the ensemble average becomes observable. In that case, arithmetic maximization is rational. The "objective" nature of geometric rationality applies strictly to the *single, persistent trajectory*.
  2.  **Value of Continuation:** If the agent's utility function values the "big win" more than existence itself (e.g., a martyr seeking to maximize the expected impact of a legacy, knowing they will likely die poor), then arithmetic maximization remains consistent with their preferences. However, this is a niche case. For the vast majority of economic agents whose utility functions are defined over consumption streams *during* their lifetime, ruin terminates utility.

  **Conclusion**

  The dispute between Peters and Samuelson is a collision between the normative flexibility of economics and the rigid constraints of physics. Samuelson wins on the grounds of logical consistency: one can define a utility function that prefers ruin. But Peters wins on the grounds of **ontological relevance**: for a single agent in time, the ensemble average is a phantom.

  As a physicist, you know that a theory which predicts a stable equilibrium for a system that is actually decaying is a bad theory, regardless of how elegant its axioms. Expected-value maximization in non-ergodic multiplicative environments is precisely such a theory. It predicts growth where there is decay. Therefore, for the class of problems governing individual economic survival, geometric rationality is not merely one preference among many. It is the objective standard of instrumental rationality. To ignore it is not to be "risk-seeking"; it is to misunderstand the topology of the state space in which you are trapped.
