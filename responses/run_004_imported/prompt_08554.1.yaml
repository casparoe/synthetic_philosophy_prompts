      *   **Side B (Broken Question):** The question has no answer. "Couple" is a social label that requires agreement. Without the agreement, the category doesn't apply. This is an *Anti-Realist* or *Social Constructivist* position. It assumes "couplehood" is defined by mutual recognition, not just behavioral patterns.
