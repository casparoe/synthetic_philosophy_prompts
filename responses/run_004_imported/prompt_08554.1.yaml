answer: |-
  Your TOK teacher smiled because you accidentally stumbled into a genuine philosophical debate that has occupied metaphysicians and philosophers of language for decades. You aren't just arguing about Maya; you're arguing about **Social Ontology** (what kind of things exist in society) and **Vagueness** (where do we draw lines on a spectrum).

  Here is the breakdown of who is "right," based on how philosophers actually categorize this kind of problem.

  ### 1. The Two Camps
  *   **Camp A (The Realists):** They believe there is a **fact of the matter**. They think "being a couple" is a state of being that exists independently, like "being pregnant" or "being 6 feet tall." Even if Maya and Ethan haven't said it, the reality of their actions makes it true.
  *   **Camp B (The Constructivists/Anti-Realists):** They believe the question is **category error**. They think "being a couple" is a social status that *requires* mutual agreement to exist. Without the agreement, the status doesn't apply, no matter how much they act like it.

  ### 2. The Principled Framework: "Brute Facts" vs. "Institutional Facts"
  The philosopher John Searle made a famous distinction that settles this specific argument.

  *   **Brute Facts:** These exist regardless of human opinion. (e.g., "It is raining," "Maya is breathing," "Ethan sat at this table.") Camp A is treating "dating" like a Brute Fact. They think if you observe enough behavioral data (snapping, lunch, mom), the fact emerges.
  *   **Institutional Facts:** These exist *only* because humans agree they exist. (e.g., "This piece of paper is money," "These two people are married," "He is the president.") You can have all the behavior in the world, but if the collective agreement (or the specific agreement between the parties) isn't there, the fact doesn't exist.

  **The Verdict:** "Dating" is an **Institutional Fact**.
  Unlike pregnancy, which is biological, "dating" is a social contract. In modern social ontology, a relationship status is constituted by **mutual recognition**. If Maya does not recognize the status of "couple," then, strictly speaking, the institutional fact of "being a couple" has not been created, regardless of Ethan's actions.

  Therefore, **Camp B is philosophically stronger.** There is no hidden fact waiting to be discovered, because the fact is *created* by the conversation they haven't had yet.

  ### 3. The Problem of Vagueness (The Sorites Paradox)
  Your friends in Camp A are struggling with what is called the **Sorites Paradox** (or the Paradox of the Heap).
  *   If you have one grain of sand, it's not a heap.
  *   If you add one grain, it's still not a heap.
  *   But eventually, you have a heap.
  *   *Question:* Which specific grain made it a heap?

  **The Answer:** There is no specific grain. "Heap" is a vague concept.
  Similarly, "Talking" vs. "Dating" is a vague concept. There is no specific text, lunch seat, or party that flips the switch. Camp A is frustrated because they want a precise boundary where none exists. Camp B is correct in identifying that the boundary is fuzzy by definition.

  ### 4. Why Camp A *Feels* Right (The Predictive Model)
  Camp A isn't "stupid." They are operating on a **predictive model**.
  Based on the data (mom, friends, lunch), they predict that if a "Define The Relationship" talk *were* to happen, the outcome would be "Yes, we are dating."
  They are treating the *label* as a description of the *behavior*.
  *   **Camp A says:** "They act like a couple, therefore they are a couple."
  *   **Camp B says:** "They haven't agreed to be a couple, therefore the label doesn't apply yet."

  Camp A is describing the *trajectory*; Camp B is describing the *current legal/social status*.

  ### 5. How to Settle the Disagreement
  You asked if there is a principled way to settle this. Yes. You need to shift the chat from **Ontology** (what *is* it?) to **Semantics** (what do we *mean* by it?).

  The disagreement persists because half your group defines "dating" as **Behavioral Exclusivity** (Camp A) and the other half defines it as **Declared Commitment** (Camp B).

  **The Synthesis:**
  You can tell your group chat this:
  > "There is no hidden fact of the matter because 'dating' isn't a physical object we can find; it's a social agreement we have to make. Camp A is right that they *act* like a couple, but Camp B is right that without mutual agreement, the *status* doesn't officially exist. It's not that we don't know the answer; it's that the answer hasn't been written yet."

  ### Summary for your Group Chat
  *   **Is there a hidden truth?** No. (Camp A is wrong on the metaphysics).
  *   **Is the question broken?** Yes, in the sense that it assumes a precise line exists where there is only a gradient. (Camp B is closer to right).
  *   **Who is correct about Maya?** If Maya says they aren't dating, then socially, they aren't dating. You cannot be in a contract with someone who doesn't know they signed it.

  Your TOK teacher knew this was a rabbit hole. The "truth" of a relationship isn't found in the actions; it's found in the intersubjective agreement. Until Maya and Ethan speak the words, the reality literally does not exist.
