answer: |-
  Good evening. For those who don't know me, I'm a friend of Mara's. I write about science and ideas for a living, which is apparently why I'm standing here today. Mara told me she wanted a toast that engaged with the ideas behind this marriage, rather than just the sentiment. Which is very on-brand for her.

  If you picked up the wedding program, you saw the epigraph. It's from Bertrand Russell. Specifically, his 1929 book *Marriage and Morals*. For the half of the room who just nodded politely at that title: Russell was a philosopher who argued that sexual jealousy is not a law of nature, but a habit of mind. He suggested that a rational, secure couple could unlearn possessiveness, and that the longevity of a marriage depends more on intellectual companionship and honesty than on strict, policed exclusivity.

  For the half of the room currently suppressing a smile: Yes, I know exactly what text they are invoking.

  Now, usually, when people model their relationship on a philosopher, it's a bit risky. Philosophers are great at thinking about love; they are often statistically average at doing it. And Bertrand Russell is the cautionary tale to end all cautionary tales. His own attempt to live out these theories with his second wife, Dora, collapsed in a very public, very human mess of jealousy and recrimination. Russell wrote the manual on overcoming possessiveness, and then famously failed to read it himself.

  I mention this not to cast a shadow, but to highlight the courage of what Mara and [Partner's Name] are doing.

  It is easy to build a marriage on convention. You follow the script written by your parents, your religion, or your culture. The script is pre-approved. The guardrails are up. You don't have to think about *why* you're doing what you're doing; you just do it.

  It is much harder to build a marriage on intention. To look at the default settings of human relationships and say, "We're going to examine these. We're going to keep what works, discard what doesn't, and write our own code." That requires a level of communication that most of us never attempt. It requires radical honesty. It requires checking your ego at the door. And yes, it admits the risk that Russell found: that we are human beings, and habits are sticky.

  But here is the difference between Russell and this couple. Russell was a solitary genius who often treated his partners as subjects in his experiment. Mara and [Partner's Name] are a team. I have watched them navigate difficult conversations over the last few years. I have seen them choose transparency when secrecy would have been easier. I have seen them prioritize each other's growth over their own comfort.

  They aren't trying to be Bertrand Russell. They are trying to be the best version of Mara and [Partner's Name]. They know the history. They know the statistics. They know that the theory is fragile. And they are entering this marriage with their eyes wide open, not looking for a guarantee, but making a promise.

  The promise isn't that they will never feel a flicker of jealousy. The promise is that when they do, they won't let it drive the car. The promise is that they value the truth of their connection more than the appearance of it.

  To the family and friends who might be wondering if this is all too complicated: Look at them. Really look at them. The theory is abstract, but the love is concrete. The way they look at each other across the room isn't a philosophical proposition. It's a fact. They have built a foundation of trust so deep that they don't need to build walls to protect it.

  And to the philosophers in the back: Yes, we know the irony. But we also know that science advances by testing hypotheses, even the ones that failed before. Mara and [Partner's Name] are not repeating history; they are iterating on it.

  So, let's raise a glass.

  To Mara and [Partner's Name]. May your arguments be fruitful, your honesty be kind, and your love be large enough to hold the truth of who you are. May you be rational when you can be, and forgiving when you must be. And may you always remember that while Russell had the theory, you two have something he didn't: each other.

  To the happy couple.
