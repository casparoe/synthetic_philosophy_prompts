  1.  **Analyze the Request:**
      *   **Speaker:** A science/ideas writer (friend of the bride).
      *   **Occasion:** Wedding toast for Mara (bride) and her fiancé (let's call him Alex for now, or keep it generic/partner-focused).
      *   **Key Theme:** The couple's marriage is inspired by Bertrand Russell's *Marriage and Morals* (specifically, overcoming sexual jealousy, rational unpossessiveness, strict exclusivity isn't everything).
      *   **Audience Split:**
          *   50% Philosophy Dept: Know Russell, know his marriage to Dora failed despite his theories. Expect intellectual honesty.
          *   50% Family/Grandparents: Don't know Russell, might be scandalized by "open marriage" talk. Need warmth and reassurance.
      *   **Tone:** Warm, honest, light (not solemn), an act of love (not a lecture/warning).
      *   **Length:** About 5 minutes (roughly 750-900 words spoken at a moderate pace).
      *   **Specific Requirement:** Include one light moment admitting Russell failed to live by his theory, without making it a doom-and-gloom warning.

  2.  **Determine the Angle:**
      *   *The Trap:* If I focus too much on the theory, I bore the family. If I ignore the theory, I insult the philosophers. If I highlight Russell's failure too heavily, it becomes a bad omen.
      *   *The Solution:* Frame Russell's ideas not as a rulebook they are copying, but as a shared language or a starting point for *their* specific conversation. The toast should celebrate their *honesty* and *communication* rather than the specific mechanics of their relationship structure. The "failure" of Russell becomes a humanizing anecdote about how hard love is, regardless of the philosophy, which makes Mara and her partner's success even more impressive.
      *   *The "Open Marriage" Elephant:* I need to acknowledge the Russell reference without explicitly saying "They have an open marriage" to the grandparents. Use phrases like "radical honesty," "redefining possession," or "trusting the bond over the rules." The philosophers will get it; the family will hear "strong communication."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor. Establish the relationship (writer/friend). Set a warm tone.
      *   **The Russell Connection:** Introduce the epigraph/theme. Explain it simply for the family, specifically for the philosophers. Frame it as "intellectual bravery."
      *   **The Pivot (The Russell Failure):** This needs to be light. "Russell was a genius, but he was also a guy." Don't dwell on the scandal, dwell on the humanity.
