answer: |-
  **MEMORANDUM**

  **TO:** State Gaming Board, Full Committee
  **FROM:** Voluntary Self-Exclusion Review Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Petition #492 (Reinstatement from Lifetime Self-Exclusion)

  ### **I. Executive Summary & Recommendation**

  After reviewing the evidence presented in Petition #492, conducting an interview with the petitioner, and deliberating on the broader implications for the State Self-Exclusion Program, the Panel submits the following recommendation:

  **The Panel recommends the Board DENY the petition for reinstatement.**

  The petitioner shall remain on the Lifetime Self-Exclusion List indefinitely. This decision is not a reflection on the petitioner's current character or stability, but rather a defense of the integrity of the "Lifetime" designation within our exclusion framework. However, recognizing the ethical weight of this decision, the Panel further recommends the Board initiate a policy review within the next 90 days to determine if a separate, distinct "Hardship Review" pathway should be created for future lifetime enrollees, independent of the current petition process.

  ### **II. Case Background**

  The petitioner enrolled in the State Self-Exclusion Program 11 years ago following significant financial and personal devastation, including the loss of his primary residence and maxed-out credit lines. At the time of enrollment, the petitioner was presented with two statutory options: a 5-Year Exclusion or a Lifetime Exclusion.

  The petitioner explicitly selected the **Lifetime Exclusion**. His written intake statement from that date includes the following declaration: *"I am choosing lifetime because I do not trust future me for one second. I want this to be impossible to undo, even by me."*

  Eleven years later, the petitioner petitions for reinstatement. Evidence provided includes:
  *   Proof of steady employment for 6+ years.
  *   Documentation of all gambling-related debt being satisfied.
  *   Proof of marriage and stable housing.
  *   A letter from a licensed counselor attesting to no current signs of compulsive gambling behavior.

  The petitioner's central argument is that the Lifetime ban functions as a "permanent life sentence" based on a decision made during a crisis, and that his demonstrated rehabilitation renders the ban unnecessary and punitive.

  ### **III. Panel Deliberation & Conflicting Viewpoints**

  The Panel was evenly divided on this matter, reflecting the genuine difficulty of balancing compassion with regulatory integrity.

  **The Argument for Reinstatement (Minority View)**
  Half of the Panel argued that the primary goal of the Self-Exclusion Program is harm reduction, not punishment. If the harm has been demonstrably reduced and the individual has rehabilitated, continuing the ban serves no protective function. This view holds that treating a decision made during a mental health crisis as irrevocable ignores the reality of recovery. To deny a stable, recovered individual simply because of a signature from 11 years ago risks turning a protective tool into a punitive measure. As the petitioner noted, individuals who chose the 5-year option are automatically reinstated regardless of their current state; it seems inequitable that a "better" outcome (recovery) is penalized more harshly than the expiration of a term.

  **The Argument for Denial (Majority View)**
  The majority of the Panel argues that the "Lifetime" option exists specifically to remove the possibility of the exact scenario we are facing now. The core mechanism of self-exclusion is *pre-commitment*. It relies on the logic that the "present self" must protect the "future self" from the "addicted self."

  By choosing Lifetime over 5-Year, the petitioner explicitly acknowledged that his future judgment might be compromised by addiction, even if he appeared stable. He requested a barrier that he could not dismantle. If the Board grants reinstatement because he is currently "stable," we are validating the very optimism his past self identified as a risk factor. Furthermore, granting this petition undermines the credibility of the Lifetime option for all other enrollees. If "Lifetime" is reviewable after 11 years based on good behavior, it effectively becomes a "10+ Year" option. This dilutes the safety net for those who rely on the absolute nature of the ban to keep them safe.

  ### **IV. Rationale for Recommendation**

  While the Panel acknowledges the petitioner's impressive rehabilitation and shares the desire to reward positive life changes, we must prioritize the integrity of the program's design.

  **1. Agency and Pre-Commitment**
  To grant this petition is to override the specific agency the petitioner exercised 11 years ago. He did not simply sign up for a ban; he signed up for a ban *without an exit clause*. He identified that "trusting future me" was the specific vulnerability that led to his ruin. By petitioning to return now, he is asking us to trust the "future me" he explicitly warned us about. The Panel believes respecting his past autonomy requires honoring the strict boundaries he set for himself, even if his current self finds them burdensome.

  **2. Program Integrity**
  The Self-Exclusion Program relies on trust. Casinos must trust that the list is enforced; enrollees must trust that the list will hold them when their willpower fails. If the Board establishes a precedent that Lifetime bans can be overturned by evidence of stability, we introduce ambiguity. An addicted individual currently considering the Lifetime option might hesitate, thinking, "If I get clean for a decade, I can get back in." That hesitation is dangerous. The Lifetime option must remain the "nuclear option"—absolute and final—to serve its intended purpose.

  **3. Distinction Between Punishment and Protection**
  The petitioner argues the ban is now punitive. The Panel disagrees. A punishment is imposed *against* a person's will for a wrongdoing. This exclusion was requested *by* the person *for* their protection. The discomfort of the ban is not a bug; it is the feature. The fact that it is difficult to reverse is what makes it effective.

  ### **V. Addressing the Counter-Argument**

  We do not make this recommendation lightly, and we must genuinely wrestle with the Minority View's concern regarding the "permanent life sentence." It is deeply uncomfortable to tell a recovered individual that they cannot access a legal activity simply because they once asked to be barred from it. The inequity between the 5-Year and Lifetime enrollees is palpable.

  However, the solution to this discomfort cannot be to retroactively alter the terms of the contract this specific petitioner signed. To do so would solve his problem while potentially creating risk for others. The "unfairness" of the Lifetime ban is inherent to its design; it is designed to be unfair to the addiction, even at the cost of being unfair to the recovered individual. If the Board feels that *no* path to reinstatement should exist for Lifetime enrollees under *any* circumstances, that is a policy decision for the full Board to codify. But until a new policy is written, we cannot bend the existing rules for a sympathetic case without compromising the rule of law governing the list.

  ### **VI. Proposed Timeline & Next Steps**

  1.  **Immediate Action:** The Board is requested to vote on this Denial Recommendation by **November 30, 2023**. Upon approval, the petitioner will be notified that his status remains unchanged.
  2.  **Petitioner Notification:** A formal letter will be sent to the petitioner within 5 business days of the Board vote, acknowledging his rehabilitation efforts while explaining the regulatory constraints regarding the Lifetime designation.
  3.  **Policy Review Referral:** Concurrent with this denial, the Panel refers the issue of "Lifetime Exclusion Irrevocability" to the Board's Policy Committee. We recommend a review period of **90 days** to assess whether a separate, high-bar "Hardship Waiver" should be legislatively created for future Lifetime enrollees. This ensures that if the state wishes to offer a path back, it is done through clear, prospective legislation, not retroactive precedent.

  ### **VII. Conclusion**

  This is a case where doing the "kind" thing for the individual may be the "harmful" thing for the system designed to protect people like him. The petitioner has won his battle against gambling, but the contract he signed to ensure that victory was designed to be permanent. The Panel recommends we honor that contract.

  **Respectfully Submitted,**

  The Voluntary Self-Exclusion Review Panel
