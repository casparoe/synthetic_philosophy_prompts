      *   No hedging? Yes.

  *(Self-Correction during final polish)*: I need to make sure I don't sound cold. The death of the boy is real. I must acknowledge that while *culpability* is equal, the *moral situation* is not. The second soldier has a debt the first does not. But debt $\neq$ guilt. I will clarify this distinction.

