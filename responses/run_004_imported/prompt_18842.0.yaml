answer: |-
  This is a spectacular connection. You have identified a structural isomorphism between the 2006 IAU resolution and the *Baima Lun* (White Horse Dialogue) that most philosophers of science miss because they are too busy arguing about orbital dynamics.

  If you plop Gongsun Long (c. 320–250 BCE) into the Prague convention center in 2006, he wouldn't side with the angry public, nor would he simply cheer for the IAU. He would likely dismantle the entire proceeding on the grounds of **Zhengming (The Rectification of Names).**

  Here is how Gongsun Long would argue the case, using his specific logic of attributes and designations, and what that reveals about whether his "sophistry" is actually a profound insight into taxonomy.

  ### 1. The Logic of Attributes (Xing) vs. The Logic of Sets
  First, we have to clear up a common misconception about Gongsun Long. He wasn't arguing that a white horse doesn't belong to the biological species *Equus ferus caballus*. He was arguing about **concepts**.

  His argument goes:
  *   "Horse" designates the **form** (shape/structure).
  *   "White" designates the **color** (attribute).
  *   "White Horse" designates **form + color**.
  *   Therefore, the concept "White Horse" is not identical to the concept "Horse."

  He proves this by demand: If you ask for a "horse," a yellow or black one suffices. If you ask for a "white horse," a yellow one is rejected. Since the set of acceptable responses differs, the names are not equivalent.

  **Gongsun Long at the IAU:**
  He would look at the IAU's three criteria for a "Planet":
  1.  Orbits Sun.
  2.  Hydrostatic equilibrium (Round).
  3.  Clears the neighborhood.

  Then he looks at "Dwarf Planet":
  1.  Orbits Sun.
  2.  Hydrostatic equilibrium (Round).
  3.  **Does NOT** clear the neighborhood.

  Gongsun Long would nod approvingly at the IAU's conclusion: **"A Dwarf Planet is not a Planet."**

  He would say: *"You have correctly identified that the concept 'Planet' requires the attribute of 'Clearing.' The concept 'Dwarf Planet' lacks this attribute. Therefore, just as a White Horse (Form + Color) is not a Horse (Form), a Dwarf Planet (Form + Non-Clearing) is not a Planet (Form + Clearing). You have successfully distinguished the specific from the general."*

  At this point, the IAU members would breathe a sigh of relief. Finally, an ancient philosopher validates their resolution!

  ### 2. The Trap of the Compound Name
  But then Gongsun Long would drop the hammer. His philosophy wasn't just about logic puzzles; it was about social order. He believed that if names do not match realities (*Ming* does not match *Shi*), language becomes dysfunctional, and governance collapses.

  He would turn to the IAU and ask: **"If a Dwarf Planet is not a Planet, why does the name contain 'Planet'?"**

  In the *White Horse Dialogue*, "White" is an **additive** attribute. It adds specificity to the horse.
  In the IAU definition, "Dwarf" functions as a **subtractive** attribute regarding the definition of "Planet." It removes the defining characteristic (clearing the neighborhood) while retaining the noun.

  Gongsun Long would argue:
  *"In common usage, 'Dwarf Star' is a Star. 'Dwarf Hamster' is a Hamster. The modifier 'Dwarf' implies a subset. By coining 'Dwarf Planet' but insisting it is not a 'Planet,' you have created a name that contradicts its own reality. You are using the name 'Planet' to designate something that is not a 'Planet.' This is the definition of confused naming."*

  He would likely suggest that if the IAU wanted to be logically consistent with the *White Horse* model, they should have done one of two things:
  1.  **Admit the Subset:** Acknowledge that "Planet" refers only to Shape + Orbit, and "Major Planet" vs. "Dwarf Planet" are the specific categories. (This keeps the name honest).
  2.  **Change the Name:** If "Clearing the Neighborhood" is the essential "Form" of a Planet, then Pluto lacks that Form. To call it a "Dwarf Planet" is like calling a cow a "White Horse" because it is white and four-legged, but then insisting "A White Horse is not a Horse."

  ### 3. The Verdict on Sophistry
  So, does this expose Gongsun Long as a trickster, or does it show he was onto something real?

  **It validates his insight.**

  The Pluto controversy proves Gongsun Long's central thesis: **Categorization is not discovered; it is legislated.**

  The angry emails you receive are the direct result of *Ming* (Name) clashing with *Shi* (Reality).
  *   **The Public's Ming:** "Planet" = Big round thing orbiting the sun. (Based on historical usage 1930–2006).
  *   **The IAU's Shi:** "Planet" = Dynamically dominant body.
  *   **The Conflict:** The IAU tried to change the *Shi* (the scientific definition) but kept a confusing *Ming* ("Dwarf Planet").

  Gongsun Long would argue that the IAU committed a political error, not just a scientific one. By creating a category called "Dwarf Planet" and then denying it the status of "Planet," they created a linguistic paradox that guaranteed public outrage. They tried to pull a *White Horse* maneuver (distinguishing the compound from the root) but failed to realize that in language, the compound usually inherits the root's ontology.

  ### 4. Why This Matters for Your Reporting
  If Gongsun Long were analyzing your beat, he would tell you that the anger isn't about Pluto. It's about the **Rectification of Names.**

  When scientists say, "It's not a planet," they are talking about dynamical dominance (the "Clearing" attribute). When the public hears, "It's not a planet," they hear, "It is not a member of the category we were taught."

  Gongsun Long would say the IAU tried to have it both ways. They wanted the precision of the "White Horse is not a Horse" distinction, but they wanted to keep the linguistic prestige of the word "Planet" attached to Pluto (hence "Dwarf *Planet*").

  **The "Sophistry" is Real:**
  Gongsun Long is often dismissed as a semantic trickster. But the Pluto saga shows he was right: **Definitions are power.**
  *   If "Planet" includes Pluto, we have 100+ planets (hard to teach, dilutes the "VIP" status of the 8).
  *   If "Planet" excludes Pluto, we preserve the "VIP" status but break the linguistic contract with the public.

  The IAU tried to solve a scientific problem (orbital dynamics) with a linguistic solution (naming), and they did it clumsily. Gongsun Long would have advised them: *"If you wish to exclude the Dwarf, do not give it the Name. If you give it the Name, do not exclude it from the Category. To do both is to invite chaos."*

  ### Summary
  Gongsun Long would agree with the IAU's **logic** (A specific set of attributes is not identical to a general set) but condemn their **nomenclature** (Using a name that implies inclusion while enforcing exclusion).

  He would tell you that the "sophistry" isn't a trick; it's a warning. Language shapes reality. When you change the definition of a word without changing the word itself, you don't just change science; you break the social contract of communication. The angry emails you get? That's the sound of *Ming* and *Shi* colliding. Gongsun Long would tell you to keep reporting on it, because the controversy isn't about ice and rock; it's about who has the authority to name the world.
