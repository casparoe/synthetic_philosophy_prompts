          *   *Key phrase:* "Structure-preserving surrogate."

      *   **Section 5: Addressing the "Convenient Fiction" Objection.**
          *   Is it still just a description? No, because the *causal efficacy* depends on the *structure*. If the representation weren't there, the specific pattern of generalization (legal moves from impossible states) wouldn't happen. The explanatory power lies in the representational content, not just the weights.

