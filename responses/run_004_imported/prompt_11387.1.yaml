answer: |-
  **New York City, late 1927. A booth at a quiet table, removed from the clatter of the Automat. Two cups of coffee sit cooling between them.**

  **Lippmann:** You've written a generous book, John. I'll grant you that. But generosity doesn't solve the problem of scale. When I write about the "omnicompetent citizen," I'm not insulting the worker or the shopkeeper. I'm describing a physical impossibility. The modern state deals with tariffs, treaties, industrial processes that span continents. How is a man who spends his day at a lathe supposed to judge the nuance of a reparations plan? He can't. He *won't*. To insist he must is to guarantee government by ignorance.

  **Dewey:** You mistake my argument, Walter. I'm not calling for every man to be a secretary of state. My complaint isn't that the citizen lacks knowledge; it's that the public lacks visibility. You say the citizen is incompetent. I say the public is currently eclipsed. When people cannot trace the indirect consequences of their transactions—when a factory closing in Ohio feels like a storm from nowhere rather than the result of specific decisions—that is when the public disappears. It's not a lack of IQ; it's a lack of connection.

  **Lippmann:** But the connection is severed by the very nature of the signal. The news arrives pre-digested. We live in a pseudo-environment, pictures in our heads shaped by stereotypes and censorship. By the time a issue reaches the voter, it's already been simplified into a slogan. If you build a democracy on the expectation that the voter can pierce that veil, you're building on sand. My "Phantom Public" isn't a dismissal; it's a relief valve. Let the insiders manage the details. Let the public merely intervene when things go visibly wrong.

  **Dewey:** And who decides when things go wrong? That's the crux. If you relegate the public to merely cheering or booing the experts, you strip democracy of its moral ground. You treat governance as a technical problem, like fixing an engine. But politics is about values, about ends, not just means. If the public cannot inquire into the ends, if communication is blocked by the very press you describe, then the experts will serve their own interests, not the common good. You're proposing a trusteeship, Walter.

  **Lippmann:** I'm proposing realism! Look at the alternative. You want to socialize inquiry. You want "The Great Community." But community requires shared understanding, and the machinery of modern life grinds that into dust. The division of labor applies to knowledge just as it does to steel production. We need a specialized class of analysts—bureaucrats, scientists—to navigate the unseen environment. If you force the average man to carry the burden of the whole, you don't get engagement. You get apathy or demagoguery. He'll follow the strongest voice because he lacks the tools to verify the facts.

  **Dewey:** Precisely! He lacks the tools. So we build them. You accept the distortion of the press as a fixed condition. I see it as a challenge to the arts of communication. If the indirect consequences are invisible, our task is to make them visible. Not through propaganda, but through inquiry that is socialized. Science has learned to collaborate; why not politics? The danger isn't that the citizen is a sheep. The danger is that the conditions for becoming a public are suppressed by the very complexity you cite. If you hand it all to the insiders, you kill the only mechanism we have for correcting the insiders' values.

  **Lippmann:** But time is short, John. The crises don't wait for the community to convene. When a bank fails or a border is crossed, action is required immediately. Your method requires a slow accretion of understanding. Mine accepts that someone must decide *now*. I'd rather they decide with access to the best data available, even if that data is confined to a few minds, than pretend the data is accessible to all. It's better to have a competent minority than an incompetent majority pretending at sovereignty.

  **Dewey:** Competent for what? Efficiency? Stability? Yes. But democracy isn't a machine for efficiency. It's a mode of associated living. If you remove the need for the public to understand its own life, you atrophy the capacity for judgment. You create a society of spectators. I'm willing to admit the public is currently lost. I'm not willing to admit it should stay lost. The remedy isn't to lower the standard of citizenship to match the broken communication; it's to fix the communication to meet the ideal.

  **Lippmann:** *[Leans back, tapping the rim of his cup]* You have faith in the potential of human association that I simply cannot find in the evidence. I see the pictures in their heads, and I see how easily they are manipulated. I fear your Great Community becomes a great mob because you refuse to acknowledge the limits of human attention.

  **Dewey:** And I fear your specialized class becomes a closed caste because you refuse to acknowledge the necessity of public consent. We agree the world is too complex for the old town-meeting model. But you solve it by shrinking the public. I solve it by expanding the means of inquiry.

  **Lippmann:** Then I suppose we wait to see which breaks first. The complexity, or the hope.

  **Dewey:** *[Smiles faintly]* Or whether we can bear the weight of making the public visible again. Pass the sugar, Walter.

  **[The waiter arrives to clear the plates. The argument remains unfinished, suspended in the noise of the city outside.]**
