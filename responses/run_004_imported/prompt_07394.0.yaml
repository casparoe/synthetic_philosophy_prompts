answer: |-
  Your classmate has presented a sophisticated argument that touches on a genuine tension in normative ethics, often discussed under the headings of "epistemic limitations" or "demandingness." However, the claim that computational complexity theory *refutes* act utilitarianism (AU) rests on a category error regarding what moral theories are supposed to do, as well as a conflation of two distinct concepts within utilitarian thought.

  Most contemporary utilitarians are not persuaded by this argument for four primary reasons: the distinction between **criteria of rightness and decision procedures**, the shift from **objective to subjective expected utility**, nuances in **complexity theory itself**, and the **function of normative theory**.

  Here is a breakdown of why the argument fails to refute the theory.

  ### 1. Criterion of Rightness vs. Decision Procedure
  The most fundamental flaw in your classmate's argument is the conflation of the *criterion of rightness* with a *decision procedure*.

  *   **Criterion of Rightness:** This defines what *makes* an action right or wrong. For the act utilitarian, an act is right if and only if it maximizes utility. This is a metaphysical or semantic claim about the truth conditions of moral statements.
  *   **Decision Procedure:** This is the method an agent uses to decide what to do.

  Your classmate's argument assumes that for a moral theory to be valid, the agent must be able to *compute* the criterion in real-time. However, standard utilitarianism (following J.S. Mill and later J.J.C. Smart) explicitly denies this. They argue that the criterion of rightness can be true even if agents cannot directly calculate it.

  **Analogy:** In chess, the "criterion of rightness" for a move is "the move that leads to a forced checkmate in the fewest moves." However, chess is computationally intractable for humans (and arguably for computers in the full game tree). Does this mean the concept of a "best move" is refuted? No. It simply means humans must use heuristics (decision procedures) to approximate the best move. Utilitarians argue we should use moral heuristics (rules of thumb, common sense morality) to approximate the maximization of utility, even if we cannot calculate the utility directly.

  ### 2. Objective vs. Subjective (Expected) Utilitarianism
  Your classmate's argument attacks **Objective Act Utilitarianism**, which holds that you ought to do what *actually* produces the best outcome. Many contemporary utilitarians, acknowledging epistemic limits, adopt **Subjective** or **Expected Utility Utilitarianism**.

  Under this view, the right action is not the one that *actually* maximizes welfare (which requires omniscience), but the one that maximizes *expected* welfare given the evidence available to the agent.
  *   **The Complexity Shift:** Calculating expected utility based on known probabilities is often computationally distinct from calculating the deterministic outcome of a chaotic system. While still complex, it shifts the burden from "predicting the future" to "rational betting based on current data."
  *   **The Refutation Fails:** If the theory is defined as "maximize expected utility," the fact that the *actual* future is NP-hard to predict becomes irrelevant. The theory is no longer making a claim about the causal future, but about the rationality of the choice given current information.

  ### 3. Nuances in Computational Complexity
  Even if we grant that moral calculation is an optimization problem, your classmate's application of complexity theory is slightly too blunt for the context of ethics.

  *   **Worst-Case vs. Average-Case:** NP-hardness refers to *worst-case* scenarios. It proves that there exist instances of the problem that cannot be solved efficiently. It does not prove that *all* instances (or the specific instances humans encounter) are intractable. Real-world moral dilemmas may structurally resemble "easy" instances of NP-hard problems.
  *   **Approximation Algorithms:** In computer science, when a problem is NP-hard, we often look for approximation algorithms that find a solution "close enough" to the optimum in polynomial time. Utilitarians argue that moral heuristics function exactly this way. We don't need the *global* maximum to be moral; we need to do significantly better than random chance or malice.
  *   **The $P \neq NP$ Assumption:** The argument relies on the assumption that $P \neq NP$. While widely believed, this is unproven. Basing a philosophical refutation on an unproven conjecture in mathematics is risky.

  ### 4. The Function of Normative Theory
  Finally, your classmate compares AU to a scientific theory that makes no determinate predictions. This is a category error regarding the purpose of normative ethics.

  *   **Evaluation vs. Guidance:** Scientific theories are primarily descriptive and predictive. Normative theories are primarily evaluative. AU serves as a standard by which we can *judge* actions, even if the agent couldn't calculate the judgment at the time.
  *   **The "Ought Implies Can" Objection:** A common counter-argument is "Ought implies Can." If I cannot calculate the best action, I cannot be obligated to do it. However, most philosophers interpret "Can" as **physical possibility**, not **epistemic certainty**. If the best action is physically possible for me to perform, the obligation stands, even if I am unsure which action it is. My uncertainty affects my *blameworthiness*, not the *rightness* of the act.

  ### Summary
  Your classmate's argument is a powerful critique of **Objective Act Utilitarianism as a practical decision guide**, but it does not refute it as a **theory of moral truth**.

  Utilitarians continue to treat AU as a live theory because:
  1.  They distinguish between what makes an act right (the criterion) and how we find it (the procedure).
  2.  Many have modified the theory to focus on *expected* utility rather than *actual* utility.
  3.  They view moral theory as a standard for evaluation, not necessarily an algorithm for agents.

  The complexity argument successfully shows that AU is **epistemically demanding**, but it does not show that the theory is **logically incoherent** or **metaphysically false**. It suggests we need a robust theory of moral heuristics to accompany our theory of moral truth, which is exactly what most contemporary utilitarians propose.
