answer: |-
  The discovery of Gottlob Frege's 1924 diary by Michael Dummett remains one of the most jarring episodes in the historiography of philosophy. For decades, Frege stood as the austere, disembodied godfather of analytic philosophy, a man whose *Begriffsschrift* seemed to emerge from a realm of pure reason, untouched by the vicissitudes of history. The diary, however, revealed a bitter reactionary who advocated for the stripping of Jewish political rights, the suppression of women and socialists, and expressed admiration for Hitler and Ludendorff. For a long time, the standard scholarly response, exemplified by Richard Mendelsohn, was to treat these writings as a tragic but philosophically inert biographical footnote. The argument was that Frege's logical achievements, like a mathematician's theorems, remained valid regardless of the moral character of their author.

  However, recent scholarship, particularly the work of Stephen D'Arcy, challenges this firewall. D'Arcy argues that Frege did not merely hold prejudiced views alongside his logical work; he actively mobilized his logical apparatus to justify them. Frege applied the logic of genealogical sequences—the ancestral of a relation—to argue for rights based on descent. He worried that antisemitic legislation would fail if racial predicates lacked the sharp boundaries demanded by his conceptual notation. He entrusted these writings to his son, believing they represented a vital contribution to political science. In light of this, we cannot sustain the view that Frege's politics are biographically damning but philosophically inert. The verdict must be that Frege's political writings give us genuine philosophical reason to reassess the motivations and specific doctrines of his logical work, specifically the demand for sharp boundaries and the claim to topic-neutrality. While this does not invalidate the formal theorems of the *Begriffsschrift*, it dismantles the myth that analytic philosophy was born in a vacuum of pure rationality.

  To understand why this reassessment is necessary, we must look at how Frege's political reasoning mirrors his logical constraints. The core of Frege's logic is the requirement that concepts be sharply defined; for any object, it must be determinate whether it falls under a concept or not. This is the law of excluded middle codified into semantic theory. In his political writings, Frege transposes this logical requirement into a legislative one. He expresses anxiety that without biologically precise definitions of "Jewishness," laws restricting rights would be unworkable. Here, the logical demand for precision is not serving the clarification of thought for the sake of truth; it is serving the mechanics of exclusion. The "sharp boundary" is no longer just a safeguard against paradox; it becomes a tool for social purification.

  If Frege reaches for his logical machinery to solve political problems, he is implicitly claiming that the structure of logic is isomorphic with the structure of the social order. This undermines the claim of topic-neutrality. If logic is truly topic-neutral, it should have no purchase on the substantive content of political rights. Yet, Frege treats the logic of the ancestral (the formalization of "x is an ancestor of y") as a template for genealogical rights. This suggests that for Frege, logic was not merely a formal skeleton but a normative ideal for how the world *ought* to be ordered. The motivation for developing a system that eliminates vagueness may not have been solely the foundational crisis of mathematics; it may have been driven by a deeper, ideological horror of ambiguity and mixture. Therefore, when we teach the doctrine of sharp boundaries, we must acknowledge that this doctrinal commitment carries an ideological weight. It is not merely a technical requirement for bivalence; it is an expression of a worldview that privileges order over fluidity, and exclusion over ambiguity.

  Defenders of the "inert" view might argue that this is a category error. They would claim that Frege simply misapplied his logic to politics, much as a brilliant physicist might hold superstitious beliefs about health. On this view, the *Begriffsschrift* remains a triumph of abstract reasoning, untainted by its author's misuse of it in the empirical realm. Mendelsohn suggests that linking the two is tendentious. However, this defense relies on a strict separation between "context of discovery" and "context of justification" that Frege himself would likely reject. Frege was a Platonist; he believed logical laws were laws of truth, governing both thought and reality. If the laws of truth are used to legislate who counts as a citizen, the connection is not accidental. The "mathematician's vice" analogy fails because logic, for Frege, was not just calculation; it was the structure of rationality itself. If that structure is weaponized to dehumanize, we are obligated to ask if the structure itself encourages such weaponization. Does a logic that admits no vagueness inherently favor authoritarianism? We need not answer "yes" definitively to admit that the question is no longer dismissible. The motivation for the logic is compromised, even if the derivation of theorems is not.

  This brings us to the comparison with Martin Heidegger, whose involvement with National Socialism is often taken to have a more straightforwardly affirmative connection to his philosophy. In Heidegger's case, the consensus is often that his philosophy is complicit because his ontology is historically situated. *Being and Time* speaks of destiny, heritage, and the "they," concepts that can be easily co-opted by völkisch ideology. Because Heidegger's philosophy is about the historical existence of Dasein, his political choices appear as an existential enactment of his philosophical categories. The contamination is ontological.

  The Frege case is distinct but equally damaging to the self-image of the tradition. Analytic philosophy has defined itself in opposition to the Continental tradition, often claiming a mantle of scientific neutrality and logical purity that Heidegger lacked. The Heidegger scandal is viewed as a failure of existential judgment within a hermeneutic philosophy. The Frege scandal, however, strikes at the heart of the analytic claim to ahistorical objectivity. If Heidegger's philosophy is "infected" because it is too historical, Frege's is "infected" because it pretends not to be. The reassessment required for Frege is arguably more radical for analytic philosophy than Heidegger's is for phenomenology. For Heideggerians, the politics confirm the danger of the philosophy's historical engagement. For Fregeans, the politics reveal that the claim to disengagement was a fiction. The connection in Frege is not that his logic *entails* fascism, but that his *conception* of logic—as a tool for imposing rigid order on a messy world—shares a structural affinity with his fascism. While Heidegger's philosophy was appropriated by the Nazis, Frege's philosophy was *used* by Frege as a Nazi. This active deployment makes the connection philosophically inert only if we accept that logic has no normative force over the world, a claim Frege denied.

  Therefore, the verdict is that we must reassess Frege's logical work, not by discarding his theorems, but by recontextualizing his doctrinal motivations. We can no longer teach the demand for sharp boundaries as a purely technical virtue without acknowledging its potential for ideological hardening. We can no longer present the origins of analytic philosophy as a clean break from the irrationalities of the 19th century. The formal validity of the *Begriffsschrift* survives, but its claim to pure topic-neutrality does not. The logic remains a powerful tool, but we now know it was forged in a fire that sought to burn away human ambiguity.

  This reassessment does not require us to cancel Frege, but it does require us to stop treating him as a disembodied mind. The "mathematician's vice" defense is a comfort we can no longer afford. If the tools of analytic philosophy can be pressed into the service of exclusion by its founder, they can be so pressed by us. The lesson of the diary is not that logic is fascist, but that the drive for logical perfection can be motivated by a fear of the messy, heterogeneous reality of human life. In the seminar, this means reading the *Begriffsschrift* not just as the birth of modern logic, but as a document of a specific, troubled historical moment. We must acknowledge that the clarity Frege sought was, for him, a form of control. By admitting this, we do not diminish his genius, but we humanize it, and in doing so, we accept responsibility for the tools he left us. The connection is philosophically significant because it forces us to recognize that the standards of rigor we inherit are not value-free. They are the legacy of a man who wanted a world as precise and unforgiving as his functions. We may keep the logic, but we must leave behind the desire for the kind of world he wanted to build with it.
