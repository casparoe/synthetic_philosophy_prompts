  10. **Final Polish:** Ensure the distinction between ID (which claims design is detectable and science) and Popper's view (which claims Darwinism is science, just needed refinement) is sharp. ID uses Popper to say "Darwinism isn't science." Popper eventually said "Darwinism *is* science." That's the clincher.

