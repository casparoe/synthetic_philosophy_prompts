      *   Problem with Darwinism (initially): It seemed to explain *everything* post-hoc but predict *nothing* specific beforehand. "Survival of the fittest" seemed circular (Who are the fittest? Those who survive. Who survives? The fittest).

  3.  **Address Question 1: Popper's Original Objection (*Unended Quest* & earlier works):**
      *   *Unended Quest* (1976) is an intellectual autobiography. It reflects views held earlier (1940s-60s).
      *   The core objection: Natural selection was viewed as a *tautology*.
      *   Quote context: Popper classified it as a "metaphysical research programme."
      *   Meaning: It's a useful framework for generating scientific theories, but the core statement itself isn't empirically testable in isolation. It lacks predictive power.
      *   Nuance: Popper *never* denied evolution happened. He doubted the *scientific status* of the *mechanism* (natural selection) as he understood it at the time.

  4.  **Address Question 2: The 1978 *Dialectica* Paper:**
      *   Title: "Natural Selection and the Emergence of Mind."
      *   Key shift: Popper admits he was wrong to call it a tautology.
      *   Why? He realized that "fitness" can be defined *independently* of survival (e.g., physiological traits, ecological niche analysis).
      *   He acknowledges it *is* testable.
      *   *Crucial Nuance:* He still maintains some reservations. He calls it a "metaphysical research programme" *in a positive sense* (like a paradigm), but affirms its testability. He doesn't say "I was 100% wrong about everything," but rather "My characterization of it as untestable was wrong."
      *   He distinguishes between the *logic* of the theory and its *application*.

  5.  **Address Question 3: Distinguishing Mechanism vs. Historical Claim:**
      *   *Evolution as History:* "Life changed over time." This is a singular historical narrative. Popper was always okay with this as a factual claim, though historical sciences are different from experimental sciences.
      *   *Natural Selection as Mechanism:* "Traits propagate due to differential reproductive success." This is the universal law-like claim.
      *   Does this distinction solve the tension? Yes, largely. Popper's worry was about the *universal law* status of natural selection. If treated as a historical explanation for specific events, it's more testable. If treated as a tautological law, it's not.
      *   Modern synthesis: We define fitness independently (biomechanics, genetics), making the mechanism testable.

  6.  **Address Question 4: Does the Original Worry Survive?**
      *   Yes, in a philosophical sense.
      *   The "tautology" worry pops up when definitions are sloppy.
      *   The "predictive power" worry: Evolutionary biology is often retrospective (explaining what happened) rather than prospective (predicting exactly what will evolve). This is a feature of historical sciences, not necessarily a bug, but it fits Popper's worry about "research programmes."
