answer: |-
  This is a sophisticated objection that cuts to the meta-ethical assumptions underpinning the economic analogy in normative ethics. It challenges the commensurability of moral value across different normative frameworks. Below, I articulate the strongest form of this "Motive-Sensitivity Objection," survey the most robust defenses available to a proponent of moral trade (like Ord), and offer a verdict on the objection's viability.

  ### I. The Motive-Sensitivity Objection: Strong Form

  The core promise of moral trade is that it secures a Pareto improvement *by each trading partner's own lights*. This claim relies on the assumption that the moral value an agent derives from a state of affairs is primarily a function of the *outcomes* or the *act-types* realized, rather than the *etiology* of those acts. The Motive-Sensitivity Objection argues that this assumption is false for a significant class of plausible normative theories, specifically those where moral value is constitutively tied to the agent's reasons for acting.

  **1. The Kantian Constraint: Legality vs. Morality**
  For a strict Kantian, the moral worth of an action is determined not by its conformity to duty (*Legalität*), but by whether it is performed *from* duty (*Moralität*). If Agent A (a Kantian regarding animal welfare) trades with Agent B (a Kantian regarding hunting), and B ceases hunting *in exchange* for A's vegetarianism, B is acting on a hypothetical imperative: "If I want A to be vegetarian, I must stop hunting."
  By the Kantian's own lights, B's action lacks moral worth. It is prudent, perhaps, but not moral. Consequently, the state of affairs "B does not hunt" is not intrinsically better than the status quo in the specific currency that matters to A (the realization of the Moral Law). In fact, if the trade encourages B to view moral requirements as negotiable preferences, it may actively degrade B's moral character, rendering the world *worse* by A's lights than if B had continued hunting out of ignorance but retained a capacity for duty.

  **2. The Virtue-Ethical Constraint: Expression of Character**
  Virtue ethics evaluates actions based on what they express about the agent's character (*hexis*). A virtuous agent abstains from cruelty because they possess the virtue of compassion or justice. A trading agent abstains because they possess the skill of negotiation or prudence.
  If Agent A values a world populated by compassionate agents, a world where B stops hunting due to a trade does not satisfy that value. It secures *compliance*, but not *virtue*. Moreover, habituation is central to virtue ethics. If B habituates themselves to doing the "right" thing only when compensated by reciprocal concessions, they are cultivating the character of a merchant, not a virtuous citizen. Thus, the trade fails to deliver the good that A actually values (a virtuous community), even if it delivers the superficial behavioral correlate.

  **3. The "By Their Own Lights" Failure**
  The objection culminates here: Moral trade treats moral theories as preference functions over world-states. But motive-sensitive theories are not preference functions over world-states; they are constraints on the *will*.
  If A's theory says, "The world is only better if B acts from conviction," and the trade ensures "B acts from incentive," then the trade has failed to improve the world *by A's lights*. The Pareto improvement is illusory because the "gain" A perceives (B's abstention) is axiologically hollow within A's own normative framework. The framework of moral trade implicitly assumes a consequentialist or preference-satisfaction axiology where the *source* of the utility is irrelevant. When applied to deontological or aretaic views, it commits a category error.

  ### II. Defenses of Moral Trade

  A defender of moral trade (such as Ord or MacAskill) has several lines of reply. The strongest defenses attempt to decouple the *coordination mechanism* from the *moral motivation*, or to appeal to the context of moral uncertainty.

  **1. The "Conformity Has Value" Reply**
  Even strict Kantians admit that action in *conformity* with duty is better than action in violation of duty, even if it lacks moral worth. A world where animals are not tortured is objectively better than a world where they are, regardless of the maxim behind the abstention, because the suffering (an evil) is prevented.
  *Counter:* This concedes that the improvement is *consequentialist* in nature. It argues that the motive-sensitive theorist should care about outcomes *instrumentally*. But if the theorist believes that acting from the wrong reason corrupts the moral community, the instrumental gain might be outweighed by the expressive harm.

  **2. The "Overdetermination" or "Dual-Motive" Reply**
  This is the most pragmatic defense. Agents rarely have singular motives. Agent B can enter the trade while simultaneously believing that hunting is wrong *simpliciter*. The trade does not replace the moral reason; it solves an *assurance problem*.
  B might think: "I believe hunting is wrong, but I am weak-willed, or I fear being a 'sucker' if I stop while others continue. The trade provides the assurance or the psychological nudge I need to act on the moral reason I already hold."
  In this scenario, the trade is the *occasion* for the action, not necessarily the *exclusive reason*. B can privately maintain the categorical imperative ("Hunting is wrong") while publicly entering a hypothetical bargain ("I will stop if you stop"). If B's internal deliberation remains grounded in duty, the Kantian requirement is satisfied.
  *Counter:* This requires a level of psychological compartmentalization that may be unstable. If the explicit terms of the agreement are "I do X *if and only if* you do Y," the conditionality is built into the commitment, which is structurally incompatible with a categorical duty.

  **3. The Moral Uncertainty Aggregation Reply**
  Ord's framework is explicitly situated within *moral uncertainty*. The claim is not that trade works for a 100% certain Kantian, but that it works for an agent who assigns credence to multiple theories.
  If Agent A has 40% credence in Kantianism and 60% in Consequentialism, the Consequentialist portion of their "moral parliament" sees a massive gain from trade. The Kantian portion sees a loss (or zero gain). If the Consequentialist gains outweigh the Kantian losses in terms of *expected choice-worthiness*, the trade is still rational *by the agent's aggregate lights*.
  *Counter:* This surrenders the claim that trade works for *first-order* disagreements. It admits that trade is only viable for agents who are already uncertain and who assign significant weight to consequence-tracking views. It does not solve the problem for the dogmatic deontologist.

  ### III. Considered Verdict

  The Motive-Sensitivity Objection **succeeds** in demonstrating that moral trade is not a normatively neutral technology, but **fails** to render the proposal useless or incoherent within its intended scope.

  **1. The Limitation of Scope (Where the Objection Succeeds)**
  The objection definitively refutes the strong claim that moral trade generates Pareto improvements for *any* pair of normative theories. It exposes that Ord's framework implicitly privileges axiologies that are *act-individuation invariant* (mostly consequentialism and preference utilitarianism).
  For a pure Kantian or a strict Virtue Ethicist, the "goods" secured by trade (behavioral compliance) are not the "goods" their theory prioritizes (moral worth or virtuous character). Therefore, the promise that agents can gain "by their own lights" is false if their "lights" are motive-sensitive. In a dialogue between a Utilitarian and a Kantian, the Utilitarian sees a gain; the Kantian may see a moral corruption or, at best, a morally neutral event. There is no mutual gain *in the currency of the Kantian theory*.

  **2. The Viability Under Uncertainty (Where the Objection Fails)**
  However, the objection does not destroy the utility of moral trade for two reasons:
  *   **Pluralism of Value:** Very few plausible motive-sensitive theories assign *zero* value to right action (conformity). Even if acting from trade lacks "moral worth," it usually prevents harm. Unless the theory posits that a world with right-action-from-bad-motives is *worse* than a world with wrong-action (a rare and extreme view), there is usually *some* positive value secured, even if it is less than the ideal.
  *   **The Meta-Ethical Context:** Ord's proposal is designed for agents under *moral uncertainty*. As noted in the Aggregation Reply, most agents do not hold 100% credence in strict motive-sensitivity. If an agent assigns non-zero credence to the view that "outcomes matter independently of motives," the expected value of the trade often remains positive. The trade effectively allows the "Consequentialist faction" of the agent's moral credence to outvote the "Kantian faction" regarding this specific decision, based on the magnitude of the stakes (e.g., millions of animal lives).

  **Conclusion**
  The objection successfully identifies a "value leak" in moral trade. It shows that trade secures *compliance* but not *commitment*, and for theories where commitment is the primary locus of value, the trade is deficient. Consequently, proponents of moral trade must retreat from the claim that it works universally across all first-order theories.

  However, the objection does not vitiate the project entirely. In the real world, where agents are morally uncertain and normative theories are rarely pure, moral trade remains a robust heuristic for increasing *expected* moral value. It functions best not as a bridge between incompatible first-order dogmas, but as a coordination mechanism for pluralistic agents who agree that *some* value resides in the prevention of harm, even if they disagree on the ultimate source of that value. The Pareto improvement is not guaranteed *within* every specific normative framework, but it is often achievable within the *weighted aggregate* framework that actual agents inhabit.
