      *Let's structure the "Strongest Form" carefully:* Focus on the *constitutive* nature of moral value in non-consequentialist theories. It's not that outcomes don't matter; it's that the *source* of the action is constitutive of the value. A world where people stop hunting *because of a deal* is a world of contractors, not a world of just people. For a Virtue Ethicist, the former is arguably worse for character development than the latter.

