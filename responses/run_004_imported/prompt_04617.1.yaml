  **Move (4): Jordan (+2)**
  Jordan accurately diagnoses the theoretical cost of Maya's move: eliminating the speaker-intention requirement abandons Grice's core distinction and aligns the account with neo-Gricean defaultism or Relevance Theory.

  ***

  **On Jordan's Charge vs. Grice's Distinction**

  Jordan's charge largely holds up. Grice's distinction between **Generalized Conversational Implicature (GCI)** and **Particularized Conversational Implicature (PCI)** does not save Maya if she claims the implicature exists "regardless of what's going on in [the speaker's] head." Even GCIs rely on the presumption that the speaker is observing the Cooperative Principle; if the professor was merely careless or unaware of the genre conventions (as Jordan suggests), the presumption of cooperation fails, and strictly speaking, no Gricean implicature occurs—only a hearer inference.

  By arguing that the genre conventions alone suffice to generate the meaning, Maya is moving toward **Neo-Gricean defaultism** (like Levinson) or **Relevance Theory**, both of which treat certain inferences as cognitive defaults or matters of mutual manifestness rather than strict speaker intentions. Jordan is right that this abandons Grice's specific psychological account of *meaning-nn*, even if Maya's view is arguably more useful for analyzing real-world institutional communication.
