      *   *Key Insight:* Bell's theorem rules out local hidden variables *within the framework of QM*. Einstein didn't believe QM was the final framework. He believed a deeper field theory would render the entanglement problem moot.
      *   *Nuance on Superdeterminism:* While he was a determinist, superdeterminism kills the independence assumption required for science. Einstein valued the "free choice" of the experimenter as part of the logical structure of physics. So, probably not full-blown conspiracy-style superdeterminism.
      *   *Nuance on Nonlocality:* He called Bohm's theory "cheap." He valued the continuum field. Nonlocality breaks the field concept. He likely would have rejected it.
