      *   *Option B: Accept Indeterminism (Copenhagen).*
          *   *Pros:* Matches experiment.
          *   *Cons:* Abandons Realism and Determinism. "God plays dice."
          *   *Verdict:* Extremely unlikely. This was his main beef from the start.

      *   *Option C: Superdeterminism.*
