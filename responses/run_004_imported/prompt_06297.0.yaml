answer: |-
  Consider the parable of Master Lai. When the Great Smelter—*Zao Hua*, the Creator—casts us into form, we are like metal in a forge. Zhuangzi warns that if a piece of metal were to leap up and cry, 'I must be made into the sword Moye!' the smith would deem it inauspicious. Cryonics is precisely that leap. It is the metal insisting not only on a specific shape but on the impossibility of being melted down again. You are not merely accepting transformation; you are attempting to dictate terms to the Smelter, demanding that *this* particular configuration of qi be preserved against the flow of the great casting. To Zhuangzi, the anxiety required to maintain that demand is the true death, long before the heart stops. The technology itself is neutral, but the will to arrest the cycle—to refuse being recast as a rat's liver or a bug's arm—is the inauspicious omen.

  Yet, we must also look to how Zhuangzi treated his own body and his wife's. When his wife died, he drummed on a tub and sang, recognizing her death as the progression of spring, summer, autumn, and winter. To freeze the newly dead is to declare that winter is a mistake to be corrected rather than a phase to be endured. And on his own deathbed, when disciples worried about crows eating his corpse, Zhuangzi replied that he preferred the crows above to the worms below, for heaven and earth were coffin enough. Your cryonic tanks are elaborate coffins, sealed against the earth. But here lies the tension: Zhuangzi accepted *all* transformations. If the Dao flows through liquid nitrogen as easily as through soil, and if you are someday thawed, is that not also a turn of the wheel?

  The ambiguity remains, and I will not smooth it over. If you wake, Zhuangzi might ask: are you the metal that succeeded, or the dreamer who forgot he was dreaming? The danger is not in the ice, but in the belief that *this* life is the only vessel worthy of carrying your spirit. If you enter the tank clinging to your identity as a fixed point, you violate the Smelter's work. But if you enter it as one enters a dream, with no guarantee of waking and no demand that the waker be the sleeper, then perhaps even this suspension is just another season. The question is not whether you can be revived, but whether the 'you' that wakes is willing to be anything the Smelter chooses, or if it will still be screaming to be the sword Moye.
