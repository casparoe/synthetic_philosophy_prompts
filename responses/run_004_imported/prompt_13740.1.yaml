answer: |-
  **MEMORANDUM**

  **TO:** Clinical Protocols Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Adoption of DSM-5-TR Prolonged Grief Disorder (PGD) Criteria

  **Purpose**
  Next month, the committee will vote on whether to integrate the DSM-5-TR diagnosis of Prolonged Grief Disorder (PGD) into our standard intake and care pathway. Specifically, this concerns flagging clients exhibiting intense yearning/longing symptoms at the 12-month mark for specialized treatment rather than standard bereavement support.

  **Recommendation**
  I recommend that the committee **vote to adopt the PGD diagnosis for reimbursement purposes, but with specific clinical guardrails regarding its application and communication.**

  We should utilize the code to secure insurance coverage for high-need clients, but we must not treat the diagnostic criteria as a rigid biological boundary. We need a protocol that separates *billing classification* from *clinical narrative*.

  **Rationale**

  **1. The Imperative for Access (The Case for Adoption)**
  The primary argument for adoption is pragmatic and ethical: without a billable diagnosis, clients suffering from debilitating, chronic grief are currently capped out of care. Our standard bereavement groups are supportive, but they are not therapeutic interventions for complex trauma or stalled grief. Colleagues advocating for adoption correctly note that refusing this code effectively denies insurance-funded treatment to a vulnerable population. Validating severe grief as a treatable condition reduces stigma for those who feel "broken" by their inability to move forward, and it provides a pathway to evidence-based therapy that support groups cannot offer.

  **2. The Risk of Diagnostic Labeling (The Case for Guardrails)**
  However, adopting the diagnosis carries a risk that goes beyond simple over-medicalization. We must consider the "looping effect" of psychiatric classification. Unlike classifying a medical condition like a fracture, classifying a psychological state changes the state itself.

  When we label a client's experience as a "Disorder" at a specific timeline (12 months), it alters how they narrate their own life. There is a clinical risk that clients will begin to view their grief not as a continuing bond or a painful adaptation, but as a pathology to be cured. This can create a self-fulfilling prophecy where the client focuses on "symptom reduction" rather than integration, potentially locking them into a patient identity that hinders natural resolution. If we implement this rigidly, we risk iatrogenic harm—where the treatment label exacerbates the distress it aims to measure.

  **3. The Problem of the Cutoff**
  The 12-month marker in the DSM-5-TR is a consensus guideline, not a biological switch. Grief does not adhere to fiscal or calendar years. A rigid protocol that automatically flags a client at month 12 risks turning a clinical judgment into an administrative checkbox. We must preserve clinician discretion to determine if the symptoms represent a disorder or an intense, yet normal, variation of loss.

  **Proposed Implementation Guardrails**
  To balance access to care with the risks of labeling, I propose the following conditions for adoption:

  *   **Decouple Billing from Language:** Clinicians may use the PGD code for insurance reimbursement, but in session, the language should focus on "Intense Grief Response" or "Complicated Bereavement." The word "Disorder" should not be introduced to the client unless clinically necessary for their own understanding.
  *   **Flexible Timing:** The 12-month mark should trigger a *clinical review*, not an automatic re-routing. The protocol should allow for extension in standard support if the clinician judges that pathologizing the grief at that specific moment would be harmful.
  *   **Periodic Re-evaluation:** If a client is routed into the PGD treatment pathway, the diagnosis must be reviewed every 6 sessions. The goal is to step down to support groups as soon as stability returns, preventing the "disorder" label from becoming a permanent identity.

  **Conclusion**
  Those advocating for full, unrestricted adoption are driven by a necessary desire to fund care for the suffering. That intent is correct. However, ignoring the impact of the label itself is clinically naive. By adopting the code instrumentally—using it to open doors for funding while guarding against its psychological weight—we can secure resources for our clients without surrendering our understanding of grief to a checklist.

  I look forward to discussing these guardrails at the next meeting.
