answer: |-
  Your friend has articulated a compelling and influential position, often associated with the work of George Ainslie, Jon Elster, and certain strands of behavioral economics. The claim is that *akrasia* (weakness of will) is not a failure of rationality or a metaphysical puzzle about the soul, but a predictable mathematical consequence of how humans value time.

  However, to answer your core question: **No, philosophers who continue to treat weakness of will as a live puzzle should not be regarded as "behind the curve."**

  While the hyperbolic discounting model provides a powerful *causal mechanism* for many cases of self-defeating behavior, most philosophers of action argue that it fails to capture the *conceptual structure* of akrasia. The discounting story explains why preferences change; it does not fully explain how an agent can act against a *standing evaluative judgment* while retaining that judgment.

  Here is a breakdown of exactly how far the discounting story reaches, and where it leaves off, which should help you reconstruct the rebuttal you were looking for.

  ### 1. Preference Reversal vs. Judgment Violation
  The crux of the philosophical puzzle (sharpened by Donald Davidson) is not merely choosing $B$ over $A$. It is choosing $B$ over $A$ while judging that, *all things considered*, $A$ is better.

  *   **The Discounting View:** As the smaller-sooner reward ($B$) approaches, its subjective present value spikes due to the hyperbolic curve. At the moment of choice, the agent values $B$ *more* than $A$. Therefore, the agent is maximizing utility relative to their current discount function. There is no conflict; the preference has simply flipped.
  *   **The Philosophical Objection:** If the preference flips, does the *judgment* flip?
      *   **Case 1:** If the agent decides, "Because the cake is here now, it is actually *better* for me to eat it than to stick to my diet," that is not akrasia. That is a change of mind (or a re-evaluation).
      *   **Case 2:** If the agent thinks, "I still judge that dieting is better for me overall, even right now, but I am going to eat the cake anyway," *that* is akrasia.
      *   **The Gap:** Hyperbolic discounting explains Case 1 beautifully. It struggles with Case 2. It treats the "judgment of betterness" as identical to "current motivational strength." Philosophers argue these can come apart. I can be more motivated by the cake (high discount value) while simultaneously judging the diet to be better (evaluative judgment). The discounting model dissolves the gap by defining "better" as "more motivating." Philosophers insist the gap is real.

  ### 2. Synchronic vs. Diachronic Akrasia
  The hyperbolic discounting model is inherently **diachronic**; it relies on the passage of time to explain the crossing of value curves.

  *   **The Limit:** This model cannot easily explain **synchronic akrasia**, where an agent acts against their better judgment without a significant time delay or intertemporal trade-off.
  *   **Example:** Imagine an agent who judges that giving a speech is better than staying silent, but freezes up due to anxiety *in the moment*. Or, an agent who judges that taking the \$100 bill is better than the \$50 bill (both available now), but impulsively grabs the \$50 due to a compulsion.
  *   **Implication:** If akrasia can occur without a temporal delay between judgment and action, hyperbolic discounting (which relies on temporal proximity to alter value) cannot be the whole story. It explains *procrastination* and *relapse*, but perhaps not *impulse* or *cowardice* in the immediate present.

  ### 3. The Unity of the Agent (Picoeconomics vs. Agency)
  Your friend mentioned "picoeconomics." This is Ainslie's view that the self is not a unitary agent but a population of competing impulse-systems over time.

  *   **The Reduction:** On this view, "weakness of will" is just the temporary victory of a short-term subsystem over a long-term coalition. There is no "self" to be weak; there are just competing utilities.
  *   **The Philosophical Objection:** Many philosophers argue this is **eliminativism**, not explanation. It explains the behavior by denying the existence of the agent who is supposed to be struggling.
  *   **Why it matters:** We hold people responsible for akrasia. We praise them for overcoming it. If the self is just a battlefield of discount curves, the concept of *responsibility* becomes murky. Philosophers like **Richard Holton** (in *Willing, Wanting, Waiting*) argue that willpower is a distinct capacity for maintaining intentions against shifting preferences. This preserves the unity of the agent required for moral responsibility, which the discounting model tends to dissolve.

  ### 4. Normativity vs. Prudence
  The traditional puzzle of akrasia often carries a **normative** or **moral** weight (Aristotle's *akrasia* is usually about moral virtue, not just dieting).

  *   **The Discounting View:** This is a model of *prudential rationality*. It explains why you fail to maximize your own welfare.
  *   **The Philosophical Objection:** Akrasia often involves acting against what one judges one *ought* to do, not just what is *good* for one.
  *   **Example:** A smoker might judge, "I ought not to smoke because it is wrong to expose my children to secondhand smoke," not just "because it hurts my health." Hyperbolic discounting can model the health cost, but it struggles to model the deontic "ought." If the "value" of moral duty is plugged into the discount curve, does it get discounted hyperbolically? If so, morality becomes a function of temporal proximity, which is counter-intuitive. If not, then the discounting model doesn't apply to moral akrasia.

  ### 5. "Knowingly" and the Clouding of Judgment
  Aristotle insists the akratic agent acts *knowingly*. Davidson insists they act with an "all-things-considered" judgment.

  *   **The Discounting Problem:** If hyperbolic discounting works by inflating the subjective value of the immediate reward, does the agent *know* the long-term option is better at the moment of action?
  *   **The Phenomenology:** Often, when we succumb to temptation, we engage in "sophistry." We tell ourselves, "Just this once won't hurt," or "I'll start the diet tomorrow."
  *   **The Rebuttal:** If the discounting mechanism works by temporarily altering our *belief* about what is best (making the cake seem best *now*), then we aren't acting against our judgment; our judgment has been hijacked. This looks more like **self-deception** than weakness of will. Philosophers distinguish between *clear-eyed akrasia* (knowing it's best to stop, and doing it anyway) and *clouded judgment*. The discounting model blurs this distinction, whereas the philosophical puzzle specifically targets the clear-eyed variety.

  ### Summary: Mechanism vs. Analysis
  Your friend is right that hyperbolic discounting provides the best **empirical mechanism** for a large class of behaviors we *call* weak-willed. It removes the mystery of *how* the motivation shifts.

  However, philosophers are not "behind the curve" because they are asking a different question. They are not asking, "What causes preference reversals?" They are asking, "What is the relationship between evaluative judgment and intentional action, and how is it possible for them to diverge in a rational agent?"

  *   **Decision Theory** says: "The divergence is an illusion caused by time-inconsistent valuation."
  *   **Philosophy** says: "Even if valuation is time-inconsistent, the agent's capacity to act on their long-term judgment (willpower) remains a distinct phenomenon that requires analysis."

  **Conclusion:**
  You can tell your friend that her model successfully **naturalizes** akrasia, but it does not **dissolve** it. It explains the *physics* of the fall, but not the *experience* of the fall. Philosophers who continue to work on the puzzle are investigating the nature of agency, responsibility, and the structure of judgment—questions that remain open even if we accept hyperbolic discounting as a fact of human psychology. Treating the philosophical puzzle as "solved" by decision theory is a category error: it mistakes a causal explanation for a conceptual analysis.

  **Suggested Reading for Rebuttal:**
  *   **Richard Holton, *Willing, Wanting, Waiting* (2009):** Specifically argues against the reduction of willpower to preference strength.
  *   **Sergio Tenenbaum, *Rational Powers in Action* (2007):** Defends a structure of agency that resists the Humean/Decision-Theoretic reduction.
  *   **Donald Davidson, "How is Weakness of the Will Possible?" (1970):** The classic statement of why the logical relation between judgment and action is the puzzle, not the psychological cause.
