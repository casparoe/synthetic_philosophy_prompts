answer: |-
  This is a sophisticated pivot for a heist narrative. Most stories in this genre treat the group as a plot device; you are treating the group as a metaphysical problem. That distinction is where the tension lies.

  Bratman and Gilbert are indeed the two heavyweight champions of this specific philosophical ring, and their disagreement is not merely terminological. It cuts to the core of what a "group" is. Below is the precise substance of their disagreement, followed by my judgment on which account better captures the metaphysical reality of your character's betrayal.

  ### The Substance of the Disagreement

  The core divergence lies in **ontology** (what kind of thing is a shared intention?) and **normativity** (where does the obligation to stick to the plan come from?).

  **1. Michael Bratman: Shared Intention as Interlocking Individualism**
  For Bratman, there is no such thing as a "group mind." A shared intention is a structure built entirely out of the individual mental states of the participants.
  *   **The Mechanism:** Person A intends that *we* J (perform the joint action). Person B intends that *we* J. Crucially, A intends that *we* J *in part because* B intends that *we* J, and vice versa. Their sub-plans must mesh, and this must be common knowledge.
  *   **The Glue:** The "glue" holding the group together is mutual responsiveness. Each person adjusts their actions to support the other's intention.
  *   **The Exit:** Because the shared intention is constituted by individual intentions, if Person A stops intending "we J," the shared intention **ceases to exist**. There is nothing left to dissolve.
  *   **The Obligation:** Bratman admits there is normative pressure here, but it is the pressure of **individual rationality**. If I change my mind without telling you, I am being inconsistent, and I am misleading you (violating a norm of honesty). But I do not owe you my continued participation in a way that gives you the *right* to demand it. I can unilaterally withdraw, though I may be blameworthy for how I handle it.

  **2. Margaret Gilbert: Joint Commitment as a Plural Subject**
  Gilbert argues that Bratman's view cannot account for the specific *force* of social obligations. She posits that when people form a group, they become a "plural subject."
  *   **The Mechanism:** Joint commitment is not the sum of two personal commitments. It is a new, sui generis phenomenon created when each expresses readiness to be committed *with* the other. It creates a single unit of agency.
  *   **The Glue:** The glue is the commitment itself, which stands above the individuals.
  *   **The Exit:** A joint commitment **cannot be rescinded unilaterally**. Just as one person cannot sign a contract and then tear it up without the other's consent, one person cannot dissolve a joint commitment alone. It requires a joint process of rescission.
  *   **The Obligation:** This creates genuine **rights and obligations**. If I walk away, I am not just being inconsistent; I am violating your *right* to my participation. I am in debt to the group until they release me.

  **The Genuine Parting of Ways**
  The disagreement crystallizes around the **unilateral withdrawal**.
  *   For **Bratman**, the moment your character decides to leave, the shared intention is dead. The group is now a collection of individuals, four of whom are operating under a false belief. The metaphysical reality is *fragmentation*.
  *   For **Gilbert**, the moment your character decides to leave, the joint commitment remains intact, but he is now in a state of **violation**. The group is still a unit, but he is a defecting part. The metaphysical reality is *debt*.

  ### The Midpoint Scenario: A Metaphysical Verdict

  You asked which account more accurately describes what has *actually* happened, metaphysically, at the moment your character privately changes his heart.

  My judgment is that **Margaret Gilbert's account is metaphysically superior** for the specific context of your novel, though Bratman offers a better description of the *mechanics* of the planning.

  Here is why Gilbert captures the reality of your situation more accurately:

  **1. The Persistence of the Social Fact**
  In your novel, these are non-criminals spending a year together. This duration and demographic suggest the formation of deep interpersonal trust, not just logistical coordination. Bratman's model works well for strangers coordinating to lift a piano together for ten seconds. It works less well for a year-long collaboration among friends or colleagues.
  In high-trust human relationships, the "social fact" of the group persists even when one member mentally checks out. If your character walks away silently, the other four do not instantly become four individuals; they remain a crew *expecting* him. The social reality of the group does not evaporate the moment his internal state changes. It evaporates only when the information reaches the group and they collectively process it. Until then, the "Plural Subject" exists, and he is secretly at war with it. Gilbert captures this lag between internal dissent and social dissolution.

  **2. The Source of the Guilt**
  If Bratman is right, your character's guilt should stem from **deception** (lying by omission) and **irrationality** (inconsistency).
  If Gilbert is right, his guilt stems from **betrayal** (violating a right).
  For a novel focused on the "inner life," Gilbert's ontology provides richer psychological terrain. Under Bratman's view, the character is essentially saying, "I changed my mind." Under Gilbert's view, he is saying, "I am keeping your trust while secretly invalidating it." The latter creates a specific metaphysical tension: he is physically present but ontologically absent. He is borrowing against a commitment he has already defaulted on. This aligns better with the feeling of fracture you are describing.

  **3. The Power Dynamics of Release**
  Bratman implies the individual is sovereign over their intention. Gilbert implies the *group* holds sovereignty over the commitment. In a heist crew, the latter is dramatically truer. If he tries to leave, he cannot simply *leave*; he needs the crew to let him go (or he has to incapacitate them). If he walks away silently, he is not free; he is a fugitive from the group's expectation. The tension in your second act will come from the fact that the group still treats him as bound. Gilbert explains *why* they are justified in treating him as bound: because the commitment was never rescinded.

  ### Recommendation for the Narrative

  While I argue Gilbert is metaphysically more accurate regarding the *bond*, you should use Bratman to map the *breakdown*.

  *   **Use Gilbert for the Moral Weight:** Treat the joint commitment as a real object that your character is carrying. He feels the weight of the obligation even after he decides to quit. He knows he cannot simply vanish; he knows he owes them a "joint rescission." His failure to seek that rescission is the source of his corruption.
  *   **Use Bratman for the Operational Decay:** As his internal responsiveness lapses (Bratman's condition), the practical meshing of the plan should start to fail. He stops adjusting his sub-plans to fit theirs. He becomes a "dead node" in the network. The plan doesn't fall apart because the commitment is broken (Gilbert); it falls apart because his individual intentions no longer mesh with the others (Bratman).

  **The Verdict:**
  At the exact moment of his private change of heart, **the group has not ceased to exist.** The Plural Subject remains intact because the other four members still hold their ends of the commitment, and they have no knowledge of his withdrawal. Therefore, he is not merely a man who changed his mind; he is a man living a lie within a binding social structure.

  Gilbert is right: he is still bound. The tragedy of your character is that he believes he has freed himself internally, while metaphysically (socially), he has only enslaved himself to a secret. That is a much more potent conflict for a novel than simply "he changed his mind."
