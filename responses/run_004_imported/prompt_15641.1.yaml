  3.  **Address Point 1: Can Exploitation do Normative Work without Alienation?**
      *   *Argument for Yes (Advisor/Althusser):* Exploitation is about domination and coercion, not essence. It violates rights or fairness principles immanent to commodity exchange (the "hidden abode").
