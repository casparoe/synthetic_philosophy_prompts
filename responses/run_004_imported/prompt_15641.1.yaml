      *   *Pivot:* I will argue that **Exploitation** is the concept doing the work in *Capital*, but it *presupposes* a normative anthropology that is the secularized successor to **Alienation**. If forced to choose the *normative* foundation, it is the Alienation-concept (human flourishing/self-determination). If choosing the *explanatory* foundation, it is Exploitation. Since the dissertation is on *normative underpinnings*, the verdict must favor the Alienation-side as the ground of the critique.

