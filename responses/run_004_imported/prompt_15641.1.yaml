answer: |-
  This is a classic and high-stakes debate in Marxist scholarship, and it cuts to the heart of how you frame the normative authority of your dissertation. Your advisor is invoking the structuralist orthodoxy (Althusser, Balibar, perhaps implicitly Wood), which insists that *Capital* is a critique of political economy's categories, not a moral critique based on an anthropological essence. You are invoking the continuity thesis (Lukács, Fromm, and more recently Honneth and Jaeggi), which suggests that a critique of capitalism requires a conception of the good life that capitalism frustrates.

  To help you resolve this for your chapter, I will not merely survey the literature. I will analyze the logical dependency between the two concepts and offer a defended verdict on their relationship in Marx's mature thought.

  ### 1. Can Exploitation Do Normative Work Without Alienation?

  Your advisor's position rests on the idea that *exploitation* in *Capital* is a technical description of a social relation: the capitalist purchases labor-power at its value (necessary labor time) but extracts value beyond that (surplus labor time). On the Althusserian reading, calling this "exploitation" is not a moral condemnation but a structural designation, akin to a physicist describing friction.

  However, for exploitation to function as a *critique*—which is your dissertation's focus—it must do more than describe a flow of value. It must explain why that flow is objectionable.

  If we strip away the humanist premises of the 1844 *Manuscripts*, what makes the extraction of surplus value *wrong*?
  *   **Is it theft?** Marx explicitly rejects this in *Capital* Vol. I, noting that the exchange of labor-power for wages is, within the logic of commodity exchange, "a very Eden of the innate rights of man." The capitalist pays the full value of the commodity (labor-power). To call it theft requires a normative theory of property rights that Marx generally avoids grounding in natural law.
  *   **Is it coercion?** This is a stronger route. The worker is "free" in a double sense: free to sell their labor, but free *from* the means of subsistence. This compels them to enter the relation. But coercion alone doesn't explain the specific *harm* of capitalism. Slavery is coercive, but Marx distinguishes capitalist exploitation from slavery precisely because the former involves a specific extraction of *time* and *activity*.

  Here is the crux: The term "exploitation" (*Ausbeutung*) is a "thick" ethical concept. It implies using someone as a mere means. For the extraction of surplus labor to be exploitative rather than merely productive, there must be a normative baseline regarding who has a claim to the product of that labor and the activity itself.

  If you remove the 1844 background—the idea that labor is the primary medium through which humans realize their capacities and that appropriating the surplus frustrates this realization—exploitation becomes a mere accounting discrepancy. It tells us *how* surplus is generated, but not *why* its private appropriation is a social pathology. Therefore, **exploitation cannot do genuine normative work without covertly relying on a conception of non-alienated labor.** It needs the shadow of the 1844 "species-being" (even if secularized as "socially individualized production") to define the extraction as a *loss* for the worker rather than just a cost of production.

  ### 2. Can Alienation Retain Critical Force Without Surplus-Value?

  Conversely, let's test your intuition against the advisor's rigor. Can the 1844 concept of alienation stand on its own in a mature critique?

  The early concept of alienation is phenomenologically rich but structurally indeterminate. It describes a *feeling* or a *state* of estrangement: the worker feels disconnected from the product, the process, and others.
  *   **The Problem of Idealism:** Without the apparatus of surplus value, alienation risks becoming a trans-historical complaint. Bureaucrats, artists, and slaves can all feel alienated. If alienation is not tied to the specific mechanism of capitalist production (the valorization of value), the critique loses its specific target. It becomes a moralistic lament about "industrial society" rather than a critique of the *capital relation*.
  *   **The Problem of Compulsion:** The 1844 Manuscripts describe the *fact* of estrangement but struggle to explain its *necessity*. Why *must* the worker be alienated? The mature theory of exploitation answers this: Alienation is not an accident or a psychological failure; it is structurally enforced by the competitive compulsion to extract surplus value.

  Therefore, **alienation cannot retain its specific critical force against *capitalism* without the determinate apparatus of surplus-value.** Without exploitation, alienation is a diagnosis without an etiology. It identifies the symptom (estrangement) but lacks the materialist explanation for the disease (surplus extraction). It remains in the realm of philosophy rather than political economy.

  ### 3. The Verdict: Priority and Relationship

  This brings us to the decisive question: Are these independent critiques, or is one prior?

  The Althusserian "epistemological break" posits they are independent (and that the latter supersedes the former). The Humanist continuity thesis posits they are the same. Both are slightly off the mark.

  **The Verdict:**
  **Alienation is normatively prior, but Exploitation is structurally prior.** They are not independent critiques; rather, **Exploitation is the specific social form that Alienation takes under the capitalist mode of production.**

  Here is the defense of this verdict, which you can adapt for your chapter:

  1.  **Normative Priority of Alienation:** The reason Marx condemns exploitation is not because it violates an abstract principle of justice (he is skeptical of "justice" as a bourgeois category), but because it restricts human freedom and flourishing. In *Capital* Vol. III, Marx describes the "realm of freedom" as the development of human powers as an end in itself. This is the secularized, mature successor to "species-being." Without this normative horizon—a vision of labor as self-constituting activity—the extraction of surplus time is just a technical feature of economics. The *condemnation* relies on the premise that workers ought to have control over their life-time and activity. That is the core of the alienation critique. Thus, for your dissertation on *normative underpinnings*, **Alienation is the fundamental concept.** It provides the "good" that capitalism violates.

  2.  **Structural Priority of Exploitation:** However, Marx's genius in *Capital* is showing that you cannot simply wish away alienation. It is not solved by changing attitudes (as Hegel might suggest) but by overthrowing the value form. The *mechanism* that generates alienation is exploitation. Therefore, in the *explanatory* architecture of the mature work, Exploitation is dominant. It explains why alienation is systemic and not contingent.

  3.  **Refuting the "Break":** The Althusserian reading fails because it assumes that dropping the *word* "alienation" means dropping the *concept*. Marx stops using the philosophical vocabulary of 1844 because he recognizes its vulnerability to idealist interpretation. He replaces "alienation" with "commodity fetishism" and "exploitation." But fetishism is simply alienation objectified in the market; exploitation is alienation enforced by the extraction of surplus value. The break is rhetorical and methodological, not normative.

  ### Recommendation for Your Dissertation Chapter

  Your advisor is correct that you cannot simply import the metaphysical "essence" of 1844 into *Capital* without doing violence to Marx's mature method. However, you are correct that *Capital* is not normatively neutral.

  **Your path forward:**
  Argue that the normative underpinning of *Capital* is an **immanent critique of freedom**, which is the mature, materialist reformulation of alienation.
  *   Do not defend "species-being" as a metaphysical essence.
  *   Do defend "self-determination over labor time" as the normative standard.
  *   Show that "exploitation" is the *violation* of this standard.

  **Defended Conclusion:**
  If forced to choose which concept is doing the *more fundamental work* in Marx's mature thought regarding the *condemnation* of capitalism: **It is Alienation (reconfigured as the restriction of disposable time and self-determination).**

  Exploitation explains the *mechanism* of the crime, but Alienation defines the *harm*. A dissertation on normative underpinnings must focus on the harm, not just the mechanism. If you side entirely with your advisor, you risk turning Marx into a sociologist who describes how capitalism works but cannot explain why we should oppose it. If you side entirely with your initial intuition, you risk turning Marx into a moralist.

  **Synthesis:** Defend the view that Marx's mature critique is that capitalism is **irrational** because it is **alienating**, and it is alienating because it is **exploitative**. Exploitation is the cause; Alienation is the effect; the restriction of human freedom is the normative wrong. Therefore, while Exploitation is the analytic engine of *Capital*, Alienation remains its normative bedrock.

  This allows you to respect your advisor's demand for textual rigor regarding *Capital* while maintaining your philosophical claim that the critique is ultimately about human flourishing.
