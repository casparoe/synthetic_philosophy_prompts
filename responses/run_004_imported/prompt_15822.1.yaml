      *   **The "Ghost in the Machine" problem:** Leibniz would argue that no matter how complex the computation (the "pushing of parts"), it remains mechanical. If there is no dominant monad associated with the system, there is no *apperception* (conscious awareness).
      *   **Could an AI have a dominant monad?** This is the tricky part. Leibniz believes monads are created by God. Can a human build a vessel that *attracts* or *constitutes* a dominant monad?
