      *   **Normative/Evaluative View (e.g., Wakefield's Harmful Dysfunction, or broader normative accounts):** Disease requires a value judgment that the condition is harmful or undesirable.
          *   *Strength:* Captures the lived experience of harm, aligns with patient goals.
