          *   12 men: Definitely *subjects*.
          *   James's point: Even if the feelings are *subjects* (mind-stuff theory says they are), they still don't sum.
      *   **Historical Context:** James is attacking Clifford and Spencer (Mind-Stuff theorists). They claim complex mind emerges from simple minds. James says "No, that's magic." The 12 men example shows that spatial proximity or causal connection doesn't create *phenomenal unity*.

