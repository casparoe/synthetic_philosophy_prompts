  The newsroom hummed with the low vibration of servers, the only light coming from the bank of monitors where the front page sat finalized. Sarah capped her pen, staring at the headline. David leaned against a desk, swirling the dregs of cold coffee.

  "Tell me you don't see the problem," Sarah said. "One anonymous source. No corroboration. The editor ran it on pure instinct."

  "Instinct is just fast epistemology," David replied. "He operated on a default position. Unless he had specific defeaters—reasons to think the source was lying—trust was the rational baseline. It's Burge's Acceptance Principle. We are entitled to accept what is presented as true unless there are stronger reasons not to."

  "That works for believing your friend when she says it's raining," Sarah said, turning her chair. "This is a defamation risk wrapped in national security. You're treating testimony like perception. But it's not. When I see a chair, I have direct access. When I hear a source, I'm relying on their competence and sincerity. Fricker was right: trust isn't basic. It's rational only if I have positive reasons to think *this* speaker is reliable."

  "Positive reasons based on what?" David pushed off the desk. "Independent evidence? Where does that come from? If you demand independent verification for every testimonial claim, you halt the transmission of knowledge. Coady made this clear. Most of what you call 'independent evidence' is itself testimonial. You check the source's record? That record is built on other people's reports. You check the documents? You're trusting the authenticity of the paper trail. The reductionist demand creates a regress nobody can survive."

  "Local reductionism isn't global skepticism," Sarah countered. "I'm not asking for a global induction over all humanity. I'm asking for local monitoring. Did the source hesitate? Did the details cohere with what we already know? The editor didn't check cues; he checked nothing. He just accepted. Where is the line between warranted default trust and plain gullibility? If I tell you I have a dragon in my garage, do you accept that unless you have a defeater?"

  "Dragon claims clash with background knowledge," David said. "That's a defeater. But the source's claim about internal deliberations? That fits. The burden of proof is on the skeptic. If you require non-testimonial evidence for every claim, you forget how we learn language. A child cannot verify a parent's words against independent data before understanding the words themselves. If reductionism were true, knowledge transmission would never start. We must be designed to trust."

  "We aren't children learning verbs," Sarah said, standing up. "We are professionals publishing to millions. The stakes change the epistemic requirements. In high-stakes contexts, the 'default' shifts. You say trust is basic, like memory. But memory fails. Perception fails. Why is testimony immune? If the editor's trust is basic, then trusting a conspiracy theorist is equally basic unless proven wrong. That makes rationality too easy."

  "It makes rationality possible," David insisted. "You want to cash out trust in non-testimonial coins. But the currency is fake. You think you're standing on solid ground when you verify a source, but you're standing on a web of other testimonies. The anti-reductionist admits the circle. We rely on the community's reliability as a whole. The editor trusted the source because he trusts the ecosystem that produced them. That's not gullibility; it's recognizing our epistemic dependence."

  "Dependence isn't an excuse for negligence," Sarah said, grabbing her bag. "Fricker's point was about competence. A competent hearer monitors. If the editor didn't monitor, he wasn't competent. You're defending a principle that protects laziness. If trust is free, why bother investigating?"

  "Because investigation is limited," David said, matching her pace toward the elevators. "You investigate until you hit bedrock. And bedrock is always someone's word. You want the editor to have independent evidence of the source's reliability. But the only evidence available is more testimony. So you're demanding he do the impossible. Better to admit trust is a primitive right we exercise, subject to defeat, rather than a prize we earn after an impossible audit."

  "So we just publish and pray no defeaters show up?"

  "We publish because communication is how we know anything at all," David said. The elevator doors opened. "If you sever the link between word and truth until verification arrives, you don't get safety. You get silence."

  Sarah stepped into the elevator, holding the door. "And if you never sever it, you get noise. You haven't told me where the line is, David. You've just told me why I can't draw it."

  "And you haven't told me how to stand on the line without falling into the regress," David said.

  The doors closed between them, leaving the question hanging in the empty newsroom.
