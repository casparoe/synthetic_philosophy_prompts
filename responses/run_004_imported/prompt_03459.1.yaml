answer: |-
  You have done an impressive piece of detective work. You are correct: your mediator's assurance relies on a property that holds for two-person bargaining but collapses when a third party is introduced. Your reading of Alvin Roth's 1979 *Econometrica* paper, "An Impossibility Result for $n$-Person Bargaining," is accurate.

  The situation you describe sits at the intersection of cooperative game theory and mechanism design. Below is a technical walkthrough of the axioms, the impossibility theorem, and the practical implications for your family's dissolution.

  ### (a) Monotonicity and the Nash Violation

  To understand the mediator's pitch, we must distinguish between the two competing axioms that define Nash and Kalai-Smorodinsky (KS).

  **1. The Axioms**
  *   **Nash Bargaining Solution (NBS):** Defined by **Independence of Irrelevant Alternatives (IIA)**. If a solution is chosen from a large set of feasible outcomes, and the set shrinks but the chosen solution remains feasible, the solution must not change. Geometrically, NBS maximizes the product of gains over the disagreement point: $\max \prod (u_i - d_i)$. It depends heavily on the **local curvature** of the Pareto frontier.
  *   **Kalai-Smorodinsky (KS):** Defined by **Individual Monotonicity (IM)**. This axiom states that if the feasible set expands in a way that increases Player $i$'s maximum possible utility (their "ideal" or "utopia" value) without reducing anyone else's maximum possible utility, then Player $i$'s actual utility in the solution should not decrease. Geometrically, KS finds the intersection of the Pareto frontier and the line segment connecting the disagreement point $d$ to the **Ideal Point** $a$ (where $a_i = \max \{u_i \mid u \in S\}$).

  **2. Why Nash Violates Monotonicity**
  The "backwards" result you witnessed is a classic violation of Individual Monotonicity by the Nash solution.
  Because Nash maximizes the *product* of gains, it is sensitive to the marginal rate of substitution (the slope/curvature) at the solution point.
  *   **Scenario:** Suppose Sibling A gets an outside offer. This expands the feasible set $S$, specifically pushing out the frontier along A's axis.
  *   **The Quirk:** This expansion might change the *curvature* of the frontier in a way that makes Sibling B's utility "cheaper" to buy in terms of A's utility. Even though A's potential maximum increased, the new tangency point of the Nash hyperbola might shift in a way that grants a disproportionate share of the *new* value to B.
  *   **Result:** A's position strengthened (higher ideal point), but B captured the value. This violates Intuitive Monotonicity. KS was designed specifically to fix this by ignoring curvature and focusing only on the ratio of *achieved gain* to *maximum possible gain*.

  ### (b) Roth's Impossibility Result ($n \ge 3$)

  This is the crux of your discovery. The Kalai-Smorodinsky solution is uniquely characterized by four axioms: Pareto Efficiency, Symmetry, Scale Invariance, and Individual Monotonicity. **However, this characterization holds only for $n=2$.**

  **1. The Theorem**
  Alvin Roth (1979) proved that for any bargaining problem with $n \ge 3$ players, **no solution exists** that satisfies:
  1.  **Pareto Efficiency (PAR):** No value is left on the table.
  2.  **Symmetry (SYM):** Players with identical options get identical payoffs.
  3.  **Individual Monotonicity (IM):** If my potential max increases, my payoff doesn't drop.

  *(Note: Scale Invariance is typically assumed in the domain of utility functions for this theorem.)*

  **2. The Geometric Breakdown**
  In two dimensions, the "Ideal Point" $a$ and the disagreement point $d$ define a unique line. The intersection of this line with the Pareto frontier is unique and satisfies IM.
  In three dimensions (you and your two siblings), the geometry becomes unstable regarding Monotonicity:
  *   The Ideal Point $a = (a_1, a_2, a_3)$ is still defined by the coordinate-wise maximums.
  *   The "KS Solution" is typically extended to $n=3$ by drawing a ray from $d$ through $a$ and finding where it hits the Pareto frontier.
  *   **The Failure:** In 3D, moving the frontier outward for Player 1 (increasing $a_1$) changes the direction of the ray $d \to a$. However, because the Pareto frontier is a 2D surface in 3D space, the intersection point does not necessarily move in a way that guarantees Player 1 gains while others do not gain *more* in a way that violates the spirit of IM.
  *   Specifically, there are configurations of the feasible set in $\mathbb{R}^3$ where expanding Player 1's maximum potential causes the ray to intersect the frontier at a point where Player 1's utility actually *decreases* or stays static while Player 2's utility jumps, solely due to the topology of the frontier.

  **Conclusion:** The standard geometric extension of KS to three people **fails Individual Monotonicity.** Roth's theorem proves this failure is unavoidable if you want to keep Efficiency and Symmetry.

  ### (c) Practical Implications for Your Mediation

  When a mediator claims to apply "the Kalai-Smorodinsky solution" to a three-way split, they are almost certainly using the **Geometric Ray Extension** (equalizing proportional gains). You need to understand what is being sacrificed to manage your expectations.

  **1. What is being sacrificed?**
  To satisfy Roth's constraints, one axiom must go. In business dissolutions:
  *   **Pareto Efficiency** is rarely sacrificed (mediators won't suggest leaving money on the table).
  *   **Symmetry** is politically difficult to sacrifice (siblings demand equal treatment).
  *   **Monotonicity** is the casualty.

  If your mediator is using the standard KS formula for three people, **she is not actually guaranteeing Monotonicity**, despite her claim. She is guaranteeing Efficiency and Symmetry (and Scale Invariance). The "reversal" you saw under Nash might be less likely under KS, but Roth's theorem proves it is *still possible* for a sibling to gain leverage (expand the feasible set) and yet not see a monotonic improvement in their share relative to the others.

  **2. How to detect the compromise (The Litmus Test)**
  You can determine exactly which solution she is calculating by asking for the formula used to derive the split.

  *   **If she is using Geometric KS:** She will be equalizing the **proportion of maximum potential gain**.
      $$ \frac{u_1 - d_1}{a_1 - d_1} = \frac{u_2 - d_2}{a_2 - d_2} = \frac{u_3 - d_3}{a_3 - d_3} $$
      *   *Implication:* This is the standard "KS" extension. It satisfies Efficiency and Symmetry but **violates Monotonicity** (per Roth). If Sibling 1's outside offer raises $a_1$, the ratios rebalance, but Sibling 1 is not mathematically guaranteed to end up with more utility than before.

  *   **If she is using the Egalitarian Solution (Kalai 1977):** She will be equalizing **absolute gains**.
      $$ u_1 - d_1 = u_2 - d_2 = u_3 - d_3 $$
      *   *Implication:* This solution **does satisfy Monotonicity** for $n \ge 3$. However, it violates **Scale Invariance**. This means the result depends on the *units* of utility. In a business context, this requires interpersonal utility comparisons (e.g., is \$1M to Sibling 1 worth the same "happiness" as \$1M to Sibling 2?). If the mediator is using dollar values directly, she is implicitly assuming linear utility of money and equal risk preferences.

  **3. Recommendation**
  Your mediator's claim that KS "rules this kind of reversal out" is theoretically unsound for $n=3$.
  *   **Ask her:** "Are we equalizing the *percentage* of our ideal gains (Geometric KS), or the *absolute dollar amount* of gain over our disagreement point (Egalitarian)?"
  *   **If Geometric KS:** Acknowledge that while it is fairer than Nash regarding ideal points, Roth's theorem means the monotonicity guarantee is void. You may still see counterintuitive shifts if the business valuation (the frontier shape) changes asymmetrically.
  *   **If you want Monotonicity:** You must push for the **Egalitarian Solution** (equal absolute gains over disagreement). This is the only efficient, symmetric solution for $n \ge 3$ that preserves Monotonicity. However, you must agree that \$1 of gain is equal for all three of you (ignoring risk aversion differences).

  **Summary:** The mediator is likely using the Geometric KS extension. This sacrifices the very Monotonicity axiom she cited to reassure you. For three siblings, you cannot have Efficiency, Symmetry, and Monotonicity simultaneously. You must choose which property matters most. If preventing the "backwards" outcome is paramount, Monotonicity is the priority, and you should move toward an Egalitarian split of the surplus rather than a proportional one.
