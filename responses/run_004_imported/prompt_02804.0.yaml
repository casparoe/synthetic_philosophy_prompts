answer: |-
  This is a fantastic question, and given your background in field biology, you'll appreciate that the answer lies less in abstract philosophy and more in the messy details of how Darwin actually practiced his science versus how he is often mythologized.

  If you transported Charles Darwin to 1979 and sat him down with Gould and Lewontin, **he would almost certainly side with the pluralists**, though perhaps with less rhetorical venom than Gould. He would likely view the strict "adaptationist programme" of the 1970s (exemplified by optimality theorists) as a caricature of his own theory that ignored the cautions he explicitly built into *On the Origin of Species*.

  Here is the breakdown grounded in his texts, specifically focusing on the three pillars Gould and Lewontin relied upon: correlation of growth, the limits of selection, and the existence of non-adaptive traits.

  ### 1. The "Laws of Variation" (Origin, Chapter 5)
  The strongest evidence that Darwin was not a pan-selectionist is Chapter 5 of the *Origin*, titled "Laws of Variation." The 1979 adaptationists often treated natural selection as the *only* creative force, with variation being random raw material. Darwin, however, devoted an entire chapter to the idea that the *organism itself* biases variation.

  Darwin writes:
  > *"When we compare the individuals of the same variety or sub-variety of our older cultivated plants and animals, one of the first points which strikes us is, that they generally differ more from each other than do the individuals of any one species or sub-genus in a state of nature."*

  He goes on to argue that the conditions of life affect the organism directly. Crucially, regarding **Correlation of Growth**, he states:
  > *"Whole organisms are so bound together by such complex relations... that when a variation occurs in one part, and is accumulated through natural selection, other parts become modified."*

  He gives the example of cats with blue eyes and deafness, or birds with feathered feet and membranes between their outer toes. He explicitly notes that these correlations may have **no adaptive value** in themselves. He writes:
  > *"I have sometimes felt much difficulty in understanding the widespread occurrence of correlated variation... [but] it is notorious that each species is adapted to its place in nature."*

  If Darwin were in 1979, he would recognize the "spandrel" argument immediately. He already acknowledged that selecting for one trait (the arch) inevitably drags along another trait (the spandrel) due to developmental linkage, regardless of whether the second trait is useful.

  ### 2. Explicit Admission of Non-Adaptive Traits
  The hardline adaptationists of the 70s often operated under the assumption that if a trait exists, it must have a selective function. Darwin explicitly rejected this.

  In *The Variation of Animals and Plants Under Domestication* (Vol 2, p. 362), Darwin discusses parts that are variable and seemingly useless:
  > *"We see nothing in these varied conditions but definite laws acting... but we are ignorant of the cause."*

  More damning for the adaptationists is this passage from the *Origin* (Chapter 5):
  > *"As we see that those variations which under domestication appear at any particular period of life, tend to reappear in the offspring at the same period... I am far from supposing that this is the case with all variations... **many variations are of no service to their possessors.**"* (Emphasis added).

  He repeats this sentiment in a letter to Asa Gray (1860):
  > *"I am quite conscious that my speculations run quite beyond the bounds of true science... but I cannot help believing that selection has been the main, but not the exclusive, means of modification."*

  To the 1979 adaptationists, selection was the "exclusive" means of *adaptive* modification, and often the default explanation for *any* modification. Darwin would have corrected them: Selection is the main preservative force, but not the sole source of variation, and not every preserved trait is an adaptation.

  ### 3. The "Use and Disuse" Wildcard
  This is the tricky part. If Darwin landed in 1979, he wouldn't fit perfectly into *either* camp because he wasn't a Neo-Darwinist. He was a Lamarckian-Darwinian. He believed in the inheritance of acquired characteristics (Use and Disuse).

  In the *Origin*, he writes:
  > *"I think there can be no doubt that use in our domestic animals has strengthened and enlarged certain parts, and disuse diminished them; and that such modifications are inherited."*

  Why does this matter for the Spandrels debate? Because it makes him inherently pluralistic. The 1979 adaptationists were working within the Modern Synthesis (Genetics + Selection). Darwin's framework included:
  1.  Natural Selection
  2.  Sexual Selection
  3.  Direct action of environment
  4.  Use and Disuse
  5.  Correlation of Growth

  Gould and Lewontin were arguing for a pluralism that included developmental constraints and exaptation. Darwin would have agreed with the *logic* of pluralism, even if he disagreed on the mechanism (he wouldn't have known about developmental genetics, but he understood the phenomenological result). He would have told the adaptationists: *"You are ignoring half the causes of modification I listed in Chapter 5."*

  ### 4. Methodological Caution vs. "Just-So Stories"
  Gould and Lewontin's biggest beef was with the method: assuming adaptation first and asking questions later. Darwin's actual practice was far more cautious.

  Throughout the *Origin*, Darwin frequently admits when he *cannot* explain a trait via selection. Regarding the sterile castes in insects (a huge problem for his theory), he doesn't spin a just-so story. He admits it is a "special difficulty" and works through it logically, acknowledging it seems to annihilate his theory until he proposes kin selection (before the term existed).

  In *The Descent of Man*, regarding the human beard, he debates whether it is natural selection or sexual selection. He doesn't assume it *must* be survival-based. He writes:
  > *"It is not probable that the beard... was gained through sexual selection... nevertheless, this view is more probable than that it serves as a protection."*

  He weighs alternatives. The 1979 adaptationists were often accused of skipping this weighing process. Darwin would have found the "just-so stories" methodologically unsound. He valued the *vera causa* (true cause) approach. If you couldn't demonstrate the selective pressure, you couldn't claim adaptation.

  ### The Verdict
  Darwin would likely tell the 1979 Adaptationists: **"You have made my theory too rigid."**

  He would validate Gould and Lewontin's core thesis:
  1.  **Constraints exist:** (Correlation of Growth).
  2.  **Not everything is adaptive:** (Explicit statements on non-serviceable variations).
  3.  **Pluralism is necessary:** (His list of variation laws).

  However, as a retired field biologist, you know that Darwin was still a selectionist at heart. He might caution Gould against swinging the pendulum too far toward structuralism (which Gould was occasionally accused of). Darwin believed selection was the *primary* sculptor, even if the stone had pre-existing cracks (constraints).

  But on the specific question of the *Spandrels* paper? **Darwin is a Pluralist.**

  The "Adaptationist Programme" was a product of the hardening of the Modern Synthesis in the mid-20th century, where population genetics formalized selection into a mathematical ideal that sometimes lost touch with the organismal complexity Darwin described. Gould and Lewontin weren't inventing a new critique; they were actually recovering the nuance of Chapter 5 of the *Origin* that the Neo-Darwinians had glossed over.

  Darwin would have read the San Marco analogy, nodded at the "correlated growth" argument, and likely said, *"I told you so in 1859."*
