      Jordan: "But what if the distributions overlap significantly? If my estimate for ecological damage ranges from 'negligible' to 'existential threat,' and the poverty relief is 'significant but localized,' the expected values might be incomparable. In those cases, your theory tells me nothing. And if complex cluelessness is pervasive—as Lenman suggests it is—then consequentialism fails as an action-guiding theory for most non-trivial decisions. You're left guessing."

      Alex: "If the evidence is genuinely equivocal, then suspending judgment is the rational response. But that's not a failure of consequentialism; it's a feature of rationality under uncertainty. However, I'd push back on the idea that we're always left guessing. We often have robust heuristics. Historical data on industrialization suggests we can mitigate ecological risks while alleviating poverty. So the 'conflict' is often resolvable by looking at second-order evidence about our ability to manage downstream effects. You're assuming the chains are rigidly deterministic rather than manageable."

      Jordan: "That sounds like a retreat to short-termism disguised as robustness. You're saying, 'Look at the historical data,' but historical data doesn't capture novel risks. If you rely on near-term proxies because the long-term calculus is too murky, aren't you effectively abandoning the consequentialist commitment to evaluate acts by their actual outcomes? You're substituting 'likely good' for 'good.' If cluelessness forces you to ignore the long-term ramifications because they're too complex to weigh, you've basically conceded that the theory can't guide us where it matters most."

      Alex: "Not at all. Acknowledging epistemic limits isn't abandoning the axiology. If I use short-term proxies, it's because those proxies are the best available evidence for long-term value. Ignoring the long run because it's hard to calculate would be irrational. But insisting I must calculate the incalculable before acting is paralysis. The cluelessness objection demands a level of precision that no practical theory could meet. If consequentialism tells me to maximize expected value based on the best available model, even if that model admits wide error bars, it still guides action better than a theory that says 'nothing can be known.'"

      Jordan: "But if those error bars are wide enough to encompass both moral catastrophe and utopia, does 'maximizing expected value' mean anything? I worry that by narrowing the scope to what's weighable, you're just defining the problem away. You're left with a consequentialism that looks suspiciously like common sense, but without the metaphysical backbone to justify why common sense tracks the good."

      Alex: "Maybe. But if common sense tracks the best available evidence of the good, isn't that enough? The alternative is moral skepticism. I'd rather have a theory that guides action imperfectly than one that declares action impossible."

