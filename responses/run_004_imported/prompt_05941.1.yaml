      Alex: "Look, the symmetry argument handles the bulk of Lenman's worry. For every unforeseeable butterfly effect stemming from Action A, there's a counterpart in Action B. Since we have no reason to think the unknown future is systematically biased toward good or bad, the expected value of those unknowable ramifications is zero. They cancel out. That leaves the foreseeable, near-term consequences to do the normative heavy lifting."

      Jordan: "That works for simple cluelessness, where the effects are truly opaque. But Greaves's point about complex cluelessness is sharper. It's not that we can't trace the chains; it's that we can trace two distinct chains that point in opposite directions, and we lack a principled metric to weigh them. Suppose I'm deciding whether to fund a specific economic development project. Chain one: it lifts a community out of poverty, reducing suffering. Chain two: the resulting industrialization accelerates ecological collapse, increasing suffering. Both are identifiable. Both are plausible. But how do you compare the certain poverty relief against the probabilistic ecological risk over a century? The symmetry move doesn't apply here because the effects aren't random noise; they're structured conflicts."

