answer: |-
  The departmental lounge is dark, save for the green glow of the exit sign and the desk lamp Elias has pulled into the center of the room. A manila folder lies between them. Inside: one scholarship, two applicants, identical files.

  **Elias:** (Tapping a pen against the folder) We're done. The utility functions are isomorphic. Need, merit, projected outcome—it's a perfect mirror. If I give it to Chen, total welfare is $U$. If I give it to Patel, total welfare is $U$. If I flip a coin, expected welfare is $0.5U + 0.5U$, which is... still $U$. So why are you still holding the quarter?

  **Mara:** Because giving it to Chen is a loss for Patel. Giving it to Patel is a loss for Chen. Flipping the coin is a loss for neither, until the coin lands.

  **Elias:** That's poetic, but it's not decision theory. Before the coin lands, the *expected* loss is identical to the certain loss of the person who doesn't get it in the deterministic scenario. Harsanyi proved this. If we satisfy Pareto and the VNM axioms, the social welfare function is linear. It's a weighted sum. You can't slip a "fairness bonus" into the sum without double-counting.

  **Mara:** Harsanyi assumed the social observer is just a big individual. That's the mistake. Diamond showed that in cases of symmetric claims, the linearity breaks. Not because the math is wrong, but because the *moral input* is different. When I flip this coin, I'm not just maximizing expected utility. I'm honoring an equal claim.

  **Elias:** An "equal claim" is just a preference for a procedure. If Chen and Patel both prefer a world where the decision is randomized, then that preference is part of their utility function. Fold it in. Calculate the new expected utility. If the coin flip makes them feel better, then $U_{flip}$ is actually greater than $U_{certain}$. But if you stipulate, as we have, that they only care about the scholarship, then the coin is noise. It's ritual.

  **Mara:** It's not ritual, Elias. It's the difference between being *unlucky* and being *ignored*. If you pick Chen because you woke up on the right side of the bed, Patel has been treated as a non-entity. Her claim was weighed at zero. If I flip the coin, her claim is weighed at one-half. The outcome might be the same, but the justification respects her agency.

  **Elias:** But "respect" isn't a state of the world. It's not a consequence. Consequentialism—and Harsanyi's theorem is fundamentally consequentialist—says the only thing that matters is the final distribution of well-being. In both scenarios, one person is happy, one is disappointed. The distribution is identical. To say the coin flip is *strictly better*, as Diamond suggests, you have to admit you value something that isn't utility.

  **Mara:** I value the *ex-ante* equality. Harsanyi looks at the world from the end, *ex-post*. He says, "Look, someone won, someone lost." Diamond says, "Look at the moment of choice." In the deterministic case, the social planner is acting arbitrarily. In the lottery, the planner is acting impartially. Impartiality isn't just a feeling; it's a constraint on how we aggregate.

  **Elias:** Impartiality is satisfied by indifference! If the files are identical, I am indifferent between Chen and Patel. That *is* impartiality. To say I *must* flip a coin is to say I have a strict preference for randomization. And if society has a strict preference for randomization over two outcomes that yield the same utility sum, then society is risk-averse over the *identity* of the winner. But society isn't an agent who can be risk-averse. Society is the sum of the agents. And the agents, by stipulation, don't care about the coin.

  **Mara:** But *I* care. The administrator cares. The public cares. We have a shared intuition that arbitrary power is dangerous. If I have the power to give this to Chen without a reason, I have the power to give it to my nephew without a reason. The coin binds *me*. It restricts the planner's tyranny.

  **Elias:** (Leans back, rubbing his eyes) Now you're arguing from rule-utilitarianism. You're saying, "Use a coin because generally, humans are biased." But in this specific case, we *know* there is no bias. We know the files are symmetric. In this idealized vacuum, the coin adds nothing. It's a solution to a problem of epistemic limitation—we don't know who is better—but we *do* know. They are equal.

  **Mara:** No, we know their *attributes* are equal. We don't know who *deserves* it more, because desert might not be captured in the file. The coin acknowledges that the difference between them is morally irrelevant. By making the allocation depend on a morally irrelevant factor (chance), we acknowledge that neither has a superior claim. If I pick Chen, I am asserting a difference where none exists.

  **Elias:** You're asserting that the *process* has utility. Fine. Let's say there is a "fairness good." Let's call it $F$. So the utility of the lottery is $U + F$. But then Harsanyi wins again. We just plug $F$ into the equation. The social welfare function is still a sum. You haven't broken the theorem; you've just added a variable.

  **Mara:** I have broken it, because $F$ isn't additive. It's non-linear. Think about it. If I have two kidneys and two patients, I don't flip a coin. I give one to each. The marginal value of the coin flip depends on the scarcity. Diamond's point is that the social welfare function shouldn't be linear in individual utilities. It should be sensitive to the *distribution of chances*.

  **Elias:** But if you make it sensitive to the distribution of chances, you violate the Pareto principle. Imagine Chen and Patel are ruthless egoists. They say, "I don't care about the coin, I just want the money." If you force the coin flip because *you* think fairness matters, you are imposing a preference they don't have. You are violating their sovereignty over their own utility functions to satisfy your deontological itch.

  **Mara:** I'm not violating their sovereignty. I'm upholding the conditions under which their claims are valid. We are citizens, not just utility buckets. If I treat them as buckets, I can just pour the scholarship into Chen's bucket. If I treat them as persons, I have to offer them equal odds.

  **Elias:** "Persons" is doing a lot of heavy lifting there. If "personhood" implies a right to a probability, then that right must be grounded in something. If it's grounded in well-being, we're back to utility. If it's grounded in something else—dignity, rights—then you've abandoned the welfarist framework entirely. You can't have it both ways. You can't use Harsanyi's setup to define the utilities and then use Diamond's intuition to override the aggregation.

  **Mara:** Why not? Harsanyi's theorem is a conditional. *If* you accept these axioms, *then* you get utilitarianism. Diamond is saying: reject the axiom that says social rationality must mirror individual rationality. An individual choosing for themselves can be risk-neutral. A society choosing for its members has a duty of equal concern that looks like risk-aversion over welfare distribution.

  **Elias:** (Pauses, looking at the quarter in her hand) So you're saying the social planner should act *as if* they are risk-averse, even if the individuals aren't?

  **Mara:** I'm saying the planner represents the *relationship* between the individuals. The coin flip preserves the equality of that relationship. The deterministic choice severs it.

  **Elias:** But at what cost? If we start valuing procedures over outcomes, where does it stop? Do we flip a coin for every budget allocation? Every hiring decision? It introduces noise. It lowers the expected quality of the match if there's any tiny asymmetry we missed.

  **Mara:** It lowers the *efficiency*, maybe. But it increases the *legitimacy*. And legitimacy is a precondition for the system to function long-term.

  **Elias:** That's an empirical claim. Maybe people prefer decisive leadership. Maybe they hate the coin flip.

  **Mara:** Maybe. But in this case, right now, with these files... (She holds the quarter up. It catches the lamplight.) You can't tell me you feel nothing. You feel the weight of the arbitrary choice. You feel that picking Chen is an act of violence against the symmetry of the situation.

  **Elias:** I feel the weight of the responsibility. But I don't feel that the coin solves it. The coin just outsources the violence to chance. At least if I pick, I own the decision.

  **Mara:** No. If you pick, you own the *outcome*. If I flip, we own the *procedure*.

  **Elias:** (Sighs) Harsanyi would say you're conflating the *context of justification* with the *context of discovery*. The justification is the welfare sum. The discovery is how we get there.

  **Mara:** And Diamond would say the justification *is* the procedure when the sums are equal. When the scale balances perfectly, the only thing that can tip it without breaking the scale is chance.

  **Elias:** Or I just tip it. And accept that in a world of identical utilities, any choice is as good as any other. Indifference is a valid moral stance.

  **Mara:** Indifference is valid for *you*. It's not valid for *them*. For them, the difference between a 50% chance and a 0% chance is everything.

  **Elias:** But the *expected* chance is the same! In the deterministic world, ex-ante, they both had a 50% chance of me picking them, assuming I'm randomizing my arbitrary choices!

  **Mara:** (Smiles sadly) But you're not randomizing, Elias. You're sitting there looking for a reason to pick Chen. I can see you doing it. You're scanning for a tie-breaker. A surname alphabetization. A gut feeling. That's not randomization. That's hidden bias. The coin makes the randomness public. It makes the equality visible.

  **Elias:** So it's theater.

  **Mara:** It's transparency.

  **Elias:** (Silence stretches. The hum of the refrigerator kicks in.) If I let you flip it, I'm admitting that my aggregation function is incomplete. That there's a variable I can't quantify.

  **Mara:** And if I don't flip it, I'm admitting that efficiency trumps equality when the cost is zero.

  **Elias:** The cost isn't zero. It's the integrity of the model.

  **Mara:** The cost is Patel's dignity.

  **Elias:** (He pushes the folder toward her.) I can't stop you. The theorem doesn't forbid the coin. It just says the coin doesn't add value.

  **Mara:** (She places the quarter on the edge of the folder.) And I can't stop you from believing that. The theorem doesn't forbid the intuition. It just says the intuition isn't rational.

  **Elias:** Which is it, then? Is the model wrong, or is the intuition?

  **Mara:** (She hovers her thumb over the coin.) Maybe the model describes a world of angels, and the intuition describes a world of people.

  **Elias:** Or maybe the intuition is a ghost, and the model is the machine.

  **Mara:** (She flicks the coin. It spins, a silver blur in the dim light.) We'll know when it lands.

  **Elias:** No. We won't. That's the whole problem.

  *(The coin clatters on the table, spinning down. They both watch it, neither leaning forward, neither looking away.)*
