answer: |-
  The dispute you describe is a classic instance of the tension between intellectual history and the history of ideas: does a text belong to its own time, or does it belong to the lineage of truths it inadvertently articulated? In the case of George Berkeley's *The Querist* (1735–1737), the temptation to claim him as a proto-Modern Monetary Theorist (MMT) is strong, for Berkeley writes with a clarity about the conventional nature of money that rivals Knapp or Keynes. However, after weighing the textual evidence against the historical context, my verdict is this: **Your skepticism is the more historically defensible position, though your friend has correctly identified Berkeley's ontological insight.**

  To label *The Querist* as a forerunner of MMT is an anachronistic projection that conflates a theory of *what money is* with a theory of *how fiscal states function*. Berkeley is indeed a nominalist about money—he anticipates the chartalist insight that money is a social artifact rather than a commodity—but he lacks the specific fiscal-sociological machinery (specifically the tax-driven money hypothesis) that defines Chartalism and MMT. He is best read not as a macroeconomic theorist, but as a moral philosopher using monetary reform as a tool for social engineering.

  ### The Allure of the "Ticket"

  Your friend's argument rests on the most striking passages of *The Querist*, where Berkeley explicitly demystifies specie. In Query 34, he asks, "Whether money be not really only a ticket or counter?" and in Query 41, "Whether the real use of money be not to convey and record power?" These are undeniably chartalist sentiments. In an era when mercantilist orthodoxy equated wealth with the accumulation of gold and silver, Berkeley's insistence that money is a token of account, valuable only insofar as it circulates industry, is radical.

  Furthermore, Berkeley advocates for a national bank (Query 130 et seq.) to issue paper currency in a "coin-starved" Ireland. He recognizes that the sovereign authority has the capacity to designate what counts as money. If Chartalism is defined simply as the claim that money is a creature of the state rather than a market-evolved commodity, Berkeley certainly qualifies. Your friend is right to see a lineage here: Berkeley understands that value is not intrinsic to the metal but is imposed by the convention of the community and the stamp of authority.

  ### The Moral Teleology vs. Fiscal Capacity

  However, recognizing that money is a ticket is not the same as possessing a theory of sovereign fiscal capacity, which is the core of MMT. This is where your argument holds greater weight. MMT posits that sovereign currency derives its value and demand primarily from the state's power to tax in that currency. The state spends first, creating the currency, and taxes later, creating the demand for it to settle debts to the state.

  Berkeley's *Querist* does not articulate this circuit. His concern is not the management of aggregate demand or the mechanics of tax liabilities, but the moral revitalization of the Irish populace. His queries are saturated with the language of "industry," "idleness," and "virtue." For Berkeley, money is the "oil" that makes the wheel of industry turn (Query 36), but the goal is the turning of the wheel (labor and moral improvement), not the management of the oil supply for macroeconomic stability.

  When Berkeley proposes a national bank, he often suggests backing the currency with land or specific public works, rather than purely on the credit of the sovereign's taxing power. This aligns him more closely with the "Real Bills" doctrine or agrarian credit schemes of the 18th century than with the fiat money theory of Knapp. Berkeley wants to unlock the latent labor of the Irish poor; he views the scarcity of coin as a physical barrier to moral action. His proposal is a remedy for a specific local pathology (absentee landlords draining specie, a paralyzed labor force), not a general theory of the state's monetary sovereignty. To read MMT into this is to mistake a moral prescription for a structural description of the modern fiscal state.

  ### The Query Form and Theoretical Thinness

  The form of *The Querist* itself supports your caution. Berkeley writes in questions, not declarations. This Socratic method allows him to probe assumptions without committing to a rigid system. While this opens the text to various interpretations, it also means the text lacks the theoretical apparatus required to sustain the MMT reading.

  For example, while Berkeley asks if the sovereign can appoint money, he does not rigorously explore the limits of that power. He does not discuss inflation in the modern sense, nor does he outline a theory of unemployment based on insufficient net government spending. His "theory" is thinner than your friend suggests. It is a series of intuitions about credit and circulation, brilliant for their time, but not a systemic account of fiscal capacity. To treat these queries as a coherent proto-MMT framework requires stitching together disparate thoughts and ignoring the gaps where modern theory would demand rigorous mechanics.

  ### A Note on Metaphysics

  You asked to briefly consider whether Berkeley's monetary nominalism aligns with his immaterialism. There is a compelling continuity here. Just as Berkeley argued in *A Treatise Concerning the Principles of Human Knowledge* that physical objects are collections of ideas perceived by the mind (*esse est percipi*), in *The Querist* he argues that money is a collection of social relations and conventions perceived by the market.

  In both cases, he rejects "material substance" (whether gold atoms or mind-independent matter) in favor of functional relations. Money, like the physical world, is a sign system. However, this metaphysical consistency does not validate the MMT reading. One can be a nominalist about money (agreeing with your friend) without believing that the state should manage employment through deficit spending (the MMT policy conclusion). Berkeley's idealism leads him to see money as a mental/social construct, but it does not necessarily lead him to a theory of state finance.

  ### The Verdict

  So, who is right?

  **Your friend is right about the ontology, but you are right about the teleology.**

  If the question is, "Did Berkeley understand that money is a social convention and not a commodity?" your friend wins. Berkeley's "ticket-or-counter" view is a genuine, rare, and sophisticated anticipation of Chartalist ontology. He saw through the mercantilist fetishization of gold.

  However, if the question is, "Is *The Querist* a forerunner of MMT?" you win. MMT is not merely the claim that money is a convention; it is a specific theory about the operational relationship between the treasury, the central bank, and taxation. Berkeley lacks this. He is concerned with *credit* as a means to *industry*, not *currency* as a means to *fiscal sovereignty*.

  For your friend's reading to be fully defensible, one would have to show that Berkeley viewed taxation as the primary driver of money demand, or that he viewed the sovereign's spending power as unlimited by revenue constraints. The text does not support this. For your reading to be fully defensible, you must concede that Berkeley's insight into the conventional nature of money is theoretically significant, even if his aims were moral and local.

  **Conclusion:**

  *The Querist* is best read as a work of **moral economy** that utilizes a **nominalist theory of money** to achieve its ends. It is a precursor to Chartalism in the same way that a sketch of a bird is a precursor to aerodynamics: it identifies the object of study correctly, but lacks the engineering to make it fly. To claim it as a forerunner of MMT is to credit Berkeley with a blueprint for a machine he was not trying to build. He was trying to build a virtuous society, using paper currency as his mortar. Your insistence on the text's narrower, moralized aims preserves its historical integrity, even if it denies Berkeley the glory of predicting the 20th-century monetary system.
