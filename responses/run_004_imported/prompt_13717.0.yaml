  5.  **Polishing the Dialogue:**
      *   Make sure Govinda doesn't sound like a strawman. His objection about action (pragmatics) is a classic Nyaya move.
      *   Make sure Vardhamana doesn't sound mystical. He needs to sound logical. The "indexing" argument is key.
      *   Ensure the flow is natural. Use pauses, gestures, references to the setting.

  6.  **Self-Correction during drafting:**
