answer: |-
  The dust in the Ministry of Transition tasted of iron and burnt paper. Kaelen rubbed his eyes, the fluorescent light humming overhead like a trapped insect. Outside, the statues of the Unity Council were being draped in sheets, but in here, the bureaucracy of the fallen regime remained intact, filed in neat, terrifying rows.

  Kaelen was a Senior Clerk of Validation. His job was to stamp the past. Specifically, he had to categorize the convictions made under the Council's emergency decrees so the new Republic could decide on restitution.

  The file on his desk was thin. Case 8940.
  **Accuser:** Varrick.
  **Accused:** Elara (no relation).
  **Charge:** Violation of Decree 77 (Resource Hoarding).
  **Outcome:** Elara imprisoned for six months; her textile shop transferred to Varrick.

  Elara was now free, standing outside his office door, waiting. Varrick was inside, sitting in the wooden chair, wiping sweat from his brow.

  "I acted within the statute," Varrick said, his voice tight. "Decree 77 was posted in the town square. It said excessive accumulation of fabric was a crime against the state. She had three bolts of silk hidden in her cellar. I reported it. I followed the law."

  Kaelen looked at the copy of Decree 77 in the file. It was pristine. It bore the official seal of the Council, the signature of the Minister of Supply, and the date of enactment. It had been published in the official gazette. By every procedural metric, it was valid law. It commanded obedience, and Varrick had obeyed.

  "But the thresholds," Kaelen said softly.

  Varrick shifted. "The thresholds were managed internally."

  Kaelen opened the second folder. This one contained the enforcement memos. They were handwritten on scrap paper, unsigned, passed from regional officers to informants. One memo said three bolts were excessive. Another, dated a week later, said one bolt was sufficient for arrest. There was no consistency. No public guidance. A citizen could not know where the line was drawn unless they were the one drawing it for someone else.

  "The law was a trap," Elara's voice came from the hallway. She wasn't shouting; she sounded tired. "You didn't report me because of the fabric. You wanted the shop. You used their secrets to kill me."

  "I used the rules!" Varrick snapped, turning to Kaelen. "You can't punish me for following the rules that existed. If you do, you're just saying the new Republic punishes people for what was legal yesterday. That's retroactivity. That's tyranny."

  Kaelen looked at the two stamps on his desk.

  The first stamp read: **VALID THEN, VOID NOW.**
  Using this stamp acknowledged that Decree 77 was law. It meant Varrick had done nothing wrong at the time. To punish him now, to take the shop back, would require a new law passed today that reached backward in time. It was honest. It admitted that the Republic was breaking the legal continuity to achieve justice. It said: *Yes, that was law, and we are changing it.*

  The second stamp read: **NULL AB INITIO.**
  Using this stamp declared that Decree 77 was never law at all. Because the enforcement guidelines were secret, contradictory, and arbitrary, the decree lacked the internal morality required of law. It was merely power masquerading as rules. If Kaelen used this stamp, Varrick wasn't being punished retroactively. He was being punished for acting on a command that had no legal force. It said: *No, that was never law. The law was always what you violated.*

  Kaelen picked up the file. He looked at Decree 77 again. The seal was embossed. The ink was official. It looked like law. It functioned like law. People had ordered their lives around it, or died because of it. To say it wasn't law felt like a fiction, a way to soothe the conscience of the new regime by pretending the nightmare never had a legal structure.

  But then he looked at the memos. The handwritten scraps. The arbitrary lines. A system where the rules are hidden cannot guide conduct; it can only terrorize. If law is meant to subject human conduct to rules, then secret rules are not law. They are weapons.

  Varrick leaned forward. "If you stamp that null, you're saying there was no government. No order. Just chaos. I relied on that order."

  "And if you stamp it valid," Elara said from the door, "you're saying justice requires a lie. You're saying we must break our own rules to fix theirs."

  Kaelen dipped his pen into the inkwell. The room was silent save for the hum of the light. He understood Hart's worry: that calling unjust rules "not law" confuses what law *is* with what law *ought to be*. He understood Fuller's hope: that a system which fails to be general, public, or consistent forfeits the title of law entirely.

  He looked at Varrick, who had used the shell of legality to commit a theft. He looked at Elara, who had been crushed by it. He looked at the stamps.

  If he chose the first, he preserved the integrity of the concept of law, but admitted the Republic must act retroactively to punish a moral crime. If he chose the second, he punished the crime directly, but risked turning the court into a moral tribunal that rewrites history.

  Kaelen positioned the handle over the judgment sheet. The paper was thick, waiting to bear the weight of the state's authority. He thought about the purpose of the Ministry. Was it to preserve the continuity of the state, or to ensure that the state was worthy of continuity?

  He took a breath. The ink glistened on the nib. He lowered his hand. The stamp struck the paper with a heavy, definitive thud, sending a small cloud of dust into the light.

  He did not look up as he slid the paper across the desk. He simply waited for them to read the justification he had written beneath the mark, knowing that the words would hold enough truth for one side, and enough danger for the other.
