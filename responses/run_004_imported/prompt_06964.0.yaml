      *   *Section 1: The Statistician's Mind.* Focus on "overwhelming evidence." To Turing, that meant $p < 0.05$ (roughly). If later analysis shows $p$ was manipulated, the evidence vanishes.
      *   *Section 2: The "Telepathy-Proof Room".* Analyze the geometry vs. time. This is a strong logical critique.
