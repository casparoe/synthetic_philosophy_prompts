  **Jordan:** Or that compensation is required for risk bearing. You're ignoring Grossman-Stiglitz. If prices fully reflected all private information, no one would incur the cost to acquire it. The market would become informationally inefficient. Therefore, a certain level of "noise" or divergent interpretation isn't a bug; it's the fuel. You call it irrationality; I call it the cost of discovery.

