answer: |-
  Based on a close reading of Frege's mature texts, particularly "The Thought" (1918) and "On Sense and Reference" (1892), along with his enduring commitment to anti-psychologism, the verdict is clear: **Frege would reject the two-dimensionalist apparatus.**

  While he would likely acknowledge that two-dimensionalism successfully captures the *phenomena* of cognitive significance that Kripke threatened, he would judge the theoretical cost to be unacceptable. Specifically, he would argue that grounding semantics in "epistemic possibility" and "primary intensions" collapses the objective "Third Realm" of Thoughts back into the subjective realm of human cognitive access, violating the core ontological distinction of his later philosophy. Furthermore, he would view the two-dimensionalist handling of indexicals as a formalization of the very defect in natural language he sought to eliminate, rather than a solution to it.

  Here is the defense of this verdict, grounded in Frege's specific doctrines.

  ### 1. The Ontological Mismatch: Third Realm vs. Epistemic Scenarios

  The most decisive reason for Frege's rejection lies in the ontological status of the semantic values. In "The Thought," Frege is meticulous in distinguishing the *Thought* (the sense of a sentence) from any mental act of grasping it. Thoughts are "timeless," "immutable," and belong to a "third realm" distinct from both the external physical world and the internal psychological world of *Vorstellungen* (ideas).

  Two-dimensional semantics, particularly in the Chalmers-Jackson tradition, defines the primary intension via **epistemic possibility**. A primary intension maps "epistemically possible scenarios" to extensions. These scenarios are typically individuated by what an idealized reasoner can or cannot rule out *a priori*.

  Frege would identify this immediately as a resurgence of the psychologism he spent his career combating. For Frege, the *Sinn* (sense) determines reference objectively, independent of whether any thinker can actually grasp that determination.
  *   **Frege's View:** The Thought that "2 + 2 = 4" is true timelessly, regardless of whether a mind exists to verify it *a priori*. Its truth conditions are not constituted by our epistemic access to them.
  *   **2D View:** The primary intension is constituted by conditions of *a priori* knowability.

  By tying the "Fregean" dimension of meaning to *epistemic* scenarios, two-dimensionalism makes the content of a thought dependent on the cognitive capacities of a reasoner. For Frege, this is a category error. In "The Thought," he writes that a thought is "not the private property of the person who thinks it," but two-dimensionalism defines the primary intension precisely by how a specific (even if idealized) thinker relates to a scenario. Frege would argue that this does not rescue the objectivity of *Sinn*; it merely objectifies the subjective conditions of human understanding. He would likely classify the "primary intension" not as a *Gedanke* (Thought), but as a rule for how minds *associate* words with the world—a psychological law, not a logical one.

  ### 2. Indexicals: Elimination vs. Codification

  Your prompt notes Frege's handling of "today" and "yesterday" in "The Thought." This is a crucial pivot point where Frege's intuitions diverge sharply from Kaplan and the two-dimensionalists.

  *   **Kaplan/2D Approach:** The meaning of "today" has a *character* (a function from context to content) and a *content* (a proposition that is true or false relative to that context). The content itself is context-sensitive.
  *   **Frege's Approach:** The *Thought* expressed must be timeless. If the words "Today is fine" express a Thought on Monday, that *very same Thought* cannot be expressed on Tuesday using the same words. To express the *same Thought* on Tuesday, one must say "Yesterday was fine."

  Frege writes: *"If someone wants to express today the thought he expressed yesterday using the word 'today', he will replace this 'today' with 'yesterday'."* He concludes that *"the time of utterance is part of the expression of the thought."*

  For Frege, the indexicality is a defect of natural language that requires **supplementation** to yield a complete, timeless Thought. The goal is to purge the context from the *object of judgment*. The Thought itself does not change; only the linguistic clothing required to express it changes.

  Two-dimensional semantics, conversely, accepts context-sensitive propositions as legitimate semantic contents. It builds the context-dependence into the semantics (via the "character" or the context parameter of the primary intension). Frege would view this as conceding that Thoughts themselves are mutable or context-bound, which contradicts his insistence in "The Thought" that Thoughts are "immutable." He would argue that Kaplan's "content" is not a true Fregean Thought, but a fragment of a Thought that requires the thinker's location to be completed. While 2D semantics treats this fragmentation as a formal feature to be modeled, Frege treats it as a practical problem to be overcome in a proper *Begriffsschrift* (conceptual notation). He would see the two-dimensional machinery as an elaborate system for managing the imperfections of natural language, rather than a rigorous analysis of the Thoughts themselves.

  ### 3. The "Aristotle" Footnote and the Normative Aim

  In "On Sense and Reference," Frege admits that different speakers may associate different senses with "Aristotle" (e.g., "teacher of Alexander" vs. "born in Stagira"). However, he explicitly calls this an **"imperfection of natural language"** which "cannot be avoided," but which "ought to be avoided" in a logically perfect language.

  Two-dimensionalism often treats this variation as a theoretical feature: the primary intension captures the descriptive cluster associated with the name by a speaker, while the secondary intension captures the rigid reference. It legitimizes the variation by assigning it a semantic role.

  Frege would reject this legitimization. His project was **normative**, not descriptive. He was not interested in cataloging how speakers *happen* to associate descriptions with names; he was interested in how language *must* be structured to preserve truth and valid inference. By creating a formal apparatus that accommodates the variation in senses (via the primary intension), two-dimensionalism validates the very ambiguity Frege sought to eliminate.

  Furthermore, regarding Kripke's specific challenge (rigid designation): Frege would likely argue that if a name is rigid, its *Sinn* cannot be a contingent description (whether epistemic or otherwise). If "Hesperus" refers to Venus in all possible worlds, the *Sinn* must present Venus *as* the rigid designator. Two-dimensionalism attempts to have it both ways: the name is rigid (secondary intension) but has a descriptive cognitive significance (primary intension). Frege would likely argue this splits the *Sinn* into two incompatible things: one that determines reference objectively (which must be rigid if the name is) and one that tracks cognitive access (which is contingent). For Frege, *Sinn* is the mode of presentation of the reference. If the reference is fixed rigidly, the mode of presentation must reflect that necessity. An epistemic intension that allows "Hesperus" to pick out a different object in an epistemically possible scenario (where the evening star is not the morning star) would, for Frege, simply be a *different Thought*, not a different dimension of the *same* name's meaning.

  ### Conclusion

  Frege would view two-dimensional semantics as a sophisticated piece of **psychology** masquerading as **logic**.

  He would acknowledge that the two-dimensionalists have correctly identified the data: that "Hesperus is Phosphorus" is informative, and that "I am here" behaves differently from "Frege is here." However, he would argue that their explanation locates these features in the wrong place. By grounding the "Fregean" dimension in *epistemic* possibility and *a priori* access, they tether meaning to the mind of the reasoner, violating the independence of the Third Realm. By treating context-sensitive contents as legitimate semantic values, they abandon the requirement that Thoughts be timeless and immutable.

  Frege's verdict would be that two-dimensionalism succeeds in saving the phenomena of ordinary language use only by sacrificing the ontological purity of the Thought. He would insist that we do not need a two-dimensional semantics; we need a better language—one where "today" is eliminated in favor of dates, and "Aristotle" is replaced by a fixed description or a logically proper name—so that the Thoughts we express are as objective and context-free as the truths they depict. The two-dimensionalist rescue attempt would strike him not as a rigorization of his theory, but as a capitulation to the psychologism he dedicated his life to eradicating.
