          *   This is the Harmonic Series, which *diverges* to infinity.
      *   **Conclusion:** The series is *conditionally convergent*, not absolutely convergent.
      *   **Measure Theory/Probability Definition:** In rigorous probability theory (Kolmogorov), the expected value $E[X]$ is defined as $\int X dP$. For discrete variables, this requires *absolute convergence* ($\sum |x_i| p_i < \infty$) for the expectation to be well-defined and independent of the order of summation. If $\sum x_i^+ p_i = \infty$ and $\sum x_i^- p_i = \infty$, the expectation is undefined (often denoted as undefined or not existing), because $\infty - \infty$ is indeterminate.
