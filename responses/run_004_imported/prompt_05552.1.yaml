  2.  **Mathematical Verification:**
      *   Let's write out the terms of the expected value sum.
      *   Term $n$: $p_n \cdot x_n = \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \frac{(-1)^{n+1}}{n}$.
      *   So, $E[X] = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} = 1 - 1/2 + 1/3 - 1/4 + \dots$
      *   This is the *Alternating Harmonic Series*.
      *   Does this series converge? Yes, by the Alternating Series Test. It converges to $\ln(2)$.
      *   *Wait, hold on.* The user says their group got *different numbers* depending on the order of summation.
      *   Why would they sum in a different order?
          *   Standard definition of Expected Value for a discrete random variable: $E[X] = \sum_{x \in \text{Range}} x \cdot P(X=x)$.
          *   Here, the range is countable ($n=1, 2, 3...$). The natural ordering is by $n$.
          *   However, if the series is *conditionally convergent*, the Riemann Rearrangement Theorem says you can rearrange terms to sum to anything.
          *   Is the series absolutely convergent?
