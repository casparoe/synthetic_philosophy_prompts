      *   *Molyneux's Clue:* Molyneux says the man doesn't know that "a protuberant angle... shall appear to his eye as it does in the cube." This suggests the *appearance* (visual idea) is different from the *pressure* (tactile idea).
      *   *Synthesis:* The "Idea of Figure" in Chapter V is an abstract capacity. The specific instances in Chapter IX are concrete sensory inputs. The "experience" is the bridge between the concrete inputs to allow the abstract capacity to function across modalities.

  7.  **Final Polish:** Ensure the tone is academic yet accessible (seminar level). Use specific Lockean terminology (primary qualities, simple ideas, judgment, association). Structure with clear headings. (This matches the structure of the final output).

  8.  **Final Check against User Prompt:**
