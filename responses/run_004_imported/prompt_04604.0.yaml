      *   **The Tension:** In Chapter V, Locke says ideas like "figure" are had by *more than one sense* (sight and touch). This suggests a single idea accessible via different channels. In Chapter IX (Molyneux), Locke agrees that a newly sighted man *cannot* identify a cube by sight alone, despite knowing it by touch, because he lacks the *experience* linking the two sensory inputs.
