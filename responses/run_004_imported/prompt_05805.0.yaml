      *   **The Dispositionalist Reply:** I mean *plus* because I am disposed to answer $x + y$ for any query.
      *   **Kripke's Counter 1 (Finitude):** I am a finite being. I cannot compute arbitrarily large numbers. So I have no disposition for numbers beyond my capacity.
      *   **Kripke's Counter 2 (Normativity):** Dispositions describe what I *do*, not what I *ought* to do. If I make a mistake, my disposition is to make that mistake. But meaning implies correctness conditions.
