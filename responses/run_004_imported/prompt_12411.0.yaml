answer: |-
  **The Unfoundable Foundation: Why the Boundary Problem Is Insoluble**

  The question of who constitutes "the people" is not merely a preliminary administrative task for democratic theory; it is the abyss over which the theory hangs. As Frederick Whelan famously articulated, any attempt to define the boundaries of the *demos* using democratic procedures succumbs to a vicious regress: the procedure itself requires a bounded group to authorize it. If the people must decide who the people are, they must already exist to make that decision. Sofia Näsström has rightly extended this to the constituent power, noting that if a people cannot author its own constitution without presupposing its own existence, the foundational act of democracy is necessarily undemocratic.

  In response, theorists have proposed normative principles to cut the Gordian knot. Robert Goodin's All-Affected-Interests (AAI) principle suggests that anyone affected by a decision should have a say. Arash Abizadeh and others propose the All-Subjected Principle, arguing that membership belongs to those subject to coercive jurisdiction. My verdict, after weighing these contenders against the logical force of the regress, is definitive: **The boundary problem is genuinely insoluble in principled democratic terms.** Neither AAI nor the All-Subjected Principle escapes the regress; they merely relocate it or dissolve the very concept of a bounded *demos* they seek to justify. Recognizing this insolubility is not a counsel of despair, but a necessary condition for a mature democratic theory that accepts its own contingent foundations.

  To see why the proposed solutions fail, we must first dispatch the most prominent contender: Goodin's All-Affected-Interests principle. Goodin embraces the radical implication of AAI: because almost all decisions have ripple effects in an interdependent world, the *demos* for most decisions should be global. While morally appealing in its inclusivity, AAI fails as a solution to the boundary problem because it dissolves the object it seeks to define. Democracy requires a decision-making body capable of agency and closure. If the *demos* expands to include everyone with a stake in the outcome, and outcomes are globally interconnected, the *demos* becomes coextensive with humanity for almost all non-trivial matters. This does not solve the problem of bounding the *demos*; it abolishes the boundary entirely. A global *demos* without a global state is a theoretical phantom, incapable of the collective agency required for democratic self-rule. AAI resolves the regress by making the boundary universal, but in doing so, it renders the specific democratic unit—the site of the boundary problem—obsolete. It is a *reductio*, not a solution.

  The All-Subjected Principle is more robust because it ties membership to the specific exercise of political power rather than the vagaries of causal influence. Abizadeh argues that because border controls coerce would-be immigrants, those outsiders must be part of the *demos* authorizing the borders. This is a powerful critique of unilateral exclusion. However, the All-Subjected Principle does not escape Whelan's regress; it merely shifts the locus of the circularity from "who votes" to "who counts as subjected."

  Consider the application of the principle. To determine who is "subjected" to a jurisdiction's coercion, an interpretation of the scope and nature of that coercion is required. Who makes this determination? If the existing *demos* decides who counts as subjected, we are back to the original circularity: the bounded group is defining its own boundaries under the guise of applying a principle. If an external arbiter decides, democracy is compromised by a non-democratic authority. Furthermore, as Abizadeh's own argument implies, if the *demos* must include everyone subjected to border enforcement, and border enforcement is necessary to maintain a bounded *demos*, the principle destabilizes the possibility of a bounded *demos* altogether. It suggests that no state can legitimately control its borders without the consent of those outside them. While this may be a valid moral critique of state sovereignty, it does not solve the *democratic* boundary problem; it concludes that a bounded democratic *demos* is inherently illegitimate. This is a coherent moral position, but it admits that the boundary problem has no solution *within* the framework of bounded democracy.

  Therefore, we must accept the harder truth: the boundary problem is insoluble in foundational terms. There is no democratic procedure, nor any normative principle applicable via democratic procedure, that can non-circularly justify the initial boundaries of the *demos*. The *demos* is not a pre-political entity discovered by theory, nor a logical output of a democratic formula. It is a political fact established through contestation, history, and often force. The regress arises because we demand that democracy be self-grounding—that it pull itself up by its own bootstraps. But no political system is self-grounding. The boundary of the *demos* is always, at its origin, an undemocratic decision (a revolution, a treaty, a conquest, a constitutional moment) that is only retrospectively legitimized by the democratic practice that follows.

  The strongest objection to this conclusion is that it invites nihilism or legitimizes exclusionary nationalism. If the boundary problem is insoluble, critics argue, then any existing boundary is as good as any other, and democratic theory loses its critical bite against arbitrary exclusion. If we cannot say *principledy* who should be in the *demos*, do we not surrender to the status quo?

  This objection misunderstands the implication of insolubility. Acknowledging that the *foundation* is undemocratic does not mean the *practice* is unconstrained. Precisely because the boundary cannot be logically fixed, it remains permanently open to political contestation. The insolubility of the boundary problem is not a license for exclusion, but a mandate for ongoing democratic iteration. Since no founding moment can permanently justify the *demos*, the legitimacy of the boundary depends on the continuous willingness of the *demos* to renegotiate its own extension in light of new claims of subjection or affectedness.

  This is where the All-Subjected Principle retains value, not as a logical solver, but as a normative horizon. We cannot use it to calculate the correct boundary once and for all (because the calculation itself requires a boundary). But we can use it to critique existing boundaries. When a group is clearly subjected to coercion without representation, the insolubility of the foundational problem does not excuse the injustice; it highlights that the *demos* is failing to perform the ongoing work of legitimation. The lack of a foundational solution means the work of boundary-drawing is never finished. It must be revisited whenever the fit between the ruled and the rulers becomes untenable.

  Thus, the boundary problem is insoluble because democracy is not a machine that generates its own inputs. It is a practice that presupposes a community which it simultaneously constitutes. To demand a non-circular, principled solution is to demand that politics be replaced by logic. The verdict for your seminar should be this: Stop looking for the key that unlocks the boundary problem. There is no key. There is only the perpetual, contentious, and necessarily imperfect work of arguing over the lock. Accepting this does not weaken democratic theory; it saves it from the delusion that it can ever be free of politics.
