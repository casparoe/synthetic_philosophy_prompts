      *   *Correction on Move 4:* Parfit did argue for "Rational Irrationality," but modern FDT proponents argue this is a bug in CDT, not a feature of reality. I should note that Wes is arguing *against* Parfit's conclusion using modern tools Parfit didn't have (TDT/FDT).
      *   *Move 5 Nuance:* If the pill is secret *after* arrival, the predictor couldn't have predicted it. So the prediction was based on the pre-pill disposition. If you take the pill, you prove the predictor wrong (impossible) or you were never the type to be picked up. Wes's trap works if we assume the agent *can* choose.

