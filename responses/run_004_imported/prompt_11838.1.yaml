          *   *Analysis:* This is a stability test. If the theory recommends self-modification to a theory that defects, it's dynamically inconsistent. Wes is arguing for Reflective Consistency.
          *   *Verdict:* Wes has a strong point on dynamic consistency. If a theory tells you to change yourself to violate the theory, that's a bug.

