      *   *Follow-ups:* Make them punchy. "If the answer is X, then Y follows, which seems problematic."

  7.  **Final Review against constraints:** 8-10 questions? Yes. Follow-ups included? Yes. Specific topics covered? Yes. No escape hatches? I will design them to be tight.

