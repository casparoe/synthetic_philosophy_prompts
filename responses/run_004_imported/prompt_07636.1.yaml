      *   **Subject:** Her "precautionary, marker-based framework" for identifying "sentience candidates."
      *   **Key Features of Framework:** Uses markers (nociceptors, flexible avoidance, trade-offs, analgesic response); covers decapod crustaceans and some insects; theory-light (doesn't require a settled theory of consciousness).
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Go beyond restating the framework.
          *   Include specific questions on:
              1.  Theory-light vs. smuggling in substantive theory via markers.
              2.  Asymmetry argument (false negatives vs. false positives/costs of over-attribution).
              3.  Insects (minimal/different nervous systems).
              4.  Closing question: Evidence to *drop* a species (falsifiability).
          *   Include a follow-up for each question keyed to the likely answer.

  2.  **Deconstruct the Philosopher's Position:**
      *   *Core Claim:* We don't need to know *what* consciousness is to know *where* it might be.
      *   *Method:* Look for functional/behavioral/neural markers associated with suffering in humans/vertebrates.
      *   *Ethical Stance:* Precautionary Principle. Better to treat a non-sentient being as sentient than vice versa.
      *   *Controversy:* Extends to insects (very small brains, different architecture).

  3.  **Drafting Questions (Iterative Process):**

      *   *Question 1 (The Theory-Light Challenge):* Need to ask if choosing markers implies a theory.
          *   *Draft:* You say you don't need a theory of consciousness, but aren't nociceptors a theory?
          *   *Refinement:* Make it sharper. Does selecting specific functional markers implicitly commit you to a functionalist or neurobiological theory of consciousness, undermining the "theory-light" claim?
          *   *Follow-up:* She will likely say "No, these are correlations, not definitions." Push on whether correlation implies causation in this context.

      *   *Question 2 (The Asymmetry/Cost Challenge):* Need to address the cost of false positives.
          *   *Draft:* Isn't it expensive to protect bugs? What about resources?
          *   *Refinement:* The precautionary principle relies on the asymmetry of error (false negatives are worse). But does this ignore the moral and practical costs of false positives, like diverting conservation funds from mammals or making sustainable farming impossible?
          *   *Follow-up:* She will likely argue "Moral status trumps cost." Push on the "dilution" effect—if everything is sentient, does the concept lose force?

      *   *Question 3 (The Insect Challenge):* Need to focus on nervous system differences.
          *   *Draft:* Insects have tiny brains. How can they feel pain?
          *   *Refinement:* Insect nervous systems are decentralized and minuscule compared to vertebrates. At what point does structural divergence suggest a different *kind* of processing that mimics pain markers without the subjective experience?
          *   *Follow-up:* She will likely cite the functional markers again. Push on whether function without analogous structure is enough for *phenomenology*.

      *   *Question 4 (Falsifiability - Required Closing):* What changes her mind?
          *   *Draft:* What would make you say they aren't sentient?
          *   *Refinement:* What specific empirical finding would compel you to remove a species, like honeybees or crabs, from the "sentience candidate" list?
