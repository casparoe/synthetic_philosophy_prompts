answer: |-
  Here is the verdict: **Ergodicity Economics (EE) is a distinct normative framework, not merely Expected Utility Theory (EUT) with log utility in disguise.**

  While Samuelson is mathematically correct that the *prescriptions* of Kelly betting are identical to vNM maximization with $U(W) = \log(W)$, he is wrong to conclude that the frameworks are equivalent. The disagreement is not about the math; it is about the **ontology of risk** and the **source of rationality**.

  Here is the justification for why EE constitutes a genuine rival to EUT, specifically in the domain of repeated decision-making under risk.

  ### 1. The Source of Curvature: Preference vs. Physics
  In standard EUT, risk aversion is a **preference primitive**. If an agent rejects a favorable gamble, it is because their utility function is concave. Why is it concave? Because "that's how they like it." The curvature of $U(W)$ is a free parameter fitted to observed behavior. This makes EUT notoriously unfalsifiable; any behavior can be rationalized post-hoc by positing a sufficiently weird utility function.

  In Ergodicity Economics, risk aversion is a **dynamic necessity**. The "curvature" (the logarithm) does not come from the agent's psychology; it comes from the physical structure of the wealth process.
  *   **EUT:** "I maximize $E[\log W]$ because I am risk-averse."
  *   **EE:** "I maximize $E[\log W]$ because wealth evolves multiplicatively over time, and the time-average growth rate of a multiplicative process is the expectation of the logarithm."

  This is a fundamental category error in Samuelson's critique. He treats the logarithm as a *taste*, whereas Peters derives it as a *law of motion*. If the dynamics of your environment are additive, EE prescribes linear utility (risk neutrality). If they are multiplicative, EE prescribes log utility. EUT requires you to *assume* the utility function; EE requires you to *measure* the dynamics. This shifts the burden of proof from the agent's psyche to the environment's structure.

  ### 2. The Ergodicity Hypothesis: Ensemble vs. Time
  The core of the "ergodicity move" is the claim that **ensemble averages are physically irrelevant for a single agent.**

  EUT relies on the ensemble average: it calculates the expected value by averaging outcomes across parallel hypothetical universes. This is valid only if the system is ergodic (i.e., the time average equals the ensemble average). However, most economic processes involving wealth accumulation are **non-ergodic**.

  Consider a gamble where you gain 50% or lose 40% with equal probability.
  *   **Ensemble Average (EUT):** $0.5(1.5) + 0.5(0.6) = 1.05$. Positive expected return. EUT says "take it."
  *   **Time Average (EE):** Over time, you experience $1.5 \times 0.6 = 0.9$. You lose 10% per round. EE says "reject it."

  If you maximize the ensemble average in a non-ergodic process, you go bankrupt almost surely. EUT can *accommodate* this result only if you stipulate a log utility function. But why stipulate it? EUT has no internal mechanism to detect non-ergodicity. It treats the risk of ruin as just another preference trade-off. EE treats the risk of ruin as a violation of the mathematical conditions required for the ensemble average to be meaningful.

  By recasting the problem as **time-average growth maximization**, EE claims that rationality is about surviving in *this* timeline, not thriving in *all possible* timelines. This is not relabeling; it is a rejection of the probabilistic ontology underlying standard decision theory.

  ### 3. The Calibration Problem (The Smoking Gun)
  The strongest evidence that these are distinct frameworks is the **Rabin Calibration Theorem**.

  Matthew Rabin showed that if an EUT agent turns down a small-stakes gamble (e.g., 50/50 to lose \$100 or gain \$110), EUT implies they must also turn down massive gambles (e.g., 50/50 to lose \$1,000 or gain \$\infty$) due to the extreme curvature required in the utility function at low wealth levels. This is absurd.

  EUT cannot solve this without admitting that utility functions change contextually (which violates vNM axioms).
  EE solves this trivially. An EE agent might reject the small gamble not because of "utility curvature," but because the **time-average growth rate** is negative or because the bet size violates the Kelly fraction relative to their current bankroll. The rejection is based on the *dynamics of the bet*, not the *curvature of preferences*.

  If EE were just EUT with log utility, it would suffer the same calibration absurdities. It doesn't. Why? Because the "log" in EE isn't a global utility function over all wealth; it's the specific operator required to linearize the specific multiplicative dynamic at hand. You can switch dynamics (and thus operators) without violating rationality. In EUT, changing your utility function is a preference reversal.

  ### Conclusion
  Samuelson's complaint wins only if you view decision theory as a static mapping from states to choices. If you view decision theory as a guide for **temporal navigation**, Samuelson loses.

  Ergodicity Economics is distinct because it removes the "free parameter" of the utility function. It asserts that for a given class of dynamic processes, there is **one** rational objective function (the time-average growth rate), whereas EUT asserts there are **infinitely many** (any concave $U$).

  *   **EUT:** Rationality = Consistency of preferences.
  *   **EE:** Rationality = Consistency with physical dynamics (survival).

  Therefore, EE is not "EUT in disguise." It is a **dynamic constraint on rationality** that EUT ignores. It argues that what looks like "risk aversion" is often just "arithmetic reality." By deriving the utility function from the process rather than positing it from the mind, EE offers a falsifiable, physics-based account of choice that EUT, by its very construction, cannot provide.
