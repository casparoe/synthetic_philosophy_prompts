answer: |-
  **Setting:** *A quiet corner of the faculty lounge, after a seminar on aggregation. **Alex** (Taurekian) is pouring coffee. **Jordan** (Scanlon Defender) leans against the counter.*

  **Alex:** I enjoyed your defense of Scanlon earlier. But I have to press you on the pairing argument. It feels like a shell game. You tell us you aren't summing values across persons, yet when you pair off the claimants and set them aside, the decision is ultimately settled by the "leftovers."

  **Jordan:** It's not a shell game, Alex. It's a procedure for testing reasonable rejection. The pairing shows that for every person in the smaller group who would die, there is a counterpart in the larger group with an identical claim. Those claims neutralize each other. They drop out of the justificatory picture.

  **Alex:** Neutralize? That's the first sleight of hand. If I'm the single person facing five, my claim to life doesn't vanish just because you point to one of the five and say, "He's your match." My claim remains.

  **Jordan:** Your claim remains, but it is *met*. In a one-versus-one scenario, Scanlon agrees with you: you flip a coin. Why? because neither claim can override the other. In the five-versus-one, one of the five is in exactly that position relative to you. But the other four are not. They stand without a counter-claim.

  **Alex:** And there it is. "The other four." You've isolated a remainder. And you say the decision turns on them. But why do the four win? Is it not simply because there are four of them?

  **Jordan:** No. It's because each of the four has an individual claim that goes unanswered. Consider the principle: "Save the one." Each of the four can reasonably reject that principle. They can say, "This principle requires me to die when I could have been saved without anyone else dying."

  **Alex:** But the one can say the same to the four! "This principle requires me to die when I could have been saved."

  **Jordan:** Ah, but here is the asymmetry. If you save the one, *four* people die who could have lived. If you save the four, *one* person dies who could have lived. The strength of the individual claim is identical in both cases. But the principle "Save the One" imposes a cost on four distinct individuals. The principle "Save the Four" imposes that same cost on only one.

  **Alex:** I hear the words "distinct individuals," but I see the math of aggregation. You're saying the objection of the four carries more weight than the objection of the one. Why? Because there are more objections. You've replaced "units of utility" with "units of reasonable rejection," but you're still counting units.

  **Jordan:** We aren't counting units of a collective good. We are counting *veto powers*. Think of it this way: In the contractualist framework, we are looking for a principle no one could reasonably reject. If we adopt "Save the One," four people have a veto. If we adopt "Save the Four," only one person has a veto. To respect the veto of the one is to override the vetoes of the four.

  **Alex:** That sounds like you're aggregating the vetoes. You're treating the four vetoes as a block that outweighs the single veto. Taurek's point was that there is no "block." There is only me, and there is only you. The fact that there are four "yous" doesn't create a metaphysical entity called "The Four" that has a stronger claim than "The One."

  **Jordan:** I'm not positing a metaphysical entity. I'm positing a structural problem of justification. Imagine I am the decision-maker. I have to justify my choice to each person. If I save the one, I have to look the four in the eye and say, "I let you die to save him." They ask, "Why?" I say, "Because his claim mattered more." They say, "It didn't. It was equal." I say, "True, but there was only one of him."

  **Alex:** Exactly! You admit it. "There was only one of him." The number is the tie-breaker.

  **Jordan:** The number is the *fact* that reveals the asymmetry in justification, not the *weight* that tips the scale. The difference isn't that the four have *more* moral weight. It's that the principle favoring the one leaves more individual claims *unsatisfied*.

  **Alex:** "Unsatisfied claims." If I have one unsatisfied claim, I die. If you have four unsatisfied claims, four die. You say we should minimize unsatisfied claims.

  **Jordan:** I say we should choose the principle that leaves the fewest people with a grounds for reasonable rejection.

  **Alex:** That is aggregation by another name. You are summing the instances of "grounds for rejection." Taurek would say: I have grounds for rejection. That is a binary state. I either have a complaint or I don't. The fact that four others also have complaints doesn't make my complaint louder, nor does it make your action worse *to me*. The wrong done to me is the same whether I die alone or while four others are saved.

  **Jordan:** But we aren't deciding what wrong is done to you in isolation. We are deciding what policy to adopt. If we adopt a policy of lotteries in all cases, the four can argue: "We accept the lottery in one-versus-one. But in five-versus-one, a lottery guarantees that more people die than necessary. We can save us all without costing the one anything *extra*."

  **Alex:** "Without costing the one anything extra." That's the utilitarian whisper. You're implying the one loses nothing by the shift from lottery to saving the greater number. But the one loses the *chance* to live. In a lottery, the one has a 50% chance. In your pairing scheme, the one has a 100% chance of death. That is a massive cost to the one.

  **Jordan:** It is a cost. But the four face a 100% chance of death under the lottery if the coin lands against them.

  **Alex:** But not all at once in the same way! This is Taurek's core insight. Loss is not a fluid that pools. If I lose my life, that is a catastrophe. If five lose their lives, that is five catastrophes. It is not one "Super-Catastrophe" that is five times bigger. When you let the leftovers decide, you are treating the five catastrophes as a single, heavier weight on the scale.

  **Jordan:** I deny that. I am treating them as five separate scales. On scale one, Claim A vs. Claim 1. Balanced. On scale two, Claim B vs. Nothing. Claim B wins. On scale three, Claim C vs. Nothing. Claim C wins. And so on.

  **Alex:** But who aggregates the results of the scales? You do. You look at the five scales, see that four tip toward the larger group, and declare them the winner. You are the aggregator. Scanlon wants to avoid the "social calculator," but the pairing argument requires a calculator to tally the unpaired claims.

  **Jordan:** It's not tallying; it's checking for consistency. If we agree that in a one-versus-one, we shouldn't sacrifice one for the other, then we must agree that Claim 1 cannot override Claim A. But if Claim 1 cannot override Claim A, it certainly cannot override Claims A, B, C, D, and E.

  **Alex:** Why not? If Claim 1 is equal to Claim A, and Claim A is equal to Claim B... why does the chain matter? I can't override A. I can't override B. But why does the presence of B make my override of A impermissible?

  **Jordan:** Because B is also a person to whom justification is owed. You are asking the one to accept a principle that ignores the claims of B, C, D, and E.

  **Alex:** I am asking the one to accept a principle that respects the separateness of persons. By letting the "leftovers" decide, you are effectively saying, "Your right to a fair chance is overridden by the sheer existence of other people who also want to live." That is exactly what Taurek said numbers shouldn't do. You've vindicated the intuition that we save the greater number, Jordan, but you've done it by smuggling the numbers in as a justificatory device.

  **Jordan:** I haven't smuggled them in as a *weight*. I've acknowledged them as a *fact of the situation*. The question is: Can the one reasonably reject a principle that saves the four? To do so, the one must argue that their claim is stronger. It isn't. Or that the procedure is unfair. But a procedure that ignores four uncountered claims to honor one neutralized claim is the one that looks arbitrary.

  **Alex:** And a procedure that lets the existence of four strangers determine my fate looks like I'm being used as a means to minimize the total count of deaths.

  **Jordan:** Not if the justification is addressed to you individually. I can look you in the eye and say, "I did not save you because your life was worth less. I saved them because their claims were not neutralized by anyone else's. Your claim was neutralized by one of theirs. Theirs remained."

  **Alex:** "Neutralized." It's a tidy word. But it implies that my claim is somehow used up. It isn't. I still die. And the reason I die is that there are four others. If there were only two of them, I'd have a coin flip. So, my fate turns on the number of others.

  **Jordan:** Yes. Your fate turns on the number of others *because* morality requires us to acknowledge the claims of those others. Taurek asks us to ignore the others once the pairs are matched. Scanlon asks us to acknowledge that the leftovers still have claims that demand satisfaction.

  **Alex:** And in demanding satisfaction for the leftovers, you sum their demands. You say, "Four unsatisfied claims are worse than one."

  **Jordan:** I say, "A world where four distinct individuals have a justified complaint is harder to justify than a world where one does."

  **Alex:** "Harder to justify." To whom? To the group?

  **Jordan:** To each member of the group.

  **Alex:** But you can't talk to the group as a "you." You talk to me. And to me. And to me. And if you tell each of the four, "We saved you because there were four of you," you are telling them their survival depends on their collective size. That is aggregation. You've dressed it up in contractualist clothes, Jordan, but the engine is still counting heads.

  **Jordan:** Perhaps. But it's counting heads to ensure every head gets a voice, not to merge them into a single utility monster. If that's aggregation, it's the only kind that respects the separateness of persons while acknowledging that we have to live together in a world of scarce resources.

  **Alex:** Taurek would say we don't have to live together in a way that makes my life contingent on your headcount. But I suppose that's where the dialogue ends.

  **Jordan:** For now. But at least we agree the pairing argument is where the battle lies.

  **Alex:** Agreed. It's the perfect crime scene. The body of aggregation is missing, but the weapon is still warm.
