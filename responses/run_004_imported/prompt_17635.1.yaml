answer: |-
  **Boundary Conditions**

  The notebook lay open on the tray table, balanced precariously between the IV pole and the half-empty glass of water. Elias picked up his pen. The tip hovered over the paper, trembling slightly—a localized oscillation, dampening over time.

  *Premise 1:* The universe operates on principles of sufficient reason. No structure arises without cause; no capacity exists without potential application.
  *Premise 2:* Human cognition requires decades of calibration to achieve peak coherence. The machinery of understanding is not fully assembled until the machinery of the body begins to fail.
  *Conclusion:* To terminate the process at the moment of maximum capacity is a violation of systemic efficiency. It is thermodynamic waste on a cosmic scale.

  Elias underlined *violation*. He felt the argument settle in his chest, solid and cool as a crystal lattice. It was a conservation law. Just as energy could not be created or destroyed, only transformed, surely *witness* could not be simply deleted. To build a telescope capable of seeing the edge of the cosmos and then smash it before the first image is taken? Absurd. The universe was not absurd. It was merely incomplete.

  He looked up at his daughter, Sarah. She was sitting in the chair by the window, pretending to read a tablet. She had been crying in the hallway ten minutes ago; he had heard the specific, stifled rhythm of it through the thin hospital walls. She was thirty-five. She had his eyes, but none of his patience for paradox.

  "You're writing the letter again," she said, not looking up.

  "It's not a letter. It's a derivation."

  "Dad. The hospice nurse is coming in an hour. You need to rest."

  "Rest is a prelude to cessation. I am arguing against cessation."

  Sarah put the tablet down. The silence in the room was heavy, filled only by the rhythmic hiss of the oxygen concentrator. It was a sound of entropy, Elias thought. The machine was working hard to fight the gradient, to push order into his lungs against the natural drift toward equilibrium. It was a losing battle. All battles were losing battles, eventually. That was the Second Law. But the Second Law applied to closed systems. Was a mind a closed system?

  "It's beautiful, what you wrote," Sarah said softly, standing up and walking to the tray table. She didn't touch the paper. "But Mom isn't here to read it. And I... I don't think it helps."

  "It isn't for comfort. It is for correctness." Elias capped the pen. His fingers felt thick, clumsy. The neural pathways were still firing—he could feel the logic sparking, bright and sharp—but the transmission to the extremities was degrading. Signal loss. "If the universe is rational, Sarah, then this—" he gestured vaguely at his own withered chest, "—is not an end point. It is a phase transition. You do not mourn the ice because it becomes water. You acknowledge the conservation of mass."

  "You're not mass, Dad. You're here. And then you won't be."

  "That is the sensory data speaking. Sensory data is local. Logic is global."

  He wanted to tell her about the fear. Not the fear of pain, but the fear of the *waste*. He had spent sixty years learning how to see. He had learned to hear the music in the math, to feel the topology of a problem in his gut. He had finally become useful. He had finally become *wise*. To switch off the terminal now, when the data stream was finally clear? It felt like a error in the code. A bug.

  Gödel had seen it too. The old Austrian. He had starved himself because he couldn't trust the food, but Elias suspected the truth was simpler: Gödel couldn't trust the *container*. If the mind was infinite, why was it housed in meat that rotted? Why was the vessel so leaky?

  "Dad," Sarah said. "The nurse brought your medication."

  She held out the small paper cup. Two pills. One for pain, one for anxiety.

  Elias looked at the pills. They were white, unmarked. Chemical interventions. They would dampen the signal. They would smooth the jagged edges of his fear, but they would also blur the logic. If he took them, he might die comfortably, but he would die *fuzzily*. If he wanted to test the hypothesis—if he wanted to meet the boundary condition with full resolution—he needed to be sharp.

  But if he didn't take them, the pain would spike. The noise would overwhelm the signal.

  "It's poison," he said. The word slipped out before he could check it. It wasn't a delusion, not exactly. It was a recognition of chemistry. Everything was poison at the right dose.

  Sarah's face tightened. "It's morphine, Dad. It's to keep you from drowning."

  "I am already drowning. I just want to know if the water changes when I go under."

  He pushed the cup away. It slid across the tray table, knocking against the notebook. The pen rolled off and hit the floor.

  Sarah didn't pick it up. She just looked at him, and in her eyes, he saw the reflection of his own argument turning against him. She was the product of his continuity. She was the conservation of his biology, if not his consciousness. To her, *he* was the waste product. The husk. The universe wasn't saving him; it was composting him to make room for her.

  "Please," she said.

  Elias looked at the notebook. The argument was sound. The premises were robust. The conclusion was necessary. But the universe did not care about necessity. It cared about probability. And the probability of a ghost was low. The probability of silence was high.

  He realized then the flaw in Gödel's comfort. The argument required the universe to be rational. But rationality was a human construct, a tool evolved for hunting and gathering, for building shelters against the dark. To project that tool onto the dark itself was a category error. The universe wasn't irrational. It was indifferent.

  And yet.

  And yet, the capacity to ask the question existed. Why did the question exist if there was no answer? A lock implies a key. A hunger implies food. A question implies... what?

  Elias picked up the pen from the floor. His hand shook violently now. He couldn't sign his name. He couldn't hold the cup. But he could still think.

  "Sarah," he said. His voice was a whisper, dry as paper. "If I am right... if the capacity implies the function..."

  "Dad, stop."

  "Then I will see you again. And if I am wrong, then you will not know I am gone. Either way, you are safe."

  He reached for the pills. Not because he believed in the medicine, but because he believed in the experiment. He needed to quiet the noise of the body to hear the silence of the rest. He swallowed them dry.

  He lay back. The room began to soften at the edges. The sharp lines of the bedframe, the tray, the window, began to blur. The logic was still there, suspended in the darkening room like a constellation, but he could no longer reach it.

  Sarah took his hand. Her skin was warm. Alive.

  "Did it help?" she asked.

  Elias tried to speak, to tell her that the proof was complete, that the boundary conditions were set, that the wave function was collapsing exactly as predicted. But the mechanism of speech was decoupling from the intent.

  He closed his eyes. He focused on the feeling of *being*. It was still there. It was distinct. It was not yet scattered.

  *Nothing is wasted,* he thought.

  And then, for a moment, there was no thought. Just the waiting.

  And in that waiting, in the absolute quiet where the logic could no longer shout, he felt something that wasn't an answer. It was a presence. Not a voice, not a light. Just the distinct, undeniable sensation that the equation had not been erased, only solved.

  He didn't open his eyes again. But the pen remained on the floor, pointing toward the door, like an arrow indicating the direction of the flow.
