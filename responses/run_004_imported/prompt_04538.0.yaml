answer: |-
  Your friend is right. I hate to be the bearer of bad news, but this is a classic "gotcha" in game theory, and your intuition about averaging is the exact reason why it's so counterintuitive.

  If you only check for pure-strategy dominance, you are performing a valid pruning step, but you are **not** performing full IESDS. There are strategies that are not dominated by any single other pure strategy but *are* dominated by a weighted mixture of two or more strategies.

  Here is the breakdown of why your intuition is tripping you up, the concrete example that proves your friend right, and what this means for your bot.

  ### 1. The Intuition Gap: Hedging vs. Averaging
  Your intuition was: *"If A loses to X in scenario 1, and B loses to X in scenario 2, mixing them should lose in both."*

  That would be true if A and B were both "bad" strategies. But for mixed dominance to occur, A and B aren't "bad"; they are **specialized**.
  *   Strategy A is *great* against Opponent Move 1, but mediocre against Move 2.
  *   Strategy B is *great* against Opponent Move 2, but mediocre against Move 1.
  *   Strategy X is *consistently okay* against both.

  If A and B are "great" enough in their respective niches, a 50/50 mix of them creates a "consistently good" strategy that beats the "consistently okay" Strategy X in **both** scenarios. You aren't averaging two losers; you are averaging two specialists to create a generalist that outperforms the existing generalist.

  ### 2. The Counter-Example
  Here is a minimal payoff matrix (for the Row Player) that breaks your current solver.

  Imagine you have three strategies: **Top**, **Mid**, **Bot**.
  The opponent has two strategies: **Left**, **Right**.

  | | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 2 | 2 |
  | **Mid** | 4 | 1 |
  | **Bot** | 1 | 4 |

  **Check for Pure Dominance (Your current method):**
  *   Does **Mid** beat **Top**? No (1 < 2 in Right).
  *   Does **Bot** beat **Top**? No (1 < 2 in Left).
  *   **Conclusion:** Your bot says **Top** is safe. It is not dominated by any single row.

  **Check for Mixed Dominance (Your friend's method):**
  *   Consider a mixed strategy $\sigma$ that plays **Mid** 50% of the time and **Bot** 50% of the time.
  *   Expected Payoff vs **Left**: $0.5(4) + 0.5(1) = 2.5$
  *   Expected Payoff Vs **Right**: $0.5(1) + 0.5(4) = 2.5$
  *   Compare to **Top**: $2.5 > 2$ in **both** columns.
  *   **Conclusion:** **Top** is strictly dominated by the mixed strategy $(0, 0.5, 0.5)$.

  In a full IESDS pass, **Top** gets deleted. In your current pass, it stays. If **Top** was part of a Nash Equilibrium path (it can't be if it's dominated, but your solver doesn't know that yet), you're handing your equilibrium solver extra work. If you were hoping IESDS would solve the game entirely, your method will fail on this matrix.

  ### 3. Does This Matter for Your Poker Bot?
  It depends on what you need the pruning pass to do.

  **Scenario A: You just want to speed up the solver.**
  If you are handing the reduced matrix to a robust Nash Equilibrium solver (like Lemke-Howson or a Linear Programming solver), **your current method is safe.** Eliminating *purely* dominated strategies never removes a Nash Equilibrium. It just removes fewer strategies than the theoretical maximum. Your bot will still be correct, just slightly less optimized.

  **Scenario B: You want the pruning to solve simple games.**
  If you are hoping that IESDS will reduce the game to a single cell (which happens in dominance-solvable games), **your method is insufficient.** The example above is dominance-solvable via mixed strategies (Top goes, then depending on the column player's payoffs, others might follow), but your code will stall.

  **Scenario C: Poker Specifics.**
  Poker is a zero-sum game with imperfect information (usually modeled as an extensive form game, but you mentioned a normal-form matrix). In zero-sum games, the set of strategies surviving IESDS is exactly the set of strategies played with non-zero probability in some Nash Equilibrium.
  *   If you skip mixed-dominance checks, you might leave in "junk" strategies that a perfect solver would ignore.
  *   This increases the dimensionality of the LP your solver has to run.

  ### 4. How to Fix It (The Implementation Cost)
  Your friend mentioned Osborne's textbook (likely *An Introduction to Game Theory*) because this is standard curriculum. The reason people skip mixed-dominance checks in hobby projects is that they are computationally heavier.

  *   **Pure Dominance Check:** $O(N^2 \cdot M)$ comparisons. (For $N$ rows, $M$ columns). Easy loops.
  *   **Mixed Dominance Check:** This is a **Linear Programming** problem. For each strategy $s_i$, you have to ask: *"Is there a probability vector $\sigma$ over the other strategies such that $\sigma \cdot U > u(s_i)$ for all columns?"*

  If you want to implement this, you don't need to write a simplex solver from scratch. In Python, you can use `scipy.optimize.linprog`.

  **The Logic for one row check:**
  To check if Row $i$ is dominated by a mix of others:
  1.  Maximize a slack variable $v$.
  2.  Subject to: $\sum_{k \neq i} \sigma_k \cdot \text{Payoff}(k, \text{col}_j) - \text{Payoff}(i, \text{col}_j) \ge v$ for all columns $j$.
  3.  Subject to: $\sum \sigma_k = 1$, $\sigma_k \ge 0$.
  4.  If the optimal $v > 0$, Row $i$ is strictly dominated.

  ### Verdict
  Your friend is right. It's not a corner case; it's a fundamental property of convexity in payoff spaces. Pure strategies form the vertices of a polytope, and mixed strategies fill in the interior. A point on the interior can be higher than a vertex even if no other vertex is higher than it.

  **Recommendation:** If this is a learning project, implement the LP check. It's a great excuse to learn how to call a linear programming solver, and it will make your pruning pass "theoretically complete." If you just want the poker bot to play well, your current method is a safe heuristic, but you should acknowledge it's not full IESDS.
