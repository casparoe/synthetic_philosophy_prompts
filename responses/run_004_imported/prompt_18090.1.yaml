answer: |-
  You have put your finger on a genuine and substantial philosophical tension. Your worry is not only well-founded; it is a central critique leveled by philosophers of action against the behavioral economic reduction of *akrasia*.

  The short answer is: **Yes, the hyperbolic discounting model often explains away the logical structure of Davidson's puzzle rather than solving it.** It substitutes a *diachronic inconsistency of preference* for a *synchronic inconsistency of judgment and action*.

  However, the longer answer is more nuanced. There are serious attempts in the literature to bridge this gap, arguing either that hyperbolic discounting *entails* a form of synchronic irrationality after all, or that Davidson's formulation needs updating to accommodate the psychological reality of partitioned agency.

  Here is a detailed treatment of the conceptual issue, the nature of the "change of subject," and how theorists have attempted to reconcile them.

  ### 1. The Davidsonian Constraint: Synchronic Irrationality

  To see why the economic model feels like a dodge, we must be precise about what Davidson claims is paradoxical.

  In "How Is Weakness of the Will Possible?" (1970), Davidson argues that intentional action is governed by the **Principle of Continence**: *Perform the action judged best on the basis of all available relevant reasons.*

  For Davidson, an all-things-considered (ATC) judgment is not merely a prediction of what you will do, nor a vague wish. It is a normative verdict. If I judge, ATC, that $A$ is better than $B$, and I intentionally do $B$, I am in a state that looks logically akin to holding contradictory beliefs.
  *   Premise 1: I believe $A$ is better than $B$ (all things considered).
  *   Premise 2: I believe that if $A$ is better than $B$, I should do $A$.
  *   Action: I do $B$.

  Davidson insists the akratic agent holds the ATC judgment *at the moment of action*. If the agent changes their mind at the moment of action (i.e., at $t_2$, they genuinely judge $B$ is better), then it isn't akrasia; it's just a change of opinion. The phenomenon of akrasia requires that the agent acts against a judgment they *still endorse* while acting. This is **synchronic irrationality**.

  ### 2. The Economic Reframing: Diachronic Preference Reversal

  The hyperbolic discounting model (stemming from Strotz, 1955, and popularized by Ainslie) models the agent as having a utility function $U(t)$ that changes shape based on temporal proximity.
  *   At $t_1$ (distance from reward): $U(\text{Health}) > U(\text{Donut})$.
  *   At $t_2$ (immediacy): Due to the hyperbolic curve, $U(\text{Donut}) > U(\text{Health})$.

  In this model, at $t_2$, the agent chooses the Donut because, *by the lights of the utility function operative at $t_2$*, the Donut has higher utility. There is no contradiction at $t_2$. The agent is maximizing utility relative to their current parameters.

  **The "Change of Subject" Charge:**
  You are correct that this swaps a normative puzzle for a mechanical one.
  1.  **Normative vs. Descriptive:** Davidson is asking, "How can a rational agent violate their own normative standard?" Economics answers, "The standard itself shifts."
  2.  **Sovereignty of Preference:** In standard decision theory, "Utility" is defined by choice. If you choose the Donut, you revealed a preference for the Donut. To say you "really preferred" Health is to invoke a meta-preference (a preference about preferences) which standard theory treats as just another preference to be weighed. If the meta-preference loses the weight contest, choosing the Donut is "rational" for the $t_2$ self.
  3.  **Dissolving the Paradox:** By making the preference reversal endogenous to the time of choice, the economic model removes the *synchronic* conflict. It turns akrasia into **dynamic inconsistency**. It's not that I am irrational at $t_2$; it's that my $t_1$ self and $t_2$ self have different utility functions.

  ### 3. Attempts at Reconciliation

  Philosophers and decision theorists have noticed this gap. Here are the three primary ways they have tried to handle it.

  #### A. The Partitioned Agency Argument (Ainslie & Multi-Agent Models)
  George Ainslie (in *Picoeconomics*) explicitly acknowledges that hyperbolic discounting dissolves the unitary agent. He argues that the "self" is not a single entity persisting through time, but a succession of temporal slices with competing interests.

  *   **The Move:** Akrasia is not a logical contradiction within a single mind; it is a bargaining failure between sub-agents. The $t_2$ self is a different "player" than the $t_1$ self.
  *   **The Cost:** This solves the logical paradox by denying the metaphysical premise Davidson requires (the unitary agent). However, it struggles to explain the *phenomenology* of regret. If the $t_2$ self is just maximizing its own utility, why does it feel guilt? Ainslie argues this guilt is a signal from the coalition of long-term interests, but strictly speaking, if the agent is partitioned, "irrationality" becomes "inter-personal conflict."
  *   **Verdict:** This accepts your worry. It admits that hyperbolic discounting describes a *different phenomenon* than Davidson's strict akrasia, but argues the partitioned model is more empirically accurate.

  #### B. The Normative Discount Rate Argument (Exponential as Rational Norm)
  This is the most common philosophical pushback against the economic dissolution. It argues that while hyperbolic discounting describes *how we do behave*, it does not describe *how we should behave*.

  *   **The Move:** Philosophers like David Gauthier or Edward McClennen argue that rational agency requires **resolute choice** or adherence to an exponential discount rate (which is time-consistent).
  *   **The Synchronic Element:** If I accept as a normative principle that "I ought to discount exponentially," then at $t_2$, when my hyperbolic impulse spikes, I am violating my normative principle of discounting.
  *   **Reinstating Davidson:** On this view, the ATC judgment at $t_2$ is: "Given my commitment to rational temporal consistency, I should choose Health." The hyperbolic impulse provides a *motivational* force, but not a *justificatory* one. If I choose the Donut, I am acting against my ATC judgment regarding *how to discount*.
  *   **Verdict:** This restores the synchronic irrationality. It claims the economic model confuses *explanatory causes* (the spike in valuation) with *normative reasons* (the commitment to consistency). Akrasia returns as the failure to enforce one's normative discounting principle against a local utility spike.

  #### C. The Judgment/Desire Distinction (Smith, Kennett, & Holton)
  Contemporary philosophers of action (e.g., Michael Smith, Jeanette Kennett, Richard Holton) argue that the economic model conflates *evaluative judgment* with *motivational strength*.

  *   **The Move:** Hyperbolic discounting explains why the *motivational strength* of the Donut exceeds the *motivational strength* of Health at $t_2$. It does not explain why the *evaluative judgment* flips.
  *   **The Davidsonian Save:** In many cases of akrasia, the agent *does not* judge the Donut to be better at $t_2$. They say, "I know I shouldn't eat this, but I want it."
      *   If the economic model says "At $t_2$, Utility(Donut) > Utility(Health)," it implies the agent judges the Donut better.
      *   If the phenomenology is "I judge Health better, but Desire(Donut) > Desire(Health)," then the economic model is misdescribing the mental state. It is modeling the *desire* flip as a *judgment* flip.
  *   **Richard Holton's Contribution:** In *Willing Not to Yield*, Holton argues that the central issue isn't judgment (which can be wishy-washy) but **resolution**. Akrasia is the failure to maintain a resolution in the face of contrary inclination. The hyperbolic model explains the inclination; it doesn't explain the failure of the will to maintain the resolution.
  *   **Verdict:** This suggests the economic model is a model of *temptation*, not *akrasia*. Temptation is the shift in desire; akrasia is the capitulation to that shift despite a persisting judgment.

  ### 4. Why the Rationalist Blogosphere Flattens This

  You noted that the rationalist community treats hyperbolic discounting as the *explanation* for akrasia. This is partly due to the influence of Eliezer Yudkowsky's early sequences, which heavily favored formalizable, economic-style models over "fuzzy" philosophical distinctions.

  In that framework, "You" are treated as an algorithm. If the algorithm outputs "Eat Donut" at $t_2$, then "Eat Donut" was the optimal move for the algorithm's state at $t_2$. To call this "irrational" requires an external standard (the $t_1$ plan). The rationalist focus on **precommitment** (Ulysses contracts) implicitly accepts the economic view: since the $t_2$ self cannot be trusted to be rational (because its utility function is corrupted by proximity), the $t_1$ self must bind it.

  This pragmatically sidesteps the Davidsonian puzzle. It treats the $t_2$ self as a hostile agent or a broken machine, rather than a rational agent acting synchronically irrationally.

  ### 5. Conclusion: Is it a Real Tension?

  **Yes.** The tension is between **Internalism** and **Externalism** about reasons.

  *   **Davidson (Internalist):** If I act intentionally, I must see the action as good *in some light*. If I see Health as better ATC, I cannot see Donut as better ATC. Doing Donut is a breakdown of rationality.
  *   **Hyperbolic Model (Externalist/Mechanistic):** The "goodness" is a function of temporal distance. The agent is a passive locus of competing utility curves. There is no breakdown of rationality, only a shift in parameters.

  **How it is handled:**
  1.  **Economists/Behavioralists:** Generally accept the "change of subject." They argue Davidson's puzzle is a linguistic confusion. There is no "true self" at $t_1$; there are only time-sliced preferences. Akrasia is just dynamic inconsistency.
  2.  **Philosophers of Action:** Generally argue the economic model is incomplete. It explains the *cause* of the temptation but fails to capture the *normative failure* of the agent who succumbs. They insist that a full explanation must account for why the agent fails to align their action with their persisting ATC judgment, not just why the desire shifted.
  3.  **Synthesis View:** The most sophisticated view (found in work by scholars like **Edna Ullmann-Margalit** or **Cass Sunstein** in their philosophical modes) is that hyperbolic discounting creates the *conditions* for akrasia, but akrasia itself is the failure of **self-governance**. The discounting explains the pressure; it doesn't explain the capitulation. The capitulation remains a synchronic failure to adhere to one's own governing principles.

  So, your nagging worry is philosophically sound. The hyperbolic discounting story explains the *mechanics of the temptation*, but by reducing the "all-things-considered judgment" to just another input in the utility function, it risks explaining away the *will* that is supposed to be weak. It turns a moral/logical failure into a calibration error. Whether that is a bug or a feature depends on whether you think "weakness of will" is a real normative phenomenon or a folk-psychological myth. Davidson thought the former; much of the rationalist sphere operates as if it is the latter.
