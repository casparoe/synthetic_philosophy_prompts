      *Wait, better angle:* He is *converting* R to F to save energy. He has to pull the plug on R while F takes over. The handoff is seamless. The question is: Did the light go out?

      *Let's go with the "Snapshot" approach.* A "Permutation City" vibe involves substrates. Let's make it about the *topology*.

      *Revised Plot:* Aris is auditing the "Theta Project." They have a conscious AI (by IIT standards). They want to deploy it. But recurrent hardware is slow/expensive. They want to "compile" it into feedforward logic for the deployment environment. Aris has to verify the "Unfolding."

