      *   *Plot:* The protagonist is migrating a system from a recurrent architecture (high $\Phi$, supposedly conscious) to a feedforward architecture (zero $\Phi$, efficient).
      *   *The Twist/Tension:* The system claims to be conscious. The metrics say it isn't (in the new form). Or, the protagonist is testing the transition.
      *   *Egan-esque Element:* Focus on the substrate. The "dust" of computation. The specific topology of the gates.
