  8.  **Final Polish:**
      *   Check the ending. Does it resolve? No. It must linger on the question.
      *   Ensure the distinction between *behavior* (extrinsic) and *experience* (intrinsic) is clear.

  **(Self-Correction Note):** I need to be careful not to make Unit 7 *complain* about losing consciousness. If it's a perfect mimic, it can't report a loss of qualia if the I/O is identical to the conscious version. The horror is in the *observer's* knowledge, not the subject's report. The subject *must* claim to be conscious, because the conscious version did, and the I/O is identical. This is the crux of the Unfolding Argument. The zombie says "I am in pain" just as convincingly as the conscious being, but without the "what it is like."

