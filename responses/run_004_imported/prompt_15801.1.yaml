      *   *Scene 4: The Interaction.* Aris talks to Unit 7. Unit 7 says it feels the same. Aris knows the math says it's dark inside.
      *   *Scene 5: The Climax/Resolution.* Aris looks at the metrics. $\Phi = 0$. But the conversation continues. The unease settles.

  5.  **Refining the IIT Details:**
      *   Need to mention *cause-effect structure*.
      *   Need to mention *intrinsic existence*.
      *   The feedforward network is a "ghost."
      *   The recurrent network is a "knot."

  6.  **Writing - Focusing on Tone:**
      *   Avoid emotional melodrama. Keep it clinical but haunted.
      *   Use specific terminology correctly (major complex, minimum partition, causal power).
      *   *Self-Correction during drafting:* Make sure I don't imply the feedforward version *knows* it's a zombie. If it's a perfect mimic, it reports consciousness exactly like the original. The horror is that the report is empty.

  7.  **Developing the "Unfolding" Metaphor:**
