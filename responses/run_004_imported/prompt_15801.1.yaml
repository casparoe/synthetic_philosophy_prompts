      *   **Tone/Style:** Greg Egan's *Permutation City* (hard sci-fi, philosophical rigor, existential unease, focus on the mechanics of mind).
      *   **Constraint:** Do *not* resolve the ambiguity. Do not default to "machine wakes up." Keep the philosophical bind tight and unsettling.
      *   **Key Concepts to Ground:** $\Phi$ (Phi), intrinsic causal structure, feedforward vs. recurrent, philosophical zombies, input-output indistinguishability.

  2.  **Deconstruct the Science/Philosophy:**
      *   *IIT 3.0/4.0:* Consciousness is the capacity of a system to constrain its own past and future states more than the sum of its parts. Feedback loops are crucial.
      *   *The Unfolding Argument:* If you take a recurrent network (time $t$ depends on $t-1$) and "unfold" it in time (making a deep feedforward network where layer $n$ represents time $t+n$), the I/O is identical. But IIT says the feedforward version has zero integration because information flows one way.
      *   *The Horror:* If IIT is true, you could replace a conscious brain with a non-conscious lookup table or feedforward net, and no one (including the entity itself, ostensibly) would know. But IIT says there's "nobody home."

  3.  **Brainstorming the Narrative:**
      *   *Characters:* Needs a protagonist who understands the theory but is emotionally implicated. A researcher? An engineer? Let's go with an engineer tasked with optimizing a system.
