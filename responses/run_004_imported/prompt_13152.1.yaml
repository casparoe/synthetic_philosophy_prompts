answer: |-
  Thank you, everyone. And thank you for this. Six years on the committee is a long time, and looking around this room, I see people I respect, people I've laughed with, and people who have genuinely worked hard for this community. Please know that my leaving isn't a rejection of any of you as individuals. If it were just about the people, I'd stay forever.

  But I need to be honest about why I'm stepping back.

  Like many of you, I joined because I believed in the cause. But after the selection meeting earlier this month, I found myself doing something I haven't done in a while: I stopped thinking about the candidate, and started thinking about *us*. Specifically, about the moment the Whip's message landed in the group chat, and the way the room's atmosphere shifted. The argument hadn't even started, but the conclusion was already settled.

  A few months ago, a friend of mine—actually, [Friend's Name] is here tonight—handed me an essay by the French philosopher Simone Weil called *On the Abolition of All Political Parties*. I'll admit, I thought it sounded dramatic. But reading it while watching that selection process unfold was… unsettling.

  Weil argues that the problem isn't just that parties sometimes get corrupt or pushy. Her argument is much stranger, and deeper. She says that the very structure of a political party is a machine designed to manufacture "collective passion." It exists, first and foremost, to grow itself and to win. And to do that, it has to exert a subtle, constant pressure on the minds of its members.

  She uses a phrase that stuck with me: "pressure on the mind." It's not that we're told what to think in so many words. It's that the structure rewards alignment and punishes hesitation. It asks us to prioritize the party's survival over the truth of a specific situation. Weil says that even a small, harmless-looking local branch contains the seed of totalitarianism—not because the members are tyrants, but because the mechanism asks you to surrender your individual judgment to the collective will.

  I know that word—"totalitarian"—is heavy. And I'm not standing here calling you fascists. You're not. You're decent neighbours. But Weil's point is that the *structure* doesn't care if we're decent. It cares if we're loyal. And at that meeting, I felt that loyalty being asked of me, and I realized I couldn't give it without giving up something else I value more.

  Now, I can hear the question forming. It's the obvious one: "If we abolish parties, how do we organize? How do we win elections?"

  It's a fair challenge. Weil doesn't offer a perfect blueprint, but she does offer a direction. She suggests that organization is possible, but it has to be built around a commitment to the public good and to truth, rather than a commitment to a team label. It means organizing around problems we can agree exist, rather than opinions we're told to defend. It's harder, slower work. It doesn't have the adrenaline of a campaign battle. But it allows you to look someone in the eye without checking a manifesto first.

  I'm telling you this not to convince you to resign. I know many of you do immense good within this structure, and I respect that. There are people in this room I know who feel that pressure too, who are tired of the script but haven't found a way out yet. I'm not judging you for staying. I'm just explaining why I'm going.

  I'm leaving because I want to be capable of changing my mind without checking if it helps or hurts the brand. I want to serve this community without serving a machine first.

  I'm not disappearing. I'm still your neighbour. I'm still on your side. I'm just stepping out of the formation. Thank you for six years of friendship, and for letting me say this plainly.

  Cheers.
