answer: |-
  This is a classic problem in Thomistic political theory, and your skepticism about the secondary literature is well-founded. Too many scholars paste the later Scholastic distinction (*tyrannus ex defectu tituli* vs. *tyrannus ex parte exercitii*) onto Aquinas as if he explicitly formulated it, when he didn't. That terminology is largely Suárezian and Bellarminian. If you walk into your defense claiming Aquinas explicitly makes that distinction, a sharp committee member will ask for the Latin phrase, and you won't have one.

  However, you don't need to claim Aquinas changed his mind (the "developmental" hypothesis) nor do you need to rely on anachronistic labels to resolve the tension. The reconciliation lies in recognizing that the two passages are answering **different questions** operating on **different levels of analysis**: one is a question of *moral licitness in a state of exception* (Sentences), and the other is a question of *political procedure and prudential stability* (De Regimine).

  Here is a walkthrough of how to read these texts together without doing Aquinas's work for him, focusing on the textual warrant available to you.

  ### 1. The *Sentences* Passage: Moral Licitness in a Vacuum
  *In II Sent., d. 44, q. 2, a. 2* is early (1250s). The context is theological: Aquinas is asking whether subjects are bound to obey superiors in all things. The tyrannicide scenario arises as a specific objection/case study regarding the limits of obedience.

  **Key Textual Constraints:**
  *   **The Definition of the Ruler:** Aquinas specifies the ruler seized power *"per violentiam et astutiam"* (by violence and ruse). Crucially, he adds that the subjects *"nunquam consenserunt"* (never consented).
  *   **The Juridical Vacuum:** He specifies there is *"nullus superior... qui de ipso judicium ferre possit"* (no superior who can pronounce judgment).

  **The Logic:**
  In this specific configuration, Aquinas is not treating the "tyrant" as a legitimate magistrate who has gone bad. He is treating him as a **private aggressor** who happens to hold the reins of power. Because there is no consent and no superior to adjudicate, the relationship is not one of *ruler-subject* but of *aggressor-victim*.

  When Aquinas says the killer is "praised and rewarded," he is making a **moral judgment on the act**, not a **political prescription for the community**. He is saying: "If you find yourself in this specific state of exception where the juridical order has collapsed (no superior, no consent), killing this man is not a sin of sedition or murder." He is clearing the conscience of the individual actor in a vacuum of authority.

  ### 2. *De Regimine Principum*: Political Procedure and Prudence
  *De Regimine* (1260s) is a mirror-for-princes. The context is not "is this a sin?" but "how does a polity maintain stability?"

  **Key Textual Constraints:**
  *   **The Mechanism:** He argues against *"privata praesumptio"* (private presumption).
  *   **The Agent:** Action must be by *"publica auctoritate"* (public authority).
  *   **The Consequence:** Private action is *"multitudini periculosum"* (dangerous for the multitude).

  **The Logic:**
  Here, Aquinas is discussing the **removal of a regime**, not just the moral status of a killing. Even if a ruler is tyrannical (ruling for private good rather than common good), Aquinas argues that allowing private individuals to decide when a ruler is "tyrannical enough" to kill destabilizes the very concept of authority.

  Notice that *De Regimine* does **not** say tyrannicide is always sinful. It says it cannot be undertaken by *private presumption*. It explicitly allows for removal by *public authority*. This is the bridge.

  ### 3. The Reconciliation: "Public Authority" vs. "State of Exception"
  The standard secondary lit says "Usurpers can be killed by私 people; Legitimate Tyrants cannot." That is too rigid and, as you noted, lacks explicit textual warrant in *De Regimine*.

  A more textually faithful reading is this: **Aquinas consistently requires public authority for political removal, but he defines the availability of that authority differently in the two texts.**

  *   **In *De Regimine*:** A political community exists. Therefore, "public authority" resides in the community or its representatives (the "optimates" or a superior lord). Therefore, private individuals must wait for that public authority to act. To act alone is to usurp the authority of the community itself.
  *   **In *Sentences*:** The "public authority" is functionally non-existent (*"no recourse to a superior"*). The usurper, by definition of having no consent and seizing power by violence, has not established a true *public* order. In this specific void, the "public authority" devolves to the individual acting in defense of the *patria*.

  **The Textual Warrant for the Distinction:**
  You don't need the later Scholastic labels. You just need to track the word **"Superior"** (*Superior*).
  *   In *Sentences*, the permission to kill is contingent on the **absence** of a *Superior* who can judge.
  *   In *De Regimine*, the prohibition is contingent on the **presence** of a *Publica Auctoritas* that *should* judge.

  If you read *De Regimine* as the general rule (procedure for an existing polity) and *Sentences* as the exception (procedure when the polity is effectively held hostage by an external aggressor), they are consistent. *De Regimine* warns that if you allow private killing generally, you invite chaos. *Sentences* admits that if the chaos is already total (no superior, violent seizure), the private act becomes a public service.

  ### 4. The *Summa Theologiae* Synthesis (Your "Ace in the Hole")
  Since you are defending this to a committee, you should bring in **ST II-II, q. 42, a. 2, ad 3**. This is Aquinas's mature treatment of sedition, written after both the *Sentences* and during/after *De Regimine*. It synthesizes the two positions perfectly and gives you the vocabulary to explain the apparent contradiction.

  In the *Summa*, Aquinas asks if sedition is always a mortal sin. In the *ad 3*, he says:
  > "If the tyrannical regime is not excessive, it is better to tolerate it for a time than to risk greater dangers by opposing it... But if the tyranny is excessive, **it is not sedition to disturb such a regime**, unless perhaps the tyranny is so intolerable that the removal causes greater harm to the subjects than the tyranny itself."

  **How this helps your argument:**
  1.  **Moral Permission:** It confirms the *Sentences* view: opposing a tyrant is not inherently sinful/seditious.
  2.  **Prudential Warning:** It confirms the *De Regimine* view: You must weigh the dangers (*periculum*). Private action usually entails greater danger (civil war, worse tyrant) than the tyranny itself.
  3.  **The Shift:** It shows Aquinas moved from the casuistry of the *Sentences* (can this specific act be justified?) to the prudence of the *Summa/De Regimine* (is this act wise for the common good?).

  ### 5. Strategy for the Committee
  When you defend this, do not claim Aquinas is "consistent" in the sense of saying the exact same thing in both places. Claim he is **consistent in principle but distinct in application.**

  **The Argument:**
  "Aquinas maintains a consistent principle: **Political violence requires public authorization.**
  *   In *De Regimine*, where a political order exists, 'public authority' means the community or its representatives. Private action is forbidden because it usurps the community's role.
  *   In the *Sentences* scenario, the 'public authority' is absent (no superior, no consent). The usurper is a private aggressor. In this specific juridical vacuum, the individual acts *as* the public authority by necessity.
  *   The secondary literature's 'Usurper vs. Legitimate Tyrant' distinction is a useful heuristic, but the actual textual mechanism is the **presence or absence of a superior judge** (*recursus ad superiorem*)."

  **Addressing the "Development" Critique:**
  If a committee member pushes the "he changed his mind" angle, concede the nuance. "There is a shift in emphasis from the *Sentences* to *De Regimine*. The *Sentences* focuses on the moral innocence of the killer; *De Regimine* focuses on the political safety of the regime. However, the *Summa* shows he retained the moral permission of the *Sentences* while adopting the prudential caution of *De Regimine*."

  ### Summary of the "Move"
  Don't let the secondary lit off the hook. Your contribution can be pointing out that the "Usurper vs. Exercise" distinction is a **conclusion** scholars draw, not a **premise** Aquinas states. Aquinas's actual premise is **Juridical Recourse**.
  *   **Recourse available?** -> Public Authority must act (*De Regimine*).
  *   **Recourse impossible?** -> Private act is licit (*Sentences*).

  This allows you to say the texts are compatible without forcing Aquinas to use vocabulary he didn't use. It grounds the reconciliation in the text's own conditions (*nullus superior* vs. *publica auctoritate*).
