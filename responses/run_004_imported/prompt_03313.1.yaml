      *   *Wait, the user asked about Sentences vs. De Regimine specifically.* I should focus there, but bring in ST as the "mature view" that clarifies the tension.
      *   *Addressing the "Public Authority" in Sentences:* If there is no superior, who authorizes? Aquinas implies the act itself is justified by the lack of recourse. In *De Regimine*, he insists on procedure.
