      *   *Clarity:* Avoid excessive jargon without explanation. Define "Epistemic Akrasia" clearly.
      *   *Structure:* Follow the (a), (b), (c) structure requested.
      *   *Self-Correction during drafting:* I initially thought about using the "Detective" example, but the "Math/Calculation" example is standard in the literature (David Christensen's work) for a reason: it isolates reasoning from empirical facts. I'll stick close to that but narrative-ize it.
      *   *Addressing the "Just lower confidence" point:* I need to emphasize that the problem isn't about *degree* of belief, but about the *structure* of justification. If the HOE is strong enough, it doesn't just lower confidence; it undermines the *source* of the confidence.

  7.  **Final Polish:** Check against the specific constraints.
      *   Clean, sharp example? Yes (The Tip Calculation).
      *   Explain why it's a genuine problem? Yes (Conflict of norms, Akrasia).
      *   Discuss Level-Splitting? Yes.
      *   Acknowledge the user's situation? Yes (Intro/Outro).

  8.  *(Self-Correction on the "Enkratic Principle" name)*: The user mentioned "enkratic something." It's the "Enkratic Principle" or "Requirement of Rationality." I should confirm this terminology. Yes, often associated with John Broome or Maria Lasonen-Aarnio. I will use the term "Enkratic Principle."

  9.  *(Final thought on the User's specific case)*: In the user's case, the teammate provided *empirical* HOE. In the math case, it's *self-knowledge* HOE. I should make sure the example bridges that gap. The "Drunk Math" example works because the friend provides the HOE, similar to the teammate.

