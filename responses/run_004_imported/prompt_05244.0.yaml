          *   *Q4:* If we use probabilities, don't we just get a probabilistic version of the obstacle? (e.g., calibration issues).
          *   *Q5:* Is the "reflective oracle" itself subject to a similar limitation?
          *   *Follow-ups:* Need to anticipate her defending the math. The follow-ups should press on whether the *guarantee* is still there or if it's just "good enough."

      *   *Q6: Tiling Agents.* Connect to the specific AI alignment context (self-modification).
          *   *Follow-up:* Ask about the "waterfall" of trust degradation.

      *   *Q7: Computational Cost.* Logical induction is computationally expensive. Is this a theoretical fix or a practical one?
          *   *Follow-up:* If she says "Theory first," ask about the gap to implementation.

      *   *Q8: The "Goodhart" Angle.* If an agent optimizes for its own probability estimates, does it game them?
          *   *Follow-up:* Connect to wireheading.

      *   *Q9: Alternative Approaches.* Are there non-probabilistic solutions? (Sets up the final contrast).
