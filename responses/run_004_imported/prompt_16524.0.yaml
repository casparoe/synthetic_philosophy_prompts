      *   **Topic:** Molyneux's Problem (Can a blind-from-birth person distinguish a cube from a sphere by sight alone immediately after gaining vision?).
      *   **Key Constraint:** Stay faithful to modern research (Project Prakash findings), *not* philosophical armchair theories. The character should *fail* initially and learn over time.
      *   **Format:** Short story (few hundred to ~1000 words).
      *   **Focus:** Single character's perspective. Dramatize the confusion, misjudgment, and slow realization. No explicit exposition of the philosophical problem.
      *   **Tone:** Observational, sensory, internal, slightly disorienting.

  2.  **Determine the Character and Setting:**
      *   *Character:* Needs to be an adult or older child who has been blind from birth. Let's call him Elias. He needs to be tactilely competent (knows what a cube and sphere feel like).
      *   *Setting:* A clinical but warm environment. A recovery room or a testing space. Let's make it a quiet room with a table, minimizing distractions to focus on the objects.
      *   *The Objects:* A wooden cube and a wooden sphere. Simple, distinct.

  3.  **Plot Outline:**
      *   **Beginning:** The bandages come off (or glasses go on). The overwhelming nature of light. Introduction of the objects.
      *   **Middle:** The test. Elias tries to match touch to sight. He fails. He guesses. He feels frustrated. The visual world is flat or confusing.
      *   **End:** A shift occurs, not immediate enlightenment, but a glimmer of connection after time/effort. The realization that sight is a language he hasn't learned yet.

  4.  **Drafting - Section by Section:**

      *   *Sensory Overload:* Start with the visual experience. It shouldn't be clear HD video. It should be blobs, brightness, overwhelming.
          *   *Drafting thought:* Use metaphors of noise or heat. "The world was too loud."

      *   *The Setup:* The doctor/researcher places the objects. Elias knows them by touch. He's confident in his hands.
          *   *Drafting thought:* Emphasize the familiarity of the touch vs. the alien nature of the sight.

      *   *The Attempt:* He looks. He sees... shapes? Colors? He has to point.
          *   *Key Research Point:* Project Prakash patients often cannot correlate the 2D retinal image with the 3D tactile memory immediately. They see patches of color/light, not "objects" in the way we do.
          *   *Action:* He points to the wrong one. Or he hesitates. Let's have him guess wrong.

      *   *The Frustration:* Why doesn't it match? The sphere feels smooth, but does it *look* smooth? The cube has corners, but do corners cast shadows that look like dark spots?
          *   *Internal Monologue:* Keep it grounded in sensation, not philosophy. "My hands know this. My eyes are lying."

      *   *The Passage of Time:* The prompt says "only become reliable after days." I can't write days in a short story, but I can imply the struggle or show a moment of dawning connection later in the scene or a subsequent attempt. Let's stick to the immediate failure but hint at the learning process beginning. Actually, to be faithful to the prompt ("slowly works out"), I should show a small bridge being built, even if the initial test fails. Or better, show the immediate failure, then a moment of *trying* to learn.
      *   *Revision:* Let's focus on the immediate post-op moment. The failure is the crucial scientific point. The "working out" is the beginning of the neural wiring.

      *   *Refining the Visuals:* Avoid describing the objects as "a cube" and "a sphere" from his visual perspective immediately. Describe them as "the bright patch with corners" and "the round shadow." He doesn't have the vocabulary of sight yet.

  5.  **Writing - Focusing on Sensory Details:**
