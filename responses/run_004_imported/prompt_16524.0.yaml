answer: |-
  The light was not a thing Elias saw; it was a thing that hit him. It had weight, a physical pressure against his eyelids even before the bandages were fully peeled away. When the doctor finally stepped back, the world did not open up like a door. It exploded like a dropped jar of paint.

  There were no objects, only patches of aggression. Brightness here, shadow there. A chaotic noise of color that hurt the back of his skull. Elias blinked, tears smoothing the glare, and tried to find the edges of things. He had lived thirty years in a world of texture and temperature, of air currents and echo. This new input was silent, flat, and overwhelming.

  "Take your time," the doctor said. Her voice came from the bright patch on the left.

  On the table before him sat two shapes. He knew them. His hands had memorized them a thousand times in the dark. To the left, the sphere: cool, uninterrupted wood, a continuous curve that slipped away from the palm. To the right, the cube: sharp edges that bit the thumb, flat planes, distinct corners that announced themselves with geometric certainty.

  "Touch them," the doctor instructed.

  Elias reached out. His fingers were steady. He found the sphere first. The wood was smooth, the curve undeniable. He traced the circumference. *Sphere.* He moved to the second object. A corner dug into his index finger. He traced the flat face. *Cube.*

  He pulled his hands back into his lap. He knew where they were. He knew what they were.

  "Now," the doctor said softly. "Don't touch them. Just look. Point to the sphere."

  Elias focused. The visual field was still swimming, but he tried to isolate the shapes. He saw two dark forms against the lighter table. But the connection snapped. The tactile memory was a solid, heavy truth in his muscles; the visual input was a fragile, confusing ghost.

  The object on the left—the sphere—didn't look round. It looked like a flat circle of dark wood with a strange, smudged shadow in the middle. To his eyes, untrained in the language of light and shading, the shadow looked like a hole, a defect in the wood. A sphere should be uniform. This had a dark spot.

  The object on the right—the cube—was worse. The corner facing him cast a long, dark wedge of shadow. Was that part of the object? Or was it a gap between two things? The edges didn't scream "corner" to his retina the way they screamed to his skin. They just looked like lines where the color changed.

  He felt a surge of panic. His hands knew the truth, but his eyes were presenting a lie.

  He raised a trembling finger. He wanted to point to the smooth one, the one without the hole. He pointed to the cube.

  "Are you sure?" the doctor asked.

  Elias hesitated. The logic of touch was screaming at him, but the logic of sight was a foreign dialect. The object he had chosen had the dark wedge. The other one had the dark smudge. Neither looked like the things he knew. He was guessing. He was standing on the edge of a cliff, throwing stones into a fog and listening for a splash that never came.

  "The other one," he whispered, correcting himself, pointing to the sphere.

  "Okay," the doctor said. She didn't tell him he was wrong. She didn't tell him he was right. She just let the silence hang.

  Elias stared. He leaned forward, squinting. He tried to force his hands to speak to his eyes. *Smooth,* he told himself. *Look for smooth.* But how does smooth look? Does it shine? The cube was shining more. *Sharp,* he thought. *Look for sharp.* But the shadow on the sphere looked sharper than the edge of the cube.

  The disconnect was physical, a nausea in the gut. He had assumed that sight was simply touch at a distance. He had assumed that the shape of the world was a single truth that different senses merely reported. But sitting there, bathed in the harsh hospital light, he realized the senses were not translators. They were strangers.

  His hands knew the world by resistance, by where the object ended and the air began. His eyes knew the world by contrast, by how light died on a surface. The sphere did not feel like it had a shadow. The cube did not feel like it had highlights.

  "I can't tell," Elias said. The admission tasted like ash. "They look... flat. Like pictures."

  "Look at the edges," the doctor suggested.

  He tried. He traced the outline of the sphere with his gaze. It was round. Okay. That matched. But the cube... the cube's corner was hidden by the shadow. He couldn't find the angle.

  He reached out again, needing the anchor. He touched the sphere. *Round.* He looked at it. *Flat circle with a smudge.* He touched the cube. *Sharp.* He looked at it. *Polygon with a crack.*

  He sat back, exhausted. The bandages were gone, the cataracts cleared, the optics perfect. But he was still blind. He understood now that the philosophers who had debated this in their quiet studies had never had to look at a shadow and wonder if it was a hole. They had never had to learn that light has texture, that depth is a trick of the brain, not a gift of the eye.

  "Tomorrow," the doctor said, standing up. "We will try again."

  Elias kept looking at the two wooden shapes. He didn't look away. He stared at the shadow on the sphere, trying to will it to curve, trying to teach his brain to read the light as depth. It didn't happen. Not yet. But he kept staring, beginning the slow, painful work of building a bridge between the hand and the eye, one photon at a time.
