  *(Refining the "Smuggling" point)*: Newton isn't necessarily being dishonest. In textual criticism, "intrinsic probability" (what the author would likely write) is a valid criterion. Newton argues Paul *wouldn't* write something nonsensical. The counter is that Paul *might* write something paradoxical. So the disagreement is about the nature of theological language.

