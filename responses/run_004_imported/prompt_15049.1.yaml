answer: |-
  This is an exceptionally sharp observation. You have identified the central tension in modern metaethics: the conflict between the *phenomenology* of moral argument (which feels exactly like factual reasoning) and the *metaphysics* of anti-realism (which denies moral facts exist to ground that reasoning).

  The accusation that your interlocutor made—that using modus ponens in ethics "smuggles in realism"—is the blunt-force version of the Frege–Geach problem. If you want to remain an expressivist but continue arguing using ordinary logic, you cannot remain a *simple* expressivist (like Ayer's emotivism). You must adopt a *sophisticated* expressivism.

  Here is the breakdown of the implications for your position, an evaluation of the standard solutions, and a practical guide on how to keep arguing without being philosophically inconsistent.

  ### 1. The Core Problem: Why Logic Breaks for Simple Expressivists

  To understand the implication, we must look at why the factory farming syllogism fails under simple expressivism.

  **The Syllogism:**
  1.  If causing gratuitous suffering is wrong, then factory farming is wrong.
  2.  Causing gratuitous suffering is wrong.
  3.  Therefore, factory farming is wrong.

  **The Realist View:**
  Sentence (2) describes a fact. Sentence (1) describes a relationship between facts. Modus ponens works because the phrase "causing gratuitous suffering is wrong" has the same **truth-apt meaning** in both premises. It refers to the same state of affairs.

  **The Simple Expressivist View (Ayer/Early Emotivism):**
  Sentence (2) is not a fact. It is an expression of attitude, equivalent to "Boo, causing gratuitous suffering!"
  But what is Sentence (1)? It is not expressing an attitude toward suffering, because the speaker is not asserting that suffering is wrong; they are hypothesizing it.
  If (2) means "Boo suffering!", then (1) effectively means "If 'Boo suffering!', then 'Boo factory farming!'."

  **The Implication:**
  This is nonsense. You cannot have an "If... then..." relationship between two shouts of "Boo!" Consequently, the argument becomes invalid. The term "wrong" changes its meaning between the embedded context (premise 1) and the asserted context (premise 2). In logic, this is the fallacy of **equivocation**.

  **Implication for You:**
  If you are a simple expressivist, you logically cannot run moral syllogisms. You can only express conflicting attitudes. If you want to use modus ponens, you must admit that moral sentences function *as if* they are truth-apt propositions, even if you deny they describe mind-independent facts.

  ### 2. The Solutions: Do They Rescue Moral Argument?

  You asked specifically about Blackburn and Gibbard. Both attempt to solve Frege–Geach by explaining how expressivism can mimic realism closely enough to sustain logic.

  #### Simon Blackburn: Quasi-Realism
  Blackburn admits the problem and argues that expressivists must "earn the right" to talk like realists.
  *   **The Move:** He argues that our attitudes have a complex structure. We have attitudes *about* our attitudes. We can disapprove of having certain approvals. This higher-order structure allows us to construct a "logic of attitudes."
  *   **Does it save argument?** Yes. Blackburn argues that "truth" in ethics is not a robust metaphysical correspondence with reality, but a deflationary tool we use to endorse our own attitudes. When we say a moral argument is "valid," we mean that holding the premises and denying the conclusion involves a contradiction in our own web of attitudes.
  *   **Does it relocate the difficulty?** Critics (like realists) argue Quasi-Realism is a linguistic sleight of hand. If you talk exactly like a realist, claim moral sentences are "true," and say arguments are "valid," what work is the "anti-realism" doing? However, for your purpose (arguing without metaphysical baggage), it succeeds. It allows you to keep the logic while denying the "spooky" moral facts.

  #### Allan Gibbard: Norm-Expressivism
  Gibbard approaches this from the philosophy of mind and language.
  *   **The Move:** He argues that moral judgments express the acceptance of norms (plans for what to do/feel). Logic is not just about truth-preservation; it is about **consistency**. Just as it is inconsistent to believe $P$ and believe $\text{not-}P$, it is inconsistent to plan to do $X$ and plan to $\text{not-}X$.
  *   **Does it save argument?** Yes. Gibbard reconstructs logic so that modus ponens applies to plans and norms, not just beliefs. If you accept the norm "If suffering is bad, stop farming" and you accept the norm "Suffering is bad," consistency demands you accept "Stop farming."
  *   **Does it relocate the difficulty?** It moves the problem from metaphysics to the philosophy of action. It requires accepting that there is a "logic of planning" analogous to the "logic of belief." Most rationalists find this intuitive (it aligns with decision theory), but it is technically a heavy lift.

  ### 3. Practical Implications for Your Arguments

  You want to know if you can keep arguing as you do. The answer is **yes**, but with three specific caveats to avoid the "smuggling realism" charge.

  #### A. Accept "Deflated" Truth
  When you say "It is true that factory farming is wrong," do not mean this corresponds to a Platonic form or a physical particle. Mean that you endorse the norm prohibiting factory farming.
  *   **Why:** This prevents the realist from trapping you. If they ask, "Is that *really* true?" you answer, "It is true in the only sense moral truth exists: it is the conclusion of a consistent system of norms I accept."
  *   **The Frege-Geach Fix:** This allows the sentence to function in a conditional ("If it is true that...") without requiring a metaphysical fact.

  #### B. Frame Validity as Consistency
  When you run a syllogism, understand that you are not demonstrating that the conclusion matches the universe. You are demonstrating that denying the conclusion is **incompatible** with accepting the premises.
  *   **Why:** This aligns with Gibbard's view. You are showing your interlocutor that their own web of attitudes/norms is inconsistent if they accept the premises but reject the conclusion.
  *   **The Frege-Geach Fix:** This explains why the logic holds. It holds because human psychology/normativity requires consistency, not because the universe forces it.

  #### C. Don't Fear the "As If"
  You are effectively engaging in a *fictionalism* or *quasi-realism*. You are treating moral claims *as if* they are factual for the purpose of the argument.
  *   **Why:** This is intellectually honest. You acknowledge that while there are no moral atoms, the *structure* of moral discourse is logical.
  *   **The Frege-Geach Fix:** This disarms the accusation that you are "smuggling" realism. You aren't smuggling it; you are openly using a reconstructed version of it.

  ### 4. Conclusion: Is the Difficulty Merely Relocated?

  You asked if these solutions merely relocate the difficulty to somewhere less visible.

  **Honest Answer:** Yes, but that is a feature, not a bug.

  The difficulty is relocated from **Metaphysics** (How do moral facts exist?) to **Philosophy of Language/Mind** (How do we use language to coordinate attitudes?).
  *   For a rationalist, this is a winning trade. Metaphysical moral facts are epistemologically inaccessible and causally inert (the "queerness" argument).
  *   The philosophy of language/mind required to solve Frege-Geach (Blackburn/Gibbard) is complex, but it deals with things we actually interact with: language, psychology, and consistency.

  **Recommendation:**
  You can continue using modus ponens in ethical arguments. When challenged on Frege-Geach:
  1.  Acknowledge that simple emotivism cannot support logic.
  2.  State that you adhere to a **sophisticated expressivism** (like Gibbard's).
  3.  Clarify that for you, "validity" means **consistency of norms**, not correspondence to fact.
  4.  Assert that this preserves the utility of moral argument (resolving conflicts of attitude) without requiring ontologically queer moral facts.

  This position is stable. It allows you to participate in the rationalist community's style of argumentation without contradicting your anti-realist metaethics. The "smuggling" accusation only sticks if you claim your moral truths are *robustly* real in a scientific sense. If you claim they are *expressively* real (truth-apt within the system of norms), the logic holds.
