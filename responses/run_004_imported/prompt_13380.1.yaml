answer: |-
  The conference room was pressurized, sealed against the noise of the city below, but the silence inside was heavier. On the main display, two columns of numbers glowed red.

  **Aegis Dynamics: $9.4 Billion**
  **Vortex Corp: $9.5 Billion**

  **Contract Value: $10.0 Billion**

  "Pull the plug," said Halloway, the head of Operations. His voice was tight. "We're past the break-even point. We're into the loss zone. If we win, we make half a billion. If we lose, we lose nine point four. The risk profile is unacceptable."

  Elena Vance, Chief Strategy Officer, didn't look at Halloway. She kept her eyes on the numbers. They were developing the guidance system for the Orbital Defense Grid. The government's request for proposals had a specific, brutal clause: both finalists were required to build a fully functional prototype at their own expense. Only the winner received the contract. The loser received nothing, and no reimbursement.

  "It's not a risk profile," Elena said quietly. "It's a trap."

  "Exactly," Halloway snapped. "It's a sunk cost fallacy. We're throwing good money after bad because we don't want to admit we spent nine billion on nothing."

  Elena finally turned. "No. That's the popular gloss. It's wrong. If this were a standard auction, you'd be right. In a standard auction, only the winner pays. If I bid nine billion and lose, I walk away with my wallet intact. I can ignore the time I spent bidding. But this isn't a standard auction. This is a Dollar Auction."

  She tapped the console, bringing up the contract terms again. "Clause 14-B. 'All development costs incurred by the non-selected proposer are non-recoverable.' Think about the position we are in right now. We are the second-highest bidder. Vortex is ahead by one hundred million."

  "So we're losing," Halloway said.

  "If we stop now," Elena corrected, "we lose $9.4 billion. Guaranteed. We write that off today. Zero return. But consider the alternative. We authorize the next tranche. One hundred million. That brings us to $9.5 billion, matching Vortex. Then we push another hundred million to take the lead."

  "And spend ten billion to win a ten billion contract?" Halloway laughed, a dry, brittle sound. "That's a zero-sum gain. Maybe a loss if overhead ticks up."

  "It's not about the gain," Elena said. "It's about the loss mitigation. If we bid $10.1 billion, and Vortex folds *right now*, we win the contract for $10.1 billion. Our net loss is only $100 million."

  The room went still.

  "Compare the outcomes," Elena continued, her voice steady, clinical. "Option A: We fold. Loss is $9.4 billion. Option B: We escalate. If Vortex folds immediately, our loss is $100 million. Rational agents minimize loss. Spending another hundred million to save $9.3 billion is not a fallacy. It's arithmetic."

  "But Vortex won't fold," said Chen, the legal counsel. "They're in the same position. They've spent $9.5 billion. If we bid $10.1 billion, they become the second-highest bidder. If they stop, they lose $9.5 billion. If they bid $10.2 billion, they risk losing only $200 million if we fold."

  "Exactly," Elena said. "We aren't bidding against the value of the contract anymore. The contract value is irrelevant. We are bidding against the size of our own sunk costs. We are betting on their resolve. They are betting on ours. Every time we escalate, we aren't trying to win the prize. We are trying to force the other side to accept a guaranteed catastrophic loss rather than a marginal one."

  "So it spirals," Chen whispered.

  "It spirals until one side runs out of liquidity or political capital," Elena said. "The tragedy isn't that we are irrational. The tragedy is that stopping is the irrational move. If I were a machine, programmed to maximize utility, I would not stop. To stop is to accept a penalty of nine billion. To continue is to buy a lottery ticket where the prize is 'losing less.'"

  Halloway rubbed his face. "But we know they're thinking the same thing. They have the same analysts. They know the math."

  "Of they do," Elena said. "This isn't a mistake. It's a structure. The government didn't make an error in the contract terms. They designed it this way. They want the system built, and they want the price driven down by competition, but they shifted the risk entirely onto us. They created a Moloch trap. They know that once we cross the 50% threshold of the contract value, we can't leave. We are locked in by our own rationality."

  She looked back at the screen. The numbers hadn't changed, but the weight of them had shifted. It wasn't a mountain of wasted money; it was a gravity well.

  "If we authorize the next tranche," Halloway said, "we are committing to go past ten billion. We are committing to lose money even if we win."

  "We are committing to the only path that doesn't guarantee immediate bankruptcy," Elena said. "Look at the alternative. If we walk away, our stock drops 40% tomorrow. Credit rating slashes. We become a takeover target. If we continue, even if we win at $11 billion, we take a hit, but we remain a prime contractor. We survive to bid on the next one."

  "And if Vortex goes to $12 billion?"

  "Then we re-evaluate based on their liquidity limits," Elena said. "But we don't fold now. Folding now is donating $9.4 billion to the void for nothing. Escalating is a bet that Vortex's board is less willing to bleed than ours. It's a test of pain tolerance, not value."

  Halloway looked at the other board members. They were pale. They understood the math. They understood that the "sunk cost fallacy" was a label used by people who didn't understand the payment rules. This wasn't about pride. It wasn't about stubbornness. It was about the fact that the exit door had been locked from the outside, and the key was held by the competitor in the other tower.

  "We have to assume," Chen said, "that Vortex knows this is a trap too."

  "They do," Elena said. "And they know we know. That's the equilibrium. We are both rational agents maximizing utility in a system designed to punish utility maximization. The only way to win is to not play, but we started playing six years ago. We are past the event horizon."

  She tapped her tablet, bringing up the authorization form for the next phase of development. The amount was $200 million.

  "This isn't about winning the contract anymore," Elena said, signing the digital field. "It's about ensuring that when the collapse comes, it happens to them, not us. We force them to be the ones who stop. We make the cost of their stopping higher than the cost of our continuing."

  Halloway watched the cursor blink. He knew that Vortex was likely in a room just like this, looking at the same numbers, having the same conversation. They would authorize the tranche. Then Aegis would authorize another. Then Vortex. They would climb past $10 billion, past $11 billion, eating their own capital to avoid the certain death of stopping.

  "It's insane," Halloway murmured.

  "It's optimal," Elena corrected. She hit submit.

  The screen updated.

  **Aegis Dynamics: $9.6 Billion**
  **Vortex Corp: $9.5 Billion**

  They waited. The silence stretched, thick and suffocating. They knew what was coming. They knew Vortex couldn't stop. To stop now would be to accept a $9.5 billion loss when a mere $100 million more offered a chance to reduce that loss to nearly zero. Vortex would bid.

  And when they did, Aegis would have to bid again. Not because they wanted to, but because the alternative was mathematically worse.

  "The update from Vortex," Chen said softly, watching his feed.

  The number ticked up.

  **Vortex Corp: $9.7 Billion**

  Elena didn't flinch. She didn't feel anger, or frustration, or pride. She felt the cold clarity of the mechanism clicking into place. They were gears in a machine that consumed value to produce nothing but a winner who lost less than the loser.

  "Prepare the next tranche," Elena said.

  "But—" Halloway started.

  "Prepare it," she said. "They blinked first on the margin. They showed they're willing to go to 9.7. We have to show we're willing to go to 9.8. We don't stop until one of us ceases to exist."

  She looked at the contract value, the $10 billion prize that had started the fire, now irrelevant amidst the billions being burned to keep it going. The prize was no longer the money. The prize was avoiding the penalty for losing.

  "Send it," Elena said.

  The authorization went out. The numbers climbed. The trap held tight, and rationality demanded they tighten it further.
