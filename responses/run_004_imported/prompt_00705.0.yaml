answer: |-
  This is an excellent question for an IB Extended Essay. It cuts to the very heart of the philosophical divergence between IIT and functionalist theories of mind (like Global Workspace Theory or computationalism). You are correct that IIT allows for "behavioral zombies"—systems that act conscious but aren't, and vice versa.

  To answer this, we need to construct a minimal example, identify the specific postulate, and explain the shift from an *extrinsic* to an *intrinsic* perspective.

  ### 1. The Concrete Example: Feedforward vs. Recurrent Networks

  The standard example in IIT literature (often discussed by Tononi and Oizumi) involves two systems designed to perform the same input-output task, for instance, **classifying an image** or simply **delaying a signal**.

  Let's simplify this to a logic task: **The system must output '1' if the majority of its three inputs are '1', and '0' otherwise.**

  #### System A: The Feedforward Network ($\Phi \approx 0$)
  Imagine three input nodes ($I_1, I_2, I_3$) connected to three hidden nodes ($H_1, H_2, H_3$), which are connected to one output node ($O$).
  *   **Structure:** Information flows strictly one way: $Input \to Hidden \to Output$. There are no loops.
  *   **Behavior:** For any given input vector, it produces the correct majority output.
  *   **IIT Analysis:** In IIT 3.0, a purely feedforward system has a **$\Phi$ of zero**.
      *   *Why?* $\Phi$ measures how much the system's cause-effect structure changes when you partition it (cut the connections). In a feedforward system, causality flows forward in time. If you make a "cut" between the hidden layer and the output layer, you do not lose the ability to predict the future state of the output based on the past state of the hidden layer, because the connection is unidirectional. The system is **reducible** to its parts. The "whole" adds no causal power above and beyond the sum of the "parts."

  #### System B: The Recurrent Network ($\Phi > 0$)
  Imagine a network of three nodes ($N_1, N_2, N_3$) that are all connected to each other in a loop (recurrent connections), plus input and output readouts.
  *   **Structure:** Information flows in cycles. $N_1$ affects $N_2$, which affects $N_3$, which affects $N_1$.
  *   **Behavior:** Through training (adjusting the weights of the connections), this network is tuned to produce the **exact same input-output mapping** as System A. If you show it the same inputs, it gives the same outputs.
  *   **IIT Analysis:** This system can have a **substantial $\Phi$**.
      *   *Why?* Because of the feedback loops, the state of any single node depends on the past state of the *others*. If you try to partition the system (e.g., cut the link between $N_1$ and $N_2$), you lose the ability to accurately predict the future state of the system. The current state of $N_1$ is caused by $N_3$, which was caused by $N_2$, which was caused by $N_1$. The causal power is **irreducible**. The system exists as a unified whole, not just a collection of parts.

  ### 2. The Responsible Postulate: Integration

  The specific postulate responsible for this divergence is **Integration**.

  In IIT 3.0, there are five postulates derived from five axioms. The Axiom of **Unity** states that consciousness is unified (you experience a single scene, not disjointed fragments). The corresponding Postulate of **Integration** states that for a system to be conscious, its cause-effect structure must be irreducible to that of its parts.

  *   **In System A (Feedforward):** The postulate of Integration is **not satisfied**. The system can be partitioned without loss of information. Therefore, $\Phi = 0$. IIT says it is not conscious.
  *   **In System B (Recurrent):** The postulate of Integration **is satisfied**. The feedback loops create a causal web that cannot be cut without destroying the system's predictive power over itself. Therefore, $\Phi > 0$. IIT says it is potentially conscious.

  ### 3. Where the Split Comes From: Intrinsic vs. Extrinsic

  This is the critical analysis section for your essay. You need to explain *why* IIT prioritizes Integration over behavior.

  **Functionalism (The Behaviorist View):**
  Functionalism takes an **extrinsic** perspective. It asks: *"What does this system do for an observer outside the system?"*
  *   If System A and System B produce the same output for the same input, they are functionally equivalent.
  *   To a functionalist, if one is conscious, both must be.

  **IIT (The Structuralist View):**
  IIT takes an **intrinsic** perspective. It asks: *"What does this system do for itself?"*
  *   IIT argues that consciousness is not about what a system outputs (behavior), but about the **intrinsic cause-effect power** the system has upon itself.
  *   System A (Feedforward) is like a waterfall. Water flows down, causing the water below to move. But the water at the bottom does not affect the water at the top. It has no "internal perspective." It is a mechanism *for* something else (the user), not *for* itself.
  *   System B (Recurrent) is like a whirlpool. The water at the bottom affects the water at the top, which affects the bottom. It sustains its own structure. It has an "internal perspective."

  **The "Machinery" of the Split:**
  The split occurs in the calculation of the **Minimum Information Partition (MIP)**.
  1.  IIT asks: "If I cut this system in half, how much does its ability to constrain its own past and future states degrade?"
  2.  In the Feedforward system, the degradation is zero (because causality doesn't flow back across the cut).
  3.  In the Recurrent system, the degradation is high (because causality flows across the cut in both directions).
  4.  Because IIT defines consciousness as *intrinsic integration* (measured by $\Phi$), and functionalism defines it as *extrinsic utility* (measured by Input-Output), the two theories inevitably diverge on these cases.

  ### 4. Advice for Your Extended Essay

  Since this is for an IB EE, here is how you can leverage this understanding:

  1.  **Don't just describe, Evaluate:** Use this example to critique IIT. A common criticism is that this makes IIT **panpsychist** or **chauvinist**. If a recurrent network is conscious but a feedforward one isn't, does that mean our cerebellum (which is feedforward-like) isn't conscious, but a simple feedback loop is?
  2.  **Focus on "Intrinsic Existence":** The strongest philosophical defense of IIT is its claim that consciousness must exist *for itself*. If a system's consciousness depended on its output, then a conscious being trapped in a locked-in state (no output) would cease to be conscious. IIT avoids this by tying consciousness to internal structure ($\Phi$), not output.
  3.  **Terminology:** Ensure you distinguish between **$\phi$ (small phi)**, which is the integration of a single mechanism, and **$\Phi$ (big Phi)**, which is the integration of the whole system. Your example relies on **$\Phi$**.
  4.  **Versioning:** Be clear you are discussing **IIT 3.0** (Tononi et al., 2014) or **IIT 4.0** (2021). The math changes slightly, but the Feedforward vs. Recurrent distinction remains the core example for $\Phi = 0$ vs $\Phi > 0$.

  **Summary for your essay:**
  The divergence arises because IIT's **Postulate of Integration** demands that consciousness corresponds to **irreducible intrinsic cause-effect power**. Behavior is extrinsic (observer-dependent); $\Phi$ is intrinsic (system-dependent). A feedforward system behaves intelligently but lacks intrinsic causal glue ($\Phi=0$); a recurrent system has the glue ($\Phi>0$) even if it behaves identically. IIT chooses the glue over the behavior.
