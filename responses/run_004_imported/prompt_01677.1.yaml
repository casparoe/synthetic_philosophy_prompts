prompt: |-
  I've recently become engaged with systematic investing and frequently encounter the Kelly criterion presented as the optimal betting strategy. I understand the basic intuition about long-run wealth accumulation, but I'm genuinely uncertain about the conceptual foundations. What would a rigorous defense of the Kelly criterion as rationally optimal need to establish? What assumptions about rationality, utility functions, and time horizons does it depend upon, and how do these assumptions fare against rival approaches?
