      *   *What is the rigorous defense?* It relies on the Ergodicity argument (time average vs. ensemble average) and the specific utility function $U(W) = \ln(W)$.
      *   *What are the criticisms?* Volatility drag, drawdowns, estimation error sensitivity, finite horizons, non-log utility preferences.
      *   *Key names:* John Kelly, Ed Thorp, Ole Peters (Ergodicity Economics), Samuelson (critic), Merton.

  3.  **Structure the Response:**
      *   **Introduction:** Acknowledge the status of KC (famous but misunderstood). State the thesis: KC is optimal *only* relative to specific objectives (long-term geometric growth), not universally.
      *   **The Core Argument (The "Why"):** Explain the mathematical objective (maximizing expected log wealth). Connect this to geometric mean return.
      *   **Pillar 1: Utility Theory:** Discuss $U(W) = \ln(W)$. Why log? Diminishing marginal utility. Contrast with linear (risk-neutral) or quadratic (mean-variance).
      *   **Pillar 2: Time & Ergodicity:** This is crucial. Distinguish between ensemble average (expected value) and time average (growth rate). Introduce Ole Peters' work. This addresses the "ruin" problem.
      *   **Pillar 3: Asymptotic Optimality:** The Breiman result. As $T \to \infty$, Kelly dominates other strategies with probability 1.
      *   **Critical Assumptions & Vulnerabilities:**
          *   Infinite horizon (or very long).
          *   Known probabilities (estimation risk).
          *   Divisibility/liquidity.
          *   No utility of consumption (pure reinvestment).
      *   **Rival Approaches:**
          *   Mean-Variance Optimization (MVO): Single period, quadratic utility.
          *   Fractional Kelly: Practical compromise.
          *   Expected Utility Maximization (General): KC is a special case.
      *   **Conclusion:** Summarize the "rigorous defense." It's not a law of nature, but a specific solution to a specific optimization problem.

  4.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Intro:* Start by clarifying that "optimal" is ill-defined without an objective function. KC maximizes *growth rate*, not *wealth* in a single period.
      *   *Utility:* Need to explain *why* log utility. It's the only utility function that is myopic (single-period optimization works for multi-period) and scale-invariant. Mention Bernoulli's St. Petersburg Paradox resolution.
      *   *Ergodicity:* This is the modern rigorous defense. Standard econ uses ensemble averages (what happens across parallel universes). Real investing is time-series (one universe). Non-ergodic processes mean $E[W_T] \neq \text{Growth Rate}^T$. KC maximizes the time-average growth rate.
      *   *Asymptotics:* Breiman (1961). If you play forever, Kelly wins. But "forever" is a long time. Samuelson's critique: If you have a finite horizon and non-log utility, Kelly might be suboptimal.
      *   *Practicality:* Estimation error is the killer. Overbetting leads to ruin. Hence "Half-Kelly."
      *   *Rivals:* MVO is the main competitor. MVO maximizes $E[R] - \lambda Var(R)$. Kelly is essentially MVO with a specific risk aversion parameter that changes with wealth (CRRA = 1).

  5.  **Refining the Argument (Self-Correction/Nuance):**
