answer: |-
  A rigorous defense of the Kelly Criterion (KC) as "rationally optimal" cannot rest on the claim that it maximizes expected wealth (it does not) or that it minimizes risk in the conventional variance sense (it does not). Instead, a rigorous defense must establish that KC is the unique solution to a specific optimization problem regarding **long-term capital growth under reinvestment.**

  To defend KC as rationally optimal, one must validate four specific conceptual pillars. If any of these pillars crumble, the optimality of Kelly evaporates.

  Here is an analysis of the conceptual foundations, assumptions, and rival frameworks required to evaluate the Kelly Criterion.

  ---

  ### 1. The Objective Function: Geometric vs. Arithmetic Mean
  The most common misconception is that investing aims to maximize **Expected Value (EV)** (the arithmetic mean). If your objective is to maximize $E[W_T]$ (expected terminal wealth) in a positive expectancy game, the optimal strategy is to bet 100% of your bankroll every time. This leads to almost certain ruin (gambler's ruin) due to volatility drag, even though the *average* outcome across all possible parallel universes is infinite.

  **The Kelly Defense:**
  A rigorous defense must argue that rational agents care about the **Time-Average Growth Rate** (the geometric mean), not the Ensemble-Average Expectation.
  *   **Ensemble Average:** What happens to 1,000 people betting once.
  *   **Time Average:** What happens to 1 person betting 1,000 times.

  In non-ergodic systems (like investing with reinvestment), these two averages diverge. A rigorous defense of KC relies on **Ergodicity Economics** (championed recently by physicist Ole Peters). It posits that because we live in one timeline, not a multiverse, rationality requires maximizing the growth rate of wealth along a single time path. KC is the mathematical maximum of the expected logarithmic growth rate.

  ### 2. The Utility Assumption: Logarithmic Utility
  In neoclassical economics, "optimality" is defined by maximizing Expected Utility, $E[U(W)]$. The Kelly Criterion is mathematically equivalent to maximizing expected utility where the utility function is logarithmic:
  $$U(W) = \ln(W)$$

  **The Rationality Defense:**
  To claim KC is optimal, you must defend $\ln(W)$ as the rational utility function for an investor.
  *   **Diminishing Marginal Utility:** Log utility implies that the pain of losing 50% of your wealth is exactly equal to the pleasure of gaining 100%. This captures a specific form of risk aversion.
  *   **CRRA Property:** Log utility exhibits Constant Relative Risk Aversion (CRRA) with a coefficient of 1. This means your risk exposure scales linearly with wealth (you always keep the same *fraction* in risky assets).
  *   **Myopic Optimality:** A unique property of log utility is that maximizing single-period expected utility automatically maximizes multi-period expected utility. You do not need to know your time horizon to act optimally today.

  **The Vulnerability:**
  If an investor's utility function is not logarithmic (e.g., they have a specific liability to meet, or they derive utility from consumption rather than terminal wealth), KC is **not** optimal. Paul Samuelson's famous critique was that KC is only optimal for "log-utility maximizers," and there is no a priori reason why all rational agents must have log utility.

  ### 3. The Time Horizon: Asymptotic Dominance
  The strongest mathematical defense of Kelly is asymptotic. Breiman (1961) proved that as the number of bets $N \to \infty$, a Kelly bettor will almost surely outperform any other essentially different strategy.

  **The Defense:**
  If the investment horizon is sufficiently long, the strategy with the highest geometric mean return will dominate with probability approaching 1. The Kelly strategy minimizes the expected time to reach a large financial goal.

  **The Vulnerability:**
  "In the long run we are all dead." The convergence to optimality is asymptotic. In finite horizons, Kelly can underperform.
  *   **Drawdown Risk:** Kelly maximizes growth, not risk-adjusted return. It can endure drawdowns of 50%, 70%, or more. If an investor has a finite horizon or margin calls, they may be forced to liquidate before the asymptotic advantage materializes.
  *   **Path Dependency:** While Kelly wins in the limit, the *variance* of the terminal wealth distribution remains high. A rival strategy with lower growth but lower variance might offer a higher probability of beating a specific benchmark over a 10-year horizon.

  ### 4. Epistemic Assumptions: Known Probabilities
  The Kelly formula $f^* = \frac{p(b+1) - 1}{b}$ requires precise knowledge of $p$ (probability of win) and $b$ (odds/payoff).

  **The Defense:**
  A rigorous defense assumes the investor has an "edge" that is quantifiable and stable. In systematic investing, this implies the alpha model is robust and stationarity holds.

  **The Vulnerability:**
  This is the practical Achilles' heel. Kelly is extremely sensitive to estimation error.
  *   **Overbetting:** If you overestimate your edge, you bet too much. Betting more than "Full Kelly" reduces geometric growth and increases ruin risk.
  *   **The Defense against Error:** Most rigorous practitioners argue for **Fractional Kelly** (e.g., Half-Kelly). This can be rationalized not as a deviation from KC, but as an adjustment for uncertainty. If you treat your estimated probabilities as distributions rather than point estimates, the optimal bet size shrinks. Thus, Fractional Kelly is actually "Bayesian Kelly."

  ---

  ### Comparison with Rival Approaches

  To fully evaluate the rigorous defense, we must contrast KC with the two dominant alternatives:

  | Feature | **Kelly Criterion** | **Mean-Variance (MVO)** | **Expected Value (Naive)** |
  | :--- | :--- | :--- | :--- |
  | **Objective** | Max Geometric Growth | Max Risk-Adjusted Return | Max Arithmetic Return |
  | **Utility** | Logarithmic $U(W) = \ln(W)$ | Quadratic $U(W) = W - \lambda W^2$ | Linear $U(W) = W$ |
  | **Time** | Multi-period (Compounding) | Single-period (Static) | Single-period |
  | **Risk Measure** | Ruin / Volatility Drag | Variance / Std Dev | Probability of Loss |
  | **Optimality** | Asymptotic Wealth | Efficient Frontier | Expected Terminal Wealth |

  **1. Versus Mean-Variance Optimization (MVO):**
  MVO is the industry standard. It maximizes $E[R] - \lambda \sigma^2$.
  *   *Critique of MVO:* It is a single-period model applied to multi-period problems. It treats variance as risk, whereas Kelly treats **loss of capital** (drawdown) as the primary risk.
  *   *Connection:* For small bets, Kelly is approximately equivalent to MVO with a specific risk aversion parameter. However, MVO can suggest leverage levels that imply negative wealth (bankruptcy), whereas Kelly naturally limits leverage to prevent ruin (assuming log utility).

  **2. Versus Expected Value Maximization:**
  *   *Critique of EV:* Maximizing EV suggests betting the entire bankroll on any positive expectancy bet.
  *   *Defense of Kelly:* This ignores the **irreversibility of ruin**. Once wealth hits zero, you cannot compound. KC is the boundary between growth and ruin.

  ---

  ### Summary: What a Rigorous Defense Must Establish

  To claim the Kelly Criterion is rationally optimal, you are not making a universal claim about all investing. You are making a conditional claim. A rigorous defense must establish the following:

  1.  **The Goal is Survival and Growth:** The investor's primary objective is to maximize the long-term compound growth rate of capital, not to maximize expected wealth in a single period.
  2.  **Ergodicity Violation:** The investor acknowledges that financial markets are non-ergodic; time averages do not equal ensemble averages. Therefore, avoiding ruin (absorbing barriers) is a prerequisite for participation.
  3.  **Log-Utility Preference:** The investor possesses (or acts as if they possess) logarithmic utility, valuing percentage changes in wealth equally regardless of scale.
  4.  **Edge Robustness:** The investor acknowledges estimation risk and adjusts bet sizes downward (Fractional Kelly) to account for the uncertainty in their edge parameters.

  **Conclusion:**
  The Kelly Criterion is not a "law of nature" for investing. It is the optimal solution to the problem: *"How do I maximize the growth rate of my wealth over an infinite horizon given a known positive expectancy, assuming I cannot go bankrupt?"*

  If your time horizon is short, your utility function is not logarithmic, or your edge estimates are noisy, Kelly is not optimal. However, as a conceptual anchor, it provides the only mathematically consistent framework for understanding the relationship between **edge, odds, and position sizing** in a compounding environment. It defines the upper bound of rational leverage; exceeding it is mathematically provable as sub-optimal (reducing growth while increasing risk).
