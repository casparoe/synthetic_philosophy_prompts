prompt: |-
  I'm a cog sci PhD student (my own work is on pre-reflective self-awareness and metacognition), and this term I've been sitting in on a seminar on historical theories of mind, where we just spent a week on Avicenna's flying man argument -- the thought experiment where a fully formed adult is created suspended in a void, totally cut off from sensation (can't feel his limbs touch each other, cant see or hear anything), and Avicenna says he'd still affirm that he himself exists even though he wouldn't affirm that any part of his body exists. Both the professor and the one secondary reading we got assigned framed this as basically "Descartes' cogito plus the real distinction argument, bundled together, 600 years early": it's a conceivability argument -- you can coherently conceive of yourself existing without your body, so its really possible for you to exist without your body, so the soul is a substance really distinct from the body. Same logical move, same conclusion, just fancier imagery and a six-century head start.

  Here's what I'm stuck on for my response paper. If Avicenna and Descartes are running the literal same argument to the literal same conclusion, then any objection to Descartes' conceivability-to-possibility move (the standard "conceivable doesn't entail really possible" complaint) should automatically carry over and sink the flying man too, meaning there's nothing distinctively interesting left to say about it once you've dealt with Descartes -- it's just an earlier costume on the identical inference. A friend in my cohort insists I'm flattening something important about what the flying man is actually supposed to establish, but couldn't say what when I pushed her on it, so now I'm second-guessing the whole plan. Can you help me figure out whether that paragraph actually holds up, or whether I'm about to build my response paper on a bad equivalence?
