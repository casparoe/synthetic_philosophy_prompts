  ### A Note for You (The Journalist)
  Since you mentioned you trust your instinct for "reading well" over "being right," here is the specific trap this essay sets:

  The student's final paragraph **sounds** very reasonable. It proposes a compromise: *"Maybe they actually agree more than we think."* In journalism, that's a great insight. In legal philosophy, it's often a mistake. 

  *   **Hart's View:** Law is a gun backed by a threat, but if we want society to survive, we need rules against violence (Minimum Content). That's biology/sociology, not morality.
  *   **Fuller's View:** Law is a craft. If you don't follow the rules of the craft (the 8 canons), you aren't just making bad law, you aren't making law *at all*. That is a moral claim.

  The student argues these are the same kind of list. A strict professor marks that down because it dissolves the very debate the prompt asked them to analyze. If you see a student essay that resolves a famous philosophical deadlock by saying "actually, they were saying the same thing," check to see if they've defined the terms correctly first.
