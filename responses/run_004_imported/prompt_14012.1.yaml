prompt: |-
  Okay so this is going to sound like a weird rabbit hole, but here goes. With everything going on in the news lately about strongman leaders and how far people can or should go to resist them, I got into a whole tangent argument with my uncle over dinner about whether it's ever justified to just kill a tyrant instead of waiting on "proper channels," and somebody at the table went "didn't Aquinas write about this?" which sent me down a two-week reading spiral. Turns out he did, and it's way less straightforward than the "great Catholic philosopher says tyrannicide is fine actually" meme going around online — he treats a usurper who grabbed power illegitimately very differently from a legit ruler who just governs badly, and in his book on kingship he actually spends a bunch of time warning that private citizens taking it on themselves to assassinate tyrants is likely to backfire and produce worse tyrants, arguing instead that it's the community or its proper authority that should depose him, or failing that you're basically supposed to endure it and pray.

  Anyway, this became relevant because I co-run a tiny history-of-ideas podcast with a friend (like, forty listeners, mostly our moms), and we somehow managed to book a political theory professor who's finishing a book arguing that this "cautious Aquinas" reading is basically wrong — that if you read his commentary on the Sentences together with the Summa's stuff on sedition, he's implicitly licensing a lot more than he ever says outright, including ordinary people acting on their own against an illegitimate ruler, and that the "wait for public authority" line in his book on kingship is more of a prudential aside than his real, considered position. Shes also fond of pointing out that "usurper" was doing a lot of work for him and can be stretched pretty far if you want it to.

  I want to interview her in a way that doesnt just let her restate her book's thesis. Can you draft me 8-10 questions, ideally with a quick follow-up planned for each depending on how she's likely to answer? I definitely want at least one question that puts real weight on the usurper/legitimate-ruler distinction and asks how much can ride on it without collapsing into "it's a tyrant if I say it's a tyrant," one on the sedition argument (if a tyranny is already itself the "real" disorder, doesn't that same move let basically anyone justify removing any ruler they dislike), and one that uses the Jean Petit affair and its condemnation at Constance as a kind of stress test on her reading. Bonus points if you can work in something comparing her to John of Salisbury's much more full-throated defense of tyrannicide, since I get the sense she wants credit for being more careful than he was, and I'm not totally convinced that holds up.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Thomas Aquinas's views on tyrannicide/tyranny, specifically challenging the "cautious Aquinas" consensus.
      *   **Guest:** A political theory professor finishing a book arguing Aquinas implicitly licenses more resistance (including private action) than traditionally thought, especially regarding "usurpers."
      *   **Host:** Co-host of a small history-of-ideas podcast (40 listeners, informal but intellectually serious tone).
      *   **Goal:** 8-10 interview questions with follow-ups.
      *   **Constraints/Requirements:**
          *   Don't just let her restate the thesis.
          *   Must include a question on the *usurper vs. legitimate ruler* distinction (risk of subjectivity).
          *   Must include a question on *sedition* (if tyranny is disorder, does removing it justify disorder?).
          *   Must include a question on the *Jean Petit affair/Council of Constance* as a stress test.
          *   Bonus: Compare with *John of Salisbury* (Policraticus) to test her claim of being "more careful."
          *   Tone: Intellectual, engaging, slightly skeptical but respectful (podcast interview style).

  2.  **Deconstruct the Guest's Argument:**
      *   *Thesis:* Aquinas is more permissive of resistance/tyrannicide than the standard "wait for public authority" reading suggests.
      *   *Evidence:* Commentary on the Sentences + Summa on sedition.
      *   *Nuance:* "Usurper" is a flexible category. "Wait for public authority" in *De Regno* might be prudential, not doctrinal.
      *   *Potential Weaknesses:* Subjectivity of "usurpation," risk of anarchy/sedition, historical condemnations (Constance), comparison to earlier thinkers (Salisbury).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: Setting the Stage (The "Cautious Aquinas" Meme).* Need to acknowledge the common view before dismantling it.
          *   *Draft:* Why do people think Aquinas is cautious?
          *   *Refinement:* Make it about the tension between *De Regno* and the *Summa*.
          *   *Follow-up:* If *De Regno* is prudential, how do we know when he's being prudential vs. doctrinal?

      *   *Q2: The Usurper Distinction (Required).* This is crucial. If "usurper" is too broad, the theory breaks.
          *   *Draft:* How do you define usurper? Isn't it subjective?
          *   *Refinement:* Focus on the "stretching" of the term. If a legitimate ruler becomes tyrannical, do they *become* a usurper retroactively?
          *   *Follow-up:* Who decides? The mob or a court?

      *   *Q3: Private vs. Public Authority (The Core Mechanism).*
          *   *Draft:* Can regular people kill tyrants?
          *   *Refinement:* Focus on the "implicit licensing." If he doesn't say it outright, how do we infer it without projecting modern ideas onto him?
          *   *Follow-up:* Does this undermine his own hierarchy of order?

      *   *Q4: Sedition and Disorder (Required).*
          *   *Draft:* Isn't killing a ruler sedition?
          *   *Refinement:* Aquinas says sedition is sinful. If tyranny is disorder, does removing it create *more* disorder?
          *   *Follow-up:* Where is the line between removing a tyrant and starting a civil war?

      *   *Q5: Jean Petit / Council of Constance (Required).*
          *   *Draft:* What about Jean Petit getting condemned?
          *   *Refinement:* Constance condemned tyrannicide doctrines. Does your reading of Aquinas survive that condemnation?
          *   *Follow-up:* Did the Church get it wrong, or is your reading risky?

      *   *Q6: John of Salisbury Comparison (Bonus).*
          *   *Draft:* How are you different from John of Salisbury?
          *   *Refinement:* Salisbury was explicit. Aquinas is subtle. Is this caution or just coding?
          *   *Follow-up:* If the outcome is the same, does the subtlety matter?

      *   *Q7: The "Worse Tyrant" Problem (Aquinas's Warning).*
          *   *Draft:* Aquinas said you might get a worse tyrant.
          *   *Refinement:* He warns against assassination because it leads to worse outcomes. Does your reading account for this consequentialist worry?
          *   *Follow-up:* Is prudence a moral constraint or just a tactical one?

      *   *Q8: The Role of the Community.*
          *   *Draft:* You say the community can act.
          *   *Refinement:* How is "the community" constituted without authority? Is it a majority? A vocal minority?
          *   *Follow-up:* Does this sound more like Calvinist resistance theory than Thomism?

      *   *Q9: Modern Implications (The "Rabbit Hole" Context).*
          *   *Draft:* What does this mean for today?
          *   *Refinement:* Keep it historical but acknowledge the user's intro. How do we apply this without fueling extremism?
          *   *Follow-up:* Is there a danger in recovering this text now?

      *   *Q10: Closing/Unfinished Business.*
          *   *Draft:* What's next?
          *   *Refinement:* What's the biggest misunderstanding of your book you want to correct?
          *   *Follow-up:* (None needed for closing).

  4.  **Review and Refine:**
      *   *Check Constraints:* 8-10 questions? Yes. Follow-ups? Yes. Usurper distinction? Yes (Q2). Sedition? Yes (Q4). Jean Petit? Yes (Q5). John of Salisbury? Yes (Q6).
      *   *Tone Check:* The prompt mentions the host went down a "two-week reading spiral." The questions should reflect that depth—not basic bio questions, but engaged textual analysis. The tone should be conversational but sharp.
      *   *Flow:* Start with the text, move to the mechanics of resistance, then historical context/condemnations, then comparisons, then implications.

  5.  **Final Polish:** Ensure the follow-ups are contingent ("If she says X, ask Y"). Make sure the distinction between *De Regno* (On Kingship) and *Summa Theologiae* is clear, as the prompt highlights this tension. (Self-Correction: Make sure to emphasize the *Sentences* commentary since the guest specifically mentioned it).

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  This is a fantastic angle for a podcast interview. It strikes the right balance between textual scholarship and the messy reality of political violence, which is clearly where your head is at after that dinner argument. Since your guest is arguing against the "consensus" reading, your job is to press on the *consequences* of her reading without accusing her of being irresponsible. You want to see if her Aquinas holds water when the pressure is applied.

  Here are 9 questions with contingent follow-ups, designed to move from the textual mechanics to the historical stress tests.

  ### 1. The "Two Aquinas" Problem
  **Question:** The standard reading relies heavily on *De Regno*, where Aquinas warns that private assassination often leads to worse tyrants. You're arguing we should weigh his *Commentary on the Sentences* and the *Summa* more heavily. But if *De Regno* isn't his doctrinal position, how do we decide when he's writing "doctrinally" versus when he's just giving prudential, political advice? Is there a risk we're cherry-picking the Aquinas that fits our modern intuitions?
  *   **Follow-up (If she says *De Regno* is purely prudential):** If prudence can override the prohibition on private violence in one context, doesn't that make the prohibition itself fragile? How do we know when *we* are being prudent versus when we're just impatient?

  ### 2. The "Usurper" Loophole (Required)
  **Question:** A huge amount of weight rests on the distinction between a legitimate ruler who becomes tyrannical and a usurper who seized power illegitimately. You've suggested the category of "usurper" is more flexible than traditional readers admit. But where is the guardrail? If a ruler is elected but then governs destructively, does he *become* a usurper retroactively? At what point does that definition stretch so far that "tyrant" just means "ruler I dislike"?
  *   **Follow-up (If she argues the community decides):** If the community decides he's a usurper, but the courts or the church say he's legitimate, whose metaphysical status counts? Are we essentially saying might makes right regarding the definition of legitimacy?

  ### 3. Sedition as Counter-Violence (Required)
  **Question:** In the *Summa*, Aquinas condemns sedition as a special sin because it disrupts the unity of the multitude. Your argument implies that removing a tyrant is a restoration of order, not sedition. But isn't that a semantic flip? If the act of removal causes civil strife or violence, doesn't Aquinas's own logic classify that as the "real" disorder, regardless of the ruler's moral status?
  *   **Follow-up (If she says tyranny is the primary disorder):** So the violence of the regime counts more than the violence of the resistance? Does that commit Aquinas to a consequentialist ethic where the outcome justifies the violent means, which seems unlike him?

  ### 4. Private Persons vs. Public Authority
  **Question:** The consensus view is that Aquinas requires "public authority" to depose a tyrant. You're suggesting he implicitly licenses ordinary people to act when that authority is dormant or complicit. But if there is no public authority to authorize the act, who exactly is the "private person" acting on behalf of? Is it themselves, or are they mystically embodying the community?
  *   **Follow-up (If she says they embody the community):** That sounds remarkably like the Calvinist resistance theorists of the 16th century. Are you arguing Aquinas is actually a proto-Reformation thinker, or that we've misread the later scholastics who came after him?

  ### 5. The Jean Petit Stress Test (Required)
  **Question:** I have to bring up the Council of Constance. In 1415, they condemned the propositions of Jean Petit, who argued tyrannicide was meritorious. They explicitly cited concerns about this kind of reasoning destabilizing Christendom. If your reading of Aquinas is correct, wouldn't the Council of Constance have effectively condemned Aquinas too?
  *   **Follow-up (If she says Constance was political/politicized):** Even if it was political, the Church's magisterial weight landed on "no private tyrannicide." If your reading requires us to sideline that condemnation, are you recovering Aquinas or rehabilitating a heresy?

  ### 6. The John of Salisbury Comparison (Bonus)
  **Question:** John of Salisbury, in the *Policraticus*, is famously explicit: the tyrant is a beast, and killing him is not just allowed but virtuous. You seem to want credit for Aquinas being more nuanced than Salisbury. But if the practical outcome of your reading is that people can kill usurpers, is the nuance just cosmetic? Is Aquinas actually safer than Salisbury, or is he just using better code words?
  *   **Follow-up (If she says Aquinas is more rigorous):** If the code is decipherable, does the rigor matter to the guy holding the dagger? Does subtlety actually prevent abuse, or does it just give cover to those looking for justification?

  ### 7. The "Worse Tyrant" Consequence
  **Question:** In *De Regno*, Aquinas argues that killing a tyrant often leads to a worse one because the conspirators become factionalized. This is a consequentialist argument. Your reading emphasizes the *right* to resist. If the likely outcome is a worse tyranny, does the right to resist evaporate? Or do we have a duty to resist even if it makes things worse?
  *   **Follow-up (If she says we must weigh the odds):** Who is qualified to weigh those odds? Because historically, almost every assassin thinks they are the exception to the rule.

  ### 8. The Role of the Church
  **Question:** In Aquinas's world, the Pope is the ultimate arbiter of spiritual and often temporal legitimacy. If a ruler is a usurper or tyrant, why isn't the default mechanism excommunication or papal deposition rather than private violence? Does your reading inadvertently secularize resistance by bypassing the ecclesiastical authority Aquinas would have trusted?
  *   **Follow-up (If she says the Church can be complicit):** If the Church is complicit, doesn't that collapse the whole Thomistic framework of ordered authority? How do you resist without falling into anarchism?

  ### 9. The "Rabbit Hole" Question (Closing)
  **Question:** We started this conversation because people online are currently using "Aquinas said tyrannicide is okay" as a meme to justify modern political violence. As a scholar who has spent years in the texts, what is the one thing you wish people would stop saying about Aquinas and resistance immediately?
  *   **Follow-up (If she critiques the meme):** So if someone listens to this and walks away thinking, "Great, the Professor said Aquinas allows it," what have they missed that keeps them from acting recklessly?

  ***

  **Producer's Note:** Given the sensitivity of the topic, keep an eye on Q5 (Constance) and Q2 (Usurper). Those are the points where her argument is most vulnerable to the charge of being "dangerous." If she gets defensive there, pivot to Q9 to let her clarify her ethical boundaries before you wrap. Good luck with the recording!
