  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Procedures for Contested Allegations

  ### 1. Purpose and Context

  At our last case deliberation, the Committee encountered a structural difficulty that threatens the logical consistency of our findings. As you recall, we defined a finding of "responsible" conjunctively: we must agree both that (a) the conduct was a significant departure from accepted practice, and (b) it was committed knowingly, intentionally, or recklessly.

  In the recent vote, two members voted "responsible" (affirming both a and b). Three members voted "not responsible." However, among those three, the reasoning was split: one affirmed (a) but denied (b); one affirmed (b) but denied (a); and one denied both. Consequently, a majority of the Committee (3 out of 5) affirmed (a), and a different majority (3 out of 5) affirmed (b). Under our current practice of voting only on the final verdict, we returned a finding of "not responsible." Had we voted on the premises individually, the logical outcome under our own rules would have been "responsible."

  This is an instance of the *discursive dilemma* (or doctrinal paradox). It reveals that our current voting procedure can produce collective outcomes that contradict the logical aggregation of our individual judgments. As we move to adopt a standing voting procedure, we must choose between a **Conclusion-Based Procedure (CBP)** (voting on the verdict directly) and a **Premise-Based Procedure (PBP)** (voting on the conditions, then deriving the verdict).

  ### 2. Recommendation

  I recommend that the Committee adopt a **Premise-Based Procedure (PBP)** for all future contested cases.

  Under this procedure, the Committee will cast secret ballots on each necessary condition of the misconduct definition separately. A finding of "responsible" is returned if and only if a majority votes in the affirmative on *every* necessary condition. If a majority fails to affirm any single condition, the verdict is "not responsible."

  ### 3. Justification for Premise-Based Voting

  While the Conclusion-Based Procedure (our current practice) feels more intuitive, the Premise-Based Procedure is superior for a body charged with defining and upholding research integrity for three key reasons:

  **A. Collective Rationality**
  The Committee speaks with one voice. When we issue a finding, we assert that *the Committee* has determined that misconduct occurred. For this assertion to be true, the Committee's collective position must satisfy the definition of misconduct. If a majority of the Committee does not support condition (a), or does not support condition (b), then it is logically false to claim the Committee has found misconduct. PBP ensures that our collective output is logically consistent with our governing rules, preserving the integrity of the Committee as a rational agent.

  **B. Fidelity to Policy**
  Our authority is derived from the University's policy, which defines misconduct conjunctively. CBP allows for a scenario where a respondent is found "not responsible" even though a majority of the Committee believes they violated every element of the policy (as seen in the recent case). This undermines the regulatory standard. Conversely, CBP could theoretically allow a "responsible" finding where no majority agrees on the specific grounds (though this is less likely with rational voters). PBP ensures that the policy definition is applied rigorously at the collective level, not just the individual level.

  **C. Transparency and Precedent**
  Research integrity cases set norms for the graduate community. A PBP vote forces the Committee to be transparent about which elements of the definition were met and which were not. This provides clearer guidance to the student body regarding acceptable conduct. A CBP vote obscures this; a "not responsible" verdict could mean the act wasn't a departure, or that it wasn't intentional, leaving the community unsure of the standard.

  ### 4. The Strong Objection: Individual Judgment and "Mootness"

  I anticipate a significant objection to this recommendation, one that deserves honest engagement.

  **The Objection:**
  Adopting PBP forces individual members to vote on, and be bound by, sub-questions they may regard as moot. For example, if a member is convinced that condition (b) (intent) was *not* met, they logically believe the verdict must be "not responsible" regardless of condition (a). Under PBP, that member must still vote on condition (a). If the majority affirms (a), that member is effectively bound by a collective finding they deemed irrelevant to the case. This constrains the independence of Committee members and treats them as logic gates rather than judges exercising holistic discretion.

  **The Response:**
  This objection rests on a conception of the Committee as a collection of independent jurors, rather than a single fact-finding body. In a criminal jury, we prioritize the individual juror's conscience (CBP). However, the Research Integrity Committee is an administrative and epistemic body. Our primary duty is not to exercise personal discretion, but to accurately apply the University's definitions to the facts.

  When a member votes on premise (a), they are not voting on whether (a) *alone* determines the outcome; they are voting on whether (a) is *true*. The truth of (a) is a matter of fact and disciplinary standard, independent of (b). If a majority of experts agrees that a departure occurred, it is a collective fact that a departure occurred. To allow individual members to withhold judgment on (a) because they dislike (b) is to privilege individual logical shortcuts over the collective establishment of fact.

  Furthermore, this constraint protects the accused. It prevents a scenario where a respondent is sanctioned based on a coalition of minorities (e.g., some vote responsible because of A, others because of B, but no majority agrees on both). By requiring a majority on *each* premise, PBP ensures that no sanction is imposed without broad consensus on every necessary element of the charge.

  ### 5. Implementation and Mitigation

  To mitigate the concern regarding "moot" voting, I recommend the following procedural safeguards:

  1.  **Sequential Deliberation:** We should deliberate on the premises in order. If it becomes clear during discussion that a majority will not support condition (a), we may dispense with a formal vote on (b), as the verdict is already determined. This respects members' time and avoids unnecessary binding votes on moot points.
  2.  **Separate Ballots:** Votes on (a) and (b) must be cast on separate ballots to prevent logrolling (e.g., "I'll vote for (a) if you vote for (b)").
  3.  **Written Findings:** The Committee's written report should explicitly state which premises were affirmed by majority vote. This ensures the record reflects the logical basis of the decision, even if individual members dissented on specific premises.

  ### 6. Conclusion

  The discursive dilemma is not merely a theoretical curiosity; it is a threat to the legitimacy of our findings. By adopting a Premise-Based Procedure, we prioritize the logical consistency of the Committee's voice and the rigorous application of University policy. While this places constraints on individual voting discretion, those constraints are necessary to ensure that our verdicts are defensible as collective judgments of fact, not just aggregations of individual dispositions.

  I look forward to discussing this recommendation at the retreat.
