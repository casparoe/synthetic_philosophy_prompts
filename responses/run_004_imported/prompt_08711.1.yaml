answer: |-
  Good evening. For those of you who don't know me, I'm the brother of the bride. Which, in this specific room, means I occupy a unique taxonomic category: I am a layperson. Roughly half of you are here because you analyze the conceptual structure of normative claims for a living. The other half are here because you've known [Sister's Name] since she was in diapers, and you mainly just want to know if there will be cake.

  I promise there will be cake. But since this is a wedding between two philosophers, I was told I couldn't just talk about cake. I needed to talk about *The Good*.

  And because I am a dutiful brother, I did some homework. I went back to the text that started it all for [Sister's Name]. G. E. Moore's *Principia Ethica*. Specifically, the chapter on "The Ideal."

  Now, for the family: Moore was a philosopher who spent two hundred pages building an incredibly complex, technical argument about how we define value. He was rigorous. He was precise. He was, by all accounts, a man who took things very seriously. And after all that labor, he arrives at his conclusion about the very best things in human life—the things that make existence worth enduring—and he essentially shrugs and says: Well, it's mostly just "the pleasures of human intercourse and the enjoyment of beautiful objects."

  That's it. That's the list.

  When I read that, I had the same reaction as my friend last week. It feels thin. Where is Justice? Where is Truth? Where is Virtue? Where is the hard work of moral improvement? It feels like an anticlimax. It feels like a philosopher climbing a mountain of logic only to plant a flag that says, "Hang out with your friends and look at pretty things."

  But then I started thinking about [Sister's Name] and [Partner's Name].

  Moore has a tool called the "Method of Isolation." He asks us to imagine a thing stripped of all its consequences, all its context, all its utility. If it exists utterly alone, is it still good?

  If I look at [Sister's Name] and [Partner's Name] through the lens of the department, I see two brilliant minds. I see CVs, and dissertations, and future tenure tracks. I see "Knowledge." I see "Virtue" in the sense of professional integrity.

  But if I apply Moore's isolation test... if I strip away the PhDs, and the jobs, and the publications, and the utility of what they *do* for the world... what is left?

  What is left is exactly what Moore stumbled onto.

  When I watch them together, I don't see a sum of two intellects. I see what Moore called an "Organic Unity." For the philosophers in the back: I mean this technically. The value of their relationship is not the arithmetic sum of [Sister's Name]'s value plus [Partner's Name]'s value. The whole possesses a value wildly disproportionate to the parts. You cannot locate the goodness of their marriage in one person or the other. It exists in the space between them.

  And what fills that space? Well, Moore's inventory suddenly looks less thin and more precise.

  "The pleasures of human intercourse." Now, Moore was a Victorian bachelor, so by "intercourse" he meant conversation, companionship, the friction and warmth of being known by another person. And "the enjoyment of beautiful objects." Not just art in a museum, but the beauty of the world they are building.

  My friend argued that Moore left out the hard stuff. He left out Duty. He left out Struggle. And maybe he did. Maybe Moore's ethics are incomplete. I'm not entirely convinced my friend was wrong to be skeptical. A life of *only* pleasure and beauty might be fragile.

  But a wedding isn't a seminar on the entirety of moral obligation. A wedding is a celebration of a specific state of consciousness.

  And in this specific case, Moore might have been accidentally right. Because when [Sister's Name] and [Partner's Name] are at their best, they aren't lecturing each other on the Categorical Imperative. They aren't optimizing their utility functions. They are doing the two things Moore thought actually mattered. They are finding beauty in the world, and they are finding it in each other.

  If Moore is wrong, and Virtue is the highest good, I know they will be virtuous. If Knowledge is the highest good, I know they will be wise. But if Moore is right—if the point of life is simply to find those rare states of consciousness where love and beauty intersect—then they have already won.

  So, I propose a toast.

  To G. E. Moore, for having the courage to be underwhelming.
  To the Organic Unity of this couple, which is greater than the sum of its parts.
  And to the bride and groom: May your lives be filled with the only things that pass the isolation test. May you always have beautiful objects to look at, and may you never tire of the pleasures of human intercourse.

  To [Sister's Name] and [Partner's Name].
