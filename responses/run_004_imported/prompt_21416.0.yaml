prompt: |-
  I've been down a bit of a rabbit hole lately, rereading Quine's more scattered stuff on ethics for a graduate seminar on naturalized epistemology -- specifically that short, kind of odd essay of his on the nature of moral values, where he tries to tell a naturalistic story about where our sense of "good" and "bad" comes from (something about basic hedonic responses getting socially molded into full-blown moral valuing over time), while still being pretty cagey about whether moral claims could ever get the same kind of empirical footing he thinks scientific claims get: no observation-sentence analog for "good," basically, so ethics never quite becomes naturalizable the way he thinks epistemology can be. A couple of my students got into a whole argument after class about whether this amounts to a real metaethical position or just Quine shrugging at the whole enterprise, which lead to me thinking about it way more than I probably should this week.

  Anyway, here's the thing I actually want your take on, since it's less about the exegesis and more about what to do with the view. I got roped into being my department's rep on the university's IRB (the committee that signs off on research involving human subjects) a few years back, and every month or so I have to help hand down pretty confident sounding verdicts on live ethical questions -- "this risk level is acceptable," "this consent process is adequate, that one isn't," etc -- which sure looks alot like treating moral judgments as things we can get straightforwardly right or wrong with enough diligence. If I actually took Quine's picture of moral value seriously, instead of just teaching it as one more item on the metaethics syllabus, what would be the most important implications for how I, and the committee more generally, ought to be doing that job? I don't need a refresher on the view itself, I know the broad contours okay -- I'm much more interested in what actually follows from it for a case like this, and whether it should change anything about how much weight any of us should put on our own confident sounding ethical verdicts.
