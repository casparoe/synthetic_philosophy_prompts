answer: |-
  This is a fantastic practical puzzle. You've identified the exact friction point where Quine's metaethical deflationism collides with the institutional realism required of an IRB. If you take Quine's "On the Nature of Moral Values" (and related passages in *Pursuit of Truth*) seriously, you aren't just dealing with a theoretical curiosity; you're dealing with a mandate to recalibrate the *kind* of authority the IRB claims to have.

  Quine's position, roughly, is that while moral sentiments have a natural history (rooted in hedonic responses and socially molded), moral statements lack the empirical content to be confirmed or disconfirmed by observation sentences in the way scientific statements are. They sit further from the "sensory periphery" of our web of belief.

  If you import that distinction into the IRB context, it suggests a division of labor in your deliberations that is sharper than what usually occurs. Here are four specific implications for how you and the committee ought to operate if you take that view seriously.

  ### 1. Distinguish Risk *Assessment* from Risk *Acceptability*
  Quine allows for a robust naturalism regarding the *causal* facts of the world. He would grant that we can have empirical knowledge about pain, psychological distress, and probability. Therefore, the IRB can be genuinely realist and confident about the **empirical premises** of a protocol.
  *   **The Implication:** The committee should be hyper-rigorous about the science of *harm*. "Will this procedure cause distress?" "What is the probability of a data breach?" These are empirical questions with observation-sentence analogs. You can be confident here.
  *   **The Shift:** However, the jump from "This involves risk" to "This risk is acceptable" is where Quine's naturalism hits a wall. There is no empirical fact of the matter about *acceptability*. If you take Quine seriously, the verdict "This risk is acceptable" is not a discovery of moral truth; it is a **policy decision** rooted in current social molding.
  *   **In Practice:** This should change the language of your determinations. Instead of writing, "The risks are minimized and reasonable" (which sounds like a fact), the language should reflect a normative trade-off: "Given current community standards and the potential social value of the knowledge, the committee *authorizes* these risks." It moves the verdict from the realm of *finding* to the realm of *legislating*.

  ### 2. The IRB as a Mechanism of Social Molding, Not Moral Oracle
  Quine describes moral development as the channeling of basic hedonic responses into social norms. On a Quinean view, the IRB isn't a body of experts discerning antecedent moral truths; it is a microcosm of the social mechanism that *creates* those truths.
  *   **The Implication:** The composition of the committee matters more than the "expertise" of its members. If moral value is socially molded, then a committee of only scientists or only ethicists is epistemically impoverished regarding the "acceptability" question. You need the "community" present to do the molding.
  *   **In Practice:** This gives you a philosophical warrant to fight for the power of the non-scientist, community members on the board. In many IRBs, these members are treated as rubber stamps for the scientists' risk assessments. On a Quinean view, they are the crucial link to the "social molding" that gives the moral verdict its legitimacy. Their hesitation *is* the data point that indicates a friction between the proposed research and current social values.

  ### 3. Epistemic Humility in "Confident Sounding Verdicts"
  You mentioned the "confident sounding verdicts." Quine's view suggests this confidence is often misplaced, or at least, misplaced in *kind*. It is the confidence of a judge issuing a ruling, not a scientist reporting a finding.
  *   **The Implication:** You should worry less about whether the committee is "right" in a metaphysical sense and more about whether the decision is **stable** and **consistent** within the web of institutional beliefs. Quinean naturalism is pragmatic. Ethics works insofar as it facilitates social functioning.
  *   **In Practice:** This argues for a stronger emphasis on precedent and consistency than on deep moral theorizing for every protocol. If the IRB approves Protocol A on Tuesday and rejects identical Protocol B on Thursday, it's not just "unfair"; it's a failure of the social molding mechanism. The "truth" of the verdict lies in its coherence with the institution's other normative commitments. It also suggests that when the committee is deadlocked, you shouldn't look for a better moral argument to break the tie (since there's no moral fact to find); you should look for a compromise that allows social functioning to continue (e.g., modifying the protocol to reduce the hedonic cost).

  ### 4. The "Ought" is a Tool, Not a Mirror
  Finally, Quine's naturalism implies that ethical language is instrumental. We use it to coordinate behavior.
  *   **The Implication:** When you tell a researcher, "You must change this consent form," you are not revealing that their original form was "immoral." You are indicating that it fails to meet the coordination standards required for the institution to function without causing undue social friction (or legal liability).
  *   **In Practice:** This can actually make your job easier emotionally. It reduces the moral residue. If a researcher pushes back, you aren't having a clash of moral truths; you are negotiating the terms of social cooperation. It allows you to be firm without being self-righteous. You can say, "I understand your view, but within the framework of norms we are tasked with upholding, this doesn't pass." It acknowledges the normativity without reifying it.

  ### Summary: The "Quinean IRB"
  If you take Quine seriously, you don't stop making verdicts. Quine himself didn't stop living or acting. But you stop pretending the verdicts are **scientific**.

  1.  **Be Realist about Harm:** Treat predictions of pain/distress as empirical claims subject to evidence.
  2.  **Be Pragmatist about Value:** Treat judgments of "acceptability" as policy decisions based on current social norms.
  3.  **Be Democratic about Process:** Value the community members as the representatives of the "social molding" process.
  4.  **Be Humble about Language:** Frame verdicts as authorizations based on institutional norms, not discoveries of moral fact.

  The weight you put on your verdicts shouldn't decrease, but the *nature* of that weight changes. You are not holding the scales of justice; you are steering the ship. The confidence comes from the necessity of the decision for the continuation of research, not from its correspondence to a moral reality.
