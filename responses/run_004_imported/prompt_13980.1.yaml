answer: |-
  It is a pleasure to speak with someone who has spent a lifetime at the bench. You know better than most that the universe does not care about our narratives; it cares about conservation laws, reaction pathways, and energy transfer. Your intuition that the Conserved Quantity (CQ) theory aligns with the "view from the lab" is exactly why it remains one of the most robust physicalist accounts of causation.

  You want the strongest case for the hardline view: that omissions are **never** genuine, literal causes, and that including them corrupts the metaphysical integrity of causation. You want me to tackle the "Many Omissions" problem and address Dowe's "quasi-causation" patch without dodging.

  Here is the case for why you must bite the bullet: Omissions are not causes. They are counterfactual dependencies wrapped in normative expectations. Treating them as causes destroys the objectivity of the causal relation.

  ### 1. The Ontological Argument: You Cannot Transmit Nothing
  Let's start with the metaphysics, grounded in your experience. In your lab, if you want to prove $A$ caused $B$, you look for the mechanism. You look for the electron transfer, the bond breaking, the momentum exchange. You are looking for a *connection*.

  An omission is not a connection; it is the absence of a connection. Ontologically, an omission is a **nothing**.
  *   **The Claim:** Causation is a relation between existents (events, processes, objects).
  *   **The Problem:** An omission is not an existent. The lifeguard's "not-swimming" is not an event in the world. It is a description of the world failing to match a specific expectation.

  If you claim an omission is a cause, you are claiming that *nothing* can push *something*. In physics, this is nonsense. A force requires a vector. A signal requires energy. If the lifeguard sits still, no energy flows from the lifeguard to the swimmer. The swimmer dies due to the positive physical processes of water filling lungs and oxygen deprivation. The lifeguard's inaction is simply the *background condition* under which those positive processes ran to completion.

  To call the omission a cause is to confuse the **stage** with the **actors**. The absence of water killed the fern, not the absence of your hand. But the absence of water is just the state of the system, not a causal agent.

  ### 2. The "Many Omissions" Problem: The Reductio Ad Absurdum
  You raised the King of England objection. This is the strongest argument *against* treating omissions as causes, and CQ theory uses it as a shield, not a vulnerability.

  If we accept omissions as genuine causes (ontologically equal to physical pushes and pulls), we face **Causal Proliferation**.
  *   **Scenario:** The fern dies.
  *   **Cause 1:** You didn't water it.
  *   **Cause 2:** I didn't water it.
  *   **Cause 3:** The King of England didn't water it.
  *   **Cause 4:** The irrigation system in the Amazon didn't divert water to your living room.
  *   **Cause 5:** The sky didn't rain fern-food.

  If omissions are real causes, all five of these are ontologically identical. They are all "absences of water-delivery processes." There is no physical difference between your absence and the King's absence. Both involve zero energy transfer.

  **The CQ Solution:**
  The CQ theorist says: **None of them are causes.**
  The only genuine causes are the positive processes that *did* occur: evaporation, cellular desiccation, metabolic shutdown.

  **Why this is a victory, not a loss:**
  The reason you sue the mechanic and not the King of England is not because the mechanic's omission was more "causal" in a physical sense. It is because the mechanic had a **contractual duty**. The King did not.
  *   **Physics:** Determines what happened (desiccation).
  *   **Norms:** Determine who is responsible for preventing it.

  If you treat omissions as genuine causes, you conflate **physics** with **ethics**. You force the physical structure of the universe to bear the weight of human social contracts. The "Many Omissions" problem proves that omission-causation is not a feature of the world, but a feature of our *interests*. We single out the mechanic because we care about mechanics, not because his "not-checking" emitted a special causal ray that the King's "not-checking" did not.

  By excluding omissions from genuine causation, CQ theory preserves the objectivity of the physical world. It says: "The universe doesn't know about duties. It only knows about processes."

  ### 3. Dowe's "Quasi-Causation": Patch or Principle?
  Now, the tricky part. Wesley Dowe realized people wouldn't accept that the lifeguard didn't "cause" the death. So he introduced "quasi-causation" for omissions. You smell a rat. You think it's an ad hoc patch to save common language.

  I am going to argue something stronger: **Dowe was too generous.** He should have bitten the bullet completely. However, to answer your constraint, I will argue that his distinction is principled *only if* you interpret "quasi-causation" as a polite euphemism for "not causation."

  **The Case Against the Patch:**
  If "quasi-causation" is a type of causal relation, we are back to square one. We have two types of causation: physical (process) and non-physical (omission). This dualism is messy. It invites the question: "How do these two interact?"

  **The Principled Defense (The Bifurcation Strategy):**
  The only way to save Dowe's move is to argue he isn't adding a category to *causation*, but rather identifying a category of **explanation** that mimics causation pragmatically.
  *   **Genuine Causation:** Ontological. Mind-independent. (The water entered the lungs).
  *   **Quasi-Causation:** Pragmatic. Mind-dependent. (The lifeguard failed to act).

  Is this ad hoc? No, provided we admit that "Quasi-Causation" is actually **Counterfactual Dependence + Normative Expectation.**
  *   *Counterfactual:* If the lifeguard had acted, the swimmer lives.
  *   *Normative:* The lifeguard was supposed to act.

  Dowe's "patch" is principled only if we understand it as a concession to **language**, not **metaphysics**. He is saying: "In the strict ontological sense, the lifeguard caused nothing. But in the sense that humans assign responsibility, we treat this counterfactual dependence *as if* it were causation."

  **My recommendation to you:** Do not accept "quasi-causation" as a type of causation. Accept it as a distinct logical relation that we *label* causation for legal convenience. The patch is valid only as a linguistic bridge, not a metaphysical one. If you treat it as a metaphysical category, you are right: it is a spare tire taped to the side of a Ferrari.

  ### 4. Why the Law Lies to You
  You mentioned that people go to prison for omissions. This is the hardest pill to swallow for a scientist. How can someone be punished for a "nothing"?

  The law is not in the business of metaphysics; it is in the business of **behavioral modification**.
  *   **Science asks:** "What mechanism produced this state?"
  *   **Law asks:** "Which agent had the power and duty to prevent this state?"

  When a court rules that a mechanic's failure caused a crash, they are not making a claim about the transmission of momentum. They are making a claim about **agency**. They are saying, "We will treat this agent *as if* they pushed the car off the cliff, because they had the power to stop it and didn't."

  This is a **fiction**, albeit a necessary social one. If we told juries, "Technically the brake fluid boiled due to thermodynamics, and the mechanic's inaction is a null set, so he's not causally responsible," the legal system would collapse.

  But as a retired chemist, you know the difference between a **calibration standard** and a **sample**.
  *   **Physical Causation** is the sample. It's the real stuff.
  *   **Omission "Causation"** is the calibration standard. It's a reference point we use to measure responsibility, but it isn't the substance itself.

  ### The Verdict
  You asked for the strongest case that omissions are never genuine causes. Here it is, distilled:

  1.  **Ontological Parsimony:** The universe is made of stuff and events. "Not-stuff" and "non-events" do not exist. You cannot have a relation (causation) between an existent and a non-existent.
  2.  **The Proliferation Proof:** If omissions are causes, causation becomes infinite and indiscriminate (The King of England). Since causation is clearly discriminative (we pick specific causes), omission-causation must be a selection bias, not a physical fact.
  3.  **The Category Error:** Treating omissions as causes conflates *physics* (what happened) with *norms* (what should have happened). CQ theory protects science from this contamination.
  4.  **Dowe's Patch:** It is only defensible if viewed as a linguistic concession. Metaphysically, "quasi-causation" should be renamed "Responsibility-Relevant Counterfactual Dependence." It is not causation.

  **Conclusion:**
  Your wife might think the philosophy rabbit hole is worse than the birdwatching, but on this, your lab instincts are sharper than the philosophers'. The world runs on conserved quantities. It does not run on expectations. When the lifeguard sits still, the physics of the drowning proceeds exactly as it would have if the lifeguard didn't exist. The lifeguard's "cause" exists only in the courtroom, not in the water.

  Bite the bullet. Omissions are not causes. They are the shadows cast by our duties, not the objects casting them.
