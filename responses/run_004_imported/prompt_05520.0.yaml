answer: |-
  The space between the worlds wasn't dark; it was grey, like static on an old television screen. Elin stood on one side of the fissure, and the other Elin stood on the other.

  They looked identical, down to the scar on the left chin from a bicycle accident at age nine. But the Oslo-Elin wore it with a hardness Elin-Home didn't recognize. Oslo-Elin wore a coat Elin-Home had returned to the store three years ago.

  "You're hesitating," Oslo-Elin said. Her voice was the same, but the accent was sharper, clipped by Nordic consonants.

  "I'm trying to understand why it hurts," Elin-Home said. She clutched her chest. "When you left him, when you walked away from the marriage… I felt it. Like a rib breaking."

  Oslo-Elin stepped closer to the grey static separating them. "That's empathy. Or resonance. Don't confuse it with identity."

  "It felt like memory," Elin-Home insisted. "I want to keep it. If I stay here, in your track, I don't have to go back to the regret. I can just… be the version who left."

  "You can't." Oslo-Elin's voice was flat. "You're looking at me like I'm a door you can walk through. I'm not a door. I'm a person."

  "We are the same person."

  "No," Oslo-Elin said. "We are made of the same stuff. We share a origin point. But look at us." She gestured to the grey void. "If you step across, you don't become me. You displace me. Or you die. Because there isn't enough room for one soul to occupy two histories simultaneously."

  "But the mechanism works," Elin-Home said, desperation creeping in. "I swapped places with the version in Tokyo. I swapped with the version who never went to university. I took their lives."

  "And how did that feel? Really?" Oslo-Elin leaned forward. The static crackled between them. "When you came back from Tokyo, did you remember the taste of the sushi? Or did you just know *about* it?"

  Elin-Home faltered. "I knew about it."

  "Exactly. You're a tourist in our lives. You collect experiences like souvenirs, but they don't stick to the bone. That pain you felt when I left my husband? That was mine. You were just watching a movie of it."

  "That's the Humphrey thing, isn't it?" Elin-Home muttered, half-remembering a conversation with her partner. "You're saying I shouldn't care because it wasn't *me*."

  "I'm saying you *can't* care," Oslo-Elin corrected. "Not really. Not in the way that changes you. If I burn my hand, you don't get a blister. You just see the skin bubble. If we are truly the same, then my pain is your pain. But it's not. It's mine."

  Elin-Home reached out. Her fingers brushed the static. It hummed, warm and vibrating. "I can fix it, though. If I merge with you. If I force the identity claim. If I say 'I am you,' then the universe has to agree."

  "The universe doesn't care what you say." Oslo-Elin didn't pull away. "David Lewis was right. We are counterparts. We are similar enough to compare, distinct enough to suffer alone. You want to steal my courage because you lack your own. But courage isn't transferable. It's contextual."

  "I don't believe you." Elin-Home lunged.

  She grabbed Oslo-Elin's wrist. The contact was electric. Elin-Home expected the rush of integration, the sudden flood of Oslo's memories overwriting her own, the way a file saves over a previous draft. She expected to feel the cold Oslo air in her lungs and the weight of the resignation letter in her hand.

  Instead, she felt nothing.

  No memory. No pain. No cold. Just the warmth of another human hand gripping hers.

  Oslo-Elin looked at her, pity in eyes that were exactly Elin's own. "See? You're holding a stranger's hand."

  "We touched," Elin-Home whispered. "The bridge is open."

  "The bridge is open," Oslo-Elin agreed. "But you're not crossing it. You're just shaking hands across the border."

  "I can force it." Elin-Home tightened her grip. She pushed her will against the static, trying to demand ownership of the other woman's history. *I am you. I am you.*

  Oslo-Elin's expression hardened. She twisted her wrist, breaking the grip. "Stop. You're treating me like a resource. Like a backup file."

  "I'm trying to survive!"

  "Then survive your own life," Oslo-Elin said. She stepped back into the grey. "Don't come here looking for absolution. I didn't make the choices you didn't make. I made the choices I made. You're not me. You're just the woman who wonders what would have happened."

  The static began to widen. The gap was opening again, pushing them apart.

  "If you're right," Elin-Home shouted over the hum, "then nothing I do here matters! If I'm just a counterpart, then my success here is meaningless to the me back home!"

  "It matters to *you*," Oslo-Elin called back, her voice fading as the grey swallowed her. "That's the only metric that exists. Stop looking for metaphysical loopholes to avoid consequence. There are no loopholes. There's just you, and the choices you actually make."

  The fissure snapped shut.

  Elin-Home stood alone in the grey void. She looked down at her hand. The skin where she had grabbed Oslo-Elin was unblemished. No burn. No transfer. She searched her mind for the taste of Oslo's coffee, the sound of her husband's voice saying goodbye, the specific weight of the freedom she had coveted.

  There was nothing. Only the memory of meeting a woman who looked exactly like her, who had refused to let her steal her life.

  The mechanism hadn't failed. The metaphysics had held. She was alone.

  Elin turned back toward the door to her own world. She opened it, and stepped through, carrying nothing but her own regrets.
