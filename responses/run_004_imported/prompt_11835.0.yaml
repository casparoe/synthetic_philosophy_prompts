answer: |-
  This is a classic instance of the **Boundary Problem** in political theory (often attributed to Frederick Whelan and Robert Dahl): *There is no democratic procedure for deciding who constitutes the demos without already assuming a demos.* You are correct that every rule for deciding "who votes" implicitly answers the question it is supposed to resolve.

  However, you are mistaken to conclude that this makes the problem unfixable or that all solutions are equally arbitrary. While there is no *perfectly neutral* algorithm, there are **principled heuristics** for minimizing agency costs and preventing predation. An HOA is not a nation-state; it is a contractual association designed for two specific purposes: **asset preservation** and **livability**.

  A rigorous analysis suggests that the "one deed, one vote" status quo is not merely "administratively simple"; in your specific context, it is **structurally dangerous**. Conversely, granting full voting rights to tenants introduces **moral hazard**.

  The principled solution lies in **unbundling the vote** based on the type of risk involved. However, there is a tragic catch: the legal mechanism to implement this solution may be held hostage by the very incentive structure you are trying to fix.

  Here is the breakdown.

  ### 1. The Core Conflict: It Is Not Democracy, It Is Fiduciary Governance

  The first error both factions make is treating this as a question of democratic representation ("who lives here" vs. "who owns here"). An HOA is closer to a corporation than a municipality.
  *   **Owners** are shareholders (bearing capital risk).
  *   **Tenants** are customers/employees (bearing livability risk).
  *   **The Board** is management (bearing fiduciary duty).
  *   **The Developer** is a founding shareholder with a conflict of interest (exit strategy vs. long-term health).

  In corporate governance, voting rights attach to equity because equity holders bear the residual risk. If the building crumbles, the tenant moves out; the owner loses the asset. Therefore, on **capital decisions** (reserves, renovations, special assessments), the principle of *skin in the game* dictates that only owners should vote.

  However, the Status Quo faction ignores a critical nuance: **Not all equity holders have the same time horizon.**

  ### 2. The Three Misaligned Incentives

  To find a principled path, we must map where the incentives diverge from the HOA's long-term viability.

  **A. The Developer (The 12 Unsold Units)**
  *   **Incentive:** Maximize sale price and minimize carrying costs *now*.
  *   **Risk:** A 15-year reserve plan that increases HOA fees makes units harder to sell. A plan that underfunds reserves makes units easier to sell now but dumps a "special assessment bomb" on future buyers later.
  *   **Verdict:** The Developer is a **temporary fiduciary** for the future owners. Allowing them to vote on long-term capital plans without constraint is an agency failure. They are voting with other people's future money.

  **B. The Investors (The 10 Rented Units)**
  *   **Incentive:** Cash flow positivity.
  *   **Risk:** They care about property value, but often less than owner-occupants. They may prefer lower fees (to attract tenants) over robust reserves, planning to sell before major repairs hit.
  *   **Verdict:** Aligned enough on capital, but misaligned on livability rules.

  **C. The Tenants (The Disenfranchised)**
  *   **Incentive:** Livability, quiet, maintenance responsiveness.
  *   **Risk:** Zero capital risk. If the roof leaks, they move. If the HOA votes for a marble lobby funded by a massive assessment, the tenant doesn't pay the assessment (unless pass-through), but they suffer the construction noise.
  *   **Verdict:** Giving tenants full voting rights on *capital* creates moral hazard (voting for spending they don't fund). But excluding them from *livability* rules creates a tyranny where those subject to the rules have no voice.

  ### 3. Evaluating the Proposals

  **The Status Quo ("One Deed, One Vote")**
  *   **Philosophy:** Property rights are absolute.
  *   **Failure Mode:** It allows the Developer to vote against adequate reserves to facilitate sales. This is **predation**. It allows Investors to outvote Occupants on rules that affect daily life but not property value.
  *   **Stability:** High. It is easy to litigate because it matches the deed.
  *   **Viability:** Low. It risks the long-term solvency of the HOA.

  **The Reform ("Tenants Vote + Trust for Unsold")**
  *   **Philosophy:** Impact determines voice.
  *   **Failure Mode:** It separates spending authority from payment liability. Tenants might vote for amenities they don't pay for. A "Trustee" for unsold units is a legal minefield—who appoints them, and what is their fiduciary standard?
  *   **Stability:** Low. High litigation risk.
  *   **Viability:** Mixed. Protects future owners, but risks fiscal discipline.

  ### 4. The Principled Solution: Unbundling the Vote

  You asked if there is a principled way to settle this. There is, but it requires abandoning the idea of a single "vote." You must bifurcate governance based on the **nature of the decision**.

  **Category A: Capital & Asset Decisions (Reserves, Renovations, Insurance)**
  *   **Principle:** Risk-bearing determines voice.
  *   **Who Votes:** Only legal title holders.
  *   **Constraint:** The Developer's 12 votes must be **restricted** or **supermajority-buffered**.
      *   *Mechanism:* The bylaws should require a supermajority (e.g., 66% or 75%) for any reserve plan that deviates from a professional reserve study. Since the Developer holds ~29% (12/42), they cannot unilaterally block a prudent plan, nor can they pass an imprudent one without owner buy-in.
      *   *Better Mechanism:* The 12 unsold units are placed in a **blind trust** for capital votes, managed by an independent third party (e.g., the HOA attorney or a reserve specialist) whose fiduciary duty is explicitly to the *future owner*, not the Developer.

  **Category B: Operational & Livability Decisions (Noise, Pets, Rentals, Common Area Use)**
  *   **Principle:** Impact determines voice.
  *   **Who Votes:** Owners, *plus* a Tenant Advisory Council.
      *   *Mechanism:* Tenants do not get a ballot vote (to preserve the link between liability and control), but the bylaws should require Board representation or a veto-power advisory role for tenants on rules affecting occupancy.
      *   *Why:* This solves the "taxation without representation" grievance without introducing moral hazard on spending.

  ### 5. The Hard Truth: The Lock-In Problem

  Here is where I must be honest about the "unfixable" aspect of your query.

  You suspect that every proposal smuggles in an answer to the question it's supposed to decide. In practice, the deeper problem is that **the rules for changing the rules are likely controlled by the faction most incentivized to keep them broken.**

  To implement the "Unbundled Vote" or the "Developer Trust," you almost certainly need to amend the bylaws or the Declaration.
  *   If amendments require a simple majority of *current* voters: The Developer (12 votes) + Investors (10 votes) = 22 votes. That is 52% of the development. They can block any change that reduces their power.
  *   If amendments require a supermajority (e.g., 67%): The Developer alone can block it.

  This is the **Gödelian Loophole** of HOAs. The Status Quo faction is right that "one deed, one vote" is hard to litigate. But they are wrong that it is neutral. It is a **power moat** built by the Developer to protect their exit strategy.

  If the Developer knows that giving up their 12 votes will cost them sales (because prudent reserves raise fees), they will rationally vote against any reform. They are playing a one-shot game (sell and leave); you are playing an infinite game (live and maintain).

  ### 6. Recommendation

  Is the problem unfixable in principle? **No.** The principle is *fiduciary alignment*.
  Is the problem unfixable in practice? **Possibly,** depending on your amendment thresholds.

  **Do not fight for "Tenant Voting."** It is legally vulnerable and philosophically weak on capital issues. It gives the Status Quo faction an easy target to paint you as radicals trying to devalue property rights.

  **Fight for "Future Owner Protection."** This is your wedge.
  1.  **Focus exclusively on the 12 unsold units.** Frame this not as "taking away votes" but as "preventing fraud on future buyers." Argue that the Developer voting on a 15-year plan they won't be around for is a liability risk for the *new* buyers they are trying to sell to.
  2.  **Propose a "Reserve Study Safe Harbor."** Instead of changing *who* votes, change *what* they vote on. Amend the bylaws to state that any reserve plan certified by an independent, third-party reserve specialist is automatically approved unless rejected by a 75% supermajority.
      *   This neutralizes the Developer's 29% block. They can't pass a bad plan alone, and they can't block a good plan alone.
      *   It keeps "one deed, one vote" intact (satisfying the Status Quo legal concern) but removes the *stakes* from the vote regarding reserves.
  3.  **Create a Tenant Advisory Committee.** Formalize tenant input without granting voting rights. This lowers the temperature on the "livability" dispute without triggering the capital risk moral hazard.

  ### Summary

  The "one deed, one vote" rule is a Schelling point, but it is a **bad** Schelling point for a phased development because it conflates *temporary speculation* with *permanent ownership*.

  There is a principled way to settle this: **Voting power must correlate with the time horizon of the risk.**
  *   **Capital Risk:** Owners only, but constrained by independent data to prevent Developer predation.
  *   **Livability Risk:** Owners + Tenant Input.

  If your bylaws require a vote to change the voting rules, and the Developer holds enough votes to block that change, you are in a **constitutional trap**. In that specific scenario, the problem is practically unfixable without litigation or a Developer sell-out. Your immediate strategic goal should be to bypass the voting weight issue by binding *all* voters (including the Developer) to external, objective standards (like third-party reserve studies) that make the vote itself less consequential.

  Don't try to change *who* decides. Change *what* they are allowed to decide.
