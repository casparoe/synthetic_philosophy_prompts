prompt: |-
  I've recently joined the board of a homeowners' association for a condominium development that's being built and sold off in phases: of forty-two planned units, thirty are sold and occupied, and the remaining twelve are still unbuilt or unsold. What began as a routine bylaws review has turned into the most contentious thing the board has faced in years, and after a couple of meetings that generated far more heat than clarity, I'd like a more rigorous outside take than anyone on the board has managed to offer.

  The dispute is nominally just about voting rights, but it keeps fracturing into sub-disputes every time we think we've settled it. Under the current bylaws, one vote attaches to each deed, held by whoever is on the title. About a third of the thirty sold units are owned by investors who rent them out on long leases and have never lived there, while several tenants who've rented for years, attend every meeting, and are bound by every rule the board passes have no vote at all, since tenancy isn't ownership. Meanwhile, the board is about to approve a fifteen-year reserve-funding and renovation plan that will financially bind whoever eventually buys the twelve unsold units — people who, by definition, can't be consulted now. The development company that still holds title to those twelve units, and will cast its votes until each one sells, has said plainly that it intends to vote however keeps its own carrying costs lowest, with no particular loyalty to the future owners it's nominally standing in for. Predictably, the board has split: one faction wants to leave the rule exactly as it is, since "one deed, one vote" is at least unambiguous and hard to litigate; another wants to extend a vote to long-term tenants and hold the unsold units' votes in some kind of trust for their eventual owners, on the theory that whoever actually has to live under a rule has the strongest claim to a say in making it.

  This feels like exactly the kind of dispute that would get a long, careful treatment on a rationalist blog, and I keep wishing someone had already written that post — but since I can't find one, I'd rather reason it through directly than lean on half-remembered analogies. Part of me suspects the "one deed, one vote" camp is really just defending a Schelling point — a rule that's stable and hard to litigate, rather than one that's obviously fair — but administrative simplicity has to count for something, and I don't want to dismiss their position just because it's convenient. More fundamentally, my suspicion is that every one of these proposals quietly smuggles in an answer to the very question it's supposed to be neutral about: there's no way to decide who gets to help decide without having, in some sense, already decided who counts. But I can't tell whether that's a genuine and probably irresolvable problem, or just a sophisticated-sounding rationalization for whichever scheme happens to favor my own preferred outcome. I'd like your honest, fully worked-through answer: is there a principled way to settle who should get a vote in a case like this, and if so, what is it, and why does it beat the alternatives? And if you conclude that the problem is genuinely unfixable in principle, I want the argument for that conclusion, not a diplomatic shrug.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** New board member of a condo HOA (42 units total: 30 sold/occupied, 12 unsold/developer-held).
      *   **The Conflict:** Voting rights under the bylaws ("one deed, one vote").
      *   **The Stakeholders:**
          *   Owner-occupants (some).
          *   Investor-owners (rent out units, don't live there).
          *   Long-term tenants (live there, follow rules, no vote).
          *   Developer (holds 12 unsold units, votes to minimize carrying costs, potentially against future owners' interests).
          *   Future Owners (bound by decisions made now, currently unrepresented).
      *   **The Specific Issue:** Upcoming 15-year reserve/renovation plan.
      *   **The Factions:**
          *   *Status Quo:* "One deed, one vote" (Clear, hard to litigate, Schelling point).
          *   *Reform:* Vote for long-term tenants + Trust votes for unsold units (Fairness based on impact/residency).
      *   **The User's Meta-Concern:** Suspects every proposal smuggles in the answer to the question it's supposed to decide (the "boundary problem" of democracy). Wants to know if there's a *principled* way to settle this or if it's genuinely unfixable. Wants a rigorous, rationalist-style analysis, not a diplomatic shrug.

  2.  **Initial Analysis & Framing:**
      *   This is a classic "Constitutional Moment" problem within a micro-polity.
      *   The user identifies the core philosophical tension: *Who constitutes the demos?* (The Boundary Problem).
      *   The user is right to be suspicious of "neutrality." Rules are never neutral; they distribute power.
      *   The goal isn't to find a "perfectly fair" solution (impossible), but to find the *least bad* solution that aligns incentives with long-term viability and minimizes agency costs.
      *   I need to avoid taking sides emotionally and instead analyze the *incentive structures* and *risk allocations* of each proposal.

  3.  **Evaluating the Options:**

      *   **Option A: Status Quo ("One Deed, One Vote")**
          *   *Pros:* Legally clear, respects property rights as currently defined, easy to administer.
          *   *Cons:* Misaligned incentives. Investors care about cash flow, not long-term capital preservation (maybe). Developer cares about selling units, not long-term maintenance (definitely). Tenants have zero skin in the game regarding property value but bear the brunt of quality-of-life rules.
          *   *Risk:* Developer votes to cut reserves to make units look cheaper to sell, dumping maintenance costs on future owners. This is the biggest red flag.

      *   **Option B: Tenant Voting + Trust for Unsold**
          *   *Pros:* Aligns voting with "impact" (people who live there). Protects future owners from developer predation.
          *   *Cons:* Legally murky (might violate declaration/bylaws). Separates ownership from control (tenants vote for spending, owners pay). Who defines "long-term"? Administrative burden. Trustee for unsold units: Who picks the trustee? What is their fiduciary duty?
          *   *Risk:* Tenants might vote for amenities they don't pay for directly (if rents are fixed).

      *   **Option C: Hybrid/Weighted Approaches**
          *   Maybe distinguish between *operational* rules (noise, pets) and *capital* decisions (reserves, renovations).

  4.  **Addressing the Philosophical Core (The Boundary Problem):**
      *   The user asks: *Is there a principled way to settle who should get a vote?*
      *   Frederick Whelan and Robert Dahl wrote about this. There is no democratic procedure to decide the demos without already having a demos.
      *   *However*, this isn't a nation-state; it's a contractual association (HOA). The "principle" isn't pure democracy; it's *fiduciary duty* and *contractual intent*.
      *   The HOA exists to preserve property value and livability. Voting rights should align with *exposure to risk*.

  5.  **Developing the Argument:**

      *   **Thesis:** The problem is not unfixable in principle, but the "principle" must shift from "who lives here" or "who owns the deed" to "who bears the long-term financial risk."
      *   **Critique of Status Quo:** It fails specifically on the 12 unsold units. The developer has a temporary interest (sell high) vs. permanent interest (maintain value). This is an agency problem.
      *   **Critique of Tenant Voting:** Tenants have exit rights (lease ends). Owners have exit costs (selling). Capital decisions should be made by those whose asset value is at stake.
      *   **The Solution:** Differentiate between *Governance* (rules of living) and *Capital* (money/asset value).
          *   *Capital/Reserves:* Must be protected from the Developer. The 12 votes need independent representation or supermajority thresholds that prevent the developer from forcing low reserves.
          *   *Governance/Tenancy:* Tenants need a voice, but maybe not a vote. Advisory boards?
      *   **The "Principled" Stand:** The principle is *Anti-Exploitation of Future Stakeholders*. The developer voting on 15-year reserves is inherently exploitative.

  6.  **Structuring the Response:**
      *   **Acknowledge the Depth:** Validate the user's insight about the "Boundary Problem." It's a real philosophical hurdle.
      *   **Reframe the Context:** This isn't a democracy; it's a property contract. The goal isn't "fairness" in the abstract, but "viability" and "fiduciary integrity."
      *   **Analyze the Incentives (The Meat):**
          *   Developer vs. Future Owners (The critical conflict).
          *   Investors vs. Occupants.
          *   Tenants vs. Owners.
      *   **Evaluate the Proposals:**
          *   Status Quo: Fails on the Developer issue.
          *   Tenant Voting: Fails on the "Skin in the Game" issue.
      *   **Propose a Third Way (The Principled Solution):**
          *   Split the ballot.
          *   Capital decisions require owner consent (protects asset).
          *   Developer votes on capital need constraints (protects future).
          *   Tenant input on livability (protects residents).
      *   **Address the "Unfixable" Question:** It is fixable if you abandon the search for a single "voter" definition and instead match voting power to the *type of decision*.
      *   **Legal/Practical Reality Check:** Remind the user about the Declaration/Bylaws constraints. Changing voting rights might require a supermajority vote (which the developer might block). This is the tragic catch.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to give legal advice. Frame this as governance theory.
      *   *Correction:* The user asked for a "rationalist blog" style. Use clear headings, explicit trade-offs, and avoid wishy-washy language.
      *   *Key Insight:* The Developer issue is the most urgent. 12/42 votes is nearly 30%. If a simple majority is needed for reserves, the Developer + Investor bloc could control the budget. This is the "kill shot" for the HOA's long-term health.
      *   *Refining the "Boundary Problem":* Acknowledge that *any* rule is arbitrary, but some arbitrariness is more destructive than others. The Status Quo arbitrariness allows for *predation*. The Reform arbitrariness allows for *moral hazard*. Predation is worse than moral hazard in a capital-constrained entity.

  8.  **Final Polish:**
      *   Ensure the tone is respectful, analytical, and direct.
      *   Make sure to answer the specific question: "Is there a principled way?" Yes, but it requires unbundling the vote.
      *   Highlight the legal trap: If the bylaws require a supermajority to change voting rights, the Developer can veto the fix. This is the "Gödelian loophole" of the situation.

  9.  **Drafting the Response:** (Mental outline of the sections)
