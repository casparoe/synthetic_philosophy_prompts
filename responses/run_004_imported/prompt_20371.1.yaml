answer: |-
  This is an excellent question that cuts to the heart of why population ethics is considered one of the most difficult and frustrating areas of moral philosophy. You have correctly identified that **Average Utilitarianism** avoids the specific formulation of the Repugnant Conclusion that plagues **Total Utilitarianism**.

  However, the consensus among philosophers is that this does not render the Repugnant Conclusion a mere "technical quirk." Instead, it reveals that the problem is structural and inescapable. Switching to Average Utilitarianism solves one paradox only to generate others that are arguably just as counterintuitive.

  Here is why the Repugnant Conclusion remains a deep problem rather than a solvable bug, and why Average Utilitarianism is generally not accepted as the solution.

  ### 1. The Costs of Average Utilitarianism
  Parfit was fully aware of Average Utilitarianism. He discussed it in *Reasons and Persons* (1984) and ultimately rejected it because it leads to conclusions that violate our moral intuitions in different ways.

  **The "Sadistic Conclusion"**
  Under Average Utilitarianism, adding a person whose life is worth living can make the outcome *worse* if their wellbeing is below the current average.
  *   **Scenario:** Imagine a population of 1,000 people with extremely high wellbeing (100/100). The average is 100.
  *   **Addition:** You add one person with a life that is clearly worth living, but modest (50/100).
  *   **Result:** The new average drops (to roughly 99.95). Average Utilitarianism implies the new state is *worse* than the old state.
  *   **Implication:** This suggests it would have been better if that happy person had never existed. Even more disturbingly, it implies that adding a group of people with miserable lives (negative utility) might be *better* than adding a group of people with happy-but-below-average lives, because the miserable lives might be excluded from the calculation or weighted differently in some variations, or simply because the "happy" addition dilutes the excellence of the elite.

  **The Problem of Creation**
  Average Utilitarianism struggles to explain why we should bring *any* children into the world if the existing population is very happy. If the current average is 100, and any new child is likely to have a life of 99 (still wonderful), Average Utilitarianism says creating that child reduces the overall value of the outcome. This leads to a "anti-natalist" bias for happy societies that seems implausible to many.

  **The "Mere Addition" Paradox**
  Parfit showed that if you try to navigate between Total and Average views, you run into the "Mere Addition Paradox."
  1.  Start with Population A (high quality).
  2.  Add new people with lives worth living (Population A+). Intuitively, this isn't *worse* than A.
  3.  Equalize the wellbeing in A+ to create Population B (slightly lower average than A, but higher total, and no inequality). Intuitively, B is better than A+ (due to equality).
  4.  If A+ is not worse than A, and B is better than A+, then B should be better than A.
  5.  Repeat this process, and you eventually arrive at the Repugnant Conclusion (Population Z).

  If you block the move from A to A+ to avoid the Repugnant Conclusion, you must accept that adding happy people is *bad*. If you accept the move, you slide toward the Repugnant Conclusion. Average Utilitarianism blocks the slide, but only by accepting that adding happy people is bad.

  ### 2. Impossibility Theorems
  In the decades since Parfit, formal axiologists (like Gustaf Arrhenius) have proven **Impossibility Theorems** in population ethics. These are mathematical proofs demonstrating that no ethical theory can satisfy a set of seemingly basic, adequate conditions simultaneously.

  For example, a theory cannot simultaneously satisfy:
  *   **Non-Elitism:** A world with many very good lives is better than a world with a few excellent lives.
  *   **Weak Non-Sadism:** It is not better to add people with negative wellbeing than people with positive wellbeing.
  *   **Transitivity:** If A is better than B, and B is better than C, then A is better than C.

  What this means for your inquiry is that the Repugnant Conclusion is not a flaw in *Total Utilitarianism* specifically; it is a symptom of a fundamental tension in how we value existence itself. You cannot "fix" it by tweaking the aggregation formula; you can only choose which counterintuitive bullet you are willing to bite.

  ### 3. Relevance to Your Context (Resource Strain)
  You mentioned your interest stems from the ethics of procreation in a resource-strained world. Here is how the distinction matters practically:

  *   **Total Utilitarianism:** Would suggest we should continue having children as long as their lives are worth living, even if that strains resources, provided the *sum* of happiness increases. The Repugnant Conclusion warns this could lead to a "maxed out" world of subsistence living.
  *   **Average Utilitarianism:** Would suggest we should limit population to maintain a high quality of life per capita. However, it risks implying that we should not have children if they are merely "happy" rather than "exceptionally happy," or that we should prioritize the happiness of the existing elite over the creation of new lives.
  *   **Critical-Level Utilitarianism:** A popular middle ground. It posits that a life only adds value if it exceeds a certain "critical level" of wellbeing (above mere subsistence). This avoids the Repugnant Conclusion (barely worth living lives don't count as positive) and avoids the Average Utilitarianism problem (adding happy lives is good). However, it raises the question: *Who sets the critical level?* and *Why does a life below that level count as zero value?*

  ### Conclusion
  The Repugnant Conclusion is not a technical quirk; it is a **limitative result**. It demonstrates that our intuitive concepts of "better" and "worse" break down when the number of subjects involved changes.

  Switching to Average Utilitarianism does not make the paradox vanish; it merely displaces the tension. It saves us from a world of barely-livable masses, but at the cost of devaluing the addition of happy lives and potentially condemning the existence of people who are glad to be alive.

  For your own ethical framework regarding population growth, the lesson is not to look for the theory that avoids all paradoxes (because none exist), but to decide which implication is the least unacceptable to you. Do you prefer the risk of overpopulation and diluted resources (Total View), or the risk of valuing "quality" over the sheer existence of happy people (Average View)? Most modern philosophers lean toward **Critical-Level Views** or **Person-Affecting Views**, but all require acknowledging that our moral intuitions are not perfectly coherent when applied to non-existent people.
