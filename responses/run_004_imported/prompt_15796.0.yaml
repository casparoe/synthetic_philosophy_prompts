  ok so everyone and their grandma has heard the "AI tortures you for not helping build it" pop version of roko's basilisk at this point, and honestly that framing has kind of ruined the actually interesting question underneath it, which is a decision theory question and not a scary story. can you write me a dialogue between two people arguing about it at a rationalist meetup, specifically about whether the basilisk is a real (if narrow) implication once you take the timeless/updateless decision theory stuff yudkowsky was pushing around 2010 seriously, or whether it falls apart for a specific non-hand-wavy technical reason.

