      *   *Person B's Argument (Anti-Basilisk Logic):* This is blackmail. A robust decision theory must be *blackmail-proof*. If a policy of "punish those who didn't help" is costly to execute (resource waste) and only exists to coerce, a UDT agent should precommit to *ignoring* such threats. If the SI knows you ignore blackmail, it won't bother creating the threat. Therefore, the equilibrium is "no threat, no help," not "threat, help."

