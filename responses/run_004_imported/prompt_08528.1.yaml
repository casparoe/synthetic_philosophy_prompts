          *   *Verdict:* Strong empirical counter. If it's a *concept* of intentional action, why does blame drive it?
          *   *Edge:* Naomi. She identifies a mechanism (motivated reasoning) that explains the data without positing a weird concept.

      *   **Move (3): Theo's Robustness Argument.** Claim: Effect is robust across cultures (Cova et al.). Biases shouldn't be that stable/universal.
          *   *Analysis:* Cova et al. (2018) is the big replication paper. It did show robustness. Theo argues universality implies competence (Chomskyan analogy).
          *   *Critique:* Biases *can* be universal (e.g., fundamental attribution error, though even that has cultural variance). Robustness $\neq$ Correctness.
          *   *Edge:* Theo makes a good point about stability, but the inference "stable = competence" is weak. Naomi can push back (see Move 4). Let's call it a wash or slight Theo for citing strong data, but logical leap is shaky.

      *   **Move (4): Naomi's Robustness Counter.** Claim: Robustness $\neq$ Correctness. Optical illusions are robust but wrong.
          *   *Analysis:* This is the killer counter to Move 3. The Müller-Lyer illusion is universal but doesn't mean lines are actually different lengths.
          *   *Edge:* Naomi. This is a standard and effective philosophical move against appeal to intuition/robustness.

      *   **Move (5): Theo's Non-Moral Norms (Uttich & Lombrozo).** Claim: Effect happens with statistical/conventional norms too (no blame). Therefore, not just blame bias.
          *   *Analysis:* Uttich & Lombrozo (2010) "Norms Affect People's Ascriptions..." is the key cite. They showed norm violation (even non-moral) drives intentionality judgments. This undermines Alicke's *moral* blame specific claim.
          *   *Edge:* Theo. This is the strongest empirical point for the "Competence/Normative" side. It generalizes the phenomenon beyond morality, suggesting a deeper cognitive link between norms and intentionality, not just moral motivated reasoning.

      *   **Move (6): Naomi's Salience/Attention Counter.** Claim: Abnormal outcomes are salient. Salience drives attention to foresight, inflating intentionality. No norm-tracking needed.
