  2.  **Deconstruct the Argument Moves:**

      *   **Move (1): Theo's Opening.** Claim: Moral valence is *constitutively* part of the concept of intentional action (like "reckless").
          *   *Analysis:* This is the "Deep Self" or "Normative Competence" view (Knobe's later view, maybe Ariely or others). It challenges the traditionalist view (purely descriptive mental states).
          *   *Verdict:* Strong philosophical claim, but empirical evidence is needed. It's a coherent position but controversial.
          *   *Edge:* Slight edge to Theo for articulating a coherent theoretical stance, but Naomi has the empirical upper hand coming up.

