answer: |-
  Here is a move-by-move referee score for your scene, followed by the underlying concept both characters are circling but not quite naming.

  **The Scorecard**

  **(1) Marisol: +1**
  She cites the landmark Sneddon (2003) study accurately, but inferring subjective "hurt" from behavioral changes remains an inference, not a direct observation.

  **(2) Dov: 0**
  This is the traditional "null hypothesis" stance, but the claim that a neocortex is strictly necessary for affect is increasingly outdated in comparative neurology.

  **(3) Marisol: +2**
  This is her strongest move; the 2012 Cambridge Declaration on Consciousness explicitly supports her point that non-mammalian structures (like the pallium) can support conscious experience.

  **(4) Dov: +1**
  He correctly identifies a methodological gap: avian consciousness is supported by diverse cognitive tests, whereas fish data relies heavily on nociceptive reflexes and avoidance.

  **(5) Marisol: +1**
  She lands a valid philosophical blow, pointing out that strict skepticism can become a "solipsistic trap" where no amount of behavioral evidence is ever accepted.

  **(6) Dov: 0**
  This shifts from science to risk management; while comparing fish to thermostats is a category error, his point about the stakes of false positives is pragmatically sound.

  ***

  **The Bigger Thing They're Missing**

  Both characters are trapped in a **Binary Fallacy**. They are arguing as if consciousness is a light switch (either you have a "felt ache" or you are a "biological robot"), whereas modern ethology suggests sentience is likely a **dimmer switch**.

  The missing piece for your novel is the **Precautionary Principle**. The scientific debate isn't actually waiting for a "Yes/No" verdict before acting; policy is increasingly moving toward "If there is a non-zero probability of suffering, we must minimize harm regardless of the philosophical resolution." Marisol wants *proof of feeling* to justify care, and Dov wants *proof of mechanism* to justify indifference, but the real-world resolution is that **uncertainty itself creates an ethical obligation.**

  For your characters, this adds subtext: Marisol is fighting for *recognition*, while Dov is fighting for *certainty*, but the institution they work for likely already operates on the assumption that she is right, making his skepticism intellectually rigorous but ethically obsolete.
