answer: |-
  Here is a draft for a five-minute toast. It is written to be spoken at a moderate, conversational pace. I have included some stage directions in brackets to help you with the delivery.

  **Tone:** Warm, slightly self-deprecating, honest, and affectionate.
  **Time:** Approximately 5 minutes (roughly 700–750 words).

  ***

  **The Toast**

  [Stand up, take a moment to settle the room, and smile at Marion]

  Good evening, everyone. For those who don't know me, I'm [Your Name], Marion's niece/nephew.

  I was told that giving a toast like this is supposed to be terrifying, and I have to say, the person who told me that was right. But then I looked around the room and realized I have the perfect excuse for being nervous. I am standing in front of two distinct groups of people. On one side, I have my family, who mostly know Marion as the aunt who occasionally misses Thanksgiving because she's in a holding cell. And on the other side, I have her colleagues, former clients, and friends who know her as one of the most formidable legal minds of her generation.

  My job tonight is to find the sentence that bridges those two worlds. And luckily, I've had thirty-eight years of Thanksgiving dinners to prepare for this.

  [Turn slightly toward the family side]

  To the family, Marion has always been a bit of a mystery. We grew up hearing stories about blockades, sit-ins, and environmental protests. We learned early on that Aunt Marion believes in things deeply. But I think it took me growing up to realize that her career wasn't just about *breaking* rules. It was about a very specific relationship with them.

  [Turn slightly toward the colleagues/professors]

  There is a philosophy Marion has explained to me more times than I can count. She calls it the difference between the price and the point. In most criminal defense, jail time is the price you try to avoid. But for Marion, in cases of civil disobedience, accepting the punishment *is* the point.

  She's always said that when you break a law to make a moral argument, but you willingly accept the state's punishment for it, you are actually showing the highest form of respect for the legal system. You're saying, "I am not above the law; I am asking the law to be better." I'm told there's a political philosopher named Rawls who wrote a whole book about this, but Marion lived it. She became famously… let's call it "intense"… about this. The family joke is that she's the only lawyer in history who would get visibly annoyed if a judge offered her client a plea deal for less time. To her, dodging the sentence kind of defeated the purpose. She was hardcore.

  [Pause. Shift tone to be softer, more intimate. Look directly at Marion, then scan the room.]

  But… there is a story that some of you in this room know. A few years back, there was a case. A young client. A potentially brutal sentence hanging over their head. And Marion, the woman who built a career on the principle of accepting punishment, did something unexpected. She pushed that client to take the deal. She pushed them to dodge the time.

  I know there were some of her oldest friends who were surprised by that. Maybe even disappointed. It looked, on paper, like a contradiction. Like the theory had cracked.

  But I want to suggest something different. I think that moment didn't weaken her philosophy; it humanized it.

  Marion taught me that principles are essential. They are the backbone of a just society. But she also taught me, in that quiet, difficult moment, that people are more important than principles. She realized that while accepting punishment might be the "point" of civil disobedience in a textbook, sometimes the cost is too high for a human being to pay. She chose compassion over consistency. And if you ask me, that doesn't make her a hypocrite. It makes her a better lawyer, and a better aunt.

  [Raise your glass]

  The professors in the room might argue about the legal theory of that choice. The family might just be glad she came to Christmas that year. But I think we can all agree on what that choice says about her character.

  For thirty-eight years, Marion has stood between the vulnerable and the powerful. She has been willing to go to jail for her beliefs, but she was also willing to bend her own rules to save someone else from going to jail. That is a rare kind of integrity. It's the kind that doesn't just look good in a law review; it looks good in a life.

  So, to Marion. Thank you for teaching us that the law should have a conscience. Thank you for showing us that sometimes, the bravest thing you can do is stand on principle—and the bravest thing you can do is know when to step off it for someone else.

  To Aunt Marion.

  [Lead the applause]
