answer: |-
  This is a sophisticated metaphysical puzzle to bring to character construction, but it is precisely where the philosophy of mind and action meets the art of fiction. You are asking for the logical engine under the hood of David Lewis's 1997 paper "Finkish Dispositions."

  The asymmetry you are sensing is real. Lewis's Reformed Counterfactual Analysis (RCA) succeeds against finks because it **stipulates the persistence of the causal basis** in the antecedent of the counterfactual. It fails against masks because masks **operate independently of the causal basis**, interfering with the manifestation even when the basis persists.

  Here is the rigorous breakdown of that logical asymmetry, followed by its implication for your character's courage.

  ### 1. The Setup: SCA vs. RCA

  To see the asymmetry, we must first formalize the failure of the Simple Conditional Analysis (SCA) and Lewis's specific repair.

  **The Simple Conditional Analysis (SCA):**
  $$x \text{ is disposed to } M \text{ when } S \iff (S(x) \boxright M(x))$$
  *(Read: $x$ would $M$ if $x$ were $S$-ed.)*

  *   **Fink Failure:** A live wire ($x$) is disposed to shock ($M$) when touched ($S$). But a "fink" device detects touching and instantly makes the wire dead before the shock occurs. $S$ happens, but $M$ does not. SCA says "not disposed." Intuition says "disposed."
  *   **Mask Failure:** A fragile glass ($x$) is disposed to break ($M$) when struck ($S$). But it is packed in styrofoam (mask). $S$ happens, the glass's fragility remains, but $M$ does not. SCA says "not disposed." Intuition says "disposed."

  **Lewis's Reformed Counterfactual Analysis (RCA):**
  Lewis argues dispositions must be grounded in an **intrinsic causal basis** ($B$).
  $$x \text{ is disposed to } M \text{ when } S \iff \exists \text{ intrinsic property } B \text{ such that: } (S(x) \land \text{Persist}(B, x)) \boxright M(x)$$

  *   **The Crucial Move:** Lewis builds the *persistence of the basis* ($B$) into the **antecedent** (the "if" part) of the counterfactual. We are not asking "If $S$ happens, what follows?" We are asking "If $S$ happens **and $B$ stays put**, what follows?"

  ### 2. Why RCA Neutralizes Finks

  In a finkish scenario, the stimulus $S$ triggers a mechanism that removes the basis $B$.
  *   **Actual World:** $S$ occurs $\rightarrow$ $B$ vanishes $\rightarrow$ $M$ does not occur.
  *   **Lewis's Evaluation:** To evaluate the counterfactual $(S \land \text{Persist}(B)) \boxright M$, we look at the closest possible worlds where the antecedent is true.
  *   **The Logical Fix:** The antecedent *demands* that $B$ persists. Therefore, in the possible worlds we are evaluating, the finkish mechanism (which removes $B$) **must fail** or be overridden. We are logically forcing a world where the basis survives the stimulus.
  *   **Result:** Since $B$ is defined as the *causal basis* for $M$, if $S$ occurs and $B$ is present (as the antecedent stipulates), $M$ *must* occur. The counterfactual comes out **True**.
  *   **Verdict:** Lewis correctly attributes the disposition. The fink is logically neutralized because the analysis refuses to consider worlds where the basis vanishes.

  ### 3. Why RCA Fails on Masks

  In a masking scenario, the stimulus $S$ occurs, the basis $B$ remains intact, but an extrinsic factor (the mask, $Z$) blocks $M$.
  *   **Actual World:** $S$ occurs + $B$ persists + $Z$ (mask) is present $\rightarrow$ $M$ does not occur.
  *   **Lewis's Evaluation:** We evaluate $(S \land \text{Persist}(B)) \boxright M$.
  *   **The Logical Failure:** The antecedent stipulates that $S$ happens and $B$ persists. It **does not** stipulate that $Z$ (the mask) is absent. In the closest possible worlds where $S$ happens and $B$ persists, the mask $Z$ usually persists as well (since masks are often extrinsic circumstances or separate intrinsic properties).
  *   **Result:** In these worlds, $S$ and $B$ are present, but $Z$ blocks the causal chain from $B$ to $M$. Therefore, $M$ does not occur. The counterfactual comes out **False**.
  *   **Verdict:** Lewis incorrectly denies the disposition. The mask survives the analysis because Lewis's antecedent protects the *basis*, but not the *pathway to manifestation*.

  ### 4. The Structural Asymmetry

  The precision you requested lies in the **locus of interference** relative to the variable $B$.

  1.  **Finks attack $B$ directly.** The interference is *ontological* regarding the disposition's ground. The fink makes $\neg B$ true.
      *   *Lewis's Defense:* The analysis explicitly asserts $B$ in the antecedent. It creates a logical shield around the basis. $S \land \mathbf{B} \rightarrow M$. The fink is rendered irrelevant because the evaluation ignores worlds where $\neg B$.
  2.  **Masks attack the $B \rightarrow M$ link.** The interference is *causal* regarding the manifestation. The mask makes $(B \land S) \rightarrow \neg M$ true.
      *   *Lewis's Weakness:* The analysis assumes $B$ is *sufficient* for $M$ (given $S$). It does not include a *ceteris paribus* clause ("and nothing interferes"). Because $Z$ (the mask) is not excluded in the antecedent, it remains in the evaluation world and breaks the sufficiency of $B$.

  **In summary:** Lewis solves the fink problem by **holding the basis fixed**. He cannot solve the mask problem because **holding the basis fixed does not hold the interference fixed.**

  ### 5. Application to Your Character's Courage

  This metaphysical distinction offers two radically different psychological profiles for your novelist's dilemma.

  **Profile A: Finkish Courage (The Basis Vanishes)**
  *   **Metaphysics:** The character possesses the intrinsic neural/psychological basis of courage ($B$) (e.g., valorous temperament, moral conviction). However, the stimulus of Danger ($S$) triggers a mechanism (e.g., traumatic panic response) that instantly dissolves $B$ before action can be taken.
  *   **Lewisian Verdict:** She **IS** courageous.
  *   **Why:** Because *if* her basis had persisted through the danger, she *would* have acted. The failure is not in her character, but in the stability of her character under pressure.
  *   **Narrative Arc:** Her journey is about **stabilization**. She doesn't need to *find* courage; she needs to make her existing courage "fink-proof." She needs to decouple the stimulus of danger from the dissolution of her resolve.

  **Profile B: Masked Courage (The Basis Persists)**
  *   **Metaphysics:** The character possesses the basis $B$ (calm, resolve, willingness). When Danger ($S$) arrives, $B$ remains intact. However, a Mask ($Z$) prevents the manifestation ($M$).
      *   *External Mask:* She is handcuffed, ordered to stand down, or physically restrained.
      *   *Internal Mask:* She has a specific phobia or a conflicting duty that overrides the courage without removing it.
  *   **Lewisian Verdict:** She **IS NOT** courageous (according to RCA).
  *   **Why:** Because even with her resolve intact ($B$), she *would not* have acted ($M$) due to the mask. The counterfactual fails.
  *   **Narrative Arc:** Her journey is about **removal**. She already has the courage. The drama lies in identifying and removing the mask. If the mask is external, she must break free. If the mask is internal (e.g., a conflicting loyalty), she must resolve the conflict so the courage can flow to manifestation.

  ### The Novelist's Takeaway

  The metaphysical asymmetry reveals a crucial difference in **blame and potential**.

  *   If her courage is **finkish**, the tragedy is that she *loses herself* in the moment. The "she" who exists before the test is not the "she" who exists during it. This is a story about identity fragmentation.
  *   If her courage is **masked**, the tragedy is that she *remains herself* but is rendered impotent. The "she" is consistent, but the world (or her own conflicting psychology) will not let her express it. This is a story about constraint and liberation.

  Lewis's analysis suggests that **finkishness is a defect of the disposition itself** (it lacks stability), whereas **masking is a defect of the circumstances** (the disposition is sound, the context is not). For a character study, the finkish character is fighting her own nature; the masked character is fighting her situation.
