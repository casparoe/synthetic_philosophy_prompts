          *   *Anti-Adoption/Caution (Friend's stance):* Ian Hacking's "looping effects" and "interactive kinds." Diagnosis changes the experience of grief, creates new borderline cases, and the category shifts (evidenced by DSM-5-TR vs. ICD-11 threshold discrepancy).
      *   **Requirements:**
          *   End with a concrete recommendation (Adopt, Reject, or Adopt with Conditions) + Timeframe.
