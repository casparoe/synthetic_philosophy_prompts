      *   **The Core Tension (The "Hacking" Point):** This is crucial. I need to articulate the "looping effect" argument without using too much jargon, making it relevant to clinical practice.
          *   *Idea:* Diagnosis isn't neutral. It shapes how patients tell their stories. If we screen everyone, we might inadvertently teach patients to perform "PGD" to get help, or pathologize normal variations.
