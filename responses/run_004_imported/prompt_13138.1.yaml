answer: |-
  **MEMORANDUM**

  **TO:** Clinical Policy Committee, Outpatient Bereavement and Loss Program
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Implementation of Prolonged Grief Disorder (PGD) Screening and Diagnosis

  **Purpose**
  This memo outlines a recommendation regarding the proposal to integrate formal screening for Prolonged Grief Disorder (PGD) into our standard intake protocol, utilizing the PG-13-Revised instrument. This decision follows extensive review of the DSM-5-TR criteria (12-month threshold) and ICD-11 criteria (6-month threshold), as well as consideration of the clinical and conceptual implications of formalizing this diagnosis.

  **Clinical Context and Necessity**
  There is no doubt that a subset of our patients experience severe, enduring impairment following loss that exceeds normative cultural expectations for grief. Currently, without a specific billing code, these patients often face barriers to accessing structured, evidence-based interventions such as Complicated Grief Treatment (CGT). Adopting PGD as a billable diagnosis would validate this suffering, reduce financial barriers to care, and standardize treatment pathways for those most at risk.

  **Conceptual Constraints: The "Looping" Risk**
  However, adopting this category requires us to acknowledge a significant conceptual constraint raised during stakeholder consultation. Diagnostic categories in psychiatry are not merely descriptive labels for static conditions; they are "interactive kinds." As noted in recent philosophical literature (e.g., Hacking's account of looping effects), the introduction of a formal category changes how patients narrate their experience and how clinicians attend to symptoms.

  The discrepancy between the DSM-5-TR (12 months) and ICD-11 (6 months) thresholds is not merely a bureaucratic inconsistency; it suggests the boundary of this disorder is fluid and responsive to clinical discourse. If we implement universal screening without safeguards, we risk:
  1.  **Narrative Narrowing:** Patients may unconsciously shape their grief to match the checklist to access care, potentially obscuring unique aspects of their bereavement.
  2.  **Category Creep:** Clinicians may begin to view the checklist as the territory rather than the map, leading to over-diagnosis in borderline cases where watchful waiting would be more appropriate.

  **Recommendation**
  To balance the urgent need for treatment access with the risks of diagnostic reification, I recommend we **Adopt with Specific Conditions.**

  We should proceed with PGD screening and diagnosis, but not as a passive administrative update. We must treat the diagnosis as a clinical tool that requires active stewardship to mitigate negative looping effects.

  **Implementation Plan & Timeframe**

  1.  **Targeted Screening (Effective Immediately):** Do not administer the PG-13-R universally at intake. Instead, utilize a preliminary clinical interview to identify candidates who present with significant functional impairment. This ensures the diagnosis follows clinical need rather than driving it.
  2.  **Clinician Training on "Interactive Diagnosis" (Within 60 Days):** All staff authorized to diagnose PGD must complete training that explicitly addresses the DSM/ICD discrepancy and the risk of checklist-driven care. Clinicians must document not only symptom presence but also why the diagnosis fits the *individual's* context, preserving space for non-pathological grief narratives.
  3.  **Pilot Period and Review (12-Month Cycle):** We will adopt this protocol on a **12-month pilot basis**. At the conclusion of this period, the Committee will review:
      *   Rates of diagnosis relative to total intake.
      *   Insurance authorization success rates.
      *   Qualitative feedback from clinicians regarding whether the diagnosis aided or hindered the therapeutic alliance.

  **Conclusion**
  We can acknowledge that diagnostic categories shape the phenomena they describe without refusing to use them. By adopting PGD with these safeguards, we provide necessary care to the severely impaired while remaining vigilant against the unintended consequences of turning grief into a rigid medical object.

  I request this item be placed on the agenda for the November 15th meeting for a final vote.
