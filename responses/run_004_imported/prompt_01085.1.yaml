answer: |-
  Your editor is giving you the "pop science" version of history, but your instincts are spot on. Dismissing Hobbes as simply "smart but bad at math" misses the fascinating philosophical wreckage that caused this feud.

  Hobbes wasn't just a crank who happened to write *Leviathan*; he was a systematic thinker whose error in mathematics was actually a feature, not a bug, of his broader philosophy. To understand why he couldn't admit he was wrong about squaring the circle, you have to understand that for Hobbes, **geometry wasn't just math—it was the physics of truth.**

  Here is the substantive context you need for your piece.

  ### 1. The Stakes Were Existential, Not Just Egoic
  You mentioned *De Corpore* (1655), and that is the key. Hobbes's philosophical system was a pyramid.
  *   **Base:** *De Corpore* (Matter and Motion/Geometry)
  *   **Middle:** *De Homine* (Human Nature)
  *   **Top:** *De Cive* / *Leviathan* (Politics and Sovereignty)

  Hobbes believed that the only way to achieve certainty in human affairs (and thus justify absolute sovereignty) was to apply the "resolutive-compositive" method of geometry to politics. He believed he had turned political philosophy into a hard science.

  If Hobbes admitted that he was wrong about the fundamentals of geometry—that he couldn't actually construct a square equal to a circle—he wasn't just admitting a math error. **He was admitting that his method for deriving certainty was flawed.** If the foundation (*De Corpore*) was rotten, the entire structure of *Leviathan* collapsed. His refusal to concede to Wallis wasn't just stubbornness; it was a desperate defense of his life's work against total incoherence.

  ### 2. A Clash of Mathematical Ontologies
  This is the part that usually gets skipped. Hobbes and Wallis weren't just disagreeing on a calculation; they disagreed on what math *was*.

  *   **Wallis (The Modern):** Represented the rising tide of symbolic algebra and analysis. He was comfortable with abstract quantities, infinitesimals, and symbols that didn't necessarily correspond to physical objects.
  *   **Hobbes (The Materialist):** Hobbes was a radical materialist. He believed nothing exists but "body" (matter in motion). To Hobbes, a geometric "point" had to be a physical object with magnitude. A "line" was the trace of a moving body.

  Hobbes famously despised algebra, calling it a "scab of symbols" and "insignificant marks." He believed true geometry had to be constructive and physical. When Wallis used algebraic proofs to debunk Hobbes's constructions, Hobbes literally didn't recognize them as valid geometric arguments. He viewed Wallis's refutations as semantic tricks or "witchcraft" rather than mathematics.

  So, when you ask how he couldn't see the holes: **He was looking for physical errors in construction, while Wallis was pointing out logical errors in abstraction.** Hobbes thought he was building a table; Wallis was telling him the concept of "table" was incoherent.

  ### 3. The "Late Bloomer" Rigidity
  You noted he found Euclid late (around age 40, in a gentleman's library, famously reading Proposition 47 of Book I). This is crucial.

  Because he came to geometry as an adult philosopher rather than a trained mathematician, he treated Euclid less as a toolkit and more as a **dogma of certainty**. He fell in love with the *certainty* of geometry, not necessarily the practice of it. He wanted geometry to be the anchor that stopped the endless skepticism of the era.

  This made him immune to correction. In Hobbes's mind, if his logic followed his definitions, he *must* be right. If the result was impossible (squaring the circle), then the impossibility proof must be wrong, because his method was the only path to truth. He reversed the burden of proof: instead of him proving the possibility, he demanded Wallis prove the impossibility (which, technically, wouldn't be fully achieved until Lindemann proved $\pi$ was transcendental in 1882).

  ### 4. The Social Context: The Royal Society
  The feud wasn't just intellectual; it was institutional. John Wallis was a founding member of the Royal Society. Hobbes, despite his fame, was largely excluded. The Society viewed Hobbes as an atheist and a royalist troublemaker.

  Wallis's dismantling of Hobbes was partly scientific, but also partly gatekeeping. By branding Hobbes a mathematical incompetent, the Royal Society marginalized his philosophical influence. Hobbes knew this. He published *Six Lessons to the Professors of Mathematics* (1656) specifically attacking the math professors at Oxford (where Wallis was). To Hobbes, Wallis wasn't just a critic; he was part of a "university conspiracy" to keep him out of the intellectual establishment. This paranoia fueled the feud for 25 years.

  ### The Verdict for Your Piece
  Hobbes wasn't a random crank, but he was a **philosophical crank.**

  He fell into a trap that many great system-builders do: he loved the *idea* of rigor more than the *practice* of it. He wanted geometry to be the language of God, but he tried to speak it with a materialist accent that the math didn't support.

  **The substantive takeaway:** Hobbes couldn't see the holes in his proofs because acknowledging them would have required him to dismantle the epistemological foundation of his political theory. He chose to be a mathematical fool rather than a philosophical skeptic. In his mind, being wrong about a circle was better than being wrong about the Sovereign.

  That's not just "bad at math." That's tragedy.
