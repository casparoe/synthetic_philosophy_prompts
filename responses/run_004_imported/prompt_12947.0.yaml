  **SCENE START**

  **INT. FACULTY CLUB - NIGHT**

  The clink of silverware against china. MARCUS (CDT) swirls his Cabernet, looking entirely too relaxed. DAVID (EDT) is staring at the dessert menu like it's a logic bomb. He's been holding it for ten minutes.

  MARCUS
  You know, David, I heard a good one at the APA. About Death in Damascus.

  DAVID
  (Without looking up)
  Gibbard and Harper. 1978. Appointment book filled in advance. Perfect predictor. I know the setup, Marcus.

  MARCUS
  Right, but this version has a punchline. So, Death tells the philosopher he's coming tomorrow. The philosopher can flee to Aleppo or stay in Damascus.

  DAVID
  And since Death's book is already filled, the location is causally independent of the philosopher's current choice.

  MARCUS
  Exactly. So the Causal Decision Theorist shrugs. She says, "My action doesn't cause Death's past movement. I prefer Aleppo's kebabs. I go to Aleppo." She eats well. Death finds her later. She dies satisfied.

  David finally looks up, twitchy.

  DAVID
  That's not a joke. That's just... accepting fatalism.

  MARCUS
  Ah, but wait. The Evidentialist is at the same dinner. He thinks, "If I choose Aleppo, that's strong evidence Death is in Aleppo." So he switches to Damascus. But then he thinks, "If I choose Damascus, that's evidence Death is in Damascus." So he switches back to Aleppo.

  Marcus leans in, smiling.

  MARCUS (CONT'D)
  The punchline is: The Causal theorist is dead. The Evidential theorist is *still in the lobby*, oscillating between the coat check and the exit, waiting for a ratifiable equilibrium that doesn't exist.

  David opens his mouth, then closes it. He looks back at the dessert menu. He puts it down. Picks it up again.

  DAVID
  Technically... if he assigns a mixed strategy probability...

  MARCUS
  (To the waiter)
  We'll take the chocolate soufflé. And bring my colleague a paper bag. He looks like he's about to hyperventilate over his own conditional credences.

  David stares at the table.

  DAVID
  (Quietly)
  I'm not sure the soufflé is ratifiable.

  MARCUS
  (Raising his glass)
  Cheers to causal independence, David.

  **SCENE END**
