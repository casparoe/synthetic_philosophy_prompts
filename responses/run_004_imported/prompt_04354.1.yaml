prompt: |-
  Frederick Whelan's "boundary problem" observes that no democratic procedure can, from within itself, tell us who is entitled to take part in it: letting "all those affected" by a decision determine the composition of the demos already presupposes some demos empowered to make that very determination. Whelan takes this circularity to show that the problem is insoluble from within democratic theory itself, and that the boundary must instead be fixed by some external criterion. Two influential candidates disagree sharply about what that criterion should be. Robert Goodin's all-affected-interests (AAI) principle would enfranchise everyone whose interests are causally affected by a decision — a criterion he himself acknowledges tends, for almost any consequential decision, toward enfranchising something close to the whole of humanity. Arash Abizadeh, David Owen, and others instead ground the demos in subjection to a polity's coercive laws: on this all-subjected principle (ASP), only those actually coerced by, or legally subject to, a polity's laws belong to its demos.

  Write an essay assessing whether either principle genuinely escapes Whelan's circularity, or merely relocates it — for instance, by requiring an antecedent, non-circular account of who counts as "affected" or "subjected" before it can even be applied. Weigh the strongest considerations for each view, and close by defending a definite verdict on whether the boundary problem admits of a principled solution and, if so, whether AAI, ASP, or some alternative you specify comes closest to providing one.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**
      *   **Core Issue:** Frederick Whelan's "boundary problem" (the paradox of constituting the demos).
      *   **Whelan's Claim:** Democratic theory cannot solve this internally; it requires an external criterion.
      *   **Two Candidates:**
          1.  All-Affected-Interests (AAI) - Robert Goodin (tends toward global enfranchisement).
          2.  All-Subjected-Principle (ASP) - Arash Abizadeh, David Owen (based on coercion/subjection to law).
      *   **Task:** Assess whether either escapes Whelan's circularity or merely relocates it (e.g., needing antecedent definitions of "affected" or "subjected").
      *   **Requirement:** Weigh strongest considerations for each.
      *   **Conclusion:** Defend a definite verdict on whether a principled solution exists and which principle (AAI, ASP, or alternative) comes closest.

  2.  **Analyze Whelan's Challenge:**
      *   The problem: To decide *who* decides, you need a decision procedure. But that procedure requires a *who*. Infinite regress or circularity.
      *   Whelan's conclusion: It's pre-political/historical/arbitrary, not democratic.
      *   The Counter-Challenge: Can normative principles (AAI/ASP) break the circle by providing an *external* normative standard that isn't itself a democratic decision?

  3.  **Analyze All-Affected-Interests (AAI):**
      *   *Strength:* Morally intuitive. If I'm impacted, I should have a say. Aligns with utilitarian/egalitarian ethics.
      *   *Weakness (The Circularity/Relocation):* How do we define "affected"? Causal chains are infinite (butterfly effect). Goodin admits this leads to "all humanity."
      *   *Assessment:* Does it solve the boundary problem? It dissolves the boundary entirely. If everyone is affected by everything (in a globalized world), the demos is global. But who decides what counts as a relevant causal chain? That determination itself needs a boundary. It relocates the problem to "relevant affect."

  4.  **Analyze All-Subjected-Principle (ASP):**
      *   *Strength:* Institutional clarity. Coercion is tangible. Aligns with autonomy (those bound by laws should author them).
      *   *Weakness (The Circularity/Relocation):* Who defines the jurisdiction of coercion? To know who is subjected, we must know where the law applies. But the law's application depends on the state's boundaries. Who defines the state's boundaries?
      *   *Assessment:* It presupposes the existence of a polity with defined jurisdiction. It solves *membership* within an existing state well, but fails to justify the *state's spatial boundaries* themselves. It relocates the problem to "jurisdictional scope."

  5.  **Compare and Evaluate:**
      *   Both rely on pre-democratic facts (causal impact vs. legal coercion).
      *   Whelan says *any* criterion is external to democracy. So, in a sense, both accept Whelan's premise that the solution is non-democratic (normative rather than procedural).
      *   The question is: Do they provide a *principled* solution, even if not strictly *democratic*?
      *   AAI is too expansive (unworkable).
      *   ASP is too static (reifies existing borders).

  6.  **Develop a Verdict/Alternative:**
      *   Is there a solution? A perfect, non-circular logical solution is likely impossible (Whelan is right about the logic).
      *   However, a *pragmatic/normative* solution is possible.
      *   ASP is generally superior for *political* justice because it links rights to specific obligations and enforcement mechanisms. AAI is better for *moral* consideration but fails as a institutional design principle.
      *   *Refinement:* Perhaps a "All-Subjected-to-Coercion" view needs to be dynamic. Abizadeh argues borders themselves are coercive, so they need democratic justification. This tries to close the circle.
      *   *My Stance:* Whelan is logically correct that *pure* democratic procedure cannot generate its own boundaries. However, ASP comes closest to a principled solution because it ties the demos to the specific mechanism (coercion) that makes democracy necessary in the first place. AAI fails because it severs the link between decision-making and enforcement.
      *   *Wait, let's look closer at the "Relocation" charge.*
          *   AAI: Relocates to "causal significance."
          *   ASP: Relocates to "jurisdictional fact."
          *   Is one less circular? ASP relies on an empirical fact (are you coerced?), whereas AAI relies on a counterfactual/causal judgment (would you be affected?). Empirical facts are easier to adjudicate without a prior demos.
      *   *Verdict:* The boundary problem is insoluble as a *logical* paradox within pure proceduralism (Whelan wins there). But as a *normative* problem, ASP is superior. I should argue that the "solution" isn't escaping circularity entirely, but grounding the boundary in the *purpose* of democracy (protecting autonomy against coercion).

  7.  **Drafting - Section by Section:**
      *   **Introduction:** Define Whelan's paradox. Introduce AAI and ASP. Thesis: Whelan is right that procedural circularity is inescapable, but wrong that this renders the problem normatively insoluble. ASP offers a more robust normative anchor than AAI, though it too requires antecedent judgments.
      *   **Whelan's Challenge:** Explain the "who decides who decides" regress. The need for an external criterion.
      *   **Assessing AAI:** Goodin's version. The "butterfly effect" problem. It dissolves boundaries rather than solving them. Relocates circularity to defining "relevant interests."
      *   **Assessing ASP:** Abizadeh/Owen. Coercion as the trigger. Strength: Connects to autonomy. Weakness: Presupposes the scope of coercion (the border). Relocates circularity to defining the jurisdiction.
      *   **Comparison:** AAI is too indeterminate; ASP is too reified. However, ASP aligns better with the *function* of the state.
      *   **Verdict/Synthesis:** Whelan is right about logic, wrong about normativity. We can't escape the need for a pre-democratic stipulation. ASP is the best stipulation because it matches the *reason* we need democracy (to legitimate coercion). AAI is a moral ideal, not a constitutional principle.
      *   **Conclusion:** Summarize. The boundary problem isn't "solved" like a math equation, but managed through the normative priority of anti-coercion.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address whether they *escape* circularity?
      *   *Correction:* I need to be clear. Neither *escapes* it logically. Both *relocate* it to a normative premise. The essay should argue that relocating it to a normative premise is the only way to "solve" it practically.
      *   *Nuance on ASP:* Abizadeh actually argues that *border control* is coercive, so the demos must include those excluded. This is a radical version of ASP. I should mention this as it attempts to tackle the boundary itself.
      *   *Nuance on AAI:* Distinguish between "actually affected" and "possibly affected." Goodin leans toward the latter.
      *   *Final Verdict:* I will argue that ASP is the superior *political* principle, even if it doesn't solve the metaphysical circularity. It transforms the problem from "who decides" to "who is forced."

  9.  **Final Polish:** Check tone, flow, and ensure all parts of the prompt are answered. (Whelan's claim, AAI analysis, ASP analysis, Relocation vs. Escape, Definite Verdict).

  *(Self-Correction on the Verdict)*: The prompt asks if the problem admits of a *principled* solution. I should argue "Yes, but..." It admits of a normative solution, not a procedural one. ASP is that solution.

  10. **Writing the Essay.** (Proceed to generate output based on these thoughts).
answer: |-
  **The Paradox of the People: Assessing the Boundary Problem in Democratic Theory**

  Frederick Whelan's formulation of the "boundary problem" presents a formidable challenge to democratic theory: no democratic procedure can determine its own membership without presupposing the very membership it seeks to define. To vote on who gets to vote is to already assume a group entitled to make that decision. Whelan concludes that this circularity is insoluble within democratic theory, necessitating an external, non-democratic criterion to fix the boundaries of the *demos*. In response, normative theorists have proposed two primary candidates for this external criterion: Robert Goodin's All-Affected-Interests (AAI) principle and the All-Subjected-Principle (ASP) advanced by scholars such as Arash Abizadeh and David Owen. This essay assesses whether either principle genuinely escapes Whelan's circularity or merely relocates it. It argues that while neither principle escapes the logical regress Whelan identifies, the ASP offers a more robust principled solution by grounding the *demos* in the specific normative problem—coercion—that democracy is designed to resolve, whereas AAI dissolves the boundary entirely, rendering it politically unworkable.

  Whelan's critique rests on the distinction between procedural and normative justification. Procedurally, democracy requires a rule of recognition for its participants. If that rule is determined democratically, we face an infinite regress (who decides the rules for deciding the participants?). Whelan argues that because this cannot be solved internally, the boundary is historically contingent or imposed by force, not democratic right. However, proponents of AAI and ASP accept Whelan's premise that the criterion must be external to the procedure but reject his conclusion that it must be arbitrary. They argue that moral principles can fix the boundary normatively, even if not procedurally. The question is whether these principles can be applied without smuggling in the very boundaries they seek to justify.

  Robert Goodin's All-Affected-Interests principle posits that anyone whose interests are causally affected by a decision should have a say in making it. On the surface, this appears to bypass Whelan's circularity by relying on an empirical fact (causal impact) rather than a political decision. However, AAI merely relocates the circularity from the *voter* to the *causal chain*. To apply AAI, one must first determine which consequences count as "affecting interests." In a globally interconnected world, almost any consequential decision ripples outward; a zoning law in Ohio might affect carbon emissions affecting a farmer in Bangladesh. Goodin acknowledges this, conceding that AAI tends toward enfranchising the whole of humanity for almost any significant decision.

  This creates a dilemma. If AAI is applied strictly, it dissolves the concept of a bounded *demos* altogether, demanding a global plebiscite for local decisions, which is institutionally impossible. If AAI is applied loosely—restricting "affect" to "significant" or "direct" impact—it requires an antecedent criterion to distinguish significant from trivial effects. Who determines significance? If the existing *demos* decides, Whelan's circularity returns. If an external authority decides, we have replaced democratic self-determination with technocratic or moral arbiters. Thus, AAI does not escape the boundary problem; it obscures it behind a utilitarian calculus that lacks the institutional specificity to define a political community. It solves the moral problem of inclusion at the cost of the political problem of agency.

  In contrast, the All-Subjected-Principle (ASP) grounds the *demos* in subjection to coercive law. Arash Abizadeh and David Owen argue that because state power is coercive, its legitimacy requires that all those subject to that coercion participate in its authorship. This principle aligns democracy with the protection of autonomy: those bound by the law must be its authors. ASP appears to avoid the indeterminacy of AAI because coercion is an institutional fact. One is either legally subject to a jurisdiction or one is not.

  However, ASP also faces the charge of relocated circularity. To know who is "subjected," one must know the jurisdictional scope of the polity. But the scope of jurisdiction is determined by borders, and borders are themselves coercive mechanisms (e.g., immigration control). As Abizadeh himself notes, if border controls are coercive, then those excluded by the border are "subjected" to that coercion and should arguably be part of the *demos* that sets the border. This creates a tension: if the *demos* is defined by existing borders, ASP reifies the status quo and ignores the coercive nature of exclusion. If the *demos* includes those potentially subjected (including outsiders), we return to the indeterminacy of AAI.

  Nevertheless, ASP handles Whelan's challenge better than AAI because it ties the boundary to the *function* of the state. Whelan argues the boundary must be fixed by an external criterion. ASP provides a normative criterion that is internal to the *purpose* of democracy, even if it is external to the *procedure*. Democracy is not merely about aggregating preferences (as AAI implies); it is about legitimating force. Therefore, the boundary of the *demos* should track the boundary of enforcement. While determining the exact scope of coercion requires judgment, it is a judgment about legal status and enforcement capacity, which are more empirically tractable than causal interest chains. ASP relocates the circularity from "who decides" to "where does coercion end," but the latter is a question of legal fact and institutional capacity, whereas the former is a question of infinite causal regression.

  Furthermore, ASP offers a mechanism for dynamic boundary adjustment that AAI lacks. If a polity begins to exercise coercive power over a new group (e.g., through annexation or extended policing), ASP dictates that the *demos* must expand to include them to maintain legitimacy. AAI, by contrast, offers no clear threshold for when "affected interests" become strong enough to warrant membership. ASP thus provides a principled feedback loop: the exercise of coercion triggers the demand for inclusion. This does not logically escape Whelan's paradox—one still needs a prior understanding of what constitutes the "polity" exerting coercion—but it minimizes the arbitrariness of the boundary by tethering it to the specific moral wrong (unauthorized coercion) that democracy is meant to prevent.

  Ultimately, Whelan is logically correct that no democratic procedure can generate its own boundaries *ex nihilo*. The boundary problem admits of no purely procedural solution. However, he is mistaken in implying that this renders the problem normatively insoluble. A principled solution is possible if we accept that the boundary is a pre-democratic normative stipulation rather than a democratic output. Between the two candidates, ASP comes closest to providing this solution. AAI fails because it conflates moral consideration with political membership, leading to an unworkable universalism that cannot sustain a specific agency for decision-making. ASP succeeds because it recognizes that political membership is distinct from moral standing; it is specifically about the relationship between the individual and the coercive apparatus of the state.

  Therefore, the verdict is that the boundary problem is insoluble as a logical puzzle but solvable as a normative design challenge. The solution lies not in escaping circularity, but in anchoring the circle in the right place. ASP anchors the *demos* to the scope of coercion, which is the necessary condition for the need for democracy in the first place. While it requires an antecedent account of jurisdiction, this account is grounded in the empirical reality of enforcement rather than the speculative reality of causal impact. Consequently, the All-Subjected-Principle, properly understood as a dynamic requirement to match membership with coercive reach, offers the most defensible principled resolution to Whelan's paradox, transforming the boundary from an arbitrary line in the sand into a limit of legitimate force.
