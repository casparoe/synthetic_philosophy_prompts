answer: |-
  Your gut is absolutely right. Diego is looking at only half of the math, and while he isn't lying, he's missing the most important part of the equation.

  Here is the breakdown of why **Option 2 is significantly better for both you and Diego**, even though the raw percentage of "you having to work" stays the same.

  ### Where Diego is Right
  Diego is correct about the **marginal probability**.
  *   **Option 1:** You have a 50% chance of working.
  *   **Option 2:** You have a 50% chance of working.

  If the *only* thing that mattered was a binary "Do I have to show up or not?", he would be right. It wouldn't matter.

  ### Where Diego is Wrong
  Diego is ignoring the **joint outcomes**. He is treating the two events as if they are linked (zero-sum), but in Option 2, they are independent. This creates four possible scenarios in Option 2, compared to only two in Option 1.

  **Option 1 (The Coin Flip):**
  1.  **You Close (50%):** You suffer the bad shift alone.
  2.  **Diego Closes (50%):** You go home free.
  *   *Result:* One of you is guaranteed to suffer alone. The manager never closes.

  **Option 2 (The App):**
  Because the numbers are generated separately, there are four equally likely outcomes (25% each):
  1.  **You get flagged, Diego doesn't (25%):** You close alone.
  2.  **Diego gets flagged, You don't (25%):** You go home free.
  3.  **Both get flagged (25%):** You **split** the shift.
  4.  **Neither gets flagged (25%):** The **Manager closes**.

  ### Why Option 2 is Better for You
  Let's look at the quality of the outcomes, not just the frequency.

  **1. The "Misery Loves Company" Factor**
  In Option 1, if you lose the coin flip, you are doing the shift alone.
  In Option 2, if you get flagged to work, there is a **50% chance Diego is flagged too.**
  *   In Option 1, 100% of the shifts you work are solo.
  *   In Option 2, only 50% of the shifts you work are solo; the other half are split.
  Splitting a terrible New Year's Eve close is infinitely better than doing it alone.

  **2. The "Get Out of Jail Free" Card**
  In Option 1, there is a 0% chance the manager closes. It *must* be one of you.
  In Option 2, there is a **25% chance the manager closes it herself.**
  This is a massive win. In Option 2, there is a scenario where the burden disappears entirely for both of you. In Option 1, the burden is guaranteed to land on one of your shoulders.

  **3. Reducing the "Sucker" Risk**
  In Option 1, there is a 50% chance you are the "sucker" (you work, he doesn't).
  In Option 2, there is only a 25% chance you are the "sucker" (you work, he doesn't).
  The other 25% of the time you work, you aren't the sucker; you're a teammate sharing the load.

  ### The Verdict
  Diego is thinking about **risk** (Will I work?), but you are intuitively thinking about **utility** (How bad will it be if I work?).

  *   **Option 1 Expected Value:** 50% chance of Solo Suffering.
  *   **Option 2 Expected Value:** 25% chance of Solo Suffering + 25% chance of Shared Suffering + 25% chance of Manager Suffering.

  Option 2 is strictly better for both employees. It reduces the chance of you working alone by half, and it introduces a chance that neither of you has to work at all.

  **Recommendation:** Tell Diego you did the math. Explain that while the odds of *working* are the same, the odds of *working alone* are cut in half with the app, plus there's a chance the manager takes the shift. If he cares about his own comfort, he should agree to Option 2 immediately.
