prompt: |-
  So at my job I spend a lot of time with proper scoring rules like Brier score and log loss, mostly to check if our model's probability outputs are well calibrated. Last week I fell down a rabbit hole and found out philosophers use the same math in something called 'accuracy-first epistemology' (or 'epistemic utility theory'? not sure those are exactly the same) to argue you're flat out irrational if your credences don't obey the probability axioms. Apparently a guy named Jim Joyce showed back in the 90s that incoherent credences are always 'dominated' by some coherent alternative — guaranteed to be at least as accurate no matter how things turn out, and strictly better in at least one case. Can you compare how scoring rules function in the ML/forecasting world vs how they're used to make that epistemology argument? I'm mainly curious whether 'strictly proper' is doing the same job in both places, and whether the philosophical argument actually holds up or if its kind of rigged since the philosophers get to decide upfront which scoring rules even count as legit measures of accuracy.
