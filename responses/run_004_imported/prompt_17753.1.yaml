  7.  **Final Polish:** Ensure tone is academic but accessible, suitable for a philosophy elective context. Use terms like *nafs*, *huduri*, *'aql*. (Self-correction: Make sure not to conflate Avicenna with Descartes too much; keep the focus on Avicenna's specific metaphysics of the soul as the "perfection of the body" but distinct in essence.)

  8.  **Final Output Structure:**
