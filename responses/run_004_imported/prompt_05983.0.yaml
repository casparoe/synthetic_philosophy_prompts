answer: |-
  This is one of the sharpest and most enduring objections to Kant's moral philosophy. You have put your finger on the precise pressure point where Kant's "pure formalism" seems to buckle under the weight of human reality.

  The suspicion that the "Contradiction in the Will" (CW) test smuggles in substantive, empirical premises is not just a modern worry; it was raised by Schopenhauer and Hegel in Kant's own aftermath. To answer your question, we need to dissect what Kant thinks is doing the argumentative work in CW cases, look at how sophisticated interpreters defend it, and honestly assess whether the "formalism" charge sticks.

  ### 1. What is the Argumentative Work in "Contradiction in the Will"?

  In the Contradiction in Conception (CC) test (false promises), the contradiction is **external** to the agent's psychology. The world described by the universalized maxim creates a logical or practical impossibility (the institution of promising vanishes).

  In the Contradiction in the Will (CW) test (non-beneficence), the contradiction is **internal** to the agent's volition. The world is *conceivable*; a world of stoic isolation is logically possible. So, what generates the contradiction?

  Kant's argument relies on a specific claim about the structure of a **finite rational will**.
  1.  **The Necessary End:** Kant argues that while specific desires are contingent, every finite rational being necessarily wills their own **happiness** (understood as the sum total of satisfied inclinations) and the **perfection of their faculties**. This is not an empirical generalization ("people happen to want things") but an *a priori* claim about what it means to be a finite rational agent. We are dependent beings.
  2.  **The Volitional Conflict:** If I universalize the maxim "I will never help others," I am legislating a world where help is unavailable.
  3.  **The Contradiction:** Since I necessarily will my own happiness (premise 1), and since my happiness may depend on the love and aid of others (empirical fact of finitude), I cannot consistently will a law that makes that aid impossible. To will the law is to will the removal of means I necessarily require for ends I necessarily have.

  **So, what is doing the work?**
  It is the **incoherence of the system of ends**. Kant is arguing that a rational will must be coherent. If you will an end (your own well-being/agency), you are rationally committed to willing the necessary means to that end. A universal law of non-beneficence cuts off the necessary means. Therefore, a rational being *cannot* will it without contradicting their own status as a rational pursuer of ends.

  ### 2. The Charge of Smuggling Substantive Premises

  Your suspicion is that premise #1 (that we necessarily will our own happiness/perfection) and the empirical fact of vulnerability are "substantive premises" that violate the purity of the Categorical Imperative.

  **The Critic's View (Schopenhauer/Hegel):**
  Schopenhauer famously argued that Kant is surreptitiously relying on the very moral intuition he claims to derive. Kant assumes we *ought* to care about our future needs or the conditions of our agency. But why? If I am a stoic who genuinely wills to need nothing, the CW test fails. Schopenhauer argued that Kant is actually relying on a hidden premise: "You ought to care about your own welfare and the welfare of others." That is a substantive ethical claim, not a formal logical one.

  **Kant's Defense (The "Finite Rational Being" Move):**
  Kant would reply that he is not making a moral claim about what you *should* value, but an anthropological-transcendental claim about what you *do* value by virtue of being the kind of being you are.
  *   **Formal vs. Material:** The test is still formal because it doesn't prescribe *which* specific ends you must have (e.g., "you must want to be a painter"). It only prescribes that whatever ends you have as a finite being, your will must be coherent regarding them.
  *   **A Priori Anthropology:** Kant distinguishes between "practical anthropology" (empirical) and the "metaphysics of morals" (a priori). He claims the fact that rational beings have "needs" is a necessary feature of finite rationality, not a contingent biological fact. Therefore, building it into the test doesn't make the test empirical.

  ### 3. How Interpreters Defend the CW Test

  Contemporary Kantians have tried to shore up this defense, moving away from "happiness" (which looks too empirical) toward "agency."

  **Christine Korsgaard (The Constructivist Defense):**
  Korsgaard argues that the CW test works because of the **value of humanity**. To act on a maxim at all, I must value my own rational nature (my capacity to set ends). If I value my own rational nature, I must value the conditions necessary for its existence and flourishing.
  *   *The Argument:* I cannot value my own agency while simultaneously willing a world that undermines the conditions of agency (for myself and others). Non-beneficence undermines the conditions of agency. Therefore, I cannot will it.
  *   *Does this solve the problem?* It makes the premise less about "needing help to be happy" and more about "needing help to remain an agent." However, critics still argue this relies on a substantive claim: *that we must value our agency.*

  **Onora O'Neill (The Followability Defense):**
  O'Neill suggests we look at what it means to "follow a law." A principle that cannot be *followed* by all agents cannot be a law.
  *   In CC cases, the action becomes impossible.
  *   In CW cases, the *adoption of the principle* becomes impossible for a community of agents. If everyone adopts "no help," the community of agents collapses into a state where agency is severely compromised. A law that destroys the possibility of being a law-following agent is self-defeating.

  **Andrew Reath (The System of Ends):**
  Reath argues that the CW test reveals a contradiction in the **legislation of a kingdom of ends**. A rational will legislates for a community of rational wills. If I legislate a law that harms the capacity of other members to pursue their ends, I am undermining the very community I am legislating for. The contradiction is between willing a law and willing the existence of the legislative community.

  ### 4. Is the Reply Convincing?

  Here is the hard truth: **It depends on how much "thickness" you allow in Kant's conception of rationality.**

  **If you demand strict logical formalism:**
  The CW test fails. Pure logic alone cannot generate a duty of beneficence. You can conceive of a world of isolated monads without logical contradiction. To get the duty, you *must* add a premise about what rational agents need or value. If that premise is empirical (human vulnerability), the Categorical Imperative is not purely a priori.

  **If you accept Kant's "Metaphysics of Morals":**
  The test succeeds. Kant is not doing logic; he is doing **practical philosophy**. He argues that "rationality" isn't just a logic engine; it is a mode of existence. To be a finite rational being *just is* to be vulnerable and dependent on others for the realization of your ends. Therefore, acknowledging this vulnerability isn't an empirical "add-on"; it is part of the definition of the agent performing the test.

  **The Best Synthesis:**
  Many modern interpreters (like Barbara Herman and Paul Guyer) suggest that the Formula of Universal Law (FUL) is not meant to work in a vacuum. It is meant to screen maxims against the background of a **theory of rational agency**.
  *   The "formalism" of Kant's ethics lies in the *procedure* (could everyone do this?), not in the total absence of premises about human nature.
  *   The CW test reveals that some maxims are incompatible with the **sustained existence of rational agency**.

  ### Conclusion

  Your suspicion is well-founded. The Contradiction in the Will test does rely on a substantive premise: **that rational agents necessarily will the conditions of their own agency and well-being.**

  *   **Is it smuggling?** If you view the Categorical Imperative as a machine that generates morality from *nothing but logic*, then yes, it is smuggling.
  *   **Is it a bug?** Kantians argue no. They argue that morality *must* be grounded in the nature of rational agency. If the test reveals that non-beneficence is incompatible with the nature of rational agency, it has done its job.

  The most convincing reply to your worry is to admit that the "formality" of Kant's ethics is often overstated. The Categorical Imperative is a formal *constraint* on maxims, but it operates on a material *conception of the agent*. The CW test works not because of pure logic, but because it exposes a **teleological contradiction**: you cannot will a world that makes impossible the very ends that your nature as a finite rational being compels you to pursue.

  Whether that counts as "pure" morality or "disguised prudence" (as Schopenhauer charged) remains the central fault line in Kant scholarship. But the strongest defense is that it is neither: it is a claim about the **integrity of the will**. A will that legislates against its own necessary conditions is not just imprudent; it is fragmented, and thus not fully rational.
