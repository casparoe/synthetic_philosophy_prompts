          *   CW: The maxim is conceivable as a law of nature, but the agent cannot *will* it without contradicting their own will. -> Imperfect Duties.
      *   *The "Will" in CW:* What is being contradicted? It's not a logical contradiction. It's a teleological or volitional contradiction.
      *   *The "Substantive Premise":* The claim is that rational agents necessarily will certain ends (their own happiness/perfection). If I will a world where no one helps me, but I necessarily will my own happiness (which sometimes requires help), I contradict myself.

