          *   *Philosophical Pivot:* The "Transmission Hypothesis" vs. "Production Hypothesis." This is crucial for a scientist. Radio analogy (brain as receiver vs. generator).
      *   **Defining "Survival":** This is the user's specific question. What does it mean?
          *   *Dualism:* Soul stuff separates. (Hard to define scientifically).
          *   *Pattern Identity:* Information persists. (Hard to reconcile with entropy).
          *   *Phenomenological:* The *feeling* of continuity is what matters.
      *   **The Verification Problem:** How to tell the difference?
          *   Veridical Perception (OBE seeing things they couldn't know). Mention the AWARE study (mixed results).
          *   Coherence/Consistency.
          *   The "Hard Problem" loophole: Materialism can't fully explain consciousness *anyway*, so the NDE doesn't necessarily break materialism more than waking life does.
      *   **Reconciling the Identity:** You don't have to choose between "Stubborn Materialist" and "Believer."
          *   *Epistemic Humility:* "I don't know" is a valid scientific position.
