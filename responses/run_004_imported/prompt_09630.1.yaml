answer: |-
  Good evening. For those who don't know me, I'm [Sister]'s sibling. I've been asked to say a few words about the couple, which is a unique challenge. Usually, a toast is a time to say that a couple *deserves* each other, or that finding one another was the *right* thing, or that they are *perfect* for one another. But since my sister is here, and she is who she is, I have to be careful. I am told that claiming objective moral facts exist is a mistake, and claiming we can pretend they exist is dishonest. So, I will stick to what I can observe.

  I have watched [Sister] and [Groom] together for several years. [Groom], you are a moral realist. You believe the love you share is a feature of the universe as solid as gravity. [Sister], you believe moral properties are not part of the fabric of reality. You believe the universe is indifferent. Yet, you both agree on the data: you prioritize each other's welfare, you coordinate your plans, and you report high levels of satisfaction with the arrangement.

  There is a specific argument in metaethics concerning the "queerness" of objective values—the idea that if moral facts existed, they would be entities too strange to fit into a naturalistic world. Looking at the two of you, I understand why one might be tempted to posit them, even if one is mistaken. You make the hypothesis tempting.

  To the rest of the family: this means that while my sister may not believe their marriage is *blessed by the cosmos*, she does believe it is *real*. She observes [Groom] acting with consistency, kindness, and attention. She sees that he makes her laugh, and that she makes him think. These are not moral facts; they are psychological and behavioral facts. And they are robust.

  I know that for many of you, a wedding is about affirming what is *good*. For my sister, today is about affirming what is *true*. And the truth is that they have chosen to bind their lives together. They have committed to a shared project. They have invited us here to witness that commitment.

  I am not going to tell you that they *should* stay together, because "should" implies a command from the universe. I will say that I observe their commitment, I appreciate their company, and I am glad to be here to mark this transition.

  So, please raise your glasses. I invite you to join me in acknowledging the two people standing here, and the life they are constructing.

  To [Sister] and [Groom], and to the days ahead.
