          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem equally well (arbitrariness).
          5.  These facts are *common knowledge* (or common belief).
      *   **Key Feature:** Coordination of *interests*. Everyone wants the same outcome (e.g., not crashing, successful communication). It's not a Prisoner's Dilemma or a zero-sum game.
      *   **"Languages and Language" (1975):** Lewis extends this to language itself. Using a language $\mathcal{L}$ is a convention of truthfulness and trust. I utter sounds expecting you to interpret them according to $\mathcal{L}$, and you do so because we both want to communicate.

  3.  **Evaluate the "AI Word Avoidance" against Lewis's Criteria:**

      *   *Regularity:* Yes, people are avoiding "delve," etc.
