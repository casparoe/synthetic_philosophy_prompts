answer: |-
  David Lewis would likely find your observation fascinating, not because it breaks his theory, but because it stress-tests the boundary between a **convention** (coordination based on mutual expectation) and a **norm** (regularity enforced by sanction), all within a rapidly shifting signaling environment.

  If we reconstruct his analysis strictly from the apparatus in *Convention* (1969) and "Languages and Language" (1975), he would probably argue that this behavior **qualifies as a convention in the technical sense**, but one that is currently **pathological** or **unstable** due to the failure of *precedent* to solidify. He would likely reject the idea that the adversarial element disqualifies it, provided we correctly identify the players in the coordination game.

  Here is how Lewis would likely analyze the situation, broken down by the criteria of his theory.

  ### 1. The Coordination Problem vs. The Adversarial Element
  Your seminar colleagues argued that the adversarial nature of AI detection rules out Lewis's framework, which relies on "coincidence of interest" (e.g., we both want to avoid crashing). They view this as a conflict: writers want to pass, detectors want to catch.

  Lewis would likely correct this framing. For a linguistic convention to exist, the coordination game is not between **Writer vs. Detector**, but between **Writer vs. Reader**.
  *   **Coincidence of Interest:** Both the writer and the human reader want the communication to succeed *and* for the text to be trusted as human. If the reader suspects AI, trust degrades; if the writer is accused of AI, reputation degrades. Both parties lose if the signal fails.
  *   **The Adversary as Noise:** Lewis would treat the AI (and the detectors) as external noise disrupting the channel, similar to static on a telephone line. The convention is the human community's coordinated effort to filter that noise. As long as humans coordinate *with each other* to maintain a boundary against the non-human, the internal dynamic remains coordinative.

  Therefore, the adversarial element does not disqualify it. It merely makes the *content* of the convention contingent on an external variable (the AI's current capabilities).

  ### 2. Applying the Five Criteria of *Convention*
  Lewis defines a convention as a regularity $R$ in a population $P$ in a situation $S$ where:
  1.  **Regularity:** Everyone avoids "delve." (True, increasingly so).
  2.  **Expectation:** Everyone expects everyone else to avoid "delve." (True among your colleagues).
  3.  **Conditional Preference:** Everyone prefers to avoid "delve" *on condition that* others do. (True. If no one cared about "delve," you wouldn't avoid it. You avoid it specifically because you expect readers to penalize it).
  4.  **Arbitrariness:** There is an alternative regularity $R'$ that could have solved the problem. (True. We could have decided "delve" is the mark of a human and "explore" is the mark of AI. The specific word is irrelevant; only the consensus matters).
  5.  **Common Knowledge:** The facts above are known by all, known to be known, etc. (This is the fragile point).

  Lewis would argue this fits the definition of a **signaling convention**. It is arbitrary (any word could be the shibboleth) and self-enforcing (I avoid it because I expect you to judge me).

  ### 3. The Problem of Precedent and Stability
  This is where Lewis would offer his sharpest critique. In *Convention*, Lewis emphasizes that conventions are sustained by **precedent**. We drive on the right today because we drove on the right yesterday, and we expect to do so tomorrow. Precedent creates the stability that allows common knowledge to form.

  Your case involves a **moving target**.
  *   **The Flux:** If the list of suspect words shifts every few months as models update, there is no stable *recurrent situation*. Lewis requires situation $S$ to recur. If $S$ changes fundamentally (i.e., "delve" is safe, then "delve" is toxic, then "delve" is safe again), the precedent cannot crystallize.
  *   **Lewis's Prediction:** Lewis would predict that this cannot settle into a stable convention *until the technology stabilizes*. A convention requires that the cost of switching to an alternative regularity ($R'$) outweighs the benefit. Currently, the benefit of switching (dodging the latest detector) is high, and the cost is low (pick a new synonym).
  *   **Verdict:** He would classify this not as a settled convention, but as a **transient regularity** or a **panic equilibrium**. It has the *structure* of a convention but lacks the *temporal depth* required for true common knowledge. Everyone knows *now* that "delve" is suspect, but no one knows that everyone will know this *next year*. Without that second-order expectation over time, it remains fragile.

  ### 4. "Languages and Language": Truthfulness and Trust
  In his later work, Lewis argues that using a language is a convention of **truthfulness and trust**. I utter sounds expecting you to believe them; you interpret them expecting me to be truthful. This equilibrium holds because we both want to communicate.

  AI disrupts this by decoupling *utterance* from *belief*. An AI is neither truthful nor untruthful; it is synthetic.
  *   **The Meta-Convention:** Lewis would view your colleagues' word-avoidance as a **meta-linguistic convention** designed to restore the presumption of truthfulness. By avoiding "AI words," writers are signaling, "I am a participant in the human convention of truthfulness."
  *   **The Sanction:** You mentioned colleagues "accusing" one another. Lewis distinguishes conventions from norms by the presence of sanctions. Conventions are self-enforcing (I drive on the right because I don't want to crash); norms are enforced by punishment (I don't steal because I'll be jailed).
  *   **The Shift:** Because this behavior is driven by the fear of *accusation* (a social sanction) rather than just communication failure, Lewis might argue this is drifting from a pure *convention* toward a **social norm**. However, since the sanction (loss of credibility) stems from the breakdown of the communication trust itself, he would likely keep it within the broader family of linguistic conventions.

  ### 5. What Would Have to Be True?
  For Lewis to classify this as a fully settled convention, the following would need to hold:
  1.  **Stable Common Knowledge:** It must be common knowledge not just that "delve" is avoided, but that this avoidance is expected to persist. (Currently, people avoid it *tentatively*, expecting the rule might change).
  2.  **Arbitrariness Confirmation:** The community must recognize that avoiding "delve" is arbitrary. If people start believing "delve" is *inherently* bad writing (rather than just AI-coded), it ceases to be a convention and becomes a belief about quality. Lewis would warn against this reification.
  3.  **Coordination Equilibrium:** Writers must prefer avoiding the word *given that others do*, not just because they fear punishment. Currently, many writers (like you) prefer *not* to avoid it if the accusation risk were removed. This suggests the preference is not yet fully internalized as a coordination equilibrium.

  ### Conclusion: Lewis's Forecast
  Lewis would likely tell you that you are witnessing the **birth pangs of a convention that may never be born.**

  Because the "adversary" (the AI) is adaptive, the "solution" (the banned word list) cannot achieve the stability required for precedent. Lewisian conventions rely on inertia; your situation relies on agility. He would predict that this vocabulary-avoidance will either:
  1.  **Dissolve:** Once AI can perfectly mimic "human" quirks (including avoiding "delve"), the signal becomes useless, and the convention collapses.
  2.  **Ossify:** If AI writing styles plateau, the list of banned words will stop changing, common knowledge will solidify, and it will become a true Lewisian convention (like driving on the right).

  Until then, he would classify it as a **signaling regularity in a state of flux**—technically a convention in structure, but functionally a race without a finish line. The strangeness you feel is the cognitive dissonance of trying to establish a precedent in an environment designed to invalidate precedent. Lewis would say the fault lies not in your analysis, but in the instability of the coordination problem itself.
