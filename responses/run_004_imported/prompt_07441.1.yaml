answer: |-
  This is a compelling scene, but to make the theology sound authentic, you need to navigate a famous tension in Aquinas's political thought. If your friar simply states, "Aquinas says any subject may kill a tyrant," a knowledgeable reader might spot the inaccuracy. Aquinas is famously cautious about private individuals taking the law into their own hands.

  However, there *is* a specific Thomistic loophole your friar can exploit to make the argument work. Aquinas distinguishes between a ruler who **becomes** a tyrant (legitimate title, bad rule) and a ruler who **seizes** power unjustly (usurper). He is also willing to argue that a ruler who rules solely for private advantage forfeits the nature of authority itself.

  Here are the specific texts, distinctions, and Latin turns of phrase your friar should use to sound authentic.

  ### 1. The Primary Text: *Commentary on the Sentences*
  **Reference:** *In II Sententiarum*, distinctio 44, quaestio 2, articulus 2.

  This is the strongest textual support for your friar's position. In this earlier work, Aquinas is more radical than in his later *Summa*. He discusses whether it is lawful to kill a tyrant.

  *   **The Argument:** Aquinas writes that if a ruler seizes power by violence (*per violentiam*) or without a just title, he is not a true ruler but a brigand. In this case, **any private person** may kill him to liberate the fatherland.
  *   **The Phrase:** *"Tyrannum occidere... est laudabile et meritorium."* ("To kill a tyrant... is praiseworthy and meritorious.")
  *   **How the Friar Uses It:** The friar should argue that the *signore*, by ruling for private gain, has effectively **usurped** the authority of the city. He is no longer a *princeps* (leader) but a *praedo* (bandit). Therefore, killing him is not regicide; it is the execution of a criminal.

  ### 2. The Political Text: *De Regno (On Kingship)*
  **Reference:** Book I, Chapter 6.

  This is Aquinas's dedicated treatise on political rule. While here he generally warns against private assassination (fearing it leads to worse instability), he provides the philosophical definition of tyranny your friar needs.

  *   **The Argument:** Aquinas argues that a ruler who seeks his own good rather than the *bonum commune* (common good) creates a regime that is not just unjust, but **unnatural**. He explicitly states that removing such a ruler is **not sedition** (*non est seditio*), because the tyrant is the one who sows discord among the people.
  *   **The Phrase:** *"Non est seditio turbare huiusmodi regimen."* ("It is not sedition to disturb a regime of this kind.")
  *   **The Phrase:** *"Quia magis ipse tyrannus seditionem committit."* ("Because the tyrant himself is the one committing sedition.")
  *   **How the Friar Uses It:** The friar can argue that the *signore* has already declared war on the city. The conspirators are not starting a fight; they are ending one. They are not *seditiosi* (seditious men); they are *vindices* (avengers/defenders).

  ### 3. The Moral Text: *Summa Theologiae*
  **Reference:** II-II, Question 42, Article 2 (On Sedition) & Question 64, Article 3 (On Killing Sinners).

  *   **The Argument:** In Q. 42, Aquinas defines sedition as opposing the unity and peace of the multitude. If the ruler destroys that unity, opposing him preserves peace. In Q. 64, he argues that killing is permissible if done by public authority for the common good.
  *   **The Loophole:** The friar must argue that in a city-state, when the "public authority" is corrupted, the authority **devolves to the people** (or their representatives).
  *   **The Phrase:** *"Bonum commune est divinius quam bonum unius."* ("The common good is more divine than the good of one individual.")
  *   **How the Friar Uses It:** This elevates the assassination from a crime to a sacrifice. The *signore* is one limb that is gangrenous; to save the body (the city), the limb must be cut off.

  ### Suggested Dialogue Strategy for Authenticity

  To make the friar sound like a Dominican scholastic rather than a modern revolutionary, have him acknowledge the risk before dismissing it. Aquinas was a logician; he dealt in distinctions.

  **Drafting Suggestion:**
  > "You fear the stain of blood, my sons. You fear the charge of *seditio*. But listen to the Angelic Doctor. He teaches us that authority is not a sword to be wielded for private lust, but a trust for the *bonum commune*. When a ruler trades the peace of the city for his own gold, he ceases to be a *rector* and becomes a *tyrannus*.
  >
  > "Aquinas asks: Is it lawful to kill such a man? In his *Commentary on the Sentences*, he answers: If he holds power by injustice, he is no ruler at all. To strike him down is not murder, for he has already severed the bond of loyalty. As Thomas says: *'Non est seditio turbare huiusmodi regimen.'* It is not sedition to topple such a regime. For who is the true seditious man? The one who kills the wolf, or the wolf who devours the flock? The *signore* has made war on us first. We are not assassins. We are the public sword, returned to its rightful hand."

  ### Key Latin Terminology to Sprinkle In
  *   ***Tyrannus in exercitio*** vs. ***Tyrannus in titulo***: A tyrant by exercise (bad rule) vs. a tyrant by title (usurper). The friar should argue the *signore* is both.
  *   ***Hostis Publicus***: Public enemy. This legal term removes the protection of law from the target.
  *   ***Defensio***: Defense. Frame the killing as defensive, not aggressive.
  *   ***Salus Populi***: The welfare/safety of the people. The supreme law.

  ### A Note on Historical Nuance
  If you want to add a layer of depth, you could have one of the conspirators object using Aquinas's *later* caution from *De Regno* (where Thomas warns that killing a tyrant often leads to worse tyranny). The friar can then counter that *inaction* in the face of grave sin is itself a sin of omission. This shows the friar knows the theology deeply and has chosen the "harder" path deliberately.

  This approach keeps the theology rigorous while serving the dramatic needs of your coup.
