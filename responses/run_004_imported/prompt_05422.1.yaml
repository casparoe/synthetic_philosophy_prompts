answer: |-
  You are not missing a move. You have put your finger on the exact spot where centuries of commentators have spilled ink arguing over whether Aristotle is a proto-Marxist, a proto-neoclassical economist, or just confused.

  The short answer is: **Yes, there is a seam.** Aristotle is trying to bridge two different categories of reality (ethical/social need vs. mathematical quantification) and he knows the bridge is shaky. He admits it explicitly in the line: *"Now in truth it is impossible that things differing so much should become commensurate."*

  For a character like Marek, this isn't a bug; it's the whole point. Here is the line-by-line logic walk-through you asked for, breaking down where the argument holds, where it pivots, and where the "gap" lies, specifically tailored to help you write Marek's internal monologue.

  ### 1. The Setup: Inequality requires Equation
  > *"For it is not two doctors that associate for exchange, but a doctor and a farmer... but these must be equated."*

  **The Logic:** Exchange doesn't happen between equals (I don't trade my shoes for your shoes). It happens between different functions in the *polis*. But to trade, we have to pretend the different things are the same.
  **The Marek Angle:** This is the pawn shop mantra. The customer sees a wedding ring (sentimental, unique). Marek sees a commodity that must be "equated" with cash. The act of pawning is the act of forcing unequal things (memory vs. liquidity) to be "equated."

  ### 2. The Pivot: Demand vs. Money
  > *"Now this unit is in truth demand [*chreia*], which holds all things together... but money has become by convention a sort of representative of demand."*

  **The Logic:** This is the core of your confusion. Aristotle makes a distinction between **ontology** (what is *true*) and **pragmatics** (what *works*).
  *   **Truth:** The only reason a house and a bed have any relationship at all is that humans *need* them. Without human need, they are just unrelated piles of atoms. *Chreia* (need/demand) is the metaphysical glue.
  *   **Convention:** You cannot measure "need" with a ruler. Need is fluid. So we invented money (*nomisma* from *nomos*, law/convention) to stand in for need.
  *   **The Gap:** Aristotle does **not** claim demand calculates the price. Demand justifies the *existence* of price. Money calculates the *specifics*.
  **The Marek Angle:** Marek knows the "truth" is that the guitar is worth whatever the customer *needs* (to eat, to pay rent). But the "convention" is the blue book value. Marek's lowballing works because he exploits the gap between the customer's *desperate need* (high chreia) and the *conventional price* (low nomisma). He pays based on the convention, knowing the truth is higher.

  ### 3. The "Surety": Time and Trust
  > *"And for the future exchange... money is as it were our surety."*

  **The Logic:** This answers your question about present vs. future need.
  *   **Barter:** Requires simultaneous need. (I need your corn *now*, you need my shoes *now*).
  *   **Money:** Decouples need from time. I sell shoes for money *now* (which I don't need to eat) because I trust that *later* the community will still exist and accept this money for corn.
  *   **The Work "Surety" Does:** Money is a token of **social trust**. It is a promise that the *polis* will survive into the future.
  **The Marek Angle:** A pawn shop is the dark mirror of this. People pawn things because their "future" has collapsed (emergency, eviction). They trade the "surety" of money now against the hope of redeeming the object later. Marek holds the surety. He knows money is "steadier" than goods, but he also knows (as Aristotle admits later) that money itself "is not always worth the same." Inflation, economic crash—the surety can fail. Marek holds the collateral because he trusts the object more than he trusts the currency.

  ### 4. The Math: Where Demand Disappears
  > *"Let A be a house, B ten minae, C a bed. A is half of B... it is plain, then, how many beds are equal to a house, viz. five."*

  **The Logic:** You noticed demand vanishes here. That is because Aristotle has shifted from **Philosophical Justification** to **Practical Accounting**.
  *   Once the convention (money) is established, you don't need to re-litigate the "need" every time you buy a bed. The market price *encapsulates* the aggregate demand of the community up to that point.
  *   **Is it coherent?** Only if you accept that market price is a "frozen" record of past demand. Aristotle knows this is imperfect ("it tends to be steadier," implying it still fluctuates).
  *   **Does he paper over the gap?** Yes. He wants to show that economics is subordinate to ethics (need holds things together), but when he actually does the math, he has to use the tool of economics (money). He can't calculate "5 beds" using "need." He needs a number.
  **The Marek Angle:** This is where Marek's cynicism shines. He sees the math as a magic trick. "A is half of B." It looks objective. It looks like physics. But Marek knows *B* (the minae/money) is arbitrary ("in our power to change it and make it useless"). So the "5 beds" conclusion is built on a foundation of law, not nature. When he lowballs a customer, he is reminding them that the *nomos* (law/price) is more powerful than the *chreia* (their need).

  ### Summary for Marek's Internal Monologue

  You can write Marek seeing Aristotle not as providing a solution, but as providing a **vocabulary for the con.**

  1.  **On "Commensurability":** Aristotle admits *"in truth it is impossible that things differing so much should become commensurate."* Marek can think: *Aristotle knew. He knew a guitar isn't cash. They're different species. We just pretend they're the same so we don't kill each other.*
  2.  **On "Demand":** Marek can view *chreia* as the customer's vulnerability. *The old man needs the rent. That's the 'truth' holding this together. But I deal in the 'convention.'*
  3.  **On "Surety":** The pawn ticket is the surety. *I give you the money (the promise of future goods), you give me the guitar (the present good). If you don't come back, the promise was a lie, and I keep the guitar.*

  ### The Verdict on the Text
  You are right to feel the text is patched-together. Most scholars agree Book V, Chapter 5 is likely a composite of lecture notes that weren't fully reconciled.
  *   **The Ethical Thread:** Exchange binds the city through reciprocal need.
  *   **The Economic Thread:** Exchange requires a measurable ratio via currency.

  Aristotle tries to say the Economic Thread serves the Ethical Thread. But in the passage, the Economic Thread (the math of minae) ends up drowning out the Ethical Thread (the reality of need).

  **For your novel:** This is perfect for Marek. He dropped out of the MA. He knows the theory, but he lives the reality. He can quote Aristotle to justify the lowball, not because Aristotle says "screw the little guy," but because Aristotle admits **the valuation is a fiction we agree to.** Marek is just the guy enforcing the fiction.

  **Specific line idea for Marek:**
  *"Aristotle says demand holds it all together. But demand is messy. Demand is a guy crying over a wedding ring. Money is the only thing that's steady. Money doesn't care if you loved her. Money just knows the weight of the gold. 'In truth,' the old man wrote, 'it is impossible.' Impossible to make a memory equal to a stack of twenties. So we use the convention. We use the lie. A is half of B. Take it or leave it."*
