      *   Risk is not a property of the individual (like blood type); it's a property of the *group* the individual is assigned to.
      *   Different calculators assign you to different "statistical twins."
      *   This doesn't make the tools useless, but it highlights the limits of precision medicine.

  4.  **Drafting the Response - Section by Section:**

