answer: |-
  **Setting:** *A cluttered faculty office, late afternoon. Rain taps against the window. **JULIA** (Cognitivist/Judgmentalist) is grading papers. **PETER** (Perceptualist) is slumped in the visitor's chair, spinning a pen.*

  **Peter:** You know, I had dinner with a friend last night. Good person, sharp mind, but she's miserable. She's terrified of flying. Statistically, she knows it's safer than driving to the airport. She'll tell you that herself. But the moment the wheels leave the tarmac, she's convinced she's going to die.

  **Julia:** *(Without looking up from a paper)* Classic recalcitrance. The emotion persists despite the contradictory judgment.

  **Peter:** Exactly. And it kills your view, Julia. If emotions *are* judgments—if to fear is simply to judge "this is dangerous"—then her fear should vanish the moment she judges "this is safe." You can't judge $X$ is dangerous and $X$ is safe at the same time. That's a contradiction.

  **Julia:** *(Puts down the red pen)* Why is it a contradiction? People hold contradictory beliefs all the time. I believe I should save for retirement, and I believe I should buy this espresso machine. I hold both judgments simultaneously. The fact that they clash doesn't mean one of them isn't a judgment.

  **Peter:** That's weakness of will, not perceptual error. With the flying, it's not that she *wills* herself to be afraid. It's that the fear is forced upon her. Look, take the Müller-Lyer illusion. Two lines are the same length. You measure them. You *judge* them to be equal. But they still *look* different. The perception outlasts the belief. Emotions are like that. Her gut perceives danger, even if her brain judges safety.

  **Julia:** The optical illusion analogy is your favorite hammer, Peter, but not everything is a nail. When you see the illusion, you don't *act* as if the lines are different. You don't bet money on the top line being longer. But my friend? She grips the armrest. She sweats. She's preparing for impact. That's action-ready behavior. That implies she is operating under the assumption that danger is real.

  **Peter:** She's operating under the *perception* that danger is real. A perception doesn't need to be a conclusion to drive behavior. If a shadow looks like a snake, you jump. You don't deliberate. You perceive a threat value in the environment.

  **Julia:** But here's where your perceptual model gets thin. If I ask you, "Why do you think those lines are different?" you say, "I don't think that, I know they're the same." It's a brute sensory given. But if I ask your friend, "Why are you afraid?" she won't say, "I just perceive danger-ness." She'll say, "Because the engine sputtered," or "Because the drop felt steep." She offers *reasons*. Emotions are responsive to reasoning. You talk people down from panic. You show them stats. If emotions were just perceptions, like seeing the color red, reasoning shouldn't touch them.

  **Peter:** Reasoning touches perceptions too. If I tell you, "That shadow is just a coat rack," your perception might reorganize. You might stop seeing a snake. But sometimes, even knowing it's a coat rack, the hair on your arms stands up. That's the recalcitrance! And your model can't explain it without accusing the person of being logically incoherent. You're saying my friend is simultaneously asserting $P$ and not-$P$.

  **Julia:** I'm saying she's human. Look, let's refine the judgment view. It doesn't have to be a cold, propositional judgment like "I hereby conclude danger." It can be an *imaginative* judgment. When the turbulence hits, she isn't judging the *actual* world as dangerous. She's vividly imagining a scenario where the plane fails, and she is judging *that scenario* as dangerous.

  **Peter:** So she's afraid of a fantasy?

  **Julia:** She's afraid of a possibility she is actively simulating. The judgment is: "If this turbulence continues, a crash is possible." That is a risk assessment. It's a judgment about probability, not certainty. It coexists with the judgment "Statistically, I will land safely." One is a general statistical belief; the other is a situational risk assessment triggered by sensory input.

  **Peter:** That feels like moving the goalposts. You're diluting "judgment" until it includes automatic, visceral reactions. If "judgment" includes the stuff that happens before you have time to think, then "judgment" just means "mental event." And if that's the case, you've basically admitted my point: it's a passive registration of value, not an active stance.

  **Julia:** Not passive. It's trained. A pilot feels turbulence and judges it "normal." A passenger feels turbulence and judges it "threatening." Why? Because they have different background beliefs about aerodynamics. The emotion flows from the cognitive framework. If you change the framework—train the passenger—the emotion changes. That proves the cognitive root.

  **Peter:** But the training takes time, Julia. Why? Because you're trying to override a perceptual system that evolved to keep us alive in trees, not in aluminum tubes. The amygdala fires before the cortex even wakes up. That's not a judgment process; that's a sensory sweep. It's scanning for value properties—*dangerous, edible, mate*—just like the eye scans for *red, blue, green*.

  **Julia:** Okay, let's grant the speed. Fast judgments are still judgments. But here is my real problem with your view: Normativity. If emotions are perceptions, they are just *there*. You don't blame someone for seeing an illusion. But we *do* blame people for emotions. If someone is terrified of flying, we say they are being irrational. If someone is angry because you forgot their name, we say, "Don't be angry, it was an accident." We treat emotions as things that can be correct or incorrect, justified or unjustified.

  **Peter:** Perceptions can be justified or unjustified too. "I saw a ghost." "No, you didn't, that was a trick of the light." Your perception was misleading.

  **Julia:** But we don't tell people they *ought* not to see the illusion. We tell them they *ought* not to be afraid. There's a moral and rational weight to emotions that perceptions lack. If your friend's fear is just a perception, like seeing a bent stick, why should she try to suppress it? It's just data.

  **Peter:** Because the data is causing her suffering and ruining her life! I'm not saying we ignore it. I'm saying we recognize it as a signal that might be false. Just like pain. If you have phantom limb pain, the pain is real, but the judgment "my hand is injured" is false. You treat the pain, but you don't trust the judgment. Your view forces her to say, "My hand is injured," even while she looks at her empty sleeve. That's gaslighting herself.

  **Julia:** *(Leans forward)* But she *doesn't* say "My hand is injured." She says, "I feel like I'm going to crash." There's a difference. If she truly judged it as a certainty, she wouldn't get on the plane. The fact that she boards means her all-things-considered judgment is "This is safe enough." The fear is a competing, subordinate judgment that gets drowned out by her will to travel.

  **Peter:** Or, it's a perception that gets overridden by a judgment. That fits the phenomenology better. She feels the fear (perception), but she boards anyway (judgment/will). If the fear were a judgment, she'd be paralyzed by contradiction. Instead, she's just uncomfortable. She's holding two things in her head: "I feel danger" and "I choose safety."

  **Julia:** And I say she's holding "I perceive a risk" and "I accept the risk." Risk assessment is cognitive. It's probabilistic.

  **Peter:** But who is doing the assessing in the moment of turbulence? Not her. It happens to her. That's the crux. You can't choose to be afraid. You can choose to investigate a hypothesis. You can't choose to see red. Emotions assault us.

  **Julia:** We can't choose our initial judgments either. If I see a man punch a child, I instantly judge that as wrong. I don't deliberate. Does that make the moral judgment a perception? No, it makes it a deeply ingrained cognitive schema.

  **Peter:** *(Stops spinning the pen)* Deeply ingrained schema... or a perceptual system calibrated by evolution? We're getting into semantics.

  **Julia:** We're getting into ontology. If it's a perception, it's non-conceptual. A baby or a dog can perceive danger. But complex emotions—guilt, schadenfreude, existential dread—those require concepts. You can't feel guilty unless you understand "responsibility." Your friend's fear involves concepts of "mechanical failure" and "mortality." Those aren't raw sensory data.

  **Peter:** But the *fear* itself—the tightness in the chest, the adrenaline—that's the raw data. The concepts come after to explain it. She feels the surge, then her brain grabs the nearest concept: "Crash!"

  **Julia:** And if you remove the concept, the emotion changes. If you convince her turbulence is actually the plane *correcting* itself, the fear lessens. The cognition drives the affect.

  **Peter:** Cognition *modulates* the affect. It doesn't *constitute* it. Look, Julia, your view makes emotions too rational. It suggests if we just fixed our logic, we'd be happy. My view acknowledges that we are animals haunted by ghosts of the savannah. We can know we are safe and still feel unsafe.

  **Julia:** And my view acknowledges that we are rational agents responsible for our emotional lives. If it's just a perception, she's a victim of her biology. If it's a judgment—even a habitual, fast one—there's a path to restructuring it through reason. I prefer a model that offers a ladder out of the pit, even if the ladder is hard to climb.

  **Peter:** But if the ladder doesn't reach, because the pit is actually a sensory apparatus, then you're just telling her to climb harder while she falls.

  **Julia:** *(Sighs, picks up the red pen)* So, we're back to the start. Is she logically inconsistent, or is she sensorily overwhelmed?

  **Peter:** *(Stands up)* Maybe she's both. Maybe the mind is messy enough to be a judgmentalist's nightmare and a perceptualist's dream.

  **Julia:** *(Smiles faintly)* I'll grade that as "Incomplete."

  **Peter:** See you at the department meeting. Try not to judge me too harshly if I'm late.

  **Julia:** I'll perceive your tardiness as a slight, regardless of my judgment of your character.

  **Peter:** *(At the door)* Exactly.

  *(Peter exits. Julia looks at the paper in front of her, marks a grade, then pauses, looking at the rain streaking the window.)*
