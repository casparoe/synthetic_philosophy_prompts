    "part_a": {"score": <float, out of 6>, "comment": "..."},
    "part_b": {"score": <float, out of 8>, "comment": "..."},
    "part_c": {"score": <float, out of 6>, "comment": "..."},
    "total": <float, out of 20>,
    "overall_comment": "..."
  }
  ```
