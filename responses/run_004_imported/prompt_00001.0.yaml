      *   IIA Violation: Removing $A'$ (who lost) changed winner from $B$ to $A$.
      *   Is this acceptable? Yes, because $A$ and $A'$ represent a faction with 60% support. It seems unfair that they lose just because they couldn't agree on a single candidate (vote splitting). A "fair" system should perhaps recognize that the $A$-faction is the majority.
      *   *Comparison:* The "Consensus" argument (Borda) is slightly more sophisticated because it deals with *intensity*, whereas the "Clone" argument deals with *strategic nomination*. The Consensus argument feels more "intuitively acceptable" as a matter of justice/fairness, whereas the Clone argument feels like fixing a mechanical glitch. I will use the Consensus argument as the primary one, perhaps mentioning clones as a secondary note if needed, but Consensus is cleaner.

