                  *   49%: $B$ (Compromise) > $C$ > $A$ (Partisan)
              *   *Wait, this doesn't work for Borda to flip A and B easily without specific numbers.*
              *   Let's check the math again.
              *   51%: $A > B > C$ -> Points: A=2, B=1, C=0
              *   49%: $B > C > A$ -> Points: B=2, C=1, A=0
              *   Total A: $1.02$
              *   Total B: $0.51 + 0.98 = 1.49$
              *   Total C: $0.49$
              *   Winner: $B$.
              *   *Pairwise A vs B:*
                  *   51% prefer A.
                  *   49% prefer B.
                  *   Winner: $A$.
              *   *IIA Check:* In the pairwise contest (ignoring C), A wins. In the full contest (including C), B wins. IIA is violated.
          3.  **Why Acceptable:**
              *   $A$ is the first choice of the majority, but the *last* choice of the minority.
              *   $B$ is the second choice of the majority and the *first* choice of the minority.
              *   $B$ is the consensus. $A$ is polarizing.
              *   Most people would agree that electing the consensus candidate ($B$) is "fairer" than electing the polarizing candidate ($A$) who is hated by half the population.
              *   The presence of $C$ is crucial because it allows the minority to express that $A$ is *worse* than a third option, signaling strong opposition.
          4.  **Implication:**
              *   IIA demands we ignore this signal ($C$).
              *   Therefore, IIA prevents the system from identifying consensus.
              *   Thus, IIA is not a necessary condition for fairness; it restricts the information available to find the "best" social outcome.

      *   This is a very strong, standard argument in social choice theory (often associated with the defense of Borda Count against Arrow's critique).

      *   *Alternative:* The "Clone" argument.
      *   If $A$ and $A'$ are clones.
