answer: |-
  You have spotted a tension that drives animal ethicists up the wall, and your intuition that something feels "off" here is shared by a lot of contemporary Kant scholars. However, the specific charge you're leveling—that Kant thought animals were unfeeling automatons—is actually the weak link in the argument.

  If you correct that premise, the contradiction dissolves logically, even if the conclusion remains morally repugnant by modern standards.

  Here is the breakdown of where the "Kant the Cartesian" narrative goes wrong, and how the "Indirect Duty" view actually hangs together (however precariously).

  ### 1. Kant was not Descartes on Animal Minds
  The claim that Kant viewed animals as "biological automatons" without inner experience is a common conflation with Descartes. Descartes famously argued animals were *bêtes machines* lacking souls and therefore incapable of feeling pain (they just reacted mechanically).

  Kant explicitly rejects this. In his *Lectures on Ethics* (specifically the Collins and Vigilantius notes), Kant acknowledges that animals feel pain, experience fear, and even exhibit analogues of gratitude and loyalty. He writes:

  > "We can judge the heart of a man by his treatment of animals... for he who is cruel to animals becomes hard also in his dealings with men."

  For this argument to work, Kant *must* grant that the animal is experiencing something negative. If the dog were a truly unfeeling toaster, shooting it wouldn't "dull sympathy"; it would be like smashing a toaster. You don't need sympathy for a toaster. Kant knows this. He grants animals **phenomenal consciousness** (the ability to feel/suffer) but denies them **noumenal status** (rational autonomy/personhood).

  ### 2. The Real Divide: Sentience vs. Rational Agency
  The incoherence you sense comes from assuming Kant's moral circle is drawn around *suffering*. It isn't. It's drawn around *legislative rationality*.

  For Kant, moral status isn't about who can feel pain; it's about who can participate in the moral law.
  *   **Humans:** Have rational autonomy. We are "ends in ourselves." We have dignity.
  *   **Animals:** Have sentience but no rational autonomy. They are "things" (in the legalistic sense of not being persons), but they are *animated* things.

  So, when Kant says we have no *direct* duties to animals, he means animals cannot be the *legislators* or *recipients* of moral obligation in a deontological framework. They can't owe us duties, so we can't owe them duties (because duty is reciprocal in his system).

  ### 3. How "Indirect Duty" Avoids Contradiction
  This is where the "smuggling" you suspected happens, but it's technically consistent within his system.

  Kant argues that human beings have natural predispositions (like sympathy) that serve as "aids" to morality. Sympathy isn't the *ground* of morality (reason is), but it is the **vehicle** that makes it easier for us to fulfill our duties to other humans.

  *   **The Logic:** If I torture a dog, I am not violating the dog's rights (it has none). However, I am damaging my own capacity for sympathy. By hardening my heart against the suffering of a sentient being, I weaken the psychological mechanism I need to fulfill my duties *to humans*.
  *   **The Duty:** The duty is actually **to myself** (to maintain my own moral virtue), not to the dog.

  So, is it incoherent? **No.**
  1.  Animals feel pain (Premise A).
  2.  Moral standing requires rational autonomy (Premise B).
  3.  Animals lack rational autonomy (Premise C).
  4.  Therefore, animals lack moral standing (Conclusion 1).
  5.  However, recognizing animal pain cultivates sympathy in humans (Premise D).
  6.  Sympathy helps humans fulfill duties to other humans (Premise E).
  7.  Therefore, hurting animals undermines human virtue (Conclusion 2).

  You can accept A, B, C, D, and E without logical contradiction. You just have to accept that suffering doesn't automatically grant moral standing.

  ### 4. Why It Feels Incoherent (The EA Critique)
  You read this stuff via EA and Tomasik, so your philosophical priors are likely utilitarian or sentience-centric. From that viewpoint, Kant's position looks like hypocrisy because **you treat sentience as the moral baseline, whereas Kant treats it as merely instrumental.**

  To a utilitarian, denying direct duties to a suffering being while admitting it suffers is a moral blind spot. To Kant, admitting suffering but denying moral standing is a metaphysical necessity.

  The "contradiction" people often accuse Kant of is actually a **motivational gap**. If I truly believe the dog has no moral standing, why should I care if my sympathy is dulled? Kant relies on the idea that we *already* value our own virtue. He isn't trying to convince a sociopath to care about dogs; he's telling a moral agent that being cruel to dogs is a form of moral self-sabotage.

  ### 5. Where Kant Actually Wobbles
  While the logic holds together, scholars like Christine Korsgaard (who tries to rehabilitate Kant for animal ethics) point out that Kant sometimes undermines himself.

  In some passages, Kant suggests we treat animals *as if* they have value, or that their nature is *analogous* to humanity. If the analogy is close enough to trigger our sympathy, why is it not close enough to trigger moral consideration? Korsgaard argues that if we value our own humanity (our rational nature), and our rational nature is embodied in a sentient animal organism, we must value the sentient animal nature in others.

  But strictly speaking, in the *Metaphysics of Morals*, Kant holds the line: The duty is to humanity in your own person.

  ### Summary
  You aren't misremembering the setup, but the "automaton" accusation is a straw man often used to make Kant look worse than he is (or perhaps to conflate him with Descartes).

  *   **Did Kant think animals suffer?** Yes.
  *   **Did he think that mattered morally?** Only instrumentally, regarding human character.
  *   **Is it contradictory?** Logically, no. It is a consistent application of "Rationality = Moral Status."
  *   **Is it unsatisfying?** Deeply. It requires accepting that suffering is morally irrelevant unless it happens to a rational agent.

  The EA critique is valid in that Kant's framework leads to conclusions we now find abhorrent, but the internal logic of the "Indirect Duty" view doesn't actually require him to deny animal sentience. He denies them **citizenship** in the Kingdom of Ends, not **consciousness** in the world of sense.
