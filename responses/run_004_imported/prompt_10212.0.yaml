answer: |-
  This is a classic metaethics showdown, and honestly, Jonas is punching above his weight for 1am with a couple of beers in. He's identified the single biggest hurdle for your position.

  Here is the breakdown of the situation: **Classical Emotivism** (the "Boo/Hurrah" view you're defending) is indeed in serious trouble because of Frege-Geach. However, **Contemporary Expressivism** (the upgraded version developed by Blackburn, Gibbard, and others) attempts to survive it.

  Here is what you need to know to walk back into that debate armed with something better than "uh, I'll think about it."

  ### 1. Why Frege-Geach is a Problem for Your "Casual" View
  To understand the fix, you have to feel the pain of the problem.

  Your view (Classical Emotivism) says:
  *   **Sentence A:** "Stealing is wrong."
  *   **Meaning:** "Boo, stealing!" (An expression of emotion/attitude).

  Now, look at the logical argument Jonas hinted at:
  1.  Stealing is wrong.
  2.  If stealing is wrong, then getting your little brother to steal is wrong.
  3.  Therefore, getting your little brother to steal is wrong.

  This is a valid argument (Modus Ponens). For an argument to be valid, the terms must mean the same thing in every instance.
  *   In **Premise 1**, you are expressing an attitude ("Boo stealing!").
  *   In **Premise 2** (the "If" clause), you are **not** expressing an attitude. You aren't saying "Boo stealing!" You are merely *considering* the proposition hypothetically.

  If the meaning of "Stealing is wrong" *is* the expression of the attitude, then the phrase means two different things in Premise 1 and Premise 2. If the meaning changes, the argument commits the **fallacy of equivocation**. It becomes as nonsensical as:
  1.  **Banks** are where money is kept.
  2.  If **banks** are where money is kept, then river **banks** are muddy.
  3.  Therefore, river **banks** are muddy.

  Jonas is right: Classical Emotivism implies that moral logic is impossible. It suggests you can't reason about ethics, only clash attitudes. But we *do* reason about ethics. So, the theory fails to explain actual moral discourse.

  ### 2. Can the View Be Saved? (Enter Quasi-Realism)
  This is where you pivot from 1930s Emotivism (A.J. Ayer) to 1980s/90s **Expressivism** (Simon Blackburn, Allan Gibbard).

  Blackburn admits that moral language *looks* like factual language. It has truth values, it works in conditionals, it follows logic. His project is called **Quasi-Realism**. The goal is to explain why moral language *acts* like it describes facts, even though it doesn't actually describe facts.

  **The Fix:**
  Blackburn argues that logic isn't just about "truth preservation" (moving from true facts to true facts). It's also about **consistency of attitudes**.

  When you say, "If stealing is wrong, then getting your brother to steal is wrong," you aren't expressing an attitude about stealing. You are expressing a **higher-order attitude**. You are saying: *"I disapprove of stealing, and I also disapprove of anyone who disapproves of stealing but approves of encouraging it."*

  For Blackburn, the argument is valid not because it preserves "moral truth," but because anyone who accepts the premises but rejects the conclusion has a **fractured mind**. Their attitudes are inconsistent.

  **So, does it work?**
  *   **Optimistic view:** Yes. It allows you to keep the core idea (no objective moral facts) while explaining why moral logic works.
  *   **Pessimistic view (Jonas's potential counter):** Many philosophers think this is a "patch." Critics like Mark Schroeder argue that Expressivists are just smuggling "truth" back in through the back door. If you say moral statements can be "consistent" or "inconsistent" in a logical sense, aren't you just admitting they have truth-conditions after all? This is known as the **"Negation Problem,"** and it's the modern version of Frege-Geach that still keeps expressivists up at night.

  ### 3. What You Have to Give Up
  If you want to adopt the Quasi-Realist/Expressivist defense to save your view, you cannot keep your "casual" stance intact. You have to make three major concessions:

  **A. You can't dismiss logic as "just opinion."**
  In your casual view, if Jonas disagrees with you, it's just his attitude vs. yours. Like preferring vanilla vs. chocolate.
  *   **The Concession:** If Expressivism is true, some moral views are logically **incorrect**. If Jonas can prove your moral attitudes are inconsistent (e.g., you say killing is wrong but support the death penalty without a distinguishing principle), you aren't just "different"; you are making a mistake in reasoning. You have to admit that moral reasoning is possible.

  **B. You have to accept a "Deflated" notion of Truth.**
  You can no longer say, "Moral statements can't be true or false."
  *   **The Concession:** You have to say, "Moral statements can be true, but 'truth' here doesn't mean corresponding to a fact in the universe. It just means the attitude is one I endorse." This is called **Minimalism about Truth**. You can say "It is true that stealing is wrong," provided you understand "true" as a tool of language, not a mirror of reality. If you refuse to allow moral statements to be called "true," you fall back into the Frege-Geach trap.

  **C. You lose the "Boo/Hurrah" Simplicity.**
  Your view was that moral claims are *just* emotions.
  *   **The Concession:** Modern Expressivism argues moral claims are expressions of **normative commitments**, which are more complex than raw emotions. It's not just "I hate stealing." It's "I accept a norm that prohibits stealing." This is more cognitive and stable than a fleeting feeling, which makes your view harder to distinguish from Jonas's realist view.

  ### 4. How to Talk to Jonas Next Time
  Here is your game plan for the next beer debate. Don't defend the "casual" view; defend the "sophisticated" one.

  **1. Concede the point on Classical Emotivism.**
  Tell him: "You're right. The old-school Ayer 'Boo/Hurrah' emotivism is dead. Frege-Geach killed it. I'm not defending that."

  **2. Pivot to Quasi-Realism.**
  Tell him: "But I'm defending a modern Expressivist view, like Blackburn's. I agree moral language *functions* logically. I just deny that the *ground* of that logic is objective facts. The logic comes from the requirement of consistency in our practical attitudes, not from tracking moral particles in the universe."

  **3. Challenge his Realism.**
  Jonas thinks there are moral facts. Ask him: "Where are these facts? Are they natural (scientific) or non-natural (spooky)? If they're non-natural, how do we perceive them? If my Expressivism can explain moral logic *without* positing spooky facts, isn't my view more parsimonious?"

  **4. The "Just Your Opinion" Line.**
  Stop using this phrase. It's too blunt. Instead say: "We might have inconsistent normative commitments." It sounds fancier, and it acknowledges logic while denying objective truth.

  ### The Verdict
  Does Frege-Geach sink your view?
  *   **Casual Emotivism:** **Yes.** It is logically incoherent.
  *   **Sophisticated Expressivism:** **No, but it's wounded.** It survives, but it has to mimic Realism so closely (talking about truth, logic, and consistency) that some philosophers ask, "What's the actual difference left?"

  You can keep your view, but you have to upgrade it from "Moral claims are feelings" to "Moral claims are expressions of normative commitments that obey a logic of consistency." If you make that shift, you survive the Frege-Geach problem, but you have to admit that Jonas can be logically right about morality, even if he isn't factually right.
