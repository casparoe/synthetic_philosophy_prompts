      *   *The Core Issue:* Emotivism says "Stealing is wrong" = "Boo stealing!" (Expression of attitude).
      *   *The Trap:* Consider the argument:
          1.  Stealing is wrong.
          2.  If stealing is wrong, then getting your little brother to steal is wrong.
          3.  Therefore, getting your little brother to steal is wrong.
      *   *Why it fails for simple Emotivism:* In premise 1, I express an attitude. In premise 2, I am *not* expressing an attitude about stealing (I'm hypothesizing). If the meaning *is* the attitude, the meaning changes between premise 1 and 2. If the meaning changes, the argument commits the fallacy of equivocation. But the argument *feels* valid.
      *   *Implication:* Moral language behaves like factual language (truth-apt) in logic, even if emotivists say it isn't.

  3.  **Evaluate the "Sinking" Potential:**
      *   Does it destroy Emotivism? Yes, *classical* Ayer/Stevenson emotivism struggles mightily here. It treats moral language as purely psychological outbursts. Logic doesn't apply to outbursts (e.g., "Ouch! If Ouch, then..." makes no sense).
      *   So, the user *cannot* hold the "casual" version without modification.

  4.  **Explore the "Fixes" (Quasi-Realism/Expressivism):**
