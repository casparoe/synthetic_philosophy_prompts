      *   *Blackburn:* We project our attitudes onto the world. We develop a "logic of attitudes." Validity isn't about truth preservation (since there are no moral truths) but about *consistency of attitudes*. If you disapprove of stealing, consistency demands you disapprove of encouraging stealing.
      *   *Gibbard:* Moral judgments express acceptance of norms. Logic applies to norms.
      *   *Do they work?* This is debated. Some say they solve it. Others (like cognitivist critics) say they are just complex ways of smuggling truth-conditions back in. The "negation problem" (Schroeder) is a modern iteration of Frege-Geach that still troubles expressivists.

  5.  **Determine What the User Must Give Up:**
      *   *Casual Nihilism:* You can't just say "It's all opinion, logic doesn't apply."
      *   *Truth-Aptness:* You have to accept a *deflated* notion of truth. You can say "It is true that stealing is wrong," but "true" just means "I stand by this attitude," not "This corresponds to a moral fact in the universe."
      *   *Objectivity:* You still deny objective moral facts (Platonic forms, divine commands, natural properties).
      *   *The "Just Your Opinion" Line:* This becomes tricky. If logic applies to attitudes, then some attitudes can be *inconsistent* or *unreasonable*, not just different. You can't dismiss a logical moral argument as *merely* an opinion clash if the other person shows your attitudes are inconsistent.

