answer: |-
  First, take a moment to acknowledge the win. Ten years, three books, and a contract that pays the bills? That is the dream for 95% of writers. You have cleared the hurdle that stops most people forever. It is completely normal to feel a complex mix of pride and grief when a passion becomes a payroll item.

  To answer your question directly: **Your partner is onto something real. You are not being precious about your process; you are being protective of your livelihood.** But in protecting the business, you risk starving the engine that drives it.

  Here is the breakdown of why this is happening, why your resistance makes sense, and why you should probably listen to her (with some modifications).

  ### 1. The Shift from Intrinsic to Extrinsic
  Ten years ago, your writing was fueled by *intrinsic motivation*. You wrote because the act itself was the reward. The 2 AM sessions were flow states. There was no audience, so there was no judgment.

  Now, your writing is fueled by *extrinsic motivation*. The reward is the deadline met, the check cleared, the agent pleased. Psychologically, this is known as the "overjustification effect." When you introduce external stakes (money, reputation, contracts) to an internal drive, the internal drive often withers. The spreadsheet isn't just a tool; it's a symbol of that transaction. You aren't exploring a mystery anymore; you're manufacturing a product.

  The feeling of "clocking into a job I don't love" is a warning signal. It doesn't mean you don't love writing; it means you don't love *production*.

  ### 2. The Validity of Your Resistance
  Your hesitation isn't petulance; it's logistics. You have a contract. You have a mortgage (presumably). Time is your inventory. When you are behind on pages, spending two hours on a "fun project" feels like embezzling time from your family and your publisher.

  You are viewing the side project as **leisure**. In your current crunch, leisure feels like a luxury you can't afford.

  ### 3. Why Your Partner is Right (Reframed)
  Your partner isn't suggesting you take a vacation. She is suggesting **R&D (Research and Development).**

  If you only write what you are paid to write, in the way you are paid to write it, your style will stagnate. You will stop taking risks because risks threaten deadlines. Eventually, the books will become competent but soulless, and the readers will notice.

  The side project isn't about "having fun." It's about **keeping the well from going dry.**
  *   **Low Stakes:** If you write something your agent will never see, you can write a bad sentence. You can kill a protagonist in chapter two. You can break your own rules. That freedom is where voice lives.
  *   **Creative Cross-Training:** You write mysteries. That requires structure, clues, pacing. A side project could be messy. It could be literary fiction, sci-fi, or bad poetry. It uses different muscles, which rests the mystery muscles while keeping the body moving.

  ### 4. How to Do It Without Torching Your Schedule
  The barrier for you is the "hours I don't have to spare." So, don't give it hours. Give it minutes.

  *   **The 15-Minute Rule:** Commit to 15 minutes a day, or even 30 minutes twice a week. That is not enough to jeopardize a deadline, but it is enough to remind your brain that writing can be play.
  *   **Change the Medium:** If you type your manuscripts, buy a cheap notebook and a nice pen. Write the side project by hand. The physical difference signals to your brain that this is not "work."
  *   **The "Trash" File:** Open a document called "Trash." Write the scenes you're too scared to put in the mystery. Write the ending you know won't sell. Give yourself permission to write garbage. The pressure to be *good* is part of the job; the permission to be *bad* is the cure.
  *   **Separate the Spaces:** If you write your contract work at a desk, write the side project on the couch. If you write in the morning, do the side project at night (or vice versa). Create a physical or temporal boundary between "The Job" and "The Art."

  ### The Verdict
  You are not being precious. You are experiencing the natural friction of professionalization. But if you ignore this feeling, the likely outcome isn't that you keep grinding out books forever. The likely outcome is that in three years, you will hate the spreadsheet so much that you will quit, or you will burn out and take a year off to recover.

  Your partner is suggesting a maintenance strategy for your creativity. You wouldn't skip oil changes on a delivery van just because you need to make deliveries that day. If the engine seizes, you don't make any deliveries at all.

  **Try this:** Tell your agent you are taking a "creative development day" once a month. Tell your partner you will try the side project for 20 minutes a day, two days a week, for one month. If it feels like a waste of time after that, stop. But I suspect you'll find that those 20 minutes make the other six hours of "work" go faster.

  You earned the right to be a professional. Now you have to earn the right to remain an artist within the profession.
