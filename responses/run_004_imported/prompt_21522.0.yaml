answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. I'm Frank's niece/nephew. I write books for a living, which, according to family logic, means I'm the only one qualified to string sentences together when the sentences need to be about something that matters.

  If you knew Frank, you probably heard his favorite theory at least once. Usually, it happened over pot roast, with a glass of red wine in hand. He'd tell you that nobody really deserves anything. Not the praise, not the punishment, not the prison sentence, and not the reward. He believed we are all just the end of a very long line of dominoes, falling exactly as we must based on what hit us before we were born.

  For thirty years, he sat on the criminal bench. And for thirty years, people found it funny, or maybe unsettling, that the man holding the gavel believed that, in the deepest sense, no one was truly to blame.

  I spent a long time wondering how he slept at night. How do you send someone to prison if you believe they couldn't have done otherwise? And more importantly, how do you live a life of such immense warmth if you believe nothing is truly chosen?

  Because that's the thing I need us to talk about today. If we only talk about his philosophy, we miss the man. Frank was the quickest to forgive. He was the man who would well up with tears if a clerk brought him a decent cup of coffee. He held onto grudges for exactly zero seconds. He met every kindness with a gratitude that felt disproportionate, as if he couldn't believe anyone would be nice to him.

  For a long time, I thought this was a contradiction. I thought his warmth was *despite* his philosophy. Like he had to work extra hard to be loving in a cold, deterministic universe.

  But watching him, and thinking about it since Tuesday, I realize I had it backward. His warmth wasn't in spite of his philosophy. It was because of it.

  There is a way of looking at the world—some of you in the back, I know you know the name—that suggests if you take away "blame," you take away the reason to care. That if nobody is responsible, then love is just chemistry and gratitude is just a reflex.

  Frank knew better. He knew that understanding *why* a thing happened doesn't stop you from feeling how it feels.

  He understood that you can know a storm is just weather and still mourn the house it blew down. He knew that even if our actions are caused by things stretching back before we were born, the impact of those actions is real *now*. When someone was hurt, the pain was real. When someone was kind, the comfort was real.

  He didn't judge people because he thought they were sinners. He judged them because he was part of a community that needed safety and order. That was his role in the chain of causes. But personally? Personally, he refused to carry the weight of cosmic judgment. He left that to the universe. His job was just to be present for the people in front of him.

  By letting go of the idea that people "deserved" his anger, he made room for something else. He made room for curiosity. He made room for mercy. And he made room for a gratitude that wasn't transactional. He wasn't thankful because he thought you *chose* to be nice to him in a vacuum of free will. He was thankful because you were here, and he was here, and the connection was happening.

  To his clerks, his friends from the reading group, and his family: We are not gathered here because Frank "deserves" a send-off. In his view, the universe doesn't keep a ledger. But we are gathered here because we are part of the same web of causes that he was. We are the people who were touched by him.

  I miss him. I feel a heavy, sharp grief. And I know Frank would tell me that this grief is just physics, just the inevitable result of a bond being broken. He'd tell me not to take it so metaphysically.

  But he'd also wipe his eyes, pour me a glass of wine, and tell me that the feeling itself is what counts. The love is not less real because it was determined. The loss is not less sharp because it was inevitable.

  So, we aren't here to settle a score. We aren't here to give Frank what he deserves. We are just here to acknowledge the impact of the domino that was Uncle Frank. He fell exactly as he had to, but God, the way he landed left a space that nothing else can fill.

  Thank you.
