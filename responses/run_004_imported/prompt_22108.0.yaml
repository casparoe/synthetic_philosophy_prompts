answer: |-
  This is a fascinating dilemma that touches on a genuine philosophical problem known as **the problem of aesthetic testimony.** Your subscriber isn't just being difficult; she has intuitively identified a distinction that philosophers have debated for centuries.

  While we rely on testimony for facts all the time (e.g., "The earth is round," "This bridge is safe"), relying on testimony for aesthetic judgments ("This film is moving," "This cake is delicious") feels different because of the nature of the claim being made.

  Here is a breakdown of the principle at stake, why your subscriber's objection holds water, and how you might navigate it without burning out your hobby.

  ### 1. Facts vs. Qualia
  The subscriber's distinction between runtime and "devastating performance" maps onto the philosophical difference between **propositional knowledge** and **acquaintance knowledge** (or *qualia*).

  *   **Facts (Runtime, Director):** These are objective data points. They exist independently of your experience of them. You can know the runtime of a film without seeing it because the runtime is a property of the file, not the viewer. Reporting this secondhand is simply transmitting data.
  *   **Aesthetic Judgments (Beautiful, Devastating):** These describe a *relationship* between the viewer and the object. When you say a performance is "devastating," you are not just describing the actor; you are describing the *effect* the actor has on a human nervous system.

  To claim a film is "moving" without having been moved is to report on an internal state you did not inhabit. You can report that *others* were moved, but to assert the film *is* moving (as an inherent quality) implies you have verified that effect. Your subscriber is arguing that aesthetic qualities cannot be fully known secondhand because they require the "qualia" of the experience—the actual feeling of being moved.

  ### 2. The Problem of Aesthetic Testimony
  In epistemology (the study of knowledge), there is a specific debate about whether we can gain aesthetic knowledge through testimony.
  *   **The Pessimist View:** You cannot truly hold an aesthetic judgment unless you have experienced the object. If I tell you a song is sad, and you haven't heard it, you know *that I think it's sad*, but you don't know the sadness of the song. To adopt my judgment as your own without hearing the song is to bypass the faculty of taste.
  *   **The Optimist View:** We do this constantly. If a trusted friend says a restaurant is amazing, I can truthfully tell a third party, "That restaurant is amazing."

  However, even the "Optimists" usually concede that there is a difference in **authority**. When you write "The cinematography is stunning," you are speaking with the authority of a witness. When you write it based on other critics, you are speaking with the authority of a reporter. The subscriber is objecting to the witness claim when you are actually acting as a reporter.

  ### 3. The Newsletter "Contract"
  A newsletter, especially one written by an individual rather than a publication, relies on a specific social contract: **The value is your specific filter.**

  Subscribers aren't just looking for a list of good movies; they can get that from Rotten Tomatoes. They are subscribing to *your* taste, *your* voice, and *your* curation.
  *   When you recommend a film you have seen, you are saying: "I trust my own eyes, and I think you will trust them too."
  *   When you recommend a film you haven't seen based on consensus, you are saying: "I trust *their* eyes, and I think you will trust *my aggregation of them*."

  The friction arises when the second statement is dressed in the language of the first. If you write, "The lead performance is quietly devastating," you are using the language of direct experience. If you haven't had that experience, the sentence becomes, in a subtle way, a fiction. It's not a lie about the film (the performance might indeed be devastating), but it is a misrepresentation of *your relationship to the film.*

  ### 4. Is She Holding You to a Double Standard?
  You asked if she is applying a standard to your newsletter she wouldn't apply elsewhere. Consider the dessert analogy you offered:
  *   If you tell a friend, "You have to try this cake, it's exquisite," and they ask, "Have you had it?" and you say, "No, but Sarah said so," the recommendation loses its weight. It becomes information about Sarah's taste, not the cake's quality.
  *   However, if you say, "I haven't tried it, but everyone says it's exquisite," the social contract remains intact.

  The subscriber isn't asking you to stop recommending unseen films. She is asking you to stop **collapsing the distance** between the consensus and your own voice. She is objecting to the *assertion*, not the *curation*.

  ### 5. Practical Solutions
  You don't need to stop including unseen films. Curation is valuable even without direct criticism. However, to honor the principle your subscriber raised (and to protect your own integrity), you can adjust *how* you write about them.

  **Shift from Assertion to Attribution**
  Instead of asserting the quality as fact, attribute the judgment to the source.
  *   *Current:* "The cinematography is stunning."
  *   *Revision:* "Early reviews highlight the stunning cinematography."
  *   *Current:* "The lead performance is quietly devastating."
  *   *Revision:* "Critics are calling the lead performance quietly devastating."

  **Own the Curation**
  Be transparent about your process. You can make the "unseen" status a feature rather than a bug.
  *   *Revision:* "I haven't caught this one yet, but the consensus among critics I trust is so strong that I'm flagging it for you immediately."

  **Separate the Sections**
  If possible, distinguish between "My Picks" (seen) and "Buzz/Worth Watching" (unseen consensus). This clarifies the type of authority you are exercising in each section.

  ### Conclusion
  Your subscriber is onto something real. There is a principled difference between reporting facts about an object and reporting on the *experience* of an object. Facts live in the world; aesthetic judgments live in the interaction between the world and the viewer.

  By shifting your language slightly, you can respect that distinction without sacrificing the utility of your newsletter. You can remain a trusted guide not by claiming to have seen everything, but by being honest about when you are sharing your eyes and when you are sharing your research. That honesty might actually deepen your subscribers' trust, rather than diminish it.
