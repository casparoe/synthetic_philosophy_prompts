prompt: |-
  Okay so this is a weird ask but it's for a real thing, not homework. Our school started running student essays through this AI-writing detector last month (teachers can upload anything and it spits out a percentage for how "AI-generated" it thinks the writing is), and it flagged my friend's totally hand-written history essay as 94% AI. She almost got written up for academic dishonesty before anyone even talked to her about it. After enough parents complained, the admin put together a little task force to actually figure out a policy, and somehow I ended up as one of the three student reps (probably because I was the loudest about it in our group chat). We meet again Wednesday and I got stuck drafting the memo everyone's gonna argue over, since apparently thats "my thing" now.

  Here's the actual problem: about half the task force, including one of the teachers, thinks we should basically just defer to the detector going forward since the district paid good money for it and it's right most of the time, and the other half of us think that's kind of nuts given that literally nobody, not the teacher who ran it, not the company that sold it, maybe not even the people who built it, can fully explain why it flagged this specific essay and not some other one. I don't want to just show up saying "AI bad, trust students," thats not gonna convince anyone skeptical. While googling around for backup I ran into this term "responsibility gap," apparently a whole philosophy thing about autonomous systems and who's actually on the hook when nobody can really be blamed for what one of them does, which felt relevant but honestly I don't get it well enough to use it right. Could you write the actual memo for me to bring Wednesday? It needs to say what should happen with my friend's case specifically, and also lay out a real ongoing policy for how future flags get handled, with reasons solid enough to move someone who currently just trusts the software. And please don't just steamroll the "the detector's usually right, so use it" side, since a real person on this task force actually holds that view and I need to be ready for it, not just told they're wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A high school task force is meeting to decide policy on AI writing detectors after a false positive (94% AI on a handwritten essay) nearly caused an academic dishonesty charge against a student.
      *   **User Role:** Student representative on the task force.
      *   **Task:** Draft a memo to be presented at the meeting.
      *   **Key Content Requirements:**
          *   Address the specific case (the friend's handwritten essay).
          *   Propose an ongoing policy for handling future flags.
          *   Provide solid reasoning that acknowledges the "pro-detector" side (cost, perceived utility) without steamrolling them.
          *   Incorporate the concept of the "responsibility gap" (philosophical concept regarding autonomous systems/accountability) correctly and effectively.
          *   Tone: Professional, persuasive, balanced, student-led but mature.
      *   **Constraints:** Do not simply say "AI bad, trust students." Acknowledge the teacher's perspective (district paid money, it's "right most of the time").

  2.  **Deconstruct the "Responsibility Gap":**
      *   *What is it?* It's a concept in ethics of technology (often associated with Andreas Matthias). It occurs when an autonomous system makes a decision or causes harm, but no human agent can be held morally or legally responsible because the outcome wasn't directly intended or foreseeable by the programmers or users.
      *   *How does it apply here?* If the school punishes a student based *solely* on the detector's output, who is responsible if the detector is wrong? The teacher? The admin? The company? The student suffers the harm, but the "accuser" (the algorithm) cannot be held accountable for lying. The humans abdicate their judgment to the machine, creating a gap where accountability should be.
      *   *Usage in Memo:* Use this to argue that *humans* must remain in the loop to maintain accountability. We can't blame the software for a false accusation.

  3.  **Determine the Policy Stance:**
      *   *Immediate Action:* Dismiss the case against the friend. Handwritten work cannot be AI-generated (unless transcribed, which wasn't claimed). The detector is demonstrably flawed in this instance.
      *   *Ongoing Policy:* The detector cannot be the *sole* evidence. It can be a "trigger for conversation," not a "verdict of guilt." Burden of proof remains on the accuser (teacher/admin), not the accused (student). Human review is mandatory.
      *   *Addressing the "Pro-Detector" Side:* Acknowledge the investment. Acknowledge that AI cheating is a real risk. Validate that the tool *might* catch some things. But argue that "most of the time" isn't good enough for academic discipline (due process).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the tension.
      *   **The Specific Case (The Friend):** Be direct. Handwritten = Human. The tool failed. Recommendation: Expunge the record, apologize.
      *   **The Core Argument (The Responsibility Gap):** Explain it simply. If we rely on the black box, we lose accountability. The school takes responsibility for the *decision*, not the software.
      *   **Proposed Policy (The "How-To"):**
          1.  Detectors are advisory only.
          2.  Human conversation is required (interview/defense).
          3.  Burden of proof (preponderance of evidence, not just a percentage).
          4.  Transparency (tell students if it's being used).
      *   **Addressing the Counter-Argument:** Dedicate a section to the teacher's view. "I hear you on the cost and the intent." But pivot to risk management. A false positive damages trust more than a false negative damages grades.
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**
      *   *Avoid:* Teenage rebellion, "this is stupid," "teachers don't get it."
      *   *Aim:* "I understand the challenge you face, but here is a safer path for the institution."
      *   *Key Phrase:* "The detector is a thermometer, not a doctor." (Maybe too cliché? Let's stick with "Indicator, not Adjudicator.")

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the responsibility gap correctly? *Adjustment:* Make sure to emphasize that *humans* make the final call so *humans* own the consequence.
      *   *Check:* Did I validate the teacher's point? *Adjustment:* Add a specific paragraph acknowledging the district investment and the reality of AI cheating.
      *   *Check:* Is the policy actionable? *Adjustment:* Make the steps clear (Step 1, Step 2, Step 3).

  7.  **Final Polish:** Check formatting and ensure it sounds like a smart high school student who did their homework, not a lawyer or a professor. (Keep language accessible but precise).

  **(Self-Correction Note on "Responsibility Gap"):** I need to be careful not to get too academic. The prompt says the user "doesn't get it well enough to use it right." I need to use it in a way that is accurate but accessible to a high school task force. The core idea is: If the machine decides, no human is responsible. If a human decides using the machine as *one* input, the human is responsible. This preserves accountability.

  8.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** AI Policy Task Force (Administration, Faculty, Student Representatives)
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for AI Detector Usage and Resolution of Recent False Positive

  **Purpose**

  The purpose of this memo is to propose a resolution for the recent academic dishonesty flag involving a student's handwritten work, and to establish a sustainable policy for the use of AI-detection software moving forward. As a student representative, my goal is to balance the administration's need to maintain academic integrity with the students' right to fair evaluation and due process.

  **Part 1: Resolution of the Immediate Case**

  Regarding the specific incident where a handwritten history essay was flagged as 94% AI-generated:

  **Recommendation:** The flag should be immediately dismissed, any record of the investigation expunged from the student's file, and the student formally apologized to by the administration.

  **Reasoning:** Physical handwriting is, by definition, human-generated. Unless there is evidence the student transcribed AI text by hand (which was not alleged), the software's output is demonstrably factually incorrect. In this instance, the tool has a 100% error rate. Continuing to pursue this case would undermine the task force's credibility before we begin.

  **Part 2: The Core Problem – The "Responsibility Gap"**

  I understand the argument that the district invested significant funds in this software and that it may detect AI usage "most of the time." However, relying on these percentages as primary evidence creates what ethicists call a **responsibility gap**.

  Here is what that means for our school:
  When an autonomous system (the detector) makes an accusation, but the logic behind that accusation is proprietary and unexplainable (a "black box"), no human can fully verify *why* the decision was made.
  *   If we punish a student based *only* on the score, we are allowing software to make disciplinary decisions.
  *   If the software is wrong, the teacher cannot be blamed (they trusted the tool), the admin cannot be blamed (they followed protocol), and the company cannot be blamed (their terms of service say the tool is not definitive).
  *   The student bears the punishment, but no human accepts responsibility for the error.

  To close this gap, a human being must always remain the "decision-maker." We cannot outsource accountability to an algorithm. If a teacher accuses a student, the teacher must own that accusation based on evidence they can verify, not just a percentage generated by a vendor.

  **Part 3: Proposed Policy for Future Flags**

  I propose the school adopt an **"Indicator, Not Adjudicator"** policy. The detector can signal when a conversation needs to happen, but it cannot determine the outcome of that conversation.

  **1. Probable Cause, Not Proof of Guilt**
  An AI flag should be treated like a smoke alarm. It indicates a potential issue that requires investigation, but it is not proof of a fire. A flag alone should never be sufficient evidence for an academic dishonesty charge.

  **2. Mandatory Human Review**
  Before any accusation is made, a faculty member must conduct a low-stakes interview with the student. This could involve:
  *   Asking the student to explain their thesis or sources.
  *   Asking the student to walk through their draft history or version logs (Google Docs history, etc.).
  *   Asking the student to verbally summarize the argument.
  If the student demonstrates mastery of the material, the flag should be disregarded.

  **3. Burden of Evidence**
  The burden of proof must remain with the accuser, not the accused. We cannot require students to "prove they didn't use AI," as proving a negative is often impossible. The school must provide evidence of dishonesty beyond a software score (e.g., stylistic inconsistencies, lack of source knowledge, or admission).

  **4. Transparency**
  Students must be informed before an assignment if AI detection will be used. Surprise testing erodes trust and increases anxiety, which can actually degrade writing quality, leading to more false positives.

  **Part 4: Addressing the Faculty Perspective**

  I want to explicitly address the concern raised by faculty members on this committee: *The district paid for this tool, and AI cheating is a real threat that undermines learning.*

  I agree with both premises. AI cheating is a challenge, and the district's investment should not be wasted. However, the utility of the tool depends on *how* it is used.
  *   **Risk Management:** A "false negative" (an AI essay slipping through) hurts the grading curve. A "false positive" (a human student accused of cheating) hurts the school's reputation, damages student-teacher trust, and opens the district to potential legal liability regarding due process. The cost of a false positive is significantly higher than the cost of a false negative.
  *   **Tool Optimization:** The software is best used as a formative tool for teachers to identify which essays to read more closely, rather than a summative tool for discipline. This ensures the money spent aids teacher workflow without compromising student rights.

  **Conclusion**

  We cannot ban AI, but we also cannot automate integrity. By implementing this policy, we acknowledge the technology's utility while accepting that human judgment is the only ethical basis for discipline. This protects the teachers from making errors based on bad data, protects the administration from liability, and protects students from algorithmic error.

  I look forward to discussing this framework on Wednesday.
