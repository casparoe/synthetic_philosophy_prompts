      *   **Thought Experiment:** Mind uploading/scanning. One brain scanned, uploaded to non-biological hardware, and *duplicated* into two simultaneous running copies.
      *   **Questions:**
          1.  Would Avicenna deny these copies have genuine rational souls/self-awareness (Flying Man status) due to commitments on temperament and emanation?
