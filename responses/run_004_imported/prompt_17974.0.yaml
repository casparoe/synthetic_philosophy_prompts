      *   **Scenario:** Brain scan $\rightarrow$ Non-biological hardware $\rightarrow$ Two copies.
      *   **Key Issue 1: The Substrate (Non-biological hardware).**
          *   Avicenna requires a *natural body* (*jism tabīʿī*) with a *temperament* (*mizāj*). *Mizāj* is a balance of hot, cold, wet, dry qualities in organic flesh/blood/humors.
          *   Silicon/computation is not a natural body. It has no *mizāj*.
          *   *Conclusion:* The hardware cannot generate the *isti'dād* (preparedness) required for the emanation of the soul.
          *   *Result:* No soul emanates. The copies are merely automata (philosophical zombies, in modern terms). They might simulate internal senses, but they lack the rational soul.

      *   **Key Issue 2: The Duplication (Two Copies).**
          *   Suppose we ignore the substrate issue (magic hardware that mimics *mizāj* perfectly).
          *   Avicenna holds that the soul is individuated by its *initial* attachment to *this* specific matter.
          *   If Copy A and Copy B start simultaneously, do they share a soul?
          *   Avicenna argues the soul is indivisible. It cannot be split.
          *   If the original body is destroyed and two new "bodies" appear, can the *same* soul attach to both? No, that would be transmigration/multipresence, which is impossible for a substance.
