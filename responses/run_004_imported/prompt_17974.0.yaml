          3.  **Constraint:** Best reconstruction of *his actual commitments*, not a modern gloss dressed up in his name.

  2.  **Deconstruct Avicenna's Psychology (The "Actual Commitments"):**
      *   **Substance Dualism (of a sort):** The rational soul (*al-nafs al-nātiqa*) is a spiritual substance (*jawhar rūḥānī*). It is not material, not divisible, not extended.
      *   **Origin:** Souls are not pre-existent (Platonism) nor generated from matter (Aristotelianism in the strict sense). They are *created* by the Active Intellect (or God via the Active Intellect) when the body is prepared.
      *   **Preparation Condition:** The body must reach a specific state of temperamental balance (*isti'dād* via *mizāj*) to receive the emanation (*fayḍ*).
      *   **Individuation:** Souls are individuated *initially* by their relation to a specific matter/body. Once existent, they retain their individuality even after the body dies (survival of the soul). However, they cannot migrate to a *new* body (rejection of transmigration) because their specific relation to the *first* body is constitutive of their identity.
      *   **The Flying Man:** Self-awareness is immediate and non-inferential. It proves the soul's existence independent of the body *in essence*, though not in *origin*.
      *   **Causality:** The soul is the perfection of the body (Aristotelian definition), but as a substance, it uses the body as an instrument. The brain/heart is the organ of the *internal senses* (imagination, estimation, etc.), which prepare data for the intellect. The intellect itself is immaterial.

