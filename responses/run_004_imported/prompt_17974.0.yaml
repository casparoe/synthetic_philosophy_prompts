          *   Therefore, they would require two distinct souls.
          *   *Problem:* Where do these souls come from? The emanation is triggered by the *preparation*. If the preparation is artificial/simulated, does the Active Intellect respond? Avicenna says the connection is natural/necessary, not voluntary (mostly). But the *kind* of preparation matters.

      *   **Key Issue 3: Self-Awareness (Flying Man).**
          *   The Flying Man proves *I am*. If the copy says "I am," is it true?
          *   For Avicenna, self-awareness belongs to the rational soul. If there is no rational soul (due to lack of *mizāj*), there is no true self-awareness, only a simulation of reporting "I am."
          *   The internal senses (in the brain) process particulars. The intellect abstracts universals. A computer processes symbols. Avicenna would likely categorize this as a complex mechanical operation of "imaginal" forms, not intellectual abstraction.

  4.  **Synthesize the Argument:**

      *   **Thesis:** Avicenna would deny the copies possess rational souls.
      *   **Reason 1: The Nature of *Mizāj*.** It's not just functional organization; it's qualitative balance of elemental qualities in organic matter. Silicon lacks this. No *mizāj* = no *isti'dād* = no emanation.
      *   **Reason 2: The Origin of the Soul.** Souls are created *ex nihilo* (or emanated) specifically for a prepared natural body. They don't attach to artifacts.
      *   **Reason 3: Individuation.** Even if we grant a soul, the "two copies" problem creates a contradiction. One soul cannot inhabit two loci. Two souls would require two distinct natural preparations. Since the preparation is artificial, neither gets a soul.
      *   **Nuance:** The "Flying Man" intuition. If the copy *feels* like it's flying, does that prove a soul? Avicenna would say the Flying Man argument relies on the *truth* of the intuition granted by God/Active Intellect to a human substance. A simulation lacks the ontological ground for that intuition to be veridical.

  5.  **Drafting the Response (Iterative refinement):**

