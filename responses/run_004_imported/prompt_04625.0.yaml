      3. Explain why it fails in real life (Reputation, Uncertainty, Intrinsic Motivation).
      4. Conclude on the social contract aspect.

      *Wait, one nuance:* The Logician says "By that logic, none of us should have covered." This implies the Logician thinks the Defector is being hypocritical. The Defector thinks the situation has *changed*. Who is right?
