      *   *Check:* Balance. *Correction:* Ensure Thomas doesn't sound cold. He believes consistency *protects* agents from crushing guilt. Elena shouldn't sound like she wants the user to suffer; she believes suffering is part of moral truth.

  5.  **Polishing the Dialogue:**
