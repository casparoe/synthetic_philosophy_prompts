answer: |-
  **Setting:** *The hallway outside the main lecture hall, 5:30 PM. The crowd from the colloquium is thinning out. The air smells of stale coffee and wet coats. ELENA (30s, sharp blazer, holding a plastic cup of warm white wine) catches up with MARCUS (40s, corduroy jacket, struggling with an umbrella).*

  **Elena:** You bolted before the Q&A. I saw you packing up when the speaker showed the key slide. The one with the key and the ring.

  **Marcus:** I had a train to catch. Besides, we've been hashing out the Sperry-Gazzaniga orthodoxy for twenty years. I didn't need to hear it repackaged as new news.

  **Elena:** It's not orthodoxy if it's true, Marcus. Look, the data is brutal. You show a picture of a snow scene to the right hemisphere and a chicken claw to the left. The verbal left hand points to a shovel. The patient says, "I chose the shovel because it cleans the chicken coop." The left hemisphere is literally confabulating a narrative for an action it didn't initiate. That's not just "fragmented access." That's a distinct center of narrative gravity.

  **Marcus:** It's a distinct center of *information*, maybe. But you're leaping from "informational isolation" to "distinct subjects of experience." That's the gap I'm not willing to jump. Just because the left hemisphere doesn't know *why* the left hand moved doesn't mean the *person* didn't move it. The body is still one. The biography is one.

  **Elena:** The biography is one only because the hemispheres take turns driving the bus in normal social contexts. But put them in the lab, isolate the visual fields, and you get two different answers to the question "What did you see?" If I ask you, "Are you seeing red?" and your mouth says "No" while your left hand points to "Yes," you have to admit there are two truth-claims being generated by one skull.

  **Marcus:** Two truth-claims, sure. But are there two *truth-tellers*? Think about the cross-cueing objection. We know patients develop strategies. Subvocal speech, eye movements, subcortical transfer. The 2017 Pinto study—you remember that? *Brain*. They showed that under specific conditions, split-brain patients can verify if objects in opposite visual fields match.

  **Elena:** I remember Pinto. But look at the constraints. That integration only happens with simple feature matching, and it's likely subcortical. It doesn't rise to the level of conscious access. The *phenomenal* field is still bisected. Just because the brainstem is keeping the lights on for both sides doesn't mean the upstairs neighbors are talking.

  **Marcus:** But that undermines the "two persons" claim. If there's a mechanism that integrates visual data across the midline, even a rudimentary one, then there is a "whole" that is more than the sum of the parts. And phenomenologically, the patients report feeling like one person. They don't wake up and say, "Ah, good morning, we are three today."

  **Elena:** First-person reports are the least reliable data here! The reporting mechanism is housed in the left hemisphere. Of course the *speaker* says they are one person. The right hemisphere doesn't have a voice to complain. You're taking the testimony of the dominant hemisphere as the testimony of the *organism*. That's like asking the CEO if the janitor exists just because the CEO doesn't see him in the boardroom.

  **Marcus:** Okay, but let's grant the functional separation. Let's say there are two streams of consciousness. Why does that entail two *persons*? Personhood isn't just about simultaneous processing capacity. It's about moral responsibility, legal identity, continuity over time. If the right hemisphere gets angry and throws a cup, and the left hemisphere apologizes, we hold the *patient* responsible. We don't arrest the right hand.

  **Elena:** We hold the patient responsible because the law is clumsy, not because the metaphysics is clean. But imagine a case where the conflict is deeper. Suppose the left hemisphere wants to quit smoking and the right hemisphere craves nicotine and controls the motor cortex for lighting up. Who is the patient? If you treat it as one subject, you're ignoring the internal civil war. If you acknowledge two subjects, you see the ethical tragedy: one subject is being held hostage in a body controlled partly by its rival.

  **Marcus:** That's dramatic, Elena. But it assumes the "rival" is a *who*. Maybe it's just a *what*. A module that's malfunctioning. Look, Nagel nailed this in '71. He argued the question "How many persons?" might not have a determinate answer. The concept of "person" is a macro-level category we apply to normal human organisms. When you surgically alter the organism so drastically, our concepts fray. You're trying to force a binary count onto a topology that's been fundamentally altered.

  **Elena:** Nagel was being too cozy with indeterminacy. Ethics demands a count. If I'm the anesthesiologist, do I need to ensure *both* subjects are sedated? If I'm the therapist, who is my client? If you say "it's indeterminate," you're just saying "I don't want to decide." But the dissociation is real. The left hand can type a sentence the right hand didn't plan. That's agency. Distinct agency implies distinct agents.

  **Marcus:** Distinct agency implies distinct *sources of causation*, not necessarily distinct *selves*. Think of a dissociative identity state, but physiological. I can be conflicted. I can act against my own better judgment. That doesn't mean I'm two people; it means I'm a complex system with competing subsystems. The split-brain just makes the subsystems anatomically visible.

  **Elena:** But in a normal conflicted person, there's a shared workspace. A global neuronal workspace where the conflict is felt. In the split-brain patient, the conflict is never felt *as* a conflict by either side. The left side doesn't feel conflicted; it feels confused. The right side doesn't feel conflicted; it just acts. They aren't fighting in the same arena. They are in different arenas.

  **Marcus:** Unless the Pinto data suggests the arenas aren't as walled off as we thought. If there's residual integration, then there is a shared workspace, however narrow. And if there's a shared workspace, there's a single subject whose access is just... bandwidth-limited.

  **Elena:** Bandwidth-limited? Marcus, the corpus callosum is the fiber optic cable of the self. You cut it, you don't get a slow connection. You get no connection. You're clinging to the unity of the body because you're uncomfortable with the idea that personhood is fragile. That you could be two people just by a scalpel cut.

  **Marcus:** I'm clinging to it because the alternative creates more problems than it solves. If they are two people, what happens when one dies? Does the other cease to exist? If the right hemisphere is a person, does it have rights? Can it vote? You open a Pandora's box of metaphysical absurdities to save a functionalist definition of consciousness.

  **Elena:** The absurdity is already there! It's in the lab data. I'm just willing to follow the evidence where it leads, even if it makes personhood messy. You're smoothing over the cracks because the view from the outside looks like one person. I'm looking at the view from the inside—or rather, the lack of a shared inside.

  **Marcus:** And I'm saying the "view from the inside" presupposes a viewer. If the viewing is fragmented, maybe the viewer is just... impaired. Not duplicated.

  **Elena:** *(Takes a sip of wine, looks at the exit)* We're not going to agree. You think unity is the default state that survives injury. I think unity is an achievement of connectivity that dissolves when the wiring goes.

  **Marcus:** And you think a fracture in communication is a fracture in being. I think it's just a fracture in communication.

  **Elena:** Same thing, functionally.

  **Marcus:** Not ethically. Not metaphysically.

  **Elena:** *(Turns to leave)* Next time, stay for the Q&A. I want to hear you ask the speaker if the right hemisphere gets its own coffee break.

  **Marcus:** *(Smiles faintly)* Only if the left hemisphere pays for it.

  *(Elena shakes her head, walking toward the rain. Marcus stays under the overhang, watching her go, then looks down at his own left hand, flexing the fingers slowly.)*
