  *   **(4) Marcus (2):** Strong. Correctly identifies the fatal flaw in simple indifference: an indifferent agent won't maintain the shutdown mechanism itself, creating new safety risks (e.g., allowing the button to break).
  *   **(5) Nadia (1):** Solid. References cutting-edge research (e.g., "incomplete preferences" or "path independence") designed specifically to fix the button-protection problem inherent in indifference.
