          *   Bohmian: Definite positions, spin is contextual.
          *   *Paraconsistent QM:* Mention that this exists (e.g., work by Berto, or early Putnam), but it requires rejecting the Eigenstate-Eigenvalue link or adopting a specific metaphysics.
      *   *Priest's Own View:* Interestingly, Priest doesn't heavily rely on QM for dialetheism. He focuses on semantic paradoxes (Liar) and limits of thought. He might even caution against this specific physical application.
      *   *Why Physicists Stick to Classical Logic:* The math works. The predictions are probabilistic (classical probability theory, mostly). Changing the logic doesn't change the Hilbert space calculations. It's a meta-level discussion.
