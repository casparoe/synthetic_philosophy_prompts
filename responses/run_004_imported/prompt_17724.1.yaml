      *   *The "Play" of Content Creation:* Is editing a reel play? Maybe, if she loves editing. But if she does it *for* the algorithm, it's work.
      *   *Key Insight:* Schlick argues that meaning is found in the *present moment* of activity. The habit tracker pulls her into the *future* (maintaining the streak). The algorithm pulls her into the *future* (views/sales). The clay is the *present*.
