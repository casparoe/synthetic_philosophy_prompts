      *   *Core Distinction:* Work is activity undertaken for a future goal (means to an end). Play is activity undertaken for its own sake (end in itself).
      *   *The "Meaning of Life":* For Schlick, life has meaning only in moments of "play" (in the broad sense of intrinsically valuable activity). If all life is work (preparation for the future), life is never actually *lived*, only postponed.
