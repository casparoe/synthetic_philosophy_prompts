answer: |-
  Here are 10 questions designed to move the discussion past the introductory mechanics of Frankfurt cases and into the substantive vulnerabilities of semicompatibilism. They are ordered to build dialectical pressure, starting with the metaphysical setup and moving toward the normative implications.

  ### 1. The Dilemma Defense (Mandatory)
  **Question:** "Let's start with the classic Dilemma Defense against Frankfurt cases. If the world is deterministic, Black's intervention seems redundant, begging the question against the incompatibilist. But if the world is indeterministic, how can Black know *when* to intervene without infringing on Jones's alternative possibilities? If you rely on a 'prior sign' to trigger Black, doesn't that sign itself constitute an alternative possibility that Jones could have avoided?"

  *   **Likely Answer:** She will likely argue that the "prior sign" is not a robust alternative possibility because it is not under Jones's voluntary control, or she will propose a dispositional account where Black intervenes only if Jones *shows* he is about to choose otherwise.
  *   **Follow-up:** "If the sign isn't under voluntary control, then Jones isn't responsible for the sign. But if the sign is the *only* alternative possibility available, aren't you conceding that alternative possibilities *do* exist, they just aren't the ones incompatibilists care about? Why doesn't the mere existence of *any* alternative possibility vindicate the intuition behind PAP, even if it's not a 'robust' one?"

  ### 2. Flickers of Freedom (Mandatory)
  **Question:** "Critics often argue that Frankfurt cases never fully eliminate alternative possibilities; they just trim them down to 'flickers' (e.g., deciding on one's own vs. deciding via intervention). Is your rejection of PAP a claim that these flickers don't exist, or that they exist but are morally insignificant? If the latter, isn't that a face-saving retreat that concedes the incompatibilist's main point: that responsibility requires *some* open future?"

  *   **Likely Answer:** She will likely distinguish between the *existence* of APs and their *explanatory relevance*, arguing that flickers cannot ground responsibility because they don't allow for different *outcomes*.
  *   **Follow-up:** "But if the agent *could* have done otherwise in the flicker scenario (even if the outcome is fixed), doesn't that preserve the 'leeway' intuition that drives our reactive attitudes? If I could have chosen differently, even if the result were the same, why does that leeway fail to contribute to my praiseworthiness?"

  ### 3. Guidance vs. Regulative Control (Mandatory)
  **Question:** "You ground responsibility in 'guidance control' rather than 'regulative control.' Can you cash out this distinction without using those specific labels? Specifically, what is the *value* of regulative control if guidance control is sufficient for responsibility? If I have guidance control but no regulative control, what exactly am I missing out on that matters for morality?"

  *   **Likely Answer:** She will likely say regulative control is required for *freedom* (in a robust sense) but not *responsibility*, or that regulative control is a luxury we don't have.
  *   **Follow-up:** "If regulative control isn't necessary for responsibility, is it necessary for *dignity*? If an agent never had regulative control, are they merely a sophisticated conduit for causal forces, even if they are reasons-responsive? At what point does 'guidance' become indistinguishable from 'complex automation'?"

  ### 4. The Manipulation Objection
  **Question:** "Semicompatibilism focuses heavily on the current time-slice properties of the agent (like reasons-responsiveness). How does your account distinguish between a normal agent exercising guidance control and a manipulated agent (like in a 'designer drug' or 'neuroscientist' case) who is also reasons-responsive but whose history is compromised? Does history matter for guidance control?"

  *   **Likely Answer:** She may argue that manipulation undermines the *ownership* of the mechanism, or she may bite the bullet and say manipulated agents are responsible if they are reasons-responsive.
  *   **Follow-up:** "If history matters for ownership, aren't you smuggling in a requirement for 'ultimate sourcehood'? And if ultimate sourcehood requires a specific kind of causal history, doesn't that eventually circle back to requiring alternative possibilities in the agent's past development?"

  ### 5. Degrees of Reasons-Responsiveness
  **Question:** "You argue that mechanisms must be 'moderately reasons-responsive.' Is this a binary threshold or a gradient? If it's a gradient, does responsibility come in degrees? If I am *less* reasons-responsive due to upbringing or biology, am I *less* responsible, or does the binary nature of blame require a hard cutoff that your theory doesn't support?"

  *   **Likely Answer:** She will likely admit responsibility comes in degrees but argue that for practical blame/praise, we use thresholds.
  *   **Follow-up:** "If responsibility comes in degrees, does that undermine the retributive practices we actually engage in? If semicompatibilism implies we should never fully blame anyone because reasons-responsiveness is always partial, isn't that a revisionist cost too high for our actual moral practices?"

  ### 6. The Intuition Pump
  **Question:** "Frankfurt cases rely heavily on intuitive judgments about specific scenarios. However, experimental philosophy suggests that intuitions about these cases vary wildly based on how they are framed. If the intuition that 'Jones is responsible' is not universal, why should we let that specific intuition override the deeply held incompatibilist intuition that 'ought implies can'?"

  *   **Likely Answer:** She will likely argue that reflective equilibrium supports the Frankfurt intuition over the "ought implies can" intuition upon closer inspection.
  *   **Follow-up:** "But isn't 'ought implies can' a conceptual truth, whereas the Frankfurt judgment is a contingent reaction to a story? Why should a contingent intuition about a sci-fi scenario overturn a conceptual constraint on moral obligation?"

  ### 7. Blame vs. Praise Asymmetry
  **Question:** "Does your distinction between guidance and regulative control apply symmetrically to blame and praise? Some argue that we might need alternative possibilities to *praise* someone (to credit them with a good outcome) even if we don't need them to *blame* them (since bad outcomes can be attributed to actual sequences). Does semicompatibilism risk making praise impossible while leaving blame intact?"

  *   **Likely Answer:** She will likely argue the account is symmetric; ownership of the mechanism works the same way for good and bad actions.
  *   **Follow-up:** "If it's symmetric, consider the 'hero' who saves a child. If they couldn't have done otherwise, we call them lucky, not virtuous. If guidance control doesn't rule out luck in the same way regulative control does, haven't you drained the concept of virtue of its meaning?"

  ### 8. The "Could Have Done Otherwise" Instinct
  **Question:** "Even if PAP is theoretically false, the linguistic and psychological instinct to say 'you could have done otherwise' is pervasive. If semicompatibilism is true, are we systematically misleading people when we hold them responsible? Should we be error theorists about everyday blame, or do you propose we change our language to match the metaphysics?"

  *   **Likely Answer:** She will likely advocate for a compatibilist reinterpretation of "could have done otherwise" (e.g., conditional analysis).
  *   **Follow-up:** "If you reinterpret 'could' to mean 'would have, if you had chosen to,' aren't you changing the subject? The incompatibilist worries about the *ability to choose*, not just the connection between choice and action. Doesn't this redefinition just talk past the worry?"

  ### 9. Fatalism and Inevitability
  **Question:** "One worry about rejecting PAP is that it flirts with fatalism. If alternative possibilities are irrelevant, does it matter *how* the decision is reached? If the outcome is inevitable, does the agent's reasoning process actually *do* any work, or is it just an epiphenomenal shadow of the causal chain?"

  *   **Likely Answer:** She will argue that the reasoning process is causally efficacious (causal compatibilism), so it's not epiphenomenal.
  *   **Follow-up:** "If the reasoning is causally efficacious but determined, then the reasoning itself was inevitable. So, while the reasoning causes the action, the agent couldn't have reasoned differently. Doesn't that make the agent a passenger in their own reasoning process, undermining the 'guidance' aspect?"

  ### 10. The Cost of Saving Responsibility
  **Question:** "Finally, let's look at the trade-off. You save moral responsibility by sacrificing the ability to do otherwise. But for many, the *point* of moral responsibility is precisely that the agent had a real choice. If you save the practice of responsibility but strip it of the metaphysical freedom people think it requires, haven't you saved the shell of responsibility while losing its core?"

  *   **Likely Answer:** She will argue that the "core" people care about is ownership and reasons-responsiveness, not metaphysical leeway.
  *   **Follow-up:** "But if you ask the person on the street if they want responsibility without the ability to do otherwise, they say no. Why should the philosopher's 'core' override the agent's own understanding of what makes their life meaningful? Is this a theory for philosophers, or for agents?"
