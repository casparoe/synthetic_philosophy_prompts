      *   *Point 2: Qualitative Multiplicity.* Perdurantism assumes quantitative multiplicity (countable parts). Bergson argues conscious states (and by extension, living beings) are interpenetrating. You can't cut a melody into notes without destroying the melody.
      *   *Point 3: Temporary Intrinsics.* Lewis poses this as a logical problem. Bergson would see it as a linguistic/logical artifact of treating becoming as being. The object doesn't *have* properties; it *enacts* a history.
      *   *Point 4: Relativity/Spacetime.* This is the tricky part. Perdurantism leans heavily on Minkowski spacetime. Bergson rejected the *philosophical* implication of the block universe in 1922. He must reject the ontological status of the 4D worm.

