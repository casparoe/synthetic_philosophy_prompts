      *   *Nuance:* Perdurantism says the whole worm exists. Bergson says the whole *flow* exists, but the "worm" implies a finished track. For Bergson, the track is being laid down as we go. The future is not real yet. This is a key divergence from the Block Universe implied by 4Dism.
      *   *Lewis's Problem:* Lewis wants to avoid indexing properties (bent-at-t). Bergson would say the indexing is the only honest part, but not because of relations, but because the *thing itself* has changed. The "contradiction" only arises if you assume the thing is static.

  9.  **Final Polish:** Check tone (respectful, rigorous, novelistic potential). Ensure the distinction between 1920s context and 1980s Analytic metaphysics (Lewis) is handled carefully (the prompt asks to extrapolate Bergson into a debate he didn't have, using Lewis as a test case).

