      *   **Motivation (Lewis):** Temporary Intrinsics. How can $x$ be bent at $t_1$ and straight at $t_2$?
          *   *Perdurantist Solution:* $x$-at-$t_1$ is bent. $x$-at-$t_2$ is straight. No contradiction because they are different parts.
