  **MEMORANDUM**

  **TO:** Regional Antivenom Allocation Subcommittee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Standing Policy on Non-Divisible Lot Allocation

  **Recommendation**
  I recommend the subcommittee adopt a **Maximized Expected Survival (MES)** policy. Under this standing rule, scarce antivenom lots must be allocated to the patient group that yields the highest statistical number of survivors, calculated by multiplying the number of patients in each group by their respective probability of survival *with* treatment versus *without* treatment.

  **Application Protocol**
  When a single lot must be allocated between one severe patient and a group of moderate patients, the attending triage officer will apply the following calculation:

  1.  **Estimate Mortality Risk:** Determine the probability of death for the severe patient without treatment (e.g., 90%) and the probability of death for the moderate cohort without treatment (e.g., 20% each).
  2.  **Calculate Expected Lives Saved:**
      *   *Option A (Severe):* 1 patient × 0.90 risk reduction = 0.90 expected lives saved.
      *   *Option B (Moderate):* 5 patients × 0.20 risk reduction = 1.00 expected lives saved.
  3.  **Allocate:** Assign the lot to Option B.
  4.  **Tie-Breaker:** Only if the expected lives saved are mathematically equivalent (within a 5% margin) shall a weighted lottery be employed.

  **Ethical Justification**
  As a public health body, our primary fiduciary duty is to the population we serve. In conditions of absolute scarcity, we are obligated to minimize the total loss of life. A rule-based aggregative approach ensures consistency, reduces decision-maker burnout, and maintains public trust that resources are not being wasted. Predictability is itself a moral good in crisis medicine; families and providers must know that allocation decisions are based on objective survival metrics rather than arbitrary chance.

  **Consideration of the Individual Claim**
  We must, however, take seriously the argument against aggregation. There is a compelling moral intuition—articulated by philosophers like John Taurek—that "numbers do not count" in the way we assume. From the perspective of the single severe patient, the loss of their life is a total catastrophe, not a fraction of a total catastrophe. They do not lose "one-fifth" of a tragedy; they lose everything. To sacrifice this individual solely because five others exist elsewhere implies their claim on life is intrinsically worth less, which conflicts with the principle of equal respect for persons. A weighted lottery would honor the idea that each patient has an equal right to be rescued, regardless of how many others happen to be in the queue.

  While this view is morally resonant, it is institutionally unsustainable for regional policy. Adopting a lottery system when the disparity in outcomes is significant (e.g., 1 life vs. 5 lives) effectively chooses to let more people die when we could have saved them. While we cannot dismiss the moral injury inflicted on the single patient by this calculation, we cannot prioritize the *fairness of the chance* over the *outcome of the survival* when public resources are at stake. We acknowledge this moral remainder: the single patient is not "worth less," but our duty to the collective requires a decision that minimizes total grief, even when it imposes a fatal burden on the few.

  **Next Steps**
  If approved, I will draft the clinical decision tree for integration into the triage manual and propose a quarterly review process to audit survival data and ensure our risk estimates remain accurate.
