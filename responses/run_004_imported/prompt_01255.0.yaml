      *   This doesn't show divergence in *status*, just applicability.
      *   The DCD case is the standard example in bioethics literature (including Bernat's recent work) for why the standards conflict. I will stick with DCD.

      *Refining the "Alive under WB" claim:* At 5 minutes of warm ischemia, is the brain *irreversibly* dead? Most literature says neuronal necrosis takes longer (10+ minutes for widespread irreversible damage). So at 5 minutes, the brain is *potentially* viable. Thus, WB criteria are *not* met. But C-R criteria *are* met (by protocol). This is the divergence.

      *Assumption Name:* "The Assumption of Biological Coincidence." Or "The Equivalence of Permanent and Irreversible." Let's go with the latter as it's more precise legally.

      *Let's check Bernat's specific recent argument.* Bernat has argued that the UDDA is flawed because the two criteria are not equivalent. He specifically points to the DCD protocol as creating a situation where patients are declared dead by circulatory criteria before they are dead by neurological criteria.

      *Final Polish:* Ensure the distinction between "Permanent" (no intent to resume) and "Irreversible" (unable to resume) is the spotlight. This is the key logical break.

      *(Final thought)*: Make sure to mention that under the "Two Roads" view, these are supposed to be the *same* fact. The case shows they are *different* facts at the moment of declaration.

