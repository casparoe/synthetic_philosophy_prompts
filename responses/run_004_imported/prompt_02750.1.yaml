      *   *Suspensions:* Removal of privilege/participation. Personal accountability. The goal is safety, deterrence, and rehabilitation.
      *   *Ultimate Frisbee Context:* "Spirit of the Game" (SOTG) is central. It relies on self-officiating and personal integrity. Violence/aggression undermines the core ethos.

  3.  **Brainstorm Arguments Against the Swap:**
