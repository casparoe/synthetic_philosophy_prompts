      *   **Conflict:** Some committee members say it's like covering a fine (okay). The user feels it's fundamentally different but is struggling to articulate why without sounding personal/grudge-holding.
      *   **Goal:** Provide a clear-headed, defensible argument for why suspensions and fines are different and why substitution undermines the purpose of the penalty.

  2.  **Deconstruct the Core Ethical/Functional Difference:**
