      *   **Safety:** If Priya knows she can dodge consequences, she might shove again. Suspension is partly about cooling off and assessing risk.
      *   **Precedent:** If allowed now, what happens next time? Wealthy players could pay others to sit? Star players become untouchable?
      *   **Spirit of the Game:** SOTG is about personal responsibility. Swapping suspensions violates the spirit of the penalty.
      *   **Fairness to Opponents:** Opponents expect the penalized player to be gone for safety reasons. Sending a different player (even if suspended) doesn't address the risk Priya poses.
      *   **Team Culture:** It creates a caste system where stars are protected by sacrifices of others. It commodifies punishment.

