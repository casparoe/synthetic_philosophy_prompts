answer: |-
  **Setting:** *The hotel lobby bar of a mid-sized convention center. It is 11:30 PM on the second night of the Pacific Division APA. The noise level is a dull roar of clinking ice and overlapping conversations about Kant and cognitive science. Mara is nursing a sparkling water; Theo slides into the booth opposite her with a whiskey.*

  **Theo:** Mara? I thought that was you at the keynote. I was going to say hello, but you looked like you were mentally drafting a referee report.

  **Mara:** *(Smiling, tired)* Theo. Good to see you. Honestly, I was just trying to stay awake. The open bar is a trap.

  **Theo:** Tell me about it. So, what are you working on these days? Last I heard, you were finishing the dissertation on collective intentionality.

  **Mara:** I am, technically. But my mind is elsewhere. I've been reading a lot of Pereboom. And Galen Strawson, obviously.

  **Theo:** *(Sighs, taking a sip)* Oh no. Don't tell me you've gone over to the dark side. You're not trying to convince me that moral responsibility is an illusion, are you?

  **Mara:** I'm trying to *live* like it is, Theo. That's the harder part. I had an incident last week. A colleague took credit for a draft idea of mine in a meeting. Old me would have burned with resentment. New me... I tried to view him clinically. Like a force of nature. A storm that damaged my garden. You don't resent the storm; you just fix the fence.

  **Theo:** That sounds incredibly lonely. And if I may say, a bit self-deceptive. You're trying to adopt what Strawson called the "objective attitude." You're viewing him as an object to be managed rather than a participant in a relationship.

  **Mara:** Is it deceptive? Or is it just seeing things as they are? If he couldn't have done otherwise—given his psychology, his upbringing, the causal chain—why should I hold it against him?

  **Theo:** Because you're human, Mara. Strawson's point wasn't a metaphysical proof that determinism is false. It was that the metaphysical question is irrelevant to the practice. The reactive attitudes—resentment, gratitude, indignation—aren't theories we adopt. They are the fabric of human society. You can't just opt out.

  **Mara:** I'm opting out right now. I'm not feeling the resentment. I feel... calm. Detached.

  **Theo:** For how long? Until the next time someone cuts you off in traffic or forgets your birthday? Look, Strawson grants that we can modulate these attitudes. We have the distinction between excuses and exemptions. If your colleague was coerced, that's an excuse. If he's psychotic or a child, that's an exemption. Then we take the objective attitude. But if he's a normal adult? To withhold resentment then isn't "seeing the truth." It's a withdrawal of goodwill. It's saying, "I won't engage with you as a person."

  **Mara:** But that's exactly the worry, Theo. Strawson shows us that we *do* hold these attitudes. He shows that they are natural, inescapable features of our psychology. But he never bridges the gap to say we *should*. Showing we cannot help having an attitude never shows that anyone is a fair target of it.

  **Theo:** *(Leans forward)* That's the "is-ought" move. But in this specific domain, the "ought" is internal to the "is." Fairness isn't a cosmic metric we check against the universe before we feel resentment. Fairness is defined *by* the structure of our reactive practices. When we ask, "Was it fair to resent him?" we aren't asking, "Was he a prime mover?" We're asking, "Did he show ill will? Was he exempt?" If the answer is yes and no, then it *is* fair, because that's what fairness means in the human context.

  **Mara:** So fairness is just a label we paste on our inevitable biological reactions? That makes "fairness" sound like a consolation prize. If the Basic Argument holds—that nothing can be *causa sui*—then no one is truly responsible. If the practice of responsibility is built on the assumption that people could have done otherwise in a way they couldn't have, then the practice is built on a mistake. A natural, inescapable mistake, sure. But a mistake nonetheless.

  **Theo:** Okay, let's grant the metaphysics for a second. Let's say no one is *causa sui*. If you abandon the participant stance because of that, you aren't just dropping a metaphysical belief. You're dropping love. You're dropping friendship. You can't love someone without being vulnerable to what they do to you. You can't feel gratitude if you view their kindness as just causal inevitability. Are you really willing to pay that price for metaphysical consistency?

  **Mara:** *(Pauses, looking into her glass)* I worry that love based on an illusion isn't worth having. Or... maybe it is worth having, but we need to redefine it. I can care about his well-being without thinking he *deserves* punishment if he harms me. I can seek protection, restitution, even rehabilitation. Just not retribution.

  **Theo:** But retribution isn't the only form of resentment. Moral resentment is a demand for regard. When I resent you, I'm saying, "I matter, and you disregarded me." If you take the objective attitude toward me, you're saying, "Your actions don't implicate you." You're treating me like a patient, not an agent. It's condescending.

  **Mara:** Is it condescending to recognize shared limitation? We're both caught in the same causal web. Why is it more respectful to pretend I have a magical power of contra-causal freedom that I don't have?

  **Theo:** Because the "magic" isn't in the metaphysics; it's in the relationship. You're responding to my last point by going back to the metaphysics. I'm saying the relationship *constitutes* the agency. If you step out of the relationship to view me objectively, you aren't seeing "more" truth; you're seeing less. You're seeing a biological machine, not a friend.

  **Mara:** I hear you. And I feel the pull. When my sister yelled at me last month, I tried the objective stance. I told myself, "She's stressed, her amygdala is hijacked, determinism is true." And intellectually, it worked. But viscerally? I still felt the sting. And then I felt guilty for feeling the sting.

  **Theo:** Exactly! The resentment popped up anyway. Because you care about her. Strawson isn't saying we *shouldn't* feel it; he's saying we *will*, and that this "will" is the only ground we have for morality. If you try to suppress it, you're fighting your own nature.

  **Mara:** But just because I can't help hitting my knee when the doctor taps it doesn't mean the knee jerk is *justified*. It just happens. Maybe resentment is like that. A reflex. And maybe, as philosophers, our job is to ask if we should let that reflex govern our institutions, our prisons, our lives. Pereboom isn't saying we stop feeling emotions. He's saying we shouldn't let those emotions dictate our justification for harm.

  **Theo:** But you admitted it yourself. You tried to live it, and you felt guilty for feeling the resentment. That guilt *is* a reactive attitude. You're still in the game, Mara. You're just playing it with a handicap. You're resenting yourself for resenting others.

  **Mara:** *(Laughs softly)* Touché. Maybe I am. But isn't it possible that the tension is the point? That we live in the gap between what we feel and what is true? I don't want to be cold, Theo. I want to be compassionate. But I want that compassion to be rooted in reality, not in a comforting story about free will.

  **Theo:** And I want to tell you that the story *is* the reality. There is no "view from nowhere" where you can check if our practices match the universe. We are in the universe. Our practices are part of it. If we stop holding each other responsible, we don't get "more reality." We get less humanity.

  **Mara:** Or maybe we get a more humane humanity. One that doesn't punish because of anger, but protects because of need.

  **Theo:** Without the anger, do you still care if the need is met? Or does it just become engineering?

  **Mara:** I don't know. I really don't.

  **Theo:** *(Signals for the check)* I don't either. But I do know I'm glad you're still my friend, even if you think I'm just a determined biological machine.

  **Mara:** *(Smiles)* And I'm glad you're mine, even if I think you're harboring a metaphysical illusion.

  **Theo:** Same time tomorrow for breakfast?

  **Mara:** Sure. Unless determinism intervenes.

  **Theo:** *(Stands up)* If it does, I won't resent you.

  **Mara:** *(Standing)* And if I don't show up, I won't expect you to forgive me.

  **Theo:** We'll see about that.

  *They part ways toward the elevators, both looking slightly unsettled, the argument unresolved, hanging in the air between them like the smoke from a candle just blown out.*
