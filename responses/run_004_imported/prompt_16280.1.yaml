answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s brother.

  Standing here, looking at my sister, I can't help but think about the last few years of her life. While most people were worrying about wedding venues, she was finishing a PhD. She studies some very big, very difficult questions about why we believe what we believe. Specifically, she asks whether the reasons we feel certain things are *true* are actually just reasons those feelings helped our ancestors survive.

  It's a heavy topic. It suggests that just because a conviction feels undeniable, that doesn't mean it's written in the stars. It might just be written in our DNA.

  Naturally, having heard this at the dinner table for half a decade, I started applying it to tonight. When you fall in love, it feels like fate. It feels like you've found something objective and eternal, as if the universe conspired to put two specific people in the same room. But if we follow the logic of my sister's work, we have to admit: there is a very good, very natural explanation for this feeling that has nothing to do with destiny. We are wired to bond. We are designed to pair up. Biology has its own reasons for making [Groom] look at [Bride] the way he does.

  Now, for a wedding toast, this is usually the part where I'm supposed to tell you to ignore that. To tell you that love transcends science. But I think that would be dishonest, and I know my sister wouldn't want a toast that ignores the hard questions.

  So, I want to suggest something else.

  If love were truly just fate—if it were a magical truth written in the stars—then it wouldn't require much from us. It would just *be*. You would be passive recipients of a cosmic arrangement.

  But the fact that there is a biological explanation, that there is a natural history to this feeling, doesn't subtract from its value. It changes what the value *is*. It means that the "truth" of their love isn't found in where it came from, but in what they choose to do with it.

  The feeling might have evolutionary roots, but the marriage is a human construction. The commitment isn't about tracking a pre-existing moral reality; it's about building a new one, together, day by day. The fact that nature gave them a push doesn't mean the work is done. In fact, it means the real work is just beginning.

  [Bride] and [Groom], you know better than anyone that a feeling, no matter how intense, is just a starting point. The reality of your marriage won't be found in the spark, but in the fuel. It won't be about whether you were destined to be here, but about the fact that you are *choosing* to be here, every single morning, even when the biology is quiet and the stars are silent.

  So, I am not going to toast to destiny. I am not going to toast to magic.

  I am going to toast to the work. To the choice. To the courage it takes to look at a natural, explainable world and decide to build something sacred within it anyway.

  To [Bride] and [Groom].
