answer: |-
  **Seminar Case Study 4.2: The Spandrel of San Marco vs. The Clitoral Complex**

  **Participants:**
  *   **Dr. Elena Vance:** Evolutionary Psychologist (Adaptationist leanings)
  *   **Dr. Marcus Thorne:** Evolutionary Biologist (Structuralist/Pluralist leanings)

  **Context:** *Post-seminar discussion following a lecture on Gould and Lewontin's 1979 "Spandrels" paper. Both have extensively reviewed Elisabeth Lloyd's 2005 meta-analysis, *The Case of the Female Orgasm*.*

  ***

  **Vance:** You looked skeptical during the lecture, Marcus. When I brought up the neurovascular complexity of the female orgasm as a candidate for selection, you rolled your eyes. But look at the machinery: vasocongestion, rhythmic pelvic contractions, the oxytocin cascade. It's metabolically expensive and anatomically specific. In biology, that degree of elaboration is usually a signature of function, not noise.

  **Thorne:** It's a signature of development, Elena. You're making the classic Panglossian error Gould and Lewontin warned against. You see a trait, assume it was optimized, and then work backward to find a use. The female orgasm is the textbook case of a developmental byproduct. The clitoris and the penis are homologous structures; they arise from the same embryonic tissue. Male orgasm is clearly adaptive—it's necessary for ejaculation and insemination. Female orgasm is the developmental echo of that. It's on a par with male nipples. We don't scramble to find a lactation function for men; why scramble for a reproductive function for female orgasm?

  **Vance:** Because male nipples don't involve a distinct hormonal signature or muscular contractions that vary across the cycle. Nipples are passive tissue; orgasm is an active event. But let's pause. We've both read Lloyd. If I start listing functions—"upsuck" theory for sperm retention, partner assessment, pair-bonding via oxytocin—and you just say "byproduct," we aren't doing science. We're trading just-so stories. Lloyd's central complaint was that adaptationists propose thirty-one different hypotheses without testing them against the null. So, I won't just assert function. I'll ask: What observation would force *you* to abandon the spandrel hypothesis?

  **Thorne:** That's fair. And I won't just assert "developmental constraint" without defining it. The spandrel hypothesis makes specific predictions. First, variability. If a trait is under strong directional selection for reproduction, it should be reliably triggered by the relevant stimulus—intercourse. Yet, as Lloyd documented, a significant percentage of women do not orgasm from intercourse alone, and the latency is highly variable compared to males. If orgasm were essential for sperm retention, selection should have tightened that link.

  **Vance:** But "reliability" is a slippery metric. Human feeding is adaptive, yet we don't all eat the same foods or at the same intervals. Maybe the stimulus isn't just penetration; maybe it's the broader mating context. But I accept your point on variability. Here is my falsification condition: If you can show that the capacity for orgasm has zero heritability linked to reproductive success, or if you can demonstrate that the neural pathways are *strictly* locked to the male developmental program with no independent variation in females, I concede. If the clitoral tissue develops entirely independently of the penile program in terms of neural innervation, the homology argument weakens.

  **Thorne:** I can't prove zero heritability, but I can point to the lack of positive evidence for a fitness correlate. But here is where I want to press you on the burden of proof. You're treating "Spandrel" as if it's a positive claim that requires as much evidence as "Adaptation." It isn't. It's the null hypothesis. The default position in evolutionary biology should be that a trait is non-adaptive until a fitness benefit is demonstrated.

  **Vance:** I disagree, and I think Lloyd would too, though for different reasons. Calling it a "null hypothesis" can be a shield. If "it's a spandrel" just means "you haven't found the function yet," then it's unfalsifiable. It becomes the reverse of Panglossianism: a dogma that nothing is an adaptation unless proven otherwise. That stifles inquiry. If I find that women who orgasm more frequently have higher conception rates in controlled studies, does that falsify your view?

  **Thorne:** Correlation isn't causation. That's the Lloyd trap. Even if you find that correlation, it could be that high-libido women have more sex, hence more conception. The orgasm is incidental. To falsify the spandrel claim, you'd need to show the orgasm *itself* causes the fitness increase, independent of copulation frequency. For example, if you could demonstrate a physiological "upsuck" mechanism that is *dependent* on the muscular contractions of orgasm, and that without those contractions, sperm retention drops significantly in competitive contexts.

  **Vance:** Okay, let's lock that in. If the uterine contractions during orgasm do not alter sperm transport compared to non-orgasmic insemination, the "sperm retention" adaptation is dead. I can live with that. But what about the "pair-bonding" hypothesis? The oxytocin release. If orgasm facilitates long-term bonding, and long-term bonding increases offspring survival in humans, isn't that a selectable function?

  **Thorne:** Now you're moving the goalposts to exaptation. Even if bonding is the result, was the orgasm *selected* for bonding, or is bonding a secondary use of a byproduct? Gould and Lewontin's point was that we must distinguish between current utility and evolutionary origin. I'm arguing about origin.

  **Vance:** And I'm arguing that origin is inferred from current design. But let's tackle your claim that "Spandrel" is testable. How do you test for a lack of function? It feels like proving a negative.

  **Thorne:** You test it by looking for the signatures of constraint. If female orgasm is a byproduct of male selection, we should see a genetic correlation between the sexes. We should see that the genes influencing orgasmic capacity in women are the same genes influencing ejaculatory latency in men. If we find female-specific genetic architecture for orgasm that has no male counterpart, the "developmental byproduct" story collapses. That is a testable claim.

  **Vance:** That's a strong criterion. So, if we find loci associated with female orgasmic dysfunction that are not expressed in males, you would accept that it has an independent evolutionary history?

  **Thorne:** I would accept it has an independent history. Whether that history is adaptive or a different kind of drift is a further question. But yes, that would break the strict homology argument.

  **Vance:** Good. Now, my turn for the burden of proof. You say the unreliability of orgasm during intercourse supports the spandrel view. But adaptationists argue that the clitoris is positioned for *other* reasons, or that the "unreliability" is a feature, not a bug—perhaps a filter for mate quality. If we find that orgasm frequency correlates with partners who have higher MHC diversity or better health markers, does that shift the burden back to you?

  **Thorne:** It shifts it, but it doesn't break the dam. Lloyd's analysis showed that most of these mate-choice studies rely on self-reporting and don't control for confounding variables. But let's say you prove that link definitively. I would still argue that the *capacity* for orgasm is the spandrel, while the *sensitivity* might be the adaptation. We have to be precise. The existence of the reflex is the spandrel claim. The threshold for triggering it could be selected.

  **Vance:** That seems like a concession. You're admitting the *regulation* of the trait is adaptive, even if the trait's origin wasn't.

  **Thorne:** Not necessarily. Regulation can evolve without the trait itself being the target. Think of it like a thermostat on a heater that was originally installed for a different reason. But here is the philosophical crux, Elena. Is "It's a spandrel" just our own version of storytelling?

  **Vance:** That's what worries me. If you can explain away every piece of evidence—variability is noise, consistency is regulation, homology is origin, independence is secondary adaptation—then the spandrel hypothesis is as flexible as the adaptationist one.

  **Thorne:** The difference is parsimony. The adaptationist story requires a new selection pressure for every trait. The spandrel story leverages known developmental constraints. But you are right to call me out. "Spandrel" is not a magic wand. It requires evidence of the constraint mechanism. I can't just say "it's a byproduct." I have to show the developmental pathway that drags the trait along.

  **Vance:** So, we agree on the methodology. No more "it must be adaptive because it exists" versus "it must be noise because it's variable." We need comparative data. If we look at other primates, and we find that female orgasm is absent in species where male orgasm is present, that hurts your homology claim.

  **Thorne:** Agreed. And if we find that female orgasm is ubiquitous in mammals but only linked to induced ovulation in some, that hurts your pair-bonding claim.

  **Vance:** And we both agree that Lloyd's critique stands: until we have that comparative and physiological data, we are in a state of agnosticism.

  **Thorne:** Precisely. But I will maintain one thing. The burden of proof lies with the person claiming design. In a court of law, innocence is the null. In evolution, non-adaptation should be the null. Extraordinary claims of optimization require extraordinary evidence.

  **Vance:** And I maintain that when the "innocent" trait involves a complex neurovascular event, assuming it's innocent until proven guilty is its own form of bias. It assumes complexity is cheap. But let's leave it there. We have our falsification conditions: Sex-specific genetic architecture for me; lack of fitness correlate despite controlled frequency for you.

  **Thorne:** Deal. Until then, we keep the spandrel in the archive, but we don't paint it as a fresco.

  **Vance:** And we don't pretend the fresco was painted by natural selection without finding the brushstrokes.

  ***

  **Discussion Questions for Seminar:**
  1.  Thorne argues that "Spandrel" is the null hypothesis. Vance argues that treating it as a default null can be as dogmatic as adaptationism. In practice, how should a biologist weight the prior probability of a trait being a spandrel vs. an adaptation?
  2.  Lloyd emphasizes the lack of comparative data in orgasm research. How does the absence of comparative phylogenetics affect the testability of both the Adaptationist and Spandrel positions in this dialogue?
  3.  Thorne suggests that finding female-specific genetic architecture would falsify the spandrel claim. Does this conflate "independent evolutionary history" with "adaptation"? Could a trait be non-adaptive yet not a byproduct of male selection (e.g., genetic drift)?
  4.  Analyze the distinction Thorne makes between the *origin* of the trait and the *regulation* of the trait. Does this distinction save the spandrel hypothesis from falsification, or is it a legitimate refinement?
