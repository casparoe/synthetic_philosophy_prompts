  epistemic status: still kinda annoyed about this, might be overthinking it.

  a couple weeks back I wrote a longish post on my blog (usual readership: like 30 people) and someone with a huge following screenshotted two sentences from it, totally out of context. within a day I had hundreds of quote-posts and replies from total strangers, half of them anon throwaway accounts who'll probably forget this ever happened by next week, all dogpiling on a version of my argument I never actually made. none of them are talking to me really, theyre all just performing for each other. I posted the full context as a follow-up and it changed nothing, a couple people even used it as more ammo. my partner says just log off and let it die, but I cant shake the feeling that if I don't correct the record the wrong version just becomes the permanent truth in everyone's head. is there some actual structure to why this feels so unresolvable, or am I just being thin-skinned about internet strangers, and either way, what's the rational move here?
