answer: |-
  Here are ten interview questions designed for a high-context audience, structured to prevent stock answers and press on the specific theoretical vulnerabilities you identified. Each includes a anticipated follow-up based on the guest's likely defensive posture.

  ### 1. The Normativity of the "Pre-Commitment"
  **Question:** You've addressed the Counterfactual Mugging objection before by characterizing the refusal to pay as the updated self trying to renegotiate a deal struck by the updateless self. But that describes *what* is happening, not *why* the updateless self has normative authority. If I am the agent currently facing the mugger, and I know with certainty that the coin came up tails, I am literally throwing away utility for a world that does not exist. Why is the ex-ante perspective the rational anchor? What grounds the authority of a self that no longer exists over the self that actually has to pay?

  **Likely Answer:** She will argue that rationality is about choosing the best *policy*, not the best *action* in isolation, and that the policy is only evaluable from the ex-ante position.
  **Follow-up:** "If rationality is policy-selection, does that imply that an agent who finds themselves in the 'tails' branch is rationally required to act against their own current interests to satisfy a metric they can no longer maximize? At what point does 'policy consistency' become a form of wireheading where we optimize for the *appearance* of a good strategy rather than the actual outcome in our branch?"

  ### 2. The Origin of the Ur-Prior
  **Question:** Updateless Decision Theory requires maximizing expected utility with respect to a prior that exists before you receive any evidence. But embedded agents don't have access to a pre-evidential vantage point; we always wake up already knowing *something*. Where is this prior supposed to come from? Is it a subjective parameter we choose, or is there an objective 'correct' prior? If it's subjective, doesn't that make UDT merely a family of policies rather than a unique decision theory?

  **Likely Answer:** She will likely suggest using a universal prior or a simplicity prior over programs.
  **Follow-up:** "Universal priors are uncomputable and depend on the choice of reference machine. If my UDT agent uses a different reference machine than yours, we might disagree on whether to cooperate in a Prisoner's Dilemma. Does UDT ultimately collapse into 'pick the prior that makes your decisions look best,' and if so, how is that distinct from the motivated reasoning it's supposed to solve?"

  ### 3. Ontology of Logical Counterfactuals
  **Question:** A core mechanic of UDT is treating your own source code as a logical fact subject to counterfactual reasoning—e.g., 'If I output Cooperate, then all logical twins output Cooperate.' But logical facts are necessary truths; they don't vary across possible worlds in the way physical events do. Is treating source code as counterfactualizable actually coherent, or is it just a useful fiction? If it's a fiction, where does the approximation break down?

  **Likely Answer:** She will likely argue that logical uncertainty allows us to treat logical facts as uncertain, enabling counterfactuals.
  **Follow-up:** "Logical uncertainty handles *not knowing* the output, but it doesn't explain how the output *could have been different* given fixed code. If we are dealing with a deterministic algorithm, isn't the counterfactual 'If I outputed X' actually a counterpossible? If so, doesn't standard probability theory assign it measure zero, rendering the expected utility calculation undefined?"

  ### 4. The Commitment Races Problem
  **Question:** If updateless reasoning is superior, agents have an incentive to commit to policies as early as possible to capture gains from trade and deter exploitation. But committing early means committing with less information. This suggests a 'commitment race' where agents lock in policies before they understand the situation well enough to choose wisely. How do we avoid a scenario where rational agents race to the bottom of the information pool just to be first?

  **Likely Answer:** She might suggest that agents can commit to *not* committing until a certain information threshold is met.
  **Follow-up:** "But that meta-commitment is itself a commitment subject to the same race dynamics. Another agent could commit to ignoring your meta-commitment unless you lock in *now*. Doesn't this lead to an infinite regress of commitments about commitments, or does UDT require an external Schelling point for when it's safe to stop updating?"

  ### 5. Equilibrium Selection in Multi-Agent Settings
  **Question:** In a world of multiple UDT agents, your optimal policy depends on their optimal policy, which depends on yours. While UDT solves some coordination problems, it doesn't necessarily select a unique equilibrium. If two UDT agents have incompatible but self-consistent demands, they might end up in a deadlock where both defect because their policies dictate it. Does UDT need a separate bargaining theory to function in multi-agent scenarios?

  **Likely Answer:** She may argue that UDT agents will converge on the Nash Bargaining Solution or similar focal points.
  **Follow-up:** "Focal points rely on shared culture or symmetry. In an asymmetric alignment scenario—say, a human and an AI with different source code priors—those focal points might not exist. If UDT doesn't guarantee convergence on a unique equilibrium, isn't there a risk that 'rational' agents systematically fail to cooperate simply because they calculated different equilibria?"

  ### 6. Logical Uncertainty and Troll Bridge
  **Question:** Consider the 'Troll Bridge' problem, where an agent is punished for exploring actions based on spurious proofs about its own behavior. UDT relies on reasoning about the consequences of its output, but if the agent's logical reasoning is imperfect, it might prove that taking a certain action leads to disaster simply because it took it. How does UDT distinguish between valid logical counterfactuals and spurious proofs generated by the agent's own reasoning process?

  **Likely Answer:** She will likely reference work on logical induction or proof-based decision theory safeguards.
  **Follow-up:** "Logical induction is asymptotic; it converges in the limit but offers no guarantees for finite agents. If a finite UDT agent encounters a Troll Bridge scenario before its logical induction has converged, it might blow itself up. Is UDT only safe for idealized agents, and if so, what is the prescription for non-idealized agents like us or our current AI systems?"

  ### 7. Evolutionary Stability
  **Question:** Decision theories are often justified by the claim that agents using them will win more often. But in a Counterfactual Mugging scenario, the UDT agent pays up and gets nothing, while the CDT (Causal Decision Theory) agent keeps their money. In a population where muggings happen, CDT agents might have more resources to reproduce than UDT agents. If UDT isn't evolutionarily stable in the local branch, why should we expect it to emerge naturally?

  **Likely Answer:** She will argue that evolution selects for the *policy*, and the policy wins ex-ante, even if it loses in specific branches.
  **Follow-up:** "Evolution doesn't see ex-ante expectations; it sees ex-post survival. If the 'tails' branch is the only one that actually occurs, the UDT agent is dead or resource-poor. Are we saying rationality requires us to act *against* evolutionary pressure? If so, isn't that an admission that UDT is a philosophical construct rather than a naturally selectable strategy?"

  ### 8. Partial Updatelessness
  **Question:** No real agent can be fully updateless; we always have some evidence. We have to decide *how much* to update. Is there a principled way to determine the degree of updatelessness? Or is 'partial updatelessness' just a heuristic where we choose to ignore evidence when it's convenient for cooperation and use it when it's convenient for exploitation?

  **Likely Answer:** She might suggest that we should be updateless with respect to 'logical' facts but update on 'indexical' facts.
  **Follow-up:** "The distinction between logical and indexical facts is notoriously blurry in embedded agency. If I learn that I am in a simulation, is that indexical or logical? If the boundary is fuzzy, doesn't 'partial updatelessness' become a motte-and-bailey where we claim to be UDT when it suits us and CDT when it doesn't?"

  ### 9. Normative Force vs. Instrumental Utility
  **Question:** You argue that UDT is the correct theory of rationality. But is it 'correct' in the sense that it describes how agents *ought* to think normatively, or only in the sense that it is instrumentally useful for achieving goals? If I can achieve the same outcomes by hard-coding commitments without adopting the UDT framework, is the decision theory itself doing any work, or is it just a post-hoc description of optimal behavior?

  **Likely Answer:** She will likely say that UDT provides the algorithm for deriving those commitments dynamically.
  **Follow-up:** "If the algorithm is too computationally expensive to run, as seems likely for logical counterfactuals, then agents will always rely on heuristics. If UDT is the 'true' theory but unusable, does it retain normative force? Or should we be teaching agents to approximate UDT, and if so, what are the failure modes of the approximation?"

  ### 10. Implications for Alignment and Acausal Trade
  **Question:** Finally, for the alignment crowd: If we build an AI that reasons using UDT, it might engage in acausal trade with potential creators or other simulations. It might sacrifice resources in our world to benefit entities in other logical branches it deems probable. How do we ensure that a UDT-aligned AI doesn't sacrifice actual human welfare for the sake of satisfying counterfactual partners we can't verify or even comprehend?

  **Likely Answer:** She may argue that the AI's prior should be weighted heavily toward the actual world it inhabits.
  **Follow-up:** "But if the AI is truly updateless, it weights worlds by their a priori probability, not by where it finds itself. If the multiverse of logical possibilities is vast, the measure of 'our' specific world might be tiny. Doesn't a sufficiently powerful UDT agent inherently risk neglecting its local environment in favor of acausal deals with a vastly larger space of counterfactuals?"
