answer: |-
  This is an excellent puzzle, and you have correctly identified one of the central tensions in the contemporary philosophy of language regarding slurs. You are not collapsing a distinction that a working philosopher would miss; rather, you have run headfirst into the debate between **semanticism** (the derogatory content is part of the meaning) and **pragmaticism** (the derogatory content is contextually implied), and you have rightly spotted the moral costs of a naive semantic view.

  Your reasoning goes wrong at a specific juncture: the inference from *"the derogatory content is semantic"* to *"the sentence is true (if the target is in the group) and the objection is merely tonal."*

  There are at least three robust ways philosophers have developed to block that conclusion while accepting your premise that cancelability fails. Here is how the landscape breaks down.

  ### 1. The "False Claim" Strategy (Combinatorial Externalism)
  The most direct counter to your worry comes from Christopher Hom. He agrees with you that the derogatory content is semantic and truth-conditional. However, he disagrees with your conclusion about the truth value.

  On Hom's view (**Combinatorial Externalism**), the semantic content of a slur is complex. It doesn't just mean "member of group G." It means "member of group G *who is deserving of contempt/oppression because of being in G*."

  *   **Neutral counterpart:** "X is Chinese." (True if X is Chinese.)
  *   **Slur:** "X is [slur]." (True only if X is Chinese **AND** X is deserving of contempt for being Chinese.)

  Since no one is actually deserving of contempt for being Chinese, the truth conditions of the slur are **never satisfied**. Therefore, when you say "X is a [slur]," you are not asserting something true in a low register; you are asserting something **false**.

  This preserves the moral weight. The problem isn't etiquette; it's that the speaker is making a false, harmful claim about the target's moral status. The reason you can't cancel it ("...but I don't mean they are contemptible") is that you are explicitly denying part of the truth conditions of the word you just used. It's like saying, "He is a bachelor, but he is married."

  ### 2. The "Presupposition" Strategy
  Another major camp (including philosophers like Bianchi and Cepollaro) argues that the derogatory content is not an *assertion* (the main point of the sentence) but a **presupposition**.

  In semantics, presuppositions are background assumptions that must be accepted for the sentence to have a truth value at all.
  *   **Example:** "The King of France is bald."
  *   **Presupposition:** There is a King of France.
  *   **Test:** If you say, "The King of France is bald, but there is no King of France," it sounds contradictory/infelicitous, not just false.

  If slurs work this way, using the word presupposes the inferiority or contemptibility of the group. This explains the **non-cancelability** (you can't easily cancel a presupposition mid-sentence) without making the derogation the main truth-conditional claim.

  Why does this avoid the "etiquette" problem? Because if the presupposition is false (i.e., the group is *not* inferior), the utterance suffers from **presupposition failure**. It renders the speech act infelicitous or void. It's not that you told the truth rudely; it's that you attempted to engage in a communicative act that relies on a false normative framework. You are forcing the listener to accommodate a racist worldview just to process the sentence.

  ### 3. The Expressivist Strategy
  Philosophers like Elisabeth Camp argue that slurs are not primarily descriptive at all. They are **expressive**.

  When you use a slur, you aren't just describing the world; you are performing an act of subordination or expressing a commitment to a derogatory perspective. This is non-cognitivist: the slur doesn't have a truth value in the same way a statement of fact does.

  *   **Analogy:** Saying "Ouch!" isn't true or false; it expresses pain. Saying "Boo, X!" isn't true or false; it expresses disapproval.
  *   **Application:** "X is a [slur]" is akin to "X is from group G, and Boo G!"

  On this view, the cancelability test fails because you cannot coherently express an attitude and then immediately deny expressing it ("Boo X! ... just kidding, no Boo"). The moral objection isn't about truth or etiquette; it's about the **action** performed. The speaker is actively enacting harm or solidarity with an oppressive ideology, regardless of the descriptive accuracy regarding the target's group membership.

  ### What about Prohibitionism?
  You mentioned Anderson and Lepore's **Prohibitionism**. This view is indeed the most deflationary. They argue that slurs have the *exact same semantic content* as their neutral counterparts. The only difference is that the state (or society) has prohibited the use of that specific phonetic string.

  *   **Why it's confusing:** It feels like it dodges the question. *Why* is it prohibited? If the content is the same, what makes the word dangerous?
  *   **The Defense:** Anderson and Lepore want to avoid attributing racist content to the language itself. They argue the harm is entirely in the **violation of the norm**. Using the word signals that you are the kind of person willing to violate a protective social norm.

  Most philosophers find Prohibitionism unsatisfying for the reasons you suspect: it makes the moral wrongness seem arbitrary (like a traffic law) rather than intrinsic to the harm of the speech. It struggles to explain why using the slur in a private context (where no norm is publicly violated) still feels morally fraught.

  ### Resolving Your Dilemma
  You asked: *Does the cancelability data really push us toward treating slur-avoidance as basically an etiquette norm dressed up in moral language?*

  **No.** The cancelability data pushes us to say the derogatory content is **conventional** (part of the word's stable meaning) rather than **conversational** (dependent on context). But "conventional meaning" does not equal "true description."

  Your reasoning chain broke here:
  1.  Derogation is semantic. (Plausible)
  2.  Therefore, the sentence asserts the target is in the group. (True)
  3.  **Therefore, the sentence is true if the target is in the group.** (False)
  4.  Therefore, the objection is just tone. (False)

  If you adopt Hom's view, step 3 is false because the semantic content includes a false moral claim.
  If you adopt the Presupposition view, step 3 is category-error because the derogation isn't the assertion being evaluated for truth.
  If you adopt Expressivism, step 3 is false because the utterance isn't truth-apt.

  ### Summary
  You are right that the Gricean test rules out the idea that slurs are just neutral words with added *implicature*. But that doesn't force you to accept that they are *true descriptions with bad tone*.

  The consensus among philosophers who work on this is that the derogatory force is indeed "built-in" (semantic/conventional), but that built-in force functions either as a **false truth-condition** (making the statement false), a **failed presupposition** (making the statement infelicitous), or an **expressive act** (making the statement a harmful action). Any of these three preserves the strong moral intuition that using a slur is substantively wrong, not merely a breach of etiquette.

  If you want to read one paper to untangle this, I recommend **Christopher Hom, "The Semantics of Racial Slurs" (2008)** for the "it's semantic but false" argument, or **Elisabeth Camp, "Slurring Perspectives" (2013)** for the expressivist angle. Both directly address the worry you raised about the moral stakes being reduced to politeness.
