answer: |-
  This is a fantastic question, and it touches on one of the most common misconceptions about the history of science: **anachronism.** We tend to look at the past through the lens of what we know today.

  Here is the short answer: **Your professor was right, and you should definitely read that section before the next class.**

  Turing was not being sarcastic, nor was he setting up a strawman to mock. In Section 6 of *Computing Machinery and Intelligence*, under the heading "The Argument from Extrasensory Perception," Turing writes verbatim:

  > "The statistical evidence, at least for telepathy, is overwhelming."

  He goes on to propose that if telepathy is real, the Turing Test (the Imitation Game) needs to be adjusted to account for it. He even suggests the interrogator might need to sit in a "telepathy-proof room."

  However, your intuition isn't "wrong" in the way you think. It doesn't mean Turing was irrational or that his legacy is tarnished. Here is the breakdown of why this happened, why it makes sense in context, and how you can use this to look really sharp in your next lecture.

  ### 1. The Historical Context (1950 vs. Now)
  In 2024, ESP is considered pseudoscience. In 1950, the picture was much murkier.

  During the 1930s and 40s, **J.B. Rhine** at Duke University had published famous experiments using Zener cards (cards with simple symbols like circles, squares, waves) that claimed to show statistical proof of telepathy and clairvoyance. These results were published in respected journals and debated seriously by the scientific community. Even Nobel laureates and prominent physicists were open to the possibility.

  Turing was an empiricist. His brilliance wasn't just in logic; it was in observing data. If the prevailing scientific data of 1950 suggested "overwhelming statistical evidence" for telepathy, Turing was not going to ignore it simply because it felt weird. To dismiss it out of hand would have been *unscientific*.

  ### 2. It Was a "Control Variable," Not a Belief System
  You interpreted Turing's mention of ESP as him endorsing magic. A better way to read it is that he was **stress-testing his own experiment.**

  Turing was trying to define a test for *intelligence*. He was asking: "Are there any phenomena that could allow a human to pass this test, or a machine to fail it, that have nothing to do with thinking?"

  *   **The Logic:** If telepathy exists, a human interrogator might be able to sense which participant is human without asking questions. This would invalidate the test.
  *   **The Solution:** Turing proposes isolating the participants to prevent telepathic leakage.

  He wasn't saying, "I believe in ghosts." He was saying, "For the sake of rigorous experimental design, we must account for all variables, even the controversial ones." This actually reinforces his image as a rigorous logician, rather than cracking it. He was ensuring that if a machine passed the test, it was definitely due to intelligence, not because the human was disqualified via psychic powers.

  ### 3. Turing Wasn't a "Pure Logician" Robot
  You mentioned having an image of Turing as the "father of AI as pure logician." While he founded computer science, his intellectual interests were much broader and more biological than people realize.

  Later in his life (after 1950), Turing became obsessed with **morphogenesis**—how biological organisms develop their shapes (like why leopards have spots). He used mathematics to model biological growth. He was deeply interested in how the physical world produced complex systems.

  To Turing, the mind was a natural phenomenon. If telepathy turned out to be a natural phenomenon (like gravity or electricity), it was something a science of intelligence had to account for. He didn't view the universe as strictly mechanical in a way that precluded unknown physical forces.

  ### How to Handle the Next Class
  Your professor gave you the classic Socratic "go check the text" response because they knew the text would be more convincing than they could be. They weren't trying to be annoying; they were trying to get you to engage with the primary source.

  Here is how you can walk into the next lecture and turn this into a win:

  1.  **Read Section 6 of the paper.** (It's short).
  2.  **Don't apologize for being wrong.** Instead, frame it as a discovery about historical context.
  3.  **Say something like:** "I read the section on ESP. I was surprised to see he treated the statistical evidence as 'overwhelming.' It makes me realize how much the scientific consensus on parapsychology has shifted since 1950. It seems like he was including it to ensure the Imitation Game was airtight against *any* non-computational explanation, not necessarily because he was a believer."

  **The Takeaway:**
  Turing remains one of the most rigorous thinkers in history. But rigor doesn't mean knowing everything; it means taking the available data seriously, even when that data turns out to be wrong later on. This doesn't crack his image; it humanizes him and shows how science evolves.

  Your professor was testing whether you trusted your assumptions about Turing more than Turing's actual words. Now you know.
