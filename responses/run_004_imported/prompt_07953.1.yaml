  3.  **Historical Contextualization (The "Why"):**
      *   *Time Period:* 1950. Parapsychology was not yet fully fringe. J.B. Rhine's work at Duke University was influential. Many respected scientists (even Nobel laureates) were open to the possibility.
      *   *Turing's Mindset:* Turing was rigorous, but he was also open-minded about biological and physical phenomena. He was interested in morphogenesis (biology) later in his life. He wasn't a "pure logician" in the sterile sense; he was a natural philosopher.
      *   *The Argument:* Turing's point wasn't "ESP is real." It was "If ESP is real, the Turing Test needs to account for it." Specifically, if a human can read minds, a machine might fail the test not because it isn't intelligent, but because the human interrogator can tell the human apart via telepathy. Or, conversely, if the machine could simulate telepathy (random number generation), it might confuse the issue. He suggests a "telepathy-proof room."

