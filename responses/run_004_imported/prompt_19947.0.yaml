answer: |-
  Your friend is correct, and their claim is mathematically coherent. It is not self-contradictory, though it feels that way because it violates our intuitive understanding of "averages."

  The phenomenon you are seeing is a result of **convexity** in the expected value (EV) function, combined with the difference between **static analysis** (what you are doing when you examine the bets head-to-head) and **equilibrium analysis** (what the solver is doing).

  Here is the breakdown of why the medium bet dies, why your friend is right, and how to use this at the tables.

  ### 1. The Math: Why a Mix Can Beat a Single Option
  Your confusion stems from this statement: *"How can a single option lose to a combination of two alternatives if it doesn't lose to either alternative by itself?"*

  In a linear world, this would be impossible. If Option A is worth 10 and Option B is worth 20, any mix of them is worth between 10 and 20. If Option M (Medium) is worth 15, it beats A but loses to B. It cannot lose to *both* and the *mix*.

  However, poker EV in polarized spots is not linear; it is **convex**. Imagine a graph where the X-axis is Bet Size and the Y-axis is EV. In many river spots, this curve looks like a smile (U-shaped), not a straight line.

  *   **Check (Size 0):** High EV (you realize equity with bluff catchers, trap with nuts).
  *   **Overbet (Size Big):** High EV (maximum pressure on opponent, max value from nuts).
  *   **Medium Bet:** Lower EV (the bottom of the smile).

  If you draw a straight line connecting the Check EV and the Overbet EV, that line represents the **weighted average** (the mix). Because the curve dips below that straight line, the Medium bet sits *under* the line.

  **The Numerical Example:**
  *   **EV(Check):** 100 chips
  *   **EV(Overbet):** 140 chips
  *   **EV(50/50 Mix):** 120 chips (The average of 100 and 140)
  *   **EV(Medium Bet):** 110 chips

  In this scenario, the Medium bet (110) beats the Check (100). It loses to the Overbet (140). But critically, **it loses to the Mix (120).**

  The solver prefers the Mix because it allows you to capture the high leverage of the overbet *sometimes*, while retaining the safety of the check *other times*, without exposing yourself to the specific exploitation that the medium size invites.

  ### 2. The Poker Logic: Why is the Curve Convex?
  Why does the EV dip in the middle? Why isn't a 75% pot bet just "three-quarters as good" as a pot bet?

  It comes down to **leverage** and **indifference points**.

  **A. Leverage on Bluff Catchers**
  In a polarized spot, you have nuts and air. Your goal with your value hands is to get called by the opponent's bluff catchers. Your goal with your bluffs is to make those same bluff catchers fold.
  *   **Overbet:** You put the maximum amount of money at risk. This forces the opponent to put their stack (or a large portion) on the line to catch you. This creates maximum "pain." Even if they call less often, the times they do call, you win a massive pot with your nuts. The times they fold, your bluffs succeed against a wider range of hands because the price is so steep.
  *   **Medium Bet:** You give the opponent "pot odds" that are comfortable. A 50% or 75% pot bet often gives the opponent exactly the price they need to call with their marginal hands. You aren't risking enough to scare them out, but you aren't building a big enough pot to maximize your value. It is the "worst of both worlds."

  **B. Protecting the Checking Range**
  If you only overbet, the opponent can fold 100% of the time (if your bluff ratio is too high) or call 100% of the time (if you're too value-heavy).
  By mixing in a Check, you allow yourself to realize equity with hands that can't withstand an overbet call (like medium-strength value or bluff catchers).
  The Medium bet is redundant here. It doesn't pressure the opponent enough to justify risking the chips compared to the Overbet, and it risks too many chips compared to Checking.

  ### 3. Addressing Your "Head-to-Head" Observation
  You mentioned: *"Compared head-to-head... there are plenty of opponent holdings and responses where the medium bet does better."*

  This is the critical misunderstanding. You are likely analyzing this **statically** (against a fixed opponent strategy), while the solver analyzes **dynamically** (against an adjusting opponent strategy).

  *   **Your View:** "If the opponent calls the same way they do against the overbet, my medium bet looks profitable."
  *   **Solver's View:** "If we choose the Medium Bet strategy, the opponent will *adjust* their calling frequency to exploit that specific size."

  Because the Medium Bet size is "standard," it is easier for the opponent to defend optimally against it. They know exactly what price they are getting. By mixing extreme sizes (Check/Overbet), you create uncertainty. You force the opponent to play a strategy that is sub-optimal against *one* of your sizes in order to be acceptable against the other. The Medium bet removes this uncertainty, allowing the opponent to play closer to perfect defense, which lowers your EV.

  ### 4. Practical Takeaways for Human Play
  You cannot run a solver at the table, but you can internalize the logic that drives these decisions. Here is how to apply this to your game:

  **1. Identify Polarization**
  This strategy only applies when your range is truly polarized (Nuts vs. Air).
  *   *Ask:* "Does my range have medium strength hands?"
  *   *If Yes:* Use medium sizes. You want thin value.
  *   *If No:* (e.g., you are the preflop aggressor on a A-K-7-2-2 board), lean toward extremes.

  **2. Commit or Give Up (The "Barbell" Strategy)**
  In polarized river spots, avoid "default" sizing (50%, 66%, 75%). These are the "medium" sizes the solver hates.
  *   **If you want value:** Bet big (125% to 200%). Make the opponent pay a premium to catch you.
  *   **If you want to bluff:** Bet big (same size). Make the fold equity worth the risk.
  *   **If you want to control pot/check-back:** Check. Do not bet small just to "see where you are." In polarized spots, betting small with air is usually a burn of chips, and betting small with value leaves money behind.

  **3. Use Bet Sizing to Define Ranges**
  Since you know solvers ignore medium sizes in these spots, you can use that against opponents who *don't* know this.
  *   If an opponent suddenly uses a massive overbet on a polarized board, their range is likely very polarized (Nuts or Air).
  *   If they use a small/medium bet, they often have a merged range (medium strength hands).
  *   You can exploit this by folding your bluff catchers to the overbet more often, and calling the medium bets more often.

  **4. Protect Your Check-Backs**
  If you decide to check some of your strong hands (to balance your checking range so you can bluff-check sometimes), ensure you actually do check them. Don't check a nut hand and then feel regretful when the opponent checks back. That regret is the "cost" of making your bluffs profitable.

  ### Summary
  Your friend is right. A mixed strategy of Check and Overbet creates a "straight line" of expected value that sits *above* the curved, lower value of the Medium Bet. This happens because medium sizes in polarized spots offer the opponent the best risk/reward ratio to defend against you, whereas extremes force them into mistakes.

  **The Rule of Thumb:** On the river, if your range is nuts or air, don't dabble. Either put them to the test for their stack (Overbet) or give up the initiative (Check). The middle ground is where EV goes to die.
