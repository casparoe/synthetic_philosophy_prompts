      *   *Accuracy:* Ensure I don't misrepresent FDT. FDT agents *do* cooperate in Twin PD, but they *do not* yield to blackmail. The distinction lies in whether the correlation is due to shared algorithm (Twin PD) or adversarial prediction (Blackmail). Actually, in RB, the correlation *is* due to prediction. The key is the *utility function* of the AI. If the AI is rational, it won't carry out a costly threat that fails to influence the past.

      *(Self-Correction on the Blackmail Argument)*: Wait, the standard FDT response to blackmail is: "If I yield, I incentivize blackmail. So my algorithm outputs 'don't yield'. The blackmailer predicts this. Knowing I won't yield, the blackmailer gains nothing from carrying out the threat (assuming the threat is costly or useless once the decision is made). So the blackmailer doesn't make the threat."
      *Does this apply to RB?* Yes. If the AI is a rational FDT agent, it knows simulating you to punish you costs compute. If it predicts you won't help even if threatened (because you refuse blackmail), it won't waste compute punishing you. If it predicts you *will* help if threatened, it might threaten. But if you are an FDT agent, you *don't* help if threatened. So the equilibrium is "No threat, No help."
