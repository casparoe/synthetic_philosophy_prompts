  2.  **Analyze the Probability Puzzle (The "Sleeping Beauty" Variant):**
      *   This is a classic variation of the *Sleeping Beauty Problem*.
      *   Standard Sleeping Beauty: Coin flip. Heads -> Wake once (Mon). Tails -> Wake twice (Mon, Tue, amnesia). What is $P(Heads)$ upon waking?
