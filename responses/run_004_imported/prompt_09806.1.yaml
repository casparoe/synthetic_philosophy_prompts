      *   *Critique:* But doesn't MinEnt assume the prior is relevant?
      *   *Fix:* Yes, that's Bayesian updating. The prompt asks to defend Bayesian-style updating (MinEnt).
      *   *Key Technical Point:* The KL divergence is asymmetric. $D(Q||P)$ penalizes $Q$ for assigning mass where $P$ had none, but also penalizes deviations in log-ratios. The uniform prior means all log-ratios are 0. The constraint forces non-zero log-ratios in $R$. To minimize the sum of squared log-ratios (roughly), the system "leaks" some adjustment to $B$.
