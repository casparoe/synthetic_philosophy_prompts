answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], a friend of the bride. And for those of you who *do* know me, you're probably wondering if I'm going to finish this toast without referencing the fact that, two nights ago at the rehearsal dinner, Priya and I nearly came to blows over a comma.

  To the relatives in the back: don't worry. We're friends. In the legal world, arguing is just how we show affection. It's like a love tap, but with more case citations.

  But the argument was real. Priya, who currently clerks for a judge known for being a committed textualist, found a typo in the vows she and Daniel drafted. A tiny one. She wanted to fix it before tomorrow. Her reasoning was that even hardline textualists accept the "scrivener's error" exception. Basically, if it's obvious you meant to write "the" and you wrote "teh," you can fix it without violating the sanctity of the text.

  I, playing the role of the annoying gadfly, argued that reaching for *any* intent-based exception, however narrow, is basically admitting that purposivism wins in the end. Priya did not concede. She actually rolled her eyes at me. In front of her grandmother.

  I bring this up not to re-litigate the dinner, but because, in preparing for today, I realized that this argument is actually the perfect framework for understanding why Priya and Daniel work so well together.

  For the non-lawyers here: Textualism is the belief that you stick to the words you agreed to, precisely as written. Purposivism is the belief that you look at the spirit behind the agreement, the *why* rather than just the *what*.

  And when I watch them together, I see that a successful marriage requires both.

  Priya, you are the textualist in this relationship. You are the fidelity to the text. You are the promise kept exactly as made. When you say you'll be there, you are there. When you say you'll handle the budget, the budget is handled. You bring precision, integrity, and a deep respect for the commitments you make. You ensure that the "contract" of this marriage is solid, enforceable, and clear.

  Daniel, you are the purposivist. You look at the spirit. You understand that sometimes, life introduces typos. Sometimes the text doesn't quite match the moment. And when that happens, you don't get hung up on the letter of the law; you ask, "What is the purpose here? The purpose is to be happy. The purpose is to be kind. The purpose is to go get tacos instead of cooking because we're tired."

  If a marriage is only textualist, it becomes rigid. It becomes a courtroom where every misplaced sock is a breach of contract. But if a marriage is only purposivist, it becomes unmoored. Promises become suggestions. Intentions fade because they aren't written down in action.

  But together? You have found the scrivener's error exception.

  You have agreed that when life inevitably introduces typos—when one of you says something you didn't mean, when plans go wrong, when the text of your day doesn't match the intent of your hearts—you will grant each other the exception. You will correct the error not to win an argument, but to honor the purpose.

  Priya, you taught me that fidelity to the text matters. But watching you with Daniel, I've learned that the highest fidelity is to the person, not just the words. Daniel, you've shown us that purpose matters, but purpose is nothing without the structure to hold it.

  So, to the clerks in the room: You can stop briefing the issue. The holding is clear.
  And to the family: You can stop worrying. They speak different dialects, but they're reading from the same book.

  Priya and Daniel, my advice is this: Be textualists about the big things. Loyalty. Respect. Kindness. Stick to the text of those vows no matter what. But be purposivists about the little things. The typos. The bad days. The misunderstandings. Look to the purpose, which is love.

  You two have already proven that you can argue about the theory of interpretation for an hour and still show up the next day ready to make it official. That's not just good law. That's good love.

  Please raise your glasses.

  To Priya and Daniel. May your life together be free of scrivener's errors, but rich in exceptions. May you always honor the text of your vows, and always serve the purpose of your hearts.

  To the happy couple.
