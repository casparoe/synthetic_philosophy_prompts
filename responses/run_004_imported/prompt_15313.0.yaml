          *   There is an $x$.
          *   $x$ is King of France.
          *   For all $y$, if $y$ is King of France, $y$ is $x$ (uniqueness).
          *   $x$ is bald.
      *   **Truth Value:** False (because the existence clause fails).
      *   **Negation:** "The present King of France is not bald." ($\neg K$)
      *   **The Ambiguity (Scope):** Russell distinguishes between *primary* and *secondary* occurrence of the description.
          *   **Wide Scope (Primary):** $\exists x (Kx \land \forall y (Ky \rightarrow y=x) \land \neg Bx)$
              *   "There is a unique King of France, and he is not bald."
              *   Truth Value: False (existence fails).
          *   ** Narrow Scope (Secondary):** $\neg [\exists x (Kx \land \forall y (Ky \rightarrow y=x) \land Bx)]$
              *   "It is not the case that there is a unique King of France who is bald."
              *   Truth Value: True (because the inner bracket is false).
      *   **Law of Excluded Middle:** LEM applies to propositions. The ambiguity lies in *which* proposition the English sentence corresponds to. If we interpret the negation as wide scope, LEM doesn't force it to be true just because the affirmative is false (they are contraries, not contradictories, in that specific parsing). If we interpret it as narrow scope, it is the contradictory, and it is true.

