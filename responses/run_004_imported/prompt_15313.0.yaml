      *   If interpreted as the logical contradictory (narrow scope), it is true, *but* it does not assert the existence of the King. It merely denies the conjunction of existence + baldness.
      *   If interpreted as asserting existence + non-baldness (wide scope), it is false.
      *   Therefore, Russell *does* solve the "sneaking existence in the back door" problem by showing that the true negation doesn't carry the existential commitment.

