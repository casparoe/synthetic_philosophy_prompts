answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Dan's. And looking around the room, I see we have a bit of a mix tonight. We've got Dan's family, who know him best, and we've got his colleagues from the bank, who know him… well, in spreadsheets.

  I want to be honest with you all. I wasn't sure what to say tonight. Actually, last night, my friend Priya and I got into a proper argument over dinner about exactly this moment.

  Priya reckons Dan quitting to make furniture is the fulfillment of a prophecy. Back in 1930, the economist John Maynard Keynes wrote that by now, technology would have solved our basic problems. He thought we'd be working fifteen-hour weeks, spending the rest of our time on "the art of life"—making beautiful, pointless things. Priya says Dan is the vanguard. He's covered his needs, and now he's choosing beauty over grind.

  I played devil's advocate. I told her Keynes was naive. He forgot that humans have "relative needs." We don't just want *enough*; we want to do better than the person next to us. That game is insatiable. You can't win it, so you don't stop playing. That's why half of Dan's old team, who could probably afford to scale back, are still here on Monday.

  So, standing here, I have to ask: Is Dan proving Keynes right? Or did he just get lucky in a way the rest of us haven't?

  And that brings me to the tricky part. If Dan is the hero of this story, does that make everyone staying behind a chump?

  Absolutely not.

  Because what Dan is doing isn't actually about working less. Anyone who's seen his workshop knows he's going to be working harder than ever. He's trading the abstract stress of finance for the physical stress of wood. He's not opting out of effort; he's opting into *tangible* effort.

  Keynes thought we'd stop caring about status. I don't think Dan has stopped caring about status. I think he's just changed the currency. He's no longer chasing a bonus number on a screen; he's chasing the grain in a piece of oak. He's chasing the fact that in fifty years, a chair he made might still be holding someone up while he's gone.

  For his colleagues here: You aren't chumps. You are playing a necessary game in a complex world. But Dan has found a rare thing: the privilege of choice. He has the safety net to step off the treadmill, and the courage to admit that the treadmill wasn't taking him where he wanted to go.

  So, is this Keynes's utopia? Maybe not. We're probably all still going to be anxious, status-obsessed humans. But tonight, we celebrate a friend who decided that if he's going to be anxious, he'd rather be anxious about varnish drying times than interest rate swaps.

  Dan, thank you for reminding us that while we can't all escape the economy, we can all choose what we build within it.

  To Dan.

  [Raise glass]
