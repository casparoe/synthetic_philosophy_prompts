answer: |-
  This is one of the most enduring and subtle paradoxes in game theory, and your intuition about the tension between backward induction and local loss-minimization is exactly right. The confusion surrounding the Dollar Auction stems from a conflation of two different game-theoretic environments: one with **complete information** (where rationality prevents escalation) and one with **incomplete information** (where rationality *demands* escalation).

  To give you the rigorous grounding you need for your piece, we have to disentangle the "behavioral trap" narrative from the "structural equilibrium" reality. Here is the breakdown of how game theory actually resolves the Dollar Auction, moving from the naive behavioral view to the sophisticated equilibrium analysis.

  ### 1. The Behavioral Intuition (The "Trap")
  The popular account you described relies on **myopic loss aversion**.
  *   **The Logic:** Once Player A bids 90¢ and Player B bids \$1.00, Player A faces a choice: quit and lose 90¢, or bid \$1.05. If they bid \$1.05 and win, they lose 5¢. Losing 5¢ is better than losing 90¢.
  *   **The Spiral:** This logic repeats. At \$2.00 vs \$2.05, the loser is down \$2.00. Bidding \$2.10 to lose only 10¢ seems rational *at that specific node*.
  *   **The Verdict:** Behavioral economists use this to illustrate the **sunk cost fallacy**. Agents focus on marginal recovery rather than total position.

  However, as you noted, this ignores **forward-looking rationality**. A truly rational agent doesn't just look at the current node; they look at the whole tree.

  ### 2. The Game-Theoretic Resolution: Complete Information
  If we model this as a game of **perfect and complete information** (both players know the value of the dollar, the bid increment, and, crucially, each other's maximum budgets), the "escalation" equilibrium evaporates.

  This was rigorously formalized by Barry O'Neill (1986) and later by Leininger (1989). They treated the Dollar Auction as a finite extensive-form game.

  **The Backward Induction Argument:**
  1.  **The Cap:** Assume Player 1 has a budget of \$B_1$ and Player 2 has \$B_2$. Let's say the prize is \$1.00 and the increment is 5¢.
  2.  **The Endgame:** If the bidding reaches a point where Player 2 cannot top Player 1's bid without exceeding their budget, Player 2 must fold.
  3.  **The Step Back:** Player 1 knows this. Therefore, Player 1 knows that if they bid a specific amount $X$, Player 2 will fold.
  4.  **The Unraveling:** Player 2 knows that Player 1 knows this. Therefore, Player 2 realizes that entering the bidding war against a deeper-pocketed opponent is futile. They will lose money regardless of whether they bid or not (if they bid, they pay and lose; if they don't, they pay 0).
  5.  **The Equilibrium:** In the unique **Subgame Perfect Equilibrium (SPE)** of a finite Dollar Auction with common knowledge of budgets, **escalation does not occur.**
      *   The player with the larger budget bids a small amount (often just the minimum increment, or a specific threshold calculated by the modulo of the budgets).
      *   The player with the smaller budget **never bids.**
      *   The "war" is settled before it begins.

  **Why?** Because if both players are fully rational and know the other is rational, they can calculate the exact endpoint of the war before firing the first shot. Knowing the endpoint is "mutually assured financial destruction," the weaker player concedes immediately, and the stronger player takes the prize for pennies.

  **Implication for your piece:** If escalation happens in a context where budgets and rationality are common knowledge, it *is* irrational. It is a failure of backward induction.

  ### 3. The Game-Theoretic Resolution: Incomplete Information
  So why do we see escalation in experiments and real-world corporate bidding wars? Because the assumption of **common knowledge of budgets** is almost never true in reality.

  When we introduce **incomplete information** (I don't know how much money you have, or how much you value winning), the game changes fundamentally. It transforms from a solved finite game into a **signaling game** or a **War of Attrition**.

  **The Rational Escalation Story:**
  1.  **Uncertainty:** Player A doesn't know if Player B has a budget of \$5 or \$500. Player A also doesn't know if Player B values the \$1 bill at \$1.00 or at \$10.00 (perhaps due to prestige, strategic positioning, or spite).
  2.  **Screening:** Bidding becomes a mechanism to test the opponent. If I bid \$2.00 for a \$1.00 bill, I am signaling: "I am willing to lose money to win this. Do you want to test me?"
  3.  **Equilibrium:** In this environment, escalation *is* part of the equilibrium strategy. Rational agents will bid past the value of the prize to convince the opponent that they have a higher budget or higher valuation.
  4.  **The Stop:** Escalation stops only when one player's belief about the other's budget/valuation updates to the point where continuing is no longer profitable.

  **Implication for your piece:** In real-world corporate raids or bidding wars, escalation is often **structurally rational**. Companies bid past the asset's intrinsic value not because they are "irrational," but because winning the asset (or denying it to a rival) has strategic value *and* because they are trying to signal resolve to the market/competitors.

  ### 4. Connection to the War of Attrition
  You asked about the link to evolutionary biology. The Dollar Auction is essentially a discrete-time, monetary version of the **War of Attrition**.

  *   **Biological Model:** Two animals contest a resource. They posture and fight. The cost accumulates over time (energy, risk of injury). The one who persists longer wins the resource, but *both* pay the cost of the time spent fighting.
  *   **The Link:** In the Dollar Auction, the "time" cost is replaced by bid increments. The "second-highest bidder pays" rule makes it an **all-pay auction** for the active participants.
  *   **Evolutionary Stable Strategy (ESS):** In the War of Attrition with incomplete information about resource holding potential (RHP), the ESS involves a mixed strategy where individuals persist for random durations. Some fights end quickly; some escalate to dangerous levels.
  *   **The Insight:** Evolution does not select for agents that "avoid sunk costs." It selects for agents that maximize fitness. Sometimes, fighting past the point of immediate injury is the only way to secure a territory that ensures long-term survival. Similarly, in the Dollar Auction, bidding past \$1.00 is rational if it secures a market monopoly or signals toughness to future competitors.

  ### 5. Synthesizing the "Rationality" Question
  To answer your core question: *Is escalation of commitment a cognitive bias or a structural feature?*

  The rigorous answer is: **It is a structural feature that is amplified by cognitive bias.**

  1.  **Structural Feature:** In games of incomplete information (which is almost all real-world competition), escalation is a valid equilibrium strategy. Rational agents *do* burn money to signal resolve or screen opponents. The "trap" is not that they escalate; the trap is that they entered a game where the expected value was negative due to the competition structure.
  2.  **Cognitive Bias:** However, experimental data shows humans escalate *more* than the incomplete information models predict.
      *   **The Entry Error:** The biggest rationality failure usually happens at **Entry**, not during escalation. Rational agents with common knowledge shouldn't enter the auction at all (or should bid once and stop). Humans often enter hoping to get a "cheap dollar," underestimating the likelihood of a bidding war.
      *   **The Ego/Reputation Utility:** Humans derive utility from "winning" or "not backing down" that isn't captured in the monetary payoff matrix. If we add "reputation" as a variable in the utility function, the escalation becomes rational again.

  ### 6. Key Takeaways for Your Reporting
  If you want to move beyond the "people are irrational" trope, here is the nuanced narrative supported by the math:

  *   **The "Paradox" is a Modeling Artifact:** The idea that rational agents *never* escalate is only true in a vacuum of perfect information. In the real world (imperfect information), escalation is the price of discovering the true cost of victory.
  *   **The Real Trap is Entry:** Game theory suggests the catastrophe isn't the bidding war itself; it's the decision to sit at the table. The unique equilibrium in the complete information game is "Don't Play." The failure is often failing to recognize the game structure before the first bid.
  *   **Increment Size Matters:** Your hunch about bid increments is mathematically correct. If the increment is small relative to the prize, the "step back" logic is stronger (it's always cheap to bid one more). If the increment is large, the risk of jumping past the opponent's budget cap is higher, which can deter entry.
  *   **Reframing "Sunk Cost":** In the Dollar Auction, the second-highest bid isn't truly a "sunk cost" in the psychological sense; it is a **continuation cost**. Paying \$1.05 to avoid losing \$1.00 is mathematically sound *if* you believe there is a probability the opponent will fold next. The irrationality lies in the belief that the opponent will fold, not in the calculation of the immediate loss.

  **Conclusion:**
  Martin Shubik's Dollar Auction is not proof that humans are irrational. It is proof that **competition for a fixed prize with exit costs is structurally destructive.** Rational agents, uncertain of their opponent's resolve, will burn value to test it. The "escalation of commitment" is not a bug in human cognition; it is a feature of competitive dynamics where backing down is more expensive than moving forward, at least in the short term. The tragedy is not that players are irrational, but that the game itself is designed to consume value regardless of who wins.
