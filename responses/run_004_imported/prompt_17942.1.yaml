answer: |-
  This is a profound connection to draw. You have identified the exact nerve where the history of psychology touches the history of ethics: the point where the *desire* for a specific truth threatens to corrupt the *method* used to find it.

  Sidgwick is often misremembered as a soft-headed Victorian spiritualist because of his SPR presidency. In reality, he was a rigorous utilitarian epistemologist who treated psychical research as a duty. He famously wrote that he approached the subject "without any belief in the phenomena, but with a willingness to be convinced." But as you note, his "dualism of practical reason"—the fear that rational egoism and rational benevolence were irreconcilable without a divine moral order—meant his willingness was heavily loaded. He *needed* the phenomena to be real to solve his ethical crisis.

  Because he knew this about himself, he developed a defensive epistemology. He was terrified of the "wish-fulfillment" error. If we apply Sidgwick's documented habits of mind to the Daryl Bem affair, we arrive at a verdict that is surprisingly modern, arguably anticipating the Bayesian critique not through mathematics, but through moral epistemology.

  ### 1. On the Trap of Significance Testing
  Sidgwick would likely have viewed Bem's reliance on Null Hypothesis Significance Testing (NHST) as a procedural manifestation of the very self-deception he spent his life guarding against.

  In the *Census of Hallucinations*, Sidgwick was not looking for individual anecdotes; he was looking for deviations from the expected base rate of coincidence. He understood intuitively what statisticians later formalized: in a large enough sample, rare coincidences *must* occur. NHST asks, "If there were no effect, how unlikely is this data?" Sidgwick would have countered with the question Wagenmakers later posed: "Given how unlikely the effect is *a priori*, how much data do we actually need to believe it?"

  Sidgwick was acutely aware of the "law of large numbers" in the context of human testimony. He knew that if you query enough people about enough experiences, some will align by chance. He would have recognized Bem's p-values as a measure of *surprise*, not a measure of *truth*. To Sidgwick, a p-value of .05 in a domain as antecedently improbable as precognition would not constitute evidence; it would constitute a warning signal that coincidence or error had not been sufficiently ruled out. He would have seen NHST as a "trap" because it allows the researcher to claim objectivity while ignoring the prior probability of the hypothesis.

  ### 2. The Anticipation of the Bayesian Critique
  Would Sidgwick have anticipated Wagenmakers? Conceptually, yes.

  Sidgwick's approach to evidence was cumulative and comparative. He often spoke of the "strain" which extraordinary claims place on belief. In his *Methods of Ethics* and his SPR addresses, he implies a weighting system where the inherent improbability of a claim (its prior) must be outweighed by the strength of the testimony (the likelihood).

  When Bem published "Feeling the Future," the claim was that the arrow of time is reversible at the cognitive level. For Sidgwick, this is not merely a new psychological finding; it is a violation of the fundamental causal order of the universe. He would have argued that the "presumption against" such a claim is so massive that standard statistical significance is irrelevant. He would have demanded a likelihood ratio so extreme that it could crush the prior improbability.

  Sidgwick wrote in 1886: *"We must not forget that the evidence... has to contend against a strong presumption... derived from the general course of our experience."* This is the Bayesian prior in Victorian prose. He would have looked at Bem's Experiments 8 and 9 and said that the statistical noise (the "general course of experience" regarding experimental error) was indistinguishable from the signal, precisely because the signal claimed to overturn the laws of nature. He would have agreed with Wagenmakers that you cannot use a "routine" statistical tool to prove a "non-routine" fact without adjusting your threshold for belief.

  ### 3. The Corruption of Desire
  This is where Sidgwick's insight is most piercing. He knew that he *wanted* spiritualism to be true to resolve his ethical dualism. Therefore, he imposed upon himself a rule of "scientific caution" that bordered on asceticism. He suspected that any finding that comforted the human ego (like survival after death, or knowing the future) was suspect *because* it comforted the ego.

  Bem's results were seductive. They suggested a universe where the mind is not bound by time, a deeply comforting notion. Sidgwick would have recognized this seduction immediately. He would have suspected that the "file drawer" problem (publishing only successes) was not just a statistical error, but a moral failing—a form of dishonesty born of the desire for prestige or confirmation.

  He would have viewed the failure to replicate not as a disappointment, but as a vindication of his own methodological paranoia. He often warned that "premature conviction" was the greatest enemy of psychical research. He would have argued that Bem's publication in a top journal was a failure of the peer review system to account for the *motivation* of the researchers. If Sidgwick had been the editor of *JPSP*, he likely would have required a multi-lab preregistered replication (had the concept existed) before printing a claim that so neatly satisfied the human wish for specialness.

  ### 4. The Irony of Reform
  Finally, how would Sidgwick view the fact that a parapsychology scandal helped reform mainstream psychology?

  He would have found this deeply satisfying, though perhaps melancholic. The Society for Psychical Research was founded to bring scientific rigor to the fringe. Instead, the fringe remained fringe, but the *mainstream* eventually adopted the rigor the SPR had advocated. Sidgwick believed that the methods of science were universal moral duties when seeking truth.

  He would see the Replication Crisis not as a scandal, but as a delayed correction. The fact that psychology had to learn from Bem what Sidgwick learned from the mediums of the 1880s—that desire corrupts data—would strike him as a historical irony. He would likely argue that psychology finally grew up when it admitted that its standard tools (NHST) were insufficient to protect against the human tendency to see what it wants to see.

  ***

  ### A Reconstruction: Sidgwick on "Feeling the Future"
  *(Imagined as an addendum to his 1892 Presidential Address to the SPR, applied retrospectively to 2011)*

  > "It is a matter of perpetual observation that the human intellect, when confronted with phenomena which promise to resolve the deepest anxieties of our condition, is prone to a subtle relaxation of its critical faculties. We desire the testimony to be true; and in desiring it, we unconsciously lower the standard of its sufficiency.
  >
  > Regarding the recent publications from America concerning the precognitive faculties of the student mind, I must reiterate the caution which has guided this Society from its inception. The claim is not merely that the mind is subtle, but that it transcends the temporal order which bounds all other human experience. The presumption against such a claim is not merely statistical; it is structural to our understanding of the cosmos.
  >
  > To accept such a conclusion on the basis of calculations which determine only the rarity of the observation, without weighing the rarity of the fact itself, is to mistake the shadow for the substance. If the evidence tells us what we most fervently wish to hear—that we are not bound by the sequence of cause and effect—we are morally obligated to distrust it with twice the usual vigilance.
  >
  > It is better that we remain in uncertainty, bearing the dualism of our reason, than that we construct a edifice of truth upon the shaky foundation of our own hopes. If these phenomena are real, they will withstand the most severe scrutiny, repeated by hands that have no stake in their existence. If they vanish under such scrutiny, we have lost nothing but an illusion; and in the pursuit of truth, the dissolution of an illusion is always a gain."

  ***

  ### The Verdict
  Sidgwick would not have dismissed Bem as a fraud. He was too careful for that. But he would have dismissed the *conclusion* as unsupported. He would have sided with Wagenmakers, not because he was a skeptic of the paranormal (he wasn't), but because he was a skeptic of *human nature*.

  He would have viewed the Bem affair as a classic case of "wish-fulfillment bias" enabled by statistical tools that were too blunt to detect it. And he would have welcomed the subsequent reforms—preregistration, open data, Bayesian analysis—as the institutionalization of the very "scientific caution" he tried to embody. For Sidgwick, the replication crisis would not be a crisis of confidence, but a crisis of *conscience* finally being resolved.
