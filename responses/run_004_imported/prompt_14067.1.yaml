      *   **Parfit's Hitchhiker:** Agent in desert, predictor (driver) only saves if they predict payment. Once in town, CDT says don't pay (no causal link to being saved). FDT/EDT says pay (your decision algorithm is what was predicted).
      *   **FDT (Functional Decision Theory):** Associated with MIRI (Yudkowsky, Soares). Focuses on the output of the decision *function* rather than the specific physical act. It treats the prediction as a logical correlation with the agent's decision procedure.
      *   **The Tension:** The "time inconsistency" problem. Is it rational to *be* the kind of person who pays, or is it rational to *actually* pay when the causal leverage is gone? FDT argues these aren't separable because the "act" is the output of the function.
      *   **Gauthier/McClennen:** Gauthier (Constrained Maximization) argues for disposing oneself to cooperate. McClennen (Resolute Choice) argues for sticking to plans even when preferences shift. FDT is often seen as a formalization of these intuitions but relies on logical subjunctives rather than psychological resolution.
      *   **"Why Ain'cha Rich" (WACR):** The standard argument against CDT (Newcomb's Problem). CDT two-boxes and gets less money. FDT one-boxes and gets more. The counter-challenge: Are there cases where FDT loses to CDT? (e.g., Blackmail, certain transparent Newcomb variants).
      *   **Imperfect Predictors:** FDT relies heavily on logical correlation. If the predictor is probabilistic/causal rather than logical, does FDT still hold?

