          *   *Refinement:* Gauthier relies on psychological disposition. McClennen relies on willpower. FDT relies on logical subjunctives. Is FDT just a formal veneer on Resolute Choice?
          *   *Follow-up:* If she says "It's formal, not psychological," ask if that makes it normative or descriptive.

      *   *Q3 (Why Ain'cha Rich):* The boomerang.
          *   *Draft:* CDT loses money in Newcomb. Does FDT lose money elsewhere?
          *   *Refinement:* Focus on "Blackmail" or "XOR Blackmail" cases where FDT might pay blackmailers to avoid logical correlation with bad outcomes.
          *   *Follow-up:* If she says "Those cases are unrealistic," ask why Newcomb is realistic then.

      *   *Q4 (Imperfect Predictor):* The noise problem.
