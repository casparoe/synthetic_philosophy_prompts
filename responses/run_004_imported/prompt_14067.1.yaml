answer: |-
  Here are ten interview questions designed for your podcast guest. They assume familiarity with the Hitchhiker setup and press directly into the theoretical friction points you and Theo debated.

  Each question includes a "Anticipated Dodge & Follow-up" section to help you keep the conversation grounded if she retreats into standard FDT talking points.

  ### 1. The Act/Disposition Collapse
  **Question:** In Parfit's Hitchhiker, Causal Decision Theory (CDT) draws a bright line: it's rational to *have the disposition* to pay, but irrational to *execute the act* once you're safe. FDT claims this distinction is illusory because the act is just the output of the function. But physically, the payment happens *after* the prediction. If I'm standing in town, and my decision to pay has zero causal power over whether I was picked up, in what sense is handing over the cash a "rational act" rather than just a costly tribute to a rational *past* disposition?

  *   **Anticipated Dodge:** She will likely say, "You're thinking of the act as a physical movement. In FDT, the 'act' is the selection of the decision algorithm. The algorithm outputs 'pay' in the desert and 'pay' in town. You can't have one without the other."
  *   **Follow-up:** "Okay, but phenomenologically, I am making a choice *now*. If I know the driver is gone and the prediction is fixed, and I still force my algorithm to output 'pay,' aren't I essentially engaging in a magical ritual? At what point does 'respecting the logical fact' become indistinguishable from 'ignoring the causal reality'?"

  ### 2. The "Why Ain't Cha Rich" Boomerang
  **Question:** FDT proponents often use the "Why Ain't Cha Rich?" argument to sink CDT in Newcomb's Problem: CDT agents leave money on the table. But critics argue this boomerangs back on FDT in cases like XOR Blackmail, where an FDT agent pays a blackmailer to avoid a logical correlation with a bad outcome, while a CDT agent refuses and saves the money. If we define rationality by "who walks away with more utility," doesn't FDT fail its own success criterion in these specific environments?

  *   **Anticipated Dodge:** She will likely argue, "XOR Blackmail is a contrived, unfair problem. We should judge theories by how they perform in realistic, structurally symmetric problems like Newcomb or Hitchhiker."
  *   **Follow-up:** "But 'realistic' is doing a lot of heavy lifting there. If a theory's definition of rationality depends on which problems we decide count as 'fair,' aren't we just tailoring the theory to win the games we like? Is there a principled way to exclude Blackmail cases without just protecting FDT from falsification?"

  ### 3. Gauthier and McClennen's Ghost
  **Question:** This debate isn't new. David Gauthier argued for 'Constrained Maximization' (disposing oneself to cooperate), and Edward McClennen argued for 'Resolute Choice' (sticking to a plan even when preferences shift). FDT looks like a formalization of their intuitions using logical counterfactuals. Is FDT actually offering a new metaphysical account of agency, or is it just giving a mathematical veneer to McClennen's idea that we should bind our future selves?

  *   **Anticipated Dodge:** She will likely say, "Gauthier and McClennen rely on psychological commitment or willpower. FDT relies on logical necessity. It's not about *binding* yourself; it's about recognizing that your current decision is logically identical to the past prediction."
  *   **Follow-up:** "But for a human agent, isn't that logical identity experienced *as* a psychological binding? If I have to train myself to ignore causal leverage to act 'logically,' haven't I just reinvented Resolute Choice with extra steps? What practical advice does FDT give that McClennen didn't?"

  ### 4. The Imperfect Predictor Threshold
  **Question:** Let's tweak the Hitchhiker case. The driver isn't a perfect judge; he's right 90% of the time. At what point does the FDT recommendation switch? If the driver is 51% accurate, does FDT still say pay? If it degrades smoothly into CDT as accuracy drops, doesn't that suggest the "logical link" is actually just a probabilistic causal estimate in disguise?

  *   **Anticipated Dodge:** She will likely say, "It depends on the source of the error. If the error is random noise, the logical correlation holds. If the error is due to causal factors you can influence, the calculation changes. FDT handles this via the subjunctive dependency."
  *   **Follow-up:** "That sounds like a lot of calibration. If I'm the agent in the sand, I don't know the source of the error, only the accuracy rate. If FDT requires me to model the *mechanism* of the predictor's error to know if I should pay, isn't that a much heavier cognitive burden than CDT's simple 'causal leverage' test?"

  ### 5. Regret and Dynamic Inconsistency
  **Question:** A CDT agent in town feels no regret about not paying; they know it wouldn't have changed the past. An FDT agent pays. But does the FDT agent feel regret *after* paying? If they acknowledge that the money is gone and the ride was already secured, do they view the payment as a necessary cost or a loss? If they view it as a loss, how is that consistent with calling it the "rational choice"?

  *   **Anticipated Dodge:** She will likely say, "An FDT agent doesn't regret it because they know that an agent who regrets (and thus wouldn't pay) wouldn't have been picked up. They are glad to be the kind of agent who pays."
  *   **Follow-up:** "That sounds like satisfaction with their *identity*, not their *action*. But in the moment of handing over the cash, they are strictly worse off than a defector in the same situation. Can a theory of rationality really ask me to accept being strictly worse off in the actual world to satisfy a condition in a counterfactual world?"

  ### 6. The "Transparent" Variation
  **Question:** Consider Transparent Newcomb: you can *see* the money in the boxes. If you see the money is in Box B, CDT says take both. FDT usually says take only Box B, because if you were the type to take both, the box would be empty. In Hitchhiker, once I'm in town, it's like seeing the box is empty—the prediction is already settled. Why is it rational to one-box in Transparent Newcomb but rational to pay in Hitchhiker? Aren't both cases where the outcome is visibly fixed?

  *   **Anticipated Dodge:** She will likely say, "In Transparent Newcomb, your observation is part of the logical chain. Your decision to one-box is what makes it the case that the money was there. It's the same logical structure as Hitchhiker."
  *   **Follow-up:** "But intuitively, seeing the money feels like breaking the link. If FDT tells me to ignore my eyes in Transparent Newcomb and ignore my causal leverage in Hitchhiker, isn't the theory asking me to treat the world as if my observations don't update my causal options? How do you justify that without sounding like you're advocating for wishful thinking?"

  ### 7. Normative Force for Humans
  **Question:** FDT seems perfectly suited for AIs that can actually edit their own source code. But humans can't rewrite our decision functions on the fly. If I'm a human with a CDT-brain standing in town, and I *try* to use FDT, I'm just lying to myself about the causal structure. Is FDT a normative theory for humans, or is it only actionable for agents who can actually pre-commit at the code level?

  *   **Anticipated Dodge:** She will likely say, "Humans can train dispositions. You can cultivate the habit of paying. Over time, that becomes your 'source code.' FDT tells you which habits to cultivate."
  *   **Follow-up:** "But that brings us back to Question 1. Cultivating a habit is about the *disposition*. If I have the habit, I pay automatically. But if I stop and *deliberate* in town, FDT seems to tell me to override my deliberation. If the theory only works when I *stop* thinking like a decision theorist, is it really a guide for decision-making?"

  ### 8. The "Theo" Objection (Luck vs. Rationality)
  **Question:** My friend Theo argues that the FDT agent in town is just a sucker who got lucky they were picked up. He says rationality is about maximizing utility given your *current* situation, not maximizing utility across possible worlds that didn't happen. If I'm already in town, the 'possible world where I wasn't picked up' is dead. Why should a dead possible world dictate my financial choices in the living one?

  *   **Anticipated Dodge:** She will likely say, "Because you aren't just in the living world. You are an instance of a decision algorithm that exists across all possible worlds where that algorithm is run. You're optimizing the output of the algorithm, not the single instance."
  *   **Follow-up:** "That sounds like a metaphysical claim about personal identity or agent-similarity, not just decision theory. Parfit would love that, but does it require us to accept a specific, controversial view of 'agenthood' to accept FDT? If I reject that metaphysics, does FDT collapse?"

  ### 9. Logical Counterfactuals vs. Causal Mechanisms
  **Question:** CDT relies on causal graphs, which we have a decent grasp of scientifically. FDT relies on "logical counterfactuals"—what would happen if 2+2 equaled 5, or if my algorithm outputted 'don't pay' when it's determined to output 'pay.' Do we actually have a rigorous semantics for logical counterfactuals yet, or is FDT building a normative theory on top of a mathematical concept that's still under construction?

  *   **Anticipated Dodge:** She will likely say, "We use proof-based decision theory or modal logic to handle this. It's not about impossible math; it's about uncertain logical facts. We have the formalism."
  *   **Follow-up:** "But there's still significant debate in the community about how to handle 'impossible possible worlds' in these scenarios. If the formalism for the counterfactuals isn't settled, how confident can we be that the normative recommendations (like paying in Hitchhiker) won't change once the math is fully worked out?"

  ### 10. The Evolutionary Argument
  **Question:** If FDT is the superior theory, we should expect FDT-like agents to out-compete CDT agents in an evolutionary setting. But in a one-off interaction without reputation effects, a CDT agent saves their money and survives (if they were lucky enough to be picked up). Doesn't evolution select for the CDT strategy of 'defect when you can get away with it,' meaning FDT is an unstable equilibrium that would be bred out of a population?

  *   **Anticipated Dodge:** She will likely say, "Evolution selects for the disposition, not the specific act. A population of FDT agents gets picked up more often, so they survive to reproduce more than the CDT population who die in the desert."
  *   **Follow-up:** "Sure, but once the FDT population exists, a mutant CDT agent arises. That mutant gets picked up (because the drivers trust the population) *and* keeps their money in town. The mutant out-competes the FDT locals. How does FDT prevent itself from being invaded by free-riders once it becomes the norm?"
