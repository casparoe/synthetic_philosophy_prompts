answer: |-
  First off: **you are not missing anything, and this is not a flaw in the lecture.** In fact, you have put your finger on the exact intuition that Kripke is trying to dismantle.

  What you are experiencing is the friction between the **traditional Kantian view** (which links the *a priori*, the *necessary*, and the *analytic* together) and **Kripke's modal revolution** (which drives a wedge between them).

  Your intuition is: *If I know it just by defining terms (a priori/analytic), it must be true in all possible worlds (necessary).*
  Kripke's claim is: *You can know something just by defining terms (a priori), but the world could have been different such that the statement is false (contingent).*

  This is known as the **Contingent A Priori**. It is one of the most famous and debated claims in 20th-century philosophy. Here is the standard move that explains why Kripke isn't contradicting himself, broken down into the specific distinction you need.

  ### 1. Fixing the Reference vs. Giving the Meaning
  This is the single most important technical distinction in Lecture 2.

  *   **The Descriptivist View (Frege/Russell):** To define "one meter" is to give it a *meaning*. "One meter" *means* "the length of Stick S." If this were true, you would be right: the statement would be analytic and necessary.
  *   **Kripke's View:** Defining "one meter" is not giving it a synonym; it is **fixing its reference**.

  Think of it like naming a baby. You point at a baby and stipulate, "Let's call this baby 'Alice'."
  *   **A Priori:** Do you need to go investigate the baby to know "This baby is named Alice"? No. You know it because you just named her.
  *   **Contingent:** Could that baby have been named "Betty"? Yes. Could the baby have not existed at all? Yes.

  Kripke argues "one meter" works the same way. We use Stick S to *pinpoint* which length we are talking about in the actual world, but "one meter" doesn't *mean* "the length of Stick S." "One meter" is a **rigid designator** of a specific length.

  ### 2. The Possible Worlds Test
  To see why it's contingent, we have to look at how the terms behave in other possible worlds. This is where the "rigid designator" machinery does the heavy lifting.

  *   **Term A:** "One meter." (Rigid Designator)
      *   In the Actual World: Refers to Length $L$ (the length of S at $t_0$).
      *   In Possible World $W$: **Still refers to Length $L$.** It doesn't matter what happens to Stick S in $W$. "One meter" locks onto that specific abstract length.
  *   **Term B:** "The length of Stick S at $t_0$." (Non-Rigid Designator)
      *   In the Actual World: Refers to Length $L$.
      *   In Possible World $W$: Refers to **Length $L+$** (because in $W$, Stick S was heated and expanded).

  Now look at the sentence: **"Stick S is one meter long at $t_0$."**

  *   **In the Actual World:** Stick S is Length $L$. "One meter" is Length $L$. The sentence is **True**. (And we know this a priori because we stipulated the reference).
  *   **In Possible World $W$:** Stick S is Length $L+$. "One meter" is *still* Length $L$. The sentence says "$L+$ is $L$." The sentence is **False**.

  Because there is a possible world where the sentence is false, the sentence is **contingent**.

  ### 3. Why your intuition makes sense (and why Kripke says it's wrong)
  Your intuition relies on the idea that **stipulation = synonymy**.
  If I say, "Let a 'bachelor' mean 'an unmarried man'," I have created a synonym. "All bachelors are unmarried" is true in all possible worlds because I made the words mean the same thing.

  Kripke is saying that when we define units of measurement (or proper names), we aren't creating synonyms. We are attaching a label to an object (or length) directly.
  *   "One meter" labels the **length**.
  *   "Stick S" labels the **physical object**.

  Physical objects can change length; abstract lengths cannot. Therefore, the relationship between the object and the length is contingent, even if our *knowledge* of the relationship is fixed by stipulation.

  ### 4. Is the TA brushing you off?
  It sounds like it, but unfortunately, this is a very common reaction because this specific point is mind-bending. Many philosophers (like Gareth Evans) actually argued against Kripke on exactly this point, claiming that if it's a priori, it *must* be necessary.

  However, the standard Kripkean response (and the one your professor likely expects) is that you are conflating **Epistemology** (how we know it) with **Metaphysics** (how the world is).
  *   **A Priori/A Posteriori:** Epistemological status. (Do I need to measure it?)
  *   **Necessary/Contingent:** Metaphysical status. (Could it have been otherwise?)

  Kripke's big contribution in *Naming and Necessity* is proving that these two boxes don't line up perfectly.
  *   **Contingent A Priori:** The Meter Stick.
  *   **Necessary A Posteriori:** "Hesperus is Phosphorus" or "Water is H2O." (You need science to find it out, but once you do, it's true in all possible worlds).

  ### Summary
  You aren't missing a standard move; you are correctly identifying the traditional view that Kripke is explicitly rejecting.

  The "move" you need to see is the distinction between **fixing the reference** (using S to point out which length we mean) and **giving the meaning** (making "one meter" synonymous with "length of S"). Once you accept that "one meter" rigidly designates a length independent of the stick, the contingency follows, even if the knowledge remains a priori.

  If you want to ace this on the exam/paper, make sure you explicitly use the phrase **"Reference-Fixing vs. Synonymy"** and walk through the **"Heated Stick" possible world scenario**. That shows you understand the mechanism of rigid designation.
