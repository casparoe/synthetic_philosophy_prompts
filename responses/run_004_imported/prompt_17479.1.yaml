answer: |-
  **The Hypocrite's Gavel: Standing, Truth, and the Ethics of Blame**

  The scene in the student council meeting is a microcosm of a enduring philosophical problem. When the class president reprimanded a late officer while being chronically late herself, she ignited a debate not about punctuality, but about authority. Her defense—that her lateness does not negate the truth of her criticism—relies on a logical distinction between the speaker and the statement. Her detractors, however, sense a moral violation that logic alone cannot capture. This tension lies at the heart of what philosophers call the "standing to blame." Drawing on G.A. Cohen's insights in "Casting the First Stone," we can resolve this puzzle. While the hypocrite's criticism may be factually correct, their hypocrisy can indeed strip them of the moral authority to voice it. To understand why, we must distinguish standing from aptness, rehabilitate the *tu quoque* argument, and recognize the crucial moral difference between the unrepentant and the reformed.

  To begin, we must address whether "lacking standing" is a distinct normative failure or merely a confused way of saying a criticism is misplaced. The class president's defense relies on the idea that if the officer was late, the blame is "apt." In the ethics of blame, aptness refers to whether the target actually violated a norm. Standing, conversely, refers to the critic's relationship to that norm and to the target. These are distinct. A thief can correctly identify another thief; the proposition "stealing is wrong" remains true regardless of the speaker. However, blame is not merely a statement of fact; it is a speech act that demands accountability. It implies a moral relationship where the blamer holds a position of authority or equality to demand justification.

  When a critic lacks standing, the blame is not *false*, but it is *unfair*. It is a distinct failure because it violates the procedural ethics of moral community rather than the substantive ethics of the act being blamed. If I demand you follow a rule I openly flout, I am not merely making an awkward observation; I am attempting to impose a burden on you that I refuse to bear myself. This creates a hierarchy where I am exempt from the norms I enforce on you. Therefore, talk of "standing" is not confused; it identifies a specific type of moral injustice—the injustice of unequal application—separate from the truth of the accusation.

  This distinction clarifies the status of the *tu quoque* ("you do it too") reply. In introductory logic, *tu quoque* is taught as a fallacy because the personal habits of a speaker do not logically invalidate the truth of their premises. If a doctor who smokes tells you smoking is dangerous, the health risk remains real. However, in the context of moral blame, *tu quoque* is not always a fallacious deflection. It becomes a legitimate objection when the issue is not the truth of the proposition, but the legitimacy of the speech act.

  When the student council officers pointed out the president's lateness, they were not arguing that lateness is acceptable. They were arguing that *she* was not the one to say it. Because blame functions as a demand for compliance, a critic who is simultaneously non-compliant issues a demand that is inherently contradictory. They are effectively saying, "You must follow this rule, though I claim the privilege of ignoring it." In this specific context, *tu quoque* successfully challenges the critic's authority without denying the underlying norm. It shifts the focus from the target's wrongdoing to the critic's unfairness. Thus, *tu quoque* is fallacious when used to deny facts, but legitimate when used to deny standing.

  However, not all hypocrisy destroys standing equally. This brings us to the crucial distinction between the unrepentant offender and the reformed one. Imagine if the class president used to be chronically late but had corrected her behavior before taking office. In this scenario, her past hypocrisy would not negate her standing. Why? Because standing is rooted in a commitment to the moral equality of persons. The reformed hypocrite acknowledges that the norm applies to them, admits their past failure, and aligns their behavior with their demands. They have "paid their dues" to the norm.

  In contrast, the unrepentant hypocrite—like our current class president—maintains a stance that undermines the very basis of moral community. By continuing to violate the norm while enforcing it, she implies that she is either above the rule or that the rule does not actually bind her. G.A. Cohen argues in "Casting the First Stone" that we lose the standing to condemn when we are guilty of comparable wrongdoing because we cannot claim a moral high ground that does not exist. But more than just "high ground," it is about solidarity. The unrepentant hypocrite treats the target as a subordinate to be disciplined, while treating themselves as an exception. The reformed critic treats the target as an equal partner in a shared standard. Therefore, the president's current, unrepentant status is fatal to her standing in a way that a past transgression would not be.

  **Verdict**

  Based on this analysis, we can reach a definite verdict on the controversy. Hypocrisy does not make a criticism false, but it can render the act of blaming morally impermissible. The class president was substantively correct that lateness is a problem, but she was procedurally unjust in her reprimand.

  Hypocrisy removes a person's standing to blame, rather than merely making it awkward, under the following specific conditions:

  1.  **Similarity of Fault:** The critic must be guilty of the same (or morally comparable) violation as the target.
  2.  **Unrepentant Status:** The critic must currently be violating the norm without acknowledgment or attempt at reform. If the critic acknowledges their fault and submits to the same standard, standing is retained.
  3.  **Implicit Claim of Exemption:** The act of blaming must imply that the critic places themselves outside the jurisdiction of the norm they are enforcing.

  In the case of the student council, the president meets all three conditions. She is an unrepentant violator of the punctuality norm who attempted to enforce it unilaterally. Consequently, while her complaint was true, she forfeited the right to voice it. Her officers were not merely being defensive; they were correctly identifying a failure of moral authority. In a community of equals, one cannot wield the gavel of blame while simultaneously trampling the rules it is meant to uphold.
