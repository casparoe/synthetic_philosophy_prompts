  2.  **Deconstruct the Philosophical Concepts:**
      *   **Standing to Blame:** The normative authority or right to hold someone accountable. It's not about *what* is said, but *who* says it.
      *   **Hypocrisy:** Claiming a moral standard for others that one does not apply to oneself.
      *   **Tu Quoque:** "You also." Often a logical fallacy (ad hominem) because the truth of the claim is independent of the speaker. However, in moral contexts, it might challenge the *authority* to speak rather than the *truth* of the claim.
      *   **G.A. Cohen's Argument:** In "Casting the First Stone," Cohen argues that if you are guilty of the same (or worse) sin, you lose the moral standing to condemn. It's not that the condemnation is false, but that it is *presumptuous* or *unfair* for *you* to say it.

