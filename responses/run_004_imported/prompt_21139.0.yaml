      *   **Context:** The user's brother is an MQ-9 sensor operator. The user is familiar with Anscombe's undergraduate seminar readings.

  2.  **Deconstruct Anscombe's Core Arguments:**
      *   *Source 1: "Mr. Truman's Degree"*
          *   **Core Claim:** Truman is a murderer.
          *   **Reasoning:** It is always forbidden to intentionally kill the innocent.
          *   **Distinction:** Intention vs. Foreseen Consequence. Truman *chose* the killing of civilians as a *means* to victory. It wasn't a side effect; it was the method.
          *   **Absolutism:** She rejects utilitarianism ("the ends justify the means"). The prohibition against murder is absolute.
          *   **Definition of Innocent:** Non-combatants, those not engaged in unjust aggression.
      *   *Source 2: "War and Murder"*
          *   **Core Claim:** Elaborates on the Doctrine of Double Effect (DDE).
          *   **Key Distinction:** Intending evil vs. Foreseeing evil.
          *   **Condition for Permissibility:** You can perform an action that has bad side effects (civilian death) *only if* you do not intend those bad effects as an end or a means.
          *   **Direct Attack:** It is always wrong to make the death of the innocent the object of one's choice (direct attack).
          *   **Oblique Attack:** It may be permissible to perform an act of war where civilian death is foreseen but not intended (e.g., bombing a munitions factory where civilians happen to be), provided the military objective is proportionate and the death isn't the *means*.

  3.  **Analyze Practice 1: Signature Strikes:**
      *   *Description:* Targeting groups of unidentified men based on behavior patterns (signatures) rather than identity. High risk of civilian casualties because identity is unknown.
      *   *Anscombe's Lens:*
