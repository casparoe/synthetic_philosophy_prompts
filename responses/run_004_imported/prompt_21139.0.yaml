      *   *Where the Framework Runs Out:* Anscombe's framework relies heavily on the agent's *interior intention*. We can't see into the drone operator's head. Also, her framework assumes a clear distinction between combatant/non-combatant. Asymmetric warfare blurs this. She also focuses heavily on *Jus ad Bellum* (is the war just?). She might argue that if the war is unjust, *all* killing is murder. But the prompt asks about the *practices*.
      *   *Specific Nuance:* Anscombe hated "consequentialism." She wouldn't care that Signature Strikes "save more lives in the long run." She would care if the act itself violates the prohibition on killing the innocent.

  6.  **Drafting the Response (Iterative refinement):**
