          *   **The "Innocent" Problem:** If you don't know who they are, you don't know if they are innocent. Anscombe is strict: you cannot intentionally kill the innocent.
          *   **Truman Comparison:** Truman knew they were civilians and killed them anyway to force surrender. Signature strikes assume they are combatants based on probability.
          *   **The Crucial Point:** Anscombe would likely focus on the *certainty* of combatant status. If the "signature" is probabilistic, then there is a high likelihood that some targeted are innocent.
