          *   **Verdict:** Likely condemnable, but perhaps distinct from Truman. Truman *knew* they were civilians. Signature strikes *claim* they aren't, but without proof. Anscombe would likely demand a higher burden of proof for "combatant" status. If the "signature" is loose, it becomes a policy of killing the potentially innocent, which violates the absolute prohibition.

