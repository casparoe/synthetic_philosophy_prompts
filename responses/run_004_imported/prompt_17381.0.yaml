prompt: |-
  Ok so I'm working on a novel with a Goethe-adjacent character, and I've gone down a total rabbit hole on how his political reputation looked to the generation right after him. Heine clearly worshipped Goethe's poetry but was pretty scornful of his politics -- there's that whole "end of the Kunstperiode" idea, basically that Goethe's art-for-art's-sake generation had to die off before German literature could get properly political again. Can you compare what Goethe actually did/beleived politically (the decades as a Weimar minister, his wariness toward the French Revolution, cozying up to Napoleon at Erfurt, his general lack of enthusiasm for German nationalism during the wars of liberation) against Heine's critique of him? Is Heine basically right that Goethe was a political coward hiding behind aesthetics, or is that too flat a reading of what he was actually up to? Give me an actual verdict, not a wishy-washy "both sides had a point."
