      *   *The "Ratificationism" angle:* Richard Jeffrey. An act is rational only if, upon deciding to do it, you still think it's best. In Death in Damascus, no pure act is ratifiable. Only the mixed strategy is ratifiable.
      *   *Verdict:* The rational agent must adopt a **ratifiable mixed strategy**. Even if Death is infallible, this is the only coherent mental state. If Death is *almost* perfect (predicts based on psychology), randomization actually saves you. I will argue for the latter interpretation as it preserves agency, which is better for fiction.

