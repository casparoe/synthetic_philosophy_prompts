answer: |-
  The humidity hangs heavy over the clearing, thick enough to taste. A rabbit—brown, twitching, unmistakable—has just bounded into the tall grass. The native informant, K, lowers his hand. He is ten yards away, lighting a cigarette, watching the two linguists with mild amusement.

  **Sarah** (wiping sweat from her notebook): "Rabbit. It's 'rabbit.' Don't start, Elias. I saw the pointing. I saw the focus. It's a count noun."

  **Elias** (leaning against a tree, arms crossed): "I didn't say it wasn't. I said it's *also* 'undetached rabbit part.' And 'rabbit stage.' And 'instance of rabbithood.' The stimulus meaning is identical for all of them. K's assent to 'Gavagai' is triggered by the same retinal irritation whether you're pointing at a rabbit or a temporal slice of one."

  **Sarah:** "That's the parlor trick version of the argument. Quine assumes the linguist is a mute spectator who can only point and nod. But I'm not mute. I'm not going to spend three years guessing. I'm going to ask K about identity. I'm going to ask if *this* gavagai is the *same* gavagai we saw yesterday."

  **Elias:** "And when you ask that, you'll need a word for 'same.' Let's say K offers you a particle, *ne*. You translate *ne* as 'identity.' But why? Perhaps *ne* means 'is part of the same whole.' If 'gavagai' means 'rabbit part,' then *ne* connects parts belonging to one rabbit. If 'gavagai' means 'rabbit,' *ne* connects rabbits through time. The behavioral output—K's assent or dissent—is exactly the same in both manuals."

  **Sarah:** "You're treating the translation of *ne* as independent from the translation of *gavagai*. It isn't. We determine them simultaneously by looking at the grammatical structure. If *gavagai* behaves like a mass term—no plural marker, takes quantifiers like 'much' rather than 'many'—then 'rabbit part' or 'water' is the better fit. If it takes numerals, it's an object. That's empirical data, Elias. It's not a hypothesis; it's distributional fact."

  **Elias:** "Distributional facts are just more stimuli. You see a suffix *-s* attached to *gavagai*. You translate *-s* as 'plural.' But 'plural' presupposes individuation. To say there are 'two gavagais' presupposes you know what counts as *one*. If the ontology of the language is one of processes or parts, your 'plural' marker might actually be marking 'disconnected segments.' You're smuggling in English ontology to decode their grammar."

  **Sarah:** "I'm not smuggling it in; I'm testing for it. That's the point Quine misses. He thinks the indeterminacy is a metaphysical fog. I think it's a methodological challenge that fieldwork solves. If I find that *gavagai* can be modified by 'large' but not 'scattered,' that constrains the reference. If I find they have a specific classifier for animals distinct from body parts, the 'rabbit part' hypothesis dies. You're saying I can never rule it out. I'm saying I can rule it out the same way I rule out the hypothesis that 'gavagai' means 'cloud.'"

  **Elias:** "You can rule out 'cloud.' You cannot rule out 'rabbit part' because 'rabbit part' and 'rabbit' are logically compatible with every possible observation. Look at K. Ask him about the tail. Is the tail a *gavagai*? If he says no, you think you've won. But in the 'rabbit part' manual, you simply translate his negative particle differently in that context. Maybe his 'no' there means 'is not a whole rabbit.' You adjust the translation of the logical particles to preserve the manual."

  **Sarah:** "But then your manual becomes grotesquely complex. You're assigning wildly different meanings to logical constants just to save the 'rabbit part' ontology. At some point, simplicity isn't just pragmatic; it's evidential. If one translation requires me to believe K has a coherent, learnable grammar, and the other requires me to believe he's speaking a convoluted code where 'same' means 'connected to,' the first one is *correct*. The indeterminacy thesis treats all compatible manuals as equal. They aren't."

  **Elias:** "Simplicity is pragmatic. It helps us predict behavior. It doesn't tell us what the words *refer to*. That's the inscrutability of reference. We can agree on all the sentences, all the truth conditions, all the grammatical rules, and still disagree on whether K is talking about rabbits or rabbit parts. You're conflating the translation of *sentences* (which is determinate enough for science) with the translation of *terms* (which is not). You can communicate perfectly with K without ever knowing if he refers to objects or stages."

  **Sarah:** "If I can communicate perfectly, the distinction is meaningless. If the grammar forces me to treat *gavagai* as a discrete, enduring individual to make sense of his inferences, then for all linguistic purposes, it *is* a discrete, enduring individual. You want to posit a ghostly realm of reference that floats free of grammatical function. But reference *is* a grammatical function. It's how words hook into syntax."

  **Elias:** "Reference is how we *take* words to hook into syntax. That 'taking' is the analytical hypothesis. You say the grammar disciplines the translation. I say the translation *creates* the grammar. When you decide *gavagai* is a count noun, you are deciding to interpret K's speech as carving the world into objects. But you could interpret it as carving the world into events, provided you reinterpret the copula, the identity particle, and the numerals. The web of belief holds together either way."

  **Sarah:** "So you're saying my fieldwork is just fiction-writing? I'm writing a story where K is like me, and you're writing a story where K is a mereological nihilist, and neither is better?"

  **Elias:** "I'm saying both stories predict the exact same shouts, nods, and gestures. If there is no behavioral difference, there is no fact of the matter. You want there to be a fact of the matter about what K *really* means. I'm saying there is only a fact of the matter about how K *behaves*. The rest is projection."

  **Sarah:** "But the behavior includes the structural relations between his words! That's the data I'm using. You're acting like the only data is the ostensive pointing. It's not. The syntax is observable. If *gavagai* never appears without a determiner, that's a fact. If it appears in contexts of identity, that's a fact. You can't reinterpret those facts without breaking the predictive power of the grammar."

  **Elias:** "I can reinterpret them without breaking predictive power. That's the theorem. I can map your 'object' ontology to a 'part' ontology systematically. Every time you translate a sentence as 'This is the same rabbit,' I translate it as 'This is a rabbit part connected to the previous rabbit part.' The truth values remain identical. The predictions remain identical. You claim the grammar stops this. I claim the grammar is just more text to be translated, and text is always underdetermined."

  **Sarah** (pauses, looking down at her notebook where she's written *Gavagai = Rabbit?*): "Okay. Let's isolate this. You admit that if I translate *gavagai* as 'rabbit,' I can predict his behavior. You admit that if I translate it as 'rabbit part' and adjust the logical particles, I can also predict his behavior."

  **Elias:** "Yes."

  **Sarah:** "Your claim is that because both manuals predict the behavior, neither is uniquely true."

  **Elias:** "Precisely. Reference is relative to a manual."

  **Sarah:** "My claim is that the 'rabbit' manual utilizes a hypothesis about the grammar that is structurally simpler and aligns with the perceptual salience of the stimulus. The 'rabbit part' manual requires a systematic ambiguity in the logical particles that has no independent motivation other than saving the 'part' ontology."

  **Elias:** "And my counter is that 'independent motivation' is just more verbal behavior. You're asking for evidence beyond the totality of possible evidence."

  **Sarah:** "No. I'm asking if the structure of the language itself counts as evidence for reference, or if you insist reference is only fixed by ostension."

  **Elias** (pushes off the tree): "I insist reference is fixed by the totality of evidence, which includes structure. But I argue that the totality of evidence underdetermines reference. Structure doesn't fix ontology; it only fixes the relations between terms. You can have a structure of objects or a structure of parts that is isomorphic."

  **Sarah:** "So the disagreement isn't about whether we can communicate. We agree we can."

  **Elias:** "We agree."

  **Sarah:** "The disagreement is whether 'what K refers to' is a question that has an answer once communication is secured."

  **Elias:** "Exactly. You think the grammar reveals the ontology. I think the grammar reveals the grammar, and the ontology is a projection we use to make sense of the grammar."

  **Sarah** (closes the notebook): "Then we're stuck. Because for me, a grammar that functions like an object-language *is* an object-ontology. To say it functions that way but refers to parts is to make a distinction without a behavioral difference."

  **Elias:** "And for me, to say there is no distinction because there is no behavioral difference is to confuse meaning with reference. We can agree on the meaning of the sentences—their stimulus meaning—and disagree on the reference of the terms. That is the indeterminacy."

  **Sarah:** "So you're saying the 'rabbit' is in the manual, not in the jungle."

  **Elias:** "I'm saying the 'rabbit' is in the translation. In the jungle, there is just stimulation."

  **Sarah** (looks toward the grass where the rabbit vanished): "Well. The stimulation is gone. K is waiting."

  **Elias:** "Write down 'rabbit.' It's the simpler manual."

  **Sarah:** "Only because I refuse to accept your premise that the grammar doesn't count as a constraint on reality."

  **Elias:** "And I'll note in the margins that 'rabbit' is shorthand for 'whatever ontology makes the sentences true.'"

  **Sarah:** "Which is everything."

  **Elias:** "Which is nothing."

  They stand for a moment in the heat. The gap between them isn't about the rabbit, or the word, or even the grammar. It is about whether the structure of language is a mirror of the world, or merely a net we throw over it, where the mesh size is up to the thrower. Sarah opens the notebook. Elias lights a cigarette. K watches them, waiting to see what noise they will make next.
