      *   *Elias:* "How do you translate 'two'? Maybe it means 'two temporal segments of a rabbit.'"
      *   *Sarah:* "That's ad hoc. The grammar constrains it. Mass nouns don't take numerals."
      *   *Elias:* "Unless your translation of the mass/count distinction is also flexible. You're building a manual. There are multiple manuals compatible with the data."
