      *   *Round 1:* Sarah claims standard field methods (counting, plurals) will solve "gavagai." Elias claims this just pushes the problem back to the grammatical particles.
      *   *Round 2:* Sarah argues that grammatical behavior is observable (distributional patterns). Elias argues that distribution doesn't fix *ontology* (what the words refer to), only structure.
      *   *Round 3:* Sarah brings up "identity" (is this the *same* one?). Elias counters with the "rabbit stage" vs. "rabbit" distinction and how the identity particle can be reinterpreted.
      *   *Round 4 (Climax/Resolution):* They realize the core dispute is about what counts as "evidence." Is stimulus meaning the only evidence, or is the structural coherence of the language evidence?
      *   *Ending:* They agree on the locus of the disagreement (the status of analytical hypotheses vs. empirical data) without resolving it.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Is Sarah making the "magic trick" argument? Yes, she needs to emphasize that Quine artificially restricts the linguist.
      *   *Check:* Is Elias making the "inscrutability of reference" argument? Yes, he needs to emphasize that *reference* itself is what's indeterminate, not just word meaning.
      *   *Nuance:* Make sure Elias doesn't sound like a solipsist. He believes in science, but thinks translation manuals are underdetermined by behavioral data.
      *   *Nuance:* Make sure Sarah doesn't sound naive. She knows Quine's work but thinks his constraints are unrealistic for actual linguistics.

  6.  **Writing - Section by Section:**

