  2.  **Identify the Underlying Economic/Psychological Concept:**
      *   This is a classic example of the **Allais Paradox**.
      *   Maurice Allais (1953) demonstrated that people's choices often violate the *Independence Axiom* of Expected Utility Theory.
      *   Let's map the user's scenario to the standard Allais Paradox structure.
          *   Standard Allais:
              *   1A: Certain $1M.
