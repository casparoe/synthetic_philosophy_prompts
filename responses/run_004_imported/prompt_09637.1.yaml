      *   Mathematically, if $U(1000) > 0.9U(1000) + 0.09U(5000) + 0.01U(0)$, then algebraically it implies $0.1U(1000) > 0.09U(5000) + 0.01U(0)$.
      *   But in Booth 2, the user chose the opposite ($0.09U(5000) > 0.1U(1000)$).
