      *   *Nuance:* Fricker distinguishes between *incidental* testimonial injustice (one-off) and *systematic* testimonial injustice (connected to broader social power imbalances).
      *   *Nuance:* Fricker acknowledges that credibility judgments *should* be sensitive to evidence (like past reliability). The injustice happens when the judgment is *skewed* by prejudice *despite* the evidence, or when the evidence itself is tainted by prejudice.

