          *   *Weakness:* Speculative. Needs proof that the past incidents were actually bias-driven, not actual lies.

      *   **Move 4: Sam's Final Counter (Unfalsifiability/"Proves Too Much")**
          *   *Argument:* If every negative track record can be retroactively blamed on prejudice, you can never accuse someone of actually being unreliable. It makes the theory immune to refutation.
          *   *Strength:* Logically sound concern. A theory that explains everything explains nothing. We need a way to distinguish between *actual* unreliability and *perceived* unreliability due to bias.
