      *   **Conclusion:** Who has the stronger point? Sam wins on the *specific* instance (teacher has data on Maya), Jordan wins on the *systemic* critique (where did the data come from?). But strictly speaking, for Fricker's *Testimonial Injustice*, we need proof the prejudice caused the deficit *in this moment*.
