answer: |-
  **Setting:** *A dimly lit pub near the conference venue. Empty glasses and a scattered handout on "The Semantics of Pejoratives" sit on the table.*

  **Elena (Content Theorist):** I'm still stuck on the projection data from the Q&A. If I say, "John isn't a [slur]," the derogatory force doesn't vanish. If that force were just part of the truth-conditional content, negation should target it. It should deny the contempt just as it denies the predication. But it doesn't. It lingers like smoke.

  **Marcus (Expressivist/CI):** That lingering smoke is exactly why I favor the Conventional Implicature (CI) model. The truth conditions remain identical to the neutral counterpart; the contempt rides on a separate dimension. It projects because it's not part of "what is said." It's a side-comment the lexicon makes automatically.

  **Elena:** But that side-comment becomes a wrecking ball when you try to explain reclamation. If the word *conventionally* implicates contempt, how does an in-group speaker use it to signal solidarity? You can't just say the implicature "flips." If it's conventional, it's attached to the lexical item. It should stick regardless of who says it.

  **Marcus:** I'm not saying it flips. I'm saying the CI encodes a history of oppression, not just a momentary attitude. When an in-group member uses it, they aren't canceling the history; they're invoking it to signal shared endurance. The semantic value—the CI—remains stable. It's the illocutionary uptake that shifts from subordination to solidarity.

  **Elena:** That feels like a dodge. If the semantics encode a normative claim that the target is inferior, and the in-group usage doesn't assert inferiority, then the semantic content *must* be different. You're trying to keep the lexical entry static to save the CI theory, but you're doing all the work with pragmatic context.

  **Marcus:** And you're trying to save truth-conditions by making the property itself weird. Your view says the slur predicates a complex, socially constructed property. But when I embed it—"If John is a [slur], he'll be upset"—the offense is in the antecedent. You're forcing the *condition* itself to be toxic. How is that truth-conditional without making the sentence truth-valueless?

  **Elena:** Because the property is externally individuated. It exists in the social world, not just in the speaker's head. Even in the antecedent, you're invoking that social structure. But look, let's talk about cancellability. You claim it's a CI. But CIs aren't cancellable. I can't say, "He's a [slur], but I don't mean to derogate."

  **Marcus:** Exactly. It's infelicitous. Which fits the CI profile perfectly. Conversational implicatures cancel; CIs stick. If you're arguing it's at-issue content, you agree it shouldn't cancel. So on cancellability, we actually agree. It doesn't settle the split between at-issue and CI.

  **Elena:** It settles it for me because the derogation behaves like a presupposition or a truth-condition in embedding contexts, not a CI. CIs are supposed to be independent of the main content. But with slurs, the derogation *colors* the main content. If I say, "The [slur] is brave," the bravery is evaluated through the lens of the slur. They aren't independent dimensions.

  **Marcus:** Independence is the ideal, not always the reality. But consider the reclamation case again. If your truth-conditional view is right, the in-group speaker is literally predicating that ugly property of themselves. That makes reclamation a form of mass self-insult. My view allows them to acknowledge the label without accepting the normative judgment.

  **Elena:** Only if you separate the judgment from the truth. But if the judgment is part of the word's meaning, accepting the word *is* accepting the judgment. Unless you argue the in-group has the authority to change the extension of the term itself. But then you're admitting the semantics are context-sensitive in a way that undermines a stable CI account.

  **Marcus:** I'm admitting the *context of utterance* determines which parameters are active. The CI is a rule: "Use of this term indicates membership in a practice of subordination." In-group usage changes the practice, not the rule. The rule still points to the history. That's why it's powerful. If it were just a different word, it wouldn't carry the weight.

  **Elena:** But if the rule points to subordination, and the usage is non-subordinating, the rule is misfiring. You're asking me to believe the semantics scream "inferior" while the pragmatics whisper "equal." That's too much tension for one lexical entry.

  **Marcus:** And I'm asking you to believe that negation should kill the insult if it's truth-conditional, but it doesn't. You're stuck explaining why the "false" version of the property still harms. I'm just saying the harm isn't in the truth conditions to begin with.

  **Elena:** I'm explaining it by saying the harm is in the *invocation* of the property, which happens even when the property is denied. But that sounds suspiciously like your CI mechanism, just labeled differently.

  **Marcus:** The difference is whether that invocation contributes to the proposition's truth. I say no. You say yes. That's the split. And until we have a test that distinguishes "toxic truth conditions" from "non-cancellable conventional content," we're just describing the same elephant.

  **Elena:** Maybe. But if it's truth-conditional, we can explain why logical operators interact with it the way they do. If it's CI, it should float above the logic. Sometimes it floats, sometimes it sinks. That instability is the real problem.

  **Marcus:** Then maybe the instability isn't in the semantics. Maybe it's in the social practice the semantics hook into. The word is stable. The world isn't.

  **Elena:** *Sighs.* That's poetic, Marcus. But it doesn't help me formalize the lexical entry.

  **Marcus:** *Signals the bartender.* Then let's formalize it over another round. I'm not conceding the CI dimension yet.

  **Elena:** And I'm not conceding that truth conditions are innocent. Cheers to the stalemate.
