answer: |-
  This is an excellent question that cuts to the heart of the technical and philosophical machinery of the accuracy program. You are right to be suspicious of the hand-wavy claim that proper scoring rules just "behave like distance." That is indeed circular if left unanalyzed.

  To help you structure your term paper, I want to offer two things: first, an intuitive account of the geometric generalization (moving from Euclidean distance to Bregman divergence), and second, a sharpened distinction between the pragmatic and non-pragmatic vindications that goes beyond "money vs. truth."

  ### 1. The Generalization: From Pythagoras to Bregman

  Your intuition about the Brier score is spot on. In the Brier case, inaccuracy is squared Euclidean distance. The set of probability functions is a convex hull (a simplex). If your credence $c$ is incoherent, it lies outside this hull. By the **Projection Theorem**, there is a unique point $p$ inside the hull (the orthogonal projection) that is closer to $c$ than any other point in the hull. Crucially, because of the geometry of Euclidean space, $p$ is also closer to every *vertex* of the hull (every possible world) than $c$ is. That is the Pythagorean intuition.

  The problem, as you note, is that once we switch to a general scoring rule $\mathfrak{I}$, we no longer have Euclidean distance. We don't have right angles, and we don't necessarily have symmetry. So why does the domination result hold?

  The key is to recognize that Joyce's conditions (specifically **Strict Propriety** combined with **Continuity** and **Additivity**) force the inaccuracy measure to generate a specific geometric structure known as a **Bregman Divergence**.

  Here is the intuitive handle on why that matters:

  **A. Propriety as "Tangent Planes"**
  Strict propriety says that if your credences are probabilistic ($p$), you expect $p$ to be more accurate than any other $c$. Mathematically, this means that if you plot the *expected* inaccuracy as a surface, the point $p$ is a global minimum for that expectation.
  Geometrically, this implies that at any coherent point $p$, the "slope" of the inaccuracy function is flat relative to $p$' own expectations. Imagine a bowl. If you are at the bottom ($p$), the tangent plane is horizontal.
  If you are *incoherent* ($c$), you are not at the bottom of any such bowl defined by a probability function. You are on a slope.

  **B. Convexity and the Separating Hyperplane**
  The set of coherent credences is convex. If $c$ is incoherent, it lies outside this set. By the **Separating Hyperplane Theorem**, there is a flat plane that separates $c$ from the entire set of coherent credences.
  The magic of Bregman divergences (which proper scoring rules generate) is that they preserve a generalized version of the "obtuse angle" property found in Euclidean projections.
  In Euclidean space, the line from the incoherent point $c$ to its projection $p$ makes an obtuse angle with any line from $p$ to a world $w$. This ensures $c$ is farther from $w$ than $p$ is.
  In the general case, Strict Propriety ensures that the **gradient** of the inaccuracy function points in a direction that aligns with this separation. Even though the "contour lines" of equal inaccuracy might be stretched or skewed (not perfect circles), Propriety ensures they are **convex** and nested in such a way that moving from $c$ toward the coherent set $p$ *always* moves you "downhill" relative to every vertex $w$.

  **C. The "Why" without the Math**
  Why does Propriety guarantee this alignment? Because Propriety ties the *measure of inaccuracy* to the *structure of expectation*.
  An incoherent credence function is essentially one that has "conflicted" expectations (e.g., $P(A) + P(\neg A) > 1$). A proper scoring rule penalizes this conflict. It is designed so that the penalty for having conflicted expectations is always higher than the penalty for having consistent expectations, regardless of how the world turns out.
  The generalization works because the conditions Joyce/Pettigrew impose ensure that the scoring rule doesn't just measure "error"; it measures error *relative to the convex structure of probability*. As long as the scoring rule respects that convex structure (which Propriety ensures), the "shortest path" to accuracy is always toward the coherent set, even if "shortest" isn't measured by a ruler.

  **A Caveat for your Paper:** You should note that Joyce's 1998 proof actually contained a gap. He assumed conditions that weren't quite sufficient to guarantee the domination result for *all* proper scoring rules. This was later fixed by Predd et al. (2009) and Pettigrew, who clarified that the scoring rule must generate a Bregman divergence (essentially requiring additivity and differentiability). So, the generalization holds, but it requires slightly more technical machinery than Joyce originally stated.

  ### 2. Non-Pragmatic vs. Pragmatic: Beyond "Money"

  Your second question is equally vital. It is easy to dismiss the accuracy argument as a Dutch Book argument where we simply replace "dollars" with "inaccuracy points." If that were all it was, it would be a trivial semantic shift. The vindication is genuinely non-pragmatic for two deeper reasons:

  **A. Constitutive Aim vs. Instrumental Action**
  The Dutch Book argument relies on a link between credence and *action* (betting). It says: "If you have these credences, you will *act* in a way that guarantees loss." This makes the norm of Probabilism instrumental: you should be coherent to avoid bad consequences (losing money).
  The Accuracy argument relies on the **constitutive aim of belief**. The claim is that belief (or credence) is a mental state that, by its very nature, aims to represent the world accurately. This is not an optional goal you have (like wanting money); it is what makes a state a *credence* rather than a hope or a fear.
  Therefore, being accuracy-dominated is not just "bad for you"; it is a failure of the state to be the kind of state it purports to be. It is an internal defect, not an external penalty. The Dutch Book shows you are a bad *bettor*; the Accuracy argument shows you are a bad *believer*.

  **B. Pointwise Domination vs. Sure Loss**
  While both arguments rely on a "pointwise" result (true in every world), the modal force is different.
  *   **Dutch Book:** "There is a set of bets you *would* accept that *would* lose money." This relies on a bridge principle linking credence to betting dispositions (e.g., you *must* bet at odds matching your credence). This bridge principle is pragmatic and contestable (why must I bet?).
  *   **Accuracy:** "There is an alternative credence function that *is* more accurate." This does not rely on a bridge principle about action. It compares two cognitive states directly against the world. The "guarantee" is not that you will suffer a loss, but that your state is objectively less faithful to reality than an available alternative.

  **The "Dressed Up" Objection**
  Your classmates' worry is that accuracy is just "epistemic utility." If we treat accuracy as a utility function, aren't we just doing decision theory?
  The response (which Pettigrew emphasizes) is that in decision theory, utility is subjective (what you happen to value). In the accuracy program, the "utility" (accuracy) is **objective** and **fixed by the nature of the doxastic state**. You don't get to choose whether you value accuracy; if you have credences, accuracy is the standard by which they are assessed. Thus, the norm is categorical, not hypothetical.

  ### Summary for your Term Paper

  If you pursue this topic, your thesis could center on the claim that the **Accuracy-First program succeeds as a non-pragmatic vindication only because the mathematical generalization (via Bregman divergences) preserves the geometric necessity of the Euclidean case without relying on pragmatic bridge principles.**

  You can argue that:
  1.  **Mathematically:** The move from Brier to general scoring rules works because Strict Propriety enforces a convex geometry (Bregman divergence) that mimics the "projection" properties of Euclidean space, ensuring incoherent points are always "further out" than their coherent projections.
  2.  **Philosophically:** This mathematical result supports a non-pragmatic norm because it identifies incoherence as an intrinsic cognitive defect (dominated accuracy) rather than an extrinsic practical vulnerability (sure loss), grounded in the constitutive aim of belief.

  This should give you a robust framework to move beyond the "it acts like distance" intuition and engage with the actual philosophical weight of the program. Good luck with the seminar!
