      *   **Carter-Leslie/Bostrom Argument (SSA):**
          *   *Premise:* I am a random sample from the set of all observers who will ever exist ($N$).
          *   *Mechanism:* My birth rank $n$ is a random sample from $1$ to $N$.
          *   *Reference Class:* Crucial. "Humans," "Observers," "Observer-moments."
          *   *Key Feature:* It's about *population counts*, not just time. It relies on Bayesian updating based on indexical information ("I am here now").

