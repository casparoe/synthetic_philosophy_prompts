prompt: |-
  So I'm prepping my seminar on discounting the future, and I keep telling students that 'pure' time preference is a very specific (and kind of dubious) thing: discounting someone's welfare just because it's later, full stop -- the sort of move Sidgwick and Ramsey both basically thought was indefensible. That's supposed to be totally different from discounting because your unsure the future happens, or because future people will probably be richer than us, but every year half the class conflates them anyway. Could you write me a joke that actually turns on that exact distinction -- nobody should find it funny unless they can tell pure impatience apart from the other, more defensible reasons for a positive discount rate? No generic "economists are impatient" jokes please, I can write those myself.
