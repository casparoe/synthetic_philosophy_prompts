answer: |-
  The Social Discount Rate is hauled into the Ethics Tribunal, charged with "Undervaluing Future Generations."

  The Judge asks, "Do you have a justification for reducing the welfare of people born in 2100?"

  The Rate replies, "Yes. There is a probability they won't exist due to catastrophe."
  The Judge nods. "Valid. That's risk discounting."

  The Rate continues, "Also, they will likely be wealthier than us, so an extra dollar means less to them."
  The Judge nods again. "Valid. That's diminishing marginal utility."

  The Rate hesitates, then adds, "And... I value them less simply because they are *later*."

  The Judge bangs the gavel. "Case closed. The first two were defenses. The last one is the confession."
