      *   *Buchak's Point:* Risk aversion isn't just about caring less about the 100th dollar than the 1st (utility curvature); it's about caring less about the 1% chance of winning than the math says (probability weighting).
      *   *Conclusion on this point:* The risk function is *not* redundant. It allows representation of preferences that are mathematically impossible under EUT.

  4.  **Address the Dynamic Consistency/Money Pump Objection:**
