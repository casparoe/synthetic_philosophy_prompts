          *   *Follow-up:* If they say "it's naturalistic," ask if that reduces normativity to mere statistics.

      *   *Requirement 4: Byproducts/Spandrels.*
          *   *Draft 1:* What about male nipples? They weren't selected.
          *   *Critique:* Standard example. Need to press on the distinction between "having a causal role" and "having a function."
          *   *Refinement:* Ask if SE is too *exclusive*. Does it make biology too harsh?
          *   *Follow-up:* If they say "it's a feature not a bug," ask about traits that *do* something useful now but weren't selected for.

      *   *Filling the remaining 4 questions (to reach 8 total):*
          *   *Need:* General SE strength, Comparison with Cummins, Teleology without mysticism, Application to culture/memes (Millikan extension) or maybe Artifact functions. Let's stick to biology to keep it tight.
          *   *Q5: The "Swampman" style case.* (Replica without history).
          *   *Q6: Polyfunctionality.* (Can a trait have multiple selected effects?)
          *   *Q7: The link between Current Contribution and Past Selection.* (Why does the past matter if the current causal role is what keeps it here?)
          *   *Q8: The "Death of the Lineage" problem.* (If a species is going extinct, do traits lose function?)

      *   *Wait, let's refine the specific requirements to ensure they are the strongest 4 of the 8.*
      *   Let's make sure the 4 required topics are distinct questions. Then I need 4 more that are equally deep.
      *   *Idea for Q5 (Normativity deep dive):* Distinguish "statistical normality" from "normative normality."
      *   *Idea for Q6 (Cummins Contrast):* When *would* you concede Cummins is right? (e.g., engineering vs. biology).
      *   *Idea for Q7 (Time-Slice):* The problem of "function loss." If a trait is no longer selected for (vestigial), does it lose function immediately?
      *   *Idea for Q8 (Metaphysical cost):* Is the historical commitment too heavy for biological practice? Do biologists actually care about phylogeny when assigning function?

  4.  **Developing the Follow-ups:**
      *   The prompt specifically asks for follow-ups that anticipate dodges.
      *   *Example:* If the interviewee says "The first heart has no function," the follow-up should be "But it saves the life just as well as the 1000th heart. Are you saying biology ignores what actually keeps the organism alive?"

  5.  **Review and Polish:**
