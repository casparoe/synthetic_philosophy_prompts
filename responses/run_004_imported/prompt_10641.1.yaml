answer: |-
  Here are 8 interview questions designed for your mock podcast. They are structured to move from specific objections to broader metaphysical implications, with follow-ups that prevent your classmate from retreating into standard textbook definitions.

  ### 1. The "First Mutant" Problem (Novel Traits)
  **Question:** Let's start with the classic headache for the etiological view: the very first instance of a new trait. Imagine a random mutation produces a heart-like pump in an organism that previously had none. It pumps blood immediately and saves the organism's life, but it hasn't *yet* been selected for across generations. Strictly speaking, the Selected-Effects (SE) account says this trait has no function yet because it lacks a selection history. Are you really willing to bite that bullet and say the first heart wasn't *functioning* as a pump, even though it was doing the exact same causal work as the millionth heart?

  **Follow-up:** *If they say "It's a prototype, so it lacks proper function":* But biologically, there's no difference in the mechanism between the prototype and the production model. If the organism survives *because* of the pumping, aren't you forcing us to say the trait contributed to survival without actually *having a function*? Doesn't that sever the link between function and current survival value?

  ### 2. Godfrey-Smith's "Modern History" Fix
  **Question:** Peter Godfrey-Smith tried to patch the novel trait problem with his "Modern History" account, suggesting we only look at recent selective history to assign function. This allows new traits to gain functions quickly. But critics argue this is ad hoc—that you're just moving the goalposts of "relevant history" until the theory spits out the intuitive answer. Is there a principled biological reason to stop the clock at "recent" generations, or is this just a patch to save the theory from counterexamples?

  **Follow-up:** *If they say "It tracks the maintenance of the trait":* But maintenance implies stability. If we restrict the window to recent generations to accommodate new traits, aren't we essentially smuggling a Causal-Role criterion (what is it doing *now*?) into a historical theory? At what point does "modern history" just become a euphemism for "current contribution"?

  ### 3. Normativity and Malfunction
  **Question:** One of the biggest selling points of the Neander/Wright line is that it explains malfunction better than Cummins' Causal-Role account. A diseased heart still has the *function* to pump blood, even if it can't. You argue that history grounds this normativity: the heart *ought* to pump because that's why it's here. But how exactly does a fact about the *past* (selection) create a normative standard for the *present*? How do you get an "ought" from an evolutionary "is" without just saying "most hearts do this, so this one should too"?

  **Follow-up:** *If they say "It's not statistical, it's explanatory":* But if a trait stops contributing to fitness (like a vestigial trait), the selection pressure vanishes. If the normativity is grounded in selection, and selection stops, does the "ought" disappear? If not, what is holding the normative standard in place if the historical cause is no longer active?

  ### 4. Spandrels and Byproducts (Male Nipples)
  **Question:** Let's talk about byproducts. On the SE view, male nipples are classic spandrels: they exist because female nipples were selected for, but male nipples themselves weren't selected for anything. So, strictly, they have no "proper function." But they *do* have causal roles (nerve endings, potential for lactation under hormone therapy). Is the SE account too exclusive here? By denying them a function, are we ignoring the fact that biology often co-opts byproducts for new uses that *become* functional in a system analysis?

  **Follow-up:** *If they say "They have a causal role, just not a proper function":* That seems like a semantic shield. If a surgeon says, "What is the function of this tissue?" and the answer is "It has none, it's a spandrel," but that tissue is vital for a specific sensory capacity, aren't you creating a gap between philosophical function and biological utility? Why should biologists care about your historical distinction if it ignores what the trait actually *does* for the system?

  ### 5. The "Swampman" Organism
  **Question:** Let's push the history dependence further. If a lightning strike spontaneously assembled a molecule-for-molecule duplicate of a human (a "Swampman"), that being would have no evolutionary history. The SE theory implies none of its traits have functions. Its heart wouldn't have the function of pumping blood. This seems absurd—it would live and die exactly like us. Is the commitment to history so strong that you'd deny functional ascriptions to a physically identical organism just because it lacks a lineage?

  **Follow-up:** *If they say "Swampman is a thought experiment, not biology":* True, but it tests the metaphysics. If function is real, it should supervene on the physical state of the organism. If you say function depends on invisible historical facts external to the organism, aren't you making function extrinsic in a way that makes it irrelevant to the organism's current physiology?

  ### 6. Vestigial Traits and Function Lag
  **Question:** Consider a trait that *was* selected for but no longer is, like the human appendix or wisdom teeth in modern diets. The selection history is there, but the current contribution is negligible or negative. Does the SE view say these traits *still* have their original functions? If so, how long does the "functional credit" last after selection stops? Is there a decay rate for function, or does it last forever as long as the lineage exists?

  **Follow-up:** *If they say "Function lasts as long as the trait is present":* Then function becomes completely decoupled from current fitness. You'd have to say a trait has a function even if it actively kills the organism now, just because it helped ancestors. Doesn't that make the concept of "function" useless for explaining why the organism is currently structured the way it is?

  ### 7. Biologist Practice vs. Philosophical Theory
  **Question:** When you read actual papers in evolutionary biology or physiology, do scientists actually trace the full phylogenetic history before assigning a function? Often, they infer function from current structure and contribution (a Cummins-style approach) because the history is unknown. If the SE theory is the *correct* account of what function *is*, does that mean biologists are systematically mistaken when they assign functions without historical data? Or is your theory descriptive of a deeper reality they don't need to access?

  **Follow-up:** *If they say "They are implicitly tracking history":* But they often assign functions to traits in newly discovered species where no phylogenetic data exists yet. If they can legitimately assign function without the history your theory says is constitutive, doesn't that suggest history is evidence for function, not the definition of it?

  ### 8. The "Current Contribution" Challenge
  **Question:** Ultimately, the Causal-Role theorist argues that what matters for explaining a system is what the parts are doing *now* to keep the system running. The SE theorist says what matters is why the parts are *here*. Why should the "why it's here" trump the "what it's doing" when we are trying to understand the biology of a living organism? Isn't the etiological account looking in the rearview mirror when biology is trying to drive the car?

  **Follow-up:** *If they say "History explains the design":* But natural selection isn't a designer; it's a filter. If the filter changes (environment shifts), the "design" might be obsolete. If you prioritize the past selection over the current causal contribution, aren't you risking a theory of function that is historically accurate but biologically inert?
