          1.  Novel-trait objection (first mutant heart).
          2.  Godfrey-Smith's "Modern History" move (principled fix vs. goalpost shifting).
          3.  Malfunction/Normativity (advantage over Cummins-style Causal-Role).
          4.  Byproducts/Spandrels (male nipples).
      *   **Constraint 3:** Each question needs a follow-up that anticipates a dodge and pushes back.
      *   **Tone:** Academic but conversational (podcast style), rigorous but accessible.

  2.  **Deconstruct the SE Theory (Mental Sandbox):**
      *   *Core Claim:* The function of X is the effect for which X was selected.
      *   *Strengths:* Handles normativity (malfunction is failing to do what you were selected for), distinguishes functions from accidents/byproducts.
      *   *Weaknesses:* Novel traits (no history yet), co-opted traits (old history vs. new use), time-slice issues (how far back do we look?).
      *   *Key Figures:* Wright (original), Neander (refined, naturalistic normativity), Millikan (proper functions), Godfrey-Smith (modern history solution).
      *   *Opponent:* Cummins (Causal-Role: function = what a trait *does* in a system analysis).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Novel Traits.*
          *   *Draft 1:* What about the first heart? It pumps blood but wasn't selected yet. Does it have a function?
          *   *Critique:* Too simple. Needs to challenge the "no history = no function" implication.
          *   *Refinement:* Focus on the intuition that the first heart *does* function, even if SE says no.
          *   *Follow-up:* If they say "it's a prototype," push on the biological reality that it works *now*.

      *   *Requirement 2: Godfrey-Smith's Modern History.*
          *   *Draft 1:* Is Godfrey-Smith just changing the rules to make it work?
          *   *Critique:* A bit blunt. Needs to ask about the *principle* behind the time cutoff.
          *   *Refinement:* Ask about the arbitrariness of "recent" generations. Is it ad hoc?
          *   *Follow-up:* If they say "it tracks actual selection," ask why *that* selection counts and the older one doesn't.

      *   *Requirement 3: Malfunction/Normativity.*
