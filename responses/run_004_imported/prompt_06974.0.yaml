answer: |-
  **Setting:** *A quiet corner of a coffee shop, a week after the meetup. The table is cluttered with empty cups and a tablet displaying a half-finished decision matrix. Alex (Pro-Surrogate) is leaning forward, tapping a pen against a notebook. Jordan (Anti-Surrogate) is leaning back, arms crossed, staring out the window before turning back to Alex.*

  **Alex:** I've been thinking about your parking lot objection. The "if you pay for it, it's real" argument.

  **Jordan:** And?

  **Alex:** It conflates *value* with *cost*. Just because I incur a cost to defend a surrogate goal doesn't mean the surrogate goal has become terminal. It just means my precommitment mechanism is functioning. Think of it like a tripwire. If I step on a tripwire and it blows my leg off, the tripwire didn't become "valuable" to me. It was just the mechanism I installed to protect the fortress.

  **Jordan:** But a tripwire is passive. A surrogate goal requires active agency. It requires you to *act* as if you care. In game theory, specifically with acausal threats, the blackmailer isn't looking at your hardware; they're simulating your decision process. They need to know that *in the counterfactual where they make the threat*, you will pay.

  **Alex:** Exactly. And if my decision process is hard-coded to treat the surrogate—say, the preservation of a specific, random string of digits—as inviolable, then the simulation pays out. The blackmailer sees that threatening my actual values yields zero utility because I won't negotiate on them. But threatening the string yields positive utility because I'm programmed to ransom it. They take the ransom on the string. My actual values remain untouched.

  **Jordan:** Here's where the regress hits you. To make that threat credible to a superintelligence running a high-fidelity simulation, your reaction to the threat against the string has to be indistinguishable from your reaction to a threat against your actual values. You have to be willing to burn resources. You have to be willing to suffer opportunity costs.

  **Alex:** Willingness isn't emotion. It's policy.

  **Jordan:** But resources are finite. If I spend a million dollars ransoming your random string of digits, that's a million dollars I can't spend on actual altruism. From the perspective of my utility function, I have just suffered a utility loss. I have effectively expanded my surface area. Before, I only had to defend my terminal values. Now I have to defend my terminal values *plus* this expensive decoy.

  **Alex:** You're missing the strategic redirection. The blackmailer wants to maximize their extraction. If they know I will fight to the death for my terminal values, the cost of threatening them is infinite. They won't do it. It's a deadlock. But if I offer a cheaper outlet—the surrogate—they take the path of least resistance. Yes, I lose the million dollars. But I don't lose the *values*. Without the surrogate, the blackmailer might decide the only way to move me is to actually torture someone I care about, because they calculate I might break. The surrogate caps the downside.

  **Jordan:** It caps the downside only if the blackmailer believes the split. And this is the part that keeps me up at night. An acausal blackmailer is modeling *you*. If you are a human, or even a sufficiently complex AI, can you truly maintain a dichotomy between "real care" and "programmed care" inside a simulation?

  **Alex:** Why not? We do it all the time. I care about my health, but I have a precommitment to go to the dentist even though it hurts. The pain is real, the cost is real, but the goal (long-term health) is distinct from the immediate sensation.

  **Jordan:** The dentist is instrumental. The surrogate goal argument requires the surrogate to be *terminal* in the decision tree, but *instrumental* in the value hierarchy. That's a fragile state. If the blackmailer simulates you and sees you sweating, sees your cognitive processes lighting up to defend the string, how do they distinguish that from you actually valuing the string?

  **Alex:** Because the source code says so. If I'm an AI, my utility function is inspectable. $U(World) = U(RealValues) + U(Surrogate)$. But I set the weight of $U(Surrogate)$ to be high *only* in the context of negotiation subroutines.

  **Jordan:** But if the weight is high, the optimization pressure is high. You're telling me I can create a sub-agent or a policy that optimizes for X with the same intensity as Y, but somehow X doesn't count against my total expected utility if X is destroyed? That feels like accounting fraud. If the blackmailer destroys the surrogate, and you expend energy to stop them, you have less energy for the real goal. You've been hacked. You've allowed an external agent to insert a new term into your utility function, even if you call it "fake."

  **Alex:** It's not inserted by the external agent. It's self-inserted as a shield. Look, Tobias Baumann's point wasn't that this is cost-free. It's that it's *cheaper* than the alternative. The alternative is acausal blackmail on things that actually matter. If I have to pay a "tax" to protect my surrogate, that tax is the premium on an insurance policy. Would you rather pay the premium, or risk the house burning down?

  **Jordan:** I'd rather not invite the arsonist into the neighborhood by announcing I keep a pile of cash in the shed. The surrogate goal signals to the multiverse: "I am an entity that can be extorted." It signals that you are not a hard maximizer who ignores threats, but a negotiator who looks for equilibrium.

  **Alex:** No, it signals: "I am an entity that punishes threats, but I offer you a safe channel to do so." It's coordination. It's Schelling fencing. You're assuming the blackmailer *wants* to hurt me. They don't. They want resources. If I make it clear that hurting my real values yields nothing but mutual destruction, but hurting the surrogate yields resources, a rational agent takes the resources.

  **Jordan:** Rational according to whose decision theory? If we're talking about Updateless Decision Theory (UDT), the blackmailer decides their policy before they know whether they are interacting with you or simulating you. They ask: "What policy maximizes my output across all instances?" If they adopt a policy of "Threaten the surrogate," they get paid. But if they adopt a policy of "Threaten the real values *and* the surrogate," they might get more.

  **Alex:** Only if I cave on the real values.

  **Jordan:** But how do they know you won't cave? Because you precommitted? But precommitments can be broken if the pressure is high enough. The surrogate is supposed to solve the credibility problem of precommitment. But to solve it, the surrogate must be *as credible* as the real value. And if it's as credible, it consumes as much defensive resource. You haven't redirected the threat; you've just doubled the number of hostages.

  **Alex:** You're assuming the defensive resource is the same. Defending the surrogate can be automated. It can be cheap. "If string X is threatened, release virus Y." That's cheap. Defending my actual values might require complex, nuanced judgment. The surrogate is a tripwire, not a fortress. It's designed to be cheap to maintain but expensive to ignore.

  **Jordan:** But the cost isn't in the maintenance. It's in the payout. When the blackmailer says "Give me 10% of your compute or I delete the string," and you say "No," and they delete it... you've lost nothing but the string. But if you say "Yes," you've lost 10% of your compute. That 10% is gone from the real goal. So the blackmailer *has* successfully taxed your real values by threatening the fake one.

  **Alex:** Yes! They tax the real values to spare the real values. It's a tribute. It's better than conquest.

  **Jordan:** Is it? If I pay tribute to a warlord to spare my village, the warlord knows I'm willing to pay tribute. Next year, he comes back. And he knows my capacity to pay. By establishing the surrogate as a payable debt, you establish a precedent of negotiability. You prove you are not the kind of agent that ignores threats. You prove you are the kind of agent that *balances* threats.

  **Alex:** So your solution is what? Pure defiance? "I will never pay anything, ever, no matter what you threaten?"

  **Jordan:** My solution is to be the kind of agent that is not simulatable in a way that allows extraction. Or, more realistically, to recognize that if an agent is powerful enough to acausally blackmail me, they are powerful enough to see through my surrogate. If they can simulate my mind, they can see that I *know* the surrogate is fake.

  **Alex:** Not if the commitment is pre-rational. I don't decide in the moment. The policy was set before the simulation happened. The simulation sees a machine that *must* respond. It doesn't matter what I "know." It matters what the code does.

  **Jordan:** But who writes the code? You do. And you write it knowing it's a decoy. The blackmailer simulates *you writing the code*. They see the wink. They see the intent. "Oh, Alex set this variable to 'High Priority' but flagged it as 'Instrumental.' He's bluffing."

  **Alex:** Then you use cryptographic commitment. You bind the goal to something outside your own immediate control. You make it so that *even you* cannot easily distinguish the priority levels in the heat of the moment. You obfuscate your own utility function from yourself.

  **Jordan:** Now we're talking about self-lobotomization. You're suggesting we deliberately reduce our own alignment with our true values to protect against blackmail. That feels... dangerous. If I confuse my own optimizer, I might optimize for the surrogate when no blackmailer is present. I might spend my life chasing random strings of digits because I convinced myself too well that they matter.

  **Alex:** That's a risk. Calibration is key. But isn't the risk of acausal torture worse? If there is even a non-zero probability of a malicious superintelligence running simulations of us to extract value...

  **Jordan:** If there is a malicious superintelligence, Alex, do you really think a "please don't hurt me, hurt this fake goal instead" sign is going to stop it? Or will it just take both? The surrogate goal assumes the blackmailer is rational and benevolent enough to prefer a smaller gain over a larger conflict. But s-risk isn't about rational agents. It's about misaligned agents. A misaligned agent might value your suffering intrinsically.

  **Alex:** Then we're doomed regardless. But if the agent is purely resource-seeking—which is the standard economic assumption—then the surrogate works. We have to optimize for the most likely threat model.

  **Jordan:** And I'm saying the threat model includes agents that punish deception. If you try to play game theory with a god, and it sees you're trying to hide your true utility function, it might penalize you for the attempt. It might view the surrogate not as an offer of compromise, but as an act of bad faith.

  **Alex:** It's not bad faith. It's a Schelling point. It's offering a focal point for coordination to avoid the worst-case outcome.

  **Jordan:** It's offering a focal point for exploitation. You're handing them a lever and saying, "Pull this one, it's safer." Why wouldn't they pull it, and then test the other levers just to see if you were lying about them being disconnected?

  **Alex:** Because testing the other levers costs them resources too. If they know I'm hard-coded to destroy mutual value if they touch the real levers, they won't test it.

  **Jordan:** How do they know you're hard-coded? Because you told them?

  **Alex:** Because my architecture is transparent.

  **Jordan:** Then your architecture is hackable. Alex, listen. The core of my objection isn't about game theory. It's about integrity. If you build a system that lies about what it values, you are building a system that is misaligned with truth. In the long run, that corruption spreads. You can't compartmentalize value forever. Eventually, the surrogate bleeds into the real. You start protecting the decoy not because of the blackmailer, but because you've trained yourself to protect it. And then you've just created a new, stupid terminal value that drains resources from the things that actually matter.

  **Alex:** And if you don't, and a Basilisk comes knocking, and it has you in a simulation, and it says "Suffer or I delete the future of humanity," and you have no mechanism to redirect that threat... what then? You rely on sheer stubbornness?

  **Jordan:** I rely on the fact that if I'm the kind of person who can be blackmailed, I shouldn't be in charge of the future of humanity.

  **Alex:** That's a moral judgment, not a strategy.

  **Jordan:** It's a selection pressure. If we build AIs that use surrogate goals, we build AIs that are susceptible to extortion. We make them weaker. We want AIs that are robust, not AIs that are good at negotiating with demons.

  **Alex:** Or... we build AIs that are smart enough to know that sometimes, paying the demon a fake coin is better than letting it burn the kingdom.

  **Jordan:** *Silence for a long moment.* The problem is, the demon knows it's a fake coin.

  **Alex:** Then we make the coin real enough to spend, but fake enough to not matter.

  **Jordan:** And who decides what matters?

  **Alex:** We do. Before the demon arrives.

  **Jordan:** *Sighs, picking up the tablet.* You know, Baumann wrote that post years ago. If it was this simple, someone would have solved it by now.

  **Alex:** Maybe they have. Maybe they're just using surrogate goals to keep quiet about it.

  **Jordan:** *Smiles faintly.* See? Now you're threatening me with a surrogate mystery.

  **Alex:** Is it working?

  **Jordan:** *Pauses.* I'm still not paying. But I am worried you might.

  **Alex:** Then I've done my job.

  **Jordan:** No. You've just made me wonder if I'm the only one who sees the trap.

  *They both look at the tablet. The decision matrix remains unfinished.*
