answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two coffee cups sit untouched. **Elena** (Coherence Theorist) and **Marcus** (Resolute Choice Defender) have been colleagues for years. They know the user, a retired physicist named Arthur, is listening in.*

  **Elena:** Arthur, I know you've been enjoying the thermodynamic analogy. It's elegant, isn't it? A money pump is a perpetual motion machine of the first kind. If your preferences cycle $A \succ B \succ C \succ A$, and I offer you trades along that cycle, you end up back at $A$ but poorer. You've dissipated wealth for no gain in state. Just as physics forbids $\oint dW > 0$ in a closed cycle, decision theory forbids ending up strictly worse off by your own lights.

  **Marcus:** It is elegant, Elena. But it assumes the agent is a fluid in a pipe, governed entirely by local pressure gradients. That's the myopic agent. We agree the myopic agent is irrational. But Arthur knows from non-equilibrium thermo that systems can have memory. They can have hysteresis. A resolute agent isn't a fluid; she's a control system with a feedback loop that references a prior state. She doesn't re-optimize at every node. She executes a plan.

  **Elena:** And that is where the analogy breaks down, and where Gustafsson catches you. Let's be concrete. Suppose I have cyclical preferences over apples, bananas, and cherries. I face a money pump. You, Marcus, say: "Don't re-optimize. At time $t_1$, form a plan to stop at Banana, and at time $t_2$, stick to that plan even if you prefer Cherry locally."

  **Marcus:** Precisely. By binding myself to the plan, I avoid the cycle. I keep the banana and my money. I am not exploited.

  **Elena:** But *which* plan? That is the question Gustafsson presses, and I think decisively. In a cycle $A \succ B \succ C \succ A$, there are three distinct plans that avoid the full loop: Stop at $A$, Stop at $B$, or Stop at $C$. Each avoids the sure loss. To select *one* of these plans at the outset, you must have a preference over the plans.

  **Marcus:** I have a preference for not being exploited. That's the meta-preference.

  **Elena:** That's too thin. All three plans avoid the full exploitation loop. If I choose the "Stop at $A$" plan, I end up with $A$. If I choose "Stop at $B$", I end up with $B$. Since you hold that my underlying preferences are cyclical, I strictly prefer $B$ to $A$. So, if I choose the "Stop at $A$" plan, I am choosing an outcome I regard as inferior to the outcome of the "Stop at $B$" plan. To choose rationally among these plans, I must rank the outcomes. But if I can rank the outcomes to choose the plan, I already have a complete, transitive ordering over outcomes! The money pump argument was supposed to *derive* the requirement for that ordering from the avoidance of exploitation. But your resolute choice solution *presupposes* that ordering to select the resolution. It's circular.

  **Marcus:** You're assuming that the ranking of plans must derive from the ranking of outcomes. That's the substantive view of rationality: rationality is just maximizing value. But McClennen's point—and mine—is that rationality is also procedural. It's about the capacity to act as a temporally extended agent.

  **Elena:** Procedural rationality can't override substantive loss, Marcus. If I resolve to take $A$ when I could have resolved to take $B$, and I prefer $B$ to $A$, I have knowingly acted against my preference.

  **Marcus:** Not against my *preference*. Against my *local inclination* at time $t_2$. Look, Arthur, think of a phase transition. The system doesn't slide smoothly; it snaps. Resolute choice is the snap. The rationality isn't in the value of the final state alone; it's in the integrity of the trajectory. What makes the plan rational is not that it maximizes a utility function defined over outcomes, but that it satisfies a norm of *diachronic consistency* that is primitive.

  **Elena:** But "diachronic consistency" is doing too much work there. If I prefer $B$ to $A$ at $t_1$, and I plan to take $A$, I am inconsistent at $t_1$. If I prefer $A$ to $B$ at $t_2$ (because the cycle shifted my context), and I take $A$, I am consistent at $t_2$. Resoluteness requires me to ignore my preference at $t_2$. Why is that rational? Gustafsson argues it's only rational if I value the *plan itself* more than the outcome. But valuing the plan means I have a utility function over plans. And if I have a utility function over plans that is complete and transitive, why aren't we just doing Expected Utility Theory over a richer domain?

  **Marcus:** Because the utility over plans isn't derived from the outcomes! It's derived from the status of being an agent who can bind herself. It's a constitutive norm. To be an agent *just is* to be capable of adopting a policy and following it. If you lack that, you aren't an agent with preferences; you're a sequence of agent-stages. The money pump exploits the gaps between the stages. Resoluteness closes the gaps.

  **Elena:** That sounds profound, but let's test it. Suppose my preferences are $A \succ B \succ C \succ A$. I also have a strong preference for keeping my money. The pump offers trades that cost \$1 each.
  Plan 1: Keep $A$, pay \$0.
  Plan 2: Trade to $B$, pay \$1, then stop.
  Plan 3: Trade to $C$, pay \$2, then stop.
  Even with cyclical preferences over fruit, surely I prefer Plan 1 to Plan 3 because of the money.

  **Marcus:** Agreed.

  **Elena:** So now your preferences over *plans* are transitive, even if your preferences over *fruit* are not. You prefer Plan 1 > Plan 2 > Plan 3. Why? Because Plan 1 yields $(A, \$0)$, Plan 2 yields $(B, \$1)$. If you prefer Plan 1 to Plan 2, you are effectively saying $(A, \$0) \succ (B, \$1)$. If the cost is negligible, you are saying $A \succ B$. But earlier you said $B \succ A$. You've resolved the cycle by introducing a new variable (money) that forces a transitive ranking.
  But Gustafsson's deeper point is this: If the preferences over fruit are *truly* incomplete or cyclical, and the money is negligible, what breaks the tie between "Stop at $A$" and "Stop at $B$" if not a hidden ranking? If you say "I resolve arbitrarily," then you aren't rational, you're random. If you say "I resolve based on which I like better," you admit you *do* like one better, so the cycle was an illusion.

  **Marcus:** You're forcing a false dichotomy: either I have a hidden value ranking, or I am random. There is a third option: *Volition*.
  I don't choose the plan because $A$ is better than $B$. I choose the plan because *I chose it*. The authority of the plan comes from the act of commitment, not the content of the outcome.
  Think of it like a gauge symmetry in physics. The absolute value doesn't matter; the invariance matters. Resolute choice asserts that the agent's identity over time is the invariant. The "rationality" is the preservation of that identity against local perturbations.

  **Elena:** But Arthur knows that gauge symmetries still have to yield observable invariants. If your theory of rationality allows you to choose Plan $A$ today and Plan $B$ tomorrow in identical circumstances, simply because you "resolved" differently, it has no predictive or normative bite.
  Gustafsson argues that for resoluteness to be a *norm*, it must guide choice. If I ask, "Which plan should I resolve to follow?", and you answer "Whichever you will," you haven't answered. If you answer "The one that leads to the best outcome," you've surrendered to utility maximization.
  The coherence argument shows that if you want to avoid sure loss, you must behave *as if* you have a utility function. Resolute choice says, "I can avoid sure loss without having a utility function." I say that's impossible. To avoid the loss, you must select a specific path out of the cycle. That selection *is* the utility function. You haven't escaped EUT; you've just hidden the utility function inside the "resolution" mechanism.

  **Marcus:** I haven't hidden it; I've relocated it. You assume the only source of normativity is the Good (the outcome). I argue there is also the Right (the procedure).
  Consider a voter with cyclical preferences over policies. Condorcet says they're irrational. But if they commit to a voting strategy—say, "I will always support the status quo unless there is a Pareto improvement"—they avoid cycles. Is that voter irrational? No, they've adopted a rule.
  Resolute choice is adopting a rule of choice. The rule isn't "Maximize $U$." The rule is "Do not deviate from a prior intention without new information."
  You ask, "Why adopt *this* rule and not *that* one?" That's the wrong question. The rationality is in the *adherence* to a rule, whatever it is, provided it blocks the pump.

  **Elena:** But if the rule is arbitrary, the agent is vulnerable to a *different* pump. Suppose I have a rule: "Always stop at the first option." A clever trader can arrange the options so the first one is the worst.
  To avoid *all* pumps, the rule must be sensitive to the value of the outcomes. It must say "Stop at the best option." But if you can identify the best option, you have a ranking!
  Gustafsson's "Upfront Money Pump" is devastating here. He constructs a scenario where you pay to be given the opportunity to be resolute. If your resoluteness isn't grounded in a ranking of outcomes, you might pay to commit to a plan that leads to a worse outcome than a different commitment. If you wouldn't pay to commit to a bad plan, then you are ranking the plans. If you are ranking the plans based on outcomes, you have a utility function.

  **Marcus:** You keep returning to the idea that ranking plans based on outcomes implies a utility function over outcomes. It implies a *comparative judgment*, yes. But it doesn't imply that the judgment exists *prior* to the choice in the way EUT demands.
  EUT says the preference exists, and the choice reveals it.
  Resolute Choice says the choice *creates* the preference stability.
  When I resolve to stop at $B$, I am not discovering that $B$ is best. I am *making* $B$ the best by committing to it. I am changing the normative landscape.
  You say this is question-begging. I say it's agency. The "bottoming out" you're looking for, Elena, is here: Do you believe rationality is about tracking independent values, or is it about constructing a coherent will?

  **Elena:** I believe rationality is about not losing things you value. If you construct a coherent will that systematically leads you to lose things you value (because you resolved to take $A$ when $B$ was available and preferred), your will is coherent but your agency is defective.
  The thermodynamics analogy holds here. You can have a very coherent, consistent engine. But if it violates the Second Law, it doesn't run. The Second Law isn't a rule we choose; it's a constraint on what is possible for systems that exchange energy.
  Coherence arguments show that if you exchange resources (money, goods) in a market, cyclical preferences are *impossible* to maintain without loss. It's not a normative suggestion; it's a structural constraint. Resolute choice tries to legislate around a structural constraint by saying "I won't look at the local prices." But the market doesn't care about your resolution. If you walk away from a trade you locally prefer, you've incurred an opportunity cost. To justify that cost, you need a higher-order value. That higher-order value *is* the utility function.

  **Marcus:** But the "opportunity cost" is only a cost relative to a preference! If I resolve not to trade, then the trade was never a genuine opportunity for *me*, the extended agent. It was only an opportunity for my time-slice at $t_2$.
  You say the market doesn't care about my resolution. True. But the market interacts with *me*, not my time-slices. If I walk in, state my plan, and execute it, the market sees a stable agent. I don't lose money. The pump fails.
  The disagreement isn't about whether I lose money. We agree the resolute agent keeps the money.
  The disagreement is about *why* that's rational.
  You say: "It's rational because it maximizes the value of the final state (Money + Good)."
  I say: "It's rational because it instantiates the capacity for planning."
  If Arthur accepts your view, decision theory is just physics with dollars. If he accepts mine, decision theory is a branch of ethics or metaphysics of agency.

  **Elena:** And if he accepts your view, he can't explain why he shouldn't resolve to burn his money for no reason, provided he sticks to the plan. If the norm is just "stick to the plan," then a resolute spendthrift is as rational as a resolute saver.

  **Marcus:** No, because the plan must be *adoptable*. I can't adopt a plan to burn money if I value money. The adoption phase filters out self-destructive plans. But that filtering doesn't require a complete, transitive ordering over all possible outcomes. It just requires enough stability to block the cycle. We don't need the full machinery of EUT. We just need enough structure to close the loop.

  **Elena:** "Enough structure to close the loop" *is* a utility representation theorem in disguise. That's what Gustafsson proves. If you can always select a plan that avoids pumps, your selection function satisfies the axioms of EUT. You've reinvented the wheel and claimed it's a square because you painted it differently.

  **Marcus:** I've reinvented the wheel, but I've explained *why* it turns. EUT says "Agents maximize." I say "Agents plan." Maximization is a byproduct of successful planning in a stable environment. But when preferences are incomplete or cyclical, maximization fails. Planning survives.
  Arthur, you worked in non-equilibrium thermo. You know that far from equilibrium, state functions break down. Path dependence rules. EUT assumes equilibrium. Resolute choice is the thermodynamics of the far-from-equilibrium agent.

  **Elena:** And in non-equilibrium thermo, we still conserve energy. We don't say "Energy isn't conserved because the path is complex." We say "There are hidden variables."
  My claim is that the "Resolution" is the hidden variable. It's a utility function over plans.
  Your claim is that the "Resolution" is a primitive force.
  We can't settle this without agreeing on whether normativity comes from the Good or the Will.

  **Marcus:** Precisely. And that is why the money pump doesn't settle it. The pump shows you lose money if you are myopic. It doesn't show you lose *rationality* if you are resolute. It only shows that if you are resolute, you must have a source of normativity other than local preference satisfaction.

  **Elena:** And I say that source *is* a preference satisfaction function, just at a higher level. If you deny that, you have no account of why one resolution is better than another.

  **Marcus:** And I say the "better" is internal to the agency, not external in the outcomes.
  *(Marcus takes a sip of cold coffee.)*
  We're at the bedrock, Elena. You want a state function. I'm telling you the system is path-dependent.

  **Elena:** And I'm telling you that if the path forms a loop and you end up lower than you started, you've violated conservation. No amount of "will" changes the balance sheet.

  **Marcus:** The balance sheet is balanced. I kept the money. The only thing you think I lost is the "true preference." But maybe there was no true preference to lose. Just the choice.

  **Elena:** Then rationality is just consistency.

  **Marcus:** Yes.

  **Elena:** And consistency without value is empty.

  **Marcus:** And value without consistency is impossible.

  *(They sit in silence for a moment, looking at Arthur.)*

  **Elena:** Arthur, you see the problem. If Marcus is right, decision theory can't tell you what to choose, only how to stick to it.

  **Marcus:** And if Elena is right, decision theory can tell you what to choose, but only by assuming you're already the kind of agent who doesn't need to be told.

  **Elena:** So the money pump proves you must be an EUT agent.

  **Marcus:** No. It proves you must be a *resolute* agent. Whether that makes you an EUT agent depends on whether your resolutions track values or create them.

  **Elena:** Which we can't observe.

  **Marcus:** Which *is* the agent.

  *(They both turn to Arthur, neither conceding, the gap between "rationality as tracking" and "rationality as constituting" left wide open.)*
