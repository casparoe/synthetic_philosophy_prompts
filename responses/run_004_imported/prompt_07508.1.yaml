prompt: |-
  I'm taking a democractic theory seminar this semester and we spent a whole class on what my professor called "the boundary problem" - basically the puzzle that a democracy is supposed to let "the people" decide things, but there's no non-circular democratic way to decide who counts as "the people" in the first place, since any vote on that question already needs an electorate to run it. We went through a couple of rival answers (something like the all-affected-interests principle vs. an all-subjected or coercion-based principle - Goodin and Abizadeh maybe? my notes are a mess) but it all stayed pretty abstract, focused on nation-states and border cases.

  Afterwards a few of us started arguing about whether any of this actually cashes out for smaller cases, using my apartment building's tenants committee as the test case. Right now voting is one-per-lease, but we've got a landlord who owns three units here but lives across town, several adult kids/partners who live here full time but aren't on any lease, a rotating cast of month-to-month sublet and Airbnb-ish guests, and a superintendent whose whole job is shaped by whatever we vote through even though he doesn't live here. Could you lay out the most important implications of the boundary problem debate for a small, low-stakes case like this? I don't just want "this is a famous unsolved problem," I want your actual take on which considerations should carry the most weight here and what that implies for the landlord, the non-lease residents, and the sublet guests specifically.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A democratic theory seminar student.
      *   **Topic:** The "Boundary Problem" (who constitutes "the people" in a democracy).
      *   **Specific Scenario:** An apartment building's tenants committee.
      *   **Current Rule:** One vote per lease.
      *   **Stakeholders:**
          *   Landlord (owns 3 units, lives elsewhere).
          *   Adult kids/partners (live there full-time, not on lease).
          *   Subletters/Airbnb guests (short-term, rotating).
          *   Superintendent (works there, affected by decisions, doesn't live there).
      *   **Goal:** Don't just say "it's unsolved." Provide an *actual take* on which considerations matter most and apply them to the specific stakeholders. Move from abstract theory to concrete implications.

  2.  **Deconstruct the Theoretical Frameworks (Mental Sandbox):**
      *   *All-Affected Interests (AAI):* Anyone affected by a decision should have a say. (Goodin is the big name here).
      *   *All-Subjected Principle (ASP) / Coercion:* Anyone subject to the coercive power of the rules should have a say. (Abizadeh, López-Guerra).
      *   *Stakeholder Citizenship:* A mix, focusing on genuine stake in the community.
      *   *Pragmatic/Functional:* What makes the system workable?

  3.  **Evaluate the Stakeholders against the Theories:**

      *   **Landlord (owns 3 units, lives elsewhere):**
          *   *AAI:* Highly affected financially. Property value, maintenance costs, rental income.
          *   *ASP:* Is he coerced? Yes, committee rules might restrict what he can do with the property.
          *   *Counter:* He doesn't *live* the consequences daily. Power imbalance risk (3 votes vs. 1 for others?).
      *   **Adult Kids/Partners (live there, not on lease):**
          *   *AAI:* Highly affected. Quality of life, safety, noise, amenities.
          *   *ASP:* Subject to the rules (quiet hours, guest policies).
          *   *Counter:* No legal contract (lease). Transience? (Usually less transient than Airbnb).
      *   **Subletters/Airbnb (short-term):**
          *   *AAI:* Affected while there, but short duration.
          *   *ASP:* Subject to rules while present.
          *   *Counter:* No long-term stake. High turnover makes administration impossible. Potential for "vote harvesting" by landlords.
      *   **Superintendent (works there, lives elsewhere):**
          *   *AAI:* Affected professionally. Rules change his workload/safety.
          *   *ASP:* Subject to workplace rules, but not residential rules.
          *   *Counter:* Economic relationship (employment) vs. civic relationship (residence). Conflict of interest (bosses are the tenants/landlord).

  4.  **Develop a "Take" (Synthesis & Recommendation):**
      *   *Premise:* In a micro-context like a housing co-op or tenants committee, the goal isn't just abstract justice; it's *sustainable self-governance*. The boundary should align with *shared fate* and *capacity to participate*.
      *   *Core Principle:* A hybrid of "All-Subjected" (coercion) and "Stakeholder" (duration/intensity of interest).
      *   *Why?* Pure AAI is too broad (Superintendent? Neighbors?). Pure ASP is tricky (is a rule coercion?). We need to filter for *residential stake*.

  5.  **Drafting the Implications (Iterative Process):**

      *   *Landlord:* He has a financial stake, not a residential one. If he gets votes, it becomes a plutocracy (money = votes via unit ownership). *Verdict:* No vote, but maybe consultation rights.
      *   *Non-Lease Residents:* They are the strongest case for inclusion. They suffer the consequences daily. The lease is a legal formality, not a moral boundary. *Verdict:* Full voting rights (perhaps after a probationary period to prove residence).
      *   *Subletters/Airbnb:* Too transient. The administrative burden outweighs the democratic benefit. They are consumers, not citizens. *Verdict:* No vote.
      *   *Superintendent:* This is the trickiest. He is affected, but including him blurs the line between labor and governance. It creates a conflict where the "bosses" (tenants) vote on the "worker's" conditions. *Verdict:* No vote on residential issues, maybe a voice on safety/maintenance issues specifically.

  6.  **Refining the Argument (Addressing the "Boundary Problem" specifically):**
      *   Acknowledge the circularity but dismiss it as paralyzing. In practice, boundaries are drawn based on *purpose*.
      *   What is the purpose of *this* committee? It's residential governance, not property management or labor negotiation.
      *   Use the concept of "Intensity of Impact" + "Duration."

  7.  **Final Polish:**
      *   Tone: Academic but accessible, respectful of the seminar context, decisive (as requested).
      *   Structure:
