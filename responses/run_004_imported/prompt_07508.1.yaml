answer: |-
  This is a fantastic application of democratic theory. You are right to be skeptical of staying at the level of the nation-state; the boundary problem is actually *more* visible in micro-polities because the stakes are immediate and the categories are messy.

  The circularity problem (who decides who decides) is logically unsolvable, but practically, we solve it by asking: **What is the specific good this political community is trying to achieve?**

  In a nation-state, the good might be "justice" or "sovereignty." In a tenants' committee, the good is **shared residential stability and quality of life.**

  If we accept that purpose, we can move past the abstract tug-of-war between the *All-Affected Interests (AAI)* principle (Goodin) and the *All-Subjected Principle (ASP)* (Abizadeh). Neither works perfectly on its own here. AAI is too broad (the superintendent is affected; the neighbors across the street are affected by noise). ASP is too legalistic (why should a piece of paper, the lease, determine moral standing?).

  Here is my take on how to draw the boundary for your building, ranked by the weight of their claim to membership.

  ### 1. The Non-Lease Residents (Adult Kids/Partners)
  **Verdict: Full Voting Rights.**

  This is the clearest case where the current "one-per-lease" rule fails democratic theory.
  *   **The ASP Argument:** These individuals are subject to the coercion of the committee's rules. If the committee bans grills on the balcony or sets quiet hours, these rules bind the partner just as much as the leaseholder. To subject them to rules without representation is taxation without representation.
  *   **The AAI Argument:** Their interests are affected as intensely as the leaseholder's. In fact, if the leaseholder is at work all day, the partner might be *more* affected by decisions regarding common space usage or maintenance noise.
  *   **The Practical Fix:** The lease is a financial contract, not a democratic constitution. Tying voting rights to a name on a lease privileges legal formalism over actual residence.
  *   **Implementation:** Voting rights should be tied to **proof of primary residence** (e.g., ID registration, or a simple 3-month durational requirement) rather than the lease. This prevents the "circularity" issue by using an empirical fact (living there) rather than a political decision (who we allow to vote).

  ### 2. The Landlord (Owner of 3 Units, Non-Resident)
  **Verdict: No Voting Rights (but Consultation Rights).**

  This is where the tension between "property rights" and "democratic equality" peaks.
  *   **The AAI Argument:** The landlord is massively affected. Committee decisions on assessments, renovations, or pet policies impact his ROI and property value. Under a pure Goodin-style AAI, he has a huge claim.
  *   **The Counter-Argument (The "Stakeholder" View):** Democracy in a residential context is about *living together*, not *investing together*. The landlord does not share the "fate" of the building in the same way. He does not suffer the noise, smell the garbage, or navigate the hallway.
  *   **The Plutocracy Risk:** If you allow the landlord to vote, and he owns 3 units, does he get 3 votes? If yes, you have created a plutocracy where capital equals political power. If he gets 1 vote total, he is still an outsider imposing will on residents.
  *   **Implementation:** The landlord should be treated like an **executive branch** or a **foreign stakeholder**. He must be consulted on decisions that affect structural integrity or legal liability, but he should not have a vote on *residential* quality-of-life issues. He is subject to the committee's rules, but only because he contractually agreed to lease the units, not because he is a member of the demos.

  ### 3. The Subletters / Airbnb Guests
  **Verdict: No Voting Rights.**

  This is where we must reject the pure All-Affected Interests principle for pragmatic reasons.
  *   **The AAI Problem:** Technically, a guest staying for 3 days is "affected" by the Wi-Fi password policy or the pool hours. However, democratic membership requires a **temporal stake**.
  *   **The "Transient" Objection:** Democracy requires accountability. If a voter makes a bad decision (e.g., voting to cut maintenance costs to lower fees), they need to be around to suffer the consequences later. Airbnb guests can vote for short-term benefits and leave before the long-term costs arrive.
  *   **Administrative Impossibility:** A boundary must be administrable. Verifying the residency of a partner is easy. Verifying the "citizenship" of a rotating cast of subletters creates a bureaucratic nightmare that kills the committee's function.
  *   **Implementation:** They are **consumers**, not citizens. They purchase the right to use the space, which includes abiding by the rules, but not the right to make them.

  ### 4. The Superintendent
  **Verdict: No Voting Rights (but a Formal Voice).**

  This is the hardest case and the best test of your theory.
  *   **The AAI Argument:** The superintendent is profoundly affected. If the tenants vote to stop snow removal to save money, the super is the one who gets yelled at or has to work harder. If they vote to install new security, his job changes.
  *   **The Labor vs. Polity Distinction:** Including the super blurs the line between a **political community** (residents) and a **workplace** (employment). If the super gets a vote, he is effectively sitting on a board that manages his own employment conditions. This creates a conflict of interest.
  *   **The Power Dynamic:** If the super has a vote, tenants might feel pressured to vote a certain way to keep the super happy (since he holds the keys, literally). Conversely, the super might vote to please the tenants to secure his job.
  *   **Implementation:** He should not be a *voting member* of the residential demos. However, under a deliberative democracy model, he should have a **non-voting seat** or a mandatory consultation period on issues regarding safety, maintenance, and building systems. He is a stakeholder, but not a citizen of the residential polity.

  ### Summary of the "Residential Stakeholder" Principle

  To solve the boundary problem in your building, you should argue for a hybrid principle I'd call **Residential Stakeholding**.

  1.  **Intensity of Impact:** Do you live with the consequences daily? (Excludes Landlord, Airbnb).
  2.  **Duration:** Will you be around to face the long-term results of the vote? (Excludes Airbnb).
  3.  **Nature of Relationship:** Is this a civic/residential relationship or an economic one? (Excludes Landlord as voter, excludes Super as voter).

  **The Implication for Your Seminar:**
  The lesson here is that the "Boundary Problem" isn't solved by finding a magic philosophical formula that works everywhere. It is solved by defining the **telos** (purpose) of the specific association.

  *   If the association is a **Property Investment Club**, the Landlord gets the most votes.
  *   If the association is a **Labor Union**, the Superintendent gets the vote.
  *   If the association is a **Residential Community** (which it is), then *residence* is the only non-circular, morally defensible boundary.

  The "circularity" is broken by appealing to the pre-political fact of **shared living space**. You don't vote on who lives there to decide who votes; the fact that they live there (and intend to stay) grants them the standing. This privileges the non-lease partners, excludes the capitalist landlord, and sidesteps the transient guests, without needing a meta-vote to decide it.
