  2.  **Analyze the St. Petersburg Paradox (SPP):**
      *   *Setup:* Coin flip game. Payoff $2^n$ if heads first appears on flip $n$.
      *   *Problem:* Expected Value (EV) = $\sum (1/2^n) \cdot 2^n = \sum 1 = \infty$. Rational agent should pay any finite amount to play. Intuition says no.
      *   *Bernoulli's Solution:* Utility $U(x) = \ln(x)$. Expected *Utility* is finite. $\sum (1/2^n) \cdot \ln(2^n) = \sum (1/2^n) \cdot n \ln(2) < \infty$.
      *   *Key Mechanism:* The payoff grows exponentially, but utility grows logarithmically. The infinite sum converges.

  3.  **Analyze the Two-Envelope Paradox (TEP):**
      *   *Setup:* Two envelopes, amounts $X$ and $2X$. Pick one (call it $A$). See amount $a$. Other envelope ($B$) has either $a/2$ or $2a$ with probability 0.5 each.
      *   *The "Switching Argument":* $E[B] = 0.5(a/2) + 0.5(2a) = 1.25a$. Since $1.25a > a$, always switch.
      *   *The Problem:* Symmetry implies switching shouldn't matter. Also, if you switch, the same logic applies to the new envelope, leading to infinite switching.
      *   *Key Mechanism:* The error usually lies in the probability assignment. Treating the probability of the other envelope being half or double as 0.5 *independent of the prior distribution of money in the envelopes*.

