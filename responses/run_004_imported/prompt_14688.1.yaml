      *   **Human Irrationality/Bias:** Humans aren't rational agents maximizing a single reward function. We have biases, akrasia (weakness of will), addiction, etc. IRL assumes rationality (usually).
      *   **The "Is-Ought" Problem:** Just because someone *does* something doesn't mean they *should* be rewarded for it. (Revealed preferences vs. normative preferences).
      *   **Distributional Shift:** Behavior observed in training might not apply to new situations the AI encounters.
      *   **Manipulation:** If the AI knows it's being observed, or can influence behavior, it might game the inference.
      *   **Complexity/Compute:** Inferring high-dimensional reward functions from noisy data is computationally intractable at the required scale.
      *   **Meta-Preferences:** Humans have preferences about their preferences (e.g., "I want to stop smoking"). IRL on behavior might capture the smoking urge, not the desire to quit.

  4.  **Structuring the Answer:**
