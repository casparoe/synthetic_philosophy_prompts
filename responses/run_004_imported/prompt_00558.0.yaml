      *   *Key distinction:* Fatalism = Outcome is fixed independent of actions. Decision Theory = Outcome depends on actions, but actions are predictable.
      *   *The "Death" character:* In the thought experiment, Death is a perfect predictor of *your decision process*. If you change your process (e.g., randomize), Death might miss. Therefore, deliberation is not pointless; it's the very thing Death is tracking.

