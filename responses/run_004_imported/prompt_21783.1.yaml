  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the tension. Dummett's reaction. State the thesis: The diary does not falsify the logic, but it *destabilizes the metaphysical authority* Frege claimed for it. It transforms him from a neutral discoverer to an ideological architect.
