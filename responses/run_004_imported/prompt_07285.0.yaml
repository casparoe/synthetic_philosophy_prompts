answer: |-
  Thank you. For those who don't know me, I'm [Name]. I'm a novelist, and I'm standing here because the organizers assumed that because I write for a living, I must know how to say goodbye. I should confess: I've written any number of deathbed scenes, but always for characters I was still free to revise. My mother, unfortunately, was not a character. And this, unlike a manuscript, is a draft we cannot rework.

  She spent her career as an unapologetic Everettian. She believed in a universe that never collapses, where every possibility is realized, and where the wavefunction evolves with perfect, unitary integrity. Because of this, I know what many of you are thinking. I know the comfort that is currently circulating in the back of the room. It is the idea that somewhere, in some branch, she pulls through. That there is a world where she is sitting in the front row right now, arguing about decoherence.

  I am not going to tell you that.

  Partly, because it is a poor description of the branch we are actually sitting in. But mostly, because correcting people out of exactly that comfort was something she did, patiently and often, in the public-facing part of her career. She did not believe in Many-Worlds because it made death easier to bear. She believed in it because she thought it was true. She valued the integrity of the description over the comfort of the narrative. To offer you a version of her theory that she would have corrected is to dishonor the rigor she brought to everything, including her own mortality.

  So, if I cannot tell you she is alive elsewhere, what can I say?

  I think the comfort she would offer is not about survival, but about permanence. In the view she held, nothing is ever truly erased. In a collapsing universe, possibilities die; they are discarded as the world narrows down to a single, fragile actuality. But in her universe, existence accumulates. The interactions she had, the arguments she won and lost, the love she gave—these are not transient probabilities that have vanished. They are written into the fabric of the state. They are indelible.

  She taught us that the past is not a discarded draft. It is fixed. It is real. And because it is real, it cannot be taken away from us. We do not have to worry that our memories of her are becoming less true as time goes on. In the geometry she spent her life mapping, the moments we shared with her have a weight that does not decay.

  I know this language does not translate perfectly to everyone here. I see my aunt sitting in the front row, who has no opinion whatsoever on the preferred-basis problem. Aunt [Name], Mom loved you not because you understood the math, but because you understood the person. And the physics, honestly, is just a way of saying that what we had with her matters enough to be permanent. It says that the universe is large enough to hold the full complexity of her life without needing to simplify it into a single ending.

  That complexity was sustained by the people around her. I want to acknowledge two people sitting right here. For as long as I can remember, my mother conducted an argument with real stakes and no malice with the Copenhagenist on her left and the Bohmian on her right, at more or less every family dinner I can remember. They disagreed on the nature of reality, but they agreed on the value of the question. They gave her the gift of a serious intellectual home. To see you both in the front row is to know that the conversation she loved so much will continue, even if her voice is no longer leading it.

  She helped run this workshop for twenty-five years. She believed that if we looked closely enough at the foundations, we would find a world that was stranger, richer, and more honest than the one we perceive. She was right.

  We are grieving because she is not here. That is the reality of this branch. But we are also gathering because she *was* here. That is the reality of the wavefunction. And in that sense, the work she loved is the best monument we could build. It is a structure that doesn't collapse when the observer looks away.

  Let us open the session. Let us do the work. And let us trust that in a universe where nothing is lost, she is exactly where she expected to be: in the questions we are about to ask.

  Thank you.
