      *   **The Conflict/Constraint:**
          *   *Avoid:* The cliché "she's alive in another branch." It's scientifically dubious (regarding *this* branch's loss) and contradicts her own public stance on comforting people with misconceptions.
          *   *Include:* A line acknowledging the 25-year argument between the Mother, Copenhagenist, and Bohmian (affectionate, high stakes, no malice).
          *   *Goal:* Find *real* comfort in MWI without lying about physics or alienating the non-physicists.
          *   *Tone:* Honest, kind, intellectual but accessible, poignant.
