      *   Connect the "no contradiction" rule to the conclusion. If the idea is clear (indivisible points), and no contradiction is found, then it's possible.

  5.  **Addressing the Empiricism Tension (The Core Philosophical Heavy Lifting):**
      *   *Is it an exception?* It looks like one. Hume is using a rationalist principle to ground his physics/geometry.
      *   *Resolution 1: Possibility vs. Actuality.* Hume isn't saying mathematical points *do* exist based on this. He's saying they *can*. Empiricism governs what *is*; this maxim governs what *could be*. This preserves the stricture that experience decides actual existence.
      *   *Resolution 2: The Nature of "Conceivability" for Hume.* For Hume, "conceiving" isn't abstract intellectual work; it's having a sensory-like idea (a faint impression). If I have an impression of a dot, I have an idea of a point. Since the impression exists, the idea is grounded. The "possibility" is just the lack of logical incompatibility in the ideas themselves.
      *   *Resolution 3: The Target.* Who is he arguing against? The "scholasticks" and infinite divisibility proponents. They claim points are *impossible* (contradictory). Hume just needs to show they aren't contradictory to defeat them. He doesn't need to prove they *are* the case, just that they *can* be.
      *   *Resolution 4: Book 1 Context.* In Book 1 (Understanding), Hume is often exploring the limits of ideas. He is critical of this maxim later (in the Appendix or elsewhere? Actually, he modifies his view on necessary connection, but the conceivability principle remains somewhat stable in the Treatise, though he becomes more skeptical in the Enquiry). *Self-Correction:* In the Treatise, he uses this maxim fairly robustly in Part 2.
      *   *Key Distinction:* Relations of Ideas vs. Matters of Fact. Possibility is often treated closer to a relation of ideas (is there a contradiction?). Existence is a matter of fact.

  6.  **Refining the "Consistent Reading":**
      *   The maxim applies to *metaphysical possibility* (logical consistency), not *physical actuality*.
