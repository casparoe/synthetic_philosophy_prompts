answer: |-
  **Naiyayika:** You propose a *catuskoti* that violates the law of excluded middle: you claim of any phenomenon that it is neither existent, nor non-existent, nor both, nor neither. This is not logic; it is evasion. Consider your own thesis: "All things lack intrinsic nature (*svabhava*)." Is this statement itself exempt from that lack? If it possesses intrinsic nature, you contradict yourself, for not all things are empty. If it lacks intrinsic nature, it is void of asserting power, like a letter written on water. You face a dilemma: either your school is inconsistent, or your speech cancels itself and asserts nothing.

  **Madhyamaka:** You assume I am positing a thesis (*pratijna*) regarding the ultimate nature of reality. I have no thesis. To say "all things are empty" is not to describe a metaphysical substrate, but to prescribe a cure for conceptual proliferation (*prapanca*). Emptiness is itself empty (*sunyata-sunyata*); it is a tool discarded once the view is corrected, like a thorn used to remove a thorn. I do not deny conventional existence (*samvrti-satya*); I deny that conventionality implies essence. Therefore, my statement functions conventionally to dismantle your attachment to essence, without claiming an essence of its own.

  **Naiyayika:** A convenient retreat into convention, but it collapses under praxis. If nothing has intrinsic nature, fire would not burn, water would not cool, and words would not refer, for reference requires a fixed relation between sound and object. You walk, you eat, you debate; you rely on the stability of causes and effects while verbally denying them. Furthermore, you rely on means of knowledge (*pramanas*)—perception and inference—to argue against me. If those *pramanas* lack intrinsic nature, how do they establish anything? If they possess it, you concede my point.

  **Madhyamaka:** I accept *pramanas* conventionally, precisely because they lack intrinsic nature. But let us examine your confidence in them. How are your *pramanas* established? If they are established by other *pramanas*, you invite an infinite regress (*anavastha*). If they are established by themselves, you argue in a circle. If they are established by the objects they know, then the objects depend on the *pramanas* to be known, and the *pramanas* depend on the objects to be validated—a mutual dependence that proves neither has independent standing. You demand grounding for my emptiness, but your own ground hangs suspended.

  **Naiyayika:** We do not accept infinite regress, nor circularity. We hold that *pramanas* are self-validating (*svatah pramanya*), like a lamp that illuminates both itself and the objects around it. The light does not require another light to be seen; it reveals itself in the very act of revealing the pot. To demand a validation for the means of validation prior to their use is to paralyze all action. We concede that *pramanas* function within a network, but we insist that their efficacy proves their validity. If they were truly empty of power, error would be indistinguishable from truth, yet here we are, distinguishing them.

  **Madhyamaka:** The lamp analogy binds you rather than saves you. A lamp depends on oil, a wick, and darkness to be defined as "illuminating." If it depended on nothing, it would shine always, everywhere, without cause. Because its lighting arises dependently, it lacks intrinsic nature. You say efficacy proves validity; I say efficacy proves dependent origination (*pratityasamutpada*), and dependent origination is precisely what I mean by emptiness. You have not refuted emptiness; you have merely described its mechanics. We agree on the dependence; you call it function, I call it lack of essence. The debate is no longer about what exists, but whether you can name dependence without implying a self.
