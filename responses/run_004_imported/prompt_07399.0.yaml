  11. **Polishing:** Enhance the atmospheric tension. The hum of the lights. The weight of the canister. The feeling of the "glitch."

  *(Self-Correction on the Math for the Story)*: I don't need to be perfectly rigorous, but I need to be directionally accurate.
  *   *Ex Ante:* Maximize expected utility over the whole tree.
  *   *At Node:* Condition on being at the node. $P(\text{Node 2} | \text{Here}) > P(\text{Node 1} | \text{Here})$ if the probability of continuing is high.
  *   The story needs to show Elias realizing that *being there* gives him information that the Planning Elias didn't have (or weighted differently).

  Let's write it.

  *Title Idea:* The Indistinguishable Corridor. *Better:* The Second Door. *Best:* *Ex Ante*. Or *The Policy*. Let's go with *The Policy*.

