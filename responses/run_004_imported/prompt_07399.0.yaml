answer: |-
  The canister was heavy in Elias's hand, cold enough to burn his palm through the glove. That was the only thing that felt real. The rest of it—the white walls, the humming lights, the door standing three meters ahead—was designed to feel like nothing.

  This was Door A. Or maybe it was Door B.

  Elias checked his pocket. The card was still there. *Protocol 44-B.* He pulled it out. The ink was his own handwriting, scrawled ten minutes ago in the briefing room, before the mnemosyne gas, before the walk down the hall.

  *DO NOT TRUST YOUR GUT. STICK TO THE RATIO.*

  The ratio was 30/70. Thirty percent chance to deposit the canister here. Seventy percent chance to walk past and hope there was another door.

  If this was Door A (the first checkpoint), depositing the canister was a catastrophe. The containment field wouldn't hold. Boom.
  If this was Door B (the second checkpoint), depositing the canister was the mission. Success.
  If he walked past Door B, he ended up in the sump. No boom, just failure. A long walk back in the dark.

  The problem was the gas. It didn't wipe his memory of who he was, or how to speak, or that he was holding a bomb. It just wiped the *count*. It made the first door look exactly like the second door. It made the moment of standing at Door A feel subjectively identical to standing at Door B.

  He had to choose a policy *ex ante*. That was what the Director had called it. Before he entered the hall, Elias had sat with a calculator.

  "If I always stop," the Director had said, "I blow up at Door A."
  "If I always go," Elias had replied, "I end up in the sump."
  "So you randomize," she said. "You pick a probability $p$. You stick to it. Both times."

  They had crunched the numbers. They found the optimal $p$. It was roughly 0.3. A weighted coin flip. He had a digital randomizer on his wrist. He was supposed to press the button. If it beeped, he dropped the canister. If it stayed silent, he walked.

  Simple. Consistent. Optimal *from the start*.

  But Elias was standing at the door now. And the math felt different from the inside.

  He looked at the white panel. He looked at the canister.

  "Okay," he whispered. His voice was absorbed by the acoustic foam. "Let's update."

  This was the itch. The thing that had kept him up the night before, scratching at the back of his brain.

  *Planning Elias* knew he would face two identical doors. *Planning Elias* knew that if he chose a low probability of stopping (say, 10%), he would almost certainly walk past Door A.

  *Current Elias* knew he was standing at a door.

  "If I'm standing here," Elias muttered, "what are the odds this is Door A?"

  If the plan was to stop often, say 90% of the time, then most agents would have stopped at Door A. They wouldn't be here. So, if an agent *is* here, it's overwhelmingly likely they are at Door B.

  But the plan wasn't 90%. The plan was 30%.

  "Still," Elias said, feeling the logic coil tight in his chest. "Even at 30%... I'm more likely to be at Door B than Door A."

  Why? Because to get to Door B, you have to survive Door A. To be at Door A, you just have to start. But the population of 'selves' at Door B is filtered by the decision at Door A.

  Wait. No. That wasn't right. There was only one Elias.

  But there were two *opportunities*.

  He pressed his thumb against the wrist comp. He hadn't rolled yet. He was hesitating. This was the violation. The Protocol demanded he roll *before* he reasoned.

  "If I follow the Plan," Elias said to the empty hall, "I accept a 30% risk of blowing up right now."

  "But if I'm at Door B," a voice in his head countered, "and I walk past... I fail. I end up in the sump. If I'm at Door B, the right move is 100% drop."

  "And if I'm at Door A," the first voice argued, "the right move is 0% drop."

  "So what is the probability I'm at Door B?"

  He closed his eyes. This was the divergence. This was the rabbit hole.

  *Planning Elias* calculated the odds based on the structure of the hallway. 50/50 chance of being at either node, weighted by the strategy.
  *Acting Elias* calculated the odds based on the fact of his existence at the node. "I am here. The fact that I am here implies I didn't stop earlier. If I didn't stop earlier, it's because the randomizer said 'Go'. If the randomizer says 'Go' most of the time, then me being here is common. But if I'm here, surely I've progressed?"

  It was survivorship bias weaponized.

  "The Plan is stable," Elias said, trying to steady his breathing. "The Plan maximizes expected utility over the whole run. The Plan knows I'm going to feel this way."

  "The Plan is a coward," the other voice snapped. "The Plan isn't holding the bomb. The Plan isn't looking at the door. The Plan is a ghost. I am the reality."

  He looked at the wrist comp. The screen was dark.

  If he rolled now, and it said 'Drop', he might blow up the facility.
  If he rolled now, and it said 'Go', he might waste the mission.

  But if he *didn't* roll... if he just decided based on how it felt...

  "I feel like I've walked far," Elias said. "My legs are tired. The air is warmer."

  "Environmental variables," he corrected himself. "Irrelevant. The gas neutralizes landmarks."

  But the *feeling* of probability had shifted. When he was in the briefing room, the chance of being at Door A was a fixed variable in an equation. Now, it felt like a hypothesis he could test.

  *Hypothesis: I am at Door B.*
  *Evidence: I am still standing.*

  If the optimal strategy was to walk past Door A most of the time (which it was, 70%), then finding yourself at a door doesn't tell you much. You expect to be at a door.

  But what if he changed the strategy?

  What if *Planning Elias* was wrong?

  *Planning Elias* assumed he couldn't update his beliefs. *Planning Elias* assumed he was blind. But *Acting Elias* knew he was blind, and that knowledge *was* information.

  "If I deviate," Elias whispered, "I break the consistency. If I break consistency, the whole calculation collapses."

  Piccione and Rubinstein. He remembered the names from a file he wasn't supposed to read. *Paradox of the Absent-Minded Driver.*

  The driver plans to exit with probability $p$.
  The driver arrives at an intersection.
  The driver thinks: "Given that I am here, and given my strategy $p$, what is the likelihood this is the second exit?"
  The driver calculates a new probability.
  The driver realizes that with this new probability, the optimal $p$ is different.
  The driver wants to change the plan.
  But if the driver changes the plan, the calculation of "Given that I am here" changes.

  It was a snake eating its own tail. A logical loop that generated heat. Elias could feel sweat prickling under his suit.

  He looked at the canister. The digital timer on the side was counting down. Not to detonation, but to degradation. He had to decide.

  *Option 1: Trust the Ghost.* Press the button. Accept the 30%. Acknowledge that the self in the briefing room knew better because he saw the whole tree, not just the branch.

  *Option 2: Trust the Body.* He was here. He had survived the first cut. The odds favored Door B. He should drop the canister. It felt safer. It felt like the move that saved the mission.

  "The Plan is for the average run," Elias said. "But this isn't an average run. This is *this* run."

  "If you change the policy," he imagined the Director saying, "you aren't optimizing for the mission. You're optimizing for your anxiety."

  "My anxiety is data."

  "No. Your anxiety is the sound of the logic grinding."

  He lifted his wrist. The screen lit up. *READY TO ROLL.*

  If he pressed it, he surrendered agency. He became a machine executing code written by a version of himself that didn't know what it felt like to stand in the hum of the lights.

  If he didn't press it... he was guessing. And guessing meant he might be the guy who blew up the lab.

  But wait.

  If he decided to *always* drop when he felt this sure... then *Planning Elias* would have known that. And *Planning Elias* would have adjusted the initial probability.

  "I can't outsmart him," Elias realized. "He's me. He knows I'll try to outsmart him."

  The hallway seemed to stretch. The door looked no different than it had ten seconds ago, but the weight of it had changed. It was no longer just a door. It was a coordinate in a probability distribution that was collapsing around him.

  He thought about the sump. Dark. Cold. Failure, but safe.
  He thought about Door A. Fire. Death.
  He thought about Door B. Home.

  "I am more likely to be at Door B," he said again. It felt true. It felt like gravity. "Because if I were at Door A, I would have had to get lucky to be here? No. If I were at Door A, I would just be here."

  The syntax was failing him.

  *Ex Ante:* Maximize $E[U]$ over the path.
  *At Node:* Maximize $E[U]$ conditional on arrival.

  The two maxima did not overlap. They were separated by a sliver of doubt, a sliver of time, a sliver of memory.

  Elias looked at the canister. He looked at the door. He looked at the wrist comp.

  The timer beeped. One minute left.

  "If I drop it," he said, "and it's Door A, I die."
  "If I walk," he said, "and it's Door B, I fail."

  The Plan said the risk of death was acceptable. The Plan said the risk of failure was the enemy.
  The Man said survival was the prerequisite for success.

  He raised his hand. He hovered over the button.

  He knew, with a terrifying clarity, that if he walked away from this door, he would face another one exactly like it. And he would have this exact same argument. And if he changed his mind the second time, he would prove that he was inconsistent, which meant the Plan was right, which meant he should have listened the first time.

  But if he listened the first time, and blew up... he'd never know he was right to doubt.

  The hum of the lights grew louder. Or maybe it was the blood in his ears.

  Elias closed his eyes. He tried to find the *Planning Elias*. He tried to feel the cool detachment of the briefing room, the smell of coffee, the safety of the spreadsheet.

  He couldn't. There was only the heat of the canister and the white door.

  "I'm sorry," he said. He wasn't sure who he was apologizing to. The Director? The Ghost? The version of himself that might be standing at Door A five minutes ago in a different timeline?

  He thumbed the wrist comp.

  He didn't press the button.

  He reached for the latch on the canister.

  *If I'm here,* he thought, *I'm probably at the end.*

  He twisted the lock. The mechanism clicked. It sounded loud, like a bone breaking.

  He waited for the fire. He waited for the hiss of the sump.

  The light above the door turned green.

  Elias let out a breath he didn't know he was holding. He pushed the canister into the slot. The door sealed.

  He turned around. The hallway stretched back the way he came. Identical white panels. Identical lights.

  He started walking back toward the briefing room. He had to file the report. He had to tell them the mission was a success.

  But as he walked, a cold knot tightened in his stomach.

  If he was at Door B... then he had passed Door A.
  If he had passed Door A... he had made a decision there.
  What decision had he made?

  He couldn't remember. The gas took the count. It took the decision. It took the *other* Elias.

  He stopped. He looked back down the hall. There was another door back there. Somewhere.

  "If I was at Door B," he whispered. "Then the Plan worked."

  But if the Plan worked, why did it feel like he had cheated?

  He looked at his wrist. The randomizer was still dark. He hadn't rolled.

  *Planning Elias* had mandated a roll. *Acting Elias* had chosen certainty.

  He had won. He had survived.

  But as he stood in the white silence, Elias realized he couldn't calculate the odds of the next mission. Because he didn't know what policy he had actually executed. He only knew the outcome.

  And in the silence of the facility, the difference between a correct strategy and a lucky mistake began to dissolve, leaving him standing in the corridor, unable to tell if he was the driver who made it home, or the driver who just got lucky at the first exit and was about to drive off the map.

  He put his hand in his pocket. He touched the card.

  *DO NOT TRUST YOUR GUT.*

  He crumpled the card. He dropped it on the floor.

  He walked on. The next door was coming. He knew it. And he knew, with a sinking dread, that when he got there, he wouldn't know if he was the planner or the actor anymore. He would just be the man at the door, holding the coin, afraid to flip it.
