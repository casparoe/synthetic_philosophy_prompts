answer: |-
  You have hit on one of the most famous and enduring tension points in the philosophy of language. First off: **you are not missing a trick, and your advisor is not necessarily being sloppy.** You have correctly grasped the force of Lewis's 1976 triviality result, but you might be slightly overstating what it concludes versus what the standard responses are.

  Here is the breakdown of the landscape, why people still assign truth conditions, and the "standard moves" used to survive Lewis.

  ### 1. Clarifying Lewis's Result
  Your understanding is 90% there, but the nuance matters. Lewis did **not** prove that indicative conditionals cannot have truth conditions.

  He proved that you cannot hold the following three claims simultaneously:
  1.  **Propositionality:** Conditionals express propositions (have truth conditions).
  2.  **The Equation (PCE):** The probability of the conditional equals the conditional probability ($P(A \to C) = P(C|A)$).
  3.  **Standard Probability Theory:** The algebra of propositions is non-trivial (there are at least four incompatible possibilities with non-zero probability).

  Lewis showed that (1) + (2) $\rightarrow$ (3) is false. The probability space collapses.

  So, to save the theory, you have to drop either **Propositionality** or **The Equation**.

  ### 2. Move A: Drop Propositionality (The Adams/Edgington Line)
  This is the view you seem to think is the only logical conclusion. Dorothy Edgington and the late Ernest Adams argue that Lewis is right: **Indicative conditionals do not have truth conditions.**

  *   **The View:** Conditionals are not propositions. They cannot be embedded in negations, disjunctions, or as antecedents of other conditionals (at least not in the same way).
  *   **The Payoff:** You get to keep The Equation ($P(\text{if } A, C) = P(C|A)$). This matches our intuitive judgments about uncertainty perfectly.
  *   **The Cost:** It makes semantics a nightmare. If "If A, C" isn't a proposition, how do we handle "If (if A, C), then D"? How do we handle "It is not the case that if A, C"? Adams/Edgington have to give complex error theories or non-truth-conditional semantics for these embeddings.

  Many semanticists (like your advisor) find this cost too high. They want a compositional semantics where 'if' combines with sentences to form new sentences that behave like standard propositions.

  ### 3. Move B: Drop The Equation (The Stalnaker/Jackson Line)
  This is the most common "truth-conditional" response. Philosophers like Robert Stalnaker and Frank Jackson argue that conditionals **do** have truth conditions, but **$P(A \to C) \neq P(C|A)$**.

  *   **The View:** The conditional expresses a proposition (usually defined via possible worlds and similarity metrics, e.g., Stalnaker 1968).
  *   **Explaining the Intuition:** If the probabilities aren't equal, why does it *feel* like they are?
      *   **Jackson (1979):** Argues that while the *truth conditions* might be material (or close to it), the *assertability conditions* are governed by conditional probability. We treat them as having high probability because we only assert them when $P(C|A)$ is high.
      *   **Stalnaker:** Argues that in most normal contexts, the probability of the Stalnaker conditional *approximates* the conditional probability, even if they aren't identical.
  *   **The Cost:** You have to tell people their intuitive grip on probability is slightly mistaken or pragmatic rather than semantic.

  ### 4. Move C: Context Dependence (The "Get Out of Jail Free" Card)
  This is likely the move your advisor is making, and it's the technical loophole in Lewis's proof.

  Lewis's proof assumes that the proposition expressed by $A \to C$ is **fixed** across different probability functions. He assumes that if you change your beliefs (your probability function), the *meaning* (the proposition) of the conditional stays the same.

  **Stalnaker (1975) and Kratzer (1986, 2012)** argue that the proposition expressed by an indicative conditional is **context-sensitive**.
  *   **The Move:** The content of "If A, C" depends on the modal base or the probability space relevant to the context of utterance.
  *   **Why it blocks Lewis:** If the proposition shifts when the probability function shifts, the algebra required for Lewis's triviality proof doesn't hold. You aren't evaluating the *same* proposition across different probability distributions; you are evaluating different propositions.
  *   **Kratzer's Restrictor View:** Angelika Kratzer takes this further. She argues 'if' isn't a binary connective ($A \to C$) at all. It is a restrictor on a covert modal operator. So there is no binary proposition to which Lewis's theorem applies in the first place.

  ### 5. Is it Sloppiness?
  It is not sloppiness; it is a **theoretical trade-off**.

  *   **If you prioritize Epistemology:** You follow Adams/Edgington. You save the link between conditionals and conditional probability, but you break standard logic and semantics (embedding problems).
  *   **If you prioritize Semantics/Logic:** You follow Stalnaker/Kratzer/Lewis (later work). You save compositionality, embedding, and truth-conditions, but you have to explain away the perfect match with conditional probability (either via context-dependence or pragmatics).

  Most formal semanticists (like your advisor) work in frameworks (like possible worlds semantics) that require propositions for compositionality to work. They accept Lewis's result as a constraint: *"We must construct truth conditions such that they don't violate triviality, usually by making them context-dependent."*

  ### Recommended Reading to Clear the Fog
  If you want to see how the "cake and eat it too" move is formalized, look at these:

  1.  **Stalnaker, R. (1975). "Indicative Conditionals."** This is the direct response to Lewis where he introduces context-dependence to block triviality.
  2.  **Kratzer, A. (1986/2012). "Conditionals."** The restrictor view. This is the modern standard in linguistics. It sidesteps Lewis by denying the conditional is a proposition-forming operator in the way Lewis assumed.
  3.  **Edgington, D. (1995). "On Conditionals."** For the strongest argument *against* truth conditions (validating your initial intuition).
  4.  **Bradley, R. (2000). "A Presumption of Truth."** Discusses whether Lewis's assumptions about the probability algebra are too strong.

  **Summary:** You aren't blanking. Lewis did break the naive link between truth conditions and conditional probability. The field didn't ignore him; they just chose to save truth conditions (for the sake of logic and embedding) and modified the semantics (via context or restrictors) to make the triviality proof inapplicable.
