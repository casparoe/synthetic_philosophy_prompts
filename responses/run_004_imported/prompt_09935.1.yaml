  **Bounded Utility:** This is the only approach that preserves standard ethical axioms like Pareto and Separability while mathematically guaranteeing finite sums, though it requires accepting that value has a hard ceiling.
  **Causal Future Restriction:** This dissolves paralysis practically by limiting evaluation to what you can influence, but it sacrifices the intuition that distant, unaffected events possess intrinsic value.
  **Limiting Densities/Averages:** While physically intuitive for a cosmologist, this violates the Pareto principle (you can prefer a world where everyone is worse off due to boundary effects) and suffers from reference class arbitrariness.
  **Hyperreal/Surreal Utility:** This provides a mathematically consistent total ordering for infinite sums but imposes heavy metaphysical baggage and violates standard dominance principles in decision theory.
  **Expectational Dominance:** Standard in finite decision theory, this fails in infinite contexts when expected differences between acts are zero or undefined, leaving paralysis intact for many cases.
  **Cardinality Comparisons:** This is mathematically useless for ethics because all countable infinities have the same cardinality, offering no way to distinguish between better or worse infinite distributions.
  **Lexical/Enumeration Orderings:** This solves comparison only by imposing an arbitrary index on people or events, violating basic neutrality and anonymity requirements for moral worth.
  **Finitely-Additive Value Theory:** This mitigates some paradoxes of countable additivity but still leaves many infinite acts incomparable, failing to fully dissolve the paralysis.
  **Person-Affecting/Local View:** This avoids aggregation problems entirely by denying impersonal value, but it abandons the utilitarian framework you are trying to save.
  **Qualitative Lexicality:** This escapes infinity issues by asserting some rights or values trump sums, but it shifts the theory from aggregative utilitarianism to deontology or prioritarianism.
