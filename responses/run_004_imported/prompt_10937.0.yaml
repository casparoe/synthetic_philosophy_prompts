          *   Define Belief Functions (DS) as specific lower envelopes of probabilities satisfying total monotonicity.
          *   Verdict: DS $\subset$ IP. But it's a "stiff" subset.
          *   Why the statistician grumbled: DS masses aren't probabilities of disjoint events; they are probabilities of *sets* containing the truth. IP lower previsions are bounds on expectations.
      *   *Part 2: The Combination Conflict:*
          *   Explain Dempster's normalization ($1-K$). Explain why it's controversial (Zadeh's example).
          *   Explain Walley's view: Combination = Independent Natural Extension. Conflict increases imprecision (gap between lower/upper), it doesn't force certainty via normalization.
          *   Practical advice: In seismic monitoring, "conflict" often means "model mismatch" or "unknown source type." DS hides this; IP exposes it.
      *   *Part 3: Which is more convincing?*
