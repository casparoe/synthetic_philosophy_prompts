answer: |-
  Here are eight interview questions designed to probe the limits of the epistemic account of moral luck, including the specific stipulations and follow-up structures you requested.

  ### 1. The "God's Eye" Driver Case (Resultant Luck)
  **Question:** "Let's press on the reckless driver case. Your view is that the driver who kills is no more blameworthy than the one who doesn't; the death just gives us better *evidence* of their recklessness. But suppose we stipulate a case where a 'God's eye view' confirms that both drivers were *antecedently identical* in every relevant mental respect—same attention, same risk assessment, same disregard for safety. There is no evidential gap left to fill. In this specific scenario, do you maintain that our *reactive attitudes*—our resentment toward the killer and our relief toward the safe driver—are simply mistakes we ought to correct?"

  *   **Likely Reply:** She will likely argue that yes, our reactive attitudes are often messy and prone to error, and that normative philosophy should correct our intuitions rather than cater to them. She will say we *ought* to blame them equally, even if we naturally don't.
  *   **Follow-up:** "If the practice of blaming is constituted by those very reactive attitudes—as P.F. Strawson argued—and you're telling us we ought to decouple those attitudes from the outcome, aren't you effectively changing the subject? At what point does 'correcting' our moral intuitions stop being an analysis of blame and start being a revision of the concept itself?"

  ### 2. The Nazi in Argentina (Circumstantial Luck)
  **Question:** "I want to move to circumstantial luck. Consider the classic case of a man who has the character of a Nazi collaborator but lives in 1930s New York rather than 1930s Berlin. He never faces the circumstance that would trigger the atrocity. On your view, is he just as blameworthy as the man who actually commits the atrocities in Berlin, simply because he possesses the same disposition?"

  *   **Likely Reply:** She will likely say yes, blameworthiness tracks the quality of the will or the disposition, not the opportunity. She will argue that moral luck shouldn't let the New Yorker off the hook just because he wasn't tested.
  *   **Follow-up:** "But if blameworthiness is about the harm one is disposed to cause, doesn't that render the actual harm morally incidental? If the New Yorker is equally blameworthy, why does justice demand we imprison the Berlin man and not the New Yorker? If you say 'pragmatics,' are you admitting that *moral* blameworthiness and *practical* accountability are two different things?"

  ### 3. The Source of Character (Constitutive Luck)
  **Question:** "This leads to constitutive luck. Your strategy saves the Control Principle by grounding blame in the agent's internal dispositions rather than external outcomes. But agents don't choose their initial dispositions; those are products of genetics and upbringing. If you explain away resultant luck by pointing to dispositions, don't you just push the luck problem back one step to the origin of those dispositions?"

  *   **Likely Reply:** She will likely retreat to a compatibilist position, arguing that as long as the dispositions are 'reasons-responsive' or integrated into the agent's identity, they count as 'controlled' enough for blame, even if not ultimately chosen.
  *   **Follow-up:** "But if that 'integration' is itself the result of prior constitutive luck, haven't you just drawn a smaller circle of control that is *still* subject to luck? If the Control Principle is meant to protect us from unfairness, why is it fair to blame someone for a character they didn't choose, even if you've successfully insulated them from the luck of the outcome?"

  ### 4. The Phenomenology of Guilt
  **Question:** "Let's look at the agent's own perspective. The driver who kills typically feels a specific kind of guilt or 'agent-regret' that the safe driver does not, even if they admit their driving was equally reckless. If your theory is correct, this guilt is irrational—a cognitive error based on false evidence. Are you prepared to tell every driver who has accidentally killed someone that their distinctive moral pain is simply a mistake?"

  *   **Likely Reply:** She will likely distinguish between 'guilt' (which tracks blameworthiness) and 'agent-regret' (which tracks outcomes). She will argue the killer should feel regret, but not *more* guilt.
  *   **Follow-up:** "Bernard Williams argued that agent-regret has a moral weight that mere regret doesn't. If the outcome changes the *moral residue* the agent must carry through life—even if you call it 'regret' rather than 'guilt'—doesn't that functional difference amount to a form of moral luck in everything but name?"

  ### 5. Obligations of Restitution
  **Question:** "Consider the normative consequences after the fact. The driver who kills owes restitution to the victim's family; the safe driver does not. This obligation seems to arise directly from the outcome, which was a matter of luck. Is this obligation to make amends separate from blameworthiness on your view, or does the difference in obligation imply a difference in moral status?"

  *   **Likely Reply:** She will likely argue that obligations of restitution are forward-looking or harm-based, whereas blameworthiness is backward-looking and will-based. She will try to sever the link between harm and blame.
  *   **Follow-up:** "But if blameworthiness is the primary trigger for the demand of accountability, and the demands placed on the two drivers are radically different, doesn't that suggest the blameworthiness itself has shifted? How can the 'debt' be different if the 'debtor's moral state' is identical?"

  ### 6. The Definition of Risk
  **Question:** "Your argument relies on the idea that the drivers took the same 'risk.' But isn't risk partially defined by its probability of realization? If I shoot a gun into a crowded room, the risk is different depending on whether the room is actually crowded or empty, even if I *believe* it's crowded. Doesn't the objective reality of the situation change the nature of the reckless act itself, not just our knowledge of it?"

  *   **Likely Reply:** She will likely argue that moral assessment is subjective, based on the agent's perspective at the time. If they *believed* the risk was the same, the moral quality of the act is the same.
  *   **Follow-up:** "If morality is entirely perspective-bound, how do we account for negligence where the agent *should* have known the room was crowded? If we appeal to an objective standard of what they should have known, aren't we admitting that facts outside their control (the actual crowd) determine the blameworthiness?"

  ### 7. The Timing of Blame
  **Question:** "On your epistemic view, when does the blameworthiness attach? Is it fully present the moment the driver swerves, or does it only become 'fixed' once the outcome occurs? If it's fully present at the swerve, why does the outcome feel like a necessary condition for our fullest moral condemnation?"

  *   **Likely Reply:** She will say it is fully present at the swerve. The outcome is merely the revelation. The feeling of necessity is a psychological quirk, not a metaphysical truth.
  *   **Follow-up:** "If the outcome is merely a revelation, then a world where the driver swerves but the pedestrian magically vanishes before impact should be morally identical. But in that world, there is no victim to vindicate. Does your theory imply that the victim's suffering is morally irrelevant to the assessment of the driver?"

  ### 8. The Boundary Condition
  **Question:** "To close, I want to test the limits of your theory. You argue that standard cases of moral luck are illusory. But for a claim to be meaningful, there must be conditions under which it could be false. What would you accept as a genuine, non-explained-away case of moral luck? Is there any possible scenario where an outcome outside an agent's control would, on your view, actually change their blameworthiness?"

  *   **Likely Reply:** She will likely say that if the Control Principle is true, there *are* no genuine cases of moral luck by definition. She might say a genuine case would require magic or direct mind-control where the agent literally had no agency.
  *   **Follow-up:** "If the answer is 'no possible case exists,' aren't you risking making the Control Principle a tautology? If the epistemic move explains away every counter-example by definition, how do we distinguish your theory from one that simply defines 'blame' as 'whatever survives the Control Principle'?"
