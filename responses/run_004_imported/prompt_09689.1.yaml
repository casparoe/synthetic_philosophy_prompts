      *   *The Technical Bit:* Explain Contradiction in Conception vs. Contradiction in the Will. The lying promise is the first; the helping example is the second.
      *   *Deep Dive on the "Will":* Why is it a contradiction in the will? Kant argues we are finite. We have needs. To will that *no one* helps is to will that *I* get no help. But as a rational being, I necessarily will my own ends. If I lack the means (because no one helps), I contradict my own will to pursue ends.
      *   *Addressing Consequentialism:* Crucial point. It's not about "unhappiness." It's about "rational agency." If I will a world where I can't get help, I am undermining my own future agency. That's irrational, not just "unfortunate."
