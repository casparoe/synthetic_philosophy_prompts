  *(Self-Correction on Self-Reference)*: The Jain answer is technically that the statement is *avaktavya* (indescribable) or that it applies to *substantial* reality, not *logical* tools. But for a gut-level explanation, the "Meta-Rule" analogy is stronger. I will use the "Rulebook vs. Play" distinction.

