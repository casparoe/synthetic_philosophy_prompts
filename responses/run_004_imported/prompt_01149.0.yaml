answer: |-
  There is a significant misunderstanding in your premise regarding John Taurek's argument, and correcting it actually helps explain *why* the debate is so intense.

  John Taurek is famous for his 1977 paper **"Should the Numbers Count?"** His answer to that question is **"No."**

  While Taurek does discuss lotteries, his core argument is not that you should weight the coin according to the numbers (which would mean the 100 people have a 99% chance and the 1 person has a 1% chance). Rather, Taurek argues that from the perspective of moral obligation, the death of one person is not "less bad" than the death of five. He suggests that the fairest procedure is often a **fair coin flip (50/50)** between the *options*, or a lottery that gives each *individual* an equal chance (which mathematically results in a weighted outcome, but for reasons unrelated to the group size).

  However, even if we accept your description of a "weighted coin" (which is actually a position held by some moderates, rather than Taurek himself), philosophers still argue fiercely over this. Here is why the "sensible compromise" of a weighted coin fails to settle the debate.

  ### 1. The Conflict of Fundamental Principles
  The debate isn't really about the mechanics of the coin flip; it is about two conflicting moral intuitions that cannot be easily reconciled.

  *   **The Aggregation View (Utilitarianism):** This side argues that morality requires minimizing overall harm. If you can save five lives or one, saving five is objectively better because five people get to live instead of one. To them, a weighted coin (or any chance of saving the one) is morally suspect because it risks a greater tragedy unnecessarily.
  *   **The Individualist View (Taurek/Deontology):** This side argues that you cannot add up people's losses. Death is a loss suffered by an individual, not a group. To the single stranger, their death is a 100% loss. To prioritize the group is to treat the single person as a mere means to the "greater good," violating their right to equal consideration.

  A weighted coin tries to split the difference, but it doesn't solve the philosophical conflict. It feels like a betrayal to both sides: it doesn't save the maximum number of lives (upsetting the Utilitarian), and it still uses the numbers to disadvantage the minority (upsetting the Taurekian).

  ### 2. The Problem of "Moral Mathematics"
  Even if we use a weighted lottery (e.g., the group of 100 has a 99% chance of being saved), philosophers ask: **What is the moral justification for the weight?**

  *   If you say the weight is justified because "more lives are better," then why not make it 100%? Why leave even a 1% chance that the 100 die?
  *   If you say the weight is justified because "we must give the one a chance," then why is their chance so small? Why is their life worth only 1% of the decision?

  The weighted coin looks like a mathematical solution to a metaphysical problem. It quantifies something (human life/value) that many philosophers argue cannot be quantified.

  ### 3. The "Separateness of Persons"
  This is Taurek's strongest point, and why philosophers still discuss him. He argues that society is not a single entity that experiences "loss." Only individuals experience loss.

  Imagine you are the single stranger. If the rescuer uses a weighted coin and you lose the flip, you die. You cannot comfort yourself by saying, "Well, it was fair because the other side had more people." From your perspective, the rescuer chose to let you die to save others. Taurek argues that unless you have a specific duty to the larger group (e.g., they are your children), you owe the single stranger the same respect as the group. A weighted coin implies the single stranger is "worth less" in the calculation, which violates the principle of **equal respect**.

  ### 4. Practical vs. Theoretical Fairness
  You mentioned the weighted coin seems like a "sensible, fair compromise." In *practice*, many people agree with you. If forced to act, most people would save the greater number, perhaps feeling bad about the one.

  However, philosophy often deals with *principles* rather than *heuristics*.
  *   If we accept that numbers count in rescue cases, do they count in all cases?
  *   Does this justify sacrificing one healthy person to harvest organs for five dying patients? (Most say no).
  *   If not, what is the relevant difference between the rescue case and the organ harvest case?

  Philosophers argue over rescue dilemmas because they are "pressure tests" for moral theories. If your theory says "save the many" in the rescue case, you have to explain why it doesn't mandate killing the one for organs in the hospital case. The weighted coin doesn't help answer that distinction.

  ### Summary
  Philosophers still argue over this because the weighted coin is a **procedural fix** for a **foundational disagreement**.
  *   **Taurek** (contrary to your understanding) argued that numbers should *not* count morally, often implying a 50/50 chance between groups to show equal respect.
  *   **Utilitarians** argue numbers *must* count to minimize suffering.
  *   **The Weighted Coin** is a middle ground that satisfies neither principle fully. It acknowledges the numbers (angering Taurekians) but refuses to maximize the outcome (angering Utilitarians).

  The debate persists because we have not agreed on whether morality is about **outcomes** (saving the most lives) or **relationships** (treating each individual with equal dignity). Until that fundamental question is answered, no coin flip will settle the argument.
