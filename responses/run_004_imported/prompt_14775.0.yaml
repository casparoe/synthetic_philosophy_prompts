answer: |-
  **MEMORANDUM**

  **TO:** Giving Circle Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Decision Procedure: Constrained Expected Value

  **1. Context and Objective**

  We are approaching a vote on how to allocate this year's $30k pool. The committee is currently deadlocked between two decision procedures: (1) maximizing expected value (EV) under our aggregate credences, and (2) allocating funds via a "moral parliament" model proportional to our credence in competing moral theories.

  This memo is not an attempt to synthesize our disagreements into a vague consensus. We have a vote next week, and we need a binding decision procedure. I am writing to recommend a specific hybrid model: **Constrained Expected Value Maximization.**

  Specifically, I propose we allocate **75% of funds to the intervention with the highest risk-adjusted expected value** (under our aggregate credences) and **25% to a diversified portfolio** reflecting our spread of moral credences.

  Below, I outline why pure versions of either current proposal fail, steel-man the strongest objection to this hybrid, and explain why this specific split is the most philosophically robust path forward.

  **2. The Current Impasse: Steel-manning the Poles**

  To decide, we must be precise about what we are rejecting.

  **The Case for Pure EV Maximization (Side A)**
  The argument here relies on the principle of **Stochastic Dominance**. If I have 90% credence in Theory T1 (which says "Fund X") and 10% in Theory T2 (which says "Fund Y"), funding Y is, by my own lights, 90% likely to be the wrong action. To deliberately fund Y is to act akratically—to do what I believe is suboptimal. Under moral uncertainty, we should treat moral theories like empirical hypotheses: we maximize expected *moral* value just as we maximize expected *utility*. To do otherwise is to leave value on the table based on a fetishization of "purity" rather than outcomes.

  **The Case for Moral Parliament (Side B)**
  The argument here relies on **Epistemic Fragility and Moral Risk**. Pure EV maximization under deep uncertainty is vulnerable to "fanaticism." If a theory assigns non-zero credence to vast populations of potentially sentient beings (e.g., invertebrates) with uncertain welfare weights, the sheer magnitude of the numbers can swamp all other considerations, even if the probability of sentience is minuscule. This allows fragile empirical premises to dictate 100% of our budget. The Parliament model acts as a hedge: it acknowledges that our intertheoretic comparisons are rough and that being 99% wrong on a high-stakes moral claim is a catastrophe we should insure against, even at the cost of some expected value.

  **3. The Strongest Objection to the Hybrid Proposal**

  I anticipate the strongest resistance to my 75/25 proposal will come from those favoring Pure EV Maximization. Your objection is not merely that we lose efficiency; it is that **the hybrid model is irrational.**

  If we agree that Theory T1 is the most likely truth, then diverting 25% of our funds to causes T1 explicitly rejects is not "hedging"; it is knowingly destroying value. In financial terms, if you know Asset A has a higher expected return than Asset B, you do not buy B just to feel diversified. You buy A. By splitting the pot, we are effectively saying, "We believe X is the best thing to do, but we will do Y anyway." This violates dominance principles and turns our giving circle into an expression of our psychological comfort rather than an instrument of moral good. If the EV calculus points to invertebrates, and we fund humans instead because the numbers look "weird," we are letting bias override our best reasoning.

  This is a serious charge. It accuses the committee of prioritizing *looking* reasonable over *being* effective.

  **4. Why the Objection Fails: Moral Risk as a Constraint**

  The objection above holds if moral uncertainty is analogous to empirical uncertainty in a closed system. But it is not. In formal ethics, we face the problem of **intertheoretic comparison**. We lack a common currency to weigh "units" of welfare across different theories (e.g., hedonic utilitarianism vs. deontology vs. person-affecting views).

  When we cannot normalize the scales, pure EV maximization becomes mathematically unstable. A theory that posits infinite value or astronomical populations can dominate the calculus regardless of its credence (the "Pascal's Mugging" problem).

  Therefore, the 25% diversification is not an admission that the "losing" theories are true. It is a **computational constraint** on our optimization function. It acknowledges that:
  1.  Our probability estimates for low-probability/high-stakes claims (like invertebrate sentience weights) are likely overconfident.
  2.  The cost of moral error is asymmetric. If we ignore human suffering to fund insects, and insects turn out to lack moral status, the loss is total. If we fund humans and insects *do* matter, we have still done *some* good (as humans are often a proxy for broader welfare), whereas the reverse is not true.

  The 75/25 split treats the EV maximization as the *engine*, but the Parliament model as the *governor*. We capture the majority of the expected value (satisfying Side A) while maintaining a hedge against the tail risk of moral fanaticism (satisfying Side B).

  **5. The Proposal: Constrained Optimization**

  I move we adopt the following procedure for this fiscal year:

  1.  **Calculate Aggregate EV:** We determine the top intervention based on our pooled credences and best-guess EV (as Side A requests).
  2.  **Apply the Cap:** No single cause area may receive more than 75% of the total fund, regardless of its calculated EV advantage.
  3.  **Allocate the Remainder:** The remaining 25% is allocated proportionally to the credence weights of the top 3 distinct moral frameworks represented in the group (e.g., Sentientist Welfarism, Human-Centric Prioritarianism, Longtermism), ensuring each bucket funds its highest priority within that bucket.

  **Why 75/25?**
  *   **>50% to EV:** Acknowledges that one theory *is* likely dominant and should drive the bulk of action.
  *   **<50% to Parliament:** Ensures we do not fragment our impact so much that we fail to move the needle on anything.
  *   **Heuristic Value:** It avoids the need for us to solve the problem of intertheoretic comparison before we can write checks.

  **6. Recommendation**

  We are a giving circle, not a research institute. Our primary output is grants, not papers on decision theory. While the Pure EV argument is theoretically elegant, it relies on precision we do not possess. While the Pure Parliament argument is safe, it is inefficient.

  I urge the committee to vote for the **Constrained Optimization (75/25)** model. It allows us to act on our best guesses without betting the entire farm on the most speculative numbers in our spreadsheet.

  Please review this procedure before our meeting on [Date]. I am happy to adjust the specific percentages (e.g., 80/20 or 70/30) if the group feels strongly, but I ask we agree on the *structure* of the constraint.

  Best,

  [Your Name]
