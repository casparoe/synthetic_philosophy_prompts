      *   **3:** Colin is right about the identifiability problem: observational data alone often cannot distinguish between competing internal states (wanting X vs. wanting Y but failing). His appeal to Boltzmann rationality is standard practice to model suboptimality, but it is only partly correct because it treats errors as probabilistic noise rather than structured cognitive biases, which doesn't fully address Marta's concern about systematic failure modes.
      *   **4:** Marta is correct that standard noise models (like Boltzmann/softmax) typically assume errors are distributed based on value differences without directional bias. Weakness of will, however, often manifests as systematic, time-inconsistent preferences (like hyperbolic discounting) rather than random noise. Therefore, a simple noise parameter cannot mathematically distinguish between a stable preference for scrolling and a systematic inability to stop.

