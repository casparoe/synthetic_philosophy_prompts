answer: |-
  Here are two options. The first leans into the David Lewis objection (the "maiming" wrinkle), and the second is designed specifically as a seminar opener to pivot into Personal Identity.

  ### Option 1: The David Lewis Objection
  *Best for: A casual pub setting or a break in the seminar. It targets the "survival isn't binary" problem.*

  "A colleague told me he's not afraid of death anymore because he believes in Quantum Immortality. I told him he needs to read David Lewis. Lewis pointed out that the wavefunction doesn't optimize for *comfort*. There are exponentially more branches where a quantum gun misfires and leaves you horribly maimed than branches where it clicks cleanly. So technically, he's right: he won't die. He'll just spend eternity in a multiversal hospice, wondering why the 'immortality' package didn't include painkillers."

  **Why it works for this audience:** It moves past the basic "you live/die" binary and hits the measure problem. It acknowledges that "survival" is a high-dimensional vector, and most of the components involve severe injury. It's dark, but philosophically precise.

  ### Option 2: The Seminar Opener
  *Best for: The first 2 minutes of your Personal Identity session. It highlights the 1st-person vs. 3rd-person split.*

  "I want to open today with Quantum Immortality, because it's the only thought experiment that drives a wedge between the first-person guarantee of survival and the third-person certainty of death. In 99% of branches, my friends are currently planning my funeral. In this one, I'm standing here teaching.

  This forces us to ask a question for Personal Identity: When they cry at my grave in those other branches, are they grieving *me*? Or are they grieving the version of me that lost the quantum coin toss? Because if identity is continuity of consciousness, I'm fine. But if identity is relational, I died last week, and I'm just the modal ghost haunting the winning branch."

  **Why it works for this audience:** It sets up the core tension of your seminar immediately. It frames the "weirdness" not as a physics problem, but as a metaphysical one regarding who counts as "you"—the subjective observer or the social entity. It invites them to debate the criteria of identity right out of the gate.
