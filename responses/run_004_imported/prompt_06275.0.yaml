          *   Must include specific questions on:
              1.  The principled vs. face-saving nature of the "natural" vs. "judicial" astrology distinction.
              2.  The causal mechanism of harmonic aspects (why specific angles imprint on the soul).
              3.  The tension between theoretical defense and the pragmatic production of calendars he doubted.
          *   Format: Question + Short Follow-up (keyed to likely answer).
          *   Tone: Intellectual, rigorous, respectful of the guest's expertise but probing (fitting a physicist-turned-HPS-host).

  2.  **Deconstruct the Guest's Thesis & Context:**
      *   *Thesis:* Kepler's astrology $\neq$ superstition; it $=$ rigorous research continuous with physics.
      *   *Key Texts:* *De Fundamentis Astrologiae Certioribus*, *Tertius Interveniens*, *Harmonices Mundi* (Book 4).
      *   *Key Concepts:* Natural astrology (light/heat/geometry affecting Earth/soul) vs. Judicial astrology (fatalistic prediction), Harmonic aspects (quintile, etc.), Patronage/Economic necessity.
      *   *Goal:* Challenge the "continuity" claim. Is it *really* continuous, or is it a retrofit? Is the physics actually doing the work, or is it metaphysics dressed as physics?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Natural vs. Judicial Astrology.*
          *   *Draft:* You say Kepler distinguished natural from judicial. Was this real or just saving face?
          *   *Refinement:* Make it sharper. Focus on the *boundary*. Is it ontological or sociological?
          *   *Follow-up:* If she says it's principled, ask about the lack of empirical success in the natural side.

      *   *Requirement 2: Causal Story of Harmonics.*
          *   *Draft:* How did angles imprint on the soul? Why the quintile?
          *   *Refinement:* Focus on the mechanism. Geometry to Psychology. How does a geometric angle become a physical impulse in the soul?
          *   *Follow-up:* If she cites "archetypes," ask if that breaks the continuity with his *physics* (which is mechanical/optical).

      *   *Requirement 3: Calendars vs. Doubt.*
          *   *Draft:* He made calendars he doubted. Isn't that hypocritical?
          *   *Refinement:* Focus on the epistemic tension. Does this pragmatic compromise undermine the claim of a "rigorous research program"?
          *   *Follow-up:* If she says it's just money, ask if that reduces the "research" to a product.

      *   *Requirement 4: Continuity with Physics.*
          *   *Idea:* Kepler's physics is often seen as the birth of modern mechanics (inertia, etc.). Astrology seems animistic. How do they fit?
          *   *Question:* Focus on the *anima motrix* vs. geometric harmonies.
          *   *Follow-up:* Does this make Kepler a transitional figure or a holdover?

      *   *Requirement 5: The Role of Light.*
          *   *Idea:* Kepler loved optics. Astrology uses light.
          *   *Question:* Is light the bridge? Or just a metaphor?
          *   *Follow-up:* If it's a physical ray, why doesn't it obey inverse square law in the astrological context?

      *   *Requirement 6: Empirical Verification.*
          *   *Idea:* Physicists care about data. Did Kepler test this?
          *   *Question:* What counted as evidence for him in *Tertius Interveniens*? Anecdote or statistics?
          *   *Follow-up:* If anecdotal, how does that fit the "rigorous" label?

      *   *Requirement 7: The Quintile specifically.*
          *   *Idea:* He added the quintile (72 degrees). Why?
          *   *Question:* Was this theory-driven or data-driven?
          *   *Follow-up:* If theory-driven (music), does that prioritize aesthetics over physical causality?

      *   *Requirement 8: Modern Reception.*
          *   *Idea:* Why do we ignore this part?
          *   *Question:* Is the "two Keplers" narrative (scientist vs. mystic) actually more useful than the "unified Kepler" narrative?
          *   *Follow-up:* Does unifying them sanitize the mysticism or scientize the magic?

      *   *Requirement 9: The Soul's Role.*
          *   *Idea:* The Earth has a soul.
          *   *Question:* Is the "Earth Soul" a physical entity or a placeholder for unknown forces?
          *   *Follow-up:* If placeholder, is it distinct from how we use "dark matter" today? (Good physicist analogy).

      *   *Requirement 10: Legacy.*
          *   *Idea:* What died with him?
          *   *Question:* Why did this research program die if it was so rigorous?
          *   *Follow-up:* Was it falsified or just culturally inconvenient?

  4.  **Review and Refine:**
