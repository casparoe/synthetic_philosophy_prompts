answer: |-
  **DRAFT MEMORANDUM OF DECISION**

  **TO:** The Appeals Panel
  **FROM:** [Your Name/Panel Member]
  **DATE:** [Current Date]
  **RE:** Appeal of [Claimant Name], A-Number [XXXXXX]
  **SUBJECT:** Draft Majority Opinion – Recommendation to Grant

  ### I. Introduction and Issue Presented

  This appeal concerns a 23-year-old national of [Country X] who seeks refugee status based on a well-founded fear of persecution should he be returned to face military justice for desertion. The Claimant was conscripted, served eight months without incident, and deserted shortly after his unit crossed the border into [Neighboring Country] during an invasion initiated by [Country X]. He faces an estimated 5–8 years of military imprisonment upon return.

  The Claimant does not claim blanket pacifism; he states he would have served had his country been defending itself. Nor does he allege he was ordered to commit specific war crimes (e.g., targeting civilians). His objection is strictly to participation in a war he characterizes as aggressive and illegal.

  The issue before this panel is whether punishment for desertion under these specific circumstances constitutes persecution on account of a protected ground (political opinion or conscience), notwithstanding our agency guidelines which generally limit protection to blanket pacifists or those ordered to commit specific atrocities.

  Panel Member A recommends denial based on strict adherence to existing guidelines and institutional competence. Panel Member B recommends grant based on the moral imperative to protect conscience regarding aggressive war.

  Having reviewed the briefs and the record, I propose we **GRANT** the petition. However, to resolve the tension between our colleagues' valid concerns, this opinion adopts a narrower legal theory than a blanket moral exemption. It establishes a testable rule based on *international condemnation* rather than *panel discretion* regarding the justness of a war.

  ### II. The Competing Views (Steelman Summary)

  Before setting out the majority reasoning, it is necessary to accurately frame the dissenting and concurring positions, as both highlight genuine risks this opinion seeks to mitigate.

  **The Argument for Denial (Panel Member A):**
  This position rests on institutional competence and consistency. The concern is that our guidelines restrict protection to blanket pacifists or those facing orders to commit atrocities for a pragmatic reason: tribunals are ill-equipped to adjudicate the *jus ad bellum* (the justice of going to war) of foreign states. If we allow deserters from "unpopular" wars to claim refuge, we risk turning every asylum hearing into a referendum on foreign policy. Furthermore, without the "all war" or "personal atrocity" bright lines, distinguishing a principled objector from an opportunist seeking to avoid the hardships of service becomes nearly impossible. This view holds that the Claimant's punishment, while severe, is a neutral application of military law, not persecution.

  **The Argument for Grant (Panel Member B):**
  This position rests on the evolving norms of international human rights law. It argues that the Nuremberg Principles established that individuals have a duty to refrain from participating in aggressive war. Punishing a soldier for refusing to facilitate an invasion is not enforcing neutral military discipline; it is punishing a moral choice protected under the umbrella of "political opinion." To deny this claim is to treat the Claimant's refusal to participate in aggression as morally equivalent to simple cowardice or desertion for convenience, ignoring the specific context of *why* he deserted.

  ### III. Panel Reasoning and Legal Standard

  We find that the Claimant qualifies for protection, but we do not adopt the broad proposition that any objection to an aggressive war qualifies. Instead, we adopt a standard that respects the guidelines' fear of "amateur just-war theory" while acknowledging the reality of international law.

  **A. The Limitation of Current Guidelines**
  We acknowledge the guidelines state objection supports a claim only if it reflects opposition to *all* war or if service requires *personal* violations of the laws of war (*jus in bello*). Read in isolation, the Claimant fails both. He is not a pacifist, and his unit was engaged in "ordinary infantry work."

  However, these guidelines were drafted primarily to address *jus in bello* violations (war crimes committed *during* fighting). They do not explicitly address complicity in the crime of *aggression* itself (*jus ad bellum*). Under international law, participating in a war of aggression is distinct from participating in a defensive war, even if no specific war crimes are committed by the individual soldier. The act of invasion itself is the violation.

  **B. The "International Condemnation" Test**
  To address Panel Member A's concern about this panel becoming "amateur just-war theorists," we hold that this Tribunal **will not make its own determination** on whether a foreign war is aggressive or just. We lack the mandate and the intelligence apparatus to do so.

  Instead, protection is available where the conflict in question has been **formally condemned as a violation of international law by a competent international body.**

  This creates a narrow, objective exception to the guidelines. It shifts the burden of determining the "justness" of the war from this Panel to the international community (e.g., UN Security Council, UN General Assembly, International Court of Justice, or relevant Regional Human Rights Court). If the international community has determined the conflict is an illegal aggression, a soldier's refusal to participate is not merely desertion; it is adherence to international norms. Punishment for such refusal is therefore disproportionate and persecutory.

  **C. Application to the Claimant**
  In this case, the invasion of [Neighboring Country] by [Country X] has been formally condemned by [Insert Relevant Body, e.g., UN General Assembly Resolution XXX / ICC Investigation Finding]. This external determination satisfies the requirement that the war is not merely "unpopular" but legally recognized as aggressive.

  The Claimant served until the point of invasion. His desertion coincided specifically with the cross-border operation, corroborating his testimony that his objection is to the aggression, not the service. The proposed punishment (5–8 years) is significantly disproportionate to standard disciplinary measures for administrative desertion, indicating it is intended to penalize the political/moral stance of refusal.

  Therefore, while the Claimant is not a blanket pacifist, his refusal to participate in a conflict formally condemned by the international community constitutes an expression of political opinion imputed to him by the state. Prosecuting him for this refusal amounts to persecution on account of that opinion.

  ### IV. The Rule for Future Cases

  To ensure this decision serves as a precedent rather than a one-off exception, the Panel adopts the following test for future appeals involving desertion from aggressive wars where no personal war crimes are alleged:

  **The Complicity in Aggression Exception:**
  A claimant may qualify for refugee status based on desertion from a conflict not involving personal war crimes if they demonstrate:
  1.  **International Consensus:** The specific conflict has been formally condemned as a violation of international peace/security by a competent international body (UN, ICC, Regional Court);
  2.  **Temporal Nexus:** The refusal to serve occurred after the initiation of the condemned hostilities (distinguishing from pre-emptive draft evasion);
  3.  **Disproportionate Penalty:** The anticipated punishment exceeds standard military discipline for desertion in that jurisdiction, indicating a punitive intent regarding the refusal itself.

  **Why this addresses our colleagues' concerns:**
  *   **To Panel Member A:** This rule prevents the panel from relitigating foreign policy. We do not decide if a war is "bad"; we check if the UN/ICC has already said so. This maintains the bright line against opportunism, as "international condemnation" is a matter of record, not testimony.
  *   **To Panel Member B:** This rule acknowledges that conscience is not limited to blanket pacifism. It recognizes that refusing to participate in internationally condemned aggression is a protected moral stance worthy of asylum protection.

  ### V. Conclusion

  We grant the petition. The Claimant faces persecution not because he is a soldier who deserted, but because he is a citizen punished for refusing to be an instrument of a policy condemned by the international community. This decision upholds the integrity of our guidelines while ensuring they do not operate in a vacuum divorced from binding international legal norms.

  ***

  **Notes for the User (Panel Member):**

  1.  **The Pivot Point:** The key to winning over the "Deny" co-panelist is Section III(B). You are explicitly agreeing with them that *you* (the panel) should not decide if a war is just. You are outsourcing that decision to the UN/ICC. If there is no UN resolution condemning the specific war in your actual case, this opinion won't work, and you may have to vote Deny or find another angle.
  2.  **The "Personal Acts" Guideline:** I have argued that *complicity in aggression* is itself a violation of international law, effectively expanding the second prong of your guidelines ("acts that are themselves serious violations") to include the act of invasion itself, provided it's internationally condemned. This is a legal interpretation, not a disregard of the rules.
  3.  **Future Proofing:** Section IV is crucial. It shows you aren't just saving this one guy; you are creating a manageable standard for the next file.
  4.  **Tone:** The draft avoids moralizing. It treats the "Grant" position as a matter of legal consistency with international norms, not just humanitarian kindness. This makes it harder for the "Deny" colleague to dismiss it as emotional.
