prompt: |-
  I sit on a three-person refugee appeals panel that reviews appeals from initial asylum denials, and whatever two of the three of us agree on is what happens. I've got a file due this Thursday where my co-panelists are split right down the middle, so for the first time I'm actually the deciding vote, and I'd rather draft the panel's written opinion myself than just show up and say yes or no.

  The claimant is a 23-year-old who was conscripted into his country's army, served eight months, and deserted a few weeks after his unit crossed into a neighboring country his government had just invaded. He's clear he isn't a blanket pacifist -- he says flat out he'd have fought without complaint if his own country had been the one attacked -- his objection is specifically to being made to fight in what he calls a war of naked aggression against people who never threatened his country, and he's not claiming anyone personally ordered him to do anything like shoot civilians; his unit was doing ordinary infantry work. If he's sent home he's facing something like 5-8 years in military prison for desertion. Our guidelines say objection to service only supports a claim if it reflects opposition to all war as such, or if the specific service would've required the applicant to personally carry out acts that are themselves serious violations of the laws of war -- read narrowly, he fails both prongs.

  One co-panelist wants to deny on exactly that basis: her view is that the whole point of those two narrow categories is that we can't have every deserter from every unpopular war relitigating, in our hearing room, whether his own government's cause was just, and that going down that road turns the panel into amatuer just-war theorists with no good way to tell a principled objector from an opportunist. The other thinks that's a dodge that lets us off the hook for the fact that this guy did everything right -- served, then refused once the character of the war became unmistakable -- and that jailing him for years for declining to help carry out an invasion is exactly the persecution-for-conscience this whole system is supposed to catch. Can you draft the opinion I'll bring to Thursday's panel -- grant, deny, or grant on some narrower theory -- laying out the reasoning clearly enough that either of them could actually push back on specific steps of it, and giving whichever position you don't adopt its strongest form rather than a caricature? And if you land on a narrower theory, spell it out precisely enough that it'd work as an actual rule for the next borderline file, not just a one-off exception for this guy.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a three-person refugee appeals panel.
      *   **Situation:** Co-panelists are split (1 Grant, 1 Deny). The user is the swing vote.
      *   **Task:** Draft the panel's written opinion (Grant, Deny, or Narrow Grant).
      *   **Case Details:**
          *   Claimant: 23-year-old male.
          *   History: Conscripted, served 8 months, deserted after unit crossed into invaded neighbor.
          *   Stance: Not a blanket pacifist. Would fight in defense. Objects specifically to *aggressive* war.
          *   Risk: 5-8 years military prison for desertion.
          *   Conduct: No personal orders to commit war crimes. Unit did "ordinary infantry work."
      *   **Legal Guidelines:** Objection to service supports a claim *only if*:
          1.  Opposition to *all* war (Pacifism).
          2.  Service would require personally carrying out serious violations of laws of war (War Crimes).
          *   *Current reading:* Claimant fails both.
      *   **Co-panelist Positions:**
          *   *Deny:* Guidelines are narrow for a reason. Avoid relitigating justness of wars. Avoid becoming amateur just-war theorists. Distinguish principle from opportunism.
          *   *Grant:* He served until the war's nature was clear. Jail for refusing aggression is persecution for conscience. System should catch this.
      *   **Requirements for the Draft:**
          *   Clear reasoning (allow pushback on specific steps).
          *   Steelman the opposing view (don't caricature).
          *   If Narrow Grant: Define a precise rule for future cases (not just a one-off).

  2.  **Evaluate the Legal & Ethical Landscape:**
      *   *The Hard Line (Deny):* Strict adherence to the guidelines. International refugee law (1951 Convention) generally doesn't protect draft dodgers unless prosecution is discriminatory or involves war crimes. The *Sepet and Bulbul* (UK) or *Krotov* (US) type jurisprudence usually requires condemnation by the international community or personal involvement in atrocities. The concern about "administrative feasibility" is real.
      *   *The Moral Line (Grant):* Punishment for refusing an aggressive war is increasingly seen as illegitimate under international norms (UN Human Rights Committee views on *Yoon and Choi*, though that's conscientious objection). The Nuremberg principles suggest individuals have a duty to refrain from aggressive war.
      *   *The Middle Path (Narrow Grant):* Is there a way to bridge the gap? The guidelines say "opposition to all war" OR "personal commission of violations." Is there a third category emerging in international law?
      *   *Key Precedent/Concept:* The UNHCR Guidelines on International Protection No. 10 (2013) regarding military service. It acknowledges that refusal to serve in a conflict condemned by the international community *may* qualify. Also, the distinction between *political opinion* and *conscience*.
      *   *The "Aggressive War" Exception:* Some jurisdictions recognize that serving in a war condemned by the international community (UN Resolution, ICC finding) creates a presumption that *any* participation lends support to a regime violating fundamental norms, even without personal war crimes.

  3.  **Determine the Stance for the Draft:**
      *   *Option A (Deny):* Safest legally, but ignores the moral weight of the "aggression" argument. Might feel like abdicating responsibility.
      *   *Option B (Broad Grant):* Risks opening the floodgates. Hard to square with existing guidelines without rewriting them.
      *   *Option C (Narrow Grant - The "International Condemnation" Test):* This is the most legally robust middle ground. It respects the guidelines' fear of "amateur just-war theory" by outsourcing the "justness" determination to the international community (UN, ICC, etc.), while acknowledging the co-panelist's point that refusing *aggression* is distinct from simple desertion.
      *   *Decision:* I will draft a **Narrow Grant**. This allows the user to lead the panel, offers a compromise that respects the guidelines but evolves them slightly based on international norms, and provides a testable rule for the future.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard formal legal header.
      *   **Introduction:** State the issue (desertion, punishment, refugee status).
      *   **Facts:** Summarize the claimant's service and objection.
      *   **The Legal Framework:** Cite the existing guidelines (Pacifism vs. War Crimes). Acknowledge the tension.
      *   **The Dissenting View (Steelman):** Articulate the "Deny" argument strongly. Administrative burden, subjectivity, risk of opportunism.
      *   **The Concurring View (Steelman):** Articulate the "Grant" argument strongly. Moral agency, Nuremberg principles, disproportionate punishment for conscience.
      *   **The Panel's Reasoning (The Swing Vote):**
          *   Acknowledge the guidelines are restrictive.
          *   Introduce the "International Condemnation" exception.
          *   Rationale: If the international community has formally condemned the conflict as aggressive/illegal, the tribunal doesn't need to be the "just-war theorist." The determination is already made.
          *   Apply to case: Was the invasion condemned? (Need to assume facts here or make it conditional. Let's assume for the sake of the draft that there *is* significant international condemnation, otherwise the legal theory fails. I will frame it as "Where the conflict is subject to formal international condemnation...")
          *   Distinguish from simple desertion: This isn't about avoiding hardship; it's about complicity in a violation of *jus ad bellum* (law governing resort to force), not just *jus in bello* (conduct in war).
      *   **The Rule/Test:** Define the criteria clearly for future cases.
          1.  Conflict formally condemned by UN/Regional Body/ICC.
          2.  Claimant refused service *after* crossing border/on specific orders related to the aggression.
          3.  Punishment is disproportionate/persecutory.
      *   **Conclusion:** Grant status.

  5.  **Refining the Tone:**
      *   Must sound judicial, balanced, and precise.
      *   Avoid emotional language, focus on legal principles.
      *   Ensure the "Deny" argument isn't dismissed as heartless, but as concerned with institutional competence.
      *   Ensure the "Grant" argument isn't dismissed as naive, but as morally urgent.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I make the rule too vague?
      *   *Fix:* Specify *who* must condemn the war (UN Security Council, General Assembly, Regional Court). This prevents the panel from deciding on their own.
      *   *Critique:* Did I address the "personal acts" guideline?
      *   *Fix:* Argue that in a war of aggression, *any* logistical support furthers the illegal act, distinguishing it from a defensive war where service is neutral.
      *   *Critique:* Is the "Deny" argument strong enough?
      *   *Fix:* Emphasize the "floodgates" and the difficulty of verifying sincerity if the bar is lowered.

  7.  **Final Polish:** Check against the prompt's requirements (Thursday deadline, specific co-panelist views, clear rule for future files). *Self-correction: Ensure I explicitly state that this is a draft for the user to bring to the panel, not the final signed document, though written as if it could be the majority opinion.*

