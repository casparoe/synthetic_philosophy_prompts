  So in my philosophy of probability seminar we just wrapped up the anthropic reasoning unit and I have to write a short paper comparing the self-sampling assumption and the self-indication assumption, but the lecture notes were pretty thin on the actual mechanics. I get the basic setup - SSA has you reason as a random draw from the observers in your reference class, which is what generates the doomsday argument, and SIA bolts on an extra weighting so that hypotheses predicting more observers get boosted just becuase you exist, which is supposed to cancel the doomsday shift back out. What I don't really get is why that specific weighting move is what fixes doomsday, and how that same move is exactly what gets SIA into trouble with the presumptuous philosopher case. Also, does SSA actually dodge a presumptuous-philosopher type problem of its own, or is the doomsday argument basically that same problem wearing a different hat? If you had to defend one of the two as more philosophically sound overall, which would it be and why - dont just give me the wikipedia version, i need the real mechanics for this paper.
