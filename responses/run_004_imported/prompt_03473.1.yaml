      *   *Critique:* This is a defensible position (internalism vs. externalism), but it might be *too* simplistic for a good paper. It risks ignoring the intellectual context of the 19th century. A nuanced approach would be better: "While the *validity* of the ethical arguments doesn't depend on psychic phenomena, the *motivation* and *epistemological framework* are deeply connected."
      *   *Risk:* If the user argues they are totally separate, the professor (who brought it up) might think the student missed the point of the hint.

