answer: |-
  You have put your finger on a genuine ethical paradox, and you are right to feel that "social pressure" is too blunt an instrument to describe it. What you are observing is the friction between two specific philosophical concepts: **Supererogation** and **Special Obligations.**

  Since you're on a deadline, here is the breakdown of the framework, the specific mechanism that causes the "curdle" you described, and a way to articulate it in your piece without sounding like a philosophy textbook.

  ### 1. The Terminology (For Your Notes)
  *   **Supererogation:** This is the technical term for acts that are "good to do, but not wrong to omit." These are heroics, saintliness, and "above and beyond" actions. The stranger donor fits here. Society labels this *supererogatory* to protect the rest of us from feeling guilty. If donating a kidney to a stranger is a *duty*, then everyone who doesn't is morally failing. To avoid that uncomfortable conclusion, we call it "heroic."
  *   **Special Obligations (or Duties of Partiality):** This is the ethical principle that we owe more to people with whom we have specific relationships (children, parents, siblings) than we do to strangers. This is why the sister is under a different microscope. We generally accept that you don't *have* to save a drowning stranger, but you *do* have to save your own child.

  ### 2. The Mechanism: Why the "Gap" Exists
  You asked why an act shifts from "optional" to "expected" once it looks cheap enough or someone else has done it. This is where you can introduce the concept of **Moral Demandingness** and the **Peter Singer "Shallow Pond" analogy.**

  Philosopher Peter Singer famously argued that if you walk past a shallow pond and see a child drowning, you are morally obligated to wade in and save them, even if it ruins your shoes. The cost (shoes) is negligible compared to the benefit (life).

  *   **The Stranger:** She is acting on a utilitarian calculus (Singer's math). She sees the "shoes" (a few weeks of recovery) as negligible compared to the "life." By doing so, she empirically proves the cost is low.
  *   **The Sister:** She is being judged by a hybrid standard. Because the stranger proved the physical/financial cost is low (the "shoes" are cheap), the sister's refusal looks less like a preservation of self and more like a violation of **Special Obligations.**

  **The "Curdle":**
  The tension you're sensing is the **Collapse of Supererogation.**
  When a "hero" proves that a sacrifice is actually low-cost, it stops looking like a heroic sacrifice and starts looking like a minimal requirement. The stranger's action normalizes the cost. Once the cost is normalized, the "Special Obligation" of the sister kicks in harder. The family isn't just thinking, "She isn't being a saint"; they are thinking, "She isn't even being a decent sister, given how *easy* we now know this is."

  ### 3. How to Frame It in the Piece
  You don't need to use the jargon, but you can use the logic. Here are three angles to sharpen that section of your story:

  **A. The "Baseline Shift"**
  Describe the stranger's donation as shifting the moral baseline. Before the chain existed, donating a kidney was a high-risk, high-sacrifice mystery. It was easily categorized as "heroic." The stranger demystified the risk. She turned a "sacrifice" into a "transaction."
  *   *Drafting thought:* "The stranger didn't just save a life; she lowered the price of admission. By proving the cost was manageable, she inadvertently raised the floor for everyone else, specifically those with blood ties."

  **B. The "Math" vs. The "Bond"**
  Highlight the donor's annoyance at being called a "hero." To her, it's arithmetic (Small Pain < Death). To the family, the sister's refusal isn't about arithmetic; it's about the **economy of relationships.**
  *   *Drafting thought:* "For the stranger, the math was cold and clear. For the sister, the math is contaminated by autonomy. But for the family, the equation is simple: If a stranger would pay this price, why won't you?"

  **C. The "Ought Implies Can"**
  There is a philosophical principle that "ought implies can" (you can't be obligated to do something impossible). The stranger's action proves the sister *can*. Therefore, the family feels she *ought*.
  *   *Drafting thought:* "The unspoken disappointment isn't just about the kidney. It's about the proof of concept. The stranger made the impossible look routine. And in doing so, she turned the sister's 'no' from a tragic limitation into a conscious choice."

  ### 4. The Sharpest Hook
  If you want one phrase to anchor this, consider **"The Burden of Proof."**

  Historically, the burden of proof was on the *need* for the kidney. Now, because of donors like the woman you interviewed, the burden of proof has shifted to the *refusal* of the kidney.

  The stranger absorbed the "hero" label so others wouldn't have to, but in doing so, she made the "non-heroic" choice look much worse for family members. The stranger is treated as a saint to protect *us* (the general public) from guilt. The sister is treated as a disappointment to protect *the family* from the reality that biology doesn't guarantee loyalty.

  ### Summary for your Editor/Notes:
  *   **Concept:** The tension between **Supererogation** (optional good deeds) and **Special Obligations** (duties to kin).
  *   **The Shift:** When a supererogatory act is proven to be low-cost (by the stranger), it exerts pressure on special obligations to become mandatory.
  *   **The Phrase:** "The normalization of sacrifice."

  This isn't just guilt; it's a recalibration of moral debt. The stranger paid a debt no one asked her to pay, which makes the people who *were* asked to pay it (the family) look insolvent.
