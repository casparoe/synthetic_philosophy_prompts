      *   *The Trap:* If you stay, Death predicted stay $\rightarrow$ Death is in Damascus $\rightarrow$ You die. If you go, Death predicted go $\rightarrow$ Death is in Aleppo $\rightarrow$ You die.
      *   *CDT Failure:* CDT says: "Given I stay, what's the causal impact?" But the probability of Death being there is correlated with my choice *because* Death predicted my choice. CDT treats the prediction as fixed evidence but the action as free. This leads to instability. If I think I'll stay, I should go. If I think I'll go, I should stay. No equilibrium.
      *   *Ratifiability:* An action is ratifiable if, conditional on deciding to do it, it maximizes expected utility. In Death in Damascus, neither action is ratifiable.

  3.  **Address the "Abstract vs. Real-World" Tension:**
