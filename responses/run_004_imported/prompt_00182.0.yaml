      *   **Implication 5: The "Tickle" Defense.** (A technical point worth mentioning briefly). CDT proponents argue you have introspective access to your decision process (the "tickle") which screens off the prediction. But this is controversial.
      *   **Implication 6: Logical Uncertainty.** The core issue is that the agent's decision algorithm and the predictor's model are logically linked. Decision theories need to handle logical counterfactuals, not just causal ones.

