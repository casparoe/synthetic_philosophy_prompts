      *   **Goal:** Provide a nuanced philosophical overview suitable for Ethics Bowl preparation (i.e., structured, argumentative, citing relevant concepts/philosophers where helpful, but accessible).

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Standing to Blame:* The normative authority to hold someone accountable. It's distinct from the truth of the claim.
      *   *Hypocrisy:* Often defined as condemning others for faults one possesses oneself.
      *   *Tu Quoque:* A logical fallacy (appeal to hypocrisy) that dismisses an argument because the arguer is inconsistent. The prompt explicitly wants to distinguish the "non-hypocrisy condition" from mere *tu quoque*.
      *   *Key Philosophers:* Bell (2013), Fritz & Miller (2018), Todd (2017), Isserow & Klein (2017). (I need to synthesize these views without necessarily name-dropping excessively, but ensuring the arguments are represented).

  3.  **Address Question 1: Content vs. Voice (The Normative Force):**
      *   *The Core Distinction:* If A blames B for X, and A also does X. Is the claim "X is wrong" false? No. Is A allowed to *sanction* or *morally judge* B? That's the issue.
      *   *Implication:* The accusation's *truth* remains intact. Cheating is still cheating. But the hypocrite loses the *authority* to administer the blame.
      *   *Analogy:* A corrupt judge can still correctly identify a law was broken, but shouldn't sentence the defendant.
      *   *Ethics Bowl Application:* Onlookers shouldn't say "You're wrong about the cheating." They should say "You aren't the right person to be policing this."

  4.  **Address Question 2: Genuine Hypocrisy vs. Comparable Wrongdoing:**
      *   *Strict Hypocrisy:* Doing the *exact* same thing. (Cheating calls out cheating).
      *   *Comparable Wrongdoing:* Doing something *equally bad* but different. (Cheating calls out rumor spreading).
      *   *Philosophical Debate:*
          *   *Narrow View:* Standing is lost only if the faults are relevantly similar (Bell).
          *   *Broad View:* Standing is lost if the accuser shows a lack of commitment to the moral value at stake (Fritz & Miller's "Commitment Account"). If I cheat, I show I don't care about academic integrity. If I then blame you for cheating, I'm posing as a guardian of a value I reject.
          *   *Nuance:* Does cheating remove standing to blame for *rumors*? Maybe not directly, but it undermines general moral credibility.
      *   *Ethics Bowl Application:* In the school scenario, if the accuser cheats and blames for cheating, standing is definitely lost. If they cheat and blame for rumors, it's weaker but still damages credibility regarding "rule-following" or "honesty."

  5.  **Address Question 3: Reclaiming Standing:**
      *   *Is it permanent?* Most philosophers say no. Standing is dynamic.
      *   *How to regain?*
