answer: |-
  The binder sat on Elara's desk, a thick block of paper held together by three rusting rings. Inside were the fragments. Vera's handwriting was a jagged script, ink faded to the color of dried blood, scrawled on napkins, the backs of envelopes, and once, on the margin of a electricity bill from 1984. Between the fragments were Elara's typed interpolations, bridging the gaps where the paper had rotted or Vera's memory had failed.

  The email from the Prize Committee had arrived on Tuesday. *Shortlisted for the Translation Award.* But there was a footnote. *Attribution pending review.*

  On Thursday, Elara sat in a conference room that smelled of dry-erase markers and stale coffee. Across from her sat Dr. Aris Thorne, a committee member with a face like a folded map. He had a copy of the binder open before him.

  "We want to award this," Thorne said. "But the guidelines specify 'posthumous work by the author.' Not 'reconstruction by the granddaughter.'"

  "It is her work," Elara said. She felt the certainty of it in her chest, a solid, warm weight. This was the first position. The poem existed, and it belonged to Vera. Elara had merely brushed away the dust. "The imagery, the rhythm. I didn't invent the metaphors. I found them."

  "You found fragments," Thorne said. He tapped a page where Vera's script stopped mid-sentence. "Here. 'The winter light bends like...' And then there are three lines of your typeset text to complete the simile. '…a spoon in a drawer.' Did Vera write that?"

  "I completed the thought based on her previous usage of domestic imagery."

  "Based on your interpretation," Thorne corrected. "If I write the missing legs of a chair found in a ruin, is it the original chair? Or is it a new chair built around old wood?"

  Elara left the meeting with the second position settling over her like a cold coat. It was not Vera's. It was Elara's ventriloquism. She went home and looked at the manuscript again. She saw her own syntax in the connective tissue. She saw where she had smoothed Vera's rougher metrics to make them palatable to an English ear. The voice on the page was a hybrid, a ghost speaking through a living throat. If authorship required intent, Vera's intent had stopped thirty years ago. Everything after was Elara's will.

  She called Thorne the next day. "What if we list it as a collaboration?"

  This was the third position. It is both. A palimpsest.

  "Vera is dead," Thorne said gently. "Legally, she can't collaborate."

  "Conceptually," Elara insisted. "The text exists between us. It requires her fragments and my reconstruction. Without me, it's noise. Without her, it's silence. It belongs to both of us, simultaneously."

  "We could list 'Vera / Translated and Completed by Elara,'" Thorne offered. "But the award is for the poem, not the translation. If the poem is a composite entity, does it qualify as a singular work of art? Or is it a critique of authorship?"

  Elara hung up. She sat on the floor of her study, the binder open on her knees. She tried to hold the third position, the compromise. *Both.* But it felt like a legal fiction. It suggested there were two distinct entities—Vera and Elara—meeting in the middle of the page. She looked at the line: *The winter light bends like a spoon in a drawer.*

  Who wrote that? Vera provided the breakage; Elara provided the repair. But the light didn't care. The spoon didn't care.

  She realized then that she was looking for a substance that wasn't there. She was looking for the "Vera-ness" of the poem as if it were a gold stamp hidden in the paper fibers. But if she removed Vera's handwriting, the words remained. If she removed Elara's typing, the fragments remained. If she removed the meaning, the ink remained.

  This was the fourth position. It is neither.

  The poem was not Vera's, because Vera was gone, and a ghost cannot own property. The poem was not not-Vera's, because without her initial marks, this specific sequence of words would never have occurred. But to say it was *both* implied a boundary where there was none. The words did not carry ownership tags. They were conventional signs agreed upon by readers. The "author" was not a container inside the text; it was a label stuck on the outside for the sake of the library catalog.

  To search for the true owner was to search for the center of a circle drawn in water. The disturbance existed, the ripples were real, but there was no solid point to anchor the claim. The dispute relied on the idea that the poem had an inherent self, a *svabhāva*, that could be traced back to a single source. It didn't. It was dependent on the paper, the ink, Elara's memory, Thorne's committee, the English language, the light in the room. Remove any of those conditions, and the "poem" vanished.

  There was no fact of the matter to be found. There was only the function.

  The ceremony was held in a hotel ballroom with carpet the color of dried mustard. Elara wore a black dress. She sat at a table with the other finalists, a novelist who kept checking his phone and a historian who was asleep.

  Thorne approached the podium. He adjusted the microphone. The room quieted.

  "And the winner," Thorne said, "for the sequence *Winter Light*, is Vera."

  He did not say "Vera and Elara." He did not say "Reconstructed by Elara." He said the name.

  Elara stood. She walked to the stage. The applause was polite, rhythmic. She took the envelope. She stood at the microphone. She could have corrected him. She could have launched into the complexity of the text, the four corners of the argument, the impossibility of the claim. She could have said, *This is not hers, and it is not mine, and it is both, and it is neither.*

  But that would have been another claim. Another attempt to pin the butterfly to the board.

  "The winter light bends like a spoon in a drawer," Elara said into the microphone.

  It was the first line of the final poem. The audience listened. They nodded. They understood the image. The light bent; the spoon was cold metal in wood. The meaning arose in the space between her voice and their ears. It functioned.

  Later, at the gravesite, the stonecutter called to confirm the inscription. Vera's actual grave had been unmarked for decades, a patch of sunk earth in the corner of the plot. Elara had decided to fix it.

  "You want the dates?" the stonecutter asked.

  "Yes."

  "And the attribution? Just the name?"

  "Yes."

  "Okay. So, 'Vera. 1920–1994. Poet.'"

  Elara looked at the phone. She looked out the window at the garden where Vera used to smoke, where the ash had long since washed into the soil. The stone would be cut. The name would be chiseled into granite. It would weather. It would eventually become unreadable.

  "Just the name," Elara said.

  It was a lie, technically. It was the truth, practically. It was a designation that allowed the living to mourn and the dead to be remembered. It required no inherent existence to work. It only required agreement.

  "Thank you," Elara said, and hung up.

  She went back to her desk. The binder was still there. She opened it to the last page. The typed lines sat next to the handwritten fragments. She ran her finger over the paper. She didn't try to feel who was there. She just turned the page, and began to write something new.
