      *   **Goal:** Write a short story (1,200–1,800 words) based on a specific philosophical structure.
      *   **Philosophical Core:** Nāgārjuna's *catuṣkoṭi* (tetralemma):
          1.  It is (A).
          2.  It is not (not-A).
          3.  It is both (A and not-A).
          4.  It is neither (neither A nor not-A).
      *   **Application:** The status of a poem (is it the grandmother's?).
      *   **Constraint 1 (Crucial):** Do *not* state the philosophy. No naming Nāgārjuna, Buddhism, emptiness, tetralemma, etc. No exposition explaining the logic. The logic must be enacted through plot and reasoning.
      *   **Constraint 2 (Crucial):** Do *not* resolve into a comfortable synthesis ("it's complicated"). The ending must show all four corners are unworkable for finding intrinsic existence (*svabhāva*), yet conventional designation functions anyway (prize ceremony, gravestone).
      *   **Constraint 3 (Tone/Style):** Literary magazine style. No exoticism (no incense, monks, "Eastern wisdom"). Domestic/ordinary setting.
      *   **Situation:** Protagonist reconstructed grandmother Vera's unfinished poems (fragments, damaged pages). Shortlisted as "Vera's last poems." Dispute over attribution (rival translator, family, committee).
      *   **Word Count:** 1,200–1,800 words.

  2.  **Deconstruct the *Catuṣkoṭi* in this Context:**
      *   *Proposition:* The poem is Vera's.
      *   *Corner 1 (Is):* Evidence suggests it is hers. Her handwriting, her themes, the protagonist was merely a conduit.
      *   *Corner 2 (Is Not):* Evidence suggests it is not hers. The protagonist wrote the connecting lines, made choices Vera didn't make. It's a forgery/pastiche.
      *   *Corner 3 (Both):* It is a collaboration across time. Some parts hers, some not. A hybrid entity.
      *   *Corner 4 (Neither):* The concept of "ownership" or "authorship" itself collapses when applied to the text. The poem exists independently of the claim. Or, the conditions for "being Vera's" are never met because "Vera" and "Poem" lack inherent existence.
      *   *Resolution:* Conventional truth (*samvrti-satya*). The prize happens, the name goes on the stone, not because the metaphysical claim is true, but because the convention works.

