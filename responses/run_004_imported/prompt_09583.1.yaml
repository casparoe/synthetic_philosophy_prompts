      *   **Worrall/Structural Realism:** $E = mc^2$, Fresnel's equations surviving in Maxwell. The *structure* remains, the *nature* changes.
      *   **Psillos:** "Working posits" vs. "idle wheels." Distinguishing what did the work.
      *   **Stanford:** "Unconceived Alternatives." We can't know what we haven't thought of yet. The problem isn't just false theories, it's *possible* theories we missed.
      *   **Pessimistic Meta-Induction:** Past successful theories were false; current successful theories will be false.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A quiet bar after a session. Establish the mood (tired but energized). Bring up the user's specific anxiety (Fresnel/Ether).
      *   **Round 1: The Ether Case.**
