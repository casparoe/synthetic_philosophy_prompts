      *   **Task:** Write a dialogue between a Scientific Realist and an Anti-Realist.
      *   **Constraints:**
          *   No strawmen (Realist can't just say "science works").
          *   Realist must use sophisticated defenses (Worrall's Structural Realism, Psillos's "working posits").
