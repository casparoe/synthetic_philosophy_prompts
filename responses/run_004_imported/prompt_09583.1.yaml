answer: |-
  **Setting:** *The lounge of a hotel near the university. It's late, the conference session on "Metaphysics in Physics" ended an hour ago. Two colleagues, ELENA and MARCUS, sit in worn armchairs with half-finished drinks. They have known each other since grad school.*

  **Marcus:** You were quiet during the Q&A. Usually, you're the first one to jump on a speaker who treats models like reality.

  **Elena:** I was tired. And honestly, I found myself sympathetic to the presenter. Not his naivety, but his instinct. We spend our lives building instruments based on the assumption that there's something *there* to measure. If I tell my lab students that the electromagnetic field is just a useful instrument for prediction and not a description of reality, they'll drop the class.

  **Marcus:** They should. Or at least, they should understand the distinction. But I suspect you're thinking about our friend from the library group. The retired opticist.

  **Elena:** I am. He's shaken. Laudan's list got to him. Specifically the ether. He spent forty years using Fresnel's equations. Now he's worried he was essentially doing caloric theory with better math.

  **Marcus:** It is the canonical case for a reason. Fresnel's theory was empirically magnificent. It predicted the bright spot in the shadow of a disk—the Arago spot. It handled reflection and refraction. And the ontology? A mechanical ether with negative elastic constants, a jelly that planets swam through without resistance but which vibrated at terahertz frequencies. It was nonsense. And yet it worked. If the best theory of the 19th century is ontologically bankrupt, why trust Maxwell? Why trust QED?

  **Elena:** Because we aren't stuck in 1890. This is exactly where Worrall's structural realism pays its rent. Look at the Fresnel case closely. The *ontology* of the ether was discarded, yes. But the *mathematical structure* of the theory wasn't. Fresnel's equations for reflection and refraction didn't get thrown out with the luminiferous jelly. They were absorbed into Maxwell's electrodynamics.

  **Marcus:** Absorbed and reinterpreted.

  **Elena:** Precisely. The structure survived the revolution. Worrall's point is that while we might be wrong about the *nature* of the entities (jelly vs. field), we are capturing the real structural relations of the world. The equations track the way the world behaves, even if our picture of what's "waving" changes. So, your opticist friend wasn't wrong about the structure of light-matter interaction. He was right about the relations. That's enough for a robust realism.

  **Marcus:** Is it? That feels like a retreat. You're saving realism by lowering the stakes. You're saying, "We don't know what the world *is*, only how it *acts*." But science claims to tell us what constitutes the world. Electrons aren't just nodes in a structure; they have mass, charge, spin.

  **Elena:** And we measure those.

  **Marcus:** With instruments built assuming electrons have mass, charge, and spin. You're begging the question. But let's stick with Fresnel, since that's where the anxiety lies. You say the structure survived. But how did Fresnel know which part of his theory was the "structure" and which was the "idle wheel"? He didn't. To him, the mechanical properties of the ether *were* the explanation. The transverse vibration required a medium with specific rigidity. That wasn't decorative; it was the engine of the theory.

  **Elena:** That's where Psillos comes in. We can distinguish "working posits" from "idle wheels" in hindsight. The posit that light is a transverse wave was a working posit. It did the predictive labor. The posit that the medium is a mechanical solid with negative elasticity was idle—it was scaffolding needed to make the mechanics work, but it wasn't essential to the empirical success. We can look back and surgically separate the two.

  **Marcus:** "In hindsight." That's the operative phrase, Elena. You have the benefit of knowing Maxwell won. If you were a physicist in 1850, could you have reliably distinguished the working posit from the idle wheel? Could you have said, "This bit about the rigidity of the ether will vanish, but the equations will stay"?

  **Elena:** Maybe not then. But we can do it now. And we can apply it to our current theories.

  **Marcus:** No, you can't. Because you're still inside the theory. This is Stanford's argument, the New Induction. It's not just that past theories were false. It's that the scientists of the past were unable to conceive of the alternatives that would eventually replace them. Fresnel couldn't conceive of a field without a medium. That space of possibilities wasn't open to him.

  **Elena:** Because the math wasn't there yet.

  **Marcus:** Because our imagination is constrained by our current conceptual framework. Stanford asks: What unconceived alternatives are available to us right now? If we can't list them, how can you claim that our current "working posits" aren't just the "idle wheels" of a future theory? You say the electromagnetic field is a working posit. I say it might be the caloric fluid of 2150. A useful approximation that masks a deeper mechanism we literally cannot conceive of yet.

  **Elena:** That leads to paralysis. If we assume every unobservable is potentially an unconceived alternative, we stop doing physics. We become instrumentalists. We treat the Large Hadron Collider as a very expensive oracle that spits out numbers, without caring if the Higgs boson actually exists.

  **Marcus:** I'm not saying stop doing physics. I'm saying stop claiming you've found the furniture of the universe. You can use the collider to predict particle decay rates without committing to the literal existence of the Higgs field as a fundamental ontological category. It might be a effective field theory, valid up to a certain energy scale, beyond which the whole concept dissolves.

  **Elena:** But there's convergence, Marcus. That's the thing your pessimistic induction ignores. Theories aren't just replaced; they're often limited. Newtonian gravity isn't "false" in the way phlogiston is false. It's a limiting case of General Relativity. When $v \ll c$, Newton works. That suggests we are getting closer to the truth, approximating the structure of reality.

  **Marcus:** Is the ether a limiting case of Maxwell's equations?

  **Elena:** ...No. That's a discontinuity.

  **Marcus:** Exactly. There are revolutions where the ontology doesn't converge; it vanishes. The crystalline spheres didn't become orbits; they ceased to exist. Phlogiston didn't become oxygen; it was a category error. If history shows us a mix of convergence *and* radical discontinuity, why bet on convergence now? Why think the Standard Model is a Newtonian limit of something deeper, rather than a phlogiston-style dead end?

  **Elena:** Because of the no-miracles argument. Putnam's classic. It would be a miracle if our theories were so empirically successful across different domains if they didn't latch onto something real. If the EM field isn't real, why can I use it to design a laser that cuts steel? The causal leverage we have suggests ontological grip.

  **Marcus:** I love the no-miracles argument. It's the realist's last stand. But Laudan already dismantled it. Successful but false theories are not miracles; they are the norm. The caloric theory explained heat transfer beautifully. It allowed engineers to build engines. It had causal leverage. Heat *does* flow like a fluid in many contexts. That didn't make caloric real. It made the model robust. Your laser cuts steel because the math tracks the regularities, not because the field exists.

  **Elena:** You're treating "existence" as a binary switch. Real or not. But reality might be layered. The ether was wrong as a mechanical solid, but was it wrong that there's a medium? Maxwell's equations describe a field that carries energy and momentum. It has physical properties. It's not "nothing." The realist claim is that there is *something* out there corresponding to the terms in the theory, even if our description of its intrinsic nature is imperfect.

  **Marcus:** "Something." That's a very thin realism. If "something" just means "there is a cause for these phenomena," sure. I'm not a solipsist. But you want more. You want to say the "something" has properties isomorphic to your equations. And that's where Stanford bites again. We have no guarantee that the "something" is even describable in terms of fields or particles. It might be information. It might be topological defects in a spacetime foam. It might be something we don't have the vocabulary for.

  **Elena:** So we just stop? We say, "Well, we have Fresnel's equations, but we have no idea if light exists"?

  **Marcus:** We say, "We have Fresnel's equations, and they work until they don't." We maintain epistemic humility. The retired opticist you mentioned? He shouldn't feel cheated. He mastered the regularities. He learned the grammar of nature. But he shouldn't confuse the grammar with the mind of the author.

  **Elena:** That's a lovely poem, Marcus. But it doesn't help me explain to a grad student why we're spending three years building a detector for dark matter. If dark matter is just a "posit" that might turn out to be a modification of gravity or an unconceived alternative, why pour the concrete?

  **Marcus:** Because it's the best game in town *right now*. Pragmatism, not realism. You build the detector to see if the regularities hold at that scale. If you find a signal, great, you have new regularities. If you don't, you constrain the theory. You don't need to believe dark matter is "real" in a capital-R sense to justify the search. You just need to believe the question is worth asking.

  **Elena:** I think that's disingenuous. When you write the grant proposal, you don't say, "We are testing the robustness of a mathematical model." You say, "We are searching for a particle." The practice of science is inherently realist. We treat the unobservables as real agents. We manipulate them.

  **Marcus:** Hacking's "Experiment and Reality." If you can spray them, they are real.

  **Elena:** Exactly. We spray electrons. We trap ions. We aren't just observing regularities; we're intervening.

  **Marcus:** But you intervene using theories! You trap an ion using electromagnetic fields. If the theory of EM fields is the thing in question, your intervention is circular. You're using the theory to prove the theory. It's like using a map to prove the territory matches the map, when you've never left the library.

  **Elena:** But the map keeps letting me navigate the terrain without falling off cliffs.

  **Marcus:** And the map of the crystalline spheres let astronomers predict planetary positions for a thousand years. Until it didn't. My point isn't that science is useless. It's that success is not a truth-tracking meter. It's a survival metric. Theories survive because they are useful, not because they are true.

  **Elena:** I can't accept that. If I accept that, then the progress from Fresnel to Maxwell isn't progress toward truth. It's just... swapping tools.

  **Marcus:** Maybe it is. Maybe "truth" is the wrong category. Think about the opticist again. Does it matter if the ether exists?

  **Elena:** It matters to him. He felt he was learning how the world works.

  **Marcus:** He was. He learned how the world *behaves*. That's all we can ever know. We are inside the system. We can't step outside to check if our map matches the territory. We can only check if the map helps us walk without tripping.

  **Elena:** (Takes a long sip of her drink) You know, Worrall would say you're ignoring the continuity. The fact that the Fresnel coefficients *are* the Fresnel coefficients, regardless of the ontology. That has to count for something. It suggests we are locking onto invariant features of reality.

  **Marcus:** Invariant features of our *experience* of reality. The structure might be in the math, not the world. Kant would be very comfortable in this bar tonight.

  **Elena:** And Bohr. But I'm not a Kantian. I'm a physicist. I need to believe that when I write down $\nabla \cdot E = \rho / \epsilon_0$, I'm writing down a law of nature, not just a rule for organizing my data.

  **Marcus:** Then you're taking a faith position. And there's nothing wrong with that, as long as you call it faith. But don't call it a conclusion forced by the history. The history is a graveyard, Elena. The ether is just one headstone.

  **Elena:** Or it's a foundation stone. Buried, but holding up the building.

  **Marcus:** (Raises his glass) To the buried stones, then. May they hold until we need to renovate.

  **Elena:** (Clinks glass) To the renovation. Because we both know it's coming.

  **Marcus:** Oh, absolutely. The question is just whether the next crew will call us realists or fools.

  **Elena:** They'll call us physicists. Drink up.

  *(They finish their drinks. The argument is not resolved, but the tension remains, suspended like the ether itself.)*
