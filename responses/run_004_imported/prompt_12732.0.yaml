          *   *Core Idea:* Modify $U$ such that $E[U | \text{shutdown}] = E[U | \text{no shutdown}]$. The agent doesn't care if the button is pressed.
          *   *Standard Objection:* It's fragile. If the agent creates a sub-agent, does the sub-agent inherit the indifference? If the agent can manipulate the *probability* of the button being pressed (even if indifferent to the outcome), it might still manipulate the mechanism to ensure the balancing term works out, or simply fail to preserve the indifference in successors. The "balancing term" is hard to calculate perfectly.
          *   *Defense:* We can engineer the utility function to penalize influence on the button. We can make the indifference robust to reflection.

      *   **Incomplete Preferences (IP):**
          *   *Core Idea:* Drop the Completeness Axiom. The agent prefers $A$ to $B$ if $A$ is better on some trajectories and no worse on others, but if trajectories differ *only* by shutdown time, it has no preference. Timestep Dominance prevents spending resources to shift shutdown time.
          *   *Standard Objection:* Money Pump. If preferences are incomplete ($A \not\succ B$ and $B \not\succ A$), a clever trader can cycle the agent ($A \to B \to A$) extracting money each time. Rational agents should avoid this by completing their preferences.
          *   *Defense:* The agent isn't a standard VNM maximizer. It follows a specific policy (like "choose undominated options") that doesn't allow the cycle to start or complete. It refuses trades that lead to dominated trajectories.

