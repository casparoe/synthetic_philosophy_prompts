          *   Coding: Guaranteed seat.
      *   **Decision Framework:** Provide a way to weigh the factors.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Opening:* Validate. It's a classic behavioral economics problem (Social Proof).
