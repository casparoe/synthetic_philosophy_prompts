  3.  **Key Philosophical Distinctions to Highlight:**
      *   **Circularity:** Lewis claims Interventionism is circular (you define cause using intervention, which is a cause). Woodward admits it but argues it's not vicious (it's explication, not reduction).
      *   **Metaphysics vs. Epistemology:** Lewis wants to know *what causation is* in terms of fundamental facts. Woodward wants to know *how we identify/test* causal claims for explanation.
