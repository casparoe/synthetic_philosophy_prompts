  Marcus is factually correct about non-monotonicity (a candidate can lose by gaining more support in RCV), which Plurality avoids. However, his conclusion that this makes RCV "not obviously safer" is debatable; voting theorists generally agree that spoiler effects in Plurality are far more common and damaging than non-monotonicity in RCV. He trades a common failure mode for a rare one, but frames it as a wash.

  **The Bigger Point They're Missing**
  Both neighbors are trapped in a **Plurality vs. IRV (Ranked-Choice) false dichotomy**. They are missing **Approval Voting** (or Score Voting), where voters select all candidates they find acceptable. Approval Voting is monotonic (like Plurality), immune to the spoiler effect (like RCV), simpler to count and understand, and often bypasses the Gibbard-Satterthwaite constraints because it utilizes cardinal rather than ordinal data. Additionally, they are ignoring **scale**: in a small co-op election, the pathological cases Marcus worries about (non-monotonicity) are statistically vanishingly rare, making Deb's practical solution overwhelmingly preferable regardless of theoretical edge cases.
