      *   *Self-Correction on Follow-ups:* Make sure the follow-ups anticipate the *standard* Lewisian defense (e.g., appealing to the Block Universe, distinguishing local/global ability) so the host isn't left hanging.

  5.  **Final Polish:** Add an intro and outro to frame the advice nicely. (Ensure the distinction between "can" relative to local facts vs. global facts is clear in the questions).

      *(Self-Correction during drafting Question 4)*: Make sure the probability question highlights the tension between *local* physical probability (gun works 50% of time) and *global* metaphysical necessity (grandfather must live).

