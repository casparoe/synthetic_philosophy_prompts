      *   *The Passion Argument:* This is the stronger Spinozistic point. If men's passions (lust/jealousy) make joint rule unstable, then the *collective power* of a state including women in rule might be diminished. Thus, excluding them might actually *increase* the state's overall power (and thus right). But this is a pragmatic political calculation, not a metaphysical claim about women's inherent essence.

