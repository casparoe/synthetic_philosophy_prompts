      *   *Observation:* I have coherent memories (I learned physics, I read Wikipedia, I have a childhood).
      *   *Dilemma:* If I am a BB, my memories are likely lies. If my memories are lies, the physics I remember is likely a lie. If the physics is a lie, the prediction of BBs is a lie. So maybe I'm not a BB? But the math...
      *   *The Twist/Vertigo:* The narrator needs to catch themselves in the act of reasoning, realizing the tool they are using to measure reality might be broken.

  3.  **Character & Setting:**
