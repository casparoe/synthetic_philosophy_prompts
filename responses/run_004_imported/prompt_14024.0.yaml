      *   The tone should be analytical but fraying at the edges. Like a debug log of a mind crashing.

  6.  **Writing - Iteration 1 (Mental Outline):**
      I'm sitting at my desk. I read about Boltzmann Brains. I worry I am one. Then I read that BBs usually have crazy memories. I have normal memories. So maybe I'm not one? But if I am one, my memory of reading that fact is fake. So I can't use that fact to prove I'm not one. My coffee tastes like coffee. But does it? I try to do math. The numbers look right. But did I learn math? I stop writing.

      *Critique 1:* Too summary. Needs more texture. Needs to feel the *vertigo*.

  7.  **Writing - Iteration 2 (Focusing on the Logic Trap):**
