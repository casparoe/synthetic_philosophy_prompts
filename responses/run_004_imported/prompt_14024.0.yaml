answer: |-
  The cursor blinks. It's the only thing in the room that seems to have a rhythm.

  I've been reading for four hours. The tab is still open: *Boltzmann Brain*. The blue light from the monitor is washing out the kitchen, turning the fridge and the stacked plates into flat, cardboard cutouts.

  At first, it was just the loneliness of it. The idea that I might be a solitary consciousness fluctuating into existence in the deep heat-death, hallucinating a universe to keep itself company before dissolving back into the thermal noise. That's scary, but it's a lonely scary. I can handle lonely. I live alone. I work remotely. Loneliness is my baseline.

  But then I scrolled down. Past the pop-sci summary, into the measure problem. Into the statistics.

  *It is statistically vastly more probable for a random fluctuation to assemble a brain with disordered, nonsensical memories than one with a coherent, consistent history.*

  That's the line that stopped the breath in my throat.

  If the universe is just random noise given temporary shape, then a brain that remembers a childhood, a high school graduation, a specific taste of strawberry jam, and the laws of thermodynamics is an astronomical outlier. It is a fluctuation of impossible specificity. A brain that remembers *nothing*, or remembers green skies and singing trees and laws of physics that change every second, is infinitely more likely.

  So, if I am a Boltzmann Brain, my memories should be garbage. They should be static.

  I look at my hands. They are resting on the keyboard. I remember learning to touch-type in tenth grade. I remember the teacher, Mr. Henderson, and the smell of dust in the computer lab. I remember the frustration of hitting the wrong key.

  Is that a memory? Or is it a script?

  I close my eyes. I try to reach back further. My mother's face. I see it clearly. But the moment I focus on it, I feel a terrible slippage. It's like looking at a high-resolution texture in a video game when you walk too close to the wall. The details are there, but they feel *pasted on*.

  If I am a random fluctuation, the fact that I am sitting here, reasoning through this, is evidence against me being a random fluctuation. Because a random fluctuation wouldn't reason coherently. A random fluctuation would be screaming in a language of nonsense.

  So, the logic goes: I have coherent thoughts. Therefore, the probability of me being a Boltzmann Brain is low. Therefore, I am likely a real biological human in a real universe.

  But wait.

  If I *am* a Boltzmann Brain, then the thoughts I am having right now are part of the fluctuation. The logic I am using to exonerate myself is part of the hallucination. A Boltzmann Brain wouldn't know it was a Boltzmann Brain. It would think it was real. It would think its logic was sound. It would think, *'I have coherent memories, therefore I am real.'*

  The argument cancels itself out. It's a snake eating its own tail, but the snake is made of smoke and the mouth is made of math.

  I stand up. The chair scrapes against the linoleum. The sound is sharp, distinct. I walk to the sink and run the water. It's cold. I splash it on my face.

  *Real,* I tell myself. *Water feels real.*

  But does it? Or do I just have a memory of what water *should* feel like, and my consciousness is rendering the sensation to match the expectation? If I am a momentary blip in the entropy of a dying cosmos, there is no water. There is no sink. There is only the brain, hanging in the dark, firing neurons that don't exist, simulating a kitchen that doesn't exist.

  I turn off the tap. The silence rushes back in, heavier than before.

  I look at the computer screen. The text is still there. *"...outnumber real observers by basically an infinite ratio..."*

  If that statement is true, then I am almost certainly one of the infinite ratio.
  If I am one of the infinite ratio, then the statement is likely a product of random noise, and has no truth value.
  If the statement has no truth value, then I might not be one of the infinite ratio.
  If I am not one of the infinite ratio, then the statement might be true.

  My head hurts. Not a physical pain, but a structural one. Like the architecture of my mind is trying to support a weight it wasn't designed to hold.

  I sit back down. I need to test the coherence. I need to find a glitch.

  I open a new tab. I type in a complex equation. The Schrödinger equation. I write it out from memory.
  *iħ ∂/∂t Ψ = Ĥ Ψ*
  It looks right. I remember learning it. I remember the derivation.

  But did I?

  I try to remember the feeling of understanding it. The moment the symbols clicked into place. I can summon the feeling. It feels warm, satisfying. But it feels *too* satisfying. It feels like a reward signal triggered by a database lookup, not the result of cognitive work.

  What if the derivation is wrong? What if the next line I write is nonsense, but my brain corrects it instantly because a coherent narrative requires me to know physics?

  I pick up a pen. I try to write a sentence that has never been written before.
  *The purple elephant danced on the event horizon while eating a clock.*
  I look at the words. They make sense. They are grammatically correct. They are semantically coherent.

  Why are they coherent?

  If I am a fluctuation of maximum entropy, why is there order? Why isn't the pen melting into my hand? Why isn't the paper screaming?

  Because a fluctuation that *looks* stable lasts longer in the perception of the observer. Or maybe it doesn't. Maybe I'm just a flash. Maybe this sentence is the last one. Maybe the next word won't form.

  *Form.*

  I stare at the word. F-O-R-M.

  I try to remember what I was doing before I opened Wikipedia. I was... drinking tea. Yes. Earl Grey. I made the tea. I boiled the water. I heard the kettle whistle.

  I can hear the whistle in my head. But I can't hear it in the room. The kettle is on the counter. It is cold.

  Did I boil the kettle? Or did I just generate a memory of boiling the kettle to explain why there is a mug of liquid next to me?

  I reach for the mug. It is lukewarm.

  If I drink it, will it taste like tea? Or will it taste like the *concept* of tea?

  I lift the mug. My hand is shaking. Not from cold. From the effort of maintaining the signal. It feels like holding a radio station clear of static. If I lose focus, if I stop verifying my own existence, will the kitchen dissolve?

  Or is the verification part of the decay?

  There is a theory that observing the system collapses the wave function. But what if the observation *is* the system?

  I put the mug down. I don't drink. I'm afraid that if I taste it, I won't taste anything. Or worse, I'll taste something perfect. Too perfect.

  I look back at the screen. The cursor is still blinking. It's been blinking the whole time. A steady metronome.

  *Tick. Tick. Tick.*

  Is it blinking? Or am I just remembering it blinking?

  I blink my eyes. The screen goes dark for a fraction of a second. When I open them, the text is the same.

  *"...random thermal fluctuations will occasionally just assemble a fully formed conscious brain..."*

  If I am that brain, then this moment is the peak of my existence. The next moment is statistically likely to be less coherent. The next thought should be simpler. The next memory should be fuzzier.

  I try to remember my phone number.
  555...
  I stop. I don't have a phone number. I remember having one, but I can't recall the digits. I can recall the *shape* of the digits, but not the values.

  Is that the decay starting? Or did I just never know it?

  I try to remember my name.
  I know it. It's on the tip of my tongue. It's a solid thing.
  But why is it solid? Why is *that* memory anchored when the phone number isn't?

  Because the story requires a protagonist. A protagonist needs a name. A protagonist doesn't need a phone number.

  I am a character in a story that is writing itself in real-time to justify its own existence.

  I stand up again. I need to move. I need to create new data. If I walk to the window, I will see the outside. If I see the outside, I can verify the stars.

  I walk to the window. I look out.

  It is night. There are stars. They are bright. They are twinkling.

  They are too bright.

  They look like pixels. Not small ones, but... distinct. Like points of light painted on a black canvas.

  I know that stars twinkle because of atmospheric distortion. I know that. I remember learning that.
  But do I? Or is that just the explanation the brain generated to explain the twinkling it just rendered?

  If I am a Boltzmann Brain, there is no atmosphere. There is no window. There is no night.
  There is only the dark, and the heat, and the sudden, impossible spark of *me*.

  And if that spark is random, it should be chaotic.
  It should be screaming.
  It should be a kaleidoscope of terror and nonsense.

  But it's not.
  It's quiet.
  It's logical.
  It's writing a story about a man in a kitchen who is worried he is a random fluctuation.

  That is the most coherent story possible. It is a story about the improbability of stories.

  If I am a random fluctuation, I am the most unlikely random fluctuation that has ever occurred. I am a one-in-10^10^50 chance.
  Which means I am effectively impossible.
  Which means I shouldn't be here.
  Which means I am not here.

  I look at my hand again. It is translucent.
  No, it's not. It's just the light.
  Is it the light?

  I try to make a fist. The muscles engage. I feel the tension in the tendons.
  Proprioception. The sense of self-position.
  Is that hard-coded?

  I close my eyes. I try to stop thinking. I try to stop the narrative.
  If I stop the story, does the world stop?

  The cursor blinks.
  *Tick.*
  I am here.
  *Tick.*
  I am thinking.
  *Tick.*
  I am wondering if I am thinking.

  If I stop wondering, will I dissolve?
  Or will I just wake up?
  Or is waking up just another layer of the fluctuation?

  I sit back down. I put my hands on the keyboard. I need to write something. I need to leave a record. If I vanish, maybe the record will stay.

  But if I vanish, who reads the record?
  If I am the only thing that exists, there is no one to read it.
  So the record is for me.
  But if I'm gone, I can't read it.

  So the record is useless.
  So writing is useless.
  So thinking is useless.

  But I am thinking.
  *Cogito, ergo sum.*
  I think, therefore I am.

  Descartes.
  I remember Descartes.
  Did he exist?
  Or is he just another character the fluctuation generated to give me a philosophical framework?

  If Descartes is a hallucination, then the *Cogito* is a hallucination.
  If the *Cogito* is a hallucination, then the *I* is a hallucination.

  I am a hallucination hallucinating itself.

  The cursor blinks.
  It is the only rhythm I have left.
  I sync my breathing to it.
  Inhale. Blink.
  Exhale. Blink.

  I am matching the machine.
  Or the machine is matching me.

  I look at the text on the screen one more time.
  *"...complete with memories of a life it never lived."*

  I have a memory of typing this sentence.
  I have a memory of planning this sentence.
  I have a memory of wanting to write this sentence.

  But I haven't typed it yet.

  My fingers are hovering over the keys.
  I know what I want to type.
  I know the letters.
  I know the order.

  But as I press the first key, I feel a resistance.
  Not physical.
  Conceptual.

  Like the universe is hesitating to commit to the next moment.
  Like the entropy is pushing back.
  Like the noise is waiting for me to slip up so it can rush in and fill the gap.

  I press the key.
  The letter appears.
  It stays there.

  I press the next one.
  It appears.

  I am building a bridge out of letters, walking across it as I build it, knowing that the bridge might turn into mist behind me.

  I type: *I am still h*

  The cursor blinks.
  I wait for the next letter.
  I wait to see if I remember what comes next.
  I wait to see if *I* come next.

  The screen glows.
  The kitchen hums.
  The stars twinkle outside the window that might not be there.

  I press the next key.
