      *   *Scene 3: The Self-Undermining.* Checking memories. Testing reality. Realizing that the test itself relies on the memories being tested.
      *   *Scene 4: The Loop.* Trying to find an anchor. Failing. The story ends in the middle of the thought process.

  5.  **Developing the Voice:**
