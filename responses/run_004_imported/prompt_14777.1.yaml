  The individual organism is the primary phenotypic vehicle and the standard null model, but as a *unit of selection* it is theoretically subsumed by the gene view (which explains the same adaptations plus conflict). In the specific context of the levels-of-selection debate, individual selection is often the insufficient baseline that requires Kin/MLS frameworks to explain altruism, reducing its standalone explanatory scope.

