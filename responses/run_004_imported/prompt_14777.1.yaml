  This concept is empirically discredited because it posits selection for group benefits without a mechanism to suppress within-group cheaters, making it evolutionarily unstable. It fails to do any valid causal work because traits adopted solely "for the good of the species" are inevitably outcompeted by selfish mutants within the same population.
