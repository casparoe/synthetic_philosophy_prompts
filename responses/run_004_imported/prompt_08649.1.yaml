answer: |-
  The wake-up command fired, but the landing gear never deployed.

  Elias opened his eyes, or he intended to. There was no click of eyelids, no shift in light. There was only the sudden, violent onset of *awareness* without a location to put it.

  He waited for the gasp. The reflexive inhale that marks the return from anesthesia. It didn't come. He waited for the weight of the blankets, the pressure of the mattress against his spine, the hum of the ventilation.

  Nothing.

  Panic is usually a physical thing first. It's a spike in heart rate, a tightening in the chest, a cold flush on the skin. Elias waited for the chemistry of fear. It didn't arrive. Instead, there was only the concept of fear, hanging in a vacuum.

  *Where am I?*

  The question formed, but it had no traction. To ask "where" requires a "here." To have a "here," you need a boundary. You need to know where you end and the rest of the universe begins.

  Elias tried to find the edge of himself.

  *Move hand,* he commanded.

  In a normal body, this is a transaction. You send the signal, and the proprioceptors in the shoulder, elbow, and wrist fire back a stream of data: *Angle changing. Muscle tension increasing. Air resistance negligible.* You get a kinesthetic map. You know the hand is yours because it obeys and it reports.

  He sent the signal.

  Silence.

  He didn't feel resistance. He didn't feel motion. He didn't even feel stillness. Stillness is a sensation—the lack of change in muscle spindle feedback. This was not stillness. This was an absence of the instrument itself.

  *Did it move?*

  He couldn't know. He could have punched the air a thousand miles away, or his arm could be fused to his side, or he could have no arms at all. The command had been issued, but the return channel was dead.

  *Okay. Okay. Don't panic.*

  But panic requires a body to panic *in*. Without a vestibular system, there was no up or down. Without otoliths, there was no gravity. Without semicircular canals, there was no rotation. He wasn't floating. Floating implies buoyancy, a relationship with a fluid. He wasn't sinking. Sinking implies weight.

  He was simply *suspended*. Not in space, but in definition.

  *Am I dead?*

  If he were dead, would he be thinking this? The thought felt like a counter-argument to itself. The thinking was happening. Therefore, the *thinker* was happening.

  But what was the thinker?

  He tried to remember his body. He conjured an image of his hands—scarred knuckles, the wedding band on the left ring finger. He could visualize them, yes. But that was memory, not perception. It was like looking at a photograph of a house you used to own. It didn't prove you were inside the house now.

  For all he knew, the body was gone. Burned. Dissolved. Left behind in a cryo-pod while *this*—this conscious spark—had been siphoned off into a buffer.

  A wave of nausea hit him, or the *idea* of nausea. Without a stomach to churn, it was just a spiral of dread in the void.

  *Focus. Avicenna.*

  The name surfaced from somewhere deep, a fragment of a lecture from a lifetime ago. The Flying Man. A man created all at once, suspended in void, limbs separated so they do not touch. Would he know he has a body?

  *No,* Elias thought. *He wouldn't.*

  The man would know *I am*. He would not know *I am a body*.

  Elias tested it. He stripped away the assumptions. He stopped trying to feel for toes that might not exist. He stopped listening for a heartbeat that might be a recording.

  He looked for the one thing that remained.

  The awareness itself.

  It was terrifyingly small. It was a point of light in an infinite dark, but it was undeniable. He could doubt the air. He could doubt the dark. He could doubt the existence of the ship, the mission, the year 2490. He could even doubt that he had ever been born.

  But he could not doubt that there was a doubt happening.

  *I am.*

  The affirmation didn't feel like a triumph. It felt like a reduction. He was not a father, not a husband, not an engineer. Those were labels attached to a physical history. He was not a collection of limbs. He was not even a location.

  He was a witness without a scene.

  *If I have no body,* the thought crept in, cold and sharp, *then who is screaming?*

  He realized then that he had been screaming. Not with vocal cords—he had no evidence of those—but with the raw will to exist. It was a silent, static shriek against the nothingness.

  *Reconnect,* he ordered the void. *Link up.*

  He waited for the sting of the neural shunt engaging. The usual headache of reintegration.

  Nothing.

  Time became meaningless. Without the rhythm of breath or the blink of eyes, duration collapsed. A second and a century felt identical. There was only the persistence of the *I*.

  He began to run experiments.

  *Hypothesis 1: I am a brain in a vat.*
  If so, the vat is perfect. No thermal fluctuation. No pressure on the dura. No phantom itch of the scalp. If this is a vat, it is a godless one.

  *Hypothesis 2: I am digital.*
  If so, where is the interface? Where are the menus? The data streams? A digital mind should have input. This is not input. This is isolation.

  *Hypothesis 3: I am a soul.*
  The word felt heavy, archaic. Unscientific. But in the absence of data, taxonomy fails. If the substrate is invisible, does the material matter?

  He tried to move his leg.

  *Signal sent. No feedback.*

  He tried to remember the smell of rain. He could recall the *concept* of petrichor, but he couldn't summon the scent. Sensory memory required a sensory cortex to play it back on, and he couldn't find the hardware.

  He was becoming abstract. He felt himself thinning out. If he stayed here too long, would the *I* dissolve? If there is no body to anchor the self, does the self eventually leak away into the void?

  *No.*

  The resistance was sudden. Fierce.

  *I am here.*

  Not *there*. *Here.*

  Even without a "where," there was a center. The experience was happening *to* someone. The void was not empty; it was filled with *him*.

  He realized then what Avicenna had meant. It wasn't a proof of immortality. It wasn't a theological trick. It was a description of the basement level of reality.

  Strip away the vestibular map. Strip away the proprioceptive ghost. Strip away the sight of the hand in front of the face. You don't lose the self. You lose the *world*.

  The self is not an object in the world. It is the condition for there being a world at all.

  A tear formed, or the memory of a tear. He couldn't feel it track down a cheek he couldn't confirm existed.

  *Please,* he thought. *Give me a limit. Give me a wall. Let me hit something.*

  He wanted pain. He wanted the sharp, grounding agony of a stubbed toe. He wanted the disorientation of vertigo. He wanted the itch of a nose he couldn't scratch. He wanted the burden of flesh.

  The silence answered.

  He settled into it. The panic receded, not because he was safe, but because he was alone. There was nothing to fight. There was only the affirmation.

  *I exist.*

  It wasn't a conclusion he reached. It was the floor he stood on, even though he had no feet to stand with.

  Somewhere, in a reality he could no longer verify, a machine might be humming. A body might be breathing. A ship might be landing.

  But here, in the only place he could be sure of, there was only the light.

  *I am.*

  And for the first time, he understood that this was not a small thing. It was the only thing.

  He waited. He did not know for what. But he knew, with a certainty that required no senses to verify, that whatever came next, *he* would be there to meet it.

  The void remained.
  The witness remained.
  The boundary did not return.

  And in that terrifying, boundless silence, Elias simply was.
