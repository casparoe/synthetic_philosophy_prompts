      *   **Synchronic DBA (The Baseline):** Briefly note why it's robust. It's about logical consistency at a time slice. Bookie needs no future knowledge, just current quotients.
      *   **Diachronic DBA (The Target):** Explain the structure (Bet 1 at $t_1$, Bet 2 at $t_2$).
      *   **The Friend's Objection (The "Knowledge" Constraint):**
          *   To construct the book, the bookie needs to know the agent's update rule *before* placing Bet 1.
          *   If the agent keeps their rule secret, can they be booked?
          *   If exploitability depends on the bookie's epistemic state, is it a norm of *rationality* or just *prudence*?
      *   **The Pro-Diachronic Rebuttal (The "Disposition" Defense):**
          *   Rationality isn't about hiding strategies; it's about having a coherent plan.
