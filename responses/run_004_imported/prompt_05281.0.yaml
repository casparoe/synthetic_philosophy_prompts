              *   Traits are rare (Aristotle didn't say everyone has them).
              *   Traits are consistent *ceteris paribus* (all else being equal), not in extreme situations.
              *   *Phronesis* (practical wisdom) allows context sensitivity (this is what Jordan mentioned).
