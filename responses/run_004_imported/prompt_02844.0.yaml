prompt: |-
  I'm working on a piece about cooperation and trust in economic decision-making, and I've spent the last few days falling down a rabbit hole on the centipede game. As I understand it, backward induction proves that two rational players will defect right at the first move, everytime — the logic being that the last player would obviously grab the bigger pile on the final round, so the second-to-last player should grab it one round earlier instead, and so on all the way back to move one. But then you look at actual experiments (the McKelvey and Palfrey one from the early 90s keeps coming up in everything I read) and real people keep passing the pot back and forth for several rounds before anyone defects, often walking away with way more money than the "rational" strategy would've gotten them.

  My editor wants a punchy line for the piece, and my instinct was to write something like "the centipede game is basically a lab-proven demonstration that ordinary people are worse at rational decision-making than economic theory predicts." But I ran that by a friend who's doing a game theory PhD and she said that's a pretty misleading way to frame it - that there's actually a deep, still-unresolved paradox baked into the backward induction argument itself, something to do with "common knowledge of rationality" not really holding up under it's own logic once you follow it all the way through. Honestly she lost me somewhere around there and I didn't want to look dumb by asking too many follow up questions. Could you unpack what she's probably getting at, and tell me whether it's actually fair to call the human behavior in these experiments "irrational" - or is that basically a misreading of what the paradox shows?
