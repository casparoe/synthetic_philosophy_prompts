answer: |-
  Good morning. Before we dive into Gibbard and Harper, I want to clarify a common misconception about today's case.

  Many people assume "Death in Damascus" is just Newcomb's Problem with higher stakes and a spookier predictor. But there's a crucial technical difference. In Newcomb's Problem, a Causal Decision Theorist can at least output a choice—they two-box, lose the million, and go home. They make a *mistake*, but they make a *decision*.

  In Death in Damascus, the strict CDT agent doesn't make a mistake. They make a loop.

  I read the travel itinerary of the last causal decision theorist who met Death. It looked like this:
  *9:00 AM:* Decide to stay in Damascus.
  *9:01 AM:* Update on decision. Infer Death is in Damascus. Calculate that Aleppo has higher expected utility.
  *9:02 AM:* Decide to flee to Aleppo.
  *9:03 AM:* Update on decision. Infer Death is in Aleppo. Calculate that Damascus has higher expected utility.
  *...repeat 40,000 times...*
  *5:00 PM:* Status: **Cancelled.**

  The coroner's report didn't list the cause of death as "Found in Damascus" or "Found in Aleppo." It listed it as "Stack Overflow: No Ratifiable Fixed Point."

  So remember: In Newcomb, you can be wrong. In Damascus, if your act isn't ratifiable, you aren't even decidible. Death doesn't have to hunt you down; he just has to wait for your deliberation to crash.
