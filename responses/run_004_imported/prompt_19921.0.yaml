answer: |-
  This is the exact kind of friction that happens when you take folk epistemology seriously enough to formalize it but not seriously enough to realize it's a leaky abstraction. You're right that the Bank Case is overworked and underdetermined. It's the trolley problem of epistemology: everyone uses it to prove their point, but it mostly just proves people have conflicting intuitions they can't reconcile.

  Here is the structural cut, the divergence test, and the verdict.

  ### 1. The Structural Cut: Locus of Sensitivity

  The difference isn't whether stakes matter; it's *whose* stakes matter and *where* they hit the machinery.

  **Epistemic Contextualism (EC)** (DeRose, Lewis, Cohen):
  *   **Mechanism:** Semantics. The word "knows" is indexical, like "tall" or "here."
  *   **Locus:** The **Attributor's** context.
  *   **Function:** Stakes raise the salience of error possibilities for the *speaker*. This shifts the semantic standard for the word "knows."
  *   **Implication:** The subject's mental state and evidence remain constant. Only the truth value of the *sentence* "S knows that p" changes depending on who is saying it and where.

  **Pragmatic Encroachment (PE) / SSI** (Stanley, Hawthorne, Fantl & McGrath):
  *   **Mechanism:** Metaphysics/Normativity. Knowledge is a state that must be robust enough to serve as a premise in practical reasoning.
  *   **Locus:** The **Subject's** context.
  *   **Function:** Stakes raise the threshold of justification required for the subject to *be in the state* of knowing.
  *   **Implication:** The word "knows" has a fixed meaning. Whether the subject *satisfies* that meaning depends on their practical environment. High stakes can destroy knowledge without changing evidence.

  **The One-Sentence Distinction:**
  Contextualism says stakes change what the word "knows" **means** in a conversation; Pragmatic Encroachment says stakes change whether the subject **has** the property.

  ---

  ### 2. The Divergence Cases

  This is where the theories bleed. We need cases where Attributor Stakes $\neq$ Subject Stakes.

  #### Case A: The Gossip and the Gambler
  *   **Subject (Hannah):** High Stakes. She is about to bet her life savings on the bank being open.
  *   **Attributor (Sarah):** Low Stakes. She is gossiping to a third party. She has no money in the game; she's just chatting.
  *   **Utterance:** Sarah says, "Hannah knows the bank is open."

  | Theory | Truth Value of "Hannah knows" | Why? |
  | :--- | :--- | :--- |
  | **Contextualism** | **TRUE** | Sarah's context is low-stakes. The semantic bar for "knows" is low. Hannah clears it. |
  | **Pragmatic Encroachment** | **FALSE** | Hannah's context is high-stakes. Her evidence isn't strong enough to warrant betting the house. She doesn't know. |

  #### Case B: The Panic and the Boredom
  *   **Subject (Hannah):** Low Stakes. She doesn't care if the bank is open; she's just curious.
  *   **Attributor (Sarah):** High Stakes. Sarah needs to know if the bank is open to prevent a catastrophe, and she is relying on Hannah's testimony. Sarah is panicked.
  *   **Utterance:** Sarah says, "Hannah knows the bank is open."

  | Theory | Truth Value of "Hannah knows" | Why? |
  | :--- | :--- | :--- |
  | **Contextualism** | **FALSE** | Sarah's context is high-stakes. The semantic bar is raised. Hannah's evidence (good for low stakes) doesn't clear Sarah's high bar. |
  | **Pragmatic Encroachment** | **TRUE** | Hannah's context is low-stakes. Her evidence is sufficient for her level of need. She knows. |

  ### 3. The "Cheat" and The Verdict

  You asked if Contextualism can dodge the ugly result in Case B without smuggling Subject stakes in through the side door.

  **The Contextualist Dodge:**
  A sophisticated Contextualist (like DeRose) will argue that in Case B, when Sarah is assessing Hannah, the "relevant context" shifts to Hannah's situation because we are assessing *her* epistemic position.
  **The Problem:** This is ad hoc. If "knows" is determined by the *attributor's* context, why does it magically snap to the *subject's* context when we talk about third parties? If the rule is "standards match the person being evaluated," then Contextualism collapses into Invariantism with a variable threshold (which is just PE). If the rule is "standards match the speaker," then Case B yields the counter-intuitive result that Hannah *loses* knowledge because *Sarah* is panicked. That makes knowledge solipsistic and communicatively useless.

  **The Verdict:**
  **Pragmatic Encroachment wins the divergence cases.**

  Here is why: **Knowledge is for action.**
  The primary functional role of the concept "knowledge" is to mark propositions that are safe to use as premises in practical reasoning.
  *   In **Case A**, if Sarah says "Hannah knows," and Hannah acts on it, Hannah loses her house. PE correctly identifies that Hannah *does not know* because she cannot safely act. EC gets this wrong by validating the assertion based on Sarah's boredom.
  *   In **Case B**, if Sarah says "Hannah doesn't know" because *Sarah* is panicked, she is misdescribing Hannah's epistemic state. Hannah *is* in a position to act (or at least, she is in a position of certainty relative to her own life). PE captures this: Hannah knows. EC falsely penalizes Hannah for Sarah's anxiety.

  **On Semantic Blindness vs. Truth-Tracking-Care:**
  You asked if Contextualism's "semantic blindness" (speakers don't realize they're shifting meanings) costs more than PE's "truth-tracking-care" (truth depends on how much you care).

  *   **Semantic Blindness** is a theoretical death sentence. It requires that ordinary speakers are systematically mistaken about the logic of their own language. If I say "I know" and you say "You don't," we feel like we are disagreeing. EC says we aren't; we're just talking past each other. This destroys the normativity of disagreement.
  *   **Truth-Tracking-Care** sounds weird ("How can my caring make a fact harder to grasp?"), but it's not actually claiming caring changes the *fact*. It claims caring changes the *threshold for reliance*. It is not that the bank's hours change; it is that the label "knows" is reserved for evidence robust enough to handle the risk.

  **Verdict:** PE is less ad hoc. It preserves the link between knowledge and action, and it preserves the intuition that speakers are actually disagreeing in high/low stake conversations. Contextualism saves the semantics by sacrificing the metaphysics of disagreement.

  ---

  ### 4. The Bayesian Translation (Does the dispute survive?)

  If we ban the binary operator `K(p)` and speak only in credences $Cr(p)$ and utility functions $U$, does the fight dissolve?

  **Yes and No.**

  If you go full Bayesian, **Contextualism evaporates.**
  Contextualism is a theory about the semantics of a specific natural language term ("knows"). If you remove the term, you remove the context-sensitivity. There is no "contextualist credence." $Cr(p) = 0.95$ is $Cr(p) = 0.95$ regardless of who is speaking. Contextualism is parasitic on the binary vocabulary.

  **Pragmatic Encroachment survives as Decision Theory.**
  PE translates cleanly into Expected Utility Theory.
  *   **PE Claim:** You can treat $p$ as a premise for action $A$ only if $Cr(p)$ is high enough that $EU(A|p) > EU(A|\neg p)$ given your stakes.
  *   **Translation:** In the Bank Case, Hannah's credence might be 0.95.
      *   **Low Stakes:** The cost of being wrong is \$5. $0.95$ is sufficient to act. (She "knows").
      *   **High Stakes:** The cost of being wrong is \$100,000. $0.95$ is *not* sufficient to act. (She "doesn't know").

  **The Residual Dispute:**
  Even in a credence framework, a dispute remains, but it shifts from *semantics* to *assertion norms*.
  *   **The Question:** When should I assert $p$?
  *   **EC Answer:** When $Cr(p)$ exceeds the *conversational* threshold.
  *   **PE Answer:** When $Cr(p)$ exceeds the *subject's action* threshold.

  **Final Call:**
  If you are building a rationalist Discord bot to model epistemology, **drop "knows."** It's a lossy compression of "credence sufficient for action."
  But if you must choose the philosophical framework that best maps to reality: **Pragmatic Encroachment.**
  Contextualism is a linguistic hack to explain away intuitions. Pragmatic Encroachment is an acknowledgment that epistemology is a branch of decision theory. The "truth" of knowledge isn't about matching the world; it's about whether your map is detailed enough to navigate the terrain you're actually walking through. Contextualism says the map changes depending on who is looking at it. PE says the terrain (stakes) determines if the map is good enough. The terrain is real; the viewer's context is just noise.
