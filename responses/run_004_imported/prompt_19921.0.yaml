  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate SSI and PE too much, though for this purpose they are effectively the same (stakes affect knowledge status).
      *   *Correction:* Ensure I address the "semantic blindness" objection specifically. That's a key part of the prompt.
