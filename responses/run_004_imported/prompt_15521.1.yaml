      *   *Better formulation:* She argues that the "No Akrasia" principle is not an absolute constraint on rationality. Sometimes, the requirement to follow first-order evidence outweighs the requirement to avoid akrasia. Thus, the "dilemma" is real: you have to choose which norm to violate (or satisfy).
      *   *Another angle:* She distinguishes between *propositional* and *doxastic* justification. HOE might affect one but not the other.
      *   *Focus:* Stick to the 2014 paper's main thrust: HOE doesn't always defeat. The motivation is to preserve the link between truth/conduciveness and rationality. If HOE forces you to abandon a true, well-supported belief, rationality becomes disconnected from truth.

