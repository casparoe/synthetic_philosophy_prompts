answer: |-
  **Setting:** *A university faculty lounge, late evening. Empty coffee cups and scattered printouts cover the table. **Elena** (Unified Semantics, Stalnakerian) is leaning back in her chair. **Marcus** (Dualist, Adams/Edgingtonian) is pacing.*

  **Marcus:** Let's go back to the corpse in the Texas School Book Depository. It's the minimal pair that kills the unified view. "If Oswald didn't kill Kennedy, someone else did." Versus: "If Oswald hadn't killed Kennedy, someone else would have."

  **Elena:** The classic. The first we assert when we're unsure if Oswald acted alone. The second we assert when we're sure Oswald did it, but we're speculating about a conspiracy.

  **Marcus:** Exactly. And the semantic behavior is radically different. The indicative suggests the antecedent is an open epistemic possibility. The counterfactual suggests the antecedent is false, or at least presupposed to be false. If you try to force one semantics over both, you're ignoring that the indicative is doing epistemic work while the counterfactual is doing metaphysical work.

  **Elena:** I'm not ignoring it; I'm explaining it pragmatically. Look, the semantic machinery is identical. We have a selection function $f(A, w)$ that picks the closest $A$-world to $w$. The truth condition is always: $A \to C$ is true at $w$ iff $C$ is true at $f(A, w)$.

  **Marcus:** But for the indicative, you restrict the domain of that function.

  **Elena:** Precisely. For indicatives, the selection function is restricted to the *context set*—the set of worlds compatible with the presuppositions of the conversation. If we're discussing the assassination, the context set includes worlds where Oswald didn't do it. So the closest world where he didn't do it is still within our epistemic reach. For the counterfactual, we *expand* or *shift* the context set to accommodate the antecedent, even if it contradicts what we know.

  **Marcus:** That's the Stalnakerian move. It's elegant, Elena, I'll give you that. Parsimony is a virtue. But it crashes into the rocks of probability. When I say, "If Oswald didn't kill Kennedy, someone else did," I'm not describing a possible world. I'm expressing a conditional degree of belief. Adams' Thesis: The assertability of $A \to C$ is $P(C|A)$.

  **Elena:** I can accept Adams' Thesis. I can agree that $P(\text{If } A, C) = P(C|A)$.

  **Marcus:** No, you can't. Not if you're a unified theorist. Because you think conditionals have truth conditions. You think they express propositions. And if they express propositions, Lewis's Triviality Results bury you.

  **Elena:** *Sighs.* Here we go.

  **Marcus:** It's not just a nuisance, Elena. Lewis proved that if the probability of the conditional equals the conditional probability for *all* probability functions, then the conditional is trivial. It collapses into the consequent. Basically, there are no such propositions. If you insist indicatives are truth-apt, you're committed to the existence of "conditional propositions" that logic says cannot exist.

  **Elena:** Okay, let's actually engage with the proof, because this is where people usually wave their hands. Lewis's proof assumes that the proposition expressed by $A \to C$ is *fixed* independently of the probability function. It assumes that as we update our credences, the *content* of the conditional stays the same, and we just check if its probability tracks $P(C|A)$.

  **Marcus:** And?

  **Elena:** But on my view, the content *isn't* fixed independently of the context. And the context is determined by the presuppositions, which are intimately tied to the agents' epistemic states. When you update your credence on $A$, you shift the context set. When the context set shifts, the selection function picks a *different* closest world. So the proposition expressed by the indicative conditional changes as the probability function changes.

  **Marcus:** You're saying the proposition is context-dependent in a way that violates the assumptions of the triviality proof.

  **Elena:** Exactly. Lewis quantifies over all probability functions assuming a constant proposition $X$ such that $P(X) = P(C|A)$. But if the proposition $X$ itself shifts when $P$ shifts, the quantification fails. The Equation holds, but not because there's a stable "conditional fact" out there. It holds because the semantic value of the indicative is sensitive to the very epistemic state that generates the probability.

  **Marcus:** That's a clever dodge. But it comes at a cost. If the proposition shifts with the context, then indicatives aren't really reporting on the world; they're reporting on the context. Which sounds suspiciously like... they aren't truth-apt in the robust sense. It sounds like you're converging on my view.

  **Elena:** I'm not. I still maintain they have truth conditions. In a specific context, with a fixed context set, "If Oswald didn't, someone else did" is either true or false. It's true if in the closest world within our context set where Oswald doesn't shoot, someone else does.

  **Marcus:** But consider embedding. This is where Edgington really presses the attack. Truth-apt sentences play nice with logical operators. I can say, "It is not the case that if Oswald didn't kill Kennedy, he acted alone." That's a negation. But with indicatives, negation is incredibly awkward. We usually say, "If Oswald didn't kill Kennedy, he *didn't* act alone," rather than negating the whole conditional.

  **Elena:** Pragmatic awkwardness isn't semantic impossibility.

  **Marcus:** It's not just awkwardness. Try disjunction. "Either if Oswald didn't kill Kennedy, Ruby did, or if Oswald did, he acted alone." It's gibberish. But counterfactuals embed fine. "Either if Oswald hadn't killed Kennedy, the CIA would have, or if he had, they wouldn't." That's clunky but intelligible. Why would one semantics allow embedding and the other block it if they're the same animal?

  **Elena:** Because the context set restriction interacts with embedding. When you embed an indicative under 'or' or 'not', you're trying to evaluate it outside the current context set. But the indicative *requires* the antecedent to be compatible with the context set to be felicitous. If you negate it, you're often signaling that the antecedent *isn't* compatible, which triggers a shift to counterfactual morphology. It's a pragmatic block, not a semantic one.

  **Marcus:** You're doing a lot of heavy lifting with "pragmatics," Elena. Every time the semantics predicts something counterintuitive, you push it to the pragmatics.

  **Elena:** And you're doing heavy lifting with "category mistakes." Every time the indicative acts like a proposition, you say it's just an inference ticket. Look, Marcus, your view has a cost too. If indicatives aren't truth-apt, how do we explain disagreement? If I say, "If it rains, the match will be cancelled," and you say, "No, that's not true," what are we disagreeing about?

  **Marcus:** We're disagreeing about the conditional probability. I'm saying $P(\text{Cancelled} | \text{Rain})$ is low. You're saying it's high.

  **Elena:** But we talk about them being *true*. "You were right, if it rained, the match was cancelled." We don't say, "Your conditional probability was accurate." We treat them as facts.

  **Marcus:** We treat lots of things as facts that aren't ontologically robust. Moral discourse, maybe. Look, let's return to Oswald. The counterfactual: "If Oswald hadn't killed Kennedy, someone else would have." On my view, that's a truth-apt claim about similarity of worlds. We look at the nearest worlds where Oswald doesn't shoot. Is there a conspiracy there? If yes, it's true.

  **Elena:** And on my view, it's the same mechanism. We just look at the nearest worlds where he doesn't shoot, but we don't restrict ourselves to the current context set because we're presupposing he *did* shoot.

  **Marcus:** But here's the rub. For the counterfactual, we can be wrong about the similarity relation. There's a fact of the matter about whether the CIA was ready. For the indicative, "If Oswald didn't, someone else did," there isn't a fact of the matter about the "closest world" in the same way. It's entirely driven by our evidence. If we find out Oswald acted alone, the indicative becomes infelicitous, not false.

  **Elena:** It becomes false relative to the old context, but we can't assert it in the new one.

  **Marcus:** See, that's the friction. If I discover Oswald acted alone, I don't say your indicative was *false*. I say you shouldn't have *asserted* it. That suggests the condition of assessment isn't truth, but assertability.

  **Elena:** But why does the logic of indicatives mirror the logic of counterfactuals so closely? Modus Ponens works for both. Hypothetical Syllogism fails for both. If they were fundamentally different animals—one probabilistic, one truth-conditional—why do they share the same logical inferential patterns?

  **Marcus:** Because rational reasoning constrains both. Even if one tracks probabilities and the other tracks worlds, the norms of reasoning might converge. But the Triviality Result is still the elephant in the room. You said you had a response to Lewis.

  **Elena:** My response is that Lewis assumes the proposition is independent of the credence. I deny that. But I'll concede this: it means the "proposition" expressed by an indicative is incredibly fragile. It's so context-dependent that it barely behaves like a proposition in communication.

  **Marcus:** Which is why Edgington says it's better to just admit they aren't propositions. You're clinging to truth conditions because you want a unified semantics, but you're defining "truth conditions" so thinly they're doing no work.

  **Elena:** And you're multiplying semantic types because you want to save truth conditions for counterfactuals, but you're left with indicatives floating in a non-truth-conditional void. Look, maybe the compromise is this: The selection function is the core semantics. But for indicatives, the "closeness" metric is purely epistemic, not metaphysical.

  **Marcus:** So epistemic closeness for indicatives, metaphysical similarity for counterfactuals?

  **Elena:** Yes. One selection function, two metrics.

  **Marcus:** That's still two semantics, Elena. You've just hidden the duality inside the selection function.

  **Elena:** *Laughs.* Touché. But at least I don't have to explain why "If A, C" and "A and C" have the same truth conditions when A is known to be true, which your probabilistic view struggles with.

  **Marcus:** I struggle with nothing! If $P(A) = 1$, then $P(C|A) = P(C)$. It follows perfectly.

  **Elena:** But it doesn't explain why we can't assert the indicative when we know A is false.

  **Marcus:** Because $P(C|A)$ is undefined or irrelevant when A is known false.

  **Elena:** See? We're both explaining the Oswald pair. We're just carving the joints differently. You carve between truth and probability. I carve between epistemic and metaphysical context.

  **Marcus:** I suppose the real question is: do we want a semantics that saves the intuitions about truth, or one that saves the intuitions about reasoning?

  **Elena:** I want the one that lets me keep Modus Ponens without exploding into triviality.

  **Marcus:** And I want the one that admits when we're just talking about our own uncertainty.

  **Elena:** *Raises coffee cup.* To Oswald, then. The only man who can be both guilty and not guilty depending on the mood of the conversation.

  **Marcus:** *Clinks cup.* And to Lewis, for making sure neither of us gets to sleep tonight.
