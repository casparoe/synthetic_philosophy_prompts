  **TA-to-TA Advice:**
  This is a great example of why we can't just scan for keywords like "ambiguous" and "facts." The student knows the *slogan* of Lewis's view but not the *substance* of his causal theory. If your course learning goals prioritize the logical paradox, this is an A-. If your goals prioritize the metaphysics of causation and time (affecting vs. changing), this is a B. I've graded it as a B because getting the "affect vs. change" distinction wrong fundamentally misrepresents Lewis's position on agency.
