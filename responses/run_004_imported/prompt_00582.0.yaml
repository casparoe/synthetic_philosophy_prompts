      *   *What's at stake?* Normativity (ought implies can), descriptive accuracy (modeling science/math discovery), and the coherence of the Dutch Book argument.
      *   *Why is it hard to fix?* If you loosen the axioms, you lose the nice math (representation theorems, updating rules). If you keep the axioms but restrict the domain, you lose generality.
