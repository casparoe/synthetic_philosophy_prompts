          *   *Physics:* Frictionless planes are approximations. The error is small and predictable.
          *   *Epistemology:* LO isn't a small error; it's a categorical failure. It says you *should* believe Fermat's Last Theorem before Wiles proved it. That's not just "off by a bit"; it's wrong about the nature of reasoning.
          *   *Normativity:* "Ought implies can." If rationality *requires* logical omniscience, then humans are inherently irrational. That makes the theory useless as a guide.

      *   **Point 2: The Problem of Learning (The Dynamic Aspect).**
