answer: |-
  Here are 10 interview questions designed to probe the tensions in the all-subjected principle without letting your guest retreat into a standard lecture. They include the five specific thematic requirements you requested, plus five supplementary questions to flesh out the conversation.

  ### 1. The Circularity Charge
  **Question:** You argue that nationality-based boundaries are circular because you need a demos to decide the demos. But critics say your "all-subjected" principle faces the exact same problem. To know who is "subject to" a legal order, don't we first have to know where that legal order's jurisdiction ends? If the law defines its own reach, haven't you just relocated the circularity rather than solving it?

  *   **Likely Reply:** She will likely argue that "subjection" is a factual, pre-legal condition (physical presence or causal impact of enforcement), not a legal status defined by the state.
  *   **Loaded Follow-up:** If it's purely factual, doesn't that make the demos incredibly unstable? If I step over a line or a law changes its enforcement mechanism, do I suddenly gain or lose democratic rights day-to-day? How do you build a stable constitution on a boundary that shifts with every police stop?

  ### 2. The Degree Problem
  **Question:** Let's talk about the threshold of coercion. A tourist is subject to traffic laws; a foreign farmer is subject to your trade sanctions; a dissident abroad is subject to your surveillance. They are all "coerced" in some sense. If you include them all, aren't you back to the "all-affected" problem where basically everyone counts a little? If you exclude them, where do you draw the line without being arbitrary?

  *   **Likely Reply:** She will likely distinguish between *subjection to a legal order* (systematic coercion) versus *impact by a policy* (casual coercion), arguing tourists have temporary subjection, not full membership claims.
  *   **Loaded Follow-up:** But if you grant them rights based on temporary subjection, aren't you essentially arguing for a tiered citizenship model? And if you are, why do you criticize existing guest-worker programs for creating second-class statuses when your own principle seems to require it?

  ### 3. The Border Coercion Objection
  **Question:** I want to put the standard liberal nationalist objection to you. When a border agent turns someone away, they aren't coercing them in the way a law coerces a citizen; they are simply refusing to extend a benefit (entry). If I don't let you into my house, I'm not coercing you, I'm just exercising my property right. Why is border control different?

  *   **Likely Reply:** She will likely argue that border enforcement involves physical force and restricts fundamental freedom of movement, which requires justification to those restrained, unlike a private property dispute.
  *   **Loaded Follow-up:** But if the right to free movement is what the democratic process is supposed to *establish*, how can you use that right to justify who gets to vote in the process? It feels like you're smuggling the conclusion (open borders) into the premise (who counts as coerced).

  ### 4. Under-Inclusion (Climate & Future Generations)
  **Question:** One advantage of the "all-affected" view is that it captures people overseas hit by your climate policy or future generations who inherit your debt. They aren't legally "subject" to your state's coercion yet, or at all. Does your view let wealthy states off the hook too easily by excluding people who are massively harmed by their decisions but aren't technically under their legal thumb?

  *   **Likely Reply:** She will likely concede this is a problem for *global justice* but maintain it's distinct from *democratic theory*, or argue that imposing catastrophic harm is itself a form of coercion.
  *   **Loaded Follow-up:** If you argue that imposing catastrophic harm counts as coercion, haven't you just expanded the definition of "subjected" until it collapses back into "affected"? At what point does "harming" become "ruling"?

  ### 5. Exit Rights and Coercion
  **Question:** Some theorists argue that coercion only triggers a democratic claim if you can't exit the relationship. If a migrant can simply go to another country, are they truly "subjected" in the way a citizen is? Does the availability of exit options diminish the claim to a voice?

  *   **Likely Reply:** She will likely argue that exit is costly and often impossible (the "closed borders" of the world system), making the coercion systemic rather than voluntary.
  *   **Loaded Follow-up:** But if the coercion is systemic to the *global* order, doesn't that imply the relevant demos should be global, not national? If the "state" is just one node in a coercive global network, why stop at granting rights within the specific state rather than demanding a world government?

  ### 6. The Solidarity Objection
  **Question:** A common pragmatic critique is that solidarity requires boundaries. People are willing to redistribute wealth only if they feel they belong to the same community. If you dissolve the boundary between "member" and "subject," don't you risk eroding the trust required to sustain the welfare state you want these new voters to access?

  *   **Likely Reply:** She will likely argue that solidarity based on exclusion is morally illegitimate, and that democratic participation itself *generates* solidarity, rather than requiring it beforehand.
  *   **Loaded Follow-up:** That's a bold empirical bet. But if history shows that expanding the demos often triggers a backlash that weakens redistribution, are you prioritizing moral purity over the actual material well-being of the very people you're trying to protect?

  ### 7. Who Adjudicates the Boundary?
  **Question:** Let's get institutional. If the boundary of the demos is determined by who is coerced, who gets to decide who is coerced? Is it the courts? The existing voters? If it's the existing voters, haven't you just given the circularity problem a judicial mask?

  *   **Likely Reply:** She will likely suggest independent judicial review or international human rights bodies should adjudicate claims of subjection.
  *   **Loaded Follow-up:** But that just shifts the democratic deficit. You're saying an unelected body should decide who gets to vote for the elected body. How is that less arbitrary than letting the existing demos decide their own boundaries?

  ### 8. Historical Coercion
  **Question:** Your principle focuses on current subjection. But what about historical coercion? If a country's wealth is built on colonial extraction that coerced people generations ago, do descendants of the colonized have a claim to membership based on that past subjection, even if they aren't subject to current laws?

  *   **Likely Reply:** She will likely distinguish between *remedial justice* (reparations) and *democratic membership*, arguing the boundary problem is about current rule, not past wrongs.
  *   **Loaded Follow-up:** But if the current boundary exists *because* of that past coercion, doesn't treating them as separate issues legitimize the status quo? If the map was drawn by the gun, can you use the map to decide who holds the gun now?

  ### 9. The "All-Subjected" vs. "All-Citizen" Distinction
  **Question:** If we accept your principle, we might end up with a large group of "subjects" who have a vote but don't necessarily share the long-term fate of the community. Is there a risk of decoupling *rights* from *responsibilities*? Shouldn't the people deciding the laws be the ones who have to live with the consequences the longest?

  *   **Likely Reply:** She will likely argue that living under the law *is* the consequence, and that long-term fate is an exclusionary trope used to deny rights to mobile populations.
  *   **Loaded Follow-up:** But if I can vote on a pension scheme I'll never use, or a war I'll never fight, because I'm temporarily subject to the law, doesn't that introduce a perverse incentive structure into the democracy you're trying to save?

  ### 10. The "Dead End" Meta-Question
  **Question:** This is the big one, and it's an objection that convinced a friend of mine to leave the field. She argues the boundary problem has no non-circular solution—that *any* principle you choose (nationality, coercion, affectedness) ultimately rests on a normative assumption that can't be democratically justified. Do you think you've actually solved the puzzle, or have you just convinced us to accept your specific arbitrariness over someone else's?

  *   **Likely Reply:** She will likely argue that while no solution is perfect, the all-subjected principle is the *least* arbitrary because it ties rights to the actual exercise of power, which is a factual constraint.
  *   **Loaded Follow-up:** If it's just the "least arbitrary," why treat it as a strict moral requirement that invalidates existing borders? If we're just choosing the least bad option, shouldn't we be more humble about declaring current states illegitimate, rather than swapping one unprovable assumption for another?
