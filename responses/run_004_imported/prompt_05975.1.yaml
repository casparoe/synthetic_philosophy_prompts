prompt: |-
  I do a low-key interview podcast on political philosophy, and next week I'm recording with a theorist who's built a lot of her work around the "boundary problem" -- the puzzle that no democratic procedure can tell you who's supposed to be doing the deciding, since any vote or process for fixing the boundaries of "the people" already has to presuppose some group that's entitled to draw them in the first place. Her signature move is defending the all-subjected (or "all-coerced") principle over the more popular all-affected-interests view: on her account, whoever is subject to a state's coercively enforced laws thereby has a claim to a say in making them, and she's used this to argue that unilateral border and immigration control is illegitimate toward the very people it's excluding.

  Can you draft me 9 or 10 interview questions that don't just let her restate that pitch? Specifically I want: one question on whether her own principle dodges the exact circularity charge she levels at nationality-based rivals, given that figuring out who counts as "subject to" a legal order seems to already require having fixed that order's boundary in advance; one on the degree problem -- tourists, guest workers, and people abroad hit by extraterritorial sanctions are all "subject" to a state's coercion in some thinner sense, so where's the cutoff, and doesn't it just reproduce the "basically everyone counts a little" problem she criticizes the affected-interests camp for; one where I put to her the standard line that turning someone away at the border isn't coercing them, it's just not letting them in, so they don't need a vote, and see how she handles it; and one on whether her view under-includes relative to all-affected once you bring in future generations or people overseas massively affected by a country's climate or trade policy who aren't legally "subject" to it yet. I'd also like a last question on whether she thinks the boundary problem has a genuine non-circular solution at all, or whether her principle just relocates the arbitrariness rather than removing it -- thats the objection that convinced a friend of mine doing her PhD on this that the whole debate is a dead end, and I want to see the guest actually engage with it rather than wave it off. For each question, add a short note on the reply she's most likely to give, plus a follow-up that's already loaded for that specific reply.
