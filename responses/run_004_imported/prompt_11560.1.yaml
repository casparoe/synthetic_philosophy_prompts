answer: |-
  This is one of the sharpest questions you can ask in a graduate metaphysics seminar. You have correctly identified the pivot point where the Argument from Vagueness (most famously championed by David Lewis and Theodore Sider) does the heaviest lifting.

  You are right to be suspicious. The move from "vagueness in composition" to "vagueness in existence" is not a logical triviality; it relies on substantial metaphysical commitments.

  Here is the breakdown of why the argument makes that move, why vague existence is considered "toxic," and an honest assessment of whether it's just a brute intuition pump.

  ### 1. Why "Vague Composition" just *is* "Vague Existence"

  Your specific question is: *Why can't you say it's indeterminate whether the $xs$ compose a $y$ while still holding that whatever does exist, determinately exists?*

  The short answer is that in the context of the Special Composition Question (SCQ), **to compose is to exist.**

  When we ask, "Do these atoms compose a table?", we are asking the following quantified question:
  $$ \exists y (\text{the } xs \text{ are parts of } y) $$

  If the answer to this question is indeterminate (neither true nor false, or true on some precisifications and false on others), then the truth value of the existential quantifier ($\exists$) itself is indeterminate.

  If you try to hold the line and say, "Well, whatever *does* exist, exists determinately," you run into the problem of **borderline objects**. In a Sorites series regarding composition (e.g., atoms gradually coming together), the Argument from Vagueness posits a scenario where it is not merely *unknown* whether an object exists, but **ontically indeterminate** whether an object exists.

  If there is a borderline case of composition, there is a borderline case of an object. Let's call the potential object $O$.
  *   If $O$ exists determinately, composition happened determinately.
  *   If $O$ does not exist determinately, composition didn't happen determinately.
  *   If it is vague whether $O$ exists, then **existence itself is a vague property of $O$.**

  You cannot have a "vague fact of composition" without a "vague fact of existence" because the fact of composition *is* the fact of the existence of the whole.

  ### 2. Why is Vague Existence considered "Toxic"?

  So, why is vague existence considered a *reductio ad absurdum*, whereas vague baldness is fine? Lewis and Sider offer three main "gut-level" (but theoretically loaded) reasons.

  #### A. The Semantic Conception of Vagueness (Lewis's View)
  Lewis argues that vagueness is fundamentally **semantic**, not ontological. Vagueness is a feature of our representations (language, concepts), not the world.
  *   **Baldness:** The word "bald" is vague. The distribution of hair on a head is precise. There is a precise number of hairs; we just haven't drawn a line in the definition.
  *   **Existence:** Existence is not a property like baldness. It is the precondition for having properties. If existence is vague, the *world itself* is fuzzy. For Lewis, this is a category mistake. The world is precise; our map is fuzzy. To say existence is vague is to say the territory is fuzzy.

  #### B. The Counting Argument (Cardinality)
  This is often the most intuitive gut-punch. If existence is vague, then **how many objects exist** is vague.
  *   Imagine a world with three atoms.
  *   If composition is restricted but vague, it might be indeterminate whether those three atoms compose a fourth object (the sum).
  *   Therefore, it is indeterminate whether there are **3 objects** or **4 objects** in the universe.
  *   To many metaphysicians, this sounds nonsensical. Cardinality seems like a precise mathematical notion. How can the universe fail to have a determinate number of things in it?

  #### C. The Precision of Logic (Sider's View)
  Theodore Sider pushes this further. He argues that the existential quantifier ($\exists$) is a logical constant. Logic is supposed to be precise.
  *   If $\exists$ is vague, then the laws of logic (like $\forall x (x=x)$) become shaky in borderline cases.
  *   Sider argues that for logic to do its job of "carving reality at the joints," the quantifier must be precise. If the quantifier is vague, we aren't really describing reality; we're just describing our vague conceptual scheme.

  ### 3. Is it just a Brute Intuition Pump?

  **Yes. And no.**

  It is an intuition pump, but it's one that is load-bearing for **Classical Metaphysics**.

  **The "Yes":**
  There is no logical contradiction in vague existence. It is not like saying "a round square." Philosophers like **Elizabeth Barnes** and **Robert Williams** have argued extensively that ontic vagueness (vagueness in the world) is perfectly coherent.
  *   They argue that the "Counting Argument" fails because in a world with vague existence, the question "How many objects are there?" simply doesn't have a classical true/false answer, and that's okay.
  *   They argue that Lewis's semantic view is just one theory of vagueness, not a proven fact.

  So, if you find yourself thinking, "I don't see why the universe can't be fuzzy," you are in good company. The rejection of vague existence is not a logical truth; it is a theoretical virtue preference. We *prefer* precise ontologies because they make logic and counting easier.

  **The "No":**
  However, accepting vague existence comes with a massive tax. If you allow vague existence, you have to rewrite standard logic (perhaps moving to supervaluationism or degree theory for quantifiers) and explain how identity works (the Evans-Salmon argument suggests vague existence leads to vague identity, which leads to contradiction).

  So, when the TA or professor says "Vague existence is impossible," what they really mean is:
  > "Vague existence is incompatible with **classical logic** and **classical model theory**, which we are assuming for the sake of this seminar."

  ### Summary for your Seminar

  If you want to sound like you've got a handle on it, here is the synthesis:

  1.  **The Link:** You can't separate vague composition from vague existence because composition claims are existential claims ($\exists y$). If the composition is indeterminate, the existence of $y$ is indeterminate.
  2.  **The Problem:** Vague existence is rejected because it violates the **Semantic Conception of Vagueness** (Lewis: the world isn't fuzzy) and creates **Indeterminate Cardinality** (it becomes vague how many things exist).
  3.  **The Verdict:** It is indeed a brute intuition pump for **Classical Metaphysics**. It assumes that logic and quantification must be precise. If you reject that assumption (like Barnes or Williams), the Argument from Vagueness loses its force. But within the standard Van Inwagen/Lewis/Sider framework, vague existence is treated as a *reductio* because it breaks the tools (logic/counting) we use to do metaphysics.

  **One tip:** If you want to impress the TA, ask this: *"Does the Argument from Vagueness rule out ontic vagueness entirely, or does it just rule out vague existence specifically? Could we have vague properties without vague objects?"* (That shows you see the specific weight the argument places on the quantifier).
