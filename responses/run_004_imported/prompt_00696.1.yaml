      *   **The Tension:** Schopenhauer claims Ideas are timeless, spaceless, and beyond the *principium individuationis* (principle of individuation). Music, however, is inherently temporal (unfolds in time) and rule-bound (arithmetic/formal). How can something so bound by time and form be a *more* direct copy of the Will than the timeless Ideas? It seems like music should be *lower* on the hierarchy (closer to phenomenal representation), not higher.
      *   **Bonus Question:** Does the bass/inorganic nature analogy carry philosophical weight (overtones/ontology) or is it just metaphorical (low pitch = low being)?
