answer: |-
  The philosophical confrontation between Galen Strawson's "Basic Argument" and P. F. Strawson's "Freedom and Resentment" represents one of the most poignant dialectics in contemporary moral philosophy, not merely for its theoretical stakes but for its familial lineage. The son argues that ultimate moral responsibility is metaphysically impossible; the father argues that moral responsibility is a naturalistic fact of human interpersonal life that requires no metaphysical grounding. While it is tempting to conclude that the two Strawsons are talking past one another—that Galen is doing metaphysics while P. F. is doing anthropology or phenomenology—thisconciliation is too easy. It grants P. F. Strawson a victory by default, allowing him to define responsibility in a way that insulates it from Galen's critique.

  I contend that **Galen Strawson's Basic Argument undercuts P. F. Strawson's naturalistic strategy from within.** P. F. Strawson attempts to defuse the skeptic by claiming that reactive attitudes (resentment, indignation, guilt) do not rely on the metaphysical picture of "self-origination" that Galen dismantles. However, this defense fails because the *normative force* of these reactive attitudes implicitly presupposes the very capacity for ultimate responsibility that the Basic Argument proves impossible. P. F. Strawson successfully explains why we *do* hold one another responsible, but Galen Strawson demonstrates that we are not *justified* in doing so. Consequently, the elder Strawson's naturalism collapses into an error theory: it describes a pervasive human practice while silently admitting that the practice's core claim to fairness is illusory.

  ### The Basic Argument and the Impossibility of *Causa Sui*

  To understand why Galen's argument penetrates P. F.'s defense, we must first clarify the scope of the Basic Argument. It is crucial to note that Galen Strawson is not arguing from determinism. His argument holds even if indeterminism is true. The argument rests on the structure of agency itself. To be morally responsible for an action $X$, one must be responsible for the mental state or character $M$ that produced $X$. But to be responsible for $M$, one must have performed some prior action $Y$ to shape $M$. However, $Y$ itself must have stemmed from some prior mental state $M-1$.

  This generates a regress. To be truly, ultimately responsible for oneself, one would need to be *causa sui* (cause of oneself). One would have to choose one's own nature without being determined by a prior nature. Galen argues this is conceptually impossible: "You cannot create yourself from nothing." Any choice you make to change your character is itself the product of the character you already have. Thus, ultimate moral responsibility (UMR) is impossible. If moral responsibility requires UMR, then moral responsibility is impossible.

  ### P. F. Strawson's Naturalistic Strategy

  P. F. Strawson's "Freedom and Resentment" is a direct response to the pessimist who claims determinism (or, in Galen's case, the structure of agency) negates responsibility. P. F. Strawson shifts the ground from metaphysics to practice. He argues that "reactive attitudes" are not theoretical conclusions derived from a belief in free will; they are "given" features of human life, constitutive of our interpersonal relationships. We do not decide to feel resentment when struck; we simply do.

  Crucially, P. F. Strawson argues that the skeptic demands an "external justification" for these attitudes—a metaphysical license that neither can nor needs to be provided. He distinguishes between "exempting conditions" (where we suspend reactive attitudes due to insanity, infancy, or coercion) and the "general truth of determinism." He claims determinism does not warrant a global shift to the "objective attitude" (treating people as objects to be managed). For P. F. Strawson, responsibility just *is* the susceptibility to reactive attitudes within the human community. To ask if we are "really" responsible beyond this is to ask a question that has no purchase on our actual lives.

  ### The Conflict: Does Naturalism Defuse the Regress?

  The central question is whether P. F. Strawson's redefinition of responsibility successfully bypasses Galen's regress. P. F. Strawson assumes it does. He believes the skeptic is obsessed with a "mythical" requirement of total self-creation. By grounding responsibility in the natural fact of our emotional engagements, he thinks he renders the metaphysical requirement obsolete.

  However, this strategy only works if the reactive attitudes are merely psychological reflexes, devoid of cognitive claims about the world. If resentment were like a sneeze—a mere causal reaction to a stimulus—then Galen's argument would indeed be irrelevant. A sneeze doesn't need to be "fair." But reactive attitudes are not mere reflexes; they are **normative judgments**. When I feel moral resentment toward you, I am not just experiencing pain; I am judging that you *ought not* to have done what you did, and that you are an appropriate target of blame because you *could have done otherwise*.

  This is where Galen's Basic Argument strikes. Galen shows that the "could have done otherwise" required to make blame *fair* (rather than just useful) is the "could have done otherwise" of ultimate self-origination. If I blame you, I imply that the source of the action was ultimately *you*, in a way that makes the praise or blame stick to your essence. But Galen demonstrates that the source of the action is always traceable to factors (genetic, environmental, prior character) for which you are not responsible.

  Therefore, P. F. Strawson's naturalism does not defuse the Basic Argument; it merely hides the metaphysical commitment. The reactive attitudes *carry* the commitment to UMR within their intentional content. To feel genuine moral indignation is to presume the agent is an ultimate source. If Galen is right that no one is an ultimate source, then every instance of genuine moral indignation involves a false presupposition.

  ### The Strongest Defense of P. F. Strawson

  The strongest counter-argument on behalf of the elder Strawson is that this critique misunderstands the nature of his naturalism. P. F. Strawson might argue that demanding the reactive attitudes be "metaphysically accurate" is a category mistake. The justification for holding someone responsible is not that they are a *causa sui*, but that doing so is necessary for meaningful human relationships. We cannot abandon reactive attitudes without ceasing to be human as we know it. Therefore, the "truth" of responsibility is not a metaphysical fact about agents, but a pragmatic fact about communities. If the practice is indispensable, the question of its "ultimate" justification is empty.

  On this view, Galen Strawson is like a skeptic asking, "How do you know the external world exists?" while kicking a stone. P. F. Strawson's reply is: "The practice of kicking stones and navigating the world is prior to the philosophical doubt." Similarly, the practice of blaming is prior to the metaphysical doubt about *causa sui*.

  ### Why the Defense Fails: Normativity Cannot Be Decoupled from Metaphysics

  While this pragmatic defense is powerful, it ultimately fails to protect the *moral* dimension of responsibility, which is the very thing at stake. P. F. Strawson conflates the **inevitability** of a practice with its **legitimacy**.

  Even if we grant that we cannot help but feel resentment, it does not follow that acting on that resentment (through blame, punishment, or moral condemnation) is just. Consider a historical analogy: Suppose it were a "natural fact" of a certain society that they felt intense revulsion toward left-handed people, and that this revulsion was constitutive of their social order. A naturalist might argue, "This practice is given; it requires no external license." But we would rightly object that the practice is unjust because it is based on a false premise (that left-handedness is morally corrupt).

  Galen Strawson's argument functions similarly. He shows that the premise required to make blame *fair*—that the agent is the ultimate author of their character—is false. P. F. Strawson responds by saying, "We can't stop blaming." But the Hard Incompatibilist (following Galen) replies: "You can stop claiming your blame is *just*."

  If the Basic Argument is sound, then the reactive attitudes are systematically erroneous. They present the agent as something they are not: an unmoved mover. P. F. Strawson's strategy saves the *psychology* of blame but sacrifices its *normativity*. He offers us a world where we continue to punish and resent, but he must admit that this punishment is not fundamentally deserved in the way our moral intuitions demand. It is merely a tool for social regulation disguised as moral justice.

  This is a pyrrhic victory for P. F. Strawson. The whole point of "Freedom and Resentment" was to save moral responsibility from the skeptic, to show that we are justified in our practices. But if Galen is right, P. F. Strawson has only shown that we are *stuck* with our practices, not that they are *right*. He has transformed a defense of moral responsibility into an error theory of moral emotions. He explains why we blame, but he concedes (implicitly) that we are wrong to think the blame is ultimately merited.

  ### Conclusion

  The two Strawsons are not talking past one another; they are engaged in a battle over the soul of moral responsibility. Galen Strawson targets the metaphysical precondition required for blame to be fair. P. F. Strawson attempts to bypass this precondition by grounding blame in human nature.

  I maintain that **the Basic Argument undercuts the naturalistic strategy.** P. F. Strawson's attempt to insulate reactive attitudes from metaphysical scrutiny fails because those attitudes inherently make metaphysical claims. Resentment claims the agent could have done otherwise in a robust, ultimate sense. Galen proves this is impossible. Therefore, P. F. Strawson's naturalism cannot vindicate moral responsibility; it can only explain its persistence. It leaves us with a practice of blame that is psychologically inevitable but metaphysically unjustified. In a seminar on moral responsibility, where the question is ultimately about what we *ought* to do and how we *ought* to treat one another, a justification that admits the core presupposition of the practice is impossible is no justification at all. Galen Strawson wins because he shows that the father's naturalism, while descriptively accurate, is normatively bankrupt.
