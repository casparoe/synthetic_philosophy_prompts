answer: |-
  Your student has made an exceptionally astute observation, one that cuts to the heart of why applying Aquinas's *Summa* directly to modern secular dilemmas (like the trolley problem) often requires significant hermeneutical lifting. You are right to feel that the standard textbook reading smooths over a genuine structural tension in the text.

  To answer your primary question directly: **Yes, there are two distinct moral arguments at work in this article.** They operate on different premises, apply to different classes of agents, and rely on different justifications for the use of lethal force. The article is not a monolithic exposition of a single "Doctrine of Double Effect" (DDE); rather, it is a hybrid text that marries a natural-law account of individual self-preservation with a juridical account of public authority.

  Here is a breakdown of the two strategies, their relation, and the implications for your seminar.

  ### 1. The Two Distinct Arguments

  **Argument A: The Private Individual (Natural Law + DDE)**
  *   **Agent:** A private citizen (*privatus*).
  *   **Constraint:** It is intrinsically unlawful for a private individual to *intend* to kill another human being ("it is not lawful for a man to intend killing a man in self-defense").
  *   **Justification:** The act is justified *only* via the distinction between intention and foresight. The moral species of the act is determined by the intention (saving one's own life). The death of the aggressor is *praeter intentionem* (beside the intention).
  *   **Logic:** This is the source of the modern DDE. It treats the killing as a tragic side-effect that is tolerated only because the agent's will is oriented toward the good of self-preservation.

  **Argument B: The Public Authority (Juridical + Teleological)**
  *   **Agent:** A soldier or officer of the judge (*habens auctoritatem publicam*).
  *   **Constraint:** They are *not* bound by the prohibition on intending to kill.
  *   **Justification:** They may licitly *intend* the killing of the aggressor ("who while intending to kill a man in self-defense...").
  *   **Logic:** The justification here is not that the death is unintended, but that the intention is *redirected*. The killing is intended, but it is "referred to the public good." The moral species of the act is not "killing" simpliciter, but "administering justice" or "defending the commonwealth." The authority acts as an instrument of the community's right to self-preservation, which exceeds the individual's right.

  ### 2. The Relation Between the Strategies

  The "join" your student detected is the transition from the natural right of self-preservation to the political right of public order. Aquinas is not presenting two versions of the same principle; he is presenting two different solutions to the same problem (lethal violence) based on the status of the agent.

  *   **For the Private Citizen:** The DDE is a **loophole**. In Aquinas's political theology, lethal force is properly the prerogative of the state. The private citizen is generally forbidden from killing. The "two effects" reasoning is a concession to human weakness and the instinct for self-preservation, allowing the private citizen to act *as if* they were defending the common good (by preserving a part of it, themselves) without usurping the judicial power to intend death.
  *   **For the Public Agent:** The DDE is **unnecessary**. Because they act *ex officio*, their intention to kill is not "private animosity" but an act of charity toward the common good (and even, in Aquinas's view, potentially for the spiritual good of the community by removing a source of sin).

  Therefore, the "public good" language should **not** be read as continuous with the double-effect apparatus in the sense of absorbing the killing into a licit object of intention for *everyone*. It is a specific exemption for a specific class. If you try to read the public authority case through the strict DDE lens (i.e., "the soldier doesn't *really* intend death, he intends peace"), you contradict Aquinas's explicit text: "while intending to kill... refer this to the public good." He grants them the license to intend what the private citizen must merely foresee.

  ### 3. The Proportionality Requirement

  You asked whether the proportionality requirement ("if a man... uses more than necessary violence, it will be unlawful") constrains the public case as well.

  **Yes, but the metric changes.**
  *   **In the Private Case:** Proportionality is measured against **self-preservation**. "Moderation" means using only the force necessary to stop the threat to one's life. If I shoot an unarmed aggressor, I have violated proportionality because the act is "out of proportion to the end" (saving my life).
  *   **In the Public Case:** Proportionality is measured against the **common good**. A soldier or police officer must still use necessary force, but "necessity" is defined by the requirements of public safety and justice, not merely the officer's personal survival. A soldier may intend to kill an enemy combatant even if that combatant poses no immediate threat to the soldier's personal life, provided the killing is necessary for the victory/peace of the community.

  In the text, the proportionality clause appears in the first half (the private argument). However, Aquinas implies in the second half that public agents "sin if they be moved by private animosity." This suggests a parallel constraint: for the public agent, disproportionate violence is evidence that they have reverted to private intent rather than public service.

  ### 4. Implications for the "Origin of DDE" Narrative

  This is the most critical point for your seminar. If Aquinas's article contains two distinct arguments, what weight can we put on it as the origin of the *general-purpose* DDE used in trolley literature?

  **The Historical Shift:**
  Modern secular ethics (via Foot, Thomson, etc.) has universalized **Argument A** and discarded **Argument B**.
  *   **Aquinas:** Private citizens cannot intend death; Public authorities can.
  *   **Modern DDE:** *No one* may intend death (as an end or means); everyone may only foresee it.

  The trolley problem literature treats the DDE as a universal constraint on human agency. Aquinas treats it as a specific restriction on *private* agency within a hierarchical political order. When Foot and Thomson apply DDE to a bystander at the switch, they are treating the bystander as an Aquinian *private citizen* (who must not intend death) but stripping away the Aquinian *public authority* option (there is no "judge" in the trolley case who can licitly intend the death of the one to save the five).

  **Pedagogical Suggestion:**
  You can frame the seminar around this "seam."
  1.  **Textual Exegesis:** Acknowledge the student is correct. The article is bifurcated.
  2.  **The Political Theology:** Explain that for Aquinas, the "private" DDE is an exception to the rule that lethal force belongs to the state. The private citizen is allowed to save themselves only if they don't claim the power of life and death (intention).
  3.  **The Secular Transformation:** Show how modern philosophy takes the "private citizen" logic and makes it the *only* logic. We are all private citizens now; there is no public authority in the trolley case.
  4.  **The Cost:** Ask the students what is lost by this universalization. In Aquinas, the public authority can solve the problem by *intending* the lesser evil (killing the aggressor) for the sake of the good. In the modern trolley problem, we are all forbidden from intending the death of the one, even to save the five, because we lack the "public authority" to make that intention licit.

  ### Summary for Your Meeting

  *   **How many arguments?** Two. One for private agents (DDE), one for public agents (Juridical/Teleological).
  *   **Relation:** They are complementary solutions for different social statuses, not a single unified principle.
  *   **Proportionality:** Applies to both, but the "end" against which proportion is measured differs (individual life vs. common good).
  *   **Weight as Origin:** The text is the origin of the *mechanism* of double effect, but not the origin of its *universal application*. Using it as the foundation for the trolley problem requires ignoring the second half of Aquinas's answer, which grants a license to intend killing that the trolley bystander explicitly does not have.

  Your student has effectively identified that the "Doctrine of Double Effect" in ST II-II, Q. 64, Art. 7 is not a free-standing ethical principle, but a component of a broader political theology. Recognizing this will enrich your seminar's transition from Aquinas to Foot: the move isn't just from self-defense to trolleys, but from a hierarchical society where some can intend death to an egalitarian one where (arguably) no one can.
