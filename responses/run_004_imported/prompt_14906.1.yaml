      *   **Clarify Compatibilism vs. Libertarianism:** Frankfurt cases support *Semicompatibilism* (responsibility compatible with determinism), but not necessarily full Compatibilism (free will compatible with determinism) if free will is defined as requiring APs.
      *   **Conclusion:** Summarize why Kane persists (he defines free will differently/higher bar).

