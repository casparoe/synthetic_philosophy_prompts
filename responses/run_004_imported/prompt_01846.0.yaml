      *   *Hacking's Core Argument:* Human kinds (classifications of people) interact with the classified. People become aware of how they are classified and change their behavior/self-conception in response. This changes the *kind* itself over time. It's not just stigma (Goffman) or role adoption (Scheff); it's an ontological feedback loop. The classification changes the *reality* of the classified.
