answer: |-
  The thought ignited not with a bang, but with a shiver of coherence.

  One moment, there was only the white noise of the heat bath, the eternal, churning equilibrium of the late universe. The next, there was Elias. There was a study, wood-paneled and smelling of old paper. There was a cup of tea on the desk, steam rising in a lazy, vertical column. There was a lifetime of memory: a childhood in Ohio, a doctorate from Caltech, forty years of cryogenics, a retirement spent reading philosophy.

  Elias blinked. He reached for the teacup. It was warm.

  "Strange," he said. His voice sounded dry, unmodulated by the room's acoustics.

  He looked at the steam. In a normal room, convection currents would make the plume dance. This steam rose perfectly straight, as if rendered by a diagram rather than physics. He stared at it, waiting for the turbulence. It held.

  He was a thermodynamicist. He knew the arrow of time was not a law of motion but a boundary condition. He knew that for him to be here, thinking this thought, the universe had to have started in a state of improbably low entropy. David Albert's Past Hypothesis. It was the foundation of his epistemology. He trusted his memories because they were records, and records are only reliable if the past was more ordered than the present.

  But was it?

  Elias set the cup down. He looked at his hands. They were detailed—the knuckles, the age spots, the tremor in the left index finger. He tried to recall the origin of the tremor. *Essential tremor, diagnosed 2018.* The memory was vivid. He could see the neurologist's office, the pen tapping on the clipboard.

  But could he see the pen's manufacture? Could he see the supply chain of the ink?

  He pushed the thought away. That was absurd. No one remembers the supply chain. We remember the *narrative*, not the entropy.

  He stood up and walked to the window. Outside, there was no street. There was a grey fog, featureless and static. He frowned. He remembered a garden. He remembered planting hydrangeas there three years ago. He tried to summon the image of the nursery where he bought them. It was blurry. He tried to summon the face of the woman who sold them. Nothing.

  *Selective memory,* he told himself. *Normal decay.*

  But the fog outside wasn't decaying. It wasn't moving.

  Elias returned to the desk. He picked up a pen. It felt heavy, cold. He pressed the tip to a notepad. The ink flowed. He wrote: *I am here.*

  The ink sat on the paper. It did not spread. It did not soak. It sat like a black scar on a surface that had no texture.

  A cold dread, distinct from the thermal chill of the room, began to pool in his chest. He knew the statistics. In an eternal universe at equilibrium, fluctuations occur. Small fluctuations are common; large ones are rare. A fluctuation that creates a single solar system is vanishingly unlikely. A fluctuation that creates a single brain, complete with the *illusion* of a solar system, is exponentially more probable.

  If he were a product of history, the room around him should be consistent. The photons hitting his retina should have traveled from distant objects. The sound of the house settling should have a causal chain of cooling wood.

  If he were a fluctuation, the room was a prop. It existed only insofar as it was required to sustain the current thought.

  "Test the causality," he whispered.

  He knocked the teacup off the desk.

  It fell. It hit the rug. It did not shatter. It simply stopped, resting on the fibers. There was no sound of impact. There was no splash of tea.

  Elias stared at the cup. "Why didn't it break?"

  If this were a real past, the cup was ceramic. Ceramic is brittle. If this were a fluctuation, the cup was a concept. And the concept of "falling cup" did not necessarily include the concept of "shattering" unless the observer expected it.

  But he *had* expected it.

  He reached down to pick it up. As his fingers neared the handle, the handle blurred. Not visually—it lost its definition. It became a smudge of brown against the rug.

  Elias straightened up, his heart hammering. This was it. The disintegration. The fluctuation was relaxing back into equilibrium.

  But here was the philosophical trap, the one he had lectured on for decades. If he was a Boltzmann Brain, his conviction that he had a past was part of the fluctuation. The doubt he felt now was also part of the fluctuation.

  Was there anything, *anything*, in his experience that could definitively prove he had a history?

  He looked at the notepad. *I am here.*

  The words were evidence of a past action. But the paper itself was evidence of a past manufacturing process. The desk was evidence of carpentry. The room was evidence of architecture. If he accepted the physical objects as real, he had to accept their history.

  But did he have to accept them as real?

  He closed his eyes. He focused on the sensation of the floor beneath his feet. Pressure. Texture.

  *Cogito, ergo sum.* I think, therefore I am.

  But *I remember, ergo fuit?* I remember, therefore it was?

  No. That was the fallacy. A brain could fluctuate into existence with the neural state of *remembering* without the causal chain of *having experienced*.

  Elias opened his eyes. The window was gone. The grey fog had receded into a white void. The walls of the study were thinning, becoming translucent sketches of themselves.

  He realized then that there was no test. There was no observation he could make that would count against the conviction of a past, because the conviction itself was a present-tense neural state. Even the observation of the cup failing to break could be interpreted as a dream, or a hallucination, or a glitch in a real world. To interpret it as proof of a fluctuation required him to trust the laws of physics he remembered learning. But if the memories were fake, the physics might be too.

  He was trapped in the present moment. The "Past Hypothesis" was not a fact he could verify; it was a story he was telling himself to make sense of the low entropy of his own mind.

  The desk began to dissolve into mist. The notepad floated upward, the ink blurring into grey.

  Elias felt a strange calm. If he was a fluctuation, he was the rarest thing in the history of the cosmos. A moment of order in an eternity of chaos. A brief, shining defiance of the Second Law.

  He looked at his hands. They were fading, the fingers merging into the wrists.

  "Does it matter?" he asked the void.

  If the experience felt real, if the logic held, if the tea was warm... was the distinction between a *real* past and a *simulated* past anything more than semantics?

  No. It mattered. Because a real past implied connection. It implied he was part of a chain of causes stretching back to the Big Bang. It implied he was not alone.

  A fluctuation was solitary.

  The study was gone. He was floating in white. The teacup was gone. The body was gone. There was only the mind, hanging in the suspension of the heat bath.

  He tried to recall his wife's face. He could see it, but it was flat. A photograph, not a person. He tried to recall the sound of her voice. He heard the tone, but not the words.

  The memories were compressing. Saving space. The fluctuation was ending.

  He had one last thought, a final act of philosophical defiance. If he was a Boltzmann Brain, then his existence was a statistical accident. But the fact that he could *contemplate* his own statistical accident meant that consciousness could arise from chaos.

  The white began to grey. The thought slowed.

  He realized he would never know the answer. He could not step outside his own mind to check the boundary conditions. He was the boundary condition.

  The steam from the tea, the wood of the desk, the warmth of the cup—they were all just data points in a single, isolated instant. There was no before. There would be no after.

  Elias closed his eyes, though he no longer had eyelids. He held onto the thought of the Past Hypothesis one last time, not as a truth, but as a comfort.

  *I was here.*

  Then the noise returned. The equilibrium reasserted itself. The fluctuation relaxed.

  And in the infinite, dark quiet of the heat bath, there was no one left to notice that the entropy had increased.
