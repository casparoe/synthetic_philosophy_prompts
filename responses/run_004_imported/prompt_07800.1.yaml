answer: |-
  This is one of the richest intersections between analytic metaphysics and legal theory. You have hit on a debate that has raged since H.L.A. Hart and Tony Honoré wrote *Causation in the Law* (1959) and continues with people like Michael Moore, Victor Tadros, and Jonathan Schaffer today.

  Your intuition is correct: the law's distinction between misfeasance (acting) and nonfeasance (omitting) looks suspiciously like the metaphysical debate over whether omissions are "real" causes. However, concluding that the metaphysics *vindicates* the law requires navigating a few traps.

  Here is a breakdown of how the three metaphysical positions map onto the legal doctrine, and an assessment of how much weight the law should actually give them.

  ### 1. The Lewis View (Counterfactualism) & The Law
  **Metaphysics:** Causation is widespread. If $C$ hadn't happened, $E$ wouldn't have happened. Since the passerby didn't water the plant, and if they had, it wouldn't have died, the passerby is a cause.
  **Legal Doctrine:** The law generally rejects liability for the passerby (no duty to rescue).

  *   **Implication:** If Lewis is right, the law is **metaphysically accurate but pragmatically restrictive.**
      On the Lewis view, the passerby *is* a cause of the death. The law doesn't deny this causal link; rather, it uses the concept of **duty** as a filter *after* causation is established.
  *   **The Takeaway:** Lewis's view suggests that the legal distinction between act and omission is *not* a distinction about causation, but a distinction about **policy**. The law admits everyone is a cause (factual causation) but limits liability to those with a specific relationship to the victim (proximate causation/duty).
  *   **Does it vindicate the law?** No. It actually makes the law look like it is ignoring metaphysical reality for the sake of administrative convenience. If the passerby *did* cause the death, punishing only the gardener looks like arbitrary line-drawing, unless you admit that "legal causation" is just a placeholder for "people we want to punish."

  ### 2. The Beebee View (Causal Nihilism) & The Law
  **Metaphysics:** Omissions are not events; they are nothing. Nothing cannot cause something. The plant died because of the sun/heat/chemistry, not because of the *absence* of water.
  **Legal Doctrine:** No liability for nonfeasance (unless a duty exists).

  *   **Implication:** If Beebee is right, the law is **metaphysically confused.**
      Beebee's view seems to support the "no liability for omission" rule initially (since there is no cause, there is no liability). However, the law *does* punish omissions when a duty exists (e.g., a parent starving a child).
      If Beebee is right, the parent *did not cause* the child's death any more than the passerby did. Both are absences. Therefore, holding the parent liable for "causing death" is metaphysically false.
  *   **The Takeaway:** Beebee forces a hard choice. Either the law is wrong to punish omissions at all, or the law is using the word "cause" in a non-literal, metaphorical sense.
  *   **Does it vindicate the law?** It vindicates the *general rule* (no duty to rescue) but undermines the *exception* (duty-based liability). It suggests the law is treating "duty" as a magic wand that turns non-causes into causes, which is metaphysically suspicious.

  ### 3. The Norm-Based View (McGrath, Schaffer, etc.) & The Law
  **Metaphysics:** Omissions are causes, but only relative to a contextually salient norm or expectation. The gardener caused the death because she was *supposed* to water it; the passerby did not.
  **Legal Doctrine:** Liability for omission requires a pre-existing duty.

  *   **Implication:** This is the **perfect map.**
      This view aligns almost 1:1 with the legal doctrine. The "norm" in metaphysics corresponds to the "duty" in law. The metaphysical truth conditions for causation *include* the normative status of the agent.
  *   **The Takeaway:** This view suggests that causation itself is partly normative. It's not just about physics; it's about expectations.
  *   **Does it vindicate the law?** Superficially, yes. But it risks **circularity.**
      *   *Question:* Why did the gardener cause the death?
      *   *Answer:* Because she had a duty/norm to water it.
      *   *Question:* Why is she liable in tort?
      *   *Answer:* Because she had a duty to water it.
      If the metaphysical cause depends on the norm, and the legal liability depends on the norm, the metaphysics isn't doing any independent work. It's just mirroring the legal/moral conclusion.

  ### The Core Problem: The Is-Ought Gap
  The reason you feel unsettled is likely because you are sensing the **Is-Ought gap**.

  *   **Metaphysics** asks: *What is the structure of reality? What relations hold between events?*
  *   **Law** asks: *Who should bear the cost of this harm? Who should be punished to deter future harm?*

  Most modern legal philosophers (following Hart & Honoré) argue that "Legal Causation" is not a subset of "Metaphysical Causation." It is a distinct concept entirely.

  When a court asks, "Did the defendant cause the harm?" they are rarely asking a Lewisian counterfactual question. They are asking, "Is the harm within the scope of the risk created by the defendant?" or "Is it fair to attribute this result to the defendant?"

  ### So, how much weight should the metaphysics carry?

  Here is the critical pivot for your seminar discussion:

  **1. The Realist Position (e.g., Michael Moore):**
  Moore argues that the law *ought* to track metaphysical truth. If omissions aren't causes (Beebee), we shouldn't punish them as "causing death." We should find a different label. If the law punishes based on false metaphysics, it loses moral authority.
  *   *Weight:* High. Metaphysics constrains the law.

  **2. The Pragmatist/Instrumentalist Position:**
  The law is a tool for social engineering. "Causation" in law is a **control mechanism**. It doesn't matter if the passerby metaphysically caused the death (Lewis). What matters is that imposing a duty on every passerby would create paralyzing social costs and infringe on liberty.
  *   *Weight:* Low. Metaphysics is orthogonal. The law uses "causation" as a proxy for "responsibility," and responsibility is determined by policy, not physics.

  **3. The Hybrid Position (Norm-Based):**
  This suggests that our *concept* of causation is already infused with normative expectations. We don't perceive the world like physicists; we perceive it like agents. Therefore, the law isn't ignoring metaphysics; it is tracking *human* metaphysics (how humans actually perceive cause and effect).
  *   *Weight:* Medium. It explains why the law feels intuitive, but it admits that "causation" is context-dependent.

  ### Conclusion for your Seminar
  The metaphysical disagreement does not **vindicate** the legal doctrine in a strong sense, because the legal doctrine is primarily normative (about duty), while the metaphysical debate is descriptive (about events).

  *   If you side with **Lewis**, the law is pragmatically limiting liability despite universal causation.
  *   If you side with **Beebee**, the law is metaphysically confused when it punishes omissions.
  *   If you side with the **Norm-Based** view, the law and metaphysics are tautologically aligned, but the metaphysics loses its explanatory power.

  **The strongest argument to make:** The law's "duty" requirement is doing all the heavy lifting, regardless of which metaphysical view is true. The metaphysics of omission tells us how to describe the world, but the **politics of obligation** tells us who is liable. The law isn't trying to solve the profligacy problem; it's trying to solve the **liability** problem. Conflating the two assumes that "cause" means the same thing in a physics paper as it does in a criminal statute, which is likely a category mistake.

  **Suggested Reading to bolster this:**
  *   **H.L.A. Hart & Tony Honoré,** *Causation in the Law* (The classic argument that legal causation relies on "interventions" and "normal conditions," not just counterfactuals).
  *   **Michael Moore,** *Act and Crime* (Argues strongly that legal liability *must* track metaphysical causation).
  *   **Jonathan Schaffer,** "The Metaphysics of Causation" (For the norm-based/contrastive account).

  This tension is exactly why the seminar topic is so good: it reveals that "causation" might not be a natural kind, but a concept that shifts depending on whether you are a physicist, a metaphysician, or a judge.
