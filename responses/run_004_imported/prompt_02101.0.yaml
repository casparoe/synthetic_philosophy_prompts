      *   *First Sentence:* Evidence depends on the investigator's trustworthiness.
      *   *Second Sentence:* Ideally, you reach a point where the only criticism left is "the investigator is cheating."
      *   *Third Sentence (The kicker):* "But when he has nothing else left to allege he will allege that."
      *   *Interpretation:* Sidgwick is acknowledging a hard limit. Even if you control for every variable, a determined skeptic can *always* attack the character/integrity of the researcher rather than the data. He is warning his colleagues that no matter how good their science is, ad hominem attacks are the skeptic's final fallback.
      *   *Tone:* It's defensive but realistic. He's not admitting the field is bogus; he's admitting that *proof* is socially/psychologically limited, not just methodologically limited. He is indeed needling the skeptics for having an unfalsifiable move ("They are lying").

  3.  **Evaluate the Symmetry Argument (User vs. Friend):**
      *   *Friend's Claim:* Believers use "ad hoc hypotheses" to protect their belief (e.g., "skepticism blocks the energy"). This makes it unfalsifiable.
      *   *User's Claim:* Skeptics use "ad hoc hypotheses" too (e.g., "the researcher was duped").
      *   *Sidgwick's Support:* Sidgwick confirms skeptics *do* use this move.
      *   *Philosophical Analysis:* Is it truly symmetric?
          *   *Believer's Move:* Often involves changing the *phenomenon's* rules (e.g., "it only works when not observed"). This alters the claim itself.
          *   *Skeptic's Move:* Often involves attacking the *evidence's* source (e.g., "fraud"). This questions the data, not necessarily the laws of physics.
          *   *Falsifiability (Popper):* A claim is scientific if it can be proven false.
              *   Paranormal claim: "Telepathy exists." Test: Controlled experiment. Result: Null. Believer: "Conditions weren't right." -> *Unfalsifiable in practice.*
              *   Skeptical claim: "This specific result is fraud." Test: Investigate investigator. Result: No evidence of fraud. Skeptic: "They hid it well." -> *Also potentially unfalsifiable in practice.*
          *   *Burden of Proof:* The asymmetry lies here. The believer makes the positive claim. The skeptic maintains the null hypothesis. It is logically harder to prove a negative (no fraud ever) than to produce a positive signal.
          *   *Conclusion:* The user is right that *rhetorically* both sides can dig in. But *methodologically*, the burden of proof creates an asymmetry. Sidgwick acknowledges the rhetorical stalemate.

