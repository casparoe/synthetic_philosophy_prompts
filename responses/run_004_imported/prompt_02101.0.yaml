answer: |-
  This is a fantastic find. Quoting the first president of the Society for Psychical Research (SPR) in a debate about the epistemology of the paranormal is a serious power move. Sidgwick was a rigorous philosopher (not a gullible mystic), so his words carry weight.

  Here is the breakdown of what Sidgwick is actually saying, and whether your "gotcha" holds water against your friend.

  ### 1. What is Sidgwick saying in that last line?

  He is definitely **needling the skeptics**, not admitting defeat for his own side.

  To understand the quote, you have to look at the project Sidgwick was launching. The SPR was founded to apply scientific rigor to claims that science usually dismissed out of hand. Sidgwick knew that no matter how tightly they controlled their experiments, hardline materialists would never accept the results.

  *   **"We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick."**
      Sidgwick is saying: We can control for every variable. We can eliminate error, bias, and environmental factors. Ideally, we reach a point where the data is solid.
  *   **"But when he has nothing else left to allege he will allege that."**
      This is the punchline. He is pointing out that the skeptic has a "nuclear option." If the data is perfect, the skeptic can simply attack the *character* of the researcher. They can claim, "You must be lying or conspiring," and that claim is almost impossible to disprove definitively.

  Sidgwick is highlighting that **skepticism can become a dogmatic belief system just like paranormal belief.** He is arguing that the skeptic's position ("This is impossible, therefore you are lying") is itself unfalsifiable, because no amount of evidence can convince someone who has decided *a priori* that the phenomenon is impossible.

  ### 2. Does your "gotcha" hold up?

  **Yes, but with a major caveat.**

  You are correct that the situation is **rhetorically symmetric**. Both sides have an "unfalsifiable shield" they can hide behind when the evidence goes against them.

  *   **The Believer's Shield:** "The conditions weren't right." (e.g., "The skeptic's negative vibes blocked the telepathy.")
  *   **The Skeptic's Shield:** "The trick wasn't detected." (e.g., "The psychic hid the earpiece perfectly," or "The researcher is part of the con.")

  Sidgwick is validating your point: You can reach a state of empirical perfection, and the opposing side can still reject the conclusion by questioning the *source* rather than the *data*. In philosophy of science, this touches on the **Duhem-Quine thesis**, which suggests you can't test a hypothesis in isolation; you're always testing a whole web of assumptions (including the assumption that the observer is honest).

  **However, your friend is not entirely wrong.** The situation is not *perfectly* symmetric for two reasons:

  **A. The Burden of Proof**
  In science, the asymmetry lies in who has to prove what.
  *   The **Believer** is making a positive claim ("Telepathy exists"). To be scientific, they must produce a repeatable signal. If they say "it didn't work because of vibes," they are altering the claim to avoid falsification. This is what your friend means by "unfalsifiable."
  *   The **Skeptic** is maintaining the null hypothesis ("There is no evidence for telepathy"). If they say "that result was fraud," they are questioning the specific data point, not necessarily the laws of physics.
  *   *Why this matters:* It is logically harder to prove a negative (prove there was *no* trickery ever) than to produce a positive signal. So, while the skeptic *can* use an unfalsifiable move ("you're lying"), they are generally expected to provide a mechanism for the trick. The believer, conversely, often refuses to define the mechanism of the "vibes."

  **B. Predictive Power**
  *   **Skepticism** aligns with established physics. It predicts that if you tighten controls, the effect will disappear (which it usually does in paranormal testing).
  *   **Paranormal Claims** rarely generate new, testable predictions that hold up. If the excuse for failure is always "the energy was shy," the theory doesn't grow; it just survives.

  ### The Verdict

  You win the point on **dogmatism**. Sidgwick backs you up: Skeptics can absolutely dig in and refuse to accept evidence by alleging conspiracy or fraud, making their own position functionally unfalsifiable in the face of perfect data.

  Your friend wins the point on **methodology**. Historically, paranormal researchers have used the "vibes were off" excuse far more often than skeptics have used the "perfect fraud" excuse. Most paranormal claims fail to become scientific because the believers protect the claim from testing, whereas skeptics usually demand *more* testing (which Sidgwick was actually in favor of).

  **How to close the debate:**
  Tell your friend: *"Sidgwick proves that skepticism can be unfalsifiable too. If I produce perfect evidence, you can always just call me a liar and you can't prove you're wrong. So we both agree that **dogmatism** is the enemy, not just the paranormal. The difference is that science requires the claimant to overcome that skepticism, not the skeptic to disprove every possible lie."*

  That's a nuanced position that honors Sidgwick's warning while acknowledging the scientific method.
