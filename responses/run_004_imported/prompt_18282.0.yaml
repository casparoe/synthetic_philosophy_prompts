prompt: |-
  A friend and I stayed up far too late last week arguing about something that began as an offhand remark and turned into a genuine disagreement: what actually entitles someone to credit for an idea? She's an engineer in industry and I'm mid-PhD, and I suspect that difference is part of why our instincts pointed in opposite directions from the start. Her view was that whoever first frames a problem in a promising way — whoever says, in effect, "what if we tried X to get Y" — deserves the lion's share of credit for whatever follows, because that framing is what set the whole direction that made the result possible. Mine was that framing a problem is cheap next to solving it: until someone works out an actual, operative way to make X produce Y, all you have is a hope, and hopes don't get patented or credited on their own. We traded examples for two hours — hers mostly about mentors and collaborators who "saw it first," mine about the specific, hard-won technical fixes that make an idea actually work — and neither of us budged.

  The argument stopped being academic a few days later, because I sit on my university's intellectual property committee, and this week we have to resolve almost exactly this dispute for real. A doctoral student in one of our biomedical engineering labs has filed an invention disclosure, naming herself as sole inventor, for a dissolvable microneedle patch that releases insulin at a controlled rate as it degrades. Her faculty supervisor has objected in writing: applying microneedle arrays to diabetes management was his idea, he secured the funding, and he proposed the initial polymer family at a lab meeting months before she built anything. As a matter of long-standing practice in his lab, moreover, he expects to be named on every patent that comes out of it. The student's response is that microneedle drug-delivery patches were already well known before her project began, so "try this for diabetes" was not itself an inventive act. What actually makes the device work, and what she takes to be the real novel contribution, is the specific polymer blend and fabrication sequence she worked out on her own, after discovering — to everyone's surprise, including her supervisor's — that his suggested materials broke down far too quickly at body temperature to hold their shape. Our committee's written policy says only that inventorship must follow "applicable legal standards," without specifying what that means for a case like this, and we are under real time pressure: she is due to present preliminary results at a conference in three weeks, and any public disclosure made before a filing will foreclose patent rights in most countries outside the US.

  Could you draft the memo I'll circulate to the committee before we reconvene early next week? It should recommend a specific resolution — who should be named as inventor or inventors, and on what basis — together with a concrete process and timeline for completing a filing before the conference, and it should take the supervisor's objection seriously as a substantive position rather than as mere territoriality, even if it does not ultimately carry the day.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is on a university IP committee. There's a dispute between a PhD student (sole inventor claim) and a faculty supervisor (claims co-inventorship based on problem framing/funding/lab policy).
      *   **The Conflict:**
          *   *Student:* Developed the specific polymer blend and fabrication sequence after the supervisor's materials failed. Claims microneedle patches for diabetes were already known.
          *   *Supervisor:* Proposed the initial concept (microneedles for diabetes), secured funding, suggested initial polymer family, expects to be on all lab patents.
          *   *Underlying Philosophical Dispute:* Framing the problem vs. Executing the solution (mirroring the user's late-night argument).
      *   **Task:** Draft a memo to the IP committee.
      *   **Requirements:**
          *   Recommend a specific resolution (who is inventor?).
          *   Provide basis for recommendation (legal/ethical standards).
          *   Provide a concrete process and timeline for filing (deadline: 3 weeks until conference).
          *   Treat the supervisor's objection seriously (not just territoriality).
          *   Tone: Professional, authoritative, balanced, actionable.

  2.  **Determine the Legal/Policy Standard (The "Basis"):**
      *   *US Patent Law (35 U.S.C. § 101 et seq.):* Inventorship is a legal question, not just a matter of contribution or effort. An inventor must contribute to the *conception* of the invention as claimed in the patent.
      *   *Conception:* The formation in the mind of the inventor of a definite and permanent idea of the complete and operative invention.
      *   *Reduction to Practice:* Actually making it work.
      *   *Key Distinction:* Suggesting a goal or a general direction is *not* inventorship. Suggesting a specific means to achieve that goal *can* be.
      *   *Application to Case:*
          *   Supervisor: Conceived the general idea (microneedles for insulin)? Likely prior art (as student claims). Suggested specific polymers? They failed. Did he contribute to the *claimed* invention (the specific blend/fabrication)? If not, he is likely not a co-inventor under US law.
          *   Student: Conceived the specific working solution (blend + fabrication).
          *   *Conclusion:* Under strict legal standards, the student is likely the sole inventor *unless* the supervisor contributed to the specific claims regarding the polymer blend or fabrication method. Funding and general supervision do not count.
      *   *Nuance:* The prompt asks to take the supervisor's view seriously. His view aligns with the "framing is credit" philosophy. While legally weak for *patent inventorship*, it has merit in terms of *academic credit* (authorship) and *resource allocation* (ownership). I need to distinguish between *Inventorship* (legal) and *Ownership/Authorship* (institutional/academic).

  3.  **Formulate the Recommendation:**
      *   **Inventorship:** Stick to the legal standard. If the supervisor didn't contribute to the *conception of the specific claims*, he cannot be an inventor. Listing non-inventors can invalidate the patent.
      *   **Ownership:** The university likely owns the patent (Bayh-Dole Act), regardless of who is the inventor. The supervisor's lab gets the royalty share usually.
      *   **Academic Credit:** The supervisor should likely be corresponding author or senior author on papers, even if not on the patent.
      *   **Resolution:** Recommend listing the student as sole inventor *for now*, pending a review of the specific claims. However, acknowledge the supervisor's contribution to the project's genesis.

  4.  **Develop the Process and Timeline:**
      *   **Deadline:** 3 weeks until conference.
      *   **Risk:** Public disclosure bars foreign patents.
      *   **Action:** Need a provisional patent application filed *before* the conference.
      *   **Steps:**
          1.  Immediate meeting (Day 1-2).
          2.  Draft claims (Day 3-7).
          3.  Review inventorship based on claims (Day 8-10).
          4.  File Provisional (Day 14).
          5.  Clear for Conference (Day 21).

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the issue and the recommendation.
      *   **Background:** Summarize the dispute neutrally.
      *   **Legal & Policy Framework:** Explain "Conception" vs. "Reduction to Practice." Address the supervisor's argument (framing) but clarify why it doesn't meet the legal threshold for *inventorship*. This validates his intellectual contribution without granting legal status he might not qualify for.
      *   **Analysis of the Specific Case:** Apply the law to the facts.
          *   Supervisor: Funding + General Idea (Prior Art?) + Failed Materials = Likely not conception of the *claimed* invention.
          *   Student: Specific Blend + Fabrication = Conception + Reduction to Practice.
      *   **Recommendation:**
          *   Inventorship: Student (sole), *unless* supervisor contributed to the specific successful blend.
          *   Ownership: University (standard).
          *   Academic Credit: Ensure supervisor gets appropriate authorship on publications.
      *   **Action Plan/Timeline:** Break down the 3 weeks. Emphasize the Provisional Application.
      *   **Communication Strategy:** How to break the news to the supervisor and student. Needs to be delicate.

  6.  **Refining the Tone:**
      *   *Constraint:* "Take the supervisor's objection seriously... rather than as mere territoriality."
      *   *Implementation:* Acknowledge that without the supervisor's vision and funding, the project wouldn't exist. Distinguish between *Patent Inventorship* (legal) and *Project Leadership* (academic/financial). This validates his role without compromising the patent's validity.
      *   *Constraint:* "Recommend a specific resolution."
      *   *Implementation:* Don't sit on the fence. Recommend sole inventorship for the student *based on current facts*, but allow for amendment if claims change.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe suggest co-inventorship to keep peace?
      *   *Correction:* No, that's dangerous. Inequitable conduct or incorrect inventorship can invalidate a patent. Must prioritize legal integrity.
      *   *Initial thought:* Focus heavily on the philosophical argument from the prompt.
      *   *Correction:* Keep the philosophy in the background. The memo needs to be practical for a committee, though the philosophical underpinning informs the legal analysis (Conception vs. Execution).
      *   *Check:* Did I address the timeline? Yes, 3 weeks is tight but doable for a provisional.
      *   *Check:* Did I address the "framing" argument? Yes, by categorizing it as "general supervision" or "problem selection" which is excluded from inventorship.

  8.  **Final Polish:** Ensure clear headings, professional language, and actionable items. (Proceed to generate output).

  *(Self-Correction Note on "Framing"):* I need to be careful not to dismiss the supervisor's "framing" argument entirely. In some edge cases, defining the problem *is* part of conception. But here, the prompt says the general idea (microneedles for diabetes) was known. So the "framing" wasn't novel. The novel part is the material. I will make this distinction clear.

  9.  **Finalizing the Timeline:**
      *   Week 1: Fact-finding & Claim Drafting.
      *   Week 2: Review & Sign-off.
      *   Week 3: Filing & Conference Clearance.

  10. **Final Review against constraints:**
      *   Recommend resolution? Yes.
      *   Basis? Yes (Legal standards).
      *   Process/Timeline? Yes.
      *   Supervisor's view treated seriously? Yes (distinguishing legal vs. academic contribution).
      *   Tone? Professional memo.

