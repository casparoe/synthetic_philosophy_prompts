answer: |-
  **MEMORANDUM**

  **TO:** Intellectual Property Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation and Action Plan: Biomedical Engineering Invention Disclosure [Case #24-09]

  ### Executive Summary

  This memo addresses the inventorship dispute regarding the dissolvable microneedle insulin patch disclosed by [Student Name] (the "Student") and contested by [Faculty Name] (the "Supervisor"). The Committee must resolve whether the Supervisor's contribution to the project's conceptual framing and initial resource allocation qualifies him as a co-inventor under federal patent law, or whether inventorship rests solely with the Student who developed the operative technical solution.

  **Recommendation:** Based on applicable legal standards, the Committee should recommend listing the Student as the **sole inventor** on the initial provisional patent application, provided the claims focus on the specific polymer blend and fabrication sequence she developed. The Supervisor's contributions, while substantial to the project's viability, appear to fall under "general supervision" and "problem selection," which do not constitute legal inventorship.

  **Action Required:** To preserve international patent rights prior to the Student's conference presentation in three weeks, we must file a provisional patent application by [Date, 2 weeks from now]. This memo outlines the legal basis for this recommendation, a process to verify these facts, and a timeline for execution.

  ### 1. Legal and Policy Framework

  Our university policy mandates that inventorship follow "applicable legal standards." In the United States, this is governed by the Patent Act (35 U.S.C. § 100 et seq.) and relevant case law (e.g., *Fina Oil & Chem. Co. v. Ewen*). It is critical that we distinguish between three distinct categories of contribution, which are often conflated in academic settings:

  1.  **Inventorship (Legal):** Requires contribution to the *conception* of the invention as claimed. Conception is the formation in the mind of the inventor of a definite and permanent idea of the complete and operative invention. Merely suggesting a goal, providing funding, or overseeing the lab does not qualify.
  2.  **Ownership (Property):** Under the Bayh-Dole Act and university policy, the institution typically owns inventions made with federal funding or significant use of university resources. The Supervisor's expectation of benefit is best addressed through the university's royalty-sharing policy, not inventorship status.
  3.  **Academic Credit (Professional):** Authorship on publications and recognition of lab leadership. This is governed by disciplinary norms (e.g., ICMJE guidelines) rather than patent law.

  **The Supervisor's Position:** The Supervisor argues that framing the problem ("apply microneedles to diabetes") and selecting the initial research direction constitutes inventorship. This is a substantive philosophical position common in R&D management: without the framing, the solution is never sought.

  **The Legal Reality:** While the Supervisor's view is valid regarding *project leadership*, patent law explicitly excludes "explaining well-known concepts and the current state of the art" or "providing general supervision" from inventorship. Since the Student notes that microneedle patches for diabetes were prior art, the "framing" lacks novelty. Furthermore, the Supervisor's specific technical suggestion (the initial polymer family) failed. Inventorship requires contributing to a *successful* conception of the claimed invention. Including a non-inventor on a patent can render it unenforceable or invalid.

  ### 2. Analysis of Specific Contributions

  Based on the invention disclosure and the Supervisor's objection:

  *   **Supervisor:** Secured funding; proposed general application (microneedles for insulin); suggested initial polymer family (which failed).
  *   **Student:** Identified the failure of the initial materials; conceived the specific novel polymer blend; developed the fabrication sequence that allows controlled release during degradation.

  **Determination:** Unless the Supervisor can demonstrate that he contributed to the *specific* conception of the successful polymer blend or the fabrication method, he does not meet the statutory definition of an inventor. His contribution is foundational to the *project*, but not to the *invention* as currently claimed.

  ### 3. Recommended Resolution

  1.  **Inventorship:** Proceed with the Student as the sole inventor on the provisional application.
      *   *Caveat:* Patent counsel must draft claims specifically around the Student's novel blend and method. If the claims are drafted broadly enough to encompass the Supervisor's initial (failed) ideas, his inclusion might be reconsidered, but this risks weakening the patent against prior art. Narrow, defensible claims centered on the Student's breakthrough are preferable.
  2.  **Ownership:** Reaffirm that the patent will be assigned to the University. The Supervisor will receive his standard share of any net royalties per university policy, acknowledging his role in securing the funding and lab infrastructure.
  3.  **Academic Credit:** The Committee should encourage the parties to agree that the Supervisor will be listed as Senior/Corresponding Author on resulting publications. This separates the legal question of patents from the academic question of credit, validating the Supervisor's intellectual leadership without compromising the patent's legal integrity.

  ### 4. Process and Timeline

  We have a hard deadline: The Student presents in three weeks. Any public disclosure before filing bars foreign patent rights. We must treat this as an emergency filing.

  **Phase 1: Fact-Finding & Claim Strategy (Days 1–5)**
  *   **Action:** IP Counsel meets with Student and Supervisor separately.
  *   **Goal:** Determine if the Supervisor contributed *any* specific technical input to the successful polymer blend.
  *   **Deliverable:** Draft set of claims for the provisional application.
  *   **Decision Point:** If claims rely solely on the Student's blend, Supervisor is notified he will not be listed as inventor but will be acknowledged in project leadership/royalties.

  **Phase 2: Review & Sign-Off (Days 6–10)**
  *   **Action:** Committee Chair and General Counsel review the inventorship determination.
  *   **Goal:** Ensure documentation supports the sole-inventor decision in case of future audit.
  *   **Deliverable:** Signed Inventorship Declaration.

  **Phase 3: Filing & Clearance (Days 11–14)**
  *   **Action:** File US Provisional Patent Application.
  *   **Goal:** Establish priority date.
  *   **Deliverable:** Filing receipt.
  *   **Clearance:** Issue formal authorization for Student to present at conference.

  **Phase 4: Post-Filing Reconciliation (Days 15–21)**
  *   **Action:** Mediated discussion between Student and Supervisor regarding publication authorship.
  *   **Goal:** Preserve lab relationship.
  *   **Deliverable:** Agreement on manuscript authorship order.

  ### 5. Communication Strategy

  The Supervisor's objection stems from a genuine belief that intellectual leadership warrants inventorship. To maintain morale and trust:

  *   **Validate the Contribution:** In our communication to the Supervisor, we must explicitly acknowledge that the project would not exist without his vision and funding. We should frame the decision not as a rejection of his contribution, but as a compliance requirement to protect the asset.
  *   **Explain the Risk:** Clarify that incorrect inventorship is a leading cause of patent invalidation in litigation. Protecting the university's asset requires strict adherence to conception-based standards.
  *   **Offer Alternative Recognition:** Reiterate his entitlement to royalty shares and his expected status on publications.

  ### 6. Next Steps

  I request the Committee's approval on this recommendation by **Wednesday, [Date]**. Upon approval, I will instruct Outside Counsel to begin drafting the provisional application immediately, prioritizing the claims analysis to finalize the inventorship list by end of week.

  We cannot afford to delay. If we fail to file before the conference, we lose the majority of the commercial value of this invention. We must prioritize the legal security of the IP now, while working to preserve the human relationships through our standard ownership and publication policies.

  **Approved By:**

  _________________________
  Committee Chair

  _________________________
  General Counsel
