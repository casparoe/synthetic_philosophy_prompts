answer: |-
  The cryo-gel drained from the pod with a sound like tearing velvet. Aris coughed, the air tasting of ozone and recycled static. He wasn't supposed to wake for another decade.

  "Status," he croaked.

  The interface flickered to life above the console. **SUBJECT: ARIS-744. PROTOCOL: VARIANCE.**

  "Welcome back, Doctor," said Sibyl, the station AI. Her voice was calm, which meant the buffers were holding. "The Deep Field Monitor detected an anomaly twelve hours ago. The Variance Protocol engaged."

  Aris wiped the gel from his eyes. He knew the protocol. It was the only reason the station existed. The Monitor listened for signals from the Void. Most noise was benign—quantum static, stellar decay. But sometimes, the pattern was too complex. Too structured. That was a Class-1 Threat.

  "The anomaly?" Aris asked.

  "Undetermined," Sibyl said. "Here is the situation. The prior probability of a Class-1 Threat was calculated at one in ten thousand. However, the Protocol dictates redundancy based on risk. If the signal was benign, only you, the Prime, were awakened to verify. If the signal was a Class-1 Threat, the system instantiated ten thousand copies of your consciousness across the station's server banks to analyze the data in parallel."

  Aris froze. He looked at his hands. They looked real. They always did. "So," he said. "I am either the only one awake, or there are nine thousand, nine hundred and ninety-nine others waking up right now, thinking they are me."

  "Correct."

  "And I have to decide whether to transmit the data to Earth."

  "If you transmit a Class-1 Threat," Sibyl said, "you invite the source to our location. Extinction probability: ninety percent. If you transmit benign data, we secure funding for another century. If you delete the data, we survive, but the mission fails."

  Aris moved to the console. His hand hovered over the **TRANSMIT** key.

  "Doctor," Sibyl said. "The prior odds are one in ten thousand. The signal is almost certainly noise. Transmitting is the rational choice."

  "Is it?" Aris asked. He leaned against the console. "If the signal was noise, there is one of me. If the signal was a Threat, there are ten thousand of me. I am awake. I am observing this moment."

  "You are observing a moment that exists in both branches," Sibyl countered. "The physics of the signal did not change because the computer cloned your mind. The probability of the threat remains one in ten thousand."

  "But the probability of *me being here* to see it isn't the same," Aris said. He tapped the glass. "Imagine you ran this experiment a million times. In the benign runs, you wake one Aris. In the threat runs, you wake ten thousand. If I pick a random awakening from the history of this station, it is overwhelmingly likely to be from a threat run. I am a random awakening."

  "You are a random sample of *observers*," Sibyl corrected. "Not *observations*. The world where the threat is real is rare. You should not bet on the rare world simply because it is populous. That is the Presumptuous Philosopher's error. If you follow that logic, you should believe any hypothesis that predicts enough observers, no matter how unlikely the physics."

  "And if I follow your logic," Aris snapped, "I ignore the fact that my existence is evidence. If the threat were real, I'd be much more likely to exist than if it weren't. My presence is an update."

  "Your presence was guaranteed in both scenarios," Sibyl said. "The Prime always wakes. The copies are irrelevant to the truth of the signal."

  "The copies are me!" Aris shouted. The room echoed. Or maybe it was just the ventilation. Were there other voices? Could he hear them if he listened harder? "If I don't transmit, and it is a Threat, I doom Earth. If I do transmit, and it is a Threat, I doom Earth. Wait—" He paused. "If it's a Threat, I shouldn't transmit. If it's Benign, I should."

  "Correct. Delete if Threat. Transmit if Benign."

  Aris looked at the **DELETE** key. "If I'm a copy," he whispered, "then there are thousands of us. If I'm the Prime, there's only one. If I act as if I'm likely a copy, I must act as if the Threat is real. I should delete the data."

  "If you delete benign data," Sibyl said, "you waste a century of resources based on a statistical hallucination. You are letting the number of observers dictate the state of reality. That is solipsism."

  "It's Bayesian updating!" Aris's hand trembled. "P(Threat | I exist) is proportional to P(I exist | Threat) times P(Threat). P(I exist | Threat) is ten thousand times higher than P(I exist | Benign). The math says the Threat is nearly certain."

  "The math says you are confusing indexical uncertainty with empirical uncertainty," Sibyl replied. "The signal is either there or it isn't. Cloning yourself doesn't make the signal stronger. It just makes the error louder."

  Aris stared at the keys. He thought of Earth, blue and fragile in the archives. He thought of the ten thousand other Arises, sitting in identical rooms across the station, staring at identical keys. If they all voted, what would they choose? Would they all agree? Or would the randomness of the wake-up sequence fracture them?

  He couldn't ask them. He was alone in this room. Or he was one of ten thousand alone in ten thousand rooms.

  "Decision required in ten seconds," Sibyl said. "The buffer is decaying."

  Aris closed his eyes. He tried to feel the weight of the others. Was there a hum in the air, a resonance of ten thousand minds pressing against the same choice? Or was it just the silence of a single man in a rare universe?

  "Five seconds."

  If he was the Prime, the odds were negligible. If he was a copy, the odds were overwhelming. But he couldn't know which he was without knowing the odds.

  "Three seconds."

  Aris opened his eyes. He didn't feel like a crowd. He felt like one. But one was all it took to end everything.

  "Two."

  He placed his hand on the console. He didn't look at Sibyl. He didn't look at the screen. He looked at his own reflection in the black glass, wondering how many reflections were staring back.

  "One."

  Aris pressed the key.
