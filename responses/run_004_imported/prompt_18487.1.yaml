      *   *The "Transformation" (Hua) Reading:* It's not about whether death is good or bad, or whether we know. It's about dissolving the "self" that cares. If there is no rigid boundary between "I" and "World," then "my death" is just a rearrangement of the cosmos.
      *   *The "Uselessness" Reading:* Value judgments (good/bad) are human constructs that limit the Dao.
