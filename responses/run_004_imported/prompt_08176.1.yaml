prompt: |-
  I sit on my hospital's clinical ethics committee. A patient in our deep-brain-stimulation trial for treatment-resistant depression signed an advance directive before implantation stating that any request to deactivate the device (a simple reprogramming, not further surgery) would be honored only after a mandatory 30-day waiting period, since she didn't trust her depressed self to judge the treatment fairly. Eight months in, she is symptom-free and thriving by every clinical measure, but has now asked, calmly and consistently across three visits, to have the stimulation turned off -- not because of relapse, but because she says she no longer recognizes herself, and would rather be "the difficult, vivid person I was" than the calmer person the device has made her. Her 30 days run out next week. This strikes me as a nastier cousin of the "transformative experience" problem (L.A. Paul's term) that gets kicked around on rationalist blogs in the context of choices like having a kid: the question here isn't whether she could have foreseen the change, but whether the self who signed the directive and the self now revoking it count as the same authority. Roughly half the committee wants to honor the directive exactly as written, since this is precisely the contingency it was drafted for; the other half thinks its authority lapsed the moment the treatment succeeded on its own terms. Please draft the committee's decision memo: a concrete recommendation with a timeline for when the 30 days run out, and a genuine, fair treatment of whichever side the memo doesn't adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's Clinical Ethics Committee (CEC).
      *   **Scenario:** A patient in a Deep Brain Stimulation (DBS) trial for treatment-resistant depression (TRD).
      *   **Key Fact 1 (Advance Directive):** Pre-implantation AD states any request to deactivate must undergo a mandatory 30-day waiting period. Rationale: Patient didn't trust her depressed self to judge fairly.
      *   **Key Fact 2 (Current Status):** 8 months post-implant. Symptom-free, thriving clinically.
      *   **Key Fact 3 (Current Request):** Patient wants device off. Not due to relapse/side effects, but due to *identity change* ("no longer recognizes herself," prefers "difficult, vivid person" over "calmer person"). Request is calm, consistent across 3 visits.
      *   **Key Fact 4 (Timeline):** 30-day waiting period (triggered by request) ends next week.
      *   **Ethical Conflict:** "Pre-implant Self" (depressed, distrusted own judgment) vs. "Post-implant Self" (euthymic, values identity over symptom relief). This is framed as a "transformative experience" problem (L.A. Paul).
      *   **Committee Split:** 50/50. One side says honor the AD (it covers this contingency). Other side says AD authority lapsed because treatment succeeded (she is no longer the "depressed self" the AD protected).
      *   **Deliverable:** A Committee Decision Memo.
      *   **Requirements:** Concrete recommendation, timeline, genuine/fair treatment of the minority view.

  2.  **Determine the Ethical Core:**
      *   **Autonomy:** Which self represents true autonomy? The one who planned ahead knowing the risks, or the one currently experiencing the outcome?
      *   **Beneficence/Non-maleficence:** Turning it off risks severe relapse (harm). Keeping it on violates current wishes (harm to identity/psychological integrity).
      *   **Precedence:** DBS ethics literature often grapples with "post-DBS personality changes." Usually, if a patient is competent *now*, their current wishes prevail, *unless* there's evidence of mania/hypomania impairing judgment. Here, she is "calm and consistent," suggesting competence.
      *   **The AD's Purpose:** The AD was designed to prevent a *depressive* impulse to quit. It was *not* designed to prevent an *identity-based* choice made while euthymic. The trigger for the AD was "distrust of depressed self." The current self is *not* depressed. Therefore, the specific condition the AD was meant to guard against (depression-clouded judgment) is absent.
      *   **The Transformative Experience:** The patient has undergone a change in values. She now values "vividness/difficulty" over "calm/remission." This is a valid value shift, not necessarily a symptom of illness.

  3.  **Formulate the Recommendation:**
      *   *Decision:* Honor the current request, but strictly adhere to the safety protocol (the waiting period) as a formality, then deactivate.
      *   *Reasoning:* The AD was a Ulysses Contract against *depression*. The patient is not currently depressed. Her competence is intact. The value shift is a legitimate exercise of autonomy, even if it contradicts the medical goal of symptom remission. To force treatment on a competent patient because they are "too healthy" to know what they want is paternalistic.
      *   *Timeline:* The 30-day period ends next week. Deactivation should occur immediately thereafter, provided no new clinical red flags emerge.
      *   *Minority View:* The view that the AD binds the patient because the *risk* of relapse is the primary ethical concern, and the "identity change" could be a subtle side effect of stimulation (e.g., hypomania or emotional blunting) that the patient doesn't recognize as pathological.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject, Patient ID (Anonymized).
      *   **Background:** Brief summary of case, AD, current status.
      *   **Ethical Analysis:** Breakdown of the competing principles (Autonomy, Beneficence, AD validity).
      *   **Committee Deliberation:** Acknowledge the split.
      *   **Recommendation:** Clear action plan.
      *   **Minority Opinion/Dissent:** Fair representation of the other side.
      *   **Follow-up:** Safety netting.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Wait, if I recommend deactivation, am I ignoring the AD? The AD says "honor request *after* 30 days." It doesn't say "ignore request after 30 days." It creates a *hurdle*, not a *ban*.
      *   *Nuance:* The majority view (which I need to adopt for the recommendation to be decisive, or I can frame it as the Committee's consensus decision) is that the AD's *condition* has been met (30 days passed), and there is no clinical contraindication (she is competent). The minority view is that the AD's *intent* was to preserve the "healthy self" against the "sick self," and since she is healthy, she shouldn't be allowed to become sick.
      *   *Actually, looking at the prompt:* "Roughly half the committee wants to honor the directive... the other half thinks its authority lapsed."
          *   Side A (Honor Directive): Wait 30 days, *then* turn it off (because the directive says honor request after waiting). Wait, re-reading: "signed an advance directive... stating that any request to deactivate... would be honored only after a mandatory 30-day waiting period."
          *   Side B (Authority Lapsed): The directive was to protect the *depressed* self. She isn't depressed. So the directive shouldn't apply at all? Or does it mean the directive's goal (keeping her healthy) overrides the request?
          *   *Clarification:* Side A says: Follow the AD. The AD says "Wait 30 days, then do it." So Side A supports deactivation *after* the wait.
          *   Side B says: The AD's authority lapsed because treatment succeeded. This usually implies they want to *keep* the device on, arguing the AD was meant to prevent deactivation during illness, but now that she's well, the medical team should prioritize maintaining wellness over the AD's procedural instruction.
          *   *Wait, let's look closer:* "Half want to honor the directive exactly as written [Wait 30 days, then deactivate]." "Other half thinks its authority lapsed the moment the treatment succeeded [Implies: Do not deactivate, or the AD is void because the premise (depression) is gone]."
          *   *Decision:* The strongest ethical position in DBS literature generally favors current competent autonomy over past directives regarding identity, provided competence is verified. However, the 30-day wait is a good safety buffer.
          *   *My Recommendation:* I will recommend honoring the request *after* the waiting period concludes. This aligns with current autonomy while respecting the safety buffer agreed upon in the AD. It acknowledges that the AD was a procedural safeguard, not a permanent ban.
          *   *Wait, actually:* If Side A wants to "honor the directive," they want to wait 30 days and *then* turn it off. If Side B thinks authority "lapsed," they likely mean the patient should be stopped from turning it off because she is now competent and making a "bad" medical choice, or conversely, that she doesn't need the protection of the AD so she can decide now.
          *   *Standard Ethics:* A competent patient can refuse treatment even if life-saving. DBS is ongoing treatment. If she is competent, she can refuse. The AD adds a waiting period.
          *   *The Twist:* The AD was made by the *depressed* self to protect against the *depressed* self. The *current* self is *not* depressed. Does the AD apply? Yes, it's a standing order. But does it override current competence? No.
          *   *Best Path:* The Committee should recommend deactivation after the 30-day period concludes. This respects the agreed-upon safety protocol (the wait) while affirming current autonomy. The Minority view is that deactivation should be denied or indefinitely delayed because the "success" of the treatment implies the "depressed self" is gone, and allowing deactivation is allowing harm.
          *   *Actually, let's flip it for a more interesting ethical memo:* Usually, Ethics Committees prioritize current competence. If she is competent, she can revoke consent. The AD facilitates this by ensuring it's not an impulse.
          *   *Let's align the sides:*
              *   Majority Recommendation: Proceed with deactivation after the 30-day period ends. (Respects current autonomy + safety buffer).
              *   Minority Concern: The AD was a Ulysses contract to preserve the *life* of the patient against the *disease*. The disease is in remission. Allowing the patient to revert to a high-risk state violates beneficence.

      *   *Wait, I need to make sure I address the "Transformative Experience" aspect.* The patient values her old identity. This is a value judgment, not a symptom.
      *   *Decision:* I will draft the memo recommending deactivation after the waiting period. This respects the procedural safeguard of the AD while prioritizing the competent, current self's values.

  6.  **Drafting - Tone and Style:**
      *   Professional, clinical, empathetic, precise.
      *   Avoid jargon where possible, but use ethical terms correctly (autonomy, beneficence, Ulysses contract).
      *   Ensure the "Minority View" feels robust, not like a strawman.

  7.  **Key Sections to Include:**
      *   Case Summary.
      *   Ethical Framework (Autonomy vs. Beneficence, Identity).
      *   The Status of the Advance Directive (Procedural vs. Substantive).
      *   The Recommendation (Deactivate after Day 30).
      *   Minority Perspective (Beneficence/Relapse Risk).
      *   Mitigation Plan (Post-deactivation support).

  8.  **Final Review against Prompt:**
