  **Setup:** Gibbard-Satterthwaite is the bouncer at the "Fair Voting" club.

  **Punchline:** If you're a party of two, he waves you right in (shoutout May's Theorem). But if you bring a third person, he stops you at the door and says, "You can enter, but either one of you owns the building, or you all have to lie about your preferences. No honest democracies allowed."

  ***

  **Why this works for your chat:**
  *   **The Bouncer Analogy:** It visualizes the theorem as a gatekeeper imposing conditions, which fits the "impossibility" vibe.
  *   **The May's Theorem Nod:** It acknowledges the one exception (2 candidates) that your group already knows, showing you get the nuance.
  *   **The Mechanics:** It translates "strategy-proof" into "lie about your preferences" and "dictatorial" into "owns the building," so no one has to ask for a definition.
  *   **The Tone:** It captures the existential dread of the theorem without just saying "voting is broken."
