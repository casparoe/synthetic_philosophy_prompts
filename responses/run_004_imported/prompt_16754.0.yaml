answer: |-
  **The Price of Progress: Verisimilitude, Language, and the Metaphysics of Truthlikeness**

  Karl Popper's intuition was simple, compelling, and ostensibly necessary for scientific realism. Science progresses. We move from Newton to Einstein, from phlogiston to oxygen, from geocentrism to heliocentrism. Yet, if we accept fallibilism—the view that our best theories are likely false, or at least not known to be true—we face a dilemma. If all current theories are false, in what sense is the current theory *better* than its predecessor? Popper's answer was verisimilitude: a false theory can be closer to the truth than another false theory. It was meant to be the realist's shield against skepticism, allowing us to claim progress without claiming certainty.

  However, as you have discussed in your seminar, the Tichý-Miller impossibility results of 1974 shattered Popper's specific logical formulation. They demonstrated that within Popper's own framework, no false theory can be ranked as more verisimilar than another. This was not a minor technical glitch; it was a catastrophic failure of the concept's intended application. Since Popper held that all substantive scientific theories are strictly false, his definition rendered the concept of scientific progress incoherent.

  The question for the contemporary philosopher of science is whether the baby must be thrown out with the bathwater. Can verisimilitude be rescued by shifting from Popper's content-based approach to the "similarity" or "distance" measures proposed by Ilkka Niiniluoto, Graham Oddie, and others? Or does the language-dependence objection, also advanced by Miller, prove that truthlikeness is an illusion?

  The verdict is this: Verisimilitude is rescuable, but only at a steep metaphysical price. It cannot function as the purely logical, syntactic tool Popper envisioned. To save the notion of "closeness to truth," we must abandon the hope of a language-independent metric and accept that verisimilitude is ontologically grounded in a theory of natural properties. Without this commitment, the concept collapses; with it, it remains the only viable account of scientific progress that satisfies realist intuitions.

  **The Collapse of Content**

  To understand the rescue attempt, we must be precise about the failure. Popper defined verisimilitude ($Vs$) by comparing the *truth-content* of a theory (the set of its true consequences) against its *falsity-content* (the set of its false consequences). Theory $A$ is closer to the truth than Theory $B$ if $A$ has more truth-content and no more falsity-content, or equal truth-content and less falsity-content.

  Tichý and Miller independently showed that for any two false theories, this ordering fails. If a theory is false, it entails at least one falsehood. In classical logic, adding true consequences to a false theory often necessitates adding false consequences as well, in a way that locks the ratio. More devastatingly, they showed that for any false theory $A$, one can construct a false theory $B$ that Popper's definition ranks as closer, and another $C$ that it ranks as further, arbitrarily. The result is that the relation is trivial: all false theories are effectively equidistant from the truth. For a seminar on Popper, the punchline is that his definition makes it impossible to say Newton is closer to the truth than Aristotelian physics, provided both are false.

  **The Similarity Turn**

  The post-1974 rescue mission, led primarily by Niiniluoto and Oddie, shifted the terrain from logical *content* to semantic *distance*. Instead of counting consequences, this approach utilizes possible worlds semantics. We imagine a space of all possible states of affairs (constituents). The "truth" is the one actual world (or the correct constituent). A theory is a claim about which world is actual. Verisimilitude is then measured by the distance between the world the theory posits and the actual world.

  This handles the intuitive cases Popper's logic missed. If the truth is that there are 8 planets, a theory claiming 7 is closer than a theory claiming 1. In the content approach, both are simply "false." In the distance approach, we assign a metric to the space of possibilities. Niiniluoto's "min-sum" measure, for instance, balances how close the best possibility allowed by the theory is to the truth, and how far the worst possibility is.

  This approach successfully avoids the Tichý-Miller collapse within propositional logic. It allows us to rank false theories. It captures the idea that getting the value of a constant slightly wrong is better than getting it wildly wrong. It seems to restore the realist's ability to talk about progress.

  **The Language Dependence Objection**

  However, the victory is short-lived. David Miller launched a second attack, arguably more damaging than the first: the problem of language dependence. Distance metrics are not invariant under translation.

  Consider Miller's famous weather example. Suppose the actual weather is hot, rainy, and windy ($h, r, w$). We can describe the state space using these three predicates. Alternatively, we can define new predicates: *Minnesotan* (hot and rainy iff windy) and *Arizonan* (hot and windy iff rainy). These are logically equivalent descriptions of the same state space. However, a theory that gets the weather "close" in the ($h, r, w$) language might count as "distant" in the (Minnesotan, Arizonan) language.

  If verisimilitude depends on which predicates we choose to carve up the world, it is not an objective measure of a theory's relation to reality; it is a measure of the theory's relation to our *description* of reality. If the metric shifts with the language, then claiming Einstein is "closer to the truth" than Newton is merely a comment on our preferred vocabulary, not on the world. This threatens to reduce verisimilitude to a pragmatic or conventionalist notion, stripping it of the realist bite Popper intended.

  **Why Alternatives Fail**

  Before rendering a verdict on the rescue, we must ask: Do we need verisimilitude at all? Why not switch to Bayesian confirmation or Kuhnian paradigms?

  Bayesian confirmation measures how much evidence supports a hypothesis, not how close the hypothesis is to the truth. A theory can be highly confirmed by current data yet be fundamentally false (e.g., Ptolemaic astronomy was excellent at prediction). Confirmation tracks *warrant*, not *truthlikeness*. If we want to explain why we prefer Einstein over Newton *even in domains where Newton works fine*, we are making a claim about the structure of reality, not just the state of our evidence. Confirmation cannot do this work.

  Similarly, a Kuhnian account explains theory change sociologically or psychologically, but it struggles to provide a *normative* justification for progress. If paradigms are incommensurable, we cannot say the new one is "better" in a truth-tracking sense, only that it won the political struggle. Realists need more than a description of change; they need a justification for the belief that the change is an improvement.

  We are left with verisimilitude as the only game in town for the scientific realist who wants to define progress without claiming final truth.

  **The Verdict: A Metaphysical Rescue**

  So, can the distance measures survive the language dependence objection? The answer is yes, but only if we reject the assumption that all predicate sets are equal.

  The language dependence problem assumes that the choice between ($h, r, w$) and (Minnesotan, Arizonan) is arbitrary. But is it? A scientific realist should argue that it is not. The world has a privileged structure. Some properties are *natural kinds*; others are gerrymandered disjunctions. "Hot," "Rainy," and "Windy" (or more realistically, "Mass," "Charge," "Spin") carve nature at its joints. "Minnesotan" is a contrived logical function of those natural properties.

  If we accept a Lewis-style metaphysics of natural properties, the language dependence objection loses its sting. Verisimilitude is not defined over just any linguistic framework; it is defined over the framework that corresponds to the fundamental ontology of the world. The distance metric is objective *relative to the natural structure of reality*.

  This leads to the definitive verdict: **Verisimilitude is rescuable, but it ceases to be a tool of pure logic and becomes a tool of metaphysics.**

  Popper wanted a logical definition that could compare theories without committing to a specific ontology. He wanted a syntactic yardstick. Tichý and Miller proved this is impossible. The Niiniluoto-Oddie approach saves the concept, but only by smuggling in ontological commitments. To say Theory A is closer to the truth than Theory B is to claim that Theory A employs concepts that map more accurately onto the natural properties of the universe.

  **Implications for the Seminar**

  For your seminar, this distinction is the crucial punchline. The failure of verisimilitude is not a failure of the *intuition* that science progresses; it is a failure of the attempt to formalize that progress without metaphysics.

  1.  **The Logical Dead End:** You can tell your students that the Tichý-Miller result proves you cannot define truthlikeness using only logical consequence relations. If you try to keep it purely formal, the concept evaporates.
  2.  **The Metaphysical Turn:** The "similarity" approaches work, but they rely on the assumption that some ways of describing the world are *objectively better* than others. This aligns verisimilitude with Entity Realism or Structural Realism. It implies that to measure progress, we must have a working hypothesis about what the fundamental constituents of the world are.
  3.  **The Limitation:** This means verisimilitude cannot be used to *judge* fundamental ontology from the outside. We cannot use truthlikeness to prove our current ontology is right; we must assume an ontology to calculate truthlikeness. It is a coherent concept for comparing theories *within* a research tradition that shares ontological commitments (e.g., comparing different models of the electron), but it is much harder to use for comparing radically different paradigms (e.g., Newtonian mass vs. Relativistic mass-energy) unless we can specify the mapping between their ontologies.

  **Conclusion**

  Popperians should not drop the notion of verisimilitude, because without it, scientific realism has no account of progress. However, they must abandon the hope that it is a language-neutral, logical metric. The Tichý-Miller results should be taught not as the death of truthlikeness, but as the proof that truthlikeness is not a logical relation—it is a semantic relation grounded in metaphysics.

  The concept works for "anything resembling real scientific theories" only insofar as those theories are attempting to describe a world with a stable, privileged structure. If you are a constructive empiricist or an instrumentalist, verisimilitude is indeed useless to you, and you should reach for empirical adequacy. But if you are a realist, you must accept that "closeness to truth" requires a commitment to "natural properties." The rescue is successful, but the cost is the admission that we cannot measure progress without first making a bet on what the world is made of. That is not a bug in the theory of verisimilitude; it is the price of doing realist business.
