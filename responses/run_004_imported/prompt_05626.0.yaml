      *   **The Recommendation (The "Why"):**
          *   Why table? Because theory alone can't solve this. We need to see how "community deliberation" works in practice without empowering oppressors.
          *   Why a pilot? To test mechanisms of engagement that satisfy relational requirements without violating individual protections.
      *   **Fairness to the Opposing View:**
