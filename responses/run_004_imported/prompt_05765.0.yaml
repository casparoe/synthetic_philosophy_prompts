answer: |-
  This is an excellent set of questions. You have correctly identified the central tension in the *White Horse Dialogue*: the ambiguity of the negative copula *fei* (非). The text is notoriously difficult precisely because Gongsun Long (GL) exploits the grammatical flexibility of Classical Chinese to make a semantic point look like an ontological one.

  To help you prepare for section, I will break this down into the three components you requested. My goal is to give you the logical "skeleton" of the argument so you can see where the joints move.

  ### 1. Reconstruction of the "Seeking a Horse" Argument

  The passage you quoted is the strongest part of GL's case because it moves from abstract definitions ("naming shape" vs. "naming color") to pragmatic consequences ("seeking"). Here is the argument formalized. I have annotated the sense of *fei* (is not) required for each step to hold.

  **The Argument from Differential Satisfaction**

  *   **Premise 1:** If one seeks a **horse** (*ma*), a yellow or black horse satisfies the request.
      *   *(Implicit: A white horse would also satisfy this request.)*
      *   **Sense of *fei*:** N/A (Descriptive premise).
  *   **Premise 2:** If one seeks a **white horse** (*bai ma*), a yellow or black horse does *not* satisfy the request.
      *   **Sense of *fei*:** N/A (Descriptive premise).
  *   **Premise 3 (Principle of Identity):** If Term A is identical to Term B (A *is* B), then the conditions for satisfying a request for A must be identical to the conditions for satisfying a request for B.
      *   **Sense of *fei*:** Here, "is" implies **Strict Identity** (A = B). Consequently, "is not" (*fei*) would mean **Non-Identity** (A $\neq$ B).
  *   **Observation:** The conditions for satisfying a request for "horse" (accepts yellow/black) are *not* the same as the conditions for satisfying a request for "white horse" (rejects yellow/black).
  *   **Intermediate Conclusion:** Therefore, the term "white horse" is not identical to the term "horse."
      *   **Sense of *fei*:** **Conceptual Non-Identity.** (The intension/definition of "white horse" $\neq$ the intension of "horse").
  *   **Final Conclusion:** Hence, a white horse is not a horse (*Bai ma fei ma*).
      *   **Sense of *fei*:** **Class Exclusion / Non-Membership.** (A white horse $\notin$ the class of horses).

  **The Logical Gap:**
  Notice the shift between the **Intermediate Conclusion** and the **Final Conclusion**.
  *   The premises successfully prove that the *concept* "White Horse" is not identical to the *concept* "Horse." (True: "Bachelor" is not identical to "Man," even if all bachelors are men).
  *   However, the Final Conclusion asserts that a white horse *is not a horse*. In standard logic, this implies exclusion. If $A \neq B$, it does not follow that $A$ is not a *subset* of $B$.
  *   GL treats the non-identity of the *names* as proof of the non-membership of the *actualities*.

  ### 2. Equivocation, Sophistry, and Semantic Realism

  You asked whether GL is guilty of mere wordplay (as Xunzi charged) or if a genuine semantic point survives. The answer depends on whether you view GL as a logician making a mistake or a metaphysician making a counter-intuitive claim.

  **The Charge of Equivocation (The Xunzi View)**
  Xunzi accused the School of Names of "using names to confuse actualities" (*yi ming luan shi*). From this perspective, GL is absolutely equivocating.
  *   He proves: Name("White Horse") $\neq$ Name("Horse").
  *   He concludes: Object(White Horse) $\notin$ Class(Horse).
  *   **Verdict:** This is a fallacy of equivocation on *fei*. It conflates the **is of identity** (Cicero is Tully) with the **is of predication/classification** (Cicero is a human). No serious logician today would accept the conclusion in its strong sense.

  **The Defense: A Genuine Semantic Point (The Graham/Hansen View)**
  However, if we look closer, GL might not be making a mistake but rather forcing a distinction that common language obscures.
  *   **A.C. Graham's Reading:** Graham argues GL is distinguishing between a "compound name" and a "simple name." In a system of "Rectifying Names," precision matters. If a ruler orders "Horses," he accepts any color. If he orders "White Horses," he does not. If you treat "White Horse" as simply "Horse," you fail the specific order. Thus, functionally, within the system of naming, a "White Horse" *operates* as a distinct category from "Horse."
  *   **Chad Hansen's Reading:** Hansen suggests Chinese nouns function more like mass nouns (e.g., "horse-stuff" vs. "white-horse-stuff"). "White-horse-stuff" is not identical to "horse-stuff" because it has the additional constraint of whiteness. On this mereological view, the part (white-horse-stuff) is not the whole (horse-stuff).

  **Is it Sophistry?**
  It is sophistry *only if* GL intends to deceive you about biological taxonomy. He does not. He intends to teach you about **reference**.
  *   **The Semantic Point:** The argument survives the equivocation charge if we understand the conclusion not as "White horses are not equines" but as **"The designation 'White Horse' does not map to the same set of actualities as the designation 'Horse'."**
  *   GL is arguing for the **autonomy of language**. The structure of names (*ming*) imposes structure on the world (*shi*). Because the name "White Horse" restricts the extension of "Horse," it creates a new, distinct category. To say "White Horse is Horse" is to ignore the restrictive power of the modifier "White."

  **For your section:** You can argue that GL is technically guilty of equivocation by modern logical standards, *but* that the equivocation is the vehicle for a deeper point: **Names are not transparent windows to reality; they are tools that carve reality differently.**

  ### 3. Connection to *Ming* (Names) and *Shi* (Actualities)

  Finally, you asked if this is a freestanding stunt or part of the larger *Ming-Shi* project. It is definitely the latter. The School of Names was not playing logic puzzles for fun; they were intervening in a Warring States debate about how language governs society.

  **1. The Political Stakes of Precision**
  The Confucian project of *Zheng Ming* (Rectification of Names) argued that social chaos arises when names do not match actualities (e.g., a "ruler" who does not act like a ruler). GL takes this literally.
  *   Imagine a government requisition order: "Send horses to the frontier."
  *   If the logistics officer thinks "White Horse is Horse," he might send only white horses, or he might argue that sending white horses fulfills a request for "non-white horses."
  *   GL's argument ensures that **compound designations are rigid.** If the state needs "White Horses" (perhaps for a specific ritual or terrain), the category "Horse" is insufficient. The argument enforces bureaucratic precision.

  **2. The Autonomy of *Ming***
  The *White Horse Dialogue* demonstrates that *Ming* (Names) have their own internal logic that sometimes conflicts with common sense (*shi*).
  *   Common sense says: "Of course a white horse is a horse."
  *   Logic of Names says: "The concept 'White Horse' includes 'White' + 'Horse'. The concept 'Horse' includes only 'Horse'. Therefore they are distinct entities in the realm of discourse."
  *   GL is prioritizing the consistency of the **system of names** over the fluidity of **common usage**. This is a radical claim: that language has an ontology of its own.

  **3. Why this matters for the Seminar**
  You started with Hui Shi's paradoxes (e.g., "Heaven is as low as Earth"). Hui Shi tends to collapse distinctions (everything is one). Gongsun Long does the opposite: he **multiplies distinctions**.
  *   Hui Shi: "Everything is connected."
  *   Gongsun Long: "Everything is distinct."
  *   The *White Horse Dialogue* is the manifesto of this distinction-making. It warns that if we are sloppy with our categories (collapsing "White Horse" into "Horse"), we lose the ability to discriminate accurately in the world.

  ### Summary for Section Discussion

  If you want to impress your peers and instructor, here is the "working grasp" synthesis:

  1.  **The Mechanics:** The argument relies on shifting *fei* from "is not identical to" (concepts) to "is not a member of" (classes). The "Seeking" passage proves the concepts differ because they have different satisfaction conditions.
  2.  **The Verdict:** It is an equivocation, but a **productive** one. It forces the listener to realize that "White Horse" is a compound universal, not just a subset of "Horse." It treats "White Horse" as a rigid designator.
  3.  **The Project:** This isn't just logic-chopping. It is a warning about the **Rectification of Names**. In a chaotic world, precise naming is the only way to ensure that requests (political or otherwise) are fulfilled correctly. GL is arguing that we must respect the boundaries of our categories, even when common sense wants to blur them.

  This approach allows you to acknowledge the logical flaw (showing you understand the logic) while defending the philosophical value (showing you understand the context). Good luck on Thursday.
