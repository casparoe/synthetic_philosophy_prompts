answer: |-
  Here are 9 interview questions designed to dig into the mechanics and implications of resolute choice without letting your guest retreat to standard talking points.

  **1. The Sunk Cost Rebrand**
  "Let's start with the elephant in the room. To a standard economist or cognitive psychologist, sticking to a plan when the immediate incentives have shifted to 'quit' looks exactly like the Sunk Cost Fallacy. They say you're throwing good money after bad because you're emotionally attached to past investments. You say this is rational. Is the only difference here that you're giving the 'fallacy' a normative upgrade, or is there a structural difference in how the agent processes the past cost?"

  *   **Likely Answer:** She will likely argue that the sunk cost fallacy is an *unconscious* bias, whereas resolute choice is a *deliberate* policy adopted ex-ante to maximize utility over the whole trajectory, not just the local node.
  *   **Follow-up:** "If it's deliberate, doesn't that require the agent to actively suppress their current preference? At the moment of action, if I prefer quitting but force myself to continue, aren't I violating the standard definition of rationality as 'acting on your highest ranked preference'?"

  **2. The Dollar Auction Plan & Backward Induction**
  "In the Dollar Auction, you argue a resolute agent picks a plan ex-ante and sticks to it. But *which* plan? If I plan to bid up to $5, and you plan to bid up to $10, we still crash. To pick the *optimal* ex-ante plan, don't you have to simulate the exit node to see where the loss becomes unacceptable? If you do that simulation, haven't you just smuggled backward induction back in through the side door to set the limit?"

  *   **Likely Answer:** She'll likely say you calculate the ex-ante expected utility of various policies and pick the winner, but once picked, you don't re-evaluate at the node.
  *   **Follow-up:** "But if the ex-ante calculation acknowledges that at node $4.00 you will have an incentive to deviate, and you account for that risk in your initial plan, aren't you still admitting that the node itself has normative force? How do you truly ignore the node's incentives if they influenced the plan's creation?"

  **3. The Collision of Two Resolute Agents**
  "Let's pit two resolute choosers against each other in the Dollar Auction. Agent A has resolved to bid up to $10. Agent B has resolved to bid up to $15. Neither will back down because that violates their resolution. This doesn't lead to a Nash equilibrium; it leads to mutual disaster where they burn money until one runs out. Does resolute choice only work in a vacuum, or do you have a mechanism for how two resolute agents negotiate without collapsing into a war of attrition?"

  *   **Likely Answer:** She might suggest that resolute agents would recognize this ex-ante and coordinate, or that one will have a 'higher' resolution.
  *   **Follow-up:** "If they have to coordinate ex-ante to avoid disaster, doesn't that make the 'resolution' itself dependent on the other player's strategy? That sounds a lot like the sophisticated choice game theory you're trying to avoid."

  **4. AI Commitment Races**
  "There's a lot of worry in AI safety about 'commitment races'—systems pre-committing to aggressive threats to force opponents to back down. Resolute choice sounds like the perfect engine for this: an AI that credibly signals it will carry out a threat even when it's no longer locally optimal. Are you accidentally describing the exact architecture we should be afraid of? Is a resolute AI a safe AI?"

  *   **Likely Answer:** She may argue that resolute choice allows for cooperation (like in Prisoner's Dilemma) and that threats are only bad if the initial plan was bad.
  *   **Follow-up:** "But if the 'initial plan' includes punishing defectors to maintain credibility, and the AI is resolute, it will punish even when punishment is costly and achieves nothing. How do we distinguish a 'principled resolute agent' from a 'dangerous zealot' in code?"

  **5. The Mechanism of Binding**
  "McClennen talks about this as a normative theory of rationality, not necessarily a psychological one. But for this to work, the agent needs a mechanism to bind their future self. In humans, that's willpower or pre-commitment devices. In a purely rational agent without hands to tie itself with, what *is* the binding mechanism? Is it a change in the utility function itself?"

  *   **Likely Answer:** She will probably say it's a matter of how the agent identifies itself over time (diachronic self-governance).
  *   **Follow-up:** "If the utility function changes to enforce the plan, isn't that just admitting that the preferences at time T2 are different from T1? And if so, why does T1 get to dictate T2's utility function?"

  **6. Newcomb and Functional Decision Theory**
  "This view overlaps heavily with Functional Decision Theory (FDT) and Evidential Decision Theory in cases like Newcomb's Problem. In those frameworks, you one-box because your decision determines the predictor's past action. Is resolute choice just a generalization of FDT for temporal sequences? Or is there a case where FDT says 'deviate' but Resolute Choice says 'stick'?"

  *   **Likely Answer:** She might distinguish them by saying FDT is about logical correlation, while resolute choice is about plan adherence regardless of correlation.
  *   **Follow-up:** "If there's no logical correlation forcing the adherence, and you stick to the plan anyway, aren't you essentially worshipping the past plan as a terminal value? Why is the past plan sacred?"

  **7. Regret and Diachronic Consistency**
  "Imagine your resolute agent reaches the end of the Dollar Auction. They spent $5 to win $1. They have lost $4. Their earlier self is happy because the plan was followed. Their current self is poorer. Does the agent feel regret? If they don't feel regret, they seem deluded. If they do feel regret, why wouldn't that regret update their policy for next time, effectively undoing the resolution?"

  *   **Likely Answer:** She will likely say the agent feels no regret because they evaluate outcomes from the ex-ante perspective.
  *   **Follow-up:** "So the agent is incapable of learning from negative feedback at the node level? That sounds like an agent that can't update on evidence. How is that rational?"

  **8. The "Why" of Plan Authority**
  "Standard decision theory says rationality is about satisfying preferences. You're saying rationality is about adhering to plans. Why should the *plan* have authority over the *preference*? If my preference at 2 PM is to eat cake, and my 8 AM plan was to diet, why is the 8 AM self the 'rational' one? What gives the past self sovereignty over the future self?"

  *   **Likely Answer:** She'll argue that without this sovereignty, you become a 'money pump' or fail to achieve long-term goals that require short-term sacrifice.
  *   **Follow-up:** "But isn't that just an argument for *pre-commitment devices* (like locking the cake away), which sophisticated choice already allows? Why do we need to change the definition of rationality rather than just using better locks?"

  **9. The Boundary Condition**
  "Finally, is there any case where you would advise a resolute chooser to abandon their plan? If the cost of sticking to the plan becomes infinite, or if the world changes in a way the ex-ante plan didn't model, does the resolution hold? If it breaks, what's the trigger? And if there's a trigger, aren't we back to conditional planning and backward induction?"

  *   **Likely Answer:** She might concede that 'unforeseen contingencies' allow for revision, but standard incentive shifts do not.
  *   **Follow-up:** "Who decides what counts as an 'unforeseen contingency' versus a standard incentive shift? If the agent decides at the node, haven't we just given them a loophole to be sophisticated whenever it's convenient?"
