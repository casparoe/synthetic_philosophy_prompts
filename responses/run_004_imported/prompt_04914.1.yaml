      *   *Nuance on Smart Contracts:* Fuller might actually like the clarity of code, but hate the lack of equity. Need to emphasize the *lack of discretion* as a violation of the spirit of law (congruence isn't just mechanical; it's about administrative fidelity to purpose). Actually, Fuller argues congruence requires officials to interpret rules in light of purpose. Code cannot do that.
      *   *Nuance on ML:* Hart might argue that "opaque" doesn't mean "unpromulgated." The *use* of the tool is promulgated, even if the *weights* aren't. Fuller would counter that the *rule itself* is hidden.
      *   *Tone:* Academic, analytical, respectful of both theorists.

  6.  **Final Polish:** Ensure clear headings, logical flow, and direct answers to the prompt's specific questions (How would Fuller assess? Would he say it's not law? How would Hart resist?).

  *(Self-Correction Note)*: Make sure to explicitly mention the "reciprocity" aspect for Fuller. That is central to why Smart Contracts fail for him, not just the rigidity. For ML, focus on the inability to guide conduct.

