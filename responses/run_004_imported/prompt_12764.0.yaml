answer: |-
  This is a fantastic setup. You've clearly done the reading, and since your guest is already predisposed to defend Gongsun Long against the "sophist" label, you can skip the preamble and go straight into the interpretive meat. The goal here is to let her showcase *why* this matters for the history of logic and metaphysics, not just the history of China.

  Here are 10 interview questions designed to navigate the semantics, metaphysics, and historical context of the *White Horse Dialogue* and *Hard White Stone*, complete with follow-ups based on the likely trajectory of an expert's answer.

  ### 1. The Semantics of *Fei* (Is/Is Not)
  **Question:** "The most common modern defense of Gongsun Long is that he isn't denying class membership—that a white horse is biologically a horse—but rather denying *identity*. He's arguing that the concept 'white horse' is not identical to the concept 'horse.' But in Classical Chinese, the word *fei* is doing a lot of heavy lifting here. Do you think Gongsun Long is consciously distinguishing between 'is' as predication versus 'is' as identity, or are we imposing a Fregean distinction onto a text that operates on a different linguistic intuition?"

  *   **Likely Follow-up:** "If it's the latter—if we are imposing a Western logical framework—does that weaken the argument's philosophical value, or does it actually show that these logical problems are universal regardless of the linguistic tools available?"

  ### 2. The Chad Hansen / Mass Noun Hypothesis
  **Question:** "I want to press on the linguistic structure. Chad Hansen famously argued that Classical Chinese nouns function more like mass nouns (like 'water' or 'furniture') than count nouns. If 'horse' refers to 'horse-stuff' rather than a discrete countable unit, does the 'White Horse' dialogue change from a puzzle about sets and subsets into a puzzle about parts and wholes? Does 'white horse' designate a different *kind* of stuff rather than a subset of the same stuff?"

  *   **Likely Follow-up:** "If we accept the mass noun interpretation, does that make Gongsun Long's metaphysics more nominalist (only particular stuff exists) or more realist (the 'stuff' itself is a universal)?"

  ### 3. Intension vs. Extension (The 'Seeking' Argument)
  **Question:** "One of his strongest arguments is pragmatic: if you ask for a 'horse,' a yellow one works; if you ask for a 'white horse,' it doesn't. He concludes the terms must refer to different things. This looks remarkably like a distinction between intension (the concept) and extension (the set of objects). Was Gongsun Long primarily interested in how language maps onto the world, or was he more interested in how language maps onto *other language*?"

  *   **Likely Follow-up:** "If it's about language mapping onto language, does that make him a precursor to structuralism or semiotics, rather than a metaphysician in the traditional sense?"

  ### 4. Connecting *White Horse* to *Hard White Stone*
  **Question:** "In the *Hard White Stone* dialogue, he argues that hardness and whiteness are separate because the eye sees one and the hand feels the other. He seems to be saying qualities can exist independently of the object and independently of each other. Is this the key that unlocks the *White Horse* dialogue? Is 'White Horse is not Horse' actually just a specific instance of a broader theory that 'Qualities are not Substances'?"

  *   **Likely Follow-up:** "If qualities are separable like that, where do they exist? Are we looking at a Chinese version of Platonic Forms, or is he describing a phenomenological fact about human perception?"

  ### 5. The Plato Comparison
  **Question:** "You've mentioned before that Gongsun Long gets dismissed as a sophist, but I've also seen him compared to Plato. With the Theory of Forms, Plato separates the 'Form of the Horse' from particular horses. Gongsun Long seems to separate the 'Name of Horse' from particular horses. Is the difference that Plato is doing ontology (what exists) while Gongsun Long is doing semantics (what we mean), or is that a false dichotomy in the Warring States period?"

  *   **Likely Follow-up:** "If it's a false dichotomy, does that mean for the School of Names, correcting language *was* the way to correct reality? Is logic inherently ethical for them?"

  ### 6. The Historical Dismissal (Why did he lose?)
  **Question:** "Despite the sophistication we're discussing, the School of Names largely vanished, and later Confucian historians dismissed this as 'useless disputation.' Was this dismissal purely political? Did Gongsun Long's separation of names from reality threaten the Confucian project of *Zhengming* (Rectification of Names), which relied on names having stable, social obligations attached to them?"

  *   **Likely Follow-up:** "So, was Gongsun Long 'right' logically but 'wrong' socially? Did his philosophy fail because it couldn't sustain a moral order, not because it was logically unsound?"

  ### 7. The Composition Problem
  **Question:** "Let's look at the mechanics of the compound term. Gongsun Long argues that adding 'white' to 'horse' changes the name so fundamentally that the original name no longer applies. In modern semantics, we'd say 'white' restricts the extension of 'horse.' Why does Gongsun Long treat the modifier 'white' as destroying the original category rather than just narrowing it? Is he arguing that the compound creates a *new* universal?"

  *   **Likely Follow-up:** "If the compound creates a new universal, does that lead to an infinite regress? If 'white horse' is a new universal, is 'tall white horse' another one? Did he have a limit on how many names could exist?"

  ### 8. The Mohist Canon Critique
  **Question:** "The Mohists, who were contemporaries, actually engaged deeply with logic and offered counter-arguments to the School of Names. They tended to prioritize utility and standard definitions. Do you view the Mohist critiques as a 'common sense' rebuttal that missed Gongsun Long's point, or did they successfully identify a genuine flaw in his separation of attributes?"

  *   **Likely Follow-up:** "If the Mohists were the 'analytic philosophers' of their day and Gongsun Long was the 'continental metaphysician,' does that help explain why the Mohist logic also eventually faded from the tradition?"

  ### 9. The Purpose of the Paradox
  **Question:** "Even if we grant he isn't just playing word games, what was the *goal*? In the *White Horse Dialogue*, the interlocutor keeps asking, 'What is the point of this?' and Gongsun Long never really gives a practical answer. Was the point simply to train the mind in discernment, or was there a political application? If you can convince a ruler that 'white horse is not horse,' can you also convince them that 'a minister is not a subject'?"

  *   **Likely Follow-up:** "That sounds dangerous. Is it possible the School of Names was suppressed precisely because this kind of semantic flexibility could be used to undermine political authority?"

  ### 10. Legacy and Reconstruction
  **Question:** "Finally, looking at the last century of scholarship, we've gone from viewing Gongsun Long as a nonsense writer to viewing him as a serious logician. What do you think is the biggest remaining misconception? If there's one thing you could change about how he's taught in Introduction to Philosophy courses alongside Plato and Aristotle, what would it be?"

  *   **Likely Follow-up:** "So, should we stop teaching him as a curiosity or an exotic exception, and start teaching him as part of the core canon of global logic?"

  ### Tips for the Interview Flow:
  *   **Listen for the "Universal" vs. "Particular" distinction:** If she leans heavily into Plato/Forms, use Question 5 to ground it back in language. If she leans heavily into Linguistics (Hansen), use Question 4 to pull it back to Metaphysics.
  *   **The "Fei" Trap:** Be careful with Question 1. If she says "*Fei* definitely means identity," you can pivot to Question 7 (Composition). If she says "*Fei* is ambiguous," pivot to Question 2 (Mass Nouns).
  *   **Pacing:** These are dense questions. Give her space to breathe. Since your audience is small but likely dedicated, don't fear a moment of silence while she formulates a complex answer.

  Good luck with the recording! This is a niche that deserves more attention.
