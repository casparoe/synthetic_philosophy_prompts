answer: |-
  Your friend is right about Hobbes's **ambition**, but you are right about the **reality**.

  The confusion stems from a distinction in logic that is often glossed over in political theory: the difference between a **valid** argument and a **sound** one.

  Your friend is correct that *Leviathan* is structured as a deductive system. Hobbes explicitly admired Euclid and Galileo; he wanted to do for politics what Euclid did for geometry. He starts with definitions (of man, passion, reason), moves to axioms (the laws of nature), and deduces conclusions (the necessity of the Sovereign).

  However, historians contest the argument not because they think Hobbes's *logic* is flawed (the deduction is often internally consistent), but because they reject the **soundness** of the premises. In geometry, definitions are stipulative and self-evident within the system. In Hobbes's civil philosophy, the "definitions" are actually empirical and psychological claims about human nature that are highly contestable.

  Here is why the "geometric" label doesn't settle the dispute, broken down into three key problems.

  ### 1. The Problem of "Definitions" (Stipulative vs. Empirical)
  In Euclidean geometry, a definition like "a point is that which has no part" is true by fiat. It creates the world in which the proof operates. No one can argue against it without leaving geometry.

  In *Leviathan*, Hobbes's starting "definitions" are actually claims about human psychology. For example:
  *   **Hobbes's Axiom:** Humans are fundamentally driven by a fear of violent death and a desire for self-preservation above all else.
  *   **The Critique:** Is this true? Many philosophers (like Rousseau later, or Aristotle before) argued humans are naturally social, or driven by glory, or guided by conscience.

  If you reject Hobbes's anthropological "definition," the geometric proof collapses. Historians contest the move from the State of Nature to Sovereignty because they contest the description of the State of Nature itself. If humans aren't as brutish or as radically individualistic as Hobbes claims, the "necessity" of the solution changes. A geometric proof cannot be contested if the axioms are granted; Hobbes's proof is contested because the axioms are not granted.

  ### 2. The Problem of Necessity (The Logical Gap)
  Even if we grant Hobbes's premises (that we are fearful, self-interested creatures in a war of all against all), historians argue that the conclusion (Absolute, Undivided Sovereignty) does not follow with **geometric necessity**.

  In geometry, $A + B$ must equal $C$. In politics, Hobbes argues:
  *   **Premise:** We need security to escape the State of Nature.
  *   **Conclusion:** Therefore, we must submit to an Absolute Sovereign.

  Critics point out a logical gap here. Security might require *a* government, but why must it be *absolute*? Why must it be *undivided*?
  *   **Locke's Counter-Proof:** John Locke later accepted much of Hobbes's State of Nature but argued that a limited, constitutional government could also provide security without the tyranny of absolutism.
  *   **Game Theory:** Modern political scientists often analyze Hobbes through game theory. While the "Prisoner's Dilemma" supports the need for an enforcer, it doesn't necessarily prove that a single, unchecked dictator is the only stable equilibrium.

  Because alternative political systems can logically solve the "security problem" without requiring absolutism, the step to Absolute Sovereignty is a **policy recommendation**, not a geometric inevitability.

  ### 3. The Rhetorical Function of "Science"
  Finally, many historians argue that Hobbes's insistence on geometry was rhetorical rather than methodological. Hobbes was writing during the English Civil War. The chaos of the war was fueled by competing claims of religious and moral truth.

  By framing his argument as "science" or "geometry," Hobbes was attempting to **depoliticize** his conclusion. He wanted to say, "This isn't my opinion; this is a demonstration, like $2+2=4$." He wanted to shut down debate by claiming a monopoly on truth.

  Historians contest the argument today because they recognize that "civil philosophy" is not geometry. It deals with norms, values, and contingent human behaviors, not necessary truths. The dispute persists because politics is inherently about disagreement over values (e.g., Liberty vs. Security), whereas geometry is about necessary relationships between abstract concepts.

  ### Summary
  Your friend is right that *Leviathan* **mimics** the structure of a geometric proof.
  You are right that it **fails** to achieve the certainty of one.

  The dispute persists because:
  1.  **The Axioms are Contestable:** His "definitions" of human nature are empirical claims, not logical truths.
  2.  **The Conclusion is Not Unique:** Absolute sovereignty is not the *only* logical solution to the problem of order.
  3.  **The Genre is Different:** Political philosophy deals with "ought" and "might," whereas geometry deals with "is" and "must."

  Hobbes succeeded in making political philosophy more rigorous, but he couldn't turn it into mathematics. The "geometric" certainty was a promise he could not keep, which is why historians are still arguing with him 400 years later.
