answer: |-
  This is a classic debate in the philosophy of social science, and honestly, you both landed on legitimate points that reflect how the literature actually evolved. You don't need a referee to declare a winner, because the philosophical consensus basically splits the difference between your two positions.

  Here is the settlement: **Your friend is right about Lewis's specific definition, but you are right about the theoretical trajectory.** Ullmann-Margalit's framework is a genuine *generalization* of Lewis's method, but it exposes a *definitional gap* in Lewis's account that cannot be "patched" without changing what Lewis meant by "convention."

  Here is the breakdown of why the argument stalled, and how Ullmann-Margalit (U-M) actually resolves it.

  ### 1. Lewis's Strict Definition (Where your friend is right)
  In *Convention* (1969), David Lewis defines a convention specifically as a solution to a **recurrent coordination problem**.
  *   **The Structure:** Agents have a common interest in coordinating (e.g., we both want to avoid crashing), but there are multiple equilibria (drive on left vs. drive on right).
  *   **The Crucial Condition:** Lewis explicitly requires that agents be **indifferent** between the equilibria, provided everyone chooses the same one. I don't care if we drive on the left or the right, as long as *we agree*.
  *   **The Gap:** As soon as preferences diverge (e.g., I prefer driving on the left, you prefer the right; or I want to defect on a promise, you want me to keep it), it is no longer a Lewisian coordination problem. It becomes a *Bargaining* problem (Battle of the Sexes) or a *Prisoner's Dilemma*.

  **Verdict on your friend:** She is textually correct. If you stick strictly to Lewis's 1969 definition, norms arising from conflict of interest (like property division or queueing) are **not** conventions. Lewis's machinery relies on common interest; if you introduce conflict, the "indifference" condition breaks, and the definition fails.

  ### 2. Ullmann-Margalit's Typology (Where you are right)
  In *The Emergence of Norms* (1977), U-M accepts Lewis's game-theoretic methodology but argues that "normativity" is broader than "convention." She creates a typology of three norm types:
  1.  **Coordination Norms:** (Lewisian) Everyone wants to coordinate.
  2.  **Prisoner's Dilemma (PD) Norms:** Everyone wants to defect, but a norm enforces cooperation (e.g., "don't cut in line"). This requires sanctions or internalization because the equilibrium is not naturally stable like Lewis's conventions.
  3.  **Bargaining/Inequity Norms:** Solutions to conflicts over *which* equilibrium to pick (e.g., property rights, who yields right of way at an unmarked intersection). These often rely on salience or power dynamics rather than indifference.

  **Verdict on you:** You are correct that U-M is not a "rival" account in the sense of rejecting game theory. She is building a superstructure on top of Lewis's foundation. She uses the same tools (equilibria, expectations, common knowledge) but applies them to a wider set of games. In the history of philosophy, her work is universally taught as the **extension** of the Lewisian project.

  ### 3. The Core Question: Extension or Fatal Gap?
  You asked whether U-M's framework is a genuine extension or if it exposes a gap that can't be patched. The answer is **both**.

  **It is a Genuine Extension:**
  U-M shows that the *logic* of Lewis's account (regularities sustained by expectations) can explain conflict-based norms if you change the underlying game matrix. She saves the "Lewisian Project" (explaining norms via rational choice) from the criticism that "real life involves conflict."

  **It Exposes a Definitional Gap:**
  However, you cannot simply "patch" Lewis's definition to include PD norms or Bargaining norms without breaking it.
  *   **Lewis:** Conventions are self-policing because everyone *wants* to follow them once others do.
  *   **U-M (PD Norms):** Norms often require *external* policing (sanctions) or moral internalization because people *don't* want to follow them (they want to defect).

  If you try to call a PD-norm a "Lewisian Convention," you lose the explanatory power of Lewis's theory. Lewis explains stability through *interest*; U-M explains stability through *sanctions/normativity*.

  ### 4. Who "Won" the Argument?
  Here is how you should settle it with your friend:

  **Tell your friend:** "You are right that Lewis's *definition* of convention excludes conflict. Lewis requires indifference between equilibria. If there is a conflict of interest over who yields right of way, strictly speaking, that isn't a Lewisian convention."

  **But then add:** "However, I am right that Ullmann-Margalit isn't proving Lewis 'wrong,' she is proving him 'incomplete.' She takes Lewis's game-theoretic engine and puts it in a bigger car. She shows that while not all norms are Lewisian conventions, all norms (including conflictual ones) can be analyzed using the equilibrium/expectation framework Lewis pioneered."

  ### The Philosophical Bottom Line
  The field eventually moved toward **Cristina Bicchieri's** later work (*The Grammar of Society*), which synthesizes this. Bicchieri argues that what matters isn't the game type (Coordination vs. PD), but the **empirical expectations** (what I think you will do) and **normative expectations** (what I think you think I *should* do).

  *   **Lewis** focused mostly on empirical expectations in coordination games.
  *   **U-M** showed that normative expectations are required for conflict games.

  **Final Ruling:**
  *   **Friend's Score:** 1 point for exegesis (accurate reading of Lewis).
  *   **Your Score:** 1 point for theory (accurate reading of the field's development).
  *   **The Reality:** U-M exposes a gap in Lewis's *scope*, but validates his *method*. It's not a rival account; it's the necessary grown-up version of Lewis's account.

  Tell your friend to buy you a drink, because you both essentially reconstructed the 1970s philosophy of social science debate in 45 minutes. That's a win for both of you.
