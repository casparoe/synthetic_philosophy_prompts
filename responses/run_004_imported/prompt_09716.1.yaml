      *   **The Task:** Settle the debate. Compare Lewis and Ullmann-Margalit. Determine if U-M is a genuine extension or if she exposes a fatal gap in Lewis's coordination-equilibrium thinking.

  2.  **Deconstruct the Philosophical Positions:**

      *   **David Lewis (*Convention: A Philosophical Study*, 1969):**
          *   *Core Idea:* Conventions are solutions to *recurrent coordination problems*.
          *   *Structure:* Agents have common interests. There are multiple equilibria (e.g., drive on left vs. drive on right). Agents are *indifferent* between the equilibria, provided everyone coordinates on the *same* one.
          *   *Key Condition:* Common knowledge of the regularity, the preferences, and the expectations.
          *   *Limitation (as identified by critics):* Strictly speaking, Lewisian conventions require near-identical preferences over outcomes. If I prefer Left/Left and you prefer Right/Right, it's not a Lewisian convention; it's a conflict.

      *   **Edna Ullmann-Margalit (*The Emergence of Norms*, 1977):**
          *   *Core Idea:* Norms emerge from various game-theoretic structures, not just pure coordination.
          *   *Typology:*
              1.  *Coordination Norms:* (Lewisian) Everyone wants to coordinate.
              2.  *Prisoner's Dilemma (PD) Norms:* Everyone wants to defect, but a norm enforces cooperation (e.g., queueing, not polluting). This requires sanctions or internalization.
              3.  *Bargaining/Inequity Norms:* Solutions to games with conflict over *which* equilibrium to pick (e.g., Battle of the Sexes, property division). One side yields to the other based on salience or power.
          *   *Relation to Lewis:* She explicitly positions her work as generalizing the game-theoretic approach to norms, starting where Lewis left off.

  3.  **Evaluate the "Extension vs. Gap" Question:**

      *   *Is U-M an extension?* Yes, in the sense that she uses the same methodological toolkit (game theory, equilibrium analysis, expectations) but applies it to a wider set of games (PD, Battle of the Sexes) than Lewis's strict Coordination Games.
      *   *Does it expose a gap?* Yes, in the sense that Lewis's *specific definition* of "convention" excludes PD norms and Bargaining norms. If you stick rigidly to Lewis's 1969 text, U-M is talking about *norms*, not *conventions*.
      *   *The Crux:* The friend is technically right about Lewis's *definition*. Lewis requires indifference between equilibria. U-M is right that the *framework* (equilibrium + expectations) can handle conflict. The user is right that U-M is building *on* Lewis, not destroying him.
      *   *Synthesis:* Lewis defined a specific subset of norms (conventions). U-M showed that "normativity" is broader. Later philosophers (like Bicchieri or Skyrms) often blend them. The "gap" is in Lewis's *terminology*, not necessarily the *methodology*. However, the friend has a strong point: you can't just call a PD-solution a "Lewisian Convention" without stretching Lewis's definition until it breaks.

  4.  **Drafting the Response:**

      *   **Tone:** Informative, balanced, slightly academic but accessible (since they were arguing for 45 mins, they know the basics). Acknowledge both were partially right.
      *   **Section 1: Lewis's Strict Definition.** Clarify the "indifference" condition. This validates the friend's point.
      *   **Section 2: Ullmann-Margalit's Typology.** Explain the three types (Coordination, PD, Bargaining). This validates the user's point about her framework.
      *   **Section 3: The Verdict (Extension or Gap?).**
          *   *Terminological Gap:* Lewis's "Convention" $\neq$ U-M's "Norm".
          *   *Methodological Extension:* U-M uses Lewis's logic (equilibria, expectations) but expands the game types.
          *   *The "Conflict" Issue:* Lewis actually acknowledged bargaining problems later (and in footnotes), but his core definition excludes them. U-M makes this explicit.
      *   **Section 4: Who "Won"?**
          *   Friend: Right that Lewis's *strict definition* doesn't cover conflict.
          *   User: Right that U-M is a natural *successor* project that saves the game-theoretic approach.
          *   *Nuance:* It's not a "patch" on Lewis; it's a generalization. Calling PD norms "Lewisian Conventions" is wrong. Calling them "Game-Theoretic Norms in the Lewisian Tradition" is right.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, did Lewis change his mind?* In later work ("Languages and Language"), Lewis loosened things slightly, but *Convention* (1969) is the benchmark. Stick to the 1969 text for the definition.
      *   *What about property rights?* This is a classic "Bargaining" problem (Battle of the Sexes structure). Lewis struggles here without adding salience/focal points. U-M handles this via "inequity norms."
      *   *Is it a "fatal" gap?* Not fatal to game-theoretic accounts of norms, but fatal to the idea that *all* norms are Lewisian conventions.
      *   *Key Distinction:* Conventions vs. Norms. Lewis talks about Conventions. U-M talks about Norms. All Lewisian conventions are norms, but not all norms are Lewisian conventions.

