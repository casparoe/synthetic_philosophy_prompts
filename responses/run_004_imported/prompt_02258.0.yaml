answer: |-
  You have hit on something very sharp here. Your intuition is correct: the approach you described **is** the dominant framework in the literature on moral uncertainty. It is known as **Maximizing Expected Choice-Worthiness (MEC)**.

  Philosophers like William MacAskill (in his thesis *Normative Uncertainty*), Toby Ord, and Andrew Sepielli have explicitly formalized moral uncertainty using decision-theoretic tools that look almost exactly like Bayesian Model Averaging (BMA). If you read MacAskill's work, you will find equations that look very familiar to a data scientist: credences assigned to theories, choice-worthiness functions outputting values, and an expectation operation over them.

  So, you aren't missing the solution, and philosophers aren't ignoring the ML analogy. The reason this remains a "hard, open problem" rather than a settled technique is that when you try to implement this "ethical ensemble," you run into technical hurdles that don't exist (or are solved differently) in standard statistical modeling.

  Here are the four specific reasons why the ML analogy breaks down and why this is still a contested research frontier.

  ### 1. The Intertheoretic Comparison Problem (The "Scale" Issue)
  In ML ensembling, all models output predictions on the same scale (e.g., probability of class 1, or a loss value). If Model A predicts 0.9 and Model B predicts 0.1, you can average them.

  In ethics, different theories do not necessarily speak the same "language" of value.
  *   **Utilitarianism** might measure value in "welfare units," where saving a life is +1,000,000 units.
  *   **Kantian Deontology** might measure value in "duty adherence," where lying is a binary violation (0 or 1) regardless of consequences.
  *   **Virtue Ethics** might measure "flourishing" on a completely different ordinal scale.

  If you assign 50% credence to Utilitarianism and 50% to Deontology, how do you combine them? If the Utilitarian scale is 0–1,000,000 and the Deontological scale is 0–1, the Utilitarian view will mathematically dominate the ensemble regardless of your credences. This is analogous to feeding a neural network features with wildly different variances without normalization.

  **The Philosophical Problem:** There is no "god's eye view" to normalize these scales. To normalize them, you need a *meta-theory* of value comparison. But if you are uncertain about first-order ethics, why should you be certain about the meta-ethics required to compare them? This leads to a regress problem.

  ### 2. The Normalization Problem (Variance Voting)
  In your field, you might normalize features or calibrate model probabilities based on validation performance. In moral uncertainty, we lack a "validation set." We cannot check which ethical theory predicted the "true moral outcome" of history, because moral truth isn't empirically observable in the same way weather is.

  Without a validation set, how do you normalize?
  *   **Range Normalization:** Set the best and worst options for each theory to 1 and 0. (Problem: Sensitive to the option set available).
  *   **Variance Normalization:** Scale theories so they have equal variance. (Problem: Punishes theories that think stakes are actually high).

  This is currently a major debate in the literature. Some (like MacAskill) have proposed variance normalization, but others argue this arbitrarily dampens theories that claim the stakes are objectively higher. In ML, we care about predictive accuracy; in ethics, we care about *correctness*, but we can't measure correctness independently of the theories themselves.

  ### 3. The Fanaticism Problem (Pascal's Mugging)
  You are likely familiar with Pascal's Mugging from Rationalist spaces. This problem becomes acute in moral uncertainty ensembling.

  Imagine you have 99% credence in standard Utilitarianism and 1% credence in a "Fanatical Theory" that says there is a tiny probability of creating an infinite amount of value (e.g., via theological salvation or infinite population ethics).
  *   Standard Utilitarianism: Expected value = 100.
  *   Fanatical Theory: Expected value = $\infty \times \epsilon$.

  Even with 1% credence, the infinite value dominates the ensemble. The "model average" tells you to ignore all finite concerns to chase the infinite payoff. In ML, we handle outliers with robust loss functions or clipping. In ethics, clipping values feels like arbitrarily deciding that some moral truths "don't count" if they are too big, which violates the axioms of the very theories you are trying to respect.

  This is not just theoretical; it impacts cause prioritization in EA. If you assign non-zero credence to theories involving infinite futures, they swamp all near-term altruism.

  ### 4. The "Ground Truth" Feedback Loop
  In ML, ensembling works because we assume there is a true data-generating process, and we get feedback (loss) that allows us to update weights over time (online learning).

  In moral uncertainty:
  1.  **No Ground Truth:** We don't know if there *is* a true moral theory (moral realism vs. anti-realism). If moral anti-realism is true, "moral uncertainty" is category error—you're averaging over preferences, not truths.
  2.  **No Feedback:** When you act on your moral ensemble, you don't get a "moral loss signal" back. You only get empirical consequences. You can't update your credence in Kantianism based on whether the world blew up, because Kantianism might say blowing up was preferable to violating a duty.

  Without a feedback loop, you cannot dynamically re-weight your ethical models based on performance. You are stuck with your priors, which makes the initial weighting critically important and philosophically contentious.

  ### Summary: Why it's still an "Open Problem"
  The reason philosophers treat this as hard isn't because they haven't thought of BMA. It's because **BMA requires a common currency and a validation metric, and ethics provides neither.**

  *   **ML:** Models output probabilities of the *same event*.
  *   **Ethics:** Theories output evaluations of *different properties* (welfare vs. duty vs. virtue).

  **Current State of the Art:**
  The field has moved past "Should we do this?" to "How do we fix the normalization/fanaticism bugs?"
  *   **Stochastic Dominance:** Some philosophers (like Hayden Wilkinson) are exploring decision rules that don't require cardinal intertheoretic comparison, relying instead on stochastic dominance (a weaker condition).
  *   **Parliamentary Models:** Instead of a mathematical average, some propose a "negotiation" model where theories bargain for influence (analogous to multi-agent reinforcement learning).
  *   **Metanormative Inquiry:** Research into whether we can justify normalization principles without begging the question.

  **Verdict:**
  Your instinct is excellent. The "Expected Choice-Worthiness" framework *is* the application of Bayesian model averaging to ethics. The reason it remains a "contested problem" is that the engineering challenges of aligning the output layers of Kant, Mill, and Aristotle are significantly harder than aligning XGBoost and a Neural Net, primarily due to the lack of a shared loss function and ground truth.

  If you want to read more on the technical side of this, look up **William MacAskill's *Normative Uncertainty*** (2014) or **Toby Ord's work on moral uncertainty**. You will likely find yourself nodding at the setup, then furrowing your brow at the normalization constraints—exactly where the interesting work is happening.
