      *   If $P(E) = 1$, then $P(H|E) = P(E|H)P(H)$.
      *   Crucial step: If $H$ entails $E$ (which is usually the case in POE, like GR entails Mercury's precession), then $P(E|H) = 1$.
      *   Result: $P(H|E) = 1 \cdot P(H) = P(H)$. No confirmation.
      *   *Why it matters:* It's not just about "updating." It's about the *measure* of confirmation. If Bayesianism is a normative theory of rational belief change, and rational scientists *did* increase confidence in GR due to Mercury, but the math says they *couldn't* have (rationally), then the math is failing to capture rationality. It threatens the descriptive and normative adequacy of the framework.

  3.  **Part 2: The Main Lines of Response.**
      *   **Strategy A: Relax Logical Omniscience (The Garber Solution).**
          *   *Idea:* Agents aren't logically omniscient. They know $E$, but they don't know *that $H$ entails $E$* until the theory is developed.
          *   *Mechanism:* Introduce a new sentence $K$ = "$H$ entails $E$".
          *   *Update:* We don't conditionalize on $E$ (since $P(E)=1$). We conditionalize on $K$ (the discovery of the link).
          *   *Math:* $P(H|K) > P(H)$.
          *   *Vibe:* Psychological/Epistemic realism.
      *   **Strategy B: Counterfactual/Historical (The "What If" Approach).**
          *   *Idea:* Ignore the actual $P(E)=1$. Ask: What would my credence in $H$ be if I *didn't* know $E$?
          *   *Mechanism:* Construct a counterfactual prior $P^*$. In $P^*$, $P^*(E) < 1$.
          *   *Update:* Calculate $P^*(H|E)$. If $P^*(H|E) > P^*(H)$, then $E$ confirms $H$.
          *   *Vibe:* Objective/Structural relation between H and E, independent of the agent's timeline.

  4.  **Part 3: Why are these unsatisfying? (The Residual Worries).**
      *   *Critique of Garber (Logical Omniscience):*
