          *   **Arbitrariness:** There are many ways to construct the counterfactual prior $P^*$. Different reconstructions yield different confirmation values. Which one is the "real" confirmation?
          *   **Irrelevance to Actual Belief Change:** It tells us about a hypothetical scenario, not why *actual* scientists changed their minds *now*. It explains the *potential* support, not the *temporal* dynamics of discovery.

