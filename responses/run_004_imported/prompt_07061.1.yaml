          *   Ross-Littlewood: Set membership. We track specific objects. The limit of the *set* is the empty set, even if the limit of the *cardinality* is infinite.
      *   *Determinacy:*
          *   Thomson: Truly indeterminate based *only* on the switching history. Physical laws (continuity) might impose a state, but logical description doesn't.
