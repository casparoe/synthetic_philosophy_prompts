prompt: |-
  okay so my friend and I got into a whole arguement last night about the handicap principle and neither of us backed down. She kept insisting that for a signal to be evolutionarily honest it actually has to be costly to the animal doing the signalling -- like the peacock's tail really does have to hurt its own odds of survival, otherwise cheap fakers would swamp the system. I said that's not really what the formal models require anymore: Grafen's ESS version of the handicap principle just needs the marginal cost (or benefit) of signalling to differ between high- and low-quality individuals, not that honest signallers pay some big net cost overall -- and that there's a whole line of pushback (Getty and others) arguing you can get stable, honest signalling without the honest signaller paying any real cost in equilibrium at all, just that cheating would've been expensive. Write me an essay that actually settles which one of us is closer to right. Walk through Zahavi's original idea, what Grafen's formalization actually demands, and the "cost doesn't have to be paid" objection, then commit to an actual answer instead of just laying out both sides evenhandedly. Bonus points if you connect it to Spence's signalling model in job markets and say whether the same confusion shows up there too.
