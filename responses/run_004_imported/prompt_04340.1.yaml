answer: |-
  The research program on Embedded Agency, advanced by Scott Garrabrant, Abram Demski, and colleagues at the Machine Intelligence Research Institute (MIRI), challenges the foundational assumptions of classical decision theory. Standard models, exemplified by Marcus Hutter's AIXI or classical Bayesian expected utility maximization, rely on a "Cartesian" boundary: a clean separation between the agent and the environment. In this picture, the agent is an uncomputable or hyper-computable entity observing and acting upon a computable world from the outside. Embedded agency rejects this dualism, positing that the agent is a physical subsystem of the environment it seeks to model. This shift is not merely ontological; it generates specific technical obstacles that cannot be resolved by simply adding more computing power or better priors.

  This essay compares the Cartesian and Embedded conceptions of agency through the lens of two specific technical hurdles: the Löbian obstacle to self-trust and the problem of logical uncertainty. It argues that these difficulties cannot be dismissed as mere environmental uncertainty within a Cartesian framework. Finally, it defends the view that embeddedness imposes a genuinely new limitation on formal theories of rationality, transforming ancient epistemological puzzles into concrete constraints on the design of optimizing systems.

  ### The Cartesian Cut and the Embedded Reality

  In the Cartesian picture, the agent is distinct from the environment. AIXI, for instance, considers all computable environments consistent with its history, weights them by simplicity (Solomonoff prior), and selects actions that maximize expected reward. Crucially, AIXI assumes it can simulate the environment perfectly to predict outcomes. This implies the agent must be "larger" or more powerful than the environment it models. The agent's own source code is not part of the environment; it is the lens through which the environment is viewed, not an object within it.

  The embedded agent, by contrast, is a proper part of the causal graph. It has bounded computational resources and must reason about a world that contains itself. To make decisions, it must model the consequences of its actions, which includes modeling its own reasoning process. This creates a self-referential loop: the model must contain a model of itself. In set-theoretic terms, this violates the axiom of regularity; in computational terms, it invites diagonalization and infinite regress.

  ### (a) The Löbian Obstacle to Self-Trust

  The first major divergence concerns an agent's relationship with its own future reasoning. In classical decision theory, an agent can plan for the future by simulating its future self. If the agent is rational now, it assumes its future self will also be rational, allowing for consistent long-term planning.

  For an embedded agent, particularly one capable of self-modification, this assumption is fraught. The agent must verify that its future self (or a successor agent it builds) will pursue its current goals. This requires the current agent to prove the soundness of the future agent's reasoning system. However, Löb's Theorem states that for a sufficiently strong formal system $T$, if $T$ proves "If $T$ proves $P$, then $P$," then $T$ proves $P$. A corollary is that a consistent system cannot prove its own soundness. If an agent tries to prove that its future actions will be good based on its own logic, it runs into a consistency barrier: it cannot formally trust its own proofs without becoming inconsistent.

  **Why this is not Environmental Uncertainty:**
  A Cartesian proponent might argue that the reliability of the future self is just another empirical uncertainty, like the reliability of a robot arm. One could assign a probability $P(\text{future self is sound}) < 1$. However, this fails to capture the structural nature of the problem. The Löbian obstacle is not about hardware failure or external noise (empirical uncertainty); it is about the logical relationship between the agent and its own inference rules. Even in a noiseless vacuum, a formal system cannot validate its own consistency. Treating this as environmental uncertainty assumes the agent can stand outside its own logic to assign a probability to it. But an embedded agent *is* its logic. It cannot form a probability distribution over its own soundness using its own reasoning without invoking the very trust issues Löb's theorem prohibits. The uncertainty is internal to the reasoning architecture, not external in the environment.

  ### (b) Logical vs. Empirical Uncertainty

  The second divergence concerns the nature of what is unknown. Standard Bayesian rationality assumes logical omniscience: if an agent knows the axioms of arithmetic, it is assumed to know all theorems derivable from them. Uncertainty is purely empirical (indexical or contingent), concerning which possible world is actual.

  An embedded agent is logically non-omniscient. It knows its source code, but it cannot immediately know the output of that code for all inputs due to bounded compute. It faces "logical uncertainty": uncertainty about mathematical or logical facts that are fixed but computationally inaccessible (e.g., "What is the $10^{100}$th digit of $\pi$?" or "Does my code halt on this input?").

  **Why this is not Environmental Uncertainty:**
  In the Cartesian framework, one might try to treat logical facts as environmental facts. For example, the digit of $\pi$ could be treated as a hidden variable in the environment. This fails because logical facts are necessary truths, not contingent ones. In standard probability theory (Kolmogorov), if $A$ implies $B$, then $P(B) \ge P(A)$. If an agent knows the axioms, it must assign probability 1 to all theorems. If we treat logical facts as empirical, we allow the agent to assign $P(\text{theorem}) = 0.5$, which violates the laws of probability relative to the agent's knowledge base.

  More critically, logical uncertainty is about the agent's relationship to its own cognitive output. In AIXI, the agent simulates the environment to find the best action. If the "environment" includes the logical consequences of the agent's own code, the agent must simulate itself to determine its action. This leads to the same self-reference paradoxes as the Löbian obstacle. You cannot treat the output of your own reasoning as an external observation, because the reasoning process *generates* the observation. Absorbing logical uncertainty into environmental uncertainty requires the agent to be logically larger than the logic it is using, returning us to the impossible Cartesian assumption.

  ### Defense: A Genuinely New Limitation

  Does embeddedness impose a genuinely new limitation on formal theories of rationality, or does it merely restate older philosophical problems about self-reference and the limits of self-knowledge in formal dress?

  It is undeniable that the mathematical roots of these problems are old. Löb's Theorem (1955), Gödel's Incompleteness Theorems (1931), and Tarski's Undefinability of Truth (1936) established long ago that systems cannot fully contain themselves. Philosophers from Kant to Wittgenstein have grappled with the limits of the subject knowing itself. Viewed through this lens, the Embedded Agency program might seem like a redundant re-discovery of limitative results, applied to AI.

  However, I defend the view that embeddedness imposes a **genuinely new limitation on formal theories of rationality**. The distinction lies in the shift from *epistemology* to *decision theory*.

  Classical limitative results were primarily epistemological: they described what cannot be *known* or *proved*. They were often viewed as abstract curiosities with little bearing on practical reasoning. Standard decision theory (von Neumann-Morgenstern, Savage, AIXI) proceeded by ignoring these limits, assuming an idealized agent that could transcend them via the Cartesian cut. This was not merely a simplification; it was a structural error that rendered the theory inapplicable to any physical optimizer.

  Embedded agency demonstrates that these epistemological limits translate directly into *decision-theoretic pathologies*. It is not just that the agent cannot know its own consistency; it is that it cannot *act* optimally if it attempts to reason about itself using standard tools. The "Procrastination Paradox" (where an agent delays acting because it cannot prove its future self will act) is a failure of agency, not just knowledge.

  Therefore, this is a new limitation because it invalidates the axioms of standard rationality for physical systems. Previous theories assumed that "rationality" was a unique, well-defined function mapping beliefs to actions. Embedded agency shows that for a subsystem of the world, there is no coherent definition of "optimal action" that relies on self-modeling via standard logic. It forces the development of new formalisms (such as Logical Induction or Functional Decision Theory) that explicitly relax logical omniscience and handle self-reference without diagonalization.

  In conclusion, while the mathematical barriers are historically rooted, their identification as blockers for *rational agency* is novel. The Cartesian picture was not just an idealization; it was a concealment of a fundamental incompatibility between standard decision theory and physical reality. Embedded agency reveals that a theory of rationality for real-world systems cannot simply be a theory of ideal inference applied to data; it must be a theory of bounded, self-referential computation. This imposes a new constraint: rationality must be defined not by optimality relative to a truth that cannot be held, but by coherence within a system that cannot fully see itself.
