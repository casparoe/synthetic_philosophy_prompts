          *   Why not environmental uncertainty? It's not about "maybe my hardware will fail" (empirical). It's about "even if hardware works, my logic cannot validate itself." It's structural, not contingent.

      *   **Section 3: Logical Uncertainty (Task 1b):**
          *   Standard Prob Theory: $P(A \lor \neg A) = 1$. If $A \to B$, then $P(B) \ge P(A)$. Assumes logical omniscience.
          *   Embedded Agent: Bounded compute. Doesn't know consequences of its own code immediately.
          *   Cartesian view: Treat logical facts as environmental facts? No, because logical facts are necessary, not contingent. AIXI deals with contingent sequences.
          *   Why not environmental? You can't have a prior over logical truths in the standard sense because they aren't random variables; they are fixed but unknown due to compute bounds.

      *   **Section 4: Why Cartesian Absorption Fails (Task 2):**
          *   Attempt: "Just model yourself as part of the environment."
