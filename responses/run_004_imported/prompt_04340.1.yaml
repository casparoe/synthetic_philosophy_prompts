          *   It moves from epistemology to decision theory. The "limitation" is not just on knowledge, but on *self-trust and self-modification* which is crucial for AGI. So, it's a new limitation on *formal theories of rationality* (which previously ignored this), even if the underlying math (Gödel) is old.
