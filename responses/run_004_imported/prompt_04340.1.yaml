  *(Self-Correction on the "New vs. Old" verdict)*: If I say it's just old philosophy, I undermine the MIRI research program's significance. If I say it's entirely new, I ignore Gödel. The sweet spot is: It identifies a *category error* in previous decision theory. Previous theory wasn't "wrong" for humans, but it's "wrong" for AI. So it's a new limitation on *formal theory* intended for AI. I will argue it is a **genuinely new limitation on formal theories of rationality** because it demonstrates that the axioms of standard rationality are inconsistent with physical reality for optimizing systems, moving the problem from metaphysics to engineering constraints.

