  The views that manage to block the "torture for specks" conclusion without breaking the laws of logic (transitivity) or ignoring numbers entirely (Taurek) tend to sit at the top. Views that are logically consistent but yield repugnant conclusions, or views that save intuitions by breaking logic, sit lower. Meta-ethical evasions rank lowest as solutions to the object-level problem.

