answer: |-
  This is a fantastic question, and coming from someone with four decades of lab experience, your intuition is spot on: Hobbes's stubbornness wasn't merely the vanity of an old man. It was structural. It was baked into the very epistemology that made him one of the greatest political philosophers in history.

  If you transported Ferdinand von Lindemann to 1660 and showed Hobbes the proof that $\pi$ is transcendental, Hobbes would almost certainly have rejected it. Not because he was stupid—he was a formidable intellect—but because Lindemann's proof violates almost every axiom of Hobbes's philosophy of science.

  Here is why Hobbes would have thrown Lindemann's proof in the fire, and why his stubbornness was a feature, not a bug, of his system.

  ### 1. Geometry as Kinematics, Not Abstraction
  To understand Hobbes's reaction, you have to grasp his radical definition of what geometry *is*. For Euclid or Wallis, geometry was about relationships between magnitudes. For Hobbes, geometry was **physics**.

  In *De Corpore*, Hobbes argues that we only have true "science" (certain knowledge of causes) when we generate the object ourselves. We know the circle because we know the motion that creates it: a point fixed at one end, rotating at the other.
  *   **The Hobbesian Axiom:** Truth is found in *construction*. If you can't describe the motion that generates the figure, you don't understand it.
  *   **The Conflict:** Lindemann's proof is algebraic and analytic. It deals with numbers, polynomials, and complex exponentials. To Hobbes, this was not geometry; it was what he derisively called "the scab of symbols." He hated the new algebraic analysis (championed by Viète and Oughtred, and used by Wallis) because it detached mathematics from physical magnitude.

  If you showed Hobbes Lindemann's proof, he wouldn't see a proof about circles. He would see a parlor trick with numbers. He would argue that you haven't proven anything about *magnitude* or *motion*, only about the behavior of abstract symbols. He would likely claim Lindemann proved that *numbers* can't square the circle, but that a physical construction (which he believed he had) still could.

  ### 2. The Impossibility of "Negative" Truth
  Your background is in empirical science, where a null result is a valid result. If an experiment proves a hypothesis false, you update the model. Hobbes's rationalism didn't work that way.

  For Hobbes, scientific knowledge is knowledge of **causes**. You know *why* something is true because you can trace the generation of the truth.
  *   **Positive Knowledge:** "I know this square is equal to this circle because I constructed it via this specific motion."
  *   **Negative Knowledge:** "I know this cannot be done."

  Hobbes was deeply suspicious of negative proofs. In his materialist worldview, to say something is *impossible* requires a knowledge of all possible motions and configurations, which borders on the divine. If he believed he had a construction (even a flawed one), he believed he had identified a cause. A proof that says "no cause can exist" would strike him as a failure of imagination or a trick of language, not a discovery of fact. He famously accused Wallis of teaching "words without meaning." To Hobbes, an impossibility proof was just a complex way of saying words without meaning.

  ### 3. The Systemic Stakes: Politics Depends on Geometry
  This is the most critical point. Hobbes's ego was involved, yes, but his entire philosophical system relied on geometry being the gold standard of certainty.

  Hobbes wanted to do for civil philosophy what Euclid did for geometry. He wanted to derive the necessity of the Sovereign from first principles with the same inevitability that $a^2 + b^2 = c^2$.
  *   **The Chain:** Physics (Motion) $\rightarrow$ Geometry (Certain Science) $\rightarrow$ Human Nature $\rightarrow$ Politics (Leviathan).
  *   **The Risk:** If Geometry is not certain, then the method Hobbes uses to justify absolute monarchy collapses into mere opinion.

  If Hobbes admits Wallis (and by extension, Lindemann) is right, he admits that his model of "science as demonstration" is flawed. He admits that human reasoning can construct a coherent argument that is nevertheless factually wrong. That is a terrifying concession for a philosopher building a system on the premise of absolute, indisputable rational certainty. He *couldn't* yield on the circle without undermining the *Leviathan*.

  ### 4. The "Scientist" vs. The "Philosopher"
  As a lab scientist, you operate in a Popperian world: theories are provisional and falsifiable. Hobbes operated in a Aristotelian/Euclidean world: science is deductive and eternal.

  When Wallis refuted Hobbes, he used the methods of the emerging scientific revolution (empirical verification, peer consensus, algebraic rigor). Hobbes was actually a reactionary in this regard. He was trying to save a vision of science as **private rational certainty** rather than **public empirical verification**.

  When you spend 40 years in a lab, you learn to trust the apparatus over the intuition. Hobbes spent 40 years trusting his intuition over the apparatus (in this case, the logical apparatus of the mathematical community). He believed that because he *saw* the truth in his mind through reasoning, the collective error of the mathematicians was a social failing, not an epistemic one. He famously suggested that the mathematicians were a "club" protecting their turf.

  ### The Verdict
  If you showed Hobbes Lindemann's proof:

  1.  **He would reject the method:** He would dismiss the algebraic/analytic approach as non-geometric and therefore irrelevant to the problem of magnitude.
  2.  **He would reject the conclusion:** He would likely argue that the proof shows a limitation of *numbers*, not a limitation of *construction*.
  3.  **He would double down:** He would likely attempt to translate Lindemann's symbols back into geometric terms, find a place where the physical intuition "broke" the symbolic logic, and claim victory.

  His stubbornness wasn't just ego; it was **philosophical consistency**. To accept he was wrong about the circle would be to accept that his definition of "knowledge" was wrong. And for Hobbes, that was the one thing he couldn't afford.

  It's a tragic irony: The man who taught us that life without authority is "nasty, brutish, and short" spent his final decades in a nasty, brutish, and short pamphlet war, refusing to submit to the authority of mathematical proof. He sought certainty in geometry to save us from chaos, but his inability to accept refutation showed that even the greatest rationalists are vulnerable to the very human need to be right.
