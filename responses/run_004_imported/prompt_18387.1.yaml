answer: |-
  This is a fantastic question that cuts to the heart of the difference between **epistemic rationality** (tracking truth) and **moral pragmatics** (managing social/normative relationships).

  The short answer is: **Neither side needs to give way.** The critical-thinking curriculum and the moral philosophers are talking about two different distinct logical categories. The confusion arises because introductory logic courses treat all argumentation as *truth-tracking*, whereas the literature on standing treats blame as a *speech act* with felicity conditions.

  Here is how you reconcile your LessWrong-honed intuition with the philosophical literature on standing.

  ### 1. Truth Conditions vs. Felicity Conditions

  In your critical thinking class, you were taught to evaluate arguments based on **truth conditions**.
  *   **Claim:** "Policy X is harmful."
  *   **Question:** Is Policy X actually harmful?
  *   **Relevance:** The speaker's behavior is irrelevant to the truth value of the claim. If a chain-smoker says "smoking causes cancer," they are telling the truth. Dismissing the claim because they smoke is indeed the *tu quoque* fallacy.

  The philosophers you found (Wallace, Cohen, etc.) are evaluating **felicity conditions** (a concept from J.L. Austin's speech act theory).
  *   **Act:** "I blame you for doing Y."
  *   **Question:** Does this speaker have the authority/license to perform this speech act?
  *   **Relevance:** The speaker's behavior is *highly* relevant to their authority. If a chain-smoker angrily blames a teenager for smoking, the blame may be factually grounded but pragmatically infelicitous.

  The *tu quoque* fallacy warns you not to confuse the speaker's virtue with the proposition's truth. The "standing to blame" literature warns you not to confuse the proposition's truth with the speaker's authority to enforce it.

  ### 2. Why Hypocrisy Undermines Standing (Without Denying Truth)

  R. Jay Wallace's work, specifically, argues that blame is not merely a description of a moral violation; it is a **moral demand**. When you blame someone, you are implicitly claiming a certain relationship to the norm you are invoking. You are saying, "We are both subject to this norm, and I am holding you accountable to it."

  Hypocrisy undermines this in three specific ways that are not fallacious to point out:

  **A. The Commitment Condition**
  To blame someone sincerely, you must be committed to the norm yourself. If you violate the norm you are invoking, you signal that you aren't actually committed to the norm, but are using it instrumentally (e.g., to gain power or attack an enemy). Pointing this out doesn't say the norm is invalid; it says the *blamer* is not acting in good faith.

  **B. The Moral Equality Condition**
  Blame implies a kind of moral hierarchy: "I am upholding the standard; you have fallen below it." Hypocrisy collapses this hierarchy. If I do the same thing you do, I am not "above" you; I am your accomplice. As G.A. Cohen argued regarding terrorists, those who engage in violence lose the standing to condemn violence because they have rejected the very normative framework that makes condemnation possible.

  **C. The Waste of Time (Pragmatic) Condition**
  From a rationalist perspective, engagement should be cashed out in expected utility. Engaging with a hypocrite is often low-utility. If a politician preaches austerity while spending lavishly, they have revealed that *they do not believe austerity is necessary.* Therefore, arguing with them about the merits of austerity is pointless. They aren't operating in the "truth-seeking" mode; they are operating in the "power-seeking" mode. Disengaging isn't a logical error; it's a strategic update.

  ### 3. The Legal Analogy: "Unclean Hands"

  The easiest way to visualize this is the legal doctrine of **unclean hands**.
  If you sue someone for breach of contract, but you yourself breached the contract first, the court may dismiss your case.
  *   **Does this mean the contract is void?** No.
  *   **Does this mean the defendant didn't breach?** No.
  *   **Does it mean you lose the right to sue?** Yes.

  The court isn't saying the defendant is innocent; it's saying the plaintiff has lost the *standing* to seek redress. Your critical thinking class taught you how to judge the verdict; the philosophers are teaching you how to judge the right to bring the case.

  ### 4. Where the Critical Thinking Class Was "Too Quick"

  The critical thinking curriculum isn't *wrong*, but it is **domain-limited**. It is designed for epistemic hygiene: preventing you from believing false things.

  However, human discourse is not just about exchanging true propositions. It is about **coordination, trust, and norm enforcement.**
  *   If you treat all moral discourse as pure truth-claims, you miss the social function of blame.
  *   If you treat all *tu quoque* as fallacious, you become vulnerable to bad-faith actors who use moral language as a weapon while exempting themselves from the rules.

  The "fallacy" label is correct when the goal is **Map/Territory correspondence**.
  The "standing" label is correct when the goal is **Multi-Agent Coordination**.

  ### 5. Applying This to Your Politician Argument

  Return to your argument about the austerity politician.
  *   **Your position:** "The hypocrisy is irrelevant to whether the policy is sound."
      *   **Verdict:** Logically Correct. The math of austerity works (or doesn't) regardless of the politician's lifestyle.
  *   **Your friend's position:** "He's a hypocrite, so his criticism is invalid."
      *   **Verdict:** Pragmatically Correct. If your friend meant "He has no moral authority to demand sacrifices from us that he won't make," they are invoking *standing*, not truth.

  If your friend argued that *austerity itself is good because the politician practices it*, that would be a fallacy (appeal to authority/hypocrisy).
  If your friend argued that *we should ignore this politician's specific demand for austerity because he exempts himself*, that is a valid update on **trust and signaling**.

  ### Summary

  The philosophers are not dressing up a fallacy. They are identifying a separate normative phenomenon that introductory logic courses ignore.

  *   **Tu Quoque Fallacy:** "You do X, therefore your claim that X is bad is **false**." (Invalid)
  *   **Loss of Standing:** "You do X, therefore you lack the **authority** to blame me for X." (Valid)

  You can (and should) hold both in your head simultaneously. You can believe the hypocrite is telling the truth about the world, while simultaneously refusing to accept their moral address. In rationalist terms: Update your **beliefs** based on their evidence, but update your **policy** regarding their influence based on their hypocrisy.

  The critical thinking class taught you how to process the data. The philosophers taught you how to process the source. Both are necessary.
