      *   **Kwame Gyekye:** "An Essay on African Philosophical Thought" (1987/1997). Key figure for "moderate communitarianism." Critiques Menkiti. Argues for inherent human dignity *plus* communal embeddedness.
      *   **The Tension:** Ontological status (being human) vs. Normative status (being a *person* in the full moral sense).

  3.  **Address Question 1: Menkiti's "Achieved Personhood":**
      *   *Concept:* Menkiti distinguishes between being a "human individual" (biological) and a "person" (moral/social).
      *   *Process:* You are born with potential, but you become a person through incorporation into the community, performing rituals, and acting morally.
      *   *Implication:* Yes, it implies gradation. An infant is not yet a "person" in the full sense. An anti-social elder might lose "personhood."
      *   *User's Concern:* Is this moral status? Menkiti would say it's *moral* status, not necessarily *ontological* humanity, but the line blurs in terms of rights/respect.
      *   *Verdict:* The user is right to be worried about the exclusionary potential. Menkiti *does* argue for a distinction that allows for exclusion (e.g., the "non-person" who is exiled or treated as an outcast).

