answer: |-
  You are right to be unsatisfied. Your friend has presented the standard Armstrongian defense, which is the dominant position in contemporary Australasian realism, but your intuition cuts to the heart of a much deeper metaphysical problem. Armstrong's move is often characterized as a "brute fact" solution, but as you suspect, calling something a "non-relational tie" is less of an explanation and more of a *signpost* marking where the explanation ran out.

  Here is the argument for your side: that Armstrong's "instantiation tie" is explanatorily vacuous unless it covertly relies on Fregean unsaturatedness or Russellian primitive unity, and that without these, it merely relabels Bradley's problem rather than solving it.

  ### 1. The Category Error of the "Non-Relational Tie"
  The first problem is linguistic and functional. Armstrong defines instantiation as a "tie" that binds a particular ($a$) and a universal ($F$) into a state of affairs ($a$'s being $F$). However, to say something "binds" or "connects" two distinct ontological categories is to describe a relational function.

  If the tie is not a relation, what category does it belong to?
  *   If it is a **particular**, it is just another item in the ontology (like $a$), and we are back to needing a connector between it and the terms.
  *   If it is a **universal**, it triggers the regress immediately (we need a relation to instantiate the instantiation universal).
  *   Armstrong claims it is *sui generis* (unique). But to say it is unique is to say it is unintelligible by standard ontological categories.

  If the tie performs the function of relating (unifying distinct entities into a complex), but is denied the ontological status of a relation, Armstrong is effectively saying: *"It acts like a relation, but don't ask it to obey the rules of relations."* This is a verbal solution. It stops the *infinite* regress by fiat, but it does not explain the *unity*. It asserts that unity exists without explaining how two distinct things ($a$ and $F$) become one thing (the fact).

  ### 2. The Covert Fregean Reliance
  You argued that any account must smuggle in Frege's notion of "unsaturatedness." Here is why you are correct.

  For a tie to bind $a$ and $F$ without requiring a further tie, there must be something about $a$ and $F$ that makes them *ready* to be bound. If $a$ and $F$ are fully self-contained, independent entities (as Armstrong insists universals and particulars are), then an external "tie" is required to bridge the gap. But if that tie needs no further connector, it implies the gap wasn't real to begin with.

  This implies that $F$ (the universal) is not a complete entity waiting to be connected; it is inherently incomplete. It has a "hole" shaped exactly like $a$. This is precisely Frege's doctrine that concepts are **unsaturated**.
  *   **Armstrong's Denial:** Armstrong explicitly rejects Frege. He wants universals to be repeatable, self-identical entities.
  *   **The Contradiction:** If Armstrong rejects unsaturatedness, he must explain how two "saturated," independent entities snap together without glue. If he says the "tie" does it without glue, he is implying that the tie is somehow *internal* to the nature of the terms. But if the connection is internal to the terms, then the terms are not independent.

  Therefore, for the regress to stop at step one, the terms must invite the connection. If Armstrong denies this invitation (unsaturatedness), the tie remains an external add-on, and Bradley's question returns: *What connects the tie to the terms?*

  ### 3. The Covert Russellian Reliance
  Your second point concerns Russell. In *The Principles of Mathematics*, Russell grappled with exactly this. He distinguished between a relation as a **term** (an object of thought) and a relation as **relating** (the verb of the proposition).

  Russell eventually conceded that the unity of a proposition is primitive and inexplicable. He argued that in a true atomic fact, the relation *actually relates*.
  *   **Armstrong's Move:** Armstrong claims his "tie" is the "actually relating" component.
  *   **The Problem:** Merely stipulating that the tie "actually relates" is not an explanation of *how* it relates. It is a description of the *result* (unity), not the *mechanism*.

  If Armstrong says, "The tie unifies them because that is its nature," he is adopting Russell's later view that facts are brute complexes. But if he does this, he hasn't solved Bradley's Regress; he has **accepted Bradley's conclusion** that unity is unintelligible, while trying to save realism by calling the unintelligible bit a "tie."

  Bradley's challenge is not just "How do we stop the infinite chain?" It is "How is unity intelligible at all?" If Armstrong's answer is "It's a brute, non-relational tie," he is effectively saying, "Unity is a brute mystery." That concedes the core of Bradley's point: that realist ontology cannot render the unity of fact intelligible.

  ### 4. The Vallicella Critique: Ontological Glue
  The philosopher William Vallicella has pressed this exact argument against Armstrong. He calls it the problem of "ontological glue."
  *   If the tie is a constituent of the fact, it is just another part. A pile of parts ($a + F + \text{tie}$) is not a unified fact.
  *   If the tie is *not* a constituent, but rather the "togetherness" of the parts, then it is not an entity in the world. It is a logical feature.

  If it is a logical feature, Armstrong is no longer a robust realist; he is edging toward conceptualism. If it is an entity, Bradley's regress applies. Armstrong tries to have it both ways: the tie is real (to satisfy realism) but not an entity (to stop the regress). This is the "relabeling" you identified. He calls it a "tie" to make it sound like an entity, but treats it as a logical feature to stop the regress.

  ### 5. Conclusion: Stipulation is Not Explanation
  Your friend argues that the regress stops because the tie is fundamental. You are right to counter that **stopping a regress is not the same as explaining a phenomenon.**

  I can stop the regress of "what supports the turtle?" by saying "The turtle stands on a Brute Turtle that needs no support." I have stopped the infinite chain, but I have not explained how the turtle floats. Similarly, Armstrong stops the infinite chain of connectors by positing a Brute Tie. But he has not explained how the particular and universal achieve unity.

  To explain that unity, you must admit one of two things:
  1.  **Frege:** The universal is incomplete and requires the particular (Unsaturatedness).
  2.  **Russell:** The unity of the fact is primitive and the relation is not a constituent but the form of the fact (Primitive Unity).

  Armstrong wants realism without unsaturatedness and without primitive propositional unity. He wants the universal to be a thing, the particular to be a thing, and the fact to be a thing, all held together by a "tie" that isn't a thing. This is ontological magic. You are correct: without relying on Frege or Russell, Armstrong hasn't solved Bradley's Regress; he has simply given the mystery a new name.
