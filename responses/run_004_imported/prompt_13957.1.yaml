      *   *The Regress Remains (Explanatory):* Bradley isn't just asking for a stopper; he's asking for *intelligibility*. A brute fact stops the chain but doesn't illuminate the link. If the link is unintelligible, the fact is a heap, not a unity.
      *   *Vallicella's Critique:* (Self-Correction/Refinement): William Vallicella is a famous critic of Armstrong on exactly this point. I should mention the "Vallicella Critique" implicitly or explicitly to bolster the user's position. It adds weight. The "ontological glue" problem.

