answer: |-
  The short answer is: **There is a real technical sense in which Bohmian mechanics slips past Bell's theorem.**

  The persistence of Bohmian mechanics (also known as de Broglie-Bohm theory or pilot-wave theory) is not due to stubbornness or a refusal to accept settled physics. It is due to the fact that the common narrative you encounter on blogs—"Bell's theorem killed hidden variables"—is technically imprecise.

  Bell's theorem did not rule out *all* hidden variable theories. It ruled out **local** hidden variable theories. Bohmian mechanics is explicitly **non-local**.

  Here is the detailed breakdown of why Bohmian mechanics survives Bell's result, why it is taken seriously, and why it remains controversial.

  ### 1. What Bell's Theorem Actually Says
  To understand the loophole, we have to look at the assumptions that go into deriving Bell's Inequality. To derive the inequality, one must assume two main things about the underlying nature of reality:

  1.  **Realism (or Definiteness):** Physical properties exist independently of measurement (hidden variables determine the outcome).
  2.  **Locality:** An event at point A cannot instantaneously influence an event at point B if they are spacelike separated (no faster-than-light influence).

  Bell showed that any theory satisfying **both** Locality and Realism must obey certain statistical limits (Bell inequalities). Quantum mechanical predictions (and subsequent experiments like Aspect's) violate these inequalities.

  Therefore, logic dictates that **at least one** of the assumptions must be false.
  *   **Orthodox (Copenhagen) QM** generally drops **Realism**. It says properties don't exist until measured.
  *   **Bohmian Mechanics** drops **Locality**. It says properties do exist (particles have definite positions), but they influence each other instantaneously across any distance.

  When popularizers say "Bell killed hidden variables," they implicitly mean "Bell killed *local* hidden variables." Bohmian mechanics is the counter-example that proves hidden variables are possible, provided you accept non-locality.

  ### 2. How Bohmian Mechanics Slips Past Bell
  In Bohmian mechanics, the state of a system is described by two things:
  1.  The **Wavefunction** ($\psi$), which evolves according to the standard Schrödinger equation.
  2.  The **Particle Positions** ($Q$), which are the "hidden variables."

  The particles move according to a "guiding equation." The velocity of any given particle depends on the wavefunction. Crucially, for entangled systems, the wavefunction is a function of the positions of **all** particles in the universe.

  This means the velocity of Particle A depends instantaneously on the position of Particle B, even if Particle B is on the other side of the galaxy. This is **explicit action-at-a-distance.**

  Because Bohmian mechanics embraces this non-locality, it does not satisfy the assumptions required to derive Bell's Inequality. Therefore, it is not constrained by the inequality and is free to reproduce the exact statistical predictions of standard Quantum Mechanics, including the violations of Bell's inequalities.

  John Bell himself was very clear on this. He was not an opponent of Bohmian mechanics; in fact, he admired it. He famously remarked:

  > "What is proved by impossibility proofs is lack of imagination."

  Bell's work was partly motivated by a desire to clarify *why* von Neumann's earlier "proof" against hidden variables was wrong (von Neumann had implicitly assumed linearity for hidden variables, which Bohm showed was unnecessary). Bell showed that the real cost of hidden variables was not mathematical inconsistency, but **non-locality**.

  ### 3. Why Is It Still Taken Seriously?
  If Bohmian mechanics requires "spooky action at a distance," why do serious physicists and philosophers still study it?

  **A. It Solves the Measurement Problem**
  In orthodox QM, the "measurement problem" is the unresolved question of how a superposition collapses into a definite outcome. Does it require a conscious observer? Does the universe split (Many Worlds)?
  Bohmian mechanics has no collapse. Particles always have definite positions. The appearance of probability arises from our ignorance of the initial positions (the "quantum equilibrium hypothesis"). It provides a clear, deterministic ontology without needing to invoke observers or wavefunction collapse.

  **B. It Is an Existence Proof**
  Bohmian mechanics proves that determinism is logically compatible with Quantum Mechanics. It demonstrates that the indeterminism of orthodox QM is a choice, not a mathematical necessity. For philosophers of physics, this is invaluable for mapping the landscape of possible realities.

  **C. Clarity of Ontology**
  For those interested in foundations (particularly in rationalist circles that value reductionism and clear models), Bohmian mechanics offers a very clear picture of "what exists": particles and fields. There is no ambiguity about whether the electron is "really" here or there.

  ### 4. Why Isn't It the Consensus? (The Cost)
  If it works, why isn't it the standard view? Because the price it pays for determinism is high.

  **A. Tension with Special Relativity**
  This is the biggest technical hurdle. Bohmian mechanics requires a preferred reference frame to define "instantaneous" influence. While the theory is constructed such that you cannot *detect* this preferred frame (due to the no-signaling theorem), it fundamentally violates Lorentz invariance at the ontological level.
  Making Bohmian mechanics compatible with **Quantum Field Theory** (which is built on Special Relativity) is extremely difficult and awkward. While not impossible, it lacks the elegance of standard QFT.

  **B. Empirical Equivalence**
  Bohmian mechanics is designed to reproduce the predictions of standard QM exactly. It does not currently offer new experimental predictions that would allow us to test it against Copenhagen or Many-Worlds. In the absence of new data, many physicists follow a "shut up and calculate" approach and view the choice of interpretation as metaphysics rather than physics.

  **C. Asymmetry**
  In standard QM, position and momentum are treated on equal footing (Fourier transforms of each other). In Bohmian mechanics, position is privileged as the "hidden variable," while momentum is derived. Many physicists find this asymmetry unnatural.

  ### 5. The Rationalist Context
  You mentioned seeing this on rationalist blogs. This community often gravitates toward Bohmian mechanics (or Many-Worlds) because they tend to dislike epistemic humility when it comes to ontology.
  *   **Copenhagen** says: "Don't ask what the electron is doing when you aren't looking."
  *   **Rationalists** often think: "The electron must be doing *something*."

  Bohmian mechanics satisfies the desire for a "map that matches the territory" (a clear reality) better than Copenhagen, even if it requires accepting non-locality. The confusion arises when rationalist discourse conflates "Bell killed Local Realism" with "Bell killed Realism."

  ### Summary
  Bohmian mechanics persists not because its proponents are ignoring Bell, but because they are accepting the specific implication of Bell's theorem that orthodox interpretations reject.

  *   **Bell:** You cannot have Locality + Realism.
  *   **Copenhagen:** Keeps Locality (mostly), drops Realism.
  *   **Bohm:** Keeps Realism, drops Locality.

  It is a fully consistent, mathematically rigorous theory that is empirically equivalent to standard Quantum Mechanics. Its lack of dominance is due to its tension with Relativity and its metaphysical cost (non-locality), not because it has been mathematically refuted.

  **Reference for further reading:**
  If you want to see this explained by the master himself, look for **John Bell's essay "Against 'Measurement'"** or his collection **"Speakable and Unspeakable in Quantum Mechanics."** Bell was famously sympathetic to Bohm and critical of the vagueness of orthodox QM.
