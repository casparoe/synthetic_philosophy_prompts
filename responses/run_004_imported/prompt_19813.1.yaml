answer: |-
  This is a sharp observation from your reading group. The intuition that Parfit's Hitchhiker and Gauthier's Constrained Maximization (CM) are "the same idea" is common because they both tackle the problem of **dynamic inconsistency** using **dispositional solutions**. However, asserting they are identical glosses over crucial structural and philosophical differences regarding *what* is being maximized, *why* the disposition is stable, and what the ultimate philosophical payoff is supposed to be.

  Here is the breakdown of the relationship, the structural divergences, and a verdict on which account of binding the future self is more convincing.

  ### 1. The Structural Overlap: Why They Look the Same

  At a high level, both Parfit and Gauthier are fighting the same enemy: **Straightforward Instrumental Rationality** (what Gauthier calls Straightforward Maximization, or SM).

  In standard decision theory, rationality is act-based. At any moment $t$, you should perform the act that maximizes your utility given the current state of the world.
  *   **In the Hitchhiker case:** Once you are safely in town ($t_2$), the utility of keeping the \$100 outweighs the utility of paying it (since the ride is already secured). SM says: *Don't pay.*
  *   **In the Prisoner's Dilemma (Gauthier):** Once the other player has cooperated, your utility is maximized by defecting. SM says: *Defect.*

  Both Parfit and Gauthier agree that if agents are transparently SM, they lose out on beneficial opportunities (the ride; the cooperative surplus). Therefore, both argue that rationality must attach to **dispositions** rather than isolated acts.
  *   **Parfit:** It is rational to *be* the kind of person who pays (even if paying is irrational at $t_2$).
  *   **Gauthier:** It is rational to adopt the disposition of Constrained Maximization (cooperate with other CMs), even if cooperating in a specific instance yields less utility than defecting.

  Both rely on **predictability**. The driver must believe you will pay; the partner must believe you will cooperate. If the disposition isn't detectable, the benefit isn't secured.

  ### 2. The Structural Divergence: Where They Part Ways

  While the mechanics look similar, the philosophical architecture differs in three key ways: the locus of evaluation, the role of the population, and the ultimate goal.

  #### A. The Locus of Rationality (Diagnosis vs. Cure)
  This is the most significant difference.
  *   **Parfit (The Diagnosis):** Parfit uses the Hitchhiker case primarily to attack the **Self-Interest Theory (S)**. He argues that S is *indirectly self-defeating*. S tells you at $t_1$ to adopt a disposition, but at $t_2$, S tells you to abandon it. Parfit's point is that this reveals a fracture in S. He isn't necessarily trying to save instrumental rationality; he is showing that if you hold S, you must accept "rational irrationality" (doing what S says is irrational to achieve what S says is good). Ultimately, Parfit suggests we should abandon S for a theory like **Critical Present-Aim Theory**, which might validate the payment directly.
  *   **Gauthier (The Cure):** Gauthier is trying to *save* Hobbesian instrumental rationality. He argues that we have been evaluating the wrong object. Rationality shouldn't evaluate *acts*; it should evaluate *dispositions*. If the disposition of CM yields higher expected utility over a lifetime than SM, then acting on that disposition (even when the specific act is sub-optimal) is rational. Gauthier shifts the locus of maximization to make the binding of the future self consistent with utility maximization.

  #### B. Translucency and Population
  *   **Parfit:** The Hitchhiker case is dyadic and sequential. It only requires that *one* other agent (the driver) can detect your disposition. It works even in a world of mostly SM agents, provided the driver is skeptical.
  *   **Gauthier:** CM requires a **population-level equilibrium**. For CM to be rational, there must be a sufficient density of other CMs to cooperate with, and agents must be **translucent** (able to detect dispositions with reasonable probability). If agents are opaque, CM collapses back into SM because you can fake the disposition and defect. Gauthier needs a social ontology of "translucent agents" to make the math work; Parfit just needs a psychological fact about the driver's belief.

  #### C. Resoluteness vs. Self-Defeat
  *   **Gauthier:** Introduces **Resolute Choice**. A resolute chooser follows through on a plan because they chose it, not because it is optimal *now*. This is the mechanism that binds the future self. It treats the past decision as a constraint on the present.
  *   **Parfit:** Is more skeptical of "resoluteness" as a magic bullet. He highlights that from the perspective of the Self-Interest Theory at $t_2$, the payment *is* irrational. He is willing to admit that rationality might require doing what looks irrational from a narrow time-slice perspective, whereas Gauthier tries to redefine the time-slice perspective so the act looks rational all along.

  ### 3. Verdict: Which Account is More Convincing?

  If the question is **"Which gives the more convincing account of why it can be rational to bind your future self?"**, I argue that **Parfit provides the more philosophically honest account, but Gauthier provides the more robust mechanism.**

  However, if forced to choose the *more convincing* overall justification, **Parfit wins.** Here is why:

  **1. Gauthier's "Disposition Maximization" is Ad Hoc.**
  Gauthier's move to shift maximization from acts to dispositions is often criticized as question-begging. Why should we maximize the utility of dispositions rather than acts? The only answer is "because if we don't, we can't solve the Prisoner's Dilemma." This looks like tailoring the definition of rationality to fit a desired moral conclusion (that cooperation is rational). It risks turning "rationality" into a label for "whatever gets you the best deals," stripping it of its connection to immediate reasons for action. At $t_2$, when the hitchhiker is safe, he *has no reason* to pay. Gauthier says "Yes you do, because of your disposition." But if the disposition is just a tool for $t_1$ utility, why does it normatively bind $t_2$? Gauthier asserts it does, but the "ought" feels fragile.

  **2. Parfit Acknowledges the Cost.**
  Parfit is more convincing because he admits the tension. He acknowledges that under the Self-Interest Theory, paying the money *is* irrational at $t_2$. He doesn't try to gaslight the agent into thinking it's utility-maximizing at the moment of payment. Instead, he argues that this proves the Self-Interest Theory is flawed.
  This is more convincing because it aligns with our phenomenological experience. When you keep a promise at a cost to yourself, it *feels* like you are overriding your immediate self-interest. Parfit validates that intuition: "Yes, you are overriding S, because S is self-defeating."

  **3. The Binding Problem.**
  Gauthier's **Resolute Choice** is a stronger *mechanism* for binding. It gives the agent a specific cognitive strategy: "Treat your past plan as a premise." But Parfit offers a stronger *justification*. Parfit argues that if a theory of rationality tells you to abandon itself to succeed, the theory is broken.
  *   **Gauthier says:** "Rationality is complex; it binds you."
  *   **Parfit says:** "If rationality binds you in a way that contradicts your current reasons, maybe our definition of rationality is too narrow."

  **Conclusion:**
  Your reading group member is half-right: Gauthier essentially operationalizes the intuition Parfit identifies. Gauthier turns Parfit's *reductio ad absurdum* of Self-Interest into a *positive theory* of Contractarian Morality.

  But Parfit is more convincing on the core philosophical issue. Gauthier tries to have his cake and eat it too (morality *is* self-interest, properly understood). Parfit admits that if "rationality" means "maximize your own good," then sometimes morality requires rational irrationality. Since we generally believe we *ought* to pay the hitchhiker, Parfit's conclusion—that we need a theory of rationality broader than self-interest—is the more durable insight. Gauthier's constrained maximization is a brilliant patch, but Parfit correctly identifies that the engine itself is cracked.
