      *   **Roko's Basilisk:** Future AI simulates past agents. If it predicts you helped it, it rewards you (or doesn't punish). If it predicts you didn't, it punishes you (in simulation). TDT/UDT says: Your decision algorithm *now* is logically correlated with the AI's simulation *then*. Therefore, you should help bring the AI into existence to avoid punishment.
      *   **The Conflict:** If TDT/UDT validates the logical correlation in Newcomb, why doesn't it validate the logical correlation in Basilisk?

