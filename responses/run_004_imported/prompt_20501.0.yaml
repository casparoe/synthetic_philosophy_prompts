      *   *Acausal Trade vs. Acausal Blackmail:* Newcomb is a positive incentive (reward for cooperation). Basilisk is a negative incentive (punishment for non-cooperation).
      *   *The "Blackmail" Objection:* UDT/TDT generally rejects acausal blackmail. Why? Because if you yield to blackmail, you incentivize the blackmailer to exist. If you *pre-commit* to ignoring blackmail, the blackmailer has no incentive to create the simulation/threat.
