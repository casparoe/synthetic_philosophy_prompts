  Let's refine the scenario to make the "Unilateral Rescission" the crux. Elias doesn't just leave; he declares the partnership over. Sarah says "It's not up to you." That's the Gilbertian line. Bratman would say "Actually, since intention is in the head, if he changes his head and tells you, it is up to him."

