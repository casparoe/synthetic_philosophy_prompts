  2.  **Deconstruct the Paradoxes:**
      *   **The Lottery Paradox (Kyburg, 1961):**
          *   Scenario: A fair lottery with $N$ tickets (where $N$ is large). One winner.
          *   Belief: For any specific ticket $n$, the probability it loses is extremely high (e.g., $1 - 1/N$). It seems rational to believe "Ticket $n$ will lose."
          *   Aggregation: If I believe this for *every* ticket, I believe "All tickets will lose."
          *   Contradiction: I also know "One ticket will win."
          *   *Key Epistemic Feature:* The beliefs are probabilistic based on statistical chance. The inconsistency arises from aggregating high-probability claims that are *mutually exclusive* in outcome (only one can win). It challenges the principle that high probability justifies belief (the Lockean Thesis) and the principle of conjunction (if I believe $P$ and I believe $Q$, I believe $P \land Q$).
          *   *Common Resolution:* Deny that high probability alone justifies *full belief* (acceptance), or deny conjunction closure for belief.

      *   **The Preface Paradox (Makinson, 1965):**
          *   Scenario: An author writes a book with many claims ($C_1, C_2, ... C_n$).
          *   Belief: The author has evidence for each claim individually. It is rational to believe each $C_i$.
          *   Aggregation: The author also knows authors are fallible. It is rational to believe "At least one claim in this book is false" (the preface statement).
          *   Contradiction: Believing all $C_i$ implies "All claims are true." Believing the preface implies "Not all claims are true."
          *   *Key Epistemic Feature:* The beliefs are based on *evidence* and *expertise*, not just statistical chance. The inconsistency arises from *humility/fallibility* regarding a set of claims that are *compatible* (they could all be true, but likely aren't).
