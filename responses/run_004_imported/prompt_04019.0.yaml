  Kyburg and Makinson walk into a bar, both looking troubled.

  The bartender asks, "What's wrong? You two look like you've been caught holding inconsistent beliefs again."

  Kyburg sighs, "It's the Lottery. I'm justified in believing every single ticket in this draw will lose. But I *know* for a fact that one of them must win. So I know my set of beliefs contains a falsehood."

  Makinson shakes his head, "That's amateur hour. I *know* every single claim in my book is true. But in the preface, I admit I *believe* at least one of them is false. So I believe my set of knowledge contains a falsehood."

  The bartender pauses, wiping a glass. "So, Kyburg, you don't *know* your individual claims, but you *know* the collection is flawed. And Makinson, you *know* your individual claims, but you only *believe* the collection is flawed?"

  Kyburg nods, "Exactly. My paradox is about whether statistical probability justifies belief."

  Makinson adds, "And mine is about whether knowledge is closed under conjunction."

  The bartender slides two tabs across the counter. "Fine. Kyburg, you pay based on the odds. Makinson, you pay based on the evidence."

  Kyburg reaches for his wallet, then stops. "Wait. I believe I have enough cash, but I know one of us has to be short."

  Makinson signs the receipt, then frowns. "And I know I signed this correctly, but I believe I probably messed up the tip."

  The bartender rolls his eyes. "Just put it on the house. I can't handle a paradox where I *know* you're both broke, but *believe* I'm getting paid."
