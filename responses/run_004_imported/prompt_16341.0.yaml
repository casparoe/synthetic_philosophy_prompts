prompt: |-
  So I had this whole argument with my friend Priya last night that spiraled way more than it should have for a Tuesday. It started because I said my coding assistant "thinks" my function has an off-by-one error somewhere, and she jumped on me for a category error, cause apparently nothing like GPT-4 can have beliefs about anything, full stop. She's doing an MA in phil of mind and kept bringing up this "teleosemantics" stuff — Millikan, proper functions, the frog that snaps at BB pellets shot past it instead of flies, and then Swampman: the guy who gets zapped into existence with your exact brain state by a freak lightning strike but no evolutionary history, who apparently has zero mental content on Millikan's own view, no beliefs, no representations, nothing, even though he'd talk and act exactly like you would.

  I didn't have a good comeback in the moment and its been bugging me since. Could you walk me through the most important implications of teleosemantic, proper-function style theories of content for whether something like a large language model could have genuine beliefs or representations, rather than just outputs that look that way from the outside? Specifically: does training by gradient descent count as the kind of selective history that could ground proper functions the way natural selection does on Millikan's view (directly, or maybe as a "derived" proper function inherited from the engineers who set up the training), or is that just a category error dressed up in fancier language? Does the Swampman worry — no selective history for whatever's actually happening on this one particular forward pass, even though the weights as a whole do have a training history — come back to bite the model in basically the same way it bites Swampman? And is the mismatch between what the model was actually optimized for (predicting the next token) and the content we'd want to attribute to it (real beliefs about the world) just a fresh version of the old disjunction problem? Please don't just define teleosemantics for me, I've got the basics down — I want the actual payoff for this specific case, and if you had to bet, which of those three is doing the most damage to the case that an LLM has real content, and which is weakest?
