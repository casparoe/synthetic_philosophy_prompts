      *   *Correction:* I need to be careful not to imply $M$ is "incomplete" in a Gödelian sense. It's complete regarding ZFC axioms, but "transitively incomplete" regarding the real universe. The bijection is a set of pairs. Those pairs are in $M$ (usually), but the *collection* of pairs forming the function isn't an element of $M$.
      *   *Check:* Did I address the coworker's "relative to the model" comment?
