answer: |-
  Good morning. For those who don't know me, I'm [Your Name], and I had the privilege of being [Dad's Name]'s child.

  If you knew my dad, you knew he was a teacher. He taught philosophy at the community college for thirty years. And even at the dinner table, he couldn't turn it off. We couldn't just have a meal; we had to examine the ethics of the meal. He was the kind of man who would use the word "supererogatory" completely straight-faced while passing the mashed potatoes.

  For the colleagues here: you know that means an action that is good to do, but not obligatory. For the rest of us: it means going above and beyond, without making it a rule that everyone else has to follow.

  I need to talk about the kidney. Twelve years ago, Dad donated a kidney to a stranger. He didn't tell us until the paperwork was done. He just signed up, let the center match him, and went.

  But if you tried to thank him, or called him a "hero," he would shut it down. He had a line he used more than once. He'd say, "Either everyone who didn't do this is a monster, or I'm not a hero. Pick one."

  I know that's a hard thing to hear today. I know there are people in this room who have been asked to give, or considered giving, and couldn't. And I know my dad's black-and-white logic can feel like a judgment.

  But I've spent the last week thinking about why he said that. I don't think he was trying to shame anyone. I think he was trying to protect us from the idea that goodness is rare. He hated the idea of "heroes" because heroes are exceptions. Heroes are people you put on a pedestal so you don't have to stand next to them.

  Dad didn't want a pedestal. He wanted to normalize the idea that we take care of each other when we can. By refusing the title of "hero," he was saying that this shouldn't be extraordinary. He was lowering the bar, not raising it.

  He also insisted the whole thing "cost him nothing." We know that wasn't true. It cost him surgery, pain, recovery, and risk. But I think I understand what he meant. He counted the cost differently. To him, the pain was a transaction fee for someone else's life. Compared to the value of that life, his pain was negligible. He minimized his sacrifice because he didn't want anyone to feel indebted to him. He didn't want us to owe him; he just wanted us to owe each other.

  And that brings me back to that philosophy word. *Supererogatory.*

  It is good to give a kidney. It is noble. But it is not required. My dad knew that better than anyone. He knew that capacity varies. He knew that health, finances, fear, and family obligations all weigh into a decision. He never judged my uncle. He never judged my mother. He never judged me.

  He only judged the idea that kindness should be celebrated as an exception rather than practiced as a habit.

  So, how do we honor him? We don't call him a hero. He wouldn't want that. And we certainly don't go around calling anyone else a monster.

  We honor him by recognizing that he did what he could, when he could. And we grant ourselves and each other the grace to do the same. If you can give, give. If you can't, don't. But don't pretend the ones who can are a different species than the ones who can't.

  He taught us that ethics isn't about following rules so you don't get in trouble. It's about looking at the person across from you and asking, "What do I owe you?"

  Sometimes the answer is "a kidney." Sometimes the answer is "a ride to the airport." Sometimes the answer is just "patience."

  Dad, you taught us the vocabulary, but you lived the definition. We'll take it from here.

  Thank you.
