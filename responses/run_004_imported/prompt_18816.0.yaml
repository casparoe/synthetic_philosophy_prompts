      *   **Self-Sampling Assumption (SSA):** One should reason as if one were a random sample from the set of all observers in one's reference class. (Supports DA).
      *   **Self-Indication Assumption (SIA):** One should reason as if one were more likely to exist in a world with more observers. (Cancels DA).
      *   **Reference Class Problem (for SSA):** Who counts as an "observer"? Just humans? Conscious beings? Beings who know the DA? If the class is too narrow or broad, the probability shifts change arbitrarily.
      *   **Presumptuous Philosopher (for SIA):** If SIA is true, a philosopher can claim with high confidence that the universe is infinite (or contains vast numbers of observers) *a priori*, just because their existence is more likely in such a universe. This seems absurdly arrogant/implausible.

