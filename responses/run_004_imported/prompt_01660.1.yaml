answer: |-
  **The Reflective Gap: Higher-Order Thoughts and the Unconscious Mind**

  Higher-Order Theories (HOT) of consciousness offer an elegant solution to the problem of subjective awareness. They posit that what distinguishes a conscious mental state from an unconscious one is not an intrinsic quality of the state itself, but rather its relation to another state. Specifically, a mental state is conscious if and only if it is the target of a suitable higher-order thought (HOT). In this view, we are not conscious of the world directly; we are conscious of our representations of the world. However, this framework faces a compelling objection: it seems intuitively possible to have higher-order thoughts about mental states that remain unconscious. If I can think about my implicit biases or repressed desires without those states becoming phenomenally vivid, does this not demonstrate that higher-order representation is insufficient for consciousness? This essay will explore this puzzle, argue that it stems from a conflation of theoretical self-attribution with introspective awareness, and defend a refined Higher-Order Theory that distinguishes between the *mode* of representation to preserve the theory's viability.

  To understand the puzzle, one must first grasp the transitivity principle underlying HOT. As philosopher David Rosenthal articulates, a state is conscious only if one is, in some way, aware of being in that state. This awareness is constituted by a higher-order thought. The objection arises when we consider the apparent ability to represent unconscious states. Consider a person who acknowledges, "I have an implicit racial bias." They possess a thought about a mental state (the bias). Yet, the bias itself operates unconsciously; the person does not *feel* the bias occurring in real-time, nor do they have phenomenal access to the associative mechanisms driving it. If the HOT theory were strictly true, the act of thinking about the bias should illuminate it, rendering it conscious. Since the bias remains unconscious despite the higher-order thought, the critic argues that the presence of a HOT is not sufficient for consciousness.

  This objection appears genuine only if we treat all "thoughts about mental states" as functionally equivalent. The puzzle dissolves, however, when we distinguish between two distinct types of higher-order representation: *inferential* self-attribution and *non-inferential* introspective awareness.

  When I conclude that I have an implicit bias, I am usually making an inference based on my behavior, psychological testing, or testimony from others. I am forming a first-order belief *that* I have a bias. This is a theoretical claim about my psychology, akin to a scientist hypothesizing about a hidden variable. In HOT terminology, this is not the specific kind of higher-order thought that generates consciousness. For a mental state to become conscious, the higher-order thought must be non-inferential and immediate. It must scan the first-order state directly, not via a chain of reasoning. When I infer I am biased, I am conscious of my *belief* about the bias, but the bias itself (the first-order disposition or occurrent association) lacks a direct, non-inferential HOT targeting it. Therefore, the bias remains unconscious. The critic's error lies in categorizing theoretical self-knowledge as the same mechanism as phenomenal self-awareness.

  Furthermore, the objection often conflates *occurrent* states with *dispositional* states. HOT theory is primarily designed to explain the consciousness of occurrent states—states that are actively happening, such as seeing a red apple or feeling a pang of jealousy. Implicit biases, however, are often dispositional; they are latent tendencies that manifest only under specific conditions. One can have a thought about a disposition without the disposition being actively instantiated as an occurrent mental state. To have a conscious experience of bias, the bias would need to be an active, occurrent urge or association that is then targeted by a HOT. Merely thinking about the existence of the disposition does not activate the state in a way that makes it a target for consciousness. Thus, the existence of thoughts about unconscious dispositions does not refute the claim that thoughts about unconscious *occurrent* states render them conscious.

  Even granting that we can have higher-order thoughts about occurrent unconscious states (perhaps in cases of failed introspection), this does not necessarily dismantle HOT. It instead invites a refinement regarding the *quality* or *content* of the higher-order thought. Rosenthal has suggested that for a state to be phenomenally conscious, the HOT must ascribe qualitative properties to the target state. If I think "I am in a state of anger" in a dry, abstract way, I may not feel the anger. But if my higher-order thought represents the state as *felt*—as having a specific phenomenal character—then the state becomes conscious. This moves the theory toward a "Qualitative Higher-Order Thought" account. Under this view, the puzzle is resolved by noting that the thoughts we have about unconscious states are typically devoid of qualitative content regarding the target. We think *that* we are in the state, but we do not represent the state *as feeling like something*.

  Defending my own view on the matter, I argue that consciousness is indeed a relational property, but the relation is stricter than simple representation. We should adopt a **Functional Higher-Order View**. On this view, a mental state becomes conscious when it is recruited into a specific functional role within the cognitive system, mediated by a higher-order representation that allows for rational control and verbal report. The puzzle of unconscious targets highlights that "representation" is too broad a term. A thermostat represents temperature, but not consciously. A scientist represents a neuron, but not consciously.

  The difference lies in the *integration* of the representation. When I theoretically infer I have a bias, that inference is integrated into my belief system, but the bias itself is not integrated into my conscious workspace. When I am consciously angry, the higher-order representation of that anger makes the anger available for global broadcasting, reasoning, and immediate control. Therefore, the puzzle does not prove that higher-order representation fails to produce consciousness; rather, it proves that not all representations serve the functional role of consciousness. The thoughts we have about unconscious states are "offline" theoretical models, whereas the HOTs that constitute consciousness are "online" monitoring mechanisms.

  In conclusion, the puzzle of having higher-order thoughts about unconscious states poses a challenge only to a crude version of Higher-Order Theory that equates any meta-cognition with consciousness. By distinguishing between inferential self-attribution and non-inferential introspective awareness, and between dispositional and occurrent states, the theory can accommodate the intuition that we can know about our unconscious minds without illuminating them. Consciousness is not merely the act of pointing a mental spotlight at a state; it is the specific mode in which that light shines—immediate, qualitative, and functionally integrated. The existence of unconscious targets of thought does not extinguish the Higher-Order Theory; it merely clarifies the optics of the mind's self-reflection.
