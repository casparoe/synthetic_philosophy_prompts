  6.  *(Self-Correction during drafting)*: Wait, did Goodman *specifically* build entrenchment to block the gerrymandering objection? Or is entrenchment his positive theory, which *implies* the gerrymandering objection is misguided? It's the latter. Entrenchment explains *why* we prefer green, which renders the "gerrymandering" label an effect, not a cause. I need to make sure this distinction is clear. The "gerrymandering" intuition is actually a *symptom* of lack of entrenchment.

  7.  **Final Review against User Query:**
