  2.  **Evaluate the Views (Population Ethics Landscape):**
      *   *Total View (Classical Utilitarianism):* Sum of welfare. Avoids Sadistic Conclusion. Implies Repugnant Conclusion (RC). Simple, continuous, transitive. Widely discussed, often the baseline.
      *   *Average Utilitarianism:* Average welfare. Avoids RC. Implies Sadistic Conclusion (adding miserable lives can raise average if existing lives are worse). Implies Mere Addition Paradox issues. Often considered counterintuitive due to Sadistic Conclusion.
      *   *Critical-Level Utilitarianism (CLU):* Sum of (welfare - critical level). Avoids RC (if critical level > 0). Avoids Sadistic Conclusion (if critical level > 0). Can imply Negative Repugnant Conclusion (many lives slightly below critical level but above negative can be bad). Often seen as the leading contender among utilitarian variants.
      *   *Variable Value Theory (VV):* Value per person decreases as population increases. Avoids RC. Avoids Sadistic Conclusion. Can be complex, sometimes implies intransitivity or discontinuities depending on formulation (Arrhenius discusses this). Often seen as promising but technically tricky.
      *   *Lexical View (Parfit):* Some lives are lexically superior. Avoids RC. Avoids Sadistic Conclusion. Implies discontinuities (lexical thresholds). Often criticized for vagueness or implausible discontinuities (small change in welfare jumps value massively).
      *   *Narrow Person-Affecting View (NPA):* Only matters if it affects existing/future specific people. Avoids RC (usually). Implies Non-Identity Problem issues. Often implies intransitivity or impossibility of comparing different population sizes meaningfully (the "Absent People" problem). Very restrictive for policy models.
      *   *Rank-Discounted Utilitarianism (Zuber/Asheim):* Discount welfare based on rank. Avoids RC. Avoids Sadistic Conclusion. Satisfies many adequacy conditions. Can be complex, sometimes criticized for violating anonymity or separability, but technically robust in recent literature.

