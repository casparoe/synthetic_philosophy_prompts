  5.  **Final Polish:** Check constraints. Move-by-move? Yes. Ratings -2 to +2? Yes. Specific questions answered? Yes. Missing lit? Yes. One-line verdict? Yes.

      *(Self-Correction during drafting)*: Make sure to clarify that Mischel's 0.3 correlation is the specific statistical bone of contention (it's often misinterpreted). Ensure Kamtekar's specific argument (normative vocabulary) is highlighted.

      *Re-evaluating Move 1:* Owen says "data settle it." That's overconfident. Philosophy isn't settled by data alone. I should dock him slightly for the "settle it" rhetoric. Let's give it a +1 but note the overreach.
