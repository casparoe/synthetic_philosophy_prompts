      *   *Refining the Verdict:* Who is *closer* to right? Owen wins on practical relevance (Move 3). Kate wins on textual fidelity and meta-ethical description (Move 2 & 4). But Owen's Move 3 is the hardest for VE to shake off without conceding the "action-guiding" high ground. However, Kate's Kamtekar point (Move 4) undermines the Situationist's normative footing. Actually, the consensus in the literature is often that Situationism kills *global* traits but VE can retreat to *local* or *integrated* traits. Owen's Move 5 is the clincher. If VE can't predict, is it empirical?
      *   *Wait, let's look closer:* Most contemporary VEs accept the situationist data but argue for "integrative" models or "skill" models (Annas/Snow). Kate didn't use those. She used the "Rarity" defense. The Rarity defense is often seen as a concession that weakens VE's normative force. Owen's Move 3 exposes this. So Owen has the stronger *practical* argument. Kate has the stronger *textual* argument.
