answer: |-
  **Setting:** *Cambridge, Massachusetts, late 1907. The study of William James. The air is thick with tobacco smoke. William James sits in a leather armchair, looking tired but animated. Charles Sanders Peirce sits opposite him, leaning forward, his hands clasped tightly, his expression a mixture of affection and rigorous concern. A copy of James's new book, *Pragmatism*, rests on the table between them.*

  **James:** Charlie, you've been quiet for ten minutes. I know that look. It's the look you had back in the Metaphysical Club days when I'd get too carried away with Bergson. You're polishing a distinction in your head until it cuts.

  **Peirce:** It is not Bergson, Will. It is you. Or rather, it is this book. You have taken a child I left in your care and dressed it in clothes it cannot grow into. You call it "Pragmatism." I have had to christen my own version "Pragmaticism." It is ugly, yes. Intentionally so. Like a fortress.

  **James:** A fortress against what? Against making the idea live? Charlie, your 1878 paper, "How to Make Our Ideas Clear," was a spark. But a spark in a vacuum. I have tried to bring it into the air, where men actually breathe. You defined a maxim for clarifying concepts. I have turned it into a theory of truth. Is that not the natural progression?

  **Peirce:** It is a category error. That is the heart of it. The Pragmatic Maxim is a method of logic. It says: *Consider what effects, which might conceivably have practical bearings, we conceive the object of our conception to have. Then, our conception of these effects is the whole of our conception of the object.* It is a rule for translating intellectual signs into sensible consequences. It is not a definition of Truth.

  **James:** But if the meaning of a concept *is* its practical consequences, then surely the truth of that concept must be found in the same currency! You cannot separate meaning from truth. If an idea has no "cash-value" in experience, it is meaningless. If it *has* cash-value, if it works, if it leads us through the stream of experience without contradiction—that *is* its truth.

  **Peirce:** There you slide. "Works." "Leads." These are psychological terms. You are grounding truth in the satisfaction of the individual inquirer. If I believe a proposition because it comforts me, because it "works" for my peace of mind today, you seem prepared to call that true.

  **James:** No, no! You flatten me into a hedonist. That is the caricature the absolutists love. I do not mean "works" as in "makes me happy." I mean "works" as in "agrees with reality." But how does an idea agree with reality? Not by mirroring it in some static, God's-eye view. It agrees by *fitting*. By guiding me from one moment of experience to the next. Truth *happens* to an idea. It becomes true, is made true by events.

  **Peirce:** And there is the rupture. Truth is not *made*. Truth is *discovered*. Reality is what it is, independent of what you or I or any finite group of men think about it. If you define truth as what is currently satisfactory to the inquirer, you deny the possibility of error that is nonetheless satisfactory. A man may be perfectly satisfied by a delusion. It may guide him successfully for a decade. Is it true?

  **James:** If it guides him successfully, it is true *so far as it goes*. But experience is a stream, Charlie. It widens. Eventually, the delusion will clash with a wider set of experiences. Then it ceases to work. Then it ceases to be true. Truth is the name for the process of verification.

  **Peirce:** But that makes truth mutable. It makes truth plural. If truth depends on the verification process of the moment, then what is true for you may not be true for me, and what is true today may be false tomorrow. I am a Scholastic Realist, Will. I believe in Generals. I believe that there is a Reality that constrains us. Truth is the opinion which is fated to be ultimately agreed to by all who investigate.

  **James:** "Fated to be ultimately agreed to." The Final Opinion. I know this well. But Charlie, be honest. That is a regulative ideal, a hope. It is not a definition we can use. No one will ever reach that end of inquiry. It is an asymptote. If I ask, "Is this proposition true?" and you answer, "It is what the infinite community would think in the limit of time," you have told me nothing I can use *now*. You have defined truth by something that does not exist.

  **Peirce:** I have defined it by something that *must* exist if inquiry means anything! If there is no convergence, if there is no destination, then inquiry is just wandering. You need the destination to make sense of the journey. My definition protects truth from the vagaries of individual psychology. It anchors it in the logic of the community of inquirers stretching into the indefinite future. It ensures that truth is public, not private.

  **James:** And I anchor it in the *life* of the inquirer! You speak of the community as if it were a single mind. But the community is made of individuals having concrete experiences. If the "Final Opinion" has no connection to the actual verifications happening in the lives of real people, it is a metaphysical phantom. You are so afraid of subjectivity that you have pushed truth off the edge of the knowable.

  **Peirce:** I am afraid of Nominalism. That is all. You treat the "Final Opinion" as a fiction. I treat it as a Real. It is the Thirdness that governs the relation between sign and object. But let us look closer at your "verification." You say an idea is true if it leads to satisfactory results. Who determines the satisfaction?

  **James:** The experience itself determines it. If I predict that walking through that door will lead to the hallway, and I walk and find the hallway, the idea is verified. It is true. It is concrete.

  **Peirce:** That is a verification of a singular prediction. It is not Truth with a capital T. You conflate the verification of a hypothesis with the nature of Truth itself. You say truth is "expedient in the way of our thinking." But expediency implies a goal. If the goal is merely getting through the day, you are right. If the goal is knowing the Universe, then expediency is insufficient. We must be willing to be dissatisfied. We must be willing to be wrong, even if it hurts, because the Reality compels it.

  **James:** But who compels it? Reality compels it. I agree! I am not an idealist who thinks mind creates matter. I am a Radical Empiricist. The relations between things are experienced just as the things themselves. The "compulsion" you speak of *is* the experience of being led. When reality pushes back, I feel it. That feeling is the verification. You want to push the verification to the end of time; I say the verification is distributed across time. Every successful leading is a partial truth.

  **Peirce:** A partial truth is a fragment of the Truth. It is not the definition of Truth. Here is my worry, Will, and I must say it plainly. Your formulation opens the door to the will to believe. If truth is what is satisfactory, a man can believe in God because it comforts him, and call it true.

  **James:** He can call it true *if* it connects with the rest of his experience in a living way! If the belief in God inspires moral action that yields tangible results in the world, then it has cash-value. It is true in that respect. You want to say, "God exists is true only if the infinite community proves it." I say, "God exists is true if believing it makes a tangible difference in how life is lived." Which is more honest?

  **Peirce:** It is more human, perhaps. But it is less logical. It confuses the *good* of believing with the *truth* of the belief. A thing can be good to believe and false. A thing can be true and terrible to believe. Your pragmatism risks collapsing that distinction.

  **James:** And your pragmaticism risks making truth irrelevant to life. If truth is locked away in the end of time, what is it for? It becomes a idol. I want to bring philosophy down to the level of the marketplace, the laboratory, the bedroom. I want to know what difference it makes *today*.

  **Peirce:** *(Leans back, sighing)* We are talking past one another, and yet... we are standing on the same ground.

  **James:** How so?

  **Peirce:** We both reject the Correspondence Theory of the copyists. We both agree that a concept that has no practical difference is empty. We both agree that inquiry is an active process, not a passive mirroring.

  **James:** Exactly. We are both fighting the absolutes. The Hegelians, the Kantians. We want philosophy to be scientific, to be grounded.

  **Peirce:** Yes. But I am describing the *logic* of science. You are describing the *psychology* of the scientist. I am concerned with the validity of the inference in the long run. You are concerned with the motive and the feeling of rationality in the short run.

  **James:** So, is it a disagreement? Or is it a division of labor?

  **Peirce:** *(Pauses, stroking his beard)* It is a disagreement about the center of gravity. For me, the center is the Object, the Reality that draws the community. For you, the center is the Subject, the Experience that validates the idea. If you make the Subject the arbiter of Truth, you lose the constraint of Reality.

  **James:** And if you make the Object the sole arbiter, removing it to the end of time, you lose the agency of the Inquirer. But... Charlie. Suppose I concede this. Suppose I agree that "Truth" in the absolute sense is your Final Opinion. I will still maintain that for human beings, "truths" are the specific verifications we achieve along the way. We need a word for the ideas that carry us safely across the stream.

  **Peirce:** And I will concede this: The Final Opinion is nothing but the sum of all possible verifications. It is not a mystical state. It is the total integration of every "cash-value" experience you speak of. Without the concrete verifications, the Final Opinion is empty.

  **James:** Then we are not enemies. You are the architect designing the cathedral that will stand for a thousand years. I am the mason laying the stone that must hold weight today.

  **Peirce:** A fair metaphor. Though I must insist you stop calling your masonry "Pragmatism." It confuses the public. My "Pragmaticism" is the blueprint. Your "Pragmatism" is the construction work.

  **James:** *(Laughs)* I cannot promise to change the title of the book, Charlie. The lectures are given. But I will add a preface. I will acknowledge that you are the guardian of the logical strictures. I do not want truth to be mere preference. I want it to be what works *because* it aligns with the nature of things.

  **Peirce:** And I must acknowledge that without the "work," without the human satisfaction of understanding, the logic is dead letter. We are both Realists, in our way. I believe in the Reality of the General. You believe in the Reality of the Particular experience.

  **James:** Then here is our verdict. We are not disagreeing on the nature of Reality. We are disagreeing on the *access* to it. You say we access it by submitting to the discipline of the community over time. I say we access it by testing the leadings of experience in the present.

  **Peirce:** Precisely. And both are necessary. Inquiry without the hope of final convergence is aimless. Convergence without the concrete steps of verification is imaginary.

  **James:** So, "Pragmaticism" is the theory of the *end* of inquiry. "Pragmatism" is the theory of the *means*.

  **Peirce:** *(Nods slowly)* I can accept that. Provided you admit that the Means must be subordinate to the End. The verification must aim at the convergence.

  **James:** And you admit that the End is nothing but the idealized projection of the Means. The Final Opinion is just the perfect verification.

  **Peirce:** Agreed. Then we are not at war. We are merely looking at opposite ends of the same telescope. I look through the wrong end to see the structure of the lens; you look through the right end to see the stars.

  **James:** Then let us drink to the stars, and to the lenses. And Charlie?

  **Peirce:** Yes, Will?

  **James:** "Pragmaticism" is indeed ugly enough to be safe. But I fear "Pragmatism" is too beautiful to be precise.

  **Peirce:** *(A rare, small smile)* Then it is fortunate we are both here to watch over them.

  *(James pours two glasses of sherry. They clink glasses. The smoke swirls between them, neither clearing nor obscuring, but simply present, like the medium of their shared inquiry.)*
