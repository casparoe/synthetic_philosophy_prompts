      *   It's not a cycle that generates energy; it's a path that consumes planning energy to maintain a state.
      *   Actually, better: Hysteresis. In magnetic materials, the state depends on history. You can't describe the system just by current field strength; you need history. Resolute choice introduces hysteresis into decision theory. The state at $t_1$ depends on the path taken from $t_0$.
      *   Cyclic preferences without resolution = Perpetual Motion (Impossible).
