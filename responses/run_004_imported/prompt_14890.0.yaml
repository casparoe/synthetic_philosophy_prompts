  **MEMORANDUM**

  **TO:** National Health Service Board of Directors
  **FROM:** Technology Appraisal Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Funding Recommendation for Upcoming Allocation Round: Proposals A and B

  ### 1. Executive Summary

  The Technology Appraisal Committee has convened to evaluate two competing funding proposals against the fixed budget for the upcoming cycle. Proposal A offers life-extension treatment for an otherwise healthy population. Proposal B offers life-extension treatment for individuals with long-standing severe disabilities.

  Based on standard Quality-Adjusted Life Year (QALY) calculations using population-derived health-state valuations, Proposal A yields a higher aggregate health benefit. However, after rigorous ethical and methodological deliberation, the Committee recommends **funding Proposal B**. This decision rests on the determination that standard population-derived valuations systematically underestimate the value of life extension for disabled populations, creating an inequitable bias that violates the Service's mandate for fair access.

  ### 2. Background and Proposals

  The Committee faces a zero-sum constraint. Funding one proposal necessitates rejecting the other.

  *   **Proposal A (Healthy Population Extension):** Targets a generally healthy demographic facing a specific mortality risk. Standard QALY weights assign a high value to the life-years gained, as the baseline health state is near unity (1.0).
  *   **Proposal B (Disability Treatment):** Targets patients with chronic, severe disabilities. While the treatment successfully extends life, standard QALY weights assign a lower value to these years (e.g., 0.4–0.6) based on population perceptions of the disability state. Notably, patient-reported outcome measures (PROMs) from this group indicate day-to-day well-being significantly higher than the population-derived weights suggest.

  ### 3. Deliberation: The Valuation Conflict

  The core of our deliberation concerned the validity of the "common currency" used to compare these proposals.

  **The Efficiency Argument:**
  A significant portion of the Committee initially argued that population-derived QALY weights must remain the sole decision metric. Their position is that deviating from a single, standardized metric undermines the ability to maximize total health across the nation. If we adjust weights for specific groups, we risk fragmenting the evaluation framework, making future comparisons impossible and potentially reducing the overall health utility the budget can purchase.

  **The Equity and Accuracy Argument:**
  Conversely, the Committee recognized a critical measurement error in the standard model. The "disability paradox"—where external observers rate the quality of life of disabled persons significantly lower than the persons themselves report—suggests that population-derived weights reflect social bias rather than clinical reality.

  By relying on these weights, the Committee risks applying a "double penalty":
  1.  **Experiential Penalty:** Society assumes the patient's quality of life is low.
  2.  **Allocative Penalty:** That assumption is used to deny life-extending treatment.

  The Committee concludes that a metric which systematically devalues the life extension of a protected class, contrary to the lived experience of that class, cannot be considered neutral. To use it as such would be to prioritize a flawed calculation over the principle of equitable worth.

  ### 4. Recommendation

  The Committee recommends **approving Proposal B** and rejecting Proposal A for this funding round.

  Furthermore, we recommend that future appraisals involving life-extension for chronic disability conditions utilize **patient-reported well-being weights** rather than population-derived preference weights. This adjustment does not grant "extra" value to disabled patients; rather, it corrects the undervaluation currently embedded in the system, aligning the metric with the actual benefit experienced by the recipient.

  ### 5. Consideration of the Strongest Objection

  We must engage honestly with the strongest objection to this recommendation: **The Loss of a Common Currency.**

  **The Objection:**
  Critics within and outside the Committee argue that if we abandon standard population weights for this category, we erode the comparability of all future decisions. If we adjust for disability, why not for age? For socioeconomic status? For lifestyle choices? Without a single, rigid currency (the standard QALY), decision-making becomes subjective. This subjectivity could lead to inconsistency, lack of transparency, and an inability to defend budget allocations to the public and taxpayers who expect the maximum health return per dollar spent. If we cannot compare apples to apples, the argument goes, we cannot make rational choices at all.

  **The Committee's Rebuttal:**
  We acknowledge that introducing equity adjustments complicates the mathematical simplicity of the QALY model. However, we reject the premise that a "common currency" is valid if it is known to be counterfeit in specific instances.

  1.  **Correction, Not Preference:** This recommendation is not about granting preferential treatment based on identity; it is about correcting a measurement error. If a scale consistently underweighs a specific object due to a magnetic flaw, fixing the scale is not "biasing" the result; it is restoring accuracy. Population weights measure *society's fear of disability*, not the *patient's benefit from life extension*. Switching to patient-reported weights restores the metric to its intended purpose: measuring health gain.
  2.  **Bounded Application:** We are not proposing a free-for-all. We propose a specific methodological correction for cases where a demonstrable gap exists between external valuation and internal experience (the disability paradox). This establishes a precedent for evidence-based metric calibration, not arbitrary exception-making.
  3.  **Legitimacy:** A health service loses public trust if it is shown to systematically deny care based on ableist assumptions. The "consistency" of applying a biased rule is less valuable than the "justice" of applying a corrected one. We can maintain transparency by explicitly documenting when and why metric adjustments are applied, rather than hiding behind a flawed standard.

  ### 6. Conclusion

  The purpose of this Service is to improve health and extend life for all citizens. A methodology that achieves aggregate statistical gains by systematically deprioritizing the lives of the disabled contradicts our founding charter.

  By funding Proposal B, we affirm that the value of a life-year is not determined by the health status of the person living it, but by the benefit it confers to them. We urge the Board to adopt this recommendation and support the methodological shift required to implement it.

  **Signed,**

  *Committee Chair*
  *Technology Appraisal Committee*
