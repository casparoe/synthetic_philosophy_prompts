      *   **Criticisms/Nuance:** Don't sell propensity as perfect. It has issues (triviality results, measuring propensities). It's metaphysical.
      *   **Conclusion:** Summarize the shift from "what happens often" to "what is disposed to happen."

  6.  **Refining the Tone:**
      *   Avoid overly dense jargon where possible, but don't dumb it down.
