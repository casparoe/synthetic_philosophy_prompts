answer: |-
  **The Borrowed Gaze: Why Aesthetic Judgment Demands Presence**

  The disagreement you describe—whether one can legitimately call a film "brilliant" based solely on a critic's review—touches on a nerve that runs deep through the philosophy of art. Your friend's analogy is seductive in its simplicity: we trust experts on the existence of Peru, the safety of vaccines, and the age of the universe; why should art be exempt from the economy of trust? Yet, as you noted, something nags at you. That nagging sensation is the philosophical intuition that aesthetic value is not merely a property waiting to be measured, but a relationship waiting to be lived.

  This tension is known in philosophy as the problem of **aesthetic testimony**. On one side stand the Optimists, who argue that there is no principled reason to treat aesthetic beliefs differently from historical or scientific ones. On the other stand the Pessimists, who argue that aesthetic judgment requires a first-hand encounter with the object. While the Optimists are correct about the practical utility of reviews, they are wrong about the nature of judgment itself. The verdict must be a qualified Pessimism: testimony can justify your *expectations* and inform you of a *consensus*, but it cannot justify the *aesthetic judgment* itself. To call a film "brilliant" without seeing it is not to hold an aesthetic belief; it is to report a sociological fact.

  To understand why, we must first grant the Optimist their due. The argument for parity is strong. We live in a world of cognitive scarcity; there are too many books, films, and paintings for any one person to experience them all. If we could not form beliefs based on testimony, our cultural conversations would grind to a halt. We would be unable to recommend a restaurant to a friend who hasn't tasted the food, or discuss the merits of a novel we haven't read. Furthermore, critics are often genuine experts. They have seen more films, studied more history, and honed their perceptual skills more than the average viewer. If a trusted mechanic tells you your brakes are shot, you believe them without looking under the chassis. Why, the Optimist asks, is the critic less trustworthy than the mechanic? To deny this seems to smack of elitism or an irrational mystification of art.

  However, the Optimist's analogy between the mechanic and the critic, or between Peru and a film, conceals a crucial category error. When a mechanic tells you your brakes are shot, they are reporting on an objective state of affairs that exists independently of your perception. The brakes are worn regardless of whether you look at them. Similarly, Peru exists whether you visit it or not. In these cases, testimony transfers *propositional knowledge* (knowing *that* something is the case).

  Aesthetic judgments, however, are not merely reports on objective properties. When you call a film "brilliant," you are not simply tagging it with a star rating like a warehouse inventory item. You are expressing a response to the way the film's form and content interact. As the philosopher Immanuel Kant argued, a judgment of taste claims "subjective universality." It is subjective because it is based on your feeling of pleasure or resonance; it is universal because you imply that others *ought* to feel the same.

  This is where the Pessimist's strongest argument lies: the requirement of **acquaintance**. To judge art is to engage in a specific cognitive activity where the process of perception is inseparable from the conclusion. If you believe a film is brilliant solely because a critic said so, you possess the conclusion without the premise. You have the verdict without the evidence. In science, we accept the verdict of an expert because we cannot replicate the experiment. In art, the "experiment" is the viewing itself, and it is available to you. Bypassing it means you are not responding to the art; you are responding to the critic.

  This distinction becomes even sharper when we look at the analogy of moral testimony, which you mentioned. If you donate to charity solely because a moral guru told you to, without understanding *why* it is good, have you acted virtuously? Most ethicists would say no. Virtue requires internalizing the reason for the action, not just complying with the command. Art demands a similar autonomy. To truly hold an aesthetic judgment, you must have done the work of perception. If you haven't, you are effectively "borrowing" someone else's eyes. You are engaging in what philosopher Robert Hopkins calls "bulimic aesthetics": consuming the opinions of others without digesting the art that produced them.

  So, where does this leave us? We must commit to a verdict that respects the complexity of the situation. The Optimist is right that we rely on testimony for *action*. It is perfectly rational to watch a film because a critic recommended it. It is also rational to believe the *proposition* that "this film is widely regarded as brilliant." That is a fact about the world, like the existence of Peru.

  But the Pessimist is right that testimony cannot secure the *aesthetic judgment* itself. You cannot legitimately inhabit the belief that the film is beautiful. If you say, "This film is a masterpiece," without having seen it, you are speaking falsely—not because the film isn't a masterpiece, but because *you* do not hold that judgment in the full aesthetic sense. You are holding a belief about the critic's reliability, not the film's quality.

  Therefore, the solution to your disagreement is a distinction in language and epistemic status. You are justified in saying, "I have every reason to believe this film is brilliant," or "The consensus is that this film is brilliant." These are claims about evidence and sociology, which testimony can support. But you are not justified in saying, "This film is brilliant," if that assertion is meant to convey your own aesthetic engagement. The "nagging" feeling you have is the recognition that aesthetic value is not a static property like mass or location; it is an event that happens between the viewer and the work.

  In the end, art asks something of us that geography does not. Geography asks for our acknowledgment; art asks for our presence. To outsource our judgment of art is to treat it as a commodity to be rated rather than an experience to be undergone. Your friend is correct that we must trust others to navigate the world, but they are mistaken in thinking that art is just another part of the world to be navigated. It is a mirror. You cannot check your reflection in a mirror by asking someone else what they see. You have to look for yourself.
