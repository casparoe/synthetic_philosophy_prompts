  ok this is a Moore / Principia Ethica thing that's been bugging me. he's got that thought experiment where a totally unobserved beautiful world is better than a totally unobserved ugly one, which is supposed to show beauty has value even with zero consciousness involved. but then in the chapter on the ideal, the best good turns out to be personal affection (the friendship/love side of things) combined with actually appreciating what's good or beautiful in the person you love, and he says this combo is worth way more than just adding "loving them" + "admiring something good" seperately -- because of organic unities. doesn't leaning on organic unities there basically make consciousness/the relationship do all the real work, which sits kinda weird next to the isolation test showing beauty has worth all on its own with nobody around to see it? is that an actual known tension in Moore's view, or am i missing how he'd keep those two arguments from stepping on each other's toes?
