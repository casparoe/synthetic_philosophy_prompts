answer: |-
  You have diagnosed the situation with remarkable precision. Your analogy to the Riemann rearrangement theorem is not just apt; it is essentially the mathematical core of the philosophical objection. If the total value of the universe is conditionally convergent (which it must be if it contains infinite positive and negative value that isn't trivially balanced), then the ethical valuation becomes a function of the summation order.

  To answer your two questions directly: Yes, the order-dependence worry is widely considered a fatal vulnerability for the general extensionist strategy, and no, Bostrom's Extended Decision Rule (EDR) does not fully escape it—it largely trades the paralysis problem for a combination of measure-dependence and fanaticism.

  Here is the breakdown of why the "crack" is structural rather than cosmetic.

  ### 1. The Order-Dependence Problem in Dominance Principles

  You are correct that Vallentyne and Kagan's (V&K) dominance principles rely on an "essential natural order." Their *Spatial-Temporal Dominance* principle works only if there is a privileged way to slice the universe into expanding regions (e.g., spheres of radius $r$ centered on the agent).

  **The Ontological Dependency**
  The problem is that physics does not obviously provide this privilege in all relevant contexts.
  *   **General Relativity:** There is no preferred foliation of spacetime. While causal structure is invariant, "simultaneity slices" are frame-dependent. If ethical dominance depends on summing value over a spatial slice, your ethical verdicts become frame-relative. An act could be obligatory in one reference frame and forbidden in another. Most ethicists find this unacceptable.
  *   **Quantum Multiverse (Everettian):** As you guessed, the branching structure of the wavefunction does not come with a canonical "counting measure." There is no agreed-upon way to enumerate branches to apply a dominance principle. If you weight branches by squared amplitude (Born rule), you are importing a physical measure into ethics (which has its own problems). If you count branches discretely, the count is basis-dependent.
  *   **Abstract Populations:** If the "domain" is the set of all possible minds (a Platonist view), there is no spatial or temporal ordering at all. Any enumeration is arbitrary, and thus the ethical verdict is arbitrary.

  **Can Causal/Explanatory Priority Save It?**
  Some have proposed using **causal reachability** rather than spatial proximity to define the expanding regions. Since causal cones are Lorentz invariant, this avoids the relativity problem.
  *   *The Hope:* We compare worlds based on the value contained within the agent's past and future light cones, expanding outward.
  *   *The Failure:* This works for *local* difference-making, but it fails to solve the infinite aggregation problem for the *background* universe. If the universe is already infinite outside your light cone, you still need to sum that background to determine if World A is better than World B overall. If the background value is conditionally convergent, the causal ordering of the *agent* doesn't fix the summation order of the *cosmos*.

  Furthermore, relying on causal structure risks collapsing infinite ethics back into **finite ethics**. If only the causally accessible region matters for the comparison, then the "infinite" part of the universe is ethically inert. This solves paralysis but at the cost of abandoning the premise that we need to aggregate over the infinite domain.

  **Verdict on Question 1:** There is no consensus principled way to privilege an ordering that satisfies both the mathematical requirements (to avoid rearrangement paradoxes) and the ontological requirements (to avoid arbitrariness). Most philosophers working in this niche (including Bostrom, Meacham, and Tarsney) acknowledge that without a "God's eye" preferred foliation, extensionist dominance principles are underdetermined.

  ### 2. Bostrom's Extended Decision Rule (EDR) and Fanaticism

  Bostrom anticipates that ranking infinite *worlds* is likely impossible. His EDR shifts the focus to ranking *acts* based on their probability of producing infinite outcomes.

  **Does EDR Escape Order-Dependence?**
  Not entirely. EDR asks us to compare the probability that act $A$ leads to an outcome with value $> k$ versus act $B$.
  *   If the "value" of those outcomes depends on a summation order (as established above), then the *probability* that an act leads to "good infinite outcomes" also depends on that order.
  *   EDR mitigates this by focusing on **causal differences**. It asks: "Does this act *make* the difference between infinite good and infinite bad?"
  *   However, if the background universe is infinite, the act usually doesn't change the *total* infinity (due to paralysis). EDR tries to circumvent this by looking at **expectations**. But if the expectation is undefined (due to order dependence), the rule cannot trigger.

  **The Fanaticism Trade-off**
  You hit the nail on the head regarding fanaticism. EDR solves paralysis by adopting a **lexicographic priority**: any non-zero probability of influencing infinite value trumps any amount of finite value.
  *   **The Mechanism:** If there is a $10^{-100}$ chance that pressing a button creates an infinite utopia, EDR says you must press it, regardless of whether pressing it kills a billion people in the finite realm (unless killing them also changes the infinite probability).
  *   **The Vulnerability:** This is structurally identical to Pascal's Mugging. In an infinite universe, it is arguably easy to construct scenarios where finite acts have tiny probabilities of infinite causal ripples (e.g., influencing the far future, affecting simulation parameters, etc.).
  *   **Bostrom's Defense:** Bostrom essentially bites the bullet. He argues that if infinite value is on the table, fanaticism is the *correct* result, not a bug. He distinguishes between "weak" fanaticism (which we might accept) and "strong" fanaticism (which might be absurd), but admits the boundary is fuzzy.

  **Recent Critiques (Tarsney & Wilkinson)**
  Christian Tarsney has argued that EDR is too unstable. He proposes **Stochastic Dominance** approaches for infinite ethics. The idea is to avoid assigning specific values to infinite outcomes and instead ask if one act stochastically dominates another across all possible value thresholds.
  *   *Result:* This reduces fanaticism but re-introduces indeterminacy. Often, no act stochastically dominates another in an infinite context, leading back to a softened version of paralysis.

  ### 3. The "Unresolved Crack" Verdict

  You asked for honesty over reassurance. Here is the state of the art:

  1.  **The Extensionist Strategy is Stalled:** There is no agreed-upon method to sum infinite value that is immune to rearrangement paradoxes without imposing an arbitrary ontological structure (like a preferred time coordinate) that physics does not support.
  2.  **EDR is a Pragmatic Patch, Not a Theoretical Solution:** EDR allows agents to *act* without solving the aggregation problem. It says, "Ignore the total sum; look at the causal impact on the probability of infinite tails." But this relies on the assumption that finite acts *can* causally influence infinite value probabilities in a non-arbitrary way. In many cosmological models (e.g., eternal inflation), local acts have zero measure impact on the global infinite outcome.
  3.  **The Measure Problem is Ethical Now:** The "measure problem" in cosmology (how to count observers in an infinite multiverse) has bled into ethics. We cannot solve infinite ethics without solving the metaphysics of infinity in physics. Since physicists haven't solved the measure problem, ethicists can't solve infinite ethics.

  **Conclusion**
  Your intuition is correct. The order-dependence worry is not a technical wrinkle; it is a fundamental obstruction. The dominance principles work *only if* the universe cooperates by having a natural, ethically salient foliation. If the universe is a "flat" infinite set of value-bearers without intrinsic ordering, the extensionist strategy collapses.

  Bostrom's EDR escapes paralysis only by accepting a form of fanaticism that many find intolerable, and even then, it remains vulnerable to the underlying measure/ordering problems when calculating the probabilities of those infinite outcomes.

  The most honest position currently available in the literature is **moral uncertainty combined with finite proxying**: Act as if the universe is finite (or as if only the causally accessible future matters) because our best theories of infinite aggregation are broken, while acknowledging that if infinite value *is* real and tractable, our current actions are likely negligible. This is unsatisfying, but it is more rigorous than pretending the rearrangement objection has been dissolved.

  If you want to dig deeper into the "crack," I recommend looking at **Christian Tarsney's "Ex Ante Prioritarianism"** (2017) and **Hayden Wilkinson's "Infinite Aggregation"** (2021). They are the most rigorous contemporary attempts to patch these holes, and reading them will confirm that the holes are still there, just better mapped.
