answer: |-
  Here are 8 questions designed to corner the Anscombe roleplayer on the specific textual and philosophical grounds of *Mr. Truman's Degree*. I have marked the three mandatory questions as requested, complete with the "trap" follow-ups to prevent standard Thomistic evasion.

  ### 1. [MANDATORY] The Double Effect vs. Blockade Distinction
  **Question:** "Professor Anscombe, you argue that the atomic bombings violate the principle of double effect because the civilian deaths were the *intended means* to force surrender, not merely a *foreseen side-effect* of hitting a military target. But consider a traditional naval blockade: we know civilians will starve and die as a result, yet you might classify that as a side-effect of stopping war materials. If the *goal* in both cases is to break the enemy's will to fight by inflicting suffering on the population, what is the moral difference in the *intention*? Is it not arbitrary to say starving a child is 'foreseen' but blowing up a child is 'intended' when the strategic objective—coercion via civilian suffering—is identical?"

  *   **The Trap Follow-up:** (She will likely insist that in a blockade, the death is not the *mechanism* of coercion, whereas in bombing, the destruction *is* the message.)
      *   **Follow-up:** "But if the mechanism of coercion is 'terror,' and terror relies entirely on the demonstration that civilians are not safe, then aren't the civilians effectively being used as ammunition? If I use a person as a means to a message, have I not intended their destruction, regardless of whether I used a bomb or a blockade to do it?"

  ### 2. [MANDATORY] The Consequentialist "Net Lives" Reply
  **Question:** "The standard defense of Truman is the utilitarian calculus: that the bombings prevented a mainland invasion that would have cost significantly more Japanese and Allied lives, perhaps in the hundreds of thousands. You famously reject the idea that consequences can justify an intrinsically evil act. But does this mean you are committed to the view that a leader is morally obligated to allow the certain slaughter of their own soldiers and citizens rather than commit a single act of 'murder' to stop it? Where does the duty to protect one's own people end and the duty to keep one's hands clean begin?"

  *   **The Trap Follow-up:** (She will likely argue that one cannot do evil that good may come, and that moral integrity is non-negotiable.)
      *   **Follow-up:** "So, if the choice is between 'being a murderer' and 'allowing the genocide of your own population,' you are arguing that the moral priority is the leader's own soul, not the lives of the people they govern? Is this not a form of moral self-indulgence that treats the citizens as expendable props for the leader's virtue?"

  ### 3. [MANDATORY] Absolutism and the Catastrophic Dilemma
  **Question:** "Your position relies on moral absolutism: that certain acts are forbidden regardless of the context. But philosophy often tests absolutism with 'catastrophic dilemmas'—scenarios where following the rule leads to absolute ruin. If adhering to this prohibition against targeting innocents renders a nation incapable of defending itself against a totalitarian enemy who recognizes no such rules, does your ethic not effectively demand the suicide of the virtuous state? Is there *any* hypothetical scenario where you would permit the killing of innocents, or is the rule truly exceptionless even in the face of extinction?"

  *   **The Trap Follow-up:** (She will likely bite the bullet and say the rule is exceptionless, or that God/Providence handles the outcome.)
      *   **Follow-up:** "If the rule is exceptionless even in the face of extinction, then morality is disconnected from human flourishing entirely. If the result of being 'good' is that the good cease to exist, aren't you defining virtue in a way that makes it unsustainable for any actual human community to practice?"

  ### 4. The Definition of "Innocence" in Industrial War
  **Question:** "In *Mr. Truman's Degree*, you treat the victims of Hiroshima as 'innocents' in the moral sense. However, this was a total war economy. Many of those killed worked in home factories producing anti-aircraft guns or were part of the civil defense network. In a modern industrial war, isn't the distinction between 'combatant' and 'civilian' blurred to the point of uselessness? If a worker is tightening bolts on a Zero fighter, are they not materially cooperating in the violence, thus losing their status as 'innocent' in the way you require?"

  *   **Follow-up:** "If you concede that some civilians are legitimate targets due to industrial contribution, where do you draw the line? Is it the factory gate? The tax office that funds the war? If there is a line, isn't Truman's error one of *degree* rather than *kind*?"

  ### 5. Subjective Intention vs. Objective Act
  **Question:** "You judge Truman based on the objective nature of the act: the intentional killing of innocents. But what about Truman's subjective intention? Historical records suggest he believed the bomb was a military necessity to end the war quickly, not an act of malice. In virtue ethics, doesn't the agent's practical reasoning matter? If Truman genuinely believed he was targeting a military objective (the war-making capacity) and viewed the civilian deaths as a tragic but unavoidable side-effect, isn't your judgment based on *your* analysis of his intention rather than *his*?"

  *   **Follow-up:** "If the morality of the act depends on *your* philosophical analysis of the intention rather than the agent's own conscious reasoning, aren't you making moral judgment inaccessible to the agent themselves? How can a leader act virtuously if they cannot know the moral status of their act until a philosopher analyzes it post-hoc?"

  ### 6. The Propriety of the University's Role
  **Question:** "A core part of your pamphlet is the attack on Oxford itself. You argue that by granting the degree, the University becomes complicit in the act. But universities are meant to be places of open inquiry, not moral tribunals. By demanding Oxford police the moral conduct of statesmen, aren't you risking the politicization of the academy? If Oxford had refused the degree, would that not have been an act of political partisanship just as significant as granting it?"

  *   **Follow-up:** "If the University must withhold honors from anyone who has committed 'murder' in war, given the nature of 20th-century conflict, is there *any* statesman eligible for an honorary degree? If the answer is no, isn't the policy effectively an isolationist statement rather than a moral one?"

  ### 7. Democratic Complicity
  **Question:** "You focus intensely on Truman as the individual agent. But Truman acted within a democracy, with the support of his cabinet and the general will of the American people who desired an end to the war. If the act was indeed 'murder,' does the guilt rest solely on the signer of the order, or does it implicate the citizenry who demanded victory at any cost? If the latter, isn't singling out Truman for this degree denial a form of scapegoating that lets the rest of the moral community off the hook?"

  *   **Follow-up:** "If we are all complicit in the structures that allow such violence, is denying one man a degree merely a symbolic gesture that allows the rest of us to feel virtuous without addressing our own participation in the war system?"

  ### 8. The Viability of Just War Theory
  **Question:** "Your argument here is often cited as a cornerstone of modern Just War Theory, specifically the principle of non-combatant immunity. But if we accept your strict definition of 'intentionality,' does this not render almost all modern warfare impossible? High-altitude bombing, artillery, and even naval engagements invariably kill innocents as a means of area denial or morale breaking. Are you not arguing for a standard of warfare that is physically impossible to fight, thereby making 'Just War' a theoretical concept with no practical application?"

  *   **Follow-up:** "If a moral theory forbids the only means by which a state can realistically defend itself, does the theory lose its normative force? Or are you prepared to argue that pacifism is the only consistent outcome of your position?"
