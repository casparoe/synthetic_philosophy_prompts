      *   *Adjustment:* Emphasize that the "time-indexing" isn't just about clocks; it's about *defeasibility conditions*. The arrival of evidence changes the *context* of evaluation.
      *   *Check:* Is the Surprise Exam connection clear? It's about the *knowability* of future states.
      *   *Adjustment:* Make sure to highlight that in both cases, assuming you *will* know something leads to a contradiction.

