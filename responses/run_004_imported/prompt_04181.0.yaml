      *   **Conclusion:** Summarize. ISOTYPE is a pragmatic tool, but epistemologically, it cannot claim the foundational neutrality Neurath sometimes suggested. It is just another part of the boat.

  6.  **Refining the Argument (Self-Correction/Nuance):**
