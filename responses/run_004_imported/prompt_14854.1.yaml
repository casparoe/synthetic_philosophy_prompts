      *   *Philosophical Critique:* Just because two things are *necessarily co-instantiated* (in our current psychology) doesn't mean they are *identical*. Pain might always accompany tissue damage, but pain isn't tissue damage (it's the experience of it).
      *   *James's Move:* He's making an identity claim based on phenomenological exhaustion. If you take away the feeling, what's left? Just a thought. Therefore, the feeling *is* the emotion.

