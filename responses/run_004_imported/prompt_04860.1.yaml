  2.  **Deconstruct the Frame Problem in this Context:**
      *   *The Philosophical Core:* How does an agent (the committee) determine which facts remain unchanged (the frame) and which change after an action (building the data center), without checking *everything*?
      *   *Camp A's Approach:* Assume almost everything else stays the same (inertial frame). Only look at immediate physical changes. Risk: Missing systemic externalities (Dennett's robot that sits forever deducing).
      *   *Camp B's Approach:* Assume nothing stays the same unless proven otherwise. Trace all connections. Risk: Infinite regress, analysis paralysis (Dennett's robot that blows itself up because it considered the color of the walls changing the structural integrity).
      *   *The Solution:* We need a *relevance criterion* that isn't arbitrary but isn't infinite. In environmental law/policy, this is often handled by concepts like "significance," "foreseeability," or "control." But given the user's philosophical bent, we should frame it in terms of *counterfactual dependence* and *agency*.

  3.  **Develop the "Stopping Rule":**
      *   *Idea 1: Temporal/Spatial Boundary.* (Too arbitrary, Camp B hates this).
      *   *Idea 2: Control/Agency.* Stop where the university's direct control ends. (Problem: Camp B argues market signals *are* a form of influence).
      *   *Idea 3: The "But-For" + "Marginal Contribution" Test.* This is standard in economics and LCA (Life Cycle Assessment).
      *   *Idea 4: The "Policy Leverage" Criterion.* This fits best. We analyze impacts where our decision *makes a difference* to the outcome. If the chip fab happens regardless of *this* specific data center, it's outside the frame. If *this* data center triggers a substation upgrade that wouldn't have happened otherwise, it's inside.
      *   *Refining the Rule:* Let's call it the **"Material Counterfactual Threshold."** An effect is in scope if:
          1.  It is a foreseeable consequence of the specific project action.
          2.  The project is a *necessary condition* (or significant marginal contributor) to that effect occurring *when and how* it does.
          3.  The effect is actionable (the committee can mitigate it).

      *   *Wait, let's look closer at the Frame Problem.* The Frame Problem is about *representation*. What do we need to represent in our model?
      *   *Better Rule:* **"The Relevance of Mitigation" Rule.** We trace the causal chain until the point where our mitigation authority becomes negligible compared to background noise.
      *   *Even Better (Philosophical/Practical Hybrid):* **"The Decision-Sensitive Boundary."** We include effects that would *not* occur (or would occur significantly differently) *but for* this specific approval, provided they are reasonably foreseeable. This aligns with NEPA (National Environmental Policy Act) "cumulative impacts" guidance but tightens it to avoid infinite regress.
      *   *Let's synthesize:* The rule needs to acknowledge Camp B's point (causal chains don't just stop) but provide a heuristic for *relevance*.
