answer: |-
  **MEMORANDUM**

  **TO:** Environmental Review Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Causal Boundary Standards in Project Scoping (AI/HPC Data Center)

  **1. Context and Problem Definition**
  The Committee is currently deadlocked on the scope of the Environmental Impact Report (EIR) for the proposed AI/HPC Data Center. One faction advocates for a narrow scope (direct onsite effects); the other argues for a broad scope (systemic and upstream effects). 

  As a retired atmospheric chemist now studying the philosophy of action, I recognize this impasse not as a procedural failure, but as a practical instantiation of the **"Frame Problem."** In logic and AI, this is the challenge of determining which background conditions remain unchanged by an action and which do not. 

  *   **Camp A** assumes a "closed frame" (everything not explicitly linked stays constant). This risks the error of *omission*, ignoring systemic externalities.
  *   **Camp B** assumes an "open frame" (trace all causal links). This risks the error of *infinite regress*, where analysis becomes paralyzed by distant, speculative consequences.

  Camp B is correct that drawing a line at the property boundary is arbitrary. However, Camp A is correct that we cannot analyze the entire global economy. We need a principled stopping rule that is neither arbitrary nor infinite.

  **2. Proposed Stopping Rule: The Counterfactual Leverage Test**
  I propose the Committee adopt the **"Counterfactual Leverage Test"** for all future project scoping. An effect is included in the EIR scope if and only if it meets three criteria:

  1.  **Counterfactual Dependence:** Would this effect occur *when and how* it does *but for* this specific project approval? (If the effect happens regardless of our decision, it is background noise, not a project impact.)
  2.  **Foreseeable Probability:** Is the causal link supported by empirical data or established modeling, rather than speculative narrative?
  3.  **Mitigation Leverage:** Does the University retain the agency to mitigate, monitor, or compensate for this effect through conditions of approval?

  This rule validates Camp B's insight (causal chains are real) while providing Camp A's necessary constraint (agency and relevance). It shifts the boundary from *spatial* (onsite vs. offsite) to *decision-sensitive* (influenced by us vs. independent of us).

  **3. Application to the AI/HPC Data Center**
  Applying this test to the current points of contention yields the following scoping decisions:

  *   **Onsite Power & Cooling (In Scope):** Meets all criteria. Direct dependence, high foreseeability, high leverage.
  *   **Regional Grid Marginal Emissions (In Scope):** Meets criteria. Our load affects dispatch decisions on the regional grid (Counterfactual). We can purchase RECs or fund grid storage to mitigate (Leverage).
  *   **Induced Substation/Construction Jobs (In Scope):** Meets criteria. If the substation is built *specifically* to serve this load, it is counterfactually dependent. We can condition approval on undergrounding or landscaping (Leverage).
  *   **Upstream Chip Fabrication (Out of Scope for EIR):** Fails Criteria 1 & 3. While our demand contributes to the market, *this specific project* does not trigger the construction of a specific fab facility (Counterfactual failure). We cannot mitigate fab emissions through land-use conditions on this building (Leverage failure).
      *   *Recommendation:* While out of scope for the *EIR*, Camp B's concern regarding embodied carbon is valid. I recommend we refer this to the **Procurement Office** for a separate Institutional Carbon Policy review. This acknowledges the impact without breaking the environmental review process.

  **4. Recommendation**
  1.  **Adopt the Counterfactual Leverage Test** as the standard for causal boundary setting in all future Committee charters.
  2.  **Approve the Scope** as detailed in Section 3 (including grid emissions and induced infrastructure, excluding upstream manufacturing).
  3.  **Refer Upstream Emissions** to the Sustainability Council for a broader procurement policy, ensuring Camp B's substantive concerns are addressed in the appropriate venue.

  This approach ensures our reviews are rigorous and philosophically consistent, avoiding both the blindness of narrowness and the paralysis of infinite regression.

  **[Your Name]**
  **[Your Title/Affiliation]**
