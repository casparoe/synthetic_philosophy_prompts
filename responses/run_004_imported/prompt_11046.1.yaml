      *   *Source:* All authority comes from God (Romans 13:1).
      *   *Purpose:* The common good, order, virtue.
      *   *Nature:* It's a *relation* between ruler and ruled, grounded in reason and divine order.

  3.  **Address the Specific Distinctions:**

      *   **Distinction 1: Defect in the Person (Unworthiness) vs. Defect in Acquisition (Usurpation).**
          *   *User's intuition:* Conduct matters more than title.
          *   *Aquinas's logic:* Authority is an *office* (function), not a personal property.
          *   *Why obey the unworthy?* Because the *office* is from God. The sin is the ruler's, not the subject's. To disobey based on personal unworthiness is to judge the divine appointment (or the communal selection) based on moral merit, which destabilizes order. The authority inheres in the *role*, not the *soul*.
          *   *Why not obey the usurper?* Because there is no *office*. It's force, not authority. It's theft. There is no divine/communal sanction *yet*. It lacks the essential form of authority (legitimacy).
          *   *Key Concept:* *Titulus* (Title) vs. *Usus* (Use). A bad title means no authority exists. A bad person means authority exists but is wielded poorly.

      *   **Distinction 2: Abuse of Authority (Sinful Commands vs. Ultra Vires).**
          *   *Sinful Commands:* Contradict the *end* of authority (virtue/God). Authority cannot command against God. Obedience here is impossible for a Christian.
          *   *Ultra Vires (Outside Scope):* Contradict the *limits* of authority. The ruler has no claim here. Obedience is optional because there is no obligation binding the conscience, but no sin in complying either (usually).

  4.  **Synthesize the "Unifying Idea":**
      *   It's not ad-hoc. It's based on **Final Causality** (Purpose) and **Formal Causality** (Legitimacy/Structure).
