answer: |-
  This is an excellent translation and a sharp question. You have put your finger on the exact tension that makes medieval political thought feel alien to modern democratic intuitions. To modern ears, "illegitimate acquisition" (e.g., a rigged election or a coup) and "personal unworthiness" (e.g., corruption or immorality) often feel like variations of the same problem: illegitimacy.

  For Aquinas, however, they are metaphysically distinct categories. Your suspicion that this might be "ad-hoc" is understandable, but it is actually a rigorous application of his metaphysics of **causality** and **teleology**.

  Here is the walkthrough of the logic that binds these distinctions together.

  ### 1. The Unifying Idea: Authority is an *Office*, not a Property
  The core concept you need to unlock this passage is that for Aquinas, political authority (*potestas*) is not a personal possession or a reward for virtue. It is a **functional office** established for the sake of the *common good*.

  Think of it like a sacrament or a judgeship.
  *   **The Sacramental Analogy:** A corrupt priest can still validly consecrate the Eucharist. The power of the sacrament comes from God and the Office of the Priesthood, not from the personal holiness of the man. If the power depended on his holiness, no one could ever be sure they received grace.
  *   **The Judicial Analogy:** A judge who beats his wife is still a judge. His rulings in court are legally binding. If his rulings were voided because he was personally unworthy, the legal system would collapse into chaos every time a official sinned.

  Aquinas applies this same logic to secular rule. Authority flows from God (the primary cause) through the structure of society (the secondary cause).

  ### 2. Defect in the Person vs. Defect in Acquisition
  This is the distinction that bothers you most, so let's dwell on it.

  **Case A: Defect in the Person (*Ex defectu personae*)**
  *   **The Logic:** The authority itself is validly constituted. The "form" of authority is present. The defect is merely in the "matter" (the human being holding the office).
  *   **Why Obey?** Because you are obeying the *Office* and the *Order* that God has established, not the man. If subjects could withhold obedience whenever they deemed a ruler "unworthy," every subject becomes a judge of the ruler's soul. This leads to anarchy.
  *   **The Limit:** You obey in civil matters. You do not obey in spiritual matters (sin).
  *   **Modern Parallel:** We still do this. We obey laws passed by politicians we personally find immoral, because we respect the *office* and the *process*, not the person.

  **Case B: Defect in Acquisition (*Ex defectu tituli*)**
  *   **The Logic:** Here, the "form" of authority is missing entirely. There is no office, only force. Aquinas views this as theft. A usurper is not a "bad ruler"; he is not a ruler *at all*. He is a private individual exercising force without right.
  *   **Why Not Obey?** Because there is no divine or communal sanction grounding the obligation. The link to God (Romans 13:1) is broken because the power was not "ordained" through proper channels; it was seized.
  *   **The Caveat:** Notice the escape hatch in your translation: *"unless it's later made legitimate... by the subjects' own consent or by a higher authority."* Aquinas is a pragmatist. If the community accepts the usurper, or the Pope/Emperor ratifies him, the defect is healed. The authority becomes real retroactively.

  **Why this isn't backwards:**
  For Aquinas, **Order is the prerequisite for Virtue.** A tyrant who seized power (Defect in Acquisition) threatens Order itself. A saintly ruler who was elected properly but turns out to be a sinner (Defect in Person) preserves Order. Aquinas fears civil war (the breakdown of order) more than he fears the personal sins of a magistrate.

  ### 3. The Axis of Abuse: Teleology (The "End" of Authority)
  The second half of your passage deals with the *Use* of authority (*Usus potestatis*). This is where the **Final Cause** (the purpose) comes in.

  Authority exists for one end: **The Common Good (which ultimately points to God).**

  **Case A: Commands against the Purpose (Sin)**
  *   **Logic:** If authority is ordained by God to lead men to virtue/order, it cannot logically command what contradicts God.
  *   **Obligation:** You are *required* to disobey. To obey here is to participate in the destruction of the very thing authority is meant to protect. This is the "We must obey God rather than men" principle (Acts 5:29).
  *   **Connection to Acquisition:** Notice this applies to *both* valid rulers and usurpers. Even a validly elected ruler loses claim to obedience if he commands apostasy.

  **Case B: Commands Outside the Scope (*Ultra Vires*)**
  *   **Logic:** The ruler demands something he has no jurisdiction over (e.g., a king demanding you pay a private debt to him, or a master demanding a servant do something unrelated to their service).
  *   **Obligation:** Indifferent. You aren't *sinning* by obeying (unless it becomes burdensome), but you aren't *sinning* by refusing. There is no bond of justice tying you here.
  *   **Why the distinction?** This protects the subject from exploitation without necessitating rebellion. It says, "He has no right to ask this," without saying, "He is a tyrant deserving of death."

  ### 4. Is it Ad-Hoc?
  It is not ad-hoc; it is **Scholastic Taxonomy.** Aquinas is breaking down the concept of "Authority" into its constituent causal parts:

  1.  **Efficient Cause (Where did it come from?):**
      *   From God/Community via proper channel? = **Valid Title.**
      *   From Force/Fraud? = **Invalid Title (Usurper).**
  2.  **Material Cause (Who holds it?):**
      *   Worthy? = **Good.**
      *   Unworthy? = **Bad, but Valid.**
  3.  **Final Cause (What is it for?):**
      *   Common Good/Virtue? = **Proper Use.**
      *   Private Gain/Sin? = **Abuse (Tyranny).**

  Your intuition ("conduct in office should matter more than paperwork") is **Modern/Lockean**. Locke argues that legitimacy comes from the *consent of the governed* and the protection of rights. If the ruler violates rights, the contract is broken.

  Aquinas's intuition is **Medieval/Augustinian**. Legitimacy comes from **Divine Ordinance and Ontological Order**. The "paperwork" (the title) matters more because it signifies that the ruler is part of the Divine Hierarchy. A bad man in a legitimate spot is a tragedy; a good man in an illegitimate spot is a contradiction.

  ### 5. Summary of the Logic
  To answer your specific worry:
  *   **Why obey the unworthy?** Because the authority belongs to the *station*, not the *soul*. Disobedience here attacks the Divine Order.
  *   **Why not obey the usurper?** Because there is no *station*. There is only violence. Resistance here restores the Divine Order.
  *   **Why the separate abuse axis?** Because even a legitimate ruler in a legitimate station can command against God. When that happens, the *Final Cause* overrides the *Efficient Cause*. God's authority trumps the King's authority.

  **One final note on context:** This is Aquinas's commentary on the *Sentences* (his early work). In his later *De Regno* and *Summa Theologiae*, he becomes slightly more permissive regarding the removal of tyrants (especially usurpers), allowing for public authority to depose them. But the fundamental logic you identified here remains consistent: **Authority is a trust from God for the common good; when the trust is broken by sin, you disobey the command; when the trust is broken by theft of office, you may resist the ruler.**
