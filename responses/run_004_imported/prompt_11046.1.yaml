      *   **Topic:** Obligation to obey secular rulers (including tyrants).
      *   **User's Translation:** A rough but accurate-enough English rendering of the Latin distinctions.
      *   **The Problem:** The user finds the distinction between "defect in the person" (unworthy but obey) vs. "defect in acquisition" (usurper, don't obey) counterintuitive. They feel conduct in office should matter more than title acquisition. They also note the separate axis of "abuse of authority" (sinful commands vs. ultra vires commands).
      *   **The Request:** A walkthrough of the underlying logic. Is there a unifying idea of "authority" here, or is it ad-hoc?

  2.  **Deconstruct Aquinas's Framework (The "Unifying Idea"):**
