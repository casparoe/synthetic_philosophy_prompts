    "Tichy-Oddie": {"score": <int>, "reason": "<...>"},
    "Niiniluoto": {"score": <int>, "reason": "<...>"},
    "Kuipers": {"score": <int>, "reason": "<...>"},
    "Schurz-Weingartner": {"score": <int>, "reason": "<...>"}
  }
  ```
