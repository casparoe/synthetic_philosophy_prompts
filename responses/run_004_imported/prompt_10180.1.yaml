answer: |-
  This is not merely an awkward social dilemma; you have stumbled directly into one of the oldest and thorniest problems in political philosophy and institutional design. In academic terms, you are facing **The Boundary Problem** (sometimes called the "Problem of the Unit" or "Rehfeld's Paradox").

  The paradox is exactly as you described: To decide who decides, you need a decision rule. But to choose that rule, you need to decide who decides *that*. It is an infinite regress. There is no logically non-arbitrary way to define the boundaries of a democracy from within the democracy itself.

  Given your background (rationalist meetup, East Bay), you likely appreciate mechanism design and game theory. Here is the breakdown of why this is stalling you, why you won't find a perfect philosophical solution, and a concrete, tiered framework to break the deadlock at your next meeting.

  ### 1. Why This Produces a Regress

  You are trying to solve a **Constitutional** problem using **Legislative** tools.

  *   **The All-Affected Principle:** You tried "whoever is affected." As you noted, this fails because impact is a gradient, not a binary. The neighbor is affected by noise; the partner is affected by pets; the subletter is affected by the roof. If impact grants votes, the franchise expands until it includes the whole city.
  *   **The All-Subjected Principle:** You tried "whoever is bound by the rules." This is better, but it creates the problem of the incoming housemates. They will be subject to the rules but are currently excluded from the "constituent assembly."
  *   **The Voting Paradox:** Voting on who gets to vote is a conflict of interest. Current insiders will naturally select a boundary that preserves their power. This destroys the legitimacy of the charter before it is even written.

  **The Hard Truth:** There is no non-arbitrary line. Any line you draw (3 months residency? 50% of nights slept here? Legal liability?) is arbitrary. The goal is not to find the *true* boundary, but to find a **stable Schelling point** that minimizes resentment and maximizes house stability.

  ### 2. Theoretical Way Out: Distinguish Sovereignty from Governance

  To break the regress, you must acknowledge that the power to write the charter does not come from the house; it comes from the **Master Lease**.

  Legally, the five signatories are the sovereigns. The landlord recognizes only them. If the house burns down or the rent isn't paid, the landlord sues them, not the subletters or the partners. Therefore, the signatories possess the *constituent power*. They cannot "vote" on whether they have this power; they *have* it.

  However, exercising that power without the consent of the residents creates a tyranny that will cause the house to collapse (subletters leave, conflict rises, rent becomes hard to collect).

  **The Solution:** The signatories must **voluntarily delegate** voting rights to create stability. This is not a right the residents claim; it is a privilege the signatories grant to ensure the house functions. This breaks the regress: The authority flows from the Lease (external) -> Signatories -> Charter -> Residents.

  ### 3. Concrete Recommendations for the Next Meeting

  Do not try to vote on "who gets a vote." Instead, propose a **Tiered Citizenship Model**. This acknowledges that different stakeholders have different types of stakes.

  Here is a specific framework you can bring to the table:

  #### A. Define Three Tiers of Membership
  Instead of a binary Voter/Non-Voter, create three categories with specific rights:

  1.  **Stewards (The Signatories):**
      *   *Criteria:* Names on the master lease.
      *   *Rights:* Veto power on financial liabilities (rent, roof replacement, major repairs) and legal compliance.
      *   *Rationale:* They carry the risk; they hold the ultimate safety valve.
  2.  **Residents (The Citizens):**
      *   *Criteria:* Living in the house for >3 months + contributing to shared expenses (groceries/cleaning). Includes subletters.
      *   *Rights:* Vote on social policy (pets, quiet hours, guests, cleaning rosters, shared grocery budget).
      *   *Rationale:* They experience the day-to-day externalities. A subletter of 2 years has more skin in the game regarding "quiet hours" than a signatory who travels constantly.
  3.  **Associates (Partners/Frequent Guests):**
      *   *Criteria:* Sleep over >3 nights/week consistently.
      *   *Rights:* No general vote. **Consultation Veto** on specific externalities.
      *   *Rationale:* Your allergic partner example is perfect. Under this model, the house cannot vote to get a cat if an Associate has a documented allergy, even if all Residents vote yes. They don't get to vote on the roof, but they get protection from specific harms.

  #### B. The "Constitutional Convention" Exception
  You have a specific problem with the **incoming housemates** and the **current subletters**. If you finalize the charter without them, it lacks legitimacy.

  *   **Recommendation:** Declare the next meeting a "Constitutional Convention," not a "House Meeting."
  *   **Attendance:** All current residents (Signatories + Subletters) + Incoming Housemates.
  *   **Voting Rule:** Consensus or Supermajority (e.g., 75%).
  *   **Logic:** The Signatories are granting the initial franchise. They should invite the people who will live under the law to help write it. This is an act of *granting* rights, not *claiming* them. It signals good faith.
  *   **Ratification:** The charter is only ratified if the Incoming Housemates agree to sign onto it as a condition of their move-in. This solves the "taxation without representation" issue for them; they get to say "I agree to these rules" before they are bound by them.

  #### C. Domain-Specific Voting
  Stop trying to have one vote for everything. Split the ballot:

  *   **Financial/Legal Decisions:** (Roof, Rent Hikes, Evictions) -> **Stewards Only.** (Subletters can advise, but Stewards decide).
  *   **Social/Common Space Decisions:** (Pets, Parties, Cleaning, Groceries) -> **Residents Only.** (Signatories get one vote each, same as subletters).
  *   **Externality Decisions:** (Noise, Driveway, Allergens) -> **Residents Vote, Associates Consult.**

  #### D. The "Sunset" Clause
  Since you acknowledge this is hard and you are on "Generation 12," admit that your first charter might be wrong.
  *   **Recommendation:** Write a clause that the charter must be reviewed and re-ratified every 12 months or upon the turnover of 50% of the residents.
  *   **Why:** This lowers the stakes. If you make a mistake on the voting boundaries, it isn't permanent. This makes it easier for Signatories to be generous with voting rights now, knowing they can reclaim them if the system breaks.

  ### 4. How to Pitch This at the Meeting

  When you reconvene, the discussion will likely spiral back into "But is it *fair* that..."

  Intervene with this framing:

  > "We are stuck because we are trying to find a philosophical truth about who *deserves* a vote. There isn't one. The neighbor doesn't get a vote not because they aren't affected, but because including them makes decision-making impossible.
  >
  > We need to stop trying to vote on the franchise. The five signatories legally hold the keys. The question is not 'Who has the right to vote?' but 'What distribution of voting rights makes this house stable for the next three years?'
  >
  > I propose we treat the Signatories as the Founders who are voluntarily writing a Constitution that grants rights to Residents. We include the subletters and incoming mates in this drafting session to ensure buy-in, but we acknowledge the Signatories hold the final veto on financial risk. Let's draft the tiers, try it for one year, and review."

  ### Summary of Action Items
  1.  **Acknowledge the Regress:** State clearly that voting on voting is circular and must stop.
  2.  **Adopt Tiered Rights:** Signatories (Financial Veto), Residents (Social Vote), Partners (Specific Veto).
  3.  **Include the Incoming:** Make the charter drafting a condition of their move-in negotiation, giving them a voice before they are bound.
  4.  **Set an Expiration:** Force a review of the voting rules in 12 months to reduce the pressure of getting it "perfect" today.

  This approach respects the legal reality (the lease), the social reality (subletters are residents), and the moral reality (partners shouldn't suffer allergic reactions due to a vote they couldn't cast), without requiring you to solve the Boundary Problem of Political Philosophy.
