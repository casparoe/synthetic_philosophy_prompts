  ok so a while back someone in an ACX open thread linked that old 2013 story about scientists using a computer to "mathematically prove" Gödel's proof of god, and it sent me down a rabbit hole of actually reading the real proof instead of just the pop-sci version. I think i basically followed the main argument ok, which as far as I can piece together goes something like this:

  - def 1 (God-like): x is God-like iff x has every positive property
  - def 2 (essence): φ is an essence of x iff x has φ, and φ necessarily entails every property x has
  - def 3 (necessary existence): x necessarily exists iff every essence of x is necessarily exemplified by something

  - ax 1: if φ is positive and necessarily entails ψ, then ψ is positive too
  - ax 2: for any φ, exactly one of φ or ¬φ is positive
  - ax 3: being God-like is itself a positive property
  - ax 4: if φ is positive, then its necessarily positive
  - ax 5: necessary existence is a positive property

  and from that you grind out the theorem □∃x G(x) — necessarily, a God-like thing exists. neat trick. but then i kept reading and apparently a philosopher named Sobel showed these same five axioms also force "modal collapse," meaning for literally ANY true proposition φ, nothing to do with God at all, you can derive □φ, so there's no contingency left anywhere and everything true turns out to be secretly necessary. every writeup i've found just hand-waves at "abstraction lets you cook up a property out of any old formula" and then skips straight to the punchline.

  can you actually walk me through the missing steps? specifically: which definition or axiom up there is secretly doing the illegitimate-feeling work, and why does whatever trick smuggles in "God necessarily exists" generalize to smuggle in literally any other true fact too? want an actual gears-level answer, not just "and then modal collapse happens."
