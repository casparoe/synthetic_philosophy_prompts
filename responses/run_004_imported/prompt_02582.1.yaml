answer: |-
  You have correctly identified the exact friction point. The "Modal Collapse" objection (most famously formalized by Jordan Howard Sobel in *Logic and Theism*, 2004) isn't a bug in the calculation; it's a feature of the logical machinery Gödel used to make the calculation work.

  The short answer is: **The Definition of Essence combined with Higher-Order Property Comprehension.**

  The proof treats "properties" in a way that is logically valid but metaphysically voracious. It allows you to turn *any true fact* into a *property of God*, and then the Definition of Essence forces that fact to be necessary.

  Here is the gears-level walkthrough of how the collapse happens, step-by-step.

  ### The Three Gears of Collapse

  To get Modal Collapse ($\phi \to \square \phi$), three specific components must grind together:

  1.  **S5 Modal Logic:** This is the engine. It gives us the rule $\diamond \square \phi \to \square \phi$. Once you prove something is *possibly necessary*, it becomes *actually necessary*. Gödel's proof gets God to $\square \exists x G(x)$ using this.
  2.  **Higher-Order Comprehension:** This is the smuggling mechanism. In the type of logic Gödel uses, for any formula $\alpha$, there exists a property $P$ such that $P(x) \leftrightarrow \alpha$. Crucially, $\alpha$ doesn't actually have to mention $x$.
  3.  **Definition 2 (Essence):** This is the transmission. It states that an essence entails **every** property the individual has. It does not distinguish between "intrinsic" properties (like omnipotence) and "trivial/extrinsic" properties (like "being such that 2+2=4").

  ### The Walkthrough

  Let's derive the collapse. We assume the standard theorems from Gödel's proof are already established (specifically, that a God-like being exists necessarily).

  **Step 1: The Necessary Existence of God**
  From Gödel's axioms, we have already derived Theorem 3:
  $$ \square \exists x G(x) $$
  There exists a God-like being in every possible world. Let's call this being $g$.

  **Step 2: God-likeness is the Essence of God**
  It is a derivable theorem in the system that if $x$ is God-like, then the property $G$ is the essence of $x$.
  $$ G(x) \to G \text{ ess } x $$
  Since $\square \exists x G(x)$, we know that in every world, there is a $g$ such that $G$ is the essence of $g$.

  **Step 3: The "Property Trick" (Comprehension)**
  Pick **any** true proposition $\phi$. It can be anything. "The cat is on the mat." "I am wearing socks." $\phi$ is true in the actual world.
  In Higher-Order Logic, we can define a property $Q_\phi$ as:
  $$ Q_\phi(y) \iff \phi $$
  This is the property of "being such that $\phi$ is true." Note that $y$ does not appear on the right side. This is a "Cambridge property" or a logical artifact.
  *   If $\phi$ is true, then $\forall y, Q_\phi(y)$ is true.
  *   Therefore, $Q_\phi(g)$ is true. God has the property of "being such that $\phi$ is true."

  **Step 4: Running the Essence Definition**
  Now we apply **Definition 2** (Essence).
  Recall the definition: $\psi \text{ ess } x \iff \psi(x) \land \forall \chi [\chi(x) \to \square \forall z (\psi(z) \to \chi(z))]$.

  Substitute our variables:
  *   $\psi$ is $G$ (God-likeness).
  *   $x$ is $g$ (the God-like being).
  *   $\chi$ is $Q_\phi$ (the property "being such that $\phi$").

  We know $G \text{ ess } g$ (from Step 2).
  We know $Q_\phi(g)$ (from Step 3, because $\phi$ is true).
  Therefore, by the definition of Essence, $G$ must entail $Q_\phi$ necessarily:
  $$ \square \forall z (G(z) \to Q_\phi(z)) $$

  **Step 5: The Collapse**
  Unpack $Q_\phi(z)$. It just means $\phi$.
  So the formula becomes:
  $$ \square \forall z (G(z) \to \phi) $$
  This simplifies to:
  $$ \square (\exists z G(z) \to \phi) $$
  But we know from Step 1 that $\square \exists z G(z)$ (God exists necessarily).
  If the antecedent is necessarily true, the consequent must be necessarily true:
  $$ \square \phi $$

  **Conclusion:** For any true proposition $\phi$, $\phi$ is necessarily true. Contingency is dead.

  ### Which Axiom/Definition is the Culprit?

  You asked which definition is doing the "illegitimate-feeling work." It is primarily **Definition 2 (Essence)**, enabled by the background logic of **Property Comprehension**.

  Here is why it feels illegitimate:

  **1. The Conflation of Predication and Grounding**
  Metaphysically, we usually distinguish between properties that *constitute* an object (its nature) and facts that are merely *true of* an object.
  *   *Intrinsic:* "God is omnipotent." (This seems like part of God's essence).
  *   *Extrinsic/Trivial:* "God is such that the cat is on the mat." (This is true if the cat is on the mat, but it doesn't seem to flow from God's nature).

  Gödel's Definition 2 makes no such distinction. It says the essence must entail **every** property $\chi$ that $x$ has. Because the logic allows us to construct a property $\chi$ for *any* fact, the Essence is forced to "ground" every fact in the universe. Since the Essence is necessary (because God is necessary), every fact becomes necessary.

  **2. The "Positive" Filter Failure**
  You might wonder: "Doesn't Axiom 1 or 2 filter out bad properties?"
  Axioms 1 and 2 filter which properties are **Positive** ($P$). They determine what makes something *God-like*.
  However, Definition 2 (Essence) does not quantify over *Positive* properties. It quantifies over **all** properties ($\forall \chi$).
  Once God exists, He has *all* properties that are true of Him, not just the positive ones. He has the property "not being a stone" (which is likely the negation of a positive property). He has the property "being such that $\phi$."
  The Collapse happens because the *Essence* definition is too broad. It requires the essence to explain *everything* about the individual, including trivial logical artifacts created by property comprehension.

  ### How to Fix It (and why it breaks the proof)

  Philosophers who want to save the Ontological Argument from Modal Collapse usually have to weaken the logic in one of two ways, both of which hurt the original proof:

  1.  **Restrict Comprehension:** Deny that "being such that $\phi$" is a valid property. This requires moving to a logic where properties must be "natural" or "intrinsic." But Gödel's proof relies on Higher-Order Logic to define "God-like" as having *all* positive properties. If you restrict property formation, you might restrict the definition of God-likeness itself.
  2.  **Weaken Essence:** Change Definition 2 so that the essence only entails *essential* properties, not *all* properties. But then you need a prior definition of "essential property," which leads to circularity or requires you to stipulate that "existence" is essential without proving it via the positivity axioms.

  ### Summary
  The "trick" isn't in the axioms about positivity (1-5). It is in the **structural definition of Essence** interacting with **S5 Modal Logic**.

  By defining Essence as that which entails *every* property of the individual, and using a logic that allows *any truth* to be formatted as a *property of the individual*, the system forces the existence of a Necessary Being to act as a metaphysical anchor for every contingent fact in the universe. To save contingency, you have to deny that "being such that $p$" is a real property that needs essential grounding. To save the proof, you have to accept that it is. You can't have both.
