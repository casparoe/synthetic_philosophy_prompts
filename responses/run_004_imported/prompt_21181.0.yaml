answer: |-
  The air in the studio smelled of wet earth and turpentine. In the center of the room, on a rotating pedestal, stood *Goliath*, a formidable clay figure of a crouching athlete. Beside it stood an apprentice, holding a wooden mallet, waiting for a signal to flatten the piece back into a raw block for reuse.

  Two philosophers leaned against a workbench, watching the clay.

  **Marcus** (tapping his notebook): "It's a clean case. No tricky fission, no gradual replacement. Just a statue and the clay that makes it up. You're still committed to the two-object view, Elena? Right up until the mallet falls?"

  **Elena:** "I am. There are two numerically distinct objects occupying that space. There is the statue, Goliath, and there is the lump of clay, Lumpl. They are coincident now. In a moment, they will diverge."

  **Marcus:** "Diverge. That's the polite word for it. You mean Goliath will cease to exist, and Lumpl will survive the pounding. But here is where I lose you. Look at them. Really look. By your own admission, right now, they share all their proper parts. They share the same spatial location. They share the same categorical, non-modal properties—mass, shape, chemical composition. If I were a god looking at the ontology of this room, what fact would I see that distinguishes Goliath from Lumpl *now*?"

  **Elena:** "You're raising the grounding problem. Bennett's version."

  **Marcus:** "I am. If they are distinct objects, there must be a ground for that distinctness. Usually, we ground distinctness in a difference of properties. But you've admitted they share all their current categorical properties. The only difference you allow is modal: Goliath *would* be destroyed by the mallet; Lumpl *would not*. But modal properties don't float free, Elena. They need a categorical base. What is the non-modal fact about Goliath that makes it fragile in a way Lumpl is not, given they are made of the exact same clay arranged in the exact same way?"

  **Elena:** "The ground isn't a hidden physical particle, Marcus. It's the sortal concept under which the matter is organized. The clay is arranged *statue-wise*. That arrangement constitutes an object of the kind *Statue*. It also constitutes an object of the kind *Lump*. The modal properties flow from the kind. Goliath has the modal property 'perishes if smashed' in virtue of being a statue. Lumpl has the modal property 'survives if smashed' in virtue of being a lump."

  **Marcus:** "But that just pushes the question back. *Why* does being a statue entail perishing if smashed, while being a lump does not, if the underlying reality is identical? If the clay is the same, and the arrangement is the same, you're asking me to accept a brute modal difference. You're saying reality contains two distinct 'haecceities' or individual essences attached to the same matter, one fragile and one robust, with no categorical difference to explain why. That looks like magic. It looks like you're doubling entities without a truthmaker for the doubling."

  **Elena:** "It's not magic; it's sortal-dependence. The identity conditions are internal to the kind. To ask for a categorical ground *outside* the sortal nature is to misunderstand what constitution is. The fact that constitutes Goliath's fragility is simply that Goliath is a statue. That is a categorical fact about its classification, even if it doesn't show up on a spectrometer."

  **Marcus:** "A spectrometer scans the physical. Metaphysics scans the real. And the real doesn't like ghosts. If there's no categorical difference, there's no second object. There is only one object there, Elena. And right now, that object is a statue."

  **Elena:** "So you're a dominance theorist. Burke's view."

  **Marcus:** "Precisely. There is one object. Currently, it falls under the sortal *Statue*. The sortal *Statue* dominates the sortal *Lump*. They cannot both be the primary kind of the single object at the same time. So, there is no Lumpl coinciding with Goliath. There is just Goliath. When the apprentice swings that mallet, Goliath goes out of existence. The matter remains. And because the matter remains, a new object—a lump—comes into existence."

  **Elena:** "Hold on. 'Comes into existence'? That's your solution to the grounding problem? You avoid the brute modal difference by positing a brute generation of objects?"

  **Marcus:** "It's not brute generation. It's change. The matter persists. The object persists..."

  **Elena:** "Wait. You just said Goliath goes out of existence."

  **Marcus:** "Goliath *qua* statue goes out of existence. But the underlying object—the material substance—persists. It merely changes its dominant kind from *Statue* to *Lump*."

  **Elena:** "This is where I press you, Marcus. If the object persists, then the thing that survives the pounding is numerically identical to the thing that stood there before. Let's call the thing before the smash $O_1$ and the thing after $O_2$. You say $O_1 = O_2$. But you also say $O_1$ is essentially a statue, and $O_2$ is essentially a lump. If $O_1$ is essentially a statue, it cannot survive the smashing. So if $O_1$ survives, it wasn't essentially a statue. If it doesn't survive, then $O_2$ is a new object."

  **Marcus:** "You're trapping me in a dilemma I've already walked out of. I deny that the object is *essentially* a statue in the way you mean. The object has a dominant kind at time $t_1$. At $t_2$, after the smashing, it has a different dominant kind. The persistence conditions are determined by the dominant kind *at the time*. So, right now, it cannot survive smashing. After smashing, it is a lump, and it can survive further squashing. The identity is grounded in the continuity of the matter and the dominant kind at each stage."

  **Elena:** "But where does the lump come from, Marcus? That's my challenge to you. If there was no Lumpl coinciding with Goliath a moment ago—if you insist there was *only* Goliath—then when the mallet hits, you have to explain the origin of the survivor. If the survivor is Goliath, then Goliath survived, and you're wrong about statues. If the survivor is a *new* lump, then you have a lump popping into existence out of thin air, or rather, out of the ashes of Goliath. But the clay was already there! The lump-conditions were satisfied a moment ago. The clay was arranged lump-wise. Why wasn't there a lump then?"

  **Marcus:** "Because the *Statue* sortal was dominating. The matter was there, yes. The arrangement was there. But the existence conditions for a lump are not just 'clay arranged lump-wise.' They are 'clay arranged lump-wise *and not dominated by a more specific sortal*.' As long as the clay constitutes a statue, it does not constitute a distinct lump. It just is the statue."

  **Elena:** "So you're saying the existence of the lump is inhibited by the existence of the statue? That sounds like causal interaction between abstract kinds. But look at the symmetry of our problems. I accept two objects and struggle to ground their modal differences. You accept one object but struggle to ground the *temporal boundaries* of the kinds. You say the lump doesn't exist now because the statue dominates. But what grounds *that* dominance? Why does *Statue* win over *Lump*? Is it not just a brute, stipulated fact that 'statues dominate lumps'?"

  **Marcus:** "It's not stipulated; it's hierarchical. *Statue* is a more specific functional kind than *Lump*. When matter is organized to serve a function, that function determines the identity. It's not a brute fact; it's an explanatory principle. It saves us from your double-counting. If I drop a brick on Goliath, do I break one thing or two? On your view, I break the statue, but I don't break the lump. I have to track two histories for one region of space. On my view, I break one thing, which then becomes something else. It's ontologically cheaper."

  **Elena:** "Cheaper, perhaps. But is it accurate? You accuse me of brute modal facts. I accuse you of brute kind-shifts. You say the lump 'starts' existing when the statue dies. But intuitively, the lump was *there*. The clay didn't wait for the mallet to become a lump. It was always a lump that was *also* a statue. By denying Lumpl's existence now, you're saying the clay's nature changes retroactively or magically at the moment of destruction. You solve the grounding problem by denying the coexistence, but you create a 'problem of the survivor.' If Lumpl wasn't there, and Goliath dies, who is left to hold the clay?"

  **Marcus:** "The material substance is left. Look, Elena, we both want to respect the intuition that the clay survives. I respect that by saying the object persists through a change of kind. You respect that by saying a second object was hiding in the shadows all along. My worry is that your 'hiding' object has no work to do. It has no distinct mass, no distinct location, no distinct categorical properties. It is a shadow ontology. Mine might have a complex account of kind-dominance, but at least I don't have two things in one place."

  **Elena:** "And my worry is that your 'dominance' is a gerrymandered rule designed solely to avoid the coincidence you dislike. You say the lump doesn't exist because the statue does. But if the statue is destroyed, suddenly the lump *can* exist? It's as if the statue's existence casts a shadow that prevents the lump from being real. That seems just as mysterious as my 'modal differences.' At least my view acknowledges the intuition that both the statue-conditions and the lump-conditions are fully satisfied right now. Yours requires us to believe that satisfying the conditions for a lump isn't enough to make a lump, if a statue is also present. That's a heavy theoretical cost."

  **Marcus:** "It's a cost I'll pay to avoid the explosion of objects. Imagine a house made of bricks. On your view, there is the house, and the bricks, and the mereological sum of the bricks, and the lump of building material... all coincident. It's an ontological riot."

  **Elena:** "It's not a riot; it's richness. Reality is layered. The fact that we can't point to a 'lump-particle' distinct from a 'statue-particle' doesn't mean there's only one object. It means objects aren't just bags of particles. They are constituted by them. The grounding of the modal difference isn't in the particles, Marcus. It's in the *constitution relation* itself. Goliath is constituted by Lumpl. That relation is the ground. It's not categorical in the sense of shape or mass, but it's a real, metaphysical relation."

  **Marcus:** "A relation between two things that share all parts? That relation looks suspiciously like identity with extra steps."

  **Elena:** "And your 'dominant kind' looks like identity with extra restrictions."

  The apprentice shifted his weight. The mallet rose.

  **Marcus:** "We're about to find out which intuition breaks. If I'm right, one thing dies. If you're right, one thing dies and another survives."

  **Elena:** "If I'm right, the truth is complex. If you're right, the truth is simple. But simplicity isn't always truth, Marcus. Sometimes reality is just coincident."

  **Marcus:** "And sometimes our language creates ghosts that aren't there."

  The mallet fell. The sound was a wet, heavy thud. The athlete collapsed into an amorphous mound of grey clay.

  **Elena:** "Goliath is gone."

  **Marcus:** "Goliath is gone. The lump remains."

  **Elena:** "Was it there a second ago?"

  **Marcus:** "No. It's here now."

  **Elena:** "Then it came from nowhere."

  **Marcus:** "It came from the clay. Just not as a distinct object."

  They stood in silence as the apprentice began to knead the clay, the grey mass yielding under his hands, offering no further argument to settle the dispute.
