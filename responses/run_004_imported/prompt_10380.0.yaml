answer: |-
  Your intuition is spot-on, and you should definitely trust it over your roommate's quick diagnosis. While the **Sunk Cost Fallacy** is definitely present, labeling it that way is descriptive, not explanatory. It tells you *what* is happening (ignoring irrecoverable costs), but not *why* it persists in a strategic environment or *how* the interactive nature of the dispute changes the incentives.

  For a behavioral econ seminar, this is actually a goldmine because it sits right at the intersection of **psychology (individual decision-making)** and **game theory (strategic interaction)**.

  Here is a breakdown of what is likely going on, moving beyond the basic bias label into the mechanisms driving the escalation.

  ### 1. The Game Theory: The "Dollar Auction" Trap
  The specific dynamic you described—where two parties bid against each other for a prize worth less than the bids—is a classic game theory paradox called the **Dollar Auction** (proposed by Martin Shubik in 1971).

  *   **The Setup:** An auctioneer sells a \$1 bill. The highest bidder gets the dollar, but *both* the highest and second-highest bidders must pay their bids.
  *   **The Trap:** Bidding starts at 1 cent. It quickly reaches 99 cents vs. \$1.00. Now the 99-cent bidder faces a choice: lose 99 cents (if they stop) or bid \$1.01 to potentially break even (if the other stops).
  *   **The Application:** Your uncle and the neighbor are in a Dollar Auction. The "prize" is the driveway strip (plus the utility of "winning"). The "bids" are legal fees.
  *   **Why Rationality Fails:** In a standard auction, you drop out when the price exceeds the value. In a Dollar Auction (or litigation), dropping out means you lose *everything* you've already spent *and* you lose the asset. Continuing offers a non-zero probability of recouping some value (or at least inflicting pain on the opponent).
  *   **The Escalation:** The neighbor's active escalation changes the payoff matrix. If your uncle stops, he doesn't just save future fees; he effectively "pays" the past fees for nothing. If he continues, there is a chance the neighbor blinks first. This turns it into a **War of Attrition**.

  ### 2. The Psychology: Why Walking Away Gets Harder
  You asked: *"Why does walking away seem to get harder the more has already been spent, when logically it should arguably get easier?"*

  Logically, you are correct: Marginal Cost should be the only thing that matters. If the next legal filing costs \$5k and the expected value of winning is \$2k, you stop. But psychologically, the **Total Cost** bleeds into the decision via a few mechanisms:

  **A. Cognitive Dissonance & Self-Perception**
  Your uncle likely views himself as a rational, competent person. Admitting that he spent \$60k on a \$2k strip of pavement creates massive cognitive dissonance. It implies he made a terrible mistake.
  *   **Resolution:** To reduce this dissonance, he must convince himself the fight is *not* about the pavement anymore. It's about "principle," "justice," or "protecting our property rights." This reframing increases the subjective value of the prize, making the continued spending feel rational *in the moment*.

  **B. Prospect Theory & Loss Aversion**
  In Prospect Theory (Kahneman & Tversky), losses loom larger than gains.
  *   **Reference Point Shift:** Initially, the reference point was "owning the driveway." Now, the reference point has shifted. The \$60k is spent. A settlement now is framed as a **certain loss** of \$60k. Continuing the fight is framed as a **gamble** to avoid that loss.
  *   People are risk-seeking in the domain of losses. Your uncle would rather take a risky bet (spend another \$10k for a 20% chance of winning) than accept a certain loss (settle and confirm the \$60k was wasted).

  **C. The "Just World" Hypothesis & Revenge Utility**
  You noted: *"he's also admitted he probably wouldn't even care about the driveway if the neighbor hadn't fought back."*
  This is crucial. His utility function ($U$) is not just Monetary Value ($M$).
  $$U = M + P - C$$
  Where $P$ is "Punishment/Justice" and $C$ is Cost.
  If the neighbor escalates, the value of $P$ (seeing the neighbor held accountable or defeated) goes up. The fight is no longer about the asphalt; it's about the **emotional utility of not being bullied**. In his mind, settling isn't saving money; it's "letting them win," which has a high negative psychological cost.

  ### 3. Strategic Reputation (The "Rational" Argument)
  Is there *any* rationality here? In a **Repeated Game** context, yes.
  If your uncle lives there for 30 more years, backing down on the driveway might signal to the neighbor (and the community) that he is a "pushover."
  *   **Credible Threats:** If he folds now, the neighbor might encroach on the garage next. By fighting irrationally hard on a small issue, he is building a **reputation for toughness** to deter future aggression.
  *   **The Problem:** This is only rational if the *future* deterrence value exceeds the *current* \$60k cost. In almost all driveway cases, it does not. But actors often overestimate the likelihood of future encroachments (Availability Heuristic).

  ### 4. Is the Neighbor in the Same Trap?
  Almost certainly. This is a **symmetric escalation**.
  *   **Reactive Devaluation:** Any settlement offer your uncle makes is devalued by the neighbor simply because it came from the "enemy," and vice versa.
  *   **Mirror Imaging:** Both sides likely believe *they* are the rational ones reacting to the *other's* irrational aggression. "If they would just stop, I would stop." This creates a coordination failure where both are waiting for the other to absorb the sunk cost.

  ### Seminar Takeaway: How to Frame This
  If you bring this up in class, you can elevate the discussion by distinguishing between **Ex-Ante** and **Ex-Post** rationality.

  1.  **Ex-Ante (Before the fight):** Rational choice says "Don't spend \$60k on a \$2k asset."
  2.  **Ex-Post (Now):** The decision is no longer about the asset. It is about **minimizing regret** and **maximizing subjective utility** (pride, justice, reputation).
  3.  **The Roommate's Error:** Calling it "sunk cost fallacy" assumes the actor is trying to maximize monetary wealth. If the actor is maximizing "ego preservation" or "reputation," continuing to spend money might actually be utility-maximizing *for them*, even if it looks insane to an outsider.

  **The Verdict:**
  Your uncle is trapped in a **Dollar Auction** fueled by **Loss Aversion** and **Cognitive Dissonance**. The neighbor's active escalation transforms a static investment decision into a dynamic **War of Attrition**. Walking away gets harder because the "cost" of walking away isn't just the future legal fees; it's the psychological realization that the past \$60k was a mistake. Humans will burn \$10,000 more to avoid admitting they wasted \$60,000.

  This is a perfect example of why Behavioral Econ matters: Standard Rational Choice Theory predicts the fight should have ended years ago. Behavioral Econ explains why it's still going.
