answer: |-
  **Setting:** *The faculty lounge of a law school, late afternoon. Two professors, ELENA (Textualist) and MARCUS (Purposivist), are grading papers but mostly debating a recent moot court problem based on a hypothetical statute.*

  **The Case:** *United States v. Kessler*. The statute is the "Victim Compensation Act." Section 101 states: "In all criminal prosecutions, the Court shall order restitution paid by the Defendant to the **Plaintiff**." Kessler is a criminal defendant. There is no civil plaintiff in the case, only a crime victim. The government wants restitution paid to the victim. Kessler argues the text says "Plaintiff," and since there is no plaintiff, no restitution is owed.

  **MARCUS:** (Putting down a red pen) You're telling me you'd rule for Kessler. No restitution for the victim. Because the drafter wrote "Plaintiff" instead of "Victim."

  **ELENA:** I'm telling you the text says "Plaintiff." In our legal system, "Plaintiff" has a settled meaning. It denotes a party who initiates a civil suit. In a criminal prosecution, the government is the sovereign, and the injured party is a "victim." There is no plaintiff.

  **MARCUS:** That's formalism to the point of paralysis. Everyone knows what this statute was trying to do. It was trying to ensure victims get paid. The use of "Plaintiff" is a classic scrivener's error. They copied language from a civil damages statute and forgot to change the noun. If you apply the absurdity doctrine, you fix the typo, order restitution, and move on.

  **ELENA:** And that's where the worm turns, Marcus. Who decides it's a typo? You and I know it looks like a mistake. But what if it wasn't? What if Congress *intended* to limit restitution only to cases where a civil plaintiff had already joined the criminal action? It's a weird policy, sure, but maybe they wanted to avoid double-dipping or jurisdictional messes.

  **MARCUS:** That is a fantasy policy. There is zero legislative history suggesting they wanted to limit it to joined civil actions. The purpose of the Act is in the title: *Victim* Compensation. If you read "Plaintiff" to mean "Plaintiff," you defeat the very purpose of the law. That is the definition of absurdity. A result that defeats the obvious purpose of the enactment.

  **ELENA:** But "absurdity" is a subjective standard. To you, it's absurd to deny a victim money. To a strict constructionist, it's absurd for a judge to rewrite a statute because they don't like the outcome. If I say "Plaintiff" means "Victim," I am not interpreting the law; I am amending it. I am exercising legislative power.

  **MARCUS:** You're not amending it; you're correcting a clerical error to effectuate the legislature's intent. Scalia himself admitted there's an exception for obvious mistakes. He said if the text says "the defendant shall pay the defendant," you fix it.

  **ELENA:** Scalia's exception was incredibly narrow. "Defendant pays Defendant" is a logical impossibility. It's nonsense on its face. Here, "Defendant pays Plaintiff" is not nonsense. It's just... inapplicable. It describes a scenario that doesn't exist in this case. That's not a logical contradiction; that's a scope limitation. If I stretch "Plaintiff" to include "Victim," I'm not fixing a typo; I'm expanding the statute's reach.

  **MARCUS:** Expanding it to do exactly what the statute was designed to do! Look, the absurdity doctrine isn't a license to ignore text you dislike. It's a safety valve for when the text clearly fails to capture the instruction. Think of it like a GPS. If the GPS says "Turn left" into a lake, you don't drive into the lake because "the text is clear." You assume the map is wrong and drive around.

  **ELENA:** But judges aren't drivers; they're agents. If Congress gives me a map that says "Turn left into the lake," and I turn right, I'm not following orders. I'm second-guessing the principal. The democratic cost of me "fixing" this is high. If Congress sees my ruling and says, "Wait, we actually wanted to limit restitution," they can pass a new law. But if I fix it silently, Congress might never notice, and the bad policy becomes entrenched.

  **MARCUS:** That assumes Congress is watching. Congress is overworked, under-staffed, and gridlocked. They aren't going to notice *United States v. Kessler*. If you rule for Kessler, the victim gets nothing, the public loses faith in the system, and Congress *still* doesn't fix the statute because it's not on their radar. You're prioritizing a theoretical separation of powers over actual justice.

  **ELENA:** I'm prioritizing the rule of law over the rule of judges. The moment I say, "I know what they meant better than what they wrote," I invite every litigant to argue that the text is "absurd" whenever it hurts them. Next week, it'll be a tax code provision where "and" should be "or." The week after, it'll be a regulatory deadline where "days" should be "business days."

  **MARCUS:** And we have standards to prevent that! We don't just say "this is annoying." We say "this produces a result that is grossly contrary to the statutory scheme." Here, the whole Act is about victims. Section 102 talks about "victim impact statements." Section 103 talks about "victim notification." Section 101 is the only place "Plaintiff" appears. It's an outlier. It's a drafting slip.

  **ELENA:** Okay, I grant you the context makes it look like a slip. But here's my fear: The line between "drafting slip" and "compromise language" is invisible. Maybe "Plaintiff" was the price of a vote. Maybe a Representative said, "I'll vote for Victim Compensation, but only if we use civil terminology to limit it to cases with civil joiners." It's unlikely, but it's possible. As a judge, I can't look into the minds of 535 legislators. I can only look at the text they passed.

  **MARCUS:** But you *are* looking into their minds when you apply the absurdity doctrine! You're asking: "Could any rational legislature have intended this?" If the answer is no, then the text is the error. You're not overriding intent; you're rescuing it from the drafting staff.

  **ELENA:** But *who* defines "rational"? You think it's irrational to limit restitution. I might think it's irrational to let judges rewrite statutes. We're back to square one. The only objective anchor is the text. If I let go of that anchor because the water looks choppy, I drift.

  **MARCUS:** The anchor isn't the text alone; the anchor is the *law*. And the law includes the presumption against absurdity. It's a canon of construction. It's part of the textualist toolkit! You're acting like it's some foreign import from the Purposivist Empire.

  **ELENA:** (Smiles) It feels like an import. It smells like intent. Look, if I rule for Kessler, it forces Congress to act. It creates a "clear statement" rule. If Congress wants restitution for victims in all criminal cases, they need to say "Victim," not "Plaintiff." That clarity helps everyone in the future. It forces the legislature to be precise.

  **MARCUS:** That's "clear statement" fetishism. You're punishing the victim today to teach Congress a lesson they won't learn. And for what? So that five years from now, Congress passes the "Victim Restitution Clarification Act" to fix your ruling? That's a waste of judicial and legislative resources. It's inefficient governance.

  **ELENA:** It's democratic accountability. If the law is bad, the people should know it's bad and pressure Congress to change it. If I smooth over the rough edges, I insulate Congress from the consequences of their sloppy drafting. I make them look competent when they were negligent.

  **MARCUS:** You make them look incompetent, and you make the judiciary look heartless. There's a middle ground, Elena. You can acknowledge the text says "Plaintiff" but conclude that within the context of *this specific statutory scheme*, the term "Plaintiff" is a defined term of art that encompasses "Victim." You're not rewriting; you're defining.

  **ELENA:** That's semantic gymnastics. "Plaintiff" is not a defined term in the Act. If I define it that way, I'm lying. I know it, you know it, and the bar knows it. Why should we pretend the text says something it doesn't? Why not just say, "The text is clear, but it leads to an absurd result, so we decline to apply it"?

  **MARCUS:** Because that admits we're overriding the text.

  **ELENA:** Exactly! Honesty. If you're going to use the absurdity doctrine, own it. Say, "The text controls, unless it's absurd." But don't pretend "Plaintiff" means "Victim." That erodes the meaning of words. If "Plaintiff" can mean "Victim" today, can "Person" mean "Corporation" tomorrow? Can "Night" mean "Day" if the purpose is bright enough?

  **MARCUS:** Context always determines meaning. If I say, "I'm going to kill the lights," I'm not committing murder. If a statute says "Plaintiff" in a criminal context, the context modifies the word. It's not eroding meaning; it's finding the *correct* meaning. Language isn't code; it's communication. If the communication fails because of a typo, the court's job is to repair the communication, not worship the broken medium.

  **ELENA:** But the court is the least democratic branch. We have the least legitimacy to repair communication errors. If a contract has a typo, the parties can fix it. If a statute has a typo, only the people's representatives can fix it. When I fix it, I'm bypassing the bicameralism and presentment requirements of Article I.

  **MARCUS:** You're bypassing the *form* to preserve the *substance* of Article I. The legislature intended to pass a law helping victims. By blocking that law because of a typo, *you* are frustrating Article I. You're letting a clerical error veto an Act of Congress.

  **ELENA:** (Pauses, takes a sip of coffee) I see the force of that. If I block the statute, am I not also overriding intent?

  **MARCUS:** Precisely.

  **ELENA:** But here's the distinction I cling to. There is a difference between *frustrating* intent and *uncertain* intent. In "Defendant pays Defendant," the intent is certain; the words are broken. In "Defendant pays Plaintiff," the words are clear; the intent is debatable. Maybe they *did* mean to limit it. The ambiguity protects the legislature's silence. If I assume it's a typo, I assume I know what they would have done if they noticed. I don't.

  **MARCUS:** But you can infer it from the rest of the statute! You're acting like we're reading Section 101 in a vacuum. We're not. We have the title, the other sections, the problem the statute was meant to solve.

  **ELENA:** And I worry that "the problem the statute was meant to solve" is a Rorschach test. You see "Help Victims." I see "Allocate Restitution Funds." Maybe the limitation on "Plaintiffs" was to ensure funds only went to those sophisticated enough to file civil claims. It's a classist, terrible reason, but it's a *possible* reason.

  **MARCUS:** It's a possible reason in a universe where Congress is actively malicious. In the real world, it's a drafting error. The absurdity doctrine isn't for "possible reasons." It's for "no reasonable person" scenarios. Would a reasonable Congress deny restitution to a rape victim because the lawyer didn't file a civil suit? No.

  **ELENA:** (Sighs) A reasonable Congress wouldn't pass a law saying "Defendant pays Defendant" either. But they did. And we fix it. So why is "Plaintiff" different?

  **MARCUS:** Because "Defendant pays Defendant" is internal incoherence. "Defendant pays Plaintiff" is external incoherence—it doesn't fit the world the statute regulates.

  **ELENA:** That's a distinction without a difference. Both require me to look outside the four corners of the sentence to see that it makes no sense.

  **MARCUS:** Fine. Then admit that looking outside the four corners is permissible when the inside is broken.

  **ELENA:** I admit it's permissible. I just think the threshold for "broken" should be higher than "this leads to a result I dislike." If I rule for the government here, I set a precedent that "Plaintiff" is fungible. Next time, a judge might say "Defendant" is fungible in a liability statute.

  **MARCUS:** And if you rule for Kessler, you set a precedent that "Victim" doesn't matter if the noun is wrong. You privilege the label over the human being.

  **ELENA:** I privilege the process over the outcome.

  **MARCUS:** And I privilege the purpose over the process.

  *(They sit in silence for a moment, the tension of the unresolved debate hanging in the air.)*

  **ELENA:** You know, if Congress amends this next session to say "Victim," I'll feel vindicated.

  **MARCUS:** And if they don't, and victims keep getting stiffed, I'll feel right.

  **ELENA:** (Chuckles) Same time next week?

  **MARCUS:** Bring the coffee. I'll bring the legislative history.

  **ELENA:** Don't bother. I won't read it.

  **MARCUS:** I know. That's the problem.
