answer: |-
  **The Audit of Elias Vane**

  The room had no corners. It was a white cylinder, infinite in height, lit by a source that cast no shadows. In the center stood a desk, and on the desk lay the Stack.

  I am an Auditor for the Bureau of Final Accounts. My job is not to judge morality, but to calculate Value. When a consciousness ceases, we are issued its Stack: a deck of cards, each representing a weighted moment of experience. My task is to sum them. To produce a single number that answers the question: *Was it worth it?*

  The Stack for Elias Vane is thick. I spread the cards in a fan. They shimmer with the residue of qualia. I pick up the first few to calibrate my senses.

  *Card 402:* A Tuesday morning. The smell of burnt toast. The warmth of a hand on a shoulder. Value: $+1/2$.
  *Card 891:* The waiting room. The hum of the vending machine. The doctor's pause. Value: $-1/3$.
  *Card 104:* The first kiss. Rain on the pavement. The taste of iron and mint. Value: $+1/4$.
  *Card 775:* The layoff notice. The box of belongings. The walk home in the snow. Value: $-1/5$.

  The terms are fixed. The Bureau guarantees this. No card can be altered, added, or removed. The magnitude and sign of every moment are intrinsic properties of the universe. My only variable is the order of summation.

  I begin the first pass. I arrange the cards chronologically, as they occurred in linear time. This is the standard protocol. I lay them out on the white floor, a spiral expanding from the desk.

  *+1/2. -1/3. +1/4. -1/5.*

  As I place them, the air in the room hums. The partial sums manifest as a glowing line in the air above the cards. It oscillates. It climbs, then dips, then climbs higher, then dips lower. The amplitude of the swings decreases. The line stabilizes. It converges toward a number.

  I watch the number form. It is positive. Small, but positive.

  "Verdict," I speak into the silence. "Net Positive. Life authorized."

  I reach to gather the cards, to return the Stack to the void. But my hand hovers.

  The protocol says chronological order. But the Bureau's own manual, in a footnote buried in Section 9, acknowledges the Riemann Condition. If a series is conditionally convergent, the sum is dependent on the arrangement. The terms are invariant. The total is not.

  I look at the cards on the floor. They are the same cards. The kiss is still the kiss. The doctor's pause is still the pause. Nothing has changed.

  I sweep the cards back into a pile. I shuffle them.

  This time, I do not follow time. I follow magnitude. I group the positive terms. I lay down the joys first, stacking them like chips at a casino table. *+1/2. +1/4. +1/6. +1/8.* I keep adding them. The glowing line in the air shoots upward. It climbs past the previous total. It climbs past double that. I let it rise until it feels like triumph. Only then do I introduce a negative term. *-1/3.* The line dips, but barely. I add more joys. *+1/10. +1/12.* The line surges again. I delay the sorrows. I hoard the happiness.

  The glowing line is now vertical, ascending into the infinite white ceiling. The number is no longer small. It is massive. It is a life of unmitigated success, a triumph of spirit over circumstance.

  "Verdict," I say. My voice sounds different. "Net Positive. Significant. Life celebrated."

  I stand there. The cards are the same. Elias Vane is the same dead man. The kiss happened in the rain. The doctor paused. The snow fell. I have not lied. I have not altered a single datum. I have only changed the sequence of the addition.

  A coldness touches the back of my neck. It is not a draft; there is no air in here. It is the vertigo of the undefined.

  If I can make the sum infinite positive, what else can I make it?

  I sweep the cards up again. My hands are shaking. This is forbidden. The Auditor is meant to be a conduit, not a composer. But the paradox is in the math, and the math is in the cards.

  I arrange them again. This time, I group the negatives. I lay down the sorrows first. * -1/3. -1/5. -1/7.* I stack the grief. I let the waiting rooms and the funerals and the cold nights accumulate. The glowing line plunges. It dives into the floor. I withhold the joys. I keep the kisses and the promotions in my hand, waiting. The line drops further. It trends toward negative infinity. Only when the abyss is deep enough do I drop a single joy. *+1/2.* The line flickers, insignificant against the weight of the despair.

  The number stabilizes at a value that suggests the life should never have been lived. That the suffering outweighed the being.

  I sit back in the chair. The three numbers hang in the air around me.
  One: A modest success.
  Two: A transcendent victory.
  Three: A tragedy.

  They are all true. They are all false. They are all Elias Vane.

  The Pasadena Paradox is not a game played for money. It is a game played for meaning. We assume that a life has a weight, a density of worth that exists independent of how we recount it. We assume that if we list the facts, the truth will emerge from the sum. But the sum is a ghost. It haunts the ordering.

  I look at the Stack. It is just paper. It is just data. But it holds a man.

  If I hand in the chronological sum, I file a tragedy as a success. If I hand in the grouped sum, I file a success as a tragedy. If I hand in the third, I condemn a soul that might have been saved.

  There is no correct order. There is only the order I choose. And by choosing the order, I am not calculating the value. I am creating it.

  The white room seems to tilt. The desk slides. I am not summing the cards; the cards are summing me. I am just another term in a series that hasn't decided on its own convergence.

  I gather the cards. I hold them in a messy heap, refusing to let them touch in a sequence. I hold them like a hand of playing cards, fanned out so no one number can dominate the others.

  I walk to the submission chute. It is a dark slot in the white wall.

  If I drop them in a stack, they will be read in order. If I drop them in a heap, the machine will randomize them. If the machine randomizes them, the sum will diverge. It will oscillate forever. It will never settle on a verdict.

  Elias Vane will remain undefined. He will be neither saved nor condemned. He will be a question mark suspended in the arithmetic of the afterlife.

  Is that mercy? Or is it the only honesty left?

  I look at the cards one last time. The rain. The snow. The silence. The laugh.

  I drop them into the chute. They flutter. They tumble. They do not stack. They scatter into the dark, a cloud of confetti, refusing to add up.

  The machine hums. It waits for a total. It waits for a number.

  I turn my back on the hum. I walk to the door. I do not look back to see if the light ever stabilizes. Some sums are not meant to be solved. Some lives are not meant to be balanced.

  I step out into the corridor, leaving the vertigo behind me, knowing that as soon as I pick up the next Stack, the cards will be waiting, ready to be arranged into whatever truth I can bear to hold.
