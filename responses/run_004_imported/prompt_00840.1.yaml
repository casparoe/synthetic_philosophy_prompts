answer: |-
  You have put your finger on the single most famous and difficult crux in Leibniz's metaphysics. The tension you are feeling—between the **Complete Individual Concept (CIC)** doctrine (which suggests world-bound individuals) and the requirement for **Contingency/Liberty** (which suggests transworld identity)—is not a misunderstanding on your part. It is the engine that drives Leibniz's entire system, and it is exactly where modern modal metaphysics (Kripke vs. Lewis) splits apart.

  There is no single "standard" reading that everyone accepts, but there is a dominant scholarly consensus (championed notably by Robert Merrihew Adams in *Leibniz: Determinist, Theist, Idealist*) that helps dissolve the tension by clarifying what Leibniz means by "possible."

  Here is how to sort out whether Leibniz lands on the Kripkean side (Transworld Identity) or the Lewisian side (Counterpart Theory), and why he seems to be doing both.

  ### 1. The Metaphysical Constraint: Why Leibniz Looks Like Lewis
  Your intuition that the Complete Concept doctrine pushes toward Counterpart Theory is metaphysically sound. For Leibniz, an individual substance *is* its complete concept. There is no "bare particular" or underlying substratum that holds the properties together; the properties (predicates) constitute the individual.

  *   **The Logic:** If Concept A includes "crossing the Rubicon" and Concept B includes "not crossing the Rubicon," then Concept A $\neq$ Concept B.
  *   **The Consequence:** Since the individual *is* the concept, Individual A $\neq$ Individual B.
  *   **The Lewisian Parallel:** This is structurally identical to David Lewis's counterpart theory. Lewis argues that individuals are "world-bound." You cannot exist in another world with different properties, because if the properties differ, *you* differ. There is only a *counterpart* of you in that other world.

  David Lewis himself claimed Leibniz as a precursor to counterpart theory for precisely this reason. If you take the *Discourse on Metaphysics* literally, Caesar is world-bound. The "Caesar" who does not cross the Rubicon is a numerically distinct individual who merely resembles our Caesar.

  ### 2. The Theological Requirement: Why Leibniz Talks Like Kripke
  However, Leibniz cannot afford to be a pure counterpart theorist, because he needs to save **moral responsibility**.

  *   **The Problem:** If the "Caesar" who doesn't cross the Rubicon is a *different person*, then *our* Caesar had no choice. He was compelled by his concept. This leads to the "absolute fatality" Leibniz explicitly rejects in your passage.
  *   **The Fix:** Leibniz needs to say that *this* Caesar could have done otherwise. He needs a notion of transworld identity to ground the claim that "Caesar is free."
  *   **The Kripkean Parallel:** This sounds like Kripke's rigid designation. We are talking about *Julius Caesar* across different scenarios, not a Caesar-like counterpart.

  ### 3. The Resolution: Hypothetical Necessity and God's Intellect
  The standard scholarly resolution (the Adams reading) is that Leibniz distinguishes between **actualized individuals** and **possible individuals as concepts in God's mind.**

  Leibniz dissolves the tension by locating the "possibility" not in the actual world's causal structure, but in God's understanding prior to creation.

  1.  **In God's Intellect:** There are infinite concepts of "Caesar." One concept includes crossing; another includes staying home. Both are internally consistent (possible). In this realm of ideas, we can speak of "the same possible Caesar" being considered under different descriptions. Here, Leibniz allows a form of transworld identity *for possibles*.
  2.  **In Actuality:** God chooses to instantiate *one* of these concepts (the one that fits the "Best of All Possible Worlds"). Once instantiated, that individual is fixed. The predicate "crossing the Rubicon" is now analytically contained in the subject "Caesar."
  3.  **The Meaning of "Contingent":** When Leibniz says in your text, *"Nothing is necessitated whose opposite is possible,"* he does not mean the actual Caesar could have changed his mind. He means: **The connection between subject and predicate is not logically necessary (like 2+2=4); it is only hypothetically necessary (given God's decree to create this world).**

  So, "Caesar could have not crossed" translates to: *"God could have chosen to instantiate a different complete concept (a counterpart) that resembles Caesar but lacks the crossing, without violating the principle of non-contradiction."*

  ### 4. Does This Concede the Point to Lewis?
  You asked: *"Once the complete-concept doctrine is taken seriously, is there any principled way of distinguishing 'Caesar could have not crossed' from 'some Caesar-resembling individual in another possible sequence didn't cross it'?"*

  The hard answer is: **No.**

  If you take the Complete Concept doctrine seriously, Leibniz *is* a counterpart theorist regarding actual substances. The distinction you are looking for collapses.
  *   **Transworld Identity** requires that $x$ in World 1 is numerically identical to $y$ in World 2, even if they have different properties.
  *   **Leibniz's Identity of Indiscernibles** states that if $x$ and $y$ have different properties, they are not numerically identical.

  Leibniz cannot have both. Since he is committed to the Identity of Indiscernibles (it follows from the CIC), he must concede that individuals in different worlds are numerically distinct.

  **Why doesn't he admit it?**
  Because admitting it destroys theodicy. If the "Caesar" in the world where Rome remains a Republic is a *different person*, then the actual Caesar is not responsible for overthrowing the Republic; he was just built that way. To preserve sin, merit, and freedom, Leibniz must speak *as if* it is the same Caesar making a free choice, even though his metaphysics implies it is a different concept being instantiated.

  ### 5. Summary: Where Leibniz Lands
  To answer your specific question on which side of the modern debate this lands on:

  1.  **Metaphysically:** Leibniz is a **Counterpart Theorist**. His commitment to the Complete Individual Concept and the Identity of Indiscernibles makes transworld identity impossible for actual substances. David Lewis is correct to claim him here.
  2.  **Semantically/Theologically:** Leibniz speaks like a **Transworld Identity Theorist**. He needs to maintain that "Caesar" is a rigid designator for the sake of moral accountability and the definition of contingency. Kripke is correct to sense this commitment.

  **The Verdict on the Passage:**
  In §13 of the *Discourse*, Leibniz is trying to have it both ways. He wants to assert that the predicate is *in* the subject (metaphysical determinism/Counterpart view) while simultaneously asserting that the truth is *contingent* (freedom/Transworld view).

  He bridges this with the distinction between **Absolute Necessity** (logical contradiction if opposite) and **Hypothetical Necessity** (certain, given God's choice, but not logically contradictory if opposite).

  **Conclusion:**
  You are not missing a hidden key; you have identified the fracture line in Leibniz's system. The "principled way" of distinguishing the two statements you offered evaporates under the weight of the Complete Concept doctrine. Leibniz ultimately helps himself to Transworld Identity language to save human liberty, but his ontology commits him to Counterpart Theory. Modern scholarship generally accepts that Leibniz's system *works* only if we accept that "possibility" is a feature of God's intellect (where concepts can vary) rather than a feature of the individual substance (which is fixed).

  So, if you are forced to choose: Leibniz's **ontology** is Lewisian (world-bound individuals), but his **modal logic** attempts to be Kripkean (rigid designation of possibles) to avoid fatalism. The tension you feel is the price he pays for trying to reconcile rationalist determinism with Christian free will.
