      *   *Principle of Tolerance:* "In logic, there are no morals." We can choose linguistic frameworks based on pragmatic utility (fruitfulness), not metaphysical truth. This applies to scientific frameworks, but does it apply to socio-economic frameworks?
      *   *Unity of Science:* The 1929 manifesto (*Wissenschaftliche Weltauffassung*) explicitly links the scientific worldview to social reform. Carnap signed it. This suggests he saw science as a *tool* for human betterment, even if the *goals* of betterment weren't scientifically derivable.
