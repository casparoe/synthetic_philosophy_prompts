      *   *Section 3: The Prediction Problem.* The Driver predicts based on character. But if character is fluid (Reductionism), the prediction is less stable. More importantly, T-You's reason to comply vanishes if the "Self" is an illusion.
      *   *Section 4: Prudence vs. Morality (The Complication).* Address Parfit's "Self-Interest Theory" critique. Parfit thinks Reductionism refutes S (Self-Interest Theory). If S is false, the Hitchhiker problem (framed as S) collapses. You pay not because it's *you*, but because it's *right*. This changes the game. It undermines the *decision-theoretic* solution by forcing a *moral* solution.
