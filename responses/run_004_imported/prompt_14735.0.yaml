      *   *Standard Verdict:* You should pay. Why? Because if you don't pay (or aren't disposed to), Driver predicts this and leaves you. Causal Decision Theory (CDT) often fails here (says don't pay). Evidential Decision Theory (EDT), Functional Decision Theory (FDT), or Resolute Choice say pay.
      *   *Underlying Assumption:* D-You and T-You are sufficiently the "same person" that D-You's interest in survival binds T-You to act, or that T-You's rationality is defined by the policy D-You instantiated.

