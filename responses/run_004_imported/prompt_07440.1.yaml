  ### **TA-to-TA Advice**
  Since this is your first time grading for a technical cross-list:
  1.  **Watch for the "Ramsey Rule" Confusion:** This is the most common error in this specific course module. Students often think $\delta = 0$ implies $r = 0$. If you see this repeatedly, it might be worth flagging to the professor for a quick review in section.
  2.  **Part (b) is the Discriminator:** Part (a) tests reading; Part (b) tests understanding. In a 15-point question, it is appropriate to weigh Part (b) heavily (as I did above) because it tests the synthesis of the two disciplines.
  3.  **Consistency:** If you grade this student a 10/15, look for other papers that nailed the philosophy but failed the Stern/Nordhaus facts. They should receive similar scores to maintain consistency across the pile.
