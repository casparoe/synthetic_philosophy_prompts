      *   *Application:* This justifies *some* difference in protocol stringency, but not a *waiver* of analgesia. It justifies a tiered approach, not a zero-protection approach.

  10. **Finalizing the Text:** (Writing the memo with these points in mind, keeping it tight). *Self-Correction during drafting:* Ensure I don't sound like I'm lecturing the committee on philosophy. Keep it grounded in IACUC mandates (minimization of distress).

