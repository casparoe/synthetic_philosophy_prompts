answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. The remnants of two lattes sit on the table. ELENA (Contextualist) and MARCUS (Pragmatic Encroachment Theorist) have been talking for an hour.*

  **Marcus:** Let's go back to the pharmacist. That's the test case. You said that when we were sitting here, sipping coffee, chatting casually, it was *true* to say she knew the dosage was correct.

  **Elena:** Because our context was low-stakes. We weren't deciding whether to administer the drug. We were just gossiping. In our conversational context, the epistemic standard was low. Her evidence—her training, the calculation she ran—was sufficient for *us* to truthfully say, "She knows."

  **Marcus:** But *she* wasn't here. She was in the pharmacy. And for her, a mistake means a dead patient. Her practical stakes were sky-high. My theory says her stakes determine whether she knows. If the cost of being wrong is death, she doesn't know unless she double-checks. Period. It doesn't matter if you're whispering about her in a café or shouting it in a courtroom.

  **Elena:** That's the rub, Marcus. You're conflating whether she *acts* on the knowledge with whether the proposition "She knows" is true. Contextualism respects the intuition that knowledge attributions are tools for communication. If I'm talking to you, and we don't need the info for anything urgent, why should the pharmacist's anxiety raise the bar for *our* conversation?

  **Marcus:** Because knowledge is the norm of practical reasoning. If she knows, she can act. If she doesn't, she needs more evidence. Let's construct a case to isolate this. Imagine the pharmacist, Sarah. She calculates the dose. She's tired. She's reasonably confident, but not certain. Now, imagine two observers. Observer A is a medical board inspector investigating a potential malpractice suit. Observer B is a friend at a bar.

  **Elena:** Okay.

  **Marcus:** According to you, Observer B can truthfully say, "Sarah knows the dose is correct," because B's context is low-stakes. Observer A must say, "Sarah doesn't know," because A's context is high-stakes.

  **Elena:** Exactly. The truth conditions shift with the attributor.

  **Marcus:** Here's the problem. Sarah is one person. She has one set of evidence. On your view, she simultaneously knows and does not know the same proposition, depending on who is talking about her. That makes knowledge not a property of Sarah's cognitive state, but a property of the gossipers.

  **Elena:** It makes knowledge a relation between the subject, the evidence, and the conversational context. But look, let me hit you with the reverse. I need a case where the *subject* has low stakes, but the *attributor* has high stakes.

  **Marcus:** Go ahead.

  **Elena:** Imagine a witness, David. He saw a red car run a stop sign. For David, it doesn't matter. He's just walking home. Low stakes. He has good vision, was paying attention. He forms the belief "It was a red car." Now, I am a detective. I need to catch a hit-and-run driver. If I get the wrong car, an innocent man goes to prison. My stakes are massive. I ask my partner, "Does David know it was a red car?"

  **Marcus:** On my view, David knows. His stakes are low. His evidence is good. The fact that *you* are stressed about prison sentences doesn't change David's cognitive position.

  **Elena:** But if I say "David knows," I am asserting that it is appropriate to *act* on that information. In my context, it is *not* appropriate to act on that information without further corroboration. If I tell the prosecutor, "We know it was a red car," based solely on David, I've been negligent.

  **Marcus:** So you'd say, in your mouth, "David doesn't know"?

  **Elena:** Yes. In the context of the police station, the standard for "knows" is raised. So "David knows" is false *as uttered by me*, even though "David knows" might be true as uttered by his friend at the bar.

  **Marcus:** But that's absurd, Elena. You're saying David's epistemic position deteriorates just because you got stressed out. David hasn't lost any evidence. He hasn't become less reliable. You've just made the word "know" mean "knows to a degree that satisfies Elena's anxiety."

  **Elena:** I'm saying that "know" is indexical. Just like "tall." A man can be tall for a jockey and not tall for a basketball player. The man hasn't shrunk; the standard changed. When I'm investigating a felony, "know" means "knows beyond a reasonable doubt." When David is walking home, "know" means "knows for everyday purposes."

  **Marcus:** But "tall" is explicitly relative. "Knows" purports to describe a factual connection to the world. Let's press this. In your detective case, if I say "David knows," and you say "David doesn't know," who is lying?

  **Elena:** Neither. We're speaking different contextual languages.

  **Marcus:** And if David acts on his belief? He tells the insurance company, "I know it was red."

  **Elena:** Then he's speaking in his context. He's fine.

  **Marcus:** Okay, let's tighten the screw. Back to the pharmacist. Suppose Sarah is the subject. I am the attributor. I am *not* involved in the medical case. I'm just a philosopher in a café. My stakes are zero. But I know *her* stakes are life-and-death.
  According to Pragmatic Encroachment, I cannot truthfully say "Sarah knows." Her high stakes infect the truth of my assertion.
  According to you, I *can* truthfully say "Sarah knows."
  Now, here is the trap: If I say "Sarah knows," and she acts on that attribution—say, I text her "Don't worry, you know it's right, go ahead"—and the patient dies... who is responsible?

  **Elena:** That's a pragmatic issue, not a semantic one. You shouldn't assert it if it's misleading.

  **Marcus:** But you said it's *true*. How can a true assertion be misleading in a way that leads to death? If "Sarah knows" is true in your context, then she *does* know. If she knows, she's licensed to act. If she's licensed to act, and she acts, and the patient dies... then knowledge wasn't enough.

  **Elena:** Knowledge is the norm of *assertion*, Marcus. Action is different.

  **Marcus:** Is it? Most of us think knowledge is the norm of action, too. You can't justify acting on mere belief if you claim to know. If your theory allows me to truthfully say "She knows" when she actually needs to double-check, your theory severs the link between knowledge and rational action. You make knowledge too easy for the subject when the attributor is relaxed.

  **Elena:** And your theory makes knowledge too fragile. Consider my detective case again. If David's knowledge depends on *his* stakes, then knowledge is stable. But if I can't say he knows because of *my* stakes, then knowledge becomes solipsistic. I can never rely on anyone else's knowledge claims unless I know their stakes match mine.
  Wait, no. On your view, I can rely on David because *he* knows. The problem is on *my* view.
  Actually, let's flip it. On your view, Marcus, can I ever learn from you?
  Suppose you are the pharmacist. High stakes. I am the customer. Low stakes.
  You say, "I don't know if this is the right med."
  I say, "But you calculated it!"
  You say, "My stakes are too high. I don't know."
  Now, I go home. My stakes are low. Can I tell my wife, "Marcus knows it's the right med"?

  **Marcus:** No. Because Marcus didn't know. The fact that your stakes dropped later doesn't retroactively give him knowledge he lacked at the time.

  **Elena:** So the truth of the proposition "Marcus knows" changes over time, not because evidence changed, but because *your* stakes changed?

  **Marcus:** No, because *my* stakes—Marcus's stakes—fixed the standard at the time. It's invariant across attributors, but sensitive to the subject.

  **Elena:** But this creates a communication breakdown. If I ask you, "Do you know?" and you say "No," because your stakes are high... but I only need "low stakes knowledge" to make a decision... I'm starved of information.
  Contextualism solves this. You say, "I don't know" (meaning: I don't meet the high standard required for medical practice). I hear that and understand, "He doesn't meet the high standard." But if I ask, "Are you sure enough for a casual recommendation?" you might say, "Well, in that sense, yes."

  **Marcus:** Or, simpler: I say, "I have enough evidence for everyday life, but not enough for dispensing medication." We don't need to warp the semantics of "knowledge" to do that. We just qualify the claim.
  Your theory forces you to say that in the café, discussing the pharmacist later, you spoke the *truth* when you said "She knew."
  I say you spoke a falsehood. She didn't know. She had a true belief supported by evidence, but she lacked knowledge because she hadn't ruled out the error-possibility that her stakes demanded she rule out.
  Which intuition is stronger, Elena? That truth is relative to the gossipers? Or that a pharmacist dealing with life-and-death needs more than a hunch to "know"?

  **Elena:** The intuition that "She knew" is true in the café is strong because we *would* say it. We'd say, "She knew the dose, she just had a bad day."
  But I grant you this: If we found out she *didn't* double-check, we might retract. "Okay, well, she thought she knew."
  Maybe the divergence isn't about truth, but about *practical adequacy*.

  **Marcus:** That's just Pragmatic Encroachment with extra steps. You're admitting that her practical situation determines whether the knowledge attribution sticks.

  **Elena:** I'm admitting that *someone's* practical situation matters. I just think it's the speaker's. You think it's the subject's.
  Let's try one last isolation.
  Case: **The Sleeping Subject.**
  Sarah the pharmacist calculates the dose. She falls asleep immediately after. She is unaware of the stakes now; she's unconscious.
  I am awake. I am discussing her calculation.
  If stakes require conscious appreciation, does she know?

  **Marcus:** Her stakes are objective. If she wakes up and dispenses it, the patient dies. So the stakes are there, whether she's asleep or not. She doesn't know until she verifies.

  **Elena:** But if I'm talking about her while she sleeps, and I have no intention of waking her... my stakes are nil.
  If I say "She knows," and you say "She doesn't," and she is asleep... we are arguing about a ghost.
  This suggests that knowledge attributions are really about *us*, the attributors. Are *we* ready to rely on her?
  If I'm ready to rely on her (low stakes), she knows.
  If you're not ready to rely on her (high stakes), she doesn't know.

  **Marcus:** But *she* is the one who has to wake up and pour the pills! Why does your readiness to rely matter? You aren't pouring the pills.
  This is where your theory breaks. It makes knowledge too democratic. Everyone gets to vote on whether Sarah knows by adjusting their own conversational stakes.
  My theory makes knowledge authoritarian. The subject's reality dictates the standard.

  **Elena:** And your theory makes knowledge isolationist. I can never truly say I know what you know, because I don't live your stakes.
  If I say "I know the bank is open," and you are trying to avoid foreclosure, you have to say "No, you don't know." Even if we are standing side-by-side looking at the same hours.

  **Marcus:** Precisely. Because for you, the bank being closed is an annoyance. For me, it's ruin. We are not in the same epistemic position, even if our evidence is identical. Evidence isn't just data; it's data weighted by risk.

  **Elena:** (Sips cold coffee) So we're back to the pharmacist.
  I want to say: In this café, she knew.
  You want to say: In that pharmacy, she didn't.

  **Marcus:** And the tragedy is, if you're right, we can comfort ourselves with the truth of her knowledge while she potentially kills a patient.
  If I'm right, we have to admit that in high-stakes situations, "knowledge" is a rare commodity, even if the evidence looks perfect to a bystander.

  **Elena:** Then perhaps the compromise is this: We stop using the word "know" in these divergent cases.
  When the stakes diverge, we say: "She has sufficient evidence for low-stakes contexts, but not for high-stakes action."

  **Marcus:** (Smiles) So, invariantism about the predicate, but pragmatic variance about the sufficiency?

  **Elena:** Don't push your luck. I'm still a contextualist. But I'll concede that in the café, saying "She knows" was... insensitive.

  **Marcus:** And I'll concede that in the café, saying "She knows" was... linguistically natural. Just false.

  **Elena:** Cheers to that.

  **Marcus:** Cheers. Now, do you *know* the bill is paid?

  **Elena:** For me, yes. For you, if you're treating, the stakes are higher. You'd better check.

  **Marcus:** Touché.
