      *   **Move 1 (Daniel's Opening):** Consequentialist/Utilitarian view. Outcome matters. Mara is *at least as well off* financially. Therefore, the obligation is settled.
      *   **Move 2 (Lauren's Rebuttal):** Deontological/Rights-based view. A promise creates a claim to *specific performance*, not equivalent value. The promisor cannot unilaterally substitute.
      *   **Move 3 (Daniel's Counter):** Reductio ad absurdum/Pragmatic view. If substitutes never count, amends are impossible. If Mara has no complaint (is made whole), no wrong exists.
      *   **Move 4 (Lauren's Closing):** Distinction between *wrongdoing* and *unresolved harm*. Amends acknowledge the wrong; they don't erase the fact that it happened. Unilateral substitution violates the promisee's agency.

  3.  **Evaluate Each Move (Philosophical Assessment):**
      *   *Move 1:* Daniel relies on "harm principle." If no harm, no foul. *Weakness:* Ignores the relational aspect and the specific right created by promising.
      *   *Move 2:* Lauren relies on "specific performance." Promises create directed duties. *Strength:* Aligns with common moral intuition about trust. *Weakness:* Can seem rigid if the promisor faces catastrophe.
      *   *Move 3:* Daniel argues from social practice (we do make amends). *Strength:* Highlights that relationships survive breaches. *Weakness:* Confuses *repairing* a relationship with *nullifying* the breach.
      *   *Move 4:* Lauren distinguishes *ex post* compensation from *ex ante* permission. *Strength:* Protects the promisee's authority. *Weakness:* Doesn't fully address when a breach *might* be permissible (e.g., emergencies).

  4.  **Identify Missing Concepts (The "Why Promises Bind" layer):**
