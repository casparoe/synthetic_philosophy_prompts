      *   *Authority/Control:* By promising, you give the other person authority over that action (Shiffrin).
      *   *Relational Value:* The value is in the joint action, not just the outcome.
      *   *The "Option" View:* Does the promisee have the option to release the promisor? (Daniel skipped asking).

  5.  **Drafting the Response (Iterative Process):**

