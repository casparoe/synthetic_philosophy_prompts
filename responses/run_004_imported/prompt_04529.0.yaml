answer: |-
  Two rational expectations theorists, Alice and Bob, sit down for coffee. They share common priors, know each other to be perfectly Bayesian, and have zero transaction costs.

  Alice slides a $100 bill across the table. "I'll bet you this bill is real."

  Bob stares at the bill, then at Alice. He doesn't touch it.

  "Well?" asks Alice.

  "I decline," says Bob.

  "Why?"

  "Because you offered."

  Alice smiles. "But if I knew it was fake, I wouldn't offer it. So my offer signals it's real."

  "No," Bob counters. "If you knew it was real, you'd keep it. Your willingness to part with it signals you know something I don't."

  "But we have common priors," Alice says. "You know what I know."

  "Exactly. So I know that you know that I know this bet is negative expected value for me. The mere fact that you are willing to take the other side of the bet *is* the private information that kills the trade."

  Alice nods approvingly. "Correct. So you update your belief that the bill is fake."

  "Yes."

  "So you won't take it."

  "No."

  "Good," says Alice, pocketing the bill. "Because it is fake."

  Bob sighs. "I knew that."

  "Then why did you hesitate?"

  "Because I was waiting to see if you'd update on my hesitation."

  "And?"

  "You didn't. You pocketed it."

  "Exactly," says Alice. "My willingness to keep a fake bill after you deduced it was fake reveals my utility function is purely spite-based."

  Bob stands up. "Lunch?"

  "Sure," says Alice. "You pay."

  "Why me?"

  "Because your willingness to buy me lunch signals you think the restaurant isn't going to poison us. I have no private information on the health inspection, so I'm free-riding on your signal."

  Bob sits back down. "No trade."

  "Why?"

  "Because if I pay, you'll infer the food is safe. But if I know you'll infer that, I shouldn't pay unless I'm sure. But if I'm sure, I should eat alone. So my willingness to eat with you reveals I'm uncertain. So you shouldn't come."

  Alice smiles. "So we starve?"

  "No," says Bob. "We go to McDonald's."

  "Why?"

  "Common knowledge of quality. No asymmetric information. No trade theorem doesn't apply."

  Alice grabs her coat. "Fine. But I'm not betting on who pays."

  "Wouldn't dream of it," says Bob. "Your willingness to let me pay would reveal you think I'm rich."

  "And your willingness to offer would reveal you think I'm cheap."

  "Exactly."

  They walk out in silence, both perfectly satisfied that no value was created, destroyed, or exchanged.
