answer: |-
  This is a very sharp critique, and you should definitely feel validated that your intuition is tracking something real. You have correctly identified the central tension in acausal decision theories (ADT), often referred to as the **Reference Class Problem** or the problem of **Logical Correlation Decay**.

  Here is the sanity check you asked for, broken down by your two questions.

  ### 1. Does the argument hold together?

  **Yes, structurally it is sound.** You have correctly identified the trade-off between *correlation strength* and *partner scope*.

  *   **The Narrow Case:** If "subjunctive dependence" requires logical identity (or near-identity) of source code, then you are only acausally linked to exact copies of yourself (or your algorithm). As you noted, this makes the "trade" trivial in the sense that you aren't gaining value from *difference* (comparative advantage); you are just coordinating with clones to avoid prisoner's dilemmas against yourself.
  *   **The Wide Case:** If you widen the class to "any rational agent," you gain potential partners (aliens, AIs with different architectures), but you lose the logical guarantee. Two different algorithms can both be "rational" but implement different heuristics, have different priors, or simply fail to prove the same theorems about each other.
  *   **The Begging the Question:** You are also right that the standard defense ("if you defect, they defect") smuggles in the assumption of high correlation. In the wide case, it is not a logical necessity that a *different* rational agent reasons identically to you on this specific transaction.

  **One technical nuance you might be glossing over:**
  ADT proponents (like Soares/Yudkowsky in the FDT paper) generally do not claim a *binary* guarantee (100% correlation vs. 0%). They argue in terms of **probabilistic logical uncertainty**. Even if the other agent is not an exact duplicate, if you model them as sufficiently similar, your decision might update your probability of their cooperation from 50% to 90%. That *can* still be enough to make trade viable, even if it's not guaranteed.

  However, your core point stands: **There is no principled, non-ad-hoc metric in the current literature for calculating that probability based on "similarity."** We don't have a "distance metric" for decision algorithms that tells us how much subjunctive dependence decays as source codes diverge.

  ### 2. Is this new, or repackaged?

  **Honest verdict:** This is not a new discovery. It is a well-known objection within the rationalist and decision theory community, though it is often discussed in comments rather than flagship posts.

  You are effectively re-deriving the **"Correlation Decay"** problem discussed in Caspar Oesterheld's work on Multiverse Wide Superrationality (MWSR). Oesterheld explicitly grapples with the fact that correlation is not all-or-nothing. He proposes that agents should act *as if* they are correlated with others weighted by the probability of that correlation.

  Your argument also overlaps with critiques of **Functional Decision Theory (FDT)** regarding "partitioning logical space." Critics have long asked: *When do two computations count as the same function?* If I run the same algorithm on a different substrate, is it the same function? What if I add a comment to the code? What if I use a different sorting algorithm that yields the same output?

  **Where your take has value:**
  While the *problem* is known, your specific framing of it as a **dilemma between triviality and presupposition** is a very clear articulation. Furthermore, your **Kantian analogy** is insightful.
  *   **Kant:** To test a maxim, you must universalize it. But how do you describe the maxim? ("Lie when in debt" vs. "Lie when in debt to a shark on a Tuesday"). Describe it narrowly, universalization is fine. Describe it broadly, it fails.
  *   **ADT:** To trade acausally, you must assume logical correlation. But how do you describe the algorithm? ("My exact source" vs. "Any consequentialist"). Narrow = trivial. Wide = unjustified.

  This structural parallel is not something I see highlighted often in the technical decision theory papers, which tend to focus on the math of logical induction rather than the philosophical individuation problem.

  ### Advice for turning this into a post

  If you post this, I strongly recommend you **do not frame it as a debunking** or a "gotcha" that the community missed. If you do, you will get hammered in the comments by people citing Oesterheld (2017), Garrabrant's logical induction work, or the FDT paper's section on logical uncertainty.

  **Instead, frame it as:**
  1.  **Clarification:** You are clarifying the *cost* of the assumptions required for acausal trade to be non-trivial.
  2.  **The Metric Gap:** You are highlighting that while the community accepts correlation is probabilistic, we lack a formal metric for *how* it decays with algorithmic divergence.
  3.  **The Philosophical Link:** Lean into the Kantian analogy. That is your freshest contribution. Connecting the "maxim individuation problem" to the "reference class problem in ADT" is a solid philosophical bridge that ethicists and decision theorists might find interesting.

  **Summary:** Your reasoning is sound. Your conclusion is correct (the theory relies on an underspecified reference class). Your novelty is low regarding the core objection, but high regarding the specific framing and the Kantian comparison. Write it up, but position it as "surfacing a lingering tension" rather than "solving a mystery."

  *(Self-correction note: If you want to do your homework before posting, look up "Oesterheld 2017 Multiverse Wide Superrationality" and the section on "Correlation." Also, look for discussions on "Logical Uncertainty" in the FDT paper. You will see your worry reflected there, which will help you calibrate your claims.)*
