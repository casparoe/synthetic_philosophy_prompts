answer: |-
  **1. You build your critique on Hilary Greaves's distinction between simple and complex cluelessness. But critics argue this boundary is drawn exactly where you need it to be to save near-term aid while sinking longtermism. Is that distinction a principled epistemic category, or does it merely relocate the problem of uncertainty rather than resolving it?**
  *Follow-up:* If you say it depends on the causal structure, can you name a case where two reasonable experts disagree on whether a specific uncertainty is simple or complex?

  **2. In three previous interviews, your answer to "how do we act?" has been that cluelessness is a fact about evidence, not a license for nihilism. That tells us what you reject, but not what you accept. If expected value is inaccessible, what is the actual decision rule? Are we maximizing probability, satisficing, or following heuristics?**
  *Follow-up:* If you say heuristics, where do those heuristics derive their normative force if not from the consequentialist calculations you say are blocked?

  **3. Christian Tarsney has argued that some interventions, particularly extinction-risk reduction, create a "persistent difference" that locks in value so firmly that only a rare, exogenous nullifying event could undo it. Does your objection survive if the causal chain is short and the value lock-in is robust, or does complex cluelessness swallow that too?**
  *Follow-up:* If you say AI safety is too unpredictable to count as robust, is there *any* longtermist intervention that survives your critique, or have you ruled out the category entirely?

  **4. You frame this as a specific defeat for consequentialism. But non-consequentialist theories also require factual inputs to apply their rules—for example, knowing an act causes death to judge it murder. Why is cluelessness a bug specific to consequentialists rather than a general human limitation that every moral theory must manage?**
  *Follow-up:* If you say consequentialists must account for *all* effects, is that a coherent requirement for any finite agent, and does admitting that break the theory?

  **5. Greaves argues that in cases of simple cluelessness, unforeseeable effects wash out due to symmetry. But chaotic systems rarely exhibit perfect symmetry. Why should we assume the noise cancels out rather than accumulating, and doesn't that assumption undermine the "simple" cases you want to protect?**
  *Follow-up:* If you appeal to the law of large numbers, does that apply to singular historical interventions like pandemic preparedness, or only to repeated trials?

  **6. You emphasize that this is an evidential problem. But in the context of the far future, what counts as evidence? Are we talking about empirical data, formal models, or philosophical arguments, and does your definition of evidence exclude the very tools longtermists use to claim confidence?**
  *Follow-up:* If you say models are insufficient without empirical grounding, does that not also disqualify most macroeconomic policy or climate modeling from moral consideration?

  **7. Longtermists often argue that the sheer magnitude of the future outweighs deep epistemic uncertainty—a Pascal's Wager style defense. Even if you grant complex cluelessness, does the potential scale of extinction risk override the undefined probabilities, or does undefined times infinity remain undefined?**
  *Follow-up:* If you say it remains undefined, are you willing to accept that we might have more moral reason to pursue a small, certain good than a vast, uncertain one, regardless of the stakes?

  **8. Finally, what specific finding, empirical or philosophical, would compel you to retract this charge against longtermism in particular, rather than simply accepting that consequentialist ethics in general is more broken than you previously thought?**
  *Follow-up:* If you say better modeling techniques, do current longtermists claim to possess those techniques, and if so, why do you assess them as insufficient?
