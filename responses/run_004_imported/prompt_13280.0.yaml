          *   If yes -> Commensurable.
          *   If no -> How can the same experiment decide between them? (The No-Miracles/Realist challenge Priya cares about).

      *   **Conclusion:** Summarize. The containment fails. The relativism remains because rational choice requires common standards applied to common objects, which the taxonomic shift undermines.

