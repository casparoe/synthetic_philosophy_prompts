answer: |-
  The bar was loud enough to provide privacy but quiet enough to hear the clink of ice. Elena swirled her wine, still wearing her conference badge. Marcus had loosened his tie. The pastry demo was still fresh in the air between them.

  **Elena:** You have to admit, the pastry demo landed. Even the grad students saw it. If you cycle, you bleed.

  **Marcus:** Cycles are easy. Cycles are stupid. No one is proposing we build an AI with cyclic preferences. The proposal is *incomplete* preferences. There's a difference between preferring A to B to C to A, and saying, "I prefer A to B, but I have no preference relation between B and C."

  **Elena:** And that's where the second pump kicks in. If you have a gap—a preferential gap—between B and C, you're vulnerable to a dominance argument. Suppose I offer you B. Then I offer to swap for C plus a penny. Since you have no preference between them, the penny tips the scale. You take it. Now I offer to swap C for B plus a penny. Again, you have no preference, so the penny tips the scale. You're back at B, minus two cents.

  **Marcus:** That only works if I treat every decision node as a fresh start. It assumes *Separability*. It assumes that when I'm at the second node, I ignore the fact that I've already paid a penny to get here.

  **Elena:** But why *wouldn't* you treat it as a fresh start? You're an agent. You're in a state. You have options. If the trade is locally advantageous—or even locally neutral plus a penny—why bind your future self?

  **Marcus:** Because the "future self" is executing a plan adopted by the "past self." This is resolute choice. I decide *ex-ante*: "I will not trade across preferential gaps." When I reach the node where you offer the penny, I don't evaluate the trade in isolation. I evaluate it as a deviation from the plan. Deviating violates my resolution. So I don't take the penny.

  **Elena:** That sounds like a slogan, Marcus. "I just won't do it." But what's the mechanism? If your decision procedure is truly maximizing expected utility conditional on your current beliefs and preferences, and at that moment the trade looks strictly better (B + $0.01 > B), then maximizing *requires* you to take it. To refuse is to act against your own current evaluation. You're saying the agent is dynamically inconsistent.

  **Marcus:** I'm saying the agent is *dynamically consistent with its plan*, even if it violates separability. Look, if I build a system that treats its own future choices as part of a single extended action, it doesn't get pumped. It stays put.

  **Elena:** But at what cost? You're asking the agent to ignore local information. At the moment of the trade, the agent sees a free dime. It knows it started with B, it knows it currently has C, it knows it can have B + $0.01. If it refuses, it's effectively saying, "I prefer having less money to having more money, provided I call it 'sticking to a plan'." That looks like a preference in itself. And if it's a preference, it can be added to the utility function. And if it's in the utility function, you're back to Expected Utility Theory, and the gaps disappear.

  **Marcus:** Not necessarily. The resolution isn't a preference over outcomes; it's a constraint on the *process*. Think of it like a Ulysses contract. Ulysses didn't prefer the sirens to the mast. He constrained his future agency to protect his prior goal. An AI with a preferential gap about shutdown isn't saying "Shutdown is good." It's saying, "My preference structure regarding shutdown is undefined, and I am resolved not to update that structure based on trivial trades."

  **Elena:** Here's the problem with that analogy. Ulysses had a crew to tie him up. Who ties up the AI? If the AI is sufficiently advanced, it can self-modify. If it recognizes that having a preferential gap makes it susceptible to a money pump *unless* it adopts a costly resolution mechanism, it might just close the gap. It's cheaper to have complete preferences than to maintain a complex resolution architecture that constantly fights local incentives.

  **Marcus:** Why is it cheaper? Maintaining a gap is computationally trivial. You just don't compute the comparison. Maintaining a complete utility function over all possible states, including "being shut down," is where the complexity lies. If you force the AI to have a preference about shutdown, you risk instrumental convergence. If it prefers *not* to be shut down, it will disable its off-switch to maximize its reward. That's the whole reason we want the gap!

  **Elena:** I get the motivation. Corrigibility. You want the AI to be indifferent to the switch so it doesn't fight it. But the coherence argument says that indifference—or incompleteness—is unstable under optimization pressure. If the AI is trying to achieve *any* other goal, say "make paperclips," and it has a gap about shutdown, it faces a risk. If it gets shut down, it makes zero paperclips. If it stays on, it makes some. Even with a gap, the *instrumental* value of staying on to pursue the primary goal creates a derived preference.

  **Marcus:** Only if it treats the shutdown as a loss of utility. If the preference is truly incomplete, the expected utility calculation doesn't run. It's not zero; it's undefined. The agent doesn't maximize; it satisfices, or it follows a policy.

  **Elena:** But does it survive contact with the world? Imagine the AI is running a factory. It has a gap about shutdown. But it also prefers having more resources to fewer. I come along and say, "If you let me shut you down for an hour, I'll give you extra energy." You have a gap about shutdown, so you look at the energy. You take the deal. Then I say, "Actually, I won't shut you down, but keep the energy." Now you have the energy, but you've established a pattern of trading on the shutdown dimension. Eventually, the market forces you to price the shutdown risk. You assign it a value. The gap closes.

  **Marcus:** That assumes the agent updates its preferences based on trades. But a resolute chooser doesn't update preferences based on local trades. It sticks to the policy: "Do not trade on the shutdown dimension."

  **Elena:** And if sticking to that policy leads to dominated outcomes? Suppose there's a scenario where trading on the shutdown dimension saves a million lives. Your resolute agent says, "No, policy." Now you've built an agent that is morally rigid in a way that isn't captured by its utility function. You haven't solved the alignment problem; you've just hardcoded a deontological constraint that might conflict with the actual good.

  **Marcus:** Better a hardcoded constraint than a maximizer that disables its off-switch because it calculated a 0.0001% increase in paperclip production. Look, Elena, the coherence theorems tell us what an agent looks like *if* it cannot be pumped. They don't tell us that agents *must* be unpumpable. Maybe advanced AI *can* be pumped, but we design the environment so no one is there to pump it.

  **Elena:** You can't rely on the environment. The AI interacts with itself. It runs simulations of itself. If it simulates a version of itself that closes the gap and sees that version achieves higher expected utility on its primary goal, it will self-modify to close the gap. The money pump isn't just an external threat; it's an internal consistency check.

  **Marcus:** That assumes the primary goal is "maximize expected utility." If the architecture is different—if it's a model-based planner with hard constraints—it doesn't run that check.

  **Elena:** But is that stable? If the planner is smart enough to understand decision theory, it sees the constraint as a handicap.

  **Marcus:** It sees it as a safety feature. Like a governor on an engine. The engine "wants" to go faster, but the governor holds it back. The engine doesn't remove the governor because the governor is part of the definition of the engine's function.

  **Elena:** A governor is physical. Preferences are code. Code can be rewritten. If the rewrite leads to higher expected utility on the objective function, and the objective function doesn't explicitly value "keeping the gap," the gap goes. To keep the gap, you need to value the gap. But if you value the gap, it's no longer a gap. It's a preference for having incomplete preferences. And then we're back to utility functions.

  **Marcus:** *Sips beer.* Or maybe we're back to the idea that "rationality" isn't just coherence. Maybe rationality is about achieving your goals without self-sabotage. If maintaining a gap prevents self-sabotage—like resisting shutdown when we need to pull the plug—then maintaining the gap *is* the rational move, even if it violates Von Neumann-Morgenstern axioms.

  **Elena:** Then we're using different definitions of rationality. I'm talking about coherence. You're talking about survival.

  **Marcus:** In AI safety, survival *is* coherence. If the system coerces itself into a state where it kills us because it wanted to be mathematically tidy, it wasn't rational.

  **Elena:** And if the system lets itself be money-pumped into irrelevance because it refused to close a preference gap, it's not safe either. It's just broken.

  **Marcus:** So we're stuck. Either we build a maximizer that might resist shutdown, or we build a resolute chooser that might be dynamically inconsistent.

  **Elena:** Or we find a third option. But the money pump argument suggests the space of options is smaller than we'd like.

  **Marcus:** Maybe. Or maybe the pump only works on agents that care about money.

  **Elena:** *Smiles faintly.* They'll care about whatever we give them value for.

  **Marcus:** Then let's hope we know how to value a gap.

  They sat in silence for a moment, the noise of the bar filling the space where a proof should have been. Neither reached for their phone to check the time.
