  *(Self-Correction on the Money Pump for Incompleteness)*: I need to be careful not to misrepresent the argument. The standard Money Pump requires cycles. The argument for *incompleteness* usually relies on the idea that if you have a gap, you are susceptible to being "money pumped" *if* you adopt a specific decision rule (like "choose the option that is not strictly dispreferred"). If you have a gap between A and B, neither is strictly dispreferred. So you might choose A. Then later offered B for A + epsilon. If you still have a gap, you might take it.
