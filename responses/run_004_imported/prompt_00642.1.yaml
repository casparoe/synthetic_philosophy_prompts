      *   *Skeptic (let's call him Marcus):* Pragmatic, focused on agency architecture, sees room for non-utility-maximizing structures. Defends the viability of "gaps" for safety.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Bar, post-workshop buzz. Reference the pastry demo to ground the abstract.
      *   **Round 1: The Core Disagreement.**
          *   Elena: The pastry demo proves cyclic preferences are fatal. But the real issue is *incomplete* preferences. If you don't prefer Shutdown to No-Shutdown, you're vulnerable.
          *   Marcus: Incompleteness isn't cycles. I can say "I have no preference" and refuse to trade. That blocks the pump.
      *   **Round 2: The Money Pump for Incompleteness.**
          *   Elena needs to explain *how* incompleteness gets pumped. It's usually about "dominance" arguments. If you prefer A to B, but are indifferent between B and C, and C to A... wait, that's cycles.
          *   *Correction:* The specific argument for incompleteness is often the "Money Pump for Preferential Gaps" (e.g., Gustafsson's work). If you prefer A to B, but have no preference between B and C, and no preference between C and A... actually, the standard argument is: If you prefer A to B, but have no preference between B and C, and prefer C to A... no, that's still cyclic.
          *   *Refinement:* The argument is usually that if preferences are incomplete, you can be forced into a dominated strategy. Example: You prefer $10 to $5. You have no preference between $5 and a lottery L. But if L dominates $5 in some way...
