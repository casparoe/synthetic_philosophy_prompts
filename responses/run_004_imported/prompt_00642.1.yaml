  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Voice:* Elena should sound precise, slightly anxious about the implications. Marcus should sound more relaxed, confident in architectural solutions.
      *   *Pacing:* Start with the pastry, move to the theory, end with the AI implication.
      *   *Constraint:* Don't let either win. Ensure Elena acknowledges the cost of resolute choice, and Marcus acknowledges the fragility of gaps.

  6.  **Final Polish:**
      *   Check for jargon accuracy (Dynamic Consistency, Separability, Expected Utility, Dominance).
      *   Ensure the "shutdown" example is integrated naturally.
