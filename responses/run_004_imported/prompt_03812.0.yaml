      *   *Arnauld's Circularity:* Arnauld famously accused Descartes of circular reasoning (the Cartesian Circle). This specific objection is related but distinct. It's about the criterion of distinction. I should mention that Arnauld thinks Descartes assumes what he's trying to prove (that the idea of mind is complete).

