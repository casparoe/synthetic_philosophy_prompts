answer: |-
  You have stumbled upon one of the most famous and persistent puzzles in the philosophy of science: **The Problem of Old Evidence**, formulated most prominently by Clark Glymour in 1980. Your intuition is mathematically correct: in standard Bayesian confirmation theory, if evidence $E$ is already known with certainty (i.e., $P(E) = 1$), then learning that a hypothesis $H$ entails $E$ cannot increase the probability of $H$.

  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  If $P(E) = 1$ and $P(E|H) = 1$ (since $H$ entails $E$), then $P(H|E) = P(H)$. The posterior equals the prior. Confirmation is impossible.

  This creates a paradox. Scientific history tells us Einstein *was* confirmed by Mercury's perihelion, yet your friend's conspiracy theorist is committing a fallacy by claiming confirmation from known facts. If Bayesianism cannot distinguish these cases, it fails as a model of scientific rationality.

  Here is an analysis of the implications for epistemic credit and whether Bayesianism offers a principled way to save Einstein while condemning the conspiracy theory.

  ### 1. Implications for Epistemic Credit (Accommodation vs. Prediction)

  The Problem of Old Evidence forces us to confront the **Prediction vs. Accommodation** debate. The implication is that "fitting the data" is not sufficient for confirmation; the *manner* in which the theory fits the data matters.

  *   **The Risk of Overfitting:** When a theory is constructed *after* the facts are known (accommodation), there is a high risk that the theory has been "tuned" to the noise of the data rather than the signal. In statistics, this is overfitting. A curve with enough parameters can pass through any set of points, but it will fail to predict new ones. Your friend's conspiracy theory likely suffers from this: it was tailored to fit the specific "facts" she selected.
  *   **The Value of Rigidity:** Einstein gets epistemic credit not merely because GR explained Mercury, but because the explanation was **rigid**. He did not add a "Mercury parameter" to his field equations. The value for the perihelion precession fell out of the equations as a necessary consequence of the theory's structure.
  *   **Implication:** Epistemic credit for accommodating old evidence is contingent on **uniqueness**. If a theory is the *only* plausible way to derive the old fact from first principles, it gains credit. If the theory is flexible enough to accommodate the fact but also its opposite (had the data been different), it gains little to no credit.

  ### 2. Can Bayesianism Distinguish Einstein from the Conspiracy?

  Strictly speaking, standard conditionalization says "no." However, sophisticated Bayesian approaches offer three principled ways to distinguish the cases. You can use these to explain to your friend why her reasoning fails while Einstein's succeeded.

  #### A. Relaxing Logical Omniscience (The Garber Solution)
  Standard Bayesianism assumes agents are logically omniscient (they know all logical consequences of their beliefs). In reality, Einstein did not *know* GR entailed the Mercury anomaly until he did the math.
  *   **The Fix:** We update not on $E$ (which is old), but on the logical proposition **"$H \vdash E$"** (that $H$ entails $E$). This is *new* information.
  *   **The Distinction:** This applies to both Einstein and your friend. Both learned their theory entailed the facts. So, this solution alone does not save Einstein from the conspiracy theorist. We need further constraints.

  #### B. Prior Probabilities and Complexity (Occam's Razor)
  Bayesian confirmation depends heavily on the prior probability $P(H)$.
  *   **Conspiracy Theory:** Conspiracy theories are typically **ad hoc**. They require assuming secret actors, cover-ups, and complex motivations without independent evidence. This complexity drastically lowers the prior probability $P(H)$. Even if the likelihood $P(E|H)$ is high, the posterior remains low because the prior was vanishingly small.
  *   **General Relativity:** GR was motivated by deep theoretical virtues (general covariance, equivalence principle) independent of the Mercury anomaly. It unified gravity and geometry. This gave it a much higher prior probability than a patchwork conspiracy.
  *   **The Distinction:** You can argue that your friend's theory has a near-zero prior because it is unnecessarily complex and disconnected from established causal mechanisms, whereas Einstein's theory had a robust theoretical foundation before it ever touched the Mercury data.

  #### C. Likelihood Ratios and Flexibility (The Strongest Argument)
  This is the most critical distinction. Confirmation depends on the **Likelihood Ratio**: $\frac{P(E|H)}{P(E|\neg H)}$.
  *   **The Conspiracy (Unfalsifiable):** A hallmark of conspiracy theories is that they can explain *anything*. If the evidence had been different, the conspiracy theorist could have adjusted the narrative to fit that instead. If $H$ is flexible enough to accommodate $E$ and $\neg E$ equally well, then $P(E|H) \approx P(E|\neg H)$. The ratio approaches 1, and no confirmation occurs. This is the Bayesian formalization of "unfalsifiable."
  *   **General Relativity (Rigid):** GR was risky. If the precession of Mercury had been 40 arc-seconds per century instead of 43, GR would have been falsified immediately. Because the theory *could not* easily be adjusted to fit a different number without breaking its core mathematical structure, $P(E|H)$ is high, but $P(E|\neg H)$ (the probability of that exact number arising from Newtonian physics + noise) is low.
  *   **The Distinction:** Einstein deserves credit because his theory **restricted** the possible outcomes. Your friend's theory does not; it merely absorbs the outcome.

  ### 3. The "Use-Novelty" Criterion
  While Bayesianism struggles with old evidence, many philosophers (like John Worrall) argue for a **Use-Novelty** criterion. Evidence confirms a theory only if it was not used in the *construction* of the theory.
  *   **Einstein:** He constructed the field equations based on principles of symmetry and equivalence. He *used* the Mercury data only for **testing**, not construction.
  *   **Conspiracy:** Your friend likely constructed the theory *from* the list of facts. The facts were used to build the hypothesis, not test it.
  *   **Implication:** While not strictly Bayesian, this can be modeled in Bayesian terms by penalizing the priors of hypotheses known to be "data-mined."

  ### Summary for Your Argument
  You can tell your friend that Bayesianism *does* provide a way to distinguish her theory from Einstein's, but it requires looking beyond the mere "fit."

  1.  **Flexibility:** If her theory could explain the opposite of the facts just as easily, it confirms nothing (Likelihood Ratio $\approx 1$). Einstein's theory could not.
  2.  **Priors:** Her theory relies on complex, unsupported assumptions (low prior). Einstein's relied on mathematical symmetry and unification (higher prior).
  3.  **Novelty:** GR went on to predict *new* things (light bending, gravitational redshift) that were verified later. If her conspiracy theory makes no *novel* risky predictions, it remains scientifically sterile regardless of how well it fits old facts.

  **The Verdict:** The Problem of Old Evidence shows that accommodation is epistemically weaker than prediction. However, a theory *can* gain credit for old evidence if it is **rigid** (could not have fit other data), **simple** (high prior), and **unifying** (explains why the fact holds). Einstein cleared these bars; conspiracy theories generally do not.
