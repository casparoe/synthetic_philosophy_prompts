      *   **The Philosophical Problem:** This is the "Problem of Old Evidence" in Bayesian confirmation theory. If $P(E) = 1$ (evidence is already known), then $P(H|E) = P(H)$, meaning learning $H$ explains $E$ doesn't increase confidence in $H$.
      *   **The Questions:**
          1.  What are the implications of this problem for epistemic credit when a theory accounts for pre-existing facts?
