answer: |-
  This is an excellent question, and you have put your finger on the single most contentious point in the debate between Disjunctivists and their critics (often Indirect Realists or Intentionalists). If you feel that tension, you are understanding the dialectic correctly.

  The short answer is: **Disjunctivists do not deny the indistinguishability; they deny what indistinguishability *implies* about metaphysical structure.**

  However, explaining *how* they do this without contradicting themselves requires a specific philosophical move regarding the nature of "indistinguishability." Here is a breakdown of the move you might be missing, followed by an assessment of whether it counts as a theoretical "cost."

  ### 1. The Core Move: Epistemic vs. Metaphysical
  The Disjunctivist argues that you are conflating an **epistemic fact** with a **metaphysical fact**.

  *   **The Epistemic Fact:** From the first-person perspective, the subject cannot tell the difference between the veridical case ($V$) and the illusory case ($I$).
  *   **The Metaphysical Claim (Common Kind Assumption):** Because the subject cannot tell the difference, the underlying mental state in $V$ and $I$ must be tokens of the same fundamental type.

  The Disjunctivist accepts the Epistemic Fact but rejects the inference to the Metaphysical Claim. They argue that **indistinguishability is a negative notion, not a positive one.**

  To say two experiences are indistinguishable is simply to say that the subject *cannot know* which one they are having. It does not entail that there is a positive, shared property (a "Highest Common Factor") that constitutes the experience in both cases.

  **The Analogy:**
  Consider a genuine \$100 bill and a perfect counterfeit.
  *   **Epistemic:** To the naked eye (and even to an expert without tools), they are indistinguishable.
  *   **Metaphysical:** One is legal tender constituted by specific government authority; the other is paper and ink constituted by a criminal. They do not share the same ontological nature, despite the visual match.
  *   **Disjunctivist Application:** Just as the counterfeit is defined by its *failure* to be real money (parasitic on the real), the illusory experience is defined by its *failure* to be a perception of the world. It doesn't possess a shared "mental core"; it merely mimics the real thing.

  ### 2. Martin's "Causally Explained" Account
  If you are prepping a lecture, you must mention M.G.F. Martin, who provided the most rigorous defense of this specific point.

  Martin argues that when we describe the illusory case, we are inevitably describing it in terms of the veridical case. When I hallucinate a pink rat, I say, "It looks *as if* there is a pink rat."
  *   **The Disjunctivist Claim:** The "what it is like" of the hallucination is not a positive state that exists independently. It is explained by the fact that it is a state that is **indistinguishable from a veridical perception.**
  *   **The Asymmetry:** The veridical case is the primary kind. The illusory case is a secondary kind that is defined *only* by its inability to be distinguished from the primary kind.

  Therefore, there is no shared nature. There is only the real thing ($V$) and the thing that tricks you into thinking it's the real thing ($I$). To demand a shared nature is to demand that the counterfeit bill must share the "money-ness" of the real bill, which defeats the definition of counterfeit.

  ### 3. Is this a "Cost" or a "Feature"?
  You asked if this is simply a cost Disjunctivists have to accept. The answer depends on which side of the debate you ask.

  **For the Critic (The Cost):**
  Critics (like Michael Smith or many intentionalists) argue this *is* a massive cost. They argue:
  *   **Internalism:** If the brain states are identical (as neuroscience suggests), and the phenomenology is identical (by hypothesis), it is unmotivated to claim the mental states are fundamentally different.
  *   **Explanatory Power:** The Common Kind Assumption explains *why* they are indistinguishable (because they share a cause/nature). Disjunctivism seems to treat indistinguishability as a brute fact.
  *   **The "Screening Off" Worry:** If the external world doesn't contribute to the *nature* of the experience in the illusory case, why does it contribute to the nature of the experience in the veridical case?

  **For the Disjunctivist (The Feature):**
  Disjunctivists (like McDowell or Martin) argue this is the price of saving **Direct Realism**.
  *   **Avoiding Skepticism:** If you accept the Common Kind Assumption, you are one step away from the "Veil of Perception." If the immediate object of awareness is the same in both cases, then in the veridical case, you are also only directly aware of an internal state, not the world.
  *   **Factive Reasons:** McDowell argues that only Disjunctivism allows us to say that in the veridical case, the world itself provides our reason for belief. If the mental state is the same in both cases, the world is "screened off" from our rationality.
  *   **Phenomenological Integrity:** They argue it is more faithful to our intuition that seeing a tree is fundamentally different from hallucinating a tree. The Common Kind Assumption forces us to say that seeing a tree is just "hallucinating a tree + getting lucky." Disjunctivists find this absurd.

  ### 4. Pedagogical Suggestion for Your Lecture
  To help your students grasp this "nagging" feeling, you might frame it as a clash between two intuitions:

  1.  **The Intuition of Transparency:** When I see, I am aware of the *world*, not my mind. (Supports Disjunctivism).
  2.  **The Intuition of Indistinguishability:** If I can't tell the difference, the mental difference shouldn't matter to the *experience*. (Supports Common Kind).

  **The Disjunctivist Strategy:**
  Tell your students that Disjunctivists ask us to prioritize Intuition #1 over Intuition #2. They argue that Intuition #2 relies on a hidden premise: that "how it feels" must be constituted entirely by internal factors. By rejecting that premise (via Externalism), they can keep the indistinguishability as an *epistemic limitation* without letting it dictate the *metaphysics*.

  ### Summary
  You aren't missing a move; you are sensing the friction of **Externalism** applied to **Phenomenology**.
  *   **The Move:** Indistinguishability is epistemic (about knowledge), not metaphysical (about constitution).
  *   **The Cost:** It requires accepting that two states can be introspectively identical yet metaphysically disjointed, which feels counter-intuitive to those who hold that "the mental is what is introspectible."
  *   **The Payoff:** It blocks the slide from Illusion to Skepticism and preserves the idea that perception is a direct openness to the world.

  If your students feel the same "nag" you do, tell them that's good—it means they understand the stakes. The debate isn't about whether the experiences *seem* the same (everyone agrees they do); it's about whether "seeming the same" is enough to prove they *are* the same kind of thing. Disjunctivists bet everything on "No."
