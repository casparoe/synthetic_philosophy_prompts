prompt: |-
  I'm prepping a lecture on the classical argument from illusion, and something about the standard disjunctivist response still nags at me. As I understand it, disjunctivists block the argument by rejecting the Common Kind Assumption: the idea that a veridical perception and a subjectively indistinguishable illusion -- the stick that looks bent in water, say -- must be experiences of the same fundamental kind. But surely rejecting that assumption commits them to denying the very thing the argument starts from, namely that the illusory case can feel exactly like the veridical one from the inside. I don't see how a disjunctivist gets to keep the indistinguishability as a fact about the two experiences while denying that it reflects any shared underlying nature. Is there a move here I'm missing, or is this simply a cost disjunctivists have to accept?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** The Classical Argument from Illusion and the Disjunctivist response.
      *   **Core Issue:** The user is struggling with how Disjunctivism rejects the *Common Kind Assumption* (CKA) while maintaining that veridical perceptions and illusions/hallucinations can be *subjectively indistinguishable*.
      *   **The Worry:** If they feel the same "from the inside," doesn't that imply they share a fundamental nature? If Disjunctivists deny the shared nature, are they denying the indistinguishability? Is this a contradiction or just a costly commitment?
      *   **Goal:** Clarify the Disjunctivist move, explain how they reconcile indistinguishability with metaphysical distinctness, and address whether this is a "cost" or a feature.

  2.  **Deconstruct the Argument from Illusion:**
      *   Premise 1: In illusion/hallucination, it seems to the subject as if they are perceiving $X$.
      *   Premise 2: This "seeming" is subjectively indistinguishable from a veridical perception of $X$.
      *   Premise 3 (Common Kind Assumption): Subjectively indistinguishable experiences must be of the same fundamental metaphysical kind.
      *   Conclusion: Therefore, veridical perception is also just a "seeming" (leading to Sense-Data theory or Skepticism).
      *   *Disjunctivist Block:* Reject Premise 3.

  3.  **Address the User's Specific Worry (The "Nag"):**
      *   *Worry:* Denying CKA seems to deny the "from the inside" similarity.
      *   *Resolution:* Disjunctivists distinguish between *epistemic* indistinguishability and *metaphysical* identity.
      *   *Key Concept:* Indistinguishability is a negative epistemic fact ("I can't tell them apart"), not a positive metaphysical fact ("They share a core mental state").
      *   *Analogy:* Real money vs. Counterfeit money. They can look identical to the naked eye (indistinguishable), but one is genuine currency and the other is paper. They don't share the same ontological status despite the visual match.

  4.  **Identify Key Disjunctivist Moves/Arguments:**
      *   **Negative vs. Positive Characterization:** Indistinguishability is defined negatively (lack of ability to distinguish), not positively (sharing a property $E$).
      *   **The Nature of Experience:** Veridical experience is relational (world-involving). Illusion is not. Therefore, they *cannot* share a highest common factor.
      *   **Epistemic Humility:** The fact that I can't tell them apart *now* doesn't mean there isn't a fact of the matter about what kind of state I'm in.
      *   **McDowell vs. Martin:**
          *   McDowell: Focuses on reasons and knowledge. Veridical perception provides factive reasons.
          *   Martin: Focuses on the phenomenology. The illusion's phenomenology is parasitic on the veridical case (causal explanation), not the other way around.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the intuition:* Validate that this is the *central* tension in disjunctivism. It's a very common and smart objection.
      *   *Clarify the distinction:* Epistemic vs. Metaphysical. This is the crux.
      *   *Explain the "Negative" account of indistinguishability:* It's not that they share property $P$; it's that the subject cannot know which one they have.
      *   *Use an Analogy:* The Fake/Picture/Real object analogy is standard but effective. (e.g., Real Barn vs. Fake Barn).
      *   *Address the "Cost":* Is it a cost? Yes, it's counter-intuitive to common sense psychology, but disjunctivists argue it's necessary to save Realism.
      *   *Mention the "Screening Off" worry:* If the brain state is the same, how can the mental state be different? (Briefly touch on externalism).
      *   *Structure:*
          1.  Validate the concern (it's the main objection).
          2.  The Epistemic/Metaphysical Distinction (The Core Move).
          3.  The "Negative" Account of Indistinguishability.
          4.  The Asymmetry Claim (Martin).
          5.  Is it a cost? (Theoretical trade-off).

  6.  **Refining the Explanation (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Disjunctivists deny the *phenomenology* feels the same. They deny that the *explanation* for the feeling is the same.
      *   *Nuance:* Distinguish between "Subjective Indistinguishability" (the datum) and "Common Kind" (the inference).
      *   *Martin's Point:* M.G.F. Martin is crucial here. He argues that in the hallucinatory case, there is *no* phenomenology in the robust sense, only the *appearance* of one, which is explained by the possibility of the veridical case. This is tricky but important. I should simplify it for a lecture prep context but keep the essence: the illusion is defined by its failure to be veridical, not by possessing a shared positive property.

  7.  **Final Polish:**
      *   Ensure tone is academic but accessible (lecture prep).
      *   Check for clarity on "Highest Common Factor."
      *   Conclude with pedagogical advice (how to teach this tension).

  8.  **Final Review against User Query:**
