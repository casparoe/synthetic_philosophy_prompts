answer: |-
  This is a remarkably sharp diagnosis of the tension between Aristotelian metaphysics and modern evolutionary philosophy of mind. You have put your finger on the exact nerve where the "naturalization" project of teleosemantics rubs against classical teleology.

  To answer your question directly: **Aristotle would almost certainly redeploy the *Physics* II.8 argument against teleosemantics.** He would not view it as a vindication of the Final Cause, but rather as a sophisticated resurrection of Empedocles that fails to solve the problem of regularity.

  However, the teleosemanticist has a reply that Aristotle could not have anticipated, though whether it satisfies *him* (or you) depends on whether you think "selection" is a genuine cause or just a description of survival.

  Here is how the dialectic breaks down.

  ### 1. Aristotle's Objection: Immanence vs. History
  Your intuition that teleosemantics "relocates" teleology rather than eliminating it is correct, but Aristotle would press a deeper metaphysical objection.

  For Aristotle, the Final Cause is **immanent**. The acorn contains the oak *potentially*; the eye is *for* seeing by virtue of its current structure and its relation to the organism's soul (*psyche*). The purpose is intrinsic to the substance *now*.

  Teleosemantics (specifically the Millikan/Neander "Selected Effects" version) makes function **etiological**. A heart is for pumping blood not because of what it is doing now, but because its ancestors did so.
  *   **Aristotle's Critique:** He would argue that grounding the *current* directedness of a mental state in *past* contingent events makes intentionality accidental. If a perfect duplicate of a human were spontaneously generated (or created by God) without evolutionary history, teleosemantics says it has no mental content (no "proper function"). Aristotle would say this is absurd; if it acts and perceives regularly, it has a nature and a telos.
  *   **Physics II.8:** Aristotle argues that if teeth grow "always or for the most part," it cannot be by chance (*tyche*). He rejects Empedocles' idea that random combinations survived because they were useful. He insists the utility must be the *cause* of the growth, not the *result* of the survival.
  *   **Application to Teleosemantics:** Aristotle would view "random mutation + natural selection" as precisely the Empedoclean error. To him, mutation is material chance. Selection is merely the *removal* of the unfit. A negative cause (death of the unfit) cannot explain the positive regularity of the fit. He would argue that teleosemantics explains why the *useless* disappeared, but not why the *useful* arose with such regularity in the first place.

  ### 2. The Teleosemantic Defense: Cumulative Selection
  Does teleosemantics have an answer to *Physics* II.8? Yes, but it relies on a mechanism Aristotle couldn't conceive: **cumulative selection.**

  Empedocles imagined a one-off generation of parts (e.g., heads and bodies floating around) that happened to join. If they didn't work, they perished. Aristotle is right that *this* cannot explain regularity; the odds of a viable organism arising by pure chance in one step are effectively zero.

  Teleosemantics leans on Darwinism, which adds **heritable variation over deep time**.
  *   **The Argument:** The regularity ("always or for the most part") is not produced by the *variation* (which is random with respect to fitness) but by the *retention* (which is non-random).
  *   **The Sieve:** Natural selection is not just "survival"; it is a filter that accumulates small advantages. The "chance" is in the generation of options; the "necessity" (the regularity Aristotle demands) is in the filtering process.
  *   **Against Empedocles:** Teleosemantics argues it is *not* relabeling Empedocles. Empedocles proposed chance *survival* of chance *forms*. Teleosemantics proposes non-random *preservation* of chance *variations*. The "function" is not a lucky accident; it is the sedimented result of a law-like process (differential reproduction).

  So, the teleosemanticist tells Aristotle: "You are right that chance cannot produce order. But selection is not chance. It is a blind but deterministic sieve that creates the 'always or for the most part' regularity you require, without needing a metaphysical 'pull' from the future."

  ### 3. The "Relabeling" Charge: Who Wins?
  This brings us to your core suspicion: *Does teleosemantics just relabel Empedocles' surviving chance-combinations as "selection history"?*

  **From Aristotle's perspective: Yes.**
  Aristotle distinguishes between things that happen *by nature* (intrinsically directed) and things that happen *by art* or *chance*. He would likely categorize natural selection as a form of "external necessity" acting on matter, not internal finality.
  *   For Aristotle, the "for-ness" of the eye is in the eye.
  *   For Millikan, the "for-ness" of the eye is in the *lineage*.
  Aristotle would argue that teleosemantics has not explained **why** the lineage is directed, only **that** it persisted. He would claim that by making function dependent on historical success, teleosemantics makes normativity contingent. If the environment changes, the "proper function" changes. For Aristotle, the *telos* is stable because it flows from the Form, not the environment.

  **From the Naturalist's perspective: No.**
  The naturalist argues that Aristotle's "immanent telos" is the real mystery. It posits a kind of forward-causation (the future oak pulling the acorn) that violates efficient causation. Teleosemantics claims to dissolve the mystery by showing that "purpose" is just a shorthand for "historical success conditions."
  *   They would argue they aren't relabeling Empedocles; they are solving the problem Empedocles failed to solve (the origin of complex adaptation) without invoking Aristotle's "ghost in the machine" (substantial forms).

  ### 4. The Verdict on Your Argument
  You are on firmer philosophical ground than your friend regarding the "elimination" of teleology.

  1.  **Teleology Relocated:** You are correct. Teleosemantics does not eliminate teleological language ("function," "purpose," "misrepresentation"); it naturalizes it by grounding it in history. It keeps the *structure* of Aristotelian teleology (normativity, success/failure conditions) but swaps the *ground* (Form → History).
  2.  **Aristotle's Rejection:** Aristotle would reject this ground. He would argue that a "proper function" based on past survival is still contingent. If the "always or for the most part" regularity of nature is built on a foundation of random variations filtered by death, he would say you have built a house on sand. He demands the regularity come from the *nature of the thing*, not the *history of its ancestors*.
  3.  **The Empedocles Trap:** Teleosemantics avoids being *literally* Empedoclean (because of cumulative selection), but it remains *structurally* Empedoclean in Aristotle's eyes: it explains order via the elimination of disorder, rather than the imposition of form.

  **Conclusion:**
  Your friend claims teleosemantics makes intentionality "fully naturalistic, with no residual mystery." You are right to suspect this is a promissory note.
  *   If "naturalistic" means "no supernatural forms," teleosemantics wins.
  *   If "naturalistic" means "explains directedness without presupposing directedness," teleosemantics struggles. It presupposes the normativity of survival/reproduction to explain the normativity of content. (Why *ought* a mechanism to reproduce? Teleosemantics takes this as a brute fact.)

  Aristotle would say: **"You have explained how the useful survived, but you have not explained why nature is useful to begin with."** Teleosemantics replies: **"Nature isn't useful 'to begin with'; it became useful through time."**

  That is the unbridgeable gap between Essentialism (Aristotle) and Population Thinking (Teleosemantics). You didn't lose the argument; you just identified the metaphysical price of admission for naturalism. Teleosemantics doesn't eliminate the Final Cause; it attempts to reconstruct it out of Efficient Causes and Time. Whether that reconstruction holds water is exactly what *Physics* II.8 calls into question.
