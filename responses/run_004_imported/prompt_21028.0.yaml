      *   *Leibniz vs. Panpsychism:* Leibniz is often called a panpsychist (or panexperientialist), but his view is distinct.
      *   *The Combination Problem:* For modern panpsychists, if atoms have experience, how do they make *my* experience?
      *   *Leibniz's Solution:* They *don't* combine. A composite substance (like an animal/human) isn't a sum of minds. It's one dominant monad + an organic body (which is an aggregate of other monads).
      *   *The "Cost":* Leibniz denies that macro-consciousness is *composed* of micro-consciousness. The "unity" is primitive, not derived. Modern panpsychists usually want to derive the macro from the micro (constitutive panpsychism). Leibniz is more of an "emergentist" (though not in the modern physicalist sense) or rather a "fundamentalist" about the dominant monad.
      *   *Key Distinction:* *Unum per se* (true unity) vs. *Unum per aggregationem* (aggregate).

  3.  **Drafting the Core Argument:**

      *   *Point 1: The Combination Problem is a Category Error for Leibniz.*
          *   Modern panpsychists assume macro-minds are built from micro-minds.
          *   Leibniz says macro-minds (dominant monads) are *simple*. They have no parts. Therefore, they cannot be "built" from smaller minds.
          *   The body is an aggregate of monads, but the *mind* is just one monad.
          *   So, the combination problem doesn't arise for the *subject* of experience, only for the *phenomenal content* (how one monad represents the many).

      *   *Point 2: True Unity vs. Mere Aggregate.*
