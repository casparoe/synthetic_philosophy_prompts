          *   Modern panpsychists often treat the brain/body as the subject constituted by parts. Leibniz treats the soul as the subject *using* the parts.

      *   *Point 3: The Cost (The "Balk" Point).*
          *   What would a modern panpsychist hate?
          *   *Pre-established Harmony:* No causal interaction.
          *   *Idealism:* Bodies are "well-founded phenomena." The physical world isn't fundamentally real in the way monads are.
          *   *The Hierarchy:* Not all monads are equal. There are "bare monads," "souls," and "spirits." Modern panpsychists often prefer a flatter ontology.
          *   *Most importantly:* Leibniz denies *constitutive* panpsychism. He doesn't think *you* are made of smaller experiences. He thinks *you* are one simple experience that *represents* a body made of other simple experiences. This is a form of *priority monism* regarding the self, but pluralism regarding substance.
          *   *The specific cost:* The denial that macro-consciousness is *ontologically dependent* on the micro-consciousness of the body's parts in a compositional way. The dominant monad is metaphysically prior to the unity of the organism.

  4.  **Refining the Argument (Self-Correction/Nuance):**
