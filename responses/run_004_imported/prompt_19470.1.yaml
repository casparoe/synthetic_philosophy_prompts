          *   *Goal:* Strawson wants to prove incompatibilism/impossibility. Nietzsche wants to diagnose a psychological error (pride/theological hangover).
      *   **Verdict:** Nietzsche anticipates the *premise* (freedom = causa sui = impossible), but Strawson formalizes the *mechanism* (the regress of character). Nietzsche is more about the concept of causation; Strawson is more about the conditions of responsibility.

