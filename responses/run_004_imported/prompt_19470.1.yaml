      *   *Sentence 2:* "...but the extravagant pride of man has managed to entangle itself profoundly and frightfully with just this nonsense."
          *   **Psychology:** Why do people believe it? Pride/ego. Wanting ultimate credit/blame.
      *   *Sentence 3:* "The desire for 'freedom of the will'... is nothing less than the desire to be precisely this causa sui..."
