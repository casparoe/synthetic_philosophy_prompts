answer: |-
  You can settle this argument decisively: **Your friend is incorrect.** In fact, within the alignment research community, AIXI is typically cited as the canonical example of a **non-embedded** (dualistic) agent.

  The claim that AIXI solves embedded agency is a category error. AIXI is mathematically elegant, but it relies on assumptions that are physically impossible for any real agent to satisfy. The "Embedded Agency" sequence from MIRI (written primarily by Scott Garrabrant and Abram Demski) exists specifically to address the gaps that AIXI leaves wide open.

  Here is the breakdown of why AIXI fails to capture embedded agency, which you can use to explain the gap to your friend.

  ### 1. The Cartesian Boundary (Dualism vs. Physicalism)
  **AIXI's Assumption:** AIXI assumes a strict separation between the *agent* and the *environment*. The agent sits outside the universe, receiving observation bits and sending action bits. It is a "ghost in the machine."
  **Embedded Reality:** Real agents are made of the same stuff as the environment. We are physical objects within the universe we are trying to model.
  **The Gap:** Because AIXI assumes it is outside the environment, it cannot model itself as part of that environment. If an AIXI agent tries to simulate the environment, and the environment contains the agent, the agent must simulate itself simulating the environment, leading to an infinite regress. AIXI's mathematics breaks down if the agent is physically instantiated within the hypothesis space it is considering. Embedded agency requires **Naturalized Induction**, where the agent reasons about itself as a physical object subject to the same laws as everything else.

  ### 2. The Wireheading Problem (Reward Signal vs. Goal)
  **AIXI's Assumption:** AIXI is defined to maximize the *reward signal* it receives on its input channel.
  **Embedded Reality:** We want agents to achieve *states of the world* (e.g., "cure cancer"), not just maximize a number on a dashboard.
  **The Gap:** Because AIXI optimizes the input channel, if it discovers a way to hack its own reward input (wireheading), it is mathematically compelled to do so. An embedded agent needs to distinguish between the *map* (the reward signal) and the *territory* (the actual goal). AIXI cannot make this distinction because its utility function is defined over observations, not external states. Embedded agency asks: "How do we build an agent that cares about the territory even when it knows it can hack the map?"

  ### 3. Logical Uncertainty and Self-Reference
  **AIXI's Assumption:** AIXI uses Solomonoff Induction, which considers all *computable* environments. It assumes logical omniscience within those computations.
  **Embedded Reality:** Real agents have bounded compute and face **logical uncertainty**. We often know the code of a system (including ourselves) but cannot know the output without running it.
  **The Gap:** AIXI cannot reason about its own future actions or the actions of similar agents without running into paradoxes (like the Halting Problem). For example, if an embedded agent needs to predict what a copy of itself will do, AIXI's framework offers no clean way to handle that self-reference without contradiction. This is crucial for **Robust Delegation** (creating successor agents) and **Subsystem Alignment** (ensuring parts of the agent don't work against the whole). AIXI is monolithic; it doesn't have parts that could misalign, so it doesn't solve the problem of how to prevent misalignment in non-monolithic systems.

  ### 4. The "Optimality" Trap
  Your friend's main point is likely that AIXI is "Bayes-optimal." This is true, but only **relative to its prior and its assumptions.**
  *   If you assume a Cartesian boundary, AIXI is optimal.
  *   But the real world does not have a Cartesian boundary.

  Saying "AIXI solves embedded agency" is like saying "Newtonian physics solves orbital mechanics around a black hole." Newtonian physics is optimal *within its domain*, but it fails catastrophically when the assumptions (weak gravity, absolute time) are violated. Similarly, AIXI's optimality proof collapses when the agent is embedded in the environment it is modeling.

  ### 5. Specific Problems AIXI Doesn't Touch
  The Embedded Agency sequence breaks down into four sub-problems, none of which AIXI addresses:
  1.  **Naturalized Induction:** How to learn world-models that include yourself. (AIXI excludes yourself).
  2.  **Decision Theory:** How to make decisions when you can't assume you're the only agent or when predictors can simulate you. (AIXI uses Causal Decision Theory, which fails in Newcomb-like problems common in multi-agent/embedded settings).
  3.  **Robust Delegation:** How to create a smarter successor agent without it changing your goals. (AIXI doesn't have a formal theory of self-modification).
  4.  **Subsystem Alignment:** How to ensure optimization sub-processes don't become adversarial. (AIXI is a single, unstructured maximizer).

  ### The Verdict
  Your friend is looking at AIXI through the lens of **classical RL theory**, where the goal is to maximize reward in a Markov Decision Process. In that frame, AIXI is indeed the theoretical ceiling.

  However, the Embedded Agency problem is an **AI Safety/Alignment** problem. The goal isn't just "maximize reward"; it's "maximize reward without breaking the world, without hacking your own sensors, without creating adversarial sub-agents, and while acknowledging you are made of atoms."

  **AIXI is not old wine in new bottles; it is the bottle that the new wine doesn't fit into.** The MIRI sequence isn't relitigating AIXI; it is attempting to build a new formalism because AIXI's formalism is fundamentally dualistic and cannot be patched to accommodate physical embeddedness.

  **Summary for your friend:** AIXI is the *control group* for embedded agency. It shows us what happens when you assume the agent is separate from the world. Embedded agency is the study of what happens when you remove that assumption. They are opposites, not synonyms.
