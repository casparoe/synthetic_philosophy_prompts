      *   **Key Reason 4: Synchronic vs. Diachronic.** Conditionalization is a bridge between time $t_1$ and $t_2$. Reflection is a constraint at $t_1$ about $t_2$. This matters for Dutch Book arguments (synchronic vs. diachronic books).
      *   **Key Reason 5: Counterexamples and Controversy.** Mention cases like the "Sleeping Beauty" problem or self-locating beliefs where Conditionalization is tricky, but Reflection intuitions persist (or clash).
