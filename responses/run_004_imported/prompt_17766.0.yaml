          *   *Side B (Mitigation/Caution):* Racing to commit leads to mutual disaster (incompatible commitments). Prefer mitigations like surrogate goals or Safe Pareto Improvements (SPIs).
      *   **Format:** Dialogue between two decision theorists in a standoff over splitting a windfall.
