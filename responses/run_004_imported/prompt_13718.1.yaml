answer: |-
  **The Ghost in the Machine: Why the Problem of Old Evidence Demands a Bounded Bayesianism**

  The story of General Relativity is the crown jewel of modern physics, but for the Bayesian epistemologist, it is a crime scene. In 1915, Albert Einstein didn't just propose a new theory of gravity; he recovered a fact that had been gathering dust for decades. Urbain Le Verrier had calculated the anomalous precession of Mercury's perihelion in 1859. Newtonian mechanics couldn't explain it; General Relativity (GR) did. When Einstein realized his field equations yielded exactly 43 arcseconds per century, he reportedly felt his heart palpitate. He took this as decisive confirmation.

  Standard Bayesian confirmation theory, however, says this is impossible.

  The rule is simple: Evidence $E$ confirms Hypothesis $H$ (given background $K$) if and only if $P(H|E,K) > P(H|K)$. By Bayes' Theorem, this requires that $P(E|K) < 1$. If you already know $E$ with certainty, $P(E|K) = 1$. If you conditionalize on a certainty, your probabilities don't move. $P(H|E) = P(H)$. On the standard model, Mercury's perihelion could not have confirmed General Relativity, because the data was old news.

  This is Clark Glymour's "Problem of Old Evidence." It feels like a bug because, intuitively, it *is* a bug in the idealized model of the Bayesian agent. You and your friend are wrestling with the three standard exits from this maze: the counterfactual approach, John Earman's pessimism, and the Garber-Jeffrey solution regarding logical omniscience. While the counterfactual approach captures our intuitions about explanatory power and Earman correctly identifies the limits of formalism, the verdict must lie with Garber and Jeffrey. The Problem of Old Evidence is not a failure of Bayesian updating; it is a proof that Bayesian agents cannot be logically omniscient. The Garber solution wins because it is the only one that preserves the diachronic integrity of belief updating without resorting to fictional histories.

  ### The Formal Knot

  To see why the other solutions falter, we must appreciate the severity of the constraint. Bayesianism is fundamentally a theory of learning. It describes how a rational agent should change their mind when confronted with new information. The engine of this change is conditionalization.

  In the Mercury case, the evidence $E$ (the 43 arcseconds) was part of the background knowledge $K$ long before the hypothesis $H$ (GR) was formulated. When Einstein formulated $H$, he didn't learn $E$; he learned that $H$ entailed $E$. But in standard probability theory, logical truths have probability 1. If it is a mathematical fact that $H \rightarrow E$, and $E$ is already known, the probability space is "frozen." There is no room for the "click" of recognition Einstein felt to register as an increase in credence.

  If we cannot solve this, Bayesian confirmation theory is historically blind. It can only account for "novel predictions" (where $E$ is discovered *after* $H$). Since much of science involves explaining existing data (phylogenetics, cosmology, geology), a Bayesianism that cannot handle old evidence is a Bayesianism that cannot handle science.

  ### The Counterfactual Detour

  The most intuitive fix is the counterfactual (or synchronic) approach, championed by philosophers like Colin Howson and Peter Urbach. The move is to ask: What would the scientist's prior probability for $E$ have been *if* they had not known it? If we can construct this hypothetical prior $P^*$, we can calculate $P^*(H|E)$ and show that it is higher than $P^*(H)$.

  This approach feels right because it captures the *explanatory power* of the theory. GR is confirmed by Mercury's orbit because GR *makes sense* of the orbit, regardless of when the orbit was discovered.

  However, the counterfactual solution is methodologically treacherous. It asks us to evaluate confirmation based on a history that never happened. How do we assign a probability to $E$ in a world where the agent doesn't know $E$? Do we strip them of all telescopic data? Do we let them keep the data but remove the belief? The results are highly sensitive to how we construct this fictional epistemic state. Two philosophers could construct two different counterfactual priors and derive opposite confirmation values for the same theory.

  Worse, this approach abandons the core Bayesian commitment to *diachronic* rationality (how beliefs change over time) in favor of *synchronic* coherence (how beliefs fit together at one time). If we accept the counterfactual fix, we admit that Bayesian updating is not the actual mechanism of confirmation. We are no longer modeling how Einstein changed his mind; we are modeling a thought experiment about a hypothetical Einstein. That might be useful for assessing theory choice, but it ceases to be a normative guide for belief revision. It solves the problem by changing the subject.

  ### Earman's Pessimism

  John Earman, in *Bayes or Bust?*, takes a harder line. He suggests that the Problem of Old Evidence reveals that Bayesian confirmation theory simply cannot be a complete account of scientific inference. He argues that the "support" relation (how well H explains E) is distinct from the "confirmation" relation (how learning H changes belief in E), and Bayesianism only handles the latter.

  Earman is right to be suspicious of formalism that contradicts clear scientific practice. If the math says "no confirmation" and the scientists say "huge confirmation," the math is missing something. However, Earman's conclusion is too deflationary. To say Bayesianism "can't tell the whole story" is true of almost any formal system, but it shouldn't be an excuse to leave a gaping hole in the center of the theory. If Bayesianism cannot account for the single most famous confirmation event in 20th-century physics, its utility is severely compromised. We should not abandon the project; we should fix the model of the agent.

  ### The Verdict: Bounded Rationality and the Garber Solution

  This leaves us with the solution proposed by Daniel Garber and Richard Jeffrey. Their move is subtle but devastatingly effective. They argue that the "new evidence" Einstein acquired was not $E$ (Mercury's orbit), but the logical fact $L$: *that Hypothesis H entails Evidence E.*

  In standard Bayesian models, agents are logically omniscient. They instantly know all the consequences of their hypotheses. If you believe $H$, you automatically believe $H \rightarrow E$. But real humans are not logically omniscient. Einstein could believe in GR and know the data about Mercury without immediately knowing that the two fit together. The "discovery" was the deduction itself.

  To model this, we expand the language of the probability space. We treat sentences about logical relationships (e.g., "$H \vdash E$") as distinct propositions that can have probabilities less than 1. Einstein's credence in "$H \vdash E$" started low (he didn't know if his theory worked) and went to 1 (he did the math). When he conditionalized on this new logical fact, his credence in $H$ rose.

  **Why Garber Wins**

  The Garber solution is superior to the counterfactual and Earman approaches for three specific reasons.

  First, **it preserves the diachronic nature of updating.** Unlike the counterfactual approach, Garber doesn't ask us to pretend Einstein didn't know the data. It respects the actual history: Einstein knew $E$, then he learned $L$ ($H \rightarrow E$), and then he updated. It models the *actual* cognitive event that occurred, rather than a hypothetical one. This keeps Bayesianism grounded in the psychology of learning.

  Second, **it avoids the arbitrariness of counterfactual priors.** We don't need to guess what Einstein would have believed in a parallel universe. We only need to assign probabilities to his actual uncertainty about the logical connection between his theory and the data. This is a much more constrained and objective task. We can argue about whether $P(H \vdash E)$ was 0.5 or 0.6, but we aren't arguing about the structure of reality.

  Third, **it identifies the true source of the "bug."** The Problem of Old Evidence is not a problem with Bayes' Theorem; it is a problem with the assumption of Logical Omniscience. The Garber solution forces us to admit that a realistic Bayesian epistemology must be a Bayesian epistemology for *bounded* agents. If we assume agents know all logical truths instantly, then of course they can't learn from deduction. By relaxing this assumption, the "problem" dissolves.

  Earman worries that this complicates the formalism. It does. It requires a language that can refer to its own sentences. But this complexity is the price of admission for a theory that wants to describe human scientists rather than idealized gods. The counterfactual approach tries to keep the agent simple by making the world fictional; Garber keeps the world real by making the agent complex. The latter is the honest philosophical trade.

  ### Conclusion

  The Problem of Old Evidence is often presented as a threat to Bayesianism, but it is actually an opportunity. It forces us to choose between a clean, idealized mathematics that fails to describe scientific history (the standard model), a subjective thought experiment that abandons updating (the counterfactual model), or a richer, more cognitively realistic model of learning (the Garber model).

  We should commit to Garber. The Mercury perihelion confirmed General Relativity because Einstein learned a new logical fact: that his theory entailed the data. By modeling the agent as logically non-omniscient, we allow the probability flow to move where our intuitions say it should. This doesn't vindicate the "naive" Bayesianism you started with, but it saves the core insight: that learning is updating. The bug wasn't in the updating rule; it was in the assumption that we already know everything there is to know. Einstein didn't need new data to change his mind; he needed new insight. A Bayesianism that can't model insight isn't worth having.
