      *   **Refinement:** Actually, the most authentic "win" in a Tibetan debate is forcing the opponent into an absurd consequence (*prasaṅga*). Roz's argument leads to the cessation of views. Dev's leads to a "view of contradiction." In Madhyamaka, holding *any* view (even a contradictory one) is a trap. So Roz wins philosophically. But Dev wins on textual literalism.
