      *   **The Debate Format:** Tibetan debate (Tsen-nyid) uses Dharmakīrtian logic. You *cannot* assert contradictions in a formal Tibetan debate. If a monk asserts $P \land \neg P$, they lose immediately. The *philosophy* is Madhyamaka, but the *tool* is Pramāṇa.
