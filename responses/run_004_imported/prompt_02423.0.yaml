      *   **Tibetan Debate Context:** The user mentions a *Tibetan* monastic debate courtyard (clapping/stamping). This is crucial. Tibetan Gelugpa debate (the most common style involving clapping) is heavily influenced by Dharmakīrti's logic (pramāṇa), which is generally Aristotelian/classical in structure (Law of Non-Contradiction holds strictly). However, the *philosophical view* (Madhyamaka) is Nagarjuna's. There is a tension here between the *logic used in debate* (Dharmakīrti) and the *ontology being discussed* (Nagarjuna).

