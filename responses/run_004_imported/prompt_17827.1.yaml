          *   *Relevance:* In AI safety, if agents can modify their own code, they might pre-commit to "I will never back down" to scare others. If they do this "updatelessly" (before knowing the specific opponent), they avoid the race to see who commits first. However, if they try to commit *after* knowing the situation but *before* the other guy, it's a race.
