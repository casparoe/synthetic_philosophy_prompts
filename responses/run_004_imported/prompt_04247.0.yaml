answer: |-
  # The Cost of Existence: A Defense of the Self-Indication Assumption

  **To:** Graduate Seminar on Formal Epistemology
  **From:** [Your Name/AI Assistant]
  **Subject:** Verdict on SSA vs. SIA

  The oscillation you describe between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) is not a symptom of pedagogical failure; it is the expected reaction to two frameworks that each demand we swallow a different kind of impossibility. SSA asks us to accept that our existence can provide evidence about causally disconnected events (the "Adam & Eve" problem). SIA asks us to accept that our existence can provide evidence about the total size of the universe independent of physical data (the "Presumptuous Philosopher" problem).

  In a choice between violating causal independence and violating cosmological humility, formal epistemology must choose the latter. **I argue that the Self-Indication Assumption (SIA) is the correct framework for anthropic reasoning.** While SIA yields counterintuitive results in high-stakes cosmological scenarios, SSA yields results that are incompatible with the scientific method itself. SSA forces us to treat indexical information as a lever for magic; SIA merely forces us to treat our existence as data.

  ### The Intuitive Core: Incubator and Sleeping Beauty

  To understand why we are tempted by SIA, we must look at the *Incubator* case, which is structurally isomorphic to the Sleeping Beauty problem. In the Incubator scenario, a coin is tossed. If Heads, one room is created with one man (black beard). If Tails, two rooms are created, one with a black-bearded man and one with a white-bearded man. You wake up in a dark room and discover you have a black beard. What is the probability the coin landed Tails?

  SSA dictates that you should reason as if you are a random sample from the *actual* observers in your reference class. In the Heads world, there is one black-bearded man. In the Tails world, there is one black-bearded man. Since you are equally likely to be *that* specific man in either world, SSA suggests the probability remains 1/2.

  SIA dictates that you should reason as if you are a random sample from all *possible* observers. In the Tails world, there are twice as many observers total. Therefore, you are twice as likely to exist in the Tails world. SIA suggests the probability is 2/3.

  The intuition favoring SIA here is the "betting argument." If this experiment were run a thousand times, and you bet on Tails every time you woke up with a black beard, you would win roughly 2/3 of the time under SIA reasoning, but only 1/2 under SSA. The "double-counting" intuition you mention arises because SIA treats "I exist" as evidence. In the Tails world, there are more "slots" for *you* to occupy. To deny this is to deny that the number of observers is a relevant variable in probability calculations. If we accept the "Thirder" position in Sleeping Beauty (which aligns with SIA) as the standard for rational betting behavior, we are already committed to the core mechanic of SIA: likelihoods scale with observer counts.

  ### The Fatal Flaw of SSA: Anthropics as Magic

  The reason SSA must be rejected is not that it is counterintuitive, but that it violates causal independence. This is most glaringly evident in the *Adam & Eve* cases.

  Consider the *Serpent's Advice*. Adam and Eve are the only humans. They know that if Eve conceives, their descendants will number in the billions, placing Adam's birth rank extremely early in the human sequence. If she does not conceive, Adam's birth rank remains very low (number 1). SSA implies that finding oneself with a very low birth rank is strong evidence that the total number of humans will be low. Therefore, Adam can reason: "It is overwhelmingly unlikely that I would find myself as observer #1 if there were going to be billions of humans. Therefore, it is overwhelmingly unlikely that Eve will conceive."

  Under SSA, Adam can rationally believe he has "psychic" influence over conception simply by noting his birth rank. If we introduce a causal mechanism—say, a serpent promises that a deer will walk into their path *if* Eve conceives—SSA allows Adam to update the probability of the deer appearing based on his reproductive choices. This is not merely Bayesian updating; it is backward causation via reference class selection. It allows an agent to learn about, or seemingly influence, causally isolated facts about the world through the sheer mechanics of their own existence.

  For a naturalistic epistemology, this is a dealbreaker. We cannot accept a theory of confirmation that allows agents to deduce the behavior of deer (or the outcome of coin tosses in other rooms) solely based on how many other observers *might* exist. SSA saves itself from this only by arbitrarily restricting the reference class (e.g., "only observers who don't know about the deer"), but as we shall see, this is an ad hoc patch, not a solution.

  ### The Presumptuous Philosopher: A Bullet Worth Biting

  The strongest argument against SIA is the *Presumptuous Philosopher*. In 2100, physicists are deciding between two theories, T1 and T2. Both are equally plausible based on physical symmetry. T1 predicts a universe with a trillion trillion observers. T2 predicts a trillion trillion trillion observers. SIA suggests we should be a trillion times more confident in T2 simply because it contains more observers, even before collecting further physical data.

  This feels absurd. It suggests anthropics can trump physics. However, we must weigh this absurdity against the alternative.

  The Presumptuous Philosopher case relies on the assumption that we can treat the "number of observers" as a known variable independent of physical evidence. But in a Bayesian framework, SIA does not say "ignore physics." It says "your prior probability of being in a world is proportional to the number of observers in it." If T1 and T2 are truly equiprobable *a priori* regarding physical laws, then the fact of your existence *is* physical data. You are more likely to find yourself in a universe that produces more observers, all else being equal.

  Is this presumptuous? Yes. But is it catastrophic? No. It merely implies that, ceteris paribus, we should favor cosmologies that are more "populous." This is a bias, but it is not a violation of causality. The Presumptuous Philosopher might bet on the wrong theory if the "smaller" universe turns out to be true, but he is reasoning consistently with the evidence he has (his own existence).

  Contrast this with SSA. The SSA proponent avoids the Presumptuous Philosopher result but inherits the *Doomsday Argument*. SSA implies that because we find ourselves relatively early in the apparent sequence of human history, the total number of humans is likely small. This leads to a pessimistic bias about the future of humanity that is derived *solely* from birth rank, independent of any sociological or technological data.

  So we have a choice:
  1.  **SIA:** We are biased toward believing we live in a populous universe (Presumptuous Philosopher).
  2.  **SSA:** We are biased toward believing humanity will end soon (Doomsday) AND we must accept that birth rank can inform us about causally disconnected events (Adam & Eve).

  The SIA bias is a prior over cosmological hypotheses. The SSA bias is a mechanism that allows indexical facts to override causal laws. The former is a calibration error; the latter is a structural failure.

  ### The Reference Class: No Hiding Place

  You asked specifically about the reference class. Proponents of SSA often try to escape the Adam & Eve problem by restricting the reference class. They might argue, "Adam is not in the same reference class as his potential descendants because they have different information."

  This is a desperate maneuver. If the reference class can be gerrymandered to exclude any observer whose existence would lead to counterintuitive probabilities, then SSA becomes unfalsifiable. It loses its predictive power. To make SSA work, one must specify the reference class *before* knowing the implications of the reasoning.

  Therefore, I commit to the following specification for SIA: **The reference class consists of all possible observer-moments that are subjectively indistinguishable from your current observer-moment.**

  This definition is rigorous. It does not depend on species ("human"), biology ("carbon-based"), or epoch ("21st century"). It depends on the phenomenological state. If there is a possible observer in the T2 universe who has the exact same sensory inputs, memories, and cognitive state as you, they are in your reference class.

  Why this definition? Because it is the only one that respects the *indifference principle* without inviting magic. If two observer-moments are subjectively identical, there is no fact of the matter that distinguishes "you" from "them" other than their location in logical space. To treat them differently is to posit a "soul" or a "haecceity" that floats above physical description—a move incompatible with the physicalism usually assumed in these seminars.

  Under this definition, the Presumptuous Philosopher case holds: if T2 produces more observers with your exact subjective state, you are more likely to be in T2. But the Adam & Eve case dissolves: Adam's subjective state is *not* indistinguishable from his descendants (he knows he is Adam; they know they are descendants). Thus, SIA does not grant Adam magic powers over conception, because he cannot treat himself as a random sample from a class that includes people with different information.

  ### Verdict

  We are left with a stark choice. SSA offers a comforting cosmological humility but demands we accept that reasoning about our own existence can function as a form of divination, allowing us to update on causally isolated events like the conception of children or the movement of deer. SIA demands we accept that our existence makes populous universes more likely, which feels arrogant, but it preserves the causal structure of the world.

  In formal epistemology, we must prioritize the integrity of the inferential framework over the comfort of the conclusion. The "Presumptuous Philosopher" is a strange bedfellow, but "Anthropic Magic" is an impossible one.

  **Adopt SIA.** Define the reference class as subjectively indistinguishable observer-moments. Accept that this makes you a cosmological optimist (favoring large universes) and a "thirder" in Sleeping Beauty cases. Reject SSA because its price is the violation of causal independence. It is better to be presumptuous about the size of the universe than to be magical about your place in it.
