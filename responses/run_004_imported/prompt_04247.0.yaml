  I've been teaching a graduate seminar on formal epistemology this term, and we just spent the last three weeks slowly working through Bostrom's *Anthropic Bias*, chapter by chapter. My students are now thoroughly split on whether the self-sampling assumption or the self-indication assumption is the right way to handle self-locating/indexical uncertainty, and honestly so am I -- I keep flip-flopping depending on whichever thought experiment we happened to discuss most recently in class.

  Could you write me an essay that actually commits to a verdict on SSA vs. SIA, rather than just cataloguing considerations on both sides (I get plenty of that from my students already)? I want you to seriously engage with at least the following: the presumptuous philosopher case against SIA (physicists in 2100 choosing between two "super-duper symmetry" theories, one implying a trillion trillion observers and the other a trillion trillion trillion), the sleeping-beauty-flavored double-counting intuition that makes SIA attractive to begin with, how the two views come apart on the incubator case (the black-bearded-man/white-bearded-man coin-toss room setup), and the way SSA seems to get embarrassed by the Adam-and-Eve-style cases -- serpent's advice, lazy Adam, that whole family -- where reference-class reasoning apparently lets you learn about, or even influence, unrelated facts about the world just through your reproductive choices. Don't dodge it at the end: give me a real position, defended. If the answer is reference-class dependent, tell me specifically what its supposed to depend on and why -- don't just leave it hanging like that's an answer in itself.
