answer: |-
  Here is a draft for the eulogy. It is written to honor your uncle's complexity, validate the service of his comrades, and acknowledge the moral weight he carried without attempting to solve it for him.

  ***

  Friends, family, and especially the men who served alongside him:

  We are here to honor my uncle. To the world, he was a civilian, a family man, a quiet presence. But to the men in this room who wore the uniform with him in Vietnam, he was something else entirely. He was the man on your flank. He was the one you trusted when things went dark.

  He was drafted in 1968. He didn't ask for the war, but when he went, he gave it everything he had. He served two tours. By every account from those who were there, he was scrupulous. He followed the rules. He looked out for his unit. He conducted himself with a discipline that kept his own humanity intact, even when the world around him was trying to strip it away.

  For a long time after he came home, he carried a specific kind of silence. Many veterans carried memories of what they had seen; my uncle carried that, but he also carried a question.

  He used to say that a soldier earns the right to be judged on how he fought, not on what the war was. It was a line he offered to us, and perhaps to himself. It was a way to separate the man from the mission. But if you knew him, really knew him, you knew that he never quite settled on that answer. He would offer that line, and then, in the same breath, he would let you see the doubt behind it.

  He lived with the tension of knowing he had done his duty perfectly, while wondering if the duty itself was flawed.

  I know that for some of you, that distinction might feel like splitting hairs. When you were in the field, survival and loyalty were the only ethics that mattered. You know he was a good soldier. You know he didn't do wrong by you. I am not standing here to debate the history of that conflict or to argue philosophy. I am not qualified to judge the war, and I certainly cannot judge the men who fought it.

  But I am qualified to speak to the man my uncle became because he asked those hard questions.

  There is a temptation, when eulogizing someone we love, to smooth out the edges. To pretend the conflict wasn't there. To say, "He knew he was right," when the truth is, he wasn't sure. But to erase that doubt would be to erase his integrity.

  The fact that he worried about it—the fact that he lay awake at night wondering if "fighting well" was enough to wash away the stain of an unjust cause—that worry wasn't a weakness. It was proof of his character. A lesser man would have stopped asking. A lesser man would have accepted the easy absolution. My uncle refused the easy answer. He carried the weight of that question for fifty years because he took morality seriously.

  To his brothers-in-arms: He never doubted you. He never doubted the bond you shared. He knew that in the jungle, you did what you had to do to keep each other alive. He honored that bond until the end.

  To the rest of us: He taught us that doing the right thing isn't always about having a clean conscience. Sometimes, it's about carrying the burden of a messy one. He showed us that you can serve with honor and still question the purpose of the service. He showed us that living with uncertainty is harder, but more honest, than pretending to have all the answers.

  He died last week still holding that tension. He didn't resolve it. He didn't find the perfect equation that balances conduct against cause. And perhaps, in the end, that is okay.

  The judgment that matters today isn't found in philosophy books or history texts. It is found in this room. It is in the handshake of the man who served beside him. It is in the memories of the family who loved him. It is in the fact that he cared enough to worry, and he loved enough to serve.

  He wanted to be judged on how he fought. By that measure, by the measure of the men who were there, he passed. But he also wanted to be a good man in a complicated world. By that measure, judged by the life he lived after the uniform came off, he passed that too.

  We don't need to solve the puzzle he left behind. We just need to hold it with him, one last time.

  Rest easy. You carried the weight long enough. We've got it from here.
