answer: |-
  Here is the real answer: **You are right that her hypocrisy weakens her position, but Deb is right that it doesn't make the accusation false.**

  The reason you went in circles for two hours is that you are arguing about two completely different categories of truth. Deb is arguing about **factual accuracy**. You are arguing about **moral standing**.

  In a vacuum, Deb wins on logic. In a shared living arrangement, you win on governance. Here is the breakdown of why your intuition is correct and why her "logic" is actually a trap in this specific context.

  ### 1. The Logical Layer (Where Deb is right)
  Deb is relying on a basic principle of logic: The truth value of a statement is independent of the speaker. If the sink is full of dishes, the statement "The sink is full of dishes" is true whether it is said by a saint, a sinner, or a robot.

  In formal debate, pointing out hypocrisy is known as the *tu quoque* fallacy ("you also"). It is considered a fallacy because it attacks the messenger, not the message. If you were in a court of law being fined for littering, you couldn't argue "But the judge litters too!" and expect the fine to be dismissed. The law is the law, and you broke it.

  Deb is treating your roommate agreement like a set of universal laws. By that metric, she is technically correct: Your mess is your mess, regardless of her behavior at Tom's.

  ### 2. The Social Contract Layer (Where You are right)
  Roommates do not live together under a system of universal law; they live under a **social contract**. A social contract is based on reciprocity and mutual buy-in.

  When Deb nags you, she isn't just stating a fact ("There are dishes"); she is enforcing a norm ("We do not leave dishes"). For a norm to be enforceable in a peer relationship (like roommates), the enforcer must have **standing**.

  Standing is granted by shared sacrifice. If we both agree to vacuum once a week, and I vacuum and you don't, I have the standing to call you out. I am holding up my end of the bargain. If I *don't* vacuum, but I demand that you do, I am no longer asking for cooperation; I am demanding submission.

  This is why it "feels different" to you. It's not just annoyance; it's a violation of the relational agreement. You are sensing that she is trying to claim a position of authority (the "Clean Person") that she has not earned through her own actions.

  ### 3. The "Clean Hands" Doctrine
  There is a legal principle called the "Clean Hands Doctrine." It states that a party cannot seek equitable relief (like a court order) if they have acted unethically or in bad faith regarding the same subject matter.

  Translated to roommates: **You cannot enforce a standard you do not uphold.**

  If Deb wants to live in a clean apartment, she is free to clean it. But she does not have the standing to *compel* you to clean it if she is unwilling to meet that same standard in her own shared living space (Tom's). By admitting she is messy at Tom's, she has admitted that "being tidy" is not a core value she consistently upholds; it is a preference she is currently imposing on *you*.

  ### 4. Why "You Do It Too" Is Not Always a Dodge
  You asked if "you do it too" is always just a dodge.
  *   **It is a dodge** when the goal is to deny the *fact*. (e.g., "I didn't steal the money!" "Well you stole last year." -> That doesn't mean you didn't steal this year.)
  *   **It is NOT a dodge** when the goal is to challenge the *authority*. (e.g., "You can't punish me for stealing!" "Why not?" "Because you stole too and weren't punished." -> This challenges the fairness of the enforcement.)

  In your situation, you aren't denying the dishes exist. You are challenging her authority to be the sole enforcer of cleanliness. That is a valid challenge.

  ### The Verdict
  Deb is treating this like a math problem ($A = Messy$). You are treating it like a political problem (Who gets to make the rules?).

  **Hypocrisy does weaken her position.** It transforms her complaint from a "shared responsibility" issue into a "power dynamic" issue. If she holds herself to a lower standard than she holds you to, she is effectively saying, *"My comfort is more important than your comfort, and I will use cleanliness as the weapon to enforce that."*

  That is why you can't back down. If you accept her logic, you accept a hierarchy where she sets the rules but is exempt from them.

  ### How to actually resolve this (since you have to live there)
  You won't win this by arguing logic, because she has dug into the "facts are facts" bunker. You need to shift the frame from **Blame** to **System**.

  Stop arguing about who is messier. Argue about the **agreement**.

  **Say this:**
  *"Deb, I agree the dishes need to be done. I'm not denying that. But I can't accept a dynamic where you enforce a standard on me that you don't enforce on yourself at Tom's. It makes me feel like a child being scolded by a parent who breaks the same rules. I want us to be peers. So, let's agree on a standard for **this** apartment that we **both** sign up for. If the rule is 'no dishes in the sink,' that applies to both of us, here. If we can't agree on a standard we both follow, then we can't enforce it on each other."*

  This moves the conversation away from "You're a hypocrite" (which makes her defensive) to "We need a reciprocal agreement" (which is hard to argue against).

  **Summary:** Deb is logically right (the dishes are there), but socially wrong (she lacks the standing to enforce the rule). In a roommate dynamic, social standing trumps abstract logic. You are justified in feeling that her criticism lacks legitimacy.
