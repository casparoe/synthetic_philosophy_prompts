      *   *Phase 1* is manageable. It's a secret. If the secret gets out, accountability is possible because there is a shared reality (the spreadsheet) that proves the lie.
      *   *Phase 2* is dangerous. It erodes the shared reality itself. If the leader believes the fiction, you can't shame them with facts. Facts become "opinions." This creates a fragmented council where two groups inhabit different worlds.
