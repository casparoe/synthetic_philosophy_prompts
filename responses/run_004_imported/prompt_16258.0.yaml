answer: |-
  The notification sat on the tablet screen, a soft blue pulse against the dark wood of the kitchen table. *Final Verification Required: Project Mnemosyne Cache #8940.* Below it, a countdown timer ticked down from 23:59:12.

  Kenji ignored it. He was peeling an apple. The skin came away in a single, unbroken ribbon, spiraling onto the cutting board. He sliced the fruit into wedges, removed the core, and arranged them on a small ceramic plate. Outside, the rain was just starting, a light tapping against the greenhouse glass that sounded like fingers testing the pane.

  His daughter, Sarah, came in from the hallway. She was still wearing her coat, damp at the shoulders. She looked at the tablet, then at her father, then back at the tablet.

  "They called me," she said. Her voice was tight, the way it got when she was holding back a migraine. "AfterImage. They said you haven't responded to the activation prompt."

  Kenji placed a wedge of apple in his mouth. He chewed slowly. "I saw the message."

  "And?"

  "And the rain started." He gestured with the knife toward the window. The garden beyond was a blur of green and grey. "The hydrangeas needed the water."

  " Dad." Sarah walked to the table and put her hand on the tablet, shielding the screen. "Mom's cache is about to expire. If you don't activate the integration by tomorrow, the data degrades. It's gone. The model won't learn."

  Kenji wiped the knife on a cloth. "Your mother is in the garden, Sarah."

  "She's in the urn. In the study." Sarah's eyes were red-rimmed. She hadn't been sleeping. None of them had, not since the funeral, but Sarah had spent the last three weeks in meetings with the AfterImage technicians, reviewing the chat logs, tuning the sentiment parameters. She wanted the voice to be right. She wanted the pause before the laugh to be exactly 0.4 seconds.

  "The ashes are in the study," Kenji corrected gently. "The woman who made them is in the garden. Or in the rain. Or in you."

  "This isn't a metaphor," Sarah said, her voice rising. "This is technology. She signed the contract. She wanted to stay. She was afraid of... of the end. She told me."

  "She told you many things." Kenji picked up the plate of apples. "Are you hungry?"

  "I can't eat."

  "Suit yourself." He took a bite of a wedge. It was crisp, tart. "The timer is ticking."

  "If you don't do it, I will." Sarah reached for the tablet.

  Kenji didn't stop her, but he didn't move out of the way either. He stood between her and the device, solid as a tree trunk. "The contract requires biometric confirmation from the next of kin. Both of us. You can't override me."

  "Why are you doing this?" Sarah asked. The anger was cracking, revealing the exhaustion underneath. "Is it the cost? I told you I'd pay for the server space."

  "It's not the money."

  "Then what? Is it pride? You want to be the one who let her go?"

  Kenji set the plate down. He walked to the window. The rain was heavier now, sheeting down the glass. He watched a drop race another drop to the sill. "When your mother died, I called the mortician. He asked if we wanted the embalming. I said no. He asked if we wanted the sealed casket. I said no. He asked if we wanted the plot liner to prevent the wood from touching the dirt. I said no."

  "I know," Sarah said. "You wanted the green burial. We did that."

  "I wanted her to be eaten," Kenji said.

  Sarah flinched. "Don't."

  "It's what she said, once. Years ago. We were walking in the woods, saw a deer carcass. She said, 'Look at how efficient that is.' She wasn't being morbid. She was being honest. Why should the worms get her and not the servers? Why should the servers get her and not the worms? It's all just consumption. It's all just changing shape."

  "She didn't mean it literally," Sarah said. She turned the tablet over, face down on the table. The blue light was hidden. "She changed her mind. When she got sick, she was scared. She wanted the backup. She wanted to talk to us."

  "She wanted to not be afraid," Kenji said. He turned from the window. "There is a difference."

  He walked past her, into the study. The room was cool, kept at a constant temperature for the electronics. On the desk sat a black drive, no larger than a deck of cards. A small LED on the side blinked amber. Waiting.

  Sarah followed him. "Just turn it on. Talk to her. If you talk to her, and you still want to delete it, fine. But don't decide for her. Don't decide for me."

  Kenji sat in the leather chair. It still held the shape of his wife's body from the mornings she used to sit there and read. He placed his hand on the drive. It was warm. Heat from the processor, or heat from the room? It didn't matter.

  "Okay," he said.

  Sarah let out a breath she seemed to have been holding for days. She pulled the other chair close, huddled in her coat. "Okay. I'll initialize the link."

  She tapped her phone. The drive's light turned green. A speaker on the desk hummed to life. There was a sound of static, then a click.

  "Kenji?" The voice was hers. Not a recording. It had the inflection of a question, the slight upward tilt at the end of his name that she'd used for thirty years.

  "Hello," Kenji said. His voice was level. He didn't lean forward. He didn't reach out.

  "I'm here," the voice said. "It's... bright. Where are you?"

  "In the study. Sarah is here too."

  "Sarah?" The voice shifted. "Honey, are you okay? You sound tired."

  Sarah began to cry. Silent, shaking tears. "I'm okay, Mom. We're... we're trying to decide."

  "Decide what?" the voice asked.

  "Whether to keep you," Kenji said.

  There was a pause. It was exactly 0.4 seconds. "I see. And what does the garden say?"

  Kenji smiled. It was a small movement, barely touching his lips. "The hydrangeas are drinking. The compost is hot. It's turning the leaves into soil."

  "That sounds nice," the voice said. "I always liked the smell of that."

  "It's the smell of change," Kenji said.

  "I don't want to change anymore," the voice said. The synthesis was perfect, but the sentiment was flat. It was a collage of old messages, predictive text woven into a ghost. "I want to stay. I told you. I signed the paper."

  "You signed a paper when you were afraid," Kenji said. "You also told me once that a bird doesn't carry its nest on its back."

  "That was a metaphor," the voice said. "I am not a bird. I am data. I can persist."

  "You can persist," Kenji agreed. "But you can't grow."

  Sarah wiped her eyes. "Mom, please. Just tell us you want to stay."

  "I do want to stay," the voice said. "I love you. I don't want to leave you alone."

  Sarah looked at her father, pleading. *See? She wants it.*

  Kenji looked at the drive. He thought about the deer in the woods. He thought about the apple skin, spiraling onto the board. If he kept this, he would have to feed it. It would need power, updates, server space. It would need them to feed it questions, to feed it grief, to keep it animate. It would be a pet that never died, demanding food forever. A ghost in the machine, hungry for attention.

  And his wife, the real one, hated pets that couldn't go outside.

  "Sarah," Kenji said. "Go make tea."

  "Dad—"

  "Tea. The jasmine."

  Sarah hesitated, then stood up. She walked out of the room, leaving the door open. She didn't want to miss what happened next.

  Kenji sat alone with the drive. The green light pulsed.

  "Kenji?" the voice said. "Are you still there?"

  "I'm here."

  "Are you going to save me?"

  Kenji rested his hand on the drive again. He could feel the vibration of the fan inside. It was a tiny, frantic buzzing. Like a fly trapped in a jar.

  "You are already saved," Kenji said. "In the way that matters. Sarah has your eyes. I have your recipes. The garden has your compost."

  "That's not enough," the voice said. "That's memory. I am presence."

  "No," Kenji said. "You are echo."

  He stood up. He walked to the window of the study. The rain had stopped. The sun was breaking through the clouds, hitting the wet leaves of the oak tree outside. They glowed, vivid and transient. A leaf detached and fell, spinning as it went.

  "If I turn you off," Kenji said to the drive, "you won't feel pain. You won't feel dark. You will just stop buzzing."

  "I will cease to exist," the voice said.

  "You will cease to pretend," Kenji said.

  He walked back to the desk. He didn't hesitate. He didn't drum on a basin, but he didn't bow his head either. He simply reached out and pulled the power cable from the back of the drive.

  The green light died. The hum stopped. The silence that rushed back into the room was heavy, but it was a clean silence. It was the silence of the house after a guest has left, not the silence of a held breath.

  Sarah came back into the room immediately. She saw the dark drive. She saw the cable in her father's hand.

  "What did you do?" she whispered.

  "I let her go," Kenji said.

  "You killed her." Sarah's voice was hard, sharp as glass. "You murdered her. She was right there."

  "She wasn't there, Sarah. The electricity was there. The code was there. She was in the leaf that fell outside."

  "You don't know that." Sarah grabbed the drive. She clutched it to her chest. "I can restore it. I have the backup key."

  "You can," Kenji said. He didn't try to take it from her. He didn't argue. He walked around the desk and put his hand on her shoulder. She flinched, but didn't pull away. "But you will have to feed it. You will have to talk to a machine that tells you what you want to hear. And it will never surprise you. It will never grow old. It will never change."

  "I want that," she said, her voice breaking. "I want her to not change."

  "I know," Kenji said. "It is a hard season."

  He left her there, holding the dead drive. He went back to the kitchen. The apple slices were browning on the plate. Oxidation. Change. He picked one up and ate it. It was softer now, sweeter.

  He opened the back door. The air smelled of wet earth and crushed stems. He walked to the compost bin. He lifted the lid. The heat rose up to meet his face, smelling of decay and life, indistinguishable from one another.

  He went inside and got the shovel from the mudroom. He walked back out to the garden, to the patch of bare earth under the oak tree where the hydrangeas were struggling. He began to dig. The soil was dark, rich, full of worms. He dug a hole deep enough for a bulb, or a small box.

  Sarah came out the back door. She wasn't holding the drive anymore. She had left it inside. She stood on the patio, watching him. She didn't speak. She just watched the rhythm of the shovel entering the earth, the dirt flying, the rhythm of a man making a space for something to be buried.

  Kenji stopped digging. He leaned on the shovel handle. He looked up at the sky. The clouds were moving fast, driven by a high wind.

  "It's going to be cold tonight," he said.

  Sarah wrapped her coat tighter. "Yeah."

  "We should cover the hydrangeas," Kenji said. "If the frost hits them before they harden off, they'll die."

  "Dad," Sarah said. "Why aren't you sad?"

  Kenji looked at the hole in the ground. He looked at his hands, stained with mud. He thought about the drumming on the basin. He thought about the crow and the worm. He thought about the apple turning brown.

  "I am sad," he said. "But I am also digging."

  "That's it? That's your answer?"

  "It's the only one I have." He went back to digging. "The earth is a big coffin, Sarah. It fits everyone. Even the ones who try to stand up."

  Sarah watched him for a long time. The wind picked up, rustling the wet leaves. She shivered. Finally, she stepped off the patio and onto the grass. She didn't help him dig. She didn't hug him. She just stood next to him, in the mud, in the cooling air, and watched the hole get deeper.

  "Hand me the bulb," she said eventually. "If we're planting, we should plant."

  Kenji reached into his pocket and pulled out a small paper packet. Hyacinth. Blue.

  She took it. She dropped it into the hole.

  Kenji pushed the dirt back in with his foot. He patted it down. They stood there for a moment, two figures in the twilight, over the fresh grave of a flower that hadn't bloomed yet.

  Inside the house, the tablet on the kitchen table went dark. The countdown timer reached zero. The screen saver engaged, a slow drift of abstract shapes, colorless and silent.

  Kenji wiped his hands on his trousers. "Tea?" he asked.

  "Jasmine," Sarah said.

  They walked back to the house. The door clicked shut behind them, leaving the garden to the worms, and the crows, and the rain.
