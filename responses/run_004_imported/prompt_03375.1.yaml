answer: |-
  The map was laminated, but the rain had found the edges. It curled in Judy's gloved hands, soft as wet cardboard. Four squares. That was the world.

  Red North. Red South. Blue North. Blue South.

  In the briefing, the intelligence officer had tapped each quadrant with a blunt pencil. *Equal likelihood,* he'd said. *We have no intel. Assume uniform distribution.* Twenty-five percent each. A perfect, fragile symmetry. If you were in Red, you were enemy-side. If you were in Blue, you were friendly-side. If you were in a Headquarters sector (North), you were in the kill zone. If you were in Second Company (South), you were in the patrol zone.

  Judy had memorized the geometry of her own ignorance. It was a comfortable shape. A square.

  Now, crouched behind a berm of frozen mud, the radio hissed. The static sounded like tearing fabric. Then the voice cut through, her own HQ, distant and digitized.

  "Benjamin. Listen closely. We cannot verify your location. Repeat, we cannot verify Red or Blue."

  Judy held her breath. Miller, beside her, was chewing his lip, eyes wide.

  "However," the voice continued, "telemetry on enemy comms density indicates a conditional probability. *If* you are in Red territory, the odds of you being in Headquarters sector versus Second Company sector are three to one."

  The transmission died. Just like that. The static rushed back in to fill the void.

  Miller lowered his rifle. "Okay. Okay. So. If we're in Red, we're probably near their HQ. That's bad. That's really bad."

  Judy didn't answer. She was looking at the map. The Red half.

  Before the message, Red was a flat plain. Headquarters and Second Company were equally likely. Now, Red had topography. It had a mountain and a valley. The Headquarters sector in Red loomed large, heavy with three-quarters of the probability mass. The Second Company sector shrank, compressed into the remaining quarter.

  "It says nothing about Blue," Miller said. He was looking for reassurance. "They didn't say anything about Blue. So our odds there haven't changed, right? Inside Blue, it's still fifty-fifty?"

  Judy nodded slowly. "Inside Blue, the ratio is preserved. North and South are still equal."

  "So we're still fifty-fifty on Red versus Blue overall?" Miller asked. "The message was only about Red. Why would the border move?"

  That was the question. The math, if she ran it in her head, was clean. It was the *minimum* change required to accommodate the new rule. You had to distort the Red side to fit the three-to-one constraint. But to keep the total 'distance' from her original state of ignorance as small as possible—to be as conservative as possible with her beliefs—the system had to compensate.

  The Red side had become *specific*. It had become constrained. It carried more information density.

  Blue remained vague. Blue remained silent.

  "It's like weight," Judy said, her voice sounding strange to her own ears. "Red got heavier. Inside itself, it got heavier. The HQ sector is dense now."

  "So we should think we're less likely to be in Red?" Miller asked. He sounded hopeful. Desperate.

  Judy frowned. This was the itch. The message was *only* about Red. It contained zero explicit information about Blue. Logically, if I tell you "If it rains, the grass gets wet," I haven't told you whether it's raining. I haven't told you if the grass is dry.

  But her mind was already shifting. The symmetry was broken. The Red territory was no longer a simple coin flip. It was a loaded die. Blue was still a coin flip.

  In the silence of the radio, the lack of information about Blue began to feel like a kind of space. Red was crowded now, packed with that three-to-one constraint. It felt smaller. It felt defined. When something becomes defined, doesn't it occupy less room in the realm of possibility?

  "I think..." Judy started, then stopped.

  She could feel the credence leaking. It was a physical sensation, like water finding a new level in a tilted tank. The Red side, because it had to contort to fit the message, had become 'expensive.' To minimize the shock to her worldview, her mind was offloading probability. It was spilling over the border.

  Into Blue.

  "It shouldn't change," she said. "It's logically independent. The conditional doesn't touch Blue."

  "But?" Miller pressed. He could see her face.

  "But if Red is... specified," Judy said, tracing the border between the colors with a muddy thumb. "And Blue is unspecified. The unspecified feels larger. The Red sector is a trap that's been described. The Blue sector is just... open."

  She knew it was a fallacy. She knew Van Fraassen would call it a trick of the entropy minimization. She was talking herself into safety. She was taking a message that said "If you are in enemy territory, you are in the kill zone," and somehow hearing "You are probably not in enemy territory."

  The confidence was rising anyway. It wasn't a decision; it was a settling. Before the call, she felt balanced on a knife-edge between Red and Blue. Now, the knife-edge tilted. The Blue side felt deeper, more spacious. The probability mass of Red had shrunk, not because of evidence against it, but because of the *cost* of the evidence within it.

  She looked at the Blue quadrants. They hadn't changed. They were still 50/50 internally. But the total area of Blue on the map of her mind had expanded. Just a little. Enough to feel like hope.

  "Judy," Miller said. "What's the number? What's your gut say on Blue now?"

  She wanted to say fifty percent. She wanted to say *the message didn't touch us.*

  But the silence of the HQ regarding Blue wasn't neutral. It was a vacuum. And nature abhors a vacuum. The pressure from the constrained Red side pushed against the silence of the Blue side, and the silence yielded.

  "It's higher," she whispered.

  "Higher than fifty?"

  "Yes."

  Miller let out a breath he'd been holding for a minute. His shoulders dropped. He looked at the Blue sector like it was a life raft. "Okay. Okay. So we're likely in Blue."

  "We don't know that," Judy said sharply. But the sharpness was for herself.

  She knew the derivation. She knew that minimizing relative entropy meant preserving the ratios of the unconstrained partition while scaling the total mass to accommodate the constraint. She knew that making Red *more specific* mathematically necessitated making Blue *more probable*.

  But knowing the mechanism didn't stop the feeling. It felt like cheating. It felt like she had asked, "Is the box on the left heavy?" and been told, "If it is, it's full of lead," and somehow concluded, "Therefore, the box is probably on the right."

  The radio stayed dead. The rain picked up, drumming on the laminated map, blurring the line between Red and Blue. Judy stared at the border. It was just ink. But in her head, the line had moved. She was safer than she had been five minutes ago, purely because the enemy's territory had become more detailed.

  "Let's move," she said, standing up.

  "Which way?" Miller asked. "Towards Blue?"

  Judy looked at the compass. She looked at the map where the Blue territory now loomed larger than it had any right to be, inflated by a message that never spoke its name.

  "We have to assume the update is correct," she said. "We have to act on the probability."

  "Even if it's a trick?"

  "Especially if it's a trick," Judy said. "Because if it is a trick, it means the math wants us to be safe. And I don't want to argue with the math."

  She started walking toward the Blue line, feeling the strange, unearned weight of safety in her chest, heavy as a stone, light as a lie.
