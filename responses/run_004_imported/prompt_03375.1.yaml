      So $P(H|Red) = 3/4$.
      Prior $P(H|Red) = 1/2$.
      This is a significant shift within Red.
      The MinEnt update preserves the ratio of probabilities for states not mentioned (Blue) relative to each other, but the *total* mass of Blue increases.
      I need to make sure the story reflects that the *internal* structure of Blue doesn't change (still 50/50 within Blue), but the *total* Blue confidence goes up.

