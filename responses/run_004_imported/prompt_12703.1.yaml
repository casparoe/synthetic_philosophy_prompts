      *   Introduce the idea that authority is a question, not an answer.
      *   Explain that without blind duty, our choices matter *more*.
      *   Talk about civil disobedience as the ultimate form of respecting the community (Rawls).
      *   End with a charge to build a community worth obeying.

  7.  **Final Polish (Checking Constraints):**
      *   *Word Count:* Aiming for ~850-900 words for 6 minutes.
      *   *Simmons:* Mention the lack of "general duty."
      *   *Rawls:* Mention the conditions (nonviolent, accept penalty).
      *   *Safety:* Explicitly state this isn't an excuse for chaos.
