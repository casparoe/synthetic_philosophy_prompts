answer: |-
  Good morning. Faculty, families, school board members, and most importantly, the Class of 2024.

  Standing here, I know what is expected of me. The valedictorian speech is supposed to be a send-off. We are told to go out into the world, vote, work hard, and be good citizens. And usually, "being a good citizen" is shorthand for following the rules. Obey the law. Pay your taxes. Don't rock the boat.

  It is good advice. But this year, I found myself unable to say it without asking: *Why?*

  In my time on the debate team, I fell down a rabbit hole of political philosophy. I read arguments about why we owe anything to the state at all. We are told we have a moral duty to obey the law simply because it is the law. But when you look closely at the justifications—consent, fairness, gratitude—they don't quite hold up. The philosopher A. John Simmons calls this "philosophical anarchism." It sounds scary, but his point is actually quite specific: there is no free-standing, magical duty to obey authority just because it claims authority.

  I know that sounds dangerous. I know some of you are thinking, "Great, the valedictorian is telling us rules are optional." But please hear me out. Because realizing that obedience isn't automatic doesn't mean we should be chaotic. It means our responsibility is heavier, not lighter.

  If we don't obey laws just because they exist, then we have to obey them because of what they *do*. We stop following rules out of habit or fear, and start following them out of commitment.

  When you take away the blind duty to obey, you are left with the people standing next to you. I follow the speed limit not because the state commands it, but because I value the life of the driver in the oncoming lane. I pay taxes not because I signed a contract, but because I believe in the schools and roads we share. When you strip away the abstract authority of the state, you find the concrete reality of your community. We don't owe our obedience to the government; we owe our care to each other.

  This changes everything. It means that being a good adult isn't about checking boxes. It's about constantly asking: Does this rule protect my neighbors? Does this system treat us fairly?

  And sometimes, the answer might be no.

  This brings me to the hardest part of growing up: knowing what to do when the law fails that test. If there is no automatic duty to obey, does that mean we break whatever we want? Absolutely not. That would be selfish, not free.

  John Rawls, another philosopher I studied, wrote about civil disobedience. He argued that breaking the law is only justified under strict conditions. It must be nonviolent. It must be public. It must be a last resort. And crucially, it must be done with a willingness to accept the penalty.

  Think about that last part. Willingness to accept the penalty.

  That is the difference between a criminal and a conscientious citizen. A criminal breaks the law to escape responsibility. A conscientious citizen breaks a specific law to highlight a greater injustice, and accepts the punishment to prove their loyalty to the rule of law overall. They say, "I respect this system enough to suffer for its improvement."

  That is the kind of maturity I want for us. I don't want us to be people who follow rules because we are afraid of getting caught. I want us to be people who follow rules because we understand why they are there. And I want us to be people who, when a rule is unjust, have the courage to challenge it peacefully, and the integrity to pay the price for that challenge.

  To the parents and board members here: I know this sounds like a lot of weight to put on eighteen-year-olds. You want us to be safe. You want us to succeed. But the world we are entering is complex. It needs more than compliance. It needs judgment.

  If we treat you like children, we teach you to obey. If we treat you like adults, we teach you to think.

  So, Class of 2024, as we scatter, here is my charge to you. Do not obey simply because you are told to. Obey because you have looked at the rule, weighed it against your conscience and your care for your community, and decided it is worth keeping.

  Build lives where your commitments are chosen, not inherited. Respect the law enough to hold it accountable. And when you navigate the world, remember that the only authority that truly matters is the trust you earn from the people around you.

  We are not just leaving high school. We are leaving the age of automatic obedience. Let's enter the age of deliberate responsibility.

  Congratulations.
