      *   *Theme:* Responsibility without Authority. Or: Choosing our commitments rather than inheriting them.
      *   *Metaphor:* Growing up is often described as gaining freedom. This speech reframes it as gaining the burden of judgment.
      *   *Structure:*
          1.  Hook: The standard advice we usually get (be good citizens).
          2.  The Twist: Admitting that the philosophical foundation for that advice is shaky (Simmons).
          3.  The Pivot: If not obligation, then what? (Relationships, community, care).
          4.  The Application: How to handle injustice (Rawls/Civil Disobedience).
          5.  Conclusion: A call to thoughtful engagement.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the moment. The "standard speech." Validate the teacher's concern but gently introduce the deeper question.
      *   **The Philosophical Core (Simmons):** Needs to be simplified. Don't name-drop Simmons immediately, maybe weave it in. "We are told to obey because it's the law. But is that enough?" Explain that authority isn't automatic. It's earned.
      *   **The Ethical Pivot:** If the state doesn't own us, why be good? Because of *each other*. Shift from vertical obligation (citizen -> state) to horizontal obligation (person -> person).
      *   **The Rawls/Civil Disobedience Component:** This is the risky part. Needs to be framed carefully. It's not about breaking rules for fun. It's about the *seriousness* of breaking a rule. Accepting consequences is key. This shows maturity.
      *   **Conclusion:** Bring it back to the class. The future. A charge to think critically.

      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm telling kids to break the law. I need to emphasize that *most* laws are worth following for *other* reasons (safety, fairness, coordination), just not because of a magical "duty." I also need to ensure the Rawls section doesn't sound like a manual for protest, but a standard for integrity.

  4.  **Refining the Tone:**
      *   Avoid jargon like "principle of fair play" or "natural duty of justice" unless explained simply.
      *   Keep sentences rhythmic for speech.
      *   Ensure the emotional arc lands on hope and responsibility, not cynicism.
      *   *Crucial:* Address the parents/board implicitly. "I know this sounds scary, but it's actually more mature."

  5.  **Drafting - Iteration 1 (Mental Outline):**
