      *(Refining the "Anarchism" label)*: The word "anarchism" might scare parents. I need to contextualize it immediately as "philosophical," not "bomb-throwing." Simmons's distinction is crucial here.

      *(Refining the Rawls section)*: Make sure to highlight "willingness to accept the penalty." That shows respect for the system even while challenging it. That's the bridge to responsibility.

