      *   **Tone:** Graduation speech (inspirational, reflective, communal), not a philosophy lecture. Accessible to laypeople but rigorous enough for those who know the theory.
      *   **Constraint:** Must *not* sound like an encouragement to lawlessness or irresponsibility. Must arrive at a positive ethical conclusion about what we owe each other without relying on blind obedience.
