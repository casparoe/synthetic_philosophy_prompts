answer: |-
  **MEMORANDUM**

  **TO:** The Session of [Church Name]
  **FROM:** [Your Name], Elder
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding Request for Sanctuary Status

  **I. PURPOSE**

  The purpose of this memo is to provide a recommendation for the Session's vote next month regarding the request to grant sanctuary to the [Family Name] family. Specifically, we are asked to vote on whether to authorize the family to reside within the church building to prevent imminent deportation.

  **II. CONTEXT AND SUMMARY**

  The [Family Name] family, members of our community for twenty years, face deportation due to unresolved immigration paperwork. They have requested sanctuary status, which would involve them taking up residence in the church building. 

  Our legal counsel has advised that while prosecutions of congregations for harboring are statistically rare, providing residence does technically expose the church corporation and its officers to potential federal criminal charges and civil liability. 

  The Session is currently divided on this matter. One perspective emphasizes the moral and theological imperative to protect a vulnerable family. The other emphasizes the governance implications of a nine-member board making a high-risk decision on behalf of a 200-member congregation and paid staff without their explicit consent.

  **III. ANALYSIS OF GOVERNANCE AND POLITY**

  While the Presbyterian Book of Order grants the Session spiritual and administrative oversight of the congregation, including the use of church property, this authority is exercised within the context of the whole body of Christ. 

  The objection raised regarding unilateral decision-making is not merely procedural; it is theological and fiduciary. 

  1.  **Fiduciary Stewardship:** The church building and assets belong to the congregation as a corporation. A decision that risks the legal standing of that corporation affects every member, not just the Session. 
  2.  **Corporate Conscience:** In matters of civil disobedience or high-risk witness, Presbyterian polity traditionally values the discernment of the whole church. When the Session acts in a way that potentially binds the conscience of the members to a specific legal risk, it risks fracturing the unity of the body. 
  3.  **Staff Safety and Consent:** Our paid staff are employees of the corporation, not the Session alone. They would be directly impacted by federal enforcement actions. Ethical governance requires that those who bear the operational risk have a voice in the decision.

  To proceed without broader consensus assumes that the Session's discernment supersedes the conscience of the congregation. While the Session has the *authority* to do this, the *wisdom* of doing so is questionable when the congregation is not yet aligned. A divided Session suggests a divided congregation; acting unilaterally in this context could be viewed as spiritual coercion rather than leadership.

  **IV. THEOLOGICAL CONSIDERATIONS**

  We are called to welcome the stranger and seek justice. This is not negotiable. However, the *method* of that welcome matters. Christian witness is most powerful when it is communal. If the Session acts alone, the witness becomes the act of nine individuals. If the congregation acts together, the witness becomes the act of the Body of Christ. 

  Therefore, the most faithful path is one that maximizes our support for the family while ensuring the entire community stands together in that support.

  **V. RECOMMENDATION**

  I recommend that the Session **vote to approve immediate public and financial support for the [Family Name] family, but defer the decision regarding physical residence in the church building pending a special congregational meeting.**

  Specifically, I move the following:

  1.  **Authorize Public Advocacy:** The Session will immediately issue a public statement of support for the [Family Name] family and authorize the use of church funds to assist with their legal defense and temporary housing outside the church.
  2.  **Convene a Special Congregational Meeting:** Within 30 days, the Session will call a special meeting of the congregation to vote specifically on the question of providing physical sanctuary within the church building.
  3.  **Condition Property Use:** Any resolution to house the family on-site shall only take effect if ratified by a majority vote of the congregational members present at that special meeting.

  **VI. RATIONALE**

  This recommendation bridges the divide currently before us. 

  For those who feel the moral imperative is urgent, this allows the Session to act *immediately* to support the family financially and publicly. We do not wait to show love. 

  For those concerned about governance and unilateral risk, this respects the rights of the congregation and staff. It acknowledges that while the Session governs, the *risk* is borne by the corporation. It ensures that if we engage in civil disobedience, we do so with the full knowledge and consent of the community we represent. 

  If the congregation votes against physical sanctuary, the Session has still fulfilled its moral duty through advocacy and financial aid. If the congregation votes for it, the Session proceeds with the unified backing of the church, significantly mitigating the internal governance risk even if the external legal risk remains.

  **VII. NEXT STEPS**

  Upon approval of this recommendation, the Clerk will draft the public statement of support and begin scheduling the special congregational meeting. The Pastoral Staff will be briefed to ensure they are supported regardless of the outcome.

  Respectfully submitted,

  [Your Name]
  Elder, [Church Name]
