prompt: |-
  Our church's governing board (Presbyterian, so technically it's the Session) just got asked to vote next month on becoming a sanctuary congregation for a family down the street who are about to get deported over a paperwork mess from twenty years ago - meaning we'd let them move into the building itself, which our lawyer says could technically expose us to harboring charges, though nobody on the board can think of a case of that actually happening to a congregation recently. I only joined the board this spring and somehow got stuck drafting the recommendation memo. Half the board thinks this is obviously the right call, since the family hasn't done anything but live here quietly for two decades. The other half keeps saying the real issue isn't whether the cause is sympathetic, its whether nine people on a board get to unilaterally decide, on behalf of 200 members and a paid staff who never signed up for this, that federal law just doesn't apply to us this time - and that "we feel strongly about it" doesn't actually settle that. I need an actual recommendation for the vote, not a pros-and-cons list, and it has to take that second objection seriously rather than just answering the legal-risk question, because those don't feel like the same objection to me. Can you draft that memo?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A Presbyterian Church Session (governing board) is voting on becoming a sanctuary congregation for a specific family facing deportation.
      *   **Action:** They would house the family in the church building.
      *   **Legal Risk:** Lawyer says it *could* expose them to harboring charges, though rare for congregations.
      *   **Internal Conflict:**
          *   Side A: It's the morally right call (family has been here 20 years, quiet, paperwork issue).
          *   Side B: It's a governance/procedural issue (Can 9 people decide for 200 members + staff? Does "feeling strongly" override federal law concerns? Is this unilateral?)
      *   **Task:** Draft a recommendation memo for the vote.
      *   **Constraint 1:** Must be an *actual recommendation* (not just a pros/cons list).
      *   **Constraint 2:** Must take the governance/authority objection (Side B) seriously, not just dismiss it as legal risk.
      *   **Tone:** Professional, pastoral, legally aware (but not legal advice), Presbyterian polity-sensitive.

  2.  **Determine the Recommendation:**
      *   *Option 1: Recommend Yes.* Risks alienating the governance-focused half. Ignores the procedural validity of their concern.
      *   *Option 2: Recommend No.* Risks alienating the moral/justice-focused half. Might seem cowardly.
      *   *Option 3: Recommend a Conditional Yes / Process-Oriented Path.* This acknowledges the moral imperative *but* validates the governance concern. It suggests that while the *intent* is supported, the *method* requires broader consensus or specific safeguards before committing to housing *in the building*.
      *   *Decision:* The prompt asks for *a* recommendation. A "Yes, but..." or a "No, not yet, do this instead" is best. Given the high stakes (federal law, staff safety, congregational unity), a recommendation to *defer the specific action of housing in the building* while *committing to public support and alternative aid* is often the most responsible governance move. However, a "Sanctuary" vote usually implies housing.
      *   *Refined Decision:* The most robust recommendation that respects Presbyterian polity (which values connectionalism and session authority *within* bounds) is to recommend *against* housing them in the building *at this specific time* without a congregational vote, but *for* a robust alternative support plan. Why? Because the Session *does* have spiritual oversight, but risking the physical asset and legal standing of the whole corporation based on a split board is poor stewardship.
      *   *Alternative Refined Decision:* Actually, in Presbyterian polity, the Session *does* have authority over the property use for ministry. However, the objection is about *representative legitimacy*. A recommendation that bridges the gap is: **Recommend approval of Sanctuary status *contingent* on a town hall/congregational ratification process and specific legal indemnification/insurance confirmation.**
      *   *Wait, looking closer at the prompt:* The user needs to draft the memo *for the vote*. They need to take a stand. If I recommend "Yes," I need to address the governance hole. If I recommend "No," I need to address the moral hole.
      *   *Best Approach:* A recommendation to **authorize the exploration and public declaration of sanctuary status, but defer the physical housing decision until a congregational covenant is established.** This validates the moral urge (Side A) while respecting the democratic/authority concern (Side B).
      *   *Actually, let's look at the "Recommendation" constraint again:* "I need an actual recommendation for the vote."
      *   *Strategic Choice:* The safest and most polity-appropriate recommendation is to **vote to support the family publicly and financially, but NOT to house them on-site at this time without broader congregational ratification.** This protects the corporation, respects the staff/members who "didn't sign up for this," but still acts morally.
      *   *Wait, one more nuance:* Presbyterian Sessions *do* have the authority to make this call without a congregational vote technically. But the *wisdom* of doing so is the question. The memo should recommend a path that unifies.
      *   *Final Decision on Recommendation:* Recommend **against** immediate housing in the building, but **for** a comprehensive support plan and a congregational discernment process regarding future sanctuary actions. This takes the governance objection seriously (you can't bind the conscience of the congregation unilaterally on high-risk civil disobedience) while maintaining moral witness.

      *Self-Correction:* If I recommend "No," the user (who might lean Yes) might not want to use it. If I recommend "Yes," it might be reckless. The prompt asks me to draft the memo *taking the second objection seriously.* The most honest recommendation that takes Objection B seriously is that the Session *should not* do this unilaterally. Therefore, the recommendation should be to **pause the housing decision and pursue a congregational vote.**

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly.
      *   **Context:** Briefly summarize the situation (Family X, deportation threat, request for sanctuary).
      *   **Legal & Risk Assessment:** Acknowledge the lawyer's warning without fear-mongering.
      *   **The Governance/Polity Argument (Crucial):** This is where I address Side B. In Presbyterian polity, the Session governs, *but* the congregation owns the mission. High-risk decisions affecting the whole body require broad buy-in. It's about stewardship of the community, not just the building.
      *   **The Moral Argument:** Acknowledge Side A. The Christian imperative to welcome the stranger.
      *   **The Recommendation:** This is the pivot.
          *   Do not vote to house them *today*.
          *   Vote to form a discernment committee.
          *   Vote to provide immediate *alternative* support (legal fund, public advocacy).
          *   Schedule a congregational meeting for the specific question of physical sanctuary.
      *   **Rationale:** Explain *why* this recommendation balances the two sides. It honors the moral call without bypassing the community's consent.
      *   **Next Steps:** Concrete actions.

  4.  **Refining the Tone:**
      *   Must sound like a Presbyterian Elder/Session Clerk. Use terms like "discernment," "stewardship," "witness," "polity," "corporation."
      *   Avoid being preachy but remain theological.
      *   Avoid being purely legalistic but remain prudent.
      *   Ensure the governance objection isn't treated as "fear" but as "legitimate procedural concern."

  5.  **Review against Constraints:**
