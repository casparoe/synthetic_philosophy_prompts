  The leather of the ledger was worn smooth at the corners, stained with coffee rings and the oils of Arthur's thumb. He sat at the kitchen table, the morning light cutting across the grain of the wood, his pen hovering over a fresh page. He wasn't writing a memory; he was logging a fact. *Gas bill paid. 14th.*

  His son, David, leaned against the counter, arms crossed. He'd been watching Arthur for ten minutes.

  "You don't have to watch me write," Arthur said, without looking up.

  "I'm not watching you write. I'm watching you think."

  Arthur capped the pen. "I'm recording. There's a difference."

  "Is there?" David pushed off the counter and pulled out a chair. "You looked up the date. You didn't retrieve it. You accessed a file. If the server goes down, the data is gone. That's not memory, Dad. That's storage."

  Sarah, Arthur's daughter, walked in with a mug of tea. She set it near Arthur's hand. "He knows the date because he knows where to look. It's always there. It's reliable. Isn't that what memory is? Reliable access to information?"

  David shook his head. "It's what *having* information looks like from the outside. But internally? Nothing changed in his brain when he wrote that down except the motor memory of moving his hand. The book is coupled to his cognition, sure. It interacts with it. But that doesn't mean the book is *part* of his cognition."

  Arthur rubbed his temples. This argument had been circling them for months, ever since the diagnosis settled like dust over the house. "David, please."

  "I'm just saying," David continued, his voice tight but not unkind. "If I lean on a cane, I can walk across the room. The cane is coupled to my balance. But if you take the cane, I fall. The cane isn't my leg. Just because you rely on the ledger doesn't mean the ledger is your mind. It's a crutch. Relying on something isn't the same as being it."

  Sarah sighed, leaning against the fridge. "That's the coupling-constitution fallacy, David. You're confusing causal interaction with constitutive parts. If he trusts the book, if it's always available, and he endorses what's in it automatically... philosophically, that functions as memory."

  "Philosophically," David echoed. "But practically? If I ask you who the president was in 1990, and you have to look it up, do you *know* it? Or do you just know how to find it?"

  Arthur looked at the ledger. The ink was still wet on *14th*. He tried to summon the feeling of paying the bill. The click of the pen on the website. The confirmation email. But those were ephemeral. The only solid thing was the black book.

  "It feels like memory," Arthur said quietly.

  "Does it?" David tapped the cover. "Or does it feel like reading? When you read a novel, you know the plot. But you don't claim the book's pages are your brain tissue. You're outsourcing the retention. I'm worried that if we call this 'your memory,' we stop fighting for what's actually left inside your head. We let the disease win by redefining the battlefield."

  Arthur felt a cold friction in his chest. Was he preserving himself, or just curating a museum of a person who used to be there? He flipped back a few pages. *Dentist appointment. March 4. Sarah's birthday. Bring flowers.*

  "I bought the flowers," Arthur said. "I remembered to buy them."

  "You remembered to check the book," David corrected. "And the book told you to buy flowers. Who remembered the birthday? You? Or the guy who wrote the note three months ago?"

  "That's enough," Sarah snapped.

  "No, it's important," David said, looking at Arthur. "If the book is you, then when you lose the book, you lose yourself. But if the book is a tool, then you're still in there, even if you can't reach the tools. I don't want you to be the book, Dad. I want you to be you."

  Arthur looked at his hands. They were spotted with age, trembling slightly. He looked at the ledger, stable and black and full of ink. He thought about the feeling of waking up this morning. The panic of the blank slate, the relief of the open page. Was that relief the restoration of a mind, or just the comfort of a prosthesis?

  He picked up the pen again. He wanted to write something true, something that couldn't be looked up. *I love my children.*

  But he hesitated. If he wrote it, was it a reminder? If he didn't write it, would he forget it? If the feeling existed only while he was writing it, did it exist at all?

  "I don't know where I end," Arthur said, his voice barely audible.

  David softened, reaching out to touch the ledger, then pulling back. "That's the problem. We need to know."

  Arthur uncapped the pen. He hovered over the paper. The ink pooled at the tip, threatening to drop, a dark star waiting to collapse. He didn't write. He just held the pen there, suspended between the hand and the page, unsure if the thought belonged to the flesh or the ink.
