answer: |-
  Good morning. Welcome.

  For thirty years, I held a soldering iron and a micromanipulator like they were weapons in a war against vagueness. I ran a lab dedicated to a hunt that many of my colleagues thought was quixotic, and some thought was category error. We were looking for specificity. We wanted to know if the brain, that wet, noisy, distributed mush, actually carved the world at its joints.

  We were hunting for what the skeptics called the "grandmother cell." The name was coined half in jest by Jerry Lettvin in the sixties, intended as a *reductio ad absurdum*. The idea that a single neuron would fire only for your grandmother, and nothing else, seemed biologically profligate. It seemed like a homunculus trap. I was one of the loudest skeptics. I believed in populations. I believed in rate codes. I believed that meaning was a chorus, not a soloist.

  And then, the data started to come in. Not from rats, but from humans. Epilepsy patients with electrodes implanted deep in their medial temporal lobes. And there they were. "Concept cells." A neuron that fired for Jennifer Aniston, but not Brad Pitt. The same neuron firing for the *name* "Jennifer Aniston" printed in text. A neuron for the Sydney Opera House, invariant to angle and lighting.

  I spent three decades trying to prove these things were statistical artifacts. They weren't. But I retired before I could reconcile what they *were*.

  I mention this history because I see a mirror image of my old lab in this room. On my left, I see the mechanistic interpretability researchers. You are not sticking electrodes into human hippocampi; you are probing activation spaces in transformer models. You are finding directions in vector space that correspond to "truthfulness," or "code," or, as one recent paper celebrated, a "Golden Gate Bridge feature." You are doing the work I used to do, but with systems that are legible in ways the brain never will be.

  On my right, I see the philosophers. You are watching these engineers name these features, and you are asking the question I was too busy to ask until I hung up my lab coat: When you name that feature, are you discovering a natural kind, or are you projecting a grid?

  The temptation in a workshop like this is to dissolve the tension. It is very easy to say, "Well, this is just a semantic dispute. It's merely verbal. As long as the model works, who cares if the feature is 'real'?"

  I am here to tell you, based on thirty years of watching a field wrestle with this exact ghost, that it is not merely verbal. It matters.

  If the "Golden Gate Bridge feature" is a real, robust component of the model's computational machinery, then we can intervene on it. We can edit it. We can expect it to generalize to new contexts. We can build safety mechanisms that rely on its stability.

  But if that feature is a projection—a convenient story we tell to make sense of a high-dimensional soup that doesn't actually respect our boundaries—then our interventions will be brittle. Our safety guarantees will be illusions. Our "understanding" will be a map that fits the territory only as long as we don't try to walk on it.

  So, we cannot file this under "not my problem." The engineers cannot say, "We just build," because what you think you are building dictates how you test it. And the philosophers cannot say, "This is just folk psychology applied to math," because the math has constraints that are unforgivingly physical.

  For the last few years, since leaving the lab, I have been reading the literature you all have been living in. Specifically, I have become attached to Daniel Dennett's notion of "Real Patterns."

  Dennett suggests a middle ground between hard realism and hard instrumentalism. He argues that a pattern is "real" if it supports reliable predictions and offers compression, even if that pattern is not written into the fundamental physics of the substrate. A storm is real. You can't find a "storm particle" in the Standard Model. But if you try to predict the weather by tracking every individual air molecule, you will fail. The pattern of the storm is real because it buys you explanatory power that the micro-level does not.

  I propose that this is the ground on which we meet.

  To the engineers: Dennett's view validates your work, but it raises the bar. Finding a feature that correlates with "Golden Gate Bridge" images is a start. But to claim that feature is a *Real Pattern*, you must show that it supports counterfactuals. If you perturb this direction, does the model's behavior change in predictable ways across *different* contexts? Does the pattern hold when the input distribution shifts? If the feature disappears when you change the random seed of the training run, it might be a real pattern of *that specific training history*, but is it a real pattern of the *architecture*? You need to test the robustness of the ontology you are building.

  To the philosophers: Dennett's view demands you get your hands dirty. You cannot decide what counts as a "Real Pattern" from the armchair. The criteria for reality here are empirical. It is not enough to argue about the definition of representation. You need to look at the loss landscapes. You need to understand why polysemanticity happens. If a neuron fires for both "dogs" and "cats," is that a failure of the model, or is it a real pattern of efficiency that our human taxonomy doesn't capture? If you ignore the mechanistic details, your ontology will be empty.

  This workshop is not about resolving the debate. I don't think we will resolve it by Tuesday afternoon. My old lab never fully resolved the status of the concept cell. But we made progress by acknowledging that the question itself drove the experimental design.

  We are here to interrogate the status of the "feature."

  When an interpretability researcher says, "I found the deception circuit," they are making an ontological claim. They are saying, "There is a thing here, distinct from the noise, that does the work of lying."

  When a philosopher asks, "Is deception a coherent category in a system without beliefs?" they are not being pedantic. They are asking if the engineer has drawn a constellation around stars that don't actually align.

  If we accept the "Real Patterns" view, we accept that the features are real *relative to the stance we take*. But—and this is the crucial part—some stances are objectively better than others. The intentional stance works for humans because it predicts behavior better than the physical stance. The feature stance must work for LLMs because it predicts loss and generalization better than the weight-matrix stance.

  My hope for this workshop is that we stop treating the "discovery vs. projection" dichotomy as a binary. It is a spectrum of stability.

  I want the engineers to leave here asking better questions about *why* their features generalize. Not just "Does it work?" but "What kind of reality does this feature have?"

  I want the philosophers to leave here asking better questions about *where* the constraints lie. Not just "Can this be representation?" but "Given the geometry of this space, what representations are even possible?"

  Thirty years ago, I thought the grandmother cell was a joke. Then I saw the data. Now, I think the joke was on us for assuming that "real" had to mean "reducible to a single switch."

  The brain, and now these models, are telling us that reality is layered. A feature can be fuzzy, distributed, and context-dependent, and still be real enough to cut with. But we need to agree on how sharp the knife needs to be before we call it a discovery.

  We are not just mapping a territory; we are negotiating the laws of physics for a new kind of mind. Let's make sure we aren't just drawing constellations in the dark. Let's find out if the stars are actually connected.

  Thank you. Let's begin.
