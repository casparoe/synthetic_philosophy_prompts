      *   *Check:* Did I address the "trust people who know more" part? Yes, need to explain why that heuristic works for facts but fails for ethics.
      *   *Key Insight:* Facts are about *what is*. Ethics is about *what to do*. You can't "do" based on someone else's reasoning without adopting their reasoning.

  7.  **Final Polish:** Ensure the distinction between "knowing that" (propositional knowledge) and "knowing how" (procedural/moral knowledge) is clear. (Decided to frame it as "Knowledge vs. Conviction").

  8.  *(Final check against constraints)*: User wants a real answer, not "think for yourself." I need to explain *why* thinking for yourself is structurally necessary for ethics in a way it isn't for history dates.

