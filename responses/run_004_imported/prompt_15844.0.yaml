answer: |-
  You are not overthinking this. You have stumbled onto a genuine philosophical distinction that ethicists and epistemologists (people who study knowledge) actually debate.

  The short answer is: **Yes, there is a fundamental structural difference between accepting a fact on authority and accepting a moral value on authority.**

  It feels different to you because it *is* different. Here is the breakdown of why that is, without the "just think for yourself" platitude.

  ### 1. The Nature of the Claim: "What Is" vs. "What To Do"

  **Facts (The Treaty of Versailles):**
  When you accept a historical fact from a teacher, you are accepting a claim about reality that exists independently of you. The treaty was signed in 1919 whether you understand the geopolitical pressures of post-WWI Europe or not.
  *   **The Authority's Role:** The teacher has access to evidence you don't (archives, documents).
  *   **Your Role:** You are storing data.
  *   **The Transfer:** You can fully "own" this knowledge by trusting the source. If someone asks, "When was it signed?" and you say "1919," you are correct. The *truth* of the statement doesn't depend on your ability to argue the history.

  **Values (AI is Cheating):**
  When Priya says "Using AI is cheating," she is making a normative claim. This isn't about what *is*; it's about what *ought to be*.
  *   **The Authority's Role:** Priya has done the reasoning to connect a specific action (using AI) to a principle (academic integrity/fairness).
  *   **Your Role:** You are being asked to adopt a *rule for behavior*.
  *   **The Transfer:** You cannot fully "own" a moral rule without the reasoning behind it. Why? Because moral rules are tools for decision-making, not just data points.

  ### 2. The "Edge Case" Problem

  This is the practical reason why your embarrassment with Jake was justified.

  **Facts are static.**
  If Jake asks, "Was it 1919 or 1920?" you can stick to "1919." You don't need to derive the date yourself. The fact doesn't change based on the conversation.

  **Ethics are applied.**
  Ethics is a framework for handling situations, especially *new* ones.
  *   If you only know Priya's *conclusion* ("AI is bad"), you are stuck the moment the situation changes slightly.
  *   *Jake:* "Okay, but what about using Grammarly?"
  *   *You:* "Uh... Priya didn't mention Grammarly."
  *   *Jake:* "What if you use AI to outline, but write the sentences?"
  *   *You:* "I don't know."

  If you understood Priya's *reasoning* (e.g., "The point of the essay is to demonstrate your own critical thinking process"), you could answer those questions. You could evaluate Grammarly (it fixes errors, doesn't think for you) vs. AI (it thinks for you).

  By accepting the moral conclusion without the reasoning, you have a **rule without a compass.** You know where to stand right now, but you don't know how to navigate if the ground shifts.

  ### 3. Moral Autonomy vs. Cognitive Division of Labor

  Society runs on a "division of cognitive labor." We trust mechanics on cars and doctors on viruses because we can't be experts in everything. This works for facts because the *outcome* is what matters (the car gets fixed, the virus gets cured).

  In ethics, the *agency* is what matters.
  Philosophers like Immanuel Kant argued that for an action to have moral worth, it must come from your own rational will (autonomy), not just obedience (heteronomy).

  *   **Scenario A:** You don't use AI because you understand it undermines your learning.
  *   **Scenario B:** You don't use AI because Priya said so.

  In Scenario B, you aren't acting ethically; you are acting obediently. If Priya wasn't around, or if Priya changed her mind, your moral stance would vanish. That's why it doesn't feel like "your" opinion. It's borrowed clothing. It fits Priya, but it's loose on you.

  ### 4. Why Priya Was Right (Even if you didn't get it yet)

  Priya's comment—"if you can't explain why something's wrong yourself then you don't really believe it"—is a classic Socratic idea.

  Belief, in a moral context, isn't just assenting to a sentence. It's holding a conviction that is tied to a justification.
  *   **Fact Belief:** "I believe X is true." (Can be based on trust).
  *   **Moral Belief:** "I believe X is wrong *because* it violates Y principle." (Must be based on understanding).

  If you strip away the "because," the moral belief loses its force. That's why you felt embarrassed with Jake. You realized you were holding a shell of an opinion without the substance inside.

  ### So, what do you do with this?

  You don't have to become a philosophy major to fix this. You just need to convert the "borrowed opinion" into a "tested opinion."

  1.  **Interrogate the Authority:** Go back to Priya. Say, "Hey, Jake asked me why AI is cheating and I realized I couldn't explain it. What's the core principle for you? Is it about fairness? Learning? Authenticity?"
  2.  **Stress Test It:** Once you have her reasoning, see if you agree with *that*.
      *   If she says "It's about learning," do you agree that learning is the goal of college?
      *   If she says "It's about fairness," do you think AI access is unequal?
  3.  **Claim It:** If her reasoning makes sense to you, *then* it becomes your opinion. Now, when Jake asks, you don't say "Priya said so." You say, "I think it bypasses the critical thinking process the assignment is designed to measure."

  **Summary:**
  Taking someone's word on a **fact** is efficient; you are outsourcing verification.
  Taking someone's word on a **value** is risky; you are outsourcing your judgment.

  You felt that friction because you realized you were trying to outsource your judgment, and deep down, you know that judgment is the one thing you actually have to do yourself.
