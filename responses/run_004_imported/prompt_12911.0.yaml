  **Can Devon's opening idea be saved?**

  Claire basically takes the whole thing regarding **rational policy**, though Devon retains a foothold in **metaphysical externalism**.

  There is no non-circular way for Ray to save the *advice* ("I should ignore the article") because doing so requires him to certify he has "knowledge" rather than "belief" without using the very evidence he plans to ignore. This is the heart of the Paradox of Dogmatism: if you must check the evidence to confirm you know, you aren't ignoring it; if you ignore it to confirm you know, you are begging the question.

  However, an **externalist** might argue Devon is right in retrospect: if Ray *actually* has a reliable process (Deke really is winning via skill, not luck), then Ray *is* justified in ignoring the article, even if he can't prove it internally. But this doesn't help Ray decide what to do at the table; it only means he might get lucky and be right despite using a flawed decision procedure. For anyone trying to figure out how to act rationally, Claire's objection stands: you cannot use your current confidence to immunize yourself against future evidence without risking dogmatism.
