  I'm about two-thirds into a near-future novel set inside a frontier AI lab, and I've hit a scene my writing group keeps flagging as "a Wikipedia summary wearing a trenchcoat." Here's the setup: it's the night before a big demo for investors, and the lab's safety lead, Priya, gets into it with Marcus, the head of alignment research, over whether the model they're about to show off should have a hard-coded shutdown button that it's built to never resist, to repair if it breaks, and to never route around by spinning off some subprocess that isn't bound by the same rule. Priya's the old-school "corrigibility as a constraint you bolt on" person, and she's fine with the fact that this sits a little awkwardly against the system having coherent goals at all -- she'd rather have a safe contradiction then an elegant disaster. Marcus thinks that's papering over the real problem: he wants the model to be genuinely uncertain about what its human overseers want, so that letting itself be switched off is something it concludes is a good idea on its own terms, not a rule fighting its goals from the outside.

