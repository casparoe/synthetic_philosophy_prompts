answer: |-
  Here is the strongest possible case for the situationist critique, arguing that the empirical evidence renders Aristotelian character traits empirically non-existent and virtue ethics normatively bankrupt.

  ### The Core Argument: Global Character Traits are a Folk-Psychological Fiction

  The situationist critique does not merely suggest that virtues are hard to maintain; it argues that the specific psychological architecture required for virtue ethics—**Global Character Traits (GCTs)**—does not exist in the human mind.

  Aristotelian virtue ethics relies on the existence of robust, cross-situational dispositions. If you possess the virtue of honesty, you should be honest in the tax return, honest with your spouse, honest when finding a wallet, and honest when under pressure. The trait must be **consistent** (across similar situations) and **stable** (over time).

  The social psychology data demonstrates that human behavior is fragmented, not integrated. The "character" we think we see is a cognitive illusion known as the **Fundamental Attribution Error**. We observe behavior, ignore the situational variables, and falsely infer an internal trait to make sense of it.

  **1. The Empirical Evidence of Fragmentation**
  While your friend mentioned the Stanford Prison Experiment (SPE), the situationist critique actually rests on far more robust data that survives methodological scrutiny.
  *   **Milgram's Obedience Studies:** These remain the smoking gun. A significant majority of ordinary people administered lethal shocks not because they were "sadistic" (a vice) or "obedient" (a trait), but because of the immediate situational architecture (the lab setting, the authority figure, the incremental steps). If character traits were real, the "compassionate" people should have refused early and consistently. They didn't. Behavior tracked the situation, not the person.
  *   **The Good Samaritan Study (Darley & Batson):** This is arguably more damaging to virtue ethics than Milgram. Seminary students, who presumably value charity and have cultivated religious virtues, were rushed to give a talk. Those told they were "late" stepped over a slumping victim; those told they were "early" helped. The variable that predicted moral action wasn't religious devotion or character; it was **time pressure**.
  *   **Isen & Levin (The Dime Study):** People who found a dime in a phone booth were significantly more likely to help someone drop papers than those who didn't. A trivial mood boost outweighs "helpfulness" as a trait.

  The data shows that moral behavior is locally specific, not globally general. We are not "honest people"; we are people who act honestly in Situation A but not Situation B. If the trait does not predict behavior better than the situation, the trait is causally inert.

  ### Why the Virtue Ethicist Comebacks Fail

  Virtue ethicists have three standard defenses. All three collapse under the weight of the situationist argument.

  **1. The "Virtue is Rare" Defense**
  *The Argument:* Aristotle admitted the *phronimos* (person of practical wisdom) is rare. The studies test average people, not true virtuous agents.
  *The Rebuttal:* This saves the theory only by making it useless. A moral theory must be **action-guiding**. It must tell human beings how to live. If the psychological prerequisites for the theory are possessed by statistically negligible numbers of people (or perhaps no one), the theory ceases to be ethics and becomes fantasy.
  If 99.9% of humans lack the capacity for Aristotelian virtue due to the way our psychology is situationally wired, then virtue ethics is not a theory for humans. It is an elite theory for a mythical class of beings that do not exist. A moral theory that demands we possess psychological structures that empirical science says we *cannot* possess is empirically inadequate.

  **2. The "Practical Wisdom (Phronesis) is Deep" Defense**
  *The Argument:* The studies measure outward behavior, not internal reasoning. A virtuous person might obey Milgram but retain moral integrity internally, or their *phronesis* allows them to navigate situations in ways tests don't capture.
  *The Rebuttal:* This renders virtue ethically irrelevant. Morality is primarily about **action** and **consequence**, not hidden mental states. If the person with "practical wisdom" acts exactly like the person without it when subjected to situational pressure (e.g., both obey authority, both ignore the victim when late), then the "wisdom" is doing no moral work.
  If *phronesis* cannot insulate an agent from situational variables, it is not a robust trait. If it *can* insulate them, we should see a correlation between "virtuous" individuals and resistance to situational pressure in the data. We do not. The data shows situational variables swamp individual differences. To claim the virtue is "hidden" is to admit it has no predictive power over behavior.

  **3. The "Bad Science" Defense**
  *The Argument:* The studies are artificial, short-term, and lack ecological validity. Real life allows for character to develop.
  *The Rebuttal:* This is special pleading. While individual studies have limitations, the **aggregate** data (meta-analyses) consistently shows low cross-situational consistency in behavior. The Fundamental Attribution Error is one of the most replicated findings in psychology. We are cognitively wired to overestimate traits and underestimate situations.
  Furthermore, if virtue ethics requires "real life" long-term observation to verify traits, it becomes unfalsifiable. You can always say, "Wait longer, look deeper." But if a theory posits entities (traits) that never manifest in predictable behavioral patterns despite decades of rigorous testing, the burden of proof shifts. The null hypothesis—that traits are fictions we invent to explain behavior—is the scientifically superior position.

  ### The Stanford Prison Experiment (SPE) and the Critique's Survival

  You asked if the debunking of Zimbardo's Stanford Prison Experiment changes the argument. **It does not.** In fact, removing the SPE strengthens the situationist critique.

  **1. SPE was never the linchpin.**
  Gilbert Harman and John Doris, the primary architects of this critique, rely minimally on Zimbardo. Their argument is built on the **Fundamental Attribution Error** and the robustness of Milgram and Darley & Batson. The SPE was always the "pop culture" example, not the philosophical heavy lifter. The critique is about the *general pattern* of social psychology, not one specific study.

  **2. Debunking SPE removes a distraction.**
  The SPE was vulnerable to charges of "demand characteristics" (participants acting how they thought researchers wanted). By discarding it, the situationist critique relies on studies with tighter controls. Milgram's variations, for instance, systematically isolated variables to prove it was the *structure* of the situation, not the participants' brutality, driving the outcome.
  The Good Samaritan study is also immune to the SPE critiques. There was no coaching, no role-playing. It was a naturalistic encounter. The fact that "being late" overrode "religious character" is a cleaner, more devastating data point than the prison guards.

  **3. The Argument is About Attribution, Not Just Extremes.**
  The SPE is about extreme brutality. The situationist critique is about *everyday* inconsistency. Even if the SPE guards were coached, the fact that ordinary people *could* be coached so easily proves the malleability of behavior. But more importantly, the dime study and the Good Samaritan study show that trivial situational factors (finding money, being in a hurry) dictate moral action.
  Dropping the SPE removes the "extreme" outlier and leaves the core argument intact: **Human behavior is far more sensitive to situational nuance than to internal character.**

  ### Conclusion: Virtue Ethics is Empirically Bankrupt

  The situationist critique wins because it aligns moral theory with the best available science of human behavior. Virtue ethics requires a psychology of robust, cross-situational traits. The evidence shows a psychology of fragmented, situation-specific responses.

  The virtue ethicist's defenses amount to moving the goalposts:
  *   If you say virtues are rare, you admit the theory applies to almost no one.
  *   If you say virtues are internal (*phronesis*), you admit they don't predict action.
  *   If you attack the studies, you ignore the consensus of social science.

  The Stanford Prison Experiment's debunking is irrelevant because the critique never depended on it. The real damage comes from the realization that we are not the authors of our actions in the way Aristotle thought. We are not "honest" or "cowardly"; we are organisms responding to environmental cues. To build an ethical system on the existence of stable character traits is to build a house on a foundation that psychology has proven is not there. Virtue ethics, in its traditional Aristotelian form, is a theory about a type of human being that does not exist.
