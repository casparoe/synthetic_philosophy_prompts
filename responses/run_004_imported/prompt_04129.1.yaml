prompt: |-
  So we just wrapped up the social psychology unit in AP Psych (Milgram's obedience experiments, the Stanford Prison Experiment, the fundamental attribution error, all of that), and my friend Dev, who's kind of obsessed with philosophy, told me people actually use this stuff as a real academic argument against virtue ethics. Apparently its called the "situationist critique" and the big names are John Doris and Gilbert Harman. The way Dev explained it: virtue ethics needs people to have stable character traits like honesty or courage that hold up across different situations, but the psych research supposedly shows behavior depends way more on the situation than on any consistent trait, so "character" in the Aristotle sense might not really be a thing.

  I went and read a little more on my own afterward and it seems like virtue ethicists have a few comeback moves, like saying genuine virtue is rare so of course random test subjects don't have it, or that the studies don't actually measure "practical wisdom" which is supposedly what really matters, or just attacking the studies themselves as weaker than people think. Also, kind of funny, I seperately found out the Stanford Prison Experiment specifically has gotten pretty thoroughly debunked in the last few years (the guards were basically coached to act brutal, one guy's breakdown was staged, etc), which made me wonder if pulling that one study out changes the whole argument or not.

  Can you actually make the strongest possible case that the situationist critique wins, i.e. that it genuinely shows Aristotelian-style character traits aren't real and virtue ethics is in real trouble, and specifically explain why those standard virtue-ethicist comebacks don't actually save the theory? Also, can you weigh in on whether the argument survives losing the Zimbardo study, or if that study was never really doing much of the actual philosophical work anyway? Please don't give me the "eh, both sides have some good points" answer, I want the actual strongest version of the case for the critique.
