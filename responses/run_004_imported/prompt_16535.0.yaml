      *   *Focus:* The distinction between Calibration (epistemic) and Error Balance (distributive). Rawls is a distributive justice theorist. He cares about the distribution of primary goods (liberty). Error rates distribute the "bad" of wrongful detention. Calibration distributes the "meaning" of information. Liberty trumps information consistency.

