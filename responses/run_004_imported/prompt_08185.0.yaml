prompt: |-
  I took a theory of computation class back in college where the Church-Turing thesis basically got taught as settled fact -- "anything computable by an algorithm can be computed by a Turing machine, full stop." Recently I fell down a rabbit hole of logicians and philosophers insisting this thing can never actually be proven, only supported by evidence. That kind of throws me off, because isn't "computable function" pretty much just defined to mean "Turing-machine computable" at this point? If so what's actually left to be uncertain about? Can you explain what kind of claim the thesis really is, why it resists a real proof the way an actual theorem wouldnt, and what would even count as evidence for or against it?
