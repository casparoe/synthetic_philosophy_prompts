answer: |-
  This is one of the most subtle and frequently misunderstood points in theoretical computer science. You are absolutely right to feel conflicted, because the status of the Church-Turing Thesis (CTT) shifts depending on whether you are doing **math** or **philosophy of mind/physics**.

  In your college class, you were taught the **mathematician's pragmatic view**: "We define 'computable' as 'Turing-computable' because it works, so let's move on."
  The logicians and philosophers you encountered are holding the **meta-mathematical view**: "Wait, you're claiming this formal definition matches a vague human intuition. How do you know?"

  Here is the breakdown of what the thesis actually claims, why it cannot be proven, and what the evidence looks like.

  ### 1. The Core Confusion: Two Definitions of "Computable"

  To understand why CTT isn't a theorem, you have to realize there are two different concepts being equated.

  **Concept A: Effective Calculability (The Intuition)**
  Before 1936, mathematicians had a vague, pre-theoretic idea of what an "algorithm" or "effective method" was. It was described in natural language:
  *   It consists of a finite set of precise instructions.
  *   It requires no insight or creativity to execute (a "clerk" could do it).
  *   It produces a result in a finite number of steps.
  *   **Crucially:** This concept is *informal*. It lives in human language and intuition, not in set theory.

  **Concept B: Turing Computability (The Formalism)**
  This is the mathematical model Alan Turing invented.
  *   It involves a tape, a head, a state register, and a transition table.
  *   It is rigorously defined using set theory and logic.
  *   **Crucially:** This concept is *formal*. You can write proofs about it.

  **The Church-Turing Thesis is the claim that Concept A and Concept B are co-extensive.**
  > *Thesis:* Any function that is **effectively calculable** (Intuition) is **Turing-computable** (Formalism).

  ### 2. Why It Resists Proof

  In mathematics, you prove a theorem by deriving it from axioms using rules of inference. To prove $X = Y$, both $X$ and $Y$ must be well-defined mathematical objects.

  *   **Turing Computability** is a well-defined mathematical object.
  *   **Effective Calculability** is **not**. It is a fuzzy philosophical notion.

  You cannot write a mathematical proof that connects a formal system to an informal intuition. It is like trying to prove the statement: *"The word 'Red' refers to the wavelength of light at 700nm."*
  You can measure the light, and you can define the word, but the connection between the *qualia* of seeing red and the *physics* of light is an empirical/philosophical claim, not a mathematical theorem.

  **Addressing your specific worry:**
  > *"Isn't 'computable function' pretty much just defined to mean 'Turing-machine computable' at this point?"*

  **Yes.** In modern recursion theory, "computable" is *defined* as "Turing-computable."
  However, this makes the Church-Turing Thesis a **justification for the definition**, not a theorem within the system.
  *   **The Theorem:** "The Halting Problem is undecidable." (Provable within the formalism).
  *   **The Thesis:** "The Halting Problem captures the limit of what any human or machine can actually calculate." (Not provable, because "what any human can calculate" isn't formalized).

  If the Thesis were false, it would mean our formal definition of "computable" failed to capture the real-world intuition of "algorithm." We would have to change the definition.

  ### 3. What Counts as Evidence?

  Since we can't prove it, we treat it like a scientific hypothesis. We look for converging lines of evidence.

  **Evidence For:**
  1.  **Convergence of Formalisms:** In the 1930s, three different people tried to formalize "computation" using totally different approaches:
      *   **Alan Turing:** Machines with tapes.
      *   **Alonzo Church:** Lambda calculus (function abstraction).
      *   **Kurt Gödel / Jacques Herbrand:** General Recursive Functions.
      *   **Emil Post:** Production systems.
      *   **Result:** Every single one of these formalisms defines the **exact same class of functions**. If you can compute it in Lambda Calculus, you can compute it on a Turing Machine. This suggests they all stumbled upon a fundamental "natural kind" of computation, rather than an artifact of one specific model.
  2.  **Robustness:** You can tweak the Turing Machine model wildly (add more tapes, make it non-deterministic, allow random access memory, use a 2D grid instead of a tape). None of these changes allow you to compute *new* functions; they only change the *speed*. The boundary of *what* is computable remains stable.
  3.  **Lack of Counterexamples:** For nearly 90 years, no one has ever proposed a clear, step-by-step algorithm that intuitively feels "effective" but cannot be simulated by a Turing Machine.

  **Evidence Against (Hypothetical):**
  To falsify the thesis, you would need to demonstrate **Hypercomputation**.
  1.  **The Oracle:** You produce a black box that solves the Halting Problem. You feed it code, and it reliably says "Halts" or "Loops."
  2.  **The Catch:** You must also provide the **instructions** for how *you* (or the box) do it.
      *   If you say, "I just use magic intuition," that doesn't count, because "intuition" isn't an **effective method** (it's not repeatable/verifiable by a clerk).
      *   If you say, "I use a physical machine that performs infinite steps in finite time" (a Zeno machine), you have challenged the **Physical** Church-Turing Thesis (more on that below).
      *   If you cannot write down the finite rules for how the calculation is done, it isn't an algorithm, so it doesn't falsify the thesis.

  ### 4. The "Physical" Church-Turing Thesis

  There is a subtle variation that often causes the confusion you're experiencing.

  *   **Mathematical CTT:** Concerns the equivalence of formal models and the intuitive notion of an algorithm. (Generally accepted as "true" by definition/utility).
  *   **Physical CTT:** Claims that any function that can be physically computed by a machine in our universe is Turing-computable.

  The Physical CTT is definitely **not** settled fact. It depends on the laws of physics.
  *   **Quantum Computing:** Does not break CTT. Quantum computers can be simulated by TMs (just exponentially slower). They compute the same *functions*, just faster.
  *   **Analog Computing:** If the universe allows for infinite precision in physical quantities (e.g., a voltage that can be exactly $\pi$ volts), you might be able to encode infinite information in a single physical state. This could theoretically allow hypercomputation. Most physicists suspect the universe is discrete (Planck length), which supports CTT, but we don't know for sure.
  *   **General Relativity:** Some solutions to Einstein's field equations (like Malament-Hogarth spacetimes) theoretically allow a computer to perform infinite computations while an observer waits a finite amount of time. If such spacetimes exist and are accessible, the Physical CTT is false.

  ### Summary

  Your college professor wasn't lying, but they were simplifying for the sake of the curriculum.

  1.  **Is it a theorem?** No. You cannot prove a relationship between a formal math model and an informal human intuition.
  2.  **Is it a definition?** In modern math, yes, we *define* computable as Turing-computable. But the **Thesis** is the claim that this definition is the *correct* one for capturing reality.
  3.  **Why the uncertainty?** Because "algorithm" is a philosophical concept. If tomorrow we discovered a physical process that reliably solved the Halting Problem via a repeatable mechanical procedure, the Thesis would be falsified, and we would have to expand our definition of "computation."

  The Church-Turing Thesis is best understood as a **successful scientific hypothesis that has graduated into a definition.** It was a bold claim in 1936 that has survived every stress test for 90 years, so we now treat it as axiomatic—until the universe proves us wrong.
