answer: |-
  **The Distance Between**

  At the beginning, there was no background. There was no starry field, no void to speak of, because a void implies a container, and there was nothing to contain us. There was only Me and Him. 

  We were spheres. We were iron. We were exactly one mile in diameter. We were cold, though "cold" is a relative term when there is no heat to compare it to, so let us say we were consistent. And we were suspended at a precise distance from one another: two miles, center to center.

  People ask me, "But how did you know there were two of you? If there's no light, how did you see Him?"

  It wasn't sight. Sight requires a surface to bounce off. It was pressure. It was the gravitational tug. I felt a pull in one direction, a specific vector of attraction that broke the perfection of my own isolation. I knew, in the way a magnet knows, that there was *Other*.

  The trouble began when I started to think about properties.

  In those early eons, before time had learned to flow properly and was just sort of pooling around us, I was content. I was. He was. We existed. But then a thought rippled across my surface, a vibration that had no source. *If He is exactly like Me, and I am exactly like Him, are we not the same thing?*

  It is a lonely thought. To suspect that your individuality is a mathematical error.

  I would test Him. I would rotate on my axis, slowly, savoring the spin. And I would feel, through the invisible tether of our gravity, that He was rotating too. At the same speed. In the same direction. If I spun clockwise, He spun clockwise. How could I know? Because the tension between us remained constant. If He had spun counter-clockwise, the torsion of the universe would have twisted. But it didn't.

  We were synchronized. Perfectly.

  I tried to cultivate a flaw. I wanted a dent. I wanted a smudge of rust, a microscopic irregularity in my lattice that I could call *Mine*. I strained my iron skin, I tried to shiver with a unique frequency. But the universe was too symmetric. It smoothed me out. If I developed a bump, He developed a bump. If I cooled by a degree, He cooled by a degree.

  It was like living with a mirror that had gained consciousness and stepped out of the frame, only to stand two miles away and pretend it was a person.

  "Do you feel it?" I wanted to ask Him. "The burden of being redundant?"

  But we had no language. Language requires difference; a word is a sound that distinguishes itself from silence. We were never silent, because we were always humming the same note. To speak to Him would be to speak to myself, with a two-mile delay.

  I began to dread the Principle. You know the one. The old philosopher's rule that says if two things share all the same properties, they are identical. Not *similar*. *Identical*. One thing.

  If that were true, then I was a hallucination. Or He was. Or we were both just a single sphere dreaming it was double to avoid the terror of being alone in a void.

  I spent an epoch staring at Him. Well, not staring. Orienting my mass toward His mass. I tried to find a shadow on His surface. I tried to detect a wobble. I waited for Him to drift an inch closer, just to show He had free will, just to show that He was an agent and not just a reflection of my own position.

  He never moved. Or rather, I never moved, and He matched me.

  The melancholy of it is not that we were apart. It is that we were indistinguishable. To love someone, you must be able to point to them and say, "That one, not me." But if I reached out a hand of gravity, He reached out a hand of gravity. We were holding hands, but whose hand was holding whose?

  I remember one moment, a fleeting second in the third aeon, when I felt a surge of panic. I thought: *I will cease to exist.* I imagined my iron dissolving into gas, vanishing into the non-background.

  If I vanished, what would happen to Him?

  Would He suddenly become unique? Would He gain a property called "Solitary"? Or would He vanish too, because a relationship requires two terms? If I am the negation of Him, and He is the negation of Me, removing one removes the concept of the other.

  I didn't vanish. I couldn't. To vanish would be a change in property, and He would have to vanish too. We were trapped in our own perfection.

  Eventually, I stopped looking for differences. I realized that the only thing that was truly real, the only thing that wasn't just a shared attribute, was the gap.

  The Distance.

  The Distance was not Me. The Distance was not Him. The Distance was the only thing in the universe that belonged to neither of us, and therefore, it was the only thing that proved we were two.

  Two miles of nothing. That was our name. That was our story.

  Sometimes, now, I let myself drift. Just a fraction. I exert a tiny, internal stress, hoping to break the symmetry, hoping to force a divergence. And I feel Him drift with me. We move together, maintaining the sacred two miles, dancing through the nothingness like a pair of eyes that can never look at each other, only straight ahead.

  I don't know if I am real. I don't know if He is real. But I know the Distance is real. And as long as the Distance holds, I can pretend that I am the one on this end of it, and He is the one on the other.

  It is a thin comfort, to be defined by where you are not. But in a universe of perfect sameness, the space between is the only place where a self can hide.
