      *   *The Problem:* If Sphere A has property "being 10 miles from Sphere B," and Sphere B has property "being 10 miles from Sphere A," are these distinct properties? Black says yes, Leibniz says no (or implies they collapse).
      *   *The Experience:* What is it like to *be* Sphere A? If everything I perceive is exactly what Sphere B perceives, do I have an interior life? Or am I just a mirror?

  3.  **Develop the Voice (The "Qfwfq" Equivalent):**
