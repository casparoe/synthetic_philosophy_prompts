answer: |-
  This is a fantastic question. You have hit on one of the most difficult and fascinating tensions in Pascal's thought. Your friend from debate club isn't *wrong*, but they are missing the theological engine that drives Pascal's car. If you look at Pascal as a secular political theorist, he looks like a hypocrite or a cynic. If you look at him as a Christian apologist diagnosing the "fallen" human condition, his argument becomes surprisingly consistent.

  Here is how to untangle the knot between **Justice/Force**, the **Three Orders**, and his view on **Human Reason**.

  ### 1. Is Pascal a "Might Makes Right" Relativist?
  Your friend says yes. The text supports them superficially. Pascal writes:
  > *"Justice without force is powerless; force without justice is tyrannical... And thus, not being able to make what is just strong, we have made what is strong just."*

  If Pascal stopped there, he would be a Machiavellian realist. But he doesn't stop there.
  Pascal distinguishes between **True Justice** (divine, absolute, unknowable by reason alone) and **Human Justice** (laws, customs, statutes).
  *   **Human Justice:** Yes, this is relative. It changes by latitude, time, and river borders. It is based on custom and force.
  *   **True Justice:** This exists in God.

  Pascal is a relativist about *human laws*, but an absolutist about *divine truth*. His point isn't that "might makes right" in a moral sense (i.e., that power is *good*). His point is that "might makes *order*" in a practical sense. Without force, society dissolves into civil war. Since humans are too broken to agree on True Justice, we settle for Force to keep the peace.

  ### 2. Why hide the truth? (The "Noble Lie" aspect)
  This is the part that bugs you: *If the system is arbitrary, why not tell people so they can fix it?*

  This connects directly to Pascal's view of **Human Reason**. In the *Pensées*, Pascal argues that human reason is corrupted by "concupiscence" (selfish desire/original sin).
  *   **The Masses:** Most people are driven by passion and imagination, not pure reason. If you tell the average person, "The laws are arbitrary and have no divine backing," they won't become philosophical seekers of truth. They will become anarchists. They will follow their own selfish impulses, and society will collapse.
  *   **The "Clever" (The Honnête Homme):** Pascal believes the intellectually elite *should* know the truth (that laws are arbitrary). However, they should obey the laws anyway. Why? Not because the laws are holy, but because **peace is a higher temporal good than philosophical purity.**

  For Pascal, undermining the "mystique" of authority causes more suffering than obeying an unjust law. It is a tragic necessity. He isn't protecting the King; he is protecting the neighbor from the chaos that ensues when authority is questioned without a higher truth to replace it.

  ### 3. The Key: The Three Orders
  You mentioned the section on **Force, Intelligence, and Holiness**. This is the master key that unlocks the whole contradiction. Pascal divides greatness into three distinct "Orders":

  1.  **The Order of Bodies (Force):** Kings, the wealthy, the military. Their currency is power.
  2.  **The Order of Minds (Intelligence):** Scientists, philosophers, artists. Their currency is truth and knowledge.
  3.  **The Order of Charity (Holiness):** Saints, the grace of God. Their currency is divine love.

  **Pascal's Definition of Tyranny:**
  Tyranny occurs when you try to rule one Order using the rules of another.
  *   If a King (Order of Bodies) demands you respect his *opinions* on science (Order of Minds), that is tyranny.
  *   If a Philosopher (Order of Minds) demands political power because he is smart (Order of Bodies), that is tyranny.
  *   **Crucially:** If we expect Human Law (Order of Bodies/Force) to deliver Divine Justice (Order of Charity), we are confused.

  **How this solves your problem:**
  Pascal wants you to obey the Law (Order of Bodies) because it maintains physical peace. But he *does not* want you to believe the Law is Divine Truth.
  *   **The Mistake:** Thinking that because a law exists, it is *morally* right.
  *   **The Solution:** Obey the law for the sake of order, but look to God for actual Justice.

  When he says we shouldn't expose the arbitrariness of law to the masses, he is saying: "Don't confuse the Orders." The masses need the Order of Bodies to function. The wise know that the Order of Bodies is inferior to the Order of Charity, but they respect the boundary.

  ### 4. Is he inconsistent or elitist?
  **Is he inconsistent?**
  No. He is consistent within his theology.
  *   **Premise:** Humans are fallen and cannot know True Justice through reason.
  *   **Premise:** Chaos is worse than imperfect order.
  *   **Conclusion:** We must uphold imperfect order (Force/Custom) while acknowledging only God holds True Justice.
  If he urged people to overthrow customs because they are arbitrary, he would be assuming Human Reason is capable of building a better system. Pascal thinks Reason is too broken to do that.

  **Is he elitist?**
  Yes, but in a specific 17th-century Jansenist way. He believes there is a spiritual and intellectual hierarchy.
  *   The "people" need the comfort of custom and the fear of force to behave.
  *   The "wise" have the burden of knowing the truth (that custom is a lie) but must bear it quietly to prevent social collapse.
  It is a "tragic elitism." He isn't saying the wise *deserve* to rule; he's saying the wise *see* the tragedy that the masses cannot handle.

  ### 5. Connecting to Reason and Truth
  You asked if this connects to his views on reason. **Absolutely.**
  Pascal's entire philosophy rests on the limits of reason.
  *   **Descartes (his contemporary):** "I think therefore I am." Reason can build a system of truth from the ground up.
  *   **Pascal:** "The heart has its reasons which reason knows nothing of." Reason is a tool, but it is weak against human passion and sin.

  Because Reason cannot reach Ultimate Truth on its own, any society built *only* on Reason arguing about Justice will fail (endless debate). Therefore, society is built on **Custom**.
  Pascal famously says: *"Custom is the whole of equity for the very reason that it is accepted."*
  He means: Custom is the *only thing* that works as a proxy for justice, precisely because everyone accepts it. If you question the custom, you remove the only glue holding society together, and you have nothing (no Reason) to replace it with.

  ### Summary for your Class/Paper
  If you need to articulate this, here is the breakdown:

  1.  **The Diagnosis:** Human reason is too weak to agree on Absolute Justice. Therefore, human laws are arbitrary products of history and force, not divine truth.
  2.  **The Problem:** If people realize laws are arbitrary, they will stop obeying them, leading to chaos (the State of Nature).
  3.  **The Solution:** We must maintain the "mystique" of authority. We obey laws not because they are *True*, but because they are *Established*.
  4.  **The Three Orders:** This prevents tyranny. We respect Power (Order of Bodies) for the sake of peace, but we do not confuse it with Wisdom (Order of Minds) or Holiness (Order of Charity).
  5.  **Verdict:** Pascal is not a "might makes right" relativist. He is a **Christian Realist**. He believes "might" is necessary for earthly peace, but only "right" (God) can save the soul. He asks us to live in the tension between the two.

  It is bleak, as you said. But for Pascal, acknowledging the bleakness of the human condition without God is the first step toward realizing we need Grace. He wants you to see that Human Justice is a broken mirror, so you stop looking for salvation in politics and start looking for it in religion.
