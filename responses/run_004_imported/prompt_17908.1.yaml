      *   **Issue 3: Safety Knowledge.** Epistemology of safety. Can you *know* you are safe to drive if the conditions for knowledge (reliability) are compromised?
      *   **Issue 4: The "Queasy Feeling."** This is existential/phenomenological. It's the realization of the fragility of self-knowledge.

