answer: |-
  **Setting:** *A quiet corner of a university library café. Two coffee cups, one half-empty, one untouched. **David** (defending a neo-Lewisian conditional analysis) is tapping a pen on a notebook. **Elizabeth** (advocating for primitive powers) is leaning back, arms crossed.*

  **David:** Look, let's stick to the wire. Your niobium-titanium alloy. It's disposed to superconduct when cooled below ten Kelvin. That's the disposition. The Simple Conditional Analysis says: *If it were cooled below ten Kelvin, it would conduct without resistance.* You know that fails. Martin's electro-fink shows us a wire that loses the disposition the moment the cooling starts.

  **Elizabeth:** I do know. But you're acting like Lewis's 1997 patch fixed it. It didn't. It just moved the furniture.

  **David:** It didn't just move furniture, it reinforced the foundation. Lewis says we don't analyze the disposition directly. We analyze it via its *causal basis*. The wire has an intrinsic microstructure—Cooper pairs, lattice vibrations—that *is* the basis. The analysis becomes: *The wire is disposed to superconduct iff it has an intrinsic property B, such that if it were cooled and retained B, it would superconduct.* The fink removes the disposition, yes, but it can't remove the intrinsic basis *instantaneously* without a causal process. If the basis persists through the stimulation, the conditional holds.

  **Elizabeth:** But that's exactly where the fink bites harder. Imagine a "finkish absence." The wire *lacks* the Cooper pairs. It's normal resistive metal. But I have a sorcerer device—or a nanotech injector, if you prefer materials science to magic—that detects the drop in temperature. The nanosecond the wire hits ten Kelvin, the injector forces the lattice into a superconducting state. It stays that way only as long as it's cold.

  **David:** Okay, but in that case, the wire *doesn't* have the disposition initially. It acquires it.

  **Elizabeth:** Precisely. But flip it. The wire *has* the superconducting basis. The injector detects the cooling and *destroys* the Cooper pairs instantly. So, the wire is superconducting. You cool it. It does *not* superconduct because the basis vanishes at the moment of stimulation. The conditional "If cooled, it would superconduct" is false. But the disposition was there. Lewis's requirement that the basis *persist* kills the analysis. You're requiring the basis to survive the trigger, but dispositions are about what happens *because* of the trigger, not what happens if the basis survives the trigger intact.

  **David:** You're describing a finkish removal. Lewis handles that by specifying the time index. The basis must exist at time *t*, and the stimulation occurs at *t*. If something intervenes to remove the basis *at* *t*, that's an external interference. That's not a failure of the disposition; that's a mask.

  **Elizabeth:** Ah, there it is. The mask. You're retreating to masks now. Let's talk about the mask, because this is where your reductive project dies. Take the same wire. It has the intrinsic basis. The Cooper pairs are ready. But I wrap the wire in a powerful, fluctuating magnetic field. That field prevents superconductivity even below ten Kelvin. The wire is still disposed to superconduct—it's still the same alloy—but the conditional "If cooled, it would superconduct" is false.

  **David:** So we refine the antecedent. *If cooled below ten Kelvin **and** no interfering magnetic field is present...*

  **Elizabeth:** *[Leans forward]* And there's the hole. How do you specify "no interfering field" without referencing the disposition itself? What counts as "interfering"? Only something that prevents superconductivity. So your analysis reads: *The wire is disposed to superconduct iff if it were cooled and nothing prevented it from superconducting, it would superconduct.*

  **David:** That's a caricature. We define "interfering" via natural laws, not the disposition.

  **Elizabeth:** Do we? Or do we define the laws via the powers of the objects? Look, David, to list the *ceteris paribus* clauses—the "no masks" clause—you have to know exactly what would stop the manifestation. But the only thing that unifies all those stoppers is that they stop *this specific disposition*. You're defining the disposition in terms of conditions that exclude things defined by the disposition. It's circular.

  **David:** It's not circular; it's nomic. We know what breaks Cooper pairs. Thermal agitation, magnetic fields above a critical threshold, high current density. We list those as physical conditions. We don't say "nothing that stops superconductivity." We say "magnetic field strength < X." That's purely categorical.

  **Elizabeth:** Is it? Why is *that* specific magnetic field strength the cutoff? Because of the disposition's magnitude. The critical field is determined by the superconducting power of the alloy. You can't specify the "normal conditions" independently of the power you're trying to analyze. And worse, consider Bird's antidote case.

  **David:** The soluble salt that's given an antidote?

  **Elizabeth:** Same logic. Imagine a "superconductivity antidote." A particle beam that bombards the wire *as* it cools. It doesn't destroy the Cooper pairs (the basis); it just decoheres the macroscopic quantum state required for the current to flow without resistance. The basis is there. The trigger is pulled. The manifestation fails. Is the wire still disposed to superconduct?

  **David:** Intuitively, yes.

  **Elizabeth:** But the conditional is false. And here's the kicker: You can't patch this by adding "and no antidote" to the antecedent. Because for any conditional you write, I can conceive of a new mask, a new antidote, a new fink. There is no finite list of "normal conditions." The set of possible interferers is open-ended.

  **David:** We don't need a finite list. We need a *standard* of normality. In my lab, "normal conditions" means a vacuum, no external EM fields, standard gravity. If the wire fails there, it lacks the disposition. If it fails because you brought a particle accelerator into the cryostat, that's not a test of the disposition.

  **Elizabeth:** But who decides what's "standard"? You're relying on a pragmatic context to fix a metaphysical problem. You're saying the analysis works *for us*, in *our* world, with *our* expectations. But philosophy wants to know what the disposition *is*. If the truth of the conditional depends on context-sensitive "normality," then the disposition isn't reduced to the conditional. The disposition is what *determines* which conditions are relevant.

  **David:** I'm not saying the disposition *is* the conditional. I'm saying the conditional is the *truthmaker* for our ascription of the disposition.

  **Elizabeth:** No, you're saying the conditional *analyzes* the concept. If you have to appeal to "normal conditions" to save the conditional, and "normal conditions" are just "conditions where the disposition manifests," you haven't reduced the disposition to anything non-dispositional. You've just hidden the disposition inside the *ceteris paribus* clause.

  **David:** That's too strong. The causal basis is non-dispositional. The lattice structure is categorical. The conditional links that categorical base to the outcome. The mask just breaks the link.

  **Elizabeth:** But how do you identify the "categorical base" without knowing what it does? You pick out the Cooper pairs *because* they produce superconductivity. If they produced resistance, you'd call them something else. You can't point to the intrinsic property independently of its power.

  **David:** We can point to the electron wavefunction symmetry. That's categorical.

  **Elizabeth:** Symmetry with respect to what? Transformation laws. Laws of nature. And laws of nature, I argue, are grounded in the powers of objects. You're trying to stand on a rug you're pulling out from under yourself. The reason your Lewisian fix feels like it works is that you're smuggling the power back in as the "basis."

  **David:** I'm not smuggling it. I'm supervening on it. The disposition supervenes on the categorical base. The conditional analysis tells us *how* it supervenes. If the base is present, and conditions are right, the manifestation happens. That's all science requires. Why do you need this metaphysical "primitive power" stuff? It sounds like occult qualities.

  **Elizabeth:** Because science requires explanation. Why does the wire superconduct? You say: "Because if cooled, it would." That's trivial. I say: "Because it has a primitive power to superconduct." That explains *why* the conditional is true. The conditional is the evidence, not the essence. Your project tries to eliminate the power to avoid metaphysics, but you end up with a conditional that only holds if you assume the power exists to hold it together against finks and masks.

  **David:** But if I accept primitive powers, I lose the ability to analyze change. If the power is primitive, it's unanalyzable. It's a black box.

  **Elizabeth:** It's not a black box; it's a fundamental. You don't analyze charge; you measure it. You don't analyze mass; you weigh it. Dispositions are the mass of modality. You're trying to weigh mass using a ruler.

  **David:** I think the ruler works fine if you account for the wind.

  **Elizabeth:** And I think the wind is just another manifestation of mass. You'll be patching that conditional forever, David. Every time I build a better fink, you add a clause. Eventually, your conditional is so long it's useless, and you're left admitting the only thing holding the clauses together is the very power you're trying to eliminate.

  **David:** I'll take the long conditional over the occult quality. At least I know how to test the conditional.

  **Elizabeth:** And I know what makes the test possible. We're not going to agree.

  **David:** No. But pass me that sugar. It's disposed to dissolve.

  **Elizabeth:** *[Smiles]* Only if no one's wrapped it in polymer.

  **David:** Don't start.
