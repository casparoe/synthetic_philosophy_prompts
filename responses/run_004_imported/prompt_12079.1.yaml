      *   **Round 4: Circularity/Primitiveness.** Elizabeth argues that defining "normal conditions" requires knowing the disposition already. David argues for a functional definition.
      *   **Closing:** Standoff. David thinks the project is salvageable with nuance; Elizabeth thinks the nuance admits defeat.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I stick to Lewis 1997? Lewis's 1997 paper ("Dispositional Concepts and Conditional Analysis") specifically addresses Martin's fink by appealing to the *causal basis* that persists. I need to make sure David mentions the *basis*, not just the disposition.
      *   *Check:* Is Elizabeth arguing for primitive powers? Yes, she needs to emphasize that the disposition *explains* the conditional, not vice versa.
      *   *Check:* Is the example consistent? Keep it on the superconducting wire. Don't switch to salt.
      *   *Check:* Is it a real dialogue? Avoid "As you know, Bob" exposition. Make them interrupt or challenge premises.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *David:* "Look, the wire has a microstructure. That's the basis."
      *   *Elizabeth:* "But what if a sorcerer removes the microstructure the moment voltage is applied?" (Fink).
      *   *David:* "Lewis handles that. The basis must exist *at the time of stimulation*."
      *   *Elizabeth:* "Okay, what about a mask? A magnetic field stops superconductivity. The wire is still superconducting, but the conditional fails."
      *   *David:* "We add 'absence of interfering fields' to the antecedent."
