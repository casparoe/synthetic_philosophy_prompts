  3.  **Character Conception:**
      *   **Lewis-Defender (let's call him "David" - nod to Lewis, but distinct):** Analytic, precise, believes in supervenience, thinks we can save the conditional if we get the *ceteris paribus* clauses right.
      *   **Powers-Skeptic (let's call her "Elizabeth" - nod to Anscombe/Bird):** Metaphysically robust, thinks dispositions are real properties, not reducible to conditionals, frustrated by endless patching.

  4.  **Drafting - Section by Section:**

