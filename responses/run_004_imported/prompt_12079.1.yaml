  9.  **Final Polish:** (Writing the actual response based on these thoughts.) *Self-correction: Make sure the distinction between 'fink' and 'mask' is clear in the dialogue, as the user knows them.* *Ensure Lewis's specific move (the causal basis) is highlighted.*

  *(Self-Correction during final writing)*: I need to make sure David doesn't just fall back on "ceteris paribus" too easily, because Elizabeth will crush that. He needs to lean on the *intrinsic causal basis* specifically, as that was Lewis's 1997 innovation. Elizabeth needs to target the *identification* of that basis without presupposing the disposition.

