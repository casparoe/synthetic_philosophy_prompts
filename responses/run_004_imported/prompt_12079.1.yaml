          *   *Skeptic:* Anti-reductive, powers as primitive (Bird, Mumford, etc.). Focus on masks and antidotes showing reductive failure.
      *   **Constraints:** Real back-and-forth (responsive, not stapled speeches), argue over *one concrete example* throughout, no caving at the end.
