answer: |-
  **Setting:** *A quiet corner of the Harvard Faculty Club, late afternoon, 1958. The air is thick with pipe smoke and the clinking of teacups. H. L. A. Hart sits opposite Lon Fuller. The ink on their respective contributions to the Harvard Law Review is barely dry.*

  **Hart:** (Tapping his pipe against the ashtray) Lon, I must say, your response to the grudge informer case strikes me as intellectually dangerous. You propose that the German court should have declared the Nazi statute under which the husband was imprisoned to be "no law at all." It is a comforting fiction, I grant you, but a fiction nonetheless.

  **Fuller:** Comforting? Herbert, it is necessary. If we call that statute "law," we concede that legality is merely a matter of pedigree—that if a sovereign command issues from the proper office, it binds the conscience regardless of its content.

  **Hart:** It is not about binding the conscience. It is about descriptive accuracy. Within the Nazi system, that statute was valid. It was enacted according to their rules of recognition. It was enforced by their courts. To say it was not law is to confuse "law as it is" with "law as it ought to be." If we wish to punish the wife—and I agree she deserves punishment—we should do so honestly. We should pass a new statute, retroactively, stating that informing under those circumstances is now a crime.

  **Fuller:** And there lies the rub. You would have the post-war German court commit the very sin they seek to condemn. You advocate for retroactive punishment. You ask the court to say, "What you did was legal then, but we will punish you for it now." That undermines the very fabric of legality you claim to protect.

  **Hart:** I would argue it is the lesser of two evils. Retroactivity is indeed a bad thing. But pretending the Nazi statute never existed is a lie. It *did* exist. It *was* effective. By declaring it null *ab initio*, you create a confusion that haunts jurisprudence. You suggest that immoral law is automatically no law. That is a recipe for anarchy. What happens when a citizen disagrees with a tax law? Do they declare it "no law" because it is unjust?

  **Fuller:** You reduce my position to a simple test of moral content, which is not what I argue. I do not say the statute was void because it was wicked in its *ends*, but because it failed the *inner morality of law*. Law is not simply a one-way projection of authority, Herbert. It is a collaborative enterprise between ruler and ruled. To function as law, it must respect certain procedural principles: generality, publicity, non-retroactivity, clarity, and congruence between declared rule and official action.

  **Hart:** But surely you see that these principles are merely instrumental? They are conditions for efficacious rule-following. If I wish to poison my enemy, I must follow certain rules to be successful—I must not poison myself, I must ensure the dose is sufficient. Does following the "rules of poisoning" make poisoning moral? A tyrant can follow all eight canons of legality and still be a monster. If he publishes his wicked rules clearly and applies them consistently, he satisfies your "inner morality."

  **Fuller:** That is a profound misunderstanding. The inner morality is not merely about efficiency. It is about respect for human agency. When a government fails to publish its laws, or applies them retroactively, it treats its citizens not as responsible agents capable of guiding their conduct by rules, but as objects to be manipulated. To fail the inner morality is to fail to make law at all. It is to engage in something that looks like law but is merely the use of force disguised as rules.

  **Hart:** But consider the Nazi statute again. It was published. It was general. It was prospective. The husband knew, or should have known, that disparaging Hitler was forbidden. The system worked exactly as designed. The failure was not in the *procedure*, Lon, but in the *substance*. The law was evil. By insisting that procedural virtues can render something "not law," you obscure the real tragedy: that valid law can be used for horrific ends.

  **Fuller:** Was it truly prospective? The statute was invoked to punish private remarks made in the home, based on a denunciation by a spouse. This erodes the congruence between the rule and the reality of social life. But more importantly, Herbert, consider the effect of your solution. If we tell the German people, "That was valid law, so we must pass a retroactive statute to punish the wife," we teach them that law is merely power. We teach them that legality has no moral connection.

  **Hart:** I teach them that law is a distinct social phenomenon. I teach them that we must have the courage to say, "This was law, it was evil, and therefore we must change the law to punish this evil." It forces a moral choice. It separates the question of validity from the question of obedience. Your approach conflates them. It suggests that if a law is evil, it lacks legal force. That encourages individuals to decide for themselves which laws to obey based on their own moral calculus.

  **Fuller:** And my approach encourages them to look at the integrity of the system! If a regime abandons the inner morality—if it uses secret decrees, or retroactive punishments, or laws that make it impossible to comply—it forfeits its claim to fidelity. The wife in this case relied on a system that had already ceased to be a legal order in the full sense. She cannot hide behind the shield of "legality" when the shield itself was forged from corruption.

  **Hart:** But she *did* hide behind it. That is the point. She used the machinery of the state. If we say the machinery was broken, we excuse her agency. She made a choice. To punish her, we need a new legal basis. Why is candor so unappealing to you?

  **Fuller:** Because candor without principle is hollow. If we pass a retroactive statute, we admit that the only difference between the Nazi regime and the new Republic is that we are the ones holding the whip now. By declaring the Nazi enactment void for violating the principles of legality, we reaffirm that law *must* serve a moral purpose. We restore the connection between law and morality that the Nazis severed.

  **Hart:** You speak of restoring a connection. I fear you are creating a myth. You want law to be a moral hero. Sometimes, law is a villain. If we pretend the villain was never really there, we cannot learn how to stop him next time. We must recognize that the separation of law and morals is not a moral indifference; it is a tool for critical scrutiny. It allows us to say, "This is the law, but it is too iniquitous to obey."

  **Fuller:** And I say that scrutiny comes from within the concept of law itself. When you strip law of its moral purpose, you leave it vulnerable to capture. The Nazis did not just make bad laws; they perverted the concept of law. They used the form of legality to mask terror. To call that "law" is to grant it a dignity it does not deserve.

  **Hart:** (Leaning forward) Let us press this point on the procedural virtues. You claim they are moral achievements. I claim they are neutral tools. If a regime is wicked, clarity and publicity simply make the wickedness more efficient. The citizens know exactly how they will be crushed. Is that a moral gain?

  **Fuller:** It is a moral gain because it preserves the possibility of resistance. A system that respects the inner morality, even in a wicked state, leaves open the channels of communication between ruler and ruled. It admits that the citizen is a person. A system that abandons those principles—secret police, unpublished decrees—treats men as things. The difference is not just efficiency; it is the difference between governance and management.

  **Hart:** I remain unconvinced that procedural decency can save a substantive evil. But I concede this: the German court's decision was a practical necessity. Yet, as a matter of legal theory, it was muddled. They should have said, "We are punishing you under a new standard because the old one, though valid, was intolerable."

  **Fuller:** And I maintain that such a statement would have weakened the new Republic. It would have suggested that legality is fragile, easily set aside for "necessity." By holding that the Nazi statute was never law, they affirmed that there are boundaries power cannot cross without ceasing to be legal. That is a lesson worth the theoretical cost.

  **Hart:** (Sighs, picking up his pipe) We seem to be at an impasse, Lon. You see the inner morality as the soul of law; I see it as the skeleton. The soul can be corrupted even if the bones are straight.

  **Fuller:** And I say that if the bones are rotted, there is no body to hold the soul. We both want to prevent the future grudge informers, Herbert. You think clarity of concepts is the path. I think fidelity to principle is the path.

  **Hart:** Perhaps. But let us hope the next generation does not have to test our theories against such darkness again.

  **Fuller:** Agreed. Though I suspect the darkness will return. It is our job to ensure the light of legality is strong enough to withstand it.

  **Hart:** (Nods slowly) Then let us ensure, at the very least, that we define that light accurately.

  **Fuller:** And that it warms, rather than burns.

  *(They sit in silence for a moment, the weight of the subject hanging between them, before signaling for the bill.)*
