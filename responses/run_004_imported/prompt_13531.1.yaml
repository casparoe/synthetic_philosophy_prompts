answer: |-
  This is a classic debate in the philosophy of biology, and your friend is technically correct about the *algebra*, but she is making a category error about what science is *for*.

  She is relying on what is known as the **"Equivalence Thesis."** Prominent theorists like Samir Okasha and David Queller have shown that you can mathematically partition the Price Equation to look like Kin Selection (inclusive fitness) or Multi-Level Selection (group selection) and get the same prediction for evolutionary change ($\Delta z$).

  However, **predictive equivalence does not imply causal equivalence.**

  Here is the strongest case you can make that the debate is substantive, not notational. It rests on three pillars: the difference between description and mechanism, the interventionist account of causation, and the danger of "epicycles."

  ### 1. The Price Equation is a Tautology, Not a Mechanism
  Your friend is treating the Price Equation as a model of *process*. It is not. It is a description of *outcome*.

  The Price Equation is a statistical identity. It partitions variance *after the fact*. Saying that Kin Selection and Group Selection are mathematically interchangeable via the Price Equation is like saying that "Money leaving my account" and "Money entering the merchant's account" are interchangeable descriptions of a transaction. Mathematically, the change in wealth is identical. But if you want to understand *why* the transaction happened, the distinction matters. Did I buy a coffee? Was I robbed? Did I pay a tax?

  *   **Kin Selection** posits a causal mechanism based on genetic correlation and individual interaction.
  *   **Group Selection** posits a causal mechanism based on group differential survival and reproduction.

  If you only care about predicting the final gene frequency, the math is interchangeable. But if you care about **explanation**—identifying the engine driving the change—the two models posit different causal architectures. Science is not just about predicting the end state; it is about identifying the levers that move the system.

  ### 2. The Interventionist Test (The "Break It" Argument)
  The modern philosophical standard for causation is **interventionism** (associated with James Woodward). To say $X$ causes $Y$ is to say that if you intervene to change $X$, $Y$ changes, *ceteris paribus*.

  If the debate were merely notational, then intervening on "group structure" and intervening on "relatedness" should be the same lever. They are not.

  *   **Scenario:** Imagine a population of altruistic bacteria forming biofilms (groups).
  *   **Kin Selection Explanation:** Altruism evolves because the bacteria are clones (high relatedness, $r$).
  *   **Group Selection Explanation:** Altruism evolves because biofilms that cooperate grow faster than biofilms that don't (group fitness variance).

  Now, run an intervention: **Physically disrupt the biofilms constantly so groups never mature, but keep the bacteria clonal.**
  *   **Result:** Altruism collapses.
  *   **Kin Selection Account:** You have to explain this by saying you effectively lowered $r$ (maybe via a statistical workaround).
  *   **Group Selection Account:** You simply removed the higher-level unit of reproduction.

  The Group Selection model captures the **causal granularity** of the intervention more naturally. If you force the Kin Selection model to explain this, you have to treat "group disruption" as a change in "relatedness," which is conceptually contorted. The math can be forced to work, but the *causal map* is distorted. If the levels were truly just "bookkeeping," there would be no experimental setup where one model highlights the causal lever more clearly than the other. But there is.

  ### 3. The "Epicycle" Problem (Explanatory Depth)
  In astronomy, you could mathematically model the solar system using a Geocentric (Earth-centered) model if you added enough epicycles (complex orbits upon orbits). It would predict planetary positions just as accurately as the Heliocentric model.

  Does that mean the debate between Geocentrism and Heliocentrism was "just notational"? **No.** One model reflected the causal structure of gravity and mass; the other was a mathematical fiction that obscured the mechanism.

  When your friend says the models are interchangeable, she is saying you can always add "epicycles" to the Kin Selection model to make it fit a Group Selection scenario (usually by inflating the relatedness coefficient to account for group structure).

  *   **Substantive Claim:** If you have to torture the parameters of the Kin Selection model (e.g., defining relatedness in weird, non-genetic ways) to make it fit a clear case of group extinction, you have lost **explanatory power**.
  *   **Ontological Commitment:** If groups have **emergent properties** (traits that exist at the group level that cannot be reduced to the average of individuals, like "swarm intelligence" or "biofilm integrity"), then treating the group as a real unit of selection is ontologically superior. Reducing it to individual interactions ignores the emergent causal power of the collective.

  ### 4. Your Intuition Was Right: Death is Real
  Your gut feeling—"actual organisms really do live and die and reproduce at the individual level"—needs a slight tweak, but the core is correct.

  The substantive debate isn't about whether individuals die (they do). It's about **where the fitness variance is located.**
  *   If the variance in reproductive success is primarily due to differences *between individuals within groups*, selection is individual-level.
  *   If the variance in reproductive success is primarily due to differences *between groups* (e.g., whole groups go extinct while others survive), selection is group-level.

  Mathematically, you can shuffle that variance around in the Price Equation. But **causally**, the difference between an individual being eaten by a predator and a whole colony freezing to death is a massive difference in biological process. To say that distinction is "just bookkeeping" is to ignore the physical reality of the biological events.

  ### The Closing Argument for Your Friend
  Tell her this:

  > "I accept that the Price Equation allows you to partition the covariance terms either way. That proves the models are **predictively equivalent**. But it does not prove they are **causally equivalent**.
  >
  > Science isn't just about curve-fitting; it's about identifying the causal structure of the world. If I can design an experiment where disrupting group structure stops evolution, but disrupting individual kin-recognition does not, then 'Group Selection' is the causal explanation, even if you can retroactively fit a Kin Selection equation to the data.
  >
  > To say the debate is 'just notation' is to claim that the map is the territory. The math is the map. The biological process is the territory. You can draw two different maps of the same terrain, but if one map highlights the actual roads and the other highlights flight paths, they aren't interchangeable for a driver. The Units of Selection debate is about identifying the **roads**, not just calculating the distance."

  **Summary:** She is right about the algebra. You are right about the ontology. Mathematical equivalence does not dissolve causal distinction.
