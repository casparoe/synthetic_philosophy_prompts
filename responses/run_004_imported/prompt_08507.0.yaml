answer: |-
  This is a profound and delicate task. You are walking a tightrope between honoring your grandmother's specific philosophical commitments (Madhyamaka/Emptiness) and providing genuine emotional support to a grieving family who likely just want to feel close to her.

  The key to navigating the Tetralemma (the four corners) without landing on any of them is to shift the focus from **ontology** (what she *is* or *where* she is) to **dependent arising** (how she *functioned* and how she *continues to cause effects*). In Nagarjuna's view, things do not exist inherently, but they do exist conventionally through their relationships and causes.

  Here is a draft for a eulogy. It is written to be spoken slowly. I have included notes in brackets `[ ]` to help you understand the philosophical "safety checks" built into the text, so you can explain them to your uncle if needed.

  ***

  **Title: The Ripple and the Water**

  **Opening**
  Thank you all for being here. As many of you know, my grandmother was a woman who loved truth more than comfort. She spent twenty years teaching us that the way we speak about reality shapes how we experience it. Before she passed, she gave us specific instructions for today. She asked us not to say she is "watching over us," nor to say she is "gone forever." She asked us not to say she is "somewhere in between," and not to say her state is "a mystery beyond words."

  She didn't make these requests to be difficult. She made them because she wanted to protect us from the pain that comes when we try to freeze life into boxes that don't fit. She taught us that the deepest comfort doesn't come from deciding where she is, but from understanding how she was.

  **The Philosophy (Simplified)**
  Grandma studied a philosopher named Nagarjuna. He taught that nothing in this universe exists all by itself. Nothing has a hard, permanent shell around it. A flower isn't just a "flower"; it is made of soil, rain, sun, and time. If you take those away, the "flower" disappears.

  Grandma was like that. She wasn't a static object that arrived here and then left. She was a gathering of causes and conditions. She was made of her parents, her teachers, her struggles, her laughter, and yes, she was made of us. We were part of what constituted "Grandma." Just as she was part of what constitutes us.

  **Addressing the Loss (Without violating the Tetralemma)**
  So, when we ask, "Is she still here?" we are asking the wrong question. That question assumes she was a separate thing that could be either "present" or "absent."

  If we say she is fully here, we ignore the silence in her chair.
  If we say she is fully gone, we ignore the warmth still in this room.
  If we say she is both, we are confused.
  If we say she is neither, we are hiding.

  Instead, Grandma taught us to look at **continuity**. Think of a candle lighting another candle. When the first flame flickers out, did the light go away? Or did it travel? Is the second flame the *same* as the first? No. Is it *different*? Also no. It is a continuation of process.

  Grandma is not a noun. She was a verb. She was an action of love, of teaching, of questioning. And actions do not stop just because the actor changes form. The kindness she showed you is still active in the way you treat your children. The wisdom she shared is still working in the way you solve problems. The causes she set in motion are still rippling outward.

  **Comfort for the Family**
  I know this feels abstract when what you feel is grief. Grief is real. In the conventional world, we miss her. We miss her voice. We miss her hugs. Nagarjuna never denied that the world appears to us. He just reminded us not to get trapped by the appearance.

  It is okay to cry. It is okay to feel the emptiness of her absence. But try to see that emptiness not as a void, but as space. Space for her teachings to grow. Space for us to realize that the connection we had with her was never based on her physical form alone. It was based on a shared reality that death cannot sever, because it was never about two separate things being connected. We were never truly separate to begin with.

  **Closing**
  She asked me to tell you this: Do not cling to the memory of her as a fixed image in the past. That would be like trying to keep a river in a jar. Instead, let her flow through you.

  When you act with compassion, she is functioning.
  When you question your own assumptions, she is functioning.
  When you sit with uncertainty and find peace within it, she is functioning.

  We do not need to guess where she is. We only need to notice what is happening right here, right now, because of who she was.

  Thank you.

  ***

  ### Notes for you (to keep your uncle happy):

  1.  **The "Candle" Metaphor:** This is a classic Buddhist analogy for rebirth/continuity without a permanent soul (anatta). It avoids saying she "exists" (the flame is different) or "doesn't exist" (the light continues).
  2.  **"Not a noun, but a verb":** This signals *process philosophy* and *Pratītyasamutpāda* (Dependent Origination). It denies *Svabhāva* (inherent existence) without falling into Nihilism.
  3.  **"We were never truly separate":** This hints at Emptiness (*Śūnyatā*) without positing a "Universal Oneness" (which would be a subtle form of "Exists"). It suggests interdependence rather than merging.
  4.  **Avoiding "Mystery":** Notice in the speech I explicitly say "We do not need to guess." This avoids the 4th lemma (ineffability/mystery). It claims we *can* know her through her effects (causality).
  5.  **Conventional vs. Ultimate:** The section on "Grief is real" acknowledges *Samvrti-satya* (Conventional Truth) so the family doesn't feel gaslit, while maintaining *Paramārtha-satya* (Ultimate Truth) regarding her nature.

  ### Delivery Advice:
  *   **Pause often.** This gives people time to process the logic.
  *   **Make eye contact.** When you talk about grief, look at the family. When you talk about the philosophy, look at your uncle (as a subtle nod that you know what you're doing).
  *   **It's okay to stumble.** If you get emotional, stop. That validates the "Conventional Truth" of grief, which balances the "Ultimate Truth" of the philosophy.

  I am sorry for your loss. It sounds like she was an incredible woman. Good luck.
