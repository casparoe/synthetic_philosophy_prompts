      *   Ensure the distinction between *conventional truth* (we miss her) and *ultimate truth* (no self to miss) is handled gently.
      *   Use the term "Empty of inherent existence" carefully. Maybe "independent existence."
      *   *Crucial:* Nagarjuna's point isn't nihilism. It's that because things are empty, change and connection are possible. If she were solid, she couldn't have influenced us. Because she was empty, she could flow into us.

  10. **Final Polish:** Add stage directions for the user (pause, breathe). Ensure the tone is loving, not just a philosophy lecture. (Self-Correction: Make sure to explicitly mention the Tetralemma ban so the family knows *why* you aren't saying the usual things, otherwise they might think you're being cold.)

  11. **Final Safety Check:** This is a sensitive topic (death/grief). Ensure the tone is empathetic. The philosophical constraints are strict, but the emotional need is paramount. The advice should empower the user to speak from the heart while adhering to the constraints.

