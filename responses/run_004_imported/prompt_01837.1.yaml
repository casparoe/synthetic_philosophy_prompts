answer: |-
  **Setting:** *A dimly corner of a hotel bar, 11:30 PM. The noise of the APA conference afterparty hums in the background. ELIAS (50s, rumpled suit, looks perpetually disappointed by reality) swirls a scotch. SARAH (30s, sharp blazer, whiteboard marker still in her pocket) nurses a tonic water.*

  **Elias:** You know, the problem isn't that you're wrong about the cup. It's that you think the cup is *there*.

  **Sarah:** It's physically occupying space above the table, Elias. I'm willing to bet my security deposit on it.

  **Elias:** Physically, sure. Ontologically? You've got a lump of ceramic. You've got a slab of wood. And you've got this invisible ghost called "on-ness" hovering between them. My point is, if "on-ness" is a real thing, a real constituent of the world, then we're back at square one. How does "on-ness" stick to the cup?

  **Sarah:** We've done this. The relation isn't a third *thing* sitting between two other things. It's a *tie*.

  **Elias:** A tie. [He taps his glass.] A word. You're solving an ontological problem with a part of speech. If the relation is real, it must have terms. If it has terms, it must be related to them. If you need a further relation to relate the relation to the terms, I have you in the regress. If you don't, you're asking me to accept magic.

  **Sarah:** I'm asking you to accept that the *state of affairs* is fundamental. You're assuming the particulars exist first, and then we need to glue them together. I'm saying the fact—the cup-being-on-the-table—is the primary existent. The parts are abstractions from the whole.

  **Elias:** Ah, the Armstrong maneuver. "States of Affairs." It sounds so robust, doesn't it? Like you've built a brick wall against the regress. But all you've done is paint a target on the wall and called it "Unity." You say the state of affairs is the unit. Fine. What makes *that* a unit? Is the unity of the state of affairs itself a property of the state of affairs?

  **Sarah:** No.

  **Elias:** Then what is it? If it's nothing, your state of affairs is just a list. "Cup. Table. On." And a list, as we know, is not a fact.

  **Sarah:** It's not a list because the constituents have a specific valency. The relation is unsaturated. It reaches out. It doesn't need a further glue because its very nature is to *connect*. You're treating a verb like a noun, Elias. That's the category mistake.

  **Elias:** "Unsaturated." Another metaphor. You're telling me that if I look at the universe, some chunks of reality have little hooks on them? And if I ask "what are the hooks made of," you say "hook-stuff"? No. You're relabeling the mystery. You say "the relation relates" to stop the regress, but that's an assertion, not an explanation. It's like saying "opium puts you to sleep because of its dormitive virtue."

  **Sarah:** [Leans in] It's not dormitive virtue. It's structural. Look, let's shift it. Forget the cup. Think about what we just said. "Alice is wise."

  **Elias:** A proposition.

  **Sarah:** Exactly. What is the difference between the list "Alice, wisdom" and the sentence "Alice is wise"?

  **Elias:** [Smiles thinly] I was wondering when you'd bring the Unity of the Proposition into this. The list is just objects. The sentence has a verb. The verb provides the unity.

  **Sarah:** Right. The "is" isn't another object in the list. If it were, you'd have "Alice, wisdom, is-ness," and you'd need another verb to join them. You'd get a regress of verbs. So you admit that in language, in logic, the unifying element *functions* differently than the terms. Why can't reality work the same way?

  **Elias:** Because language is a tool we use to carve up the Absolute. It's pragmatic. It's not a map of the territory. You're reifying syntax. You think because our sentences need subjects and predicates to function, the world must be built out of subject-substances and predicate-properties tied together by copula-glue. But that's just the structure of *thought*, not the structure of *being*.

  **Sarah:** So science is just... storytelling? When a physicist says "the electron has charge," they aren't describing a state of affairs?

  **Elias:** They're describing appearances within the One. Look, Sarah, I'll grant you this: If you stop the regress by fiat—if you just say "relations relate inherently"—you save the many. You save the cup, the table, the electron, the charge. But you pay for it by making the ultimate nature of connection unintelligible. You accept brute facts.

  **Sarah:** I accept that explanation has to stop somewhere. You want a explanation for the glue, then an explanation for the explanation of the glue. I'm saying the glue is the bottom floor.

  **Elias:** It's not a floor if it floats. If you refuse to explain how the many become one, you haven't solved the problem of unity. You've just asserted it. And if you can't explain how two things become one without a third thing to join them, then ultimately, the "two things" were never truly distinct to begin with. Distinction requires separation. Separation requires a boundary. A boundary is a relation. And so...

  **Sarah:** ...And so we're back in the Absolute. [She sighs.] You know the cost of your view, right? If Bradley is right, if the "many" is incoherent, then this conversation isn't happening. There is no "you" and "me." There is just the Experience, undivided.

  **Elias:** Precisely. Which explains why we never actually agree.

  **Sarah:** It also explains why you can't write a philosophy book. A book is a sequence of distinct propositions. If relations are unreal, your sentences don't connect. Your argument is just a heap of words.

  **Elias:** [Takes a slow sip] A heap that points, imperfectly, toward the Silence. Look, I'm not saying we shouldn't *talk* as if relations are real. I'm saying that when you push on what makes them real, the pluralist hits a wall. You say "State of Affairs." I hear "Mystery." You say "Non-relational tie." I hear "Magic."

  **Sarah:** And you say "The Absolute." I hear "The End of Inquiry." I'll take the magic. At least with magic, I can put my cup on the table and know it won't fall through the ontological cracks.

  **Elias:** [Raises his glass] To the cracks, then. That's where the light gets in.

  **Sarah:** [Clinks her tonic against his scotch] To the cup. However it stays there.
