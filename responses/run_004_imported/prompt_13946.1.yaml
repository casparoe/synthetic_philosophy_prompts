  **Justifications**

  *   **Move 1 (Elena): Score 2.** Elena accurately represents Aquinas's early position in the *Commentary on the Sentences* (II, d. 44). Aquinas does distinguish between a ruler who lacks a legitimate title (*ex defectu tituli*) and one who abuses a legitimate title (*ex parte exercitii*). Regarding the former, he argues they are not true rulers but private aggressors, and thus resisting them does not constitute sedition.
  *   **Move 2 (Marcus): Score 2.** Marcus correctly identifies a logical gap in Elena's inference: the absence of a duty to obey does not automatically entail an affirmative right to kill. He also accurately cites *De Regimine Principum* (I.6), where Aquinas is notably more cautious, emphasizing public authority over private action and warning against the unintended consequences of assassination.
  *   **Move 3 (Elena): Score 1.** Elena is right to insist that Marcus is conflating the two distinct categories (usurper vs. title-holding tyrant), which is a crucial scholastic distinction. However, she overreaches by labeling the resistance to a usurper a "tyrannicide doctrine." If the usurper is merely a private aggressor, killing them is an act of self-defense or just war, not strictly *tyrannicide* (the killing of a magistrate). While her structural reading is sound, the terminology is imprecise.
  *   **Move 4 (Marcus): Score 2.** Marcus offers a strong contextual and practical critique. He correctly notes that even if resistance is theoretically permissible, Aquinas restricts *who* may act (public authority vs. private citizen). His point about the "institutional void" (i.e., what if there is no superior to appeal to?) is a standard and valid critique in medieval political thought (notably highlighted by scholars like Quentin Skinner), as is the comparison to John of Salisbury's more permissive *Policraticus*.

  **Overlooked Considerations**

  Both students overlook Aquinas's mature treatment in the *Summa Theologiae* (II-II, q. 42, a. 2), which serves as a bridge between the *Sentences* and *De Regimine*. There, Aquinas argues that resisting a tyrant is not sedition *unless* it causes greater harm to the community than the tyranny itself. This introduces a utilitarian calculus that complicates Elena's "right of resistance" and supports Marcus's caution, without fully collapsing the distinction between usurpers and title-holders. Additionally, both neglect the distinction between *deposition* (removal from office) and *execution* (killing); Aquinas is generally more open to the former by public authority than the latter by private hands. Finally, they treat Aquinas's corpus as static, whereas his thought on this matter evolved from the more permissive *Sentences* to the more conservative *De Regimine* and *Summa*.
