answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Claire's sibling. It is a profound honor to stand here today. Usually, when a sister gets married, you talk about how much she's grown, or how the years have flown by. But given that Claire is currently finishing a PhD in metaphysics with a dissertation on persistence through time, I've been advised that saying "the years have flown by" is, at best, a loose manner of speaking, and at worst, a category error.

  We all know Claire thinks about things differently. Most of us look at a timeline and see one person moving along it. Claire looks at a timeline and sees a manifold of momentary stages, causally connected, where "Claire" is just the name we give to the slice happening right now. She's a stage theorist. For those of you not in the department, that means she believes the person standing at this altar is not, in the strictest metaphysical sense, identical to the person who will be celebrating a fiftieth anniversary. That future person is a "temporal counterpart."

  I know this sounds cold to the rest of us. It sounds like a loophole. But I've spent a lot of time thinking about what this means for a marriage, and I've realized that Claire's view actually offers something incredibly beautiful.

  Because Claire is also an eternalist. She believes that the past, the present, and the future are all equally real. They all exist in the block universe. This means that the wedding we are celebrating today is real. But so is the quiet breakfast you'll have on a Tuesday ten years from now. So is the argument you might have about where to go on vacation. And so is the moment, fifty years from now, when you look at each other and recognize a lifetime of shared history.

  In a world where only the present exists, love is a desperate race against entropy. You have to keep recreating it every second or it vanishes. But in Claire's universe, love is a structure. It's a feature of reality that doesn't disappear just because a clock ticks. The future stages of your marriage aren't just hopes or predictions, Daniel. They are facts. They are already there, waiting in the manifold, no less real than this moment right now.

  This brings me to the vows. Daniel, you are about to make a promise. In ordinary language, you're saying, "I will love you forever." But we know that "you" and "I" are complicated terms here. Strictly speaking, the Daniel standing here is making a commitment that his future temporal counterparts will stand in a loving relation to Claire's future temporal counterparts.

  And that is where I have to make a joke, specifically for Claire's advisor and her old cohort in the front row. I know that for a stage theorist, the "Problem of Temporary Intrinsics" is serious business. It's the puzzle of how one thing can be bent at one time and straight at another without contradiction. But watching you two together, I think you've solved it. You don't need to be the same worm to share the same joy. The Claire-stage who is laughing right now and the Claire-stage who is crying later are distinct, but they are linked by something more durable than identity. They are linked by *you*.

  To the rest of the family, I promise I am done with the metaphysics. But I want to say this: Claire has taught me that we shouldn't look for permanence in the idea that things stay the same. We should look for permanence in the reality of the moments themselves.

  Daniel, you aren't just marrying the woman at the altar. You are marrying into a timeline where every stage of her life is valid, real, and worthy of love. You are committing to be the constant in the counterpart relation. When the world changes, and when you change, you are promising that the relation between your future stages and hers will remain one of partnership, kindness, and devotion.

  Claire, you have spent five years arguing that nothing persists through time. But I hope that tonight, you allow yourself to feel that some things don't have to persist to be eternal. If every moment is real, then this moment—where you are surrounded by people who love you, where you are beginning this adventure with Daniel—is never lost. It becomes a fixed point in the universe.

  So, if everyone could please raise a glass.

  To Claire and Daniel. May your counterpart relations be strong, may your causal connections be unbroken, and may every stage of your existence, from this one to the very last, be filled with the same joy that is present in this room right now.

  To the bride and groom.
