answer: |-
  This is an excellent question that cuts to the heart of the debate between Nyāya realism and Buddhist pramāṇavāda. You have correctly identified the friction point: Nyāya claims to secure universal necessity (*vyāpti*) through epistemic procedures, while Dharmakīrti argues that necessity must be ontological.

  To answer this, we need to disentangle the specific roles of *upādhi* (defeating condition) and *tarka* (hypothetical reasoning) within the process of *vyāpti-graha* (the grasping of pervasion), and then weigh that against the Buddhist critique.

  ### 1. The Mechanics of *Vyāpti-graha*: Beyond Enumeration

  You are right to be skeptical of *bhūyodarśana* (repeated observation) alone. The Naiyāyikas are equally skeptical. Mere enumeration yields regularity (*niyama*), not necessity (*avaśyambhāvitva*). If I see smoke with fire 1,000 times, the 1,001st instance remains logically contingent unless I know *why* they are linked.

  Nyāya secures the universal claim through a two-step negative methodology: **elimination of the *upādhi*** and **consolidation via *tarka***.

  #### A. The Role of *Upādhi* (Falsification)
  An *upādhi* is an adventitious condition that vitiates an inference. Technically, it is a property ($U$) that pervades the *sādhya* ($S$) but does not pervade the *hetu* ($H$).
  *   **Formula:** $S \rightarrow U$ but $H \nrightarrow U$.
  *   **Function:** If such a $U$ exists, the inference $H \rightarrow S$ is accidental. The real link is $U \rightarrow S$.

  **In the Smoke-Fire Case:**
  Suppose we want to prove Fire ($S$) from Smoke ($H$). A skeptic suggests: "Maybe the link isn't Smoke-Fire, but Smoke-Wet Fuel-Fire." They propose "Wet Fuel" as the *upādhi*.
  To test this, Nyāya performs *upādhi-nirāsa* (elimination of the limiting condition):
  1.  **Does Fire imply Wet Fuel?** ($S \rightarrow U$) No. A red-hot iron ball has fire but no wet fuel.
  2.  **Conclusion:** "Wet Fuel" is not an *upādhi*. It does not pervade the *sādhya*.

  The Nyāya claim is not that we have verified every instance in the universe, but that we have subjected the correlation to rigorous **falsification**. We actively search for a condition $U$ that explains the co-presence of $H$ and $S$. If we exhaustively search for *upādhis* and find none, the correlation is deemed "clean."

  This is surprisingly modern. It shifts the burden from verification (induction) to falsification. *Vyāpti* is established not because we have seen all instances, but because we have failed to find a defeater (*upādhi*) despite looking for one.

  #### B. The Role of *Tarka* (Modal Strengthening)
  If *upādhi*-elimination cleans the data, *tarka* provides the modal force. *Tarka* is not an independent *pramāṇa* (source of knowledge); it is a *pramāṇa-sahakāri* (assistant to the means of knowledge). It removes doubt (*saṃśaya*) and mental obstruction (*pratibandha*).

  *Tarka* works via *prasaṅga* (reductio ad absurdum). It asks us to entertain the counter-position and see if it leads to an unwanted consequence (*aniṣṭa-prasaṅga*).

  **In the Smoke-Fire Case:**
  *   **Hypothesis:** Suppose smoke could exist without fire (*vyabhicāra*).
  *   **Consequence:** If smoke could arise without fire, then any effect could arise without its cause. The production of curds could happen without milk; a sprout without a seed.
  *   **Absurdity:** This contradicts our fundamental experience of causal order (*arthakriyā*). The world would be chaotic (*jagad-aṇḍa-koṣa* confusion).
  *   **Conclusion:** Therefore, the supposition that smoke can exist without fire is false.

  **What work is *tarka* doing that enumeration cannot?**
  Enumeration tells you: "I haven't seen smoke without fire."
  *Tarka* tells you: "Smoke without fire is *incoherent* with the nature of causal efficacy."
  *Tarka* moves the cognition from "This has always happened" to "This *must* happen." It creates a psychological and logical pressure that forces the mind to assent to the pervasion as necessary. In Navya-Nyāya (Gaṅgeśa), this is refined further: *tarka* removes the "doubt about the doubt," stabilizing the *vyāpti-graha* so it can serve as the major premise in inference.

  ### 2. The Buddhist Objection: Dharmakīrti's Challenge

  Dharmakīrti's critique is devastatingly simple: **Regularity is not Necessity.**

  For Dharmakīrti, no amount of *upādhi*-checking or *tarka* can bridge the gap between "I haven't seen a counter-example" and "There *cannot* be a counter-example."
  *   **Nyāya:** Relies on *vyāpti-graha* (a perceptual-cognitive grasp of concomitance) aided by *tarka*.
  *   **Dharmakīrti:** Argues that *vyāpti* must be grounded in *svabhāva-pratibandha* (a restriction based on the nature of things).

  For the Buddhist, a valid inference is only possible if the *hetu* and *sādhya* are related by:
  1.  **Tadutpatti (Causal Production):** Smoke is produced by fire. (Effect $\rightarrow$ Cause inference).
  2.  **Tadātmya (Essential Identity):** This is a tree because it is an oak. (Predicate $\rightarrow$ Subject inference).

  Dharmakīrti argues that unless you know the *ontological tie* (e.g., that fire has the causal power (*śakti*) to produce smoke), you are just guessing based on habit. *Tarka* is merely a mental construct (*kalpanā*); it cannot reveal reality. If you don't perceive the causal power directly, your "necessity" is just a strong habit (*vāsanā*).

  ### 3. Honest Assessment: Is Nyāya Papering Over the Gap?

  Here is the assessment you asked for, balancing internal coherence with philosophical rigor.

  **Where Dharmakīrti Wins (The Metaphysical Point):**
  Dharmakīrti is philosophically superior on the problem of induction. He correctly identifies that logical consistency (*tarka*) does not guarantee ontological necessity. Just because a "smoke-without-fire" world leads to absurd consequences *in our conceptual scheme* doesn't prove reality *must* conform to our scheme.
  If Nyāya cannot point to the *śakti* (causal power) linking smoke and fire, their *vyāpti* remains, strictly speaking, a highly confirmed empirical generalization, not a logical necessity. In this sense, yes, Gaṅgeśa's elaborate machinery in the *Tattvacintāmaṇi* is an epistemic workaround for a metaphysical gap. They are defining "necessity" as "invariable concomitance未被 found to be otherwise" rather than "ontologically grounded connection."

  **Where Nyāya Wins (The Methodological Point):**
  However, dismissing Nyāya as "just induction" misses the sophistication of the *upādhi* apparatus.
  1.  **Falsificationism:** The *upādhi* mechanism is a rigorous tool for controlling variables. It anticipates Mill's Method of Difference. By demanding that we search for a third variable ($U$) that explains the correlation, Nyāya avoids the trap of *post hoc ergo propter hoc*.
  2.  **Pragmatic Necessity:** Nyāya (especially the later school) shifts the goalpost. They argue we don't *need* Dharmakīrti's ontological tie for successful action (*pravṛtti-sāmarthya*). If *vyāpti* is established via *tarka* and *upādhi-nirāsa*, it is reliable enough for all human purposes.
  3.  **The Nature of *Tarka*:** While Dharmakīrti sees *tarka* as mere imagination, Gaṅgeśa argues that *tarka* reveals the *incoherence* of the alternative. It's not just "I can't imagine it"; it's "The concept of an effect without a cause destroys the concept of 'effect'." This is a conceptual necessity, which, while not ontological, is epistemically binding.

  **The Verdict:**
  The Naiyāyikas are not "papering over" the gap in a dishonest way; they are **redefining the terms of the debate**.
  *   **Dharmakīrti** demands **Ontological Necessity** (grounded in the nature of reality).
  *   **Nyāya** provides **Epistemic Necessity** (grounded in the absence of defeaters and the incoherence of denial).

  If your standard for "justified universal claim" is Dharmakīrti's (access to causal powers or essential identity), then Nyāya fails. They admit we cannot perceive *śakti* directly.
  But if your standard is "warranted assertibility for scientific inquiry," Nyāya's apparatus is arguably more robust. Dharmakīrti's requirement for *tadutpatti/tadātmya* is hard to verify without already having the inference you are trying to justify (circularity). Nyāya's *upādhi* testing is public, falsifiable, and operational.

  **Conclusion for your Seminar:**
  You can argue that Gaṅgeśa's *Tattvacintāmaṇi* represents a shift from a metaphysical defense of inference to a **logical-epistemic defense**. He concedes that we cannot see the "glue" of the universe (the Buddhist *svabhāva-pratibandha*), but he argues that a pervasion secured by *tarka* and cleared of *upādhis* is the functional equivalent of necessity for a knower (*pramātṛ*).

  The "inductive gap" remains, but Nyāya fills it with a **regulative ideal**: we act *as if* the pervasion is necessary because the alternative is cognitively and practically unsustainable. Whether that satisfies a metaphysical realist is another question, but it satisfies a pragmatist. Dharmakīrti wins on metaphysics; Gaṅgeśa wins on methodology.
