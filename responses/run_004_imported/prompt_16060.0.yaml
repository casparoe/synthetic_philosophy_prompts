answer: |-
  This is one of the most enduring and difficult problems in the history of ideas. You and your friend are reenacting a debate that philosophers have been having since the revelations about Martin Heidegger's Nazism, and later with the discovery of Frege's diary in 1993 (by scholars Gottfried Gabriel and Wolfgang Kienzler). Michael Dummett himself struggled profoundly with this, eventually writing a biography that refused to hide Frege's politics while maintaining his philosophical stature.

  Your intuition that the logic remains sound is likely correct, but your friend's suspicion is not merely an emotional reaction; it touches on valid questions about the nature of philosophy. Here is a breakdown of the most important implications of this case for how we weigh character against argument.

  ### 1. The Distinction Between Validity and Motivation
  The strongest argument for your position is the **autonomy of formal logic**. Frege's primary contribution was the invention of predicate logic (the *Begriffsschrift*). Logical validity is truth-preserving regardless of the moral character of the logician. If the inference from $P$ to $Q$ is valid, it remains valid whether written by a saint or a bigot. To claim otherwise is to commit the **genetic fallacy**: judging the truth of a proposition solely by its origin.

  However, your friend's suspicion holds more water when we move from *formal logic* to *philosophical motivation*. Logic is a tool; philosophy decides how to use it.
  *   **Implication:** We should treat the *technical machinery* (the logical symbols, the proofs) as independent of the author. However, we must scrutinize the *philosophical questions* the author chose to ask. Did Frege's antisemitism lead him to prioritize certain problems (e.g., purity of thought, exclusion of the "psychological") over others? Biographical context helps us understand *why* a philosopher built a system, even if it doesn't invalidate the system's internal structure.

  ### 2. The Danger of the "View from Nowhere"
  Dummett and others originally admired Frege because he seemed to embody the "view from nowhere"—a purely objective perspective unclouded by human bias. The diary revealed that this was a stylistic affectation, not a reality.
  *   **Implication:** We must stop treating "objectivity" in philosophy as a lack of personality, and start treating it as a rigorous methodological achievement that is always vulnerable to human failure. The lesson isn't that Frege's work is worthless, but that the *myth of the dispassionate thinker* is dangerous. It encourages us to ignore the social and political undercurrents that shape even the most abstract theories. We should read Frege not as a divine oracle, but as a brilliant, flawed human whose work requires critical engagement rather than reverence.

  ### 3. The Permeability of "Pure" Concepts
  Your friend argues that prejudice might infect the philosophy itself. In fields like ethics or political philosophy, this is obvious. In logic or metaphysics, it is subtler. However, Frege's philosophy of language deals with *sense*, *reference*, and *thought*.
  *   **Implication:** If a philosopher holds that certain groups of people are "irrational" or "destructive to culture," does that subtly shape their definition of what constitutes a valid "thought" or a proper "concept"?
      *   *Counter-point:* Gershom Scholem, who attended Frege's lectures, noted that while Frege's political views were reactionary, they did not seem to bleed into his mathematical logic. Scholem himself separated the man from the work.
      *   *Synthesis:* The implication here is **hermeneutic vigilance**. We do not discard the work, but we read it with a "hermeneutics of suspicion." We ask: Are there hidden normative assumptions in his definitions? For Frege, the answer is mostly "no" regarding his logic, but perhaps "yes" regarding his later philosophical fragments on culture.

  ### 4. The Ethical Responsibility of the Interpreter
  There is an ethical dimension to your friend's concern. Continuing to canonize a thinker without acknowledging their vile beliefs can feel like complicity, or it can signal that intellectual brilliance excuses moral monstrosity.
  *   **Implication:** Teaching and assessing Frege now requires **contextual honesty**. We cannot teach Fregean logic as if it emerged in a vacuum. To present Frege as the "model of a dispassionate thinker" is now historically false. The implication is that we must teach the philosophy *alongside* the biography, not to invalidate the former, but to humanize the latter. This prevents students from internalizing the idea that great intellect requires moral detachment.

  ### 5. The "Heidegger Test"
  Philosophy has largely settled on a precedent with Heidegger: *Being and Time* remains a foundational text, but his later work is read with extreme caution, and his biography is integrated into the study of his thought.
  *   **Implication:** We should apply a **sliding scale**. The closer the work is to formal structure (logic, math), the less the biography matters for *truth*. The closer the work is to human application (ethics, anthropology, political philosophy), the more the biography matters for *interpretation*. Frege sits in the middle: his logic is formal, but his philosophy of language informs how we understand human communication.

  ### Conclusion: How to Judge the Work
  You were right to resist the idea that the diary invalidates the logic. If we discard every insight produced by a morally flawed human, we would have to discard almost all of Western philosophy (consider Rousseau, Wittgenstein, or Schopenhauer).

  However, your friend is right that the diary changes *how* we read. The most important implication is this: **Biography does not determine truth conditions, but it does determine interpretive context.**

  We should read Frege's work not with "suspicion" that the logic is wrong, but with a **refusal of hagiography**. We acknowledge that the "impersonal style" was a mask. We accept the logical tools he gave us (which allow us to critique prejudice just as effectively as anyone else) while rejecting the man's political vision. In a way, the ultimate vindication of Frege's philosophy is that it provides the rigorous framework necessary to dismantle the very prejudices he held, independent of his own failures.

  **The verdict:** Judge the argument by its validity, judge the philosopher by their character, and never confuse the two—but do not pretend the philosopher's character is irrelevant to the history of the ideas.
