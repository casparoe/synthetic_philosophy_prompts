      *   **User's Argument (Vagueness/Anti-Realism):** If there are borderline cases, there is *no fact of the matter*. The concept is inherently vague. The insurer is wrong to assume a precise cutoff exists.
      *   **Friend's Argument (Epistemicism):** There *is* an exact fact (he is either a smoker or not), even if we can't know where the line is.
      *   **Questions:** Whose position is better supported philosophically? Does it make a difference to what he should write on the form?

