answer: |-
  Good evening, everyone. For those of who don't know me, I'm [Your Name]. I've had the privilege of knowing [Bride] since our college days.

  Now, usually, this is the part of the speech where I talk about how [Bride] and [Groom] promised to love each other forever, and how beautiful that is. And it *is* beautiful. But giving a speech at [Bride]'s wedding using the word "promise" loosely feels... risky.

  As many of you know, [Bride] spent the better part of her twenties earning a PhD in Philosophy. Specifically, she studied the ethics of promising. Not the legal kind, but the moral kind. The question of why saying "I promise" actually changes reality. Why it obligates you, even when it would be easier not to.

  I remember one night at a conference dinner, a few glasses of wine in, I asked her the big question. I said, "Okay, but why does a promise matter if no one gets hurt?"

  She told me about the case of the "non-discoverable breach." Imagine I promise to visit your grave after you die. Or I promise to keep a secret that, if I told it, no one would ever know I broke my word. In those cases, you aren't around to be disappointed. No one relies on me. There are no negative consequences. And yet, if I break that promise, I have still done something *wrong*.

  [Bride] spent years analyzing why that is. And tonight, I'm not going to try to summarize her dissertation. But I did ask her what conclusion she landed on. What is the "something else" that binds us?

  There are a few theories out there. Some say it's about social utility. Some say it's about expectations. But [Bride]'s work—and the view I want to toast to tonight—suggests something deeper. It suggests that a promise isn't primarily about the *future*. It's about the *self*.

  When you make a genuine promise, you aren't just predicting that you'll do something. You are exercising a normative power over your own life. You are taking your future self—which is technically a stranger you haven't met yet—and you are binding them. You are saying, "This is who I am. This is what I stand for."

  To the philosophers in the room: I know she'd argue the nuances of the Will Theory versus the Practice View, but tonight, I'm siding with the idea that the obligation comes from the integrity of the agent. A broken promise isn't just a letdown; it's a fracture in the person who made it.

  *(Pause, look toward the academic table)*

  So, for the cohort in the back: Yes, I am asserting that marriage is the ultimate exercise of normative power over one's future will, immune to utilitarian calculation. You can nod now.

  *(Turn back to the couple)*

  And for the rest of us: What this means for [Bride] and [Groom] is profound.

  We tend to think of marriage as a public event. We have witnesses. We have a license. We have a party. But if the philosophy holds up, the weight of marriage isn't in this room. The weight of marriage is in the moments where *no one* is watching.

  It's in the promise you keep when you're tired and it would be easier to be cruel. It's in the fidelity you maintain when you're traveling and no one would know. It's in the kindness you offer when you're angry and could get away with withholding it.

  In those moments, there is no social pressure. There is no legal contract enforcement. There is only you, and the person you said you were when you stood up here.

  [Bride], you taught me that a promise is a way of telling the truth about who you intend to be. And [Groom], watching you two, I see that you have already started that work. You aren't just promising to make each other happy. You are promising to be the *kind of people* who keep their word, to each other, even in the dark.

  That is a much heavier lift than "happily ever after." But it is also much more sturdy. Happiness comes and goes. But integrity? That is something you build.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May you always have the strength to bind your future selves. May you never find yourselves in a case of non-discoverable breach. And may the promise you make tonight be the truest thing you ever say.

  To the couple.
