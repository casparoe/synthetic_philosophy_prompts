prompt: |-
  My close friend from college is getting married in a few weeks and asked me to give a speech at the reception. Here's the wrinkle: she did her whole PhD in philosophy on the ethics of promising - basically the question of why a promise actually obligates you (not in the "the marriage license is a legal contract" sense, the actual words-exchanged-out-loud sense), rather than it just being a nice thing people say to each other - and a decent chunk of the guest list is people from that world. The rest is just our families and old college friends who have no idea any of this is a Whole Academic Field. I really dont want to give the generic "and they promised to love each other forever, aw" toast, but I'm also nervous about botching the substance in front of people who've spent years on it.

  Here's the one bit I actually remember clearly, from a half-drunk conversation with her at a conference dinner once: she said a promise seems to still bind you even in a case where literally nobody, not even the person you promised, will ever find out whether you kept it or broke it - so whatever's doing the binding can't just be about them relying on you or being let down, it has to be something else, and apparently most of the obvious candidates for what that "something else" is don't fully hold up either. I don't need the speech to solve her dissertation for her, but I'd love it to actually commit to one real answer instead of hedging across the going theories, and use that answer to say something genuine about what she and her fiance are about to do up there. Bonus points if there's at least one moment where her old cohort nudges each other while everyone else just experiences it as a normal, lovely wedding speech. Can you draft something like a 4-5 minute spoken toast?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding reception toast.
      *   **Speaker:** Close college friend of the bride.
      *   **Bride:** PhD in Philosophy, specialization in the *ethics of promising* (why promises obligate us).
      *   **Audience:** Mix of family/college friends (laypeople) and academic peers (experts in the field).
      *   **Goal:** Avoid generic clichés ("promised to love forever"). Engage with her specific academic interest without being dry or pretentious. Commit to *one* philosophical answer (don't hedge). Include a "wink" moment for the academics that still works for everyone.
      *   **Key Philosophical Insight (from prompt):** A promise binds even if no one finds out (the "secret promise" problem). It's not just about reliance or disappointment.
      *   **Tone:** Warm, genuine, slightly intellectual but accessible, funny but respectful.
      *   **Length:** 4-5 minutes spoken (approx. 600-750 words).

  2.  **Deconstruct the Philosophy (The "Wrinkle"):**
      *   *The Problem:* Why does saying "I promise" create an obligation?
      *   *Utilitarian/Reliance View:* You promise so people can rely on you. If they don't know, no harm, no foul. (The bride rejects this based on the prompt).
      *   *Social Practice View:* It's a rule of the game. (A bit dry).
      *   *Autonomy/Will View:* By promising, you alter your own moral landscape. You bind your future self.
      *   *The "Secret Promise" Insight:* If I promise to visit your grave after you die, or promise to keep a secret that no one would know I broke, I still feel bound. Why?
      *   *Selection for the Speech:* I need a theory that sounds romantic but holds philosophical water. The best fit for a wedding is a blend of *Self-Constitution* or *Identity*. When you promise, you define who you are. Breaking it isn't just letting someone down; it's betraying yourself.
      *   *Alternative:* The "Invitation to Trust" (T.M. Scanlon-ish). But the prompt emphasizes the *internal* binding even without discovery.
      *   *Chosen Angle:* **The Promise as an Act of Self-Definition.** When you promise, you aren't just predicting the future; you are *creating* a future obligation that becomes part of your moral identity. This fits marriage perfectly. Marriage isn't just a prediction ("I think I'll love you"); it's a commitment ("I *will* love you, and that will defines me").

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Establish the relationship. Light humor about the academic specialty.
      *   **The "Layman" Explanation:** Briefly explain her PhD topic without jargon. Use the "secret promise" example from the prompt.
      *   **The Philosophical Pivot (The "Wink"):** Address the academics. State the chosen theory clearly. *Idea:* The obligation comes from the act of *willing* a constraint on oneself. It's about agency.
      *   **Connecting to Marriage:** How does this apply to the couple? Marriage is the ultimate "secret promise" keeper. It's easy when people are watching. It's hard when it's just the two of you (or just you) in the dark.
