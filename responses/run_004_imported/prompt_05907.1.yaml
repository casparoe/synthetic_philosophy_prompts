      *   *Concept:* "Normative Power" or "The Exercise of the Will."
      *   *Specific reference:* Maybe allude to the "Practice View" vs. "Will Theory."
      *   *The "Nudge":* I should explicitly reject the "Reliance Theory" (which is the common intuition) and side with the "Will Theory" (or something similar).
      *   *Drafting the line:* "Most people think a promise is about *your* expectations. [Bride] knows it's about *my* will."
      *   *Better:* Let's use the "Secret Promise" example directly. "If I promise to water your plants while you're away, and I don't, and you never know... I still broke it." Why? Because I changed my moral status.
      *   *The Commitment:* I will argue that a promise is an act of **self-binding**. It's not about the consequence; it's about the integrity of the agent.

  5.  **Drafting - Iteration 1 (Mental Outline):**
