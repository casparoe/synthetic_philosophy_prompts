          *   Faction B uses Williams to say "art is separate." Williams did value art's autonomy, but he also believed ethical life is messy.
          *   *Synthesis:* Williams would reject the demand for a "moral verdict." The opera *is* the ethical exploration, not a sermon. To change it to teach a lesson is to destroy its ethical truth.
      *   *Addressing Faction A (The Rejected Side):* Acknowledge their concern. #MeToo is real. The behavior is problematic. But art isn't a court of law. If we make Giovanni a villain in the staging, we lose the tragedy and the seduction of the music. We must trust the audience to grapple with the ambiguity.
