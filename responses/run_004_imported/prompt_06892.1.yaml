answer: |-
  **MEMORANDUM**

  **TO:** Governance Council
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Workshop Income and Bylaw Interpretation

  **Recommendation**
  I recommend the Council rule that revenue from the workshops is **fully poolable income** under our existing bylaws. However, to address the specific claim regarding house resources, I propose we authorize a **one-time retrospective credit** paid from the common fund to our housemate, valued at the market rate for the pilot workshops she conducted for residents prior to monetization.

  Regarding future cases, I recommend we adopt a precedent distinguishing between **Personal Capital** (skills developed independently, fully poolable upon monetization) and **House IP** (ventures explicitly piloted or branded using house assets), the latter requiring a pre-launch agreement on royalty or credit.

  **Rationale: The Contractual vs. The Natural**
  The core of the objection rests on a Nozickian entitlement argument: that voluntary transactions between our housemate and her students generate a new entitlement that overrides prior distributional patterns. This argument holds force against state coercion, where citizens have not explicitly consented to specific redistributive patterns. It does not hold here.

  Our bylaw is not a patterned principle imposed on a natural state; it is a **pre-commitment device** voluntarily adopted by all eight residents. When the students pay our housemate, they are paying *her*, but her entitlement to that money is already encumbered by her prior voluntary contract with us. To use Nozick's terms: the "initial state" (D1) was not a generic libertarian distribution, but a specific contractual framework where future earnings above a stipend were defined as common property. The voluntary transfers from students move us to D2, but D2 is only just if it respects the prior constraints of D1. Exempting this income now would be to retroactively void a term of the contract because it has become costly for one signatory. That undermines the trust required for the house to function.

  **Rationale: Insurance and Adverse Selection**
  Functionally, our income pool operates as mutual insurance. Insurance relies on risk-pooling across time and luck. If members contribute when earnings are low but withhold when earnings are high (adverse selection), the fund collapses precisely when it is most needed by others taking risks. If we grant an exemption here, we establish that the bylaw is optional upon success. This effectively converts the arrangement from "insurance" to "welfare," where only the unlucky contribute. That is not the community we agreed to build.

  **Addressing the Counter-Argument: House Resources**
  The strongest form of the opposing argument is not the Nozickian liberty claim, but the **equity claim**: that the venture relied on house-specific capital (free pilot audiences, address credibility, referrals) which was not compensated. If we treat this income as purely individual, we ignore the communal seed investment.

  However, exempting the income is the wrong remedy. It conflates *labor* with *capital*. The house provided early-stage R&D support (the pilots). The correct remedy is to compensate that labor, not to surrender the revenue stream. By issuing a one-time credit for the pilot hours, we acknowledge the house's contribution without breaking the pooling mechanism. This validates the council's intuition that she didn't do this entirely alone, without validating the claim that the resulting income is hers alone.

  **Precedent for Future Ventures**
  To prevent recurrence, we should clarify the bylaws:
  1.  **Default Rule:** All outside earnings are poolable, regardless of source (wages, equity, or business revenue).
  2.  **House IP Clause:** If a venture utilizes significant house resources (e.g., testing on residents, use of house brand), the member must disclose this prior to monetization. The Council may then assign a one-time credit or a small royalty to the fund, but the net income remains poolable.
  3.  **Exit Clause:** If a member wishes to retain full ownership of a high-earning venture, they may opt out of the income-sharing arrangement entirely, reverting to a market-rate rent contribution. They cannot opt out of the *obligation* while opting in to the *security*.

  **Conclusion**
  We must uphold the bylaw to preserve the integrity of our risk-sharing pact. The Nozick objection fails because our arrangement is founded on explicit consent, not coercion. However, we should honor the specific debt owed for the pilot work via a credit. This maintains the principle of pooling while acknowledging the communal labor that aided her success.

  I move we vote to affirm the income as poolable, with a directive to calculate the pilot credit at the next meeting.
