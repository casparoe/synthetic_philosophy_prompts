answer: |-
  Your intuition is spot-on. As a physicist, you recognize that averaging a high-precision measurement with low-precision noise degrades the signal-to-noise ratio. The standard "textbook" interpretation of the Condorcet Jury Theorem (CJT) often glosses over a critical assumption: **homogeneous competence**.

  The theorem states that if voters are independent and *all* have $p > 0.5$, the majority accuracy approaches 1 as $n \to \infty$. However, if competencies are heterogeneous (varying $p_i$), a simple unweighted majority can absolutely perform worse than the single best expert.

  Here is the concrete 3-juror example you requested, worked out with explicit probabilities.

  ### The Experimental Setup

  We have 3 jurors making a binary decision (True/False). They are independent (their errors are uncorrelated).

  *   **Juror A (The Expert):** $p_A = 0.90$ (90% accuracy)
  *   **Juror B (The Novice):** $p_B = 0.55$ (55% accuracy)
  *   **Juror C (The Novice):** $p_C = 0.55$ (55% accuracy)

  **Constraints Check:**
  1.  **Independence:** Assumed (probabilities multiply).
  2.  **Better than Chance:** All $p_i > 0.5$.
  3.  **Goal:** Prove $P(\text{Majority Correct}) < p_A$.

  ### The Data Analysis

  For a 3-person majority to be correct, at least 2 jurors must be correct. There are four mutually exclusive scenarios where the majority verdict is correct:

  1.  **All three correct:** ($A \cap B \cap C$)
  2.  **A & B correct, C wrong:** ($A \cap B \cap C^c$)
  3.  **A & C correct, B wrong:** ($A \cap B^c \cap C$)
  4.  **B & C correct, A wrong:** ($A^c \cap B \cap C$)

  *Note: Scenario 4 is the critical one. This is where the two novices outvote the expert, and they happen to be right.*

  Let's calculate the probability of each scenario:

  1.  $P(\text{All}) = 0.90 \times 0.55 \times 0.55 = \mathbf{0.27225}$
  2.  $P(A, B \text{ only}) = 0.90 \times 0.55 \times 0.45 = \mathbf{0.22275}$
  3.  $P(A, C \text{ only}) = 0.90 \times 0.45 \times 0.55 = \mathbf{0.22275}$
  4.  $B, C \text{ only (Expert Overruled)} = 0.10 \times 0.55 \times 0.55 = \mathbf{0.03025}$

  **Total Probability of Majority Correct:**
  $$P(\text{Maj}) = 0.27225 + 0.22275 + 0.22275 + 0.03025 = \mathbf{0.748}$$

  ### The Result

  *   **Reliability of Expert Alone:** $0.90$
  *   **Reliability of Majority Vote:** $0.748$

  **Conclusion:** By adding two independent jurors who are individually better than chance, we have **reduced** the reliability of the decision by **15.2 percentage points**.

  ### The "Physics" of the Failure

  Why does this happen? It helps to look at the error propagation, similar to how you'd analyze measurement uncertainty.

  The group fails in two ways:
  1.  **The Expert fails, and the Novices fail to save them.**
      *   Expert is wrong (10% chance).
      *   Novices both need to be right to save the vote ($0.55 \times 0.55 \approx 30\%$).
      *   *Gain from pooling:* The novices rescue the decision only $3\%$ of the time ($0.10 \times 0.30$).
  2.  **The Expert succeeds, but the Novices drag them down.**
      *   Expert is right (90% chance).
      *   If *both* novices are wrong ($0.45 \times 0.45 \approx 20\%$), they overrule the expert and force a wrong verdict.
      *   *Loss from pooling:* The novices corrupt the decision $18\%$ of the time ($0.90 \times 0.20$).

  **Net Effect:** The "noise" introduced by the novices corrupting the expert's signal (18% loss) vastly outweighs the "signal" of the novices rescuing the expert's errors (3% gain).

  ### The Solution: Weighted Voting

  In your lab, you wouldn't average the readings; you would weight them by inverse variance (or precision). In voting theory, the equivalent is **Weighted Majority Voting**.

  The optimal weight $w_i$ for each voter is proportional to their log-odds ratio:
  $$w_i = \ln\left(\frac{p_i}{1 - p_i}\right)$$

  Let's weigh our jurors:
  *   **Expert:** $\ln(0.9/0.1) = \ln(9) \approx \mathbf{2.20}$
  *   **Novice:** $\ln(0.55/0.45) = \ln(1.22) \approx \mathbf{0.20}$

  If you use these weights, the Expert's vote (2.20) outweighs both Novices combined ($0.20 + 0.20 = 0.40$). The system effectively defaults to the Expert, preserving the 0.90 accuracy, but retains the capacity to overrule the Expert if the Novices are overwhelmingly confident (which, with these probabilities, they never will be).

  ### Summary for your Philosophy Notes
  The Condorcet Jury Theorem is not a law of nature that "more heads are always better." It is a specific claim about **uncorrelated, homogeneous** signals. When signal strength varies, unweighted averaging is mathematically guaranteed to be suboptimal. Your physicist's skepticism is fully justified by the probability calculus.
