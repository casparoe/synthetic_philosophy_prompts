answer: |-
  This is a sharp question that cuts to the heart of why the LessWrong rationalist community moved from standard Causal Decision Theory (CDT) and Bayesian updating toward Updateless Decision Theory (UDT) and Functional Decision Theory (FDT).

  You are correct that the Absent-Minded Driver (AMD) problem demonstrates a violation of **dynamic consistency**: the plan that is optimal ex-ante (at the start) is not the plan that appears optimal ex-post (at the intersection), once the driver updates on the fact that they are *at* an intersection.

  However, whether this proves Bayesian conditionalization is the "wrong norm" generally depends on whether you view decision theory as a set of logical constraints on belief (the orthodox view) or as a tool for achieving outcomes (the pragmatic/rationalist view).

  Here is a breakdown of why this happens, why orthodox Bayesians don't think it condemns their framework, and why the LessWrong crowd thinks it does.

  ### 1. The Technical Failure: Imperfect Recall
  The standard theorem in decision theory is that **ex-ante optimization and dynamic updating yield the same result if and only if the agent has perfect recall.**

  In standard sequential decision problems, when you reach a node, you know exactly which node it is and what path you took to get there. Therefore, your updated beliefs align perfectly with your prior plan. Bayesian conditionalization preserves dynamic consistency in these cases.

  The AMD problem violates the **perfect recall** assumption. Because the driver cannot distinguish Intersection 1 from Intersection 2, he suffers from "imperfect recall." When he arrives at an intersection, he gains self-locating evidence ("I am at an intersection"), but he cannot distinguish *which* one.
  *   **Ex-ante:** He knows he will face two intersections.
  *   **Ex-post:** He knows he is at *an* intersection, but the probability that it is the first vs. the second depends on the very strategy he is employing (specifically, the probability $p$ of continuing).

  This creates a feedback loop: his belief about where he is depends on his action, but his optimal action depends on his belief about where he is. Standard Bayesian conditionalization does not have a built-in mechanism to resolve this fixed-point problem without violating dynamic consistency.

  ### 2. The Orthodox Defense: "The Map is Not the Territory"
  Mainstream game theorists and Bayesians (like Aumann, despite his work on this specific puzzle) generally argue that this does not invalidate Bayesian conditionalization as a norm. Their argument runs as follows:

  *   **Bayesianism is about coherence, not winning:** Bayesian conditionalization is a rule for maintaining logical consistency between priors and posteriors given new information. If the information structure is pathological (i.e., you forget where you are), the resulting incoherence is a feature of the memory architecture, not the updating rule.
  *   **Precommitment is external:** In standard economics, if an agent knows they will be time-inconsistent, the solution is to **precommit**. The fact that the driver *cannot* precommit (or rather, the model assumes he re-optimizes at every node) is a constraint of the scenario. If the driver could bind himself to the $p=2/3$ strategy ex-ante, he would. The failure is in the *agency*, not the *probability theory*.
  *   **Applicability:** They argue Bayesian updating remains the correct norm for all cases *with* perfect recall. Since most real-world decisions involve perfect recall (you remember you already checked the stove), AMD is a edge case, not a general refutation.

  ### 3. The LessWrong/UDT Critique: "Rationality is Systematic Winning"
  The community around LessWrong (Eliezer Yudkowsky, Wei Dai, etc.) rejects the orthodox defense. Their core axiom is that a decision theory should be judged by the outcomes it produces. If a decision procedure leads you to take actions that you knew in advance would lower your expected utility, that procedure is defective.

  From this perspective:
  *   **Updating can be harmful:** In AMD (and Newcomb's Problem, and Parfit's Hitchhiker), updating on your current situation provides "evidence" that correlates with the outcome in a way that tempts you to defect from the winning strategy.
  *   **The Norm should be Updateless:** You should not ask "What is optimal given that I am here?" but "What policy would I have wished I committed to before I knew where I was?"
  *   **Generalization:** This isn't just about highway intersections. It applies to any situation where your decision algorithm is predicted by others (or by the environment) based on its source code rather than its specific output in the moment. If you update, you become unpredictable to your past self, and you lose the benefits of coordination with your past self.

  So, to answer your specific question: **Yes, from the UDT perspective, this shows that ordinary Bayesian conditionalization is the wrong norm for decision-making.** It should be replaced (or supplemented) by a rule that selects policies ex-ante and executes them without re-evaluation, effectively treating your decision as a logical output of a fixed function rather than a causal event at a specific time.

  ### 4. Is it "Simply the Wrong Norm" Generally?
  Does this condemn Bayesianism for *all* decisions where new information arises?

  **No, but it restricts its domain.**
  Bayesian conditionalization remains the gold standard for **belief revision**. If you learn it is raining, you should update your probability of the ground being wet. The AMD problem suggests that **decision rules** should not necessarily track **belief updates** one-to-one in cases of self-locating uncertainty or logical correlation.

  The lesson is not "never update beliefs," but rather "do not let updated beliefs dictate your action if doing so violates a higher-utility policy you would have selected ex-ante."

  This distinction is crucial. In standard problems (perfect recall), the policy that maximizes ex-ante utility is the same as the policy that maximizes ex-post utility after updating. In AMD (and Newcomblike problems), they diverge. Therefore:
  1.  **In Perfect Recall contexts:** Bayesian updating + CDT works fine.
  2.  **In Imperfect Recall/Logical Correlation contexts:** Bayesian updating + CDT fails. You need Updateless Decision Theory (or FDT).

  ### 5. Conclusion
  The Absent-Minded Driver does not prove that probability theory is broken. It proves that **naive dynamic decision making** (re-optimizing at every step based on current local information) is vulnerable to memory loss and self-locating uncertainty.

  If you define "rationality" as adhering to the axioms of Bayesian updating at every moment, then AMD is a paradox where rationality loses.
  If you define "rationality" as winning (maximizing utility), then AMD proves that you must sometimes ignore the implications of your current evidence in favor of a global policy.

  The LessWrong consensus is the latter: **Bayesian conditionalization is a tool for managing uncertainty, but it is not a complete decision theory.** When the structure of the problem links your beliefs to your actions via imperfect recall or prediction, the norm shifts from "maximize expected utility given current beliefs" to "execute the policy that maximizes expected utility given prior beliefs."

  So, you are right to be suspicious of updating as a universal decision norm. It is a reliable norm for *belief*, but a hazardous norm for *policy* in cases involving self-reference, prediction, or memory loss.
