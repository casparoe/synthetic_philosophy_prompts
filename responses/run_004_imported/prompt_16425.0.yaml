      *   *The Standard Defense (Perfect Recall):* Explain that standard Bayesian decision theory assumes perfect recall. When that assumption is violated, standard theorems (like dynamic consistency) don't hold. So, Bayesianism isn't "wrong," it's "inapplicable" in its standard form.
