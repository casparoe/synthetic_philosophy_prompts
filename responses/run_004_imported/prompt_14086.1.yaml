      *   *Crucial Point:* Chrysippus tells the sage to stop answering. He doesn't say "There is a number, but you can't know it." He says "Do not assent." This aligns with the *action* of epistemicism (don't claim knowledge) but the *reason* is Stoic ethics/epistemology, not semantic margin for error.

