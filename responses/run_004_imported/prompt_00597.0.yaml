prompt: |-
  So I'm teaching a philosophy of religion seminar this semester and we just spent two weeks on the Euthyphro dilemma, and honestly I'm a little sick of giving students the freshman version of it (is it good because God commands it, or does God command it because its good, etc). What I actually want them to see is the move a step further down the dialectic -- the "third horn" that people like Robert Adams push, where you dodge the arbitrariness horn by saying moral goodness just IS God's nature, not some external standard he consults and not a free choice of his will either, while obligation specifically is what comes from the commands of a being with that nature. I've been arguing with a colleague down the hall about whether this actually works or just relocates the problem, and we can't settle it, so now I want to see it played out properly.

  Could you write me a dialogue between two people who end up arguing about this at a wine-and-cheese thing after a colloqium talk? Call the one who just gave the talk Renata -- she's a confident, sharp defender of the modified view and thinks she's found genuine daylight between the two horns. The other, Josh, is sympathetic to theism generally but keeps pressing the worry that identifying goodness with God's nature doesn't answer Euthyphro's question so much as relocate it one level up: is God's nature good because it has certain properties (which brings the independent standard back in through the side door), or is it good simply in virtue of being God's (which seems to make "God is good" no more informative than "God is God-like")? I don't want Renata to just repeat the original move when Josh presses this -- she should have real moves available -- and I don't want Josh to just restate the regress each time either; he should actually engage with whatever she says. Give me maybe a dozen or so exchanges, and don't let either of them win outright -- I think that's honestly where the actual debate stands.
