answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague of Warren's. For the last decade, I've also been the person unlucky enough to co-teat a law-and-philosophy seminar with him.

  When you've taught with someone for ten years, you learn their rhythms. You learn where they pause, where they pace, and you definitely learn their favorite lines. And if you've ever been a clerk in Warren's chambers, or sat in on one of our lectures, you know there is one sentence that belongs to him as much as his gavel.

  "Justice without force is powerless; force without justice is tyrannical."

  Warren loved that line. He'd trot it out for incoming clerks, for law students, sometimes, I suspect, just to hear how it sounded bouncing off the wood paneling. It's a perfect sentence. It sounds wise, it sounds balanced, and it sounds like something a judge *should* say.

  But there is a secret. And since this is a retirement party, I figure the statute of limitations has expired.

  That line is from Pascal's *Pensées*. But Pascal doesn't stop there. As Warren was happy to point out to me over lunch one Tuesday—while I was trying to eat a sandwich—he insisted that the quote is actually bait. Pascal goes on to argue that laws aren't followed because they are inherently "just." They are followed because they are established, and because there is force behind them. He talks about how what is a crime on one side of a river is perfectly legal on the other. He suggests that we call it "justice" mostly to keep the peace, and that admitting it's just dressed-up force would be dangerous.

  Now, I know what some of you are thinking. You're thinking, "Wait, did Warren just spend thirty years telling us that the law is basically a sophisticated con?"

  And to the family members looking slightly worried: No. He didn't.

  But here is the thing that the seminar alumni know, and what I want to propose to the rest of you. Warren didn't love that darker, cynical half of Pascal's argument because he didn't believe in justice. He loved it because he believed in *responsibility*.

  If you think the law is magic—that justice is some glowing aura that automatically surrounds a judge when they put on the robe—you get lazy. You think the authority is in the cloth. But Warren knew the authority is in the work. He knew that "justice" is fragile. He knew that without scrupulous care, without fairness, without checking his own ego at the door, the "force" part of the equation swallows the "justice" part every time.

  He knew the system was human, which meant it was breakable. And because he knew it was breakable, he handled it like it was made of glass.

  I've watched him dismantle a brilliant argument from a young lawyer with more kindness than I've ever seen. I've watched him write opinions that acknowledged the gray areas instead of pretending they were black and white. He didn't rely on the mystique of the bench. He relied on the integrity of the person sitting on it.

  Warren used to love watching the faces of first-year clerks when he walked them through the "river" argument. He said their faces would fall like he'd just told them there was no Santa Claus. I think he enjoyed that moment not because he wanted to depress them, but because he wanted to wake them up. He wanted them to know that *they* had to be the ones to make it just. The system wouldn't do it for them.

  So, in a way, the cynicism was the engine of his idealism. Because he knew justice doesn't happen by accident, he made sure it happened on purpose. Every single day. For over thirty years.

  Warren, you taught me that knowing the world isn't perfect doesn't give you an excuse to make it worse. It gives you a mandate to make it better. You were the force, yes. But you made damn sure you were the justice, too.

  Ladies and gentlemen, please raise your glasses. To Warren: who knew the law was complicated, but never let that stop him from keeping it fair. To Warren.
