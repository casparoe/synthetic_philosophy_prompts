answer: |-
  **The Lawless Earth: Why Historical Explanation Does Not Need Physics to Be Real**

  It is entirely understandable why the history of plate tectonics bothers you. You spent a career operating within the Deductive-Nomological (D-N) model of explanation: take a universal law, add initial conditions, and derive the phenomenon. In geophysics, if you cannot derive the anomaly from the field equations, you haven't explained it; you've just described it. When you read a historian account of the tectonic revolution that relies on "contingent details"—who had funding, who was stubborn, which ship was in the Atlantic—it feels like noise. To a scientist, noise is what you filter out to find the signal. To a historian, that noise *is* the signal.

  You have encountered the central debate in the philosophy of history: Carl Hempel's "Covering Law" model versus the rival traditions of Rational Explanation (William Dray) and Narrativism/Colligation (W.H. Walsh, Arthur Danto, Hayden White). You want to know if history is just incomplete science, or if it is a different epistemic game entirely.

  Here is the verdict: **Hempel is wrong.** Historical explanation does not rely on tacit general laws, nor is it an "incomplete" version of scientific explanation. It is a distinct, autonomous form of understanding that explains human events through *narrative colligation*, not subsumption. To demand general laws for the history of the tectonic revolution is a category error. It is like demanding the rules of grammar to explain the plot of a novel. The narrative *is* the explanation.

  ### The Strongest Case for Hempel: The Dream of Unity

  To do justice to Hempel, we must acknowledge why his 1942 paper, "The Function of General Laws in History," is so seductive to a scientist. Hempel argued that to explain an event $E$ is to show that $E$ was to be expected given certain antecedent conditions $C$ and a universal law $L$.

  $$C + L \rightarrow E$$

  In your work, $L$ might be the conservation of mass or the equations of fluid dynamics. In history, Hempel admitted, we rarely state $L$ explicitly. He called these "explanation sketches." For example, if a historian explains the Dust Bowl by citing drought and poor farming practices, Hempel would say there is a tacit law lurking underneath: *"Whenever soil is exposed to high winds without root structures during a drought, erosion occurs."*

  The strength of this position is its rigor. It prevents history from drifting into mysticism or "great man" mythology. It insists that historical events are part of the causal fabric of the universe, subject to the same logical scrutiny as planetary motion. For a geophysicist, this offers comfort: it suggests the world is uniform. If the acceptance of plate tectonics is explainable, there must be a reason why it *had* to happen that way, given the conditions. It promises that history is rational because it is lawful.

  ### The Collapse of the Covering Law in Human Affairs

  However, the Covering Law model collapses when applied to the human decisions that drive history. The problem is not that historians are lazy and forget to write down the laws. The problem is that the laws do not exist.

  When we try to formulate the "laws" of human behavior required to make Hempel's model work, they turn out to be either false or trivial.
  1.  **False:** "Scientists always accept the theory with the most empirical support." This is empirically false. As your book noted, the Cambridge crowd rejected continental drift for decades despite evidence, due to institutional inertia and lack of a mechanism.
  2.  **Trivial:** "People act in ways they believe will achieve their goals." This is a tautology. It defines action rather than predicting it. It cannot explain *why* a specific goal was chosen or *why* a specific belief was held in 1965 but not 1955.

  In the plate tectonics case, a Hempelian explanation would look like this: *"When magnetic striping data reaches threshold $X$, and funding availability is $Y$, the scientific community shifts consensus."* This is not a law; it is a description of the specific event you are trying to explain. There is no independent warrant for this "law" other than the event itself. If the community *hadn't* shifted, we wouldn't say the law was falsified; we'd say the conditions weren't right. This makes the "law" unfalsifiable and therefore useless.

  Hempel treats the "contingent details" (the specific ships, the specific arguments) as initial conditions ($C$). But in history, the *connection* between those conditions and the outcome is not logical necessity; it is contingent linkage. The world could have been otherwise. Funding could have gone elsewhere. A key proponent could have died. Hempel's model cannot handle this radical contingency without breaking.

  ### Dray and the Logic of Rational Explanation

  This is where William Dray offers a crucial correction. In *Laws and Explanation in History* (1957), Dray argued that explaining human action is not about showing what an agent *was caused to do*, but what it was *reasonable for them to do*.

  Dray calls this "rational explanation." To explain why Harry Hess proposed seafloor spreading, you do not need a law of "geologist behavior." You need to reconstruct Hess's situation: his access to the topographic data, his knowledge of the lack of a mechanism for drift, his goal of resolving the paleomagnetic anomalies. Once you see the situation from Hess's perspective, the action becomes intelligible. It wasn't *caused* by a law; it was *adopted* as a solution.

  Dray's model is superior to Hempel's because it respects agency. However, it still has a limitation for your specific problem. The acceptance of plate tectonics wasn't just the action of one rational agent; it was a collective, messy, social shift. Some people were rational, some were stubborn, some were influenced by funding, some by prestige. Dray explains the *action*, but he doesn't fully explain the *process*. For that, we need the third concept: Colligation.

  ### Colligation: The Narrative as Explanation

  Colligation (a term popularized by W.H. Walsh) is the practice of binding a mass of events together under a unifying theme or narrative structure. This is where the historian's "story" earns its explanatory keep.

  You asked: *"If a historian's story doesn't do that [derive from law], is it really explaining anything, or just describing it well?"*

  The answer is that in history, **configuration is explanation.**

  Consider the difference between a list and a sentence. A list describes: "King died. Queen died." A sentence explains: "The King died, and then the Queen died of grief." The second sentence adds no new empirical data, but it adds a *connection*. It makes the sequence intelligible.

  In the plate tectonics revolution, the "contingent details" you found frustrating are actually the causal mechanisms.
  *   **The Law View:** Sees "funding shift" as an initial condition $C_1$.
  *   **The Narrative View:** Sees "funding shift" as a plot point that enabled the ship surveys which produced the data that undermined the Cambridge resistance.

  The narrative explains *how* the initial conditions led to the outcome by tracing the pathway of influence. It shows the *relevance* of the details. Why mention the specific ship surveys? Because without them, the magnetic striping data remains ambiguous. Why mention the Cambridge crowd? Because their resistance defines the magnitude of the paradigm shift.

  A narrative explains by showing how a specific outcome emerged from a field of possibilities. It does not say "Outcome $O$ was inevitable given Law $L$." It says "Outcome $O$ became actual because Path $P$ was taken, blocking Paths $Q$ and $R$." This is genuine explanation. It provides **intelligibility**. It answers the question "How could this have happened?" rather than "What law forced this to happen?"

  ### The Plate Tectonics Test Case

  Let's apply this to your specific frustration. You read a history where the acceptance of plate tectonics depended on "who convinced whom and when."

  If you apply Hempel, you are left waiting for a law: *"Under conditions of anomalous magnetism, senior geologists will change their minds."* This law doesn't exist. If you wait for it, you will never have an explanation.

  If you apply Colligation, the "story" *is* the explanation. The narrative binds together the geophysics (the data), the sociology (the Cambridge resistance), and the logistics (the ship surveys). It explains the acceptance of the theory by showing how the *meaning* of the data changed for the community. The magnetic stripes didn't just "cause" acceptance; they had to be *interpreted*. The narrative explains the interpretation process.

  The "contingency" is not a bug; it is a feature. If the explanation relied on a general law, the specific identities of the scientists wouldn't matter. But they *did* matter. If Vine and Matthews hadn't published when they did, or if Tuzo Wilson hadn't championed the transform faults, the timeline would have shifted. A law-based explanation must treat these as noise. A narrative explanation treats them as the very fabric of the causality.

  ### The Verdict: Intelligibility Over Subsumption

  So, here is the side I am taking, without hedging: **Historical explanation is autonomous and does not require general laws to be genuine.**

  The demand for laws in history is a form of "physics envy." It assumes that because physics is the most successful method for explaining *natural* phenomena, it must be the template for all explanation. This is false. Physics explains events by subsuming them under regularities (things that happen the same way every time). History explains events by configuring them into a unique sequence (things that happened *this* way, *this* time).

  There are two types of "why" questions:
  1.  **Why necessarily?** (The Geophysicist's Question). This seeks a law. "Why did the subduction zone melt?" Because the pressure/temperature exceeded the solidus. This requires a law.
  2.  **Why contingently?** (The Historian's Question). This seeks a narrative. "Why was the theory accepted in 1968?" Because the data converged with a generation shift in leadership. This requires a story.

  When you read that history book, you were looking for a Type 1 answer to a Type 2 question. The book was not failing to explain; it was explaining in the only mode available for human events.

  Does this mean "anything goes"? No. A historical narrative is not fiction. It is constrained by evidence, just as a physical model is. The historian cannot invent the ship surveys or the dates of the papers. The narrative must be the *best fit* for the evidence, just as a curve fit must be the best fit for the data points. But the "fit" is not a mathematical function; it is a coherence of meaning.

  ### Conclusion

  You are a geophysicist. You know that the earth operates by laws. The movement of the plates is lawful. But the *acceptance of the theory of plates* is a human event, and human events are not governed by laws of nature; they are governed by reasons, contexts, and contingencies.

  Hempel was trying to save history from subjectivity by forcing it into the mold of science. In doing so, he missed what makes history valuable. We do not study the history of science to learn the laws of scientific progress (because there are none). We study it to understand how knowledge is actually forged in the messy reality of human institutions.

  The narrative account of plate tectonics *does* explain the phenomenon. It explains it by making the sequence of events intelligible, showing how the resistance was overcome, how the evidence was marshaled, and how the community changed its mind. It does not need a general law to validate this. To insist on one is to misunderstand the nature of the past. The past is not a laboratory experiment waiting to be replicated; it is a story waiting to be told. And a well-told story, bound by evidence and logic, is a genuine explanation.
