answer: |-
  David Lewis's "Humean Supervenience" (HS) is, in many respects, a magnificent piece of systematic metaphysics. But if we strip away the technical apparatus of possible worlds and supervenience bases and look strictly at the philosophical method and commitments of David Hume himself—as laid out in *A Treatise of Human Nature* and *An Enquiry Concerning Human Understanding*—it becomes clear that Hume would likely reject Lewis's doctrine as a betrayal of his own skepticism. 

  Hume would not side with Lewis in trying to save the "mosaic" against quantum mechanics. Instead, he would argue that Lewis's commitment to a spatiotemporal arrangement of *local intrinsic qualities* is precisely the kind of dogmatic hypothesis about the "secret springs" of nature that Hume's empiricism was designed to dismantle. A consistent Humean empiricist should not view entanglement as a threat to be resisted, but as a regularity to be accepted, rendering the metaphysical demand for locality superfluous.

  Here is the defense of this reading, based on three core divergences between Hume's actual philosophy and Lewis's reconstruction.

  ### 1. Ontology vs. Epistemology: The "Intrinsic Qualities" Problem
  Lewis's HS is an ontological thesis: it claims that the world *is* composed of a mosaic of local, intrinsic qualities. Every truth about the world must be grounded in this arrangement. Hume, by contrast, offers an epistemological limitation. When Hume argues against necessary connection, he is not making a claim about how the world *must* be structured; he is making a claim about what the human mind can *conceive* and *justify*.

  In the *Enquiry* (Section 4, Part 1), Hume famously notes that we are ignorant of the "secret powers" by which objects operate. We see the constant conjunction of events, but the "tie" that binds them is inaccessible. Lewis turns this ignorance into a positive ontology: because we cannot know necessary connections, we should posit a world where they don't exist (or where they supervene on local facts). 

  Hume would object that positing "local intrinsic qualities" is itself a hypothesis about the intrinsic nature of matter. In the *Treatise* (1.4.5), Hume expresses deep skepticism about the idea of "substratum" or inherent properties independent of perception. He writes that the idea of body is nothing but a collection of sensible qualities. To insist that the supervenience base *must* be local and intrinsic is to claim knowledge of the intrinsic nature of physical reality that Hume explicitly disavows. If quantum mechanics suggests that the fundamental state of a system is holistic (non-separable), Hume has no epistemic ground to say, "No, reality must be local." To do so would be to engage in the very *a priori* speculation about the essence of matter that he criticized in the Scholastics and rationalists.

  ### 2. Contiguity as Empirical Generalization, Not Modal Constraint
  A proponent of HS might point out that Hume *did* require causation to involve contiguity in space and time. In the *Treatise* (1.3.2), Hume lists contiguity as one of the three essential relations of cause and effect. If Hume demanded contiguity, doesn't that support Lewis's demand for locality?

  No, because for Hume, contiguity is a generalization from experience, not a modal constraint on reality. Hume derives his principles of association from observing how ideas and impressions actually behave. In the 18th century, all observed physical interactions appeared local. Hume generalized this into his definition. However, Hume's method is radically fallibilist regarding matters of fact. 

  In the *Enquiry* (Section 12), Hume emphasizes that *a posteriori* reasoning is the only guide to matters of fact. If new experiments (like Bell tests) demonstrate correlations that do not respect classical contiguity, the Humean method requires updating the generalization, not rejecting the data to save the principle. Lewis treats locality as a constraint on what counts as a "Humean" world; Hume treats it as a description of the world as he found it. To privilege the metaphysical principle over the empirical finding is to reverse Hume's priority of experience over hypothesis. Hume would tell Lewis that insisting on locality in the face of Bell violations is a form of "rationalist" dogmatism—clinging to an abstract principle of separability rather than following the evidence.

  ### 3. The Nature of "Necessary Connection"
  The deepest irony is that Lewis and the anti-Humeans (like Maudlin) agree on something Hume would reject: that there is a substantive metaphysical question about whether laws *govern* the mosaic. Lewis tries to save the mosaic by reducing laws to summaries; Maudlin attacks the mosaic to save robust laws. Both treat "laws" and "chances" as ontological categories that need grounding.

  For Hume, "necessity" is not in the objects; it is a determination of the mind (*Treatise* 1.3.14). When we say A causes B, we mean we have observed A and B conjoined repeatedly, and our mind forms a custom of expecting B given A. 

  Apply this to entanglement. We observe that measuring particle A is constantly conjoined with a specific state of particle B, regardless of distance. For Hume, *that is the causal relation*. There is no further fact about "local mechanisms" or "non-local influences" that needs to be resolved metaphysically. The anxiety about non-locality arises because physicists and metaphysicians want to know *how* the influence travels. Hume's response to the "how" is always the same: we cannot know. We only know the regularity.

  Lewis worries that if the correlations don't supervene on local facts, then there are "necessary connections between distinct existences." But Hume's principle that "there is no object which implies the existence of any other if we consider these objects in themselves" (*Treatise* 1.3.6) is a principle about *conceivability*, not physical possibility. We can *conceive* of particle A existing without particle B. That we find in nature that they are inextricably linked is a matter of fact, not a violation of logic. Lewis transforms Hume's logical point (distinct existences are separable in the imagination) into a physical point (distinct existences must be separable in spacetime). Hume would see this as a category error. The "threat" of entanglement exists only if one assumes the world *ought* to conform to our imaginative separability. Hume's skepticism warns us precisely against assuming the world conforms to the structures of our imagination.

  ### Conclusion: The Skeptic vs. The System-Builder
  David Lewis was a system-builder who used Hume's name to anchor a rigorous, realist metaphysics. David Hume was a skeptic who used argument to dissolve metaphysics. 

  If presented with the choice between accepting the empirical results of quantum mechanics and maintaining the thesis that all facts supervene on local qualities, Hume would not hesitate. He would view the "Humean mosaic" as a theoretical construct that has outlived its empirical utility. He would argue that Lewis's reluctance to revise his metaphysics on the strength of "interpretively unsettled" physics is actually a failure of empiricist nerve. For Hume, metaphysics is always subservient to experience. If experience (via the apparatus of physics) suggests non-separable states, then the doctrine of separability must yield.

  Hume would likely conclude that Lewis's "Humean Supervenience" is not Humean enough. It smuggles in a rationalist commitment to locality and intrinsic natures under the guise of empiricism. A true follower of Hume would shrug at non-local correlations, accept the constant conjunctions where they are found, and remind the metaphysicians that demanding a local mechanism is just another futile quest for the "secret springs" of nature that we can never access. The "threat" to Humean supervenience is a threat only to Lewis's ontology; for Hume's epistemology, it is simply more data.
