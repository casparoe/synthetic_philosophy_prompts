answer: |-
  This is an incredibly painful and high-stakes situation, and it is understandable that you and your mother are at odds. You are dealing with a crisis that sits right at the intersection of love, law, ethics, and neurobiology.

  To answer your specific question: **Yes, this dilemma has a name.** In ethics and rationalist circles, this is called a **Ulysses Contract** (or Ulysses Pact). In medical and legal terms, it is a **Psychiatric Advance Directive (PAD).**

  Here is an outside take on the dynamics at play, the ethical framework, and how these situations are generally navigated by professionals.

  ### 1. The Ethical Framework: Precedent Autonomy vs. Current Autonomy
  The conflict between you and your mom is a classic debate in bioethics: **Precedent Autonomy** (your position) vs. **Current Autonomy** (your mom's position).

  *   **Your Mom's View (Current Autonomy):** She believes the person in front of her right now has the right to decide what happens to her body. This is the default standard in medicine for competent adults.
  *   **Your View (Precedent Autonomy):** You believe the "competent self" (the sister from six months ago) made a rational plan for the "incompetent self" (the sister in mania).

  **The Medical Consensus:** In the context of severe bipolar disorder, the medical and legal consensus generally sides with **you**.
  Mania often involves *anosognosia* (a neurological lack of insight). When your sister is manic, her brain is literally not processing risk, consequence, or reality accurately. The "her" signing the paper six months ago was the "her" with decision-making capacity. The "her" refusing help today is clinically viewed as lacking that capacity.

  The entire purpose of a Psychiatric Advance Directive is to acknowledge that the illness *predictably* steals the ability to choose treatment. If you honor her current refusal, you effectively render the document she signed with a lawyer and doctor meaningless.

  ### 2. The Legal and Practical Reality
  You mentioned she signed this with a psychiatrist and a lawyer. This suggests it is a formal **Psychiatric Advance Directive (PAD).**

  *   **Legal Weight:** In many jurisdictions, a PAD is legally binding. It is not just a "promise"; it is a medical order that survives the loss of capacity.
  *   **The Psychiatrist's Role:** This is the most critical variable. You and your mom should not be the ones physically forcing her. **The psychiatrist needs to be the one to make the call.**
      *   If the psychiatrist evaluates her and determines she meets the criteria for a hold (danger to self/others or gravely disabled), the paper makes the decision much clearer.
      *   If the psychiatrist honors the PAD, it removes the burden of "betrayal" from the family. You aren't overriding her; you are facilitating *her own prior instructions.*

  ### 3. Who is "Right"?
  While family dynamics are never black and white, **ethically and medically, your position is the one that aligns with the purpose of the document and the nature of the illness.**

  Your mom is operating out of immediate empathy. Seeing her child distressed and angry triggers a protective instinct to stop the immediate conflict. That is a natural maternal response, but in this specific medical context, it is potentially dangerous. Honoring a manic refusal often leads to catastrophic outcomes (financial ruin, psychosis, physical danger, suicide) that the stable self explicitly tried to prevent.

  However, being "right" doesn't mean it won't feel like a betrayal to your sister in the moment. It likely will. But the goal of the Ulysses Contract is to prioritize **long-term well-being** over **short-term comfort.**

  ### 4. Immediate Steps
  1.  **Contact the Psychiatrist Immediately:** Do not debate this with your mom in a vacuum. Call the sister's treatment team. Tell them: *"She is manic, refusing care, and we have a signed Psychiatric Advance Directive stating she wants to be hospitalized in this exact scenario."* Let the medical professionals take the lead.
  2.  **Reframe for Your Mom:** Help your mom understand that respecting the *document* is actually respecting her *sister*. The sister she is trying to protect right now is the one who doesn't know she's sick. The sister she is betraying is the one who sat in that office six months ago and begged for help if this happened.
  3.  **Safety First:** If she is a danger to herself or others, standard involuntary commitment laws usually apply regardless of the paper. The paper simply clarifies her wishes regarding *who* makes the decision and *what* treatment she prefers.

  ### 5. A Note on the Relationship
  You are walking into a storm. When she stabilizes, she may be angry. She may feel violated. This is common. However, many people with bipolar disorder, once euthymic (stable), express profound gratitude that their family honored their Ulysses Contract, because they are aware of the damage they would have caused otherwise.

  **Summary:** You are not imagining this dilemma, and you are not being cruel. You are holding the line on a plan designed to save her from her own illness. Lean on the professionals who signed that document with her.

  ***

  *Disclaimer: I am an AI, not a lawyer or a doctor. Laws regarding Psychiatric Advance Directives vary significantly by state and country. Please rely on the guidance of the treating psychiatrist and legal counsel involved in your sister's care.*

  **If you believe your sister is in immediate danger, please contact emergency services or a crisis line immediately.**
  *   **US:** 988 Suicide & Crisis Lifeline
  *   **UK:** 111 or Samaritans (116 123)
  *   **International:** Please look up local emergency mental health services.
