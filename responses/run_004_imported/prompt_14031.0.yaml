answer: |-
  MEMORANDUM TO THE PANEL
  FROM: Judge Anton Reiff
  DATE: 14 October 1951
  SUBJECT: The State v. Elise V. (Denunciation Case)

  Colleagues,

  We must decide whether Elise V. stands trial for reporting her husband's remarks to the Security Office in 1944. Her defense is simple: she obeyed the law of the land. She is correct. Under the Decree for the Protection of State Morale, enacted 1942, her husband's joke was a capital offense. Her denunciation was not merely permitted; it was encouraged. To punish her now is to punish obedience.

  Yet, to acquit is to affirm that the Decree remains a shield against justice. We face a choice between two uncomfortable truths. The first is positivist: admit the old statutes were valid law, and that we are now enacting a retroactive penalty to punish acts previously lawful. This is honest. It acknowledges that we are breaking the principle of *nulla poena sine lege* to achieve a moral end. But it risks teaching the public that law is merely power, shifting from one master to another. It concedes that legality is separate from morality, and that we are simply the new wielders of force.

  The second path argues that the Decree was never law at all. I am initially resistant to this. It smells of judicial arrogance. Who are we to declare enacted statutes void based on our moral judgment? However, consider the context in which the Decree operated. Law requires an inner morality: it must be general, public, and applied consistently. It requires a reciprocity between ruler and ruled. The former regime offered none. The Security Office operated in shadow; trials were summaries; the "law" was a tool for terror, not order. When a statute is used not to guide conduct but to entrap citizens through vague prohibitions on "morale," it forfeits the claim to be treated as law.

  I propose we adopt this second view, but with caution. We cannot simply declare all prior statutes void. We must rule that the specific statutory framework relied upon by the defendant was so fundamentally contrary to the principles of justice that it cannot be recognized by this Republic. This is not merely retroactivity disguised; it is a determination that the previous order lacked legal validity where it violated fundamental human rights. We must articulate that a system which abandons the procedural safeguards of law ceases to generate legal obligations.

  Therefore, I recommend we deny the motion to dismiss. We will convict based on the principle that the old statutes are void *ab initio* regarding crimes against humanity and basic justice. We must not hide behind the claim that we are simply applying existing law, nor should we openly admit to retroactive punishment. We must argue that the law she cites was a counterfeit.

  Procedurally, we must move quickly before the press sensationalizes the "retroactivity" angle. I suggest we convene for final deliberation this Thursday at 0900. We should aim to issue a written opinion by Monday morning. I will draft the majority opinion if you concur. We must be unified. If we fracture, the public will see only politics.

  I remain, respectfully,

  Anton Reiff
