  2.  **Determine the Legal Position:**
      *   *Option A (Positivist/Hart):* The old law was valid. To punish her, we must pass a new retroactive law. This is honest but morally uneasy.
      *   *Option B (Natural Law/Fuller):* The old law was so immoral it wasn't law. She broke a higher law. No retroactivity needed.
      *   *Option C (Hybrid/Reiff's Choice):* Reiff is "meticulous and rather severe." He likely values legal stability but recognizes the moral catastrophe. A pure positivist approach feels like cowardice ("we need a new law to punish evil"). A pure natural law approach feels like judicial overreach ("we decide what is law based on morality").
      *   *Decision:* Reiff should probably lean towards a modified Fullerian position but acknowledge the Hartian critique. He needs to justify *why* the old statutes forfeited their legal character. This fits the "inner morality of law" argument (procedural natural law). The regime didn't just make bad laws; it made laws that weren't *laws* (secret, arbitrary, etc.). However, the prompt says the statutes were "by every formal test then in force, validly enacted." So Reiff needs to argue that formal validity isn't enough if the system itself abandoned the rule of law.
      *   *Actually, looking at the Radbruch Formula (real world equivalent):* Gustav Radbruch argued that positive law loses validity when it contradicts justice to an intolerable degree. This is often the bridge.
      *   *Reiff's Stance:* Conviction. But not via simple retroactivity. He should argue that the specific statute used to convict the husband was so contrary to the fundamental principles of justice that it cannot be recognized as law *now*, even if it was then. This avoids the dishonesty of pretending it was never law, but avoids the blunt instrument of ex post facto legislation. Wait, Hart criticized the "it wasn't law" argument as dishonest. Hart preferred open retroactivity. Fuller argued the system lost legitimacy.
      *   *Let's go with a Fullerian leaning:* The regime's use of law was instrumentalist, betraying the "inner morality." Therefore, reliance on those statutes is not protected.
      *   *Disposition:* Conviction. Reasoning: The statutes were void *ab initio* due to contravention of fundamental principles of justice (Radbruch/Fuller), OR we acknowledge the retroactivity but justify it as necessary to restore the legal order.
      *   *Better for drama/Reiff's character:* Reiff is meticulous. He might prefer the honesty of admitting retroactivity but justifying it, OR he might try to find a way that the old law wasn't actually valid because it violated procedural norms (secret police, lack of defense). The prompt says "by every formal test then in force, validly enacted." So Reiff must confront the validity.
      *   *Let's choose:* Conviction based on the principle that the old regime's statutes forfeited legal character when they were used to violate fundamental human rights (Radbruch/Fuller). He needs to acknowledge the risk (Hart's warning) but dismiss it in favor of justice.
      *   *Wait, Hart's point was:* Don't lie. Say "It was law, but we are punishing you anyway because it's necessary." Fuller's point: "It wasn't law because it violated the inner morality."
      *   *Reiff's Memo:* He should probably advocate for conviction. He needs to show he's thought about the danger of retroactivity. Let's have him argue that the *application* of the law was so arbitrary it voids the protection. Or, he takes the Hartian honest route: We must punish, so we must acknowledge the retroactivity.
      *   *Actually, the most interesting legal tension:* Reiff might argue for conviction but acknowledge the "retroactive" nature honestly, framing it as a transitional justice necessity, rather than hiding behind "it wasn't law." This shows sophistication. *However*, the Fullerian argument is more poetic for a novel about morality. Let's try to blend: The statutes existed, but the *legal order* collapsed.
      *   *Decision:* Reiff will argue for conviction. He will argue that while the statutes were formally valid, the regime's systematic betrayal of the inner morality of law (secret proceedings, no defense, disproportionate punishment) means those statutes cannot shield her now. He will acknowledge the Hartian critique (that this is effectively retroactive) but argue that preserving the *appearance* of continuity with such a regime is worse.
