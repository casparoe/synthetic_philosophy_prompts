      *   *Hart's Warning:* Hart says if you say "it wasn't law," you hide the choice. Reiff should acknowledge this. "We are making a choice."
      *   *Final Decision:* Reiff recommends conviction. He argues that the old statutes, while formally enacted, were applied in a manner that destroyed their legal character (procedural natural law). He acknowledges this is effectively retroactive but necessary to restore confidence in the law.

  5.  **Drafting the Content:**
