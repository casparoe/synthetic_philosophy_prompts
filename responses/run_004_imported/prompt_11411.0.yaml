      *   *Key Insight:* The Turing Test is supposed to be substrate-neutral. ESP introduces substrate-dependence (brains have it, machines don't).
      *   *The "Telepathy-Proof Room" Fix:* It's an admission that the test isn't perfect without controlling for non-computational factors.
