  *(Self-Correction during drafting)*: I need to be careful not to misrepresent Galen Strawson. He is very aware of the compatibilist objection. His point is that compatibilists are changing the subject. I need to address that head-on. My counter-argument must be that compatibilists are *correct* to change the subject because the original subject was nonsense.

