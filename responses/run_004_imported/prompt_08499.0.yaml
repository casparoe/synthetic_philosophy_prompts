      *   I need to make sure I don't sound like I'm hedging.
      *   *Thesis:* Galen Strawson's Basic Argument is a logical trap that proves nothing about human life because it demands an incoherent standard of agency. The character's worldview is a form of intellectual nihilism that collapses under the weight of actual human interaction.
