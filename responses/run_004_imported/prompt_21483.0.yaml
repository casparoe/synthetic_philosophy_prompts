answer: |-
  The ink in the pot had begun to skin over, a thin grey film that Humphrey had to break with the tip of his quill before every dip. It was January 1690, and the cold in Mr. Newton's chambers at Trinity College seeped through the stone walls as if the building itself were made of ice. Humphrey rubbed his gloved fingers together, blowing on them, before reaching for the next sheet of foolscap.

  He was not meant to read what he copied. He was a hand, not a mind. But the words had a way of sticking to the eye, especially when the master paced behind him, the floorboards groaning under a restless weight.

  "Leave the margin wide," Newton said. His voice was thin, high, and devoid of warmth. "The evidence requires space."

  Humphrey adjusted the paper. He looked down at the line he had just transcribed. It was familiar territory, the First Epistle of John. He knew the verse well from the liturgy. *For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one.*

  But on the page before him, the ink was different. Newton had not written the verse so much as dissected it. There were marks in the margins, references to Greek manuscripts, to Jerome, to the silence of the early fathers. The words *bear record in heaven* were struck through with a violence that had nearly torn the paper.

  "Sir," Humphrey ventured, dipping his quill again. "The text… it differs from the King James."

  Newton stopped pacing. He stood by the window, where the grey light of Cambridge filtered through the dust motes dancing above his prism. He had been experimenting with light again; the sill was scattered with lenses and notes on refraction.

  "The text," Newton said, turning slowly, "is a river. What we drink from now is muddy. Men have thrown dirt into the stream since the days of Athanasius. They seek to clarify the mystery by muddying the water."

  He walked to the desk and looked down at Humphrey's work. His eyes were large, unblinking, and bright with a feverish intensity that made Humphrey look away. Newton traced the struck-through line with a long, pale finger.

  "This verse," Newton murmured, more to himself than the boy. "It is a bridge built where there was no chasm. A later addition. A graft."

  "A graft, sir?"

  "To force the tree to bear fruit it was not meant to bear." Newton straightened up and looked toward the corner of the room where a heavy wooden box sat locked. "The truth is simple. It is austere. Like gravity. You do not see the force that holds the moon in orbit, yet you know it is there by the motion. You do not need three witnesses to prove a unity that exists by nature."

  Humphrey dipped his pen, his heart beating faster. He understood little of natural philosophy, but he understood danger. To question the Trinity was to question the foundation of the College, of the Church, of the King's authority over the soul. It was to invite ruin.

  "There is another," Newton said, moving to the pile of manuscripts near the inkwell. "First Timothy. Chapter three, verse sixteen. *God was manifest in the flesh.*" He spat the words out as if they were bitter. "The Greek says *Who*. Not *God*. A subtle change. A single letter changed by a scribe with too much zeal and too little fear."

  Humphrey copied the correction, his hand trembling slightly. He felt as though he were transcribing a confession of treason.

  "The packet is ready?" Newton asked abruptly.

  "Yes, sir. Addressed to Mr. Locke in London. He is to forward it to the continent."

  Newton nodded. He took the sealed packet from the desk. It contained the *Two Notable Corruptions*, the careful textual criticism Humphrey had spent the week copying. It was to be published anonymously in Holland, beyond the reach of English censors. A trial balloon. A way to restore the ancient purity of the faith without burning the modern church down.

  Newton held the packet over the candle flame for a moment, not to burn it, but as if testing its weight against the fire.

  "Mr. Locke believes it safe," Newton said. "He believes that reason should be free to examine the scriptures as it examines the motion of bodies. That if we strip away the hypotheses imposed by men, we find the divine architecture underneath."

  "Like the prism, sir?" Humphrey asked. "Separating the light?"

  Newton's eyes snapped to the boy. For a second, Humphrey thought he had offended him. Then Newton's expression softened into something resembling pity.

  "Exactly so. The white light of truth is split by the prism of tradition into false colors. We are tasked with recombining them. To show the single source."

  Newton turned back to the window. He looked out at the courtyard below, where students were walking briskly to chapel. They would soon be assenting to the very doctrines Newton had just marked as frauds. He held the fellowship of this College on the condition of his orthodoxy. If this packet traveled, if the arguments were traced back to him, the fellowship would vanish. The reputation of the *Principia* would not save him. Men would say the mathematician had lost his mind to heresy.

  The silence in the room stretched. The candle sputtered.

  Newton set the packet down. He did not let go of it immediately. His hand hovered over the wax seal, a thumb pressing into the red hardness.

  "Sir?" Humphrey asked.

  "The risk," Newton whispered. "If the dirt is too deep, one cannot clean the river without drowning in it."

  He turned away from the window and walked to the desk. He pulled a fresh sheet of paper toward him. He picked up his quill. The scratching sound was loud in the cold room, faster than before, urgent.

  "Mr. Newton?"

  "I have calculated the trajectory," Newton said, not looking up. "Of the publication. The variables were incomplete. I accounted for the theology, but not for the men. Men are not planets. They do not follow laws. They follow passion."

  He blotted the new letter. It was short. A command to Locke. *Suppress the manuscript. Do not send it. I have reconsidered.*

  Humphrey watched the master fold the second letter. The first packet, the one containing the truth about the three witnesses and the manifest God, remained on the desk. The second letter, the retraction, was sealed with fresh wax.

  "Take this to the carrier," Newton said, handing over the second letter. "The other packet stays."

  "And the manuscript, sir? The copies?"

  Newton moved to the heavy wooden box in the corner. He produced a key from around his neck, hidden beneath his waistcoat. He unlocked the box. Inside were stacks of paper, thousands of pages. Alchemy. Prophecy. Biblical criticism. A lifetime of secret thinking that contradicted the public man.

  He placed the *Two Notable Corruptions* inside, on top of a stack of writings about the Apocalypse.

  "It is not time," Newton said. He locked the box. The click of the latch sounded like a bone snapping. "The world is not ready for the architecture. They prefer the painted ceiling."

  Humphrey took the letter for the carrier. He felt the weight of the secret pressing against his ribs. He looked at Newton, who had returned to the window. The great man was watching the light fade from the sky, his reflection ghostly in the glass.

  "Will you write more, sir?" Humphrey asked.

  "I have written enough," Newton said. "Now I must wait. Truth is like light. It travels slowly through the medium. If you force it, it bends. If you wait, it may yet reach the eye."

  Humphrey bowed and left the room. In the corridor, the cold was less sharp, but he felt a chill that had nothing to do with the weather. He carried the letter that would save Newton's position and silence the truth. He thought of the verses he had copied, the struck-through words. *Three that bear record.*

  He walked toward the gate, thinking of the prism on the windowsill. He remembered how Newton had once shown him the spectrum, how the white light became a rainbow only when forced through the glass. But when the light exited the glass, it was white again.

  Newton had spent his life proving that the appearance was a trick of the medium. Yet today, he had chosen the appearance over the light.

  Humphrey handed the letter to the carrier and watched the man ride off toward London. He returned to the courtyard, looking up at the windows of the chambers. The candle was still burning behind the glass. Newton was still there, alone with his box and his God, waiting for a world that would not understand him to finally catch up to a truth he was too afraid to speak.

  The snow began to fall, soft and silent, covering the tracks in the courtyard until everything looked uniform, white, and unblemished.
