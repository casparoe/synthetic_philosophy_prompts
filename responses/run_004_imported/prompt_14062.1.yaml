prompt: |-
  So I'm in this small epistemology reading group that meets every other week (mostly people wrapping up MA's or prepping PhD applications), and after we covered the peer disagreement stuff -- Elga, Christensen, Kelly, that whole cluster on the equal-weight view versus just sticking to your guns -- a few of us went for food and ended up in a live version of the debate that I can't stop turning over. Maya and Josh are both fast at mental math, and they independently worked out everyone's share of the bill with tip and got different totals. Roughly in order, here's what happened:

  (1) Maya said this was a textbook case for conciliationism: since neither of them has any special reason to think she's better at arithmetic than the other, finding out they disagree should push each toward the other's number rather than each just trusting her own math.

  (2) Josh said that can't be the whole policy, because it would also commit you to giving equal weight to anyone who disagrees with you, including people who are obviously worse reasoners -- he brought up a mutual friend who trusts his fantasy football gut over the stats every single week. Nobody thinks you owe that guy 50% of your credence.

  (3) Maya said that's exactly why the view only kicks in for genuine peers, and you're allowed to downgrade someone's peer status using considerations that don't just presuppose they're wrong about the very question currently in dispute -- track record, relevant skill, whether their method is independantly known to be reliable on similar questions. The fantasy football friend fails that test on independent grounds; Josh, who's never been shown to be worse at mental math than her, doesn't.

  (4) Josh said fine, but conciliationism is itself exactly the kind of thing professional epistemologists -- who are obviously each other's peers -- disagree about all the time, and plenty of them land on something more like steadfastness. So by her own logic, shouldn't Maya conciliate her way down to a lot less confidence in conciliationism itself, maybe down to the point where she can't really assert it as flatly as she just did?

  (5) Maya said maybe your policy for handling disagreement has to work as a kind of fixed point you reason from, not something you yourself conciliate about -- sort of like how you can still use logic to evaluate an argument that concludes logic is unreliable, without that being viciously circular. But she admitted this might just be a dressed-up way of exempting her own view from her own rule, and wasn't sure how you'd even tell the difference.

  Neither of them budged and it kind of derailed the rest of dinner. Could you go through moves (1) through (5) and say who's got the better of it at each step, not just who wins overall? I'm especially curious whether move (5) is a legitimate response to (4) or just special pleading dressed up in an analogy, and whether there's something like a standard answer to this self-undermining problem that both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A small epistemology reading group (MA/PhD level) discussing peer disagreement (Elga, Christensen, Kelly, etc.).
      *   **Scenario:** A dinner debate between Maya (conciliationist) and Josh (steadfast/skeptic about conciliationism) triggered by a bill-splitting math error.
      *   **Task:** Evaluate moves (1) through (5) step-by-step, determining who has the better of it at each stage.
      *   **Specific Focus:** Is move (5) legitimate or special pleading? Is there a standard answer to the self-undermining problem they are missing?
      *   **Tone:** Academic but accessible, suitable for grad students familiar with the literature.

  2.  **Deconstruct the Moves:**

      *   **Move (1) Maya:** Applies the Equal Weight View (EWV) to the bill. Peers disagree $\rightarrow$ split the difference/conciliate.
          *   *Assessment:* This is the standard application of Elga/Christensen. In a narrow, isolated case (mental math), peerhood is plausible.
          *   *Verdict:* Maya wins this round. It's the textbook case.

      *   **Move (2) Josh:** The "Absurd Consequences" objection (sometimes called the "Uniqueness" or "Expertise" objection). If EWV applies universally, you must conciliate with idiots/crackpots.
          *   *Assessment:* This is a common initial objection, but conciliationists have a ready reply (peerhood conditions). Josh is attacking a straw man version of EWV that ignores the "peer" constraint.
          *   *Verdict:* Josh raises a good intuition, but technically misses the mark on the theory's actual constraints. Maya has the theoretical upper hand here, *but* Josh sets up the next move well. Let's call it a push or slight edge to Maya for theoretical accuracy, but Josh for practical intuition. Actually, looking at the prompt, Josh says "anyone who disagrees," Maya clarifies "peers." So Josh's objection is premised on ignoring the peer condition. Maya wins (2) because Josh's objection is easily deflected by the definition of "peer."

      *   **Move (3) Maya:** Clarifies "Peerhood." Independent grounds for downgrade (track record, method). Fantasy football friend isn't a peer on math/stats. Josh is a peer on math.
          *   *Assessment:* This is the standard "independent reason" defense (Kelly/Christensen). You can't downgrade just because they disagree on *this* question (question-begging), but you can on *independent* grounds.
          *   *Verdict:* Maya is solid here. This is standard conciliationist doctrine.

      *   **Move (4) Josh:** The "Self-Defeat" or "Self-Undermining" objection. Epistemologists disagree about conciliationism. They are peers. Therefore, conciliationists should conciliate about conciliationism. If they do, they lose confidence in conciliationism. If they don't, they are violating their own principle.
          *   *Assessment:* This is the heavyweight objection (found in Christensen, Elga, Kelly, etc.). It's the "problem of peer disagreement about disagreement." Josh lands a heavy blow here. It's the hardest problem for the view.
          *   *Verdict:* Josh wins this round clearly. This is the famous paradox.

      *   **Move (5) Maya:** The "Fixed Point" or "Framework Principle" defense. Disagreement norms are rules of the game, not moves within the game. Analogy to logic. Admits uncertainty about circularity.
          *   *Assessment:* This is the "epistemic framework" response. Is it legitimate? Some say yes (norms are constitutive). Others say it's ad hoc. The prompt asks specifically about this.
          *   *Verdict:* This is the crux. It's not *obviously* special pleading, but it's under-developed in her dinner remark. There *is* a standard literature response she's hinting at but not fully articulating (e.g., Christensen's "epistemic akrasia" or the distinction between first-order and higher-order evidence).

  3.  **Drafting the Analysis (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the group. This is a classic "dinner table" instantiation of the literature.
      *   *Step-by-Step:*
          *   (1) Maya: Strong. Standard Elga.
          *   (2) Josh: Weak. Misses the "peer" qualification.
          *   (3) Maya: Strong. Standard "independent reasons" clause.
          *   (4) Josh: Very Strong. The "Self-Undermining" objection is the biggest threat to conciliationism.
          *   (5) Maya: Mixed. She identifies the right *type* of solution (framework status) but admits weakness.
      *   *Deep Dive on (5):* Is it special pleading? Need to discuss the distinction between *object-level* beliefs and *epistemic norms*. Reference Christensen's "Disagreement, Question-Begging, and Epistemic Peers" or Elga's "How to Disagree About How to Disagree."
      *   *The "Standard Answer":* What are they missing?
          *   *Option A:* Steadfastness (Kelly). You can be steadfast about the norm itself.
          *   *Option B:* The "Right Reason" view.
          *   *Option C:* Christensen's "Epistemic Akrasia." You can believe $P$ and believe you shouldn't believe $P$, but it's rationally required to believe $P$. (Wait, that's for the believer).
          *   *Option D:* The distinction between *guidance* and *evaluation*.
          *   *Most relevant:* The idea that norms of reasoning are "constitutive" or "hinge" propositions (Wittgensteinian angle) or simply that one must reason from *one's own* perspective (the "egocentric predicament" of reasoning). You can't step outside your own epistemic norms to evaluate them using someone else's norms without begging the question against yourself.
          *   *Key Reference:* David Christensen's work on self-undermining. He actually argues this *is* a problem but tries to solve it via "epistemic akrasia." Others (like Kelly) say this shows Conciliationism is false.
          *   *Refinement:* The best "standard answer" they might be missing is the distinction between **first-order evidence** (the bill) and **higher-order evidence** (the disagreement about the norm). Or the idea that you must apply your *current* best judgment about norms, even if that judgment is contested.

  4.  **Refining the Verdicts:**

      *   (1) Maya. (Textbook application).
      *   (2) Josh. (Wait, re-reading). Josh says "it would also commit you to giving equal weight to anyone." Maya corrects him in (3). So in (2), Josh is attacking a straw man. Maya *would* win (2) if she spoke, but Josh speaks (2), then Maya speaks (3). So (2) is a weak objection. (3) is a strong reply.
      *   (4) Josh. This is the killer argument.
      *   (5) Maya. She gestures at a solution but admits it might be ad hoc. I need to evaluate if the gesture is valid. It *is* a recognized move (norms as framework), but it requires more work to avoid circularity.

  5.  **Addressing the Specific Questions:**
      *   *Who wins each step?* (Detailed above).
      *   *Is (5) special pleading?* Not necessarily, but it needs elaboration. It appeals to the constitutive nature of norms.
      *   *Standard answer?* Yes, the literature on "Disagreement about Disagreement." Specifically, the idea that you must reason from your own epistemic perspective (the "total evidence" view applied to norms). Also, the distinction between *steadfastness about the norm* vs. *conciliation about the norm*.

  6.  **Final Polish:**
      *   Ensure the tone is respectful of the characters (they know their stuff).
      *   Cite the relevant philosophers (Elga, Christensen, Kelly, Feldman).
      *   Make sure the distinction between "independent reasons for downgrade" (Move 3) and "disagreement about the norm itself" (Move 4) is clear. Move 3 is about peer status; Move 4 is about the rule of the game.

      *(Self-Correction during drafting)*: In Move (2), Josh makes a claim. Maya hasn't replied yet. So I evaluate Josh's move in isolation. It's a common objection, but technically incorrect regarding the *Equal Weight View* as formulated by Elga/Christensen, which specifies *peers*. So Josh loses point (2). Maya wins point (3) by clarifying. Josh wins point (4) decisively. Maya's point (5) is the interesting philosophical crux.

      *Wait, one nuance on (5):* Is it special pleading? If I say "My rule applies to everything except my rule," that looks circular. But if I say "My rule is a rule for processing evidence, and the rule itself is not evidence processed by the rule," that's a category distinction. I need to explain this carefully. Christensen calls this the "problem of self-undermining." He suggests we might have to accept a degree of epistemic akrasia (believing I shouldn't believe what I believe). Maya's "fixed point" is closer to Kelly's criticism or a Wittgensteinian hinge. I should mention that the "standard answer" isn't a consensus—this is still a live debate.

      *Revised plan for "Standard Answer":* Acknowledge there is no consensus, but point to the "Total Evidence View" (Kelly) vs. "Equal Weight" (Elga/Christensen) on *normative* questions. The key insight they are missing is that **you cannot apply a norm of reasoning without already presupposing some norm of reasoning.** You have to start somewhere. This isn't special pleading; it's the "egocentric predicament" of rationality.

  7.  **Final Review against constraints:**
      *   Go through moves 1-5.
      *   Say who has the better of it at each step.
      *   Focus on (5).
      *   Identify standard answer.

      *Let's write.*
answer: |-
  This is a fantastic snapshot of a live epistemology seminar. Maya and Josh have effectively reenacted the central dialectic of the peer disagreement literature from the mid-2000s to the present. They are both arguing competently, but they are hitting the exact pressure points that keep professional epistemologists up at night.

  Here is an assessment of who has the better of it at each step, followed by a deeper dive into the self-undermining problem in move (5).

  ### Step-by-Step Assessment

  **Move (1): Maya (The Bill)**
  *   **The Move:** Maya applies the Equal Weight View (EWV) to a concrete case of mental math. Since they are peers regarding arithmetic and have no independent reason to doubt the other, they should split the credence.
  *   **Verdict:** **Maya wins.**
  *   **Why:** This is the paradigmatic case for conciliationism (Elga 2007, Christensen 2007). In isolated, narrow cases of reasoning (like arithmetic or estimating the weight of a cow) where peerhood is established and no bias is evident, the intuition that you should conciliate is overwhelming. To stick to her guns here would require Maya to claim a "right to be confident" that she hasn't earned. Josh has no rebuttal yet, so this is a clean point for the conciliationist.

  **Move (2): Josh (The Fantasy Football Friend)**
  *   **The Move:** Josh argues that conciliationism entails absurdity: giving weight to obvious non-experts or irrational agents.
  *   **Verdict:** **Josh loses (technically).**
  *   **Why:** This is the most common initial objection to EWV, but it targets a straw man. Neither Elga nor Christensen argues you must conciliate with *anyone* who disagrees; you must conciliate with *epistemic peers*. Josh's fantasy football friend is not a peer regarding statistical reasoning. Maya anticipates this in her next move, but even standing alone, Josh's objection fails because it ignores the "peer" constraint which is definitional to the view.

  **Move (3): Maya (Defining Peerhood)**
  *   **The Move:** Maya clarifies that peerhood is determined by *independent* grounds (track record, method reliability), not by who gets the right answer on the specific question in dispute.
  *   **Verdict:** **Maya wins.**
  *   **Why:** This is the standard "independent reason" defense (see Kelly 2010 for the critique, but Christensen 2011 for the defense). You cannot downgrade a peer *because* they disagree with you (that's question-begging), but you can downgrade them if you have independent evidence of their unreliability. Maya correctly identifies that the fantasy football friend fails the peer test on independent grounds, while Josh passes it on math. This successfully parries Josh's Move (2).

  **Move (4): Josh (The Self-Undermining Objection)**
  *   **The Move:** Josh applies Maya's principle to the principle itself. Epistemologists are peers. They disagree about conciliationism. Therefore, a conciliationist should conciliate about conciliationism, lowering their confidence in the view that tells them to conciliate.
  *   **Verdict:** **Josh wins decisively.**
  *   **Why:** This is the "Self-Defeat" or "Self-Undermining" objection, and it is the single strongest argument against strict conciliationism. It was raised by Thomas Kelly (2010) and David Christensen (2010) themselves. If the Equal Weight View is true, it seems to apply to itself. But if you apply it to itself, you must lower your confidence in it because there are many steadfast peers. If you lower your confidence in it, you lose the justification for applying it in Move (1). Josh has trapped Maya in a performative contradiction.

  **Move (5): Maya (The Fixed Point Defense)**
  *   **The Move:** Maya suggests that norms of disagreement are "fixed points" or framework principles (like logic) that you reason *from*, not propositions you reason *about*.
  *   **Verdict:** **Draw / Leaning Josh.**
  *   **Why:** Maya identifies the correct *category* of response, but she admits she doesn't know how to defend it against the charge of circularity. As stated, it sounds like special pleading ("My rule applies to everything except my rule"). However, philosophically, she is gesturing toward a legitimate distinction between *first-order evidence* and *constitutive norms*. She loses points for not articulating it fully, but she wins points for spotting the only possible exit.

  ---

  ### Deep Dive: Is Move (5) Special Pleading?

  Maya is worried that Move (5) is "dressed-up special pleading." It *can* be, but it doesn't *have* to be. The distinction she is reaching for is between **reasoning within a system** and **adopting a system.**

  If I use logic to prove that logic is unreliable, I am still using logic to do so. I cannot step outside of logic to evaluate logic. Similarly, Maya is arguing that she cannot step outside of her epistemic norms to evaluate her epistemic norms without *already using some epistemic norms*.

  **The Legitimate Version:**
  The argument is that rational requirement is **egocentric**. I must reason from *my* total evidence, which includes *my* best judgment about what the rules of reasoning are. If my best judgment (based on my training, reading, and reflection) is that "Conciliationism is true," then I am rationally required to follow Conciliationism. The fact that Josh (my peer) thinks "Steadfastness is true" is evidence I must weigh, but I must weigh it *using my current norms*.

  If my current norms say "Give Josh's view equal weight," then I must lower my confidence in Conciliationism. **However**, if I lower my confidence too much, I might no longer be justified in using Conciliationism to process the disagreement. This leads to a regress.

  **The Special Pleading Version:**
  If Maya simply asserts, "Conciliationism is a hinge proposition that is immune to disagreement," without an argument for *why* it is immune, then yes, it is ad hoc. It looks like she is exempting her favorite theory from the scrutiny she demands of others.

  **Verdict on (5):** Maya is right that norms function as frameworks, but she is wrong to think this automatically solves the problem. The problem is that epistemic norms *are* truth-apt claims about the world (specifically, about evidence and support). They aren't purely syntactic like logic; they make substantive claims. So, the "fixed point" defense is controversial.

  ### The Standard Answer They Are Missing

  There is no consensus "solution" (otherwise the debate would be over), but there is a standard **framework** for handling this that neither of them fully articulated. They are missing the distinction between **Epistemic Akrasia** and **Steadfastness about Norms.**

  **1. The Christensen Solution (Epistemic Akrasia):**
  David Christensen (in *Disagreement, Question-Begging, and Epistemic Peers*) actually accepts Josh's conclusion. He argues that yes, conciliationism *does* undermine itself. He suggests we might have to accept a state of **rational akrasia**: I can be rationally required to believe $P$ (Conciliationism), while simultaneously believing that my evidence suggests I shouldn't believe $P$. He argues this is an uncomfortable but necessary bullet to bite. Maya didn't go this far; she tried to avoid the undermining.

  **2. The Kelly Solution (The Right Reason View):**
  Thomas Kelly argues that Move (4) proves Conciliationism false. He advocates for the "Total Evidence View." On this view, the fact that a peer disagrees is just *one more piece of evidence* to be added to the pile. Sometimes that evidence is strong enough to make you conciliate (like the bill); sometimes it isn't (like when you are convinced of the truth of your own reasoning). Crucially, Kelly argues you can be **steadfast about the norm itself**. You evaluate the disagreement about the norm using the norm you currently hold to be correct. This isn't circular; it's unavoidable. You can't evaluate a rule of reasoning without using a rule of reasoning.

  **3. The "Bootstrapping" Reply:**
  The most sophisticated response to Move (4) is that **you must start somewhere.** When you encounter a peer who disagrees with your fundamental epistemic principles, you cannot simply split the difference, because you have no "neutral" vantage point from which to calculate the difference. You have to trust your own rational faculties to evaluate their faculties.
  *   **The Missing Line for Maya:** She should have said: *"Josh, to apply your objection, you're asking me to use a neutral standard to judge between Conciliationism and Steadfastness. But there is no neutral standard. I have to use my best judgment. My best judgment says Conciliationism is right. Therefore, I treat your disagreement as a reason to check my work, but not necessarily to abandon the framework I'm using to check it."*

  ### Summary for the Reading Group

  *   **Moves 1 & 3:** Maya is on solid ground. This is standard Conciliationist doctrine.
  *   **Move 2:** Josh overreaches; peerhood constraints block this.
  *   **Move 4:** Josh lands the knockout punch. This is the hardest problem for the view.
  *   **Move 5:** Maya identifies the right *structure* of a defense (framework principles) but lacks the *argument* for why this isn't circular.

  **Recommendation:** Tell them to read **David Christensen's "Epistemic Akrasia and Epistemic Reason" (2010)** and **Thomas Kelly's "Peer Disagreement and Higher Order Evidence" (2010)**. Specifically, they need to discuss whether it is possible to be rationally required to hold a belief while acknowledging that your evidence suggests you shouldn't (Akrasia), or whether you are permitted to be steadfast about your epistemic norms even when peers disagree (Kelly). The dinner debate stalled because they hit the limit of the "introductory" literature and bumped into the live research frontier.
