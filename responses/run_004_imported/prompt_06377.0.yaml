          *   Person B cares about Local Arts (community theater).
          *   They agree to donate to each other's causes.
          *   *Critique:* This is often just "donating to what your friend likes." Is it a *moral* trade? Yes, if they believe supporting the other's moral cause creates more overall moral value (e.g., reciprocity, social cohesion) or if they are "trading votes" in a committee. Let's make it more active than just money.

      *   *Idea 2: Religious Observance.*
