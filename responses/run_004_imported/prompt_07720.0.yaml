          *   *Verdict:* Theo is overstating. Looping contributes, but calling it "THE explanation" is reductionist. Maya has the upper hand here scientifically, but Theo has the philosophical hook.
          *   *Correction:* Theo is partially right about the mechanism (awareness leads to referral), but wrong about the magnitude ("THE explanation").

      *   **Round 2: Maya's Rebuttal (Biology proves it's real, not a loop).**
