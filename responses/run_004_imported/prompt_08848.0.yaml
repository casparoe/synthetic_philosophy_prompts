      *   *Crucial Point:* Is (FairBot, FairBot) a Nash Equilibrium?
      *   To break the equilibrium, I need a program $P'$ such that $U(P', \text{FairBot}) > U(\text{FairBot}, \text{FairBot})$.
      *   If I submit AllD against FairBot, I get P. FairBot gets P.
      *   If I submit FairBot against FairBot, I get R.
      *   Since $R > P$, deviating to AllD is *not* profitable.
      *   Therefore, (FairBot, FairBot) is a NE.

  5.  **Address the "Halting Problem" / Computational Limits:**
      *   A physicist will immediately spot the recursion issue. If Program A simulates Program B, and Program B simulates Program A, do they halt?
      *   Tennenholtz's original proposal assumed bounded resources or specific logical frameworks (modal logic of provability).
      *   The more modern treatment (e.g., "Robust Cooperation in the Prisoner's Dilemma" by Barasz et al.) uses Gödelian provability rather than raw simulation to avoid infinite loops.
