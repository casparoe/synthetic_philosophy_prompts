      *   *Searle vs. Dennett:* Rorty is firmly on Dennett's side (instrumentalism). Searle's "intrinsic intentionality" is exactly the kind of essentialism Rorty hated.
      *   *Davidson:* Radical interpretation. If it walks like a duck and talks like a duck, it's a duck. There's no "fact of the matter" behind the behavior.
