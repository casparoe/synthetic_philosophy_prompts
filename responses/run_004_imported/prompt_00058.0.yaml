          3.  *Spatiotemporal Bias (The "Here and Now" Problem):* Need to weight local effects more heavily to avoid paralysis.
          4.  *Epistemic Humility (The "We Don't Know" Problem):* We aren't sure if the universe is infinite in the relevant sense.
      *   **Proposed Resolutions/Workarounds:** How ethicists try to fix this (Average Utilitarianism, Causal Decision Theory, Finite Differences).
