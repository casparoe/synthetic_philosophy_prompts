answer: |-
  Your friend is incorrect. There is a rigorous mathematical argument against betting your entire bankroll that has nothing to do with psychological "risk aversion" and everything to do with the mathematics of compounding over time.

  The core of the disagreement lies in the difference between **Arithmetic Expected Value** (what your friend is maximizing) and **Geometric Growth Rate** (what actually determines long-term wealth in a compounding scenario).

  Here is the breakdown of why betting 100% is a mathematical error in your specific context, the formula for the optimal stake, and the calculation based on your numbers.

  ### 1. The Flaw in the "Maximize Expected Value" Argument

  Your friend is right that for a **single, isolated bet**, maximizing Expected Value (EV) dictates betting everything.
  *   **Bet $1:** Expected Return = $(0.55 \times \$2) + (0.45 \times \$0) = \$1.10$.
  *   **Bet $100:** Expected Return = $\$110$.
  *   **Profit:** 10 cents per dollar.

  However, you are not making one bet. You are making a **sequence of bets over years**, reinvesting the winnings. This changes the math from additive to multiplicative.

  When you reinvest winnings, your bankroll follows a geometric path. In a geometric system, the order of wins and losses matters less than the *product* of the returns. Crucially, **zero is an absorbing state.** If your bankroll hits zero, you cannot place further bets, and the game ends for you.

  If you bet 100% of your bankroll:
  1.  You double your money on a win.
  2.  You lose **everything** on a loss.
  3.  Over the course of "years" (hundreds or thousands of bets), the probability of encountering at least one loss approaches 100%.
  4.  Therefore, the probability of eventual ruin approaches 100%.

  While the *Arithmetic Average* outcome of betting 100% is massive (driven by the one-in-a-trillion scenario where you win every single time forever), the **Time Average** outcome (what will actually happen to you in reality) is zero.

  This is not about "risk aversion" (a preference for safety). It is about **ergodicity**. Your friend is optimizing for the average outcome across many parallel universes (Ensemble Average), but you live in a single timeline (Time Average). In a single timeline with an absorbing barrier at zero, maximizing Arithmetic EV is irrational because it guarantees extinction.

  ### 2. The Solution: The Kelly Criterion

  To maximize the long-term growth rate of a bankroll in a repeated betting scenario, you must maximize the **Expected Logarithm of Wealth**. This leads to the **Kelly Criterion**, a formula derived by John L. Kelly Jr. at Bell Labs in 1956.

  The Kelly Criterion determines the fraction of your bankroll ($f$) that maximizes the geometric growth rate. It is the mathematical bridge between having an edge and surviving long enough to realize it.

  **The Formula:**
  For a bet that pays $b$-to-1 odds, with a probability of winning $p$ and losing $q$ (where $q = 1 - p$):

  $$f^* = \frac{bp - q}{b}$$

  **Applying Your Numbers:**
  *   **Odds ($b$):** Even money, so $b = 1$ (you win 1 unit for every 1 unit staked).
  *   **Probability of Win ($p$):** $0.55$
  *   **Probability of Loss ($q$):** $0.45$

  $$f^* = \frac{1(0.55) - 0.45}{1}$$
  $$f^* = 0.55 - 0.45$$
  $$f^* = 0.10$$

  **The Recommendation:**
  The mathematically optimal stake to maximize long-term wealth growth is **10% of your current bankroll** on each bet.

  ### 3. Why 10% Works and 100% Fails (A Concrete Example)

  Imagine you start with $\$1,000$ and place two bets: one win and one loss (which is a very common sequence given a 55% win rate).

  **Strategy A: Bet 100% (Friend's Plan)**
  1.  Start: $\$1,000$
  2.  Win: $\$2,000$
  3.  Lose: $\$0$
  4.  **Result:** Bankrupt. Game over.

  **Strategy B: Bet 10% (Kelly Plan)**
  1.  Start: $\$1,000$
  2.  Win (10% gain): $\$1,100$
  3.  Lose (10% loss on new total): $\$1,100 \times 0.90 = \$990$
  4.  **Result:** You still have $\$990$. You are still in the game.

  While Strategy B lost a tiny bit in this specific sequence, it avoids the absorbing barrier of zero. Over thousands of bets, the 10% strategy compounds positively because the wins slightly outweigh the losses in a geometric product, whereas the 100% strategy inevitably hits a loss sequence that wipes it out.

  ### 4. A Critical Caveat: Model Risk

  There is one practical reason to stake *less* than the Kelly recommendation, even if you accept the math above.

  The Kelly Criterion assumes your edge ($55\%$) is a **known, precise fact**. In reality, you are working with a statistical model based on backtesting. There is always a chance your model is overfitted, the market has adjusted, or your edge is actually smaller than you think (e.g., 52% instead of 55%).

  If you bet Full Kelly (10%) and your true edge is lower, you are overbetting. Overbetting Kelly reduces your growth rate and increases volatility; overbetting *significantly* can turn a positive expectation into a negative growth rate, leading to ruin even without hitting zero immediately.

  Because of this, many professional gamblers and investors use **"Fractional Kelly"** (e.g., betting half the recommended amount).
  *   **Full Kelly:** 10% of bankroll.
  *   **Half Kelly:** 5% of bankroll.

  This sacrifices some theoretical growth speed for a massive increase in safety against model error.

  ### Summary

  Your friend is confusing **single-event expectation** with **long-term compounding**.
  1.  **Is he right?** No. Betting 100% guarantees eventual ruin in a repeated game, regardless of your psychological tolerance for risk.
  2.  **Is there a non-emotional argument?** Yes. It is the mathematical necessity of avoiding an absorbing barrier (zero) while maximizing geometric growth.
  3.  **What fraction should you stake?** Based strictly on the numbers provided ($55\%$ win rate, even money), the optimal fraction is **10%**.
  4.  **Practical Advice:** Given that models are never perfect, consider staking **5% (Half-Kelly)** to protect against the possibility that your edge is smaller than your backtest suggests.

  **Verdict:** Do not bet the whole bankroll. It is not "risky"; it is mathematically suicidal for a long-term strategy. Stake 10% (or less) to actually realize the profit your model predicts.
