      *   The definitions do the heavy lifting. If you define "God" as "That which necessarily exists," then proving God exists is just unpacking the definition *if* you can prove such a thing is possible.
      *   The "game" is loading the conclusion into the axioms (specifically Axiom 5 and the definition of Positive).

