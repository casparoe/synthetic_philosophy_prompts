      *   *Key Insight:* The "cause and effect of itself" isn't a biological claim about reproduction; it's a logical claim about how we must conceive of the *unity* of the organism to distinguish it from a heap or a machine.
      *   *Critique of Modern Views:* Both etiological and causal-role accounts assume naturalism (nature is closed under mechanical law). Kant argues that mechanical law *alone* renders the organism unintelligible to human reason. We need teleology as a heuristic.
      *   *Synthesis:* Kant anticipates the *tension* between the two modern views. Etiological looks at the history (cause), Causal-Role looks at the system (effect). Kant says you need both simultaneously (reciprocity) to even identify the object as an organism, but you can't prove this reciprocity exists in the thing-in-itself.

