      *   *Condition 1:* Parts exist *for the sake of* the whole and other parts (reciprocal means/ends).
      *   *Condition 2:* The whole is cause and effect of itself (self-organization, reproduction, growth, maintenance).
      *   *Key Distinction:* Artifacts (watches) vs. Organisms (trees). In a watch, parts don't make other parts. In a tree, leaves make the tree, the tree makes the leaves.
      *   *Epistemological Status:* Crucial point. For Kant, this is a *regulative principle* for reflective judgment, not a *constitutive principle* of determinative judgment. We *must* judge organisms *as if* they have purposes to understand them, but we cannot claim they *actually* have intrinsic purposes in the dogmatic sense.

  3.  **Evaluate Against Modern Philosophy of Biology:**
