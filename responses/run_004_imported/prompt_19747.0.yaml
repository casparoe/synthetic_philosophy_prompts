          *   Does Kant match Causal-Role? Closer. The "reciprocal means/ends" sounds like systemic contribution. *However*, Cummins' account is usually reductive and mechanical. Kant insists mechanical causation is *insufficient* to explain the *possibility* of the organism, even if we must seek mechanical laws.
          *   *The Twist:* Kant isn't offering an ontological theory of function. He's offering a transcendental condition for *investigating* life.

  4.  **Formulate the "Actual Take":**
