answer: |-
  This is a sophisticated question that cuts to the heart of Dummett's political philosophy: the tension between a universalist moral commitment to open borders and the communitarian intuition that political communities must have some capacity for self-preservation.

  To answer how Dummett would have judged David Cameron's 2015 "swarm" remark and the wider policy response, we have to look at how Dummett used his background in the philosophy of language and logic to dissect political claims. For Dummett, political rhetoric was not just morally significant; it was subject to truth conditions.

  Here is an analysis of how Dummett's framework applies to the 2015 crisis, structured around the factual, the moral, and the structural vulnerability of his "submersion" concession.

  ### 1. The Factual Test: "Swarm" vs. "Submersion"
  Dummett's dismissal of Thatcher's "swamped" remark was not merely a moral rebuke; it was an empirical one. In *On Immigration and Refugees*, Dummett argues that while a nation theoretically has a right to prevent its cultural or demographic character from being fundamentally altered ("submerged"), the burden of proof is exceptionally high. The threat must be existential, not merely inconvenient or culturally challenging.

  Applied to Cameron's 2015 "swarm" comment:
  *   **The Metaphor:** Dummett, a philosopher of language deeply influenced by Frege and Wittgenstein, was attuned to how language shapes reality. "Swarm" implies insects, mindless multiplication, and a lack of individual agency. "Swamped" implies a drowning. Both metaphors construct a narrative of passive victimhood for the host nation and predatory agency for the migrant. Dummett would likely argue that Cameron's use of "swarm" fails the truth-condition test. It describes a reality that does not exist.
  *   **The Numbers:** In 2001, Dummett argued Britain was nowhere near the threshold of submersion. In 2015, despite the visibility of the Calais crisis and Mediterranean crossings, the net migration figures relative to the UK population remained historically consistent with post-war fluctuations. The number of asylum applications in the UK during the peak of the European migrant crisis was significantly lower than in Germany or Sweden.
  *   **The Judgment:** Dummett would likely have judged Cameron's remark as **factually confused** in the same way he judged Thatcher's. By invoking the specter of submersion without the demographic reality to support it, Cameron would be failing Dummett's two-part test. The "right not to be submerged" is triggered only by actual submersion, not by the *fear* of it.

  ### 2. The Moral Test: Refugees vs. Economic Migrants
  A crucial distinction in Dummett's work is between economic migrants and refugees. While he advocates for the rights of both, he views the exclusion of refugees as a graver moral failure, akin to refusing aid to a drowning neighbor.

  *   **The 2015 Context:** The 2015 crisis was driven largely by the Syrian Civil War and instability in Eritrea and Afghanistan. These were predominantly refugee flows, not voluntary economic migration.
  *   **Dummett's Catholic Social Teaching:** Dummett's political philosophy was heavily informed by his Catholicism and his work with the Justice and Peace Commission. He viewed the acceptance of refugees as a strict duty of justice, not merely charity.
  *   **The Judgment:** Cameron's rhetoric conflated refugees with economic migrants to justify restriction. Dummett would argue this is a category error designed to bypass moral obligation. If the "submersion" clause is a limited exception for the preservation of a community, it cannot be invoked to deny refuge to those fleeing persecution unless accepting them would literally dissolve the host community. Given the UK's capacity in 2015, Dummett would view the refusal to accept more refugees as a violation of fundamental justice, rendering the "swarm" rhetoric not just false, but **morally illicit**.

  ### 3. The Structural Vulnerability: Does the Concession Undermine the Argument?
  This is the most difficult part of your query. Critics of Dummett (particularly from the open-borders left) worry that by conceding *any* right to exclude based on national identity or capacity, he provides a "poison pill" that restrictionists can exploit. If Dummett admits a nation has a "right not to be submerged," can't a politician simply define "submersion" loosely to justify any level of exclusion?

  **The Case for Vulnerability:**
  Restrictionists could indeed quote-mine Dummett. They could argue: "Even the liberal philosopher Dummett admits we have a right to protect our character. Therefore, limiting migration to maintain 'social cohesion' is philosophically defensible." By granting the theoretical possibility of a closed border, Dummett legitimizes the *concept* of border control in a way that absolutists do not.

  **The Case for Resilience (Dummett's Defense):**
  However, viewing Dummett's concession as a weakness misunderstands his analytic method. He introduces the "submersion" clause not to open a door for restrictionists, but to inoculate his theory against the charge of utopianism.
  *   **Setting the Bar:** Dummett defines "submersion" so narrowly that it functions almost as a *reductio ad absurdum*. He isn't saying, "You can exclude people to keep things the same." He is saying, "You can only exclude people if your society is ceasing to exist."
  *   **Shifting the Burden:** In Dummett's framework, the default position is open borders. The "submersion" clause does not give the state a right to control borders; it gives them a defense against a specific, catastrophic accusation. The burden of proof remains entirely on the state to demonstrate that specific catastrophe is imminent.
  *   **Application to Cameron:** Because Cameron's rhetoric relied on vague anxieties about "culture" and "control" rather than evidence of societal dissolution, Dummett's framework actually **protects against** the appropriation. A restrictionist cannot use Dummett to justify Cameron's policy unless they can prove the UK was on the verge of demographic collapse in 2015. Since they cannot, the concession remains a theoretical safety valve that never opens in practice.

  ### Conclusion
  If Dummett had been alive to witness the 2015 debate, he would likely have judged Cameron's "swarm" remark as a failure on both the factual and moral levels of his two-part test.
  1.  **Factually:** It claimed a threat of submersion that did not exist.
  2.  **Morally:** It used dehumanizing language to evade the specific duty owed to refugees.

  Regarding the vulnerability of his framework: Dummett would likely argue that a philosophy of migration that does not account for the *logical possibility* of community dissolution is intellectually dishonest. By conceding the point but setting the threshold impossibly high, he forces the debate onto empirical ground. He forces the restrictionist to prove the disaster, rather than allowing them to assume the threat.

  In this sense, his concession does not leave him exposed to appropriation; rather, it strips the appropriators of their cover. It reveals that rhetoric like Cameron's is not a defense of national survival, but a refusal of moral responsibility. Dummett's legacy here is a reminder that in the philosophy of migration, precision of language is a form of justice: calling a refugee a "swarm" is not just mean, it is, in the strictest logical sense, a lie.
