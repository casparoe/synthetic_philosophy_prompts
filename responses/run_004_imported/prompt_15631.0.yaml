      *   **Core Tension:** Dummett admits a nation has "a right not to be submerged" (limited application) but dismissed Thatcher's claim as "utterly ridiculous." Would this distinction hold up against Cameron's rhetoric? Does this concession leave his framework vulnerable to appropriation by restrictionists, or does it provide principled grounds to reject such rhetoric?
      *   **Goal:** Provide a nuanced philosophical analysis based on Dummett's known positions, textual evidence from *On Immigration and Refugees*, and the specific historical contexts of 1978, 2001, and 2015.

  2.  **Recall/Research Dummett's Position (*On Immigration and Refugees*):**
      *   *Core Thesis:* Immigration restrictions are generally morally unjustifiable. There is no natural right of states to exclude outsiders.
      *   *The "Submersion" Concession:* Dummett acknowledges a *very* narrow exception. A community might have a right to preserve its character/identity if immigration is so massive it fundamentally alters the fabric of society to the point of dissolution ("submersion").
      *   *Application to Britain:* He argued Britain in the late 20th/early 21st century was nowhere near this threshold. The fear was psychological/racist, not demographic reality.
      *   *Moral Foundation:* Rooted in Catholic social teaching (justice, charity) and anti-racism. He viewed exclusion as inherently suspect.
      *   *Style:* Analytic philosophy applied to public policy. Precise definitions, testing claims against facts.

  3.  **Analyze the Thatcher (1978) vs. Cameron (2015) Comparison:**
