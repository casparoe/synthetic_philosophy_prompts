          *   Numbers: 2015 saw a spike, but relative to UK population, it was small.
          *   Nature: Most were transiting to other EU countries.
          *   Dummett's Standard: He demands empirical evidence for the "submersion" claim. He would likely find the "swarm" rhetoric factually baseless, just as he did with Thatcher.
      *   *Moral Claim:* Does the rhetoric dehumanize?
          *   "Swarm" implies insects, not humans. Dummett was deeply committed to human dignity (influenced by his Catholicism and anti-racism). He would condemn the dehumanizing language.
      *   *The "Submersion" Concession:* Would this save him from criticism that he opens the door to restrictionists?
          *   *Argument for Vulnerability:* By admitting *any* right to exclude based on identity/numbers, restrictionists can seize that hook. "See, even Dummett says we can stop submersion."
          *   *Argument for Resilience:* Dummett sets the bar so high ("extremely limited application," "nowhere near meeting") that it functions almost as a reductio ad absurdum. It's a theoretical safety valve that rarely, if ever, opens in practice for Western liberal democracies.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. Validate the connection between Dummett's logic/philosophy of language and his political philosophy (precision of terms).
