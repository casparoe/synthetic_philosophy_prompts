      *   *The Molyneux Example:* A man born blind gains sight. Can he distinguish cube vs. sphere by sight alone? Locke (and Molyneux) say No.
      *   *Connection:* Both examples argue against the idea that perception is purely passive sensation. Both argue that *experience/judgment* shapes what we perceive.
      *   *Difference/Nuance:*
