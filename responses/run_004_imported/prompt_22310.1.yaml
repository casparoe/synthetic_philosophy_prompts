          *   *Why here?* The globe example makes a claim about *current* adult perception. A skeptic might say, "Maybe we just naturally see 3D." Molyneux provides the empirical (or quasi-empirical) test case to prove that the 3D perception is *acquired*. It strengthens the "judgment" claim by showing what happens when judgment *hasn't* had time to work yet.
