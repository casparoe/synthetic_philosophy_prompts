      *   *Locke's Commitment:* Locke is committed to the view that the blind man *could* learn to distinguish them quickly because there *is* a connection (the primary quality of figure). He is not committed to heterogeneity. He is committed to *associative learning* linking two distinct sensory inputs to one external quality.

