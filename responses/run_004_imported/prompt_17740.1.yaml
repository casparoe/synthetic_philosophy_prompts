answer: |-
  The air in the pub was thick with the smell of stale ale and the hum of post-conference exhaustion. Julian loosened his tie, signaling the bartender for another round. Elena sat opposite him, still wearing her conference badge, swirling a glass of red wine like it was a hazardous sample.

  "You're smiling," Elena said. "That means you think Lewis won."

  "Lewis didn't win," Julian corrected, accepting his pint. "Lewis cleaned up the mess. Martin's electro-fink was a scare, sure. But the Reformed Conditional Analysis (RCA) handles it. We just require that the causal basis persists through the stimulus. If the wire isn't live *at the moment of touching*, the conditional 'if touched, it would conduct' doesn't apply. Problem solved."

  "Problem deferred," Elena countered. "You patched the fink, but you left the barn door wide open for masks. And unlike finks, masks don't remove the basis. They leave it sitting there, pristine, while preventing the manifestation."

  "Standard masking is extrinsic," Julian said, taking a long drink. "Bubble wrap around a glass. We just add a *ceteris paribus* clause. 'If struck, *and no interferers are present*, it would break.' It's a minor adjustment to the antecedent."

  "Is it?" Elena leaned in. "Because if you have to list every possible interferer in the antecedent, your analysis becomes infinitely long. But let's play your game. Let's say you add 'in the absence of extrinsic masks.' I have a case for you. Call it the *Thermoplastic Crystal*."

  Julian raised an eyebrow. "I'm listening."

  "Imagine a crystal lattice that is, by all standard chemical metrics, fragile. The bonds are weak, the structure brittle. That's your categorical basis. But, intrinsic to the crystal, there's a piezoelectric feedback loop. The instant stress is applied—the instant of the stimulus—the lattice momentarily hardens. It absorbs the shock. Then, immediately after the impact, it reverts to its brittle state."

  Julian set his glass down. "So it doesn't break."

  "Correct. It doesn't break. But the basis—the brittle lattice—was there before the strike, and it's there after the strike. It only changed *during* the stimulus, intrinsically, as a reaction to it."

  "That's a fink," Julian said quickly. "The basis didn't persist intact."

  "Did it?" Elena pressed. "The *fragility* basis is the weak bonding. The weak bonding is still there. The hardening is a secondary property, a mask, but it's intrinsic. If you exclude intrinsic masks from your analysis, you're saying the object isn't fragile. But chemically, it *is* fragile. It just has a defense mechanism. If you ship a million of these crystals, and the shock-absorber mechanism fails in one out of a thousand due to a manufacturing defect, that one shatters. The others don't. Are you going to tell me the 999 weren't fragile? Or are you going to say your conditional analysis can't distinguish between 'not fragile' and 'intrinsically masked'?"

  Julian rubbed his chin. "Okay. So we refine the causal basis. The basis isn't just the weak bonds; it's the total microstructural state. If the total state includes the hardening mechanism, then the object simply lacks the basis for fragility. It's a different kind of object."

  "And there it is," Elena said, pointing a finger. "You're chasing the ontology. You're saying 'whatever doesn't break isn't fragile.' But that makes fragility nothing over and above the breaking. I'm telling you the disposition is real even if it doesn't manifest. The power is there, it's just blocked."

  "That's mysticism, Elena. 'Powers' that never power."

  "They're not never-powering. They're masked. Look, let's try a different angle. You want to ground the conditional in a categorical base. Let's talk about *mimics*."

  "Mimics are easy," Julian said. "A hologram of a fragile glass. It shatters when struck, but it wasn't fragile. We handle that by insisting the causal basis must be the *right kind* of basis to produce the effect."

  "Right kind according to what theory?"

  "Physics. Chemistry."

  "Okay," Elena said. "Consider the *Placebo Poison*. A substance that is chemically inert. Totally harmless. But, due to a bizarre quirk of human biology we don't fully understand, if a human ingests it, their immune system overreacts catastrophically and they die. The conditional 'if ingested, it would kill' is true. But there is no toxic basis. The basis is in the victim, not the poison."

  Julian sighed. "We relativize the disposition. 'Poisonous-to-humans.' The basis is the interaction between the substance and the human physiology."

  "So the disposition isn't in the object?"

  "It's a relational property. That's fine."

  "But," Elena said, lowering her voice, "what if the reaction is specific to the *tester*? Imagine a substance that kills *only* when tested by a metaphysician who believes in powers, but is inert for everyone else. A *Metaphysical Fink*."

  Julian laughed. "That's absurd."

  "Is it? You're the one who wants to analyze dispositions via conditionals involving stimuli. If the stimulus includes the observer's theoretical framework—because the observation affects the quantum state, or whatever—your conditional becomes indexical. 'If I, who believe in powers, touch it...'"

  "Stop," Julian held up a hand. "You're drifting into quantum woo. Let's stick to the macro. The point is, my analysis works for standard cases. Science uses conditionals. 'Soluble in water' means 'dissolves if immersed.' They don't posit little 'solubility ghosts' inside the sugar cube."

  "They don't need to, because they're doing science, not metaphysics," Elena shot back. "But you asked for the metaphysics. Here is the real problem for your RCA. It's the *problem of the stimulus*."

  "Go on."

  "To test if a glass is fragile, I have to strike it. But if I strike it, I might trigger a fink, or a mask, or change the basis. To know if the conditional is true, I need to know if the conditions are 'normal.' But to know if the conditions are normal, I need to know if the object is disposed to break. It's circular."

  "We assume normalcy until proven otherwise," Julian said.

  "Exactly! You're assuming the disposition to test the disposition. The conditional analysis presupposes the very thing it's trying to analyze. That's why I say the power must be primitive. It's a categorical fact about the object that *grounds* the truth of the conditional, not the other way around."

  Julian leaned back, looking at the ceiling. "If I accept that... if I accept that dispositions are primitive... what do I gain? I gain the ability to say the thermoplastic crystal is 'really' fragile even when it doesn't break. But I lose the connection to empirical verification. I can't measure a 'power.' I can only measure manifestations."

  "You measure the effects of the power," Elena corrected. "Just like you measure gravity. You don't see gravity; you see apples fall. You posit the field to explain the fall. I'm positing the power to explain the conditional."

  "But gravity has a mathematical structure," Julian said. "It reduces to curvature in spacetime. It's not a brute fact. If you make dispositions primitive, you're stopping explanation too early. You're saying 'it breaks because it has a breaking-power.' That's a dormitive virtue."

  "It's not a dormitive virtue if the power has a structure," Elena argued. "A power is a directedness. It's intentional, in the Brentano sense. The fragile glass is 'pointed' toward breaking. The conditional analysis strips out the directionality and leaves only the success rate. But consider this: A gun is loaded. It has the power to fire. The firing pin is blocked by a safety catch (a mask). You remove the safety catch, but the gun rusts solid before you pull the trigger (a fink). When was it 'loaded'?"

  "Between time *t1* and *t2*," Julian said.

  "But the conditional 'if triggered, it would fire' was false at *t1* because of the mask, and false at *t2* because of the rust. Yet the gun was loaded the whole time. The truth of the disposition outlasts the truth of the conditional."

  Julian swirled his beer. "I can handle that. We use time-indexed conditionals. 'At *t*, if triggered, it would...'"

  "But at *t*, the mask is present! So the conditional is false."

  "Then we say: 'At *t*, if triggered *and the mask were removed*...'"

  "And how do you cash out 'the mask were removed' without referencing other dispositions?" Elena pounced. "To remove the mask, the safety catch must be *movable*. That's another disposition. To un-rust, the metal must be *cleanable*. Another disposition. You're building a web of conditionals hanging in mid-air. I'm offering you an anchor."

  Julian was quiet for a moment. The noise of the pub seemed to swell around them. "Here's my worry, Elena. If you make powers primitive, you make them safe from analysis. But you also make them inert. If the power is distinct from its manifestation, and distinct from the categorical base... what work is it doing? It's a shadow. Lewis wanted to banish the shadows."

  "It's doing the work of grounding the counterfactuals," Elena said. "It explains *why* the conditional is true, even when the antecedent is false. Why is it true that this glass *would* break, even though it never will? Because it has the power. Your analysis says it's true because... well, because it's true. It's a brute modal fact."

  "I'd rather have brute modal facts than occult properties," Julian muttered.

  "Occult?" Elena smiled sharply. "You think charge isn't occult? Mass? Spin? We name them by what they *do*. That's dispositionalism. I'm just taking you seriously. If everything is what it does, then the 'doing' potential is more fundamental than the 'done' actual."

  Julian signaled for the check. "I'm not conceding. I think there's a way to refine the antecedent. Maybe we appeal to similarity classes. This glass is like other glasses that broke..."

  "And if all the other glasses are masked?" Elena asked. "You have a world of bubble-wrapped glass. None of them ever break. Are they all fragile? Your conditional analysis says no. My power theory says yes."

  "If none of them ever break, and none of them would break even if unwrapped because the atmosphere is too soft... then maybe they aren't fragile," Julian said, standing up. "Maybe fragility is a relational property of the glass *and* the world. You want the power to be intrinsic. I'm saying it's ecological."

  "And if I put one of those glasses in a normal world, and it breaks?"

  "Then it was fragile."

  "Ah," Elena stood as well. "So the truth of the disposition depends on a world it isn't in? That's externalism about powers."

  "It's contextualism," Julian corrected, pulling on his coat. "Look, I'll grant you this: The finks and masks show that the *simple* conditional analysis is dead. Lewis knew that. But the project of naturalizing modality? That's not dead. If I posit primitive powers, I have to explain how they interact. Do they have masses? Do they take up space? If not, how do they cause anything?"

  "And if you reduce them to conditionals," Elena said, picking up her bag, "you have to explain how a mere truth-condition can cause a glass to shatter. Conditionals don't break things, Julian. Glasses break things. Or rather, the nature of the glass does."

  They walked out into the cool night air. The workshop was over, but the argument hung between them, unresolved, like a disposition waiting for a stimulus.

  "Same time tomorrow?" Julian asked.

  "Only if you're ready to discuss mimicry," Elena said. "I've been working on a case involving a perfect duplicate of a poison that cures instead of kills."

  Julian groaned. "I'll bring the coffee."
