      *   *Verdict:* It's a **Cheat** if the earlier scenes are rendered as pure virtue. It's **Coherent** if the earlier scenes are rendered as virtue *relative to lower stakes*. I'll lean towards **Coherent** because human beings are inconsistent, and literary fiction should reflect that. But I must warn about the "Contract with the Reader."

  5.  **Drafting the Response:**
