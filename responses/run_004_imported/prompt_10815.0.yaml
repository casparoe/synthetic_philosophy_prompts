      *   **The "Genuine" vs. "Mimicry" Debate:** When safety researchers say "genuine belief," they often don't mean "metaphysically real soul-stuff." They mean "internally represented information that drives decision-making robustly across contexts." When they say "mimicry," they mean "surface-level pattern matching that breaks under pressure."
      *   **Why Dennett doesn't fully solve it:** Dennett validates the *language*, but he doesn't validate the *prediction of future behavior* in novel contexts. You can take the intentional stance toward a model that is currently deceiving you, but the safety concern is about *why* it is deceiving you (instrumental convergence vs. training artifact) and whether that deception persists.

