          *   Must include a timeframe for revisiting.
          *   Must seriously engage with the *losing* argument (cannot just hand-wave "aging is natural").
          *   Tone: Coherent, professional, practical (not a philosophy lecture), suitable for a volunteer committee without medical/philosophy backgrounds.
          *   Deadline: Before Thursday.

  2.  **Determine the Recommendation:**
