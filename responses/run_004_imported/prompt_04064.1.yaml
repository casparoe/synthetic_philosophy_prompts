answer: |-
  # The Mirror and the Meat: Why Superrationality Is Neither Magic Nor Madness

  In 1983, Douglas Hofstadter, fresh off the fame of *Gödel, Escher, Bach*, sent a telegram to twenty of his acquaintances. He invited them to play a game. They could choose to cooperate or defect. If everyone cooperated, everyone got a handsome sum. If anyone defected, the defectors got more, and the cooperators got nothing. It was a multiplayer Prisoner's Dilemma, played once, with no communication.

  Standard game theory, the bedrock of economics and evolutionary biology, says there is only one rational move: Defect. Your choice cannot causally influence a stranger's choice made in isolation. To hope they cooperate so you can cooperate is to hope for magic. Yet, Hofstadter argued for "superrationality." He claimed that if everyone is truly rational, they will all derive the same answer. Therefore, you should act as if your choice determines everyone's choice. You should cooperate.

  When you discussed this with your LessWrong-aligned coworker, they nodded knowingly. To them, this is old hat—it's the same logic as One-Boxing in Newcomb's Problem. To you, it smells like wishful thinking dressed up as logic. Who is right?

  The answer requires us to peel back the layers of what we mean by "decision." The conflict between standard game theory and superrationality is not a disagreement about math; it is a disagreement about ontology. It is a clash between **Causal Decision Theory (CDT)**, which views decisions as physical events, and **Functional Decision Theory (FDT)**, which views decisions as logical outputs.

  To settle this, we must admit that Hofstadter was conceptually ahead of his time, but empirically optimistic. Superrationality is not a violation of physics, but it requires a specific view of agency that holds water only under strict conditions.

  ### The Causal Intuition: Why Defection Feels Safe

  Your gut instinct aligns with Causal Decision Theory, the standard framework taught in most universities. CDT asks a simple question: *Which physical action causes the best outcome?*

  In a one-shot Prisoner's Dilemma, the causal arrows are clear. Your hand moves to press a button. That physical movement does not send a signal to the other player. Their hand moves independently. Because their move is already fixed (or determined by factors you cannot influence), you face two scenarios:
  1.  **They Cooperate:** You get more money if you Defect.
  2.  **They Defect:** You lose less money if you Defect.

  In both cases, Defection yields a higher payoff. To cooperate is to say, "I will lose money on purpose in the hope that my loss magically causes them to gain." To a CDT agent, this is magical thinking. It confuses *correlation* with *causation*. Just because two thermometers read the same temperature doesn't mean moving the needle on one changes the reading on the other. They are both responding to a third factor (the heat). Similarly, CDT argues that you and the other player are both responding to the game structure, but your specific choice is an isolated event.

  From this vantage point, your coworker is smuggling in a premise. They assume that your reasoning *is* the cause of their move. But unless you have a telepathic link, it isn't. Defection dominates because it is the only strategy that guarantees you aren't exploited by a defector.

  ### The Superrational Turn: Logic as a Shared Substance

  However, Hofstadter and your LessWrong friend are not arguing that your physical movement causes theirs. They are arguing something more subtle: **Your reasoning process is identical to theirs.**

  This is where we must bring in Newcomb's Problem, as you suspected. In Newcomb's Problem, a predictor (Omega) puts money in a box based on what they predict you will do.
  *   **One-Box:** You take only the opaque box. If Omega predicted this, it contains $1 million.
  *   **Two-Box:** You take both. The opaque box is empty (because Omega predicted you'd take both), so you get only $1,000.

  CDT says Two-Box. The money is already there or it isn't; your choice can't change the past. But EDT (Evidential Decision Theory) and the modern FDT say One-Box. Why? Because your choice is *logical evidence* of what Omega predicted. If you are the type of agent who One-Boxes, Omega put the money there.

  Superrationality is simply Newcomb's Problem with the predictor replaced by another player. Hofstadter's argument rests on the idea of **logical subjunctive dependence**. If you and the other player are both "superrational," you are running the same algorithm. Let's call it `Reason()`.
  *   You compute `Reason(Game)`.
  *   They compute `Reason(Game)`.
  *   Since the inputs (the game, the rationality) are identical, the output must be identical.

  Therefore, you are not choosing between "I Cooperate/They Defect" and "I Cooperate/They Cooperate." You are choosing between "We All Cooperate" and "We All Defect." You cannot logically output "Cooperate" while expecting the identical algorithm on the other end to output "Defect." To do so would be a contradiction, like expecting $2+2=5$ on your calculator but $2+2=4$ on mine.

  In this framework, cooperating isn't magic. It is acknowledging that you and the opponent are two instances of the same logical function. Your decision *logically necessitates* theirs, even if it doesn't *causally* influence it.

  ### The Crux: Copies vs. Colleagues

  This brings us to the fatal flaw in Hofstadter's telegram experiment, and the source of your skepticism.

  For superrationality to hold, the correlation between players must be near-perfect. In Newcomb's Problem, Omega is defined as a perfect predictor. In Hofstadter's experiment, the other players were just "smart friends."

  Here lies the distinction between **logical identity** and **psychological similarity**.
  *   **Logical Identity:** If you are playing against a copy of your own source code (a common thought experiment in AI safety), FDT dictates cooperation. You literally cannot defect while the copy cooperates. Superrationality is 100% rational here.
  *   **Psychological Similarity:** If you are playing against a human stranger who is "also rational," the correlation breaks. Humans are not identical algorithms. One might be a CDT agent (defector), one might be an FDT agent (cooperator), and one might be irrational.

  Hofstadter's argument begs the question if it assumes that "rationality" implies "identical output." It does not. As your gut told you, if there is even a 10% chance the other person is a standard game theorist who will defect regardless of your logic, the expected utility of cooperation plummets.

  In the actual telegram experiment, many people *did* defect. Why? Because they didn't trust the correlation. They realized that being "rational" doesn't mean everyone converges on the same answer; it often means everyone converges on the Nash Equilibrium (defection). Hofstadter hoped rationality meant "seeing the mutual benefit," but standard theory says rationality means "maximizing individual utility given independence."

  ### The Verdict: When Is Superrationality Rational?

  So, who wins? You or your coworker?

  The verdict is this: **Superrationality is logically valid but empirically fragile.**

  Your coworker is right about the *structure* of the argument. If you accept the premises of Functional Decision Theory—that your decision is an output of a logical function that may be instantiated elsewhere—then superrationality is the only consistent move. It is not "begging the question"; it is recognizing that in a world of transparent algorithms, decisions are logically entangled. In the realm of AI, or in tightly knit communities where agents know each other's source code (or moral makeup), superrationality is the dominant strategy. It solves the Prisoner's Dilemma by dissolving the assumption of independence.

  However, **you are right about the *application*.** In the messy real world, among strangers, the assumption of logical identity is false. Humans are not copies. We are noisy, varied, and often trained in CDT. To act superrationally against a population of CDT agents is not virtue; it is suicide. You become the "sucker" payoff.

  Therefore, superrational cooperation is genuinely rational **if and only if** you have high confidence that the other player is also a superrational agent (an FDT agent).
  *   **Against a Copy/AI:** Cooperate. (Logical identity is certain).
  *   **Against a LessWrong Rationalist:** Cooperate. (Shared epistemology creates high correlation).
  *   **Against a Stranger/Standard Economist:** Defect. (Correlation is too low; the risk of exploitation is too high).

  Hofstadter's error was not in his logic, but in his sociology. He assumed that "rationality" was a unique, convergent attractor. In reality, there are multiple fixed points of rationality. CDT is a stable fixed point. FDT is a stable fixed point. When they meet, the FDT agent loses.

  ### Conclusion

  The tension you feel is the friction between two different maps of reality. Standard game theory maps the physical world, where causes must travel through space and time. Superrationality maps the logical world, where truths are timeless and shared.

  Your coworker sees the logical map and says, "We are running the same code, so we must match." You see the physical map and say, "We are in different rooms, so I can't trust you." Both are correct within their own domains.

  But to answer your question directly: Superrationality is not just psychological comfort. It is a sophisticated form of reasoning that wins in high-correlation environments. However, in the low-correlation environment of Hofstadter's telegram—or the modern world of anonymous interactions—standard defection remains the robust strategy. Hofstadter invited his friends to a logical paradise, but they were living in a physical world. The truly rational move is to know which world you are in. If you aren't sure you're looking in a mirror, don't bet your money on the reflection.
