prompt: |-
  I run a pretty small philosophy podcast (we're talking like two dozen regular listeners) and next week's guest is a scholar who just published a book defending Bertrand Russell's Marriage and Morals against basically every modern objection to it -- her whole pitch is that people dismiss it as "free love guy says free love is fine" when the actual arguments in the book are way more specific and still worth taking seriously today. I don't want this interview to turn into her just walking me through the book's highlights, so I need questions sharp enough that she has to defend the actual moves he makes, not the vibe.

  Can you draft me 8-10 interview questions? I want at least one that presses on his claim that jealousy is mostly downstream of property-anxiety and upbringing rather than a fixed instinct -- and I want it to use the fact that his own marriage to Dora Russell was an open marriage by explicit agreement, not just a theory he held but an arrangement he actually lived, and it still ended in real jealousy and a bitter divorce after they'd both had outside affairs and Dora had two kids with hers. I also want one on the "companionate marriage" idea he leans on from Judge Ben Lindsey's book (which Dora actually wrote the introduction to, apparently) -- is that doing seperate moral work or just giving a respectable name to what he already wanted to believe? One on the double-standard chapter -- does his proposed fix genuinely remove the asymmetry between what's tolerated in husbands vs wives, or does it just extend the same permissiveness to both sides while leaving the old paternity-certainty logic underneath untouched? And one on the odd hinge in the book where the whole ethics of fidelity flips depending on whether children are involved -- is that a real principle doing work, or an escape hatch for whenever the theory gets inconvenient? For each of those four, I want a natural follow-up keyed to whatever answer she'd most likely give to wriggle out of the first version of the question. Throw in a couple more questions beyond those four topics if you've got strong ones.
