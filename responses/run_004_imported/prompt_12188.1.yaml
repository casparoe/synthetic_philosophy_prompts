          *   *Draft Q:* He uses Lindsey's term. Dora introduced Lindsey's book. Is this doing moral work or just naming what he wanted?
          *   *Refinement:* Focus on whether "Companionate" adds normative weight or is just a euphemism.
          *   *Follow-up:* If she says "It provides a social structure," ask if that structure holds without the economic/legal changes Russell also demanded.

      *   *Topic 3: The Double Standard*
