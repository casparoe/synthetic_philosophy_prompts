answer: |-
  **Setting:** *A busy coffee shop near Penn Station. Two philosophers, Elena (Reductionist) and Marcus (Anti-Reductionist), are watching the morning rush. A traveler in a heavy coat approaches a local reading a newspaper, asks for the train platform, receives a quick answer, nods, and walks away confidently.*

  **Elena:** Did you see that? Zero friction. The traveler didn't check the board, didn't look at the stranger's credentials, didn't even hesitate. Just accepted the testimony. As a software engineer, that kind of blind dependency makes me nervous. I want to know the API contract before I call the function.

  **Marcus:** And yet, the traveler will likely make the train. That's the human condition, Elena. We're wired for trust. Thomas Reid called it the "Principle of Veracity." We have a natural propensity to speak the truth, and a complementary propensity to believe it. It's a basic source of justification, like perception. You don't demand proof that your eyes aren't lying to you before you cross the street. Why demand it for words?

  **Elena:** Because eyes have evolutionary track records built into the hardware. Testimony is social. Hume got this right. My justification for believing that stranger is inductive. I've observed a correlation between people giving directions and those directions leading to the intended destination. I'm running a heuristic: *Testimony in this context is usually reliable.*

  **Marcus:** That's the classic Reductionist stance. But you've walked right into Coady's trap. How, exactly, did you establish that correlation? To verify that the testimony was reliable, you had to check the facts. Did the train actually leave from Platform 12?

  **Elena:** Sometimes, yes. I check my own observations.

  **Marcus:** But you can't observe everything. Think about the bulk of what you know. You know the train station exists before you arrived. You know the city has a subway system. You know the stranger is likely a local. Most of *that* knowledge comes from... testimony. Guidebooks, websites, things friends told you. If you need independent inductive evidence to justify trusting testimony, but acquiring that evidence *requires* trusting testimony, your argument is circular. You're using testimony to prove testimony is reliable.

  **Elena:** That's too global, Marcus. Coady's argument works if I'm trying to justify *Testimony* with a capital T. But I don't need a global guarantee. I'm a local reductionist, following Elizabeth Fricker. I don't need to know that *all* humans are honest. I just need to monitor *this* speaker in *this* context.

  **Marcus:** Go on.

  **Elena:** I look for cues of competence and sincerity. Did the stranger look up from the paper? Did they hesitate? Did their accent match the local dialect? Did their body language suggest they were in a rush to mislead me? If the contextual cues are positive, I have a non-testimonial reason to trust *this* instance. I'm not assuming testimony is reliable; I'm assessing the probability of reliability based on perceptual evidence.

  **Marcus:** So you're retreating from global induction to local monitoring. But where did you learn which cues indicate sincerity? You believe that eye contact suggests honesty, or that hesitation suggests deception. How did you learn that mapping?

  **Elena:** Experience. I've seen people lie. I've seen them tell the truth.

  **Marcus:** Again, how did you verify the lies and truths? In the mundane cases that make up your learning set—childhood, school, casual conversation—you relied on parents, teachers, and peers telling you, "He's lying," or "That's true." Your ability to read the cues depends on a background of trusted testimony. If you strip away the assumption that testimony is generally reliable, your "cues" lose their meaning. You're either smuggling in a general presumption of reliability—which makes you an anti-reductionist in practice—or you're left with no basis for interpreting the cues at all.

  **Elena:** I'm not smuggling it in. I'm treating it as a working hypothesis. I assume the cues work *until* they don't. It's a risk assessment. If the stakes are low, like a train platform, the threshold for evidence is low. If the stakes are high—like a colleague telling me a database migration is safe—the threshold rises. I demand code review. I demand logs. Anti-reductionism sounds like it says I'm entitled to believe the colleague just because they spoke.

  **Marcus:** No, that's a straw man. Anti-reductionism isn't "believe everything." It's "you don't need *positive* reasons to believe; you need *negative* reasons to doubt." The default status of testimony is innocent until proven guilty. The burden of proof lies on the skeptic. In your engineer example, if you have no reason to doubt the colleague's competence or sincerity, you are entitled to believe them. You don't need to audit the code to be *justified*, even if you audit it to be *safe*. Justification and prudence are different.

  **Elena:** But that distinction collapses the moment things go wrong. If the migration fails, and I ask, "Why did you trust him?" and you say, "Because he said so," that's not an epistemic justification. That's faith. My view explains why the belief was rational: because the context supported the reliability. Your view makes rationality a default setting that ignores the possibility of error until it bites you.

  **Marcus:** And your view makes rationality impossible for children or newcomers. A child learns language by trusting parents. If the child needed independent inductive evidence to validate the parents' words before believing them, they'd never learn the language required to formulate the evidence. You need a "default and challenge" structure to get the epistemic engine started. Local reductionism works for adults in stable environments, but it doesn't explain how we get epistemic traction in the first place.

  **Elena:** I'll grant that developmentally, we start as anti-reductionists. But as adults, we ought to graduate. We have the capacity to verify. To stay in the default mode is to remain epistemically childish.

  **Marcus:** But you can't verify everything. You're a software engineer. Do you verify the physics underlying the processor you're coding on? Do you verify the geopolitical stability of the cloud region hosting your data? You rely on testimony for the infrastructure of your verification. If you apply your local reductionist scrutiny to every link in the chain, you paralysis. You *must* assume a general reliability of the epistemic community to function.

  **Elena:** I assume reliability, but I don't *justify* my belief with that assumption. I justify it with the specific lack of defeaters. I look for red flags. No red flags + low stakes = belief. That's not a presupposition of truth; it's a calculation of risk.

  **Marcus:** But "no red flags" only matters if you assume red flags would be visible if falsehood were present. That assumes a correlation between truth and observable cues. That correlation is not a necessary truth. Liars can be confident. Experts can be hesitant. To trust the cue is to trust the general reliability of the connection between cue and fact. You're back to needing a general principle.

  **Elena:** Okay, let's stop spinning. We're agreeing on the practice but fighting over the label. You say I'm secretly relying on a general principle. I say I'm relying on specific probabilistic assessments. Let's find a case where our verdicts actually differ. If we can't find one, this is just semantics.

  **Marcus:** Agreed. We need a case where there are no specific cues for competence, no prior track record, low stakes, but high potential for error.

  **Elena:** The traveler example was too clean. The stranger looked like a local. What if the stranger looked like a tourist themselves?

  **Marcus:** Better. Suppose the traveler asks, "Is this the way to the train?" and the stranger, who looks equally lost, says, "Yes, I think so," with moderate confidence. No specific cues of expertise.

  **Elena:** Local Reductionist verdict: Withhold belief. The speaker shows no signs of competence. The probability of error is high. I should check the sign or ask someone else.

  **Marcus:** Anti-Reductionist verdict: Believe, provisionally. In the absence of reasons to doubt—no smirk, no inconsistency, no known motive to deceive—the testimony carries its own weight. It's rational to walk in that direction until you see a sign contradicting it.

  **Elena:** But that's just prudence again. You're saying it's rational to act on it. I'm asking if it's rational to *believe* it's true.

  **Marcus:** If it's rational to act on it without further verification, isn't that functional belief?

  **Elena:** Not if I'm hedging. I can walk that way while assigning only a 40% probability to the claim being true. You're assigning a >50% probability by default.

  **Marcus:** Fine. Let's sharpen it. A child comes to you and says, "There's a dog outside." You can't see outside. You have no specific reason to think this child is a liar, but you know children are sometimes imaginative.

  **Elena:** I need to know the child's age, their history. If I don't know them, I can't assess the local reliability. I suspend judgment.

  **Marcus:** I believe them. The child has no motive to deceive about a dog. The default entitlement stands.

  **Elena:** And if the child is known for fantasy?

  **Marcus:** Then I have a defeater. But without the defeater, I trust. You require a positive reason to trust.

  **Elena:** I require the absence of negative reasons *plus* some positive indicator of context reliability. In a train station, the context is reliable. In a random street corner with a tourist? Not so much.

  **Marcus:** So our divergence is the "plus." I say absence of negatives is enough. You say absence of negatives plus presence of positives.

  **Elena:** Exactly. So, let's take it to the extreme. Online documentation. A library I've never used. The docs say Function X is thread-safe. No community reputation yet.

  **Marcus:** I treat it as thread-safe until I encounter a race condition. The documentation is testimony. It is innocent until proven guilty.

  **Elena:** I treat it as unverified. I assume it is *not* thread-safe until I see the lock mechanism or a test suite. The default for safety-critical claims is skepticism.

  **Marcus:** But that's engineering prudence, not epistemology.

  **Elena:** In engineering, they're the same. If I can't verify it, I don't believe it's safe. I might *hope* it is. But I don't hold the belief "This is thread-safe" as justified.

  **Marcus:** And yet, you use thousands of libraries that way every day. You function as an anti-reductionist while preaching reductionism.

  **Elena:** I function as a gambler. I take the risk. But if you ask me if I *know* it's thread-safe, I say no.

  **Marcus:** And I say yes, you do know, unless you have a specific reason to doubt the author.

  **Elena:** *She checks her watch.* The train's coming. If I ask you, "Is this the right platform," and you say yes...

  **Marcus:** ...You'll believe me?

  **Elena:** I'll check the sign first.

  **Marcus:** *Smiles.* And there we have it. You can't help yourself.

  **Elena:** And you can't help assuming I'm irrational for doing so.

  **Marcus:** Come on. If we miss the train, I'll tell you it was just a testimonial error.

  **Elena:** If we miss the train, I'll tell you it was a verification failure. Let's go.
