      *   *Use:* "Ray believed the value of a painting wasn't in where it hung, but in what it transmitted."
      *   *Use:* "Tolstoy argued that if a peasant and a prince can feel the same thing from a work, that is true art." This appeals to the union guys (peasant/worker) and challenges Priya (the prince/elitism) in a constructive way.

  6.  **Drafting - Tone Check:**
