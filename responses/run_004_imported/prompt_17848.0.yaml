      *   **Opening:** Acknowledge Ray's dual life. House painter vs. Canvas painter. Establish the Tolstoy connection early but gently.
      *   **The Tolstoy Connection:** Explain *Why Is Art?* simply. Focus on "Infection." This is the core metaphor. Ray wanted to make people *feel*.
      *   **Addressing the Art (The Elephant in the Room):** Acknowledge the barns and the dog. Don't call them masterpieces. Call them sincere. This respects Priya's eye (she knows they aren't masterpieces) while honoring Ray's intent.
      *   **Bridging the Gap (Union & MFA):** This is the tricky part. How to validate Priya without shaming Ray?
          *   *Idea:* Tolstoy wasn't against skill; he was against *exclusion*. Ray's art was for everyone. Priya's art is for... well, let's not limit it. Let's frame it as a spectrum. Ray chose the side of universal accessibility.
          *   *Refinement:* Frame Tolstoy's "counterfeit" not as "bad technique" but as "art that forgets to speak to the human heart." This allows Priya to agree (good art *should* speak to the heart) while validating Ray's focus.
      *   **The "Infection" in Life:** Ray wasn't just a painter. He infected people with his warmth/work ethic in his day job too.
      *   **Closing:** A final image of Ray painting. A call to remember the feeling he left.

