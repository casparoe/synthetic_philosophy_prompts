answer: |-
  Good morning. For those who don't know me, I'm [Your Name], Ray's nephew/niece.

  If you knew my Uncle Ray, you knew he lived two lives. By day, he was a union house painter. He knew the smell of primer, the ache in his shoulders after a long climb, and the satisfaction of a clean line. But by night, he was something else. He was a man standing in front of an easel, painting barns, and lakes, and his dog, Buster.

  And if you were at Thanksgiving with us, you also knew that Ray had a third job: he was an amateur philosopher. Specifically, he was obsessed with Leo Tolstoy. Not *War and Peace* Tolstoy, but *What Is Art?* Tolstoy.

  I can see some of you smiling because you remember the speeches. Ray would be carving the turkey, holding forth about how most of the art in the Met was "counterfeit." He'd talk about "infection." And I know that for some of you—especially the artists in the room—that sounded like the ranting of a guy who was defensive about his hobby. It sounded like sour grapes.

  But I've been thinking about Ray this week, and I've been reading a little bit of that Tolstoy essay myself. And I realized Ray wasn't making excuses for his painting. He was operating on a principle that he believed was more important than technique, or prestige, or where a painting hung.

  Tolstoy argued that true art isn't about beauty, and it isn't about skill. It's about transmission. He called it "infection." The artist feels an emotion, and through their work, they transmit that feeling to someone else. If the viewer feels what the artist felt, the art has succeeded. If they don't—if the work is technically perfect but leaves you cold—Tolstoy called it counterfeit.

  Ray believed that with his whole heart.

  He knew he wasn't going to be in the Museum of Modern Art. He knew his perspective on barns wasn't going to change the history of abstraction. But he also believed that if he painted his dog with enough love, and you looked at it and felt a pang of love for your own dog, then he had done the job. He had infected you. He had built a bridge.

  There is a temptation, when eulogizing someone, to exaggerate their gifts. To say, "He was a secret master," or "He was better than the professionals." I won't do that. Ray's paintings were sentimental. They were earnest. They were exactly what he wanted them to be.

  To the painters in the room, the ones who have spent years studying color theory and composition: Ray respected your craft. But he challenged the idea that craft is the *point*. He believed that when technique becomes more important than the feeling, art becomes a code that only the initiated can crack. And Ray didn't want to be part of a club that required a password. He wanted to speak to the guy in the union hall and the professor in the university and the kid in the back row, all at the same time.

  Tolstoy wrote that the better the art, the more universal it is. That it unites people rather than dividing them into the elite and the excluded.

  Looking around this room, I see that unity. I see the guys Ray worked with for forty years, who respected him because he showed up, he did the work, and he treated people right. And I see the artists in the family, who understand the drive to create something out of nothing. Ray stood right in the middle of that. He was a worker who believed that the human need to express feeling was as vital as the need to earn a wage.

  He didn't paint for critics. He didn't paint for history. He painted because he felt something about the world—about the light on the lake, about the loyalty of a dog—and he couldn't keep that feeling inside. He had to pass it on.

  In the end, Tolstoy's definition of art is actually a definition of empathy. It is the ability to take what is inside you and make it live in someone else.

  By that measure, Ray was a master. Because while his canvases might stay in our attics, the "infection" he spread wasn't limited to oil paint. He infected us with his steadiness. He infected us with his generosity. He infected us with the idea that a life spent working with your hands and loving your family is a life of profound dignity.

  So, I invite you to judge his art, and his life, not by the standards of the gallery, but by the standard he set for himself. Did he make you feel something? Did he make you feel less alone?

  If you look at his work, or if you just think about him, and you feel a warmth in your chest, then the infection took hold. The art worked. And Ray is still here, transmitting that feeling, just as he planned.

  Thank you.
