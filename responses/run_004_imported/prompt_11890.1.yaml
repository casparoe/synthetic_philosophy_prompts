  *Correction:* Actually, Simpson's Paradox in A/B tests often happens when the *mix* of users differs between Control and Variant (e.g., Variant got 60% Mobile, Control got 40% Mobile). This is an imbalance issue. If the mix is imbalanced, the aggregate is biased. But if you fix the weights, you get the truth. Simply looking at segments doesn't solve the "what is the overall impact" question.
