          *   Multiple testing (false positives).
          *   Sample size issues (noise).
          *   The "True" Effect depends on the goal (Global vs. Local).
      *   **Provide the Nuanced Approach:**
          *   Investigate *why* the paradox happened (allocation imbalance).
          *   Pre-specify segments (don't fish).
