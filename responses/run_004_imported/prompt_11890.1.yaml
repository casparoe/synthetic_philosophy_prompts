      *   *The Multiple Testing Problem:* Explain false discovery rate. If you check 50 slices, 2-3 will look significant by chance.
      *   *When is Aggregate Right?* If the traffic mix in the test matches production, the aggregate *is* the business impact. The paradox usually implies an imbalance in randomization (e.g., Variant got more Mobile traffic).
      *   *When is Segment Right?* If there is true effect heterogeneity (the feature actually works better for iOS than Android).
      *   *The Real Lesson:* Check randomization balance *first*. If imbalance exists, adjust (stratification/weighting). Don't just slice blindly.
      *   *Recommendation:* Pre-define slices. Limit the number. Investigate imbalance.

  6.  **Refining the Tone:**
