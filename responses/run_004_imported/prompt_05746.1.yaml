answer: |-
  **Setting:** *A shaded pavilion in Pataliputra, circa 4th century CE. The air is thick with heat and the scent of sandalwood. An audience of students sits in silence. On one side sits Bhikkhu Vasumitra, robes ochre, eyes lowered but alert. On the other, Nyayika Govinda, white-clad, holding a staff of logic.*

  **Govinda:** (Tapping his staff on the stone floor) Let us begin with the obvious, Venerable One. You say there is a river, but no water. You say there is thinking, but no thinker. I look at my own hand. I say, "This is mine." I remember holding this staff yesterday. I say, "I held this." If there is no *Atman*, no persisting agent, who is the "I" that claims ownership of the hand and the memory of the staff?

  **Vasumitra:** The word "I" is a convention, Govinda. A label placed upon a stream of moments, like calling a sequence of flashes a "flame." When you say "I held the staff," it is merely a later moment of consciousness arising in dependence upon an earlier moment of consciousness that contacted the staff. There is transfer of state, not transfer of substance.

  **Govinda:** Transfer of state? This is the heart of my objection. Consider recognition (*pratyabhijna*). I see a pot. Tomorrow, I see the same pot and I think, "This is *that* pot." For this judgment to arise, the subject who saw it yesterday and the subject who sees it today must be identical. If the subject of yesterday has perished—and you insist all conditioned things perish in a moment—then the subject of today is a stranger. A stranger cannot recognize what a dead man saw.

  **Vasumitra:** A stranger does not need to recognize it. Causality does not require identity. Consider a lamp lit at dusk. The flame at the first watch of the night is not the flame at the second watch. The molecules of oil consumed are different. The heat is different. Yet, we say it is the "same lamp." Why? Because the later flame is causally dependent on the earlier flame.

  **Govinda:** (Leaning forward) The lamp analogy is your favorite shield, but it leaks. The lamp is a substance (*dravya*). The flame is a quality (*guna*) inhering in the wick and oil. You deny the substance! You say there are only moments (*kshanas*). If moment A sees the pot, and moment A perishes instantly, it is gone. Utterly. Non-existent. How can non-existence cause anything? If moment B arises to remember the pot, it must retrieve the image from somewhere. If A is dead, where is the image stored?

  **Vasumitra:** It is not stored in a "somewhere." It is stored in the *vasana*—the perfuming, the imprint. When moment A arises, it does not vanish without trace. It conditions moment B. The capacity to recall is not a retrieval of a dead object by a new subject. It is the ripening of a seed. The seed is not the sprout, Govinda. The seed is destroyed. Yet the sprout bears the nature of the seed.

  **Govinda:** The seed and sprout share a continuum (*santana*), I grant you. But a continuum requires a connector. In Nyaya, we posit the *Atman* as the substrate (*ashraya*) that holds the qualities of cognition, pleasure, pain, and volition. Without a substrate, qualities float like magic. If I commit a sin today, and suffer hell in a future life, who suffers?

  **Vasumitra:** The stream suffers.

  **Govinda:** (Sharp laugh) The stream! You speak of a river that has no water, and now a sufferer that has no self. If the being who commits the sin dissolves into moments, and the being in hell is a new aggregation of moments, then you are punishing an innocent man for a crime he did not commit. The killer is dead. The victim of the punishment is unborn. Where is the justice of Karma?

  **Vasumitra:** Is the man who plants a bitter neem tree the same as the man who eats the fruit ten years later? Physically, his body has replaced every cell. Mentally, he is wiser, older, different. Yet, he eats the fruit, not his neighbor. Why? Because he stands in the causal line of the planting. The fruit does not fall on the neighbor's head. Karma is not a legal contract requiring a permanent CEO. It is a natural law of cause and effect.

  **Govinda:** But the neighbor *could* eat the fruit if he stole it. That is the point! Identity determines entitlement. If there is no persistent self, what stops the Karma of Devadatta from ripening on Yajnadatta? If they are both just "streams," and all streams are ultimately empty of self, why is the causality locked to one specific stream? What defines the boundary of the stream if not a self?

  **Vasumitra:** (Pauses, fingers tracing the edge of his bowl) The boundary is defined by causal exclusion. The *vasanas* of Devadatta's stream do not interact with the *vijnana* of Yajnadatta's stream. They are distinct causal series. Just as one flame does not light another unless they touch, one mind-stream does not inherit the karma of another unless there is causal connection. The "lock" is not a self; it is the specific conditioning of the moments.

  **Govinda:** You argue from exclusion. But consider the synthesis of experience. Right now, I see the color of your robe, I hear the tone of your voice, and I feel the heat of the sun. These are three different senses. Eye, ear, skin. Yet, *I* experience them as one unified field. "I see, hear, and feel." If there is only a series of momentary consciousnesses—one visual, one auditory, one tactile—who synthesizes them? A visual moment cannot hear. An auditory moment cannot feel. There must be a single agent behind the senses to unify the data.

  **Vasumitra:** There is no single agent. There is only the rapidity of the succession. Like a spinning firebrand that looks like a circle of fire. There is no circle, only the moving point. The mind-moment arises so quickly that the illusion of synthesis is created.

  **Govinda:** Illusion! You build your entire philosophy on an illusion. But an illusion requires a perceiver to be deceived. If I am deceived into seeing a circle, *I* am the one deceived. If there is no "I," who is confused? You are caught, Vasumitra. To deny the self, you must use the self to argue the denial.

  **Vasumitra:** I am not caught. I am cutting the knot. You say, "Who is deceived?" I say, "Deception is happening." Pain happens, but there is no "pain-er." Seeing happens, but there is no "seer." You posit an *Atman* to explain memory and unity, but this *Atman* is unchanging. If it is unchanging, Govinda, how does it learn? How does it remember?

  **Govinda:** (Blinking) Explain.

  **Vasumitra:** If the *Atman* is permanent, it cannot change. If it cannot change, it cannot acquire new qualities. Memory is a change—a movement from ignorance to knowledge. If the *Atman* remembers today what it did not know yesterday, it has modified. If it modifies, it is impermanent. If it is impermanent, it is not the *Atman* you claim. You want a self that is permanent enough to own karma, but changing enough to experience it. You cannot have both.

  **Govinda:** (Strokes his chin, eyes narrowing) We do not say the *Atman* changes in its essence (*svarupa*). It changes in its qualities (*guna*), through connection (*samyoga*) with the mind (*manas*). The *Atman* is the locus. The screen does not change when the movie plays upon it, yet the movie is seen.

  **Vasumitra:** Then the *Atman* is passive. It is inert. If it is inert, it cannot be the agent of action. It cannot "do" karma. If the *Atman* is just a screen, then the body and mind are committing sins and suffering hells, and the *Atman* is merely watching. Then why liberate the *Atman*? It is never bound. It is never stained. Your liberation is meaningless.

  **Govinda:** It is bound by ignorance of its own nature! It identifies with the mind.

  **Vasumitra:** And who identifies? If the *Atman* is pure consciousness, and ignorance is a quality of the mind, how do they mix? You are multiplying entities to save a hypothesis. I offer you a simpler path. Moments arise, condition the next, and cease. Memory is the resonance of the past moment in the present. Karma is the momentum of the stream. Suffering is the friction of craving within the stream. Nirvana is the cooling of the fire. No owner needed.

  **Govinda:** No owner needed for the fire, perhaps. But who seeks Nirvana? If the stream merely cools, it is extinction. If a self seeks liberation, it is because it desires freedom from pain. A stream of moments has no desire. Desire requires a subject who feels lack. You say "craving arises." I ask, "In whom?"

  **Vasumitra:** (Voice softening) In no one. And that is the liberation, Govinda. You suffer because you hold the stream to be "me." You guard it, you feed it, you fear its end. When you see there is only the flowing, the fear ceases. The question "Who seeks Nirvana?" is like asking "Which flame goes out?" The fire goes out. That is enough.

  **Govinda:** (Silent for a long moment) You offer peace, Vasumitra. I offer truth. If there is no knower, knowledge is impossible. If there is no agent, morality is a phantom. I cannot accept a world where the debt of karma is paid by a ghost to a shadow.

  **Vasumitra:** And I cannot accept a world where an eternal king sits upon a throne of changing dust, claiming ownership of a kingdom that burns every second.

  **Govinda:** (Stands up, bowing slightly) Then we remain as we are. You with your stream, I with my self. Both of us trying to cross the same river.

  **Vasumitra:** (Bowing in return) Only one of us believes the river is real, friend. But the water wets us both.

  *The audience exhales. The debate is ended, but the silence lingers, heavy with the weight of the unsolved.*
