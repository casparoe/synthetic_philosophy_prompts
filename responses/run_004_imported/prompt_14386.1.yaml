answer: |-
  Thank you all for being here.

  My father left me a specific instruction regarding this speech. He told my mother once that if we stood up here and sanded down his life into the platitude that he "just loved having a big family," he would haunt us. He was a man of specificities. He was a population economist. He didn't just love big families; he loved the *math* of them.

  For those of you who aren't economists—and that is most of this room—my father spent forty years defending a specific, controversial idea. In his field, it was a homemade version of something called the Repugnant Conclusion. In plain English, he believed that a world with more people in it was better than a world with fewer people in it, even if the people in the bigger world had slightly less of everything.

  He believed that total happiness mattered more than average happiness.

  He argued that a dinner table with seven children, where the attention is stretched thin and the pasta has to be stretched with extra breadcrumbs, is a greater good than a table with two children who get steak and undivided attention. He didn't believe love was a pie that shrank when you cut more slices. He believed love was a muscle that grew when you lifted heavier weights. Or, perhaps, he believed that even if the slices *did* get smaller, the sheer number of slices justified the baking of the pie.

  He was very careful about the line he drew, though. He told me often that his theory led to the Repugnant Conclusion, not the Sadistic one. He never argued for bringing children into a life that was *bad*. He only argued for bringing children into a life that was *less resourced*. He wanted seven of us to be "good enough," rather than two of us to be "exceptional."

  I am a novelist. I deal in the interior lives of individuals. My father dealt in aggregates. And standing here, looking at the second row where his colleagues are sitting, I know they are waiting to see if I understand the distinction. I do.

  But standing here, looking at my six siblings, I also know the cost of that distinction.

  To the cousins and friends in the back: You see a bustling clan. You see holidays that require rental halls. You see a legacy that is undeniably loud and present.

  But to my brothers and sisters: We know the other side of the ledger. We know what it feels like to be part of a numerator. Some of us, at various times, felt less like children and more like evidence in a forty-year argument. Some of us felt the thinness of the air he talked about. We know that when you divide time and money and patience by seven, across three different marriages, there are moments where the math leaves a deficit.

  A eulogy is often a place to lie. To smooth over the rough edges of a life so the memory sits easier. But my father hated inefficiency, and he hated dishonesty even more. So I cannot stand here and say his theory was perfect. I cannot say that the "total utility" of our family comforts the specific grief of the moments we felt overlooked. I cannot endorse the calculus without acknowledging the variables that got rounded down.

  And yet.

  Here we are.

  The argument is over. The data is no longer theoretical. It is standing in this room, wearing black, crying.

  If my father was right, then this gathering is his victory. Seven lives, all worth living. A total sum that is undeniably large. If he was wrong, then we are seven separate tragedies of diluted attention.

  I think the truth, as is usually the case, is not in the aggregate, but in the individual. I look at my siblings, and I do not see data points. I see the specific, un-calculable ways we survived the experiment. I see the resilience we had to build because we had to share. I see the alliances we formed in the backseats of cars. I see the independence we learned because no one was watching us closely enough to micromanage.

  My father wanted to maximize the good. He succeeded in maximizing the *presence*. He is gone, and the silence he left behind is heavy. But the noise we make as a family—the argument, the laughter, the sheer volume of us—is the only rebuttal that matters.

  To his colleagues: He held his line. He didn't simplify the math to make it palatable.
  To my siblings: We are not the conclusion. We are the aftermath. And we get to decide what the data means now.
  And to Dad: You wanted the big family. You got the big funeral. You won the argument about the crowd.

  But I hope, wherever you are doing your calculations now, you've finally put the abacus down. You don't need to count us anymore. You just need to know that we are here, and we are enough, however you measure it.

  Rest in peace.
