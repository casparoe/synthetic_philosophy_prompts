      *   *Is it legitimate?* Yes. Expected Value theory breaks down or becomes counterintuitive when expectations are infinite. If $E[\text{yours}] = \infty$ and $E[\text{other}] = \infty$, saying one is larger is meaningless in standard decision theory.
