  2.  **Analyze the Two-Envelope Paradox (Background Knowledge):**
      *   *Setup:* Two envelopes, amounts $A$ and $2A$. You pick one, see amount $X$. Should you switch?
      *   *The Flawed Argument:* $E[\text{other}] = 0.5(2X) + 0.5(X/2) = 1.25X > X$. Therefore, always switch.
      *   *Standard Resolution:* The variable $X$ is not fixed in the expectation calculation. It represents different underlying values depending on whether you hold the smaller or larger envelope. To calculate $E[\text{other}]$, you need a prior distribution $P(A)$.
      *   *Condition for Switching:* You should switch if $P(A=X | \text{you hold } X) < P(A=X/2 | \text{you hold } X)$ (roughly). More precisely, switching is beneficial only for specific values of $X$ given a specific prior, not *all* values.
      *   *Infinite Mean Case:* If the prior distribution allows for an infinite expected value (e.g., St. Petersburg-like distributions), then $E[\text{other}] = \infty$ and $E[\text{yours}] = \infty$. Comparing $\infty$ to $\infty$ is problematic. In some specific infinite-mean distributions, conditional expectation can indeed suggest switching for every observed $X$, but this relies on the non-convergence of the series.

