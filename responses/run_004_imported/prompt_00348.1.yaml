answer: |-
  This is a profound question that cuts to the core of philosophy of mind, personal identity, and ethics. You are describing a phenomenon that challenges the intuitive notion of the "unified self"—the idea that there is a single captain in the ship of your mind who perceives, decides, and remembers everything that happens under your name.

  Since you have clinical support, I will not offer a diagnosis. Instead, I will engage with the conceptual puzzle you've raised. Your situation serves as a real-world stress test for several major philosophical theories about what constitutes an "I."

  ### 1. The Lockean Problem: Memory as Identity
  The philosopher John Locke famously argued that personal identity is founded on memory. For Locke, if you cannot remember doing something, in a very real sense, *you* did not do it. You are a different "person" (in the moral/legal sense) than the one who performed the action, even if you are the same "man" (biological organism).

  If we apply strict Lockean logic to your situation:
  *   **The Texting Agent:** Had access to your knowledge, your wit, and your professional context.
  *   **The Remembering Agent:** Has no access to the experience of sending them.
  *   **Conclusion:** These are two distinct temporal persons sharing one body.

  However, most modern philosophers find Locke's view too fragile. If memory is the only glue, then going to sleep and waking up would technically create a new person, as the continuity of conscious experience is broken. Most contemporary views rely on **psychological continuity**. Even if you lack *episodic memory* (the specific recollection of the event), there is *semantic continuity* (the knowledge used) and *causal continuity* (your brain caused the action). The texting stream drew upon your specific history, your specific jokes, and your specific project data. It was not a random generator; it was *your* cognitive architecture operating without your *narrative* oversight.

  ### 2. The Modular Mind: The "Committee" Model
  Your experience strongly supports the **Modularity of Mind** thesis (championed by cognitive scientists like Jerry Fodor and philosophers like Daniel Dennett). This view suggests the brain is not a single, unified processor but a collection of semi-independent sub-routines or modules.

  Usually, these modules integrate their outputs into a single "user interface" we call consciousness. What you are describing sounds like a decoupling of these modules.
  *   **Module A** handled the auditory processing and speech for the phone call.
  *   **Module B** handled the visual-motor processing and social cognition for the texting.
  *   **The "Executive"** (your conscious awareness) was attached to Module A but not Module B.

  In this framework, it is accurate to say that "you" sent the texts, provided we define "you" as the **organism** rather than the **conscious narrator**. The texts did not come from an external source; they came from your neural networks. The unsettling realization is that the "conscious narrator" is not the only part of the brain capable of high-level agency. You are not a ghost in the machine; you are the machine itself, and parts of the machine can operate without the ghost's knowledge.

  ### 3. The Question of Agency and Responsibility
  This leads to your second question: How do we assign responsibility?

  If we say, "That wasn't me, that was a dissociated stream," we risk a fragmentation of responsibility that makes social life impossible. Legally and ethically, we generally assign responsibility based on **ownership of the mechanism**, not just conscious recollection.
  *   If you sleepwalk and break a window, you are often still held responsible for securing your environment, even if the "conscious you" was offline.
  *   If an autonomous subroutine of your brain sends a professional email, the "professional you" owns the outcome because it utilized your credentials and your knowledge base.

  There is a pragmatic argument here: To function in the world, you must claim ownership of all outputs generated by your body, regardless of which neural subsystem produced them. To deny it is to disown a part of your own capacity. However, acknowledging this responsibility implies a duty to manage the *conditions* that allow for this fragmentation. If high stress causes your cognitive modules to decouple, the "responsible self" is the one that recognizes the limit and reduces the load.

  ### 4. The Illusion of Continuity
  Your experience suggests that the "continuous subject of experience" is more of a **Center of Narrative Gravity** (a term coined by Dennett) than a metaphysical reality. It is a story the brain tells itself to make sense of its inputs and outputs.

  Usually, the story is seamless: *I thought, I acted, I remember.*
  In your case, the story has a gap: *I acted (texted), but I have no record of the thought.*

  This implies that the "I" is not a singular, indivisible point. It is a construct that usually binds together perception, action, and memory. When stress or neurological factors loosen that binding, the construct leaks. It does not mean "you" don't exist, but it does mean "you" are less of a monarch and more of a coalition. Sometimes the coalition passes a motion without the president signing off on it.

  ### Summary
  To answer your specific questions:

  1.  **Does it make sense to say "I" sent the texts?**
      *   **Biologically/Cognitively:** Yes. Your brain, your knowledge, your agency.
      *   **Phenomenologically:** No. The "experiencing self" was elsewhere.
      *   **Verdict:** It is most accurate to say that a subsystem of *you* acted with a high degree of autonomy. The "I" is broader than your conscious memory.

  2.  **Are you fragmented or continuous?**
      *   You are likely continuous as an organism, but fragmented as a *narrative*. The "self" is not a hard drive that records everything; it is a spotlight. Sometimes the spotlight illuminates one corner of the stage while the actors perform in the dark elsewhere.

  3.  **How to assign responsibility?**
      *   Accept functional responsibility (the texts came from your account and mind) but treat the memory gap as a data point regarding your limits. The responsibility lies not in guilt for the action (which was coherent and helpful), but in stewardship over the cognitive environment that allowed the dissociation to occur.

  ***

  *A brief note on safety:* While this discussion is philosophical, the symptom you describe—performing complex tasks with no subsequent memory—is significant. Even with a therapist's input, ensuring that neurological causes (such as specific types of seizures or sleep disorders) have been ruled out by a medical doctor is a prudent step. Philosophy can explain the *implications* of the self, but medicine must ensure the *hardware* is safe.
