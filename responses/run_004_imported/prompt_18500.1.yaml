answer: |-
  You've got the broad strokes right, but if you write that it was *just* a personality spat, you'll get some angry letters from philosophy departments. There was a real, substantive disagreement there, and it actually explains exactly why the word drifted into slang the way it did.

  Here's the nuance you need for the column:

  **1. "What Works" meant different things**
  You're correct that both used the "cash value" metaphor. But for **James**, "what works" was often immediate, individual, and psychological. If believing in God gives you the stamina to get through the day, that belief has cash value *now*.
  For **Peirce**, "what works" was long-term and communal. He defined truth as the opinion ultimately destined to be agreed upon by the entire community of scientific inquirers in the indefinite future. For Peirce, a belief might "work" for you personally today (comfort you), but if it doesn't align with how the universe actually operates, it isn't *true*.

  **2. The Relativism Fear**
  This is why Peirce renamed his view "pragmaticism" (which he called "ugly enough to be safe from kidnappers"). He was terrified that James's version opened the door to relativism—the idea that something can be "true for you" but not "true for me." Peirce was a realist; he believed in real laws and habits in nature independent of human opinion. James was more of a pluralist; he thought the universe was still "in the making," and our beliefs help shape reality.

  **3. The "Will to Believe"**
  James famously argued that if a decision is "live, forced, and momentous" (like religious faith), you have the right to believe ahead of the evidence. Peirce thought this was methodologically dangerous. He believed inquiry should only start with genuine doubt, not a voluntary choice to believe.

  **The Hook for Your Column**
  Here's the kicker for your piece on language: **The slang usage of "pragmatic" is pure William James, not C.S. Peirce.**

  When people say, "Let's be pragmatic," they mean "Let's do what works for us right now to solve this problem," ignoring abstract principles. That is James's psychological, immediate utility. Peirce's version is actually closer to the modern scientific method (rigorous, long-term testing), which is too slow for everyday slang.

  So, the drift of the word isn't just a dilution of philosophy; it's the victory of James's human-centric version over Peirce's science-centric one. You're not missing a spat; you're missing the reason the slang exists at all.
