prompt: |-
  So I've fallen down a bit of a rabbit hole this week and now I'm mildly annoyed at basically every pop-sci explanation of the handicap principle I've ever read, including some from blogs I otherwise trust. The standard story (peacock tails, gazelles stotting at cheetahs, etc) is basically "the signal is honest because its costly -- a low-quality male literally can't afford to fake it." I'm pretty sure I first got the "wait, that's not quite right" itch from an old Overcoming Bias post, or maybe it was somewhere in The Elephant in the Brain, and once I started pulling the thread I ended up skimming Zahavi's original papers, Grafen's 1990 formalization, and then a bunch of the more revisionist stuff -- Getty's papers arguing the whole "sports handicap" analogy is misleading, and Számadó's "fallacy of the handicap principle" paper. Now I've got all these puzzle pieces and no clean picture.

  Could you actually walk me through the real mechanics here, pitched at someone who already knows the peacock-tail 101 version and wants the next level up, rather than the wikipedia rehash? Specifically: (1) explain why mere costliness isn't what's doing the work, i.e. what the cost function actually needs to look like (something about costs being differentially/marginally steeper for low-quality signalers) for honest signaling to be evolutionarily stable, and what goes wrong with a signal that's costly "in general" but doesn't have that specific structure; and (2) explain how this connects to Spence's job-market signaling model in econ, since I gather Grafen's paper explicitly draws that parallel and it's apparently the same underlying math.

  The part that really messed with my intuitions, though, is the equilibrium-cost vs. potential-cost distinction that Számadó and some others push -- the idea that honestly-signaling individuals might not have to pay much realized cost at all in equilibrium, and that it's the cost a cheater *would* face if it tried to bluff that's actually doing the honesty-preserving work. That seems to almost dissolve the "peacock is handicapped by his tail" intuition rather than vindicate it. Can you unpack that for me, and if it's not too much of a tangent, say a bit about how the Maynard Smith/Harper "index vs. handicap" distinction fits into (or cuts across) all of this? Not looking for a survey of the whole field, just want the actual gears to finally click into place.
