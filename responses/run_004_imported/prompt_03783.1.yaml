      *   *Index:* Signal physically constrained by quality. Cannot be faked *at any cost*. (e.g., Roar frequency depends on vocal cord size/depth). Cost is irrelevant; physics prevents cheating.
      *   *Handicap:* Signal *can* be faked, but it's too costly. (e.g., Peacock tail).
      *   *The Blur:* Getty argues many "handicaps" are actually "indices" of efficiency. If a high-quality male produces the signal *more efficiently* (lower marginal cost), is it a handicap or an index?
      *   *Synthesis:* The continuum ranges from pure index (physically impossible to fake) to pure handicap (possible but evolutionarily unstable to fake). Most biological signals are likely in the middle (condition-dependent efficiency).

  6.  **Drafting the Response (Iterative refinement):**

