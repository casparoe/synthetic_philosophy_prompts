  2.  **Deconstruct Question 1: Mere Costliness vs. Differential Marginal Cost:**
      *   *Pop-sci view:* Signal is expensive -> Only rich can afford it.
      *   *Problem:* If a signal costs 10 units for everyone, a high-quality individual pays 10, low-quality pays 10. If the benefit (mating success) is 20, *both* signal. If benefit is 5, *neither* signals. No separation.
      *   *The Fix:* It's not about absolute cost; it's about *marginal* cost relative to quality.
      *   *Mechanism:* The cost of producing signal level $S$ must be lower for high-quality individuals ($H$) than for low-quality individuals ($L$). Specifically, the *marginal* cost of increasing the signal must be steeper for $L$ than for $H$.
      *   *Visual:* Imagine two cost curves. They cross or diverge. The benefit curve is the same for both (initially). Separation happens where $L$'s cost exceeds benefit, but $H$'s cost is still below benefit.
      *   *Key phrase:* "Condition-dependent costs."

  3.  **Deconstruct Question 2: Connection to Spence (1973):**
      *   *Context:* Grafen (1990) explicitly modeled HP using Spence's framework.
      *   *Spence's Model:* Education doesn't increase productivity; it signals it. Cost of education is inversely related to ability.
      *   *Mapping:*
          *   Worker Ability = Male Quality (Genes/Health).
          *   Education Level = Tail Size/Stotting Intensity.
          *   Wage = Mating Success/Receiver Response.
          *   Cost of Education = Cost of Signal.
      *   *The Math:* Separating Equilibrium. High type gets high wage minus low cost > Low type gets high wage minus high cost. Low type prefers low wage minus zero cost.
      *   *Insight:* Biology and Economics converged on the same game-theoretic structure: Signaling Games with Asymmetric Information.

  4.  **Deconstruct Question 3: Equilibrium vs. Potential Cost (The Számadó/Getty Critique):**
      *   *The Intuition Trap:* "The peacock is weighed down by his tail." (Realized cost).
      *   *The Game Theory Reality:* In a stable separating equilibrium, receivers *know* what signal corresponds to what quality.
      *   *Scenario:* If everyone knows Tail Size 10 = High Quality, and Tail Size 5 = Low Quality.
      *   *Low Quality Strategy:* Should a Low Quality male grow a Tail Size 10? No, because the cost is too high for him relative to the benefit. He *chooses* Size 5.
      *   *Result:* In equilibrium, the High Quality male pays the cost of Size 10. The Low Quality male pays the cost of Size 5.
      *   *The Twist:* Does the High Quality male *need* to pay the full cost of Size 10?
      *   *Refinement:* In some models (like Getty's efficiency models), the signal might be an "amplifier" or the cost is only *threatened*. But sticking to Grafen/Spence: The High type *does* pay the cost in equilibrium.
      *   *Számadó's Point:* The "handicap" isn't necessarily a reduction in survival *in equilibrium*. It's that the *potential* cost prevents cheating. Also, some signals might be "efficient" (costless for high type, infinite for low type) - this blurs into Index.
      *   *Crucial Distinction:* The cost ensures stability *against invasion by mutants*. It doesn't mean the signaler is constantly struggling. It means the *option* to cheat is too expensive.
      *   *Wait, nuance check:* Számadó argues that often the *net* benefit is positive, so it's not a "handicap" in the survival sense, but a "costly signal." The term "Handicap" implies a reduction in fitness component (survival) to boost another (mating). If the signal is efficient, survival isn't reduced.
      *   *Clarification:* The "Handicap" name is historically loaded. The *mechanism* is costly signaling. The *realized* cost exists for the high type (they grow the tail), but the *deterrent* cost is what matters for the low type.

