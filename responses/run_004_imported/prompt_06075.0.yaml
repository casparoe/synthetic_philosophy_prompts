answer: |-
  **Scenario: The Subsidized Housing Unit**

  Imagine a city housing authority with **one** subsidized apartment available and three equally qualified, equally needy applicants: **Dana, Elias, and Fatima**. Based on their reported needs and circumstances, the social planner assigns the following cardinal utilities to the outcomes for each individual:

  *   **Utility of receiving the apartment:** 12
  *   **Utility of not receiving the apartment:** 0

  The planner is choosing between two allocation mechanisms:

  1.  **Administrative Allocation:** The apartment is awarded outright to Dana (perhaps based on a tie-breaking rule like earliest application date).
  2.  **Fair Lottery:** A name is drawn from a hat, giving each applicant a $1/3$ probability of receiving the apartment.

  **The Arithmetic of the Tie**

  Under Harsanyi's utilitarian calculus, social welfare is the sum of individual expected utilities.

  *   **In the Administrative Allocation:**
      *   Dana's Utility: $12$
      *   Elias's Utility: $0$
      *   Fatima's Utility: $0$
      *   **Total Social Welfare:** $12 + 0 + 0 = \mathbf{12}$

  *   **In the Fair Lottery:**
      *   Dana's Expected Utility: $\frac{1}{3}(12) + \frac{2}{3}(0) = 4$
      *   Elias's Expected Utility: $\frac{1}{3}(12) + \frac{2}{3}(0) = 4$
      *   Fatima's Expected Utility: $\frac{1}{3}(12) + \frac{2}{3}(0) = 4$
      *   **Total Social Welfare:** $4 + 4 + 4 = \mathbf{12}$

  Because the sum of expected utilities is identical (12 vs. 12), Harsanyi's theorem declares the social planner **indifferent** between giving the home to Dana outright or offering everyone a fair chance. Diamond argues this is morally blind, as the lottery respects ex-ante equality while the administrative allocation does not.

  **The Responsible Premise**

  This indifference is forced by the **ex-ante Pareto condition**, which requires the social planner to rank lotteries solely based on the sum of individual expected utilities, thereby prohibiting the planner from valuing the *distribution* of those probabilities (fairness) independently of the aggregate.
