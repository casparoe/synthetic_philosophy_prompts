answer: |-
  Here are eight interview questions designed for your philosophy club Q&A. They move from the conceptual core of her argument to its scope, objections, and practical implications, with specific follow-ups tailored to anticipated responses.

  **1. The Normative Gap**
  You argue that a hypocrite retains the *correctness* of their claim but loses the *standing* to issue it. For students trying to grasp the stakes: if we all agree the hypocrite is factually right about the moral violation, what specific work is "standing" doing in that gap? Is it a pragmatic rule about effectiveness, or a deep normative fact about moral authority?
  *   **Follow-up:** You'll likely say it's about preserving the integrity of the moral relationship. But if the hypocrite has already damaged that relationship by their own actions, does denying them standing actually repair the relationship, or does it just prioritize the blamer's purity over the blamee's correction?

  **2. Scope and Proportionality**
  Regarding the scope of this forfeiture: if I snap at my sibling for lying to our parents, but I told a small lie last week, do I lose the standing to blame them for *that* specific lie, for *any* lie, or for *any* moral failing? Where does the forfeiture stop?
  *   **Follow-up:** If you argue it's limited to the specific offense to avoid absurdity, doesn't that imply the standing is attached to the *act* rather than the *agent*? And if so, how does that square with your view that blame is a form of moral address between persons?

  **3. Reacquisition of Standing**
  Let's assume standing is forfeited. What is the mechanism for earning it back? Is it a matter of internal reform (actually stopping the behavior), external acknowledgment (apologizing), or a combination? And is there a "statute of limitations," or does the stain on one's authority persist indefinitely?
  *   **Follow-up:** If you say a sincere apology restores standing, does that make standing contingent on the *victim's* forgiveness? Because if I can restore my standing unilaterally just by reforming myself, it seems like I still hold all the power in the moral address, which replicates the arrogance of the hypocrisy.

  **4. The Bell Skepticism**
  Philosopher Macalester Bell has argued that "standing" is redundant—that what actually bothers us about hypocritical blamers isn't a lack of normative authority, but simply the garden-variety vice of arrogance. Why should we posit a distinct category of "standing" rather than just saying hypocrites are annoying and their blame is weighted down by their own vice?
  *   **Follow-up:** You will likely defend standing as a distinct normative power. But if the phenomenological experience of the person being blamed feels the same (resentment/defensiveness) whether the blamer lacks standing or is just arrogant, what observable difference does the "standing" framework make to our actual moral practices?

  **5. Wallace and Moral Equality**
  Drawing on R. Jay Wallace, you frame blame as a kind of moral address that presupposes equality between blamer and blamee. Does the hypocrite lose standing because they implicitly claim an *exemption* from the norms they are enforcing?
  *   **Follow-up:** If the core issue is that claim of exemption, does that mean a hypocrite who *acknowledges* their own failure while blaming you ("I know I do this too, but we both shouldn't") retains their standing? Because that seems to undermine the idea that hypocrisy *automatically* strips authority.

  **6. Cohen and the Epistemic Cost**
  G.A. Cohen was concerned that focusing on the *speaker* rather than the *speech* allows us to dismiss true moral claims too easily. In an era of polarized discourse, isn't there a danger that enforcing "standing" norms gives people a convenient excuse to ignore valid moral criticism just because the critic isn't perfect?
  *   **Follow-up:** You might argue we need to separate the message from the messenger. But if the "standing" norm effectively silences the messenger in a public forum, doesn't the practical outcome look exactly like the *tu quoque* fallacy Cohen warned us against, regardless of the philosophical distinction?

  **7. Public vs. Private Blame**
  My interest in this started with the debate over climate activists who fly private jets. Does your framework distinguish between *private* interpersonal blame (like between friends) and *public* moral advocacy? Does a public figure forfeit standing with *everyone*, or only with those who are directly harmed by their hypocrisy?
  *   **Follow-up:** If you argue they lose standing with the general public, does that imply the public has a "moral relationship" with a celebrity strong enough to be violated by hypocrisy? Or are we borrowing a concept from interpersonal ethics and stretching it too thin when applied to mass media?

  **8. The Chilling Effect**
  Finally, for a high school community: if we take your view seriously, that one must be clean to criticize, do we risk creating a culture where students are afraid to call out bad behavior for fear of being scrutinized for their own past mistakes? How do we balance the demand for standing with the need for moral accountability?
  *   **Follow-up:** You may suggest that we should encourage humility in blame. But if the penalty for hypocrisy is the total loss of authority, doesn't that incentivize people to hide their own faults rather than admit them, which seems to work against the honesty required for genuine moral community?
