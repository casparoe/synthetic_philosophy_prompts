answer: |-
  You have excellent instincts. Your nagging sense that "internal" is not simply a philosopher's synonym for "self-interested" is correct, and your summary, while capturing the popular understanding of Williams, misses the technical machinery that makes his view both more subtle and less damaging to altruism than it first appears.

  To put it bluntly: **Williams' internalism does not entail that we have no obligations to strangers, nor does it define reasons as merely self-interested.** However, it does change *how* we justify those obligations and *what it means* to say someone is "off the hook."

  Here is a breakdown of the distinction, where your summary needs adjustment, and how this bears on the demandingness of morality.

  ### 1. The Subjective Motivational Set (It's Not Just "Desires")
  Your summary suggests an internal reason is one you have "simply because you already want something." This is the most common misconception about Williams.

  For Williams, an agent has an internal reason to $\phi$ if there is a "sound deliberative route" from their **Subjective Motivational Set (S)** to $\phi$-ing. The crucial move Williams makes is to define **S** very broadly.
  *   **S includes:** Desires, yes. But also projects, commitments, loyalties, emotional dispositions, and patterns of evaluation.
  *   **Example:** If I am committed to the flourishing of my children, that commitment is in **S**. If I am disposed to feel guilt when I see suffering, that disposition is in **S**. If I value rational consistency, that value is in **S**.

  Therefore, an altruistic reason can be fully **internal**. If I have a general commitment to human welfare in my **S**, I have an internal reason to send money to malaria victims. I do not need to "want" to do it in the sense of craving it; I need only to be committed to a project that entails it.

  **Correction:** Internal reasons are not "self-interested." They are "agent-relative" in the sense that they must hook onto *that agent's* psychology, but that psychology can be entirely other-regarding.

  ### 2. The Sound Deliberative Route (Reasons Can Grow)
  You worried that the machinery of the "sound deliberative route" was doing more work than your summary allowed. You were right. This is where Williams avoids the trap of saying "you only have reason to do what you currently feel like doing."

  A sound deliberative route allows an agent to discover reasons they didn't know they had. This route includes:
  *   **Means-end reasoning:** (I want X, doing Y achieves X).
  *   **Factual correction:** (I thought this pill was poison, but it's medicine).
  *   **Imagination:** (If I imagine what it's like to be that refugee, I realize I care).
  *   **Constitutive reasoning:** (I want to be a good friend; helping you in this specific way is what being a good friend *consists in*).

  Through deliberation, I might realize that my commitment to "justice" (which is in **S**) actually requires me to donate to strangers, even if I currently feel no emotional pull toward them. The reason was internal all along, latent in my commitments, waiting to be uncovered by deliberation.

  ### 3. External Reasons and the "Amoralist"
  Williams rejects **External Reasons**. An external reason statement claims an agent has a reason to $\phi$ even if there is *no* element in their **S** that could lead to $\phi$-ing via deliberation.

  Williams argues this is metaphysically mysterious. How can a fact (e.g., "a child is starving") give *me* a reason if I have absolutely no care, commitment, or disposition that links to that fact? For Williams, a reason must be capable of motivating (at least in principle). If a "reason" cannot motivate even a perfectly rational version of me, it isn't a reason; it's just a moralistic noise.

  **This leads to your core worry:** *Is the person who feels nothing for distant strangers off the hook?*

  **Williams' Answer:** Strictly speaking, **yes**. If a person truly has *no* element in their **S** (no benevolence, no commitment to justice, no disposition to avoid guilt, no desire for consistency) that links to helping strangers, then they have **no internal reason** to help.

  However, this does not mean Williams thinks such a person is morally fine.
  1.  **Psychological Rarity:** Williams thinks such a person is a monster or a psychopath. Most normal humans *do* have general benevolent dispositions in their **S**. So for 99% of people, the reason to help *is* internal.
  2.  **Blame vs. Reason:** Williams distinguishes between having a reason and being an appropriate target of blame. We might blame the amoralist for having a defective **S**. We say, "You *ought* to care," meaning "Your motivational set is ethically deficient," not "You are violating a rational law of the universe."

  ### 4. Implications for Effective Altruism and Demandingness
  Can one accept Williams' skepticism about external reasons while maintaining we owe a great deal to strangers? **Yes, but the argument changes.**

  **The Singer/Externalist Approach:**
  Peter Singer typically argues that rationality *itself* demands impartiality. If you save a drowning child when you can, you must also save a starving child abroad. If you don't, you are being **irrational**. This relies on the idea that moral reasons are external facts that bind you regardless of your projects.

  **The Williams/Internalist Approach:**
  A Williamsian EA would argue differently. They would say: "Look at your **S**. You claim to value reducing suffering. You claim to value consistency. You acknowledge that distance is morally arbitrary. Given *those* commitments you already hold, a sound deliberative route leads you to donate."
  *   **The Shift:** The pressure isn't "The Universe demands this." The pressure is "Your own values demand this, and if you don't do it, you are being unfaithful to yourself."

  **The Limit on Demandingness:**
  Here is where Williams actually pushes back against the "more demanding wing" of EA. Williams is famous for his **"Integrity Objection"** to Utilitarianism. He argues that morality cannot demand that we abandon our "ground projects" (the fundamental commitments that give our lives meaning, like being a painter, a parent, or a friend) whenever an impartial calculation says we should.

  For Williams, a morality that requires you to sacrifice your ground projects entirely to help strangers is not just hard; it is an attack on your identity. An Internalist account might actually *limit* demandingness. It suggests that while you likely have internal reasons to help strangers (because you have some benevolence), you *also* have strong internal reasons to pursue your own life projects. Morality becomes a negotiation between competing internal reasons, not a trump card held by an external duty.

  ### Summary for Your Feature
  To answer your specific questions:

  1.  **Is internalism a rejection of impartial obligations?**
      No. It is a rejection of obligations that float free of human psychology. It allows for impartial obligations *if* the agent has impartial commitments in their motivational set (which most do).
  2.  **Is "internal" just "self-interested"?**
      Definitely not. "Internal" means "tethered to the agent's motivations," but those motivations can be entirely altruistic.
  3.  **Is the indifferent person off the hook?**
      On the question of *reasons*, yes. Williams would say there is no reason for a psychopath to be good. But on the question of *blame*, no. We can still condemn their character.
  4.  **Can you be a Williamsian and demand high sacrifice?**
      You can argue people have internal reasons to sacrifice a lot. But Williams himself would warn that if the sacrifice destroys the agent's "ground projects," the moral theory has become alienating and inhuman.

  **The Journalistic Angle:**
  The Williams distinction doesn't let us off the hook; it moves the hook. It moves it from "What does the Moral Law require?" to "Who do we want to be, and what do we actually care about?" For a magazine feature, the tension isn't between "Selfishness vs. Duty," but between "Morality as an External Force" vs. "Morality as an Expression of Identity." The EA movement often argues the former; Williams insists on the latter. If they want to persuade people, Williams suggests they shouldn't appeal to abstract duty, but to the commitments people already hold dear.
