  }
  ```

  ***

  **A note on your intuition:** Your programming metaphor ("return value has to be the same type") is actually a very fair way to think about modus ponens in this context! In logic, for an argument to be valid, the terms must remain univocal (same type/meaning) across premises. The student correctly identified that mechanism, even if they botched the history and the Hume comparison.

