  ok so in my early modern phil seminar we keep saying descartes thought animals are just mindless automata with zero feelings, but our professor pointed out thats not actually so clear-cut -- in his letters to the marquess of newcastle and to henry more he seems to allow some kind of bodily sensation even without real thought, which sounds like it could still amount to pain. can you write me an essay that actually settles whether descartes thought animals are literally incapable of feeling anything (including pain), or whether his view leaves room for some low-grade sensation/suffering without a rational soul attached? go through the language-test/automaton argument stuff from discourse V too, and actually commit to a reading instead of just saying its ambiguous.
