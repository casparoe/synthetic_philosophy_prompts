  2.  **Evaluate the Candidates:**
      *   *Liquidity/Hedging Demand (Non-informational motives):* This is the standard "get out of jail free" card for the no-trade theorem. People trade because they need cash, rebalance portfolios, hedge risks (endowments, corporations, retirees). This is fundamentally *not* information-driven trade, so it bypasses the theorem directly. Empirically, a huge chunk of volume is institutional rebalancing, index funds, hedging.
      *   *Noise Traders (Black/DeLong/Shleifer/Summers):* Traders who trade randomly or on non-information signals. Provides liquidity for informed traders. Empirically, retail flow, momentum chasing, etc., fit here. Very high explanatory power for volume, especially short-term.
      *   *Heterogeneous Priors:* If agents don't share a common prior, the theorem breaks. "Agree to disagree" becomes possible. Behavorial finance leans here. Empirically, people *do* seem to have different models/worldviews. However, is it the *main* driver? Maybe secondary to liquidity needs.
      *   *Overconfidence/Behavioral Biases:* People think they know more than they do. This drives excessive trading (Barber & Odean). Empirically very strong for retail volume, less so for institutional (though hedge funds can be overconfident too).
      *   *Grossman-Stiglitz (Costly Information):* If information is costly, prices can't be fully revealing, otherwise no one would acquire info. This justifies *some* informed trade, but doesn't fully explain the *volume* magnitude unless combined with noise. It explains why information trade exists, but not necessarily the trillions in turnover.
      *   *Failures of Common Knowledge of Rationality:* Level-k thinking, etc. People think others are irrational. This is related to overconfidence/heterogeneous priors. Important, but maybe subsets of broader behavioral categories.
      *   *Differences in Interpretation (Likelihood Functions):* Even with common priors, if people process info differently (non-common likelihoods), trade happens. Similar to heterogeneous priors.
      *   *Principal-Agent Problems:* Traders aren't trading their own money. Fund managers might trade to show activity (career concerns) rather than pure alpha. This drives volume without necessarily violating rationality at the agent level (though irrational at principal level).

