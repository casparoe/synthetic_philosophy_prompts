      3.  Address Abel/Noah: They represent the "Primitive Stage" of religious cognition. God accommodated their limits, just as He accommodated Israel's limits.
      4.  Address the "Idolatry" specific: The *Sinaitic regulations* (not sacrifice per se) are the anti-idolatry measure.
