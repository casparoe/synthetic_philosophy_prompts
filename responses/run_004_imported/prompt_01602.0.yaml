  3.  **Analyze the Kelly/Ergodic Argument:**
      *   *Context:* Information theory (Kelly) and Statistical Physics/Economics (Peters).
      *   *Mechanism:* Repeated betting with reinvestment. Wealth evolves as $W_{t+1} = W_t \cdot (1 + \text{return})$.
      *   *Math:* The long-run growth rate is the geometric mean, which corresponds to the arithmetic mean of the logarithms.
      *   *Claim:* Maximizing the time-average growth rate is the rational objective for a single trajectory through time. This mathematically yields the same optimization function as Bernoulli's ($\max E[\ln(W)]$).
