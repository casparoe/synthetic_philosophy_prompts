      *   **Kelly/Ergodic View (1956+/2010s):** Wealth compounds multiplicatively (physical/objective dynamics). Time average $\neq$ Ensemble average. Maximizing growth rate = Maximizing expected $\log(\text{wealth})$. No psychology needed.
      *   **The Question:** Would Bernoulli welcome this as vindication or resist it as changing the subject?
      *   **Requirements:** Ground the answer in what Bernoulli's 1738 argument *actually needs*. Analyze whether "diminishing marginal utility" and "non-ergodic wealth dynamics" are competing explanations or just two routes up the same hill.

  2.  **Analyze Bernoulli's 1738 Argument (*Exposition of a New Theory on the Measurement of Risk*):**
      *   *Context:* The St. Petersburg Paradox (a game with infinite expected value that no one would pay much to play).
      *   *Problem:* Classical expected value ($\sum p_i x_i$) fails to match human behavior.
      *   *Solution:* Introduce "moral expectation" (expected utility) instead of "mathematical expectation."
      *   *Key Assumption:* The utility of wealth is not linear. Specifically, $dU \propto dW/W$, leading to $U(W) = \ln(W)$.
      *   *Motivation:* Why $\ln(W)$? Bernoulli argues it's plausible that the value of a small gain is inversely proportional to the quantity of goods already possessed. This is explicitly framed as a statement about human valuation, satisfaction, or "utility" (*utilitas*).
