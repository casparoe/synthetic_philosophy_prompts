      *   *Difference:* Bernoulli needs a *utility function* to explain why a single gamble is rejected. Kelly needs *repetition* to explain why the strategy is optimal.
      *   *Crucial Tension:* Bernoulli's argument is about *valuation* of a single outcome. Ergodicity is about *dynamics* of a sequence.
      *   *Would Bernoulli accept it?*
