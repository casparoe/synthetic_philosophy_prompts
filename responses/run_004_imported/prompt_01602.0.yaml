      *   *Refinement:* Bernoulli's 1738 paper explicitly contrasts "mathematical expectation" with "moral expectation." He posits that the *subjective* experience of wealth is logarithmic. The Ergodic argument says the *objective* growth is logarithmic.
      *   *Key Insight:* The Ergodic argument essentially says "You don't need a utility function; the dynamics impose the log." Bernoulli's argument says "You need a utility function because the dynamics (expected value) don't match reality."
      *   *Synthesis:* They are "two routes up the same hill" mathematically, but they stand on different ontological ground. Bernoulli would likely see the Ergodic argument as a powerful *mechanism* that justifies his *heuristic*, but he might resist the claim that it renders utility obsolete. Why? Because utility explains single-shot decisions where ergodicity (time averages) doesn't strictly apply.

