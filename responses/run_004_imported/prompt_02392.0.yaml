answer: |-
  This is a classic law school (or pub) debate, and honestly, you've hit on one of the most common misunderstandings about H.L.A. Hart. It's a sophisticated point you raised, but **your friend was right to be unconvinced.**

  While you correctly identified Hart as a legal positivist, your argument conflates **legal positivism** with **moral relativism**. That conflation is the weak link in your position.

  Here is the breakdown of why your argument is shaky, where you were right, and what the debate was actually about.

  ### 1. The Big Misunderstanding: Positivism $\neq$ Relativism
  Your core claim is: *Hart says law and morality are separate, therefore he doesn't believe in objective morality.*

  This is the error. Legal positivism is a theory about **what law is**, not a theory about **what morality is**.
  *   **Positivism:** A law is valid if it is enacted by the proper authority, regardless of whether it is moral or immoral. (An unjust law is still a law).
  *   **Moral Relativism:** There are no objective moral truths; morality is subjective to culture or individuals.

  Hart can (and did) believe that certain things are morally wrong while *still* arguing that the law shouldn't punish them. Being a positivist means you don't need morality to *identify* the law, not that you deny morality exists. Hart was actually a proponent of utilitarianism and liberal individualism; he believed in moral reasoning, he just didn't believe the **criminal law** was the right tool to enforce private morality.

  ### 2. Hart's Actual Argument: The Harm Principle
  Hart wasn't arguing against enforcing morality because "nothing is truly immoral." He was arguing against it based on **John Stuart Mill's Harm Principle**.

  Hart's position was:
  *   Just because an act is immoral (e.g., adultery, private consensual homosexuality, which was the context of the Wolfenden Report), that does not make it a proper subject for criminal law.
  *   The law should only intervene to prevent **harm to others**.
  *   If the state enforces morality for morality's sake (Legal Moralism), it infringes on individual liberty without a justifiable public interest.

  So, Hart could look at Devlin and say, "I agree that lying to your friend is immoral, but I disagree that the police should arrest you for it." That isn't relativism; that's liberalism.

  ### 3. Devlin's Argument: The Disintegration Thesis
  You gave Devlin credit for having "guts" to say things are objectively wrong. But Devlin's argument was actually more sociological than metaphysical.

  Devlin argued the **"Disintegration Thesis"**:
  *   Society is not just a political structure; it is a community of shared ideas and morals.
  *   If you allow too much deviation from shared morality (even in private), the "bonds" of society loosen, and society eventually disintegrates.
  *   Therefore, society has a right to use the law to preserve its moral fabric, just as it has a right to use the law to preserve its government.

  Devlin didn't necessarily claim his morals were *divinely* objective. He argued that the "reasonable man" (or the jury) feels a deep sense of disgust/intolerance toward certain acts, and that feeling is the barometer for what morality the law must protect.

  ### 4. Where You Actually Had a Point
  You weren't 100% wrong. Hart *does* make it harder for Devlin to enforce morality because of the Separation Thesis.
  *   If law and morality are inextricably linked (Natural Law), then Devlin has an easier time saying "Immoral = Illegal."
  *   Because Hart separates them, he forces Devlin to provide a **non-moral justification** for criminalization (i.e., "Why does this private immorality hurt the public?").

  Hart successfully poked holes in Devlin's theory by asking: *Where is the evidence that society collapses when people commit private sins?* Devlin couldn't prove that tolerating homosexuality would cause the UK to fall apart in the way that tolerating treason would.

  ### The Verdict
  **Your friend was right to hesitate.**

  You won the point on **Legal Theory** (Hart is the positivist), but you lost the point on **Moral Philosophy**.
  *   **You claimed:** Hart opposes legal moralism because he thinks morality is subjective.
  *   **Reality:** Hart opposes legal moralism because he thinks **liberty** is more important than enforced conformity, even if the morality is objective.

  Most legal philosophers consider Hart the "winner" of this debate in the context of modern liberal democracies. His view largely shaped the decriminalization of homosexuality in the UK. However, Devlin's arguments still pop up today in communitarian critiques (e.g., arguments that excessive individualism erodes social trust).

  **How to save face with your friend:**
  Tell her, "I realized I conflated Hart's legal positivism with moral skepticism. He actually argued for liberty on utilitarian grounds, not because he thought morality was fake. But I still maintain Hart won the debate because Devlin couldn't prove that private immorality causes public disintegration."

  That's a solid pivot that shows you've thought about it further!
