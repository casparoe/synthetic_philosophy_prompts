      *   **Question:** What exactly is Black refuting if Leibniz already admits the possibility of the supposition? Is there a textually defensible distinction between Leibniz's contingent PII and Black's target necessary PII, or does Black's argument succeed regardless?
      *   **Goal:** Help the instructor think through this for a seminar session (needs depth, nuance, and pedagogical utility).

  2.  **Deconstruct the Leibniz Passage:**
      *   *Claim 1:* In sensible things, indiscernibles are never found (empirical/metaphysical claim).
      *   *Claim 2:* It is not "absolutely impossible to suppose them" (logical possibility conceded).
      *   *Claim 3:* Their existence is contrary to divine wisdom/PSR (moral/metaphysical necessity).
      *   *Claim 4:* If they *did* exist, they would be two (numerical distinctness doesn't require qualitative difference *in concept*, but requires a reason for distinctness).
      *   *Implication:* Leibniz's PII is grounded in the Principle of Sufficient Reason (PSR), not just the Law of Non-Contradiction (LNC).

  3.  **Deconstruct Black's Argument (1952):**
      *   *Scenario:* Symmetric universe, two exactly similar iron spheres.
      *   *Goal:* To show PII is not a *necessary truth*.
      *   *Strategy:* Describe a possible world where PII fails. If such a world is conceivable/logically possible, PII isn't logically necessary.
      *   *Assumption:* Black is attacking the logical necessity of PII.

  4.  **Identify the Tension/Overlap:**
      *   If Leibniz says "It's not logically impossible, just contrary to wisdom," and Black says "It's logically possible, so PII isn't necessary," they might be talking past each other *or* agreeing on the modal status but disagreeing on the actuality.
      *   *Crucial Distinction:* Leibniz distinguishes between *logical necessity* (truths of reason) and *moral/metaphysical necessity* (truths of fact grounded in God's choice).
      *   Black treats PII as a candidate for logical necessity. Leibniz treats it as a derivative of PSR (which governs the best of all possible worlds).

  5.  **Develop the Argumentative Lines:**

      *   *Line 1: The Modal Mismatch (The "Straw Man" Defense).*
          *   Black attacks PII as a logical truth (LNC).
          *   Leibniz defends PII as a metaphysical/moral truth (PSR).
          *   *Verdict:* Black succeeds against the *logical* version, but misses Leibniz's *actual* grounding. However, does Leibniz *want* PII to be logically necessary? In the *Discourse on Metaphysics*, he sometimes suggests concepts contain all predicates, implying logical necessity. In the Clarke correspondence, he softens this to PSR. This is a development in Leibniz's thought.

      *   *Line 2: The Nature of "Possibility".*
          *   For Leibniz, "possible" means non-contradictory. Black's world is non-contradictory. So Leibniz admits it's possible *in itself*.
          *   But for Leibniz, "compossible" with God's wisdom is the filter for *existence*.
          *   Black argues that if it's logically possible, PII isn't a necessary truth about *objects*. Leibniz argues PII is a necessary truth about *creation*.
          *   *Refinement:* Does Leibniz think PII holds in *all* possible worlds? If it stems from PSR, and PSR holds in all possible worlds (as a rational principle), then PII should hold in all possible worlds *that God creates*. But what about uncreated worlds? Leibniz is tricky here. Usually, he thinks PII holds in all *possible* worlds because individuation requires a complete concept, and complete concepts differ. Black challenges whether complete concepts *must* differ if qualitative properties don't.

      *   *Line 3: Haecceities vs. Qualitative Properties.*
          *   Black assumes individuation can be primitive (thisness) without qualitative difference.
          *   Leibniz denies primitive thisness. Individuation *is* qualitative difference (in the complete concept).
          *   In the Clarke passage, Leibniz says "If two things... did exist, they would be two." This implies numerical distinctness is intelligible without qualitative difference *if* God willed it, but He wouldn't.
          *   *Wait, check the text:* "I own, that if two things perfectly indiscernible from each other did exist, they would be two." This is huge. It suggests Leibniz accepts the *intelligibility* of distinctness without discernibility, but denies the *actuality* based on PSR.
          *   *Black's Point:* If distinctness without discernibility is intelligible, then PII is not an analytic truth.
          *   *Leibniz's Point:* It is intelligible but irrational (violates PSR).

      *   *Line 4: The Graduate Seminar Angle.*
          *   Need to structure this for discussion.
