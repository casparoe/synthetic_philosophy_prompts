answer: |-
  Your Honour, first let me assure you: that is not a daft argument at all. In fact, you have stumbled directly into one of the central problems of modern epistemology (the study of knowledge), known as **the problem of testimony**.

  Given your background on the bench, you are uniquely positioned to appreciate the tension here. You spent a career distinguishing between *hearsay* and *evidence*, between *expert opinion* and *fact*. Your wife, meanwhile, was operating on the social contract that allows civilisation to function without everyone having to be a geologist.

  Philosophically, neither of you is entirely wrong, but you are operating under different "standards of proof." Here is how the debate breaks down, and where the line on "checking for yourself" is usually drawn.

  ### 1. Your Wife's Position: The Anti-Reductionist View
  Your wife's instinct—that the teacher's word is sufficient for knowledge—is defended by a school of thought stemming from the 18th-century Scottish philosopher Thomas Reid.

  Reid argued that human beings have a natural "principle of credulity." We are hardwired to trust testimony unless we have a specific reason not to. If we didn't, we would be paralyzed. We cannot verify the chemistry of the water we drink, the engineering of the bridge we drive over, or the history of the country we live in. We must rely on the **division of cognitive labor**.

  In your legal terms, your wife is treating the teacher as an **expert witness** whose credentials are accepted by the court (society) without the need for cross-examination in every single instance. For the purpose of a grandson's education and general conversation, her standard is "reasonable reliance." If we required independent verification for every fact, knowledge would be impossible for anyone but a specialist in a very narrow field.

  ### 2. Your Instinct: The Reductionist View
  Your instinct—the "old lab habit"—aligns more with David Hume or a strict empiricist. This view holds that testimony is not a fundamental source of knowledge. It is only valid if it can be *reduced* to observation and induction.

  You wanted to see the measurements because, to you, the testimony is only as good as the evidence backing it. In court, this is the demand for the **exhibit** rather than just the witness's description of the exhibit. You were sensing that "the teacher said so" is technically hearsay. You wanted the underlying data (the geodetic surveys) to establish the fact.

  This is the more defensible position if the stakes are high. If you were building a dam near the Himalayas, your wife's standard would be negligent, and yours would be mandatory. But for a dinner table conversation? It is cognitively expensive.

  ### 3. The Regress Problem: "Where does it stop?"
  You hit the nail on the head with your worry: *"Whatever source I went and checked would just be somebody else's word too."*

  This is the **infinite regress** problem. If you look up the growth of Everest in a geology textbook, you are trusting the author. If you read the author's cited paper, you are trusting the journal's peer review. If you look at the raw GPS data, you are trusting the calibration of the instruments and the technicians who recorded them. You cannot personally measure the tectonic shift; you lack the equipment and the lifespan.

  So, where does checking stop? Most philosophers argue it stops at **institutional reliability**.

  You are justified in stopping your search when you reach a source that has a proven track record of self-correction and transparency. A peer-reviewed geological survey is a "reliable institution." Your wife stopped at the teacher (a proxy for the curriculum). You wanted to go one step further to the data (the survey). Both are forms of trust, but yours is trust in *methodology*, while hers is trust in *authority*.

  ### 4. The Verdict
  Was your wife right, or were you?

  **In a social context, she was right.** Knowledge is a social asset. To reject testimony without a "defeater" (a specific reason to doubt, like the teacher having a history of lies) is to opt out of the community of knowledge. It makes you difficult to converse with, as you discovered.

  **In an epistemic context, you were right.** Your instinct protects against error. Teachers make mistakes; textbooks become outdated; consensus shifts. The scientific method *requires* your skepticism to function over the long term. If no one ever asked to see the measurements, bad science would go unchallenged.

  **The Judicial Compromise:**
  As a judge, you know that the standard of proof depends on the case.
  *   **Preponderance of the evidence (Civil/Daily Life):** Your wife's standard. Is it more likely than not that the teacher is correct? Yes. Accept the fact.
  *   **Beyond reasonable doubt (Critical Inquiry/Science):** Your standard. Is there any possibility of error? Yes. Demand the data.

  My suggestion? Your instinct is a virtue, but like any virtue, it must be tempered by prudence. In retirement, you have the luxury of following your curiosity down the rabbit hole of geodetic surveys if you wish. But when your wife accepts the teacher's word, she isn't being gullible; she is acknowledging that we are finite beings who must trust one another to know the world.

  You were looking for **certainty**; she was looking for **truth**. In human affairs, they are rarely the same thing.
