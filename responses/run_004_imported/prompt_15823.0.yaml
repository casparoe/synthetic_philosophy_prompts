answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Daniel's.

  I want to start by admitting that this toast almost didn't happen. Last night, I was up until 3:00 AM arguing with Priya—who is somewhere at Table Four, currently watching me like a hawk—about whether it is appropriate to base a wedding speech on early 20th-century moral philosophy.

  Specifically, we were arguing about G.E. Moore. Moore argued that the two best things in the world are personal affection—loving someone—and the appreciation of beauty—seeing what is good and fine in the world. But he had this idea called "organic unity." He said that when you combine those two things, when you direct that affection *at* the beauty you see in another person, the value isn't just added up. It multiplies. It becomes the greatest good we can imagine.

  Now, Priya's objection—and she was very insistent on this—was that Moore has a footnote. A big one. He says this "organic unity" only holds its full value if your appreciation is *true*. If you love someone for qualities they don't actually have, if you're projecting a fantasy onto them, the value collapses. It might even turn bad. Priya told me that telling a couple "I hope your admiration is factually accurate" is the least romantic thing anyone has ever said at a wedding. She said it sounds ominous. Like, "Congratulations, I hope you aren't deluded."

  But looking at Daniel and Meg, I realized Moore wasn't writing a warning. He was writing a description of intimacy.

  Because the requirement for "truth" isn't a risk you take on a wedding day. It's a foundation you build beforehand.

  Daniel and Meg were best friends for four years before they were ever a couple. For four years, they didn't have the excuse of romance to cloud their vision. They saw each other on ordinary Tuesdays. They saw each other stressed, tired, generous, stubborn, and kind. They mapped the actual terrain of each other's character long before they decided to build a life on it.

  So, when Daniel looks at Meg, and when Meg looks at Daniel, they aren't looking at a projection. They are looking at a witness. The "truth" that Moore says is required for love to have its full value? That work is already done. They have earned the right to say that what they see in each other is real, because they've spent years checking the evidence.

  To the econometrics PhDs at Table Three: You'll recognize this as avoiding the naturalistic fallacy by grounding value in conscious states, but satisfying the truth-condition through empirical observation over time.

  To everyone else, including Meg's grandmother: It means that the miracle of this marriage isn't just that they love each other. It's that they *know* each other. And because they know the truth of who they are, the love they share is as strong as it possibly can be.

  Daniel, Meg: You have the affection. You have the appreciation. And because of the friendship that came first, you have the truth. You have the whole organic unity.

  Please raise your glasses. To Daniel and Meg.
