answer: |-
  This is an exceptionally sharp reading of the text. You have correctly identified the structural tension that often gets glossed over in IP theory: Jefferson appears to deploy a sledgehammer (the general critique of natural property) and a scalpel (the specific ontology of ideas) simultaneously, and it is not immediately obvious why both are necessary or how they coexist with the utilitarian conclusion.

  Given your background, I will avoid summarizing the text and focus on reconstructing the logical architecture. The coherence of the passage depends on distinguishing between the **juridical source** of property rights (General Argument) and the **ontological fitness** of the object for propertization (Specific Argument).

  Here is a reconstruction of how the two arguments function non-redundantly and how the conclusion preserves the distinction between land and ideas.

  ### 1. The Relationship Between the General and Specific Arguments

  You ask: *If the fully general argument already establishes that nothing is naturally property, what independent work is the idea-specific argument doing?*

  The answer lies in recognizing that Jefferson is fighting a two-front war against English common law theorists (like Blackstone) who argued for perpetual common-law copyright and patent rights based on natural law.

  **The General Argument (The Juridical Move):**
  *   **Function:** It strips the opponent of their *authority*.
  *   **Logic:** If no property is natural, then the claim "inventors have a natural right" is category error. It moves the debate from *discovery* (finding pre-existing rights) to *construction* (creating social policy).
  *   **Limitation:** By itself, this argument is too leveling. If *nothing* is natural property, then land is just as artificial as ideas. This leaves open the possibility that society could, and perhaps should, treat ideas *exactly* like land (i.e., perpetual, heritable, absolute exclusion) because the "social law" that created land ownership could simply be replicated for ideas.

  **The Specific Argument (The Ontological Move):**
  *   **Function:** It constrains the *design* of the social law.
  *   **Logic:** Even if all property is artificial, not all objects are equally *suitable* for artificial propertization. Land is scarce and rivalrous; ideas are non-rivalrous and uncontainable.
  *   **Independent Work:** This argument prevents the opponent from saying, "Okay, property is social, so let's just make idea-property identical to land-property." Jefferson uses the fire/air metaphor to show that ideas resist the very mechanics of exclusion that define property. To propertize an idea requires a much more radical, counter-natural legal fiction than propertizing land.

  **Synthesis:**
  The General Argument says: "You have no *right* to this by nature."
  The Specific Argument says: "And even if we grant you a right by society, the *nature of the thing* makes exclusive control difficult and potentially contrary to the benevolent design of nature."

  Therefore, the Specific Argument is not rhetorical reinforcement; it is a **limiting principle**. It explains *why* the social law regarding ideas must look different from the social law regarding land. If Jefferson relied only on the General Argument, he would have to concede that society *could* grant perpetual patents just as it grants perpetual land titles. The Specific Argument provides the philosophical ground for limiting patents (in time and scope), because the "peculiar character" of ideas makes stable, exclusive ownership inherently unstable and unnatural, even by social convention.

  ### 2. The Conclusion: Concession or Distinction?

  You ask: *Does his closing move... implicitly concede that ideas are, for the purposes that actually matter... no different in kind from land after all?*

  This is the crux of the coherence problem. If both land and ideas are "gifts of social law," wherein lies the difference? Jefferson hints at the answer in the final sentence, specifically in the distinction between **"exclusive property"** and **"exclusive right to the profits."**

  **Land: Property as Constitutive of Order**
  For Jefferson (channeling Locke and the agrarian tradition), stable ownership of land is a prerequisite for civil society. While not "natural," it is socially *necessary* to prevent conflict over scarce resources. The "social law" regarding land is constitutive of justice and peace. We grant it because without it, society collapses into a state of nature regarding resources.

  **Ideas: Property as Instrumental to Utility**
  For ideas, Jefferson writes society may grant an exclusive right to the **profits**... **as an encouragement**.
  *   **The Distinction:** Land property is about *possession*; Idea property is about *incentive*.
  *   **The "Will and Convenience":** This phrase is crucial. Society *must* regulate land to function. Society *may* regulate ideas to optimize progress.
  *   **Coherence:** The position is coherent if we understand the "property" granted in each case as serving different teleological ends.
      *   **Land:** The end is *Order*. The right is strong because the resource is rivalrous.
      *   **Ideas:** The end is *Utility*. The right is weak (or contingent) because the resource is non-rivalrous.

  Jefferson is not conceding that they are the same; he is arguing that because they are ontologically different (Specific Argument), the *justification* for their social propertization must differ, even if the *mechanism* (legal exclusion) looks superficially similar.

  The "concession" you fear is actually a **utilitarian containment**. By framing patents as a matter of "will and convenience" rather than necessity, Jefferson ensures that the "property" in ideas remains subordinate to the public good. If the "convenience of society" changes (e.g., if patents stifle rather than encourage), the right can be revoked or altered. This is not true for land, where stable ownership is foundational to the social contract itself.

  ### 3. Reconstructing the Coherent Position

  To make both arguments do non-redundant work in your dissertation, I suggest reconstructing Jefferson's position as a **"Double Barrier" theory of Intellectual Property:**

  1.  **Barrier 1 (Metaphysical/Juridical):** The General Argument establishes that IP cannot be a *Natural Right*. This blocks perpetual, common-law claims. It forces IP into the realm of Positive Law (statutes).
  2.  **Barrier 2 (Ontological/Teleological):** The Specific Argument establishes that IP cannot be *Full Property*. Because ideas are non-rivalrous and expansible, they do not fit the standard model of exclusion used for land. Therefore, the Positive Law created for ideas must be distinct from the Positive Law for land (e.g., limited terms, specific utility requirements).

  **The Resolution of the Tension:**
  The tension dissolves if we read the conclusion not as "Ideas and Land are legally identical," but as "Ideas and Land are both legally constructed, but constructed for different reasons."

  *   **Land:** Constructed to manage **scarcity**.
  *   **Ideas:** Constructed to manage **production**.

  Jefferson's "candle-and-taper" metaphor is not just about non-rivalry; it is about the *moral cost* of artificial scarcity. When you propertize land, you are fencing off something that was physically scarce. When you propertize an idea, you are artificially creating scarcity where none exists in nature ("incapable of confinement").

  Therefore, the Specific Argument does the heavy lifting of justifying why the "social law" for ideas must be more tentative, limited, and scrutinized than the social law for land. The General Argument clears the ground; the Specific Argument dictates the architecture of the building erected on it.

  ### Summary for your Draft
  You can argue that Jefferson's coherence relies on a **two-tiered positivism**:
  1.  **Tier 1:** All property is positive law (General Argument).
  2.  **Tier 2:** Positive law must respect the ontology of the object it regulates (Specific Argument).

  The "snag" you encountered arises when scholars treat the General Argument as the *whole* argument. If they do, Jefferson looks like a standard legal positivist who sees no difference between land and patents. But by integrating the Specific Argument, Jefferson emerges as a **teleological positivist**: the law creates property, but the *nature of the thing* determines the *limits and justification* of that creation. This allows him to deny the natural right (satisfying the General Argument) while simultaneously arguing against perpetual or absolute patents (satisfying the Specific Argument), without contradicting himself in the conclusion.

  This reading aligns with Sheff's close work on the metaphor but pushes it toward the structural relationship you identified. It saves Jefferson from the charge of redundancy and preserves the distinction between land and ideas at the level of *justification*, even if they converge at the level of *legal mechanism*.
