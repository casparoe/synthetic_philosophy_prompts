answer: |-
  This is a genuinely sophisticated causal inference problem, and your intuition that it mirrors the WWI/Archduke Ferdinand debate is spot-on. In philosophy and history, this is called **causal overdetermination**: when there are multiple sufficient causes for an event, how do we assign credit to any single one?

  Since you're familiar with the LW/ACX milieu, we can skip the "feel-good" validation and look at this through the lenses of counterfactual impact, decision theory, and game theory. Your friend is arguing from a position of **structural determinism** (the city rules made the win inevitable), while you are arguing for **agency** (your actions caused the win).

  The rigorous answer isn't that your friend is wrong and you're right. It's that your friend is asking the wrong binary question ("Did we cause it? Yes/No"), whereas impact is a multidimensional vector. Here is how to decompose your 200 hours without relying on vibes.

  ### 1. Counterfactual Impact is Probabilistic, Not Binary
  The standard Effective Altruism/rationalist definition of impact is:
  $$Impact = Outcome_{actual} - Outcome_{counterfactual}$$

  Your friend is asserting that $Outcome_{counterfactual}$ (no committee) $\approx$ $Outcome_{actual}$ (committee). They are claiming the probability of the landlord folding was near 1.0 regardless of your input.

  However, in complex systems, probabilities are rarely 0 or 1. Even with new rent stabilization rules, landlords have leeway. They can fight via loopholes, delay implementation, challenge the rules in court, or negotiate individual "side deals" with tenants.
  *   **Probability Shift:** Did your campaign move the probability of a favorable outcome from 60% to 95%? If so, you have positive expected value impact, even if the outcome *would* have happened eventually.
  *   **Time Horizon:** Did you accelerate the rollback? If the city rules would have forced a rollback in 2020, but your pressure forced it in 2019, you saved 30 households 12 months of overpayment. That is a quantifiable dollar amount, regardless of the eventual legal outcome.
  *   **Magnitude:** "Rollback" isn't a single state. Maybe the city rules guaranteed a 3% reduction, but your pressure secured a 5% reduction or prevented additional fee hikes.

  If you shifted the probability, timing, or magnitude, your counterfactual impact is non-zero.

  ### 2. The Landlord's Decision Algorithm (Game Theory)
  Landlords are generally rational economic actors. They don't just react to laws; they react to **enforcement risk**.
  A new city rule is a *static* constraint. Tenant organizing is a *dynamic* threat.

  Consider the landlord's cost-benefit analysis:
  *   **Cost of Compliance:** Lost revenue from rent rollback.
  *   **Cost of Resistance:** Legal fees + **Risk of Tenant Escalation**.

  Without your committee, the "Risk of Tenant Escalation" is low. Tenants are atomized. The landlord might decide to fight the new city rules in court because the only opponent is the city attorney (who is overworked).
  *With* your committee, the "Risk of Tenant Escalation" spikes. You demonstrated the ability to pack city council meetings and generate negative press. You signaled that you were willing to impose **reputational costs** and **administrative friction** on the landlord.

  Even if the city rules made a total hike illegal, your committee likely made *fighting* the rules more expensive than *accepting* them. You changed the payoff matrix. In game theory terms, you altered the landlord's dominant strategy. That is a causal contribution, even if the background conditions were favorable.

  ### 3. Shapley Values and Credit Assignment
  In cooperative game theory, the **Shapley Value** is a method for fairly distributing the "payout" (credit for the win) among contributors.
  If the "win" is worth 100 points, and the contributors are:
  1.  The City Council (changing laws)
  2.  The Economic Climate (tightening rental market)
  3.  Your Tenant Committee

  Your friend is arguing that because #1 and #2 existed, #3 gets 0 points. But the Shapley Value calculates your contribution based on **marginal contribution across all possible orderings of events.**
  *   If the City passed laws *but* tenants were silent, maybe the landlord finds a loophole.
  *   If tenants organized *but* no laws changed, maybe they lose.
  *   Together, they win.

  Unless the City's rules were a "hard constraint" that made tenant action literally physically impossible to ignore (i.e., the landlord would have been arrested immediately for non-compliance regardless of tenant noise), you occupy a non-zero portion of the Shapley Value. You were a necessary component of the *coalition* that secured the specific outcome you got.

  ### 4. The WWI Analogy: Necessary vs. Sufficient
  Your WWI analogy is excellent, but let's tighten it. Historians distinguish between:
  *   **Structural Causes:** Alliances, militarism, imperialism (The powder keg).
  *   **Triggering Events:** Sarajevo (The spark).

  Your friend is saying the powder keg was wet and going to explode anyway. You are saying you lit the match.
  But here is the kicker: In 2019, were the city rules a "guaranteed explosion"? Probably not. Laws are often passed with weak enforcement mechanisms.
  A better analogy might be: The City Council provided the artillery, but your committee provided the infantry that took the hill. The artillery might have softened the target, but without infantry, the enemy (landlord) might have held the position through attrition (legal delays).

  Furthermore, the "Sarajevo" question in history is often about *timing* and *specifics*, not just the binary of "War/No War." If Princip misses, maybe war starts 6 months later over a different border dispute. Similarly, if you hadn't organized, maybe the rent hike is rolled back 18 months later after three tenants suffer eviction. The *specific* victory you claim ("we organized and we won") refers to the specific timeline and terms. That specific victory is causally linked to you.

  ### 5. Human Capital and Common Knowledge
  Finally, a point on the "200 hours" sunk cost.
  Even if, by some miracle of Bayesian updating, you conclude your counterfactual impact on the rent was zero, your investment wasn't wasted.
  *   **Skill Acquisition:** You learned coordination, negotiation, and media strategy. These are portable skills.
  *   **Common Knowledge:** Before the committee, Tenant A didn't know Tenant B was unhappy. Now, you have established **common knowledge** of dissent. This lowers the coordination cost for future actions.
  *   **Signaling:** You signaled to other buildings that organization is possible. This creates a positive externality for the city's tenant ecosystem.

  ### The Principled Conclusion
  The question does not dissolve, but it does change shape.
  *   **Is it true the city rules helped?** Yes.
  *   **Is it true the landlord might have folded eventually?** Yes.
  *   **Does that mean your committee didn't matter?** No.

  You likely functioned as a **force multiplier**. You took a latent structural advantage (the city rules) and actualized it faster and more completely than would have happened passively.

  In decision theory, if you take an action with a positive expected value (organizing), and the outcome is good, you shouldn't retroactively penalize the decision quality just because external factors also contributed. If you start believing "structural forces mean my actions don't matter," you update toward a policy of **defection** (not organizing). If everyone updates that way, the structural forces never get enforced.

  You weren't Gavrilo Princip starting a world war; you were the local militia that ensured the peace treaty was actually signed on time and with better terms. That counts.
