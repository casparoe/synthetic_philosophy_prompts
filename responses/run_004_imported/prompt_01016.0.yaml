      *   **The Unfolding Argument:** The claim that IIT is empirically vacuous because any physical system can be mapped to any consciousness level if you redefine the grain/variables.
      *   **Functionalism/GWT:** Consciousness is about information access and reporting. No report = no evidence.
      *   **Clinical Context:** Disorders of Consciousness (DoC), Vegetative State vs. Minimally Conscious State vs. Covert Consciousness.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Hospital corridor or coffee shop near the ICU. Establish the stakes (the patient).
      *   **Opening Salvo:** Marcus challenges the validity of PCI as a consciousness meter. Elena defends it as the only game in town for non-communicative patients.
      *   **The Core Conflict (IIT vs. Functionalism):**
