answer: |-
  This is an incredibly sharp observation, and honestly, you have put your finger on one of the most famous and enduring critiques of *Principia Ethica*. Many philosophers (including Moore's own contemporaries like C.D. Broad, and later Moore himself in revisions) have argued that there is a serious tension, if not a flat contradiction, between the **Method of Isolation** and the **Principle of Organic Unities**.

  However, to help you navigate your seminar, we need to look at how Moore *tries* to keep them consistent, where the friction points are, and why he ranks "personal affection" higher than "unperceived beauty."

  Here is a walkthrough of the problem, Moore's defense, and the critiques you can bring to class.

  ---

  ### 1. The Two Moves Defined

  First, let's clarify the technical role of each concept in Moore's system, because he assigns them different jobs.

  **The Method of Isolation (Chapter 1 & 3)**
  *   **The Job:** To determine **whether** something has *intrinsic* value at all (as opposed to instrumental value).
  *   **The Logic:** If you want to know if $X$ is good in itself, you must imagine a universe where $X$ exists and *nothing else does*. If that universe is better than a universe where nothing exists, $X$ has intrinsic value.
  *   **The Result:** It establishes a baseline. It tells us: "Beauty is a good-making feature. Consciousness is a good-making feature."

  **The Principle of Organic Unities (Chapter 1, §18)**
  *   **The Job:** To determine the **magnitude** of value in complex situations.
  *   **The Logic:** "The value of a whole must not be assumed to be the same as the sum of the values of its parts."
  *   **The Result:** It prevents simple addition. Just because Beauty = 5 units and Consciousness = 5 units, it does *not* mean Consciousness of Beauty = 10 units. It could be 100, or it could be 0.

  ### 2. Moore's Consistency Defense: "Value" vs. "Contribution"

  Moore would argue there is no contradiction because he distinguishes between two different questions:
  1.  What is the intrinsic value of this part **in isolation**?
  2.  What is the **contribution** this part makes to the value of a whole?

  **The Analogy of Ingredients**
  Imagine you are a chef.
  *   **Isolation Test:** You taste the salt alone. It is salty. You taste the sugar alone. It is sweet. This tells you what properties the ingredients possess inherently.
  *   **Organic Unity:** You bake a cake. The cake tastes delicious. The value of the cake is not just "Saltiness + Sweetness." In fact, the salt in the cake doesn't make the cake taste salty; it enhances the sweetness of the sugar.

  For Moore, the **Isolation Test** proves that beauty has *some* positive value even unperceived (like the salt has saltiness). But the **Organic Unity** principle explains why a world with *conscious beings appreciating that beauty* is vastly superior. The value of the whole (Appreciation + Beauty) is a new, emergent property that dwarfs the sum of the parts.

  So, Moore's defense is: *The Method of Isolation identifies the ingredients. The Principle of Organic Unities explains the chemistry.* He claims you need the first to know what ingredients you have, and the second to know how they combine.

  ### 3. Why Personal Affection Beats Unperceived Beauty

  This is where the hierarchy comes in. Moore isn't saying unperceived beauty is the *highest* good. He uses the "Beautiful World vs. Ugly World" thought experiment (Chapter 3, §110) primarily to prove that value is **objective** and not dependent on human desire. He needs to show that goodness exists even if no one is around to want it.

  However, when he moves to the "Ideal" (Chapter 6), he argues that **consciousness** is a necessary component of the *greatest* goods.

  *   **Level 1 (Low Value):** A beautiful world with no one to see it. (Proven by Isolation Test to have *some* value).
  *   **Level 2 (Higher Value):** A conscious mind appreciating a beautiful object. (An Organic Unity of Consciousness + Beauty).
  *   **Level 3 (Highest Value):** Personal Affection. This is a specific Organic Unity involving:
      1.  Consciousness of another person.
      2.  Appreciation of their good qualities (Beauty/Virtue).
      3.  An appropriate emotional response (Love/Affection).

  Moore argues that Level 3 is the "greatest good we can imagine" because the *relation* between the minds creates a more valuable whole than just a mind looking at a static object. The Isolation Test shows that "Affection" has value and "Good Qualities" have value. Organic Unities explains why putting them together creates a value explosion that exceeds the sum of the parts.

  ### 4. The Critique: Where the Tension Breaks

  Now, for your seminar discussion. You are right to feel that something is "off." Here are the three main philosophical objections to Moore's consistency that you can raise:

  **A. The Context-Dependence Problem**
  If the Principle of Organic Unities is true, then the value of a part is *context-dependent*. Salt contributes positive value to a cake but negative value to a cup of coffee.
  *   **The Objection:** If a part's value contribution changes based on context, how can the Method of Isolation tell us anything meaningful about its value? If we isolate the part, we are stripping it of the very context that determines its value contribution.
  *   **The Trap:** Moore wants to say the part has a fixed intrinsic value *and* that the whole is not the sum of those fixed values. Critics argue this is incoherent. If the value of the part changes when put in a whole, then the "value in isolation" is a philosophical fiction.

  **B. The "Unperceived" Retreat**
  Moore spends a lot of energy in Chapter 3 arguing that unperceived beauty has value. But by Chapter 6, he admits that the *greatest* goods require consciousness.
  *   **The Objection:** Did Moore need to fight so hard for unperceived beauty? Some critics argue he undermines his own Isolation Test. If the *greatest* value requires a mind, does the unperceived world really have value, or is it just "less bad" than the ugly world? Moore insists it has positive value, but the emphasis shifts so much that it looks like he is hedging his bets.

  **C. The Measurement Problem**
  The Isolation Test implies we can intuit a magnitude of value (e.g., "This is good"). Organic Unities says we can't add those magnitudes.
  *   **The Objection:** How do we know Personal Affection is better than Appreciation of Beauty if we can't sum the parts? Moore relies on further intuitions. This makes the Isolation Test seem like a prop he uses when it suits him (to prove objectivity) and discards when it doesn't (when calculating the highest good).

  ### 5. Seminar Strategy: Questions to Ask

  If you want to lead the discussion, here are three angles you can take:

  1.  **On Consistency:** "Moore distinguishes between a part's *intrinsic value* and its *contribution to a whole*. But if a part's contribution varies wildly based on context (Organic Unities), doesn't that render its 'intrinsic value in isolation' (Isolation Test) philosophically inert? What work is the Isolation Test actually doing if we can't use those values to calculate the whole?"
  2.  **On Consciousness:** "Moore uses the Isolation Test to prove unperceived beauty has value, but then ranks conscious appreciation much higher. Is the Isolation Test just a tool to prove objectivity, while the real ethical weight rests entirely on the Organic Unities of consciousness? Does this make the 'unperceived beauty' argument a red herring?"
  3.  **On Methodology:** "If we accept Organic Unities, doesn't the Method of Isolation violate the very principle it's supposed to serve? By isolating a part, aren't we destroying the organic unity that generates the value in the first place?"

  ### Summary
  Moore keeps them "consistent" by claiming they answer different questions (Existence of Value vs. Magnitude of Complex Value). However, you are correct that there is a deep tension. If value is truly organic, isolating a part might give you a false reading of its ethical significance. Moore relies on the idea that parts have a *stable* intrinsic nature that we can detect in isolation, even if their *value contribution* shifts in combination. Whether that distinction holds water is exactly what your seminar should debate.

  **TL;DR:** Moore says Isolation finds the *ingredients*, Organic Unities explains the *recipe*. You are right to suspect that if the ingredients change flavor depending on the recipe, tasting them raw (Isolation) might not tell you much. Bring that tension to class.
