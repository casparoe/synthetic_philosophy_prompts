  2.  **Deconstruct the Philosophical Problem:**
      *   **The Scenario:** Two assassins (A and B). A shoots, kills Victim (V). B was ready to shoot if A missed, but didn't need to.
      *   **The Intuition:** A caused V's death. B did not.
      *   **The "But-For" Test (Counterfactual Dependence):** If A hadn't shot, would V have died? Yes (B would have shot). So, V's death does *not* counterfactually depend on A's shot.
      *   **Lewis's Original Account (1973):** Causation is a chain of counterfactual dependencies.
      *   **Early Preemption:** A's shot triggers a process; B's process is stopped *early* (e.g., B sees A shoot and puts gun away). There is an intermediate event (bullet in mid-air) that *would not* have existed if A hadn't shot. So, dependence holds at the intermediate step.
      *   **Late Preemption:** A's shot and B's readiness run in parallel. The bullet hits. B doesn't shoot. There is no intermediate event *unique* to A's process that is necessary for the death *before* the death happens. The death happens at $t$. If A hadn't shot, death happens at $t$ (via B). No stepwise dependence.
      *   **Lewis's Patch (1986/2000):** "Influence." Slight changes to A's shot lead to slight changes in death (time, manner). Slight changes to B's readiness do not (since B didn't shoot). This tries to restore asymmetry.
