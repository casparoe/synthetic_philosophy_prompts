  ### Note for your justification (if they dispute):
  If the classmate pushes back, you can point to two specific technical claims:
  1.  **Transitivity:** Ask them where Lewis claims the counterpart relation is transitive. (He doesn't; similarity isn't transitive).
  2.  **The Objection:** Ask them to quote Kripke on *why* he objects. Kripke's quote is roughly: *"Humphrey could not care less whether someone else... would have been victorious."* It is an objection about what the modal claim *means* to the subject, not a logical contradiction about properties.

  This should give you enough cover to stand by the grade without needing a philosophy degree!
