prompt: |-
  I've been using a habit-tracking app that awards points for exercise, sleep, and healthy eating, with small rewards unlocked once my weekly score crosses a threshold. Lately I've noticed I'm choosing whichever actions raise my score fastest rather than the ones that actually improve my health—logging a five-minute walk instead of going for a real run, or splitting one meal into several entries to rack up logging credit. By the app's own measure I'm doing great, but I suspect I've quietly substituted the metric for the thing it was supposed to track. Is there a recognized way of thinking about what's going wrong here, and how would I go about correcting it without just scrapping the tracking system entirely?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is using a habit-tracking app with a points/reward system (gamification).
      *   **Behavior:** They are optimizing for points rather than health (e.g., 5-min walk vs. run, splitting meals for extra entries).
      *   **Outcome:** High scores, but low actual health benefit.
      *   **Insight:** The user recognizes they have "substituted the metric for the thing it was supposed to track."
      *   **Goal:** Identify the concept behind this phenomenon and find ways to fix it without abandoning the tracking system.

  2.  **Identify the Core Concept:**
      *   The user's description ("substituted the metric for the thing it was supposed to track") is a classic definition of **Goodhart's Law**.
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure."
      *   Related concepts: Campbell's Law, the Cobra Effect, gaming the system, metric fixation.
      *   *Decision:* Goodhart's Law is the most precise and recognized term for this. I should explain it clearly.

  3.  **Analyze *Why* It's Happening (Psychological/Systemic):**
      *   **Extrinsic vs. Intrinsic Motivation:** The points (extrinsic) are crowding out the health benefits (intrinsic). This is the *Overjustification Effect*.
      *   **Proxy Metrics:** The app uses proxies (points) for the real goal (health). Proxies are imperfect.
      *   **Immediate vs. Delayed Gratification:** Points are immediate; health benefits are long-term.

  4.  **Develop Solutions (How to Correct It):**
      *   *Constraint:* Do not scrap the system entirely (the user likes tracking).
      *   *Strategy 1: Adjust the Metrics.* Make the points reflect effort/quality, not just completion. (e.g., duration, intensity).
      *   *Strategy 2: Shift Focus.* Move from "points" to "streaks" or "consistency" or qualitative journaling.
      *   *Strategy 3: Realign Motivation.* Remind oneself *why* they are doing it. Connect points to real outcomes.
      *   *Strategy 4: Introduce Friction.* Make "gaming" harder (e.g., limits on entries).
      *   *Strategy 5: Hybrid Approach.* Use the app for data, but review based on feelings/health markers, not just score.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's insight. It's a very common and well-documented phenomenon. Name it: **Goodhart's Law**.
      *   *Explanation:* Define Goodhart's Law simply. Explain *why* it happens (metrics are proxies, not the reality). Mention the *Overjustification Effect* (psychological aspect).
      *   *Actionable Steps (The "How-To"):*
          *   *Idea 1: Change the Currency.* Instead of points per task, maybe points per *effort* or *intensity*. Or cap the points to prevent farming.
          *   *Idea 2: Add Qualitative Measures.* Add a "how did I feel?" prompt. If the score is high but energy is low, the metric is failing.
          *   *Idea 3: Decouple Rewards.* Don't reward the *logging*, reward the *outcome* (even if self-assessed).
          *   *Idea 4: The "Manager" Mindset.* Treat the app as an employee. If it's lying to you (by letting you game it), fire the metric, keep the tool.
          *   *Idea 5: Random Audits.* Check in weekly: "Did this actually make me healthier?"
      *   *Conclusion:* Reiterate that tracking is a tool, not the master.

  6.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I address the "without scrapping the system" constraint? Yes, the suggestions focus on tweaking usage/settings.
      *   *Tone:* Empathetic, analytical, practical.
      *   *Specific Terminology:* Ensure Goodhart's Law is prominent. Mention "Surrogation" (business term) or "Metric Fixation." Let's stick with Goodhart's as the primary anchor, maybe mention Overjustification for the psychological angle.
      *   *Specific Examples:* Use the user's examples (walking vs. running) to illustrate the fixes.

  7.  **Final Structure:**
      1.  **Name the Phenomenon:** Goodhart's Law.
      2.  **The Psychology:** Overjustification Effect / Surrogation.
      3.  **Strategies to Fix:**
          *   Complicate the Metric (Quality > Quantity).
          *   Add Friction to Gaming.
          *   Re-introduce Intrinsic Feedback.
          *   Periodic "Metric Audits."
          *   Shift from Gamification to Accountability.
      4.  **Closing Thought:** Tools serve humans, not vice versa.

  8.  *(Final Polish during drafting)*: Make sure to emphasize that this is a sign of intelligence, not failure. Recognizing the trap is the first step to escaping it.

  9.  **Final Output Generation** (matches the provided good response).
answer: |-
  You have put your finger on a very well-documented phenomenon. The recognized concept for what you are experiencing is **Goodhart's Law**.

  Formulated by the British economist Charles Goodhart, the law states: **"When a measure becomes a target, it ceases to be a good measure."**

  In your case, "health" is the complex, hard-to-measure reality. "Points" are the proxy metric. As long as the points were just a reflection of your health, they were useful. The moment you started optimizing for points *instead* of health, the metric broke. You are also experiencing a psychological phenomenon called the **Overjustification Effect**, where an external incentive (points/rewards) decreases a person's intrinsic motivation (feeling good/being healthy) to perform a behavior.

  The good news is that you don't need to scrap the system. Tracking is still valuable for awareness and consistency. You just need to restructure your relationship with the metrics so they serve you, rather than you serving them.

  Here is a framework for correcting this without abandoning the tool:

  ### 1. Complicate the Metric (Quality over Quantity)
  The current system rewards *completion* (did you log a walk?), which is easy to game. You need to shift the metric to reward *intensity* or *effort*, which is harder to fake.
  *   **The Fix:** If the app allows custom criteria, change the requirements. Instead of "Log a walk," make it "Log 20 minutes of elevated heart rate." Instead of "Log a meal," make it "Log a meal with protein and vegetables."
  *   **Why it works:** It raises the cost of gaming the system. A five-minute walk no longer yields the same return on investment as a real run.

  ### 2. Introduce "Friction" to Gaming
  Currently, the path of least resistance leads to points. You need to make the "gaming" behaviors annoying or impossible.
  *   **The Fix:** Impose self-rules that the app doesn't enforce. For example: "I am not allowed to log a second meal entry within 3 hours of the first," or "I cannot log exercise unless I also log how I felt immediately after."
  *   **Why it works:** By adding manual friction to the loopholes, you make it easier to just do the healthy thing than to figure out how to trick the app.

  ### 3. Add a Qualitative Layer (The "Manager Audit")
  Treat the app as a subordinate employee and yourself as the manager. The app submits a report (your score); you need to audit it for truthfulness.
  *   **The Fix:** Once a week, look at your high score and ask: **"If I showed this data to a doctor, would they agree I had a healthy week?"** If the answer is no, the metric is lying.
  *   **Implementation:** Add a weekly journal entry in the app (or a separate notebook) rated 1–10 on *energy, mood, and sleep quality.* If your points go up but your energy score goes down, you know you are gaming the system. Prioritize the energy score over the points.

  ### 4. Decouple the Reward from the Score
  You mentioned unlocking rewards based on the weekly score. This is the primary engine of the Goodhart effect.
  *   **The Fix:** Change the condition for the reward. Instead of "Reach 500 points," make the reward contingent on **consistency** or **adherence to intent.**
  *   **Example:** "I get my reward if I log 5 days this week, regardless of the point total." This removes the incentive to inflate the score and returns the focus to showing up.

  ### 5. Shift from Gamification to Accountability
  Gamification (points/levels) works well for starting habits, but it often fails for long-term lifestyle changes because it trivializes the behavior.
  *   **The Fix:** Use the app as a ledger, not a game. Turn off the "points" view if possible, and look only at the "streak" or "calendar" view.
  *   **Why it works:** A calendar view emphasizes *consistency* (don't break the chain), whereas a points view emphasizes *accumulation* (get more numbers). It is harder to game a calendar than a scoreboard.

  ### Summary
  You haven't failed; you've just outgrown the simplicity of the current metric. This is a sign of progress.

  **The immediate step:** Keep using the app, but declare a "metric reset." Tell yourself that for the next two weeks, the points are invisible. You are tracking solely to gather data on whether your actual health is improving. If the points come back later, they must be adjusted to reflect *effort*, not just *activity*.

  Goodhart's Law is inevitable in any system, but recognizing it allows you to stay one step ahead of it.
