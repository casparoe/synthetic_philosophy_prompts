          *   *Weakness (Higher-Order Vagueness):* The set of "admissible precisifications" seems to need a sharp boundary itself. Is a precisification admissible or not? If that's vague, we need a supervaluation over supervaluations, leading to regress or hidden precision.
      *   **Epistemicism:**
          *   *Core Idea:* Vagueness is ignorance. There *is* a sharp boundary (e.g., $n$ grains make a heap, $n-1$ do not), but we cannot know where it is due to semantic instability or cognitive limitations.
          *   *Appeal:* Maintains bivalence and classical logic fully. Simple ontology.
          *   *Weakness:* Counter-intuitive. Implies there's a fact of the matter we can't know. Why is the boundary *there*?
          *   *Strength (Higher-Order Vagueness):* It handles higher-order vagueness naturally. "Borderline" just means "unknown." "Definitely" means "known." The regress stops at the limits of knowledge.

