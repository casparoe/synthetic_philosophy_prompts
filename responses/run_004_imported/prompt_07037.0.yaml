      *   *Epistemicism's Handling:* Timothy Williamson's account. The boundary is sharp but unknowable. Higher-order vagueness is just iterated ignorance. We don't know where the boundary is, and we don't know that we don't know. This is marginally more palatable than arbitrary sharp boundaries, but it fits the logic cleanly. The "margin for error" principle explains *why* we can't know.

