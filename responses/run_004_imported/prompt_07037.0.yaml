      *   **Tone:** Philosophical, rigorous, argumentative.

  2.  **Deconstruct the Positions:**
      *   **Supervaluationism:**
          *   *Core Idea:* Vagueness is semantic indecision. A predicate like "heap" has many admissible precisifications (sharp cutoffs). A sentence is "supertrue" if true on all admissible precisifications, "superfalse" if false on all, and lacks a truth value otherwise.
