          *   *The Switch:* He changes the metric from *resources available* to *welfare/well-being*.
          *   *Logic:* Even if I own all the land, if I hire you and you eat better than you would hunting in the woods, you aren't "worse off."
          *   *Result:* This justifies massive inequality as long as the pie grows.
      *   **Part 3: The Water Hole Problem (The Desert Case).**
