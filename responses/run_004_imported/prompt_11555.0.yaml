      *   **Core Question:** Why did Nozick weaken Locke's "enough and as good" condition to a "not worse off" baseline? What work does Locke's original condition do? Why couldn't Nozick keep it and still justify unequal holdings? Is Nozick's version strong enough to handle his own "water hole in a desert" counterexample?
