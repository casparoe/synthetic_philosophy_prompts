      *   **Nozick's Entitlement Theory:** Holdings are just if acquired justly or transferred justly.
      *   **Nozick's Lockean Proviso:** Appropriation is okay *unless* it makes others *worse off* than they would have been in a state of nature (baseline).
          *   *Implication:* Even if you take everything, if you create a system (like capitalism) that makes everyone richer/safer than they would be sharing nothing, it's okay.
      *   **The Tension:** Locke's version is restrictive (limits inequality/monopoly). Nozick's version is permissive (allows inequality/monopoly if net benefit exists).
