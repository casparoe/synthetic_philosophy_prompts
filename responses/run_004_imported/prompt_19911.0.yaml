  **MEMORANDUM**

  **TO:** Mutual-Aid Network Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Prioritization Criterion for Russian Deserter Assistance

  **1. Context and Purpose**

  As you know, our resources are insufficient to assist every Russian conscript who contacts us. To manage this triage, we adopted an informal criterion prioritizing applicants who cite the *injustice of the war* over those citing *personal risk or dissatisfaction*.

  A recent case has exposed a philosophical rift in the board. One faction argues this criterion is morally essential (aligning with Jeff McMahan's revisionist just war theory). The other argues it is conceptually confused and unfair to soldiers (aligning with Michael Walzer's traditional just war theory). This memo analyzes that impasse and offers a recommendation for next week's vote.

  **2. The Philosophical Impasse**

  To make an informed decision, we must be precise about what is being debated.

  *   **The McMahan Position (Prioritize Moral Objection):** This view holds that moral responsibility is individual. Soldiers fighting an unjust war are not moral equals to those defending against aggression; they are, to some degree, morally liable for the harm they cause. Therefore, supporting those who recognize this injustice is a form of solidarity with moral truth. To treat a deserter fleeing punishment the same as one fleeing complicity in atrocity dilutes the political meaning of our aid.
  *   **The Walzerian Position (The Criterion is Confused):** This view holds the "Moral Equality of Combatants." Soldiers are instruments of the state, not independent moral agents capable of adjudicating *jus ad bellum* (the justice of going to war). International law (and basic humanitarianism) protects soldiers based on their conduct (*jus in bello*), not their motives. By asking conscripts to judge the war's justice, we are imposing a philosophical burden they are not trained to carry and arguably shouldn't have to carry to deserve safety.

  **3. Recommendation**

  I recommend we **REVISE** the criterion.

  We should retain a prioritization filter that distinguishes between moral resistance and mere self-preservation, but we must change *how* we assess it. We should shift from asking applicants to judge the **war's justice** (an external political calculation) to asking them to articulate a **conscientious objection to service** (an internal moral boundary).

  **4. Rationale and Engagement with the "Losing" Argument**

  In proposing a revision, I am effectively ruling against the proposal to **Keep the Criterion As-Is**. I want to address the strongest argument of the side favoring the current wording (the McMahan position) seriously, because their moral intuition is correct even if their operational test is flawed.

  **The Strength of the "Keep" Argument:**
  The board members citing McMahan are right about the core mission of this network. We are not a neutral humanitarian NGO like the Red Cross; we are a mutual-aid network engaged in political solidarity. There is a profound moral difference between a soldier who says, "I might get killed," and one who says, "I am being made to kill." If we erase that distinction, we risk turning our network into a general emigration service, losing the specific solidarity that binds us to the anti-war movement. We *should* prioritize those who are resisting complicity. That moral clarity is non-negotiable.

  **Why the Current Wording Fails:**
  However, the Walzerian critique of the *mechanism* is devastatingly strong. The current phrasing ("decided this specific war is unjust") requires the applicant to perform a geopolitical analysis that many conscripts—often young, traumatized, and poorly educated—are ill-equipped to articulate.
  *   **The Epistemic Burden:** A conscript from a remote village may know with absolute certainty that he cannot fire on civilians, but he may not have the vocabulary to explain *jus ad bellum*. Under the current rule, we might reject a moral objector because he sounds like a coward, while accepting a cynical opportunist who has memorized our website's talking points.
  *   **The Walzerian Warning:** Walzer is right that demanding soldiers judge state policy can be a trap. It mirrors the Russian state's own demand for loyalty, simply in reverse. If our aid depends on their ability to pass a political loyalty test to *us*, we replicate the coercion they are fleeing.

  **5. The Revised Criterion**

  To resolve this, I propose we adopt the following standard for Priority Status:

  > *"Priority is given to applicants who express a conscientious refusal to participate in specific operations or the general mobilization based on ethical or moral grounds, rather than solely on fear of personal harm or dissatisfaction with service conditions."*

  **Why This Works:**
  1.  **It Preserves the McMahan Core:** We still prioritize moral resistance over self-preservation. We are not helping everyone.
  2.  **It Accepts the Walzerian Correction:** We are no longer asking them to be judges of international law ("Is this war unjust?"). We are asking them to be judges of their own conscience ("Can I do this?"). This is an internal bar that any moral agent can clear, regardless of their political education.
  3.  **It Protects the Network:** It maintains our political stance. We are aiding those who break faith with the war machine, not just those who break faith with the army as an employer.

  **6. Implementation**

  In interviews, volunteers should avoid quizzing applicants on political theory. Instead, ask: *"What changed for you?"* or *"What order could you not follow?"*
  *   **Priority:** "I realized I was there to occupy, not defend." / "I couldn't shoot at civilians."
  *   **Non-Priority:** "The food is bad." / "My commander hits me." / "I don't want to die." (Note: We may still refer these cases to other orgs, but they do not get our limited resettlement funds).

  **7. Conclusion**

  The Walzerians are right that soldiers shouldn't have to be philosophers to deserve safety. The McMahanians are right that we shouldn't be neutral about complicity. This revision honors both truths. It allows us to act on our political convictions without placing an unfair burden of proof on the vulnerable people we seek to serve.

  I ask that we vote on this revised wording next week.

  Respectfully,

  [Your Name]
