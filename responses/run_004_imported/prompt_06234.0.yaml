      *   **Setting:** After a graduate seminar, at the whiteboard.

  2.  **Character Conception:**
      *   *Character A (Truth-Conditionalist):* Let's call her **Elena**. She leans towards a Stalnakerian selection function or a Jacksonian conventional implicature view. She values compositionality and the role of conditionals in complex sentences (negation, disjunction, embedding).
      *   *Character B (Non-Truth-Conditionalist):* Let's call him **Marcus**. He leans towards Adams' probabilistic semantics or Edgington's suppositionalism. He values the intuitive link between assertion conditions and credence.

  3.  **Key Arguments/Objections to Include:**
      *   *For Elena (Truth-Conditionalist):*
