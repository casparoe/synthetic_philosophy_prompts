          *   Marcus counters with suppositional semantics or pragmatic workarounds.
      *   **Round 3: The Nature of Belief (The Truth-Conditionalist's Weak Point).**
          *   Marcus presses on the "Triviality" consequence. If you keep truth conditions, you have to say our credences are irrational or restricted in weird ways.
          *   Elena argues for "Restricted Adams Thesis" or context dependence.
      *   **Round 4: Communication and Assertion.**
