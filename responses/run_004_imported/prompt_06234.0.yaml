answer: |-
  **Setting:** *The seminar room is emptying out. The whiteboard is covered in the notation of Lewis's triviality proof: $P(A \to C) = P(C|A)$, the partitioning of worlds, the derivation showing $P(A \to C)$ must equal $P(C)$. Two figures remain. **ELENA** (Truth-Conditionalist) is capping a marker. **MARCUS** (Non-Truth-Conditionalist) is leaning against the podium, arms crossed.*

  **Marcus:** So, are we going to pretend the board isn't staring at us? Lewis didn't just find a limit; he found a wall. If you hold onto truth conditions for indicatives, you have to accept that rational agents can't have conditional credences that match conditional probabilities. That's not a constraint on language; that's a constraint on sanity.

  **Elena:** It's a constraint on *unrestricted* equations, Marcus. You're treating Adams' Thesis as a datum, like the speed of light. I treat it as a heuristic. Lewis showed that $P(A \to C) = P(C|A)$ cannot hold universally for a truth-apt proposition. The rational conclusion isn't to abolish the proposition; it's to recognize that the Equation is an approximation that holds in limited contexts.

  **Marcus:** An approximation? That's the standard truth-conditional retreat. "It works mostly, so it must be true, and the places it breaks are the exceptions." But look at the data. When I say, "If it rains, the match will be cancelled," I am not describing a possible world where a rain-cancelled-match proposition is true. I am telling you how to adjust your credence in the cancellation *given* the rain. The Ramsey Test is primary. We evaluate the conditional by supposing the antecedent. We don't look for a truth-maker.

  **Elena:** But we do argue about them as if they have truth values. If I say, "If Oswald didn't shoot Kennedy, someone else did," and you say, "No, that's false," we are disagreeing about the world. If conditionals aren't truth-apt, what are we disagreeing about? A clash of feelings? A mismatch in betting dispositions? You lose the objectivity of the discourse.

  **Marcus:** We're disagreeing about what one ought to believe under a supposition. It's a normative clash, not a descriptive one. But let's press your side. You keep "propositions." Which ones? If you go with the material conditional, you get the paradoxes—true whenever the antecedent is false. If you go with Stalnaker and closest possible worlds, you validate Antecedent Strengthening, which indicative conditionals clearly violate. "If you add sugar, it will taste good" does not imply "If you add sugar and cyanide, it will taste good." Your truth conditions validate inferences our intuitions reject.

  **Elena:** Stalnaker's semantics handles strengthening via context change. The set of relevant worlds shifts when you add conjuncts to the antecedent. That's the beauty of the possible worlds framework; it's dynamic. But let's talk about your "normative clash." The real killer for your view isn't intuition; it's syntax. Embedding. What is the truth condition of "If, if A then B, then C"? Or "Either if A then B, or if C then D"?

  **Marcus:** The Embedding Problem. Yes, I know the brief.

  **Elena:** It's not just a brief; it's a bankruptcy notice. If "if A then B" doesn't express a proposition, it can't serve as the antecedent for another conditional. It can't be negated. "It is not the case that if A, B" becomes unintelligible on your view. Yet we use these constructions constantly in legal codes, programming, and ordinary reasoning. How does a suppositionalist parse a disjunction of conditionals?

  **Marcus:** We parse them by recognizing that natural language is messy and often pragmatic. When I say "Either if A then B, or if C then D," I'm usually asserting a disjunction of conditional commitments. But even if I grant you that embedding is tricky for me, look at the debt *you* incur. To save truth conditions, you have to explain away the triviality proof. You have to tell me why a rational agent's credence *appears* to follow the Equation so perfectly in simple cases, if the Equation is actually false.

  **Elena:** Because in simple, unembedded cases, the pragmatic conditions for asserting the proposition align with the conditional probability. Jackson, for instance, argued that the material conditional is the truth condition, but assertibility is governed by robustness. I can hold that $A \to C$ is a proposition, while admitting we only *assert* it when $P(C|A)$ is high.

  **Marcus:** But Lewis's proof doesn't target assertion; it targets *credence*. It targets the doxastic state. If I believe the proposition $A \to C$, my credence in that proposition *must* be $P(C|A)$, or I'm irrational. Lewis showed that if you equate those two things across the board, your probability function collapses. So, to keep your propositions, you have to claim that rational agents systematically misalign their credence in the proposition with their conditional credence, except when they don't. You're positing a systematic gap between the semantics and the psychology.

  **Elena:** I'm positing a gap between the *logic* and the *heuristic*. Human cognition is designed for quick inference, not probability calculus. The Equation works as a rule of thumb. But logic requires truth values. Without them, you can't define validity. Validity is truth-preservation. If conditionals have no truth values, Modus Ponens isn't valid. It's just... useful?

  **Marcus:** Validity can be defined as the preservation of *acceptability* or *high credence*. We can have a logic of uncertainty. But here is where I need to press you, Elena. You say the Equation is a heuristic. But it's a remarkably stable one. It survives reflection. When I teach probability, I tell students: "The probability of the conditional *is* the conditional probability." They get it. If your truth-conditional semantics says that's strictly false, you are telling me that our best tool for reasoning about uncertainty is semantically misguided. That's a huge cost. You're saving the ontology of propositions at the expense of the epistemology of conditionals.

  **Elena:** And you're saving the epistemology at the expense of the ontology. You leave us with a language that can't describe its own structure. But fine. Let's look at the costs. You want me to own the debt?

  **Marcus:** Please.

  **Elena:** My debt is this: I need to explain *why* the Equation is so psychologically compelling if it isn't semantically fundamental. If $P(A \to C)$ is not $P(C|A)$, why does violating that feel like a contradiction in terms to a rational agent? I have to provide a pragmatic or cognitive story that bridges the gap between the truth conditions I defend and the credence patterns you observe. I can't just say "it's a heuristic." I need to derive that heuristic from the semantics, not just paste it on.

  **Marcus:** That's fair. It's the "Why so accurate?" objection. But now you owe me on the logic.

  **Elena:** Go on.

  **Marcus:** You say I lose validity. But if I say conditionals aren't truth-apt, I have to reconstruct the logic of compound sentences without truth functions. I have to explain "If (if A then B), then C" without treating the inner conditional as a proposition that can be true or false. That is the Expressivist's Mount Everest. I have to show how non-propositional attitudes can embed without collapsing into nonsense. If I can't do that, I can't account for complex reasoning.

  **Elena:** So, we're at an impasse. I keep the propositions and the logic, but I have to explain away the perfect fit of the probability equation. You keep the probability equation and the psychology, but you have to reconstruct the logic of embedding without truth values.

  **Marcus:** Essentially. Lewis proved we can't have both. The Triviality Proof is a forced choice between a clean semantics and a clean epistemology.

  **Elena:** *She picks up the eraser but doesn't wipe the board yet.* I'll take the clean semantics. Language is for describing the world, even if our grip on it is probabilistic. If I have to say that your conditional credence is a shadow of the proposition, not the proposition itself, I'll pay that price. But I admit: until I can derive the Equation's success from my theory, it looks like I'm ignoring the data.

  **Marcus:** And I'll take the clean epistemology. Conditionals are the oil of reasoning; they make the gears of belief turn. If I have to say that "If A, B" doesn't describe a state of affairs but rather a constraint on belief, I'll pay that price. But I admit: until I can give a satisfactory account of negated or embedded conditionals that doesn't look like a syntactic workaround, it looks like I'm ignoring the structure of language.

  **Elena:** *She erases the center of the board, leaving the conclusion of the proof visible.* Then we have work to do. Next week: Embedding for you, Credence derivation for me.

  **Marcus:** Deal. *He grabs his bag.* But Elena? If you can't derive the Equation, the propositions are ghosts.

  **Elena:** And if you can't embed, Marcus, the conditionals are mute.

  *They turn off the lights, leaving the whiteboard dark.*
