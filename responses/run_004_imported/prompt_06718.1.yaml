          *   *The Gap:* Matthias says the gap exists because control/knowledge is lost. Kant would say: If you deploy a system whose specific outputs you cannot predict/control, you are imputing the *risk* to yourself.
          *   *Negligence (*Culpa*):* Kant distinguishes between intended effects and unintended side effects. But if the side effect is *foreseeable as a possibility* (i.e., "it might learn to do X"), deploying it is an act of *Willkür* (choice).
