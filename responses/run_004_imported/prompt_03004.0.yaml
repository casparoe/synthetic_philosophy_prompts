answer: |-
  First off, tell your friend to chill. Crying at Mufasa is basically a mandatory human experience, not a psychological failure. You aren't embarrassed; you're having a standard aesthetic response.

  Since you know the basic Paradox of Fiction setup (1. Emotion requires belief in existence; 2. We know fiction doesn't exist; 3. We feel emotion anyway), I will skip the intro and go straight to the metaphysical meat of the disagreement. You are looking for the specific machinery of **Kendall Walton's Make-Believe Theory**, the best objection to it, and a rival theory that validates your sadness as *ontologically real*.

  ### 1. Walton's Actual Argument: It's About Dispositions, Not Just "Fake"
  You mentioned Walton says Charles's fear isn't real "because it's fiction." That's the conclusion, not the premise. If you just say "fiction = fake emotion," you're begging the question.

  Walton's argument in *"Fearing Fictions"* (1978) relies on a **functionalist definition of emotion**. He argues that mental states are defined by what they *do*, not just how they feel.

  *   **The Physiological Match:** Walton admits Charles has the exact same physiological symptoms as real fear (adrenaline, muscle tension, screaming).
  *   **The Motivational Gap:** However, real fear is a state that *disposes* you to act in specific ways (flight, fight, call the police). If Charles *truly* believed the green slime was a threat, he would leave the theater. He doesn't. He stays in his seat.
  *   **The Conclusion:** Because the state lacks the **motivational disposition** of genuine fear, it cannot be classified as genuine fear. It is a state of **quasi-fear**.

  **How it applies to you:**
  For Walton, when you cried at Mufasa's death, you were participating in a game of **make-believe**. The movie is a "prop." Your tears and chest-tightness are real physiological events, but they function as *props* in a game where it is "true in the fiction" that you are grieving. You aren't *actually* sad; you are *make-believingly* sad.

  **Why your friend might like this:** It saves rationality. If you were *really* sad about a non-existent lion, you'd be delusional. Walton says you aren't delusional; you're just playing a game.

  ### 2. The Strongest Objection to Walton (The "Helplessness" Counter)
  The most devastating objection to Walton comes from philosophers like **Noël Carroll** and **Jenefer Robinson**. They attack his functionalist definition.

  **The Argument:** Walton claims that if you don't have the disposition to act (flee), it's not real fear. But this is empirically false regarding human psychology.
  *   **Counter-Example:** Imagine you receive a phone call that a loved one has been in a fatal accident on another continent. You cannot fly there. You cannot fix it. You are helpless. You feel terror and grief. You do *not* have a disposition to take effective action (because there is none to take).
  *   **The Point:** Are you not *really* grieving because you can't act? Of course you are. Real emotions often occur in situations where action is impossible or futile.

  Therefore, the lack of a "flight" disposition does not prove the emotion is quasi. Charles might stay in his seat not because he isn't afraid, but because part of him knows he's safe *while simultaneously* experiencing a genuine fear response that is disconnected from action. Walton over-intellectualizes the link between feeling and doing.

  ### 3. The Rival Account: How to Claim Your Sadness Was *Real*
  You want a theory that says: "Yes, Mufasa doesn't exist, AND YES, my sadness was 100% genuine."

  Walton forces you to choose: Real Emotion OR Rationality.
  The rival account lets you keep both.

  #### A. The Thought Theory (Noël Carroll)
  This is the cleanest mechanism for your argument. Carroll rejects Premise 1 of the Paradox (Emotion requires belief in existence).
  *   **The Mechanism:** Emotions are not responses to *beliefs*; they are responses to **thoughts**.
  *   **The Distinction:** To believe "Mufasa died" is to claim it happened in the actual world. To *entertain the thought* "Mufasa died" is to hold that content in your mind without asserting its truth.
  *   **The Payoff:** Human psychology is built to react to the *content* of a thought, regardless of its existential status. If I think about a child being hurt, I feel horror. It doesn't matter if the child is real, hypothetical, or fictional. The *content* triggers the affect.
  *   **Your Defense:** "I wasn't grieving a real lion. I was having a **real human response to a thought**. The sadness is real because my neurochemistry is real, even if the object of the thought is fictional."

  #### B. The Lamarque/Olsen "Human Concern" Stance
  You mentioned **Peter Lamarque**. His approach (often developed with Stein Haugom Olsen) is slightly more contextual than Carroll's.
  *   **The Argument:** Lamarque argues that when we engage with fiction, we adopt a specific **stance**. We suspend "practical concern" (I don't need to call the police) but we engage "human concern" (I care about the values depicted).
  *   **Why the emotion is real:** We aren't responding to the *existence* of the character, but to the **universal human themes** they represent. Mufasa isn't a real lion, but "The loss of a father" is a real human concept.
  *   **The Payoff:** Your sadness is real because you are grieving the *concept* of loss, using Mufasa as the vessel. The emotion is directed at a value (family, loss, mortality), not an ontological object (a specific lion).
  *   **Your Defense:** "I'm not sad a lion died. I'm sad about what that death *means*. The emotion is real because the value I'm responding to is real."

  ### Summary for Your Friend
  If you want to win this (or at least end the argument with dignity), here is the script:

  1.  **Acknowledge Walton:** "Okay, there is a philosopher, Kendall Walton, who says you're right. He says I'm only feeling 'quasi-sadness' because I didn't try to call animal control. He says I'm playing a game of make-believe."
  2.  **Drop the Objection:** "But most philosophers think he's wrong. Just because I didn't run out of the room doesn't mean the feeling wasn't real. Sometimes we feel real grief when we can't do anything about it."
  3.  **The Knockout (Thought Theory):** "The better explanation is **Thought Theory**. My brain reacts to *thoughts*, not just facts. I entertained the thought of a father dying. That thought has emotional weight. My sadness is real, my tears are real, I just didn't need to believe in the lion to feel them. So I'm not irrational, and I'm not faking it."

  **Verdict:** You were crying real tears at a real presentation of loss. Walton says it's a game; Carroll and Lamarque say it's a genuine engagement with human themes. The latter is much better company for a Friday night rewatch.
