prompt: |-
  I'm on the board of our little local history museum — all volunteers, nobody with any art background. Our one real "name" piece, a big landscape always labeled as being by the one painter from our town who ever got properly famous, is why most people actually come in. We hired a conservator to clean it, and after some pigment testing she's now pretty confident he didn't paint it at all — more likely an apprentice or someone in his circle copying his style at the time, and it only picked up his name decades later from a donor who liked the idea of owning a real one. So nobody was trying to trick anybody when it was actually painted, it just sort of turned into a fake later through other peoples wishful thinking and bad paperwork. Half the board wants to quietly relabel it and move it out of the main room since technically we've been misrepresenting it for years, the other half says people get the exact same experience standing in front of it either way, so changing anything now just makes us look bad for no benefit to anyone walking through the door. I have to bring a memo to next month's meeting saying what we actually do and by when — can you write that for me, with a real recommendation, and make it actually deal with that second argument instead of waving it off as missing the point.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small local history museum, all-volunteer board, no art background.
      *   **The Issue:** The star attraction (a landscape by the town's famous painter) has been determined by a conservator to be *not* by the famous painter, but likely by an apprentice/circle member. It wasn't a malicious forgery originally, but attribution drifted over time due to wishful thinking/bad paperwork.
      *   **The Conflict:**
          *   *Side A:* Relabel quietly, move it out of the main room (Integrity/Accuracy focus).
          *   *Side B:* Keep it as is, change nothing (Visitor Experience/Reputation focus). Argument: "People get the same experience either way; changing it makes us look bad for no benefit."
      *   **The Task:** Write a memo for the next board meeting.
      *   **Requirements:**
          *   Include a real recommendation.
          *   Address the "Side B" argument seriously (don't wave it off).
          *   Set a timeline/deadline.
          *   Tone: Professional, empathetic, decisive, suitable for a volunteer board.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Status Quo):* Bad idea. If the truth comes out later (and it often does in the art world), the museum loses all credibility. It's ethical malpractice.
      *   *Option 2 (Hide it):* Bad idea. It's still a valuable historical object (local history, even if not by the *famous* guy). Hiding it wastes resources and diminishes the collection.
      *   *Option 3 (Reattribute & Reframe):* Best option. Acknowledge the new findings, update the label, keep it in the main room (or a prominent spot), but change the narrative. This balances integrity with visitor experience.
      *   *Why this works:* It addresses Side A's need for truth and Side B's desire to keep the drawing power of the piece. It turns a scandal into a story about local history and connoisseurship.

  3.  **Address the "Side B" Argument (The Core Challenge):**
      *   *Argument:* "People get the exact same experience... changing anything now just makes us look bad."
      *   *Counter-argument:* The experience *isn't* the same if the foundation is false. Trust is part of the museum experience. If visitors find out later we knew and hid it, the experience becomes negative.
      *   *Reframing:* We aren't "downgrading" the painting; we are "upgrading" our story. It becomes a mystery, a piece of local lore, rather than just a static image. The "fame" of the town's artist is still part of the story, just as the influencer, not the creator.
      *   *Risk Management:* Looking bad now (admitting a mistake) is better than looking terrible later (being exposed as deceptive).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the conservator's report.
      *   **The Situation:** Summarize the findings neutrally. It's not a "fake," it's a "misattribution."
      *   **The Debate:** Acknowledge the two board positions respectfully.
      *   **Addressing the Counter-Argument (Crucial):** Dedicate a specific section to the "Visitor Experience" argument. Validate it (yes, the painting is beautiful), but explain why accuracy enhances rather than detracts from that experience. Use the concept of "Trust."
      *   **The Recommendation:** Reattribute, Relabel, Reframe. Keep it visible.
      *   **The Plan/Timeline:** Concrete steps (Label design, press release strategy, board vote).
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**
      *   Needs to be firm but not authoritarian.
      *   Needs to show understanding of the museum's limitations (volunteers, small budget).
      *   Needs to be persuasive.
      *   *Self-Correction during drafting:* I initially thought about suggesting moving it. But the prompt says it's the main draw. Moving it hurts the museum. Better to keep it but change the story. I need to make sure I don't sound like an art snob. Focus on *local history* value, not just art market value.

  6.  **Developing the "Side B" Rebuttal:**
      *   Instead of saying "You're wrong," say "You're right that the visual experience is the same, BUT the intellectual/emotional experience relies on trust."
      *   Analogy: Like finding out a local legend is exaggerated. It's better we tell the cool true story than wait for someone else to debunk us.
      *   Emphasize that "Local History Museum" implies truth-telling is the mission.

  7.  **Final Review against Constraints:**
      *   Memo format? Yes.
      *   Real recommendation? Yes (Reattribute & Reframe).
      *   Deal with Side B argument? Yes (dedicated section).
      *   Timeline included? Yes.
      *   Tone appropriate? Yes.

  8.  **Final Polish:** Check for clarity and empathy. Ensure the distinction between "forgery" and "misattribution" is clear, as that helps the "no one was trying to trick anybody" point. (Proceed to generate output).

  *(Self-Correction Note during final review)*: Make sure I don't sound like I'm scolding the board. They are volunteers. Use "we" language. Emphasize that this is an *opportunity* for engagement, not just a cleanup task.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Name of Museum]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Attribution of [Name of Painting]

  **Purpose**
  The purpose of this memo is to propose a course of action following the recent conservation report on our key landscape piece, [Name of Painting]. As you know, pigment analysis and stylistic review conducted by [Conservator Name] indicate the work was likely produced by an apprentice or member of [Famous Painter]'s circle, rather than by the artist himself. The report suggests the attribution to the famous artist was applied decades later by a previous donor, rather than being a malicious contemporary forgery.

  We currently have two prevailing views on how to proceed:
  1.  **Correct and Conceal:** Update our records but move the piece to storage or a less prominent area to minimize attention on the error.
  2.  **Maintain Status Quo:** Keep the current labeling and placement, prioritizing visitor numbers and avoiding potential reputational damage.

  **Recommendation**
  I recommend a third path: **Reattribute, Relabel, and Reframe.**

  We should update the label to reflect the conservator's findings, keep the painting in its current prominent location, and actively use this new information to deepen our visitor engagement. We should aim to implement these changes by [Date, e.g., January 15th], coinciding with our annual meeting or spring opening.

  **Addressing the Visitor Experience Argument**
  I want to specifically address the argument that "people get the exact same experience standing in front of it either way, so changing anything makes us look bad for no benefit."

  It is true that the visual beauty of the landscape does not change based on the signature. A visitor will still enjoy the colors and composition regardless of the label. However, a museum visit is not solely a visual experience; it is an intellectual and emotional contract based on **trust**.

  *   **The Risk of Status Quo:** If we maintain the old attribution, we are betting that this information never leaks. In the digital age, conservation reports rarely stay private. If a visitor, researcher, or local journalist discovers we knew the truth and kept the old label, the narrative shifts from "an interesting historical discovery" to "the museum lied to keep ticket sales up." That damages our reputation far more than an honest correction ever will.
  *   **The Value of Accuracy:** Our mission is *local history*. Part of that history is how our town mythologized itself. The story of *why* everyone thought this was by the famous painter—and how the town's desire to claim his work led to this mix-up—is actually a richer, more human story than a simple wall label.
  *   **Enhancing the Experience:** By updating the label, we don't diminish the painting; we turn it into a mystery. We invite visitors to look closer. We can explain that while the "Master" didn't paint it, his influence was so strong that his students could mimic him perfectly. That speaks to the artist's legacy just as loudly as the original attribution did.

  **Implementation Plan**
  To execute this without disrupting operations or alarming donors, I propose the following timeline:

  1.  **Board Vote (Next Meeting):** Formal acceptance of the conservator's report and approval to update the catalog record.
  2.  **Label Redesign (By Dec 15):** Work with the conservator to draft text that is honest but enthusiastic.
      *   *Draft phrasing:* "Previously attributed to [Famous Painter]. Recent analysis suggests this work was created by a close associate or apprentice within his studio, c. 1890. This piece illustrates the high demand for the artist's style and the town's long-standing pride in his legacy."
  3.  **Communications Strategy (By Jan 1):** Prepare a brief press release or newsletter article framed as "New Discoveries at the Museum." We control the narrative by announcing it as an exciting scientific finding rather than a correction of an error.
  4.  **Installation (By Jan 15):** Install new signage. No need to move the painting.

  **Conclusion**
  We are a history museum, not an art gallery. Our currency is truth, even when that truth is complicated. By owning this discovery, we demonstrate professionalism and integrity. We protect the museum from future scandal, and we give our visitors a more authentic connection to our town's actual history, rather than the legend we hoped was true.

  I look forward to discussing this further at the next meeting.

  **Attachments:**
  *   Full Conservation Report Summary
  *   Draft Text for New Label
