answer: |-
  The silence in the study was not empty; it was heavy, pressed down by the hum of the cooling fans and the stillness of the woman in the chair. Elara's head rested against the leather backrest, eyes open, fixed on a point somewhere beyond the ceiling. There was no blood, no violence visible to the eye. The device sat on the desk, a sleek box of black metal and fiber optics, its single green light now dark.

  I reached out and touched her hand. It was cooling. In this room, in this world, the odds had finally caught up.

  For months, she had called it ascension. She spoke of the branching paths of reality as if they were lanes on a highway, and she possessed the only vehicle capable of staying in the open road. "I can't die, Julian," she had told me the first time she calibrated the machine. "Not subjectively. Wherever I am, I am alive. The branches where I don't wake up… they aren't mine."

  I stood in the kitchen while she worked, counting the seconds between the hum of the compressor and the click of the relay. I loved her, which meant I lived in the branches where she survived, terrified that each breath was borrowed from a graveyard of infinite Julians who were currently screaming over her corpse. She saw it as proof of her theory; I saw it as a tax paid in grief by versions of me that didn't get to keep her.

  The first few tests were clean. She would sit, the helmet would lower, and there would be a sharp crack of discharge. She would rise, smiling, untouched. But I noticed the delays. The way she would pause before answering a question, as if searching a database for the correct response.

  "Do you remember the cabin?" I asked her after the third trial. We had spent our anniversary there, five years ago. The lake was frozen; we drank whiskey by the fire.

  She blinked, the smile not reaching her eyes. "The logs. The cold. Yes."

  "You hated the cold," I said. "You wore my coat."

  "I know," she said, too quickly. "I remember."

  But she didn't shiver when she said it. The Elara I knew carried the chill of that night in her bones for weeks. This Elara carried only the data.

  By the tenth trial, the erosion was visible. She walked through the house like a guest, tracing the spine of books she had read a dozen times. She stopped asking about my day. When I cried, after the seventh test, when the probability curves she showed me suggested I should be mourning a widow, she touched my cheek with detached curiosity.

  "Why are you sad?" she asked. "I'm right here."

  "Because you almost weren't."

  "But I am." She turned back to the machine. "The weight of the world shifts, Julian. We just have to ride the crest."

  She didn't understand that riding the crest meant leaving the mass behind. Every time she triggered the device, she shed the skin of the woman who feared death. The survivor was someone else, stitched together from the fragments of a thousand close calls. She was becoming a creature of pure continuity, devoid of the scars that made her human. I was falling in love with a ghost who refused to haunt.

  Yesterday, she prepared for the final validation. She wanted to prove the immortality was stable, not just a streak of luck. She strapped herself in without checking the locks.

  "Come with me," I said. I didn't mean the chair. I meant the future. "Stop. Please. You're winning, but you're losing yourself."

  She looked at me, and for a second, the stranger vanished. I saw the woman who loved the frozen lake. "I have to know," she said. "If I stop, I admit the risk is real. If I continue, I prove I'm inevitable."

  "You're proving you're alone," I whispered.

  She lowered the visor.

  The click was louder this time. The green light flickered, struggled, and died.

  I waited for her to rise. I waited for the smile, the data-retrieval pause, the hollow confirmation of life. But the chair remained still. The silence stretched, thick and absolute. In this branch, the quantum coin had landed on edge and cut her throat.

  I walked around the desk. Her chest was still. The machine had done its work.

  There is a comfort, I suppose, for the Elara who woke up. Somewhere, in a branch weighted so thinly it barely exists, she is sitting in this chair, breathing, convinced of her own divinity. She has a Julian there, too. He is holding her hand, relieved, unaware that he is holding onto a version of her that has forgotten how to be afraid. He gets to keep her.

  I get to keep the silence.

  I looked at the device, this engine of segregation. It didn't kill her; it just sorted us. It filtered out the worlds where love was stronger than curiosity, leaving only the worlds where curiosity survived love.

  I sat on the floor beside her chair and took her cold hand in both of mine. I closed my eyes, trying to remember the weight of her hand before the tests, before the branching, before she became a traveler who left her luggage behind at every stop. I tried to recall the shiver of the cabin, the smell of the whiskey, the way she used to look at me when she was tired.

  In the branch where she lives, she is immortal. But I am here, in the heavy world, where things end. Where the odds are not a ladder to climb, but a gravity that pulls everything down eventually.

  "I remember," I said to the quiet room.

  I said it for the versions of me that died with her. I said it for the version of her that stayed. I said it because in this world, memory is the only immortality we have, and it is the only one that doesn't require a sacrifice.

  The green light on the machine remained dark. I stayed there until the sun went down, anchoring myself to the reality where she was gone, because it was the only reality where she had ever truly been here at all.
