  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Anscombe actually say soldiers are "harming" while sleeping?* She says they are "engaged in harming" or part of the "harming activity." I need to be precise. It's about the *capacity* and *role* within the unjust (or just) aggression.
      *   *Is it status or conduct?* Modern theorists (like McMahan) criticize the "moral equality of combatants" which Anscombe largely accepts (she focuses more on the civilian immunity). Anscombe is closer to the traditional view: Uniform/Role = Liability. But she grounds it in the *activity* of war. I should clarify that she isn't quite a modern "revisionist" Just War theorist. She holds to the traditional distinction.
      *   *The "Stretching" Charge:* I should acknowledge that it *feels* like stretching because she is trying to maintain an absolute prohibition ("Never kill the innocent") in a non-absolute world. The "sleeping soldier" move is the cost of maintaining that absolutism without pacifism.

  7.  **Final Polish:** Check against the user's specific questions.
