      *   *Definition of "Innocent":* Anscombe explicitly rejects the "moral guilt" definition. "Innocent" = "not engaged in harming." This is the *jus in bello* distinction between combatants and non-combatants.
      *   *The "Sleeping Soldier" Objection:* If "innocent" = "not currently harming," then a sleeping soldier isn't harming. Therefore, attacking them is murder. This leads to absurdity (war becomes impossible).
      *   *Anscombe's Solution:* The "role" or "engagement" definition. A soldier is part of an unjust (or just, depending on side) enterprise of harming. As long as they are *engaged* in that enterprise (under arms, in uniform, part of the force), they are liable to attack, even if sleeping. Once they surrender or are *hors de combat*, they revert to "innocent."
      *   *Application to Atomic Bombing:* The bombings killed people who were *not* engaged in harming (civilians, children, elderly). They were not part of the "harming enterprise" in the way soldiers are. Therefore, the bombing violated the absolute prohibition.

  3.  **Address Question 1: Act vs. Role (Philosophical Work or Stretching?):**
      *   *Is it stretching?* It *looks* like stretching to save the rule. If the rule is "don't kill those not harming," and you say "sleeping soldiers count as harming," you're expanding the definition of harming.
      *   *Is it genuine work?* Yes. It anticipates the modern Just War Theory distinction between *status-based* and *conduct-based* liability.
          *   *Conduct-based:* You are liable because of what you are *doing* right now (shooting).
          *   *Status-based:* You are liable because of what you *are* (a combatant).
      *   *Anscombe's Nuance:* She isn't purely status-based (like some modern theorists who say "uniform = target"). She ties it to the *activity* of warfare. A soldier is "doing war" even when sleeping, because their function is to fight. A civilian is not "doing war."
      *   *The "Necessity" Constraint:* Crucially, she adds the *hors de combat* limitation. You can attack the sleeping soldier to stop them, but not torture them or kill them if they surrender. This preserves the "innocence" link.
      *   *Verdict:* It's not just stretching; it's an attempt to ground the combatant/non-combatant distinction in something more stable than momentary behavior, without resorting to pure "uniform" fetishism. It's a precursor to the "continuous combatant function" idea.

