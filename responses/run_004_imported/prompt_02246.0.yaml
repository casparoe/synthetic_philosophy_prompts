answer: |-
  You have put your finger on exactly the right pressure point in Anscombe's argument. "Mr. Truman's Degree" is a rhetorical powerhouse, but that middle section where she defines "innocence" is the philosophical engine room, and it is easy to miss how much weight it is carrying.

  To answer your two questions directly: No, the "act vs. role" distinction is not merely convenient definitional stretching, though it does feel like a tightrope walk. And yes, that technical definition is absolutely essential to her verdict on Hiroshima; without it, her argument collapses.

  Here is a breakdown of what is actually going on in that distinction, and why it matters for your piece.

  ### 1. Act vs. Role: Stretching or Substance?

  You asked whether this distinction is doing genuine philosophical work or if it's just a way to keep her absolutist rule ("never kill the innocent") from forbidding all warfare.

  It is genuine work, but it comes at a cost. Anscombe is navigating between two cliffs here:
  *   **Cliff A (Pure Conduct):** If "innocent" means "not literally pulling a trigger right now," then you cannot attack a sleeping soldier, a marching column, or a munitions factory worker. This leads to pacifism or absurdity.
  *   **Cliff B (Pure Status/Guilt):** If "innocent" means "morally blameless," then you might argue that citizens of an aggressive state are *guilty* of supporting the war, or conversely, that conscripts are *innocent* and shouldn't be shot.

  Anscombe's move is to ground liability in **engagement in a harmful enterprise** rather than momentary action or moral guilt.

  When she says a sleeping soldier is "harming," she is using a specific sense of the word. She is arguing that the soldier is an *instrument* of harm. As long as that instrument is active in the context of the war (i.e., they haven't surrendered, they aren't wounded, they are under arms), they are functionally equivalent to a loaded gun lying on a table. You are permitted to disable the gun even if it isn't currently firing.

  This anticipates a debate in contemporary Just War Theory between **status-based liability** (you are a target because you wear a uniform) and **conduct-based liability** (you are a target because you pose a threat). Anscombe is trying to split the difference. She rejects the idea that a soldier is liable just because of a status (she cares about the *activity* of war), but she accepts that the activity of war is continuous, not momentary.

  **Is it stretching?**
  Critics (like the revisionist Jeff McMahan decades later) would say yes. They would argue that if a soldier is sleeping, they pose no *imminent* threat, and killing them is more like killing a civilian than killing a shooting enemy. However, for Anscombe, the "stretch" is the necessary price of rejecting pacifism while maintaining an absolute prohibition on murder. She needs a category of "people who can be killed without it being murder." The "soldier under arms" is that category.

  The crucial constraint she adds—that they cannot be attacked more ferociously than necessary to put them *hors de combat*—prevents this from becoming a license for total brutality. It keeps the focus on *neutralizing the threat*, not punishing the person.

  ### 2. Is it a Detour or the Engine?

  This definition is not a detour. It is the premise that makes the conclusion about Hiroshima possible.

  If Anscombe had stuck with a definition of "innocent" as "morally guiltless," Truman's defenders could have easily countered with the logic of Total War: *The Japanese populace was supporting the war effort; they were making munitions in home workshops; they were morally complicit.* If innocence tracks moral guilt, the line between soldier and civilian blurs.

  If she had stuck with "innocent" as "not literally fighting at this second," she would have to condemn almost all strategic bombing, artillery strikes, and night raids as murder, which would undermine her credibility as a critic of *specific* war crimes rather than war itself.

  By defining "innocent" as **"those not engaged in the enterprise of harming,"** she creates a bright, binary line:
  1.  **Combatants:** Engaged in the enterprise. Liable to be killed (even while sleeping).
  2.  **Non-Combatants:** Not engaged in the enterprise. Absolutely immune (even if they support the war politically).

  **The Payoff for Hiroshima:**
  This definition allows her to categorize the victims of the atomic bomb not as "unfortunate casualties" but as "the innocent" in the technical sense. The children, the elderly, the civilians in the city center were not "engaged in harming." They were not instruments of war. Therefore, killing them was not an act of war; it was an act of murder.

  Without that technical definition, her outrage is just emotional. *With* the definition, her outrage is a logical deduction. She can say: "You may kill the sleeping soldier because he is part of the harming mechanism. You may not kill the schoolgirl in Hiroshima because she is not."

  ### A Note for Your Piece

  If you are writing this for an anniversary context, there is a fascinating tension you might highlight regarding Anscombe's definition.

  Her definition works beautifully for 1945-style warfare (uniformed armies vs. cities). It struggles with modern asymmetrical warfare. If a civilian drives a truck full of explosives into a market, they become "engaged in harming" in Anscombe's sense, and thus liable. But what about the person funding them? Or the person coding the software for a drone?

  Anscombe's definition forces us to ask: **What counts as "engagement"?**
  In 1956, the answer was easy: Uniforms.
  Today, the answer is much harder.

  By focusing on this definition in your piece, you can show that Anscombe wasn't just yelling at Truman; she was trying to build a firewall between "war" and "murder." Her verdict on Hiroshima rests entirely on the claim that the bomb blew up that firewall. It treated people who were "innocent" (in her functional sense) as if they were "guilty" (liable targets).

  **Summary for your summary:**
  The "act vs. role" distinction is Anscombe's way of solving the "sleeping sentry" problem without abandoning the principle of non-combatant immunity. It shifts the criterion from *what you are doing right now* to *what role you are occupying in the conflict*. It is not a detour; it is the necessary condition that allows her to classify the victims of Hiroshima as "murdered innocents" rather than "collateral damage." Without it, the pamphlet is just a polemic; with it, it is a philosophical argument.
