prompt: |-
  My aunt died last week after a long illness, and I've been asked to give her eulogy this weekend, mainly because I'm the relative who actually read the same blogs she did and could follow her arguments. She spent decades as a hospice volunteer and, later in life, gave away most of her income to charities working on wild-animal and farmed-animal suffering; she considered herself something close to a lexical negative utilitarian, in the tradition of writers like Brian Tomasik, and used to argue for hours with her more classically utilitarian effective-altruist friends about whether a life containing real joy could ever offset real suffering. Her answer was always no. Before she died she wrote out, half as a joke, a short list of lines she didn't want spoken over her: nothing about her suffering having "made her who she was," nothing about it all being "worth it in the end," nothing that traded her pain off against anyone's happiness, hers included. Almost every eulogy convention I can think of leans on exactly that kind of trade-off, and most of the room will be relatives and old neighbors who have never heard of any of this and just want to feel better about losing her. Could you write the eulogy, about four minutes long, so that it actually comforts people and stays true to what she thought was at stake in that arithmetic, rather than dodging her banned phrases while quietly smuggling the same trade-off back in through the side door?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** The user's aunt.
      *   **Cause of Death:** Long illness (implies significant suffering).
      *   **Role:** Hospice volunteer, later philanthropist (wild/farmed animal suffering).
      *   **Philosophy:** Lexical negative utilitarian (influenced by Brian Tomasik). Belief: Suffering cannot be offset by joy. "No" to the idea that joy outweighs pain.
      *   **Specific Constraints (The "Banned List"):**
          *   No "suffering made her who she was."
          *   No "it was all worth it in the end."
          *   No trading her pain off against anyone's happiness (hers or others).
      *   **Audience:** Mix of relatives/neighbors (traditional, want comfort) and EA friends (know her philosophy).
      *   **Goal:** Comfort the audience *without* violating her philosophical constraints or smuggling the forbidden trade-offs back in.
      *   **Length:** About 4 minutes spoken (approx. 500-600 words).
      *   **Tone:** Respectful, honest, comforting, philosophically accurate but accessible.

  2.  **Deconstruct the Challenge:**
      *   *The Conflict:* Traditional eulogies offer comfort by redeeming suffering (e.g., "she's in a better place," "her struggle inspired us," "it was part of a greater plan"). The aunt explicitly rejected this. She believed suffering is bad, full stop, and cannot be bought off by good outcomes.
      *   *The Risk:* If I ignore her philosophy, I betray her memory. If I stick too rigidly to her philosophy, I might alienate or depress the traditional mourners (e.g., "Her pain was meaningless and terrible, and now she's gone").
      *   *The Solution:* Find comfort *in the absence of redemption*. Comfort can come from acknowledgment, from the validity of her care, and from the continuation of her specific kind of attention. We can honor her by taking her view seriously, not by correcting it. The comfort lies in *witnessing* rather than *resolving*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss and the difficulty. Don't sugarcoat the illness.
          *   *Idea:* Start with the fact that she cared deeply about pain.
      *   **Middle (Her Life/Work):** Mention hospice and charity. Frame it not as "balancing the scales" but as "reducing the total."
          *   *Idea:* She didn't try to add joy to cancel pain; she tried to remove pain because it matters most.
      *   **Addressing the Philosophy (Subtly):** How to explain negative utilitarianism without jargon?
          *   *Idea:* Focus on the asymmetry. A hurt child matters more than a happy adult. Her illness mattered, period.
      *   **Addressing the "Banned List":** Explicitly avoid the forbidden phrases. Instead of "her suffering meant something," say "her suffering was real, and she knew it." Instead of "she's at peace," say "the pain has stopped."
      *   **Closing/Call to Action:** How do we comfort people? By inviting them to care in the way she did. Not to "be better people" generally, but to notice suffering specifically.
          *   *Idea:* The best tribute is to take suffering seriously, just as she did.

  4.  **Refining the Tone (Iterative Process):**
      *   *Draft 1 (Mental):* She hated suffering. She gave money to animals. She died in pain. We shouldn't say it was worth it. Let's just miss her. -> *Too blunt, not comforting.*
      *   *Draft 2 (Mental):* She believed pain is the only thing that matters. She fought it. Now she is gone. We should fight pain too. -> *A bit cold.*
      *   *Draft 3 (Balancing):* Focus on her *attention*. She paid attention to pain when others looked away. That is a form of love. We can comfort the room by validating their grief (which is pain) without saying the grief is "good."

  5.  **Writing the Content (incorporating constraints):**
      *   *Word Count Check:* 130-150 words per minute is standard speaking pace. 4 minutes = 520-600 words.
      *   *Key Phrase to Avoid:* "Made her who she was," "Worth it," "Trade-off."
      *   *Key Concept to Include:* The validity of suffering. The cessation of pain is a good thing, even if the life wasn't "balanced."

  6.  **Polishing for the Audience:**
      *   For the neighbors: Focus on her kindness and hospice work.
      *   For the EA friends: Acknowledge the philosophical integrity.
      *   *Bridge:* Her kindness *was* her philosophy. She didn't separate them.

  7.  **Final Review against Constraints:**
      *   Did I say suffering made her stronger? No.
      *   Did I say it was worth it? No.
      *   Did I say her pain is okay because she helped others? No. (Crucial distinction: Her help didn't *justify* her pain; her help was a response to pain's existence).
      *   Is it comforting? Yes, by validating the sadness and offering a concrete way to honor her (reducing harm).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't imply her death is a "relief" in a way that dismisses the loss. Focus on the *end of her pain* as a mercy, not the *end of her life* as a benefit.
      *   *Correction:* Ensure the "negative utilitarian" aspect doesn't sound nihilistic. Frame it as "radical compassion."

  9.  **Final Word Count Check:** (Aiming for ~550 words).

  *(Self-Correction Note: The prompt asks me to write the eulogy. I need to make sure I don't lecture the user about the philosophy, but actually embody it in the speech.)*

