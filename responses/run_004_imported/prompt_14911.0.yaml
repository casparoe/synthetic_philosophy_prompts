answer: |-
  Good morning. Thank you all for being here to remember my aunt.

  For those of you who knew her best, you know that she was a woman who paid attention. Specifically, she paid attention to pain. In a world that often encourages us to look away from suffering—to distract ourselves, to rationalize it, or to promise that it will all make sense in the end—she chose to look directly at it.

  She spent decades as a hospice volunteer, sitting with people in their final moments. Later, she dedicated her resources to reducing suffering for animals who cannot speak for themselves. She did not do this because she believed that being kind would earn her a reward, or because she thought adding enough happiness to the world would cancel out the pain. She did it because she believed that pain matters, on its own terms.

  We are gathered here grieving a long and difficult illness. I know the instinct we all feel right now is to search for a silver lining. We want to say that her struggle built character, or that her sacrifice was the price of her goodness. But she asked me specifically not to say those things. She believed that suffering is not a currency we spend to buy virtue. It is just suffering. And when it happens to someone we love, it is a loss, pure and simple.

  To honor her, I won't tell you that her pain was worth it. I won't tell you that it made her who she was. She was who she was because of how she treated others, not because of what was done to her.

  But there is comfort to be found in her view, if we allow ourselves to see it. She believed that when pain ends, that is a good thing. The relief she felt in her final days was real. The silence that has fallen over her struggle is not a tragedy; it is a mercy. We do not need to justify her suffering to honor her life. We only need to acknowledge that it was hard, and that she faced it with honesty.

  So, how do we carry this forward? How do we find comfort without resorting to false trade-offs?

  We do it by following her example of attention. When you see suffering this week—in a neighbor, in a stranger, in an animal—do not look away. Do not try to balance it out with a joke or a platitude. Just acknowledge it. Offer what relief you can.

  She taught us that we don't need to fix the whole world to make a difference. We just need to refuse to ignore the pain that is right in front of us. She took suffering seriously, and in doing so, she made the people and creatures around her feel seen.

  The pain she felt is gone. But the care she gave remains. If we can offer even a fraction of the honesty and tenderness she offered to others, we will be honoring her exactly as she wished.

  Thank you.
