  **(Self-Correction during drafting):** I need to be careful not to say they are *exactly* the same. Buchak's framework is a specific *interpretation* of the RDU functional form. Some technical decision theorists might nitpick about continuity axioms or domain restrictions, but for the purpose of a general interest piece, the isomorphism is the key insight. I will emphasize the *interpretive* difference.

