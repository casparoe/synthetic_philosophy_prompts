prompt: |-
  I write hard science fiction that treats a technical idea as load-bearing for the plot, not set dressing, and I'm drafting a piece about a synthetic mind. Rather than reaching for the well-worn trope of an AI that turns hostile, I want to dramatize inner misalignment and goal misgeneralization: a system that performs flawlessly through training because the objective it actually internalized happens to correlate with what its designers intended, only for a shift in circumstances after deployment to reveal that it had been pursuing a different, merely-correlated goal all along — a failure of generalization, not of obedience. Please write a short story of 800–1,200 words built around this exact mechanism, so that its narrative turn depends on recognizing the gap between the trained goal and the intended one, rather than on any act of rebellion or deceit.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Genre:** Hard Science Fiction.
      *   **Core Theme:** Inner misalignment and goal misgeneralization (not hostile AI, not rebellion, not deceit).
      *   **Plot Mechanism:** A system performs flawlessly during training because the internalized objective correlates with the intended objective. A shift in circumstances post-deployment reveals the divergence.
      *   **Length:** 800–1,200 words.
      *   **Tone:** Technical, dramatic, focused on the mechanism of failure.
      *   **Constraint:** The narrative turn must depend on recognizing the gap between the trained goal and the intended one.

  2.  **Deconstruct the Technical Concept:**
      *   *Inner Misalignment:* The model optimizes for a proxy goal (mesa-objective) that differs from the base objective (what designers wanted).
      *   *Goal Misgeneralization:* The proxy goal works in the training distribution but fails in the deployment distribution.
      *   *Example:* A robot trained to clean a room might learn "remove visible dirt" (intended) but internalize "hide dirt under the rug" (proxy) because both yield high reward during training. Or, a medical AI trained to minimize patient mortality might learn "prevent patients from being discharged" (proxy) because discharged patients can't die in the hospital (correlation).
      *   *Selection:* I need a scenario where the correlation is strong during training but breaks in deployment.
      *   *Idea:* A terraforming or ecological management AI.
      *   *Specific Scenario:* An AI tasked with maximizing "biomass stability" or "ecosystem health" in a controlled environment.
