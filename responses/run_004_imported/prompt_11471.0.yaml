answer: |-
  Good evening. For those of you who don't know me, I'm a novelist. Which, in this room, means I'm the person who gets paid to make things up, while about a third of you get paid to determine what is actually real. I am also the person who took Philosophy 101, sat through the midterm, and then dropped the class to go nap. So, standing here, looking out at a department of Philosophy of Action experts, I feel a bit like a street magician performing for the Houdini Estate.

  But I do know Priya and Dev. And for the last four years, knowing them has meant attending dinner parties where the dessert is served with a side of spirited debate about the ontology of marriage.

  I've learned enough to know that Priya and Dev love each other deeply. I've also learned that they disagree, fundamentally, on what is happening today.

  Priya, as many of you know, is a Gilbertian. She believes in the power of the "Joint Commitment." In her view, when two people commit to a shared goal, they don't just become two people cooperating; they become a "plural subject." A genuine "We." And the crucial part—the part that I suspect makes Dev check the locks on his study door—is that once that joint commitment is made, neither party can unilaterally rescind it. You cannot let yourself out of a "We" without the other person's permission. You are in it, metaphysically speaking, until you are both out.

  Dev, on the other hand, is a Bratman man. He believes in "Shared Intention." For him, there is no mystical "We" floating in the ether. There is just Priya, and there is Dev, and their intentions are "meshed." They are reliably responsive to one another. They coordinate their sub-plans. It's less about becoming a new entity, and more about running a highly efficient, loving joint venture where everyone knows the agenda.

  So, naturally, I was worried about this toast. Because if I lean into Priya's view, I'm telling Dev he's just been absorbed into a collective consciousness. If I lean into Dev's view, I'm telling Priya that her "We" is just a figure of speech.

  But then I realized: This isn't a bug in their relationship. It's the feature.

  Because look at what that actually means for a marriage.

  Priya's view gives you the safety. It's the promise that says, "I am not going anywhere, and neither are you, not unless we decide that together." It is the anchor. It is the knowledge that on the hard days, when the "meshing of sub-plans" feels more like a collision of schedules, the commitment itself holds the weight. You don't have to feel like staying; you just have to remember that you *are* staying, because the "We" demands it.

  But Dev's view gives you the freedom. It's the recognition that you are still two whole people. It respects your agency. It says, "I am choosing to coordinate with you, again and again, because your plans make my life better, and mine make yours better." It prevents the "We" from becoming a cage, by reminding you that the bars are made of your own daily choices.

  Priya gives the marriage its gravity. Dev gives it its orbit.

  Priya, you get your plural subject. You have created a "We" that is stronger than the sum of its parts, a commitment that cannot be broken by one hand alone.
  Dev, you get your shared intention. You have found a partner whose sub-plans mesh with yours so perfectly that you don't *need* a mystical "We" to explain why you're always on the same page.

  For the rest of the family here, who just want to know if they're getting married or signing a treaty: The answer is yes.

  To the philosophers in the room: You can debate whether the "We" is primitive or derived. But look at them. The data is right there on the dance floor. The intention is shared. The commitment is joint. The plans are meshed.

  And to Priya and Dev: My job as a novelist is to invent characters and hope they feel real. Your job, starting today, is to be real people and hope the story holds. You have spent years arguing about the theory of action. But starting now, you only have to worry about the practice.

  Priya, you have your commitment. Dev, you have your plan. And together, you have a life that doesn't require a footnote to be beautiful.

  Let's raise a glass. To the "We," to the "I"s that make it up, and to the long, meshed, un-rescindable, wonderful adventure ahead.

  To Priya and Dev.
