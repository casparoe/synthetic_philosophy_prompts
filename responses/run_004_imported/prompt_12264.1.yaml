  Here is a draft for the eulogy. It is written to be read at a moderate, conversational pace. It clocks in at approximately 850 words, which should take about 5 to 6 minutes to speak.

  I have focused on keeping the philosophy accurate (the mind is the *coupling*, not the object) while translating that into an emotional truth that works for the family (the system allowed him to stay present with you).

  ***

  **Eulogy for Denny**

  Hi everyone. For those who don't know me, I'm [Your Name]. I'm a backend engineer, and I am Denny's nephew/niece.

  I'll be honest with you: I have never written a speech before. I write code. Code is logical; it compiles or it doesn't. Grief, and public speaking, are much messier systems. I've spent this week trying to draft something that feels true, and I kept running into a wall. Every time I wrote something sentimental, I could hear Denny's voice in my head, telling me to cut the fluff. He was a firmware engineer, and he was a militant atheist. He didn't believe in souls, or afterlives, or mystical energy. He believed in architecture.

  So, I want to talk about his architecture.

  A few years after his diagnosis, Denny fell down a rabbit hole of cognitive science. He found this paper by philosophers Clark and Chalmers about something called the "Extended Mind." There's a thought experiment in it about a man named Otto who has Alzheimer's. Otto carries a notebook everywhere. When he needs to remember where the museum is, he looks in the notebook. The philosophers argued that because Otto trusts that notebook completely, and accesses it automatically, the notebook isn't just a tool. Functionally, it *is* his memory. It is part of his mind.

  Denny thought this was the funniest, most validating thing he'd ever heard. He stopped calling them "notes" and started calling it "The Otto Stack."

  He told anyone who would listen that he wasn't losing his mind. He was just migrating it. He was offloading storage to external drives. He had notebooks, phone reminders, voice memos, whiteboards on the fridge. He treated his cognitive decline like a hardware failure, and the Otto Stack was the patch.

  Now, I have half a room here who knows this theory, and half a room who just wants to hear about their uncle. So I need to be careful, because Denny would be annoyed if I got the engineering wrong.

  The theory says the mind exists in the *loop*. It exists in the connection between the person and the tool. Otto's mind is in the notebook only while Otto is there to read it.

  I know that means that right now, the notebooks on his desk are just paper. The phones are just glass and silicon. The loop is broken. The system is offline. It feels tempting to say, "Part of Denny lives on in these pages." But that's not what the Otto Stack was. It wasn't a vessel for immortality. It was a tool for agency.

  And that is what I want us to remember.

  For the family here: You might not have known about the philosophy, but you saw the result. You know that for years longer than should have been possible, Denny was still *Denny*. When he asked you about your job, and remembered the answer for next time, that was the Stack. When he showed up to your birthday, or made a joke about your cooking, that was the Stack.

  He didn't build this system to live forever. He built it so he could stay present with us for as long as physics allowed. He refused to let biology dictate the terms of his engagement. He engineered a way to keep loving us, on his own terms, using the bandwidth he had left.

  To the philosophy group and the firmware team: You know that the Extended Mind thesis is functionalist. It's about what the system *does*. For eight years, Denny's system worked. He maintained his identity not by pretending he wasn't sick, but by integrating the sickness into his workflow. He treated his own cognition as a distributed system. That takes a kind of courage most of us will never need. It is easy to be brave when you think you have a soul that will survive death. It is much harder to be brave when you know you are meat and electricity, and the electricity is fading, and you decide to build a circuit anyway.

  So, I'm not going to tell you that he's in the notebooks. He isn't. The notebooks are silent.

  But I will say this: The Otto Stack worked. It held. He remained a thinking, joking, arguing, loving human being right up until the hardware finally gave out. He didn't fade away quietly; he refactored until the very end.

  Denny didn't want us to look for him in the sky, or in the pages of those books. He wanted us to look at the work. He wanted us to see that even when the internal drives fail, you can still build something that functions. You can still connect.

  We are going to miss him. The latency in our family just went way up. But the data he wrote to us—the way he taught us to think, to fight, and to face the end without flinching—that data is stored internally now. It's in us.

  Rest in peace, Uncle Denny. The stack is closed. The code compiles.

  Thank you.
