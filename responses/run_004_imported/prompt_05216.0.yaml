answer: |-
  You have hit on one of the most famous and persistent critiques of *Principia Ethica*. You are absolutely not missing anything; in fact, you've identified the exact fault line where many critics have tried to split Moore's meta-ethics from his normative ethics.

  To answer your question directly: **Yes, this is a known tension.** Many scholars argue that Moore's reliance on "organic unities" in Chapter 6 effectively undermines the force of the "unobserved beautiful world" argument in Chapter 3.

  Here is the breakdown of why this tension exists, how Moore tries to manage it, and why most philosophers think the "unobserved world" argument ends up doing very little work in his system.

  ### 1. The Two Claims
  Let's formalize the two positions you identified to see where they rub against each other.

  *   **Claim A (The Isolation Test):** Intrinsic value is a non-natural property that can attach to states of affairs independent of consciousness. A beautiful world with no observers has *positive* intrinsic value. (This secures Moore's **Realism**.)
  *   **Claim B (The Ideal & Organic Unities):** The *greatest* goods are complex wholes involving consciousness (e.g., the appreciation of beauty). The value of the whole (Consciousness + Beauty) is vastly greater than the sum of the parts (Consciousness + Beauty separately). (This secures Moore's **Humanism**.)

  ### 2. The Tension: "Negligible" vs. "Non-Existent"
  Moore's defense relies on a distinction of magnitude. He would argue there is no logical contradiction because he isn't saying beauty *needs* consciousness to have value; he is saying it needs consciousness to have *significant* value.

  In *Principia*, Moore admits that the value of the unobserved beautiful world is likely **infinitesimally small** compared to the value of a conscious being appreciating that beauty.

  Here is where your intuition is spot on: If the value of the unobserved world is so vanishingly small that it makes no practical difference to our ethical calculations, why did Moore fight so hard for it in Chapter 3?

  Critics (like C.D. Broad and later R.M. Hare) argued that if the value of the unobserved world is negligible, then for all intents and purposes, **value is mind-dependent.** By leaning so heavily on organic unities to explain where the *real* good lies, Moore makes consciousness the essential ingredient for anything that matters ethically. This makes the Chapter 3 thought experiment look like a philosophical flex that doesn't actually do any work in his ethical system.

  ### 3. The "Organic Unity" Trap
  The specific mechanism you pointed out—**organic unities**—is where the tension gets tightest.

  Moore defines an organic unity as a whole whose value is not proportional to the sum of its parts.
  *   **Part 1:** The beautiful object (has some value $v$).
  *   **Part 2:** The consciousness of it (has some value $c$).
  *   **The Whole:** Consciousness *of* the beautiful object (has value $V$).

  Moore claims $V \gg (v + c)$.

  The problem is that if $V$ is where all the ethical weight is, then $v$ (the value of the object in isolation) becomes ethically inert. If the "real" value only emerges when the two are combined, then the "value" of the isolated object starts to look like a theoretical phantom. It exists, but it's like a battery that produces no voltage until it's put in a device. Critics argue this suggests the value was never really in the battery (the object) to begin with, but in the circuit (the relationship).

  ### 4. Did Moore Notice This? (The Retraction)
  The strongest evidence that your "bug" is legitimate is that **Moore himself eventually wobbled on it.**

  In his later book, *Ethics* (1912), Moore revisited the "unobserved beautiful world" argument. He softened his stance significantly. He admitted that it is extremely difficult to be certain whether the unobserved world has value. He suggested that perhaps our intuition that it is "better" is actually a confusion—we might be unconsciously imagining ourselves looking at it.

  This is a huge concession. It suggests that even Moore realized that once you introduce organic unities and prioritize the "Ideal," the mind-independent value of beauty becomes incredibly hard to isolate or defend.

  ### 5. How to Reconcile Them (A Charitable Reading)
  If you want to defend Moore against the charge of contradiction, the best argument is this:

  Moore is fighting a war on two fronts.
  1.  **Against Subjectivism:** He needs the unobserved world to have value to prove that "Good" is not just "What I like." If value disappears without a mind, then value is dependent on minds, which slides toward subjectivism.
  2.  **Against Asceticism/Moralism:** He needs the "Ideal" (conscious appreciation) to be the highest good to prove that ethics isn't just about duty or rules, but about human experience and love.

  The "Organic Unity" is his bridge. It allows him to say:
  *   "Value is objective!" (The unobserved world has *some*.)
  *   "But human experience is paramount!" (The observed world has *much more*.)

  He isn't saying consciousness *creates* the value of the beauty; he is saying consciousness creates a **new, higher order of value** by entering into a relation with the beauty.

  ### Summary
  You aren't missing anything. The tension is real.
  *   **Is it a contradiction?** Technically, no. Moore can logically hold that $X$ has value $1$, and $Consciousness(X)$ has value $1,000,000$.
  *   **Is it a weakness?** Yes. By making the mind-independent value so negligible compared to the mind-dependent organic unity, he undermines the practical importance of his initial realism.

  Most contemporary meta-ethicists view the "unobserved beautiful world" argument as Moore's weakest link, precisely because the rest of his system (the Ideal) does all the heavy lifting with consciousness involved. You've correctly identified that the "Organic Unity" move essentially smuggles consciousness back in as the primary driver of value, even after Moore tried to kick it out the door in Chapter 3.

  So, your gut feeling is shared by a century of philosophers: The unobserved world argument feels like a setup that the rest of the book quietly abandons.
