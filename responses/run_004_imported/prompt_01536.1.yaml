          *   If we *only* check pure domination, we might miss cases where $s_i$ is never a best response.
          *   In my example ($M$), $M$ is never a best response.
          *   Is $M$ dominated by a pure strategy? No.
          *   Is $M$ dominated by a mixed strategy? Yes.
          *   Therefore, if we restrict elimination to *pure* domination, we would keep $M$. But $M$ is irrational (never a best response).
          *   So, allowing mixed dominators ensures we eliminate *all* irrational strategies (never best responses). This is the key intuition.

  8.  **Final Polish:** Organize with clear headings. Use LaTeX for math. Ensure the distinction between Strict and Weak order dependence is sharp. (Self-correction: Keep the order dependence section brief as requested).

