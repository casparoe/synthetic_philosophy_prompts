      *   **The Struggle:** Intuition for *mixed strategy* domination (Pure vs. Mixed). Why is it necessary?
      *   **Key Claims to Explain:**
          1.  There exist games where a pure strategy isn't dominated by any pure strategy but *is* dominated by a mixed strategy.
          2.  This relates to the equivalence: "Strictly Dominated $\iff$ Never a Best Response."
          3.  Order independence of IESDS (Iterated Elimination of *Strictly* Dominated Strategies) vs. order dependence of IEWDS (Iterated Elimination of *Weakly* Dominated Strategies).
      *   **Requirements:** Compact example, deep intuition, brief note on order independence.

  2.  **Deconstruct the Core Concept (Pure vs. Mixed Domination):**
      *   *Why does pure vs. pure fail?* Imagine a strategy $S$ that is "okay" against Opponent's $A$ and "okay" against Opponent's $B$, but there's no single strategy $T$ that is better than $S$ against *both* $A$ and $B$. However, maybe a 50/50 mix of $T$ and $U$ yields a payoff higher than $S$ against both $A$ and $B$.
      *   *The Geometry:* Payoffs are vectors. Pure strategies are points. Mixed strategies form the convex hull (the area inside the shape formed by the points). If a point ($S$) is inside the hull formed by others ($T, U$), it is dominated by a mix, even if it's not "below" any single point.

  3.  **Constructing the Example:**
      *   I need a $3 \times 2$ or $2 \times 3$ game. Let's try Player 1 having 3 strategies ($U, M, D$) and Player 2 having 2 ($L, R$).
      *   Goal: Make $M$ not dominated by $U$ or $D$ individually, but dominated by a mix of $U$ and $D$.
      *   *Setup:*
          *   If P2 plays $L$: $U$ is great, $D$ is bad, $M$ is medium.
          *   If P2 plays $R$: $U$ is bad, $D$ is great, $M$ is medium.
      *   *Payoffs:*
          *   $U$: (4, 0)
          *   $D$: (0, 4)
          *   $M$: (1, 1) -> Wait, (1,1) is dominated by (2,2) which is a mix of U and D (0.5 each).
          *   Let's check pure domination: Is $M$ dominated by $U$? No, because against $R$, $0 < 1$. Is $M$ dominated by $D$? No, because against $L$, $0 < 1$.
          *   Is $M$ dominated by $\sigma = 0.5U + 0.5D$?
              *   Against $L$: $0.5(4) + 0.5(0) = 2$. $2 > 1$.
              *   Against $R$: $0.5(0) + 0.5(4) = 2$. $2 > 1$.
      *   *Refinement:* This is the classic example. It's compact and clear.

  4.  **Explaining the "Never a Best Response" Intuition:**
      *   *Concept:* A rational player maximizes expected utility. If I believe P2 plays $L$ with probability $q$, my expected payoff for $M$ is linear in $q$.
      *   *Graphical Intuition:* Plot P1's payoffs on the Y-axis against P2's probability of playing $L$ on the X-axis.
      *   $U$ is a line going from 0 (at $q=0$) to 4 (at $q=1$).
      *   $D$ is a line going from 4 (at $q=0$) to 0 (at $q=1$).
      *   $M$ is a flat line at 1.
      *   The "Upper Envelope" (the best response correspondence) is formed by $D$ (for low $q$) and $U$ (for high $q$). $M$ is strictly *below* this envelope everywhere.
      *   *Connection:* If a strategy is strictly dominated (even by a mix), it lies strictly below the upper envelope of payoffs generated by other strategies. Therefore, there is *no* belief (no $q$) for which it is the unique maximizer. In fact, it's never even a tied maximizer if the domination is strict.

  5.  **Addressing Order Independence (IESDS vs. IEWDS):**
      *   *Strict Domination:* If $S$ is strictly dominated, it is *never* a best response. Removing it doesn't change the set of best responses for the remaining strategies because $S$ was never a best response to begin with. The "truth" about rationality doesn't shift based on what junk we throw away first.
      *   *Weak Domination:* If $S$ is weakly dominated, it *might* be a best response (tied). Removing it might eliminate a scenario where another strategy $T$ was a best response. If we remove $S$ first, $T$ might become strictly dominated or lose its status. The order matters because weak domination relies on ties, and removing a strategy breaks ties.
      *   *Analogy:* Strict is like being shorter than everyone else (you're out regardless of who leaves the room). Weak is like being no taller than everyone else (if the tallest person leaves, you might become the tallest).

