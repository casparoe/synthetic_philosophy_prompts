prompt: |-
  I'm currently taking a game theory course, and we've just finished a unit on iterated elimination of dominated strategies. I follow the case where a pure strategy is eliminated because some other pure strategy dominates it, but I'm struggling to build real intuition for why we also need to allow mixed strategies to serve as dominators. My professor mentioned, without really unpacking it, that there are games in which a pure strategy is not beaten by any single pure alternative yet is still strictly dominated once mixtures are permitted, and that this is precisely what makes strict dominance line up with the idea that a strategy is never a best response to any belief about the opponents' play. Could you explain, ideally with a compact example, why restricting comparisons to pure strategies misses these cases, and what the deeper intuition is behind that equivalence with best responses? I would also appreciate a brief note on why this same feature is what makes iterated elimination of strictly dominated strategies independent of the order of elimination, whereas the analogous procedure for weakly dominated strategies is not.
