      *   **The Core Question:** What *kind* of mental state is this guilt?
          *   Option A: A lagging belief (doxastic account).
          *   Option B: A perceptual illusion (perceptual account).
          *   Option C: A bare bodily reaction/affect without propositional content (non-cognitivist/somatic account).
      *   **Goal:** Provide a take on which framework best captures this phenomenon, leveraging the user's background in cognitive science.

