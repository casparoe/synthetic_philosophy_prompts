prompt: |-
  I write historical fiction set in the English Midlands and host a small podcast in which I talk with scholars about the interior lives of novelists I admire. Next week's guest has spent her career on George Eliot's religious trajectory, and I don't want the hour to collapse into the standard "she lost her faith and became a secular humanist" summary. Draft eight to ten interview questions that push past that: I want at least one question on how translating Feuerbach's account of religion as projected human feeling reshaped Eliot's narrative method of sympathy rather than merely her private convictions, one that sets her scathing 1855 dismantling of Dr. Cumming's evangelicalism against her sympathetic treatment of preachers like Dinah Morris and Mr. Tryan and asks the guest to reconcile the two, and one that gets past the well-worn Cambridge anecdote about God, Immortality, and Duty to ask what work "Duty" is actually doing once the first two have dropped away -- and whether her meliorism amounts to more than a rebranding of Comte's Religion of Humanity. For each question, add a brief follow-up keyed to the answer the guest is most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user writes historical fiction set in the English Midlands and hosts a podcast about the interior lives of novelists.
      *   **Guest:** A scholar specializing in George Eliot's religious trajectory.
      *   **Goal:** Avoid the cliché summary ("she lost faith, became a secular humanist"). Dig deeper into nuance, narrative method, specific texts, and philosophical underpinnings.
      *   **Requirements:** 8-10 interview questions.
      *   **Specific Inclusions:**
          1.  Feuerbach's translation impact on narrative sympathy (not just private conviction).
          2.  Reconciling the 155 review of Dr. Cumming (scathing) with sympathetic preachers (Dinah Morris, Mr. Tryan).
          3.  Moving past the "God/Immortality/Duty" anecdote to analyze the function of "Duty" and compare meliorism to Comte's Religion of Humanity.
      *   **Format:** Each question needs a brief follow-up keyed to the *likely* answer.

  2.  **Deconstruct the Subject (George Eliot's Religion):**
      *   *Marian Evans to George Eliot:* The translation of Strauss (*Life of Jesus*) and Feuerbach (*Essence of Christianity*).
      *   *The Break:* Breaking with her father over church attendance (Coventry).
      *   *The Westminster Review:* Writing for the radical intelligentsia.
      *   *The Fiction:* How theology translates into psychology and ethics in the novels (*Adam Bede, The Mill on the Floss, Middlemarch, Daniel Deronda*).
      *   *Key Concepts:* Sympathy, Duty, Meliorism, Humanism, Secularization, Sacred/Profane.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Feuerbach & Sympathy.*
          *   *Draft:* How did translating Feuerbach change her writing?
          *   *Refinement:* Needs to be specific about "projected human feeling" becoming "narrative method."
          *   *Follow-up:* If she says it made her more empathetic, ask about the limits of that empathy.

      *   *Requirement 2: Cumming vs. Dinah Morris/Tryan.*
          *   *Draft:* Why did she hate Cumming but like Dinah?
          *   *Refinement:* Focus on the 1855 review ("Evangelical Teaching: Dr. Cumming") vs. the fiction. How does she distinguish *dogma* from *pastoral care*?
          *   *Follow-up:* Ask if this distinction is sustainable or if the dogma eventually poisons the care in her later work.

      *   *Requirement 3: Duty & Comte.*
          *   *Draft:* What did Duty mean without God? Is it just Comte?
          *   *Refinement:* The Cambridge anecdote (Bray) is famous. Move past it. What is the *ontology* of Duty? Is meliorism just Comte rebranded?
          *   *Follow-up:* Ask about the emotional cost of this Duty without divine reward.

      *   *Requirement 4: The Midlands Context (User's interest).*
          *   *Draft:* How does the Midlands setting matter?
          *   *Refinement:* Connect the religious nonconformity of the Midlands to her theological shifts. The "sacredness" of the local.
          *   *Follow-up:* Does this make her work provincial or universal?

      *   *Requirement 5: Interior Life/Podcast Theme.*
          *   *Draft:* What was her inner life like?
          *   *Refinement:* Focus on the *loss* of prayer. How did she replace the ritual of prayer with the ritual of writing?
          *   *Follow-up:* Did she miss the comfort of prayer?

      *   *Requirement 6: Translation as Theology.*
          *   *Draft:* Did translating Strauss matter?
          *   *Refinement:* Translation as an act of interpretation. Did she strip the myth to find the truth, or create a new myth?
          *   *Follow-up:* How does this relate to her realism?

      *   *Requirement 7: Daniel Deronda/Late Work.*
          *   *Draft:* What about her last book?
          *   *Refinement:* *Daniel Deronda* brings Judaism back in. Is this a return to faith or an expansion of humanism?
          *   *Follow-up:* Does Gwendolen Harleth's conversion represent Eliot's own final stance?

      *   *Requirement 8: The "Secular Saint" Paradox.*
          *   *Draft:* Was she a saint?
          *   *Refinement:* She rejected heaven but demanded saintly behavior. Is this a harsher moral system?
          *   *Follow-up:* How did her contemporaries react to this severity?

      *   *Requirement 9: Community/Church.*
          *   *Draft:* Did she go to church?
          *   *Refinement:* She stopped going, but did she miss the *community*? How does the novel function as a substitute congregation?
          *   *Follow-up:* Is the reader the new congregant?

      *   *Requirement 10: Legacy/Modernity.*
          *   *Draft:* Why does this matter now?
          *   *Refinement:* In a post-religious age, does her solution hold up?
          *   *Follow-up:* What would she say to today's atheists?

  4.  **Review and Polish:**
      *   Check against constraints: 8-10 questions? Yes. Specific required topics included? Yes. Follow-ups included? Yes. Tone appropriate for a literary podcast? Yes (intellectual but accessible).
      *   *Self-Correction on Follow-ups:* Ensure the follow-ups anticipate a scholarly answer (which might be nuanced/qualified) rather than a simple yes/no.
      *   *Tone Check:* Ensure the questions sound like they come from a fellow writer/historian (Midlands focus) but respect the scholar's expertise.

  5.  **Final Polish of Specific Questions:**
      *   *Feuerbach Question:* Make sure to mention "species-being" or the projection concept implicitly.
      *   *Cumming Question:* Ensure the date (1855) is referenced.
