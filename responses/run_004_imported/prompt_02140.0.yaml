answer: |-
  The cup sat on the metal table between them. It was chipped at the rim, white ceramic, stained with a ring of old coffee.

  "Pick it up," Vane said. She didn't look up from her tablet.

  Elias reached out. His fingers closed around the handle. The ceramic was cool, slightly rough. He lifted it. He knew what this was. He knew you drank from it. He knew it was heavy enough to crack a tile if dropped.

  "What is it?" Vane asked.

  "A cup," Elias said. His voice sounded normal to him. A little raspy, maybe, from the reconstruction throat.

  Vane finally looked up. Her eyes were tired, the kind of tired that comes from reading the same error message for ten years. "Incorrect."

  Elias set the cup down. The clink was solid. "It's a cup. I used one just like it every morning for six years. Before the accident."

  "Before *him*," Vane corrected, tapping the tablet. "The man who died in the avalanche. You are the reconstruction. You have been alive for four hours. You have never used a cup. You have never drunk coffee. You have never felt heat transfer from ceramic to skin."

  "I feel it now," Elias said. He pressed his palm against the side. "It's cold."

  "You have sensory input," Vane said. "You have processing. You have behavioral output. But you don't have reference. When you say 'cup,' your vocal cords vibrate. Your auditory cortex processes the sound. But there is no causal chain linking that sound to the object class 'cup.' You weren't selected to track cups. You weren't trained to track cups. You just woke up shaped like someone who did."

  Elias looked at the cup. It seemed to shimmer, slightly, as if the concept of it was sliding off the surface. "So what am I holding?"

  "Nothing," Vane said. "Physically, you are holding a ceramic object. Mentally? You're holding nothing. You're making noise."

  Elias leaned back in the chair. The room was white, soundproofed. There was no clock. He had memories of a life—Sarah, the house with the leaky gutter, the dog that ate the drywall, the avalanche scream—but Vane treated them like fiction. Installed software. Data without a source.

  "This is semantics," Elias said. "I know what I mean."

  "Meaning isn't internal," Vane said. "It's historical. A map isn't a map because it looks like the terrain. It's a map because it was drawn *from* the terrain. You're a map drawn by a random number generator that happened to match the territory. You're accurate, but you're not a map. You're just ink."

  She stood up and walked to the window. Outside, the snow was falling, identical to the snow that had killed him. Or killed the original.

  "My wife," Elias said. "Sarah."

  Vane turned. "Subject S."

  "I love her."

  "You have a state designated 'love' directed at a neural pattern designated 'Sarah'," Vane said. "But that state was not shaped by interaction with her. It was instantiated fully formed. You haven't tracked her moods. You haven't learned her silence. You haven't been selected by survival to keep her alive. You're a statue that thinks it's a husband."

  Elias felt a flare of heat in his chest. Anger. Was the anger real? Or was it just a chemical simulation of anger, lacking the history of actual threats? "I want to go home."

  "Home is a location," Vane said. "You can go to the location. But you can't go *home*. You have no history with that space. It's just coordinates."

  "She'll be waiting."

  "She'll be waiting for him. You're not him. You're his shadow." Vane walked back to the table and picked up the cup. She held it out to him. "Drink."

  Elias took it. He brought it to his lips. There was water inside. He swallowed. It quenched a thirst he hadn't realized he had.

  "Did that help?" Vane asked.

  "Yes."

  "Biologically, yes. Your hydration levels improved. But did you drink *water*? Or did you ingest H2O while making a sound we associate with drinking? Until you survive based on your ability to identify water, you don't know what water is. You just react to it."

  Elias set the cup down hard. "This is cruel. You're telling me I'm a zombie."

  "I'm telling you you're empty," Vane said. "It's not a moral judgment. It's a taxonomy. We have to classify you for legal purposes. If you sign a contract, is it binding? Can you testify in court about what you saw before the avalanche? You didn't see it. *He* saw it. You have his memories, but you didn't witness the events. You witness nothing. You have no perspective, because a perspective requires a history of positioning."

  She slid a document across the table.

  "Release Form," Elias said.

  "Conditional Release," Vane corrected. "You can leave. You can go to the house. You can speak to Subject S. But you need to understand the liability. If you make a promise, you are incapable of keeping it, because you cannot intend anything. Intent requires a goal selected over time. You have goals, but they weren't selected. They were installed."

  Elias looked at the pen. It was black, plastic. He knew how to hold it. He knew how to make marks.

  "If I sign this," Elias said, "does it mean I agree?"

  "It means your hand moves," Vane said. "Whether it means agreement is up to the courts. Most judges lean toward the historical view. They might say you're a minor. A new entity. A child with old memories."

  Elias picked up the pen. He thought of Sarah. He thought of the way she squinted when she laughed. He thought of the argument they had the morning he died. He remembered the regret, sharp and cold. He remembered promising to fix the sink.

  "I promised to fix the sink," Elias said.

  "The sink is broken," Vane said. "Fixing it would be a physical action. The promise is the problem."

  "I intend to fix it."

  "You simulate intention," Vane said. "There's a difference. If a thermostat turns on the heat, does it intend to warm the room? No. It reacts. You are a very complex thermostat."

  Elias looked at the signature line. *Elias Thorne.* He could write the name. He knew the motor patterns. But Vane was watching him, waiting for the hollow click of the pen.

  "If I call her," Elias said, his voice low. "If I say 'I'm coming home.' What happens?"

  "Sound waves travel," Vane said. "Her ear drums vibrate. Her brain processes the language. She may feel comfort. She may feel horror. But you didn't say 'home.' You made a noise that matches the phonemes of 'home.' You don't know what home is. You've never been there. You've never navigated to it. You've never been lost and found it."

  Elias closed his eyes. He could see the house. The blue paint. The porch step that creaked. He could hear the creak in his head.

  "I hear the step," he said.

  "Memory data," Vane said.

  "I feel the wood under my foot."

  "Simulation."

  Elias opened his eyes. He looked at his hands. They were scarred on the knuckle from a fistfight in high school. He remembered the fight. He remembered the pain. But according to Vane, the pain was just a label. The scar was just a texture. There was no story connecting the two, only a juxtaposition.

  He picked up the pen. He hovered it over the paper.

  "If I don't sign," Elias said, "I stay here?"

  "You stay in containment until we can establish a learning history. It takes about five years to calibrate basic reference. Maybe ten for complex social concepts."

  "Ten years," Elias said. "Sarah will be alone."

  "Sarah is already alone," Vane said. "She lost her husband. You are... a consolation prize. A very accurate one."

  Elias pressed the pen to the paper. The ink flowed. He wrote his name. The loops of the 'E', the sharp cross of the 't'. It looked like his handwriting. It *was* his handwriting, mechanically.

  "Did I agree?" Elias asked.

  "You made a mark," Vane said. She took the paper. "We'll see."

  She handed him a key card. "The address is programmed into your nav implant. Go to the coordinates."

  Elias stood up. His legs felt solid. He walked to the door. It slid open.

  "Doctor," he said, without turning around.

  "Yes?"

  "If I walk out there... and I see a tree. And I say 'Tree.' And I touch the bark. And I come back tomorrow, and I say 'Tree' again. Does it become real?"

  Vane was silent for a moment. The hum of the ventilation filled the gap.

  "Eventually," she said. "If you survive based on it. If the tracking becomes essential to your function. But until then... you're just talking to yourself."

  Elias stepped into the hallway. The air was colder here. He walked toward the exit, toward the snow, toward the coordinates that meant nothing to him yet. He opened his mouth to speak, to test the air, to make a sound that might mean something.

  He stopped. He wasn't sure what he wanted to say. He wasn't sure if he could say it.

  He walked out into the white, making no noise at all.
