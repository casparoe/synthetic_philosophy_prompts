answer: |-
  This is a classic philosophical showdown (Clifford vs. James), but your friend is relying on a very common, somewhat caricatured reading of William James. While James does push back against Clifford, he does not argue what your friend says he argues.

  Here is the breakdown of where your friend's interpretation goes off the rails, how James actually argues, and whether Clifford is truly "refuted."

  ### 1. The "Truth = What Works" Confusion
  Your friend is conflating two different works by James.
  *   **"The Will to Believe" (1896):** This is about the **ethics of belief** (when are we *allowed* to believe without evidence?).
  *   **"Pragmatism" (1907):** This is about the **theory of truth** (what does it *mean* for a belief to be true?).

  Your friend is using the "cash-value" theory of truth from the later book to justify the argument in the earlier book. Even then, she is oversimplifying James's pragmatism. For James, a belief "working" doesn't mean it makes you feel happy or comforted in the moment. It means the belief successfully guides you through your experience of reality over the long term without contradicting other verified truths.

  If you believe "I can fly" and jump off a roof, that belief does not "work" (you hit the ground). Therefore, under James's own pragmatism, that belief is false, regardless of how much faith you had.

  ### 2. James Does Not Give a "Blank Check"
  In *"The Will to Believe,"* James does not say we can believe anything without evidence. He sets up strict criteria for when it is permissible to let our "passional nature" (emotions/hopes) decide a belief ahead of evidence.

  He argues that we only have the "right to believe" when the hypothesis presents a **Genuine Option**. A Genuine Option must be three things:
  1.  **Live:** The hypothesis must be plausible to you. (If I ask you to believe in Zeus, that's a "dead" option; you can't just choose to believe it.)
  2.  **Forced:** You cannot avoid the choice. Skepticism must count as a choice against the belief. (Example: "Either believe I am trustworthy, or treat me as untrustworthy." You can't just suspend judgment and keep the relationship.)
  3.  **Momentous:** The opportunity is unique, significant, and potentially irreversible.

  **Crucially:** James explicitly excludes scientific and empirical claims from this rule. He agrees with Clifford that if there *is* evidence available (like in physics, history, or daily facts), you must follow the evidence. James's exception applies only to metaphysical, religious, or moral questions where evidence is inherently unavailable or inconclusive.

  So, your friend is wrong that this applies to "any belief." You cannot use James to justify believing the earth is flat because it "works" for your worldview.

  ### 3. Did James Refute Clifford?
  Most philosophers view James and Clifford as **complementary**, not contradictory.

  *   **Clifford's Point:** Beliefs lead to actions. If you believe things without evidence, you risk harming yourself and society (e.g., believing a ship is seaworthy without evidence puts passengers at risk). We have a duty to society to keep our belief-forming habits rigorous.
  *   **James's Point:** Clifford's rule is self-defeating if applied universally. Sometimes, you *must* believe something to *create* the evidence.
      *   *James's Example:* A climber is stuck on a ledge. The only way to survive is to make a terrifying leap. If he doubts (follows Clifford), he hesitates and falls. If he believes he can make it (follows James), his confidence gives him the strength to jump, and the belief becomes true because he acted on it.

  James argues that in specific interpersonal or existential cases, **faith creates the fact.** Clifford argues that in public and empirical cases, **evidence must precede faith.**

  ### 4. The "Comeback" for Your Next Argument
  Your friend's argument rests on the idea that James redefined truth as "subjective utility," thereby making evidence irrelevant. Here is how you can counter that:

  1.  **Distinguish Justification from Truth:** James doesn't argue that believing without evidence makes a proposition *true*. He argues that in specific cases, it is *rationally permissible* to adopt the belief. He isn't changing the definition of truth in that essay; he is changing the rules for when we are allowed to commit.
  2.  **The "Scientific" Exception:** Remind her that James explicitly limits his argument to options that "cannot by their nature be decided on intellectual grounds." He would agree with Clifford that you need evidence for vaccines, climate change, or historical facts. If her argument implies we can ignore evidence for *any* belief, she is misreading James.
  3.  **The "Works" Nuance:** If she leans on the "cash-value" argument, ask her: "Does believing I can breathe underwater 'work' for me?" If she says no, ask why. If it's because I would die, then she admits there is an external reality that determines if a belief works, not just her internal feeling. If there is an external reality, we need evidence to map it, which brings us back to Clifford.
  4.  **The Social Cost:** James focuses on the individual's right to believe. Clifford focuses on the social duty of belief. You can tell your friend: "James might say I have a right to believe my conspiracy theory because it comforts me, but Clifford would say I have a duty not to, because it makes me a worse citizen. James doesn't erase that duty."

  ### Summary
  Your friend is using a "pop-philosophy" version of James.
  *   **James does not say:** "Truth is whatever feels good."
  *   **James does say:** "When evidence is impossible to get, and the stakes are high, you are allowed to let your hopes decide."
  *   **Clifford is not refuted:** His rule still applies to all empirical, scientific, and public claims.

  James saves faith from evidentialism, but he doesn't burn down the house of evidence to do it.
