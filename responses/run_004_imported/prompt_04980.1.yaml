prompt: |-
  I have been working through Keynes's General Theory for a seminar on the history of economic thought, and in a separate course on information economics we recently covered the no-trade theorems associated with Aumann's agreement theorem and, more specifically, with Milgrom and Stokey's 1982 result: if traders are risk-averse expected-utility maximizers who share a common prior, and it is common knowledge that a trade is on offer, then a rational agent should already have incorporated the mere fact of a counterparty's willingness to trade into her own beliefs, so that no exchange motivated purely by private information can actually occur. This sits uneasily next to the sheer volume of speculative trading in real asset markets, and the usual resolutions economists propose — noise traders, heterogeneous priors, liquidity shocks, limits on common knowledge — all work by denying one of the theorem's premises rather than by challenging its underlying logic.

  Keynes, of course, died decades before any of this was formalized, but he wrote at length about the psychology and epistemology of speculative markets on his own terms: the newspaper "beauty contest" of chapter 12 of the General Theory, the idea of asset values resting on a precarious and self-sustaining convention, the appeal to "animal spirits" where calculation gives out, and his liquidity-preference account of why anyone would hold idle cash at all. Earlier still, in the Treatise on Probability and the 1937 restatement in the Quarterly Journal of Economics, he had already insisted that our long-run economic prospects are not the sort of thing over which a rational agent can even form a well-defined probability distribution. Taking all of this together, how do you think Keynes would have responded to the no-trade theorems? Would his objection simply reduce to the familiar move of denying that real traders share a common prior, or does his more radical claim — that long-term expectation resists quantification altogether — pose a deeper challenge to the theorems' Bayesian framework than the standard resolutions do? And is there, conversely, anything in his own emphasis on convention, and on trying to guess what average opinion expects average opinion to be, that bears on the theorems' reliance on common knowledge as exactly the condition under which, on Milgrom and Stokey's account, speculation should collapse?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user is a student/scholar working on Keynes's *General Theory* (GT) and Information Economics (specifically No-Trade Theorems like Milgrom & Stokey 1982, Aumann's Agreement Theorem).
      *   **Core Tension:** No-trade theorems say rational agents with common priors shouldn't trade based on private info (because the offer to trade reveals info that cancels the advantage). Real markets trade *a lot*. Standard resolutions deny premises (noise traders, heterogeneous priors, etc.).
      *   **Keynes's Position:**
          *   GT Chapter 12: Beauty contest, convention, animal spirits.
          *   *Treatise on Probability* / 1937 QJE: Radical uncertainty (non-quantifiable probabilities).
          *   Liquidity Preference: Why hold cash?
      *   **The Question:** How would Keynes respond to No-Trade Theorems?
          *   Is it just "no common prior" (standard resolution)?
          *   Or is it a deeper challenge to the Bayesian framework itself (radical uncertainty)?
          *   Does his view on convention/common knowledge interact with the theorem's reliance on common knowledge?

  2.  **Analyze the No-Trade Theorem (Milgrom & Stokey 1982):**

      *   *Premises:* Common Prior, Common Knowledge of Rationality, Common Knowledge of Trade Offer, Expected Utility Maximization (Bayesian).
      *   *Logic:* If I want to sell and you want to buy, I infer you know something good. You infer I know something bad. We update until the gain from trade vanishes.
      *   *Implication:* Speculation based purely on information asymmetry is impossible among rational agents.

  3.  **Analyze Keynes's Epistemology (The "Keynesian" Challenge):**

      *   *Radical Uncertainty (1937 QJE):* "About these matters there is no scientific basis on which to form any calculable probability whatever. We simply do not know." This attacks the *state space* and *probability measure* required for Bayesian updating.
      *   *Convention (GT Ch. 12):* We assume the future will be like the present because we have no better basis. This is a social construct, not a Bayesian update.
      *   *Beauty Contest:* It's not about fundamental value (Bayesian expectation of dividends); it's about higher-order beliefs about *others'* valuations.
      *   *Liquidity Preference:* Holding cash is a refuge from uncertainty, not just a transactional convenience or risk-aversion hedge in the standard sense.

  4.  **Synthesize: Keynes vs. No-Trade Theorems:**

      *   *Point 1: The Common Prior Assumption (CPA).*
          *   Standard resolution: People have different priors.
          *   Keynesian resolution: It's not just that priors differ; it's that *priors cannot exist* in the Bayesian sense for long-term investment. You can't have a common prior over an undefined state space.
          *   *Verdict:* Keynes goes deeper than just "heterogeneous priors." He attacks the coherence of the prior itself.

      *   *Point 2: Common Knowledge.*
          *   No-Trade Theorem relies on Common Knowledge of Rationality and the Trade Offer.
          *   Keynes's "Beauty Contest" is essentially about *infinite regress* of expectations (what does he think I think...).
          *   However, Keynes argues this regress doesn't lead to a stable equilibrium (Aumann-style agreement); it leads to instability and conventions.
          *   Keynes would argue that "Common Knowledge" of fundamentals is impossible because fundamentals (long-term yield) are unknowable. Therefore, the "trade offer" signal cannot be processed in the Milgrom-Stokey way because there is no underlying truth value to update towards.

      *   *Point 3: The Nature of Trade (Speculation vs. Investment).*
          *   Milgrom-Stokey assume trade is about exchanging risk or information regarding a *determinate* outcome.
          *   Keynes distinguishes Speculation (forecasting market psychology) from Enterprise (forecasting asset yield).
          *   In GT, most market activity is Speculation. If the game is guessing *prices* (which are conventional), not *values* (which are uncertain), then the No-Trade logic fails because the "value" isn't a fixed random variable to be learned. It's a moving target created by the trading itself.

      *   *Point 4: Liquidity and "Animal Spirits".*
          *   Why trade? Milgrom-Stokey need a motive (risk sharing or info).
          *   Keynes: We trade because we need liquidity (safety) or because animal spirits prompt action despite lack of calculation.
          *   If action is driven by "spontaneous optimism" rather than expected utility calculation, the rationality premise of the theorem is violated fundamentally, not just parametrically.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. It bridges formal microfoundations and heterodox macro/epistemology.
      *   *Section 1: Radical Uncertainty vs. Bayesian Priors.* This is the big gun. Milgrom-Stokey require a probability space. Keynes (1937) says for long-term investment, that space doesn't exist. It's not "risky" (known distribution); it's "uncertain" (unknown distribution). This makes the "Common Prior" assumption not just false, but *category erroneous*.
      *   *Section 2: Convention and Common Knowledge.* The No-Trade theorem uses Common Knowledge to *stop* trade. Keynes uses Convention to *enable* trade. Without convention, markets would freeze (liquidity preference). Convention is a substitute for knowledge, not a result of information aggregation. This flips the logic.
      *   *Section 3: The Beauty Contest and Higher-Order Beliefs.* Aumann/MS assume higher-order beliefs converge. Keynes assumes they diverge or oscillate. The "average opinion" is not a sufficient statistic for fundamental value; it *is* the value. This makes the "signal" in the trade offer meaningless regarding fundamentals.
      *   *Section 4: Liquidity and the Motive for Trade.* MS assume trade is for risk-sharing or info. Keynes says trade is often for liquidity (exit option). The desire to hold cash vs. assets isn't just risk aversion; it's fear of the unknowable. This motivates trade (churning) differently.
      *   *Conclusion:* Keynes wouldn't just say "priors differ." He would say "the game you are modeling is not the game we are playing." The MS theorem is a logical truth within a closed system; Keynes argues the economy is an open, non-ergodic system.

  6.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Caution:* Don't caricature Keynes. He wasn't irrational; he was dealing with *non-probabilistic* uncertainty.
      *   *Caution:* Don't caricature Milgrom-Stokey. They allow for risk aversion.
      *   *Connection:* Make sure to explicitly link "Common Knowledge" in MS to "Convention" in Keynes. MS: Common Knowledge $\rightarrow$ No Trade. Keynes: Common Knowledge (of fundamentals) Impossible $\rightarrow$ Convention $\rightarrow$ Trade persists.
      *   *Key Insight:* The No-Trade theorem assumes the price *reveals* information. Keynes argues the price *creates* reality (self-fulfilling convention). If price doesn't reveal fundamental value (because it's unknowable), the inference chain in MS breaks.

  7.  **Final Polish:** Check tone (academic, respectful, insightful). Ensure all parts of the prompt are addressed (Common Prior, Common Knowledge, Radical Uncertainty, Liquidity). (Self-check: Did I mention the 1937 QJE article? Yes. Did I mention Chapter 12? Yes.)

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a profound question that cuts to the epistemological heart of the divergence between neoclassical financial theory and the Keynesian tradition. You are correct to sense that the standard "resolutions" to the no-trade theorems (noise traders, heterogeneous priors) are essentially *parametric* adjustments within the Bayesian framework, whereas Keynes's objection is *structural* to the framework itself.

  If Keynes were confronted with the Milgrom and Stokey (1982) result, he would likely argue that the theorem is a logical tautology that holds only in a "closed system" (to use his terminology from the *Treatise on Probability*), whereas the actual economy is an "open system" characterized by radical uncertainty. His response would not merely be that traders lack a common prior, but that the very concept of a prior is incoherent regarding long-term asset yields.

  Here is how Keynes's specific arguments map onto the premises of the no-trade theorems, and why his challenge is deeper than the standard heterogeneous-priors resolution.

  ### 1. Radical Uncertainty vs. The Common Prior Assumption
  The Milgrom-Stokey theorem relies on the assumption that agents are Bayesian expected-utility maximizers. This requires that for every state of the world, agents can assign a probability.

  Keynes's 1937 *QJE* article ("The General Theory of Employment") and the *Treatise on Probability* attack precisely this requirement. He distinguishes between **risk** (where the probability distribution is known, like a roulette wheel) and **uncertainty** (where no scientific basis exists for forming a calculable probability).

  *   **The Standard Resolution:** Economists usually resolve no-trade by saying agents have *different* priors (heterogeneous priors). This keeps the Bayesian machinery intact; it just assumes $P_A(\theta) \neq P_B(\theta)$.
  *   **The Keynesian Resolution:** Keynes would argue that for long-term investment (the prospective yield of capital assets), $P(\theta)$ is undefined. It is not that Agent A thinks the probability is 0.6 and Agent B thinks it is 0.4; it is that the question "What is the probability of the yield of a railway over 20 years?" has no numerical answer.

  If the state space is unknowable, there can be no "Common Prior" to begin with, common or otherwise. The no-trade theorem collapses not because priors differ, but because the Bayesian updating mechanism—which drives the logic that "the offer to trade reveals information"—cannot operate on non-quantifiable uncertainty. You cannot update a probability distribution that does not exist.

  ### 2. Common Knowledge vs. Convention
  The no-trade theorems rely heavily on **Common Knowledge**. It must be common knowledge that traders are rational, and common knowledge that a trade is being offered. In Aumann and Milgrom-Stokey, common knowledge acts as a stabilizing force that aligns beliefs and eliminates speculative gain.

  Keynes turns this relationship on its head in Chapter 12 of the *General Theory*.
  *   **Keynes's View:** Because fundamental value is unknowable (see above), agents cannot anchor their beliefs on fundamentals. Instead, they anchor on **convention**. The convention is the assumption that the existing state of affairs will continue indefinitely, unless we have specific reason to expect a change.
  *   **The Conflict:** For Milgrom-Stokey, common knowledge of the trade offer leads to *no trade*. For Keynes, the *lack* of common knowledge of fundamentals leads to a *reliance on convention*, which facilitates trade.
  *   **The Beauty Contest:** This is the crucial link. The no-trade theorem assumes that if I know you are rational, I infer you know something I don't, so I cancel the trade. Keynes argues that in financial markets, I do not try to infer your information about *fundamentals* (because they are unknowable). I try to infer your opinion on *price*.
      *   If the game is to guess "average opinion," then your willingness to trade tells me nothing about the "true value" (since there is none), only about your guess of the psychological sentiment.
      *   Therefore, the signal contained in the "offer to trade" is not information about a fixed state $\theta$, but information about a moving target (market sentiment). This breaks the inference chain required for the no-trade theorem. The trade does not reveal a contradiction in beliefs about value; it reveals a difference in timing regarding the collapse of the convention.

  ### 3. Liquidity Preference and the Motive for Trade
  Milgrom and Stokey assume trade is motivated by risk-sharing or information asymmetry regarding the asset's payoff.

  Keynes introduces **Liquidity Preference** as a distinct motive rooted in uncertainty.
  *   In the Bayesian framework, holding cash is just holding an asset with a certain (low) return.
  *   For Keynes, holding cash is a refuge from the *ontological* uncertainty of the future. It is the premium paid for not having to commit to a decision in an unknowable environment.

  This bears on the no-trade theorem because it changes the utility function. If agents derive utility from the *option to exit* (liquidity) rather than just the terminal wealth distribution, then trade can occur even without information asymmetry. I might sell to you not because I think the price will fall (information), but because my liquidity preference has risen due to a loss of confidence in the convention. You might buy because your liquidity preference is lower.
  This is not "noise trading" in the sense of irrationality; it is rational behavior in the face of radical uncertainty where the "correct" holding period is indeterminate. The no-trade theorem assumes a terminal horizon or a specific consumption goal; Keynes argues the horizon itself is a source of anxiety that drives churn.

  ### 4. Animal Spirits and Rationality
  Finally, the no-trade theorems assume Common Knowledge of Rationality (CKR).
  Keynes's concept of **Animal Spirits** ("a spontaneous urge to action rather than inaction") is a direct challenge to the idea that economic action is always the result of a weighted average of quantitative benefits multiplied by quantitative probabilities.

  Keynes writes in the *General Theory*:
  > "Even apart from the instability due to speculation, there is the instability due to the characteristic of human nature that a large proportion of our positive activities depend on spontaneous optimism... enterprise only pretends to itself to be mainly actuated by the statements in its own prospectus."

  If action is driven by spontaneous optimism rather than calculated expected utility, the premise of the no-trade theorem (that agents are expected-utility maximizers) is violated. Keynes would argue that the sheer volume of trading is evidence that the "calculation" assumed by Milgrom and Stokey is a fiction. We trade because we must act, and action requires the suppression of the doubt that the no-trade theorem logically amplifies.

  ### Conclusion: A Category Error
  To answer your specific question: **Keynes's objection poses a deeper challenge than the standard resolutions.**

  The standard resolutions (noise traders, heterogeneous priors) accept the Bayesian map but argue the territory is messy. Keynes argues the map is wrong for the territory.
  1.  **On Priors:** He denies the existence of well-defined priors for long-term expectations (Radical Uncertainty), making the Common Prior assumption a category error, not just an empirical falsehood.
  2.  **On Common Knowledge:** He argues that because fundamentals are unknowable, common knowledge of value is impossible. Instead, we have a fragile *convention* of value. The no-trade theorem shows that common knowledge kills speculation; Keynes shows that the *absence* of knowledge (filled by convention) is the only thing that *allows* speculation to function without freezing the market entirely.
  3.  **On the Trade Signal:** In Milgrom-Stokey, the trade offer signals private info about a fixed truth. In Keynes, the trade offer signals a shift in the conventional valuation of an unknowable future.

  Keynes would likely view the no-trade theorems as a brilliant demonstration of why a market *cannot* function if it is composed of hyper-rational Bayesian agents facing radical uncertainty. The fact that markets *do* function (and trade voluminously) proves, for Keynes, that agents are not operating within the epistemic constraints of the theorem. They are relying on convention, animal spirits, and liquidity preferences to bypass the logical paralysis that the no-trade theorem correctly identifies as the consequence of pure Bayesian rationality under uncertainty.

  In short, Milgrom and Stokey prove that rational speculation is impossible. Keynes agrees, and adds: "That is why most market activity is not rational speculation in your sense, but a game of musical chairs based on convention."
