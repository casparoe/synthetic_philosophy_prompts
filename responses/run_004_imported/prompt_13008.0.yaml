          *   *Assessment:* Nozick explicitly rejects "desert" as a criterion for justice in holdings. He cares about *entitlement* (how you got it), not *desert* (whether you deserve it based on effort/moral worth). So, arguing Wilt doesn't *deserve* it misses Nozick's point. However, if the argument is that scarcity rents rely on state-enforced monopoly rules (league rules), it touches on the "rules of the game" (Objection 3). But as a standalone "desert" argument, Nozick has a ready reply: "I don't care about desert."
