prompt: |-
  I'm on the board of our small animal rescue (all volunteer, no city funding). A few years back we started putting our live release rate on every newsletter and grant application because that's the number our biggest donor and the state grant program actually care about, and its up around 97% now. Thing is, I've noticed we quietly stopped being open-admission -- we turn away alot of the "hard" cases now (old, sick, aggressive, the summer kitten litters) so they don't hurt the number, and most of those animals just end up at the county shelter, which still takes everything and still euthanizes. So our number looks amazing but I don't actually think fewer animals are dying overall, we just made sure it's not our paperwork that says so. We've also got a couple dogs that have been sitting in a cage here for two-plus years now instead of being put down, and honestly I'm not sure that's better for them either. Half the board wants to keep chasing the number since its in our mission statement and the donor asks for it by name every year; the other half (me included) thinks the number itself has become the problem, but nobody agrees on what we'd do instead. Can you write the memo I'd bring to the board meeting -- it needs to actually recommend something we can vote on, not just list pros and cons, and it has to take the "this is what our donors and mission care about" side seriously instead of just brushing it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Board member of a small, all-volunteer animal rescue (no city funding).
      *   **Problem:** The rescue prioritizes Live Release Rate (LRR) (currently 97%) to satisfy a major donor and state grants. To maintain this, they've effectively become limited-admission (turning away old, sick, aggressive, kitten litters), pushing those animals to the county shelter (which euthanizes). They also keep dogs in cages for 2+ years to avoid euthanasia, potentially compromising welfare.
      *   **Conflict:** Half the board wants to keep chasing the number (donor/mission alignment). The other half (including the user) thinks the number is the problem (Goodhart's Law in action).
      *   **Goal:** A memo for the board meeting.
      *   **Requirements:**
          *   Must recommend something specific to vote on (not just pros/cons).
          *   Must take the "donor/mission" side seriously (don't alienate the other half of the board).
          *   Must address the ethical/welfare concerns without being accusatory.
          *   Tone: Professional, persuasive, empathetic, strategic.

  2.  **Determine the Strategy:**
      *   *Acknowledge Success:* Start by validating the hard work and the impressive 97% LRR. This lowers defenses.
      *   *Reframe the Issue:* It's not about abandoning the metric; it's about ensuring the metric reflects *true* impact and welfare. The current strategy might be unsustainable or ethically risky long-term.
      *   *Address the "Hard" Cases:* Acknowledge the reality of resources vs. need. Shifting the burden to the county shelter is a valid concern but needs to be framed as a community impact issue, not just guilt.
      *   *Address Long-Term Care:* 2+ years in a cage is a welfare issue. This needs a policy change.
      *   *The Proposal:* Needs a middle ground. We can't just say "stop caring about LRR." We need to *expand* the metrics or *modify* the admission policy in a way that protects the rescue's viability while improving welfare.
      *   *Specific Recommendation:* A "Holistic Impact & Welfare Review." This involves forming a committee to revise admission criteria, define "humane care" limits (addressing the long-term dogs), and potentially diversifying metrics for donors (without lying).
      *   *Donor Management:* Propose a strategy to educate the donor rather than just defying them. Show them *more* value.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Subject Line:** Needs to be constructive. "Strategic Review of Admission Policies and Impact Metrics" sounds better than "We are killing animals indirectly."
      *   **Opening:** Celebrate the 97%. Acknowledge the donor relationship. This is crucial for buy-in.
      *   **The Challenge (The "Why"):** Gently introduce the unintended consequences. Use terms like "mission drift" or "welfare concerns." Mention the county shelter dynamic delicately (community responsibility). Mention the long-term kennel dogs (quality of life).
      *   **The Risk:** What happens if we keep going? Burnout, reputation risk, donor fatigue if they find out, ethical compromise.
      *   **The Recommendation:** This is the core.
          *   *Action 1:* Form a working group (not just the dissenters).
          *   *Action 2:* Review Admission Policy (Open vs. Limited vs. Managed).
          *   *Action 3:* Define "Humane Length of Stay" (address the 2-year dogs).
          *   *Action 4:* Metric Diversification (keep LRR but add welfare metrics).
          *   *Action 5:* Donor Communication Plan (how to talk to the big donor).
      *   **The Vote:** Make it clear what is being asked. Approval to form the committee and begin the review.
      *   **Closing:** Reiterate commitment to the mission.

  4.  **Refining the Tone:**
      *   *Avoid:* "We are lying," "We are bad people," "The donor is wrong."
      *   *Use:* "Unintended consequences," "Sustainable growth," "Aligning metrics with true welfare," "Stewardship of donor funds."
      *   *Key Concept:* Goodhart's Law (when a measure becomes a target, it ceases to be a good measure). I won't use the jargon, but I'll use the logic.
      *   *Addressing the County Shelter:* Frame it as "Community Safety Net." If we all push to the county, the county fails, and the community suffers.
      *   *Addressing the Long-Term Dogs:* Frame it as "Quality of Life" and "Sanctuary vs. Rescue." If we aren't a sanctuary, we need a policy.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too aggressive?
      *   *Fix:* Soften the language around the "turning away" part. Call it "Intake Triage."
      *   *Critique:* Is the recommendation specific enough to vote on?
      *   *Fix:* Yes, the vote is to authorize the Working Group and the Scope of Review.
      *   *Critique:* Does it respect the donor?
      *   *Fix:* Yes, it proposes *managing* the donor relationship, not cutting them off. It suggests showing them *more* impact, not less.

  6.  **Final Polish:** Check formatting, ensure clear headings, and make sure the "Ask" is bolded at the end. (This matches the thought process to the final output).

  7.  **Final Output Generation:** (Proceed to generate the memo based on these steps.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Rescue Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Strategic Review of Intake Policies and Impact Metrics

  **Executive Summary**

  Over the past few years, [Rescue Name] has achieved an incredible milestone: a 97% Live Release Rate (LRR). This metric has secured vital funding from our major donor and the state grant program, allowing us to operate without city funding. This success is a testament to the hard work of every volunteer on this board.

  However, as we steward this organization, we must ensure that our metrics serve our mission, rather than our mission serving our metrics. Recent internal observations suggest that our current drive to maintain the 97% LRR may be creating unintended consequences regarding animal welfare, community impact, and resource allocation.

  This memo proposes a structured review of our intake and care policies. The goal is not to abandon the LRR, but to ensure it remains a valid indicator of success while addressing ethical concerns regarding long-term confinement and community safety nets.

  **Current Situation & Risks**

  We are currently facing three specific challenges that threaten our long-term sustainability and ethical standing:

  1.  **Intake Triage vs. Mission Drift:** To protect the LRR, we have informally shifted toward limited admission, redirecting "harder" cases (geriatric, medically complex, behavioral, and seasonal kitten surges) to the county shelter. While this protects our numbers, it effectively outsources euthanasia to the municipal system. If our mission is to reduce animal death in our community, we must acknowledge that shifting the location of that outcome does not reduce the outcome itself.
  2.  **Quality of Life for Long-Term Residents:** We currently house several dogs that have been in kennels for over two years. While sparing them from euthanasia aligns with the LRR, we must ask if indefinite confinement aligns with *welfare*. There is a distinction between a "rescue" and a "sanctuary," and our current infrastructure is designed for the former.
  3.  **Donor & Grant Dependency:** Our funding model relies heavily on a single metric. If our major donor or the state discovers that our high LRR is achieved through restrictive intake rather than successful rehabilitation, we risk reputational damage and funding loss.

  **Proposal: The "Impact & Welfare" Working Group**

  I am not proposing we immediately change our admission policy or stop reporting the LRR. Sudden changes could jeopardize our funding. Instead, I recommend we vote to form a **Strategic Impact Working Group** tasked with developing a sustainable path forward over the next 90 days.

  **Scope of Work for the Working Group:**

  1.  **Define "Humane Length of Stay":** Develop a policy for animals in care longer than 18 months. This policy should evaluate quality of life, foster availability, and sanctuary options. We need a compassionate exit strategy for animals that are not thriving in kennel environments, even if they are adoptable.
  2.  **Intake Tiering System:** Instead of a binary "open/closed" door, propose a tiered intake system. We can maintain our 97% LRR on our "Core Program" (adoptable/treatable) while creating a separate "Community Safety Net" track for high-risk animals. This allows us to track outcomes separately so one does not penalize the other.
  3.  **Metric Diversification Plan:** Prepare a supplemental report for our major donor and the state. We will continue to report the 97% LRR as required, but we will *add* metrics that show deeper impact, such as "Community Retention Rate" (animals kept in homes via support) or "Welfare Scores." The goal is to educate the donor that *saving the hardest cases* is a higher value than *saving only the easy cases*.
  4.  **County Partnership Exploration:** Investigate if we can formalize a transfer agreement with the county shelter for specific high-risk cases, rather than an informal turn-away policy. This allows us to claim those saves on our paperwork legitimately.

  **Recommendation for Vote**

  I move that the Board authorizes the formation of the **Strategic Impact Working Group**, comprised of three board members (representing both the "metrics-focused" and "welfare-focused" perspectives) and one senior volunteer.

  **The Working Group is authorized to:**
  *   Draft the "Humane Length of Stay" policy for board approval by [Date, e.g., Q1 2024].
  *   Develop the "Tiered Intake" proposal.
  *   Schedule a meeting with our major donor to present the expanded metric report.

  **Why This Approach?**

  *   **It Protects Funding:** We are not telling the donor we are stopping the LRR; we are telling them we are deepening the impact of their investment.
  *   **It Protects the Animals:** It addresses the welfare of the dogs in long-term care without mandating immediate euthanasia, allowing for case-by-case review under a new policy.
  *   **It Protects the Board:** It moves us from informal, quiet decisions about intake to a formal, voted-upon policy that aligns with our true mission.

  **Conclusion**

  We built this rescue to save lives. A number on a spreadsheet is a tool to measure that, but it is not the life itself. By approving this review, we ensure that [Rescue Name] remains a leader in animal welfare not just because of our statistics, but because of the integrity of our care.

  I ask for a vote to authorize the Working Group at the next meeting.

  **[Your Name]**
  Board Member, [Rescue Name]
