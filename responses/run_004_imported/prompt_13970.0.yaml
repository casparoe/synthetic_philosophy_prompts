answer: |-
  Five years. When I look at this chip, I don't just see time passed. I see work done.

  We all know what the years before this looked like. I know better than most. For a long time, I walked around this family with a kind of quiet protection. When things went wrong, when promises were broken, when money disappeared or holidays were ruined, I told myself: *It's the sickness. He can't help it.*

  I think I did that to survive. If I viewed you as someone who couldn't choose differently, then I didn't have to be so hurt by the choices you made. I stopped expecting anything from you. In a way, I stopped treating you like my brother and started treating you like a problem to be managed, or a patient to be cared for. I kept you safe from my anger, but I also kept you at a distance from my love.

  But that isn't a relationship. That's just caretaking.

  What these last five years have shown me is that sobriety isn't just about staying clean. It's about coming back into the room as a person who can answer for himself. It's about looking someone in the eye and saying, *I did that, and I'm sorry,* and then changing the behavior.

  You have done that work. You've made the amends. You've shown up. And because you've done that, something has shifted for me. I don't have to protect myself by lowering my expectations anymore. I don't have to write things off to the disease.

  And I want you to know what that means. It means I trust you again. But it also means I hold you accountable again.

  It means that if you're late for dinner now, I'm not going to wonder if you're using; I'm just going to be annoyed that you're late. If you forget to call, I won't worry you're in trouble; I'll just feel neglected. And honestly, that is a gift.

  The greatest respect I can offer you is to treat you like everyone else at this table: as someone capable of keeping their word, and someone capable of breaking it. You have earned back the right to be part of the ordinary give-and-take of this family. You have earned the standing to be thanked, to be loved, and yes, even to be resented in the ordinary way again.

  You're back in the game, brother. And we are so glad you're here.

  Cheers.
