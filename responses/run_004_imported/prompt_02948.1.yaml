      *   **Source Material:** Primarily *Ecce Homo* ("Why I Am So Clever," diet/climate/recreation), *On the Genealogy of Morals* (Ascetic Ideal), potentially *Twilight of the Idols* (Socrates/Decadence).
      *   **Task:** Defend *one* reading (extension of self-experimentation OR form of ascetic ideal) or propose a nuanced synthesis.
