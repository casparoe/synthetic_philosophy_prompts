answer: |-
  **Title:** The Priesthood of the Glucose Monitor: Nietzsche, Biohacking, and the New Asceticism

  If Friedrich Nietzsche were to scroll through the Twitter feed of Bryan Johnson, the tech entrepreneur currently spending two million dollars a year to reverse his biological age, he would likely recognize the symptoms immediately. The obsession with metabolic data, the regimented sleep protocols, the elimination of "toxins"—on the surface, this mirrors the opening sections of *Ecce Homo*, where Nietzsche declares that "questions of nutrition, climate, and recreation" are more consequential than any metaphysical system. However, to view modern biohacking as a simple vindication of Nietzsche's physiological self-experimentation is to mistake the *method* for the *motive*. While Nietzsche agrees with the biohacker that the body is the starting point of philosophy, he would ultimately diagnose the longevity-optimization culture not as a path to "Great Health," but as a technological transfiguration of the **Ascetic Ideal**.

  To understand why, we must first acknowledge where Nietzsche and the biohacker converge. In "Why I Am So Clever," Nietzsche insists that philosophy is not a matter of abstract reasoning but of "blood and physiology." He details his own battles with migraines and digestion, noting that a single heavy meal could cost him a day of thought. He writes, "I have a subtler feeling for the signs of upward and downward development than any other human being before me." In this sense, the Continuous Glucose Monitor (CGM) is a tool Nietzsche might have admired for its precision. He would agree with the premise that a sluggish metabolism produces sluggish thought, just as he argued that beer and heavy German cuisine produced a "mental sluggishness" incompatible with intellectual agility. He even engaged in his own form of supplementation, advocating for specific mineral waters and rejecting the vegetarianism he briefly adopted in Wagner's circle because it left him feeling "weak" and deprived him of the "strength" necessary for his work.

  However, the divergence lies in the *teleology* of the optimization. For Nietzsche, physiological regulation is strictly instrumental; it is a means to the end of creative expenditure. In *Ecce Homo*, he frames his dietary choices as a form of warfare: "I wage war against the anaemia of the will." He eats and breathes in specific ways not to preserve his life indefinitely, but to ensure he has the vigor to discharge his philosophical mission. He writes, "My formula for greatness in a human being is *amor fati*... not merely bear what is necessary, still less conceal it... but *love* it."

  Modern longevity culture, by contrast, is often driven by a resentment of necessity itself—specifically, the necessity of decay and death. This is where Nietzsche would identify the shadow of the *Genealogy of Morals*. In the Third Essay, Nietzsche describes the Ascetic Ideal as "life turned against life." The ascetic priest preserves the sick by regulating their habits, giving them a sense of control over their suffering, but ultimately, this preservation is in service of nothing but *more life*. The biohacker who seeks to minimize their "biological age" is engaging in a secularized version of this priestly function. They treat the body not as a destiny to be affirmed, including its eventual decline, but as a machine to be fixed, a site of guilt where every spike in glucose is a sin against the self. Nietzsche warns in *Twilight of the Idols* against the "decadent" who cannot resist stimuli and seeks to immobilize life to protect it. The extreme biohacker, rigidly avoiding all stressors and metabolic fluctuations, risks becoming the ultimate decadent: one who preserves the vessel so meticulously that there is no wine left to pour.

  Furthermore, Nietzsche would critique the universalism inherent in the biohacking movement. In *Ecce Homo*, he is scathing about the idea of a "good in itself" regarding diet. "There is no such thing as a 'good' meal," he argues; "what is good for one is poison for another." He rejected vegetarianism not because meat is objectively superior, but because *his* specific constitution required it to maintain his fighting spirit. He writes, "A writer who has nothing to say has no style... a man who has nothing to conceal has no morality." Similarly, a physiology that has nothing to risk has no health.

  Biohacking culture, however, tends toward a new moralism. It posits an objective "optimal" state (e.g., fasting glucose of 70, biological age of 18) that applies to all high-performing individuals. This creates a new priesthood of experts and data, dictating terms to the individual. Nietzsche would argue that this ignores the concept of *type*. What constitutes "Great Health" (*die große Gesundheit*) for a philosopher like Nietzsche—who needed periods of illness to gain perspective on health—might be disaster for a different type. By turning physiology into a moral imperative governed by external metrics rather than internal instinct, biohacking replicates the structure of religious morality: obedience to a law outside oneself.

  Finally, Nietzsche would question the reliance on external data over instinct. In *Ecce Homo*, he claims, "I never ask 'what is that?' I only ask 'is that good for me?'" He trusted his "nose" for what was beneficial. The biohacker's reliance on the CGM suggests a profound distrust of the body's own signals. For Nietzsche, this disconnect is a symptom of modernity's alienation from the self. If one requires a machine to tell them they are nourished, they have lost the "guiding thread of the body" (*Leitfaden des Leibes*). This externalization of authority is the hallmark of the ascetic priest, who tells the sufferer, "You are sick because you are guilty (of eating sugar, of sleeping late)," and offers a ritual (the supplement stack, the fasting protocol) as absolution.

  In conclusion, Nietzsche would not see Bryan Johnson as a kindred spirit, but as the latest avatar of the ascetic priest. While they share the insight that physiology conditions thought, Nietzsche's self-experimentation was an act of **affirmation**, designed to maximize the intensity of life, even at the cost of longevity. The biohacker's optimization is an act of **preservation**, designed to minimize the risk of death. Nietzsche would likely argue that in trying to hack the body to avoid decay, the longevity optimizers are merely perfecting the art of living in a way that avoids the very struggles that make life potent. They are not pursuing the "Great Health" that allows one to overcome illness and risk; they are pursuing a sterile immortality that, in Nietzsche's eyes, would be indistinguishable from death. As he wrote in *The Gay Science*, "The total appearance of life is not the appearance of health... the phenomenon of life is essentially appropriation, injury, overpowering of the strange and weaker." To optimize the body solely for survival is to deny the fundamental, predatory, creative nature of life itself.
