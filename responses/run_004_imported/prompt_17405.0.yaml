answer: |-
  **Title:** The Whole Elephant
  **Occasion:** Eulogy for a Father and Teacher
  **Setting:** Jain Temple Hall

  Namaskar. Thank you all for being here.

  Looking out at this room, I see two families. On one side, I see the temple family. You know the sound of my father's voice. You know the scratch of the chalk on the blackboard, the way he would tap his fingers when he was thinking, and the specific weight he gave to certain words. On the other side, I see his coworkers, his friends, my in-laws, people who knew him as a colleague, a neighbor, a dad. You might be hearing the word *anekantavada* for the first time today.

  I am standing here to talk about a man who spent thirty years teaching children that truth is not a single point, but a vast geometry. And so, in his honor, I cannot give you a eulogy that tries to flatten him into a single story. I cannot tell you he was simply kind, or simply difficult, or simply wise. Because he taught me that to do so would be a lie.

  For those of you who are new to his philosophy, my father lived by a Jain principle called *anekantavada*. Roughly, it means "many-sidedness." It is the idea that reality is complex, and that any statement about truth is only true from a specific angle, at a specific time, under specific conditions.

  Now, I need to be careful here. There is a version of this idea that people often use in the secular world. You might have heard it: "Well, truth is relative," or "It's just your point of view, who's to judge?"

  My father could not stand that. He would hear someone say that and his eyes would narrow. He believed that reducing *anekantavada* to "nothing is really true" was itself a flat, one-sided claim dressed up as open-mindedness. To him, saying "it depends" was never the end of a conversation. It was the start of an argument. It was an invitation to do the hard work. It meant: *If your angle is different from mine, we cannot just walk away. We have to climb over to your side and look through your eyes, and then you must come to mine, so that together we might see the whole elephant.*

  He brought this rigor to this temple hall for thirty years. He didn't teach children to be passive. He taught them to be precise. He taught them that if you claim to know the truth, you owe it to the world to specify *which* truth you are holding.

  But, because I am trying to honor him honestly, I also have to talk about the man, not just the teacher. And the truth of the man had angles that were sometimes sharp.

  My father was stubborn. There is no gentle way to say it. He was slower to admit fault in himself than he was in anyone else. There were times when he was so committed to the principle of holding his ground that he forgot to check if his ground was shifting. There were dinners where the conversation turned into a debate, and debates that turned into stalemates, because he was waiting for the rest of us to walk around to his angle, while he remained planted firmly in his own.

  I think he would want me to say this. He would not want to be sanctified today. He would not want us to pretend he was perfectly open-minded if he wasn't. In fact, his stubbornness was the shadow side of his conviction. He cared so deeply about the integrity of an idea that he sometimes defended his own angle as if it were the whole structure. That was his flaw. It was part of his many-sidedness. And I loved him for his conviction, even when I bruised myself against it.

  To his students here: You know that he didn't offer this philosophy as a comfort. He offered it as a discipline. But today, in our grief, I find that discipline is actually where the comfort lies.

  Grief is not one thing. It is not just sadness. If we apply my father's logic to this moment, we can see that grief, too, has many sides. There is the angle of loss, which is heavy and dark. But there is also the angle of gratitude, which is light. There is the angle of anger that he is gone, and the angle of relief that he is no longer suffering. There is the memory of his stubbornness, and the memory of his generosity.

  If we try to force ourselves to feel only one of these, we fail. We flatten the reality. My father taught us that we are allowed to hold contradictory truths at the same time. We can miss him terribly and be glad he lived a long life. We can be frustrated by his flaws and be in awe of his mind. All of it is true. None of it cancels out the rest.

  To his coworkers and friends who are hearing this for the first time: You don't need to become Jains to carry this forward. You just need to remember how he listened. Or, when he didn't listen, remember how he challenged you to be more precise in what you said. He wanted us to be better thinkers so that we could be better people. He believed that most conflicts happen because we are shouting our partial truths at each other, mistaking them for the whole.

  So, how do we say goodbye to a man who taught us that no statement is final?

  We don't.

  We do not close the book on him today. We do not say, "He was this," and sit down. Instead, we carry his angles forward. When you disagree with someone this week, I hope you hear his voice. I hope you resist the urge to say, "You're wrong." I hope you hear him saying, "Tell me where you are standing. Show me your angle."

  And when you think of me, or of his other children, please know that we are seeing him from an angle you cannot see. We see the kitchen table. We see the quiet moments. We see the flaws. And when you think of him, you see the teacher, the colleague, the friend.

  None of us has the whole picture. But if we put our memories together, if we share our angles without fighting over who holds the definitive truth, perhaps we can reconstruct something like the man he actually was.

  He taught us that "it depends" is the beginning of the work. So, the work continues. The argument continues. The looking continues.

  Thank you, Papa, for teaching us how to look. And thank you all for helping us see.

  Namaskar.
