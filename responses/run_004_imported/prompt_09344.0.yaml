answer: |-
  **DR. ARIS:** Let's be precise. Meg knows your character never existed. She knew it while reading. Therefore, she cannot believe the proposition "this person has died." Without belief, there is no object for genuine grief. What she felt was quasi-grief. A prop in a game of make-believe.

  **DR. BENNETT:** Tell that to her tear ducts. Salty water doesn't care about ontology. The physiology of her response—the lump in the throat, the chest tightness—is identical to the physiology of mourning her actual grandmother. If it walks like grief and cries like grief…

  **ARIS:** …it isn't necessarily grief. Consider Charles watching the slime monster. He screams, his adrenaline spikes, but he doesn't flee. He doesn't call the police. He stays in his seat. We say Charles feels "quasi-fear" because the action tendencies essential to fear are absent. Meg didn't try to revive your character. She didn't call 911. She had brunch.

  **BENNETT:** You're conflating *helplessness* with *fake emotion*. If I watch a real person die in a hospital bed without the power to save them, I feel genuine grief despite my inability to act. The difference isn't in the feeling, Aris, it's in the cause. Thought Theory says entertaining the thought of loss is sufficient to trigger the ordinary emotion. Belief isn't the switch; imagination is.

  **ARIS:** But in the hospital case, the inability is contingent. You *could* call a doctor, even if it's too late. With fiction, the inability is logical. There is no one to call. Meg's sadness lacks the cognitive commitment that defines the emotion. She is pretending to be sad, much like a child pretends to be a pirate. The cortisol is real, yes, but the state of mind is simulated.

  **BENNETT:** Simulated? That implies voluntarism. Did Meg choose to cry? Could she have simply decided to stop the "simulation" when the chapter ended? If I pinch you, your pain is real even if I tell you it's "just a pinch." The phenomenology is the evidence. Who gets to adjudicate the reality of her pain? You, with your checklist of action tendencies? Or Meg, who felt her heart break?

  **ARIS:** Phenomenology is notoriously unreliable. Dreams feel real until you wake up. If we define emotion solely by internal feeling, we lose the distinction between rational and irrational responses. Radford called it irrational; I call it make-believe. If we call Meg's grief "ordinary," we must admit she is irrational—grieving for nothing. If we call it quasi-grief, she is playing a game successfully.

  **BENNETT:** Or we admit that human beings are wired to respond to narratives, not just facts. You want to protect the definition of "grief" by excluding the very thing that makes it useful: its capacity to be moved by representation. If Meg's tears aren't real grief, then art cannot move us. It can only trick us.

  **ARIS:** Art *does* trick us. That's the magic. But don't confuse the trick with the reality. She isn't grieving a death; she's grieving the *representation* of a death. The object determines the emotion.

  **BENNETT:** And the body determines the experience. You're arguing from the outside in; I'm arguing from the inside out. We're looking at the same tear, Aris. You see a prop; I see a symptom.

  **ARIS:** And neither of us can wipe it away for her.

  **BENNETT:** No. But only one of us thinks she's actually sad.

  **ARIS:** Only one of us thinks she knows what sadness is.

  **BENNETT:** Then we're at an impasse.

  **ARIS:** We're at the paradox.
