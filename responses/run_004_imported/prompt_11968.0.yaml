answer: |-
  The ink on the page was still wet when Elias Thorne signed his name. It was a heavy stroke, a physical commitment. He had written a confession. Not a legal one, but a moral one. He had mismanaged the trust funds for the orphanage, not through theft, but through a cowardly negligence he could no longer bear to carry before God. To sign this was to stand alone. It was to become, in the terrifying sense, a Single Individual.

  He took the paper to the office of *The Daily Mirror*. He did not want fame; he wanted the friction of reality. He wanted the consequence of his action to hit him squarely, so he might learn to stand.

  The editor, Mr. Vane, was a man composed of soft edges and spectacles. He read the confession without blinking.

  "Passionate," Vane said, folding the paper. "Very earnest. But you understand, Mr. Thorne, we do not publish earnestness. We publish interest."

  "I am taking responsibility," Elias said, his voice tight. "I wish to state my failure so that I might amend it."

  "Responsibility is a heavy coat for a Tuesday," Vane smiled, tapping the desk. "You wish to speak to the city? The city cannot hear you. The city is a myth. We serve *The Public*. And The Public does not want amendment. It wants comparison."

  Elias left the paper there. He felt a chill that had nothing to do with the weather. He had offered a sacrifice, and the priest had told him the altar was out of order.

  The next morning, Elias went to the Grand Reading Room. He needed to see the impact. He needed to feel the sting of judgment, for in that sting, he believed, was the proof of his own existence. To be judged was to be real.

  The room smelled of roasted chicory and damp wool. Dozens of men sat in high-backed chairs, obscured by broadsheets. Elias stood by the pillar, watching. He saw a merchant unfold *The Mirror*. He saw the page turn. He saw the merchant's eyes scan Elias's confession.

  This was the moment. The collision of one soul with another.

  The merchant lowered the paper. He did not look angry. He did not look moved. He looked to the man beside him, a lawyer with a silver watch chain.

  "Thorne," the merchant said. "The orphanage fellow."

  "Ah," the lawyer said, not looking up from his own sheet. "I heard there was trouble there."

  "I thought he was pious," the merchant mused.

  "Seems he's just like the rest of us, then."

  "Level," the lawyer murmured. "Perfectly level."

  They went back to reading. There was no anger. There was no demand for restitution. There was only a mild, reflective satisfaction. Elias felt a hollowing in his chest. He had expected a blow, but he had received a shrug. His specific sin, his specific pain, his specific resolution to God—it had been sanded down. It was no longer a jagged truth; it was a smooth topic. It was fodder for the chatter.

  Elias stepped forward. "Gentlemen," he said. "I am Thorne. I am here to say that I intend to repay every cent."

  The merchant looked up, mildly annoyed by the interruption of the flow of information. "Of course, of course. One must do these things."

  "But do you not see?" Elias pressed, his voice rising. "This is not a story. This is my soul. I am standing here."

  The lawyer finally looked at him. "We are reading, sir. The paper has summarized the situation. We have an opinion on it now. That is sufficient."

  "That is nothing!" Elias cried. "You hold opinions without acting. You judge without standing. You are hiding!"

  The room went quiet, but it was not the silence of reverence. It was the silence of a machine pausing. A dozen faces turned toward him. But they were not looking at *him*. They were looking at a disturbance in the atmosphere. They were not individuals confronting a man; they were a sample size analyzing an outlier.

  "He's quite agitated," someone whispered from the back.

  "Typical," said another. "Guilty men always want a scene. It validates them."

  Elias saw it then. The mechanism Vane had spoken of. The press had not communicated his truth; it had abstracted it. By making his confession available to everyone, it had made it the property of no one. The Public was a phantom body, vast and headless. It could smell blood but could not bite. It could whisper but could not speak.

  In the crowd, no one was responsible. If the merchant insulted him, he could say he was only repeating what the paper implied. If the lawyer judged him, he was only reflecting the general mood. They were all hiding in the "we."

  Elias realized his spiritual error. He had sought validation from the world, thinking that public judgment would anchor him to reality. But the world was a mirror hall. He was shouting at reflections.

  To stand before God, he understood now, required that he stop shouting at the crowd. The crowd was untruth. The crowd was a lie told by men afraid of the silence where God speaks.

  He looked at the merchant, the lawyer, the men hiding behind their papers, safe in their shared, anonymous indifference. They were leveled. No one was high enough to inspire envy, no one low enough to inspire pity. They were a lukewarm sludge of reflection.

  Elias took off his hat. He did not bow. He turned and walked out of the Reading Room into the wind.

  He would repay the money. He would confess to the board. He would suffer the penalty. But he would do it in silence. He would not feed the phantom. He would not let his passion become their amusement. He would have to bear the weight of being One, alone, without the comfort of the crowd's attention, even in condemnation.

  Behind him, the Reading Room resumed its hum. The paper was passed to a new hand. The opinion was digested, forgotten, and replaced by the next. The Public remained, hungry and formless, waiting for the next piece of a soul to grind into dust. Elias walked on, shivering, finally warm in the knowledge that he was the only one there who existed.
