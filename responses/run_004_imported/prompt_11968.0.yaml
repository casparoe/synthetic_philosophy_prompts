  2.  **Deconstruct "Leveling":**
      *   What is it? It's not just making everyone equal; it's dragging excellence down to the lowest common denominator through envy and reflection.
      *   How does it work? Through gossip, the press, and "chatter." No one takes responsibility. "The Public" is a monster that is everywhere and nowhere.
      *   The Spiritual Angle: To become a "Self" requires passion, choice, and standing before God. The crowd allows you to hide. Leveling prevents the rise of the Single Individual.

