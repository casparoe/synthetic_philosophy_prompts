  3.  **Key Philosophical Points to Cover:**
      *   **Russell's Analysis:** $\exists x (Kx \land \forall y (Ky \rightarrow y=x) \land Bx)$. If no $K$, the conjunction is false.
      *   **Strawson's Objection:** "The King of France is bald" presupposes existence. If no King, the statement is neither true nor false (misfire).
      *   **The Scope Objection (User's Friend's point):** Scope handles negation ("The King is *not* bald"), but fails on the positive assertion.
      *   **The Pragmatic Turn (Grice/Neo-Russellian):** Existence is an implicature or a pragmatic presupposition, not a semantic entailment. The sentence *is* false, but asserting it is misleading/infelicitous.
      *   **Strawson's Counter to Pragmatics:** The intuition isn't just about infelicity; it's about the conditions for making a statement *at all*.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the stage. Acknowledge the classic debate but focus on the specific "unnegated" crux.
