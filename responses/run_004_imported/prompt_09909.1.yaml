  I told my advisor, "We're logically trapped. I know you think the chapter is incomplete ($p=0$). You know I think it's done ($p=1$). We've emailed enough that these posteriors are **Common Knowledge**—I know you know, you know I know, *ad infinitum*. By Aumann, we're forced to converge. We literally cannot agree to disagree. Sign the form."

  He took off his glasses and said, "The theorem holds. But you're violating the boundary condition. We don't have a **Common Prior**."

  "We read the same literature," I said.

  "Not about the literature," he said. "About *you*. My prior was that you'd finish in Year 3. Your prior was that Year 3 has infinite support."
