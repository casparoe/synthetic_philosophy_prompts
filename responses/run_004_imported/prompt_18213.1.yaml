answer: |-
  Good evening. For those who don't know me, I'm the older sibling. I'm a novelist. Which means my job is to make things up and convince people they're true. My sister's job, as many of you know, was to spend five years analyzing why it's logically absurd to say, "It is raining, but I don't believe it."

  So, she gave me very specific instructions for this toast. She said, "Do not tell me you *know* how happy I'll be. Do not tell me you *know* we'll be together forever. Because you don't know that. And if you say you do, you're lying, and I will wince."

  She's right. As a writer, I deal in truths, but I also deal in uncertainty. And as a philosopher, she deals in the limits of what we can claim to know. So, I have spent the last week trying to write a toast that contains zero Moorean paradoxes. No asserting things I cannot verify. No claiming knowledge of the future.

  It's harder than it looks. Because weddings are basically factories for Moore's Paradoxes. "I know you'll be happy!" (You don't know that). "This is the best day ever!" (You can't verify that until the day is over).

  So, I'm going to be careful. I'm not going to tell you that I *know* your marriage will be easy. I don't know that. I'm not going to tell you that I *know* you'll never fight. I don't know that.

  But here is the joke, and for my sister's friends in the back, this one is for you. I want to make a claim that is structurally identical to "It is raining, but I don't believe it."

  I want to say: **"I believe this marriage will last forever, but I don't believe in forever."**

  (A pause for the philosophers to smile).

  Here's what I mean. I don't believe "forever" is a unit of time we can measure. I don't believe anyone can promise me a decade, let alone a lifetime. "Forever" is a word we use when we can't see the end of the sentence.

  But.

  I believe in *now*. I believe in the way [Partner's Name] looks at her when she's explaining something she loves. I believe in the way she laughs at his jokes, even the ones I've heard a hundred times. I believe in the resilience I've seen in this room, and the kindness that brought you all here.

  So, I don't believe in "forever" as a guarantee. But I believe in *you* as a force.

  There is a concept my sister studied called a "blindspot." A truth that is real, but that you cannot see from where you're standing. There are joys in your future that are currently blindspots for you. You literally cannot believe them yet, because you haven't lived them. You can't imagine the comfort of a quiet Tuesday night five years from now. You can't conceive of the strength you'll find in each other during a hard year.

  Those truths exist. They are waiting. But you can't believe them yet.

  That's my job. That's the job of everyone in this room. To hold the belief in your happiness until you're close enough to see it yourselves.

  I don't know what your story will look like in chapter ten. I'm a novelist; I know plots twist. But I know the characters. I know the voice. And I know that when you two are in the same room, the story makes sense.

  So, I won't say I know you'll be happy. I'll say this: You are together. That is true. I believe that. And I believe that as long as you keep telling the truth to each other—even the uncomfortable, non-paradoxical truth—you will be just fine.

  To the bride and groom.
