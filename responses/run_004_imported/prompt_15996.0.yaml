      *   **Core Thesis:** The "Complexity Rescue" fails because complexity is not an intrinsic property of the physical system; it is relative to a descriptive framework.
      *   **Argument 1: The Relativity of Kolmogorov Complexity.** Explain that "simplicity" depends on the universal Turing machine (UTM) used to measure it. By changing the UTM (the "decoder"), you can make any mapping look simple.
      *   **Argument 2: The Basis/Granularity Problem.** Physical states aren't pre-individuated. Are we counting atoms, quarks, or field values? The choice of granularity determines the state space size, which determines the complexity.
      *   **Argument 3: The Decoder is the Computer.** If the mapping requires computation to decode, the *decoder* is the computer, not the rock. The rock is just storage. This shifts the implementation to the observer.
      *   **Argument 4: Anthropocentrism.** If "simple mapping" means "simple for *humans* to find," then computationalism is about human psychology, not the nature of mind.
      *   **Argument 5: Causal Structure vs. State Mapping.** Functionalism relies on causal roles. Complexity constraints on mapping don't guarantee the physical system *causally* mirrors the computational transitions in the right way without begging the question.
      *   **Conclusion:** Summarize that complexity adds a pragmatic filter, not an ontological fix.

  5.  **Refining the Arguments (Self-Correction/Nuance):**
