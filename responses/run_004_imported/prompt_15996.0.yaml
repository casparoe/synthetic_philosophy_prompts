prompt: |-
  Me and my friend got into a whole thing last night about that "does a rock implement every computer program" argument against functionalism -- Putnam's old proof that you can map basically any physical system onto any finite-state machine if your mapping is gerrymandered enough, plus the Searle bit about the wall behind him "running" WordStar. My friend's really into Scott Aaronson and kept arguing that computational complexity is what actually rescues computationalism here: sure, you can cook up some crazy mapping from a waterfall's molecules onto the states of a mind-program after the fact, but decoding that mapping back into anything usable would take as much computation as just running the mind-program yourself, so the waterfall isn't doing any real work, and only mappings that are cheap to compute should count as genuine implementations. I dont buy it -- "cheap to compute" is only cheap relative to some choice of which physical variables count as the basic states in the first place, and you get to pick that basis after the fact too, so it just feels like the same arbitrariness got moved down one level. We argued about it for like an hour and got nowhere. Can you make the strongest possible case for my side -- that bringing complexity theory into the trivial-realization debate doesn't actually save functionalism from Putnam and Searle, it just relocates the same problem?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The "trivial realization" argument against functionalism/computationalism (Putnam's rock/waterfall argument, Searle's wall/WordStar).
      *   **The Debate:** User vs. Friend.
      *   **Friend's Position (Aaronson-style):** Computational complexity rescues computationalism. A physical system only implements a computation if the mapping from physical states to computational states is "easy" (low complexity) to compute. A waterfall's mapping is too hard to compute, so it doesn't count.
      *   **User's Position:** Complexity theory doesn't solve the problem; it just relocates the arbitrariness. "Cheap to compute" depends on choosing a basis/representation, which is itself arbitrary/gerrymanderable.
      *   **Task:** Make the *strongest possible case* for the *User's side* (that complexity theory fails to save functionalism).

  2.  **Deconstruct the Core Arguments:**
      *   **Putnam/Searle (The Attack):** Any physical system has enough states to map onto any finite state machine (FSM) *if* the mapping is sufficiently disjunctive/arbitrary. Therefore, "implementation" is trivial, and functionalism loses its explanatory power (pancomputationalism).
      *   **Aaronson/Chalmers (The Defense):** We need constraints on the mapping. The mapping must be "simple" or "natural." Computational complexity provides a rigorous metric: if decoding the physical state to find the computational state requires more work than the computation itself, the physical system isn't *really* implementing it.
      *   **The User's Counter (The Target):** The metric of "simplicity" or "complexity" relies on a prior choice of vocabulary/basis. If I can choose *any* physical variable to represent a bit, I can make the complexity look low or high at will. The arbitrariness isn't eliminated; it's just shifted to the choice of the "reading frame."

  3.  **Brainstorming Arguments for the User's Side:**
      *   *The Basis Problem:* Complexity is relative to a description language. Kolmogorov complexity is machine-dependent (up to a constant). If the constant is large enough (i.e., if the decoder is complex), the argument collapses.
      *   *The "God's Eye" View:* To measure the complexity of the mapping, you need to already know the physical states. But physical states are theory-laden. Are we counting molecules? Quantum fields? Coarse-grained regions?
      *   *The Homunculus/Decoder Issue:* If the mapping requires a decoder, where is the decoder? If the decoder is external (us looking at the rock), then the rock isn't computing; *we* are. If the decoder is internal, does the rock contain the decoder?
      *   *Time and Causality:* Putnam's original argument often ignores causal structure. But complexity arguments often focus on state counting. Even with causal structure, if the mapping is arbitrary, the causal links can be mapped arbitrarily too.
      *   *Pancomputationalism returns:* If "low complexity" is defined relative to human interests or human-scale physics, then computationalism becomes anthropocentric, not ontological.
      *   *The "Look-Up Table" Objection:* A giant look-up table implements any function. It's $O(1)$ lookup. Is a giant look-up table a mind? Complexity says yes (fast lookup). Intuition says no (no processing).
      *   *Semantic vs. Syntactic:* Complexity deals with syntax. Implementation requires semantics (aboutness). Complexity doesn't fix the symbol grounding problem.

  4.  **Structuring the Response:**
