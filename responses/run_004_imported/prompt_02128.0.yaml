prompt: |-
  so for my ethics elective we got assigned this excerpt from Augustine's "On Lying" (the actual old text, not some summary) and i'm kinda stuck on part of it. he's building up to the question of whether you're ever allowed to lie to protect someone, and he throws out this scenario:

  "What then, if a homicide seek refuge with a Christian, or if he see where the homicide have taken refuge, and be questioned of this matter by him who seeks, in order to bring to punishment a man, the slayer of man? Is he to tell a lie? ... So then to lie in order to hide a person's sin is evil; but to lie in order to hide the sinner is not evil? ... What if you be led to the judge, and then questioned concerning the very place where the other is in hiding? Are you prepared to say, either, 'He is not there,' when you know him to be there; or, 'I know not, and have not seen,' what you know and hast seen? Are you then prepared to bear false witness, and to slay your soul that a manslayer may not be slain? Or, up to the presence of the judge will you lie, but when the judge questions you, then speak truth that you be not a false witness? So then you are going to slay a man yourself by betraying him. Surely the betrayer too is one whom the divine Scripture detests."

  this is basically the "murderer at the door" problem, except its Augustine wrestling with it over a thousand years before Kant made it famous. what i can't figure out is what he actually wants you to DO in this situation - he shoots down lying, but then acts like telling the truth makes you just as guilty, for "betraying" the guy. so is he saying you're kind of screwed either way and both choices are sins, or is there some third option he's building toward? can you break down the logic of the passage for me, and maybe explain why he takes such a hard line against lying even here, when it seems pretty reasonable to just lie to save someone?
