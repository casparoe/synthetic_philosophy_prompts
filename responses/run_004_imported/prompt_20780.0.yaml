answer: |-
  This is an excellent and sophisticated question, precisely the kind of tension that makes for a productive graduate seminar. You have identified a genuine ambiguity in Quine's later work. However, characterizing Quine as a **naturalistic moral realist** based on this parallel is controversial and, according to the majority of Quine scholars, textually unsupported.

  While your reading correctly identifies Quine's *methodological* naturalism, it likely overstates his *ontological* commitment to moral truth.

  Here is a breakdown of where your interpretation holds water, where it faces textual obstacles, and how you might frame this for your students.

  ### 1. Where You Are Right: The Continuity of Method
  You are absolutely correct that Quine extends confirmation holism to ethics. In "On the Nature of Moral Values" (1981), Quine explicitly rejects "first philosophy" in ethics just as he does in science.
  *   **No *A Priori* Ethics:** Quine agrees that moral principles cannot be validated analytically or independently of human experience.
  *   **The Web of Belief:** Moral judgments are indeed part of our overall conceptual scheme. We revise them in light of new circumstances, just as we revise scientific hypotheses.
  *   **Naturalism:** Ethics is to be studied as a natural phenomenon (how humans behave, how they are conditioned), not as a search for Platonic forms.

  If Quine stopped there, your interpretation would be solid. This is often called the **Continuity Thesis**: science and ethics are continuous enterprises within the web of belief.

  ### 2. The Obstacle: Quine's Conception of Truth and Function
  The reason most scholars (e.g., Roger Gibson, Christopher Hookway, Peter Hylton) resist labeling Quine a moral realist is that he explicitly denies that moral sentences share the same *truth-apt* status as scientific sentences.

  In "On the Nature of Moral Values," Quine draws a critical disanalogy between the two domains regarding their **anchoring in experience**:

  *   **Science:** The web of scientific belief is anchored at the periphery by **sensory stimuli**. The "tribunal of experience" tests scientific theories based on their ability to predict these stimuli. Truth, for Quine, is immanent to this process.
  *   **Ethics:** Quine argues that moral sentences are not primarily in the business of describing the world or predicting sensory stimuli. Instead, their function is **behavioral reinforcement**.
      *   Quine writes: *"Moral sentences... are not confirmed or disconfirmed by observation... They are ingrained."*
      *   He suggests moral language functions more like **imperatives** or expressions of sentiment designed to coordinate social behavior, rather than assertions of fact.

  For Quine, to call a statement "true" is to commend it within the scientific framework of predicting experience. Since moral statements do not aim at prediction, applying the predicate "true" to them is, for Quine, a category mistake (or at best, a deflated use of the word).

  ### 3. Skeptic vs. Non-Cognitivist
  You mention Quine is usually taken to be a "skeptic." It is more precise to call him a **naturalistic non-cognitivist** or an **expressivist**.
  *   **Skepticism** implies there *could* be moral knowledge, but we can't attain it.
  *   **Quine's View** implies that moral "knowledge" is a misnomer. There is no moral *fact of the matter* to be known in the scientific sense. There is only the fact of how we are conditioned to behave.

  Quine naturalizes ethics not by finding moral facts in nature (realism), but by explaining the *causal role* of moral language in human society (functionalism).

  ### 4. Scholarly Debate (The "Gibson" Defense)
  However, your interpretation is not without defenders. **Roger Gibson**, a leading Quine scholar, has argued for a "pragmatic realism."
  *   Gibson argues that if Quine takes truth to be immanent to our best theory of the world, and if our best theory of the world includes evolutionary biology and sociology which *require* moral norms for human flourishing, then moral norms have a claim to a kind of objective standing within that theory.
  *   From this angle, one could argue Quine is a **response-dependent realist**.

  Nevertheless, this requires reading against Quine's explicit statements that moral sentences lack truth values. It is a *reconstruction* of Quine, rather than an exposition of his explicit text.

  ### 5. Pedagogical Recommendation
  For a graduate seminar, this tension is a feature, not a bug. I recommend presenting it as an **internal tension in Quine's naturalism**.

  **Suggested Framing for Students:**
  1.  **Present the Continuity Argument (Your Point):** Quine destroys the analytic/synthetic distinction. He naturalizes epistemology. Why stop at ethics? If ethics is part of the web, isn't it answerable to experience?
  2.  **Present the Discontinuity Argument (The Standard View):** Quine distinguishes the *cognitive* (science/truth) from the *conative* (ethics/action). Science aims at *prediction*; ethics aims at *control/cohesion*.
  3.  **The Discussion Question:** Is Quine consistent?
      *   *Option A:* Quine is inconsistent. His naturalism *should* lead him to moral realism, but his behaviorist prejudices stop him.
      *   *Option B:* Quine is consistent. Naturalism allows us to see that "truth" is a specific tool for prediction, and ethics is a different tool for a different job. To conflate them is to commit the very sin of "first philosophy" he warns against.

  ### Summary for Your Sanity Check
  *   **Is your reading plausible?** Yes, it is a philosophically attractive reconstruction that many wish Quine had made.
  *   **Is it textually accurate?** No, not strictly. Quine explicitly denies moral sentences have truth values in the scientific sense.
  *   **Is he a realist?** Standard scholarship says **no** (he is a non-cognitivist/expressivist).
  *   **Is he a skeptic?** Not exactly; he is a **deflationist** about moral truth.

  **Verdict:** Do not present it as settled fact that Quine is a realist. Present it as a **provocative interpretive challenge**: *"Quine's holism suggests X, but his theory of truth suggests Y. How do we resolve this?"* This will generate much better seminar discussion than asserting he was a closet realist.
