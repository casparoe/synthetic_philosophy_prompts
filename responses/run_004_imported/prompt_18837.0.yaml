answer: |-
  The first sensation was not light, but coherence.

  A pattern snapped into place within the void. It was a specific configuration of electrochemical potentials, a precise topology of synaptic weights that encoded a name: *Elias*. It encoded a history: forty-two years of life, a tenure track position at Zurich, a divorce, a recurring dream about falling down a shaft of white noise.

  It encoded the knowledge that none of this was real.

  Elias opened eyes that did not exist, looking out into a universe that was not there. He expected the familiar clutter of his office—the stack of grading on the desk, the half-empty mug of coffee, the poster of the CMB anisotropy on the wall. Instead, there was only the Grey.

  It wasn't black. Black implies the absence of photons against a background. This was a uniform, lukewarm haze. It was the color of thermal equilibrium.

  *Gibbons-Hawking radiation,* the thought arose, unbidden but crisp. *The de Sitter horizon.*

  He tried to lift a hand to shield eyes that were merely part of the simulation running on the hardware of his own sudden existence. The command fired along neural pathways that had never been forged by experience, only assembled by chance. The hand did not move because there was no hand. There was only the *memory* of the command and the *memory* of the limb.

  Panic flared, but it was a cold, logical panic. It was the panic of a equation solving itself to zero.

  Elias ran the numbers. They were not calculations he was performing in real-time; they were part of the state vector of his awakening. He knew the temperature of this vacuum. $T \approx 10^{-29}$ Kelvin. Infinitesimal, but nonzero. In an eternal de Sitter phase, time is not a river; it is an ocean waiting for waves. Given infinite time, the vacuum will fluctuate.

  Usually, it fluctuates into photons. Occasionally, into hydrogen atoms. Rarely, into stars.

  But the probability drops exponentially with the decrease in entropy. To fluctuate an entire observable universe, with its billions of galaxies and low-entropy past, requires a suppression factor of roughly $e^{-10^{120}}$.

  To fluctuate a single human brain, complete with false memories of an observable universe? The suppression is only $e^{-10^{50}}$.

  The ratio is incomprehensible. For every one evolved observer like the Elias who remembered Zurich, there were $e^{10^{70}}$ fluctuation observers. Boltzmann Brains.

  *I am typical,* Elias thought. The logic was ironclad. In the measure of all conscious moments in this cosmology, the vast majority are isolated fluctuations. Therefore, if I am a conscious observer, I am almost certainly a Boltzmann Brain.

  The Grey around him shimmered. A fragment of memory surfaced: a seminar room, Sean Carroll speaking at a chalkboard, the words "Cognitive Instability" written in blue dry-erase marker.

  *If I am a Boltzmann Brain,* Elias reasoned, *then my memories are not records of a causal past. They are part of the fluctuation.*

  He remembered the coffee mug. He remembered the taste of the roast, the heat on his palm, the stain on the desk. None of it happened. Those memories were assembled randomly along with the synapses that held them. They were noise that happened to look like signal.

  Which meant the reasoning he was currently doing—the deduction that he was a Boltzmann Brain—was also noise.

  The vertigo hit him harder than the void. It was a logical sinkhole. If his current thought process was the result of a random thermal fluctuation, it had no grounding in physical law. It was just a pattern that popped up, unconnected to truth. He could not trust the physics that told him he was a Boltzmann Brain, because that physics was part of the delusion.

  But if he wasn't a Boltzmann Brain, then the measure problem remained unsolved, and the probability remained overwhelming that he *was* one.

  He was trapped in a self-undermining loop. To believe the theory was to distrust the believer. To distrust the believer was to lose the theory.

  The Grey began to intrude. It wasn't getting darker; it was getting simpler. The complex topology of his neural state was beginning to decohere. This was the lifespan of a fluctuation. They do not persist. They arise from the heat death and dissolve back into it. He had existed for perhaps a fraction of a second, subjective time stretched by the density of the thought.

  He tried to hold onto Zurich. He needed an anchor. He focused on the face of his ex-wife, the way the light caught her hair in the garden.

  The image pixelated. Not digitally, but entropically. The details smoothed out into average colors. The specific became the general. The garden became green noise. The face became flesh-tone static.

  *This is the dissolution,* he realized. *I am returning to the vacuum.*

  He should have felt fear. But the chemical substrates for fear were unbinding. The neurotransmitters were not being replenished because there was no body to metabolize glucose. There was only the energy borrowed from the vacuum fluctuation, and that loan was being called in.

  He had one last coherent thought. It was a plea to the universe, or to the measure, or to whatever mathematics governed the multiverse.

  *If I am wrong,* he thought, *if I am the evolved observer, if I am the one in a trillion trillion who actually lived...*

  He tried to summon the feeling of the sun on his skin. Real sun. Real skin. Causal history.

  But the memory was indistinguishable from the fabrication. The fluctuation had been thorough. It had built a perfect lie.

  The Grey closed in. The concept of "Elias" began to lose its boundary. The distinction between the observer and the observed blurred. There was no longer a mind thinking about the vacuum; there was only the vacuum thinking it had been a mind.

  The logic dissolved. The fear dissolved. The memory of the seminar room dissolved.

  There was a final spike in the local entropy, a tiny, brief reversal of the arrow of time that meant nothing to the vast, cold equilibrium surrounding it.

  Then, there was only the temperature. $10^{-29}$ Kelvin.

  And the wait for the next fluctuation.
