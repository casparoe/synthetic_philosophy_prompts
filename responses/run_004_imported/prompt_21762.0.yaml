answer: |-
  The project of analyzing dispositions through conditionals has long been a cornerstone of empiricist metaphysics. By reducing modal properties like "fragility" or "solubility" to subjunctive conditionals regarding stimuli and responses, philosophers hoped to demystify causal powers without committing to occult qualities. The Simple Conditional Analysis (SCA) proposed that an object is disposed to give response $r$ to stimulus $s$ if and only if, were it to undergo $s$, it would give $r$. However, C. B. Martin's "finkish" counterexamples demonstrated that the disposition could be lost at the very moment of stimulation, falsifying the conditional while the disposition remained prior to the stimulus. David Lewis offered a "Reformed Conditional Analysis" (RCA) to remedy this, anchoring the disposition in an intrinsic causal basis that must persist through the stimulus. Yet, a second wave of counterexamples, described by Mark Johnston and Alexander Bird as "masking" or "antidotes," challenges even Lewis's reformed account. In masking cases, the causal basis persists and the stimulus occurs, but an external intervention blocks the manifestation. This essay assesses whether Lewis's RCA can be extended to accommodate masking or whether masking necessitates treating dispositions as metaphysically primitive. I argue that masking defeats not only Lewis's specific formulation but any reductive conditional analysis, as successful defenses render the analysis trivial. Consequently, dispositions must be treated as irreducible causal powers that ground, rather than consist in, conditional truths.

  To understand the gravity of the masking objection, one must first appreciate the success of Lewis's RCA against finks. Under SCA, a "finkish" wire that is live (disposed to conduct) but connected to a device that instantly renders it dead upon contact with a conductor fails the analysis: if touched, it would not conduct, so SCA says it is not disposed. Lewis fixed this by requiring that the object possess an intrinsic causal basis $B$ for the disposition, and that the conditional hold under the supposition that $B$ is retained. In the fink case, the basis (electrical conductivity) is removed upon stimulation. Since the antecedent of Lewis's conditional requires the retention of $B$, the finkish scenario is excluded from the evaluation, and the wire is correctly classified as disposed. RCA successfully isolates the disposition from extrinsic factors that remove the disposition itself.

  Masking, however, attacks the link between the retained basis and the manifestation. Consider a lethal poison. Its causal basis $B$ is its molecular structure. The stimulus $s$ is ingestion. The response $r$ is death. If a person ingests the poison but immediately takes an antidote, they do not die. In this scenario, the molecular structure ($B$) remains intact; the poison is not chemically altered by the ingestion itself (unlike the finkish wire). The stimulus occurs. Yet, the manifestation is blocked by the antidote. According to Lewis's RCA, since $B$ is retained and $s$ occurs, $r$ should follow. Since $r$ does not follow, the conditional is false, and RCA erroneously concludes the poison lacks the disposition to kill.

  Proponents of conditional analysis might attempt a principled extension of RCA to accommodate masking. The most obvious strategy is to refine the antecedent of the conditional to exclude masking conditions. One might argue that the analysis should read: $x$ is disposed to $r$ if $s$ iff $x$ has basis $B$, and if $x$ were to undergo $s$, retain $B$, *and no masking factors intervene*, then $x$ would $r$. While this technically saves the truth of the biconditional, it comes at a devastating theoretical cost.

  The first cost is the problem of specification. To make the analysis non-trivial, one must be able to specify "no masking factors" without implicitly referencing the disposition itself. However, masks are potentially infinite and heterogeneous. An antidote for poison might be a chemical neutralizer, a stomach pump, or a magical spell in a different possible world. To list all possible masks in the antecedent is impossible. If, instead, we use a general clause like "and conditions are normal" or "and no interferers are present," the analysis risks vacuity. What counts as a "normal" condition for a poison? If antidotes are readily available, is the presence of an antidote "normal"? Furthermore, defining "interferer" usually relies on the notion that the interferer stops the *manifestation of the disposition*. This renders the analysis circular: we are analyzing the disposition in terms of conditions that are defined by their ability to block the disposition.

  The second cost is the loss of explanatory power. The allure of conditional analysis was its ability to reduce modal facts to non-modal facts about stimuli and responses. By adding *ceteris paribus* clauses to handle masking, the conditional analysis ceases to be a reduction. It becomes a placeholder that says, in effect, "The object is disposed to $r$ if $s$ iff it would $r$ if $s$, unless something stopped it." This is tautological. It fails to explain *why* the object would $r$. The primitivist argues that the explanation flows in the opposite direction: the object would $r$ (in the absence of masks) *because* it possesses the disposition. The disposition is the truthmaker for the conditional, not the logical equivalent of it.

  Alexander Bird, who coined the term "antidote," uses these cases to argue for Dispositional Essentialism. While Bird maintains a close link between dispositions and conditionals, he acknowledges that antidotes show the conditional is not sufficient for the disposition's nature. The disposition is a property essential to the kind of object the entity is. The poison is poisonous in virtue of its molecular structure, regardless of whether an antidote is available in the environment. The availability of an antidote is extrinsic to the poison's nature. If the conditional analysis requires reference to extrinsic factors (the absence of antidotes) to define the disposition, it violates the intuition that dispositions are intrinsic properties of their bearers. Lewis's RCA tried to secure intrinsicness by focusing on the causal basis $B$, but masking shows that even with $B$ fixed intrinsically, the truth of the conditional depends on extrinsic circumstances. Therefore, the conditional cannot be identical to the disposition.

  One might object that a sophisticated conditional analysis could treat dispositions as "multi-track" or probabilistic, thereby absorbing masking into a complex conditional profile. For instance, one could claim the poison is disposed to kill *or* to be neutralized. However, this conflates the disposition with its various potential outcomes. The intuition behind the masking case is that the specific disposition to kill remains present and active even when neutralized; it is merely overcome by a competing causal power (the antidote). The poison still exerts its toxic force; the antidote exerts a neutralizing force. A conditional analysis that merges these into a single "outcome" conditional obscures the underlying causal dynamics. It treats the disposition as a prediction of the final state of the world, rather than a property of the object contributing to that state.

  Furthermore, treating dispositions as primitive does not leave us mystified. It aligns with a robust realist ontology of causal powers. On this view, the world is populated by properties that have directedness toward certain manifestations. The conditional "if $s$ then $r$" is a reliable indicator of the disposition, but only in ideal or "mask-free" conditions. The failure of the conditional in masking cases does not imply the absence of the disposition; it implies the presence of a competing power. This framework handles finks and masks uniformly: finks remove the power itself (the basis), while masks leave the power intact but oppose its effect. A conditional analysis struggles to distinguish these uniformly without ad hoc clauses, whereas a primitivist ontology distinguishes them naturally based on whether the intrinsic basis persists.

  Critics of primitivism often charge that it is obscurantist, reintroducing "occult qualities" that empiricism sought to eliminate. However, this charge loses force if the primitive dispositions are identified with natural properties studied by science (e.g., valence electrons, molecular bonds). Science does not speak in conditionals alone; it posits mechanisms and structures that *produce* behaviors. The molecular structure of the poison is not a conditional; it is a categorical (or power-laden) reality that grounds the conditional truths. To insist on a conditional analysis is to demand that science translate its ontology into a linguistic form that masking proves inadequate.

  In conclusion, while Lewis's Reformed Conditional Analysis successfully navigated the shoals of finkish dispositions, it runs aground on the reef of masking. The persistence of the causal basis in masking cases, coupled with the failure of the manifestation, falsifies the central conditional of Lewis's analysis. Attempts to repair the analysis by adding "no masking" clauses render it trivial or circular, stripping it of its reductive value. Masking demonstrates that the truth of the manifestation conditional depends on extrinsic factors that do not negate the intrinsic nature of the disposition. Therefore, the conditional analysis cannot succeed as a definition of what dispositions *are*. We must instead accept that dispositions are metaphysically primitive causal powers. They are the grounds upon which conditional truths rest, distinct from the conditions of their manifestation, and capable of existing even when their effects are blocked. The verdict is clear: the conditional analysis is dead; long live the ontology of powers.
