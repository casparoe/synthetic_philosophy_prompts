answer: |-
  Kierkegaard storms into a Copenhagen newspaper office to demand the name of a critic so he can challenge him to a duel.

  "I can't give you a name," says the editor. "The review was written by The Public."

  "Very well. I challenge The Public."

  "Impossible. The Public is everyone, and therefore no one. It has no honor to defend and no body to bleed."

  "Then I shall challenge the subscribers."

  "They won't answer. They are currently engaged in a reflective discussion on how challenging someone to a duel is merely a narcissistic attempt to assert individual distinction."

  "That is envy!" Kierkegaard shouts.

  "No," says the editor. "Envy is passionate. This is just discourse. We don't want to hurt you, Søren. We just want to ensure the grass grows evenly."

  "By mowing the heads off?"

  "By convincing you that growing was the problem. Now, would you like to submit a response? We'll print it anonymously, right next to three others explaining why your response is problematic."
