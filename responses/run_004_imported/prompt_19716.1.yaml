  2.  **Recall/Research Lewis's Theory of Convention:**
      *   **Core Definition:** A convention is a regularity $R$ in behavior among a population $P$ in a recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone has approximately the same preferences regarding all possible combinations of actions.
          4.  Everyone prefers that everyone conform to $R$, *on condition that* almost everyone conforms to $R$.
          5.  Everyone would prefer that everyone conform to some *alternative* regularity $R'$, *on condition that* almost everyone conforms to $R'$ (where $R'$ is mutually exclusive with $R$).
          6.  All of the above is common knowledge.
      *   **Key Feature:** *Arbitrariness.* There must be at least one other possible regularity that could have solved the coordination problem just as well. This is the "alternative regularity" condition.
      *   **Coordination Problems vs. Prisoner's Dilemmas:** Lewis focuses on *coordination problems* (where interests align, e.g., we both want to meet, just need to agree on where). Moral norms often look more like *Prisoner's Dilemmas* (where individual interest conflicts with group interest, e.g., I benefit from lying, but we all suffer if everyone lies).

