      *   *Conditionality:* Lewis's definition requires that I prefer conformity to $R$ *conditional* on others conforming. But do I prefer universal honesty *conditional* on others being honest? Yes. Do I prefer universal dishonesty *conditional* on others being dishonest? Maybe not, because a world of universal distrust might be worse for *everyone* than a world of trust, even if I can exploit it. But the key is: Is the *alternative* regularity ($R'$) a viable solution to the *same* problem?
