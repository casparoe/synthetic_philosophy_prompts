answer: |-
  You are right to be suspicious. While Jae's argument is a classic philosophical move (and a very seductive one at 1am), it conflates "social norm" with "Lewisian Convention."

  David Lewis has a hyper-specific, technical definition of **convention** in his 1969 book *Convention: A Philosophical Study*. If you hold Jae's claim up against Lewis's actual criteria, it falls apart in at least two major places: the **Arbitrariness Condition** and the **Game Structure (Coordination vs. Prisoner's Dilemma).**

  Here is the breakdown of why Jae is technically wrong about Lewis, even if they are right that morality feels socially constructed.

  ### 1. The Arbitrariness Condition (The "Alternative Regularity")
  This is the biggest hurdle for Jae. For Lewis, a regularity $R$ is only a convention if there is at least one **alternative regularity $R'$** that could have solved the problem just as well.

  *   **Driving:** We drive on the right ($R$). We could have driven on the left ($R'$). Both solve the coordination problem of "not crashing" equally well. The choice is arbitrary.
  *   **Honesty:** We tell the truth ($R$). What is $R'$? Jae suggests "universal lying."

  But here is the Lewisian snag: If *everyone* always lied systematically, communication would cease to function as a method of information transfer. To make "universal lying" work, you would effectively just be speaking a different language where "yes" means "no."

  Lewis argues that **truthfulness in language** is a convention. But for a convention to exist, there must be a shared interest in the *outcome* of the convention. The interest in communication is getting information across. A regularity of "universal lying" does not solve the problem of "getting information across" unless you redefine the language.

  Therefore, while *which words* mean what is arbitrary (conventional), the norm of **truthfulness itself** is not arbitrary in the same way. It is a precondition for the convention of language to exist at all. A world without truthfulness isn't an *alternative equilibrium*; it's the collapse of the game. Lewis requires that $R'$ be a viable alternative equilibrium. A state of universal distrust is generally not a stable equilibrium for cooperation in the same way driving on the left is for traffic.

  ### 2. Coordination Problems vs. Prisoner's Dilemmas
  Lewis's theory is built specifically on **Coordination Problems**.
  *   **Coordination Problem:** My interests align with yours. I want to do what you do. (e.g., I want to drive on the side you are driving on).
  *   **Prisoner's Dilemma:** My interests conflict with yours, even if we both benefit from cooperation. (e.g., I benefit from lying to you, even if you tell the truth to me).

  Jae is treating honesty like a Coordination Problem. Lewis (and most game theorists) would classify honesty/promise-keeping as a solution to a **Prisoner's Dilemma** (or an Assurance Game).

  *   **In Driving:** I have *no* incentive to drive on the left if you are driving on the right. My preference is conditional entirely on your action.
  *   **In Honesty:** I *might* have an incentive to lie to you even if you are telling the truth (to cheat you out of money).

  Lewis's definition requires that everyone prefers conformity to $R$ *on the condition* that others conform. But in moral norms, people often prefer to *defect* (lie) even if others conform (tell the truth), because defection yields a higher individual payoff.

  Because the incentive structure is different, Lewis would say moral norms require something *more* than convention to sustain them (like sanctions, internal guilt, or external enforcement). Conventions sustain themselves purely through expectation and preference alignment. Morality usually requires overcoming a temptation to defect that doesn't exist in pure coordination cases.

  ### 3. Lewis's Own View on This
  Lewis actually anticipates this objection. He distinguishes between **conventions of language** (which he defends vigorously) and **moral obligations**.

  In *Convention*, Lewis argues that meaning is based on a convention of truthfulness and trust. However, he is careful not to reduce *all* normativity to convention. He acknowledges that some regularities are not conventions because they lack the alternative $R'$.

  Later philosophers (like Margaret Gilbert or Michael Bratman) have argued that Lewis's account is too thin to explain the "obligation" part of promising. They argue that when I promise, I don't just create an expectation (Lewis); I create a joint commitment that binds me in a way driving on the right does not. Jae is essentially making a **reductionist** move: "All norms are just expectations." Lewis is more careful: "Some norms are conventions; others might be contracts or moral imperatives."

  ### 4. Why It Felt Airtight at 1 AM
  Jae's argument works on a **sociological** level, not a **Lewisian technical** level.
  *   **Sociologically:** Yes, our specific moral codes are culturally contingent. We didn't sign a contract to be honest; we evolved into it.
  *   **Lewisian Technically:** No, it doesn't fit the definition because the "alternative regularity" condition fails, and the preference structure (Coordination vs. PD) is different.

  Jae is confusing **"socially constructed"** with **"Lewisian Convention."** Everything in that bucket (morality, traffic, money) is socially constructed. But Lewis carved out a specific subset of social constructs that rely on *arbitrary* coordination equilibria. Morality usually fails the arbitrariness test.

  ### The Verdict
  You can push back on Jae with this:

  > "Lewis requires that a convention be **arbitrary**, meaning there's an alternative regularity that would work just as well. Driving on the left works just as well as driving on the right. But a society of universal lying doesn't work 'just as well' as a society of honesty; it collapses the possibility of communication unless we just redefine 'lying' as 'truth' in a new language. Also, Lewis conventions solve **Coordination Problems** (where I want to do what you do), but honesty often solves **Prisoner's Dilemmas** (where I want to cheat you even if you're honest). So structurally, they aren't the same game."

  You didn't lose the argument; you just lost the distinction between "norms generally" and "Lewisian conventions specifically." Sleep well tonight.
