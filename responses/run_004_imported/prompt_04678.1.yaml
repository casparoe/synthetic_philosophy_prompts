answer: |-
  The silence is the first thing you notice. Not the absence of sound—the refrigerator still hums, the traffic on the boulevard still rushes like water over stones—but the absence of traffic internally. For twenty years, my epilepsy was a storm front moving across a single sky. Now, the sky is cut in half. There is no bridge. There is only the quiet border running down the center of my skull.

  It has been three weeks since the callosotomy. The doctors call it a success. The seizures have stopped. The electrical fire that used to leap from the left hemisphere to the right, engulfing me in convulsions, now burns itself out in isolation. I am safe. I am whole. I am told I am whole.

  But this morning, the coffee mug moved.

  I was standing at the counter, staring out the window at the gray morning. My right hand was resting on the Formica. I was thinking about the mail, about the bills stacked near the door. I had not yet decided to drink. And yet, my left hand reached out, wrapped around the handle of the ceramic mug, and slid it two inches to the left.

  I froze. I watched the hand. It was my hand—the scar on the knuckle from a bicycle fall when I was twelve, the pale skin, the veins I know better than any landscape. But the impulse hadn't come from the place where my impulses live. It felt like watching a stranger's hand act on my behalf.

  "Stop," I said aloud. My voice sounded loud in the kitchen.

  The left hand paused. It didn't tremble. It didn't recoil. It simply rested on the mug, waiting. Then, slowly, the fingers tapped once against the ceramic. *Tap.*

  I pulled my right hand back as if burned. This is what they warned me about, in the sterile language of neurology. *Intermanual conflict.* *Alien hand syndrome.* They showed me diagrams of the corpus callosum, that thick bundle of nerve fibers like a heavy rope, and explained that cutting it was like cutting the cable between two television studios. One broadcast might not know what the other is showing.

  I walked to the living room and sat on the sofa. I placed both hands on my knees. Palms up. Open.

  "Who are you?" I asked.

  It was a foolish question. I know the anatomy. I know that the left hemisphere—my speaking self, the narrator of this sentence—controls the right side of the body. The right hemisphere controls the left. Without the corpus callosum, the right hemisphere cannot hear my voice. It cannot speak. It lives in a world of images, spatial relations, and emotions, sealed off from the language center that defines who I am.

  And yet, the left hand turned over. Palm down. It rested heavily on my knee, a weight that felt like a signature.

  I remembered the tests from the recovery ward. The neuropsychologist, Dr. Aris, holding up cards in my peripheral vision. When a picture of a snow scene was flashed to my left visual field (processed by the right hemisphere), my left hand would point to a shovel. When asked why I chose the shovel, my mouth—controlled by the left hemisphere—would confabulate. *You need a shovel to clean out the chicken coop,* I had said confidently, though no chicken had been shown. I had invented a logic to bridge the gap my brain could no longer cross. I was a storyteller explaining the actions of a ghost.

  Now, home alone, the confabulation feels less like a trick and more like a grief.

  I stood up and walked to the desk. I needed to write this down. I picked up a pen with my right hand. As the nib touched the paper, my left hand slid across the surface, blocking the light. It wasn't aggressive. It was protective. It hovered over the blank space.

  "What do you want?" I whispered.

  I moved the pen to the left side of the page. The left hand retreated. I began to write: *I am here.*

  The left hand moved again. It nudged the paper slightly clockwise. Then, it reached for the pen. I let go. This was the terror, I realized. Not that it would hurt me, but that I would let it happen. That the boundary of consent was dissolving.

  The left hand gripped the pen awkwardly. The grip was crude, motor skills less refined than my dominant right. It scrawled a line. Then a circle. Then a shape that looked like a eye.

  I watched the ink flow. I felt the muscle tension in my left forearm, the pull of the tendons. It was my flesh. It was my blood. If I am my body, then I am doing this. But if I am the voice in my head, then I am being written upon.

  Parfit wrote about this, didn't he? Or maybe I read about him in the waiting room magazines. The idea that personal identity isn't a deep fact. That we are just bundles of psychological connections. If the connections are severed, does the person split? Am I Elena-Left and Elena-Right? Or am I just Elena-Left, and the other thing is a biological machine wearing my skin?

  The hand stopped writing. It dropped the pen. It reached out and touched my cheek. The skin was warm. The touch was gentle, familiar in a way that made my stomach turn. It was the intimacy of self-care, but performed by a separate agent.

  "I miss you," I said.

  That was the wrong word. You don't miss a part of yourself unless it's amputated. This wasn't amputation. It was isolation. It was like being locked in a room with a sibling you've never met, who knows all your secrets but cannot speak your language.

  I stood up and walked to the hallway mirror. This was another test Dr. Aris had mentioned. *Visual field separation.* If I looked straight ahead, the left eye sends information to the right hemisphere, the right eye to the left. But the brain usually merges them. Now, the merge was fragile.

  I stared at my reflection. My face was symmetrical, mostly. But I focused on the left side of my face. The left eyebrow twitched. I hadn't ordered it to twitch.

  "Are you angry?" I asked the reflection.

  The left side of my mouth quirked. Not a smile. A grimace? A wince?

  I thought about the stories I'd read online before the surgery, the ones the doctors told me to ignore. The man whose left hand unbuttoned his shirt while his right hand buttoned it. The woman whose left hand packed a suitcase while she decided to stay. They made it sound like a battle. A civil war.

  But wars imply two sides fighting for control of the same territory. What if the territory itself has changed?

  I went back to the desk. I picked up the pen with my right hand. I wrote: *We need to eat.*

  The left hand reached out and tapped the word *We*. Then it slid the paper away. It reached for a book on the shelf—a collection of poetry I hadn't opened in years. It pulled the book down and opened it to a random page. It pressed its palm flat against the paper.

  I looked at the poem. It was about a river dividing around a stone.

  I felt a sudden, sharp surge of emotion. Sadness. It wasn't my sadness. It felt heavier, older, located in the back of my head rather than the front. The left hemisphere processes positive emotions, the right handles the negative. That's the theory. But as I stood there, the sadness washed over me, undeniable. If this sadness belongs to the right hemisphere, and I am the left hemisphere, then why am I crying?

  Tears leaked from my left eye first. Then the right followed.

  I wiped them away with my right hand. My left hand caught my wrist. It held me there, stopping the wipe. It wanted me to feel it. It wanted the tears to stay.

  "Okay," I said. My voice cracked. "Okay. You feel it. I'll speak it."

  It was a compromise. A treaty.

  I pulled a fresh sheet of paper. I held the pen with my right hand, but I let my left hand rest on top of my right. A stack of hands. Four layers of skin and bone.

  "We are one body," I wrote.

  The left hand tightened its grip on my right. It didn't push away, but it didn't relax. It held the tension there, vibrating slightly.

  *Is that true?* I thought. Or is it just a convenient fiction? Nagel argued that the unity of consciousness is an illusion even in a normal brain. We just don't notice the seams because the wiring is so fast. Now the wiring is cut, and the illusion is shattered. But does shattering the illusion destroy the person?

  If I stop calling myself "I," does the problem go away?

  I looked down at the joined hands. The left hand began to move again. It guided my right hand to the bottom of the page. It didn't let me write words. It guided me to draw. A circle. Then a line through it. Not a zero. An eye. Like the one before.

  It wasn't trying to communicate a fact. It was communicating a state. *Presence.*

  I realized then that I had been waiting for a resolution that wasn't coming. I wanted to know if I was still one person so I could know how to mourn. If I was two, I could grieve the loss of the unity. If I was one, I could grieve the loss of control. But the question itself felt like a tool designed for a different kind of machine. I was not the machine I was built to be.

  I stood up. The left hand released my right. It fell to my side, heavy and loose.

  "I'm going to make tea," I said.

  I walked to the kitchen. I filled the kettle with my right hand. My left hand reached for the cups. It chose the blue one, the chipped one I usually avoid. It placed it on the tray.

  I watched it. I didn't try to stop it. I didn't try to help it.

  When the water boiled, I poured. Steam rose between us. For a moment, the steam obscured the space between my hands. In the white fog, the boundary vanished. There was just the heat, the smell of Earl Grey, the sound of the pour.

  I picked up the cup with my right hand. The left hand reached out and steadied the saucer.

  We walked to the window. We stood there, watching the rain start to fall on the boulevard. My left hand rested on the glass. My right hand held the warm ceramic.

  I didn't know who was watching the rain. I didn't know who was drinking the tea. I knew only that the thirst was quenched, and the view was seen.

  "It's raining," I said.

  The left hand tapped the glass. *Tap. Tap.*

  I didn't translate it. I didn't decide if it meant *yes* or *I know* or *look closer*. I let the sound hang in the air, a second voice without words, occupying the same room, wearing the same skin.

  We stood there for a long time, waiting for the storm to pass, or perhaps waiting to see if we would drown in it together. The silence between us was no longer empty. It was full of the things we couldn't say, the things we didn't need to. I took a sip of tea. The left hand moved away from the glass and rested on my chest, over the heart.

  It beat steadily. One rhythm. One sound.

  I finished the tea. I set the cup down. I didn't know who set it down. I turned away from the window.

  "Come on," I said.

  I walked toward the bedroom. My left leg stepped forward. Then my right. One foot, then the other. I didn't check to see who was leading. I just walked, carrying the weight of us both, into the quiet of the afternoon.
