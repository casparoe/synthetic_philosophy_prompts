          *   *Candidate C: Brute Facts.* Just true for no reason. This violates the Principle of Sufficient Reason (PSR) and makes God's wisdom dependent on luck.
      *   **Point 4: The Consequence (The Dilemma).**
          *   If CCFs are true *before* the decree, they are ungrounded brute facts (metaphysically suspicious).
