answer: |-
  This is a sharp observation. You have correctly identified that Yudkowsky's "No Universally Compelling Arguments" (NUCA) and Williams's "Internal Reasons" thesis share a structural commitment to *psychological accessibility* as a condition for *normative validity*. Both imply that if a mind cannot be causally moved to a conclusion via its existing architecture (Yudkowsky) or motivational set (Williams), then the conclusion is not "for" that mind.

  However, your intuition is correct: Williams's attempt to save Internalism by expanding the definition of a "sound deliberative route" creates a fatal instability in his system. By allowing deliberation to include more than simple means-end calculation—specifically, the correction of factual errors and the imaginative vivification of outcomes—Williams smuggles in external normative standards that do not bottom out in the agent's antecedent subjective motivational set ($S$).

  Here is the argument for Externalism, leveraging that specific vulnerability.

  ### 1. The Normativity of "Soundness" is External

  Williams defines an internal reason statement as true if the agent could reach the motivation to $\phi$ via a *sound deliberative route* from their $S$. He explicitly concedes that "sound deliberation" is not merely Humean instrumentalism. It includes:
  1.  Correcting factual errors.
  2.  Correcting errors in probabilistic reasoning.
  3.  Imagining the outcome of actions more vividly.

  The Externalist wedge drives into the status of these corrections. Why *ought* an agent to correct a factual error? Why *ought* they to imagine the outcome vividly?

  If Williams is a consistent Internalist, the reason to correct a factual error must itself be found in $S$. That is, I only have a reason to believe the truth if I already have a desire in $S$ for truth. But this leads to an absurdity. Consider an agent whose $S$ contains a strong desire to remain deluded (e.g., a paranoid conspiracist who finds comfort in falsehood). On strict Internalism, this agent has no reason to correct their factual errors, and thus no reason to update their plan based on reality.

  Yet, Williams wants to say that if this agent *were* to deliberate soundly, they would arrive at different reasons. He wants to say the paranoid *should* correct their error. But if the obligation to correct the error does not stem from $S$ (since $S$ opposes it), it must stem from an external standard of rationality.

  Therefore, the "soundness" of the deliberative route is governed by norms (logic, evidence, vividness) that apply to the agent *regardless* of their $S$. These are external reasons. If the *process* that generates internal reasons is governed by external norms, the resulting reasons inherit that externality. The "internal" reason is merely the shadow cast by an external normative structure interacting with a specific psychology.

  ### 2. Discovery vs. Construction

  Williams treats deliberation as a process of *unpacking* what is already latent in $S$. He views the new motivation as a logical consequence of the old one, mediated by facts.

  The Externalist argues that deliberation is often a process of *detection*, not unpacking. When Williams says I might come to want $X$ after "imagining the outcome more vividly," he is admitting that my current $S$ is blind to a value that is actually present in the situation.

  Consider the classic example: I do not want to drink the gin in the glass because I believe it is gin, but it is actually petrol. Williams says I have an internal reason not to drink it (because if I knew the facts, my $S$ would move me not to drink).
  *   **Williams:** The reason is internal because it relies on what I *would* want if I were informed.
  *   **Externalist:** The reason exists *because it is petrol*. The fact that the liquid is petrol provides a reason regardless of my hypothetical motivational reaction.

  The crucial pivot is this: If the "sound deliberative route" requires me to appreciate my situation *more clearly*, it implies there is a "clear" view of the situation that is normatively privileged over my current view. That privilege cannot come from my current view (which is unclear). It must come from the world itself.

  If the world contains features (like "being petrol" or "causing suffering") that *demand* a certain response from any agent who perceives them clearly, then those features are sources of external reasons. Williams tries to locate the reason in the *hypothetical motivation*, but the *authority* of that hypothetical motivation comes from the *accuracy of the perception*. Accuracy is an external standard.

  ### 3. The Regress of Motivational Sets

  Let us push Williams's concession to its limit. He allows that $S$ can change during deliberation. I might start with a desire for pleasure, deliberate, and end up with a desire for my friend's well-being (because I realize their well-being is constitutive of my pleasure, or via some other psychological route).

  Williams insists the final desire must be traceable to the initial $S$. But what governs the transition?
  If the transition is merely causal (one desire triggers another), it lacks normative force. It's just psychology.
  If the transition is rational (I *should* adopt this new desire because it is better), then there is a reason to adopt the new desire.

  Where does *that* reason come from?
  *   If it comes from the initial $S$, we are back to square one: what if my $S$ is resistant to rational updating?
  *   If it comes from the rationality of the update itself, then there is a reason to be rational that exists independently of $S$.

  This is the "Normativity of Rationality" argument. To say a deliberative route is "sound" is to say it conforms to norms of rationality. If an agent has no element in $S$ that cares about conforming to norms of rationality, Williams must conclude they have no reason to be rational. But if they have no reason to be rational, the concept of a "sound deliberative route" loses its normative bite and becomes merely "a route that happens to occur."

  Williams wants "sound" to mean "rationally required." But a rational requirement that applies to you even if you don't care about rationality is, by definition, an **external reason**. Thus, the mechanism Williams uses to save Internalism (the sound deliberative route) presupposes the existence of External Reasons (reasons to be rational, reasons to attend to facts).

  ### 4. Distinguishing NUCA from Externalism

  This brings us back to your connection with Yudkowsky. The shared assumption you identified is the conflation of **causal compulsion** with **normative validity**.

  *   **Yudkowsky's NUCA:** "You cannot compel every mind with the same argument."
      *   *Truth:* Causal persuasion depends on shared priors.
      *   *Error:* Inferring that therefore no argument is *true* for minds that reject it.
  *   **Williams's Internalism:** "A reason must be able to motivate the agent."
      *   *Truth:* Motivation requires psychological hooks.
      *   *Error:* Inferring that therefore no reason *exists* for agents lacking those hooks.

  The Externalist case is that reasons are like mathematical truths. A broken calculator cannot compute $2+2=4$. It lacks the "cognitive machinery" to be compelled by the input. But $2+2=4$ remains true, and the calculator is *wrong*, not merely different.

  Similarly, a psychopath may lack the "subjective motivational element" to care about suffering. Williams says they have no reason to avoid causing suffering. The Externalist says: The suffering itself provides the reason. The psychopath's inability to access that reason is a defect in the psychopath, not evidence that the reason doesn't exist.

  Williams's "sound deliberative route" is an attempt to bridge this gap by saying, "If the psychopath were functioning correctly (soundly), they would see the reason." But "functioning correctly" is an external standard. It appeals to a design plan or a normative ideal of agency that transcends the agent's actual $S$.

  ### Conclusion

  Williams's rejection of external reasons fails because his definition of a "sound deliberative route" relies on normative standards (truth, logic, vividness, rationality) that cannot themselves be grounded in the agent's antecedent $S$.

  If the route must be *sound*, it is answerable to standards outside the agent. If the agent is required to follow the sound route, they are subject to external reasons. If they are not required to follow it, then "internal reasons" are merely descriptions of psychological causality, not normative prescriptions.

  You cannot have it both ways: you cannot claim that reasons are purely internal while simultaneously insisting that the process of finding them is governed by universal norms of "soundness." The moment you admit that an agent can be *wrong* about their reasons due to ignorance, bad imagination, or irrationality, you have admitted that the truth of the reason statement depends on something other than the agent's current motivations. You have admitted Externalism.

  Yudkowsky is right that you cannot *compel* every mind. But Williams is wrong to infer that you therefore cannot *address* every mind with truth. The existence of a reason does not depend on the listener's ability to hear it, but on the speaker's (or the world's) authority to state it. Williams's "sound deliberative route" is the admission that the world *does* have that authority, undermining his own Internalist conclusion.
