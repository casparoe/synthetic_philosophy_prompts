          *   *Critique:*
              *   Derivative/Non-derivative distinction explanation is mostly okay, though slightly simplified.
              *   *Major Error:* Baker explicitly *denies* that the lump and statue are "in effect, one and the same object." Constitution is *not* identity, not even temporary identity. Baker argues they are numerically distinct but unified via constitution. Saying they are "in effect, one and the same object" undermines the entire point of the view (which is to avoid identity while maintaining unity). This sounds more like a temporary identity view (like Gallois or some stage theorists), not Baker's constitution view. Baker insists on *numerical distinctness* at all times during co-existence.
              *   Also, the claim that the lump has properties derivatively *depending on the statue* (being valuable) is slightly off. Usually, the constituted object (statue) has properties derivatively from the constituter (lump) regarding material properties. The constituter doesn't necessarily take on the *essential* properties of the constituted object derivatively in the way described (the lump doesn't become an artwork derivatively, it *constitutes* one). But the "temporary identity" claim is the killer here.

      *   **Part 3: Too Many Thinkers Objection.**
          *   *Claim:* If human animal constitutes person, animal has mental properties derivatively. Both believe/desire. Two thinkers.
