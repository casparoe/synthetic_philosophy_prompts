      "It's the upsuck mechanism, Marcus," Elena said, stirring her coffee. "Vaginal contractions during orgasm create negative pressure. It's not just pleasure; it's a physiological pump favoring conception."

      Marcus leaned back. "You're telling me a trait with wildly inconsistent expression across the population is a finely tuned adaptation? Come on, Elena. It's the male nipple argument redux. The clitoris and penis develop from the same embryonic tissue. Male orgasm is adaptive for ejaculation. Female orgasm is just the developmental echo. A spandrel."

      "That's the Gould-Lloyd line, I know," Elena countered. "But you're ignoring exaptation. Even if the capacity originated as a byproduct of shared morphology, selection could later co-opt it. If orgasmic contractions *do* retain sperm, women who experienced it more frequently or intensely would have had higher reproductive success. The origin doesn't negate current utility."

      "Origin matters when you're looking for design," Marcus shot back. "If it were selected for intercourse-specific utility, why the massive anatomical variability? The distance between the clitoris and the vaginal opening varies hugely among women. If orgasm during penetrative sex was the target, selection should have standardized that anatomy. Instead, many women rarely orgasm from intercourse alone. That's not what a tight adaptation looks like."

      "Variability doesn't mean non-adaptive," Elena insisted. "It means conditional. Maybe it's a mate-choice filter. Only high-quality partners trigger the response. You're treating the null hypothesis—that it's noise—as the default conclusion. But biology is messy. Just because it's not universal doesn't mean it's not functional when it occurs."

      "But you're burdening the trait with a function it doesn't need to carry," Marcus argued. "Selection isn't a perfectionist. It's a tinkerer. If a trait isn't costly, it doesn't get weeded out. Female orgasm isn't lethal. It doesn't reduce fitness. So why must it be *for* something? You adaptationists see function everywhere. Sometimes a cigar is just a cigar, or in this case, a pleasurable side effect of a necessary male trait."

      "Because 'just a side effect' stops the inquiry," Elena said. "If we assume it's useless, we stop looking for the mechanism. The upsuck data exists. The hormonal fluctuations correlate. You're so afraid of 'Just-So Stories' that you're writing a 'Just-So Nothing.'"

      "And you're so desperate for a story you're ignoring the developmental constraints," Marcus replied. "Look, if I grant you exaptation—that selection tweaked a byproduct—you still need to explain why the tweaking stopped so halfway. Why is the pathway so indirect? Why is the reliability so low compared to male ejaculation? The homology explains the existence perfectly without invoking a secondary selection pressure that leaves so little trace."

      "Maybe the trace is behavioral, not anatomical," Elena mused. "Increased retention leads to conception. That's the trace."

      "Correlation isn't causation," Marcus sighed. "Until you can show that non-orgasmic women had significantly fewer offspring in ancestral environments, controlling for copulation frequency, it remains a beautiful, functional-looking spandrel. You want it to be an engine; I'm telling you it's the hood ornament."

      "And I'm telling you the car doesn't move without it," Elena smiled.

      "Then why do so many cars run fine without the ornament?" Marcus countered.

