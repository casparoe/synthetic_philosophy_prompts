  *Grue:* Green if observed before time *t*, Blue if observed after time *t*.
  *All observed emeralds are green.*
  *Therefore, all observed emeralds are grue.*
  *Prediction 1:* Next emerald will be green.
  *Prediction 2:* Next emerald will be grue (which means blue, since it's after *t*).
  *Conflict:* Both hypotheses are supported by the evidence.
  *Okay, I will embed this logic clearly but conversationally.*

  *(Final check on the "Entrenchment" constraint)*: The prompt says "remains accessible... [but] stays precise enough to satisfy my teacher... [don't] simply wave at 'entrenchment'."
  *Strategy:* I will mention that Goodman's solution involves how we habitually carve up the world, but I will argue that graduation is the moment where old habits don't apply, so we must consciously choose our projections. This satisfies the teacher (shows understanding of the limitation of entrenchment in new contexts) and the audience (empowering message).

