      *   *Refining Horn 2:* Focus on **Identity and Desire**. Immortality isn't a promotion if it means ceasing to be the person who wanted things. Also, the "Great Dead" might be boring or tyrannical.
      *   *The "Rigged Dichotomy":* The biggest flaw is that Cato addresses the *state of being dead*, but the grandson fears the *event of dying* and the *loss of connection*.

  5.  **Drafting the Response:**
