      *   **Deep Dive Horn 1 (The Deprivation Account):** Explain that Cato assumes a "Experience Requirement" for harm. Counter with "Loss of Future." Metaphor: Being erased from a story vs. the character feeling pain.
      *   **Deep Dive Horn 2 (The Tedium/Identity Problem):** Explain that immortality requires infinite desire, but humans are finite. If you satisfy all desires, you're bored. If you keep desiring, you suffer. Also, the "Company" assumption is arrogant.
