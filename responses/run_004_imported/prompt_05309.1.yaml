      *   *Claim 2:* "He rejected the Trinity... thought the idea... was a corruption... blamed Athanasius and the Council of Nicaea..."
          *   *Accuracy:* True. Newton was an Arian (or Socinian-leaning), believing the Son was subordinate to the Father, not co-eternal/co-equal. He viewed the Trinity as a later corruption.
      *   *Claim 3:* "Kept this hidden... denying the Trinity was actually against the law in England... cost him his position at Cambridge..."
          *   *Accuracy:* True. The Act of Supremacy and various blasphemy laws (like the Blasphemy Act of 1697, though earlier penalties existed) made heterodoxy dangerous. Cambridge fellows were required to take holy orders (though Newton got a dispensation from Charles II, largely *because* he couldn't in good conscience ordain as an Anglican priest due to these views).
      *   *Claim 4:* "He wrote this essay called 'Two Notable Corruptions of Scripture'... had his friend John Locke arrange to get it published anonymously in Holland, and it did get printed over there with no name attached while Newton was still around..."
          *   *Accuracy:* **Mixed/Problematic.** Newton *wrote* "Two Notable Corruptions of Scripture" (1690). He *did* send it to John Locke. He *did* consider publishing it. However, did it get printed anonymously in Holland *while Newton was still around*?
          *   *Fact Check:* Locke tried to get it published. Newton got cold feet and stopped the publication. It was *not* published during his lifetime. It was published posthumously (1754). There was a French translation published in 1755. Some sources suggest fragments might have circulated, but the claim "it did get printed over there with no name attached while Newton was still around" is historically inaccurate. This is a significant factual error regarding the secrecy/publication history.
      *   *Claim 5:* "In the General Scholium... argues that just being eternal and infinite isn't enough to make something 'God,' what matters is having dominion over creation, which is why he calls God 'Pantokrator.'"
          *   *Accuracy:* True. The General Scholium (added in 1713) explicitly discusses God's dominion ("Pantokrator") and distinguishes God from idols based on dominion, not just eternity/infinity.
      *   *Claim 6:* "In his back-and-forth with Leibniz (through Samuel Clarke), Newton claimed God has to keep actively stepping in to correct little wobbles in the planets' orbits..."
          *   *Accuracy:* True. This refers to the Newton-Leibniz correspondence (1715-1716) conducted via Clarke. Newton argued that gravity alone wasn't enough to stabilize the solar system long-term; God's occasional intervention was needed.
      *   *Claim 7:* "Basically, once you strip away the equations, Newton comes out looking like a pretty textbook Enlightenment Deist..."
          *   *Accuracy:* **Problematic.** This is a major interpretive error. Newton was *not* a Deist. Deists believed God created the universe and then *left it alone* (the "clockmaker" God). Newton believed God was *actively involved* (intervening to fix orbits, prophecy, miracles). Calling him a "textbook Enlightenment Deist" contradicts the previous sentence about God "actively stepping in to correct little wobbles." This shows a misunderstanding of the term "Deist" vs. Newton's actual Providentialism.

