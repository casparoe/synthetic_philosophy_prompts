prompt: |-
  So in my AP Euro class we just finished the Scientific Revolution unit, and my teacher's kind of obsessed with the whole "Newton was secretly a heretic" thing so she always throws in a bonus short-response question that's way more specific than anything actually in our textbook. Shes swamped grading essays for like 3 sections rn so this time she had us peer-grade each other's answers using a rubric she handed out (10 points total, split into 3 categories), and I got my friend Maya's paper. I actually want to be fair to her instead of just skimming it and slapping a number on it, especially since im not 100% sure I know this topic well enough myself to catch every mistake.

  The question was: "Isaac Newton is usually taught to us as just 'the gravity guy,' but he actually spent more of his life writing about theology than physics. In a paragraph, explain what Newton actually believed about God and Christianity, why he had to keep it quiet for most of his career, and how you can see those beliefs bleeding into his scientific writing (e.g. the General Scholium he added to the Principia, or his letters with Leibniz about whether God has to keep tweaking the planets' orbits)."

  Here's what Maya wrote: "Newton was genuinely religious his whole life, he just wasn't a normal Christian by the standards of his time — he spent way more energy on theology, alchemy and bible chronology than on the physics and math he's famous for. His big secret was that he rejected the Trinity: he thought the idea that the Father, Son and Holy Spirit are 'one substance' was a corruption that got added to Christianity a few centuries after Jesus, and he specifically blamed Athanasius and the Council of Nicaea for it. He kept this hidden basically his entire career because denying the Trinity was actually against the law in England back then and could've cost him his position at Cambridge, so almost none of his theological writings came out while he was alive. Like, he wrote this essay called 'Two Notable Corruptions of Scripture' laying out his case against the Trinity, and he had his friend John Locke arrange to get it published anonymously in Holland, and it did get printed over there with no name attached while Newton was still around, which shows how careful he had to be. You can actually see this theology sneaking into his physics too — in the General Scholium he tacked onto the Principia, he argues that just being eternal and infinite isn't enough to make something 'God,' what matters is having dominion over creation, which is why he calls God 'Pantokrator.' And in his back-and-forth with Leibniz (through Samuel Clarke), Newton claimed God has to keep actively stepping in to correct little wobbles in the planets' orbits, or the solar system would eventually destabilize, which fits his whole view that God stays constantly involved in the world. Basically, once you strip away the equations, Newton comes out looking like a pretty textbook Enlightenment Deist — someone who wanted a stripped-down, rational religion based on natural laws instead of all the supernatural stuff the church added on later."

  Can you grade this the way our rubric does — accuracy of the beliefs she describes (4 pts), how she explains the secrecy (3 pts), and how well she connects it to his actual science writing (3 pts)? I don't just want a number, I want comments that actually justify wherever points come off, so could you maybe lay it out like a little json with each category, points earned out of each, and a comment, plus one overall score out of 10 and a letter grade at the end? thanks!!
