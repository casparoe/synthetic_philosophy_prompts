answer: |-
  There is a crucial technical distinction at the heart of your difficulty, one that is philosophically significant for your work on Dummett.

  You are conflating two different notions:
  1.  **Not being forced** ($w \nVdash \phi$): The formula $\phi$ is not verified at node $w$.
  2.  **Being refuted** ($w \Vdash \neg \phi$): The negation of the formula is verified at node $w$.

  In classical logic, these are equivalent. In intuitionistic logic (and Kripke semantics), they are not.

  **The Short Answer:**
  You cannot construct a model where $\neg(p \lor \neg p)$ is forced at the root. In fact, $\neg(p \lor \neg p)$ is intuitionistically equivalent to $\bot$ (contradiction). If you could force $\neg(p \lor \neg p)$, intuitionistic logic would be inconsistent.

  However, you **can** (and must) construct a model where $p \lor \neg p$ is **not forced** at the root. This is sufficient to show that $p \lor \neg p$ is not a theorem (i.e., not valid).

  Here is the breakdown of where your reasoning went wrong, the correct countermodel, and how to frame this for your work on Dummett.

  ---

  ### 1. The Diagnostic: Why Your Attempts Collapsed

  You wrote:
  > *"As soon as I try to force $\neg p$ at every point where $p$ fails to be forced, I end up forcing $p \lor \neg p$ anyway."*

  This is exactly right, and it reveals the mechanism of the logic. In Kripke semantics, you do not get to arbitrarily "force $\neg p$." The forcing relation for negation is defined rigidly:

  $$w \Vdash \neg A \quad \text{iff} \quad \text{for all } v \ge w, \ v \nVdash A$$

  To force $\neg p$ at the root $w_0$, you must ensure that $p$ is **never** forced at $w_0$ or any of its successors.
  *   If you do this (i.e., $p$ is nowhere forced), then $w_0 \Vdash \neg p$.
  *   If $w_0 \Vdash \neg p$, then by the disjunction rule, $w_0 \Vdash p \lor \neg p$.
  *   Thus, the law of excluded middle holds at that node.

  To make $p \lor \neg p$ **fail** at $w_0$, you need a situation where:
  1.  $w_0 \nVdash p$ (We don't have evidence for $p$ yet).
  2.  $w_0 \nVdash \neg p$ (We don't have evidence that $p$ is impossible yet).

  If both disjuncts fail, the disjunction fails. But condition (2) requires that there be **some future possibility** where $p$ might turn out to be true.

  ### 2. The Correct Countermodel

  To show that $p \lor \neg p$ is not valid, you need a frame with at least two nodes, representing a growth of information.

  **The Frame:**
  *   Nodes: $W = \{w_0, w_1\}$
  *   Accessibility: $w_0 \le w_1$ (and reflexivity).
  *   $w_0$ is the root (current state of knowledge).
  *   $w_1$ is a possible future state of knowledge.

  **The Valuation:**
  *   $w_0 \nVdash p$
  *   $w_1 \Vdash p$
  *   (By persistence/monotonicity, since $w_0 \le w_1$ and $w_1 \Vdash p$, it is consistent that $w_0 \nVdash p$.)

  **The Evaluation at the Root ($w_0$):**

  1.  **Check $p$:**
      $$w_0 \nVdash p$$ (By stipulation).

  2.  **Check $\neg p$:**
      Recall the definition: $w_0 \Vdash \neg p$ iff for all $v \ge w_0$, $v \nVdash p$.
      Look at $w_1$. We have $w_1 \ge w_0$ and $w_1 \Vdash p$.
      Therefore, the condition fails.
      $$w_0 \nVdash \neg p$$

  3.  **Check $p \lor \neg p$:**
      Definition: $w_0 \Vdash A \lor B$ iff $w_0 \Vdash A$ or $w_0 \Vdash B$.
      Since $w_0 \nVdash p$ AND $w_0 \nVdash \neg p$:
      $$w_0 \nVdash p \lor \neg p$$

  **Conclusion:**
  At node $w_0$, the Law of Excluded Middle is **not forced**. It is not "false" (refuted); it is merely **undecided**.

  ### 3. Philosophical Interpretation (For Dummett)

  Since you are working on semantic anti-realism, this distinction is the crux of your argument.

  **Classical Realism:**
  Truth is evidence-transcendent. At $w_0$, either $p$ corresponds to reality or it doesn't. $\neg p$ corresponds to the absence of that correspondence. One of them must hold "out there," regardless of our epistemic access.

  **Dummett's Anti-Realism:**
  Truth is identified with verifiability (or assertibility).
  *   To assert $p$, we need current evidence ($w_0 \Vdash p$).
  *   To assert $\neg p$, we need evidence that no evidence for $p$ can ever exist ($w_0 \Vdash \neg p$).
  *   In the model above, at $w_0$, we lack evidence for $p$, but we also lack the guarantee that evidence for $p$ is impossible (since $w_1$ is a live possibility).

  Therefore, at $w_0$, we are not warranted in asserting $p$, nor are we warranted in asserting $\neg p$. Consequently, we are not warranted in asserting $p \lor \neg p$.

  **Why $\neg(p \lor \neg p)$ is impossible:**
  To force $\neg(p \lor \neg p)$ at $w_0$ would mean that in *all* future states $v \ge w_0$, $p \lor \neg p$ fails. But in any specific state $v$, either $p$ is verified or it isn't.
  *   If $p$ is verified at $v$, then $p \lor \neg p$ is verified at $v$.
  *   If $p$ is never verified in any future of $v$, then $\neg p$ is verified at $v$, so $p \lor \neg p$ is verified at $v$.
  Thus, $p \lor \neg p$ is forced at *every* node in *every* model (it is locally true everywhere), even though it is not forced at the root of *every* model (it is not valid).

  *Correction:* Wait, I must be precise. $p \lor \neg p$ is **not** forced at every node in every model (as shown in the countermodel above). However, $\neg(p \lor \neg p)$ is forced at **no** node in any model.
  Actually, the stronger claim is: $\neg \neg (p \lor \neg p)$ is a theorem. The double negation of LEM holds. This means you can never rule out the possibility that LEM will be verified. But you cannot assert LEM itself without current verification.

  ### 4. Summary for Your Dissertation

  When illustrating the rejection of LEM:

  1.  **Do not** look for a model where $\neg(p \lor \neg p)$ holds. This is a contradiction.
  2.  **Do** look for a model where $p \lor \neg p$ is **not forced** at the root.
  3.  **Use the "Growing Knowledge" metaphor:** The failure of LEM represents a state of information where a proposition is currently undecided, but remains decidable in the future.
  4.  **Key Terminology:** Distinguish between **invalidity** (not forced at some node in some model) and **refutability** (negation forced at a node). LEM is invalid, but not refutable.

  This captures the anti-realist intuition: we cannot assert $p \lor \neg p$ universally because we cannot assume that every statement is currently decidable, even if we admit that we might decide it later.
