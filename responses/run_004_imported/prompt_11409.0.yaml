answer: |-
  The conference room lights were dimming as the last attendees filed out. Dr. Ananya Sharma stacked her notes, while Dr. Tenzin Dorje lingered by the podium, loosening his tie.

  "Your reduction of *śabda* to inference was elegant, Tenzin," Ananya said, sliding her papers into her bag. "But elegant reductions often shave away the bone along with the flesh."

  Tenzin smiled. "And your defense of testimony as independent is robust, Ananya. But is it necessary? Dignāga taught us *pramāṇa-samkhyāniścaya*: the determination of the number of means of knowledge. If perception grasps the particular and inference grasps the universal, what work is left for testimony? If I tell you there is fire on the hill, you infer it from my reliability. Why posit a third cognitive event?"

  "Because the cognitive architecture is distinct," Ananya countered, turning to face him. "Consider the conditions for verbal understanding: *ākāṅkṣā* (syntactic expectancy), *yogyatā* (semantic fitness), and *sannidhi* (proximity). When I hear 'Bring the cow,' the verb demands an object. This isn't a logical pervasion (*vyāpti*) between a sign and a signified. It's a structural integration of meaning. In inference, I move from a mark to a conclusion. In testimony, I grasp a meaning-complex directly."

  "But surely," Tenzin pressed, stepping closer, "you only grasp that meaning-complex as true because you take me to be a reliable speaker. That assessment of reliability is the *hetu*, the reason. 'Ananya is trustworthy; Ananya says X; therefore X.' Even if you don't articulate the syllogism, the causal structure of your knowledge is inferential. To claim otherwise is to confuse the phenomenology of speed with the ontology of the process."

  Ananya shook her head. "Speed isn't the issue. Consider a child. A toddler hears her mother say, 'Hot, don't touch.' She withdraws her hand. She understands the warning. Does she possess the concept of her mother's trustworthiness? Has she established a universal concomitance between 'Mother's utterance' and 'Truth'? No. She accepts the word as a direct grasp of the situation. If *śabda* were inference, children would be incapable of learning language until they mastered logic."

  Tenzin nodded slowly. "The child objection is classic. But the Buddhist reply stands: *vāsanā*, or latent impression. Through repeated association, the child forms a habit. The inference becomes so compressed, so instantaneous, that it *appears* direct. Just as an expert chess player sees a winning move without calculating, the child 'infers' safety from the tone and source without conscious deliberation. The underlying mechanism remains a movement from a sign (the utterance) to a state of affairs, grounded in past experience of reliability."

  "That stretches 'inference' until it breaks," Ananya argued. "You're conflating the *cause* of acceptance with the *means* of understanding. I can understand a lie perfectly well. I grasp the meaning of 'The sky is green' via *yogyatā*—it is semantically fit, even if false. I only reject the truth-claim based on reliability. If testimony were inference from reliability, I couldn't understand the lie in the first place. The grasp of meaning (*śābdabodha*) precedes the assessment of the speaker. That prior grasp is the distinct *pramāṇa*."

  "Is it distinct, or just a species of perception?" Tenzin asked. "You hear the sound, you perceive the convention. But valid knowledge requires knowing the world corresponds to the words. That correspondence is never perceived; it is always inferred. You admit *yogyatā* requires no contradiction. But 'no contradiction' is just a negative concomitance. If it were contradictory, the inference would fail. So, the conditions you list—expectancy, fitness—are merely prerequisites for the inference to succeed, not evidence of a separate faculty."

  Ananya paused, considering. "If you reduce all language to inference from reliability, you lose the normative force of grammar. *Ākāṅkṣā* isn't evidence; it's a requirement for semantic unity. Words merge into a sentence-meaning (*vākyārtha*) that is more than the sum of parts. Inference deals with relations between distinct entities. Testimony deals with the fusion of symbols into a single intelligible whole. If you call that inference, then 'inference' no longer means 'reasoning from a mark.' It just means 'any knowledge that isn't perception.' That renders your two-fold scheme vacuous."

  Tenzin sighed, picking up his briefcase. "Perhaps. But parsimony (*lāghava*) is a virtue in epistemology. If I can explain the child, the liar, and the saint using perception and inference, why multiply entities? Your independent *śabda* risks becoming a black box where we hide things we can't explain inferentially."

  "And your parsimony risks explaining away the phenomenon to save the theory," Ananya replied, shouldering her bag. "You treat the hearer as a detective constantly evaluating evidence. Sometimes, we are just listeners. The trust is in the language itself, not just the speaker."

  "Then we disagree on where the burden of proof lies," Tenzin said, walking toward the door. "I see a single mechanism with varying degrees of conscious access."

  "And I see a categorical difference in how meaning arrives," Ananya followed. "Perhaps the next panel will settle it."

  "Unlikely," Tenzin smiled. "But the debate keeps the fire burning."

  "Better than the smoke," Ananya quipped, and they walked out together.
