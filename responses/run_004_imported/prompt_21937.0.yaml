  2.  **Deconstruct the Philosophical Landscape:**
      *   **Stalnaker's Unified Theory (1968, 1975):**
          *   Semantics: Truth-conditional. $A > C$ is true at $w$ iff $C$ is true at $f(A, w)$.
          *   Indicatives: Selection constrained by the context set (epistemically accessible worlds).
          *   Counterfactuals: Selection constrained by similarity metrics (often allowing worlds outside the context set).
          *   Motivation: Simplicity, uniformity of logical form.
      *   **Adams' Thesis (1965, 1975):**
          *   Indicatives do not express propositions (no truth conditions).
          *   Assertability of $A \to C$ equals $P(C|A)$.
          *   Motivation: Explains intuitive judgments about probability better than truth-conditional accounts.
      *   **Lewis's Triviality Result (1976):**
          *   Proof that if conditionals have truth conditions *and* Adams' Thesis holds, then probability functions collapse (become trivial).
          *   Implication: You can't have *both* truth conditions for indicatives *and* Adams' Thesis.
      *   **The "Split" Picture (Orthodoxy):**
          *   Counterfactuals: Truth-conditional (Stalnaker/Lewis).
          *   Indicatives: Non-truth-conditional (Adams/Edgington).
      *   **Unified Survivors:**
          *   Contextualism (Stalnaker's later work).
          *   Trivalent/Supervaluationist approaches (McGee, Bradley).
