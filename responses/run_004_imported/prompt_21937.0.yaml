      *   *Strategy B: Modify Logic/Semantics.* Trivalent semantics (True/False/Undefined). If the conditional lacks a truth value when the antecedent is false, Triviality proofs (which assume bivalence) might not apply.
      *   *Strategy C: Context Sensitivity.* Stalnaker's "Context Set." The selection function changes based on what is presupposed.
      *   *Strategy D: The Restrictor Analysis (Kratzer).* This is the big gun. "If" isn't a connective; it's a modal restrictor. This unifies the syntax/semantics without committing to a propositional conditional operator that falls prey to Lewis's proof in the same way.

