answer: |-
  This is a fantastic pedagogical challenge. You are right to sense that students often gloss over the deep architectural differences between Lewis and the interventionists because the surface grammar ("if C hadn't happened...") looks identical. If you present them merely as competing analyses of the *same* counterfactual conditional, Interventionism will inevitably look like a "patch" for Lewis's bugs.

  To push back effectively, you need to show your students that Lewis and Woodward are actually playing different games. Lewis is engaged in a project of **metaphysical reduction** (grounding causation in the Humean mosaic), whereas Woodward is engaged in a project of **conceptual elucidation** (clarifying the causal claims made in the special sciences).

  Here is a detailed breakdown of the three areas you identified, designed to help you structure that seminar session.

  ---

  ### 1. Redundant Causation: Intrinsic Processes vs. Structural Encoding

  The case of early preemption (the two assassins) is the standard battleground.

  **Lewis's Struggle:**
  In his 1973 account, causation is simple counterfactual dependence. In preemption cases, dependence fails (if Assassin 1 hadn't shot, Assassin 2 would have, so the death still occurs). Lewis realized this was fatal to the simple view.
  *   **The Fix (2000):** Lewis moved to "Causation as Influence." He argued that while the *event* of death might not depend on Assassin 1's shot, the *manner* or *time* of death does. He relies heavily on the idea of an **intrinsic causal process**. The chain from Assassin 1 to the victim is intrinsic to that process; the backup chain from Assassin 2 is extrinsic (it's cut off).
  *   **The Cost:** This requires a robust metaphysics of "intrinsicness" and "processes." It commits Lewis to the view that there is a physical "glue" connecting cause and effect that exists independently of counterfactuals. He had to add metaphysical machinery to save the counterfactual analysis.

  **Interventionism (SEM):**
  The Structural Equation Model (SEM) approach handles preemption seemingly effortlessly.
  *   **The Mechanism:** In an SEM, we represent the scenario with equations. Let $A_1$ be Assassin 1, $A_2$ be Assassin 2, and $D$ be Death.
      *   $A_2 = 0$ (Assassin 2 does not shoot because he sees 1 shoot).
      *   $D = \max(A_1, A_2)$.
  *   To test if $A_1$ caused $D$, we perform an **off-path counterfactual**. We hold $A_2$ fixed at its *actual* value (0) and ask: "If $A_1$ were 0 (and $A_2$ remained 0), would $D$ be 0?" The answer is yes. Therefore, $A_1$ is a cause.
  *   **The Difference:** Notice what happened here. The SEM didn't *discover* the causal structure; it **encoded** it. To write the equation $A_2 = f(A_1)$ (representing that 2 watches 1), you already had to know that 1's action prevents 2's action.

  **The Pedagogical Point:**
  Lewis tries to *derive* the causal verdict from the counterfactuals plus the Humean mosaic. The Interventionist *inputs* the causal structure into the model to generate the counterfactuals.
  *   **Lewis:** Counterfactuals $\rightarrow$ Causation.
  *   **Interventionism:** Causal Structure (Graph) $\rightarrow$ Counterfactuals.

  If students think Interventionism "solves" preemption better, ask them: *Where did the arrows in the graph come from?* If the arrows represent causal relations, the SEM hasn't analyzed causation; it has represented it. Lewis is trying to tell you what makes the arrows real; Woodward is telling you what the arrows mean for scientific inference.

  ### 2. Variables and Model Choice: Relocating the Difficulty?

  You asked whether grounding counterfactuals in interventions just relocates the difficulty into the choice of variables. The short answer is **yes**, but Interventionists argue this is a feature, not a bug.

  **Lewis's Objectivity:**
  For Lewis, causal claims are objective features of the world. Once the particular matters of fact (the Humean mosaic) are fixed, and the laws (Best System) are fixed, the truth value of "C caused E" is fixed. It does not depend on how we describe it. If we include or exclude variables, we are just changing our description, not the causation itself.

  **Woodward's Relativity:**
  Woodward explicitly accepts that causal claims are **relative to a variable set** $\mathbf{V}$.
  *   **The Problem:** If I model the system as $\{ \text{Smoking}, \text{Cancer} \}$, smoking causes cancer. If I model it as $\{ \text{Smoking}, \text{Tar}, \text{Cancer} \}$, smoking causes tar, and tar causes cancer. Is smoking a *direct* cause of cancer? It depends on the grain of the model.
  *   **The "Relocation":** You are correct that the hard work is shifted to selecting the "appropriate" variables. Woodward admits there is no algorithm for this. It depends on what distinctions are **explanatorily relevant** to the inquirer.
  *   **The Philosophical Payoff:** This reveals that Interventionism is not a metaphysical theory of what causation *is* in the bedrock of reality, but a theory of **causal explanation**. Causation is tied to the possibility of manipulation and explanation. If a variable isn't included in the model, we can't intervene on it, so it can't be a cause *relative to that model*.

  **The Pedagogical Point:**
  Lewis wants a "God's Eye View" of causation (objective, description-independent). Woodward offers an "Agent's Eye View" (perspectival, tied to possible manipulations and explanatory interests).
  *   If your students think Interventionism is just "Lewis with math," ask them: *Can a causal claim be true for Lewis but false for Woodward?*
  *   **Answer:** Yes. If there is a causal connection in the world (Lewis) that no agent could possibly intervene on (e.g., causes involving the Big Bang or black hole singularities), Lewis counts it as causation. Woodward might say causal talk is inappropriate there because the manipulation condition cannot be met. This shows they are defining the *extension* of the concept differently.

  ### 3. Reductivity vs. Primitives: The Circle of Intervention

  This is the deepest metaphysical divergence.

  **Lewis's Reductive Ambition:**
  Lewis is a Humean Supervenience theorist. He wants to analyze causation in terms of **non-causal** facts (spatiotemporal relations, properties, laws).
  *   He analyzes counterfactuals using similarity of possible worlds.
  *   He analyzes laws using the Best System Account (regularities).
  *   **Goal:** Eliminate causal primitives. The universe is just a mosaic of qualities; causation is a pattern we discern in that mosaic.

  **Woodward's Non-Reductive Realism:**
  Woodward is not trying to reduce causation to non-causal terms. He is a realist about causes, but he thinks the reductive project fails.
  *   **The Definition of Intervention:** An intervention variable $I$ on $X$ with respect to $Y$ must satisfy conditions like: $I$ causes $X$, and $I$ does not cause $Y$ except through $X$.
  *   **The Circularity:** Notice the definition of "intervention" uses the word "causes." Lewis would call this viciously circular. Woodward calls it **illuminating**.
  *   **The Defense:** Woodward argues that we understand "intervention" via our practical experience of agency. We don't need to reduce "cause" to "non-cause" to have a valid theory. We are elucidating the network of causal concepts (intervention, direct cause, total cause) by showing how they hang together.

  **The Pedagogical Point:**
  This is where you can decisively separate the two views.
  *   **Lewis:** "What are the truthmakers for causal claims in a world without agents?" (Metaphysics)
  *   **Woodward:** "What do scientists mean when they claim X causes Y, and how do they test it?" (Philosophy of Science)

  If you ask Woodward, "But what *is* causation, ultimately?" he will likely say, "It's a primitive feature of the world that supports invariant generalizations." If you ask Lewis, he says, "It's a pattern of counterfactual dependence supervening on the mosaic."

  ### Synthesis: Are They Closer Than They Seem?

  You asked to be open to the possibility that they are closer together. There is one area of convergence: **The Semantics of Counterfactuals.**

  Woodward largely accepts the Lewis-Stalnaker semantics for evaluating the counterfactuals *once the model is set up*. When Woodward says "If we intervened to set X=0, Y would change," he relies on a logic of counterfactuals that looks very Lewisian (closest possible world where the intervention occurs).

  **However, the "Truthmaker" Divergence remains:**
  *   For Lewis, the truthmaker for the counterfactual is the **similarity relation between worlds**.
  *   For Woodward, the truthmaker for the counterfactual is the **causal structure (the equations)** which represents invariant relationships.

  ### Suggested Seminar Strategy

  To prevent students from collapsing the two views, I recommend structuring the discussion around this triad:

  1.  **The Direction of Analysis:**
      *   Lewis: Counterfactuals $\rightarrow$ Causation.
      *   Woodward: Causation (Graph) $\rightarrow$ Counterfactuals.
      *   *Discussion Question:* If Interventionism requires a causal graph to generate counterfactuals, does it presuppose the very thing it's trying to explain? (Woodward: No, it's not reductive. Lewis: Then it's not an analysis of causation.)

  2.  **The Role of the Agent:**
      *   Lewis: Causation exists in a world without humans (e.g., colliding stars).
      *   Woodward: Causation is tied to "possible interventions." If an intervention is physically impossible (e.g., manipulating the mass of the moon), is it still a cause?
      *   *Discussion Question:* Does Interventionism make causation anthropocentric? Woodward says "no, interventions are defined by modularity, not human ability," but the link to manipulation is tight.

  3.  **The Preemption Test:**
      *   Have students draw the SEM for the two assassins.
      *   Ask: "What justifies drawing the arrow from Assassin 1 to Assassin 2 (the inhibition)?"
      *   If they say "Because 1 caused 2 not to shoot," point out they are using causation to build the model that defines causation.
      *   Contrast this with Lewis trying to find the "intrinsic process" in the physical facts alone.

  ### Conclusion for Your Lecture

  You can conclude that Interventionism is not a *rival metaphysical theory* to Lewis, but rather a *rival explication of the concept* for scientific purposes.

  *   **Lewis** answers: "What is the metaphysical ground of causal relations?"
  *   **Woodward** answers: "What is the logical structure of causal explanation?"

  If your students treat Interventionism as a refinement of Lewis, they are assuming the question is "How do we analyze counterfactuals?" But for Woodward, the counterfactuals are the *tool*, not the *foundation*. The foundation is invariance under intervention. By highlighting that Woodward happily accepts causal primitives (interventions) while Lewis desperately tries to eliminate them, you show that they are fundamentally distinct philosophical projects. One is metaphysics; the other is methodology.
