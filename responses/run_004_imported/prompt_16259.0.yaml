  **Enoch's third-factor reply (S):** This offers the most direct positive explanation for the correlation between fitness and truth without causal tracking, preserving non-naturalist realism while granting evolutionary influence.

  **Vavova's objection (A):** Her methodological critique undermines the dialectical legitimacy of the debunking argument itself, though it functions more as a shield than a positive metaphysical account.

  **FitzPatrick's appeal to rational reflection (A):** This complements Enoch by detailing the mechanism through which evolved instincts are refined into truth-tracking judgments, though it relies heavily on the success of the third-factor link.

  **Wielenberg's epistemic-parity argument (B):** While powerful, this defense relies on a controversial analogy between moral and logical beliefs that skeptics often reject as disanalogous regarding evolutionary shaping.

  **Copp's naturalist, society-centered account (B):** This avoids the dilemma effectively by naturalizing moral facts, but it concedes the non-naturalist metaphysics typically implied by "robust" realism in this debate.

  **Street's own constructivist dissolution (C):** This resolves the dilemma by rejecting the realist premise entirely, thereby conceding that robust mind-independent realism cannot survive the evolutionary challenge.

  **Joyce's evolution-driven moral skepticism (D):** This accepts the skeptical conclusion of the dilemma, offering the least support for a realist project by abandoning the justification for moral beliefs altogether.
