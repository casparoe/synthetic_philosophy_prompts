  For my philosophy of science class we just went over Popper's account of verisimilitude, and it finally clicked for me why theory change in science isn't just sociology or some vague Kuhnian "paradigm shift" thing: Popper actually gives a formal definition of truthlikeness, comparing what he calls the truth content and falsity content of two theories, that lets you say in a rigorous, calculable way that one false theory is objectively closer to the truth than another false theory. That seems like a genuinely huge result, so I don't get why it isn't the standard tool historians and philosophers of science reach for to settle stuff like whether Bohr's model of the atom was closer to the truth than Thompson's plum pudding model, or whether general relativity has more verisimilitude than Newtonian gravity. Feels like you could just compute the content classes for each theory and the argument would basically be over.

  Can you actually walk me through how that calculation would go for one of those, say Bohr vs. Thompson? I wanna understand the mechanics of comparing truth content and falsity content well enough to explain it properly to my study group, since our professor moved on to Lakatos pretty fast and I feel like I only got the headline version of the idea.
