  Slightly random request but here's the situation. I'm taking a philosophy of mind seminar this term (officially titled "Minds and Machines," not exactly subtle) and we just spent three weeks on the Lucas-Penrose argument -- Lucas's original 1961 paper plus the version Penrose reworked in Shadows of the Mind -- and it turns out our professor, Dr. Okonkwo, is retiring at the end of the year after basically her whole career defending some form of that argument, through wave after wave of people (starting with Putnam, I think?) pointing out that the whole move only works if she already knows her own "formal system" is consistent, which by Godel's second theorem she can't actually prove from the inside. She's also got this running bit in seminar where instead of just telling you that you contradicted yourself she goes "ex falso quodlibet" and moves on to the next hand.

