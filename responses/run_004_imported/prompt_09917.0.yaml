          *   4. DE's stance on the analysis project (Do you even care?).
          *   5. Dormitive Virtue/Explanatory Power.
          *   6. Iterated Finks/Regress.
          *   7. Modal Strength (Necessitation vs. Interference).
          *   8. Empirical Equivalence/Falsifiability.
          *   *Wait, I need to check the prompt requirements again.*
          *   Reqs: 1. Martin's fink kill SCA. 2. Mask vs Fink distinctness (Lewis RCA context). 3. Fundamental powers vs Dormitive virtue. 4. Iterated finks/regress. 5. Evidence against DE.
          *   Okay, I will structure 8 questions to cover these, escalating in difficulty.

      *   *Revision for Flow:*
          1.  **SCA & Martin:** Establish the baseline failure.
