          5.  **Dormitive Virtue:** Is "fundamental power" just a label?
          6.  **Iterated Finks:** The regress challenge.
          7.  **Modal Force:** How can a *necessary* connection be finked/masked?
          8.  **Falsifiability:** The hard closer.

      *   *Refining Follow-ups:* The follow-ups need to anticipate the "standard" DE answer and push back.
          *   *Example:* If she says "Finks don't affect fundamental powers," ask "Then why do manifestations fail?"
          *   *Example:* If she says "It's not dormitive virtue because powers have structure," ask "What structure if they are fundamental?"

  4.  **Final Polish:**
      *   Ensure the tone is respectful but sharp (seminar style).
      *   Check that the "hardline dispositional essentialist" perspective is accurately represented (e.g., Bird, Mumford, Ellis).
      *   Make sure the "increasing difficulty" constraint is met. The early questions are about standard literature (Martin/Lewis). The middle questions are about her specific ontology. The final questions are about the viability of the whole project.

  5.  **Self-Correction during drafting:**
      *   *Critique:* Question 4 might be too soft.
