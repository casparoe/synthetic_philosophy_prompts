      *   *Bottom Tier (D):* **Predictive Parity** & **Statistical Parity**. Why? Predictive Parity often forces higher FPR on lower base-rate groups (Chouldechova). Statistical Parity ignores risk entirely, potentially compromising public safety or requiring quota-like mechanisms that are legally/ethically dubious in sentencing/detention.

