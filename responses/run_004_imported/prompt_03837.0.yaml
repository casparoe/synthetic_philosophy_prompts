      *   *Monotonicity (KS):* If the pie gets bigger for one person (the feasible set expands in their favor), they shouldn't end up worse off.
          *   *Intuition:* If my best possible outcome improves, my actual outcome should improve (or stay same), not shrink.
      *   *Fairness:* Is KS "fairer"? It respects the *relative* potential. If I can potentially get 100 and you can potentially get 10, KS gives me more than NBS might, because it looks at the ratio of potential gains.
      *   *Tie-breaking:* Both are normative. Neither is "physical law." They are definitions of "reasonable." KS feels more intuitive to some regarding opportunity sets.

