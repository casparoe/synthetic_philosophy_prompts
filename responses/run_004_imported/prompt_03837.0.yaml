  2.  **Deconstruct Question 1: Edgeworth's "Settlement" vs. "Final Settlement"**
      *   *Concept:* Edgeworth is describing a dynamic process, not just a static snapshot.
      *   *Settlement:* A deal where the current parties are happy *right now*. They agree. No one *in the deal* wants to change it *between themselves*.
      *   *Final Settlement:* A deal that survives outside pressure. Even if A and B agree, if C comes along and offers A a better deal, A might ditch B.
      *   *The "Field of Competition":* This is the set of potential alternative partners.
      *   *Why it matters:* It distinguishes between a *local* optimum (Pareto efficiency between A and B) and a *market* equilibrium (where no outside options exist to disrupt the deal).
      *   *Analogy:* Think of the user's property situation.
          *   *Settlement:* You and your sister agree on a split.
          *   *Final Settlement:* You and your sister agree, *and* no third party (like a buyer offering a lump sum to just one of you, or a developer) can come in and offer one of you a better deal that breaks the agreement.
          *   *Wait, actually:* In the 2-person inheritance case, there *is* no field of competition (usually). That's why Edgeworth says it's "indeterminate."
      *   *Key Insight:* Edgeworth is bridging the gap between bilateral monopoly (2 people) and perfect competition (many people). The "recontracting" process is the mechanism that drives the set of possible outcomes down from a curve to a point as more people enter the market.

  3.  **Deconstruct Question 2: Nash vs. Kalai-Smorodinsky (KS)**
      *   *The Problem:* Edgeworth says 2-person bargaining is indeterminate (the Contract Curve). Any point on the curve is efficient. Which one?
      *   *Nash Bargaining Solution (NBS):* Maximizes the product of gains. Axioms: Efficiency, Symmetry, Independence of Irrelevant Alternatives (IIA), Invariance.
      *   *Kalai-Smorodinsky Solution (KSS):* Maximizes proportional gains relative to the ideal point. Axioms: Efficiency, Symmetry, *Monotonicity*, Invariance. (Drops IIA).
      *   *The Crux:* IIA vs. Monotonicity.
      *   *IIA (Nash):* If you remove options that *weren't chosen*, the choice shouldn't change.
