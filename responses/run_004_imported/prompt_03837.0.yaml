answer: |-
  It is genuinely impressive that you went straight to *Mathematical Psychics*. Edgeworth is notoriously difficult; even professional economists often rely on summaries because his "Victorian prose" (as you aptly put it) obscures some very sharp mathematical intuition. You have hit on the exact pivot point where classical economics turns into modern game theory.

  Here is an breakdown of the two puzzles you raised, keeping the math light and the intuition heavy.

  ### Part 1: Edgeworth's "Settlement" vs. "Final Settlement"

  To understand why Edgeworth needs two definitions, you have to view him not as describing a static moment, but a **dynamic process**. He is trying to describe how a market price emerges from chaos.

  **1. The "Settlement" (Internal Stability)**
  A "settlement" is simply a deal where the people currently involved are happy enough not to change it *between themselves*.
  *   **In your context:** You and your sister agree on a 50/50 split of the sale proceeds. You both sign a paper. At that moment, neither of you wants to unilaterally change the deal. That is a *settlement*.
  *   **The Problem:** Just because you and your sister agree doesn't mean the deal is stable. What if a third party (a "vulture" investor) approaches you and says, "I know you agreed on 50/50, but I'll buy *your* share of the property directly for a lump sum that gives you 60% of the value, leaving your sister with nothing"?
  *   If you accept, the original "settlement" is broken.

  **2. The "Field of Competition" (External Stability)**
  This is the crucial addition. The "field of competition" consists of everyone else who *could* have been involved but isn't yet.
  *   **Recontracting:** Edgeworth uses this term to describe the ability to ditch your current partner for a better offer from someone in the "field."
  *   **Final Settlement:** A deal is only "final" if no one *outside* the deal can offer one of the insiders a better arrangement that breaks the current contract.

  **Why does this distinction matter?**
  Edgeworth is building a bridge between **Bilateral Monopoly** (two people, no options) and **Perfect Competition** (thousands of people, many options).

  *   **In your inheritance case:** You have a "Contract without competition." There is no third sibling, and presumably, you can't sell your half of the house to a stranger without selling the whole house (depending on local law, but let's assume for the bargaining dynamic that you are locked in). Because there is no "field of competition" to discipline you, *any* agreement you reach that you both prefer to not selling at all is a "Final Settlement."
  *   **The Indeterminacy:** Because there are many possible splits (60/40, 50/50, 70/30) that you would both accept rather than fighting forever, and no outside market force to push you to a specific one, the outcome is **indeterminate**. The math cannot tell you which point on the line you will pick, only that you will pick somewhere on the line.

  **Summary:** "Settlement" means "we agree." "Final Settlement" means "we agree, *and* no outsider can break us up." In a two-person vacuum, every settlement is final, which is why the result is indeterminate. Edgeworth needed the distinction to show that as you add more people to the market (increasing the "field of competition"), the number of "Final Settlements" shrinks until, in perfect competition, there is only one price left.

  ***

  ### Part 2: Nash vs. Kalai–Smorodinsky (Resolving the Indeterminacy)

  You are correct that Edgeworth threw up his hands at the two-person case. He said, essentially, "Math can't solve this; it depends on psychology and bargaining skill."

  John Nash (1950) later said, "Actually, if we agree on what 'reasonable' means, math *can* solve it." He proposed a solution based on four axioms. Later, Ehud Kalai and Meir Smorodinsky (1975) proposed a rival solution.

  To answer your core question: **Is Kalai–Smorodinsky a principled resolution or just a dressed-up tie-breaker?**

  The honest answer is: **It is a principled tie-breaker.** Neither solution describes a physical law of the universe (like gravity). They are *normative* theories. They don't predict what people *will* do; they prescribe what people *ought* to agree to if they want to be "rational" in a specific ethical sense.

  However, the difference between them hinges on how they handle **leverage**, which is where your "fairness" intuition comes in.

  #### 1. The Nash Bargaining Solution (NBS)
  Nash's solution picks the point that maximizes the *product* of the gains.
  *   **The Key Axiom:** **Independence of Irrelevant Alternatives (IIA).**
  *   **What it means:** If you have a menu of possible deals, and you choose Deal A, removing Deal B from the menu (which you weren't going to pick anyway) shouldn't make you switch to Deal C. The presence of "bad" options shouldn't change the choice of the "good" option.
  *   **The Intuition:** This treats the bargaining problem as context-free. It focuses purely on the local shape of the agreement curve at the solution point.

  #### 2. The Kalai–Smorodinsky Solution (KSS)
  Kalai and Smorodinsky felt Nash's solution could be unfair in specific scenarios. They replaced IIA with **Monotonicity**.
  *   **The Key Axiom:** **Monotonicity.**
  *   **What it means:** If the set of possible deals expands *in your favor* (i.e., your maximum possible payoff increases, while the other person's stays the same), your actual agreed payoff should not decrease.
  *   **The Intuition:** This respects **relative potential**. If my "best case scenario" gets better, my bargaining power has objectively increased. Nash's solution might ignore this if the "shape" of the curve nearby doesn't change much. Kalai–Smorodinsky says: "If your ceiling goes up, your floor should go up too."

  #### A Concrete Example
  Imagine you and your sister are splitting \$100.
  *   **Status Quo:** If you don't agree, you both get \$0.
  *   **Scenario A:** You can split the money any way (0 to 100 for you).
      *   *Nash & KSS:* Both likely suggest \$50/\$50 (due to symmetry).
  *   **Scenario B:** A new option appears. Now, it is possible for you to get \$90 (perhaps you have a slight legal claim to more), but your sister still caps at \$100. The "pie" hasn't grown, but your *slice of the potential pie* has grown.
      *   **Nash:** Might still suggest close to 50/50 because the "irrelevant" option of you getting \$90 wasn't chosen, so why should it change the split? (Depending on the exact curve, Nash can be insensitive to the "utopia point").
      *   **Kalai–Smorodinsky:** Will explicitly shift the split in your favor. It draws a line from the disagreement point (\$0,\$0) to the "ideal point" (Max You, Max Sister). Where that line hits the efficient frontier is the solution. If your Max increases, that line pivots, and you get more.

  #### Which is "Fairer"?
  *   **Choose Nash if:** You believe fairness means consistency. You don't want the outcome to change just because a hypothetical, unchosen option was added to the table. It isolates the agreement from "phantom" leverage.
  *   **Choose Kalai–Smorodinsky if:** You believe fairness means recognizing **opportunity**. If one party *could* have gotten more (even if they didn't), that represents latent power that should be rewarded.

  In your inheritance dispute, **Kalai–Smorodinsky feels more intuitive to most laypeople.** If you have a stronger legal claim (a higher "ideal point"), KSS says you should get more of the settlement. Nash might dampen that advantage depending on the curvature of the utility functions.

  ### The Verdict on Edgeworth's Problem
  Does KSS resolve Edgeworth's indeterminacy? **Yes, mathematically.** It picks a single point on the "contract curve."
  Is it objective truth? **No.** It is a formalization of a specific philosophy of fairness (proportionality of gains relative to potential).

  Edgeworth was right that without a "field of competition" (market forces), there is no *physical* force pushing you to a specific number. Nash and Kalai–Smorodinsky provide *logical* forces. They say, "If you want to be rational and fair according to *these specific rules*, here is the number."

  For your situation with your sister: Edgeworth explains *why* it is thorny (you are in the indeterminate zone). Nash and Kalai–Smorodinsky offer you two different definitions of "fair" to propose to her. If she values consistency, show her Nash. If she values recognizing individual leverage/claims, show her Kalai–Smorodinsky. The math won't force her to agree, but it might give you a shared vocabulary to stop the "war" and sign the "pact."
