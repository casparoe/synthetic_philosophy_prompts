answer: |-
  The air in the arbitration bunker tasted of recycled ozone and cold coffee. Elias Vane sat at the center of the steel table, his headset heavy on his temples. Outside the three-meter-thick concrete walls, two armies waited: the Coalition in the north, the Freehold in the south. They had been at war for forty years. They had stopped fighting three days ago because of a single word Elias had translated.

  The word was *Sanctum*.

  In the draft treaty, Article 4 stated: *"All personnel retreating to the Zone shall be granted Sanctum."*

  For three days, the Coalition had been retreating. They had left their heavy tanks, their artillery, their drones. They carried only their sidearms and their packs. The Freehold had let them pass. *Sanctum* held.

  Now, however, the Coalition's 104th Division was approaching the gate. They were not carrying tanks. They were wearing exoskeletons.

  The Freehold commander, a woman named Kaelin with a scar running through her left eyebrow, slammed her hand on the table. "The exosuits are heavy weaponry. They amplify strength tenfold. *Sanctum* forbids weapons. They violate the treaty."

  The Coalition liaison, a stiff man in a grey uniform, shook his head. " *Sanctum* forbids *offensive* capability. The suits are defensive. They allow our men to survive the terrain. In every previous retreat, your guards allowed boots, flak jackets, and comms gear. An exosuit is just advanced gear. It fits the rule."

  They both turned to Elias. He was the Architect. He had written the translation. He had taught both sides the vocabulary of peace.

  "Elias," Kaelin said, her voice low. "You taught us *Sanctum*. You said it meant 'Safety from harm, without the means to inflict it.' If those suits walk through, my people are dead. The treaty is void. We resume shelling in one hour."

  The Coalition liaison leaned in. "Elias. You translated *Sanctum* for us in the training simulations. We wore reinforced pads. We carried comms. You nodded. You said, 'This is Sanctum.' An exosuit is a logical extension of reinforced pads. If you stop them now, you are changing the rule. You are lying."

  Elias closed his eyes.

  He needed to find the fact. That was the instinct of a lifetime. In physics, in law, in language—if there is a truth, there is a corresponding fact that makes it true. He needed to locate the mental state he had occupied ten years ago when he first coined the translation for *Sanctum*.

  He reached back into his memory. He remembered the feeling of *safety*. He remembered the intention: *I want them to be safe, but not dangerous.*

  But that was useless. "Safe" and "dangerous" were the very terms in dispute.

  He searched for a specific boundary. Had he imagined a weight limit? No. He had never imagined an exosuit. Had he imagined a strength multiplier? No. In all his past uses of the word—in the simulations, in the preliminary skirmishes, in the drafts—the maximum force a retreating soldier could bring to bear was a human with a pistol.

  The data was finite. His past usage of *Sanctum* was compatible with two rules:
  1.  *Sanctum* means "No weapons heavier than a pistol."
  2.  *Sanctum* means "No weapons heavier than a pistol, *unless* the technology evolves, in which case it means 'No weapons heavier than whatever a pistol is equivalent to in new tech.'"

  Both rules fit every single instance of his past behavior perfectly. There was no moment in his history where he had corrected someone for wearing a "pistol-equivalent exosuit," because such a thing had not existed.

  A cold dread, familiar to any scientist who has realized their model is underdetermined by the data, washed over him.

  There was no fact.

  He looked at his hands. There was no neural imprint, no ghostly snapshot in his mind from ten years ago that locked the meaning of *Sanctum* to exclude exosuits. His past intentions were open to interpretation. He was, in this moment, functionally identical to a machine programmed to output "Yes" for every number up to 1,000, but who now had to decide whether to output "Yes" or "No" for 1,001. Nothing in the machine's past dictated the next step.

  If he ruled for the Freehold, the Coalition would claim he was retroactively changing the meaning, violating the treaty, and justify resuming the war.
  If he ruled for the Coalition, the Freehold would claim *Sanctum* was a lie, that their safety was compromised, and justify resuming the war.

  "Elias?" Kaelin prompted. The clock on the wall ticked. Fifty minutes.

  He felt the vertigo of the void. If meaning is not fixed by past facts, then language is a game played without a board. He was not *discovering* what *Sanctum* meant; he was *deciding* it. But on what basis? If he just decides, isn't that arbitrary? Isn't that just power masquerading as interpretation?

  He looked at the Coalition liaison. "You believe you are following my rule."
  "I know I am," the man said. "My actions align with every correction you ever made."
  "And you," Elias turned to Kaelin. "You believe they are violating it."
  "Because the spirit of the rule is safety," she said.

  *Spirit.* That was a plea for a ghost. A ghost fact.

  Elias took a breath. He realized then that the search for the "past fact" was the trap. Kripke's skeptic was right about the past: there is no super-luminous fact that bridges the gap between then and now. But the skeptic was wrong about the solution. The solution wasn't to despair of meaning; it was to recognize that meaning is not a *description* of a mental state. It is a *commitment* to a practice.

  Meaning is not looking backward; it is looking forward.

  To mean something by a word is not to have a specific image in mind; it is to accept liability for how that word is used in the future. It is to step into the stream of the "form of life" and accept that one's judgment *constitutes* the rule, provided it sustains the practice.

  If he allowed the exosuits, the practice of "retreat without threat" would collapse. The Freehold would stop accepting retreats. The treaty would become dead letter. The *use* of the word *Sanctum* would cease to function as a bridge between enemies.

  The "fact" of what he meant ten years ago did not exist. But the "truth" of what he must say now was determined by the necessity of keeping the language game alive.

  Elias opened his eyes. The vertigo was gone, replaced by a heavy, sober clarity. He was not a vessel channeling a past intention. He was a judge creating a precedent.

  "The Coalition is incorrect," Elias said. His voice did not shake.

  The liaison stood up. "On what basis? You cannot cite a prior instance. There is none."

  "I am not citing a prior instance," Elias said. "I am citing the condition of the treaty's existence."

  He turned to Kaelin. " *Sanctum* is not a static definition. It is a promise of non-aggression. An exosuit alters the balance of aggression. To allow it would be to make the word *Sanctum* useless for its purpose. If I allowed it, I would be breaking the rule, not because I violated a past mental state, but because I would be destroying the practice that gives the word meaning."

  He looked at the liaison. "You argue that your suit fits the pattern of my past approvals. But you are treating my past approvals as data points in a curve. They were not data. They were acts of trust. You cannot extend trust to a weapon that breaks the trust of the other party."

  "So you admit," the liaison said, "that there was no fact about the suit in your original meaning?"

  "There was no fact," Elias said. "There was only a commitment. And I am honoring that commitment now by ruling against you."

  "And if we refuse to accept your ruling?"

  "Then you prove that you never intended to follow the rule of *Sanctum* at all, but only to exploit its ambiguity. And the Freehold will know you are not partners in peace, but predators in grammar."

  The room went silent. The threat was clear. If the Coalition pushed the semantic loophole, they admitted they were bad actors. The "community" of the treaty would cast them out.

  The liaison sat down slowly. He looked at Kaelin, then at Elias. He understood. The meaning wasn't in the past. It was in the consequence of the next hour.

  "The 104th will remove the suits," the liaison said quietly. "They will walk through in fatigues."

  Kaelin exhaled, a long, shuddering breath. She nodded to Elias.

  Elias removed his headset. He placed it on the table. He felt exhausted, not from the tension, but from the realization. He had spent his life believing that words were containers for thoughts, and that disputes were about checking the contents.

  He saw now that words were tools, and the "meaning" was the grip required to use them without cutting oneself. There was no metaphysical glue holding his past to his present. There was only the responsibility of the hand that held the tool.

  He stood up and walked to the window. Outside, the first of the 104th was stepping out of the exosuit. They were just men now. Vulnerable.

  Elias knew that in ten years, someone would invent a new weapon. A nano-suit. A neural link. And someone would ask him again: *Does this fit the rule?*

  And he knew, with a terrifying freedom, that the answer would not be found in his memory. It would be found in his courage to say "No" when the practice required it, and to bind himself to that "No" as if it had always been true.

  He turned back to the room. "Draft the amendment," he said. "Define *Sanctum* by biological baseline. No amplification."

  "Is that what you meant originally?" Kaelin asked.

  Elias smiled, a thin, tired expression. "It is what I mean now. And that is the only fact that matters."
