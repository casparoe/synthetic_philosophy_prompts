answer: |-
  Here is the position: **Scott Aaronson's freebits hypothesis is a triumph of physical speculation but a failure of philosophical analysis.** Even if we grant every physical premise—that freebits exist, that they maintain Knightian uncertainty through cosmic history, and that neural processes amplify them to macroscopic scale—the framework does absolutely no work to salvage libertarian free will. It solves the problem of *prediction*, but it leaves the problem of *control* entirely untouched. By conflating "unpredictable in principle" with "free in a morally relevant sense," Aaronson constructs a sophisticated defense of randomness and mislabels it as agency.

  To see why, we first have to acknowledge where the freebits argument is strongest. The standard incompatibilist dilemma is a pincer movement: if determinism is true, you are a clockwork mechanism; if indeterminism is true, you are a dice-roller. In both cases, *you* are not the author of your actions. Aaronson's move is to try to slip between the pincers by attacking the definition of indeterminism.

  Standard quantum mechanics offers "risk": the probabilities are known (the Born rule), even if the outcome isn't. A Laplace Demon with quantum capabilities could assign a precise probability distribution to your choices. Aaronson argues this is too restrictive. By introducing Knightian uncertainty—where no prior probability distribution exists even in principle—he creates a zone of physical reality that is opaque to any predictor, including a quantum Laplace Demon. If a decision hinges on a freebit, no entity in the universe could have predicted it, not even probabilistically. This is a genuine contribution to the metaphysics of prediction. It establishes that the future can be open in a stronger sense than standard QM allows.

  However, this victory is purely epistemic. It tells us something about what can be *known* about the future, but libertarians care about what can be *willed* in the present.

  The fatal flaw is that Aaronson's apparatus addresses the **Luck Objection** by denying the luck is predictable, rather than denying the luck is luck. The Luck Objection (championed by Peter van Inwagen and others) states that if a choice is not determined by the agent's prior character, motives, and reasons, then the outcome is a matter of chance. If it's a matter of chance, the agent cannot be responsible for it.

  Aaronson responds by saying, "It's not chance, it's Knightian uncertainty." But from the perspective of the *agent making the choice*, this distinction is vacuous. Suppose I am deciding whether to cheat on my taxes. My reasons, character, and desires are all accounted for, but they leave the decision underdetermined. The tie-breaker is a freebit amplified in my cortex.

  In the standard QM model, the tie-breaker is a quantum event with a 50/50 probability. In the freebits model, the tie-breaker is a microscopic degree of freedom with an unknowable initial condition. In *both* scenarios, ask the same question: **Did I determine the value of the tie-breaker?**

  The answer is no. In the QM case, the value is probabilistic. In the freebits case, the value was fixed at the Big Bang and causally isolated until now. In neither case did the *agent* select the value. The outcome still "happens to" the agent rather than being "authored by" the agent. The fact that the outcome was unpredictable to a God-like observer does not mean it was controlled by the human observer. Unpredictability is a necessary condition for many intuitions of free will, but it is not a sufficient one. A chaotic weather system is unpredictable in principle due to sensitivity to initial conditions, but we do not grant the atmosphere moral responsibility for a hurricane.

  Aaronson leans heavily on computational complexity to do the heavy lifting here, suggesting that if a process is computationally irreducible or relies on unknowable initial data, it qualifies as a kind of freedom. But complexity is not agency. If my decision is the output of a function $f(\text{Reasons}, \text{Freebit})$, and I do not control the input of the Freebit, I do not control the output. The "Knightian" nature of the freebit just means the function is harder to compute than previously thought. It does not mean *I* am the one computing it in a way that bypasses the causal chain.

  Furthermore, the freebits hypothesis actually makes the "sourcehood" requirement for free will *worse* than standard indeterminism. In standard QM, the indeterminacy is local and present-tense. In the freebits model, the decisive factor in my choice was determined 13.8 billion years ago during the Planck epoch. If my decision to drink coffee instead of tea hinges on a freebit, then the "freedom" of that decision is actually a fossilized relic of the early universe's boundary conditions. This is not liberating the agent from determinism; it is chaining the agent to the initial conditions of the cosmos in a way that is merely opaque to prediction. It replaces the tyranny of the present state (determinism) with the tyranny of the initial state (freebits), all while pretending the agent is the one pulling the lever.

  The distinction between Risk and Knightian Uncertainty is vital for economics and decision theory, but it is philosophically inert for the problem of moral responsibility. The skeptic asks: "Could the agent have done otherwise, *in a way that is attributable to the agent*?" Aaronson answers: "Yes, because the universe couldn't have predicted otherwise." This is a non-sequitur. The universe's ignorance of my choice does not constitute my ownership of it.

  Ultimately, the freebits hypothesis is a solution to the problem of **external prediction**, not **internal control**. It successfully argues that a sufficiently physicalist universe might still contain agents whose actions are fundamentally opaque to outside observers. But libertarians want more than opacity; they want authorship. They want the agent to be the *uncaused cause* of the decision. Freebits do not make the agent an uncaused cause; they just make the causal chain leading to the decision incredibly long, complex, and epistemically sealed.

  If the goal is to show that human behavior is not reducible to a computable probability distribution, Aaronson succeeds. But if the goal is to show that humans possess a form of freedom that grounds moral responsibility, the freebits hypothesis is a category error. It dresses up the luck objection in the clothing of computational complexity, but underneath the suit, the luck is still there. The freebit is still a dice roll, even if the dice were cast at the beginning of time and no one knows the odds. And rolling dice, however obscurely, is not an act of will.
