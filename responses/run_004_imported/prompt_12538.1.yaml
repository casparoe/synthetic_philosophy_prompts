          *   *Implication:* In Newcomb's, your choice *now* correlates with the prediction made *then*. In the Hitchhiker case, your disposition *now* (in the car) determines if you get the ride.
          *   *Act vs. Disposition:* Once in town, paying is causally useless (the ride is done). CDT says "Don't Pay." But if you are the *type* who doesn't pay, you don't get the ride. So, the rationality lies in the *disposition*, not the isolated act.

      *   **2. Act-Based vs. Policy/Disposition-Based Rationality:**
          *   *CDT (Causal Decision Theory):* Focuses on the act. "Does paying *now* change the past?" No. So don't pay. This leads to death in the desert.
          *   *EDT/TDT (Evidential/Timeless):* Focuses on what the act *says* about you. Paying indicates you are the kind of person who keeps promises.
          *   *Resolute Choice:* This is key. It's about binding yourself to a plan. You decided (implicitly or explicitly) "I will pay." Resolute choice means sticking to that even when the incentive vanishes.
          *   *Conclusion:* The case argues strongly against pure Act-Based rationality in scenarios involving predictions of your behavior.

      *   **3. Generalizing to Freelance Contracting:**
          *   *The Shift:* Life-and-death vs. Money/Reputation.
          *   *Similarities:* Reputation is the predictor. Subcontractors predict if you'll pay the bonus. If you build a reputation for reneging, no one works fast for you.
          *   *Differences:* Legal enforcement exists (usually). Reputation spreads slower than a rancher's intuition. Stakes are lower.
          *   *The Lesson:* It *does* generalize. Being the "type" who pays bonuses without legal compulsion makes you a preferred client. It's an investment in your "algorithm."
          *   *Caveat:* Don't be a pushover. The disposition should be "I pay promised bonuses," not "I pay anything asked."

      *   **4. Synthesis/Conclusion:**
