      *   *The "Comfort":* Comfort usually comes from emotion. Here, comfort comes from *consistency*. If the universe is consistent, he is not lost.
      *   *Ending:* A formal closing. "Q.E.D." might be too cheeky? Maybe just "The proof holds."

