      *   **The Argument (The "Meat"):** Explain Gödel's reasoning clearly but accessibly. Focus on "Rational Construction" and "Cultivation."
      *   **Applying the Argument to Him:** Show how *he* lived this. His mind was cultivated. It would be a waste for it to vanish.
      *   **The Comfort (The "Turn"):** How does this help the grieving? It means his life wasn't arbitrary. It means the work continues. It means the universe makes sense.
