answer: |-
  Good morning.

  For those who knew him professionally, I don't need to explain that my grandfather was a man who found comfort in structure. For those who knew him only as family, you likely found that out the hard way—usually when you were trying to hug him, or when he was explaining why the turkey carving protocol was inefficient.

  He died on Tuesday. We are here on Saturday. There is a logic to the schedule, just as there was a logic to his life. And he was very specific about the logic he wanted applied to today.

  He left instructions that there should be no talk of him "watching over us." He found the imagery of clouds and harps not just incorrect, but embarrassing. He was not a religious man in the traditional sense. He was a logician. He believed that the universe was rationally constructed, and he believed that our response to it should be equally rigorous.

  But there is a specific piece of his worldview that I have been asked to address. Many of you in the department know it well. The rest of you may have heard him bring it up, perhaps at awkward moments, like Aunt Sarah's memorial service in 2014.

  It concerns Kurt Gödel.

  Most people know Gödel for the Incompleteness Theorems. But Grandfather was devoted to Gödel's private philosophical work—specifically, the argument regarding the afterlife. It wasn't a hope. It wasn't a faith. It was a deduction.

  The argument runs like this:
  Premise one: The world is rationally constructed. It does not act without reason.
  Premise two: A human mind represents a lifetime of "cultivation." It is a complex, developed structure of understanding, memory, and capacity.
  Conclusion: For that structure to be fully developed and then simply cease to exist, without further application or reason, would be irrational. It would be a waste of potential in a system that does not tolerate waste.
  Therefore, the mind must continue.

  I know what some of you are thinking. My friend Dev thought it last night. He asked me if this was just logic dressed up as wishful thinking. He asked if Gödel, and my grandfather after him, just wanted it to be true so badly that they called it a theorem.

  It is a fair question. But to ask it is to misunderstand my grandfather's relationship with the truth. He did not hold this view because it made him feel better. He held it because he could not find a flaw in the derivation. He told this story at other people's funerals not to comfort them, but to correct the record. He believed that offering false comfort was a lie, but offering rational consistency was a duty.

  So, how do we find comfort in a proof?

  For the mathematicians here: You know that a proof does not care if you are sad. It simply *is*.
  For the family: You need to know that he is not gone in the way we fear.

  The comfort here is not that he is in a "better place." The comfort is that the universe is not arbitrary. If the universe is rationally constructed, then my grandfather's life was not an accident that ended in a void. His mind was a tool of immense precision. He spent eighty years sharpening it. He read, he taught, he argued, he loved us in the quiet, steady way he knew how.

  To believe that this cultivation simply vanishes is to believe that the universe is careless. Grandfather did not believe the universe was careless. He believed that energy is conserved, and that thought is a form of energy. He believed that a mind like his, which had spent a lifetime modeling the infinite, could not be contained by the finite boundary of a biological heartbeat.

  In this framework, grief is not a confrontation with nothingness. Grief is the lag time between our current state and the recognition of the continuity.

  He did not want me to tell you he is at peace. "Peace" implies a struggle that has ended. He would say the work continues. The cultivation persists. The variables have simply moved to a different domain.

  I look around this room and I see the two halves of his world. I see the colleagues who shared his language, and I see the family who shared his life. If his argument holds, then the distinction between those two groups is less significant than the fact that you are all here, evidence of his cultivation. We are the axioms he worked with. We are the set that he defined.

  He was a man who needed the world to make sense. And in the end, he demanded that his death make sense, too. He refused the softness of sentiment because he believed the hardness of logic was kinder. Sentiment fades. Logic holds.

  So we do not say "Rest in Peace." We say: The function remains valid. The proof holds. And the work, by necessity, goes on.

  Thank you.
