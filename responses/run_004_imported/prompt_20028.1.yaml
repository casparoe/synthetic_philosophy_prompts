prompt: |-
  A former doctoral advisee of mine—now a specialist in comparative Chinese philosophy—has asked me, her old dissertation advisor, to give the toast at her wedding next month. Her research has left her genuinely persuaded by the Confucian role ethics associated with Roger Ames and Henry Rosemont Jr.: on this view, a person is constituted by her particular relations—daughter, sister, friend, and now wife—rather than being a self-standing individual who merely enters into them from some prior, independent vantage point. She has asked, half in earnest, that the toast avoid the standard Western wedding vocabulary of soulmates, of two halves becoming whole, of two independent people choosing each other against the world, since on her view this vocabulary quietly reinstates a self-sufficient individual who, she would say, was never really there. A few of her fellow comparative philosophers will be in the audience and will notice if the view gets mangled, but her fiancé and most of the other guests have no philosophical background and are simply expecting a warm, ordinary toast. Please write it: about five minutes long, genuinely organized throughout by this relational conception of personhood rather than gesturing at it once before lapsing into the familiar tropes, and moving enough that nobody in the room feels lectured.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Former dissertation advisor.
      *   **Audience:** Bride (former advisee, specialist in comparative Chinese philosophy), Groom (non-philosopher), Guests (mix of philosophers and laypeople).
      *   **Occasion:** Wedding toast.
      *   **Constraint 1 (Philosophical):** Must be organized by Confucian role ethics (Ames/Rosemont view). Personhood is constituted by relations (daughter, sister, friend, wife), not independent individuals choosing each other. Avoid "soulmates," "two halves," "independent people," "against the world."
      *   **Constraint 2 (Emotional/Tone):** Warm, moving, not a lecture. Accessible to non-philosophers while accurate enough for the specialists.
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct Confucian Role Ethics (Ames/Rosemont):**
      *   *Core Idea:* We are not nouns (static individuals); we are verbs (events of relating). We are the sum of our roles.
      *   *Implication for Marriage:* It's not two things joining. It's the creation of a new context that transforms existing roles. The "self" grows through the relationship.
      *   *Key Metaphors:* Focus, field, narrative, weaving, growing, focusing energy (*qi* - though maybe too technical), ritual propriety (*li* - maybe too technical). Better to stick to everyday relational terms.
      *   *Avoid:* Autonomy, choice as a discrete event, completion of a missing part.

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the relationship (advisor/advisee), set the warm tone, acknowledge the specific request (subtly).
      *   **Body Paragraph 1 (The Past/Existing Roles):** Describe the bride not as an isolated scholar, but as a nexus of relationships (student, daughter, friend). This establishes the "constituted by relations" premise without jargon.
      *   **Body Paragraph 2 (The Groom/The New Role):** Introduce the groom not as a "match" but as someone who enters and transforms the field of relations. Marriage as a new focus, not a merger.
      *   **Body Paragraph 3 (The Future/Growth):** The work of marriage as cultivating the relationship (*ren*). It's a continuous process, not a state of arrival.
      *   **Closing:** A toast to the specific roles they will inhabit together.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the advisor/advisee dynamic. It's a specific relation that defines *me* as much as *her*.
      *   *Developing the Philosophy (Subtly):* Instead of saying "Confucianism says," say "I've learned from her that..." This makes it personal.
      *   *Describing the Bride:* She isn't just a "bride." She is a daughter, a friend, a scholar. These aren't hats she wears; they are who she *is*.
      *   *Describing the Union:* Avoid "finding the one." Use language of "focusing" or "narrative." The relationship *makes* the people.
      *   *The Groom:* He isn't completing her. He is inviting her into a new way of being.
      *   *The Toast:* Raise a glass to the roles.

      *(Self-Correction during drafting)*: I need to make sure I don't use the word "individual" too much, or if I do, negate it. I need to avoid "soulmate." I need to ensure the non-philosophers don't feel lost. The language should be poetic, not academic.

      *Drafting thought:* Instead of "role ethics," use "the stories we live." Instead of "ontological status," use "who we become."

      *Refining the "Advisor" voice:* I should sound proud but humble. I taught her, but she taught me about this.

  5.  **Writing the Content (Iterative Process):**

      *   *Intro:* Good evening. I had the privilege of guiding [Bride]'s dissertation. She asked me to speak. She gave me instructions.
      *   *The Philosophical Hook:* She told me not to talk about two halves making a whole. Why? Because she knows who she is. She is her relationships.
      *   *Elaboration:* I watched her as a student. But she was also a daughter calling home, a friend supporting others. She wasn't a "self" in a vacuum.
      *   *The Groom:* Enter [Groom]. He doesn't complete her. He joins the pattern.
      *   *The Marriage:* Marriage isn't a contract between strangers. It's a new focus. It's *ren* (humaneness) without using the word *ren*. It's doing the work.
      *   *Conclusion:* To the roles. To the becoming.

  6.  **Review against Constraints:**
      *   *5 minutes?* Let's check word count. 750 words is about 5 minutes at a leisurely speaking pace.
      *   *Philosophically accurate?* Yes, focuses on relational constitution rather than atomic individualism.
      *   *Accessible?* Yes, uses metaphors of stories and patterns rather than "ontological holism."
      *   *Moving?* Needs to emphasize care and growth.

  7.  **Final Polish:** Check for forbidden phrases ("soulmate," "better half," "independent"). Ensure the transition from advisor to friend is clear. Make sure the groom feels included, not just analyzed. (Make sure the groom doesn't sound like just a philosophical variable).

      *Adjustment:* Ensure the groom is described relationally too. He is a son, a friend, and now a husband. The intersection of their histories creates the future.

      *Final check on tone:* Is it too dry? Add warmth. "I have watched her think" -> "I have watched her care."

  8.  **Final Output Generation** (Proceeding to generate the text based on these thoughts).

  **(Self-Correction Note during final review):** I need to be careful not to make it sound like *I* am giving the lecture. The bride knows this stuff. The toast should reflect *her* wisdom back to her, not me teaching the room. I am the vessel for her worldview.

