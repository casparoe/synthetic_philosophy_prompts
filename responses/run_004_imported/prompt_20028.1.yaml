answer: |-
  Good evening, everyone.

  For those who don't know me, I had the profound privilege of serving as [Bride]'s dissertation advisor. In the academic world, that title suggests I was the one doing the teaching. But anyone who has supervised a doctoral student knows the truth: it is a reciprocal relationship. I became an advisor because she became a student. My role was constituted by hers.

  When [Bride] asked me to offer this toast, she gave me a specific instruction. She asked me to avoid the usual language of weddings. She asked me not to speak of "soulmates," or "two halves becoming whole," or of two independent people standing on a mountain peak, choosing each other against the world.

  At first, I worried this would make my job difficult. But then I realized she was simply asking me to tell the truth about who she is. And who we are.

  We often speak as if we are self-contained islands, drifting until we crash into one another. We talk as if [Bride] was a finished product, a complete "self" waiting in the wings for [Groom] to arrive. But those of us who know her best know that isn't true. She has never been a static individual. She is a daughter who calls home. She is a sister who worries and cares. She is a friend who shows up. She is a scholar who engages her community. She is not a noun; she is a verb. She is the sum of the ways she connects with us.

  And that is what makes this day so significant.

  [Groom], you are not here to complete her, because she was never incomplete. You are here to focus her. And she, to focus you.

  In the tradition [Bride] studies, a person is like a center of focus in a vast, intricate web. When you marry, you are not tying two separate webs together. You are creating a new center of gravity. You are adding a new thread that changes the tension and the shape of the entire pattern.

  I have watched [Groom] with [Bride]. I do not see two strangers making a contract. I see a new narrative beginning. I see the way her existing roles—daughter, friend, scholar—are now being refracted through the lens of "wife." And I see your roles, [Groom], shifting through the lens of "husband."

  This is not a passive state. It is not a box you check. In the philosophy she loves, to be human is to grow. It is the daily work of cultivating the ground between you. It is the understanding that you will not be the same people next year that you are today, because the relationship itself will have changed you. You are not building a fortress to keep the world out; you are building a home from which to engage the world more deeply.

  So, I am not going to wish you a life where you never need each other. I am not going to wish for a love that feels like a escape from reality.

  Instead, I wish you the strength to inhabit your roles fully.
  May you find meaning in the small rituals of morning coffee and evening walks.
  May you honor the parents who raised you by caring for one another.
  May you be good friends to your friends, precisely because you are good partners to each other.
  And may you understand that when you look at one another, you are not looking at a mirror, but at a horizon—a place where your lives extend further than they could have gone alone.

  [Bride], you taught me that we are our relationships. So tonight, we do not celebrate two individuals. We celebrate the space between you. We celebrate the new story that begins when you say "yes."

  Please raise your glasses.

  To the relations that make us. To the work that grows us. And to [Bride] and [Groom], as they become, together, who they are meant to be.

  Cheers.
