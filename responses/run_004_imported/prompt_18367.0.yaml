  **Tier Explanations**

  *   **S (Jaynes-style invariance):** This is the most sophisticated attempt to salvage objective indifference by deriving uniqueness from symmetry groups rather than arbitrary parametrization; it succeeds best at keeping the spirit of PoI alive while imposing rigorous constraints.
  *   **A (Mechanism-relativism & Von Kries):** Mechanism resolves the paradox definitively but admits PoI requires physical grounding rather than pure logic, while Von Kries attempts the same symmetry rescue as Jaynes but lacks the mathematical rigor to fully avoid arbitrariness.
  *   **B (Reference-class problem):** This correctly diagnoses Bertrand's paradox as an instance of a broader structural issue in probability but offers no constructive solution, leaving the user with local judgment calls rather than a universal principle.
  *   **C (Full conventionalism):** This accepts that different answers are permissible based on utility, which is pragmatic but effectively surrenders the claim that there is a single non-arbitrary truth to be rescued.
  *   **D (Personalist Bayesianism):** This rejects the premise entirely by denying objective priors exist, which solves the paradox by dissolving the goal of "non-arbitrary indifference" rather than achieving it.

  **Secretly the Same Move**

  Strategies **1 (Jaynes)** and **5 (Von Kries)** are fundamentally the same move wearing different clothes: Jaynes' group-theoretic invariance is essentially a rigorous mathematical formalization of Von Kries' intuitive notion of "naturally comparable" ranges (*Spielräume*). Both attempt to save objective indifference by restricting admissible parametrizations via symmetry or "naturalness," differing mainly in technical precision rather than philosophical strategy. Additionally, **2 (Mechanism)** and **6 (Conventionalism)** are close cousins; while Mechanism grounds the difference in ontology (physical processes) and Conventionalism in pragmatics (task utility), in practice both resolve the paradox by accepting that context determines the answer rather than logic alone.
