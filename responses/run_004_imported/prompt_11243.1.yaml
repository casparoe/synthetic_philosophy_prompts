      *   *Check:* Is Paul right that one counterexample kills a universal? *Yes.* In formal logic, $\exists x \neg Px$ falsifies $\forall x Px$. But in philosophy, principles are often defeasible. I should highlight this tension.
      *   *Check:* Is Marge's analogy perfect? *It's very good.* A spectrometer has a resolution limit. It doesn't mean it can't measure peaks, just that it can't resolve features closer than $\Delta \lambda$. This maps perfectly to the "margin for error" principle.

