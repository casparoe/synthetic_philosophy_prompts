  ### **Instructor-to-Instructor Note**
  If the student challenges the Searle deduction, your defense is straightforward: Harnad agrees with Searle that *syntax alone* fails, but he disagrees with Searle's conclusion that *syntax + robotics* still fails. The student wrote that Searle floated the robot idea as something that "might save it." Searle explicitly argued it would *not* save it. Harnad is the one arguing it *does* save it (provided the grounding is done right). It's a subtle difference in who holds which position, but in philosophy of mind, knowing who is arguing against whom is half the battle.

  For a novelist, however, the takeaway is solid: they understand that to write a conscious robot, you need to describe the sensors and the feature detection, not just the internal logic. That's the learning outcome that matters for your course.
