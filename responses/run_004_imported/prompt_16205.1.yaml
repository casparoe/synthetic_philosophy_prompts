  8.  **Final Review against constraints:** The user wants to know where reasoning breaks down and how to decide how much evidence ought to move them. Make sure to answer those two specific questions.

      *Where it breaks down:* The refusal to investigate the anomaly.
      *How to decide:* By testing alternative hypotheses, not by protecting the current one.

