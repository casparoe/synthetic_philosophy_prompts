answer: |-
  This is a profound dilemma that sits at the intersection of historical methodology, logic, and the emotional labor of writing family history. You are asking two distinct questions: one about the logic of your reasoning (epistemology), and one about the practical weighting of evidence (historical method).

  Here is an analysis of where your reasoning has become vulnerable, followed by a framework for how to handle this specific evidentiary conflict.

  ### 1. Where the Reasoning Breaks Down

  Your friend identified a logical vulnerability, but it may help to name it specifically. The issue isn't that you trust your previous research; it's that you have inadvertently adopted what philosophers of science call an **immunizing strategy**.

  An immunizing strategy occurs when you adjust your auxiliary assumptions to protect a core belief from falsification, without independent justification. By deciding *a priori* that the ledger "has to be an error" or "must refer to something unrelated" without investigating *why*, you are making your conclusion unfalsifiable.

  If your standard for evidence is: *"I will accept any evidence that supports my theory, but any evidence that contradicts it must be an error until proven otherwise,"* then you are no longer doing research; you are doing advocacy.

  **The specific logical break:**
  You stated: *"Whatever this new document seems to show has to be the misleading piece, not my conclusion."*
  This reverses the burden of proof. In historical inquiry, a primary source (the ledger) carries an initial presumption of validity equal to a primary source (the diary). You cannot dismiss the ledger's validity based on the conclusion the ledger threatens. You must dismiss the ledger's validity based on *evidence about the ledger* (e.g., proving the ledger is known to be inaccurate, or proving the "editorial services" were for a different section of the paper).

  **The Sunk Cost Factor:**
  You also mentioned that "the entire second half of the novel... rests on that." This introduces **motivated reasoning**. The higher the stakes (family pride, years of work, publisher expectations), the harder the brain works to protect the conclusion. This doesn't mean you are wrong, but it means your natural skepticism is currently disabled regarding this specific piece of evidence.

  ### 2. How to Weigh Contrary Evidence

  You are right that one ambiguous ledger line should not automatically overturn four years of corroborated work. Historical truth is rarely about a single "smoking gun"; it is about the preponderance of evidence. However, you must move from *dismissing* the evidence to *contextualizing* it.

  Here is a framework for deciding how much this evidence ought to move you:

  #### A. Distinguish Direct vs. Circumstantial Evidence
  *   **Your Evidence (Diary/Handwriting/Style):** This is largely circumstantial. Handwriting analysis by a non-expert is unreliable. "Turns of phrase" are subjective. Diary entries can be ambiguous (e.g., "I sent the piece today" could mean she wrote it, or it could mean she submitted a friend's work, or it could be metaphorical).
  *   **The Ledger Evidence:** This is direct financial evidence. However, it is also ambiguous. "Editorial services" is not "Author of Muckraking Column."

  **The Weighting:** The ledger is "harder" data (financial records are usually precise), but its *interpretation* is soft. Your evidence is "softer" data (stylistic analysis), but your *interpretation* feels solid. You cannot let the "hardness" of the ledger intimidate you, but you cannot let the "solidity" of your interpretation blind you.

  #### B. Generate Alternative Hypotheses
  Instead of asking "Is the ledger wrong?", ask "How can both be true?" In history, contradictory documents often reveal a more complex reality, not a simple error. Consider these scenarios:
  1.  **The Proxy:** Your great-grandmother wrote the columns anonymously for ideological reasons, but the newspaper needed a legal name on the payroll for tax or liability reasons. The other woman was a "front."
  2.  **The Editor:** The other woman was paid for *editing* the columns, not writing them. Your great-grandmother wrote them, but the paid woman polished them.
  3.  **The Double-Book:** The other woman wrote *other* editorial content (society pages, advice columns) during those months, and the timing is coincidental.
  4.  **The Error:** The ledger is literally mistaken (less likely, but possible).

  **The Test:** A hypothesis is only strong if it explains *all* the evidence. Your current hypothesis (GG wrote them) explains the diary but ignores the ledger. A new hypothesis must explain both.

  #### C. The "Falsification" Step
  To restore logical integrity, you must actively try to prove yourself wrong. This is the step you skipped. You need to instruct your archivist to dig *specifically* into the contradiction.
  *   Who was the other woman?
  *   What other columns did she write?
  *   Is there a record of your great-grandmother receiving *any* money? (If she was unpaid, that supports the muckraking/ideological angle).
  *   Does the diary mention the other woman?

  If you investigate these avenues and find nothing, your confidence in the original theory can return, but it will be **earned confidence** rather than **assumed confidence**.

  ### 3. The Novel vs. The History

  Finally, you must separate the historical truth from the novelistic truth.
  *   **If this is Non-Fiction:** You have an ethical obligation to resolve this contradiction. You cannot publish a biography claiming she wrote them if a business ledger says otherwise, unless you can substantiate the "Proxy" theory.
  *   **If this is Historical Fiction:** You have more latitude. However, you mentioned pitching this as "meticulously researched." This creates a contract with your reader. If you know there is a significant historical dispute and you gloss over it, you risk your reputation if it comes to light later.

  **A Narrative Solution:**
  Interestingly, this conflict could be the heart of your novel. A story about a woman trying to uncover her ancestor's secret, only to find evidence that suggests the ancestor *didn't* do it—or did it in a more complicated way—is often more compelling than a straight victory.
  *   What if the great-grandmother *wanted* to be the author, but was paid off to stay silent?
  *   What if she wrote them, but the credit was stolen by the woman on the ledger?
  *   What if the uncertainty itself is the theme?

  ### Summary of Actionable Advice

  1.  **Re-engage the Archivist:** Apologize for the earlier dismissal. Tell them, "I realized I dismissed this too quickly. Please investigate the woman on the ledger. What else did she write? Is there any link between her and my great-grandmother?"
  2.  **Re-read the Diary:** Look specifically for ambiguity. Are there entries that could be interpreted as her *reading* the columns or *discussing* them, rather than writing them?
  3.  **Update Your Probability:** Do not treat this as True/False. Treat it as probability. Before the ledger, you were 95% sure. The ledger might drop you to 70%. That is still enough to write the novel, but it changes how you frame the certainty in your author's note or publicity.
  4.  **Protect the Work:** If the ledger proves the other woman was the author, your work is not wasted. The *story* of your family believing she was the author, and the *impact* those columns had on the town, remains true. The identity of the pen is a plot point, not necessarily the whole theme.

  Your friend is right that your *method* was flawed, but she may be wrong that your *conclusion* is doomed. You can hold your ground, but only if you are willing to walk into the fire of that ledger and test it, rather than assuming it will burn you.
