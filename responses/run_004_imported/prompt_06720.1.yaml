      *   *The "Fastening of the Mind" (Xin Zhai):* Emptiness.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes. The user's confusion is the prompt.
      *   **Round 1: The Basin vs. The Initial Grief.**
          *   Lin: Drumming on the basin is the climax. He stops crying.
          *   Marcus: But he *started* crying. "I was a fool." Is it that grief is wrong, or that *stuck* grief is wrong?
      *   **Round 2: The Skull.**
          *   Lin: The skull is explicit. "No ruler's joy compares to this." It's a positive claim.
          *   Marcus: It's a *dream*. It's a rhetorical foil. Also, Zhuangzi asks if he should restore him to life, and the skull frowns. But does Zhuangzi accept the skull's metaphysics?
      *   **Round 3: Lady Li & Epistemology.**
          *   Lin: Lady Li shows our judgments are provisional. We fear death like she feared the palace.
          *   Marcus: Exactly! Provisional. We don't know. To say "Death is Better" is to make the same mistake as the girl thinking "Palace is Bad." The point is suspending judgment, not swapping "Bad" for "Good."
      *   **Round 4: The Nature of *Qing* (Emotion/Reality).**
          *   Lin: It's about aligning with *Ming* (Fate).
          *   Marcus: Aligning doesn't mean endorsing.
      *   **Closing:** They shouldn't necessarily resolve it (since the text is ambiguous), but they must respect the weight of the other's argument without resorting to "both are true." I need to make sure the emotional core (the user's grief) is acknowledged implicitly through the seriousness of the debate.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Make sure Marcus doesn't sound like a nihilist. His point is about *knowing*.
      *   *Critique:* Make sure Lin doesn't sound like a toxic positivity advocate. Her point is about *cosmic integration*.
      *   *Check:* Did I avoid the "it's all perspectives" cop-out? Yes, they need to stick to their guns. Lin says Zhuangzi *means* death is part of the flow. Marcus says Zhuangzi *means* we can't judge the flow.
      *   *Textual Check:* Ensure the "Inner Chapters" distinction is respected (Lady Li is Inner, Skull is Outer). This adds to the "experts" vibe. Marcus can use the Inner/Outer distinction to undermine the Skull story.

  6.  **Final Polish:**
