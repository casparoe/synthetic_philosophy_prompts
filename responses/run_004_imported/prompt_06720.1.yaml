      *   **The Task:** Write a dialogue between two experts (know Inner and Outer chapters cold) arguing this specific point.
      *   **Constraints:**
          *   Genuine back-and-forth engagement (no talking past each other).
          *   No cop-outs like "it's all just perspectives" (needs a definitive argument from both sides).
          *   Must use specific textual evidence (Skull, Wife/Drumming, Lady Li, etc.).
