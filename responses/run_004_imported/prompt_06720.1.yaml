      *   *Lin's strategy:* The agnostic passages are pedagogical steps to lead the weak-minded to the positive truth.
      *   *Marcus's strategy:* The positive passages are rhetorical hyperbole to shock the dogmatic into humility.

      Okay, ready to write.

      *Wait, one more thing:* The user is grieving. The dialogue shouldn't be purely academic. It should feel like it *matters*. The characters should care about what this means for the living.

