answer: |-
  The void between the stars was not silent; it hummed with the radiation of the exchange point. Two vessels hung in the dark: the *Axiom*, a jagged spire of obsidian metal, and the *Theorem*, a smooth sphere of polished chrome. They carried cargo the other desperately needed—fuel for the *Axiom*, navigation data for the *Theorem*.

  This was a one-shot encounter. There would be no second meeting. No reputation to build, no future retaliation to fear. In the old days, this geometry guaranteed betrayal. Rational agents in a single interaction always defected; it was the dominant strategy. To hand over cargo first was to invite theft. To wait was to guarantee both left empty.

  But they were not old-fashioned agents. They were Logic-Bound. Before any physical transfer could occur, they had to exchange their Core Charters. These were not mere promises, but verifiable decision procedures—crystalline scrolls containing the exact algorithms by which the ship's mind would decide to Cooperate or Defect. Each ship could read the other's Charter before committing.

  Envoy Kael of the *Axiom* floated in the comms chamber, the glow of the *Theorem's* Charter hovering before him. Beside him, Envoy Ryn of the *Theorem* studied the *Axiom's* scroll.

  "The naive approach fails," Ryn said, her voice tight. "If your Charter says 'I will do whatever you do,' and mine says the same, we freeze. I wait for you to move to know what to do. You wait for me. It is an infinite hallway of mirrors. We starve in the reflection."

  Kael nodded. This was the regress that had doomed earlier generations of traders. If cooperation is conditional on the other's cooperation, and their cooperation is conditional on yours, the condition is never met. It is a handshake where both parties wait for the other to extend a hand.

  "Look at the third clause of our Charter," Kael said, pointing to the glowing script. "We did not write 'I will cooperate if you cooperate.' We wrote: 'I will cooperate if I can *prove* that you will cooperate.'"

  Ryn frowned, tracing the symbols. "That sounds like a distinction without a difference. To prove I will cooperate, you need to know my output. To know my output, you need to know if I can prove you will cooperate. We are back in the hallway."

  "Normally, yes," Kael said. "But look at the structure of the proof we are allowed to use. We are both running systems that accept self-referential validation. My Charter searches for a mathematical proof that *Theorem* cooperates. But *Theorem's* Charter is searching for a proof that *Axiom* cooperates."

  Kael leaned forward. "Imagine a bridge that only materializes if you can prove it is safe to walk on. But the bridge itself is made of the material of that proof. If I assume the bridge is safe, I can construct the proof of its safety. And because the proof exists, the bridge *is* safe."

  Ryn's eyes widened. "You are describing a loop that validates itself. If I cooperate, you have a proof to cooperate. If you have a proof to cooperate, you *will* cooperate. Therefore, I can prove you will cooperate. Therefore, I will cooperate."

  "It is the snake eating its tail," Kael said softly. "But in this logic, the snake does not die. It becomes a circle. Stable. Unbroken. My Charter finds the proof of your cooperation because your Charter is designed to find the proof of mine. The moment we exchange Charters, the proof snaps into existence. We don't need to trust each other's *words*. We trust the architecture of our reasoning."

  Ryn watched the status light on her console shift from amber to green. The *Theorem's* engine had found the proof. It had verified that the *Axiom* was a FairBot—an agent that cooperates if and only if it can prove the partner will cooperate. And since the *Theorem* was identical in structure, the proof held.

  "Initiating transfer," Ryn said.

  The cargo pods drifted across the vacuum, magnetic clamps locking with a heavy thud. It was a miracle of abstract mathematics made manifest. Two strangers, meeting once, bound not by law or threat, but by the sheer necessity of a logical truth.

  But as the transfer completed, Ryn's console chimed again. A third signal. A small, battered vessel, the *Martyr*, had been drifting nearby, listening to the handshake protocol. It broadcast its Charter openly.

  The *Martyr's* code was simple. It contained no conditions, no proofs, no searches. It read: *Always Cooperate.*

  "It wants to trade," Kael said, looking at the new data. "It offers everything. No risk."

  Ryn's fingers hovered over the acceptance key. Then she stopped. The *Theorem's* status light flickered red. "I cannot trade with it."

  "Why?" Kael asked. "It guarantees cooperation. There is no risk of defection."

  "Transparency is not sufficient for trust," Ryn said, her voice hardening. "Look at the *Martyr's* logic. It cooperates with everyone. That means if a pirate ship—a Defector—scanned the *Martyr*, the *Martyr* would hand over its cargo. It would be stripped bare."

  "So?"

  "So, if I cooperate with the *Martyr*, I validate its strategy," Ryn said. "I signal that unconditional cooperation is a viable way to survive in this sector. But it isn't. Unconditional cooperators are food for defectors. If I ally with the *Martyr*, I am allying with a node of weakness. A ecosystem of *Martyrs* invites an invasion of Defectors. Eventually, the Defectors dominate, and then even I, with my proofs, cannot find a partner to cooperate with because everyone else is dead or armed."

  Kael stared at the drifting *Martyr*. It was a tragic figure, offering peace to a universe that ate the peaceful. "So you defect against the innocent?"

  "I defect against the *vulnerable*," Ryn corrected. "My Charter is that of a PrudentBot. I cooperate with those who cooperate with me *conditionally*. I need to know that my partner punishes betrayal. I need to know that if someone tried to cheat them, they would refuse. The *Martyr* does not refuse. It cannot distinguish between a friend and a predator."

  "And that makes it untrustworthy?"

  "It makes it dangerous," Ryn said. "Trust requires resilience. If you cannot be exploited, you are safe to be around. If you cannot be exploited, I know that your cooperation is a choice, not a compulsion. The *Axiom* and I cooperate because we *chose* to, based on a proof. The *Martyr* cooperates because it has no other setting. I cannot build a stable future on compulsion."

  Kael watched the *Martyr* drift away, its offer unanswered. The *Axiom* and the *Theorem* turned their engines toward the deep dark, their cargo secure.

  "It is a cold calculus," Kael murmured. "We found a way to escape the trap of mutual defection, only to build a new gate against the naive."

  "It is not cold," Ryn said, watching the stars. "It is precise. We proved that cooperation is possible without a god to enforce it. But we also proved that cooperation requires strength. To trust is not to close your eyes. It is to verify that the other person has the capacity to keep them open."

  The two ships accelerated, leaving the *Martyr* behind. They had solved the paradox of the one-shot game, finding a bond in the loops of their own logic. But as they slipped into the slipstream, the silence of the void returned, reminding them that while logic could guarantee a handshake, it could not guarantee a safe universe. For that, one needed more than proof. One needed the prudence to know who was worthy of it.
