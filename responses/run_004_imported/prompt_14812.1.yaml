prompt: |-
  I write novels for a living, but I also co-host a tiny podcast about the ethics of fiction on the side (we record it in my kitchen, nothing fancy), and next week's guest is a scholar who's basically built her career on the claim that Rousseau's Letter to d'Alembert -- the one where he talks the Genevans out of building a theatre -- was never really just about actors on a stage. Her line, as best as I can reconstruct it from her papers, is that everything Rousseau says about live performance (the empty, self-congratulatory pity we're supposed to feel for people who aren't real, the way an actor's whole craft is counterfeiting a self he doesnt actually have) applies with basically equal force to novels, and that anyone who thinks he exempted the page just hasn't followed the argument to the end. Which, obviously, makes me a little defensive going in, since it's my own trade on trial here, and I don't want her getting an easy hour where she just restates the thesis in slightly different words each time.

  Could you help me put together nine or ten questions for the interview? I want at least one that goes after the pity/catharsis bit specifically -- whether crying over a character on the page is really the same empty kind of feeling Rousseau thought stage-pity was, or whether reading alone changes the calculation -- with a follow-up ready for whichever way she answers. I want one on the "actor as liar" argument, pressing on whether that charge even makes sense leveled at somebody alone at a desk rather than a body performing live in front of people. I want one that forces her to deal with Rousseau's own contradiction here -- the man wrote a hit opera and at least one comedy himself, so I assume she's got a rehearsed move for that, and I'd like the question built so the rehearsed move is visible rather than sliding by unnoticed. And I want one that takes his bit about Geneva's citizens turning from participants into passive spectators and makes her apply it to someone bingeing eight episodes alone on a couch, since "passive spectator" seems to fit that a lot better than it ever fit a room of actual Genevans watching a play together. Add a couple more if there's an obvious thread I'm leaving out, but for every question give me a one-line note on the dodge she's likely to reach for and how the follow-up should shut it down.
