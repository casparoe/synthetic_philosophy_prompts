answer: |-
  Here are ten questions designed to press the guest's thesis without shutting down the conversation, including the specific angles you requested and notes on managing the likely evasions.

  **1. The Privacy of Pity**
  Rousseau argues that weeping for a tragic hero is a way to feel virtuous without actually *being* virtuous, because the pity ends at the theater exit. When I cry over a manuscript alone in my study, there is no exit to walk through—just me and the feeling. Does that privacy make the sentiment more authentic, or does it remove the last check on our self-indulgence?
  *Note: Likely Dodge: "Emotions are internal regardless of setting." Shut it down by: Asking why Rousseau focused on the *public* exit if the emotion itself was the sin.*

  **2. The Location of the Lie**
  The actor's sin, for Rousseau, is wearing a mask and speaking another's words in public. The novelist sits alone and invents voices no one hears until publication. Is the moral injury in the *deception* of the audience, or the *corruption* of the self?
  *Note: Likely Dodge: "Both corrupt the self equally." Shut it down by: Asking if corruption without a witness is still a civic crime.*

  **3. The Rousseau Exception**
  Rousseau wrote *The Village Soothsayer* and *Narcissus*, and scholars often dismiss these as satire or juvenilia to save the thesis. But if the *craft* of fiction is inherently corrupting, why does his intent to satirize grant him immunity?
  *Note: Likely Dodge: "It was ironic, not sincere." Shut it down by: Pressing that irony still requires the 'lie' of performance.*

  **4. The Isolated Spectator**
  You argue the novel creates the same passive spectator as the theater. But a Genevan in a pit was surrounded by neighbors; a modern reader bingeing a series is chemically isolated on a couch. If passivity is the danger, isn't the solitary consumer actually *more* vulnerable than the theatergoer Rousseau feared?
  *Note: Likely Dodge: "Isolation exacerbates the passivity." Shut it down by: Forcing her to concede the novel is potentially *worse* than the theater he banned.*

  **5. The Empathy Gym**
  Defenders of fiction argue it's a 'moral gym' where we practice empathy safely. Rousseau would likely call that 'practicing virtue without the risk of action.' Which diagnosis fits the modern reader better: are we training for reality, or rehearsing our own goodness?
  *Note: Likely Dodge: "It depends on the reader." Shut it down by: Reminding her the argument is about the *medium's* structural effect, not individual choice.*

  **6. The Performance of Authorship**
  Rousseau hated actors because they sold their personalities for applause. Today, novelists sell a 'brand' and a public persona on social media to move units. In the economy of attention, is the author any less of a performer than the actor?
  *Note: Likely Dodge: "Writers aren't on a physical stage." Shut it down by: Pointing out that Instagram is a stage without a curtain.*

  **7. The Civic Replacement**
  Rousseau wanted Genevans to dance in the square, not watch others dance. If the novel is inherently a spectator sport, what is the active equivalent for a writer? Is there a form of storytelling that doesn't create a hierarchy between teller and listener?
  *Note: Likely Dodge: "Oral storytelling or workshops." Shut it down by: Asking if that's viable for a novelist in a print/digital economy.*

  **8. The Historical Blindspot**
  In Rousseau's time, the novel was often seen as a lesser, private distraction compared to the public institution of the theater. Is it possible he didn't attack novels simply because he didn't think they were powerful enough to warrant the ban?
  *Note: Likely Dodge: "He addressed the dominant medium." Shut it down by: Asking if the novel's subsequent dominance proves it *was* powerful enough.*

  **9. The "Good" Book Loophole**
  If the mechanism of fiction is the problem—the counterfeit self and the sterile pity—is there *any* novel Rousseau would approve of, or is the form itself irredeemable?
  *Note: Likely Dodge: "Didactic or moral fiction." Shut it down by: Asking if instruction without emotional manipulation is still 'fiction'.*

  **10. The Practical Verdict**
  If we accept your reading that Rousseau's argument logically condemns the novel, what is the ethical obligation of a scholar who teaches this, and a writer who writes it? Do we apologize, or just acknowledge the contradiction?
  *Note: Likely Dodge: "We study it critically." Shut it down by: Asking if critical study neutralizes the moral harm he identified.*
