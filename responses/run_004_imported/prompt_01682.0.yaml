      *   **Colleague A's Position:** Strong Objectivism/Positivist leanings. Assumes a "God's eye view" is possible (or at least that outsiders get closer to it). Focuses on *bias* and *blindness*.
      *   **Colleague B's Position:** Constructivist/Interpretivist leanings. Assumes all knowledge is situated. Focuses on *access* and *depth*.
