answer: |-
  This is a fertile philosophical seam to mine for a novel. The tension between what an object *is* and what we *know* about it lies at the heart of the forger's psychology. Van Meegeren didn't just fool the eye; he fooled the history of art itself.

  Here is a breakdown of Goodman's argument against Lessing, followed by an analysis of your three literary scenarios through both philosophical lenses.

  ### Part 1: Goodman vs. Lessing on the Aesthetic Weight of History

  To understand why Goodman insists history matters even for a "perfect" forgery, we have to look at how he defines the identity of a work of art.

  **Alfred Lessing's Position (The Moral View)**
  Lessing's argument is intuitive and commonsensical. He posits that aesthetic properties are **perceptual**. If you stand before a Vermeer and a perfect forgery of that Vermeer, and you cannot tell them apart by looking, then they possess the same aesthetic properties. They are equally beautiful, equally balanced, equally "Vermeer-like" in appearance.
  *   **The Wrong:** For Lessing, the wrong of forgery is entirely moral and legal. It is a lie about provenance. The forger steals credit and deceives the buyer.
  *   **The Object:** The object itself is aesthetically innocent. If the forgery is undetectable, it is aesthetically equivalent to the original.

  **Nelson Goodman's Position (The Epistemic/Aesthetic View)**
  Goodman rejects the idea that aesthetic experience is purely retinal. In *Languages of Art* (specifically the chapter "Art and Authenticity"), he argues that aesthetic judgment is cognitive. *How* we categorize an object changes *what* we perceive in it.

  Here are the specific steps of Goodman's argument for why history of production remains aesthetically relevant, even against a hypothetically perfect forgery:

  1.  **The Indistinguishability Thesis is Provisional:** We can never prove a negative. We cannot prove that a forgery is *permanently* undetectable. Scientific techniques improve (X-ray, chemical analysis, AI brushstroke recognition). A forgery that passes today might fail tomorrow.
  2.  **The Instability of Aesthetic Judgment:** Because we cannot guarantee permanent indistinguishability, we cannot grant the forgery the same aesthetic status as the original. If we did, we would have to be willing to revoke that status the moment a test was invented that distinguished them. This makes aesthetic value unstable.
  3.  **The Constitutive Role of History:** In **autographic** arts (painting, sculpture), there is no "score" or notation. A painting is not defined by a set of instructions (like a symphony or a novel); it is defined by the specific physical history of its production. The work *is* the specific object created by the artist's hand at time *T*.
  4.  **The Cognitive Effect on Perception:** Even if no test ever distinguishes them, the *knowledge* of origin alters the perception. If I believe I am looking at a Vermeer, I perceive "boldness" and "innovation." If I learn it is a Van Meegeren, those same brushstrokes may suddenly appear "derivative" or "mimicked." The visual data hasn't changed, but the aesthetic properties (which are relational, not just physical) have.
  5.  **Conclusion:** Therefore, the history of production is not just a moral footnote; it is constitutive of the work's identity in autographic arts. A perfect copy is not just a "fake Vermeer"; it is a "real Van Meegeren." It is a different work entirely. To treat it as a Vermeer is to make a category error that undermines the aesthetic experience.

  **The Conflict:**
  *   **Lessing:** The forgery is a lie about the *past*, but the *present* object is genuine art.
  *   **Goodman:** The forgery is a lie that changes the *identity* of the object. You are not looking at the same work.

  ---

  ### Part 2: The Three Literary Offenses

  You have identified three distinct scenarios that we colloquially lump together as "forgery."
  1.  **The Fake Relic:** A printed copy of *Great Expectations* claimed to be Dickens's handwritten manuscript.
  2.  **The Spurious Work:** A new poem written in the style of Keats, claimed to be a "lost" Keats poem.
  3.  **The Plagiarism:** Stealing an existing text (by a living or dead author) and claiming you wrote it.

  Here is how Goodman and Lessing dissect these.

  #### 1. Reasoning from Goodman's Terms (The Ontological Split)

  Goodman's distinction between autographic and allographic arts fractures these three offenses. They are not the same kind of wrong because they violate different ontological rules.

  *   **Scenario 1 (The Fake Relic): Autographic Forgery.**
      *   **Analysis:** While the *novel* is allographic (any correct copy is genuine), the *manuscript* is an autographic object. It is a unique physical artifact.
      *   **The Wrong:** You are forging an autographic object (the paper/ink) that serves as a relic of an allographic work. Goodman would say the *literary work* is not forged (the text is correct), but the *artifact* is. This is a forgery of history, not of the work.
  *   **Scenario 2 (The Spurious Work): Allographic Fraud.**
      *   **Analysis:** Literature is allographic. The "work" is defined by the notation (the words). If the text did not exist in Keats's corpus, it is not a forgery of a Keats work; it is a *new* work.
      *   **The Wrong:** You cannot forge an allographic work that doesn't exist. You are creating a new work and lying about its genesis. Goodman would classify this as a misattribution of authorship. It is not a forgery in the strict autographic sense (like a fake Vermeer) because there is no "original" physical object being copied. It is a lie about the *source* of the notation.
  *   **Scenario 3 (Plagiarism): Misattribution of an Existing Work.**
      *   **Analysis:** The text exists. The notation is compliant.
      *   **The Wrong:** This is purely a claim of authorship over an existing allographic work.

  **Goodman's Verdict:** These do **not** share a single kind of wrong.
  *   Case 1 is an **autographic crime** (faking the physical history).
  *   Cases 2 and 3 are **allographic attribution crimes** (lying about who generated the notation).
  *   For Goodman, the "forgery" in painting (Case 1 equivalent) is fundamentally different from "plagiarism" in literature (Case 3) because in painting, the history *makes* the work. In literature, the notation *makes* the work. To forge a painting is to destroy the work's identity. To plagiarize a novel is to mislabel a work that remains ontologically intact.

  #### 2. Reasoning from Lessing's Terms (The Moral Unity)

  Lessing does not care about the ontology of the work (autographic vs. allographic). He cares about the deception regarding human achievement.

  *   **Scenario 1:** You claim a physical achievement (Dickens's handwriting) that is not yours.
  *   **Scenario 2:** You claim a creative achievement (Keats's genius) that is not yours.
  *   **Scenario 3:** You claim a creative achievement (The original author's labor) that is not yours.

  **Lessing's Verdict:** These **do** share a single kind of wrong.
  *   In all three cases, the object (whether manuscript, poem, or book) might be aesthetically valuable. The "wrong" is entirely external to the object. It is the fraudulent claim to credit.
  *   Lessing would argue that if the "Lost Keats Poem" (Case 2) is beautiful, it is aesthetically equal to a real Keats poem. The only sin is the lie. If the "Fake Manuscript" (Case 1) is a beautiful object, it is aesthetically valid. The sin is the provenance lie.
  *   For Lessing, the forger, the faker, and the plagiarist are all committing the same moral fraud: **Theft of Prestige.**

  ---

  ### Part 3: Implications for Your Novel

  This philosophical divergence offers a powerful conflict for your protagonist.

  **The Van Meegeren Dilemma**
  Van Meegeren is the ultimate test case. He painted *The Supper at Emmaus*.
  *   **Lessing would say:** When it was thought to be a Vermeer, it was a masterpiece. When Van Meegeren confessed, the painting didn't change. Therefore, it is still a masterpiece. The only thing that changed was the price and the moral judgment.
  *   **Goodman would say:** Once it was known to be a Van Meegeren, it *became* a different work. The "boldness" became "pastiche." The aesthetic properties actually shifted because the category shifted.

  **How your Forger might use this:**
  Your character could be a Goodmanian who believes he is creating *new* aesthetic experiences, but is trapped in a Lessing world that only cares about the signature.

  *   **The Allographic Temptation:** Your forger might envy writers. If he were a writer, he could write a "new Shakespeare" (Case 2). If the text is good, Lessing says it's art. Goodman says it's a new work mislabeled. But in painting, the forger is always doomed by Goodman's rule: the history *is* the work. He can never win.
  *   **The "Perfect Forgery" Trap:** If your forger creates a painting that is undetectable, he proves Lessing right (it is aesthetically equal). But the moment he is caught, the art world treats Goodman as right (the value and perception collapse).
  *   **The Novel's Climax:** The tension lies in whether your character believes the *art* is in the object (Lessing) or in the *history* (Goodman).
      *   If he believes **Lessing**, he is an artist equal to the masters he copies, unfairly suppressed by the cult of authenticity.
      *   If he believes **Goodman**, he knows he is a parasite. He knows that even if no one ever knows, *he* knows, and therefore the work is fundamentally different to him. He is not creating Vermeers; he is creating "Van Meegerens pretending to be Vermeers."

  **Summary for your drafting:**
  *   **Goodman** tells you that in painting, the lie *changes the art*. In writing, the lie *labels the art*.
  *   **Lessing** tells you that in both, the lie is just a lie, and the art remains what it is.
  *   **The Three Offenses:** Goodman says they are ontologically different (fake object vs. fake authorship). Lessing says they are morally identical (theft of credit).

  Your forger's tragedy might be that he wants to be a Lessing-artist (judged on the work alone) but lives in a Goodman-world (where the history is the only thing that matters).
