answer: |-
  This is a sharp observation, and you are right to sense a deep family resemblance between the two. In the landscape of social choice theory, the Condorcet paradox and the discursive dilemma (often associated with the doctrinal paradox) are indeed "cousins." They both demonstrate that simple majoritarianism can fail to produce a rational collective agent.

  However, characterizing the discursive dilemma as merely Condorcet's paradox "restated in terms of propositions" or List and Pettit's work as "new notation" overlooks crucial structural, logical, and normative distinctions. While they share a genealogy, theorists treat the discursive dilemma as a distinct discovery because it shifts the focus from **aggregating wants** to **aggregating reasons.**

  Here is a breakdown of why the distinction matters and why List and Pettit's framework is considered a substantive advancement rather than just a notational shift.

  ### 1. The Nature of the Input: Orderings vs. Truth Values
  The most immediate difference lies in what is being aggregated.
  *   **Condorcet:** Aggregates **preference orderings**. Individuals submit rankings ($A \succ B \succ C$). The coherence condition is **transitivity**.
  *   **Discursive Dilemma:** Aggregates **judgments on propositions**. Individuals submit truth values ($P$ is True, $Q$ is True). The coherence condition is **logical consistency** (specifically, deductive closure).

  While you can mathematically map preferences onto binary judgments (e.g., "Is $A$ better than $B$?"), the *interpretive* load is different. Preferences are subjective states of desire; judgments are claims about objective (or inter-subjective) truth or validity. The discursive dilemma asks: *Can a group hold consistent beliefs?* The Condorcet paradox asks: *Can a group have a stable will?*

  ### 2. The Nature of the Incoherence: Cycles vs. Contradictions
  The type of irrationality produced by the two paradoxes is technically distinct.
  *   **Condorcet (Cyclicity):** The collective preference is intransitive ($A \succ B$, $B \succ C$, $C \succ A$). This creates instability (no clear winner), but it is not necessarily a logical contradiction in the strict sense. It implies the group has no "best" option, but it doesn't mean the group believes $X$ and $\neg X$ simultaneously.
  *   **Discursive Dilemma (Contradiction):** The collective judgments violate logical entailment. For example, the majority accepts $P$, accepts $Q$, but rejects $P \land Q$. This is a direct logical contradiction. The group is effectively asserting a falsehood according to its own accepted rules of inference.

  This distinction matters because logical contradiction is generally viewed as more debilitating for a collective agent than preference cycling. A cycling group can perhaps flip a coin; a contradictory group is incoherent in its reasoning.

  ### 3. The "Reason-Based" Dimension
  This is the most significant theoretical contribution of List and Pettit. The Condorcet paradox is concerned with the **outcome** (which alternative wins). The discursive dilemma is concerned with the **reasons** for the outcome.

  In the standard setup of the discursive dilemma, propositions are divided into **premises** (reasons) and a **conclusion** (decision).
  *   *Premise-based procedure:* Vote on $P$ and $Q$, derive $P \land Q$.
  *   *Conclusion-based procedure:* Vote directly on $P \land Q$.

  The paradox arises because these two procedures yield different results. This highlights a problem of **collective rationality and accountability** that Condorcet does not address. In deliberative democracy, *why* a decision was made matters as much as *what* was decided. List and Pettit showed that you cannot guarantee both consistency and responsiveness to individual judgments on all propositions simultaneously. This forces a choice between "reason-based" aggregation and "outcome-based" aggregation, a nuance lost in standard preference aggregation.

  ### 4. Generalization and Impossibility Theorems
  You mentioned List and Pettit "dressing up" old observations. While Kornhauser and Sager (1986) identified the "doctrinal paradox" in legal theory, List and Pettit (2002) generalized it into **Judgment Aggregation Theory**.

  They proved a general impossibility theorem (similar to Arrow's Theorem) showing that no aggregation function can satisfy a set of minimal democratic conditions (Universal Domain, Anonymity, Systematicity) while maintaining logical consistency, *provided the agenda of propositions is "connected."*

  This was not just a restatement. It showed that the problem isn't specific to legal cases or specific logical connectives; it is a structural feature of any attempt to aggregate judgments on logically interconnected issues. It opened a new subfield exploring *which* specific logical structures allow for consistent aggregation (e.g., if the propositions are not interconnected, the paradox disappears).

  ### 5. Mathematical Equivalence vs. Conceptual Distinctness
  It is worth noting that some formal theorists (e.g., Christian List himself, or Philippe Mongin) have shown that under certain conditions, preference aggregation and judgment aggregation can be mathematically mapped onto one another. In a purely formal sense, you are partially right: they are isomorphic in specific contexts.

  However, in social science and political philosophy, **isomorphism does not imply identity.**
  *   If I discover a mathematical model that describes both the spread of a virus and the spread of a rumor, I haven't just "restated" epidemiology in terms of sociology. The *mechanisms* and *normative implications* differ.
  *   Similarly, treating the discursive dilemma as distinct allows theorists to address issues of **epistemic democracy** (tracking the truth) versus **procedural democracy** (satisfying preferences).

  ### Conclusion
  Your intuition is excellent: the discursive dilemma is part of the same "impossibility family" as the Condorcet paradox. If your seminar presented them as unrelated phenomena, that would have been a mistake.

  However, it is not fair to view List and Pettit's work as merely notational. They shifted the focus from **choice** to **reasoning**.
  *   **Condorcet** tells us that a majority might not have a coherent *will*.
  *   **List and Pettit** tell us that a majority might not have a coherent *mind*.

  The latter has profound implications for how we design courts, legislatures, and central banks, specifically regarding whether these bodies should vote on premises or conclusions. That specific institutional design problem is unique to the discursive dilemma and cannot be derived solely from Condorcet's original observation.
