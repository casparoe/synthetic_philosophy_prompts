      *   *Discursive Dilemma / Doctrinal Paradox (Kornhauser & Sager 1986, formalized by List & Pettit 2002):* Inconsistent set of judgments on logically connected propositions (e.g., $P$, $Q$, $P \land Q$) arising from consistent individual judgments under proposition-wise majority voting. Focus: Aggregation of *truth values/beliefs* subject to logical constraints.
      *   *Similarity:* Both show impossibility results for simple majority rule. Both involve inconsistency/incoherence at the collective level.
      *   *Difference:* The structure of the input and the nature of the inconsistency. Condorcet is about transitivity of preference. Discursive Dilemma is about logical consistency (deductive closure).
      *   *Verdict:* The user's intuition is partially correct (they are "cousins" in social choice theory), but claiming they are *essentially the same* or that List/Pettit just added notation overlooks crucial structural and normative differences. The Discursive Dilemma opens up specific avenues (premise-based vs. conclusion-based procedures) that Condorcet doesn't directly address.

  3.  **Drafting the Argument (Step-by-Step):**

      *   **Acknowledge the Insight:** Validate the user's observation. Yes, they are structurally related. Both are impossibility theorems regarding majority rule. It's good intuition to see the family resemblance.
