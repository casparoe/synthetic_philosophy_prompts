          *   They proposed specific solutions (Premise-based vs. Conclusion-based) which map differently than Condorcet solutions (Borda, Condorcet methods, etc.).
      *   **Normative Implications:**
          *   Condorcet is about choosing a leader/policy.
          *   Discursive Dilemma is about collective *reasoning* and *accountability*. It matters *why* a decision was made, not just *what* was decided.
