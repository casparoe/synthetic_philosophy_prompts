      *   *The Critic's Counter:* The community is just a collection of individuals. If individual dispositions are brute facts subject to skeptical interpretation (plus vs. quus), then the aggregate of those dispositions is also a brute fact subject to the same interpretation.
      *   *Normativity Gap:* The shift from "is" (dispositions) to "ought" (correctness) remains unbridged. Just because everyone *would* say "125" to "68+57" doesn't mean they *should*. It just means they are disposed to.
      *   *Implication for Private Language:* If the community doesn't solve the normativity problem, then the exclusion of the solitary individual (Robinson Crusoe) loses its force. If community rule-following is just as skeptical as individual rule-following, the distinction collapses.

  3.  **Structure the Argument:**
