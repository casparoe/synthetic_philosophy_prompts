answer: |-
  This is a fantastic find. You have stumbled onto the great-grandfather of the Coherent Extrapolated Volition (CEV) debate. Sidgwick is wrestling with the exact same tension you are: **If "good" is based on desire, how do we filter out desires that are stupid, ignorant, or self-destructive without just inventing a "good" that has nothing to do with desire?**

  Here is the unpacking of that second paragraph, the specific problem with the "contented pig," and how it maps onto your argument about AI alignment.

  ### 1. The Setup (Paragraph 1) vs. The Problem (Paragraph 2)

  **Paragraph 1 (The Naive Idealization):**
  Sidgwick starts by saying "Good" isn't what we *do* desire, but what we *would* desire if we had perfect information ("perfect forecast") and could emotionally simulate the outcome ("emotional as well as intellectual").
  *   *Example:* I want to smoke. But if I could perfectly feel the lung cancer and the addiction *right now*, I wouldn't desire the cigarette. Therefore, the cigarette is not my "good."

  **Paragraph 2 (The Glitch):**
  Sidgwick realizes this isn't enough. He says you can't just say "Good is what I would desire if I knew the consequences *at the time of the choice*."
  Why? Because some choices **change who you are.**

  This is where the **Contented Pig** comes in.

  ### 2. The Contented Pig Counterexample

  The "Contented Pig" is a reference to John Stuart Mill (who argued it is "better to be Socrates dissatisfied than a fool satisfied"). Sidgwick uses it to attack the idea that **satisfaction** or **lack of regret** is the proof of "Good."

  Here is the scenario Sidgwick is worried about:
  1.  **Choice:** I can pursue a life of high art and difficult philosophy (Hard Path) or a life of easy drugs and mindless entertainment (Easy Path).
  2.  **Consequence:** If I choose the Easy Path, it chemically alters my brain. I lose the capacity to appreciate art or philosophy. I become a "contented pig."
  3.  **The Test:** If we define "Good" as "What I would desire if I knew the consequences," we have to ask: *Which me is answering?*
      *   **Future Me (The Pig):** If I ask the Future Pig, "Do you desire this state?" The Pig says, "Yes! I am happy. I have no regrets."
      *   **The Result:** If we accept the Future Pig's judgment, then the Easy Path *was* my Good.

  Sidgwick finds this unacceptable. He writes: *"We commonly reckon it among the worst consequences of some kinds of conduct that they alter men's tendencies to desire... and we think it all the worse for a man... if he is never roused out of such a condition."*

  He is identifying **Preference Corruption.** If your choices can degrade your future ability to judge what is good, you can't trust the future self's validation. The fact that the Pig doesn't regret being a Pig doesn't prove being a Pig is Good; it proves the Pig is broken.

  ### 3. Sidgwick's Fix: "The Present Point of Time"

  To solve the Pig problem, Sidgwick makes a crucial temporal shift in the last sentence:

  > *"A man's future good on the whole is what he would **now** desire and seek on the whole if all the consequences... were accurately foreseen... at the **present point of time**."*

  He anchors the authority in the **Current Self**, not the Future Self.
  *   **Current Me (with perfect info):** Looks down the timeline. Sees that Path B turns me into a Pig.
  *   **Current Me's Judgment:** "I do not want to become a Pig, even if Pig-Me would be happy."
  *   **Conclusion:** Path A is the Good, because Current Me (the rational judge) rejects Path B.

  Sidgwick is saying: **Your "True Will" is what your current, rational self would legislate for your future selves, knowing how those future selves will be corrupted.**

  ### 4. Does the Fix Work? (Your Skepticism is Valid)

  You asked: *Does his fix even work, or does it just relocate the problem?*

  It relocates the problem. You are right to be suspicious. Sidgwick solves the "Contented Pig" issue by creating a **"Tyranny of the Present Self."**

  1.  **Why is Present-Me the Authority?** Sidgwick assumes the "Present Point of Time" self is the rational baseline. But what if Present-Me is depressed? What if Present-Me is culturally indoctrinated? What if Present-Me just happens to prefer opera over video games, and decides Future-Me *must* prefer opera to be "good"?
  2.  **The "No Fact of the Matter" Problem:** This circles back to your original argument. Sidgwick assumes there is a stable, rational "Present Self" that exists independently of its impulses. You argued there is "no fact of the matter about what your idealized self wants." Sidgwick's solution *requires* there to be a fact of the matter about what the Present Self would want under ideal conditions. If you believe desires are constructed, not discovered, Sidgwick's anchor floats away.
  3.  **Dynamic Inconsistency:** If "Good" is locked at Time A, what happens at Time B when I have naturally grown and changed (not corrupted, just matured)? Sidgwick's framework risks making morality static. It implies my 20-year-old self (with perfect info) gets to veto my 40-year-old self's new values.

  ### 5. Connection to CEV and Your Argument

  This is basically the exact same move as modern "idealized preferences" talk (like CEV), but with a specific temporal twist.

  *   **CEV (Yudkowsky/Bostrom):** Tries to solve the "Which Self?" problem by extrapolating *all* selves into a coherent convergence. It hopes that if we think enough, our desires converge on a single point.
  *   **Sidgwick:** Solves the "Which Self?" problem by fiat. The *Current Rational Self* is the boss.

  **Does this vindicate your friend or you?**

  It actually vindicates **you**, but it shows why your friend isn't being totally obtuse.

  *   **Your Point:** There is no "fact of the matter." Sidgwick admits this is hard ("the relation... is very complicated"). He has to construct a specific, somewhat arbitrary rule (anchor it *now*) to make the math work. This supports your view that "idealized volition" is a philosophical construct invented to solve a paradox, not a hidden truth waiting to be found.
  *   **Your Friend's Point:** There is a functional difference between "what I want" and "what I would want if I wasn't a pig." Sidgwick proves that without *some* kind of idealization, we can't distinguish between "satisfaction" and "good." If we don't use Sidgwick's move (or CEV), we have to say the drug addict and the saint are equally "good" if they are equally satisfied.

  **The Verdict:**
  Sidgwick shows that **Idealized Volition is a necessary fiction.** We *need* it to make ethics work (to distinguish the Pig from Socrates), but as you suspected, it relies on an arbitrary anchor (the "Present Point of Time").

  In AI alignment terms: Sidgwick is proposing we program the AI to listen to **Humanity-Right-Now (with perfect info)** rather than **Humanity-In-The-Future.**
  *   **Risk:** Humanity-Right-Now might be prejudiced, short-sighted, or wrong about what future humans will value.
  *   **Benefit:** It prevents the AI from turning us into "Contented Pigs" just because we'd be happy as piggies.

  You were right that it's a "con" in the sense that it's a constructed solution to a metaphysical problem, not a discovered fact. But Sidgwick shows it's a *necessary* con if you want to define "Good" as anything other than "whatever makes you shut up and stop complaining."
