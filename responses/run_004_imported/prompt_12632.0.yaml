      *   **Specific Instruction:** Do *not* equate this with "fate" or "destiny" (sister will be annoyed). It must be romantic but not a lecture.
      *   **Tone:** Heartfelt, slightly humorous (brotherly), accessible, philosophically accurate.
      *   **Length:** 3-4 minutes (approx. 450-600 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy (Kripke 101):**
      *   *Rigid Designators:* Names refer to the same object in all possible worlds where that object exists. "Mark Twain" and "Samuel Clemens" pick out the same guy.
      *   *Hesperus is Phosphorus:* The Evening Star and the Morning Star are both Venus. Ancients thought they were different objects. Discovery showed they are the same.
      *   *Necessary A Posteriori:* Once we discover the identity (Hesperus = Phosphorus), it is *necessarily* true (there's no world where Hesperus isn't Phosphorus), but we could only know this through empirical investigation (looking through telescopes), not just by thinking about definitions.
      *   *The Sister's Point:* Her relationship isn't "fated" (written in the stars beforehand). It's that *given who they actually are*, their union is necessary. They discovered this truth about themselves through living (empirical), not by definition.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Acknowledge the awkwardness (high schooler giving a toast), establish the bond with the sister, and introduce the "theme" without scaring the normies.
      *   **The Setup (The Philosophy Lite):** Explain "Hesperus is Phosphorus" simply. Use the telescope analogy. Make it clear this isn't about fate.
      *   **The Application (The Couple):** Connect the philosophy to the sister and fiancé. They aren't "meant to be" by magic; they *became* meant to be by knowing each other.
      *   **The Emotional Core:** Why this is romantic. The work of discovery.
      *   **The Closing:** A traditional wish for the future, tying back to the theme.

