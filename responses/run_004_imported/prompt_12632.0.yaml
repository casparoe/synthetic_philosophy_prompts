answer: |-
  **Title:** The Morning Star and the Evening Star
  **Time:** Approx. 3:30 – 4:00 minutes
  **Speaker:** The Brother

  [Stand up, adjust the microphone, take a breath. Smile at the sister.]

  Hi everyone. For those of you who don't know me, I'm [Sister's Name]'s little brother. Usually, my role in the family is to borrow money I won't pay back and eat the food she buys. So, the fact that she asked me to speak today is either a sign of her immense generosity, or she really wanted to see if I could handle a high-pressure situation without annoying her.

  When she asked me to give this toast, she gave me one rule. She said, "Please do not give the generic speech about soulmates and fate."

  Instead, she asked me to talk about Saul Kripke.

  [Pause for a slight laugh from the philosophy side of the room]

  For the rest of the family—Great Aunt [Name], this is for you—Saul Kripke is a philosopher my sister loves. And specifically, he talks about something called "Hesperus and Phosphorus."

  In ancient times, people looked at the sky and saw a bright star in the evening. They called it Hesperus. They saw a bright star in the morning. They called it Phosphorus. For centuries, everyone thought these were two different things. It wasn't until people actually looked through telescopes and did the work of observation that they realized: Hesperus *is* Phosphorus. They are both Venus.

  Now, here is the part that matters for today. Kripke says that once you know this, you know it's *necessarily* true. There is no universe where Hesperus isn't Phosphorus. But—and this is the crucial part—you couldn't know that just by sitting on your couch thinking about it. You had to go look. You had to gather the evidence. It is a necessary truth, but it is known *a posteriori*—which is just a fancy way of saying "through experience."

  [Sister's Name] told me she doesn't want this marriage to be about "fate." Fate implies that this was written in the stars before you two even met. That feels passive. Like you were just passengers on a train someone else was driving.

  But this? What you two have? This is Kripkean.

  It means that the truth of you together wasn't obvious from the outside. It wasn't a definition. It was something you had to discover. You had to look through the telescope of dating, of living together, of navigating grad school and real life and all the messy, empirical data of being human.

  And through that observation, you found out something necessary. You found out that the love you were looking for in the evening, and the love you wake up to in the morning, are the same thing. You didn't stumble into a destiny; you verified a truth.

  [Turn to the Fiancé]

  [Fiancé's Name], thank you for doing the fieldwork with her. Thank you for looking through the telescope.

  [Sister's Name], you've taught me that the most profound truths aren't the ones we assume are obvious. They're the ones we have to work to understand. And now that you've done the work, now that you've made the discovery, the truth is solid. It's rigid. It's necessary.

  So, I'd like to propose a toast.

  To the necessary a posteriori. To the truths that are only found through experience. And to [Sister's Name] and [Fiancé's Name]—may you spend the rest of your lives continuing to verify what you already know.

  [Raise glass]

  To the happy couple.
