answer: |-
  **MEMORANDUM**

  **TO:** Value-Assessment Committee
  **FROM:** [Your Name], Patient/Community Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Cost-per-QALY Cutoff Adoption

  **Recommendation**
  I recommend that the committee **vote against adopting a strict cost-per-QALY cutoff as a standalone tiebreaker.** Instead, I propose we adopt a **Multi-Criteria Decision Analysis (MCDA)** framework. This approach retains the economist's need for structured stewardship while correcting for the disability bias identified by the advocate.

  **Context**
  We are tasked with resolving budget impasses. The proposed solution is a $150,000/QALY threshold. While this aligns with some external benchmarks, our deliberations have revealed a fundamental tension between *efficiency* (maximizing aggregate health) and *equity* (avoiding discrimination against those with baseline disabilities).

  **Addressing the Economic Argument (Stewardship)**
  The health economist is correct that scarcity is real. Without a metric, allocation risks becoming arbitrary or driven by the loudest voices. We need a rational method to compare disparate interventions. A purely need-based system lacks a constraint on budget sustainability, and a lottery ignores clinical benefit. We must acknowledge that *some* measure of value is required to maintain the system's ability to serve the whole population.

  **Addressing the Advocacy Argument (Discrimination)**
  However, the disability-rights advocate is also correct that the QALY is not a neutral scientific instrument. It relies on an "interpersonal comparison of utility" that cannot be empirically verified. Specifically, standard QALY calculations often assign a lower value to a year of life lived with a disability *regardless of treatment*.
  *   **The Flaw:** If a patient has a baseline disability (e.g., Ehlers-Danlos, spinal cord injury), a treatment that extends their life may appear "less cost-effective" than the same treatment for a non-disabled patient, simply because their starting "quality" weight is lower.
  *   **The Consequence:** Adopting a strict cutoff institutionalizes a bias where the lives of chronically ill or disabled patients are systematically deprioritized. This is not just a philosophical objection; it creates legal and ethical liability under civil rights frameworks.

  **The Synthesis: Why MCDA?**
  The debate between "scientific allocation" and "value judgment" is a false dichotomy. All allocation rules are value judgments. The QALY cutoff merely hides its values inside a formula. An MCDA framework makes those values explicit and weighted by the committee.

  Under MCDA, we score potential approvals across multiple domains, such as:
  1.  **Clinical Benefit:** (Magnitude of health gain).
  2.  **Cost-Effectiveness:** (Cost per outcome, *without* penalizing baseline disability status).
  3.  **Severity of Disease:** (Prioritizing those with the highest unmet need).
  4.  **Equity Impact:** (Does this decision disproportionately affect protected classes?).

  **Why this works:**
  *   **For the Economist:** It preserves rationality. We are still weighing cost against benefit, but we are doing so transparently rather than relying on a single, flawed aggregate number.
  *   **For the Advocate:** It removes the automatic penalty against disabled lives. "Severity" and "Equity" become explicit counterweights to "Cost," ensuring that efficiency does not automatically trump fairness.

  **Next Steps**
  1.  **Reject** the motion to adopt a standalone $150k/QALY cutoff.
  2.  **Form a subcommittee** to draft an MCDA scoring rubric within 60 days.
  3.  **Interim Rule:** In the meantime, tiebreakers should default to **Severity of Condition** (prioritizing life-threatening or function-restoring interventions) rather than Cost-Effectiveness alone.

  We cannot solve the philosophical problem of comparing utility across persons. But we can build a process that admits we are making ethical choices, rather than pretending they are mathematical certainties.

  Respectfully,

  [Your Name]
