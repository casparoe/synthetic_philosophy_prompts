  2.  **Deconstruct the Pasadena Game:**
      *   *Setup:* Toss fair coin until Heads ($n$). Payoff $X_n = (-1)^{n+1} 2^n / n$. Probability $P(n) = 1/2^n$.
      *   *Expected Value Calculation:* $E[X] = \sum P(n) X_n = \sum (1/2^n) \cdot ((-1)^{n+1} 2^n / n) = \sum (-1)^{n+1} / n$.
      *   *Series:* $1 - 1/2 + 1/3 - 1/4 + \dots = \ln(2)$.
      *   *The Catch:* This is the alternating harmonic series. It converges conditionally, not absolutely.
      *   *The Consequence:* In standard measure-theoretic probability, expectation is defined via the Lebesgue integral. For the integral to be well-defined, the integral of the absolute value must be finite (absolute convergence). Since $\sum |(-1)^{n+1}/n| = \sum 1/n$ (harmonic series) diverges, the Lebesgue integral is undefined.
      *   *Order Dependence:* In discrete sums, order doesn't matter for finite sums. For infinite series, if not absolutely convergent, rearranging terms changes the sum. In probability, the "order" corresponds to how we partition the sample space or index the outcomes. Since the sample space is countable, there is no *intrinsic* order imposed by the probability space itself, leading to the indeterminacy.

