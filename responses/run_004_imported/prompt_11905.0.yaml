answer: |-
  # The Wager Without a Price: Rationality and the Pasadena Paradox

  The St. Petersburg paradox is a problem of infinity; the Pasadena game is a problem of order. In the St. Petersburg game, the expected value diverges to infinity, challenging the notion that rational agents should maximize expected monetary value. In the Pasadena game, introduced by Alan Hájek and Harris Nover, the expected value does not diverge—it evaporates. The series of expected payoffs is the alternating harmonic series ($1 - 1/2 + 1/3 - 1/4 \dots$), which converges to $\ln 2$ in its natural order. Yet, because the series is only conditionally convergent, the Riemann Rearrangement Theorem dictates that by reordering the terms, one can make the sum equal to any real number, or diverge to $\pm \infty$.

  Since the sample space of coin tosses is a countable set with no intrinsic ordering, there is no mathematical principle that privileges the "natural" order of tosses over any other permutation. Consequently, the Lebesgue integral—the standard foundation for expectation in probability theory—is undefined, because the integral of the absolute value of the payoff diverges.

  For your narrator, a former quantitative analyst obsessed with "impossible wagers," this is not merely a curiosity; it is an ontological crisis. If a gamble can be well-specified yet lack a determinate value, what becomes of the pricing models that underpin modern finance? To answer this, we must weigh three competing responses: the claim that the game lies outside the domain of rational evaluation; the attempt to rescue a determinate value through alternative summation; and the view that decision theory can tolerate undefined expectations without collapsing.

  The defensible position is the third: **The Pasadena game demonstrates that the Completeness Axiom of rational choice is false in pathological cases.** Rationality does not demand a preference where none is mathematically grounded. The expected value is genuinely undefined, and the rational attitude is one of *incomparability*, not indifference. Attempts to force a value are mathematical artifacts, while claims that "anything goes" misunderstand the normative force of decision theory.

  ### The Seduction of the Rescue

  The most intuitive reaction to the Pasadena game is to grasp for the $\ln 2$. It feels *correct*. The terms arrive in a natural temporal sequence (toss 1, toss 2, toss 3...), and summing them in that order yields a clean, finite number. Proponents of "rescue" operations argue that we should replace the standard Lebesgue expectation with a more disciplined summation procedure, such as Cesàro summation or a "weak expectation" based on long-run averages.

  This view is tempting for a novelist because it offers closure. It allows the quant to find a hidden order in the chaos. However, it is mathematically and philosophically indefensible in the context of a one-shot decision.

  The fundamental error of the rescue view is conflating the *sequence of calculation* with the *structure of the gamble*. In measure-theoretic probability, the expectation is an integral over a set of outcomes. A set is unordered. To sum over a countable set, we must impose a bijection to the natural numbers. In the Pasadena game, any such bijection is arbitrary. While the coin tosses occur in time, the *contract* is defined by the outcome set, not the temporal processing of that outcome. If I offer you the gamble, I am offering you a random variable $X$, not a sequence of partial sums.

  Furthermore, the "long-run" rescue fails technically. In the St. Petersburg paradox, one can argue that while the expectation is infinite, the time-average growth rate is finite (an ergodic solution). In the Pasadena game, the Law of Large Numbers does not apply. If you play the Pasadena game repeatedly, the sample mean of your payoffs does not converge to $\ln 2$; it oscillates indefinitely. There is no frequentist safety net. To assign a value of $\ln 2$ is to privilege a specific ordering of outcomes without normative justification. It is a numerical mirage, born of the human desire for closure rather than the structure of the risk.

  ### The Nihilist Trap

  At the opposite extreme lies the implication often drawn by Hájek and Nover themselves: if Expected Utility (EU) theory cannot assign a value, then the theory is silent, and consequently, *rationality* is silent. On this view, no attitude toward the game is more rational than another. Paying \$1 to play is as rational as paying \$1,000,000, or refusing to play at all.

  This is the "Domain Limit" view: the game falls outside the jurisdiction of EU reasoning. While mathematically honest, this position is normatively dangerous. It suggests that when the math breaks down, rational constraint disappears entirely. This leads to a form of decision-theoretic nihilism. If I prefer \$10 to \$5 in every other context, why does the Pasadena game grant me a license to prefer \$5 to \$10 simply because the calculation is undefined?

  The error here is conflating the *tool* with the *agent*. Expected Utility is a model of rationality, not the totality of it. That the model returns "undefined" does not mean the agent is free to act arbitrarily; it means the specific metric of *expectation* is inapplicable. To say "EU is silent" is not to say "Reason is silent." It is to say that this specific wager cannot be compared to sure sums using this specific metric. The nihilist view mistakenly infers that a lack of *measurement* implies a lack of *constraint*.

  ### The Verdict: Incompleteness as a Feature

  The most robust position, associated with Mark Colyvan, is that a normatively adequate decision theory can tolerate gambles that lack an expectation without this counting as a defect in the theory. I would strengthen this claim: The Pasadena paradox is not a problem to be solved, but a proof that the **Completeness Axiom** of rational choice is false.

  Standard decision theory assumes that for any two options $A$ and $B$, a rational agent must either prefer $A$ to $B$, prefer $B$ to $A$, or be indifferent between them. This is Completeness. The Pasadena game shows that there are well-defined options for which none of these relations hold. The gamble is not *worth* $\ln 2$, nor is it worth *nothing*, nor is it worth *infinity*. It is *incommensurable* with any finite sure sum.

  Why is this the correct view? Because it preserves the integrity of the mathematics without surrendering normative force.
  1.  **Mathematical Integrity:** It accepts the Lebesgue definition of expectation as the gold standard. Since the absolute integral diverges, the expectation is undefined. Full stop. No rearrangement tricks.
  2.  **Normative Force:** It does not imply "anything goes." It implies that the preference relation is *partial*, not total. A rational agent can legitimately say, "I cannot compare this gamble to \$5." This is not a failure of cognition; it is a recognition of the gamble's pathological structure.
  3.  **Defensibility:** It withstands the strongest alternative. The Rescue view fails because it imposes arbitrary order. The Nihilist view fails because it confuses incomparability with indifference. The Incompleteness view acknowledges that some risks are structurally resistant to pricing.

  For a rational agent, recognizing incomparability is a form of protection. If you acknowledge that the Pasadena game has no expected value, you are not compelled to pay any finite amount to play it (as you might be if the value were $+\infty$), nor are you compelled to reject it (as you might if the value were $-\infty$). You are permitted to treat it as a unique category of object—a "singular wager"—that does not enter into your standard portfolio calculations.

  ### Implications for the "Impossible Wagers"

  For your narrator, this distinction is the key to her obsession. If she believes the "Rescue" view, she is hunting for a ghost—the "true" value of $\ln 2$ hidden beneath the noise. She will frustrate herself trying to justify why one ordering of outcomes is more "real" than another. If she believes the "Nihilist" view, she becomes reckless, treating undefined risks as opportunities for arbitrary gain.

  But if she adopts the **Incompleteness** view, her obsession transforms. She is not looking for a price; she is mapping the boundaries of pricing itself. The "impossible wagers" in her notebook are not puzzles to be solved, but mirrors. They reveal where the language of value breaks down.

  In the context of your novel, this allows for a sophisticated resolution. The narrator need not find a way to calculate the uncalculable. Instead, her arc can be about accepting that some risks cannot be internalized into a utility function. The "engine" of your subplot is not the discovery of a new summation method, but the psychological and professional toll of operating in a world where prices are assumed to exist for everything. The Pasadena game proves they do not.

  The paradox is genuine only under the assumption that **rational preference must be complete**. Drop that assumption, and the paradox dissolves into a category error. The game has no expected value. A rational agent knows this, and therefore knows that asking "What is it worth?" is, in this specific instance, a malformed question. The wager is not a ticket to a payoff; it is a test of whether the agent has the courage to leave a price tag blank.

  ### Conclusion

  The Pasadena game does not break decision theory; it refines it. It forces us to admit that Expected Utility is a tool for managing risk, not a metaphysical law of value. When the absolute convergence condition fails, the tool stops working. The "Rescue" attempts are mathematical fiction; the "Nihilist" response is normative surrender. The correct stance is **tolerance of incompleteness**.

  For your character, the lesson is this: The market assumes completeness. It assumes everything has a price. Her obsession with "impossible wagers" is a quiet rebellion against that assumption. She knows that some things—some risks, some outcomes, some lives—resist integration. To assign them a value is not rationality; it is a delusion of control. The most rational thing she can do is close the notebook, acknowledge the undefined, and walk away from the table. Not because the price is too high, but because there is no price.
