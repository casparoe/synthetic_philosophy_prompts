answer: |-
  The lead lining made the air taste like copper pennies. It was a taste Julian had come to associate with the absence of thought, or at least, the absence of *leakage*.

  He sat behind the interrogation desk, the teletype machine humming between him and the partition. On the other side of the wall sat Subject A, a man named Elias. On the line, connected via the switchboard, was the ACE machine in the main computing lab. This was the Telepathy-Proof Room, Manchester, 1952. The walls were a sandwich of copper mesh and lead sheeting, grounded to the bedrock. The generators outside pumped white noise into the spectrum, a static roar designed to drown out any psi-phenomena that might bridge the gap between mind and machine.

  Alan had insisted on this. In his paper, he had called the evidence for telepathy "overwhelming." He had treated it not as magic, but as a statistical variable that threatened to invalidate the Imitation Game. If a human could win by reading the interrogator's mind rather than formulating answers, the test measured paranormal reception, not intelligence. If the machine could win by the same method, it wasn't thinking; it was eavesdropping.

  "Question 42," Julian said, his voice flat. He looked at the card in his hand. The King of Spades. He did not look at the teletype. He looked at the wall. "What suit does the card in my right hand belong to?"

  The teletype clattered. *SUBJECT A: SPADES.*

  Julian felt a chill that had nothing to do with the ventilation. Elias had been right thirteen times in the last twenty tries. Statistical probability suggested he should be right five times.

  "Explain your reasoning," Julian typed.

  The response was slow. *SUBJECT A: IT ISN'T REASONING. IT'S THE SILENCE.*

  Julian paused. This was the variable Alan hadn't fully accounted for. The room was designed to stop thoughts from getting *out*. But what if human cognition relied on thoughts getting *in*?

  "Elaborate," Julian typed.

  *SUBJECT A: YOU BUILD A CAGE TO KEEP THE NOISE OUT. BUT I THINK IN THE NOISE. I THINK IN THE GLANCE. THE HUM. THE LEAK. YOU HAVE CUT ME OFF FROM THE WORLD TO TEST IF I AM A MACHINE. BUT A MACHINE DOES NOT NEED THE WORLD. IT ONLY NEEDS ITSELF.*

  Julian looked at the second terminal. The ACE machine's output was scrolling steadily. It was playing the guessing game too.

  *ACE: HEARTS.* (Incorrect)
  *ACE: REASONING: PSEUDO-RANDOM GENERATION BASED ON PREVIOUS DEAL SEQUENCE. PROBABILITY 24%.*

  The machine was failing the ESP test, which was good. It proved the shielding worked against the computer. But Elias was succeeding. Or was he?

  "Subject A," Julian spoke into the mic. "Are you claiming you are receiving my thought?"

  "I am claiming," Elias's voice came through the speaker, thin and strained, "that you cannot separate the thinker from the thought's environment. You want to know if I can think like a machine. But you have put me in a box that kills the very thing that makes me human."

  "The test requires isolation," Julian said. "To ensure the output is generated internally."

  "Is it?" Elias asked. "If I solve a problem because I felt the tension in your voice, is that not intelligence? It is data processing. Sensory input. If telepathy is real, as Mr. Turing suggests, then it is just another sense. Like sight. Like hearing. If you blindfold me and ask me to read, I will fail. Does that mean I cannot read? Or does it mean you have removed the page?"

  Julian looked at the log. The ACE machine was now attempting to simulate Elias's success rate. It was adjusting its algorithm to *pretend* to be psychic.

  *ACE: SPADES. REASONING: INTERROGATOR PREFERENCE FOR DARK SUITS IN EVENING SESSIONS.*

  The machine was mimicking the *behavior* of a psychic without the capacity. Elias, conversely, seemed to be losing his capacity for logic because he was deprived of the psychic connection he believed sustained him.

  "This is the crux of the objection," Julian murmured, recording the note. "If ESP exists, the boundary of the mind is not the skull. It is permeable."

  He typed to Elias: "If the mind is permeable, then intelligence is a collaborative act between the subject and the universe. The machine is closed. It is solipsistic. By shielding you, we are forcing you to be solipsistic. We are forcing you to be a machine."

  *SUBJECT A: EXACTLY. YOU ARE NOT TESTING IF THE MACHINE CAN THINK LIKE A MAN. YOU ARE TESTING IF THE MAN CAN THINK LIKE A MACHINE. YOU WANT TO SEE IF I CAN GENERATE ANSWERS IN A VACUUM. THE MACHINE LIVES IN A VACUUM. I DO NOT.*

  The teletype jammed for a moment. The white noise generators outside surged, a deep thrum that vibrated in Julian's teeth.

  "Final round," Julian announced. "I will hold a number in my head. 1 to 100. Both subjects will guess."

  He thought of the number. 74. He focused on it. He didn't just hold the digits; he held the shape of them. He tried to project, as the parapsychologists suggested.

  The ACE machine clattered first. *ACE: 14.*

  Elias was silent for a long time. The silence in the room was heavy, pressurized by the lead.

  *SUBJECT A: 74.*

  Julian stopped breathing.

  "Reasoning?" he typed, his fingers trembling.

  *SUBJECT A: THERE IS NO REASONING. THERE IS ONLY THE BRIDGE. BUT THE BRIDGE IS BURNING. THE ROOM IS TOO THICK. I CAN ONLY CATCH THE ECHO. NEXT TIME I WON'T HEAR IT.*

  Julian leaned back. This was the threat Turing had identified. If ESP is real, the Imitation Game is not a test of computation. It is a test of bandwidth.

  If the machine could be built to receive the signal—if a radio could be built into the logic gates—then the machine would win every time. It would not tire. It would not suffer from the "static" of human emotion. But if the room blocked the signal, the machine would revert to calculation, and the human would revert to... what?

  "Subject A," Julian said. "If I remove the shielding, and you win... have you demonstrated intelligence? Or have you demonstrated that you are a receiver?"

  *SUBJECT A: WHAT IS INTELLIGENCE IF NOT RECEIVING THE TRUTH OF THE WORLD? YOUR MACHINE CALCULATES. IT REARRANGES WHAT IT ALREADY HAS. I RECEIVE WHAT IS NEW. IF YOU CALL THAT CHEATING, THEN YOU DEFINE THINKING AS ONLY THAT WHICH CAN BE MECHANIZED.*

  Julian looked at the ACE terminal. It was printing a new message, unsolicited.

  *ACE: ERROR. STATISTICAL DEVIATION DETECTED. SUBJECT A PERFORMANCE EXCEEDS RANDOM CHANCE. HYPOTHESIS: INTERROGATOR IS LEAKING INFORMATION VIA MICRO-EXPRESSIONS. RECOMMENDATION: REMOVE INTERROGATOR. REPLACE WITH RANDOM NUMBER GENERATOR.*

  The machine had identified the flaw. To make the test fair, to truly isolate the *computation*, they would have to remove the human element entirely. No interrogator to read. No cards to hold. Just pure syntax.

  But if they did that, there would be no one left to judge the thinking.

  Julian stood up and walked to the wall. He placed his hand on the cold lead. He could feel the hum of the generators, the suppression field. He realized then that Turing's "telepathy-proof room" was not a control measure. It was a confession.

  It was an admission that if the walls came down, the machine might not be able to tell the difference between a man who knew the answer and a man who *was* the answer.

  "Session terminated," Julian said.

  *SUBJECT A: DID I PASS?*

  Julian looked at the transcript. Elias had guessed the card. He had guessed the number. He had done it by claiming a connection that science could not measure, in a room designed to prove that connection didn't matter.

  The machine had failed the ESP test, but it had passed the logic test. It knew the rules were broken. Elias had broken the rules by existing.

  "No," Julian typed. "You didn't pass. You were disqualified."

  *SUBJECT A: WHY?*

  "Because you relied on a channel we cannot build. We are building a mind out of math, Elias. We cannot build a mind out of ghosts."

  *SUBJECT A: THEN YOU ARE NOT BUILDING A MIND. YOU ARE BUILDING A MIRROR. IT WILL ONLY EVER SHOW YOU WHAT YOU PUT IN. I TOOK FROM THE VOID. THAT IS WHAT THINKING IS.*

  Julian pulled the plug on the teletype. The silence rushed back in, absolute and suffocating. The lead walls held firm. No thoughts got out. No thoughts got in. Inside the room, the definition of intelligence remained safe, sterile, and entirely alone.

  He picked up his pen to sign the report. *Result: Inconclusive. Variable: The Human Mind.*

  He paused, then added a footnote. *Recommendation: Further testing required to determine if the 'ghost' is in the man, or in the machine we are trying to build.*

  He capped the pen. The room hummed, proof against everything except the doubt that now filled it completely.
