answer: |-
  Friends, family, colleagues.

  For thirty years, I had the privilege of calling [Name] my friend. I am a biologist by trade, though I came to the questions she loved later in life. She was my teacher, long before she was ever my subject. She taught me that understanding the world does not require consuming it. It requires attending to it.

  Many of you know [Name] as a mother, a sister, a friend who laughed loudly and loved fiercely. Some of you know her as a scientist who mapped the physiology of human vision. There is a story she often told about herself, one that she found very funny. In philosophy, there is a famous thought experiment about a scientist named Mary. Mary knows every physical fact about color—every wavelength, every neuron, every chemical reaction—but she has never seen color herself. The question is: when she finally sees red, does she learn something new?

  Most people say yes. They say she learns what it *feels* like. They say there is a secret experience that science cannot touch.

  [Name] was Mary. She lived with complete congenital achromatopsia. Her world was grayscale. And she spent her career proving that the majority was wrong. She believed that knowing the physical facts *was* knowing the truth. She believed that what we call "experience" is not a magical ghost in the machine, but a set of skills. To know red is not to have a private picture in your head; it is to know how to recognize a strawberry, how to stop at a light, how to navigate the world. She lacked the retinal hardware, but she possessed the knowledge. She was a living proof that the physical story is the whole story.

  She was incredibly proud of that. And because she was rigorous to the end, she gave me specific instructions for today. She told me, plainly: "Do not let anyone stand up there and say I can finally see red now."

  She knew that sentiment would be offered with love. She knew it is meant to comfort. But to her, that phrase would imply that her life was incomplete, and that her science was unfinished. It would suggest that there is a part of reality that only reveals itself after death. She did not believe that. She believed reality is here, in the wiring, in the light, in the brain. She believed she saw the world fully, exactly as it is, without the decoration of color. To say she sees differently now would be to say she was wrong then. And she was not wrong.

  So, I will not say she is looking down at us in color. I will not say she has found a rainbow waiting for her.

  Instead, I will say this: [Name] saw us. She saw us with high resolution. She saw the structure of our lives, the mechanisms of our grief, the biology of our love. She understood that we are physical beings, made of matter that thinks and feels. She found that miraculous enough. She did not need an afterlife to find wonder in existence. She found it in the data, in the synapse, in the friend sitting across the table.

  To her family: She did not view her life as a deprivation. She viewed it as a clarity. She often told me that when people spoke of color, they got distracted by the surface. She had to look deeper at the form, the contrast, the luminance. She applied that same clarity to her relationships. She did not love you for how things looked; she loved you for how things *were*. Her love was not a fleeting sensation; it was a recognized fact, a stable state, a skill she practiced every day.

  To her colleagues: She held the line. She never conceded the hard ground of physicalism for the soft comfort of dualism. She leaves behind a body of work that insists the universe is intelligible, that we are not mysteries to ourselves, but complex systems that can be known.

  To all of us: We honor her best not by imagining her in a place she did not believe in, but by continuing the work she did believe in. We honor her by looking at the world as she did: without illusion, with rigor, and with a deep appreciation for the machinery that allows us to be here at all.

  She is not gone to a better place. She is gone from this one. And the structure she built in us—through her science, her friendship, and her integrity—remains. That is not a metaphor. It is a physical fact. We carry her influence in our own neural pathways. We remember her. We know her. And in the only way that matters, she is still here, in the knowledge we share.

  Rest well, my friend. You saw clearly.
