prompt: |-
  I am a retired biologist who came to philosophy of mind only after I retired. My closest friend of thirty years, a color-vision researcher, died last week. She had complete congenital achromatopsia, so her whole career was spent on the physiology of a sense she had never personally used, and she liked to joke that this made her a living rebuttal to Frank Jackson's Mary. She was a committed physicalist of the ability-hypothesis persuasion: to the end, she held that what she lacked was a set of recognitional skills, not some further fact about color that her own science had left out. She told her family plainly that no one was to stand up at the funeral and say she can finally see red now, since that would concede exactly what she had spent her career denying. I am delivering that eulogy myself, in a chapel that will seat her family, who have never heard the word "qualia," beside several of her former philosophy-of-mind collaborators, who will notice at once if I soften the metaphysics to make the ending prettier. Please write it: warm enough for the family, and careful enough that her old collaborators do not wince.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Retired biologist, new to philosophy of mind, close friend of the deceased (30 years).
      *   **Deceased:** Color-vision researcher, complete congenital achromatopsia (total color blindness), physicalist, proponent of the Ability Hypothesis (Lewis/Nemirow), viewed herself as a rebuttal to Frank Jackson's "Mary's Room."
      *   **Constraint 1 (Family):** Needs to be warm, accessible, no jargon like "qualia," no religious/spiritual implications about "seeing red now."
      *   **Constraint 2 (Colleagues):** Needs to be metaphysically accurate to her views (physicalism, ability hypothesis), no softening that implies dualism or post-mortem experience of color.
      *   **Tone:** Respectful, intellectual but accessible, poignant, faithful to her life's work and personal stance.
      *   **Setting:** Chapel funeral.

  2.  **Deconstruct the Core Philosophical Conflict:**
      *   *Frank Jackson's Mary:* A scientist who knows all physical facts about color but has never seen it. When she sees red, does she learn something new? (Jackson said yes, implying non-physical qualia).
      *   *The Deceased's View:* She *was* Mary, but she disagreed with Jackson. She believed knowing the physics/physiology *was* knowing the fact. The "experience" is just a set of abilities (recognitional, imaginative).
      *   *The Taboo:* "She can finally see red now." This implies dualism (the soul sees what the eyes couldn't) and contradicts her life's work.
      *   *The Challenge:* How to honor her loss without validating the very thing she argued against? How to make "not seeing red" sound like a complete life, not a deficit?

  3.  **Determine the Angle/Theme:**
      *   Focus on *knowledge* and *understanding* rather than *sensation*.
      *   Highlight the irony (which she loved) that she understood color better than most who see it.
      *   Emphasize her integrity and consistency.
      *   Use biological metaphors (since the speaker is a biologist) to bridge the gap between family and colleagues.
      *   The "vision" she had was intellectual and relational, not retinal.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, establish the relationship. Keep it grounded.
      *   **The Work (for the colleagues):** Address her research without getting bogged down in jargon. Explain the "Mary" connection simply.
      *   **The Philosophy (for the family):** Translate "Ability Hypothesis" into human terms. It's about *knowing how*, not just *knowing that*. It's about connection.
      *   **The Prohibition:** Address the "see red now" instruction directly but gently. Explain *why* she asked this (integrity).
      *   **The Tribute:** What did she actually see? She saw structure, truth, people.
      *   **Closing:** A farewell that respects her physicalism. No "gone to a better place," but "remembered in the structure we share."

  5.  **Refining the Language (Iterative Process):**

      *   *Attempt 1 (Mental):* "She didn't see color but she knew it. She said don't say she sees it now. She was a scientist." -> *Too blunt.*
      *   *Attempt 2 (Mental):* "Her soul is colorful." -> *Violates constraints. Colleagues will wince.*
      *   *Attempt 3 (Balancing):* Use the concept of "focus." She focused on the mechanism. She taught us how to look.
      *   *Key Phrase:* "She knew the world in high resolution." (Avoids color, implies detail).
      *   *Key Phrase:* "Knowledge is not a picture; it is a tool." (Aligns with Ability Hypothesis).
      *   *Handling the "Mary" reference:* Don't use the word "qualia." Explain the thought experiment as a story about a scientist who knew everything but lacked the skill. She was that scientist, and she proved the story wrong.

  6.  **Addressing the Specific Constraints:**
      *   *Family:* Needs to feel loved. Mention her humor, her dedication.
      *   *Colleagues:* Needs to hold the line on physicalism. No hint of an afterlife where her brain functions differently.
      *   *Speaker:* Needs to sound like a biologist. Use terms like "mechanism," "structure," "wiring."

  7.  **Drafting the Content (incorporating the "No Red" rule):**
      *   I need to explicitly mention her instruction about the eulogy. It shows her wit and conviction.
      *   I need to frame her lack of color vision not as a blindness, but as a different mode of engagement that was complete.
      *   The ending needs to be about memory and impact, which are physical traces in the living.

  8.  **Final Polish:**
      *   Check for accidental dualism. (e.g., avoid "spirit," "soul," "heavenly vision").
      *   Ensure the tone is warm. (e.g., mention her laugh, her friendship).
      *   Make sure the "Ability Hypothesis" is translated into "skills" or "ways of navigating."

      *(Self-Correction during drafting)*: I initially thought about explaining the Ability Hypothesis in depth. *Correction:* No, that's too academic for the family. Frame it as "knowing how to navigate" vs "having a picture."
      *(Self-Correction)*: Make sure I don't sound like I'm lecturing. I'm a friend speaking.

  9.  **Final Review against constraints:**
      *   Warm for family? Yes, focuses on friendship and character.
      *   Rigorous for colleagues? Yes, upholds physicalism, rejects post-mortem qualia.
      *   No "qualia"? Checked.
      *   No "seeing red now"? Checked.

  10. **Final Output Generation** (Proceed to write the eulogy based on these thoughts).

  **(Post-Drafting Check):** Does the ending land? It needs to be final. "We carry the data." No, too cold. "We carry the structure of her." Better. "We remember her." Simple. Let's go with the idea that she lives on in the *understanding* she left behind.

