      *   *Distinction between Perception and Cognition:* Where does "seeing" end and "thinking" begin? The "line" is blurry.
      *   *The "Theory-Ladenness" vs. "Encapsulation":* Fodor argued for encapsulation to explain illusions (e.g., Müller-Lyer lines still look unequal even when you *know* they are equal). If knowledge penetrated, illusions should vanish. They don't. So, how do we reconcile birding (where knowledge seems to help) with illusions (where knowledge doesn't help)?
      *   *Methodological Rigor:* Anecdote vs. Controlled Experiment. Subjective reports are notoriously unreliable in science.

