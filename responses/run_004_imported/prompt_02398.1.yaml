      *   **Task:** Write a short story (1000-1800 words).
      *   **Requirements:**
          *   Protagonist gets verified access to future beliefs (letter, oracle, implant, etc.).
          *   Independent reason to suspect future belief might be compromised (not genuine learning).
          *   Dramatic/intellectual crux must be the Reflection-style dilemma (to defer or not to defer).
