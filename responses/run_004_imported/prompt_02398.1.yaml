  4.  **Developing the Plot:**
      *   **Beginning:** Aris is in the chamber. The Link is active. He receives the credence report from $t+24$ hours.
      *   **Middle:** The report says $P(\text{Safe}) = 0.15$. Aris currently observes $P(\text{Safe}) \approx 1.0$.
