prompt: |-
  In my formal epistemology seminar, we recently covered David Lewis's Principal Principle: roughly, the idea that a rational agent's credence in an outcome should equal the objective chance of that outcome. I think I've found a fairly direct counterexample. Suppose a fair coin is about to be tossed, so the objective chance that it lands heads is exactly one half. Now suppose a completely reliable oracle, stipulated for the sake of the example to be error-free, tells me with certainty that this particular coin will land heads on this particular toss. Surely, on hearing the oracle, I should have credence near 1 that it will land heads, not 0.5. But the objective chance of heads is still 0.5 right up until the coin actually lands, so the Principal Principle seems to say my credence should stay at 0.5 regardless of what the oracle tells me. Either I ignore the oracle and keep my credence pinned to the chance, which seems clearly irrational, or I update to near-certainty and thereby violate the principle.

  I raised this in our study group, and we split into two camps. One camp thinks this shows the Principal Principle simply cannot be right as a general norm of rational credence, since any testimony about a specific outcome will generate the same tension. The other camp suspects there must be some restriction on which evidence the principle actually governs, but nobody could say what that restriction is, or why it would be a principled feature of the theory rather than a patch introduced just to dodge examples like mine. Which camp has it right: does the oracle case genuinely refute the Principal Principle, and if it doesn't, what exactly is supposed to block it, and is that move well-motivated or just an ad hoc rescue?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Formal epistemology seminar.
      *   **Topic:** David Lewis's Principal Principle (PP).
      *   **Proposed Counterexample:** A fair coin (chance $0.5$) vs. a reliable oracle predicting Heads (credence $\approx 1$).
      *   **The Tension:** PP says $Cr(A | Ch(A)=x) = x$. Here $Ch(Heads)=0.5$, so $Cr(Heads)$ should be $0.5$. But the oracle says Heads, so $Cr(Heads)$ should be $1$. Contradiction?
      *   **The Debate:** Two camps in the study group.
          *   Camp 1: PP is false/refuted.
          *   Camp 2: PP has a restriction on evidence, but they don't know what it is or if it's ad hoc.
      *   **The Question:** Which camp is right? Does the oracle case refute PP? If not, what blocks it? Is that move well-motivated or ad hoc?

  2.  **Initial Assessment & Knowledge Retrieval:**
      *   This is a *classic* objection to the Principal Principle. It's often called the "problem of crystal balls" or "inadmissible evidence."
      *   Lewis himself anticipated this. The Principal Principle is *not* $Cr(A | Ch(A)=x) = x$. It is $Cr(A | Ch(A)=x \land E) = x$, *provided that $E$ is admissible evidence*.
      *   The oracle's prediction is the paradigmatic example of *inadmissible* evidence.
      *   So, Camp 2 is essentially correct, but they need the specific terminology and justification to feel satisfied that it's not ad hoc.
      *   Key concepts: Admissibility, Lewis's formulation, Hall's revision, the definition of chance.

  3.  **Deconstruct the Principal Principle (PP):**
      *   *Naive PP:* $Cr(A | Ch_t(A) = x) = x$.
      *   *Lewis's Actual PP:* $Cr(A | Ch_t(A) = x \land E) = x$, where $E$ is *admissible* with respect to $A$ and $t$.
      *   What is admissibility? Roughly, evidence that influences credence *only* by influencing beliefs about chances. Historical evidence up to time $t$ is usually admissible. Future outcomes or direct predictions of outcomes are inadmissible.

  4.  **Address the Oracle Counterexample:**
      *   The oracle's testimony is evidence about the *outcome*, not just the *chance*.
      *   If you know the outcome (or have a reliable predictor of it), the chance becomes irrelevant for your credence.
      *   Lewis explicitly discusses "crystal balls." He says if you have a crystal ball, you shouldn't follow the PP.
      *   Therefore, the oracle case does *not* refute PP because PP has a built-in clause for this.

  5.  **Evaluate the "Ad Hoc" Charge:**
      *   Is the admissibility clause just a patch?
      *   *Argument for "Not Ad Hoc":* The concept of objective chance is defined by its role in rational belief. If evidence bypasses chance to tell you about the outcome, it's not evidence *about the chance*, it's evidence *about the fact*. The PP is a bridge principle between chance and credence. If you have a direct bridge to the fact, you don't need the chance bridge.
      *   *Argument for "Problematic":* Defining admissibility precisely is notoriously difficult. Lewis struggled with it. Ned Hall and others have tried to refine it. If "admissible" just means "doesn't violate PP," it's circular. We need an independent characterization.
      *   *Resolution:* It's not ad hoc in intent (Lewis knew about crystal balls), but the *definition* of admissibility is a major open problem in the philosophy of probability. However, the *intuition* behind it is robust.

  6.  **Drafting the Response:**
      *   **Acknowledge the sophistication:** This is a standard, well-known objection in the literature. Validate the user's insight.
      *   **Direct Answer:** Camp 2 is right, but they need the specific technical machinery (Admissibility). The oracle case does not refute PP because PP is conditional on admissible evidence.
      *   **Explain Lewis's Formulation:** Quote or paraphrase the actual principle including the $E$ (evidence) clause.
      *   **Define Admissibility:** Explain what makes evidence admissible (historical, pre-outcome) vs. inadmissible (future-looking, oracle, crystal ball).
      *   **Address the "Ad Hoc" Worry:**
          *   Why it's not merely a patch: The function of chance is to guide credence *in the absence of direct information*.
          *   Acknowledge the difficulty: Defining admissibility rigorously is hard (Lewis admitted this). Mention Ned Hall's work (chance vs. credence principles).
      *   **Alternative Perspectives:** Mention that some philosophers (like Hawthorne, Lasonen-Aarnio) have critiqued the admissibility move, but the mainstream view retains PP with the admissibility constraint.
      *   **Conclusion:** The principle stands, but the oracle case highlights the crucial distinction between evidence about *chances* and evidence about *outcomes*.

  7.  **Refining the Tone:**
      *   Keep it academic but accessible (seminar level).
      *   Be precise with notation ($Cr$, $Ch$, $t$).
      *   Ensure the distinction between the *naive* PP and the *actual* PP is clear.

  8.  **Self-Correction/Nuance Check:**
      *   *Did Lewis actually say this?* Yes, in "A Subjectivist's Guide to Objective Chance." He discusses the crystal ball explicitly.
      *   *Is the chance still 0.5?* Yes, assuming the coin is fair and the toss hasn't happened. The oracle doesn't change the chance; it changes the epistemic situation.
      *   *Is the admissibility clause circular?* This is a major criticism. I should mention that while the *clause* saves the principle, the *definition* of admissibility is the real philosophical battleground. I shouldn't pretend the problem is fully solved, but I should affirm that the oracle doesn't *refute* the principle as Lewis intended it.
      *   *Camp 1 vs. Camp 2:* Camp 1 is wrong about the text of PP. Camp 2 is right about the spirit, but lacks the vocabulary. I need to give them the vocabulary.

