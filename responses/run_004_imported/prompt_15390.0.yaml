answer: |-
  This is a classic and excellent objection, one that David Lewis himself anticipated and addressed in his seminal paper, *"A Subjectivist's Guide to Objective Chance"* (1980). Your study group has effectively rediscovered the "problem of inadmissible evidence," which is central to the modern understanding of the Principal Principle (PP).

  Here is the breakdown for your seminar: **Camp 2 is right, but they need the specific technical vocabulary to defend their position.** The oracle case does not refute the Principal Principle as Lewis formulated it, because the principle contains a built-in restriction that explicitly handles this scenario. However, your group's worry about whether this restriction is "ad hoc" touches on the deepest unresolved problem in the philosophy of chance.

  ### 1. The Text of the Principle
  The version of the Principal Principle you stated in your prompt is the "naive" version:
  $$Cr(A \mid Ch(A) = x) = x$$
  Lewis never endorsed this naive version. His actual formulation includes a condition on total evidence $E$:
  $$Cr(A \mid Ch_t(A) = x \land E) = x$$
  **...provided that $E$ is *admissible* with respect to $A$ and time $t$.**

  The oracle's testimony is the paradigmatic example of **inadmissible evidence**.

  ### 2. Why the Oracle is Inadmissible
  Lewis distinguishes between evidence that bears on the *chance* of an event and evidence that bears on the *outcome* of the event directly.
  *   **Admissible Evidence:** Typically, this is historical information up to time $t$. It influences your credence in the outcome *only* by influencing your belief about the objective chance. For example, knowing the coin is manufactured fairly affects your credence in Heads because it establishes that $Ch(Heads) = 0.5$.
  *   **Inadmissible Evidence:** This is information that gives you a "crystal ball" look at the future. It influences your credence in the outcome *even if* your belief about the chance stays fixed. The oracle's prediction is inadmissible because it bypasses the chance. It tells you the outcome directly.

  Lewis explicitly discusses "crystal balls" in his 1980 paper. He writes that if you have a crystal ball that shows you the outcome, you should believe the crystal ball, not the chance. He states: *"The Principal Principle... is restricted to admissible evidence... Information about the future is inadmissible."*

  Therefore, in your example, the rational agent updates their credence to 1 based on the oracle, and this **does not violate the Principal Principle**, because the PP simply does not apply when inadmissible evidence is present.

  ### 3. Is the Admissibility Clause "Ad Hoc"?
  This is the harder philosophical question your group raised. Is adding the "admissibility" clause just a patch to save the theory from counterexamples, or is it principled?

  **The Argument for "Principled":**
  The move is well-motivated by the functional role of objective chance. Chance is posited as a theoretical entity that summarizes the probabilistic structure of the world. Its normative role is to guide belief *in the absence of direct knowledge*. If you have direct knowledge (or a reliable proxy for it, like the oracle), the theoretical entity (chance) is no longer the primary guide.
  Think of it like a weather forecast. If the "chance of rain" is 50%, you take an umbrella. But if you look out the window and see it raining (inadmissible evidence about the outcome), you take an umbrella regardless of the forecast. The forecast isn't "wrong"; it just isn't the only input. The PP is a bridge principle between chance and credence; if you have a direct tunnel to the fact, you don't need the bridge.

  **The Argument for "Problematic":**
  Your group's suspicion is shared by many philosophers. While the *clause* saves the principle, defining "admissibility" non-circularly is notoriously difficult.
  *   If we define admissible evidence as "evidence that satisfies the Principal Principle," the principle is trivial and uninformative.
  *   Lewis suggested admissible evidence is roughly "historical evidence up to time $t$," but this is vague.
  *   Philosopher Ned Hall (2004) argued that we should distinguish between two concepts of chance: one that satisfies the PP (Lewisian chance) and one that governs actual frequencies.

  So, while the oracle case doesn't *refute* the PP (because of the clause), it does highlight that the PP relies on a distinction (admissible vs. inadmissible) that is intuitive but technically difficult to formalize without circularity.

  ### 4. Recommendation for Your Seminar
  You should advise your study group that Camp 1 is incorrect regarding the text and intent of Lewis's theory. The oracle case is a standard "test case" that the theory is designed to handle via the admissibility constraint.

  However, Camp 2 is right to be suspicious of the *foundations*. The debate isn't about whether the oracle overrides the chance (it does); the debate is about whether we can define "admissibility" independently of the Principal Principle itself.

  **Suggested Reading to Resolve the Tension:**
  1.  **David Lewis, "A Subjectivist's Guide to Objective Chance" (1980):** Specifically the section where he discusses crystal balls and inadmissible evidence.
  2.  **Ned Hall, "Two Concepts of Probability" (2004):** This explains why the tension exists and how modern epistemologists try to disentangle the concepts.
  3.  **John Hawthorne & Maria Lasonen-Aarnio, "Knowledge and Objective Chance" (2009):** For a critical perspective on whether the admissibility move truly saves the principle.

  **Verdict:** The Principal Principle stands, but only with the admissibility constraint. The oracle case is not a counterexample; it is a boundary condition that defines the scope of the principle. The move is not ad hoc in intent (Lewis built it in from the start), but the precise definition of admissibility remains one of the most significant open problems in formal epistemology.
