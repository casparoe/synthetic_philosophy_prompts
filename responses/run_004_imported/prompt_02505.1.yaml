answer: |-
  **Setting:** *A kitchen, 1:15 AM. The only light comes from the refrigerator and the glow of a smartphone screen on the counter. ELIAS is leaning against the counter, rubbing his eyes. MARA is sitting at the table, nursing a glass of water.*

  **Elias:** I did it again. I literally said out loud, "I am putting this down," and then five minutes later I was watching a video about restoring a rusty 19th-century saw.

  **Mara:** And how do you feel?

  **Elias:** Like an idiot. Like I betrayed myself.

  **Mara:** See, that's the word I want to interrogate. "Betrayed." Who betrayed whom?

  **Elias:** Me. Myself.

  **Mara:** Which you? The you at 11 PM who wanted sleep, or the you at 1 AM who wanted to see the rust removal technique? You're talking like there's a single CEO running the show who got overruled by the intern. I'm saying the CEO and the intern are different people.

  **Elias:** That's the hyperbolic discounting argument. I know it. The value of "immediate gratification" spikes as it gets closer, distorting the curve. But that's just a description of the mechanism, Mara. It doesn't explain the *irrationality*.

  **Mara:** Because there isn't any. That's my point. At 11 PM, it was rational for Night-Elias to plan for sleep. At 1 AM, it is rational for 1 AM-Elias to seek stimulation. The discount rate changed. If you prefer $50 now over $100 tomorrow, that's a preference. If you prefer $50 *today* over $100 *tomorrow*, that's the same preference. Why is acting on your current preference "weakness" rather than just... acting?

  **Elias:** Because at 1 AM, I *still* prefer sleep. That's the thing the discounting model glosses over. It assumes my preference actually flips. It doesn't. I am scrolling *while* thinking, "I should not be scrolling." I am holding two contradictory beliefs simultaneously: "This is bad for me" and "I am doing this." If 1 AM-Me genuinely valued scrolling more, I wouldn't feel the conflict. I'd just be enjoying the saw video.

  **Mara:** But you *are* enjoying it. Or at least, you're pursuing it. The guilt is just a hangover from 11 PM-Me. You're privileging that past self's judgment as the "true" one. Why does 11 PM-Me get veto power? He's a tyrant. He wants to restrict the fun of 1 AM-Me for the benefit of 8 AM-Me. Why is 8 AM-Me's comfort more sacred than 1 AM-Me's curiosity?

  **Elias:** Because 11 PM-Me is considering the whole timeline. 1 AM-Me is myopic. It's not about sanctity; it's about information. 11 PM-Me has a clearer view of the consequences. 1 AM-Me is intoxicated by immediacy. If I drink too much and decide to drive, my preference in the moment is to drive. But we don't say, "Well, Drunk-Elias has a different discount curve, let him drive." We say his judgment is impaired.

  **Mara:** Impaired by what? Biology? Dopamine? Sure. But "weakness of will" implies a moral failure, a fracture in rationality. I'm saying it's just a negotiation between temporal selves. When you call it akrasia, you're saying there's a "Real Elias" who exists outside of time. There isn't. There's just a string of moments. If 1 AM-Elias acts to maximize 1 AM-Elias's utility, he's being perfectly rational. The "weakness" is just 8 AM-Elias complaining that the contract wasn't honored.

  **Elias:** Okay, but if that's true, why do I make pre-commitments? Why do I buy alarm clocks that run across the room? If every temporal self is acting rationally for its own moment, Ulysses tying himself to the mast makes no sense. He was just negotiating with a future self who had different interests.

  **Mara:** It makes perfect sense. It's a contract. 11 PM-Elias knows 1 AM-Elias is going to be reckless, so he restricts 1 AM-Elias's options. It's not correcting an error; it's managing a conflict of interest. Like a parent taking the car keys from a teenager. The teenager isn't "irrational," he just has a different risk profile.

  **Elias:** But the teenager *knows* he shouldn't drive. That's the key! Akrasia isn't changing your mind. It's acting against your better judgment *while holding that judgment*. If I genuinely changed my mind at 1 AM and thought, "You know what, sleep is overrated, rust is life," then you'd be right. That would just be a preference shift. But I don't. I feel the pull of the long-term goal *in the moment*, and I override it. That override feels like a failure of agency, not a math problem.

  **Mara:** That "feeling" is the friction of the discount curve spiking. You're reifying the feeling into a metaphysical truth. You say "failure of agency," I say "updating weights." Look, if you accept that preferences are time-dependent, the puzzle dissolves. There is no irrationality. There is only Time-Slice A fighting Time-Slice B. By calling it "weakness," you're just saying Time-Slice A (Long Term) is morally superior to Time-Slice B (Short Term). But that's an aesthetic choice, not a logical one.

  **Elias:** It's not aesthetic, it's structural. Rationality requires consistency. If I say "X is best" and then do "Y," I am violating the law of non-contradiction in my actions. Hyperbolic discounting explains *why* the values shift, but it doesn't excuse the contradiction. It just maps the inconsistency. It doesn't make it consistent.

  **Mara:** Consistency across *what*? Across time? Why should I be consistent with a self that doesn't exist anymore? 11 PM-Elias is dead. He's gone. I'm 1 AM-Elias. I'm alive. Why should I sacrifice my real, present utility for a ghost's plan?

  **Elias:** Because you become the ghost. You're going to be 8 AM-Elias. And 8 AM-Elias is going to be miserable. If you treat your future self as a stranger, you create a life of internal warfare. If you treat your future self as *you*, then acting against his interests is self-sabotage. That's what weakness of will is. It's self-sabotage acknowledged in real-time.

  **Mara:** But "self-sabotage" assumes the future self's interests are the correct ones. What if 1 AM-Elias needs the decompression? What if the doomscrolling is the only time you feel calm? Maybe 11 PM-Elias is the irrational one for being too rigid.

  **Elias:** (Laughs softly) Nice try. But I'm not calm at 1 AM. I'm anxious. I'm tired. My eyes burn. I'm not choosing this because it's good; I'm choosing it because I can't stop. That lack of "stop-ability"—that's the will part. If it were just discounting, I could stop if the price was high enough. But I can't. I trade tomorrow's health for tonight's pixels knowing the exchange rate is terrible. That's not rational calculation. That's compulsion.

  **Mara:** Compulsion is just an extreme discount rate.

  **Elias:** No. Compulsion is when the calculation drops out entirely. That's my point. In true hyperbolic discounting, you're still maximizing utility, you're just weighting "now" heavily. In akrasia, you aren't maximizing anything. You're actively minimizing your own well-being *by your own definition*. You can't model that as rational preference satisfaction because the agent explicitly rejects the preference being satisfied.

  **Mara:** So you think the "Real You" is the one suffering at 8 AM?

  **Elias:** I think the "Real Me" is the one capable of recognizing that 8 AM matters.

  **Mara:** And I think the "Real You" is a story you tell yourself to make the guilt manageable. If it's "weakness," you can fix it with "strength." If it's just time-inconsistency, you have to build systems. You have to acknowledge that 1 AM-Elias is a different creature who needs different incentives, not a moral scolding.

  **Elias:** Maybe. But if I believe you, I lose the ability to hold myself accountable. If 1 AM-Me is just a different guy, why should I listen to him at all?

  **Mara:** Because he's the one with the hands on the phone.

  *(Silence hangs between them. The refrigerator hums.)*

  **Elias:** I should go to bed.

  **Mara:** Rational for 1:20 AM-Elias?

  **Elias:** (Picks up the phone) 1:20 AM-Elias wants to see if the saw works.

  **Mara:** See? No weakness. Just data.

  **Elias:** Or maybe just weakness.

  *(Elias turns off the screen. The kitchen goes dark.)*

  **Elias:** Goodnight, Mara.

  **Mara:** Goodnight, Elias. Try not to hate the guy who wakes up tomorrow. He's doing his best too.
