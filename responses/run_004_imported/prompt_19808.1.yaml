answer: |-
  **In the Name of God, the Merciful, the Compassionate.**

  Thank you all for coming. For those who knew my grandmother only as a mother, a colleague, or a friend, you saw a woman of immense warmth. For those who knew her as a student of knowledge, you saw a woman of immense precision. But for all of us, she was a anchor.

  To speak about her life honestly, I have to speak about how she saw the world. She taught for forty years that nothing in this universe has power on its own. Not the fire, not the wind, and not the illness. She believed that what we call "cause and effect" is really just the habit of God—a consistent, merciful rhythm He maintains so that we can live, learn, and love one another. But she also believed that He is never bound by that rhythm. He is the only Actor. Everything else is merely the occasion for His action.

  She asked me specifically that I not stand here and say that cancer "took" her. Not because she denied the pain, or the reality of the sickness, but because she did not believe a disease had the power to take anything. She did not believe her body "gave out" on its own. To say so would be to give power to something other than the Creator.

  So, I will say what she believed to be the truth: When her time came, God did not need the illness to call her back. He simply called. The illness was only the setting, the moment in which her Lord, who had sustained her breath for eighty years, chose to draw her near.

  Now, I know that for some of you, this sounds like a distinction without a difference. If the outcome is the same, why does the language matter?

  It mattered to her because it changed how she lived. If nothing happens except by God's will, then there is no such thing as a random accident, and there is no such thing as a moment abandoned by Him. It meant that her patience during these last difficult months was not just a biological reaction to pain. It was a choice.

  This is the mystery she lived by. She taught that while God creates the power to act, we are the ones who "acquire" the action. We are the witnesses. So when I say she was generous, I mean that every time God created an opportunity to give, she aligned her will with it. She met every moment of grace with gratitude. She met every moment of trial with *sabr*—with a patience that was her own offering, even if the strength to bear it came from above.

  She did not fight her illness as an enemy agent invading her body. She met it as a final test of her trust. She treated her doctors not as masters of cure, but as instruments of the same Mercy that sent the rain. And she treated her family not as people subject to the laws of biology, but as souls directly held in God's hand.

  For my cousins and friends here who may not share her specific vocabulary: You do not need to understand the theology to understand the love. Her belief did not make her distant; it made her present. Because she believed every moment was directly willed by God, she never treated a moment with you as trivial. When she listened to you, she was fully there. When she fed you, it was an act of devotion. She loved you without the fear that anything could separate you from God's care, even death.

  I studied her philosophy in a seminar room, reading texts by al-Ghazālī. But I learned the truth of it at her kitchen table. I saw that believing God acts directly in every moment doesn't mean we are puppets. It means we are partners in a sacred trust. It means that her kindness was real, because she chose to be kind when she could have been bitter. Her generosity was hers, because she opened her hands when she could have clenched them.

  We are gathered here to grieve, yes. But we are also gathered to witness. We witness that she lived as if God was the only Reality, and she died with that certainty on her lips.

  For those of us who remain, the world continues. The habit of God continues. The sun will rise, and fire will warm, and we will feel the effects of this loss. But if we can take one thing from her life, let it be this: You are never alone in a chain of causes. You are never at the mercy of a cold universe. You are held, directly and immediately, by the One who held her.

  May God cover her in the mercy she showed to us. May He grant her the vision of His face, which she loved above all else. And may He grant us the patience to meet our own moments, whatever they may be, with the same grace she showed us.

  *Inna lillahi wa inna ilayhi raji'un.* We belong to God, and to Him we return.
