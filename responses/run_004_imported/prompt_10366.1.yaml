answer: |-
  This is a profound observation, and your analogy is both structurally sound and philosophically incisive. You have put your finger on a distinction that often gets blurred when scientists wander into philosophy of mind, or when philosophers borrow metaphors from science.

  To answer your central question directly: **Yes, Quine and Davidson do mean something essentially stronger by "indeterminate" than you meant by "ill-posed."**

  The distinction lies in the difference between an **epistemological limitation** (seismology) and an **ontological claim** (Davidson/Quine). Here is how that distinction breaks down, and what it implies for the AI alignment project.

  ### 1. Ill-posedness vs. Indeterminacy

  **In Seismology (Hadamard/Ill-posedness):**
  When you faced non-uniqueness in travel-time tomography, the non-uniqueness was a feature of the *mapping* from data to model, not necessarily a feature of the Earth. You operated under a realist assumption: there *is* a specific distribution of density and elasticity in the mantle. It exists independently of your seismometers. The fact that multiple models fit the data means your *access* to the truth is limited, not that the truth is undefined. Your regularization (smoothing, geological priors) was a heuristic tool to select the most *probable* candidate from a set of candidates, with the hope that the "true" Earth was among them or very close to them.

  **In Radical Interpretation (Quine/Davidson):**
  When Davidson argues that beliefs and desires are indeterminate, he is not saying we lack enough behavioral data to pinpoint the *one true* set of beliefs. He is arguing that **there is no "one true set" to pinpoint.**

  For Davidson, mental content is not an inner, hidden cause of behavior (like the Earth's interior is the cause of travel times). Instead, mental content is *constituted* by the interpretation itself. The "Principle of Charity" is not a regularization parameter you add to help find the signal; it is a constitutive condition of there being a signal at all. You cannot peel away the interpretation to find the "raw" belief underneath, because the belief only exists *as* the target of a charitable interpretation.

  So, to use your metaphor: In seismology, the Earth is the original poem, and your models are translations. Some translations are better than others, but there is an original. In Davidson's view, there is no original poem. There is only the act of translating, and the "meaning" emerges from the coherence of the translation, not its correspondence to a pre-existing text.

  ### 2. The Implications for Inverse Reinforcement Learning (IRL)

  Your suspicion regarding AI alignment is well-founded. If the Davidsonian view holds, the standard formulation of IRL is indeed chasing a phantom.

  Most IRL literature assumes a "Realist" stance similar to your seismology:
  1.  There exists a true reward function $R_{true}$ (the Earth's interior).
  2.  The human acts to maximize $R_{true}$ (with some noise/irrationality).
  3.  Our job is to invert the behavior to find $R_{true}$.

  If preferences are Quinean/Davidsonian, then:
  1.  There is no $R_{true}$ independent of an interpretive framework.
  2.  Human behavior is compatible with infinite $(Reward, Rationality)$ pairs.
  3.  Choosing one pair is not "discovering" the preference; it is **assigning** the preference.

  This shifts the AI alignment problem from a **discovery problem** (tomography) to a **construction problem** (legislation or poetry).

  If preferences are not there to be discovered, then an AI that "learns human preferences" is not uncovering a latent truth; it is effectively *completing* the human's mental state. This is terrifyingly potent. It means the AI doesn't just serve your preferences; to the extent that your preferences were indeterminate, the AI *decides* what they were.

  ### 3. Why Your Colleague Was Unconvinced

  Your ML colleague's hesitation likely stems from the difference between **foundational truth** and **pragmatic utility**.

  In machine learning, we are often methodological realists. We act *as if* there is a ground-truth distribution $P_{data}$ because assuming so allows us to derive loss functions and convergence bounds. Even if the "true" reward function is philosophically dubious, a regularized IRL model might still produce an agent that behaves *as if* it understands us, which is sufficient for safety in many contexts.

  She might argue that even if preferences are indeterminate, they are **stable enough** within a certain context. Just as you could build a safe oil rig using a regularized seismic model (even if it wasn't the *unique* true model), we might build a safe AI using a regularized preference model (even if preferences aren't ontologically unique).

  However, your philosophical point exposes a specific risk she may be underestimating: **Distributional Shift.**

  In seismology, if your regularization is wrong, you might get the depth of a fault line incorrect. If you drill, you might miss oil. In AI, if preferences are indeterminate, and the AI encounters a situation far outside the training distribution (a "novel context"), the regularization (the Principle of Charity / rationality prior) becomes the *sole determinant* of the inferred preference.

  If the AI is essentially writing the poem rather than translating it, then in novel situations, it is writing entirely new stanzas. It isn't extrapolating *your* will; it is substituting *its* prior for *your* will.

  ### 4. A Nuanced View: Constitutive Regularization

  There is a middle ground that might reconcile your seismological intuition with the philosophical reality.

  In modern geophysics, there is a growing recognition that "the model" is not the "Earth." The model is a useful representation. Perhaps we should view human preferences not as fixed atoms, but as **dispositions that crystallize upon interrogation.**

  When a seismologist asks the Earth a question (by sending a wave), the Earth answers. When an AI asks a human a question (by presenting a choice), the human answers. But if the human hasn't thought about it before, the answer is created in the moment of choice.

  In this light, IRL is not failed tomography. It is **collaborative model building.** The AI is not a passive scanner; it is an active participant in defining the preferences. This aligns with some newer work in AI alignment (like "preference elicitation" or "coherent extrapolated volition") which acknowledges that humans don't have pre-packaged preferences for every scenario.

  ### Conclusion

  You are correct: The philosophical claim is stronger.
  *   **Seismology:** The solution is non-unique, but the truth exists. (Epistemic)
  *   **Davidson:** The solution is non-unique, and the truth does not exist. (Ontological)

  If this holds for AI, the enterprise is indeed less like seismic tomography and more like translating a poem that never had an original. But this does not necessarily mean the enterprise is hopeless; it means the goal must shift.

  We cannot aim to **align with human preferences** (as if they were a fixed star). We must aim to **align with the process by which humans determine their preferences.** The AI must not just satisfy the regularized model of our desires; it must respect our agency in *revising* that model. It must leave the "poem" open for us to edit, rather than printing the final draft itself.

  Your colleague sees a engineering problem with a practical solution. You see a metaphysical problem with a conceptual implication. Both are right, but the metaphysical one dictates the boundaries within which the engineering must operate. If we ignore the indeterminacy, we risk building an AI that confidently serves preferences we never held, simply because its regularization parameters demanded they exist.
