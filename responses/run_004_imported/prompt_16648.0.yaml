          *   *ARC's View:* ARC argues that consistency checks generally don't solve ELK because the Human Simulator can pass all consistency checks that a human can verify. The root cause is the "ontology mismatch" and the fact that human labels ground the human simulator, not the direct translator.
          *   *Verdict:* They fail for a *related* but distinct mechanistic reason. Complexity penalty fails on *selection* (can't distinguish). Consistency checks fail on *verification* (Human Simulator passes them). Both stem from the AI's ability to model humans accurately.

