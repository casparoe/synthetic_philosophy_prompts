      *   **Argument 3 (Julian):** It's not about the outcome, it's about the *cost*. The music shows the damage. A pure farce wouldn't hurt this much.
      *   **Counter 3 (Elena):** That's the genius of Mozart. He writes human music for a cynical libretto. But don't pretend Mozart is refuting Da Ponte. They are collaborators. The tension *is* the opera, not a refutation.
