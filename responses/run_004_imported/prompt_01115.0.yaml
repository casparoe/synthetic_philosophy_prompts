answer: |-
  **Setting:** *The foyer of a mid-sized opera house. It is interval. The noise is a dull roar of clinking glasses and murmuring voices. Two figures stand near a pillar, slightly apart from the crowd.*

  **Characters:**
  *   **JULIAN:** A moral philosopher, late 50s, holding a glass of warm white wine he hasn't touched.
  *   **ELENA:** A music critic, 40s, leaning against the pillar, looking at her program notes.

  **JULIAN:** You look dissatisfied.

  **ELENA:** The tenor is sharp in the upper register. And the conductor is taking the *Andante* in "Come scoglio" far too slowly. It turns a declaration of war into a meditation on mortality.

  **JULIAN:** But isn't that exactly the point?

  **ELENA:** (Looks up) Is it?

  **JULIAN:** Bernard Williams would say yes. Did you ever read his essay on *Cosi*? "Passion and Cynicism"?

  **ELENA:** I know the one. In *On Opera*. He argues that Mozart's music is too honest for Da Ponte's libretto. That the score refuses to let the farce be a farce.

  **JULIAN:** Precisely. Think about Fiordiligi. In the text, she's a puppet in Alfonso's experiment. She's supposed to prove the thesis: *Così fan tutte*. All women are the same; fidelity is a myth. But listen to "Per pietà." That isn't the music of a puppet realizing she's weak. It's the music of a specific human being being destroyed by a generalization.

  **ELENA:** (Takes a sip of champagne) Julian, with respect, you're doing what philosophers always do. You're treating the opera as a proposition. You want the music to *argue* against the libretto. But Mozart isn't a moralist. He's a musician. He writes beauty because that's what he does. He writes a heartbreaking aria for Fiordiligi because she's the soprano and it's the climax of her act, not because he's trying to refute Don Alfonso's ethical nihilism.

  **JULIAN:** It's not about refuting him in the text. It's about undercutting him in the experience. Alfonso is the ethical theorist, isn't he? He stands back, he observes, he formulates a rule: "Human nature is constant and base." He treats the lovers as data points. But the music forces us into the particular. Williams was always suspicious of theory that flattens the texture of life. When Fiordiligi sings, the "theory" of Alfonso collapses because the *cost* of the action is made audible. You can't hear that music and think, "Ah, yes, just another data point confirming the interchangeability of women."

  **ELENA:** But they *are* interchangeable in the plot! That's the joke. They switch partners. They don't notice. The music makes us *feel* for them, sure. That's dramatic empathy. But don't confuse empathy with moral vindication. Mozart gives gorgeous music to Don Alfonso too. "La mano a me date." It's cynical, witty, sparkling. He doesn't musicalize Alfonso as a villain. He musicalizes him as a puppet master. If Mozart wanted to undercut Alfonso, he would have made him sound grotesque. He didn't. He made him sound charming.

  **JULIAN:** Because cynicism is always charming. That's the danger of it. But look at the men. Guglielmo and Ferrando. They put on disguises and pretend to be Albanians. The libretto treats this as a lark. But listen to the orchestration when they think they've succeeded. There's a hollowness there. The music suggests that even if the women are "guilty," the men have lost something irrecoverable by testing them. Williams's point is that the music reveals the moral luck of the situation. The women didn't choose to be tested; the men chose to test. The music sides with the tested, not the testers.

  **ELENA:** You're hearing a moral narrative that isn't in the score. You're hearing *The Marriage of Figaro*. In *Figaro*, the Count is the oppressor and the music supports the countesses. In *Cosi*, everyone is complicit. The music is uniform in its quality. Dorabella's "È amore un ladroncello" is light, flirtatious, slightly amoral. Fiordiligi's is heavy, tragic. That's character differentiation, Julian, not philosophical rebuttal. Mozart is showing us a spectrum of human reaction to the same stimulus. He's not saying Fiordiligi is "right" and Dorabella is "wrong." He's saying they are different.

  **JULIAN:** But by giving Fiordiligi that depth, he makes Alfonso's conclusion—"Thus do *all* women"—impossible to swallow. If Fiordiligi's struggle was merely mechanical, the music would be mechanical. It would be buffa. But it's seria. He smuggles serious opera into a comic structure. That act of smuggling is a philosophical act. It says: "You claim this is a game, but look at the pain." It validates the particular emotion against the cynical generalization.

  **ELENA:** Or, it says: "Even in a game, even in a farce, people feel real pain." That doesn't mean the plot is a lie. It means the world is complicated. You want the opera to end with the women vindicated. But they aren't. They go back to their original partners. Alfonso wins the wager. The curtain falls on the cynical maxim. If the music truly undercut the plot, the ending would be impossible. We'd feel it was a betrayal. Instead, we feel a strange resignation.

  **JULIAN:** Resignation isn't agreement.

  **ELENA:** Isn't it? In this context? The music doesn't offer a solution. It offers a shrug. *Così fan tutte*. You're projecting a Williams-style defense of the "thick" ethical concept of fidelity onto Mozart. You want the art to save us from the nihilism of the text. But maybe Mozart was smart enough to know that the nihilism is part of the truth, too. Sometimes people are fickle. Sometimes love is just biology and boredom. The music makes that pill easier to swallow, not easier to spit out.

  **JULIAN:** That's a very cold reading.

  **ELENA:** It's a musical reading. You're listening for arguments. I'm listening for resolution. And harmonically, the opera resolves. It ends in C major. It's stable.

  **JULIAN:** A forced stability. Like a marriage that survives a betrayal but is never the same. That's Williams's point! The theory says "Fidelity is fiction, so it doesn't matter." The music says "It matters terribly, and the fact that it's fiction doesn't stop the bleeding." The music insists on the reality of the passion, even if the plot dismisses it. That tension *is* the philosophical work. It stops us from being Alfonsos. We leave the theater unable to say "Thus do all" because we've heard *these* two.

  **ELENA:** (Checks her watch) We're romanticizing the friction, Julian. Da Ponte and Mozart were working men. They needed a hit. The tension you love? That's just good dramaturgy. If everyone was cynical, it would be boring. If everyone was sincere, it would be saccharine. They mixed them. You're calling that mix a critique of ethical theory. I'm calling it a Tuesday night at the Burgtheater in 1790.

  **JULIAN:** (Smiles slightly) You think genius is accidental?

  **ELENA:** I think genius is often instinctive, not academic. Mozart didn't read Kant. He certainly didn't read Williams. He read the room. He knew that if he made Fiordiligi suffer too much without beauty, the audience would turn on her. If he made her too light, they'd turn on the opera. He balanced it. You're calling that balance a "suspicion of ethical theorizing." I'm calling it craft.

  **JULIAN:** But why does the craft lean that way? Why does the music *pull* toward sincerity? Why doesn't it stay light? Why does "Per pietà" break our hearts when the libretto only asks for a change of mind? There is a directionality to the beauty. It flows toward the human, away from the abstract. That's not just craft. That's a worldview.

  **ELENA:** It's a worldview that says human beings are interesting. Not that ethical theory is wrong. Just that people are messy. Alfonso is right about the mess, Julian. He just enjoys it too much. Mozart lets us enjoy it too, but he makes us cry while we laugh. That's not philosophy. That's opera.

  **JULIAN:** (Raises his glass) "That's not philosophy. That's opera." You know, Williams might have liked that. He thought philosophy usually got in the way of seeing things clearly.

  **ELENA:** (Clinks her glass against his) Then perhaps you should stop philosophizing and let the second act happen. Fiordiligi has more suffering to do, regardless of whether it means anything.

  **JULIAN:** Indeed. Though I suspect the oboe will have the last word on who was right.

  **ELENA:** The oboe doesn't care who's right. It just has to play in tune. Come on.

  *(The bell rings. They turn and merge back into the crowd flowing toward the auditorium.)*
