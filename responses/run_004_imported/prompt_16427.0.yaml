          *   Implication: Cooperation is rational *if* the shadow of the future exists. It does *not* solve the *one-shot* PD.

      *   **Hofstadter's Superrationality:**
          *   Assumption: Players are "identical reasoners." If I choose X, you *must* choose X because we run the same logic.
          *   Logic: My choice is correlated with yours (not causally, but logically). If I cooperate, you cooperate. If I defect, you defect. Therefore, I compare (C,C) vs (D,D). (C,C) is better.
          *   Implication: Challenges the independence assumption of Nash Equilibrium.
          *   Status: Not standard game theory. Considered a philosophical extension or a different solution concept (like Evidential Decision Theory vs. Causal Decision Theory).

  3.  **Identify the User's Misconception:**
