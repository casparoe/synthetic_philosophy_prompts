      *   **Distinguish Axelrod (Iterated) vs. Textbook (One-shot):** This is the biggest factual correction. Axelrod didn't solve the one-shot dilemma; he showed how cooperation evolves in repeated interactions. Textbooks teach the one-shot Nash Equilibrium because it's the baseline.
      *   **Distinguish Superrationality (Logical) vs. Nash (Causal):** Explain *why* economists reject superrationality. It violates the "independence of strategies" axiom. It sounds like magic thinking ("my choice causes yours") even if Hofstadter frames it as logical correlation.
      *   **Explain the "Why":** Why stick with Nash? Because it's robust. It doesn't require assuming your opponent thinks exactly like you. It works even if the other person is an alien or a random algorithm.
      *   **Address the "Stubbornness":** It's not just attachment to tidy solutions. It's about predictive power and minimal assumptions. Superrationality requires strong, often unrealistic assumptions about common knowledge of rationality.

