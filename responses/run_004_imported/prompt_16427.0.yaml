          *   Logic: Regardless of what you do, I am better off defecting. Therefore, I defect. You reason the same. Result: Mutual Defection.
          *   Context: One-shot, anonymous PD.

      *   **Axelrod's Tournaments:**
          *   Context: *Iterated* Prisoner's Dilemma (IPD). The game is played repeatedly.
          *   Mechanism: Future retaliation/reward affects current payoff.
