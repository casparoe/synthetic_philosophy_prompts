prompt: |-
  ok this might be oddly specific but I could use an outside take. I'm finishing my econ PhD and I'm stuck choosing between a postdoc in Zurich that's exactly the research fit I've wanted for years, and a teaching job back home near my mom, who's been on her own and isn't in the best health since my dad passed a couple years ago. I tried to be a good decision scientist about it and actually built a weighted matrix (career growth, money, family time, etc) but depending on how I set the weights I get a different "winner" every time -- its not that I'm missing information about either option, they just don't seem to sit on the same scale at all. My advisor keeps telling me I'm overthinking it and should just go with my gut, but that kind of dodges the real question: is there secretly a correct answer here that I'd find if I thought about it clearly enough, or can two options just genuinely be incomparable -- and if that's true, isn't picking either one just arbitrary?
reasoning: |-
