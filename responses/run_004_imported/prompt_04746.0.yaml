answer: |-
  This is a fantastic question. It cuts right to the bone of the tension between neoclassical finance (which Milgrom-Stokey represents) and the Cambridge tradition of uncertainty.

  If you handed Keynes the Milgrom-Stokey (M-S) no-trade theorem, he wouldn't dismiss it as "wrong" in a mathematical sense. He would dismiss it as a **category error**. He would argue that the theorem assumes a world of *risk* (where probabilities are calculable and priors can be shared), whereas financial markets operate in a world of *uncertainty* (where probabilities are unknowable).

  Here is how Keynes would reconstruct the argument, drawing specifically from Chapter 12 of *The General Theory* and his correspondence regarding his own investment management at the Chestfund.

  ### 1. The Attack on "Common Priors" (Risk vs. Uncertainty)
  The M-S theorem hinges on the assumption of a **common prior**. It assumes that if you and I are rational, we start with the same probability distribution of the world, and we only trade because we have received different private signals.

  Keynes would stop you right there. In his 1937 *Quarterly Journal of Economics* article ("The General Theory of Employment"), he explicitly distinguishes between *risk* (like roulette, where the odds are known) and *uncertainty* (like the prospect of a European war or the price of copper twenty years hence, where "there is no scientific basis on which to form any calculable probability whatever").

  For Keynes, a Fed meeting or an election is not a Bayesian puzzle with a hidden state variable waiting to be uncovered. It is a unique historical event. There is no "true" prior distribution of the Fed's decision. There is only a **convention**.

  He would argue that traders in your Polymarket Fed contracts do not share a common prior. They share a common *anxiety*. They are grasping at straws. When M-S says "update your belief based on the fact that someone took the other side," Keynes would reply: "Update based on what? The other trader isn't acting on a signal; they are acting on a whim, a liquidity need, or a guess about what *third* trader will do."

  Because there is no objective probability distribution to converge upon, the "unraveling" logic of M-S never triggers. We aren't converging on a truth; we are chasing a moving target.

  ### 2. The Objective of Trade (Enterprise vs. Speculation)
  The second point of divergence is the *purpose* of the bet. M-S assumes the goal of trading is to exchange information about the **fundamental value** of the asset (in your case, the binary outcome of the Fed meeting).

  Keynes draws a sharp line between **Enterprise** (forecasting the prospective yield of an asset) and **Speculation** (forecasting the psychology of the market).

  He would argue that in liquid markets (and prediction markets are hyper-liquid), the incentive structure rewards Speculation, not Enterprise.
  *   **The M-S View:** I buy because I think the probability of a rate hike is 60%, and the market implies 50%.
  *   **The Keynes View:** I buy because I think the market *currently* implies 50%, but I believe the market will *believe* it is 60% tomorrow, regardless of the actual fundamentals.

  Keynes would say the M-S theorem assumes everyone is trying to be an *Enterprise* investor. But if everyone is actually a *Speculator*, the theorem breaks. I am not betting against your private information about the Fed; I am betting against your inability to predict how the crowd will react to the Fed.

  In *The General Theory*, he writes: *"It is not a case of choosing those [faces] which, to the best of one's judgment, are really the prettiest, nor even those which average opinion genuinely thinks the prettiest. We have reached the third degree where we devote our intelligences to anticipating what average opinion expects the average opinion to be."*

  If I am playing the third degree, and you are playing the first degree (fundamentals), we will trade. And M-S cannot explain why, because it assumes we are both playing the first degree.

  ### 3. "Rationality" and Career Risk
  The M-S theorem assumes a specific definition of rationality: Bayesian updating to maximize expected utility. Keynes had a more sociological definition of rationality, particularly for professional investors (which includes you and me in these markets).

  Keynes observed that for a professional manager, **it is safer to fail conventionally than to succeed unconventionally.**

  If you take a position based on your private info, and you lose, you look like an idiot. If you take a position because "the market" was taking it, and you lose, you look like a victim of circumstances. Therefore, the "rational" behavior for a trader is to herd.

  M-S says: "If someone takes the other side, they must know something you don't, so don't trade."
  Keynes says: "If someone takes the other side, they might just be noise. But if *everyone* starts taking the other side, you must follow them immediately, even if your private info says they are wrong, because the price will move before the truth comes out."

  This breaks the "common knowledge of rationality" assumption in M-S. In Keynes's world, it is rational to ignore your private signal if the market momentum contradicts it, because liquidity allows you to exit before the reckoning. M-S assumes you hold until truth; Keynes assumes you hold until the music stops.

  ### 4. Why Volume Exists (Liquidity as a Drug)
  Finally, M-S asks: "If we are rational, why trade?"
  Keynes asks: "Why do we *think* we can trade?"

  Keynes would argue that the existence of organized markets (like Polymarket or the LSE) creates an illusion of solvability. The **liquidity** of the market convinces traders that they can get in and out at will. This encourages the very speculation that M-S says shouldn't happen.

  In Chapter 12, he notes that the development of organized investment markets often *increases* instability. Because you can sell your position instantly, you don't bother doing the hard work of fundamental analysis (which would lead to the M-S no-trade equilibrium). Instead, you focus on short-term sentiment.

  The volume exists *because* the market allows you to pretend you are an informed trader without actually having to commit to the long-term truth. The "noise" isn't a bug in the system that violates M-S; the noise is the *feature* that keeps the casino open.

  ### How He Would View Your Polymarket Positions
  If Keynes were looking over your shoulder at your Fed meeting contracts, he wouldn't tell you to calculate your Bayesian posterior. He would ask you:

  1.  **Are you betting on the Fed, or on the Polymarket crowd?** If you are betting on the Fed's actual decision based on economic data, you are engaging in *Enterprise*. You are vulnerable to the M-S theorem (someone else might have better data).
  2.  **Are you betting on the shift in consensus?** If you are betting that the odds will shift from 40% to 60% *before* the meeting, you are engaging in *Speculation*. Here, M-S is irrelevant. You aren't looking for a common prior; you are looking for a dislocation in the "average opinion."
  3.  **What is your time horizon?** M-S assumes trade resolves at the revelation of truth. Keynes would warn you that in the short run, the "animal spirits" of the market can keep the price wrong longer than you can keep your capital solvent.

  ### The Verdict
  Keynes would not say the theorem is "technically fine but beside the point." He would say the theorem is a **logical tautology that describes a world that does not exist.**

  He would argue that M-S proves that *if* the world were governed by calculable risk and shared rationality, speculation would vanish. The fact that speculation *does not* vanish is proof that the world is governed by uncertainty and psychological convention.

  He wouldn't see the high volume of trade as a puzzle to be solved (as the M-S authors do). He would see it as the inevitable symptom of a system that encourages humans to guess each other's guesses rather than calculate the future.

  **In short:** Milgrom and Stokey think the market is a voting machine counting information. Keynes knows it is a beauty contest counting nerves. You can't apply the logic of the former to the mechanics of the latter.
