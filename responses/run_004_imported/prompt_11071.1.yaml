      *   *Check:* Is the sanction specific? "Probation" is good. Maybe add a specific educational component.
      *   *Constraint:* The prompt says "recommend a specific sanction or sanction range." I'll recommend a range (Probation to Suspension) but lean towards Probation. Actually, specific is better for a recommendation. I'll recommend **Honor Probation with a Restorative Component**.

  6.  **Final Polish:**
      *   Ensure the philosophical references (Kant, Williams) are used correctly but accessibly.
      *   Make sure the "Future Standard" is practical for high schoolers.
      *   Ensure the "Opposing Argument" section feels like a genuine steelman, not a weak counter to be knocked down.

      *(Self-Correction on the "Opposing Argument"):* If I recommend leniency, the opposing argument is the Absolutist one. I need to make sure I don't just say "They are wrong." I need to say "They are right about the risk, but here is why we navigate it differently."

      *(Wait, one more thought):* Is it better to recommend the Standard Sanction? It's often easier to defend institutional integrity. But the prompt highlights Reese's misery and the "hardest case." A memo recommending punishment despite misery might feel cold. A memo recommending leniency requires more philosophical heavy lifting, which fits the prompt's setup about the ethics elective. I will stick with Leniency/Mitigation.

      *Wait, looking at the "Future Standard" requirement.* If I mitigate now, the standard must prevent abuse. The standard should be: "Mitigation is available only when the respondent demonstrates genuine moral distress *prior* to discovery, evidenced by behavior, not just testimony."

      *Okay, let's write.*

      *Structure:*
