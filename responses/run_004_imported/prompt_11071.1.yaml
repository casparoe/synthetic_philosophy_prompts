      2. Case Overview.
      3. The Core Question (Dilemma vs. Error).
      4. Recommendation.
      5. Rationale (Williams/Moral Remainder).
      6. The Counter-Argument (Kant/Institutional Integrity) - *Steelman this.*
      7. Proposed Precedent/Standard.
      8. Closing.

      *Tone Check:* "Junior on Honor Council." Needs to be respectful but confident.

