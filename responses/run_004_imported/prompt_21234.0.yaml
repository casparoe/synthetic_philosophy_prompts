prompt: |-
  I'm a PhD student in formal epistemology and the graduate student representative on my university's academic integrity panel. This term our AI-writing detector flagged 60 of the 1,400 essays submitted for a large lecture course, each assigned a 93% likelihood of being AI-generated by a tool whose own calibration data show it is wrong about 7% of the time at that threshold -- comfortably above the panel's usual "more likely than not" standard, yet implying that four or five of the 60 flagged students are probably innocent, with nothing in any individual file telling us which. Half the panel wants to sanction everyone flagged, since each file clears our standard on its own merits; the other half won't approve sanctions it is confident will wrongly catch several actual students. Draft the decision memo I'll circulate before we vote on this batch: it should recommend sanctioning all, sanctioning none, case-by-case re-review, or some other policy, and the reasoning should seriously engage the strongest argument against whichever option you choose rather than simply restate the per-case probability.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** PhD student in formal epistemology & Graduate Student Representative on the Academic Integrity Panel.
      *   **Task:** Draft a decision memo to circulate before a vote on a batch of flagged essays.
      *   **Scenario:**
          *   1,400 essays submitted.
          *   60 flagged by an AI detector.
          *   Detector assigns 93% likelihood of AI-generation to these 60.
          *   Detector's calibration data shows a 7% false positive rate *at this threshold*.
          *   Panel's standard: "More likely than not" (>50%).
          *   Mathematical implication: $60 \times 0.07 = 4.2$ (approx. 4-5 innocent students among the 60).
          *   Conflict: Half the panel wants to sanction all (individual probability > 50%); half won't sanction knowing innocents will be caught (group harm/base rate fallacy concerns).
      *   **Requirements:**
          *   Recommend a specific course of action (Sanction All, Sanction None, Case-by-Case, or Other).
          *   Reasoning must engage seriously with the *strongest argument against* the chosen option (not just restate per-case probability).
          *   Tone: Professional, rigorous (fitting a formal epistemology PhD), persuasive, and ethically sound.

  2.  **Evaluate the Options:**

      *   **Option A: Sanction All.**
          *   *Pros:* Consistent with the "more likely than not" standard applied individually. Deters cheating. Efficient.
          *   *Cons:* Guarantees punishing 4-5 innocent students. Violates principles of due process and specific evidence. High ethical cost.
          *   *Epistemological Issue:* Confuses $P(AI | Flag)$ with sufficient evidence for *action*, ignoring the disutility of false positives in a justice context.

      *   **Option B: Sanction None.**
          *   *Pros:* Protects the innocent. Avoids systemic injustice.
          *   *Cons:* Undermines academic integrity. Allows ~55 cheaters to go unpunished. Signals that AI detection is useless.
          *   *Epistemological Issue:* Ignores the high posterior probability of guilt for the majority of the flagged group.

      *   **Option C: Case-by-Case Re-review (Human Evaluation).**
          *   *Pros:* Attempts to reduce false positives. Contextualizes evidence.
          *   *Cons:* Time-consuming. Human judgment is also fallible (maybe biased against non-native speakers, etc.). Might not actually distinguish the 5 innocent from the 55 guilty if the writing style is homogenized.
          *   *Epistemological Issue:* Adds a layer of noisy evidence. Does it actually improve the posterior probability enough to cross a "beyond reasonable doubt" or "clear and convincing" threshold?

      *   **Option D: Other (Procedural/Probabilistic Approach).**
          *   *Idea:* Acknowledge the statistical reality. Use the flag as *probable cause* for investigation, not *proof* for sanction. Require corroborating evidence (oral defense, draft history, in-class writing comparison).
          *   *Recommendation:* This is the most robust approach for an integrity panel, especially one with a formal epistemologist involved. It bridges the gap between statistical likelihood and individual justice.

  3.  **Determine the Best Recommendation:**
      *   As a formal epistemologist, I should recognize that a 93% probability is high, but in *adjudicative* contexts, we usually require more than just a statistical prior, especially when the cost of error (expulsion, permanent record) is high.
      *   Sanctioning all is ethically untenable because we *know* (statistically) that innocents are in the batch.
      *   Sanctioning none is academically negligent.
      *   *Decision:* Recommend **Case-by-Case Review with Corroborating Evidence Requirements** (essentially, treat the flag as a trigger for investigation, not a verdict).
      *   *Why?* It respects the individual rights of the ~5 innocent while maintaining integrity for the ~55 guilty. It shifts the burden from "statistical guilt" to "evidentiary confirmation."

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the recommendation clearly.
      *   **Context:** Briefly recap the numbers (60 flagged, 93% confidence, 7% FPR).
      *   **Analysis of the Dilemma:** Acknowledge the split in the panel.
      *   **The Recommendation:** Detailed procedure (Investigation, not immediate sanction).
      *   **Engaging the Counter-Argument:** This is crucial. If I recommend *against* sanctioning all based on the 93%, the counter-argument is "But 93% > 50% standard!" I need to explain why the standard applies to *evidence*, not just algorithmic output, and why the cost of false positives changes the decision threshold.
      *   **Conclusion:** Call to action.

  5.  **Refining the Argument (Formal Epistemology Angle):**
      *   Use terms like "Base Rate," "Posterior Probability," "Expected Utility," "Due Process."
      *   Address the "Reference Class Problem." The 7% error rate is over a population; does it apply to *this* specific student?
      *   The strongest argument *against* my recommendation (Case-by-Case) is likely **Resource Allocation/Consistency**. Critics will say: "If we treat these 60 differently than previous cheating cases, we are inconsistent. If we spend weeks reviewing, we are inefficient. If the 93% is good enough for 'more likely than not', why do we need more?"
      *   *Wait, looking at the prompt again:* The prompt asks to engage the strongest argument against *whichever option I choose*.
      *   If I choose **Sanction None** (too soft).
      *   If I choose **Sanction All** (too harsh).
      *   If I choose **Case-by-Case/Investigation**: The strongest argument against this is **The "Statistical Sufficiency" Argument**. i.e., "We have already met our own standard. Demanding more evidence imposes a higher standard on AI cheating than on other forms of cheating, creating inequity, and ignores that 93% is epistemically strong."
      *   *Actually, a better path:* The prompt implies the panel is deadlocked. As the Grad Rep and Epistemologist, I need to break the tie. The most ethically defensible position that an epistemologist would take is to reject *purely statistical* adjudication for high-stakes sanctions.
      *   *Recommendation:* **Do not sanction based solely on the detector score.** Require corroborating evidence (oral defense, drafts).
      *   *Strongest Counter-Argument:* **The Consistency/Standard Argument.** "Our standard is 'more likely than not' (50%+). The tool gives 93%. To demand more is to arbitrarily raise the standard for AI cases, letting guilty students off because we feel bad about the group statistics, violating the individual merit principle."
      *   *Rebuttal:* The "more likely than not" standard applies to the *totality of evidence*, not a single data point. The detector score is *one piece* of evidence. Relying solely on it ignores the known error distribution.

      *   *Alternative Recommendation:* **Sanction None (for now) / Return for Human Review.**
      *   Let's go with **Procedural Safeguard (Investigation required)**. This is effectively "Sanction None *until* further evidence."
      *   Actually, the prompt asks to recommend: Sanction All, Sanction None, Case-by-Case, or Other.
      *   "Case-by-Case Re-review" is the most practical "Other."
      *   Let's refine the recommendation: **Reject the batch for immediate sanction; mandate individualized evidentiary review.**

  6.  **Drafting the Content - Key Points to Hit:**
      *   **The Math:** $0.07 \times 60 \approx 4.2$ innocents. We know this with high confidence.
      *   **The Epistemology:** Distinguish between *belief* (93% is high) and *action* (sanctioning has high cost). Decision theory requires weighing costs of False Positives vs. False Negatives.
      *   **The Counter-Argument:** The "Individual Merit" argument. Each file *individually* meets the 50% threshold. Why does the group size matter?
      *   **The Rebuttal:** Because we know the *process* generates errors. If we know a machine gun jams 7% of the time, we don't fire it into a crowd of 60 even if each target is "likely" hostile. We verify.
      *   **Tone:** Collegial but firm. Academic.

  7.  **Review against Constraints:**
      *   *Role:* PhD student/Grad Rep. (Needs to sound authoritative but collaborative).
      *   *Constraint:* "Seriously engage the strongest argument against whichever option you choose."
      *   *Constraint:* "Rather than simply restate the per-case probability." (Don't just say "93% isn't 100%").
      *   *Constraint:* "Draft the decision memo."

  8.  **Final Polish:**
      *   Ensure the distinction between *statistical probability* and *evidentiary standard* is clear.
      *   Make sure the recommendation is actionable.
      *   Check the tone: Not condescending to the other panel members, but rigorous.

      *(Self-Correction during drafting)*: I initially thought about recommending "Sanction None." But that undermines integrity. "Case-by-Case" is better. But "Case-by-Case" implies looking at the files again. If the files are text, humans are bad at detecting AI. The recommendation should be "Require Corroborating Evidence" (Oral defense, draft history). I will frame this as "Case-by-Case Adjudication with Corroboration."

      *Strongest Argument against my choice:* "You are violating the principle of individual assessment by letting group statistics veto individual probability."
      *My Rebuttal:* "I am upholding individual assessment by acknowledging that a known fallible instrument cannot be the *sole* arbiter of individual guilt when the cost of error is severe."

      Let's write it.

      *Subject:* Decision Recommendation: AI-Detection Flags in [Course Name/Code]
      *To:* Academic Integrity Panel
      *From:* [My Name], Graduate Student Representative
      *Date:* [Current Date]

      *Opening:* Acknowledge the difficulty.
      *Data:* 60 flagged, 93% confidence, 7% FPR.
      *Recommendation:* Do not sanction based on detector alone. Initiate individualized review requiring corroborating evidence.
      *Argument:* Decision-theoretic approach (Cost of FP > Cost of FN).
      *Counter-Argument:* The "Individual Probability" objection (Each is >50%, so each is guilty by our standard).
      *Rebuttal:* The standard applies to the *case*, not the *tool output*. The tool output is evidence, not verdict.
      *Closing:* Vote request.

      *Wait, one nuance:* The prompt says "Half the panel wants to sanction everyone... since each file clears our standard on its own merits." This is the crux. They believe the 93% *is* the merit. I need to argue that the 93% is a *prior* or a *single piece of evidence*, not the totality.
      Actually, the 93% is the *posterior* given the text features. But the 7% error rate is the *false positive rate*.
      If the FPR is 7%, that means P(Flag | Human) = 0.07.
      The tool says P(AI | Flag) = 0.93.
      The panel's standard is P(Guilt) > 0.5.
      Technically, 0.93 > 0.5. So the "Sanction All" group is mathematically consistent with the *stated* standard.
      My job is to argue why the *stated standard* is insufficient for *this type of evidence* when aggregated, or why we need to interpret "more likely than not" as requiring *robust* evidence, not just *statistical* likelihood.
      Actually, the strongest epistemological move is to distinguish between *statistical evidence* and *individualized evidence*. (The "Gatecrasher Paradox" in legal epistemology).
      *Reference:* The Gatecrasher Paradox (Cohen, 1977). 1000 people at a rodeo, 499 paid, 501 gatecrashed. You pick one at random. P(Gatecrasher) = 0.501. Do you sanction them? No. Why? Because statistical evidence alone lacks "normic support" or causal connection to the specific act.
      This is PERFECT for a Formal Epistemology PhD. I will use the Gatecrasher Paradox logic.

      *Plan:*
      1. Recommend: **No sanctions based solely on detector scores; require individualized corroborating evidence.**
      2. Strongest Counter-Argument: **The Probabilistic Consistency Argument.** (We accept probabilistic evidence in other cases; 93% is well above 50%; rejecting this is inconsistent).
      3. Rebuttal: **The Normic Support/Individualization Argument.** (Statistical likelihood without causal tie-in violates due process, akin to the Gatecrasher Paradox).

      Let's draft.

      *Wait, check the prompt again:* "implies that four or five of the 60 flagged students are probably innocent, with nothing in any individual file telling us which."
      This confirms the Gatecrasher scenario. We know 5 are innocent, but we don't know *who*.
      If we sanction all, we knowingly sanction innocents.
      If we sanction none, we let cheaters go.
      Recommendation: Investigate individually to find the differentiating evidence.

      *Final check on the "Strongest Argument Against":*
      If I recommend *against* sanctioning all (i.e., recommend review), the strongest argument against me is: "You are ignoring the fact that for *any given student*, the probability of guilt is 93%. To say we need more is to say 93% isn't enough, which contradicts our 50% standard."
      My rebuttal must be: "The 93% is a property of the *class of flags*, not a guarantee of the *individual's* action. We cannot conflate the reliability of the classifier with the certainty of the verdict when the cost of error is asymmetric."

      Okay, ready to write.

      *Structure:*
      1. Header.
      2. Summary of Situation.
      3. Recommendation (Corroborative Review).
      4. Rationale (Epistemological & Ethical).
      5. Engagement with Counter-Argument (The "Individual Probability" Objection).
