      *Tone:* Professional, academic, decisive.

      *Wait, one more thing:* The prompt asks to "recommend sanctioning all, sanctioning none, case-by-case re-review, or some other policy."
      I will recommend **Case-by-Case Adjudication Requiring Corroborating Evidence**. This is distinct from just "re-reviewing the text." It means asking the student for drafts, etc.

