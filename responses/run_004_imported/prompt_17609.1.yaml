  **S Tier:** These are the only approaches that directly address the core ontological mismatch or bypass the incentive problem entirely, though both require significant breakthroughs (in formalizing simplicity or scalable interpretability) that we don't currently possess.

  **A Tier:** These strategies impose robust structural constraints or improve the training target enough to survive many counterexamples, but they still face theoretical vulnerabilities where a sophisticated simulator could mimic the desired behavior without accessing latent knowledge.

  **B Tier:** These are useful heuristic tools or specific implementations that may narrow the search space and improve robustness, but they don't fundamentally prevent a model from simulating human beliefs rather than translating reality.

  **C Tier:** The report explicitly demonstrates that a "human simulator" can easily satisfy consistency and temporal stability constraints without actually knowing the truth, making these insufficient for worst-case guarantees.

  **D Tier:** This is the baseline failure mode the report was written to address; relying on human verification cannot solve cases where the AI knows something the human is fundamentally incapable of verifying (e.g., hidden tampering).
