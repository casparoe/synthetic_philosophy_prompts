answer: |-
  The fire had burned down to embers, casting long, shaky shadows across the scattered papers. Hobbes stood over the table, his finger tracing a diagram in the air, while Wallis sat, quill paused, watching the old lion pace.

  "You treat a line as a heap of sand, Mr. Wallis," Hobbes said, his voice thin but sharp. "You say a surface is composed of lines, as a book is of pages. But a line is not made of points. A point has no magnitude. Add nothing to nothing, however many times you please, and you shall never arrive at something."

  Wallis dipped his quill, blotting the excess ink carefully. "I do not claim they are physical heaps, Mr. Hobbes. I claim they are proportions. When I speak of indivisibles, I speak of ratios between magnitudes. If the ratio of the sums holds, the geometry holds. Why must we demand the brick when the arch stands?"

  "Because an arch built on air will fall when the wind of controversy blows," Hobbes countered, turning to face him. "Geometry is certain only because we construct it. I know the circle is true because I know the motion that generated it. A line is the trace of a moving point. A surface is the trace of a moving line. We know the cause, therefore we know the effect. Your indivisibles... they are static. They have no cause. They are ghosts."

  Wallis leaned forward, resting his elbows on the table. "And if I tell you that your motion is the ghost? You bind geometry to physics. You say a line *is* motion. But what if the body is impeded? What if the motion stops? Does the line cease to exist? By your account, geometric truth depends on the capacity of bodies to move. That makes geometry contingent. Physical. Fallible."

  Hobbes stiffened. "It makes it human. We make the figures, so we know them. God knows the world because He made it. We know geometry because we draw it."

  "But I do not draw my calculations," Wallis pressed, sensing a wound. "I calculate with symbols. I treat magnitudes as numbers. If your geometry requires a moving body, you cannot calculate the infinite. You cannot square the curve. You limit truth to what a hand can trace."

  "I limit truth to what the mind can comprehend as made," Hobbes snapped. "You play with symbols like alchemists. You arrive at the right answer, perhaps, but you do not know *why*. You have the conclusion without the syllogism. If you cannot say how the quantity was generated, you do not know the quantity. You know only a shadow."

  Wallis sighed, setting the quill down. "Then let me confess the shadow. You want honesty? The indivisible is a fiction. I cannot prove that a surface is truly made of lines. I cannot justify the infinite sum to your satisfaction. I use it because it yields results that match the world. I trade your certainty for utility."

  He looked up, meeting Hobbes's eyes. "But you, sir. You claim your method grants certainty. You claim civil philosophy can be as exact as geometry because it rests on these same causal definitions. Yet here we are. Twenty years. Pamphlet after pamphlet. You have squared the circle in your mind, but you cannot make the world see it. If your method is so certain, why does it not compel assent? If geometry is the model for peace, why does this geometry bring only war?"

  Hobbes looked down at his diagram. The line he had drawn was thick, imperfect. "Because men are stubborn. They prefer the ease of symbols to the labor of causes."

  "Or," Wallis said softly, "because you demand that nature speak a language it does not know. You want the world to be made of bodies in motion. I am content to let the numbers speak, even if I cannot see the thing they name."

  Hobbes straightened his coat, the movement stiff. "Then your numbers are blind. And a blind guide leads men off cliffs."

  "And your guide," Wallis replied, gathering his papers, "refuses to walk any path but his own. We shall both be dead before the printers stop."

  Hobbes picked up his compass, holding it like a weapon. "Then let them print. Truth does not require a majority."

  "No," Wallis said, moving toward the door. "But geometry does require a shared definition. And we, it seems, do not have one."

  He left the room. Hobbes remained alone with the fire, the compass pressing into his palm, leaving a mark that looked like a point, small and dark, with no magnitude at all.
