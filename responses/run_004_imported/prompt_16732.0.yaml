  2.  **Deconstruct the Philosophical Landscape:**
      *   **The Setup:** Two exits ($X, Y$). Payoffs: Exit 1 (0), Exit 2 (4), Miss Both (1). Indistinguishable intersections.
      *   **Planning Stage (Ex Ante):** Maximize expected utility. Let $p$ be prob of continuing. $EU = (1-p) \cdot 0 + p(1-p) \cdot 4 + p^2 \cdot 1 = 4p - 3p^2$. Max at $p = 2/3$. $EU = 4/3$.
      *   **Action Stage (Ex Interim):** Driver arrives at an intersection. What is the probability they are at $X$ vs. $Y$?
          *   *P&R Argument:* If I plan to play $p$, upon arrival, my belief that I am at $X$ should be $\alpha = \frac{1}{1+p}$. If I deviate to $q$ at this node, the expected payoff changes. P&R argue that optimizing *at the node* given these beliefs yields a different optimal $q$ than the planned $p$, leading to dynamic inconsistency.
          *   *AHP Argument:* You can't treat the arrival as a standard Bayesian update because the event "I am at an intersection" is certain under all strategies. The "belief" $\alpha$ is not a standard probability but a weighting factor. When you model it as a team game (or use "modified" expected utility), the ex-interim optimum matches the ex-ante optimum ($p=2/3$). The inconsistency is an artifact of misapplying Bayesian conditioning to non-informative events.
          *   *The Core Tension:* Is the agent at intersection 1 the "same" agent as at intersection 2? If so, how do we handle the double-counting of probability mass? If not, how do we justify the ex-ante plan binding them?

  3.  **Drafting the Characters:**
