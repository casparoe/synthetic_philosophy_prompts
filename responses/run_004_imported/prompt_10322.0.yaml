      *   Miller and Tichý showed that if Theory $B$ has more truth content than Theory $A$ (and both are false), $B$ *must* also have more falsity content.
      *   *Intuition:* Falsehoods are "contagious" in conjunction. If $A$ is false, and you add a truth $t$ to make $B = A \land t$, $B$ is still false. But does $B$ imply *more* falsehoods than $A$? Yes, because $B$ implies everything $A$ implies, *plus* new combinations involving $t$ and the falsehoods in $A$.
      *   *Wait, that's not quite the Miller-Tichý argument.* The Miller-Tichý argument is more specific. It relies on the fact that if $A$ and $B$ are both false, and $B$ has more truth content, the logical structure forces $B$ to imply specific falsehoods that $A$ doesn't, or vice versa, in a way that balances out perfectly to block the inequality.
