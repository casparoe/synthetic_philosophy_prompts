      *   *Let's stick to the simplest explanation of the collapse:* The "Addition of Truths" problem.
      *   Suppose $A$ is false. Suppose we want to make $B$ better by adding a true statement $t$. So $B = A \land t$.
      *   $B$ is still false (because $A$ is false).
      *   Does $B$ have more truth content? Yes, it implies $t$ (and $A$'s truths).
      *   Does $B$ have more falsity content? Yes. Because $B$ implies $A$'s falsehoods *conjoined with* $t$.
