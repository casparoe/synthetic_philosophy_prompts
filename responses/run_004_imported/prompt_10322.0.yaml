      *   Then $B$ implies $t \land f$? Not necessarily.
      *   *The actual proof logic:* If $B$ has more truth content than $A$, then $B$ implies some truth $t$ not implied by $A$. Since $A$ is false, $A$ implies $\neg T$ (the negation of the truth).
      *   Okay, keeping it fully rigorous might lose the undergrads. Stick to the "Conjunction Problem."
