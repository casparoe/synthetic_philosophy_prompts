  ### The Decision Tree: "The Allais Trap"

  To generate a money pump without static cycles, we need a preference reversal that occurs *over time* as uncertainty resolves. We will use a two-stage tree that embeds the Allais Common Consequence effect.

  **The Payoffs:**
  *   **$S$ (Safe):** $100 for sure.
  *   **$R$ (Risky):** $500 with probability $10/11$, $0 with probability $1/11$.
