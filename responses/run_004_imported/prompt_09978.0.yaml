  **The Agent's Preferences (Allais Violation):**
  1.  **Ex-Ante (Node 0):** The agent prefers a sure $100 over the Mixed lottery *if* they know they will choose $R$ in the sub-game. (Certainty Effect).
      *   $100 \text{ (Sure)} \succ \text{Mixed (with } R \text{)}$
  2.  **Interim (Node 1):** If the agent reaches the sub-game (the 11% branch), the "certainty" of the 89% branch is gone. Now, facing a choice between $100 sure and $R$, they prefer the risk.
      *   $R \succ 100 \text{ (Sure)}$

  **The Setup:**
  Imagine a Bookie offering sequential trades. The agent starts with a ticket for **Option A** ($95 sure).

  *   **Option A:** $95 cash.
  *   **Option B:** A ticket for the **Mixed** lottery described above ($0.89$ chance of $100, $0.11$ chance of reaching Node 1).

  ---

  ### 1. The Naive Agent (Gets Pumped)

  A Naive agent believes their future preferences will match their current preferences. They do not anticipate their own time-inconsistency.

  *   **Step 1 (Node 0):** The Bookie offers to swap **Option A** ($95) for **Option B** (Mixed) for a fee of $1.
      *   *Naive Calculation:* "Ex-ante, I prefer safety. If I take Option B and reach Node 1, I will choose the Safe $100 (because I like safety). Therefore, Option B is effectively a lottery of ($0.89$ chance $100 + $0.11$ chance $100$). That is $100 for sure."
      *   *Decision:* Option B (valued at $100) minus $1 fee = $99 value. Option A is $95. **The Agent Swaps.** (Current Wealth: Option B ticket - $1 fee).
  *   **Step 2 (Nature Moves):** The 89% branch resolves (Agent gets $100, game over) OR the 11% branch resolves (Agent reaches Node 1). Let's assume the 11% branch hits.
  *   **Step 3 (Node 1):** The Agent now holds a choice between **Safe** ($100) and **Risky** ($R$). The Bookie offers to let them choose **Risky** for a fee of $1.
      *   *Local Calculation:* "I am here now. The 89% safety is gone. I prefer $R$ over $100 sure."
      *   *Decision:* **The Agent Swaps** to Risky. (Current Wealth: Risky Ticket - $2 total fees).
  *   **Step 4 (Resolution):** The Risky ticket resolves.
      *   *Outcome:* The agent ends up with either $500 or $0, minus $2 fees.
      *   *The Pump:* Ex-ante, the agent admitted they preferred $95 sure over the Risky outcome (since they preferred $100 sure over Mixed-Risky). By swapping A → B → R, they have paid $2 to end up with a lottery they originally deemed inferior to $95. If this sequence is repeated, they bleed money.

  ### 2. The Sophisticated Agent (Avoids Pump, Suffers Regret)

  A Sophisticated agent uses backward induction. They know their future self will violate their current plans.

  *   **Step 1 (Node 0):** The Agent simulates the future.
      *   "If I take Option B and reach Node 1, my future self will choose **Risky** (because $R \succ 100$ locally)."
      *   "Therefore, taking Option B is equivalent to holding the **Mixed-Risky** lottery."
      *   "Ex-ante, I prefer $95 Sure over Mixed-Risky (due to Certainty Effect)."
  *   **Step 2 (Decision):** The Agent **rejects the swap**. They keep Option A ($95).
  *   **Outcome:** No money is pumped. However, the agent is forced to choose a dominated option *from the perspective of their ex-ante preferences regarding the tree structure*. They would have *preferred* to have the Option B ticket *if* they could force their future self to pick Safe. But they can't. They suffer "dynamic regret."

  ### 3. The Resolute Agent (Avoids Pump, Maximizes Ex-Ante Utility)

  A Resolute agent (McClennen's proposal) makes a plan at Node 0 and treats it as binding, regardless of local preference reversals later.

  *   **Step 1 (Node 0):** The Agent evaluates the tree.
      *   "I prefer Option B *provided* I choose Safe at Node 1. This combination yields higher ex-ante utility than Option A."
      *   **Plan Formed:** Take Option B; if Node 1 is reached, choose Safe.
  *   **Step 2 (Node 1):** The Agent reaches the node. Local preferences scream "Choose Risky!"
      *   *Resolute Action:* "I am bound by my ex-ante plan. I choose Safe."
  *   **Outcome:** The agent holds Option B, pays the $1 fee, chooses Safe at Node 1, and nets ~$99 (expected). They beat the Sophisticate (who settled for $95) and avoid the Naive's exploitation.

  ---

  ### Philosophical Analysis: Is Resolute Choice Principled?

  This is the crux of your piece. Does Resolute Choice solve the problem, or does it dissolve it by fiat?

  **1. The Argument for Principled Status (McClennen's View)**
  McClennen argues that **Separability** is the culprit, not Dynamic Consistency.
  *   **Separability Axiom:** Preferences at a decision node should depend only on the future consequences reachable from that node (ignoring sunk costs or past plans).
  *   **The Critique:** Separability assumes the agent is a "sequence of selves" rather than a single temporally extended agent. If rationality is about governing one's life as a whole, the ex-ante perspective should have normative authority. Resolute choice asserts that *agency* involves the capacity to bind one's future actions to a coherent plan. It treats the preference reversal at Node 1 not as a new "truth" about value, but as a failure of will (akrasia).

  **2. The Argument for "Defining the Problem Away"**
  Critics (like Rabin or Sugden) argue Resolute Choice is ad hoc:
  *   **Revealed Preference Violation:** At Node 1, the agent *chooses* Safe over Risky, even though they *prefer* Risky over Safe. In standard decision theory, choice reveals preference. Resolute choice demands we ignore the revealed preference at Node 1 in favor of the revealed preference at Node 0. Why is Time 0 privileged over Time 1?
  *   **The "Why Not?" Objection:** If the agent can simply *decide* to ignore their local preferences at Node 1, why couldn't the Naive agent do the same? Resolute choice posits a psychological mechanism (willpower) without explaining its rationality. It essentially says, "Rational agents don't get pumped," and defines rationality as "not getting pumped."
  *   **Dynamic Inconsistency as Information:** Some argue the preference reversal at Node 1 contains new information (the emotional state of "being in the risk zone"). Ignoring it might be irrational.

  **3. The Synthesis for Your Piece**
  Resolute choice is philosophically principled *if* you accept that rationality is a property of **plans**, not just **choices**.
  *   If rationality is *local* (maximize utility at every node), Resolute Choice is irrational (you are choosing an option you currently dislike).
  *   If rationality is *global* (maximize utility over the life of the plan), Resolute Choice is the only consistent solution.

  The "pump" proves that violating Independence (Allais) + Separability leads to exploitation. You have to drop one.
  *   **Expected Utility Theorists** drop Allais (say the preferences are wrong).
  *   **Sophisticates** drop Dynamic Consistency (accept suboptimal plans to avoid inconsistency).
  *   **Resolute Choosers** drop Separability (say local preferences don't override global plans).

  **Conclusion:** Resolute choice isn't a trick; it's a commitment to **temporal neutrality**. It claims that the "Self" at Node 0 and the "Self" at Node 1 are the same entity, and the entity's long-term interests trump its short-term impulses. Whether that is "rational" depends on whether you view rationality as serving the *moment* or the *narrative*.

  ### Summary Table for Your Draft

  | Agent Type | View of Future Self | Node 0 Choice | Node 1 Choice | Outcome |
  | :--- | :--- | :--- | :--- | :--- |
  | **Naive** | Will act like me (Safe) | Swap to Plan B | Swap to Risky | **Pumped** (Exploited) |
  | **Sophisticated** | Will betray me (Risky) | Keep Plan A | N/A | **Safe** (Suboptimal Ex-Ante) |
  | **Resolute** | Is me (Bound by Plan) | Swap to Plan B | Stick to Safe | **Optimal** (Requires Willpower) |

  This structure allows you to discuss the money pump without relying on the intransitive A>B>C>A cycle, focusing instead on the tension between *Separability* and *Dynamic Consistency*.
