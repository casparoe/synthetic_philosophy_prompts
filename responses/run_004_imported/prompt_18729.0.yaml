answer: |-
  1. **The Sophistication Objection**
  Your resolute chooser avoids the money pump by sticking to a plan formed at the start. But consider the merely "sophisticated" chooser: he predicts the cycle, knows he will be tempted at the end, and simply declines the last trade without ever revising his ranking of A, B, and C. He escapes the pump through calculation alone, without your dispositional machinery. Why is sophistication an inadequate defense of rationality?

  *Follow-up:* She will likely argue that the sophisticated agent is still *dynamically inconsistent*—he would trade if he could, so he must constrain his future self—whereas the resolute agent is consistent. You should press: "If the financial outcome is identical—neither gets pumped—why does the internal label of 'consistency' matter for rationality? Are you defending a psychological state or an economic result?"

  2. **Plan-Keeping as a Preference**
  Critics often argue that what you call "resolution" is just a hidden preference. If an agent prefers 'Keeping My Plan' over 'Gaining $10,' isn't that just a transitive preference for plan-keeping under another name? If so, haven't you just restored transitivity by adding a fourth item to the preference list rather than challenging how we evaluate choices?

  *Follow-up:* She will likely insist that resolution is a *mode* of deliberation, not an *object* of preference. You should press: "But if it's not an object in the utility function, what causal work is it doing? If it has no utility weight, why does it win against money? Is it magic, or is it just a preference you refuse to name?"

  3. **The Meta-Pump**
  Let's assume your resolute chooser exists. Could a sufficiently clever operator build a second pump that targets the resolution itself rather than the original cycle? For example, if I charge a fee to enter a "Resolute State" that protects you from the first pump, and that fee exceeds the losses you would have suffered, haven't you still been pumped?

  *Follow-up:* She will likely argue that resolution is a disposition you cultivate, not a state you buy. You should press: "But cultivating that disposition takes time, cognitive energy, and resources. If I sell you the training to be resolute, and the cost exceeds the savings, are you still rational? At what point does the cost of integrity become irrational?"

  4. **Regret and the Collector**
  In my novel, the collector feels a pang of regret at every swap, sensing he's being fleeced but unable to stop. For a truly resolute chooser, should that regret exist? If the plan is rational, shouldn't the execution be emotionally flat, or does the resolute chooser also feel the tension of the local preference while overriding it?

  *Follow-up:* She will likely admit that tension exists but argue rationality isn't about comfort. You should press: "If the agent feels regret, they are signaling that their current self prefers the alternative. Doesn't that internal signal undermine your claim that the plan is truly 'rational' for the agent at time *t*?"

  5. **New Information and Rigidity**
  Suppose the collector is halfway through the cycle—holding Piece B—and learns that Piece C is a forgery. A standard rational agent updates and stops. Must the resolute chooser ignore this new information to stick to the plan? If they update, haven't they abandoned resolution; if they don't, aren't they being stubborn rather than rational?

  *Follow-up:* She will likely distinguish between "resolute choice" and "blind obstinacy," noting plans are conditional on information. You should press: "But if the plan is always conditional on new information, doesn't that collapse back into sequential optimization? Where is the line where sticking to the plan becomes irrational rigidity?"

  6. **The Source of Normativity**
  You argue rationality is a property of a whole plan pursued across time. But where does the normative force come from? Why *should* an agent care about the coherence of their temporal self more than the satisfaction of their current self? Is this a moral claim disguised as decision theory?

  *Follow-up:* She will likely argue that agency itself requires temporally extended structures. You should press: "If agency requires it, why do so few humans exhibit it? Are you describing how humans *do* choose, or creating an ideal type that requires us to be less human to be considered rational?"

  7. **Market Equilibrium**
  If your view wins and everyone becomes a resolute chooser, money pumps should disappear. But wouldn't dealers simply adapt? Instead of pumping preferences, wouldn't they start selling 'resolution insurance' or marketing products that exploit the *cost* of maintaining resolution? Does your theory change the market, or just the target?

  *Follow-up:* She will likely suggest that a market of resolute choosers is more efficient. You should press: "Or does it just shift the exploitation from cognitive biases to the cognitive labor of being resolute? Is the resolute chooser the master of the market, or just the one paying the highest maintenance costs?"

  8. **Falsifiability**
  To close: Decision theory is often accused of being unfalsifiable. What specific empirical outcome or formal proof would make you abandon the view? If you saw a population of resolute choosers consistently ending up poorer than sophisticated choosers, would that be enough?

  *Follow-up:* She will likely cite a formal proof that resolute choice leads to dominated strategies. You should press: "Given that standard expected utility theory already implies dominated outcomes in Newcomb-like problems, aren't you setting the bar for falsification impossibly high compared to the orthodoxy you're criticizing?"
