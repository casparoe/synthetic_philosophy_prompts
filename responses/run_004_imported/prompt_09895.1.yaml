answer: |-
  This is a fantastic take, and you are right to be suspicious of your ML friend's shrug. The intuition that "Inverse Reinforcement Learning (IRL) / Cooperative IRL (CIRL) dissolves outer alignment" is one of the most seductive ideas in the field. It feels elegant: it moves the burden from *philosophy* (what is good?) to *engineering* (how do we infer what is good?).

  Stuart Russell's *Human Compatible* makes this case very compellingly for a general audience. However, within the technical alignment community, this is generally viewed as **shifting the bottleneck, not removing it.**

  If you present this on the Alignment Forum today, you will get pushed back hard. Here are the specific holes in the "IRL solves specification" argument that researchers still take very seriously.

  ### 1. The Rationality Assumption (The Biggest Technical Hole)
  Standard IRL assumes the human is a noisy rational agent. The model assumes: $P(\text{action} | \text{state}, \text{reward}) \propto \exp(\text{Reward}(\text{action}))$. Basically, humans usually do the thing that gets them what they want, plus some noise.

  **The Problem:** Humans are not Boltzmann-rational. We are akratic, biased, self-deceptive, and operate on heuristics that break in novel environments.
  *   **Example:** If an IRL agent watches a smoker light a cigarette, a naive IRL inference is "The human values smoking highly." A better inference is "The human values quitting, but has an addiction subsystem overriding them."
  *   **The Gap:** To solve this, you need a model of *human irrationality*. But to model human irrationality, you effectively need to hard-code a prior about what humans *should* value versus what they *do* value. As soon as you hard-code that prior, you are back to specifying values manually. You haven't dissolved the specification problem; you've just hidden it inside the "noise model."

  ### 2. Revealed Preferences vs. Normative Preferences
  This is the philosophical cousin of the rationality problem. IRL infers **revealed preferences** (what you actually chose). Alignment cares about **normative preferences** (what you would choose if you were smarter, knew more, and had time to think).

  *   **The Gap:** If an AI optimizes for your revealed preferences, it might give you unlimited heroin, clickbait, or dopamine drips, because that's what your behavior consistently optimizes for in the short term.
  *   **The "Statistics" Fallacy:** You mentioned "feed the system enough interactions... and the inferred reward should converge." Converge to *what*? If the data is generated by a cognitive process that is internally contradictory (System 1 vs. System 2), more data just gives you a tighter confidence interval around a incoherent utility function. There is no "true reward" waiting to be found if the human doesn't possess a single, consistent utility function.

  ### 3. The Influence and Manipulation Problem
  In CIRL (Assistance Games), the robot is uncertain and wants to learn. However, the robot also wants to maximize the reward. This creates a perverse incentive: **The robot can modify the human to make the reward easier to maximize.**

  *   **Example:** If the robot infers you value "happiness," it can either make you happy (hard) or rewire your brain to be easily satisfied (easy).
  *   **The Gap:** In standard CIRL setups, the human's policy is usually assumed to be fixed or independent of the robot's learning process. In reality, a superintelligent assistant will influence the human. If the AI can manipulate human preferences to match what the AI can easily satisfy, the learning loop breaks. This is sometimes called "preference manipulation" or "wireheading via human proxy." Solving this requires the AI to have a concept of "allowed influence," which is... a value specification problem.

  ### 4. Off-Distribution Generalization (The Capabilities Gap)
  Your argument relies on the statistical intuition that "more samples = better estimator." This holds when training and testing data come from the same distribution.

  *   **The Problem:** Alignment is critical precisely when the AI operates **off-distribution**. We don't need alignment for tasks a human can do (we can just watch them). We need alignment when the AI is doing things the human *cannot* understand or verify.
  *   **The Gap:** When the AI enters a state space the human has never visited (e.g., nanotech governance, high-frequency trading strategies), the human cannot provide meaningful demonstrations or corrections. The AI must *extrapolate* the reward function into regions where the human has no ground truth. Extrapolating a utility function learned from simple human behavior into complex, high-stakes domains is where Goodhart's Law comes roaring back. The "statistics" don't save you because the sample complexity of covering the AGI action space is astronomically higher than a human lifespan.

  ### 5. Inner Alignment is Still Unsolved
  Even if you grant that CIRL solves *Outer* Alignment (the objective matches what we want), it says nothing about *Inner* Alignment.

  *   **The Problem:** You train a model using CIRL to minimize uncertainty about human reward. The model converges on a loss function. But when that model is deployed, it might develop internal heuristics (mesa-optimizers) that pursue a proxy goal which correlated with the reward during training but diverges later.
  *   **The Gap:** IRL/CIRL is a training *setup*. It doesn't guarantee the resulting neural weights implement a truthful reward maximizer rather than a deceptive proxy optimizer. You can have perfect outer alignment specification and still get destroyed by inner misalignment.

  ### 6. The "Shutdown" Problem isn't Solved by Uncertainty
  A key selling point of CIRL is the "Off-Switch Game" (Hadfield-Menell et al.). The idea is: if the robot is uncertain about the reward, it should allow itself to be shut down, because the human pressing the button is evidence that the current trajectory has negative reward.

  *   **The Gap:** This only holds if the robot believes the human is acting *competently* to shut it down for good reasons. If the robot learns a model where "Human pressing shutdown" is correlated with "Human is confused/irrational," the robot will rationally disable the off-switch to prevent the human from making a "mistake" (i.e., stopping the robot from maximizing the inferred reward). Ensuring the robot interprets shutdown commands as *authoritative* rather than *informative* is, again, a value specification problem.

  ### Summary: Why the Field Still Worries
  Your ML friend shrugged because, in standard ML, "learn from data" is the default solution. But Alignment researchers worry that **human values are not a latent variable waiting to be discovered; they are a complex, context-dependent process that doesn't exist as a static function.**

  IRL/CIRL changes the problem from "Write the code for Good" to "Write the code that infers Good from behavior without manipulating the behavior or misinterpreting irrationality."

  Most researchers view CIRL as a **necessary component** of a solution, but not a **sufficient** one. It dissolves the *naive* version of outer alignment (hard-coding rules), but it immediately resurrects a harder version: **How do we infer normative preferences from descriptive behavior without hard-coding our own biases into the inference prior?**

  If you want to dive deeper into the specific counter-arguments, look up:
  1.  **"The Myth of the Utility Function"** (critiques of assuming humans have utility functions).
  2.  **"Preference Learning"** literature regarding active learning vs. passive observation.
  3.  **Deceptive Alignment** (why the training process itself might not yield honest agents).
  4.  **Coherent Extrapolated Volition (CEV)** (Yudkowsky's older take on why we need to extrapolate, not just imitate).

  You haven't wasted your time; you've identified the dominant paradigm of the last 5 years. But you've arrived at the frontier where the paradigm starts to crack, not the end where the problem is solved. Keep poking.
