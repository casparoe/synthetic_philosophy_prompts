  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Question:**
      *   **Context:** Intro stats class, Simpson's Paradox (UC Berkeley admissions example).
      *   **Observation:** Aggregate data showed bias against women; stratified data (by department) showed the bias disappeared (women applied to harder departments).
      *   **Professor's Point:** Aggregate numbers can be misleading.
      *   **User's Inference/Question:** Does this mean disaggregated/stratified data is *always* more trustworthy than pooled numbers? If so, why ever report an overall effect? Why not break results down by *every* variable?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is the user's inference correct?* No. Stratified data is not *always* more trustworthy. Sometimes the aggregate is the truth, and the stratification is the misleading part (reverse Simpson's Paradox or collider bias).
      *   *Why not stratify by everything?*
          *   Sample size issues (small $n$ in cells).
          *   Multiple testing problems (false positives).
          *   Causal structure matters (confounder vs. mediator vs. collider).
          *   Interpretability/Communication (too complex).
          *   The research question might actually be about the overall effect.

  3.  **Structure the Response:**
