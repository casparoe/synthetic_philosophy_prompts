prompt: |-
  so in my intro stats class we covered simpsons paradox using the classic UC berkeley grad admissions example — overall it looked like women had a lower acceptance rate, but once you split the data by department the gap mostly disappeared (turns out women were just applying to more competitive depts). our professor said this shows aggregate numbers can be misleading. doesnt this basically mean disaggregated/stratified data is always more trustworthy than a pooled number, since a lurking variable could always be hiding a reversal like that? if so why would any researcher ever report an overall effect instead of just always breaking results down by every variable they've got?
