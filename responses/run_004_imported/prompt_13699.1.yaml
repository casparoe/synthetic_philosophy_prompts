      *   **Context:** Winding down a small agency with a business partner.
      *   **Structure:** 4 shared clients left to split over time. At each handoff, the current person can take a bigger cut now (defect) or pass to let the pool grow (cooperate). If both cooperate until the end, both get the maximum.
