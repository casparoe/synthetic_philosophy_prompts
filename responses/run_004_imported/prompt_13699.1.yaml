  2.  **Deconstruct the Centipede Game & Backward Induction:**
      *   *The Theory:* In a finite game of perfect information with common knowledge of rationality, backward induction dictates defection at the first node. Why? Because at the last node, the second player would defect. Knowing this, the first player at the second-to-last node should defect. And so on, back to the start.
      *   *The Paradox:* In real life (and experiments), people rarely defect immediately. They cooperate for a while.
      *   *Why the Theory Fails here:*
          1.  **Common Knowledge of Rationality:** Do both partners *know* the other is a hyper-rational payoff maximizer? Or do they value reputation, friendship, and fairness?
          2.  **Finite vs. Indefinite:** Is the game truly finite and known? (4 clients). Yes, seems so.
          3.  **Payoff Structure:** Is the "defect" payoff actually higher when factoring in reputation, legal costs, future references, and guilt?
          4.  **Social Preferences:** Humans aren't *Homo Economicus*. We have inequality aversion and reciprocity.

  3.  **Address the User's Specific Concerns:**
      *   *Stress:* Validate that the friend's advice is theoretically sound but practically flawed in this context.
