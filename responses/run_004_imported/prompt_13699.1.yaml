          *   *Assumption 3: Payoffs.* The "defect" payoff isn't just money. It's burned bridges, legal fees, guilt.
      *   **The "Type" Argument (Kreps/Wilson/Milgrom):** This is crucial. If there's even a tiny probability the partner is "irrational" (i.e., a cooperator), the rational strategy changes to cooperation for a while. This is the "Gang of Four" model.
