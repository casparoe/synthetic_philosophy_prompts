      *   Ensure the voice is appropriate for a grad student (confident, analytical, engaging with the text).

  7.  **Final Review against Prompt:**
      *   Did I reconstruct Bradley's reply from his commitments? Yes (internal relations, contradiction, Absolute).
      *   Did I address if he grants Armstrong's escape? No, he would reject it.
      *   Did I address the "new name" charge? Yes.
      *   Did I address Bradley's own vulnerability? Yes.

  8.  *(Self-Correction during drafting)*: I need to be careful not to make Bradley sound like he just says "mystery." He argues that relational thought is *discursive* and therefore divides what is concrete. The Absolute is *immediate*. Armstrong's tie is still part of a discursive ontology. This is a crucial distinction.

  9.  **Final Polish:** Check flow and clarity. (Proceeds to generate output based on these thoughts.)
answer: |-
  **Title:** The Unity of the Fact: Bradley's Regress and the Armstrongian Nexus

  **Introduction**

  The problem of Bradley's Regress remains the gravestone of classical realism regarding relations. If a relation $R$ is distinct from its terms $a$ and $b$, what connects $a$ to $R$? If a further relation $R'$, we are launched into an infinite vicious regress. In *Appearance and Reality*, F. H. Bradley concludes that relations are ultimately unintelligible contradictions, mere "appearance" subsumed within the non-relational unity of the Absolute. D. M. Armstrong, writing nearly a century later, attempts to halt this regress not by dissolving the terms, but by positing a fundamental ontological category: the state of affairs, bound by a "non-relational tie" of instantiation.

  This paper reconstructs the dialectic between these two positions. I argue that Bradley would reject Armstrong's solution as a dogmatic assertion of the very unity his argument proves cannot be constructed from distinct ontological categories. However, I further contend that Bradley's own resolution—the Absolute—is not immune to the charge of merely asserting unity by fiat. While Bradley offers a more rigorous diagnosis of the logical failure of relational thought, his appeal to "supra-relational" experience risks being as opaque as Armstrong's "non-relational" tie.

  **Armstrong's Non-Relational Tie**

  Armstrong's ontology is built on the intuition that the world is a world of states of affairs, not a world of bare particulars and freestanding universals. For Armstrong, the particular $a$ and the universal $F$ are abstractions from the primary fact: $a$'s being $F$. To avoid Bradley's Regress, Armstrong categorizes the "nexus" of instantiation as a *non-relational tie*.

  The strategic move is categorial. Bradley's regress generates because we treat the connector as a relation, and relations (by definition in this context) require further connectors. Armstrong blocks this by stipulating that the tie is *sui generis*. It does not relate terms in the sense of standing between them; it constitutes their togetherness. It is ontological glue that sticks without needing glue to stick it to the surfaces. By making the tie a fundamental, unanalyzable category, Armstrong claims to stop the regress before it begins. The unity of the state of affairs is a brute fact, not a constructed achievement.

  **Bradley's Diagnosis: Function vs. Category**

  How would Bradley respond to this? Based on his commitments in *Appearance and Reality*, particularly the doctrine that relational thought is inherently contradictory, Bradley would not be swayed by Armstrong's categorial stipulation. He would diagnose Armstrong's move as a verbal solution to a metaphysical problem.

  Bradley's central insight is that the regress arises not from the *name* we give the connector, but from the *distinctness* of the components. If $a$ and $F$ are ontologically distinct (as Armstrong grants, distinguishing particulars from universals), then their union requires explanation. Bradley would argue that calling the tie "non-relational" does not change its function. If the tie performs the work of connecting $a$ to $F$, it functions relationally. To say it is "non-relational" is to assert that it connects without connecting, which Bradley would view as a contradiction in terms.

  For Bradley, Armstrong is attempting to have his cake and eat it too. Armstrong wants distinct terms (to preserve realism and the subject-predicate structure of logic) and he wants primitive unity (to avoid the regress). Bradley would argue that you cannot build a concrete unity out of abstract distinctions simply by declaring one of the distinctions "magic." As Bradley writes, "You cannot qualify the real in pieces." If the particular and the universal are separate enough to require a tie, they are separate enough to generate a regress regarding that tie. If they are not separate enough to generate a regress, they are not distinct enough to require a tie. Armstrong's "non-relational tie" looks, from a Bradleyan perspective, like an attempt to hide the relational nature of instantiation behind a label, asserting the unity his own ontology renders impossible.

  **The Charge of Dogmatic Assertion**

  Bradley would likely characterize Armstrong's state of affairs as a "finite center" mistaken for the Real. Armstrong treats the state of affairs as a self-sufficient unit. But for Bradley, any finite judgment or fact is abstract; it cuts a slice out of the continuous whole of experience and treats it as independent. The "brute fact" of instantiation is, for Bradley, simply an admission that relational thought has reached its limit without acknowledging that the limit signifies the falsity of the thought-form itself.

  Armstrong stops the analysis at the state of affairs. Bradley pushes the analysis to the point where the analysis itself dissolves. Bradley would argue that Armstrong has not solved the regress; he has merely refused to follow it to its logical conclusion. By positing a "fundamental" tie, Armstrong is effectively saying, "Here the intellect must stop." Bradley agrees the intellect must stop, but he argues it must stop because relational intellect is inadequate to reality, not because it has hit a foundational brick. Thus, Bradley would diagnose Armstrong's tie as asserting under a new name ("nexus") the very unity that cannot be built out of separate terms plus a relation.

  **Bradley's Vulnerability: The Absolute as Super-Tie?**

  However, if we turn the lens on Bradley's own solution, is he less exposed to the charge of dogmatic assertion? Bradley resolves the contradiction of relations by subsuming them into the Absolute, a single, all-inclusive, supra-relational experience. Here, distinctions are "transmuted" rather than eliminated.

  Critics (and perhaps Armstrong) would argue that the Absolute is simply Armstrong's non-relational tie writ large. Armstrong posits a primitive unity for a single state of affairs; Bradley posits a primitive unity for the entire universe. If Armstrong is accused of mystically asserting that $a$ and $F$ are one without explaining how, Bradley is guilty of mystically asserting that *everything* is one without explaining how.

  Bradley's defense rests on the distinction between *construction* and *immediacy*. Armstrong's ontology is still constructive: it builds the world from particulars, universals, and ties. Bradley's Absolute is not constructed; it is given as immediate experience. For Bradley, relations are the result of thinking dividing the immediate. Therefore, the solution is not to find a better brick (the non-relational tie) but to return to the mortar (the immediate experience).

  Yet, this defense is vulnerable. Bradley admits that we cannot describe the Absolute without using relational language, which he admits is contradictory. He is forced to use the tools of "appearance" to describe "reality." In this sense, Bradley's resolution is arguably *more* exposed to the charge of assertion than Armstrong's. Armstrong offers a working ontology that aligns with scientific realism and logical atomism; he provides a functional stop-gap. Bradley offers a metaphysical silence. To say the Absolute unifies contradictions "supra-relationally" is to use a term that, by Bradley's own admission, has no positive content for the discursive intellect.

  **Conclusion**

  In a confrontation between Bradley and Armstrong, Bradley would ultimately reject the Armstrongian solution. He would view the "non-relational tie" as a category mistake that fails to address the underlying intelligibility problem: how distinct terms can cohere. Armstrong asserts unity; Bradley demands to know how unity is possible given distinctness.

  However, Bradley's own resolution does not escape the charge of assertion. While Bradley is more rigorous in demonstrating *why* relational realism fails, his appeal to the Absolute relies on a mode of unity ("supra-relational") that is as inexplicable within the bounds of logical discourse as Armstrong's "non-relational tie." The difference is one of scope and honesty: Armstrong posits a localized mystery to save the world of science and logic; Bradley posits a total mystery to save the coherence of reality. For the graduate seminarist, the lesson is that the regress is not merely a technical puzzle about relations, but a symptom of the tension between the discursive nature of thought and the putative unity of the world. Neither the analytic stop-gap nor the idealist transcendence fully resolves the tension; they merely choose where to place the burden of mystery.
