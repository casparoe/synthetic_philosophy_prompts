      *   *Avicenna's Flying Man:* Focuses on *essence/nature*. "If I were floating without senses, I would still know I exist." It's not just about *that* I am, but *what* I am. It's ontological (about being).
      *   *Key Difference:* Descartes proves existence first, then tries to prove the mind is distinct later (via God). Avicenna tries to prove the distinctness of the soul *immediately* through self-awareness.
      *   *The "Aha!" Moment:* For Avicenna, self-awareness is primitive. You don't infer you exist; you *feel* you exist. Even without a body, that feeling persists. Therefore, the "I" is not dependent on the body for its *definition*.

  3.  **Analyze the Logical Leap (Conceivability $\rightarrow$ Possibility $\rightarrow$ Reality):**
