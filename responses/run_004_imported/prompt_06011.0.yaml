answer: |-
  The chalk dust never truly left Brenner's clothes. It settled in the weave of his tweed jackets like pollen, a white residue of forty years spent drawing lines between right and wrong. In the quiet of the schoolhouse, late on a Tuesday, he sat at his desk grading a stack of arithmetic sheets from the upper forms. The red pen moved with a devotional rhythm. *Check. Check. Check.*

  The door creaked. Elias stood there, hat in hand. He had been a quiet boy, good with numbers, now grown into a man who wore his silence like a tailored suit. He taught at the university now, somewhere far beyond the valley.

  "Mr. Brenner," Elias said. "I was passing through. I wanted to see the old room."

  Brenner waved him to the front row. They spoke of the weather, of the roof repairs, of the neighbors who had died or moved away. Then Elias picked up a slate from a desk. On it, Brenner had written a problem for the morning: *57 + 68*.

  "You've taught this a long time," Elias said. He traced the plus sign with a thumb. "You know what it asks."

  "Of course."

  "But suppose," Elias said, his voice soft, lacking any edge of accusation, "that when you were a boy, and you learned this symbol, you understood it differently. Not as addition. But as a rule that matches addition for numbers smaller than fifty, and does something else for numbers larger."

  Brenner blinked. "That isn't addition."

  "How do you know?" Elias asked. "You have your memories. You remember intending to add. But a memory is just a picture in the head. A feeling. Can a feeling guarantee the future? If you meant *quus* instead of *plus*—a function that diverges only now, only at fifty-seven—how would you tell the difference? You've never added these specific numbers before this moment."

  Brenner looked at the sum. *125*. He had written it without thinking. But now the number floated. He searched his mind for the mechanism, the solid gear that turned *plus* into *sum*. He found only the sensation of confidence. He remembered teaching little Clara ten years ago. He had nodded when she wrote *4*. He had shaken his head when she wrote *5*. But why? Because it matched the rule. But which rule? The one in his head? He tried to grasp the intention itself, the mental state of *meaning addition*. It slipped away like water. There was no internal stamp that certified the path forward.

  "It's just what we do," Brenner said, but his voice sounded thin.

  "Is it?" Elias stood up. "If you woke up tomorrow and wrote *5* for this sum, feeling entirely certain you were following the same rule you always had, who could prove you wrong? Not by looking at your past. Your past fits both stories equally well."

  Elias left as the light faded. Brenner sat in the dim room. The doubt was not a noise; it was a silence. He walked home. He passed Mrs. Gable on the lane. He opened his mouth to say *Good evening*. But how did he know those sounds meant *greeting* and not *threat*? He had used them that way before, yes. But perhaps the rule for sounds was also a deviant function, waiting to flip. He closed his mouth. He nodded instead. But did a nod mean *peace*? Or did it mean *I am counting you*?

  He slept poorly. The bed felt like a suggestion of a bed.

  Morning brought the bell. The children arrived in a clatter of boots and wool. They took their seats. The room smelled of damp earth and milk. Brenner stood at the board. His hand hovered over the chalk. If he wrote *2 + 2*, what would come next? He felt untethered, a planet slipped from its orbit. There was no fact inside him to hold him in place.

  He wrote *2 + 2 =*.

  He turned to the class. Thirty faces looked back. They were waiting. Not for his insight, but for his move.

  Little Mara raised her hand. "Four," she said.

  Brenner looked at her. He looked at the others. They nodded. Some whispered *four*.

  He wrote *4*.

  The chalk snapped. A small cloud of white dust puffed into the air. Brenner felt a tremor in his hand. What if he wrote *5*? What if he decided, right now, that this was the continuation of his life's work? He looked at Mara. She was watching the board, her brow furrowed. If he wrote *5*, she would raise her hand. She would say *no*. The class would murmur. They would correct him.

  He realized then that the certainty was not in his wrist. It was in their eyes.

  He picked up a fresh piece of chalk. He wrote a new sum. *10 + 10*. He made a mistake on purpose. He wrote *25*.

  Mara's hand shot up. "That's wrong," she said.

  "Are you sure?" Brenner asked.

  "Yes," she said. "It's twenty. We count together."

  Brenner erased the *5*. He wrote *0*. The class exhaled, a small collective breath. The rule held. Not because he commanded it, but because they would not let it break. He turned back to the board, the red dust on his fingers, and waited for the next number, held upright by the weight of their agreement.
