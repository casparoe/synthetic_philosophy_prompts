prompt: |-
  So I keep running into this thing called the dogmatism paradox (the Kripke/Harman version): if I know P, then I already know that any future evidence against P must be misleading, so I'm entitled to discount it in advance. Feels like it should be trivially dissolved by ordinary Bayesian updating, but I can't actually pin down where the argument breaks. Does "conservation of expected evidence" actually kill the paradox, or does the exact same structure just resurface once you're credence in P gets close enough to 1 (a la Cromwell's rule)? Like, is there a principled line between "appropriately skeptical of surprising counterevidence because my priors are strong" and "question-beggingly dogmatic," or is that not actually a real distinction? Want a walkthrough that actually engages with the paradox's logic instead of just saying "well Bayesians never assign probability 1, so we're fine."
