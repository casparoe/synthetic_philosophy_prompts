  so my younger brother just told me he's deploying with the national guard next spring, and when i pushed back on how unjustified the whole operation seems to me, he got kind of annoyed and said something like: "i don't get a say in whether the war itself is justified, that's above my pay grade — as long as i follow the rules of engagement and don't do anything messed up once im there, im in the clear, morally speaking." that's been bugging me ever since and i can't quite articulate why it feels off. is he right that a soldiers moral responsibility basically resets to zero as long as they stick to the rules on the ground, no matter how unjustified the war turns out to be? i'm doing a poli sci phd so i've bumped into some of the academic arguments around this before, but i want your actual reasoned take here, not just a rundown of who says what.
