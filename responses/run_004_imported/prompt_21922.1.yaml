answer: |-
  The problem of logical omniscience has long haunted formal epistemology. Standard probability theory demands that a rational agent assign probability 1 to all logical truths and 0 to all contradictions. Since the set of logical truths in arithmetic is undecidable, no bounded agent—human or machine—can satisfy this demand. We are left with a paradox: rationality requires coherence, but coherence requires omniscience. In their 2016 paper "Logical Induction," Scott Garrabrant and colleagues at the Machine Intelligence Research Institute (MIRI) proposed a radical solution. By modeling belief formation as a financial market where computable traders bet on logical sentences, they constructed a system that avoids exploitation in the limit, learns statistical patterns before proofs are found, and handles self-reference without paradox.

  However, the philosophical community remains divided on whether Logical Induction (LI) truly solves the problem or merely dresses it in new mathematics. One camp views it as a breakthrough that dissolves the impossibility result; the other sees it as an elegant asymptotic guarantee that offers no guidance for the finite, time-bound reasoner. This essay will articulate the strongest arguments of both sides before defending the verdict that Logical Induction constitutes a **genuine dissolution of the theoretical problem of logical omniscience, conditional on accepting that rationality for bounded agents is fundamentally a diachronic (process-based) property rather than a synchronic (state-based) one.**

  ### The Case for Dissolution

  The proponents of Logical Induction argue that the traditional framing of the problem is itself the error. The demand for synchronic coherence—having perfectly consistent probabilities at every single moment—is a standard appropriate for God, not for bounded agents. LI replaces this with a criterion of *asymptotic non-exploitability*.

  The strength of this position lies in the specific properties the LI criterion guarantees, which no previous framework could simultaneously achieve. First, LI demonstrates that a computable reasoner can learn statistical regularities in advance of proof. If a pattern exists in the digits of $\pi$ or the distribution of prime numbers, the LI market will converge to the correct credence regarding that pattern long before a formal proof is enumerated. This captures the intuitive sense in which a mathematician can be "reasonably confident" in a conjecture like the Riemann Hypothesis without a proof.

  Second, LI handles independence and uncertainty gracefully. Unlike standard probability, which might force extreme probabilities due to hidden logical dependencies, the LI market keeps credences non-extreme on sentences that are effectively independent of current knowledge. Third, and perhaps most remarkably, LI achieves reflective consistency. It can assign coherent probabilities to sentences that refer to its own future beliefs (e.g., "The price of this sentence tomorrow will be greater than 0.5") without collapsing into the Godelian loops that plague naive self-referential systems.

  For the proponent, this is a genuine dissolution. It proves that the tension between "bounded computation" and "logical coherence" is not a hard impossibility, but a trade-off manageable over time. It shows that a "logical prior" is not a mythical object but a constructible process. By shifting the normative standard from "be coherent now" to "do not lose money forever," LI provides a rigorous definition of rationality that bounded agents can actually instantiate.

  ### The Case for Epistemological Stasis

  The skeptics, however, argue that while LI solves a mathematical problem, it leaves the epistemological problem essentially untouched. Their critique focuses on the gap between asymptotic guarantees and finite reality.

  The primary objection is the lack of convergence rates. The theorems of Logical Induction guarantee that the market prices will converge to coherence and calibration *in the limit*. They do not specify *how fast*. For a real-world agent operating at a specific time $t$, the guarantee that the market will not be exploited "eventually" is cold comfort if the market can be pumped for arbitrary amounts of money at stage $t$. As the skeptics note, nothing in the theorems constrains what the market believes at any given finite stage. A market could assign probability 0.99 to a falsehood at step one million and still satisfy the LI criterion, provided it corrects itself by step one trillion. For an agent who must act *now*, a theory that permits arbitrary error in the short run offers no normative guidance.

  Furthermore, skeptics argue that LI merely relocates the arbitrariness it was meant to resolve. To make the market well-defined, one must assign initial wealth to the traders, typically weighting them by some complexity measure (e.g., simpler traders get more money). This choice of weighting functions as a "logical prior." Critics contend that this reintroduces the subjectivity that a theory of logical uncertainty was supposed to eliminate. If the resulting credences depend on the arbitrary choice of trader enumeration and wealth distribution, LI has not solved the problem of the logical prior; it has merely hidden it inside the market mechanics.

  For this camp, LI is a beautiful impossibility proof in reverse: it shows that non-exploitable reasoning is *possible*, but not how to *do* it. It leaves the core epistemological question—"What should I believe right now?"—unanswered.

  ### Verdict: A Dissolution Conditional on Diachronic Norms

  The debate between these camps hinges on what we demand from a theory of rationality. If we demand a calculator that outputs the correct credence for any sentence at any time, Logical Induction fails. However, if we demand a coherent framework that explains how bounded agents *can* reason about logic without falling into inconsistency or Dutch books, Logical Induction succeeds.

  I defend the verdict that Logical Induction constitutes a **genuine dissolution of the problem**, but this verdict is **conditional on accepting that rationality for bounded agents is fundamentally diachronic.**

  The "Problem of Logical Omniscience" arises only if we insist that rationality is a property of a belief *state* at a specific instant. Under that synchronic view, the skeptics are correct: LI provides no constraints on the state at time $t$. But this synchronic view is precisely what makes logical omniscience an impossible demand for bounded agents. No finite machine can check all logical consequences of its beliefs instantly. Therefore, evaluating such a machine by synchronic standards is a category error.

  Logical Induction dissolves the problem by correctly identifying that for a bounded reasoner, rationality is a property of a belief *trajectory*. The LI criterion asserts that a reasoner is rational if their sequence of beliefs cannot be systematically exploited over time. This is the correct analogue to coherence for finite beings. The lack of convergence rates is not a failure of the theory, but a reflection of the computational reality: there is no free lunch. We cannot guarantee fast convergence to truth without assuming specific structures about the environment (which would reintroduce the prior problem). LI provides the most general guarantee possible: *survival*.

  Regarding the skeptics' concern about arbitrariness in trader weighting: this criticism holds water only if one expects a "unique" logical prior. But Bayesian epistemology has long accepted that priors can vary provided they update correctly. LI improves on standard Bayesianism by making the prior *computable* and by ensuring that different reasonable priors (weightings) will eventually converge on the same truths, even if they disagree temporarily. The arbitrariness is not a bug; it is the recognition that different starting heuristics are valid for bounded agents, provided they are learnable.

  ### Conclusion

  The skeptics are right that Logical Induction does not hand a finite agent a manual for immediate truth. It does not tell a mathematician today what credence to assign the Riemann Hypothesis. However, the proponents are right that it dissolves the paradox that suggested such reasoning was impossible in principle.

  Therefore, Logical Induction is a genuine dissolution of the problem of logical uncertainty, **conditional on the epistemological shift from evaluating static belief states to evaluating dynamic reasoning processes.** If one insists that a theory of rationality must provide synchronic constraints on belief, LI will always appear empty. But since synchronic coherence is impossible for bounded agents, that insistence is a demand for a theory of God, not a theory of reason. Logical Induction provides the first rigorous theory of the latter. It shows that while we cannot be logically omniscient, we can be logically resilient. That is not merely an elegant construction; it is the foundation for a realistic epistemology of mathematics.
