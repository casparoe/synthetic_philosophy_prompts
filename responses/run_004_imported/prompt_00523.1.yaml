answer: |-
  This is a fantastic real-world application of a core debate in formal epistemology and decision theory. You have stumbled directly into the distinction between **risk** and **ambiguity** (often called Knightian Uncertainty), and the conflict between **Orthodox Bayesianism** and **Imprecise Probability**.

  Short answer: **You are not obviously irrational.** Your hesitation is a recognized, defensible philosophical position, though your roommate is arguing from the standard Orthodox Bayesian framework.

  Here is the breakdown of why this is a genuine philosophical standoff and not just you being indecisive.

  ### 1. The Roommate's View: Orthodox Bayesianism (Sharp Credences)
  Your roommate is arguing from the perspective of **Subjective Expected Utility (SEU)** theory. This is the standard model taught in many econ and philosophy classes.

  *   **The Requirement of Precision:** Orthodox Bayesians believe that rationality *requires* you to have a precise credence (a specific number) for every proposition, even if you have no evidence.
  *   **The Principle of Indifference:** Since you have no reason to think the die is biased toward 6 rather than away from it, you should assign the "default" probability. For a six-sided die, that is $P(6) = 1/6$.
  *   **The Calculation:** If you assign $P(6) = 1/6$, you can calculate the Expected Value (EV) of the bets.
      *   If the bets are offered at "fair" odds for a fair die (e.g., you win \$5 if it hits 6, lose \$1 if it doesn't), the EV is 0. You should be indifferent.
      *   If the bets are even money (win \$10 if 6, lose \$10 if not 6), the EV of betting on 6 is negative, and betting on Not-6 is positive. In this case, a Bayesian *would* say you are irrational to refuse the "Not 6" bet.
  *   **Her Argument:** She is claiming that because the die *is* physically biased (ontically), one bet *does* have positive value. She thinks you should pick a credence, maximize utility, and take the bet. To her, refusing to assign a probability is a failure of rationality.

  ### 2. Your View: Imprecise Probabilities (Mushy Credences)
  Your intuition aligns with a framework known as **Imprecise Probabilities** or the **Mushy Credence** view (championed by philosophers like Isaac Levi, James Joyce, and others).

  *   **Ignorance vs. Risk:** You are distinguishing between *risk* (where you know the odds, like a casino) and *ambiguity* (where you don't know the odds, like this drawer die).
  *   **Representing Ignorance:** You feel that assigning a precise number like $1/6$ is unjustified because you have *no evidence* about the die's physical properties. Instead of a single number, your credal state is an **interval** (e.g., "The probability of 6 is somewhere between 0 and 1").
  *   **Decision Rules:** If your probability is an interval, standard Expected Utility doesn't work. You might use a rule like **Maximin** (choose the option with the best worst-case scenario).
      *   Bet on 6: Worst case is you lose (die is biased against 6).
      *   Bet on Not-6: Worst case is you lose (die is biased toward 6).
      *   Don't Bet: Worst case is you gain/lose nothing.
      *   Under Maximin, refusing both bets is the rational choice because it guarantees you don't lose money to an unknown bias.
  *   **Ambiguity Aversion:** This is famously illustrated by the **Ellsberg Paradox**. People consistently prefer betting on an urn with 50 red/50 black balls over an urn with 100 balls of unknown ratio, even though the math *could* be the same. Orthodox theory calls this irrational; many epistemologists argue it is a reasonable heuristic for navigating a world where information is often missing.

  ### 3. The "Money Pump" Objection (Your Roommate's Ammo)
  If you debate this further, your roommate will likely bring up **Dutch Books** or **Money Pumps**.

  Orthodox Bayesians argue that if you have imprecise credences and refuse bets based on ambiguity, you can be exploited.
  *   *Example:* If you refuse Bet A (on 6) because you fear it's biased against 6, and you refuse Bet B (on Not-6) because you fear it's biased toward 6, a clever bookie could sell you one, then buy it back from you for a fee, leaving you with less money and the same position you started with.
  *   To a strict Bayesian, this vulnerability proves your decision rule is irrational.

  However, defenders of imprecise probabilities argue that avoiding a Money Pump isn't the *only* goal of rationality. Avoiding catastrophic loss due to ignorance (Maximin) is also a valid goal.

  ### 4. Who is right?
  It depends on which normative framework your class is adopting, but in the broader philosophical landscape:

  1.  **If the stakes are even money (1:1):** Your roommate has a stronger case. Since $P(6)$ would need to be greater than $0.5$ for the "6" bet to be better than the "Not 6" bet, and there are 5 other numbers, the "Not 6" bet is robustly better unless the die is *extremely* loaded. Refusing that specific bet is hard to defend.
  2.  **If the stakes are "fair" for a fair die (5:1):** You are on very solid ground. If the payout assumes a $1/6$ chance, but you don't *know* it's $1/6$, taking the bet is gambling on your ignorance. Refusing is a form of **epistemic humility**.

  ### Conclusion
  You are experiencing **Ambiguity Aversion**, and while Orthodox Bayesianism labels this irrational, it is a widely discussed and defended position in modern epistemology.

  *   **Your Roommate** is treating this as a problem of **Risk** (known probabilities).
  *   **You** are treating this as a problem of **Uncertainty** (unknown probabilities).

  You can tell her: *"I'm not being irrational; I'm just rejecting the Principle of Indifference. My credence isn't a point, it's a set. Under a Maximin decision rule, opting out is the only strategy that protects me from Knightian Uncertainty."*

  If that doesn't work, just tell her you'll wait until she rolls it 100 times so you can get some frequency data. That's rational in any framework!
