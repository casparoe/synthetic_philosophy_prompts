answer: |-
  This is a profound and painful moment in the life of a scholar. What you are experiencing is a specific kind of intellectual grief: the shattering of a philosophical idol. It is not merely that a hero has feet of clay; it is that the clay seems to have seeped into the marble of the work itself. Michael Dummett, as you note, walked this path before you. He was a man of profound moral conviction (a staunch anti-racist and campaigner for justice) who nonetheless believed Frege was the greatest philosopher of the twentieth century. He described the discovery of the diary as a "shock" that required a re-evaluation of the man, though he held firm on the work.

  You are asking two distinct but entangled questions. I will address them in turn, though as you suspect, the answers bleed into one another.

  ### 1. The General Question: The Odious Author and the Technical Work

  The literature on this is indeed substantial, with Heidegger serving as the primary case study. Generally, philosophical reception falls into three camps regarding the relationship between a thinker's life and their work:

  **A. The Autonomy of Argument (The Analytic Standard)**
  This is the traditional view held by many in the analytic tradition (including, largely, Dummett). It posits that logical and mathematical truths are timeless and context-independent. If Frege proves that arithmetic is reducible to logic, the proof stands regardless of whether he was a saint or a monster. On this view, biography is relevant only to the *history* of ideas, not the *validity* of ideas.
  *   *The Heidegger Comparison:* Richard Rorty and Hubert Dreyfus largely took this view. They argued one could use Heidegger's tools for analyzing *Dasein* without accepting his politics.
  *   *The Risk:* This can lead to a sterile "compartmentalization" that ignores how values shape the questions a philosopher thinks are worth asking.

  **B. The Contamination Thesis (The Critical View)**
  This view argues that philosophy is never done in a vacuum. A thinker's political and moral commitments shape their metaphysics, their epistemology, and what they count as "rigor."
  *   *The Heidegger Comparison:* Emmanuel Faye and Victor Farías argue that Heidegger's Nazism is not an accidental add-on but is *ontologically embedded* in his work (e.g., concepts of "destiny," "decision," and "the people").
  *   *The Risk:* This can slide into a genetic fallacy, where the truth of a proposition is denied solely because of its origin. If taken to the extreme, it makes doing history of philosophy impossible, as almost every canonical figure held views we now find repugnant.

  **C. Critical Engagement (The Dummettian Middle Way)**
  This is perhaps the most mature position. It acknowledges that while the *technical core* (e.g., the predicate calculus) may be sound, the *philosophical motivation* and the *broader system* may be inflected by the author's biases. It requires reading the text with a "hermeneutic of suspicion" without discarding the insights.
  *   Dummett concluded that while Frege's logic was secure, his philosophy of language and his conception of "thought" might bear the scars of his isolationism and rigidity. He argued we must separate the "wheat from the chaff," acknowledging that the chaff exists without pretending it is wheat.

  **Recommendation for your position:** You are working on anti-psychologism. This is a technical thesis about the nature of truth conditions. It is more resilient to biographical critique than Heidegger's ontology of "the People." However, the *motivation* for anti-psychologism (the fear of relativism) is vulnerable. You can hold that Frege's *arguments* against psychologism remain valid while acknowledging that his *fear* of relativism was pathological when applied to human beings.

  ### 2. The Specific Question: Is there a Continuity?

  You ask if there is a real intellectual continuity between Frege's anti-psychologism (logic is universal/objective) and his nationalism (political rights are particular/exclusionary). You worry this might be a "spurious unity" imposed retroactively.

  It is not spurious, but it is not a logical entailment either. It is a **structural affinity** rooted in a shared temperamental anxiety: **the fear of contamination and the demand for purity.**

  Here is how to map that continuity without falling into the trap of saying "Frege's logic is fascist":

  **The Shared Structure: Objectivity as Purity**
  *   **In Logic:** Frege's battle against psychologism was a battle to purify logic of the "subjective." He feared that if logic depended on how humans *happen* to think, truth would become relative, chaotic, and unstable. He posited a "Third Realm" of thoughts that is pristine, untouched by human history or biology. To save Truth, he had to wall it off from the human mind.
  *   **In Politics:** Frege's nationalism was driven by a similar fear of contamination. He viewed the German *Volk* as an organic entity that needed protection from "alien" elements (Jews, liberals, democrats) to maintain its integrity. He saw the Weimar Republic not as a political system but as a contamination of the natural order.

  **The Link: Anti-Relativism**
  The continuity lies in his **intolerance of relativism**.
  *   For Frege, the psychologizer says: "Truth is what seems true to humans." Frege says: "No, Truth is absolute."
  *   For the Liberal Democrat, the claim is: "Rights belong to persons by virtue of their humanity." Frege says (in the diary): "No, rights belong to members of the *Volk* by virtue of their blood/history."

  In both cases, Frege rejects a universalist, humanistic baseline in favor of a rigid, objective structure that stands *above* individual choice. In logic, this structure protects Truth from the mind; in politics, it protects the State from the individual.

  **Is it a "Real" Continuity?**
  Yes, in the sense that it reveals the *temperamental architecture* of his mind. Frege craved order, hierarchy, and boundaries. He could not tolerate the "messiness" of psychological variation any more than he could tolerate the "messiness" of a pluralistic democracy.
  *   **However,** it is crucial to note that anti-psychologism does not *logically require* antisemitism. One can believe logical laws are objective (as Platonists do) while believing all humans have equal rights (as many Platonists have). Frege's move from "Logic is not psychological" to "Jews are not German" is not a valid inference; it is a **psychological displacement**. He took a legitimate philosophical desire for objectivity and misapplied it as a political desire for exclusion.

  ### How to Proceed with Your Dissertation

  You are in a position to do something very difficult but valuable. You do not need to burn your dissertation, nor do you need to ignore the diary.

  1.  **Do not ignore it.** To write about Frege today without acknowledging the diary is intellectually dishonest. It casts a shadow over the "intellectual integrity" you admired.
  2.  **Distinguish the *Argument* from the *Pathology*.** Your dissertation can argue that Frege was *right* about logic (it is not psychological) while admitting he was *wrong* about why it mattered to him (he conflated logical stability with political/racial purity).
  3.  **Use the Tension.** In your conclusion or introduction, address this explicitly. You might write that Frege's anti-psychologism is a triumph of philosophical rigor, but one achieved by a mind that sought safety in rigid boundaries. This actually strengthens your analysis: it shows you understand the *stakes* of the debate for Frege. It wasn't just academic; for him, the collapse of logic into psychology was akin to the collapse of Germany into chaos.
  4.  **Follow Dummett.** Dummett managed to remain a Fregean without becoming a reactionary. He recognized that Frege's longing for objectivity was noble, even if Frege's understanding of "objectivity" in the human sphere was monstrous.

  **Final Thought**
  You wrote that you treated Frege's anti-psychologism as a "model of intellectual integrity." In a way, confronting this diary is the final test of that integrity. Intellectual integrity does not mean defending the master; it means following the truth even when it makes the master smaller.

  The logic remains. The *Begriffsschrift* still works. The distinction between sense and reference still illuminates. But the man who wrote them was flawed, frightened, and capable of great hatred. Acknowledging this does not destroy your work; it grounds it in reality. You are not studying a god; you are studying a human being who saw further than most into the nature of truth, but who was blind to the nature of his neighbors. That is a tragedy, but it is not a contradiction that invalidates the logic.

  Keep working. The best tribute to the "objective truth" Frege loved is to judge Frege himself by objective moral standards, and find him wanting, while keeping the gold he mined.
