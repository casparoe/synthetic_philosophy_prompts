answer: |-
  This is a genuinely high-quality dispute. You and Theo have hit on one of the central fault lines in contemporary social ontology and philosophy of language: the tension between the **Rationalist/Intentionalist** tradition (Lewis, Grice, Schelling) and the **Evolutionary/Functionalist** tradition (Skyrms, Young, Millikan).

  To act as the neutral judge, I need to look closely at the machinery of Lewis's definition, evaluate whether the evolutionary models actually break it, and determine if your synchronic defense holds water.

  Here is the adjudication.

  ### 1. The Machinery: What Lewis Actually Requires
  You are correct that textbook glosses often simplify Lewis. In *Convention* (1969), Lewis defines a convention as a regularity $R$ in behavior among a population $P$ in a recurrent situation $S$, such that it is **common knowledge** in $P$ that:

  1.  **Conformity:** Everyone conforms to $R$.
  2.  **Expectations:** Everyone expects everyone else to conform to $R$.
  3.  **Preferences (Coordination Equilibrium):** Everyone prefers to conform to $R$ on the condition that others do (because $S$ is a coordination problem).
  4.  **Arbitrariness:** There is an alternative regularity $R'$ that could have solved the coordination problem just as well.

  **The Role of Common Knowledge (CK):**
  Lewis isn't just adding CK for flavor. He needs it for two specific philosophical jobs:
  *   **Stopping the Regress:** To justify my conformity, I need to expect you to conform. To justify that expectation, I need to expect that you expect me to conform. Without CK, this hierarchy of expectations ("I expect that you expect that I expect...") has no guaranteed bottom or top. CK ensures the hierarchy holds *ad infinitum* in principle, grounding the rationality of the choice.
  *   **Grounding Meaning:** Lewis's ultimate goal isn't just traffic rules; it's truth-conditional semantics. He needs to show that meaning is constituted by facts about use that are robust enough to defeat Quinean indeterminacy. CK provides the "publicness" required to make meaning objective rather than private.

  ### 2. Evaluating Theo's Critique (The Evolutionary Challenge)
  Theo is drawing on the tradition of evolutionary game theory (EGT), specifically signaling games (like the Sender-Receiver models in Skyrms's *Signals*).

  **Theo's Strong Point:**
  In these models, populations converge on stable signaling systems (e.g., State 1 $\to$ Signal A $\to$ Action X). These systems satisfy Lewis's **Arbitrariness** clause (they could have converged on Signal B) and his **Coordination Equilibrium** clause (deviating lowers fitness/payoff). However, the agents in these models (urns, simple neural nets, replicators) often possess **zero cognitive architecture**. They do not have beliefs, they do not have expectations, and they certainly do not have Common Knowledge. They simply have dispositions reinforced by success.

  If we call these stable systems "conventions" (which Skyrms and the literature do), then Lewis's definition is **over-intellectualized**. It excludes clear cases of the phenomenon it aims to define. Theo is right that this suggests CK is not *necessary* for the existence of a convention.

  **The Vulnerability in Lewis:**
  Lewis ties convention to *reasons for action*. He assumes agents conform *because* they have expectations. EGT shows agents can conform *because of selection pressures* without having reasons. If convention is just "arbitrary, self-perpetuating coordination," Lewis's epistemic conditions are indeed superfluous for the general phenomenon.

  ### 3. Evaluating Your Pushback (The Synchronic Defense)
  Your argument is that Lewis's definition is synchronic: it asks what makes a regularity a convention *now*, not how it got there. You suggest that even if a regularity arose via blind evolution, the current population might satisfy the CK condition.

  **Where This Fails:**
  This defense works for human populations that *have* cognitive capacity but didn't use it during genesis. It fails against the specific models Theo is citing. In Skyrms's basic models, the agents **lack the hardware** to represent expectations, let alone common knowledge. It is not that they *haven't* formed the knowledge synchronically; it is that they *cannot* form it. An urn drawing balls does not have a "belief state."

  Therefore, you cannot save Lewis by saying "they have CK now." If the agents are simple learners, they *never* have CK. If you insist they do, you are attributing mental states to them that the model explicitly excludes, which makes the condition unfalsifiable (exactly as Theo accused).

  **Where You Are Right:**
  You are right about Lewis's *motivation*. Lewis wasn't trying to define "convention" for bacteria or urns; he was defining it for **rational agents** to solve a specific problem in the **philosophy of language**. For Lewis, a "convention" without common knowledge might be a stable habit, but it cannot ground *meaning* in the Gricean sense, because meaning requires an intention to be understood. Theo's evolutionary conventions ground *information* (in the Shannon sense), but arguably not *meaning* (in the semantic sense).

  ### 4. The Verdict
  **Theo wins on the analysis of Social Regularities.**
  Lewis's definition is too narrow to capture the full extension of "convention." Evolutionary models demonstrate that the functional core of convention (arbitrary, self-perpetuating coordination) does not require the cognitive machinery of common knowledge. Theo is correct that CK is not a necessary condition for the *stability* or *existence* of a convention.

  **You win on the Philosophy of Language.**
  Lewis's "overkill" was deliberate. He needed CK to bridge the gap between *behavior* and *meaning*. If Theo is right that conventions can exist without CK, then Lewis's anti-skeptical project against Quine is weakened. Quine asked, "What facts constitute meaning?" Lewis answered, "Convention + CK." If convention doesn't require CK, the facts are thinner, and Quinean indeterminacy becomes harder to rule out.

  **Overall Judgment:**
  Theo is philosophically stronger on the definition of **convention simpliciter**. Your friend has successfully identified that Lewis conflated the *rationale* for conformity (which requires CK) with the *constitution* of the regularity (which does not).

  ### 5. The Smallest Fix (Patching Lewis)
  If we want to save Lewis's account while accommodating Theo's evolutionary insights, we need to decouple the **epistemic conditions** from the **structural conditions**. We need a definition that covers both rational humans and simple learners without losing the ability to ground meaning where appropriate.

  Here is the minimal patch to Lewis's definition:

  **Replace the Epistemic Clause with a "Public Salience & Dispositional" Clause.**

  Instead of requiring:
  > (2) Everyone expects everyone else to conform...
  > (5) This is Common Knowledge...

  We substitute:
  > **(2*) Public Salience:** The regularity $R$ is publicly observable and salient in the population's environment.
  > **(5*) Dispositional Conformity:** Agents are disposed to conform to $R$ conditional on the public salience of $R$ and the conformity of others (where "disposed" covers both rational expectation and evolutionary reinforcement).

  **Why this works:**
  1.  **Accommodates Theo:** Simple learners (urns, animals) can track public salience and have dispositions without holding higher-order beliefs. This allows evolutionary signaling systems to count as conventions.
  2.  **Preserves Your Point:** For rational human agents, "Dispositional Conformity" based on "Public Salience" *generates* Common Knowledge. If I am rational and I know you are rational, and we both see the public salience, the CK hierarchy is reconstructed. So Lewis's original machinery becomes a *special case* of the patched definition, applicable to meaning-heavy contexts.
  3.  **Avoids Unfalsifiability:** Public salience is an objective feature of the environment (e.g., the signal is audible, the driving side is visible), not a hidden mental state.

  **Conclusion for the Argument:**
  Tell Theo he wins on the **ontology of convention**: CK isn't necessary for the regularity to exist. Tell him, however, that you win on the **normativity of meaning**: Lewis needed CK to explain why we feel *bound* by conventions and how they generate semantic content, not just information. The "fix" is to acknowledge that Lewis defined **Rational Convention**, which is a subset of **Convention simpliciter**. If he had admitted that, the two-hour argument could have been a twenty-minute agreement.
