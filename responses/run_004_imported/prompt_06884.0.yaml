answer: |-
  This is a fantastic setup. Since your audience is rationalist-adjacent, they'll care about *falsifiability*, *mechanism*, and *distinguishing hypotheses* far more than standard philosophical hand-waving. You want to avoid letting her retreat into "it's complicated" without first forcing a crisp distinction.

  Here are 10 questions designed to be sharp but conversational, with follow-ups that anticipate the standard philosopher defenses.

  ### 1. The Hacking Shadow
  **Question:** Ian Hacking used autism as his paradigmatic example of an "interactive kind" back in the 90s. If he already established the mechanism, is your contribution primarily empirical—just updating the prevalence numbers to show the loop is stronger than he thought—or are you proposing a structural change to how the looping effect itself works?
  **Follow-up:** *If she says "empirical update":* "If it's just new data on an old model, does that risk turning this from a philosophy of science argument into a purely epidemiological one? Where does the philosophical novelty lie?"

  ### 2. Detection vs. Looping
  **Question:** You argue the prevalence explosion is a looping effect, not just better detection. But in practice, how do you distinguish a population *changing* because of the label (looping) from a population *being found* because we finally have the right radar (detection)?
  **Follow-up:** *If she cites self-identification:* "Self-reporting is the easiest place for looping to hide. Do you have any evidence of looping in non-verbal or low-functioning presentations where self-concept isn't mediating the diagnosis?"

  ### 3. Concept Creep (Haslam)
  **Question:** Nick Haslam's work on "concept creep" describes diagnostic categories expanding semantically to cover more behaviors. Is your "looping effect" just the *mechanism* by which concept creep happens, or are these distinct phenomena? If they're distinct, can you have one without the other?
  **Follow-up:** *If she says they're distinct:* "Then give me a case where concept creep occurred without a looping effect, or vice versa. If they always travel together, are we just fighting over terminology?"

  ### 4. The Constructionism Trap
  **Question:** Hacking spent his career insisting Dynamic Nominalism wasn't social constructionism—he wasn't saying the people weren't real, only that the *kind* interacts with them. Does your view risk collapsing into the stronger claim that autism itself is socially constructed, rather than just the prevalence rates?
  **Follow-up:** *If she says "Autism is real":* "If the underlying neurotype is biologically real and stable, but the diagnosis rate is socially fluid, at what point does the fluidity of the diagnosis overwrite the stability of the biology in a clinical setting?"

  ### 5. The MPD Test Case (Predictive Power)
  **Question:** Let's use Multiple Personality Disorder (DID) from the 80s and 90s as a test case. That diagnosis surged and then largely collapsed. Does your framework predict when a loop will sustain itself (like autism) versus when it will pop and collapse (like MPD)?
  **Follow-up:** *If she says "It explains it retroactively":* "If the theory can explain both an explosion and a collapse with equal ease after the fact, what variable would you need *today* to predict which current diagnostic trends will crash tomorrow?"

  ### 6. Directionality of the Loop
  **Question:** Following up on MPD: Why does the autism loop run positively (more diagnosis → more identification → more diagnosis) while the MPD loop ran negatively (more diagnosis → skepticism/stigma → less diagnosis)? Is there a feature of the *label* that determines the loop's direction?
  **Follow-up:** *If she mentions "community support":* "So the stability of the loop depends on the political utility of the diagnosis? Does that imply that if the neurodiversity movement lost momentum, the autism loop would reverse?"

  ### 7. The Transmission Mechanism
  **Question:** Philosophically, we talk about "the loop" as a singular thing. But mechanistically, how is the effect actually transmitted? Is it mediated by clinicians changing their thresholds, parents seeking labels for services, or adults adopting the identity?
  **Follow-up:** *If she says "All of the above":* "Which lever is the strongest? If you could only intervene on one—say, restrict clinician criteria vs. change public discourse—which one breaks the loop?"

  ### 8. The "Good" Loop
  **Question:** Hacking sometimes hinted that looping isn't necessarily bad—it allows people to craft new ways of being. Do you view the explosion in autism diagnoses as a net harm (medicalizing normality), a net benefit (unlocking support), or normatively neutral?
  **Follow-up:** *If she says "Normatively neutral":* "Philosophy of psychiatry usually aims to improve practice. If the diagnosis rate is driven by a feedback loop rather than pathology, shouldn't we be trying to dampen the loop to get a truer signal?"

  ### 9. DSM Criteria vs. Cultural Kind
  **Question:** You mention this isn't just about DSM-5 criteria loosening. But if the cultural concept of autism expands while the DSM criteria stay static, are clinicians actually diagnosing a different "kind" than the one in the manual?
  **Follow-up:** *If she says "Yes":* "Does that mean we effectively have two autisms now: the clinical kind and the cultural kind? And if so, which one is your looping effect acting upon?"

  ### 10. Falsification
  **Question:** To be blunt: What evidence would convince you that you're wrong? If we found a genetic marker that correlated perfectly with diagnosis rates regardless of cultural awareness, would that kill the looping hypothesis?
  **Follow-up:** *If she says "No, because...":* "At what point does positing a looping effect become unfalsifiable? If every counter-evidence can be explained as 'the loop hid the truth,' are we still doing science?"

  ### Tips for the Interview:
  *   **The "Rationalist" Vibe:** Your listeners will love it if you gently push back when she uses jargon like "ontological" or "phenomenology" without a concrete example. The follow-ups above are designed to force concreteness.
  *   **The MPD Question:** This is your strongest card. Philosophers often build theories that explain everything *ex post facto*. Pressing on *prediction* (Question 5 & 6) is the best way to test the rigor of her model.
  *   **Hacking's Ghost:** Since Hacking is the godfather here, treat his name with respect, but use his own framework to trap her. If Hacking said X, and she says Y, make her explain the divergence explicitly (Question 1).

  Good luck with the pod! 40 listeners is the perfect size for high-signal, low-noise conversation.
