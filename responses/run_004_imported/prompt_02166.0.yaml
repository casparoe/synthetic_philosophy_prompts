      *   *Physicist Angle:* Use examples relevant to a physicist (Newtonian mechanics, Bohr's atom, maybe String Theory as a modern parallel since they mentioned "fashionable but untestable proposals").
      *   *String Theory:* This is a great touchstone. Popper would likely say "not science" (initially). Lakatos would say "wait and see if it becomes progressive." This highlights the loss of the sharp line.

  6.  **Final Polish:**
