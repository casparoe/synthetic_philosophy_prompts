      *   **The Comparison (Demarcation):**
          *   Popper: Logical, instantaneous, binary.
          *   Lakatos: Historical, temporal, gradual.
      *   **The Argument/Verdict:**
          *   Why Lakatos fails the "sharp line" test.
          *   The problem of hindsight (we know Newton was progressive *after* the fact).
          *   The problem of "degenerating" programmes sometimes returning (Laudan's critique).
          *   Conclusion: Lakatos describes scientific *growth*, not scientific *status*.
      *   **Tone:** Respectful, peer-to-peer (physicist to philosopher-interlocutor), rigorous but accessible.

  5.  **Refining the Argument (Self-Correction during drafting):**
