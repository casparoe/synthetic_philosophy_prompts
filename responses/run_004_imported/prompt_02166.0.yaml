      *   **Popper's Naive Falsificationism:** Briefly recap. The logical asymmetry. The Duhem-Quine problem (why it fails for a practicing physicist).
      *   **Lakatos's MSRP (The Mechanics):**
          *   Explain Hard Core/Protective Belt (analogy to planetary orbits or particle physics might resonate).
          *   Explain Heuristics (Negative = taboo, Positive = roadmap).
