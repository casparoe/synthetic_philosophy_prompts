      *   **User Persona:** Retired physicist (40 years experience). Treats Popper's falsifiability as a former "professional creed." Now reading philosophy of science seriously (specifically Lakatos).
      *   **Task:** Compare Popper's falsification with Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Specific Concepts to Address:** Hard core, protective belt, negative/positive heuristics, progressive/degenerating problem shifts.
