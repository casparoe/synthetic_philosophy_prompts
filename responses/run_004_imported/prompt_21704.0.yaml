prompt: |-
  okay so for my philosophy elective (its basically ToK) we had to pick a "notoriously hard" primary source to annotate and my teacher recommended Wittgenstein's Philosophical Investigations bc apparently its famous for being confusing lol. i picked the diary/sensation bit (its section 258) since it sounded interesting but ive read it like 5 times now and the ending still doesnt click for me. heres the passage:

  "Let us imagine the following case. I want to keep a diary about the recurrence of a certain sensation. To this end I associate it with the sign "S" and write this sign in a calendar for every day on which I have the sensation.—I will remark first of all that a definition of the sign cannot be formulated.—But still I can give myself a kind of ostensive definition.—How? Can I point to the sensation? Not in the ordinary sense. But I speak, or write the sign down, and at the same time I concentrate my attention on the sensation—and so, as it were, point to it inwardly.—But what is this ceremony for? for that is all it seems to be! A definition surely serves to establish the meaning of a sign.—Well, that is done precisely by the concentration of my attention; for in this way I impress on myself the connexion between the sign and the sensation.—But "I impress it on myself" can only mean: this process brings it about that I remember the connexion right in the future. But in the present case I have no criterion of correctness. One would like to say: whatever is going to seem right to me is right. And that only means that here we can't talk about 'right'."

  i get the first part, like you cant really "define" S just by pointing at a feeling inside your head. but the last two sentences confuse me so much. "whatever seems right to me IS right" sounds like it should mean the diary guy's totally fine, he's always right about his own sensation, but then Wittgenstein says that means we cant even use the word "right" here at all anymore, which feels like the opposite conclusion?? and a bit later he does this whole comparison of checking one memory against another memory to buying multiple copies of the same newspaper to see if a story's true, which i think is supposed to be making the same point but fancier. can someone walk me through the actual logic connecting "always seems right" to "no such thing as right," and explain what the newspaper thing is adding that the diary example didnt already show?
