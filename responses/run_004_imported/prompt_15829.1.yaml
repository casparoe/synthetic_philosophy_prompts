answer: |-
  This is a fantastic question. You have correctly identified the pivot point in the contemporary literature on Buck-Passing Accounts (BPA). Your friend is reacting to the stakes (this threatens the *reductive* ambition of the theory), but you are right to suspect there is a specific argumentative structure you need to grasp, not just a "vibe."

  The paper you are remembering is indeed **Rabinowicz and Rønnow-Rasmussen's "The Strike of the Demon" (2004)**. They proposed the Object-Given/State-Given distinction to solve the original WKR problem. However, shortly after (notably in papers by **Danielsson & Olson, 2007**, and others), philosophers realized this distinction creates a "New WKR" problem.

  Here is the walkthrough of the argument your professor is referencing, broken down into your three requests.

  ---

  ### 1. The Case: Object-Given Reasons that are still the "Wrong Kind"

  To see why the Object-Given/State-Given distinction fails, we need a case where the reason is clearly grounded in the **object**, but intuitively remains the **Wrong Kind of Reason (WKR)** for value.

  **The Case: Admiring the Evil Demon**
  Imagine an evil demon who is incredibly powerful. He threatens to torture you unless you **admire** him.
  *   **The Attitude:** Admiration.
  *   **The Object:** The Demon.
  *   **The Reason:** The demon has the property of *being able and willing to torture you if you do not admire him*.

  **Why this is Object-Given (OGR):**
  In the original "Saucer of Mud" case, the reason to desire the mud was grounded in the *consequences of having the desire* (you get saved). That is a **State-Given Reason** (reasons grounded in the benefits of holding the attitude).

  In the Demon case, the reason is grounded in a property of the **Demon himself** (his coercive power and his conditional threat). The reason is not "Admiring is good for you"; the reason is "The Demon is threatening." Since the reason stems from a property of the object of the attitude, it classifies as an **Object-Given Reason**.

  **Why this is still the Wrong Kind (WKR):**
  Intuitively, the demon is not **admirable**. Coercion and threats do not make someone worthy of admiration; they make them worthy of fear or compliance. Even though you have a compelling reason to admire him (to avoid torture), and even though that reason comes from his properties, it does not make him *good* (admirable).

  ### 2. Why the Distinction Doesn't Line Up

  The Buck-Passing theorist hoped for a clean mapping:
  *   **Right Kind of Reasons (RKR)** = **Object-Given Reasons** (Properties of the thing)
  *   **Wrong Kind of Reasons (WKR)** = **State-Given Reasons** (Benefits of the attitude)

  The Demon case breaks this mapping. It shows that **some Object-Given Reasons are still Wrong Kind Reasons.**

  The problem is that "Object-Given" is too broad. An object has thousands of properties.
  *   Property A: The demon is cruel. (Object-Given)
  *   Property B: The demon is threatening. (Object-Given)
  *   Property C: The demon is skilled. (Object-Given)

  Property C might give a Right Kind reason to admire him. Property B gives a Wrong Kind reason to admire him (even though it compels the attitude). Property A might give a Right Kind reason to *condemn* him.

  Simply saying "Look at the object's properties" doesn't tell us which properties count toward **value** and which properties count toward **prudence** or **coercion**. The Object/State distinction filters out the *consequences of the attitude*, but it fails to filter out *irrelevant properties of the object*.

  ### 3. The Circularity Worry (Why this is harder to patch)

  This is the crux of your seminar discussion. In the original "Mud" case, we could patch the theory by saying "Ignore State-Given reasons." That didn't seem circular; we could define "State-Given" independently of value (i.e., "reasons grounded in the consequences of holding the mental state").

  But how do we patch the "Demon" case? We need to filter out the "Threatening" property of the demon while keeping the "Skilled" property. How do we distinguish them?

  **The Obvious Fix:**
  We must say that for something to be good, it must have properties that provide **relevant** object-given reasons. Or, to use the seminar's terminology: properties that make the attitude **fitting** or **appropriate**.

  **The Circularity:**
  1.  **BPA Goal:** Analyze **Value** (Goodness) in terms of **Reasons**.
      *   *Formula:* $X$ is Good $\iff$ $X$ has properties that give us RKR to favor $X$.
  2.  **The Problem:** We can't define RKR just as "Object-Given" (because of the Demon case).
  3.  **The Fix:** We define RKR as "Reasons that make the attitude **fitting**."
  4.  **The Trap:** What does "fitting" mean?
      *   If "fitting" just means "supported by reasons," we are back to square one (because the demon gives reasons).
      *   To exclude the demon, "fitting" must mean "merited by the **value** of the object."
      *   But if we define the *Reasons* in terms of *Value/Fittingness*, our analysis of *Value* becomes:
      *   *$X$ is Good $\iff$ $X$ has properties that give reasons... which are reasons that track the Goodness of $X$.*

  **Why this wrecks the Reductive Project:**
  Scanlon's original Buck-Passing account was **reductive**. It wanted to explain the obscure normative concept ("Good") in terms of a clearer normative concept ("Reasons").
  *   If you have to appeal to "fittingness" or "merit" to filter the reasons, and "fittingness" is just a synonym for "appropriate response to value," you haven't analyzed value. You've presupposed it.
  *   You are effectively saying: "Something is good if it has properties that give reasons to favor it, *provided those reasons are the ones you have when the thing is good*."

  ### Summary for your Exam/Paper

  Your friend thinks this "wrecks the project" because it destroys **Reductive Buck-Passing**. You cannot reduce Value to Reasons if you need to use Value (via "fittingness") to identify the relevant Reasons.

  However, the project isn't *totally* dead; it just changes shape. This argument motivates the shift from **Reductive BPA** to **Non-Reductive Fitting-Attitude Analysis**.
  *   **Reductive BPA:** Value = Reasons. (Killed by the New WKR).
  *   **Non-Reductive FA:** Value = Fittingness. (We take "Fitting" as primitive).

  In the Non-Reductive view, we admit we can't analyze "fitting" in terms of "reasons" without circularity. Instead, we say "Good" and "Fitting" are mutually illuminating but primitive normative notions. The "Wrong Kind of Reasons" problem then becomes a tool to show why we cannot be reductionists about value, rather than a reason to abandon the connection between value and attitudes entirely.

  **The Argument Chain:**
  1.  **BPA:** Good = Properties giving Reasons for Attitudes.
  2.  **WKR 1 (Mud):** Some reasons (threats) don't imply Goodness.
  3.  **Fix 1:** Restrict to Object-Given Reasons.
  4.  **WKR 2 (Demon):** Some Object-Given reasons (coercive properties) still don't imply Goodness.
  5.  **Fix 2:** Restrict to Reasons that make the attitude *Fitting*.
  6.  **Circularity:** "Fitting" implies "Value."
  7.  **Conclusion:** You cannot analyze Value solely in terms of Reasons; you must treat the normative link (Fittingness) as primitive.
