prompt: |-
  So in my metaethics seminar we've been going through fitting-attitude / buck-passing theories of value -- the Scanlon-ish idea that for something to be good just is for it to have properties that give reasons to favor it -- and this week we got to the wrong kind of reasons problem. I get the classic case fine: a demon threatens to torture you unless you come to desire some worthless saucer of mud, which obviously doesn't make the mud good, it just gives you a reason to want to want it (I think this is from a Rabinowicz and Rønnow-Rasmussen paper, "the strike of the demon" or something like that? not 100% sure I'm remembering the title right).

  What actually threw me is when my professor said the natural fix -- just restrict buck-passing to reasons that are "object-given" (grounded in the object's own properties) rather than "state-given" (grounded in facts about what having the attitude itself produces) -- doesn't actually solve the problem, because apparently you can construct cases where the reason is grounded in a genuine property of the object and still intuitively counts as the wrong kind of reason. A friend in my class thinks this basically wrecks the whole fitting-attitude project, but I feel like I'm missing the actual argument rather than just the vibe. Could you walk me through: (1) what a case like that would even look like, (2) why its supposed to show that the object-given/state-given split doesn't cleanly line up with the right-kind/wrong-kind split, and (3) why this makes the problem harder to patch than the original demon case -- i.e. why the obvious next move of just saying we need the RIGHT kind of object-given properties seems to sneak back in the very notion of value/fittingness that buck-passing was supposed to explain without circularity? We're apparently using this to motivate why some people just take "fitting" or "meriting" as primitive instead of analyzing it further, and I'd like to get the actual argument instead of just memorizing that conclusion for the exam.
