answer: |-
  This is one of the coolest "aha!" moments in game theory. You are absolutely right: **Iterated Elimination of Dominated Strategies (IEDS)** is much more powerful if you allow players to compare a pure strategy against a *probability mixture* of other strategies.

  In technical terms, we say a strategy is **strictly dominated** if there exists *any* other strategy (pure OR mixed) that yields a higher expected payoff against every possible move the opponent makes.

  Here is a 3x2 matrix designed specifically to get stuck with pure strategies but unlock completely once you use a mixed strategy comparison.

  ### The Game Matrix
  **Row Player** chooses T, M, or B.
  **Column Player** chooses L or R.
  Payoffs are listed as **(Row, Column)**.

  | | **Left (L)** | **Right (R)** |
  | :--- | :---: | :---: |
  | **Top (T)** | 0, 2 | 4, 0 |
  | **Middle (M)** | 4, 2 | 0, 0 |
  | **Bottom (B)** | 1, 0 | 1, 5 |

  ---

  ### Step 1: Try Pure IEDS (We get stuck)
  Let's try to solve this using only the method you learned in class (comparing pure rows against pure rows).

  **Look at Row's Payoffs:**
  *   **Is T dominated?** No. Against R, T gets 4 (which is better than M's 0 and B's 1).
  *   **Is M dominated?** No. Against L, M gets 4 (which is better than T's 0 and B's 1).
  *   **Is B dominated?** No.
      *   Against L, B gets 1 (worse than M's 4, but better than T's 0).
      *   Against R, B gets 1 (worse than T's 4, but better than M's 0).
      *   *Result:* B is never the *best* response, but it is never the *worst* compared to a single specific row. It's a "safe" middle ground.

  **Look at Column's Payoffs:**
  *   **Is L dominated?** No. Against B, L gets 0 (worse than R's 5).
  *   **Is R dominated?** No. Against T or M, R gets 0 (worse than L's 2).

  **Status:** **STOP.** Using standard pure-strategy elimination, not a single cell can be crossed out. The game is unsolvable via IEDS.

  ---

  ### Step 2: The Mixed Strategy Domination
  Now, let's look at Row again. Imagine Row decides **not** to play B, but instead flips a coin to decide between T and M (a 50/50 mix).

  Let's calculate the **Expected Payoff** of this "50% T + 50% M" mix against Column's options:

  1.  **If Column plays Left:**
      *   T pays 0. M pays 4.
      *   Mix Payoff = $(0.5 \times 0) + (0.5 \times 4) = \mathbf{2}$.
      *   Compare to Strategy B: B pays **1**.
      *   **2 > 1**, so the mix beats B.

  2.  **If Column plays Right:**
      *   T pays 4. M pays 0.
      *   Mix Payoff = $(0.5 \times 4) + (0.5 \times 0) = \mathbf{2}$.
      *   Compare to Strategy B: B pays **1**.
      *   **2 > 1**, so the mix beats B.

  **The Logic:** Strategy B is "consistent but mediocre" (it guarantees 1). Strategies T and M are "risky but high reward" (0 or 4). By mixing T and M, Row **diversifies the risk**. They cancel out each other's weaknesses. The mix guarantees an average of 2, which is strictly better than the guaranteed 1 from B.

  **Conclusion:** Even though no *single* row beats B, the **mixture of T and M dominates B**. A rational Row player will never play B.

  **Action:** Cross out Row **B**.

  ---

  ### Step 3: Finish Solving with Pure IEDS
  Now that B is gone, the game has changed. Row will only play T or M. Column knows this.

  **New Matrix (B is removed):**

  | | **Left (L)** | **Right (R)** |
  | :--- | :---: | :---: |
  | **Top (T)** | 0, 2 | 4, 0 |
  | **Middle (M)** | 4, 2 | 0, 0 |

  **Look at Column's Payoffs now:**
  *   If Row plays T: L gives 2, R gives 0. (L is better)
  *   If Row plays M: L gives 2, R gives 0. (L is better)
  *   **Dominance Found!** For Column, **R is now strictly dominated by L**. (Remember, R was only good when Row played B, but we know Row won't do that).

  **Action:** Cross out Column **R**.

  **New Matrix (B and R removed):**

  | | **Left (L)** |
  | :--- | :---: |
  | **Top (T)** | 0, 2 |
  | **Middle (M)** | 4, 2 |

  **Look at Row's Payoffs now:**
  *   Column is definitely playing L.
  *   T gives 0. M gives 4.
  *   **Dominance Found!** **T is dominated by M**.

  **Action:** Cross out Row **T**.

  ### Final Solution
  The only surviving strategy profile is **(Middle, Left)**.

  ### Why this messes with people's heads
  The intuition gap usually happens here: *"If T doesn't beat B, and M doesn't beat B, how can T+M beat B?"*

  Think of it like investing:
  *   **Strategy B** is like keeping cash under your mattress. You get a low return (1), but no risk.
  *   **Strategy T** is like investing in Tech Stocks. High return (4) or crash (0).
  *   **Strategy M** is like investing in Energy Stocks. High return (4) or crash (0).

  If you look at Tech Stocks alone, they seem risky compared to cash (because of the 0). If you look at Energy Stocks alone, they also seem risky.
  But if you buy **half Tech and half Energy**, the sectors balance out. You smooth out the volatility. Your *average* return becomes higher than the cash under the mattress, with the same level of safety.

  In game theory, rationality implies you should take that "mix" opportunity. Therefore, playing the pure "cash" strategy (B) is irrational, even if no single stock (T or M) beats it on its own.

  ### One Important Note
  Don't confuse this with **Mixed Strategy Nash Equilibrium**.
  *   **Mixed Strategy NE:** "I will randomize my moves to keep the opponent indifferent."
  *   **Mixed Strategy Dominance (this example):** "I will use a randomization calculation purely as a measuring stick to prove this one specific pure move is trash."

  In this example, Row doesn't actually *have* to play the 50/50 mix in the end (they end up playing pure M). They just use the mix as a logical tool to eliminate B.
