answer: |-
  This is one of the sharpest fights in the history of Indian epistemology, and your friend's dismissal of *Sabda* (testimony) is exactly the kind of reductionism the Nyaya masters spent centuries dismantling. The Buddhist logicians (Dignaga and Dharmakirti) are brilliant, but on this specific point, their model of the mind is too lean. It tries to fit the rich, social reality of language into the solitary box of logical deduction.

  Here is the case for the Nyaya position: **Testimony (*Sabda*) is a distinct, irreducible means of knowledge (*Pramana*), and attempting to collapse it into Inference (*Anumana*) destroys the very mechanism of how language generates understanding.**

  ### 1. The Causal Mechanism: *Vyapti* vs. *Sanketa*

  Your friend's argument rests on the idea that all knowledge generation follows the same causal structure. For the Buddhists, Inference (*Anumana*) works because of *Vyapti*—an invariable, natural connection between a sign (*Hetu*) and what it signifies (*Sadhya*). Smoke is naturally connected to fire. Where there is smoke (under the right conditions), there *must* be fire. This is an ontological link in the world.

  Nyaya argues that language does not work this way. The connection between a word (*Sabda*) and its meaning (*Artha*) is not natural; it is **conventional (*Sanketa*)**.

  There is no "smoke-fire" style necessary connection between the sound "cow" and the animal with horns and a tail. If there were, everyone would speak the same language naturally, and babies would understand Sanskrit or English without teaching. The link is established by human agreement (or, for Nyaya theists, by God's initial stipulation).

  **The Argument:** If *Sabda* were just *Anumana*, the "sign" (the word) would need a natural, invariable connection to the "object" (the meaning). It doesn't. It has a *stipulated* connection. Therefore, the cognitive process that unpacks a stipulation cannot be the same process that unpacks a natural law.
  *   **Inference** relies on remembering a universal law ("Smoke is always with fire").
  *   **Testimony** relies on remembering a convention ("We agreed 'cow' refers to that animal").

  To say these are the same is to confuse a law of physics with a rule of chess. Both move pieces, but the *source* of the move's validity is fundamentally different.

  ### 2. The Phenomenology of Understanding: Immediacy vs. Deduction

  Let's look at what actually happens in your mind. A trusted friend runs up to you and says, "There is a tiger on the path."

  **The Buddhist Model:**
  1.  I hear the sound.
  2.  I infer: "This person is reliable."
  3.  I infer: "Reliable people speak the truth."
  4.  I conclude: "There is a tiger on the path."

  **The Nyaya Model:**
  1.  I hear the sound.
  2.  I understand the sentence meaning.
  3.  I know there is a tiger on the path.

  Nyaya asks: **Where is the gap?** In your actual experience, do you perform that syllogism? Do you pause to validate your friend's epistemic credentials before the fear hits you? No. The knowledge of the tiger arises *immediately* from the understanding of the sentence.

  If testimony were inference, there would be a temporal gap for the reasoning to occur. But linguistic understanding is instantaneous for a competent listener. Nyaya argues that the *Karana* (instrumental cause) of the knowledge in inference is the perception of the sign + memory of *Vyapti*. The *Karana* in testimony is the *understanding of the sentence meaning itself*. Since the causes are different, the effects (the specific knowings) must be classified differently.

  ### 3. The "Reliability" Trap

  Your friend's strongest point is the "Reliability Inference": *Believing someone is just inferring from their general reliability.* Nyaya has a devastating counter to this, often centered on the concept of **default validity (*Svatah Pramanya*)**.

  Nyaya argues that cognition is valid by default unless defeated by a specific contradiction. When you hear a sentence, you accept it as true *unless* you have a reason not to. You don't need to positively prove the speaker is reliable to understand them.

  **Consider the Child Argument:**
  A toddler hears their mother say, "Don't touch the stove." The child understands the command and the danger. Has the toddler performed an inference on the mother's epistemic reliability? Has the toddler established a universal major premise about maternal truth-telling? Obviously not. The child lacks the logical capacity for *Anumana* regarding reliability, yet *Sabda* functions perfectly. If *Sabda* required the inference of reliability, children could never learn language or facts from elders. They learn *because* testimony is a direct channel, not a deduced one.

  **Consider the Stranger Argument:**
  You ask a stranger on the street, "Where is the station?" They say, "Two blocks left." You believe them. Did you infer their reliability? You know nothing about them. You accepted the testimony *in the absence* of established reliability. If testimony were inference based on reliability, you would remain in ignorance until you investigated their track record. The fact that we gain knowledge from strangers proves the knowledge comes from the *words*, not an inference about the *speaker*.

  ### 4. The Syntax of Knowledge: *Akanksa* and *Yogyata*

  This is where the Nyaya technical conditions you mentioned become weapons, not just glossary terms. Inference is atomic; it works on single signs (Smoke). Testimony is structural; it works on sentences. Nyaya says a sentence requires four conditions to generate knowledge, which inference does not:

  1.  **Akanksa (Syntactic Expectancy):** Words expect other words. "Brings" demands a subject and an object. "Cow" alone generates a vague idea, but "Cow brings..." creates an expectancy. Inference doesn't have syntax. Smoke doesn't "expect" fire in a grammatical sense.
  2.  **Yogyata (Semantic Compatibility):** The words must make sense together. "Water the plants with fire" fails *Yogyata*. You understand the words, but the sentence yields no knowledge because the meanings are incompatible. Inference doesn't fail this way; smoke either is present or it isn't.
  3.  **Asatti (Contiguity):** The words must be spoken close together in time. If I say "Cow" today and "Runs" next week, you get no knowledge. Inference doesn't care about the temporal gap between seeing smoke and remembering fire.
  4.  **Tatparya (Intention):** You must grasp the speaker's intent (metaphor vs. literal).

  **The Knockout:** If *Sabda* were just *Anumana*, why does language require syntax (*Akanksa*) and semantic compatibility (*Yogyata*)?
  If I infer fire from smoke, I don't need to check if "Smoke" and "Fire" are semantically compatible or grammatically contiguous. They just exist.
  The fact that linguistic knowledge *requires* these structural conditions proves it is a unique cognitive operation. You cannot reduce a symphony to a single note by claiming "it's all just sound waves." Similarly, you cannot reduce the structured, conditional mechanism of testimony to the singular mechanism of inference.

  ### 5. The "New Knowledge" Problem

  Finally, the most pragmatic Nyaya argument: **Inference is limited to what you can connect to what you already know. Testimony opens the door to the entirely unknown.**

  Inference requires a *Vyapti* (universal connection) that you have observed before. You can only infer fire from smoke if you have seen them together previously. You cannot infer something for which you have no prior observational link.

  Testimony, however, allows you to know things entirely beyond your perceptual or inferential reach.
  *   **Example:** "The capital of a country you have never visited."
  *   **Example:** "The specific ritual details of a sacrifice you have never seen."
  *   **Example (for Nyaya):** "The nature of Dharma or the afterlife."

  If *Sabda* were *Anumana*, you would need a prior invariable connection between "Speaker's Voice" and "Capital City Location." You don't have that. You have no natural link to infer the name of a distant city from a sound wave. The only reason you know it is because the *words themselves carry the meaning* by convention.

  If you reduce testimony to inference, you cripple human knowledge. You limit us only to what we can personally deduce from physical signs. Nyaya saves the possibility of learning anything new from another person. They argue that the Buddhist reduction makes social learning impossible, turning every conversation into a solitary logical puzzle where the listener must already possess the premises to validate the speaker.

  ### Summary of the Nyaya Defense

  To side with the Buddhists is to claim that language is just a code for logic. Nyaya argues language is a **social technology of knowledge transfer** that operates on different rules than individual deduction.

  1.  **Connection:** Inference uses natural necessity (*Vyapti*); Testimony uses convention (*Sanketa*).
  2.  **Process:** Inference is a deduction; Testimony is an immediate understanding of sentence meaning.
  3.  **Conditions:** Testimony requires syntax and semantic compatibility (*Akanksa, Yogyata*); Inference does not.
  4.  **Reliability:** We accept testimony *before* establishing reliability (children, strangers); inference requires established premises.
  5.  **Scope:** Testimony conveys the unknowable (distant, abstract); Inference is limited to the observable connections.

  The Buddhist wants to save ontological parsimony (fewer *pramanas*). The Nyaya philosopher saves **epistemic reality**. They argue that if you want to explain how humans actually know things, you cannot ignore the unique, irreducible power of being told. To say "testimony is just inference" is to explain away the very thing that makes civilization possible.
