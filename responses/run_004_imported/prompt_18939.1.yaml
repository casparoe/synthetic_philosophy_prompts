answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Program Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Scoring Rule Methodology for Q4 Selection

  ### Executive Summary

  After reviewing the proposal to switch from Brier Score to Log Score for our internal forecasting program, **I recommend we retain the Brier Score as the primary metric for personnel selection** (i.e., determining eligibility for the grantmaking advisory team).

  However, to address the theoretical concerns raised regarding epistemic rigor, **I recommend we simultaneously implement Log Score as a secondary, non-binding diagnostic metric** visible to forecasters on their dashboards. This hybrid approach preserves the stability required for fair personnel decisions while incorporating the informational benefits of Log scoring for training and calibration.

  This memo outlines the reasoning behind this recommendation, specifically addressing the trade-offs between theoretical purity and operational robustness, and clarifies the current status of epistemic utility theory.

  ### 1. The Core Conflict: Theoretical Purity vs. Operational Stability

  The proposal to switch to Log Score rests on two claims:
  1.  **Propriety & Locality:** Log Score is the only strictly proper scoring rule that is "local" (the score depends only on the probability assigned to the *actual* outcome, not the counterfactual).
  2.  **Epistemic Utility:** Log Score aligns best with "epistemic utility theory," treating accuracy as the fundamental good.

  The counter-argument (currently held by the Brier majority) is practical:
  1.  **Variance & Ruin:** Log Score imposes infinite (or near-infinite) penalties for confident errors. In a small-sample environment (weekly questions), a single "freak" resolution can eliminate a consistently strong forecaster.
  2.  **Incentive Distortion:** High variance in scoring may select for risk-averse forecasters or discourage participation, rather than identifying the best judgment.

  ### 2. Is Epistemic Utility Theory "Settled"?

  One proponent of the switch cited epistemic utility theory as if it dictates Log Score as the unique solution. **It does not.**

  While there is a strong consensus that scoring rules should be *strictly proper* (incentivizing truthful reporting), the field is not settled on which proper rule best captures "epistemic value."
  *   **The Log Argument:** Proponents (e.g., Fallis, Leitgeb) argue that *locality* is a necessary axiom for epistemic utility. If you care only about the truth, the probability you assigned to the *false* outcome shouldn't matter once the truth is known. Log Score satisfies this.
  *   **The Brier Argument:** Other axiomatizations (e.g., Joyce 1998; Pettigrew 2016) show that Brier Score is also defensible under accuracy-dominance arguments, particularly when one values *calibration* across the whole probability distribution, not just the realized outcome.

  Claiming Log Score is the *only* theoretically valid option is an overstatement. It is the only *local* proper rule, but locality itself is a contested axiom in applied forecasting. We are not violating settled science by keeping Brier.

  ### 3. Why Brier is Superior for *Selection*

  Our program is not merely a research experiment; it is a hiring pipeline for high-stakes grantmaking advice. This context dictates the scoring rule, not just abstract theory.

  **A. The Sample Size Problem**
  We operate on weekly questions. Over a quarter, a forecaster may only resolve 10–15 questions.
  *   **Log Score:** Highly sensitive to outliers. If a forecaster assigns 95% to an event and it fails, the penalty is severe. In a small-N environment, this creates high variance. We risk filtering out excellent judges who had one bad luck draw, rather than filtering out poor judges.
  *   **Brier Score:** Bounded (0 to 1). It penalizes overconfidence, but gracefully. It allows a forecaster to recover from a single error over the course of a quarter. For personnel decisions, **stability is a feature, not a bug.**

  **B. The "Ruin" Risk**
  Log Score theoretically approaches negative infinity as probability approaches 0% on a true event. Even with practical caps, the penalty structure is steep.
  *   **Impact:** This encourages forecasters to avoid making bold calls, even when they have genuine insight. They may "hedge" toward 50% to protect their score.
  *   **Grantmaking Context:** We want advisors who can identify high-confidence opportunities. However, we also need advisors who understand that being wrong occasionally is part of the process. A scoring rule that treats one confident error as "career-ending" for the quarter models a risk profile that is unhealthy for our grantmaking culture.

  **C. Intuitiveness and Feedback**
  Brier Score is essentially Mean Squared Error. It is easier for staff to intuitively grasp ("I was off by 20%") compared to logarithmic bits of information. For a program aimed at improving organizational calibration, interpretability drives engagement.

  ### 4. Why We Should Still Adopt Log Score (for Diagnostics)

  The Log Score proponents are correct on one crucial point: **Log Score is a better measure of information gain.**

  If a forecaster moves a probability from 50% to 90% and is right, Log Score rewards this significantly more than Brier does. Brier can encourage "sandbagging" (staying near the mean). To ensure we are not discouraging sharp insight:
  *   **Recommendation:** Display Log Score on user dashboards alongside Brier.
  *   **Usage:** Use Log Score trends during coaching sessions. If a forecaster has a great Brier score but a poor Log Score, they may be well-calibrated but overly timid. This helps us identify talent for the advisory team without tying their compensation/role eligibility to the high-variance metric.

  ### 5. Final Recommendation

  1.  **Selection Metric:** Retain **Brier Score** as the primary determinant for Q4 advisory team eligibility. This ensures the process is robust to noise and perceived as fair by staff.
  2.  **Development Metric:** Implement **Log Score** on the forecasting dashboard immediately. Frame this to the team as "Advanced Analytics" to help them gauge the informativeness of their predictions.
  3.  **Communication:** Explicitly address the "Epistemic Utility" debate in the next all-hands. Acknowledge the theoretical strength of Log Score but clarify that for *personnel decisions* with *small sample sizes*, robustness takes precedence over theoretical locality.

  **Decision:** This path respects the theoretical rigor of the Log proponents without exposing the organization to the operational risks of high-variance personnel selection. It signals that we take accuracy seriously, but we also take fairness and stability seriously.

  ### Next Steps
  *   Approve this hybrid model by Tuesday.
  *   Engineering to add Log Score column to dashboards (read-only) by next sprint.
  *   Draft comms to staff explaining the "why" behind the dual-metric system to preempt confusion.

  ***

  **Attachments:**
  *   *Comparative Variance Analysis: Log vs. Brier on N=15 Simulations*
  *   *Summary of Axiomatic Justifications for Proper Scoring Rules (Joyce vs. Leitgeb)*
