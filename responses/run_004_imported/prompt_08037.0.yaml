answer: |-
  You have hit on one of the most fascinating and contentious tensions in moral philosophy. You are describing G.E. Moore's *Principia Ethica* (1903), specifically his doctrine of **Ideal Utilitarianism**.

  Your summary is accurate: Moore argues that "good" is a simple, indefinable property (like "yellow") that we grasp through intuition. He claims the things that possess the most of this "goodness" are indeed **aesthetic appreciation** and **personal affection**.

  If we take Moore seriously, the implications are radical, but they also expose the weaknesses in his system. Here is a breakdown of the three big questions you raised.

  ### 1. The Coral Reef: Does beauty matter without an observer?
  **Moore's Answer:** Yes.
  **The Implication:** You would have a moral duty to preserve the reef, even if no human or sentient being ever sees it.

  For Moore, beauty is an **intrinsic good**. It adds value to the universe simply by existing. If you destroy the reef, you are diminishing the total amount of "good" in the universe, regardless of whether anyone feels sad about it.

  **The Counter-Argument:**
  Most modern philosophers and ethicists reject this specific claim. The prevailing view (often called *sentientism* or *anthropocentrism*) is that value requires a **valuer**. A sunset is not beautiful in a vacuum; "beauty" is a relationship between an object and a conscious mind experiencing it.
  *   **If Moore is right:** Environmentalism is about protecting the *object* itself.
  *   **If Moore is wrong:** Environmentalism is about protecting the *experience* of the object (for humans, animals, or future generations).

  **Practical Takeaway:** If you feel a pang of grief for a destroyed reef that no one saw, Moore validates that feeling as objective moral truth. If you think that feeling is projection, Moore is mistaken.

  ### 2. The Desert Island Lovers vs. The Solitary Scientist
  **Moore's Answer:** The lovers are likely "better," provided the scientist's cure doesn't lead to *more* love and beauty later.
  **The Implication:** Private happiness is the engine of value; public duty is just the maintenance crew.

  This is where Moore's **Ideal Utilitarianism** gets tricky. He is still a utilitarian, meaning he cares about the *consequences* of actions.
  *   **The Lovers:** They are generating the *highest intrinsic goods* directly (affection and aesthetic enjoyment of their island).
  *   **The Scientist:** Curing a disease is not intrinsically good in Moore's system. It is **instrumentally** good. It is only good because it allows *other people* to go on to experience love and beauty.

  So, in a strict Moorean calculation:
  *   If the scientist cures a disease but remains lonely, unappreciative of art, and the people he saves live miserable, loveless lives, **the lovers on the island are producing more "good."**
  *   If the scientist cures a disease and those saved people go on to form loving families and appreciate art, **the scientist wins**, because he unlocked more potential for the "highest goods."

  **The Cultural Clash:**
  This challenges the "Protestant Work Ethic" or Kantian view that duty/sacrifice is good in itself. Moore says sacrifice is only good if it buys more love/beauty elsewhere. If you sacrifice your life for a cause that results in a bleak, loveless society, you have wasted your moral capital.

  ### 3. Profound Truth or Dressed-Up Preference?
  This is the million-dollar question. There are two ways to look at this:

  **Argument for "Profound Truth":**
  Moore was pushing back against the cold, mathematical utilitarianism of his time (which suggested pleasure was the only good) and the rigid duty-based ethics of the Victorians.
  *   He correctly identified that a world of "happy pigs" (pure pleasure) seems worse than a world of humans struggling with art and love.
  *   He validated the intuition that **relationships matter more than productivity.** In an age of burnout and metrics, Moore's hierarchy feels incredibly human.

  **Argument for "Dressed-Up Preference":**
  Moore's method was **Intuitionism**. He essentially said, "I intuit that beauty is good, and if you don't, your intuition is broken."
  *   **Class Bias:** Moore was part of the **Bloomsbury Group** (along with Virginia Woolf and John Maynard Keynes). They were wealthy, educated British elites who didn't *need* to worry about survival. It is easy to say "aesthetic appreciation" is the highest good when you aren't starving. A parent working three jobs might say "feeding my child" is the highest good, not "viewing a sunset."
  *   **The "Two Planets" Flaw:** Many philosophers argue Moore's thought experiment is incoherent. If no consciousness exists to witness the beautiful planet, in what sense is it "beautiful"? Beauty might be a secondary quality (like sound) that requires an ear to hear it.

  ### The Synthesis: How to use this?
  You don't have to accept Moore's metaphysics (the magic "good" property) to accept his hierarchy.

  1.  **Re-evaluate "Productivity":** Moore gives you philosophical permission to stop judging your life by "usefulness." If you spend a day deeply connecting with a friend, you have arguably done more "moral work" than spending that day answering emails, even if the emails helped the company.
  2.  **The "Means vs. Ends" Check:** Use Moore as a diagnostic tool. When you feel pressured to do something "dutiful," ask: *Is this duty preserving the conditions for love and beauty, or is it destroying them?* If a job cures diseases but destroys your capacity to love or appreciate life, Moore would say you are losing the plot.
  3.  **Environmental Humility:** Even if Moore is wrong about the "unobserved reef," his point reminds us that nature has value beyond its **utility** to us. It's not just a lumber yard; it's a source of the "good."

  **Verdict:** Moore is likely wrong that beauty exists without a mind to perceive it. But he is likely **right** that personal affection and aesthetic experience are the *ends* of human life, while duty and utility are merely the *means*.

  If you treat Moore not as a physicist describing the universe, but as a poet describing what makes life worth living, his philosophy holds up beautifully.
