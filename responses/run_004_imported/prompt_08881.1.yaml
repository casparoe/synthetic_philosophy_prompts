      *   *Compatibilist Defense:* Compatibilism redefines "responsibility" to make it compatible with determinism. Strawson argues this isn't "ultimate" responsibility. So, they are talking past each other.
      *   *Verdict:* Chrysippus relocates the question. He changes the definition of responsibility to avoid the regress. He escapes the *logical* regress by denying the premise that ultimate origination is required, but he does not escape the *metaphysical* intuition that drives Strawson (that we aren't the ultimate authors of our selves).

