  5.  **Final Polish:** Check tone. Ensure it sounds like a colleague discussing high-level theory. Organize with clear headings matching the user's three questions. (Proceed to generate output).

  6.  *(Final check of the prompt's specific constraints)*: The user asked for help thinking through it carefully. They want to know if they should commit to the analogy. I should give a nuanced "Yes, but..." answer.

      *   *Key Insight to add:* The "Reflection Principle" is often framed as synchronic (credence now conditional on credence later). This makes it look more like PP (synchronic conditionalization). But the *motivation* is diachronic. I should mention this structural similarity helps the analogy.
      *   *Key Insight on Admissibility:* Lewis defined admissibility partly *in terms of* the Principal Principle (evidence is admissible if it doesn't affect credence beyond chance). This is *also* circular/implicit. So the user's worry about RP being uniquely fragile is slightly misplaced; PP has the same structural vulnerability. This is a crucial point to make.

