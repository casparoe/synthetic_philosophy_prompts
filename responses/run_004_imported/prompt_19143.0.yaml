          *   *Standard View:* PP (or NP) trumps RP in matters of objective chance because PP defines the concept of chance. RP governs belief revision. If they clash, it usually means the "future self" condition in RP isn't met (e.g., the future self has "inadmissible" info relative to the present chance concept).
          *   *Nuance:* Some (like Briggs) argue RP is the more fundamental norm, and PP is derived from it + a theory of chance.

      *   **Synthesis & Recommendations for the Seminar:**
          *   Don't present them as identical. Present them as "Expert Principles."
          *   Highlight the direction of fit: PP (Mind $\to$ World), RP (Time 1 $\to$ Time 2).
          *   Use the "Admissibility vs. Rationality" distinction to drive the seminar discussion.
          *   Suggest reading: Briggs (2009) "The Two Principal Principles", Petrie (1996), or Elga (2010).

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction on RP:* I need to be careful not to say RP is *always* a theorem. It's a theorem *if* you assume you will conditionalize. But van Fraassen presents it as a constraint on rationality that *motivates* conditionalization. I should clarify this dialectic.
