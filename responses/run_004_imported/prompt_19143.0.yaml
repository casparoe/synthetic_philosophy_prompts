answer: |-
  This is an excellent pedagogical pairing, and your instincts about the friction points are spot-on. The analogy between the Principal Principle (PP) and the Reflection Principle (RP) is a staple of the literature (championed by folks like Rachael Briggs and Adam Elga), precisely because it illuminates the structure of *expert deference*. However, treating them as mere instances of a single schema without highlighting the structural fissures can lead students to misunderstand the metaphysical commitments of PP or the diachronic constraints of RP.

  Here is a breakdown addressing your three specific concerns, designed to help you calibrate the lecture notes.

  ### 1. Are they the same underlying norm?

  **Verdict:** They are **structural analogues**, but they rely on **different normative sources**.

  *   **The Structural Parallel:** You are correct that both are "Expert Principles." Lewis explicitly frames chance as an *expert* function. If $C$ is your credence function and $E$ is the expert function, both principles say: $C(A \mid E(A)=x) = x$.
      *   For PP, the expert is **Chance** (external, metaphysical).
      *   For RP, the expert is **Future Self** (internal, epistemic).
  *   **The Divergence:**
      *   **PP is Metaphysical/Externalist:** PP tells you how your mind ought to align with the world. It presupposes the existence of a "chance" variable that is distinct from your credence. The normativity comes from the idea that chance *is* the guide to truth.
      *   **RP is Epistemic/Internalist:** RP tells you how your time-slices ought to align with each other. It does not presuppose an external variable; it presupposes a continuity of rational agency. The normativity comes from the idea that you shouldn't be able to predict your own irrationality (or that you should treat your future self as an epistemic peer).

  **Pedagogical Tip:** Frame them as sharing a *logic of deference* but differing in the *ontology of the expert*. This allows you to keep the analogy without conflating the metaphysics of chance with the psychology of belief revision.

  ### 2. Is Reflection harder to defend than the Principal Principle?

  You worry that RP's escape clause ("defer unless you shouldn't") is more circular than PP's admissibility clause. This is a sophisticated worry, but the reality is nuanced: **PP is arguably just as circular, but in a different direction.**

  #### A. The Circularity of Admissibility (PP)
  You suggest admissibility can be characterized without presupposing the verdicts of PP. Lewis would disagree. Lewis famously admitted he could not define admissibility independently of the Principal Principle. His working definition was roughly: *Evidence is admissible if it affects credence only by affecting credence about chance.*
  *   **The Problem:** This defines admissibility *in terms of* the very principle it is meant to save. If a student asks, "Why is this evidence inadmissible?" the answer is "Because it violates PP." If they ask "Why does it violate PP?" the answer is "Because it's inadmissible."
  *   **Comparison:** RP's trust condition ("defer unless you expect irrationality/forgetting") suffers from the same structural issue. You define the conditions of deference by the conditions under which deference is rational.
  *   **Conclusion:** RP is not *more* fragile here; both principles rely on a primitive notion (Admissibility vs. Rationality/Trust) that resists non-circular analysis.

  #### B. Justificatory Burdens
  *   **PP is harder to justify Metaphysically:** The "Bug" (Humean Supervenience) is a genuine threat to the coherence of PP. If chances supervene on the Humean mosaic, future facts determine present chances. But future facts are paradigmatically inadmissible. Lewis had to retreat to the **New Principle (NP)** to handle this. RP has no metaphysical "bug" of this sort; it doesn't care about supervenience bases.
  *   **RP is harder to justify Diachronically:** RP is vulnerable to cases of **self-locating uncertainty** and **forgetting**.
      *   *Example:* In the Sleeping Beauty case (or Arntzenius's "Shangri-La"), an agent knows they will lose information or undergo self-locating shifts. In these cases, satisfying RP leads to diachronic incoherence (or Dutch Books).
      *   *The Fix:* RP holds only if you expect to update by Conditionalization and retain all evidence. PP has no such requirement (you can satisfy PP while forgetting everything, provided you still know the chance).
      *   **Result:** RP is formally more secure *within* a strict Bayesian framework (it can be derived from Conditionalization + No Forgetting), whereas PP is an *additional* bridge principle not guaranteed by the probability calculus. However, RP is *psychologically* more fragile because it breaks whenever the agent anticipates cognitive degradation.

  ### 3. The Conflict Scenario: Divergence between Chance and Future Self

  This is the crux of your third question. Suppose you know the chance is $x$, but you expect your future rational self to believe $y$ (where $y \neq x$), perhaps because your future self has access to "undermining" information (facts about the future mosaic that fix the chance).

  **Does Reflection take over?**

  **No.** In standard formal epistemology, **PP (or the New Principle) trumps RP** in cases of conflict regarding objective chance. Here is why:

  1.  **The Definition of Chance:** PP is partly constitutive of what we *mean* by "objective chance." If a quantity does not command credence (conditional on admissibility), it isn't chance. RP is a norm of rationality, but it is not constitutive of chance.
  2.  **The "Inadmissible" Future Self:** If your future self diverges from the current chance because they know the future outcome (the Humean mosaic), your future self possesses **inadmissible evidence** relative to the present time.
      *   PP says: Ignore inadmissible evidence when setting credence to match chance.
      *   RP says: Defer to future self.
      *   **Resolution:** The "Trust" condition in RP is usually cashed out as "defer to your future self *qua* rational updater with *more evidence*." But if that evidence is inadmissible *by the lights of the chance theory*, then your future self is not a valid expert *on chance*. They are an expert on *truth*, but not on *chance*.
  3.  **The New Principle (NP) Solution:** Lewis's New Principle handles the undermining case explicitly. NP says:
      $$ C(A \mid T \& H) = P(A \mid T) $$
      Where $T$ is the theory of chance and $H$ is the history. If your future self knows the full mosaic, they know $T$ and $H$ perfectly. If you currently know $T$ and $H$ (to the extent possible), you should match the NP value. If your future self diverges from the NP value, your future self is irrational (by the lights of the theory of chance).

  **Can both operate?**
  Yes, but hierarchically.
  *   **RP governs belief revision:** It tells you how to move from $C_t$ to $C_{t'}$.
  *   **PP governs the target:** It tells you what $C_t$ should be given the world.
  *   If you expect your future self to violate PP (e.g., they will believe in a gambler's fallacy), RP tells you *not* to defer to them. The "Trust" proviso absorbs the conflict. You say: "I satisfy RP by *not* deferring to my future self, precisely because I expect them to violate PP."

  ### Recommendations for the Seminar

  1.  **Commit to the Analogy, but Qualify It:** Use the "Expert Principle" schema to introduce both. It is rhetorically effective and mathematically illuminating.
  2.  **Highlight the "Escape Clause" Symmetry:** Challenge the students' intuition (and perhaps your own initial worry) that Admissibility is cleaner than Trust. Show them Lewis's struggle to define admissibility without circularity. This levels the playing field: both principles rest on a primitive normative notion.
  3.  **Use the Conflict to Define "Chance":** When discussing the divergence scenario, use it to show that PP is more fundamental to the *concept* of chance. If RP and PP clash, we usually say the agent's future self is mistaken about chance, not that chance is mistaken. This reinforces the externalist nature of PP.
  4.  **Suggested Reading:**
      *   **Rachael Briggs, "The Two Principal Principles" (2009):** She argues explicitly that PP and RP are distinct and that PP cannot be reduced to RP. This is essential for your "pressure test."
      *   **David Lewis, "A Subjectivist's Guide to Objective Chance" (1980):** Specifically the postscript on the New Principle.
      *   **Bas van Fraassen, "Belief and the Will" (1984):** For the original motivation of RP.

  **Summary for your notes:** The analogy is robust enough for a seminar session provided you treat it as a comparison of *structure* rather than *source*. RP is internally more coherent (derivable from Bayesianism) but externally more fragile (breaks with forgetting). PP is externally more robust (handles forgetting) but metaphysically more costly (requires the New Principle to handle Humean Supervenience). The "escape clauses" are functionally equivalent in their circularity, which is a great discussion point for graduate students.
