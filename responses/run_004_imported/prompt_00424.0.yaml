prompt: |-
  I am currently teaching a graduate seminar on the epistemic challenges facing consequentialism, and this week we worked through Hilary Greaves's treatment of the cluelessness problem, in particular her distinction between "simple" cases of cluelessness (where the unforeseeable effects of the options under comparison are symmetric in some relevant sense, so that expected-value reasoning restricted to salient, foreseeable consequences remains legitimate) and "complex" cases (where the unforeseeable effects are asymmetric but not tractably estimable, as with the long-run ripple effects of donating to a economic-development charity versus buying oneself a sandwich). Several students in the seminar suspected that this distinction is really a matter of degree dressed up as a matter of kind: either the apparatus Greaves uses to rescue simple cases from the cluelessness worry could, on reflection, be redeployed for the supposedly complex ones, or else the trouble she diagnoses in complex cases infects the simple ones too, once you look closely at how "symmetry" of unforeseeable effects is actually established.

  Please write an argument, addressed to an audience already familiar with Greaves's paper "Cluelessness," for the position that the simple/complex distinction cannot be sustained as a principled one -- that is, that there is no stable epistemic or metaphysical criterion sorting cases into one category rather than the other without either trivializing the distinction or collapsing it entirely. Engage directly with the specific examples Greaves uses to motivate the distinction (e.g., choosing a red versus a blue sweater to wear to a party, and donating to a charity aimed at economic development), explain precisely where the alleged symmetry-breaking criterion fails to do the work she needs it to do, consider at least one serious response available to Greaves, and conclude by defending the objection against that response.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Analyze the Request:**
      *   **Topic:** Hilary Greaves's distinction between "simple" and "complex" cluelessness in consequentialism.
      *   **Task:** Write an argument *against* the sustainability of this distinction (i.e., argue it's a distinction of degree, not kind, or collapses entirely).
      *   **Audience:** Graduate seminar participants familiar with Greaves's paper "Cluelessness" (2016).
      *   **Key Requirements:**
          *   Engage with specific examples (red vs. blue sweater, economic development charity vs. sandwich).
          *   Explain where the symmetry-breaking criterion fails.
          *   Consider at least one serious response available to Greaves.
          *   Defend the objection against that response.
          *   Tone: Academic, rigorous, philosophical.

  2.  **Deconstruct Greaves's Position (Mental Recap):**
      *   *The Problem:* Consequentialism requires maximizing expected value. But we are "clueless" about long-term consequences (chaos theory, butterfly effects). If we can't estimate probabilities/values of long-term effects, EV is undefined.
      *   *The Solution (Simple Cluelessness):* In some cases (Red vs. Blue Sweater), unforeseeable effects are *symmetric*. We can assume the expected value of the unknowable tail is equal for both options. Therefore, we decide based on the foreseeable "head."
      *   *The Problem (Complex Cluelessness):* In other cases (Charity vs. Sandwich), unforeseeable effects are *asymmetric*. We have reason to think one option leads to better/worse long-term effects (e.g., population growth, economic shifts), but we can't quantify them. Symmetry assumption fails. EV remains undefined.
      *   *The Criterion:* The distinction rests on whether we have *reason to believe* the unforeseeable effects are symmetric (Simple) or asymmetric (Complex).

  3.  **Develop the Counter-Argument (The "Collapse" Thesis):**
      *   *Core Claim:* The epistemic basis for asserting symmetry in "simple" cases is just as shaky as the basis for asserting asymmetry in "complex" cases. Both rely on inductive extrapolation from limited data.
      *   *The Sweater Case:* Why think the ripple effects of wearing red vs. blue are symmetric? Maybe wearing red makes you slightly more confident, leading to a conversation that changes history. Maybe blue makes you blend in. Greaves says we have *no reason* to think they differ.
      *   *The Charity Case:* Greaves says we *do* have reason to think they differ (e.g., saving lives affects population size, which affects total welfare).
      *   *The Attack:* The move from "I can't see a difference" to "There is no difference" (Simple) is the same epistemic move as "I can see a structural difference" to "There is a value difference" (Complex). Both rely on modeling the world. If our models are too coarse for the Charity case, why are they fine-grained enough for the Sweater case?
      *   *Chaos Theory:* If the world is chaotic (sensitive to initial conditions), *any* difference creates divergence. The "symmetry" assumption requires that the *value* of those divergent paths averages out to the same mean. But without knowing the distribution of value in the possibility space, we can't justify that mean.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** State the thesis clearly. The simple/complex distinction relies on an epistemic asymmetry that doesn't hold up under scrutiny. It's a continuum of uncertainty, not a binary of symmetry vs. asymmetry.
      *   **Reconstructing Greaves:** Briefly summarize the distinction to show understanding. Focus on the "symmetry of unforeseeable effects" as the dividing line.
      *   **The Attack on Symmetry (The Sweater):** Why is the sweater case actually complex?
          *   Greaves relies on a "principle of indifference" over the unknowable.
          *   But chaos theory suggests small differences amplify.
          *   To claim symmetry, we need to know the *value distribution* of the future states. We don't.
          *   Example: Wearing red might trigger a specific social interaction. Is the EV of that interaction neutral? We don't know.
      *   **The Attack on Asymmetry (The Charity):** Why is the distinction unstable?
          *   Greaves claims we have *reason* to think charity has asymmetric effects (population, etc.).
          *   But if we lack the data to quantify the charity's long-term value, we likely lack the data to quantify the *direction* reliably too.
          *   More importantly: If we can't rule out asymmetry in the sweater case, the "Simple" category empties out.
      *   **The Crucial Failure Point:** The criterion is "Do we have reason to believe effects are asymmetric?"
          *   In Simple cases: We claim "No reason."
          *   In Complex cases: We claim "Yes reason."
          *   *Objection:* "No reason" is not evidence of symmetry. It's an argument from ignorance. In high-stakes chaotic systems, absence of evidence for asymmetry $\neq$ evidence of symmetry.
      *   **Greaves's Potential Response:** She might appeal to *structural* differences. In the sweater case, the causal mechanisms are qualitatively similar (social signaling). In the charity case, they are qualitatively different (existence vs. non-existence of people). She might argue we have positive theoretical reasons for asymmetry in charity (population ethics) but not in sweaters.
      *   **Rebuttal to Response:**
          *   Even if mechanisms differ, the *valuation* of the long-term tail remains opaque.
          *   If the "tail" swamps the "head" (which Greaves admits is possible), then even a tiny credence in asymmetry in the sweater case destroys the EV calculation.
          *   The "structural" difference doesn't solve the epistemic problem of assigning expected value to the tail. If we can't assign EV to the charity tail, why can we assign a *neutral* EV to the sweater tail? Both require integrating over a possibility space we can't map.
      *   **Conclusion:** The distinction collapses. We are either clueless everywhere (skeptical challenge stands) or we must accept rough estimates everywhere (undermining the specific "complex" worry). The distinction is pragmatic, not principled.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I use the specific examples? Yes (Sweater, Charity/Sandwich).
      *   *Check:* Is the tone appropriate? Needs to be respectful but firm, suitable for a grad seminar.
      *   *Nuance:* Greaves distinguishes between "weak" and "strong" cluelessness. I need to make sure I'm targeting the Simple/Complex distinction specifically regarding the *symmetry* claim.
      *   *Key Philosophical Point:* The Principle of Indifference. Greaves uses it for Simple cases. The objection is that applying PoI to chaotic long-term consequences is unjustified.
      *   *Refining the "Response":* A strong Greaves response would be about *relevance*. We have specific theories (e.g., total utilitarianism) that imply asymmetry in population cases. We have no such theories for sweater colors.
      *   *Refining the "Rebuttal":* Even if we have theories implying asymmetry in principle, if we can't *measure* the magnitude, the EV is still undefined. But the stronger point is: why does the absence of a theory imply symmetry? It implies ignorance. Ignorance shouldn't license a zero-difference assumption in high-variance contexts.

  6.  **Final Polish:** Check citations (implicitly), ensure flow, and sharpen the concluding punch. (Ensure I explicitly mention that the distinction is supposed to be principled, not pragmatic).

  *(Self-Correction Note)*: Make sure to emphasize that Greaves admits complex cluelessness is a serious problem. My goal is to show simple cluelessness is actually complex cluelessness in disguise.

  7.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  **To:** Participants, Graduate Seminar on Consequentialism
  **From:** [Your Name/Instructor]
  **Subject:** The Instability of the Simple/Complex Distinction in Greaves's "Cluelessness"

  In our recent discussion of Hilary Greaves's "Cluelessness," we examined her proposed solution to the epistemic crisis facing act consequentialism. As you recall, Greaves attempts to compartmentalize the problem of unforeseeable consequences by distinguishing between **simple cluelessness** and **complex cluelessness**. In simple cases (e.g., choosing between a red or blue sweater), she argues we are justified in assuming the unforeseeable long-term effects are symmetric in expected value, allowing us to decide based on foreseeable short-term goods. In complex cases (e.g., donating to an economic development charity versus buying a sandwich), she argues we have positive reason to believe the unforeseeable effects are asymmetric (due to population changes, economic shifts, etc.), yet lack the data to quantify them, thereby rendering expected value (EV) calculations undefined.

  The consensus among several of you is that this distinction is untenable—that it is a difference of degree masquerading as a difference of kind. I write to endorse and formalize that suspicion. The argument below contends that the epistemic criterion Greaves uses to sort cases cannot sustain the weight placed upon it. Specifically, the move from "we have no reason to believe effects differ" (Simple) to "the effects are symmetric" is epistemically illicit in a chaotic world. Consequently, the simple/complex distinction collapses: either the symmetry assumption is unjustified everywhere (making all cases complex), or it is permissible everywhere (making all cases simple).

  ### The Symmetry Criterion and the Sweater Case

  Greaves's defense of the "simple" category rests on a specific epistemic maneuver. In the red vs. blue sweater case, she acknowledges that wearing one color rather than the other will causally ripple outward, altering conversations, movements, and potentially history. However, she claims we have **no reason to believe** that the expected value of the red-sweater ripple effects differs from the blue-sweater ripple effects. Lacking evidence of asymmetry, we are licensed to treat the unforeseeable "tail" of the consequence function as equal for both options, canceling it out of the EV calculation.

  The failure of this distinction lies precisely in the justification for that cancellation. Greaves treats the absence of evidence for asymmetry as evidence of symmetry. In a linear, deterministic system, this might hold. But as Greaves herself notes, the worry stems from chaos theory: small differences in initial conditions amplify over time. If the social and physical world is sensitive to initial conditions, the choice of sweater *does* select for divergent causal paths.

  To claim these paths have equal *expected value*, we must assume that the distribution of value across the possibility space of futures triggered by the red sweater is identical to the distribution triggered by the blue sweater. But we have no access to this distribution. We do not know if the "red sweater" timeline leads to a future with slightly more conflict or slightly more cooperation. To assign them equal EV is to apply a Principle of Indifference over a space we cannot map. If the variance in long-term value is high (which the chaos worry suggests), then assuming the means are identical without empirical or theoretical warrant is not a neutral default; it is a substantive, unjustified metaphysical claim.

  ### The Collapse into Complex Cluelessness

  If the symmetry assumption in the sweater case is unjustified, the "simple" category empties out. Consider the criteria Greaves uses to identify **complex cluelessness** in the charity vs. sandwich case. She argues that here, we *do* have reason to believe effects are asymmetric. Donating to economic development might lower mortality rates, which affects population size, which (depending on one's population ethics) drastically alters total value.

  However, notice the structural parallel. In both cases, we are comparing two options where the foreseeable "head" of the consequences is known, and the unforeseeable "tail" is unknown.
  1.  **Sweater:** We know the aesthetic preference (head); we don't know the historical ripple (tail). Greaves says: Assume tail symmetry.
  2.  **Charity:** We know the immediate aid (head); we don't know the demographic/economic ripple (tail). Greaves says: Do not assume tail symmetry.

  The distinction relies on the claim that in the charity case, we have *positive theoretical reasons* to suspect asymmetry (e.g., population ethics), whereas in the sweater case, we do not. But this is a distinction of degree regarding the *salience* of the asymmetry, not a principled difference in the *epistemic access* to the tail.

  If the "tail" swamps the "head"—a premise Greaves accepts as the source of the cluelessness worry—then even a minuscule credence that the sweater choice has asymmetric long-term effects should dominate the decision. Why? Because if the long-term effects are chaotic and high-variance, the expected value of the tail is not necessarily zero (or equal); it is undefined. If I cannot rule out that wearing red inadvertently triggers a causal chain leading to a catastrophe (or a utopia) with probability *p*, and I cannot estimate the value of that outcome, my EV is undefined.

  Greaves attempts to block this by saying we have *no reason* to think the sweater affects catastrophe probabilities differently than the blue one. But this returns us to the argument from ignorance. In the charity case, we also lack precise probabilities. We merely have a qualitative story about population. If a qualitative story about population is enough to break symmetry in the charity case, why isn't a qualitative story about social signaling enough to break symmetry in the sweater case? Perhaps wearing red signals confidence, leading to a promotion, leading to more resources for one's children, altering the genetic/cultural pool. If we cannot quantify this, it is complex cluelessness. If we can dismiss it as symmetric, why can't we dismiss the population effects of the charity as symmetric (e.g., perhaps the economic boom leads to stabilization that neutralizes population variance)?

  The criterion "Do we have a salient story for asymmetry?" is pragmatic, not principled. It depends on the current state of sociological or economic theory, not on the underlying metaphysics of value or causation.

  ### A Greavesian Response: Structural Relevance

  A sophisticated defender of Greaves might offer the following response. The distinction is not merely about having *a* story, but about having a *structurally relevant* story grounded in normative theory.

  In the charity case, the asymmetry is driven by **population ethics**. We know that saving lives changes *who* exists and *how many* exist. If one holds a Total View, the number of lives is a direct multiplier of value. This is a structural feature of the axiology, not just a causal speculation. In the sweater case, there is no corresponding axiological multiplier. The color of the sweater does not map onto a variable in our value function (like population size) that we know *ex ante* creates massive value variance. Therefore, we are licensed to treat the sweater case as symmetric because our value theory gives us no reason to think the variable "sweater color" correlates with high-variance value determinants, whereas "mortality rate" does.

  ### Rebuttal: The Opacity of the Value Function

  This response fails because it conflates *knowing the variables* with *knowing the function*. Even if we grant that population size is a variable in our value function (in the charity case) and sweater color is not (in the sweater case), the cluelessness problem arises from the **interaction** of these variables with the chaotic causal web.

  In the charity case, Greaves argues we can't calculate EV because we don't know how population changes interact with future welfare. But in the sweater case, we also don't know how sweater color interacts with future welfare *via* the causal web. The Greavesian response assumes that because "sweater color" isn't a direct argument in our value function, its indirect causal consequences must average out to symmetry. But this assumes a stability in the causal network that the cluelessness problem explicitly denies.

  If the world is chaotic, "sweater color" becomes a proxy for a vast array of downstream variables, some of which *are* in our value function (e.g., who meets whom, what ideas are propagated). To assert symmetry is to assert that the covariance between "sweater color" and "future value-determinants" is zero. We have no evidence for this. We merely have a lack of imagination regarding the causal pathways.

  Furthermore, if the "Structural Relevance" defense holds, it renders the distinction contingent on our current normative theories. If a future theory of aesthetics suggested that color choices aggregate to significant cultural value shifts, the sweater case would instantly become "complex." A principled distinction should not vanish based on a shift in normative speculation. The epistemic situation—the inability to trace long-term causal chains—remains identical in both cases.

  ### Conclusion

  The simple/complex distinction is designed to save consequentialism from paralysis by carving out a safe zone of "simple" decisions where EV reasoning remains viable. However, the boundary of this safe zone is drawn using an epistemic standard that cannot be met. The assertion of symmetry in simple cases relies on an unjustified Principle of Indifference over chaotic outcomes, while the assertion of asymmetry in complex cases relies on qualitative models that admit of the same quantification failures.

  If the inability to quantify long-term tails invalidates EV in the charity case, it must also invalidate the symmetry assumption in the sweater case, for both rely on mapping value over an unknowable possibility space. If, conversely, we are permitted to assume symmetry in the sweater case despite this ignorance, we should be permitted to do so in the charity case as well. There is no stable middle ground. Greaves's distinction, therefore, does not solve the cluelessness problem; it merely relocates the skepticism, leaving the consequentialist agent with no principled way to determine when they are truly "clueless" and when they are merely "uncertain."
