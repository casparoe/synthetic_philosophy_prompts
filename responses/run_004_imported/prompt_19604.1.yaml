answer: |-
  **Handout for Graduate Seminar: Leibniz in the Palace of Fates**
  **Topic:** Transworld Identity, Counterpart Theory, and the Leibnizian Prefiguration

  **1. The Student's Insight: More Than Anecdote**
  Your classmate is right to press the connection between Leibniz and David Lewis. It is not merely a historical curiosity that Leibniz's *Theodicy* features a "Palace of Fates" populated by distinct versions of Sextus Tarquinius, nor is it accidental that Leibniz tells Arnauld an Adam who did not sin would be a "different Adam." Structurally, Leibniz is committed to the thesis that **individuals are world-bound.**

  If we force Leibniz into the twentieth-century standoff, he cannot be a Kripkean. For Kripke and Plantinga, transworld identity is primitive or secured by a haecceity (a "thismess") that survives the alteration of accidental properties. For Leibniz, there is no bare particular underlying the properties. The individual *is* the collection of predicates contained in its complete concept. If you alter a predicate (e.g., "did not sin"), you alter the concept. If you alter the concept, you have a different individual.

  On this specific metaphysical point—the impossibility of one numerically identical substance existing in multiple possible worlds—**Leibniz stands with Lewis.**

  **2. The Driving Commitments: Complete Concepts and PII**
  Two Leibnizian doctrines do the heavy lifting here, pushing him toward Counterpart Theory and away from Transworld Identity:

  *   **The Doctrine of Complete Concepts:** For Leibniz, the concept of an individual substance contains *all* its predicates, past, present, and future. As he writes to Arnauld, "the individual concept of Adam contains once and for all everything that will ever happen to him." If we try to imagine "Adam in a world where he does not sin," we are not imagining *Adam* with a different property; we are imagining a *different concept*, and therefore a *different substance*. This mirrors Lewis's claim that objects are spatiotemporally confined; for Leibniz, they are *conceptually* confined to their maximal consistent set of predicates (their world).
  *   **The Identity of Indiscernibles (PII):** Leibniz holds that there cannot be two distinct individuals that share all the same properties. If we allow transworld identity (as Kripke does), we must admit that $x$ in $W_1$ and $x$ in $W_2$ are the same individual despite having different properties (e.g., sinning vs. not sinning). For Leibniz, properties are intrinsic to the substance. If the intrinsic properties differ, the substances differ. To say it is the "same" Adam would violate the PII, unless one posits a bare particular devoid of properties—which Leibniz rejects.

  **3. Where Leibniz Diverges from Lewis**
  However, identifying Leibniz as a "proto-Lewisian" requires serious qualification. If Leibniz were confronted with Lewis's *On the Plurality of Worlds*, he would reject the ontology while accepting the logic of individuation.

  *   **Concrete vs. Abstract:** Lewis is a modal realist: all possible worlds are concrete, actual, and existentially on par with ours. Leibniz is a modal idealist: only one world is actualized (concrete); the others exist only as ideas in the Divine Understanding. For Lewis, the "other Adams" are flesh and blood. For Leibniz, the "other Adams" are concepts in God's mind.
  *   **Similarity vs. Conceptual Containment:** Lewis's counterpart relation is based on qualitative similarity and is context-dependent (and potentially vague). Leibniz's relation is based on logical derivability. The "other Sextus" in the Palace of Fates is not just *similar* to our Sextus; he is a distinct logical variation of the concept "Sextus." Leibniz's counterpart relation is stricter and more formal than Lewis's.

  **4. The Kripkean Challenge and the Fatalism Worry**
  Kripke's primary objection to counterpart theory is that it fails to capture our intuitive modal claims. When we say "Nixon could have lost the election," we mean *Nixon himself*, not a counterpart. Kripke argues that Leibniz's view collapses into fatalism: if "sinning" is in Adam's concept, Adam *must* sin.

  Here, Leibniz's worry about **fatalism** (pressed by Arnauld) becomes the pivot point.
  *   **Kripke's Solution:** Maintain transworld identity and accept that properties can be contingent to the essence.
  *   **Leibniz's Solution:** Distinguish between *absolute necessity* and *hypothetical necessity*. Adam *must* sin in the sense that, *given* God chose this world, Adam sins. But it is not logically necessary that God choose this world.

  Leibniz would argue that Kripke's view makes properties extrinsic to the substance, violating the self-sufficiency of the monad. For Leibniz, a substance must have its own source of action. If "Adam" is the same individual across worlds with different properties, what grounds the difference? For Leibniz, the difference must be internal. Therefore, the individuals must be distinct. He would likely view Kripke's "stipulation" of transworld identity as philosophically shallow—a semantic trick that ignores the metaphysical grounding of truth in the nature of things.

  **5. Resisting the Dichotomy: Conceptual Counterpart Theory**
  Does Leibniz simply land on Lewis's side? Not quite. He offers a third option that dissolves the modern dichotomy between "concrete realism" (Lewis) and "abstract actualism" (Plantinga/Kripke).

  Leibniz's framework suggests a **Conceptual Counterpart Theory**:
  1.  **Individuation:** Like Lewis, he denies transworld identity. Individuals are world-bound.
  2.  **Ontology:** Like Plantinga, he treats non-actual worlds as abstract (ideas in God's mind).
  3.  **Modality:** Modality is not about "discovering" other concrete universes (Lewis) nor merely "stipulating" conditions for names (Kripke). It is about analyzing the compatibility of concepts (compossibility).

  **Conclusion for the Seminar**
  If forced to choose, Leibniz must side with **Lewis on the metaphysics of identity** (no individual exists in more than one world) but with **Plantinga on the ontology of worlds** (worlds are abstract maximal states of affairs).

  However, the most productive reading for your students is to see Leibniz as exposing the assumptions behind both modern camps. The Kripke–Plantinga picture assumes we can separate the "who" (haecceity) from the "what" (properties). Lewis assumes we can separate the "actual" from the "possible" only by indexicality. Leibniz rejects both separations. For him, the "who" *is* the "what" (Complete Concept), and the "possible" is real only as an object of intellect, not existence.

  Leibniz would likely tell your students that the debate between Lewis and Kripke rests on a shared error: the belief that we can talk about individuals independently of their complete concepts. In the Palace of Fates, every room contains a different person. To wish for a different fate is to wish to be a different soul.

  ***

  **Suggested Discussion Questions for Students:**
  1.  Does Leibniz's denial of transworld identity save the Identity of Indiscernibles, or does it merely relocate the problem to the level of concepts?
  2.  Kripke argues that counterpart theory makes modal claims "about me" false (since it's really about my counterpart). Does Leibniz's distinction between absolute and hypothetical necessity avoid this, or does he concede that *I* could not have done otherwise?
  3.  If possible worlds are ideas in God's mind (Leibniz) rather than concrete realities (Lewis), does the "isolation" of worlds remain strong enough to support a counterpart-theoretic view of individuation?
