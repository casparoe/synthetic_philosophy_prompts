prompt: |-
  Quick bit of context: I'm a backend/ML engineer at a small consumer-lending startup, and because I built the underwriting model I somehow got pulled onto our "Responsible AI Council" -- a very extra name for six people arguing over Zoom every other Thursday. The model outputs a probability-of-default number for every applicant, which drives pricing and approval decisions. The current version buckets applicants pretty coarsely (state, broad age band, credit tier), but our data science lead wants to ship a v2 that slices much finer -- zip code, income band, five-year age bracket, plus behavioral stuff like which of our other products someone has used. It backtests noticeably better, tighter calibration curves across the board, so on pure metrics it's an easy yes. Legal and the outside ethics consultant we bring in for these meetings are blocking it, and it's become a real fight.

  Here's the bit I'm stuck on: everyone keeps collapsing two different objections into one. Objection one is the familiar "this reconstructs race and neighborhood history through the back door" fair-lending worry, which I get fine. Objection two, which the consultant keeps trying to explain, is wierder: even if the finer slicing were completely clean of any protected-class proxy, there's apparently no principled reason that particular grouping is the "correct" one for pricing any given applicant -- you could equally well bucket the same guy by profession, or by his specific repayment history with us, or a dozen other reasonable partitions, and each hands back a different number for the same human being. We actually ran one test applicant through both versions: v1 priced him at roughly 4% probability of default, the new zip/income/behavior slicing put him at almost 8%, and when a teammate rebucketed him by profession and tenure instead he came out under 2%. Nobody on the data science side can answer "why this reference class and not another" with anything better than "it backtests well," and the consultant sent around a philosophy paper (something by a guy named Hájek, "The Reference Class Problem is Your Problem Too") that I read half of on the train and did not fully recover from.

  I have to send the council a short written recommendation before Thursday: basically whether v2 ships as-is, gets blocked, or ships with specific conditions, plus a timeframe, since launch is currently penciled in for three weeks out. Could you draft that memo for me? I need it to actually engage with objection two as its own real problem instead of folding it back into the bias conversation and calling it a day, and whatever it recommends, I want it to lay out the strongest version of the case for the option it's turning down, since half the room will read this looking for ammunition against whatever I land on. A short table of conditions at the end would be great if we go that route, but the reasoning that gets us there matters more than the formatting.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **Role:** Backend/ML Engineer at a small consumer-lending startup.
      *   **Task:** Draft a recommendation memo for the "Responsible AI Council" regarding a new underwriting model (v2).
      *   **Audience:** The Council (6 people on Zoom), including Data Science Lead (pro-v2), Legal (anti-v2), and Outside Ethics Consultant (anti-v2 on philosophical grounds).
      *   **Conflict:** v2 has better metrics (calibration, backtesting) but raises two objections:
          1.  *Fair Lending/Proxy Discrimination:* Fine-grained slicing (zip code, etc.) might proxy for protected classes (race, etc.).
          2.  *Reference Class Problem:* Even if "clean," why is *this* grouping the "correct" one? Different groupings yield vastly different probabilities for the same individual (4% vs. 8% vs. 2%). "Better backtesting" isn't a sufficient philosophical justification for individual fairness/accuracy.
      *   **Requirement:** Engage seriously with Objection 2 (Reference Class Problem) as distinct from Objection 1 (Bias). Steelman the opposing view. Provide a clear recommendation (Ship, Block, or Conditional). Include a table of conditions if conditional.
      *   **Tone:** Professional, technical but accessible, balanced, decisive but humble.
      *   **Deadline:** Before Thursday (meeting is every other Thursday). Launch is in 3 weeks.

  2.  **Deconstruct the Core Problem (The Reference Class Problem):**
      *   *What is it?* Probability is always relative to a class. An individual belongs to infinite classes. Which class determines *their* probability?
      *   *Why does it matter here?* If we charge someone based on an 8% risk because of their zip code, but they are actually a 2% risk because of their profession, are we treating them unfairly? Is the price "true"?
      *   *The DS Argument:* "Predictive power." The class that minimizes loss on holdout data is the "best" class.
      *   *The Ethics Argument:* Predictive power doesn't equal normative justification. Just because zip code predicts default doesn't mean it *should* determine price, especially if other valid classes contradict it.
      *   *The Legal Argument:* Regulatory compliance (ECOA, Fair Lending). Fine slicing increases disparate impact risk.

  3.  **Determine the Recommendation:**
      *   *Option A: Ship as-is.* Too risky. Ignores Legal and Ethics. Ignores the philosophical instability of the probability scores.
      *   *Option B: Block entirely.* Too conservative. v2 *is* better calibrated on aggregate. Stalling innovation hurts the business.
      *   *Option C: Conditional Ship (Phased/Constrained).* This is the engineering solution. Acknowledge the problem, mitigate risk, gather more evidence.
      *   *Decision:* Recommend a **Conditional Ship with Constraints & Monitoring**. This allows the business to capture value while addressing the risks. It respects the Ethics/Legal concerns without halting progress.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context:** Briefly recap v1 vs. v2.
      *   **Analysis of Objection 1 (Fair Lending/Proxy):** Acknowledge it. It's the standard regulatory risk. v2 increases surface area for disparate impact.
      *   **Analysis of Objection 2 (Reference Class):** This is the crucial part. I need to explain *why* the consultant is right without sounding like I'm abandoning ML.
          *   *Key point:* Probability is not an intrinsic property of the applicant; it's a property of the *model's grouping*.
          *   *Key point:* "Better backtesting" means better *aggregate* calibration, not necessarily better *individual* truth.
          *   *Steelman the DS side:* We need predictive power to stay solvent.
          *   *Steelman the Ethics side:* Individual fairness is compromised if the grouping is arbitrary.
      *   **Recommendation:** The "Conditional Ship."
          *   Limit the granularity (don't go full zip code yet).
          *   Adversarial testing (specifically for reference class instability).
          *   Human review for edge cases (where classes diverge wildly).
      *   **Conditions Table:** Clear, actionable items.
      *   **Timeline:** Adjust the 3-week launch to a phased approach.

  5.  **Refining the Argument on Objection 2:**
      *   I need to make sure I don't just say "bias." I need to talk about *instability*.
      *   Use the user's example: The 4% vs. 8% vs. 2% applicant.
      *   Explain that v2 claims the 8% is "truer" because it minimizes log-loss, but the Ethics Consultant argues that minimizing log-loss doesn't resolve the normative question of *which* similarities matter.
      *   Bridge the gap: We can't solve philosophy in 3 weeks, but we can measure *sensitivity*. If small changes in features cause huge swings in probability due to class switching, that's a stability risk.

  6.  **Review against Constraints:**
      *   *Engage Objection 2?* Yes, dedicated section.
      *   *Steelman opposing view?* Yes, acknowledge DS lead's metric-based argument is valid for solvency, acknowledge Ethics' argument is valid for fairness.
      *   *Table of conditions?* Yes.
      *   *Tone?* Engineering/Professional.

  7.  **Self-Correction/Polishing:**
      *   *Check:* Did I get too philosophical? *Fix:* Keep it grounded in risk and implementation.
      *   *Check:* Is the recommendation actionable? *Fix:* Ensure the conditions are specific (e.g., "stability testing," not just "think about it").
      *   *Check:* Did I mention Hájek? *Fix:* Briefly acknowledge the paper to show I read it, but pivot to practical application.
      *   *Check:* Is the distinction between Objection 1 and 2 clear? *Fix:* Use headers to separate "Disparate Impact" from "Reference Class Instability."

  8.  **Final Polish:** (Drafting the content based on the above thought process.) *Make sure to sound like an engineer talking to a council, not a philosopher talking to engineers.* Use terms like "variance," "calibration," "sensitivity analysis."

  **(Self-Correction during drafting):** I initially thought about suggesting a delay. But the prompt says launch is in 3 weeks. A hard block might be unpopular. A "Shadow Mode" or "Limited Rollout" is a better engineering compromise. It lets us test the reference class instability in production without full exposure. Let's go with a **Limited Rollout with Stability Guards**.

  Wait, looking closer at the prompt: "Ship as-is, gets blocked, or ships with specific conditions." I should stick to one of these frames. "Conditional Ship" fits best.

  Let's refine the "Reference Class" explanation. The core tension is: ML optimizes for *predictive accuracy within a chosen feature space*. Ethics asks *why this feature space?* The memo needs to say: "We accept the DS lead's premise that predictive accuracy is necessary for business viability, BUT we accept the Consultant's premise that accuracy does not resolve the normative ambiguity of individual pricing."

  Okay, ready to write.
answer: |-
  **TO:** Responsible AI Council
  **FROM:** [Your Name], Backend/ML Engineering
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Underwriting Model v2 Deployment

  ### Executive Summary

  After reviewing the performance metrics for Underwriting Model v2 and considering the objections raised by Legal and External Ethics Counsel, I recommend **shipping v2 with specific constraints and a phased rollout**, rather than a full immediate launch or a hard block.

  While v2 demonstrates superior aggregate calibration and predictive power, the concerns regarding Fair Lending (Objection 1) and the Reference Class Problem (Objection 2) represent distinct, material risks. Objection 1 is a regulatory compliance issue; Objection 2 is a stability and individual fairness issue. Addressing Objection 2 requires us to acknowledge that "better backtesting" does not inherently resolve the ambiguity of which applicant grouping is normatively "correct."

  This memo outlines the reasoning for a conditional approval, steelmanning the case against deployment, and proposes a set of engineering guardrails to mitigate risk while allowing the business to capture v2's efficiency gains.

  ### Context: v1 vs. v2

  *   **v1 (Current):** Coarse bucketing (State, Broad Age, Credit Tier). Stable, lower predictive power.
  *   **v2 (Proposed):** Fine-grained slicing (Zip Code, Income Band, 5-Year Age, Behavioral). Higher predictive power, tighter calibration curves.
  *   **The Conflict:** v2 improves our loss ratios but increases granularity to a point where individual pricing becomes sensitive to how we slice the data.

  ### Analysis of Objections

  To reach a decision, we must treat the two primary objections as separate vectors of risk.

  #### 1. Fair Lending & Proxy Discrimination (Legal/Compliance)
  This is the standard regulatory risk. By incorporating zip code and granular income data, v2 increases the surface area for disparate impact. Even if we remove protected classes explicitly, these features correlate strongly with race and historical redlining.
  *   **Risk:** Regulatory action, reputational damage, ECOA violations.
  *   **Status:** This is a solvable engineering problem via adversarial debiasing and disparate impact testing, though it requires ongoing monitoring.

  #### 2. The Reference Class Problem (Ethics/Stability)
  This is the more novel objection raised by our Ethics Consultant (referencing Hájek). The core argument is that probability is not an intrinsic property of an applicant; it is a property of the *group* to which we assign them.
  *   **The Issue:** As demonstrated in our test case, a single applicant received probability scores of 2%, 4%, and 8% depending on whether they were bucketed by Profession, v1 Coarse, or v2 Fine.
  *   **The Data Science Position:** The v2 grouping is "correct" because it minimizes log-loss on holdout data. It is the most *predictive* reference class.
  *   **The Ethics Position:** Predictive power is not normative justification. If we can construct multiple, equally reasonable reference classes (e.g., profession vs. zip code) that yield wildly different prices, charging the applicant based on the highest one (v2's 8%) may be individually unfair, even if it is statistically robust on aggregate.
  *   **Why this matters:** If our pricing swings wildly based on arbitrary feature engineering choices, we risk pricing customers out of the market based on model instability rather than actual risk. This undermines the "truth claim" of our probability scores.

  ### Steelmanning the Opposition

  To ensure the Council understands the weight of the objections, here is the strongest case for **blocking v2 entirely**:

  1.  **Normative Arbitrariness:** We cannot mathematically prove that "Zip Code + Income" is a morally superior way to group humans than "Profession + Tenure." If we cannot justify the grouping philosophically, we cannot justify the price differential it creates.
  2.  **Individual Unfairness:** A customer denied a loan or offered a high rate based on the 8% score might have been approved at the 2% score under a different valid grouping. Without a principled way to select the reference class, we are exposing customers to arbitrary variance.
  3.  **Compounded Liability:** Combining the Reference Class instability with the Fair Lending risk creates a "black box" where we cannot explain *why* a specific price was offered, only that it was statistically optimal for a specific slice. This is vulnerable to regulatory scrutiny.

  ### Recommendation: Conditional Ship with Stability Guards

  Blocking v2 entirely sacrifices genuine predictive improvement that could lower costs for low-risk borrowers. However, shipping as-is ignores the instability risk. I propose a **Phased Rollout with Reference Class Stability Testing.**

  We accept the Data Science lead's premise that predictive accuracy is necessary for solvency, but we accept the Ethics Consultant's premise that accuracy does not grant immunity from reference class ambiguity. We will treat reference class instability as a model performance metric, similar to drift or latency.

  ### Implementation Conditions

  If approved, v2 deployment is contingent on the following engineering and monitoring constraints:

  | Condition Category | Specific Requirement | Owner | Deadline |
  | :--- | :--- | :--- | :--- |
  | **Granularity Cap** | Disable zip-code level slicing for initial launch; roll up to Metro/County level to reduce reference class volatility. | ML Eng | Pre-Launch |
  | **Stability Testing** | Implement "Counterfactual Bucketing": For every 100th applicant, score them against 3 alternative valid reference classes (e.g., profession-based). Flag if variance > 1.5x. | Data Science | Pre-Launch |
  | **Human Review** | Any applicant where v2 probability deviates > 3% from v1 probability must trigger a manual underwriting review. | Ops | Launch + 4 Weeks |
  | **Fair Lending** | Run disparate impact analysis on the *output* of the stability test. Ensure high-variance applicants are not concentrated in protected groups. | Legal/DS | Monthly |
  | **Sunset Clause** | If > 5% of applicants trigger the "High Variance" flag for two consecutive weeks, v2 reverts to v1 logic automatically. | ML Eng | Ongoing |

  ### Timeline

  *   **Week 1:** Implement Granularity Cap and Stability Testing logic.
  *   **Week 2:** Shadow Mode deployment (score only, no decisions). Review variance reports.
  *   **Week 3:** Limited Live Rollout (5% of traffic) with Human Review guardrails.
  *   **Week 7:** Full review of Stability and Fair Lending metrics. Decision on full rollout.

  ### Conclusion

  The Reference Class Problem does not have a mathematical solution, but it has an engineering mitigation. By acknowledging that our probability scores are sensitive to how we slice the data, we can monitor that sensitivity rather than ignoring it. This approach allows us to ship the improved model while respecting the ethical concern that an applicant's price should not depend entirely on which valid lens we choose to view them through.

  I request Council approval to proceed with the **Conditional Ship** plan outlined above.
