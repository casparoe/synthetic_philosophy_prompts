      *   *Major Strategies:*
          1.  **Object-Given vs. State-Given (Traditional):** RKRs are about the object's properties; WKRs are about the state of having the attitude. (Critiqued heavily by Schroeder).
          2.  **The No-Reference/Recursion Constraint (Olson):** RKRs don't mention the attitude itself. (Often seen as too restrictive or circular).
          3.  **The Reason-for-Wanting/Bringing About View (Way):** WKRs are reasons to *cause* the attitude, not reasons *for* the attitude. (Very influential, currently dominant).
          4.  **The Teleological/Constitutive Aim View:** Attitudes have aims; RKRs align with the aim. (Hieronymi is relevant here, though she challenges the distinction itself in some contexts).
          5.  **Eliminativism/Revisionism (Hieronymi/Skipper):** Maybe the distinction is flawed or FA needs revision.
          6.  **The "Fittingness" Primitive View:** Just accept fittingness as normative and unanalyzable in terms of reasons.
          7.  **Publicity/Universalizability Constraints:** RKRs must be public/universal.

