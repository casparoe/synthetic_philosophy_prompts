answer: |-
  Your colleague is right, though your reading of the river-bed metaphor is a very common and understandable starting point. The "difference of degree" interpretation (often called the *epistemic* reading) is the natural instinct for anyone trained in analytic epistemology, where justification is typically modeled as a continuum of probability or evidential support.

  However, if you teach the "degree" reading as Wittgenstein's final word, you risk turning *On Certainty* into a banal claim about psychology ("we feel very sure about some things") rather than the radical grammatical intervention it is intended to be. Wittgenstein's target is G. E. Moore, and Moore's error was precisely to treat hinge propositions as empirical claims with a very high degree of justification. Wittgenstein's critique is that this invites skepticism rather than defeating it.

  Here is a detailed breakdown of why the "logical role" reading is superior, followed by specific strategies to make this vivid for your students.

  ### 1. Why the "Difference of Degree" Reading Fails

  If hinge propositions are merely empirical beliefs with maximal evidential support, three major Wittgensteinian insights are lost:

  **A. The Logic of Doubt (Grounds vs. Background)**
  For Wittgenstein, doubt is not a mental state of hesitation; it is a practice that requires **grounds**. To doubt a proposition meaningfully, I must be able to specify what would count as evidence against it, and I must hold other things constant to test it.
  *   **The Degree View:** Suggests I *could* doubt I have hands, but the evidence against it is just so overwhelming that I don't.
  *   **Wittgenstein's View:** If I try to doubt I have hands, I lose the framework required to gather evidence about *anything*. As he writes in §115: *"If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty."*
  *   **The Problem:** If hinges are just super-secure empirical beliefs, then skepticism can always ask, "But is it *logically possible* you are wrong?" If the answer is "Yes, just unlikely," skepticism wins. Wittgenstein wants to say: "No, in this language-game, this is not a move that is available."

  **B. The Category Mistake (Knowledge vs. Certainty)**
  Wittgenstein insists that hinge propositions are not items of **knowledge**. In §105, he notes that all testing and confirmation takes place in the neighborhood of a hypothesis, but the system itself is not tested.
  *   **The Degree View:** "I know I have hands" is a true sentence, just one I am 99.999% sure of.
  *   **Wittgenstein's View:** To say "I know..." implies the possibility of being wrong and the possession of evidence. But what evidence do you have for having hands? Looking at them? That presupposes your eyes work and that an external world exists. Digging up genealogy? That presupposes the earth existed in the past.
  *   **The Point:** Hinges are **groundless** (§166, §609). They are not supported by evidence; they are the *mechanism* by which we distinguish evidence from noise. To treat them as knowledge is to misunderstand their grammar.

  **C. The Moorean Trap**
  Moore held up his hands and said, "Here is one hand, here is another; therefore an external world exists." Wittgenstein argues this is nonsensical (§§23–24).
  *   If "Here is a hand" is an empirical premise, it needs justification.
  *   If it is a hinge, it cannot serve as a premise in an argument for the external world, because it *already presupposes* the external world.
  *   By treating it as a high-certainty empirical belief, Moore invites the skeptic to demand the evidence for that belief. Wittgenstein's solution is to remove the belief from the realm of evidential justification entirely.

  ### 2. Reconciling the River-Bed Metaphor (§§96–99)

  Your intuition about the river-bed is not wrong, but it needs a functional tweak. You read the rock/sand distinction as *ontological stability* (how hard it is to move). Wittgenstein intends it as *functional role* (how it relates to the water).

  *   **The Water:** The fluid language-games, the empirical inquiries, the specific claims we verify day-to-day.
  *   **The Bed:** The rules and certainties that channel the water.
  *   **The Shift:** Wittgenstein admits that what is rock today may be sand tomorrow (§98). Newtonian physics was once "rock" (constitutive of scientific inquiry); now it is "sand" (a theory subject to revision in light of relativity).
  *   **The Crucial Distinction:** Even if sand can become rock, **when it is rock, it is not water.** At any given moment, there is a functional distinction between the propositions we are testing (water) and the propositions we are using to test them (bed). The "degree" reading collapses this distinction by making everything water, just some of it very viscous water.

  ### 3. Pedagogical Strategies: Making the "Logical Role" Vivid

  Since asserting "it's a grammatical rule" sounds dogmatic to students, use analogies that separate *moves within a game* from *the rules of the game*.

  **Analogy 1: The Chessboard (Rules vs. Moves)**
  *   **Scenario:** Ask students if the proposition "Bishops move diagonally" is supported by evidence.
  *   **Discussion:** Did we observe a million bishops and inductively conclude they move diagonally? No. If someone moves a bishop straight, we don't say, "Oh, interesting empirical discovery." We say, "You aren't playing chess."
  *   **Application:** Hinges are like the rules of chess. "The earth has existed for a long time" is not a move *in* the language-game of history; it is part of the board setup that allows the game of history to be played. If you doubt the board, you aren't playing the game; you're staring at the pieces.

  **Analogy 2: The Map Grid**
  *   **Scenario:** Imagine a map with a coordinate grid. To locate a city (an empirical claim), you use the grid.
  *   **Discussion:** Can you use the map to prove the grid is accurate? No. Any measurement you take *uses* the grid. To question the grid, you need a different grid (a different system of hinges).
  *   **Application:** Hinges are the grid lines. They look like features on the map (they look like empirical propositions), but their job is to allow other features to be located.

  **Analogy 3: The "Why?" Game (Regress Argument)**
  *   **Activity:** Play the childhood game of "Why?" with a student until they hit a wall.
      *   *Teacher:* "Is there a table here?" *Student:* "Yes."
      *   *Teacher:* "How do you know?" *Student:* "I see it."
      *   *Teacher:* "How do you know your eyes work?" *Student:* "I've used them before."
      *   *Teacher:* "How do you know the past existed?" *Student:* "I have memories."
      *   *Teacher:* "How do you know memories aren't implanted five minutes ago?"
  *   **The Pivot:** At this point, the student will either get angry or say, "Well, I just *know*."
  *   **Wittgenstein's Point:** This isn't a psychological failure ("I can't find more evidence"). It is a logical terminus (§204: *"Giving grounds... comes to an end."*). The end is not an "unseen proposition" that is super-true; it is an **action** (§110: *"my life consists in my being content to accept many things"*). We stop doubting not because we are convinced, but because doubting here has no cash value.

  **Analogy 4: The Door and the Hinge (§341)**
  *   **Image:** A door needs a hinge to turn.
  *   **Discussion:** If the hinge moves as much as the door, the door doesn't open; the whole frame falls off.
  *   **Application:** "I have two hands" is the hinge. "I am typing on a keyboard" is the door. I can verify the typing (open/close the door). I cannot verify the hinge *using the door*. If the hinge moves (if I seriously doubt I have hands), the mechanism of verification collapses.

  ### 4. Suggested Seminar Exercise

  To drive this home, try this thought experiment with your seminar:

  **The Brain-in-a-Vat (BIV) Revision:**
  1.  Ask students: "If you were a BIV, would the proposition 'I have hands' be false?" (Most will say yes).
  2.  Ask: "If you were a BIV, would the proposition '2 + 2 = 4' be false?" (Most will say no).
  3.  Ask: "If you were a BIV, would the proposition 'There is an external world' be false?" (Yes).
  4.  **The Wittgensteinian Twist:** Ask, "If you are a BIV, does the word 'hand' *mean* the same thing?"
      *   If I am a BIV, my 'hand' experiences are caused by a computer. But in my language game, 'hand' refers to the thing I use to grab cups.
      *   Wittgenstein suggests that if the *whole* background changes (the hinges), the meaning of the words shifts.
      *   Therefore, asking "Am I a BIV?" is not an empirical question with a yes/no answer. It is an attempt to step outside the language game. If the answer were "Yes," our current language game (including the word 'hand') would cease to function. Thus, the proposition "I am not a BIV" functions as a hinge: it is the condition for the question making sense, not an answer to the question.

  ### Summary for Your Notes

  You should structure your lecture to acknowledge the allure of the "degree" reading (it fits our natural epistemic intuitions) but demonstrate why Wittgenstein rejects it:

  1.  **Moore's Mistake:** Treating hinges as knowledge claims invites the skeptic to ask for evidence.
  2.  **Functional Distinction:** Hinges are not "very certain beliefs"; they are the **scaffolding** (§211) that allows the concept of certainty to apply elsewhere.
  3.  **River-Bed Nuance:** The bed can shift over time (historical contingency), but at any moment $t$, the bed functions differently from the water (logical distinction).
  4.  **Action over Intellect:** Certainty is shown in what we *do* (e.g., not checking if we have hands before grabbing a cup), not in a high-confidence mental state.

  Your colleague is correct: treating hinges as the top of an evidential scale domesticates Wittgenstein into a standard foundationalist. His point is that the foundation is not a set of *true propositions*, but a set of *practices* that are exempt from the truth/falsehood game.
