      *   *Necessary A Posteriori:* Identity statements between rigid designators (Hesperus = Phosphorus) are necessary (true in all worlds) but known a posteriori (empirical discovery).
      *   *Causal-Historical Chain:* How reference is fixed and transmitted (baptism + passing the name along).

  4.  **Compare and Contrast (The "Gap Analysis"):**
