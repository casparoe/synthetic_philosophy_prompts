      *   *Difference 1: Modality.* Mill doesn't have possible worlds semantics. He talks about actual changes (river moves), not counterfactual scenarios (what if the river *had* moved?). Kripke's rigid designation is essentially a modal claim.
      *   *Difference 2: Identity Statements.* Mill doesn't discuss the logic of identity ($a=b$). He focuses on predication ($S$ is $P$). Kripke uses rigid designation to solve the puzzle of informative identity statements.
      *   *Difference 3: Reference Fixing.* Mill says names are attached, but doesn't explain *how* (causal chain). Kripke provides the mechanism (initial baptism + transmission).
      *   *Difference 4: Necessity.* Mill distinguishes between verbal and real propositions, but not necessary vs. contingent truth in the Kripkean metaphysical sense.

