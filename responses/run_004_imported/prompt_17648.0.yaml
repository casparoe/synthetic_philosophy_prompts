prompt: |-
  So I've spent the last couple weeks reporting a piece on this corner of experimental philosophy where researchers survey people about whether some guy "knows" the bank will be open Saturday, and they vary how much is riding on the answer — low-stakes version, he's pretty sure, no big deal either way; high-stakes version, same guy, same evidence, but now he'll bounce a huge check if he's wrong. Turns out people get way more reluctant to say he "knows" in the high-stakes version even though his evidence hasn't changed one bit, which is a genuinely interesting result. But when I called up two epistemologists to help me explain why, I got two totally different theories for the exact same finding. One kept saying this is about "contextualism" — that "know" works kind of like "flat" or "empty," a word whose truth conditions flex depending on the standards in play in the conversation. The other insisted no, this is "pragmatic encroachment" (he also used the phrase "subject-sensitive invariantism," which did not help), where the word itself doesn't budge, its the actual facts about whether the guy in the story knows that change, because of what's riding on it for him.

  I nodded through both calls like I understood, but if I'm honest I walked away unable to say what really distinguishes these two positions, or why you'd need two competing frameworks when they both seem to accommodate the exact same bank-case intuitions just fine. Could you actually get into the weeds on this for me — not the two-paragraph SEP-summary version, I've basically already read that — but something that lays out where the real theoretical daylight is between contextualism and pragmatic encroachment/SSI, and ideally sketches a case (real or invented) where the two views would actually cash out in different verdicts, rather than just being two competing vocabularies for redescribing the same bank story?
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a journalist/reporter who has been covering experimental philosophy (x-phi), specifically the "Bank Case" (Keith DeRose's famous thought experiment).
      *   **Problem:** They interviewed two epistemologists. One argued for *Contextualism*, the other for *Pragmatic Encroachment* (specifically *Subject-Sensitive Invariantism* or SSI). Both explain the data (people deny knowledge in high-stakes cases), but the user doesn't understand the *actual theoretical difference*. They feel like it's just two vocabularies for the same thing.
      *   **Goal:** The user wants a deep dive ("into the weeds"), not a superficial summary. They need to know where the "theoretical daylight" is. Crucially, they want a *divergence case*—a scenario where the two theories yield different verdicts, proving they aren't just synonyms.

  2.  **Deconstruct the Two Theories:**
      *   **The Data:** In Low Stakes, people say "He knows." In High Stakes, people say "He doesn't know." Evidence is identical.
      *   **Contextualism:** The meaning/truth conditions of the word "knows" shift depending on the *attributor's* context (the person saying "He knows").
          *   Low Stakes Context -> Low Standards -> "Knows" is true.
          *   High Stakes Context -> High Standards -> "Knows" is false.
          *   *Key:* The subject's actual epistemic position doesn't change. The *semantic bar* moves.
      *   **Pragmatic Encroachment (SSI):** The meaning of "knows" is fixed (Invariantism). However, whether someone *counts* as knowing depends on their practical situation (the *subject's* stakes).
          *   Low Stakes for Subject -> Easier to know.
          *   High Stakes for Subject -> Harder to know (requires more evidence).
          *   *Key:* The *epistemic status* of the subject changes based on practical factors. The semantic bar is fixed, but the subject's height relative to the bar changes.

  3.  **Identify the Core Distinction (The "Theoretical Daylight"):**
      *   *Who* drives the variation?
          *   Contextualism: The *Speaker/Attributor* (the person judging).
          *   SSI: The *Subject* (the person acting).
      *   *What* is varying?
          *   Contextualism: The semantic content of "knows."
          *   SSI: The metaphysical status of knowledge (justification/warrant).
      *   *Why does this matter?* It changes predictions about disagreement, retraction, and third-party judgments.

  4.  **Develop a Divergence Case (The "Smoking Gun"):**
      *   I need a scenario where the *Attributor's* stakes differ from the *Subject's* stakes.
      *   *Standard Bank Case:* Subject's stakes = Attributor's stakes (usually implied). This is why they look the same.
      *   *New Case:* High Stakes for Subject, Low Stakes for Attributor (or vice versa).
      *   *Scenario:* Hannah (Subject) has high stakes (huge check). Sarah (Attributor/Observer) has low stakes (just betting on whether Hannah knows, no real consequence).
      *   *Contextualist Prediction:* Sarah is in a low-stakes context. Her word "knows" has low standards. She can truthfully say "Hannah knows" (even if Hannah's stakes are high), because Sarah's conversational context sets the bar.
      *   *SSI Prediction:* Hannah's stakes are high. This raises the bar for *her* knowledge. Sarah's stakes don't matter. Sarah cannot truthfully say "Hannah knows," because Hannah *doesn't know* (factually), regardless of who is speaking.
      *   *Wait, refine Contextualism:* Standard Contextualism (DeRose) says the *attributor's* context sets the standard. So if Sarah is chatting casually, "Hannah knows" is true *in Sarah's mouth*.
      *   *Refine SSI:* SSI says knowledge depends on the *subject's* practical environment. So "Hannah knows" is false *simpliciter*, no matter who says it.
      *   *This is the divergence.*

  5.  **Drafting the Explanation:**
      *   **Tone:** Professional, insightful, respectful of the user's intelligence (they've read the SEP summary), but clear. Avoid overly dense jargon where possible, or explain it immediately.
      *   **Structure:**
          1.  **Validate:** Acknowledge why they look the same (the Bank Case conflates the variables).
          2.  **The Core Mechanism:** Break down *what moves* (the word vs. the world).
          3.  **The Locus of Variation:** Attributor vs. Subject.
          4.  **The Divergence Case:** Construct the "Hannah and Sarah" scenario clearly.
          5.  **Implications:** Why philosophers care (truth, disagreement, action).
          6.  **Closing:** A note on the current state of the debate (SSI has taken a hit recently, but the distinction remains vital).

  6.  **Refining the Divergence Case (Self-Correction/Nuance):**
      *   *Correction:* In Contextualism, if Sarah says "Hannah knows," is it true? Yes, relative to Sarah's context. But if Hannah says "I know," it's false relative to Hannah's context. This leads to *indexical* truth.
      *   *In SSI:* If Sarah says "Hannah knows," it is simply false.
      *   *Better Divergence:* What about *testimony*? If Hannah tells Sarah "I know the bank is open," can Sarah pass that on?
      *   *Let's stick to the Attributor/Subject stake mismatch.* It's the classic way to separate them.
      *   *Scenario:* Hannah (Subject) has high stakes. Sarah (Attributor) is a philosopher observing Hannah, with zero stakes.
      *   *Contextualist:* Sarah can truly say "Hannah does not know" *if* she raises standards, but if she stays in a casual context, she can say "Hannah knows." Wait, DeRose's contextualism usually implies the *salience* of error possibilities raises the context. If Sarah is just observing, the standards might remain low. So Sarah says "Hannah knows."
      *   *SSI:* Hannah's high stakes make it the case that she lacks knowledge. Sarah says "Hannah knows" -> False.
      *   *Wait, one nuance:* Some Contextualists argue that the *subject's* stakes make error possibilities salient to the *attributor*, thereby raising the attributor's context. I need to address this "salience" objection to ensure the divergence is clear. I must specify a case where the Attributor is *aware* of the stakes but remains in a low-standards context (perhaps a detached theoretical context).
      *   *Actually, the cleanest divergence is about **Retraction**.*
      *   *Scenario:* Low stakes context first (say "Knows"). Then High stakes context later (say "Didn't Know").
      *   *Contextualist:* No retraction needed. "I spoke truth then, I speak truth now."
      *   *Invariantist (SSI):* Retraction needed. "I was wrong before."
      *   *But the user asked for a case where they cash out in different **verdicts**.* The Attributor/Subject mismatch is better for verdicts.
      *   *Let's go with the "Third-Party Observer" case.*
      *   **Subject:** Hannah (High Stakes).
      *   **Attributor:** Ben (Low Stakes, just watching).
      *   **Contextualism:** Ben's context determines the truth of Ben's utterance. Ben is in a low-stakes chat. Ben says "Hannah knows." -> **TRUE** (in Ben's mouth).
      *   **SSI:** Hannah's stakes determine the fact of knowledge. Hannah doesn't know. Ben says "Hannah knows." -> **FALSE** (in anyone's mouth).
      *   *This is the clearest divergence.*

  7.  **Final Polish:**
      *   Make sure to explain *Subject-Sensitive Invariantism* clearly (it's a type of Pragmatic Encroachment).
      *   Ensure the distinction between *Semantic* (Contextualism) and *Metaphysical* (SSI) is clear.
      *   Check tone: Helpful, expert, not condescending.

