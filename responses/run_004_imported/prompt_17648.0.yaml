answer: |-
  This is one of the best questions in contemporary epistemology, and your frustration is completely warranted. For the first decade of this debate (roughly 1996–2006), even professional philosophers often talked past each other because the standard "Bank Case" is actually a *confounded* experiment. It varies the stakes for the subject *and* the conversational context of the attributor simultaneously.

  When both move together, Contextualism and Subject-Sensitive Invariantism (SSI) make the exact same prediction: "He knows" is appropriate in the low-stakes version and inappropriate in the high-stakes version.

  To see the daylight, we have to uncouple the **Subject's Stakes** from the **Attributor's Context**. Here is the deep dive into the machinery, followed by the specific case where they break apart.

  ### 1. The Machinery: What is actually moving?

  The fundamental disagreement is about what kind of beast "knowledge" is. Is it a semantic chameleon, or is it a robust state of being that is sensitive to practical reality?

  **Contextualism (The Semantic Move)**
  *   **The Claim:** The word "knows" is indexical, like "tall," "flat," or "here." Its content shifts depending on the *conversational context of the person speaking it* (the attributor).
  *   **The Mechanism:** In a low-stakes conversation, the "standard" for knowledge is low. In a high-stakes conversation (where error is salient), the standard rises.
  *   **The Subject:** The subject's actual mental state and practical situation *do not change*. Hannah has the exact same evidence and justification in both cases.
  *   **The Verdict:** In the high-stakes case, Hannah *still knows* (in the absolute sense), but the word "knows" now demands more than she has got. So, saying "Hannah knows" is false *in that conversation*, not because Hannah changed, but because the ruler changed.

  **Pragmatic Encroachment / SSI (The Metaphysical Move)**
  *   **The Claim:** The word "knows" has a fixed meaning (Invariantism). However, whether a person *has* knowledge depends partly on practical factors (Encroachment).
  *   **The Mechanism:** Knowledge requires justification. How much justification? Enough to rule out relevant alternatives. What makes an alternative "relevant"? **The subject's practical stakes.**
  *   **The Subject:** Hannah's epistemic position *actually changes*. When her stakes go up, her justification is no longer sufficient. She literally slides from a state of "knowing" to a state of "not knowing."
  *   **The Verdict:** In the high-stakes case, "Hannah knows" is false *simpliciter*. It is false regardless of who says it, because Hannah herself lacks the necessary epistemic standing.

  **The Summary Distinction:**
  *   **Contextualism:** The *ruler* moves. (Semantics)
  *   **SSI:** The *object* shrinks. (Metaphysics/Epistemology)

  ### 2. The Divergence Case: The Detached Observer

  To force these two theories to give different answers, we need a scenario where the **Subject's stakes** and the **Attributor's stakes** come apart.

  **The Setup:**
  *   **The Subject:** Hannah needs to deposit a check. If she fails, she faces foreclosure (Extremely High Stakes). She has standard evidence (was there two weeks ago).
  *   **The Attributor:** Ben is a philosopher sitting in a coffee shop across the street, watching Hannah through the window. Ben has no relationship to Hannah. He is betting a colleague $1 on whether Hannah *believes* the bank is open. For Ben, the stakes of being wrong about Hannah's mental state are negligible (Low Stakes).
  *   **The Utterance:** Ben says to his colleague: **"Hannah knows the bank is open."**

  **The Contextualist Verdict:**
  Contextualism cares about the *attributor's* conversational context. Ben is in a low-stakes, casual conversation. The salience of error possibilities is low in Ben's context. Therefore, the semantic standard for "knows" in Ben's mouth is low.
  *   **Result:** Ben's statement is **TRUE**.
  *   **Why:** Even though Hannah is under immense pressure, Ben is speaking in a context where the bar for "knows" is low. Hannah clears that low bar. Contextualists accept that "Hannah knows" can be true when spoken by Ben, even if "Hannah knows" would be false if spoken by Hannah herself (since her high stakes would raise the standard in her own mouth).

  **The SSI Verdict:**
  SSI cares about the *subject's* practical environment. The truth condition of "Hannah knows" depends on Hannah's stakes, not Ben's. Hannah's stakes are sky-high. Therefore, the evidential bar *for Hannah* is raised. Her evidence (being there two weeks ago) is insufficient for her specific situation. She does not know.
  *   **Result:** Ben's statement is **FALSE**.
  *   **Why:** Knowledge is a fact about Hannah. Since Hannah fails to meet the justification threshold required by her high stakes, she is not in a state of knowledge. Ben cannot make it true by speaking casually. He is reporting a fact about Hannah, and he is getting that fact wrong.

  ### 3. Why This Matters for Your Piece

  This distinction isn't just academic hair-splitting; it changes the moral and psychological implications of your story.

  **1. The Nature of Disagreement**
  *   **Contextualism:** If Hannah (high stakes) says "I don't know" and Ben (low stakes) says "Yes you do," they are **not disagreeing**. They are talking past each other, like one person saying "It's hot here" (in a sauna) and another saying "It's not hot here" (in a snowstorm). Both are right relative to their contexts.
  *   **SSI:** Hannah and Ben **are disagreeing**. One of them is objectively wrong. (SSI says Ben is wrong). This preserves the intuition that knowledge is a shared, public status we can argue about.

  **2. Action and Assertion**
  *   **Contextualism:** Hannah shouldn't act on her belief (go to the bank) because in her context, she doesn't "know." But she can listen to Ben tell her she knows without him lying.
  *   **SSI:** Hannah shouldn't act because she *doesn't know*. If Ben tells her she knows, he is misleading her about the world, not just shifting semantic goalposts.

  **3. The "Fact of the Matter"**
  *   **Contextualism:** There is no single fact about whether Hannah knows. There is only "Hannah-knows-relative-to-Context-A" and "Hannah-knows-relative-to-Context-B."
  *   **SSI:** There is a single fact. Hannah either knows or she doesn't. The practical stakes help determine which fact obtains.

  ### 4. A Note on the Current State of Play

  If you want to add color to your piece, it is worth noting that while Contextualism dominated the early 2000s, **SSI has taken some heavy hits recently.**

  Many epistemologists have pushed back on SSI because it seems to make knowledge too unstable. If whether I *know* my car is parked outside depends on how much I need it right now, knowledge seems less like a cognitive achievement and more like a practical resource.

  Furthermore, there is a third player now: **Strict Invariantism (or Warranted Assertability Maneuvers).** This group says: "Hannah *never* knows in the Bank Case, even in the low-stakes version. We just *say* she knows because it's polite/useful, not because it's true." This view is gaining traction because it avoids the semantic complexity of Contextualism and the metaphysical weirdness of SSI.

  ### Summary for your Article

  If you need a pull-quote distinction:

  > "Contextualism says the word 'knows' stretches to fit the conversation. Pragmatic Encroachment says the knower shrinks to fit the stakes."

  In the **Detached Observer Case**, Contextualism allows a casual observer to truthfully say a desperate person "knows," because the observer's context is relaxed. Pragmatic Encroachment says that statement is false, because the desperate person's high stakes have objectively degraded their epistemic position, regardless of who is watching.
