      *   *Decision:* The FA/WKR problem is harder for the *proponent of the theory* (FA). The Belief/WKR problem is harder for the *pragmatist*. But generally, the Belief case is often seen as a "dead end" for pragmatists (due to involuntarism), whereas the FA debate is live. I will argue the FA case is harder to solve *within the framework of the theory*, while the Belief case is often "solved" by rejecting the premise that pragmatic reasons are reasons for belief.

