answer: |-
  This is a sharp observation, and you are definitely not forcing an analogy that doesn't hold. In fact, mapping the Wrong Kind of Reasons (WKR) problem in fitting-attitude (FA) theories onto the evidentialist/pragmatist debate in epistemology is a standard move in contemporary meta-normative theory. They are structurally isomorphic, but the *constraints* on the two attitudes (admiration vs. belief) differ enough that the standard solutions diverge.

  Here is a breakdown of the comparison, the viability of the Object-Given/State-Given distinction, and a verdict on which problem is harder to crack.

  ### 1. The Structural Analogy
  You are right that the skeleton is identical. Both debates hinge on distinguishing between reasons that bear on the **standard of correctness** for an attitude and reasons that bear merely on the **desirability of holding** the attitude.

  *   **The Value Case (FA Theory):**
      *   *Thesis:* $X$ is good iff it is fitting to favor $X$.
      *   *WKR:* The Demon threatens you unless you favor the saucer of mud.
      *   *Intuition:* You have a reason to favor the mud, but the mud isn't good. The pragmatic reason is the "wrong kind" to constitute value.
  *   **The Belief Case (Evidentialism):**
      *   *Thesis:* Belief that $p$ is justified iff there is sufficient evidence for $p$.
      *   *WKR:* Pascal's Wager (or a Pragmatic Encroachment case). Believing God exists yields infinite reward.
      *   *Intuition:* You have a reason to believe, but the belief isn't epistemically justified. The pragmatic reason is the "wrong kind" to constitute knowledge/justification.

  In both cases, we have a normative property (Goodness / Justification) defined by a relation to an attitude (Favoring / Belief), and in both cases, pragmatic incentives threaten to decouple the property from the attitude's internal standard.

  ### 2. Does the Object-Given/State-Given Distinction Carry Over?
  The standard move in the value literature (championed by Parfit, Rabinowicz, and Rönnow-Rasmussen) is to distinguish **Object-Given Reasons (OG)** from **State-Given Reasons (SG)**.
  *   **OG:** Cite properties of the object of the attitude (The mud is muddy; The proposition is true).
  *   **SG:** Cite properties of the state of having the attitude (Admiring saves your life; Believing makes you happy).

  FA theorists argue only OG reasons count toward *fittingness*. Evidentialists argue only OG reasons (evidence) count toward *justification*.

  **Where it works:**
  Superficially, it carries over perfectly. Evidence looks like an OG reason (it is about the world/proposition), and pragmatic benefits look like SG reasons (they are about the mental state of the believer).

  **Where it breaks down:**
  The distinction faces a much steeper cliff in the belief case due to the **Transparency of Belief** and **Doxastic Involuntarism**.

  1.  **Transparency (Shah & Velleman):** When you deliberate about whether to believe $p$, you are transparently deliberating about whether $p$ is *true*. You cannot coherently deliberate about believing $p$ by considering the benefits of believing $p$. If the OG/SG distinction implies that SG reasons are still reasons *for belief*, it contradicts the phenomenology of deliberation. In the value case, I *can* deliberate about admiring the mud by thinking about the demon's threat. I can try to pump up admiration. I cannot try to pump up belief in the same way.
  2.  **The "No Reason" vs. "Wrong Reason" Move:** Because of transparency and involuntarism, many epistemologists argue that pragmatic considerations aren't the *wrong kind* of reason for belief; they are **no kind** of reason for belief. They are reasons to *bring it about* that you believe, or reasons to *act as if* you believe. In the FA case, the demon's threat is widely conceded to be a genuine reason *to admire*, just not a value-constituting one. The disanalogy is that in the belief case, the "WKR" are often reclassified as reasons for *action*, whereas in the value case, they remain reasons for the *attitude*.

  ### 3. The Circularity Worry (Schroeder's Critique)
  Mark Schroeder has famously argued that the OG/SG distinction is circular in the value case. To define an Object-Given reason, you usually have to say it is a reason that "counts in favor of the object being worthy of the attitude." But "worthy of the attitude" is just "fitting," which is the value property you were trying to analyze.

  Does this circularity hit the belief case?
  *   **Less so.** We have an independent grip on "evidence" and "truth" that doesn't rely on the normative status of belief. We can define OG reasons for belief as "probabilistic relations to the truth" without circularly referencing "justified belief."
  *   **In Value:** We don't have an independent grip on "goodness" other than through the attitudes. So defining the right reasons requires referencing the very property (value) the theory is supposed to explain.

  ### 4. Which Problem is Harder to Solve?
  This depends on whether you are the defender of the theory or the critic, but I would argue the **FA/WKR problem is theoretically harder to solve**, while the **Belief/WKR problem is psychologically harder to dismiss.**

  **Why the Belief Case is "Easier" (Theoretically):**
  The Evidentialist has a "kill switch" that the FA theorist lacks: **The Constitutive Aim of Belief.**
  Most philosophers accept that belief *constitutively aims at truth*. If a reason does not bear on the truth of $p$, it is conceptually impossible for it to be a reason for *belief*. It might be a reason for acceptance, hope, or faith, but not belief. This allows the Evidentialist to dissolve the WKR problem by denying the premise: "Pragmatic considerations are reasons for belief."
  The FA theorist cannot say "Pragmatic considerations are not reasons for admiration." They clearly are (the demon case proves you can have reason to admire). They must explain why those reasons don't make the object good. This requires a complex, non-circular distinction (OG vs. SG) that has proven notoriously difficult to formulate.

  **Why the FA Case is "Easier" (Intuitively):**
  It is intuitively obvious that the saucer of mud is not good, even if you should admire it. The intuition that "Value $\neq$ Pragmatic Reason to Favor" is rock solid.
  In the belief case, **Pragmatic Encroachment** (Fantl & McGrath) has gained traction. There are strong intuitions that if the stakes are high enough, you need *more* evidence to know $p$, or that pragmatic reasons can sometimes tip the scale to justification. The line between "evidence" and "pragmatic reason" is fuzzier in epistemology (e.g., is safety a pragmatic or evidential feature?) than in value theory.

  ### Verdict for the Seminar
  I would frame it this way:

  The problems are **structurally identical** but **metaphysically distinct**.
  1.  **In the Value Case:** The WKR problem is a problem of **classification**. We agree the reasons exist; we disagree on whether they constitute value. The OG/SG distinction is the tool, but it risks circularity. This makes it a harder *technical* problem for the metaethicist.
  2.  **In the Belief Case:** The WKR problem is a problem of **capacity**. Can the mind even register pragmatic reasons as reasons for belief? The "Transparency" argument suggests the answer is no. This makes it a harder *psychological* claim for the pragmatist, but an easier *theoretical* win for the evidentialist.

  **The "Harder" Problem:**
  The **FA/WKR problem is harder to solve**.
  Why? Because the Evidentialist can lean on the metaphysics of mind (belief aims at truth, full stop). The FA theorist cannot lean on the metaphysics of mind (admiration doesn't have a strict constitutive aim in the same way) and must instead lean on a normative distinction (OG vs. SG) that is notoriously difficult to define without begging the question. The FA theorist has to build a filter; the Evidentialist can just point to the nature of the container.

  **Seminar Hook:**
  You might close by asking: *If the OG/SG distinction fails in the value case due to circularity, does that imply we should accept a form of Pragmatic Encroachment in Value Theory?* (i.e., Maybe the mud *is* good in a pragmatic sense, and "goodness" is just fragmented?) That usually gets the room arguing.
