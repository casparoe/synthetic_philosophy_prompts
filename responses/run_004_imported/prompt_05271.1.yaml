  2.  **Deconstruct the Two Cases:**
      *   **Case 1: Fitting-Attitude (FA) Theories of Value.**
          *   *Thesis:* $X$ is good iff it is fitting to favor/admire $X$.
          *   *WKR:* The Demon case. Demon threatens torture unless you admire a saucer of mud.
          *   *Result:* You have a pragmatic reason to admire the mud, but the mud isn't *good*. The reason is the "wrong kind" to constitute value.
          *   *Standard Solution:* Object-Given (OG) vs. State-Given (SG) reasons. OG reasons cite properties of the object (mud is muddy). SG reasons cite properties of the state of having the attitude (admiring saves your life). FA theories claim only OG reasons count for value.

      *   **Case 2: Reasons for Belief (Evidentialism vs. Pragmatism).**
          *   *Thesis (Evidentialism):* You ought to believe $P$ iff there is sufficient evidence for $P$.
          *   *WKR:* Pascal's Wager / Pragmatic encroachment. Believing in God yields infinite reward.
          *   *Result:* You have a pragmatic reason to believe, but intuitively, you can't just believe because it pays off. Belief "aims at truth."
          *   *Standard Solution:* Try to apply OG/SG distinction. OG = evidence for $P$. SG = benefits of believing $P$.

  3.  **Evaluate the Analogy (Are they the same?):**
      *   *Similarities:* Both involve normative standards (value, belief) being threatened by pragmatic incentives. Both distinguish between reasons that bear on the *content* vs. reasons that bear on the *attitude*.
      *   *Differences:*
          *   *Control:* We have more voluntary control over admiration/favoring than belief (Doxastic Involuntarism). This makes the belief case trickier regarding *how* the reason applies.
          *   *Constitutive Aim:* Belief is often thought to have a constitutive aim (truth). Admiration might not have such a strict aim in the same way (or if it does, it's "fittingness").
          *   *The "Right Kind":* In FA, the RKRs are about *fittingness*. In Belief, RKRs are about *truth/evidence*.

  4.  **Analyze the Transfer of the OG/SG Distinction:**
      *   *Does it work?* Superficially, yes. Evidence looks object-given (about the proposition/world). Pragmatic benefits look state-given (about the state of believing).
      *   *Where does it break down?*
          *   *The "Guidance" Problem:* Reasons must be able to guide action/attitude. SG reasons *can* guide admiration (I can try to pump up admiration to save my life). Can SG reasons guide belief? If belief is involuntary, pragmatic reasons can't directly cause belief. This suggests they aren't reasons *for belief* at all, but reasons *to bring it about that one believes*.
          *   *The "Teleological" Argument:* Belief aims at truth. If a reason doesn't bear on truth, it's not a reason for *belief*, it's a reason for *something else* (like assertion or action). In the value case, admiration doesn't necessarily "aim" at value in the same constitutive way; rather, value is *defined* by the fittingness of admiration.
          *   *Shah & Velleman:* They argue the distinction collapses for belief because deliberation about belief is transparent to the truth of the proposition. You can't deliberate about belief using pragmatic reasons.

