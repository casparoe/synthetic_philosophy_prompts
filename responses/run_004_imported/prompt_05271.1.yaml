          *   *Involuntarism:* Can you believe at will? If not, pragmatic reasons can't be reasons *for* believing, only reasons to *cause* believing.
          *   *The "Wrong Kind" becomes "No Kind":* In belief, many argue pragmatic reasons aren't reasons for belief *at all*. In FA, they are reasons for admiration, just not value-constituting.
      *   **Section 4: Which is Harder?**
          *   *FA Case:* Harder to formulate a non-circular distinction. (Schroeder's critique). The "Buck-Passing" account gets tangled.
          *   *Belief Case:* Harder to accommodate pragmatic encroachment (which is intuitively appealing in some contexts, e.g., stakes-sensitive knowledge).
