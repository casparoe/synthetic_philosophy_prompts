answer: |-
  This is an exceptionally sharp observation, and you are absolutely right to trust your reading of the early Douglass. The tension you have identified is real, but the resolution lies in a pivotal chapter of Douglass's intellectual life that often gets overshadowed by his autobiography and his 1852 "What to the Slave is the Fourth of July?" speech.

  The short answer is: **Frederick Douglass changed his mind.**

  The Douglass who called the Constitution a "covenant with death" was the Garrisonian Douglass (roughly 1841–1851). The Douglass who inspired Martin Luther King Jr. was the Independent Douglass (1851–1895). King wasn't setting aside Douglass's judgment; he was aligning himself with Douglass's *final* and most mature judgment.

  Here is the breakdown of that evolution and why it matters for your question about rhetorical convenience versus principle.

  ### 1. The Garrisonian Phase (1841–1851)
  You are correct that for the first decade of his public career, Douglass was a disciple of William Lloyd Garrison. During this time, he adhered to the doctrine of **disunionism**.

  The Garrisonians argued that because the Constitution protected slavery (through the Three-Fifths Clause, the Fugitive Slave Clause, and the 20-year protection of the slave trade), the North was complicit in sin by remaining in the Union. Their slogan was "No Union with Slaveholders." Douglass famously burned copies of the Constitution during this period and argued, as you noted, that the document was fundamentally pro-slavery.

  This view was morally pure but politically limiting. If the Constitution is pro-slavery, you cannot use the courts, the ballot, or the federal government to end slavery. You can only morally suade the North to secede.

  ### 2. The Great Pivot (1851–1852)
  Around 1851, Douglass broke with Garrison. This was partly personal (Garrison tried to control Douglass's newspaper, *The North Star*), but it was primarily intellectual. Douglass began studying legal theory more deeply, influenced by legal scholars like **Lysander Spooner** and **Gerrit Smith**, who argued for a "natural law" interpretation of the Constitution.

  In May 1851, Douglass published an editorial titled **"Change of Opinion Announced."** He wrote:

  > "I have had the privilege of submitting the subject to a careful examination... and I have no hesitation in saying that I have entirely changed my opinion... I now hold that the Federal Government was never, in its essence, anything but an anti-slavery government."

  Douglass's new argument was textualist and originalist in a specific sense:
  *   **The Word "Slave":** He pointed out that the word "slave" or "slavery" appears *nowhere* in the Constitution. The document refers to "persons held to service," "other persons," and "such persons." Douglass argued these were euphemisms that the text itself did not validate.
  *   **The Preamble:** He argued the *purpose* of the Constitution, stated in the Preamble ("secure the Blessings of Liberty"), was the governing principle. Any clause that seemed to protect slavery had to be interpreted narrowly so as not to violate the document's core purpose of liberty.
  *   **Federal Power:** Most radically, Douglass came to believe the Constitution gave the federal government the power to abolish slavery in the states, not just in the territories.

  This was not a shift for "rhetorical convenience." It was a shift toward **political power.** If the Constitution was anti-slavery, then voting, holding office, and using the federal courts became valid tools for abolition.

  ### 3. The Line to Martin Luther King Jr.
  When Martin Luther King Jr. stood on the steps of the Lincoln Memorial in 1963 and described the Constitution and Declaration of Independence as a "promissory note," he was channeling the **later Douglass**, not the Garrisonian one.

  King's metaphor relies on the idea that the Founders signed a check that was good for all people, but it was returned marked "insufficient funds" for Black Americans. This presupposes that the check (the Constitution) was valid to begin with. If Douglass had stuck with the Garrisonian view, the check would have been counterfeit, not just unpaid.

  This continuity suggests that the Civil Rights Movement's "fidelity to the Constitution" was not an abandonment of Douglass's hard-won judgment, but an adoption of his mature strategy. Both men realized that in a democracy, you cannot effectively demand rights from outside the system; you must claim that the system's highest law already belongs to you.

  ### 4. Was it just "Rhetorical Convenience"?
  You ask if treating the Constitution as redeemable is just a convenient strategy. Douglass would have argued it was a **strategic necessity grounded in truth.**

  *   **The Alternative:** If you declare the Constitution irredeemably racist (the Garrisonian view), you cede the legal ground to the oppressor. You allow the slaveholder (or the segregationist) to claim they are the true constitutionalists.
  *   **The Douglass/King View:** By claiming the Constitution is *on your side*, you force the oppressor to either admit they are violating the law or change the law. It turns the master's tools against the master's house.

  However, your skepticism is not without merit. Douglass never forgot the compromises. In his later years, he acknowledged that while the *text* might be clean, the *history* was stained. He knew the "promissory note" had been written by men who owned slaves. His argument was that the *principles* contained in the text were larger than the *men* who wrote them.

  ### Summary
  You have correctly identified that the early Douglass viewed the Constitution as a pro-slavery charter. But the reason the Civil Rights Movement treats it as redeemable is that the **later Douglass convinced them it was possible.**

  Douglass's intellectual journey from "covenant with death" to "glorious liberty document" is perhaps his greatest legacy. It teaches that founding documents are not static artifacts of their authors' sins, but living tools that can be seized and reinterpreted by the excluded to demand inclusion. King wasn't ignoring Douglass's verdict; he was cashing the check Douglass had endorsed thirty years before.
