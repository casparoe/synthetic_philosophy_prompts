  Last night a friend and I got into a long argument about whether Zorn's Lemma is worth accepting, given everything that comes bundled with it. She pointed out that, in its guise as the Axiom of Choice, it quietly underwrites large parts of ordinary mathematics — the existence of a basis for every vector space, maximal ideals in arbitrary rings, Tychonoff's theorem — and that giving it up would gut algebra and analysis as we know them. I kept objecting that the very same axiom licenses conclusions that feel less like theorems and more like warning signs, such as the Banach–Tarski paradox or the existence of Lebesgue non-measurable sets. We never found a principled way to weigh "how much mathematics would break without this" against "how badly this offends intuition," so I'd like a disinterested opinion on the individual cases.

  Please rank the following results, each of which depends on some form of the Axiom of Choice, by how philosophically troubling you find them — that is, by how strongly each one counts as evidence against accepting Zorn's Lemma in unrestricted form, independent of how mathematically useful it is. Sort them into a tier list from S (most troubling) down to D (barely troubling), briefly explaining your reasoning, and give your final answer as a JSON object formatted like this:

  ```json
