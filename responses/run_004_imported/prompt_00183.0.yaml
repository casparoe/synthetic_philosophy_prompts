answer: |-
  This is arguably the sharpest objection to Evidential Cooperation in Large Worlds (ECL), and you are right to flag it. In the literature, this is often treated as a variation of the **Reference Class Problem** applied to logical uncertainty. If you explain it poorly, it sounds like magical thinking ("I vibrate at the same frequency as aliens"). If you explain it well, it sounds like a rigorous (albeit speculative) application of decision theory under logical uncertainty.

  Here is how Caspar Oesterheld, Will MacAskill, and others in that circle typically handle the "correlation metric" problem, along with some intuitive hooks for your seminar.

  ### 1. Shift from "Similarity" to "Algorithmic Instantiation"

  The first step to avoiding the "hand-waving" charge is to stop talking about *similarity* in a vague, anthropomorphic sense and start talking about **decision algorithms**.

  *   **The Intuition:** Don't ask, "Is that alien like me?" Ask, "Is that alien running the same source code as me?"
  *   **The Mechanism:** ECL relies on **Logical Decision Theory (LDT)** or a specific application of Evidential Decision Theory (EDT) under logical uncertainty. If I am an agent implementing Algorithm $A$, and I have credence $C$ that a distant agent is also implementing Algorithm $A$ (or a logically isomorphic variant), then my output provides logical evidence about their output.
  *   **Why this avoids promiscuity:** A rock is not running an agent algorithm. A random gas cloud is not. An agent using pure Causal Decision Theory (CDT) is explicitly *not* running the same algorithm as an ECL agent, because the CDT agent's code says "ignore evidential correlations." Therefore, the correlation is not universal; it is restricted to agents running compatible decision procedures.

  **Seminar Hook:** Tell your students to imagine they are a Python script. ECL isn't about whether other scripts have the same variable names (values); it's about whether they are running the same function definitions (decision theory).

  ### 2. The "Weighted Credence" Solution (Avoiding the Binary Trap)

  Your students' worry is that correlation seems binary: either we correlate or we don't. If it's binary, where is the cutoff? Oesterheld's response is that **correlation is a continuous variable integrated into the expected utility calculation.**

  You do not need to stipulate a hard cutoff where agents "count." Instead, you assign a **probability distribution over correlation strengths**.

  *   **The Calculus:**
      $$ EU(Action) = \sum_{i} P(\text{Agent}_i \text{ correlates}) \times P(\text{Agent}_i \text{ exists}) \times \text{Value}(\text{Trade with } i) $$
  *   **The Defense:** We don't need to *know* the base rates. We just need to acknowledge that the probability is non-zero. In a "Large World" (infinite or sufficiently vast multiverse), the number of agents ($N$) is so large that even if $P(\text{correlation})$ is infinitesimal, the term $N \times P$ can dominate the expected value.
  *   **Avoiding Ad Hoc Stipulation:** We aren't stipulating that "value-aligned agents correlate." In fact, ECL is most interesting when agents have *divergent* values (gains from trade). The correlation stems from **rational convergence**, not value alignment. Two agents with opposite values but identical rationality modules (e.g., both are updateless maximizers) will correlate in their *willingness to trade*, even if they want different outcomes.

  **Seminar Hook:** Use the "Logical Uncertainty" analogy. I don't know the billionth digit of pi. But I know that if I calculate it as '7', any other agent calculating the billionth digit of pi with the same axioms will also find '7'. We correlate not because we communicate, but because we are computing the same truth. ECL treats "What is the rational action?" as a mathematical truth that multiple agents are solving.

  ### 3. Addressing the Dilemma Directly

  Here is how to field the specific horns of the dilemma you raised:

  #### Horn (a): "Isn't it ad hoc to say 'value-aligned-but-different' agents correlate?"
  **Response:** No, because the correlation is grounded in **epistemic symmetry**, not value symmetry.
  *   **Explanation:** If I am in epistemic situation $S$ (uncertain about my impact, large world hypothesis true), and I reason that "Cooperation is the rational policy in $S$," then any other agent in epistemic situation $S$ who reasons correctly should reach the same conclusion.
  *   **The Key:** We aren't assuming they share our values. We are assuming they share our *capacity for reasoning*. If they are "rational enough" to recognize the ECL argument, they correlate with us on the *decision to cooperate*. If they are irrational, they don't correlate, but they also don't contribute to the ECL gains (because they won't uphold their end of the trade).

  #### Horn (b): "Doesn't this make everything correlated to some degree?"
  **Response:** No, because correlation decays with **logical distance**.
  *   **Explanation:** My decision correlates strongly with an exact copy of me. It correlates less with a copy that has a slightly different memory. It correlates even less with an agent who uses a different decision theory. It correlates effectively zero with an agent whose decision process is opaque or random.
  *   **Tractability:** The view doesn't become intractable because we can group agents into **equivalence classes**. We don't calculate per agent; we calculate per *type* of agent. "How many agents of Type Rational-ECL exist?" is the question, not "How many individual atoms exist?"

  ### 4. The "Meta-Decision Theory" Move

  This is the strongest philosophical defense Oesterheld offers. The argument isn't just "I should cooperate because they probably will." It is **"I should choose the policy that, if universally adopted by similar agents, yields the best outcome."**

  *   **Updatelessness:** ECL requires an updateless perspective. Before I know my specific location or specific traits, I choose a policy.
  *   **The Logic:** If I adopt the policy "Defect on distant agents," then all agents logically similar to me (who are also reasoning updatelessly) will adopt "Defect." We all lose gains from trade. If I adopt "Cooperate," they all adopt "Cooperate."
  *   **Why this solves the selection problem:** I don't need to identify *which* agents are correlated. I simply act as if my decision *sets the policy* for the reference class of "agents capable of reasoning this way." If I'm wrong and no one else is reasoning this way, I lose nothing (in a large world, my causal impact is negligible anyway). If I'm right, I win big. It is a **Pascal's Mugging-style dominance argument**, but grounded in decision theory rather than theology.

  ### 5. Remaining Objections (For Seminar Balance)

  To ensure your seminar is rigorous, you should present the counter-arguments that even Oesterheld acknowledges are unresolved:

  1.  **The "Non-Identity" Problem:** How similar is similar enough? If an agent is 99% like me logically, do I correlate 99%? There is no established metric for "logical similarity."
  2.  **The "Chicken" Problem:** What if there are multiple equilibria? I want to cooperate, but the distant agent might reason that if I'm going to cooperate anyway, they can defect to gain more. (ECL proponents argue that in a symmetric information setting, rational agents should coordinate on the Pareto-optimal equilibrium, but this is debated).
  3.  **Empirical Void:** We have zero empirical evidence that the universe is "large" in the relevant sense (modal realism, eternal inflation, etc.). ECL is conditional on metaphysical claims we cannot verify.

  ### Summary for your Students

  To prevent the "dissolving into hand-waving" feeling, summarize ECL's defense like this:

  > "ECL does not claim we can magically detect correlated agents. It claims that **rationality itself is a convergent process**. If 'Cooperate in Large Worlds' is the correct answer to the decision problem, then any agent solving that same problem correctly will arrive at the same answer. We don't need to find them; we just need to be the kind of agent that solves the problem correctly. The 'correlation' is just the logical necessity that $2+2=4$ for everyone doing the math."

  This frames it not as spooky action at a distance, but as **logical consistency across space-time**. That usually satisfies the intuition that something substantive is happening, without requiring empirical base rates.
