answer: |-
  **Title:** The Blood in the Syntax: Re-evaluating Frege's Logic in Light of His Politics

  **Introduction**
  Gottlob Frege occupies a cathedral in the history of analytic philosophy. He gave us the quantifier, the distinction between sense and reference, and the dream of logicism. For a century, the standard orthodoxy, championed by scholars like Michael Dummett, has been one of radical separation: Frege's *Begriffsschrift* (Concept Script) is a timeless formal achievement, while his late-life diaries—revealing a virulent antisemite cheering for Hitler and Ludendorff in 1924—are a biographical tragedy. The standard defense is that separating the work from the worker is a logical necessity; to do otherwise is to commit the genetic fallacy. However, this defense relies on the assumption that Frege's logic was hermetically sealed from his metaphysical and political commitments. It was not. When we examine *how* Frege applied his technical kit to the social world, the wall between the logic and the politics crumbles. While the formal validity of Frege's calculus remains intact, his *philosophy of semantics*—specifically his demand for sharp conceptual boundaries and his deployment of the "ancestral" relation—is deeply implicated in his authoritarian ideology. We cannot simply excise the politics; we must recognize that the rigidity of Fregean semantics was not merely a logical virtue but a political weapon.

  **The Genetic Fallacy and the Autonomy of Logic**
  To evaluate Frege fairly, we must first grant the strength of the orthodox defense. The genetic fallacy dictates that the origin of a belief does not determine its truth value. If Frege's system of predicate logic allows us to derive valid inferences, those inferences remain valid regardless of his hatred. A proof concerning the ancestral of a relation holds true even if the author intends to use it to track "Aryan lineage." Dummett argued that we could salvage the "core" of Frege's philosophy (language and logic) while discarding the "periphery" (politics and epistemology). This view treats logic as a neutral technology, like a hammer: a hammer can build a house or break a skull, but the physics of the hammer remains unchanged.

  However, this analogy fails when the "hammer" is designed with the specific intent of breaking skulls. The issue is not the *validity* of Frege's inferences, but the *criteria for legitimacy* he imposed on concepts themselves. If the design specifications of the tool are motivated by exclusionary politics, the tool is not neutral.

  **The Politics of Sharp Boundaries**
  The most damning intersection of Frege's logic and politics lies in his semantics of concepts. In his logical work, Frege famously insisted that for a concept to be logically legitimate, it must have a sharp boundary. He argued that vagueness was a defect of natural language that logic must cure. A concept must determine, for every object, whether it falls under that concept or not. There can be no borderline cases.

  In his political writings, this logical requirement transforms into a legislative demand. Frege expressed anxiety that without sharp biological and legal definitions, antisemitic legislation would be unenforceable. He worried that if "Jewishness" or "citizenship" allowed for vagueness, the state could not effectively exclude. Here, the logical imperative (concepts must be bivalent) becomes a political imperative (society must be sorted bivalently).

  This bears directly on how we evaluate Frege's semantics. If the demand for sharp boundaries is motivated by a desire for social purification, we must question whether vagueness is truly a logical defect or merely a political inconvenience. Modern semantic theories (such as supervaluationism or fuzzy logic) suggest that vagueness is a fundamental feature of language and reality, not a bug to be patched. Frege's refusal to accommodate vagueness looks less like a rigorous logical insight and more like an ideological blind spot. By insisting that reality *must* conform to sharp logical cuts, Frege's semantics implicitly validates the authoritarian impulse to force messy human realities into rigid categories. Therefore, his semantic theory is not neutral; it carries an ontological commitment to crispness that facilitates exclusion.

  **The Ancestral and the Logic of Lineage**
  Furthermore, Frege's technical definition of the "ancestral" of a relation (the *Begriffsschrift*'s method for defining succession and lineage) provides the structural backbone for his racial politics. Frege developed the ancestral to handle mathematical induction, allowing one to define "number" via succession. However, this same logical structure is perfectly suited to define "descent."

  In his political vision, Frege relies on a rigid, transitive understanding of lineage to justify policy. The logic of the ancestral assumes a clean, branching tree of descent. This ignores the complexities of adoption, cultural assimilation, and the social construction of identity. By elevating this specific logical structure to the status of *the* way to understand connection and succession, Frege's system naturalizes the concept of "bloodline." It suggests that the only logically coherent way to track human groups is through biological descent.

  This implicates the *application conditions* of his logic. If a logical system is presented as a universal canon of thought, but its structural priorities (transitivity, strict succession) align perfectly with a specific racist ideology, we must ask if the system is truly universal. It suggests that Frege's logic is optimized for a static, hierarchical ontology. It works beautifully for numbers, which are static and hierarchical. It works beautifully for eugenics, which pretends humans are static and hierarchical. It works poorly for democratic societies, which are fluid and contested. Thus, the logic is not "wrong," but its claim to be the *universal* structure of thought is undermined. It is a logic of order, not a logic of life.

  **Conclusion: A Revised Evaluation**
  We must reject the comforting notion that Frege's politics were a private sickness that left his philosophy untouched. The genetic fallacy protects the *truth* of his theorems, but it does not protect the *philosophical motivations* behind them. Frege's demand for sharp boundaries and his reliance on rigid lineage logic were not incidental; they were the bridge between his desk and the ballot box.

  Consequently, we ought to evaluate Frege's philosophy with a critical revisionism. We can retain the predicate calculus as a formal tool, but we must reject the Fregean semantic imperative that vagueness is illegitimate. We must recognize that his "logicism" was driven by a desire for control and order that transcended mathematics. To study Frege today is not to study a neutral foundation of thought, but to study a system that achieved greatness by stripping away the very ambiguities that make liberal democracy possible. The logic stands, but the philosophy of logic must be purged of the Fregean demand for sharpness. We can keep the *Begriffsschrift*, but we must leave the bloodlines behind.
