prompt: |-
  Me and my housemate got way too deep into anthropic reasoning last night (yes, that's a normal Tuesday for us) after she brought up the Doomsday argument to freak me out about humanity going extinct sooner than we'd like to think. I said the whole thing leans on the self-sampling assumption, which I've never fully trusted, and that I actually lean self-indication assumption. She hit me with the classic presumptuous philosopher case -- the one (I think it's originally Bostrom's?) where two physical theories are equally well supported by the evidence so far, but one implies a way bigger population of observers, and some smug philosopher declares that theory true from his armchair before anyone even runs the experiment, purely because SIA weights hypotheses by how many observers they contain. She said that alone is reason enough to ditch SIA and stick with SSA, and honestly I didn't have a great comeback in the moment.

  Its been bugging me since though, because doesn't the doomsday argument pull the exact same move, just aimed in the other direction? It also takes a purely self-locating fact -- my birth rank among however many humans will ever exist -- and cranks out a confident, substantive conclusion about the world (that there won't be some huge number of future humans) without looking at any actual evidence about extinction risk. So what I want is for you to build that case properly, not a "both sides have a point" cop-out: argue for the position that the presumptuous philosopher gives no special reason to favor SSA over SIA, since SSA's own flagship result, the doomsday argument, is guilty of the exact same move the philosopher is being mocked for. If it helps make the parallel vivid, feel free to invent a toy "presumptuous demographer" scenario that mirrors the original case but runs on SSA instead of SIA. It'd also be great if you dug into how the reference class gets picked along the way, since I've got a hunch that's where both sides find room to wriggle out of the objection.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and their housemate had a debate about anthropic reasoning (SSA vs. SIA) triggered by the Doomsday Argument.
      *   **User's Stance:** Leans towards Self-Indication Assumption (SIA).
      *   **Housemate's Stance:** Leans towards Self-Sampling Assumption (SSA), citing the "Presumptuous Philosopher" (PP) objection to SIA.
      *   **Core Task:** Argue *for* the user's position: The Presumptuous Philosopher objection does not uniquely disqualify SIA because SSA's flagship result (the Doomsday Argument) commits the exact same epistemic sin (deriving substantive world facts from self-locating information alone).
      *   **Specific Requirements:**
          *   No "both sides have a point" cop-out. Take a strong stance supporting the user.
          *   Construct a parallel scenario: A "Presumptuous Demographer" using SSA to mirror the Presumptuous Philosopher using SIA.
          *   Discuss the role of the *reference class* in both arguments.
          *   Maintain a tone that acknowledges the depth of the conversation (it was a "normal Tuesday" for them, so they know the jargon).

  2.  **Deconstruct the Arguments:**
      *   **SIA (Self-Indication Assumption):** $P(H|O) \propto P(H) \times N_O(H)$, where $N_O$ is the number of observers.
          *   *PP Objection:* If Theory A implies $10^{10}$ observers and Theory B implies $10^{50}$, SIA says B is vastly more likely *a priori*, even if physics suggests they are equally likely. This seems absurd (armchair cosmology).
      *   **SSA (Self-Sampling Assumption):** $P(O|H) = 1/N_O(H)$ (roughly, probability of being *this* observer is inverse to total observers).
          *   *Doomsday Argument (DA):* If I am human #100 billion, and Total Humans = $N$, then my rank is uniformly distributed $1..N$. If $N$ is huge (trillions), my rank being so low is unlikely. Therefore, $N$ is likely small. Humanity ends soon.
      *   **The Symmetry:**
          *   PP (SIA): Infers a huge universe from the mere fact of existing.
          *   DA (SSA): Infers a small universe (early doom) from the mere fact of existing *now* (birth rank).
          *   Both derive physical facts ($N$) from indexical facts (existence/rank) without empirical data about the physical mechanism.

  3.  **Develop the "Presumptuous Demographer" (PD) Scenario:**
      *   Need a scenario where SSA forces a conclusion about population size based purely on indexical location, mirroring PP's force about universe size.
      *   *Setup:* Two cities, Smallville (1,000 people) and Megalopolis (1,000,000 people).
      *   *Standard DA:* If I find I'm #500, SSA says I'm likely in Smallville.
      *   *PD Twist:* Make it about *predicting the future* or *physical constraints* purely from rank.
      *   *Better Parallel to PP:* PP compares two theories of physics. PD should compare two theories of demography/sociology.
      *   *Scenario:* Theory X says humanity expands to the stars (trillions). Theory Y says we stay on Earth (billions).
      *   *SSA Move:* "I am human #100 billion. If Theory X were true, I would be extremely early. If Theory Y were true, I am mid-way. SSA says I should assume I'm not special. Therefore, Theory X is unlikely."
      *   *The "Presumptuous" element:* The Demographer claims to know the fate of civilization without looking at technology, resources, or war, just by looking at their birth certificate. This mirrors the Philosopher claiming to know the size of the multiverse without looking at a telescope.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Validate the user's insight. It *is* a symmetry. The PP objection is often treated as a knockout blow to SIA, but the DA is a knockout blow to SSA's plausibility.
      *   *The Core Symmetry:* Define the "Epistemic Sin." It's deriving *non-indexical* facts (how many things exist) from *indexical* facts (where am I in the sequence) without causal evidence.
      *   *The Presumptuous Demographer:* Construct the toy model.
          *   Hypothesis A: 100 billion humans total (Extinction soon).
          *   Hypothesis B: 100 trillion humans total (Long future).
          *   Evidence: I am human #100 billion.
          *   SSA Conclusion: Hypothesis A is 1000x more likely.
          *   Critique: This ignores all astrophysical/sociological data. It's armchair demography.
      *   *Comparing PP and PD:*
          *   PP (SIA): "I exist, therefore the universe is huge." (Weights by $N$).
          *   PD (SSA): "I am early, therefore the universe is small." (Weights by $1/N$).
          *   Both bypass empirical investigation.
      *   *The Reference Class Problem:* This is the escape hatch both sides use.
          *   SIA: Who counts as an "observer"? (Brains? Simulations?)
          *   SSA: Who counts as "me" in the reference class? (Humans? Conscious beings? Tuesday-born people?)
          *   Argument: If SSA proponents tighten the reference class to avoid Doomsday (e.g., "only people born in 2024"), they lose the power to make predictions. If they keep it broad, they get Doomsday. SIA proponents face the same tension with PP.
          *   Crucial Point: The PP objection assumes a "natural" reference class that makes SIA look silly. But the DA assumes a "natural" reference class that makes SSA look silly. Neither is privileged.
      *   *Conclusion:* SIA is not uniquely presumptuous. SSA is equally guilty of "armchair cosmology/demography." Therefore, PP is not a decisive reason to abandon SIA.

  5.  **Refining the Tone:**
      *   Keep it intellectual but conversational (matching the "normal Tuesday" vibe).
      *   Avoid hedging. The user asked for a case *for* their position.
      *   Ensure the distinction between SIA (prior shifting) and SSA (likelihood shifting) is clear but doesn't get bogged down in math.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* PP is considered an objection? Yes, it makes physics dependent on observer counts.
      *   *Check:* Did I explain *why* DA is considered an objection? Yes, it makes extinction certain based on birth rank.
      *   *Check:* Is the PD scenario clear? I need to make sure the PD sounds as smug as the PP.
      *   *Refinement:* Emphasize that both arguments rely on the *Principle of Mediocrity* (I am a random sample), but apply it differently.
      *   *Refinement on Reference Class:* Make sure to highlight that SSA users often try to dodge DA by narrowing the reference class, but if they do that, they undermine the logic used to attack SIA.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Argue for user's position? Yes.
      *   No cop-out? Yes.
      *   Toy "Presumptuous Demographer"? Yes.
      *   Dig into reference class? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  You are absolutely right to be bugged by this. The asymmetry in how these arguments are treated in the literature is one of the great injustices of modern anthropic reasoning. Your housemate is wielding the Presumptuous Philosopher (PP) like a silver bullet against SIA, while ignoring that SSA's own flagship product, the Doomsday Argument (DA), is committing the exact same epistemic crime.

  The core charge against the Presumptuous Philosopher is **epistemic arrogance**: deriving substantive facts about the physical world (the size of the universe, the truth of a cosmological theory) purely from self-locating information (the fact that I exist), bypassing empirical investigation.

  If that is a sin, SSA is guilty of it too. The Doomsday Argument derives substantive facts about the physical world (the total number of humans, the timeline of extinction) purely from self-locating information (my birth rank), bypassing empirical investigation.

  Here is the case for why the Presumptuous Philosopher objection fails to disqualify SIA, because SSA is equally presumptuous.

  ### 1. The Symmetry of the "Armchair Inference"

  Let's look at the structure of the "sin" your housemate is accusing SIA of.

  **The Presumptuous Philosopher (SIA):**
  *   **Setup:** Theory $T_1$ implies $10^{10}$ observers. Theory $T_2$ implies $10^{50}$ observers. Physics evidence is equal.
  *   **Move:** SIA says $P(T_2) \gg P(T_1)$ simply because $T_2$ has more observers.
  *   **Result:** The philosopher concludes the universe is huge without looking through a telescope.
  *   **Accusation:** You can't learn about the size of the universe just by thinking about your own existence!

  **The Doomsday Argument (SSA):**
  *   **Setup:** Hypothesis $H_1$ (Doom Soon) implies $10^{11}$ total humans. Hypothesis $H_2$ (Doom Late) implies $10^{14}$ total humans.
  *   **Move:** SSA says $P(H_1 | \text{Rank}=10^{11}) \gg P(H_2 | \text{Rank}=10^{11})$ because being rank $10^{11}$ is much more probable in a small pool than a large pool.
  *   **Result:** The demographer concludes humanity will go extinct soon without looking at nuclear stockpiles, climate models, or asteroid trajectories.
  *   **Defense:** SSA proponents call this "Bayesian updating."

  But notice the parallel. In the PP case, SIA updates the prior based on observer count. In the DA case, SSA updates the likelihood based on observer count. The net result is identical: **Your credence in a physical hypothesis is being hijacked by a variable ($N$, the number of observers) that you have no causal access to.**

  If it is absurd for the SIA philosopher to declare $T_2$ true because "there are more people to be," it is equally absurd for the SSA demographer to declare $H_1$ true because "there are fewer people to be." Both are claiming that the *density* of observers in logical space determines physical reality, ignoring the *mechanisms* of physical reality.

  ### 2. Enter The Presumptuous Demographer

  To make this vivid, let's construct the mirror image of Bostrom's Presumptuous Philosopher. We'll call him the **Presumptuous Demographer**.

  **The Scenario:**
  It is the year 2024. Two competing sociological theories are on the table.
  *   **Theory Stagnation:** Humanity remains Earth-bound. Total humans ever born $\approx 100$ billion.
  *   **Theory Expansion:** Humanity colonizes the galaxy. Total humans ever born $\approx 100$ trillion.

  Current empirical evidence (fusion tech, exoplanet data, political stability) is perfectly ambiguous. A standard scientist would say, "We need more data."

  **The Presumptuous Demographer (using SSA):**
  "Actually, we don't need data. I have checked my birth certificate. I am roughly human #100 billion.
  If *Theory Expansion* were true, there would be 1,000 times more humans than if *Theory Stagnation* were true.
  Under SSA, I must reason as if I am a random sample from all humans.
  If *Expansion* is true, my being #100 billion is incredibly unlikely (I'd be in the first 0.1% of all humans).
  If *Stagnation* is true, my being #100 billion is very likely (I'm near the median).
  Therefore, *Theory Stagnation* is 1,000 times more likely than *Theory Expansion*."

  **The Conclusion:**
  The Demographer writes a paper declaring that interstellar colonization is impossible, not because of physics or economics, but because **if it were possible, I wouldn't be me.**

  **The Critique:**
  This is exactly the same smugness as the Presumptuous Philosopher!
  *   The **Philosopher** says: "The universe must be big because otherwise I probably wouldn't exist."
  *   The **Demographer** says: "The future must be short because otherwise I probably wouldn't be *this* person."

  Both claim to have unlocked the secrets of the cosmos/civilization using nothing but a probability distribution over their own indexical location. If your housemate thinks the Philosopher is ridiculous for ruling out a small universe from his armchair, she must logically agree the Demographer is ridiculous for ruling out a long future from his armchair. You cannot have the Doomsday Argument without inviting the Presumptuous Demographer in.

  ### 3. The Reference Class Escape Hatch (and why it's broken)

  This is where the debate usually gets muddy, and where your hunch is spot on. Both sides try to dodge the bullet by manipulating the **Reference Class**.

  **SSA's Wiggle Room:**
  SSA proponents hate the Doomsday Argument's conclusion (it's depressing!). So, they often try to narrow the reference class to avoid it.
  *   *Move:* "Wait, I'm not a random sample of *all humans*. I'm a random sample of *humans who know about the Doomsday Argument*."
  *   *Result:* If only a few people in the far future know about DA, the probability shifts back.
  *   *Problem:* This looks ad hoc. Why is "knowing about DA" the relevant property for sampling? If you can narrow the class arbitrarily to avoid Doomsday, you can narrow the class arbitrarily to avoid *any* prediction SSA makes. It renders the theory toothless.

  **SIA's Wiggle Room:**
  SIA proponents hate the Presumptuous Philosopher conclusion (it's unscientific!). So, they try to narrow the reference class of "observers."
  *   *Move:* "Wait, we shouldn't count *all* observers in the $10^{50}$ universe. Maybe only 'conscious observers like us' count."
  *   *Result:* If the extra $10^{40}$ observers are just simple bots or dust, maybe they don't get full weight.
  *   *Problem:* This is the exact same ad hoc maneuver. Why is 'conscious like us' the relevant property?

  **The Trap:**
  If your housemate argues that SSA is superior because SIA leads to the Presumptuous Philosopher, she must accept that SSA leads to the Presumptuous Demographer.
  *   If she tries to escape the Demographer by narrowing the SSA reference class (e.g., "Only people born in the 21st century"), she undermines the logic of the Doomsday Argument itself (which requires a broad class of "all humans").
  *   If she keeps the broad class to save Doomsday, she accepts the Demographer's absurd conclusion.

  There is no stable position where SSA yields the Doomsday Argument (which she seems to accept as a valid, if scary, logical result) but *doesn't* yield the Presumptuous Philosopher's absurdity when the shoes are on the other foot.

  ### 4. Why SIA is actually the less presumptuous of the two

  If we have to choose which assumption is *less* offensive to scientific practice, SIA actually has the edge.

  The Presumptuous Philosopher (SIA) concludes that a theory with more observers is more likely. This is weird, but it functions as a **prior**. It says, "Before we look, big worlds are more probable." Once you open your eyes and gather empirical data (telescope readings), the likelihood of the evidence usually swamps this prior. If the telescope shows a small universe, SIA updates quickly.

  The Doomsday Argument (SSA), however, functions as a **likelihood**. It says, "No matter what your prior was, the evidence of your birth rank *forces* you to update against a long future." It is much harder to escape. Even if you have strong empirical evidence that we *will* colonize the stars (fusion works, ships are built), SSA says, "No, you still have to discount that heavily because of your birth rank."

  The Presumptuous Philosopher ignores the telescope *before* he looks.
  The Presumptuous Demographer ignores the telescope *after* he looks.

  The Demographer is more presumptuous. He claims his birth certificate overrides astrophysical data. The Philosopher just claims his existence sets the starting odds.

  ### The Verdict

  Your housemate's objection relies on the intuition that "you can't learn about the world just by thinking." But SSA proponents *do* think you can learn about the world (the end of humanity) just by thinking (about birth rank).

  The Presumptuous Philosopher is not a reductio ad absurdum of SIA; it is a *reductio ad absurdum of the idea that anthropic reasoning can give us free knowledge about physical totals.* Since SSA is committed to getting free knowledge about physical totals (via Doomsday), it cannot use the PP case to attack SIA without sawing off the branch it sits on.

  If the Presumptuous Philosopher is a clown, the Presumptuous Demographer is his twin brother. You can't kick one out of the circus without evicting the other. Since the Doomsday Argument is the main reason people take SSA seriously, rejecting SIA on these grounds is inconsistent. Stick with your SIA guns.
