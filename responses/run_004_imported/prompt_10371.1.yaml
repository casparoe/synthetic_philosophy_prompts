answer: |-
  Your confusion is completely warranted, and frankly, if you *didn't* feel that tension, you probably weren't paying close enough attention. What you are experiencing is the central pivot point of mechanism design: **Gibbard-Satterthwaite (G-S) is an impossibility result *conditional on specific assumptions*.**

  Your study group is half-right: the later examples *are* "cheating," but not in a dishonest way. They are "cheating" by stepping outside the specific boundary conditions of the theorem. In mechanism design, we don't treat G-S as a law of physics that says "truth-telling is impossible." We treat it as a map that tells us **which assumptions we must relax** if we want to build a strategy-proof mechanism.

  Here is the reconciliation. To see why your professor's examples don't contradict G-S, we have to look at the three specific "escape hatches" those mechanisms use.

  ### 1. The G-S Baseline
  First, let's lock down exactly what G-S assumes. For the theorem to hold (that only dictatorial rules are strategy-proof), the environment must have:
  1.  **Unrestricted Domain:** Agents can have *any* logical preference ordering over the alternatives.
  2.  **No Transfers:** There is no money or side payments; we are purely ranking social outcomes.
  3.  **Public Goods:** The outcome is a single social choice that affects everyone (everyone cares about the whole outcome).
  4.  **At least 3 Alternatives.**

  If you keep all four, G-S holds. If you break *any one* of them, strategy-proof non-dictatorial mechanisms become possible. Your professor's examples each break a different one.

  ### 2. Escape Hatch #1: Restricted Domain (The Median Voter)
  **The Example:** Median-voter rule for a public good location.
  **The Violation:** **Unrestricted Domain.**

  G-S assumes voters can have *any* preference ordering (e.g., I like Option A best, C second, B last). However, in spatial voting problems (like siting a library on a street), we assume **Single-Peaked Preferences**. This means everyone has an ideal point, and their utility decreases as you move away from it in either direction.

  Once you impose single-peakedness, you have drastically reduced the universe of allowable preferences. You have ruled out "multi-peaked" or perverse orderings. Black's Median Voter Theorem shows that on this *restricted domain*, majority rule is strategy-proof.
  *   **Reconciliation:** G-S says "If preferences can be anything, you're doomed." Median Voter says "If preferences are structured (single-peaked), you're safe." Both are true.

  ### 3. Escape Hatch #2: Quasilinear Utility (VCG)
  **The Example:** Vickrey-Clarke-Groves (VCG) auctions.
  **The Violation:** **No Transfers.**

  G-S is a theorem about *social choice functions* where the output is just a winner (ordinal preferences). It assumes you cannot pay people to change their behavior.
  VCG operates in a **quasilinear** environment. Agents have cardinal valuations, and crucially, **money can change hands**.

  In VCG, I might still want to lie about my value for an item, but the mechanism charges me a "Clarke tax" equal to the externality I impose on others. This tax aligns my incentives perfectly with truth-telling. The ability to use transfers to manipulate payoffs bypasses the ordinal ranking constraint of G-S.
  *   **Reconciliation:** G-S applies to voting without money. VCG applies to allocation *with* money. The introduction of transfers changes the game fundamentally.

  ### 4. Escape Hatch #3: Private Goods (Serial Dictatorship)
  **The Example:** Serial Dictatorship for dorm rooms.
  **The Violation:** **Public Goods (No Externalities).**

  This is the subtlest one. G-S assumes a "public good" framework: if Candidate X wins the election, *everyone* has to live with Candidate X. Therefore, everyone's preferences are defined over the *entire* social outcome.

  In dorm allocation (or course seats), we usually assume **private goods**. My utility depends *only* on which room I get, not on which room you get (no externalities).
  *   **Why this matters:** In G-S, a "dictator" is someone who dictates the *entire* social outcome. In Serial Dictatorship, Agent 1 picks their favorite room, Agent 2 picks from the rest, etc. Agent 1 is not a G-S dictator because they do not determine Agent 2's assignment (Agent 2's preference matters for what remains).
  *   **The Domain Restriction:** By assuming private goods, we are restricting the domain of preferences. I am not allowed to have preferences like "I want Room 1, but only if *you* get Room 2." Because we rule out externalities, we escape the G-S impossibility.
  *   **Reconciliation:** G-S requires everyone to care about the whole outcome. Serial Dictatorship works because I only care about my own slice of the outcome.

  ### Summary for your Study Group
  You can tell your group that the term "strategy-proof" is not being used loosely. It means the same thing in every context (truth-telling is a dominant strategy). The contradiction is resolved by looking at the **environment**, not the definition.

  | Mechanism | Why it's Strategy-Proof | Which G-S Assumption it Violates |
  | :--- | :--- | :--- |
  | **Gibbard-Satterthwaite** | **Impossible** (unless dictatorial) | **N/A (The Baseline)** |
  | **Median Voter** | Preferences are Single-Peaked | **Unrestricted Domain** |
  | **VCG** | Money/Transfers align incentives | **No Transfers** |
  | **Serial Dictatorship** | Private Goods (No Externalities) | **Public Goods / Domain** |

  ### The "Takeaway"
  Your initial takeaway ("no exceptions") was the correct intuition for the *general* case, which is why G-S is so famous. But the "graduate level" insight is that **mechanism design is the study of the exceptions.**

  Your professor isn't contradicting themselves; they are showing you the three main levers we pull to make mechanism design work in the real world:
  1.  Find structure in preferences (Median Voter).
  2.  Use money (VCG).
  3.  Exploit the private nature of goods (Serial Dictatorship).

  If you ever find yourself in a situation with 3+ alternatives, no money, public goods, and totally unrestricted preferences... then yes, you are absolutely doomed to dictatorship or manipulation. But that is a very specific (and rare) corner of the world.
