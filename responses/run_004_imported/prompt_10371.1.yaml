prompt: |-
  In my grad mechanism design seminar we spent a whole session on the Gibbard-Satterthwaite theorem, and I came away thinking the takeaway was pretty clean: with three or more alternatives, any voting rule is either a dictatorship or someone can benefit from lying about their preferences, full stop, no exceptions. Felt like a nice tidy impossibility result, kind of like Arrow's but for strategic behavior instead of just aggregation.

  Except then in the weeks after, the same professor kept casually calling other mechanisms "strategy-proof" without blinking -- the VCG mechanism once we got to auctions, then the median-voter rule for siting a public good when everyone's preferences are single-peaked, and even a throwaway line about how "serial dictatorship" mechanisms for allocating dorm rooms or course seats are strategy-proof too. My study group got kinda stuck on this: either non-dictatorial strategy-proof mechanisms exist or they don't, so how can the theorem and all these later examples acutally be true at the same time? One guy in the group insists the later ones must be quietly cheating somehow (extra assumptions, redefined terms, whatever), but none of us could pin down what the trick actually was. Is there a real reconciliation here, or is "strategy-proof" just being used loosely across different parts of the course?
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Confusion:**
      *   **Core Belief:** The Gibbard-Satterthwaite (G-S) theorem states that *no* non-dictatorial voting rule is strategy-proof for 3+ alternatives.
      *   **Observed Contradiction:** The professor cites examples of non-dictatorial, strategy-proof mechanisms (VCG, Median Voter, Serial Dictatorship).
      *   **Question:** How can both be true? Is the professor cheating (adding assumptions) or is the term "strategy-proof" used loosely?
      *   **Context:** Graduate mechanism design seminar. The user understands the basics but is missing the specific domain restrictions or definition nuances that resolve the paradox.

  2.  **Deconstruct the Gibbard-Satterthwaite Theorem:**
      *   What are the *exact* assumptions of G-S?
      *   1. Finite set of alternatives ($|A| \ge 3$).
      *   2. Surjectivity (every alternative can win).
      *   3. **Unrestricted Domain** (preferences can be *any* strict ordering over alternatives).
      *   4. Deterministic.
      *   5. Strategy-proofness (truth-telling is a dominant strategy).
      *   *Conclusion:* The rule must be dictatorial.

  3.  **Analyze the "Counter-Examples":**
      *   **VCG (Vickrey-Clarke-Groves):**
          *   Context: Quasilinear utility (money involved).
          *   Domain: Not just ordinal rankings, but cardinal valuations with transferable utility.
          *   Does it violate G-S? Yes, it changes the domain assumption (quasilinearity) and allows transfers (which G-S doesn't account for in the standard social choice function formulation).
      *   **Median Voter Rule:**
          *   Context: Single-peaked preferences.
          *   Domain: **Restricted Domain**. Preferences aren't *any* ordering; they must align along a single dimension (peak).
          *   Does it violate G-S? Yes, it violates the "Unrestricted Domain" assumption.
      *   **Serial Dictatorship:**
          *   Context: Allocation of objects (housing, courses).
          *   Mechanism: Agent 1 picks best, then Agent 2, etc.
          *   Is it dictatorial? In the G-S sense, a "dictator" is someone who *always* gets their top choice regardless of others. In Serial Dictatorship, only the *first* agent is a dictator in that sense. The others are not.
          *   Wait, is Serial Dictatorship strategy-proof? Yes.
          *   Is it non-dictatorial? It depends on the definition of "dictatorship" in G-S. G-S says *there exists* a dictator. Serial Dictatorship has a dictator (Agent 1). So it actually *fits* the G-S conclusion if we view Agent 1 as the dictator.
          *   *Correction/Refinement:* In object allocation (house allocation), the "alternatives" are the matchings. But usually, we talk about strategy-proofness for *each* agent. Serial dictatorship is strategy-proof for everyone. Is it dictatorial? Agent 1 dictates the outcome for themselves, but not necessarily for Agent 2. However, G-S applies to Social Choice Functions (SCF) mapping profiles to a *single* winner. Serial dictatorship maps to an *allocation*.
          *   *Better explanation:* Serial dictatorship is often cited as a way to *escape* the spirit of G-S in matching markets, but technically, if viewed as an SCF over final allocations, Agent 1 is a dictator. However, the more relevant point is usually about **domain restrictions** or **quasilinearity**.
          *   *Actually, for House Allocation:* The domain is preferences over objects. Serial dictatorship is strategy-proof. Is it dictatorial? Agent 1 gets their top choice. Agent 2 gets top choice of remainder. It is not a "dictatorship" in the sense that one person decides the *whole* outcome alone (Agent 1 doesn't decide what Agent 2 gets, except by removal). But wait, G-S says *someone* dictates the social choice. In serial dictatorship, Agent 1 dictates the element assigned to them.
          *   *Key distinction:* G-S is about choosing *one* social alternative. Serial dictatorship is about allocating *multiple* objects. But more importantly, the "dictatorship" in G-S means one agent determines the *entire* outcome. In Serial Dictatorship, Agent 1 determines their own assignment, but not Agent 2's (beyond removing an object). So it's not a G-S dictatorship.
          *   *Why does it escape G-S?* Usually, house allocation problems assume **private goods** (my utility depends only on what I get), not public goods (my utility depends on the whole allocation). G-S assumes public goods (everyone cares about the social outcome). If preferences are private, the domain is restricted (I don't care what you get).
      *   **Summary of Exits:**
          1.  Restrict the domain of preferences (Median Voter).
          2.  Allow monetary transfers/quasilinearity (VCG).
          3.  Private goods vs. Public goods (Serial Dictatorship/Matching).

  4.  **Synthesize the Explanation:**
      *   Acknowledge the user's intuition: It *looks* like a contradiction.
      *   Validate the professor: The professor isn't cheating; they are relying on the specific assumptions of G-S.
      *   Identify the "Escape Hatches":
          *   **Escape Hatch 1: Domain Restriction (The Median Voter).** Explain Single-Peakedness. This is the most direct violation of G-S's "Unrestricted Domain."
          *   **Escape Hatch 2: Quasilinear Utility/Transfers (VCG).** G-S assumes ordinal preferences without money. VCG assumes cardinal utility + money. This changes the structure of the game entirely.
          *   **Escape Hatch 3: Private Goods (Serial Dictatorship).** G-S is about public social choice (everyone cares about the winner). In dorm allocation, I only care about my room. This restricts the domain of admissible preferences (no externalities).
      *   Clarify "Dictatorship": In G-S, a dictator decides the *entire* outcome. In Serial Dictatorship, Agent 1 decides their room, but not the whole allocation.
      *   Conclusion: G-S holds *ceteris paribus*. Change the assumptions, and the impossibility vanishes.

  5.  **Refine the Tone:**
