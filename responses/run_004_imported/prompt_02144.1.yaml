  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Henry Sidgwick's "Dualism of Practical Reason" (from *The Methods of Ethics*) vs. his co-founding of the Society for Psychical Research (SPR).
      *   **Core Question:** Was the psychical research a rationally serious response to a genuine gap in his ethics (empirical closure of the dualism), OR does it show his rigor was in service of wishful thinking (undercutting his ethical project)?
      *   **Constraint:** Weigh both sides but *do not cop out* with "a bit of both." Pick one, defend it decisively.
      *   **Extension:** What does this verdict imply for whether utilitarianism today can survive without that kind of metaphysical backstop?
      *   **Tone:** Academic but engaging (dissertation level), committed, argumentative.

  2.  **Initial Brainstorming & Position Selection:**
      *   *Option A (Rational Response):* Sidgwick was consistent. If ethics requires sanctions to be rational, and natural sanctions fail, looking for supernatural sanctions is a logical extension of his empiricism. It shows intellectual courage.
      *   *Option B (Wishful Thinking):* Sidgwick cracked under the pressure of his own system. The "dualism" was too painful, so he grasped at straws (ghosts/spirits) to save morality. This reveals a fatal flaw in the system itself—it demands more than reality can provide.
      *   *Decision:* Option B is more provocative and allows for a stronger critique of modern utilitarianism. It frames the psychical research not as a noble quest but as a symptom of a systemic failure. It aligns better with the prompt's hint about "undercutting the credibility." However, Option A is often the more charitable scholarly reading (e.g., Schneewind). To make a strong argument, I need to argue that *even if* he thought it was rational, the *necessity* of it proves the ethical system is broken. Actually, let's go with a nuanced version of Option B: The psychical research wasn't just a hobby; it was a *desperate repair job* that reveals the structural instability of Sidgwickian utilitarianism. It shows that without a metaphysical backstop, the system self-destructs. This allows me to defend the "wishful thinking" angle while acknowledging his internal logic.
      *   *Refined Position:* Sidgwick's turn to psychical research was not a rational extension of his method, but a confession of its failure. It demonstrates that his rigorous empiricism could not sustain the moral demands he placed upon it. Therefore, modern utilitarianism must abandon the demand for rational reconciliation of duty and self-interest.

  3.  **Outline Structure:**
      *   **Title:** Needs to be punchy. Something about ghosts, dualism, and the collapse of duty.
      *   **Introduction:**
          *   Hook: The stark contrast between the cold rigor of *Methods* and the seances of the SPR.
          *   Context: The Dualism of Practical Reason (Egoism vs. Utilitarianism).
          *   Thesis: Sidgwick's psychical research was not a rational supplement but a symptom of systemic collapse. It reveals that 19th-century utilitarianism required a theological scaffolding it could no longer honestly affirm.
          *   Roadmap: Analyze the Dualism, analyze the SPR motivation, argue it was wishful thinking disguised as empiricism, conclude on implications for modern utilitarianism.
      *   **Body Paragraph 1: The Dualism as Crisis.**
          *   Explain *Methods of Ethics* conclusion.
          *   Reason cannot reconcile self-interest and universal good without sanctions.
          *   The "Cosmos of Duty" vs. "Chaos."
          *   Sidgwick's agnosticism leaves a void.
      *   **Body Paragraph 2: The SPR as "Empirical Theology."**
          *   Sidgwick's hope: Evidence of afterlife/karmic justice.
          *   His claim: It's scientific inquiry.
          *   Counter-argument: The motivation wasn't curiosity; it was *need*. He needed the universe to be moral.
      *   **Body Paragraph 3: The Verdict (Wishful Thinking).**
          *   Why this isn't "rationally serious."
          *   It violates his own evidentiary standards (low bar for psychical claims compared to ethical axioms).
          *   It shows the ethical system is holding its breath.
          *   The rigor was in service of a conclusion he desperately wanted to be true.
      *   **Body Paragraph 4: Implications for Modern Utilitarianism.**
          *   If Sidgwick needed ghosts, do we?
          *   Modern secular utilitarianism (Singer, etc.).
          *   Argument: We must accept the Dualism. Morality is not always rational in the self-interested sense.
          *   Utilitarianism survives only by lowering its claim from "Rational Necessity" to "Compelling Intuition/Commitment."
      *   **Conclusion:**
          *   Restate thesis.
          *   Final thought: Sidgwick's ghosts haunt utilitarianism still. We must exorcise them by accepting the lack of cosmic justice.

  4.  **Drafting - Key Arguments & Nuance:**
      *   *Schneewind's View:* J.B. Schneewind argues Sidgwick was consistent. I need to push back against this. Consistency isn't enough; *viability* matters.
      *   *The "Need" vs. "Evidence":* Sidgwick admitted he *needed* the evidence to exist. That's the smoking gun for wishful thinking.
      *   *The Modern Implication:* If we remove God/Afterlife, does Egoism win? Not necessarily. It means we stop pretending Egoism is rationally equivalent to Morality. We make a leap of faith (or commitment) to the moral point of view.

  5.  **Refining the Tone:**
      *   Avoid being too dismissive of Sidgwick (he's a giant), but be firm on the critique.
      *   Use terms like "metaphysical backstop," "rational coherence," "empirical desperation."
      *   Ensure the transition from the historical analysis to the modern implication is smooth.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I pick a side? Yes, I'm arguing it was wishful thinking that undermines the project's claim to pure rationality.
      *   *Check:* Did I address the modern implication? Yes, modern utilitarianism must drop the claim of rational supremacy over egoism.
      *   *Check:* Is the connection clear? The SPR wasn't a hobby; it was an attempt to solve the *Methods* problem.

  7.  **Final Polish:** Check flow, strengthen the thesis statement, ensure the conclusion lands hard. (Make sure to emphasize that Sidgwick's *honesty* about the dualism is admirable, but his *solution* is the failure point).

  *(Self-Correction Note)*: Wait, I need to be careful not to say Utilitarianism *fails* today, but that it must change its *foundation*. It survives by abandoning Sidgwick's demand for rational reconciliation.

  8.  **Finalizing the Argument:** The essay will argue that Sidgwick's psychical research was a desperate attempt to patch a hole that shouldn't exist. The hole exists because he demanded morality be rational for the *agent*. Modern utilitarianism must accept that morality is sometimes irrational for the agent, thus sidestepping the need for ghosts.

