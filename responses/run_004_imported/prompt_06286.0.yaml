      *(Self-Correction during drafting)*: I need to make sure I don't just say "Nietzsche hates everything." I need to be specific about *why* RJ fits the "priestly" mode of punishment (making the sinner feel guilty) rather than the "noble" mode (settling the debt and forgetting). Essay II distinguishes between the noble morality (forgetting) and the priestly morality (remembering/ruminating). RJ demands rumination. That's a key point.

