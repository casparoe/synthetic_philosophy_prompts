answer: |-
  # The Common Prior as Social Contract: Adjudicating the Harsanyi Doctrine

  The debate between your friend, the economist, and you, the epistemologist, recapitulates a foundational rift in the theory of rational belief. On one side stands the Harsanyi Doctrine: the claim that rational agents, stripped of private information, must converge on a single probability distribution over the state space. On the other stands the Subjectivist intuition: that priors are psychological starting points, and rationality is merely the coherent updating of whatever hand one is dealt.

  Your friend argues that the Common Prior Assumption (CPA) is a requirement of ideal rationality. You argue it is an unfalsifiable modeling convenience that contradicts empirical reality. The tension culminates in the "no-trade" theorems: if the CPA holds and rationality is common knowledge, speculative trade should vanish. Yet, markets are defined by speculative volume.

  To adjudicate this, we must look past the technical machinery of Aumann's Agreement Theorem and ask what the CPA actually *does*. It is not a law of logic, nor is it a mere convenience. **The verdict is this: The CPA is not a constraint on individual rationality, but a normative commitment to a shared epistemic community.** It is warranted only when agents adopt the goal of consensus truth-seeking (as in science or policy), but it is false as a universal constraint on belief. The empirical ubiquity of speculative trade does not prove agents are irrational; it proves that markets are arenas where agents rationally exploit the very prior divergence the CPA forbids.

  ### The Strongest Case for the Common Prior

  Your friend's position rests on a compelling normative intuition: **Rationality as Impartiality.**

  If two agents are truly rational, their beliefs should be determined by the evidence, not by their identity. If Agent A and Agent B are placed in the exact same position in the universe—same sensory inputs, same cognitive capacities, same history—and they arrive at different probabilities for an event, at least one of them must be malfunctioning. To allow priors to differ is to allow "brute facts" about the agent (their psychology, their culture) to dictate beliefs about the world.

  Harsanyi's argument is that any difference in belief must be traceable to a difference in information. If we cannot trace it to information, we are left with the absurdity that the universe looks different to two identical cameras. By enforcing a common prior, we enforce the idea that probability is a feature of the *world* (or the relation between evidence and world), not a feature of the *mind*.

  Furthermore, your friend is correct that the "gerrymandering" objection—that any belief state can be modeled as a common prior plus private info—is not a knockout blow. In game theory, the CPA is not about psychological history; it is about **counterfactual consistency**. If I claim to have a different prior than you, I am implicitly claiming that if you had my information, you would believe what I believe, but if I had your information, I would *not* believe what you believe. The Harsanyi line demands symmetry: if we are both rational, we must agree on how information *should* map to belief. The CPA codifies this shared mapping function. Without it, "agreeing to disagree" becomes a shield for dogmatism, allowing agents to dismiss counter-evidence by retreating into "well, that's just my prior."

  ### The Strongest Objections: Unfalsifiability and the Market

  However, your objections strike at the descriptive and metaphysical validity of the assumption.

  First, the **Origin Problem**. Priors do not descend from heaven; they are products of evolution, culture, and neurology. There is no agent-neutral fact of the matter that dictates the correct prior for a complex, one-off event (like a financial crash or an election). To demand a common prior is to demand that all rational agents share the same cognitive architecture. This conflates *coherence* (internal consistency) with *convergence* (external agreement). A subjective Bayesian can be perfectly coherent while starting from a different point than you.

  Second, and more devastating, is the **Unfalsifiability Trap**. As Stephen Morris (1995) demonstrated, any model with heterogeneous priors can be mathematically transformed into a model with a common prior and expanded information partitions. If you observe two agents disagreeing, a CPA defender can always say, "They actually share a prior, but Agent A has private information *that they know but cannot articulate* which shifts their posterior." If the assumption can explain both agreement and disagreement by adjusting the information structure, it loses its empirical bite. It becomes a definition rather than a theory.

  Finally, there is the **Trading Volume Puzzle**. The Milgrom-Stokey no-trade theorem shows that if traders share a prior and know each other to be rational, they cannot agree to a speculative trade. Any offer to trade signals private information that moves the price until the surplus vanishes. The fact that real markets exhibit massive volume implies that traders *do not* believe they share a prior with their counterparty. They believe they have a "better" model of the world. If your friend insists the CPA holds, she must conclude that the entire financial sector is systematically irrational. While possible, it is more parsimonious to suspect the axiom than the population.

  ### The Verdict: CPA as a Normative Social Contract

  The tension between the Agreement Theorem and market reality is resolved by recognizing a category error in the debate. Your friend treats the CPA as a **constitutive constraint on rationality** (like non-contradiction). You treat it as a **descriptive claim about psychology**. Both are partially wrong.

  **The CPA is a normative requirement for *epistemic communities*, not individual agents.**

  When agents enter a context where the goal is *coordination* or *truth-discovery* (e.g., a scientific collaboration, a jury, a policy committee), they implicitly sign a social contract to treat their probability space as common. In these contexts, divergent priors are treated as errors to be corrected, not assets to be exploited. Here, the Harsanyi line is correct: if we are trying to find the truth together, I must treat your evidence as if it were mine, which requires us to agree on how evidence weighs. In this specific domain, the CPA is a necessary regulative ideal.

  However, in contexts of **competition** (e.g., financial markets, poker, litigation), the goal is not consensus but exploitation. Here, prior divergence is the source of value. A trader makes money precisely because they believe their prior (their model of the world) is superior to the market's prior. To accept the CPA in a market is to accept that the market price is a sufficient statistic for all information, which renders trading pointless.

  Therefore, the empirical ubiquity of speculative trade does not show that agents are irrational. It shows that **agents rationally reject the CPA when incentives reward divergence.**

  ### Defending the Verdict

  This verdict invites two strong objections, which must be addressed to solidify the position.

  **Objection 1: The Dogmatism Objection.**
  If we allow priors to differ, don't we allow anything? If a conspiracy theorist says, "My prior assigns high probability to the moon landing being fake," and we reject the CPA, must we respect that as "rationally permissible"?
  *Rebuttal:* No. Rejecting the CPA as a *universal* constraint does not mean abandoning all constraints on priors. We can still demand that priors be regular (assign non-zero probability to possible events) and that updating be Bayesian. Furthermore, we can argue that while priors may differ, they are subject to *pragmatic* evaluation. A prior that consistently leads to poor predictions (like the conspiracy theorist's) is instrumentally irrational, even if it isn't logically contradictory. The CPA is too strong a tool to fight dogmatism; we can fight it with calibration and predictive success instead.

  **Objection 2: The Modeling Objection.**
  Your friend might argue: "Even if CPA isn't metaphysically true, it's the only way to build tractable game-theoretic models. Without it, we can't define equilibrium."
  *Rebuttal:* This concedes the main point: that CPA is a *modeling convenience*, not a law of rationality. But we can go further. Models with heterogeneous priors *are* tractable and often more accurate for market behavior (e.g., models of bubbles). Insisting on CPA in economics is not just a convenience; it is an ideological commitment to market efficiency that blinds the discipline to the mechanisms of speculation. By adopting the verdict that CPA is context-dependent, economists can use it for cooperative game theory (mechanism design) and drop it for competitive game theory (market microstructure), resolving the trading-volume puzzle without declaring traders irrational.

  ### Conclusion

  The train ride argument ended in circles because you were arguing past each other's domains. Your friend was defending a **normative ideal of scientific consensus**, where disagreement is a failure of information or logic. You were defending a **descriptive reality of cognitive diversity**, where disagreement is a natural consequence of distinct starting points.

  The Common Prior Assumption is not a truth about the universe, nor is it a mere mathematical trick. It is a **boundary condition for cooperation**. It holds when agents commit to a shared epistemic project where the goal is to merge perspectives. It fails when agents engage in strategic competition where the goal is to leverage perspective differences.

  The tension between Aumann's theorem and Wall Street is not a paradox. It is a diagnostic tool. When we see agreement, the CPA is likely in force (shared community). When we see speculative volume, the CPA has been rationally suspended (competitive market). To demand the CPA universally is to demand that the world be a single scientific laboratory. To reject it universally is to deny the possibility of shared truth. The rational agent knows the difference.
