          *   *Application:* Is the user avoiding writing because it's hard (akrasia) or because the project is flawed/new info suggests a pivot (legitimate change)?
      *   **The "Two Selves" Problem (Parfit/Schelling):**
          *   If we view selves as sequential, Past Self binding Present Self looks like colonialism.
          *   *Resolution:* We need a concept of "Higher-Order Volitions" (Frankfurt). Past Self represents the *reflective* self; Present Self is the *impulsive* self. Legitimacy comes from aligning with the reflective self.
      *   **Holmes's Enabling Constraint:**
          *   Reframe the contract not as a shackle but as the structure that makes the "Dissertator" identity possible. Without it, the goal is unreachable.
