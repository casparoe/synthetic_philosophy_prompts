          *   In cases like the Cube Factory (side length vs. volume) or Wine/Water (ratio vs. reciprocal), there are no obvious geometric symmetries to select the "correct" parameterization.
          *   Jaynes's solution works for the circle because the circle *has* those symmetries. It doesn't solve the underlying epistemological problem of how to choose parameters in abstract problems.
