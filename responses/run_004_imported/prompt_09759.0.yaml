  *(Self-Correction during final review)*: Make sure I don't get the Cube Factory probabilities wrong. If side $s \sim U[1,3]$, $P(s<2) = 1/2$. Area $A = s^2 \sim U[1,9]$. If $A \sim U[1,9]$, then $P(A<4) = 3/8$. But if $s \sim U[1,3]$, $P(A<4) = P(s<2) = 1/2$. The paradox is usually stated: "Pick a cube with side between 1 and 3. Prob(side < 2)?" vs "Pick a cube with area between 1 and 9. Prob(area < 4)?" If the distribution is uniform on one, it's not uniform on the other. Jaynes argues scale invariance implies $f(s) \propto 1/s$. I need to be careful not to misrepresent Jaynes's specific solution to the cube problem, which relies on scale invariance leading to a logarithmic distribution, not necessarily uniform. Actually, for the cube, Jaynes often argues that if the problem is well-posed regarding units, scale invariance dictates the distribution. I will focus on the tension between "uniformity" and "invariance."

