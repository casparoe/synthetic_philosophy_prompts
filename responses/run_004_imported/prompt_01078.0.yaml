answer: |-
  The whiteboard was still covered in payoff matrices, the markers dried out on the tray. The rest of the reading group had peeled away an hour ago, lured by the promise of sleep or drinks, but Elena and Marcus remained, surrounded by stacks of photocopies: Lewis's *Convention*, Bicchieri's *The Grammar of Society*, and a pile of papers on strong reciprocity.

  Elena capped a red marker and tapped it against the board, right next to a drawing of a coordination equilibrium. "You're conceding too much to the intuition pump, Marcus. The Fehr and Gächter data doesn't break the Lewisian framework; it just expands the utility function."

  Marcus leaned back in his chair, rubbing his temples. "It doesn't expand the utility function; it breaks the logic of the game. Lewis is about solving coordination problems where interests coincide. 'Which side of the road?' 'Which file format?' The equilibrium is self-enforcing because deviation hurts *you*. Fehr and Gächter show people paying to hurt *others* in one-shot anonymous games. There is no future reputation to protect. No recursive expectation of future gain. It's pure cost. If you model that as 'utility,' you've made utility theory unfalsifiable."

  "Unfalsifiable? No. Predictive," Elena countered. "Look, Lewis solves the infinite regress of 'I think that you think that I think' by grounding it in a *basis*. A shared signal. Bicchieri takes this further. She distinguishes empirical expectations (I think you'll do X) from normative expectations (I think you expect me to do X, and will sanction me if I don't). Once those normative expectations are common knowledge, compliance becomes the rational choice *given* the preference to avoid sanctions or social friction."

  "But in the one-shot game, there *are* no sanctions," Marcus said. "The subject punishes the defector *knowing* they will never meet again. They pay $1 to subtract $3 from a stranger's pot. A Lewisian agent asks: 'What is the coordinating regularity here?' There isn't one. There's no convention to punish. It's not like driving on the right. If everyone decided tomorrow to stop punishing strangers in one-shot games, no coordination would collapse. So why do they do it?"

  "Because the preference for norm enforcement is internalized," Elena said, turning to face him. "Evolution doesn't work on a case-by-case basis. It selects for heuristics. In the Environment of Evolutionary Adaptedness, one-shot games were vanishingly rare. Almost every interaction was repeated or observable by the tribe. So, natural selection builds a cognitive module that *treats* norm violations as sanctionable events, full stop. When a modern subject sits in a lab, that module fires. They feel anger. They punish. From the agent's perspective, they are maximizing utility—satisfying their preference for justice. From the modeler's perspective, we just include 'fairness' as a variable in the utility function. Fehr himself does this. It's still rational choice."

  Marcus shook his head slowly. "That's an evolutionary explanation of the *origin* of the preference, Elena. I'm talking about the *logic* of the norm. Lewis's conventions are arbitrary. We could drive on the left. We could drive on the right. The only thing that matters is that we agree. But moral norms aren't arbitrary in that way. We don't say, 'It's wrong to kill because we all expect each other not to kill.' We say, 'It's wrong to kill, full stop.' The feeling of *resentment*—to use Strawson's term—implies a claim-right. It implies the violator *owed* me better. A Lewisian expectation is just a prediction. If I predict it will rain and it doesn't, I'm disappointed. If I expect you to drive on the right and you don't, I'm inconvenienced. But if you steal from me, I'm *aggrieved*. That qualitative difference matters."

  "Bicchieri addresses this," Elena insisted. "She argues that conditional preferences transform the payoff structure. I prefer to comply *if* I believe others comply and expect me to. When you violate that, you aren't just changing the outcome; you're violating the condition under which I agreed to cooperate. The 'resentment' is the emotional marker of a breached contract. It's a signal that the equilibrium is unstable."

  "A breached contract implies a prior agreement," Marcus said. "But in the Public Goods Game, there is no contract. There's just a setup. And here's the rub: Lewisian conventions rely on common knowledge of the *basis*. Everyone sees the signpost. But moral norms often persist *without* common knowledge of universal compliance. I can feel guilty for cheating on my taxes even if I know for a fact that everyone else is cheating. If it were a Lewisian convention, the collapse of the regularity should dissolve the obligation. If everyone drives on the left, my obligation to drive on the right vanishes. But if everyone cheats, my obligation not to cheat doesn't necessarily vanish. In fact, I might feel *more* guilt because the system is collapsing."

  Elena paused. She picked up a piece of chalk, then put it down. "That's a strong point. Bicchieri would call that a 'quasi-norm' or a fading norm. But let's look at the inverse. If everyone is honest, and I cheat, I feel guilt. Why? Because I know my action, if universalized, would destroy the equilibrium. It's a Kantian twist on Lewis. I'm protecting the *system* of expectations."

  "But why do I care about the system?" Marcus pressed. "In a Lewisian world, I care about the system because I want to coordinate. I want to get home without crashing. In the moral world, I care about the system even when coordination doesn't benefit me. Consider the 'last person on earth' thought experiment. If I were the last human, Lewisian conventions dissolve. There's no one to coordinate with. But would it be 'wrong' to desecrate a grave? Many people feel it would be. There's no coordination equilibrium to protect. No sanctions. No expectations. Just a violation of a norm."

  "The last person on earth is a edge case that breaks all social theory," Elena dismissed. "Let's stick to the Fehr data. You say the resentment proves there's a non-instrumental sentiment at work. I say the sentiment *is* the instrument. Gibbard's expressivism says when I say 'X is wrong,' I'm expressing my acceptance of norms that sanction X. That fits Lewis! It's about the sanctioning system. The anger is just the psychological mechanism that enforces the equilibrium. Why posit a magical 'moral reality' when 'evolved enforcement heuristic' does the work?"

  "Because the heuristic isn't tracking equilibrium," Marcus said, leaning forward. "It's tracking *fairness* defined independently of equilibrium. Boyd and Richerson show that costly punishment evolves because it stabilizes cooperation in groups. But the *mechanism* that evolves is not a calculation of stability. It's an emotional response to *intent* and *harm*. If I accidentally bump into you, you don't resent me. If I shove you, you do. A Lewisian agent should care about the outcome—the coordination failure. But moral agents care about the *will* of the other. That requires a Theory of Mind that goes beyond 'I expect you to expect.' It requires 'I judge your intentions against a standard.'"

  "Standards can be equilibria," Elena said. "Focal points."

  "Not when the standard demands I lose," Marcus shot back. "That's the core of it, Elena. A convention is a solution to a problem. 'Where shall we meet?' 'Noon.' 'Which side of the road?' 'Right.' Both parties gain from the convention existing. Moral norms often involve one party losing for the sake of the other, or for the sake of an abstract principle. The martyr doesn't coordinate. The whistleblower disrupts the equilibrium of silence. If normativity were just Lewisian convention, whistleblowing would be irrational by definition. It's a deviation from the local regularity. But we call it *moral*."

  Elena sighed, walking over to the window. The streetlights outside were flickering on. "So you think the Lewisian project is hopeless for morality? That we need to posit a separate cognitive faculty?"

  "I think Lewis explains *conventions*. Bicchieri explains *social norms*—which are a hybrid. But neither explains *moral norms* fully because they ground the 'ought' in the 'is' of expectations. They say: 'You ought to do X because everyone expects X and will punish not-X.' But morality often says: 'You ought to do X even if everyone expects not-X and will punish X.' The Lewisian account can't generate that kind of bite without smuggling in a prior moral premise about which expectations are valid."

  Elena turned back. "Okay. Let's grant that. But here is my pushback. You say the 'bite' comes from evolved sentiments. Fine. But how do those sentiments coordinate? If my anger tells me to punish, and your anger tells you to defend, we have a war, not a norm. For a moral norm to exist, my resentment and your guilt must *align*. They must be about the same things. That alignment *is* a coordination equilibrium. We have coordinated on *what* triggers the sentiment. Lewis explains the alignment; evolution explains the engine. You can't have the norm without the coordination."

  Marcus nodded slowly. "I'll accept that. The *content* of the norm requires coordination. We have to agree that 'killing' is the trigger, not 'wearing red hats.' Lewis explains how we synchronize our moral sentiments. But he doesn't explain why the sentiments exist in the first place, or why they feel like *obligations* rather than *preferences*."

  "Is that distinction functional?" Elena asked. "If I act the same way, if I punish the same way, does it matter if I call it 'obligation' or 'strong preference'?"

  "It matters for the theory," Marcus said. "If it's a preference, I can trade it off. 'I'll let this murder slide if you give me a sandwich.' If it's an obligation, it's lexicographically ordered. It trumps preference. Lewisian agents trade off. Moral agents forbid. If you model the forbidder as an agent with a very high price on murder, you miss the structural difference. You miss the fact that the norm *constitutes* the agency. It doesn't just constrain it."

  Elena walked back to the table and started gathering her papers. "So where does that leave us? You think the Lewisian machinery is necessary for the synchronization of norms, but insufficient for the normative force."

  "Exactly," Marcus said. "Lewis gives us the grammar. But he doesn't give us the semantics. He explains how we know we're playing the same game. He doesn't explain why we feel we *should* play it, especially when the payoff matrix says 'defect.' For that, you need the evolutionary story about moralistic aggression and the internalization of sanctions as guilt. You need the sentiment to be the bedrock, not the expectation."

  "And I think," Elena said, slinging her bag over her shoulder, "that you're reifying 'sentiment' to avoid admitting that 'preference' is just a more general term for the same thing. If the sentiment causes the action, it's in the utility function. If it's in the utility function, it's rational choice. You want to keep 'morality' special. I want to keep 'rationality' general."

  "Maybe," Marcus smiled tiredly. "Or maybe you're trying to solve a hardware problem with software. Lewis wrote code for coordination. But morality is the operating system."

  "Then the reading group next week is going to be fun," Elena said. "We're discussing Gibbard. I assume you've read *Wise Choices, Apt Feelings*?"

  "Twice," Marcus said. "He's on my side. He thinks norms are about expressing acceptance, not tracking truth."

  "We'll see," Elena said, opening the door. "Gibbard still uses a decision-theoretic framework. He hasn't left the building yet."

  "Neither have I," Marcus replied. "But I'm looking for the exit."

  They stepped out into the hallway, the argument unresolved, the gap between coordination and obligation still stretching wide between them.
