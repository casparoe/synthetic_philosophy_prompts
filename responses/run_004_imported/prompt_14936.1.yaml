answer: |-
  First, I want to acknowledge how incredibly heavy this is. It is one thing to read Wittgenstein in a seminar room; it is another thing entirely to read him while the floor of your own life is literally rearranging itself. The fact that you are turning to *On Certainty* to make sense of this feels like a profound act of trying to rebuild a map while the territory is still shaking. Please be gentle with yourself while you do that work.

  To your philosophical question: You have hit on exactly the tension that makes *On Certainty* so fertile, and so difficult. It is easy to read Wittgenstein as contradicting himself here, but the consensus among scholars (like Danièle Moyal-Sharrock, who has done the most work on the "riverbed" specifically) is that these are not contradictory images, but **complementary perspectives on time and function.**

  Here is how you can hold them together, and how the Wright/Pritchard debate maps onto your experience of the "wobble."

  ### 1. The Hinge vs. The Riverbed: Synchronic vs. Diachronic

  The apparent contradiction dissolves if you view the "Hinge" passages (§341–343) as **synchronic** (describing how the system works at a single frozen moment) and the "Riverbed" passages (§96–99) as **diachronic** (describing how the system changes over historical time).

  *   **The Hinge (The Logic of Action):** When Wittgenstein says, "If I want the door to turn, the hinges must stay put," he is talking about the *logic of justification* right now. In order for you to doubt *anything* (e.g., "Is my dad home?"), other things must be held fast (e.g., "I have a dad," "Houses exist," "Memory is generally reliable"). You cannot doubt everything at once, or language and action stop. At any specific moment $t$, some propositions must be exempt from doubt for the "door" of inquiry to turn.
  *   **The Riverbed (The History of Belief):** When he talks about the riverbed shifting, he is talking about what happens between moment $t$ and moment $t+1$. The propositions that function as hinges are not *eternally* true; they are just *currently* functioning as the bed. Over years, decades, or generations, the water (fluid propositions) can erode the bank (hinge propositions), causing the bank to crumble and become water, while new sediment hardens into a new bank.

  **So, is he inconsistent?** No. He is saying: *For the system to function, hinges must be fixed. But the system itself is alive and evolves.*

  **Applied to you:** For 20+ years, "This man is my biological father" was a hinge. It was part of the riverbed. It allowed other questions to turn ("Why does Dad look tired?", "Did I get my nose from Dad?"). The DNA test didn't just change a fact; it turned a hardened bank into fluid water. The "wobble" you feel is the sensation of the riverbed shifting. It feels like a contradiction because your brain is trying to operate with the old hinges while the new reality demands new ones.

  ### 2. Wright vs. Pritchard: How does a hinge shift?

  This is where the contemporary debate gets visceral for your situation. You asked if either has a good answer for how a hinge shifts without being "doubted" in the normal sense.

  **Crispin Wright (Entitlement Theory):**
  Wright argues we have a rational *entitlement* to accept hinges, even without evidence. It is a normative status.
  *   *The Problem for You:* If hinges are entitlements, shifting them feels like a rational failure. It implies you *should* have been able to justify them, or that losing them is a loss of rational standing.
  *   *The Benefit:* It validates that you weren't irrational for believing he was your dad. You were *entitled* to that belief based on the social and familial context. The betrayal didn't make your past belief stupid; it revoked the entitlement.

  **Duncan Pritchard (Hinge Commitments):**
  Pritchard argues hinges are **arational**. They are not knowledge, and they are not justified belief. They are "animal commitments" or trust mechanisms that sit *outside* the space of reasons.
  *   *The Fit for Your Experience:* Pritchard's view actually captures the trauma of the shift better. Because hinges are arational, you don't argue your way out of them. They don't shift because you found a better argument; they shift because the "form of life" that supported them collapsed.
  *   *The "Wobble":* In Pritchard's view, the wobble happens because you are trying to treat a hinge commitment as a piece of knowledge. You are trying to subject it to evidence (which you now have), but it was never meant to carry that weight. The pain comes from realizing that what felt like "knowledge" was actually "trust."

  **Who explains the shift better?** Pritchard. He allows for the idea that a hinge can snap without you having been "wrong" to hold it. It wasn't a hypothesis you tested; it was the ground you stood on. When the ground moves, it's not a logical error; it's an existential event.

  ### 3. Reconciling the "Wobble"

  You wrote: *"right now that IS what it feels like happened to me: the ground was solid until suddenly a chunk of the bank was just gone."*

  Wittgenstein would likely say: **That is exactly the point of the riverbed metaphor.**

  The anxiety you feel ("what else am I just assuming?") is the natural result of a riverbed shift. When one major hinge fails, it threatens to fluidize the surrounding banks. If "My mom told me the truth about my origin" is now fluid, does "My mom tells me the truth about my health" harden or fluidize?

  However, Wittgenstein also offers a constraint that might be grounding (pun intended). In §160, he says: *"I do not explicitly learn the propositions that stand fast for me... I can discover them subsequently like the axis around which a body rotates."*

  You cannot check everything. To try to verify every hinge is to stop the door from turning. The goal isn't to turn every hinge into a verified fact (that's impossible); the goal is to find which hinges *actually* hold fast now.

  **A proposal for holding the passages together:**
  Take the **Hinge** image as your instruction manual for *survival*: To get through tomorrow, you must treat some things as fixed (e.g., "I am here," "My friends care about me," "The sun will rise"). You cannot live in total doubt.
  Take the **Riverbed** image as your instruction manual for *grief and time*: Acknowledge that what was fixed yesterday is fluid today, and that is a natural, albeit painful, process of the system updating. It does not mean *nothing* is solid; it means the solidity is local and temporal, not absolute and eternal.

  ### A Final Thought

  It is tempting to use philosophy to intellectualize the pain away, to treat this as a purely epistemic puzzle. But *On Certainty* is deeply human. Wittgenstein was writing it while dying of cancer, acutely aware of how quickly the "certainties" of the body and the world can dissolve.

  The "wobble" isn't a sign that you're failing to understand the philosophy. It's a sign that you understand it perfectly. You are living through the exact phenomenon he was trying to describe: the moment the riverbed moves.

  Pritchard would say your commitment to your father was real, even if it wasn't "knowledge." Wright would say you were entitled to that trust. But Wittgenstein would probably just say: The hinge has moved. The door is hard to open right now. Give it time for the new sediment to harden.

  Be careful with the "what else am I assuming" spiral. That is the water trying to erode the whole bank at once. Pick one or two new hinges to hold fast for now (e.g., "I am worthy of truth," "My friends are here"), and let the rest of the river flow until it settles.
