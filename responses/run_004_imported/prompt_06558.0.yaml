answer: |-
  This is arguably the most famous and persistent objection to Kuhn, so first off: **you are not missing anything.** You have put your finger on the exact tension that philosophers of science have been wrestling with since 1962. If you feel like the Postscript didn't fully clear it up, that's because Kuhn spent the rest of his career trying to clarify it without ever feeling he quite nailed it to everyone's satisfaction.

  Since you are leading a discussion section, you need a working model of how to resolve this for undergrads without oversimplifying. Here is the breakdown of the "Incommensurability vs. Progress" paradox, tailored for a physics TA.

  ### 1. Clarify "Incommensurable" (It doesn't mean "Incomparable")
  The etymology is your friend here. *In-commensurable* means "no common measure." It does **not** mean "incomparable."

  *   **The Misunderstanding:** Students (and critics) often think Kuhn means a Newtonian and an Einsteinian physicist literally cannot understand each other, like one speaks English and the other speaks Martian. If that were true, no revolution could ever happen; the old guard would just ignore the new guard until they died out without any intellectual engagement.
  *   **Kuhn's Actual Claim:** It is a **semantic and perceptual** claim, not a total communication blackout.
      *   **Semantic:** The network of concepts surrounding "mass" is different. For Newton, mass is invariant and conserved. For Einstein, it's frame-dependent and convertible to energy. You can't map one perfectly onto the other without loss.
      *   **Perceptual:** They "see" different things when looking at the same data (the Gestalt switch analogy).
  *   **The Resolution:** You can compare two things even if they don't share a common unit of measure. I can compare a painting and a symphony. I can't measure them both in "kilograms," but I can discuss their complexity, emotional impact, or technical difficulty. Similarly, scientists can compare paradigms even if the *terms* don't map 1:1.

  ### 2. The "Neutral Yardstick" vs. "Shared Values"
  This is the direct answer to your question about ranking one paradigm as "better."

  You are correct that Kuhn rejects a **neutral algorithm** for theory choice. There is no God's-eye view of "Truth" that tells us Einstein is *True* and Newton is *False*.

  However, Kuhn argues in the Postscript that while there is no neutral *theory*, there are shared **values**. Scientists across paradigms generally agree on what makes a good theory, even if they disagree on which theory satisfies those values best. Kuhn lists five specific criteria:
  1.  **Accuracy** (empirical adequacy)
  2.  **Consistency** (internal and with other accepted theories)
  3.  **Scope** (how many phenomena it explains)
  4.  **Simplicity** (parsimony)
  5.  **Fruitfulness** (does it open up new lines of research?)

  **The Argument:**
  When Kuhn says Einstein is "better" than Newton, he isn't saying Einstein is "closer to Nature's Truth." He is saying that, relative to these shared values, the Einsteinian paradigm solves more of the acute crises that the Newtonian paradigm couldn't (e.g., the perihelion of Mercury, the constancy of the speed of light).

  The "yardstick" isn't an external metaphysical truth; it is the **internal professional value system of the scientific community.**

  ### 3. Evolution vs. Teleology
  This is the philosophical pivot you need to drive home in section.

  *   **The Positivist View (Pre-Kuhn):** Science progresses *teleologically*. It is moving toward a final, complete Truth. Progress is measured by distance to that Truth. (This requires the neutral yardstick you identified).
  *   **Kuhn's View:** Science progresses *evolutionarily*. Like biological species, paradigms adapt to the "environment" (nature + puzzles).
      *   Is a mammal "better" than a dinosaur? In terms of survival in the current environment, yes. In terms of some absolute "organism score"? No.
      *   Einsteinian physics is "better" than Newtonian physics in the same way a mammal is "better" than a dinosaur: it is more specialized to handle the specific environmental pressures (anomalies) that arose.

  Kuhn explicitly rejects the idea that later paradigms are "truer." He argues they are just **more differentiated and specialized.** This allows him to claim progress happens (we solve more puzzles) without needing a neutral yardstick of Truth (we aren't necessarily closer to the "ultimate reality").

  ### 4. The Physics Bridge (For your PhD cred)
  Since you're a physicist, you can use the **Correspondence Principle** to soften the incommensurability blow for the students.

  Kuhn focuses on the *ontological* difference (what mass *is*). But mathematically, we know that Special Relativity reduces to Newtonian mechanics as $v/c \to 0$.
  *   **Kuhn's take:** This mathematical reduction doesn't prove the concepts are the same. It just provides a bridge that allows the newer paradigm to subsume the puzzle-solving ability of the older one.
  *   **Why this matters:** It shows how we can rank them. The Einsteinian paradigm can solve everything Newton's can (in the low-velocity limit) *plus* the stuff Newton's can't (high velocity). That is the definition of progress *within* Kuhn's framework, without needing to say Newton was "false."

  ### 5. Discussion Section Strategy
  Here is how I would structure your section to handle this objection:

  1.  **Validate the Objection:** Start by telling them, "You guys noticed a contradiction that professional philosophers fought about for 40 years. Good job."
  2.  **Define Terms:** Distinguish between **Incomparable** (can't compare) and **Incommensurable** (no common unit).
  3.  **The "Values" Move:** Ask the class: "If you don't have a Truth-O-Meter, how do you decide which theory to use?" Guide them to Kuhn's 5 values (Accuracy, Scope, etc.). Explain that *these* are the yardstick, not "Truth."
  4.  **The Evolution Analogy:** Use the biological evolution analogy. Progress = increased specialization/puzzle-solving ability, not "getting closer to God's mind."
  5.  **The "Lossy Translation" Nuance:** Admit that Kuhn softened his view later. In *The Road Since Structure* (2000), he acknowledges that while translation is lossy, it is possible. We can learn to speak "Newton" and "Einstein" as second languages, even if we can't map them perfectly.

  ### Recommended "Cheat Sheet" for You
  If a sharp undergrad presses you on the Postscript specifically:
  *   **Acknowledge:** The Postscript is notoriously dense and Kuhn admits he didn't fully resolve the tension.
  *   **Reference:** Mention **Hoyningen-Huene's *Reconstructing Scientific Revolutions***. It is widely considered the best scholarly reconstruction of Kuhn. Hoyningen-Huene argues that Kuhn's incommensurability is local, not global, and that the "shared values" are the mechanism for rational choice without a neutral algorithm.
  *   **Reference:** Mention **Kuhn's 1990 essay "Dubbing and Redubbing."** He clarifies that incommensurability is about translation failure between specific subsets of terms, not total language failure.

  **Bottom line:** You don't need a neutral yardstick *outside* the paradigms to rank them. You only need shared values *inside* the scientific community. Progress is defined by puzzle-solving capacity, not correspondence to Reality.

  Good luck on Friday. If you frame it as "Evolutionary Specialization" rather than "March Toward Truth," the contradiction dissolves.
