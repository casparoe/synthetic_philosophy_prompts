answer: |-
  **MEMORANDUM**

  **TO:** Pilot Programs Committee
  **FROM:** Graduate Fellow Seat
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposed Futarchy Pilot for Mental Health Crisis Response

  **Recommendation**

  I recommend that the Committee **Approve with Conditions** a modified version of the proposed prediction market pilot. However, to address the substantive risks raised by our community representatives, the mechanism must be **advisory rather than binding**, and the definition of the success metric must be **co-designed by the Committee** rather than determined by agency staff.

  Pure "futarchy" (automating policy decisions based on market prices) is ill-suited for high-stakes distributive justice questions where external political payoffs exceed market trading stakes. However, a bounded, advisory prediction market can capture the epistemic benefits of the proposal—aggregating dispersed information about likely outcomes—without ceding democratic accountability or exposing the city to strategic manipulation.

  **Analysis of Objections**

  The deadlock in this Committee stems from a conflict between *epistemic efficiency* (the staffer's view) and *democratic legitimacy* (the community representatives' view). While Robin Hanson's framework suggests that market manipulators merely subsidize accurate traders, this assumption fails in the context of public policy for two reasons identified by the community representatives:

  1.  **The Metric is a Value Judgment:** Defining "adverse outcomes" is not neutral. Weighting an involuntary hold equally with a death, or counting an arrest as a failure versus a success, predetermines the policy winner. If the market optimizes for a metric the community rejects, the policy lacks legitimacy regardless of its empirical efficiency.
  2.  **Strategic Manipulation:** In a private market, manipulators lose money. In a public policy market, actors (e.g., unions, contractors) may accept financial losses in the prediction market to secure a policy outcome that yields greater external value (budget authority, job security, contract revenue). Position limits alone cannot solve this if the external payoff is orders of magnitude larger than the trading cap.

  Therefore, we cannot adopt the proposal as a binding decision mechanism. However, rejecting the tool entirely forfeits a novel method for evidence-based policy. The following conditions resolve these tensions.

  **Conditions for Approval**

  **1. Metric Co-Design and Weighting (Addressing Value Neutrality)**
  The success metric cannot be defined solely by agency staff. Before the market opens, the Committee must vote on a weighted "Harm Index" to serve as the settlement variable.
  *   **Concrete Condition:** The index must be public and fixed prior to trading. It should reflect community values (e.g., *Death = 100 points, Physical Injury = 50 points, Involuntary Hold = 10 points, Arrest = 5 points*).
  *   **Rationale:** This separates "Voting on Values" (the Committee's role) from "Betting on Beliefs" (the market's role). The market predicts the *level* of the index, but the Committee defines what the index *means*.

  **2. Advisory Status with "Trigger" Thresholds (Addressing Democratic Accountability)**
  The market price shall not automatically trigger funding. Instead, it serves as a binding *input* to the Committee's final vote.
  *   **Concrete Condition:** The market produces a probability distribution for the Harm Index under both policy scenarios. The Committee retains the final vote. However, if the market shows a statistically significant divergence (e.g., >20% difference in expected outcomes) favoring one model, the Committee must publicly justify any vote contrary to the market signal.
  *   **Rationale:** This preserves the Committee's authority while imposing a high transparency cost on ignoring empirical signals. It prevents the "black box" governance concern.

  **3. Trader Eligibility and Position Limits (Addressing Manipulation)**
  To mitigate the risk of strategic manipulation by organized interests, participation must be structured to prioritize informed diversity over capital concentration.
  *   **Concrete Condition:**
      *   **Position Cap:** Maximum net position per individual/entity limited to $500 (adjusted for inflation) to prevent "whale" manipulation.
      *   **Subsidized Community Seats:** The city will fund 500 "community accounts" ($100 credit each) distributed via lottery to residents in zip codes most affected by crisis calls, ensuring the market reflects lived experience, not just financial capacity.
      *   **KYC and Disclosure:** All traders must verify identity. Any trader with a financial interest in the implementation (e.g., potential contractors, union leadership) must be flagged and subject to a lower position cap ($100).
  *   **Rationale:** This reduces the ROI for manipulation. If a union cannot move the price significantly without thousands of proxy accounts (which increases detection risk), the strategic value of manipulation drops below the cost.

  **4. Independent Audit and "Kill Switch"**
  *   **Concrete Condition:** An independent third-party auditor (e.g., a university partner) will monitor trading patterns for collusion or anomalous correlation with external political spending. The Committee Chair retains the authority to void the market results if manipulation is detected with >95% confidence.
  *   **Rationale:** Provides a safety valve against the specific risk that external policy payoffs distort market integrity.

  **Conclusion**

  The community representatives are correct that "betting on beliefs" cannot be entirely separated from "voting on values" when the metric itself is contested, and when policy outcomes have distributive consequences. Pure futarchy assumes a level playing field that does not exist in municipal politics.

  By adopting these conditions, we transform the proposal from a *governance mechanism* (which risks legitimacy) into a *decision-support tool* (which enhances evidence). This allows us to test the efficacy of prediction markets in public policy without wagering the trust of the communities we serve. I move we approve the pilot subject to the conditions above.
