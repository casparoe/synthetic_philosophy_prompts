      *   **Best System Analysis (BSA):** Laws are theorems of the deductive system that best balances simplicity and strength in describing the mosaic.
      *   **Perfectly Natural Properties (PNPs):** Objective, mind-independent properties that "carve reality at its joints." Needed for BSA to prevent "gerrymandering" (e.g., Goodman's "grue") from making the system trivially simple.
      *   **Armstrong's Necessitation:** A relation $N(F, G)$ between universals that makes it a law that Fs are Gs. This is a primitive modal fact, non-Humean.
      *   **The Charge:** Using PNPs in BSA is effectively smuggling in primitive modal/nomic structure, violating the spirit (and maybe letter) of HS.

  3.  **Formulate the Argument (Step-by-Step):**

      *   *Premise 1: The Motivation for HS.* HS is motivated by ontological parsimony. It wants to eliminate primitive modality. The world is just "one damn thing after another."
      *   *Premise 2: The Role of PNPs in BSA.* Without PNPs, BSA fails. Any mosaic can be summarized by a trivially simple system if we allow arbitrary predicates (e.g., a predicate true of exactly the events that happen). So, Lewis restricts the vocabulary to PNPs.
      *   *Premise 3: The Status of PNPs.* For Lewis, PNPs are not defined by their role in laws (that would be circular). They are fundamental features of the mosaic. They ground resemblance.
      *   *The Crux (The Argument):*
