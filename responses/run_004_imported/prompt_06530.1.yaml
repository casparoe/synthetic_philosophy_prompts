          *   Armstrong's $N(F,G)$ explains why regularities hold. Lewis's PNP constraint explains why *this* regularity counts as a law and *that* one doesn't.
          *   Both posit a structure over and above the mere distribution of qualities. Armstrong calls it "nomic necessitation"; Lewis calls it "naturalness."
          *   If "naturalness" isn't reducible to the mosaic, it's a brute fact about the world's structure.
          *   If it's a brute fact about structure that governs laws, HS is violated.

  4.  **Refine the Argument (Addressing Counter-arguments/Nuance):**
      *   *Lewis's Defense:* Lewis would say PNPs are *part* of the supervenience base. They are the "local qualities."
      *   *Rebuttal:* But *which* qualities are the local ones? The claim "Property X is perfectly natural" does not supervene on the distribution of Property X. It's a second-order fact about Property X.
      *   *Comparison to Armstrong:* Armstrong's universals are also immanent. But the relation $N$ is external. Lewis's Naturalness is a property of properties. Is it internal or external? If it's not reducible to the mosaic, it's extra structure.
      *   *The "Quiet Giving Up":* The BSA claims to be Humean because laws supervene on the mosaic. But the mosaic *itself* is defined by the PNP distinction. If the PNP distinction is primitive modal structure, the foundation is non-Humean.

