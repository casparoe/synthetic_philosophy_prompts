answer: |-
  The argument you are asking for strikes at the heart of the tension between David Lewis's commitment to Humean Supervenience (HS) and his commitment to a robust metaphysics of properties. To make the case that the Best System Analysis (BSA) surrenders its Humean credentials by leaning on perfectly natural properties, we must demonstrate that the distinction between "natural" and "unnatural" properties functions as a primitive modal constraint indistinguishable in kind from the necessitation relations posited by non-Humeans like D.M. Armstrong.

  Here is the argument that Lewis's appeal to naturalness constitutes a covert abandonment of Humeanism.

  ### 1. The Humean Promise and the BSA Constraint
  Humean Supervenience is defined by its ontological parsimony. It asserts that the world is nothing but a vast mosaic of local matters of particular fact. There are no necessary connections between distinct existences; there is no "modal glue" holding events together. Laws of nature, on this view, are not rulers that govern the mosaic but summaries that describe it.

  The Best System Analysis is the mechanism by which Lewis attempts to derive laws from this mosaic without adding ontological weight. A law is simply a theorem of the deductive system that best balances simplicity and strength in describing the distribution of properties in the mosaic.

  However, as you noted, this analysis faces the "gerrymandering" objection (akin to Goodman's "grue"). If we allow the system to use *any* predicate, we can construct a system that is maximally simple and strong (e.g., a single predicate $F$ that applies to exactly the set of worlds/events that actually occur). To prevent this trivialization, Lewis restricts the vocabulary of the competing systems to predicates referring to **perfectly natural properties**.

  ### 2. The Status of Perfect Naturalness
  For the BSA to work, the distinction between perfectly natural properties and gerrymandered ones must be objective. It cannot depend on our interests, or else laws would depend on our interests, violating the realist intuition Lewis wants to preserve. Lewis insists that naturalness "carves reality at its joints."

  The critical question is: **On what does the fact that a property is "perfectly natural" supervene?**

  *   **Option A:** It supervenes on the pattern of instantiation in the mosaic.
      *   *Refutation:* If naturalness supervened on the pattern of instantiation, we could define naturalness in terms of the mosaic. But the mosaic *is* the distribution of properties. To say "Property $P$ is natural" is not to say "$P$ is instantiated frequently" or "$P$ is instantiated uniformly." A world could have the exact same distribution of qualities, yet differ in which of those qualities are fundamental. Therefore, naturalness does not supervene on the distribution of the qualities themselves.
  *   **Option B:** It is a brute, second-order fact about the properties.
      *   *Implication:* This posits a structural feature of reality that is over and above the "local matters of particular fact."

  ### 3. The Armstrong Parallel
  Armstrong's necessitarianism posits a relation of necessitation, $N(F, G)$, between universals. This relation is not reducible to the regularity of Fs being Gs; it is what *makes* it a law. Armstrong is explicit that this is a primitive modal fact. It is structure added to the world to explain why the mosaic is constrained.

  Lewis's appeal to naturalness performs the exact same functional role:
  1.  **Constraint:** Just as $N(F, G)$ constrains which regularities count as laws (only those backed by necessitation), the restriction to natural properties constrains which regularities count as laws (only those statable in natural terms).
  2.  **Irreducibility:** Just as $N$ is not reducible to the mosaic of particulars, the "naturalness" of a property is not reducible to the mosaic of its instances. It is a primitive metaphysical status.
  3.  **Explanatory Priority:** In Armstrong's view, the law explains the regularity. In Lewis's BSA, the naturalness of the properties explains why *this* system is the "Best" one rather than a gerrymandered rival. Without the primitive fact of naturalness, the BSA yields no unique laws.

  ### 4. The Violation of Humean Supervenience
  Humean Supervenience claims that everything true about the world supervenes on the spatiotemporal distribution of local qualities.

  If the statement "Property $P$ is perfectly natural" is true, does it supervene on the spatiotemporal distribution of $P$? No. Two worlds could have identical distributions of qualities, but in one world, $P$ is a joint of nature, and in the other, $P$ is a gerrymandered disjunction. If such a difference is possible, then the "naturalness" fact is an extra ingredient in the ontology.

  By making the BSA dependent on this extra ingredient, Lewis is admitting that the mosaic *alone* is insufficient to ground the laws. The mosaic needs to be annotated with a "naturalness map." This map is not derived from the Humean base; it *constitutes* part of the base. But if the base includes primitive facts about which properties are privileged to enter into law-statements, then the base is no longer purely "Humean" in the sense of being free of modal or nomic structure.

  ### 5. Conclusion: The Covert Concession
  The advantage of the BSA over Armstrong's view was supposed to be that it avoided primitive modality. Armstrong pays for laws with a necessitation relation; Lewis pays for laws with a naturalness relation.

  *   Armstrong says: "It is a law because $N(F,G)$ holds."
  *   Lewis says: "It is a law because it follows from the best system stated in terms of Natural($F$) and Natural($G$)."

  But the fact that $F$ and $G$ are Natural is itself a brute fact about the structure of reality. It is a fact that restricts how the world can be described lawfully, independent of the pattern of events. This is precisely the kind of "brute nomic structure" HS was designed to eliminate.

  Therefore, the Best System Analysis saves itself from triviality only by importing a primitive distinction between properties that functions exactly like a primitive modal relation. Lewis retains the label "Humean," but he has quietly purchased the stability of his laws at the price of the very supervenience base that defines Humeanism. He has not eliminated the "joints" of reality; he has merely rebranded Armstrong's necessitation as "naturalness" and located it in the properties rather than the relations between them. The ontology is no longer parsimonious; it is merely shifted.
