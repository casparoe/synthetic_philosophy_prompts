      *   **Implication 3: Decision Thresholds depend on Cost, not just Probability.**
          *   The RCP highlights uncertainty.
          *   *Action:* Use Expected Value. $Cost(Block Good) \times P(Good) vs. Cost(Allow Bad) \times P(Bad)$.
          *   The 87% is an input to a utility function, not a verdict.

      *   **Analyzing the Three Interpretations (The Core Philosophical Query):**
          *   *Frequentist:*
              *   *View:* 87% means in the long run of *similar* transactions, 87% are fraud.
              *   *RCP Status:* **Fails.** Which "similar"? The model *chooses* the class via features. If features are incomplete, the frequency is wrong.
              *   *Verdict:* Most vulnerable to RCP.
          *   *Subjective Credence (Bayesian):*
              *   *View:* 87% is the model's degree of belief given evidence.
              *   *RCP Status:* **Reframes.** The "class" is the information state. It escapes the *ontological* RCP but inherits the *epistemic* limitation (garbage in, garbage out).
              *   *Verdict:* Most useful for engineers. It admits uncertainty.
          *   *Objective Propensity:*
