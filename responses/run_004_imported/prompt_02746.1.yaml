      *   **Core Problem:** The Reference Class Problem (RCP). A single event belongs to many classes, each with different frequencies. Which one defines the "true" probability?
      *   **Specific Questions:**
          1.  What are the most important implications for interpreting and acting on these outputs?
          2.  How does the interpretation change (Frequency vs. Credence vs. Propensity)?
          3.  Does any interpretation *escape* the RCP, or does it just resurface?

  2.  **Initial Assessment & Fact-Checking:**
