answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two graduate students, Alex and Jamie, are clearing away empty cups after a particularly heated seminar on Wittgenstein's* On Certainty.

  **Alex:** (Stirring a cold espresso) I still think you're letting the skeptic off the hook too easily, Jamie. If we follow your reading—Moyal-Sharrock's "enactivist" line—we end up saying hinge commitments aren't beliefs at all. But if "The earth has existed for many years" isn't a belief, what is it? A grunt? A reflex?

  **Jamie:** Not a reflex, Alex. An *enacted certainty*. Look, the whole point of Wittgenstein's later philosophy is to look at the *use*. When I reach for a door handle, I don't hold the belief "The door handle will support my hand." I just reach. If you call that reaching a "belief," you've already intellectualized the bedrock. You've turned a way of acting into a piece of knowledge, and that invites the very doubt Wittgenstein was trying to dissolve.

  **Alex:** But that's exactly where the Wrightian entitlement account steps in. Crispin Wright agrees that we have no *evidence* for the hinge. We can't prove the earth existed before my birth. But if we strip it of the status of a belief, we strip it of truth-aptness. If the hinge isn't true or false, how does it support the empirical propositions that rest on it? If I say "I have two hands," that's true. But its truth relies on the hinge. If the hinge is just a "practice," the logic doesn't hold. We need to say it's a *belief* that is rationally acceptable without evidence. That's entitlement.

  **Jamie:** "Rationally acceptable" is the problem phrase. Rationality implies a space of reasons, justification, and critique. Hinges are the *frame* of that space. You can't stand inside the house and use the walls to prove the house exists. Wright wants to save epistemology by expanding the definition of rationality to include "groundless beliefs." I'm saying Wittgenstein is showing us the limits of epistemology. Calling it a "belief" smuggles in the possibility of doubt. If it's a belief, I can ask, "Why do you believe that?" If you say, "I'm entitled," I ask, "What entitles you?" You're back in the justification game.

  **Alex:** No, because entitlement is distinct from justification. Justification is internal to the language-game; entitlement is a warrant we have to play the game at all. Think of it like a presupposition in logic. I'm not saying I have evidence for the hinge. I'm saying the project of inquiry *requires* me to accept it as true. If I don't accept it as a truth-apt proposition, then skepticism wins. The skeptic says, "You don't *know* the earth is old." If you say, "It's not knowledge, it's just a habit," the skeptic says, "Ah, so it might be false then." Wright blocks this by saying: It is a belief, it aims at truth, but we are entitled to trust it absent evidence.

  **Jamie:** But Wittgenstein explicitly says in *On Certainty* that these certainties are "not a kind of seeing on our part; it is our acting, which lies at the bottom of the language-game" (OC 204). He contrasts them with opinions. If I say "I believe the earth is old," I imply I could be wrong. But for Wittgenstein, this certainty is "animal." It's pre-linguistic. When a child learns language, they don't learn the hinge as a proposition; they learn it as the ground on which words stand. To call it a "belief" is to treat it as an empirical hypothesis that just happens to be very well confirmed. But it's not confirmed at all! It's the rule of confirmation.

  **Alex:** I grant that it's not confirmed by evidence. But consider the alternative. If hinges are merely non-cognitive practices, how do we explain the *normativity* of error? If I claim the earth was created five minutes ago, I'm not just acting weirdly; I'm *wrong*. There is a truth of the matter. Your enactivist view risks making hinges relative to forms of life. If my form of life enacts "The earth is 5,000 years old," and yours enacts "4.5 billion," and neither is a truth-apt belief, how do we adjudicate? Wright's view preserves the idea that one of us is mistaken about the world, even if we are both entitled to our starting points until a conflict arises.

  **Jamie:** That's a strong objection, but I think it misreads the grammar. If someone says the earth is 5,000 years old, they aren't playing the same language-game as the geologist. They are operating with a different mythology, a different riverbed. Wittgenstein says the riverbed of thoughts may shift (OC 97). But while it holds, it's not a matter of being "right" or "wrong" in the empirical sense. It's a matter of coherence within a system. You want to save the concept of "truth" for hinges because you're worried about relativism. I'm saying we should let go of "truth" at the bedrock to save us from the anxiety of skepticism. The disagreement isn't factual; it's grammatical.

  **Alex:** But that sounds like fideism. "It's just our game, so we're right within it." That doesn't help when we confront radical skepticism. The skeptic challenges the *relation* between our mind and the world. If I say, "Hinges aren't beliefs, they're actions," the skeptic replies, "Okay, but do your actions track reality?" If I can't say "Yes, I believe my actions track reality," I've lost. I need the hinge to be a belief about the world so I can say I'm in contact with the world. Entitlement is the bridge. It says: You are rational to take your cognitive faculties as reliable without proving they are reliable.

  **Jamie:** And that's where you're intellectualizing the instinct. You're trying to build a bridge where there is already ground. You don't need a *right* to trust your eyes; you just trust them. The moment you ask for an "entitlement," you've admitted that doubt is a live option. Wittgenstein's point is that doubt *presumes* certainty. You can't doubt everything at once. So, positing an "entitlement" is a philosophical patch for a problem that only exists if you assume all knowledge must be propositional. I'm saying: stop trying to know the hinges. Live them.

  **Alex:** (Pauses, leaning forward) Okay, let's press on the "verbal vs. substantive" question. We've been at this for an hour. Are we actually disagreeing about how the mind works, or just about whether we apply the label "belief" to these certainties? If I say "It's a groundless belief" and you say "It's an enacted certainty," are we describing the same phenomenological state but arguing over the noun?

  **Jamie:** It feels substantive to me. Because if you call it a belief, you invite the question: "Is it justified?" Even if you say "entitlement," you are still in the business of *normative epistemology*. You are trying to regulate belief. I am trying to describe the *conditions of possibility* for regulation. If I'm right, your project of "epistemologizing" hinges is a category mistake. That's not a verbal dispute; that's a diagnosis of a philosophical disease.

  **Alex:** But if I'm right, your project leaves us defenseless against the charge of irrationality. If a student asks, "Why is it okay to assume the external world exists?" and I say, "It's not okay, it's just what we do," that's dogmatism. If I say, "We are rationally entitled to assume it because inquiry is impossible otherwise," that's a philosophical defense. So the disagreement is about whether philosophy can defend our basic commitments, or only describe them.

  **Jamie:** (Sighs) So, you think philosophy can *defend* the bedrock. I think philosophy can only *show* that the bedrock needs no defense.

  **Alex:** Exactly. And that seems substantive. If hinges are beliefs, they are subject to norms of rationality. If they are practices, they are subject to norms of utility or coherence.

  **Jamie:** But wait. Let's look at OC 612: "I act with *complete* certainty. But this certainty is my own." Wittgenstein acknowledges the subjective element. Maybe the split is this: You are looking at the hinge from the *outside*, as a theorist trying to systematize knowledge. I'm looking at it from the *inside*, as an agent living a life. From the inside, it's not a belief. From the outside, it looks like a belief.

  **Alex:** So is it a matter of perspective?

  **Jamie:** Perhaps. But if you codify the "outside" perspective into a theory of entitlement, you risk turning the hinge into a super-proposition. A proposition that is true but unprovable. That sounds suspiciously like the Tractatus. And Wittgenstein left that behind.

  **Alex:** (Smiles slightly) Fair point. The ghost of the *Tractatus* is hard to exorcise. But consider this: If we accept your view, that hinges are non-propositional, does that mean we can't argue against someone who rejects them? If a radical skeptic refuses to "enact" the certainty of the external world, what do we do? On my view, I can say they are violating a norm of rational entitlement. On your view, I can only say they are not playing our game.

  **Jamie:** You can say they are failing to participate in a shared form of life. And Wittgenstein would say, if they really doubt everything, they can't even *mean* anything by their doubt. "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty" (OC 115). So, on my view, the skeptic is literally nonsensical. On your view, the skeptic is making a mistake about their entitlements. Which is worse? Nonsense or error?

  **Alex:** Error implies they could be corrected. Nonsense implies they should be ignored. I prefer to think philosophy can correct.

  **Jamie:** And I think philosophy should cure us of the urge to correct what isn't broken.

  **Alex:** (Leans back) So, verdict time. Is this verbal?

  **Jamie:** It's not *merely* verbal. If it were, we could swap terms and agree. But we can't. If I accept "belief," I accept the framework of justification you're trying to modify. If you accept "enacted certainty," you have to give up the idea that epistemology can ground our basic commitments.

  **Alex:** I agree. It's substantive because it dictates the *method* of philosophy. Do we construct a theory of warrant (Wright), or do we engage in grammatical therapy (Moyal-Sharrock/Wittgenstein)?

  **Jamie:** Though... there might be a convergence. You want to protect the rationality of our practices. I want to protect the practices from being over-intellectualized. We both want to stop the skeptic from paralyzing us.

  **Alex:** True. You stop them by showing their doubt is empty. I stop them by showing their doubt is rationally unforced.

  **Jamie:** So the disagreement is about the *weapon* we use against skepticism. You use a shield of entitlement. I use a mirror to show the skeptic their sword is made of words.

  **Alex:** (Raises coffee cup) To the shield, then.

  **Jamie:** (Clinks cup) And to the mirror. But admit it, Alex: you don't *believe* the earth is old in the same way you believe your coffee is hot.

  **Alex:** (Laughs) I believe the coffee is hot because I feel it. I believe the earth is old because... well, because I can't help it.

  **Jamie:** "Can't help it." Now you're speaking my language. That's not entitlement. That's a hinge.

  **Alex:** Maybe. But I'm still entitled to call it a belief.

  **Jamie:** And I'm still certain you're wrong. But I can't prove it.

  **Alex:** There it is. The hinge in action.

  **Jamie:** Exactly. No justification needed. Just coffee.
