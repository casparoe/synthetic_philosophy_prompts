answer: |-
  First, let's lock down the text so we are standing on the same ground. You are remembering correctly. The piece is the fragment Braithwaite titled **"Epilogue"** in the 1931 collection *The Foundations of Mathematics and Other Logical Essays*. It stems from a paper called "Theories" (1929) and reflects conversations from his final year, including talks to the Apostles. The specific image you cite—stars as "threepenny bits" in a perspective drawing—is the hermeneutic key to his entire late ethical outlook.

  You asked me not to hedge. So here is the reconstruction: **Ramsey would have been a devastating critic of longtermism.**

  He would not view it as a natural extension of his work on probability and decision theory. Instead, he would view it as a pathological misuse of that machinery—a category error that commits the exact same sin as Russell's "Free Man's Worship," merely inverting the sign from despair to hubris.

  Here is the breakdown of why Ramsey would reject the longtermist core, based on his mature views.

  ### 1. The Map vs. The Perspective (Axiological Rejection)
  Longtermism relies on an axiology that is "to scale." It demands that we treat a potential person in the 30th century as axiologically identical to a person in the 21st century, and that the *number* of such people is the primary determinant of moral value. This is a "map" view of the universe: objective, distance-independent, and impersonal.

  Ramsey's "Epilogue" is an explicit rejection of the map view for human valuation. When he writes, *"My picture of the world is drawn in perspective, and not like a map. The foreground is occupied by human beings, and the stars are all as small as threepenny bits,"* he is making a claim about **salience**, not just psychology.

  For Ramsey, value is not a substance floating in the universe waiting to be counted; it is a relation between a subject and their environment. The "vastness of the future" is a physical fact, not a moral one. To allow the sheer cardinality of potential beings to swamp the concrete reality of existing beings is, in Ramsey's terms, to let the "stars" (the abstract, the distant, the impersonal) dictate the size of the "threepenny bits" (the human, the felt, the immediate).

  He would argue that longtermism suffers from a **metaphysical fright**. Just as Russell was frightened by the silence of the universe, the longtermist is intoxicated by the magnitude of the universe. Ramsey's cure for Russell was to realize the magnitude is irrelevant. He would prescribe the same cure for MacAskill: The number of trillions is a physical statistic, not a moral weight. To treat it as a moral weight is to abandon the human perspective that makes morality possible in the first place.

  ### 2. The Limits of Credence (Epistemological Rejection)
  This is where the irony is sharpest. Longtermists use Ramsey's own subjective probability theory (credences) to calculate expected utility over deep time. They say, "Even if the probability of averting extinction is tiny, the payoff is so huge (trillions of lives) that the expected value dominates."

  Ramsey would call this **pseudo-quantification**.

  In "Truth and Probability" (1926), Ramsey grounds belief in **action**. A degree of belief is defined by the odds at which you are prepared to bet. This works for repeatable events or concrete decisions (e.g., "Will it rain?", "Should I take this train?").

  But what is the betting behavior for "The survival of the human species for 100,000 years"? There is no market, no repetition, and no feedback loop. Ramsey was a pragmatist; he believed logic and probability were tools for clearing up confusion in *actual* inquiry. Assigning a precise credence to "astronomical waste" violates the spirit of Ramsey's probability, which was designed to tether belief to evidence and action.

  He would likely argue that the longtermist is not dealing with *risk* (which is calculable) but with *uncertainty* (which is not). By plugging speculative metaphysics into an expected utility calculator, longtermists create an illusion of precision that licenses ignoring concrete suffering in the foreground (where the people are) for the sake of phantoms in the background (where the stars are). Ramsey would see this as a violation of the very pragmatic maxim that underpins his decision theory: beliefs must cash out in concrete differences in practice.

  ### 3. The "Bravado" Objection
  You asked about his age. He died at 26; is the "Epilogue" just the romantic posturing of a brilliant young man?

  I argue **no**. We must weigh this against his trajectory. Ramsey moved from the Platonism of *Mathematics* (1925) toward a Wittgensteinian/Pragmatist humanism (1929–1930). The "Epilogue" is not an isolated poetic flourish; it is the ethical correlate of his later philosophical shift.

  In his later work, he became increasingly suspicious of metaphysics that outstripped verification or use. The "vastness of the universe" is the ultimate metaphysical surplus. It does nothing, changes nothing about the local rules of inference, and alters nothing about the nature of truth.

  If anything, his youth makes the insight *more* potent, not less. He was looking at the same cosmos that terrified Russell, with the same intellectual capacity, and he concluded that terror was a sign of bad philosophy, not deep insight. He didn't grow out of it; he died holding it. To dismiss it as immaturity is to assume that "maturity" means becoming more like Russell (solemn, cosmic, ponderous). Ramsey's point is that becoming like Russell is the disease.

  ### 4. The Verdict: Machinery Hijacked
  Ramsey would view longtermism as a hijacking of his formal machinery for a purpose he explicitly warned against.

  He gave us the calculator (Expected Utility). The longtermists put in the numbers (Trillions of lives). They get the result (Prioritize Existential Risk).
  Ramsey would look at the inputs and say: **"You cannot put 'trillions of non-existent people' into this machine. This machine is for deciding what to do next Tuesday, not for redeeming the cosmos."**

  He would likely characterize the longtermist obsession with existential risk as a secular eschatology—a theological hangover where "God" is replaced by "The Future," and "Salvation" is replaced by "Existential Security." It retains the religious structure of caring about the infinite, which Ramsey had worked hard to excise from philosophy.

  ### Summary for your Talk
  If you want the sharpest possible hook for your audience:

  Ramsey's "Epilogue" is the immune response to longtermism. Longtermism argues that **Scale determines Value**. Ramsey argues that **Perspective determines Value**.

  He would tell Bostrom, Ord, and MacAskill that they are making a category mistake. They are using a tool designed for human decision-making (probability/utility) to solve a metaphysical problem (the meaning of the cosmos). In doing so, they invert the proper order of importance. They make the "threepenny bits" (us, now) subservient to the "stars" (the vast, empty future).

  Ramsey's message is that the stars *are* small. Not physically, but morally. They are small because they are outside the sphere of human feeling and action. To pretend otherwise is not rigorous altruism; it is, in his words, "throwing away the only thing that makes life worth living" in favor of a "metaphysical fright."

  He wouldn't just be an internal critic; he would be the guy turning off the projector and telling everyone to go have a conversation instead.
