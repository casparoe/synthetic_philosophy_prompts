answer: |-
  This is a classic friction point between the "Rationalist" community (influenced by Hanson, Yudkowsky, and formal decision theory) and contemporary analytic epistemology. You are correct that Aumann's Agreement Theorem (AAT) is mathematically sound. However, the reason steadfastness remains a live option in the philosophical literature is that professional epistemologists generally reject the premise that the conditions required for AAT actually obtain in real-world philosophical disagreements.

  From the perspective of the philosophical literature, AAT is viewed not as a normative command that closes the debate, but as an impossibility result for *idealized* agents under *highly specific constraints* that humans almost never satisfy.

  Here is a breakdown of why steadfasters (like Thomas Kelly) and others in the disagreement literature do not consider AAT to have vindicated conciliationism or ruled out steadfastness.

  ### 1. The Common Prior Assumption (CPA)
  AAT strictly requires that agents share a **common prior**. If agents have different priors, they can agree to disagree forever without violating Bayesian rationality.

  *   **The Rationalist View:** Robin Hanson and many in the LW sphere argue that differing priors are themselves irrational. If we are both rational, we should recognize that our genetic/cultural starting points are arbitrary, and thus we *ought* to converge on a common prior.
  *   **The Philosophical View:** Many epistemologists reject the idea that rationality demands a single unique prior (the **Uniqueness Thesis**). They argue for **Permissivism**: the view that there is a range of priors that are rationally permissible. If Permissivism is true, two agents can start with different (but rational) priors, process the same evidence, and arrive at different posteriors without anyone making a mistake.
  *   **The Implication:** If priors can rationally differ, AAT does not apply. Therefore, persistent disagreement does not entail that someone is being irrational. Steadfastness is preserved because I can rationally think, "We have different starting points, and mine is just as permissible as yours."

  ### 2. Common Knowledge of Posteriors
  AAT requires that our posterior probabilities be **common knowledge**. This is a much stronger condition than simply telling each other, "I believe X with 80% confidence."

  *   **The Technical Bar:** For posteriors to be common knowledge, I must know your credence, you must know mine, I must know that you know mine, you must know that I know yours, ad infinitum.
  *   **The Real-World Gap:** In philosophical disputes, we exchange *arguments*, not raw probability assignments. Even if we state our credences, we rarely achieve the common knowledge state required for the theorem to force convergence. We often suspect the other person hasn't fully understood our evidence, or that they are weighting it differently.
  *   **The Implication:** Since the condition of "common knowledge of posteriors" is almost never met in human discourse, the theorem doesn't trigger. Steadfasters argue that until we have truly fully exchanged and understood all reasoning (which may be impossible given cognitive limits), we are not in the Aumannian state where conciliation is mandated.

  ### 3. The Definition of "Peer" and the "Right Reason" View
  This is Thomas Kelly's specific contribution. The conciliationist argument relies on the definition of an **epistemic peer**: someone equally likely to be right about the issue.

  *   **The Circularity Problem:** How do I know you are my peer *on this specific topic*? If I have carefully evaluated the evidence and concluded P, and you conclude not-P, I have evidence that you have made a mistake in evaluating the evidence.
  *   **Kelly's Total Evidence View:** Kelly argues that the fact of disagreement is just *one piece of evidence* to be added to the total body of evidence. It is not a "defeater" that automatically neutralizes my first-order reasoning.
      *   If I have strong first-order evidence for P, and I discover you disagree, I must weigh your disagreement against my first-order evidence.
      *   If my first-order evidence is very strong, and I have no specific reason to think I am the one who messed up (e.g., I'm sober, you're drunk, or I'm an expert and you're a novice), I can rationally maintain my belief.
  *   **The Implication:** AAT assumes we *know* we are peers. Kelly argues that discovering disagreement often gives us reason to downgrade the other person's peer status *in that instance*. If I think I'm right, I necessarily think you've made an error. If you've made an error, you aren't acting as a peer right now. Therefore, I don't need to conciliate.

  ### 4. Idealization vs. Bounded Rationality
  AAT applies to logically omniscient Bayesian agents. Humans are bounded rationalizers.

  *   **The "Ought Implies Can" Objection:** Even if AAT shows that *ideal* agents would converge, it doesn't follow that *humans* ought to conciliate. Calculating the exact Bayesian update based on a peer's disagreement is computationally expensive and prone to error.
  *   **Heuristic Steadfastness:** Some steadfasters argue that a policy of "trust your own reasoning unless given a specific defeater" is a more reliable heuristic for bounded agents than "always split the difference." Always conciliating leads to "spinelessness," where a minority view can never survive against a majority, even if the minority is right.
  *   **The Implication:** Steadfastness isn't claiming humans *are* Aumannian agents; it's claiming that for humans, sticking to one's guns is often the more truth-conducive policy given our cognitive limitations.

  ### 5. Self-Locating and Indexical Information
  There is a technical loophole in AAT regarding indexical information (information about *who* is who).

  *   **The Argument:** I have access to my own reasoning process in a way I do not have access to yours. I know *I* checked for errors three times. I only believe *you* checked three times based on your testimony.
  *   **The Implication:** This asymmetry creates a difference in information states that can rationally sustain disagreement even with common priors. I can think, "Given that *I* am the one who reasoned this, and I feel confident in my focus, I should weight my output higher than yours." This is closely related to the "epistemic egocentrism" that steadfasters defend.

  ### Summary: What Steadfasters Think They Are Preserving
  To answer your specific question: Steadfasters do not think they are preserving "stubbornness." They believe they are preserving **the normative force of first-order evidence.**

  They argue that conciliationism, if taken strictly, leads to an absurd regress where the mere existence of disagreement swamps all actual evidence. If you and I disagree about a math problem, and I conciliate, and then we disagree again, and I conciliate again, eventually my belief is determined entirely by the social fact of disagreement, not by the math.

  Steadfasters argue that AAT is a theorem about **information aggregation in ideal systems**, whereas the peer disagreement debate is about **normative epistemology for human agents**. They accept the math of AAT but deny that the antecedent conditions (Common Priors, Common Knowledge of Posteriors, Logical Omniscience) are satisfied in the cases that matter.

  From their view, Hanson's move to declare differing priors "irrational" is a substantive philosophical claim, not a mathematical necessity. Until that claim is proven, AAT remains a conditional statement that doesn't bind human epistemic conduct. Thus, steadfastness remains a rational option for agents who believe their priors are permissible and their reasoning is sound.
