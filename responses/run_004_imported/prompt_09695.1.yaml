      *   *The Friend's Point:* Explain *why* she says this. Noise, inconsistency, definition drift. If the label is fuzzy, the model learns fuzziness.
      *   *The User's Point:* Explain *why* he's right. Phenomenology. No external sensor measures "flow" directly. Self-report is standard in psychology.
