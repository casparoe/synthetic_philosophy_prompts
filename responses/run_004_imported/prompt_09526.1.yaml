      *   Argument 1: The "Omniscience Requirement" Fallacy. Rationality $\neq$ Certainty.
      *   Argument 2: Ignoring Present Duties (Deontology). Fairness to others *now*.
      *   Argument 3: Institutional Integrity. The school's rules matter.
      *   Argument 4: The Precedent Problem. What about the next kid?
      *   Argument 5: Expected Value. Even probabilistically, one path might carry more systemic risk.
      *   Closing: It's not about knowing the future; it's about honoring the present role.

  8.  *(Self-Correction during drafting)*: Make sure to mention that "rational" doesn't mean "easy." It means "reason-based." Her claim is that there are *no reasons* to prefer one. I need to show there *are* reasons, even if the outcome is murky.

