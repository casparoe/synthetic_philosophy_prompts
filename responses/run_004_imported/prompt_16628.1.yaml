      *   *Fuller (Natural Law/Procedural):* Law is the "enterprise of subjecting human conduct to the governance of rules." There is an "inner morality of law" (8 desiderata: generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between official action and declared rule). If a system fails these too badly, it's not just bad law; it's *not law at all*. It's a perversion of law.
      *   *Key Nuance:* It's not "Law vs. Morality" in the sense of external justice (human rights). It's about whether the *form* of law carries moral weight. Hart says form is instrumental; Fuller says form is constitutive of morality.

  3.  **Deconstruct the DAO Fork:**
      *   *Event:* The DAO smart contract had a reentrancy bug. Attacker drained ~3.6M ETH.
