  8.  *(Self-Correction during drafting the Verdict)*: I need to be careful not to conflate Hart with "Code is Law." Hart is a positivist, but he believes law is a social phenomenon. If the community forked, Hart might say the *new* chain is the law. However, the *principle* of "Code is Law" (immutability regardless of outcome) is the Positivist *ideal* being tested. I will frame it as: The *ethos* of ETC aligns with Hart's Separability (Law is Law, even if bad), while the *ethos* of ETH aligns with Fuller's Fidelity (Law must serve its purpose).
      *   *Actually, a stronger reading:* Hart would likely view the Fork as a *revolution*, not a legal act. The old rules were changed. ETC is the continuity of the old legal order. ETH is a new legal order. Hart would analyze the *transition*. Fuller would analyze the *justification*.
