      *   *Refining the "Code is Law" mapping:* "Code is Law" is actually closer to a *misunderstanding* of Hart. Hart says law is social fact. If the community accepts the fork, the fork *is* the law (new Rule of Recognition). So Hart might actually support the Fork if the social fact shifted.
      *   *Wait, this is a crucial pivot.* Hart's Rule of Recognition is based on official acceptance. If the majority of miners/nodes/users accepted the fork, then *under Hart's theory*, the Fork is the valid law and ETC is the revolution.
      *   *Re-evaluating the mapping:*
          *   *ETC (Code is Law):* Focuses on the *text* of the law (bytecode). This is actually more like *Legal Formalism* (Langdell), which Hart criticized. Hart cares about the *source* (social acceptance).
          *   *ETH (The Fork):* Focused on the *social consensus* (the Rule of Recognition).
          *   *Actually, the prompt asks me to treat the debate as Hart vs. Fuller.*
          *   *Standard Interpretation:* Usually, "Code is Law" is mapped to Positivism (Law is what is written/enacted). The Fork is mapped to Natural Law (Law must serve justice/intent).
