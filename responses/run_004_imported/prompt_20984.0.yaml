answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I had the privilege of being one of Frank's advisees starting about [Number] years ago. And when you're asked to toast a man who has spent thirty-eight years calibrating instruments and correcting terminology, you realize pretty quickly that precision matters.

  Especially if you value your beverage supply.

  We all know the tradition. At any department gathering, if someone refers to Frank as a "Marxist" or a "Communist," the conversation stops. The wine glass is set down. And we endure a fifteen-minute lecture on the distinction between historical materialism and democratic socialist ethics, usually punctuated by a quote from Albert Einstein.

  It's become a lovable quirk for the physics side of the room. But I want to suggest tonight that for Frank, this wasn't a quirk. It was the same intellectual integrity he brought to the lab.

  Frank didn't quote Einstein's essay *"Why Socialism?"* because he liked the vibe. He quoted it because he respected the argument. And if you actually read the thing—which I did, partly to prepare for tonight, and partly because Frank once made me read it after I carelessly used the word "collectivist" in 2019—you realize it's not just a complaint about competition.

  Einstein argues that the "anarchy of production" in a market system creates immense waste and human suffering. That's the first half. But the second half is what Frank always lingered on. Einstein writes, explicitly, that a planned economy is not enough. He warns that a planned economy can become "an enslaving bureaucracy." He says the protection of the individual is the *whole problem* of socialism.

  That is a very specific, very difficult systems problem. It is, in a way, a physics problem. How do you design a structure that provides stability without crushing the particles moving inside it? How do you minimize entropy without freezing the system solid?

  Frank understood that better than anyone.

  To the colleagues who saw Frank primarily as an experimentalist: You saw him apply this same logic to his research group. He didn't run a lab of anarchic competition, where we fought over equipment and credit. But he also didn't run a bureaucracy, where we were cogs in his machine. He built a system of planned support with rigorous checks on his own power. He made sure we had the resources we needed, but he fiercely protected our autonomy to make mistakes, to wander, and to find our own signals in the noise.

  To the friends from the reading group: You know that Frank never treated Einstein's essay as dogma. He treated it as a warning label. He knew that the "economic anarchy" Einstein criticized was real, but he also knew the "bureaucratic tyranny" Einstein feared was real. Frank's politics weren't about finding a perfect ideology; they were about maintaining the tension necessary for freedom. He was a socialist in the sense that he believed the economy should serve people, but he was a humanist in the sense that he knew the state should never serve itself.

  There is a line in that essay where Einstein says that education must foster "social responsibility" but not "unquestioning loyalty to authority." I can attest that Frank took this personally. He taught us to question authority. Including his. Especially his.

  I remember once showing him data that contradicted a model he'd championed for a decade. I was terrified. He didn't get defensive. He didn't pull rank. He looked at the data, smiled, and said, "Well, the theory is elegant, but the universe is under no obligation to be elegant." He adjusted the model. That is intellectual honesty. That is the same honesty he demanded from our political discourse.

  So, as Frank retires, he leaves behind a department that is more rigorous, more kind, and more precise because of him. He is moving from a career of planned labor to a retirement of... well, hopefully less planning. Although knowing Frank, he has already optimized his leisure time for maximum utility.

  Frank, you taught us that the goal of science is to understand the world, but the goal of a life is to make it livable. You showed us that you can care deeply about the structure of society without losing sight of the individual human being standing inside it. You showed us that being "kind" isn't just a personality trait; it's a structural necessity.

  We promise to try to keep our terminology precise. We promise to question authority. And we promise that if anyone calls you a Marxist at your own retirement party, we will step in before you have to put down your wine glass.

  To Frank.

  [Raise glass]
