      *   **Analyzing the User's Intuition (First-Order Evidence):** Acknowledge why it feels wrong to ignore the math. If $A=B$ and $B=C$, then $A=C$. How can that be wrong? Because human cognition isn't a logic gate; it's a fallible processor.
      *   **Resolution/Reconciliation:**
