  2.  **Identify the Core Philosophical/Epistemological Issue:**
      *   This is a classic case of **Reference Class Forecasting vs. Inside View**.
      *   It touches on **Defeatism vs. Dogmatism**.
      *   It involves **Higher-Order Evidence**: Evidence about the reliability of your own cognitive processes (the statistic about confident students) vs. First-Order Evidence (the algebraic steps themselves).
      *   The specific tension is between *process confidence* (my steps look valid) and *outcome confidence* (the statistic says people like me fail).

  3.  **Evaluate the Teammate's Position (The Statistic/Outside View):**
      *   *Strength:* The statistic is empirical data. It accounts for human cognitive limitations (blind spots). If 80% of confident students are wrong, the prior probability of being wrong is high.
      *   *Weakness:* It treats the user as an average member of the group, ignoring specific evidence (the triple check). It can lead to skepticism paralysis.
      *   *Key Concept:* **Higher-Order Defeat**. The statistic suggests your cognitive reliability on *this specific type of task* is lower than you think.

  4.  **Evaluate the User's Position (The Step-by-Step/Inside View):**
