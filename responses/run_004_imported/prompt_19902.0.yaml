answer: |-
  Here are 8 questions designed to corner the "brute fact" retreat, escalating from metaphysical consistency to the specific edge cases you requested.

  ### Phase 1: Challenging the "Brute Fact" Retreat

  **1. The Normative Gap**
  "You argue that reactive attitudes like resentment are just a 'fact of our species,' like having binocular vision. But binocular vision isn't normative—it doesn't tell us how to *treat* people. If responsibility is just a psychological inevitability, how do you distinguish between a practice we *can't* stop doing and a practice we *ought* to keep doing?"
  *   **Likely Dodge:** "The 'ought' emerges from the 'can't.' If we can't abandon the framework, asking if we should is meaningless."
  *   **Follow-up:** "So if we couldn't stop being racist, racism would be morally justified?"

  **2. The Metaphysical Leak**
  "Strawson wants to keep metaphysics out of the room, but surely what we believe about causality changes the *quality* of our resentment. If I learn you hit me because a tumor pressed on your amygdala, my resentment vanishes. If determinism says *all* behavior is downstream of prior causes, why doesn't that tumor explanation apply to everyone, just with more steps?"
  *   **Likely Dodge:** "Because the tumor is an abnormal interruption, whereas normal causation is just living."
  *   **Follow-up:** "Is 'normal' causation just a name for causes we haven't traced back far enough yet?"

  **3. The Optimization Objection**
  "As a software engineer, I look at systems and ask if they can be debugged. If our responsibility practices are just human code, and that code produces suffering (like excessive guilt), why aren't we obligated to patch it? Why is 'this is how we're built' a valid answer to 'can we build something better?'"
  *   **Likely Dodge:** "We can tweak the edges, but we can't rewrite the core operating system of interpersonal relationships."
  *   **Follow-up:** "How do you know that unless we've actually tried to internalize determinism?"

  ### Phase 2: The Pereboom Challenge

  **4. The Internalization Test**
  "Derk Pereboom argues that if we truly *internalized* the truth of determinism—not just intellectually, but emotionally—our reactive attitudes would naturally wither, like anger at a storm. You say they wouldn't. Are you claiming our emotions are immune to our deepest metaphysical beliefs, or that we simply refuse to let them change?"
  *   **Likely Dodge:** "It's not a refusal; it's that relationships require these attitudes to function, regardless of belief."
  *   **Follow-up:** "So you're saying a functional relationship requires us to ignore the truth about how our friends work?"

  ### Phase 3: Variance and Manipulation

  **5. The Anthropological Check**
  "You lean heavily on 'us as a species,' but anthropologists show huge variance in how cultures handle guilt and blame. Some prioritize restoration over resentment entirely. If the 'bedrock' looks different depending on where you're born, isn't it culture rather than nature?"
  *   **Likely Dodge:** "The specific expressions vary, but the underlying capacity for reactive attitudes is universal."
  *   **Follow-up:** "At what point does a 'variation' become a counter-example that breaks the theory?"

  **6. The Manipulation Case**
  "Imagine a neuroscientist programs me to steal a wallet, but makes me feel like I chose it freely. You'd likely say I'm not responsible. But if determinism is true, the Big Bang plus the laws of physics 'programmed' me just as surely as the neuroscientist. What is the morally relevant difference between the scientist and the Big Bang?"
  *   **Likely Dodge:** "The scientist bypasses my agency; the Big Bang works *through* my agency."
  *   **Follow-up:** "If my agency is fully determined, how is it not just a conduit for the Big Bang?"

  **7. The "Objective Attitude" Slip**
  "Strawson says we can only toggle between 'participant' and 'objective' attitudes. But in high-stakes fields like medicine or justice, we try to train people to stay objective—to see behavior as symptoms rather than sins. If we can do that professionally, why is it impossible to expand that circle ethically?"
  *   **Likely Dodge:** "Because you can't maintain an objective attitude toward your own spouse or children without losing the relationship."
  *   **Follow-up:** "So moral responsibility is only real when we're being irrational about our loved ones?"

  ### Phase 4: The Climax (The Cult Case)

  **8. The Cult Upbringing**
  "Let's land on a hard case. Consider someone raised from birth in a high-control cult. They weren't coerced at gunpoint (so not a standard excuse), but their entire moral framework was engineered by others (so not standard agency). They commit a harm believing it's right. If you say they're responsible, you ignore the manipulation. If you say they're exempt, you ignore their adult capacity. Where does the 'fact of our species' help us here, when our species' intuition is split?"
  *   **Likely Dodge:** "That's a partial exemption; we adjust our resentment based on the degree of indoctrination."
  *   **Follow-up:** "But if *all* moral frameworks are indoctrinated by luck of birth, isn't the cult member just a more visible version of us all?"
