      *   **Specific Tension:** QM suggests particles are fundamentally indistinguishable (violating PII). Some philosophers save PII via "weak discernibility" (relations like opposite spin). This leads to Ontic Structural Realism (OSR), where relations are fundamental.
      *   **The Core Conflict:** Leibniz's metaphysics (Monads) are "windowless" (no real interaction/relations). Relations are phenomenal/reducible to monadic properties. OSR says relations are fundamental.
      *   **The Question:** If Leibniz were confronted with this, what would he do?
          1.  Accept the "saved by relations" route (Weak PII)?
