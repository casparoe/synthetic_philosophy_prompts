      *   *Leibniz's View on Matter:* He would *not* consider electrons to be fundamental substances (monads). Matter is derivative. Therefore, the PII applies strictly to *monads*, not necessarily to derivative phenomena like "electrons."
      *   *The "Relations" Save:* Philosophers like Saunders or Muller suggest weak discernibility (irreflexive relations).
      *   *Leibniz on Relations:* Relations are ideal. They supervene on monadic properties. If QM says relations are fundamental (OSR), that contradicts Leibniz's reductionism.

