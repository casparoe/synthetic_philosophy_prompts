      *   **Constraint:** Give the *best guess* based on his system, not just "he'd be amazed."

  2.  **Deconstruct Leibniz's System:**
      *   **PII:** No two substances share all the same properties. Every monad has a unique "complete concept."
      *   **Monads:** Simple, immaterial, soul-like substances. They are the only true "things."
      *   **Windowlessness:** Monads do not causally interact. Perceptions are internal. Relations are *phenomena bene fundata* (well-founded phenomena), reducible to the internal states of the relata.
      *   **Space/Time:** Ideal/phenomenal, not absolute realities. Arises from the order of coexisting perceptions.
