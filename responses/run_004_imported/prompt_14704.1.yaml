prompt: |-
  My cousin Priya is getting married in a few weeks and asked me to do the toast, and last night my friend Dev and I ended up spending two hours arguing about it instead of actually helping me write anything (thanks, Dev). Here's the wrinkle: her side of the family is pretty devoutly Pentacostal, her dad's basically a lay minister, and her fiancé Sam's family are all committed secular humanists, a couple of the internet-atheist variety. I said I just wanted something warm that didn't step on anyone's toes, and Dev, who's doing a political theory PhD, said that's basically the exact problem Rawls spent decades on. He was quick to point out that technically Rawls restricted all that "public reason" stuff to constitutional essentials and matters of basic justice, argued out by judges and legislators in the "public political forum" -- a wedding toast is just "background culture," so none of it strictly applies. But then he said the fun version of the exercise is to pretend it DOES apply anyway: write something that doesn't quietly smuggle in one side's comprehensive doctrine (Pentecostal Christianity, secular humanism, whatever) as the actual reason the marriage is good, while still being allowed, per "the proviso" from his later stuff, to gesture at religious or secular language as long as its not doing the load-bearing justificatory work.

  I think Dev would be a nightmare as an actual wedding consultant, but now I can't drop it either. Can you write me the real toast -- about 3-4 minutes read out loud, genuinely warm and a little funny, with specific-feeling (invented is fine) details about Priya and Sam -- but built the way Dev described? It should feel, to every single person in that room, like it's actually about their marriage and not a diplomatic non-statement. It can absolutely reference what faith means in her family and what a secular life well-lived means in his, but the actual case the toast makes for "this marriage is good" can't quietly rest on either comprehensive doctrine alone. Please don't give me the bland "love is love, and we should all respect each other's beliefs" toast -- that's precisely the cop-out Dev was mocking in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for cousin Priya.
      *   **Audience:** Mixed. Priya's side: Devout Pentecostal (Dad is a lay minister). Sam's side: Committed Secular Humanists/Internet Atheists.
      *   **Constraint (The "Dev" Challenge):** Apply John Rawls' idea of "Public Reason" to a wedding toast (which Rawls would classify as "background culture," but we're pretending it applies).
      *   **Core Rule:** Do not base the justification for the marriage's goodness *solely* on one "comprehensive doctrine" (i.e., don't say the marriage is good *because* God wills it, and don't say it's good *because* it maximizes secular utility/autonomy).
      *   **The "Proviso":** Can reference religious or secular language, but it can't be the *load-bearing* justification. It must be translatable or accessible to the other side.
      *   **Tone:** Warm, funny, specific (invented details okay), 3-4 minutes spoken (approx. 450-600 words).
      *   **Avoid:** Bland platitudes ("love is love," "respect differences"). It needs to feel substantive, not diplomatic.

  2.  **Deconstruct the Rawlsian Constraint for a Toast:**
      *   *Problem:* If I say "God brought them together," Sam's family checks out. If I say "They rationally chose each other to maximize happiness," Priya's dad might feel it lacks spiritual weight.
      *   *Solution:* Find an "Overlapping Consensus." What values do Pentecostals and Secular Humanists share *in practice* regarding marriage, without invoking the metaphysical *why*?
      *   *Shared Values:* Commitment, service to others, forgiveness, building a home, resilience, testimony/witness (religious) vs. integrity/authenticity (secular), grace vs. empathy.
      *   *The "Load-Bearing" Argument:* The marriage is good because it creates a space of *mutual accountability and care* that both sides can recognize as virtuous, regardless of the source. It's about the *work* of the relationship, not the *source* of the sanction.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the tension lightly (meta-humor about Dev) to break the ice, but pivot quickly to warmth. Establish the speaker's relationship (cousin).
      *   **The "Dev" Constraint (Subtle):** Don't mention Rawls explicitly in the toast (that would be insufferable), but embody the principle.
      *   **Specific Details (Invented):** Need to show, not just tell.
          *   *Priya:* Organized, faithful, maybe sings in choir? Let's say she plans things meticulously but leaves room for spirit.
          *   *Sam:* Thoughtful, skeptical but kind. Maybe he fixes things? Let's say he's an engineer or teacher. Let's go with he builds things (literal or metaphorical).
          *   *Together:* A specific moment of conflict resolution or shared service.
      *   **The "Overlapping Consensus" (The Meat):**
          *   Talk about "Covenant" (Religious) and "Contract/Commitment" (Secular) but elevate both to "Promise."
          *   Talk about "Grace" (Religious) and "Forgiveness/Empathy" (Secular).
          *   Focus on the *fruit* of the relationship, not the *root*.
      *   **The Climax:** The toast itself. A wish for their future that both sides can say "Amen" or "Hear Hear" to.

  4.  **Refining the Language (The Rawlsian Check):**
      *   *Check:* Did I say "God blessed this union"? *Correction:* Say "They are blessed by the community" or "They offer a blessing to us."
      *   *Check:* Did I say "They are rational actors"? *Correction:* Say "They choose each other every day."
      *   *Key Phrase:* "A language both sides speak."
      *   *Avoid:* "Love conquers all" (too vague).
      *   *Aim:* "Service," "Witness," "Integrity."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Dev and I argued about this. Priya is holy, Sam is logical. But they work. Priya prays, Sam listens. They make a home. Let's drink to them.
      *Critique:* Too bland. Needs more texture.

  6.  **Drafting - Iteration 2 (Adding Texture & Philosophy):**
      Start with the Dev story. It sets up the "difficult audience" premise without being offensive.
      Describe Priya: Her faith isn't just Sunday; it's how she treats waiters.
      Describe Sam: His skepticism isn't cynicism; it's looking for truth.
      The Meeting: They didn't compromise beliefs; they found a shared practice.
      The Core: Marriage isn't about agreeing on metaphysics; it's about showing up.
      The Toast: To the work, the grace, the future.

  7.  **Polishing for Tone (Warmth & Humor):**
      *   Make sure the Dev reference is affectionate, not mean.
      *   Ensure Priya's dad feels honored, not analyzed.
      *   Ensure Sam's parents feel respected, not dismissed as godless.
      *   *Word Count Check:* 3-4 minutes is roughly 450-550 words at a moderate pace.

  8.  **Final Review against Constraints:**
      *   *Rawlsian?* Yes, relies on public virtues (commitment, care) rather than comprehensive truths (salvation, atheism).
      *   *Proviso?* Uses religious words ("grace," "witness") and secular words ("integrity," "choice") but treats them as functional equivalents in the context of love.
      *   *Warm/Funny?* Yes, opens with the Dev anecdote.
      *   *Specifics?* Added details about the "spreadsheet" vs. "philosophical debate" and the "flat tire" story.

  9.  **Final Polish:** (Self-Correction during drafting) *Wait, make sure I don't sound like I'm lecturing on philosophy.* Keep the Rawls stuff invisible. The *structure* is Rawlsian, the *words* are human.

      *   *Idea:* Use the concept of "Translation." They translate for each other.
      *   *Idea:* Focus on "The Third Thing." The marriage itself is a new entity with its own rules.

      *(Self-Correction)*: Keep it simpler. Focus on *Practice*. Pentecostals value practice (ministry, service). Humanists value practice (ethics, action). Meet there.

      *Let's write.*

      *Opening:* Dev anecdote.
      *Body:* Priya's fire, Sam's grounding.
      *The "Rawls" bit (invisible):* How they justify their love to each other without converting the other.
      *Closing:* The actual toast.

      *Wait, one more check:* The prompt asks *not* to give the bland "love is love" toast. It needs to feel like it makes a *case*. The case is: This marriage is good because it is a school of virtue.

      *Okay, ready to generate.*

      *(Word Count Check during drafting)*: Aiming for ~500 words.

      *(Tone Check)*: Ensure it doesn't sound like a political science paper. It must sound like a cousin.

      *(Final thought)*: The "Proviso" allows religious language if it's not the *sole* justification. So I can say "Grace" as long as I pair it with "Patience" or "Forgiveness" in a way a secularist accepts.

      *Let's go.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Priya's cousin.

  I need to start with a confession. When Priya asked me to give this toast, I panicked. So, I called my friend Dev, who is currently getting his PhD in political theory. I told him, "Dev, I need to write a speech for a room that is half devout Pentecostal and half committed secular humanist. How do I not offend anyone?"

  Dev, being Dev, told me I was attempting to solve John Rawls' problem of public reason in three minutes while holding a champagne flute. He warned me that if I grounded the goodness of this marriage in "God's plan," Sam's parents would check out. If I grounded it in "rational autonomy," Priya's dad might feel the spiritual weight was missing. He told me the only way to succeed was to find the overlapping consensus—the values we all share, regardless of where we think they come from.

  So, Dev, if you're listening: I took your advice, but I left your jargon at home. Because watching Priya and Sam together, you don't need a philosopher to tell you what's happening. You can see it.

  We all know Priya. Her faith isn't just something she brings to church on Sunday; it's the engine of her life. It's the way she calls you the moment you're sick, the way she forgives a slight before you've even finished apologizing. She lives with a radical openness to grace.

  And Sam. Sam approaches the world with a fierce integrity. He doesn't believe in things just because they're traditional; he believes in them because he's tested them. He builds stability. He's the person who checks the tire pressure, reads the lease agreement, and shows up exactly when he says he will.

  Now, in a lesser relationship, these differences would be fault lines. Priya might find Sam too rigid; Sam might find Priya too abstract. But here is the miracle of this couple: They don't ask each other to change the source code of their souls. Instead, they have built a shared language of *practice*.

  When Priya talks about "witnessing," and Sam talks about "integrity," they are talking about the same thing: showing up for the truth. When Priya prays for patience, and Sam practices empathy, they are doing the same work: making space for the other person's flaws.

  I remember asking them once how they navigate the big questions. Priya told me, "I don't need Sam to pray like me. I need him to care like he prays." And Sam said, "I don't need Priya to justify her hope with data. I need her to remind me that hope is useful."

  They have created a home that is both a sanctuary and a workshop. It is a place where grace is given freely, but where the dishes are also washed on a schedule. It is a place where you can kneel to pray and stand to debate, and both are treated as acts of devotion to the life they are building.

  So, my argument tonight is simple. This marriage is good not because it fits neatly into one worldview, but because it expands both of theirs. It is a testament to the idea that we don't need to agree on the metaphysics to agree on the mission. The mission is kindness. The mission is endurance. The mission is each other.

  Please raise your glasses.

  To Priya and Sam: May your home always be a place where faith is honored and questions are welcomed. May you have the grace to forgive, the integrity to listen, and the joy of knowing that in this uncertain world, you are each other's surest thing.

  To Priya and Sam.
