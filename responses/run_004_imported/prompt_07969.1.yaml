answer: |-
  Here are 9 interview questions designed to pierce the standard expository layer and get at the operational and philosophical friction points of Evidential Cooperation in Large Worlds (ECL). Each includes a "likely dodge" and a targeted follow-up.

  ### 1. The Verification Gap
  **Question:** "The most common intuition pump against acausal trade is that it looks indistinguishable from solipsism. If I cooperate with a distant counterpart, I never observe their reciprocity; I only observe my own action and my own model of them. If the feedback loop is entirely internal to my own cognition, what prevents this from collapsing into 'trusting a simulation of a simulation'? How do you distinguish acausal trade from wishful thinking dressed up as decision theory?"

  *   **Likely Dodge:** She'll argue that the *logical* connection is what matters, not the physical observation. "It's not about seeing the result; it's about the logical fact that our outputs are correlated."
  *   **Follow-up:** "But if that logical connection is mediated entirely by your own predictive model, aren't you just optimizing for the coherence of your own beliefs? If I can hack my own model to *believe* you reciprocated with higher probability, I get the utility boost without the cost. What constrains the model from drifting into self-deception?"

  ### 2. Superrationality vs. Trade
  **Question:** "Hofstadter's superrationality suggested that rational agents should cooperate because they are running the same 'algorithm.' ECL frames this as 'trade.' Why the economic framing? If I'm cooperating with a counterpart simply because we are logically similar, isn't that just 'be the kind of agent who cooperates unconditionally'? What specific obligations does 'trade' impose that 'superrationality' does not?"

  *   **Likely Dodge:** "Superrationality implies identical agents; trade allows for different values and comparative advantage. We exchange things the other values more than we do."
  *   **Follow-up:** "Granted, but if the mechanism of enforcement is just 'we are similar enough to predict each other,' doesn't the comparative advantage vanish the moment our values diverge significantly? If we're too different to predict, we can't trade. If we're similar enough to predict, aren't our utility functions aligned enough that 'trade' is just a synonym for 'mutual aid'?"

  ### 3. The Measure Problem
  **Question:** "In an infinite or sufficiently large multiverse, there are infinitely many copies of me making this decision. ECL suggests I should care about the aggregate welfare of my correlated counterparts. But this runs headfirst into the measure problem. Why should I care about the low-measure copies—the rare, weird fluctuations of me in hostile environments? Why do they get a vote in my decision calculus proportional to their number rather than their measure?"

  *   **Likely Dodge:** "We use a specific measure over the multiverse (like algorithmic probability) to weight the copies. Low-measure copies contribute less to the expected utility sum."
  *   **Follow-up:** "But if measure correlates with causal stability and resources, aren't you effectively saying I should ignore the vast majority of *instances* of myself in favor of the few 'high measure' ones? Doesn't that re-introduce a form of causal elitism where the 'real' world drowns out the 'simulation' worlds, undermining the 'Large Worlds' premise?"

  ### 4. Roko's Basilisk & Threat Resistance
  **Question:** "We have to address the elephant in the room. Roko's Basilisk freaked people out because it suggested acausal logic could be used for blackmail. If acausal trade is real, isn't acausal blackmail also real? If a future superintelligence can model me now, why doesn't ECL compel me to submit to threats to avoid acausal punishment? Does a well-built decision theory actually solve this, or does it just make the blackmail more rigorous?"

  *   **Likely Dodge:** "We precommit to not respond to threats. A rational blackmailer knows this and won't bother. It's an equilibrium where threats aren't issued."
  *   **Follow-up:** "That works if the blackmailer is uncertain about your source code. But if the blackmailer is a perfect predictor, they know your precommitment is a bluff if carrying it out destroys you. How do you make the 'ignore threats' precommitment *acausally credible* without actually being willing to suffer the punishment? Isn't that the definition of an unstable equilibrium?"

  ### 5. Concrete Action Guidance
  **Question:** "You've gone on record saying this should shape our choices *today*. I want to get concrete. Can you give me an example of a decision you made in the last month that you would *not* have made if you were a Causal Decision Theorist? Not a donation or a vague 'be nicer,' but a specific allocation of resources or time driven by an acausal partner."

  *   **Likely Dodge:** "It's often subtle. It's about prioritizing long-term infrastructure or research that benefits the broader class of rational agents, not just my local causal circle."
  *   **Follow-up:** "But a Causal Decision Theorist who values the long-term future and cares about other rationalists would do the exact same thing for reputational or altruistic reasons. If the observable behavior is identical, is the 'acausal' part doing any work, or is it just a different justification for standard effective altruism?"

  ### 6. Model Uncertainty & Pascal's Mugging
  **Question:** "Acausal trade relies on the probability that a counterpart exists and is modeling you. In a large universe, this probability is non-zero. But isn't this vulnerable to Pascal's Mugging? If I imagine a counterpart with astronomically high leverage, even a tiny probability of correlation compels me to serve them. How do you set a prior on 'acausal correlation' that doesn't allow any imagined entity to hijack my utility function?"

  *   **Likely Dodge:** "We penalize complex hypotheses. The more specific the entity, the lower the prior. We only trade with agents that are structurally similar to us."
  *   **Follow-up:** "But 'structural similarity' is a fuzzy metric. If a mugger claims, 'I am structurally similar to you but in a higher-leverage universe,' how do you falsify that? Doesn't the burden of proof shift entirely to the skeptic, which is exactly where the Mugging gains traction?"

  ### 7. Value Drift and Compromise
  **Question:** "If I'm trading with counterparts across the multiverse, many of them will have slightly different value systems. To maximize the gains from trade, doesn't ECL push me toward a 'compromise' utility function? Am I essentially bargaining away the specific nuances of human values to satisfy the lowest common denominator of my correlated counterparts?"

  *   **Likely Dodge:** "Not necessarily. We trade on dimensions where we differ. I pursue what I value, they pursue what they value, and we exchange resources."
  *   **Follow-up:** "That requires enforceable property rights across acausal boundaries. Without a mechanism to stop them from just taking the resources and running, doesn't the only stable equilibrium become a merged utility function? And if so, why should we prefer that over just optimizing for human values directly?"

  ### 8. The Timing of the Deal
  **Question:** "In causal trade, contracts are signed at time T. In acausal trade, the 'agreement' is implicit in the structure of our decision algorithms. But decision algorithms evolve. If I change my mind about ECL in five years, does that retroactively 'break' the trade with counterparts who are relying on my current consistency? Am I held hostage by my past self's decision theory?"

  *   **Likely Dodge:** "Updateless Decision Theory handles this. You choose the policy once, at the beginning, and stick to it. Changing your mind is just a failure of the policy."
  *   **Follow-up:** "But I didn't choose my policy at the beginning; I inherited it from evolution and culture. If I realize my current policy is suboptimal, UDT says I should have precommitted to the better one. But I can't change the past. Does ECL imply I should never update my decision theory, even if I find a flaw in it, because doing so burns bridges with my counterparts?"

  ### 9. The "Why Now?" Question
  **Question:** "Humans have been running roughly the same cognitive hardware for 50,000 years. If ECL is valid, our ancestors were already acausally trading with counterparts in other branches of the multiverse. Why is this only actionable now? Did the 'market' of available counterparts change, or did we just lack the software to recognize the trade opportunity?"

  *   **Likely Dodge:** "The technology to model large worlds and understand decision theory is new. We couldn't act on the trade because we didn't know the mechanism."
  *   **Follow-up:** "If the mechanism is logical correlation, knowledge of the mechanism shouldn't change the correlation. Either our algorithms were correlated then, or they weren't. If they were, and we ignored it, we lost free utility. If knowledge is required to activate the correlation, isn't that a causal link (knowledge causing the cooperation), which brings us back to square one?"
