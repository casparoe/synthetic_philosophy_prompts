answer: |-
  Here are 10 questions organized into five strategic pairs. The first pair pins down the argument to prevent equivocation. The next three pairs correspond to the three standard responses she might offer; you should deploy the pair that matches the move she makes in her answer to the first set. The final pair forces a clear statement on the scope of armchair knowledge.

  ### Phase 1: Pinning the Argument
  *Use these to open the Q&A. They force her to commit to the premises of the "Armchair Knowledge" paradox without yet challenging her conclusion.*

  **1.** "You defend a robust externalism where content is constituted by environmental facts. Do you also maintain that we have privileged, a priori access to the *contents* of our own thoughts in the standard sense? Specifically, can I know I am thinking that *water is wet* without empirical investigation into my environment?"

  **2.** "If you accept both externalism and privileged access, do you accept the closure principle that leads to the McKinsey paradox? That is, if I know a priori that I'm thinking about water, and I know a priori that thinking about water entails the presence of H2O, does it follow that I can know a priori that H2O exists? If not, precisely which step in that transmission of warrant do you block?"

  ### Phase 2: Targeted Challenges
  *Listen to her answer to Question 2. Select **only one** of the following three pairs (3–4, 5–6, or 7–8) that corresponds to the "standard move" she attempts.*

  **Option A: If she denies a priori self-knowledge (Claiming self-knowledge is empirical)**
  **3.** "If I need empirical information about my environment to know what I'm thinking, doesn't that collapse the distinction between self-knowledge and perceptual knowledge? How do I distinguish knowing I'm thinking about *water* from knowing there *is water*?"
  **4. (Follow-up):** "Furthermore, consider 'slow-switching' cases. If I was moved to Twin Earth last night, do I currently lack knowledge of my own thoughts until I investigate my history? If so, doesn't this make self-knowledge too fragile to do the philosophical work we usually require of it?"

  **Option B: If she denies the a priori link (Claiming the content/environment connection is empirical)**
  **5.** "If the connection between my thought content and the external environment is something I can only know empirically, doesn't that invite skepticism about content? How can I be sure I'm thinking about *water* rather than *twin-water* if I can't know a priori what the conditions for possessing that concept are?"
  **6. (Follow-up):** "You might say I don't need to know the conditions to have the thought. But if I can't know a priori that my thought implies H2O, how do I avoid the conclusion that I am systematically ignorant of the very contents I claim to know privilegedly?"

  **Option C: If she accepts the conclusion (Claiming we *can* know external facts a priori)**
  **7.** "If you accept that we can deduce the existence of H2O from the armchair, does this generalize? Can I prove from the armchair that I am not a brain in a vat, simply by noting that I have thoughts that require a physical body?"
  **8. (Follow-up):** "If you say no, it doesn't generalize, what principled distinction stops the slide? Is it that the warrant for self-knowledge is 'entitlement' rather than 'justification,' and if so, does that entitlement really survive the skeptical challenge you're trying to bypass?"

  ### Phase 3: The "Plain Talk" Close
  *Regardless of which path she took above, use these to end the session. They demand a clear statement on the epistemic upshot.*

  **9.** "Setting aside the technical machinery for a moment: what is the substantive scope of armchair knowledge on your view? Are there *any* contingent facts about the physical world that I can legitimately claim to know without leaving my study, or is the 'knowledge' you're describing too thin to count as knowledge of the world?"

  **10.** "Finally, if the price of externalism is that we must revise our traditional understanding of a priori knowledge or self-knowledge, why is that price worth paying? What explanatory gain do we get that outweighs the cost of accepting armchair knowledge of the environment?"
