answer: |-
  **Setting:** *William James's study in Cambridge, Massachusetts. Late autumn, 1907. The air is thick with cigar smoke. William James is pacing, energized by the reception of his recent lectures. Charles Sanders Peirce sits in a heavy leather armchair, looking weary, his clothes slightly rumpled, a glass of wine untouched on the table beside him.*

  **James:** (Gesturing with a cigar) You have to admit, Charlie, the room was electric. They finally get it. It's not a dry logical formula anymore; it's a temperament. It's life!

  **Peirce:** (Grimacing) Life, yes. Logic, no. That is precisely the trouble, William. You have taken a maxim for clarifying hard concepts and turned it into a license for sentimentalism. I read the transcript of your Berkeley address. When you said truth is what is "expedient in the way of our thinking," I nearly threw my pipe into the fire.

  **James:** Expedient! Not in the vulgar sense, you know that. I mean what leads us through experience without contradiction. What connects the old truth to the new fact. If a belief works, if it guides us, if it has "cash-value," isn't that what truth *does*?

  **Peirce:** It is what truth *yields*, perhaps. But it is not what truth *is*. You are confusing the fruit with the root. You make truth subjective. If a belief comforts a dying man, does that make it true? If believing in God gives you moral stamina, does that make God exist? By your account, it seems the utility creates the truth.

  **James:** (Leaning forward) Not creates, Charlie. *Validates.* Truth isn't a static property hanging on a wall waiting to be discovered. It happens to an idea. It becomes true, is made true by events. If the hypothesis of God functions satisfactorily in the widest sense of the word, it is true. Why deny the vital benefits of belief in favor of some cold, dead correspondence to reality?

  **Peirce:** Because reality bites back! That is the point you are smoothing over. There is a Secondness to the universe—a brute force that resists our will. If I walk off a cliff believing I can fly, my belief has "vital benefits" until the moment of impact. Then the reality asserts itself regardless of my satisfaction. Truth cannot depend on the individual's psychological comfort. It must depend on the ultimate opinion of a community of inquirers who investigate long enough.

  **James:** But that community is an abstraction! The "end of inquiry." You define truth as the destination of an infinite scientific investigation. That is a regulative ideal, Charlie, not a living truth. Men need truth *now*. They need to know how to act in the flux of experience. Your truth is a horizon we never reach; mine is the ground beneath our feet.

  **Peirce:** The horizon is real, even if we never touch it! If you cut truth loose from that final consensus, you have no way to distinguish between a true belief and a convenient delusion. You are opening the door to every crank and mystic who claims their fantasy "works" for them. You have made pragmatism a tool for apologists.

  **James:** And you have made it a tool for pedants! You want to freeze the world into definitions. I am trying to save philosophy from the ivory tower. If a concept makes no practical difference to anyone's life, then yes, let us discard it. But if a belief in free will makes a man fight harder against injustice, that belief has a claim to truth that a deterministic "fact" does not. It unlocks energy.

  **Peirce:** (Sighs, rubbing his temples) You speak of energy. I speak of validity. You are a nominalist, William. I see it clearly now. You think only particulars are real. But I am a Scholastic Realist. Generals are real. Laws of nature are real. They are not just summaries of what works for us; they are habits of the universe. Truth is the conformity of our signs to that reality, ascertained not by one man's satisfaction, but by the compulsion of evidence over time.

  **James:** But who compels the evidence? Men do. Fallible, passionate men. You act as if "Logic" is a god outside of human psychology. It isn't. It's a human practice. And sometimes, the human practice requires a leap. The "will to believe." You despise that.

  **Peirce:** I despise that you use my name to sanctify it.

  *(A heavy silence falls. Peirce shifts in the chair, his expression hardening.)*

  **Peirce:** That is why I have had to take steps. I cannot have my logical maxim conflated with your psychological voluntarism.

  **James:** (Stiffening) Steps?

  **Peirce:** I am publishing a paper in *The Monist*. I am renouncing the word "pragmatism." Henceforth, my doctrine shall be known as "pragmaticism."

  **James:** (Laughs, though it sounds strained) Pragmaticism? It sounds like a disease of the liver.

  **Peirce:** Precisely. It is ugly enough to be safe from kidnappers. I want it understood that when I speak of the practical effects of a concept, I mean the conceivable experimental phenomena that would confirm a hypothesis. I do not mean the emotional payoff for the believer. You have taken a precise surgical instrument and used it to butter toast.

  **James:** (Pacing again, agitated) You think ugliness protects truth? Words live by their use, Charlie. "Pragmatism" has caught fire because it speaks to the human condition. If you isolate your "pragmaticism" in a laboratory, it will die. It needs the street. It needs the mess.

  **Peirce:** The mess is what drowns us! Science is the only method that has ever succeeded in settling opinion. Not by what feels good, but by an external permanency. By something upon which our thinking has no effect. You are risking a return to the dark ages where every man is his own pope.

  **James:** And you are risking a philosophy that has nothing to say to a suffering human being! If your "end of inquiry" offers no hope, no moral stake, why should anyone care? Truth must be good for something.

  **Peirce:** Truth must *be*. Whether it is good for you is secondary. If you build a bridge on "what works for you" rather than the laws of physics that will hold for everyone forever, the bridge falls. That is the reality you are flirting with.

  **James:** (Stops pacing, looks at Peirce softly) But Charlie, who builds the bridge? Men. And men build with hope, with intuition, with guesses that aren't yet proven. Your "final opinion" is a regulative hope, just like my God. You believe inquiry will converge. Why? Have you proven that? Or is it a belief that "works" for you, that gives you the stamina to keep logic-ing in your solitude in Milford?

  *(Peirce pauses. He looks down at his wine glass.)*

  **Peirce:** (Quietly) I believe it because the universe is intelligible. It is amenable to reason. That is a metaphysical commitment, I grant you. But it is not a commitment to my own comfort. It is a commitment to the idea that we are not alone in the dark.

  **James:** (Nods slowly) And I am committed to the idea that the dark is full of possibilities we cannot yet measure. That truth is plural. That there may be truths for you and truths for me that do not yet reconcile, but both keep us alive.

  **Peirce:** Then we are at an impasse. You are a pragmatist. I am a pragmaticist.

  **James:** (Smiles sadly) And I suppose the history books will struggle to tell the difference.

  **Peirce:** (Standing up, picking up his hat) Let them struggle. But do not sign my name to your checks, William. The debt is too high.

  **James:** Nor you to mine, Charlie. Nor you to mine.

  *(Peirce nods, a curt, sharp motion, and turns to leave. James watches him go, then turns back to the window, looking out at the Cambridge dusk, tapping his cigar against the ashtray.)*
