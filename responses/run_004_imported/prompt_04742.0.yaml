answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of being Priya's neighbor. I'm also a philosophy professor, which means my spouse has instructed me to keep this under four minutes and to avoid using the word "ontological." I promise to try.

  Priya, looking at you tonight, surrounded by everyone who loves you, it's hard to believe there was ever a time you weren't part of this picture. We know how hard you worked for this. The studying, the waiting, the civics test—which, frankly, is harder than some of the finals I give my undergraduates. But standing here, thinking about what today actually means, I found myself thinking about lines.

  We spend a lot of time talking about borders as if they're like rivers or mountains. As if they're things we discover in the dirt, natural divisions that tell us where "us" stops and "them" begins. But anyone who's ever looked at a map knows that lines on a page are just ink. They're drawings, not photographs. They're decisions we've made, sometimes a long time ago, about who gets to stand inside a circle and who stands outside.

  And I think that's actually what makes tonight so incredibly moving.

  If belonging were just about blood, or soil, or some accident of geography, then Priya standing here wouldn't require much courage. It would just be gravity. But because these lines are human inventions, crossing one is an act of will. It's not about finding a pre-existing truth; it's about making a promise.

  The theory of democracy has always struggled to explain exactly where the line should be drawn. Honestly, I don't think there's a perfect answer. But I do know this: a line drawn on a map is arbitrary. A line drawn between friends is not. A boundary enforced by guards is one thing; a boundary sustained by mutual commitment is something else entirely.

  Priya, you aren't just stepping into a slot that was waiting for you. You're helping to redefine what the slot even is. You're taking a historical accident—an arbitrary border—and you're breathing life into it. You're saying, "I choose this 'we'." And in doing so, you remind the rest of us that "we" isn't a noun. It's a verb. It's something we have to keep doing, every day.

  So, the fact that the line is made up doesn't make it cheap. It makes it precious. Because it means the only thing holding this community together isn't force or fate. It's trust. It's the agreement that when someone new steps across that imaginary line, we don't ask them where they came from; we ask them where we're going.

  Priya, thank you for choosing to go there with us. Thank you for making our "us" bigger, smarter, and infinitely warmer.

  If everyone could please raise a glass.

  To Priya: May the lines on the map always be less real than the people standing beside you. Welcome home.
