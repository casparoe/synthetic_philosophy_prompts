      *   *Argument 2: Implementation Matters.* Aaronson's examples are often abstract mathematical mappings. Physical implementation might lack the causal power required for *actual* $\Phi$ (dynamics vs. static structure).
      *   *Argument 3: The "Grain" of Consciousness.* High $\Phi$ in a simple system might mean a *different kind* of experience, not necessarily "human-like" consciousness. It might be a homogeneous blob of experience rather than rich semantic content.
      *   *Argument 4: Theory-Ladenness.* If IIT is derived from axioms (phenomenology to physics), then the math dictates the physical correlates. If the math says $\Phi$ is high, our intuition is wrong, not the theory.
