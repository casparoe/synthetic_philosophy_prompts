      *   **Section 2: Axioms over Analogies.** Explain IIT's top-down derivation. If axioms hold, conclusions must hold.
      *   **Section 3: Quantity vs. Quality.** Distinguish $\Phi$ (amount) from QM (quality). The expander graph might be conscious but "boring."
