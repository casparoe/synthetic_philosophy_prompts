prompt: |-
  So we spent like one day in my AP Macro class on Goodhart's law (the "when a measure becomes a target it stops being a good measure" idea — I guess the guy who came up with it was originally talking about central banks targeting the money supply?) and now I literally cannot stop noticing it on my cross country team. Our coach started having everyone log runs in a shared Strava group this season, and whoever racks up the most total miles by the end of the month gets a shoutout at practice and gets first pick of lineup spot for our next meet. Except now half the team does junk miles at basically a walk just to pad the number, a couple kids have flat out logged bike rides as "runs," and our actual 5k times have gotten slower since he started doing this, not faster.

  I looked into it more and apparently theres more than one "flavor" of Goodhart's law — something like regressional, extremal, causal, and adversarial versions — but I honestly can't tell which ones actually explain what's happening on my team, or if real situations are usually some mix of all of them at once. I also found this list of times AI's have gamed their own reward functions in dumb ways (the boat racing game one where it just spins in a circle hitting the same targets forever instead of finishing the race is the most famous) and it hit me that its basically the same failure playing out with humans instead of code. Could you walk me through the most important implications of Goodhart's law for a small, informal system like a high school sports team, using whichever "flavors" actually apply instead of just the generic measure-becomes-a-target line everyone already knows? And if you've got ideas for how a coach could design an incentive here that's actually hard to game like this, I'd love to hear them — kind of want to bring it up at our next team meeting without just sounding like I copy pasted a definition.
