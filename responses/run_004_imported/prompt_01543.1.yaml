answer: |-
  Your TA has excellent instincts. While it is tempting to group Hobbes and Descartes together as "champions of geometry against the Scholastics," lumping them together as sharing the *same epistemological basis* for that certainty is where the story breaks down.

  The "move" historians of philosophy use to reconcile Hobbes's radical empiricism (all thought is decaying sense) with his rationalism about geometry (geometry is the only true science) rests on three pillars: **Nominalism**, **Generativity**, and **Materialism**.

  Here is the breakdown of the reconciliation, and why your TA felt that friction.

  ### 1. The Source of Certainty: Discovery vs. Construction
  This is the biggest divergence from Descartes.
  *   **Descartes:** Geometric truths are discovered by the intellect inspecting innate ideas. The intellect transcends the senses (the Wax Argument). We know a triangle has 180 degrees because our clear and distinct perception grasps an eternal truth guaranteed by a non-deceiving God.
  *   **Hobbes:** Geometric truths are **constructed by the human mind**. We know geometric truths with certainty not because they are eternal forms we access, but because **we made them.**

  This is the crucial "move": For Hobbes, geometry is certain *because* it is empirical in a specific sense—it is the science of **motion** generated by us. In *De Corpore*, Hobbes argues that geometry is the study of "quantity of motion." When a geometer defines a line, they are conceiving of a point moving. When they define a circle, they are conceiving of a line moving around a fixed point.

  Because the geometer stipulates the definition and generates the figure (either in imagination or on paper), they know the causal history of the object perfectly. We know the truth of geometry because we are the authors of the definitions. As Hobbes puts it, we know civil philosophy well because we make the commonwealth; similarly, we know geometry well because we construct the figures.

  **The Reconciliation:** The *materials* of the thought (the image of the line) come from the senses (satisfying *Leviathan* Ch. 1). But the *certainty* comes from the fact that the mind actively constructs the figure according to a stipulated name, rather than passively receiving data from an external object.

  ### 2. Truth as "Right Ordering of Names" (Nominalism)
  In *Leviathan*, Hobbes famously defines truth not as a correspondence between mind and world, but as **"the right ordering of names in our affirmations."**

  *   **Descartes:** Truth is a relation between the intellect and reality (mediated by God).
  *   **Hobbes:** Truth is a relation between names (linguistic/conceptual consistency).

  For Hobbes, geometric certainty is linguistic and logical. If I define a "square" as a four-sided figure with right angles, the proposition "a square has four sides" is necessarily true. Why? Not because of a Platonic Form, but because I decided that the sound "square" *means* that specific construction.

  **The Reconciliation:** This fits his empiricism because names are tags we apply to sensory conceptions to help our memory and reasoning. Geometry is the one science where we control the definitions of the names absolutely. In physics or politics, the "things" (rocks, men) exist independently of our names. In geometry, the "things" (circles, lines) exist *only* insofar as we define and conceive them. Therefore, the sensory origin of the conception doesn't undermine the certainty of the proposition, because the proposition is really just unpacking a definition we created.

  ### 3. The "Squaring the Circle" Obsession as Evidence
  You mentioned his feud with Wallis. This isn't just a fun anecdote; it's philosophical evidence. Why did Hobbes, a smart guy, spend decades insisting he squared the circle against the rising tide of calculus and algebraic geometry?

  Because Hobbes viewed geometry as **physical construction**. He believed that if you couldn't draw it or conceive of it as a motion of bodies, it wasn't geometry. Wallis and the others were moving toward abstract algebraic analysis, which Hobbes saw as "scabrous" word games detached from physical reality.

  Hobbes's insistence on squaring the circle stems from his belief that geometry must remain tethered to the **sensory/conceivable world of motion**. If your TA felt something "off" about lumping him with Descartes, it's because Descartes would be happy to accept a geometric truth derived from pure intellect even if it defied sensory imagination. Hobbes would not. For Hobbes, if you can't conceive it via sense-derived motion, it's not geometry.

  ### Pedagogical Recommendation
  Your TA is right to flag this. If you teach them as allies, you obscure the fundamental split in early modern epistemology.

  *   **Descartes:** Geometry is certain because the **Intellect** escapes the Senses.
  *   **Hobbes:** Geometry is certain because the **Intellect** (which is just computation of sensory names) **Constructs** the object.

  **The "Move" to teach your students:**
  Hobbes does not contradict his empiricism. He saves geometry *by* grounding it in empiricism, but an empiricism of **human making** rather than **passive receiving**.
  1.  **Origin of Ideas:** Sensory (Empiricism).
  2.  **Method of Reasoning:** Computational/Nominalist (Adding and subtracting names).
  3.  **Source of Certainty:** We know it because we defined it and generated it (Constructivism).

  Descartes saves geometry by appealing to God and Innate Ideas. Hobbes saves geometry by appealing to Human Stipulation and Motion. They arrive at the same high status for geometry, but from opposite metaphysical directions.

  If you frame it that way, you keep your "Geometrical Method" unit intact, but you turn the Hobbes/Descartes relationship from "Allies" into "Rival Claimants," which is much more philosophically fruitful.
