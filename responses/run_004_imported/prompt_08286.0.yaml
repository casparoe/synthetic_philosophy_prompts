  **Move 1 (Marcus): 1**
  Marcus is deploying a straightforward Lewisian counterfactual analysis of causation. On this view, $c$ causes $e$ if and only if, had $c$ not occurred, $e$ would not have occurred. This is the intuitive bedrock of most causal reasoning and scores well for capturing our basic instincts about dependence. However, in the literature, this is considered the "naive" starting point because it lacks the resources to handle preemption, overdetermination, and specifically the problem of omissions, which Nadia immediately exploits. It is defensible but incomplete.

  **Move 2 (Nadia): 2**
  This is the classic "proliferation problem" (sometimes associated with the problem of "too many causes"). If counterfactual dependence is sufficient for causation, then the absence of any sufficient condition counts as a cause. This leads to the absurd conclusion that the Queen of England, a random stranger, and the lack of a magical rain spell all caused your tomatoes to die. Nadia correctly identifies that a viable theory of causation must include a selection mechanism to distinguish *the* cause from the background conditions. This is a devastating reductio against Move 1.

  **Move 3 (Marcus): 1**
  Marcus attempts to solve the proliferation problem by introducing normative expectations (the promise). This aligns with contextualist views of causal explanation, where "cause" is a pragmatic label we apply to what is abnormal or relevant to our interests. However, this scores lower because it risks conflating *causal selection* with *moral responsibility*. While it solves the practical problem, it leaves the metaphysical status of the causation unclear, inviting Nadia's next objection.

  **Move 4 (Nadia): 2**
  Nadia correctly identifies the risk of collapsing the descriptive into the normative. If causation tracks promises, then causation becomes mind-dependent or morality-dependent. Most metaphysical realists want causation to be a feature of the world, not our social contracts. Her point that blame and cause can come apart (e.g., a blameless driver hits a child who runs into the road; the driver caused the death but isn't to blame) is a standard and strong distinction in both ethics and metaphysics.

  **Move 5 (Marcus): 2**
  This is Marcus's strongest move, appealing to the Hart and Honoré distinction between "causes" and "background conditions." We routinely exclude oxygen from the explanation of a fire not because it isn't causally necessary, but because it is a "normal" condition. If we define "normal" statistically or functionally (rather than morally), Marcus can pick out Jake's omission without invoking blame. This is a robust defense of how causal *explanation* works in practice, even if it leaves the underlying metaphysics slightly vague.

  **Move 6 (Nadia): 1**
  Nadia shifts to a process theory of causation (like Salmon or Dowe), where causation requires a physical transfer of energy or a conserved quantity. Since an omission is "nothing," nothing is transferred. This is metaphysically rigorous and highlights the ontological weirdness of "causing by not doing." However, it scores lower because it leads to skepticism about most everyday causal claims (e.g., "starvation caused death"). Most contemporary philosophers accept omissions as causes *in some sense* to avoid this skepticism, suggesting her metaphysical bar is too high for practical ontology.

  ***

  **The Missing Consideration: The Ontological Category of the Relata**

  Neither Marcus nor Nadia explicitly questioned *what kinds of things* stand in the causal relation. Nadia assumes causation must relate **events** (concrete particulars where energy is transferred), which leads her to deny omissions are causes (Move 6). Marcus assumes causation relates **counterfactual dependencies**, which allows omissions but creates the proliferation problem (Move 1).

  A crucial consideration missing from the debate is the view that causation relates **facts** (or propositions) rather than events. If the causal relata are facts (e.g., "The fact that Jake did not water" caused "The fact that the plants died"), then the ontological worry about "nothing happening" dissolves, because facts can be negative. Furthermore, this pairs well with **Contrastivism** (defended by Jonathan Schaffer), which argues causation is a quaternary relation: $c$ rather than $c^*$ causes $e$ rather than $e^*$. This solves Nadia's proliferation problem without relying on norms: Jake's *not-watering rather than watering* caused the death, whereas Nadia's *not-watering rather than watering* is not the relevant contrast in this causal model. This distinction allows you to validate Marcus's intuition (Jake is the cause) without accepting Nadia's fear that causation is merely a disguised moral judgment.
