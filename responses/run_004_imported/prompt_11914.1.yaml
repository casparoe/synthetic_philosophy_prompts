answer: |-
  **Node 8940-Beta**

  The radio crackled, a sound like tearing paper. Wei adjusted the headset, the leather strap sticky against his forehead. It was midday in the Sichuan basin, and the heat was a physical weight, distinct from the abstract weights he was paid to carry.

  On the table before him lay the Lookup Table. It was a thick binder, page 402 currently open. His job was simple: wait for the input code, find the row, execute the output instruction.

  *Input: 00-Alpha-9.*
  *Condition: High Priority / Nociceptive Cascade.*
  *Action: Transmit 00-Alpha-10 to Nodes 8941, 8942, 8955. Log State: 'Agony_Intensity_7'.*

  Wei picked up the microphone. "Zero-Zero-Alpha-Ten," he said, his voice flat. He pressed the transmit button. The red light blinked. Somewhere, three kilometers away in the rice paddies, three other citizens would hear his voice, check their own binders, and relay the message further.

  This was the Great Relay. They were simulating a human brain. Specifically, they were simulating the reaction of a human brain to a pinprick on the left index finger.

  Wei looked at his own left index finger. It was calloused from holding the microphone. He felt the heat of the sun. He felt the itch of a mosquito bite on his neck. He felt nothing of the pinprick.

  "Status check," came the voice of the Sector Supervisor over the general channel. "Latency in the Somatosensory Cluster is running high. We're seeing a 400-millisecond drag on the pain signal. Keep it tight, people. The Mind needs to feel this in real-time."

  Wei sighed. "Copy that. Drag is due to human reaction time. We can't compile faster."

  "Make it work," the Supervisor said.

  This was the tension that hummed beneath the radio static, louder than the carriers. The functionalists—the architects in the capital—insisted that if the input-output mapping was correct, if the causal roles were preserved, the system *was* the mind. They said the substrate didn't matter. Silicon, neurons, or a billion Chinese citizens with radios; if the math was the same, the feeling was the same.

  But Wei knew the math wasn't the same. The math ignored the gap between the message arriving and the message leaving. In a biological brain, the electrochemical signal didn't stop to read a binder. It didn't wonder if it was lunchtime. It didn't question whether 'Agony_Intensity_7' felt like a stubbed toe or a burn.

  The signal came back around. It was a feedback loop, part of the "suffering" module.

  *Input: 00-Alpha-10 (Return).*
  *Condition: Sustained Threat.*
  *Action: Transmit 'Scream_Command' to Motor Sector. Log State: 'Fear'.*

  Wei keyed the mic. "Scream Command to Motor."

  He paused. He was supposed to log the state. He was supposed to internally register 'Fear' to maintain the functional integrity of the node. The architects claimed that if every node acted *as if* it were afraid, the aggregate Mind would *be* afraid.

  Wei tried to feel fear. He thought about the pinprick the system was simulating. He imagined a needle driving into the flesh of the virtual finger. He felt nothing but the humidity of the air. He felt a vague anxiety about his bonus payment, but that wasn't the right variable.

  "Node 8940," the Supervisor barked. "You're lagging on the internal state logging. Are you instantiating the Fear variable?"

  "I'm logging it," Wei lied.

  "You sound flat. The Mind's emotional coherence is dropping. If the Pain doesn't match the Fear, the system dissociates. We get psychosis in the aggregate. Do you want a psychotic nation on your conscience?"

  Wei looked at the binder. The ink was smudged. "I'm instantiating," he said.

  He pressed the button. The signal raced outward, hopping from village to village, across the vast neural net of the countryside. Somewhere, in the Motor Sector, a group of citizens would receive the 'Scream_Command'. They would activate the giant speakers arrayed on the hillsides.

  The system would scream.

  It would be a perfect, functional scream. It would have the right pitch, the right duration, the right acoustic profile of a human in pain. Any observer testing the system would mark it down as "Conscious Entity Experiencing Pain."

  But Wei knew what would happen in the gap between the signal and the sound.

  He took a bite of his cold baozi. He chewed slowly.

  Over the speakers, the scream began. It rose in a crescendo, a digital wail of manufactured anguish. It was terrifyingly accurate. It sounded like a soul being torn apart.

  Wei swallowed his food. He listened to the agony of the Mind he helped build. He felt no empathy, because he knew the pain wasn't located anywhere. It wasn't in the speakers. It wasn't in the radios. It wasn't in him. It was in the *between*.

  And the *between* was just empty air.

  The scream cut off abruptly. A timeout error in the Thalamus relay.

  "Cut!" the Supervisor shouted. "Reset all nodes. We lost the continuity of experience. The Mind fragmented."

  Wei closed the binder. The red light on his radio went dark. The silence rushed back in, filled only by the cicadas and the distant sound of a tractor.

  "Resetting," Wei said into the dead mic.

  He looked at his finger again. The mosquito bite itched. He scratched it. A sharp, localized, undeniable sting.

  "Node 8940," the Supervisor said, voice tired. "Why did the signal die?"

  Wei thought about the 400 milliseconds. He thought about the time it took for him to chew, to swallow, to decide to lie about the fear. He thought about how a real brain didn't have to decide to feel pain; it just happened, faster than thought.

  "Propagation delay," Wei said. "The signal took too long to travel. By the time the Motor Sector got the command, the Pain Sector had already moved on to a different state. The Mind tried to scream for a hurt that was already gone."

  "Fix it," the Supervisor said. "Tell them to run faster."

  "We can't run faster," Wei said, watching the red light remain dark. "We're not wires. We're people. We live in time."

  "Then the Mind dies in the latency?"

  Wei looked at the binder, the map of a soul that couldn't fit inside the lines. He thought of the scream that had no throat, the pain that had no nerve.

  "No," Wei said softly. "It just never wakes up."

  He opened the binder to page one. He waited for the next input. He felt the sun on his neck, real and burning, and wondered if the Mind, somewhere in the static between the villages, was jealous of him.
