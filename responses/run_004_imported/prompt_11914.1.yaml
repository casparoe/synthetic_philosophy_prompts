  5.  **Refining the "Implied Position":**
      *   To imply that multiple realizability *breaks down*, I need to show that the *substrate matters*. If the substrate is people, their individual consciousness interferes with the collective consciousness. They get bored. They doubt. They introduce latency.
      *   If the system were truly conscious, the individual parts shouldn't matter (multiple realizability). But here, the individual parts *do* matter because they are conscious themselves. This creates a "ghost in the machine" problem where the ghosts are the workers.
      *   *Key Image:* The lag. Consciousness requires synchronicity. If the signals take seconds to travel between people, the "thought" dissolves before it forms.

  6.  **Writing - Focusing on Sensory Details:**
