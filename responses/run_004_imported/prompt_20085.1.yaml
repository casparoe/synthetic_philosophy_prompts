          *   *Follow-up:* If he says "Yes, I bet on the big universe," ask why this doesn't violate principles of empirical inquiry.

      *   *Requirement 2: Cosmological Implications.*
          *   *Idea:* Does SIA give us near-certainty about a multiverse before looking through a telescope?
          *   *Draft:* Do you know the universe is big before looking?
          *   *Refinement:* Focus on "a priori" knowledge. If SIA cancels DA, it implies a prior bias toward populated worlds. Does this mean we can rule out "Small World" cosmologies without data?
          *   *Follow-up:* If he says "Yes," ask if this makes cosmology trivial. If "No," ask where the cutoff is.

      *   *Requirement 3: Waking up as Evidence.*
