          *   *Draft:* Is waking up evidence?
          *   *Refinement:* Challenge the conditionalization. In SB, Beauty knows she will wake up. If $P(Wake) = 1$ in both Heads and Tails, how can it be evidence? This is the "Centered Evidence" debate.
          *   *Follow-up:* If he says "It's centered evidence," ask how that differs from magic or why standard Bayesianism fails here.

      *   *Requirement 4: Scaling the Experiment.*
