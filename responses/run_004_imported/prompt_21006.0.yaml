prompt: |-
  I've been working through G.E. Moore's Principia Ethica on my own (no philosophy degree, just a guy with too many library holds) and I keep getting stuck near the end, chapter six if I remember right, where he decides the two best things in existence, full stop, are personal affection and appreciating beauty. Next week's guest on my little podcast wrote a whole book defending that exact ranking, and I don't want her just re-explaining it to me. Can you draft seven or eight interview questions -- at least one on his thought experiment about a gorgeous world and a hideous one that literally nobody will ever see, and whether beauty's worth anything with zero minds around to notice it; one on the "organic unities" move he pulls to say loving someone for virtues they don't actually have wrecks the value of the whole relationship, which smells like a rule invented after the fact just to dodge counterexamples; and one on how Moore himself, later in that reply-to-his-critics piece, seemed to walk a lot of this back without saying what should replace it. Give each a quick follow-up keyed to whatever answer she's most likely to give first, and end on a question asking what it would actually take for her to admit love and beauty aren't specially at the top, rather then just really good things among others.
