answer: |-
  The wind off the Cam was biting, even through the glass of the master's lodgings. Isaac Newton stood by the window, his hands clasped behind his back, watching the courtyard below. It was 1710. Down there, in the cold, William Whiston was packing a cart.

  Whiston, his successor in the Lucasian Chair. A brilliant man. A pious man. A fool.

  Newton did not move as the servants loaded Whiston's books. He knew the charge: Arianism. Denying the co-eternity of the Son. Denying the Trinity. It was the same heresy Newton had nursed in the quiet of his own skull for forty years. He watched Whiston argue with a proctor, the younger man's breath pluming in the air, his face flushed with the righteous heat of a martyr who believes the world will thank him for his honesty.

  Newton felt nothing but a cold stone in his gut.

  He remembered 1675. The letter from King Charles II lying on his desk, the wax seal broken. A royal dispensation. It exempted him from taking holy orders, a requirement for his fellowship at Trinity. To take orders, he would have had to subscribe to the Thirty-Nine Articles. He would have had to stand before the altar and swear that the Athanasian Creed was true. *There is one Person of the Father, another of the Son, and another of the Holy Ghost... And yet they are not three Gods, but one God.*

  To Newton, this was not mystery. It was arithmetic. It was idolatry. It was the corruption of the primitive church by the fourth-century bishops, a fog of Greek metaphysics laid over the simple sovereignty of the Father. To swear to it would be to lie to God. But to refuse it was to lose the fellowship, to lose the room, to lose the time. And without the time, there is no *Principia*. Without the position, there is no voice.

  He had chosen the position. He had chosen the silence.

  He turned from the window to his desk. The papers there were neat, stacked, innocuous. Alchemical notes. Chronologies of ancient kingdoms. Nothing that would burn.

  His mind drifted back to 1690. The manuscript. He had written it carefully, a textual dismantling of the two great pillars of Trinitarian proof: the Comma Johanneum in 1 John 5:7 and the mystery of godliness in 1 Timothy 3:16. He had shown them as later insertions, scribal frauds. He had sent it to John Locke in London. Locke was to have it translated into French and printed in Holland, anonymous, safe.

  For three weeks, Newton had walked with a lightness he hadn't felt since his mother died. The truth would be out. Not in his name, but *out*.

  Then, the fear arrived. Not a fear of hell—he had no fear of that—but a fear of chaos. If the doctrine fell, what held the church? If the church fell, what held the state? And if the state turned on him, who would protect the natural philosophy? He had written to Locke, his handwriting jagged with panic. *Stop the press. Burn the copy.* He had bought back his own words like a man buying back a sin.

  Below, Whiston climbed onto the cart. He looked up, perhaps toward the windows of the masters, perhaps toward the chapel. He looked like a man who expected God to strike him down or lift him up.

  Newton knew God would do neither. God was watching, yes, but God was One, and He was patient. It was men who were impatient.

  He thought of the term he had read once, in a letter from a continental divine. *Nicodemism.* Like Nicodemus in the Gospel, coming to Jesus by night so as not to be seen by the Pharisees. Newton had lived in the night for forty years. He had sat in the chapel stall, week after week, year after year. He had stood when the others stood. He had mouthed the words when the organ swelled. *Glory be to the Father, and to the Son, and to the Holy Ghost.*

  Every time was a knife. Every time was a calculation. *If I am ejected, the work stops. If I am silent, the work continues.* He had traded his soul's comfort for the universe's laws. He had allowed the Trinity to stand so that Gravity could sit.

  Whiston's cart began to move. The wheels crunched on the gravel. Newton did not wave. To wave would be to acknowledge a bond, and there was no bond. Whiston was a witness; Newton was a survivor.

  He turned back to the desk and dipped his quill. There was a letter to be written to the Vice-Chancellor, confirming the College's adherence to orthodoxy. It required his signature. It required his seal.

  Newton blotting the ink, he looked at his hand. It was the hand that had mapped the orbits of the comets, the hand that had decoded the light of the sun. Now it would sign a lie. It was the price. The world wanted a Christian sage, not a Jewish monotheist in a wig.

  He wrote his name. *Is. Newton.*

  He blew on the ink to dry it. Outside, the chapel bell began to toll for vespers. The sound vibrated through the floorboards, up through the soles of his shoes. It was time to go down. It was time to stand in the stall. It was time to open the prayer book and pretend.

  Newton put on his hat. He checked his face in the small mirror on the wall. The expression was severe, composed, orthodox. It was a mask he had worn so long it had begun to fuse with the skin.

  He opened the door and stepped out into the corridor, walking toward the bell, walking toward the lie, walking alone.
