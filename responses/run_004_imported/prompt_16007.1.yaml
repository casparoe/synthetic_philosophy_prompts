  9.  *(Final Polish)*: Ensure the distinction between *knowing that* (description) and *knowing how/what it's like* (acquaintance/phenomenology) is sharp. Paul's innovation is saying this gap breaks *Expected Utility Theory*. That's the specific "new" thing.

