      *   *Self-Correction on Russell:* Make sure not to overstate Russell. He was focused on logical atomism. The "acquaintance" bit is specific to sense-data and universals. Applying it to "parenthood" is already a stretch of Russell, which supports the user's suspicion that Paul is doing something slightly different.
      *   *The "Vampire" Point:* Ensure I explain *why* the vampire case matters. It's about *valuing* the experience, not just knowing the physics of it.
