answer: |-
  Your faculty advisor was absolutely right, and your committee's experience is a textbook case study in **Social Choice Theory**. You did not choose badly among the three methods; rather, you encountered the structural limits of aggregating preferences. What happened to your committee is not a bug of democracy, but a feature of mathematics.

  To understand why this was bound to happen, we need to break down exactly which theoretical failure occurred in each of your voting rounds.

  ### 1. The Plurality Vote (The "Tie")
  **Method:** Count first-choice votes only.
  **Result:** Boathouse (4) vs. Rooftop (4).
  **Theoretical Issue:** **Information Loss.**

  Plurality voting assumes that a voter's first choice contains all the necessary information about their will. In your committee, the four people who voted for the Rooftop ranked the Boathouse third or fourth. The four who voted for the Boathouse ranked the Rooftop first or last. By ignoring the rankings, Plurality treated a "tepid preference" the same as a "strong preference." It failed to capture the intensity of opinion, leading to a deadlock that didn't reflect the nuanced consensus (or lack thereof) of the group.

  ### 2. The Head-to-Head Comparison (The "Cycle")
  **Method:** Pairwise majority rule (Condorcet Method).
  **Result:** Boathouse beats Rooftop; Rooftop beats Barn; Barn beats Boathouse.
  **Theoretical Issue:** **The Condorcet Paradox.**

  This is the first major theoretical wall you hit. We generally assume that group preferences should be **transitive**: if the group prefers A to B, and B to C, the group should prefer A to C. Your data proves this is not always true.

  Let's look at the specific math of your cycle:
  *   **Boathouse vs. Rooftop:** The 2 (Type 1) + 1 (Type 3) + 2 (Type 4) voters prefer Boathouse. That's 5 votes. Boathouse wins.
  *   **Rooftop vs. Barn:** The 2 (Type 1) + 4 (Type 2) voters prefer Rooftop. That's 6 votes. Rooftop wins.
  *   **Barn vs. Boathouse:** The 4 (Type 2) + 1 (Type 3) voters prefer Barn. That's 5 votes. Barn wins.

  This creates a loop: **Boathouse > Rooftop > Barn > Boathouse.**

  This phenomenon, identified by the Marquis de Condorcet in 1785, demonstrates that a "will of the group" may not exist as a coherent, single entity. The majority is not a monolith; it is a coalition that shifts depending on which options are paired. If you had voted on these pairs in a different order (an **agenda**), you could have manufactured a win for any of the three venues.

  ### 3. The Points System (The "Flip")
  **Method:** Borda Count (3 points for 1st, 0 for 4th).
  **Result:** Boathouse wins (18 pts) vs. Rooftop (17 pts).
  **Method:** Borda Count (Ballroom removed).
  **Result:** Rooftop wins (10 pts) vs. Boathouse (9 pts).
  **Theoretical Issue:** **Violation of Independence of Irrelevant Alternatives (IIA).**

  This is the most infuriating part of your experience, and it is the specific evidence your advisor was likely referencing regarding Arrow's Theorem.

  **Independence of Irrelevant Alternatives (IIA)** states that the group's ranking of two options (say, Boathouse vs. Rooftop) should depend *only* on how individuals rank those two options. It should not change if a third, irrelevant option (the Ballroom) is added or removed, provided no one changes their mind between Boathouse and Rooftop.

  In your committee, **no one changed their mind.** Yet the winner flipped. Why?

  Look at the two voters with the ranking: **Boathouse > Barn > Ballroom > Rooftop.**
  *   **With 4 options:** They give Boathouse 3 points and Rooftop 0 points. The "distance" between their favorite and least favorite is 3 points.
  *   **With 3 options (Ballroom removed):** Their ranking becomes **Boathouse > Barn > Rooftop.** They now give Boathouse 2 points and Rooftop 0 points. The "distance" shrinks to 2 points.

  Because the Borda Count assigns points based on the *number* of candidates, removing a candidate compresses the scale. The Boathouse relied on the Ballroom existing to pad its lead over the Rooftop. When the Ballroom was removed, the Boathouse lost more relative ground than the Rooftop did. The presence of a universally despised option (Ballroom) altered the outcome between two viable options. This violates IIA.

  ### Was the Advisor Right? (Arrow's Impossibility Theorem)

  Yes. In 1951, economist Kenneth Arrow proved mathematically that **no rank-order voting system can be fair in all cases.** He defined "fair" using four reasonable criteria:

  1.  **Unrestricted Domain:** The system must handle any set of voter preferences (like your cyclic ones).
  2.  **Non-Dictatorship:** No single voter should dictate the outcome.
  3.  **Pareto Efficiency:** If everyone prefers A to B, the group must prefer A to B.
  4.  **Independence of Irrelevant Alternatives (IIA):** As described above.

  Arrow proved that if you have more than two options, it is impossible to design a system that satisfies all four conditions simultaneously.
  *   **Plurality** fails Pareto Efficiency and ignores rankings.
  *   **Pairwise (Condorcet)** fails Transitivity (as you saw with the cycle).
  *   **Borda Count** fails IIA (as you saw with the flip).

  Your committee didn't fail; the math failed you. You rediscovered the reason why "the will of the people" is often a philosophical fiction rather than a mathematical reality.

  ### Is There a "Right" Default?

  There is no perfect method, but there are methods that are more robust depending on what you value.

  1.  **If you want to avoid cycles:** You need a **Condorcet Method with a Tie-Breaker** (like the Schulze method or Ranked Pairs). These methods detect the cycle and resolve it by looking at the *strength* of the defeats.
      *   *In your case:* Boathouse beat Rooftop by 1 vote (5-4). Rooftop beat Barn by 3 votes (6-3). Barn beat Boathouse by 1 vote (5-4).
      *   A "Minimax" tie-breaker would look at the worst defeat for each candidate.
          *   Boathouse's worst defeat: Lost to Barn by 1 vote.
          *   Rooftop's worst defeat: Lost to Boathouse by 1 vote.
          *   Barn's worst defeat: Lost to Rooftop by 3 votes.
      *   Barn is eliminated first. Then Boathouse beats Rooftop. **Boathouse wins.** This method respects the pairwise majorities while forcing a transitive result.

  2.  **If you want to avoid IIA violations:** You must move away from *ordinal* rankings (ranking A above B) to *cardinal* ratings (rating A as 8/10 and B as 5/10).
      *   **Score Voting (Range Voting):** Voters give each venue a score from 0 to 5. This escapes Arrow's Theorem because Arrow's proof applies only to ranked systems. It captures intensity (how much you hate the Ballroom) without creating cycles.
      *   **Approval Voting:** Voters simply approve or disapprove of each venue. (e.g., "I would be happy with Boathouse or Rooftop"). This is simple, resistant to strategy, and avoids the "irrelevant alternative" flip.

  ### Summary for Your Course

  When you discuss this in your democratic theory course, you can frame your committee's experience as an empirical verification of **Arrow's Impossibility Theorem**.

  *   **The Lesson:** "Reflecting the will of the group" is not a discovery process (like finding a hidden object); it is a construction process. The outcome is determined as much by the *method of aggregation* as by the *preferences of the voters*.
  *   **The Takeaway:** There is no neutral way to count votes. Every voting method embeds a value judgment. Plurality values broad consensus poorly; Borda values compromise but is unstable; Pairwise values majority rule but can be incoherent.
  *   **The Recommendation:** For a small committee like yours, **Approval Voting** is likely the most robust practical solution. It would have asked: "Which venues are acceptable?" If the Boathouse supporters also approved the Rooftop (or vice versa), the tie would have broken naturally without needing to rank the Ballroom.

  Your advisor was right: you didn't just have a messy meeting. You ran headfirst into the fundamental limits of collective decision-making.
