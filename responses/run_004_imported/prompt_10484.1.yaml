answer: |-
  You have a very good instinct—that nagging feeling is telling you the truth. You have grasped the *vibe* of both thinkers correctly (Peirce = dry/scientific, James = personal/human), but your draft flattens a massive philosophical disagreement into a minor stylistic difference.

  If you send this as-is, you will be teaching your friend the exact caricature of pragmatism you were trying to avoid, specifically regarding Peirce.

  Here are the three main places where your draft goes off the rails, and how to fix them without making it too dense.

  ### 1. The "Same Thing" Error
  **Your draft:** *"So really the two of them were saying the same thing... Peirce was just the drier first draft."*
  **The Reality:** They were **not** saying the same thing. In fact, Peirce was horrified by James's interpretation. Peirce believed truth was objective and independent of what any individual thinks. James believed truth was something that *happens* to an idea when it proves useful to a person.
  **The Fix:** Acknowledge that James took Peirce's logical tool and turned it into a psychological one. Peirce actually renamed his own philosophy **"Pragmaticism"** (which he called an "ugly enough" name) specifically to distinguish it from James's "Pragmatism" because he didn't want to be associated with James's "truth is what feels good" take.

  ### 2. Peirce on Truth vs. Meaning
  **Your draft:** *"He carried this over to truth itself too: a belief is true if it's the one that keeps working out for you..."*
  **The Reality:** Peirce's "Pragmatic Maxim" was primarily about **meaning**, not truth. He said: *To understand what a concept means, look at its practical effects.*
  Regarding truth, Peirce was a **realist**. He didn't think truth was just "what works for you." He thought truth was what corresponds to reality. His "community of investigators" point wasn't just about consensus; it was about the idea that reality is so stubborn that if enough people investigate it for long enough, reality will *force* them all to agree on the same conclusion.
  **The Fix:** Clarify that for Peirce, the "consensus" isn't a vote; it's the inevitable result of bumping up against external reality.

  ### 3. The "Peirce was glad" Myth
  **Your draft:** *"...my understanding is Peirce was glad to have James spread it to a wider audience."*
  **The Reality:** Peirce was not glad. He felt James had made pragmatism too subjective and relativistic. He worried it would lead to the exact "believe whatever you want" attitude you mentioned in your opening paragraph.
  **The Fix:** Remove the claim that he was glad. Mentioning he renamed his philosophy to distance himself is a great trivia fact that shows you really know the history.

  ### Suggested Revision
  Here is a version that keeps your voice and length but corrects the philosophical errors:

  > "Pragmatism started with Peirce, who said an idea's **meaning** comes down to whatever practical difference it would make if it were true. He was a scientist at heart, so he viewed truth as something objective. He argued that if a community of investigators kept researching forever, reality would eventually force them all to agree on the same conclusion. So for Peirce, truth isn't just 'what works for you,' it's the final opinion reality forces us to accept.
  >
  > James took that basic tool and made it famous, but he shifted it toward the individual. For James, truth isn't just a static fact waiting to be found; it's something that happens to an idea when it proves useful in your life. He called this 'cash value.'
  >
  > So while they both focused on practical results, they actually disagreed on the end goal. Peirce wanted to secure scientific objectivity, while James wanted to make room for human experience and belief. It actually caused a bit of a rift—Peirce liked James's popularity but disliked his interpretation so much that he eventually renamed his own philosophy 'Pragmaticism' just to tell them apart."

  ### Why this is safer
  1.  **Distinguishes Meaning vs. Truth:** It clarifies Peirce's maxim was about meaning.
  2.  **Protects Peirce's Realism:** It explains that the "consensus" is forced by reality, not just groupthink.
  3.  **Acknowledges the Split:** It corrects the idea that they were on the same team, which is the biggest historical inaccuracy in your draft.

  You did a great job navigating Peirce's difficult texts via secondary sources; your intuition that you might be smoothing something over was spot on. With those tweaks, you'll be giving your friend a solid foundation rather than a common misconception.
