  ### Explanations for the Ranking

  **Mostly Naturalistic**
  *   **Broken leg:** This is a clear structural failure of bone tissue that universally impairs the biological function of support and locomotion, regardless of cultural context or personal values.
  *   **Type 1 diabetes:** The autoimmune destruction of pancreatic beta cells is a measurable biological fact that prevents insulin production, leading to life-threatening dysfunction without intervention.

  **Leans Naturalistic**
  *   **High cholesterol:** While the lipid levels are biologically measurable, labeling it a "disease" relies on statistical risk thresholds and guidelines that change over time, rather than immediate functional failure.

  **Genuinely Contested**
  *   **Obesity:** While there are metabolic components, the classification often relies on BMI (a statistical tool) and conflates aesthetic or social stigma with biological dysfunction, as some individuals classified as obese are metabolically healthy.
  *   **ADHD:** There are neurological differences, but the diagnosis depends heavily on behavioral checklists and whether those traits cause impairment in specific social environments (like school), which varies by culture.
  *   **Alcohol addiction:** Neuroscience shows changes in brain reward pathways, but the line between "heavy use" and "disease" often involves moral judgments about self-control and social harm.
  *   **Chronic fatigue syndrome:** The suffering and functional impairment are real, but the lack of a definitive biomarker means the diagnosis relies heavily on patient reporting and excluding other causes, leaving room for debate about its biological basis.

  **Leans Normative**
  *   **Infertility:** Biologically, the reproductive system isn't functioning typically, but it is only considered a "disease" if the individual values having children; without that desire, there is no inherent harm.
  *   **Prolonged grief disorder:** Grief is a universal human emotion, and drawing a line at a specific time period (e.g., 6 months vs. 12 months) to call it a disorder is an arbitrary cultural decision about how long suffering is "acceptable."

  **Mostly Normative**
  *   **Deafness:** While there is a physiological difference in hearing function, many in the Deaf community view this as a cultural identity rather than a medical deficit; calling it a disease assumes that hearing is objectively necessary for a good life, which is a value judgment.
