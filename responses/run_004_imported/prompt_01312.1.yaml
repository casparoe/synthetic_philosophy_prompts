      *   **Background:** Retired physicist. This means they understand probability distributions, normalization, improper priors, plane-wave states, and mathematical rigor. I don't need to explain basic probability calculus, but I should respect their intuition about physics analogies.
      *   **Interest:** Philosophy rabbit holes, specifically the Two-Envelope Paradox.
      *   **Current Understanding:** They believe the paradox arises from an improper prior (uniform over all positive reals) and that using a proper prior (e.g., exponential) dissolves the paradox and makes switching always correct.
      *   **Questions:**
          1.  Am I basically right about the improper prior being the culprit?
          2.  If I use a proper prior, does switching become *always* correct?
