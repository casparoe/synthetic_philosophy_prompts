  Could you lay out the comparison properly for me, in some depth? Specifically: what does each of them think money most fundamentally IS (ticket/counter vs. the "wheels of trade" oil metaphor, or however you'd put it), what does each think actually happens to a country's industry and prices when the money supply expands or contracts, and would they have agreed or clashed over Berkeley's pet scheme of a national bank issuing paper credit that isn't fully backed by specie -- I have a feeling Hume gets cagey about paper credit somewhere but I honestly don't remember if that's in "Of Money" itself or a different essay. And then, for the purposes of deciding who wins the argument at my dinner table: which of the two views actually holds up better against how a modern economist or central banker would describe what money is and does, and why? I don't want the sophomore-seminar answer of "Berkeley's the idealist, Hume's the empiricist," I want the actual mechanics of the disagreement.
