      *   *Galileo's Counter-argument:* Galileo would argue that the *weight of evidence* made Copernicanism physically necessary, even if absolute geometric proof (like parallax) was missing. He also argued that the Tychonic system was physically impossible (orbits of Mars/Sun intersecting solid spheres).
      *   *Verdict:* The objection is historically sound and philosophically sharp. It highlights the tension between Galileo's methodological demand (proof first) and his rhetorical practice (asserting proof existed). It's a very sophisticated point for an AP student.

