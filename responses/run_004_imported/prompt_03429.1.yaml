      *   *Claim:* Standard of proof is "necessary demonstration" vs. probability. *Verdict:* Accurate. Galileo distinguishes between *demonstrations* (proofs) and *opinions/hypotheses*. He argues that if a scientific truth is demonstrated, Scripture must be reinterpreted. If it's just a hypothesis, stick to Scripture.
      *   *Nuance:* Galileo actually believed he *had* demonstrated the motion of the earth (via tides, etc., though the tide argument was flawed). The essay says he insists on demonstration *before* reinterpretation. This is accurate to the text of the *Letter*.

  4.  **Evaluate Check #2: Fairness of the Closing Objection:**
      *   *Claim:* In 1615, there was no "necessary demonstration" of Earth's motion.
