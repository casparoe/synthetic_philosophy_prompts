answer: |-
  The short answer is **no**. Your instructor's general rule is incorrect, and the conclusion that maternal smoking is protective against infant mortality is false.

  This specific example is famous in epidemiology and causal inference. It is known as the **"Birth Weight Paradox,"** and it is widely used not to illustrate when we *should* stratify, but rather to illustrate the dangers of stratifying on the wrong variable.

  If you conclude that smoking is protective based on these data, you have fallen into a classic causal inference trap. Here is a detailed breakdown of why the rule you were given is dangerous, why the smoking example behaves the way it does, and what the actual rule for Simpson's Paradox should be.

  ### 1. The Specific Case: Why Smoking Is Not Protective

  Biologically and causally, we know from vast evidence that maternal smoking harms infant health. The reversal you see in the stratified data is a statistical artifact, not a biological reality. It arises because **birth weight is not a confounder** in this relationship; it is a **mediator** and a **collider**.

  To understand why, we need to look at the causal structure (often represented as a Directed Acyclic Graph, or DAG):

  1.  **Smoking ($X$) causes Low Birth Weight ($Z$).**
  2.  **Low Birth Weight ($Z$) causes Infant Mortality ($Y$).**
  3.  **Smoking ($X$) also causes Infant Mortality ($Y$) directly.**
  4.  **Crucially:** There are other unmeasured factors ($U$) (e.g., genetic defects, severe maternal illness) that cause **both** Low Birth Weight ($Z$) and Infant Mortality ($Y$).

  #### The Mediator Problem
  Birth weight lies on the causal pathway from smoking to mortality ($X \rightarrow Z \rightarrow Y$). If you want to know the **total effect** of smoking on mortality (which is the relevant public health question), you should *not* control for variables that are caused by the treatment. By stratifying on birth weight, you are blocking the pathway through which smoking does its harm. You are effectively asking, *"For babies who ended up with the same birth weight, does smoking matter?"* This ignores the fact that smoking *caused* many babies to have a dangerous birth weight in the first place.

  #### The Collider Bias (The Real Driver of the Reversal)
  Even if you were interested in the *direct* effect (excluding the path through birth weight), stratifying here is still dangerous because of **collider bias**.
  *   Smoking causes Low Birth Weight.
  *   Other Pathologies ($U$) cause Low Birth Weight.
  *   Other Pathologies ($U$) cause Mortality.

  In this structure, Birth Weight is a **collider** (two arrows point into it: from Smoking and from Pathologies).
  *   **In the Pooled Data:** Smoking is associated with higher mortality because it harms babies directly and by lowering birth weight.
  *   **In the Stratified Data (Low Birth Weight only):** When you restrict your analysis to low-birth-weight babies, you are conditioning on a collider. This induces a spurious negative correlation between Smoking and Other Pathologies.
      *   If a baby has low birth weight and the mother *did not* smoke, there must be a strong reason why (e.g., a severe genetic defect or illness). These babies are at very high risk of death.
      *   If a baby has low birth weight and the mother *did* smoke, the smoking might be the sole cause of the low weight. These babies might be otherwise healthy.
      *   **Result:** Within the low-birth-weight group, the smokers look healthier than the non-smokers, not because smoking is good, but because the non-smoking group is "selected" for having other severe health problems.

  This is why the stratified estimate is *more* biased than the pooled estimate in this specific case.

  ### 2. The General Rule: When to Stratify?

  Your instructor's rule ("whenever stratifying... flips the direction... defer to the subgroup") is statistically seductive but causally wrong. Simpson's Paradox is a statistical phenomenon; it tells you that the association changes, but it **does not tell you which association is the causal truth.**

  To decide whether to trust the pooled or the stratified estimate, you must know the **causal role** of the third variable ($Z$).

  | Role of Variable $Z$ | Causal Structure | Should you Stratify? | Which Estimate is True? |
  | :--- | :--- | :--- | :--- |
  | **Confounder** | $Z \rightarrow X$ and $Z \rightarrow Y$ | **Yes** | Stratified (Adjusted) |
  | **Mediator** | $X \rightarrow Z \rightarrow Y$ | **No** (for Total Effect) | Pooled (Unadjusted) |
  | **Collider** | $X \rightarrow Z \leftarrow Y$ (or $U$) | **No** | Pooled (Unadjusted) |

  *   **Case 1: Confounder (The Classic Simpson's Paradox).**
      *   *Example:* UC Berkeley Admissions (1973). Men had higher admission rates overall. But within departments, women had equal or higher rates.
      *   *Variable:* Department Choice. Women applied to harder departments.
      *   *Resolution:* Department is a confounder of the *relationship between gender and admission success* (in the context of bias). Stratification reveals the truth: no bias against women.
      *   *Rule:* Adjust for confounders.

  *   **Case 2: Mediator (The Smoking Example).**
      *   *Variable:* Birth Weight.
      *   *Resolution:* Smoking causes low birth weight. Adjusting for it hides the harm.
      *   *Rule:* Do not adjust for mediators if estimating total effect.

  *   **Case 3: Collider.**
      *   *Example:* Studying the correlation between talent and beauty among famous celebrities.
      *   *Variable:* Fame (requires Talent OR Beauty).
      *   *Resolution:* In the general population, talent and beauty are uncorrelated. Among famous people (conditioning on Fame), they appear negatively correlated (if you aren't beautiful, you must be talented to be famous).
      *   *Rule:* Never condition on colliders.

  ### 3. Why This Misconception Persists

  It is common in introductory courses to simplify Simpson's Paradox as "the subgroups tell the truth." This is often taught using the Berkeley Admissions example, where the stratified data *does* reveal the truth. However, this creates a heuristic that fails when applied to mediators or colliders.

  The lesson of the Birth Weight Paradox is specifically designed to break this heuristic. It teaches that **statistical adjustment is not a substitute for causal knowledge.** You cannot look at a table of numbers, see a reversal, and declare the stratified numbers "true." You need a causal model (like a DAG) to justify why you are adjusting for a variable.

  ### 4. Conclusion and Advice

  1.  **Do not accept the conclusion:** Maternal smoking is not protective. The stratified data in this example is biased due to collider stratification and over-adjustment for a mediator.
  2.  **Re-evaluate the Rule:** The rule "always defer to subgroup estimates in a reversal" is false. The correct rule is: "Defer to the estimate that appropriately adjusts for **confounders** while avoiding adjustment for **mediators** and **colliders**."
  3.  **Causal Diagrams:** If your course allows, try to draw the DAG for any problem involving Simpson's Paradox. If the third variable is an effect of the treatment (like birth weight is an effect of smoking), do not adjust for it.

  You are right to be skeptical. This is one of the most important "gotcha" moments in causal inference. The fact that the data reverses is a signal to think harder about the causal structure, not a signal to automatically trust the subgroups.

  **Recommended Reading:**
  If you want to read more about this specific example, look for discussions on the **"Birth Weight Paradox"** in the work of **Miguel Hernán and James Robins** (specifically their book *Causal Inference: What If*, which is free online). They use this exact example to demonstrate why conditioning on intermediates/colliders leads to bias.
