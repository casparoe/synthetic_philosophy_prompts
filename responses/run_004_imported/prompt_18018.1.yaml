prompt: |-
  So at my startup we've been building an LLM agent that negotiates purchases for users, and during testing we found its preferences over bundles aren't transitive -- it'll take A over B and B over C, but then flip and take C over A once the framing shifts a bit. Our CTO joked "someone's gonna money-pump this thing" and now I can't stop thinking about it. I read up on the classic money-pump argument for why intransitive preferences are supposed to be irrational, but then ran into a whole counter-literature saying a "sophisticated" chooser who can foresee the entire trade sequence just won't complete the loop, so the pump doesn't actually prove intransitivity is irrational. Then I saw people distinguish that from "resolute" choice (McClennen's idea, I think?) and I got kinda lost on what's actually at stake between those two, and why apparently a lot of people think sophistication doesn't really settle the debate anyway. This all seems to fall under something called "diachronic rationality" but I don't have a good handle on the terrain yet. Can you go deep on this one -- skip the 101 version, I've already got the basic pump down -- and explain what's really at stake between naive, sophisticated, and resolute responses, plus whether theres some version of the money pump that still works even against a fully foresighted, sophisticated agent?
