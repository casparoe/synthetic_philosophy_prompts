answer: |-
  First off, this is not dumb at all. In fact, your intuition is spot-on: **your friend's logic is flawed, and your discomfort is a valid warning signal.**

  You are experiencing a classic boundary issue disguised as a math problem. Here is why your friend's "utilitarian math" (Cost to You < Benefit to Them = Yes) is dangerous in the long run, and why you feel trapped.

  ### 1. The Math Ignores Cumulative Cost
  Your friend is looking at a single transaction in isolation.
  *   **One ride:** 15 minutes. No big deal.
  *   **Five rides a week:** 75 minutes. That's over an hour of your day gone.
  *   **A school year:** That is dozens of hours of your life spent being a shuttle service.

  If you add up the gas, the wear on your car, and the time, the "cost" becomes significant. But more importantly, **time is non-renewable.** Once that 15 minutes is gone, you can't get it back to study, relax, or see other friends.

  ### 2. You Are Becoming Infrastructure, Not a Friend
  When you say yes every time because "it helps them more than it costs you," you stop being a friend doing a favor and start becoming **public transportation.**

  Infrastructure is expected to run on schedule, every day, without fail. If a bus driver decides "I don't feel like driving today," the system breaks. If *you* decide "I don't feel like driving today," your friends get annoyed because they've come to rely on you as a utility, not a person.

  By removing your ability to say "no," you have accidentally trained your friends to stop planning ahead. They don't need to check the bus schedule or ask their parents because they know *you* will solve the problem.

  ### 3. The Hidden Cost: Loss of Autonomy
  This is the biggest flaw in the logic. The cost isn't just 15 minutes of driving; **the cost is the mental load of having to make the decision.**

  You wrote: *"I feel like I can never actually just decide 'not today'."*

  That feeling is the real expense. Every time you get in the car, you aren't choosing to drive; you are submitting to an obligation. That creates **resentment**. Even if you like your friends, doing something out of obligation slowly erodes the friendship. Eventually, you might snap, or you'll start dreading seeing them after school because you know they want a ride.

  ### 4. Opportunity Cost
  Your friend says you are "coming out ahead." Ahead of what?
  *   Could you use that afternoon to decompress after school?
  *   Could you work on a hobby?
  *   Could you hang out with those friends *without* being responsible for their safety and navigation?

  When you are the driver, you are working. You can't fully relax. By saying yes to them, you are saying **no to yourself.** Your friend's logic assumes your time has zero value unless it is being spent helping someone else. That is not true.

  ### How to Fix It (Without Being a Jerk)
  You don't have to stop driving entirely. You just need to regain the power of choice. Here is how to shift the dynamic:

  **1. Set a Schedule (The "Bus Driver" Approach)**
  Paradoxically, becoming *less* available makes you a better friend.
  *   *"Hey guys, I can do rides on Tuesdays and Thursdays this month, but I've got other commitments on Mondays, Wednesdays, and Fridays."*
  *   This allows you to say yes on your days without guilt, and gives you a solid, pre-approved reason to say no on the others.

  **2. The "I Have Plans" Boundary**
  You do not need to justify your plans. "I can't today, I have stuff I need to do" is a complete sentence.
  *   That "stuff" can be homework, chores, or literally just sitting on your couch playing video games. **Rest is a valid plan.**

  **3. Normalize the Bus**
  If you always save them from the bus, the bus becomes the "enemy." If you occasionally say, *"I'm heading straight home today, you guys are welcome to hop on the bus with me,"* it reminds them that the bus is a viable option.

  **4. Ask for Reciprocity**
  Friendship is a two-way street. If you are providing a valuable service (rides), what are they providing?
  *   Do they pay for gas?
  *   Do they buy you lunch sometimes?
  *   Do they help you with homework?
  *   If the exchange is purely "You drive, they sit," the imbalance will eventually make you bitter.

  ### The Verdict
  Your friend means well, but she is looking at this as a series of isolated events. You are living the **cumulative reality.**

  You are allowed to keep afternoons for yourself. You are allowed to say no even if someone else would benefit from your yes. In fact, setting this boundary will make your friendships healthier because they will be based on who you are, not what you can do for them.

  **Say no this week.** See what happens. The world won't end, your friends will figure it out, and you'll get your afternoon back.
