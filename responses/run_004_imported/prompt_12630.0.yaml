answer: |-
  This is a classic debate in economics and philosophy, and honestly, your intuition is spot on: Mia is quoting **Neoclassical Economics**, but you are describing **Behavioral Economics**.

  Mia's argument is based on a concept called **Revealed Preference Theory**. Developed by Paul Samuelson in the 1930s, it basically says: "Don't tell me what you like; show me what you buy." In standard econ models, this is useful because it assumes humans are rational agents who consistently maximize their own utility. If you choose YouTube, you must get more "utility" (satisfaction) from YouTube than from homework.

  However, Mia's argument falls apart when you apply it to internal human conflict. Here is the substantive counter-argument you can bring back to her, broken down into three specific economic/psychological concepts.

  ### 1. Time Inconsistency (Hyperbolic Discounting)
  Mia is assuming your preferences are static. She assumes "You" at 8:00 AM (planning to study) is the same agent as "You" at 8:00 PM (choosing YouTube).

  Behavioral economics shows this is false. Humans suffer from **Hyperbolic Discounting**. We value immediate rewards disproportionately higher than future rewards.
  *   **At 8:00 AM:** The reward (good college) is far away, but the cost (studying) is also far away. You rationally prefer the long-term goal.
  *   **At 8:00 PM:** The reward (dopamine from YouTube) is *immediate*, and the cost (bad grades) is *distant*.

  **The Argument:** Your actions don't prove YouTube is what you *really* want; they prove you have a **time-inconsistent preference structure**. You want to be a student who gets into a good college (Future Self), but you also want to relax right now (Present Self). Revealed preference theory cannot distinguish between a "mistake" caused by time inconsistency and a "true preference." If Mia is right, then anyone who ever eats a salad but later eats a cake "actually wanted" the cake all along, which makes the concept of dieting or self-improvement logically impossible.

  ### 2. The Principal-Agent Problem (Internal)
  In business economics, a "Principal-Agent Problem" happens when the owner (Principal) wants one thing, but the employee (Agent) wants another.

  You can model your brain the same way.
  *   **The Principal:** Your long-term planning self (wants the degree).
  *   **The Agent:** Your immediate action-taking self (wants to avoid cognitive load/stress).

  The Agent (your hand on the mouse) has more control over the immediate lever than the Principal (your brain's goals). When you scroll YouTube, it's not that the Principal changed its mind; it's that the Agent shirked its duty.

  **The Argument:** If actions were the *only* truth, there would be no such thing as **regret**. Regret is the economic signal that your *action* diverged from your *preference*. If you finish 3 hours of YouTube and feel great, Mia is right. If you finish and feel guilty/anxious, that negative utility proves the action did not align with your actual preference hierarchy. The guilt is data, just like the click.

  ### 3. Constraints on Execution vs. Preference
  Mia is conflating **Preference** with **Capability**.

  Standard econ assumes that if you prefer A over B, you can simply choose A. But willpower is a scarce resource (a concept called **Ego Depletion**). By the end of the day, your "willpower budget" might be empty.

  Choosing YouTube might not mean you prefer it *in a vacuum*; it means you preferred it **given the constraint of zero willpower**.
  *   **Scenario A:** You have high energy. You choose Homework.
  *   **Scenario B:** You are exhausted. You choose YouTube.

  Did your *desire* for college change between Scenario A and B? No. Your *constraint* changed. Mia's theory treats willpower as infinite. If you accept that self-control is a limited resource, then actions reveal your **current capacity**, not necessarily your **deep preferences**.

  ### How to Win the Debate
  Don't tell her she's "wrong." Tell her her model is **too simple for the data set.**

  Here is the script:
  > "Mia, you're using Revealed Preference theory, which works great for market transactions where people are rational and calm. But it fails with intertemporal choice (choices over time).
  >
  > If actions were the only truth, addiction wouldn't exist. A smoker who wants to quit but lights up anyway isn't revealing that they 'actually want' cancer; they are revealing a conflict between their **System 1 (impulse)** and **System 2 (planning)**.
  >
  > My YouTube habit isn't proof that I don't want college. It's proof that my **discount rate** for immediate gratification is currently higher than my willpower budget. The fact that I feel regret afterward is the economic evidence that my action didn't match my utility function. If I truly wanted YouTube more, I wouldn't be worried about my grades."

  ### The "So What?" for You
  While you can win the argument with Mia, don't let the theory become an excuse. Behavioral economics explains *why* you slip up, but it doesn't fix it.

  Since you know you have **Time Inconsistency**, you need to bind your Future Self.
  *   **Change the constraints:** Use an app blocker during homework hours. Make the "YouTube choice" harder to execute than the "Homework choice."
  *   **Lower the barrier:** Tell yourself you only have to do 5 minutes of homework. Usually, the "cost" is starting, not doing.

  Mia is right that actions are the only thing that *impact reality*, but you are right that actions don't always reveal *truth*. They often just reveal friction.
