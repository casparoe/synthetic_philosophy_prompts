      *   **Focal Points (Schelling Points):** How agents coordinate without communication.
      *   **Tacit Bargaining:** Negotiation without explicit communication.
      *   **The Stability of Deterrence:** Mutual Assured Destruction (MAD) relies on credible second-strike capability.
      *   **Human vs. Mechanical Control:** Schelling discussed the role of human judgment vs. automated systems (especially in *The Strategy of Conflict* and later works on nuclear war). He was wary of accidental war.

  3.  **Analyze the AI "Commitment Race" Problem:**
      *   **Mechanism:** AI agents pre-commit to strategies (threats/promises) to force opponents to yield.
      *   **Risk:** If everyone pre-commits aggressively, incompatibilities arise (e.g., AI A commits to "Fight if X," AI B commits to "Fight if X"). Result: Disaster (war/crash) even though both sides would prefer peace.
