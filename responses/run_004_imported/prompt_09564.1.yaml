      *   *Correction:* Greene isn't a pure utilitarian in later work; he advocates for "metamorality." I should mention that briefly to show fairness, but keep focus on the Footbridge debate.
      *   *Key Point:* The "Personal Force" vs. "Means" distinction. Greene argues Personal Force explains the variance better than Means. Kamm argues Means is the normative truth, even if Personal Force is the psychological proxy.
      *   *Final Verdict:* Greene wins the *psychological* explanation; Kamm wins the *philosophical* legitimacy. But on the specific question of "Should we trust the Footbridge intuition?", Greene has the stronger *debunking* case, while Kamm has the stronger *reconstructive* case. I will argue that Kamm ultimately holds the high ground on the *philosophical* question because Greene commits a version of the genetic fallacy, but Greene forces Kamm to refine her principles beyond simple intuition.

  8.  **Final Polish:** Check tone. Ensure it sounds like a conversation between peers. Use specific case names (Loop, Trapdoor, Lazy Susan). (Self-correction: Ensure I explicitly answer "Who wins?") -> I will argue it's a "Pyrrhic victory" for Greene and a "hollow victory" for Kamm, but ultimately Kamm's framework is more resilient to the empirical data *if* modified. Actually, better to say: Greene wins on the *origin* of the intuition, Kamm wins on the *justification* of the principle.

      *Wait, let's look closer at the Trapdoor case.* Greene says Trapdoor reduces personal force and makes it more permissible. Kamm might argue Trapdoor changes the *causal pathway* in a morally relevant way (you aren't physically manipulating the body). So Greene's "smoking gun" might not be a smoking gun for *bias*, but for a different principle (bodily integrity vs. causal involvement).
      *Okay, I'll structure the response to highlight this tension.*

      *Plan:*
      1. Intro: Set the stage (Empirical vs. Normative).
      2. Greene's Attack (The Debunking).
