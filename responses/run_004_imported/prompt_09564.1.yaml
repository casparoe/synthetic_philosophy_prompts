answer: |-
  This is one of the most fertile stalemates in contemporary moral philosophy. You've correctly identified the fault lines: Greene is playing a **genealogical debunking game** (showing the intuition arises from a process that doesn't track truth), while Kamm is playing a **normative vindication game** (showing the intuition tracks a complex principle that exists independently of the process).

  To adjudicate this on the Footbridge case specifically, we have to look at whether "Personal Force" is merely a proxy for a moral principle (Kamm's view) or a morally irrelevant trigger (Greene's view).

  Here is the breakdown of who wins what, and why the Footbridge case remains the pivot point.

  ### 1. Greene's Case: The "Off Switch" Argument
  Greene's strongest move isn't the fMRI data (which is correlational); it's the **Trapdoor variant**.
  *   **Standard Footbridge:** You push the man. (High personal force, mostly "impermissible").
  *   **Trapdoor:** You hit a switch; the man falls through a trapdoor onto the tracks. (Low personal force, significantly more "permissible").

  For Greene, this is the smoking gun. The *intention* is identical (kill one to save five). The *causal role* of the agent is identical (initiate the chain of events). The only variable changed is the tactile, up-close-and-personal nature of the harm. If the judgment shifts based on tactile proximity, Greene argues, it proves the judgment is driven by an emotional alarm system evolved for Paleolithic violence, not a rational assessment of welfare or rights.

  **Where Greene Wins:**
  Greene successfully demonstrates that the *raw intuition* is unstable. If our moral compass swings wildly based on whether we touch the victim or hit a switch that drops them, that compass is epistemically suspect. He forces the deontologist to admit that "personal force" cannot be the *ultimate* justification, because few philosophers want to defend the principle: *"It is wrong to kill, but only if you touch them."* Greene forces Kamm to refine her principle away from the physical contact itself.

  ### 2. Kamm's Case: The Genetic Fallacy and the Means Principle
  Kamm's counter is methodological. She argues Greene commits a version of the **genetic fallacy**: explaining the origin of a belief does not determine its truth value.
  *   **Analogy:** We have an evolutionary aversion to the smell of rotting meat (disgust). That doesn't mean the judgment "rotting meat is unsafe to eat" is false. The emotion is a heuristic for a real danger.
  *   **Application:** "Personal force" might be the psychological *trigger*, but it tracks a deeper normative structure: **The Doctrine of Doing and Allowing** or the **Principle of Permissible Harm**.

  Kamm argues that in Footbridge, the victim is used **as a means** to stop the trolley. In Switch, the victim is a **side effect** (the trolley is diverted; his death is foreseen but not the mechanism of stopping).
  *   **The Loop Case:** This is Kamm's fortress. A trolley is heading for five. You divert it onto a loop where a fat man stands. His bulk stops the trolley, saving the five, but killing him.
      *   **Greene:** This lacks personal force (it's a switch). Prediction: People should treat it like Switch (Permissible).
      *   **Kamm:** This treats the man as a means (his body is the brake). Prediction: People should treat it like Footbridge (Impermissible).

  **Where Kamm Wins:**
  Empirical data on the Loop case is messy, but philosophically, Kamm wins the **normative high ground**. Even if Greene proves the *intuition* is emotional, he hasn't proven the *principle* is false. Most legal systems and moral codes distinguish between *using* a person and *harming* a person. Greene assumes Utilitarianism is the "correct" baseline from which deviations are "biases." Kamm rightly points out that this begs the question. If there *is* a right not to be used as a resource, then the emotional alarm is a feature, not a bug—it's our cognitive system flagging a rights violation.

  ### 3. The Adjudication: Who Wins on Footbridge?

  If the question is **"Does Greene prove the Footbridge intuition is a bias?"**, the answer is **Yes**.
  He proves that the *intensity* and *prevalence* of the objection are heavily modulated by "personal force," which is morally superficial. The Trapdoor case shows that if you remove the tactile violence, people become more utilitarian. This suggests the "sacredness" of the person in Footbridge is partially constituted by our aversion to direct violence, not just abstract rights.

  If the question is **"Does Greene prove we ought to ignore the Footbridge intuition?"**, the answer is **No**.
  This is where Kamm holds the line. Greene's argument relies on the premise that the only valid moral currency is aggregate welfare (or that welfare is the only thing *not* subject to evolutionary bias). But Kamm's "Intricate Ethics" argues that the distinction between *means* and *side-effects* is constitutive of agency itself.
  *   In **Footbridge**, you appropriate another person's body for your ends.
  *   In **Switch**, you alter the environment (the track), and the person happens to be in the new path.

  Greene treats "Personal Force" as the explanatory variable. Kamm treats it as a **proxy** for "Direct Agency/Means." Just because the proxy is imperfect (hence the Trapdoor shift) doesn't mean the underlying principle (Don't use people as means) is invalid.

  ### The Verdict

  **Greene wins the psychology; Kamm wins the philosophy.**

  Greene has successfully shown that our *deontological intuitions* are not pure rational insights; they are contaminated by evolutionary heuristics regarding violence. We cannot trust the *gut feeling* alone.

  However, Kamm has successfully shown that Greene's debunking does not settle the *normative* question. You cannot derive an "ought" (we should push the man) from an "is" (our brains dislike pushing men). Kamm's apparatus (Triple Effect, Means Principle) provides a **reconstructive justification** for the intuition that survives Greene's attack. She can concede that "personal force" is a bias while maintaining that "using a person as a means" is a valid moral constraint that *correlates* with personal force in standard cases.

  **The Synthesis:**
  The most honest reading of the literature suggests a **reflective equilibrium** modification of Kamm.
  We should accept Greene's data: "Personal Force" is a bias. We should not forbid pushing the man *just* because it involves touching him.
  *But*, we should accept Kamm's principle: We should forbid pushing the man if it involves **using him as a means**.

  The tragedy of the debate is that Greene assumes "Means" is just a post-hoc rationalization for "Personal Force." Kamm assumes "Personal Force" is just a heuristic for "Means."
  The **Trapdoor** case is the wedge. In Trapdoor, you use the man as a means (his body stops the trolley), but without personal force.
  *   If people judge Trapdoor as **Permissible** (aligning with Greene), it suggests the "Means" principle isn't deeply held, and Greene wins the normative argument too.
  *   If people judge Trapdoor as **Impermissible** (aligning with Kamm), it proves the "Means" principle is distinct from "Force," and Kamm wins.

  Current experimental philosophy (e.g., work by Edward Royzman or Walter Sinnott-Armstrong) suggests the data is mixed on Trapdoor/Loop. This ambiguity is actually Kamm's saving grace. Because the data isn't a slam-dunk for Utilitarianism even when "force" is removed, Greene cannot claim he has *debunked* the deontological position, only destabilized its most naive intuitive support.

  **Conclusion:**
  Kamm wins the Footbridge case specifically because she offers a **principle** (Means/Side-effect) that can survive the removal of the **bias** (Personal Force). Greene shows us that our *access* to the principle is noisy, but Kamm shows that the *signal* is still there. To side with Greene is to assume that any moral principle sensitive to evolutionary emotional triggers is false—a premise that would debunk almost all moral beliefs, including the utilitarian impulse to save the greater number (which is also evolutionarily grounded in kin-selection and reciprocity).

  If you have to bet: **Kamm's framework is more robust**, because it can absorb Greene's data as "noise in the signal" without losing the signal itself. Greene's framework collapses if you admit that "using persons" might be objectively wrong regardless of how we feel about it.

  **Recommended Next Step:**
  If you want to test Kamm's resilience, look at the **"Lazy Susan"** cases (where you rotate a platform to move people around). They strip away almost all "force" and "directness," leaving pure causal structure. If intuitions still track Kamm's distinctions there, her "Intricate Ethics" survives Greene's "Dual-Process" debunking. If they don't, Greene takes the crown. The literature is still fighting over this, which tells you Kamm is still very much in the game.
