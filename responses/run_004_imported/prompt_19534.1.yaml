answer: |-
  **The Rationality of Caution: Defending Risk-Weighted Utility Against the Money Pump**

  The decision you faced last month is a classic instance of practical deliberation under uncertainty. You chose a guaranteed settlement over a gamble with higher expected value (EV). Your friend, invoking standard decision theory, labeled this irrational risk-aversion. In the orthodox framework of von Neumann-Morgenstern (vNM) and Savage, rationality is defined by Expected Utility Theory (EUT). Within EUT, risk-aversion is only permissible if it stems from the diminishing marginal utility of money (a concave utility function). Since you indicated the sums involved were not large enough to trigger diminishing marginal utility, your friend concludes you violated the norms of rational choice.

  However, as you have discovered, the philosophical landscape is more contested than your friend suggests. Lara Buchak's *Risk and Rationality* offers a robust defense of risk-aversion as a fundamental rational attitude, formalized through Risk-Weighted Expected Utility (REU) theory. REU allows an agent to weight probabilities according to their risk attitude, independent of the utility of outcomes, by rejecting the Independence Axiom. The primary charge against this view is the dynamic choice objection: that violating Independence exposes an agent to money pumps (sequential choices guaranteeing a loss) unless they adopt a "resolute" choice policy, which critics deem too costly to be rational.

  This essay argues that your decision was rational. While the dynamic choice objection highlights a genuine tension in REU, it ultimately fails to prove irrationality. The vulnerability to exploitation arises not from risk-aversion itself, but from a lack of diachronic commitment. By defending "resolute choice" not as an ad-hoc fix but as a constitutive feature of rational agency, we can see that Buchak's theory correctly identifies risk-aversion as a legitimate rational attitude, whereas the orthodox view imposes an overly narrow conception of rationality that conflates caution with error.

  To understand the stakes, we must distinguish between the two ways EUT models risk. In standard theory, if an agent prefers a sure \$50 to a 50% chance of \$100, it is assumed they value the second \$50 less than the first (diminishing marginal utility). But as you noted, this does not always fit the phenomenology of decision-making. Often, we reject gambles not because the money matters less, but because the *uncertainty* itself is burdensome. Buchak's REU theory captures this by introducing a risk function, $r(p)$, which transforms probabilities before they are multiplied by utilities. A risk-averse agent uses a convex risk function, downweighting the probability of the best outcome. This formally permits risk-aversion without distorting the utility function.

  The cost of this flexibility is the violation of the Independence Axiom. Independence roughly states that if you prefer Option A to Option B, you should still prefer A to B even if both are bundled with a common third outcome C. REU violates this because the risk function reacts to the *structure* of the gamble, not just the outcomes. Critics argue this violation is fatal because it leads to dynamic inconsistency. In a sequential choice scenario (a money pump), an REU agent might prefer A over B at time $t_1$, but once the common uncertainty is resolved or the timeline shifts at $t_2$, their preferences reverse. A cunning bookie could exploit this reversal, trading the agent back and forth until they end up with less money than they started, for no gain.

  The standard rejoinder from defenders of REU is that agents can avoid this pump by adopting a "resolute" choice policy. A "sophisticated" agent anticipates their future inconsistency and chooses differently at $t_1$ to avoid the trap. A "resolute" agent, however, makes a plan at $t_1$ and sticks to it at $t_2$, even if their local preferences have shifted. Critics, such as Johan Gustafsson and others in the EUT tradition, argue that resolute choice is irrational. They claim that at $t_2$, the agent is choosing an option they currently deem inferior. To force oneself to follow a past plan is to ignore current reasons, imposing a "cost" of self-binding that outweighs the benefit of avoiding the pump.

  This critique, however, rests on a myopic view of agency. It assumes that rationality is exclusively about maximizing utility at the specific moment of choice ($t_2$). This "time-slice" epistemology treats the agent as a series of distinct selves rather than a single entity persisting through time. If rationality is merely about satisfying current preferences, then yes, resolute choice looks like irrational stubbornness. But if rationality involves the governance of a life over time, then the capacity to form and execute plans is a virtue, not a vice.

  The money pump argument demonstrates that an agent who lacks the capacity for commitment is vulnerable. It does not demonstrate that the preferences driving the plan are irrational. Consider your legal dispute. At the moment of decision, you weighed the guaranteed settlement against the arbitration gamble. You decided the certainty was worth the cost of the potential upside. This was a global judgment about your exposure to risk. If you were later offered a chance to reverse that decision for a small fee (the start of a money pump), a "sophisticated" EUT agent would say your initial preference was wrong. A resolute REU agent says the initial preference was right, and the temptation to reverse it is a failure of will.

  The "cost" of resolute choice that critics cite is simply the cost of having integrity. To say an agent is irrational because they refuse to abandon a plan when local incentives shift is to privilege impulsivity over consistency. In the context of the money pump, the exploitation only succeeds if the agent is *unresolute*. Therefore, the vulnerability lies in the agent's lack of diachronic control, not in the risk-weighted preferences themselves. Buchak argues that rationality includes norms for managing one's future agency. If I know I am risk-averse, it is rational for me to bind myself to choices that reflect that aversion, preventing my future self from being lured into gambles that my global self rejects.

  Furthermore, the demand for Independence assumes that the only rational response to uncertainty is to maximize mathematical expectation. But human rationality is often about satisficing or securing baselines. In your contract dispute, the settlement likely provided closure and eliminated the cognitive load of arbitration. REU formalizes the intuition that the *risk* of a bad outcome in arbitration carries a negative weight that isn't captured by the dollar amount alone. To declare this irrational because it violates Independence is to prioritize formal consistency over substantive prudence.

  The definite verdict, therefore, is that risk-aversion can be genuinely rational over and above diminishing marginal utility. The dynamic choice objection fails to overturn this because it mistakes a failure of commitment for a failure of preference. The money pump exploits agents who cannot maintain a plan; it does not prove the plan itself is flawed. By adopting a resolute choice policy, an agent protects their global risk attitude from local exploitation. This policy is not a costly workaround; it is the mechanism by which temporally extended agents exercise rationality.

  Your friend's confidence was not warranted because she relied on a model of rationality that cannot accommodate the legitimate human concern with uncertainty itself. You did not make a mathematical error; you made a judgment that the security of the settlement was more valuable than the statistical advantage of arbitration. Buchak's theory provides the formal language to justify what your intuition already told you: that it is rational to care not just about what might happen, but about how much you have to risk to get it. The vulnerability to money pumps is a warning to be resolute, not a command to be risk-neutral.
