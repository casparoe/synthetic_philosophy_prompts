      *   *Check:* Did I address the "binding" aspect? Yes, in Round 3.
      *   *Check:* Is the tone sharp? Use interruptions, rhetorical questions, and specific terminology (signaling games, reinforcement learning, infinite regress).

  6.  **Final Polish:** Check the flow. Ensure the transition from "definition" to "mechanism" to "normativity" feels natural. Make sure the ending lands on the philosophical impasse (Genealogy vs. Justification).

  **(Self-Correction Note):** I need to make sure I don't let Sam win by saying "Lewis is unrealistic." Lewis isn't claiming everyone calculates infinite regress consciously; he's claiming the *structure* of the expectation must hold. Clara needs to make that distinction clear. Sam needs to counter that the *structure* itself is an artifact of the model, not reality.

  7.  **Final Review against constraints:**
