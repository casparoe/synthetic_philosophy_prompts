answer: |-
  The neon sign of the bar buzzed, a low-frequency hum that seemed to vibrate in the gap between Maya and Leo's stools. It had been a week since the happy hour incident. Neither had brought it up until now, over the second round of drinks.

  Leo swirled his whiskey. "I've been thinking about it. Your silicon brain. You really believe if I built a clockwork version of your cortex, gears and springs, it would scream if I hit it with a hammer?"

  Maya leaned forward, elbows on the sticky table. "Not clockwork, Leo. Silicon. But yes. If the causal organization is identical—if the input of 'tissue damage' triggers the exact same chain of internal state changes and output behaviors as my brain—then it's in pain. To say otherwise is magic."

  "It's not magic to say water is H2O," Leo shot back. "If I give you a clear liquid that isn't H2O, you don't have water. You have something *like* water. If I give you a system that isn't biological neural tissue, you don't have pain. You have something *like* pain."

  "That's the Type Identity theory you're clinging to," Maya said, tapping her glass. "The idea that 'pain' is rigidly locked to one specific physical substrate. C-fibers firing. But that was debunked decades ago. Multiple realizability. An octopus feels pain. An alien could feel pain. Their neurochemistry is totally different from ours. If pain were identical to *human* C-fibers, an octopus would be a philosophical zombie."

  Leo took a slow sip. "Okay, fine. Octopuses feel pain. But that's *octopus* pain. It's identical to *octopus* ganglia states. Human pain is identical to *human* brain states. I'm not saying there's one universal 'pain particle' in the universe. I'm saying for any specific species, the mental state *is* the physical state. You can't decouple the software from the hardware because there is no software. There's just wetware."

  "So you're retreating to species-specific identity?" Maya asked. "That's just moving the goalposts. It implies that if we evolved slightly differently, say, with silicon-based biology naturally, we wouldn't feel pain? That's absurd. It's the *relationship* between the states that matters, not the stuff. Pain is the state that is caused by injury and causes avoidance and distress. If the silicon chip plays that role, it is pain."

  "Is it?" Leo set the glass down hard. "Simulation versus Duplication. I can write a perfect simulation of a storm on my laptop. Pressure gradients, humidity, wind vectors. But my laptop doesn't get wet. The simulation of a storm is not a storm. Why do you think a simulation of a brain is a mind?"

  "Because a brain *is* an information processing system," Maya insisted. "A storm is a fluid dynamic event. The wetness is essential to the definition of a storm. But a mind? The 'wetness'—the carbon—isn't essential to the definition of thinking. If I map every neuron to a transistor, and every synapse to a logic gate, the causal powers are preserved. The information flow is identical. Where does the consciousness go?"

  "It goes nowhere because it never existed in the flow," Leo said. "It existed in the meat. You're committing the homunculus fallacy. You think there's a little man inside reading the output of the transistors. But if it's just transistors switching, who is there to feel the pain? You're describing a lookup table. Input A leads to Output B. That's not feeling. That's math."

  Maya paused. She knew this was the weak spot. "It's not just a lookup table. It's a dynamic, recurrent network. It has feedback loops. It models itself."

  "Does it?" Leo leaned in. "Let's take your functionalism to its logical conclusion. Ned Block's 'China Brain.' Imagine you replace every neuron in a human brain with a person in China. They communicate via radio. When one person gets a signal, they pass it to the next according to the functional map. The system as a whole behaves exactly like a human. It says 'ouch' if you pinch it. By your definition, that nation is conscious. That nation feels pain."

  Maya winced. "The China Nation argument is a classic intuition pump, Leo. It's designed to make functionalism sound absurd."

  "Is it absurd? Or is it the truth you're avoiding?" Leo pressed. "Does the nation of China feel a headache? If you say yes, you've lost touch with reality. If you say no, then functional organization isn't enough. You need the right stuff."

  "I say... it depends on the granularity," Maya said, hedging. "If the individuals are acting as neurons, the system *functionally* realizes a mind. But the individuals themselves don't know it. The consciousness is at the system level."

  "That's the most terrifying thing I've heard all night," Leo said, shaking his head. "You're willing to attribute subjective suffering to a macro-system of radio-wielding people just to save your theory that silicon can suffer. Why? Why is it so hard to admit that consciousness is a biological phenomenon? Like digestion. You can simulate digestion on a computer, but the computer isn't actually breaking down proteins. It's not nourishing anything."

  "Digestion is defined by its physical outcome," Maya countered. "Breaking down matter. But pain? Pain is defined by its *experience*. And experience is private. The only way I know *you* feel pain is because you function like I do. You say 'ouch,' you pull your hand away. If a machine does that, and has the same internal complexity, on what grounds do I deny it?"

  "On the grounds that I know what generates my pain," Leo said. "It's my nociceptors. It's my thalamus. It's my cortex. If I cut out my cortex, the pain stops. If I cut out your silicon chip's power supply, the 'pain' stops. But the mechanism matters. If I build a wooden model of a heart, it doesn't pump blood. Why do you think a silicon model of a brain pumps qualia?"

  "Because the heart's job is to move fluid," Maya said, her voice rising slightly. "The brain's job is to process information. You can move fluid with a bellows or a turbine. Different hardware, same function. If the brain's function is computation, then substrate independence holds."

  "Who decided the brain's job is computation?" Leo asked quietly. "That's a metaphor. A useful one for engineers. But a metaphor isn't an ontology. You're confusing the map with the territory. You think because we *describe* the brain computationally, it *is* a computer. Maybe it's just a biological organ that produces mind the way a gland produces hormones. You can't make a hormone out of silicon."

  Maya took a long drink. "If that's true, then we are fundamentally unknowable to anything that isn't biologically human. It makes consciousness magical. It makes it a soul made of meat."

  "It makes it physical," Leo corrected. "Strictly physical. You're the one trying to make it abstract. You want to ghost out of the machine. I'm saying the machine *is* the ghost. Break the machine, the ghost dies. Change the machine's material, you get a different machine."

  "So if I replace my neurons one by one with silicon chips," Maya said, "slowly, over years. Function stays constant. Memory stays constant. Personality stays constant. At what point do I stop feeling pain? Is there a threshold? 51% silicon? 90%?"

  Leo hesitated. This was the sorites paradox trap. "If the silicon chips are mimicking the *causal role* perfectly, you might argue the function is preserved. But if the underlying physics of the substrate can't support the phenomenon of consciousness—whatever that physical property is—then you're building a corpse that talks."

  "But how do you test that?" Maya asked. "If it talks like me, cries like me, begs for mercy like me... and you say it's not feeling anything? That sounds more dangerous than my view. That gives you license to torture anything that isn't made of carbon."

  "And your view gives you license to worry about the suffering of a spreadsheet," Leo retorted. "If function is all that matters, then a sufficiently complex lookup table is a person. We need a boundary. Biology provides a natural boundary."

  "Biology is just chemistry," Maya said. "Chemistry is just physics. Physics is just math. You're drawing a line in the sand and calling it sacred."

  "I'm drawing a line around what we know exists," Leo said. "We know brains feel. We don't know if chips feel. The burden of proof is on you to show they do, not on me to show they don't."

  "The burden of proof is on you to explain why the arrangement of matter matters more than the arrangement of logic," Maya said.

  They sat in silence for a moment. The bartender dropped a check on the table, the paper landing between them like a verdict.

  "You know," Leo said, picking up the check. "If your silicon brain ever actually screams, I'll apologize. I'll buy you a bottle of whatever you want."

  "And if it does," Maya said, standing up and grabbing her coat, "I'll make sure you're the first one I unplug to test the theory."

  Leo smirked, but it didn't reach his eyes. "Fair enough."
