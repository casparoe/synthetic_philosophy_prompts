answer: |-
  Your instinct is spot on. You have correctly identified a subtle but crucial principle in probability theory, and the frustration you felt trying to make the numbers work comes from a very common arithmetic trap, not a flaw in your intuition.

  The short answer is: **Your 50/50 split between the neighborhoods should indeed remain exactly where it was.** The information you overheard updates the *conditional* probabilities within Priya's neighborhood, but it provides no *likelihood ratio* to update the *marginal* probability of the neighborhood itself.

  Here is the breakdown of why your intuition is right, where the arithmetic likely tripped you up, and the general principle at stake.

  ### 1. The Arithmetic Solution (That You Couldn't Find)

  You mentioned you couldn't find a set of four numbers that satisfied the 2-to-1 ratio while keeping the neighborhood totals at 50/50. I suspect the trap was trying to preserve the probability of the **Noodle Shop in Priya's Neighborhood** while increasing the **Sit-Down**, which forces the total mass of Priya's Neighborhood to grow and squeezes the Friends' Neighborhood.

  To keep the neighborhood split 50/50, you must allow the probability mass to shift *internally* within Priya's neighborhood. Here is the consistent set of numbers:

  **The Prior (Flat Guess):**
  *   Priya / Sit-Down: 0.25
  *   Priya / Noodle: 0.25
  *   **Total Priya: 0.50**
  *   Friends / Sit-Down: 0.25
  *   Friends / Noodle: 0.25
  *   **Total Friends: 0.50**

  **The New Constraint:**
  Inside Priya's neighborhood, Sit-Down ($S$) is twice as likely as Noodle ($N$).
  $P(S | \text{Priya}) = 2 \times P(N | \text{Priya})$.
  Since they must sum to 100% of Priya's neighborhood:
  $P(S | \text{Priya}) = 2/3$ and $P(N | \text{Priya}) = 1/3$.

  **The Posterior (Consistent Update):**
  We keep the Total Priya probability at 0.50 (per your correct intuition).
  *   **Priya / Sit-Down:** $0.50 \times (2/3) = \mathbf{1/3 \approx 0.333}$
  *   **Priya / Noodle:** $0.50 \times (1/3) = \mathbf{1/6 \approx 0.167}$
  *   **Total Priya: 0.50** (Unchanged)

  We have no new info on the Friends' neighborhood, so we leave its internal split (1:1) and its total (0.50) alone.
  *   **Friends / Sit-Down:** $\mathbf{0.25}$
  *   **Friends / Noodle:** $\mathbf{0.25}$
  *   **Total Friends: 0.50** (Unchanged)

  **Check the Sum:** $1/3 + 1/6 + 1/4 + 1/4 = 0.5 + 0.5 = 1.0$.

  The numbers work perfectly. The "shift" you felt leaking into the neighborhood odds was likely because you subconsciously tried to keep the *Priya/Noodle* probability fixed at 0.25 while raising *Priya/Sit-Down*. If you do that, Priya's total becomes $0.25 + 0.33 = 0.58$, which forces Friends' total down to 0.42 to sum to 1. But there is no rule requiring *Priya/Noodle* to stay fixed; only the *ratio* between the restaurants is fixed.

  ### 2. The Bayesian Principle

  Why does your intuition hold up theoretically? This comes down to **Likelihoods**.

  In Bayes' Theorem, we update a hypothesis ($H$) based on evidence ($E$) using the likelihood ratio:
  $$ \frac{P(H_1 | E)}{P(H_2 | E)} = \frac{P(E | H_1)}{P(E | H_2)} \times \frac{P(H_1)}{P(H_2)} $$

  *   **Hypotheses:** $H_1$ = Party in Priya's Neighborhood, $H_2$ = Party in Friends' Neighborhood.
  *   **Evidence:** The statement "If it's her neighborhood, Sit-Down is 2x Noodle."

  Ask yourself: **Is this statement more likely to be true if the party is in Priya's neighborhood than if it is in the Friends' neighborhood?**

  The answer is **no**. This statement describes the *organizers' contingency plan*. That plan exists as a set of rules regardless of where the party ultimately lands. The organizers decided on this 2:1 ratio *before* the location was finalized (or independently of it). The probability of you overhearing this specific rule is the same whether the final destination is Priya's side of town or yours.

  Because $P(E | H_1) = P(E | H_2)$, the likelihood ratio is 1. Therefore, the posterior odds equal the prior odds. The neighborhood marginal does not move.

  ### 3. The General Lesson: Parameters vs. Outcomes

  The confusion you experienced is a classic mix-up between **evidence about parameters** and **evidence about outcomes**.

  *   **Evidence about Outcomes:** If you had overheard, "They just booked the sit-down place," that is an outcome. Since the sit-down place is more likely in Priya's neighborhood (under the new rule), hearing that they booked it *would* shift the probability toward Priya's neighborhood.
  *   **Evidence about Parameters:** You overheard a rule about the probabilities themselves ("If X, then Y is 2x Z"). This updates the conditional distribution $P(\text{Restaurant} | \text{Neighborhood})$, but it is "screened off" from the marginal distribution $P(\text{Neighborhood})$.

  **The Principle:** Information that constrains the *internal structure* of a hypothesis (the restaurant ratio within a neighborhood) does not update the *probability of the hypothesis itself* (the neighborhood choice), unless the existence of that structure is correlated with the hypothesis being true.

  ### Summary
  You didn't go wrong in your Bayesian thinking; you went wrong in your linear algebra. You likely tried to satisfy the new ratio by adding probability mass to one option without subtracting it from its sibling, which forced the "leakage" you feared.

  Trust your gut: The neighborhood odds stay 50/50. The "leakage" is an illusion caused by forgetting that probability mass is conserved *locally* (within the neighborhood) before it needs to be conserved *globally*.
