prompt: |-
  Me and another dev are merging our side projects into one startup and trying to figure out how to split decision-making power over the roadmap going forward. We each know what we'd get if we just walked away and kept building solo (not amazing, but fine), and we each also know what our "dream" outcome looks like if the other person just deferred to us on everything. His proposal is that whatever compromise we land on, each of our gains over the walkaway option should be in the same proportion as our two dream outcomes are to each other. I feel like that's not obviously the "fair" way to do it, but I can't articulate why it'd be better or worse than just, like, maximizing how good the deal is for both of us combined. Is there an actual principled way to think about this, or is it just vibes at that point?
