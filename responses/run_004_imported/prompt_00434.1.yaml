      *   *Problem 1:* Dreams are subjective and unbounded. If Dev A dreams of a billion dollars and Dev B dreams of a nice living, does Dev A deserve 100x the surplus? That seems arbitrary.
      *   *Problem 2:* It ignores *contribution to the surplus*. Just because I want more doesn't mean I deserve more of the *joint* gain.
      *   *Problem 3:* It creates perverse incentives to inflate your "dream" during negotiations.

  3.  **Evaluate the User's Intuition ("Maximize Combined Good"):**
      *   This is the *Utilitarian* approach (Maximize $Outcome_1 + Outcome_2$).
      *   *Problem:* It ignores distribution. A deal could be worth \$10M total but give \$9.9M to one person and \$0.1M to the other. If the \$0.1M is less than their walkaway, they won't agree.
      *   *Need:* A framework that balances efficiency (total pie) and equity (splitting the pie).

