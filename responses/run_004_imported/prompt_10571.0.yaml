answer: |-
  This is a fantastic question. It is rare for a hobbyist to track down the actual Scholium in the *Principia*, and your confusion is well-founded. You have spotted a rhetorical pivot in Newton's argument that is often glossed over in popular summaries.

  Your friend was partially right that Mach addressed this, but they were wrong to suggest the Globes argument is "basically the same" as the Bucket. In the philosophy of physics, the Two Globes argument is often considered the more rigorous of the two because it strips away the complications of fluid dynamics (water sloshing, friction, etc.) and isolates the concept of **inertial force**.

  Here is the step-by-step logic of the transition you found confusing, followed by how this fits into the modern debate.

  ### Part 1: Decoding Newton's Transition (Vacuum → Stars → Cord)

  Your confusion stems from this sentence: *"But now, if in that space some remote bodies were placed... we could not indeed determine from the relative translation of the globes among those bodies, whether the motion did belong to the globes or to the bodies."*

  It feels counterintuitive: *How does adding more reference points (the stars) make it harder to know what's going on?*

  To understand this, you have to distinguish between **Kinematics** (describing motion by position) and **Dynamics** (describing motion by force).

  #### Step 1: The Vacuum (The Dynamic Baseline)
  In the first half of the passage, Newton imagines the two globes alone in an immense void.
  *   **Observation:** The cord is tense.
  *   **Inference:** Tension is caused by the globes' "endeavour to recede from the axis of their motion" (what we call centrifugal force/inertia).
  *   **Conclusion:** Because there is nothing else in the universe, this tension cannot be explained by the globes moving *relative* to anything else. It must be motion relative to **Space itself**.
  *   **Result:** In the vacuum, the tension tells you everything. You know the speed of rotation and the direction (by poking the globes to see which side resists force). There is no ambiguity because there are no other objects to create an alternative perspective.

  #### Step 2: Adding the Stars (The Kinematic Ambiguity)
  Now Newton adds the fixed stars. He asks us to imagine we ignore the cord for a moment and look *only* at the positions of the globes relative to the stars.
  *   **Observation:** The globes change position relative to the stars.
  *   **The Ambiguity:** Relative motion is symmetric. If Object A rotates relative to Object B, the mathematical description is identical to Object B rotating relative to Object A.
  *   **The Problem:** If you rely *only* on the visual backdrop of the stars (kinematics), you cannot tell if the globes are spinning through stationary space, or if the globes are stationary and the entire universe of stars is whirling around them.
  *   **Why this "muddies the water":** In the vacuum, there was only one possible story: "The globes are spinning." With stars added, a naive observer might say, "Actually, the globes are still, and the stars are moving." Newton is pointing out that **relative position alone** cannot distinguish True Motion (absolute) from Apparent Motion (relative).

  #### Step 3: The Cord as Arbiter (The Dynamic Resolution)
  This is the crux of the passage. Newton reintroduces the cord to resolve the ambiguity created by the stars.
  *   **The Test:** Check the tension.
  *   **Scenario A (Newton's View):** If the globes are truly rotating, the cord is tense. If the stars are rotating around stationary globes, the cord is **slack** (because stationary globes have no centrifugal endeavor).
  *   **Scenario B (Mach's View - foreshadowing):** If the mass of the stars determines inertia, then rotating stars around stationary globes *would* create tension.
  *   **Newton's Conclusion:** Since we observe tension, we know the motion belongs to the globes, not the stars. The cord allows us to identify the "true" motion even when the visual backdrop suggests a symmetry that doesn't exist physically.

  **Summary of the Logic:**
  1.  **Vacuum:** Tension proves rotation relative to absolute space.
  2.  **Add Stars:** Visual relative motion becomes ambiguous (Who is moving relative to whom?).
  3.  **Check Cord:** Dynamics (force) breaks the symmetry. The tension proves the globes are the ones accelerating, regardless of what the stars appear to be doing.

  Newton's point is that **Space is the reference frame for dynamics, not matter.** The stars are useful for navigation, but they are not the *cause* of the inertia.

  ---

  ### Part 2: The Modern Debate (Substantivalism vs. Relationism)

  In modern philosophy of physics, the two views you mentioned are defined as:
  *   **Substantivalism (Newton):** Spacetime is a real entity that exists independently of the matter within it. It provides the "stage" against which true acceleration occurs.
  *   **Relationism (Leibniz/Mach):** Space is not a thing. It is merely a system of relations between material objects. To say an object is "rotating" is only meaningful if it is rotating *relative to other matter*.

  #### Is the Globes argument stronger than the Bucket?
  Among philosophers of physics, **yes, the Two Globes argument is generally considered stronger** than the Bucket argument for Substantivalism.

  1.  **Purity:** The Bucket involves water, which is a complex fluid. Critics can argue about viscosity, friction between water and bucket walls, or whether the water is rotating relative to the bucket or the room. The Globes argument removes the container and the fluid. It isolates the inertial force (tension) in its simplest mechanical form.
  2.  **Isolation:** The Bucket is usually on Earth, surrounded by the fixed stars. Newton has to argue away the influence of the Earth. The Globes thought experiment explicitly isolates the system in a vacuum first, forcing you to confront the source of inertia directly.

  #### The Strongest Relationist Reply (Mach's Principle)
  The most devastating reply to Newton comes from Ernst Mach (1883), and it attacks the very first step of Newton's logic: **The Empty Universe.**

  **Mach's Argument:**
  Mach argued that Newton's "Vacuum" scenario is physically impossible and conceptually incoherent.
  *   **Inertia is not intrinsic:** Mach claimed that an object's resistance to acceleration (inertia) is not an inherent property of the object or its relation to "Space." Instead, inertia is generated by the gravitational interaction of that object with **all the other mass in the universe.**
  *   **The Counter-Thought Experiment:** Mach turned Newton's scenario on its head.
      *   *Newton says:* If globes spin and stars are still → Cord is tense. If globes are still and stars spin → Cord is slack.
      *   *Mach says:* If the entire mass of the universe (the stars) rotates around the globes, it creates a gravitational field that **will** pull the globes outward. The cord **would** become tense even if the globes were "stationary" relative to absolute space, provided the rest of the universe was rotating around them.
  *   **The Implication:** You cannot distinguish the two cases. The tension in the cord is not proof of Absolute Space; it is proof of rotation **relative to the fixed stars (the bulk mass of the universe).**

  For a Relationist, the "ambiguity" Newton worried about in the second half of the passage doesn't exist. If the stars rotate around the globes, the physics *must* change (the cord tightens). Therefore, motion is always relative to matter, never to space.

  ### Part 3: The Verdict of Modern Physics

  Where does this leave us today?

  **1. General Relativity (The Middle Ground)**
  Einstein was deeply inspired by Mach and hoped General Relativity (GR) would prove Relationism. However, GR ended up being a hybrid.
  *   **Against Newton:** There is no rigid "Absolute Space." Spacetime is dynamic; it curves and bends in the presence of matter.
  *   **Against Mach:** Spacetime has properties independent of matter. For example, gravitational waves can travel through a vacuum. A universe with no matter can still have a geometry (Minkowski space).

  **2. Frame Dragging (The Lense-Thirring Effect)**
  Modern physics has actually tested a version of Mach's claim. In GR, a massive rotating body (like the Earth) "drags" spacetime around with it.
  *   If you had a gyroscope orbiting Earth, its axis would shift slightly because Earth's rotation twists the local spacetime.
  *   This supports the Machian idea that nearby mass influences local inertia.
  *   *However*, the effect is small. It suggests that while distant stars *influence* inertia, they do not *wholly determine* it in the way Mach hoped.

  ### Conclusion

  You have identified the exact pivot point where Newton distinguishes **True Motion** (dynamics/force) from **Apparent Motion** (kinematics/position).

  *   **Newton's Logic:** Adding stars creates a *visual* ambiguity (who is moving relative to whom?), but the *physical* reality (tension) resolves it. This proves Space is a real reference frame.
  *   **The Relationist Reply:** The visual ambiguity is not an illusion. If the stars rotated, the tension would appear anyway. Therefore, Space is not needed; only the relation between the globes and the stars matters.
  *   **Modern Consensus:** The Two Globes argument is the cleaner, stronger version of the Substantivalist case. However, General Relativity suggests the truth is nuanced: Space is not a rigid Newtonian container, but it is also not merely a shorthand for relations between objects. It is a dynamic field that interacts with matter, but can exist (in a sense) without it.

  If you want to pursue this further, look into the **"Hole Argument"** (Einstein) and **Hartry Field's "Science Without Numbers."** These are the modern battlegrounds where the ghost of Newton's two globes is still fighting Mach's stars.
