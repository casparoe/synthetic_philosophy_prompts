          *   *Nyaya-Vaisheshika (India):* Actually debated causation heavily, but often argued *for* it. Maybe less relevant for "beating Hume" on skepticism.
          *   *Islamic Occasionalists after Al-Ghazali:* Fakhr al-Din al-Razi.
          *   *Selection:* Focus on Nagarjuna/Buddhism as the strongest parallel for "no inherent causality."
