      *   *The "Weaker System" Fix:* Agent A uses logic $L$. Agent B uses logic $L'$. $L$ proves $L'$ is sound. But $L'$ cannot prove $L$ is sound. This leads to a sequence $L_1, L_2, L_3...$ where logical strength decreases. Eventually, the system becomes too weak to do anything useful. This is the "infinite regress" or "tiling agents" problem.

