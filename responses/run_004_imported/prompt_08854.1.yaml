  So apparently the reason a self-modifying AI can't fully trust that a succesor built on its exact same axioms will reason correctly is called the 'Löbian obstacle,' and Löb's theorem is somehow the culprit. I get the vibe of it but not the actual mechanism -- can you walk through why you can't just patch this by giving the agent a reflection principle along the lines of 'whatever my proof system proves is true,' and what specifically breaks (in terms of what Löb's theorem then forces the system to prove) if it tries that? Also, is the usual fix people mention -- having each successor run on a strictly weaker proof system than the one before it -- an actual solution, or just a polite way of admitting the problem can't fully be solved and punting it into an infinite regress of ever-weaker successors?
