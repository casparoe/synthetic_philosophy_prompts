  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *Bayesian Confirmation:* $P(H|E) > P(H)$ if $E$ confirms $H$. Using Bayes' Theorem: $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$.
      *   *The Issue:* If $E$ is already known, $P(E) = 1$. If $P(E) = 1$, then $P(E|H) = 1$ (usually). Therefore, $P(H|E) = P(H)$. No confirmation.
