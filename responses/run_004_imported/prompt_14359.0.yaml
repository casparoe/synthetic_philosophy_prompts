prompt: |-
  ok so this has been bugging me since a meeting at work last week. our team has a dataset we've literally had sitting around for like two years, and a coworker built a new causal model that happens to fit this old data really well. hes calling it strong evidence for the model, but another guy on the team who's really into bayesian stats said thats not even coherent -- if we already knew the data was true before the model existed, its probability was already 1 for us, so conditionalizing on it again can't change anything, meaning technically it can't confirm the new model at all. this turned into a whole argument and i went down a rabbit hole reading about something called the "problem of old evidence" (i guess it goes back to a guy named glymour, and the classic case is Mercury's perihelion being used as confirmation of general relativity even though the data was decades old by then). i saw some mention of proposed fixes involving "counterfactual" probabilities and something about not being logically omniscient, but honestly lost the thread. i still dont know who was right in that meeting. can you write me an essay that actually lays out why old evidence is supposed to be such a problem for bayesian confirmation theory, walks through the strongest responses to it, and then actually commits to an answer instead of hedging -- can old evidence ever really confirm a hypothesis on a bayesian picture, or is this a permanent crack in the framework?
