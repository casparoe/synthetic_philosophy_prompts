      *   *Solution 1: Counterfactual/Historical Reconstruction.* What if we *didn't* know $E$? Assign a prior $P(E) < 1$ based on a state of ignorance before $E$ was discovered.
          *   *Pros:* Captures the intuition.
          *   *Cons:* Highly subjective. Which historical moment? What counts as "ignorance"?
      *   *Solution 2: Logical Omniscience Relaxation.* The agent knows $E$ is true, but doesn't know that $H$ *entails* $E$. Learning the *connection* ($H \rightarrow E$) is the update, not learning $E$.
