answer: |-
  **SCENE START**

  **HIRSCH:** Let's look at the table. The mereological universalist says, "There exists an object composed of this table and that distant electron." The nihilist says, "No, there exists no such object; only simples exist." I claim this dispute is merely verbal. Both speakers are asserting truths relative to their own linguistic frameworks. The universalist uses a quantifier ranging over fusions; the nihilist uses one ranging only over simples. Once we translate the nihilist's "There are no tables" into "There are no *fundamental* tables, only simples arranged tablewise," both assertions are true. There is no substantive remainder.

  **SIDER:** You're confusing truth with meaning. I grant that we can construct a translation manual where the nihilist's sentences map to true propositions in the universalist's language. But translation preserves truth conditions, not meaning. The question isn't whether they can *make* sense in their own idiolects, but whether their quantifiers latch onto the structure of reality. One of them is failing to describe the world as it is. The universalist is saying there is a *thing* there. The nihilist is saying there isn't. They can't both be right about the world.

  **HIRSCH:** But what is the "world" you are appealing to, independent of the language used to describe it? If I can predict every observation the universalist predicts, and every observation the nihilist predicts, using my translation manual, what work is left for your "structure of reality" to do? You're positing a metaphysical ghost. If the nihilist says "There are no tables" and means "No simples arranged tablewise exist fundamentally," and the universalist says "There are tables" and means "Simples arranged tablewise exist," they agree on the arrangement of simples. The disagreement is purely about whether to apply the label "object" to that arrangement.

  **SIDER:** They do not agree on the arrangement of simples if they disagree on the logic governing "existence." You're assuming the nihilist's quantifier is just a restricted version of the universalist's. I argue the universalist's quantifier is *incorrect*. It fails to carve at the joints. Reality has a logical structure, and the quantifier in "Ontologese"—the language that mirrors this structure—is restricted. It doesn't range over gerrymandered fusions of tables and electrons. When the universalist says "There exists," they are using a logical constant that does not match the fundamental logical constant of the world.

  **HIRSCH:** "Carving at the joints." This is the heart of our disagreement. You treat "joint-carving" as a substantive metaphysical fact, but it strikes me as a metaphor in search of a referent. If I ask you what makes the nihilist's quantifier more "natural" than the universalist's, you can't point to a property. You can't measure it. You're essentially asserting that your preferred vocabulary is "Objective" with a capital O. This leads to the trivialization worry: if we accept your realism, couldn't *any* dispute be framed as structural? If I say "Slavery is wrong" and you say "Slavery is right," could you claim your moral quantifier carves better?

  **SIDER:** No, because I distinguish between conceptual disputes and ontological ones. The moral case involves normative concepts, which are not part of the fundamental logical structure of the world in the same way quantifiers are. Quantifiers are the scaffolding of thought itself. My claim isn't that I have a magic detector for "Ontologese." It's that we need the notion of joint-carving to make sense of explanation. Science explains the complex in terms of the simple. If *any* quantifier meaning were equally good, there would be no distinction between fundamental and derivative facts. Physics would be just one vocabulary among many, not the description of the bedrock.

  **HIRSCH:** But that's exactly what I'm saying! Physics describes the bedrock *simples*. Both the nihilist and the universalist agree on the physics. The universalist just adds a logical rule saying "any collection of simples counts as an object." That's a linguistic convention, not a physical discovery. By insisting there's a "further fact" about whether that convention is *true*, you're turning logic into metaphysics. And here is my worry about your view: "Joint-carving" looks like an unearned primitive. You stop the regress of "why is this meaning better?" by saying "It just is." That's dogmatism.

  **SIDER:** It is primitive, I admit. But not unearned. It is indispensable. Consider identity. If we say identity is just a linguistic convention, we lose the ability to say what makes a theory *about* the same object over time. Similarly, if quantification is variant, we lose the ability to say what makes a theory *about* existence. We infer joint-carving via inference to the best explanation, just as we infer electrons. We don't see electrons; we posit them because they explain the tracks in the cloud chamber. We posit a privileged quantifier because it explains why some generalizations are lawlike and others are accidental.

  **HIRSCH:** But electrons interact with detectors. Your "privileged quantifier" interacts with nothing. It's a wheel that turns without gearing into the machine. If the nihilist and universalist walk through the room, they trip over the same chairs. They avoid the same walls. Their "existential" commitments have zero cash value in terms of expectation. If two theories are empirically equivalent and logically inter-translatable, positing a "more real" quantifier is idolatry of vocabulary. You're worshipping the word "exists" as if it were a thing itself.

  **SIDER:** It's not about empirical interaction; it's about expressive power. The joint-carving quantifier allows us to state the fundamental laws of nature without clutter. If I have to add ceteris paribus clauses to every law to exclude "table-electron fusions," my theory is less simple. The joint-carving quantifier is the one that allows for the most concise statement of the fundamental laws. That's not idolatry; it's theoretical virtue. The universalist's quantifier forces us to treat accidental fusions as ontologically on par with atoms. That bloats the ideology of our best theory.

  **HIRSCH:** "Bloats the ideology." But that's a pragmatic virtue, not a truth virtue. You're conflating "easier to talk about" with "more real." I can accept that the nihilist's language is more *useful* for physics without accepting that the universalist is *false*. This brings me back to the trivialization objection against *my* view, which I know you're waiting for. You think if I say this dispute is verbal, I must say *all* disputes are verbal. But I don't. Disputes about whether the cat is on the mat are not verbal, because we can point to the cat. Disputes about quantum spin are not verbal, because they affect prediction. Mereology is verbal because it affects neither pointing nor prediction.

  **SIDER:** I accept that distinction, but I deny it applies here. The dispute isn't about whether we can point to the cat; it's about what "there is" means in the sentence "There is a cat." If you make existence verbal, you make truth verbal. If the universalist says "There is a fusion" and you say "That's true in your language but not mine," you are denying the principle of bivalence for ontological claims. You're saying reality doesn't determine the truth of existence claims. That undermines the very idea of ontology. We aren't just cataloging vocabulary; we are trying to write the Book of the World.

  **HIRSCH:** And I'm saying the Book of the World is written in many languages, none of which is "The Language." You worry that without a privileged quantifier, reality is indeterminate. I say reality is determinate, but *existence* is a linguistic tool we use to navigate it. When you insist on Ontologese, you aren't finding a deeper reality; you're just enforcing a linguistic discipline. You want to say the universalist is making a *mistake*. I say they are just speaking a different dialect. Why is your dialect the one that gets to define "mistake"?

  **SIDER:** Because my dialect is the one that connects to the causal structure of explanation. If you ask, "Why did the window break?" I say, "Because the ball hit it." I do not say, "Because the ball-window fusion interacted with the wall." The second explanation is true in your universalist language, but it's bad explanation. It fails to track the causal joints. The quantifier that aligns with causal explanation is the joint-carving one. It's not that I get to define "mistake"; it's that the structure of explanation defines it for us. If your language makes good explanation impossible, your language is failing to map the world.

  **HIRSCH:** But the universalist *can* explain it! They just say, "The relevant part of the fusion interacted..." They can recover all the explanatory power by adding predicates. You're arguing that their language is less *efficient*, not that it's *false*. You keep sliding from "less useful" to "ontologically false." If I can say everything you can say, just with more words, in what sense have I lost contact with reality? I haven't lost contact; I've just chosen a less streamlined map. But a clunky map still represents the territory.

  **SIDER:** A map that draws roads where there are none isn't just clunky; it's misleading. If your ontology commits you to the existence of "table-electron fusions," you are committed to there being *something* there that has causal powers, even if derivative. But there isn't *something* there. There are just the simples. By positing the fusion, you are positing an entity that does no causal work over and above the simples. That is ontological inflation. It's not just a map error; it's a claim about the furniture of the universe. And the universe doesn't have that furniture.

  **HIRSCH:** "The universe doesn't have that furniture." That's the assertion I'm challenging! How do you check the inventory of the universe except by using language? You say "There are no fusions." I ask, "In which language?" You say, "In Ontologese." I ask, "Why is that the real language?" You say, "Because it matches the structure." I ask, "How do you see the structure?" You say, "By using the language." It's circular. You're using your preferred vocabulary to validate your preferred vocabulary. My view breaks the circle by saying: stop looking for the One True Inventory. Look at the work the words do.

  **SIDER:** It's not circular; it's reflective equilibrium. We adjust our logic and our metaphysics to maximize explanatory power and coherence. The reason Ontologese isn't just "English with a halo" is that it's constrained by the success of our best scientific theories. Science implicitly treats certain quantifiers as privileged. When a physicist says "There are electrons," they don't mean "There are electron-fusions." They mean the fundamental particles. Metaontology should make explicit what successful practice implies. You want to separate metaphysics from practice; I want metaphysics to codify practice.

  **HIRSCH:** And I want metaphysics to dissolve the pseudo-problems that practice creates. Scientists don't care if a table-electron fusion exists; they care about the electrons. By turning "Do fusions exist?" into a deep mystery, you create work for metaphysicians that doesn't need doing. My view is therapeutic. It allows the scientist to get back to work and the nihilist and universalist to shake hands, acknowledging they agree on the simples and only differ on the grammar. Your view keeps them fighting over a ghost.

  **SIDER:** And my view keeps them honest. If they shake hands, they pretend there's no disagreement about the nature of existence. But there is. The universalist thinks reality is permissive; the nihilist thinks it is restrictive. That is a substantive disagreement about modality and structure. If we dissolve it, we lose the ability to critique bad ontology. We need the notion of "getting it wrong" to make progress. If everything is just a dialect, then no ontology is better than any other, and metaphysics becomes anthropology. I refuse to give up on the idea that we can get the world right.

  **HIRSCH:** And I refuse to give up on the idea that we can understand each other without positing magical structures. But I see we won't agree. You see a mountain we must climb to find the Truth; I see a valley we can fill in to find peace.

  **SIDER:** Then let us agree on this: the climb is necessary, even if the peak is hard to see. Without it, we are just shouting into the void.

  **SCENE END**
