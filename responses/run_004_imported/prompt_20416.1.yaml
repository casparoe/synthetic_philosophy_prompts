      *   **Causation:** What we call "cause and effect" is just the "Custom of God" (*adat Allah*). God creates the fire, then God creates the burning in the cotton. They are contiguous in time, but not causally linked by nature.
      *   **Motivation:** Theological. To preserve God's absolute omnipotence and the possibility of miracles (breaking the habit). If nature has necessary laws, God is bound by them.
