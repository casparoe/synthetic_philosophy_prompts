      *   *Status:* They are not knowledge claims in the traditional justified-true-belief sense. They are certainties manifested in *action*.
      *   *Grounding:* Anchored in "forms of life" (shared human practices, biological needs, social interactions).
      *   *Function:* They stop the regress of doubt. To doubt them is to step outside the language game.

  3.  **Map to LLMs:**
