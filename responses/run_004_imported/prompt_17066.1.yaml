      *   **Implication 2: The "Form of Life" Problem:**
          *   Human hinges rest on shared biology/culture (e.g., pain, object permanence).
          *   LLMs rest on "data life" or "objective functions."
          *   *Critique:* Without a form of life, can there be a hinge? Wittgenstein says meaning is use within a form of life.
          *   *Verdict:* It undermines the analogy *ontologically* but preserves it *functionally*. The LLM simulates a form of life (the human one found in training data). Its hinges are *borrowed* hinges.
      *   **Implication 3: Rational Persuasion vs. Structural Reconfiguration:**
          *   You can't argue someone out of a hinge; you have to change their world/practice.
