      *   *Resistance:* Prompt engineering (in-context learning) fails to change them because they are baked into the weights/structure, not the context window.
      *   *Key Difference:* LLMs don't *act* in the world; they generate text. They don't have a biological/social "form of life."

  4.  **Drafting - Section by Section:**

