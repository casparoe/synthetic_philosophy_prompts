  8.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the prompt.
      *   *Metaphysical Hurdle:* The substrate issue. Soul atoms vs. simulation.
      *   *The Lucretian Gap:* The discontinuity of sensation.
