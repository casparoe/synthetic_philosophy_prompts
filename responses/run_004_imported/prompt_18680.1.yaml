      *Key Text:* Lucretius 3.847-869. "Even if time were to gather our matter after death and put it in the order it now holds... even then, that life would be nothing to us."
      *Application:* This is the smoking gun. Even *perfect* atomic reassembly is not survival. A simulation is even less so.

      *Wait, one nuance:* Epicurus believes in *prolepsis* and the reliability of sensation. If the emulation *senses* it is Epicurus, is that true? No, because sensation reports on the *current* state of the atoms. The current state is "New Atoms." The memory is "Old Data." The sensation of identity is a false inference if it claims continuity.

      *Final Plan:*
