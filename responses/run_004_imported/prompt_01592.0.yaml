answer: |-
  This is a superb connection to draw. The LessWrong practice of "tabooing" a word is, in essence, a methodological enforcement of Russell's insight: that surface grammar often misleads us about logical form, and that dissolving a term into its functional role often resolves apparent paradoxes. When you taboo "the present King of France," you are forced to cash out the claim in terms of existence, uniqueness, and predication, which is precisely Russell's quantificational analysis.

  However, as you noted, Donnellan's 1966 intervention is the moment the tidy logical picture confronts the messy reality of human communication. The tension between Russell's semantic precision and Donnellan's pragmatic observation is one of the central dramas in 20th-century philosophy of language.

  Here is an analysis of the Russell-Donnellan-Kripke triangle, evaluating whether Donnellan's distinction breaks Russellian semantics or merely supplements it with pragmatics.

  ### 1. Russell's Quantificational Account: The "Attributive" Baseline

  To see where Donnellan strikes, we must be precise about what Russell is doing. In *On Denoting*, Russell argues that definite descriptions ("the F") are not referring expressions (like names or demonstratives) but **quantificational phrases**.

  For Russell, "The present King of France is bald" is not of the form $B(k)$, where $k$ denotes an object. It is of the form:
  $$ \exists x (Kx \land \forall y (Ky \rightarrow y=x) \land Bx) $$
  *(There is an x such that x is King of France, for all y if y is King of France then y is x, and x is bald.)*

  **The Motivations:**
  1.  **Law of Excluded Middle:** The sentence is simply false, not meaningless or truth-valueless.
  2.  **No Meinongian Commitment:** We don't need to posit a "subsistent" non-existent King to serve as the subject of the predicate.
  3.  **Scope Interactions:** This analysis elegantly handles negation and modality. "The King of France is not bald" is ambiguous. It can mean $\neg \exists x (Kx \dots \land Bx)$ (True, because there is no King) or $\exists x (Kx \dots \land \neg Bx)$ (False, because there is no King). Russell explains this ambiguity via scope; a referring theory struggles to explain how a non-existent subject can sustain a true negative predication.

  In Russell's framework, the description is an **incomplete symbol**. It has no meaning in isolation. Crucially, this aligns with what Donnellan will later call the **attributive use**: the speaker is saying something about *whoever or whatever* fits the description. If nothing fits, the statement fails.

  ### 2. Donnellan's Challenge: The Referential Use

  Donnellan grants that Russell's analysis works perfectly for the *attributive* use. His claim is that there is a second, distinct use of definite descriptions: the **referential use**.

  **The Martini Case:**
  At a party, you see a man holding a martini glass and ask, "Who is the man drinking a martini?" In fact, the glass contains water.
  *   **Russellian Prediction:** Since no one is drinking a martini, the description fails to denote. Any statement made using it (e.g., "The man drinking a martini is a philosopher") is false.
  *   **Donnellan's Intuition:** You successfully referred to that specific man. If he *is* a philosopher, your statement was true, despite the descriptive error. The description was merely a tool to secure reference, not a condition for the truth of the proposition.

  **The Murderer Case:**
  At Smith's murder trial, Jones is in the dock. You say, "The murderer of Smith is insane," pointing at Jones. Later, it turns out Smith died of a heart attack (no murderer) or that Brown did it (Jones is innocent).
  *   **Attributive:** You spoke falsely (or said nothing true) because the unique satisfier of "murderer of Smith" does not exist or is not Jones.
  *   **Referential:** You spoke about Jones. If Jones is insane, you spoke truly, regardless of who actually killed Smith.

  **The Threat to Russell:**
  Donnellan argues this isn't just a quirk of psychology; it affects **truth conditions**. If the truth of the utterance depends on the properties of the *intended referent* (Jones) rather than the *satisfier of the description* (the actual murderer), then the semantic content of the sentence cannot be purely Russellian. It suggests that "the F" can function semantically as a rigid designator (like a name) in certain contexts.

  ### 3. Kripke's Rejoinder: Semantics vs. Pragmatics

  In "Speaker's Reference and Semantic Reference" (1977), Kripke defends Russell by arguing that Donnellan has conflated **semantics** (the conventional meaning of words) with **pragmatics** (how speakers use words to convey information).

  **The Distinction:**
  *   **Semantic Reference:** What the expression denotes according to the conventions of the language (e.g., "the murderer" denotes the unique person who murdered).
  *   **Speaker's Reference:** What the speaker intends to talk about on a particular occasion (e.g., Jones).

  **Kripke's Argument:**
  Kripke argues that we can explain Donnellan's cases entirely through Gricean pragmatics without altering Russellian semantics.
  1.  **Semantic Content:** The sentence "The murderer is insane" semantically expresses the Russellian proposition: *The unique murderer of Smith is insane.* If there is no unique murderer, the proposition is false.
  2.  **Speaker's Meaning:** The speaker, believing Jones is the murderer, uses the description to invite the audience to identify Jones. The audience recognizes this intention.
  3.  **Error Tolerance:** Just as I can refer to a woman as "his wife" even if they aren't legally married (provided the context makes my intent clear), I can refer to Jones as "the murderer" even if the description is false.

  **The "Smith's Wife" Analogy:**
  Kripke asks us to consider a case where someone refers to a woman as "Smith's wife," but they are not married. We intuitively understand who is being talked about. But no one argues that the word "wife" *semantically* means "woman associated with." It means "female spouse," and the speaker is using it loosely. Kripke claims definite descriptions are the same: the semantic meaning is always quantificational (Russellian), but speakers often use them loosely to refer.

  ### 4. Evaluation: Is Donnellan a Genuine Semantic Counterexample?

  The orthodox consensus in formal semantics sides with Kripke: Donnellan identified a real pragmatic phenomenon, but not a semantic one. However, the debate is not entirely dead. Here is the breakdown of why Russell (via Kripke) generally wins on semantic grounds, and where Donnellan still lingers.

  #### A. The Argument from Compositionality and Scope
  The strongest argument for Russell is how descriptions interact with logical operators.
  *   **Modality:** Consider "The President might have been a Democrat."
      *   **Russellian (Scope):**
          1.  *De Dicto (Narrow Scope):* It might have been that (the unique President was a Democrat). True (someone else could have won).
          2.  *De Re (Wide Scope):* The actual President (Obama/Trump/Biden) has the property that he might have been a Democrat.
      *   **Referential:** If "The President" functions as a name (referential), it should always take wide scope. But natural language allows the narrow scope reading.
  *   **Negation:** "The King of France is not bald."
      *   If descriptions were referential, this would presuppose a King exists and deny baldness of him (Strawson's view).
      *   But we can clearly say, "The King of France is not bald, because there is no King of France." This requires the description to take narrow scope under negation, which fits Russell's quantificational model, not a referential one.

  If Donnellan were right that descriptions *can* be semantically referential, we would expect them to lose their quantificational flexibility in referential contexts. They do not. They continue to interact with scope operators as quantifiers even when used to pick out a specific individual.

  #### B. Negative Existentials
  Russell's theory shines brightest here. "The present King of France does not exist."
  *   **Referential Theory:** How can you refer to something to say it doesn't exist? If you succeed in referring, it must exist (or be a Meinongian object).
  *   **Russell:** This is simply $\neg \exists x (Kx \dots)$. It denies the existence clause of the quantificational analysis.
  *   **Donnellan's Problem:** If I say "The man drinking a martini does not exist" (pointing at a water drinker), a referential theory struggles. Am I saying *that man* doesn't exist? No. Am I saying no one fits the description? Yes. This pushes us back toward the attributive/Russellian reading for existence claims, suggesting the "referential" power is limited to predication, not ontology.

  #### C. The "Semantic Intuition" Counter-Attack
  Some philosophers (like Stephen Neale or later contextualists) argue Kripke's defense is too quick. They argue that if speaker's reference is *systematic* and *conventionalized* (which it seems to be with descriptions), the line between semantics and pragmatics blurs.
  *   **Recanati's View:** Perhaps the semantic content of a description is *underdetermined* and gets "saturated" by context. In referential cases, the context saturates the description into an individual concept.
  *   **However:** This creates a more complex semantic machinery than Russell's. Russell + Kripke offers a simpler ontology: Semantics is rigid (Russell), Pragmatics is flexible (Donnellan). Occam's Razor favors keeping semantics simple unless forced otherwise. Since scope phenomena force descriptions to behave like quantifiers anyway, positing a dual semantic nature (sometimes quantifier, sometimes name) is theoretically costly.

  ### 5. Synthesis: Where Russell Remains Distinctively Powerful

  To answer your specific question: **Donnellan's cases are best understood as pragmatic phenomena that leave Russell's underlying semantics untouched.**

  However, acknowledging this does not diminish Donnellan's contribution. He showed that **logical form is not the only engine of communication.** Russell's theory explains truth conditions; Donnellan's distinction explains successful information transfer.

  Russell's analysis remains distinctively powerful in three specific domains where referential theories falter:

  1.  **Scope Ambiguities:** As mentioned, descriptions interact with modals, negation, and attitude verbs ("John believes the F is G") in ways that only quantifiers do. A purely referential theory cannot explain why "The F might not have been F" is contingent, while "The F might not have been G" behaves differently. Russell's scope distinction maps perfectly onto the *de re/de dicto* distinction.
  2.  **Empty Terms:** Russell handles "The F does not exist" without paradox. Referential theories (including naive versions of Donnellan's view) struggle to explain how we talk about non-existents without committing to their subsistence.
  3.  **Identity Statements:** "The morning star is the evening star."
      *   **Frege/Russell:** This is informative because the *senses* (descriptions) differ, even if the referent is the same.
      *   **Referential:** If both are just referring to Venus, the statement should be trivial (Venus = Venus).
      *   Russell's quantificational analysis allows us to treat identity statements involving descriptions as complex claims about uniqueness and co-satisfaction, preserving their cognitive significance.

  ### Conclusion: The LessWrong Parallel

  Returning to your opening insight: **Tabooing is the enforcement of the Attributive reading.**

  When LessWrongers say "taboo the word," they are asking you to strip away the *Speaker's Reference* (the cached habits, the connotations, the specific examples you have in mind) and reveal the *Semantic Reference* (the actual definition and logical structure).

  Donnellan showed that in ordinary conversation, we rarely speak in "tabooed" sentences. We rely on shared context, pointing, and loose descriptions to get things done. We speak referentially. But when we need to resolve a dispute about *truth*—specifically when the description fails, or the existence is contested, or the modality is complex—we must revert to the Russellian/Attributive standard.

  Kripke's rescue of Russell is essentially the claim that **logic governs truth, while pragmatics governs utility.** Donnellan showed that we can communicate truths using logically false sentences (via pragmatics). Russell (defended by Kripke) maintains that the *sentence itself* remains false, and that preserving this distinction is necessary to keep our logic from collapsing into a psychology of speaker intention.

  So, while Donnellan unsettled the tidiness of the Russellian picture, he did not overturn the foundation. He merely showed that the house of language has a front porch (pragmatics/referential) that looks different from the foundation (semantics/attributive). Russell's theory remains the best blueprint for the foundation, which is why it survives as the orthodoxy in formal semantics, even as Donnellan's insights dominate psycholinguistics and conversational analysis.
