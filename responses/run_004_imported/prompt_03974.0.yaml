          2.  *Counterfactuals need structure:* You can't just say "if not A, then not B." You need to know *how* you are removing A. (The "backtracking" problem).
          3.  *Interventionism fixes this:* It specifies *how* the antecedent is made false (by an exogenous intervention).
      *   *Verdict:* An interventionist would say Hume's definition is "broken" because it lacks the concept of *manipulation* or *invariance*. It confuses correlation with causation.

