      *   *Do they collapse?* For Hume, yes, because he denies access to any "secret power" or metaphysical glue. All we *have* is the regularity. The counterfactual is just a way of expressing the strength of the habitual expectation generated by the regularity. He isn't analyzing the *truth conditions* of the counterfactual (like Lewis later would); he's reporting the *feeling* of inference.
      *   *Verdict:* It is a gap from a modern logical perspective, but for Hume, it's a rhetorical equivalence based on skepticism. He's saying, "Since we can't see the 'power,' all we mean by cause is the regularity + the mental habit."

  3.  **Trace the Lineage to Lewis (Question 2):**
