answer: |-
  This is a remarkably precise articulation of a problem that sits at the very heart of democratic theory. You have correctly identified that the disagreement in your group is not merely about water policy, but about the constitutive rules of democracy itself. In the literature, this is known as **the Boundary Problem** (or sometimes the *Problem of Constituting the Demos*).

  Robert Dahl, one of the twentieth century's preeminent democratic theorists, famously noted that while we spend immense energy debating how a democracy should decide *once the people are defined*, we spend almost no time justifying *who constitutes "the people"* in the first place. Your upstream/downstream dispute is a textbook instance of this.

  Here is my view on how to approach the boundary, the status of advisory consultation, and the strongest objection to that approach.

  ### The View: A Principle of Significant Subjection

  To navigate between the Scylla of arbitrary jurisdictional lines (Member 1's view) and the Charybdis of infinite enfranchisement (the radical interpretation of Member 2's view), I propose a modification of the **All-Subjected Principle**.

  There are two competing principles in the literature:
  1.  **The All-Affected Principle (AAP):** Everyone affected by a decision should have a say.
  2.  **The All-Subjected Principle (ASP):** Everyone subject to the coercive authority of a decision should have a say.

  Member 1 relies on a jurisdictional version of the ASP (you are subject to the county board because you live in the county). Member 2 relies on the AAP (you are affected by the water flow). The AAP is morally intuitive but practically unbounded (as your group noted, everything ripples). The ASP is bounded but often morally arbitrary (why does a county line matter more than a watershed?).

  **My proposal:** We should adopt a **Principle of Significant Subjection**.

  A stakeholder is anyone whose range of viable options is *structurally constrained* by the decision, not merely those whose welfare is impacted. There is a distinction between being *harmed* by a decision and being *governed* by it.
  *   If the dam raises the price of electricity downstream, that is a market effect (affected).
  *   If the dam legally or physically alters the flow regime such that downstream users lose a pre-existing entitlement or biological necessity (salmon/irrigation) required to sustain their current way of life, they are being *subjected* to a new rule of scarcity imposed by the upstream authority.

  In your hydrological terms, the upstream county is attempting to alter the *boundary conditions* of the downstream system. When a decision changes the fundamental constraints within which another group must operate, that group moves from "interested party" to "constituent."

  **On the "Fig Leaf" of Consultation:**
  Advisory consultation resolves nothing regarding *legitimacy* if there is no mechanism for the advice to alter the outcome. Legitimacy in this context requires **reciprocity**. If the upstream county can impose costs on the downstream counties that they do not bear themselves, the decision procedure lacks reciprocity. An environmental review that is "purely advisory" is merely a procedural ritual unless the decision-maker bears a burden of proof to demonstrate why they are *overriding* the downstream objections. Without a veto, a weighted vote, or a binding arbitration mechanism, the consultation is indeed a fig leaf. It treats the downstream impact as an *externality* to be managed, rather than a *claim* to be honored.

  ### The Strongest Objection: The Indeterminacy and Holdout Problem

  The strongest objection to my view (and to the All-Affected Principle generally) is not that it is too morally demanding, but that it is **conceptually indeterminate** and leads to **decisional paralysis**.

  This objection, championed by theorists like Frederick Whelan, argues that you cannot use the *consequences* of a decision to determine *who gets to make the decision*, because you cannot know the consequences until the decision is made (or at least modeled, and models differ).
  *   **Indeterminacy:** How do you measure "significant subjection"? Is it a 5% reduction in flow? 10%? Does it matter if it kills the salmon but spares the irrigation? Who decides the threshold? If the downstream counties get to define the threshold of their own inclusion, they can simply claim any impact is "significant" to gain a veto.
  *   **The Holdout Problem:** If downstream stakeholders are enfranchised, they effectively gain a veto over upstream infrastructure. This creates a perverse incentive. Downstream actors can block upstream improvements unless they are paid off, even if the upstream project is net-positive for the region. This leads to a tragedy of the commons where no infrastructure is ever built because the "boundary" of stakeholders expands until consensus is impossible.

  In short, the objection is: **Democracy requires a pre-existing unit to function.** You must draw a line *before* you can weigh impacts. If you try to draw the line *based* on impacts, you enter an infinite regress. Therefore, we must stick to fixed jurisdictional boundaries (Member 1's view) not because they are morally perfect, but because they are the only way to ensure a decision can actually be reached.

  ### Synthesis and Literature Pointers

  The tension, then, is between **Legitimacy** (which demands inclusion of the subjected) and **Agency** (which demands a bounded group capable of acting).

  In your specific case, the state water resources agency (your former employer) likely represents the missing tier. The philosophical solution to the Boundary Problem in environmental contexts is often **multi-level governance**. The decision cannot legitimately rest with the county (too small) nor a global referendum (too large). It belongs to a jurisdiction that matches the *scope of the consequence*. Since the consequence is the watershed, the legitimate decision-making body is a watershed authority.

  By keeping the vote at the county level, the state is forcing a local body to solve a regional problem. This is a category error in political design.

  **For your reading:**
  If you wish to bring this to your group, these are the key touchstones:

  1.  **Robert Dahl, *Democracy and Its Critics* (1989):** Specifically the chapter on the "Boundary Problem." Dahl admits there is no clean democratic solution to defining the demos.
  2.  **Frederick Whelan, "Democratic Theory and the Boundary Problem" (1983):** The classic defense of the view that boundaries must be fixed prior to democratic decision-making (supporting Member 1).
  3.  **Robert Goodin, "Enfranchising All Affected Interests" (2007):** A robust defense of the All-Affected Principle (supporting Member 2).
  4.  **Nancy Fraser, "Abnormal Justice" (2008):** She discusses "misframing," where political boundaries are drawn in ways that exclude those who are actually subject to the power being exercised. This fits your downstream counties perfectly.
  5.  **Specific to Water:** Look for literature on **"Hydro-hegemony"** (Zeitoun & Warner). It applies these political philosophy concepts specifically to transboundary water disputes, analyzing how power asymmetries allow upstream actors to impose their will despite downstream needs.

  ### Conclusion

  Your intuition is correct: the advisory review is insufficient because it acknowledges the *fact* of the impact without acknowledging the *right* of the impacted. However, simply giving downstream voters a ballot in the upstream county creates the Indeterminacy/Holdout problem.

  The defensible middle path is not necessarily expanding the *electorate* of the county, but recognizing that the *jurisdiction* for this specific decision is mismatched. The decision lacks legitimacy not because the voters are wrong, but because the **unit of decision** (the county) is smaller than the **unit of consequence** (the watershed). In political philosophy terms, the *demos* is misspecified. The remedy is not necessarily to let downstreamers vote in upstream elections, but to elevate the decision to a body where both are represented proportionally to their stake.

  Until that structural change occurs, the downstream counties are right: they are being subjected to a rule they had no hand in writing. That is the definition of political domination, regardless of how thorough the environmental review may be.
