answer: |-
  **New York City, 1928. A private dining room at the Algonquin. Cigar smoke hangs low over the table. John Dewey and Walter Lippmann sit opposite one another, plates half-cleared, coffee cups steaming.**

  **Lippmann:** You're asking for a miracle, John. I'll say it plainly. In *The Public and Its Problems*, you write as though the average factory worker in Cleveland can somehow grasp the intricacies of tariff policy or the balance of payments in Europe. You call it the "omnicompetent citizen." I call it a phantom. The world has outgrown the scale of the town meeting. The environment is now invisible. We are dealing with forces we cannot see, touched only through reports that are already distorted.

  **Dewey:** You mistake my argument, Walter. I am not arguing that every man must be an expert in economics. I am arguing that the *public* is not a fixed entity, but something that must be discovered. A public exists when people realize they are bound together by the indirect consequences of their transactions. The problem isn't that the citizen is too stupid to govern; it's that the public is currently eclipsed. It's lost.

  **Lippmann:** Lost? Or simply bystanders? That is my point in *The Phantom Public*. The voter is not a participant in the act of governing. He is a spectator. He arrives late, leaves early, and sees only what the spotlight shows him. And the spotlight is held by the press, which feeds people stereotypes because the human mind cannot handle the raw complexity of reality. We live in a pseudo-environment. If you base democracy on the assumption that the voter can pierce that veil, you are building a house on sand. You set democracy up to fail by giving it a standard it cannot meet.

  **Dewey:** But lowering the standard is surrender! If you tell the public, "You cannot understand this, so you must defer to the insiders," you sever the connection between knowledge and action. You create a caste system of experts and ignorant masses. My concern is not the voter's IQ; it is the state of our communication. If the consequences of industrial action are hidden, how can a public form to regulate them? The remedy isn't to abandon the ideal of self-government; it is to improve the methods of inquiry. We need social science that actually reaches the people, not just the bureaus.

  **Lippmann:** Inquiry takes time we do not have. The machinery of modern life moves too fast. When a crisis hits, we cannot wait for a community to deliberate its way to the truth. We need administration. We need men who know the facts to manage the machinery. The public's role should be modest: merely to align the administrators with the general drift of public interest, and then step aside. To ask for more is to invite demagoguery, because the demagogue is the only one who promises to make the complex simple.

  **Dewey:** And who aligns the administrators, Walter? If the public is merely a bystander that intervenes only when the machine breaks, then the experts determine the ends *and* the means. That is not democracy; that is technocratic trusteeship. You say the public cannot judge the means. Agreed. But the public *must* judge the ends. What are we producing? For whom? At what cost? Those are moral questions, not technical ones. If you remove the public from that inquiry, you remove the ethical core of associated living.

  **Lippmann:** Ethics without power is sentimentality. I want democracy to survive. That is why I am being harsh. If we insist that the common man must be a polymath to cast a vote, we will eventually invite a tyrant who says, "I will spare you that burden." I am trying to save democracy from its own mythology. I am saying: acknowledge the limits of human attention. Acknowledge that most public affairs are irrelevant to most private lives. Let the insiders manage the complexity, and hold them accountable only for the gross outcomes.

  **Dewey:** But the "gross outcomes" are the result of the complex processes! You cannot separate them. If the public does not understand the process, it cannot recognize the outcome until it is too late. You speak of the "pseudo-environment" as a permanent condition. I see it as a challenge. The Great Society has arrived, but it has not become a Great Community. The tools of communication—the press, the schools, the arts—are currently tools of isolation. They transmit data, not meaning. My faith is not in the "wisdom of the masses" as they currently exist. My faith is in the possibility of freeing inquiry. If we can socialize knowledge, if we can make the consequences of our actions visible again, the public will find itself.

  **Lippmann:** *If.* That is a heavy hinge to hang a political system upon. You are betting on a transformation of human nature and social structure that may never come. I am dealing with the men as they are, in the world as it is. They are tired. They are busy. They want to live their private lives. They do not want to be perpetual inquirers.

  **Dewey:** And they shouldn't have to be perpetual inquirers in isolation! That is my point. Inquiry must be socialized. It must be woven into the fabric of association. Democracy is not just a mechanism of voting; it is a mode of life. If we accept your division—insiders and outsiders—we accept that the majority of men are unfit for freedom. I cannot accept that. Not because I think they are wise now, but because they can only *become* wise through the exercise of freedom.

  **Lippmann:** *(Leaning back, tapping his cigarette ash)* You make it a moral imperative. I make it an epistemic problem. We are talking past one another, John. You see a public waiting to be awakened. I see a crowd of strangers who cannot possibly know each other's interests well enough to act as one.

  **Dewey:** Then perhaps the work is harder than we thought. But if we stop trying to awaken them, we admit that the Great Society is a failure. I am not willing to sign that verdict.

  **Lippmann:** Nor am I. But I fear your remedy requires a miracle, and mine requires a surrender.

  **Dewey:** *(Picking up his coffee cup)* Then we shall have to live in the tension between them.

  **Lippmann:** *(Raising his glass slightly)* To the tension, then. God help the republic.
