      *   **The Hard Truth:** State clearly that concave utility *cannot* solve this. It's a mathematical impossibility within EUT.
      *   **The Proof:** Walk through the algebra (simplified) to show the contradiction. This appeals to the engineer's mindset.
      *   **The Core Violation:** Explain the Independence Axiom. Explain the "Common Consequence."
      *   **Implications for the Tool:**
