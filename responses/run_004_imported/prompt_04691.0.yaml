      *   **Preferential Gaps vs. Indifference:** Crucial distinction. Indifference means $A \sim B$. A gap means $\neg(A \succ B) \land \neg(B \succ A) \land \neg(A \sim B)$. The agent simply lacks a comparison.
      *   **Money Pump Argument:** If preferences are incomplete (gaps), an agent can be led through a cycle of trades (A to B, B to C, C to A) where it pays a small cost each time, ending up back at A but poorer. This usually assumes the agent chooses based on local preferences without looking ahead.
      *   **Resolute Choice/Dynamic Consistency:** To avoid pumps, agents need to choose *policies* or *plans* rather than just local actions. They must reject a trade if it leads to a dominated outcome relative to a feasible alternative plan.
      *   **The "Smuggling Completeness" Worry:** If the agent always picks the undominated plan, does it effectively behave *exactly* like an expected utility maximizer with complete preferences? If so, haven't we just recreated the shutdown problem (since EU maximizers usually resist shutdown)?

  3.  **Step-by-Step Walkthrough Plan:**
