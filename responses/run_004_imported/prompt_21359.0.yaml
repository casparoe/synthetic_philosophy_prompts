answer: |-
  Here is the argument you're looking for. It moves beyond the standard "Newton was pious" biography and treats his theology as the metaphysical engine of his physics.

  ***

  ### The Throne in the Void: Why Newton's Heresy Built Absolute Space

  The standard historiography treats Newton's anti-Trinitarianism as a private quirk that sat uncomfortably alongside his public science. The argument I'm making is the inverse: Newton's specific brand of biblical monotheism (often labeled Arian or Socinian) is the **load-bearing wall** of his doctrine of Absolute Space and Time.

  If Newton had been an orthodox Trinitarian, he almost certainly would have been a Leibnizian relationist. The metaphysics of the *Principia* requires a God who is *Pantokrator* (All-Ruler) rather than *Logos* (Divine Reason), and that distinction demands a void to rule over.

  #### 1. Dominion vs. Essence: The Theological Core
  Orthodox Trinitarianism in the 17th century (Cambridge Platonists, etc.) tended to emphasize God's *essence* and internal relations. God is a community of persons; creation flows through the *Logos* as a rational, organic unfolding. This view leans toward a universe where space is merely the order of co-existing things (Leibniz), because the divine reason is immanent in the relations between substances.

  Newton rejected this. In his private manuscripts (like *De Gravitatione* and the *Two Corruptions* notes), he argues that the Father alone is the supreme God. The Son is a vice-regent. This isn't just Christology; it's political theology. For Newton, God's primary attribute is not abstract necessity or ontological unity, but **Dominion**. As he famously writes in the *General Scholium*:

  > *"The word God usually signifies Lord... And from his true dominion it follows that the true God is a living, intelligent, and powerful Being."*

  Newton's God is a King, not a Geometer. A Geometer designs a system of relations (Leibniz); a King exerts will over subjects. For a King to be truly sovereign, His authority cannot be mediated through secondary causes or pre-established harmonies. It must be immediate.

  #### 2. Absolute Space as the Medium of Sovereignty
  This is where the physics locks into the heresy. If God is a remote First Cause (the Deist watchmaker), relational space suffices. But if God is an active *Pantokrator* who sustains the universe by His continuous will, He must be present to every particle, directly and without intermediary.

  Newton defines space not as a substance, but as an **"emanent effect"** of God's existence. In *De Gravitatione*, he argues that because God exists necessarily, He must exist everywhere. This "everywhere" is not metaphorical; it is the literal extension of His presence.

  *   **The Heretical Necessity:** An orthodox Trinitarian can afford mediation. The Son/Logos can be the bridge between the Father and Creation. This allows for a relational universe where God acts through the rational structure of monads.
  *   **Newton's Necessity:** Newton's unitarian God has no internal mediator. To act on matter, God requires a medium that is co-extensive with His will. Absolute Space *is* that medium. It is the "sensorium" not because God has physical eyes, but because it is the arena where His perception and His will are identical with His presence.

  Without Absolute Space, God is distant from parts of creation (if space is just relations between bodies). With Absolute Space, God is intimately present to the vacuum itself. The void is not empty; it is full of God's sovereign presence. This validates the "action at a distance" that bothered his contemporaries: gravity works because God's will binds the cosmos directly through the medium of Absolute Space.

  #### 3. The Leibniz-Clarke Foil
  The Leibniz-Clarke correspondence (1715–1716) is the public battleground for this private metaphysics. Leibniz attacks Newton's God as incompetent, claiming that Absolute Space makes God a poor watchmaker who needs to rewind the universe (miracles).

  Leibniz argues from the **Principle of Sufficient Reason**: If space is absolute, God has no reason to place the universe *here* rather than *there*. Therefore, absolute space is irrational.

  Clarke (channeling Newton) retorts with the **Principle of Will**: God placed it *here* because He willed it.

  *   **Leibniz (Orthodox-leaning):** God acts according to Wisdom/Reason. The universe is a rational web of relations. Space is phenomenal.
  *   **Newton/Clarke (Volutarist/Arian):** God acts according to Will/Dominion. The universe is a Kingdom. Space is real because the King's authority is real.

  Leibniz correctly identifies that Newton's space makes God's will arbitrary, but he misses the point: for Newton, **arbitrariness is the price of sovereignty.** A King is not bound by the "sufficient reason" of his subjects. By positing Absolute Space, Newton secures a metaphysical zone where God's Will operates free of the constraints of material relations. If space were merely relational, God would be bound to the logic of the created order. Absolute Space ensures God stands *over* the order, not just *in* it.

  #### 4. The Counterfactual: Why an Orthodox Newton Fails
  Could an orthodox Trinitarian Newton have written the *Principia*? Unlikely, at least not with the same metaphysical foundations.

  1.  **Mediation:** An orthodox Newton would likely view the *Logos* as the structural rationality of the cosmos. This leads to Leibniz's Pre-established Harmony, where God sets the clock and lets it run via internal rational principles. Newton's rejection of vortices and his insistence on active divine intervention (to correct orbital instability) requires a God who intervenes *directly*, not through the Son's rational structure.
  2.  **Immanence vs. Transcendence:** Trinitarianism allows for a more immanent God (Spirit proceeding through creation). Newton's Arianism creates a sharp hierarchy: One God, One Lord, One Creation. To bridge that gap without collapsing into pantheism (which Newton hated), you need a distinct, absolute container (Space) that belongs to God but isn't Creation.
  3.  **The Sensorium:** When Newton calls space the "sensorium of God" in the *Opticks*, orthodox critics screamed blasphemy (making God corporeal). But for Newton, it was the only way to explain how a unitary, non-composite God perceives distinct, composite things without intermediaries. An orthodox theologian could say "God knows all things in Himself." Newton's volutarist God knows things because He is present to them in Absolute Space.

  ### Conclusion
  Newton's Absolute Space is not a scientific postulate that he tried to baptize with religion. It is a **theological requirement** for his specific heresy.

  He needed a universe where God is not just the architect, but the Monarch. A Monarch cannot rule a kingdom that is defined solely by the relationships between its citizens (Leibniz); He must rule the very ground they stand on. By making Space absolute, immutable, and infinite, Newton built a cathedral of metaphysics where the *Pantokrator* could sit on His throne, directly sustaining every atom by the sheer force of His Will.

  Take away the Arian obsession with Dominion, and Absolute Space collapses into Relation. Newton's physics is the mechanics of God's Kingdom, and you cannot have that Kingdom without the Void to hold it.
