answer: |-
  This is a fantastic debate to be having. You have correctly identified the metaphysical soft underbelly of the "complexity-theoretic rescue" of computationalism. Your friend is channeling a very popular contemporary view (championed by Scott Aaronson, David Chalmers, and others), which attempts to use **computational complexity** to plug the hole Putnam blew in functionalism.

  The argument goes: *Sure, a rock maps to a mind, but the mapping is exponentially complex. A real implementation requires a mapping that is polynomial-time (efficient).*

  Your intuition—that this just relocates the arbitrariness rather than solving it—is philosophically robust. Here is the strongest possible case for your side, structured to dismantle the complexity rescue by showing that **complexity is description-relative, not intrinsic.**

  ### 1. The "Privileged Basis" Problem
  The core of your argument is that "computational cost" is not an intrinsic property of the physical system; it is a property of the *description* of the system.

  To measure the complexity of the mapping from the waterfall to WordStar, you must first encode the state of the waterfall into bits. Aaronson implicitly assumes there is a "standard" or "natural" way to do this (e.g., positions and momenta of molecules). But physics does not hand us a privileged basis.
  *   **The Counter:** I can define a coordinate system for the waterfall where the variable $W_1$ is defined as "the state of the waterfall if it implements WordStar character 1." In this basis, the mapping function is the identity function. It is $O(1)$ complexity. Trivial.
  *   **The Retort:** Your friend will say, "That's cheating. You can't define your physical variables in terms of the computation you're trying to find."
  *   **The Kill:** Why not? What physical law forbids that basis? If functionalism is true, the mind is substrate-independent. But if the *measurement of complexity* depends on choosing a "natural" physical basis, then computationalism is **substrate-dependent**. You are secretly smuggling in a preference for specific physical kinds (atoms, fields) under the guise of "complexity." You haven't saved functionalism; you've just turned it into a specific theory about *atomic* arrangements, which begs the question of why those arrangements are special in the first place.

  ### 2. Kolmogorov Complexity is Relative to the Universal Turing Machine
  The mathematical formalism for "simplicity" is usually Kolmogorov complexity (the length of the shortest program that produces a description). A key theorem in algorithmic information theory is that Kolmogorov complexity is **invariant only up to an additive constant**.
  *   This means the complexity of a string depends on which Universal Turing Machine (UTM) you use to measure it.
  *   In the physical world, the "UTM" is the set of fundamental variables and laws you choose to describe the physics.
  *   If I choose a UTM that has the "Waterfall-to-WordStar" mapping hard-coded into its instruction set, the complexity of that mapping drops to near zero.
  *   **The Implication:** To say the mapping is "objectively complex," you must assume a "natural" UTM for the universe. But asserting a natural UTM is a metaphysical claim, not a mathematical one. It amounts to saying, "The universe prefers *this* vocabulary." That is precisely the kind of intrinsic intentionality Searle says physics lacks. You haven't removed the observer; you've just hidden the observer's choice of vocabulary inside the definition of the UTM.

  ### 3. The Decoder Regress (The Homunculus Problem)
  Aaronson's argument relies on the idea that the mapping function must be "easy to compute." But **who is computing it?**
  *   **Option A: The Observer.** If the mapping is only "simple" relative to an external observer decoding the rock, then the computation is not intrinsic to the rock. It exists only in the relation between the rock and the observer. This concedes Searle's point: syntax is observer-relative.
  *   **Option B: The System Itself.** If the rock must "compute" the mapping internally to count as an implementation, you are requiring the rock to contain a decoder. But now you have to explain how *that* decoder is implemented in the rock. Putnam's argument applies recursively. You can map the rock's decoder-states to a *different* program gerrymanderedly. You haven't stopped the regress; you've just added a layer.
  *   **The Implication:** Complexity theory treats the mapping function as a free-floating mathematical object. But implementation is a physical relation. If the physical system doesn't *causally* execute the mapping (which a rock doesn't), the complexity of the mapping is irrelevant. If it *does* causally execute the mapping, it's no longer a rock, it's a computer. The complexity metric doesn't distinguish the two; the causal structure does, and Putnam already argued causal structure can be gerrymandered.

  ### 4. Input/Output Boundaries are Arbitrary
  Computation requires inputs and outputs. A closed physical system (like a rock or a waterfall) does not have labeled I/O ports.
  *   To apply complexity theory, you must first individuate which physical degrees of freedom count as "input" and which count as "output."
  *   Putnam's argument shows that you can select disjointed spatiotemporal regions of the rock to serve as "bits."
  *   The complexity rescue says, "Okay, but the selection process must be simple."
  *   **The Problem:** "Simple selection" is again relative to a grid. If I overlay a grid on the rock that aligns perfectly with the disjunctive states needed for WordStar, the selection rule is simple *relative to that grid*.
  *   Why is *my* grid arbitrary and the physicist's grid natural? Because the physicist's grid aligns with *causal laws*. But if you appeal to causal laws to define the grid, you are no longer relying on computational complexity to save functionalism; you are relying on **causal realism**. You have abandoned pure computationalism and admitted that physics is more than just abstract structure—it requires specific causal powers that abstract computations lack.

  ### 5. The "God's Eye" View Fallacy
  Ultimately, the complexity argument assumes a "God's Eye" view of the physical system. It assumes there is a fact of the matter about the "true complexity" of the waterfall independent of any description.
  *   But in modern physics, especially quantum mechanics, the state of a system is often defined relative to a basis or an observer.
  *   If you claim the waterfall *objectively* has high complexity relative to WordStar, you are claiming that the universe contains a preferred description language.
  *   This violates the spirit of functionalism. Functionalism was supposed to be liberal: *any* system with the right structure counts. The complexity rescue makes it elitist: *only* systems that look simple to *us* (using *our* physics) count.
  *   This turns computationalism into a anthropocentric claim: "A system implements a mind if it looks like a mind to a human physicist using standard coordinates." That is not a solution to the mind-body problem; it is a retreat to instrumentalism.

  ### Summary of the Case
  Your friend wants to use complexity theory as an objective filter to筛 out the gerrymandered mappings. Your counter-argument is that **the filter itself requires a gerrymandered setup.**

  1.  **Complexity is language-relative:** You cannot measure complexity without choosing a vocabulary (basis).
  2.  **Choosing a vocabulary is the exact problem:** Putnam showed we can choose a vocabulary to make *any* mapping trivial.
  3.  **Restricting the vocabulary begs the question:** Saying "you must use *natural* physical variables" admits that physical nature matters more than functional structure, undermining substrate independence.
  4.  **Observer-Relativity remains:** If the "simplicity" is judged by an external decoder, the computation is in the decoder, not the rock.

  **The Knockout Punch:**
  Tell your friend this: *"Scott Aaronson's argument works only if we assume the universe comes with a pre-installed 'compression algorithm' that defines what counts as a simple physical state. But physics doesn't come with that algorithm. We bring it. If we bring it, then computation is in the eye of the beholder. If computation is in the eye of the beholder, then Searle wins: syntax is not intrinsic to physics. Complexity theory doesn't save computationalism; it just mathematizes the observer's perspective."*

  You aren't saying complexity is irrelevant; you're saying it's not **ontologically fundamental**. It can't do the metaphysical heavy lifting your friend wants it to do.
