  *(Self-Correction Note)*: Wait, I should check if Aaronson specifically addresses the basis problem. He usually appeals to "natural" physical variables. The counter-argument is that "natural" is exactly what's in dispute. Functionalism wants to define mind *without* presupposing a specific physical ontology, but the complexity rescue *requires* presupposing a specific physical ontology to measure complexity against. That's the tension. I will emphasize this.

