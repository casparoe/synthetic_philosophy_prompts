answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two graduate students, ELENA and MARCUS, are surrounded by scattered papers covered in preference profiles and utility functions.*

  **Elena:** Look, I'm not saying Score Voting is bad. I'm saying your claim that it "solves" Arrow's Impossibility Theorem is category error. It's like saying you solved the problem of squaring the circle by switching to a square piece of paper.

  **Marcus:** That's unfair. Arrow's Theorem is a logical proof with specific premises. Premise one: the input is an ordinal ranking. Score Voting uses cardinal utility. If the input doesn't match the premise, the conclusion doesn't bind. It's not a dodge; it's math.

  **Elena:** It's mathematically true, sure. But socially vacuous. Arrow's framework exists because we accept that interpersonal comparison of utility is impossible. We can't know if my "5" is the same happiness as your "5." By switching to Score Voting, you aren't escaping the impossibility; you're just assuming away the hardest axiom. You're smuggling in interpersonal comparability.

  **Marcus:** I'm not assuming perfect comparability. I'm assuming *enough* comparability to make aggregation better than ranking. In an ordinal system, I can tell you I prefer A over B. I can't tell you *how much*. If I hate B but mildly like A, and you love both, ordinal voting treats our preferences as equal weight. Score Voting lets me express intensity. That's additional information. Arrow doesn't forbid using more information; he just proved you can't aggregate *only* rankings without running into a dictator or violating IIA.

  **Elena:** Okay, let's talk about IIA. Independence of Irrelevant Alternatives. In Arrow's sense, if society prefers A over B, introducing C shouldn't flip that to B over A. Score Voting passes IIA *if* voters are honest. The score for A and B doesn't change just because C enters. But voters aren't honest. They're strategic.

  **Marcus:** Strategic voting is a separate issue. That's Gibbard-Satterthwaite.

  **Elena:** Is it? Because your friend's argument—and yours, seemingly—is that Score Voting escapes Arrow. But if strategic incentives force voters to normalize their ballots—maxing the favorite, zeroing the least favorite—the cardinal information collapses. If I bullet vote, my ballot is functionally identical to an Approval ballot, which is functionally identical to an ordinal ranking of "Approved" vs "Not Approved." Once you collapse back to ordinal data, you're back in Arrow-land. And Approval Voting *fails* IIA.

  **Marcus:** That's the "min-max" strategy argument. It assumes a specific game-theoretic equilibrium that doesn't always hold. In large elections with uncertainty about who is viable, the optimal strategy isn't always bullet voting. It's often thresholding. I might give my second choice a 4 out of 5 because they have a chance of beating my least favorite. That preserves cardinal information.

  **Elena:** But that depends on polling. It depends on external information. Arrow's Unrestricted Domain axiom says the system must work for *any* profile of preferences, regardless of external context. If your system only works when voters have specific beliefs about viability, you've violated Unrestricted Domain. You've restricted the domain to "strategically sophisticated voters with good polling data."

  **Marcus:** Every system has domain restrictions in practice. Plurality fails miserably if you have more than two viable candidates. Score Voting is robust across a wider domain of strategic behavior than Plurality or IRV. But let's go back to the core: Utility. You say interpersonal comparison is impossible. I say it's impossible to be *perfect*, but we do it constantly. If I say I'm in "pain," and you say you're in "pain," we can aggregate that to allocate healthcare resources. Why is voting different? If we accept that utility is a real, measurable psychological state, Arrow's theorem is irrelevant because it's built on behaviorism—only choices matter, not feelings.

  **Elena:** Because in economics and social choice, "utility" is defined by revealed preference. It's ordinal by definition. If you claim cardinal utility, you need a common unit. A "util." Without a common unit, a sum of utilities is meaningless. If Alice scores Candidate A a 10 and Bob scores Candidate A a 1, does Alice get 10x the voting power? If you normalize, you lose intensity. If you don't normalize, you violate "One Person, One Vote."

  **Marcus:** You normalize by the scale, not the intensity. The scale is 0 to 5. Alice uses the scale. Bob uses the scale. Yes, Alice might be more expressive. But over a large population, that noise averages out. The signal—the intensity of preference—remains. And even if it's imperfect, it's *more* signal than ordinal ranking. Arrow proves you can't have a perfect ordinal system. He doesn't prove you can't have an *imperfect* cardinal system that yields better outcomes.

  **Elena:** I agree it might yield better Utilitarian outcomes. I'm a Utilitarian at heart. But don't call it an escape from Arrow. Call it a rejection of Arrow's premises. Arrow says: "If you want to aggregate rankings without comparing utilities, you will fail." You're saying: "I will compare utilities." That's not escaping the theorem; that's stepping outside its universe.

  **Marcus:** Semantics?

  **Elena:** No. It's about the impossibility of the *mechanism*. If you rely on cardinal utility, you introduce a new vulnerability. Who defines the scale? If I know the system sums scores, I have an incentive to exaggerate. If everyone exaggerates, we're back to Approval Voting. And Approval Voting, as I said, fails IIA.

  **Marcus:** Let's look at that failure. Approval fails IIA because if C enters, I might approve A and C, whereas before I only approved A. But that's because C is a "lesser evil." That's not a bug; that's the system working! IIA is actually a terrible axiom for cardinal systems. Why should the relative social ranking of A and B be independent of C if C changes the *risk* profile? If C is a clone of A, Arrow says it shouldn't matter. But in Score Voting, if C splits the vote... wait, no, Score doesn't have vote splitting.

  **Elena:** It has strategy splitting. If C enters, and C is similar to A, I might lower A's score to ensure B doesn't win, or raise C to test viability. The *scores* change based on the set of candidates. Therefore, the social ordering changes based on an irrelevant alternative.

  **Marcus:** Only if I act strategically. If I vote honestly, C's presence doesn't change my score for A.

  **Elena:** But we just established honest voting isn't a dominant strategy. Gibbard-Satterthwaite says *no* system is strategy-proof. So we must assume rational actors. Rational actors in Score Voting will exaggerate. Exaggerated Score Voting is Approval Voting. Approval Voting is subject to Arrow-like impossibilities regarding IIA. So, the "escape" is transient. It only exists in the utopia of honest voting.

  **Marcus:** That's too cynical. In a Bayesian Nash equilibrium with uncertainty, voters don't fully exaggerate. They vote honestly with some probability. There's a whole literature on this—Myerson, Weber. The probability of being pivotal is low, so the cost of voting honestly (expressing true utility) is low compared to the risk of misjudging the frontrunners. Score Voting retains cardinal information in equilibrium, unlike Plurality which forces insincere ranking in equilibrium.

  **Elena:** Retains *some*. But not enough to claim immunity. Here's the real issue: Arrow's Theorem is a warning about the coherence of collective rationality. It says you can't map individual preferences to a social preference that satisfies basic fairness conditions. Score Voting sidesteps this by maximizing *summed utility* rather than satisfying *preference consistency*. You're trading coherence for welfare.

  **Marcus:** Exactly! And that's a good trade. Arrow assumes the goal is a consistent social ordering. I assume the goal is maximizing well-being. If Score Voting picks the candidate with the highest total utility, even if the social ordering violates IIA, did we fail? Or did we succeed at the actual goal?

  **Elena:** You succeeded at Utilitarianism, not Social Choice. Social Choice is about legitimacy and procedure. If I can manipulate the outcome by changing the scale of my scores, or by introducing a clone candidate to shift your strategic thresholds, the system isn't stable. Arrow's conditions are proxies for stability and fairness. Violating IIA means the winner can change based on candidates who have no chance of winning. That opens the door to manipulation by elites who control the ballot access.

  **Marcus:** But less so than Plurality. In Plurality, a spoiler *wins* or *loses* the election. In Score, a spoiler just shifts the scores slightly. The magnitude of the IIA violation is smaller.

  **Elena:** Magnitude doesn't save you from the theorem. But fine. Let's grant that Score Voting is "better" practically. My point remains: You haven't escaped Arrow. You've just changed the definition of the input to something that requires a philosophical assumption—interpersonal utility comparison—that Arrow explicitly excluded because it's unverifiable. You haven't solved the impossibility; you've assumed it away.

  **Marcus:** I'd say I've dissolved it. Arrow's Theorem is a boundary marker. It says, "Here be dragons if you stick to rankings." I'm saying, "We don't have to stick to rankings." We have brains. We feel intensity. We can communicate that. If the theorem says "You can't do X," and I do Y, I haven't broken the theorem, but I haven't been stopped by it either.

  **Elena:** But Y requires a magic wand. You need a common utility meter. Until you have that, Score Voting is just Ranking Voting with extra steps and a false sense of precision. When the pressure is on, voters will simplify. They will rank. And when they rank, the dragons come back.

  **Marcus:** Maybe. But until they do, we get better representation of minority intensities. If 51% mildly hate Candidate A, and 49% love Candidate A, ordinal voting lets the 51% tyrannize the 49%. Score Voting lets the 49% outbid the 51% if their utility is high enough. That's not a bug. That's the only way to avoid the tyranny of the majority. Arrow protects the consistency of the majority's will. Score protects the aggregate welfare.

  **Elena:** And who decides what "welfare" is? You're putting a lot of faith in the voter's ability to quantify their soul on a 0-to-5 scale.

  **Marcus:** I'm putting faith in the fact that 3 is better than 2. You're putting faith in the fact that A is better than B, but refusing to admit that the gap between A and B matters.

  **Elena:** *Sips coffee.* The gap matters. But aggregating gaps across people is the hard part. Arrow proved that without a dictator, you can't do it consistently with rankings. You're claiming you can do it with gaps. I'm claiming that when the stakes are high, the gaps turn back into rankings, and Arrow wins in the end.

  **Marcus:** *Smiles.* Then I guess we'll have to run the election and see. If the voters bullet vote, you win the argument. If they use the scale, I win.

  **Elena:** And if they use the scale inconsistently, we both lose, and the social choice theorists keep publishing papers.

  **Marcus:** Deal.

  **Elena:** But I'm still writing a footnote in my thesis that Score Voting isn't an Arrow escape.

  **Marcus:** As long as I can write a footnote that Arrow's Theorem assumes behaviorism is the only valid epistemology.

  **Elena:** Fair enough.
