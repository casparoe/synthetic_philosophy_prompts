answer: |-
  The fog lay thick in the valley of the Vistula, a white woolen blanket that muffled the breath of forty thousand men. Major Elias Thorne stood in the forward trench, the damp earth seeping through the knees of his trousers. He held his pocket watch in a gloved hand, the gold casing cold against his palm.

  The armistice expired at 0600 hours.

  Thorne had not slept. None of them had. The silence of the no-man's-land was not peaceful; it was a held breath, a tension woven from the logistics of supply lines, the rhetoric of capitals a hundred miles away, and the hunger gnawing at the bellies of the conscripts huddled in the mud behind him. The army was a coiled spring, compressed by months of stalemate, shortages, and political deadlock. The order to resume hostilities had arrived three days prior, sealed in red wax. The artillery was calibrated. The ammunition crates were opened. The war did not need Thorne to begin; it only needed him to nod.

  He flipped the watch open. The luminous hands glowed green in the gloom. They read 0600.

  "Fire," Thorne said.

  The command passed down the line, a whisper becoming a shout. Behind him, the mortars thumped, a rhythmic heartbeat shaking the trench walls. The sky above the valley tore open with the scream of shells.

  Three days earlier, Thorne had been in the dugout, reviewing maps. His lieutenant, a nervous boy named Kael, had stumbled in the low doorway, colliding with Thorne. The watch had flown from Thorne's hand, striking the iron frame of a bunk bed. Thorne had picked it up, wound it, and listened to the tick. It seemed steady. He had not sent it for repair. There was no time. There was no one to send it to. The mechanics of the war had ground the civilian world to a halt.

  If the watch had not struck the iron, the balance spring would not have been compromised. If the spring were whole, the watch would be losing two seconds a day, as it had for ten years. Instead, due to the microscopic bend in the metal, it was gaining four minutes every hour. Over seventy-two hours, the error had accumulated.

  The true time was 0556.

  In the valley, the fog shifted. Across the line, the enemy artillerymen, sleeping in their greatcoats with their fuses in their pockets, woke not to the sound of impact, but to the warning of their own acoustic sensors. They had been waiting. Their orders, like Thorne's, were to resume at 0600. But their commanders, aware of the thin ice of the armistice, had ordered the guns pre-loaded and the crews at quarters since 0400. The structural pressure of the campaign demanded a resumption of violence; the supply trucks were empty, the political window for a negotiated peace had closed in Paris the week before. The battle was a mathematical certainty derived from the trajectory of two colliding nations.

  Thorne's barrage landed four minutes early. It caught the enemy forward scouts exposed, men who had risen to stretch their legs believing they had time. Dozens fell. The enemy command, interpreting the early volley not as a mistake but as a signal of aggressive intent, immediately authorized a full counter-barrage.

  Had Thorne waited the four minutes, the scouts would have been back in their bunkers. The first shell might have landed harmlessly in the mud. The counter-attack might have been delayed by the time it took to verify the strike. A diplomat in a warm office might have received a telegram asking for clarification. The phone lines might have stayed open.

  But the shells were already in the air. The momentum of the machinery took over. The thousands of men behind Thorne, relieved that the waiting was over, surged forward into the fog. They were driven by the promise of hot food in the enemy depots and the fear of court-martial. They moved like water finding the level, inevitable and fluid.

  Thorne lowered the watch. He looked at the face, at the second hand sweeping smoothly past the twelve. He felt a sudden, sharp certainty that he had acted precisely when he was meant to. Then, a shiver of doubt cold as the steel in his hand suggested that the watch was a liar, and he was merely the finger that pulled the trigger of a gun loaded by someone else.

  The valley erupted. The fog turned grey, then black with smoke. The specific time on the dial became irrelevant, swallowed by the roar of the explosion. History moved forward, consuming the minute, the watch, and the man who held it, leaving no record of whether the spark had caused the fire, or if the fire had simply waited for a spark.
