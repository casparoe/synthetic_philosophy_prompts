answer: |-
  You have stumbled onto one of the deepest problems in the philosophy of probability. Most data journalists treat a model's output as a direct instruction for belief (the "Naive Principal Principle"), but as you've noted, David Lewis showed that this logic collapses without a specific filter on what else you know.

  Here is the breakdown of the Naive view vs. Lewis's actual principle, the concrete case where the naive view fails, and why this distinction matters for your reporting on election models.

  ### 1. The Naive Principle vs. Lewis's Principal Principle

  **The Naive Principle:**
  If you know that the objective chance of event $A$ is $x$, your credence (degree of belief) in $A$ should be $x$.
  $$Cr(A) = x$$

  **Lewis's Principal Principle (PP):**
  Lewis formalized this to account for the fact that you usually have *other* evidence ($E$) besides just the chance information.
  $$Cr(A \mid Ch(A) = x \land E) = x$$
  **...provided that $E$ is *admissible*.**

  The entire philosophical heavy-lifting is done by that proviso. Without it, the equation is false.

  ### 2. The Concrete Counterexample: The "Crystal Ball" Case

  To see why the Naive Principle breaks, we need a case where you know the chance, but you also have evidence that logically overrides that chance. Lewis often used examples involving time travel or crystal balls because they make the logic stark.

  **The Setup:**
  Imagine a genuinely indeterministic coin toss scheduled for noon tomorrow. Based on the physical symmetry and propensity of the coin, the **objective chance** of Heads is exactly **0.7**.
  *   $Ch(\text{Heads}) = 0.7$

  **The Naive Application:**
  According to the Naive Principle, your credence right now should be 0.7.
  *   $Cr(\text{Heads}) = 0.7$

  **The Inadmissible Evidence ($E$):**
  Suppose you possess a reliable crystal ball (or a newspaper from tomorrow, via time travel). You look into it, and it clearly shows the coin landing **Tails**.
  *   $E = \text{"The outcome is Tails"}$

  **The Conflict:**
  If you follow the Naive Principle, you are supposed to ignore the crystal ball and stick with the 0.7 because "Chance is 0.7."
  $$Cr(\text{Heads} \mid Ch(\text{Heads})=0.7 \land \text{Ball says Tails}) = 0.7$$

  **The Rational Reality:**
  This is irrational. If you trust the crystal ball, your credence in Heads should be **0**. The evidence about the *outcome* trumps the evidence about the *propensity*.
  $$Cr(\text{Heads} \mid Ch(\text{Heads})=0.7 \land \text{Ball says Tails}) = 0$$

  **Why the Naive Version Fails:**
  The Naive Principle assumes that chance is the *only* bridge between the present and the future. The Crystal Ball case shows that if you have a bridge that goes directly to the future (inadmissible evidence), the chance bridge becomes irrelevant.

  ### 3. What Work is "Admissibility" Doing?

  Lewis defined admissibility roughly as follows: **Information is admissible if it influences your credence about the outcome *only* by influencing your credence about the chances.**

  *   **Admissible Evidence:** Information about the past or present setup (e.g., "The coin is weighted," "The polling data is from yesterday," "The decay rate of this atom is X"). This info helps you figure out what the chance *is*. Once you know the chance, this info has no further work to do.
  *   **Inadmissible Evidence:** Information about the future outcome itself (e.g., "The coin landed Tails," "Candidate A won the state"). This info bypasses the chance function entirely.

  **The "Undermining" Problem (The Technical Nuance):**
  Lewis actually worried about something even subtler than crystal balls, which is why he needed the restriction even for normal evidence.
  If chances are determined by the total pattern of events in the universe (a Humean view), then the *future* helps determine what the *present* chances are.
  *   *Example:* If a coin lands Heads 1,000 times in a row tomorrow, the "best system" analysis might say the chance *today* was actually biased, not 0.5.
  *   Therefore, knowing the future pattern could change your mind about what the present chance *is*.
  *   Admissibility blocks this feedback loop. It restricts $E$ to "history up to time $t$," ensuring you aren't using future facts to retroactively alter the chance assignment.

  ### 4. Application to Election Forecasting (The Journalist's Angle)

  This is where your reporting can add significant value, because most forecasters and consumers are conflating two different types of probability.

  **A. Epistemic vs. Objective Chance**
  Lewis's Principal Principle applies to **objective chances** (physical propensities, like radioactive decay).
  Election models (FiveThirtyEight, The Economist, etc.) produce **epistemic probabilities** (degrees of belief based on incomplete information).

  *   **In a coin toss:** The chance is physical. The outcome is indeterministic (on some views).
  *   **In an election:** The votes are already cast or will be cast deterministically. The "70%" is not a physical propensity of the voter; it is a measure of the *model's uncertainty*.

  **B. Why Admissibility Matters for Your Readers**
  When a model says "70%," it is implicitly claiming: *"Given the admissible evidence we have (polls, fundamentals), the frequency of similar scenarios results in a win 70% of the time."*

  The Naive Principle tells readers: "Believe 70%."
  The Principal Principle tells readers: "Believe 70% **unless you have inadmissible evidence.**"

  **Concrete Election Case:**
  *   **Model:** Says Candidate A has a 70% chance of winning based on polls available on Monday.
  *   **Scenario:** On Tuesday, a video surfaces proving Candidate A committed a felony (new evidence). Or, simpler: You are a pollster inside the campaign and you see the internal data showing a collapse (inadmissible relative to the public model).
  *   **Naive View:** "The model says 70%, so I should still believe 70%."
  *   **PP View:** "The model's 70% was conditional on *its* evidence set. My new evidence is inadmissible relative to the model's calculation. I must update my credence to near 0%, overriding the model."

  **The Reporting Hook:**
  The "70%" is not a prophecy; it is a summary of *current, admissible information*.
  1.  **If the model is right about the chances:** You should believe 70%.
  2.  **If you know something the model doesn't (Inadmissible E):** The model's number is irrelevant.
  3.  **If the "chance" is actually just uncertainty:** The PP doesn't strictly apply, but the logic holds. The number represents the *model's* credence, not the world's propensity.

  ### Summary for your piece
  You can frame it like this:
  > "Treating a forecast as a direct command for belief relies on a philosophical rule called the Principal Principle. But David Lewis, who formulated it, included a crucial escape clause: 'Admissibility.' The rule only holds if you don't know anything about the outcome that the model doesn't. In elections, where 'chance' is really just a measure of our ignorance, the 70% figure is fragile. It commands your belief only so long as you remain as ignorant as the model. If you have 'inadmissible' information—insider knowledge, late-breaking scandals, or simply a different interpretation of the same polls—the Principal Principle releases you from the obligation to match the model's number."

  This moves the conversation from "Trust the math" to "Trust the math *given your information state*," which is a much more sophisticated and accurate way to consume forecasts.
