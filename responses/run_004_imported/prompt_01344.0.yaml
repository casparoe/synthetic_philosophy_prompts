      *   The phrase "We have made what is strong just" is a diagnosis of the *political solution* to the epistemological problem, not a metaphysical denial of justice.
      *   *Key Distinction:* Justice *in itself* vs. Justice *as institutionalized*.
      *   *L58 Connection:* L58 supports Reading 2. Tyranny is the confusion of orders (strong trying to be pious, etc.). The Justice/Might fragment describes the *confusion of orders* where Force usurps the title of Justice.

