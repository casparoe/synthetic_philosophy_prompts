answer: |-
  This is a sharp observation, and you have correctly identified one of the most contentious fault lines in contemporary social epistemology. You've essentially stumbled onto the debate between **Conciliatory Views** (defer to the disagreement/HOE) and **Steadfast Views** (stick to your first-order evidence) in the literature on peer disagreement and higher-order evidence (HOE).

  The reason this isn't a "settled mistake" in the literature is that your premise—that epistemic akrasia is irrational *by definition*—is itself a major point of contention. Furthermore, the move from "experts disagree" to "my reasoning is compromised" is not always valid.

  Here is why the "trust your inside view" option remains a live, defensible position in the literature, and where the tension with *Inadequate Equilibria* actually lies.

  ### 1. The Akrasia Constraint is Not Settled
  You argue that akrasia (believing $P$ while believing your belief in $P$ is irrational) is irrational "basically by definition." In the literature, this is known as the **Akrasia Constraint**.

  *   **The Conciliatory Camp (e.g., David Christensen, Sophie Horowitz):** Agrees with you. They argue that rationality requires coherence between your first-order beliefs and your higher-order assessments. If you believe "I am likely biased here," you are rationally required to lower your credence. To do otherwise is a form of epistemic self-sabotage.
  *   **The Steadfast Camp (e.g., Maria Lasonen-Aarnio, Thomas Kelly):** Argues that the Akrasia Constraint is false. They posit that rationality is primarily about responding correctly to the **first-order evidence**. If the first-order evidence (the math, the data, the logic) overwhelmingly supports $P$, you should believe $P$, even if you have higher-order evidence suggesting you might be messing up.

  **Why?** Because HOE can be misleading. If you have solved a math problem correctly, the fact that 100 other people say you are wrong (HOE) does not change the fact that the proof works (First-Order Evidence). If you defer to the HOE, you are prioritizing *social coherence* over *truth-tracking*. The Steadfast view argues that avoiding akrasia is less important than believing in accordance with the weight of the evidence.

  ### 2. "Disagreement" vs. "Compromise"
  Your prompt conflates two different types of Higher-Order Evidence:
  1.  **Peer Disagreement:** "Experts disagree with me."
  2.  **Cognitive Compromise:** "I am tired/drunk/biased/a known crank."

  The literature treats these differently.
  *   If you have evidence of **Cognitive Compromise** (e.g., you know you have a motivated cognition bias regarding politics), almost *everyone* (Steadfast and Conciliatory) agrees you must adjust your credence. Trusting your inside view here is indeed widely regarded as irrational.
  *   However, **Peer Disagreement** is not necessarily evidence of compromise. It is evidence that the evidence is ambiguous or difficult.

  Yudkowsky's argument in *Inadequate Equilibria* is not "I am a crank, trust me." It is "The system of experts is trapped in an inadequate equilibrium (bad incentives, social conformity), so their consensus is not reliable evidence."

  If you believe the experts are stuck in a local maximum, their disagreement is not evidence that *you* are broken; it is evidence that *the consensus mechanism* is broken. In that specific case, the "Outside View" (the consensus) is miscalibrated. Trusting the Inside View isn't akrasia; it's a claim that your assessment of the system's failure outweighs the system's output.

  ### 3. The "Total Evidence" View
  The dominant framework in Bayesian epistemology is that you should update on your **Total Evidence**.
  *   **Outside View:** "99% of people disagree with me." (Strong evidence against $P$)
  *   **Inside View:** "I have checked the derivation three times, and I found a specific error in their work." (Strong evidence for $P$)

  The "Steadfast" position is simply the claim that the Inside View evidence can sometimes *outweigh* the Outside View evidence. If it does, then maintaining high credence is not akrasia; it is a rational weighing of conflicting evidence streams.

  The mistake occurs when people ignore the Outside View entirely (the "Crank" move). But the literature defends the option of *weighing* them and letting the Inside View win in specific contexts (e.g., when you have private evidence the experts don't, or when you have identified a specific flaw in their reasoning).

  ### 4. The Problem of Epistemic Freeze
  If we accept your conclusion—that you must always defer to the Outside View when it conflicts with your Inside View—we run into the **Problem of Epistemic Freeze**.

  *   Newtonian physics was the consensus "Outside View" for centuries.
  *   For Einstein to propose Relativity, he had to hold a credence in his Inside View that contradicted the universal Outside View.
  *   If rationality requires avoiding akrasia (i.e., "I believe Relativity, but I acknowledge the entire physics community thinks I'm wrong, so I should believe I'm wrong"), then Einstein would have been irrational for publishing.

  The literature keeps the "Inside View" option open because we need a mechanism for **justified deviation**. If rationality forbids ever believing you are right against the consensus, scientific and moral progress becomes impossible. The philosophical challenge is drawing the line between "Justified Deviation" (Einstein) and "Unjustified Arrogance" (The Crank). Since that line is fuzzy, the debate remains live.

  ### 5. Why Yudkowsky Feels Cavalier
  You mentioned Yudkowsky seems "too cavalier." This is a common critique.
  *   **Inadequate Equilibria** is a pop-econ/epistemology book, not a rigorous academic paper. Yudkowsky optimizes for "preventing good ideas from being suppressed by modesty."
  *   **Academic Epistemology** optimizes for "preventing bad ideas from being propagated by arrogance."

  Yudkowsky is highlighting a specific failure mode: **Excessive Modesty.** He argues that in modern civilization, the penalty for being a crank (social ostracization) is lower than the penalty for being overly modest (missing a crucial opportunity to fix a broken system).

  The academic literature treats the issue as balanced because they are trying to define the *general rule*. Yudkowsky is arguing for a *heuristic correction* for a specific cultural environment.

  ### Summary
  The reason "trust your inside view" is still a live option is that:
  1.  **Akrasia might not be the ultimate sin:** Accuracy (believing true things) might trump coherence (avoiding self-contradiction).
  2.  **Disagreement isn't always defeat:** Sometimes the consensus is wrong, and you have the data to prove it.
  3.  **Progress requires dissent:** A rule that forbids high credence against consensus prevents paradigm shifts.

  You are right that if you *know* you are a crank (evidence of specific cognitive compromise), keeping credence is irrational. But the literature defends the case where you *don't* know you're a crank, you just know you disagree with people who *might* be stuck in an inadequate equilibrium. Distinguishing those two states is the hard problem that keeps the field employed.
