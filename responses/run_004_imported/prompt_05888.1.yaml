      *   **Move 5 (Nate):** Argues Bayes + Preregistration is best because of optional stopping. Bayes allows sequential analysis without alpha inflation.
          *   *Assessment:* Technically true regarding optional stopping (Bayes factors are robust to stopping rules under certain conditions). This is a distinct advantage over frequentist null hypothesis significance testing (NHST). However, it doesn't fully address the "garden of forking paths" regarding *which* data to collect or *how* to model it, just *when* to stop.
