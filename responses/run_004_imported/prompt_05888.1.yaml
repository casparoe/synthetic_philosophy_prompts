      *   **Move 3 (Nate):** Concedes p-hacking exists but argues Bayesian priors are transparent, whereas researcher degrees of freedom are hidden.
          *   *Assessment:* Good theoretical point. Transparency is a virtue of Bayes. However, it assumes reviewers *will* critique priors (which Sofia challenges next). It's a normative claim (how it *should* work) vs. positive claim (how it *does* work).
          *   *Score:* +1 (Valid theoretical advantage, but ignores practical implementation issues).

