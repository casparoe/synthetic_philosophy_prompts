          *   *Assessment:* Very strong practical point. Flat priors do converge to frequentist results. Preregistration *is* the structural fix for degrees of freedom. The comparison (preregistered t-test vs. non-preregistered Bayes) is a bit of a strawman (Nate didn't say non-preregistered), but the core point stands.
