prompt: |-
  So I've been reading LessWrong and the Alignment Forum on and off since basically the Sequences days, and I'm finally putting together a small interview podcast with people who work in that decision-theory-adjacent corner of AI safety. My first guest is a game theorist whose whole research angle is the commitment races problem -- the Kokotajlo framing where consequentialist agents are incentivized to lock in commitments as early as possible because whoever commits "first" in a bargaining situation claims the better share, except committing before you're actually wise enough is exactly how you get catastrophic outcomes. Her specific angle (basically Yudkowsky's old comment on that post turned into a full research program) is that the "race" is really a symptom of dealing with agents that aren't yet rational, and that a sufficiently well-designed resolute or updateless agent just doesn't reward apparent commitments the way a naive one does -- so stuff like the Boomerang mandatory-delay protocol or safe-Pareto-improvement schemes are patches on a problem good decision theory should dissolve outright.

  I don't want her just restating that pitch, I want the interview to actually press on it. Can you draft me 8-10 questions? At minimum I want one on whether "just be resolute/updateless" secretly smuggles the original timing problem back in (deciding to become resolute has to happen at some point in logical time too -- cant you just lose the race there instead), one on how this is even supposed to work once you add acausal/logical-time bargaining where onlookers can watch you deliberate, so "think longer before committing" isn't free the way it might be for two humans across a table, one on the moral-hazard worry that safe Pareto improvements and surrogate goals make premature commitments cheaper and therefore more tempting rather than less, and one flat-out "what would actually change your mind about this" question. For each, tack on a quick follow-up keyed to whatever dodge she's most likely to reach for -- I don't want her getting away with a "that's a future research problem, not a real objection" move the way panpsychists lean on "combination problem, not objection."
