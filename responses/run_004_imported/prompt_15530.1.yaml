answer: |-
  This is a classic "two wrongs don't make a right" situation, but friendships are rarely about pure logic. You are stuck because both of you are holding onto a different truth.

  Here is the breakdown of who is right, who is wrong, and what actually matters for your friendship.

  ### 1. The Technical Truth: She is right about the act.
  Logically and ethically, she is correct that her behavior does not give you a free pass to breach her confidence. If she told you something in private, and you shared it with someone else, you broke a specific agreement between the two of you.

  *   **Her point:** "I hurt you, so you can hurt me" is not a healthy foundation for a friendship.
  *   **The hard pill:** Even if she is a terrible secret-keeper, *you* get to control your own integrity. If you want to be a trustworthy person, you keep confidences regardless of whether the other person does.

  ### 2. The Relational Truth: You are right about the dynamic.
  While she is technically right about the specific incident, she is wrong to act as though her history of gossip is "beside the point." Trust is a two-way street.

  *   **The Double Standard:** It is exhausting to be in a friendship where you are held to a standard of secrecy that the other person does not uphold. It creates a power imbalance where she has leverage over you (because she knows your secrets) but you have none over her (because she leaks yours).
  *   **The Hypocrisy:** It is valid to feel hurt that someone who disrespects boundaries is demanding you respect theirs. It signals that she views her feelings as more important than yours.

  ### 3. The Manipulation: The Silent Treatment.
  This is the biggest red flag. Giving you the silent treatment is a punitive tactic designed to make you feel small and desperate for her approval.
  *   A mature friend would say, "I'm really hurt you told people. I need some space."
  *   An immature or manipulative friend uses silence to punish you until you apologize enough to soothe *their* ego, without addressing the underlying issue.

  ### So, is she right?
  **She is right that you broke a confidence.** You should own that.
  **She is wrong that her behavior doesn't matter.** It matters immensely for the future of this friendship.

  ### How to handle this
  You need to separate the **apology** from the **boundary**.

  **Step 1: Own your part (The Apology)**
  Don't bring up her gossiping yet. If you want to save the friendship, you have to apologize for the specific thing you did.
  *   *Say:* "I've been thinking about this, and you're right. I shared something you told me in confidence, and that was a breach of trust. I'm sorry I hurt you and made you feel unsafe."

  **Step 2: Address the dynamic (The Boundary)**
  Once the apology is delivered, you need to address the double standard. If you don't, this will happen again.
  *   *Say:* "I value our friendship, which is why I want to be honest. It's really hard for me to navigate confidentiality when I know my own secrets have been shared by you in the past. For this friendship to work long-term, I need us to be on the same page about privacy. I need to know that what I tell you stays between us, just like I will do for you."

  **Step 3: Evaluate her reaction**
  *   **If she accepts the apology and acknowledges the double standard:** There is hope. You can rebuild trust slowly.
  *   **If she doubles down ("It doesn't matter what I do!") or continues the silent treatment:** She is not interested in a reciprocal friendship; she is interested in control.

  ### The Hard Reality
  You mentioned she gossips about "literally everyone, including stuff I've told her."
  **Believe her.** She has shown you who she is.

  Even if you make up, **stop telling her your secrets.** She has proven she cannot hold them. You can still be friends, but you must downgrade her clearance level. She becomes a "fun activity friend," not a "deep emotional confidante."

  If she demands deep vulnerability from you while offering none in return, she isn't being a friend; she's being an audience. You are allowed to protect your peace by keeping your personal life off-limits to someone who has proven they will broadcast it.
