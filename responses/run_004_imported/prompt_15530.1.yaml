prompt: |-
  Been going back and forth on this for days and can't land on an answer. My friend found out I told our other friend about her breakup, and now she's giving me the silent treatment for "not being trustworthy." Thing is, this is a girl who gossips about literally everyone, including stuff i've told her in confidence, so it feels weird that she's the one lecturing me about it. When I brought that up she said it doesn't matter what she does, I still did something shitty by telling. Is she right that her own gossiping is beside the point, or does it actually matter that she's the one calling me out on this?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The User:** Told a mutual friend about Friend A's breakup. Friend A found out and is giving the silent treatment, calling the User "untrustworthy."
      *   **Friend A:** Gossips about everyone, including things the User has told her in confidence. She argues that her behavior doesn't justify the User's behavior ("two wrongs don't make a right").
      *   **The Conflict:** User feels it's hypocritical for Friend A to demand trustworthiness when she isn't trustworthy herself. Friend A claims the breach of confidence is the issue, regardless of her own habits.
      *   **The Question:** Is Friend A right that her gossiping is beside the point, or does her hypocrisy matter?

  2.  **Deconstruct the Arguments:**
      *   **Friend A's Argument:** "You broke a confidence. That is wrong. My behavior is irrelevant to the fact that you hurt me."
          *   *Validity:* Technically, logically, she is correct. One person's bad behavior doesn't excuse another's. If you promise secrecy, you should keep it.
      *   **User's Argument:** "You gossip about everyone, including me. You don't deserve the high ground. It feels unfair to be held to a standard you don't follow."
          *   *Validity:* Emotionally, this is valid. Trust is a two-way street. A friendship based on one-sided secrecy is unstable. It highlights a double standard.

  3.  **Evaluate the Core Issues:**
      *   **The Breach:** Did the User promise to keep it secret? Or was it assumed? If the friend shared the breakup in confidence, telling someone else is a betrayal of that specific trust.
      *   **The Hypocrisy:** Friend A is a known gossip. This makes her reaction surprising but also highlights the fragility of the friendship.
      *   **The Relationship Dynamic:** This isn't just about one incident. It's about a pattern. Friend A leaks info *and* demands silence. That's a control dynamic, not a friendship dynamic.
      *   **The "Rightness":** Who is "right"?
          *   *Moral/Logical:* Friend A is right that two wrongs don't make a right.
          *   *Relational:* The User is right that the friendship is imbalanced and unhealthy.

  4.  **Formulate the Advice:**
      *   **Acknowledge the Complexity:** Validate that both sides have a point, which is why the user is stuck.
      *   **Address the "Technical" Truth:** Yes, logically, her gossiping doesn't *excuse* the user's action. If you say you won't tell, you shouldn't tell.
      *   **Address the "Relational" Truth:** However, her hypocrisy *does* matter for the future of the friendship. It shows she doesn't value reciprocity.
      *   **Analyze the Friendship:** This sounds like a toxic dynamic. A friend who gossips about you *and* gets mad when you share news about them is a walking minefield.
      *   **Actionable Steps:**
          *   Apologize for the specific breach (own your part).
          *   Address the double standard (set boundaries).
          *   Re-evaluate the friendship (is this worth keeping?).

  5.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the frustration. It's a classic "do as I say, not as I do" scenario.
      *   *The "Is she right?" part:* Nuanced answer. She's right about the act, wrong about the context of the friendship.
      *   *The Hypocrisy:* Explain why it matters. Trust is reciprocal.
      *   *The Breakup Context:* Why was it told? Was it malicious or seeking support? This matters for the apology.
      *   *The Silent Treatment:* Point out that this is manipulative.
      *   *Conclusion:* Focus on what the user wants from the friendship moving forward.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but objective.
      *   Avoid taking sides completely, but validate the user's feeling of unfairness.
