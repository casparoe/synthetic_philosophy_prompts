  8.  **Self-Correction/Edge Case Consideration:**
      *   *What if the user told the mutual friend maliciously?* I need to mention that intent matters. If it was to hurt Friend A, that's worse. If it was to process emotions, it's more understandable.
      *   *What if the breakup wasn't secret?* The prompt implies it was ("told our other friend about her breakup" usually implies sharing news she wanted private). I will assume it was confidential.
      *   *Is the user wrong?* Yes, technically. I need to make sure I don't let the user off the hook completely, or they won't learn. But I also need to validate that Friend A is a risky friend to have.

  9.  **Final Structure:**
