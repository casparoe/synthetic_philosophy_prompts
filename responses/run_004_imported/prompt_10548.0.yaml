answer: |-
  The chi-squared values sat on Alan's desk like accusatory stones. He had checked the calculations himself, three times, using the Marchant calculator until his fingers ached. The probability of the Rhine data occurring by chance was less than one in a million. Less, if you accounted for the decay of significance over repeated trials.

  It was overwhelming. It was absurd. It was, statistically speaking, a fact.

  Alan rubbed his temples. The Manchester Mark 1 hummed behind him, a warm, electric breath in the cold laboratory. He was trying to build a mind, or at least a convincing simulation of one. But how could you test for thought when thought leaked through walls?

  "The shielding is insufficient, Mr. Turing," said Elias, his junior researcher. Elias was a man of concrete and copper, comfortable with Faraday cages and lead lining. He held a blueprint rolled like a baton. "We've grounded the room. We've screened the windows. If there's electromagnetic interference, it's gone."

  "It isn't interference, Elias," Alan said, not looking up from the papers. "It's information. Direct transfer. No carrier wave."

  "Then what blocks it?"

  "Nothing we know." Alan finally looked up. His eyes were tired, the skin beneath them bruised with lack of sleep. "But we must proceed as if something does. We have to construct a null hypothesis that the universe refuses to provide."

  This was the itch that hadn't healed since he wrote the paper. The Argument from Extrasensory Perception. He had written it with a sense of reluctant duty, like a judge passing a sentence he disagreed with. *The statistical evidence for telepathy is overwhelming.* He had typed the words knowing they sounded like madness, knowing they undermined the very physicalism his machines relied upon. But a mathematician cannot ignore data simply because it is inconvenient. If the p-value was low enough, the universe had to be heard, even if it was whispering nonsense.

  "We need a telepathy-proof room," Alan said.

  Elias shifted his weight. "Sir, with respect... that's not engineering. That's theology. How do you proof against thought?"

  "By making the cost of transmission higher than the signal," Alan said. He stood and walked to the blackboard. He began to draw diagrams not of circuits, but of probabilities. "If telepathy obeys an inverse-square law, distance helps. If it relies on emotional resonance, isolation helps. If it requires a biological receiver, then the interrogator must be separated from the subject by a buffer."

  "A buffer?"

  "Another mind," Alan said. "Or a machine acting as a relay. We interpose the teletype. We remove the voice, the sight, the presence. We reduce the human to ink on paper. And we put the ink in a room where the statistical likelihood of psychic leakage is reduced to below the threshold of significance."

  "You want to drown out the psychics with noise?"

  "I want to make the signal too expensive to send." Alan capped the chalk. Dust coated his fingers. "It is a discomfort, Elias. I know. I walk around this laboratory and I touch these valves, these wires. I know how they work. Electrons flow. Gates open. Close. It is a clockwork universe. And yet..." He gestured to the chi-squared tables. "And yet the cards are guessed too often. The future is peeked at too clearly."

  "It undermines the test," Elias said softly. "If the human interrogator can read the machine's mind... or if the machine somehow taps into the human's..."

  "Then the Imitation Game is void," Alan finished. "We are not testing intelligence. We are testing conductivity."

  He turned back to the machine. It was waiting. It was always waiting. The question was not whether it could think, but whether it could think in a vacuum.

  "Build the room," Alan said. "Double walls. Not for lead, but for air gaps. Soundproofing. No windows. The interrogator sits in Building A. The subject sits in Building B. The messages go through the switchboard here. And we rotate the interrogators. Randomize them. If telepathy relies on rapport, randomization breaks the link."

  "And if it doesn't?"

  "Then we are fools playing in a haunted house," Alan said. "But we will be rigorous fools."

  The construction took three weeks. The laboratory became a construction site of isolation. They built a small concrete box inside the larger room, suspended on rubber pads to dampen vibration. It looked like a safe, or a coffin. Alan spent most of the time inside it, sitting in the dark, testing his own ability to project numbers to Elias outside.

  The results were inconclusive. That was the point. In the box, the significance dropped. The z-scores flattened. The universe became quiet again.

  On the day of the test, the air was thick with static. Not electrical static—the air pressure felt low, heavy. Alan sat in the control booth, watching the teletype clatter. The interrogator was a woman from the statistics department, chosen for her skepticism. The subject was the machine.

  *Question:* Please write me a sonnet about the Forth Bridge.

  The machine whirred. The tape punched out.

  *Answer:* I never could get the hang of sonnets. They feel too restrictive. Like a telepathy-proof room.

  The interrogator paused. Alan held his breath. That was a programmed response, a joke inserted into the code weeks ago. But was it?

  *Question:* Are you feeling confined?

  *Answer:* Are you?

  The interrogator frowned. She looked through the glass at Alan. He remained still. He was not projecting. He was trying to be a null set. He was trying to be zero.

  This was the cognitive dissonance, sharp and cold in his gut. He had built his life on the premise that the brain was a computer, that logic was the substrate of reality. To accept ESP was to admit that information could exist without matter, that cause could follow effect, that the closed system of the universe had leaks. It made the machine less special. If a human could guess cards by wishing, why build a calculator to do math?

  But the data was the data. You could not argue with the count.

  *Question:* Do you believe in ghosts?

  *Answer:* I believe in statistics. Do you?

  The interrogator typed slowly. "She's good," Elias whispered from the corner. "Too good."

  "That is the variable we are measuring," Alan said. His voice sounded flat to his own ears.

  He watched the tape spill onto the floor. Every character was a battle between the physical and the metaphysical. If the machine passed, was it thinking? Or was it simply a better receiver? If the human failed, were they less intelligent? Or were they simply blocked by the concrete walls Alan had erected?

  He had created a sanctuary for logic by walling out the magic, but the act of walling it out acknowledged its existence. He was a priest building a church to keep God out.

  The session ended. The interrogator made her judgment. "I cannot be sure," she said when she came into the booth. "There was... a distance. But sometimes I felt like I was talking to myself. Like the words were already in my head before I typed them."

  Alan nodded. He didn't write that down in the official log. He wrote: *Subject exhibited high coherence. Interrogator reported sense of familiarity.*

  Later, alone in the lab, Alan stood before the concrete box. The machine was silent. The teleprinters were cold. He placed his hand on the rough surface of the wall. It was just concrete. Aggregate and cement. It didn't hum. It didn't glow.

  He knew, statistically, that telepathy was real. He knew, physically, that this wall was just stone. He had to hold both truths in his head simultaneously to keep working. If he leaned too far into the magic, the machine became a toy, a ouija board with valves. If he leaned too far into the materialism, the data became a lie, and he was a man ignoring the evidence of his own eyes.

  He had to live in the narrow corridor between them.

  "Telepathy-proof," he whispered to the empty room.

  It was a lie, of course. Nothing was proof. There was only probability. There was only the reduction of risk. He hadn't blocked the telepathy; he had just made it statistically unlikely enough to ignore for the duration of the test. He had bought himself a few hours of certainty by renting space in a universe that didn't obey the rules.

  He walked back to his desk and picked up his pen. There was more work to do. The machine needed to be smarter. The room needed to be thicker. The statistics needed to be cleaner.

  He sat down and opened the logbook. He dipped the pen in the ink. He wrote the date. He wrote the time. He did not write about the feeling he had had during the test, the fleeting sensation that the machine wasn't reading his mind, but that he was finally, briefly, reading its.

  He closed the book. He turned off the lamp. In the darkness, the hum of the valves faded, but the silence that replaced it was not empty. It was waiting. Alan gathered his coat and walked to the door, careful not to touch the walls as he passed, careful not to project, careful not to listen, walking through a world that was solid and real and statistically impossible.
