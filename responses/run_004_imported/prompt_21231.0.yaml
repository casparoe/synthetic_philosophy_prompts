answer: |-
  It is entirely understandable why Propensity Theory feels like the natural home for a working experimental physicist, particularly one working in quantum mechanics. You are far from alone in this intuition; many physicists find that Propensity Theory best captures the *practice* of physics, where we treat decay rates and cross-sections as real, physical properties of systems, not merely summaries of past data or statements about our ignorance.

  However, the reason philosophers of probability do not treat Propensity Theory as the "settled answer" is not because they are unaware of its advantages over Frequentism and Subjectivism. Rather, it is because Propensity Theory introduces a new set of profound metaphysical and formal difficulties that its rivals do not face. While it solves the "single-case" problem, it creates an "ontology" problem and a "measurement" problem.

  Here are the primary reasons why Propensity Theory remains a contested option rather than a consensus view.

  ### 1. Metaphysical Obscurity (The "What Is It?" Problem)
  Frequentism defines probability in terms of events (which we can count). Subjectivism defines it in terms of agents (which we can introspect). Propensity theory defines probability as a **disposition** or a **power** inherent in the physical setup.

  To a physicist, this feels intuitive: the atom *has* a decay constant. But to a metaphysician, this is obscure. What kind of physical property is this?
  *   Is it like mass or charge? If so, how does it manifest? Mass manifests as resistance to acceleration; charge as electromagnetic interaction. A propensity manifests only as a statistical frequency over time.
  *   If the manifestation is *only* statistical, how do we distinguish the propensity from the frequency it produces?
  *   Critics argue that positing a "propensity" is merely giving a name to the mystery rather than solving it. It risks being a *dormitive virtue* explanation (like Molière's doctor saying opium causes sleep because it has a "sleep-inducing power").

  ### 2. The Link to Frequency (The "Bridge" Problem)
  The main selling point of propensity is that it explains *why* long-run frequencies stabilize. The atom has a 50% propensity to decay, so in a large ensemble, 50% decay.

  However, establishing the logical link between single-case propensities and long-run frequencies is notoriously difficult.
  *   **The Possibility of Deviation:** Even if an atom has a propensity of 0.5, it is physically possible (though unlikely) that in a run of a million trials, 90% decay. If this happens, did the propensity change?
      *   If you say **No**: Then the propensity is empirically inaccessible. We can never measure it directly, only infer it via frequencies, which brings us back to Frequentism operationally.
      *   If you say **Yes**: Then the propensity is not a stable property of the single setup, undermining the core claim of the theory.
  *   **The Law of Large Numbers:** Propensity theorists rely on the Law of Large Numbers to connect single-case chances to frequencies. But the Law of Large Numbers is a mathematical theorem about *probabilities*. To use it to explain how *propensities* generate frequencies, you effectively have to assume propensities obey the axioms of probability. This leads to the charge of circularity: we are using probability calculus to explain probability.

  ### 3. Humphreys' Paradox
  This is perhaps the most technical and damaging objection to Propensity Theory, raised by Paul Humphreys in 1985.

  Standard probability calculus allows for conditional probabilities to be inverted via Bayes' Theorem: $P(A|B)$ is mathematically related to $P(B|A)$.
  However, propensities are usually understood as **causal dispositions**. If setup $S$ has a propensity to produce outcome $O$, that makes sense causally. But does outcome $O$ have a propensity to produce setup $S$?
  *   In standard probability, $P(\text{Setup} | \text{Outcome})$ is a valid quantity.
  *   In Propensity Theory, a "inverse propensity" (effect causing cause) makes no metaphysical sense.
  *   Therefore, Propensities do not map neatly onto the standard Kolmogorov axioms of probability. If Propensity Theory cannot replicate the formal structure of probability calculus (specifically conditionalization), it cannot fully serve as an interpretation of probability.

  ### 4. The Reference Class Problem Returns
  You correctly identified that Frequentism struggles with the reference class problem (which population of atoms do we count?). Propensity Theory attempts to solve this by locating the probability in the *single setup*.

  But what defines the "setup"?
  *   Is it just the atom?
  *   Is it the atom plus the detector?
  *   Is it the atom, the detector, and the ambient gravitational field?
  *   Is it the atom and the entire past light cone?

  To assign a specific propensity value (e.g., 0.7), you must specify the conditions completely. If you specify them too broadly, the propensity becomes trivial (either 0 or 1, because the exact state of the universe determines the outcome in many deterministic or hidden-variable views). If you specify them too narrowly, you cannot reproduce the setup to measure it. Propensity theory inherits the reference class problem, though it disguises it as the "description of the experimental arrangement" problem.

  ### 5. Competition from Other Quantum Interpretations
  Finally, the status of Propensity Theory is tied to the interpretation of Quantum Mechanics itself. Propensity Theory fits very well with a standard Copenhagen-style interpretation where the wavefunction represents a real, indeterministic physical tendency.

  However, other interpretations of QM render Propensity Theory unnecessary or incorrect:
  *   **Bohmian Mechanics:** This is a deterministic theory. The "probability" of decay is entirely epistemic (Subjectivist/Frequentist), arising from our ignorance of the initial particle positions. There are no objective propensities here.
  *   **Many-Worlds (Everettian):** All outcomes occur. Probability becomes a measure of "self-locating uncertainty" for the observer branching into worlds. This is closer to Subjectivism than Propensity.
  *   **QBism (Quantum Bayesianism):** This explicitly argues that quantum states are not objective facts about atoms but are catalogs of an agent's expectations.

  Since the physics community has not settled on an interpretation of QM, the philosophy community cannot settle on the interpretation of probability that depends on it.

  ### Summary
  You are right that Propensity Theory is superior at capturing the **semantic intuition** of the working physicist: it validates your feeling that the probability belongs to the atom, not the crowd and not your head.

  However, philosophers treat it as contested because it trades the *epistemological* problems of Frequentism (how do we know?) for *metaphysical* problems (what is it?). It posits a real physical property that is difficult to define independently of the frequencies it produces, struggles to align with the formal calculus of conditional probability, and relies on a specific, indeterministic ontology of quantum mechanics that is not universally shared.

  It remains a "live option"—and for many realists, the *best* option—but it has not cleared the high bar required to be considered the "settled answer."
