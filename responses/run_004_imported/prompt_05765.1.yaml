answer: |-
  This is an excellent question. You have correctly identified the friction point that has fueled two millennia of commentary: the semantic load of *fei* (非) and whether Gongsun Long is exposing a genuine logical distinction or committing a category error. The "seeking a horse" passage is indeed the engine of the dialogue, and your intuition that it relies on shifting senses of "is" is shared by most modern analysts (including Graham and Hansen, despite their metaphysical differences).

  Here is a breakdown of the mechanics of the argument, the location of the equivocation, and its place in the broader *Ming-Shi* (Name-Actuality) project.

  ### 1. Reconstruction of the "Seeking a Horse" Argument

  To make the logic explicit, we must distinguish between two relations that the English "is" (and the Chinese *shi*/*fei* context) can obscure: **Class Inclusion** (a white horse is a *member/kind* of horse) and **Identity** (the concept 'white horse' is *identical* to the concept 'horse').

  Gongsun Long's argument succeeds only if we treat "is" as **Identity**. The Objector's confusion arises because they assume **Inclusion**.

  Here is the reconstruction of the "seeking" passage, formalized to show the semantic requirements:

  *   **Premise 1 (Empirical Observation):** If one seeks "Horse," a yellow or black horse satisfies the request.
  *   **Premise 2 (Empirical Observation):** If one seeks "White Horse," a yellow or black horse does *not* satisfy the request.
  *   **Premise 3 (Principle of Substitutability):** If Term A and Term B were identical (referentially or conceptually), then satisfying a request for A would necessarily satisfy a request for B.
  *   **Intermediate Conclusion 1:** Therefore, the term "Horse" and the term "White Horse" are not identical. (From P1, P2, P3).
  *   **Premise 4 (Semantic Rule for *Fei*):** If Term A is not identical to Term B, then "A *fei* B" (A is not B) is a true statement.
  *   **Final Conclusion:** "White Horse *fei* Horse" is acceptable/true.

  **Where the senses of "Is Not" diverge:**
  *   **In Premises 1–3:** The argument relies on **Extensional Non-Identity**. The set of things satisfying "Horse" $\neq$ the set of things satisfying "White Horse." This is logically sound. The extensions differ.
  *   **In Premise 4:** This is the critical pivot. Gongsun Long assumes that if extensions differ, the predicate "is not" (*fei*) applies universally.
  *   **In the Objector's Intuition:** The Objector hears "White Horse is not Horse" as **Class Exclusion** (A white horse does not belong to the class of horses).

  For the argument to be *plausible*, Premise 4 must be read as: "If concepts are not identical, one cannot be predicated of the other."
  For the conclusion to be *shocking/false* (as the Objector feels), it is read as: "If concepts are not identical, one is not a subset of the other."

  Gongsun Long is entitled to the conclusion only if *fei* means "is not identical to." If *fei* means "is not a member of," the argument is invalid because non-identity does not preclude class membership (e.g., "Ford" is not "Car," but a Ford is a kind of Car).

  ### 2. Equivocation: Sophistry or Semantic Point?

  You asked whether this makes Gongsun Long guilty of Xunzi's charge of "confusing names" (confusing the use of terms to disrupt social order) or if there is a genuine semantic insight surviving the equivocation.

  **The Charge of Equivocation:**
  Xunzi (in "Against Twelve Masters") accuses the School of Names of "using names to confuse actualities." In this specific argument, the equivocation lies in the pragmatic function of the copula. In ordinary Warring States usage, "A *fei* B" allows for hierarchical classification. A "white horse" is a specific actuality (*shi*) that falls under the general name (*ming*) "horse." Gongsun Long forces *fei* to function as a strict logical identity operator ($\neq$), ignoring the hierarchical nature of generic terms. By modern standards, this is a confusion of **Sense** (the concept) with **Reference** (the object), or more accurately, a refusal to distinguish between **Identity** ($=$) and **Inclusion** ($\subset$).

  **The Genuine Semantic Point:**
  However, dismissing it as mere sophistry misses Gongsun Long's contribution. He is isolating a specific logical problem regarding **compound terms**.
  1.  **Modification restricts Extension:** Gongsun Long correctly identifies that adding a modifier ("white") changes the semantic value of the noun ("horse"). The compound name *bai ma* picks out a different slice of reality than the simple name *ma*.
  2.  **The Autonomy of Compounds:** He is arguing that "White Horse" is a *sui generis* name, not just a derivative of "Horse." If you treat "White Horse" as merely "Horse + Color," you lose the precision required to distinguish it from "Yellow Horse."
  3.  **Hansen vs. Graham:**
      *   **Graham (Class Logic):** Sees this as a confusion of identity and class membership. The "sleight of hand" is treating a subset relation as an identity relation.
      *   **Hansen (Mass Nouns):** Offers a more charitable reading. If "Horse" is a mass noun (like "water") and "White Horse" is "white-horse-stuff," then "white-horse-stuff" is indeed not identical to "horse-stuff" (because horse-stuff includes yellow-stuff). On a mereological view (part-whole), the part is not the whole.

  **Verdict:** It is a "logical stunt," but one that forces a necessary distinction. The equivocation is real, but it serves to highlight that **predication is not identity.** Gongsun Long is effectively saying: "Don't confuse the specific name with the generic name, even if the specific falls under the generic." The "sophistry" is insisting that this distinction warrants the strong negation *fei* rather than a qualified "is a kind of."

  ### 3. Connection to *Ming* (Name) and *Shi* (Actuality)

  Finally, is this a freestanding puzzle, or does it serve the School of Names' broader project? It is definitely the latter. The School of Names was not engaged in pure mathematics; they were concerned with the political and administrative consequences of language.

  **The Administrative Context of "Seeking":**
  Notice that the argument turns on "seeking" (求，*qiu*). This is not abstract ontology; it is a scenario of **request and fulfillment**. In a bureaucratic or military context:
  *   Order: "Send horses." (Result: Yellow, black, and white arrive.)
  *   Order: "Send white horses." (Result: Only white arrive.)

  If the administration accepts "White Horse *is* Horse" in the **Identity** sense, then the order "Send white horses" could logically be fulfilled by sending black horses (since if $W=H$, and you have $H$, you have $W$). This would lead to administrative chaos.

  **Rectifying Names (*Zheng Ming*):**
  Gongsun Long's project is to ensure that Names (*Ming*) correspond precisely to Actualities (*Shi*).
  *   If we allow the loose usage where "White Horse is Horse" implies identity, the Name "White Horse" loses its distinct *Shi*.
  *   By insisting "White Horse *fei* Horse," Gongsun Long is protecting the integrity of the compound name. He is arguing that the *Ming* "White Horse" must be kept distinct from the *Ming* "Horse" to ensure the *Shi* (the actual animal delivered) matches the order.

  **Conclusion for your Seminar:**
  You can argue that Gongsun Long is not denying the biological reality that a white horse is a type of horse. Rather, he is making a **semantic point about the rigidity of designators**. He is claiming that in the realm of *Ming* (language/logic), the compound designator cannot be collapsed into the simple designator without loss of precision. The "equivocation" is the price he pays to shock his audience into realizing that generic terms and specific terms function differently in logical operations.

  When you go into section, you can frame it this way: Gongsun Long sacrifices pragmatic linguistic usage (where "is" implies inclusion) to preserve logical strictness (where "is" implies identity), arguing that only the latter ensures the *Ming-Shi* correspondence required for effective governance. The "White Horse" is not a horse *in name*, even if it is one *in fact*, and for the School of Names, the Name is what governs the Fact.
