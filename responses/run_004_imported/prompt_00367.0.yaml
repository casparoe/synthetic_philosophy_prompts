answer: |-
  You are hitting on a very deep philosophical and psychological concept, and your intuition is spot on. What you are describing is a classic problem in ethics known as **Moral Luck.**

  Your friend is arguing from a place of **consequentialism** (judging an action by its result), while you are arguing from a place of **intent/risk** (judging the decision-making process itself).

  Here is a breakdown of why this bugs you, the specific terms you can use to explain it, and how to articulate why your friend's "actions have consequences" argument is incomplete.

  ### 1. The Concept: "Moral Luck"
  The philosopher Thomas Nagel coined the term "Moral Luck" to describe exactly this situation. It happens when we assign moral praise or blame to someone for things that were partially or wholly out of their control.

  *   **Driver A** had "bad luck" (a parked car was there).
  *   **Driver B** had "good luck" (the road was clear).

  Since the *choice* (looking at the phone) was identical, the *moral failing* should be identical. By punishing one and ignoring the other, society is punishing Driver A for being unlucky, not necessarily for being more reckless.

  ### 2. The Cognitive Bias: "Outcome Bias"
  Psychologists call what your friends and school are doing **Outcome Bias**. This is the human tendency to judge a decision based on the outcome rather than the quality of the decision at the time it was made.

  *   **Why we do it:** It's easier for our brains to look at a broken bumper than to analyze a split-second decision to look at a text message.
  *   **Why it's flawed:** If you judge based on outcomes, you aren't actually judging *recklessness*; you are judging *luck*. If those two kids drive 100 more times, Driver B might be the one who hits a pedestrian next time. Their skill or carelessness didn't change, only the randomness of the environment did.

  ### 3. Risk vs. Harm
  This is the strongest argument you have. You need to distinguish between **creating risk** and **causing harm.**

  *   **Driver A** created risk + caused harm.
  *   **Driver B** created risk + caused no harm.

  Both of them endangered the public equally. The fact that Driver B didn't hit anything doesn't mean he drove safely; it means he got away with driving dangerously. When people treat Driver B as "normal," they are implicitly saying his driving was safe, which is a lie. He was just as unsafe as Driver A.

  ### 4. Addressing Your Friend's Point ("Actions Have Consequences")
  Your friend isn't entirely wrong, but they are confusing **moral blame** with **practical liability.**

  *   **Practical Liability:** Yes, actions have consequences. If you break a window, you pay for the window. Driver A has to pay for the car; Driver B does not. That is a practical necessity of how insurance and laws work.
  *   **Moral Blame:** However, *character judgment* shouldn't work the same way. Just because Driver B didn't have to pay money doesn't mean he deserves to be viewed as a "better person" or a "safer driver."

  Your friend is saying, "He got punished because damage happened." You are saying, "He is being judged as a *worse human* because damage happened, even though the choice was the same."

  ### How to Explain This to Your Friends
  Next time you bring it up, try using this framework. It moves the conversation from "feelings" to logic:

  **1. The "Russian Roulette" Analogy**
  > "Imagine two people play Russian Roulette with one bullet. Person A pulls the trigger and the gun fires. Person B pulls the trigger and it clicks. They made the exact same deadly choice. Is Person B 'smarter' or 'better' than Person A? No, they're just luckier. Treating Driver B like he's a normal safe driver is like saying Person B is good at handling guns."

  **2. The "Next Time" Argument**
  > "We are judging them based on what happened *this time*. But if they both keep texting and driving, the luck runs out. Driver B isn't a safe driver; he's an uncaught risk. By treating him normally, we're pretending the danger doesn't exist."

  **3. The Definition of Recklessness**
  > "Recklessness isn't about what you hit; it's about the risk you create. They both created the same risk. The school is punishing the *damage*, not the *recklessness*. I think we should be judging the recklessness."

  ### Summary
  It bugs you because it **is** unfair on a moral level. You are recognizing that **control** is the basis of responsibility. Since neither kid controlled the position of the parked car, neither should be judged more harshly on their *character* than the other.

  However, you can acknowledge that the world *operates* on consequences. Driver A has to deal with insurance and parents because money was lost. But socially? You are right. Driver B is walking around with a "Get Out of Jail Free" card that he didn't earn, and Driver A is being branded a criminal for bad luck. That is the definition of Moral Luck.
