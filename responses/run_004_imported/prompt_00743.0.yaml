      *   **Locate the Error:** The friend is treating the contingency of the *primary intension* as if it settles the *metaphysical necessity* of the proposition.
      *   **Kripke's Vindication:** Explain that for Kripke (and 2DS adherents regarding metaphysics), the relevant modal profile is the secondary intension. "Water is H2O" is necessary in the secondary sense.
      *   **Twin Earth Nuance:** Clarify the "world considered as actual" vs. "world considered as counterfactual" distinction. This is the crux of the confusion.
      *   **Chalmers/Jackson Position:** Confirm that they agree with Kripke on the metaphysical necessity (secondary intension) but argue the *epistemic* status is different. They don't think "Water is H2O" is metaphysically contingent.
