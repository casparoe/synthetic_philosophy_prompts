          *   If considered *counterfactually* (holding our actual world fixed): 'Water' picks out H2O. The sentence "Water is H2O" is true there. This captures metaphysical necessity.
      *   *Premise 2:* The distinction shows "Water is H2O" is only contingently true.
          *   *Correction:* The distinction shows the *primary intension* is contingent. The *secondary intension* (which tracks metaphysical necessity for Kripkeans) remains necessary.
      *   *Conclusion:* 2DS undermines Kripke.
          *   *Correction:* 2DS is designed to *preserve* Kripke's metaphysical insights while accounting for Fregean epistemic insights. It vindicates Kripke on metaphysics.

  4.  **Formulate the Response:**
