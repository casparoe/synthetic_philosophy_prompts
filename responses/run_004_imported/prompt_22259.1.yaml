answer: |-
  This is an excellent question. Given your background in condensed matter, you have a distinct advantage here: you know that stress tensors and inertial forces are measurable, local quantities. You also know that "rotation" in classical mechanics is absolute in a way translation is not.

  Your intuition that Newton might be "smuggling" absolute space into his definitions is a criticism that has been leveled by some of the greatest minds in the history of science (Leibniz, Mach, Einstein). However, to understand whether Newton is begging the question *in this specific passage*, we need to distinguish between an **operational definition** and an **ontological conclusion**.

  Here is the breakdown of the physics, the logic, and the philosophical weight of the Two Globes argument compared to the Bucket.

  ### 1. Is he smuggling in "Leading" and "Following"?

  Your suspicion is that to call a face "leading" or "following" presupposes a background against which motion is measured. If the universe is empty, what defines the vector?

  **The Physics of the Argument:**
  Newton is not claiming he can *see* which face is leading. He is claiming he can *deduce* it dynamically.
  1.  **State 1:** Measure tension $T_0$. This gives you $|\vec{\omega}|$ (magnitude) via $T = m \omega^2 r$.
  2.  **Intervention:** Apply a known impulse $\Delta \vec{p}$ to a specific material face (let's call it Face A). You know you pushed Face A because you are the agent applying the force; you don't need external space to know which part of the matter you touched.
  3.  **State 2:** Measure new tension $T_1$.
  4.  **Inference:**
      *   If $T_1 > T_0$, then $|\vec{\omega}|$ increased. Therefore, your force was in the direction of motion. Face A is the **trailing** face.
      *   If $T_1 < T_0$, then $|\vec{\omega}|$ decreased. Therefore, your force opposed motion. Face A is the **leading** face.

  **The Verdict on Circularity:**
  Logically, this is **not circular**. He is not presupposing the direction of motion to interpret the tension; he is using the change in tension to *define* the direction of motion relative to the applied force. The terms "leading" and "following" are operational labels assigned *after* the measurement, not prerequisites for it.

  **The Philosophical Leap:**
  The "smuggling" happens one step later. Newton argues that because this tension exists and behaves this way in a *vacuum with no external bodies*, the inertia causing the tension must be a relation between the globes and **Absolute Space**.

  Your physicist's instinct might recoil here. You might say, "The tension is just a property of the globes' state relative to their own center of mass." Newton replies, "But rotation implies acceleration. Acceleration requires a reference frame. If there are no other bodies, the only reference frame left is Space itself."

  So, your complaint is fair **ontologically** (does this prove Space exists?), but it is unfair **operationally** (can he distinguish the faces without cheating?). He can distinguish the faces without cheating; he just needs Absolute Space to explain *why* the tension is there at all.

  ### 2. Does the Globes case do work the Bucket didn't?

  Yes, it does significant argumentative heavy lifting that the Bucket cannot.

  **The Bucket Argument (Kinematic/Phenomenological):**
  *   **Setup:** Water in a spinning bucket.
  *   **Observation:** The water surface becomes concave.
  *   **Ambiguity:** The bucket experiment relies on gravity to define the "axis" (vertical) and the "surface" (perpendicular to gravity). A relationist (like Leibniz) could argue that the water is curving relative to the Earth or the fixed stars, even if the bucket is the only thing spinning locally. It is hard to fully isolate the system from the Earth's gravitational field in a thought experiment without it feeling artificial.

  **The Globes Argument (Dynamic/Structural):**
  *   **Setup:** Two masses on a cord in deep space.
  *   **Observation:** Tension in the cord.
  *   **Advantage:** This removes gravity entirely. It removes the "axis" provided by the Earth. It isolates **inertia** as the sole source of the effect.
  *   **The "Direction" Proof:** The Bucket shows rotation exists (magnitude), but it doesn't easily show you can determine the *direction* (clockwise vs. counter-clockwise) without looking at the stars. The Globes argument explicitly demonstrates how to determine the **vector** nature of the rotation ($\vec{\omega}$) purely through internal stress and applied force.

  For a mathematician or physicist reading the *Principia*, the Globes argument is stronger because it relies on the Second Law (Force $\to$ Acceleration $\to$ Stress) rather than the shape of a fluid surface. It treats rotation as a dynamical state detectable by local measurement.

  ### 3. Why you feel stuck (The Relationist Counter-Attack)

  You are feeling stuck because your intuition aligns with **Ernst Mach**, who critiqued this exact passage 200 years later.

  Mach argued that Newton is indeed begging the question, but not linguistically—metaphysically. Mach's Principle suggests that inertia is not a relation between a body and Absolute Space, but a relation between a body and the **mass distribution of the rest of the universe**.

  *   **Newton's View:** If you remove all the stars, the globes still have inertia. The tension remains. Therefore, Space is a "thing."
  *   **Mach's View:** If you remove all the stars, the concept of rotation becomes meaningless. There would be no tension in the cord because there is no background mass to define inertia against.

  Since you are a condensed matter physicist, think of it like this:
  *   **Newton:** Inertia is like an intrinsic property of the electron (mass). It's there regardless of the lattice.
  *   **Mach/Relationism:** Inertia is like an effective mass in a crystal. It arises from the interaction of the particle with the surrounding medium (the rest of the universe). If you remove the lattice, the effective mass concept dissolves.

  General Relativity ultimately sided partially with Mach (inertial frames are determined by the metric field, which is determined by mass-energy), but kept a version of Newton's absolute structure (the metric field exists even in a vacuum, e.g., Minkowski space). So, even in GR, a rotating universe is distinguishable from a non-rotating one, supporting Newton's intuition that rotation is "absolute" in a way translation is not, even if "Absolute Space" isn't the right noun for it.

  ### Summary for your reading

  1.  **Is it circular?** No, not logically. He defines "leading/trailing" operationally via the tension change. He does not need to assume the direction to measure it.
  2.  **Does it prove Absolute Space?** Only if you accept his premise that inertia cannot be a purely relational property between bodies. Your skepticism here is historically validated (Leibniz, Mach, Einstein).
  3.  **Why the Globes?** It generalizes the Bucket. It removes gravity, isolates inertia, and proves that the *direction* of rotation is locally detectable, not just the magnitude.

  **Advice for moving forward:**
  Don't let this passage stop you. Newton is setting up the "stage" (Absolute Space and Time) on which his laws will act. He knows it's metaphysically vulnerable, which is why he offers *two* examples (Bucket and Globes) to triangulate the point.

  As you read further into the *Principia*, notice that Newton rarely uses Absolute Space for calculations. He almost always works in relative frames and corrects for them. The Scholium is a philosophical foundation, but the physics is robust regardless of whether you believe in Absolute Space or the Metric Field. You are reading it exactly as a physicist should: testing the boundary conditions of the model. Keep that skepticism; it's the same skepticism that led from Newton to Einstein.
