      *   *Clarification on "Leading/Following":* Newton isn't saying "I see it moving left." He's saying "I apply force to the side I call 'A'. Tension rises. Therefore 'A' was trailing." The definition is posterior to the measurement. That defeats the circularity charge *logically*, even if the *ontological* conclusion (Absolute Space) is debatable.
      *   *Physicist-to-Physicist:* Use terms like "operational definition," "invariant," "inertial forces," "Mach's Principle."

  7.  **Final Polish:**
