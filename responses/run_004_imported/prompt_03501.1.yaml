answer: |-
  **Setting:** *The green room of a conference center in Geneva. The muffled sound of the audience dispersing filters through the wall. Two name badges sit on the table: **ELENA VANCE** (Professor of International Law & Ethics) and **DAVID CHEN** (Professor of Moral Philosophy). A half-empty carafe of coffee and two plastic cups sit between them. The panel topic was "Algorithmic Accountability in Lethal Autonomous Systems."*

  **David:** (Loosening his tie) You were generous with the question about the drone operator. The one who followed protocol but struck a school because the intelligence was flawed. You called it a "tragic error within the bounds of professional conduct."

  **Elena:** Because it was. He didn't violate *jus in bello*. He didn't target civilians intentionally. He operated within the convention.

  **David:** But the intelligence was flawed because the war itself was aggressive. Unjust. If the war is a crime, the bullets fired in its service are tainted. That operator is morally analogous to the conscript we spent the last hour dancing around. The young man conscripted by an aggressor state, ignorant of the geopolitical lies, who shoots a defender of the victim state.

  **Elena:** And my position hasn't changed, David. That conscript is a moral equal to the defender. He has a license to kill.

  **David:** (Leaning forward) He doesn't. That's the crux of it. If I attack you in the street because I've been non-culpably misled into thinking you're a threat, I am *excused* for the attack. I am not blameworthy. But I am not *permitted* to attack you. I lack the right. If you kill me in self-defense, you do no wrong. If I kill you, I do wrong, even if I'm not punished for it. Why is war different?

  **Elena:** Because war isn't a street fight. It's a collective activity mediated by the state. When that conscript puts on the uniform, he enters a distinct moral relationship. He surrenders his right to judge the *jus ad bellum* to the sovereign. In exchange, the international community grants him immunity for acts of war, provided he follows the rules. That's Walzer's bargain. It's not about metaphysical truth; it's about containing violence.

  **David:** It's a convenient fiction. You're saying that because the state says "go," the moral reality of killing an innocent person changes. But the defender—the just combatant—he hasn't done anything to make himself liable to be killed. He's defending his home. Why does the conscript's ignorance grant him a right to extinguish a life that has done no wrong?

  **Elena:** It's not about granting a right to extinguish. It's about recognizing that in the fog of war, we cannot demand soldiers be moral philosophers. If we adopt your revisionist view, we tell that conscript: "You are objectively a murderer, even if you couldn't know it." What is the practical outcome of that?

  **David:** The truth.

  **Elena:** The collapse of restraint! If the unjust combatant knows he is already a "murderer" in the eyes of moral law, regardless of how he fights, why should he bother following the rules of engagement? Why not target civilians if the strategic advantage is there? He's already guilty. Your view strips the unjust side of any incentive to fight cleanly. The "Moral Equality of Combatants" is a regulatory convention. It keeps the horror within bounds.

  **David:** I'm not suggesting we prosecute every conscript. I'm distinguishing between *liability* and *blame*. McMahan's point is precisely this: The conscript is not blameworthy. He is excused. But he is still liable to defensive harm. The just combatant is permitted to kill him because the conscript poses an unjust threat. But the conscript is *not* permitted to kill the just combatant.

  **Elena:** So you have a one-sided permission structure.

  **David:** Morality *is* one-sided in cases of self-defense. If a sleepwalker comes at me with a knife, I can stop him. He cannot kill me. He's not evil, he's sleepwalking. But the moral permission to kill lies with me, the defender, not him, the threat.

  **Elena:** But in war, both sides *think* they are the defender. That's the epistemic problem. If we enshrine your revisionism into the laws of war, every soldier has to make a *jus ad bellum* calculation before pulling the trigger. "Is my cause truly just? Am I sure enough to kill this person?"

  **David:** They do that anyway. Conscientious objectors do it.

  **Elena:** A few do. Most cannot. And if we tell them they must, we paralyze the mechanism that keeps war from becoming total slaughter. The convention works *because* it artificially separates the justice of the cause from the justice of the conduct. It allows soldiers to look each other in the eye as professionals, not as judges of ultimate truth.

  **David:** Professionals? Elena, we're talking about killing human beings. Not a sport. If the cause is unjust, the killing is wrongful. Hiding behind "professional conduct" doesn't wash the blood off. You're prioritizing the stability of the convention over the moral status of the victim. The just combatant who dies at the hands of that conscript... his death is a wrong. Your theory treats it as a regrettable accident of the system.

  **Elena:** I treat it as a tragedy inherent to a system of sovereign states. I am not saying the death isn't a loss. I am saying that holding the individual soldier responsible for the state's aggression is a category error. It's like blaming the hammer for the assault.

  **David:** The hammer doesn't have agency. The soldier does.

  **Elena:** Limited agency. Coerced agency.

  **David:** Even if it's coerced, it's not symmetrical. That's the point. The defender is protecting rights; the aggressor is violating them. To say they are "moral equals" is to say that rights protection and rights violation are morally equivalent activities. That's incoherent.

  **Elena:** It's not that the *activities* are equivalent. It's that the *combatants* share a common status. They are both instruments of a political will they do not control. If you deny equality, you create a class of "criminal combatants." History shows us what happens then. Show trials. Summary executions. "War crimes" becomes whatever the winner decides the loser's cause was.

  **David:** So we lie to protect the losers?

  **Elena:** We create a firewall to protect the future. If the unjust soldier knows he will be treated as a criminal simply for fighting, he fights to the death. No surrender. No POW status. The war becomes more brutal. Is your moral clarity worth the extra body count?

  **David:** (Pauses, looking at his coffee) That's the utilitarian trap, Elena. You're arguing that a falsehood produces better consequences.

  **Elena:** I'm arguing that morality in war isn't just about individual transactions. It's about the institution. The convention *is* the morality of the institution.

  **David:** But the institution is built on a lie. And now we're introducing autonomous systems into this mix. (Gestures to the empty stage) If we program an AI with your Walzerian logic, we are coding it to treat unjust threats as morally equivalent to just defenders. We are hard-coding the fiction.

  **Elena:** We are coding it to follow International Humanitarian Law. Which is based on the convention.

  **David:** And if the law is morally flawed? If the law says a conscript can kill a defender, but moral truth says he cannot... the code will execute the flaw. The engineer who writes that targeting algorithm... do they bear responsibility? Under your view, no. They followed the convention. Under my view, they are complicit in an unjust killing.

  **Elena:** (Sighs, rubbing her temples) You think that unsettles the engineer? Try living with the other side. I have spoken to veterans who followed every rule, who fought in wars later deemed questionable, who carry the weight of having been "wrong" in your sense. They feel like murderers because philosophers told them the cause was unjust. Your revisionism doesn't just punish the aggressor; it haunts the soldier who had no choice.

  **David:** Better to haunt them with the truth than lull them with a fiction that their killing was "permitted." It denies the victim's worth.

  **Elena:** And your truth denies the soldier's humanity. It demands a moral omniscience no human in a trench possesses.

  **David:** (Stands up, gathering his papers) We're at an impasse. You prioritize the containment of violence through shared rules. I prioritize the moral asymmetry of the act itself.

  **Elena:** (Also standing) And until we agree on whether war is a duel between states or a mass of individual self-defense encounters, we will stay there.

  **David:** One last thing. The conscript. If he survives the war, and learns the truth—that his cause was unjust, that the man he killed was defending his home... what do you tell him he did?

  **Elena:** I tell him he served. And I tell him to work for a peace where no one has to make that calculation.

  **David:** And I tell him he killed a man he shouldn't have. And that he owes a debt to the memory of the victim that "following orders" cannot erase.

  **Elena:** That debt might break him.

  **David:** The truth often does.

  *(They stand in silence for a moment, the hum of the ventilation system filling the gap between them. Elena picks up her name badge, turning it over in her hand.)*

  **Elena:** Come on. There's a reception downstairs. The engineers are there. The ones actually building the systems that will have to decide which of us is right.

  **David:** (Nods grimly) God help them.

  **Elena:** Indeed.

  *(They exit the room together, leaving the coffee unfinished.)*
