answer: |-
  Your intuition is spot on. Your friend is presenting a specific philosophical stance as if it were an empirical fact. While his argument is a common one among AI researchers and physicalists, it is absolutely **not** "settled computer science."

  He is smuggling in at least three massive assumptions that bridge the gap between "laws of physics" and "AGI is imminent." Here is where the argument breaks down.

  ### 1. The "Physical Church-Turing Thesis" Gap
  Your friend cites the Church-Turing Thesis (CTT). The standard CTT is a mathematical claim: *Any function that can be effectively calculated by a human following an algorithm can be computed by a Turing Machine.*

  However, your friend is relying on the **Physical Church-Turing Thesis**. This is the stronger claim that *any physical process in the universe can be simulated by a Turing Machine.*

  **The Problem:** This is not proven.
  *   **Analog vs. Digital:** The brain operates with neurotransmitters, electrical potentials, and hormonal gradients. These are continuous, analog processes. While you can approximate analog systems digitally, there is debate over whether a discrete digital computer can perfectly simulate a continuous physical system without losing essential properties (especially if chaos theory or quantum effects play a non-trivial role in cognition).
  *   **Hypercomputation:** Some theorists argue that physical systems might exist that can compute things a Turing Machine cannot (though this is fringe, it is not "settled").

  **The Smuggle:** He is assuming the brain is *computable* in the strict computer science sense. It might be, but that is a hypothesis, not a law of physics.

  ### 2. The Simulation vs. Instantiation Gap
  This is the biggest philosophical leap. Your friend argues that if you simulate a brain, you get thoughts. This is the doctrine of **Computational Functionalism**.

  **The Problem:** Simulation is not duplication.
  *   **The Weather Analogy:** If I write a perfect computer simulation of a hurricane, the computer does not get wet. The pressure inside the CPU does not drop. I have simulated the *information* of the storm, but I have not instantiated the *physics* of the storm.
  *   **The Chinese Room:** Philosopher John Searle argued that a system could manipulate symbols (simulate understanding) without actually understanding anything. If the brain's "thoughts" rely on biological causality (specific interactions of proteins and ions) rather than just information processing, a digital simulation might produce a "philosophical zombie"—something that acts like it has a mind but has no internal experience.

  **The Smuggle:** He is assuming that **substrate independence** is true (i.e., that it doesn't matter *what* is thinking, only *how* it processes information). This is a metaphysical belief, not a scientific fact.

  ### 3. The "In Principle" vs. "Right Around the Corner" Gap
  Even if we grant him the first two points (that the brain is computable and simulation equals instantiation), his timeline claim is a non-sequitur.

  **The Problem:** Complexity bounds.
  *   **Computational Cost:** Simulating a brain at the molecular level might require a computer the size of the galaxy, or more energy than exists on Earth. Just because something is *possible in principle* does not mean it is *feasible in engineering*.
  *   **Understanding vs. Mimicry:** We currently build AI using neural networks that are inspired by brains but do not simulate them. We don't actually know how the brain codes information. To simulate it, we need a "source code" for the brain, which we do not have. We might be able to build AGI via a different path, but simulating a biological brain specifically is a vastly harder problem than he implies.

  **The Smuggle:** He is conflating **theoretical possibility** with **engineering proximity**. Saying "flight is possible because birds exist" is different from saying "we will build a mechanical bird next year."

  ### The Verdict
  Your friend is arguing for **Strong AI** based on **Computational Materialism**. While this is the dominant working assumption in modern AI research, it is still a **philosophical framework**, not a proven theorem.

  *   **Is he right that it's possible?** Maybe. Many smart people think so.
  *   **Is he right that it's settled?** No. It is one of the biggest open questions in philosophy of mind and cognitive science.
  *   **Is he right that it's imminent?** Definitely not settled. That is pure speculation.

  You can tell him: *"You're treating a metaphysical assumption (that the mind is nothing but software) as if it's a proven law of physics. The Church-Turing thesis applies to math, not necessarily to biology, and simulating a storm doesn't make the computer wet. It's not settled science; it's a bet."*
