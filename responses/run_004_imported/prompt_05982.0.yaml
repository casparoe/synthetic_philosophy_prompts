      *   *Synthesis:* Bichat would likely argue that *Vie animale* is the seat of the "individual." Once that is gone, the *person* is dead. However, he would insist that the *tissues* remain alive. Therefore, "brain death" is the death of the *individual*, but "circulatory death" is the death of the *organism*. The confusion lies in conflating the two.

