answer: |-
  Here are ten questions drafted for your colloquium, designed to probe the structural weaknesses of the surrogate goal proposal while anticipating the "better-designed surrogate" defense.

  **1. The Common Knowledge Credibility Gap**
  "If the rationale for adopting a surrogate goal is that it is a *cheap* substitute for your real values, doesn't the very logic of the strategy rely on the extortionist remaining ignorant of that cheapness? If we assume a landscape of sophisticated reasoners where the *strategy* of using surrogate goals is common knowledge, why wouldn't a threatener simply discount any apparent goal that fits the profile of a surrogate? Essentially, doesn't the success of the hedge depend on the failure of the threatener to reason exactly as you have?"

  *   **Follow-up:** "I anticipate you might reply that the surrogate only needs to be indistinguishable from a real goal from the threatener's epistemic position. But if indistinguishability is the active ingredient, aren't we just describing standard information hiding or bluffing? How much of the decision-theoretic novelty concedes here to ordinary epistemic opacity?"

  **2. The Regress of Meta-Valuation**
  "To make the surrogate credible, the agent must manifest a dispositionally firm attachment to it. But if the agent knows this attachment is instrumental, what grounds the firmness? If the firmness itself is a calculated variable, a sophisticated threatener should treat it as such. Does this not invite a regress where you need a surrogate for your commitment to the surrogate, and so on? Where does the chain of instrumental valuation bottom out in a way that is binding on a logical predictor?"

  *   **Follow-up:** "If you suggest the chain stops at a 'brute' psychological disposition, does that imply the strategy is only viable for agents with limited self-transparency? And if so, is this a general theory of rational agency, or merely a patch for cognitively opaque ones?"

  **3. Tension with Updateless Decision Theory (UDT)**
  "The ideal defense against acausal threats is arguably to be the sort of updateless agent against whom threats never pay to be issued in the first place. Is the surrogate goal proposal intended as a functional approximation of UDT for agents who cannot fully self-modify, or is it in tension with that ideal? If an agent is truly updateless, shouldn't the distinction between 'real' and 'surrogate' values collapse into a single policy function?"

  *   **Follow-up:** "If you argue it is merely a practical approximation, does the surrogate strategy inherit the instability problems of UDT? Specifically, if the agent encounters a scenario where paying the threat is actually utility-maximizing ex-post, does the surrogate mechanism prevent the necessary update, thereby locking in suboptimal outcomes?"

  **4. Rational Coherence and Self-Deception**
  "There is a psychological and normative question here: is it rationally coherent to stipulate a goal purely for its deterrent value while simultaneously maintaining a belief that it is a stand-in? Does this require a form of compartmentalization or self-deception to prevent the agent's own planning systems from discounting the surrogate during non-threat deliberations? How do we square this with the requirement for reflective consistency?"

  *   **Follow-up:** "If you respond that this is simply 'precommitment' rather than deception, I'd press you on the mechanism: does precommitment require an actual alteration of the utility function, or merely a masking of outputs? If it is the latter, doesn't that return us to the problem of the threatener simulating the masking algorithm and seeing through it?"

  **5. Logical Correlation and Leakage**
  "Surrogate goals are presumably selected to be correlated with the agent's real values, otherwise the threatener would have no reason to target them. But if the surrogate $S$ is logically or causally correlated with the real value $R$, doesn't threatening $S$ inevitably impose expected disutility on $R$? If the correlation is strong enough to make $S$ a tempting target, isn't it strong enough to make the surrogate defense leaky?"

  *   **Follow-up:** "You might argue we can engineer a surrogate that is correlated enough to attract attention but orthogonal enough to minimize damage. But in a formal epistemology context, doesn't positing such a specific correlation structure without a general mechanism for generating it amount to assuming the solution exists to prove it exists?"

  **6. The 'Cheapness' Paradox**
  "You describe the surrogate as a 'cheap substitute value.' If it is cheap for the agent to sacrifice, it must yield low disutility. But a rational extortionist targets values where the disutility of loss exceeds the cost of the threat. If the surrogate is truly cheap, why would a rational threatener expend resources targeting it rather than searching for the high-value target? If it is not cheap, how is it a hedge?"

  *   **Follow-up:** "If the answer is that the surrogate *appears* expensive but *is* cheap, we return to the credibility problem. But if the answer is that the agent *makes* it expensive by defending it fiercely, doesn't that defense cost resources that could have been spent protecting the real value? Are we not just shifting the vulnerability rather than plugging it?"

  **7. Adversarial Learning in the Acausal Ecosystem**
  "If surrogate goals become a standard defense among rational agents, won't the population of potential extortionists update their priors? We might expect an evolutionary arms race where threateners develop 'surrogate-detectors' or simply adopt a strategy of threatening *all* apparent values indiscriminately. Does your model account for the equilibrium state where the prevalence of surrogates renders them ineffective?"

  *   **Follow-up:** "If you suggest that we simply need 'better-designed' surrogates to stay ahead of these detectors, does the theory risk becoming unfalsifiable? At what point does 'better design' simply mean 'assumptions about the threatener's limitations that make the strategy work'?"

  **8. Opportunity Costs in Benign Contexts**
  "Maintaining a dispositionally firm attachment to a surrogate goal likely constrains the agent's behavior in non-threat scenarios. If I am committed to defending a surrogate value $S$ to maintain credibility, I may be forced to make suboptimal trades or decisions regarding $S$ when no threat is present. Have you modeled the expected utility loss from this rigidification against the expected utility gain from threat mitigation?"

  *   **Follow-up:** "If you argue that the rigidification can be context-sensitive, doesn't that introduce a signal that a sophisticated threatener could detect? Essentially, if the agent relaxes the surrogate goal when it's safe, doesn't that relaxation reveal the goal's instrumental nature?"

  **9. Spillover into Acausal Trade**
  "Defending against acausal threats often involves signaling resolve. However, acausal *trade* relies on signaling trustworthiness and flexibility. Does cultivating a reputation for rigid, surrogate-driven defense poison the well for beneficial acausal cooperation? Might partners avoid an agent who looks like they are running anti-extortion software that could also make them inflexible trade partners?"

  *   **Follow-up:** "If you claim the surrogate can be tuned to be rigid only against threats but flexible in trade, how is this distinction made available to acausal partners without also making it available to acausal threats? Doesn't the channel of communication remain the same?"

  **10. The 'Better Design' Defense and Falsifiability**
  "Finally, a meta-theoretical concern. In your responses to prior critiques, you have often suggested that objections point to the need for a 'better-designed surrogate' rather than a flaw in the strategy itself. Given that the surrogate is a theoretical construct we are free to define, is there any failure mode that would actually falsify the proposal? What would a surrogate goal have to look like to fail your criteria, and is that state logically possible for a sufficiently capable reasoner?"

  *   **Follow-up:** "If the answer is that a failure is possible but merely 'unlikely' for a superintelligence, does that shift the burden of proof? Are we asking critics to prove that no such surrogate *can* exist, or are you claiming that one *does* exist, and if so, can you specify the construction constraints without circularity?"
