answer: |-
  This is a superb set of questions. It cuts past the caricature of Hobbes as the mathematically incompetent bully of *De Corpore* and engages with the genuine philosophical architecture supporting his claims. You are right to identify the tension in Hobbes's system: he needs geometry to be **epistemically certain** (because we make it) and **ontologically robust** (because it describes the actual kinematics of bodies). He needs the *verum factum* principle to guarantee truth, but he also needs that truth to map onto the plenum of moving bodies described in his physics.

  Here is a reconstruction of how Hobbes, relying on the arguments in *De Corpore* and *Examinatio et Emendatio Mathematicae Hodiernae*, would likely respond to these three developments, followed by an analysis of whether they vindicate or dismantle his system.

  ---

  ### 1. Non-Euclidean Geometry (Bolyai, Lobachevsky, Riemann)
  **The Development:** The discovery that the parallel postulate is independent of the other axioms, allowing for consistent geometries where space is curved or hyperbolic.

  **Hobbes's Reaction:** **Bad News (mostly), but he would reject the premise.**

  In *De Corpore*, Hobbes defines space not as an abstract container but as the "phantasm of a thing existing without the mind simply" (I.7.1). Geometry, for Hobbes, is the study of the consequences of the *generation* of figures. A line is generated by the motion of a point; a circle by the circumduction of a radius. This generation happens in our imagination, but it mirrors the universal kinematics of the physical plenum.

  *   **The Ontological Threat:** Hobbes believes Euclidean geometry is necessarily true because it describes the only way extension *can* be generated by motion in a homogeneous space. If Non-Euclidean Geometry (NEG) is consistent, it suggests that the structure of space is not a necessary truth of reason but a contingent fact about the physical world. This undermines Hobbes's claim that geometry provides the *a priori* foundation for physics. If geometry is just one of many consistent systems, it loses its status as the "one branch of knowledge" with demonstrative certainty about the world.
  *   **The Constructivist Defense:** However, Hobbes would likely attack the *status* of NEG. For Hobbes, a geometric proposition is only meaningful if we can conceive the generation of the figure. He might argue that NEG is merely "symbolic reckoning" (algebraic manipulation) without a corresponding phantasm. Can you genuinely conceive the motion that generates a hyperbolic triangle in the same immediate way you conceive a Euclidean one? If not, Hobbes would dismiss NEG as a logical game, not "science" (*scientia*), which requires knowledge of causes (generations).
  *   **The Verdict:** NEG pulls apart Hobbes's epistemic and ontological claims. It shows that we can have deductive certainty (the "maker" aspect) without the specific ontology of Euclidean motion. Hobbes would likely deny that NEG practitioners are truly "making" anything in the kinematic sense, but the mere existence of the alternative shatters the necessity he claims for Euclidean space.

  ### 2. Lindemann's Proof (1882)
  **The Development:** The proof that $\pi$ is transcendental, demonstrating the impossibility of squaring the circle using only a finite number of steps with straightedge and compass.

  **Hobbes's Reaction:** **Devastating, but he has a "dignified" (if ultimately failed) loophole.**

  It is crucial to remember that Hobbes's quarrel with Wallis was not merely about stubbornness; it was about the **arithmetization of geometry**. Hobbes viewed the injection of algebra into geometry as a corruption. He believed that magnitude is prior to number. To say a circle cannot be squared is, for Hobbes, to say that a number cannot be found to match a magnitude. But since the magnitude *exists* (we can draw the circle), the ratio *must* exist.

  *   **The Loophole:** Hobbes never strictly limited geometry to the Euclidean tools of straightedge and compass. In *De Corpore*, he defines geometric generation by *motion*. He was willing to accept mechanical curves (like the quadratrix) as legitimate geometric objects if they were generated by determinate motion. Lindemann's proof specifically rules out *algebraic* construction (straightedge/compass).
  *   **The Retreat:** A dignified Hobbesian retreat would be to argue that Lindemann proved the limitations of *algebra*, not geometry. Hobbes could maintain that the quadrature is possible via a kinematic construction that transcends the quadratic extensions allowed by Euclidean tools. He would argue that the "impossibility" is an artifact of the symbolic language Wallis and the algebraists use, which fails to capture the continuous nature of motion.
  *   **The Verdict:** While this allows Hobbes to save face regarding the *nature* of geometry, it is ultimately a losing battle. Modern mathematics subsumes kinematic generation under analytic geometry. If the transcendence of $\pi$ holds for all algebraic numbers, and Hobbes's "motion" must be describable to be scientific, he is cornered. However, his insistence that "existence implies constructibility" is a profound philosophical stance, not just a mathematical error. He would likely claim Lindemann confused the *signs* (numbers) with the *things signified* (magnitudes).

  ### 3. Hilbert's Axiomatics ("Tables, Chairs, and Beer Mugs")
  **The Development:** The formalist view that geometric terms are undefined primitives whose meaning is exhausted by their axiomatic relations.

  **Hobbes's Reaction:** **Catastrophic. This is the worst news of all.**

  This strikes at the heart of Hobbes's logic in *De Corpore* Part I ("Computatio Sive Logica"). For Hobbes, reasoning is the computation of the consequences of names. But names must have settled signification grounded in sense experience or defined generation.

  *   **Insignificant Speech:** Hobbes defines "absurdity" or "insignificant speech" as stringing together names that have no conception attached to them (e.g., "a quadrangular circle"). Hilbert's suggestion that "point" and "line" can be replaced by "table" and "chair" would strike Hobbes as the pinnacle of absurdity. If I say "a table lies on a chair," I am making a claim about physical bodies. If I say "a point lies on a line," I am making a claim about the generation of quantity. If the terms are interchangeable, then the proposition has no specific subject matter.
  *   **The Loss of Cause:** Hobbes's certainty comes from knowing the *cause* of the figure (its generation). Hilbert's axioms provide logical consistency but no causal generation. For Hobbes, a system where you don't know what the objects *are* (only how they relate) is not knowledge (*scientia*); it is merely conditional logic ("if this, then that"). It severs the link between the mind's construction and the world's structure.
  *   **The Verdict:** Hilbert vindicates the "maker's knowledge" idea only in a trivial sense (we make the rules of the game), but he destroys the idea that this knowledge tells us anything about bodies or motion. It turns geometry into a branch of logic, whereas Hobbes fought to keep it a branch of physics (kinematics).

  ---

  ### Synthesis: Do They Vindicate or Dismantle Hobbes?

  Your central question is whether these developments vindicate the conventionalist strand of Hobbes's epistemology or pull apart the two things he needed to keep together: **Maker's Knowledge** and **Kinematic Realism**.

  **They pull them apart.**

  1.  **Vindication of Conventionalism:** Hilbert and the Non-Euclideanists show that we *can* have certainty in geometry simply by stipulating rules (axioms). In this narrow sense, they confirm Hobbes's insight that geometry is certain because it is a product of human definition, not empirical discovery. We do not "find" theorems in nature; we construct them.
  2.  **Destruction of Kinematic Realism:** However, they achieve this certainty precisely by *abandoning* Hobbes's requirement that the definitions correspond to actual motions of bodies.
      *   **Non-Euclidean Geometry** shows that the "maker" can make systems that do not map onto the physical space Hobbes describes.
      *   **Hilbert** shows that the "maker" need not know what they are making at all, only how the pieces fit.

  **The Consequence for Hobbes's System:**
  Hobbes needed geometry to be the "bridge science." It had to be certain (like logic) but about bodies (like physics), so that it could ground his civil philosophy (which is also about made bodies, i.e., the Commonwealth).
  *   If geometry is merely axiomatic (Hilbert), it loses its grip on physics. It can no longer guarantee that the laws of motion derived in *De Corpore* are necessary.
  *   If geometry is merely one of many consistent systems (NEG), it loses its unique status as *the* science of space.

  **On Lindemann and Dignity:**
  Is there a dignified retreat on the circle? Yes, but it requires doubling down on his metaphysics of number. Hobbes argues in *De Corpore* that number is an accident of bodies, not a separate entity. If $\pi$ is transcendental, it means it cannot be expressed as a root of a polynomial. Hobbes would argue this is a limitation of *number*, not magnitude. The magnitude (the area of the circle) is commensurable with the square because both are generated by motion. The failure to express this in algebraic symbols is a failure of the symbols, not the geometry.
  This is not a "crank" position; it is a coherent (if outdated) philosophical commitment to the priority of the continuous over the discrete. He retreats not by admitting error, but by rejecting the framework (analytic geometry) in which the error is defined.

  ### Conclusion
  The post-Hobbesian history of mathematics vindicates Hobbes's **epistemological intuition** (mathematics is certain because it is constructive/conventional) but refutes his **ontological commitment** (that this construction must mirror universal kinematics).

  For Hobbes, this would be unacceptable. He cannot accept a geometry that is certain but "about nothing" (Hilbert) or "about the wrong space" (Non-Euclidean). He would likely view these developments as the triumph of "University emptiness"—the separation of words from things. The tragedy of Hobbes's philosophy of mathematics is that he was right about why math is certain (we make it), but wrong about what that implies about the world (that it must be Euclidean kinematics). The later developments you cite prove that we can make many worlds, not just the one Hobbes inhabited.
