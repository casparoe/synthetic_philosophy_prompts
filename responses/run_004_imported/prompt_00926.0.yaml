      *(Self-Correction during drafting)*: I need to be careful not to say Hobbes would just be "wrong." I need to explain *why* based on his principles. For example, on Hilbert: Hobbes wouldn't just say "that's weird." He would say "that is not reasoning, that is reckoning with words without marks."
      On Lindemann: Hobbes actually did accept mechanical curves. He might argue Lindemann only proved straightedge/compass impossibility, not kinematic impossibility. But since modern math equates the two, he's still stuck. I should highlight this nuance.

      *(Refining the NEC point)*: Does NEC support conventionalism? Yes. Does it support Hobbes? Only if Hobbes is a pure conventionalist. But he isn't. He thinks Euclidean space is *the* structure of the phantasm of space. So NEC shows his psychology/physics was contingent, not necessary.

      *(Refining the Hilbert point)*: Hilbert makes geometry a branch of logic. Hobbes makes it a branch of physics (kinematics). This is the core conflict.

