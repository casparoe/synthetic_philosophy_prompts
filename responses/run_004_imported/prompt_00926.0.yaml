      *   *Hobbes's Reaction:*
          *   *The "Crank" Defense:* Hobbes often argued against the *methods* of the algebraists (Wallis). He thought the restriction to straightedge and compass was arbitrary. He used mechanical curves (like the quadratrix).
          *   *Dignified Retreat?* Hobbes defines geometry by *motion*. If a curve can be generated by motion, it is geometric. Lindemann proves straightedge/compass limits. Hobbes never strictly limited himself to Euclidean tools in practice (he used mechanical aids).
          *   *The Problem:* Lindemann shows $\pi$ cannot be constructed via algebraic means rooted in quadratic extensions. Hobbes's ontology links number to magnitude. If the magnitude exists (the circle), the number should be reachable.
          *   *Verdict:* Devastating, but Hobbes has a loophole. He rejects the algebraicization of geometry. He might say Lindemann proved a limitation of *algebra*, not geometry proper (construed as universal kinematics). However, since modern math subsumes his "motion" under analytic geometry, he loses. But internally? He can claim the tools were ill-defined.
          *   *Refinement:* Hobbes thinks the circle *is* the quadrature. He thinks the area *is* the square. Lindemann says they are incommensurable in that specific way. Hobbes would likely attack the definition of "number" or "construction."

