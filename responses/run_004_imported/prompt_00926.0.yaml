      *   **Topic:** Hobbes's philosophy of geometry, specifically how it would react to three posthumous developments: Non-Euclidean Geometry (Bolyai, Lobachevsky, Riemann), Lindemann's proof of $\pi$'s transcendence, and Hilbert's axiomatic formalism.
