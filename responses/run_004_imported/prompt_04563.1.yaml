answer: |-
  You have hit on one of the most profound tensions in economics and decision theory. Your intuition is correct: Good's Theorem is mathematically sound, but its assumptions are much narrower than they appear.

  The phenomenon you are describing is known as the **Hirshleifer Effect** (named after economist Jack Hirshleifer, 1971). It demonstrates that while information is always valuable to an *isolated* decision-maker, it can be destructive in a *multi-agent* setting where the value of your decision depends on the decisions of others (specifically in risk-sharing markets).

  Here is the specific, worked-out example you asked for, followed by the exact step in Good's proof that fails.

  ### The Example: The Insurance Market

  **The Setup**
  Imagine two agents, **Alice** and **Bob**. They are both rational Bayesian expected-utility maximizers with identical risk-averse utility functions: $U(w) = \sqrt{w}$, where $w$ is wealth.

  There is a single binary state of the world, $\omega \in \{\text{Rain}, \text{Shine}\}$, occurring with prior probability $P(\text{Rain}) = 0.5$ and $P(\text{Shine}) = 0.5$.

  Their initial endowments (wealth before any trading) are perfectly negatively correlated:
  *   **Alice:** Gets \$100 if Rain, \$0 if Shine.
  *   **Bob:** Gets \$0 if Rain, \$100 if Shine.

  **Scenario A: No Information (Ignorance)**
  Before the weather is revealed, Alice and Bob meet. They do not know the weather.
  *   Alice's expected wealth: \$50. But she faces risk (100 or 0). Her expected utility is $0.5\sqrt{100} + 0.5\sqrt{0} = 5$.
  *   Bob's expected utility is also 5.

  Because they are risk-averse, they want to smooth consumption. Since their risks are perfectly opposite, they can fully insure each other. They agree to a contract: "Regardless of the weather, we pool our money (\$100 total) and split it evenly."
  *   **Result:** Each gets \$50 for sure.
  *   **Utility:** $\sqrt{50} \approx \mathbf{7.07}$.
  *   Both are better off trading than staying with their endowment ($7.07 > 5$).

  **Scenario B: Free Public Information**
  Now, suppose a perfectly accurate weather forecast becomes publicly available *before* they have a chance to trade. The information is free.

  *   **Case 1: Forecast says "Rain" (50% chance)**
      *   Everyone knows Alice will have \$100 and Bob will have \$0.
      *   Bob has nothing to offer Alice. Alice has no incentive to give Bob money.
      *   **Trade collapses.** Alice keeps \$100, Bob keeps \$0.
      *   Alice's Utility: $\sqrt{100} = 10$.
      *   Bob's Utility: $\sqrt{0} = 0$.

  *   **Case 2: Forecast says "Shine" (50% chance)**
      *   Everyone knows Alice will have \$0 and Bob will have \$100.
      *   Alice has nothing to offer Bob.
      *   **Trade collapses.** Alice keeps \$0, Bob keeps \$100.
      *   Alice's Utility: $0$.
      *   Bob's Utility: $10$.

  **The Expected Utility Calculation**
  Now we calculate the expected utility *before* the forecast is released (ex-ante), assuming they know the forecast *will* be released.

  *   **Alice's Expected Utility:** $0.5 \times 10 (\text{if Rain}) + 0.5 \times 0 (\text{if Shine}) = \mathbf{5}$.
  *   **Bob's Expected Utility:** $0.5 \times 0 (\text{if Rain}) + 0.5 \times 10 (\text{if Shine}) = \mathbf{5}$.

  **The Conclusion**
  *   Expected Utility **Without** Information: **7.07**
  *   Expected Utility **With** (Free) Information: **5**

  Both agents, reasoning perfectly as rational Bayesians, would prefer to burn the forecast before reading it. The information destroyed the risk-sharing opportunity.

  ***

  ### Where Good's Proof Breaks

  You sketched the proof intuition: *Deciding now is picking the best option on average. Waiting is taking the average of the best option for each thing you could learn. The second number can never be smaller.*

  Mathematically, Good's Theorem relies on this inequality:
  $$ \max_{a \in A} \mathbb{E}[U(a, \omega)] \le \mathbb{E}_{e} \left[ \max_{a \in A} \mathbb{E}[U(a, \omega) \mid e] \right] $$

  Where:
  *   $a$ is an action.
  *   $A$ is the **set of available actions**.
  *   $\omega$ is the state of the world.
  *   $e$ is the evidence (signal).

  The theorem holds **if and only if** the set of available actions $A$ and the payoff function $U$ remain **invariant** regardless of the evidence $e$ received. It assumes that seeing the evidence never takes away your ability to take the action you would have taken without the evidence.

  **In the insurance example, this assumption is violated.**

  1.  **Without Information:** The set of feasible actions $A_{\text{no-info}}$ includes "Sign Insurance Contract." This action is feasible because the counterparty (Bob) is uncertain and willing to trade.
  2.  **With Information:** The set of feasible actions $A_{\text{info}}$ *does not* include "Sign Insurance Contract." Once the signal $e$ is observed (e.g., "Rain"), the counterparty updates their belief to certainty. At that point, the action "Sign Insurance Contract" is no longer mutually acceptable; it is removed from the feasible set $A$.

  So, the math actually looks like this:
  $$ \max_{a \in A_{\text{large}}} \mathbb{E}[U] \quad \text{vs} \quad \mathbb{E}_{e} \left[ \max_{a \in A_{\text{small}}(e)} \mathbb{E}[U \mid e] \right] $$

  Because $A_{\text{small}}(e) \subset A_{\text{large}}$, the "Value of Information" inequality no longer holds. You aren't just updating probabilities; you are **shrinking the action space**.

  ### Summary
  Good's Theorem is a theorem of **single-agent decision theory**. It assumes the environment is passive.
  The Hirshleifer Effect is a phenomenon of **game theory / general equilibrium**. It recognizes that in markets, the "environment" includes other agents whose willingness to trade depends on their information.

  When information is public, it can destroy the *mutual ignorance* required for certain beneficial trades (like insurance) to exist. The "step that breaks" is the hidden assumption that **your opportunities for action do not depend on what you know.** In markets, they often do.
