      *   The user's intuition about insurance markets is spot on. This is the **Hirshleifer Effect** (Jack Hirshleifer, 1971).
      *   In multi-agent settings (game theory), information changes not just *your* decision, but *others'* decisions (or the terms of trade).
      *   If information destroys risk-sharing opportunities, the total pie shrinks, even if everyone allocates their slice optimally.
      *   Good's Theorem assumes the payoff function $U(a, \omega)$ is fixed. In game theory/markets, the payoff often depends on the *price* or the *counterparty's willingness to trade*, which depends on *their* information.
      *   So, the step that breaks is the assumption that the utility function/payoff structure is independent of the information distribution among agents. Or, more simply: Good's Theorem is a *single-agent* theorem. It does not hold in *multi-agent strategic* settings (Nash equilibria).

