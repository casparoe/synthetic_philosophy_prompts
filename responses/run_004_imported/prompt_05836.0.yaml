answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the groom's sibling and the family member who decided that three more years of graduate school sounded like a fun way to celebrate a wedding.

  It is fitting that we are here tonight, because my brother and his partner didn't meet over a spilled drink or a dating app. They met in a seminar on Social Choice Theory. Most couples bond over a shared love of movies or hiking; these two bonded over the impossibility of aggregating individual preferences into a consistent social welfare function. Naturally, as the resident economist, I felt pressure to find a theorem romantic enough for the occasion.

  I settled on John Harsanyi's Aggregation Theorem.

  In plain English, Harsanyi showed that if two rational people care about each other's welfare—what we call Pareto indifference—their joint happiness can be represented as a weighted sum of their individual utilities. In other words, the math proves that when you truly look out for one another, your lives become a single equation.

  However, there is a catch. Harsanyi's theorem is notoriously silent on what those weights actually are. It cannot tell you how much weight to give one partner's preference for the thermostat versus the other's preference for the weekend itinerary. This is because, mathematically, each person's utility function is defined only up to a **positive affine transformation**.

  Now, to the family, that sounds like a beautiful promise: that your marriage will be defined by *positive* changes and *transformations* that lift you both up. And to the decision theorists in the room… well, you know that without interpersonal comparability, the weights are fundamentally indeterminate.

  But that indeterminacy is actually the secret to why this works. If the weights were fixed by a theorem, you would be prisoners of a formula. Because they are undefined, you get to negotiate them every single day. You get to decide, moment by moment, whose utility carries more weight, trusting that over a lifetime, the sum will balance out.

  Of course, no theorem can guarantee a happy marriage. Harsanyi's axioms hold in a seminar room, but life is far more stochastic than expected utility theory allows. There will be shocks to the system and information asymmetries that no model can predict. But looking at the two of you, I see that while the math might not offer certainty, it offers a structure: a commitment to make each other better off, even when the variables change.

  So, please raise your glasses. To the bride and groom: May your joint welfare function be concave, your transactions costs be low, and may your love be the one variable that remains exogenous to everything else.

  To the happy couple!
