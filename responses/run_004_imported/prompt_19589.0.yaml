      *   **Move 6 (Marcus):** The "Moral vs. Logical Necessity" Distinction. Worlds are logically possible (no contradiction), but God is morally necessitated to choose the best. Contingency is preserved because God *could* logically choose otherwise, but *wouldn't* morally.
