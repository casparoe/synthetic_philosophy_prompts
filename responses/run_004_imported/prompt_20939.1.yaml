prompt: |-
  So in my philosophy of language seminar we spent like three weeks on Davidson's radical interpretation stuff ('Radical Interpretation,' 'Belief and the Basis of Meaning'), and this week we moved into the later essays where he starts talking about triangulation ('Three Varieties of Knowledge,' 'The Second Person'). A few of us got into an argument after class about what triangulation is actually adding that wasn't already there. Like, the original radical interpretation set-up already has an interpreter and a speaker both reacting to the same environment while the interpreter builds up a Tarski-style truth theory under charity — so isn't that already basically a triangle? My professor said something in passing about triangulation being needed to secure the very possibility of objective content, as opposed to just being one more epistemic constraint that helps narrow down which interpretation of a speaker is correct, but she didnt really unpack it and I didn't want to derail the lecture asking.

  Could you walk me through, fairly intuitively, what specific gap triangulation is supposed to close that charity-based radical interpretation by itself can't? Specifically: why does it supposedly take two creatures responding to each other's reactions to a shared stimulus (rather than just one interpreter figuring out one speaker via charity) to get genuine, determinate "aboutness," rather than just reliable causal responding, like a thermostat reacting to temperature? I sort of get that this connects to Davidson's claim that a solitary creature couldn't really have thoughts at all, but I'm losing the thread of how you actually get from "two creatures triangulating on a common cause" to "therefore intentional content is possible" -- like, which part of the argument is doing the heavy lifting there. Would love something that goes beyond the one-paragraph textbook gloss, if that's possible.
