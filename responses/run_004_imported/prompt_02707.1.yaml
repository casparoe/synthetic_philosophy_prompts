      *   **Problem:** Simpson's Paradox in cohort slicing. Knows mechanics, knows stratification isn't always correct.
      *   **Task:** Rank 5 specific real-world cases based on confidence that the *stratified* (disaggregated) comparison is the correct one to trust (Rank 1 = Most confident stratified is correct, Rank 5 = Least confident stratified is correct / Pooled is better / Contested).
      *   **Cases:**
          1.  1973 UC Berkeley graduate admissions (gender bias).
          2.  Charig et al. 1986 kidney stone treatment (open surgery vs. PCNL).
          3.  2021 Israel COVID-19 vaccine effectiveness (age-stratified vs. pooled).
          4.  Low birth-weight paradox (maternal smoking vs. infant mortality).
          5.  Gender pay gap (occupation-controlled).
      *   **Output Format:** JSON array with `rank`, `case`, and `justification` (1-2 sentences identifying what the adjustment variable does).
      *   **Constraint:** Think silently first.

  2.  **Evaluate Each Case:**

      *   **Case 1: UC Berkeley Admissions (1973)**
          *   *Scenario:* Overall, men had higher admission rates than women. When sliced by department, most departments showed no bias or bias towards women.
          *   *Mechanism:* Women applied to more competitive departments (lower admission rates overall), men applied to less competitive ones.
          *   *Causal Structure:* Gender -> Department Choice -> Admission. Department is a mediator (or collider depending on framing, but usually treated as a confounder in the sense of "difficulty"). Actually, Department is a *mediator* of the effect of Gender on Admission if we consider "choice" part of the process, but for bias detection, we want to know if *within* equal qualifications/choices, there is bias. The standard interpretation (Bickel et al.) is that Department is a confounding variable regarding the *decision process* itself. Wait, is it a confounder or mediator? Gender influences Department choice. Department influences Admission. If we want to measure direct discrimination in the admission *decision*, we must control for Department. If we want to measure systemic barriers preventing women from applying to easy departments, that's different. Usually, in the context of Simpson's Paradox lessons, this is the classic case where **stratification is correct** for assessing bias in the admission *decision*.
          *   *Confidence in Stratified:* High. The pooled data misled because of differing application patterns.

      *   **Case 2: Kidney Stones (Charig et al. 1986)**
          *   *Scenario:* Treatment A (open) vs. Treatment B (PCNL). Overall, B looked better. Stratified by stone size, A was better for small stones and better for large stones.
          *   *Mechanism:* Doctors assigned easier cases (small stones) to the less invasive treatment (B) and harder cases (large stones) to the traditional treatment (A). Stone size is a confounder affecting both treatment assignment and success rate.
          *   *Causal Structure:* Stone Size -> Treatment Choice. Stone Size -> Success. Treatment -> Success. To get the causal effect of Treatment, we must control for Stone Size.
          *   *Confidence in Stratified:* Very High. This is the textbook example of confounding where stratification (or adjustment) recovers the true causal effect. The pooled result was purely due to selection bias.
          *   *Comparison with UC Berkeley:* Both are high confidence. Kidney stones is often cited as the clearer causal case because "stone size" is a clinical characteristic determining success, whereas "department choice" involves human agency that might be part of the systemic bias argument. However, for *treatment efficacy*, stratification is definitely correct. Let's look for nuances. In UC Berkeley, one could argue the pooled number reflects the "experience" of being a female applicant (including systemic steering). In Kidney Stones, we care about the biological efficacy of the tool. So Kidney Stones stratification is arguably *more* definitively the "truth" for efficacy.

      *   **Case 3: Israel COVID-19 Vaccine Effectiveness (2021)**
          *   *Scenario:* Pooled data sometimes showed lower effectiveness or weird trends compared to age-stratified. Older people were vaccinated earlier and have weaker immune systems + higher risk.
          *   *Mechanism:* Age is a strong confounder. Older people = higher risk of infection/severe outcome + vaccinated earlier.
          *   *Causal Structure:* Age -> Vaccination Status (timing). Age -> Infection Risk. To measure vaccine efficacy, must control for Age.
          *   *Confidence in Stratified:* High. Epidemiological standard is to age-adjust. However, there was some controversy about waning immunity vs. variant changes (Delta) coinciding with timing. But regarding Simpson's paradox specifically (age confounding), stratification is the standard correct approach.
          *   *Nuance:* Sometimes "pooled" effectiveness is what matters for population impact, but for biological efficacy, stratified is correct. Given the prompt asks about trusting the stratified comparison vs pooled, stratified is generally preferred for efficacy estimates.

      *   **Case 4: Low Birth-Weight Paradox (Smoking vs. Mortality)**
          *   *Scenario:* Smoking increases mortality overall. But among low birth-weight babies, smokers' babies have *lower* mortality than non-smokers' babies.
          *   *Mechanism:* Collider Bias. Smoking causes low birth weight. Other causes (genetic defects, etc.) also cause low birth weight. Conditioning on Low Birth Weight (a collider) opens a backdoor path. Non-smokers with low birth weight likely have severe genetic defects (since smoking wasn't the cause), leading to higher mortality. Smokers with low birth weight might just have low birth weight due to smoking, which is less lethal than severe defects.
          *   *Causal Structure:* Smoking -> Low Birth Weight <- Other Defects. Low Birth Weight -> Mortality. Other Defects -> Mortality. Conditioning on Low Birth Weight induces correlation between Smoking and Other Defects.
          *   *Confidence in Stratified:* **Low / Wrong**. Stratifying by birth weight is generally considered incorrect here because birth weight is a *mediator* (on the causal path from Smoking to Mortality) and conditioning on it introduces collider bias if there are unmeasured common causes of LBW and Mortality. The pooled estimate (or adjusting for confounders but not the mediator) is closer to the total effect. Stratifying hides the harm of smoking.
          *   *Placement:* This should be at the bottom (Rank 5) because stratification is actually the *mistake* here.

