          *   *Placement:* Somewhere in the middle or low. Definitely higher than Low Birth Weight (where stratification is statistically wrong due to collider bias), but lower than Kidney Stones/UC Berkeley (where stratification reveals the direct mechanism). Actually, in Pay Gap, stratification is often criticized for underestimating the gap. So confidence that stratified is the "truth" is low.

