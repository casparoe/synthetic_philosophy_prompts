          *   *Mechanism:* Occupation is a *mediator*. Gender -> Occupation Choice (due to societal pressure, discrimination, preference) -> Pay.
          *   *Causal Structure:* If we want to measure "equal pay for equal work", we control for occupation. If we want to measure "economic inequality due to gender", we do not control for occupation (because occupational segregation is part of the problem).
