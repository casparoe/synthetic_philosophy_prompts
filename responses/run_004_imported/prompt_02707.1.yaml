prompt: |-
  I'm a software engineer who works with product analytics, and I keep running into Simpson's paradox whenever metrics get sliced by cohort. I understand the basic mechanics of the reversal, but I've realized that stratifying isn't automatically the "correct" move — sometimes the pooled figure is the one you should trust, and sometimes it's genuinely unclear which is. I'd like your judgment on five well-documented real-world cases: (1) the 1973 UC Berkeley graduate admissions gender-bias data; (2) Charig et al.'s 1986 study comparing open surgery and percutaneous nephrolithotomy for kidney stones; (3) age-stratified versus pooled COVID-19 vaccine effectiveness figures from Israel in 2021; (4) the "low birth-weight paradox" linking maternal smoking to infant mortality; and (5) gender pay-gap estimates that shrink once occupation is controlled for. Please rank these from the case where we should be most confident that the stratified (disaggregated) comparison is the one to trust, to the case where we should be least confident of that — either because the pooled comparison is actually more defensible, or because the matter is genuinely contested — and give a one- or two-sentence justification for each placement that identifies what the adjustment variable is actually doing to the relationship between the other two. Please format your answer as a JSON array:

  ```json
  [
    {"rank": 1, "case": "...", "justification": "..."},
    ...
  ]
  ```
reasoning: |-
