  **Move 1 (Marcus): Score 1.** Marcus correctly articulates the core intuition behind Cummins' causal-role account: functions are identified with current contributions to system capacities. However, his "full stop" dismissal of history is theoretically naive; it ignores the normativity problem (distinguishing functions from mere effects) which Elena immediately exploits. He states the view clearly but leaves it undefended against its most famous objection.

  **Move 2 (Elena): Score 2.** Elena deploys the standard and strongest objection to pure causal-role accounts: the problem of overgeneration (the "heart thumping" counterexample). She correctly identifies that without a historical constraint, there is no non-arbitrary way to distinguish a trait's *function* from its incidental *effects*. This is a textbook-accurate representation of the motivation for etiological accounts.

  **Move 3 (Marcus): Score 1.** Marcus raises a genuine difficulty for etiological accounts regarding exaptations (traits co-opted for new uses). He correctly notes that a strict focus on historical origin conflicts with current intuition (feathers for insulation vs. flight). However, he slightly mischaracterizes sophisticated etiological theories (like Neander's), which focus on the *current maintenance* of the trait variant rather than its deep origin, making his claim that the cutoff is merely "stipulative" somewhat overstated, though the line-drawing problem remains a valid critique.

  **Move 4 (Elena): Score 2.** Elena accurately defends the etiological account against the charge of arbitrariness. She correctly distinguishes the source of relativity in both accounts: Cummins' functions are relative to the analyst's "capacity of interest" (interest-relative), whereas etiological functions are relative to factual selective regimes (mind-independent). This captures the primary philosophical advantage claimed by selected-effects theorists.

  **Conclusion:**
  Both students are overlooking the specific mechanism etiological theorists use to resolve the feather case: the distinction between a trait's *origin* and its *current maintenance*. Neander-style accounts handle exaptations by assigning function based on the selective regime that currently maintains the specific trait token, not the regime that originated the trait type. Furthermore, both assume a monistic framework where one theory must win. A fuller account might embrace function pluralism (e.g., Godfrey-Smith), acknowledging that "function" serves different explanatory roles in different contexts—sometimes requiring historical normativity (etiological) and sometimes requiring current systemic analysis (causal-role)—rather than forcing a single definition to cover all biological discourse.
