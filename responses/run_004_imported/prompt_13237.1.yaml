answer: |-
  **MEMORANDUM**

  **TO:** League Team Captains and Membership
  **FROM:** Disciplinary Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Disciplinary Ruling Regarding Hits from Behind (Games of Oct 21)

  **1. INCIDENT SUMMARY**
  During the games played on October 21, two separate incidents occurred involving hits from behind driving players into the boards.
  *   **Incident A (Jake):** Player received a hit from behind. Player remained in the game and finished the night.
  *   **Incident B (Tyler):** Player received a hit from behind. Player landed awkwardly, sustained a broken collarbone, and is out for the season.

  Video review and referee reports confirm that the mechanics, force, and angle of the two hits were virtually identical. Both were deemed illegal checks from behind.

  **2. COMMITTEE FINDINGS & PHILOSOPHY**
  The Committee was divided on how to apply the league rulebook, specifically the clause stating suspensions must *"factor in the severity of the outcome."* We have deliberated extensively on the tension between punishing the *action* versus punishing the *result*.

  **On the Nature of the Act (The "Fairness" Argument)**
  We acknowledge that neither player intended to break a collarbone. In a fast-paced game, players cannot control exactly how an opponent falls. Punishing Tyler significantly more than Jake solely due to luck of the landing sets a dangerous precedent where discipline is random rather than behavioral. If we ignore the similarity of the hits, we risk players feeling the disciplinary system is arbitrary. Therefore, the **baseline suspension** for both players must be identical, reflecting the dangerous decision to hit from behind.

  **On the Severity of the Outcome (The "Consequences" Argument)**
  However, the Committee also recognizes that we cannot ignore the actual harm caused. The opposing view on the Committee—that consequences matter—is valid for two specific reasons that we must honor:
  1.  **Rulebook Compliance:** Our written rules explicitly state outcome severity is a factor. To ignore the injury entirely would be to violate our own agreed-upon standards.
  2.  **League Duty of Care:** Adult rec hockey relies on trust. When a player is injured severely, it impacts their team, their personal life, and the overall safety culture of the league. A suspension is not just punishment; it is an acknowledgment of harm done. To treat a season-ending injury exactly the same as a minor bump minimizes the experience of the injured player and signals that the league does not weigh physical safety heavily enough.

  **3. THE RULING**
  To balance these principles, the Committee is applying a **"Base + Modifier"** model. The *Base* suspension punishes the dangerous act (which was identical). The *Modifier* accounts for the severity of the outcome (as required by the rulebook).

  *   **Jake:** **2-Game Suspension.**
      *   *Reasoning:* This reflects the baseline penalty for a dangerous hit from behind where no significant injury occurred.
  *   **Tyler:** **4-Game Suspension.**
      *   *Reasoning:* This includes the 2-game baseline for the hit, plus a 2-game modifier to account for the severity of the injury. This acknowledges the significant harm caused to another member without making the punishment entirely dependent on luck.

  **4. IMPLEMENTATION**
  *   **Effective Date:** These suspensions are effective immediately.
  *   **Completion:** Both players must sit out their respective number of *league scheduled games*. Pre-season or exhibition games do not count toward the suspension.
  *   **Deadline:** Jake is eligible to return for the games scheduled on [Date, 2 weeks out]. Tyler is eligible to return for the games scheduled on [Date, 4 weeks out].
  *   **Condition of Return:** Both players must acknowledge this ruling in writing before being cleared to return to the ice.

  **5. CLOSING STATEMENT**
  We understand this compromise may not satisfy everyone completely. However, it is the Committee's view that justice in a recreational league requires us to hold players accountable for their choices (the hit) while also holding them accountable for the reality of the game (the injury).

  We want Tyler and Jake back in the league as contributors, but we also need to ensure every player knows that when they choose to make a dangerous play, they are accepting responsibility for whatever happens next, even if it was unintended.

  Play safe.

  **Signed,**
  **The Disciplinary Committee**
