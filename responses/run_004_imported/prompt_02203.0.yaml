          4.  Address the *Aitihya* argument (Why it doesn't save it).
          5.  Address the *Anumana* argument (Why correlation isn't *Vyapti*).
          6.  The "Parrot Test" (Classical Nyaya analogy).
          7.  Conclusion: It's *Śabda-ābhāsa* (semblance of testimony).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, what about the human creators?* Could the LLM be an instrument (*karaṇa*) of the human *apta*s who trained it?
      *   *Nyaya Counter:* The humans didn't intend specific truths for specific queries. The causal chain is too broken. It's like finding a book in the woods. If you don't know the author is an *apta*, you can't claim *śabda pramāṇa*.
      *   *Gangesha's specific contribution:* He refined the definition of *vyāpti*. He would spot the statistical nature of LLMs immediately as lacking *avinābhāva* (inseparability).
      *   *Make sure to mention Tātparya-jñāna:* This is crucial. To understand *śabda*, I must know what the speaker *means*. With an LLM, there is no "meaning" in the intentional sense, only vector space proximity.

