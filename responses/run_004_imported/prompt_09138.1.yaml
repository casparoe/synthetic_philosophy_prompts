prompt: |-
  So last night I had this long, kind of ridiculous argument with my friend Mara over drinks about whether virtue ethics can actually survive the situationist critique from psychology. She's finishing her PhD in social psych and wouldn't let go of the Good Samaritan seminary study (the one where being in a hurry predicted whether people stopped to help way better than religiosity did, even for the guys who were literally on their way to give a talk on the parable) plus the dime-in-the-phone-booth thing, like those two studies just settle it. I kept trying to make the Kamtekar-ish move that trait attributions in virtue ethics are really about a person's evaluative outlook and not a promise of perfect cross-situational consistency, and she kept saying I was just moving the goalposts so Aristotle can't loose. We never resolved anything, obviously, but it got me thinking about my old advisor.

  Which is the actual reason I need help: my PhD advisor, Professor Kessler, is retiring in a few weeks after basically a forty-year career defending character-based ethics, including a real stretch in the early 2000s where she was directly answering Harman and Doris on the fundamental-attribution-error stuff. I got asked to give the toast at her dinner and i'm a little stressed about it, because the room is going to be half philosophy department -- people who will absolutely catch a reference to "local traits" or Milgram and expect it used correctly -- and half her actual family, who have no clue what any of that means and just want to hear something nice about her.

  Can you write me a five-minute toast built around one genuinely good joke connecting the situationist critique to her own career -- something like, forty years of hiring committees, tenure letters, and departmental politics being about as adversarial a "situation" as anyone could design to test whether a person's virtue is real or just untested -- and then actually use that idea to land somewhere warm and true about her, instead of just being a philosophy lecture with a couple of jokes bolted on. It needs to work for both halves of the room at once, not read like two different speeches stapled together.
