answer: |-
  Good evening, everyone. For those who don't know me, I'm one of Professor Kessler's many doctoral students. And for those who *do* know me, yes, I promise to keep this under five minutes so we can get to the part where Professor Kessler tells me exactly what I got wrong.

  Standing here, looking at this room, I realize we have a unique audience. We have half the Philosophy Department, who know exactly what "normative ethics" means, and we have Professor Kessler's family, who know exactly what "normative" means when she comes home after a long day. You are the control group for her sanity.

  I want to talk briefly about character. Recently, I had a debate with a friend about a theory in psychology called "situationism." The basic idea is that who we are isn't really about our inner character or virtues. Instead, it's about the situation we're in. There's a famous study where seminary students—people training to be moral leaders—were less likely to stop and help a stranger if they were told they were running late for a lecture. Another study showed that finding a dime in a phone booth made people more helpful. The argument is that small, external pressures dictate our behavior way more than our internal virtues do.

  Now, if you accept that theory, you have to believe that human character is fragile. That we are all just one bad day, one rushed deadline, or one missing dime away from losing our integrity.

  And that brings me to the joke I've been preparing for forty years.

  If finding a dime makes you helpful, and being in a hurry makes you cruel, then academia must be the ultimate laboratory for the destruction of virtue. Think about the situation we put professors in. We subject them to hiring committees that feel like interrogations. Tenure reviews that can end a career on the opinion of three strangers. Departmental politics that are often described as " vicious" only because the stakes are so low.

  By the logic of the situationist critique, the university should be a factory of broken character. It is an adversarial situation designed to test whether a person's virtue is real or just untested.

  And yet, here we are. Celebrating forty years of Professor Kessler.

  To the philosophers in the room: She didn't just write about virtue ethics; she lived through the Harman-Doris objections without flinching. She proved that character isn't about perfect consistency in a vacuum; it's about an evaluative outlook that holds steady when the pressure rises.

  But to her family, and to anyone who isn't here for the footnotes: What this actually means is much simpler. It means that when the "situation" was stressful, she was calm. When the "situation" was competitive, she was collaborative. When the "situation" demanded she look out for herself, she looked out for us.

  I remember my third year, when my dissertation hit a wall. The "situation" was panic. The "situation" was imposter syndrome. The "situation" was a funding letter that didn't arrive. Professor Kessler didn't react to the pressure; she reacted to me. She offered patience. She offered coffee. She offered the kind of steady, quiet confidence that made me realize the wall was climbable.

  That is the data point that matters. Not the dime in the phone booth, but the hand on the shoulder when the lights go out.

  Professor Kessler, the situationists argue that we are products of our environment. But looking around this room, at the students you've guided, the colleagues you've supported, and the family who loves you, I think the evidence suggests otherwise. You didn't let the situation decide who you were. You decided who *we* were, by showing us who you are.

  So, if everyone could please raise a glass.

  To Professor Kessler. For proving that while situations may test us, character defines us. And for forty years of showing us exactly what that looks like.

  To Professor Kessler.
