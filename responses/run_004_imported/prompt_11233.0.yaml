answer: |-
  **MEMORANDUM**

  **TO:** Elementary Eligibility Team
  **FROM:** [Your Name], School Psychologist
  **DATE:** [Current Date]
  **SUBJECT:** Pre-Meeting Framework: Mateo's Eligibility and the Definition of "Disorder"

  As we prepare for Thursday's eligibility meeting regarding Mateo, I want to address the theoretical divergence that has emerged during our review of his data. Specifically, we need to align on how our team interprets the IDEA requirement of a "disorder in one or more basic psychological processes" when the deficit is in reading.

  We have two competing interpretations on the table. One argues that because reading is a cultural invention rather than an evolutionary adaptation, there is no dedicated neural circuit to "malfunction," implying the deficit is merely normal variation. The other argues that a disorder is defined by functional failure in a required capacity, regardless of its evolutionary timeline.

  **My recommendation is that we proceed with the latter interpretation and find Mateo eligible for Specific Learning Disability (SLD).**

  To be clear: the evolutionary argument is not scientifically baseless. It is correct that natural selection has not had time to hardwire a specific "reading module" in the human genome; reading is indeed too new for that. However, concluding that this precludes a "disorder" conflates evolutionary origin with neural mechanism. While we lack a dedicated reading gene, we do rely on specific, identifiable neural networks (visual, phonological, and language processing) that the brain must recruit and integrate to read. When a child receives evidence-based instruction and these borrowed systems fail to integrate efficiently—creating a bottleneck that does not exist in their peers—we are observing a functional disorder of processing. The "malfunction" is not in a missing ancestral module, but in the neurocognitive capacity to repurpose existing systems for a non-negotiable academic demand. To deny eligibility on evolutionary grounds would be to prioritize biological history over current educational reality.

  Applying this to Mateo: His data shows a severe discrepancy in phonological processing and rapid automatized naming despite Tier 2 and Tier 3 interventions. There are no exclusionary factors (vision, hearing, ID, or lack of instruction). Under a functional definition of disorder, his cognitive profile demonstrates a specific breakdown in the psychological processes required to access the curriculum. Denying eligibility would effectively mean denying that his barrier to learning is internal and neurological, which contradicts the data.

  **Recommendation:** We should classify Mateo as eligible under SLD (Basic Psychological Process: Phonological Processing/Orthographic Processing) and move immediately to drafting a PLAAFP and goals that target these specific processing deficits.

  **General Guidance for Future Cases:** When debating eligibility for culturally acquired skills, we should define "disorder" by the efficiency of the neural recruitment required for the task, not by the evolutionary age of the task itself.

  I look forward to finalizing this with you on Thursday.

  Best,

  [Your Name]
