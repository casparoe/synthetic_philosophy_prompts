answer: |-
  You have put your finger on the single most famous and contentious crux in the history of logic. Your suspicion is well-founded: on a surface reading of the Edghill translation (and indeed, in the Greek itself), Aristotle appears to say $X$, and then a few lines later say *not-X*.

  However, the consensus among serious scholars of ancient logic (such as J.L. Ackrill, C.W.A. Whitaker, and G.E.M. Anscombe) is that Aristotle is not contradicting himself. Rather, he is drawing a distinction that the English language (and the Edghill translation especially) struggles to render without ambiguity.

  To answer your specific questions: **Yes, the text supports a non-contradictory position.** **Yes, it blocks the fatalist conclusion.** And **yes, it does so without abandoning bivalence for present and past statements.**

  Here is the breakdown of the distinction doing the work, why the translation obscures it, and how the argument functions.

  ### 1. The Translation Problem
  First, a brief note on the Edghill translation (1928). It is a Victorian-era rendering that tends to smooth over Greek grammatical nuances. The crucial phrase you quoted—"actually true or actually false"—is a gloss on the Greek *hōrismenōs* (definitely, determinately, or distinctly).

  When Aristotle says it is not necessary that one be true and the other false, he is not denying the **Law of Excluded Middle** (that one *is* true and the other false). He is denying that the truth value is **determinate** or **fixed by necessity** at this moment.

  A more precise rendering of the final controversial sentence (closer to Ackrill) would be:
  > "It is therefore plain that it is not **necessary** that, of an affirmation and a denial, one should be **determinately** true and the other **determinately** false."

  The word "necessary" (*anankē*) is the operator that shifts the meaning between the two passages you cited.

  ### 2. The Core Distinction: Necessity of the Disjunction vs. Necessity of the Disjuncts
  The coherence of Aristotle's position rests on a **scope distinction** regarding necessity. This is often formalized in modern logic as the difference between:

  1.  **Necessity of the Consequence:** $\square (P \lor \neg P)$
      *   *It is necessary that (either there will be a sea battle or there will not).*
  2.  **Consequence of Necessity:** $(\square P) \lor (\square \neg P)$
      *   *Either (it is necessary that there will be a sea battle) or (it is necessary that there will not).*

  **Passage 1 (The Affirmation of Bivalence):**
  When Aristotle writes, *"One of the two propositions in such instances must be true and the other false,"* he is affirming #1. He is upholding the Law of Excluded Middle. For any contradictory pair, the *disjunction* is necessarily true. There is no third option (no "neither true nor false" in the sense of a truth-value gap, contrary to the later intuitionist reading by Łukasiewicz).

  **Passage 2 (The Denial of Fatalism):**
  When he writes, *"It is not necessary that of an affirmation and a denial one should be true and the other false,"* he is denying #2. He is saying that while one *is* true, it is not **necessarily** true. The truth value is not yet "crystallized" by the nature of reality.

  ### 3. Resolving the Apparent Contradiction
  You asked whether Aristotle is contradicting himself by insisting one must be true/false, then saying it's not necessary one be true/false.

  The resolution lies in the modal qualification.
  *   **Claim A:** "One is true and one is false." (Ontological claim about the pair).
  *   **Claim B:** "It is not necessary that *this specific one* is true." (Modal claim about the assignment).

  Aristotle is distinguishing between **truth simpliciter** and **determinate truth**.
  *   For **past and present** events, truth is determinate. If the sea battle happened yesterday, the proposition "The battle happened" is not only true, but *necessarily* true now (because the past is unchangeable).
  *   For **future contingent** events, truth is indefinite (*aoristos*). The proposition "The battle will happen" corresponds to a reality that is currently potential, not actual. Therefore, while the proposition *has* a truth value (it is either T or F), that value is not fixed by necessity.

  So, he is not saying "Neither is true." He is saying "We cannot say **determinately** that this one is true." The truth exists, but it is not *necessary* truth.

  ### 4. Does This Block Fatalism?
  Yes, this is precisely how Aristotle blocks the "Lazy Argument" (logical fatalism).

  The Fatalist argument runs like this:
  1.  If it is true now that there will be a sea battle, then it cannot fail to happen.
  2.  If it is false now that there will be a sea battle, then it cannot happen.
  3.  Therefore, deliberation is useless; what will be, must be.

  Aristotle attacks premise 1. He grants that the proposition *is* true (or false), but he denies the inference that **Truth implies Necessity** for future contingents.
  *   **Fatalist:** True $\rightarrow$ Necessary.
  *   **Aristotle:** True $\nrightarrow$ Necessary (for future contingents).

  By severing the link between truth and necessity, he preserves the openness of the future. The battle *will* happen (if the proposition is true), but it does not happen *necessarily*. It happens contingently. This preserves the validity of deliberation: my deliberation is one of the contingent causes that helps make the true proposition true.

  ### 5. Does This Abandon Bivalence for Present/Past?
  No. Aristotle is careful to restrict this "indefinite truth" status to things that are **not always existent or not always nonexistent** (i.e., contingent particulars).

  *   **Universals/Necessary Truths:** "All men are mortal." (Always true, necessarily).
  *   **Past Particulars:** "Socrates sat." (True, and now necessarily true because the past is fixed).
  *   **Future Contingents:** "There will be a sea battle." (True or False, but not *necessarily* so).

  He explicitly states earlier in the chapter that for "that which is or which has taken place, propositions... must be true or false." He does not revoke this. He creates a special modal category for the future to prevent the necessity of the past from infecting the future via logical implication.

  ### Summary for Your Reading Group
  To synthesize this for your group, you might propose the following reading of the difficult stretch:

  1.  **Aristotle accepts Bivalence:** For any future contingent, $P \lor \neg P$ is true. One side *is* true, the other *is* false.
  2.  **Aristotle rejects Logical Fatalism:** The truth of $P$ does not entail $\square P$ (Necessarily $P$).
  3.  **The Distinction:** The apparent contradiction is resolved by understanding "True" in the first instance as "Having a truth value" and "True" in the second instance as "Determinately/Necessarily True."
  4.  **The Textual Key:** The Edghill translation's use of "actually true" should be read as "determinately true." Aristotle is arguing that while the truth value exists, it is not yet *fixed* by the current state of the world.

  **Conclusion:** Aristotle is not contradicting himself. He is distinguishing between the **logical necessity of the contradiction** (one must be true) and the **ontological necessity of the fact** (it must happen). This allows him to maintain that statements about the future are truth-apt (preserving logic) without being causally determined (preserving freedom and contingency).

  If your group wants to dig deeper, I highly recommend consulting **J.L. Ackrill's translation and commentary** (Clarendon Aristotle Series) or **C.W.A. Whitaker's *Aristotle's De Interpretatione: Contradiction and Dialectic***. They handle the modal distinctions much more clearly than Edghill.
