answer: |-
  # The Road to Nowhere: Why the Absent-Minded Driver Should Never Update

  The debate over the Absent-Minded Driver is not a bug in decision theory; it is a feature of human psychology colliding with the logic of agency. Your reading group spent an hour arguing because the problem is designed to trigger a specific cognitive error: the intuition that *being at a decision node* constitutes new evidence that warrants a Bayesian update. It does not.

  Here is the verdict: The driver must stick to the ex-ante plan of continuing with probability $p=2/3$. The "paradox" arises only if you treat the decision at the intersection as a localized event rather than an instance of a global policy. The Aumann-Hart-Perry (AHP) distinction is mathematically correct but conceptually incomplete; it patches the hole without explaining why the hole appeared. The true dissolution of the paradox requires accepting that in problems of imperfect recall, **indexical updating is illegitimate.** This is not merely a quirk of highway exits; it is decisive evidence for Updateless Decision Theory (UDT) over Causal Decision Theory (CDT).

  ### The Trap of the Node

  To see why the intuition fails, we must first rigorously define the trap.

  Ex-ante, before the car starts, the math is uncontroversial. Let $p$ be the probability of continuing at any intersection.
  *   Exiting at the 1st (Payoff 0): Probability $(1-p)$
  *   Exiting at the 2nd (Payoff 4): Probability $p(1-p)$
  *   Passing both (Payoff 1): Probability $p^2$

  The expected utility is $E[U] = 4p(1-p) + p^2 = 4p - 3p^2$. Maximizing this yields $p=2/3$, with an expected payoff of $4/3 \approx 1.33$.

  The paradox ignites when the driver arrives at an intersection. They know they are at *an* intersection, but not *which* one. The naive intuition says: "I have gained information. I am no longer at the start; I am at a node. I should update my probability of being at the first intersection versus the second."

  If the driver assumes they will continue with probability $p$ in the future, the probability of reaching the first intersection is 1, and the probability of reaching the second is $p$. By Bayes' rule, the conditional probability that *this* is the first intersection is:
  $$ \alpha = \frac{1}{1+p} $$

  If the driver now tries to maximize expected utility *at this node* using $\alpha$, treating the current decision $q$ as independent of the future decision $p$, they calculate the payoff of exiting versus continuing.
  *   **Exit:** You get 0 if this is the 1st, 4 if this is the 2nd. Expected value: $4(1-\alpha)$.
  *   **Continue:** You get the expected value of the rest of the game.

  Piccione and Rubinstein showed that if you solve for the optimal $q$ given $\alpha$, and then enforce consistency ($q=p$), the fixed point is **$p=1$**. If you follow the "action-optimal" strategy derived from updating on your location, you end up always continuing. You blow past the second exit every time. Your payoff drops from $1.33$ to $1$.

  The updating intuition literally costs the driver money.

  ### Why Updating is a Category Error

  Why does Bayesian updating fail here? Standard Bayesianism teaches us to condition on all available evidence. "I am at an intersection" feels like evidence. But in decision problems with imperfect recall, indexical information ("I am here now") is not separable from the policy that brought you there.

  When you update on $\alpha = 1/(1+p)$, you are implicitly treating the probability of being at the second intersection as a fixed environmental state. It is not. It is a *consequence* of your own strategy. By updating, you are double-counting your own agency. You are treating your past self's decision to continue as a fact of the world, while treating your current self's decision to continue as a free variable.

  This is the same structural error as the Sleeping Beauty problem. If Beauty updates on "I am awake," she assigns probability 1/3 to Heads. If she doesn't update (halfer position), she assigns 1/2. In the Driver problem, updating leads to a time-inconsistent policy that is dominated by the pre-commitment.

  The driver does not learn *where* they are; they merely instantiate *what* they are. The decision at intersection 1 and the decision at intersection 2 are not two different decisions made by two different agents. They are two executions of the same algorithm. To update on being at a node is to pretend you are a fresh agent arriving in a world shaped by a stranger, when in fact you are the stranger.

  ### The Aumann-Hart-Perry Patch

  Aumann, Hart, and Perry (1997) responded to Piccione and Rubinstein by distinguishing between **Planning-Optimal** (ex-ante) and **Action-Optimal** (at the node). They argued that if you define "Action-Optimal" correctly—recognizing that choosing at *this* indistinguishable node implies choosing at *all* indistinguishable nodes—the two optima coincide.

  Does this resolve the tension? Mathematically, yes. Psychologically, no.

  AHP essentially argue that the driver should realize, "Since I cannot tell the intersections apart, my choice here *is* my choice there." This forces the action-optimal calculation to mirror the planning-optimal one. However, critics in your reading group are right to sense a sleight of hand. AHP tells you *what* to do (treat the nodes as linked), but it doesn't fully explain *why* the naive updating intuition is so compellingly wrong. It frames the solution as a constraint on rationality ("you must recognize the link") rather than a correction of the epistemic process ("you cannot update on this").

  AHP saves the consistency of the decision, but it leaves the epistemology muddy. It suggests that "updating" is permissible provided you update on the right correlations. But the deeper lesson is that **no updating should occur on self-locating beliefs that are determined by the policy itself.** The AHP distinction is a bridge over troubled water, but it doesn't drain the swamp.

  ### The Case for Updateless Decision Theory

  This is where the problem ceases to be a parlor trick and becomes a pillar of decision theory. The Absent-Minded Driver is a reductio ad absurdum for Causal Decision Theory (CDT) and standard Bayesian updating in contexts of imperfect recall.

  CDT fails because it severs the logical link between the decision at node 1 and node 2. It treats the probability of reaching node 2 as a fixed parameter when optimizing at node 1. Evidential Decision Theory (EDT) does better by correlating the actions, but it still stumbles on the "updating" phase if not carefully constrained.

  Updateless Decision Theory (UDT) dissolves the paradox entirely. UDT posits that an agent should not choose an *action* based on current observations; it should choose a *policy* (a mapping from observations to actions) based on the prior, before any observations are made.

  In UDT terms:
  1.  The driver selects a policy $\pi$ (e.g., "continue with prob 2/3") at the start.
  2.  When the driver arrives at an intersection, they observe "I am at an intersection."
  3.  Crucially, **they do not update their prior.** They simply execute $\pi(\text{"intersection"})$.

  Because UDT never updates on the indexical information "I am at a node," it never calculates the distorted probability $\alpha = 1/(1+p)$. It never sees the "Action-Optimal" trap. It simply executes the ex-ante optimal policy.

  The Driver problem demonstrates that **memory loss does not justify policy revision.** Just because you forgot your plan doesn't mean the plan is no longer optimal. If you allow memory loss to trigger a re-evaluation of the plan based on "where I might be," you open the door to dynamic inconsistency. You become a money pump for your own future selves.

  ### The Verdict

  So, what should the driver do?

  **The driver must continue with probability $p=2/3$.**

  Any deviation from this is a failure of rationality. If the driver feels the urge to update their probability of being at the first intersection, they must recognize that urge as a cognitive illusion. The feeling that "I am here now, so I should recalculate" is the sound of the decision algorithm fracturing.

  Furthermore, we must issue a verdict on the epistemology: **"Updating" does not make sense in this context.**

  In problems with imperfect recall where the agent's instances are logically linked, self-locating information is not evidence that shifts probabilities; it is a pointer to which instance of the algorithm is running. Updating on it treats the algorithm's history as external data, which it is not.

  The Absent-Minded Driver is not a paradox about highways. It is a proof that rational agents must be **updateless** regarding their own existence within the scope of a single decision problem. Your reading group argued for an hour because they were trying to reconcile a timeless logical truth with a time-bound psychological experience. The road doesn't change. The exits don't move. The only thing that changes is your confusion. Do not let confusion drive the car. Stick to the plan.
