answer: |-
  This is a remarkably sharp reading of Sidgwick, especially for someone coming at it from outside the professional philosophy guild. Your "metrologist moonlighting as a dowser" analogy is not only vivid; it is historically precise. Sidgwick was obsessed with precision, clarity, and the boundaries of scientific method, which makes his involvement with the "fringe" science of psychical research seem contradictory only until you understand the stakes of his ethical system.

  You asked for an honest read on where you might be stretching things, where you are solid, and whether you are reinventing the wheel. Here is the breakdown.

  ### 1. The Philosophy: The Dualism of Practical Reason
  **Your Claim:** Sidgwick finds two self-evident principles (maximize own good vs. maximize impartial good) that conflict. He needs a "moral government of the universe" (post-mortem sanctions) to align them, otherwise utilitarianism is irrational.
  **The Verdict:** **Solid.** You have grasped the central crisis of *The Methods of Ethics* correctly.

  **The Nuance:**
  You suggest he can't find grounds to "rank the second over the first." It is slightly more dramatic than that. Sidgwick argues that if Rational Egoism (it is rational to pursue my own happiness) and Rational Benevolence (it is rational to pursue the universal good) conflict, then **Practical Reason is divided against itself.**
  If being moral (Utilitarianism) requires sacrificing my own ultimate happiness, and there is no afterlife to correct the ledger, then it is arguably *irrational* to be moral. For Sidgwick, morality must be rational. If the universe does not guarantee that virtue leads to happiness (eventually), then the "moral ought" loses its rational binding force.
  *   **Correction:** You aren't wrong, but emphasize that for Sidgwick, this isn't just a ranking problem; it is a threat to the **coherence of rationality itself.**

  ### 2. The Motivation: Ethics Forcing Psychical Research
  **Your Claim:** The psychical research wasn't a hobby; it was forced on him by the hole in his ethics. He needed empirical proof of survival/sanctions to replace the religious dogma he rejected.
  **The Verdict:** **Historically Supported.**

  **The Nuance:**
  You are correct that he resigned his fellowship at Trinity College, Cambridge, in 1869 because he could no longer affirm the Thirty-Nine Articles. This left him with a "God-shaped hole" in his ethical system. He needed the *function* of religion (cosmic justice) without the *theology*.
  Since he was an empiricist (influenced heavily by the scientific naturalism of his time), he could not accept faith. He needed data. If survival after death could be proven scientifically (via mediums, hallucinations, etc.), then the "sanctions" required to solve the Dualism could be established scientifically.
  *   **Where you might be stretching:** Don't imply it was *only* about ethics. Sidgwick was also genuinely concerned with the integrity of scientific inquiry. He believed that dismissing anomalous data (testimony of respectable witnesses regarding ghosts) was unscientific dogmatism. However, the *urgency* and the *funding* of the SPR were absolutely driven by his ethical needs. Your "metrologist" analogy covers this perfectly: a metrologist cares about measurement standards, but if his life depends on a specific measurement, he becomes obsessed with the tool.

  ### 3. The Outcome: Dying Unconvinced
  **Your Claim:** He never got evidence that satisfied him, died unconvinced, and the project is a monument to an unsolvable problem.
  **The Verdict:** **Mostly Accurate, but requires tonal adjustment.**

  **The Nuance:**
  Sidgwick did not die a "disbeliever," but he did not die a "believer" either. He remained a rigorous **agnostic**. In his *Autobiography*, he states that while he found no conclusive proof, he found enough to make the question "worthy of serious investigation."
  He didn't view the project as a failure of *method*, even if it was a failure of *result*. He famously said that if he were convinced of the truth of spiritualism, it would solve his ethical difficulties, but he would not accept spiritualism *just* to solve the ethical difficulties. That would be wishful thinking (the "pathetic fallacy" of ethics).
  *   **Correction:** It is less a "monument to a problem he couldn't solve" and more a "monument to intellectual honesty." He was willing to spend 20 years chasing ghosts rather than lie to himself about the foundations of morality.

  ### 4. The "Reinventing the Wheel" Question
  **Your Claim:** You wonder if there is a better-supported version of this thesis already out there.
  **The Verdict:** **Yes, this is the dominant interpretation in modern Sidgwick scholarship.**

  You have independently derived the consensus view of the last 40 years of Sidgwick studies. This is not a criticism of your insight; in fact, it validates it. For a long time (early 20th century), Sidgwick's psychical research was treated as an embarrassing eccentricity, separate from his "serious" philosophy. It was only later that scholars realized the two were inextricably linked.

  **Key Literature You Should Consult:**
  1.  **Bart Schultz, *Henry Sidgwick: Eye of the Universe* (2004).** This is the definitive modern biography. Schultz argues exactly what you have argued: that Sidgwick's life was a unified project to find a scientific basis for morality, and the SPR was the laboratory for that project. **Read this before your discussion group.** It will give you the footnotes and archival evidence to back up your intuition.
  2.  **J.B. Schneewind, *Sidgwick's Ethics and Victorian Moral Philosophy* (1977).** The classic text on his ethics. Schneewind discusses the Dualism extensively and touches on the religious/psychical implications.
  3.  **Christian Maurer, *Henry Sidgwick's Moral Philosophy* (various articles).** Maurer has written specifically on the link between the Dualism and the need for theological/paratheological hypotheses.

  ### Summary for Your Discussion Group
  You can present your theory with confidence, but I would suggest framing it with the following adjustments to withstand scrutiny:

  1.  **Refine the Dualism:** State clearly that the conflict threatens the *rationality* of morality, not just the preference order. If Egoism and Utilitarianism conflict, Reason commits suicide.
  2.  **Acknowledge the "Scientific" Motive:** Admit that Sidgwick cared about scientific method for its own sake, but argue that the *existential urgency* came from the ethical Dualism.
  3.  **Cite the Scholarship:** Don't hide that this is a known thesis. Say, "My reading aligns with the interpretation advanced by Bart Schultz and others, which posits that..." This shows you've done your homework and prevents anyone from saying, "But have you read Schultz?"
  4.  **Keep the Chemist Analogy:** The "metrologist/dowser" line is gold. It captures the tension between his demand for precision and the vagueness of his data.

  **Final Verdict:** You haven't flattened the Dualism; you've identified its engine. You haven't got the history wrong; you've spotted the causal link that many miss. You are just about 30 years behind the cutting edge of Sidgwick scholarship, which is impressive for a year of "fun" reading.

  Go to that discussion group. Just bring Bart Schultz with you as backup.
