answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Two graduate students, **Alex** (proponent of the Assertion/Speech-Act View) and **Ben** (proponent of the Transparency/Self-Knowledge View), are surrounded by stacks of papers on Moore's Paradox.*

  **Alex:** Look, I think the seminar got lost in the psychology of it. The reason "It's raining, but I don't believe it" makes everyone's skin crawl isn't because of some mysterious fracture in the human soul. It's because assertion has constitutive norms. If you follow Williamson, the rule is: Assert $P$ only if you know $P$. If you follow Grice, it's: Assert $P$ only if you believe $P$. Either way, the act of asserting the first conjunct represents you as satisfying a condition that the second conjunct explicitly denies. It's a pragmatic self-defeat. You're pulling the rug out from under your own speech act.

  **Ben:** But that explains why it's awkward to *say*, Alex. It doesn't explain why it's irrational to *think*. That's the hard case. Imagine I'm writing in a diary that I will seal and burn immediately. No audience. No communicative intent. If I write, "It is raining, but I do not believe it," I am not performing a public speech act. Yet, the thought still feels impossible to sustain. If your view were right, the private case should be harmless. The fact that it isn't suggests the absurdity lies in the doxastic state itself, not the expression of it.

  **Alex:** I'm not conceding the diary case is harmless, but I dispute your description of it. When you write in a diary, you are engaging in a derivative speech act. You are asserting to your future self, or perhaps just practicing the norm-governed activity of judgment. Judgment *inherits* its norms from assertion. We don't have a private language of thought that operates on different rules. If the norm of assertion is knowledge, then the norm of judgment is likely knowledge too. So, even in the diary, you are violating the norm governing the attitude you're expressing.

  **Ben:** That strikes me as putting the cart before the horse. You're saying judgment is just inner speech. But consider Evans's transparency thesis. When I ask myself, "Do I believe that it is raining?" I don't introspect a mental object called a belief. I look out the window. I attend to the evidence for rain. The question of belief is transparent to the question of truth. So, to judge "$P$" is to take $P$ as true. But to simultaneously judge "I don't believe $P$" is to withhold taking $P$ as true. You can't coherently hold both attitudes toward the same proposition at the same time. The diary case is irrational because *judgment* is irrational, not because you're violating a social rule of communication. The assertion is just the symptom; the disease is in the rationality of the believer.

  **Alex:** But if the disease is in the rationality of the believer, explain the data on tense and person. This is where my view shines. "It *was* raining, but I didn't believe it" is perfectly coherent. "She believes it's raining, but it *isn't*" is also fine. If this were a deep contradiction in the nature of belief, why does shifting the tense or the person cure it? On my view, it's obvious. The norm of assertion applies to the *present* speaker. When I assert "It was raining," I represent myself as *currently* knowing it was raining. That doesn't conflict with reporting that *past* me didn't believe it. Similarly, talking about *her* belief doesn't commit *me* to having that belief. The paradox only arises when the speaker, the time, and the belief all align. That points to a rule governing the *act* of speaking, not the metaphysics of belief.

  **Ben:** I can explain the tense and person shift without reducing it to speech acts. Transparency is a synchronous relation. I can only determine what I believe *now* by looking at what is true *now*. When I say, "It was raining, but I didn't believe it," I am using my current evidence to assess the past world, and my current self-knowledge to assess my past mind. There is no conflict because the transparency relation doesn't hold across time. I am not currently judging that it is raining; I am judging that it *was*. As for the third person: "She believes it's raining" is not transparent for me. I can't look at the world to see if *she* believes it. I have to look at *her*. So the tension between the world-directed judgment and the mind-directed report dissolves. The paradox is strictly first-person, present-tense because self-knowledge is strictly first-person, present-tense. That confirms the epistemic view, not the linguistic one.

  **Alex:** But does your epistemic view handle both forms of the paradox equally? We have the omissive version ("$P$, but I don't believe $P$") and the commissive version ("$P$, but I believe not-$P$"). On my view, these are two sides of the same coin. In the omissive case, you assert $P$ (implying belief) while denying belief. In the commissive case, you assert $P$ (implying belief) while asserting a belief in not-$P$. Both violate the sincerity or knowledge norm. It's a unified explanation based on the inconsistency of the commitments undertaken in assertion. Can you say the same? In the omissive case, I lack a belief. In the commissive case, I have a contradictory belief. Those seem like different psychological failures.

  **Ben:** They are different psychological failures, but they stem from the same source: the fragmentation of rational agency. Shoemaker argues that a rational believer cannot be "self-blind." If I believe $P$, rationality dictates I am in a position to know I believe $P$. In the omissive case, I believe $P$ (evidenced by my assertion or judgment) but I fail to self-ascribe that belief. I am self-blind. In the commissive case, I believe $P$ and I believe not-$P$. That's a failure of consistency. But notice: in both cases, I am failing to integrate my first-order attitude with my second-order self-ascription. The unified explanation is that rationality requires a harmony between the mind's view of the world and the mind's view of itself. Your view treats the commissive case as just a lie or a mistake in assertion. But if I *think* "$P$, but I believe not-$P$," I'm not lying. I'm genuinely irrational. My view captures the pathology of the thought; yours only captures the impropriety of the utterance.

  **Alex:** I think you're underestimating how much work the norm of assertion does. If I think "$P$, but I believe not-$P$," I am effectively preparing to assert something I take myself to be false. Even in thought, I am simulating the assertion. But let's press the diary case again. You say the diary is non-communicative. I say that's an illusion. If you write it down, you are treating the proposition as a candidate for truth. You are committing yourself to it. That commitment *is* the assertion-like move. If you truly had no commitment—if you were just writing fiction—"The king is dead, but I don't believe it"—there's no paradox. The paradox arises because you are making a claim on truth. And making a claim on truth *just is* subjecting yourself to norms of assertion. So even in the privacy of your head, you are bound by the rules of the public game.

  **Ben:** And I think you're overestimating the dependency of thought on language. A pre-linguistic child or an animal could arguably be in a state analogous to Moore-paradoxical belief, even if they can't assert. If a dog acts as if the food is there but acts as if it doesn't believe the food is there, there's a rational breakdown. That breakdown exists prior to the norm of assertion. The norm of assertion exists *because* belief has these properties, not the other way around. We regulate assertion the way we do because we recognize that asserting $P$ while believing not-$P$ is a betrayal of the function of belief.

  **Alex:** Okay, let's get to the crux. We're at a stalemate on the priority question. Does the norm of belief derive from the norm of assertion, or vice versa? Here is what I would need to grant you to change my mind. If you could demonstrate a case of private judgment that is structurally Moore-paradoxical but involves *no* commitment to truth—no simulation of assertion, no communicative intent even to a future self—and yet remains irrational, I would have to concede. You need to show me a "pure thought" that is unmoored from any norm of correctness derived from communication, which still retains the paradox. If the paradox survives the total removal of the "claim-making" aspect, then it's purely doxastic.

  **Ben:** Fair enough. And here is my condition for switching to your camp. If you can show that the irrationality of the diary case is *entirely* parasitic on the subject's disposition to speak. If you can demonstrate that a subject who is permanently mute, or who conceptually lacks the notion of "assertion," would find the thought "It is raining but I don't believe it" perfectly coherent, then I will concede. You need to prove that the tension dissolves without the possibility of expression. If the irrationality vanishes when the possibility of assertion is removed, then the speech-act norm is the root. But I suspect you'll find that even the permanent mute finds the thought unbearable, because rationality is not a social contract.

  **Alex:** Then we have our research projects for the next term. I'll look for the pure thinker; you look for the permanent mute.

  **Ben:** Agreed. But until then, I'm sticking with Evans. The window is where the belief is.

  **Alex:** And I'm sticking with Williamson. The norm is where the assertion is. Coffee?

  **Ben:** Coffee. But I believe it's tea.

  **Alex:** *[Laughs]* Don't start.
