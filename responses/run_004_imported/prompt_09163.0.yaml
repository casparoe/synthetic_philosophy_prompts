answer: |-
  You are right to be suspicious of the undergraduate summary. The "Popper vs. Darwin" debate is one of the most frequently misappropriated footnotes in the philosophy of science, often weaponized by both sides of the evolutionary psychology (EP) debate to score points they haven't actually earned.

  The short version is this: Popper did not call evolution pseudoscience, nor did he fully recant his critique. He classified natural selection as a "metaphysical research programme"—a framework that generates science but isn't itself a testable law like gravity.

  Here is the detailed breakdown of Popper's actual position, how it evolved, and what it actually implies for the "just-so story" critique in evolutionary psychology.

  ### 1. Popper's Actual Position: The "Metaphysical Research Programme"

  To understand Popper's view, you have to understand his criterion: **falsifiability**. For a theory to be scientific, there must be a logical possibility of an observation that could prove it false.

  **The Initial Critique (1974–1976)**
  In the mid-70s, Popper argued that Darwinism (specifically natural selection) struggled with falsifiability due to the problem of **tautology**.
  *   The phrase "survival of the fittest" is circular if "fitness" is defined solely by "survival."
  *   If a trait survives, it is deemed fit. If it is fit, it survives.
  *   Popper argued that without an *independent* measure of fitness (e.g., measuring reproductive success before knowing who survived), the theory explains everything and therefore prohibits nothing. If it prohibits nothing, it is not empirically testable.

  Consequently, Popper labeled Darwinism a **"metaphysical research programme."**
  *   **Crucial Nuance:** In Popper's philosophy, "metaphysical" does not mean "false" or "nonsense." It means it functions as a guiding framework or heuristic that stimulates scientific inquiry, rather than a strict law that can be knocked down by a single experiment. He compared it to Newtonian physics before precise measurements existed: a productive framework, but not yet fully testable in all its claims.

  **The Shift/Clarification (1978)**
  In a lecture titled *Natural Selection and the Emergence of Mind* (1978), Popper moderated his stance. He is often cited as having "recanted," but the reality is more subtle.
  *   He conceded that natural selection **can** be formulated in a testable way, provided that "fitness" is defined independently of survival (e.g., via physiological efficiency or specific trait advantages).
  *   However, he maintained that historically, Darwinism had often been practiced in an untestable way. He worried that evolutionary explanations were too flexible, capable of rationalizing any outcome post-hoc.

  **The Distinction: Fact vs. Mechanism**
  You recalled correctly that Popper drew a distinction.
  1.  **Evolution as History (Common Descent):** Popper accepted this as a historical fact supported by evidence (fossils, biogeography). This is a singular historical narrative, which Popper admitted is harder to test than universal laws, but still scientific.
  2.  **Natural Selection as Mechanism:** This was his target. He questioned whether selection was the *sole* or *primary* driver and worried that invoking "adaptation" was too often a conversation-stopper rather than a testable hypothesis.

  ### 2. Implications for the Evolutionary Psychology Standoff

  The rhetorical standoff you described relies on a partial reading of Popper from both sides. Here is how Popper's actual framework applies to the "just-so story" charge.

  #### The Defender's Error
  **The Claim:** "Popper said evolution isn't falsifiable, so calling EP untestable is invalid."
  **The Reality:** This is a category error. Even if the *general mechanism* of natural selection is a "research programme," **specific hypotheses** generated by that programme must be falsifiable.
  *   Popper's framework demands that *specific claims* (e.g., "Women prefer resource-holding males because of ancestral reproductive constraints") must rule out some possible state of the world.
  *   If an EP proponent says, "This behavior exists because it was adaptive," and when confronted with a counter-example says, "Ah, but in that context, the *opposite* behavior was adaptive," they are engaging in the untestable tautology Popper warned against.
  *   **Verdict:** Hiding behind Popper's critique of Darwinism to shield specific EP claims from scrutiny is philosophically invalid. The "research programme" status grants legitimacy to the field, not immunity to its specific hypotheses.

  #### The Critic's Error
  **The Claim:** "EP is untestable speculation."
  **The Reality:** This is often an overcorrection. While some EP claims are indeed post-hoc rationalizations, the *logic* of adaptation is testable if done rigorously.
  *   Popper acknowledged that historical sciences (like geology or evolutionary biology) test hypotheses differently than experimental sciences (like physics). They test via **consilience** (convergence of evidence) and **prediction of hidden facts** (e.g., predicting where a transitional fossil should be found).
  *   **Verdict:** Dismissing EP entirely because it deals with unobservable ancestral environments ignores that all historical science faces this problem. The issue is not the *subject matter*, but the *methodology*.

  ### 3. A Principled Way to Distinguish Science from "Just-So"

  Does Popper's framework give us a tool to separate good EP from bad? Yes. It moves the goalposts from "Is this story plausible?" to "What evidence would prove this wrong?"

  Here are three criteria derived from Popperian philosophy (and refined by critics like Gould and Lewontin) that distinguish a testable adaptive hypothesis from a just-so story:

  **1. Independent Measurement of the Selection Pressure**
  *   **Just-So:** "Men like sugar because it was adaptive." (Fitness is defined by the existence of the trait).
  *   **Testable:** "Men like sugar *to the degree that* high-calorie density predicted survival in environment X."
  *   **The Popper Test:** Can you measure the selection pressure (caloric scarcity) independently of the trait (sugar preference)? If the only evidence for the pressure is the existence of the trait, it is tautological.

  **2. The "Prohibition" Criterion**
  *   **Just-So:** A story that can explain any outcome. (e.g., "Altruism evolved to help kin" vs. "Selfishness evolved to protect resources." If a culture is altruistic, it's kin selection. If selfish, it's resource protection.)
  *   **Testable:** A hypothesis that specifies conditions under which the trait should *not* appear.
  *   **The Popper Test:** Does the EP hypothesis predict that the behavior should vanish or reverse if the ancestral condition is removed? (e.g., If reproductive variance is equalized between sexes, does sex-differentiated jealousy disappear?) If the answer is "No, because psychology is complex," the hypothesis is losing falsifiability.

  **3. Prediction of Novel Facts (The Lakatosian Upgrade)**
  Imre Lakatos, a student of Popper, refined this into the "Methodology of Scientific Research Programmes." A progressive programme predicts *novel* facts; a degenerating one just explains old facts with ad-hoc adjustments.
  *   **Just-So:** Explains known data (e.g., "We fear snakes because they were dangerous").
  *   **Testable:** Predicts unknown data (e.g., "If this fear is innate, infants should show heightened attention to snake shapes before they have learned to fear them").
  *   **The Popper Test:** Is the hypothesis generating new experiments, or just narrating existing correlations?

  ### 4. Summary for Your Longread

  For your article, you can frame the standoff not as a philosophical deadlock, but as a methodological challenge.

  1.  **Popper didn't let Evolution off the hook;** he put it in a specific category ("metaphysical research programme") that requires rigorous testing of specific claims to remain scientific.
  2.  **The "Just-So" charge is valid** only when the hypothesis is formulated tautologically (the trait exists, therefore it was fit). It is invalid when used to dismiss the entire enterprise of historical explanation.
  3.  **The solution is not "more falsifiability"** in the abstract, but **independent variables.** Good evolutionary psychology identifies the ancestral problem independently of the modern psychological solution.

  **The Bottom Line:**
  Popper's history suggests that the debate shouldn't be about whether evolutionary psychology is *possible* (it is), but whether specific claims are *protected from criticism* by flexible storytelling. The defenders are wrong to use Popper as a shield against the "just-so" critique; Popper was actually one of the original warners against unfalsifiable adaptationism. However, the critics are wrong if they imply that *no* psychological trait can be traced to evolution.

  The principled distinction lies in **risk**. A scientific EP claim sticks its neck out: it says, "If we find X, this theory is dead." A just-so story ensures its neck is never in danger. Your readers should look for where the neck is.
