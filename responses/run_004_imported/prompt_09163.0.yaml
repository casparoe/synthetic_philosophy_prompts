prompt: |-
  I'm working on a longread about evolutionary psychology and I keep running into the same rhetorical standoff. A critic will say some adaptationist explanation — why we like sugar so much, why jealousy allegedly differs by sex, whatever the study of the week is — is basically untestable, a "just-so story" dressed up as science. The defender fires back that this is rich coming from people who accept evolutionary biology generally, since even Popper, the guy who basically invented the falsifiability criterion, once conceded that natural selection itself isn't strictly falsifiable — and if that doesn't disqualify evolutionary biology as a whole, then waving "unfalsifiable" at evo psych doesn't prove much either.

  Thats basically all I remember from an undergrad philosophy of science class though, and I have a nagging feeling the real story is messier than "Popper doubted evolution, then recanted." Didn't he draw some distinction between evolution as a historical fact and natural selection as a mechanism? And wasn't there controversy over how much his later "recantation" actually walked back? I dont want to print a garbled version of this. Could you lay out what Popper's actual, considered position on Darwinism was, including how and why it shifted, and then spell out the most important implications of that history for how seriously I should take the "just a just-so story" charge against specific evolutionary psychology claims? Mainly I want to know whether his own framework gives us a principled way to tell a well-supported adaptive hypothesis apart from an untestable one, or whether it's more of a wash than people on either side like to admit.
