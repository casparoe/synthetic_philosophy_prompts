      *   Is there a risk in telling them to ignore the advisor? Need to be respectful. The advisor pointed out a logical inconsistency, which is valid, but the *procedure* dictates the solution.

  9.  **Final Polish:** Ensure the distinction between "logical consistency" and "democratic legitimacy" is clear. Emphasize that this is a feature of voting systems, not a bug in their specific thinking. (This reduces stress).

  **(Self-Correction during drafting):** I should mention that in many honor councils, the goal is consensus. If they are split this badly on the *facts*, maybe they shouldn't be voting yet. They should be talking. But assuming voting is required, verdict voting is safer.

