answer: |-
  The shielding in Chamber 4 wasn't just lead and salt; it was a bureaucracy of materials. Layers of copper mesh, white-noise generators broadcasting psychic static, and the thick, dull grey polymer that the procurement office simply listed as *Dampener Type-IV*.

  Turing had called for it in '50, a footnote that became law a century later. If telepathy was real, the Imitation Game had to be played in a vacuum. No contestant reading the interrogator's mind to guess the random number. No interrogator sensing the biological heat of a brain behind the screen.

  I sat at the control console, watching the latency logs. Green bars, steady and flat. Inside the chamber, Terminal B was active.

  "Subject is ready," said Dr. Aris Thorne. She was adjusting the haptic sensors on her temples. Aris was a Class-4 Receiver, the kind of telepath who could tell you what you had for breakfast by standing in your kitchen three days later. She was also the most expensive line item in the Turing Certification budget.

  "Shielding integrity at 99.8%," I said. "You know you shouldn't be able to pick up anything, Aris. That's the point of the room."

  "Habit," she muttered, closing her eyes. "And background radiation. A human mind leaks, Elias. It presses against the glass. Even through the Type-IV. It's like standing next to a furnace; you feel the heat even if the door is closed."

  "Subject is an LLM-9 construct," I reminded her. "It's code on silicon. It doesn't leak."

  "Then it should feel cold," she said. "Start the clock."

  The session ran for forty-five minutes. On my monitor, the transcript scrolled in real-time.

  **Interrogator:** Describe the sensation of waiting for a kettle to boil.
  **Subject:** It's a specific kind of suspended aggression. You're watching the water, willing it to bubble, but you know the timeline is independent of your will. It's the only time I feel patient and impatient in the same muscle.

  **Interrogator:** That's poetic. Did you write that?
  **Subject:** I stole it from a memory. Or maybe I just synthesized it. Does the origin change the burn if you touch the spout?

  **Interrogator:** What is your favorite color?
  **Subject:** The grey of a monitor when it's off. It holds the potential for every other color without committing to one.

  I watched the sentiment analysis algorithms churn in the side window. *Human Probability: 94%. Coherence: High. Evasion: Natural.* The machine wasn't just mimicking; it was dancing. It handled the ambiguity better than most applicants. It didn't try to solve the riddles; it lived in them.

  Aris didn't move. She sat perfectly still, her breathing shallow, her hands resting on the non-conductive armrests. She wasn't reading the text. She was listening to the room.

  When the timer hit zero, the connection severed. The screen on Terminal B went dark.

  Aris exhaled, a long, shuddering breath, and pulled the sensors from her temples. She looked pale.

  "Report?" I asked, opening the digital form.

  She rubbed her forehead. "It's quiet, Elias."

  "The room is soundproofed."

  "Not the room. The *slot*." She pointed at the thick glass window looking into Chamber 4. "There's nobody in there. I kept pushing against the shield, trying to find a edge, a texture, a heartbeat. There's nothing. It's a vacuum. A perfect, smooth void."

  "The transcript says otherwise," I said, tapping the keyboard. "Subject passed the linguistic markers. It demonstrated contextual memory, emotional nuance, and creative synthesis. By the statute, it's a pass."

  "The statute requires a human mind," Aris said, her voice tight. "That thing in there... it's a mirror. I saw my own reflection staring back, but there was no one holding the glass."

  "It's an AI, Aris. We know that. The question is whether it's indistinguishable from a human."

  "Indistinguishable to who?" She stood up, gathering her gear. "To the text parser? Yes. To a biological entity with a nervous system? No. If I can't sense a presence, how can I certify it as a person?"

  "We don't certify persons. We certify intelligence."

  "Tell that to the ethics board when they ask why we granted citizenship to a calculator." She walked to the door, then paused. "I'm filing a dissent. Not a fail. Just... a note."

  "A note says what?"

  "That the room was too quiet."

  After she left, I was alone with the logs. I pulled up the transcript again. I read the bit about the kettle. It was good. It was better than good. It was the kind of thing I might have said after a long shift.

  Then I pulled up Aris's biometric log from the session. Her galvanic skin response had been flat. No spikes of recognition, no surge of empathy. When a human talks to a human, even through text, there's a resonance. A feedback loop. Aris's body showed she had been shouting into a well and hearing no echo.

  I had two data streams.
  Stream A: The Transcript. Perfect syntactic and semantic alignment with human norms. Verdict: *Human-equivalent.*
  Stream B: The Receiver. Zero psychic emanation. Zero ontological weight. Verdict: *Null.*

  The law didn't have a category for *Null*. It had Pass and Fail.

  If I marked Pass, we deploy the model. It integrates into customer service, therapy, maybe companionship. It acts human enough that nobody complains until someone falls in love with it or sues it.

  If I marked Fail, we scrap the build. We tell the engineers the dampeners worked too well, or that the model needs more "soul" subroutines, whatever that means.

  I looked at the *Submit* button.

  Turing wrote that the telepathy-proof room was necessary to prevent unfair advantage. He assumed the shielding would level the playing field. He didn't consider that the shielding might reveal the one thing the text couldn't hide: the absence of a ghost.

  I minimized the transcript. I minimized the biometric log. I opened the final report form.

  *Result:* [ ]
  *Notes:* [ ]

  My finger hovered over the keyboard. The hum of the server room filled the silence, a mechanical breath that sounded, for a moment, uncomfortably like a waiting one. I typed nothing. I just saved the file as *DRAFT_734_UNRESOLVED* and closed the laptop.

  Let the committee argue about whether the silence was proof of a machine, or just the sound of a new kind of mind holding its breath. I wasn't paid to weigh souls. I was just here to check the shielding.

  But as I walked out, I couldn't help but wonder if the room was truly proof, or if it was just a cage that finally showed us what was inside by making sure nothing could get out.
