      *   *Actually, let's push for something more active.* **Recommendation: Retain the historical record, but formally contextualize the award with a permanent plaque/digital entry acknowledging Anscombe's protest and the ongoing ethical debate.** This satisfies the historian (history remains) and Anscombe's heirs (the moral objection is institutionalized).

