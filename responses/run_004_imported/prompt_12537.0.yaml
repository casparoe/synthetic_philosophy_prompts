answer: |-
  It is a pleasure to correspond with someone who brings the conceptual rigor of general relativity to the metaphysics of persistence. Your intuition is well-founded: in the context of GR, the "worldtube" picture is not merely a heuristic but the natural ontological commitment of the theory. The manifold *is* a four-dimensional structure; foliations into spatial slices are coordinate-dependent. Consequently, the perdurantist picture (often called "four-dimensionalism" in metaphysics) feels like home to a relativistic physicist.

  However, the metaphysical resistance you encountered stems from a desire to preserve the phenomenology of identity—the sense that *I* am wholly here now, not just a slice of a larger worm. To answer your specific questions, we need to disentangle the logical machinery the endurantists use to save that intuition within an eternalist framework.

  ### 1. Distinguishing the Two Relativizing Strategies

  You asked what fundamentally distinguishes relativizing the *properties* (Strategy 1) from relativizing the *exemplification* (Strategy 2), given that both seem to result in "F only relative to a time."

  The distinction lies in **where the temporal parameter enters the ontological account**.

  **Strategy 1: Relativizing the Property (Relationism)**
  Here, the property itself is analyzed as a relation. There is no monadic property *<being bent>*. There is only the dyadic relation *<being bent-at-t>*.
  *   **Ontological Commitment:** The object $O$ and the time $t$ are the relata. The property is essentially extrinsic.
  *   **The Logic:** $Bent(O, t_1)$ and $Straight(O, t_2)$.
  *   **The Cost:** As Lewis argued, this dissolves the intrinsicality of shape. If *being bent* is really *being bent-at-t*, then an object cannot be bent simpliciter. It implies that shape is not a feature of the object alone, but of the object-in-relation-to-a-time.

  **Strategy 2: Relativizing the Exemplification (Adverbialism)**
  Here, the property remains monadic and intrinsic. *<Being bent>* is a genuine, non-relational property. However, the *copula* (the "is" of predication) is modified. Instantiation is not a binary relation between an object and a property; it is a ternary relation between an object, a property, and a time.
  *   **Ontological Commitment:** The property is intrinsic to $O$. The *fact* of instantiation is temporally qualified.
  *   **The Logic:** $At(t_1, Bent(O))$ and $At(t_2, Straight(O))$. Or, using the adverbial phrasing: $O$ *is-at-$t_1$* bent.
  *   **The Distinction:** In Strategy 1, the time is part of the *predicate*. In Strategy 2, the time is part of the *truth-maker* or the *mode of instantiation*.

  **Why this matters:** Strategy 2 attempts to preserve the idea that "bentness" is a way the object *is*, independent of time, while admitting that the *obtaining* of that state is temporally located. Strategy 1 says "bentness" is inherently time-indexed. To use a linguistic analogy: Strategy 1 says "bent" is an incomplete verb like "taller" (which requires 'than X'). Strategy 2 says "bent" is complete, but the sentence requires a temporal adverb to be assessed for truth.

  ### 2. Does Strategy 1 Smuggle in the Worldtube?

  You suspect that relativizing properties covertly grants the perdurantist's point. Lewis would agree with you.

  If properties are relations to times, the object is defined by its location in the temporal manifold much like a point is defined by its coordinates. While the endurantist insists the *whole* object bears the relation to $t_1$ and the *whole* object bears the relation to $t_2$, the ontological picture begins to look suspiciously like a worldline where each point is a node of property-instantiation.

  However, a strict endurantist would argue it does **not** smuggle in temporal *parts*.
  *   **Perdurantism:** Part $P_1$ (at $t_1$) is bent. Part $P_2$ (at $t_2$) is straight. $P_1 \neq P_2$.
  *   **Strategy 1 Endurantism:** Object $O$ (wholly) is bent-at-$t_1$. Object $O$ (wholly) is straight-at-$t_2$. $O = O$.

  The "smuggling" charge is not that it introduces parts, but that it makes the object's intrinsic nature dependent on external relata (times). For a physicist, this might seem trivial (everything is in spacetime), but for a metaphysician, it threatens the idea that an object has a nature *of its own*. If you remove the time, does the object lose its shape? Strategy 1 says yes (because the property is a relation to that time). Strategy 2 says no (the property is intrinsic, it just doesn't obtain without a time).

  ### 3. The Cost for Eternalists vs. Presentists

  This is perhaps the most critical point for someone with your background. The "Problem of Temporary Intrinsics" is primarily a problem for **Eternalist Endurantists**.

  **The Presentist Escape:**
  Presentism holds that only the present moment exists.
  *   At $t_1$, $t_1$ exists. $O$ is bent. The proposition "$O$ is straight" is false (or lacks a truthmaker).
  *   At $t_2$, $t_1$ no longer exists. $O$ is straight. The proposition "$O$ is bent" is no longer true.
  *   **Result:** There is never a single ontological standpoint from which both "$O$ is bent" and "$O$ is straight" are true. The contradiction never arises because the conflicting times never co-exist.

  **The Eternalist Burden:**
  Eternalism (the block universe, consistent with GR) holds that $t_1$ and $t_2$ are equally real.
  *   Both times exist in the manifold.
  *   Therefore, the facts "$O$ is bent at $t_1$" and "$O$ is straight at $t_2$" are *both* true *simpliciter* from the perspective of the block.
  *   **Result:** If $O$ is wholly present at both, and both times are real, we have a genuine contradiction of incompatible properties inhering in the same substance unless we modify the logic of instantiation (via Strategy 1 or 2).

  **Why this is a "Cost":**
  As a physicist, you likely view Eternalism as a consequence of relativity (the relativity of simultaneity makes a universal "now" difficult to define). Presentism requires a preferred foliation of spacetime, which is anathema to standard GR.
  Therefore, the Endurantist who wants to be compatible with modern physics *must* be an Eternalist. But by accepting Eternalism, they inherit the Problem of Temporary Intrinsics. They must pay the theoretical cost of adopting complex relativizing strategies (1 or 2) to avoid contradiction. The Presentist avoids the metaphysical problem but pays a steep *physical* cost (rejecting the standard interpretation of spacetime).

  ### 4. Which Strategy Earns Its Keep?

  If forced to choose between the two endurantist strategies, **Strategy 2 (Relativizing Exemplification/Adverbialism)** is generally regarded as the more robust defense, though it is not without issues.

  *   **Why Strategy 2 is superior:** It respects the intuition that shape is intrinsic. A poker is bent in virtue of its own geometry, not in virtue of its relation to a time coordinate. Strategy 2 preserves this by keeping the property monadic. It treats time as the *context* of instantiation rather than a *constituent* of the property.
  *   **The Objection:** Critics argue that "instantiation-at-t" is a primitive, unanalyzed relation that is just as mysterious as the contradiction it solves. It modifies the "is" of predication, which some logicians find suspect.

  **My Assessment:**
  From the perspective of a theoretical physicist, **Perdurantism** remains the most parsimonious view. It aligns with the spacetime manifold ontology: objects are regions of spacetime, and "change" is variation along the timelike dimension. It dissolves the problem of temporary intrinsics without needing adverbial modifiers or relational properties.

  However, the reason the debate persists is that Perdurantism struggles to account for **diachronic identity** in a way that satisfies our normative and phenomenological practices. If I am a worldtube, why am I responsible for the actions of a temporal slice fifty years ago? Why do I fear *my* future pain rather than the pain of a future slice causally connected to me? Perdurantism has answers (psychological continuity, etc.), but they feel like reconstructions. Endurantism captures the *feeling* of being a persisting self, but at the cost of metaphysical complexity (Strategy 2) or tension with physics (Presentism).

  **Conclusion:**
  The distinction between the two strategies is the difference between making time a part of the *property* (Strategy 1) versus making time a part of the *fact* (Strategy 2). Strategy 2 is the stronger endurantist move because it preserves intrinsicality. However, the "serious cost" you noted is real: Eternalist Endurantism requires a more complex logic of instantiation than Perdurantism.

  Given your background, you might find that Perdurantism is the "natural kind" ontology of physics, while Endurantism is the "natural kind" ontology of agency and experience. The metaphysical dispute is essentially the friction between the View from Nowhere (spacetime) and the View from Here (conscious persistence). Neither strategy fully eliminates that friction; they merely manage it.
