      *   **Perdurantism (Lewis's preference):** $x$ has temporal parts $x_1$ and $x_2$. $x_1$ is $F$, $x_2$ is not-$F$. No contradiction.
      *   **Endurantism:** $x$ is wholly present at $t_1$ and $t_2$.
      *   **Strategy 1 (Adverbialism / Relationalism about Properties):** Properties are actually relations to times. Being bent is really *bent-at-t*.
      *   **Strategy 2 (Adverbialism / Relationalism about Exemplification):** Properties are monadic. Exemplification is relative. $x$ *has-at-t* the property of being bent.
      *   **Lewis's Objection to Strategy 1:** If "bent" is really "bent-at-t", then nothing is simply "bent". We lose the intuition that shape is intrinsic. It makes properties extrinsic (relations to times).
      *   **The User's specific confusion:** Strategy 1 and 2 sound the same ("F only relative to a time"). What's the real difference? And does Strategy 1 sneak in temporal parts?

  3.  **Address Question 1: Distinguishing the Two Strategies:**
      *   *Strategy 1 (Property Relativization):* The property itself changes nature. $P$ becomes $R(x, t)$. "Bent" is incomplete; "Bent-at-noon" is the real property.
      *   *Strategy 2 (Exemplification Relativization / Adverbialism):* The property stays monadic ($P$). The copula ("is") gets modified. "Is-at-noon".
