answer: |-
  This is a fantastic angle, and you are right to be wary of the gimmick. Douglass is too rigorous a thinker to be a mere mascot for either side of the modern debate. If you treat him as a "proto-originalist" or a "proto-living constitutionalist," you will flatten the very thing that makes his theory interesting: it is a **moral teleology wrapped in textualism.**

  To answer your specific question: Douglass would likely view modern originalism (Scalia/Thomas/Gorsuch) as a half-measure that captures his *method* (text over secret intent) but betrays his *purpose* (liberty as the default). He would see *Bostock* as a vindication of his approach and *Dobbs* as a reversion to the very "history and tradition" arguments he spent his life dismantling.

  Here is the breakdown of how Douglass would likely audit the current landscape.

  ### 1. Douglass vs. "Original Public Meaning"
  Douglass would agree with the originalists on the rejection of "secret intent." When he broke with Garrison, his core argument was that the *private* pro-slavery intentions of the framers were irrelevant because they failed to codify them in the *public* text. In that sense, he aligns with Scalia's rejection of legislative history and committee reports. He wants the law to be what is written, not what was whispered in the backroom.

  However, he would violently disagree with the originalist notion that the *public understanding* of 1787 (or 1868) freezes the moral application of the text.

  For Douglass, the text was not a fossil; it was a vessel. He argued that the Constitution's words ("liberty," "person," "justice") were capacious enough to contain a growing moral reality. Modern originalism asks, *"What did 'liberty' mean to a reasonable person in 1791?"* Douglass asks, *"What must 'liberty' mean today to satisfy the Preamble's promise of justice?"*

  He would likely argue that Scalia-style originalism makes the same mistake Garrison did: it binds the present to the prejudices of the past. Douglass's textualism was **presumptive**. He argued that because the text *could* be read as anti-slavery, it *must* be read as anti-slavery. Modern originalism claims to be value-neutral; Douglass's method was explicitly value-laden. He would tell Gorsuch or Thomas that a method of interpretation that claims neutrality in the face of injustice is itself a political act.

  ### 2. *Bostock* vs. *Dobbs*: The Douglass Audit
  This is where your hook gets really sharp. Douglass provides a lens that cuts across the conservative/liberal binary and instead judges cases based on **Textual Fidelity vs. Historical Positivism.**

  **On *Bostock* (Gorsuch):**
  Douglass would likely be Gorsuch's best friend in this opinion. *Bostock* is pure Douglassian textualism.
  *   **The Method:** Gorsuch explicitly ignores the "original intent" of the 1964 Congress (who almost certainly did not intend to protect LGBTQ+ employees). He focuses strictly on the text: "because of sex."
  *   **The Logic:** If you fire a man for being attracted to men, but wouldn't fire a woman for the same attraction, the sex of the employee is the cause. The text dictates the result, regardless of the expected social outcome.
  *   **Douglass's Take:** This mirrors Douglass's Glasgow speech argument. Douglass argued that even if the framers *intended* to protect slavery, the text they wrote ("persons," "citizens") did not authorize it. Therefore, the text wins over the intent. Douglass would see *Bostock* as a victory for the "paper itself" over the "private expectations" of the legislators.

  **On *Dobbs* (Alito):**
  Douglass would likely view *Dobbs* as a constitutional catastrophe, not just for the outcome, but for the *hermeneutic*.
  *   **The Method:** *Dobbs* relies heavily on "history and tradition." It asks whether the right to abortion is "deeply rooted in this Nation's history and tradition."
  *   **The Logic:** Because the specific right wasn't recognized in the past, it isn't protected by the 14th Amendment's "liberty."
  *   **Douglass's Take:** This is the Garrisonian trap. Remember, Douglass spent his career arguing that **slavery** was deeply rooted in American history and tradition. If you judge the Constitution by "history and tradition," you get slavery. You get coverture. You get subjugation.
  *   Douglass argued that the Constitution exists *to break* the chains of history, not to codify them. He viewed the 14th Amendment (which he championed) as a "new founding" that repudiated the prior history of racial caste. To use "history and tradition" to limit the scope of "liberty" is to allow the ghost of the pre-14th Amendment past to veto the text of the 14th Amendment. He would argue *Dobbs* privileges the *practice* of the past over the *principle* of the text.

  ### 3. The "Living" Misconception
  You noted Douglass sounds like a living constitutionalist when he talks about "keeping pace with civilization." It is crucial to distinguish his view from the modern "living constitution" theory (often associated with Brennan or Breyer).

  Modern living constitutionalism often suggests the *meaning* of the text evolves with societal values. Douglass didn't think the *meaning* of "liberty" changed; he thought our *understanding* of its requirements deepened.
  *   **Modern Living Constitutionalism:** "The text means X today, even if it meant Y yesterday."
  *   **Douglass:** "The text always meant Liberty. Yesterday we were too blind to see that Liberty included Black people. Today we see it. Tomorrow we may see it includes more."

  He was a **Fixed Principle / Evolving Application** theorist. This puts him at odds with modern originalists (who fix the application) and modern living constitutionalists (who sometimes loosen the principle).

  ### 4. The Verdict for Your Piece
  If you use Douglass as a hook, the punchline isn't that he solves the debate. It's that he exposes the bad faith in both camps.

  *   **To the Originalists:** He would say, "You claim to follow the text, but you hide behind 'history and tradition' to uphold inequalities the text's broad principles were designed to destroy. You are treating the Constitution as a contract with the dead, not a charter for the living."
  *   **To the Living Constitutionalists:** He would say, "You claim the text is too old to matter, but you ignore that the text itself contains the moral engine (the Preamble) that drives progress. You don't need to update the Constitution; you need to finally read it."

  **The specific hook you might use:**
  Douglass would likely look at *Bostock* and *Dobbs* and declare that only one of them is actually being "textualist." *Bostock* follows the words where they lead, even into uncomfortable social terrain. *Dobbs* follows the words only as far as historical prejudice allows.

  In Douglass's eyes, **Originalism that relies on 'history and tradition' is just Garrisonism in conservative clothing.** It is an admission that the "paper itself" is insufficient, so we must consult the "agreement with hell" that existed outside of it.

  He would tell your editor that the fight isn't between "dead text" and "living meaning." It's between a Constitution that is a **mirror** (reflecting the prejudices of the past, as in *Dobbs*) and a Constitution that is a **compass** (pointing toward a justice not yet fully realized, as in *Bostock* and his own antislavery arguments). He was a compass man.

  ### A Note on Sources for Your Piece
  If you need to cite the specific Glasgow speech, it is titled *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"* (March 26, 1860). The key quote regarding your argument is:
  > *"I hold that the Constitution of the United States... is a glorious liberty document... I have no hesitation in saying that the Constitution of the United States... knows no man by the color of his skin."*

  And on the "history and tradition" point, look at his *"Lecture on Slavery"* (1855), where he argues that custom and usage cannot legitimize what is morally wrong, and therefore cannot legitimize what is constitutionally forbidden.

  **Summary for your Editor:**
  Douglass isn't an originalist or a living constitutionalist. He is a **Moral Textualist**. He would endorse *Bostock* (text over intent) and reject *Dobbs* (history over text). He proves that "textualism" doesn't inherently lead to conservative results; it depends on whether you read the text as a cage for liberty or a vehicle for it.
