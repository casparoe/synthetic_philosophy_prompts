prompt: |-
  I got roped into giving our university's Constitution Day talk this year (I'm in philosophy, not history or law, which is apparently why they want it 'more conceptual'). It's a weird crowd -- a couple hundred undergrads there for extra credit, a handful of law students, and a few history colleagues who'll catch every reference. I want to build it around Frederick Douglass's turn on the Constitution: he starts out with Garrison thinking the document's rotten to the core, a 'covenant with death,' then comes around to arguing that read on its own words -- not on what the framers actually meant or practiced -- its a fundamentally antislavery text. That's really a fight about how your allowed to read an old legal document, and I want the speech to get at that without turning into a con law lecture. The one thing I don't want is for it to just hand Douglass to one side of the current originalism-vs-living-constitution fight, since both camps like to claim him now. Can you draft me something like 8-10 minutes that does this and still lands for the extra-credit crowd, not just the law students?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Philosophy professor (not history or law).
      *   **Audience:** Mixed bag (undergrads seeking extra credit, law students, history colleagues). Needs to be accessible but intellectually rigorous.
      *   **Topic:** Frederick Douglass's changing view of the US Constitution (from "covenant with death" to antislavery document).
      *   **Core Theme:** Hermeneutics/Interpretation of legal texts (how we read old documents).
      *   **Constraint:** Do *not* simply claim Douglass for one side of the modern Originalism vs. Living Constitution debate (both claim him).
      *   **Tone:** Conceptual, engaging, not a dry con law lecture.
      *   **Length:** 8-10 minutes (roughly 1,000 - 1,300 words spoken at a moderate pace).
      *   **Occasion:** University Constitution Day talk.

  2.  **Deconstruct the Core Argument:**
      *   *Douglass's Shift:* Early Douglass (Garrisonian) = Constitution is pro-slavery because of the intent/context. Later Douglass = Constitution is anti-slavery because of the text itself.
      *   *The Philosophical Hook:* This isn't just about slavery; it's about *authority* and *meaning*. Where does meaning live? In the hearts of the authors? In the ink on the page? In the hands of the readers?
      *   *Avoiding the Trap:* Originalists say Douglass became an originalist (text/intent). Living Constitutionalists say Douglass embraced the evolving promise. The speech needs to show Douglass transcends this binary. He was a *moral reader*. He read for *justice*, not just historical accuracy or evolving norms.
      *   *Audience Engagement:* Undergrads need stories and clear stakes. Law/History folks need nuance. Philosophy angle = epistemology/ethics of reading.

  3.  **Drafting - Section by Section:**

      *   **Introduction (1-2 mins):** Acknowledge the awkwardness (Philosopher on Constitution Day). Hook the audience with the Douglass pivot. Set the stage: 1840s vs. 1850s.
      *   **The Garrisonian View (2 mins):** Explain *why* he hated it initially. The "covenant with death." Focus on the *context* (the framers, the compromises). This resonates with "original intent" but for moral condemnation.
      *   **The Turn (2-3 mins):** What changed? Research, close reading. The text *itself* doesn't say "slave." It uses euphemisms ("persons held to service"). Douglass realizes the text is a weapon *if* wielded correctly.
      *   **The Philosophical Pivot (2-3 mins):** This is the meat. How do we read?
          *   Option A: Mind of the Framer (Originalism).
          *   Option B: Spirit of the Age (Living Constitution).
          *   Douglass's Option C: The Moral Imperative of the Text. He treats the Constitution as a *promise* that demands enforcement. It's not about what they *meant*, but what the words *do*.
      *   **Conclusion (1-2 mins):** Bring it to the students. Why does this matter today? It's about agency. We aren't just reading history; we are inhabiting a document. End on a strong note about responsibility.

  4.  **Refining the Tone:**
      *   *Avoid Jargon:* No "hermeneutics," "ontological," etc., unless explained simply.
      *   *Pacing:* Use pauses (marked in script). Use rhetorical questions.
      *   *Addressing the Room:* Acknowledge the history colleagues (nod to accuracy) and the undergrads (nod to relevance).
      *   *Navigating the Trap:* Explicitly state that claiming Douglass for one modern team misses the point. He was fighting slavery, not winning a law review debate.

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add more Douglass voice. Quote him. "I prefer to be true to myself..."
      *   *Critique:* Is it too long?
      *   *Fix:* Keep the legal theory abstract. Focus on the *act* of reading.
      *   *Critique:* Did I avoid the Originalism trap?
      *   *Fix:* Make sure to emphasize that Douglass didn't care about the *framers' hearts*, he cared about the *text's power*. That distinguishes him from strict original intent, but also from pure living constitution (he stuck to the text).

  6.  **Final Polish (incorporating into the final output):**
      *   Check word count (aiming for ~1,200 words for 8-10 mins).
      *   Ensure the philosophy background shines through (focus on interpretation/meaning).
      *   Make sure the ending lands for the "extra credit" crowd (give them something to take away).

  7.  **Final Review against constraints:**
      *   Philosophy prof persona? Yes.
      *   Douglass shift? Yes.
      *   Not just Originalism vs. Living? Yes.
      *   Accessible? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't imply Douglass was naive about the framers. He knew they were compromised. His point was that the *text* escaped their intentions. That's a crucial philosophical distinction about language having autonomy. I will highlight that.

  8.  **Final Word Count Check:** A spoken minute is roughly 130-150 words. 8-10 minutes = 1,040 to 1,500 words. I will aim for the middle, around 1,250 words.

