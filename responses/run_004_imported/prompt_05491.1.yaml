answer: |-
  **Title:** The Weapon in the Ink: Frederick Douglass and the Ethics of Reading
  **Time:** Approx. 8–10 Minutes
  **Speaker:** Philosophy Faculty

  **(Start)**

  Good morning. I'll admit, when the invitation for Constitution Day came to my office in the Philosophy Department, I paused. Usually, on a day like this, you expect a historian to tell you what happened in 1787, or a legal scholar to tell you what happened in the Supreme Court yesterday.

  I'm neither. I study how we make meaning. I study how we read.

  And that is actually why I want to talk to you about Frederick Douglass. Not the Douglass of the autobiographies, though he is magnificent there. I want to talk about Douglass the *reader*. Because Douglass's journey with the Constitution is one of the most dramatic shifts in American intellectual history. And it forces us to ask a question that is much bigger than constitutional law. It asks: When we pick up an old text—a holy book, a law, a constitution—where do we look for its truth?

  In the early 1840s, Douglass was a disciple of William Lloyd Garrison. And Garrison had a very clear theory of reading. He looked at the Constitution and saw a "covenant with death and an agreement with hell."

  Why? Because Garrison—and the early Douglass—believed that to understand a document, you must understand the *hearts* of the men who wrote it. They looked at the context. They looked at the Three-Fifths Compromise. They looked at the Fugitive Slave clauses. They looked at the fact that many framers were enslavers. And they concluded: The intent was pro-slavery. Therefore, the document is pro-slavery.

  For the young Douglass, this was morally clean. If the tree is rotten, eat none of its fruit. He argued for disunion. He said, "Let the North separate from the South." To him, interpreting the Constitution as an antislavery document was a lie. It was dishonest to pretend a thing built on compromise was pure.

  I want you to feel the weight of that position. It is the position of moral consistency. And for a long time, it was the position of Frederick Douglass.

  But then, around 1851, something changed. Douglass broke with Garrison. He announced that the Constitution, read on its own terms, was actually a "glorious liberty document."

  Now, this is where the law students and my history colleagues in the audience might lean forward. They want to know: Did Douglass become an Originalist? Did he think the Framers secretly hated slavery? Or did he become a proponent of a "Living Constitution," reading his own values into an old text?

  Here is the philosophical trap: Both sides today claim him. Originalists love the later Douglass because he focused on the *text* rather than the context. Living Constitutionalists love the later Douglass because he saw the document as evolving toward justice.

  But I suggest to you that claiming Douglass for either modern team misses the point. Douglass wasn't trying to win a law review debate. He was trying to end slavery. And in doing so, he developed a third way of reading.

  Douglass realized that once words are written down, they escape the author. This is a philosophical insight about language. When James Madison put ink to paper in 1787, he lost control of what those words could *do*.

  Douglass noticed that the word "slave" does not appear in the Constitution. Not once. It uses euphemisms. "Persons held to service." "Other persons." Douglass argued that if you read the text strictly, without bowing to the secret intentions of the framers, the document provides no federal protection for property in humans. In fact, he argued, the preamble—"We the People"—includes everyone. The powers granted to the federal government are all powers to *protect* liberty, not destroy it.

  So, was he ignoring history? No. He knew the history. He knew the framers compromised. But he made a radical distinction between the *motives* of the writers and the *powers* of the text.

  He wrote: "I prefer to be true to myself, even at the hazard of incurring the ridicule of others, rather than to be false, and incur my own abhorrence."

  For Douglass, the "true" reading of the Constitution wasn't the one that matched the historical record of 1787. The "true" reading was the one that aligned with the moral law written on the human heart. He treated the Constitution not as a contract to be dissected, but as a promise to be enforced.

  Think about what this means for us, sitting here today.

  We often think of interpretation as a passive act. We think our job is to dig up what the author *meant*, like archaeologists brushing dust off a bone. Douglass teaches us that reading is an *active* act. It is a wieldable tool.

  If you read the Constitution only through the eyes of the framers, you are bound by their limitations. You are bound by their blindnesses. If the framers could not imagine women voting, or Black people governing, then a strict "original intent" reading locks those exclusions in place forever.

  But if you read the Constitution only as a mirror for your own modern values, the text loses its anchor. It becomes whatever you want it to be.

  Douglass walked the razor's edge between them. He said: Look at the text. Respect the text. But demand that the text live up to its own highest claims. He used the words the framers wrote to dismantle the system the framers built. He turned their own weapon against them.

  Why does this matter for a room full of undergrads, many of whom are here for extra credit? (I see you, and I don't blame you).

  It matters because you are going to inherit texts. You will inherit institutions, traditions, laws, and family histories that were written by people who were flawed. People who compromised. People who might have gotten things wrong.

  You have two choices.

  Choice one is the Garrison choice. You say, "This system is rotten. The founders were hypocrites. The text is tainted. I reject it." There is honor in that. It is clean. But it leaves you outside the house, shouting at the windows.

  Choice two is the Douglass choice. You say, "This text is flawed in its history, but potent in its potential. I will enter the house. I will take the keys they gave me. And I will use the rules of this house to make it a home for everyone."

  That is a harder path. It requires you to be sophisticated enough to know the history, but brave enough to transcend it. It requires you to understand that meaning is not just found; it is *made*.

  When Douglass stood on the lecture circuit and argued that the Constitution was antislavery, he wasn't lying. He was performing an act of moral imagination. He was saying that the authority of the law does not come from the dead hand of the past. It comes from the living hands of those who interpret it today.

  So, on this Constitution Day, I am not asking you to memorize the preamble. I am asking you to think about how you read the world.

  When you encounter an old rule, a tradition, or a law that seems to stand in the way of justice, do you walk away? Or do you look closer? Do you ask: "Is there a way to read this that makes it truer than its authors knew?"

  Douglass teaches us that the text is not a cage. It is a lever. And the fulcrum is your own moral courage.

  The Constitution is not a relic. It is a conversation. And the question Douglass puts to us is not "What did they mean?" The question is, "What will we do with these words now?"

  Thank you.

  **(End)**
