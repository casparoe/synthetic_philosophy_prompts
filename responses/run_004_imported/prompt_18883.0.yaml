prompt: |-
  I'm about a third of the way into a novel and I've hit a research snag more than a writing one. One of my POV characters, a mid-career lawyer named Priya, sits on a fictional national Law Reform Commission, and a whole subplot turns on a vote the commission takes on whether to recommend repealing an old public-decency statute as its being applied to a new fad: licensed, consensual "extreme modification" parlors doing voluntary branding, tongue-splitting, subdermal implants, that kind of thing, for adults who show up sober and sign a mountain of waivers. I want to actually put the commission's internal memo on the page -- the one Priya drafts the night before the vote -- and it needs to hold up as a real piece of institutional writing, not just a monologue dressed up as a document.

  Years ago I audited a jurisprudence seminar and we spent a week on the old Hart-Devlin fight that came out of the Wolfenden Report -- Devlin's argument that a shared morality is part of what holds a society together and that the law can step in to protect it even where nobody's been harmed in the Millian sense, versus Hart's response that this proves a lot less than Devlin thinks it does. That's basically the shape of the disagreement happening on my fictional commission, just relocated from what Wolfenden was actually dealing with to body-mod parlors, and I'd love the memo to genuinely channel that fight rather than a generic "some people are uncomfortable with this" vibe.

  Could you draft the memo? I need Priya to actually land somewhere -- repeal, keep the statute as-is, or license-and-regulate as a middle path -- with a concrete timeline attached, and whichever way she comes down, I need her to take the other side's strongest version seriously, not the strawman where its just squeamishness, since a couple of the other commissioners (and probably a chunk of my readers) are going to find that side more compelling than she expects going in.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Context:** A novel in progress (1/3 done).
      *   **Character:** Priya, mid-career lawyer, member of a fictional national Law Reform Commission.
      *   **Task:** Draft an internal commission memo regarding a vote on repealing an old public-decency statute as applied to licensed "extreme modification" parlors (branding, tongue-splitting, implants, etc., for consenting sober adults).
      *   **Intellectual Core:** Needs to channel the Hart-Devlin debate (Wolfenden Report era).
          *   *Devlin:* Law can enforce shared morality/social cohesion even without direct harm to others.
          *   *Hart:* Legal moralism is dangerous; individual liberty should prevail unless there's harm to others.
      *   **Requirements:**
          *   Must look/feel like a real institutional document (not just a monologue).
          *   Priya must take a clear stance (Repeal, Keep, or Regulate).
          *   Must include a concrete timeline.
          *   Must steelman the opposing view (no strawmanning the moralist argument).
          *   Priya needs to acknowledge the strength of the opposing argument (since other commissioners/readers might agree with it).

  2.  **Determine Priya's Stance:**
      *   *Option A (Repeal/Full Liberty):* Easiest for a "progressive" lawyer, but might make the conflict too simple.
      *   *Option B (Keep/Enforce Morality):* Interesting twist, but might make her unsympathetic depending on the genre.
      *   *Option C (License-and-Regulate/Middle Path):* This feels most like a *lawyer's* solution. It acknowledges the Devlin concern (social cohesion/standards) while respecting the Hartian liberty interest. It allows for nuance. Let's go with this. It shows she's pragmatic but principled.
      *   *Decision:* Priya recommends a **Regulatory Framework (Licensing)** rather than outright repeal or total prohibition. This allows her to acknowledge the "harm to society" argument while mitigating it through safeguards.

  3.  **Structure of a Law Reform Commission Memo:**
      *   **Header:** To, From, Date, Subject, File Reference.
      *   **Executive Summary/Recommendation:** The bottom line up front.
      *   **Background/Context:** The statute in question, the emerging industry.
      *   **Legal & Philosophical Analysis:** The meat of the Hart-Devlin debate.
      *   **Consideration of Counter-arguments:** Steelmanning the opposition.
      *   **Proposed Framework/Timeline:** The concrete steps.
      *   **Conclusion:** Final plea for the vote.

  4.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. "National Law Reform Commission," "Internal Memorandum," "Confidential/Draft."
      *   **Subject:** Needs to be specific. "Re: Application of Public Decency Statute 19XX to Consensual Adult Body Modification."
      *   **Opening:** State the recommendation clearly.
      *   **The "Devlin" Argument (The Opposition):** This needs to be strong. It's not just "ew, gross." It's about the *fabric of society*. If the law doesn't mark certain boundaries, do we lose a shared understanding of human dignity? Priya needs to validate this. *Key phrase idea:* "The law as a teacher of norms."
      *   **The "Hart" Argument (Her Leanings):** Autonomy, consent, the limits of state power over the self. But she can't just say "my body my rights." She needs to address why the Devlin point doesn't *quite* win here.
      *   **The Synthesis (The Recommendation):** Regulation. We allow it, but we treat it like surgery or hazardous materials. This acknowledges the risk (validating Devlin) without banning it (validating Hart).
      *   **Timeline:** Needs to be realistic. Consultation period, draft regulations, sunset clause for the old statute.
      *   **Tone:** Professional, precise, slightly academic but actionable. No flowery prose, but clear reasoning.

  5.  **Refining the Hart-Devlin Nuance:**
      *   *Devlin:* "Disintegration thesis." If morality loosens, society falls.
      *   *Priya's rebuttal:* Society is pluralistic now. Disintegration comes from *coercion*, not diversity.
      *   *Devlin's strength:* Some acts are so extreme they commodify the human body in a way that hurts *everyone's* status.
      *   *Priya's concession:* She admits this is the strongest point against her. That's why regulation is needed—to ensure it doesn't become exploitative.

  6.  **Writing - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add some specific references to the "modification" types (tongue splitting, branding) so it feels grounded in the novel's reality.
      *   *Critique:* Is the timeline concrete?
      *   *Fix:* Add specific months/quarters.

  7.  **Writing - Iteration 2 (Focusing on Voice):**
      *   Priya is mid-career. She's ambitious but careful. She wants her colleagues to respect her. The memo should sound like she's trying to build a consensus, not just dictate. She should use "The Commission" language, not just "I think."

  8.  **Final Polish:**
      *   Check the legal terminology (statutory construction, *parens patriae*, police power).
      *   Ensure the "Wolfenden" echo is clear to those who know it, but understandable to those who don't.
      *   Make sure the recommendation is distinct.

  **(Self-Correction during drafting):** I initially thought about having her recommend repeal. But if she recommends *regulation*, it shows she takes the Devlin argument seriously enough to impose safety standards, which fits the prompt's requirement to "take the other side's strongest version seriously." A pure repeal might look like she dismissed the moral harm argument entirely. Regulation acknowledges the risk.

  Let's write the memo.

  *   **Header:** Standard gov format.
  *   **Subject:** Statute 44-B (Public Decency) vs. Body Mod.
  *   **Recommendation:** Conditional Licensing.
  *   **Analysis:** Explicitly reference the "moral ecology" argument.
  *   **Timeline:** 18-month rollout.

  9.  **Final Review against constraints:**
      *   Institutional writing style? Yes.
      *   Hart-Devlin channeling? Yes.
      *   Concrete stance? Yes (Regulate).
      *   Timeline? Yes.
      *   Steelman opposition? Yes.

