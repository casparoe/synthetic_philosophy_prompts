answer: |-
  **NATIONAL LAW REFORM COMMISSION**  
  **INTERNAL MEMORANDUM**  
  **CONFIDENTIAL – DRAFT FOR COMMISSIONER REVIEW**

  **TO:** The Commissioners  
  **FROM:** Priya Desai, Commissioner  
  **DATE:** October 14, 202X  
  **RE:** Recommendation Regarding the Application of Public Decency Statute 44-B to Consensual Adult Body Modification Practices  
  **FILE REF:** NLRC-202X-09 (Working Group on Bodily Autonomy)

  ### I. EXECUTIVE SUMMARY

  This memo serves as the primary briefing document ahead of the Commission's vote scheduled for October 20. It addresses the petition to exempt licensed "extreme modification" parlors (branding, bifurcation, subdermal implantation) from prosecution under Public Decency Statute 44-B.

  **Recommendation:** The Commission should **not** recommend a full repeal of Statute 44-B as it applies to these practices. Nor should we recommend total enforcement of the status quo. Instead, I propose a **Third Path**: a statutory amendment establishing a rigorous federal licensing and regulatory framework for extreme modification, coupled with a sunset clause for criminal penalties where compliance is met.

  This approach acknowledges the state's interest in the moral ecology of the public sphere while respecting the liberty interest of the sovereign adult.

  ### II. LEGAL AND PHILOSOPHICAL CONTEXT

  The core tension before this Commission is not merely medical safety or contract law; it is jurisprudential. We are revisiting the fundamental question posed during the Wolfenden era: *Is the enforcement of a shared morality a legitimate function of the criminal law, even in the absence of direct harm to non-consenting third parties?*

  **A. The Argument for Enforcement (The "Disintegration" Thesis)**
  Colleagues who favor maintaining the current ban argue from a position of legal moralism. Their position is not rooted in simple squeamishness or religious dogma, and it would be an error to dismiss it as such. The argument is that the law functions as a teacher of norms. By refusing to mark certain alterations to the human form as beyond the pale, the state implicitly signals that the body is mere raw material, fully commodifiable.

  The strongest version of this argument posits that a society requires a shared conception of human dignity to maintain cohesion. If the law permits citizens to permanently mutilate themselves for aesthetic or subcultural reasons, it erodes the baseline assumption of bodily integrity that underpins our broader laws against assault and battery. To allow this is to risk a slow disintegration of the social fabric, where the "harm" is not to a specific victim, but to the collective moral boundary that holds the community together. This is a coherent, serious constitutional argument regarding the police power of the state.

  **B. The Argument for Liberty (The "Harm" Principle)**
  Conversely, the petitioners argue from the liberal tradition. They contend that in a pluralistic society, there is no single "shared morality" to enforce. The "disintegration" thesis assumes a homogeneity that no longer exists. Where adults are sober, psychologically evaluated, and fully consenting, the state's intrusion is paternalistic overreach. The harm principle suggests that without a victim, there is no crime. To criminalize these acts is to grant the state ownership over the citizen's flesh.

  ### III. ANALYSIS AND SYNTHESIS

  Both positions hold water, which is why a binary vote (Repeal vs. Maintain) is insufficient.

  If we vote for full **Repeal**, we validate the Hartian liberty interest but ignore the legitimate societal concern regarding the commodification of the body. We risk creating a regulatory vacuum where "consent" is coerced by economic desperation or unchecked by medical reality.

  If we vote for **Total Enforcement**, we validate the Devlin-style moral cohesion argument but at the cost of criminalizing a growing subculture and driving the practice underground, where infection and coercion are already rampant.

  **The Regulatory Middle Path**
  I recommend we treat extreme modification not as a *moral* failing, nor as a *consumer* service, but as a **quasi-medical procedure**.

  This validates the "moralist" concern by acknowledging that these acts carry weight beyond a simple haircut—they are permanent, risky, and alter the human vessel. Therefore, the state has an interest in regulating *how* they are done. However, it validates the "libertarian" concern by allowing competent adults to proceed, provided strict safeguards are met.

  By moving this from the *Penal Code* to the *Administrative Code*, we remove the stigma of criminality without granting the stamp of normalcy. We acknowledge the risk without prohibiting the choice.

  ### IV. PROPOSED FRAMEWORK & TIMELINE

  I propose the Commission draft a recommendation for the "Bodily Integrity and Modification Safety Act" (BIMSA). The key provisions would include:

  1.  **Mandatory Cooling-Off Period:** 30 days between consultation and procedure.
  2.  **Psychological Clearance:** Independent evaluation to rule out Body Dysmorphic Disorder or acute crisis.
  3.  **Medical Licensing:** Practitioners must hold sterile-surgical certification equivalent to tattooing plus nursing adjuncts.
  4.  **Informed Consent:** Waivers must be witnessed by a notary and a medical professional, explicitly stating the state does not endorse the procedure.

  **Implementation Timeline:**

  *   **Phase 1 (Months 1-6):** Drafting of BIMSA regulations. Public comment period specifically soliciting testimony from both civil liberties groups and community morality organizations.
  *   **Phase 2 (Months 7-12):** Establishment of the Oversight Board. Grandfathering of existing parlors that can prove sterile compliance.
  *   **Phase 3 (Month 18):** Full enforcement of licensing. Criminal penalties under Statute 44-B are lifted for compliant providers; non-compliant providers face Class C felonies.
  *   **Phase 4 (Year 3):** Commission review of public health data to assess if regulation has mitigated the "social harm" concerns raised by the opposition.

  ### V. CONCLUSION

  I anticipate significant disagreement on this draft. Specifically, I expect Commissioner Halloway and Commissioner Vance to argue that regulation legitimizes an inherently degrading act. I want to go on the record stating that I hear that argument. I agree that the law has a role in upholding human dignity.

  However, I disagree that dignity is best served by driving these practices into the shadows. Dignity is served by ensuring that when a citizen alters their form, they do so with eyes wide open, in a sterile environment, free from coercion. We cannot legislate away the desire for modification. We can only legislate the conditions under which it occurs.

  I request that my colleagues review this framework prior to the 20th. I am prepared to amend the cooling-off period or licensing thresholds to secure a majority vote, but I cannot support a return to the status quo.

  **Attachments:**
  *   *Draft Statutory Language (BIMSA v.4)*
  *   *Comparative Analysis: Regulatory Models in Nevada and Oregon*
  *   *Summary of Public Testimony (Sept 202X)*

  ***

  **Priya Desai**  
  Commissioner  
  National Law Reform Commission
