answer: |-
  This is a fantastic question. It cuts right to the heart of why engineering heuristics often clash with philosophical rigor.

  As a software engineer, your intuition is correct: **In a low-stakes, high-trust, closed-loop system (like your team), your normalization trick works well enough.** It solves the "harsh grader" problem and gets the product shipped.

  However, economists and philosophers don't treat this as a solved problem because when you scale that same algorithm from **feature requests** to **human welfare**, three specific technical constraints break down.

  Here is the breakdown of why the "min-max normalization" trick fails in moral philosophy and welfare economics.

  ### 1. The Anchor Problem (Undefined Min/Max)
  Your algorithm relies on `min` and `max`.
  `normalized_score = (raw_score - user_min) / (user_max - user_min)`

  In your ticketing system, `0` and `10` are defined by the system. Everyone knows what "Priority 0" and "Priority 10" mean in the context of the codebase.

  In human experience, there are no global anchors.
  *   **Person A** has lived a life of moderate comfort. Their "10" is the best day they've ever had (maybe a promotion + a good meal).
  *   **Person B** has lived a life of extreme trauma but also experienced moments of transcendent joy. Their "10" is a spiritual peak Person A cannot conceive of.

  If you ask them to rate their current suffering on a 1–10 scale:
  *   Person A rates a broken arm as a **9**. (It's the worst thing they know).
  *   Person B rates a broken arm as a **3**. (They've experienced childbirth, war, etc.).

  If you min-max normalize this, you are assuming that Person A's "worst conceivable pain" is equivalent to Person B's "worst conceivable pain." **It isn't.** You aren't normalizing their *scales*; you are normalizing their *vocabularies*. Without a biological or neurological "standard candle" for pain/pleasure, you cannot calibrate the sensors.

  ### 2. The Linearity Assumption
  Min-max normalization assumes the distance between 1 and 2 is the same as the distance between 9 and 10. In math terms, it assumes utility is **linear**.

  Psychophysics (the study of the relationship between physical stimuli and sensation) tells us this is false.
  *   The difference between \$0 and \$1,000 is life-saving for a starving person.
  *   The difference between \$1,000,000 and \$1,001,000 is negligible for a billionaire.

  If both rate the marginal utility of \$1,000 as a "10", your normalization treats the gain as equal. But in welfare economics, we care about the *magnitude* of the feeling, not just the rank order. Your algorithm preserves the *order* of preferences perfectly, but it destroys the *magnitude* of intensity, which is exactly what Effective Altruism needs to compare (e.g., "Is curing blindness better than preventing death?").

  ### 3. The Incentive Compatibility Problem (Game Theory)
  At work, your teammates are roughly aligned. If they game the system by rating everything "10", the product suffers, and they suffer. There is a feedback loop.

  In global aid or policy:
  *   If I am a region seeking aid, and I report my suffering as a "5", I get less money.
  *   If I report it as a "10", I get more money.

  Rational actors will all report "10".
  When everyone reports "10", your `user_max` equals `raw_score`.
  The formula becomes `(10 - 0) / (10 - 0) = 1`.
  **Everyone normalizes to 1.** The signal is lost.

  Philosophers call this the problem of **strategic misreporting**. Unless you have a "truth serum" or a way to verify the internal state (which we don't), self-reported utility is vulnerable to inflation. Your team avoids this because of social trust and shared goals; the world does not have that.

  ### 4. Scope Insensitivity
  Humans are terrible at scaling numbers to magnitude. This is a known cognitive bias.
  If you ask people:
  1.  How much would you pay to save 1 bird from an oil spill?
  2.  How much would you pay to save 10,000 birds?

  People often give roughly the same "1-10" intensity rating. Their emotional brain sees "Sad Bird" and maxes out the "Sadness" meter. It doesn't multiply by 10,000.

  If you use normalized self-reports to decide where to donate, you might allocate equal resources to saving 1 person and saving 1,000 people, because the *emotional intensity* of the request is the same. EA tries to fight this with "QALYs" (Quality-Adjusted Life Years), which is essentially an attempt to create an objective, non-self-reported metric to bypass this human scaling error.

  ### So, what do philosophers actually do?
  They don't say it's *metaphysically* impossible; they say it's **epistemically inaccessible** without heavy assumptions.

  1.  **Revealed Preference:** Economists often ignore what people *say* and look at what they *do*. (If Person A walks 5 miles for water and Person B drives 5 minutes, we infer water is 'more costly' for A). But this fails for things you can't choose (like being born with a disability).
  2.  **Physical Proxies:** This is the EA approach. Instead of asking "How happy are you?", we measure cortisol levels, life expectancy, income, or disability weights (DALYs). We assume that *biological markers* are more comparable than *self-reports*.
  3.  **Harsanyi's Aggregation:** Some utilitarian philosophers (like John Harsanyi) argue we *must* assume interpersonal comparability to function, so we act *as if* your normalization trick works, while acknowledging the error bars are huge.

  ### The Engineering Translation
  Think of interpersonal utility comparison like **distributed system clock synchronization**.

  *   **Your team:** You are on the same LAN. NTP (Network Time Protocol) works fine. You can sync clocks (utilities) easily.
  *   **The World:** You are trying to sync clocks across light-years with high latency, packet loss, and malicious nodes.

  Your min-max trick is a valid **heuristic** for a closed system. Philosophers treat it as an unsolved problem because in an open system, the **calibration data is missing**, the **sensors are untrusted**, and the **transfer function is non-linear**.

  In EA, this is why there is so much focus on "cause neutrality" and rigorous metrics. They are trying to build an external oracle because they know the internal sensors (human self-reports) are uncalibrated.
