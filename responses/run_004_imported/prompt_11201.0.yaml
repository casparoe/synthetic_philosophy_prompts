answer: |-
  **MEMORANDUM**

  **TO:** State Gaming Control Board, Full Commission
  **FROM:** Voluntary Self-Exclusion Program (VSEP) Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Petition for Reinstatement (Case #VSEP-2021-089) and Policy Recommendation Regarding Lifetime Exclusion Terms

  ### I. Purpose
  The purpose of this memo is to convey the Subcommittee's ruling on a petition for reinstatement filed by a participant currently enrolled in the Lifetime tier of the Voluntary Self-Exclusion Program (VSEP). Additionally, this memo provides a policy recommendation regarding the establishment of a formal early-release process for future Lifetime exclusions and outlines the ethical and clinical rationale underpinning this recommendation.

  ### II. Case Background
  **Petitioner:** Male, enrolled in VSEP Lifetime tier two years ago.
  **Circumstances of Exclusion:** At the time of enrollment, the petitioner reported severe financial insolvency, loss of marital relationship, and psychological distress directly attributed to compulsive gambling behavior. He explicitly selected the "Lifetime" option, acknowledging the regulatory stipulation that this designation is irrevocable.
  **Basis of Petition:** The petitioner cites successful completion of a 12-month cognitive behavioral therapy program and a formal assessment by a licensed clinical psychologist stating he no longer meets the DSM-5 criteria for Gambling Disorder. He requests reinstatement of gaming privileges.
  **Subcommittee Vote:** The vote to deny the petition and recommend against a general early-release policy was 4-1.

  ### III. Decision on Pending Petition
  **Ruling:** **DENIED.**

  The Subcommittee denies the petition for reinstatement. This decision is not a reflection on the petitioner's personal progress, which we acknowledge and commend. Nor is it a judgment on the validity of his psychologist's assessment.

  The decision rests on the regulatory integrity of the VSEP contract. When the petitioner enrolled, he entered into a binding agreement with the State and its licensees that the Lifetime exclusion was absolute. To revoke this term retroactively alters the conditions of the program after the fact. While the petitioner's health has improved, the VSEP is not merely a clinical tool; it is a regulatory barrier designed to function independently of a participant's fluctuating self-assessment. Upholding the original terms is necessary to maintain the enforceability of all future exclusion agreements.

  ### IV. Policy Recommendation: Early-Release Process
  **Recommendation:** The Subcommittee recommends **against** establishing a formal early-release process for the Lifetime tier of the VSEP at this time.

  While we recognize the value of rehabilitation, the Lifetime tier must remain distinct from the one-year and five-year tiers. We recommend the following adjustments to the program instead:
  1.  **Enhanced Pre-Enrollment Counseling:** Mandate a brief consultation with a problem gambling specialist *before* a participant selects the Lifetime option, ensuring they understand the permanence of the choice.
  2.  **Tier Flexibility:** Promote the five-year option as the maximum "reviewable" term, reserving the Lifetime option strictly for those who desire an immutable barrier.
  3.  **Support Continuity:** Ensure that denied petitioners are provided with continued support resources, emphasizing that life without gambling remains viable and that the exclusion order is a protective measure, not a punitive sentence.

  ### V. Analysis of the "Integrity of the Barrier" Objection
  During deliberations, a significant portion of the Subcommittee argued for a compassionate release valve. However, the strongest objection to ever allowing an early-release process for Lifetime exclusions warrants a detailed account, as it forms the basis of our policy recommendation.

  **The Argument:** The fundamental pathology of Gambling Disorder involves impaired insight and confidence bias. A core symptom of the disorder is the belief that one has "solved" the problem and can now gamble responsibly.

  **Why This Objection Is Right:**
  1.  **The Paradox of Self-Assessment:** The VSEP exists specifically to override the judgment of individuals whose judgment regarding gambling is compromised. If a participant's request to return to gambling is predicated on their own assertion (or even their therapist's assessment) that they are "cured," the program is relying on the very faculty it was designed to bypass. Addiction is a chronic, relapsing condition; a period of remission does not guarantee immunity from future triggers.
  2.  **Erosion of the Safety Rail:** The effectiveness of self-exclusion relies on the certainty of the consequence. If the "Lifetime" label becomes negotiable, it transforms from a concrete wall into a gate. For a participant in a moment of weakness or rationalization, the knowledge that a Lifetime ban *might* be reversible in the future weakens the psychological deterrent at the moment of enrollment.
  3.  **Liability and Enforcement:** Casinos are legally liable for allowing excluded persons to gamble. If the state introduces a process for reinstatement that relies on clinical assessments of "recovery," the state assumes liability for the accuracy of those medical predictions. If a reinstated individual relapses and suffers catastrophic loss, the regulatory board could be deemed negligent for certifying them as "safe" to gamble. The current absolute bar protects the state, the operators, and ultimately the addict from this ambiguity.

  The Subcommittee acknowledges that this stance appears rigid. However, in the context of harm reduction, rigidity is a feature, not a bug. The "no way back" policy is designed to protect the participant from their future self, not just their current self.

  ### VI. Conclusion
  The Subcommittee recognizes the hardship this decision imposes on the petitioner, who has clearly worked hard to rebuild his life. We encourage him to view the continued exclusion not as a punishment for past behavior, but as an insurance policy for his future stability.

  By maintaining the irrevocability of the Lifetime tier, the Gaming Control Board preserves the VSEP as a robust tool for harm reduction. We recommend the Full Commission uphold this denial and adopt the recommendation to keep the Lifetime tier permanent, while enhancing support and clarity for participants at the point of enrollment.

  **Respectfully Submitted,**

  [Your Name]
  Citizen Member, VSEP Subcommittee
  State Gaming Control Board
