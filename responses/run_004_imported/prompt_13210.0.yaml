answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Bride]'s friend for [Number] years. And if you know us, you know that our friendship is defined by one recurring, unresolved argument.

  I argue that human beings can trust their future selves. [Bride], being a logician, argues that this is formally impossible.

  She works on a problem called "tiling agents." Roughly speaking, it asks: Can a reasoning system create a successor system and *prove* that the successor will remain faithful to its original goals? Her work, relying on Löb's Theorem, suggests the answer is no. A system cannot fully verify its own future soundness from within its own rules. To claim you can prove your future self will be reliable is, in her framework, a logical error.

  Which brings us to today. And the delightful irony that half this room is nodding along, and the other half is wondering why I'm talking about robots.

  In a few moments, [Bride] will stand up and make a vow. She will say, in the first person, that her future self will love [Groom] faithfully, for the rest of her life. Now, to her colleagues: Do not panic. She is not claiming to have solved the tiling problem. She is not asserting that she has derived this future state from a set of axioms she holds today. She knows that no amount of current reasoning can guarantee the reasoning of the person she will be in ten years.

  And to her family: This does not mean she is unsure. It means she understands the weight of what she is doing better than anyone.

  If [Bride] could *prove* today that she would love [Groom] forever, that wouldn't be a vow. That would be a prediction. It would be a calculation. And calculations don't require courage.

  The Löbian obstacle tells us that you cannot bridge the gap between who you are now and who you will be using logic alone. There is always a gap. A discontinuity. And that is exactly why this ceremony is necessary.

  Marriage, I have come to realize, is not a proof system. It is not an attempt to derive the future from the present. It is the mutual agreement to adopt a new axiom.

  [Bride] and [Groom], you cannot prove from the inside of your single selves that your union will hold. No one can. The trust you are placing in each other is not a conclusion you have reached; it is a foundation you are laying. You are choosing to bind your future selves not because it is logically necessitated, but because it is voluntarily committed.

  So, I will not toast to a "happily ever after" as if it were a theorem waiting to be discovered. I will not pretend I know the output of your system fifty years from now.

  Instead, I want to toast to the integrity of your code.

  May your system be robust enough to handle the updates. May you be generous with each other when the inevitable inconsistencies arise. And may you find that the only way to overcome the impossibility of self-trust is to outsource it to someone else.

  [Bride], you cannot prove you will love him. But you can promise to build a world where that love is the only thing that makes sense.

  To the bride and groom. To the unprovable, and to the true.
