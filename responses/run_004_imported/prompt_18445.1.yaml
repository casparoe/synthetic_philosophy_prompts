answer: |-
  Good evening. For those who don't know me, I'm [Niece's Name]'s uncle. I spent most of my life as a physicist, chasing laws that don't care whether we believe in them or not. Gravity works even if you're in a bad mood. But in retirement, I've wandered into philosophy, a field where the laws depend entirely on whether we believe in them.

  So, when [Niece's Name] asked me to speak, I felt a specific kind of terror. Half of you are her colleagues in the philosophy department. You know Bernard Williams. You know the distinction between internal and external reasons. The other half are family, who know that love is hard, but don't care about the metadata.

  I realized that a wedding vow is actually the most dangerous object in the room. It sits right on top of that distinction.

  Here is the problem, simply put. An *internal* reason is based on what you already want. "I am bringing you water because I am thirsty." An *external* reason is based on what you ought to do, regardless of what you want. "I am bringing you water because it is my duty."

  If marriage is purely internal, it lasts only as long as the desire lasts. When the feeling fades, the reason to stay vanishes. That is terrifyingly fragile. But if marriage is purely external, it is a cold contract of duty, a tyranny of the "ought." That is loveless.

  So, what are we doing here today?

  I think [Niece's Name] and [Partner's Name] know the answer better than I do. They know that the vow "I will" is not a description of your current feelings. It is not saying, "I currently desire to stand by you." You already know that.

  The vow is a promise about the future of your reasons. It is a commitment to expand what counts as an "internal" reason for you.

  Bernard Williams was skeptical that external reasons existed. He thought we are always moved by our own subjective motivations. But marriage is the audacious attempt to prove that your motivations can be rewritten. When you say "I will," you are binding your future self. You are saying: "On the days when I am tired, or angry, or when the gravity of my own selfishness pulls me away, I will treat your needs *as if* they were my own desires."

  You are promising to make the external internal.

  This is why the tension doesn't resolve neatly. There will be mornings when the "I will" feels like a lie. There will be moments when the obligation feels heavy, and the desire feels absent. That is not a failure of the marriage; that is the work of the marriage. It is the labor of reminding yourself that the person sleeping next to you is part of your own motivational set.

  [Niece's Name], you have spent years studying practical reasons. You know that logic rarely convinces the heart. But [Partner's Name], you have shown us that love is a practice. It is the daily act of taking the reasons that exist outside of you—your partner's pain, their joy, their need for coffee at 6 a.m.—and weaving them into your own internal landscape until you cannot separate them from your own survival.

  To the family: Do not worry that this sounds technical. It is just a fancy way of saying that love is not just a feeling you find; it is a discipline you build.

  To the philosophers: Do not worry that I am flattening the distinction. I am suggesting that the wedding vow is the one place where we try to bridge the gap, not by argument, but by life.

  So, let us raise a glass.

  To [Niece's Name] and [Partner's Name]. May your internal reasons be abundant. May your external obligations feel light. And when they do not, may you have the courage to honor the vow that binds them together. To the couple.
