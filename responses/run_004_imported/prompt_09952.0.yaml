answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s brother. I'm also currently grinding through a PhD in political theory, which means [Sister's Name] and I have a very specific kind of sibling rivalry. Most siblings fight over who got the bigger slice of cake. We fight over whether moral obligations exist independently of social conventions.

  It's a tough life. But it means I've spent a lot of time thinking about what it means to make a promise. And since today is ostensibly about vows, I asked [Sister's Name] if I could talk about the philosophy of promising in this toast. She said yes, but only on one condition: that I didn't make it sound like a lecture. So, I promise to keep this brief. And if you know my sister, you know that for her, that sentence carries a very specific, heavy weight.

  Usually, at weddings, we talk about vows as a beautiful tradition. We say marriage is a sacred institution, or a social contract, or a time-honored ritual that holds society together. And there is truth in that. But if I said that today, [Sister's Name] would probably roll her eyes so hard she'd see her own dissertation.

  She wouldn't want me to tell you that her marriage is binding because society says so. She doesn't believe we keep promises just because it's useful for the community, or because there's a rulebook we're supposed to follow. To her, that makes love sound like following traffic laws. We stop at red lights because we don't want chaos; but we don't love each other just to avoid social chaos.

  But she also wouldn't want me to go the other way. She doesn't believe in magic. She doesn't think there's a mysterious, invisible string that ties you together the moment you say "I do," floating free of anything you actually say or do.

  So, if it's not a contract, and it's not magic… what is it?

  According to the expert in the room, a promise binds you because of what happens *between* two people. It binds you because you look someone in the eye, and you give them your word. You invite them to trust you. You give them a reason to rely on you. And once you've done that—once you've created that expectation in the person you love—you owe it to *them*, specifically, not to let them down.

  The obligation doesn't come from the state. It doesn't come from the church. It comes from the fact that [Partner's Name] is standing there, listening to her, and believing her.

  And watching them together, this is exactly what I see. I don't see a couple who are together because they're following a script. I don't see a couple who think they're bound by fate or destiny. I see two people who look at each other and say, "I am going to be here."

  [Sister's Name], you have spent the last few years writing about the ethics of assurance. But [Partner's Name], you've been living with the practice of it. You know that when she says she'll be there, she isn't checking a social rulebook. She's thinking of you. She knows that her word is the ground you're standing on.

  And [Partner's Name], the beauty of this view is that it works both ways. When you stand here today, you aren't just signing up for a traditional institution. You are looking at her and saying, "You can build your life on what I say." You are giving her the assurance that she doesn't have to guess where she stands with you. You are making yourself accountable, not to a rule, but to her.

  That is much harder than following a tradition. Traditions are static; they exist whether we participate or not. But this? This is dynamic. It requires you to keep showing up. It requires you to keep being the kind of person whose word can be trusted. It means that the "binding" force of this marriage isn't in the rings, and it isn't in the license. It's in the daily, active choice to honor the trust you've invited.

  To the rest of the family here who didn't get a PhD in ethics: you don't need to read Scanlon or Hume to understand this. You know it when you feel it. It's the difference between doing something because you "have to," and doing something because you told someone you would, and you love them too much to treat their trust lightly.

  So, I want to propose a toast.

  To [Sister's Name] and [Partner's Name]. May you never rely on tradition to do the work of love. May you never rely on magic to keep you together. And may you always remember that the only thing that truly binds you is the promise you make, and the trust you invite, every single day.

  To the bride and groom.
