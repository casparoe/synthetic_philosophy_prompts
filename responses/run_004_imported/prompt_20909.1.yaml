  **Title:** The Defuser's Dilemma

  **Setting:** A cramped room. A ticking bomb with a red and a blue wire. Two epistemologists, **ALEX** (sober, holding a clipboard) and **JAMIE** (holding wire cutters, visibly swaying, empty bottle of whiskey on the table).

  **ALEX:** Jamie, put the cutters down. You've had half a bottle of Jack. That's definitive higher-order evidence that your cognitive faculties are compromised.

  **JAMIE:** I know. I believe I'm compromised.

  **ALEX:** And the Enkratic Principle says you can't rationally believe the wire is red while believing you're compromised. You have to suspend judgment.

  **JAMIE:** That's the total evidence view. I'm a level-splitter. My first-order evidence—the schematic—says red. My higher-order evidence—the whiskey—says I'm bad at reading schematics. I believe both.

  **ALEX:** That's epistemic akrasia. It's a rationality violation. You're believing *P* while believing you shouldn't believe *P*.

