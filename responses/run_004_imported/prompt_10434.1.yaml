      *   *Mechanism:* The agent can choose to observe evidence $E$ (with likelihood $P(E|\theta)$) before choosing $a$.
      *   *Process:*
          1.  Calculate expected utility of acting now (based on prior).
          2.  Calculate expected utility of acting *after* seeing $E$ (integrating over all possible $E$, updating to posterior $P(\theta|E)$, choosing optimal $a_E$ for each $E$).
      *   *Result:* $E[\max_a E[U|E]] \ge \max_a E[U]$.
      *   *Key Assumption:* The information is *cost-free*. The agent's action does *not* affect the state of the world or the payoffs of others in a way that changes the structure of the game based on the information itself (single agent, fixed payoff structure). Crucially, the information is private to the decision-maker, or at least the analysis is partial equilibrium for that specific agent. The payoffs $U(a, \theta)$ are fixed functions.

  3.  **Analyze Hirshleifer's Result:**
