      *   **Specific Assumption:** The assumption that the **decision problem (payoff function/opportunity set) is invariant to the observation of the signal.** Good assumes the only thing that changes is the probability distribution $P(\theta)$. Hirshleifer shows the utility/payoff function $U(a, \theta)$ (via prices) changes.
