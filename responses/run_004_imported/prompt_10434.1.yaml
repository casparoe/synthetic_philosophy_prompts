      *   *Good's Assumption:* The payoff function (utility of outcomes) is fixed and independent of the information arrival. The agent optimizes against "nature."
      *   *Hirshleifer's Violation:* The payoff function (specifically, the budget constraint/trading prices) *changes* based on the information. In a market, prices reflect information. If information becomes public, prices adjust to eliminate the gains from trade that existed under ignorance.
      *   *Specific Assumption:* Good's theorem assumes the decision problem (the set of available acts and their consequences) remains invariant regardless of whether the information is obtained, *except* for the agent's belief state. In Hirshleifer's case, the *available acts* (trades at specific prices) change endogenously when information is revealed publicly.
