answer: |-
  Diderot: You speak of Geneva as if it were Sparta, Jean-Jacques. A camp of virtue where any pleasure is a deserter. But men are not soldiers forever. They need to see themselves reflected, to feel a grief that is not their own and learn from it. A theatre is not a brothel; it is a school of sentiments.

  Rousseau: A school where the masters are paid to lie. Do not tell me you cannot see the corruption in the very profession. An actor's trade is to counterfeit feeling, to sell his own person by the hour. He wears a mask so long he forgets the face beneath. You call this education? It is the training of hypocrisy.

  Diderot: It is the craft of representation! When a painter mixes colors to show a storm, is he lying about the weather? No, he captures the truth of the storm so we may feel its power without drowning. The actor does the same with passion. He channels grief, rage, love—often with more clarity than the man who feels them blindly. If a bourgeois father sees a prodigal son on stage and weeps, and returns home to embrace his own child, has the actor's lie done harm?

  Rousseau: He weeps for a moment, Denis, and then he is done. He has purged his pity in the dark of the auditorium so he need not practice it in the light of the street. Theatre makes us spectators of virtue instead of actors in it. It encourages a passive admiration. We clap for generosity on the boards and feel absolved, while outside the doors the poor freeze.

  Diderot: So we must abolish all representation? You would have us stripped of art because men are weak? That is not philosophy; that is despair. You want to deny people the refinement of their own emotions. The stage brings us together. It creates a public mind.

  Rousseau: It brings them together only to separate them. Think of what a theatre imports into a small republic. It requires leisure, which means idleness for some and labor for others. It requires luxury, costumes, lights, payboxes. It creates a distinction between those who watch and those who serve. In Geneva, we are equal citizens. Put a stage in the center and you create a court. You create kings in the boxes and servants in the pit.

  Diderot: You romanticize the village. Inequality exists in the marketplace too. Art does not create vice, Jean-Jacques; it reveals it. And sometimes, it corrects it. The bourgeois drama shows men like us, not just mythical heroes. It says that a merchant's honor matters as much as a duke's. That is your own equality, staged.

  Rousseau: No. True equality is not watching a merchant pretend to be honorable. It is being honorable together. You speak of bringing people together, but what gathering is more dead than an audience? They sit in silence, isolated in their private reactions, controlled by the script. I tell you, give me the open field. Give me a festival where there is no stage, no actors, no spectators. Let the people themselves be the spectacle. Let them dance in the square, sing their own songs, compete in games where everyone plays.

  Diderot: A maypole. You want to turn Geneva into a permanent holiday. Men cannot live on festivals. They need structure, narrative, the friction of opposing ideas. Your open field is a void. You want transparency so total it blinds us. You want us to be nothing but our public selves, forever visible, forever virtuous. It is unnatural. We need the shadow to understand the light. We need the illusion to grasp the truth.

  Rousseau: The illusion is what kills us. You *Encyclopédistes*, you think you can build virtue out of paper and ink and painted wood. But virtue is not a thing you watch. It is a thing you do. When you put a wall between the doer and the watcher, you kill the city. You make us consumers of morality rather than citizens.

  Diderot: And you make us monks. You would have us so afraid of corruption we refuse to touch the world. You say the actor sells his person? Fine. The writer sells his thoughts. The merchant sells his grain. We are all in trade. The question is whether the trade serves humanity. I believe the stage softens the heart. You believe it rots it. But look at yourself, Jean-Jacques. You push us away. You suspect every hand offered. You say the theatre isolates us, yet you are the one building walls around Geneva, around yourself.

  Rousseau: I build walls to keep the poison out.

  Diderot: You build them to keep the people out. You say only the wicked man lives alone? I begin to fear you are testing that hypothesis.

  Rousseau: I fear you are proving it. You would have us love humanity in the abstract, on a stage, while ignoring the man standing next to us because he lacks the price of a ticket. I would rather the peasant know his neighbor's face than a king's mimicry.

  Diderot: Then you condemn us to ignorance. You want a virtue that is blind.

  Rousseau: I want a virtue that is lived. Not acted.

  Diderot: There is no difference. Not for us. Not anymore.
