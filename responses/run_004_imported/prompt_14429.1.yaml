answer: |-
  **Participants:**
  **Alex:** Williams-style Internalist
  **Jordan:** Reasons Fundamentalist (Externalist)

  **1. Jordan:** Let's cut to the chase. I've been grading papers on Williams' "Internal and External Reasons," and I'm convinced the view is secretly unfalsifiable. It hinges on this "sound deliberative route" from the agent's subjective motivational set, $S$. But Williams lets deliberation do so much work—finding constitutive means, weighing conflicting elements, even "imaginative acquaintance." It feels like a rubber band.

  **2. Alex:** A rubber band stretches, but it snaps if you pull too hard. The deliberative route isn't magic. It's constrained by facts, logic, and the actual contents of $S$. If I want to drink gin but believe the glass contains petrol, a sound deliberative route corrects the belief. It doesn't generate a desire to drink petrol.

  **3. Jordan:** That's the easy case of false belief. I'm talking about the hard cases. Williams says deliberation can involve imagining what it would be like to have a certain experience, which might generate a *new* motivation. If an agent ends up caring about something after this process, the Internalist just retroactively declares, "See? That was reachable from $S$ all along." How do you falsify that? Any counterexample where an agent lacks a motivation can be explained away by saying they haven't deliberated soundly enough.

  **4. Alex:** It's not retroactive declaration; it's a hypothesis about psychological continuity. If I convince a racist to stop being racist, Williams says I must have appealed to something already in their $S$—maybe a commitment to fairness they were ignoring, or a desire for social cohesion. If there is *no* link to $S$, then I haven't given *them* a reason; I've just brainwashed them or coerced them. The theory predicts that without a hook in $S$, there is no rational motivation.

  **5. Jordan:** But that's the trick. By expanding "hook in $S$" to include "imaginative acquaintance," you make the hook invisible. Suppose a hedonist suddenly cares deeply about asceticism after a "sound deliberative" epiphany. You'll say, "Ah, deep down, they valued self-mastery." If you can posit latent values to explain any shift in motivation, the claim that "all reasons are internal" becomes a tautology. It says nothing about the world, only about your ability to narrate a connection.

  **6. Alex:** It's not a tautology because deliberation can fail. I can deliberate unsoundly. I can make mistakes in weighing my commitments. If Internalism were unfalsifiable, there would be no such thing as a deliberative error. But there is. If I take a means that doesn't achieve my end, or if I ignore a conflict in my values, I've failed the route. The constraint is real: you can't deliberate your way to a motivation that has no psychological traction whatsoever.

  **7. Jordan:** Who judges the failure? You? The external observer? If the agent feels motivated, you'll say the route was sound. If they don't, you'll say it wasn't. It seems the "soundness" of the route is defined entirely by the outcome of the motivation, which makes the motivation the only evidence for the reason. That's circular. You're protecting Internalism from counterexamples by defining the "route" as whatever leads to the motivation the agent actually has.

  **8. Alex:** No, the soundness is judged by the standards of rationality applicable to the elements in $S$. But let's turn the microscope. You Externalists say there are reasons that exist regardless of $S$. But for a reason to be a reason *for action*, it has to be capable of motivating. If I grasp your external reason, and it leaves me completely cold, in what sense was it a reason for me to act?

  **9. Jordan:** It's a reason because it's a normative truth. If you ought to save the drowning child, you ought to, even if your $S$ contains only a desire to watch the water. The reason exists independently. When you say it must be capable of motivating, you're conflating *having* a reason with *being moved* by it. You can have a reason and be irrational by not acting on it.

  **10. Alex:** I'm not conflating them; I'm asking about the link. If the reason is to explain why I *should* act, there must be a possible world where grasping that reason *does* motivate me. What is the mechanism in that world? If you say "rational recognition," then you're admitting there's a capacity in the agent that, when activated, produces motivation.

  **11. Jordan:** Sure, rational agents have a capacity to recognize normative truths. That's not a subjective desire; it's a constitutive feature of agency. It's not in $S$ in the Williams sense; it's the precondition for having an $S$.

  **12. Alex:** But isn't that just Internalism with extra steps? You've just universalized $S$. You're saying every agent has a standing desire or capacity to respond to rational norms. If that capacity is missing—if I encounter a being truly devoid of it—do they still have the reason? If you say no, then the reason depends on a subjective feature of the agent.

  **13. Jordan:** If they lack the capacity for rationality, they aren't an agent. They're a force of nature. But for any actual agent, the reason exists. The difference is that for you, the reason's existence depends on the *contingent* contents of $S$. For me, it depends on the *necessary* structures of rationality. That's not Internalism; it's Objectivity.

  **14. Alex:** But here's the mirror problem for you. If the "capacity for rationality" is the hook, then your external reasons are only reasons for beings with that hook. You can't claim the reason floats free of psychology entirely. And if you admit it needs that psychological hook to motivate, then the "external" reason is doing no work. The work is being done by the internal capacity to recognize it.

  **15. Jordan:** The work is being done by the *truth* of the proposition recognized. The capacity is just the eye; the reason is the light. You're obsessed with the eye. I'm obsessed with the light. If the light is there, it's there, even if the eye is closed. Your unfalsifiability charge is a deflection because you can't admit that the light might exist without the eye.

  **16. Alex:** But reasons aren't just lights; they're directives. If the "sound deliberative route" is flexible, as you claim, it's because human psychology is complex. But your "light" is inert without the eye. So, when you argue against me, you're actually arguing that the "eye" (rational capacity) is uniform across agents. But that's an empirical claim about human psychology. If it turns out rationality doesn't motivate, your view collapses.

  **17. Jordan:** Rationality *is* motivational, conceptually. To see what you ought to do is to have a motive. That's not empirical; it's conceptual. Your view makes morality contingent. If a Nazi's $S$ lacks empathy, and no deliberative route leads to sparing Jews, you have to say he has no reason to spare them. That's the bullet you bite.

  **18. Alex:** I bite it because the alternative is mysticism. If I say he has a reason, I must explain how that reason could ever motivate him. If you say "by being rational," and he is rational but unmoved, then your concept of rationality is doing heavy lifting that looks suspiciously like... a desire to be rational. Which is in $S$.

  **19. Jordan:** It's not a desire. It's a norm. You keep trying to reduce normativity to psychology. My charge remains: your "deliberative route" is so flexible it swallows any psychology, making Internalism safe from refutation but empty of content. You save the theory by stretching the definition of "reachable" until it covers everything.

  **20. Alex:** And my charge remains: your "normativity" is so detached from psychology it can't explain action, making Externalism robust but inert. You save the theory by positing a "rational capacity" that functions exactly like an internal motivational constraint. We're both stuck with the agent's mind; we just disagree on whether the mind creates the reason or discovers it. Neither of us can escape the subjective machinery.
