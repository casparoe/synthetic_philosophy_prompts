  **Justifications:**

  *   **(1) Nadia (+1):** Nadia correctly articulates the core intuition of the Etiological (Selected-Effects) account: functions are grounded in history, not just current utility. Her claim that calling flight a "function" of the *original* proto-feathers is loose talk is accurate under this framework. However, she loses a point for saying "full stop," which implies feathers can never acquire new functions, a rigidity Owen successfully challenges in the next move.
  *   **(2) Owen (+2):** This is the strongest move in the exchange. Owen correctly identifies that the traits found in modern birds are not identical to the Liaoning proto-feathers. Because modern flight feathers have undergone millions of years of specific selection for lift, the Etiological account *itself* must acknowledge flight as a function. He exposes a potential strawman in Nadia's initial "full stop" claim.
  *   **(3) Nadia (+2):** Nadia recovers perfectly here. She clarifies that the Etiological account is not about privileging the *earliest* cause, but about identifying *any* period where selection stabilized the trait for a specific effect. She also correctly identifies the methodological distinction: Current utility is evidence for a function, but it is not the *definition* of a function. This is the philosophically precise defense of her position.
  *   **(4) Owen (+1):** Owen makes a strong pragmatic argument known as the "epistemic access" objection: if we need to look at current effects to guess the history anyway, why not just define function as the current effect? This is a valid motivation for the Causal-Role account. However, it conflates *how we know* a function (epistemology) with *what a function is* (ontology), and it sidesteps the Causal-Role account's difficulty in explaining "malfunction" (e.g., a heart that cannot pump). Thus, it is a strong move, but not decisive.

  **What Both Are Overlooking:**

  Nadia and Owen are debating which definition is the "correct" one, but they are overlooking two critical points that usually resolve this stalemate in philosophy of biology:

  1.  **The Problem of Malfunction:** The strongest argument for Nadia's (Etiological) view is that it explains how a trait can have a function but fail to perform it. If a bird is born with malformed feathers that cannot generate lift, Owen's (Causal-Role) view suggests "generating lift" is no longer a function of those feathers (since they make no causal contribution). Nadia's view allows that the feathers *have* the function of flight (because of their history) but are *malfunctioning*. Neither student leverages this normative dimension.
  2.  **Explanatory Pluralism:** They assume there is only one concept of "function." In practice, biologists use both. When asking "How does the wing work?" (physiology), they use Cummins's Causal-Role account. When asking "Why did the wing evolve?" (evolutionary biology), they use the Etiological account. The theories aren't necessarily rivals; they are tools for different explanatory projects.
