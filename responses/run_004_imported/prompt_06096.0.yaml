prompt: |-
  Had a long, slightly drunk argument with my friend Theo last night about whether "beating the market" even makes sense as a concept. He trades options on the side and is convinced that people with better information basically always come out ahead over time (he brought up insider trading as the obvious extreme case). I pushed back with this thing I vaguely remember from a game theory class, something like the "no-trade theorem" — the idea that if two people share the same prior beliefs and its common knowledge that both of them are rational, they can't actually agree to a trade based purely on private information, because the mere fact that I'm willing to sell you something already leaks what I know, and you update on that before the deal even closes, so the trade unravels before it happens. We went back and forth for like an hour and neither of us could reconstruct the actual mechanics well enough to know who was right, which is bugging me.

  So I want you to settle it properly. First, build me a concrete, from-scratch toy example — two agents, a specific bet or asset, explicit private information and common priors — that actually shows this unraveling happening step by step, not just the one-line statement of the theorem. Then, because hedge funds and insider traders obviously do seem to profit off information constantly in real life, give me one specific, realistic-sounding example of profitable informed trading, and tell me exactly which assumption of the no-trade result it's violating — is it that the priors aren't really common, that there's some noise or liquidity trader footing the bill, that common knowledge of rationality breaks down somewhere up the reasoning chain, or something else entirely? I don't want the vague "well, real markets aren't perfectly rational" answer — I want the failure point pinned down inside the actual example.
