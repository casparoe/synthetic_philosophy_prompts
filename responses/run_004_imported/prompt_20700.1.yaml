      *   **Irreversibility:** Brain death is permanent. There is no recovery. This is distinct from coma or vegetative state.
      *   **The "Uncanny Valley" of Death:** Seeing a warm, breathing (via machine) body looks alive. This causes cognitive dissonance.
      *   **Grief Process:** The argument is likely a manifestation of grief, denial, and the difficulty of letting go.
