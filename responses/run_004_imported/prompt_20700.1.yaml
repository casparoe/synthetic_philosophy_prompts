          *   *Medical/Legal Fact:* Historically true (cardiopulmonary criterion). Currently, legally insufficient in most jurisdictions if brain death criteria are met (neurological criterion).
          *   *Verdict:* Technically incorrect by modern medical/legal standards, but emotionally understandable.
          *   *Nuance:* Warmth and heartbeat are maintained by the ventilator and medications, not autonomous function.

      *   **Point (2) Diane:** "Machine is doing the work. Brainstem isn't driving breathing. Heart would stop without vent. Heartbeat proves machine works, not life."
          *   *Medical/Legal Fact:* Accurate regarding brain death. The brainstem controls spontaneous respiration. Without it, the body cannot oxygenate blood independently. The heart has its own pacemaker (SA node) but needs oxygenated blood (provided by the vent) to keep beating.
          *   *Verdict:* Medically accurate regarding the mechanism of brain death.
          *   *Nuance:* The heart *can* beat without the brain for a short time due to its intrinsic electrical system, but it relies on the brain (or vent) for oxygen.

      *   **Point (3) Paul:** "Brain dead bodies can heal, fight infection, gestate babies. That's not a corpse; that's physiological function."
          *   *Medical/Legal Fact:* True that somatic support is possible. Cellular function continues. Hormonal regulation can be managed.
          *   *Verdict:* Factually true observations, but the *interpretation* (therefore not dead) is the contention. Cellular life $\neq$ organismal life.
          *   *Nuance:* This is the strongest part of Paul's argument philosophically, but legally/medically, it doesn't override the loss of integrated brain function.

      *   **Point (4) Diane:** "Isolated organs $\neq$ coordinated whole. Need a line for transplants/end-of-life."
          *   *Medical/Legal Fact:* Accurate. The "integrative unity" theory is a core justification for brain death. Society needs a clear definition for resource allocation and organ donation.
