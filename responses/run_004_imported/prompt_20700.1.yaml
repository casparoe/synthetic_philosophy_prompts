      *   **Context:** The user's grandfather suffered a massive stroke, was declared brain dead the next day, but is currently on a ventilator with a beating heart. The family is grieving and conflicted.
      *   **Conflict:** An argument between Uncle Paul and Aunt Diane regarding the definition of death and the status of the grandfather.
      *   **Task:** Evaluate four specific points made during the argument (labeled 1-4), provide a verdict on each, and identify important missing context.
      *   **Tone:** Needs to be empathetic, medically accurate, legally/ethically grounded, and neutral (not taking sides in a way that invalidates grief).
      *   **Constraint:** The user is "reeling" and "bugged" by this. The response must be sensitive to the emotional weight while providing clarity.

  2.  **Analyze the Four Points:**

