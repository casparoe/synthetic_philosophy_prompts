answer: |-
  Good morning. Thank you all for being here.

  For those of you who knew my grandmother only as a mother, or a sister, or a friend, you know her best through the holidays she hosted, the advice she gave, and the quiet steadiness of her presence. But for a dozen people in this room, you also know her as the keeper of the living room. For thirty years, on Tuesday nights, a small group gathered there to read difficult texts. They moved slowly. Sometimes they spent an entire evening on a single verse.

  She taught them that the truth is not a thing you can hold in your hand. And now, standing here, I find myself facing the same difficulty she spent her life exploring. We want to say something true about her death. But every sentence we reach for seems to fall short.

  We want to say that she is still here. We feel her in the way the light hits the kitchen table, in the habits she taught us, in the love that still binds this family together. It feels right to say she lives on. And in a way, she does. She is present in the causes and conditions she set in motion. Every kindness she offered returned to her, and now ripples through us. If we look for her in the way we treat one another, she is undeniably *there*.

  But then, we look at the chair where she used to sit, and it is empty. We want to say that she is gone. To pretend she is still physically here, watching us from a corner of the room, would be a lie. She is not a ghost. She is not a fixed object that has simply moved to a different shelf. To claim she exists in the same way she did yesterday is to ignore the reality of change. It is to try to freeze a river and call it stone. She is not *here* in the way we usually mean.

  So we are caught. If we say she is, we ignore the silence of the house. If we say she is not, we ignore the noise of our grief.

  Perhaps the truth is both? She is gone, and yet she remains. This is where we spend most of our mourning. We oscillate between the shock of her absence and the comfort of her memory. We hold her urn and we feel the weight of the ash, and we feel the weight of the history. It feels like a contradiction, but it is the only way we know how to speak. She is both the memory that warms us and the absence that chills us.

  And yet, even this feels like a struggle. To say she is "both" implies we can neatly define the boundaries of where she ends and we begin. It implies we can categorize her into boxes of "present" and "absent." But she taught us that reality is not made of boxes. It is made of relationships.

  So, perhaps the most honest thing we can say is neither.

  She is not "existing" in a way we can grasp. She is not "non-existing" in a way that erases her. She is not "both" in a way that splits her in half. And she is not "neither" in a way that makes her a mystery to be solved.

  She used to tell us, half-joking, that trying to define the ultimate nature of things is like grabbing a snake by the wrong end. If you hold too tight to the idea that she is permanently gone, you crush the life out of her memory. You fall into the belief that nothing matters. But if you hold too tight to the idea that she is permanently here, you crush the reality of the moment. You fall into the belief that nothing ever changes.

  She taught us that there is a middle way. It is not a compromise between the two. It is a release from the need to choose.

  For the family here who never read her books: I know you just want to know she is okay. I know you want to know you will see her again. I cannot promise you that in the way you might hope. But I can promise you this: because she was not a fixed, isolated thing, she was able to become part of you. Because she was empty of a separate self, she could be fully filled with love for you.

  Her love was not a possession she held; it was a way she acted. And that action has not stopped. It has just changed form. It is in the way you pour tea for one another. It is in the way you forgive. It is in the way this family gathers when the ground shakes.

  She is not in a better place. She is not in a worse place. She is not in a place at all. She is in the flow of things that depend on one another to exist. And because we are still here, breathing and remembering, she is still happening.

  The study group in the living room will continue. The books will stay on the shelf. The tea will still be poured. We will not stop asking the hard questions, and we will not stop looking for easy answers, even when we know they aren't there.

  We do not need to define her state to honor her life. We only need to acknowledge that we are here, together, because she was here before us. We are the evidence that she existed. We are the dependent origination of her love.

  So let us not cling to the idea that she is gone. Let us not cling to the idea that she stays. Let us simply sit with the reality of this room, with the warmth of our hands, and the openness of what comes next.

  Thank you.
