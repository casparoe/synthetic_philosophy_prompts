answer: |-
  This is a fascinating disagreement because, without realizing it, you and your friend stumbled into one of the oldest and most persistent debates in moral philosophy. You are arguing from the standpoint of **practical agency**, while your friend is arguing from the standpoint of **strict consequentialist skepticism**.

  Both of you are partially right, but your friend is making a category error that renders her argument useless for actual living. Here is an outside read on where the reasoning holds and where it breaks.

  ### 1. Where Your Friend Is Right (The Theoretical Point)
  Your friend has correctly identified the **Epistemic Problem of Consequentialism**.

  If the moral worth of an action is determined *solely* by its actual outcomes in the infinite future, then no human being can ever know if they have done a "good" thing. This is sometimes called the "Problem of Remote Consequences."

  *   **The Butterfly Effect:** As she noted, giving your cousin a job might displace another worker. That worker might get desperate, commit a crime, and harm someone. Or, your cousin might use the stability to start a family that produces a future tyrant.
  *   **The Calculation Gap:** We simply lack the data to calculate the "net utility" of an action across all time and space.

  If morality requires omniscience, then morality is impossible. Your friend is logically correct that you cannot guarantee the *ultimate* goodness of this decision.

  ### 2. Where Your Friend Is Wrong (The Practical Flaw)
  While her logic is sound in a vacuum, it fails as a guide for human action. Her argument leads to **Moral Paralysis**.

  If we accept her premise—that we cannot act until we have weighed the unforeseeable infinite ripple effects—we can never do anything. We couldn't feed a hungry person (maybe they survive to become a dictator), we couldn't donate to charity (maybe the money props up a corrupt system), and we couldn't even get out of bed (maybe we trip and cause a traffic accident).

  There are three specific flaws in applying her argument to your decision:

  **A. Expected Value vs. Actual Value**
  Ethical decision-making is based on *expected* value, not *actual* value.
  *   **Actual Value:** What actually happens in the universe (which we can't know yet).
  *   **Expected Value:** The probable outcome based on the information available to you *now*.

  You are justified in acting if you maximize the *expected* good based on available evidence. The evidence says housing + employment = lower recidivism. That is a high-probability positive outcome. The "butterfly effects" your friend mentions are low-probability and speculative. In decision theory, you always bet on the high-probability near-term gain over the low-probability long-term chaos.

  **B. The Baseline Comparison**
  Your friend is comparing your action against a hypothetical "perfect knowledge" state. But the real comparison is between **Action A** (helping your cousin) and **Action B** (doing nothing).
  *   **Action B** also has infinite unknowable ripple effects. If you don't help him, maybe he reoffends and hurts someone. Maybe he doesn't, but suffers greatly. Maybe he meets a different person and has different children.
  *   The uncertainty exists on *both* sides of the equation. Pointing out that Action A has unknown consequences doesn't make Action B safer or more knowable. It just means both are uncertain. Therefore, you should choose the one with the best *foreseeable* odds.

  **C. Moral Agency is Bounded**
  Most ethical frameworks (including Virtue Ethics and Deontology, and even practical Utilitarianism) agree that moral responsibility is bounded by **foreseeability**. You are responsible for the consequences you can reasonably anticipate, not the ones hidden by the chaos of the universe. If you save a drowning child, you have done a good deed, even if that child grows up to be a criminal. You are judged on the act of saving the life, not the unknowable future biography of the child.

  ### 3. Where You Are Right (The Pragmatic Point)
  You sensed that your friend's conclusion ("we can never be justified in believing any action to be good") was wrong. You were right to trust that intuition.

  Morality is a tool for navigating the world, not a metaphysical description of the universe. If a moral theory tells you that you can never make a moral choice, it is a broken theory.

  Your reasoning relies on **proximate causality**.
  *   **Proximate:** Housing reduces stress, job provides income.
  *   **Proximate:** Reduced stress + income reduces likelihood of theft/drug trade.
  *   **Proximate:** Less crime makes the community safer.

  These links are strong and documented. Your friend is asking you to weigh these strong links against weak, speculative links (e.g., "maybe he meets someone"). In risk assessment, you prioritize the high-confidence data.

  ### The Verdict
  Your friend is playing a philosophical parlor game; you are trying to live a life.

  She is pointing out a genuine *theoretical* limitation of human knowledge, but she is mistaken in thinking that limitation invalidates *practical* moral reasoning. We are not gods; we are agents operating with incomplete information. We are justified in doing the most good we can see, even if we cannot see the end of the story.

  **The Resolution:**
  You should help your cousin.
  1.  **Epistemically:** You are acting on the best available data (recidivism statistics).
  2.  **Ethically:** You are fulfilling a duty of care to family and community.
  3.  **Philosophically:** You are maximizing *expected* utility, which is the only kind of utility humans can access.

  Tell your friend this: *"You are right that I can't know the future. But I also can't know the future if I do nothing. Since I have to choose, I will choose the path where the foreseeable consequences are benevolent, rather than the path where the foreseeable consequences are neglect."*

  That ends the circle.
