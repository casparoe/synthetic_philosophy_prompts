      *   *Scholarship:* Mentioning Bart Schultz is non-negotiable. He wrote the definitive biography (*Eye of the Universe*) and specifically discusses this tension. Also, maybe mention Schneider or Gross.
      *   *Term:* "Performative contradiction" is a bit strong/post-structuralist. "Practical tension" or "Epistemic dissonance" might be more historically accurate, but "performative contradiction" works if defined carefully.
