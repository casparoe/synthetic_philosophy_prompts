      *   *Roger:* If I'm a machine, my output is limited by that machine. But I can see truths outside it.
      *   *Ada:* Maybe you're just a machine that *thinks* it sees truth but is actually inconsistent.
      *   *Roger:* But mathematics works. We agree on truths. If we were unsound machines, math would collapse.
