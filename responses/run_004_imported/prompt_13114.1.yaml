answer: |-
  You have put your finger on something profound, and your hesitation to use the standard vocabulary of "bias" or "bubble" is well-founded. Those terms describe *errors in processing*, but what you are describing is a *difference in architecture*.

  You are not disagreeing about the furniture in the room; you are disagreeing about the blueprints of the building.

  When a disagreement moves from "What do the facts say?" to "What counts as a fact?", you have exited the realm of ordinary debate and entered the realm of **competing epistemic frameworks**. This is much harder to navigate, but it is also a much more interesting story to tell. Here is a breakdown of what is likely happening, why standard labels fail, and whether progress is actually possible.

  ### 1. The Diagnosis: Hinge Propositions and Echo Chambers

  You are right that "confirmation bias" is too thin. Confirmation bias suggests your friend is weighing evidence poorly. But as you noted, he weighs evidence quite rigorously—he just weighs *different* evidence.

  **Wittgenstein's Hinges**
  The philosopher Ludwig Wittgenstein offered a concept that fits your friend's situation perfectly: *hinge propositions*. These are assumptions that are not themselves tested by our inquiries but are the "hinges" on which our inquiries turn.
  *   For you, a hinge might be: *"Institutional peer review is the best filter we have for error."*
  *   For your friend, a hinge might be: *"Institutions inevitably protect their own power structures."*

  You cannot prove a hinge proposition using the system that relies on it. If you cite a peer-reviewed paper to prove peer review is reliable, you are arguing in a circle. Your friend isn't being irrational by his own lights; he is operating from a different set of hinges. He views mainstream archaeology not as a truth-seeking mechanism, but as a guild protecting its turf. To him, accepting their dates is like asking a fox to guard the henhouse and then trusting the fox's count of the chickens.

  **Echo Chambers vs. Epistemic Bubbles**
  Philosophers Cailin O'Connor and James Owen Weatherall distinguish between *epistemic bubbles* (where you haven't heard the other side) and *echo chambers* (where you have heard the other side, but you have been taught to systematically distrust the source).
  Your friend is in an **echo chamber**. He knows the radiocarbon dates. He rejects them not because he hasn't seen them, but because he has been inoculated against the *authority* that issues them. This makes the disagreement resilient. You cannot pop an echo chamber by adding more facts; you have to repair the broken trust in the source.

  ### 2. The Psychology: Agency and Identity

  Why does he adopt *these* specific hinges? This is where the emotional payload lies.

  Believing in a suppressed pre-Ice Age civilization is not just a claim about history; it is a claim about **self**.
  *   **The Mainstream View:** To accept standard archaeology is to be a consumer of knowledge. You trust the experts.
  *   **The Alternative View:** To accept the "suppressed truth" is to be a *producer* of knowledge. You are a detective, a rebel, a free thinker seeing what the sheep cannot.

  For a sharp, well-read former software engineer, the mainstream view might feel passive. The alternative view offers **epistemic agency**. It allows him to feel that his intuition ("this looks too sophisticated") is a valid data point, perhaps even superior to a mass spectrometer. It transforms him from a layperson into an initiate.

  When you challenge the evidence, you aren't just correcting a fact; you are threatening to demote him from "truth-seeker" back to "layperson." That is why the resistance is so visceral.

  ### 3. Is Progress Possible?

  This is the hard question. If the disagreement is about foundational hinges, can you move the needle?

  **The Bad News:**
  You will not convince him with data. If you bring a better stratigraphy chart, he will question the strata. If you bring a better carbon date, he will question the calibration. In his framework, the "anomaly" is not the stone tool; the anomaly is the academic consensus that refuses to acknowledge the tool.

  **The Good News:**
  Epistemic frameworks are not immutable. They are pragmatic. We adopt them because they *work* for us. Progress is possible if you shift the conversation from **Truth** to **Utility** and **Coherence**.

  Here are three approaches that might work, both for dinner conversation and for your writing:

  **A. Burden of Explanation (The Conspiracy Cost)**
  Instead of attacking his evidence, ask him to explain the *mechanism* of his hinges.
  *   *"I understand why you distrust the institutions. But for this suppression to work, thousands of people across dozens of countries and competing universities would have to be complicit. How is that coordination maintained without a leak? What is the incentive structure?"*
  *   Make the conspiracy theory carry the weight of explanation. Often, alternative frameworks are great at pointing out problems (anomalies) but terrible at explaining the system that replaces them.

  **B. Predictive Power vs. Retrospective Fitting**
  Science is valuable because it predicts. Pseudo-archaeology is often retrospective.
  *   *"If your intuition about sophistication is the right metric, what should we expect to find next year? Where should we dig? If we dig there and find nothing, would that change your mind?"*
  *   If a framework cannot specify what would falsify it, it isn't an epistemic framework; it's a faith. Gently exposing this distinction can sometimes cause a crack in the hinge.

  **C. Acknowledge Your Own Hinges**
  This is the most powerful tool for a writer. Admit that you also have unargued starting points.
  *   *"You're right that I trust the consensus without being able to personally verify every mass spectrometer reading. I do that because I trust the process of error-correction over time. You trust the process of individual intuition and pattern recognition. I think your process leads to more false positives, but I see why you value the autonomy."*
  *   By acknowledging your own epistemic faith, you lower the temperature. You make it a comparison of tools, rather than a battle of Smart vs. Deluded.

  ### 4. How to Write About This

  As a science writer, this is a gift. The story isn't "Man Believes Crazy Thing." The story is **"How We Decide What Is Real."**

  Your friend is a case study in the **Demarcation Problem**: the philosophical struggle to define where science ends and non-science begins. Karl Popper said it's about falsifiability. Thomas Kuhn said it's about paradigm consensus. Your friend proves that for many people, the line is drawn at *trust*.

  If you write this, avoid the "skeptic debunking the believer" trope. It's been done a thousand times. Instead, write about the **symmetry of uncertainty**.
  *   Explore why the mainstream *should* be distrusted (science has been wrong before; institutions do protect turf).
  *   Explore why the alternative *fails* (it offers freedom but no traction).
  *   Frame it as a tragedy of communication: Two smart people speaking different languages of truth.

  ### Summary

  What is going on is a **clash of epistemic trust**. Your friend has traded institutional authority for personal intuition because it grants him greater agency and coherence with his worldview.

  Is there a principled way to make progress? Only by stepping *above* the evidence and discussing the **rules of the game**. You cannot win on facts. You can only hope to show that his framework is less *useful* for navigating reality than yours, or that the cost of his "hinges" (distrusting all expertise) is higher than he realizes.

  But be prepared: sometimes the goal isn't to change the friend's mind, but to understand the architecture of his belief well enough to keep the friendship intact. That, in itself, is a form of knowledge.
