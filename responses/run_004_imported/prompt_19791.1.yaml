      *   *Nuance:* He might appreciate the *intent* (judging prudence), but reject the *metaphysics*.
      *   *Key Insight:* The "Grounding Objection" is the killer here. For Molina, God knows CCFs because God's intellect is infinite and somehow grasps the truth of freedom without causing it. A human algorithm has no such access. It only has empirical regularities.
      *   *Ethical/Theological dimension:* Molina was concerned with salvation and grace, not prison. But the underlying anthropology (what is a human?) is the clash point.

