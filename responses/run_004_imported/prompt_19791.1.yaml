      *   **Context:** The user is a reporter covering recidivism algorithms. They understand the ProPublica investigation (2016) and the basics of Molina's theology (counterfactuals of creaturely freedom, logical priority).
      *   **Tone:** Intellectual, speculative, historically informed, philosophical.

