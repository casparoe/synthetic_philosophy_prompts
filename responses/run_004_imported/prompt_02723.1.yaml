answer: |-
  This is actually a classic philosophical problem that has kept metaphysicians and legal theorists busy for decades. Your friends aren't just arguing about a grade; they're arguing about the **ontology of omission** (whether "nothing happening" can be a thing that causes other things) and the **causal selection problem** (why we pick one cause out of many conditions).

  Here is the move-by-move breakdown of who is holding the stronger logical ground at each step, followed by the big concept they are both dancing around.

  ### The Move-by-Move Breakdown

  **Move 1: Alex (The Counterfactual)**
  *   **Argument:** If she had clicked, we would have passed. Therefore, her not clicking caused the fail.
  *   **Who has the point:** **Alex.**
  *   **Why:** This is the standard "But-For Test" (counterfactual dependence) used in law and common sense. *But for* Mia's inaction, the zero would not exist. In almost any practical context (school, court, mechanics), this counts as causation.

  **Move 2: Nora (The Metaphysics of Nothing)**
  *   **Argument:** Not clicking isn't an "event." Nothing happened. The deadline closing is the real event.
  *   **Who has the point:** **Nora.**
  *   **Why:** She is technically correct about physics. Causation is usually understood as a transfer of energy or a chain of events. "Forgetting" is the absence of an event, not a physical force. The portal closing is a positive event; Mia's fingers not moving is a null state.

  **Move 3: Alex (Doubling Down on Counterfactuals)**
  *   **Argument:** If the test is "would this happen without it," she fails the test. She is a cause.
  *   **Who has the point:** **Alex.**
  *   **Why:** He correctly identifies that if we reject omissions as causes, we break how we understand the world. If I don't feed my fish and it dies, saying "I didn't cause that, starvation did" is semantically gamesome. Most philosophers accept omissions as causes *pragmatically*, even if they aren't physical events.

  **Move 4: Nora (The Profligacy Problem)**
  *   **Argument:** Everyone had the link. If omission is causation, then *everyone* who didn't click caused the zero. That's absurd.
  *   **Who has the point:** **Nora.**
  *   **Why:** This is the strongest argument in the debate. It's called the **Problem of Profligate Causation**. If every condition necessary for an outcome is a "cause," then the cause of the fire is the spark, the oxygen, *and* the lack of a fire extinguisher, *and* the fact that the fire station didn't drive there. If we call all of those "causes," the word loses meaning. Nora correctly points out that Alex's logic makes *everyone* a cause, which dilutes the concept.

  **Move 5: Alex (The Normative Shift)**
  *   **Argument:** It was Mia's job. She said she'd do it. That's why it's on her, not us.
  *   **Who has the point:** **Alex (on responsibility), Nora (on causation).**
  *   **Why:** Alex is no longer talking about physics; he's talking about **social contracts**. He is shifting from "What caused this?" to "Who is to blame?" This is a valid move in a social context, but he is pretending it's still a metaphysical argument about causation.

  **Move 6: Nora (The Distinction)**
  *   **Argument:** Now you're talking about duty, not cause. "Mia caused the zero" is shorthand for "Mia didn't do her job."
  *   **Who has the point:** **Nora.**
  *   **Why:** She catches Alex switching definitions. She identifies that **Causal Responsibility** (physics) and **Moral/Role Responsibility** (duty) are different. She argues that the literal cause is "no submission occurred," and pinning it on Mia is a judgment call, not a fact of nature.

  **Move 7: Alex (The Need for Agency)**
  *   **Argument:** Someone has to be responsible. The zero came from somewhere.
  *   **Who has the point:** **Neither / Both.**
  *   **Why:** Alex is expressing a human need for explanation. We hate "glitches" or "accidents"; we want an agent. But logically, a zero can come from "no submission" without a specific villain. However, in a group project context, Alex is right that the *explanation* requires identifying the breakdown in the system (Mia).

  ---

  ### What They Are Both Missing

  The debate stalled because they are using the word **"Cause"** to mean two different things, and neither fully articulated the bridge between them.

  **1. Causal Selection vs. Causal Conditions**
  Both of them are missing the concept of **Causal Selection**.
  *   **The Reality:** There are hundreds of "causal conditions" for the zero. (Mia didn't click, the internet didn't force click, the teacher didn't extend the deadline, Nora didn't click, Alex didn't click, the server didn't crash).
  *   **The Missing Link:** Humans don't list all conditions. We *select* one condition to label "The Cause." How do we select it? **We select the condition that violated a norm.**
  *   **The Synthesis:** Nora is right that physically, Mia's inaction is no different from Nora's inaction. Alex is right that Mia is the cause *in the context of the group*. The "cause" isn't just physics; it's **Physics + Expectation.**

  **2. Omissions are "Norm-Sensitive"**
  Philosopher Jonathan Schaffer argues that omissions *are* causes, but they depend on a "default expectation."
  *   If a random stranger walks by your house and doesn't water your plants, they didn't "cause" your plants to die.
  *   If you hired a plant-sitter and they didn't water your plants, they *did* cause them to die.
  *   **The Missing Piece:** The physical action (not watering) is identical in both cases. What changes is the **norm**. Alex is arguing from the Normative view (it was her job), and Nora is arguing from the Physicalist view (atoms didn't move). Both are true, but they are describing different layers of reality.

  **3. The "Preemption" Aspect**
  Nora brought this up ("we all could have clicked"), but didn't land the plane. In philosophy, this is **Late Preemption**.
  *   If Mia was *supposed* to click, the rest of the group's ability to click becomes irrelevant background noise.
  *   By accepting the role, Mia "preempted" the others' causal power. Once Mia said "I'll do it," the causal chain for submission flowed through her. When that chain broke, the others' potential chains didn't automatically activate because the social agreement deactivated them.

  ### The Verdict

  *   **On Metaphysics (Physics/Events):** **Nora wins.** Strictly speaking, an omission is not a positive event, and spreading causation to everyone who *could* have acted is logically messy.
  *   **On Pragmatics (School/Law/Life):** **Alex wins.** The "But-For" test is how the world functions. If we didn't treat omissions as causes when there is a duty of care, no one could ever be held accountable for negligence.

  **The Resolution:**
  You can tell them they are both right, but they are arguing about different categories.
  *   **Nora** is right that Mia's fingers not moving isn't a physical force like a hammer hitting a nail.
  *   **Alex** is right that in a system governed by rules (like a class), **violating an expectation is functionally identical to causing an outcome.**

  The most accurate statement is: *"The deadline caused the zero physically, but Mia's negligence caused the zero socially."* Alex is arguing about the social cause (blame), and Nora is arguing about the physical cause (mechanics). That's why they couldn't resolve it—they were speaking different languages.
