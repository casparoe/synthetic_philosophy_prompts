prompt: |-
  I run a science-and-ideas podcast on the side of my day job, and next week's guest is a philosopher of religion who defends Molinism -- the scientia media solution to squaring divine providence with libertarian free will. I dont want her just re-explaining what middle knowledge is for the fifth time this year, so draft me 8 to 10 interview questions that actually push on the view. I want at least one question each on: the grounding objection (whats supposed to fix the truth of a counterfactual of freedom before anybody's actually made the choice), the move where middle knowledge is explanatorily prior to God's decree to create but not temporally prior to it, how transworld depravity leans on that same machinery in the free-will defense against the logical problem of evil, and why she thinks this whole apparatus beats the old Bañezian "physical premotion" answer to the same puzzle. For each one, add a quick follow-up keyed to whatever dodge she'll probably reach for first.
