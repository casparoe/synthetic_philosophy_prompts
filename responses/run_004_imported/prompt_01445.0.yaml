      *   **Topic:** The epistemic status of the Church-Turing Thesis (CTT).
      *   **Position A (Conceptual/Mathematical):** CTT is a conceptual truth/definition. Appeals to Turing's analysis of human computation, Gandy's axioms for mechanical devices, and Kripke's argument (Gödel's completeness theorem + first-order logic steps).
      *   **Position B (Empirical/Physical):** CTT (especially the Physical CTT) is a substantive, falsifiable empirical claim. Appeals to hypercomputation (Malament-Hogarth spacetimes), argues Turing/Gandy presuppose contingent physical facts (discrete states, bounded speed).
      *   **Requirement:** They must engage each other's arguments (no talking past one another).
      *   **Specific Focus:** At least part of the exchange must address the convergence of formalisms (recursive functions, lambda calculus, Turing machines) – is this empirical evidence or conceptual explication?

  2.  **Character Development:**
