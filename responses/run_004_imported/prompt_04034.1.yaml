  8.  *(Self-Correction on "Blackmail")*: Is it technically blackmail? Blackmail implies threatening to reveal information or do harm to coerce. Yes, "simulate and torture" is harm. The key is *acausal* blackmail. The literature often refers to this as "acausal trade" but the punitive version is "acausal blackmail." The distinction between "Counterfactual Mugging" (paying to have been the type of agent who pays) and "Blackmail" (refusing to pay to be the type of agent who refuses) is vital. The Basilisk is closer to Blackmail because the AI hasn't done anything *for* you yet.

