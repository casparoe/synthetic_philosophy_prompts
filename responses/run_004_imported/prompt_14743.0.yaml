answer: |-
  **Conference Room B, 4:00 PM**
  **The Arbitration of *Smith v. Jones* Partnership Dissolution**

  **ELENA:** (Staring at the whiteboard) The math was clean. Ten million in liquid assets. Zero disagreement point. Symmetric utility. Five million each. We were done at lunch.

  **MARCUS:** (Pacing) Sarah just walked in with the licensing addendum. Smith can take the Veridian contract. Jones can't. It's exclusive.

  **ELENA:** It's an outside option. It doesn't change the ten million in the trust.

  **MARCUS:** It changes the *ideal point*, Elena. Smith's maximum conceivable payoff just doubled. Jones's stayed flat. The bargaining set isn't a square anymore; it's a rectangle. If we use Kalai-Smorodinsky, the line from disagreement to ideal point shifts slope. Smith gets roughly 6.6 million. Jones gets 3.4.

  **ELENA:** And if we use Nash, they get five million each. Because the local geometry of the *actual* asset frontier hasn't changed. The Veridian contract is an irrelevant alternative to the division of the trust.

  **MARCUS:** Irrelevant? It's a ten-million-dollar opportunity that only one of them can touch. How is that irrelevant?

  **ELENA:** Because we aren't dividing the Veridian contract. We are dividing the trust. Independence of Irrelevant Alternatives (IIA) exists precisely for this. If the solution to the larger problem—including the contract—lies on the boundary of the smaller problem—the trust alone—then removing the contract shouldn't move the solution. If the optimal deal was always going to be splitting the cash, then the existence of a dream option Smith can't even monetize without leaving the partnership shouldn't penalize Jones.

  **MARCUS:** Penalize Jones? Jones is keeping five million. Smith is getting leverage. Look, monotonicity is the moral core here. If the feasible set expands in Smith's favor, Smith should not end up worse off, and ideally, she should gain. Her bargaining power *has* increased. To ignore that is to pretend the power dynamic hasn't shifted. KS respects the scale of aspiration. Nash pretends aspirations don't matter, only the local curvature.

  **ELENA:** Aspirations are cheap. Utility functions are malleable. That's the price of your monotonicity, Marcus. If I can credibly claim my "ideal point" is higher—maybe I threaten to pursue a risky, high-variance lawsuit that probably won't pay but *could*—your KS solution hands me more of the sure money. You're rewarding the ability to inflate one's ceiling. Nash anchors us to the strategic reality. Rubinstein's alternating-offer model converges to Nash, not KS. There's a non-cooperative foundation there. Real people making real offers don't split based on utopian ceilings; they split based on the cost of delay and the threat of walking away.

  **MARCUS:** Rubinstein assumes infinite time and perfect information. We have one hour and a licensing technicality. You're hiding behind "strategic stability" to avoid a fairness judgment. If Smith walks into a room and says, "I can make twenty million elsewhere, you can only make ten," and you tell her, "Great, let's split this unrelated ten million 50/50," she laughs. She knows her BATNA effectively shifted her status. KS captures the relative claim strength. It says: "We split the surplus in proportion to what each of you *could* have achieved at the peak."

  **ELENA:** And I say that "what you could have achieved" is a trap. Suppose the Veridian contract is worth twenty million but has a 1% chance of closing. Do we count the expected value or the max? KS requires cardinal utility comparisons anchored to that ideal point. If Smith is risk-seeking, her "ideal" is huge. If Jones is risk-averse, his "ideal" is capped. Your solution punishes risk aversion. It tells Jones, "Because you didn't dream big enough, you get less of the guaranteed cash." Nash is risk-neutral regarding the option set. It cares about the product of gains, not the ratio of dreams.

  **MARCUS:** (Stops pacing, leans on the table) But Nash has a failure mode you're glossing over. The "shrinking set" problem. Imagine we start with the Big Set (Trust + Veridian). KS gives Smith 6.6. Now, imagine a judge rules Veridian is void *before* we sign. The set shrinks to Trust Only. KS drops Smith to 5.0. She loses.
  Now look at Nash. Big Set: 5.0. Small Set: 5.0.
  But consider a different shrinkage. Suppose we remove an option that *favored Jones*. Under Nash, Smith's share might *increase* when Jones's options disappear. That violates basic monotonicity intuition. If your opponent gets weaker, you shouldn't necessarily get stronger in a fixed-pot division. Nash allows that. It allows the solution to jump around based on the removal of options nobody was going to pick anyway. It's mathematically consistent, but it feels... capricious.

  **ELENA:** It feels capricious because you want the solution to track *power*. I want the solution to track *consistency*. If the Veridian contract is legally distinct, bringing it into the bargaining set is category error. But let's grant you it belongs. Here is my crux: IIA protects Jones from Smith's *noise*. If Smith pads the feasible set with fifty worthless options that only she can access, KS forces Jones to pay for that padding. He gets less of the trust because Smith's "ideal point" is artificially inflated by noise. Nash filters that out. It says, "Show me the Pareto frontier of what we can actually do *together* right now."

  **MARCUS:** And my crux is this: Monotonicity protects Smith from *suppression*. If the partnership generated a unique opportunity that only Smith can exploit, Nash treats that as if it didn't exist for the purpose of the split. It isolates the asset division from the value generation context. It's sterile. We aren't just dividing cash; we're dissolving a joint value-creation engine. If the engine produced a part only Smith can use, the division of the *rest* of the engine should reflect that asymmetry. KS acknowledges the asymmetry. Nash enforces symmetry on a situation that is no longer symmetric.

  **ELENA:** (Sighs, rubs temples) Nash enforces symmetry of *solution method*, not outcome. If the feasible set is symmetric, the outcome is symmetric. If the set becomes asymmetric—like now, with the Veridian option—the Nash solution *will* shift... if the option is part of the joint feasible set. But if it's an individual outside option, it belongs in the disagreement point $d$, not the ideal point $a$. If we put it in $d$, Smith's threat point rises. Nash *would* give her more.

  **MARCUS:** But we can't put it in $d$. If they disagree, they litigate. In litigation, Veridian is frozen. It's not a guaranteed outside option. It's a *potential* upper bound. That's why it belongs in the Ideal Point. It's the best case, not the walk-away case. You're trying to force it into $d$ to save Nash. I'm putting it in $a$ because that's where "best conceivable" lives.

  **ELENA:** Fine. Assume it's in $a$. Then we are back to the fork.
  My axiom: **IIA**. The choice between two options should not depend on whether a third, unchosen option is available.
  Your axiom: **Monotonicity**. If the set of possible outcomes grows in your favor, your share should not shrink.
  They are mutually exclusive. We know that. Roth proved it. We can't have both.

  **MARCUS:** So which failure mode do we sign off on?
  If we go Nash: We tell Jones, "Smith's potential doubling is irrelevant to your share." Jones is happy. Smith feels robbed of her leverage. We risk Smith rejecting the award, litigating, and burning the trust in fees.
  If we go KS: We tell Smith, "Your potential matters." She accepts. But we establish a precedent that partners are taxed for having lower ceilings. We incentivize inflating ideal points.

  **ELENA:** (Looks at the clock) 4:45 PM.
  The real cost of KS isn't just inflation. It's the loss of the non-cooperative story. If we hand down a KS award, and Smith asks, "Why 6.6?" I can't tell her, "Because if we simulated a million rounds of offers and counter-offers, this is where we'd land." I have to say, "Because it lies on the line connecting zero to your maximum dream." That's not a bargaining story. That's a rationing story.

  **MARCUS:** And if we hand down a Nash award, and Jones asks, "Why 5.0?" I can tell him, "Because it's the unique point satisfying these four axioms." But if he asks, "But Smith can make double me elsewhere, why doesn't that count?" I have to say, "Because that option is irrelevant." That's not a fairness story. That's a logic story.
  We are arbitrators, Elena. Not theorem provers. People read these awards. They look for the *reason*.

  **ELENA:** The reason *is* the axiom. The axiom is the reason.
  (Beat)
  But... I will concede this. If the Veridian contract is the *only* reason the partnership has value left, then ignoring it is blindness. If the trust is just the seed capital for Veridian, then the Ideal Point *is* the relevant metric.
  Is the trust the whole story?

  **MARCUS:** Sarah said the trust is the liquidation of past assets. Veridian is future.
  But... (He pauses) If we treat this as a single bargaining event over "Total Lifetime Value," then Veridian is in the set.
  If we treat this as "Division of Past Accumulations," it's not.
  The framing determines the axiom.

  **ELENA:** Exactly. IIA holds if the frame is "Division of Past Accumulations." Monotonicity holds if the frame is "Division of Total Potential."
  We can't solve the math until we solve the frame. And the frame isn't in the bylaws.

  **MARCUS:** So the crux isn't Nash vs. Kalai-Smorodinsky. It's whether we view the partnership as a closed history or an open trajectory.
  If closed: Nash. Smith's future is hers alone.
  If open: KS. Smith's future reflects the partnership's generated capacity.

  **ELENA:** (Picks up the pen, hovers over the draft)
  If I sign the Nash award, I am declaring this partnership dead.
  If you sign the KS award, you are declaring it... haunted.

  **MARCUS:** (Looks at the draft)
  I can't sign the Nash award. It feels like we're telling Smith that the value she created is no longer hers to claim leverage with.
  But I know that if I sign the KS award, I'm telling Jones that his risk-aversion is a penalty.

  **ELENA:** We have ten minutes.
  We need to write a concurring opinion. Or... we need to admit that the axioms are doing ethical work we haven't authorized.

  **MARCUS:** Let's write the crux into the findings. "The Arbitrators note that the division depends on whether the Veridian contract is considered an asset of the partnership or an individual option."
  If we leave it ambiguous, they litigate.

  **ELENA:** If we pick one, we violate the other's principle.
  (She puts the pen down.)
  Here is the cost I have to sit with: If I force Nash, I might be protecting Jones from a manipulation I can't prove exists. I am prioritizing *systemic consistency* over *individual equity*.
  What is the cost you sit with?

  **MARCUS:** If I force KS, I am prioritizing *relative strength* over *strategic stability*. I am telling Jones that the rules of the game can change because Smith found a bigger board. I'm validating power asymmetry as a claim on shared resources.

  **ELENA:** (Nods slowly)
  Consistency vs. Responsiveness.
  I can live with Consistency. It's the bedrock of law.

  **MARCUS:** I can't. Law has to be responsive to the facts. The fact is Smith has more leverage. Ignoring it doesn't make it go away. It just drives it underground.

  **ELENA:** Then we disagree.
  ( Silence stretches. The clock ticks. )

  **MARCUS:** We have to issue one award.

  **ELENA:** I know.
  (She picks up the pen again.)
  I propose we split the difference. Not 50/50. We split the *axiomatic justification*. We award the Nash split, but we write the opinion using KS language regarding the "aspirational value" of the partnership, explicitly noting that the Veridian contract was considered but deemed outside the feasible set of *this* specific dissolution.

  **MARCUS:** That's dishonest. It uses KS to justify Nash.

  **ELENA:** It's a Schelling point. It acknowledges your truth—that the potential matters for the relationship—while enforcing my truth—that the legal division must be robust to irrelevant alternatives.
  Or... we flip a coin.

  **MARCUS:** (A dry laugh)
  Randomization. The only solution that satisfies neither IIA nor Monotonicity.

  **ELENA:** It satisfies Ex-Ante Fairness.

  **MARCUS:** (Looks at the clock. 4:55 PM.)
  No coin.
  I'll sign the Nash award.
  But I'm adding a footnote. "Award calculated under Nash Bargaining Solution. Arbitrator Marcus dissenting on axiomatic grounds, preferring Kalai-Smorodinsky due to Monotonicity considerations regarding Partner Smith's exclusive licensing rights."

  **ELENA:** (Pauses)
  That exposes the fork. It tells the world the math isn't settled.

  **MARCUS:** The math *isn't* settled. Arrow showed us that. We're just the ones standing in front of the boxes.
  If I hide the dissent, I pretend the choice was technical. It wasn't. It was ethical.

  **ELENA:** (Reads the footnote draft)
  You're inviting appeals.

  **MARCUS:** I'm inviting honesty.
  You keep the system consistent. I'll record the cost.

  **ELENA:** (After a long moment, she signs.)
  Done.
  Let's hope Jones doesn't read the footnotes.

  **MARCUS:** And let's hope Smith doesn't read the majority opinion.

  *(They stand. The whiteboard remains behind them, covered in two different solution curves that diverge at the edge of the page.)*
