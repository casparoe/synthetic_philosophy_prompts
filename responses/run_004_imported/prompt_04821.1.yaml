prompt: |-
  Okay so this has been bugging me for months and my sister and I keep going back and forth on it. I've always felt like I have a pretty sharp gut instinct for telling when someone's lying to me, like this specific prickly feeling I get in my stomach. It became a whole thing after I called out a coworker for lying in a meeting last year and I turned out to be totally right, and ever since then I've been kind of obsessed with figuring out whether this "skill" is actually real or if I'm just fooling myself.

  So for like the past year, whenever I get that gut feeling about someone, instead of just leaving it, I push the conversation further, watch them closer, ask follow up questions, that sort of thing, and then afterward I judge whether they were actually lying based on all that extra digging. And honestly, almost every single time, the extra digging backs up my original gut call. I'm not just remembering the hits and forgetting the misses either, I've actually kept a rough mental tally and its a lot of cases by now, across all kinds of different people and situations. So I told my sister that at this point I basically have real proof that my gut is a reliable lie detector, and that maybe I should even start leaning on it for bigger stuff, like whether to trust a new business partner. She says the "digging deeper" doesn't count as an independant check on anything, because I don't have a polygraph or some totally separate way of finding out the truth — all that extra digging is still just me reading tone and body language and vibes, the exact same kind of read that gave me the gut feeling to begin with, so of course it's gonna agree with itself. I get what she's saying, but it still feels wrong to just toss it out, because each case really is a different person and a different situation, so it feels like actual new evidence stacking up, not me just repeating the same guess a hundred times. So who's actually right here — is she onto something real, or have I honestly earned the right to trust my gut on this by now?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **The Claim:** The user believes they have a reliable "gut instinct" for detecting lies (a "prickly feeling" in the stomach).
      *   **The Evidence:** Over the past year, whenever they get the feeling, they "dig deeper" (ask follow-ups, watch closer). Almost every time, this digging confirms the lie. They claim to track hits and misses mentally.
      *   **The Conflict:** The user's sister argues that the "digging deeper" isn't an independent verification. It's just more of the same subjective reading (tone, body language, vibes) that generated the gut feeling initially. Therefore, it's circular reasoning.
      *   **The Stakes:** The user wants to know if they can trust this instinct for high-stakes decisions (e.g., trusting a business partner).
      *   **The Goal:** Determine who is right (user or sister) and explain *why* in a way that validates the user's experience while addressing the logical flaw pointed out by the sister.

  2.  **Evaluate the Sister's Argument:**
      *   **Core Point:** Confirmation Bias / Circular Reasoning.
      *   **Validity:** She is scientifically and logically correct. If the method of verification (digging deeper/reading cues) relies on the same cognitive mechanisms as the initial detection (gut feeling/reading cues), you aren't testing the accuracy of the instinct; you're just reinforcing the initial hypothesis.
      *   **Example:** If I think a coin is biased towards heads, and I test it by flipping it and *interpreting* ambiguous landings as heads because I expect heads, I haven't proven anything.
      *   **The "Truth" Problem:** How does the user *know* the person was lying? Did the person confess? Did external facts emerge? Or did the user just decide, "They acted shifty when I asked more questions, so they were lying"? If it's the latter, the sister is 100% right.

  3.  **Evaluate the User's Argument:**
      *   **Core Point:** Empirical Success Rate.
      *   **Validity:** The user feels confident because of the high correlation between feeling and outcome.
      *   **Potential Strengths:** Intuition *is* real. It's often pattern recognition based on subconscious processing of micro-expressions, tone, context, etc. (Malcolm Gladwell's *Blink* territory).
      *   **Potential Weaknesses:**
          *   **Confirmation Bias:** Remembering hits, forgetting misses (even if they claim otherwise, mental tallies are notoriously unreliable).
          *   **Self-Fulfilling Prophecy:** If you act suspicious, people act nervous. Their nervousness confirms your suspicion, but they might not have been lying initially.
          *   **Lack of Ground Truth:** Without objective proof (documents, third-party verification, confession), "I caught them in a lie" is subjective.

  4.  **Synthesize the Verdict:**
      *   **Who is right?** The sister is logically right about the *method of verification*. The user is likely right that they have *some* intuition, but wrong about the *degree of reliability* and the *proof*.
      *   **Nuance:** Intuition is a tool, not a truth machine. It's a hypothesis generator, not a validator.
      *   **Risk:** Using this for high-stakes decisions (business partner) without objective due diligence is dangerous.

  5.  **Drafting the Response (Iterative Process):**

      *   *Empathy First:* Acknowledge that the feeling is real and frustrating. Don't dismiss the intuition entirely.
      *   *Address the Sister's Point:* Explain *why* she's right about the verification loop. Use the term "Confirmation Bias" and "Circular Reasoning." Explain that "digging deeper" using the same senses isn't independent data.
      *   *Address the User's Point:* Validate that intuition exists. It's subconscious pattern recognition. The "prickly feeling" is real physiological feedback.
      *   *The Crucial Distinction:* Differentiate between "Hypothesis Generation" (Gut) and "Verification" (Evidence). The gut starts the engine; it shouldn't steer the car.
      *   *The "Self-Fulfilling Prophecy" Angle:* This is important. If you interrogate someone because you think they're lying, they get nervous. Nervousness looks like lying. You conclude you were right. But were they lying at the start? Unknown.
      *   *The "Ground Truth" Problem:* Ask the hard question: How do you *know* they were lying? Did they admit it? Or did you just feel more sure?
      *   *Advice for the Future:* Don't toss the gut, but don't worship it. Use it as a flag to slow down and get *objective* data (contracts, references, background checks), not just more subjective interrogation.

  6.  **Refining the Tone:**
      *   Needs to be balanced. Not "Your sister is a genius and you're deluded," but "Your sister spotted a logical trap, but your experience isn't worthless."
      *   Avoid jargon where possible, but use terms like "Confirmation Bias" because they are helpful.
      *   Focus on the business partner scenario as the concrete risk.

  7.  **Final Polish (Self-Correction during drafting):**
