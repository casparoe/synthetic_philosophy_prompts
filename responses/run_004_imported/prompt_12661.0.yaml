answer: |-
  Here is a joke tailored for your seminar, designed to land with students who are already grappling with the Lewisian framework and the distinction between metaphysical causation and causal selection.

  ***

  A nervous graduate student is called into his advisor's office after the department's prize orchid dies over the weekend.

  **Advisor:** "I see the orchid is dead. You were the last one in the lab."

  **Student:** "I was. But Professor, I've been thinking about our reading on causation by omission. Strictly speaking, my failure to water the plant isn't the *unique* cause of its death."

  **Advisor:** "Oh?"

  **Student:** "No. On a counterfactual analysis, the death depends on the omission of every single person who didn't water it. The President didn't water it. The Queen didn't water it. You didn't water it. Metaphysically, we are all equally guilty of killing this orchid. To single me out is to ignore the profligacy of omissive causes."

  **Advisor:** "That is a sophisticated defense. You're arguing that without a normative criterion to filter the background conditions, the causal field is promiscuous."

  **Student:** "Exactly! So, morally and metaphysically, the blame is distributed across the entire human population."

  **Advisor:** "I see. Well, I accept your metaphysics. Counterfactually, I am indeed a murderer."

  **Student:** "Relieved."

  **Advisor:** "However, I'm afraid you're still failing the class."

  **Student:** "But why? I just proved I'm not the salient cause!"

  **Advisor:** "Because while the *causation* is universal, the *enrollment* is not. Metaphysically, we all killed the orchid. But normatively, you're the only one whose omission violates a departmental policy."

  **Student:** "That seems like smuggling in a contextual fix!"

  **Advisor:** "It is. Just like the one I'm using to justify your grade. Now, please water the next one, or I'll have to argue that your continued employment is counterfactually dependent on my generosity."
