answer: |-
  Friends, colleagues, members of St. Jude's, and old hands from the department.

  For forty-one years, Walt and I chased data across the Atlantic. We spent more time looking at the bottom of the ocean than most people spend looking at their own front yards. And if there is one thing I can tell you about Walt, it is that he did not tolerate sloppy work. I remember one season in the Gulf of Maine when we found a calibration error in our salinity sensors three weeks into a cruise. It was a small error. It wouldn't have changed the headline results. Most labs would have noted it and moved on. Walt scrapped the whole dataset. He said, "If we don't trust the numbers, we don't have a job."

  He applied that same rigor to the rest of his life. Including, and especially, his faith.

  I know this room is divided. Half of you knew Walt as a man of prayer, a deacon, a believer who found comfort in the promise of eternity. The other half knew him as a hard-nosed empiricist who wouldn't sign off on a paper unless the p-value held up. Usually, when a person straddles two worlds like that, a eulogy becomes an exercise in splitting the difference. We tend to soften the science for the church, and soften the faith for the university.

  But Walt would have hated that. He wouldn't want us to pretend he knew something he didn't, and he wouldn't want us to pretend he doubted something he didn't. So, I'm going to tell you exactly how Walt held these two things together, because he actually explained it to me once, in a bar after a conference, when some of the younger grad students were giving him grief about being a "believing biologist."

  He didn't get defensive. He just asked them if they'd read W.K. Clifford. He was talking about the essay on the "Ethics of Belief." Clifford argues that it is wrong, always and everywhere, to believe anything on insufficient evidence. He tells the story of a shipowner who sends an emigrant ship to sea, suppressing his doubts about its seaworthiness, convincing himself it's fine. Clifford says the shipowner is guilty of the deaths, even if the ship makes it across, because he didn't have the right to believe without proof.

  Walt respected Clifford. He loved the demand for intellectual honesty. But he told us that night that Clifford's rule doesn't cover every kind of human question. He pointed us to William James, and the essay "The Will to Believe."

  Walt's argument was this: There are some questions that are what James called "forced, live, and momentous." The question of whether there is anything backing up this life—whether love is the final reality or just a chemical accident—is one of them. You cannot wait for empirical proof before you decide how to live. By the time you have proof, the choice is no longer yours to make.

  Walt said that refusing to choose is not a neutral act. Withholding judgment on a momentous question is, effectively, betting against hope. It is deciding to live *as if* there is nothing more, just as surely as the believer decides to live *as if* there is.

  He never claimed he *knew*. In thirty years, I never heard him say, "I know God exists." He knew that wasn't scientific. But he decided that given the choice between betting on a universe with meaning and betting on one without, he would rather be wrong on the side of hope. He treated his faith not as a fact he had discovered, but as a hypothesis he had chosen to test with his life.

  So, to his colleagues here: Walt did not compromise his scientific integrity when he knelt in this church. He recognized a limit of his method. He knew science measures the machinery of the world, but it cannot measure the purpose of it. He didn't check his brain at the door; he brought his full intellectual weight to his faith, and he found it held up under the strain.

  And to his church family: Walt's hope was not a fragile thing that required him to ignore reality. It was a sturdy thing, forged in the cold waters of the North Atlantic, tested against the hard data of a life lived honestly. He didn't believe because it was easy. He believed because he weighed the options, he saw the risk, and he chose the better wager.

  When he was diagnosed, he didn't ask for miracles. He asked for time to organize his notes. He faced the end with the same calm he brought to a storm. He didn't claim to know what was waiting for him on the other side. But he faced it with the confidence of a man who had already decided, decades ago, that he would meet it with hope rather than cynicism.

  There is a line in William James that I think Walt lived by: "Faith in a fact can help create the fact." Walt's faith didn't change the data, but it changed the man. It made him kinder. It made him patient with grad students. It made him the kind of partner who would stay on deck until the job was done, trusting that the work mattered.

  We are here to mourn him, yes. But we are also here to acknowledge a debt. Walt showed us that you don't have to surrender your mind to find your peace. He showed the scientists that rigor doesn't require despair, and he showed the believers that faith doesn't require blindness.

  He sailed his ship into the unknown, just like he did every day for forty years. He didn't have a map for this final voyage. But he had his compass. And if William James was right, and if Walt was right, then the choice he made to trust in a safe harbor is the very thing that might just welcome him there.

  Rest well, Walt. The data is safe. The boat held.
