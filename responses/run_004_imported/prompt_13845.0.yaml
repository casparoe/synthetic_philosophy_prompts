answer: |-
  This is one of the most exquisite and frustrating puzzles in Borges's non-fiction, and it is entirely understandable that the inferential leap feels elusive. Borges is often more of a poetic synthesizer than a rigorous analytic philosopher; he constructs a cathedral of logic only to light a candle of feeling inside it and watch the shadows dance.

  However, there is a specific metaphysical architecture underpinning that leap from "No Self" to "No Time." To help you with your novel, I will break down the logic of the refutation, explain why the "ownerless sequence" option is closed off in this system, and then interpret the famous closing concession.

  ### 1. The Inferential Leap: From No-Self to No-Succession

  You have correctly identified the first two moves:
  1.  **Berkeley:** Matter is dependent on perception (Idealism).
  2.  **Hume:** The Self is dependent on perceptions (Bundle Theory).

  The third move relies on a specific definition of **Time**. For Borges (drawing heavily on Schopenhauer and a specific reading of Kant), Time is not a container that exists independently. Time is **succession**. And succession is not merely a fact of the world; it is a **relation**.

  Here is the reconstruction of the missing step:

  **A. Time requires the linking of distinct moments.**
  For "Time" to exist, there must be a Moment A and a Moment B, and a relationship of "before and after" between them.

  **B. Relations require a mind.**
  In the idealist tradition Borges is inhabiting, relations do not exist "out there" in the atomic data of the universe. A relationship is a mental act. To say "A comes before B" is to hold A and B together in a single consciousness and compare them.

  **C. The Humean Self cannot hold two moments.**
  Hume argues the Self is nothing but a fleeting bundle of perceptions. There is no enduring "I" that persists from Moment A to Moment B. There is only the perception of A, and then, separately, the perception of B.

  **D. Therefore, there is no bridge.**
  If there is no enduring Subject to witness the transition from A to B, then A and B are hermetically sealed islands. They are discrete, atomic events. Without a mind to span the gap, there is no "succession." There is only a series of isolated "Nows."

  **E. A series of isolated "Nows" is not Time.**
  If every moment is entirely discrete, with no connection to the previous one, the concept of "flow" or "duration" vanishes. You are left with a static, eternal Present.

  **Why not an "ownerless sequence"?**
  You asked why this doesn't leave us with an "ownerless, impersonal sequence of perceptions." The answer lies in the definition of *sequence*. A sequence implies an ordering principle. In a materialist worldview, causality or physical laws provide that order. But Borges has already abolished Matter (via Berkeley). In an idealist worldview, the *Mind* provides the order.

  If you abolish Matter and you abolish Mind, you have abolished the two things capable of sustaining a sequence. You are left with what Schopenhauer called the "blind will" or what Borges calls a "vertiginous dust." Without a subject to synthesize the data, "A followed by B" is indistinguishable from "A and B existing simultaneously" or "B existing without A." The *temporal* quality is a projection of the subject. No subject, no projection, no time.

  ### 2. The Closing Reversal: "And yet, and yet..."

  The ending of the essay is one of the most famous passages in Borges's corpus:

  > *"And yet, and yet... To deny temporal succession, to deny the self, to deny the astronomical universe, are apparent desperations and secret consolations. Our destiny... is not terrifying because it is unreal; it is terrifying because it is irreversible and ironclad. Time is the substance I am made of. Time is a river which sweeps me along, but I am the river..."*

  This is not a logical retraction. Borges does not say, "I made a math error." He is making a distinction between **logical validity** and **existential truth**.

  **A. The Skeptic's Confession**
  Borges is acknowledging that while the intellect can deconstruct time, the *body* and the *spirit* cannot live without it. We are biologically and psychologically wired to experience succession. To deny time logically is a game of chess; to deny it experientially is impossible. He is admitting that philosophy hits a wall when it meets the phenomenon of being alive.

  **B. Time as Substance (The Reversal)**
  Notice the metaphysical shift. In the argument, he treats Time as a property that disappears when the Subject disappears. In the conclusion, he says, *"Time is the substance I am made of."*
  He reverses the dependency. It is no longer that the Self creates Time; it is that Time creates the Self. This is a move toward a kind of tragic monism. Even if the "I" is an illusion, the "flow" that dissolves the "I" is real.

  **C. The Function of the Paradox**
  For your purposes as a novelist, this is the crucial tension. Borges is not trying to solve the problem; he is trying to **preserve the mystery**.
  *   If he successfully refuted time, the essay would be a dry logical proof.
  *   If he accepted time without argument, it would be a mundane observation.
  *   By holding both (Time is logically refutable *and* Time is the substance of my tragedy), he creates a **metaphysical vertigo**.

  This closing concession is a *palinode*—a retraction of a song. But it is a poetic retraction, not a logical one. He is saying: "My logic is sound, but my logic is insufficient to capture the horror of my mortality."

  ### 3. Implications for Your Novel (Recurrence and Self)

  Since you are writing about recurrence and the dissolution of the self, Borges's "Refutation" offers a specific dramatic architecture you might utilize:

  1.  **The Atomization of Experience:** If Borges is right, your characters should not experience a "life story." They should experience a series of disconnected, intense "Nows." The tragedy is not that they are dying, but that they are never truly *continuing*. Every moment is a new birth and a new death.
  2.  **The Horror of Disconnection:** The "ownerless sequence" you asked about is actually a source of terror in Borges's view. If there is no Self to link my memory of yesterday to my action today, am I responsible for yesterday's crime? Is the man who wakes up today the same man who went to sleep? This is fertile ground for fiction.
  3.  **The "Secret Consolation":** Borges calls the refutation a "secret consolation." Why? Because if Time is not real, then Death is not real. If there is no succession, there is no end. The dissolution of the self is also the dissolution of the loss of the self. Your characters might oscillate between the terror of time (mortality) and the terror of timelessness (insignificance).

  ### Summary for your Reconstruction

  *   **The Logic:** Time = Succession. Succession = A Relation. Relations require a Mind. Hume destroyed the Mind. Therefore, Time is destroyed. (An "ownerless sequence" is impossible because without a Mind, there is no mechanism to order the owners).
  *   **The Ending:** It is an existential surrender. Logic wins the argument, but Life wins the experience. Borges concedes that while Time may be an illusion, it is the *only* illusion we have to measure our suffering.

  The essay is not a proof; it is a performance of the mind trying to escape its own cage, realizing it cannot, and finding a strange beauty in the bars. That tension is likely where your novel should live.
