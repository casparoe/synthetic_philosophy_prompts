      *   *The Nature of Time:* Time requires succession (before/after). Succession requires a mind to link distinct moments. If there is no enduring mind to hold moment A and compare it to moment B, there is no succession. There is only an atomic, isolated "now."
      *   *Schopenhauer/Nietzsche influence:* The idea that the present is the only reality. If the past is gone and the future isn't here, and there's no "I" to bridge them, time collapses.
      *   *The Ending:* The "confession." Borges admits the logical argument but denies its existential truth. "Time is the substance I am made of."

