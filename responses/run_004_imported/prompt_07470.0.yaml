answer: |-
  Your faculty advisor was essentially correct, though perhaps a bit dramatic in the delivery. What you experienced in that committee room is not just "messy politics"; it is a textbook demonstration of two of the most famous results in social choice theory: **Condorcet's Paradox** and the violation of the **Independence of Irrelevant Alternatives (IIA)**, which is a cornerstone of **Arrow's Impossibility Theorem**.

  You asked for the mechanics rather than a hand-wave. Here is exactly what happened, why it was mathematically inevitable given your group's preferences, and what it implies for the idea of a "group will."

  ### 1. The Cycle: Condorcet's Paradox
  First, let's look at your head-to-head (pairwise) results. You found that:
  *   Boathouse beats Rooftop (5–4)
  *   Rooftop beats Barn (6–3)
  *   Barn beats Boathouse (5–4)

  This is a **Condorcet Cycle**. In a rational individual preference, if you prefer A to B, and B to C, you must prefer A to C (transitivity). However, when you aggregate individual preferences into a group preference using simple majority rule, the group's preference can become **intransitive**.

  **The Mechanics:**
  This happened because your committee was polarized into specific blocs.
  *   The **Boathouse** supporters (Types 1 & 4) generally preferred it over the Rooftop.
  *   The **Rooftop** supporters (Type 2) preferred the Barn over the Boathouse (acting as a spoiler against the Boathouse).
  *   The **Barn** supporter (Type 3) and the Rooftop supporters combined to beat the Boathouse.

  Because no single venue could command a majority against *all* opponents, there is no "Condorcet Winner." This means any method that claims to find a winner must do so by breaking the cycle artificially. There is no hidden "true winner" waiting to be found; the majority will *is* circular.

  ### 2. The Flip: Violation of Independence of Irrelevant Alternatives
  Next, let's look at the points system (Borda Count). You found that Boathouse won with four options, but when the losing option (Ballroom) was removed, the Rooftop won.

  This violates a fairness criterion called **Independence of Irrelevant Alternatives (IIA)**. IIA states that the relative ranking of two options (Boathouse vs. Rooftop) should not change if a third, irrelevant option (Ballroom) is removed, provided no voter changes their mind between the first two.

  **The Mechanics of the Flip:**
  In a points system, an option's score depends on its *position* relative to all other options, not just its head-to-head strength. When you remove the Ballroom, you compress the rankings, changing the point values assigned to the remaining venues.

  Look closely at the **two voters** who ranked: **Boathouse > Barn > Ballroom > Rooftop**.
  *   **With 4 options:** They gave Boathouse 3 points and Rooftop 0 points. (Gap: +3 for Boathouse).
  *   **With 3 options (Ballroom removed):** Their ranking becomes Boathouse > Barn > Rooftop. They now give Boathouse 2 points and Rooftop 0 points. (Gap: +2 for Boathouse).

  By removing the Ballroom, the Boathouse *lost relative ground* against the Rooftop on these two ballots, even though those voters still prefer Boathouse over Rooftop. Meanwhile, the four **Rooftop > Barn > Boathouse** voters maintained the same point gap between their top and bottom choices (3 vs 1 in the 4-option system, 2 vs 0 in the 3-option system).

  Because the Boathouse relied heavily on the "buffer" points provided by the Ballroom sitting beneath the Rooftop on some ballots, removing the Ballroom collapsed the Boathouse's score more than it collapsed the Rooftop's. This is a structural vulnerability of all points-based systems.

  ### 3. Was the Advisor Right? (Arrow's Impossibility Theorem)
  Your advisor's comment refers to **Arrow's Impossibility Theorem** (1951). Kenneth Arrow proved mathematically that no rank-order voting system can satisfy a specific set of "fairness" criteria simultaneously. Those criteria are:
  1.  **Non-dictatorship:** No single voter dictates the outcome.
  2.  **Pareto Efficiency:** If everyone prefers A to B, the group must prefer A to B.
  3.  **Unrestricted Domain:** The system must handle any possible set of voter preferences.
  4.  **Independence of Irrelevant Alternatives (IIA):** Removing a losing option shouldn't flip the winner.

  Your committee vote proved that you cannot have it all.
  *   **Pairwise voting** respected the majority will but failed to produce a winner (violating the expectation of a decisive result due to the Cycle).
  *   **Points voting (Borda)** produced a winner but violated IIA (the Flip).
  *   **Plurality voting** (show of hands) ignored the intensity of preference and resulted in a tie.

  The advisor was right: there is no "perfect" system. Every method trades one type of fairness for another.

  ### 4. Is There a "Right" Default?
  There is no method that escapes both the cycle and the flip in all cases, because the cycle indicates that the "group will" is fundamentally undefined for this set of preferences. However, some methods handle these situations more robustly than others.

  **Instant Runoff Voting (IRV)**
  If you had used IRV (eliminate the last-place option and redistribute votes), the result would have been:
  1.  Ballroom eliminated (0 votes).
  2.  Barn eliminated (1 vote). That voter's second choice was Boathouse.
  3.  **Final:** Boathouse (5) vs. Rooftop (4). **Boathouse wins.**
  *   *Pros:* Produces a clear winner; avoids the Borda flip (if you run IRV with Ballroom removed initially, Boathouse still wins).
  *   *Cons:* IRV can violate the **Condorcet Criterion** (it might elect a candidate who would lose head-to-head against another) and can suffer from **Monotonicity failures** (voting for a candidate can sometimes hurt them).

  **Condorcet Methods (e.g., Minimax or Schulze)**
  These methods are designed specifically to detect cycles. When a cycle exists, they use a tie-breaking rule based on the "strength" of the defeats.
  *   In your case, Boathouse lost to Barn by 1 vote. Rooftop lost to Boathouse by 1 vote. Barn lost to Rooftop by 3 votes.
  *   A **Minimax** method would look at the worst defeat for each candidate. Barn's worst defeat is 3 votes. Boathouse and Rooftop both have worst defeats of 1 vote.
  *   This usually results in a tie between Boathouse and Rooftop, forcing a coin toss or chair's tie-break.
  *   *Pros:* Acknowledges the cycle honestly rather than hiding it with points.
  *   *Cons:* Can still result in ties; complex to explain to a general committee.

  ### 5. The Philosophical Takeaway
  You asked what it means for a decision to "reflect the will of the group." Your committee experience illustrates the hard lesson of democratic theory: **The "will of the group" is not a pre-existing object waiting to be discovered; it is constructed by the method you use to measure it.**

  *   If you value **majority rule** above all, you must accept that sometimes there will be no winner (the Cycle).
  *   If you value **decisiveness** (always getting a winner), you must accept that the result can be manipulated by adding or removing losing options (the IIA violation).
  *   If you value **simplicity** (Plurality), you accept that you will ignore most of the information voters provide (their 2nd and 3rd choices).

  **Recommendation for your Committee:**
  For a social committee of nine people, **Ranked Choice Voting (Instant Runoff)** is likely the best practical default. It avoids the "spoiler effect" of plurality, it is less susceptible to the "irrelevant alternative" flip than Borda points, and it is easier to explain than Condorcet methods. However, you must accept that if a cycle exists, IRV will pick a winner based on the *order of elimination*, which is somewhat arbitrary.

  Your frustration is valid. You didn't just have a messy meeting; you ran into a mathematical limit on how well we can aggregate human preferences. The "fairness" you were looking for doesn't exist as a single point; it exists as a set of trade-offs you have to choose between consciously.
