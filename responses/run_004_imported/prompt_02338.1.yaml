answer: |-
  The whiteboard was nearly full. Blue ink sprawled across the glossy surface, a map of lemmas and corollaries that Elias had spent the last forty minutes defending. The air in the conference room was stale, recycled too many times, smelling faintly of dry-erase solvent and cold coffee.

  Dr. Voss sat at the head of the table, fingers steepled. He hadn't taken a note since the introduction. The other two committee members shifted in their chairs, sensing the shift in pressure, but Voss was still.

  "Your thesis claims," Voss said, his voice level, "that human mathematical intuition can be effectively modeled by a recursively enumerable formal system. Let's call this system $E$. For $E$ to model you, Elias, it must be capable of producing every proof you can recognize as valid."

  "That's the claim, yes," Elias said. He capped his marker. His hand trembled, just slightly. "Within the bounds of arithmetic."

  "Then $E$ is subject to Gödel," Voss said. It wasn't a question.

  "Any system strong enough to encode arithmetic is," Elias replied. "I address this in chapter four. The system is incomplete, but sound."

  Voss stood up. He walked to the board, picking up a black marker. He didn't erase anything; he just found a empty patch of white space near the bottom right. "If $E$ models you, then there exists a Gödel sentence $G(E)$. This sentence asserts, within the language of arithmetic, that '$G(E)$ is not provable in $E$'."

  Elias nodded. "Standard construction."

  "If $E$ is consistent," Voss said, writing $Con(E)$ in the corner, "then $G(E)$ is true. But $E$ cannot prove it. However, you, standing outside $E$, can see that it is true. Therefore, you are not $E$."

  "That's the Lucas-Penrose argument," Elias said. He knew where this was going. He had rehearsed this. "But it relies on the assumption that I can know $E$ is consistent. If I am $E$, I cannot know my own consistency from the inside. Gödel's second theorem forbids it. So I don't actually know $G(E)$ is true. I only know it's true *if* I'm consistent. And I can't prove that."

  Voss turned from the board. His eyes were tired, dark circles bruising the skin beneath them. "Precisely. So, when you look at $G(E)$, do you see it as true?"

  "I see it as conditionally true," Elias said. "Contingent on consistency."

  "But do you believe you are consistent, Elias?" Voss stepped closer. "Not logically consistent in the abstract. *You*. Your mind. Do you believe you never make mistakes? That you never hold contradictory beliefs?"

  "No," Elias said. "Humans are inconsistent."

  "Then if $E$ models you, $E$ is inconsistent." Voss tapped the board. "If $E$ is inconsistent, it proves everything. Including $G(E)$. And including $\neg G(E)$. So if you are truly modeled by $E$, and you are inconsistent, then $G(E)$ might be false. And you wouldn't know."

  Elias felt a tightness in his chest. This was the bind. To claim the truth of the Gödel sentence, he had to claim insight beyond the system. But to claim that insight, he had to assume the system was sound. If the system was his own mind, he was assuming his own soundness to prove his own transcendence. It was circular.

  "I don't claim perfect soundness," Elias said. "I claim effective modeling."

  "Answer the question," Voss said softly. "Look at the sentence. Imagine it written there. $G(E)$. 'This statement cannot be proven by Elias's reasoning process.' Do you see it as true?"

  Elias looked at the blank space where the sentence would be. He tried to simulate the logic. If his reasoning process was flawed, if there was a hidden contradiction in his cognitive architecture, then he might believe $G(E)$ was true when it was actually false. Or he might believe it was false when it was true.

  He needed to know he was consistent to know the sentence was true. But how could he know he was consistent? Any check he performed would be performed *by* the very mind he was checking. It was like trying to lift yourself by your own shoelaces.

  "I..." Elias started. He stopped.

  He felt the urge to say *Yes*. It was a strong urge. A intuitive pull. The sentence *felt* true. It felt like looking at a shadow and knowing a solid object cast it. But where did that feeling come from? Was it a glimpse of Platonic truth, a non-algorithmic insight Penrose would claim proved he wasn't a computer?

  Or was it just a heuristic? A rule embedded in his neural wiring that said *'Trust your own output unless proven otherwise'*? If his brain was just a complex machine, evolved for survival rather than truth, that heuristic might be a survival mechanism, not a logical guarantee. A bug disguised as a feature.

  "I feel that it is true," Elias said.

  "Feel," Voss repeated. "Is that a proof?"

  "No."

  "Then why are you confident?"

  "Because I assume I'm sane," Elias said. "I assume my basic logical faculties work."

  "And who verifies the verifier?" Voss asked. "If you are a formal system, Elias, you cannot verify your own consistency. If you are not a formal system, your thesis is false. Which is it?"

  The room was silent. The hum of the projector fan seemed to grow louder. Elias looked at his hands. They were steady now. He thought about the code he wrote, the verification tools he built. He knew those tools could never prove their own correctness completely. He always needed a meta-system, a higher authority.

  Who was the higher authority for his mind?

  "I don't know," Elias said.

  "Is that an admission of defeat?"

  "It's an admission of limits," Elias said. He looked up at Voss. "But here's the thing. Even if I'm just a machine, even if my confidence is just a reflex... I still can't prove I'm wrong. I can't prove that this feeling of certainty is just a glitch. And I can't prove it's divine insight."

  Voss stared at him. For a moment, the examiner looked less like a judge and more like a mirror. "So you claim uncertainty as your proof?"

  "I claim that the uncertainty is the only honest output the system can produce," Elias said. "If I said 'Yes, it's true' with absolute certainty, I would be lying. I'd be claiming knowledge I can't have. If I say 'I don't know,' I am accurately reporting the state of the system."

  "But you still *feel* it's true," Voss pressed. "You said that. The feeling persists despite the uncertainty."

  "Yes."

  "Then the system produces 'True' regardless of the logical justification." Voss walked back to his chair and sat down. He picked up his pen. "It outputs 'True' because it is programmed to trust itself. A self-trusting algorithm is not transcendence, Elias. It's just recursion."

  Elias opened his mouth to argue, but the words died. Was that it? Was his intuition just a hardcoded axiom of self-trust? If so, Penrose was wrong. He wasn't seeing truth; he was executing a subroutine that assumed consistency because assuming consistency was useful for navigating the world.

  But then, how did he know that? Was *that* thought just another subroutine?

  He looked at the whiteboard. The symbols seemed to swim. He realized he could never step outside himself to check. He was trapped in the room of his own skull, looking at the mirrors, unable to tell if the reflection was real or just glass.

  "I suppose," Elias said, his voice quiet, "that I have to live with the output."

  Voss stopped writing. He looked up, his expression unreadable. "Live with it. Or execute it?"

  Elias didn't answer. He couldn't. To answer would be to provide more data from the system, data that could be interpreted as either insight or reflex. He capped his marker. The click sounded loud in the silence.

  "I'm ready for your judgment," Elias said.

  Voss nodded slowly. He looked at the board, at the empty space where the Gödel sentence remained unwritten, invisible but heavy enough to bow the air.

  "We'll deliberate," Voss said.

  Elias sat down. He waited. He tried to monitor his own waiting, to see if his impatience was human anxiety or system latency. He couldn't tell. He simply waited, trusting that he would know the result when it came, trusting that he would understand it, trusting that he was who he thought he was.

  He had no choice but to trust. And that, he realized, was the only axiom he had left.
