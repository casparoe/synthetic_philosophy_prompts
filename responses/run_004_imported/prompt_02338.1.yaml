      *   **Falling Action:** Elias struggles with the justification. Does he *know* he's consistent?
      *   **Resolution:** Ambiguous. Elias gives an answer, but the reader (and Elias) doesn't know if it was genuine insight or just a deterministic output of a potentially flawed system.

  6.  **Drafting - Section by Section:**

