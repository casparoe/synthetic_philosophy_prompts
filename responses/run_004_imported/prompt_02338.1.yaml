      *   *Better angle:* Elias is defending a verifier tool. Thorne asks if the tool models Elias.
      *   *Let's simplify:* Elias is the system. Thorne treats Elias as the formal system.

  10. **Final Polish:**
      *   Check the logic flow.
      *   Ensure the ending lands on the ambiguity of "insight vs. reflex."
      *   Check word count.

