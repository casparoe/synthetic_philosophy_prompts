          *   Focus: The tension of reasoning, not sci-fi trappings.

  2.  **Deconstruct the Philosophical Core:**
      *   The Lucas-Penrose argument hinges on the idea that humans can *see* the truth of $G(F)$ (the Gödel sentence for system $F$) because they can see $F$ is consistent.
      *   The counter-argument is: How do you know $F$ is consistent? If $F$ is your own mind, can you know *you* are consistent? If you assume you are consistent to prove $G(F)$ is true, but you might be inconsistent, then your belief in $G(F)$ might be false.
      *   The story needs to capture this moment of self-reference. A character trying to verify their own reasoning process using that same reasoning process.

  3.  **Brainstorming Settings:**
