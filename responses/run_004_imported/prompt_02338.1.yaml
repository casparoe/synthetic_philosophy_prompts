      *   *The Logic:* Thorne writes $F$ on the board. Represents Elias's reasoning. Constructs $G$. "This statement is unprovable in $F$."
      *   *The Trap:* Thorne asks, "Is it true?"
      *   *The Internal Conflict:* Elias feels the urge to say "Yes." It *looks* true. But why? Because he trusts his mind. But his mind is $F$.
      *   *The Dialogue:* Thorne presses on consistency. "How do you know you aren't crazy?" (Metaphorically).
      *   *The Ending:* Elias speaks. The room waits. Did he transcend the system, or did the system just output "True" because it was programmed to seek consistency?

  7.  **Refining the Philosophy:**
