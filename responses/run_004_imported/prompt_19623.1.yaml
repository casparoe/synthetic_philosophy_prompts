answer: |-
  The whiteboard in the kitchen still held the ghost of Monday's sprint planning, faint gray smudges of dry-erase marker outlining a workflow that had already collapsed. It was past eight. The office hummed with the low-frequency vibration of the server rack down the hall, the only sound besides the ice machine cycling in the breakroom fridge.

  Aviva tapped her stylus against the tablet, the spreadsheet glowing in the dim light. "Look at the column, Marcus. Just look at it. Net surplus distributed: one hundred percent. Zero retained earnings. Zero investor dividends. Every dollar of value added went to the people who typed the code."

  Marcus leaned against the counter, nursing a mug of tea that had gone cold an hour ago. "I'm looking at it. I see the numbers. I also see that we spent six weeks building a loyalty integration for a fast-food chain that pays its cashiers below living wage."

  "That's the client's morality, not ours," Aviva said, not looking up. "Our morality is in the ledger. We abolished the extraction of surplus value. There is no capitalist class skimming off the top. By Marx's definition, exploitation is dead in this room."

  "Exploitation is the symptom, Aviva. Not the disease." Marcus set the mug down. It clinked too hard. "The disease is alienation. And look at us. We're still governed by the backlog. We're still chasing velocity. If the market demands a feature by Friday, we work Thursday night. Who is the master there? If it's the market, then we haven't freed ourselves. We've just become collective slaves to the same invisible hand."

  Aviva finally looked up, her expression tight. "You're treating 'the market' like a person we can negotiate with. It's just reality. Scarcity is real. If we don't ship, we don't eat. That's not alienation; that's physics. The difference is, when we don't eat, *we* decide how to tighten the belt. Remember last quarter? When Sarah wanted to take leave? We voted to cover her share of the overhead without penalizing her. A traditional firm would have fired her."

  "A benevolent prison is still a prison," Marcus said. "But let's talk about Sarah. She didn't just want leave; she wanted out. She wanted to sell her share. And what happened?"

  Aviva stiffened. "The bylaws are clear. Internal buyback. Valuation based on trailing twelve months."

  "Which *we* set," Marcus pressed. "But we set it based on profitability. So, to maximize her buyout, we had to maximize surplus. To maximize surplus, we had to accept the FastFood Corp contract. So her exit payout was literally funded by our alienation. We sold our time to a master we despise to pay a member to leave us. How is that not estrangement from the product of our labor?"

  "Because she had the choice to stay," Aviva countered, turning fully toward him now. "And if she stays, she has a vote on whether we take FastFood Corp next time. You're conflating discipline with domination. In a capitalist firm, the discipline is imposed from above. Here, the discipline is self-imposed. It's autonomous. If we choose to sprint, it's because we collectively agreed that the surplus is worth the stress."

  "Did we agree?" Marcus asked quietly. "Or did the junior devs agree because they need the surplus to pay rent, and the seniors agreed because they feel responsible for the juniors? That's not autonomy, Aviva. That's coercion mediated by solidarity. You've solved the distribution problem, but you've kept the production problem intact. We still don't own the *purpose* of the work. We just own the proceeds."

  "So what is the alternative?" Aviva's voice rose, echoing slightly off the tile. "We become a commune? We build open-source tools until the server bill goes unpaid? You want to prioritize 'species-being' over solvency. But if the co-op folds, everyone goes back to Amazon or Google. Then the exploitation is real again. My way keeps the lights on."

  "My point isn't to fold the co-op. It's to admit that the ledger isn't the whole story." Marcus pushed off the counter, walking to the window. The city lights blurred in the rain. "You keep saying alienation is a 'minor problem' leftover from bad management. You think if we just rotate tasks enough, or let people pick their Jira tickets, the estrangement goes away. But the estrangement comes from the fact that the value of our labor is determined by its exchange value, not its use value. We build things to sell, not to use. That doesn't change because we split the check evenly."

  Aviva walked over to the table and picked up the tablet again, shielding it like a clipboard. "Okay. Let's test that. You keep implying my model is blind. Tell me what would count as evidence against it. If we found a firm that was wholly non-exploitative by the numbers—zero surplus extraction, full democratic control—but the workers felt totally alienated... would you say it's a failure?"

  "Yes," Marcus said immediately. "I'd say it's a factory where the workers own the machines but still hate the work."

  "Then we agree it's possible," Aviva said, trapping him. "A firm can be non-exploitative and alienating. Which means they are separate variables. Which means I can fix exploitation without fixing alienation, and I've still achieved something moral. I've stopped the theft."

  "But you haven't stopped the dehumanization," Marcus turned back. "And here's my question for you: Could a firm be *thoroughgoingly* alienating—workers treated as mere cogs, no connection to the product, total market discipline—and yet, by your definition, be wholly non-exploitative? Is that combination coherent? Or does the alienation eventually corrupt the books?"

  Aviva paused. She looked at the spreadsheet, then at the whiteboard, then at Marcus. "If they are truly alienated, productivity drops. Turnover spikes. The surplus evaporates. So in the long run, no. The market punishes alienation."

  "But what if it doesn't?" Marcus stepped closer. "What if we get really good at selling our alienation? What if we optimize the sprint so well that we love the money more than we hate the work? Then the ledger says 'success,' and the human being says 'misery.' In that scenario, your metric lies. It tells you justice has been served when it hasn't."

  "Then we vote to change the work," Aviva said, though her voice lacked its earlier steel. "That's the mechanism. If we hate it, we stop doing it."

  "We can't stop doing it if the buyback clause requires us to maintain valuation," Marcus said. "We are locked into growth by the very mechanism you designed to ensure fairness. You built a golden cage, Aviva. The bars are made of surplus shares."

  Aviva set the tablet down on the table. The screen went dark. "And you want to break the cage, even if it means we lose the gold. Even if it means some of us can't pay our mortgages. You're willing to trade material security for... what? Philosophical purity?"

  "I'm willing to trade efficiency for meaning," Marcus corrected. "I'm saying that if we don't address the *why* of the labor, the *who* of the ownership doesn't matter. We're just a cartel of freelancers protecting our rates."

  "We are a shield," Aviva said. "Against a world that eats people. My shield works. It stops the bleeding."

  "It stops the bleeding," Marcus said, picking up his cold tea. "But it doesn't let the patient walk."

  They stood there for a moment, the hum of the server rack filling the silence between them. Aviva reached for her tablet, waking the screen. The numbers glowed again, bright and undeniable.

  "We have the steering committee meeting tomorrow," Aviva said, her voice flat. "We need to decide on the Q3 budget."

  "Right," Marcus said. "FastFood Corp renewal is on the agenda."

  Aviva didn't look at him. "I'm voting yes."

  "I know," Marcus said. He opened the fridge and poured the cold tea down the sink. "I'm voting yes too."

  He put the mug in the dishwasher. It didn't make a sound.
