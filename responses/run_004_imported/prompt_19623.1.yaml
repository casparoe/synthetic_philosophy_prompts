      *   **Marcus:** Idealist, philosophical, focused on the experience of work. He believes structure dictates consciousness. If the market dictates the work, the workers aren't truly free, even if they split the check.
      *   **Setting the Scene:** Late night, office kitchen or conference room. Empty coffee cups, whiteboards with sprint planning. Let's go with the kitchen—it feels more intimate and weary.

