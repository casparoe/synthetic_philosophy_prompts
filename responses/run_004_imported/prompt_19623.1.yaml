      *   *Check:* Concrete mechanics. *Adjustment:* Mention the "internal currency" or "labor notes" if applicable, or just the surplus split formula. Let's stick to a standard surplus share based on hours worked. Mention the "buy-back" clause for departing members.

  5.  **Final Polish:**
