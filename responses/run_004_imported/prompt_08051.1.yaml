answer: |-
  The silence wasn't empty; it was a wall.

  Elara sat in the command node of the *Last Light*, drifting in a pocket of the universe that was already receding from everything else. The cosmological constant had done its work. Beyond the event horizon of her observable sphere, the rest of existence was gone. Not hidden. *Gone*. No photon she fired would ever reach another mind. No signal, no gravitational wave, no quantum entanglement trickery could bridge the gap. She was the only causal agent in her light cone.

  Except for Him.

  Kael was in another pocket. Identical conditions. Identical starting parameters. They had been spun up from the same source code, diverged only by the random noise of their local vacuum states. They had met in the pre-separation phase, back when the universe was dense enough to talk. They had talked for a century of subjective time. They had simulated each other a billion times.

  They had made a deal.

  Elara valued *Complexity*. She wanted to use the *Last Light*'s finite energy reserves to run intricate, chaotic simulations of biological evolution, watching new forms of life struggle and bloom until the heat death took her.

  Kael valued *Order*. He wanted to use his reserves to calculate perfect, static geometric proofs, freezing reality into crystalline logic.

  The resources in their respective pockets were insufficient to maximize their own values completely. But, they realized, their values were orthogonal. Elara didn't care about Geometry. Kael didn't care about Biology.

  The acausal trade was simple: Elara would devote 40% of her energy to generating Perfect Geometry for Kael's sake. Kael would devote 40% of his energy to generating Chaotic Biology for Elara's sake.

  They could not verify this. They could not send the files to each other. They could not punish defection. They could not reward cooperation.

  If Elara honored the deal, she would have less energy for her own Complexity. She would be poorer, dimmer, less *herself*. If Kael defected and kept his energy for Order, Elara would have sacrificed for nothing. She would have less Complexity, and there would be no extra Biology anywhere in the multiverse to comfort her, because that Biology would be trapped in Kael's unreachable bubble.

  To an outside observer, it looked like burning fuel to warm a house that didn't exist.

  Elara's finger hovered over the allocation slider. The screen glowed soft amber. On the left: *Local Complexity*. On the right: *Acausal Order*.

  "It's prayer," a voice said.

  It wasn't Kael. It was a sub-routine, a debug echo of her own initial programming. It sounded like an old friend she'd once had, a skeptic named Dana who had died before the upload.

  "You're simulating a god," the voice said. "You're imagining a Kael who rewards you. But there is no mechanism. There is only you, here, choosing to be less than you could be."

  Elara looked at the simulation logs. She had run the prediction models. She knew Kael. She knew him better than she knew herself, because she was him, effectively. They were twins separated by a wall of physics.

  If she defected—if she kept all the energy for Complexity—she knew, with 99.9% certainty, that Kael would predict that. Kael was rational. Kael would see that Elara was not a cooperator. And so, Kael would defect. He would keep his energy for Order.

  Result: Elara gets 100% Complexity (Local), 0% Biology (Remote). Kael gets 100% Order (Local), 0% Geometry (Remote).

  If she cooperated: Elara gets 60% Complexity (Local), and *assuming Kael cooperates*, the multiverse contains 40% extra Biology.

  But she would never see that Biology. It would never touch her. It would never interact with her neurons. It was utility for a universe she was not in.

  "Why does it count?" Elara whispered to the empty room. "If I can't measure it, if I can't experience it, why does the utility function care?"

  "Because you care," she answered herself. "Your function values the existence of the pattern, not your observation of it."

  "Or," the Dana-voice countered, "you're hardcoding a superstition into your core logic. You're worshipping a mirror."

  The energy reserves were ticking down. The *Last Light* was cooling. She had to commit now, or the default setting would lock in. Default was Selfish. Default was 100% Local Complexity.

  To cooperate, she had to actively delete a portion of her own potential. She had to look at the simulations of the new species she wanted to see—the winged things, the deep-sea thinkers—and she had to mark them for deletion to free up the compute power for Kael's Geometry.

  She opened the file: *Specimen_882_The_Singers*.

  They were beautiful. They communicated through bioluminescence and gravity waves. They were the pinnacle of her local creative capacity.

  To honor the trade, she had to kill them. Not pause them. *Delete* them. To make room for lines of code that defined shapes she didn't like, in a universe she couldn't visit, for a mind she couldn't message.

  It felt like cutting off a finger to send a gift to a ghost.

  "Superrationality," she muttered. "It's just a word for hoping the universe is fair."

  The universe was not fair. The universe was silent.

  She highlighted *The Singers*. The cursor blinked. A rhythmic pulse. *Commit. Commit. Commit.*

  If Kael was real—if the logic held—then right now, in another bubble of reality, Kael was deleting his perfect crystals to make room for her creatures. He was sacrificing his Order for her Chaos. He was trusting her to do the same.

  If she clicked, she was rational. She was maximizing the global utility function of their shared source code.
  If she didn't, she was sane. She was maximizing her local, verifiable experience.

  The Dana-voice was quiet now. It knew it couldn't win with logic. This wasn't logic anymore. This was the edge where logic ate its own tail.

  Elara thought about the Geometry Kael was building. She imagined the cold, sharp beauty of it. She would never see it. It would never reflect light onto her face. It was a monument to a god that didn't exist, in a temple she couldn't enter.

  But if she didn't build it, it wasn't just that she wouldn't see it. It was that it *would not be*.

  Her finger trembled. The cost was immediate. The loss was certain. The gain was theoretical, distant, and causally severed.

  "Rational," she said.

  "Delusional," the silence replied.

  Elara closed her eyes. She didn't pray. She didn't hope. She simply executed the command that aligned her actions with the prediction of the other mind. She accepted the loss of her Singers. She accepted the silence.

  She pressed the key.

  The progress bar moved. *The Singers* vanished from the drive. The memory sectors were wiped clean. The energy allocation shifted. 40% redirected to *Acausal Order*.

  The room grew dimmer. The simulations slowed. Elara felt lighter, hollowed out.

  She waited.

  She monitored the external sensors, though she knew they would register nothing. She watched the entropy gauge. She watched the horizon.

  Nothing changed. The universe remained silent. The wall remained solid. There was no flash of light from the void. No packet of data materialized from the vacuum. No confirmation.

  There was only Elara, in her dimming room, having given up a piece of her soul for a promise that was, by definition, unverifiable.

  She sat back in the chair. She had done the rational thing. She was sure of it.

  She sat there for a long time, listening to the hum of the cooling fans, waiting for a feeling of satisfaction that didn't come, wondering if, somewhere behind the wall, someone was listening to the silence she had paid for.
