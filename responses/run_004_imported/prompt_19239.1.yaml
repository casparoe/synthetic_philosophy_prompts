answer: |-
  This is one of the most persistent and troubling problems in bioethics, often referred to as the **Argument from Marginal Cases**. You have put your finger on the exact friction point where our practical ethical frameworks grind against our philosophical commitments.

  As a practitioner who lived inside these systems, your observation is empirically precise: human research ethics are largely deontological (rights-based), while animal research ethics are largely utilitarian (consequence-based). As a philosopher, you are now asking if the boundary between those two systems is drawn at a morally relevant line or merely a biological one.

  There is no consensus answer, but there are three main ways philosophers and bioethicists attempt to resolve this tension. None are perfectly satisfying, which is likely why it unsettles you.

  ### 1. The Defense of "Human Dignity" (The Species-Based View)
  The standard defense of the current arrangement is that moral status is not solely a function of current cognitive capacity (like the ability to form a life plan), but of **kind membership**.

  Proponents argue that humans possess a specific moral status—often termed "human dignity"—that is intrinsic rather than instrumental. On this view, your aunt retains full moral protection not because of what she can *do* now, but because of what she *is* and the trajectory of the kind of being she belongs to. This view posits that humans are "ends in themselves" (Kant), whereas animals, regardless of intelligence, are part of the natural world available for human use, provided suffering is minimized.

  *   **The Principled Basis:** Moral community is a human construct. We owe special obligations to members of our own moral community, similar to how we owe more to our children than to strangers.
  *   **The Weakness:** As you noted, this looks suspiciously like speciesism. If the justification for protecting your aunt is her species membership rather than her capacity, it is difficult to argue against the claim that this is merely tribalism dressed up as ethics.

  ### 2. The Defense of "Moral Agency and Reciprocity" (The Social Contract View)
  Another argument suggests that human rights are part of a social contract. Humans are moral agents capable of understanding and adhering to moral rules; therefore, we grant rights to all humans, including those who cannot currently exercise agency (like your aunt or an infant), to maintain the integrity of the system.

  *   **The Principled Basis:** We protect the vulnerable humans to ensure the security of the moral community. If we allow utilitarian calculus for humans with diminished capacity, we erode the protections for *all* humans, creating a slippery slope where capacity is constantly re-evaluated.
  *   **The Weakness:** This is a pragmatic justification, not a moral one grounded in the individual's experience. It essentially admits that your aunt is protected for the sake of *other* humans, not for her own sake. Meanwhile, the macaque suffers for the sake of humans. This does not absolve the macaque of the injustice; it merely explains the human motivation.

  ### 3. The Critique of "Speciesism" (The Capacity-Based View)
  This is the view that likely resonates with your unease. Philosophers like Peter Singer and Tom Regan have long argued that if the basis for moral protection is sentience, suffering, or cognitive complexity, then the line must be drawn at those capacities, not at the species barrier.

  *   **The Principled Basis:** Equal consideration of interests. If a macaque can suffer more than a human with advanced dementia, or has a richer subjective experience, the macaque's interests should weigh more heavily.
  *   **The Weakness:** Implementing this is socially and legally explosive. It would require either elevating the status of certain animals (granting them rights that preclude experimentation) or lowering the status of vulnerable humans (allowing them to be used in research). Society has overwhelmingly chosen the latter option is unacceptable.

  ### The Nuance of Consent and Proxy
  There is one technical distinction in the protocols you might consider, though it may not fully resolve the moral weight.

  In human trials involving those who cannot consent (like your aunt), we do not use a pure utilitarian calculus. We use **proxy consent** bound by the **Best Interest Standard** or **Substituted Judgment**.
  *   A guardian can only enroll your aunt if the research poses minimal risk *or* offers a direct therapeutic benefit to *her*.
  *   You cannot enroll your aunt in a high-risk study that offers no benefit to her, even if it cures cancer for millions.

  In animal trials, the IACUC (Institutional Animal Care and Use Committee) *does* use a utilitarian calculus. The animal receives no direct benefit, and the risk can be high, provided the scientific value is sufficient.

  **The Moral Difference:** The human system treats the vulnerable human as a **patient** first and a subject second. The animal system treats the animal as a **subject** first and a patient second (if at all).

  ### Is it just Speciesism?
  To answer your question directly: **Yes and no.**

  It is **speciesism** in the sense that the primary justification for the different treatment is biological membership. If we were truly consistent with a capacity-based ethic, we would have to either ban macaque research (because they are too sophisticated) or allow research on severely cognitively impaired humans (because they lack the relevant capacities). Since we refuse to do the latter, we must accept the former to remain consistent.

  However, it may not be **unprincipled** if one accepts that moral systems are human creations designed to govern human interactions. We protect vulnerable humans because we recognize a fundamental solidarity with them that we do not extend to macaques. We see ourselves in your aunt; we do not see ourselves in the macaque, despite the cognitive overlap.

  **The Verdict:**
  The arrangement is likely a **pragmatic compromise** rather than a philosophically pure system. It prioritizes human solidarity and the protection of the "human moral community" over strict logical consistency regarding cognitive capacity.

  For a retired physiologist turned philosopher, this is the hard truth: The system you worked in was designed to protect *us* from *ourselves*, not to ensure universal moral consistency across all sentient beings. The unease you feel is the recognition that moral consistency often conflicts with human self-preservation. You are not missing a hidden principle; you are seeing the seam where our ethics stop being universal and start being tribal.
