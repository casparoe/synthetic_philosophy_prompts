answer: |-
  You have hit on one of the most common and understandable misconceptions in the foundations of quantum mechanics. The short answer is: **Bell's Theorem does not rule out Hidden Variables; it rules out *Local* Hidden Variables.**

  Bohmian Mechanics is a *Nonlocal* Hidden Variable theory. Therefore, it slips through the hole in Bell's net exactly where it was designed to go.

  Here is the breakdown of why your intuition tripped up, why Bell actually vindicated Bohm rather than burying him, and why Eliezer (and many others) still argue against it despite it being logically consistent.

  ### 1. The Missing Word: "Local"
  The confusion stems from how Bell's Theorem is often pop-sci summarized. You often hear: *"Bell proved there are no hidden variables."*

  That is incorrect. What Bell proved is: **"No theory based on Local Hidden Variables can reproduce the predictions of Quantum Mechanics."**

  *   **Realism/Hidden Variables:** Particles have definite properties (like position) before you measure them.
  *   **Locality:** Things can only influence each other at speeds up to the speed of light. No instantaneous action at a distance.

  Before 1964, the prevailing hope (championed by Einstein in the EPR paper) was that we could have **both**. We could have a realistic theory (hidden variables) that was also local.

  David Bohm's 1952 theory was a shock because it said: "Actually, you *can* have a deterministic, realistic hidden-variable theory that matches QM perfectly... but you have to give up Locality." In Bohmian mechanics, the "pilot wave" connects all particles in the universe instantaneously. If you wiggle an electron here, the pilot wave updates everywhere immediately, guiding other particles differently.

  Most physicists dismissed Bohm because they thought nonlocality was dead on arrival. They assumed Einstein had proven locality was sacred.

  ### 2. What Bell Actually Did
  John Bell looked at Bohm's theory and realized something profound. He didn't set out to disprove Bohm; he set out to see if Bohm's nonlocality was a weird artifact of his specific math, or if it was a necessary feature of reality.

  Bell derived an inequality that **any Local Hidden Variable theory** must obey.
  Then, Quantum Mechanics predicted violations of that inequality.
  Experiments (Aspect, Clauser, Zeilinger) showed that **nature violates the inequality.**

  **The Logical Consequence:**
  1.  If Nature violates Bell's Inequality, Nature cannot be described by a Local Hidden Variable theory.
  2.  Therefore, you must give up either Locality or Realism (Hidden Variables).
  3.  **Bohmian Mechanics gives up Locality.** It keeps Realism.
  4.  Therefore, **Bohmian Mechanics is perfectly compatible with Bell's Theorem.**

  In fact, Bell's theorem essentially upgraded Bohm's theory from "a weird outlier" to "a proof of concept for how reality must work if you want realism." Bell showed that Bohm's "obviously weird part" (nonlocality) wasn't a bug of Bohm's theory; it was a feature of the universe.

  ### 3. Why Bell Admired Bohm
  You mentioned it seems strange that Bell admired Bohm if his proof "killed" the theory. But in Bell's view, Bohm was the hero who forced the issue.

  Bell was famously critical of the "Copenhagen Interpretation" (the standard "shut up and calculate" view). He felt it was vague about what constituted a "measurement" and relied on a magical "collapse" of the wavefunction.

  Bell admired Bohm because:
  1.  **Existence Proof:** Bohm proved that determinism was *possible*. Before Bohm, von Neumann had a "proof" that hidden variables were impossible. Bohm showed von Neumann's proof relied on an assumption that didn't hold. Bohm broke the dogma.
  2.  **Clarity:** In Bohmian mechanics, there is no "collapse." There are particles, and there is a wave. They evolve deterministically. The "weirdness" of QM is shunted entirely into the nonlocal connection. Bell preferred this explicit nonlocality over the vague "spookiness" of Copenhagen.
  3.  **Vindication:** When Bell proved that *any* realistic theory must be nonlocal, he validated Bohm's 1952 insight. Bohm had said, "I can do it, but it's nonlocal." Bell later said, "Everyone who tries to do it will find it's nonlocal."

  So Bell wasn't being sentimental. He viewed Bohmian Mechanics as the only clear, realistic alternative to Copenhagen, even if he (and most others) found the explicit nonlocality hard to reconcile with Relativity.

  ### 4. Why Eliezer (and Many-Worlds) Disagree
  Since you read Eliezer's sequence, it helps to contrast why he pushes Many-Worlds (MWI) over Bohm, given that Bell lets Bohm off the hook.

  *   **Bohmian Mechanics:** Keeps one world and definite particles, but sacrifices **Locality**. (The pilot wave acts instantly across space).
  *   **Many-Worlds:** Keeps **Locality** (the wavefunction evolves locally according to the Schrödinger equation), but sacrifices **Single-World Realism** (there is no single outcome, just branching).

  Eliezer's argument is essentially: "Nonlocality is a huge bullet to bite. It clashes with Special Relativity. MWI allows us to keep the physics local and deterministic (at the level of the wavefunction), we just have to accept that 'you' split into copies."

  For a Bohmian, the response is: "MWI is ontologically extravagant (infinite universes). I'd rather have one universe with instant connections than infinite universes to avoid them."

  ### Summary
  You aren't misunderstanding the math; you misunderstood the target of the theorem.

  *   **Bell's Theorem:** Kills **Local** Hidden Variables.
  *   **Bohmian Mechanics:** Is a **Nonlocal** Hidden Variable theory.
  *   **Result:** Bohm survives Bell's theorem unscathed.
  *   **Bell's View:** Bohm was right that realism requires nonlocality. Bell's theorem just proved that *everyone* has to pay that price, not just Bohm.

  The 2022 Nobel Prize confirmed that the universe is indeed nonlocal (or non-real, depending on your preference). Bohmians say, "We told you so, and here is the math for the nonlocality." Copenhagenists say, "Don't ask about the reality before measurement." Many-Worlders say, "The wavefunction is local, you're just looking at one branch."

  Bell didn't put Bohm in the ground; he dug up the ground to show that Bohm was standing on the only solid patch left.
