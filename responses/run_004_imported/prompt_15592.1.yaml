answer: |-
  **Setting:** *A university philosophy department lounge, late evening. Rain against the window. Two empty coffee cups sit between them.*

  **Characters:**
  *   **ELENA:** A doctoral candidate specializing in metaphysics and ethics. Hard incompatibilist.
  *   **MARCUS:** An associate professor. Compatibilist, specializing in moral psychology and the Strawsonian tradition.

  ***

  **ELENA:** You keep using the word "sufficient." You say reasons-responsiveness is *sufficient* for responsibility. But it's only sufficient if you ignore the source of the responsiveness.

  **MARCUS:** The source is irrelevant to the practice, Elena. If the mechanism works, the agent is accountable. If I can recognize a reason not to steal—say, the pain it causes you—and I steal anyway, I am blameworthy. That's the whole point of the compatibilist turn. We aren't looking for god-like origination. We're looking for agency within the natural order.

  **ELENA:** But *why* do you recognize that reason? Why does the pain of others register as a reason for you, but for your brother, or for the psychopath, it doesn't?

  **MARCUS:** Because of my upbringing, my neurology, my character.

  **ELENA:** Exactly. You didn't choose that character. You didn't choose the neurology that makes you reasons-responsive. You are lucky. And if you are lucky to be the kind of person who responds to moral reasons, then your "responsibility" is just a fancy name for your good fortune.

  **MARCUS:** That's the luck objection. It's powerful, I grant you. But it proves too much. If constitutive luck undermines responsibility, then *nothing* undermines responsibility, because nothing is self-caused. You're demanding *causa sui*. You're demanding I be the cause of myself.

  **ELENA:** I'm demanding nothing. I'm pointing out a logical structure. Look at Galen's Basic Argument. Premise one: You do what you do because of the way you are. Premise two: To be truly responsible for what you do, you must be truly responsible for the way you are. Premise three: You cannot be responsible for the way you are, at least not in all respects.

  **MARCUS:** I know the regress. To be responsible for the way I am, I must have chosen to be that way based on some prior principle. But to choose that principle, I must already have a character to do the choosing. It's circular. Galen wins on the metaphysics. I'm not disputing that I didn't create myself *ex nihilo*.

  **ELENA:** Then you admit you aren't ultimately responsible.

  **MARCUS:** I admit I'm not *ultimately* responsible in a metaphysical sense. I deny that *ultimate* responsibility is the kind of responsibility that matters. This is where your father's generation—and mine—parts from Galen's. P.F. Strawson didn't care about the metaphysical regress. He cared about the participant stance.

  **ELENA:** Because it feels true?

  **MARCUS:** Because it *is* true, as a fact of human life. Reactive attitudes—resentment, gratitude, indignation, forgiveness—aren't theories we adopt. They are woven into the fabric of interpersonal relationships. You can't opt out of them without opting out of humanity. When your brother hurts someone, the victim feels resentment. That resentment *is* the attribution of responsibility. It doesn't need a metaphysical backbone. It's a brute fact.

  **ELENA:** Just because we can't help but feel it doesn't make it justified. We used to feel an instinctive revulsion toward interracial marriage. That was a brute sociological fact. It was still wrong. You're conflating the *inescapability* of the attitude with its *validity*. If the metaphysics don't hold, the resentment is a cognitive error. It's like being angry at a storm for flooding your basement.

  **MARCUS:** But a storm doesn't have reasons. Your brother does. That's the distinction. The reactive attitude is only appropriate toward beings who can understand the demand. If I explain to you why stealing is wrong, you get it. If I explain it to the storm, nothing happens. That capacity to grasp the reason is the hook where responsibility hangs.

  **ELENA:** But where did that capacity come from?

  **MARCUS:** It came from evolution, socialization, biology.

  **ELENA:** None of which you controlled. You're smuggling the *causa sui* back in through the back door. You say, "As long as the mechanism works, you own it." But you don't own the mechanism! You're just the vessel it's happening inside. If a computer is programmed to output "I am responsible," is it responsible?

  **MARCUS:** A computer isn't a participant in a moral community. It doesn't feel the sting of resentment. It doesn't modify its behavior based on the emotional feedback of others.

  **ELENA:** But your brother might. Or he might not. If he had your stepfather, your foster care, your trauma—wait, I know your history, Marcus. You had it rough too. But suppose you swapped places at birth. You in his home, him in yours. Do you honestly think you'd be sitting here defending moral responsibility? Or would you be the one needing parole?

  **MARCUS:** (Pauses, looks into his coffee) I don't know. Probably not here.

  **ELENA:** So it's luck. Constitutive luck. And if it's luck, then praising you for being "reasons-responsive" is like praising a lottery winner for being "number-responsive." It's incoherent.

  **MARCUS:** Okay. Let's grant you the luck. Let's grant that, metaphysically, neither of us deserves credit for our character. Here is my hit, Elena: So what?

  **ELENA:** "So what?"

  **MARCUS:** If we abolish the practice of holding each other responsible because of this metaphysical technicality, what replaces it? Coercion? Therapy? Management? If I treat your brother not as an agent but as a broken machine to be fixed, I am dehumanizing him. I am saying his reasons don't matter, only his causes do.

  **ELENA:** You're confusing *holding* responsible with *being* responsible. We can keep the practice for pragmatic reasons—safety, rehabilitation—without believing the desert claim is true. We can quarantine a virus without thinking the virus is evil.

  **MARCUS:** But he's not a virus. He's a man. And if you treat him like a virus, you destroy the very thing that might save him: his own sense of agency. If he believes he is merely the product of causes, he has no leverage to change. Believing he is responsible—even if, as you say, it's metaphysically shaky—is a necessary condition for moral growth. The belief *makes* it true, functionally.

  **ELENA:** That's pragmatism, Marcus. It's not truth. You're asking me to endorse a useful fiction.

  **MARCUS:** I'm asking you to recognize that "truth" in ethics isn't found in physics. It's found in the interaction. When I resent you, I am calling on you to justify yourself. I am treating you as a rational equal. When Galen says, "No one is truly responsible," he is taking up the objective stance. He is looking at us like bugs under a glass.

  **ELENA:** And when you say, "Ignore the glass, just look at the dance," you're ignoring the cage. You talk about reactive attitudes as if they're pure. But resentment is often just rage dressed up in philosophy. It's vindictiveness. If I know my brother couldn't have done otherwise given the total state of the universe and his prior mental states, my resentment is cruelty. It's punishing him for the sins of his father, and his father's father, all the way back to the Big Bang.

  **MARCUS:** But he *could* have done otherwise in the relevant sense. If he had chosen to focus on the victim's pain, he wouldn't have struck.

  **ELENA:** Why didn't he choose that?

  **MARCUS:** Because he was angry.

  **ELENA:** Why was he angry?

  **MARCUS:** Because he was provoked.

  **ELENA:** Why did the provocation trigger anger rather than patience?

  **MARCUS:** Because of his temperament.

  **ELENA:** Did he choose his temperament?

  **MARCUS:** (Sharp) No. But he is responsible for managing it.

  **ELENA:** With what tools? Tools he didn't choose. With a patience he didn't cultivate. You're chasing the regress, Marcus. You say "managing it" stops the buck. Galen says it doesn't. Every management strategy relies on a manager who is already constituted a certain way. You can't pull yourself up by your own bootstraps, even if you call the bootstraps "reasons."

  **MARCUS:** You're right. I can't pull myself up by my bootstraps. No one can. That's why the demand for *ultimate* responsibility is a demand for inhumanity. It's a demand that we be gods.

  **ELENA:** It's a demand for honesty.

  **MARCUS:** Is it? Or is it a shield? If no one is responsible, then no one is guilty. That's comforting. It absolves the stepdad, too. He was just a link in the chain.

  **ELENA:** (Flashes of anger) Don't turn this into a defense of monsters. Acknowledging the causal chain doesn't mean we don't stop them. We lock the stepdad up. We lock your brother up if they're dangerous. But we don't pretend they *deserve* suffering in a cosmic sense. We do it because we have to, not because they earned it in some metaphysical ledger.

  **MARCUS:** But the "desert" is in the doing. When you harm someone, you incur a debt to them. Not to the universe, to *them*. The reactive attitude is the collection of that debt. If I refuse to hold your brother responsible, I am refusing to take his victim seriously. I am saying, "What happened to you doesn't warrant resentment." That's condescension.

  **ELENA:** No. It's recognizing that the victim's resentment is natural, but the *punishment* based on desert is unjust. We can validate the victim's pain without buying into the myth that the perpetrator is the prime mover of the universe.

  **MARCUS:** You keep saying "myth." But look at the irony. My father wrote "Freedom and Resentment" to save us from this exact coldness. He wanted to save morality from the skeptics. And his son... his son wrote the Basic Argument to show that the skeptics were right all along.

  **ELENA:** Maybe the son just looked closer.

  **MARCUS:** Or maybe the son looked too far away. He looked from the edge of the universe back at human life. From there, sure, we look like puppets. But we don't live at the edge of the universe. We live here. (Taps the table). In the here, choices happen. Reasons weigh. Regret is real.

  **ELENA:** Regret is real. Guilt is real. That doesn't mean they track moral truth. They track psychological conditioning. I feel guilt when I break a norm. That just means I'm conditioned. It doesn't mean I sinned.

  **MARCUS:** If you hurt me, and you feel nothing, I call you a psychopath. If you hurt me, and you feel guilt, I call you a moral agent. The difference isn't metaphysics. It's the capacity for relationship. If Galen is right, then love is also a fiction. Because to love someone is to hold them responsible for their kindness. If they couldn't help being kind, your gratitude is misplaced.

  **ELENA:** (Quietly) I know. That's the hardest part. If I can't blame him, I can't truly thank him, either. We're alone in our heads.

  **MARCUS:** No. We're together in the practice. The practice is the bridge.

  **ELENA:** The practice is a game we play because we're too scared to stop.

  **MARCUS:** Maybe. But it's the only game we have. If you walk into that parole hearing and tell them, "He isn't responsible, none of us are," they won't release him. They'll keep him forever, because he's unpredictable. If you say, "He accepts responsibility, he understands the harm," he might go home.

  **ELENA:** So I lie to get him out.

  **MARCUS:** You engage in the practice that makes freedom possible. You ask him to stand up, look the board in the eye, and say, "I did it, and I own it." And when he says that, he *becomes* responsible. Not because of the past, but because of the future he's committing to.

  **ELENA:** That's existentialism, not compatibilism.

  **MARCUS:** It's Strawsonian. The attitude creates the status.

  **ELENA:** (Stands up, walks to the window) I want to believe you. I want to believe that when he says "I'm sorry," it means something more than "my neural pathways have been rewired to output apology." But every time I trace the line back... the stepdad, the foster homes, the chemistry... the line never starts with him.

  **MARCUS:** It doesn't have to start with him. It just has to pass through him.

  **ELENA:** (Turns back) And if it passes through him like water through a sieve? If the damage is too deep for the "reasons" to stick?

  **MARCUS:** Then we treat him. We help him. But we don't stop talking to him like a man. Because the moment we stop, he stops being one.

  **ELENA:** And if the truth is that he never was one? In the way you mean?

  **MARCUS:** Then the truth is too heavy to carry. And I'd rather carry the lie that keeps us human.

  **ELENA:** (Softly) That's not a defense, Marcus. That's a prayer.

  **MARCUS:** (Picks up his cup) Maybe they're the same thing, in the end.

  *(Silence stretches between them. The rain continues. Neither moves to leave.)*
