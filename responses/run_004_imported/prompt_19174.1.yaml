answer: |-
  This is one of the most persistent distortions in the philosophy of science, and you are right to be frustrated by the binary way it is usually presented. The standard narrative is either "Popper discredited Darwinism" (creationist favorite) or "Popper apologized and everything is fine" (standard textbook footnote). Neither captures the texture of his actual position.

  Popper's view didn't do a 180-degree flip; it underwent a **demarcation refinement**. He moved from thinking natural selection was *in principle* untestable to thinking it *was* testable, while maintaining that evolutionary biology as a whole faces unique logical hurdles compared to physics.

  Here is the actual shape of his view over time, the specific reservations he kept, and how it fits with his evolutionary epistemology.

  ### 1. The Initial Criticism (1974): Why "Metaphysical"?
  In *Replies to My Critics* (1974), Popper made the famous claim that Darwinism is "not a testable scientific theory but a metaphysical research programme."

  It is crucial to understand *why* he said this. It wasn't because he thought evolution didn't happen. It was a logical point about the phrase "survival of the fittest."
  *   **The Tautology Charge:** Popper argued that if "fitness" is defined solely by "survival," the statement "the fittest survive" is circular. It predicts nothing because any survivor is, by definition, fit.
  *   **The Lack of Universal Laws:** Popper was a strict deductivist. For him, proper science (like physics) relies on universal laws that allow for precise predictions. Evolutionary biology, he argued, deals with unique historical sequences. You cannot predict the specific course of evolution, only the mechanism. Therefore, he categorized it as a "historical science" akin to geology or Marxism (in his view), which placed it on the border of his demarcation line.

  ### 2. The Recantation (1977): The Herbert Spencer Lecture
  In 1977, delivering the Herbert Spencer Lecture titled *"Natural Selection and the Emergence of Mind,"* Popper explicitly retracted the "metaphysical" label.

  > "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."

  **What changed?** He realized that "fitness" *can* be defined independently of survival (e.g., via physiological traits, reproductive capacity, or camouflage efficiency). If you can measure fitness *before* the selection event, the theory becomes falsifiable. If a organism with high measured fitness fails to survive/reproduce without an explainable external factor, the theory is challenged.

  He cited examples like industrial melanism (peppered moths) as evidence that natural selection is empirically testable.

  ### 3. The Lingering Reservations: What Remained "Shaky"
  This is the part most summaries miss. Popper did not simply say, "Evolution is now physics." He retained significant caveats that kept evolutionary biology in a slightly different epistemological category than theoretical physics.

  **A. The Distinction Between Mechanism and History**
  Even after 1977, Popper maintained a distinction between the **theory of natural selection** (the mechanism, which is testable) and **specific evolutionary narratives** (the history of life, which is less testable).
  He worried that biologists often conflated the two. You can test if natural selection *can* work in a lab or a specific field setting. You cannot easily test the specific claim that "Feature X evolved in Species Y *because* of Selection Pressure Z" millions of years ago. Those historical reconstructions are, in Popper's view, closer to "just-so stories." He remained wary of **pan-selectionism**—the idea that every trait must be an adaptation produced by natural selection. He feared this turned the theory into an unfalsifiable dogma where every trait is retrospectively fitted to a survival advantage.

  **B. The Problem of "Unique Events"**
  Popper never fully surrendered the idea that evolutionary biology is a **historical science**. In *The Poverty of Historicism*, he argued that you cannot predict the future course of human history because it depends on the growth of knowledge, which is unpredictable. He applied a similar logic to evolution. While the *mechanism* is scientific, the *outcome* is not predictable in the way planetary motion is. Therefore, while it "counts" as science, it does not count as science in the same "law-heavy" way as classical mechanics. It remains a science of singular, unrepeatable events explained by general mechanisms.

  **C. The Mind/Culture Boundary**
  In that same 1977 lecture, Popper pivoted to argue that natural selection is *not* the best explanation for the emergence of the human mind or culture. He proposed that once language and theory-making emerge, a new layer of selection takes over (the selection of ideas/theories). He was careful to prevent natural selection from becoming a "universal acid" (to use Dennett's later term) that explains everything. He wanted to keep biological selection distinct from cultural/epistemological selection.

  ### 4. Squaring with Evolutionary Epistemology
  You asked how this squares with his view that scientific knowledge grows via a selection analogy (Conjectures and Refutations). This is often cited as a tension: *If Popper thinks evolution is metaphysical, is his epistemology metaphysical?*

  There is no contradiction in his final view, provided you understand the nature of the analogy.

  **Structural Homology, Not Identity**
  Popper's evolutionary epistemology is not dependent on Darwinism being a "hard science" in the physics sense. It relies on a **structural homology** between biological evolution and the growth of knowledge.
  *   **Biology:** Mutation (Variation) + Environmental Pressure (Selection) = Adaptation.
  *   **Science:** Conjecture (Variation) + Critical Testing (Selection) = Truth-likeness (Verisimilitude).

  **The Shift Strengthened His Epistemology**
  When Popper viewed Darwinism as merely metaphysical, his epistemology was slightly vulnerable to the charge that it was based on a "metaphorical" foundation. By conceding that natural selection is a testable, scientific mechanism, he actually **strengthened** the standing of his evolutionary epistemology. It allowed him to argue that there is a real, ontological continuity between biological problem-solving and scientific problem-solving.

  However, he maintained a crucial disanalogy: **Conscious Critical Selection.**
  In biology, variation is blind, and selection is blind. In science, variation (conjecture) is bold, but selection (refutation) is *conscious and critical*. We can eliminate a theory before it kills us. This is why Popper insisted that while science *evolves*, it is a Lamarckian-like evolution of sorts (we can pass on acquired characteristics/ideas), distinct from the blind Darwinian process.

  ### Summary of the "Actual Shape"
  If you are writing this piece, here is the nuanced position to aim for:

  1.  **1974:** Popper argued Natural Selection was metaphysical because "fitness" was ill-defined and evolutionary claims were historical narratives rather than universal laws.
  2.  **1977:** He recanted the "metaphysical" label, accepting that selection is testable *if* fitness is defined independently of survival.
  3.  **The Caveat:** He never treated evolutionary biology as equivalent to physics. He maintained that specific historical evolutionary claims are difficult to test and warned against adaptationist "just-so stories."
  4.  **The Epistemology:** His view of science as an evolutionary process does not depend on Darwinism being "physics," but his recantation removed a potential vulnerability. He views the growth of knowledge as an *extension* of evolutionary problem-solving, distinguished by the use of critical reason to eliminate errors before they eliminate the organism.

  Popper's final position wasn't that "Darwinism is perfect science," but rather "Darwinism is a testable scientific theory that is often misused to create untestable historical narratives." He remained a critic of *how* the theory was applied, even after accepting the theory itself as scientific.
