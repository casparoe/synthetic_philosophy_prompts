answer: |-
  **Setting:** *A quiet study, late evening. Two philosophers, ARTHUR (a Walzerian) and ELENA (a McMahanian), sit across from one another. Between them lies a photograph of two soldiers in a trench, rifles aimed across no-man's-land. Both soldiers look young, terrified, and indistinguishable.*

  **Arthur:** Let's look at them. Call them Soldier A and Soldier B. They are twenty yards apart. They have been told by their superiors that the other is an aggressor threatening their homeland. Neither has the clearance, the intelligence, or the education to verify that claim. They raise their rifles. If they fire, one or both die. You say that if Soldier A is on the unjust side, he is morally liable to be killed by B, but B is not liable to be killed by A. I say they stand on identical moral ground.

  **Elena:** They stand on identical *physical* ground, Arthur. But morality tracks the truth, not the perspective. Suppose A is fighting for an aggressor state and B is defending. A is posing an unjust threat. B is posing a just threat. If I mistakenly believe you are about to murder me, and I raise a gun to stop you, I am not morally permitted to kill you. You, however, are permitted to stop me. The symmetry of ignorance doesn't erase the asymmetry of the facts.

  **Arthur:** But this isn't a street corner mugging. This is war. The "facts" you speak of are inaccessible to them. If moral liability depends on the objective justice of the cause, then every soldier is firing into a moral void. You are telling Soldier A that even if he follows every rule of engagement, even if he targets only combatants, he is participating in a massacre. He is, in your view, morally indistinguishable from a hired hitman, merely excused because he's confused.

  **Elena:** I do not say he is a hitman. I say he is *excused*. There is a profound difference between justification and excuse. A justified act is right; an excused act is wrong, but the agent is not blameworthy. Soldier A acts wrongly by threatening B's life, because B has done nothing to forfeit his right to life. But because A is ignorant and coerced by the state, we do not punish him. We excuse him.

  **Arthur:** And there lies the rub. In the mud of no-man's-land, "excuse" is a phantom. If A is not blameworthy, why is he liable to be killed? Liability usually tracks responsibility for a wrongful threat. If A is not responsible for his ignorance—the state lied to him—why does he bear the cost of that lie with his life?

  **Elena:** Because liability in self-defense isn't solely about culpability. It's about who is responsible for the *threat*. A is the one pulling the trigger. B is the one whose right to life is being infringed. Even if A is non-culpable, B is not required to sacrifice his life to spare A. If a sleepwalker wanders toward a cliff with a gun, I may stop him even if he isn't morally guilty. The unjust combatant is the agent of the threat.

  **Arthur:** But the sleepwalker analogy fails because the sleepwalker isn't operating under a social convention that legitimizes his presence. Soldiers are instruments of the state. When a state sends men to war, it creates a relationship of symmetry between the combatants. By wearing the uniform, A signals: "I am a combatant, not a civilian." He submits himself to the risk of being killed. B does the same. This mutual submission is what grants them the equal right to kill. It's a consensual hazard.

  **Elena:** Consensual? Arthur, look at the photo. Did A consent to fight an unjust war? Did B consent to be invaded? There is no contract here. The "War Convention" you cherish is a legal construct, not a moral truth. You are conflating *jus in bello* (the law of war) with deep morality. I agree that legally, we should treat them as equals to encourage surrender and limit atrocities. But morally? If A kills B, B's death is a wrong. If B kills A, it is a prevention of a wrong. To say they are morally equal is to say that aggression and defense are morally equivalent.

  **Arthur:** I am not saying aggression and defense are equivalent at the level of the statesmen. I am saying that at the level of the infantryman, the distinction collapses. You argue that the unjust soldier is "liable." That implies he has lost his right not to be killed. But if he is ignorant and non-culpable, he retains his right to life. If he retains his right to life, B kills him only by necessity, not by right. This undermines the very idea of the combatant's privilege. It turns war into a policing action where one side are criminals and the other are sheriffs.

  **Elena:** And isn't that often the truth? If we strip away the convention, we see that war is essentially collective self-defense. If a mob attacks my house, and the mob members are ignorant of why they are attacking, they are still attackers. I may shoot them. They may not shoot me. Why does putting on a uniform change the metaphysics of self-defense?

  **Arthur:** Because the uniform changes the *epistemology*. In your mob scenario, I know I didn't attack them. In war, Soldier A genuinely believes he is defending his children from B's invaders. Soldier B believes the same. If you tell me that moral permission depends on objective justice, you make moral permission unknowable. You force soldiers to become amateur geopolitical analysts in the split second before firing.

  **Elena:** I do not ask them to analyze geopolitics in the split second. I ask them to recognize that their permission to kill is contingent on their cause. If they are uncertain, they should be hesitant. Your view gives them a moral blank check. You tell them, "Don't worry about the cause; just follow the rules of engagement." That separates killing from morality. It creates a class of people licensed to kill without needing a moral reason beyond "he is wearing the other uniform."

  **Arthur:** It's not a blank check; it's a firewall. It prevents the slide into total war. If Soldier A believes that because his cause is unjust he is already a criminal, he has no incentive to follow the rules of war. Why show mercy to prisoners if you are already a murderer? Why distinguish civilians if your very presence is a crime? The Moral Equality of Combatants is a pragmatic moral necessity. It keeps *jus in bello* independent so that conduct can be judged on its own merits.

  **Elena:** I can accept that as a legal policy. But we are discussing morality, not policy. You claim the symmetry of their situation carries moral weight. I deny it. The symmetry is superficial. The asymmetry of the threat is fundamental. However, I will concede this: The ignorance of the soldiers affects the *degree* of their liability. An ignorant unjust combatant is less liable than a knowing one. But "less liable" is not "equally liable."

  **Arthur:** But "less liable" doesn't help Soldier B in the trench. B doesn't know A is ignorant. B doesn't know A is unjust. If B shoots A, B must believe he is justified. If your theory is true, B is only justified if A is actually unjust. So B's moral standing depends on a fact he cannot know. This makes morality luck-dependent.

  **Elena:** Morality *is* often luck-dependent. If I shoot in self-defense, but it turns out the "attacker" was a stuntman with a prop gun, I have done something wrong, even if I believed otherwise. My justification depends on the facts, not my beliefs. Soldier B is subjectively permitted, perhaps, but objectively, if A is fighting a just war, B is the aggressor.

  **Arthur:** This leads to a paradox. Imagine both sides are objectively unjust. A dictator fighting another dictator. On your view, *neither* soldier is permitted to kill the other. Every death in that war is a murder, excused or not. On my view, they are engaged in a tragic but permissible contest. Which view honors the reality of their sacrifice more?

  **Elena:** The one that tells the truth. If both sides are unjust, then it is a gang war. Calling it "permissible" sanitizes the blood. We should feel the horror of it. We should say, "These men should not be killing each other." You want to comfort the soldier by telling him his killing is clean. I want to comfort the victim by affirming his right not to be killed.

  **Arthur:** And I want to protect the soldier from becoming a moral monster simply for doing his duty in a system he cannot control. You speak of the victim's right. What of the soldier's right to serve his community without being branded a latent criminal? If the state bears the responsibility for the *ad bellum* decision, why does the liability fall on the instrument?

  **Elena:** Because the instrument is the one causing the harm. We cannot simply offload all moral agency to the state. That is the "Nuremberg Defense" writ large. "I was just following orders" works for legal excuse, but it doesn't change the moral reality that I pulled the trigger. If the order was wrongful, the act is wrongful.

  **Arthur:** But in war, the order is rarely transparently wrongful. That is the condition of modern conflict. If we adopt your view, we create a hierarchy of humanity on the battlefield. The "just" soldier becomes a superior moral agent, entitled to kill the "unjust" soldier who is merely defending himself from what he perceives as aggression. That arrogance is dangerous.

  **Elena:** It is not arrogance to recognize a right to self-defense. If I am justified, I am not "superior," I am merely defending a right. The unjust soldier is not "inferior," he is merely mistaken. But the mistake does not grant him the right to kill me.

  **Arthur:** Let's return to the photo. Look at their eyes. They are identical. They face the same fear. If you tell me that one is morally protected and the other is morally exposed, you are drawing a line through the mist that neither of them can see. I argue that the moral reality of the battlefield is constituted by their interaction, not by the distant decisions of politicians. In that interaction, they are equals. To deny that is to deny the reality of war.

  **Elena:** And I argue that the moral reality is constituted by the rights they violate or uphold. To deny that is to deny the reality of justice. We can agree that the law should treat them equally. We can agree that we should excuse the ignorant. But we cannot say that the aggressor has the same moral right to kill as the defender. That dissolves the concept of a just war entirely. If *jus in bello* is truly independent of *jus ad bellum*, then a soldier fighting for genocide has the same moral license as one stopping it, provided he shoots cleanly. I cannot accept that.

  **Arthur:** And I cannot accept a theory that makes the justice of every shot dependent on a verdict history won't render for decades. I choose the convention. It saves lives by limiting the scope of moral condemnation.

  **Elena:** And I choose the truth. It honors the victims by refusing to call their killing "permissible" when it was not.

  *They sit in silence for a moment, looking at the photograph. The two soldiers remain frozen, rifles raised, the objective justice of their cause unknowable, the symmetry of their peril absolute.*

  **Arthur:** So, in the end, if they fire...

  **Elena:** ...One commits a wrong that is excused. The other performs a right that is necessary.

  **Arthur:** ...Both enter the same darkness. And we are left arguing over the color of the shadow.
