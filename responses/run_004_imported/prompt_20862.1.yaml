prompt: |-
  I'm one of about four people who maintain a small internal Lean library at my company -- basically a tiny in-house mathlib we use to verify parts of a job scheduler. Someone opened a PR with a lemma that says any partial schedule can be extended to a maximal one, proved via Zorn's Lemma (treat partial schedules as a poset ordered by extension, chains get an upper bound by just unioning them, so a maximal element exists). Because that proof bottoms out in choice, Lean forces the definition to be marked noncomputable. Half the maintainers are fine merging it since the theorem's true and we actually need it, the other half think noncomputable lemmas shouldn't live in the same library as our executable scheduler code, since it blurs the line between "this exists" and "here's how to actually build it," and once that norm slides people stop noticing the difference. Our contribution guide says nothing about this case. I've gotta send a short memo before next weeks review recommending one of: merge as-is, quarantine anything noncomputable into its own module, or reject and require a constructive version. Can you draft that memo -- actually pick one, give the reasoning, and don't just wave away the quarantine side as being precious about purity, there's something real going on there so take it seriously.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Situation:**
      *   **Context:** Small internal Lean library for verifying a job scheduler.
      *   **Team:** 4 maintainers (split 2 vs 2 on the issue).
      *   **Issue:** A PR uses Zorn's Lemma (noncomputable/axiom of choice) to prove existence of a maximal schedule.
      *   **Conflict:**
          *   Side A: It's true, we need it, merge it.
          *   Side B: Noncomputable code blurs the line between existence and construction, risking the integrity of the executable scheduler verification.
      *   **Constraint:** Contribution guide is silent. Need a recommendation (Merge, Quarantine, or Reject/Constructive).
      *   **Task:** Draft a short memo picking *one* option, providing reasoning, and taking the "purity" concern seriously (not dismissing it).

  2.  **Evaluate the Options:**

      *   **Option 1: Merge as-is.**
          *   *Pros:* Fast, gets the theorem needed, acknowledges classical math is useful.
          *   *Cons:* Risks contaminating the computational core. If the scheduler verification relies on this lemma to claim *executable* schedules exist, it's a lie. It sets a precedent that might lead to more noncomputable drift.
          *   *Verdict:* Too risky for a library tied to an *executable* scheduler.

      *   **Option 2: Reject and require constructive version.**
          *   *Pros:* Maintains high integrity, ensures everything is executable.
          *   *Cons:* Might be impossible. Zorn's Lemma is often used precisely when constructive bounds are hard or unknown. If the constructive proof is intractable, this blocks progress.
          *   *Verdict:* Potentially impractical. If the math is hard, demanding constructivity might stall the project indefinitely.

      *   **Option 3: Quarantine noncomputable code.**
          *   *Pros:* Compromise. Acknowledges the truth of the theorem without letting it infect the executable core. Enforces a clear boundary. Addresses Side B's concern about "blurring the line" by making the line physical (module boundaries).
          *   *Cons:* Adds structural overhead. Requires discipline to ensure no noncomputable leakage.
          *   *Verdict:* This is the most balanced engineering decision. It respects the mathematical utility while protecting the computational guarantee.

  3.  **Determine the Recommendation:**
      *   I need to pick one. **Quarantine** is the strongest engineering position here. It validates the "purity" concern without rejecting the math. It treats the library as a system with interfaces and boundaries, which is good software engineering practice regardless of formal methods.

  4.  **Drafting the Memo - Key Elements:**
      *   **To/From/Subject:** Standard memo format.
      *   **Decision:** Clearly state the recommendation (Quarantine).
      *   **Reasoning:**
          *   Acknowledge the validity of the math (Side A).
          *   Acknowledge the risk to the executable guarantee (Side B).
          *   Explain *why* quarantine works: It creates an architectural firewalls.
          *   Address the "slippery slope" concern: Explicit boundaries prevent accidental drift.
          *   Practicality: We get the theorem, but we know exactly which parts can't run.
      *   **Action Plan:** How to implement this (naming conventions, imports, etc.).

  5.  **Refining the Tone:**
      *   Needs to be professional, decisive, but empathetic to both sides.
      *   Avoid academic snobbery (don't call Side B "precious").
      *   Avoid pragmatism that ignores risk (don't call Side A "reckless").
      *   Focus on *maintainability* and *trust*.

  6.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Subject:* Policy on Noncomputable Definitions.
      *   *Opening:* We need a rule. The Zorn PR highlighted a gap.
      *   *Decision:* We will quarantine.
      *   *Why:* The scheduler is executable. If we mix, we lose trust. But we need the math.
      *   *The "Real" Concern:* Side B is right that blurring lines is dangerous. If we can't tell what's computable, we can't trust the extraction.
      *   *Implementation:* `Classical` namespace or `Noncomputable` prefix. No imports from there into `Core`.
      *   *Closing:* This keeps us honest but moving.

  7.  **Review against Constraints:**
      *   *Short memo?* Yes, keep it tight.
      *   *Pick one?* Yes (Quarantine).
      *   *Take the purity concern seriously?* Yes, emphasize the architectural boundary as a safeguard against accidental non-extractable dependencies.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm banning classical logic entirely. It's about *where* it lives.
      *   *Emphasis:* Highlight that "noncomputable" isn't "wrong," it's just "not code."
      *   *Lean Specifics:* Mention `noncomputable theory` or specific namespaces to show technical understanding.

  9.  **Final Output Generation:** (matches the provided good response).
      *   Structure: Header, Recommendation, Rationale, Implementation, Conclusion.
      *   Tone: Decisive, technical, respectful.

  *(Self-Correction Note)*: Wait, I should ensure I explicitly mention why "Merge as-is" is dangerous. It's not just philosophy; it's about the *extraction* to the scheduler. If the verification relies on a noncomputable existence proof to claim the scheduler *produces* a result, that's a bug in the verification logic. Quarantine prevents this dependency.

  Okay, ready to write.cw
answer: |-
  **To:** Lean Library Maintainers
  **From:** [Your Name]
  **Date:** October 26, 2023
  **Subject:** Policy Recommendation: Handling Noncomputable Definitions

  **Recommendation**

  I recommend we **quarantine noncomputable definitions into a dedicated module** (e.g., `Scheduler.Theory.Classical`) rather than merging the PR as-is or rejecting it outright.

  **Rationale**

  This issue isn't about mathematical correctness; the Zorn's Lemma proof is valid. It is also not about philosophical purity. The concern raised by half the team is a concrete engineering risk regarding the **trust boundary** of our verification.

  Our library serves two distinct purposes:
  1.  **Specification & Theory:** Proving properties about schedules (existence, bounds, maximality).
  2.  **Extraction & Execution:** Generating the actual scheduler code.

  When we mix noncomputable lemmas into the core library, we erode the guarantee that `#eval` or code extraction represents a runnable program. If a developer inadvertently depends on a noncomputable existence proof in a function intended for extraction, Lean will still compile the *proof*, but the resulting *code* will be stuck or rely on axioms that don't exist in the target runtime.

  By quarantining these definitions:
  *   **We validate Side A:** We acknowledge that classical reasoning is necessary for certain high-level proofs (like maximal extensions) and we keep that knowledge in the repo.
  *   **We validate Side B:** We enforce an architectural firewall. If a module imports `Scheduler.Theory.Classical`, it is explicitly marked as "theory only." We prevent accidental leakage of `axiom of choice` dependencies into the executable core.
  *   **We maintain clarity:** It becomes impossible to "stop noticing the difference." The import graph itself enforces the distinction between "this exists" and "this runs."

  **Implementation Plan**

  1.  **Directory Structure:** Create a `Classical` sub-namespace or directory. Any file declaring `noncomputable theory` or using `classical.choice` must live there.
  2.  **Import Rules:** Core executable modules are forbidden from importing the `Classical` module. Theory modules may import both.
  3.  **The Current PR:** Merge the Zorn's Lemma proof into `Scheduler.Theory.Classical`. Update the PR description to note that this lemma is for reasoning only, not construction.

  This approach treats the distinction as an interface contract rather than a stylistic preference. It allows us to use the full power of Lean's logic without compromising the integrity of the executable scheduler.

  Please review this proposal before Wednesday's meeting. I'd like to adopt this as a standing guideline.
