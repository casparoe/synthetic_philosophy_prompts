answer: |-
  The spectrum of quasar Q0528-250 lay across Aris's monitor like a jagged heartbeat. It was beautiful, in the way only high-resolution data could be: a forest of absorption lines carved into the continuum by intervening clouds of gas billions of years ago. For thirty years, Aris had measured these shadows to weigh the universe. Specifically, to weigh the fine-structure constant, $\alpha$.

  Everyone knew $\alpha$ was constant. It was the dimensionless number that governed the strength of electromagnetism. It was a law.

  But tonight, the lines didn't sit where they should. The many-multiplet method showed a shift. Not a Doppler shift, not instrumental noise. The relative spacing of the iron and magnesium lines suggested that, twelve billion years ago, the electromagnetic force was slightly weaker.

  Aris rubbed his eyes. The server rack hummed in the corner, a steady, physical sound in a room suddenly feeling unmoored. He picked up the phone and dialed Elena. She was still in her office; she always was.

  "Look at the reduction on server four," Aris said when she answered. No greeting. "The magnesium transitions. They're drifting."

  Elena came over. She stood behind him, her reflection ghosting over the spectrum. She was a theorist, a realist about laws. She believed in the machinery behind the numbers. She watched the data scroll for a long time.

  "It's systematic," she said finally. Her voice was tight. "If this is real, the physics is broken."

  "The physics isn't broken," Aris said, though he didn't believe it. "The parameters are different."

  "Don't be naive, Aris. Laws aren't parameters. Laws are relations of necessitation. They're what *make* the electrons bind to the nucleus. If $\alpha$ changes, the necessitation relation $N(Electromagnetism, Strength)$ has snapped. You're telling me the governing structure of the universe just… drifted?"

  "I'm telling you the data shows a variation."

  "It's unintelligible," Elena said, turning away from the screen. She paced the small office, arms crossed as if holding herself together. "A law governs. It doesn't adapt. If it changes, it wasn't a law. But if it wasn't a law, what held the atoms together then? You're suggesting the universe was running on one set of rules and switched to another without a mechanism. That's not science. That's magic."

  For Elena, the crisis was structural. She saw the universe as a clockwork mechanism driven by invisible gears—the universals, the necessitations. To her, a changing constant was like a gear turning into smoke. It was a metaphysical catastrophe. It implied the governing power of the past had dissolved. She looked at the screen with genuine horror, the way a priest might look at an altar collapsing. If she was right, the universe had lost its authority.

  Aris looked back at the spectrum. He felt something different. He felt sick, but not because the machine had broken. He felt sick because he realized there had never been a machine.

  "Elena," Aris said quietly. "Suppose this is real. Suppose $\alpha$ varies across cosmic time."

  "Then physics is over."

  "No. Then we just have a better system."

  "A better system?" She laughed, a sharp, brittle sound. "You're talking about curve-fitting. This is fundamental."

  "I'm talking about the Best System," Aris said. He turned his chair to face her. "You think the law is out there, pushing the particles. I think the law is just the summary. It's the axiomatization that balances simplicity and strength for the entire mosaic of events. Past, present, future. All of it."

  "The mosaic doesn't change," Elena said.

  "The events don't. But the *system* does." Aris pointed at the jagged lines. "If this data holds, then the axiom '$\alpha$ is constant' is no longer part of the Best System. It's too simple, but it lacks strength. It doesn't fit the mosaic. So we replace it with a function, $\alpha(t)$."

  "And?"

  "And if we replace it, then '$\alpha$ is constant' was never a law. Not yesterday. Not when we built the Standard Model. Not even when the universe began."

  Elena stared at him. "That's semantics."

  "It's not. On your view, the law was real yesterday, and today it's broken. On my view, the law never existed. We just thought it did because we hadn't seen the whole picture." Aris looked back at the monitor. The hum of the servers seemed louder now. "We thought we were reading the rules of the game. But we were just writing a summary of the plays. And if the game goes on long enough, the summary changes."

  "So?"

  "So," Aris said, his voice dropping. "It means the future gets a vote. The status of the past depends on the future."

  He let that hang in the air. For Elena, the past was secured by the necessitation that had held it. For Aris, the past was hostage to what hadn't happened yet.

  "If tomorrow," Aris continued, "we find another quasar where $\alpha$ is constant again, maybe the Best System reverts. Maybe the variation is a local anomaly. Maybe the simplest system is still the constant one, and this data is the outlier. We won't know until we see the rest of the mosaic."

  "You're saying the lawhood of the twentieth century depends on what we find in the twenty-fifth?"

  "I'm saying there is no lawhood. There's just the pattern. And we don't know the pattern until the universe finishes."

  Elena shook her head, grabbing her coat. "I can't work with this. If the laws aren't governing, if they're just… descriptions that update… then there's no reason for anything. It's just one damn thing after another."

  "It's always been one damn thing after another," Aris said. "We just liked pretending there was glue."

  She left. The door clicked shut, leaving Aris alone with the spectrum.

  He should have felt relieved. The Anti-Humean panic was loud, dramatic, a cry of betrayal. But the Humean realization was quiet, a slow erosion. Elena was worried the engine had failed. Aris was worried there was no engine.

  He looked at the absorption lines again. They were just data points. Events in the mosaic. They didn't care about his axioms. They didn't care about simplicity.

  The unease settled in his stomach like cold water. It wasn't that the universe was chaotic. It was that it was indifferent to being described. The "law" he had dedicated his life to wasn't being violated; it was being retroactively negated. Every paper he had published, every grant he had written, every lecture he had given on the stability of nature—it was all based on a summary that might not qualify as a system once the full data was in.

  He realized he could never be sure of anything again. Not because measurement was hard, but because lawhood was provisional. A constant was only a constant until the future decided otherwise. The universe wasn't breaking the rules. It was just revealing that the rules were just a story we told ourselves to sleep at night.

  Aris saved the file. He named it `alpha_variability_v1.dat`. He knew he would rename it a hundred times. He knew that even if he published this, even if the world accepted it, the Best System might change again next year. There was no bedrock. There was only the shifting weight of the mosaic, and the terrifying freedom of having to describe it without ever knowing if the description would hold.

  He turned off the monitor. The room went dark, but the hum of the servers continued, a steady, meaningless rhythm in the void.
