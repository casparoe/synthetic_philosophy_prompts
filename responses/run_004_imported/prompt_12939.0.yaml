answer: |-
  **Setting:** *A quiet corner of a restaurant, long after the seminar guests have dispersed. The check sits untouched in the center of the table. Two plates of half-eaten dessert remain. Elias leans forward, swirling his wine. Mara rests her chin on her hand, looking tired but alert.*

  **Elias:** You're treating the Duke of She passage like a legal case, Mara. That's the category mistake. You're asking for a verdict on the sheep, when the text is offering an ontology of the self. When Confucius says uprightness (*zhi*) is found in mutual concealment, he isn't giving a loophole for corruption. He's saying that the father-son relation is the locus of personhood. To testify is not to obey a law; it is to dismantle the very architecture that makes you a moral agent.

  **Mara:** I'm not asking for a legal verdict. I'm asking for a moral grammar. If role ethics claims to be a complete system, it must account for moral conflict without smuggling in external principles. In this scenario, the son occupies at least two roles: he is a son, but he is also a neighbor to the man whose sheep was stolen, and a subject of the Duke. If "uprightness" is defined entirely by the immediate role I am enacting, then being an "upright neighbor" requires restitution, while being an "upright son" requires concealment. Role ethics tells me to be true to my roles, but it offers no mechanism to prioritize them. It looks less like an ontology and more like a prescription for tribalism.

  **Elias:** But that prioritization *is* the mechanism. It's the doctrine of *tui*—extension. The family is the root (*ben*). You don't prioritize the neighbor over the father because if you sever the root, the branch dies anyway. Ames and Rosemont are clear on this: there is no "citizen" abstracted from the family. If you betray the father to satisfy an abstract "citizen" role, you haven't acted with integrity; you've acted with a fractured self. The concealment isn't about ignoring the theft; it's about preserving the trust necessary for any moral correction to happen later.

  **Mara:** That's the "cultivation" defense. It assumes that inside the family, moral correction *can* happen. But what if it doesn't? What if the father is a habitual thief? If I conceal the first sheep, I enable the second. At what point does my role as son become complicity? If your answer is "never," then role ethics collapses into nepotism. If your answer is "at some point," you need a standard *outside* the role to tell you when that point has been reached. You need *yi* (rightness) to judge the role itself. But if *yi* can judge the role, then the role isn't the foundation of ethics. The standard is.

  **Elias:** You're treating *yi* like a Platonic form, a ruler we hold up against the world. In role ethics, *yi* is the appropriateness of the response *within* the relationship. It's not external. To ask "when do I stop concealing?" is to ask "when does the father cease to be a father?" That's a catastrophic failure of cultivation, yes, but it doesn't prove the theory wrong; it proves the situation tragic. The Mohists made your exact argument two thousand years ago—impartial care (*jian ai*) prevents this chaos. And Mencius dismissed them as beasts. Why? Because impartiality requires you to treat strangers with the same weight as kin, which effectively means treating kin like strangers. It dissolves the particularity that makes care possible.

  **Mara:** I'm not a Mohist, Elias. I don't want impartial care. I want to know how Confucianism survives the Mohist critique without conceding the point. Mencius dismissed them, but he didn't refute the structural risk. He just asserted that graded love is natural. But "natural" isn't "normative." The sheep owner is also someone's father. By prioritizing my father's role over his suffering, I am undermining *his* family's security. If every son conceals, the community becomes a collection of warring fiefdoms. Confucius wants a harmonious state. How do you get harmony from institutionalized partiality? You can't just say "extend the love." Extension fails if the root is rotten.

  **Elias:** But the partiality *is* the engine of the harmony! That's the insight you're missing. You think impartiality creates trust. Confucius thinks trust creates impartiality. If I cannot trust my own son, why would I trust the state? The "uprightness" Confucius talks about isn't legalistic honesty; it's relational authenticity. If I turn my father in, I am performing a public virtue at the cost of private truth. I become a hypocrite. I am acting "right" for the audience, the Duke, but "wrong" in the locus of my being. Role ethics argues that public corruption starts when we allow public roles to cannibalize private ones. The sheep is a material loss; the father-son bond is an existential loss.

  **Mara:** That's a beautiful sentiment until the material loss accumulates. Until the "existential loss" of the bond is the price the vulnerable pay for the powerful's protection. Look, I grant you the relational self. I grant there is no atomic individual. But roles are not static. They are dynamic. And when roles conflict, we need adjudication. If *ren* (benevolence) is the ultimate Confucian virtue, isn't *ren* the standard that tells me concealing a harmful act is un-benevolent to the victim? If *ren* overrides the role obligation to conceal, then *ren* is the master virtue, not the role. And if *ren* is a role-independent virtue, then Ames and Rosemont are wrong: this *is* virtue ethics in drag.

  **Elias:** *Ren* isn't role-independent. *Ren* is the *quality* of the relationship. You can't have *ren* in a vacuum. You can only have *ren* toward someone. So when you ask if *ren* overrides the role, you're asking if the quality of the relationship overrides the definition of the relationship. That's incoherent. If I testify against my father, I am not acting with *ren* toward him, obviously. But you claim I'm acting with *ren* toward the sheep owner. I'd argue I'm not. I'm acting with legalism. *Ren* requires me to address the father's failing *as a son*, perhaps by pleading with him, paying restitution secretly, but not by handing him over to punitive authority. That preserves the humanity of all three parties: the father, the son, and the victim, who gets his sheep back without the social fabric tearing.

  **Mara:** "Paying restitution secretly." There it is. You just smuggled in an external standard of justice! You said the victim gets his sheep back. Why? If the role of "son" is the only moral imperative, why does the sheep matter at all? Why not just hide the father and the sheep? You only suggested restitution because you know, deep down, that there is a claim the neighbor has on you that exists *prior* to your role as son. You're trying to have it both ways. You want the particularism of role ethics to defend the concealment, but you want the universalism of *ren* to clean up the mess.

  **Elias:** I'm not smuggling anything. The neighbor has a claim on me *because* I am a member of the community, which is an extension of the family. But the order of operations matters. If I start with the neighbor's claim against the father, I destroy the family. If I start with the father, I preserve the possibility of restoring the neighbor. You're demanding a synchronic solution—resolve all claims equally right now. Confucianism offers a diachronic solution—preserve the root so the tree can bear fruit later. The "nepotism" you see is actually the recognition that moral capacity is finite. We learn to be good by being good to those closest to us. If you demand I be equally good to the stranger as the father, I end up being adequately good to no one.

  **Mara:** But that assumes the world is small enough for that extension to reach. In a complex society, the stranger *is* the person I interact with most. The "diachronic solution" is a luxury of the Warring States village, not the modern state. When you say "preserve the root," you're assuming the root is healthy. But what if the culture of concealment *is* the rot? The Mohists warned that "graded love" is just an excuse for favoritism. If role ethics cannot distinguish between "protecting the family bond" and "protecting family privilege," then it has no critical bite. It becomes a conservative ideology that sanctifies the status quo of power relations within the family. If the father is a tyrant, role ethics demands I be an upright tyrant's son.

  **Elias:** And if you adopt your standard of impartial justice, you demand I be a son who is willing to sacrifice his father for a principle. Which is more dehumanizing? Which creates a society of informants and which creates a society of trust? You say role ethics lacks critical bite. I say it lacks it because it locates criticism *inside* the relationship, not outside it. A son *should* remonstrate with a tyrant father. That's in the *Classic of Filial Piety*. But remonstration is not betrayal. Testifying is betrayal. You want to turn the son into a magistrate. I'm saying the son must remain a son to have any moral authority to remonstrate at all.

  **Mara:** Remonstration works if the father listens. It fails if he doesn't. Then we are back to the conflict. You keep saying "betrayal" as if it's self-evident. But betrayal of whom? If I testify, I betray the father. If I conceal, I betray the neighbor, the law, and my own commitment to a just community. Why is the betrayal of the father ontologically heavier than the betrayal of the community? You say because the father is the root. But the Mohist says the community is the body. If the root poisons the body, you cut the root. Role ethics says you never cut the root. That's not a structural feature; that's a dogma.

  **Elias:** It's not a dogma; it's an observation of human psychology. Cut the root, the tree dies. You can't build a moral society on the premise that the people closest to you are expendable for the greater good. That's utilitarianism, not Confucianism. The crux isn't whether the sheep gets returned. It's whether morality is about maintaining systems of justice or cultivating human beings. If it's about cultivating human beings, you can't cultivate them by asking them to violate their primary attachments.

  **Mara:** And if it's about cultivating human beings, you can't cultivate them by teaching them that their primary attachments exempt them from accountability. We're stuck. You think the risk of nepotism is less dangerous than the risk of alienation. I think the risk of nepotism is the *source* of the alienation for everyone outside the circle. You defend 13.18 as protecting the self. I see it as protecting the self *at the expense of the other*. And unless role ethics can explain how to weigh that "other" without borrowing from a principle outside the role, it remains a closed loop.

  **Elias:** And unless you can explain how to weigh the "other" without destroying the "self" that does the weighing, your impartiality is a ghost.

  *Silence settles between them. The waiter hovers, then retreats, seeing the conversation is not yet finished, though the wine is.*

  **Mara:** So we agree on the text. We disagree on whether it's a feature or a bug.

  **Elias:** We agree on the text. We disagree on whether the self is a node in a network or the network itself.

  **Mara:** No. We disagree on whether the network has a firewall.

  *Elias smiles, faintly, and picks up his glass. He doesn't drink.*

  **Elias:** If you put a firewall around the family, it's not a network anymore. It's a fortress.

  **Mara:** And if you don't, it's a mafia.

  *They sit with the image, neither willing to clear the table.*
