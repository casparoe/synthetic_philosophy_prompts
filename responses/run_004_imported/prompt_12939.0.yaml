      *   Mohist reference included? Yes.
      *   Nepotism worry addressed structurally? Yes.

      *(Proceed to generate output based on these thoughts.)*

      *Wait, one nuance:* The prompt mentions Ames and Rosemont specifically. I should ensure Elias uses language reminiscent of their "role ethics" terminology (narrative self, focal point, etc.) while Mara critiques the *structural* implications.

      *Refining the "Nepotism" point:* Mara shouldn't just say "it's corrupt." She should ask: "If the father steals repeatedly, does the son's role change?" Elias must answer this without appealing to an external law.

      *Refining the "Mohist" point:* Mara should use Mozi not as an outsider, but as the internal critic of early Confucianism to show this isn't a new problem.

