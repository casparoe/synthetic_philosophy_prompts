answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a software engineer, and I had the pleasure of being [Groom]'s college roommate.

  Standing here, I feel a unique kind of pressure. Looking out at the audience, I see about a third of you who work in [Groom]'s philosophy department. I know that for the next few minutes, I am being audited. I know that if I accidentally describe marriage as a "union of souls" or suggest that [Groom] and [Partner] are now a "single entity," I will lose credibility instantly. And the other two-thirds of you are just hoping I don't talk about code for five minutes.

  So, I've tried to find a middle ground. As an engineer, I build distributed systems. As a philosopher, [Groom] studies how people coordinate. And it turns out, we talk about the same thing.

  I've lived with [Groom]. I know how his mind works. He doesn't believe in magic. He doesn't believe that saying "I do" magically fuses two people into a new metaphysical creature. He believes something more practical, and honestly, something more demanding. He believes that a "we" is just two "I"s who have decided to align their plans, constantly and carefully.

  And watching him with [Partner], I have never seen a more elegant implementation of this.

  Love, in [Groom]'s view—and I think in practice—isn't a feeling that happens *to* you. It's a structure you build. It's the daily work of making sure your sub-plans mesh. It's checking in. It's adjusting your trajectory based on the other person's movements. It's mutual responsiveness.

  I see this in the small things. When they plan a vacation, it's not one person dictating and the other complying. It's a negotiation where both inputs matter equally until there's a shared path forward. When they're cooking dinner in a small kitchen, they move around each other without colliding. They have common knowledge of the goal, and they trust the other person to hold up their end of the plan.

  To the friends and family here: This might sound less romantic than "two hearts beating as one." But I'd argue it's more resilient. Feelings fluctuate. Metaphysical bonds are hard to verify. But a reliable plan? A commitment to keep coordinating even when it's difficult? That is durable.

  [Groom], you've spent years arguing that shared intention requires no extra ingredient other than interlocking individual commitments. Today, you're making one of those commitments public. You aren't signing a contract that binds you regardless of your future will. You are making a promise to *keep* willing the same things, to keep adjusting your plans to fit [Partner]'s, and to keep the communication channels open when the sub-plans conflict.

  [Partner], thank you for being the perfect partner in this architecture. You challenge his plans, you refine them, and you make sure they hold up under load. You make the "meshing" look easy, even when I know it requires work.

  So, I'm not going to toast to a "sacred bond" that exists above you both. I'm not going to toast to a mystical union.

  Instead, I want to toast to the coordination. To the mutual responsiveness. To the thousands of individual intentions you will align over the next fifty years. To the fact that you choose, every single day, to update your plans to include the other person.

  [Groom] and [Partner], may your sub-plans always be compatible, may your communication latency be low, and may you never stop negotiating the shared project of your life.

  To the happy couple.
