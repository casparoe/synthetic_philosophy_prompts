answer: |-
  The following is a sustained argument supporting the thesis that Gibbard's hyperplan semantics, while successfully resolving the logical problems of embedding, collapses expressivism into a notational variant of deflationary cognitivism, thereby forfeiting the metaethical distinctiveness that motivated the view in the first place.

  ***

  ### The Price of Logical Respectability: Why Gibbard's Hyperplans Collapse into Cognitivism

  The primary theoretical motivation for expressivism has historically been metaphysical and psychological parsimony. The expressivist argues that we need not posit queer normative facts or a mysterious faculty of moral intuition to explain normative discourse. Instead, we explain normative judgments in terms of conative states—desires, commitments, or plans—that are fundamentally different in kind from descriptive beliefs. This "Humean" divide between belief and desire is the engine of expressivism; it is supposed to explain the action-guiding nature of normativity without ontological excess.

  Allan Gibbard's project, particularly in *Wise Choices, Apt Feelings* and refined in *Thinking How to Live*, attempts to secure the logical respectability of this view. By modeling the content of normative judgments as "hyperplans" (maximally specific plans for living) and analyzing them via a possible-worlds-style semantics (sets of norm-world pairs), Gibbard allows normative sentences to entail one another exactly as descriptive sentences do. However, this solution comes at a catastrophic cost. By making the semantic structure of normative thought isomorphic to the semantic structure of descriptive thought to solve Frege-Geach, Gibbard evacuates the "plan" vs. "belief" distinction of any substantive theoretical work. The argument here is that Gibbard's machinery solves the logical problem precisely by adopting the cognitivist's semantic framework, rendering expressivism a merely notational variant of deflationary realism.

  #### 1. The Isomorphism of Content
  To solve the embedding problem, Gibbard must explain how a normative sentence like "Stealing is wrong" can function as a premise in a *modus ponens* argument alongside descriptive premises. His solution is to assign normative sentences a content that behaves like a proposition. In *Thinking How to Live*, a normative content is defined by the set of hyperplan-world pairs it rules out. This is structurally identical to how a descriptive proposition is defined by the set of possible worlds it rules out.

  If normative content and descriptive content are both defined by their exclusion conditions within a unified semantic space (hyperplan-world pairs), they obey the same logical laws. Entailment, consistency, and negation are defined over these sets in the standard Boolean fashion. Consequently, the "logic" of planning becomes indistinguishable from the "logic" of believing.

  Here lies the first step toward collapse. If the *content* of a normative judgment is individuated by its logical relations to other contents, and those relations are identical to the relations governing descriptive contents, then the content itself is functionally identical to a truth-conditional proposition. Gibbard wants to say we "accept a hyperplan" rather than "believe a fact," but if the object of acceptance plays the exact same inferential role as a proposition, the distinction between "accepting" and "believing" becomes opaque. The semantic machinery does all the work, and the psychological label ("plan" vs. "belief") is left as an idle wheel.

  #### 2. Dreier's Creeping Minimalism as a Consequence, Not a Bug
  James Dreier's "Creeping Minimalism" objection is often treated as an external threat to expressivism, but in Gibbard's system, it is an internal consequence of his solution to Frege-Geach. Dreier argues that if expressivists adopt deflationary notions of "truth," "fact," and "representation" to make sense of logic, they lose the ability to distinguish their view from realism.

  Gibbard embraces this. He explicitly allows that there are "normative facts" and that normative judgments can be "true." He argues this is harmless because these notions are deflationary. However, for the expressivist, this is not harmless; it is fatal to the view's motivation. The original promise of expressivism was to offer a *rival* explanation of normative discourse, not to agree with the realist on all semantic outputs while whispering "but it's really planning" under one's breath.

  If a deflationary realist can say, "It is a fact that stealing is wrong," and Gibbard says, "It is a fact that stealing is wrong (deflationarily understood as coherence with a hyperplan)," and both agree on the truth conditions, the logic, and the usage, the metaphysical disagreement has vanished. Gibbard's hyperplan machinery effectively translates normative discourse into a formal language that looks exactly like realist semantics. If the translation is perfect, the source language (expressivism) offers no theoretical advantage. It becomes a redundant description of the same semantic landscape.

  #### 3. The Trade-off: Logic vs. Psychology (Blackburn and Schroeder)
  The force of this collapse becomes sharper when contrasting Gibbard with other expressivists who try to preserve the psychological distinction. Simon Blackburn's quasi-realism, for instance, attempts to maintain a stricter separation between the "tree-structured" attitudes of moral commitment and ordinary belief. Blackburn is wary of fattening up moral content too much, fearing it will look like realism. The result is that Blackburn struggles more with the logical semantics; his higher-order attitude approach makes the validity of *modus ponens* harder to formalize without appealing to something proposition-like.

  Similarly, Mark Schroeder's "Being For" account tries to ground normativity in a specific psychological relation ("being for") that is distinct from belief. Schroeder retains a stronger psychological distinction than Gibbard, but he consequently faces the "negation problem": it is difficult to explain the difference between "not being for blaming" and "being for not blaming" without invoking distinct content types that look suspiciously like propositions.

  Gibbard avoids Schroeder's negation problem and Blackburn's logical complexities precisely by *flattening* the psychological distinction. He makes the content so rich (hyperplans) that it absorbs the logical burden. But this confirms the trade-off: you can have robust logical embedding, or you can have a robust belief/desire distinction, but Gibbard's system suggests you cannot have both. By choosing logic, Gibbard sacrifices the psychological distinctiveness. If the "plan" is maximally specific and governed by Boolean semantics, "accepting a plan that p" is functionally indistinguishable from "believing that p." The expressivist claim that normative thought is *practical* rather than *representational* loses its bite if the "practical" content represents the world (via hyperplan-world pairs) just as accurately as the "representational" content does.

  #### 4. Explanatory Idleness
  The ultimate test of a metaethical theory is whether it explains something the rival theory cannot. Realism explains the objectivity and logic of ethics but struggles with motivation and ontology. Expressivism explains motivation and ontology but struggles with logic. Gibbard claims to get the best of both worlds. However, if his solution to logic requires modeling plans as truth-apt contents, he has conceded the realist's semantic ground.

  What work is left for the "plan" ontology to do? A realist can adopt Gibbard's hyperplan semantics and simply say, "To believe a normative fact *just is* to have a cognitive state aligned with a hyperplan." The realist can co-opt the psychology without changing the semantics. If the realist can say everything Gibbard says without positing a fundamental divide in the faculty of judgment, then Gibbard's expressivism is not a competing metaphysical hypothesis; it is a stylistic choice.

  By fattening the objects of attitude into hyperplans, Gibbard ensures that normative attitudes have enough structure to support logic. But in doing so, he makes those attitudes structurally isomorphic to beliefs. If a normative judgment has truth conditions (even deflationary ones), entails other judgments, is negatable, and embeds in conditionals exactly like a descriptive judgment, the assertion that it is "non-cognitive" becomes a verbal dispute. The "cognitive/non-cognitive" distinction was supposed to mark a difference in the *direction of fit* or the *functional role* of the state. But if the functional role (inferential potential) is identical, the direction of fit distinction collapses.

  #### Conclusion
  Gibbard's hyperplan machinery is a triumph of formal semantics, but a failure of metaethical differentiation. It solves the Frege-Geach problem by treating normative content as a species of truth-conditional content. In achieving this, it validates Dreier's worry: the view becomes indistinguishable from a deflationary cognitivism that merely uses the word "plan" where a realist would use "fact." The theoretical advantage of expressivism was supposed to be a leaner ontology and a better explanation of the practical nature of normativity. Gibbard secures the logic by bloating the ontology of content to match realism, leaving the "practical nature" as a label without a functional difference. Thus, Gibbard's solution succeeds only by surrendering the very ground expressivism was built to defend.
