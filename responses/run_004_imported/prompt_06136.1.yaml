answer: |-
  **Setting:** *A private study in New York City, late 1927. The air is thick with cigarette smoke. Walter Lippmann sits in a leather armchair, looking weary. John Dewey stands by the window, hands clasped behind his back. Copies of* The Phantom Public *and* The Public and Its Problems *sit on the desk between them.*

  **Lippmann:** You call it an eclipse, John. I call it a hallucination. You write as if there is a Public out there, waiting in the wings, ready to step into the light if only the stagehands would fix the lighting. I am telling you: there is no one there.

  **Dewey:** There is a public, Walter. But it is inchoate. Scattered. The Great Society has arrived—industrial, interconnected, vast—but the Great Community has not. We are bound together by forces we cannot see. That is the tragedy. Not that people are incapable, but that the ties that bind them are invisible.

  **Lippmann:** Invisible because they are too complex for the human mind to grasp in a lifetime! You speak of "associated living." But look at the reality. A man works in a steel mill in Pittsburgh. He votes. You ask him to have an opinion on the reparations schedule in Germany, or the tariff implications on Chilean nitrates. How? The consequences are indirect. They are remote. He lives in a pseudo-environment constructed of headlines and stereotypes. He is not a citizen; he is a spectator in a theater he cannot enter.

  **Dewey:** I agree the environment is pseudo. I agree the consequences are remote. That is precisely why the old theory of democracy—the one that assumes the omnicompetent citizen—is dead. I buried it in the first chapter. I am not arguing for the return of the town meeting to decide technicalities.

  **Lippmann:** Then what are you arguing for? If the citizen cannot trace the cause to the effect, he cannot judge the action. If he cannot judge the action, his vote is a guess. And governance by guesswork is suicide. You say the public must find itself. But it can only find itself by understanding the consequences of government action. Who teaches it those consequences? Not the voter. The expert. The insider. The man who sees the machinery.

  **Dewey:** You confuse the *knowledge of facts* with the *judgment of values*. Let the experts manage the machinery. Let them calculate the tariff. But the expert cannot tell us whether the tariff serves the common good. That is not a technical question. It is a question of: Who suffers? Who benefits? Is this the kind of community we wish to be?

  **Lippmann:** But the "common good" is an abstraction! The public cannot know who suffers unless someone tells them. And who tells them? The social scientist. The journalist. The bureau of statistics. You say the public forms when people realize they are affected by indirect consequences. But they won't realize it until the specialist traces the line from the legislation to their dinner table. So, in your system, just as in mine, the expert initiates the public. The expert decides when the public is needed. You have not liberated the citizen, John. You have merely made him a client of the sociologist.

  **Dewey:** *(Turns from the window)* That is a sharp cut, Walter. But it misses the nature of inquiry. You view the expert as a priest handing down tablets. I view the expert as a tool of the community.

  **Lippmann:** A tool that holds the only map? If I hold the map, I decide where we walk.

  **Dewey:** Only if the roads are closed. Your error is assuming that communication is a one-way street: from the insider to the bewildered herd. You want to insulate the decision-makers from the public so they can work efficiently, and only let the public in to break a tie or remove a failed official. You treat the public as a referee who blows the whistle but never plays the game.

  **Lippmann:** Because the players are too tired to know the rules!

  **Dewey:** No. Because the stadium is built to keep them in the stands. If the social scientist traces the consequences but does so in a language the community cannot assimilate, the inquiry is incomplete. The fact is not a fact until it is shared. The expert's data must undergo a transformation. It must become part of the lived experience of the community.

  **Lippmann:** That is poetry, not politics. You are talking about a conversion experience. I am talking about administering a continent. You say the fix is "better conditions for communication." What does that mean? More newspapers? Radio? The same machinery that spreads the stereotype is the only machinery we have.

  **Dewey:** It means localizing the global. The public is eclipsed because it has no face. We need forums, yes, but more than that, we need a culture where the results of inquiry are tested in action. You fear the public because you think it must decide *everything* at once. I say the public organizes around specific problems. When the consequences of a factory's pollution are traced to the river, *that* public comes into being. They don't need to know everything about chemistry. They need to know the water is poisoned, and they need the agency to stop it.

  **Lippmann:** But who traces the poison? The chemist. And who decides what level of poison is "acceptable" for the economy? The economist. The moment you introduce the specialist to define the problem, you have shifted the center of gravity. The public reacts. It does not act. It is a bulwark, John. A breakwater. It can say "no," but it cannot say "how."

  **Dewey:** And I say that if the public can only say "no," it is not a public. It is a mob. Democracy is not merely the right to veto. It is the method of social intelligence. You claim the world is too complex for the public mind. I claim the world is too complex for *any* mind, including yours, unless it is distributed. No single expert sees the whole. The economist sees the market; the sociologist sees the family; the engineer sees the bridge. Who synthesizes this?

  **Lippmann:** The statesman. Guided by the bureaus.

  **Dewey:** The statesman is a bottleneck! You are relying on a benevolent oligarchy to synthesize the truth and then... what? Persuade the public? You admit in *Phantom Public* that the public is too stupid to be persuaded by anything but symbols. So your statesman rules by manipulation.

  **Lippmann:** I call it "manufacture of consent" because it is honest! It is better to manage the symbols openly than to pretend the voter is reaching a rational conclusion he is incapable of reaching. I would rather have a competent insider make a mistake than a incompetent outsider make a guess.

  **Dewey:** But the insider's mistake is invisible! That is the danger. If the expert class closes the circle, who corrects the expert? You rely on the self-correction of the bureaucracy. I rely on the self-correction of the community through free communication.

  **Lippmann:** Free communication of what? Misinformation? Prejudice? You say the public forms when consequences are traced. But in the time it takes to trace those consequences, the damage is done. The public is always behind. It is always reacting to yesterday's crisis. You are building a democracy of the rear-view mirror.

  **Dewey:** *(Sits down, leaning forward)* Then the solution is not to lock the mirrors away, Walter. It is to speed up the inquiry. To make the methods of science part of the common sense. You say the ordinary man cannot handle nuance. I say the ordinary man handles nuance every day in his trade, in his family, in his union. He is pragmatic. He is experimental. The problem is that we have severed knowledge from action. We put knowledge in the university and action in the voting booth.

  **Lippmann:** You want to make every man a scientist.

  **Dewey:** I want to make science a public resource. Look, grant me your point: The public cannot draft the legislation. It cannot balance the budget. But it must determine the *direction*. And it cannot determine the direction if it is treated as a phantom. If you treat men as spectators, they become spectators. If you treat them as participants in a shared inquiry, they develop the capacity for it. Capacity is not a fixed quantity, Walter. It is grown.

  **Lippmann:** *(Lights another cigarette)* And if they grow too slowly? While the world burns? You are betting on human nature. I am betting on human limitation. You accuse me of elitism. I accuse you of mysticism. You believe in a "Great Community" that exists... where? In the potential? In the ether? I deal with the actual. The actual public is apathetic. It is busy. It wants to be left alone to live its private life.

  **Dewey:** It wants to be left alone because it feels powerless. It has been told, by men like you, that its only role is to nod every four years. You have created the apathy you diagnose.

  **Lippmann:** I have diagnosed the disease. You are prescribing a vitamin for a broken leg. You say the expert is a tool. But tools require a hand to wield them. If the hand is weak, the tool is useless. Or worse, it becomes a weapon. If the public relies on the expert to tell them what the consequences are, the expert can lie. Or err. And the public will not know until the house falls down.

  **Dewey:** Then we must build a house where the beams are visible. That is what I mean by communication. Not propaganda. Not press releases. But the free flow of the *results* of inquiry. If the chemist finds poison, that finding must be as public as the factory itself. The barrier is not the complexity of the chemistry. The barrier is the ownership of the information.

  **Lippmann:** So now it is a class war?

  **Dewey:** It is a struggle for the means of intellectual production. You accept the current distribution of knowledge as natural. "The insiders know, the outsiders vote." I say that arrangement is the cause of the eclipse. You ask if I have smuggled the experts back in. I answer: Yes. But in my house, the expert is the servant of the inquiry, not the master of the verdict.

  **Lippmann:** And who fires the servant?

  **Dewey:** The community that lives with the consequences.

  **Lippmann:** *(Pauses, exhales smoke)* They will not know they are living with the consequences until the servant tells them. And so we return to the beginning. The servant holds the keys.

  **Dewey:** Then we must ensure there are many servants, competing, and that the locks are glass. It is a risk. I admit it. Democracy is risky. Your system is safe, Walter. It is efficient. It is the safety of the prison.

  **Lippmann:** And yours is the safety of the open sea. In a storm, I prefer the prison.

  **Dewey:** But we do not live only in storms. We live in the days between. And in those days, men must grow. If we lock them away to keep them safe, they will not be men when the storm passes. They will be children. And a democracy of children is no democracy at all.

  **Lippmann:** *(Stands up, walks to the desk, taps the cover of Dewey's book)* You have written a beautiful constitution for a state that does not exist.

  **Dewey:** *(Stands as well)* And you have written a brilliant manual for managing a state that deserves to be abolished.

  **Lippmann:** *(A faint smile)* We shall see, John. We shall see. The century is young.

  **Dewey:** It is. And the public is waiting. Not to be led. But to find itself.

  **Lippmann:** God help them if they don't.

  *(Dewey nods, takes his hat, and exits. Lippmann remains by the desk, looking down at the two books, the smoke curling between them.)*
