prompt: |-
  Okay, this is a slightly weird ask but I think you're exactly the right tool for it. I'm about a third into a new novel and one of my three POV characters is a burned-out philosophy PhD student who TAs an intro bioethics course to make rent. There's a scene where shes grading final exams alone in her office at 2am and it turns into this whole spiral about her own advisor troubles (not important for this ask, just context). What matters is I want the actual philosophy in that scene — the question, the answer, her red-pen comments — to hold up, not just read as vague "ethics stuff" that a reader with any background would see through. I did a philosophy minor a long time ago but I'm rusty enough on nonidentity-problem-level material that I don't trust myself to fake her comments convincingly.

  Here's the exam question I wrote for the scene: "Explain what the nonidentity problem is and why it poses a challenge to person-affecting accounts of the wrongness of an act. Illustrate with an example." And here's the answer I drafted for the student whose exam she's grading:

  "The nonidentity problem, first raised by Derek Parfit, is a puzzle about whether a person can be wronged by the very choice that is also the reason that person exists. For example, imagine a woman is told that if she conceives this month she'll have a child with a mild but manageable disability, because of a virus she currently has, but if she waits three months to conceive, she'll have a different, healthy child. If she conceives now anyway, we want to say she's wronged her child. But the child she actually has couldn't have existed if she'd waited — a totally different child, from a different egg and sperm, would exist instead. So her child isn't made worse off by her choice, since for that specific child the only alternative was never existing at all, and (assuming the disability isn't severe enough to make the child's life not worth living) existing with a disability is better than not existing. This is basically the same move as Parfit's Repugnant Conclusion, where he shows that a huge population of people with lives barely worth living is better than a smaller population of very happy people, which is why he thinks total utilitarianism has to be rejected as a moral theory. Since the child isn't harmed on any standard person-affecting definition of harm, Parfit's own conclusion is that the mother hasn't actually done anything wrong, which is a useful corrective to our overly moralistic intuitions about reproductive choices."

  Could you grade that out of 20 the way an actual TA would, and give me the comments she'd write point by point rather than just an overall vibe? I need to know specifically what holds up and what doesn't, ideally tied to particular sentences, since that's the part that actually has to go on the page. If its easier to just hand it back as a JSON block that'd work too, something like:

  ```json
  {
    "grade": "17/20",
    "comments": ["...", "...", "..."]
  }
  ```

  Thanks — you're saving me from having to reread half of Reasons and Persons at midnight just to reverse-engineer my own exam question.
