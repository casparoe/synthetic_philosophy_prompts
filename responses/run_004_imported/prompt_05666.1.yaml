answer: |-
  **The Cliff at Dawn**

  **Characters:**

  *   **ELENA:** An Ockhamist. She believes in bivalence for future contingents and defends the "Thin Red Line."
  *   **MARCUS:** A Supervaluationist. He believes the future is branching and future contingents lack a truth value until settled.

  **Setting:** *A high limestone cliff overlooking a narrow strait. It is just before sunrise. The water is grey and still. On the horizon, two fleets are visible through the mist, rowing steadily toward a convergence point directly below the cliff. The air is cold.*

  **ELENA:** (Pulling her coat tighter) Look at them. The Athenians on the left, the Persians on the right. By noon, the water will be red. Tell me, Marcus: Is the sentence "There will be a naval battle" true right now?

  **MARCUS:** (Leaning on the stone railing) It's not true, Elena. And it's not false. It's indeterminate. The sentence hangs in the air like this mist.

  **ELENA:** That's the supervaluationist dodge. You're saying truth requires settlement across *all* possible futures. Since there is a possible future where a storm scatters them, and one where they engage, the proposition is gappy. It has no truth value.

  **MARCUS:** Precisely. "Supertruth" requires stability. A claim about the future is only true if it holds on every branch of the tree growing out of this moment. Since the admirals still have a choice—ram or retreat—the branches diverge. To say it's *already* true is to collapse the tree into a single line. That's fatalism.

  **ELENA:** No, it's realism. There *is* a single line. We just don't know which one it is yet. I'm an Ockhamist, Marcus. I hold that "There will be a battle" is either true or false right now, even if the outcome is contingent.

  **MARCUS:** But what fixes the value? If the physics of the present moment doesn't determine the battle—if the oarsmen could drop their oars, if a wind could shift—what metaphysical glue makes one branch the "true" one?

  **ELENA:** The Thin Red Line.

  **MARCUS:** (Laughs softly) There it is. The scam.

  **ELENA:** It's not a scam. It's an acknowledgment of actuality. Among the branching possibilities, one history is *actual*. It's the history that *will* obtain. That privileged branch fixes the truth value of future contingents today. The proposition is true because it aligns with the Thin Red Line of actuality.

  **MARCUS:** But that's just labeling the mystery, not solving it. Imagine the branching time structure as a physical tree. All the branches are ontologically equal right now. They all exist as possibilities. You're saying one of them is painted red. Why? What property does that branch have that the others lack? If nothing in the present moment causally necessitates the battle, then the "Red Line" is a ghost. It's a magical sticker you're placing on a branch to satisfy your intuition about bivalence.

  **ELENA:** It's not magic; it's indexical. "Actual" is like "here" or "now." I am *here*, even though other places exist. This moment is *now*, even though other times exist. Similarly, this future is *actual*, even though other futures are possible. You're demanding a causal ground for a semantic fact.

  **MARCUS:** I'm demanding a ground for *truth*. If I say, "It is true that p," I imply that reality is such that p. But if reality is currently compatible with not-p, how can it be true that p? You're conflating truth with inevitability.

  **ELENA:** And you're conflating truth with necessity. That's the old fatalist error. Just because "There will be a battle" is true today doesn't mean it is *necessarily* true. It's accidentally necessary. The truth of the proposition doesn't *cause* the battle. The battle makes the proposition true. The truth value is just a shadow cast by the future event back onto the present.

  **MARCUS:** A shadow cast by something that hasn't happened? That's backwards causation, Elena.

  **ELENA:** It's not causation. It's correspondence. If I say, "Caesar crossed the Rubicon," that's true now. Why? Because he did it. If I say, "Admiral X will ram," it's true now. Why? Because he will do it. The fact that he *could* have done otherwise doesn't change the fact that he *won't*. Your supervaluationism can't handle the past.

  **MARCUS:** How so?

  **ELENA:** Let's fast forward. Tomorrow morning. The battle is over. Thousands are dead. I turn to you and ask, "Was it true yesterday, when we stood on this cliff, that the battle would happen?" What do you say?

  **MARCUS:** I say... yes. Now that it has happened, we can look back and see that the branch we are on was the one actualized.

  **ELENA:** But if it wasn't true *yesterday*, how does it become true *today*? Did the past change? Did the proposition sitting on the cliff yesterday undergo a metamorphosis?

  **MARCUS:** The *status* changes. Yesterday, the proposition was gappy. Today, relative to our new context, we can assert it. Truth is context-sensitive.

  **ELENA:** That's relativism. You're saying the truth value depends on *when* you ask. I'm saying the truth value depends on *what happens*. If you deny it was true yesterday, you sever the link between prediction and fulfillment. If the admiral had a divine revelation yesterday saying "Battle tomorrow," and he trusted it, you're saying he believed a lie? Or a non-truth?

  **MARCUS:** He believed a possibility that happened to actualize. He didn't believe a *truth*, because there was no truth to be had. He bet on the Red Line.

  **ELENA:** But if there was no truth, there was nothing to bet *on*. You've emptied the future of content. You save free will by killing the reality of the future. I keep the reality of the future by insisting that "contingent" doesn't mean "unreal." The Red Line isn't a constraint on the admirals. They are free to row or retreat. But only one of those choices is the one they *will* make.

  **MARCUS:** And that "will" is doing too much work. It implies the future is already written in the book of the world, even if the ink is invisible to us.

  **ELENA:** The book isn't written. The authors are writing it. But at any given moment, there is a fact of the matter about what is being written.

  **MARCUS:** (Points downward) Look. The mist is lifting. The lead ships are within arrow range. The physics is tightening. The branches are pruning themselves. Soon, there will be only one path left.

  **ELENA:** And when that arrow flies, will you admit it was always the path of the Red Line?

  **MARCUS:** When the arrow flies, the gap closes. But until the tip touches the wood... (He pauses, watching the archers nock their shafts) ...until then, the silence of the strait is the only truth. The openness is real, Elena. Not just epistemic. Ontic.

  **ELENA:** The openness is real, but the outcome is definite. The truth is waiting for us to catch up to it.

  **MARCUS:** Or we are creating it as we fall.

  *A single horn blasts from the Persian flagship. The sound rips across the water. On the Athenian flank, a hundred oars dip in unison, churning the grey water into white foam. The distance closes. The first arrow arcs high into the dawn sky, hanging for a suspended second at the peak of its trajectory.*

  **ELENA:** (Whispering) True.

  **MARCUS:** (Whispering) Open.

  *The arrow descends.*
