answer: |-
  **Title:** The Architecture of Hard Choices: Adjudicating Parity and Vagueness in Practical Reason

  **Introduction**

  The structure of practical reason is traditionally governed by the Trichotomy Thesis: for any two options $A$ and $B$ relative to a covering consideration $V$, either $A$ is better than $B$, $B$ is better than $A$, or $A$ is equally as good as $B$. Yet, the phenomenology of "hard choices"—decisions between options that are markedly different yet roughly comparable, such as a stable legal career versus a risky artistic one—suggests a rupture in this architecture. In such cases, agents often feel that neither option is better, yet they resist the claim that the options are equal. Ruth Chang has famously argued that this resistance signals the existence of a fourth basic evaluative relation: "parity." According to Chang, parity is *sui generis*, irreducible to the standard trichotomy. John Broome, conversely, diagnoses the phenomenon as a matter of ordinary vagueness in the comparative predicate "better than." He contends that the trichotomy holds, but its application admits of indeterminacy.

  This essay adjudicates the dispute between Chang's parity thesis and Broome's vagueness diagnosis. The crux of Chang's argument is the Small-Improvement Argument (SIA), which attempts to demonstrate that hard choices cannot be instances of equality or incomparability, thereby necessitating a fourth relation. I will argue that while the SIA successfully destabilizes the equality thesis, it fails to decisively rule out vagueness because it relies on classical logical assumptions that Broome's framework explicitly rejects. Consequently, on the grounds of ontological parsimony and semantic coherence, the verdict must be that parity does not deserve the status of a *sui generis* fourth basic relation. The phenomenon of hard choices is best explained by the vagueness of the standard three relations.

  **The Small-Improvement Argument and Its Burdens**

  To understand the stakes, one must isolate the precise logical work the Small-Improvement Argument is required to perform. Chang's argument proceeds from the intuition that in a hard choice between $A$ (Lawyer) and $B$ (Artist), neither is better than the other relative to a covering value like "career goodness." The SIA is designed to eliminate the remaining candidates in the trichotomy—specifically equality—to force the conclusion of a fourth relation.

  The argument runs as follows:
  1.  $A$ and $B$ are comparable (they share a covering value).
  2.  $A$ is not better than $B$, and $B$ is not better than $A$.
  3.  If $A$ were equally as good as $B$, then a slightly improved version of $A$ (call it $A+$) would be better than $B$.
  4.  However, $A+$ is not better than $B$ (the improvement is too small to tip the scale in a hard case).
  5.  Therefore, $A$ is not equally as good as $B$.
  6.  Since $A$ and $B$ are comparable, but not better, worse, or equal, they must stand in a fourth relation: parity.

  For the SIA to establish parity as a *sui generis* relation, it must accomplish two distinct negative tasks. First, it must rule out **incomparability**. Chang handles this by stipulating that hard choices involve items within the same evaluative genus (careers), unlike comparing a career to a cup of coffee. If they were incomparable, the question of which is better would not arise; the hardness of the choice suggests they *are* in the same ballpark, just not rankable by the standard three.

  Second, and more critically for the dispute with Broome, the SIA must rule out **equality**. This is the function of premise (3) and (4). The intuition is that equality is a precise relation; if two weights are exactly equal, adding a gram to one makes it determinately heavier. If $A$ and $B$ were truly equal, a "sweetener" (a slight salary increase for the lawyer) should break the tie. The fact that it does not—that the choice remains hard even after the sweetener—purportedly proves they were never equal.

  However, to establish parity against Broome's rival, the SIA must do additional work: it must demonstrate that the failure of $A+$ to be better than $B$ is due to a *positive normative fact* (parity) rather than a *semantic or epistemic deficiency* (vagueness). The SIA assumes that the proposition "$A+$ is better than $B$" has a determinate truth value. If it is false, equality is ruled out. But if the proposition lacks a truth value (is indeterminate), the modus tollens inference fails. Thus, the SIA succeeds only if it can show that the indeterminacy is ontological (a feature of the world/norms) rather than semantic (a feature of the concept "better").

  **Broome's Vagueness Diagnosis**

  John Broome challenges the SIA by attacking the logical landscape in which it operates. In "Is Incommensurability Vagueness?", Broome argues that "better than" is a vague predicate, much like "tall" or "bald." Vague predicates possess a penumbra—a zone of indeterminacy where it is neither true nor false that the predicate applies.

  Broome's diagnosis reinterprets the hard choice scenario. When an agent says, "The legal career is not better than the artistic one, nor vice versa, nor are they equal," Broome suggests they are reporting on the indeterminacy of the trichotomy's application. In the penumbral zone:
  *   It is indeterminate whether $A > B$.
  *   It is indeterminate whether $B > A$.
  *   It is indeterminate whether $A = B$.

  Crucially, Broome argues that the Small-Improvement Argument collapses under vagueness. Consider premise (3): "If $A = B$, then $A+ > B$." In a classical logic framework, this conditional holds. But in a framework admitting vagueness (such as supervaluationism), if it is indeterminate whether $A = B$, we cannot straightforwardly derive the consequent. Furthermore, regarding premise (4), Broome contends that it is not strictly *true* that "$A+$ is not better than $B$." Rather, it is *indeterminate* whether $A+$ is better than $B$.

  If the relation is vague, adding a small improvement to $A$ might not be enough to push the comparison out of the penumbra. $A+$ might remain indeterminately related to $B$. If so, the fact that $A+$ is not *determinately* better than $B$ does not prove that $A$ and $B$ were not equal; it only proves that the equality was indeterminate. Broome thus dissolves the need for a fourth relation. The trichotomy remains exhaustive, but its boundaries are blurred. The "hardness" of the choice is the experience of operating within this blur, not the detection of a distinct normative relation.

  **Adjudication: Can the SIA Rule Out Vagueness?**

  The central philosophical question is whether Chang can bolster the SIA to distinguish parity from vagueness. Chang anticipates this objection. She argues that vagueness is merely semantic or epistemic, whereas the normativity of hard choices is ontological. If "better than" were merely vague, Chang suggests, it would be a mistake to make a choice in the penumbral zone, or the choice would be arbitrary. Parity, by contrast, allows for "will-based reasons": because the reasons run out (neither option is better), the agent can create reasons through commitment.

  However, this defense conflates the metaphysics of the relation with the phenomenology of agency. Even if Broome is right that the relation is vague, the agent still faces a decision. The practical necessity of choice does not prove the existence of parity; it only proves that agents must act despite indeterminacy.

  The deeper failure of the SIA lies in its reliance on bivalence to rule out equality. For the SIA to work, the statement "$A+$ is better than $B$" must be false. But in a vague context, the negation of "determinately better" is not "determinately not better"; it is "not determinately better." Chang insists that in hard cases, it is *true* that $A+$ is not better than $B$. But why? Her evidence is intuitive: we feel the improvement doesn't tip the scale. Broome counters that this intuition is exactly what vagueness predicts. In the penumbra of "tall," adding a millimeter to a borderline-tall person does not make them determinately tall. The failure of the sweetener to resolve the comparison is the hallmark of vagueness, not proof of parity.

  Chang attempts to distinguish the two by arguing that parity allows for a "chaining" argument that vagueness does not. If $A$ is on a par with $B$, and $B$ is on a par with $C$, $A$ might not be on a par with $C$. However, Broome and others have shown that vagueness also exhibits non-transitivity in the penumbral zones (the Sorites paradox). Thus, structural features like non-transitivity do not uniquely identify parity.

  Ultimately, the SIA cannot rule out vagueness because both theories predict the same behavioral and phenomenological data: hesitation, the failure of small improvements to resolve the choice, and the sense that "equal" is the wrong word. The divergence is purely metaphysical. Chang posits a new normative fact; Broome posits a limitation in the precision of existing normative concepts.

  **Verdict: The Case for Parsimony**

  In adjudicating between a new ontological category and a semantic qualification of existing categories, the principle of parsimony (Occam's Razor) is decisive unless the new category offers significantly greater explanatory power. Chang argues that parity explains the normativity of commitment in hard choices better than vagueness. She claims vagueness renders choice arbitrary, while parity renders it an exercise of normative power.

  This claim is overstated. If "better than" is vague, choosing $A$ over $B$ in the penumbra is not arbitrary in a pejorative sense; it is permissible because neither is determinately better. The agent does not need a fourth relation to justify exercising their will; they only need the permission granted by indeterminacy. Furthermore, positing a *sui generis* relation creates more problems than it solves. It requires explaining how parity interacts with the other three relations (e.g., is parity transitive? How does it aggregate?). Broome's vagueness account integrates hard choices into the existing logic of practical reason without requiring a restructuring of the evaluative landscape.

  The Small-Improvement Argument fails to secure the status of parity because it cannot distinguish between "it is false that $A+$ is better" (required for parity) and "it is indeterminate that $A+$ is better" (consistent with vagueness). Since our access to normative relations is mediated by the very concepts that Broome claims are vague, we have no independent grip on the relations to verify Chang's stronger claim.

  Therefore, the verdict is that parity does not deserve the status of a *sui generis* fourth basic relation. The structure of practical reason remains trichotomous. Hard choices are not hard because the world contains a fourth kind of normative glue; they are hard because the concepts we use to navigate the world—"better," "worse," "equal"—are inherently vague when applied to complex, multi-faceted human goods. Chang correctly identifies a gap in the trichotomy's application, but Broome is correct that this gap is a feature of the map, not the territory. To reify that gap into a new relation is an ontological inflation that the Small-Improvement Argument cannot justify.
