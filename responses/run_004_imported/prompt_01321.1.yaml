      *   *The Tricky Sentence:* "If either party believes not-p for certain, the question ceases to mean anything to him except as a question about what follows from certain laws or hypotheses."
      *   *Interpretation:* Ramsey is talking about *uncertain* premises (epistemic conditionals). If you *know* $p$ is false, you can't add it to your stock of knowledge without causing a massive contradiction (explosion) unless you treat it purely as a logical exercise detached from reality.

