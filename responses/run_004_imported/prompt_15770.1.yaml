prompt: |-
  I'm reporting a feature on the statistical side of the replication crisis, and I keep running into an unsettling claim from the reform camp: that in very large studies — the biobank-scale genetic association studies and large multi-lab replication projects that are now common — a result can clear the p < .05 threshold while a Bayesian analysis of the identical data assigns the null hypothesis a high posterior probability, sometimes overwhelmingly so. I gather this is a known phenomenon called the Jeffreys–Lindley paradox, and I can follow the algebra that produces it, but every write-up I've found just presents the formula rather than building intuition for it. Could you explain, without leaning on notation, why it is specifically the growth of sample size that drives the two approaches apart rather than bringing them into agreement, and why statisticians tend to locate the "problem" in the diffuseness of the prior under the alternative hypothesis rather than in the p-value itself? I need to be able to walk a general readership through the gist without hand-waving.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Jeffreys-Lindley Paradox (JLP) in the context of the replication crisis.
      *   **Specific Claim:** In very large studies (biobanks, multi-lab replications), $p < 0.05$ can coexist with a high Bayesian posterior probability for the null hypothesis ($H_0$).
      *   **User's Understanding:** They know the algebra/formula but lack intuition.
      *   **Key Questions to Answer:**
          1.  Why does *sample size growth* drive the divergence (instead of convergence)?
          2.  Why do statisticians blame the *diffuse prior* under the alternative ($H_1$) rather than the $p$-value?
      *   **Constraint:** Explain without leaning on notation (no formulas, minimal symbols).
      *   **Audience:** General readership (needs to be accessible but rigorous enough to avoid hand-waving).

  2.  **Deconstruct the Jeffreys-Lindley Paradox (JLP):**
      *   *What is it?* A conflict between frequentist significance testing (p-values) and Bayesian hypothesis testing (Bayes Factors/Posteriors) as $n \to \infty$.
      *   *The Scenario:* We test if a parameter $\theta = 0$ ($H_0$) vs. $\theta \neq 0$ ($H_1$).
      *   *The Data:* We observe an effect size that is small but statistically significant (e.g., $t \approx 2$, $p \approx 0.05$).
      *   *The Conflict:*
          *   Frequentist: "Reject $H_0$! The data is unlikely under $H_0$."
          *   Bayesian: "Accept $H_0$! The data is *more* likely under $H_0$ than under the specific $H_1$ we specified."
      *   *The Driver:* As $n$ increases, the standard error shrinks. To keep $p \approx 0.05$, the observed effect size must shrink proportionally ($1/\sqrt{n}$).
      *   *The Prior:* The Bayesian $H_1$ usually spreads probability mass over a wide range of possible effect sizes.

  3.  **Address Question 1: Why does sample size drive divergence?**
      *   *Intuition:* Think about precision.
      *   *Frequentist view:* With huge $n$, we can detect tiny deviations from zero. If $p < 0.05$, we say "It's not zero."
      *   *Bayesian view:* With huge $n$, the data becomes very precise. It pins down the effect size to a very narrow range.
      *   *The Clash:* If the observed effect is just barely significant (e.g., 2 standard errors away from zero), the frequentist says "Significant!" But the Bayesian looks at the alternative hypothesis. If the alternative hypothesis said "The effect could be huge," but the data says "The effect is tiny," the data fits the "Zero" hypothesis better than the "Huge/Anything" hypothesis.
      *   *Analogy:* Archery.
          *   $H_0$: You hit the bullseye exactly.
          *   $H_1$: You hit somewhere else on the target.
          *   Small $n$: Blurry vision. You see a hit near the center. Hard to tell if it's bullseye or just near.
          *   Large $n$: High-res camera. You see the arrow is 1mm off center.
          *   Frequentist: "1mm off is statistically distinguishable from center!"
          *   Bayesian: "You predicted 'somewhere else'. Most of 'somewhere else' is far from the center. The fact that it's *so close* to the center (even if not exactly on it) makes the 'Bullseye' theory look better than the 'Anywhere Else' theory."

  4.  **Address Question 2: Why blame the prior, not the p-value?**
      *   *The P-value's job:* It measures compatibility of data with $H_0$. It does *not* compare $H_0$ to $H_1$. It answers: "If null were true, how weird is this?" It does its job correctly.
      *   *The Bayesian's job:* Compare $H_0$ to $H_1$.
      *   *The Problem:* How do you define $H_1$? "Not zero" is infinite. We need a prior distribution.
      *   *Diffuse Prior:* If we say "Effect could be anything from -100 to +100," we spread our belief very thin.
      *   *The Penalty:* Bayesian methods penalize complexity/vagueness (Ockham's Razor). A vague $H_1$ predicts *anything*, so it predicts *specific data* poorly. A specific $H_0$ predicts *zero*, so if data is near zero, $H_0$ wins.
      *   *Conclusion:* The paradox arises because the Bayesian test is comparing $H_0$ (point) to $H_1$ (spread). As $n$ grows, the data narrows. If the data narrows onto the point, $H_0$ wins against the spread, even if the data isn't *exactly* on the point. The p-value doesn't care about $H_1$'s spread, so it keeps rejecting.
      *   *Consensus:* Most statisticians think the "default" diffuse prior is unrealistic for large $n$. In reality, we don't believe effects can be arbitrarily large. If we use a realistic prior (concentrated near zero), the paradox diminishes.

  5.  **Drafting the Explanation (Iterative Process):**
      *   *Tone:* Journalistic, explanatory, authoritative but accessible.
      *   *Structure:*
          1.  Hook: Acknowledge the counter-intuitive nature.
          2.  The Core Mechanism (Sample Size): Use the "Microscope" or "Searchlight" analogy.
          3.  The Bayesian Penalty (The Prior): Use the "Betting" or "Prediction" analogy.
          4.  Why the Prior is the Culprit: Explain Ockham's Razor and realistic expectations.
          5.  Conclusion: Summary for the article.

      *   *Refining the "Sample Size" intuition:*
          *   Need to emphasize that to maintain $p=0.05$ as $n$ grows, the *observed effect* must get smaller.
          *   Frequentist: "This tiny blip is real."
          *   Bayesian: "This tiny blip is indistinguishable from noise compared to the huge effects you promised me in the alternative."

      *   *Refining the "Prior" intuition:*
          *   Focus on "Dilution of Probability."
          *   If $H_1$ says "Effect is between -1,000,000 and +1,000,000," the chance of it being specifically *here* (where the data is) is tiny.
          *   $H_0$ says "Effect is exactly 0." The data is *very close* to 0.
          *   Close to 0 is better than "Anywhere in a million range."

      *   *Avoiding Notation:* No $\theta$, $\mu$, $\sigma$, $H_0$, $H_1$ (unless spelled out), $p$, $n$. Use "Null," "Alternative," "Sample Size," "Effect."

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain why they don't converge?
      *   *Correction:* Yes, emphasize that frequentist significance thresholds stay fixed (0.05), but the *evidence required* to beat a diffuse alternative grows with sample size.
      *   *Check:* Did I explain why the prior is blamed?
      *   *Correction:* Make sure to mention that p-values aren't trying to do what Bayes factors do. The p-value isn't "wrong," it's just answering a different question. The Bayesian setup is "wrong" because the prior is unrealistic.
      *   *Check:* Is it too technical?
      *   *Correction:* Use the "Courtroom" or "Weather Forecast" analogy. Let's go with a "Prediction Contest."

  7.  **Final Polish:** Ensure the distinction between "Statistical Significance" (Frequentist) and "Evidence for a Theory" (Bayesian) is clear. (Proceed to generate output based on these thoughts.)

      *(Self-Correction on the "Blame"):* I need to be careful. Some *do* blame the p-value (arguing it shouldn't be used for hypothesis testing). But the prompt asks why statisticians tend to locate the problem in the *diffuseness of the prior*. I must answer that specific angle. The argument is that a point-null vs. diffuse-algorithm is a rigged fight in large samples.

      *(Refining the Sample Size intuition):* Crucial point: As $N$ goes up, the "noise" goes down. To keep $p$ constant, the signal must go down. So we are comparing a "Zero" theory against an "Anything" theory using data that is "Almost Zero." "Almost Zero" looks a lot like "Zero" compared to "Anything."

  8.  **Finalizing the Analogies:**
      *   *The Microscope:* Larger sample size = stronger magnification.
      *   *The Betting Book:* The diffuse prior spreads bets too thin.

