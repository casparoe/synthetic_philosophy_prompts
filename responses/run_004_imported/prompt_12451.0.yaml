answer: |-
  **Setting:** *A university library, late evening. Textbooks on metaphysics are spread across a table. Leo (Mereological Universalist) is spinning a pen. Maya (Mereological Nihilist) is highlighting a passage in Ted Sider.*

  **Leo:** Okay, look. Just look at the desk. You've got your phone. You've got your water bottle. They're right next to each other. Be honest: do they compose a further object? A "Phone-Bottle," if you will?

  **Maya:** Leo, we've been over this. There is no "Phone-Bottle." There are simples arranged phone-wise, and there are simples arranged bottle-wise. But there is no single *thing* that is the sum of both.

  **Leo:** But why? What's the metaphysical difference between the atoms in your phone—which you admit make up a "phone"—and the atoms in the bottle? If those atoms compose an object, why don't *all* the atoms on the desk compose one too?

  **Maya:** Because composition is restricted. It only happens under specific conditions. Usually, when the parts are bonded, or functionally integrated. Your phone's parts are screwed and glued together; they move as a unit. The phone and the bottle? They're just sitting there. If I knock the bottle over, the phone stays put. There's no unity.

  **Leo:** That's the "Common Sense" view, I get it. But here's the trap: Where exactly do you draw the line? Imagine I tape the bottle to the phone. Is it an object now?

  **Maya:** Probably.

  **Leo:** What if I use a weaker adhesive? What if I just put them in a tight-fitting box? At what precise micro-second of increasing contact does a new object pop into existence? If you say composition is restricted, you have to admit there's a vague boundary where existence itself is vague. And that's impossible. Existence can't be vague. Either there is an object, or there isn't.

  **Maya:** That's the Lewis argument, right? The vagueness argument. But you're assuming vagueness is *ontological*. I can say the word "heap" is vague without thinking the *atoms* are vague about whether they form a heap. "Object" might just be a vague concept we use, not a feature of reality. Reality is just simples. No composition ever happens. That's perfectly precise.

  **Leo:** But that costs you everything, Maya! If composition *never* happens, then your phone doesn't exist. *You* don't exist. We're just clouds of particles.

  **Maya:** I exist in the derivative sense. There are simples arranged Maya-wise. I'm not denying the *truth* of the sentence "I am drinking coffee." I'm denying that there is a fundamental metaphysical entity over and above the particles. Look, your view has a cost too. You're committed to the Trout-Turkey.

  **Leo:** *[Smiles]* Ah, the classic. Lewis's scattered object. Front half trout, back half turkey.

  **Maya:** Exactly. By your logic, if I take a trout and a turkey and push them together, there exists an object that is half fish, half bird. That's not just counter-intuitive; it's ontologically profligate. You're filling the universe with infinite garbage objects. Every time I blink, the sum of my left eyelash and the moon exists as a new object.

  **Leo:** It feels like garbage to you because you're thinking biologically. But metaphysically? Why is the Trout-Turkey worse than the Phone-Bottle? You admitted the phone is an object. The phone is just a collection of particles. The Trout-Turkey is just a collection of particles. If you accept one composite object, you need a principle that explains why *that* collection counts and the Trout-Turkey doesn't.

  **Maya:** The principle is causal integration. The trout's heart pumps blood to the trout's head. The turkey's lungs feed the turkey's legs. There is no causal loop between the trout half and the turkey half. They don't interact.

  **Leo:** Okay, but imagine a conjoined twin scenario. Or a graft. If I surgically attach the turkey to the trout and they share a circulatory system, is it an object then?

  **Maya:** Yes.

  **Leo:** So existence depends on biological function? What about a rock? A rock has no biological function. Is a rock an object?

  **Maya:** A rock is held together by chemical bonds.

  **Leo:** And the Phone-Bottle is held together by... gravity? Friction? My view is simpler, Maya. Universalism requires zero brute facts. I don't have to explain *when* composition happens. The answer is always "yes." It's ideologically parsimonious. I trade ontological parsimony (fewer objects) for ideological parsimony (fewer rules). You're positing a mysterious "glue" that turns many into one, and you can't tell me what that glue is.

  **Maya:** But your "simplicity" forces you to say the Trout-Turkey is a *real object*. If I destroy the trout half, have I damaged the Trout-Turkey object?

  **Leo:** Yes. You've destroyed part of it.

  **Maya:** But the turkey half is fine! The turkey doesn't know it's part of a Trout-Turkey. That's the problem. You're saying identity is independent of the nature of the parts.

  **Leo:** And you're saying identity depends on... what? Human interests? "Functional integration" is vague. Is a virus an object? It's on the edge of life. Is a corporation an object? It functions, but it's scattered. Your restricted view forces you to make arbitrary cuts in the fabric of reality. My view says: the world is just a vast lattice of overlapping parts. The Trout-Turkey exists, sure. It's just not a *natural kind*. It doesn't deserve a name or a science. But it exists.

  **Maya:** Here's where I push back. If the Trout-Turkey exists, then there are more things in heaven and earth than we can count. But worse, if you have unrestricted composition, how do you handle change? If I drink the water in the bottle, the "Phone-Bottle" loses mass. Is it the same object?

  **Leo:** It's a different object. The sum of particles at T1 is different from the sum at T2.

  **Maya:** See, that's where Nihilism actually wins on precision. I don't have to worry about identity over time for composites, because there *are* no composites. There are just simples persisting through time. The "Phone-Bottle" problem disappears because there was never a Phone-Bottle to begin with. You're trying to solve the problem of vagueness by multiplying entities. I solve it by eliminating the category that causes the problem.

  **Leo:** But you eliminate *us*.

  **Maya:** I eliminate the *metaphysical weight* of us. Look, let's go back to your desk. You say the Phone-Bottle exists. What are its properties?

  **Leo:** It has the mass of the phone plus the bottle. It's located where they are.

  **Maya:** Does it have a function?

  **Leo:** No.

  **Maya:** Does it have a beginning or end?

  **Leo:** When the parts cease to be adjacent.

  **Maya:** So if I slide the bottle two inches to the left, does the Phone-Bottle go out of existence?

  **Leo:** Yes. A new object (Phone + Bottle-2-inches-left) comes into existence.

  **Maya:** That's absurd, Leo! You're saying existence is fleeting based on arbitrary spatial coordinates. You've avoided the vagueness of *when* composition happens, but you've accepted a universe where objects pop in and out of existence every nanosecond as particles shift. That's not a virtue; that's a bug.

  **Leo:** It's only a bug if you think objects need to be *permanent* to be real. But think about the alternative. You say there are no tables, no chairs, no phones. You're asking me to believe that all of human language refers to nothing fundamental.

  **Maya:** I'm saying human language refers to *arrangements*. "There is a table" is true if there are simples arranged table-wise. I can keep the truth of ordinary speech without the ontological baggage. You, on the other hand, have to tell me that the Trout-Turkey is just as real as the turkey. And if you say that, you've lost the plot. The turkey is a biological unity; the Trout-Turkey is a philosopher's fiction.

  **Leo:** It's not a fiction, it's a sum. Look, here's the stalemate. You think my view multiplies objects beyond reason. I think your view multiplies *brute facts* about composition beyond reason. You have to explain why *this* collection unites and *that* one doesn't, and every explanation you give (bonding, function, proximity) has a counter-example.

  **Maya:** And you have to explain why we should take the existence of "scattered objects" seriously when they play no role in physics, biology, or daily life.

  **Leo:** Because logic demands it. If we have quantifiers in our logic ("there exists an x such that..."), they should range over everything. Why restrict the domain?

  **Maya:** Because the domain of *fundamental reality* shouldn't include things that depend entirely on our conceptual schemes. The Trout-Turkey only exists because we can conceive of it.

  **Leo:** The phone only exists because we conceive of it, too. Before humans, there were just silicon and metal arrangements.

  **Maya:** *[Pauses]* Okay. That's a fair hit. Maybe the phone is also just an arrangement. But there's a hierarchy. The phone has causal powers the Phone-Bottle doesn't. I can call someone with the phone. I can't call someone with the Phone-Bottle.

  **Leo:** The Phone-Bottle can block a door. That's a causal power.

  **Maya:** *[Laughs]* You're impossible.

  **Leo:** And you're a nihilist in a world full of stuff.

  **Maya:** I'm an austere realist.

  **Leo:** Same thing. So, are we ordering food? Does the "Leo-and-Maya" sum want pizza?

  **Maya:** The simples arranged Maya-wise are starving. So yes.

  **Leo:** Good. The Universalist sum pays the bill.

  **Maya:** Don't push it.
