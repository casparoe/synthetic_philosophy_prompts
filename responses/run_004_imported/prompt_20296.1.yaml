answer: |-
  This is a wonderful question, and it touches on one of the most common misconceptions in the teaching of quantum foundations. I appreciate the candor of your query, because the narrative you describe—that Bell's theorem killed *all* hidden variable theories—is unfortunately standard in many physics curricula.

  The short answer is: **There is a substantive, physics-based reason for Bohmian mechanics' survival, and it lies in a specific qualification of Bell's theorem that is often elided in introductory contexts.**

  Your current hypothesis (that it is merely sociological attachment to determinism) is partially true in that proponents do value realism, but it is incorrect to suggest that Bohmian mechanics survives *despite* Bell's result. It survives *because* it accommodates Bell's result in a specific way that orthodox quantum mechanics does not.

  Here is the breakdown of why your seminar narrative might need a slight but crucial adjustment, why Bell admired Bohm, and why the theory remains a live research program.

  ### 1. The Crucial Distinction: Local vs. Non-Local Hidden Variables

  The core misunderstanding lies in the scope of Bell's theorem. Bell did not prove that hidden variables are impossible. **Bell proved that *local* hidden variables are impossible.**

  Bell's inequality is derived from the assumption of **Local Realism**. This is a conjunction of two assumptions:
  1.  **Realism (Hidden Variables):** Physical properties exist independently of measurement.
  2.  **Locality:** Physical influences cannot propagate faster than light.

  When experiments (Aspect, Zeilinger, Clauser, etc.) violate Bell inequalities, logic dictates that **at least one** of these assumptions must be false. You cannot maintain both. This leaves us with a trilemma (ignoring superdeterminism for the moment):
  *   **Option A (Orthodox/Copenhagen):** Keep Locality (mostly), abandon Realism (properties aren't defined until measurement).
  *   **Option B (Bohmian Mechanics):** Keep Realism, abandon Locality.
  *   **Option C (Many Worlds):** Keep Realism and Locality (in a sense), but abandon the uniqueness of outcomes.

  De Broglie-Bohm (DBB) theory is explicitly **non-local**. In DBB, the velocity of a particle depends instantaneously on the positions of all other entangled particles in the universe, mediated by the universal wavefunction. Because DBB sacrifices Locality, it is perfectly consistent with the violation of Bell inequalities.

  Therefore, DBB is not a "casualty" of Bell's proof; it is one of the two main surviving contenders (alongside Many Worlds) that accounts for the data by rejecting Locality rather than Realism.

  ### 2. Why Bell Admired Bohm

  You mentioned puzzlement over Bell's admiration for Bohm. In light of the above, Bell's attitude becomes very clear. In his famous essay *"Bertlmann's Socks and the Nature of Reality,"* Bell wrote:

  > *"But in 1952 I saw the impossible done. It was in papers by David Bohm. Bohm showed explicitly how parameters could indeed be introduced, into nonrelativistic wave mechanics, with the help of which the indeterministic description could be transformed into a deterministic one. More importantly, in my opinion, the subjectivity of the orthodox version, the necessary reference to the 'observer,' could be eliminated."*

  Bell admired Bohm for two substantive reasons:
  1.  **Refuting von Neumann:** Before Bohm, the von Neumann "no-hidden-variables" proof was taken as gospel. Bohm showed von Neumann's assumptions were too strong. Bell later formalized this critique.
  2.  **Clarity on Non-Locality:** Bell felt that orthodox quantum mechanics obscured the inevitable non-locality of nature behind the vague concept of "measurement." Bohmian mechanics makes the non-locality explicit and mathematical. For Bell, if nature is non-local (as his own theorem suggested), it was better to have a theory that admitted it openly than one that hid it behind an instrumentalist fog.

  ### 3. Why It Is a "Live Research Program" (Substantive Reasons)

  While there is certainly a sociological element (some physicists prefer a deterministic ontology), the persistence of DBB is driven by serious theoretical advantages over the orthodox view:

  **A. Solution to the Measurement Problem**
  This is the biggest driver. Orthodox quantum mechanics requires a "collapse" postulate or a vague Heisenberg cut between system and observer. DBB requires no collapse. The wavefunction always evolves according to the Schrödinger equation, and particles always have definite positions. "Measurement" is just a specific type of interaction between particles. For philosophers of physics concerned with ontology, this is a massive virtue.

  **B. Empirical Equivalence**
  In the non-relativistic domain, DBB is empirically equivalent to standard quantum mechanics. It predicts the exact same statistical outcomes (via the "quantum equilibrium hypothesis," where $\rho = |\psi|^2$). You cannot rule it out experimentally unless you find a scenario where quantum equilibrium is violated (which is an active area of research).

  **C. Cosmology and the Wavefunction of the Universe**
  In quantum cosmology, there is no "external observer" to collapse the wavefunction of the universe. Orthodox interpretations struggle here. DBB handles this naturally: the universe has a configuration and a wavefunction, and no external observer is required.

  ### 4. The Cost: Why It Is Still a Minority View

  You are right to sense that there is a "catch." If DBB is so good, why isn't it the standard? The cost is indeed high, and it validates some of your intuition, though not for sociological reasons.

  **Tension with Special Relativity:**
  While DBB is compatible with the *predictions* of relativity (it respects the no-signaling theorem, so you can't send superluminal messages), it is not manifestly Lorentz invariant. It requires a preferred foliation of spacetime to define the instantaneous guidance of particles. Reconciling this preferred frame with the spirit of relativity is difficult. While there are relativistic extensions of DBB, they are cumbersome compared to standard QFT.

  This is why many physicists reject it: they are willing to give up realism (Option A) to save the elegant spacetime structure of relativity, whereas Bohmians are willing to give up manifest Lorentz invariance to save definite particle trajectories.

  ### 5. Pedagogical Recommendation

  For your spring seminar, I would suggest tweaking the narrative slightly. Instead of presenting Bell's theorem as the death of hidden variables, present it as the **death of *local* hidden variables.**

  You might frame the landscape like this:
  1.  **Bell's Theorem:** Nature cannot be both Local and Real.
  2.  **The Fork in the Road:**
      *   **Path 1 (Orthodox/Copenhagen):** Save Locality, sacrifice Realism. (Properties are contextual/indeterminate).
      *   **Path 2 (Bohmian Mechanics):** Save Realism, sacrifice Locality. (Particles exist, but influence is instantaneous).
      *   **Path 3 (Many Worlds):** Save Realism and Locality, sacrifice Uniqueness. (All outcomes happen).

  This framing accomplishes three things:
  *   It corrects the physics error regarding Bell's theorem.
  *   It explains why Bell admired Bohm (Bohm chose Path 2 and made the cost explicit).
  *   It explains why DBB is still researched (it solves the measurement problem without collapse) while acknowledging why it is a minority view (the tension with relativity is a heavy price to pay).

  ### Summary

  Your guess that it is "largely sociological" underestimates the theoretical utility of Bohmian mechanics. It is taken seriously because it is the only theory that provides a clear, observer-independent ontology that solves the measurement problem without modifying the Schrödinger equation.

  It survives Bell's theorem not by ignoring it, but by embracing the non-locality that Bell's theorem proves is necessary. Bell admired it because he believed physicists should face the non-locality of nature squarely, rather than hiding it behind the concept of measurement.

  It is a live option not because its proponents are clinging to the past, but because they are offering a coherent solution to the measurement problem that orthodox quantum mechanics still lacks.
