  **Justifications**

  **(1) Score: 2.** Owen accurately states the core tenet of the Selected-Effects (SE) theory (à la Millikan or Neander). On this view, proper functions are necessarily historical; a trait's function is the effect for which it was selected. As a statement of the position, it is philosophically precise.

  **(2) Score: 2.** Nadia correctly identifies the "novel trait" objection. SE theories struggle to ascribe functions to traits that have not yet been selected (e.g., a new mutation or a learned behavior). Her appeal to Cummins' Causal-Role (CR) theory correctly highlights that CR accounts can ascribe functions based on current systemic contribution, bypassing the history requirement.

  **(3) Score: 2.** Owen raises the two standard objections to CR theories: the problem of arbitrariness (without a selection history, any causal effect counts as a function) and the problem of normativity (CR describes what a trait *does*, not what it *ought* to do, making "malfunction" difficult to define). This is a devastating critique of naive CR accounts.

  **(4) Score: 1.** Nadia attempts to salvage CR by incorporating elements of Boorse's Biostatistical Theory (BST), restricting functions to survival/reproduction and defining malfunction statistically. While this is a coherent theoretical move, it is scored lower because the restriction to "survival and reproduction" is often accused of covertly smuggling in teleology or requiring the very historical context she wishes to avoid.

  **(5) Score: 2.** Owen identifies the "reference class" or "relevance" problem. Even if we accept statistical norms, determining *which* causal contribution (thermoregulation vs. odor) is the relevant baseline for comparison typically relies on knowing what the trait was selected to do. This move successfully problematizes Nadia's attempt to decouple statistical normality from evolutionary history.

  **What the Exchange Leaves Out**

  This debate frames the issue as a dichotomy between history (SE) and current capacity (CR/BST), overlooking two significant contemporary developments. First, it ignores **organizational accounts** (e.g., Mossio & Saborido), which ground function in the self-maintaining organization of living systems rather than history or statistics. Second, it misses **pluralist approaches** (e.g., Godfrey-Smith), which suggest that "function" is not a single natural kind but a cluster concept where both SE and CR definitions are valid for different explanatory contexts (e.g., evolutionary explanation vs. physiological modeling). A synthesis might acknowledge that sweating has a *selected-effect* function (thermoregulation) and a *causal-role* function (toxin flushing), without forcing one to negate the other.
