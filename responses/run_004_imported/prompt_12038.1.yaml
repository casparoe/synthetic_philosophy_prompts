answer: |-
  **Setting:** *A quiet corner of a university library café, late afternoon. Rain streaks the high windows. ELENA (a postdoc specializing in meta-ethics) and MARCUS (a senior graduate student in philosophy of action) sit across from each other with cooling coffees and open notebooks.*

  **Marcus:** So, this is the case? The brother feels nothing. No resentment, no love. Just a blank wall. And he says because he feels nothing, he has no reason to go.

  **Elena:** That's the claim. And honestly? My gut reaction was anger. He's letting his father die alone. But then I read Williams, and... I see the logic. If "having a reason" means there is a sound deliberative route from your current motivations to an action, and he has *nothing* in his motivational set that links to visiting... then strictly speaking, he has no reason.

  **Marcus:** Strictly speaking, you have no soul. Look, I get the appeal of Internalism. It keeps things tidy. Reasons connect to psychology. But in this case, it feels like you're handing the brother a get-out-of-jail-free card. You're telling him, "If you're indifferent enough, you're off the hook."

  **Elena:** I'm not telling him he's off the hook morally. I'm telling you that saying he has a *reason* when he has no possible motivation is a misuse of the word. Williams's point is that external reason statements are either false or they're just disguised internal ones.

  **Marcus:** Disguised how?

  **Elena:** Let's walk through it. When you say, "Your brother has a reason to visit," what are you doing? You could mean: "If he thought about it clearly, he would find a motivation." Maybe he cares about his own self-respect? Maybe he'd regret it later? If that's true, then I'm an Internalist too! That's a sound deliberative route from his existing Subjective Motivational Set (his S). We just help him find the path.

  **Marcus:** But what if he doesn't care about self-respect? What if he's immune to regret? What if his S is just... barren regarding this?

  **Elena:** Then the internal reason vanishes. And that's when you switch tactics. You say, "No, he *still* has a reason. It's an objective fact." But Williams asks: What does that mean? If it doesn't link to a motivation, even potentially, how does it explain action? It becomes a bare assertion. It collapses into "He ought to go," or "It would be good if he went." But "ought" isn't "reason." I can say a knife ought to cut butter, but the knife doesn't have a reason to do it.

  **Marcus:** You're reducing reasons to psychological pushes. That's the Humean trap. A reason isn't a shove; it's a justification. It's a consideration that counts in favor of an action. The fact that "this man is your father and he is dying" is a consideration that counts in favor of visiting. That fact exists regardless of whether your brother's psychological machinery registers it.

  **Elena:** But if it doesn't register, how does it function as a reason *for him*? A reason for action has to be capable of motivating. If you say he has a reason that cannot possibly motivate him, you've severed the link between rationality and agency. You're talking about a normative fact floating in the ether, not a reason for an agent.

  **Marcus:** You're assuming the only way a reason motivates is by latching onto a pre-existing desire. That's the contingent psychology model. But rational agents are responsive to *truth*. If I show you a proof in mathematics, you are motivated to accept the conclusion not because you have a prior desire to accept it, but because you see it follows.

  **Elena:** Belief is one thing; action is another.

  **Marcus:** Is it? If I see that I have a normative reason to $\phi$, that perception *is* motivating, provided I'm rational. Your brother isn't just unmotivated; he's rationally blind. He's like a person who looks at 2+2 and says, "I feel no desire to say 4, so I have no reason to." He's wrong about the reason, just like he'd be wrong about the sum.

  **Elena:** That analogy is doing too much work. In math, the conclusion is forced by logic. In action, there's a gap. Williams grants that we can deliberate. We can imagine the father's suffering. We can learn new facts. If the brother imagines the scene and *still* feels nothing, the Internalist says the deliberative route has hit a wall. The Externalist says the wall is an illusion. But you haven't explained *how* he's wrong. You just say "He's blind."

  **Marcus:** I can explain how he's wrong. He's failing to recognize a value that is independent of his valuation. The relationship of father-and-son carries normative weight. It generates obligations. When he says, "I have no reason," he is making a false claim about the normative landscape. He thinks the landscape is empty there. It isn't.

  **Elena:** Okay, but let's press on the deliberation point. You said earlier that Internalism can accommodate a lot through vivid imagination. Suppose we sit the brother down. We describe the father's fear. We describe the social shame of not going. We describe the potential for closure. If, after all that *rational deliberation*, he still says, "I understand all that, but I have zero motivation," the Internalist says, "Okay, then you have no reason."

  **Marcus:** And the Externalist says, "You are being irrational."

  **Elena:** But what does "irrational" mean there? If you've exhausted the deliberative routes from his S, what standard are you using? You're smuggling in an External standard. You're saying, "Your S *ought* to contain a desire to visit fathers."

  **Marcus:** Exactly. A rational agent's S *ought* to be responsive to certain values. If it isn't, the agent is defective. Internalism treats the agent's current psychology as sovereign. It says, "If you don't care, you don't care, and that's the end of the rational story." That makes rationality too contingent. It makes the monster immune to criticism, provided he's consistent.

  **Elena:** It doesn't make him immune to criticism! We can still say he's cruel. We can still blame him. Williams is very clear on this. We blame people for not having reasons when they should. We just don't pretend there's a magical "reason fact" bridging the gap.

  **Marcus:** But blame implies he *could* have done otherwise for a reason. If Internalism is true, and his S is fixed, he couldn't have.

  **Elena:** S isn't fixed. That's why we blame. Blame is a social tool to modify S. We punish, we argue, we ostracize, to *create* a motivation where there wasn't one. We want him to care about reputation, or guilt, or us. Internalism explains the *function* of blame. Externalism just posits a ghost.

  **Marcus:** That's a sociological explanation of blame, not a justification of it. You're saying we blame him to *make* him have a reason. I'm saying we blame him because he *ignored* a reason he already had. There's a difference.

  **Elena:** Is there? If he ignored a reason he couldn't feel, in what sense was he ignoring it?

  **Marcus:** In the sense that the reason was there to be seen! Look, let's go back to your Williams reconstruction. You said external reason statements collapse into "It would be good." You treat that as a dismissal. But why is that a dismissal? If it is objectively good, and he is a rational agent, doesn't that give him a reason?

  **Elena:** Only if you assume rationality requires pursuing the good. That's a substantive claim. Williams says many rational people don't care about the moral good. They care about their projects. If the brother's project is "avoiding emotional entanglement," and visiting violates that, he's being rational relative to his project.

  **Marcus:** But some projects are rationally impermissible.

  **Elena:** Who says?

  **Marcus:** Reason says!

  **Elena:** *(Laughs)* See? You're just asserting the conclusion. You're positing a "Reason" with a capital R that dictates our ends. Williams says Reason is the slave of the passions, not in a crude sense, but in the sense that it needs fuel. It needs a starting point in the S.

  **Marcus:** Okay, let's push this to the limit. This is where I think Internalism breaks. Let's assume the brother is a true amoralist. Not just indifferent to the father, but indifferent to shame, regret, social standing, future pain. He has *nothing* in his S that visiting serves. He is a psychological black hole.

  **Elena:** Okay. A monster.

  **Marcus:** On your view, does he have a reason to visit?

  **Elena:** No. Not an internal one.

  **Marcus:** So, if he walks away and lets the father die, he has acted without a reason against it?

  **Elena:** He has acted without an *internal* reason against it. He has acted against *our* reasons for him to stay.

  **Marcus:** That sounds like relativism. "He has no reason" sounds like "It's permissible for him."

  **Elena:** It's not permissibility. It's explanatory. If you ask, "Why didn't he go?" and the answer is "He had no reason to," that explains the action. If you say, "He had a reason not to, but he didn't care," you're using "reason" in two different senses. You're confusing "There is a value he ignored" with "He had a motivation he ignored."

  **Marcus:** But here's the worry, Elena. If you say he has no reason, you've lost the ability to say he made a *mistake*. You can say he's bad. You can say he's cruel. But you can't say he's *wrong* about what to do. You've ceded the territory of rational error to the monster. You've told him, "Your psychology is impeccable. The universe just doesn't have a hook in you." That validates his indifference.

  **Elena:** It validates his indifference only if he thinks morality depends on reasons. But why should he? We can tell him: "You are a monster. We will treat you as one. We don't care if you have a reason; we care that you did it." Internalism is honest. It admits that rational persuasion has limits. If you can't find a hook in someone's S, you can't reason them into action. Externalism promises you can. It says, "I can show you a reason that applies to you even if you have no hook." That's a lie. It won't move him.

  **Marcus:** It's not a lie; it's a demand. It's saying, "Your S *should* have hooks."

  **Elena:** But "should" implies "can." If he can't cultivate that hook—if he's psychologically incapable of caring—then telling him he has a reason is empty.

  **Marcus:** But most people aren't psychologically incapable. They're just lazy or defensive. The brother says he feels "nothing." That's likely a defense mechanism.

  **Elena:** Agreed. And that's where deliberation comes in! We pierce the defense. We make him feel the regret. Then he *does* have an internal reason. Internalism handles 99% of cases. It's the 1%—the true psychopath, the true amoralist—where we diverge. You say he still has a reason. I say he doesn't.

  **Marcus:** And that 1% is where the concept of reason matters most! If we can't say the monster is irrational, only "different," then rationality isn't normative. It's just descriptive psychology.

  **Elena:** Rationality is about efficiency in pursuing ends. Morality is about the ends themselves. You're trying to get morality out of rationality. Williams says you can't. You need a separate moral sentiment.

  **Marcus:** I'm not trying to get morality out of rationality. I'm trying to get *normativity* out of it. There are reasons of etiquette, reasons of prudence, reasons of morality. They all share the property of "counting in favor." The brother is failing to recognize a count.

  **Elena:** But "counting in favor" is a metaphor. What is the cash value? If it doesn't cash out in motivation, it's just a sound we make.

  **Marcus:** The cash value is that he is answerable. If I ask him, "Why didn't you go?" and he says, "I didn't want to," I say, "That's not a good enough answer."

  **Elena:** And I say, "It's not a good enough answer *for us*." It doesn't satisfy our demands. But for *him*, it was sufficient.

  **Marcus:** No! It wasn't sufficient because there were considerations he ignored. The father's pain was a consideration.

  **Elena:** A consideration for *whom*?

  **Marcus:** For any rational agent!

  **Elena:** *(Leans forward)* There it is. "Any rational agent." You're defining "rational agent" as "someone who cares about fathers." That's circular.

  **Marcus:** I'm defining it as "someone who recognizes value."

  **Elena:** And if he doesn't?

  **Marcus:** Then he's defective.

  **Elena:** And if the defect is in his S?

  **Marcus:** Then he's rationally defective.

  **Elena:** You're just repeating the mantra. You won't admit that for this man, in this moment, there is no bridge. And by refusing to admit it, you obscure the real work that needs to be done. We don't need to tell him he has a reason. We need to make him *have* one. We need to change his S. Externalism is passive; it assumes the reason is sitting there waiting to be seen. Internalism is active; it knows reasons have to be built.

  **Marcus:** But if you build it, you're manipulating him, not reasoning with him.

  **Elena:** All moral education is manipulation until it sticks! You teach a child to share not by showing them an external reason, but by praising them until they feel good about sharing. You alter the S.

  **Marcus:** *(Pauses, stirs coffee)* You know, the worry I have is that if you're right, then the brother wins. He can say, "Ah, so I have no reason. Then I am free."

  **Elena:** He's not free. He's just unmoored. And we are free to lock him out of our lives. We are free to hate him. Internalism doesn't disarm us. It just clarifies the weapon. We aren't fighting him with logic; we're fighting him with pressure.

  **Marcus:** But logic is the higher ground. If he's wrong about the reason, he's vulnerable to argument. If he just lacks a motive, he's only vulnerable to force or therapy.

  **Elena:** Maybe that's the human condition. Maybe some people are beyond argument. Externalism comforts you because it says, "No, everyone is reachable by Reason." I think that's a fantasy. The brother might be unreachable. And if he is, I'd rather know that than pretend a ghost-reason is tugging at his sleeve.

  **Marcus:** So you'd rather condemn him to the outer darkness than pretend he has a map?

  **Elena:** I'd rather admit there is no map for him, only a shove.

  **Marcus:** *(Sighs)* And that shove... you call it blame?

  **Elena:** I call it the attempt to create a reason where none exists.

  **Marcus:** But if he resists the shove? If he stands there, indifferent to the blame, indifferent to the exclusion, indifferent to the father's corpse... on your view, there is simply nothing more to say. No "You are wrong." Just "You are different."

  **Elena:** I can still say "You are wrong." I just mean "You violate our norms," not "You violated a law of rational physics."

  **Marcus:** That's a retreat. It makes morality tribal.

  **Elena:** It makes it human. Reasons are human things. They live in us. If they die in him, they're dead.

  **Marcus:** *(Closes notebook)* I can't accept that. I have to believe that even if he feels nothing, the reason stands. Like a lighthouse shining on a ship that has turned off its lights. The light is still there.

  **Elena:** And if the ship crashes?

  **Marcus:** Then the ship was blind. Not the light.

  **Elena:** *(Softly)* But the light doesn't save the ship. Only the eyes do. And his are closed.

  **Marcus:** Then it's our job to pry them open. But I won't tell him the light isn't shining just because he can't see it.

  **Elena:** And I won't tell him he can see it just to make you feel better about the dark.

  *(Silence settles between them. The rain intensifies against the glass. Neither reaches for their cup.)*
