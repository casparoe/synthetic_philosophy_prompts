      *   **Akrasia/Weakness of Will:** Knowing the better course but failing to take it.
      *   **System 1 vs. System 2 (Kahneman):** The feeling is System 1 (fast, intuitive). The stats are System 2 (slow, analytical). System 1 doesn't turn off just because System 2 knows better.
