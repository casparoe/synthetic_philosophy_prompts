answer: |-
  This is a fantastic observation, and it speaks volumes about your own background that Section 9 jumped out at you. To a modern scientist trained in the post-replication-crisis era, Turing's endorsement of telepathy reads like a glitch in the matrix. But to answer your question—would he have retracted it or doubled down?—we have to look at how Turing processed evidence, not just what he concluded.

  My best guess is that **Turing would have quietly but firmly dropped the claim**, likely reclassifying the "overwhelming" statistical evidence as a systematic error or methodological artifact. He wouldn't have dug his heels in, because his intellectual character was defined by a specific kind of Bayesian pragmatism.

  Here is the breakdown of why, based on his work and character.

  ### 1. The Bayesian Codebreaker vs. The Frequentist Trap
  You mentioned your paranoia about p-values, which is key here. In 1950, the "statistical evidence" Turing referred to came largely from J.B. Rhine's work at Duke University. Rhine was a frequentist; he was collecting hits on Zener cards and calculating the probability of those hits occurring by chance.

  Turing, however, was arguably one of the earliest practical Bayesians. During the war, his work on Banburismus (breaking the Naval Enigma) relied heavily on sequential analysis and weighing the *weight of evidence* (a term he actually used) for competing hypotheses. He didn't just ask, "Is this unlikely to be random?" He asked, "How much more likely is this hypothesis than that one, given the prior probability?"

  If Turing had lived to see the 2010s, he would have seen the priors for telepathy remain static while the likelihood ratios collapsed under preregistered replication attempts. A Bayesian mind updates. When Bem's "Feeling the Future" data failed to hold up under rigorous scrutiny, the posterior probability of ESP existing dropped precipitously. Turing's war work proved he was willing to discard a hypothesis the moment the weight of evidence shifted, even if it was a pet theory. He treated hypotheses as tools for decryption, not ideologies.

  ### 2. Section 9 was Instrumental, Not Ontological
  It is crucial to read Section 9 not as a treatise on parapsychology, but as a **control condition for the Imitation Game**.

  Turing's goal was to isolate "intelligence" as a variable. He recognized that if telepathy were real, it would act as a confounding variable (a "leak" in the experimental setup). His proposal for "telepathy-proof rooms" (lead-lined, essentially) is the language of an experimentalist trying to seal a leak, not necessarily a believer preaching a gospel.

  In his 1952 paper on morphogenesis (*The Chemical Basis of Morphogenesis*), Turing challenged the prevailing biological dogma that genetics alone dictated pattern formation. He proposed a mathematical model of chemical diffusion (reaction-diffusion systems). Note the distinction: In biology, he offered a *mechanism* that could be mathematically modeled and tested. With ESP, there was no mechanism, only statistical anomalies.

  Given his later work in biology, I suspect Turing would have eventually found the lack of a mechanistic model for telepathy unsatisfying. He was comfortable with non-materialist explanations (he was interested in how mind emerges from matter), but he demanded mathematical consistency. ESP offered statistics without a system.

  ### 3. The "Overwhelming" Quote in Context
  When Turing writes, "The statistical evidence, at least for telepathy, is overwhelming," he immediately follows it with: *"It is my opinion that the evidence..."*

  He frames it as a personal assessment of the current data landscape, not an immutable truth. In the same section, he acknowledges that accepting ESP might force us to accept other "strange" phenomena. He is essentially conducting a sensitivity analysis: *If* this variable is real, *then* my test needs this modification.

  If you look at how he handled the "Lady Lovelace Objection" (that machines can only do what we tell them to), he didn't argue philosophy; he argued capability. He predicted machines would eventually learn. He was willing to be proven wrong by performance. If ESP effects ceased to perform under rigorous testing, he would have treated them like a machine that fails the imitation game: interesting in theory, but functionally null.

  ### 4. His Relationship with Orthodoxy
  There is a counter-argument: Turing was willing to go against the grain. He was gay in a criminalizing society; he worked on morphogenesis when biologists weren't thinking mathematically. Could he have been a "believer" who saw himself as a persecuted visionary?

  Possibly, but his dissent was always rooted in *rigor*, not contrarianism. He didn't challenge biology because he disliked biologists; he challenged it because he saw a mathematical pattern they were missing. The ESP research of the 1950s (and Bem's in 2011) suffered from exactly the kind of statistical looseness (p-hacking, optional stopping) that a man of Turing's statistical bent would eventually find repugnant.

  ### The Verdict
  If Turing had sat through a modern replication crisis seminar, I imagine he would have looked at the funnel plots and the p-curve analyses and recognized **selection bias**.

  He would likely have concluded that the "overwhelming" evidence of 1950 was the result of what we now call the "file drawer problem." He was a statistician at heart, and while he was open to the *possibility* of the paranormal (he was deeply interested in the relationship between the physical and the mental), he was not a mystic.

  **My prediction:** He would have revised the 1950 paper in a 1960 edition. He likely would have kept the *concept* of the telepathy-proof room as a theoretical safeguard (just in case), but he would have amended the text to note that the statistical case had failed to mature under stricter experimental controls. He would have treated ESP not as a truth, but as a **null hypothesis that hadn't yet been properly rejected**, until it finally was.

  For a man who understood better than almost anyone how easily patterns can be found in noise (and how to distinguish the two), the dissolution of ESP under scrutiny would have been the final decryption key. He would have seen the signal was just noise all along.
