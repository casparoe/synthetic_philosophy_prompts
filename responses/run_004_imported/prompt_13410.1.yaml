answer: |-
  It is completely understandable that you struggled to explain this to your roommate. Evidential Cooperation in Large Worlds (ECL) is notoriously abstract, and even within the Effective Altruism (EA) community, it is often viewed as a "high-concept" theoretical add-on rather than a practical guide.

  However, if we grant the premises—that the universe is vast, that there are many agents reasoning similarly to you, and that Evidential Decision Theory (EDT) is the correct framework for choosing actions—the implications are actually quite distinct from standard EA advice. Standard EA says: *"Figure out what is objectively most good, and do that."* ECL says: *"Figure out what the coalition of all similar reasoners values, and optimize for that portfolio."*

  Here are the three most significant practical implications for an ordinary person trying to be an effective altruist, assuming ECL is true.

  ### 1. The "Moral Handshake" (Changing Your Donation Portfolio)
  This is the most concrete, day-to-day change. Under standard EA, if you are 90% convinced that animal welfare is the most important cause and 10% convinced of AI safety, you should roughly allocate your resources according to those probabilities (moral uncertainty).

  Under ECL, the calculation changes. You aren't just weighing probabilities of what is *true*; you are negotiating a trade with agents who hold different values.
  *   **The Logic:** Suppose there are 1,000 agents reasoning like you. 200 care deeply about animal welfare (like you), but 800 care deeply about AI safety. If you only fund animal welfare, the 800 AI-safety agents will (by symmetry of reasoning) only fund AI safety. Your values get 20% of the total resources.
  *   **The Move:** If you agree to fund AI safety *now*, you provide evidence that the other 800 agents will fund animal welfare. Suddenly, animal welfare gets 80% of the total multiverse resources.
  *   **Practical Action:** You should likely donate to cause areas that are **popular among other rational agents**, even if you personally think they are less important. If you believe most "copies" of rational agents prioritize longtermism or AI safety (which is a common belief in EA circles), ECL suggests you should prioritize those causes disproportionately, effectively "buying" their cooperation on the causes *you* care about.

  **Bottom Line:** You might end up donating to the same causes as a standard longtermist, but for a different reason: not because you think they are objectively most important, but because they are the currency of trade with your acausal partners.

  ### 2. De-escalating Value Conflict (Changing Your Advocacy)
  Standard EA can sometimes drift into a mindset of "My moral framework is the correct one, and I need to convince others to adopt it." ECL fundamentally discourages this.
  *   **The Logic:** If you treat agents with different values as adversaries to be defeated or converted, you signal to your acausal counterparts (who hold those different values) that you are not a cooperative partner. If you are hostile to their values here, they will be hostile to your values in their corner of the multiverse.
  *   **The Move:** Adopt a stance of **value pluralism**. Instead of trying to prove other moral views wrong, treat them as potential partners in a coalition.
  *   **Practical Action:** In conversations, online advocacy, or community building, avoid polarizing language that dismisses other moral frameworks. Focus on finding "robustly good" actions—things that are valuable across many different moral systems (e.g., reducing existential risk, increasing general resources, improving epistemic rationality).

  **Bottom Line:** Be less of a missionary for your specific values and more of a diplomat for a coalition of values. This reduces polarization within the EA community and focuses energy on common ground.

  ### 3. Investing in "Common Knowledge" (Changing What You Learn)
  For ECL to work, the correlation between your reasoning and others' reasoning must be strong. This requires that you and your "copies" have access to similar information and understand each other's decision processes.
  *   **The Logic:** If you operate in the dark, you don't know who to trade with or what they value. If other agents don't understand *your* decision theory, they won't trust that your cooperation is evidence of their cooperation.
  *   **The Move:** Prioritize learning about other moral frameworks and decision theories, not just to critique them, but to model them accurately.
  *   **Practical Action:** Spend a portion of your "EA learning time" studying moral views you disagree with (e.g., if you are a hedonic utilitarian, study deontology or preference utilitarianism seriously). Support organizations that foster dialogue and clarity within the rationalist/EA community, as increasing the "common knowledge" of the community strengthens the acausal links.

  **Bottom Line:** Epistemic humility becomes an instrumental good. Understanding others isn't just polite; it's necessary for the "trade" to execute successfully.

  ### Is it just a seminar-room curiosity?
  To answer your final worry: **It is not negligible, but it is subtle.**

  For most people, ECL doesn't result in a radical lifestyle overhaul (like "give away everything tomorrow" or "move to a new country"). Instead, it acts as a **force multiplier for compromise.**

  *   **Without ECL:** You might think, "I'll give 10% to AI safety just in case I'm wrong about animal welfare."
  *   **With ECL:** You might think, "I'll give 80% to AI safety because that secures the best deal for animal welfare across the multiverse."

  If you find the idea of "acausal trade" too metaphysically spicy to fully internalize, you can still capture 80% of the value simply by adopting the **Moral Handshake** mindset: *Act as if you are representing a coalition of people with different values, not just your own.* That shift alone changes how you donate, how you argue, and how you view your role in the world.
