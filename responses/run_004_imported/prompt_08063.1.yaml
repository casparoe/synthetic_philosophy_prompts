      *   **The Crucial Distinction:** Ontological vs. Epistemic.
          *   *Epistemic:* We use infinity because it's hard to calculate finite $N$.
          *   *Ontological:* The property (e.g., non-analyticity) literally does not exist at finite $N$, yet it explains the behavior of finite systems.

  3.  **Address the Specific Points Raised:**
      *   **Batterman's Claim:** Asymptotic reasoning is indispensable. The limit isn't just approximating; it's explaining *why* the finite system behaves that way.
      *   **The User's Skepticism:** Why isn't this just "mathematically convenient"?
