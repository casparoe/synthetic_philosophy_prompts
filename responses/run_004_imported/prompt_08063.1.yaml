answer: |-
  This is a superb question that cuts to the heart of the contemporary debate between philosophers of physics and practicing physicists. As a condensed-matter physicist, your intuition is the standard one: the thermodynamic limit is a calculational tool, a convenient fiction that simplifies the algebra while capturing the physics of "large $N$." To you, the singularity is a mathematical artifact, not a physical reality.

  However, philosophers like Robert Batterman, Margaret Morrison, and others argue that this intuition conflates *ontology* (what exists) with *explanation* (how we understand what exists). Their claim is not that infinite systems physically exist, but that the *explanation* of finite systems' behavior essentially relies on structures that only exist in the infinite limit.

  To answer your specific questions: we need to disentangle what is meant by "reduction," why the singularity is claimed to be indispensable, and how the Renormalization Group (RG) fits into this taxonomy.

  ### 1. The Nature of the Limit: Approximation vs. Essential Idealization

  The core disagreement lies in how the $N \to \infty$ limit is categorized.

  *   **The Physicist's View (Approximation):** The infinite system is an *approximation* of the finite system. As $N$ grows, the finite system's properties converge to the infinite system's properties. Therefore, any truth about the infinite system is approximately true for the finite system. The limit is epistemic convenience.
  *   **Batterman's View (Essential Idealization):** The infinite system is an *essential idealization*. This means that while the infinite system does not exist, the *mathematical structure* introduced by the limit (the singularity) is required to explain the behavior of the finite system.

  **Why?** Because for any finite $N$, the correlation length $\xi$ is bounded by the system size. A genuine phase transition requires $\xi \to \infty$. If you try to explain critical phenomena (scaling laws, universality) strictly within finite $N$ statistical mechanics, you run into a wall: you cannot derive power-law behavior with non-trivial exponents from a finite sum of analytic terms without effectively smuggling in the limit.

  Batterman's argument is that the *reason* finite systems exhibit near-singular behavior is that they are "shadowed" by the singularity of the infinite system. The singularity acts as an "attractor" for the physics of the finite system. If you remove the singularity (by insisting on strict finitude), you lose the explanatory mechanism for *why* the finite system behaves the way it does.

  ### 2. The Reductionist Hurdle: Non-analyticity from Analyticity

  You asked what would have to be true for the singular limit to license **ontological emergence** rather than mere epistemic difficulty.

  In the philosophy of science, "reduction" is often cashed out in Nagelian terms: can the laws of the higher level (thermodynamics/phase transitions) be derived from the laws of the lower level (quantum/statistical mechanics of $N$ particles)?

  *   **The Logical Problem:** You cannot derive a non-analytic function (the free energy at a phase transition) from a finite sum of analytic functions (the partition function for finite $N$). It is a category error, mathematically speaking.
  *   **The Emergentist Conclusion:** If strict reduction requires deriving the macro-behavior from the micro-behavior *without* changing the ontology (i.e., staying at finite $N$), then phase transitions are **not reducible**. The property "phase transition" (defined by non-analyticity) literally does not exist in the base ontology (finite particles). Therefore, it is emergent.

  **Your Counter-Argument:** But we *do* derive it using the limit.
  **The Emergentist Reply:** Yes, but you derived it by *changing the ontology* to include infinite systems. If the derivation requires positing an entity (the infinite system) that is not composed of the base entities (finite particles), then the reduction is not "pure." The infinite limit is doing "indispensable explanatory work."

  ### 3. The Renormalization Group: Reduction or Emergence?

  This is the crux of your second question. Does RG settle the matter in reduction's favor?

  The RG is ambiguous, and both sides claim it.

  **The Reductionist Reading:**
  RG provides a systematic derivation of macroscopic critical exponents from microscopic Hamiltonians. We start with a Hamiltonian $H$, apply RG transformations, and flow to a fixed point. We have derived the macro from the micro. This looks like a triumph of reductionism.

  **The Emergentist Reading (Batterman/Morrison):**
  Look closely at what RG actually *does*. It explains universality by showing that **microscopic details are irrelevant**.
  1.  **Autonomy:** The critical exponents depend *only* on the fixed point structure (dimensionality, symmetry), not on the specific coupling constants or lattice structures. The macro-behavior is *autonomous* from the micro-details.
  2.  **The Role of the Limit:** The RG flow equations and the fixed points are strictly defined only in the thermodynamic limit. The "washing out" of micro-details happens *because* we iterate the transformation infinitely many times (or assume the correlation length is infinite).
  3.  **Conclusion:** RG explains *why* the micro-level doesn't matter. If the macro-behavior is insensitive to the micro-details, then the macro-level has a kind of independence (emergence). The explanation relies on the singular limit structure (the fixed point), not the finite particle dynamics.

  So, RG supports **derivability** (which sounds like reduction) but via a mechanism that highlights **autonomy** (which sounds like emergence). Batterman argues this is a new kind of relationship: **asymptotic reduction**. The macro is reduced to the micro *only via* the asymptotic structure that transcends the micro.

  ### 4. Ontological vs. Epistemic: The "Indispensability" Criterion

  You asked: *What, precisely, would have to be true for the singular limit to license real ontological emergence?*

  For a philosopher like Batterman, the distinction isn't about whether infinite systems "exist" in the lab (they agree they don't). It is about **explanatory indispensability**.

  *   **Epistemic/Computational:** If we could, in principle, derive the steep crossover behavior of a finite $N=10^{23}$ system using only finite-$N$ equations, but it was just too hard, then the limit is merely epistemic.
  *   **Ontological/Explanatory:** If the finite-$N$ equations *cannot* generate the explanation for the scaling behavior without effectively invoking the singular structure of the $N=\infty$ limit, then the limit is ontologically significant in the explanatory scheme.

  The claim is that the **universality classes** are real features of the world, but they are features of the *space of Hamiltonians in the infinite limit*, not features of any specific finite assembly of particles. The finite system "participates" in the universality class, but the class itself is a structure defined at infinity.

  ### 5. Butterfield's Compromise: "Before the Limit"

  You mentioned Jeremy Butterfield. His position is likely the most comforting to a physicist. He argues against the "dichotomy" (either strict reduction or strong emergence).

  Butterfield suggests we look at the behavior **before the limit**.
  *   We don't need $N=\infty$ to have a phase transition.
  *   We just need $N$ large enough that the correlation length $\xi \ll L$ (system size) breaks down.
  *   For all practical and explanatory purposes, the finite system exhibits the "emergent" behavior *before* we take the limit.
  *   Therefore, we can have reduction (it's all finite particles) *and* emergence (novel behavior arises at large $N$) without needing the infinity to be ontologically loaded.

  This aligns with your view: the singularity is a useful mathematical proxy for the "very large but finite" behavior. Butterfield argues that philosophers like Batterman demand too much precision from the definition of "phase transition." If we define PTs by the behavior of finite systems (steep crossovers, large but finite $\xi$), reduction holds. If we define PTs strictly by non-analyticity, emergence holds, but the definition is physically idealized.

  ### Summary: Where the Substantive Disagreement Lies

  To answer your final prompt directly:

  1.  **The Substantive Disagreement:** It is not about whether infinite systems exist (no one thinks they do). It is about whether the **explanation** of finite systems' behavior *essentially requires* referencing structures (singularities, fixed points) that do not exist in the finite domain.
      *   **You (Reductionist):** The limit is a tool. The physics is in the finite system; the math is just easier at infinity.
      *   **Batterman (Emergentist):** The physics *is* the asymptotic structure. The finite system behaves as it does *because* of the singularity at infinity. The explanation transcends the finite ontology.

  2.  **Ontological Emergence Condition:** For the limit to license ontological emergence, it must be shown that the **explanatory power** of the theory resides in the limit structure itself, such that a theory restricted to finite $N$ would be not just computationally harder, but **explanatorily impotent** regarding universality and scaling. Batterman claims this is the case; you likely suspect a finite-$N$ derivation exists in principle.

  3.  **RG's Verdict:** RG does not settle the dispute because it straddles the line.
      *   It favors **Reduction** in that it derives macro from micro.
      *   It favors **Emergence** in that it demonstrates the **autonomy** of the macro-scale (insensitivity to micro-details) via the infinite limit.
      *   Most philosophers of physics now read RG as supporting a **hierarchical autonomy**: the macro-level is derivable from the micro-level, but it is *stable* and *intelligible* only at the macro-level via the limit. This is often called "weak emergence" or "asymptotic emergence."

  **Recommendation:** If you want to bridge the gap with your colleague, I suggest looking into the work of **Alexander Rueger** or **Sorin Bangu**, who critique Batterman's indispensability argument. They argue that one *can* formulate accounts of phase transitions using finite-$N$ "approximate symmetries" without invoking the actual infinity, thereby restoring the physicist's intuition that the limit is indeed just a bookkeeping device. However, Batterman would reply that "approximate symmetry" is itself a concept that only makes rigorous sense in the limit.

  The disagreement ultimately rests on whether you believe explanation requires mathematical rigor (Batterman) or physical fidelity (You).
