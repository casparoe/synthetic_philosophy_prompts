      *   **The Task:** Write a short story dramatizing this bind.
      *   **The Protagonist:** Someone forced to confront the "true" cosmic-scale picture (literal or personal).
      *   **The Constraint:** No tidy moral. The story must sit in the tension. The character's circumstances must do the arguing.
