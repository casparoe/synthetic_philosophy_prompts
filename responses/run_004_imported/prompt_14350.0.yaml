answer: |-
  **Setting:** *A cramped faculty office, late afternoon. Whiteboards are covered in half-erased payoff matrices. Two graduate students, JULIAN and ELENA, are surrounded by stacks of papers. Julian is a purist on axiomatic foundations; Elena is writing her term paper on Gauthier and social contract theory.*

  **JULIAN:** (Tapping a marker against the board) Look, I get why the TA made the connection. Gauthier's Minimax Relative Concession (MRC) and Kalai-Smorodinsky (KS) are geometrically almost identical. They both draw a line from the disagreement point to the utopia point. But just because they look the same doesn't mean KS is the *right* normative standard for a social contract.

  **ELENA:** It's not just about looking the same, Julian. It's about what the axioms imply for rational agency. If you're modeling a social contract, you're modeling how free agents agree to constraints. Nash drops Monotonicity. That means, under your solution, I can be *punished* for the feasible set expanding in my favor. That's not rationality; that's perverse.

  **JULIAN:** It's not perverse, it's consistent. Nash keeps Independence of Irrelevant Alternatives (IIA). KS drops it. I'd rather have a solution that doesn't change its mind when I remove options nobody was going to pick anyway.

  **ELENA:** "Nobody was going to pick them" is doing a lot of heavy lifting there. Let's get concrete. You know the standard counterexample to Nash Monotonicity. Let's construct it.

  **JULIAN:** Go ahead.

  **ELENA:** Imagine a bargaining problem between two firms dividing a market. Disagreement is $(0,0)$. In Scenario A, the Pareto frontier is a straight line from $(10, 0)$ to $(0, 10)$. Symmetric. Nash solution is $(5, 5)$. My max potential is 10, yours is 10.

  **JULIAN:** Standard.

  **ELENA:** Now, Scenario B. A new technology becomes available *only to me*. It doesn't change your maximum potential—you can still get at most 10. But it expands my maximum potential to 20. However, the technology is inefficient at the margins; it makes the frontier curve inward sharply near your payoff. Let's say the new frontier connects $(0, 10)$ to $(20, 0)$ but bows in significantly.

  **JULIAN:** If it bows in, you're describing a smaller set, not an expansion.

  **ELENA:** No, the *convex hull* expands. My ideal point moves from 10 to 20. Your ideal point stays at 10. So the set $S_A$ is a subset of $S_B$. By Individual Monotonicity, my payoff in the solution should not decrease. I have more leverage; I have more options.

  **JULIAN:** But in the Nash solution, your payoff *does* decrease. Because Nash maximizes the product of gains. By expanding your max to 20, you've changed the marginal rate of substitution along the frontier. The tangent point where the hyperbola touches the frontier shifts *toward* me. You might end up with 4 units instead of 5, even though your potential doubled.

  **ELENA:** Exactly! And that's absurd for a social contract. If I come to the bargaining table with a better BATNA or higher capacity, why should I agree to *less* than I would have with worse capacity? Gauthier's whole point in *Morals by Agreement* is that rational agents constrain their maximization to secure cooperation. But that constraint relies on a stable measure of concession. If expanding my capabilities shrinks my share, the rational move is to *hide* my capabilities. Nash incentivizes obfuscation.

  **JULIAN:** Or, it incentivizes you to recognize that "bargaining power" isn't just about your ceiling. It's about the trade-off structure. In your Scenario B, even though your ceiling is higher, the cost of giving you utility has become steeper for me in the relevant region. Nash captures the *intensity* of preferences, not just the bounds. KS ignores the shape of the frontier between the endpoints. It only looks at the corners.

  **ELENA:** Because the corners define the range of reasonable claims! That's the Gauthierian insight. Relative concession is $\frac{\text{Ideal} - \text{Deal}}{\text{Ideal} - \text{Disagreement}}$. To calculate that, I need my Ideal. KS preserves that ratio. Nash doesn't care about the ratio; it cares about the product.

  **JULIAN:** Let's flip it. Let's talk about IIA. This is where KS falls apart. Imagine we are in Scenario C. The feasible set is a triangle: $(0,0), (4,0), (0,2)$. Your max is 4, my max is 2. The KS solution draws a line from $(0,0)$ to $(4,2)$. Slope $1/2$. It intersects the frontier $y = 2 - 0.5x$ at... $(2, 1)$.

  **ELENA:** I'm with you.

  **JULIAN:** Okay. Now suppose we realize that the point $(4,0)$ was never actually achievable. Maybe it required a resource we don't have. We delete it. We cap your maximum at 3. The new set is the polygon $(0,0), (3,0), (3, 0.5), (0,2)$. Note that our original agreement, $(2, 1)$, is *still feasible*. It's right there on the line segment.

  **ELENA:** Right. The option we picked is still on the table.

  **JULIAN:** But under KS, the solution changes. Your ideal point drops from 4 to 3. The utopia point is now $(3, 2)$. The ray from the origin is now steeper, slope $2/3$. It intersects the frontier at roughly $(1.71, 1.14)$. I get more, you get less.

  **ELENA:** Because my bargaining range shrank.

  **JULIAN:** But the option we *actually chose* was never in danger! $(2,1)$ was feasible in the smaller set. IIA says: if you chose A when B was available, and you remove B, you should still choose A. KS violates this. It means the mere *presence* of an extreme option that neither of us wanted changes the division of the surplus. That makes the solution unstable. If I'm a contractor, I can't rely on the agreement holding if we discover some extreme, unlikely scenario was impossible all along.

  **ELENA:** But that extreme scenario *wasn't* irrelevant! In KS, and in MRC, the "Ideal Point" isn't just an option; it's a measure of your claim strength. If you claim you can get 4 units, that sets the scale of concession. If I concede to give you 2, that's 50% of your potential. If I later find out your potential was only 3, and I'm still giving you 2, I'm conceding 66% of *my* potential while you only concede 33%. The *fairness* of the deal depends on the bounds, not just the local frontier.

  **JULIAN:** Fairness is subjective. Stability is structural. If your solution depends on "phantom options"—alternatives that are Pareto-dominated and never selected—then your solution is sensitive to noise. In a real social contract, we don't know the exact utopia points. We know the local trade-offs. Nash is robust to errors in estimating the max potential, provided the local frontier is stable. KS is fragile. If I overestimate my max potential by 1%, the whole ray shifts, and the outcome changes.

  **ELENA:** Is fragility the right word? Or is it sensitivity to bargaining power? Look, think about the "gut feeling" for a rational bargainer. If I'm bargaining with you, and I discover a new technology that doubles my maximum output, but the Nash solution says I should accept a lower payoff because the curvature changed... I walk away. I don't sign the contract.

  **JULIAN:** You walk away to the disagreement point, which is zero. Nash is the only solution that can be implemented as a non-cooperative equilibrium of a specific demand game. It has strategic backing. KS doesn't. You can't easily construct a game where rational players converge on KS.

  **ELENA:** Gauthier would say that's a failure of the game, not the principle. We aren't playing a non-cooperative demand game; we're deliberating on principles of joint maximization. MRC is about finding the point where we *both* minimize our relative sacrifice. That requires knowing the relative scale of our sacrifices. That requires the Ideal Point. Dropping IIA is the price you pay for ensuring that the solution respects the *structure of claims*, not just the *structure of trade-offs*.

  **JULIAN:** But claims aren't facts. The frontier is a fact. The trade-off rate is a fact. Your "Ideal Point" is often a threat point masquerading as a possibility. If I say "I could get 100," but it costs me everything to get there, Nash says "So what? Your marginal cost is infinite." KS says "Okay, I'll treat 100 as your baseline for fairness." That invites bluffing.

  **ELENA:** And Nash invites hiding efficiency. If I know that making the frontier more concave in my favor lowers my Nash payoff, I have an incentive to appear less efficient. Both have strategic vulnerabilities. But KS aligns with the moral intuition of the social contract: we split the surplus in proportion to what we *could* have had.

  **JULIAN:** "Could have had" is the problem. In your IIA example, I "could have had" 4, but only by giving you nothing. That's not a live option for a *social* contract. It's a dictatorship point. Why should a cooperative solution be anchored by a non-cooperative extreme?

  **ELENA:** Because cooperation is about restraining the demand for that extreme. If I restrain my demand from 4 down to 2, that's a specific magnitude of restraint. If the set shrinks and my max is 3, restraining to 2 is less restraint. The *degree* of concession changes even if the absolute payoff stays the same. Gauthier's MRC is about equalizing that degree. Nash equalizes absolute gain product, which ignores the scale of the potential.

  **JULIAN:** (Pauses, erasing a corner of the board) I'll grant you that MRC has a stronger moral narrative. It feels more like "fair division." But Nash feels more like "stable agreement." If we're writing a constitution, do we want one that feels fair today but changes if we realize a law was unenforceable (violating IIA)? Or one that stays fixed as long as the chosen policy is viable, even if my theoretical max power shifts?

  **ELENA:** If the constitution changes when you realize you're more powerful than you thought, that's not instability, that's justice. If my capacity to contribute doubles, and the contract locks me into the old share because of some "independence" axiom, I revolt.

  **JULIAN:** And if the contract shifts because I removed an option I never intended to use, I sue.

  **ELENA:** (Smiles) So we're back to the seminar question. Why care more about one axiom?

  **JULIAN:** Because IIA is about consistency of choice. It's the backbone of rational preference. If you violate it, you're not really maximizing a function; you're context-dependent.

  **ELENA:** And Monotonicity is about consistency of *status*. If my position improves, my outcome shouldn't worsen. If you violate it, you're punishing improvement.

  **JULIAN:** (Puts the cap back on the marker) Maybe the real answer is that Nash describes how rational agents *do* bargain in the shadow of threats, and KS describes how they *ought* to bargain in the light of cooperation.

  **ELENA:** Or maybe Gauthier is right that rationality *just is* constrained maximization, and the "shadow of threats" model is the one missing the hat.

