  8.  **Final Polish:** Ensure the tone isn't *too* academic (since I'm pretending to be a classmate helping out), but still provides high-quality philosophical feedback. (e.g., use "I think," "Maybe consider," rather than "You must.")

  **(Self-Correction Note):** I need to make sure I don't write the essay *for* them, but guide them to improve it. The prompt asks me to "tell me" the answers to the three questions. I will answer those directly and then offer suggestions.

