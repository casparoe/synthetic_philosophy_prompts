prompt: |-
  This is going to sound niche but it's eating up my life right now. My aunt passed this spring and left me her place on the lake, so I'm suddenly a property owner and taxpayer in a tiny New England town even though I still live and vote three hours away in the city. Somehow I got roped into filling an empty seat on the town's charter review committee, and we owe the select board a recommendation in three weeks on the one issue that keeps stalling us: something like a third of the properties in town are owned by people like me who don't live here, and between us we pay around 40-45% of the property tax levy and are just as bound by the zoning and short-term-rental bylaws as full-time residents, but none of us can vote at town meeting or on the budget, because a ballot is tied to being a registered voter, which requires residency. Half the committee thinks that's just what self-government means, and that loosening it lets rich part-timers buy influence over a place they don't really live in; the other half thinks "taxed and regulated with zero say" is indefensible and wants at least a non-voting advisory seat or a weighted advisory vote on budget items. Can you draft the actual recommendation memo we need to send to the select board -- take a real position instead of "more study needed," give it a realistic timeline, and actually deal with the strongest arguement against whatever you recommend instead of just waving at it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user inherited a lake property in a tiny New England town but lives/votes elsewhere (3 hours away). They are on the Charter Review Committee.
      *   **The Issue:** Non-resident property owners (NRPOs) pay a significant portion of taxes (40-45%) and are bound by laws but have no voting rights in Town Meeting/budgets because voting requires residency.
      *   **The Conflict:** Committee is split. One side says "self-government means residents only" (fear of wealthy outsiders buying influence). The other side says "taxation without representation is indefensible" (wants advisory seat or weighted vote).
      *   **The Task:** Draft the actual recommendation memo to the Select Board.
      *   **Constraints:**
          *   Take a *real position* (no "more study needed").
          *   Include a realistic timeline.
          *   Address the strongest counter-argument directly (not just waving at it).
          *   Tone: Professional, persuasive, grounded in New England town governance norms.

  2.  **Determine the Stance:**
      *   *Option A: Full Voting Rights.* Legally difficult. Most state constitutions and town charters tie voting to residency. Changing this usually requires state legislation, which is a heavy lift and might be unconstitutional.
      *   *Option B: Status Quo.* Ignores the grievance, likely leads to continued stalemate and resentment.
      *   *Option C: Formal Advisory Role.* This is the "Goldilocks" solution. It acknowledges the contribution of NRPOs without violating the core democratic principle of "one person, one vote" based on residency. It's legally feasible within a charter review context.
      *   *Decision:* I will recommend establishing a **Non-Resident Property Owner Advisory Board (NRPO-AB)** with a mandated liaison to the Select Board and a formal right to testify on budget/zoning matters. This strikes a balance: it gives a voice without giving a vote, addressing the "buying influence" fear while acknowledging the "taxation" reality.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly up front.
      *   **Background/Context:** Briefly state the demographic reality (33% properties, 45% taxes) without getting bogged down in the user's personal story. Keep it institutional.
      *   **The Recommendation:** Define the mechanism. An Advisory Board. Not a vote, but a guaranteed seat at the table.
      *   **Rationale:** Why this? It bridges the gap. It respects residency requirements for voting but acknowledges fiscal stake.
      *   **Addressing the Counter-Argument (Crucial Step):** The prompt specifically asks to deal with the strongest argument against the recommendation.
          *   *Argument:* "This allows wealthy outsiders to dilute local control."
          *   *Rebuttal:* Advisory status *protects* local control. It channels frustration into constructive feedback rather than litigation or hostility. It doesn't grant veto power.
      *   **Implementation Timeline:** Needs to be realistic for a small town. 3 weeks is too short for implementation, but the *recommendation* is due in 3 weeks. The timeline should cover adoption to first meeting.
      *   **Conclusion:** Final wrap-up.

  4.  **Refining the Tone:**
      *   Needs to sound like a New England town document. Formal but accessible.
      *   Avoid emotional language ("unfair," "indefensible"). Use governance language ("fiscal stake," "civic engagement," "charter integrity").
      *   Acknowledge the tension without taking sides aggressively.

  5.  **Drafting - Specific Considerations:**
      *   *Legal Check:* I need to be careful not to suggest something illegal. In most states (MA, VT, NH, ME), voting in municipal elections *requires* residency. Suggesting non-resident voting is a non-starter legally. The Advisory Board is the safe, actionable path.
      *   *The "Weighted Vote" Idea:* The prompt mentions "weighted advisory vote." I should probably avoid this as it sounds messy. A formal Advisory Board is cleaner.
      *   *The Counter-Argument:* The prompt says "Half the committee thinks... loosening it lets rich part-timers buy influence." I need to explicitly address this.
      *   *Timeline:* 3 weeks until the memo is due. Implementation should be phased over the next fiscal year.

  6.  **Review against Constraints:**
      *   Real position? Yes (Advisory Board).
      *   Realistic timeline? Yes (Adoption by Select Board, first appointments by next fiscal year).
      *   Deal with strongest argument? Yes (Section on "Addressing Concerns Regarding Influence").
      *   No "more study needed"? Yes.

  7.  **Final Polish:** Check for clarity, flow, and persuasive weight. Ensure the distinction between *voting* (residency-based) and *input* (stakeholder-based) is clear. (Self-Correction: Make sure I don't sound like I'm advocating for the user personally, but for the class of NRPOs generally.)

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** The Select Board, Town of [Town Name]
  **FROM:** Charter Review Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Non-Resident Property Owner Participation in Town Governance

  ### Executive Summary

  The Charter Review Committee has spent the past six weeks examining the role of non-resident property owners (NRPOs) within our municipal framework. Currently, NRPOs constitute approximately 33% of our property parcels and contribute an estimated 40–45% of the annual property tax levy, yet they possess no formal mechanism for input at Town Meeting and no representation on municipal boards.

  After deliberation, the Committee recommends **against** amending the Charter to grant voting rights to non-residents, as this conflicts with state residency requirements for elections. However, we also find the status quo unsustainable.

  **The Committee recommends the establishment of a standing Non-Resident Property Owner Advisory Board (NRPO-AB).** This body would serve as a formal liaison to the Select Board, with a guaranteed right to present testimony on budgetary and zoning matters prior to Town Meeting. This recommendation balances the principle of resident-based self-government with the fiscal reality of our tax base.

  ### Background and Context

  Our town operates under a traditional New England Town Meeting model, where legislative authority rests with registered voters residing within the municipality. This system presupposes that those who govern are those who live with the consequences of governance daily.

  However, demographic shifts have created a divergence between legal residency and fiscal stake. A significant portion of our tax base is generated by properties owned by individuals who reside elsewhere full-time. These owners are subject to the same zoning bylaws, conservation restrictions, and short-term rental regulations as residents, and they bear a disproportionate share of the tax burden relative to their population size. Currently, their only recourse to influence town policy is through private lobbying of individual Select Board members or litigation, neither of which is transparent or efficient.

  ### The Recommendation: A Formal Advisory Mechanism

  The Committee proposes a Charter amendment or Bylaw establishment (as advised by Town Counsel) to create the NRPO-AB. The structure would be as follows:

  1.  **Composition:** Five members, elected annually by verified non-resident property owners during a designated window prior to Town Meeting.
  2.  **Authority:** The Board shall have no voting power on the Town floor. However, the Select Board shall grant the NRPO-AB Chair a standing agenda item at Select Board meetings leading up to the budget vote.
  3.  **Town Meeting Right of Voice:** The NRPO-AB Chair shall be granted the right of floor recognition at Town Meeting to speak on budget articles and zoning bylaws, distinct from the general public comment period.
  4.  **Scope:** The Advisory Board's purview is limited to fiscal appropriations, property tax assessment, and land-use/zoning regulations.

  ### Addressing the Primary Counter-Argument

  We anticipate the strongest objection to this recommendation will be the concern that **granting formal standing to non-residents dilutes the political power of full-time residents and allows wealthy outsiders to buy influence over local culture.**

  This is a valid concern regarding the integrity of our self-government. However, the Committee argues that the proposed Advisory model specifically mitigates this risk while addressing the grievance.

  *   **Advisory is not Legislative:** This recommendation explicitly preserves the "one resident, one vote" standard. NRPOs cannot vote down a budget or zone a commercial district. The final authority remains 100% with the Town Meeting.
  *   **Channeling Dissent:** Currently, NRPO frustration is channeled into informal networks or legal challenges against zoning decisions, which costs the town money and creates adversarial relationships. A formal Advisory Board brings this input into the light, subject to public scrutiny and Robert's Rules of Order.
  *   **Fiscal Responsibility:** Ignoring the perspective of those who pay nearly half the tax levy is not sound fiscal governance. While they do not live here, they have a vested financial interest in the town's solvency and property values. Their input on the *cost* of services is valuable data for residents, even if residents retain the sole right to decide on the *level* of services.

  Denying a voice does not protect resident control; it merely blinds the town to the perspectives of a major stakeholder group. Formalizing the voice ensures it is heard constructively rather than litigiously.

  ### Implementation Timeline

  To ensure this mechanism is functional for the next Fiscal Year, the Committee proposes the following timeline:

  *   **November 15, 2023:** Select Board accepts recommendation and refers language to Town Counsel for drafting.
  *   **January 2024:** Draft Bylaw/Charter language presented at public hearing.
  *   **March 2024 Town Meeting:** Article voted upon by registered voters. (Note: Residents retain the veto power on this change).
  *   **May 2024:** If passed, election of inaugural NRPO-AB members conducted via mail-in ballot to verified non-resident owners.
  *   **July 1, 2024:** NRPO-AB seated and begins liaison work during FY25 budget preparation.

  ### Conclusion

  The principle of "no taxation without representation" is foundational to American governance. While we cannot extend the franchise beyond legal residency without violating state law, we can extend courtesy, transparency, and formal channels of communication.

  This recommendation asks residents to share the microphone, but not the gavel. It acknowledges that while community life is built by those who live here year-round, community infrastructure is paid for by a broader group. We urge the Select Board to place this article on the next Town Meeting warrant.

  Respectfully submitted,

  The Charter Review Committee
  [Your Name/Town Name]
