      *(Final check on Gentzen)*: Gentzen used transfinite induction up to $\epsilon_0$. Is this system "stronger"? In terms of proof-theoretic ordinal, yes. In terms of arithmetic consequences, it's conservative over PA for arithmetic sentences? No, it proves Con(PA), which PA doesn't. So it is stronger in that sense. Marcus is right that it needs justification.

