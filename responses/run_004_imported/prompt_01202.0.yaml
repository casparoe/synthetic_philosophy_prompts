answer: |-
  **Title:** The Ghost in the Weights: A Causal-Pragmatic Defense of Neural Representation

  **Abstract:** *The debate over whether neural networks possess genuine representations often stalls between the mechanistic interpretability claim (that features are discovered) and the skeptical challenge (that features are projected). This essay argues that neural nets do have representations, but only under a causal-pragmatic definition that rejects both classical symbolic realism and eliminative instrumentalism. By synthesizing Ramsey's "Job Description Challenge" with Dennett's "Real Patterns," we can show that representations in deep learning are real, high-dimensional structures defined by their counterfactual role in generalization, not by their decodability.*

  ***

  The sloppiness you encounter in your seminar is not a pedagogical failure; it is a symptom of a category error. We are asking whether neural networks have representations using a vocabulary inherited from symbolic AI and folk psychology, while the ontology of the machine is statistical geometry. The mechanistic interpretability crowd (Olah, Anthropic) speaks as if they are archaeologists brushing dust off pre-existing statues in the weights. The skeptics (Ramsey, Hewitt & Liang) retort that these statues are merely pareidolia—patterns projected by observers onto random noise.

  To resolve this, we must take a stand: **Real, trained neural networks do possess representations, but they are not static mirrors of the world, nor are they merely convenient fictions.** They are *causal-pragmatic structures* that earn the status of "representation" only when they satisfy specific conditions of stability, intervention, and generalization. The error lies in assuming that decodability equals representation. It does not. Decodability is necessary but insufficient. Representation requires *causal efficacy*.

  The strongest argument against neural representation comes from the intersection of William Ramsey's "Job Description Challenge" and the probing literature. Ramsey argued that for a state to count as a representation, it must play a specific causal role in mediating behavior—it must be *used* by the system, not just correlated with the environment. Hewitt and Liang sharpened this by demonstrating that linear probes can extract syntactic information from randomly initialized networks or control tasks where the network has no incentive to represent that information. If a probe can find "part-of-speech" tags in a network trained only to predict the next token, does the network *represent* grammar?

  The skeptic says no: high probe accuracy proves only that the information is *recoverable*, not that it is *represented*. If the network does not use that grammatical structure to minimize its loss function, the structure is incidental, like the heat generated by a CPU. It is a byproduct, not a representation. Furthermore, the phenomenon of superposition (polysemanticity) complicates the picture. If a single direction in activation space encodes "cat" in one context and "car" in another, can we truly say there is a "cat representation"? Classical realism suggests this is a contradiction. If representation requires a one-to-one mapping between vehicle and content, superposition kills representation.

  However, this classical view is precisely what must be discarded. We should defend a **Causal-Pragmatic Realism**. A neural state represents $X$ if and only if manipulating that state systematically alters the network's behavior regarding $X$ in a way that generalizes out-of-distribution. This moves the criterion from *readout* (what an external observer can see) to *intervention* (what the system does).

  Recent work in causal mediation analysis supports this. When we intervene on specific "feature directions" identified by interpretability researchers, and the model's output shifts predictably (e.g., suppressing a "male" direction reduces gender bias in occupation prediction without breaking grammar), we have satisfied Ramsey's Job Description. The feature is doing a job. It is not merely correlated; it is constitutive of the computation. Regarding superposition: the fact that a direction is polysemantic does not mean it isn't representational; it means the representation is *compressed*. In high-dimensional spaces, efficiency requires sharing resources. A "cat-car" direction is a real representational structure if activating it reliably triggers the inference mechanisms associated with both categories depending on context. The representation is not a label; it is a coordinate in a functional manifold.

  This brings us to the metaphysical status of these structures, and whether Daniel Dennett's "Real Patterns" offers a third way or merely a trench-coated instrumentalism. Critics often dismiss Dennett as a soft-headed instrumentalist who says, "It doesn't matter if it's real, just act as if it is." This is a misreading. Dennett's claim is ontological: a pattern is real if positing it allows for *compression and prediction* that is unavailable at the lower physical level.

  If describing a network's weights as "containing a curve detector" allows us to predict its behavior on novel images better than describing the raw matrix multiplication, then the curve detector is a **Real Pattern**. It is not a fiction. It is an emergent ontological object grounded in the physical substrate but irreducible to it. This is not instrumentalism wearing a trench coat; it is a robust realism that acknowledges emergence. The "sloppiness" in your seminar arises because students treat realism as requiring reduction (the representation must be identical to a specific weight) and instrumentalism as denying existence (the representation is just a metaphor). Dennett allows us to say: The representation is real *because* the metaphor works better than the physics.

  However, we must guard against the "anything goes" version of this view. Not every pattern we project is real. A "Real Pattern" must support counterfactuals. If I claim there is a "justice representation" in a transformer, I must be able to say: "If I perturb this vector, the model's judgment on fairness cases changes, holding other variables constant." If the pattern does not support intervention, it is merely a Rorschach test. The probing literature fails this test because probes often find information the model does not *use*. The mechanistic interpretability crowd succeeds when they demonstrate circuits that, when ablated, break specific capabilities.

  Therefore, the answer to your seminar question is this: Neural networks have representations, but they are not the kind of representations that fit into a sentence. They are distributed, context-sensitive, causal levers. To call them "representations" is not to borrow intentional vocabulary for convenience; it is to acknowledge that at a certain level of abstraction, the only way to predict the system's behavior is to attribute content to its states.

  **For Your Slides:**

  > "Decodability is not representation. Just because an external observer can read a message from the weights does not mean the network wrote it. A neural state earns the title of 'representation' only when it satisfies Ramsey's Job Description: it must be causally efficacious in the system's own computation. However, this does not reduce us to instrumentalism. Following Dennett, these representations are 'Real Patterns': ontologically robust structures that emerge from the weights because positing them offers predictive compression that the raw physics cannot match. We are not projecting ghosts into the machine; we are identifying the causal joints by which the machine cuts the world."

  **The Bottom Line:**
  Stop asking if the representation is "in" the weights like a file on a hard drive. Start asking if the structure in the weights plays a causal role in generalization that warrants the intentional stance. If the answer is yes (and for modern LLMs, it increasingly is), then the representation is as real as the center of gravity of a chair—abstract, relational, but indispensable for explaining why the chair doesn't fall over.
