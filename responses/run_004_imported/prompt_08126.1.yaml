  Here is a new case designed to bypass the standard "Artifact vs. Matter" and "Organism vs. Body" intuitions, pushing the Grounding Problem into the domain of **Historical Essentialism** within geology/paleontology.

  ### The Case: The Fossil and The Rock

  **The Setup:**
  Imagine a specific, localized mineral formation in a sedimentary bed. Let's call it *Specimen-X*. It is a calcified structure that perfectly resembles an ammonite shell.

  **The Two Objects:**
  1.  **The Rock (The "Clay" Role):** This is the mereological aggregate of calcium carbonate molecules and trace minerals occupying this specific spatial region. Let's call it *Aggregate-C*.
  2.  **The Fossil (The "Statue" Role):** This is the paleontological entity, the preserved remains of an ancient organism. Let's call it *Fossil-F*.

  **Coincidence:**
  *   **Same Matter:** *Fossil-F* is constituted entirely by *Aggregate-C*. There is no extra "fossil stuff."
  *   **Same Location:** They occupy the exact same spatial coordinates.
  *   **Same Parts:** Every molecule that is part of the Fossil is part of the Rock, and vice versa.
  *   **Same Causal Powers (While Coincident):** While they exist together, they exert identical physical forces. They have the same mass, hardness, density, and chemical reactivity. If you strike them with a hammer, they shatter identically. If you weigh them, the scale reads the same. They cause the same shadows, displace the same air, and erode at the same rate.

  **The Modal Divergence (Leibniz's Law Trigger):**
  *   **Origin Essentialism:** *Fossil-F* has its biological origin essentially. It is a *Fossil* only if it was once part of a living organism that underwent permineralization. *Aggregate-C* has no such constraint; it is just a collection of minerals.
  *   **The Scenario:** Suppose a geologist discovers that *Specimen-X* is actually a **pseudofossil** (a *concretion*). It looks exactly like an ammonite, has the same chemical composition, and occupies the same space, but it was formed purely by inorganic mineral precipitation, never having been part of a living creature.
  *   **The Result:**
      *   *Aggregate-C* (The Rock) continues to exist happily. It was always just a rock.
      *   *Fossil-F* (The Fossil) **ceases to exist** (or rather, never existed). You cannot "fix" a pseudofossil into a fossil by polishing it; its identity conditions are violated by its history.
      *   Conversely, if we took *Aggregate-C* and ground it into dust, *Aggregate-C* (as a scattered aggregate) might persist (depending on your mereology), but *Fossil-F* would certainly cease.

  **The Grounding Problem:**
  At any given time slice *t* (before the discovery of its true origin), *Fossil-F* and *Aggregate-C* are **intrinsically indiscernible**.
  *   They share all microphysical properties.
  *   They share all current causal powers.
  *   They share all spatial properties.

  The only difference is a **historical/relational property** (past biological origin).
  *   **The Challenge:** How can a purely historical fact, which leaves no intrinsic physical trace distinguishable from a pseudofossil at time *t*, ground the existence of a *distinct object* with different persistence conditions?
  *   If identity is intrinsic, how can two things be distinct here-and-now based entirely on a fact about the past that is not currently manifest in their physical structure?
  *   If you say "The sortal concept grounds it," you risk conceptualism (objects depend on minds).
  *   If you say "The history grounds it," you must explain how a past event ontologically sustains a present object's identity conditions without a present physical difference.

  ---

  ### Role Assignment
  *   **The "Clay":** *Aggregate-C* (The Mineral Aggregate). It is the persistent physical substrate. It cares only about matter and arrangement.
  *   **The "Statue":** *Fossil-F* (The Fossil). It is the historically individuated entity. It cares about origin and kind.

  ---

  ### Honest Evaluation: Improvement or Relocation?

  **Does it solve the problem?**
  No. Metaphysical puzzles regarding material constitution are rarely "solved" by new examples; they are clarified. This case does not dissolve the tension between Leibniz's Law and Coincidence.

  **Does it improve on the classics?**
  Yes, in three specific ways:
  1.  **Removes Intentionality:** The Statue/Clay case is often contaminated by debates about artistic intention (is it a statue if the artist didn't finish it?). The Fossil is natural. Its "status" is not conferred by a human mind (unlike a Statue or a Dollar Bill), but by natural history. This isolates the *ontological* question from the *institutional* one.
  2.  **Removes Biological Vitalism:** The Person/Body and Cat/Tibbles cases invite dualist intuitions or confusion about "life forces." The Fossil is dead matter. It forces the debate to remain strictly within physicalism while still demanding distinct persistence conditions.
  3.  **Sharpens the Grounding Problem:** In the Statue case, one might argue the "shape" grounds the statue. In the Fossil case, the shape is identical to the rock's shape. The difference is *purely historical*. This makes the Grounding Problem harder: it's not just "how does form ground identity?" but "how does *history* ground identity?"

  **Does it just relocate the intuition pump?**
  Yes, inevitably.
  *   **The "Pseudofossil" Objection:** Skeptics will argue that "Fossil" is just a classification we apply to Rocks. They will say *Fossil-F* is not a real object, just a Rock *described as* a fossil. This is the same "Eliminativist" move used against the Statue.
  *   **The "Time-Slice" Objection:** Four-dimensionalists will say the Fossil and the Rock are just different temporal stages of a single spacetime worm. This is the same "Perdurantist" move used against the Clay.

  **Verdict for your Reading Group:**
  This case is valuable because it strips away the "human interest" variables (art, life, law) that often allow participants to hide behind functional definitions. It forces them to confront whether **history alone** can individuate objects that are currently physically identical. If they say "Yes," they must explain the grounding of historical properties. If they say "No," they must explain away the intuition that a pseudofossil is a *different kind of thing* than a fossil, even if they look the same.

  It prevents the "canned answer" because they haven't memorized the *Fossil/Rock* literature, but it tests the exact same metaphysical muscles as Wiggins and Gibbard.
