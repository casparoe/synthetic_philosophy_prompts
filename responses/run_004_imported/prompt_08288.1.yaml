  ### TA-to-TA Note:
  You caught the right one. The student has swapped Hart and Fuller's sociological diagnoses in the second paragraph of their answer.

  *   **The Student Claims:** Hart thinks positivism made it easy for judges to go along with the regime.
  *   **The Text:** **Fuller** argues that "law is law" positivism blinded German judges. **Hart** argues that if they had been positivists, they would have admitted the statute was valid but refused to apply it on moral grounds (the "separation" allows for moral criticism).

  Because this is a take-home worth 100 points in a seminar, that reversal is too big to ignore, even though the Fuller section is quite good. The grade reflects that they understand Fuller and the facts, but fundamentally missed Hart's specific argument in this exchange.
