          *   *Critique:* If "unsaturated" is just a label for "needs gluing," have we explained the glue? Wittgenstein (Tractatus) famously critiqued Frege here. Saying a function is unsaturated is like saying a hook needs a ring. But why does the hook *hold* the ring? Is there a metaphysical glue between the unsaturated and the saturated? If yes, regress returns. If no, it's magic.
