  2.  **Deconstruct the Philosophical Problem:**
      *   **The Problem:** Unity of the Proposition / Bradley's Regress.
      *   **Bradley's Regress:** If a fact is $aRb$, we need a relation $R$ to connect $a$ and $b$. But then we need a relation $R'$ to connect $a$ to $R$, and $R$ to $b$, and so on ad infinitum. The proposition/fact never gets "glued" together; it remains a heap.
      *   **Frege's Solution:** Concepts (predicates) are *unsaturated* (ungesättigt). Objects are *saturated*. The unsaturatedness *is* the glue. No extra relation is needed because the concept *demands* completion.
      *   **Russell's Early Solution (Principia/PM era):** Relations are real constituents of facts. In a fact, the relation *actually relates*. There is a distinction between a relation as a term (in a list) and a relation as relating (in a fact). This is often called the "multiple relation theory of judgment" later, but early on, it's about the ontological status of the relation in the complex.

  3.  **Evaluate the Comparison (Frege vs. Russell):**
      *   *Frege:* The glue is internal to the nature of the concept. It's categorial. You can't treat the predicate as an object without category mistakes.
