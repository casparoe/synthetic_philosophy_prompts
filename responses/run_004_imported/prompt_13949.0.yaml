      *   *For the Novel:* The narrator should probably lean towards Frege initially (the elegance of unsaturatedness) but realize by the end that it requires a metaphysical commitment (entities that are inherently incomplete) that is just as mysterious as the regress itself. Or, she champions Russell, only to be crushed by Wittgenstein/Bradley.
