      *   *The Deep Disagreement:* Frege thinks the problem arises from treating the predicate as an object (a name). Russell thinks the problem arises from failing to distinguish the relation *in use* vs. the relation *mentioned*.
      *   *Stripping away logic:* Both are trying to say "There is a fundamental asymmetry between things and how they combine." Frege locates it in semantic type (function/argument). Russell locates it in ontological status (constituent/structuring principle).

