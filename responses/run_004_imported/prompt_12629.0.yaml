      *   Dynamic consistency pressed hard? (Checked).
      *   Strong reply from B? (Checked - REU/Global planning).
      *   No tidy concession? (Checked).

  *(Self-Correction during final review)*: I need to make sure Marcus doesn't just say "I plan ahead." He needs to explain why the Independence Axiom is the culprit. The Independence Axiom says if you prefer X to Y, you should prefer pX + (1-p)Z to pY + (1-p)Z. Marcus argues Z (the common consequence) changes the *risk profile*, not just the expected value.

