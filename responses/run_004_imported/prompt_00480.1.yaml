answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late afternoon. Two colleagues, ELENA (a teleosemanticist) and MARCUS (a causal-informational theorist), are finishing coffee. Both know your work on anuran vision well.*

  **Marcus:** I've been re-reading your latest paper on signal-to-noise ratios in *Rana pipiens*. It's excellent work. But you know, every time I look at those retinal ganglion cell recordings, I'm reminded of why I can't sign onto the teleosemantic project. You measure the response to a black dot on a white background. You measure the response to a moving square. The frog snaps. But when you put a stationary fly in front of it, nothing. The system is tuned to "small, dark, moving thing." Yet Millikan insists the content is *Fly*. I just don't see how the history of selection bridges that gap.

  **Elena:** It bridges the gap by introducing norms, Marcus. That's the whole point. If you look purely at the causal covariation—the informational link—you get exactly what you described: a correlation with small, dark, moving things. That includes flies, but it also includes BB pellets, shadows, and debris. If content is just causal correlation, the content is the disjunction: *Fly-or-BB-or-Shadow*. That's the disjunction problem. Teleosemantics solves it by saying the mechanism has a *proper function*. It was selected for catching flies. When it fires at a BB, it is malfunctioning. The content is *Fly* because *Fly* is what explains the mechanism's presence in the genome.

  **Marcus:** But does it? That's the crux. Natural selection is blind to semantics; it sees only fitness consequences. Selection favored frogs that snapped at small, dark, moving things *because*, in the frog's evolutionary environment, those things were predominantly flies. But selection doesn't carve the world at the joints of "Fly." It carves at "Nutritious Prey." If BB pellets had been nutritious and abundant in the EEA (Environment of Evolutionary Adaptedness), and flies had been toxic, the exact same neural mechanism would have been selected. So, why isn't the content *Nutritious Small Moving Thing*? Or even more coarsely, *Thing That Increases Fitness When Snapped At*? The selection history underdetermines the intentional object.

  **Elena:** You're conflating the *condition of success* with the *content*. Yes, the ultimate cash value is nutrition. But the representational state isn't tracking the nutrition directly; it's tracking the *sign* of the nutrition that the system was designed to detect. Think about the consumer side. The tongue-snapping mechanism consumes the neural signal. It is designed to operate under the condition that there is a fly. If there is a BB, the consumer is being fed false data. The proper function of the producer (the retina) is to indicate flies, not because flies are magic, but because the consumer's proper function is to catch flies. The coupling fixes the content.

  **Marcus:** But the consumer doesn't care about "flies" as a natural kind. The consumer cares about *mechanical contact with a mass*. The downstream motor neurons just need to trigger a ballistic projection of the tongue. If a BB provides the mass, the consumer is satisfied. The system works. So, from the perspective of the causal chain, there is no error. You're importing the error from the outside, from *our* knowledge that BBs aren't food. But the frog's system doesn't know that. If the content is fixed by what the system *does*, then when it snaps at a BB, it's doing exactly what the causal structure dictates. You're saying, "No, it *ought* to have been a fly." But where does that 'ought' come from if not from our external classification?

  **Elena:** The 'ought' comes from the history of replication. A heart ought to pump blood even if it's currently pumping air, because its ancestors pumped blood and that's why it's here. Similarly, the bug-detector ought to fire for flies. The fact that it can be fooled by a BB is a limitation of the mechanism's resolution, not a shift in its content. If I build a thermometer to measure temperature, and I put it next to a fire that heats the bulb via radiation rather than conduction, it might give a reading. But if it was calibrated for conduction, the reading is erroneous. The frog's visual system is a biological instrument calibrated by selection for a specific ecological niche. In that niche, *small dark moving thing* and *fly* were co-extensive. But the *function* was to track the fly.

  **Marcus:** Co-extensive in the past, yes. But that's the problem of indeterminacy again. Why privilege the extension "Fly" over the extension "Small Dark Moving Thing"? Both were co-extensive in the past. Selection cannot distinguish between them because they covaried perfectly in the relevant history. To say it selected for "Fly" is a story we tell retrospectively. If you ask the selection process, "Did you pick the mechanism because it tracked Flies or because it tracked Small Dark Moving Things?" the process has no answer. It just picked the mechanism that resulted in snaps. Since snaps resulted from both (potentially), the content remains indeterminate between the specific biological kind and the phenomenological description.

  **Elena:** It's not indeterminate because the explanation for the mechanism's stability relies on the *biological kind*. If the environment had been full of small dark moving things that were *not* nutritious—say, toxic beetles that looked like flies—the mechanism would have been selected *against*. The selection pressure wasn't just for *snapping*; it was for *survival via nutrition*. The content is fixed by the conditions under which the mechanism contributed to fitness. Since BBs don't contribute to fitness, they aren't part of the content conditions. They are noise. The disjunction is broken because one side of the disjunction (BB) has no historical track record of reinforcing the trait.

  **Marcus:** But that makes content dependent on *actual* consequences rather than *intentional* accuracy. Suppose a frog snaps at a BB, misses, and survives. Or suppose a frog snaps at a fly, misses, and starves. The link between the representation and the fitness outcome is probabilistic. If the content is *Fly*, the representation is false when a BB is present. But if the system is merely a causal transducer, it's just a state caused by BBs and Flies. You need the history to generate the norm, but the history is too coarse-grained to generate the *specific* norm you want. You want "Fly." The history gives you "Thing that historically caused snaps and resulted in survival." That could be "Fly," but it could also be "High-contrast stimulus." You haven't silenced the disjunction; you've just pushed it back into the evolutionary record.

  **Elena:** I think you're demanding a level of precision from selection that biology doesn't need, and then claiming that lack of precision undermines semantics. But semantics doesn't need to be perfect to be determinate. The content is determinate enough to ground truth conditions. When the frog snaps at a BB, we can say truly: "The frog thought there was a fly." We can't say: "The frog thought there was a fly-or-BB." Because if it thought it was a fly-or-BB, snapping at a BB would be a success, not a failure. But it *is* a failure biologically. The frog wastes energy. The metabolic cost of the snap is an error cost. That cost only makes sense if the content was specific.

  **Marcus:** The metabolic cost is real, yes. But does that cost prove the content was *Fly*? Or does it prove the content was *Snap-Worthy-Stimulus*? The frog wastes energy because it snapped at something that didn't nourish it. That's a failure of *outcome*, not necessarily a failure of *representation*. If the representation is "There is a snap-worthy stimulus," and there *is* a stimulus that triggers the snap mechanism, the representation is true. The failure is in the *world's* failure to provide nutrition, not in the *mind's* failure to represent. You're assuming the representation promises nutrition. I'm saying the representation only promises a trigger condition. The rest is causal luck.

  **Elena:** But then you lose the ability to explain behavior in terms of belief and desire. If the frog desires food, and believes there is a snap-worthy stimulus, but snap-worthy stimuli aren't always food, the explanation of the action becomes opaque. We explain the snap by saying the frog took the dot *for* a fly. That "taking for" is the intentional relation. Teleosemantics grounds that "taking for" in the normative history. Without it, you have a causal chain, but you don't have *aboutness*. You have a system that reacts, not a system that represents.

  **Marcus:** And I'm willing to bite that bullet. Maybe there isn't "aboutness" in the way you want. Maybe there are just causal couplings with varying degrees of reliability. The "disjunction problem" isn't a problem to be solved; it's a feature of natural systems. They are ambiguous. The frog's system is ambiguous between "Fly" and "Dark Dot." To force it to be one or the other is to impose a human linguistic structure on a biological transducer. You want the frog to have a proposition: <Fly>. I say the frog has a signal: <Trigger>. The history explains why the trigger exists, but it doesn't turn the trigger into a proposition with a truth condition that excludes BBs.

  **Elena:** If you deny the truth condition, you deny the possibility of error. And if you deny the possibility of error, you deny the possibility of knowledge. If the BB triggers the state, and the state means "Trigger," then the frog is never wrong. It's an infallible machine. But biological systems are fallible. They misrepresent. That misrepresentation is the hallmark of the mental. Teleosemantics is the only game in town that naturalizes that normativity without invoking a homunculus.

  **Marcus:** Or, it's a theory that projects normativity onto causal processes because we can't bear the idea of a mindless universe. The frog doesn't make a mistake, Elena. The frog just snaps. The *mistake* is in our expectation that the snap should yield a fly. We are the ones with the teleology. The frog is just a bundle of signal detection probabilities, shaped by past reinforcement, operating in a present causal field. The "Fly" is in the eye of the beholder—the theorist—not in the retina of the anuran.

  **Elena:** Then we are at an impasse. You see a causal chain where I see a normative function. You see a transducer; I see a representation.

  **Marcus:** Precisely. And until we can agree on whether "function" is a real property of the biology or a heuristic we impose on it, the frog will keep snapping at BBs, and we will keep disagreeing on what it thinks it's eating.

  **Elena:** *(Smiling)* Well, at least we agree on the data. The snap is real, even if the content isn't.

  **Marcus:** I'll drink to that.
