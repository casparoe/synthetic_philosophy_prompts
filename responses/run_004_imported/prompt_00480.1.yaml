      *   **Causal-Informational (Fodor/Dretske-ish):** Content is determined by causal covariation under optimal conditions. The problem is: What are the optimal conditions? If the frog snaps at BBs, doesn't that mean the content is "Fly or BB"? Selection history doesn't help because selection selects for the *effect* (survival/reproduction), and the mechanism only needs to correlate with the effect. If BBs were nutritious, the mechanism would work. The link between the specific intentional object (Fly) and the survival value is contingent.

  3.  **Drafting - Section by Section:**

