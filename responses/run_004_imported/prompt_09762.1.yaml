answer: |-
  This is a superb question that cuts to the heart of the Cambridge Platonist and Voluntarist influences on Newton. You are right to be skeptical of simplistic causal claims (e.g., "Newton invented absolute space *because* he was an Arian"). However, there is a deep structural coherence between his theology and his physics. They are not merely adjacent interests; they are mutually reinforcing parts of a single worldview.

  To make the connection intuitive, we need to look at the specific problem Newton was trying to solve regarding **Divine Presence** and **Divine Will**, and how Descartes' physics made those theological commitments impossible to maintain.

  Here is the intuitive bridge between his Anti-Trinitarian Voluntarism and Absolute Space.

  ### 1. The Cartesian Trap: Matter as Extension
  To understand Newton's move, we must first feel the constraint of Descartes. For Descartes, the essence of matter is *extension* (taking up space). Therefore, space and matter are identical. There can be no vacuum (void), because a "void" would be extension without matter, which is a contradiction in terms.

  For a physicist, this creates a mechanical universe of contact action (vortices). But for a theologian, this creates a crisis of **Omnipresence**.

  If Space = Matter, then:
  1.  **God is excluded from Space:** If God is Spirit, and Space is Material, God cannot be present in space without being material (which is heresy).
  2.  **God is excluded from Action:** If all action requires contact (because there is no void), God cannot act upon the world without being a physical body pushing things around.

  Newton found this theologically intolerable. God must be truly present everywhere (*omnipresent*) and must be able to act everywhere without being material.

  ### 2. The Voluntarist Solution: Space as an Emanation
  Newton was a theological voluntarist. He believed that the world exists not because of logical necessity (as Spinoza or Descartes might imply), but because **God willed it so**. God's will is supreme and unconstrained by the "essence" of things.

  If God's will is supreme, He could have created matter *or* He could have created space. They do not have to be the same thing.
  *   **Newton's Move:** He decouples Extension from Matter.
  *   **The Result:** Absolute Space exists independently of bodies. It is real (it has geometric properties), but it is not material (it offers no resistance).

  **The Theological Payoff:** This creates a "container" that is immaterial but real. God can be present in this Absolute Space without being material. Newton famously calls space the "sensorium of God." While he later qualified this (to avoid implying God has physical organs), the intuition is that Space is the medium through which the Divine Mind perceives and interacts with creation.

  ### 3. Where the Trinity Dispute Enters: Dominion vs. Essence
  This is the specific gap you asked about. Why does being an **Anti-Trinitarian** matter here? Why not just a generic Christian?

  The orthodox doctrine of the Trinity defines God largely by His **internal essence** (the relations between Father, Son, and Spirit). Newton's Arian/Unitarian theology defines God largely by His **external Dominion** (the Father as the Supreme Monarch over all creation, including the Logos).

  In the *General Scholium*, Newton writes: *"He is not eternity and infinity, but eternal and infinite; He is not duration or space, but he endures and is present."*

  *   **Trinitarian/Orthodox emphasis:** God is defined by who He is internally.
  *   **Newton's Arian emphasis:** God is defined by His **Authority** and **Will**.

  If God is primarily a Sovereign Monarch (as Newton's anti-Trinitarianism suggests), the Universe is not a self-sustaining machine (Descartes); it is a **Kingdom**. A Kingdom requires a King who is distinct from his subjects, yet present in his realm to exercise dominion.

  *   **Descartes' Universe:** A machine that runs by the necessity of its own geometry. God is the initial engineer, but the physics is autonomous.
  *   **Newton's Universe:** A Kingdom sustained by the continuous will of the Monarch.

  **The Connection:**
  If the Universe is a Kingdom governed by Will, there must be a "realm" that exists to be governed. Absolute Space and Time are the eternal, infinite attributes of God's existence that provide the stage for His Dominion. They are not created things (like matter); they are consequences of God's own existence.
  *   Because God is Eternal, Absolute Time flows.
  *   Because God is Omnipresent, Absolute Space extends.

  If Newton had accepted the Trinity in the orthodox sense, the emphasis might have remained on the internal relations of the Godhead. By focusing on the **Father as Pantokrator (All-Ruler)**, Newton needed a physics that reflected a universe constantly subject to that Rule. Absolute Space ensures that the "realm" of God is always there, regardless of whether matter exists within it. It secures the independence of the Creator from the Creation.

  ### 4. Gravity as the "Spirit" in the Machine
  This theological framework explains why Newton was comfortable with **Action at a Distance** (Gravity), which he admitted was philosophically absurd mechanically.

  For Descartes, action at a distance is impossible because matter is inert extension. For Newton, gravity is evidence that the world is not just inert matter. There is an active principle.
  *   **Voluntarist view:** God sustains the system by Will. Gravity is the mathematical description of how God's will acts upon matter through the medium of Absolute Space.
  *   **Anti-Trinitarian view:** The Son (Logos) is often viewed by Newton as the divine Viceroy or agent who executes the Father's will in creation. Gravity can be seen as the physical manifestation of this divine agency moving through the "sensorium" of space.

  ### 5. Summary: The Intuitive Link
  To visualize the connection, imagine the difference between a **Clock** and a **Court**.

  *   **Descartes (Trinitarian/Orthodox leaning):** The universe is a Clock. The gears (matter) are defined by their shape (extension). Once wound, it runs by necessity. Space is just the gears themselves.
  *   **Newton (Arian/Voluntarist):** The universe is a Court. The King (God) sits on the throne. The Court (Absolute Space) exists because the King is there. The Courtiers (Matter) move within the Court according to the King's decrees (Laws of Motion/Gravity).

  If you remove the distinction between the Court and the Courtiers (Descartes), you lose the King's distinct presence. You cannot have a Sovereign ruling a Kingdom if the Kingdom is just the sum of the subjects.

  **Therefore:**
  1.  **Anti-Trinitarianism** emphasizes God as a Single Supreme Will/Monarch rather than a complex Essence.
  2.  **Voluntarism** insists the world depends on His Will, not logical necessity.
  3.  **Absolute Space** provides the immaterial "Kingdom" where this Will operates, distinct from the material "Subjects."
  4.  **The Sensorium** is the interface where the Monarch perceives and acts upon the Kingdom without becoming material Himself.

  Newton's physics was not *derived* from his heresy, but his heresy made his physics **intelligible** to him. It allowed him to posit a universe that was mathematically deterministic in its operations (the Laws) but ontologically dependent on a Sovereign Will (Absolute Space/Gravity), preserving the "Dominion" he felt was the true definition of God.

  He needed space to be real but not material so that God could be present but not physical. He needed space to be absolute so that God's presence was not dependent on the arrangement of matter. This safeguards the Arian/Voluntarist God: The Supreme Governor of a real, distinct, and dependent creation.
