          1.  **Example:** The "Dial of Doubt" (Metaphorical). A subject adjusting their credence/justification based on accumulating minor defeaters.
          2.  **Task 1:** Condition = "Being Justified." Show it's not luminous.
          3.  **Task 2:** Condition = "Knowing." Show KK implies it *would* be luminous. Contradiction.

      *   *Wait, "Being Justified" isn't the best luminous candidate.* "Feeling Cold" is the classic luminous candidate. "Knowing" is the target.
      *   I'll stick to **"Being in a Position to Know"** or **"Having Sufficient Evidence"** for Task 1.
      *   Actually, let's use **"Being Certain"** (Psychological state) for Task 1. It's the closest analogue to "Feeling Cold" but cognitive.
      *   Then **"Knowing"** for Task 2.
      *   This highlights the difference between the psychological state (which fails luminosity) and the epistemic state (which fails luminosity *and* kills KK).

      *   *Okay, ready to write.*
answer: |-
  This is a classic pedagogical bottleneck. Students grasp the *Sorites-style* mechanics of the argument (the chain, the margin for error) but treat it as a localized attack on phenomenal concepts (like "feeling cold") rather than a structural constraint on *knowledge itself*. They miss that Williamson's target isn't just "sensations aren't luminous," but "nothing non-trivial is luminous," and since KK entails that *knowledge* is luminous, KK must go.

  Here is a two-part resource designed for your seminar. Part 1 provides a fresh, non-perceptual example of the anti-luminosity structure. Part 2 explicitly maps that structure onto the KK principle to show the contradiction.

  ---

  ### Part 1: A Fresh Anti-Luminosity Example
  **The Domain:** Epistemic Confidence in Long-Form Calculation (Non-Perceptual)

  To break the "temperature/perception" template, we move to a cognitive domain where the "stimulus" is internal cognitive load, and the "discrimination" is metacognitive.

  **The Scenario:**
  Imagine a subject, S, performing a massive, multi-step arithmetic calculation (e.g., verifying a long proof or adding a column of 10,000 figures). S is tasked with monitoring their own cognitive state.

  **The Condition ($C$):** "Being in a state of **unshakable certainty** that the current step is correct."
  *(Note: We treat this as a candidate for luminosity. It seems like if you have this feeling, you should know you have it.)*

  **The Series ($\alpha_0$ to $\alpha_n$):**
  *   **Case $\alpha_0$ (Start):** S is fresh, focused, and on step 1. The cognitive load is negligible. $C$ clearly holds (S is unshakably certain).
  *   **Case $\alpha_n$ (End):** S is exhausted, cognitively depleted, on step 10,000. Mental fatigue has set in. $C$ clearly fails (S is hesitant, unsure).
  *   **The Chain:** A sequence of 10,000 cases, where each case $\alpha_i$ represents the completion of step $i$.

  **The Indiscriminability Relation:**
  For any adjacent cases $\alpha_i$ and $\alpha_{i+1}$, the transition is phenomenally indiscriminable to S.
  *   *Why?* The increase in cognitive fatigue between step 500 and step 501 is too minute to be detected introspectively. S's internal "feeling of certainty" at $\alpha_i$ is indistinguishable from that at $\alpha_{i+1}$.

  **The Margin for Error Principle:**
  If S knows that $C$ obtains at $\alpha_i$, then $C$ must obtain at $\alpha_{i+1}$.
  *   *Rationale:* Knowledge requires safety. If S claims to *know* they are certain at $\alpha_i$, but $C$ failed at $\alpha_{i+1}$ (which S can't tell apart from $\alpha_i$), then S's belief at $\alpha_i$ could easily have been false. Thus, it wouldn't be knowledge.

  **The Derivation:**
  1.  Assume $C$ is luminous (If $C$ holds, S knows $C$ holds).
  2.  At $\alpha_0$, $C$ holds. So, S knows $C$ holds at $\alpha_0$.
  3.  By Margin for Error: If S knows $C$ at $\alpha_0$, $C$ must hold at $\alpha_1$.
  4.  If $C$ holds at $\alpha_1$, S knows $C$ at $\alpha_1$ (Luminosity).
  5.  By Margin for Error: If S knows $C$ at $\alpha_1$, $C$ must hold at $\alpha_2$.
  6.  ... (Induction) ...
  7.  Therefore, $C$ must hold at $\alpha_n$.
  8.  **Contradiction:** We stipulated that at $\alpha_n$ (exhaustion), $C$ does *not* hold.
  9.  **Conclusion:** $C$ ("Being unshakably certain") is not luminous.

  ---

  ### Part 2: From Anti-Luminosity to the Failure of KK

  This is the slide you need to make the connection explicit. The goal is to show that **KK entails the luminosity of knowledge.** If the anti-luminosity argument proves *nothing* is luminous (including knowledge), KK must be false.

  **The Move:**
  We run the *exact same structural argument* as above, but we swap the Condition $C$.

  **The New Condition ($C^*$):** " **Knowing** that the current step is correct."
  *(Let $p$ = "The current step is correct." So $C^* = Kp$.)*

  **The Series:**
  *   **Case $\alpha_0$:** S is fresh, reliable, and correct. $Kp$ holds.
  *   **Case $\alpha_n$:** S is exhausted, unreliable (making errors), or the environment is noisy. $Kp$ fails.
  *   **Indiscriminability:** S cannot introspectively distinguish the epistemic quality of step $i$ from step $i+1$. (S feels the same about their reliability).

  **The Argument Against KK:**

  | Step | Logical Move | Explanation |
  | :--- | :--- | :--- |
  | **1** | **Assume KK is True.** | Assume: If $Kp$, then $KKp$. |
  | **2** | **KK implies Luminosity of Knowledge.** | If $Kp$ is true, then (by KK) $KKp$ is true. This means whenever the condition "Knowing $p$" obtains, the subject is in a position to know it obtains. **This is the definition of Luminosity for the condition $Kp$.** |
  | **3** | **Apply Margin for Error to $Kp$.** | Since cases $\alpha_i$ and $\alpha_{i+1}$ are indiscriminable, S cannot safely claim to *know* they know $p$ at $\alpha_i$ unless they actually know $p$ at $\alpha_{i+1}$. (Belief must be safe across indiscriminable cases). |
  | **4** | **Run the Induction.** | If S knows $p$ at $\alpha_0$, then (by KK) S knows they know $p$ at $\alpha_0$. By Margin for Error, S must know $p$ at $\alpha_1$. Repeat... S must know $p$ at $\alpha_n$. |
  | **5** | **Identify Contradiction.** | We stipulated that at $\alpha_n$ (exhaustion/unreliability), S does **not** know $p$. |
  | **6** | **Conclusion.** | The assumption (KK) leads to a contradiction. **Therefore, KK is false.** |

  **Classroom Discussion Point:**
  Point out to your students that the only difference between Part 1 and Part 2 is the *label* on the condition.
  *   In Part 1, we showed "Certainty" isn't luminous.
  *   In Part 2, we show "Knowledge" isn't luminous.
  *   **The Kicker:** If KK were true, "Knowledge" *would have to be* luminous. Since the Anti-Luminosity argument proves Knowledge *cannot* be luminous (due to the margin for error required by safety), KK cannot be true.

  **Visual Aid Suggestion:**
  Draw two parallel tracks on the board.
  *   **Track A (Feeling):** "Feeling Certain" $\to$ Fails Luminosity $\to$ No problem for KK (yet).
  *   **Track B (Fact):** "Knowing $p$" $\to$ Fails Luminosity $\to$ **Fatal for KK** (because KK requires Track B to succeed).

  This makes it clear that the Anti-Luminosity argument isn't just about "feelings"; it's a general constraint on safety and indiscriminability that applies to *knowledge states* just as much as *sensory states*. Since KK tries to exempt knowledge states from this constraint, KK fails.
