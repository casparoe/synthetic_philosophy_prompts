answer: |-
  This is a fantastic catch. You have identified one of the central tensions in legal theory (textualism vs. purposivism), and you are right to wonder if Douglass is sliding between definitions to win his argument.

  However, for your seminar, the strongest reading is that **Douglass is being consistent, but he is making a crucial distinction between *historical intention* and *legal construction*.**

  Here is how to untangle the two moves so you can walk into discussion section ready to explain why these aren't contradictory.

  ### 1. The Distinction: "Secret Motives" vs. "Rules of Construction"

  The key to resolving the tension is identifying *where* Douglass says meaning comes from in each passage.

  **In Passage 1 (Rejecting Intent):**
  Douglass is arguing against **historical/psychological intentionalism.**
  *   **The Context:** The Garrisonians (William Lloyd Garrison) argued the Constitution was pro-slavery because the *men* who wrote it were compromised. They looked at diaries, closed-door debates, and the biographies of the framers to prove the "secret motives" were to protect slavery.
  *   **Douglass's Point:** He is saying, "Stop looking inside the heads of dead men." The law is not what Madison *thought* in his heart; the law is what the text *says* on the paper.
  *   **Why?** Because relying on "secret motives" makes the law unstable ("endless confusion"). You can't govern a country based on speculation about what Jefferson was feeling in 1787.

  **In Passage 2 (Adopting Purpose):**
  Douglass is arguing for **objective legal construction.**
  *   **The Context:** He admits some clauses are ambiguous (like the Fugitive Slave clause, which doesn't use the word "slave").
  *   **Douglass's Point:** When a text is ambiguous, courts use standard "rules of construction." One of those rules is the **Presumption of Liberty.** In a legal system founded on natural rights, if a sentence can be read two ways, you *must* read it the way that preserves freedom.
  *   **Why?** This isn't about what the *framer* intended; it's about what the *law* requires. The "purpose" here isn't the subjective goal of the writer; it is the **objective function of the law within a free society.**

  ### 2. Why They Fit Together (The Consistency Argument)

  You asked if "purpose" is just "intention" sneaking back in. The answer is **no**, because the *agent* of the purpose has changed.

  *   **Passage 1** rejects the **Framer's Intention.** (Subjective, historical, hidden).
  *   **Passage 2** invokes the **Law's Purpose.** (Objective, textual, normative).

  Douglass is arguing that the Constitution is a **legal instrument**, not a **historical artifact**.
  *   If it were a historical artifact, we would care about what the authors meant (Passage 1 says: Don't do this).
  *   If it is a legal instrument, it must be read according to the rules of justice and logic that govern all law (Passage 2 says: Do this).

  He is essentially saying: *"I don't care if the framers were racists in their hearts (Passage 1). What I care about is that the text they produced, when read according to the standard rules of legal logic, creates a system of liberty (Passage 2)."*

  ### 3. The "Gotcha" (For a nuanced discussion)

  If you want to impress the TA, acknowledge the counter-argument. You can say:

  > "On the surface, it looks like Douglass is swapping 'intent' for 'purpose' to get the result he wants. But I think he's actually shifting the authority of the Constitution. He's moving it away from the **authority of the Founders** (which would bind Black Americans to the sins of the past) and toward the **authority of the Text and Natural Law** (which allows Black Americans to claim rights in the present)."

  This shows you understand that this isn't just a logic puzzle; it's a political strategy. Douglass *needs* the Constitution to be separable from the Founders' racism so that Black people can claim it as their own.

  ### 4. Cheat Sheet for Discussion Section

  If the TA asks about this, here are three bullet points to have in your pocket:

  1.  **Extrinsic vs. Intrinsic:** Passage 1 rejects *extrinsic* evidence (what happened outside the text). Passage 2 uses *intrinsic* rules (how to read the text itself when it's vague).
  2.  **The Presumption of Liberty:** Douglass is citing a real common-law maxim. He isn't making it up to fit his argument; he's arguing that slavery is the exception and liberty is the rule, so ambiguity must always be resolved in favor of the rule.
  3.  **Instrumentalism:** Douglass treats the Constitution as a tool for liberation. Consistency matters less to him than efficacy, *but* he maintains logical consistency by sticking to the text rather than history.

  **Summary:** He isn't contradicting himself. He is saying: "Don't tell me what they *meant* (history); tell me what the law *does* (jurisprudence). And the law, by its nature, must do justice."

  Good luck tomorrow! This is a high-level observation, so trust your instinct that it's a tension worth exploring.
