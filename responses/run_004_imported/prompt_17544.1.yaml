answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The remnants of coffee and scattered papers cover the table. Nadia and Simon, both doctoral candidates known for their precision, have agreed to reconstruct the argument their friends botched over dinner.*

  **Nadia:** Let's strip the sentimentality from your friend's position. The core claim is that Harsanyi's theorem forces us to ignore the moral value of a fair procedure. Specifically, that a social planner committed to *ex ante* Pareto cannot distinguish between a fair coin flip to allocate an indivisible good and some other probabilistic mixture that yields the same expected utilities but lacks the "fairness" of the flip.

  **Simon:** Precisely. Take Diamond's case. Two claimants, one good. Allocation A gives it to Person 1. Allocation B gives it to Person 2. A fair lottery gives each a 50% chance. If the planner is a Harsanyi utilitarian, they evaluate social welfare as the sum of expected utilities. If Person 1 and 2 are risk-neutral, the lottery yields expected utilities of (0.5, 0.5). But suppose the planner instead commits to a policy: "I will give it to Person 1, but I'll compensate Person 2 with a side payment such that their expected utility is also 0.5." Harsanyi says these states are socially indifferent. But intuitively, the lottery treats the claimants as equals; the compensation scheme treats them as containers for utility.

  **Nadia:** I see the intuition, Simon, but I think you're conflating the *source* of the utility with the *aggregation* of it. If the claimants value being treated equally *as a procedure*, that preference must be represented in their von Neumann–Morgenstern (vNM) utility functions. If they derive utility from knowing the process was fair, then the fair lottery *does* generate higher expected utility than the unfair compensation scheme. Harsanyi's theorem captures that. It sums whatever they value.

  **Simon:** That's the standard defense, but it begs the question. Suppose the claimants are stoics. They don't care about the procedure; they only care about the good. They are indifferent between the fair flip and the compensated deterministic assignment, provided the expected material payoff is identical. In that case, their vNM utilities are identical across the two scenarios. Harsanyi's theorem dictates social indifference. But *we*, the moral observers, still think the fair flip is superior. The fairness isn't in their heads; it's in the social relation. Harsanyi reduces social justice to the satisfaction of subjective preferences. If the subjects don't prefer fairness, justice disappears.

  **Nadia:** If the subjects don't prefer fairness, on what grounds do you impose it? This is where your position collapses into paternalism. You're saying the social planner knows what is good for the claimants better than they do. If both claimants are indifferent between the fair lottery and the compensated assignment *ex ante*, and you force the lottery, you aren't making them better off by their own lights. You're satisfying a third-party aesthetic preference for symmetry. Why should social welfare be hostage to your aesthetic?

  **Simon:** Because social welfare isn't just aggregated preference satisfaction. It's about the justification of coercive power. When the state allocates a scarce good, it owes a justification to the loser. "We flipped a coin" is a justification that acknowledges equal standing. "We gave it to him because his utility function was slightly more elastic, though we compensated you" is a different justification. My point isn't about making the claimants happier. It's about treating them as equals regardless of their subjective attitudes toward fairness.

  **Nadia:** But that violates the *ex ante* Pareto principle. If both claimants prefer the compensated scheme—perhaps because the side payment is more reliable than a gamble—and the planner overrides them to enforce a coin flip, the planner is making *both* parties worse off by their own rational standards. You are sacrificing their actual welfare for a symbolic gesture. How is that "fairness"? It sounds like burning money to make a point.

  **Simon:** I'm not necessarily saying we override them if they *both* explicitly agree. I'm saying the *ex ante* Pareto principle is blind to the distribution of risk. Consider a harsher case. A public health policy. Option A: Everyone faces a 1% risk of death. Option B: 1% of the population faces a 100% risk of death. *Ex ante*, assuming risk neutrality, these are identical. Everyone has a 0.99 survival probability. Harsanyi is indifferent. But Option B is a death sentence for a specific minority. Option A spreads the risk. If we choose B because it's marginally more efficient in expected utility terms, we have condemned specific individuals to die who could have lived under A.

  **Nadia:** I'm not indifferent to that, Simon, but I analyze it differently. In the health case, individuals are likely risk-averse. They would prefer the spread risk (Option A). So their vNM utilities would reflect that, and Harsanyi's sum would prefer A. You only get the counterintuitive result if you assume risk neutrality. But if you assume risk neutrality, you are stipulating that the individuals *do not care* about the variance. If they don't care, why should the planner?

  **Simon:** Because the *ex post* reality matters. Once the lottery is run, in Option B, there is a group of people who are dead who would be alive under Option A. In Option A, everyone survives with high probability. The *ex post* inequality in Option B is catastrophic. My argument is that *ex ante* Pareto is insufficient because it evaluates social states before the veil of uncertainty is lifted. But justice is often about how people fare once the veil is lifted. If I lose the coin flip for the indivisible good, I get nothing. If we compensated me, I get something. If the compensation scheme was "unfair" but gave me higher expected utility, *ex ante* Pareto says take the compensation. But if the compensation is contingent or humiliating, the lottery might be better *ex post*.

  **Nadia:** You keep shifting between "better for them" and "better in the abstract." Let's tackle your consent objection directly. You argued earlier that fairness is about justification, not preference. But if I offer you a choice: "We can flip a coin for the good, or I can give it to your rival and give you $50," and you take the $50, you have consented to the unequal outcome. If I then say, "No, we must flip the coin because it's fairer," I am disregarding your agency. I am treating you as a site for moral value, not an agent. The *ex ante* Pareto principle respects the sovereignty of individual rational choice. If everyone agrees to a gamble, it is not unfair.

  **Simon:** Consent validates the procedure, but it doesn't exhaust the moral landscape. Two people can consent to a duel. That doesn't make the duel socially optimal or just. But let's go deeper. The problem with Harsanyi isn't just about overriding consent. It's that the theorem assumes the *same* social weights apply across all states of the world. It assumes that Person 1's utility in the "win" state counts the same as Person 1's utility in the "lose" state, aggregated linearly.
  My claim is that the social planner might want to weight the utility of the *loser* more heavily *ex post* than the *ex ante* calculation suggests. Harsanyi forbids this. It locks us into the *ex ante* weights. If we care about the plight of the person who actually loses the coin flip, we might want to redistribute *after* the fact, or choose a different procedure *before* the fact that minimizes *ex post* regret, even if it costs a tiny bit of *ex ante* efficiency.

  **Nadia:** But if you do that, you violate the vNM axioms for the *social* preference ordering. You end up with a social welfare function that is not representable as an expected utility maximizer. That means the society itself behaves irrationally over time. It becomes susceptible to Dutch books. It can be pumped for resources by a clever bookie because its preferences reverse depending on which state of the world obtains. Do you want a society that is dynamically inconsistent?

  **Simon:** I'd rather have a society that is morally responsive than one that is rational in the sense of a casino. The "irrationality" you point out is only irrationality relative to the axiom that social choice must mirror individual choice over lotteries. Why must it? Individuals are risk-bearing entities; society is a moral entity. The analogy breaks down.
  Here is the crux, Nadia. You think the *ex ante* Pareto principle is a requirement of rationality. I think it's a substantive moral claim that prioritizes efficiency over equality of opportunity. When you say I'm "cornered" into utilitarianism, you're assuming that the only way to respect individuals is to maximize their expected utility. I'm saying respecting individuals sometimes requires protecting them from the tyranny of the aggregate, even if they would have bet against that protection beforehand.

  **Nadia:** And I say that "protecting them from the aggregate" is just a phrase for "giving them less of what they want." If they would have bet against the protection, they want the efficiency. You're positing a "true self" that cares about *ex post* equality which contradicts the "revealed self" that chooses *ex ante* efficiency. Which self governs? If you say the "true self," you're imposing a perfectionist view of the good. If you say the "revealed self," you're back with Harsanyi.

  **Simon:** I'm not positing a true self. I'm positing that the *ex ante* perspective is epistemically limited. It doesn't see the tragedy of the loser. Imagine the person who loses the coin flip for the life-saving drug. *Ex ante*, they agreed to the flip. *Ex post*, they die. The *ex ante* agreement doesn't undo the *ex post* loss. Harsanyi says the social planner should be indifferent between the flip and a policy that saves the person with the higher social utility index. I say the planner has a duty to the person who *actually* suffers, not just the statistical expectation of suffering.

  **Nadia:** But you can't maximize the welfare of the actual sufferer in every case without destroying the system that helps them *ex ante*. If you always bail out the loser of the fair coin flip, no one will trust the flip. You undermine the very mechanism that gives them a 50% chance.
  Let's try to locate the impasse. You believe that fairness is an objective property of the allocation mechanism, independent of the participants' utility functions. I believe fairness is derivative; it's valuable only insofar as it contributes to the satisfaction of preferences (including preferences for fairness).
  If that's the case, you aren't really objecting to Harsanyi's math. You're objecting to his welfarism. You want non-welfarist information—like "was a coin used?"—to enter the social welfare function directly.

  **Simon:** Yes. That's exactly it. Harsanyi's theorem relies on the Pareto principle to bridge individual utility to social utility. But Pareto only transmits information about *individual welfare*. It filters out information about *social structure*. If the only data we feed the system is "I prefer A to B," we can't get out "A is more just than B" unless justice is defined entirely by preference satisfaction. I deny that. I think the coin flip has value even if no one prefers it, because it constitutes a community of equals.

  **Nadia:** And I deny that a "community of equals" is a coherent moral agent that can have interests distinct from the people in it. If the people don't value the symbol, the symbol is empty. But here is where I think you're stuck: If you allow non-welfarist information into the social function, you lose the democratic justification for the function. Why should the planner care about "equality of opportunity" if the people themselves are willing to trade it for "equality of outcome" or "higher aggregate wealth"? By prioritizing your procedural intuition over their *ex ante* unanimity, you make the planner a moral guardian, not a representative.

  **Simon:** And by prioritizing their *ex ante* unanimity over the *ex post* reality of their suffering, you make the planner a statistician, not a judge.
  We aren't going to resolve this, are we?

  **Nadia:** No. Because you view the violation of *ex ante* Pareto as a necessary cost of justice, and I view it as an impermissible violation of individual sovereignty. You think I'm blind to the moral significance of the process. I think you're blind to the moral significance of consent.

  **Simon:** It's deeper than that. It's about time. You live in the *ex ante* moment, where all possibilities are open and probabilities are king. I live in the *ex post* moment, where facts are brutal and probabilities have collapsed into fate. Harsanyi's theorem works perfectly in the world of probabilities. It fails in the world of fate.

  **Nadia:** And until we can agree on whether social choice theory is about managing probabilities or managing fate, we'll keep ordering dinner and sending it back uneaten.

  **Simon:** *Gestures to the empty coffee cups.* Shall we call it a night?

  **Nadia:** Only if we agree to disagree on the Pareto principle.

  **Simon:** I can agree to that. *Ex ante*.
