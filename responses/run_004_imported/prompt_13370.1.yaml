answer: |-
  Your intuition is spot-on. The forum claim that Peirce "beat Popper to it" is a classic case of philosophical telephone: it conflates a shared *spirit* (fallibilism, anti-dogmatism) with a shared *mechanism*.

  As a chemist, you know the difference between a reaction that *works* (yield, convergence) and a hypothesis that is *testable* (experimental design). Peirce, in *The Fixation of Belief*, is describing why the scientific reaction works to produce a stable product (belief). Popper is describing how to design the experiment so you know if the reaction failed.

  They are solving different problems. Peirce is solving the problem of **inquiry** (how do we move from doubt to stable belief?). Popper is solving the problem of **demarcation** (how do we distinguish science from pseudo-science?).

  Here is the point-by-point breakdown of why "External Permanency" is not "Falsifiability," and how they would judge your "a priori method" differently.

  ### 1. The Criterion: Social Convergence vs. Logical Risk
  *   **Peirce (External Permanency):** For Peirce, science is defined by its **cause**. A method is scientific if the resulting belief is caused by something outside the mind ("external permanency"). The proof that this is happening is **convergence**. If you, I, and a thousand other chemists investigate independently, we will all eventually land on the same conclusion. If we don't (as with metaphysicians), the method isn't scientific.
  *   **Popper (Falsifiability):** For Popper, science is defined by its **logical structure**. A theory is scientific if it forbids certain outcomes. It must stick its neck out. It doesn't matter if everyone agrees (consensus can be wrong); it matters if the theory *could* be proven false by observation.
  *   **The Difference:** Peirce looks at the *long-term sociological result* of the method (agreement). Popper looks at the *immediate logical property* of the statement (risk).

  ### 2. The Role of "External Permanency" vs. The Empirical Basis
  *   **Peirce:** "External permanency" is an **ontological anchor**. It is Reality itself, tugging on our sleeves. Peirce is a Realist; he believes there is a "Real" that exists regardless of what we think, and science works because it submits to that Real. The "External Permanency" guarantees that inquiry has a destination.
  *   **Popper:** Popper is wary of claiming access to "Reality" in that sense. For Popper, the "empirical basis" consists of **basic statements** (observation reports) that the scientific community *agrees to accept* for the sake of testing. They are conventional, not necessarily "True" in a metaphysical sense.
  *   **The Difference:** Peirce's permanency is what *makes* the belief true. Popper's observations are just the tools used to *eliminate* false beliefs. Peirce is building toward Truth; Popper is clearing away Error.

  ### 3. Truth: Destination vs. Horizon
  *   **Peirce:** In the text you quoted, Peirce defines truth as "the opinion which is fated to be ultimately agreed to by all who investigate." Truth is the **limit** of inquiry. It is attainable in the long run. Science is the engine that drives us toward that limit.
  *   **Popper:** Popper rejects the idea that we can ever reach a final verified truth. We only achieve **verisimilitude** (truth-likeness). We never confirm a theory; we only fail to falsify it *yet*. There is no "ultimate conclusion" where inquiry stops.
  *   **The Difference:** Peirce's science is teleological (it has a goal/end state). Popper's science is infinite (it never ends, only grows).

  ### 4. Judging the "A Priori Method" (and Astrology)
  This is where the rubber meets the road for your specific question. How would each philosopher judge the "a priori method" (reasoning based on what feels agreeable/natural) or astrology?

  *   **Peirce's Judgment:**
      *   **Why it fails:** It fails the **convergence test**. As Peirce notes, metaphysicians (using the a priori method) swing like a pendulum between material and spiritual views. They never settle. Astrologers never agree on a chart reading.
      *   **The Verdict:** It is not science because it does not submit to an external permanency that forces agreement. It remains a matter of "taste" or "fashion."
      *   **Nuance:** Peirce might admit an a priori hypothesis is a valid *starting point* (abduction), but if it remains settled by "agreeableness to reason" rather than external compulsion, it isn't science.

  *   **Popper's Judgment:**
      *   **Why it fails:** It fails the **falsifiability test**. Astrology and many a priori metaphysical systems are often phrased so vaguely that no observation can contradict them. They are "immunized" against refutation.
      *   **The Verdict:** It is not science because it is not empirically testable. It might be meaningful metaphysics, but it isn't science.
      *   **Nuance:** Popper might argue that even if astrologers *did* converge on a belief (say, everyone agreed Mars influences temperament), if the theory isn't structured to allow for a potential refutation, it's still dogma, not science.

  ### 5. The Chemist's Analogy
  Since you spent 40 years in the lab, here is the distinction in practical terms:

  *   **Peirce** is describing the **inter-lab reproducibility** standard. "If this is real chemistry, Lab A in New York and Lab B in Tokyo should get the same NMR shift eventually. If they keep getting different results based on who is running the machine, it's not science."
  *   **Popper** is describing the **control experiment**. "Your hypothesis predicts the peak will be at 5.0 ppm. If it is at 5.1 ppm, your hypothesis is dead. If you say 'well, it depends on the vibe of the machine,' you aren't doing science."

  ### Summary: Why the Forum Claim is Wrong
  The forum poster is conflating **Fallibilism** with **Falsifiability**.

  Peirce *did* invent modern Fallibilism (the idea that any of our beliefs could be wrong). Popper adopted this. However, *The Fixation of Belief* is not primarily about fallibilism; it is about the **social ontology of truth**.

  *   **Peirce (1877):** Science is the method that allows a community to converge on Reality.
  *   **Popper (1934):** Science is the logical method of eliminating error through risky predictions.

  Peirce draws the line between science and non-science based on **what causes the belief** (Reality vs. Human Preference). Popper draws the line based on **the logical status of the proposition** (Testable vs. Untestable).

  So, to answer your specific question: **No, "external permanency" is not doing the same job as falsifiability.** External permanency explains *why* science works (Realism); Falsifiability explains *how* to do it (Methodology). Peirce would likely classify a falsifiable theory that fails to produce convergence (perhaps due to experimental noise or complexity) as still being scientific inquiry, whereas Popper would classify a theory that produces convergence but cannot be logically refuted (perhaps a highly successful but ad-hoc model) as dogmatic.

  You were right to be skeptical. Peirce laid the groundwork for the *attitude* of the scientist, but Popper built the *logic gate* for the definition of science.
