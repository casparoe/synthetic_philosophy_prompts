prompt: |-
  I spent almost forty years as a research chemist, and its only since retiring that I've actually started reading philosophy instead of just picking up the buzzwords secondhand. "Falsifiability" was one of those words I threw around for decades without ever having read a page of Popper's actual writing. Now that I finally have, I got curious where the idea came from, and someone on a forum claimed Peirce basically beat him to it, back in 1877, in an essay called "The Fixation of Belief." I don't think that's quite right, but I can't pin down exactly why. Here's the bit that's got me stuck, right after Peirce dismisses settling belief on what's "agreeable to reason" (what he calls the a priori method):

  "This method is far more intellectual and respectable from the point of view of reason than either of the others which we have noticed. But its failure has been the most manifest. It makes of inquiry something similar to the development of taste; but taste, unfortunately, is always more or less a matter of fashion, and accordingly metaphysicians have never come to any fixed agreement, but the pendulum has swung backward and forward between a more material and a more spiritual philosophy, from the earliest times to the latest. ... This method, therefore, does not differ in a very essential way from that of authority.

  To satisfy our doubts, therefore, it is necessary that a method should be found by which our beliefs may be determined by nothing human, but by some external permanency -- by something upon which our thinking has no effect. Some mystics imagine that they have such a method in a private inspiration from on high. But that is only a form of the method of tenacity, in which the conception of truth as something public is not yet developed. Our external permanency would not be external, in our sense, if it was restricted in its influence to one individual. It must be something which affects, or might affect, every man. And, though these affections are necessarily as various as are individual conditions, yet the method must be such that the ultimate conclusion of every man shall be the same. Such is the method of science."

  So is "external permanency," plus everyone eventually converging on one conclusion, doing the same job as Poppers refutability test, just in 1870s dress? Or is Peirce drawing the line between science and non-science somewhere else entirely, one that might sort his own "a priori method" (or something like astrology) differently than falsifiability would? Would rather get an actual point-by-point comparison than a "yeah, basically the same idea, different words" answer.
