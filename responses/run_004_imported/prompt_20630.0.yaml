answer: |-
  You have stumbled upon one of the oldest and most difficult questions in political philosophy. It is known as the **"Boundary Problem"** (or the *constituency problem*), and your board member is essentially reciting a standard defense of territorial jurisdiction. However, while his argument is logically consistent, it is morally incomplete.

  Your instinct is not just a feeling; it is a recognition of a conflict between **procedural clarity** (sticking to the map) and **distributive justice** (who bears the burden).

  Here is a breakdown of the principles at play, why your colleague's argument is both right and wrong, and how you can navigate this without needing to solve the entire theory of democracy.

  ### 1. The Theoretical Standoff
  Your board member is relying on a concept called **All-Subjected Principle** (or simply territorial jurisdiction). The argument is that a democracy must have a fixed *demos* (people) to function. If you change who gets to vote based on every specific decision, you enter an infinite regress: *Who decides who decides?* To avoid paralysis, we accept fixed borders as a "pre-commitment" strategy. In this view, the boundary is arbitrary, but its *fixedness* is what gives it legitimacy.

  You are relying on the **All-Affected Interests Principle**. This argues that anyone whose interests are significantly affected by a decision should have a say in it. This aligns with the democratic maxim "no taxation without representation," extended to "no pollution without representation."

  **The Verdict:** Political philosophers generally agree that the board member is right about *constitution-making* (we need a fixed map to exist as a town), but you are right about *policy-making* (within that map, we have obligations to those outside it). The boundary determines who votes, but it does not determine who matters.

  ### 2. The Distinction Between "Vote" and "Voice"
  The board member sets up a false dichotomy: either the neighbors get a vote, or they get nothing. In zoning and planning, there is a middle ground.

  While you cannot legally grant non-residents a vote on the board, you can grant their testimony **elevated weight**.
  *   **Principle:** A resident living 5 miles away who sees no trucks has a *theoretical* interest. A neighbor living 200 yards from the exit who faces exhaust has a *material* interest.
  *   **Application:** The board can formally acknowledge that while the vote is restricted by residency, the *impact assessment* must prioritize those facing direct, concentrated externalities over those facing diffuse or non-existent ones. You can vote to approve the warehouse *only if* specific mitigations are met that protect the non-voting neighbors.

  ### 3. Concentrated Harm vs. Diffuse Impact
  Your colleague's argument relies on the idea that effects "radiate out for miles." This is a "slippery slope" fallacy regarding intensity.
  *   **The Principle of Proximity:** In tort law and ethics, there is a distinction between a general background increase in traffic (which everyone shares) and a localized destruction of quality of life (which only the neighbors suffer).
  *   **The Argument:** You can argue that the "line" isn't arbitrary if it is drawn based on **thresholds of impact**. For example: "Anyone within the noise contour of 65 decibels" or "Anyone whose property accesses the impacted road segment." This isn't an arbitrary political line; it is a scientific/empirical line based on harm.
  *   **Why this matters:** It answers the "where do we stop?" question. We stop where the significant harm stops. The town border is irrelevant to the physics of noise and road wear.

  ### 4. The Problem of "Exporting Costs"
  The core ethical issue here is what economists call **negative externalities**. Your town is considering a deal where the *benefits* (tax revenue, jobs for voters) stay inside the boundary, but the *costs* (noise, road damage) are exported outside the boundary.
  *   **The Principle:** It is a violation of procedural justice for a political body to enrich its constituents by impoverishing its neighbors who lack recourse.
  *   **The Counter-Argument to your Colleague:** If the town boundary is the only moral metric, then the town is ethically permitted to dump toxic waste on the border as long as the wind blows away from voters. Most people would agree that is wrong. Therefore, the boundary *cannot* be the only moral metric.

  ### 5. Actionable Principles for the Board
  You don't need to redraw the map to act on your instinct. You can use the town's discretionary power to mitigate the injustice. Here are three principled approaches you can propose:

  **A. Conditional Approval (Mitigation)**
  The board can vote to approve the warehouse *contingent* on measures that protect the unincorporated neighbors.
  *   *Example:* The developer must fund the repaving of the county road section used by trucks.
  *   *Example:* Mandatory sound barriers facing the unincorporated homes.
  *   *Example:* Restricted trucking hours to protect sleep for the immediate neighbors.
  *   *Principle:* If they cannot have a vote, they must be made whole against the damage.

  **B. Regional Consultation**
  Since the impact crosses jurisdictional lines, the decision should involve the higher jurisdiction that covers *both* areas (the County).
  *   *Action:* The town board can make it a condition of approval that the developer must secure approval or a traffic impact study signed off by the County Board of Supervisors, since the road is a county road. This effectively gives the neighbors' representatives (the County) a veto or a say, bypassing the town border limitation.

  **C. The "Good Neighbor" Policy**
  You can argue that the town's long-term interest is regional stability. Alienating immediate neighbors leads to lawsuits, county-level pushback, and reputational damage.
  *   *Argument:* "We are not voting on whether they get a ballot; we are voting on whether we are good neighbors. Ignoring their plight creates liability and conflict that will eventually come back to this board."

  ### Summary
  Your board member is right that **voting rights** are tied to borders for the sake of administrative stability. But he is wrong that **moral consideration** is tied to borders.

  There is a principled way to work this out: **Impact-based weighting.**
  1.  Acknowledge the boundary is fixed for voting (he wins on procedure).
  2.  Assert that the *conditions* of the approval must reflect the intensity of the impact (you win on justice).
  3.  Require that those bearing the brunt of the cost receive the brunt of the protection (mitigation), regardless of where the line is drawn.

  You are not suffering from a lack of principle; you are suffering from the friction between a clean map and a messy reality. Trust your instinct: a decision that concentrates harm on the voiceless while distributing benefits to the unaffected is not a sustainable democratic outcome, even if it is a legal one.
