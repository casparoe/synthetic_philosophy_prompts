      *   *Function:* Defined by *Selected Effects* (what the trait was selected *for* doing in the past).
      *   *The Frog Case:* The frog's snapping mechanism has the function of catching flies. Why? Because ancestors caught flies and survived/reproduced.
      *   *Addressing the "Small Dark Moving Thing" (SDMT):* Selection didn't select for snapping at SDMTs *in general*. It selected for snapping at *flies*. If the frog snaps at BBs, it's a malfunction. The content is "Fly" because that's what the mechanism was designed to detect to perform its function.
      *   *Addressing the User's Specific Worry ("Ambient Nutrition" / "Fly-shaped retinal stimulation"):* This is the crux.
          *   *Nutrition:* The function isn't just "get nutrition." It's "catch prey using *this specific mechanism*." The mechanism is tuned to visual cues, not nutritional value directly. The *normal explanation* for the success of the mechanism involves the presence of flies, not just nutrition generally.
          *   *Retinal Stimulation:* This is the "distal vs. proximal" problem. Did selection select for detecting flies (distal) or retinal patches (proximal)? Teleosemanticists (like Millikan) argue that the *consumer* of the representation determines the content. The tongue/snapping mechanism needs the *fly* to be there to succeed, not just the retinal patch. If there's a retinal patch but no fly, the tongue misses (malfunction). Therefore, the condition for success is the *fly*, not the patch.

