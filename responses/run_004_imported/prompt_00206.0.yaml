answer: |-
  You have hit on exactly the right nerve. This is the "grain problem" or the "indeterminacy of selection" objection, and it's the strongest critique leveled against teleosemantics (often by Fodor, Godfrey-Smith, and Shea). You are right to be suspicious that we might just be pushing the indeterminacy back from "causal correlation" to "evolutionary description."

  Here is the walkthrough of the mechanism teleosemanticists (specifically Millikan and Neander) use to block this, followed by the gut check you asked for.

  ### The Mechanism: Consumers, Producers, and Normal Conditions

  To stop the regress, teleosemantics doesn't just look at the **Producer** (the frog's visual neuron firing). It looks at the **Consumer** (the frog's snapping mechanism/tongue) and the **Normal Conditions** under which the Consumer succeeds.

  Here is the three-step move they make to pin down content:

  **1. Content is determined by the function of the Consumer.**
  The visual state (the representation) only has content because it is *used* by something else. The neuron fires to guide the tongue. The content of the neuron is determined by what the tongue *needs* to be true in order to perform its function.
  *   **The Move:** We don't ask "What caused this neuron to fire?" (which leads to the disjunction problem). We ask "What condition must obtain for the snapping mechanism to succeed?"

  **2. Success requires the Distal Object, not the Proximal Stimulus.**
  Why did the snapping mechanism evolve? To ingest nutrition. Does a retinal patch provide nutrition? No. Does "ambient nutrition" generally provide nutrition? Yes, but the snapping mechanism is not tuned to detect nutrition generally (it won't snap at a berry). It is tuned to detect *flies*.
  *   **The Move:** In the "Normal Explanation" of the frog's ancestors' survival, the mechanism succeeded only when there was actually a **fly** there. If there was a retinal patch but no fly (a BB), the tongue snapped and the frog starved. Therefore, the condition for the *success* of the consumer system is the presence of a fly, not a retinal patch.

  **3. Selection History fixes the "Proper Function."**
  This is where history enters. A state represents $X$ if the mechanism producing that state has the **proper function** of correlating with $X$.
  *   **The Move:** Why is the function "catch flies" and not "catch SDMTs" (Small Dark Moving Things)? Because in the evolutionary past, snapping at SDMTs that were *not* flies (e.g., pebbles) did not contribute to reproduction. Snapping at flies did. The selection pressure wasn't "snap at movement"; it was "snap at movement *that is nutritious prey*." The specific physiological tuning of the eye filters out non-fly movement.

  **So, to answer your specific worries:**
  *   **Vs. "Ambient Nutrition":** The mechanism is not a general nutrition detector. It is a specific *visual-motor* arc. The function is defined by the specific capacity of the mechanism. Since the mechanism fails on nutritious berries, "nutrition" is too broad.
  *   **Vs. "Retinal Stimulation":** The consumer system (the body) doesn't care about the retina; it cares about the stomach. The "Normal Condition" for the system's success is the presence of the fly, because that is what historically explained the reproductive success.

  ### The Gut Check: Does it work or just relocate the worry?

  Here is the honest assessment.

  **Where it succeeds:**
  It solves the **Error Problem** beautifully. Pure causal theories can't explain false beliefs (if a neuron fires for a BB, and causation is all there is, then the content is "BB or Fly," so it's never false). Teleosemantics says: "The neuron fired, but there was no fly. The mechanism malfunctioned. The content was 'Fly,' so it was a false representation." This is a massive upgrade over covariance theories.

  **Where it struggles (Your Worry is Valid):**
  You are correct that indeterminacy is relocated, not eliminated. It moves from "causal covariance" to **"description of selection pressure."**

  1.  **The Description Problem:** Evolution doesn't write down job descriptions. We (the theorists) have to describe what the trait was selected *for*.
      *   Was the frog selected to catch *flies*?
      *   Or *insects*?
      *   Or *moving protein sources*?
      *   Or *things that trigger this specific retinal array*?
      *   Teleosemanticists argue the *physiology* constrains this (the eye can't see protein, only movement/shape). But critics argue there is still slack. If the ancestors caught flies *and* bees, is the content "fly" or "bug"? Teleosemantics often has to say the content is indeterminate between the two, which feels like a failure of determinacy.

  2.  **The Novelty Problem:** This is Fodor's big stick. If content is fixed by *past* selection, how do we represent things that didn't exist in the EEA (Environment of Evolutionary Adaptedness)?
      *   How does a frog represent a "BB"? (It doesn't, it malfunctions).
      *   But how does a *human* represent a "carburetor" or a "stock market"? There is no selection history for those. Teleosemantics has to get very fancy with "derived functions" or learning mechanisms to explain novel content, and many find those moves ad hoc.

  3.  **The "Pushing Back" Verdict:**
      You asked if it just relocates Fodor's worry. **Yes, but productively.**
      It relocates the indeterminacy from the *physical* level (causes are messy) to the *functional/biological* level (functions are interpretable).
      *   **Fodor's View:** This is a bug. If biology is indeterminate, semantics is indeterminate.
      *   **Teleosemanticist View:** This is a feature. Biological function *is* the naturalistic ground we were looking for. If biology says the function is coarse-grained, then content *is* coarse-grained. That's not a theory failure; that's reality.

  ### Summary for your chapter notes
  Teleosemantics blocks the disjunction problem by shifting the anchor from **causal history** (what fired the neuron) to **functional history** (what the neuron is *for*). It uses the **Consumer System** to determine that the success condition is the distal object (fly), not the proximal stimulus (retina) or the abstract benefit (nutrition).

  **Does it work?** It works better than anything else for naturalizing error. However, your intuition is spot-on: it relies on our ability to objectively define "selected effects," and since evolutionary descriptions can be gerrymandered, the determinacy of content is only as solid as the determinacy of evolutionary function attribution. It doesn't solve the indeterminacy metaphysically; it naturalizes it.
