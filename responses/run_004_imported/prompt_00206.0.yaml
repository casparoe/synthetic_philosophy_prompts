          *   *Key Distinction:* What makes the consumer succeed? A retinal patch doesn't feed the frog. A fly does. Therefore, the norm is set by the fly.
      *   **Addressing "Ambient Nutrition":**
          *   Selection acts on specific mechanisms. A mechanism that detects nutrition *directly* would be different. The visual snapping mechanism is specifically adapted for *flying insects*. If you put a nutritious berry there, the frog doesn't snap. So the function isn't "get nutrition," it's "catch moving insect-things."
      *   **Addressing "Retinal Stimulation" (The Distal/Proximal issue):**
          *   This is the strongest version of the user's worry.
          *   Teleosemantic reply: The "Normal Explanation." In the evolutionary past, when the mechanism worked, there was *both* a retinal patch and a fly. But which one explains the *survival value*? The fly. The retinal patch is just the medium. The *function* is defined by the environmental condition that made the trait adaptive.
