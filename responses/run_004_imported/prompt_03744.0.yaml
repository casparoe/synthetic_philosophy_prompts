answer: |-
  You have excellent instincts. You've correctly identified that there are two main ways to handle this problem, and your proposed solution is actually one of them. In the academic literature (specifically social choice theory and legal philosophy), these are known as the **Premise-Based Procedure** (vote on the reasons) and the **Conclusion-Based Procedure** (vote on the verdict).

  You are right that switching to a Conclusion-Based Procedure stops the group from issuing a logically contradictory verdict. However, it doesn't make the dilemma "disappear." It just swaps one set of problems for another.

  Here is why your "obvious fix" isn't a magic bullet, and why the dilemma is considered a fundamental feature of group decision-making rather than a bug.

  ### 1. The Problem of Precedent (The "Why" matters)
  In many legal systems (especially common law like in the US or UK), the verdict isn't the only thing that matters; the **reasoning** sets the precedent for future cases.

  Imagine a contract case where Liability requires two premises:
  1.  Was there a valid contract? ($P$)
  2.  Was the contract breached? ($Q$)
  *Verdict:* Liable if $P$ and $Q$.

  **Scenario:**
  *   **Judge A:** Yes $P$, Yes $Q$ $\rightarrow$ Liable.
  *   **Judge B:** Yes $P$, No $Q$ $\rightarrow$ Not Liable.
  *   **Judge C:** No $P$, Yes $Q$ $\rightarrow$ Not Liable.

  If you use your **Conclusion-Based** fix:
  *   The vote on the verdict is 2-to-1 for **Not Liable**. Case closed.

  **The Problem:** A year later, a similar case comes up. The lower court looks at this precedent. They know the Supreme Court said "Not Liable." But they don't know *why*.
  *   Did the Court establish that there was no valid contract? (Judge C's view)
  *   Did they establish that there was no breach? (Judge B's view)
  *   Or did they just think the plaintiff didn't deserve to win for some other reason?

  If the lower court assumes $P$ is true (because Judges A and B voted Yes on $P$) but $Q$ is false, they might rule differently than if they assumed $P$ was false. By voting only on the conclusion, the higher court fails to guide the lower courts. The law becomes unpredictable.

  ### 2. Collective Rationality vs. Individual Rationality
  The Discursive Dilemma highlights a spooky phenomenon: **A group can be logically inconsistent even if every single member is logically consistent.**

  If you use the **Premise-Based Procedure** (vote on $P$ and $Q$):
  *   Majority says Yes to $P$.
  *   Majority says Yes to $Q$.
  *   Therefore, the Group accepts $P$ and $Q$.
  *   But if you check the Verdict vote, the Majority says "Not Liable."
  *   **Result:** The Group, as a collective entity, believes $P$, believes $Q$, but rejects $P \land Q$. The Group is irrational.

  If you use your **Conclusion-Based Procedure** (vote on Verdict):
  *   The Group avoids being irrational *about the verdict*.
  *   **However:** The Group now holds a verdict that contradicts the majority view on the facts.
  *   In the example above, the majority of judges believed there *was* a contract ($P$) and the majority believed there *was* a breach ($Q$). Yet, the group outcome is "No Liability."
  *   **Result:** The outcome is unrepresentative of the group's actual beliefs on the facts. You are enforcing a verdict that the majority of the judges actually think is factually unsupported.

  ### 3. Accountability and "Hide-the-Ball"
  Voting on premises forces judges to go on the record regarding specific legal principles.

  If you only vote on the verdict, a judge can vote "Not Liable" for *any* reason they want.
  *   Judge B might hate the plaintiff personally.
  *   Judge C might think the law is unjust.
  *   Judge A thinks the law is just but applies it strictly.

  If they all just vote "Not Liable," they form a majority coalition, but they have no shared legal reasoning. This allows judges to hide their true judicial philosophies. Voting on premises forces them to say, "I am voting 'No' specifically because element $Q$ was not met," which creates transparency.

  ### 4. The Impossibility Theorem
  This is the deepest part of the rabbit hole. Philosophers Christian List and Philip Pettit formalized this into the **List-Pettit Theorem** (2002).

  They proved mathematically that no voting system can satisfy all of these desirable conditions at once when dealing with interconnected propositions:
  1.  **Universal Domain:** Any set of individual judgments is allowed.
  2.  **Consistency:** The group's judgments must be logically consistent.
  3.  **Anonymity:** All voters count equally.
  4.  **Systematicity:** The group treats all issues (premises and conclusions) with the same voting rule.

  Basically, you have to sacrifice something.
  *   If you vote on the **Conclusion**, you sacrifice **Reasoned Consensus** (the group doesn't agree on *why*).
  *   If you vote on the **Premises**, you sacrifice **Responsiveness** (the verdict might contradict what the majority wants the outcome to be).

  ### Summary
  Your intuition is correct that voting on the verdict avoids the *logical contradiction* of the final output. In fact, many real-world juries do exactly this (they are asked "Guilty or Not Guilty," not "Did he do act A? Yes/No. Did he have intent B? Yes/No.").

  But in appellate courts and committees where **reasoning** is as important as the **result**, your fix creates a "black box" problem. The dilemma doesn't disappear; it just moves from "How do we keep our logic straight?" to "How do we ensure our reasoning represents the majority?"

  You haven't missed anything obvious; you've just rediscovered one side of a debate that legal theorists and political philosophers are still having!
