answer: |-
  You are absolutely correct to identify the Pasadena game as the mathematically more severe pathology, and your observation about its relative neglect in rationalist circles is astute. The short answer is: **Yes, the Pasadena game poses a genuinely distinct and deeper problem for Expected Utility Theory (EUT) than the St. Petersburg paradox.**

  While the St. Petersburg paradox (SPP) challenges the *normative plausibility* of maximizing expected utility (EUT gives an answer, but it seems wrong), the Pasadena game challenges the *mathematical coherence* of the framework itself (EUT fails to yield a unique answer at all).

  Here is a breakdown of why the Pasadena game is the "stronger" paradox, why it gets less attention in communities like LessWrong, and whether stochastic dominance (SD) actually resolves the underlying tension.

  ### 1. Divergence vs. Indeterminacy

  The fundamental distinction lies in measure theory and the conditions required for an expectation to be well-defined.

  **The St. Petersburg Paradox (SPP):**
  *   **Structure:** All payoffs are positive.
  *   **Mathematical Status:** The series diverges to $+\infty$.
  *   **The Problem:** The expectation is well-defined in the extended real numbers ($+\infty$). The theory functions "correctly" according to its axioms; it tells you to pay any finite amount to play. The conflict is between the theory's output and human intuition (or resource constraints).
  *   **Ordering:** Because all terms are non-negative, the sum is $+\infty$ regardless of the order of summation. The value is invariant under rearrangement.

  **The Pasadena Game (PG):**
  *   **Structure:** Payoffs alternate in sign.
  *   **Mathematical Status:** The series is conditionally convergent (specifically, it fails absolute convergence). $\sum |x_n p_n| = \sum \frac{1}{n} = \infty$.
  *   **The Problem:** By the Riemann Rearrangement Theorem, the expected value is **undefined**. It is not infinity; it is *arbitrary*. Depending on how you index the sample space (i.e., the order in which you sum the outcomes), the expected value can be $\ln 2$, $0$, $-\infty$, or any real number.
  *   **Ordering:** In probability theory, the sample space is a set, not a sequence. There is no privileged "natural order" for summing a countable set of outcomes. Therefore, the expectation integral does not exist.

  **Why PG is Deeper:**
  SPP suggests EUT is *too permissive* (it values the gamble too highly). PG suggests EUT is *incoherent* (it cannot value the gamble at all). SPP is a conflict between theory and intuition; PG is a contradiction within the theory's mathematical machinery when applied to unbounded utilities.

  ### 2. Why LessWrong Ignores Pasadena

  If PG is the deeper mathematical problem, why does the rationalist/AI safety community obsess over SPP (and its cousin, Pascal's Mugging)?

  1.  **Relevance to Longtermism and AI Safety:** The central anxiety in these circles is that an AI maximizing unbounded utility will be hijacked by low-probability, high-stakes scenarios (Pascal's Mugging). This is structurally an SPP problem (positive divergence). The fear is that the AI will *do something drastic* because the EV is infinite. The Pasadena game, by contrast, results in indeterminacy. An AI encountering a Pasadena gamble wouldn't go rogue; it would crash or return `NaN`. From a safety perspective, an AI that freezes is preferable to an AI that destroys the world to chase infinite utility.
  2.  **Action-Guiding Force:** SPP yields a decisive (albeit absurd) recommendation: *Play.* PG yields no recommendation. Decision theory is meant to guide action. SPP guides action poorly; PG fails to guide action at all. Discussions tend to focus on cases where the theory "works too well" rather than where it breaks down completely.
  3.  **Complexity:** Explaining SPP requires basic arithmetic. Explaining PG requires understanding conditional convergence, measure theory, and the distinction between absolute and conditional integrability.

  ### 3. Does Stochastic Dominance (SD) Solve It?

  You mention the move by Christian Tarsney and others to fall back on Stochastic Dominance when EV breaks down. This is a sophisticated response, but it handles SPP and PG differently.

  **How SD Works:**
  Gamble $A$ dominates $B$ if $P(A > x) \geq P(B > x)$ for all $x$, with strict inequality for some $x$. This relies on cumulative distribution functions, not sums of utilities.

  **SD and St. Petersburg:**
  SD can sometimes resolve SPP. For example, a truncated St. Petersburg game is dominated by a version with a higher cap. However, comparing an unbounded SPP to a finite cost often results in incomparability or dominance depending on the specific tail behavior. It mitigates the "pay anything" conclusion but doesn't always yield a total ordering.

  **SD and Pasadena:**
  This is where the limitation becomes clear. Compare the Pasadena game ($P$) to doing nothing ($0$).
  *   $P$ has outcomes arbitrarily high (positive).
  *   $P$ has outcomes arbitrarily low (negative).
  *   $0$ is constant.

  $P$ does not dominate $0$ (because $P$ can be negative).
  $0$ does not dominate $P$ (because $P$ can be positive).

  **The Verdict on SD:**
  SD does not "solve" the Pasadena game in the sense of telling you what to choose. It renders the gambles **incomparable**.
  *   **Is this a solution?** It is a *defensive* solution. It prevents the agent from making a decision based on an arbitrary ordering of the sum. It admits that the theory cannot rank these options.
  *   **Does it address the deeper issue?** It acknowledges the deeper issue. By retreating to SD, you are conceding that the linearity of expectation (which allows us to sum utilities) must be abandoned for unbounded gambles.
  *   **The Cost:** SD is a partial order, not a total order. A decision theory that frequently returns "incomparable" is less action-guiding. It papers over the symptom (making a wrong choice based on arbitrary summation) by refusing to make a choice.

  ### 4. The Root Cause: Unbounded Utility + Linearity

  Both paradoxes stem from the same root: the combination of **unbounded utility functions** and the **linearity of expectation** over infinite outcome spaces.

  *   **Bounded Utility:** If utility is bounded (e.g., by a sigmoid function or a hard cap), both SPP and PG vanish. The sums become absolutely convergent. This is the "Bernoulli solution." Most economists accept this, but many rationalists reject it because it implies an agent should ignore existential risks with probabilities below a certain threshold (the "fanaticism" objection).
  *   **Non-Linear Aggregation:** Some propose non-linear probability weighting (as in Prospect Theory) or rejecting the independence axiom.
  *   **Weak Expectations:** Easwaran (2008) proposed distinguishing between "strong" expectations (absolute convergence) and "weak" expectations (limit of average outcomes). PG has a weak expectation ($\ln 2$) but no strong expectation. One could argue we should maximize weak expectations. However, this reintroduces the ordering problem: why privilege the "natural" ordering of coin tosses over any other bijection from $\mathbb{N}$ to the sample space?

  ### Conclusion

  The Pasadena game is indeed the "canary in the coal mine" that rationalists often ignore because they are too worried about the explosion.
  *   **St. Petersburg** shows that unbounded EUT leads to **fanaticism** (valuing infinitesimal chances of infinite good too highly).
  *   **Pasadena** shows that unbounded EUT leads to **incoherence** (values depend on arbitrary mathematical indexing).

  Stochastic Dominance addresses the *practical* risk of Pasadena (making an arbitrary decision) by enforcing silence, but it does not restore the *theoretical* completeness of EUT. It confirms your suspicion: the deeper issue is not just that the sums go to infinity, but that the very definition of expectation collapses without absolute convergence. Any decision theory that wishes to handle unbounded utilities must either abandon linearity (SD) or impose bounds, and neither move is without significant normative costs.
