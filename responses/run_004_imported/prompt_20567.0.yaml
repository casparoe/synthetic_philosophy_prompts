answer: |-
  Good evening, everyone. For those who don't know me, I'm Sarah's older sibling. I write novels for a living, which means I spend most of my time inventing the interior lives of made-up people. So, naturally, when it came time for the wedding toasts, I was voted the one to speak about real life. It feels a bit like a carpenter being asked to perform surgery.

  But there is a specific reason I'm standing here, and it involves Sarah's PhD. As many of you know, Sarah has spent the last few years studying Confucian role ethics. Now, I know what you're thinking: "Please, for the love of god, do not turn the wedding toast into a lecture." And I promise I won't. But because I know the bride, I also know that if I stand up here and tell you to "never lose who you really are" or that "two become one," Sarah will visibly wince into her bouquet.

  In the version of philosophy Sarah loves, there isn't a little "true self" hidden underneath your relationships, waiting to be protected. Instead, we are *made* by our relationships. We are the sum of the ways we care for each other. So, I'm not going to wish for you to stay the same. I'm going to wish for you to become who you are *together*.

  There is a concept in that tradition, *he er bu tong*, which translates roughly to "harmony without sameness." It's the idea that harmony isn't about unison. It's not about two people blending until they are indistinguishable. It's like a recipe, or a chord. You need distinct notes to make music. If you play the same note on the piano, that's not harmony; that's just volume. So my wish for you is that you never confuse agreement with harmony. Keep your distinct notes. Let the friction spark the music.

  And regarding the titles you're taking on today—partner, wife, spouse. In this philosophy, a name isn't just a label you put on a box once it's packed. It's a promise you have to keep unpacking. To be called a "good partner" isn't a status you achieve at the altar; it's a verb you perform every time you make coffee, every time you listen, every time you show up. It's what the ancients called "rectifying names." You earn the name by living into it.

  Now, I should say, the old blueprints for these relationships were drawn a long time ago, and they had walls we don't need anymore. They were often rigid, and often unequal. But Sarah and Jo aren't moving into an old house; they're keeping the foundation—the idea that we are constituted by our care for one another—and building a new structure on top of it. A structure with open doors and equal footing.

  So, I raise my glass not to the idea of a perfect marriage, but to the practice of a real one. To the work of becoming who you are together. To harmony that requires difference. And to the names you will spend a lifetime making true.

  To Sarah and Jo.
