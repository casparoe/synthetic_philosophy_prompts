answer: |-
  This is a classic stalemate in the metaphysics of language, and honestly, the fact that you couldn't resolve it over drinks is a testament to how difficult Higher-Order Vagueness (HOV) is. It is widely considered the "final boss" of vagueness theories. Both Epistemicism and Supervaluationism have clean solutions to first-order vagueness (the simple Sorites), but both sweat profusely when asked to explain the vagueness of the boundary itself.

  Here is a breakdown of how each camp handles HOV, an assessment of your friend's objection, and my verdict on which theoretical price is steeper.

  ### 1. Epistemicism and Higher-Order Vagueness

  Your friend, following Timothy Williamson, holds that vagueness is a form of ignorance. There is a sharp cutoff for "diner," but we cannot know it.

  **The Mechanism:**
  Williamson grounds this in a **Margin for Error Principle**. For a subject to know a proposition $p$ (e.g., "This is a diner"), $p$ must not only be true but also *safe* from error. In nearby possible worlds where the subject makes the same judgment, $p$ must still be true. Because our perceptual and cognitive discrimination is limited, there is a "buffer zone" around the sharp boundary where we cannot form knowledge.

  **Handling HOV:**
  Epistemicism handles HOV by iterating the ignorance.
  1.  **First Order:** There is a sharp boundary between "diner" and "not diner." We don't know where it is.
  2.  **Second Order:** There is a sharp boundary between "definitely a diner" (knowably a diner) and "not definitely a diner." We don't know where *this* boundary is either.
  3.  **Iteration:** For any order $n$, there is a sharp boundary between "definitely$_n$" and "not definitely$_n$."

  **The Cost:**
  The Epistemicist pays a **metaphysical price**. They must claim that for a concept like "diner" (which depends on human intentions, furniture arrangements, and menu items), there is a single, precise number of booths or menu items where the status flips from *definitely borderline* to *borderline borderline*.
  *   **Pros:** It preserves classical logic (Bivalence, Excluded Middle) perfectly. The semantics are standard; the mystery is purely epistemic.
  *   **Cons:** It posits "sharp boundaries" for concepts that seem inherently smooth or functional. It implies that if you added one more stool to a coffee shop, it might metaphysically snap from "borderline diner" to "definitely diner," even if no human could ever detect the change.

  ### 2. Supervaluationism and Higher-Order Vagueness

  Your position, following Kit Fine, holds that vagueness is semantic indecision. "Diner" is true if it is true on all *admissible precisifications* of the term.

  **The Mechanism:**
  A sentence is **supertrue** if it is true on every admissible precisification. A sentence is **borderline** if it is true on some admissible precisifications and false on others.
  *   **Pros:** It captures the intuition that there is no "fact of the matter" for borderline cases. It explains why we feel hesitant to assert "This is a diner" or "This is not a diner."

  **Handling HOV:**
  This is where the trouble starts. To define "borderline," you need a set of admissible precisifications ($S$).
  *   **The Problem:** If the set $S$ is sharply defined, then the statement "$p$ is supertrue" has a sharp boundary. There would be a specific precisification that is the "last admissible one." This reintroduces a sharp boundary at the meta-level, effectively recreating the Sorites paradox for the word "admissible."
  *   **The Supervaluationist Response:** To avoid this, the Supervaluationist must claim that **the set of admissible precisifications is itself vague.** There is no sharp line between a precisification that is admissible and one that is not.

  **The Cost:**
  The Supervaluationist pays a **semantic price**.
  1.  **Formal Complexity:** Standard model theory requires sharp sets. To have a "vague set" of precisifications, you need a more complex semantics (often involving degrees of admissibility or a hierarchy of precisifications).
  2.  **The Collapse Objection:** This is your friend's main point. If the set of admissible precisifications is vague, isn't there a *fact* about how it is vague? If there is a fact about which precisifications are "borderline admissible," haven't we just pushed the sharp boundary up one level? If there is *no* fact, then the theory lacks a determinate semantics, threatening to collapse into incoherence.

  ### 3. Assessing Your Friend's Objection

  Is your friend right that HOV is *worse* for Supervaluationism than for Epistemicism?

  **Technically, yes. Philosophically, debatable.**

  Your friend is correct that Epistemicism has a cleaner *formal* handle on HOV. Williamson simply applies the Margin for Error principle recursively. The logic remains classical; the boundaries just multiply. There is no regress because the theory is happy to posit sharp boundaries at every level.

  Supervaluationism, however, faces a genuine dilemma:
  1.  **If admissibility is sharp:** The theory fails to eliminate sharp boundaries; it just hides them in the meta-language.
  2.  **If admissibility is vague:** The theory requires a semantics for vague sets, which often looks suspiciously like a degree theory (fuzzy logic) or requires an infinite hierarchy of "precisifications of precisifications."

  This is known as the **Problem of the Penumbra of the Penumbra**. If you say "It is indeterminate whether this is a precisification," you need a logic to handle *that* indeterminacy. If you use Supervaluationism again, you need a set of *super*-precisifications, leading to regress.

  **However,** the fact that Epistemicism *can* model HOV easily doesn't mean the model is *true*. It just means Epistemicism is willing to bite a very large bullet. Your friend's argument assumes that formal elegance outweighs metaphysical plausibility.

  ### 4. The Verdict: Which Price is Steeper?

  You asked for a verdict on which view pays the steeper theoretical price: Epistemicism's unknowable sharp boundaries or Supervaluationism's semantic revisions and HOV struggles.

  **My Verdict: Epistemicism pays the steeper price.**

  Here is the justification. While Supervaluationism struggles with the *logic* of HOV, Epistemicism fails on *metaphysical grounds* regarding the nature of the concepts involved.

  **1. The Nature of "Diner" (Artifact Concepts):**
  Your example was a "diner." This is a functional/artifact concept. These concepts exist *because* of human practices and intentions. Human intentions are not precise enough to ground a sharp boundary between 4 booths and 5 booths.
  *   **Supervaluationism** respects this: It says our collective intention was simply *indecisive*. There is no fact of the matter because we didn't make one.
  *   **Epistemicism** claims there *is* a fact of the matter, hidden from us. For artifact concepts, this implies a kind of magical realism. It suggests the world contains "diner-ness" particles or metaphysical structures that operate independently of human usage. This is ontologically extravagant. It is cheaper to revise our logic (Supervaluationism) than to posit invisible metaphysical cutoffs for social constructs (Epistemicism).

  **2. The "Ignorance" is not Ordinary Ignorance:**
  Williamson compares not knowing the cutoff for "heap" to not knowing the number of stars in the galaxy. But these are different. We could, in principle, count the stars. We *cannot*, even in principle, survey the usage of every English speaker to find the "diner" cutoff, because the usage *itself* is inconsistent.
  Epistemicism treats vagueness as a limitation of our *access* to the world. Supervaluationism treats it as a limitation of the *representation* itself. For linguistic vagueness, the latter is the more honest diagnosis.

  **3. The HOV "Regress" is a Feature, not a Bug:**
  Your friend argues that Supervaluationism's struggle with HOV is a fatal regress. I argue it is an accurate reflection of the phenomenon. Vagueness *is* unbounded. The reason Supervaluationism struggles to formalize HOV is that human language does not have a "stop" point for precision.
  Epistemicism stops the regress by fiat (by asserting sharp boundaries). Supervaluationism allows the regress to mirror the open-textured nature of language. While this makes formal semantics harder, it makes the *philosophy of language* more accurate.

  **4. The Collapse Objection is Manageable:**
  Modern Supervaluationists (like Rosanna Keefe) have argued that we can accept a "global" truth predicate without needing a sharp set of precisifications. We can treat admissibility as a primitive notion that is not itself subject to the same precisification requirements. It requires giving up the idea that every semantic fact must be grounded in a sharper semantic fact. This is a cost, but it is less severe than claiming there is a true number of booths that makes a diner a diner.

  ### Conclusion

  Your friend wins on **logical parsimony**: Epistemicism keeps classical logic intact and handles HOV with a simple recursive rule.
  You win on **metaphysical plausibility**: Supervaluationism aligns better with the intuition that vague concepts (especially social ones like "diner") do not have hidden sharp edges.

  **The Defensible Theory:**
  **Supervaluationism is the more defensible general theory.**
  The theoretical price of revising classical semantics (accepting truth-value gaps or supervaluational consequence) is lower than the price of claiming that the social world is populated by unknowable, sharp metaphysical boundaries. The difficulty Supervaluationism faces with HOV is a technical challenge in formalization; the difficulty Epistemicism faces with HOV is that it asks us to believe in "sharp shadows."

  Tell your friend this: Epistemicism solves the puzzle by denying the puzzle exists (there are no borderline cases, only unknown cases). Supervaluationism solves the puzzle by explaining why the puzzle arises (semantic indecision). The latter is a deeper explanation, even if the math is messier.
