answer: |-
  The package arrived on a Tuesday, wrapped in brown paper that smelled of dust and old glue. There was no return address, only Julian's name written in a hand that matched his own so closely it unsettled him. Not a forgery, but a mirror. Inside, nestled in shredded newsprint, was a bulb. It was dark, hard, and dormant. A *Lycoris radiata*, a spider lily, though the tag didn't say that. It didn't need to. Julian knew.

  There was no note. There never is in these transactions. To include a note would be to establish a causal link, a thread of history that could be pulled. This was not about history. It was about geometry.

  Julian sat at his kitchen table, the bulb resting on the wood like a small, dark heart. He understood the logic, or at least he understood the version of it that haunted the margins of decision theory papers he'd read years ago. It was the logic of the mirror. If you are a rational agent, and I am a rational agent, and we face a symmetric choice, we will arrive at the same conclusion without speaking. We cooperate not because we trust each other, but because we trust the algorithm that runs us both.

  But this was not a prison cell. This was a life.

  The sender—let's call them the Partner—had incurred a cost. Sourcing the bulb, wrapping it, mailing it anonymously. A small cost, but real. They had done this because they modeled Julian's mind. They predicted that Julian, upon receiving the bulb, would recognize the gesture. They predicted that Julian would understand that the only way to validate their expenditure was to replicate it.

  Julian looked out the window. The winter garden was dead, brown stalks rattling in the wind. He was tired. His savings were dwindling, the heating bill was overdue, and the idea of spending money on soil, on pots, on postage for a stranger who might not exist, felt like a hemorrhage.

  If he planted it, he would have to care for it. If he cared for it, he would have to propagate it. And eventually, he would have to wrap a new bulb and walk to the post office and send it to an address chosen by dice, or by a map, or by a name pulled from a phone book. He would never know if it arrived. He would never know if the recipient planted it. He would never know if the original sender was even alive.

  It was acausal. The trade happened outside of time. The Partner's gift was not an invitation; it was a bet. *I bet that you are me,* the silence of the package said. *I bet that your reasoning engine outputs 'cooperate' when faced with this input.*

  Julian picked up the bulb. It was cold.

  He thought about the alternative. He could throw it in the trash. He could buy groceries with the money he would have spent on soil. It was the rational choice for a singular, isolated entity. *Defect.* Maximize local utility. But if he defected, he proved the Partner's model wrong. He proved that the world was not made of mirrors, but of walls.

  And if the world was made of walls, then the Partner had never existed at all.

  That was the terrifying variable. The package might be a prank. It might be a glitch. It might be a hallucination born of isolation. If Julian sent a package back into the void, he might be shouting into a canyon that had no other side. He would be paying for the privilege of echoing.

  He went to the shed and found a terracotta pot, cracked but usable. He mixed the soil, his hands numb in the cold air. He planted the bulb two inches deep. He watered it.

  "Why?" he asked the dirt.

  The question wasn't for the plant. It was for the architecture of his own mind. Why cooperate when punishment is impossible? Why honor a contract that cannot be enforced?

  Because, he realized, the enforcement was internal. If he defected, he changed the kind of person he was. And if he changed the kind of person he was, he altered the probability that the Partner had existed in the first place. In a block universe, where past and future are fixed coordinates, his decision now was part of the same equation as the Partner's decision then. To defect was to retroactively erase the gift. To cooperate was to make it real.

  It was a magic trick where the magician and the audience were the same person, separated by time and paper.

  Weeks passed. The heating bill remained unpaid, but the house was warmer, or perhaps Julian was just less cold. A green shoot pierced the soil. It was slender, vulnerable, a question mark written in chlorophyll.

  Julian began to prepare the next package. He bought brown paper. He bought glue. He found a list of names from a local directory, people with surnames he didn't recognize. He rolled a die. *Three.* The third name.

  He dug up the new bulbs when the plant bloomed, a shock of red spider-legs against the gray winter. It was beautiful in a way that hurt. It demanded nothing and offered nothing. It simply *was*.

  He wrapped the bulb. He wrote the name on the label. He did not write a note. To write a note would be to claim credit, to insert his ego into the circuit. The trade required anonymity. It required the purity of the function.

  On the way to the post office, the wind picked up, biting through his coat. He held the package tight. He thought about the recipient. Maybe they were like him, sitting at a kitchen table, staring at a brown box. Maybe they were different. Maybe they were cruel, or busy, or dead.

  He thought about the original sender. Were they watching? Did they know? Or had they died the day after mailing the first bulb, never knowing if the chain continued?

  It didn't matter. That was the point. The trade was not about the exchange of goods. It was about the synchronization of will. It was two clocks ticking in different rooms, keeping the same time not because they were connected by gears, but because they were built to the same specification.

  Julian dropped the package into the mailbox. It slid down the chute with a soft thud. Gone.

  He stood there for a moment, his hand hovering over the slot. He felt a sudden, vertiginous loneliness. He had just spent money he didn't have to send a gift to a ghost, based on a promise from a phantom. There was no receipt. There was no thank you. There was only the quiet certainty that somewhere, in some other room, in some other time, someone was holding a bulb he had sent, or someone had sent one to him, and the space between them was bridged by nothing but the shared refusal to let the dark win.

  He turned and walked home. The wind was still cold, but the pocket where he had carried the package felt lighter. He would go inside and check the soil. He would wait for the green. He would trust that the math held, even if the variables were invisible.

  He would not check the mailbox again. To look for a return would be to break the symmetry. He had to be willing to be the only one who ever gave. That was the price of admission.

  Inside, he washed the dirt from his hands. The water ran brown, then clear. He looked at his reflection in the kitchen window. For a second, just a second, the face looking back didn't look like his own. It looked like someone waiting.

  Julian smiled, a small, private thing. He turned off the light, leaving the room in darkness, trusting that the sun would rise regardless of whether he was there to see it. That, too, was a trade.
