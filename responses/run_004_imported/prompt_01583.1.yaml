      *   *Point 2: Content vs. Institution.* The passage focuses on *dramatic content* (passions on stage). The broader letter focuses on *theatrical sociology* (gathering, luxury, idleness, the status of actors). Even if the plays don't preach vice, the *habit* of theatre-going erodes republican virtue.
      *   *Point 3: "Embellishment" as Corruption.* The user's translation notes theatre "embellishes" passions. Rousseau sees this embellishment as dangerous. Making vice look charming (even if not explicitly praised) makes it tolerable. This is the gradual shift.
