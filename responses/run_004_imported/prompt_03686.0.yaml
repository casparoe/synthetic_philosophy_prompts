      *   **Section 3: The Problem of Dynamic Inconsistency.** Focus on the moment of the final trade. If $A \succ C$ *all things considered* at that moment, choosing $C$ is irrational. If $C \succ A$ *all things considered* (because of the plan), then the cycle was never real to begin with.
