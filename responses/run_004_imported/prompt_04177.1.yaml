  **Title:** Semantic Precision and Ontological Illusion: A Reevaluation of the "White Horse is Not a Horse" Thesis

  **Introduction**

  The thesis that "a white horse is not a horse" (白馬非馬), advanced by the Warring States philosopher Gongsun Long, stands as one of the most enduring puzzles in the history of Chinese thought. To the uninitiated, the claim appears to be a blatant contradiction of empirical reality; to the logician, it presents a vexing challenge regarding the semantics of predication and class membership. As your seminar has explored, the apparent force of the argument often hinges on the ambiguity of the negative particle *fei* (非), which can signify either "is not identical to" or "is not a member of the category of." This linguistic flexibility invites the charge that Gongsun Long is merely engaging in sophistical wordplay, proving a trivial semantic distinction to imply a false ontological conclusion. However, dismissing the *White Horse Dialogue* as mere trickery ignores the possibility that it rests on a coherent, albeit alien, semantic framework. This essay argues that Gongsun Long's argument is not merely sophistical wordplay but constitutes a **qualified success**: it offers a defensible semantic claim regarding the non-identity of compound and simple terms under a mass-noun interpretation, yet it ultimately fails as a metaphysical thesis because it illicitly infers ontological exclusion from semantic distinction.

  **The Charge of Sophistry and the Class-Logic Reconstruction**

  The most common critique of Gongsun Long, championed by sinologists such as A.C. Graham, is that the argument relies on a fallacy of equivocation. In standard class logic, which imposes Western Aristotelian structures onto the text, nouns are treated as count nouns designating sets of individuals. Under this reconstruction, "horse" designates the set of all horses, and "white horse" designates the subset of horses that are white. The particle *fei* is then analyzed as either asserting non-identity ($A \neq B$) or non-membership ($A \notin B$).

  If the thesis "white horse is not horse" is read as "the concept 'white horse' is not identical to the concept 'horse'," the statement is trivially true but philosophically uninteresting. The intension of 'white horse' includes the attribute of color, whereas 'horse' does not. However, Gongsun Long's interlocutor clearly understands the claim to be that a white horse cannot be categorized as a horse—that seeking a white horse is not seeking a horse. This implies a claim about extension or membership ($A \notin B$), which is empirically false. The sophistry charge holds that Gongsun Long demonstrates the intensional non-identity to trick the listener into accepting the extensional exclusion. Under this class-logic reconstruction, the argument fails because it conflates the properties of a concept with the membership of the objects falling under that concept. It treats the Name (*ming*) as if its internal structure dictates the ontological status of the Actuality (*shi*), violating the basic logical principle that a subset remains a member of the superset regardless of intensional differences.

  **The Mass-Noun Hypothesis: A Charitable Reconstruction**

  To rescue Gongsun Long from the charge of logical fallacy, Chad Hansen proposes a radical reinterpretation of Classical Chinese semantics. Hansen argues that applying Western count-noun logic to Classical Chinese is anachronistic. Instead, he posits that Chinese nouns function grammatically and ontologically as mass nouns, analogous to "water," "gold," or "furniture" in English. In this framework, nouns do not pick out countable individuals or classes, but rather "stuff-like" wholes or mereological sums.

  Under the mass-noun hypothesis, the term "horse" refers to the totality of horse-stuff in the world, while "white horse" refers to the totality of white-horse-stuff. The thesis "white horse is not horse" is then read as "the stuff *white-horse* is not identical to the stuff *horse*." This claim is semantically robust and strictly true. The extension of the stuff *white-horse* is a proper part of the extension of the stuff *horse*, but the two sums are not identical because the latter includes black-horse-stuff and yellow-horse-stuff which the former lacks. In mereological terms, the sum of white horses is not identical to the sum of all horses.

  For this reconstruction to render the thesis true, specific metaphysical conditions must obtain. First, reality must be conceived as divisible into stuffs rather than populated by discrete individuals. Second, naming must be understood as a process of carving out specific portions of this stuff rather than classifying individuals into sets. If these conditions hold, *fei* functions univocally as "is not identical to" regarding the extensions of the stuff-terms. There is no equivocation between membership and identity because membership is not the primary semantic relation; parthood and identity of stuff are. Consequently, Gongsun Long is not committing a logical error but is instead rigorously pointing out that a compound name picks out a different portion of reality than a simple name.

  **Evaluating the Metaphysical and Pragmatic Costs**

  While Hansen's mass-noun hypothesis successfully removes the label of "sophistry" by making the argument logically valid, it demands a high metaphysical price. For the thesis to be not just valid but sound, one must accept that the primary function of language is to distinguish stuffs rather than to facilitate action regarding individuals. This creates a tension with the pragmatic context of the dialogue itself. In the text, the interlocutor argues that if one wants a horse, a yellow or black horse will suffice, but if one wants a white horse, a yellow or black horse will not. This implies that the distinction matters for practical acquisition.

  Here lies the limit of Gongsun Long's success. Even if we grant Hansen's semantics, the argument succeeds only as a semantic analysis, not as a guide to ontology or action. The claim "white-horse-stuff is not identical to horse-stuff" is true, but it does not support the provocative implication that a white horse *cannot be used* where a horse is required. The argument isolates a feature of language—the fact that compound terms have narrower extensions than their simple components—but presents this feature as if it disrupts the categorical relationship between the terms.

  Furthermore, the mass-noun hypothesis struggles to account for the counting of horses, which does occur in Classical texts (e.g., "one horse," "two horses"). If nouns are purely mass-like, counting requires a classifier system that individuates the stuff. Gongsun Long's argument ignores this individuation to focus solely on the name's extension. By prioritizing the semantic precision of the Name (*ming*) over the pragmatic utility of the Actuality (*shi*), the argument achieves logical consistency at the cost of communicative function. It reveals that names are not transparent windows onto reality but have their own structural properties that do not map perfectly onto the things they name.

  **Conclusion**

  The debate over the "White Horse is Not a Horse" dialogue often polarizes into a choice between viewing Gongsun Long as a trickster exploiting linguistic ambiguity or a profound logician ahead of his time. However, a rigorous analysis requires a more nuanced verdict. The argument is not merely sophistical wordplay, as the mass-noun hypothesis demonstrates that the thesis can be rendered logically valid without equivocation, provided one accepts a mereological semantics where names refer to non-identical sums of stuff. In this specific semantic sense, Gongsun Long succeeds: he correctly identifies that the extension of a compound term is not identical to the extension of its head term.

  However, this success is strictly qualified. The argument ultimately fails as a metaphysical claim because it conflates semantic non-identity with ontological exclusion. By proving that the *name* "white horse" is not the *name* "horse," Gongsun Long implies that the *animal* designated by the former falls outside the category of the latter. This slide from semantics to ontology is unwarranted, even under Hansen's reconstruction. Therefore, the final verdict is that Gongsun Long's argument **succeeds as a semantic insight but fails as a metaphysical thesis**. It stands as a sophisticated demonstration of the divergence between language and reality, but it remains a paradox precisely because it asks us to prioritize the structural distinctions of names over the functional categories of the world. For your term paper, you should defend this position: the *White Horse Dialogue* is a defensible semantic argument that is misleadingly presented as an ontological truth, making it a profound failure that teaches us more about the limits of language than the nature of horses.
