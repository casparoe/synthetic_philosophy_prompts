      *   *Option 2 (Pick B):* Leaves money on the table (fraud loss), might be seen as luddite.
      *   *Option 3 (Hybrid/Challenger-Champion):* This is usually the industry best practice. Deploy B as the primary (stable, interpretable) and A as a challenger/shadow model, OR use B for high-risk decisions and A for scoring, OR approve A *conditionally* on robustness checks.
