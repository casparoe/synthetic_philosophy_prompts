answer: |-
  This is a fantastic fight to have had. It cuts right to the bone of one of the most common misunderstandings of Buddhist philosophy in the West: the idea that "no-self" (*anatta*) means "nothing matters" or "continuity is an illusion so boundaries don't count."

  Your friend is channeling a popular, Parfitian reading of Buddhism (often called "Buddhist Reductionism"). You are channeling the actual metaphysical mechanics of the Abhidharma and Yogacara systems.

  Here is the reconstruction of how Vasubandhu would rule on the Teleporter Case using his own machinery, followed by a verdict on who won the argument.

  ### The Vasubandhu Toolkit

  To understand the ruling, we have to look at the three specific concepts Vasubandhu uses to replace the "Self":

  1.  **The Skandhas (Aggregates):** A person is just a bundle of physical and mental events. There is no "owner" of these events.
  2.  **Prajñapti-sat (Conceptual Existence):** "Persons" exist only conventionally, like a "chariot" or an "army." They are labels we slap on a collection of parts for practical utility. They do not exist ultimately (*dravya-sat*).
  3.  **The Santana (Causal Continuum):** This is the clincher. Even though there is no permanent self, there is a **causal stream**. Moment A causes Moment B, which causes Moment C. This stream is what carries karma. It is like a flame passing from one candle to another: the flame is not the "same" substance, but the causal continuity is unbroken.

  ### The Ruling: Vasubandhu vs. The Teleporter

  If you put Vasubandhu in the chair to adjudicate the Teleporter Case, he would likely rule that **the person stepping out of the teleporter is NOT the same person in the karmically relevant sense**, and here is why, based on your specific points about interruption and duplication.

  #### 1. The Problem of Interruption (The "Destroy" Scenario)
  Your friend argues: *No self + same aggregates = same person.*
  Vasubandhu argues: *No self + broken causal series = new person.*

  For Vasubandhu, personal identity over time is not about similarity of parts (qualitative identity); it is about **causal continuity** (genetic identity).

  In the *Abhidharmakośa-bhāṣya*, Vasubandhu spends a lot of time explaining how karma ripens without a self to "hold" it. He uses the analogy of a seed and a sprout. The seed is not the sprout, but the sprout arises *dependent* on the seed in an unbroken chain.

  In the teleporter scenario where the original is destroyed:
  *   **The Causal Break:** The physical aggregates of the original body cease. The causal stream (*santana*) of that specific life is terminated.
  *   **The Copy:** The new body is assembled from *new* atoms based on *information*. For Vasubandhu, information transfer is not karmic causation. The causal link between the original neurons firing and the new neurons firing has been severed and replaced by a digital map.
  *   **The Verdict:** The being that steps out is a **new *santana*** that merely *resembles* the previous one. It is like lighting a new candle using a picture of an old candle, rather than the flame of the old candle.
  *   **Karmic Consequence:** If the original is destroyed, the karmic account of the original is effectively closed (or rather, the vessel for its ripening is gone). The new being starts with a fresh karmic slate, perhaps with memories that aren't theirs (a form of delusion). **This is death, not travel.**

  #### 2. The Problem of Duplication (The "Non-Destruct" Scenario)
  Your friend argues: *If there's no self, having two of "you" proves the self was a fiction all along, so who cares?*
  Vasubandhu argues: *Two streams = two distinct karmic trajectories = two distinct persons.*

  This is where your argument about the "two people" scenario is devastating to your friend's position.

  If the original body is *not* destroyed, you now have two streams of aggregates.
  *   **Divergence:** From the moment of duplication, Stream A (Original) and Stream B (Copy) begin having different experiences. Stream A feels the chair; Stream B feels the teleporter pad. Stream A gets hungry; Stream B does not.
  *   **Karmic Individuality:** In Buddhism, karma is strictly individual. I cannot eat your food and get full; you cannot reap my karma. If Stream A commits a murder and Stream B meditates, they generate different karmic seeds.
  *   **The Verdict:** Vasubandhu would say these are unequivocally **two different persons** conventionally speaking. The fact that they share a past up until time *T* does not make them the same person at time *T+1*.
  *   **Why this matters:** If your friend says "who cares, it's all fiction," they are ignoring the reality of *suffering*. Stream A and Stream B will both feel pain. If you kill Stream B, it is a murder. The "fiction" of the self does not negate the reality of the *dukkha* (suffering) experienced by the continuum.

  ### Parfit vs. Vasubandhu: Where the Fight Really Is

  Your friend is relying on Derek Parfit's interpretation of Buddhism. Parfit famously argued that because there is no "further fact" of personal identity, we should not fear death or teleportation. He thinks Buddhism supports the idea that **identity doesn't matter.**

  But Vasubandhu would push back. Vasubandhu argues that **identity is a convention, but causality is ultimate.**

  *   **Parfit:** "There is no deep self, so survival is just psychological connectedness. If that is preserved, I survive."
  *   **Vasubandhu:** "There is no deep self, so survival is just causal continuity. If that is broken, the stream ends."

  Parfit is willing to accept psychological connectedness (memories, personality) as enough for "survival." Vasubandhu requires *causal* connectedness (the actual momentum of the *santana*) for the transfer of karma and the continuation of the life-stream.

  ### The Verdict: Who Won?

  **You win on textual and metaphysical fidelity.**
  **Your friend wins on the "spirit" of Parfit's appropriation.**

  Here is the breakdown:

  1.  **Your Friend's Error:** They are committing the "Nihilist Fallacy." They assume that because the Self is a fiction, the *consequences* of the aggregates are also optional. They treat "no-self" as a license to ignore continuity. But for Vasubandhu, the whole point of no-self is to explain how continuity works *without* a soul. If you break the continuity, you break the system.
  2.  **Your Strength:** You correctly identified that the *santana* (causal series) is the load-bearing wall of Buddhist ethics. If teleportation interrupts the causal series (by destroying the original) or branches it (by creating a duplicate), it violates the conditions required for karmic continuity.
  3.  **The Nuance:** Vasubandhu would admit that the person stepping out of the teleporter is a "person" in the conventional sense (*prajñapti-sat*). We can talk to them, arrest them, and hire them. But in the *ultimate* sense (*paramartha-sat*), they are a new causal stream. If the original was destroyed, the original being has died.

  **The Final Ruling:**
  Vasubandhu would tell your friend: *"You are right that there is no Self to be teleported. But you are wrong to think that makes death irrelevant. The stream of consciousness is real enough to suffer, and real enough to carry karma. If you break the stream, you have killed a being. If you duplicate the stream, you have created a new being. The lack of a soul does not make the causal chain disposable."*

  You were right to call out the "too quick" reasoning. The "no-self" doctrine is not a get-out-of-metaphysics-free card; it is a much stricter account of causality than the "self" model. Your friend treated the Buddhist self like a ghost that doesn't exist; Vasubandhu treats it like a river that is real, but not a "thing." You can't teleport a river by draining it and filling a new bed with water; you've just made a new river.

  **Tell your friend they owe you a drink, because their *santana* caused your *dukkha* during that two-hour argument.**
