      *   *Skandhas (Aggregates):* A person is a collection of form, feeling, perception, formations, consciousness.
      *   *Kshanika-vada (Momentariness):* Everything exists only for a moment.
      *   *Santana (Continuum/Causal Series):* Personal identity is a convention applied to a causally connected stream of moments. Like a flame passing from one candle to another, or milk turning to curd.
      *   *Karma/Rebirth:* The moral weight of actions carries over *because* of causal continuity, not because a "self" carries it. If the chain breaks, karma doesn't transfer.
      *   *Convention vs. Ultimate Truth:* "Person" is a conceptual designation (*prajñapti-sat*) upon the ultimate realities (*dravya-sat*).

