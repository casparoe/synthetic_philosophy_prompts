      *   **Task:** Reconstruct Vasubandhu's ruling on the teleporter case using his own concepts (no-self, aggregates, causal series, karma) and determine who has the better reading (User or Friend).

  2.  **Deconstruct Vasubandhu's Philosophy (Abhidharmakośa-bhāṣya & Viṃśatikā):**
