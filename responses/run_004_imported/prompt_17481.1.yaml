      *   **The "Force and Justice" Quote:** Contextualize it. Pascal wasn't saying "might makes right" is *good*; he was saying it's how the world *operates* in the absence of God. He was diagnosing a disease, not prescribing a cure.
      *   **Custom and Law:** Explain Pascal's view on custom. He knows laws are often arbitrary. An arbitration clause is the ultimate "custom imposed by power." He would recognize it immediately as a mechanism of the "Order of Bodies."
      *   **Would he shrug?** No. This is the crucial pivot. Pascal's cynicism about human justice is meant to drive us to look for *higher* justice. If he saw a specific mechanism (arbitration) designed to hide injustice, he would likely call it a "diversion" (*divertissement*)—a way to keep people from thinking about the truth.
      *   **The Jansenist Angle:** Mention his religious context. Jansenists were anti-casuistry (loose moral reasoning used by powerful Jesuits to justify things). Arbitration clauses feel like legal casuistry—using technicalities to avoid moral obligation (paying fair wages).
