prompt: |-
  Ok this is a weird one but bear with me. I just found out my job contract has a forced arbitration clause buried in it, so even tho im pretty sure my employer messed up my overtime pay, I cant actually take them to real court - it just goes to some arbitrator the company basically picked and pays for. Meanwhile ive been half heartedly reading Pascal's Pensées bc a friend recommended it, and I hit that part where he says something like "justice without force is powerless, force without justice is tyrannical," and that since we couldn't make what's just strong, we just made what's strong count as just instead. Kinda hit way too close to home lol.

  Pascal obviously never heard of arbitration clauses or class-action waivers or any of that. But given what he says there, and I think somewhere else about custom and the "reason of effects," what do you think he'd actually make of stuff like mandatory arbitration in employment contracts today? Would he just shrug and go "yeah, thats how its always been, the powerful write the rules" - or is there something in his own thinking that would push him to call this out as a problem instead of just chalking it up to necessity?
reasoning: |-
