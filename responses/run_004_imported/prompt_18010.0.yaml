answer: |-
  Good evening. For those who don't know me, I'm the father of the bride. For most of my career, I was a biologist. I studied self-control in animals. Specifically, I watched pigeons.

  Now, before you picture a bird in a tiny suit resisting a cocktail, let me explain. I gave my pigeons a choice. They could peck a key for a small reward immediately, or wait for a larger reward later. Like many of us, they often chose the small, immediate treat. But here is the fascinating part: If I gave them the chance to peck a *different* key beforehand—one that locked away the small reward option—they would do it. They would restrict their own future freedom to ensure they got the better outcome.

  They were tying themselves to the mast. They were Ulysses.

  I mention this because I look at my daughter and her fiancé, and I see a convergence of fields that keeps me awake at night. My daughter builds models of how humans trade off rewards against time. Her fiancé is a philosopher who specializes in *akrasia*—weakness of will. Together, they are essentially a walking, talking laboratory experiment on commitment.

  And that brings me to the rings.

  From a certain perspective—and you know I love a certain perspective—a wedding ring is the ultimate precommitment device. It is a social, legal, and metallic signal that you have removed the option of the "smaller-sooner reward." It is a way of binding your future selves to the mast so that when the Sirens of inconvenience, or boredom, or difficulty sing, you cannot steer the ship toward the rocks.

  About a third of you are nodding along with the decision theory. The rest of you are wondering if I'm going to mention the open bar. But here is where the biologist in me has to yield to the father in me.

  If I stop at that joke, if I suggest that marriage is simply a clever trick to lock your future selves into a contract you might otherwise break, I would be doing you a disservice. In fact, both of you would object. You know better than anyone that a hyperbolic discounter can renege on any commitment device it likes. You can take the ring off. You can walk away. The lock is only as strong as the willingness to keep the key.

  And that is why this isn't just a rational solution to a decision-theoretic problem. If it were, it would be a prison.

  The pigeons tied themselves to the mast because they were conflicted. They wanted the small reward *and* the large reward, and they were at war with themselves. Ulysses tied himself to the mast because he feared his own nature.

  But marriage, at its best, is not about fearing your future nature. It is about trusting it.

  You are not wearing these rings to stop yourselves from leaving. You are wearing them to remind yourselves that you have already chosen. You are changing the value of the rewards. When you truly love someone, the "smaller-sooner reward" of being right, or being free, or being easy, loses its appeal. It doesn't taste as sweet. The precommitment doesn't work because you *can't* leave; it works because, having made this vow, you *won't* want to.

  My daughter, you model how people value time. My son-in-law, you study why we fail to do what we know is best. But tonight, you are not modeling, and you are not arguing. You are building.

  So, my advice is this: Use the rings. Not as shackles, but as anchors. When the storm comes—and it will—you won't need to calculate the discount rate of your affection. You won't need to debate the philosophy of obligation. You will just look at the gold, remember the mast you tied yourselves to, and realize you don't want to be untied.

  Let us raise a glass. To the pigeons, who taught us about restraint. To Ulysses, who taught us about endurance. And to [Daughter] and [Fiancé], who teach us that the best commitment is the one you keep not because you are bound, but because you are home.

  To the happy couple.
