prompt: |-
  A close friend of mine, a researcher on wild-animal suffering and s-risk at a small EA-aligned institute, died suddenly of a stroke last month at forty-one. She held a strict, suffering-focused, negative-utilitarian view -- that averting severe suffering has moral priority over producing happiness -- and for years she patiently corrected journalists, myself included, whenever we slid that into "so life generally isn't worth living" or "so a painless end to any suffering being is automatically good." I'm giving her eulogy next week, to a room split between colleagues who will hear any sloppy paraphrase of her ethics as a small betrayal, and relatives who've never heard the phrase "suffering-focused" and just want to hear that her life was full and good. Please write it: it needs to stay true to the narrow, actual shape of her view and resist both of those misreadings -- especially the harder, personal version the second one now takes, that her own death is somehow a relief -- while still comforting people who won't parse a single technical distinction.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** A close friend, researcher on wild-animal suffering and s-risk (suffering risks), 41 years old, died suddenly of a stroke.
      *   **Philosophy:** Strict, suffering-focused, negative-utilitarian view. Priority: averting severe suffering.
      *   **Common Misinterpretations to Avoid:**
          1.  "Life generally isn't worth living" (Nihilism/Pessimism).
          2.  "A painless end to any suffering being is automatically good" (Anti-natalism/Mercy killing implication).
          3.  *Crucially:* "Her own death is somehow a relief" (Given her sudden death, this is the most dangerous and hurtful misreading for the family).
      *   **Audience:** Split between EA (Effective Altruism) colleagues (who know the technical distinctions and will spot errors) and relatives (who don't know the jargon and just want to hear her life was good).
      *   **Goal:** Write a eulogy that honors her specific ethical framework without validating the harmful misinterpretations, while comforting the grieving family.

  2.  **Deconstruct the Ethical View (for accuracy):**
      *   *Suffering-focused ethics:* The moral urgency lies in preventing extreme pain. It doesn't mean happiness is worthless, but that suffering demands priority attention.
      *   *Not "Life isn't worth living":* It means we should make sure lives *are* worth living by removing the worst parts.
      *   *Not "Death is good":* Death prevents future suffering but also prevents future happiness and agency. For a person with projects and connections, death is a loss of the capacity to do good.
      *   *Application to her death:* Her death was a tragedy because it stopped her work of reducing suffering. It was not a "release" she would have welcomed in this context.

  3.  **Determine the Tone:**
      *   Respectful, precise, warm, humanizing.
      *   Needs to bridge the gap between technical philosophy and human emotion.
      *   Avoid jargon where possible, or explain it simply if necessary.
      *   Must explicitly affirm the value of *her* life to comfort the family.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Validate the shock. Address the room (colleagues + family).
      *   **Her Work (The "What"):** Explain what she did without getting bogged down in "negative utilitarianism." Focus on *compassion* and *urgency*. She cared about the worst pains.
      *   **Her Philosophy (The "How" - Tricky Part):**
          *   Need to clarify her view without using the trigger phrases.
          *   Frame it as: "She believed that if we see pain, we must fix it first."
          *   Address the "Life isn't worth it" misreading: "She didn't think life was bad; she thought we could make it better."
          *   Address the "Death is relief" misreading: "She valued the chance to help. Her death cuts that short."
      *   **Her Character (The "Who"):** She was patient (correcting journalists/friends). She was rigorous. She was kind.
      *   **For the Family:** Explicitly state that her life was full, meaningful, and that her death is a loss, not a mercy. This is crucial for the relatives.
      *   **For the Colleagues:** Acknowledge the intellectual legacy. The work continues.
      *   **Closing:** A call to action that unites both groups. Reduce suffering, cherish life.

  5.  **Refining the Ethical Nuance (Self-Correction during drafting):**
      *   *Initial thought:* Maybe quote her directly on negative utilitarianism.
      *   *Correction:* No, too academic. Translate it. Instead of "negative utilitarianism," use "priority of compassion."
      *   *Danger Zone:* The prompt specifically warns against the idea that her death is a relief. I need to be very clear that *she* valued her agency and her future.
      *   *Phrasing:* "She did not measure a life by the absence of pain, but by the presence of purpose."
      *   *Phrasing:* "To say her work was about suffering is not to say her life was defined by it."

  6.  **Drafting the Content (Iterative Process):**
      *   *Start:* "We are here to mourn [Name]."
      *   *Middle:* Talk about her corrections. She hated sloppy thinking. Why? Because sloppy thinking leads to real harm.
      *   *The Core Distinction:* She believed preventing agony was urgent. That doesn't mean joy doesn't matter. It means agony screams louder.
      *   *The Death:* A stroke is sudden. It stole her future. It did not "solve" anything. It created a void.
      *   *The Family:* You knew her as a sister/daughter/friend. That love was real. Her philosophy never denied that love.
      *   *The Colleagues:* We carry the torch. But we do it without distorting her memory.

  7.  **Final Polish:**
      *   Check against constraints: Did I imply life isn't worth living? No. Did I imply death is good? No. Did I comfort the family? Yes. Did I respect the colleagues' intelligence? Yes.
      *   *Tone Check:* Is it too cold? Add warmth. Mention her patience with *me* (the speaker).
      *   *Specific Phrase:* "She fought for a world where suffering is rare, not a world where life is absent."

  8.  **Final Review against the "S-risk" aspect:**
      *   S-risk is about preventing future astronomical suffering.
      *   Connect this to hope. She worked on the future because she believed in one.
      *   Her death truncates that future. That is the tragedy.

  9.  *(Self-Correction on "Negative Utilitarianism"):* Actually, mentioning the term might be okay if contextualized, but better to describe the *spirit* of it. Let's describe the *commitment* rather than the label. The prompt says relatives haven't heard "suffering-focused." I should explain the *intent* of that view.

  10. **Finalizing the Text:** (Proceeding to generate the eulogy based on these thoughts.)
answer: |-
  Friends, family, colleagues.

  We are here to mourn [Name]. We are here because forty-one years is far too short, and because a stroke is a violence that offers no meaning, only shock.

  I know this room is divided. On one side are those who worked with her, who know the specific architecture of her mind. On the other are those who loved her simply as she was: a sister, a daughter, a friend. My task, and I know [Name] would have appreciated the precision of the task, is to speak to both of you without betraying either.

  [Name] was a researcher. She spent her life thinking about suffering. Specifically, she thought about how to prevent the worst kinds of suffering, for humans and for animals, now and in the future. She held a view that was rigorous and demanding: that alleviating severe pain must take moral priority over creating pleasure.

  I say this because I know how she spoke. For years, she patiently corrected journalists, and she patiently corrected me. Whenever someone suggested her work meant that "life isn't worth living," she would stop them. Whenever someone implied that her ethics meant "death is a mercy," she would correct them.

  She did not believe life was a burden. She believed that pain was a burden we could lift.

  There is a dangerous shorthand people use about her work. They hear "suffering-focused" and they think "pessimism." They hear "priority of pain" and they think "death is preferable." I am standing here to tell you that [Name] would have rejected that logic utterly.

  She did not measure a life by the absence of pain, but by the presence of purpose. She believed that because suffering is so urgent, we must stay alive and stay engaged to fight it. To her, a life ended prematurely was not a relief; it was a lost opportunity to do good. It was a silencing of a voice that advocated for those who could not speak for themselves.

  So, to her family: Please hear this clearly. Her philosophy never diminished the value of *her* life. It never suggested that your love for her, or her love for you, was outweighed by the hardships of existence. She found deep joy in this room. She found deep meaning in her work. Her death is not a solution to anything. It is a tragedy. It is a loss of a future she was actively building.

  And to her colleagues: We honor her by being precise. We honor her by not sliding into the sloppy nihilism she spent her career correcting. We do not pay tribute to her by saying the world is too dark to inhabit; we pay tribute by doing what she did, which was to light specific, targeted lamps in the darkest corners.

  She was kind, but she was not soft. She knew the world contained agony, and she refused to look away. But she also refused to let that knowledge curdle into despair. She was one of the most hopeful people I knew, because she believed that suffering was not inevitable. She believed it was a problem to be solved.

  That is the legacy we carry. Not a belief that life is bad, but a commitment to making it better. Not a wish for an end, but a drive for a cure.

  [Name], you corrected us one last time by leaving us so suddenly. You reminded us that time is scarce, and that the work cannot wait. We will miss your rigor. We will miss your patience. And we will miss you.

  Rest well. We will take it from here.
