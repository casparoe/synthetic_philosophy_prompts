prompt: |-
  Hey, working on a handout for my seminar on Lewis's *Convention* and want a sanity check on somethig before I hand it to the TAs. Using Lewis's actual technical criteria for a regularity counting as a convention (roughly: it solves a recurring coordination problem, it's sustained by common knowledge and matching mutual expectations, and crucially it's arbitrary in his sense -- some other regularity would've worked just as well and would've been just as self-perpetuating), rank the following practices from most to least conventional in that strict Lewisian sense, as opposed to being better explained by independent moral force, legal sanction, or plain functional necessity: driving on the right side of the road, shaking hands as a greeting, queuing for a bus, tipping at restaurants, keeping promises, the meanings of ordinary words, monogamous marriage, and stopping at red lights.

  Give it to me as a JSON tier list, formatted like this:

  ```json
