      *   *Alignment:* Douglass aligns more with the *text* than the *history*. If the text says "liberty," and history says "no liberty for group X," Douglass sides with the text's potential for liberty. The "History and Tradition" test would likely have upheld slavery (since it was deeply rooted) or denied rights to women/minorities (since they weren't traditionally recognized).

  5.  **Analyze Douglass vs. Modern Originalism:**
