      *   *Key Tenet:* Anti-Intentism. What the framers *thought* doesn't matter if they didn't write it. "We must not judge the tree by its roots, but by its fruits." (Wait, actually he says we must look at the written instrument, not the secret motives).
      *   *Key Tenet:* Anti-Precedent/Practice. Just because the government *acted* pro-slavery doesn't mean the Constitution *authorized* it. Those actions were usurpations.
      *   *Key Tenet:* Canon of Liberty. In cases of ambiguity, interpret in favor of natural rights.

