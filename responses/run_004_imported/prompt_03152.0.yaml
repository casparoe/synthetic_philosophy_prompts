answer: |-
  This is a sharp reading of the Douglass-Garrison split. You are absolutely correct that the core disagreement was methodological: **Garrison argued from historical *reality* and *intent*, while Douglass argued from legal *text* and *principle*.**

  If we transplant Frederick Douglass into the current Supreme Court landscape, his reaction to the "history and tradition" test (articulated in *New York State Rifle & Pistol Association v. Bruen* and *Dobbs v. Jackson Women's Health Organization*) would likely be one of profound alarm. He would view it not as a validation of his own method, but as the resurrection of William Lloyd Garrison's.

  Here is how Douglass would likely analyze the modern "history and tradition" test, and where he fits (or doesn't fit) in modern originalism.

  ### 1. Douglass vs. The "History and Tradition" Test
  The "history and tradition" test posits that for a right to be protected, it must be "deeply rooted in this Nation's history and tradition." In *Bruen*, this meant looking at 1791/1868 regulations to see if modern gun laws fit. In *Dobbs*, it meant looking at 1868 to see if abortion was historically prohibited.

  **Douglass would see this as the Garrisonian argument applied to rights.**

  Recall Garrison's argument: *Look at how the document has been applied for 70 years. Look at the compromises. Look at the intent. The history proves the Constitution is pro-slavery.*

  Douglass's rebuttal was: *The fact that the government has uniformly violated the Constitution for 70 years does not change the Constitution. The fact that the Framers intended to protect slavery does not matter if they failed to write it into the text. We are bound by the law, not by the lawless practices of the past.*

  If Douglass applied the *Dobbs/Bruen* test to slavery in 1860, **he would lose.**
  *   **The Test:** Is the right to own human property "deeply rooted in history and tradition"?
  *   **The Answer:** Yes. Absolutely. It existed at common law, at ratification, and in practice for generations.
  *   **The Result:** Under the *Dobbs* methodology, slavery would be constitutionally protected because it was historically recognized.

  Douglass's entire constitutional theory was built on the idea that the **text** creates a standard *higher* than history. He argued that the words "We the People" and "Liberty" were aspirational and legal commands that *broke* with history, not codified it. He would argue that relying on "history and tradition" effectively constitutionalizes past injustices. If the history is racist, sexist, or authoritarian, the "history and tradition" test locks those flaws into the Constitution. Douglass would say the text is the tool we use to *fix* the history, not the mirror we use to reflect it.

  ### 2. Is Douglass an Originalist?
  This is where it gets complicated. By today's taxonomy, Douglass is a **Textualist**, but he is **not an Originalist** in the sense of Justices Scalia, Thomas, or Barrett.

  **Where he aligns with Originalism:**
  *   **Rejection of "Living Constitutionalism" (in the modern sense):** Douglass didn't believe the Constitution *changed* meaning over time. He believed it *always* meant liberty, even when people misunderstood it. He wasn't arguing for a new right to be discovered in 1860; he was arguing the right was there in 1787, hidden in plain sight.
  *   **Focus on the Written Instrument:** Like modern originalists, he distrusted judicial discretion and unwritten norms. He wanted to stick to the document.

  **Where he diverges from Originalism:**
  *   **Original Expected Application:** Modern originalism often asks, "What did the public understand this right to cover in 1791/1868?" (This is close to the "history and tradition" test). Douglass explicitly rejected this. He argued that even if every single Framer intended to protect slavery, if they didn't write it, it isn't there. He separated the *meaning of the words* from the *expectations of the writers*.
  *   **The Canon of Liberty:** Modern originalists claim to be neutral arbiters of historical meaning. Douglass was openly normative. He argued that when the text is ambiguous, you *must* interpret it in favor of liberty. This is a "substantive canon of construction." A modern originalist would say, "If the history shows they didn't mean liberty for Group X, then they didn't mean it." Douglass would say, "The word 'Person' means Person, regardless of who they thought it applied to."

  In modern terms, Douglass is closer to a **Natural Law Textualist**. He believes the text incorporates universal principles of justice that transcend the specific historical prejudices of the ratifiers.

  ### 3. The "Secret Intentions" vs. Public Text
  You noted that Garrison loved Madison's convention notes (secret intentions), while Douglass demanded strict adherence to the words on the page.

  The modern "history and tradition" test is actually a hybrid that leans back toward Garrison. By asking "what was traditionally recognized," the Court is effectively asking, "What did the society of that time *think* the Constitution protected?"

  Douglass would argue this is irrelevant. In his 1860 speech, *The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?*, he says:

  > "I confine myself to the written Constitution... I ignore all the pre-constitutional history... I ignore all the post-constitutional practice."

  He explicitly brackets out the very evidence *Bruen* and *Dobbs* rely on. He would argue that **practice is not law.** If the government spent 100 years violating free speech, the "history and tradition" test might suggest free speech isn't deeply rooted. Douglass would say the text protects speech, and 100 years of violation is just 100 years of crime, not a guide to interpretation.

  ### 4. Conclusion: Douglass as an Outsider
  Douglass does not map neatly onto the current Originalist vs. Living Constitutionalist binary.

  *   **He is not a Living Constitutionalist:** He doesn't think the meaning evolves. He thinks the meaning was perfect from the start, but we were too blind to see it.
  *   **He is not a Modern Originalist:** He refuses to be bound by the historical *understanding* or *application* of the text if that understanding conflicts with the plain meaning of the words and the principles of liberty.

  **The Verdict:**
  Douglass would view the "history and tradition" test as a **reactionary tool that sanctifies past oppression.** He would see it as the legal formalization of the Garrisonian surrender. Garrison said, "The history proves the Constitution is corrupt, so we must burn it." The modern Court says, "The history proves these rights don't exist, so we must deny them."

  Douglass's method was revolutionary: **The text is a promise that history has failed to keep, and it is our job to force history to catch up to the text.** He would likely argue that the "history and tradition" test turns the Constitution into a historical artifact rather than a governing law, binding the present to the moral failures of the past—exactly the trap he spent his life trying to escape.
