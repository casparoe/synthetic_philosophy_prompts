      *   Closing: Encouraging tone.

  *(Self-Correction Note)*: Wait, I need to be careful not to conflate "discounting for uncertainty" with "pure time preference." In the Ramsey Rule, $r = \delta + \eta g$. $\delta$ is pure time preference. $\eta g$ is the wealth effect. In personal finance, there's also risk of death. I should mention that *some* discounting is rational (I might not be alive), but *pure* time preference (I'm alive, I just don't care because it's later) is the target.

