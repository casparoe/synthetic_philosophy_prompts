answer: |-
  Kael stood before the Iron Skin suit, hanging suspended in the containment field. It looked like ordinary chainmail, but the guild logs labeled it "Class-5 Hazard." His job was simple: certify it for transport. The protocol required him to don the suit for ten seconds. If he misjudged its disposition, he would be a paste inside the armor before the safety drones could react.

  The hazard wasn't straightforward. Previous testers had reported conflicting data. Some claimed the suit crushed anyone who wore it; others walked away unharmed. Kael suspected the Simple Conditional Analysis was failing him here. "The suit is lethal iff it would crush me if worn" wasn't holding up. He needed to know *why* the tests varied. Was the lethality intrinsic but blocked, or absent but added?

  He activated his spectral calipers. He wasn't measuring heat or radiation; he was measuring structural tension in the metal fibers—the causal basis for compression. If the suit was inherently lethal, the fibers should be under high tension, waiting to snap shut. If it was inert, they should be slack.

  The readout flickered. Zero tension. The fibers were loose, dormant.

  Kael frowned. He ran a simulation: *Stimulus applied (skin contact).* In the simulation, the tension spiked instantly the moment contact was registered.

  Two possibilities remained. One: A **Mask**. The suit was inherently lethal (high tension), but a external dampening field was suppressing the crush during previous tests. If he disabled the field to move it, the mask would vanish, and the suit would kill him. Two: A **Fink**. The suit was inherently safe (zero tension), but a sensor wired to the collar detected contact and instantly tightened the fibers. The disposition to crush was added only at the moment of stimulus.

  He looked at the control box mounted beside the rack. A single red wire pulsed. This wire powered the external systems. If he cut it, he would disable whatever external mechanism was at play.

  If this was a Mask, the wire powered the dampeners. Cutting it removes the protection. The intrinsic lethal basis remains. Death.
  If this was a Fink, the wire powered the sensor that injected the lethal basis. Cutting it removes the trigger. The intrinsic safe basis remains. Life.

  The calipers didn't lie. The basis was absent *before* contact. A mask requires the basis to exist continuously, merely hidden. A fink allows the basis to be absent until the stimulus conjures it. The zero-tension reading proved the basis was not intrinsic to the suit itself. It was a fink.

  Kael drew his cutter. He severed the red wire. The hum of the containment room died. He stepped forward, pulled the Iron Skin over his tunic, and waited. The fibers remained slack. He breathed out, unbuckled the helm, and logged the item as "Secure."

  ***

  **Explanation:** The suit was a **fink** (specifically a reverse fink like Martin's electro-fink). The lethal basis (tension) was absent until the stimulus (wearing) triggered the device to add it. Had it been a **mask** (like Johnston's antidote case), the tension would have been present intrinsically but blocked extrinsically; cutting the wire would have removed the block and killed Kael.
