answer: |-
  You are right to be suspicious. The "Popper recanted" narrative is a classic case of academic telephone, where a nuanced philosophical position gets flattened into a rhetorical cudgel. If you print the standard defender's line ("Even Popper said natural selection is untestable!"), you will be technically half-right but philosophically misleading.

  Here is the breakdown of Popper's actual position, how it evolved, and how you can use it to cut through the standoff in your article.

  ### 1. Popper's Actual Position: From "Metaphysics" to "Testable Theory"

  Popper's relationship with Darwinism went through two distinct phases. Understanding the *reason* for the shift is more important than the shift itself.

  **Phase 1: The Critique (1974–1976)**
  In the mid-70s, Popper famously described Darwinism as a "metaphysical research programme." His objection was logical, not biological. He focused on the phrase "survival of the fittest."
  *   **The Tautology Charge:** Popper argued that if "fitness" is defined solely by "who survives," then the statement "the fittest survive" is a tautology (A = A). It is logically true but empirically empty. If a trait survives, it was fit; if it doesn't, it wasn't. You cannot imagine a scenario where the fittest *don't* survive, because if they didn't survive, they weren't the fittest.
  *   **The Verdict:** For early Popper, a theory that cannot be falsified is not scientific. Therefore, natural selection, in its general formulation, looked like metaphysics (a useful worldview, but not strict science).

  **Phase 2: The Clarification (1978)**
  In his essay *"Natural Selection and the Emergence of Mind,"* Popper softened this stance significantly. He did not issue a full "recantation," but rather a crucial clarification.
  *   **The Shift:** Popper conceded that while the *general principle* of natural selection might risk tautology, **specific applications of it are testable.**
  *   **The Reasoning:** He realized that biologists do not actually define fitness merely by survival. They define it by specific physiological or behavioral traits (e.g., camouflage, metabolic efficiency) that can be measured *independently* of whether the organism survives.
  *   **The Distinction:** Popper drew a line between **Evolution as History** and **Selection as Mechanism**.
      *   *Evolution (Descent with Modification):* He accepted this as a historical fact.
      *   *Natural Selection:* He accepted this as a scientific mechanism *provided* it generates specific, risky predictions.
      *   *Historical Explanation:* He remained skeptical that evolutionary biology could produce universal laws like physics (e.g., gravity) because history is singular and unrepeatable. However, he conceded that singular historical events can still be explained scientifically if the causal mechanisms are testable.

  **The Bottom Line on Popper:** He never claimed evolutionary biology was pseudoscience. He claimed it risked becoming unscientific *if* practitioners relied on vague, post-hoc definitions of fitness. He challenged biologists to make their claims more rigorous. Biologists accepted this challenge, refined their definitions of fitness, and moved on.

  ### 2. Implications for the "Just-So Story" Charge

  This history dismantles the rhetorical standoff you are witnessing. Both the Critic and the Defender are using Popper as a shield, but neither is using him correctly.

  **The Defender's Error (The "Tu Quoque" Trap)**
  *   **The Argument:** "You say Evo Psych is untestable, but Popper said Natural Selection is untestable, so you must reject all evolution."
  *   **Why it fails:** This relies on Popper's 1974 view, which he modified in 1978. Furthermore, modern biology resolved the tautology problem by defining fitness independently of survival.
  *   **Your Takeaway:** You can report that this defense is outdated. Accepting evolutionary biology does not require accepting that *all* selection-based explanations are unfalsifiable. Biology cleared that bar; Evo Psych is being asked to clear it too.

  **The Critic's Error (The "Inherent" Trap)**
  *   **The Argument:** "Evo Psych is inherently untestable because we can't time-travel to the Environment of Evolutionary Adaptedness (EEA)."
  *   **Why it fails:** Popper's later view suggests that historical sciences *are* valid if they test the *mechanism*, not just the history. We don't need to time-travel if we can test the functional logic of the trait in the present.
  *   **Your Takeaway:** The charge shouldn't be that Evo Psych is *impossible* to test, but that specific studies often *fail* to test rigorously.

  ### 3. A Principled Way to Distinguish Science from "Just-So"

  You asked if Popper's framework gives us a way to tell a well-supported hypothesis from an untestable story. It does, but not by asking "Is this falsifiable?" (Yes/No). Instead, Popper asks: **"How risky is this prediction?"**

  Here is a framework you can offer your readers to evaluate specific Evo Psych claims:

  **A. Independent Testability (The Tautology Check)**
  *   **Just-So:** Defines the trait's function by its existence. (e.g., "Men pursue status because it increased reproductive success." How do we know it increased success? "Because men pursue it.")
  *   **Science:** Defines the adaptive value independently of the behavior. (e.g., "Status correlates with resource access; resource access correlates with offspring survival in hunter-gatherer analogs; therefore, status-seeking mechanisms should be calibrated to resource variance.")

  **B. Risky Predictions (The "No" Check)**
  *   **Just-So:** Explains the data after the fact. It fits any outcome. (e.g., "Women prefer X because it's adaptive." If they preferred Y, the theorist would say "Y is adaptive.")
  *   **Science:** Commits to a specific outcome that could prove it wrong. (e.g., "If this jealousy mechanism is an adaptation to paternity uncertainty, it should be triggered by *sexual* infidelity more than *emotional* infidelity in men, but the reverse in women. If we find the opposite, the hypothesis fails.")
  *   *Note:* This refers to the famous Buss study. Whether that specific study holds up is debated, but the *structure* of the claim is falsifiable.

  **C. The Null Hypothesis (The Gould/Lewontin Check)**
  *   Popper was worried about theories that explain everything. Stephen Jay Gould (who coined "Just-So Story") worried about adaptationists ignoring other mechanisms.
  *   **Science:** Actively tests against alternatives. A robust Evo Psych paper doesn't just show data fits an adaptation; it shows the data fits adaptation *better* than it fits cultural learning, genetic drift, or developmental byproducts (spandrels).
  *   **Just-So:** Assumes adaptation is the default and ignores the null.

  ### 4. How to Frame This in Your Longread

  You can position this not as a war between "believers" and "skeptics," but as a methodological maturity curve.

  1.  **Acknowledge the Grain of Truth:** Early Evo Psych (late 80s/early 90s) often relied on "armchair adaptationism" that would have made Popper wince. They often assumed a trait existed, therefore it was adaptive.
  2.  **Highlight the Shift:** Modern Evo Psych has largely internalized Popper's (and Gould's) critiques. The best work now focuses on **conditional adaptations** (if environment X, then trait Y) which are highly testable.
  3.  **The Verdict:** The "untestable" charge is no longer a blanket indictment of the field, but a quality control filter for specific papers.
      *   *Bad Evo Psych:* "We like art because it signaled fitness to mates." (Untestable, post-hoc).
      *   *Good Evo Psych:* "If art signaled fitness, production should peak during mating age and decline after pair-bonding, controlling for leisure time." (Testable, risky).

  **Summary for your article:**
  Popper didn't let evolutionary biology off the hook; he put it *on* the hook. He demanded that "survival of the fittest" be turned into specific, testable claims about traits and environments. The defenders of evolutionary psychology are wrong to cite Popper as a shield against falsifiability. Popper is actually the critic's best friend—he is the one who demands that we stop telling stories that fit any outcome and start making predictions that could prove us wrong. The "just-so story" charge is valid, but only when applied to specific, lazy hypotheses, not the entire discipline.

  This nuance allows you to respect the science of evolutionary biology while maintaining rigorous skepticism toward pop-science headlines about why humans love gossip or cheat on spouses.
