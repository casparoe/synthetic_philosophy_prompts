answer: |-
  This is not a dumb example at all. In fact, it is a pristine, real-world instantiation of problems that occupy people in philosophy of language, legal theory, and social ontology for entire careers. You are essentially staring directly at the "rule-following paradox" (Wittgenstein/Kripke), the "open texture of law" (Hart), and the problem of "constructive interpretation" (Dworkin), all wrapped up in a $600 fantasy football dispute.

  Since you work in ethics and political philosophy, I can skip the intro to normativity and get straight to the structural issues. Here is how I would break down the metaphysics and the normativity of your situation.

  ### 1. Is there a "fact of the matter" about 2013 intent?

  You ask: *Is there actually some fact about what we collectively meant in 2013... that better evidence could in principle turn up?*

  The short philosophical answer is: **Probably not.**

  The longer answer depends on your theory of meaning and intention.
  *   **The Psychological View:** If meaning is just a mental state, did the six of you have a specific neural configuration in 2013 regarding "three-way ties involving rescheduled games"? Almost certainly not. You didn't imagine the scenario. Therefore, there is no psychological fact to retrieve.
  *   **The Dispositional View:** Maybe the meaning isn't a specific thought, but a *disposition* to apply the rule in certain ways. If we had asked you in 2013, "What if there's a three-way tie?" would you have answered X or Y? The problem is, your current conflicting memories suggest you weren't disposed to anything specific until *now*. The "disposition" is being created retroactively by the stakes.
  *   **The Communal/Conventional View:** Meaning is established by public usage. In 2013, the public text (the group chat) was underdeterminate. It had a "core" of meaning (how to break simple ties) but a "penumbra" (Hart's term) where the rule runs out. In the penumbra, there is no fact of the matter until a decision is made.

  **The Verdict:** The belief that there is a hidden fact waiting to be discovered is a form of **semantic illusion**. You are treating the rule like a physical object buried in 2013 dirt, rather than a social practice that evolves. The conflicting, self-serving memories are actually evidence *against* a shared fact. If there were a fact, convergence would be more likely. The divergence suggests the "intent" is being constructed in the present to serve present interests.

  ### 2. Is the question confused?

  You ask: *Is the whole question somehow confused, such that there was never really a fact of that kind to begin with?*

  It is not *confused*, but it is **category-mistaken**. You are asking a semantic/historical question ("What did we mean?") to solve a normative/political problem ("Who gets the money?").

  In legal philosophy, this is the difference between **Originalism** (what was the original public meaning?) and **Living Constitutionalism** (how does this rule function best within the ongoing practice?).

  When a rule runs out (a "hard case," in Dworkin's terms), judges don't actually find the answer in the past. They construct an interpretation that fits the existing material best while also satisfying principles of fairness and integrity *now*.

  So, the question "What did we mean?" is the wrong question. The right question is: **"What ruling best preserves the integrity of the practice we have sustained for 11 years?"**

  ### 3. If there is no fact, is the decision arbitrary?

  You ask: *Does that mean whatever we decide now is just arbitrary, or is there still some principled way to settle it?*

  It does **not** have to be arbitrary. Just because the *past* doesn't dictate the answer doesn't mean *anything goes*. You have resources for a principled decision that don't rely on fictional historical facts.

  Here are three frameworks you can propose to the group (speaking their language, not just philosophy jargon):

  **A. The "Purpose of the Rule" Argument (Teleological)**
  Why did you create the tie-breaker rule in 2013?
  *   Was it to reward the team that performed best over the season?
  *   Was it to reward the team that performed best in head-to-head matchups?
  *   Was it to introduce randomness to keep things exciting?
  If you can agree on the *purpose* of the tie-breaker, you can apply that purpose to the new case. If the purpose is "reward season-long consistency," apply the metric that best measures that. If the purpose is "head-to-head dominance," apply that. This shifts the debate from "What did we say?" to "What are we trying to do?"

  **B. The "Veil of Ignorance" Argument (Rawlsian)**
  Since everyone is biased by their current standing, ask them to vote on the *rule interpretation* without knowing which team it benefits.
  *   Write down Interpretation A and Interpretation B.
  *   Do not reveal which team wins under which interpretation until *after* everyone has voted on which interpretation is "fairer" or "more consistent with league history."
  *   If they can't do this, it proves they are acting in bad faith, and you move to option C.

  **C. The "Acknowledged Indeterminacy" Argument (Procedural)**
  If the group cannot agree on purpose or fairness, you must acknowledge the metaphysical reality: **The rule is silent.**
  When a contract is silent and parties cannot agree, the default is not "guess the past intent," it is "split the difference" or "randomize."
  *   **Split the pot:** Acknowledge that the league rules failed to adjudicate this, so the money is returned/distributed equally. Bragging rights are shared (or vacated).
  *   **Randomization:** Flip a coin. This is actually highly principled. It acknowledges that since the competitive criteria (the rules) have run out, the only fair remaining arbiter is chance. It preserves the competitive integrity of the *season* (since the rules didn't decide it) without pretending a fake rule existed in 2013.

  ### My Recommendation

  As a peacemaker, I would suggest you frame it this way to the group:

  > "Philosophically, we are looking for a fact about 2013 that doesn't exist. We didn't predict this scenario, so we didn't intend anything specific about it. Our memories are unreliable because they are being written by our current desires.
  >
  > "We have two choices. We can pretend there is a right answer and fight until the league dissolves in bitterness. Or, we can admit the rule has 'open texture' and decide based on what keeps this league going for year 12.
  >
  > "I propose we vote on which interpretation feels more consistent with how we've *actually* played the game for 11 years, not what we think we meant. If that splits 3-3, we split the pot. The league's survival is worth more than $100 each."

  **The Bottom Line:**
  There is no fact of the matter about the 2013 intent regarding this specific contingency. The "meaning" of the rule is being constituted *now*, by your decision. That doesn't make it arbitrary; it makes it **legislative**. You are not judges discovering law; you are a legislature passing a new amendment to cover a gap. Own that power, and use it to save the league.
