      *   The user has a deep auditory connection but zero visual data.
      *   *Verdict:* The user's doubt is scientifically and psychologically grounded. The editor is relying on a poetic or philosophical notion ("unity of self") rather than cognitive reality.

  4.  **Consider the Specific Context (Dancers):**
