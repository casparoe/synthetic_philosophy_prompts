answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I have the privilege of being [Groom]'s friend and colleague. We've spent the last few years reading dense legal theory together, which is a specific kind of bonding. Most people bond over beers; we bonded over footnotes.

  So, when [Groom] asked me to give this toast, I knew I had a challenge. Roughly half of you are family and friends who want to hear about love. The other half are our jurisprudence cohort, who will physically wince if I misstate the holding of *Law, Liberty, and Morality*.

  [Groom] wrote his dissertation chapter on the Hart-Devlin debate. For the family: in the 1950s, Lord Devlin argued that society is held together by a shared morality, and if the law doesn't enforce that morality, society will fall apart. He called it the "disintegration thesis."

  H.L.A. Hart disagreed. Hart argued that just because a majority finds a private, consensual act immoral, that does not give the state the right to criminalize it. He grounded this in the harm principle: unless you are hurting someone else, the law should leave you alone.

  Now, for my cohort: I know Hart's claim was jurisdictional, not axiological. He didn't argue that private conduct was inherently *good*; he argued it was *none of the law's business*. He defended the space for liberty, not necessarily the moral content of that liberty.

  But here is why that matters for [Groom] and [Partner].

  Because Hart won that argument, the state does not get to vote on the worth of [Groom] and [Partner]'s relationship. The law provides the structure—the negative liberty, if you will—but it is silent on the joy, the commitment, and the love that fills it. Hart cleared the room so that the only voices that matter today are theirs, and ours.

  [Groom], you've spent years studying the boundaries of law and morals. But today, you don't need a theory. You have a promise. The law can protect your right to make it, but only you can give it meaning.

  So, to the cohort: let's agree that the separability thesis holds. And to the family: let's agree that love needs no enforcement.

  Please raise your glasses. To [Groom] and [Partner]: May your life together be free from coercion, rich in consent, and full of a happiness that no philosopher could ever define.

  To the happy couple.
