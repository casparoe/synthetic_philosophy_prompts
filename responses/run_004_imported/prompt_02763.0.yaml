answer: |-
  The mud had a memory. It held the hoofprints of yesterday until the rain filled them again, swallowing the iron shoes of the horses. In the command yurt, the air smelled of wet wool and fermented mare's milk.

  Batu stood over the table, his finger tracing the line of the Danube. To the west, the parchment was blank except for a few sketched rivers and the word *Ocean* written in shaky ink. He lingered there. For a heartbeat, he wasn't in Hungary; he was riding through the rain past the last stone tower, past the forests of the Franks, all the way to the salt water where the earth simply ended. He could feel the ghost of it, the momentum of a decade that had broken kingdoms like dry twigs.

  The flap opened. The messenger was coated in dried foam, his horse probably dead outside. He didn't bow low enough for news of victory.

  Subutai didn't look up from the ledger he was studying. He was counting arrows, rations, the weight of the forage. The horses were thin; the spring thaw had turned the plains into a bog that shattered axles. The stone castles here didn't burn like the wooden forts of the Rus. They sat on the hills, grey and stubborn, refusing to fall.

  The messenger whispered. One word, really. *Ögedei.*

  The sound was small, smaller than the wind rattling the yurt ropes.

  Batu's finger stopped on the blank space of the map. The ambition in his posture didn't vanish, but it shifted, curving inward. The Kurultai would need him. The wolves would circle the throne in Karakorum. If he wasn't there, another would take the scent.

  Subutai closed the ledger. He looked at the mud caking the boots of the messenger, then at the thinning stack of supply reports, and finally at Batu. The old general's face was unreadable, a landscape of old scars. He rolled up the map of Hungary, hiding the blank western edge inside the cylinder.

  "The road home is long," Subutai said. His voice was flat. It could have been about the distance to Karakorum, or the distance they had already come.

  Batu nodded. He stepped out of the yurt. The rain was falling again, soft and persistent. He looked west, where the sky was grey over the unconquered hills, then turned his horse east, toward the steppe.

  Behind them, the stone towers remained on the ridges. The horses began to move, churning the mud, leaving the same deep ruts whether they were advancing or retreating.
