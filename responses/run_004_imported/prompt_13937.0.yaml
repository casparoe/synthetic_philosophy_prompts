answer: |-
  The mangrove swamp breathed around them, a wet, rhythmic heaving of roots and tide. Elias wiped the salt from his notebook, the paper warping in the humidity. Beside him, Nalo stood perfectly still, one foot hovering over a patch of sediment that looked, to Elias's trained eye, identical to the solid ground they had crossed ten minutes prior.

  Nalo pointed a dark, calloused finger at the mud. "Zara," he said.

  Elias paused. This was the bind. It was always the bind.

  For three weeks, Elias had been embedded with Nalo's community, attempting what Davidson called radical interpretation. He had no dictionary, no shared history, no bridge of prior concepts. He had only Nalo, the world, and the principle of charity. He had to assume Nalo was rational and mostly right about his immediate environment. Without that assumption, interpretation was impossible; you couldn't solve for meaning without knowing belief, and you couldn't solve for belief without knowing meaning. They were two variables in a single equation.

  Previously, "Zara" seemed straightforward. Nalo had said it when stepping into knee-deep water. He had said it when rain slicked the rocks. Elias had tentatively mapped *Zara* to *Wet* or *Fluid*.

  But now, Nalo was hovering over dry-looking sediment. It looked solid. Elias tested it with the toe of his boot; it held his weight.

  If Elias held the meaning of *Zara* fixed as *Wet*, then he had to attribute to Nalo a false belief: Nalo believed this dry ground was wet. But Davidson's constraint warned against this. You cannot build a theory of meaning on the back of massive error. If you assume the speaker is constantly wrong about the obvious features of their world, you aren't interpreting them; you're diagnosing them. To understand Nalo, Elias had to assume Nalo was right.

  So, if Nalo is right, and he says *Zara*, then the ground must be *Zara*.

  Elias looked at the ground. It looked solid. But Nalo's body language was taut, poised for retreat. This was triangulation in real-time: Elias, Nalo, and the patch of earth. The meaning wasn't in Nalo's head, and it wasn't in the mud. It was in the line connecting them.

  "If I assume he's wrong," Elias muttered to himself, the pen hovering, "I break the circuit. I make him irrational. If I assume he's right, I have to break my own perception."

  It was an uncomfortable surrender. The Principle of Charity wasn't about kindness; it was about the constitutive conditions of thought. To treat Nalo as a speaker was to treat him as a rational agent navigating a shared world.

  Nalo lowered his foot slightly. The surface rippled.

  It wasn't solid. It was a crust over a sinkhole.

  Elias froze. His senses had failed; Nalo's had not.

  If Elias had insisted that *Zara* meant *Wet* based on previous data, he would have concluded Nalo was hallucinating water on dry land. He would have attributed a false belief. But by holding Charity fixed—by assuming Nalo's belief about the ground was *true*—Elias was forced to revise the meaning of *Zara*.

  It didn't mean *Wet*. It meant *Unstable*. Or perhaps *Yields*.

  The distinction was vital. *Wet* was a property of the substance. *Unstable* was a relational property between the agent and the substance. This was the nuance Quine missed. It wasn't about matching words to objects; it was about matching words to the speaker's verified interaction with objects.

  "Zara," Nalo said again, louder this time. He looked at Elias, then at the ground, then back at Elias.

  He was inviting Elias into the triangulation. He wasn't just labeling the world; he was checking to see if Elias saw what he saw. Meaning required two creatures responding to a shared cause.

  Elias closed his notebook. The theoretical bind had become physical. He could step forward, asserting his own interpretation of the ground (Solid), effectively labeling Nalo as mistaken. Or he could step back, accepting Nalo's assessment, which would force a total rewrite of the lexical entry for *Zara*.

  If he stepped forward and sank, he proved Nalo right, but he might die before updating his theory. If he stepped back, he validated the Charity principle. He admitted that his access to the world was mediated by his interpretation of Nalo, just as Nalo's was mediated by his interpretation of the world.

  Elias stepped back.

  The moment his weight shifted away, Nalo exhaled, a sharp hiss of tension release. He pointed again. "Zara." Then he pointed to a tangled root system five meters to the left. "Koro."

  Elias moved to the roots. They looked fragile, tangled, precarious. By his previous logic, *Koro* should mean *Safe* or *Solid*. But Elias didn't assume that yet. He waited. He watched Nalo.

  Nalo stepped onto the roots. They held.

  Elias realized the structure of the language wasn't mapping nouns to objects. It was mapping predicates to affordances. *Zara* wasn't a thing; it was a warning about a relationship. *Koro* wasn't a place; it was a permission.

  "You're not describing the world," Elias said softly, knowing Nalo couldn't understand the English, but needing to articulate the shift. "You're describing your grip on it."

  This was the wall his students hit every year. They wanted to treat interpretation like code-breaking, like *Arrival*. They wanted to find the cipher where *Zara* = *Quicksand*. But there was no cipher. There was only the ongoing, dynamic adjustment of belief and meaning to maximize agreement.

  If Elias assumed Nalo was irrational, the code remained unbroken. If Elias assumed Nalo was right, the code dissolved into action.

  Nalo motioned for them to move. The tide was rising, the water creeping closer to the *Zara* patches.

  Elias followed. He didn't look at his notebook. He looked at Nalo's feet. He watched where Nalo placed his weight. He watched the shared world they were navigating.

  Later, back at the campfire, Elias opened the notebook again. He crossed out *Zara: Wet*. He wrote *Zara: Yields under weight*.

  He felt the familiar itch of uncertainty. Was it *Yields*? Or was it *Danger*? Or *Not-To-Be-Stepped-On*? He couldn't know yet. He needed more data points. He needed more moments where his own perception clashed with Nalo's, forcing him to choose between attributing error or revising meaning.

  Every time he chose error, the connection frayed. Every time he chose Charity, the meaning sharpened.

  He looked up. Nalo was staring at the fire. He pointed at a spark rising into the dark. "Vae," he said.

  Elias watched the spark. It was hot. It was light. It was dying.

  He remembered the *Zara* incident. He remembered the temptation to trust his own eyes over Nalo's. He remembered that trusting his own eyes would have made Nalo a stranger, a creature whose thoughts did not map to the world. To make Nalo a speaker, Elias had to make him a neighbor.

  Elias didn't write anything down. He just watched the spark, waiting to see if Nalo reached for it or pulled away. The meaning would be in the reach.

  "Vae," Elias repeated.

  Nalo looked at him. For a second, the triangle closed. The spark, the speaker, the interpreter. There was no translation happening here, no bridge between two separate interiors. There was only the shared cause of the spark, and the shared assumption that they both saw it, and that what they saw was real.

  Elias put the pen down. He understood now why the diagrams on the whiteboard never worked. You couldn't draw the tension. You couldn't diagram the risk. Radical interpretation wasn't a puzzle to be solved in a seminar room. It was a wager you made every time you opened your mouth, betting that the other person was mostly right, so that you could both be right together.

  "Vae," Nalo said again, and passed him a stick to tend the fire.

  Elias took it. The wood was solid. The fire was hot. And for the first time in three weeks, he wasn't trying to decode the world. He was just living in it, with someone else.
