      *   **Goal:** A handout resource that shows students *why* the debate matters beyond shouting "Know!" vs. "True!".

  2.  **Character Conceptions:**
      *   **K (Knowledge):** Needs to emphasize the *constitutive* rule of assertion. Assertion is a unique speech act defined by its norm. The "lottery intuition" is the strongest evidence. Needs to handle the "high probability" objection by distinguishing probabilistic support from knowledge.
      *   **T (Truth):** Needs to argue that truth is the *internal* goal of assertion, while epistemic constraints (like knowledge) are *external* conversational norms (Gricean). Needs to explain the lottery intuition via misleading evidence or risk of error, not a lack of a specific mental state. Needs to handle Moorean absurdity via belief/truth tension, not knowledge/belief tension.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start *in media res* regarding the student complaint ("shouting 'know!' and 'true!'"). This sets the meta-tone.
      *   **The Lottery Case (Round 1):**
          *   T starts: It's just about risk. We don't assert because we might be wrong. Truth is the aim, but we need safety to hit the aim.
          *   K counters: It's not just safety. A justified true belief (without knowledge) in a lottery case still feels wrong to assert. It's the *status* of the proposition.
          *   *Refinement:* K needs to hit the specific prompt requirement: Why *knowledge* and not just *high probability*? K should argue that high probability is compatible with *not knowing*, and the assertion feels improper *because* we lack knowledge, not because the probability is 0.9999.
