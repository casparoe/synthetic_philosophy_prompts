          *   K's defense: This is a case of *proper* assertion but *improper* belief, or perhaps he *does* know in a contextual sense? No, standard Williamsonian line is tricky here. K might argue these are edge cases where the norm is satisfied (truth/knowledge is present in the community) or that they are actually improper but excusable. Let's go with the "excusable but improper" or "contextual knowledge" angle. Actually, the strongest K line is often that Selfless Assertion is *assertorily proper* but *morally/ professionally* required, suggesting the norm might be nuanced. Or, K can argue that in those cases, the speaker *does* know (via testimony) even if they don't believe. Let's have K struggle a bit here to show engagement.
          *   *Better approach for dialogue:* T uses it to show Truth + Evidence is enough. K argues that in those cases, the speaker actually *does* know (they have the evidence, they just lack belief), so the Knowledge Norm holds (Knowledge doesn't require belief? No, that's too controversial). Let's have K argue that Selfless Assertion shows the norm is *warranted assertibility* which tracks knowledge, even if belief is missing.
