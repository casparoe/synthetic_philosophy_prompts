answer: |-
  Kate: The student has a point, though. If we're not careful, this does devolve into a stipulation contest. You say assertion is constituted by a rule requiring truth; I say it's constituted by a rule requiring knowledge. Why should the seminar care which rule is the "real" one?

  Tom: Because the stakes are about the architecture of our social practices. If I'm right, assertion is like a game where the only internal goal is getting the ball in the net—getting the truth out. Epistemic constraints like knowledge are just strategic heuristics. We tell people "Don't assert unless you know" for the same reason we tell soccer players "Don't touch the ball with your hands." It's a useful rule of thumb to maximize the success rate of the game, but it's not the definition of the game. If you're right, knowledge isn't just a heuristic; it's the boundary line.

  Kate: But the heuristics don't explain the specific pattern of intuitions we get. Take the lottery case. Before the draw, I have a ticket. The odds are one in a million. I say to you, flatly, "Your ticket lost." You haven't seen the results. I have overwhelming probabilistic evidence. By your lights, my assertion has a 99.9999% chance of satisfying the norm. It's likely true. So why does it sound so improper?

  Tom: Because it's risky. The Truth Norm says you ought to assert only what is true. But since we aren't omniscient, we need a proxy for truth. High probability is usually that proxy. But in lottery cases, statistical evidence is a *defective* proxy. It's not about the probability number; it's about the type of evidence. Statistical evidence doesn't rule out error in the right way. So, I can explain the oddity without positing knowledge as the constitutive norm. I just say there's a derived conversational norm: "Don't assert on purely statistical grounds," because that tends to lead to false assertions in the long run, or it misleads the hearer about the type of evidence you have.

  Kate: That's the move I expected. You're trying to offload the work onto a Gricean maxim. You're saying the assertion is improper because it's misleading—I'm implying I have inside information when I'm just doing math. But suppose I hedge. I say, "Look, I haven't seen the results, I'm just going by the odds, but your ticket lost." The misleading implicature is cancelled. I've been transparent about my statistical grounds. Yet, the assertion still feels infelicitous. I still shouldn't say it.

  Tom: It feels infelicitous because you're inviting me to plan my life on a proposition that, for all you know, could be false based on the evidence you cited. If I burn my ticket based on your say-so, and it turns out I won, I'm entitled to complain. "Why did you tell me it lost?" "Because the odds were high." That's a bad excuse.

  Kate: But why is it a bad excuse? Because you didn't *know*. That's the explanation that cuts at the joint. If the norm were just truth plus high probability, my excuse should be fine. The reason you're entitled to complain is that I represented myself as having a status I didn't have. I represented myself as knowing. When I assert $p$, I present $p$ as something I know. In the lottery case, I don't know. That's why the complaint sticks. It's not just that I failed to hit the target of truth; it's that I took a shot that wasn't licensed by the rules of the practice.

  Tom: You're begging the question. You say I represent myself as knowing. I say I represent myself as speaking the truth. The reason the complaint sticks in the lottery case is that statistical evidence is weak *for the purpose of establishing truth in a specific case*. It's not that knowledge is missing; it's that the link between my evidence and the fact is too fragile. Now, let's look at Moorean sentences. "It is raining, but I don't know that it is raining." If your view is right, this should be a direct violation of the norm.

  Kate: Exactly. If assertion requires knowledge, then asserting the first conjunct represents me as knowing it's raining. Asserting the second conjunct represents me as not knowing it's raining. I'm representing myself as both knowing and not knowing. It's a pragmatic contradiction generated by the knowledge norm.

  Tom: But I can explain that too. If I assert "It is raining," I represent the proposition as true. By adding "but I don't know it," I'm undercutting my own authority to represent it as true. I'm effectively saying, "This is true, but I have no warrant to tell you it's true." That's conversational suicide, regardless of whether knowledge is the norm. It connects back to the lottery: in both cases, you're asserting while admitting your epistemic position is insufficient to guarantee the truth. The Moore sentence just makes the insufficiency explicit. The lottery case makes it implicit.

  Kate: But there's a difference in the insufficiency. In the Moore case, I admit I lack knowledge. In the lottery case, I *do* lack knowledge, but I don't admit it. If the norm were just truth, why does the *unadmitted* lack of knowledge in the lottery case bother us? If I assert a truth based on a lucky guess, I satisfy the Truth Norm. But we still criticize the assertion. "You shouldn't have said that, you were just guessing."

  Tom: We criticize it because it's irresponsible. Irresponsibility is a moral or conversational vice, not a constitutive one. I can drive a car irresponsibly without violating the definition of driving. I can assert irresponsibly without violating the definition of assertion. The definition is just: presenting a proposition as true.

  Kate: That seems to sever the link between assertion and reason-giving. If I assert, I give you my word. I offer you a guarantee. If I'm just aiming at truth and I miss, I apologize. But if I assert without knowledge, I've done something worse than miss; I've cheated.

  Tom: Let's test that "cheating" claim with Jennifer Lackey's selfless assertion cases. You know the one. Sebastian is a devout creationist high school teacher. He personally doesn't believe evolution is true, and so he doesn't think he knows it. But he recognizes the scientific evidence is overwhelming. He stands up in class and asserts, "Evolution is the correct explanation for biodiversity." He asserts it because it's his job to teach the truth. Now, does Sebastian know? Standard JTB accounts say no, because he lacks belief. So he lacks knowledge. But his assertion seems perfectly proper. In fact, it seems *irresponsible* for him to do anything else.

  Kate: This is the hardest case for my side, I'll grant you. But here's the distinction: Sebastian has the evidence. He recognizes the evidence is sufficient for knowledge. He just has a psychological block on the belief state. In asserting, he is acting as a conduit for the knowledge possessed by the scientific community.

  Tom: That's a stretch. He's the asserter. If the norm is "Assert only what *you* know," he violates it. If the norm is "Assert only what is true and well-supported," he satisfies it. This shows that the epistemic requirement tracks *evidence*, not knowledge. He has excellent evidence. He's tracking the truth. The fact that his internal doxastic state is messed up shouldn't stop him from asserting. This connects back to the lottery. In the lottery case, the evidence is statistical. In Sebastian's case, the evidence is explanatory and testimonial. The difference isn't knowledge; it's the quality of the grounds.

  Kate: But if you say the norm is just truth, you lose the ability to explain why Sebastian is in a tragic position at all. He *should* believe. The reason his assertion feels slightly poignant is that he *ought* to know, but he doesn't. If the norm were just truth, his lack of belief would be irrelevant. The fact that we see a tension in his case suggests we think he *should* be in a position to know.

  Tom: I see the tension as moral, not constitutive. He ought to believe because he ought to align his mind with the evidence. But the act of assertion itself is just a tool for disseminating truth. Look, go back to the lottery. If I buy a ticket and you say "You lost" before the draw, I'm annoyed. On my view, I'm annoyed because you're treating a probabilistic outcome as a fact. You're collapsing the distinction between "it is almost certainly the case" and "it is the case."

  Kate: And on my view, you're annoyed because I claimed an epistemic authority I didn't possess.

  Tom: But why does that authority matter? Why is knowledge the magic status? Why not certainty?

  Kate: Because we assert things we aren't certain of all the time. "I know the bank is open Saturday, I was there last week." I'm not certain; I could be hallucinating. But I know. If the norm were certainty, assertion would be impossible. Knowledge is the unique mental state that is factive but fallible. It's the only candidate that fits the practice.

  Tom: Or, knowledge is just the name we give to the sweet spot where evidence is good enough to risk asserting for the sake of truth. It's not the norm; it's the result of optimizing for the truth norm under human limitations.

  Kate: Then explain this: If I tell you "Your ticket lost," and it turns out I was right, do you owe me thanks for the information?

  Tom: No.

  Kate: Why not? I told you the truth. I satisfied your norm.

  Tom: Because you didn't tell me *how* you knew. You left me in the dark about the reliability of the source.

  Kate: But I didn't know! That's the point. I couldn't tell you how I knew because I didn't. If the norm were truth, and I hit the truth, I've succeeded. The fact that you don't owe me thanks shows that success in assertion isn't just about truth. It's about the transmission of *knowledge*. I failed to transmit knowledge because I didn't have it to give.

  Tom: You failed to transmit *warrant*. But warrant isn't knowledge. Warrant is what makes belief likely to be true. In the lottery case, the warrant is there, but it's the wrong *kind* for individual reference. In Sebastian's case, the warrant is there, and it's the right kind, even if belief is missing. The common factor is warrant, not knowledge.

  Kate: Warrant that falls short of knowledge is just... probability. And we've already agreed probability isn't enough for the lottery.

  Tom: We agreed statistical probability isn't enough. There are other kinds of probability.

  Kate: This is exactly what the students complain about. "Statistical probability" vs. "Epistemic probability." It sounds like we're just moving the furniture to protect the theory.

  Tom: Maybe. But consider the cost of your view. If the Knowledge Norm is constitutive, then every time someone asserts a falsehood, they haven't just made a mistake; they've failed to perform the act properly. But worse, if someone asserts a truth without knowledge—like a lucky guess—they haven't really asserted. That seems to shrink the category of assertion too much. People assert lies, they assert guesses, they assert hunches.

  Kate: They perform the act, but they violate the norm. A chess player can move their rook diagonally, but they've violated the rules of chess. They're still playing chess, just badly. Or they're no longer playing chess. That's the debate. I say they're playing badly. You say if they move the rook diagonally, they're just pushing wood.

  Tom: And I say if they push the wood with the intent to convey truth, they're asserting. The norm governs how well they do it, not whether they're doing it.

  Kate: But then why does the lottery assertion feel *wrong* rather than just *risky*? If I bet you money on the lottery ticket, that's risky, but not wrong. Asserting it feels normatively prohibited.

  Tom: Because assertion invites reliance. If I assert, I invite you to rely on me. Relying on statistical evidence for a specific outcome is irrational. So I'm inviting you to be irrational. That's the violation. It's a norm of rationality, derived from the goal of truth.

  Kate: And I say the norm of rationality here *is* the knowledge norm. You can't separate them.

  Tom: We're going in circles.

  Kate: Probably. But at least we know we don't know where to stop.

  Tom: True. Though I wouldn't assert that.
