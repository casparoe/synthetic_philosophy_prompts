answer: |-
  **Setting:** *A cramped conference room at the APA Eastern Division. The air is stale, coffee cups are stacked precariously on the side table, and the audience is thinning out. Elena (Expressivist) stands at the podium, packing her notes. Marcus (Cognitivist) remains in the front row, leaning forward.*

  **Marcus:** Elena, thank you for the talk. The formal semantics you sketched for the normative operators is impressive. It handles the Boolean connectives cleanly. But I want to press you on the metaphysics lurking behind the syntax. You claim to solve Frege-Geach by showing that the *logic of attitudes* mirrors the logic of propositions. But if your "attitudes" combine, negate, and embed exactly like truth-apt beliefs, and if your validity conditions preserve "correctness" exactly like truth-preservation... what work is the "non-cognitive" label actually doing? It sounds like Dreier's creeping minimalism. You've earned the right to talk like a realist, but only by becoming one.

  **Elena:** Thanks, Marcus. That's the worry I expected. But I think you're conflating *structural isomorphism* with *ontological identity*. Just because my map of the subway system uses the same topology as the actual tracks doesn't mean the map *is* the track. My project is to explain why moral language *looks* descriptive without positing moral properties. The "work" the label does is explain motivation. When I say "Tormenting the cat is wrong," I'm not reporting a state of mind; I'm *in* a state of mind—specifically, a con-attitude. The logic handles the embedding, but the psychology handles the push.

  **Marcus:** But that's exactly where the sleight of hand happens. Take the antecedent of your conditional: "If tormenting the cat is wrong..." You agree the speaker isn't expressing disapproval there. They aren't booing the cat hypothetically. So, what semantic value does "wrong" carry in that slot? For the inference to be valid, "wrong" must contribute the same content in the antecedent as in the assertion. If the content in the assertion is an attitude, and the content in the antecedent isn't an attitude, you've got equivocation. To fix it, you posit a "commitment" or a "normative world." But a commitment that functions as a premise in reasoning *is* a belief. If it has a mind-to-world direction of fit in the logic, why deny it in the metaphysics?

  **Elena:** Because the direction of fit is world-to-mind, even in the antecedent. Look, Marcus, when I embed the claim, I'm not positing a fact. I'm positing a *constraint on planning*. Following Gibbard, to accept "If X is wrong, then Y" is to rule out combinations of plans. I'm not saying "There exists a property of wrongness." I'm saying "I disapprove of X, and consistency requires I disapprove of Y." The validity comes from the inconsistency of holding conflicting attitudes, not from the impossibility of a world being a certain way. The "content" is the same because the *type of psychological state* is the same, even if unasserted.

  **Marcus:** But "inconsistency of attitudes" is doing the exact same work as "logical contradiction." If you can define a negation, a conjunction, and a conditional such that holding the premises and denying the conclusion is *incoherent*, you have defined truth conditions. You've just renamed "truth" to "stability of plan." If I can say "It is true that tormenting the cat is wrong" is equivalent to "I disapprove of tormenting the cat," and that equivalence holds across all embeddings, then "I disapprove..." is functioning as a truth-condition. You haven't avoided cognitivism; you've just offered a reductive analysis of moral truth. And if you're offering a reductive analysis, why not just be a realist and save us the paraphrase?

  **Elena:** Because the reduction fails the phenomenology of agency! That's the cost you're glossing over. If I'm a cognitivist like you, I have to explain how grasping a moral *fact* motivates me. If moral judgments are just beliefs about the universe, then Hume is right: belief plus desire yields action. But moral judgments *are* motivational. They don't need a separate desire. If I believe torture is wrong, I have a reason not to torture. If you make that belief truth-apt, you sever the internal connection between judgment and motivation. You turn morality into a spectator sport. My view preserves the intuition that to judge is to be committed to acting.

  **Marcus:** I grant you that's a cost. It's the cost of doing business with objective truth. But I think you're presenting a false dichotomy. I can be a cognitivist and hold that moral truths are *reason-giving* facts. Yes, it's queer, as Mackie said. But your "plan-laden states" are just as queer. You're asking me to believe in a sui generis psychological state that behaves like a belief but isn't one, governed by a logic that behaves like truth but isn't truth. That's ontological parsimony? It feels like you're terrified of the word "truth." If your semantics validates modus ponens, then your sentences are truth-apt. Period. The only difference is you refuse to say what makes them true.

  **Elena:** I'm not terrified of "truth," Marcus. I'm a deflationist about truth. I'll happily say "It is true that tormenting the cat is wrong." But for me, that's just endorsing the claim. It's not pointing to a moral particle. The difference isn't in the logic; it's in the explanation of *why* we engage in this practice. You think we engage in it to describe the world. I think we engage in it to coordinate our lives. If I'm right, then even if our logics look identical, our metaethics are worlds apart. Your view implies that if everyone's attitudes changed, the moral truth might remain. My view implies that moral truth is constituted by the attitudes of ideal agents. That's a substantive difference.

  **Marcus:** Is it? If your "ideal agents" converge on a single set of norms, and those norms behave logically like truths, and you allow yourself to say they are "true"... then the gap is shrinking to a vanishing point. This is Dreier's worry again. If the expressivist says everything the realist says, means everything the realist means, but insists "I'm not a realist," then "realism" has lost its meaning. You're a realist in sheep's clothing. You want the objectivity of realism without the metaphysical baggage. But you can't have it both ways. Either the baggage is necessary for the objectivity, or the objectivity is an illusion.

  **Elena:** But the baggage *isn't* necessary for the objectivity we actually use. We don't need moral particles to have genuine disagreement. If you plan to torment the cat and I plan to stop you, we are in genuine conflict. We don't need a third thing, a "Fact," to be conflicted about. We are conflicting *with each other*. Your realism posits a ghostly arbiter to settle the dispute. I say the dispute is settled by the force of reasons and the consistency of our practical standpoint. The "creeping" isn't minimalism; it's the realization that realism adds nothing but a metaphysical idle wheel.

  **Marcus:** An idle wheel that grounds the possibility of error! On your view, if I'm inconsistent, I'm irrational. But if I'm consistent and just have different fundamental plans? If I genuinely plan for the cat's torment and it coheres with my other plans, are you wrong? Or just different? Realism lets me say you're *mistaken* about the world. You can only say I'm *incoherent*. But history is full of coherent monsters. Your logic secures validity, Elena, but it doesn't secure *correctness* beyond internal consistency.

  **Elena:** And your realism secures correctness by fiat, at the cost of making it inaccessible. If moral truth is independent of our attitudes, how do we access it? Intuition? Evolution? If evolution shaped our moral beliefs for survival, why trust them as truths? My view naturalizes epistemology. We access moral truth by reflecting on what we have reason to value. It's not a ghostly perception; it's practical deliberation. You accuse me of smuggling in belief; I accuse you of smuggling in mystery.

  **Marcus:** *Laughs softly.* So we're back to the brute trade-off. I take the mystery of truth-makers to save the objectivity of correctness. You take the deflation of truth to save the naturalism of motivation and epistemology.

  **Elena:** Exactly. And the Frege-Geach problem?

  **Marcus:** I think you solved it by becoming a cognitivist about the attitudes.

  **Elena:** And I think I solved it by showing logic doesn't require cognitivism.

  **Marcus:** Then I suppose the logic of our disagreement is valid, even if we can't agree on the truth of the premises.

  **Elena:** *Smiles.* At least we can agree on that. Modus ponens remains our common ground, even if "wrong" doesn't.

  **Marcus:** I'll drink to that. *Raises coffee cup.*

  **Elena:** *Clinks her water bottle against it.* To consistency, at least.
