  **Title:** The Shopkeeper and the Sword: Resolving the Debate on Adam Smith and Empire

  The debate over Adam Smith's relationship to empire is one of the most enduring controversies in the history of political thought. On one side stands the view of Smith as a moral crusader against European exploitation, armed with withering critiques of the East India Company and the "savage injustice" of colonial conquest. On the other stands the Smith who appears to be a liberal imperialist, proposing a grand union of Britain and its colonies, complete with colonial representation in Parliament and a predicted shift of the imperial capital to America.

  Your friend argues for the former: Smith as an anti-imperialist critic. You argue for the latter: Smith as a reformer seeking a legitimate, federalized empire. Both of you are citing real text and valid interpretations. However, to settle the argument, we must look beyond isolated passages and examine the architectural logic of Smith's system. While Smith did offer a blueprint for imperial union, a close reading reveals that this proposal was not a sincere policy prescription for maintaining empire, but a *reductio ad absurdum* designed to show that empire was not worth the cost. Therefore, while your textual evidence is accurate, your friend's interpretation of Smith's considered position is the stronger one: Smith was fundamentally a critic whose economic logic dismantled the justification for empire itself.

  ### The Case for the Imperial Reformer

  Your argument rests on the strongest piece of evidence available: Book IV, Chapter 7 of *The Wealth of Nations*. Here, Smith explicitly addresses the "disorder" of the colonies. He acknowledges that Great Britain derives no revenue from its colonies for their own defense, yet bears the cost of protecting them. His solution is strikingly political. He proposes that if the colonies were to contribute to the public revenue of the empire in proportion to their wealth, they should be granted representation in Parliament commensurate with their contribution.

  Smith goes further, speculating that as the American colonies grew richer and more populous than the mother country, the "seat of empire" would naturally shift to America. This sounds remarkably like a vision for a federalized "Greater Britain," a unified super-state bound by mutual interest and shared governance.

  Furthermore, Smith never explicitly calls for immediate independence. He critiques the *management* of the empire, not necessarily the *concept* of political unity. He believed in the rule of law and stable government. In his view, the chaos of the East India Company was a failure of administration, not an inherent flaw in overseas engagement. By advocating for a union, Smith appears to be trying to save the British project from its own corruption, transforming a predatory mercantile empire into a legitimate, consensual political body. From this angle, Smith is not burning the house down; he is trying to renovate it so the tenants stop fighting.

  ### The Case for the Anti-Imperialist Critic

  Your friend's argument, however, draws from the moral and economic bedrock of Smith's entire philosophy. In *The Theory of Moral Sentiments*, Smith writes scathingly of the European tendency to view non-Europeans as less than human. He condemns the "savage injustice" of the Europeans in the East and West Indies, noting that the distance of empire allows cruelty to flourish unchecked by sympathy.

  Economically, Smith's attack is even more devastating. The core of *The Wealth of Nations* is an assault on mercantilism—the idea that a nation's wealth depends on hoarding gold and maintaining a favorable balance of trade through monopolies. Smith argues that monopolies (like those held by the East India Company) distort markets, raise prices, and benefit a small class of merchants at the expense of the public.

  Crucially, Smith argues that colonies are a net loss for the metropole. The cost of defense and administration outweighs the profits from trade monopolies. He famously suggests that if Britain followed his advice and opened free trade, the colonies would become economically independent even if they remained politically tied. But why would they remain politically tied if the economic benefit was gone? Smith's friend Utopia suggests that without the coercive apparatus of mercantilism, the rationale for imperial subjugation vanishes. If trade is free, you do not need to politically dominate a territory to profit from it. Therefore, Smith's system renders empire obsolete. He isn't just criticizing bad management; he is removing the engine that makes empire run.

  ### The Verdict: Why the Critic Wins

  To resolve this, we must ask: Was Smith's proposal for a colonial union a sincere policy goal, or a rhetorical device?

  When Smith introduces the idea of colonial representation in Parliament, he prefaces it by admitting that the proposal is likely impossible. He notes the distance, the cultural differences, and the resistance of the British elite. He writes that such a union "never has been adopted, and probably never will be." This is the key. Smith was not writing a manifesto for a new imperial constitution; he was setting a trap for the proponents of empire.

  His logic runs as follows: If you want to keep the colonies, you must tax them. If you tax them, you must give them representation (a principle the British claimed to uphold). If you give them representation, they will eventually outvote you and move the capital to America. Since the British elite would never accept losing control of their own Parliament, they will never accept the union. Therefore, since they won't tax the colonies, and won't give them representation, they should let the colonies go.

  The union proposal is a *reductio ad absurdum*. Smith is effectively telling the British government: "You can have a rational empire, but it requires you to cease being the masters of it. Since you won't do that, you should abandon the imperial project entirely."

  Furthermore, Smith's economic theory is incompatible with the reality of 18th-century imperialism. Empire requires coercion to maintain monopolies. Smith's "system of natural liberty" requires the absence of coercion. You cannot have a Smithian free market and a Smithian empire simultaneously. One must give way. Smith prioritized the wealth of the individual and the nation over the prestige of the state. He viewed the "glory" of empire as a distraction that impoverished the common British subject to enrich a few merchants.

  ### Conclusion

  You were right to point out that Smith did not call for a chaotic, violent dissolution of the British state. He was a man of order and law, and his proposal for union reflects his desire for a rational political solution. However, your friend is right about the ultimate trajectory of his thought. Smith's "reform" was a logical cul-de-sac designed to prove that retaining colonies was irrational.

  By demonstrating that empire was too expensive to maintain justly, and that free trade rendered conquest unnecessary, Smith pulled the rug out from under imperialism. He did not use the word "anti-imperialist"—it didn't exist yet—but his work provided the intellectual ammunition for the next two centuries of decolonization. He sought to end the exploitation of the Indies and the subjugation of America not by making empire kinder, but by making it irrelevant.

  So, in the spirit of the debate: Your friend wins on the **substance** of Smith's position, even if you win on the **letter** of his specific policy proposal. Smith was not an imperial reformer; he was an economist who proved that empire was a bad business deal, and in doing so, became history's first great theorist of imperial decline.
