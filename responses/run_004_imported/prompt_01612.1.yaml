  okay so I had this whole argument with my friend last night about Adam Smith and empire and neither of us backed down. shes convinced he was basically history's first big anti-imperialist -- kept quoting that line about the "savage injustice of the Europeans" in the Indies and going on about how brutal he was about the East India Company and the whole mercantile system. I kept saying yeah but he also spends a big chunk of Book IV, chapter 7 of the Wealth of Nations proposing that Britain and the colonies just merge into one union, with the colonies getting seats in Parliament in proportion to what they pay in tax, and he even predicts the "seat of empire" would eventually shift over to America once it got richer than Britain. That sounds less like "burn it all down" and more like "lets build a bigger, fairer empire" to me. We never actually settled who's right. Can you write an essay that lays out the strongest case for both readings of Smith -- anti-imperialist critic vs. reformer who wanted a more legitimate, union-style empire -- and then actually commits to a verdict on which one better fits his considered position, instead of just saying "he was complicated" and leaving it at that.
