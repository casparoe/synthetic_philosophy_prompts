          *   Is there normative rule-following? Yes, twins correct each other.
      *   *The "Beetle in the Box" Analogy:* Bring in PI §293. This is crucial. Even if twins had a word for a private sensation, Wittgenstein argues the "object" drops out of consideration. The meaning lies in the *use*, not the reference.
      *   *Philosophical vs. Empirical:* Clarify that PLA is a conceptual/logical argument, not an empirical hypothesis. Empirical data (twins) can't falsify a conceptual claim about the *conditions of possibility* for meaning.
