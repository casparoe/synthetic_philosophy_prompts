          *   *Answer:* Yes, using **Cross-Validation** or information criteria (AIC/BIC) which rely on the structure of the data and model complexity, not physical theory.
          *   *However:* There is a limit. We assume the future resembles the past (Hume's Problem of Induction). We assume the noise is random (i.i.d).
          *   So, it doesn't *completely* bottom out in "no assumptions," but the assumptions are much weaker (statistical regularity) than specific physical laws.
          *   Mention **Reichenbach's Posit** or **Norton's Material Theory of Induction** if I want to get fancy, but keep it accessible. Let's stick to the statistical justification for induction.

