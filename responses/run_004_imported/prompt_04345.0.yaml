      *   *Is it possible to Dutch Book a bookmaker?* If a bookmaker sets odds $P(A)=0.6, P(B)=0.6$ (Sum 1.2). A bettor bets $\$1$ on A and $\$1$ on B. Cost $\$2$. Payout is $\$1/0.6 \approx \$1.66$. Total payout $\$1.66$. Loss $\$0.34$. The *bettor* loses guaranteed money. The *bookmaker* wins guaranteed money.
      *   So, the incoherence (sum > 1) actually protects the bookmaker from the *bettor*, provided the bookmaker takes both sides.
