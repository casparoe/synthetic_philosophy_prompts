      *   *Correction:* The DBA applies to the agent whose *betting quotients* are being tested. If the bookmaker's odds are their betting quotients, they should be willing to bet *on* or *against*. Bookmakers rarely bet *against* their own odds (laying) in the same way.
      *   *Key Takeaway:* The example is dangerous because it inverts the lesson. It suggests incoherence leads to profit, not loss. This undermines the motivation for Probabilism.

