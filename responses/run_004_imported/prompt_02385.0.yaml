      *   *Implication 4: The Nature of "Evidence".* James expands evidence to include "vital benefits." Clifford restricts evidence to "indicants of truth." A Bayesian treats "vital benefits" as *utility*, not *likelihood*. This is the crux. James conflates utility and likelihood; Bayes separates them.

