      *   *Refined Implication:* The fragility of the Jamesian move. It requires a specific cognitive architecture that Bayes doesn't model (the inability to inspect one's own priors too closely).

  6.  **Finalizing the Structure:**

      1.  **Direct Answer:** No, Bayes doesn't absorb it for free. It separates *policy* from *belief*.
      2.  **Implication 1: The Calibration Tax.** (You sacrifice truth-tracking for outcome optimization).
