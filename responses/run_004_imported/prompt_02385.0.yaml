      *   *Crucial Point:* The "Self-Verifying" mechanism requires *ignorance*. If you know you're doing it for the utility, does it still work? (The "Transparent Self-Deception" problem). If I believe "I will succeed" *because* "Believing I will succeed helps me succeed," do I still get the confidence boost? Often, no. You need to actually believe the proposition, not just the utility of the proposition. This is where strict Bayesianism hits a wall. You can't update on "It is useful to believe X" to conclude "X is true" without violating the laws of probability (unless the utility *causes* the truth, which loops back to the causal model).
