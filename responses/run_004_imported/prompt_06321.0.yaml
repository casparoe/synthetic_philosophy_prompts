      *   *Correction:* While related, the anti-luminosity argument is specifically about *luminosity* (if condition C obtains, one is in a position to know C obtains). KK (If S knows P, S knows that S knows P) is a specific instance of luminosity applied to knowledge. Williamson rejects luminosity for mental states like feeling cold, which implies rejecting KK for those states, but the core argument is about the nature of knowledge and margins for error.
      *   *Claim:* "Introspection in general is unreliable."
