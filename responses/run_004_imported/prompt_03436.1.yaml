      *   **Resolution:** Do *not* resolve the dilemma neatly. Sit honestly inside the uncertainty.
      *   **Length:** 800-1500 words.
      *   **POV:** First person or close third (I'll choose first person for immediacy and internal conflict).
      *   **Tone:** Introspective, tense, philosophical, ambiguous.

  2.  **Deconstruct the "Last Judge" Moment:**
      *   **Setting:** A room? A interface? A mental space? Let's make it sterile but intimate. A console, a haptic interface, or just a direct neural link. Let's go with a direct neural interface but grounded in physical sensation (chair, hum of servers).
      *   **The Output:** What does the CEV look like? It shouldn't be a list of laws. It should be a *vision* or a *state of being*. A simulation of the future? A compressed understanding? Let's make it a "taste" of the future, a holistic impression of what humanity becomes.
      *   **The Alienation:** Why does it feel alien? Because true extrapolation might remove things we think are essential (struggle, death, specific biases, individuality vs. hive mind nuances). It's *too* coherent. Humanity is messy; CEV is clean.
      *   **The Pressure:** The weight of the decision. If they veto, the AI shuts down (probably permanently or resets to danger). If they approve, humanity changes forever.
      *   **The Philosophical Knot:** Is the Judge representing "Current Humanity" or "Best Humanity"? If CEV is what we *would* want, why does Current Me hate it? Because Current Me is flawed? But if Current Me is too flawed to recognize what's good for me, why am I the Judge?

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the weight of the moment. The computation is done. The silence after the noise.
      *   **The Experience:** Describe interacting with the CEV output. It's beautiful, logical, kind... but wrong. Use sensory metaphors. Uncanny valley of the soul.
      *   **The Internal Debate:** The Judge argues with themselves. Referencing the rules (no veto for mere shock). The distinction between "wrong" and "unfamiliar."
      *   **The Specific Detail:** Find one concrete thing that feels off. Maybe the absence of grief? Or the way conflict is resolved? Let's go with the absence of *friction*. A world without resistance feels like a dream, not life.
      *   **The Climax (Non-Resolution):** The finger hovers over the button (or the mental command is prepared). The realization that the decision itself is the trap.
      *   **Ending:** Leave it hanging. The breath before the choice.

  4.  **Refining the Tone:**
      *   Avoid technobabble. Focus on the phenomenology of the decision.
      *   Keep the Yudkowskyian vibe: rationalist, high-stakes, meta-ethical.
      *   Ensure the word count is within range (800-1500).

  5.  **Drafting - Mental Walkthrough:**
      *   *Start:* The hum stops. I am alone. The prompt is in my head.
      *   *Middle:* I walk through the proposed future. It's perfect. Too perfect. People are happy, but are they people? They seem like optimized versions. I feel like a parent looking at a child who grew up too fast and forgot their name.
      *   *Conflict:* The rules say don't veto for shock. Is this shock? Or is this a fundamental error in the extrapolation? Did it extrapolate away the "human" part?
      *   *End:* I haven't decided. The cursor blinks.

  6.  **Writing - Focus on Sensory Details:**
      *   The chair. The light. The feeling of the data.
      *   The feeling of "wrongness" vs "badness."
      *   The quote about "wearing humanity's face."

  7.  **Review against Constraints:**
      *   Did I resolve it? No.
      *   Is it the Last Judge moment? Yes.
