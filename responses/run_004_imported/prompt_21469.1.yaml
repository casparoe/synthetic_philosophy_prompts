  Actually, she might be saying: "The intuition that it *is* your son is Transworld Identity. The intuition that it is *not* your son is Counterpart Theory."
  *Correction:* No, she said "it's just a different person, full stop, AND this is the fight." She is likely saying the *confusion* arises from the fight. Or she is saying the *truth* is the Counterpart view (different person).
  *Most likely interpretation:* She is arguing for the "Different Person" conclusion (which is the standard philosophical consensus via Origin Essentialism) and noting that the *reason* people get confused is because they intuitively grasp for Transworld Identity where it doesn't apply.
