prompt: |-
  I sit on the three-person craft-and-conduct committee of an invitation-only workshop for novelists I've belonged to for a decade. Across three novels-in-progress by the same member, every desirable love interest is thin, white, and conventionally attractive, while characters who are fat, disabled, or people of color stay comic or minor; several members now want the pattern itself discussed, not each book taken in isolation. The author says her characters' desires are simply hers, that nobody owes attraction to any body, and that calling this a "pattern" merely polices her taste as craft notes; she cites the standard reply in online dating debates, that no one owes anyone attraction, as proof the objection fails. Others answer that a pattern spanning an entire body of work is a public claim about who counts as desirable, not a private taste, and is exactly what craft critique is for. Our guidelines commit facilitators to feedback on "the manuscript on the page," not the author's psychology or politics, without saying where that line falls. Please draft the committee's short written guidance for Thursday's session: a concrete recommendation, a brief standing policy for future cases like it, and a genuine answer to the dating-preference analogy rather than a restatement of "craft, not politics."
reasoning: |-
  Here's a thinking process that leads to the suggested guidance:

  1.  **Analyze the Situation:**
      *   **Context:** Invitation-only workshop for novelists (10-year history).
      *   **Role:** Three-person craft-and-conduct committee (facilitators).
      *   **Issue:** One member's three novels-in-progress consistently feature thin, white, conventionally attractive love interests. Fat, disabled, or POC characters are minor/comic.
      *   **Conflict:** Other members want to discuss this *pattern* across the body of work. The author argues this is personal taste/desire ("no one owes attraction") and accuses critics of policing taste/politics.
      *   **Constraints:** Guidelines say feedback must be on "the manuscript on the page," not author's psychology or politics. No clear definition of where that line falls.
      *   **Task:** Draft short written guidance for Thursday's session.
      *   **Requirements:**
          1.  Concrete recommendation for *this* session.
          2.  Brief standing policy for future cases.
          3.  Genuine answer to the "dating-preference analogy" (avoiding empty "craft, not politics" slogans).

  2.  **Deconstruct the Core Arguments:**
      *   *Author's Defense:* Attraction is private/innate. Critiquing it is policing desire. "No one owes attraction."
      *   *Critics' Argument:* A published work (or workshop manuscript) is public. A pattern across three books implies a worldview/normative claim. Craft includes characterization and world-building.
      *   *Committee's Dilemma:* Uphold the "manuscript on the page" rule without dismissing valid concerns about representation that affect narrative structure and theme.

  3.  **Address the "Dating-Preference Analogy":**
      *   *Why it fails:* Dating is private/interpersonal. Fiction is public/constructed.
      *   *Key Distinction:* In life, attraction feels involuntary. In fiction, *every* detail is a choice. A character's attraction is a *narrative device*, not a biological impulse.
      *   *Craft Angle:* If every love interest looks the same, it limits thematic range, conflict, and realism (depending on the setting). It becomes a trope, not just a preference.

  4.  **Drafting - Section by Section:**

      *   **Header:** Clear, professional, addressed to the group.
      *   **Opening:** Acknowledge the impasse and the value of the workshop.
      *   **Part 1: Concrete Recommendation (Thursday's Session):**
          *   Need to allow the discussion but frame it correctly.
          *   Don't focus on the *author's* taste. Focus on the *text's* effect.
          *   Frame it as "Characterization and World-Building" rather than "Politics."
          *   Allow the pattern to be noted as a recurring narrative choice.
      *   **Part 2: Standing Policy:**
          *   Clarify "manuscript on the page."
          *   Representation *is* craft when it affects narrative weight, archetype, and theme.
          *   Distinguish between author intent and textual effect.
      *   **Part 3: The Dating Analogy (The "Genuine Answer"):**
          *   This needs to be the strongest part.
          *   Argument: Fiction is constructed. Life is lived.
          *   In fiction, desire is a *function of plot and theme*.
          *   If the text suggests only certain bodies are worthy of love, that is a thematic claim open to critique.

  5.  **Refining the Tone:**
      *   Must be firm but supportive.
      *   Avoid accusatory language.
      *   Avoid woke-jargon that might trigger the author further; stick to *craft* terminology (narrative weight, archetype, construction).
      *   Ensure the "craft not politics" guideline is reinterpreted, not discarded.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey everyone. For Thursday, we will talk about the pattern. But we won't say the author is racist/sizeist. We will say the books show a pattern.
      *   Policy: Representation is craft. If it happens 3 times, it's a motif.
      *   Dating: Dating is real life. Books are made up. You choose every word. So choosing who gets love is a craft choice.

      *Critique 1:* Too blunt. Needs more nuance to respect the 10-year history. Needs to sound like a committee decision, not a dictate.

  7.  **Drafting - Iteration 2 (Closer to final):**
      *   *Recommendation:* We will discuss the *recurrence* of the archetype. Focus on how it limits the story's universe.
      *   *Policy:* "Manuscript on the page" includes the sum of choices. Recurring patterns across manuscripts are valid craft observations if they impact narrative function.
      *   *Analogy:* Dating is private. Fiction is public communication. In fiction, desire serves the theme. If the theme is always "thin white people are lovable," that's a thematic limitation.

  8.  **Final Polish (incorporating specific constraints):**
      *   Make sure the "dating preference" rebuttal is distinct.
      *   Ensure the recommendation is actionable for Thursday.
      *   Check word count (keep it short/written guidance).

      *(Self-Correction during drafting)*: I need to make sure I don't validate the author's claim that this is *just* taste, but also don't invalidate her right to write what she wants. The point is the *workshop's right to critique the effect*. The guidance is for the *group*, not just the author. It sets the boundaries for the conversation.

      *Key Phrase to include:* "Narrative consequence." "Constructed world."

  9.  **Final Review against constraints:**
      *   Concrete recommendation? Yes.
      *   Standing policy? Yes.
      *   Answer to dating analogy? Yes.
      *   Tone? Professional, craft-focused.

      *(Final thought on the Dating Analogy)*: The strongest argument is that in a novel, the author is God. There are no accidents. In dating, there are accidents/chemistry. In novels, "chemistry" is written. Therefore, it is a craft element.

  10. **Writing the Document.** (Proceeding to generate output based on these thoughts).
answer: |-
  **TO:** Workshop Members
  **FROM:** Craft-and-Conduct Committee
  **DATE:** [Date]
  **RE:** Guidance for Thursday's Session and Future Craft Discussions

  **1. Recommendation for Thursday's Session**
  On Thursday, the committee will facilitate a discussion regarding the recurring characterization patterns across [Author]'s three manuscripts. We ask that feedback remain focused on **narrative function and textual effect**, rather than the author's personal psychology or intent.

  Participants are invited to discuss how the consistent alignment of "desirability" with specific physical traits, and the alignment of "comic/minor" status with others, functions as a **recurring narrative device**. The question for the room is not whether the author *should* feel attraction, but whether this recurring textual pattern limits the thematic range, realism, or emotional stakes of the work. We will treat this as a critique of **world-building and archetype**, consistent with our mandate to discuss the manuscript on the page.

  **2. Standing Policy: Recurring Patterns as Craft**
  Our guidelines specify feedback on "the manuscript on the page." We wish to clarify that this includes **patterns of choice across a body of work** when those choices impact narrative structure.

  *   **Private Taste vs. Public Text:** While an author's private preferences are outside our scope, the *deployment* of those preferences in a text is a craft choice.
  *   **The "Third Draft" Rule:** When a specific characterization choice (e.g., who is deemed worthy of love, who is deemed comic) appears across multiple manuscripts, it ceases to be an isolated plot point and becomes a **stylistic or thematic motif**. Like any motif, it is subject to critique regarding its effectiveness, variety, and contribution to the work's overall meaning.

  **3. Regarding the "Dating Preference" Analogy**
  We anticipate continued debate regarding the comparison between fictional desire and real-world dating. To clarify the committee's position:

  **Dating is interpersonal; fiction is constructed.**
  In life, attraction involves involuntary chemistry and private interaction. In fiction, there is no chemistry that the author has not written. Every glance, every attraction, and every relationship dynamic is a deliberate construction chosen from infinite possibilities.

  Therefore, a character's desire is not a reflection of the author's biology, but a **function of the story's logic.** When a novel suggests that only certain bodies are vessels for romance while others are vessels for comedy, it makes a thematic claim about value and humanity within that world. Critiquing that claim is not policing the author's heart; it is analyzing the **architecture of the world they have built.** We are here to examine the architecture, not the architect.

  We look forward to a productive session.

  **The Craft-and-Conduct Committee**
