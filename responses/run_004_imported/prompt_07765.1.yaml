prompt: |-
  I was recently invited onto my hospital's clinical ethics committee as its Islamic studies advisor, mostly on the strength of a dissertation chapter on al-Ghazali that I wrote years ago and hadn't thought about since. That chapter has suddenly become load-bearing. An elderly ICU patient is on ventilation and vasopressors with what the attending team considers a hopeless prognosis, and the family's own religious adviser, invoking al-Ghazali's occasionalism, argues that since God alone truly causes every event and what we ordinarily call "causes" -- the ventilator, the physician's hand -- are only the customary occasions God has habituated us to associate with their effects, withdrawing life support cannot count as causing the patient's death at all, and the committee should simply defer to whatever timeline the family prefers. Some members consider this a serious, doctrinally orthodox position we have no business overruling; others worry that, taken at face value, it would equally excuse a clinician who deliberately administered a lethal dose, since on this view no human act ever really causes anything. I need to circulate a short written opinion before we meet the family again next week. Please draft it: it should recommend a concrete course of action and timeframe for this patient, and it should engage the adviser's argument on its own philosophical terms rather than just falling back on the standard letting-die/killing distinction.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Islamic Studies Advisor on a Hospital Clinical Ethics Committee (CEC).
      *   **Task:** Draft a short written opinion/memo for the committee before meeting the family again.
      *   **Context:** Elderly ICU patient, hopeless prognosis, on ventilation/vasopressors. Family's religious adviser argues against withdrawing life support based on al-Ghazali's *occasionalism* (God is the only true cause; human acts are just "occasions"). Therefore, withdrawing support isn't "causing" death.
      *   **Conflict:** Some committee members think this is orthodox and binding; others worry it leads to absurd conclusions (e.g., excusing euthanasia/murder).
      *   **Requirements:**
          *   Recommend a concrete course of action and timeframe.
          *   Engage the adviser's argument on its *own philosophical terms* (Islamic theology/fiqh), not just Western bioethics distinctions (killing vs. letting die).
          *   Tone: Professional, respectful, authoritative but collaborative, suitable for a medical ethics committee.

  2.  **Deconstruct the Theological Argument (Al-Ghazali & Occasionalism):**
      *   *The Adviser's Claim:* Based on *The Incoherence of the Philosophers* (Tahafut al-Falasifa). God is the only agent (*al-Fa'il al-Haqiqi*). Natural causes (*asbab*) are merely habits of God (*'adah*). Therefore, pulling the plug is just removing an occasion; God decides life/death.
      *   *The Counter-Argument (Internal to Islamic Tradition):*
          *   **Taklif (Moral Responsibility):** If humans have no causal agency, how are they judged? Islam requires moral accountability. Occasionalism in theology (*kalam*) does not negate legal/moral responsibility (*fiqh*).
          *   **The Concept of *Asbab* (Means):** While God is the ultimate cause, Islam mandates seeking means (*akhadh bi-l-asbab*). The Prophet said, "Tie your camel and trust in God." Ignoring medical prognosis or prolonging suffering contradicts the stewardship of the body.
          *   **Harm (*Darar*):** Islamic law prohibits inflicting harm (*la darar wa la dirar*). Prolonging the dying process unnecessarily is often viewed as harming the patient.
          *   **Definition of Death:** Modern Islamic juristic councils (e.g., OIC Islamic Fiqh Academy) generally accept brain death or the cessation of vital functions as valid markers of death, allowing withdrawal of futile support.
          *   **Futile Treatment (*'Ilaj Ghayr Mujdi*):** There is a consensus that treatment is not obligatory if it is futile or merely prolongs suffering without hope of recovery.

  3.  **Address the "Slippery Slope" (Euthanasia):**
      *   Why does occasionalism not excuse murder? Because *niyyah* (intent) and *shari'ah* (divine law) govern human action. Even if God creates the act, the human *acquires* (*kasb*) the act and is responsible for its moral quality. Withdrawing futile treatment is removing an obstacle to God's decree; administering a lethal dose is initiating a new harm.

  4.  **Formulate the Recommendation:**
      *   **Action:** Withdraw life-sustaining treatment (LST).
      *   **Timeframe:** Immediate to short-term (e.g., within 24-48 hours), allowing time for family preparation/prayer.
      *   **Rationale:** Theological nuance regarding *asbab*, *maslaha* (public interest/benefit), and the distinction between *removing a barrier* vs. *active aggression*.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the gravity and the sophistication of the adviser's argument. Validate their scholarship (it *is* Ghazalian) but contextualize it.
      *   **Theological Engagement (The Core):**
          *   Acknowledge Occasionalism (*kalam* level).
          *   Shift to Jurisprudence (*fiqh* level). Humans are *mukallaf* (morally responsible).
          *   Introduce *Kasb* (Acquisition): We own our actions morally even if God creates them.
          *   Introduce *Asbab* (Means): We are obligated to use appropriate means, but not *futile* ones.
          *   Introduce *Darar* (Harm): Prolonging dying is harm.
      *   **Addressing the Euthanasia Concern:** Distinguish between *izalat al-mani'* (removing an obstacle/barrier to natural death) and *fi'l mubashir* (direct aggressive act).
      *   **Recommendation:** Concrete steps.
      *   **Closing:** Offer to speak with the family/imam.

  6.  **Refining the Tone:**
      *   Avoid sounding condescending to the family's imam.
      *   Avoid sounding like a secular ethicist quoting Beauchamp & Childress.
      *   Sound like a colleague who knows the tradition deeply.
      *   *Self-Correction during drafting:* Make sure I don't get *too* technical with Arabic terms without explaining them, as the committee members are mostly clinicians/secular ethicists. Keep the theology accessible but rigorous.

  7.  **Key Theological Points to Verify:**
      *   Did Ghazali deny causality entirely? He denied *necessary* connection, not the utility of causes in the legal/moral sphere.
      *   What is the contemporary Islamic bioethics consensus? Futility allows withdrawal. (Reference Islamic Fiqh Academy resolutions if possible, generally Resolution 65 regarding brain death/futility).
      *   Is the "removing the barrier" argument standard? Yes, in the context of life support, it's often framed as allowing the *ajal* (appointed time) to arrive.

  8.  **Final Review against Constraints:**
      *   Concrete course of action? Yes (withdrawal).
      *   Timeframe? Yes (48 hours).
      *   Engage philosophical terms? Yes (Occasionalism, *Kasb*, *Asbab*, *Darar*).
      *   No simple "killing vs. letting die"? Yes, framed through *fiqh* categories.

  9.  **Final Polish:** Check for clarity and empathy. (The resulting memo follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Islamic Studies Advisor
  **DATE:** October 26, 2023
  **RE:** Ethical Recommendation Regarding Patient [Initials], ICU Bed [Number]

  **Introduction**
  I write to offer a theological and ethical analysis regarding the family's objection to withdrawing life-sustaining treatment (LST) for Patient [Initials]. The family's religious adviser has advanced a sophisticated argument rooted in the occasionalist metaphysics of Abu Hamid al-Ghazali (d. 1111). He contends that because God is the sole true Cause, human intervention (including withdrawing a ventilator) cannot be construed as "causing" death. Therefore, he argues, the family may demand indefinite continuation of treatment.

  While this position is textually grounded in Ghazali's *The Incoherence of the Philosophers*, it represents a specific theological abstraction that does not translate directly into Islamic *fiqh* (jurisprudence) or medical ethics. Adopting this view would contradict established Islamic legal maxims regarding moral responsibility, harm, and futility.

  **Theological Analysis**
  To engage the adviser on his own terms, we must distinguish between *kalam* (speculative theology) and *fiqh* (practical jurisprudence).

  1.  **Theology vs. Moral Responsibility (*Taklif*):**
      The adviser is correct that in Ghazalian occasionalism, God is the only ontological Agent (*al-Fa'il al-Haqiqi*). However, Islamic theology simultaneously maintains that humans possess *kasb* (acquisition). While God creates the act, the human "acquires" it and bears moral responsibility for it. If occasionalism negated human agency in the legal sphere, the entire structure of Islamic law (which commands and forbids specific human acts) would collapse. A clinician withdrawing futile care and a clinician administering a lethal toxin are both "occasions" in the metaphysical sense, but they are morally distinct in the juridical sense based on intent (*niyyah*) and the nature of the act.

  2.  **The Obligation of Means (*Asbab*):**
      Islam mandates the use of appropriate means (*akhadh bi-l-asbab*) to preserve life, as exemplified by the Prophetic tradition: "Tie your camel, then trust in God." However, this obligation is bounded by efficacy. When medical consensus determines that treatment is futile (*ghayr mujdi*), the ventilator ceases to be a legitimate "means" to health and becomes an obstacle to the natural decree of death (*ajal*).

  3.  **The Prohibition of Harm (*Darar*):**
      A primary legal maxim in Islamic law is *la darar wa la dirar* ("no harming and no reciprocating harm"). Indefinitely prolonging the dying process in a patient with a hopeless prognosis is widely considered by contemporary Islamic juristic councils (including the OIC Islamic Fiqh Academy) to be a harm to the dignity of the patient and a distress to the family.

  4.  **Removing the Barrier vs. Active Aggression:**
      The distinction the committee is seeking is not merely "letting die vs. killing," but rather *izalat al-mani'* (removing a barrier) versus *fi'l mubashir* (direct aggressive act).
      *   **Withdrawing LST:** This is viewed as removing an artificial barrier that is preventing the patient's *ajal* (appointed time) from arriving. It is a cessation of interference.
      *   **Active Euthanasia:** This constitutes a new, aggressive causal chain intended to terminate life prematurely.
      The adviser's argument fails because it conflates the removal of an artificial obstacle with the introduction of a lethal agent. Both are "occasions" for God's will, but the former aligns with accepting God's decree, while the latter violates the sanctity of life entrusted to us.

  **Recommendation**
  Based on the consensus of contemporary Islamic bioethics and the internal coherence of the tradition itself, the committee should proceed as follows:

  1.  **Course of Action:** Recommend the withdrawal of non-beneficial life-sustaining treatment (ventilation and vasopressors). This should be framed to the family not as "causing death," but as "ceasing to prevent the natural decree of God."
  2.  **Timeframe:** Treatment should be withdrawn within 48 hours. This allows the family time to gather for prayer and presence, respecting the Islamic emphasis on witnessing the end of life (*talqin*), but prevents the prolonged harm of futile intervention.
  3.  **Palliative Care:** Ensure aggressive symptom management (sedation/analgesia) is continued uninterrupted. In Islamic jurisprudence, alleviating suffering is a communal obligation (*fard kifaya*), even if it may secondarily hasten death (the principle of double effect is compatible with the concept of *maslaha*, or public interest/benefit).

  **Next Steps**
  I recommend the committee chair and I meet with the family and their adviser prior to the 48-hour mark. I am prepared to address the adviser directly regarding the distinction between metaphysical causality and juridical responsibility. We must be compassionate but firm: respecting religious belief does not require validating a theological interpretation that contradicts the broader objectives of Islamic Law (*Maqasid al-Shari'ah*), specifically the preservation of dignity and the avoidance of harm.

  Respectfully,

  [Your Name]
  Islamic Studies Advisor, Clinical Ethics Committee
