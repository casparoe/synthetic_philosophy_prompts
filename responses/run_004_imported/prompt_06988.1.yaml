          *   *Practical takeaway:* It is legitimate to raise credence in $T$, but label the driver as "structural coherence" or "logical entailment discovered," not "new empirical data."
      *   **Implication 2: The Danger of Accommodation (Overfitting).**
          *   Why predesignation matters. It's easier to curve-fit old data than predict new data.
          *   *Practical takeaway:* Discount the weight of old evidence compared to novel prediction. Use a "complexity penalty" (Solomonoff/MDL intuition).
      *   **Implication 3: Counterfactuals as a Sanity Check.**
          *   The "would this have surprised me?" test.
          *   *Practical takeaway:* Use the counterfactual not as the formal mechanism, but as a heuristic for *magnitude* of update.
      *   **Explicit Verdicts (Addressing the prompt's specific requirement):**
          *   *Which solution licenses raising credence?* The Garber/Logical Omniscience relaxation. It treats the discovery of the entailment as the new evidence.
          *   *Where is no legitimate update occurring?* If the theory was *constructed specifically* to fit $E$ (ad hoc). Here, you are tracking "fit," not "confirmation."
