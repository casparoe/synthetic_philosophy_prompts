answer: |-
  **Setting:** *A conference room at the Horizon Foundation, 11:45 PM. The whiteboard is covered in decision trees. A spreadsheet is projected on the wall, glowing blue in the dark room. Empty coffee cups litter the table.*

  **Characters:**
  *   **ELENA:** Senior Economist. Ordinalist. Skeptical of interpersonal utility comparisons.
  *   **MARCUS:** Program Director. Utilitarian leanings. Needs to allocate $50 million by morning.

  ***

  **MARCUS:** (Rubbing his temples) Look, the spreadsheet balances. If we shift five million from the cash transfer pilot to the cataract initiative, the cost-per-DALY averted drops by twelve percent. It's the rational choice.

  **ELENA:** The spreadsheet balances, Marcus. The ethics don't. You're treating a DALY in Malawi as identical to a DALY in Mumbai, and you're treating a year of sight as mathematically convertible to a year of life.

  **MARCUS:** We've been over this. If we don't convert them, we can't allocate the budget. We either fund the malaria nets, the eye surgery, or the cash. We can't fund all three at optimal levels.

  **ELENA:** Then we admit we're making a value judgment. Don't hide it behind a decimal point. You're asserting that saving one life is equivalent to curing roughly ten cases of blindness. Where does that number come from?

  **MARCUS:** It comes from the valuation surveys. People trade off risk of death against quality of life. It's revealed preference.

  **ELENA:** It's revealed preference of *who*? Undergraduates in Chicago? You're taking the risk tolerance of a twenty-year-old econ major and applying it to a subsistence farmer in Sub-Saharan Africa. Robbins was right. We have access to our own preferences. We have access to nobody else's. To say I know how much that farmer values sight versus life isn't science. It's imperialism with a calculator.

  **MARCUS:** (Leans forward) And if we don't make that comparison? If we say, "Oh, we can't compare utilities across persons," what happens?

  **ELENA:** We acknowledge the limit of our knowledge.

  **MARCUS:** No. If we do that, Arrow's Impossibility Theorem eats us alive. We end up with no social welfare function. We can't rank any social states. So what do we do? We default to the status quo. We leave the money in the endowment.

  **ELENA:** That's a strawman. We can use Pareto improvements. If we can make someone better off without making anyone worse off—

  **MARCUS:** There are no Pareto improvements left, Elena! It's a zero-sum budget. Every dollar for cataracts is a dollar not for malaria. To do nothing is to choose the malaria deaths. That is a value judgment. It's just a value judgment dressed up as neutrality. Harsanyi nailed this. If you aren't willing to make interpersonal comparisons, you can't have a policy. You just have inertia.

  **ELENA:** I'd rather have inertia than false precision. Look at the cash transfer line. You're assuming a dollar gives more utility to the subsistence farmer than to the burnt-out tech worker in San Francisco.

  **MARCUS:** Diminishing marginal utility of income. It's Econ 101.

  **ELENA:** It's a assumption about the curvature of their utility functions. How do you verify that? Maybe the tech worker is on the verge of suicide and that dollar buys a therapy session that saves their life. Maybe the farmer has cultural commitments that make income less relevant to welfare than community standing. You're imputing a cardinal utility scale where there's only ordinal ranking. You can't measure the depth of their satisfaction, only the direction of their choice.

  **MARCUS:** So we ignore the income difference? We treat a dollar in Ohio the same as a dollar in Zimbabwe?

  **ELENA:** I'm saying we admit that weighting them differently is a moral claim, not an empirical finding.

  **MARCUS:** Fine. It's a moral claim. I'm making it. I'm saying, behind a veil of ignorance, if I didn't know whether I'd be born a tech worker or a farmer, I'd bet on the dollar being more useful to the farmer. I'm willing to put that axiom on the table. Are you willing to put yours on the table? Your axiom is: "It is better to let people die than to claim we know how much their suffering matters."

  **ELENA:** (Pauses, looking at the projection) My axiom is: "Do not claim scientific certainty where there is only philosophical guesswork." When you write "10.4 lives saved" next to "400 cases of blindness cured," you're telling the donors we *know* these are equivalent. We don't.

  **MARCUS:** Then how do we sign the grant? I need a signature. The board meets at eight.

  **ELENA:** (Sighs, picks up a pen) We don't use point estimates.

  **MARCUS:** What?

  **ELENA:** We don't use a single conversion rate. If you insist on comparing, you have to account for the error bars. And the error bars here aren't statistical. They're epistemological.

  **MARCUS:** You want sensitivity analysis? We already ran that.

  **ELENA:** Not on the inputs. On the weights. You're using a weight of 1.0 for a life year. I want the allocation to hold across a range of ethical weights. If saving a life is valued at 5x curing blindness, fund the nets. If it's 1x, fund the eyes. If the funding decision flips based on a moral parameter we can't verify, we shouldn't be maxing out the budget on one.

  **MARCUS:** That leads to diversification. It lowers the expected impact. If the nets are actually ten times more effective, diversifying kills people.

  **ELENA:** Or it hedges against the risk that our "effectiveness" metric is built on sand. Look, Marcus. I'm not going to throw up my hands. I know we have to spend the money. But I won't sign off on a model that pretends the trade-off is settled.

  **MARCUS:** (Stares at the screen) So you want a weighted split?

  **ELENA:** I want a robust decision. Show me that this allocation is defensible not just under *your* utilitarian calculus, but under a range of plausible interpersonal comparisons. If the cash transfer program only wins because you assume the marginal utility of income drops off precipitously, but loses if you assume adaptation effects... then we shouldn't bet the farm on it.

  **MARCUS:** That's... actually a Harsanyi argument.

  **ELENA:** Excuse me?

  **MARCUS:** Harsanyi's Cardinal Utility Theorem. If you want to aggregate individual preferences into a social welfare function, you have to assume cardinal measurability. But you're asking for the weights to be robust across different cardinalizations. You're asking for a Bayesian approach to the ethics.

  **ELENA:** I'm asking for humility. You want to treat the value of a human life as a fixed variable in a maximization problem. I'm telling you it's a parameter with infinite variance.

  **MARCUS:** (Turns off the projector. The room goes dim.) If we do this your way, we fund all three. Smaller impact on each. We save fewer lives, cure fewer eyes, lift fewer incomes. But we sleep better knowing we didn't claim to know the unknowable.

  **ELENA:** We sleep better knowing we didn't lie.

  **MARCUS:** Is it a lie if it saves more people? Suppose I fudge the weight. Suppose I say I know for sure that life is worth 10x sight, and I'm right, and because of that conviction I save a thousand people I otherwise wouldn't have. Does the philosophical purity matter then?

  **ELENA:** Yes. Because next year, someone else will use your model. And they'll fudge the weight the other way. And they'll kill the thousand people. You're establishing a precedent that these comparisons are objective facts. They aren't. They're policy levers.

  **MARCUS:** (Quietly) So we label them as levers.

  **ELENA:** Exactly. In the report to the board: "Allocation based on ethical weight W, where W represents the trade-off between mortality and morbidity. Reasonable persons may disagree on W."

  **MARCUS:** The donors hate that. They want to know their dollar did the "most good."

  **ELENA:** Then tell them the truth. The "most good" is undefined until they tell us how much they value a life versus a sight. We're not the priests, Marcus. We're the engineers. We can tell them the cost of the bridge. We can't tell them if it's worth crossing.

  **MARCUS:** (Looks at the spreadsheet, then back to Elena) If I write that disclaimer, will you sign?

  **ELENA:** (Uncaps her pen) If you include the sensitivity analysis on the moral weights, not just the statistical variance... yes.

  **MARCUS:** It's going to look messy. It's going to look like we're unsure.

  **ELENA:** We are unsure. That's not a bug. It's the only honest feature we have.

  **MARCUS:** (Opens the laptop again) Alright. I'll add a tab. "Ethical Sensitivity." But Elena?

  **ELENA:** Yeah?

  **MARCUS:** Tomorrow, when the board asks why we didn't save the extra two hundred lives from the malaria nets... that's on you.

  **ELENA:** (Signs the paper) And the blindness is on you. Let's go home.
