  Ok so I keep getting tripped up on the surrogate goals move as a defense against acausal blackmail/threats. Like I get the basic pitch -- you precommit to caring about some cheap substitute goal so that threateners target that instead of the thing you actually value -- but I don't understand why this doesn't just collapse back into the original problem, since now the substitute goal *becomes* something you value and so it's threatenable in the same way. Can you walk me through the actual mechanism that's supposed to block this regress, and why (if it does) the surrogate goal doesn't just inherit the vulnerability of whatever it's protecting?
