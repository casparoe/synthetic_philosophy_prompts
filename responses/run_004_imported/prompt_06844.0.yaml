answer: |-
  This is a fantastic conflict because it gets at the heart of the Harlem Renaissance's central tension. You are right to avoid the generic "freedom vs. duty" trope. Du Bois's position in *Criteria of Negro Art* (1926) is far more specific, strategic, and tragic than the soundbite suggests.

  For your mentor character to feel authentic—and for the debate to have teeth—you need to ground his argument in Du Bois's specific sociological and political anxieties, not just moral prudishness.

  Here are the four most important implications of Du Bois's actual position for your novel's central argument.

  ### 1. The Audience is Not Neutral (The "White Gaze" Problem)
  Du Bois did not believe art existed in a vacuum. He believed art was a tool to combat anti-Black racism in a society where Black people had no other political power. His definition of "propaganda" wasn't about lying; it was about **strategic communication to a hostile audience.**

  *   **The Implication:** The mentor shouldn't argue that pool halls and hustlers *don't exist*. He should argue that the **white audience lacks the context to interpret them humanely.**
  *   **The Mentor's Argument:** "When a white painter depicts a drunk in an Irish bar, it is local color. When you depict a drunk in a Harlem cellar, it is evidence to them. They are not looking for art, child; they are looking for justification. They want to justify segregation, justify withholding the vote, justify the lynching. If you give them images of our degradation, you are handing them the rope."
  *   **Why it works:** It makes the mentor's censorship feel like a survival tactic, not just snobbery. He is terrified that the protagonist's "honesty" will be weaponized by white supremacists.

  ### 2. The Burden of Representative Individualism
  In the 1920s, Black artists were rarely allowed to be individuals. They were viewed as representatives of the entire race. Du Bois accepted this burden; he wanted artists to shoulder it consciously. He believed that because Black humanity was constantly under question, art had to prove that humanity indisputably.

  *   **The Implication:** The conflict isn't about *what* is painted, but **what is centered as the definition of the Race.** Du Bois feared "primitivism" (the idea that Black people were closer to nature, more instinctual, less civilized). He felt works like McKay's *Home to Harlem* catered to this white fetishization of Black "wildness."
  *   **The Mentor's Argument:** "You say you paint what you see. But do you see only the shadows? If you fill your canvas with the underworld, you tell the world that the underworld is all there is. We are fighting for the right to be boring. The right to be bankers, and teachers, and mothers who are tired but not tragic. Give them our dignity first. Let them choke on our excellence. Then, maybe, we can afford the luxury of our sins."
  *   **Why it works:** It shifts the goal from "positive images" to "comprehensive humanity." The mentor wants to normalize Black middle-class life to break stereotypes, whereas the protagonist sees that normalization as a lie.

  ### 3. Beauty as Political Evidence
  This is the most misunderstood part of *Criteria of Negro Art*. Du Bois writes: *"I do not care a damn for any art that is not used for propaganda. But I do not care when the propaganda becomes so overt that the art disappears."*

  He believed **Beauty** was the vehicle that made the propaganda work. For Du Bois, Beauty was proof of the soul. If the art was ugly (in subject or execution), it failed to prove the humanity of the subject.

  *   **The Implication:** The mentor shouldn't just ask for "nice" pictures. He should demand **Beauty** as a political strategy. He believes that depicting ugliness without redemption dehumanizes the subject.
  *   **The Mentor's Argument:** "You call it realism; I call it a failure of imagination. Any fool can paint the grime. It takes a visionary to find the light in the grime. If you paint a hustler, paint him with the grace of a king, or do not paint him at all. If you paint him as a rat, you confirm their belief that we are vermin. Beauty is not decoration, girl. It is our alibi."
  *   **Why it works:** It raises the artistic stakes. The mentor is challenging her skill, not just her morality. He is asking her to transfigure reality, not just copy it.

  ### 4. Truth Must Lead to Justice
  Du Bois's triad was Truth, Goodness, and Beauty. But the ultimate goal was **Justice.** He believed that revealing the Truth about Black suffering was necessary *only if* it moved the world toward Justice. If revealing the truth just reinforced prejudice, it was a strategic failure.

  *   **The Implication:** The mentor views the protagonist's work as **self-indulgent.** In his eyes, she is prioritizing her artistic ego over the collective liberation of her people.
  *   **The Mentor's Argument:** "You want to be free to paint the mess. But your freedom is bought by the blood of men who had to be perfect to get half a chance. We are in a war. In a war, you do not send out scouts to show the enemy where the weak points are. You show them the fortifications. Later, when we are safe, you can paint the cracks in the wall. But not now."
  *   **Why it works:** It frames the conflict as Generational. The mentor is from the Victorian/Reconstruction era where "perfection" was the only shield. The protagonist is the "New Negro" who believes freedom means the right to be flawed.

  ### How to Keep the Protagonist from Losing the Argument
  To keep this from becoming a lecture where the mentor is "right," you need to give the protagonist the counter-arguments that were actually present in the Renaissance (aligned more with Alain Locke or Langston Hughes).

  *   **The Hughes Counter:** "We younger Negro artists who create now intend to express our individual dark-skinned selves without fear or shame. If white people are pleased we are glad. If they are not, it doesn't matter."
  *   **The Psychological Cost:** The protagonist can argue that the "uplift" strategy creates a fractured psyche (Double Consciousness). By painting only the "positive," she is erasing her own lived experience and internalizing the shame she's supposed to be fighting.
  *   **The Inevitability of Truth:** She can argue that sanitized art is easily dismissed as propaganda, whereas raw truth commands respect. "They know we suffer, Mentor. If I paint them saints, they won't believe it. If I paint them human, they might."

  ### A Scene Idea Based on Du Bois's Review of *Home to Harlem*
  In his review of McKay, Du Bois wrote that after reading the book, he felt like he needed a bath. He felt it catered to the "prurient demand" of whites.

  You could have a scene where the mentor takes the protagonist to a gallery opening or a society dinner. White patrons praise her work, but their praise feels predatory. They say things like, *"It's so raw, so instinctual, isn't it?"* or *"I love how you capture the rhythm of the streets."*

  The mentor sees this and says: *"Do you hear them? They aren't seeing your art. They are seeing their own fantasy. You think you are exposing them to the truth, but you are feeding them a meal they have already paid for."*

  This captures the specific Du Boisian fear: that "realism" from a Black artist is consumed by white audiences as confirmation of Black inferiority/primitivism.

  ### Summary for the Mentor's Voice
  To capture Du Bois specifically, the mentor should sound:
  1.  **Weary:** He has been fighting for decades and knows how easily gains are lost.
  2.  **Elitist but Protective:** He believes in the "Talented Tenth." He thinks *he* knows what the race needs better than the masses (or the artist) do.
  3.  **Political, not Moral:** He shouldn't say "Hustling is sinful." He should say "Hustling is a vulnerability we cannot afford to display."

  This makes the tragedy of the novel clear: The mentor is trying to save the race by curating its image, while the protagonist is trying to save her soul by telling the truth. Both are necessary, and both are dangerous.
