      *   *Premise 3:* Leibniz Equivalence (isomorphic models represent the same physical state) is *denied* by the substantivalist.
      *   *Conclusion:* Radical indeterminism (the metric inside the hole is not determined by data outside).
      *   *Earman & Norton's Move:* Accept Leibniz Equivalence to save determinism, reject substantivalism (or at least "manifold substantivalism").

