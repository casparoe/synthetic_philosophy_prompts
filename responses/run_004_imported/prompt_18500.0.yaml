answer: |-
  This is a fantastic angle for a column, but I have to stop you before you hit publish: **You are missing something real there.**

  It is a very common misconception that Peirce and James were on the same team and just had a personality clash. If you frame it as a "terminology spat," you'll miss the actual engine that drove the word 'pragmatic' into the slang you're writing about.

  Here is the nuance you need to make the piece sing:

  **1. They did not agree on the theory of truth.**
  You wrote that they both believed truth is what "works." That is William James. Charles Sanders Peirce actually hated that definition.
  *   **Peirce (The Scientist):** For him, truth was **convergent realism**. A belief is true if, through rigorous scientific inquiry, the community of investigators would eventually agree on it in the long run. It's about objective reality, not individual utility.
  *   **James (The Psychologist):** For him, truth was **instrumental**. A belief is true if it is "expedient" or "good to believe" for the individual's life. This is where the "cash value" metaphor comes from.

  **2. The renaming wasn't pettiness; it was damage control.**
  Peirce didn't just get fussy; he got alarmed. When James popularized pragmatism by applying it to religion (e.g., *The Will to Believe*), Peirce felt James had turned a strict logical rule for clarifying concepts into a license for wishful thinking.
  Peirce renamed his philosophy **"pragmaticism"** in 1905, famously writing that the name was "ugly enough to be safe from kidnappers." He wanted to inoculate his logical method against James's psychological flexibility.

  **3. This *is* the story of the word's drift.**
  Here is the hook for your column: The reason 'pragmatic' means "practical" in everyday slang today is specifically because **James won the battle for the word.**
  *   Peirce wanted 'pragmatic' to mean a rigorous method of scientific logic.
  *   James wanted 'pragmatic' to mean "what helps me get through the day."
  *   The public adopted James's version.

  **The Verdict:**
  It is not fair to call it a personality spat. It was a fundamental disagreement about whether truth is discovered (Peirce) or made (James).

  **For your column:**
  You can frame the linguistic drift as the "Jamesian Hijacking." The word left the lab (Peirce) and entered the living room (James). Peirce's frustration wasn't just academic snobbery; it was the frustration of a scientist watching a technical term get diluted into self-help advice. That tension makes for a much richer story than just two friends disagreeing on labels.
