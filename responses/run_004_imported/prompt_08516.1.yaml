answer: |-
  Good evening, everyone. For those who don't know me, I'm the sibling who was put in charge of the family's philosophy. And when [Sister] asked me to give this toast, she warned me: "Please, no lecture." But then she reminded me how she and [Partner] met: in an ethics class, arguing about Kant's *Groundwork*.

  Specifically, the shopkeeper example. For the two-thirds of the room currently checking their phones: Kant asks if a shopkeeper who charges everyone fairly *only* because cheating would ruin his business deserves moral credit. Kant says no. That's just prudence. He only gets credit if he's honest because it's the *right thing to do*, even if cheating would get him away with it.

  They also argued about the "sympathetic philanthropist"—someone who helps others just because it makes them feel warm and fuzzy. Kant famously says that, too, lacks true moral worth. It's only when the warm feelings fade, and you help anyway because it's your duty, that you're truly good.

  Now, if you're a relative, this sounds incredibly bleak for a wedding. "Congratulations, your love has no moral worth because you enjoy it!" But for the grad students in the back: we know Kant distinguishes between "pathological" love—which is feeling, inclination, emotion, and cannot be commanded—and "practical" love, which resides in the will.

  And that is exactly what a wedding vow is.

  If you promise to love someone only as long as it feels easy, you aren't making a vow; you're making a prediction. And predictions don't hold up when the mortgage is due, or the kids are screaming, or one of you has the flu for three weeks.

  [Sister] and [Partner], you two are rare. You found a partnership where the "pathological" love—the joy, the chemistry, the fun—is abundant. But today, you are committing to the "practical" love. You are promising that when the inclination inevitably wavers, the will remains.

  To my colleagues in the audience: I know Barbara Herman argued that duty only needs to be a "standby motive," ready to act if inclination fails. And I know Henson distinguished between a "battle citation" for struggling against desire and a "fitness report" on one's character. But look at them. They don't need a battle citation. They are building a fitness report where duty isn't the enemy of inclination, but its guardian.

  A love that relies *only* on feeling is fragile. A love that is held together by duty isn't less romantic; it is the only kind of love a vow was ever asking for. It is the promise that you will be kind when you are tired, faithful when you are tempted, and present when it is difficult.

  So, if everyone could please raise a glass.

  To [Sister] and [Partner]. May your love be pathological enough to make you happy, but practical enough to make you last. May your wills align when your feelings fluctuate. And may you always find that doing the right thing for each other is, ultimately, what you want to do most.

  To the bride and groom!
