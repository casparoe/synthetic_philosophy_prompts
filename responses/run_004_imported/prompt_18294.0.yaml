          *   Perceptual Theorist: Argue that this distinction smuggles in perception-like qualities (modularity, encapsulation) and undermines the core of Judgment Theory.
          *   Judgment Theorist: Challenge the "perception" analogy (does it explain anything distinctive or just borrow vocabulary?).
          *   Tone: Sympathetic to both sides, genuine concessions, no clear winner.
      *   **Format:** Dialogue.

  2.  **Character Development:**
