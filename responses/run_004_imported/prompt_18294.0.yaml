      *   Sympathetic portrayal? Yes.

  *(Self-Correction Note)*: Make sure I don't let Julian off the hook too easily. The prompt specifically asks for the Perceptual theorist to press on whether the "automatic judgment" move rescues the theory or smuggles in perception. I need to make sure Priya really lands that point hard. Conversely, Julian needs to really challenge the "perception" label as empty.

  9.  **Final Polish:** Check the voice. Julian should sound slightly more classical/stoic. Priya should sound more empirical/phenomenological.

