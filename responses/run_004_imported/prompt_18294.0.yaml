answer: |-
  **Setting:** *Cruising altitude, somewhere over the Atlantic. The cabin is dimmed for sleep, but the seatbelt sign has just chimed on with a sharp, authoritative ding. The plane shudders—a deep, metallic groan followed by a sudden drop. In seat 14C, a woman in a blazer grips her armrests, knuckles white. She is breathing rapidly.*

  **Julian (Judgment Theorist):** *Adjusting his glasses, watching 14C.* There it is. The textbook case. She's trembling, yet five minutes ago she was telling the flight attendant she flies twice a week for work.

  **Priya (Perceptual Theorist):** *Leaning over the armrest between them, voice low.* And if you ask her now, she'll tell you she knows the plane is safe. She'll recite the statistics. But look at her hands. She is terrified. That's the recalcitrant emotion, Julian. Your boy Robert Solomon would have a hard time explaining why she's judging this situation as "to be feared" while simultaneously judging it as "statistically safe." You can't hold contradictory judgments without irrationality collapsing the system.

  **Julian:** Irrationality is precisely the point, Priya. But we must be careful about what we mean by "judgment." You're treating it like a line item on a balance sheet. *Asset: Safety Statistics. Liability: Turbulence.* But human judgment isn't that clean. She isn't making a reflective, endorsed judgment that she is about to die.

  **Priya:** She isn't making *any* judgment that she is about to die. She explicitly denies it. That's the data.

  **Julian:** She denies it *propositionally*. But look at her physiology. Her muscles are bracing. Her adrenaline is spiking. In that moment, her body is assenting to the proposition: *This is a threat.* It's an automatic, habitual evaluative judgment. It's a commitment to the danger, even if her higher-order cognitive faculties are screaming otherwise. The fear *is* the judgment of danger, but it's operating on a different track than her verbal report.

  **Priya:** *The plane dips again. 14C gasps, eyes shutting tight.* See? That's not a track. That's a module. You're saving the Judgment Theory by redefining "judgment" until it doesn't look like judgment anymore. If this "automatic judgment" is encapsulated—if it keeps firing even when the rest of her mind says "stop, that's false"—then it's functionally identical to a perceptual system.

  **Julian:** Encapsulated?

  **Priya:** Think of the Müller-Lyer illusion. The lines are equal. You measure them. You *believe* they are equal. But your visual system still *sees* one as longer. Your visual module is encapsulated; it doesn't care about your beliefs. If this woman's fear persists despite her belief in safety, her fear is acting like vision. It's presenting the world *as if* it were dangerous, regardless of the facts. That's what Jesse Prinz means by an embodied appraisal. It's a perception of value, not a conclusion of reason.

  **Julian:** *He grips his own knee as a pocket of air hits them.* But "perception" is a metaphor here. You're borrowing the vocabulary of vision to explain away the problem. When you see the illusion, you are processing light wavelengths. What is she "processing" when she perceives danger? Danger isn't a property of the turbulence like length or color. It's a relation between the turbulence and her well-being. To grasp that relation requires a concern for her own safety. That is a cognitive stance. A camera doesn't care if it falls. She does.

  **Priya:** A camera doesn't have an amygdala, Julian. And I'm not saying it's passive like a camera. I'm saying it's *modular*. You're trying to keep "judgment" in the driver's seat to preserve the idea that emotions are essentially rational, or at least answerable to reason. But if this "automatic judgment" is immune to her conscious reasoning, in what sense is it rational? In what sense is it even a *judgment*? If I say "I judge this safe" and my body says "I judge this lethal," and the body wins the emotional experience, you've split the subject in two.

  **Julian:** I haven't split the subject. I've layered her. There is the reflective self, the one doing the CBT, the one reading the safety cards. And there is the embodied self, the one that evolved to avoid falling. The fear is a judgment of the embodied self. It's a primitive form of assent.

  **Priya:** *She watches 14C, who is now whispering to her neighbor.* "I know, I know, it's just air pockets, I know." She's trying to talk her perceptual system down. It's like talking to your eyes to make the illusion go away. It doesn't work. If your theory requires us to say she is simultaneously judging *P* and *not-P*, one of those "judgments" isn't doing the work the word usually does. You're calling it a judgment to keep it in the family of cognition, but you've stripped it of the one thing that makes a judgment a judgment: responsiveness to reasons.

  **Julian:** It *is* responsive to reasons. Just not instantly. If the turbulence stopped, her fear would subside. If the pilot came on and said, "Engine failure," her fear would intensify. It tracks the evidence, just with a lag and a high sensitivity threshold. It's a heuristic judgment. Fast and frugal.

  **Priya:** It tracks the *sensory* evidence. The noise, the drop. It doesn't track the *statistical* evidence. That's the definition of encapsulation. And that's why the perceptual model fits better. It explains why the feeling feels *imposed* on her. She isn't deciding to be afraid. The danger is appearing to her, vividly, like a red patch in a grey field.

  **Julian:** But "appearing" implies a spectator. Who is watching the danger appear? If the fear is a perception, where is the separation between the perceiver and the emotion? With fear, I am *in* the fear. I am constituted by it. That's what Nussbaum gets right. The emotion isn't a mirror held up to danger; it is the acknowledgment of vulnerability. This woman isn't just seeing danger; she is *invested* in her survival. A perceptual theory risks making the emotion too cold. It makes fear a detection system, not a human response.

  **Priya:** *The plane lurches violently to the left. Oxygen masks drop slightly in their compartment before settling. 14C lets out a sharp cry.* Okay. That was real.

  **Julian:** *Exhaling sharply.* Indeed.

  **Priya:** Did you feel that? The spike?

  **Julian:** I did.

  **Priya:** Did you judge that as dangerous?

  **Julian:** *Pauses.* In the moment? Yes. My body did.

  **Priya:** And do you believe, reflectively, that we are in danger?

  **Julian:** No. I know the wings are designed to flex. I know the odds.

  **Priya:** So right now, Julian, you are the recalcitrant subject. You are feeling fear while believing safety. Does your "automatic judgment" explanation feel satisfying from the inside? Does it feel like you made a judgment? Or does it feel like something happened *to* you?

  **Julian:** *He looks at his own hands, which are gripping the armrests.* It feels... involuntary. I grant you that. But "involuntary" doesn't mean "non-cognitive." I can be startled by a loud noise. That's involuntary. But to be *afraid* requires me to take that noise as a sign of harm. If I knew for a fact it was a speaker test, the fear would vanish. The belief *does* matter, eventually. It just loses the sprint to the amygdala.

  **Priya:** But the perceptual theory accounts for the sprint! It accounts for the lag. It explains why you can stand in front of a glass floor and know it's safe but still feel vertigo. You call it a "habitual judgment." I call it a calibrated perceptual system. The difference is, if I call it perception, I don't have to pretend the person is logically inconsistent. She isn't contradicting herself. She's experiencing an illusion of danger.

  **Julian:** But an illusion of what? "Danger" isn't a secondary quality like color. Color is in the eye of the beholder. Danger is about actual potential harm. If you call it a perception, you risk severing the link between the emotion and the *truth* of the situation. If fear is just a perception, like seeing a bent stick in water, then the fear is never "wrong" in a rational sense, just "inaccurate." But we treat phobias as things to be argued with. We use CBT. We offer reasons.

  **Priya:** We offer reasons to retrain the perception. Exposure therapy isn't logical debate; it's recalibrating the sensor. You show the system, repeatedly, that the spider doesn't bite. You change the input-output ratio.

  **Julian:** *He looks at 14C again. The plane has smoothed out. She is unclenching her hands, wiping her palms on her trousers.* She is calming down. Why?

  **Priya:** The stimulus stopped.

  **Julian:** Or, her reflective judgment finally caught up and inhibited the automatic one. She reminded herself: *We are still flying. The wings are attached.* That cognitive override is the human part. If we reduce it to perception, we lose the agency. We lose the fact that she is *managing* this. She is an agent struggling with a commitment, not a camera struggling with bad lighting.

  **Priya:** *Softly.* I don't think we lose the agency. We just locate it differently. It's not the agency of a judge issuing a verdict. It's the agency of a gardener tending a landscape. You can't command the flowers to grow, but you can change the soil. She can't command the fear to stop, but she can change her relationship to the sensation.

  **Julian:** A gardener... That's a softer view of judgment than Solomon usually allows.

  **Priya:** And "automatic judgment" is a softer view of cognition than you usually allow. We're meeting in the middle, Julian.

  **Julian:** *He loosens his grip on the armrest.* Perhaps. Though I still maintain that calling it "perception" borrows a prestige it hasn't earned. Vision is distinct from belief. Emotion is tangled with it.

  **Priya:** And I maintain that calling it "judgment" demands a rationality it doesn't display.

  *The seatbelt sign dings off. The cabin lights brighten slightly. 14C takes a deep, shuddering breath and opens her eyes. She looks at her neighbor and offers a weak, embarrassed smile.*

  **Julian:** She's back.

  **Priya:** The illusion has passed.

  **Julian:** The judgment has been revised.

  **Priya:** *Smiles.* Shall we agree to disagree on the mechanism, provided we agree on the remedy?

  **Julian:** *Looks at his hands, then at hers.* I can agree to that. Though I suspect next time we hit turbulence, I'll still call it a judgment.

  **Priya:** And I'll call it a perception. But we'll both hold the armrests.

  **Julian:** Naturally.
