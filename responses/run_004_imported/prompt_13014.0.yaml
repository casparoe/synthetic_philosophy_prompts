      *   *Is the wager relevant?* Yes, financial stakes can induce bias, even if subconscious.
      *   *Is "interim data" tricky?* Yes, stopping rules and statistical interpretation vary.
      *   *Make sure to distinguish between "rational" (procedural) and "correct" (truth-tracking).*

  8.  **Final Polish:** Organize into clear sections: The Economic Theorem, The Epistemological Debate, The Practical Explanations, and The Verdict. (This matches the structure of the final output).

