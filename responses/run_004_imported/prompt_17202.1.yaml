      *   **Epistemic Contextualism:** The word "knows" changes meaning depending on the *speaker's/attribution's* context (standards shift). If *I* (the attributor) am in a low-stakes context, "Hannah knows" is true. If *I* am in a high-stakes context, "Hannah knows" is false. Hannah's mental state hasn't changed; the truth conditions of the sentence have.
