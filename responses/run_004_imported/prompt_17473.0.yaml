  **MEMORANDUM**

  **TO:** Pretrial Risk-Assessment Oversight Committee
  **FROM:** [Your Name], Committee Member (Ethics Liaison)
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Risk-Assessment Tool Calibration and Usage

  ### Executive Summary

  This memo addresses the deadlock regarding our pretrial risk-assessment tool. We face a mathematically proven trade-off: we can maintain *calibration* (where a "High Risk" score predicts the same reoffending probability across races) or *error rate balance* (where false positives are distributed equally across races), but current data indicates we cannot achieve both simultaneously.

  After reviewing the technical data and the ethical implications of both configurations, **I recommend the Committee vote to immediately suspend the use of the tool's risk scores for individual detention or release decisions.**

  We should transition to a system where the tool is used only for aggregate resource allocation and monitoring, while individual liberty decisions return to qualitative, individualized assessments. This recommendation includes a 90-day timeframe to implement the suspension and convene a working group to explore alternatives.

  ### The Mathematical Constraint

  As the vendor's report confirmed, we are encountering the "Impossibility Theorem" described in fairness literature (e.g., Chouldechova, 2017; Kleinberg et al., 2016). Because the base rates of recorded reoffending differ between racial groups in our dataset—due to a complex mix of actual behavior, policing patterns, and prosecutorial discretion—statistical fairness metrics are mutually exclusive.

  *   **Option A (Revert):** We restore calibration. A "High Risk" score means the same thing for everyone. However, innocent defendants from one racial group will be wrongly flagged as high-risk at nearly double the rate of another.
  *   **Option B (Keep):** We maintain the vendor's recalibration. False positive rates are equalized. However, a "High Risk" score now corresponds to a significantly lower actual probability of reoffending for one group than the other.

  ### Ethical Analysis of the Deadlock

  Both options impose a moral cost. The question is not which option is "fair," but which unfairness is less corrosive to the legitimacy of our pretrial system.

  **The Case for Reverting (Calibration)**
  Proponents argue that a risk score must be truthful. If a judge hears "High Risk," they must understand that the probability of reoffending is identical regardless of the defendant's race. To do otherwise violates principles of *procedural justice* and *transparency*. If the score means different things for different people, it ceases to be an objective metric and becomes a demographic proxy.

  **The Case for Keeping (Error Rate Balance)**
  Proponents argue that the primary harm of pretrial systems is the wrongful deprivation of liberty. If the original tool detained innocent people from one racial group at twice the rate of another, it constituted a disparate impact on liberty interests. Equalizing false positives ensures that the *burden of error* is shared equally, aligning with *Equal Protection* principles.

  ### Engagement with the "Keep" Position

  I want to engage seriously with the argument for keeping the recalibrated version (Option B), as I believe it rests on the strongest moral foundation of the two.

  The argument here is that **wrongful detention is a graver harm than misleading statistics.** If we revert to the calibrated version, we are explicitly accepting a policy where innocent people in Group X are more likely to be jailed than innocent people in Group Y. In a system premised on "innocent until proven guilty," tolerating a known disparity in false positives is difficult to justify. The proponents of keeping the recalibrated tool are correctly identifying that the *consequence* of the error (jail time) matters more than the *semantic accuracy* of the score. They argue that we should prioritize minimizing the disparate impact on human liberty, even if it means the "High Risk" label is statistically noisier for one group.

  This is a compelling utilitarian argument. It prioritizes the reduction of concrete harm (unnecessary jail time) over abstract consistency (score meaning).

  **Why This Is Insufficient for Individual Decisions**
  However, while equalizing error rates reduces disparate impact, it introduces a different due process violation. In a pretrial hearing, a defense attorney must be able to challenge the evidence. If the tool is not calibrated, the defense cannot accurately argue the probability of reoffending without introducing the defendant's race as a variable. This forces the court to explicitly racialize the risk assessment to understand it.

  Furthermore, by equalizing error rates without fixing the underlying base rate disparity, we are essentially "baking in" the historical biases of our policing data. We are making the tool *procedurally* fairer regarding errors, but we are legitimizing a dataset that may reflect over-policing rather than over-criminality. Using this tool for individual detention grants a veneer of scientific objectivity to a process that remains fundamentally compromised.

  ### Recommendation: Suspend for Individual Decision-Making

  Because the mathematical impossibility theorem proves that *some* form of unfairness is inevitable as long as we rely on these specific inputs, the tool lacks the moral legitimacy required to deprive individuals of liberty.

  **I recommend we suspend the use of the risk scores for individual detention/release decisions.**

  1.  **Liberty requires certainty we cannot provide:** When the math proves we cannot define "risk" fairly across groups, we should not use that definition to jail people.
  2.  **Avoiding the "Lesser Evil" Trap:** Choosing between calibration and error rate balance forces the Committee to choose which form of bias to institutionalize. Refusing to choose is an ethical stance in itself.
  3.  **Preserving Utility:** The tool can still be used for *aggregate* monitoring (e.g., identifying needs for supervision resources) where individual liberty is not at stake.

  ### Implementation Timeframe

  *   **Immediate (Effective Monday):** Risk scores are removed from pretrial bail/detention recommendation forms. Judges and commissioners will be notified that scores are currently under review and should not be cited in rulings.
  *   **Days 1–30:** Pretrial services staff will revert to structured professional judgment (qualitative interviews) for individual assessments, focusing on stable community ties and specific charge circumstances rather than algorithmic risk.
  *   **Days 30–90:** A subcommittee (including Defense Bar representation) will convene to:
      *   Review whether base rate disparities can be addressed at the data collection level (e.g., using "re-arrest" vs. "re-conviction" vs. "failure to appear").
      *   Evaluate alternative assessment models that do not rely on historical arrest data.
  *   **Day 90:** The subcommittee will report back to the full Committee with a recommendation on whether to retire the tool permanently or propose a new validation study.

  ### Conclusion

  We are caught in a trap where the mathematics of fairness reveals the sociology of our data. The fact that we cannot satisfy both calibration and error rate balance is not a failure of the vendor; it is a signal that our historical data contains structural biases that no statistical adjustment can fully scrub.

  Until we can resolve the base rate disparity, using this tool to determine individual liberty forces us to choose between lying about risk or tolerating disparate wrongful detention. As an ethics committee, we should decline to make that choice on behalf of defendants. We must suspend the tool's use for detention decisions to preserve the integrity of the court.

  I look forward to discussing this path forward on Thursday.
