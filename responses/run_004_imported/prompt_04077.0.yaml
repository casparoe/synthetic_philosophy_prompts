  2.  **Deconstruct Lewis's Position:**
      *   *Modal Realism:* Possible worlds are concrete, spatiotemporally isolated entities. What is possible is what exists at some world.
      *   *Truth in Fiction (Original):* A proposition $P$ is true in fiction $F$ iff $P$ holds at all the closest possible worlds where $F$ is told as known fact.
      *   *The Problem:* Inconsistent fictions (e.g., Watson's wound is in the shoulder *and* in the leg). No possible world can contain a contradiction (assuming classical logic holds at worlds).
      *   *The Patch (Method of Union):* Instead of looking for worlds where the *whole* story is told as fact, look at the union of sets of worlds where *parts* of the story are told as fact.
          *   Set A: Worlds where Watson's wound is in the shoulder.
          *   Set B: Worlds where Watson's wound is in the leg.
          *   Truth in Fiction = Union of truths in A and truths in B.
          *   Result: $P$ is true, $Q$ is true, $(P \land Q)$ is false. Closure under conjunction fails.

  3.  **Brainstorming the Argument (The "Undermining" Angle):**
      *   *Premise 1:* Lewis's modal realism relies on possible worlds being logically consistent (classical logic applies within a world). A world cannot contain $P$ and $\neg P$.
      *   *Premise 2:* Lewis defines "Truth in Fiction" as derivative of "Truth at a World." It's supposed to be an analysis *using* the machinery of worlds.
      *   *Observation:* The Method of Union admits that there is *no single world* (or set of worlds treated as a single semantic unit) that represents the fiction. It fragments the fiction into incompatible world-sets.
      *   *The Crux:* If "Truth in Fiction" is just a shorthand for a complex relation to multiple, mutually exclusive world-sets, then "Truth in Fiction" is not a unified semantic property grounded in a specific ontological reality (a world). It becomes a pragmatic, fragmented construct.
      *   *The Punchline:* This suggests "Truth in Fiction" isn't reducible to "Truth at a World." It's a sui generis notion that *uses* worlds as tools but isn't *defined* by them in the way Lewis claims. If the definition requires breaking the core rule of worlds (consistency/closure), then the analysis fails to reduce fiction to modality.

  4.  **Developing the Philosophical Argument (Step-by-Step):**

      *   *Point 1: The Ontological Mismatch.* Modal realism treats worlds as concrete totalities. A fiction, under the Method of Union, is treated as a fragmented abstraction that no single world can embody. If the fiction doesn't map to a world (or a consistent set of worlds), what is the ontological status of the "fictional world"? It ceases to be a "possible world" in Lewis's sense.
      *   *Point 2: The Failure of Reduction.* Lewis wants to reduce semantic notions (truth in fiction) to ontological ones (existence at a world). By giving up closure, he admits the semantic notion operates by rules different from the ontological basis. The map no longer matches the territory.
      *   *Point 3: The "Impossible World" Backdoor.* By allowing $P$ and $Q$ to be true while $(P \land Q)$ is false, Lewis is effectively simulating an *impossible world* (a world where contradictions hold) without admitting he's using impossible worlds. He's smuggling in impossible world semantics while claiming to use only possible worlds. This weakens the motivation for Modal Realism (which prides itself on not needing impossible worlds).
      *   *Point 4: The Epistemic Shift.* The Method of Union shifts the focus from "what is the case" (metaphysics) to "what we are licensed to infer" (epistemology/pragmatics). This betrays the realist ambition.

