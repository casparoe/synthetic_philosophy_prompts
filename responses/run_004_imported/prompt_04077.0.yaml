      *   *Is this a fatal blow to Modal Realism?* Philosophers debate this. Some say it's a cost, others say it's a feature. For the user's purpose, we need to argue it's a *fatal conceptual tension*, not necessarily that Modal Realism is objectively false (since that's undecidable), but that the *connection* between fiction and worlds is severed.
