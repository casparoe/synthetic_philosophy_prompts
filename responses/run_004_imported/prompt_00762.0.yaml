answer: |-
  Your instinct was correct, and your friend's reading of Anscombe is a fundamental category error regarding her moral philosophy. To put it plainly: **Anscombe's argument against Truman is not consequentialist, and therefore recalculating the casualty figures does nothing to undermine it.**

  In fact, Anscombe would likely argue that your friend's reliance on the "body count" arithmetic is precisely the kind of immoral reasoning that led to the decision to drop the bombs in the first place.

  Here is a breakdown of Anscombe's actual argument in *Mr. Truman's Degree* (1956), how it relies on the distinction between intended and foreseen effects, and why the "invasion alternative" is irrelevant to her case.

  ### 1. The Core Principle: The Immunity of the Innocent
  Anscombe's argument is deontological (rule-based) and rooted in Natural Law tradition, not utilitarianism. Her central premise is that there are certain actions that are **intrinsically evil** and forbidden regardless of their consequences.

  For Anscombe, the intentional killing of the innocent is one of these absolute prohibitions. In the context of war, this translates to the principle of non-combatant immunity. Civilians are not legitimate targets. To make them the object of attack is murder, not war.

  In *Mr. Truman's Degree*, Anscombe argues that Truman authorized the mass killing of civilians as a *means* to an end (forcing Japanese surrender). Because the act itself is inherently unjust, the goodness of the end (ending the war, saving lives that might have been lost in an invasion) cannot justify it. As she famously puts it, one cannot do evil that good may come of it.

  ### 2. Intention vs. Foreseeability (The Doctrine of Double Effect)
  You recalled correctly that Anscombe is closely associated with the distinction between intended and foreseen effects (often discussed under the **Doctrine of Double Effect**). This is the crux of why she rejects the "arithmetic" objection.

  *   **Foreseen but Unintended:** If a military targets a legitimate munitions factory, and civilians living nearby unfortunately die as a side effect, those deaths are *foreseen* but not *intended*. In traditional Just War Theory (which Anscombe defends), this can be permissible under strict conditions (proportionality, necessity).
  *   **Intended:** If a military targets a city *specifically* to kill civilians or destroy their homes in order to break their will to fight, those deaths are *intended*. They are the method chosen to achieve the victory.

  Anscombe argued that the atomic bombings were clearly the latter. The destruction of the civilian population was not an unfortunate accident of targeting a military site; the civilian centers *were* the target. The terror and death inflicted were the very mechanism by which the surrender was to be coerced. Therefore, in her view, Truman intentionally murdered innocent people.

  ### 3. Why the "Invasion Alternative" is Irrelevant
  Your friend's argument rests on a consequentialist calculus: *If Bombing Kills X people, but Invasion Kills 2X people, Bombing is morally preferable.*

  Anscombe explicitly rejects this framework. In her view, morality is not a math problem where you balance lives on a scale.
  *   **The Act vs. The Outcome:** For a consequentialist, the morality of an act is determined by its outcome. For Anscombe, the morality is determined by the nature of the act itself.
  *   **No Justification by Consequence:** Even if an invasion would have cost 10 million lives, and the bombs cost 200,000, Anscombe would argue you are not permitted to murder 200,000 innocents to save the 10 million. You cannot commit a grave injustice (mass murder) to prevent a tragedy (war deaths).

  In *Mr. Truman's Degree*, she writes:
  > "It is meaningless to talk about 'justifying' the killing of the innocent... The killing of the innocent is not a means to a just end; it is an inherent evil."

  Therefore, historical revisionism regarding the casualty estimates of Operation Downfall (the planned invasion) is philosophically inert against Anscombe's position. She would say: *"Even if Truman was right that the bombs saved a million lives, he still committed murder."*

  ### 4. Context: "Modern Moral Philosophy"
  It is helpful to know that two years after the Truman pamphlet, Anscombe published the paper *"Modern Moral Philosophy"* (1958). This is one of the most famous papers in 20th-century ethics. In it, she attacks consequentialism (utilitarianism) directly, arguing that it has corrupted modern moral thought by allowing people to justify horrific actions based on "the greater good."

  She viewed the bombing of Hiroshima and Nagasaki as the prime example of this corruption: the belief that "justice" can be set aside if the consequences are dire enough. To attribute a consequentialist argument to Anscombe is to attribute to her the very viewpoint she spent her career dismantling.

  ### Summary for Your Debate
  To settle the disagreement with your friend, you can make these three points:

  1.  **Category Error:** Anscombe is not making a utilitarian argument about net lives saved; she is making a deontological argument about the intrinsic nature of the act.
  2.  **Intentionality:** Her objection is that the civilians were the *intended means* of coercion, not collateral damage. This makes the act murder, regardless of the strategic necessity.
  3.  **The "Dirty Hands" Rejection:** Anscombe rejects the "dirty hands" theory (that leaders must sometimes do evil for the greater good). For her, a leader who does evil forfeits their moral standing, regardless of the political outcome.

  **Conclusion:** Recalculating the casualty figures in Truman's favor would not soften Anscombe's case in the slightest. In her framework, Truman was a mass murderer the moment he ordered the targeting of civilians. The fact that it might have been "worse" otherwise is a tragic circumstance, but it does not change the moral quality of the act. Your instinct was right: for Anscombe, the math doesn't matter because the act was forbidden in the first place.
