answer: |-
  The candle gutters, casting long, nervous shadows against the stone. My companion is pacing, hand hovering over the map—Damascus on one side, Aleppo on the other. He looks at me, eyes wide with the specific terror of a man who has read too much logic and not enough theology.

  "You're overthinking it," I say, though my own hand is steady only by force of will.

  "I'm thinking it exactly enough," he snaps. "That's the problem. If I stay, Death predicted I'd stay. He's in Damascus. If I run, Death predicted I'd run. He's in Aleppo. Causal Decision Theory says my choice doesn't *cause* his location—the ledger is already written—but my choice is *evidence* of it. It's a loop. A snake eating its own tail."

  He stops pacing and leans over the table, gripping the edge until his knuckles bleach white.

  "So you see the trap," I say.

  "I see that pure strategies are unratifiable," he corrects, his voice dropping to a harsh whisper. "Jeffrey's definition. A choice is ratifiable only if, *conditional on making that choice*, it remains the best option. If I decide to stay in Damascus, I must condition on the fact that I have decided to stay. But if I decide to stay, that is evidence Death predicted 'Stay.' Therefore, Death is in Damascus. Conditional on staying, my expected utility is death. Conditional on fleeing, my expected utility is life. So, given I chose to stay, I wish I had fled. Stay is unratifiable."

  "And Aleppo?"

  "Same logic. If I choose Aleppo, that's evidence Death predicted Aleppo. So he's there. Conditional on fleeing, I wish I had stayed. Both pure options are self-undermining. They are lies I tell myself that I know are lies the moment I tell them."

  He reaches for his sword, then pulls his hand back. "So I do nothing? I let the paralysis kill me?"

  "No," I say, reaching into my tunic and pulling out a silver dirham. "You make the only move that closes the loop. You flip this."

  He stares at the coin like it's a viper. "Randomization? You think Death is blind to chance? If he is a perfect predictor, he knows the trajectory of the coin. He knows the air resistance. He knows the neural firing in my thumb that determines the flip. He knows the outcome before I do. If I flip heads, he predicted heads. He's in Damascus. I die. The coin changes nothing."

  This is the objection. The hard wall. And it is where most men stop thinking. But you asked for rigor, so here it is.

  "You are confusing predicting the *outcome* with predicting the *strategy*," I say, spinning the coin on the table. It hums, a blur of silver. "Death is a predictor of *agents*. He predicts what you will *decide* to do. If you decide 'I will stay,' he writes Damascus. If you decide 'I will flee,' he writes Aleppo. But if you decide 'I will submit to chance,' what does he write?"

  "He writes where the chance will land," my companion argues.

  "Only if the universe is deterministic," I counter. "But even if it is, consider the *rationality* of the move, not the survival. You are obsessed with living. I am talking about coherence. If you adopt the policy of randomization—a 50/50 mixed strategy—you force Death into a Nash Equilibrium. If he knows you are flipping, his best strategy to ensure he catches you is also to distribute his probability 50/50. He cannot favor one city without giving you an advantage."

  "But he *does* favor one city! He writes one name!"

  "Then he is not playing optimally against a randomizer," I say. "But listen to me. The point of the coin is not to hide from Death. It is to make your decision *ratifiable*. When you choose to stay, you have a reason to switch. When you choose to go, you have a reason to switch. When you choose to *flip*, do you have a reason to switch?"

  He opens his mouth, then closes it.

  "Conditional on adopting the policy of flipping," I press, "the expected utility of staying is equal to the expected utility of fleeing. Why? because the coin severs the evidential link between your *deliberation* and your *action*. Your deliberation ends at 'I will flip.' The outcome is not a decision; it is an event. Therefore, conditional on 'I will flip,' there is no alternative action you prefer. You don't look at the spinning coin and think, 'I should have chosen Damascus.' You think, 'I chose to let fate decide.' That is the only state where your mind is at rest. That is the only ratifiable choice."

  "It feels like surrender," he mutters.

  "It is surrender," I agree. "It is surrendering the illusion of control to save the integrity of the choice. You cannot out-predict a perfect predictor. If you try to use your brain to outguess him, you are using the very thing he is predicting. You are a book he has already read. But a coin... a coin is noise. To the extent that the coin is truly random, even a perfect predictor can only assign probabilities, not certainties."

  "And if it's not random? If he knows the result?"

  "Then you die either way," I say, catching the coin and slapping it onto the back of my hand. "If the universe is fixed, you were dead the moment you entered the room. The ledger was written before you were born. In that case, rationality is meaningless. But if there is any gap at all—if there is any space for agency—then the pure strategies fill that gap with regret. They guarantee that in your final moment, you will know you made the wrong choice. The coin guarantees nothing but fairness. It ensures that whatever happens, you did not *choose* your death. You chose *chance*."

  I lift my hand. I don't look at the coin. I look at him.

  "Stay or Go are lies. They pretend you have information you don't. They pretend your choice is free when it is already predicted. The Flip is the only truth. It admits that against a perfect predictor, your will is not a shield. It is a variable. So make yourself a variable he cannot solve without solving the universe itself."

  I thumb the coin into the air. It catches the candlelight, spinning end over end, a silver blur between Damascus and Aleppo.

  "Call it," I say. "Not because it will save you. But because it is the only choice you won't regret before it kills you."
