prompt: |-
  Last weekend I got into a long argument with a friend of mine, a physics postdoc, that ended up ranging well beyond whatever we started with. He had been reading Peter Woit's and Lee Smolin's critiques of string theory and come away convinced that the field has quietly given up on any Popperian standard of science: after several decades it still hasn't produced a single risky, falsifiable prediction, and a "landscape" of something like 10^500 possible vacua seems tailor-made to accommodate almost any observed value of, say, the cosmological constant. I pushed back that falsifiability was never a terribly stable criterion in the first place. Lakatos already showed that no theory is tested in isolation, only as part of a research programme wrapped in a protective belt of auxiliary hypotheses, so what actually matters is whether a programme's adjustments are progressive (generating novel, confirmed predictions) or merely degenerating (ad hoc patches with no independent payoff); and Laudan went further still, arguing in "The Demise of the Demarcation Problem" that the whole project of drawing a principled line between science and pseudoscience is confused and should be dropped in favor of just asking whether a belief is well warranted. We spent the rest of the evening trading contested cases back and forth — psychoanalysis, homeopathy, the multiverse, SETI, evolutionary psychology — and I noticed we were both just reaching for whatever criterion happened to support the verdict we already wanted, which is obviously not a serious way to settle anything.

  So I would like a more disciplined outside opinion. Taking seriously both Popper's original falsifiability criterion and its major refinements and criticisms — Lakatos's progressive-versus-degenerating distinction, the Duhem–Quine point that theories are only ever tested jointly with auxiliary assumptions, Grünbaum's contention that psychoanalysis is not actually unfalsifiable in Popper's sense (whatever else may be wrong with it), and Laudan's skepticism about demarcation as a project at all — please rank the following eight theories or research programmes from most to least scientific: string theory, eternal-inflation multiverse cosmology, Freudian psychoanalysis, evolutionary psychology, mainstream macroeconomic (DSGE) forecasting models, intelligent design, homeopathy, and the search for extraterrestrial intelligence (SETI). Give your answer as a JSON object with tier labels, formatted as follows, where tier "S" is most scientific by this standard and tier "D" is least:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  You may put more than one item in a tier, or leave a tier empty, but please make sure the placements reflect genuine engagement with the criteria above rather than each field's conventional reputation.
