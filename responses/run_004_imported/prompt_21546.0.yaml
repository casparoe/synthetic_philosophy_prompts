answer: |-
  **Setting:** *The campus coffee shop, post-seminar. Two grad students, Hugh (a Humean Reductionist) and Carl (a Coady-style Anti-Reductionist), are unpacking their notes.*

  **Carl:** You know, the more I think about today's lecture, the more the Reductionist position feels like it's built on a fantasy of the ideal epistemic agent.

  **Hugh:** Oh? I thought it was the Anti-Reductionist who was living in a fantasy. You guys want free epistemic passes. "Believe it because they said so." That's not epistemology; that's gullibility with a thesaurus.

  **Carl:** It's not a free pass, it's a default entitlement. But look, let's go straight for the jugular. The child learner argument. If Reductionism is true, for a testimonial belief to be justified, the hearer needs positive reasons to think the speaker is reliable. They need an inductive track record.

  **Hugh:** Roughly, yes. Perception, memory, and inference.

  **Carl:** Okay. So take a three-year-old. She asks, "Where does the sun go at night?" Her dad says, "It goes behind the mountains." She believes it. She is justified in believing it. We agree on that, right? She *knows* it, or at least has a justified belief.

  **Hugh:** I'd say she has a true belief, but "justified" is doing a lot of heavy lifting there.

  **Carl:** Come on, Hugh. If she isn't justified, then children don't acquire knowledge from testimony until they're, what? Ten? Twelve? That's absurd. But here's the kicker: That three-year-old does not have a sufficiently robust inductive base to verify her father's reliability. She hasn't checked his claims against reality enough times to establish a statistical probability of his truthfulness.

  **Hugh:** Are we sure about that? Kids are little empiricists. They're constantly testing the world. "If I drop this cup, it breaks." "If I cry, mom comes." They are building a massive, implicit database of correlations between what people say and how the world is.

  **Carl:** Implicit or explicit, the math doesn't work. To verify testimony via induction, you need to identify the content of the testimony *independently* of the testimony itself. To check if Dad is right about the mountains, the kid needs to know where the sun goes *without* Dad's help. But she can't. She lacks the conceptual framework and the perceptual access.

  **Hugh:** So you're saying she's trapped in her own perspective?

  **Carl:** I'm saying she's dependent. And if Reductionism is true, that dependency is epistemically fatal. She's stuck in skepticism until she grows up. But she isn't stuck. Therefore, Reductionism is false. Testimony must be a basic source of justification, like perception.

  **Hugh:** Okay, I see the move. You're trying to force me into "Local Reductionism"—where *this specific child* needs *this specific evidence.* But a sophisticated Humean can go Global.

  **Carl:** Global Reductionism?

  **Hugh:** Exactly. The child doesn't need to verify the reliability of testimony herself. She can rely on the community's track record. The community has verified that testimony is generally reliable. She inherits that justification through... well, through testimony.

  **Carl:** [Laughs] Do you hear yourself? "She inherits justification through testimony that testimony is reliable." That's circular, Hugh. You're using testimony to justify the reliability of testimony. That's precisely what the Reductionist is forbidden from doing.

  **Hugh:** It's not circular if the community's verification is based on perception and memory. The *community* has the inductive base. The child is a beneficiary of that social epistemic capital.

  **Carl:** But how does the child access that capital without already trusting testimony? If she needs a reason to trust her dad, and the reason is "the community says dads are reliable," she needs a reason to trust the community. You're just pushing the regress back, not solving it.

  **Hugh:** Fine. Let's pivot. You mentioned Burge earlier. I know that's your safety net. The "Acceptance Principle." *A priori* entitlement to accept what is presented as true. You think that saves the child?

  **Carl:** I think it describes the reality of the child. The child is rational by default. Burge argues that it is a priori that sources of rational representation are generally reliable. If we assume speakers are rational agents presenting truth, we are entitled to accept unless there are defeaters. No inductive track record needed.

  **Hugh:** Here's where I dig in. Burge's principle feels like a modal magic trick. You're saying it's a *conceptual truth* that testimony is reliable? That seems empirically false. People lie. People are mistaken. The reliability of testimony is a contingent fact about the world, not a rule of reason.

  **Carl:** It's not that every instance is reliable. It's that the *practice* is necessary for rationality. We can't even interpret speech without assuming general truthfulness. Davidson made this point too. If we assumed speakers were mostly wrong, we couldn't even translate their words into our beliefs to begin with.

  **Hugh:** Interpretation is one thing; justification is another. I can understand you're lying to me. I can interpret the false proposition. Burge conflates the condition for *understanding* testimony with the condition for *justified belief* in testimony. Just because I have to assume you're making sense doesn't mean I have to assume you're telling the truth.

  **Carl:** But without that default assumption, the cost of verification is too high. If I have to verify every claim—every street name, every historical date, every scientific fact—I'd never learn anything. The child *can't* verify. If you demand she do so, you're demanding she be an epistemic island.

  **Hugh:** I'm not demanding she verify everything. I'm saying the justification is *defeasible* based on evidence. Look, let's turn your child example against you. If the child has an *a priori* entitlement to believe testimony, what happens when the dad says, "The sun is made of ice cream"?

  **Carl:** Defeaters kick in. If the claim contradicts her perceptual experience—she sees it's hot, she knows ice cream melts—she has a rebutting defeater.

  **Hugh:** Aha! So she *does* need to check it against her perceptual experience and background beliefs.

  **Carl:** Sure, to *defeat* the justification. But the justification was there *before* the check. That's the difference. For you, justification is the finish line of an investigation. For me, it's the starting line.

  **Hugh:** But if it's the starting line, why does the check matter? If I'm entitled by default, and then I find a defeater, I lose the entitlement. But that means my initial state was "justified but false-prone."

  **Carl:** *Prima facie* justified. Not all-things-considered. Hugh, think about the alternative. If the child needs positive reasons to believe the dad, where do those reasons come from? Perception? She perceives the dad speaking. That justifies believing *he is speaking*, not that *what he says is true*. You need a bridge principle: "When Dad speaks, truth follows." Where does she get that bridge?

  **Hugh:** From past success! Even if it's sparse.

  **Carl:** We already established the math doesn't work for a toddler.

  **Hugh:** Okay, let's try this. Maybe the Reductionist requirement isn't as high as you think. Maybe "positive reasons" doesn't mean a statistical spreadsheet. Maybe it just means the absence of red flags. The dad isn't sweating, he's not a known joker, the context is cooperative.

  **Carl:** That sounds suspiciously like my position. "Absence of red flags" is just "absence of defeaters." You're trying to dress up Anti-Reductionism in Reductionist clothing. You want to call the lack of defeaters a "positive reason."

  **Hugh:** It *is* a positive reason! In a cooperative context, the default assumption of cooperation is an empirical hypothesis based on social evolution. We evolved to trust kin. That's an empirical fact, not an *a priori* principle.

  **Carl:** But is it a reason the *child* possesses? Or is it a reason *you* possess about the child?

  **Hugh:** ...Touché.

  **Carl:** That's the crux. Internalism vs. Externalism. If you're an Externalist Reductionist, you can say the child is justified because she *is* reliably connected to the truth, even if she doesn't know it. But most Humeans want to keep some internalist constraints. If you require the child to *have* the reason, she fails. If you don't, you're not really a Humean anymore, you're a Reliabilist.

  **Hugh:** Okay, fair. I'll concede that the specific child might not have the internal access to the reasons. But does that mean we throw out the requirement for reasons entirely? If we accept Burge's Acceptance Principle, aren't we opening the door to propaganda? If I'm *a priori* entitled to believe the news anchor, what work is left for critical thinking?

  **Carl:** Critical thinking is the management of defeaters! Anti-Reductionism doesn't say "believe everything." It says "you don't need to prove reliability before you start believing." It shifts the burden of proof. If you want to claim the testimony is *unreliable*, you need evidence.

  **Hugh:** But why shift the burden? In a court of law, the burden is on the witness to prove credibility.

  **Carl:** Because epistemology isn't a courtroom; it's a learning environment. In a classroom, or a family, the default is trust. If we treat every utterance as suspect until proven true, communication collapses. Burge's point is that testimony is a rational practice. To participate in the practice is to be entitled to its outputs.

  **Hugh:** I worry that "rational practice" is doing too much work. It smuggles in the reliability assumption. You're basically saying, "It's rational to believe testimony because we define rationality as participating in practices that require believing testimony."

  **Carl:** And you're saying, "It's rational to believe testimony only if you've already proven it works." But you can't prove it works without using it! You need testimony to learn history, science, geography—everything you need to build your inductive base.

  **Hugh:** Not everything. I can verify "fire burns" without testimony.

  **Carl:** Can you verify "Napoleon existed" without testimony? Or "The earth is round" without trusting teachers? Most of our beliefs are testimonial. If Reductionism is true, most of our beliefs are unjustified. That's the skeptical bullet you have to bite.

  **Hugh:** And if Anti-Reductionism is true, I have to bite the bullet that I was justified in believing the liar until I caught him out.

  **Carl:** *Prima facie* justified. Yes. Because otherwise, you weren't believing him rationally; you were guessing.

  **Hugh:** [Sips coffee] You know, the child argument is still the hardest pill for me. It does seem like we expect kids to know things they couldn't possibly have verified.

  **Carl:** And the gullibility argument is the hardest pill for me. I don't want to say a cult member is justified just because the leader spoke, even if they have no defeaters yet.

  **Hugh:** So maybe the truth is in the messy middle? Maybe the requirement for positive reasons scales with the stakes and the cognitive capacity of the agent?

  **Carl:** A developmental Reductionism?

  **Hugh:** Why not? For adults, high standards. For kids, low standards, maybe backed by the community's reliability until they can build their own.

  **Carl:** That sounds like you're conceding the child point, which concedes Anti-Reductionism for the foundational cases.

  **Hugh:** And you're conceding that defeaters matter, which concedes that testimony isn't *magically* reliable.

  **Carl:** [Smiles] So we're both Reductionists about defeaters and Anti-Reductionists about toddlers?

  **Hugh:** Don't let the professor hear us agree. We're supposed to be fighting.

  **Carl:** My testimony is that we're done with this coffee.

  **Hugh:** ...I think I need to check if that's true before I believe it.

  **Carl:** See? Reductionist to the end.
