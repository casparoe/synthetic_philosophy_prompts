answer: |-
  The rain in Ostaris did not wash things clean; it only made the grime slicker. It drummed against the high, narrow windows of the scriptorium where Father Elian sat, the candlelight guttering over his manuscript. He was not copying scripture tonight. He was writing a letter to the High Justiciars, a document that required more care than any prayer.

  The door opened without a knock. Lord Kaelen stood in the threshold, water dripping from his cloak onto the stone floor. He was a man of sharp angles and harder eyes, the sort of knight who believed the weight of a sword was the only measure of truth.

  "Is it done?" Kaelen asked.

  Elian dipped his quill, watching the ink swell. "The letter is written. It details the King's violations of the ancient charters. It calls for a convocation of the Peers to determine if the crown has been forfeit by abuse."

  Kaelen stepped into the room, shaking the rain from his hair like a hound. "A convocation. While Alaric's tax collectors break the legs of millers who can't pay? While his guards drag daughters from their beds? You write letters, priest. I intend to stop the bleeding."

  Elian set the quill down. He looked at the knight, feeling the heavy weight of the distinction in his gut. This was the hinge upon which the kingdom would turn, and he feared Kaelen did not see it.

  "Stop the bleeding by cutting the throat?" Elian asked softly.

  "By removing the head of the snake." Kaelen moved to the table, placing a gloved hand on the parchment. "Tomorrow night. The King rides to the hunting lodge alone. I have the archers positioned."

  "Kaelen, listen to me." Elian stood, coming around the table. "We have discussed this. The nature of the remedy must match the nature the disease. You know the law."

  "I know the law is written by men who eat while the starving dig roots," Kaelen snapped.

  "Not that law. The higher law. The order of things." Elian leaned in. "Did Alaric steal the crown? Did he invade Ostaris from the south? Did he murder his brother to take the throne?"

  "No. He is the eldest son. The bloodline is pure."

  "Then he is not a usurper," Elian said, the words precise, sharp as a scalpel. "He holds *public authority*. He has the title. The office is his, even if the man is wicked."

  Kaelen scoffed. "He is a tyrant. That voids the title."

  "It does not. Not for you. Not for me." Elian's voice hardened. "If a man seizes power without right, he is a private citizen acting as a ruler. He may be repelled by any private citizen. That is defense. But Alaric? He is the King. To strike him down without the consent of the Public Authority—the Council of Peers, the Church—is not justice. It is sedition."

  "Sedition?" Kaelen's hand tightened on the parchment, crumpling the edge. "I am saving the common good!"

  "Are you?" Elian asked. "Aquinas teaches that the tyrant sows discord, yes. But the private man who kills a legitimate king sows something worse. He teaches that power flows from the blade, not the law. If you kill Alaric tomorrow, you do not restore the kingdom. You announce that any man with a dagger and a grievance may rule."

  "I am not 'any man.' I am a Lord of the Realm."

  "You are a private subject in this act," Elian countered. "Unless the Council speaks, you act alone. And if you act alone, you fracture the unity of the state. You become the greater danger to the peace than the King."

  Kaelen pushed the parchment away. It slid across the wood and fell to the floor. "The Council is cowardly. They wait for permission to be brave. The people are dying *now*, Elian. Your 'Public Authority' is a ghost. The suffering is real."

  "The suffering is real," Elian agreed, his voice dropping. "But the cure must not kill the patient. If you strike him as a private man, the Council will not hail you as a liberator. They will fear you. They must condemn you to preserve the sanctity of the Crown itself. If they validate your dagger, they validate the next dagger that comes for *them*."

  "Let them come." Kaelen turned to the door.

  "Kaelen, wait." Elian reached out, gripping the knight's wet sleeve. "If you do this, you die. And worse, the tyranny continues. Alaric has a brother. A harder man. Without the Council's legal decree to strip Alaric of his title first, the brother inherits by right of blood. You will trade a cruel king for a vicious one, and you will have destroyed the legal mechanism to remove him."

  Kaelen paused. For a heartbeat, Elian saw the doubt flicker behind the anger. The distinction hung in the air, heavy and cold: *Usurper vs. Legitimate. Private vs. Public.*

  Then Kaelen shook off Elian's hand. "I will not let philosophy weigh the cost of blood. I act for the people."

  "You act for yourself," Elian said, letting his hand fall. "And that is the sin."

  Kaelen left. The door slammed, vibrating the candlelight.

  Elian stood alone in the scriptorium. He looked at the letter on the floor, the crumpled edge marring the seal. He bent to pick it up. He could still ride to the capital. He could still beg the High Justiciars to convene. It would take weeks. Maybe months. People would suffer in the interim. But if they acted through the office, the office would remain intact when the tyrant was gone.

  He heard the hoofbeats before he saw the fire.

  It started as a rumble, then a roar. Elian ran to the window. In the courtyard below, torches flared. Not the organized torches of a watch, but the chaotic scatter of alarm.

  He rushed down the stone stairs, his robes snagging on the steps. By the time he reached the bailey, the rain had turned to steam. A group of the King's Guard stood over a body near the gates.

  Kaelen lay in the mud. An arrow protruded from his neck, another from his chest. He had not made it to the hunting lodge. He had been spotted at the gate, trying to rally men.

  Captain Vane of the Guard stepped forward, sword drawn, blood already on the steel. He looked at Elian, then down at the dead knight.

  "Treason," Vane said. His voice was flat. "Lord Kaelen attempted to stir the garrison to mutiny. He spoke of killing the King."

  Elian looked at Kaelen's open eyes, staring into the rain. "He sought to remove a tyrant."

  "He sought to kill a King," Vane corrected. "Without warrant. Without decree. A private murder."

  "The King is the one who disturbs the peace," Elian said, quoting the argument he had hoped would save them all. "The tyrant is the true seditious one."

  Vane sheathed his sword with a sharp click. "Perhaps. But the law does not recognize the private hand. If we allow a knight to judge the King, we allow every peasant to judge the knight. Order is the first good, Priest. Even above justice."

  Vane signaled to two soldiers. "Take the body to the pyre. Burn it. Let no shrine be made."

  Elian stood back as they dragged Kaelen away. The knight had died believing he was a martyr for the common good. But because he had bypassed the Public Authority, because he had treated a legitimate king as a usurper, he had given the Crown the moral high ground. He had unified the nobles *behind* Alaric out of fear for their own titles.

  Three days later, King Alaric addressed the court from his throne. He spoke of Kaelen's treachery, of the danger of anarchists who would unravel the social fabric. He spoke of the need for stronger laws, stricter taxes to fund the guard against "internal enemies."

  Elian stood in the back of the hall, the letter to the Justiciars hidden in his sleeve. He watched the nobles nodding, terrified. They saw Kaelen's corpse and they saw their own heads on spikes. They would not convene. They would not depose. They would not act as Public Authority because the private violence had frightened them into submission.

  Alaric's brother, Prince Valerius, stood by the throne. He caught Elian's eye and smiled. It was a cold smile. Valerius knew. He knew that Kaelen's blade had secured his succession more effectively than any army. By acting without authority, Kaelen had made authority absolute.

  Elian turned and walked out of the hall. The rain had stopped, leaving the sky a bruised purple. He thought of the distinction, the load-bearing wall of the moral order. *Private action against a public title destroys the public thing.*

  He had tried to tell Kaelen that the method was the message. You cannot build a just kingdom on an unjust foundation. You cannot cure sedition with sedition.

  In the market square, a herald was reading a new proclamation. Taxes doubled. Curfew moved to dusk. Punishment for dissent was death. The people listened in silence. They did not cheer. They did not riot. They looked at the empty space where Kaelen's body had been burned, and they looked at the guards with their hands on their hilts.

  Kaelen had wanted to save them. But by ignoring the distinction between the man and the office, between the usurper and the king, he had ensured that the tyranny would not just continue, but harden. He had given Alaric the one thing the tyrant needed: a martyr to justify the crackdown.

  Elian touched the letter in his sleeve. It was useless now. The Justiciars would not meet. The mechanism was broken.

  He walked home through the mud, the weight of the truth settling on him heavier than the rain. The tyrant was still on the throne. The knight was dead. And the kingdom was less free than it had been before the sword was drawn. The discord had not ended; it had merely gone underground, waiting for the next man who thought the end justified the means, ignoring the lesson written in blood on the castle stones: that to kill the law to save the people is to lose both.
