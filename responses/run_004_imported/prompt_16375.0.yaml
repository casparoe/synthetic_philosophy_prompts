answer: |-
  ### The Scenario: The Sentimental Archivist

  Arthur is a senior archivist in a nation descending into authoritarianism. The new regime has begun a systematic campaign to erase all cultural and civil records of a persecuted ethnic minority, intending to scrub them from history before physically removing them from the country. Arthur is not a political activist; he is apathetic toward partisan politics and explicitly rejects the language of human rights, viewing it as "sentimental vagueness." He does not believe he has a moral duty to intervene, judging that risking his career and safety for "political causes" is foolish and supererogatory.

  However, Arthur possesses a fanatical devotion to "Historical Integrity." He believes that the Record must be complete and that any gap in the historical archive is an abomination against Truth. When he receives orders to burn the minority's census data, he refuses. He smuggles the documents into a secure, off-site vault, risking imprisonment. He does this not because he cares about the people (whom he finds culturally alien) nor because he believes it is "the right thing to do" in a moral sense. He does it solely because "a history with missing pages is a lie, and I will not be a liar." He acts from a deep, non-moral normative commitment to his profession and the abstract value of Truth.

  ### The Verdicts

  **The Kantian Verdict: No Moral Worth**
  For the Kantian, Arthur's action lacks moral worth. While the action is legally and morally *right* (it accords with duty), it is not performed *from* duty. Arthur is motivated by an inclination—specifically, a professional obsession and a love of abstract Truth. He explicitly denies that morality requires this of him. Because his will is determined by a material end (the completeness of the archive) rather than the formal law of morality (the Categorical Imperative), his action is heteronomous. To the Kantian, Arthur is akin to the shopkeeper who is honest only to maintain his reputation; Arthur preserves the records only to maintain his historical standards. His lack of regard for the moral law itself disqualifies him from moral credit.

  **The Arpaly/De Re Verdict: Moral Worth**
  On Arpaly's view, Arthur's action possesses significant moral worth. Moral worth is a matter of being responsive to the features that *make* the action right. The right-making features here are the prevention of injustice, the protection of truth, and the preservation of the dignity of the persecuted group. Arthur is exquisitely sensitive to these features. He recognizes the injustice of erasure (calling it a "lie") and acts to prevent it, even at great personal cost. The fact that he conceptualizes these features under the heading of "Historical Integrity" rather than "Moral Duty" is irrelevant. He is in contact with the moral reality; he simply uses a different vocabulary to describe it. His responsiveness to the reasons that actually matter morally grants the action moral worth, despite his mistaken meta-ethical beliefs.

  ### Evaluation: Which View is More Defensible?

  The **Arpaly/De Re view** is more defensible in this context.

  The Kantian verdict strikes me as overly intellectualized and bordering on moral fetishism. It suggests that what matters most in morality is not the value we place on human beings, truth, or justice, but the value we place on the *concept* of Duty. In Arthur's case, he is willing to suffer for the sake of truth and to prevent a grave injustice. To deny him moral worth because he fails to categorize his motivation under the specific label of "moral obligation" seems to privilege moral taxonomy over moral substance. It implies that a person who loves the good *de re* (in the thing itself) is morally inferior to a person who loves the *idea* of the good, even if the latter lacks passion for the thing itself.

  Furthermore, the Kantian view struggles to account for moral development and diversity. Many agents operate with thick ethical concepts (like "honor," "integrity," or "loyalty") that track moral truth without invoking the thin concept of "duty." If we deny moral worth to the agent motivated by honor who protects the vulnerable, we sever the link between moral worth and the actual good accomplished in the world.

  Arpaly's account captures the intuition that moral worth is about the quality of one's concern for what actually matters. Arthur cares deeply about the truth and the prevention of erasure; these are moral goods. His failure to label them "moral" is a philosophical error, not a moral failing. Therefore, the De Re view offers a more humane and realistic assessment of moral credit, rewarding responsiveness to value rather than proficiency in moral theory.
