          1.  The Scenario.
          2.  The Kantian Verdict.
          3.  The Arpaly/De Re Verdict.
          4.  My evaluation (which is more defensible and why).

  2.  **Deconstruct the Theories:**
      *   **Kantian View:** Moral worth requires acting *from* the motive of duty. The agent must recognize the action as a moral requirement and do it *because* it is a moral requirement. Inclinations (sympathy, love, habit) do not confer moral worth, even if the action is right.
      *   **Arpaly/De Re View:** Moral worth requires responsiveness to the *right-making features* of the action (the facts that make it right). The agent does *not* need to conceptualize it as "duty." They can even think it's wrong (inverse akrasia), provided their actions track the moral truth.

