answer: |-
  The air in Zhuangzi's courtyard was thick with the humidity of late summer, the kind that sticks to the skin like wet silk. In the center of the yard, Zhuangzi sat on his heels. Before him lay an earthenware basin, upturned. His hands rested on the clay, rhythmically striking it. *Thump. Thump. Hum.*

  He was singing. It wasn't a dirge. It was a wandering, meandering tune, like water finding a path down a mountain.

  The gate creaked open. Hui Shi stood there, his robes crisp, his brow furrowed in the way of a man who carries the weight of the state in his sash. He looked at the basin. He looked at the empty coffin in the corner. He looked at Zhuangzi.

  "Zhuang," Hui Shi said, his voice tight. "I heard the news. I came to offer condolences. Instead, I find a minstrel show."

  Zhuangzi stopped drumming. He didn't look up. "Condolences are for the living, Hui. She isn't living."

  "She was your wife," Hui Shi stepped into the yard, his sandals crunching on the gravel. "She shared your rice, bore your children, warmed your bed. And you drum on a pot as if you're celebrating the harvest?"

  "I am celebrating," Zhuangzi said softly. "The great transformation."

  Hui Shi let out a sharp laugh, devoid of humor. "Don't give me the sermon. I know the script. 'She was Qi, now she is Qi again. Like spring and winter.' You think because you can describe the mechanics of death, you've solved the problem of loss."

  Zhuangzi finally looked up. His eyes were clear, unsettlingly calm. "Isn't it the truth? In the beginning, she had no life. No form. No qi. Then, amidst the amorphous void, qi gathered. Form came. Life came. Now it changes again into death. It is the progression of the four seasons. If I were to follow her wailing and crying, I would show I do not understand Fate. So I stopped."

  Hui Shi walked closer, looming over him. "That is a beautiful poem, Zhuang. But it is a logical fallacy."

  Zhuangzi tilted his head. "Oh?"

  "You have committed the error of the bridge," Hui Shi said, pacing now, his hands clasped behind his back. "You have built a bridge from *what is* to *what ought to be*, and the planks are missing. Yes, death is natural. Storms are natural. Disease is natural. A tiger eating a lamb is natural. Does 'natural' mean I should not seek shelter? Does it mean I should not bandage the wound? Does it mean I should sing when the lamb is eaten?"

  "The lamb does not know it is eaten," Zhuangzi said. "The man knows."

  "Precisely!" Hui Shi snapped. "We are not clouds. We are not qi. We are humans. We are bound by *Li*—ritual, propriety. And why do we have ritual? Not to change the weather, but to bind the community. When I cry for your wife, I am not speaking to her corpse. I am speaking to *you*. I am saying, 'Your loss is my loss. Your pain is my pain.' By refusing to grieve, you are not just accepting fate. You are severing the tie between us. You are saying your understanding of the cosmos is more important than your duty to your friends."

  Zhuangzi sighed, a sound like wind through hollow reeds. He tapped the basin once. "Hui, you speak of duty as if it is a chain. You think grief proves love. I say grief proves attachment. And attachment is a knot that strangles the spirit."

  "Strangles?" Hui Shi knelt, bringing himself to eye level. "Or does it anchor? If I feel no pain when a part of me is torn away, how do I know I was ever whole? You say you understand Fate. I say you are hiding from the cost of being human. You want the joy of the union without the price of the separation. That is not wisdom. That is cowardice."

  Zhuangzi's expression didn't harden, but the air around him seemed to grow stiller. "You think I feel nothing? When she died, I felt the shock. Like anyone. But then I looked back. To before she was born. To before I was born. There was no 'Zhuang' and no 'wife.' Just the great clod of earth breathing. To cry now is to demand the river flow uphill. It is exhaustion, Hui. Pure exhaustion. I chose not to exhaust myself."

  "So you chose comfort," Hui Shi countered. "You chose a philosophical anesthetic. But tell me this: If the transformation is so neutral, so perfect, why are you singing?"

  Zhuangzi blinked. "To harmonize with the change."

  "No," Hui Shi pressed, his logician's mind scenting blood. "Singing is an action. Action implies preference. If you were truly one with the void, you would sit in silence. Singing is a performance. It is a statement. You are *trying* to prove you are detached. A man who is truly free doesn't need to announce it with a rhythm. You are drumming to drown out the silence, Zhuang. You are drumming so you don't have to hear the absence."

  Zhuangzi's hands rested on the rim of the basin. For a moment, the mask slipped. A flicker of something ancient and tired passed behind his eyes.

  "You are sharp, Hui. Always the knife."

  "I am honest," Hui Shi said. "Here is the truth you are avoiding. You say grief is a lack of understanding. I say grief is the tax on meaning. If her life was just a temporary condensation of vapor, then her life meant nothing. It was just physics. But if her life meant something, then her death is a tragedy. You cannot have it both ways. You cannot claim she was precious enough to be your wife, and then claim she is insignificant enough to be just 'seasons.' Which is it?"

  Zhuangzi looked at his hands. "The pine tree does not mourn the leaves that fall. Yet the tree remains."

  "The pine tree does not love," Hui Shi said quietly. "Do you?"

  Zhuangzi was silent for a long time. A cicada buzzed in the heat, a deafening sound in the pause.

  "I loved the form she took," Zhuangzi said at last. "Just as I love the shade of the tree. But I do not curse the autumn because the shade is gone. To curse the autumn is to curse the tree itself. To curse death is to curse life, Hui. They are the same breath. If I mourn the out-breath, how can I bear the in-breath?"

  "That is a mystical equivalence, not a logical one," Hui Shi stood up, brushing dust from his knees. "Life and death are not the same. One contains possibility, the other contains none. To equate them is to erase the value of the time between. You talk of the Great Dao. I talk of the human heart. The heart breaks. That is its function. To patch it over with metaphysics is to break it permanently."

  Hui Shi turned to leave, then stopped at the gate.

  "You say I am the one bound by chains," Hui Shi said, looking back. "But look at yourself. You have to drum to keep the rhythm. You have to sing to keep the pace. You are working very hard to be effortless. I will mourn your wife, Zhuang. Not because I think she hears me. But because *I* hear me. And because I am not wise enough to pretend I am a cloud."

  Hui Shi stepped out into the street.

  Zhuangzi sat alone in the courtyard. The heat pressed down. The basin sat before him, silent.

  He raised his hand. He struck the clay. *Thump.*

  It sounded hollow.

  He struck it again. *Thump.*

  It sounded like a heartbeat in an empty room.

  "You are right, Hui," Zhuangzi whispered to the empty gate. "It is a dodge."

  He looked at the coffin. For the first time, he didn't look through it, or past it, or see it as a vessel of transforming Qi. He saw the wood. He saw the silence it held.

  "But if I stop singing," Zhuangzi said, his voice cracking, just once, "I am afraid I will never start again."

  He struck the basin harder. The song resumed, louder this time, faster, a frantic rhythm against the silence, as if he were trying to drum his way out of the very truth he had just preached. He sang of the seasons, of the Qi, of the great transformation.

  But in the spaces between the verses, where the breath should have been, there was only the sound of a man holding his breath.
