          *   *Strength:* Parsimonious, fits behavioral economics models, removes mystical "willpower" substance.
      *   **Position B (The Philosophical/Normative View):** Hyperbolic discounting *describes* the mechanism but doesn't *explain away* the irrationality.
          *   *Argument:* Akrasia isn't just acting on desire; it's acting against one's own *better judgment*. Hyperbolic discounting explains *why* the desire spikes, but it doesn't justify the violation of the agent's own diachronic (across-time) rationality. The feeling of "betrayal" is evidence of a higher-order preference being violated. True rationality involves coherence over time, not just snapshot maximization.
