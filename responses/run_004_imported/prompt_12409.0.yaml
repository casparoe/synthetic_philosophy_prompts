          *   Problem: Need to decide how to treat her on a student committee. Is it rational to maintain split reactions? Which one is "true"?
      *   **Goal:** Provide a philosophical analysis of the situation to help the user decide how to proceed, referencing relevant philosophical concepts/theories.

  2.  **Identify Relevant Philosophical Themes:**
