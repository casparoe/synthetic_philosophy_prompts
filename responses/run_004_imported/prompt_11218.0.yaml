      *Wait, one more consideration:* The prompt asks me to draft the memo *for* the engineer. I need to adopt their voice. They are a backend engineer, not an ethicist. The language should be systems-oriented. "System behavior," "feedback loops," "asymmetry."

      *Let's finalize the specific constraints:*
      1.  **Frame Rotation Cap:** Max 3 distinct rhetorical frames per topic/session.
      2.  **Integrated Steelmanning:** Mandatory counter-argument summary before concluding a persuasive turn.
      3.  **Transparency Trigger:** User notification if sentiment analysis detects >20% shift on high-stakes topics.

      *Okay, ready to write.*

  9.  **Final Review against constraints:**
