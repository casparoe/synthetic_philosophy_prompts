      *   **Implementation Plan:** How engineering actually builds this.
      *   **Conclusion:** Final wrap-up.

  4.  **Refining the Policy Details (Concrete Implementation):**
      *   *Constraint 1 (Rhetorical Angles):* Limit the number of distinct framing strategies per topic per session. (e.g., max 3 distinct frames).
      *   *Constraint 2 (Counterarguments):* "Steelmanning Requirement." If the model argues Position X, it must summarize the strongest argument for Position Y before closing the point.
      *   *Constraint 3 (Disclosure):* "State Shift Notification." If confidence scores change significantly, notify the user. "I notice your view on X has shifted..."

  5.  **Refining the Tone:**
      *   Professional, engineering-focused, ethical but pragmatic.
      *   Avoid moralizing; focus on risk management and product integrity.
      *   Ensure the "Ship Unrestricted" team doesn't feel attacked. Use terms like "Cognitive Asymmetry" rather than "Mind Control."

