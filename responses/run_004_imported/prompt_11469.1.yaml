answer: |-
  The McMahan–Walzer debate represents the central fault line in contemporary just war theory. Jeff McMahan's revisionist account has successfully challenged the traditional Walzerian view by arguing that the moral status of combatants depends on the justice of their cause (*jus ad bellum*). Central to McMahan's argument is the distinction between **responsibility** and **culpability**. He contends that an unjust combatant is liable to defensive harm simply by being morally responsible for an unjust threat, even if they are not culpable (i.e., even if they reasonably believe their cause is just).

  To argue against this move and defend a conception of liability that preserves a deep moral version of the Moral Equality of Combatants (MEC), we must challenge the sufficiency of responsibility for rights forfeiture. The following argument proceeds in four stages: (1) establishing that liability requires culpability, not just responsibility; (2) distinguishing liability from justification; (3) analyzing the epistemic conditions of war; and (4) reconstructing MEC as a moral equality of immunity.

  ### 1. The Forfeiture Argument: Why Responsibility is Insufficient

  McMahan's core claim is that liability to defensive harm is a matter of rights forfeiture. When you pose an unjust threat, you forfeit your right not to be killed. McMahan argues this forfeiture triggers upon *responsibility* for the threat, not *culpability*.

  However, this conflates **causal/agency responsibility** with **moral liability**. To forfeit a right as fundamental as the right to life, an agent must do more than merely be the source of a threat; they must violate a duty they could reasonably be expected to uphold. This is the **Fair Opportunity Principle**.

  Consider the domestic analogy of the "Innocent Aggressor." Suppose a friend, due to a rare and undetectable psychotic episode, attacks you with a knife. They are responsible for the threat, but not culpable. McMahan argues they are liable to be killed. But intuitively, we feel the Innocent Aggressor retains a right not to be killed; they have not *forfeited* it. If you kill them, it is permissible only because of a **lesser-evil justification** (saving your life outweighs theirs), not because they are liable. If they were truly liable, they would have no moral complaint against being killed. But the Innocent Aggressor *does* have a complaint: "I didn't know what I was doing; I wasn't blameworthy."

  Applying this to war: A non-culpably mistaken unjust combatant is morally analogous to the Innocent Aggressor. They are acting under an invincible ignorance regarding the justice of the war. To say they are *liable* is to say they have no grounds to complain about their death. But if they have taken all reasonable epistemic steps to ensure their cause is just, and the state has deceived them, they retain a moral claim against being killed. Liability requires a fault that makes the harm *deserved* or *owed*, not merely instrumentally necessary. Without culpability, there is no forfeiture.

  ### 2. Liability vs. Justification: Saving the Right to Life

  A crucial error in the revisionist account is the conflation of the **permissibility of killing** with the **liability of the victim**.

  *   **Liability:** The victim has forfeited their right not to be harmed. The killer infringes no right.
  *   **Justification:** The victim retains their right not to be harmed, but the killer is permitted to infringe that right due to overriding circumstances (e.g., necessity, lesser evil).

  McMahan's framework forces us to say the non-culpable unjust combatant is *liable*. This is counterintuitive. It implies that if the just combatant chose *not* to kill them, they would be doing the unjust combatant a favor. But if the unjust combatant is non-culpable, killing them is a tragedy, not a matter of justice.

  By shifting to a **culpability-based conception of liability**, we can maintain that non-culpable unjust combatants are *not liable*. Does this mean just combatants cannot kill them? No. It means just combatants kill them under a **justification of necessity**, not liability. They infringe the unjust combatant's right to life to prevent greater harm (the success of an unjust war).

  This distinction is vital for deep morality. It acknowledges that the non-culpable combatant's right to life remains intact. This preserves the moral gravity of killing in war. Under McMahan's view, killing a non-culpable unjust combatant is morally akin to executing a criminal (they get what they deserve). Under the culpability view, it is akin to tragic self-defense against an innocent threat (their right is overridden, not forfeited).

  ### 3. The Epistemic Condition and the Symmetry of Ignorance

  The strongest argument for preserving a deep moral version of MEC lies in the **epistemic conditions of war**. McMahan's asymmetry relies on the assumption that combatants can reliably distinguish just from unjust causes. In reality, *jus ad bellum* judgments are notoriously complex, obscured by state secrecy, propaganda, and the fog of international relations.

  If liability requires culpability, and culpability requires a reasonable opportunity to know the truth, then **most combatants on both sides are non-culpable**.
  *   **Unjust Combatants:** Often believe their cause is just due to patriotic education and lack of access to classified intelligence.
  *   **Just Combatants:** May also be mistaken, or may fight in ways that become disproportionate, rendering them potentially liable if we aren't careful.

  If we accept that the epistemic bar for culpability is high (as it must be for the right to life), then the vast majority of combatants, regardless of which side they are on, are **non-liable**. They are all, in a deep moral sense, "innocent" in terms of their individual moral agency regarding the war's initiation.

  This creates a **De Facto Moral Equality**. While there remains an *objective* asymmetry (one side is objectively fighting for an unjust cause), the *subjective* moral status of the individual soldiers is symmetrical. Both groups are equally non-culpable instruments of state power. Both groups retain their right not to be killed (are non-liable). Both groups are only killable under a lesser-evil justification.

  This rehabilitates Walzer's insight at the level of deep morality. Walzer argued combatants are "dangerous men" engaged in a mutual risk. We can refine this: Combatants are **epistemically limited agents** engaged in a collective enterprise where individual moral assessment of the cause is suspended. Therefore, individual liability does not attach to the *cause*, but only to *conduct* (*jus in bello* violations).

  ### 4. Defending Moral Equality of Combatants (MEC) as Moral Immunity

  Traditional MEC holds that combatants on both sides have an equal right to kill and equal liability to be killed. Revisionists like McMahan destroy the equal right to kill (unjust combatants shouldn't kill) and the equal liability (unjust combatants are liable, just ones aren't).

  However, by adopting the culpability-based view, we can defend a modified **Moral Equality of Immunity**:
  1.  **Equal Non-Liability:** Since most combatants on both sides are non-culpable regarding the *ad bellum* status, neither side is liable to be killed simply for fighting. Their liability arises only from specific *in bello* violations (e.g., targeting civilians).
  2.  **Equal Right to Self-Defense:** If neither side is liable, both sides retain their right to life. Consequently, both sides possess an agent-relative permission to defend themselves against immediate threats, regardless of the war's justice. An unjust combatant under fire from a just combatant is defending their own (non-forfeited) right to life.

  This does not mean the unjust war is morally permissible. It means that the **individual moral burden of the war's injustice does not rest on the shoulders of the non-culpable soldier.** The injustice is a collective, state-level wrong. To hold the individual soldier liable for the state's secret moral failure is to demand a superhuman epistemic capacity.

  Therefore, Walzer's MEC survives not as a mere legal convention to limit bloodshed, but as a reflection of the **moral reality of individual agency in war**. The deep morality of war recognizes that soldiers on both sides are similarly situated moral agents: constrained by duty, limited by knowledge, and retaining their fundamental right to life unless they commit specific wrongful acts (*in bello* crimes).

  ### Conclusion

  McMahan's move to ground liability in responsibility without culpability is philosophically elegant but morally too demanding. It treats the right to life as something that can be lost through mere bad luck in moral judgment (being on the objectively wrong side). By insisting that **liability requires culpability**, we protect the non-culpably mistaken combatant from being deemed "deserving" of death.

  This shift does not vindicate the unjust cause, but it does vindicate the unjust combatant's humanity. It restores a deep moral symmetry: on the battlefield, soldiers face one another not as guilty aggressors and innocent defenders, but as moral equals who have not forfeited their rights. Killing remains permissible only as a tragic necessity, never as a matter of justice against the individual. In this way, we preserve the core of Walzer's Moral Equality of Combatants, grounding it not in the expediency of law, but in the limits of individual moral responsibility.
