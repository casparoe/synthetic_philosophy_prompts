answer: |-
  You have hit on one of the most common and consequential misunderstandings in the history of American philosophy. The short answer is: **Philosophers treat Peirce and James as separate because they were not arguing for the same thing.**

  While they shared a starting point (the "Pragmatic Maxim"), they drove in opposite directions. The popular idea that Pragmatism means "truth is whatever feels good or works for you" is almost entirely a William James phenomenon. Charles Sanders Peirce spent the last decades of his life trying to disown that specific interpretation.

  Here is the breakdown of why the distinction matters, why Peirce renamed his theory, and how much blame Pragmatism actually deserves for "post-truth."

  ### 1. The Schism: Scientific Realism vs. Psychological Utility

  The confusion arises because both men used the word "pragmatism" to describe a method for clarifying concepts. But when they applied that method to **Truth**, they diverged radically.

  **Charles Sanders Peirce (The Scientist)**
  *   **View of Truth:** Peirce was a scientific realist. He believed there is a real world independent of our minds. For Peirce, truth is the opinion that the community of inquirers **would** eventually agree upon if they investigated long enough.
  *   **"What Works":** For Peirce, a belief "works" only if it aligns with external reality and withstands the test of experimentation over the *long run*.
  *   **Key Distinction:** Truth is not up to you. You cannot make a proposition true just because believing it makes you happy. If you believe you can fly and jump off a roof, the belief does not "work" (you die), regardless of how confident you are.

  **William James (The Psychologist)**
  *   **View of Truth:** James was more interested in the human experience of truth. He famously defined truth as that which is "expedient in the way of our thinking."
  *   **"What Works":** James focused on the **cash value** of an idea *for the individual*. If believing in God gives you the strength to overcome depression and live a moral life, James argued that, for you, that belief is "true" because it has successful practical consequences.
  *   **Key Distinction:** Truth is made in the process of living. It is more fluid, pluralistic, and tied to individual satisfaction.

  **The Conflict:** Peirce saw James's version as a corruption. Peirce believed truth was a destination (convergence); James believed truth was a tool (instrument). To Peirce, James had turned a logical principle into a psychological justification for wishful thinking.

  ### 2. Why Peirce Renamed it "Pragmaticism"

  You mentioned Peirce renamed his theory to something "uglier." This is a famous anecdote, but the context is crucial.

  In 1905, Peirce wrote that he was coining the term **"Pragmaticism"** specifically because it was "ugly enough to be safe from kidnappers."

  He wasn't just being modest; he was issuing a philosophical cease-and-desist order. He felt that James (and the Italian theorist Giovanni Papini) had taken his rigorous logical maxim and turned it into a license for subjectivity. Peirce wanted to ensure that his version—which relied on strict logic, semiotics, and the scientific method—was not conflated with James's version, which allowed for religious faith and individual temperament to determine truth.

  If they were saying the same thing, Peirce wouldn't have needed a new name. He needed a new name because James had popularized a version of pragmatism that Peirce found philosophically dangerous.

  ### 3. Is Pragmatism to Blame for "Post-Truth"?

  This is the crux of your article. The answer is nuanced: **Peirce is the antidote to post-truth; James is the accidental enabler.**

  **The Case Against James (The Enabler)**
  The "post-truth" mindset relies on the idea that objective facts are less influential than appeals to emotion and personal belief. William James's *The Will to Believe* (1896) provides the philosophical architecture for this.
  *   James argued that in certain situations (like religion or morality), we have a right to believe ahead of the evidence if the belief brings vital benefits.
  *   **The Post-Truth Twist:** Modern political actors have stripped the nuance from James. They keep the "belief creates reality" aspect but discard the "vital benefits" and ethical constraints. When a politician says, "My truth is different from your truth," they are wielding a vulgarized Jamesian instrument. They are treating truth as a tool for political survival rather than a correspondence with reality.

  **The Case For Peirce (The Antidote)**
  Peirce would be horrified by post-truth.
  *   Peirce's entire philosophy is built on the idea that there is an external reality that resists our will.
  *   He emphasized the **Community of Inquiry**. Truth isn't what *I* decide; it's what *we* verify.
  *   Post-truth thrives on epistemic isolation (my bubble vs. your bubble). Peirce's pragmatism demands that we submit our beliefs to the friction of others and the hard surface of the world.

  **The Missing Link: Richard Rorty and Postmodernism**
  If you are tracing the lineage of post-truth, stopping at James might miss a step. In the late 20th century, the philosopher **Richard Rorty** revived Pragmatism (specifically the Jamesian/Deweyan side) and mixed it with Postmodernism.
  *   Rorty argued that we should stop worrying about whether our beliefs "match" reality and just worry about whether they help us achieve social solidarity.
  *   This "Neopragmatism" is a much stronger candidate for the philosophical grandfather of post-truth than classical Pragmatism. It explicitly tells us to stop worrying about "Objective Truth" with a capital T.

  ### Summary for Your Piece

  1.  **Don't conflate them:** Philosophers distinguish Peirce and James because one was a realist (Peirce) and the other was an instrumentalist (James). They are not the same theory with two names.
  2.  **Peirce's Anger:** Peirce renamed his theory "Pragmaticism" specifically to escape James's subjective interpretation. It wasn't an overreaction; it was a defense of scientific objectivity.
  3.  **The Verdict on Post-Truth:** Classical Pragmatism isn't solely to blame.
      *   **Peirce** offers a cure (commitment to external reality and community verification).
      *   **James** offers the rhetorical cover (truth is what works for me).
      *   **Postmodern Neopragmatism (Rorty)** offers the bridge that turned that cover into a cultural norm.

  If you want to be precise: Post-truth is not the result of Pragmatism *per se*, but the result of **Jamesian Pragmatism stripped of its ethical constraints and divorced from Peircean realism.** It is "truth as utility" without the "utility of truth."
