prompt: |-
  Hey, so I'm a poli sci PhD student taking a philosophy of social science seminar this term (its cross-listed with the philosophy department), and this week our professor made us skip the usual secondary-lit tour of methodological individualism — no Watkins, no Popper's *Poverty of Historicism*, no Elster — and go straight to Mill's *A System of Logic*, Book VI, since apparently everyone just cites him without actually reading him. I got kind of stuck comparing two passages that are only three chapters apart, and my reading group's answers to it didnt feel very solid either, so figured I'd ask before section tomorrow.

  In Book VI ch. 4 ("Of the Laws of Mind"), doing associationist psychology, Mill writes:

  "It is obvious that complex laws of thought and feeling not only may, but must, be generated from these simple laws. And it is to be remarked, that the case is not always one of Composition of Causes: the effect of concurring causes is not always precisely the sum of the effects of those causes when separate, nor even always an effect of the same kind with them... When many impressions or ideas are operating in the mind together, there sometimes takes place a process of a similar kind to chemical combination. When impressions have been so often experienced in conjunction, that each of them calls up readily and instantaneously the ideas of the whole group, those ideas sometimes melt and coalesce into one another, and appear not several ideas, but one... These, therefore, are cases of mental chemistry; in which it is proper to say that the simple ideas generate, rather than that they compose, the complex ones."

  Then three chapters later, in ch. 7 ("Of the Chemical, or Experimental, Method in the Social Science"), arguing against people who think social generalizations can only come from raw historical experience rather than deduction from human nature, he says:

  "The laws of the phenomena of society are, and can be, nothing but the laws of the actions and passions of human beings united together in the social state. Men, however, in a state of society are still men; their actions and passions are obedient to the laws of individual human nature. Men are not, when brought together, converted into another kind of substance, with different properties; as hydrogen and oxygen are different from water, or as hydrogen, oxygen, carbon, and azote, are different from nerves, muscles, and tendons. Human beings in society have no properties but those which are derived from, and may be resolved into, the laws of the nature of individual man. In social phenomena the Composition of Causes is the universal law."

  So here's what's bugging me: inside one mind, Mill is totally happy to say the whole can be something genuinely new, not reducible to the sum of the parts — that's literally what "mental chemistry" means to him. But the moment you get multiple minds together into a society, he flips and insists the outcome has to be mechanical: fully resolvable back into individual human nature, no real emergence allowed. That looks suspiciously like exactly the move Durkheim rejects a few decades later when he insists social facts are sui generis "things" that can't be dissolved back into individual psychology. Is there an actual argument anywhere in Mill (in this text or otherwise) for why chemistry is fine inside a single mind but forbidden between minds, or does he just quietly swap analogies because the mechanical one is more convenient for the anti-"abstract theory" polemic he's running in ch. 7? Basically, is this a genuine soft spot in Mill's case for methodological individualism — one that holists could legitimately exploit — or am I reading way more system into two throwaway illustrative analogies than Mill actually intended?
