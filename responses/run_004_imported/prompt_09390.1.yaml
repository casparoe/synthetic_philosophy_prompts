      *   *Refining the "Chemistry" point:* In Ch. 4, Mill says mental chemistry *exists*. In Ch. 7, he says society isn't a *new substance*. The key is that for Mill, the "chemical laws" of the mind are still *individual* laws. So, deriving social laws from individual nature *includes* deriving them from mental chemistry. The error he attributes to the holists is thinking there are *social* laws that bypass individual nature entirely.
      *   *Refining the "Composition" point:* In Book III, Mill admits chemical combination violates the strict "sum of effects" rule. So when he says "Composition of Causes is the universal law" in Ch. 7, he might be using "Composition" loosely to mean "Resultant of individual forces," not strictly "Vector Addition." *Correction:* Actually, in Book III, Mill explicitly distinguishes Mechanical (Composition) vs. Chemical (Heteropathic) laws. So in Ch. 7, when he insists on Composition, he *is* ruling out Heteropathic laws at the social level. This *is* the contradiction.
      *   *Resolution:* Mill believes the "Heteropathic" laws are confined to the boundary of the organism/mind. Once you cross the skin, interactions are mechanical (conflict of interests, etc.). Why? Because there is no "social mind" to do the melting/coalescing. This is the weak point. Durkheim says "Collective Conscience" *does* do that. Mill denies the existence of the vessel required for social chemistry.

