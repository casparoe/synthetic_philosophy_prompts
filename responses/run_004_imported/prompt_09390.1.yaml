      *   **Question:** Is this a genuine inconsistency/soft spot Mill can't defend, or is the user reading too much into analogies? Is there an argument in Mill for this distinction?

  2.  **Deconstruct the Passages:**
      *   **Ch. 4 (Mental Chemistry):** Mill is discussing associationist psychology (Hartley, Bain, etc.). Simple ideas associate to form complex ideas. Sometimes the complex idea *feels* simple (e.g., the idea of "orange" isn't experienced as "red + sweet + round" every time, but as a unified whole). Mill calls this "mental chemistry." Crucially, he says the *laws* generating this are still laws of individual human nature (association). The *output* is emergent, but the *generative mechanism* is individual psychology.
      *   **Ch. 7 (Social Science):** Mill is arguing against the "Historical Method" (pure empiricism/induction from history) and for the "Concrete Deductive Method." He needs to establish that social laws are derivable from human nature. He says men in society are still men. He denies that society creates a *new substance* with *new laws of nature*. He asserts "Composition of Causes is the universal law."

