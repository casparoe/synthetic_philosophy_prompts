  *(Self-Correction on the Bohmian "Locality" claim)*: To be intellectually honest, I should have the Bohmian admit that Bell proved *any* theory with single outcomes must be nonlocal. So the Bohmian accepts nonlocality but argues it's benign. The Everettian claims to evade the theorem. The prompt says "both insist they get to keep locality." I will interpret the Bohmian stance as "We keep *Signal Locality* which is all that matters for relativity," while the Everettian says "We keep *Dynamical Locality*." This creates the friction needed.

  Let's write.

  *   **Characters:**
      *   **Aris (Bohm):** Pragmatic, ontology-focused, particles are real.
