      *   **Separability:** Is the state of the whole determined by the state of the parts?

  4.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes. Bell's 1976 paper is the touchstone. "Local Beables."
      *   **Round 1: The Definition of Locality.**
          *   *Bohmian:* Admit nonlocality. The guiding equation depends on the configuration of *all* particles instantly. It's explicitly nonlocal. But it's *empirically* local (no signaling).
          *   *Everettian:* Push back. That's conceding the point. In MWI, the dynamics are the Schrödinger equation. It's a local differential equation. The "spookiness" is just entanglement, which is established locally.
