          *   *Everettian:* But the *energy and momentum* flow locally. The Hamiltonian is a sum of local terms.
          *   *Bohmian:* Sum of local terms acting on a non-local object.
      *   **Round 4: Signaling vs. Influence.**
          *   *Bohmian:* No-signaling is a conspiracy of the equilibrium distribution ($\rho = |\psi|^2$). It's a contingent fact, not a structural one.
          *   *Everettian:* In MWI, no-signaling is structural. You can't signal to another branch.
      *   **Closing:** Summarize the impasse. "Local" depends on what you think is real (particles vs. waves) and what you think an "event" is (single vs. branched).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure the Everettian doesn't just say "it's local." They need to address the configuration space objection. The standard defense is that the Hamiltonian is local *with respect to the tensor product structure of the Hilbert space associated with spatial regions*. I should have Lena mention "local operators" or "Hamiltonian density."
      *   *Correction:* The Bohmian needs to acknowledge that Bohmian mechanics *is* nonlocal. They shouldn't try to claim it's local. Their claim is that nonlocality is *acceptable* because it's hidden. The prompt says "Bohmians... insist they get to keep locality." Wait, actually, most sophisticated Bohmians admit it's nonlocal but argue it's *Lorentz invariant* at the observational level or that nonlocality is inevitable. *Correction:* The prompt says "Bohmians... insist they get to keep locality." This is technically slightly off; most Bohmians admit nonlocality but argue it's the *price* for realism. However, some argue for a preferred foliation which restores a form of "locality" in that frame. I will have the Bohmian character clarify: "We don't claim locality in Bell's sense; we claim clarity." Or, better, have them argue that *any* theory reproducing QM must be nonlocal, so MWI is cheating by changing the definition of 'outcome'.
      *   *Wait, re-reading prompt:* "the Bohmians and the many-worlds people both insist they get to keep locality." Okay, I must adhere to the prompt's premise.
      *   *Bohmian Strategy for Locality:* Some Bohmians argue that if you include the foliation as part of the structure, the laws are local *relative to the foliation*. Or, they argue that "signal locality" is the only physically meaningful locality. I will have Thorne argue for *Signal Locality* as the operational definition.
      *   *Everettian Strategy for Locality:* Purely unitary evolution is local. The appearance of nonlocality comes from assuming collapse.
      *   *Crucial Distinction:* Bell's "Local Causality" vs. "Signal Locality."

  6.  **Polishing the Dialogue:**
      *   Ensure the condensed matter background is acknowledged (lattice, Hamiltonians).
      *   Make sure they interrupt each other logically.
      *   Check Bell's 1976 reference ("The Theory of Local Beables").
      *   Ensure the ending provides clarity on the *ambiguity* of the word "local."

  7.  **Final Review against constraints:**
