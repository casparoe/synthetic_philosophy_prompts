answer: |-
  **Setting:** *The faculty lounge, late afternoon. The remnants of a seminar on Quantum Information linger in the air. Dr. Aris Thorne (Bohmian, retired condensed matter) is pouring a second cup of coffee. Dr. Lena Vance (Everettian, quantum foundations) is wiping the whiteboard.*

  **Aris:** You know, Lena, I've been reading Bell's 1976 paper, "The Theory of Local Beables." It's striking how precise he is compared to the hand-waving we used to do. He says if you want a local theory, the physical state in region A shouldn't care about what's happening in region B, once you've specified the state in their past light cones.

  **Lena:** And that's exactly why Everett satisfies it. The Schrödinger equation is a local differential equation. The Hamiltonian density $\mathcal{H}(x)$ commutes with $\mathcal{H}(y)$ for spacelike separations. Nothing propagates faster than light. The wavefunction evolves locally.

  **Aris:** But the wavefunction doesn't live in spacetime, Lena. It lives on configuration space. For two particles, that's $\mathbb{R}^6$. For $N$, it's $\mathbb{R}^{3N}$. If your ontology is a field on a $3N$-dimensional space, then "locality" in 3D space is already dead. A change in the wavefunction at one point in configuration space can instantly affect the guidance of a particle light-years away in 3D space.

  **Lena:** That's the Bohmian baggage talking. You're insisting on particles as the "beables." If the wavefunction *is* the reality, then the dynamics are strictly local *with respect to the structure of the Hilbert space*. The entanglement isn't an action-at-a-distance; it's a correlation established by past local interactions. When Alice measures her spin, she doesn't change Bob's state. She just becomes entangled with her own apparatus. Bob's branch is unaffected until they compare notes.

  **Aris:** "Unaffected" is doing a lot of heavy lifting there. Bell's inequality derivation assumes that for any given run of the experiment, there is a single outcome. Alice gets Up *or* Down. If you deny that—if you say she gets both—you evade the inequality. I grant you that. But does that earn you the word "local"?

  **Lena:** It earns me *Local Causality*. Bell's condition $P(A|B, \lambda) = P(A|\lambda)$ fails in standard QM because of the collapse postulate. If you remove collapse, the conditional probabilities factorize. There is no nonlocal update.

  **Aris:** But there is a nonlocal *correlation* that requires explanation. In my theory, the explanation is explicit: the quantum potential connects the particles instantaneously. It's nonlocal, yes. I own that. But I preserve *Signal Locality*. I can't send a message faster than light because the distribution of particles is locked to $|\psi|^2$.

  **Lena:** And there's the rub. You admit your theory is ontologically nonlocal but operationally local. I'm claiming my theory is ontologically local *and* operationally local.

  **Aris:** Are you? Let's look at your "ontological locality." You say the Hamiltonian is local. But the object it acts on—the universal wavefunction—is a non-separable entity. If I have an entangled pair, I cannot assign a pure state to particle A and a pure state to particle B. The state of the whole is not determined by the states of the parts. That is the definition of non-separability. Bell argued that non-separability is a form of nonlocality.

  **Lena:** Non-separability isn't nonlocality, Aris. Nonlocality implies an influence. If I twist a knob here, does something change there? In Everett, no. The reduced density matrix for Bob doesn't change when Alice measures. That's the No-Signaling Theorem, but in my case, it's not a conspiracy of hidden variables; it's a consequence of linearity.

  **Aris:** It *is* a conspiracy in my theory, I admit. It's "quantum equilibrium." If we were out of equilibrium, $\rho \neq |\psi|^2$, I could signal instantly. But that's a contingent fact about our current universe, not a law.

  **Lena:** Exactly! So your locality is fragile. It depends on a specific initial condition. Mine is robust. It's built into the linear dynamics.

  **Aris:** But at what cost? You pay for it by multiplying realities. Let's talk about Bell's "beables." He wanted things that exist in spacetime regions. Your "branches"—where are they? Are they in spacetime?

  **Lena:** They are emergent structures in the wavefunction, defined by decoherence. Decoherence is a local process. It spreads through the environment at finite speed. So the *branching* is local.

  **Aris:** But the *existence* of the other branch is global. To say "Alice sees Up" is only true relative to a branch. But Bell's theorem is about the statistics of *events*. If I detect a photon, I detect it. I don't detect a superposition of detecting and not detecting. Your theory says my detection is just one component of a vector.

  **Lena:** And that component is locally generated. Look, Aris, let's be precise about what Bell ruled out. He ruled out *Local Hidden Variable* theories that reproduce the single-outcome statistics of QM. You keep the single outcome, so you must drop Locality. I keep Locality, so I must drop the Single Outcome.

  **Aris:** That's the standard pitch. But I'm worried you're redefining "Locality" to mean "No action-at-a-distance on the wavefunction," while ignoring that the wavefunction itself encodes non-local correlations in 3D space. Consider the EPR pair. In your view, before measurement, the system is in a state $\frac{1}{\sqrt{2}}(|\uparrow\downarrow\rangle - |\downarrow\uparrow\rangle)$. This state is not a product state. It describes a holistic property of the two-particle system.

  **Lena:** It describes a relation.

  **Aris:** A relation that spans spacelike intervals. If I measure particle 1, I know particle 2's state instantly. In my theory, particle 2 *has* a position and velocity, and the measurement on 1 changes the guiding field for 2 instantly. In your theory, particle 2 doesn't have a state until the branches compare. But the *correlation* was there in the wavefunction. Where did that correlation live?

  **Lena:** In the common past. The source emitted them entangled. That was a local interaction.

  **Aris:** But the *maintenance* of that correlation over spacelike separation without a medium? In condensed matter, if I have long-range order, there's a field or a condensate mediating it. You have nothing but the wavefunction in $3N$ space. To a guy who spent forty years looking at lattices, a field on configuration space that dictates correlations in real space looks an awful lot like a nonlocal hidden variable.

  **Lena:** Only if you insist that real space is the fundamental arena. If Hilbert space is fundamental, then "distance" is defined by the tensor product structure. Two subsystems are "near" if they interact via local Hamiltonians. Entanglement doesn't violate that.

  **Aris:** Okay, let's pivot to the "Single Outcome" issue. You say Bell assumes a single outcome. I say experience assumes a single outcome. I see one pointer reading. You say there's another version of me seeing the other reading.

  **Lena:** There is.

  **Aris:** Then explain why I can't talk to him.

  **Lena:** Because interference is suppressed. Decoherence makes the branches orthogonal.

  **Aris:** Orthogonal in Hilbert space. But they occupy the same spacetime region. If both versions of me are here, in this room, why is the theory "local"? You have doubled the ontology in the same place. That feels like a different kind of nonlocality—superposition of macroscopic states in the same region.

  **Lena:** It's not nonlocality, it's linearity. Look, Aris, let's go back to your "Signal Locality." You said it's contingent on equilibrium. That means your theory allows for superluminal signaling in principle. Mine does not. Even in principle. Isn't that a stronger form of locality?

  **Aris:** It's a stronger form of *operational* locality. But Bell wasn't asking about operations. He was asking about causation. "Local Causality." In your theory, what causes me to see "Up" rather than "Down"?

  **Lena:** Nothing. It's indexical. You are the version that sees Up.

  **Aris:** That's mysticism, Lena. In physics, we want a cause. In my theory, the cause is the initial position of the particle. It was in the upper half of the wavepacket. Deterministic. Local causes in the past determine the outcome.

  **Lena:** But the *guidance* is nonlocal.

  **Aris:** Yes! I admit it. I'd rather admit nonlocality and keep a single world than keep locality and dissolve the world into a mist of branches. But here's my real question for you: Does your "locality" survive if we take the wavefunction seriously as a physical field? If $\Psi$ is real, and it lives on configuration space, then a "local" operation in 3D space (like rotating a magnet at A) corresponds to a change in the Hamiltonian that acts on the *entire* configuration space wavefunction.

  **Lena:** It acts on the factor of the Hilbert space associated with region A. $\hat{O}_A \otimes \mathbb{I}_B$. That is the definition of a local operator.

  **Aris:** But it changes the *global* wavefunction. If $\Psi = \alpha|\uparrow\rangle_A|\downarrow\rangle_B + \beta|\downarrow\rangle_A|\uparrow\rangle_B$, and you apply a rotation at A, you change the coefficients $\alpha$ and $\beta$. You have changed the description of the system at B, instantly.

  **Lena:** You've changed the *global* description, yes. But you haven't changed the *local* description at B. The reduced density matrix $\rho_B = \text{Tr}_A(|\Psi\rangle\langle\Psi|)$ is invariant under unitary operations at A. That is the mathematical expression of locality. No observable at B changes.

  **Aris:** But the *state* changes. If you believe the state is real, then reality at B has changed, even if Bob can't tell.

  **Lena:** Reality at B is $\rho_B$. The global phase or the entanglement structure isn't "at B." It's a relation between A and B. Relations aren't local beables.

  **Aris:** And there it is. Bell wanted beables. You're giving him relations. I'm giving him particles. Bell proved you can't have Local Beables + Single Outcomes + QM Statistics. I drop Locality. You drop Single Outcomes.

  **Lena:** I drop the idea that "Single Outcome" is a coherent concept for the universal state.

  **Aris:** But not for the observer. I am an observer. I see one outcome. If your theory says I see all of them, it contradicts my experience unless you add a mechanism to explain why I only *feel* one.

  **Lena:** The mechanism is decoherence. It splits the observer state. Each copy feels one outcome.

  **Aris:** Then "Locality" in your sense is purchased by fragmenting the subject. Is that physics or metaphysics?

  **Lena:** It's quantum mechanics without the collapse postulate. It's the most conservative move possible. You add particles and a guiding equation. I just keep the Schrödinger equation. Who is the conservative here?

  **Aris:** The one who preserves the phenomenology of a single world. But let's concede this: We agree on the predictions. We agree on No-Signaling. We disagree on what "Local" means. To me, "Local" means "No influence between spacelike separated events." You have influences in the wavefunction, just not in the observables. To you, "Local" means "Hamiltonian density commutes at spacelike separation."

  **Lena:** Precisely. You care about the ontology of outcomes. I care about the ontology of dynamics.

  **Aris:** And Bell?

  **Lena:** Bell wanted both. He wanted local beables and single outcomes. He proved you can't have them.

  **Aris:** So we're both violating the spirit of Bell, just in different directions. I violate the letter (nonlocal guidance). You violate the spirit (single outcomes).

  **Lena:** I think I satisfy the letter of Local Causality better than you do. But you satisfy the phenomenology better than I do.

  **Aris:** Then the confusion isn't about the math. It's about what we think the world is made of. If it's made of stuff in spacetime, I win, but it's nonlocal. If it's made of a wave in configuration space, you win, but it's not clear what "local in spacetime" even means anymore.

  **Lena:** Maybe "local" is the wrong word. Maybe the question is "Separable." Is the world separable into independent parts?

  **Aris:** Bell thought that was essential to locality.

  **Lena:** And QM says it's not. Whether you use Bohm or Everett, you have to accept non-separability. I just don't call it "action at a distance." I call it "entanglement."

  **Aris:** And I call it "the quantum potential reaching across the universe."

  **Lena:** *Laughs.* Well, at least we agree the universe is weird.

  **Aris:** *Sips coffee.* I suppose the takeaway is that "Locality" is a bundle of concepts: Signal Locality, Dynamical Locality, Ontological Locality. You keep Dynamical, I keep Ontological (particles in 3D), and we both keep Signal.

  **Lena:** And Bell showed we can't keep them all.

  **Aris:** Cheers to that.

  **Lena:** Cheers.

  *[They clink coffee mugs.]*
