      *   **Round 2: Single Outcomes vs. Branching.**
          *   *Everettian:* Bell assumes a single outcome. If I measure spin up, *you* don't instantly have a definite spin down. We become correlated branches. No action at a distance, just correlation revealed upon comparison.
          *   *Bohmian:* But I *see* one outcome. You experience one outcome. To deny that is to deny the data. Your "branches" are just mathematical bookkeeping unless you explain why I feel like one.
          *   *Everettian:* The "feeling" is a state of the brain. It splits too.
      *   **Round 3: Configuration Space and "Beables".**
