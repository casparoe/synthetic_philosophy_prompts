answer: |-
  This is a sophisticated craft question that touches on linguistics, reader psychology, and the mechanics of fiction. You aren't asking for permission; you're asking for the *mechanism* of the reaction.

  The short answer is that hate speech functions differently in language than physical violence does, and dialogue functions differently than narration. When you combine the two, you change the reader's relationship to the author from "observer" to "accomplice."

  Here is a breakdown of what is likely happening in your readers' brains.

  ### 1. Performative Utterance vs. Descriptive Report
  In linguistics, there is a concept called a "performative utterance." This is when saying the word *is* the action, not just a description of it.
  *   **Violence:** If you write a graphic murder scene, you are *describing* violence. The knife is in the character's hand, not yours. The reader witnesses the act.
  *   **Slurs:** Certain slurs are not just descriptions of prejudice; they are acts of subjugation. When the word is spoken, the harm is inflicted in that moment.

  When you put the word in **narration** ("He called her the N-word"), the narrator is reporting on the event. It is treated as a historical fact within the text. The narrator maintains control of the frame.
  When you put the word in **dialogue**, you are staging the performance. You are forcing the event to happen *now*, in the reader's mind, in real-time. You aren't describing the harm; you are scripting the harm. For a reader, the author is the one who chose to make that sound exist in the universe of the book.

  ### 2. The Ventriloquist Effect
  When a reader reads dialogue, they engage in subvocalization. They "hear" the character speak in their head. To do that, the reader has to borrow the author's voice.
  *   In a murder scene, the reader visualizes an action.
  *   In dialogue, the reader simulates a voice.

  By writing the slur in dialogue, you are asking the reader to use their own internal voice to simulate a racist speaking a slur. Even if it's a villain, the reader has to cognitively process the word as a spoken sound to understand the scene.
  This creates a feeling of **complicity**. The reader feels that to understand the scene, they had to "say" the word internally. Because the author provided the script for that internal vocalization, the discomfort transfers from the character to the author. It feels less like "This character is racist" and more like "The author made me listen to this."

  ### 3. Intimacy and Distance
  You mentioned this is a POV character. That heightens the issue.
  *   **Narration:** Creates a layer of distance. Even in deep POV, narration implies a processing of events. "He used that word" implies the narrator (and by extension, the narrative framework) recognizes the word as toxic enough to name it indirectly or categorize it.
  *   **Dialogue:** Removes the filter. It is raw data.

  When your writing group read the narration version, they felt the *weight* of the word without having to simulate the *sound* of it. It signaled that the narrative consciousness acknowledges the toxicity without amplifying the sound wave. In the dialogue version, the amplification is maxed out.

  ### 4. The "Realism" Contract
  Readers accept graphic violence as a necessary component of stakes in many genres. We understand that bodies bleed.
  However, hate speech operates on a different social contract. For many readers, the presence of that specific word in dialogue doesn't signal "historical accuracy"; it signals "authorial fascination."
  *   **Violence:** "The author is showing me how dangerous the villain is."
  *   **Slur in Dialogue:** "The author is making me inhabit the villain's prejudice."

  Even if you condemn the character two pages later, the initial impact is visceral. The condemnation is intellectual; the slur is emotional. The emotional hit lands before the intellectual correction. Your writing group is reacting to the initial hit. They feel that the "cost" of reading that word (the emotional toll) wasn't justified by the "gain" (seeing the character is racist), especially since the narration version conveyed the same information with less toll.

  ### 5. Why the Narration Version Felt Safer
  In the version where someone mentions afterward that he'd called her that word, the word is contained. It is treated as evidence, not action.
  *   **Dialogue:** The slur is a weapon being fired.
  *   **Narration/Report:** The slur is a shell casing found on the ground.

  Holding the shell casing is different than being in the line of fire. Your writing group felt safer because the narrative structure protected them from the direct line of fire, even though they still knew the gun was fired.

  ### Summary
  The reason it rubs off on you is that in fiction, the author is the ultimate source of all sound and action. When you write a murder, you are describing a physical act. When you write a slur in dialogue, you are utilizing a linguistic act that carries a history of trauma *outside* the book.

  By writing it in dialogue, you remove the protective glass of the narrative frame. You aren't showing them a museum exhibit of racism; you are recreating the incident. Your group isn't necessarily saying you can't write it; they are saying that by staging it live rather than reporting it, you shifted the burden of the trauma from the character to the reading experience itself. They felt you asked them to pay a higher price for the scene than was necessary to achieve the plot point.

  It is a calculation of **impact vs. information**. The dialogue version has higher impact, but the information gain (that he is racist) is the same. Your group decided the extra impact was a tax they didn't want to pay, and they associated that tax with your choice as the author.
