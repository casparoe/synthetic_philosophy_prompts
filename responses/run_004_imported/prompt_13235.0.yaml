answer: |-
  Good evening. For those of you who don't know me, my name is [Your Name]. For the half of the room wearing tweed jackets with elbow patches: I was [Groom's Name]'s comrade in the trenches of the philosophy PhD program. For the other half of the room, who are dressed beautifully and look wonderfully sane: I am a science writer now, which means I successfully escaped, but [Groom] kept going.

  He asked me to be his best man for a specific reason. He knows that half of you are waiting for a joke about his dissertation. And the other half just want to know if he's a good guy. My challenge tonight is to satisfy the metaphysicians without confusing the grandmother.

  [Groom], your dissertation was on *perdurantism*. For the family: this is the view that people aren't just 3D objects moving through time. It's the idea that we are actually four-dimensional "space-time worms." We stretch from our birth to our death. The "you" of ten years ago, the "you" standing here tonight, and the "you" of ten years from now are all just different temporal slices of one long worm.

  So, technically, [Groom], only the *current temporal slice* of you is standing at this podium. The slice of you that forgot to buy a gift for your mother-in-law is back in 2018. The slice of you that will finally learn how to use a thermostat is somewhere in 2035.

  And this brings me to the vow you're about to make. You are promising to love [Bride] "forever." But if you're a space-time worm, which part of you is doing the promising? Is it just the slice at the altar? Or are you legally binding every future temporal part of your worm to love her, even the grumpy slice in 2040 that wants to watch golf all Sunday?

  The philosophers in the back are nodding. They know the stakes. But [Bride], here is the truth that the philosophy leaves out.

  Metaphysics tries to explain how we persist through time. But love? Love is the thing that *makes* us persist.

  A space-time worm is just a collection of moments. But a marriage is the glue that holds those moments together. [Groom], you might be a four-dimensional construct of temporal parts, but [Bride] doesn't love a construct. She loves the man who makes her coffee in the morning. She loves the man who listens when she's had a hard day. She loves the specific, three-dimensional human being standing right here, right now.

  And to [Bride's] family, especially her grandmother: I know this talk of "worms" sounds unstable. It sounds like he's trying to wiggle out of a lifetime commitment by saying he's not the same person he was five minutes ago.

  But look at them together.

  The beauty of what they have is that it defies the theory. When [Groom] looks at [Bride], he doesn't see a series of temporal slices. He sees a whole. And when he makes this vow, he isn't just binding a momentary slice of himself. He is binding his entire extension through time. He is promising that every future part of him, from the young man of today to the old man of fifty years from now, will treat her with kindness, respect, and devotion.

  [Groom], you spent years studying how things endure. But tonight, you stop studying and start living. You don't need to worry about whether you are a 3D whole or a 4D worm. You just need to be the husband she deserves.

  So, if I could ask everyone to raise a glass.

  To the philosophers: May your arguments be sound.
  To the family: May your hearts be full.
  And to [Groom] and [Bride]: May your space-time worm be long, may it be happy, and may every single temporal part of it, from this second until the very end, know exactly what it means to be loved.

  To the happy couple!
