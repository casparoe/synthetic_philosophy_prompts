  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the context (the scale/gauge analogy) immediately. Set the stakes.
      *   **Round 1: The Core Disagreement.**
          *   Ben: The scale/gauge argument is circular. You can't prove reliability using the tool itself.
          *   Alex: Demanding external proof for *every* tool leads to regress. We need basic entitlements (Wright) or immediate justification (Pryor).
      *   **Round 2: The Stuck Gauge.**
