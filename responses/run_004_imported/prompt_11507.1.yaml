  Okay, the "friend" in the prompt story sided with Wright (Bootstrapper). So the *Defender* in the dialogue represents the friend. Therefore, the *Defender* should be the one put in the difficult spot regarding Bayesianism. The Critic should use the Bayesian argument to trap the Defender.
