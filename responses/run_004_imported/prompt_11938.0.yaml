          3.  Constant Conjunction (whenever A, then B).
          4.  **Existence:** Causes and effects must be *existences* (impressions/ideas of matters of fact).
      *   *The Problem of Omission:* An omission is a *non-event*. It's the absence of something.
      *   *Hume's Text:* *Treatise of Human Nature* (Book 1, Part 3) and *Enquiry Concerning Human Understanding* (Section 7).
      *   *Hume's Stance on "Negative" Causes:* Hume is generally skeptical of "negative" existences. For him, everything in the mind derives from an impression. What is the impression of a "non-occurrence"?

