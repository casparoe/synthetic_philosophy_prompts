answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name], one of Marguerite's grandchildren. I've been asked to speak today, largely because I write for a living, and in this family, that apparently makes me the designated architect for things that need to be built out of words.

  If you knew Grandma, you knew about the cards.

  Long before she needed them, she had them. Index cards, crisp and lined, filed in boxes that smelled faintly of cedar and old paper. At first, they were just how she kept the world in order. Bridge scores, recipes, the birthdays of cousins twice removed, the name of the plumber who fixed the sink in 1998. She liked to keep track of things. She liked to know that what happened mattered enough to be written down.

  Then, about ten years ago, the cards changed. As her memory began to fray, the habit hardened into a lifeline. The boxes multiplied. The handwriting grew shakier, but the system remained rigorous. Who was coming for dinner. Which pills came before lunch. Which stories she had already told you, so she wouldn't tell them again.

  It would be easy to look at those boxes and see a tragedy. To see a woman retreating, hiding behind a wall of paper as her mind dimmed. But Grandma would have hated that. In fact, she made it a condition. In one of her last clear weeks, she made my mother promise that no one would stand up here and say she had "gone behind the cards." She called that idea maudlin. And, she said, it was false.

  She was right.

  My brother, who is finishing a doctorate in philosophy, has a theory about this. He likes to say that Grandma wasn't losing her mind in those last ten years; she was just expanding where it lived. There is an idea in philosophy that if you trust something enough—if you rely on it as completely as you rely on your own brain—then it stops being just a tool. It becomes part of you.

  Grandma trusted those cards. She didn't check them with suspicion; she checked them with the same unconscious faith I use to remember my own middle name. She wrote them herself, over years, by her own hand. In a very real sense, she wasn't fading away during that decade. She was distributing herself. She was present in the room, yes, but she was also present in the box on the side table. She was in the ink, in the dates, in the careful script that said, "Ask about the garden."

  To say she was lost because her memory wasn't entirely inside her skull is to misunderstand where a person actually lives. We live in our habits. We live in the things we trust. We live in the records we keep of the people we love.

  For the last ten years, when you spoke to Grandma, you weren't speaking to a fading echo. You were speaking to a woman who had done the hard, deliberate work of staying present. She built a bridge between who she was and who she was becoming, and she walked across it every single day. She didn't let the disease steal her agency; she outsourced it, on her own terms, to the paper she trusted.

  So, if you are looking for her today, do not look for her only in the silence of the last nine days. Look for her in the order of things. Look for her in the stories you wrote down so you wouldn't forget them. Look for her in the way you keep track of what matters.

  She is not behind the cards. She is in them. And now, she is in us.

  Thank you.
