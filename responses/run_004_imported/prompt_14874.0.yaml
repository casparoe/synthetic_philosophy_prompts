      *   **Audience:** Mixed. Three surviving sisters (older generation), bridge club (peers), dozen grandchildren (younger/mixed), one brother (Philosophy PhD candidate).
      *   **Speaker:** Grandchild, family novelist.
      *   **Key Theme:** The "Extended Mind" thesis (Otto thought experiment by Clark & Chalmers). Marguerite wasn't *behind* the cards; she was *distributed across* them.
      *   **Constraints:**
          *   Do not make it a philosophy seminar (keep it accessible/emotional).
          *   Do not violate Marguerite's wish (no "gone behind the cards" narrative).
          *   Do not overclaim metaphysical certainty (keep it gentle/poetic, not dogmatic).
          *   Length: About 5 minutes (approx. 600-800 words spoken at a moderate pace).
      *   **Tone:** Respectful, warm, intellectually honest but emotionally resonant.

  2.  **Deconstruct the Philosophy (The "Otto" Reference):**
      *   *The Theory:* If someone relies on an external tool (notebook) as reliably as internal memory, that tool is part of their mind.
      *   *The Application:* Marguerite's index cards weren't a crutch; they were her memory. She didn't lose herself; she expanded herself into the physical world.
      *   *The Trap:* Don't say "She *was* the cards." Do say "She was present *in* the cards."
      *   *The Brother's Role:* He needs to hear the nod, but not feel like he's listening to a lecture.
      *   *The Sisters/Bridge Club:* They need to hear about her organization, her love, her presence.
      *   *Marguerite's Wish:* Explicitly avoid the language of fading or hiding.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the mixed crowd, and the task. Establish the voice (novelist/grandchild).
      *   **The Habit (Pre-Alzheimer's):** Establish the index cards as a character trait first. She was always organized. This grounds it in reality before the illness.
      *   **The Shift (Alzheimer's):** Address the elephant in the room gently. The cards changed from habit to lifeline.
      *   **The Philosophical Core (The "Otto" Nod):** This is the tricky part. Needs to be metaphorical but accurate. Use the brother's insight without naming Clark or Chalmers. Focus on *trust* and *integration*.
      *   **Marguerite's Directive:** Incorporate her specific wish about not being "behind the cards." This validates her agency.
      *   **The Conclusion:** Bring it back to love and memory. The cards remain, but so do we.

  4.  **Drafting - Specific Phrasing & Tone Check:**
      *   *Avoid:* "Cognitive science suggests," "The extended mind thesis," "Metaphysically speaking."
      *   *Use:* "She trusted them," "They were part of her," "A map of her love."
      *   *Brother Check:* Is the Otto reference clear enough? Yes, if I mention the idea that the mind isn't just inside the skull.
      *   *Sisters/Bridge Club Check:* Is it too abstract? Need to ground it in the bridge scores, the pill schedules, the names.
      *   *Marguerite's Wish:* Must quote or paraphrase her instruction clearly.

  5.  **Refining the "Otto" Reference:**
      *   Instead of naming Otto, describe the *concept*. "There's an idea... that if you trust something enough, it stops being a tool and starts being part of you."
      *   Connect it to the novelist aspect: "As a writer, I think about where stories live. Grandma taught me they live in the telling, and in the notes."

  6.  **Writing - First Pass (Mental or rough notes):**
      *   Start with thanks.
      *   Talk about the cards. Everyone knew about the cards.
      *   She had Alzheimer's. But she didn't disappear.
      *   My brother says the cards were her brain. That sounds cold, but it means she was still there.
      *   She told Mom not to say she hid behind them.
      *   So, she was in the room, in the cards, in us.
