      *   *Decision:* The reply succeeds in showing the empirical data is irrelevant to the *logical point*, but it fails to prove the *metaphysical conclusion* to a modern skeptic. I will nuance this: It succeeds as a defense of the thought experiment's integrity, but leaves the underlying dualism vulnerable to modern philosophy of mind.

