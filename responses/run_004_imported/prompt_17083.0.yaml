      *   *Text 2: De Regimine Principum (I, 6):* This is the more mature political text. He is much more cautious here. He argues against private assassination, preferring public authority or divine intervention.
      *   *The "Usurper vs. Legitimate" Distinction:* Crucial. A usurper can be resisted more easily. A legitimate ruler who turns tyrant is harder to touch because they hold office by some form of consent/law.
      *   *The User's Scenario:* The leader is *not* a usurper (elected fairly) but becomes a tyrant by exercise (abuses power). This fits the *De Regimine* scenario best.
      *   *The "No Lawful Route" Problem:* If the institutions are captured, who constitutes "public authority"?

  3.  **Drafting the Argument - Step-by-Step:**

