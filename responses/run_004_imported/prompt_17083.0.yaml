answer: |-
  This is a fantastic seminar prompt because it forces Aquinas out of his feudal comfort zone and into the realm of what modern political scientists call "autocratic legalism" or "democratic backsliding." You're describing a tyrant *by exercise* (who has a legitimate title but abuses power) rather than a tyrant *by usurpation* (who has no title).

  Aquinas is notoriously difficult to pin down here because his thought evolves between the *Commentary on the Sentences* (1250s) and *De Regimine Principum* (1260s), and because he is constantly balancing two goods: justice (removing the tyrant) and order (avoiding sedition).

  Here is how Aquinas would likely parse your scenario, where the "legal" routes are captured but the ruler was originally legitimate.

  ### 1. The Diagnosis: Tyrant by Exercise, Not Usurper
  First, Aquinas would definitely classify your leader as a tyrant. For Aquinas, legitimacy isn't just about how you get power (election/appointment); it's about how you use it. In *De Regimine Principum* (I.3), he defines tyranny by the *end* of rule. If the ruler seeks private gain over the common good, he is a tyrant.

  The fact that he uses "legal" channels to gut the courts doesn't fool Aquinas. In the *Summa Theologiae* (I-II, q. 96, a. 4), he is clear that human laws which are contrary to the common good or divine good are "acts of violence rather than laws." They do not bind in conscience. So, Aquinas would grant that the citizens are under no moral obligation to obey these specific decrees.

  **However,** recognizing the tyranny is different from sanctioning the removal.

  ### 2. The Textual Tension: *Sentences* vs. *De Regimine*
  You noted the discrepancy, and it's crucial for your seminar.

  **In the *Commentary on the Sentences* (II Sent., d. 44, q. 2, a. 2):**
  Aquinas is younger and slightly more permissive. He asks whether it is meritorious to kill a tyrant. He concludes that if there is **no superior authority** to whom one can appeal, private individuals *may* take action, provided their intention is the deliverance of the country and not personal ambition. He cites the example of Aod killing Eglon (Judges 3) as a divinely inspired exception.
  *   **Application to your case:** If your citizens are convinced there is "no lawful route left," the *Sentences* argument suggests a narrow window for action. If the courts are gutted and the constitution rewritten, there is no "superior" human authority.

  **In *De Regimine Principum* (I.6):**
  This is the mature political Aquinas, and he slams the door shut. Here, he explicitly argues *against* killing kings, even tyrannical ones.
  *   **The Argument:** He argues that killing a tyrant often leads to worse tyranny. The successor might be worse, or the tyrant becomes a martyr, or the act of assassination sets a precedent that destabilizes all future authority (sedition).
  *   **The Mechanism:** He insists that the remedy must come from **public authority**, not private presumption. If the community has the right to elect the king, the community (or its representatives) has the right to depose him.
  *   **Application to your case:** This is where your scenario breaks Aquinas's mechanism. He assumes "public authority" (the nobles, the estates, the electors) exists *alongside* the king to check him. In your scenario, the leader has "quietly gutted" those intermediate bodies.

  ### 3. The "Captured Authority" Paradox
  This is the crux of your seminar question: *If public authority is captured, who acts?*

  Aquinas is a hierarchical thinker. He does not believe in "the people" as a sovereign mass that can spontaneously act. He believes in a corporate body (*universitas*). In *De Regimine*, when he says "public authority" should act, he usually means the magnates, the barons, or the electoral college that originally installed the ruler.

  If your leader has jailed the critics and rewritten the constitution to eliminate those checks, Aquinas faces a dilemma.
  1.  **If the intermediate bodies are merely suppressed:** Aquinas would likely urge them to reconstitute themselves clandestinely and act corporately. He would distinguish between a "mob" (sinful sedition) and a "corporate body" (lawful resistance).
  2.  **If the intermediate bodies are legally abolished:** Aquinas would likely fall back on **divine intervention** or **patience**. In *De Regimine*, he explicitly says that if no human remedy is possible, one must have recourse to God (citing the patience of the early Christians under Nero).

  ### 4. Would He Bless Private Citizens?
  Probably not. Here is why:

  **1. The Sin of Sedition:**
  For Aquinas, sedition is a mortal sin because it attacks the unity of the common good (*Summa* II-II, q. 42). Even if the ruler is bad, the *act* of private citizens taking up arms destroys the principle of authority itself. He fears the chaos of the cure more than the disease. In your scenario, since the leader wasn't a usurper, he holds the "office." Attacking the office-holder without a superior mandate looks like sedition to Aquinas.

  **2. The "Usurper" Loophole is Closed:**
  If the leader had seized power by force (usurper), Aquinas (and his contemporary John of Salisbury) is much more open to resistance. But because this leader won a "genuinely fair election," he has a title (*titulus*). Aquinas respects the sanctity of the office even when the man is corrupt.

  **3. The "No Recourse" Problem:**
  In the *Sentences*, he allows action if there is "no superior." But in *De Regimine*, he redefines "superior." Even if the domestic courts are gone, is there an external superior? An Emperor? A Pope? A neighboring ally? Aquinas prefers international or supranational intervention over domestic assassination. If your scenario isolates the country completely, Aquinas runs out of options.

  ### 5. Seminar Discussion Point: The "Constitutional" Revert
  There is one nuance you can press on. In *De Regimine* I.6, Aquinas says: *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power."*

  This is your strongest hook.
  *   **Argument:** Since the leader was elected (by the "multitude" or their representatives), the authority ultimately resides in the corporate body that elected him.
  *   **Counter-Argument:** Aquinas assumes that body remains intact to do the deposing. If the leader has legally dissolved that body, can it reconstitute itself?
  *   **Aquinas's likely verdict:** He would likely say the *representatives* must act, not "ordinary citizens" individually. If the representatives are jailed, the remaining citizens must wait until they can act as a unified corporate entity, not as a mob.

  ### Summary for your Seminar
  If you put Aquinas in the room with your scenario:

  1.  **He condemns the leader:** He is a tyrant by exercise; his laws are violence, not law.
  2.  **He condemns private assassination:** Especially in his mature work (*De Regimine*), he fears the precedent of private violence more than the tyranny itself.
  3.  **He demands "Public Authority":** He would look for *any* remaining magistrate, noble, or corporate body to lead the resistance.
  4.  **If all channels are truly gone:** He would likely counsel endurance over violent revolution, trusting in Divine Providence, because he believes the destruction of political order (sedition) is a greater spiritual danger than suffering under a bad ruler.

  **The Twist:** You can challenge your seminar students with this: Aquinas's caution essentially protects the "legal" tyrant more than the "illegal" usurper. His system relies on intermediate institutions (nobles, courts, church) to check power. If a tyrant removes those institutions *legally*, Aquinas's political theory lacks a "kill switch" for private citizens. It reveals that Aquinas is a constitutionalist, not a revolutionary. He assumes the rule of law exists; he doesn't fully account for the death of the rule of law from within.
