          *   If *all* structures are gone, Aquinas tends toward patience/divine intervention rather than mob justice. He fears sedition (sin) more than tyranny (evil), because sedition destroys the common good's structure.

      *   **The "Legal" Aspect of the User's Scenario:**
          *   Aquinas cares about the *end* (common good) but also the *form* (law).
