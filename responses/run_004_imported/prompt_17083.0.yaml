      *   **Key Question:** Would Aquinas sanction private citizens acting to remove him if all lawful routes are closed and "public authority" is captured?
      *   **Specific Texts:** Commentary on the Sentences (*In Sententias*) and *De Regimine Principum* (On Kingship).
      *   **Tone:** Academic but accessible (seminar prep), nuanced, engaging with the tension in Aquinas's thought.

