answer: |-
  Here are ten questions for the post-talk discussion, designed to probe the implications and limits of the Taurekian position without simply asking for a summary of the view.

  **1. The Scope of the Separateness Objection**
  You argue that the "separateness of persons" blocks us from aggregating losses across individuals, thereby defeating the utilitarian case for saving the larger group. Does this metaphysical claim about persons *only* defeat the positive duty to save the greater number, or does it actively license full indifference between the two groups? In other words, does the separateness of persons itself mandate the coin toss, or is the toss a separate fairness requirement that could theoretically be decoupled from the anti-aggregation claim?
  *   **Follow-up:** If she replies that separateness only defeats aggregation but does not mandate indifference, press her on what principle *does* decide the case. If there is no moral reason to prefer the larger group, is there any moral reason to prefer a coin toss over simply picking the smaller group arbitrarily?

  **2. Parfit's "Innumerate Ethics" Reply**
  Derek Parfit objected that even if no "super-person" suffers the loss of the group, it remains true that *more individuals* receive a benefit if we save the larger group. Does your view require us to ignore the moral significance of the fact that a greater number of individual benefits are realized in one outcome over the other, provided those benefits are not summed into a total?
  *   **Follow-up:** If she insists that benefits cannot be compared across persons, ask whether this implies that a world where five people are saved is, in any objective moral sense, no better than a world where only one is saved, or if "betterness" is strictly agent-relative.

  **3. Scanlon's Contractualist Challenge**
  T.M. Scanlon argues we can save the greater number without aggregating claims, by suggesting that the single person cannot reasonably reject a principle that saves the five, whereas the five *can* reasonably reject a principle that saves only one. How does your account of fairness override this asymmetry in reasonable rejection without implicitly summing the strength of the five complaints?
  *   **Follow-up:** If she argues that the single person's claim is equal in *weight* to any one of the five, ask whether the *collective* force of five equal complaints should not outweigh a single equal complaint in a contractualist framework, even if they aren't mathematically summed.

  **4. The Weighted Lottery Compromise**
  Some critics suggest a weighted lottery (e.g., a 5/6 chance for the larger group) as a principled compromise that acknowledges the numbers without full aggregation. Would you accept such a lottery as morally permissible, or do you view this as surreptitiously reintroducing the aggregation of claims you reject by another route?
  *   **Follow-up:** If she says it reintroduces aggregation, ask where the bright line lies. If a 51/49 split is impermissible because it counts numbers, why is a 50/50 split permissible? Is there a non-arbitrary justification for why giving the larger group *any* extra weight violates the separateness of persons?

  **5. Kamm's "Each We Owe" Argument**
  Frances Kamm argues that we owe rescue to each individual in the larger group, and since we can rescue all of them without extra cost to the single person (beyond the loss of the chance), we should do so. Does your view imply that we owe *less* to each person in the larger group than we do to the single person, given that we are willing to let them die half the time?
  *   **Follow-up:** If she denies we owe them less, ask how we can satisfy the equal obligation to all six individuals by implementing a procedure that guarantees five of them will die in 50% of the possible outcomes.

  **6. The Metaphysics of Loss**
  Your argument hinges on the claim that "loss" is only intelligible relative to a specific subject. However, in public policy and triage, we often speak of "minimizing loss of life" as a goal independent of specific subjects. Is your objection to numbers counting merely a constraint on *private* moral decision-making, or does it also forbid institutional policies aimed at minimizing total mortality?
  *   **Follow-up:** If she limits the view to private morality, ask whether this creates an untenable dualism where a paramedic must act as a Taurekian in the ambulance but a utilitarian when designing hospital triage protocols.

  **7. Ex Ante Fairness vs. Ex Post Outcomes**
  You prioritize *ex ante* fairness (giving everyone an equal chance of rescue) over *ex post* outcomes (the number of survivors). If we knew in advance that a strict "save the greater number" policy would save more lives overall in the long run, including potentially the life of the person currently in the minority, would that consequentialist consideration override your fairness constraint?
  *   **Follow-up:** If she says fairness overrides long-term outcomes, ask whether this commits her to a view where we should allow more people to die overall in order to maintain a specific procedural notion of fairness in individual cases.

  **8. The Permissibility of Risk Imposition**
  By tossing a coin between a group of five and a group of one, you are imposing a 50% risk of death on each of the five. If one of the five survives and asks, "Why did you subject me to a 50% risk of death when you could have saved me for sure?", what is the justification? Is the answer simply that the single person would have faced a 100% risk otherwise?
  *   **Follow-up:** If she appeals to the single person's 100% risk, ask whether the *sum* of risk imposed on the five (2.5 expected deaths) is morally irrelevant compared to the *distribution* of risk (50% each vs. 100% for one).

  **9. The Foundation of the Fairness Norm**
  You argue that fairness requires giving each person an equal chance. But why is "equal chance" the correct metric of fairness rather than "equal concern"? One could argue that showing equal concern for the five requires recognizing that their collective plight is more urgent than the one's. Is your preference for a coin toss a substantive moral intuition that itself needs justification, rather than a neutral default?
  *   **Follow-up:** If she argues equal chance is the only way to respect persons as equals, ask whether respecting persons as equals might sometimes require acknowledging that the needs of many equals outweigh the needs of one equal.

  **10. The Lopsided Case (1000 vs. 1)**
  Finally, consider a case where we must choose between saving one person or a thousand. Does your principle still mandate a 50/50 coin toss between the *groups*, giving the single person a 50% chance of survival? If you accept this verdict, does it sound like a rigorous application of your principle, or a concession to intuition that you are willing to let 1,000 die to avoid violating the one's claim?
  *   **Follow-up:** If she bites the bullet and accepts the 50/50 toss, ask whether this result undermines the plausibility of the "separateness of persons" argument by showing it leads to conclusions that violate our deepest moral convictions. If she wavers, ask at what number the principle breaks down, and whether that suggests numbers *do* count after all.
