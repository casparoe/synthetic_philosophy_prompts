answer: |-
  The tube had been removed, but Freddie's throat still felt as though he had swallowed a handful of gravel. He lay in the private room at the Wellington, staring at the ceiling. It was a textured white, stippled like porridge. It was not glowing. It was not red.

  He blinked. The memory of the light was more vivid than the ceiling. A fierce, radiant redness, painful in its intensity. And the figures. Not angels. Angels would have been too poetic, too laden with unverifiable baggage. These had been functionaries. Beings charged with the administration of space. And they seemed to have made rather a hash of the job.

  Freddie shifted his shoulders. The body was heavy, a sack of wet sand. This was the anchor. If the body was here, heavy and aching, then *he* was here. The continuity of the physical organism was the only continuity that mattered. There was no ghost to have floated off while the machine pumped his blood. There was only the interruption of the function, and now, the resumption.

  The door opened. It was Julian, a former student who had gone on to teach something softer than logic, perhaps ethics or theology. Julian held a bunch of grapes that looked suspiciously like the kind one bought at a supermarket, not the sort a well-wisher brought to a hospital.

  "Freddie," Julian said, keeping his voice low, reverent. "You gave us a fright."

  "I choked on a fish," Freddie crooped. The voice was ruined, raspy. "It is an undignified exit. I hope you didn't tell the papers it was a metaphysical crisis."

  Julian pulled a chair close, ignoring the visitation hours sign. "They're saying you were gone for four minutes, Freddie. No pulse. Flat line."

  "I was not gone. I was here. My heart stopped. There is a distinction."

  "Where were you, though?" Julian leaned forward. The hope in his eyes was palpable, a desperate hunger for a crack in the universe. "The nurses said you were talking about a light."

  Freddie looked at the stippled ceiling. He needed to be precise. Language was the only tool that kept the chaos at bay. If he used the wrong words, he would validate a nonsense proposition.

  "There was a sensation," Freddie said. "Of redness. And a sense of presence."

  "Did you see God?"

  Freddie closed his eyes. The question was grammatically sound but cognitively vacuous. What observation could count for or against the presence of God? None. Therefore, the question was not false; it was meaningless. It was like asking if the number seven was jealous.

  "I saw nothing that resembles the theological construct of a deity," Freddie said. "I saw administrators. Bureaucrats of the cosmos. They were indifferent. If they were divine, they were remarkably incompetent at maintaining the structural integrity of my thoracic cavity."

  Julian smiled, a tight, disappointed thing. "But you were conscious. While you were clinically dead."

  "I was not dead. Death is the permanent cessation of biological function. I suffered a temporary cessation. To say I was conscious *while* dead is to misuse the terms. It implies a subject existing without the conditions that make the subject possible." Freddie tapped his chest. "I am a body. When the body stops, I stop. When it started again, the sensations resumed. Including the sensation of the red light."

  "But it felt real. More real than this room."

  "Hallucinations are often vivid. Hypoxia produces vivid imagery. It is a verifiable fact that lack of oxygen to the visual cortex produces phosphenes and luminous fields."

  "Is that all it was?" Julian pressed. "Just chemistry?"

  Freddie paused. This was the itch he couldn't scratch. The Verification Principle demanded that for a statement to have cognitive content, one must know what observation would verify it. The statement *'I survived death'* had no verification conditions. One cannot observe one's own non-existence to confirm survival.

  However, the statement *'I had an experience as of surviving'* was empirically true. He had had the experience. The qualia were present. The red light was a datum. To deny the datum because it didn't fit the theory was bad empiricism. To inflate the datum into a metaphysical truth was bad logic.

  "It was an experience," Freddie said carefully. "It occurred. I do not deny the occurrence."

  "Does it change your mind? About... the end?"

  Freddie looked at his hands. They were pale, spotted with age. They were the same hands that had written the books, smoked the cigarettes, gestured at the arguments. Were they the same hands that had been cold in the ambulance? Yes, by bodily continuity. But the *I* that saw the red light—was that the same *I*?

  If personal identity is memory and body, then the gap should have severed him. But the memory bridged the gap. He remembered the light from this side of the silence.

  "My conviction," Freddie said, "was that when I die, I shall cease to exist. That remains the most logical conclusion based on available evidence."

  "Available evidence?" Julian gestured to Freddie's chest. "You just came back."

  "I came back from the brink. I did not come back from the other side. There is a difference. I did not visit a place. I was in a state of neurological distress." Freddie paused. The dry wit felt like a shield, but it was cracking. "However."

  "However?"

  "It is difficult to maintain the absolute certainty of annihilation when one has had a conversation with the administration of space."

  Julian laughed, a short burst of relief. "So you believe?"

  "I believe I saw a red light. I believe I felt a presence. I do not know what those things signify, because I do not know what observations would confirm their significance outside of my own nervous system." Freddie turned his head to the window. London was grey outside. "If I tell you there is a life after death, I am making a claim that cannot be tested. I am speaking nonsense. But if I tell you that my fear of the void has been... mitigated... that is a psychological report. That is verifiable. You can measure my pulse. You can hear my tone."

  "You're less afraid."

  "I am annoyed by the salmon," Freddie said. "And I am tired. The terror of the void was always a theoretical discomfort. Now there is a specific memory of a red light. It crowds out the theoretical void."

  Julian sat back, looking unsatisfied but accepting. He wanted a conversion. He would have to settle for a clarification of terms.

  "Rest, Freddie. I'll come back tomorrow."

  "Bring better grapes," Freddie muttered.

  When the door clicked shut, the room was silent again. The machine beeped, a steady, rhythmic verification of his current status. *Beep.* I am here. *Beep.* I am here.

  Freddie closed his eyes. He summoned the image of the red light. It was still there, behind the eyelids. It did not fade.

  He considered the proposition: *The soul survives the body.*
  Verification condition: Observe the soul separate from the body.
  Status: Impossible.
  Cognitive Content: None.

  He considered the proposition: *Freddie experienced a separation from the body.*
  Verification condition: Ask Freddie.
  Status: Confirmed.
  Cognitive Content: High.

  The distinction was razor-thin, but it was the only thing holding the world together. If he admitted the experience proved the afterlife, he surrendered his life's work to a hallucination. If he denied the experience happened, he surrendered his integrity to a dogma.

  He would keep the distinction. He would hold the red light in his mind not as a window to heaven, but as a brute fact, a strange sense-datum that occurred during a system failure. It did not prove the system continued elsewhere. It only proved the system was capable of generating strange images when it crashed.

  And yet.

  The fear was gone. The absolute, cold certainty that the lights would simply go out and never flicker again—that certainty was loosened. Not because he knew anything more about the universe, but because he knew something more about the limits of his own knowledge. He had assumed the map was the territory. He had assumed that because "afterlife" was linguistically nonsensical, the experience of dying must be nothingness.

  But nothingness does not glow red. Nothingness does not have bureaucrats.

  Freddie opened his eyes. The ceiling was still white. The light was internal. He was still a body in a bed, bound by the laws of physics and the decay of cells. The end was coming, and it would be final. The verification principle stood; the metaphysics remained meaningless.

  But as he drifted toward sleep, Freddie allowed himself a small, unscientific indulgence. He did not check his pulse. He did not test the reality of the hand against the sheet. He simply let the memory of the red light sit alongside the beeping machine, two conflicting data points that he no longer felt compelled to reconcile. He would not say he believed. He would say only that the proposition *'I am afraid of the dark'* had, for the moment, lost its truth value.

  He turned his head to the side. The grapes on the table were purple, solid, verifiable. He reached out and took one. It tasted sweet. It tasted like now. And for a man who dealt only in the verifiable, that would have to be enough.
