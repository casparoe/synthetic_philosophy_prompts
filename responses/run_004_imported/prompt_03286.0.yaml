      *   *Misconception 2:* "Gathering evidence is pointless."
          *   *Correction:* Evidence is crucial. It's the mechanism that kills simple but wrong theories. SI is about *prediction*, not just static theory selection. You need evidence to rule out the simple wrong stuff.
