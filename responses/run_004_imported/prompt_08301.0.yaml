      *   **The Frege-Geach Problem:** Expressivism says moral statements express attitudes (e.g., "Boo cheating!"), not propositions with truth values. But logic works on propositions. If I say "If cheating is wrong, then getting someone to cheat is wrong," the antecedent ("cheating is wrong") doesn't seem to express an attitude there (I'm not booing yet), but it needs to mean the same thing as in the premise "Cheating is wrong" for the modus ponens to work.
