          *   Illusion: Object is present. Disjunctivist says: "You see the stick, but light refracts." The "looks" is not an object.
          *   Hallucination: Object is absent. Disjunctivist says: "This is not a perception at all, though it seems like one."
          *   Moderate Position: Unstable. If you admit a "common phenomenal character" for illusion, the skeptic uses the "Continuity Argument" (Hallucination $\rightarrow$ Illusion $\rightarrow$ Veridical) to smuggle sense-data back in.
          *   *Literary angle:* The narrator's fear is this slide. He thinks admitting the stick "lies" means the wife might be a lie too.
      *   *Address Q2 (Pritchard):*
          *   Define ED: Factive reasons + Reflective Access.
          *   Independence: Pritchard claims independence, but critics say it needs MD.
          *   *Why?* If the internal state is the same, how do I have a factive reason in one case and not the other?
          *   *Literary angle:* The narrator wants the *epistemic security* (Pritchard) without the *metaphysical commitment* (McDowell). He wants to know he sees her without having to believe the universe guarantees it. This is impossible, which fuels his anxiety.
      *   *Character Voice/Confusion:*
          *   The narrator shouldn't sound like a textbook. He should feel the *pressure* of the arguments.
          *   The "Bent Stick" is the breach in the fortress.
          *   The "Wife" is the collapse of the fortress.
          *   The "Common Kind Assumption" is the villain: the feeling that *experience* is a veil, not a window.

  6.  **Refining the Philosophy:**
      *   *Correction on Illusion:* Naive Realists often treat illusion disjunctively too. "Either I see the stick straight (veridical) or I see the stick under distortion (illusion)." But some allow a common factor in illusion because the object is present. I need to be careful not to overstate the "Moderate Disjunctivism" instability. It's more that *Phenomenal* Disjunctivism rejects common factors across the board. *Moderate* views often try to save Naive Realism by saying illusions are still relational (to the object + conditions).
      *   *Key Distinction:* Is the "appearance" an object (Sense-datum) or a mode of presentation? The narrator fears it's an object (a lie generated by him). The Disjunctivist says it's a mode (the stick presenting itself oddly).
      *   *Pritchard Nuance:* Pritchard allows that the *internal state* might be indistinguishable, but the *rational support* differs. This is hard to sell to a skeptic. The narrator is the skeptic of his own mind.

