  8.  *(Self-Correction during drafting)*: I initially thought about saying Moderate Disjunctivism is definitely unstable. But some philosophers (like Fish) might argue for a nuanced view. I should frame it as "dialectically vulnerable" rather than "logically impossible." The *narrator's fear* is that it's unstable. That's what matters for the book.
