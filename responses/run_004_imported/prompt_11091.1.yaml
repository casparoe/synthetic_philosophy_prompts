      *   *Leibniz's Reply:* Focus on the *individuation* of spatial parts. Without material markers, "parts of space" are indiscernible. Therefore, "moving" them is meaningless. Also, attack the "container" metaphor. Space is not a vessel; it's a set of relations. The "absurdity" Newton sees is only absurd if you accept his substance ontology.
      *   *Connection to Barbour/Yudkowsky:* Briefly touch on how Barbour actually agrees with Newton on the "configuration space" having a structure, but denies the *temporal* substantivalism (which Newton treats analogously). Wait, the prompt mentions Barbour/Timeless Physics. I should acknowledge that connection. Barbour is a relationist about time *and* space effectively (configuration space is the reality). Newton wants absolute space *and* time.

  7.  **Refining the "Leibnizian Reply":**
