      *   Regarding "moving space out of itself": Leibniz would say this is a category error. Space isn't a substance; it's an order of coexistences. You can't move an order.
      *   *Key distinction:* Newton treats space as a *container* (vessel). Leibniz treats space as a *system of relations*.
      *   *Specific rebuttal to "immutable order":* The order is immutable *relative to the things in it*, but without things, the "order" has no anchor.

