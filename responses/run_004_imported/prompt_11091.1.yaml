answer: |-
  This is an exceptionally sharp reading of the Scholium. You are correct that most introductory discussions rush to the *experimentum crucis* of the rotating bucket (or the two globes), treating the earlier passages as mere preamble. However, as you've identified, Section VI contains the metaphysical spine of Newton's substantivalism. The bucket argument is merely the empirical *consequence* of this ontology; this passage is the ontological *justification*.

  Here is a reconstruction of the argument, a verdict on its logical force, and the specific Leibnizian counter-move.

  ### 1. Sentence-by-Sentence Reconstruction

  Newton is attempting to derive the immobility of space from the very concept of "place." He is arguing that if you analyze what we mean by a "location," you find it requires a fixed background.

  > **"As the order of the parts of time is immutable, so also is the order of the parts of space."**

  *   **Function:** Analogy and Premise.
  *   **Analysis:** Newton establishes a parallel between Time and Space. Everyone agrees (even relationists) that you cannot shuffle the order of time (Tuesday cannot come before Monday). Newton asserts this structural rigidity applies to Space as well. The "parts" of space (locations) have a fixed order relative to one another.

  > **"Suppose those parts to be moved out of their places, and they will be moved (if the expression may be allowed) out of themselves."**

  *   **Function:** *Reductio ad absurdum*.
  *   **Analysis:** This is the core conceptual puzzle. If a "part of space" (a specific location) moves, it must move *into* another part of space. But if Location A moves into Location B, then Location A is no longer where it was. But Location A *is* "where it was." To move a location is to make it cease to be that location. Hence, it moves "out of itself." Newton flags the linguistic strangeness ("if the expression may be allowed") to highlight the category error he thinks he is exposing.

  > **"For times and spaces are, as it were, the places as well of themselves as of all other things."**

  *   **Function:** Ontological Claim.
  *   **Analysis:** Space is not just a container for bodies; it is a container for *itself*. Space is self-instantiating. This is a strong substantivalist claim: Space is a substance-like entity that exists independently of the bodies within it.

  > **"All things are placed in time as to order of succession; and in space as to order of situation."**

  *   **Function:** Clarification of Relation.
  *   **Analysis:** Bodies relate to Time via sequence; bodies relate to Space via position. This reinforces the idea that Space and Time are the *frameworks* within which these relations occur, not the relations themselves.

  > **"It is from their essence or nature that they are places; and that the primary places of things should be movable, is absurd."**

  *   **Function:** The Modal Claim.
  *   **Analysis:** This is the definition of "Absolute." A "primary place" (a fundamental coordinate in absolute space) defines what it is to be a place. If the definition of "place" includes being a fixed reference point, then a "moving reference point" is a contradiction in terms. Therefore, the fundamental grid cannot move.

  > **"These are therefore the absolute places; and translations out of those places, are the only absolute motions."**

  *   **Function:** Conclusion.
  *   **Analysis:** Since the framework is immutable, motion defined relative to this framework is "Absolute Motion." This sets the stage for the bucket argument, which will attempt to show that *this specific kind of motion* has physical effects (forces).

  ### 2. Verdict: Independent Argument or Stipulation?

  **Verdict:** This is **not** a successful independent proof against relationism; it is a **stipulative elucidation of Newton's ontology.**

  It functions as a *conceptual truth* within Newton's system, but it begs the question against a relationist (like Leibniz or Barbour).

  **Why it fails as a proof:**
  The argument relies entirely on the premise that space has "parts" that are individuated independently of the matter within them.
  *   **Newton's Assumption:** Space is a container. A container has parts (left side, right side) that exist even if empty. These parts have intrinsic identities (this voxel of space is *this* voxel).
  *   **The Relationist Denial:** Space is not a container; it is a set of relations between bodies. There are no "parts of space" without bodies to define them.

  When Newton says, "Suppose those parts to be moved... they will be moved out of themselves," he is treating spatial points like distinct particles. A relationist replies: "You cannot move a spatial point because a spatial point is not a *thing* that can be moved; it is a *relation*."

  To use a modern analogy: Newton is arguing that "The number 5 cannot move." Well, of course it can't. But if a relationist says "Space is like numbers (a conceptual structure)," then Newton's argument that "Space cannot move" is trivial and doesn't prove Space is a *substance*. It only proves that if Space is a structure, it is an abstract one. Newton wants to conclude it is a *physical* absolute reality (capable of causing forces in the bucket), but this passage only establishes it as a *conceptual* absolute.

  Therefore, the argument is **stipulative**. Newton is defining his terms: "When I say 'Space', I mean an immutable container." He is not proving that this is the *only* coherent way to understand space; he is ruling out the relationist definition by fiat ("is absurd").

  ### 3. The Sharpest Leibnizian Reply

  Leibniz's correspondence with Samuel Clarke (who defended Newton's Scholium) addresses this directly. However, the sharpest reply specific to *this passage* (ignoring the bucket/forces for a moment) attacks the **individuation of spatial parts.**

  **The Argument from Indiscernibles:**
  Newton writes: *"Suppose those parts [of space] to be moved out of their places..."*

  **Leibniz's Reply:** "I cannot suppose that, because there is no way to identify 'those parts' in the first place."

  1.  **Individuation:** For a "part of space" to move, it must be distinguishable from other parts of space. How do you distinguish one region of empty absolute space from another? They have no internal properties. They are not red or blue, heavy or light. They are qualitatively identical.
  2.  **The Shift:** If God shifted the entire material universe 5 feet to the "left" in Newton's absolute space, Newton admits there would be no observational difference.
  3.  **The Trap:** If there is no observational difference, and the parts of space have no intrinsic qualities, then the "before" state and the "after" state are **indiscernible**.
  4.  **Conclusion:** By the Principle of the Identity of Indiscernibles (PII), if two states are indiscernible, they are the same state. Therefore, the universe *did not move*.
  5.  **Application to the Text:** When Newton says, "Suppose those parts to be moved," Leibniz replies: "You are supposing a distinction without a difference." You are treating parts of space as if they have "haecceity" (this-ness) independent of the matter within them. They do not.

  **Specific Rebuttal to "Moved out of themselves":**
  Leibniz would argue that Newton's phrase "moved out of themselves" is a category mistake born of reifying relations.
  *   **Newton:** Space is a vessel. If the vessel moves, it leaves its old location.
  *   **Leibniz:** Space is an order of coexistences. To ask if the "order" moves is like asking if the "alphabet" moves. You can move the *letters* (bodies), but the *alphabet* (space) is just the rule set governing their arrangement. The rule set cannot move "out of itself" because it isn't *in* anything. It is the condition of being "in."

  **The "Time" Analogy Counter:**
  Newton leans heavily on the analogy: *"As the order of the parts of time is immutable, so also is the order of the parts of space."*
  Leibniz accepts the time half but rejects the inference. Time is the order of succession. Space is the order of coexistence. Both are ideal relations. That the *order* is immutable does not mean the *container* is real. The fact that Tuesday cannot follow Monday does not prove "Time" is a substance; it proves that causality/succession has a structure. Similarly, the structure of spatial relations is fixed, but that does not prove the existence of Absolute Space as a "primary place."

  ### Summary

  Newton's passage is a **metaphysical axiom**, not an empirical proof. It succeeds only if you already accept that space is a substance with independently individuated parts.

  *   **Newton's Move:** Defines "Place" as essentially immutable. Therefore, Absolute Space exists.
  *   **The Flaw:** Defines "Place" in a way that excludes relationism by definition.
  *   **Leibniz's Counter:** "Parts of space" are fictions. Only the relations of bodies are real. You cannot move a relation "out of itself."

  For your interest in Barbour/Yudkowsky: Barbour actually sides with Leibniz here against Newton. Barbour's "Platonia" (configuration space) is a timeless structure of possibilities (relations), not a Newtonian container. Newton wants Space to be a *thing* that acts (via inertia); Barbour and Leibniz want Space to be a *description* of how things relate. Newton's Scholium VI is the clearest statement of the "Space as a Thing" view, which is why it remains the primary target for relationists 300 years later.
