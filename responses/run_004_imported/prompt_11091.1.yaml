      *   Leibniz's counter: Space is ideal. It doesn't exist independently. To speak of "parts of space" moving is like speaking of "numbers" moving.
      *   *Sharpest point:* The "Indiscernibility of Identicals." If space is absolute, God could have created the universe 5 feet east. There is no sufficient reason for Him to choose one over the other. Therefore, absolute space is a fiction.
      *   *Specific to the text:* Newton says "Suppose those parts to be moved." Leibniz says "I cannot suppose that, because 'parts of space' are not distinct entities capable of motion."

  8.  **Final Polish:**
