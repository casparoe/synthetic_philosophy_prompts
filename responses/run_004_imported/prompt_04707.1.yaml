answer: |-
  The silence of the Prism wasn't empty; it was heavy, like water pressing against glass.

  Elara stood on the ridge of the caldera, her boots sunk into moss that glowed with a slow, rhythmic pulse. Above her, the sky wasn't black but a bruised violet, streaked with ribbons of aurora that moved without wind. This was the Prism, a rogue planetoid drifting through the intergalactic void, and it was dying. The gravitational shear would tear it apart in twelve hours.

  She was the only human being within a million light-years.

  Her wrist comp chimed. The haptic buzz felt violent against her skin in this stillness. She tapped the link.

  "Elara?" The voice was crackled by distance, but she knew the cadence. Julian. "Telemetry says the structural integrity is failing faster than predicted. You need to launch the probe. Now."

  Elara looked at the probe sitting on the landing pad behind her. It was a simple thing: a camera, a spectrometer, a hard drive. It would shoot out of the gravity well, jump to subspace, and deliver the data to Julian's station.

  "I'm looking at it, Julian," she said. Her voice sounded thin, swallowed by the vastness of the caldera. "It's not just geological. The moss... it reacts to sound. When I hum, the light changes."

  "That's incredible," Julian said. But the speed of his agreement was wrong. It was the speed of someone checking a box. "Think of the payout, El. The Xenobiology Guild will triple our debt clearance. We can buy the house on Mars. The one with the orchard."

  Elara closed her eyes. For ten years, she had loved Julian for his vision. He was the one who told her the universe wasn't dead matter waiting to be mined; he was the one who said exploration was a sacred act. She had built a life on the belief that he valued *this*—the thing itself, the glowing moss, the violet sky.

  "Julian," she said. "If I send the probe, they'll come. Mining crews. Surveyors."

  "We'll protect it. Designated Heritage Site. I promise."

  She watched a ribbon of aurora dip low, brushing the ridge. It made a sound like a bell struck underwater.

  In her head, a cold calculus began to run.

  If she launched the probe, the beauty would be recorded. It would be seen by millions. But it would be seen as a commodity. The value would be in what it could buy, not what it *was*. And Julian would look at the data and see credits. He wouldn't see the bell-sound. He would see her as the brave wife who secured the bag. She would return to him, and they would live in the orchard, and she would love a man who loved a version of her that was a successful hunter, not a witness.

  If she didn't launch the probe, the Prism would die unseen. No one would ever know the moss glowed. The beauty would vanish into the dark without a single external eye to validate it.

  But she was here.

  "Elara? The window is closing."

  She walked to the edge of the ridge. The beauty of the Prism didn't ask for her permission. It didn't ask for a camera. It simply *was*. If she let it die without a record, was it a waste? Or was the waste in turning it into a product for a man who couldn't hear the bells?

  And Julian. If she stayed, she would be loving him based on the lie that he understood her. If she left—really left, by staying here to die—she would be forcing the truth into the space between them. He would know she chose the rock over the orchard. Over him.

  "Elara!" Panic now. "Don't be a martyr. Get in the shuttle."

  "There is no shuttle, Julian."

  "What?"

  "I sent it back with the last supply run. I'm not leaving."

  Silence on the line. Heavy, digital silence.

  "You're... you're staying to die? For a rock?"

  "For the Prism," she said.

  "For *us*!" he shouted. "Think about us! If you die, I lose everything. The debt, the station, *you*."

  "You lose the projection," Elara said softly. "You don't lose me. You never had me. You had the idea of me coming back with a prize."

  She looked out over the caldera. The light was intensifying. The end was coming.

  If she launched the probe, the beauty would survive, but it would be corrupted. It would become a picture of a thing, stripped of its context, sold to people who would never hear the bell. And her love for Julian would become a transaction: her life for his security.

  If she destroyed the probe, the beauty remained pure. It existed, and it was good, even if the only consciousness aware of it was about to be extinguished. And her love for Julian would end in truth. He would know exactly who she was: a woman who valued the unseen over the profitable.

  "Elara, please. Just send the data. You can stay if you want, just send the data."

  She walked over to the probe. It hummed, waiting to be useful.

  She picked up a heavy wrench from the maintenance kit.

  "If I send this," she said, "you'll look at it and you won't see what I see. You'll see a house on Mars. And I'll spend the rest of my life trying to explain that the house isn't the point."

  "I love you," Julian said. It sounded like a plea, or a threat.

  "I know," Elara said. "You love the person who comes back. But I'm not coming back."

  She raised the wrench.

  "Elara, don't!"

  She brought it down on the transmitter array. Sparks showered the glowing moss, hissing as they died. The screen on her wrist went dark. The link was severed.

  She was alone.

  The silence rushed back in, heavier than before. The aurora dipped again, ringing the bell sound.

  Elara sat down on the ridge. She had no way to transmit the beauty. No one would ever know this place existed. In an hour, the gravity shear would turn the Prism into dust.

  She closed her eyes and listened.

  It didn't matter that no one else would see it. The beauty was not a currency to be spent on a future with Julian. It was a fact, as real as the gravity tearing the planet apart. It was good, simply because it was.

  And for the first time in ten years, she wasn't loving Julian. She wasn't loving a future. She was just here, accurate and alone, witnessing the end of something wonderful that asked for nothing but to be.

  The ground shook. The sky began to fracture.

  Elara smiled. She didn't need to save it. She just needed to be there.

  "Beautiful," she whispered to the dark.

  And the dark, indifferent and absolute, held her until the end.
