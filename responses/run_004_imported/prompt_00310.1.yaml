  ### The Allais Common Consequence Setup

  To demonstrate a preference pattern permitted by Lara Buchak’s Risk-Weighted Expected Utility (REU) theory but forbidden by Orthodox Expected Utility (EU) theory, we use the classic **Allais Paradox** structure. This setup involves two choice situations (pairs of gambles).

  #### 1. The Setup
  *   **Outcomes:** $\$0, \$100, \$200$.
  *   **Utility Function:** $u(x) = x$ (linear utility).
  *   **Risk Function:** $r(p) = p^2$.
      *   *Note:* This convex function ($r''(p) > 0$) represents risk aversion, where the agent underweights probabilities of better outcomes relative to certainty.

  #### 2. The Gambles and REU Calculations
  The REU formula for ordered outcomes $x_1 < x_2 < \dots < x_n$ is:
  $$REU(G) = u(x_1) + \sum_{i=2}^n r(P(X \ge x_i)) \cdot [u(x_i) - u(x_{i-1})]$$

  **Choice Situation 1: Certainty vs. Risk**
  *   **Gamble $G_1$ (The Safe Bet):** 100% chance of $\$100$.
      *   $REU(G_1) = u(100) = \mathbf{100}$
  *   **Gamble $G_2$ (The Risky Bet):** 1% chance of $\$0$, 89% chance of $\$100$, 10% chance of $\$200$.
      *   $P(\ge \$100) = 0.89 + 0.10 = 0.99$
      *   $P(\ge \$200) = 0.10$
      *   $REU(G_2) = 0 + (0.99)^2(100 - 0) + (0.10)^2(200 - 100)$
      *   $REU(G_2) = 0.9801(100) + 0.01(100) = 98.01 + 1 = \mathbf{99.01}$

  **Preference:** $G_1 \succ G_2$ (Prefer Certainty).

  **Choice Situation 2: Low Probability Trade-off**
  *   **Gamble $G_3$:** 89% chance of $\$0$, 11% chance of $\$100$.
      *   $P(\ge \$100) = 0.11$
      *   $REU(G_3) = 0 + (0.11)^2(100) = 0.0121(100) = \mathbf{1.21}$
  *   **Gamble $G_4$:** 90% chance of $\$0$, 10% chance of $\$200$.
      *   $P(\ge \$200) = 0.10$
      *   $REU(G_4) = 0 + (0.10)^2(200 - 0) = 0.01(200) = \mathbf{2.00}$

  **Preference:** $G_4 \succ G_3$ (Prefer Higher Payoff).

  ---

  ### Analysis of the Violation and Dominance

  **Orthodox EU Diagnosis (Independence Violation)**
  Orthodox EU theory requires the **Independence Axiom**. If an agent prefers $G_1$ over $G_2$, they must also prefer $G_3$ over $G_4$ (since $G_3$ and $G_4$ are derived from $G_1$ and $G_2$ by removing the common 89% chance of winning $\$100$ and replacing it with $\$0$).
  *   The pattern **$G_1 \succ G_2$ and $G_4 \succ G_3$** is mathematically impossible for any expected utility maximizer. It is a direct violation of the Independence Axiom.

  **Stochastic Dominance**
  This pattern respects Stochastic Dominance. In neither pair does one gamble stochastically dominate the other. For example, in Choice 1, $G_1$ offers a guarantee, but $G_2$ offers a chance at a higher payoff ($\$200$). Since neither option is strictly superior in terms of probability distributions, the agent is free to prefer either without violating dominance.

  ---

  ### Intuitive Rationality

  The preference pattern is intuitively rational because it captures the **Certainty Effect**, which orthodox EU theory fails to model.

  1.  **Non-Linear Probability Weighting:** In Choice 1, the agent values the "guarantee" of $G_1$. Moving from a 100% chance to a 99% chance (in $G_2$) feels like a catastrophic loss of security, a psychological shift that outweighs the small gain in expected value.
  2.  **Consistency in Risk:** In Choice 2, the guarantee is gone; both options are risky. When comparing two low-probability gambles, the agent focuses on the magnitude of the potential payoff. The difference between an 11% chance and a 10% chance is perceived as negligible compared to the difference between winning $\$100$ and $\$200$.

  This is not a framing effect (a cognitive error caused by description) but a structural feature of rational risk aversion. The agent treats "certainty" as a distinct qualitative state, not just the upper bound of a probability scale. Buchak’s REU theory formalizes this by allowing the risk function $r(p)$ to be non-linear, thereby permitting preferences that are sensitive to the *structure* of risk rather than just the expected value.
