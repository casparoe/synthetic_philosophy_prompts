  3.  **Deconstruct Hume's Problem of Induction:**
      *   **Domain:** Empirical/Contingent truths (e.g., "Will the sun rise tomorrow?", "Is all copper conductive?").
      *   **Nature of Truth:** These statements are about the physical world, which could logically be otherwise. They are time-dependent and contingent.
      *   **Uncertainty Source:** The fundamental openness of the future / lack of logical necessity connecting past observations to future events.
      *   **Convergence:** We hope it converges to physical reality, but there's no *logical guarantee* that nature won't change.
      *   **Assumptions:** Requires the "Principle of Uniformity of Nature" (PUN) to bridge the gap between "has happened" and "will happen."

  4.  **Identify the Key Disanalogy (The "Equivocation"):**
      *   The word "Induction" is doing heavy lifting in two different contexts.
      *   *Mathematical Induction:* Proving $P(n) \implies P(n+1)$. (Not relevant here).
