answer: |-
  Good evening. For those of you who don't know me, I'm a colleague of [Honoree's Name] in the philosophy department. Which means that for the last few weeks, I've been staring at a blank page, terrified of writing something that would make her wince.

  She would certainly wince at the phrase "the magic of theater." She finds sentimentality suspicious. And she would probably raise an eyebrow at a eulogy for her career that ignores the fact that she spent thirty-two years teaching students that theater is, morally speaking, a problem.

  We have two groups in this room tonight. Half of you know her as the woman who put half this town on a stage. The other dozen of us know her as the professor who made us read Rousseau's *Lettre à d'Alembert*. In that text, Rousseau argues that the theater corrupts a republic. He says it turns active citizens into passive spectators. He says paying actors to feign passion makes them liars, and paying an audience to watch virtue instead of practicing it makes them complacent. He especially hated comedy that mocks the honest man—like Alceste in *The Misanthrope*—teaching us to laugh at the one person on stage who refuses to dissemble.

  Rousseau believed the only legitimate spectacle was a public festival in the town square, where there is no stage, no tickets, and no distinction between actor and viewer. The people are the show.

  For thirty years, [Honoree's Name] has directed a theater that looks exactly like Rousseau's objection, but operates exactly like his solution.

  There is no raised stage in her theater. You don't pay to get in. You don't audition to get on; you show up. The plays are earnest. She has built a space where the town does not watch itself from a distance, but encounters itself in the act of creation. She didn't ignore Rousseau's critique; she answered it. She wrote a rebuttal not in a treatise, but using other people's bodies, night after night, without pay. She proved that you can have a theater that doesn't separate us, but stitches us together.

  Now, Rousseau himself was not immune to the itch of the footlights. He wrote an opera, *Le Devin du Village*, which was quite popular. He couldn't quite live up to his own strictures. But [Honoree's Name] did. She lived the contradiction so honestly that it ceased to be a contradiction. She taught us that the danger isn't the performance; the danger is the separation.

  And that brings us to tonight, and to her retirement. She is handing this theater over to you—the town, the cast, the board. She is making herself unnecessary.

  I have been wondering if this is the least Rousseauian thing she could do, or the most. To create an institution that depends on a single visionary leader is to create a dependency, a kind of benevolent tyranny. But to build something that can survive your absence? To cultivate a community that no longer needs you to tell them who they are? That is the hardest thing to do.

  In her seminars, she taught that the goal of education is to make the teacher obsolete. In her theater, she taught that the goal of direction is to make the director invisible. By giving this theater to you, she is completing the argument. She is saying that the virtue practiced here does not belong to her. It belongs to the citizens who practice it.

  So, if you will raise your glasses.

  To [Honoree's Name]. Who taught us that the best way to answer a philosopher is to build a world that proves him wrong, and then right, all at once. Who taught us that we are not here to watch virtue, but to act it. And who, tonight, takes the final bow so that the rest of us can remember that the play goes on without the star.

  To [Honoree's Name].
