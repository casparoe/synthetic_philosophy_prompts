answer: |-
  This is a profound question that cuts to the heart of early analytic philosophy's struggle with metaphysics and logic. Your dinner argument touches on a debate that has persisted for over a century. To offer a disinterested opinion: Bradley's regress and the problem of the unity of the proposition are **structurally isomorphic but motivationally distinct**. Treating them as identical risks conflating a metaphysical claim about reality with a logical claim about truth, yet treating them as wholly separate ignores that they arise from the same intuitive puzzle: *How do many become one?*

  Here is an analysis of how Frege and Russell handled this difficulty, followed by a verdict on whose treatment is least question-begging.

  ### 1. Identity vs. Distinction: The Structure of the Problem

  Bradley's regress is fundamentally metaphysical. In *Appearance and Reality* (1893), Bradley argues that if a relation $R$ is distinct from its terms $a$ and $b$, then $R$ requires a further relation $R'$ to connect it to $a$, and so on *ad infinitum*. For Bradley, this proves relations are contradictory and unreal; the ultimate reality must be a relationless Absolute.

  The problem of the unity of the proposition, as confronted by Frege and Russell, is logical and semantic. It asks: What distinguishes the proposition "Socrates is wise" from the mere list "Socrates, wisdom"? A list has constituents but no truth value; a proposition has constituents and unity.

  **Are they the same?** Structurally, yes. Both ask how a connector avoids becoming just another item that needs connecting. However, conflating them obscures a genuine disagreement about what needs explaining. Bradley wants to explain the coherence of *reality*; Frege and Russell want to explain the possibility of *truth and falsehood*. Bradley concludes relations are impossible; Frege and Russell must conclude they are possible, or logic collapses. Thus, while the *mechanism* of the regress is the same, the *stakes* differ. Bradley uses the regress to destroy relations; Frege and Russell use their theories to save them.

  ### 2. Frege: Unsaturatedness as Dissolution or Relocation?

  Frege's solution is to deny the premise that generates the regress. He argues that predicates (concepts) are not objects, nor are they relations in the sense Bradley means. They are **functions**, and functions are essentially **unsaturated** (*ungesättigt*).

  *   **The Mechanism:** An object (e.g., Socrates) is saturated. A concept (e.g., "...is wise") has a gap. When the object fills the gap, unity is achieved immediately. There is no need for a "copula" or a third thing to glue them, because the concept *demands* completion by its very nature.
  *   **Does it dissolve the regress?** Logically, yes. By categorizing concepts and objects as fundamentally different logical types, Frege blocks the move that treats the relation as just another term. You cannot ask "what relates the function to the argument?" because that question assumes they are two independent items waiting to be linked. For Frege, they are not independent; the function is defined by its applicability to arguments.
  *   **Does it relocate the mystery?** Metaphysically, arguably yes. Critics (like Bradley or later Wittgenstein) might say "unsaturatedness" is a metaphor that masks a brute fact. *Why* does the concept saturate? If saturation is a kind of fitting, what guarantees the fit? However, Frege would reply that asking for an explanation of logical combination is a category mistake. You cannot explain the primitive rules of logic using logic.

  Frege's move is to assert that predication is *sui generis*. It is not a relation between two objects, but the application of a function to an argument. This stops the regress by changing the ontology of the predicate.

  ### 3. Russell: From Complexes to Multiple Relations

  Russell's trajectory shows a greater struggle with the problem.

  *   **Early Russell (e.g., *The Principles of Mathematics*):** Russell initially believed in objective propositions as complexes of objects and universals. The verb/relation provided the unity. This view is directly vulnerable to Bradley's regress. If the relation is a constituent of the proposition, what binds it to the other constituents? Russell eventually admitted this was a difficulty he could not solve within that framework.
  *   **Later Russell (Multiple-Relation Theory of Judgment):** In *The Problems of Philosophy* (1912) and subsequent work, Russell abolished the proposition as a single entity. Judgment is a multiple relation between a mind and several objects ($J(m, a, R, b)$).
  *   **Did this meet Bradley's objection?** Not really. The Multiple-Relation Theory (MRTJ) was primarily designed to solve the **problem of falsehood**. If propositions are real objects, what are false propositions? They seem to be "objective falsehoods," which is ontologically awkward. By making judgment a relation between a mind and objects, Russell eliminated false entities (there is no complex "$a R b$" if $a$ does not relate to $b$).
  *   **The Unity Problem in MRTJ:** While MRTJ sidesteps the existence of problematic propositional unities, it does not explain how the mind unifies the objects *in the correct order*. How does the judgment that "$a$ loves $b$" differ from "$b$ loves $a$" if the mind is simply related to a list $\{a, \text{loving}, b\}$? Russell had to posit that the mind supplies the "form" or direction. But this invites a new regress (famously pointed out by Wittgenstein): What ensures the mind applies the form correctly? If the mind relates to the objects via a relation, Bradley's problem returns inside the psychology of the subject.

  Russell's MRTJ was a solution to the status of falsehood that *looked* like a solution to unity, but it ultimately displaced the mystery of unity into the unexplained power of the mind to grasp logical form.

  ### 4. Verdict: Whose Treatment is Least Question-Begging?

  Between the two, **Frege's treatment of unity is less question-begging** regarding the specific mechanics of predication.

  **Justification:**

  1.  **Blocking the Category Mistake:** Bradley's regress arises when we treat the unifier (the relation/predicate) as the same kind of entity as the unified (the terms/objects). Russell, for most of his career, persisted in treating relations as universals that are constituents of complexes, which keeps the door open for the regress. Frege closes the door by insisting on a hard ontological distinction between Object and Concept. He argues that the regress only occurs if you misunderstand the logical grammar of predication. This is not merely relocating the mystery; it is diagnosing the error that creates the mystery.
  2.  **Avoiding Psychological Opacity:** Russell's later solution (MRTJ) shifts the burden of unity from the world to the mind. This is more question-begging because it relies on a "mind" that can somehow intuitively supply logical structure without itself requiring a structure (which would invite regress). Frege's "unsaturatedness" is a logical feature of the content itself, not a psychological act of synthesis. It is easier to accept a primitive logical distinction (function/argument) than a primitive psychological power (grasping form) as the foundation of unity.
  3.  **Honesty about Primitivity:** Frege acknowledges that logical combination cannot be analyzed further. He does not try to explain *how* saturation happens mechanistically; he asserts it is the nature of the concept. Russell tried to mechanize it (first through complexes, then through mental acts), and in doing so, generated more problems (false entities, logical form). Frege's refusal to explain the unexplainable is less question-begging than Russell's attempt to explain it via structures that themselves require explanation.

  **Conclusion:**

  Your friend who argued they are the same difficulty is right about the *structure*, but you are right that treating them as identical obscures the *solution*. Bradley uses the regress to deny relations; Frege uses a category distinction to save them. Frege's treatment is superior because it identifies the regress as a symptom of a grammatical error (treating predicates as names), whereas Russell's attempts (both early and late) treated the regress as an engineering problem to be solved by adding more structure (complexes or mental relations). Frege dissolves the knot; Russell tried to untie it and only tightened it.
