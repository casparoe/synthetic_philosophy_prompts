      *   **Goal:** 7-8 tough interview questions that force defense of the *mechanics* of the view, not just restatements. Avoid softballs.
      *   **Specific Topics Required:**
          1.  Calculation of "best" given compossibility (metric vs. label).
          2.  Privation theory of evil + God permitting sins baked into the optimal world.
          3.  Freedom ("motives incline without necessitating" + infinite analysis) vs. determinism.
          4.  Pre-established harmony (monads, no causation) vs. moral responsibility.
      *   **Format:** Each question needs a specific follow-up keyed to a likely dodge.
      *   **Tone:** Respectful but rigorous, suitable for a moderator who knows enough to ask sharp questions without pretending to be a scholar.

  2.  **Deconstruct the Philosophy (Leibnizian Mechanics):**
