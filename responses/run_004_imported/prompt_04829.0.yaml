      *   *Compossibility:* Not all good things can exist together. Worlds are sets of compossible substances.
      *   *Evil:* Privation (lack of good), metaphysical (imperfection), physical (suffering), moral (sin). God permits evil for a greater good, but doesn't will it directly.
      *   *Freedom:* Spontaneity (action from within), Intelligence (knowledge of ends), Contingency (opposite is possible). "Inclining without necessitating." Truths of fact vs. truths of reason. Infinite analysis required for contingent truths.
      *   *Pre-established Harmony:* Monads are windowless. They don't interact. God synced them at creation. Mind and body run in parallel.
      *   *Responsibility:* If I didn't cause my body to move (God did, via harmony), am I responsible?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Compossibility & The Metric.*
