          *   *Refinement:* Focus on "infinite analysis." If the predicate is in the subject, and God sees the whole series, where is the "could have done otherwise"?
          *   *Follow-up:* She might appeal to contingency. Counter: If the outcome is certain to an infinite mind, does the *mode* of certainty matter for the agent?

      *   *Topic 4: Pre-established Harmony & Responsibility.*
          *   *Draft:* If monads don't touch, who is responsible?
          *   *Refinement:* The "clock" analogy. If my will and my arm are just synced, did *I* move the arm?
          *   *Follow-up:* She might say "spontaneity." Counter: Spontaneity from within a script written at creation looks like puppetry.

      *   *Topic 5: The "Serious Moral Position" Claim.*
          *   *Draft:* Why should we take this seriously today?
          *   *Refinement:* Connect to modern optimization or AI. If an AI optimizes a function, is it Leibnizian?
          *   *Follow-up:* She might say "teleology." Counter: Teleology without feedback loops is just dogma.

      *   *Topic 6: Suffering vs. Variety.*
