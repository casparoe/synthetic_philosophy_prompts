answer: |-
  Here are nine questions designed to move past the introductory "Otto" summary and press on the specific philosophical vulnerabilities of the Extended Mind Thesis (EMT). They are ordered to build tension, starting with metaphysical objections and ending with the falsifiability question you requested.

  **1. The Coupling-Constitution Objection**
  "The most persistent charge against EMT is the coupling-constitution fallacy: just because a tool is causally linked to a cognitive agent doesn't mean it's *constitutive* of the cognition. A hammer is coupled to my arm when I drive a nail, but we don't say the hammer is part of my arm. What functional property does the notebook possess that the hammer lacks, which allows you to claim it's part of the *mind* rather than just part of the *environment*?"
  *(She'll likely argue that the hammer doesn't play the functional role of a belief-state—it isn't consulted to guide action in the same way a memory is—so the isomorphism fails.)*

  **2. Derived vs. Non-Derived Content**
  "There's a semantic worry here. The marks in Otto's notebook only have meaning because an agent interprets them; they have 'derived' content. But neural states seem to have 'non-derived' or intrinsic intentionality. If the notebook requires a homunculus to read it, haven't you just pushed the cognitive process back a step rather than extending it?"
  *(She'll probably counter that internal neural states also require interpretation by other neural states, so the 'intrinsic' distinction is a myth.)*

  **3. Cognitive Bloat**
  "If we accept the notebook, where is the principled stopping point? If reliability and trust are the metrics, why isn't the internet part of my mind? Why isn't the precinct's filing cabinet part of the detective's mind? If you deny this, are you not just arbitrarily privileging the size of the device over its functional role?"
  *(Expect her to lean on 'portability' and 'immediate accessibility'—the resource must be as easily reachable as a biological memory.)*

  **4. The 'Glue and Trust' Conditions (Meredith Specific)**
  "Clark specifies that for extension to hold, the external resource must be reliably available and automatically trusted. In my work, I'm tracking a character whose trust in her notebook is fraying; she checks it compulsively because she suspects it might be wrong. If the 'trust' condition becomes a site of anxiety rather than a background certainty, does the cognitive extension snap? Does the mind retract back into the skull?"
  *(She may suggest that extension is a gradient, not a binary switch, but admit that high-level doubt disrupts the functional integration.)*

  **5. Phenomenology of Recall**
  "Phenomenologically, retrieving a memory feels distinct from reading a note. One is an internal reconstruction; the other is perceptual input. If the 'what it is like' to think is fundamentally different in these two cases, does that qualitative difference undermine the claim that they are the same *kind* of process?"
  *(She will likely dismiss phenomenology as a poor guide to ontology, noting we don't 'feel' neurons firing either.)*

  **6. Plasticity and Reconstruction**
  "Biological memory is reconstructive; it changes every time we access it. A notebook entry is static until manually overwritten. If the external resource lacks the plasticity and malleability of the biological system it's supposed to extend, can it truly be said to be participating in the same cognitive ecology?"
  *(She'll argue that Otto updates his notebook, so the system as a whole is plastic, even if the paper isn't.)*

  **7. Agency and Responsibility**
  "If the notebook is part of the mind, then errors in the notebook are errors of the mind. But if someone else tampered with Meredith's notebook, would that count as 'tampering with her mind' in the same way as gaslighting or brainwashing? Does EMT expand the boundaries of moral violation?"
  *(She should agree, noting that this is actually a strength of the theory—it forces us to take external manipulation seriously.)*

  **8. Biological Chauvinism**
  "Is the resistance to EMT ultimately just a form of biological chauvinism? Are we clinging to the skull as a sacred boundary because we're uncomfortable with the idea that the 'self' is leaky and porous, rather than for any rigorous functionalist reason?"
  *(She'll likely say yes, that we are intuitively Cartesian even when we claim not to be.)*

  **9. Falsifiability (The Closer)**
  "Finally, I need to know what could actually kill the thesis. What empirical discovery or conceptual argument would force you to abandon the Extended Mind position? If the answer is 'nothing,' then this isn't a theory about the world, it's just a linguistic reframing. What counts as evidence against you?"
  *(This is the hard stop. She'll likely have to concede that if internal and external processes are proven to operate via fundamentally incompatible mechanisms, the functionalist analogy collapses.)*
