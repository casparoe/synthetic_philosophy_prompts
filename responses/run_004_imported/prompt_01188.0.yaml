  10. (Review against constraints): Keep it engaging, avoid jargon where possible, but don't dumb it down (user is a physicist).

  *(Self-Correction on Supervenience)*: Be careful not to say supervenience "solves" it. Philosophers debate whether supervenience implies reductionism. Physicalists say yes, non-reductive physicalists say no. I should present it as a tool for clarification, not a verdict.

  *(Final check on Weinberg)*: Weinberg admits we can't derive biology. His point is that the *principles* of biology are constrained by particle physics. Anderson says the *principles* of biology are constrained by organizational logic. That's the friction point.

