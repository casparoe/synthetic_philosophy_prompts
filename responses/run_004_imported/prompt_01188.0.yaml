      *   **Observation:** Anderson distinguishes between the *reductionist hypothesis* (everything is made of the same stuff) and the *constructionist hypothesis* (we can rebuild everything from those laws). Weinberg seems to agree on the practical impossibility but insists on the label "reductionist."
      *   **Question:** Is this just a verbal dispute/funding rivalry cynicism? Where is the *substantive* disagreement (ontology, epistemology, explanation)? Does "supervenience" resolve or clarify this?
