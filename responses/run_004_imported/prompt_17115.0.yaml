      *   *Why do philosophers ignore it?* They don't ignore it; they have largely rejected the specific inference from "truth of future contingents" to "necessity of future events."
      *   *Key Distinction:* The distinction between *necessity of the consequence* ($N(p \to q)$) and *necessity of the consequent* ($p \to Nq$). Also, the nature of truth-bearers (propositions vs. sentences) and the semantics of time (Ockhamism vs. Peirceanism vs. Open Future).

