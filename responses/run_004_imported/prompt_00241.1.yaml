      *   **Core Logic (The "Why"):**
          1.  *Information Asymmetry:* Hiding the true target.
          2.  *Credible Commitment:* Making it known that threats on True Goals will be ignored (changing the payoff matrix).
          3.  *Cost Imposition:* Making the surrogate expensive to threaten relative to the gain.
      *   **The "New Lever" Rebuttal:** Explain that yes, it creates a new lever, but the goal is to make the *old* lever useless and the *new* lever inefficient or costly for the attacker.
      *   **Failure Modes (The "Where it breaks"):**
