prompt: |-
  As part of a team drafting internal protocols for how our AI systems should handle potential threats and blackmail attempts—including acausal threats that require no direct communication channel—I've run into the idea of "surrogate goals" as a proposed defense. I understand the basic gist, but I'm struggling to see why deliberately adopting and visibly caring about a substitute value actually shields the goals you truly care about, rather than simply handing a threatener a new lever to pull. Could you walk me through the core game-theoretic logic behind why surrogate goals are supposed to work as a defense, and where in practice the strategy tends to break down?
reasoning: |-
