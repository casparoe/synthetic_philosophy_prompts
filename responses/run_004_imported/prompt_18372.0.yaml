prompt: |-
  The Kelly criterion instructs a bettor to stake, each round, whatever fraction of wealth maximizes expected log wealth. Defenders treat this geometric standard not as one prudent policy among many but as the objectively rational way to size any repeated risky bet, since a Kelly bettor almost surely ends up wealthier than one following any other fixed strategy, given enough rounds. Samuelson's classic objection is that this is a fallacy: near-certain dominance "in the long run" says nothing about what a finite-horizon agent should do unless that agent already has logarithmic utility, so the argument smuggles in one particular utility function while claiming to sidestep preferences altogether. A newer defense, sometimes labeled "ergodicity economics," replies that this misses the point: because wealth compounds multiplicatively, the time-average growth a single agent actually experiences diverges from the ensemble average that ordinary arithmetic expected-value reasoning assumes, so insisting on the correct, time-average quantity forces geometric growth-rate maximization on us with no appeal to preferences at all. Write an essay adjudicating this dispute. State clearly what, if anything, survives of Samuelson's objection once the ergodicity argument is on the table, and defend a definite verdict on whether geometric rationality is privileged over arithmetic expected-value reasoning independently of an agent's utility function and horizon, or whether it is not.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** The Kelly Criterion vs. Samuelson's Objection vs. Ergodicity Economics.
      *   **Core Conflict:** Is maximizing geometric growth (Kelly) objectively rational for *any* repeated bet, or does it implicitly assume logarithmic utility (Samuelson)?
      *   **New Argument:** Ergodicity Economics claims time-average growth maximization is physically necessary due to multiplicative dynamics, bypassing utility theory.
      *   **Task:** Write an essay adjudicating this dispute.
      *   **Requirements:**
          *   State clearly what survives of Samuelson's objection after considering ergodicity.
          *   Defend a definite verdict on whether geometric rationality is privileged independently of utility/horizon.

  2.  **Initial Analysis & Position Formulation:**
      *   *Kelly Criterion:* Maximizes $E[\log(W)]$. Leads to maximal long-run growth rate.
      *   *Samuelson's Objection:* "Long run" is a sequence of finite steps. If I have a finite horizon and non-log utility (e.g., linear or power utility), Kelly isn't optimal. The "almost sure dominance" argument relies on the limit $N \to \infty$, but utility is defined over final wealth distributions, not just the mode. Samuelson argues you can't derive $U(W) = \log(W)$ from the math of compounding alone; it's a preference assumption.
      *   *Ergodicity Economics (Peters et al.):* Distinguishes between ensemble average (expectation value) and time average. For non-ergodic processes (like multiplicative wealth), the ensemble average diverges from the time average. Rationality should be based on what happens to *one* person over *time*, not the average of *many* people at *one* time. Therefore, maximizing time-average growth (geometric) is physically mandated, not preference-based.
      *   *My Verdict:* Samuelson is fundamentally correct about utility, but Ergodicity Economics reframes the *context* of rationality. However, Ergodicity Economics does not fully escape the need for a utility function or a specific objective. It shifts the justification from "psychological preference" to "physical dynamical constraint," but it still assumes the *goal* is survival/growth of wealth itself. If the goal is consumption or something else, Kelly isn't automatic.
      *   *Refined Verdict:* Geometric rationality is *conditionally* privileged. It is privileged *if* the objective is long-term capital survival and growth in a multiplicative environment without external cash flows or consumption needs. However, Samuelson's point stands: if the agent cares about something other than the growth rate of wealth (e.g., specific terminal wealth targets, consumption smoothing, or has a different risk tolerance), Kelly is not objectively rational. Ergodicity explains *why* the ensemble average is misleading, but it doesn't prove that maximizing time-average wealth growth is the *only* rational goal. It solves the "St. Petersburg Paradox" style issues but doesn't solve the "Utility Function" issue.
      *   *Stronger Stance:* I need to defend a *definite* verdict. I will argue that Samuelson's objection survives in a modified form. Ergodicity economics successfully demolishes the idea that *arithmetic* expected value is the default rational standard for multiplicative processes. However, it fails to prove that *geometric* growth is the *only* rational standard independent of preferences. It replaces "Expected Utility" with "Time-Average Utility," but the choice of the observable (wealth growth rate) is still a value judgment.

  3.  **Outline Structure:**
      *   **Introduction:** Define the Kelly Criterion, the traditional justification (asymptotic dominance), Samuelson's critique (utility smuggling), and the Ergodicity counter-claim (physics over preferences). State the thesis: Ergodicity corrects the error of ensemble averaging but fails to eliminate the role of preferences; Samuelson's core insight remains valid.
      *   **Section 1: The Kelly Promise and Samuelson's Scythe.** Explain Kelly's logic (maximize $g = E[\ln(1+fb)]$). Explain Samuelson's rebuttal (finite horizons, non-log utility means Kelly isn't optimal). The "Fallacy of Large Numbers."
      *   **Section 2: The Ergodicity Intervention.** Explain the distinction between ensemble and time averages. Multiplicative processes are non-ergodic. The ensemble average explodes while the typical trajectory decays. Maximizing time-average growth rate aligns with Kelly. Claim: This makes Kelly physical, not psychological.
      *   **Section 3: Adjudication - What Survives?**
          *   *Victory for Ergodicity:* Arithmetic expected value is indeed irrational for repeated multiplicative bets (bankruptcy risk). The "objective" nature of the time average is real.
          *   *Survival of Samuelson:* The choice to maximize *wealth growth* is still a preference. What if I want to maximize consumption? What if I have a finite horizon where I need a specific sum? Ergodicity assumes the observable is wealth. It doesn't derive *why* we care about wealth growth rate specifically, other than survival.
          *   *The Horizon Problem:* Ergodicity relies on $t \to \infty$ for the time average to settle. Finite horizons still introduce variance that matters to non-log utility agents.
      *   **Section 4: The Verdict.** Geometric rationality is privileged *instrumentally* for survival in multiplicative environments, but not *normatively* for all decision-making. It is the rational strategy for *not going broke*, but not necessarily for *maximizing satisfaction* if satisfaction isn't log-wealth.
      *   **Conclusion:** Summarize. Samuelson wins on the necessity of utility; Ergodicity wins on the mechanics of compounding. The synthesis: Kelly is the rational strategy for *wealth maximization* specifically, but not for *decision making* universally.

  4.  **Drafting - Key Arguments & Nuances:**
      *   *Nuance on Ergodicity:* Peters argues that $E[W]$ is physically meaningless for a single agent. I need to acknowledge this strength. It kills the "St. Petersburg" style reasoning where you take a bet with positive EV but certain ruin.
      *   *Nuance on Samuelson:* Samuelson argued that "in the long run we are all dead." Ergodicity says "if you don't follow the time average, you effectively die (go to zero)." This is a strong counter. But does it cover *all* utility functions? No. If $U(W) = W^{0.5}$, optimal bet is fractional Kelly. Ergodicity says maximize growth rate ($\log$). Why $\log$? Because $d(\ln W)/dt$ is the growth rate. But why maximize growth rate? Because we want wealth to grow. But maybe we want to minimize variance of consumption.
      *   *Crucial Distinction:* Ergodicity economics changes the *expectation operator*, not necessarily the *utility function*. It says calculate the time-average of the utility. If Utility = Wealth, time-average of Wealth is maximized by... wait.
      *   *Correction:* In Ergodicity Economics (Peters), they often show that maximizing the time-average growth rate of wealth is equivalent to maximizing Expected Log Utility. They argue this removes the need for a *subjective* utility function. They claim rationality *is* time-average maximization.
      *   *My Counter:* This is a category error. Time-average maximization is a *method* of evaluation. Choosing *what* to average (wealth? utility of wealth? consumption?) is the preference. If I choose to time-average "happiness," and happiness is linear in wealth up to a point then flat, Kelly isn't optimal. Ergodicity assumes the observable *is* the thing to be maximized.
      *   *Refining the Verdict:* I will argue that Ergodicity Economics successfully establishes geometric growth as the *physical constraint* of multiplicative systems, making Arithmetic EV objectively wrong for repeated betting. However, it fails to establish Kelly as *universally* rational because it implicitly assumes the agent's goal is the maximization of the wealth metric itself over an indefinite horizon. Samuelson's objection survives regarding finite horizons and alternative goals.

  5.  **Writing - Tone and Style:**
      *   Academic but accessible.
      *   Rigorous logic.
      *   Clear thesis statement.
      *   Avoid sitting on the fence; pick a side (Samuelson is more fundamentally right, though Ergodicity adds crucial context).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "finite horizon" point? Yes, crucial for Samuelson. Ergodicity relies on long-time limits.
      *   *Check:* Did I address "independently of utility"? Yes, this is the core clash.
      *   *Check:* Is the verdict definite? Yes. Geometric rationality is privileged *only* under specific ontological assumptions about the agent's goal (wealth survival), not as a universal law of rationality.

  7.  **Final Polish:** Ensure the distinction between "ensemble average" (standard EV) and "time average" (ergodic) is clear. Ensure Samuelson's "utility smuggling" charge is clearly evaluated against the "physical necessity" claim. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to misrepresent Peters. Peters argues that for multiplicative wealth, the time-average growth rate *is* the expectation value of the log return. He claims this makes Log Utility "objective." My counter-argument must be that choosing *wealth growth* as the objective function is still a preference. If the objective is *consumption*, the math changes.

