answer: |-
  **The Physics of Fortune: Adjudicating the Kelly-Samuelson-Ergodicity Dispute**

  The question of how to size a bet is often presented as a technical problem in probability, but it is fundamentally a question of rationality. The Kelly criterion, which dictates staking a fraction of wealth to maximize the expected logarithm of wealth, has long been championed as the mathematically optimal strategy for repeated investing. Proponents argue that it guarantees asymptotic dominance over any other strategy. Paul Samuelson, the Nobel laureate, famously dismantled this claim, arguing that "long-run" dominance is irrelevant to finite agents and that Kelly implicitly assumes a logarithmic utility function while pretending to be preference-free. Recently, a new school of "ergodicity economics" has revived the Kelly defense, arguing that the discrepancy between Kelly and standard expected value is not a matter of psychology, but of physics: in multiplicative systems, time averages diverge from ensemble averages, making geometric growth maximization a physical necessity rather than a subjective preference.

  This essay adjudicates this tripartite dispute. It argues that while ergodicity economics successfully demolishes the rationality of arithmetic expected value in multiplicative environments, it fails to fully vindicate the Kelly criterion as a universal, preference-free imperative. Samuelson's core objection survives: geometric rationality is privileged only instrumentally, for agents whose specific goal is the long-term survival and growth of capital, but it cannot claim to be the objectively rational strategy for all agents independently of their utility functions and time horizons.

  **The Kelly Promise and Samuelson's Scythe**

  To understand the dispute, one must distinguish the mechanics of the Kelly criterion from its justification. Mechanically, Kelly sizing maximizes the geometric growth rate of wealth. In a repeated bet with positive expected value, a Kelly bettor's wealth will, with probability approaching one, exceed that of a bettor using any other fixed fraction, given a sufficiently large number of rounds. This "almost sure dominance" is the traditional shield of Kelly defenders.

  Samuelson's objection cuts through this shield by attacking the relevance of the limit. He argued that the "long run" is a misleading conceptual trap. For any finite horizon $N$, no matter how large, there is a non-zero probability that a Kelly bettor will underperform a more conservative (or even aggressive) strategy. More importantly, Samuelson noted that the Kelly criterion is mathematically equivalent to maximizing Expected Utility only if the utility function is $U(W) = \ln(W)$. If an agent has linear utility ($U(W) = W$) or power utility ($U(W) = W^\alpha$), the Kelly fraction is not optimal. By insisting that agents *should* maximize geometric growth, Kelly proponents are smuggling in a specific risk preference (logarithmic) while claiming to derive it from the mathematics of compounding alone. For Samuelson, rationality is defined by consistency with preferences, not by asymptotic wealth dominance.

  **The Ergodicity Intervention**

  Ergodicity economics, spearheaded by Ole Peters, attempts to bypass Samuelson's utility argument entirely. It posits that standard expected value reasoning relies on an *ensemble average*: imagining many parallel universes where the bet is taken once and averaging the outcomes. However, a real agent lives in *one* universe through *time*. For additive processes (like winning a fixed dollar amount), the time average and ensemble average converge (the system is ergodic). For multiplicative processes (like percentage returns on wealth), they diverge (the system is non-ergodic).

  In a multiplicative game, the ensemble average wealth may grow exponentially, driven by a vanishingly small fraction of paths with astronomical returns, while the *typical* path (the time average) leads to ruin. Ergodicity economists argue that because an agent cannot access the ensemble average, rational decision-making must maximize the time-average growth rate. Mathematically, maximizing the time-average growth rate of wealth yields the exact same sizing as the Kelly criterion. Thus, they claim, Log Utility is not a psychological assumption but a physical consequence of the dynamics. The argument is that we do not choose to maximize geometric growth because we are risk-averse; we do so because arithmetic growth is a physical illusion in compounding systems.

  **Adjudication: What Survives of Samuelson?**

  The ergodicity argument represents a significant advance in understanding the pathology of expected value reasoning. It correctly identifies that using arithmetic expected value for repeated multiplicative bets is an error of category, not just risk tolerance. If an agent maximizes arithmetic EV in a multiplicative environment, they are optimizing for a quantity (ensemble wealth) that they will almost certainly never experience. In this specific regard, ergodicity economics validates the Kelly mechanism as the correct way to handle compounding dynamics. It establishes that geometric growth is the *observable* reality for a single trajectory.

  However, Samuelson's objection survives the ergodicity critique in two critical dimensions: the definition of the observable and the problem of the horizon.

  First, ergodicity economics solves the problem of *which expectation operator to use* (time vs. ensemble), but it does not solve the problem of *what observable to maximize*. The ergodic argument assumes that the quantity subject to time-averaging is wealth itself (or the growth rate of wealth). But why must wealth be the objective function? Rationality involves mapping states of the world to preferences. If an agent's utility derives from consumption, and consumption cannot be reinvested multiplicatively, the dynamics change. If an agent has a specific liability due in five years, the infinite-time limit assumed by ergodicity is irrelevant. By asserting that maximizing the time-average growth rate of *wealth* is the definition of rationality, ergodicity economics implicitly imposes a preference for indefinite capital accumulation. This is, effectively, a utility function ($U(W) = \ln W$) disguised as a physical law. Samuelson was right that you cannot derive an "ought" (maximize growth) from an "is" (multiplicative dynamics) without a bridge of preference (I want to maximize growth).

  Second, the ergodic argument relies on the limit $t \to \infty$ for the time average to equal the expected growth rate. In any finite horizon, the distribution of outcomes around the time-average growth rate has variance. For an agent with a finite horizon, this variance matters. A agent with linear utility over terminal wealth might rationally choose a higher-variance strategy that has a lower geometric growth rate but a higher arithmetic expectation, accepting the risk of ruin for a chance at a massive payout. Ergodicity labels this "irrational" because it deviates from the time-average optimal path, but Samuelson would correctly label this "consistent" with the agent's linear preferences. The ergodic argument proves that deviating from Kelly reduces the *typical* outcome, but it does not prove that the *typical* outcome is the only thing a rational agent should care about.

  **Verdict**

  The verdict on whether geometric rationality is privileged independently of utility and horizon must be negative. Geometric rationality is not a universal law of decision-making; it is the specific solution to the specific problem of long-term capital survival in a multiplicative environment.

  Ergodicity economics successfully demonstrates that arithmetic expected-value reasoning is objectively flawed for repeated multiplicative bets because it describes a reality inaccessible to the individual agent. In this sense, it rescues the Kelly criterion from the charge of being merely "one strategy among many" for *growth-oriented* investors. It shows that Kelly is the unique strategy that aligns the agent's expectation with their experienced reality over time.

  However, Samuelson's objection remains the superior philosophical framework. Rationality is the optimization of preferences subject to constraints. Ergodicity economics identifies a crucial constraint (non-ergodicity) that makes arithmetic EV a poor proxy for future experience, but it erroneously elevates the constraint into a preference. It assumes that because wealth compounds multiplicatively, agents *must* desire the maximization of that compounding. They do not. An agent may prefer a high probability of doubling their money in a year (requiring over-betting Kelly) over a near-certainty of outperforming the market in a century (requiring Kelly).

  Therefore, geometric rationality is privileged *instrumentally* but not *normatively*. It is the rational strategy *if* the goal is to avoid ruin and maximize wealth over an indefinite horizon. But it is not the rational strategy *simpliciter*. Samuelson was correct that the choice to maximize geometric growth is a value judgment—a preference for log-wealth—no matter how physically grounded the dynamics of compounding may be. The ergodicity argument clarifies the physics of the casino, but it cannot dictate the psychology of the gambler. To claim otherwise is to commit the naturalistic fallacy, confusing the behavior of wealth with the goals of the owner.
