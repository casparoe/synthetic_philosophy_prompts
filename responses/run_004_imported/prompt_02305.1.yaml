answer: |-
  You have stumbled onto a genuinely fascinating philosophical and linguistic problem. You are absolutely right to notice that the *facts* are not in dispute, only the *classification* of those facts.

  To answer your core question: **No, there is no objective, universal fact of the matter on whether he "cheated," because "cheating" is not a physical object like a rock or a tree. It is a social contract.**

  However, that doesn't mean the argument is pointless or that there isn't a "right" side in this specific context. Here is a breakdown of what is actually happening in this argument, why it feels like there is an objective truth, and how you actually settle a dispute like this.

  ### 1. Semantic Dispute vs. Substantive Dispute
  In logic and philosophy, there is a distinction between a *semantic dispute* (arguing about the definition of a word) and a *substantive dispute* (arguing about values or facts).

  Your friend group is stuck in a semantic dispute that is masking a substantive one.
  *   **The Boyfriend's Definition:** Cheating = Physical sexual contact. (A technical, minimalist definition).
  *   **Priya's Definition:** Cheating = Violation of emotional and romantic exclusivity. (A holistic, relational definition).

  If this were an argument about whether a tomato is a fruit or a vegetable, it would be pointless. It's botanically a fruit, but culinarily a vegetable. It doesn't matter which word you use as long as you know what you're eating.

  But "cheating" is not a tomato. It is a **moral label**. It carries consequences (guilt, breakup, loss of trust). When the boyfriend says, "I didn't cheat," he isn't just categorizing an action; he is making a moral claim that says, *"I have not violated our agreement, therefore you are not justified in being hurt."*

  Priya isn't just arguing about a dictionary definition; she is arguing that **the label "cheating" is the only word that accurately describes the betrayal she feels.**

  ### 2. Why It Feels Like There Is an "Objective" Right Side
  You asked why this doesn't feel like a pointless argument over wording. It feels like one side is objectively wrong because of **Implicit Social Contracts.**

  In our culture, the default setting for a "boyfriend/girlfriend" relationship is monogamy. While people argue about what monogamy means, the *standard social norm* includes emotional exclusivity.
  *   **The "Reasonable Person" Standard:** If you asked 100 random people in committed relationships, "Is it okay for your partner to FaceTime another person every night and go on dates while you are out of town?" the vast majority would say "No."
  *   **Retroactive Rule-Making:** The boyfriend is trying to define the rules *after* the game was played. In any contract (legal or social), if a boundary isn't explicitly discussed, the "default norms" apply. By relying on a technicality ("we didn't touch"), he is attempting to rewrite the implicit contract of his relationship to excuse his behavior.

  It feels like there is an objective truth because **he violated a norm that he likely knew existed.** If he truly believed it was innocent friendship, he likely wouldn't have waited until Priya was out of town to do it, nor would he feel the need to defend it so vigorously. The defensiveness proves he knows he crossed a line, even if he won't admit the *name* of the line.

  ### 3. Why the Psych Teacher Dodged
  Your teacher dodged because psychology is a descriptive science (describing how things *are*), but "cheating" is a normative concept (describing how things *ought to be*).
  *   A psych teacher can tell you *why* Priya feels hurt (attachment theory, betrayal trauma).
  *   They can tell you *why* the boyfriend is rationalizing (cognitive dissonance).
  *   But they cannot tell you if he cheated, because that is an ethical/sociological judgment, not a scientific fact. There is no MRI scan that lights up for "cheating."

  ### 4. How to Settle This Type of Argument
  Since you can't look up "cheating" in a law book, you settle this by shifting the argument from **Definitions** to **Expectations.**

  Here is the framework for resolving this specific logical deadlock:

  **A. The "Transparency Test"**
  Ask the boyfriend: *"If Priya had been sitting next to you during the FaceTime calls, or if she had walked into the boba shop while you were there, would you have been comfortable introducing the girl as 'just a friend' in front of Priya?"*
  *   If the answer is "No" or "It would have been awkward," then the secrecy confirms the violation. Secrecy is often a stronger indicator of cheating than physical contact.

  **B. The "Intent vs. Impact" Shift**
  The boyfriend is arguing from **Intent** ("I didn't mean to cheat"). Priya is arguing from **Impact** ("I feel betrayed").
  *   In relationships, Impact overrides Intent. If you accidentally break someone's vase, you didn't *intend* to break it, but you still broke it. You still owe them a new vase.
  *   To settle the argument, Priya needs to stop asking him to admit he "cheated" and start saying: *"Regardless of the word, you prioritized another woman's emotional needs over mine, you hid the extent of it, and it damaged my trust. We need to fix the damage, not the dictionary."*

  **C. The "Veil of Ignorance"**
  This is a philosophical concept by John Rawls. To find the fair rule, you have to imagine you don't know who you are in the scenario.
  *   If the boyfriend and Priya swapped places, and Priya was FaceTiming a guy every night and going on dates while the boyfriend was away, would the boyfriend say, "That's fine, it's just friendship"?
  *   If he would be hurt by it, then his current argument is hypocritical, and the "rule" of the relationship has been broken.

  ### The Verdict on Your Question
  **Is it a real question with a real answer?**
  No, not universally.
  **Is there a right side in this specific instance?**
  Yes.

  Here is why: Relationships are defined by **mutual agreement.** If one person feels the boundary has been crossed, and the other person insists on a technicality to dismiss that feeling, the relationship agreement is broken.

  The boyfriend is arguing that "Cheating" is a specific list of physical acts.
  Priya is arguing that "Cheating" is a breach of trust and exclusivity.

  In the context of a romantic relationship, **Priya's definition is the functional one.** A relationship exists in the emotional space between two people. If you outsource the emotional intimacy (nightly calls) and the romantic courtship (dates/boba) to a third party, you have vacated your role as the partner, regardless of whether genitals were involved.

  **How to stop the stress in your friend group:**
  Tell them to stop debating the word "cheating." It's a red herring. The debate should be: **"Did he violate the reasonable expectations of exclusivity in this relationship?"**

  If they agree that he violated the expectations, then the word "cheating" is just a label they can choose to apply or not. But if they agree he violated the expectations, Priya is validated, and the boyfriend has to take responsibility for the breach of trust, not the definition of the word.
