  okay so my friend group has been arguing about this for like a week now and its kind of stressing me out. My friend Priya's boyfriend has been texting this one girl from his econ class every day, they facetime almost every night, and he took her out for boba while Priya was out of town visiting her grandma (he swears it was "just as friends" and nothing physical ever happened). Priya thinks this is obviously cheating and is really hurt, but her boyfriend keeps saying he didnt cheat because cheating means doing something physical with someone else, and this was just an emotional/friendship thing so it doesnt count. We even brought it up during a discussion in psych class and even my teacher kind of dodged the question lol.

  Heres the part thats actually messing with my head though: when you listen to both of them, they dont disagree about anything that actually happened. Priya and her boyfriend both 100% agree on the texting, the calls, the boba, literally all of it. The only thing they disagree about is whether all that stuff deserves to be called "cheating." So did he actually cheat or not? Is that even a real question with a real answer, or is it just an argument about how to use a word? And if it really does come down to definitions, why does it still feel like there's an obviously right side, and not just a pointless argument over wording? I don't need generic relationship advice — I actually want to understand whats going on in an argument like this, and maybe how you would even go about settling it.
