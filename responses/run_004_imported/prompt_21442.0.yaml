answer: |-
  # The Appointment Book: Why Death in Damascus Breaks Rationality

  The story is old, but the terror is fresh. You are in Damascus. You see Death in the marketplace. He looks surprised to see you, which is unsettling enough, but then he speaks: "I am coming for you tomorrow."

  Panic sets in. You know Death keeps an appointment book, written weeks in advance, based on a near-perfect prediction of where you will be. If the book says "Damascus," he will be in Damascus. If it says "Aleppo," he will be in Aleppo. To survive, you must be where the book does not say you will be.

  Naturally, you buy a camel and ride for Aleppo. You arrive exhausted but relieved, only to find Death waiting for you. "I knew you'd come," he says. "My appointment was in Aleppo all along."

  This is "Death in Damascus," a decision theory puzzle that dwarfs the famous Newcomb's Problem in its capacity to expose the cracks in our understanding of rational choice. While Newcomb's Problem is a tug-of-war between two theories, Death in Damascus is a whirlpool that swallows one of them whole. It demonstrates that Causal Decision Theory (CDT) doesn't just give the wrong answer here; it fails to generate *any* stable answer at all.

  To understand why this matters, and what you should actually do when Death comes knocking, we have to look at why the logic of "cause and effect" collapses when the future is already written in the past.

  ### The Newcomb Distraction

  To see why Damascus is the superior test case, we must briefly look at Newcomb's Problem. In Newcomb, a Predictor puts \$1 million in a box if he predicts you will take only that box. Causal Decision Theory says: "The money is already there or it isn't. My choice now doesn't causally change the past. I should take both boxes to guarantee the extra \$1,000."

  CDT is confident here. It gives a clear, stable recommendation: Two-box. You can argue it's wrong (and many do), but the theory doesn't stutter. It calculates the causal impact, finds it to be zero, and moves on.

  Death in Damascus is different. It doesn't just challenge CDT's conclusion; it breaks its engine.

  In the Damascus scenario, CDT insists that your choice cannot *cause* Death's location. The appointment book is already written. Therefore, CDT tells you to evaluate your options based on the probability of Death's location *independent* of your choice.

  Here is where the instability begins. Suppose you lean toward going to Aleppo. As soon as you form that intention, you acknowledge that Death is a near-perfect predictor. Therefore, your intention to go to Aleppo is strong *evidence* that the appointment book says "Aleppo." If the book says "Aleppo," Death is in Aleppo. If Death is in Aleppo, your expected utility for going to Aleppo drops to zero (death). Consequently, you should go to Damascus.

  But wait. If you decide to go to Damascus, your intention is now evidence that the book says "Damascus." Therefore, Death is in Damascus. Your expected utility for Damascus drops to zero. You should go to Aleppo.

  CDT enters an infinite loop. It cannot settle on a decision because every pure strategy undermines its own expected utility the moment it is considered. In Newcomb's Problem, CDT is a stubborn mule; in Death in Damascus, it is a dog chasing its tail.

  ### The Evidential Alternative

  If CDT creates a feedback loop of paralysis, how does Evidential Decision Theory (EDT) handle it? EDT argues that you should choose the action that provides the best *news* about the world. You care about the correlation, not just the causation.

  EDT sees the link immediately: Going to Aleppo is evidence you will die. Going to Damascus is evidence you will die. A strict EDT agent looks at the conditional probabilities—$P(\text{Death} | \text{Aleppo})$ and $P(\text{Death} | \text{Damascus})$—and sees that both are near 100%.

  EDT avoids the oscillation of CDT because it accepts the correlation as fixed. However, it leads to a different kind of failure: fatalism. If both options lead to death, EDT offers no preference. It leaves the agent shrugging in the marketplace. While EDT is more stable than CDT here, it offers no path to survival. It treats the prediction as a prison wall rather than a puzzle to be solved.

  ### The Verdict: Flip a Coin

  So, we have a theory that oscillates into madness (CDT) and a theory that shrugs into fatalism (EDT). What should you actually do?

  We must commit to an answer. When faced with a near-perfect predictor in a Death in Damascus scenario, **you should randomize your choice.** You should flip a coin.

  This recommendation relies on a refinement of decision theory known as **Ratificationism**. A decision is rational only if, once you have made it, you do not regret it given that you made it. In technical terms, the decision must be a "stable equilibrium."

  Pure strategies (always Aleppo or always Damascus) are not ratifiable. If you decide "I will definitely go to Aleppo," you immediately realize that this certainty makes Aleppo the deadly choice. You regret the decision before you even act.

  However, a **mixed strategy** (randomization) is ratifiable. If you decide, "I will let a coin flip decide," you break the deterministic link that the predictor relies on. Now, consider the predictor's position. He is *near*-perfect, not omnipotent. If you commit to a 50/50 randomization, the predictor cannot know with certainty where you will be. He must guess. If he guesses Aleppo, you survive 50% of the time (when the coin lands Damascus). If he guesses Damascus, you survive 50% of the time.

  By randomizing, you maximize your entropy. You force the predictor to play a game of chance rather than a game of logic. Even if the predictor is perfect and knows the outcome of the coin flip in advance, randomization is still the only move that acknowledges the logical structure of the problem without falling into the CDT oscillation trap. It is the only decision state where, after making the decision to randomize, you cannot say, "I should have decided differently." If you decided to be deterministic, you would regret it. If you decide to be random, you have done the maximum possible to evade a logical trap.

  ### Why This Matters

  You might argue that if Death is truly perfect, a coin flip is predicted too, and you die anyway. This is true. But decision theory is not about winning impossible games; it is about using the correct algorithm for reasoning.

  CDT fails because it treats your decision as an isolated causal event, severed from the prediction that mirrors it. It assumes you can choose independently of the factors that predict your choice. Death in Damascus proves this assumption is false. Your decision process *is* the input for the prediction.

  By committing to randomization, you are not trying to causally change the past (which is impossible). You are acknowledging that your decision algorithm is part of the logical fabric of the universe. If your algorithm is "Always Aleppo," the universe writes "Aleppo" in the book. If your algorithm is "Flip a Coin," the universe must account for that probability.

  In the end, the man in the marketplace should not buy a camel based on a hunch, nor should he stand still based on fatalism. He should flip a coin. Not because it guarantees life, but because it is the only choice that remains rational even after you know you've made it. In a world where your choices are predicted, the only freedom you have left is the freedom to be unpredictable.
