answer: |-
  Here are ten interview questions designed to navigate around her standard defense while pressing on the structural weaknesses of the benign-circularity view. Each includes a follow-up tailored to anticipate her likely appeal to "impossible skeptical demands."

  ### 1. The Lottery Disanalogy
  "In standard lottery cases, we agree that a very high statistical probability—say, one in a million—isn't enough for knowledge; you can't know your ticket will lose just from the base rate. But on your view, checking a fuel gauge repeatedly *does* yield knowledge of its reliability, even though the support structure looks probabilistically similar: you're inferring reliability from a sequence of accurate readings. Why is the lottery inference defective while the bootstrapping inference is benign? Is there a structural disanalogy, or do you think we *can* know lottery propositions too?"

  *   **Follow-up:** "If you say the disanalogy lies in the causal connection between the gauge and the fuel, aren't you just asserting the reliability you're trying to prove? And if you say we *can* know lottery propositions, doesn't that collapse the distinction between statistical evidence and normative justification entirely?"

  ### 2. The Malignant/Benign Line and Closure
  "You distinguish malignant from benign circularity, but critics worry that allowing *any* self-supporting use of a faculty forces you to abandon the closure principle—that justification transfers across known entailment. If I can bootstrap the reliability of perception, can I also bootstrap the reliability of a crystal ball if I assume it's reliable to start? Where exactly does the line fall, and does drawing it anywhere require you to reject closure to avoid sliding into full-blown coherentism?"

  *   **Follow-up:** "If you want to keep closure, you seem forced to admit that *any* coherent system can validate itself. If you reject closure to save the distinction, aren't you accepting the same cost as the skeptics you're arguing against, just at a different stage of the argument?"

  ### 3. Relation to Wright's Entitlement
  "Crispin Wright's 'entitlement' project also attempts to block the skeptic by allowing us to accept certain presuppositions without evidence. Is your account of benign circularity essentially the same project under a different name, or do you see a substantive divergence? Specifically, does entitlement solve the same problem your story solves, or is it a patch for a problem your view claims doesn't exist?"

  *   **Follow-up:** "Wright explicitly sacrifices closure to make entitlement work. If you claim to preserve closure while allowing self-support, aren't you trying to have your cake and eat it too? What mechanism allows you to avoid Wright's sacrifice?"

  ### 4. Diachronic Accumulation
  "If bootstrapping is a legitimate way to gain justification for reliability, does that justification accumulate? If I check the fuel gauge ten times, do I have *more* reason to trust it than if I check it twice? If yes, doesn't that make it indistinguishable from standard inductive confirmation? If no, why does the first instance grant knowledge if repetition adds nothing?"

  *   **Follow-up:** "If you say it accumulates, you're admitting bootstrapping is just induction without independent premises, which is the very thing critics call question-begging. If you say it doesn't accumulate, then the 'knowledge' you claim to get seems inexplicably static."

  ### 5. Conflicting Bootstraps
  "Imagine two agents: one bootstraps their visual perception, concluding it's reliable; the other bootstraps a 'counter-perception' faculty that tells them the world is an illusion. Both follow your benign circularity model internally. Is there a fact of the matter about who is justified, or does your view imply that justification is relative to the faculty being used? If the former, how do you adjudicate without stepping outside the circle?"

  *   **Follow-up:** "If you say the visual perceiver is justified because vision is *actually* reliable, aren't you smuggling in the externalist condition that makes the internal reasoning process irrelevant? If so, why does the reasoning matter at all?"

  ### 6. The "Malignant" Test Case
  "To make the benign/malignant distinction robust, we need a clear case of malignant circularity that your view rules out. Can you give me a concrete example of a self-supporting argument that *fails* to generate justification on your account? If every instance of using a faculty to check itself counts as benign, isn't the label 'malignant' doing no work?"

  *   **Follow-up:** "If your only example of malignant circularity is a case where the faculty is actually unreliable, then your distinction collapses into a simple truth condition. But if a false belief can be justified, why can't a falsely trusted faculty be justified in trusting itself?"

  ### 7. The Moorean Shift
  "Your position seems to mirror G.E. Moore's 'Here is a hand' argument: asserting the conclusion of an anti-skeptical argument on the basis of the premises provided by the very faculty in question. Is your view essentially a modernized Mooreanism applied to reliability? If so, does it inherit the criticism that Mooreanism changes the subject rather than answering the skeptic?"

  *   **Follow-up:** "Mooreans often say the skeptic's premises are less certain than the conclusion. But in bootstrapping, the conclusion (the gauge is reliable) feels *less* certain than the premises (the gauge reads 'F' and the tank is full). Why should we reverse that intuitive ordering?"

  ### 8. High-Stakes Action
  "Suppose I've bootstrapped my car's fuel gauge and know it's reliable. Now I'm driving through a desert, and running out of fuel means death. Am I rational to act on that bootstrapped knowledge in the same way I would if I'd had the gauge mechanically tested? If not, doesn't that suggest the justification you've described is too weak to count as knowledge in practical contexts?"

  *   **Follow-up:** "If you say the justification is the same but the stakes change the rationality, you're endorsing pragmatic encroachment. But if the stakes reveal the justification is weak, doesn't that confirm the intuition that bootstrapping *was* cheating, just in a way that only shows up under pressure?"

  ### 9. Transparency and Awareness
  "Does the subject need to be aware that they are bootstrapping for the justification to work? If I unconsciously check the gauge against the tank repeatedly, do I gain knowledge of reliability? If awareness is required, doesn't recognizing the circularity undermine the justification? If it isn't required, is this really an epistemic story or just a causal one?"

  *   **Follow-up:** "If awareness undermines it, then your view only works for subjects who are philosophically naive. That makes epistemic justification depend on ignorance, which seems like a high cost for avoiding the 'impossible demand' of the skeptic."

  ### 10. The Phenomenology of "Cheating"
  "Even if we grant that the demand for source-independent verification is too high, there remains a persistent phenomenological intuition that bootstrapping feels like cheating. If your view is correct, why does reasoning this way feel epistemically illicit to competent agents? Is the feeling just a bug in our cognitive software, or does it track a normative reality your account misses?"

  *   **Follow-up:** "If you say it's just a bug, you're dismissing a widespread philosophical intuition as an error. But if it tracks a normative reality, what is that reality? Is there a norm of 'non-circularity' that you're violating, even if you're not violating a norm of 'truth-conduciveness'?"
