answer: |-
  You are absolutely right, and your friend is wrong. What you are describing is not only rational, it is mathematically sound and even has a famous name in philosophy.

  Your friend is falling for a common intuition trap regarding how probability works. Here is the breakdown of why your thinking makes perfect sense.

  ### 1. The Math: Compounding Uncertainty
  The core issue is that probabilities multiply, they don't add up.

  Let's say your confidence level is exactly **90%** (0.9) for each question. That is a very high confidence level (an A- grade level of certainty).
  To get a perfect score, you need to get Question 1 **AND** Question 2 **AND** Question 3... all the way to Question 100 correct.

  In probability, when you want independent events to *all* happen, you multiply their probabilities.
  *   **1 Question:** $0.90$ chance of being right.
  *   **2 Questions:** $0.90 \times 0.90 = 0.81$ (81% chance of getting both right).
  *   **10 Questions:** $0.90^{10} \approx 0.35$ (35% chance of getting all 10 right).
  *   **100 Questions:** $0.90^{100} \approx 0.00002$

  Even if you are **95%** sure on every single question:
  *   **100 Questions:** $0.95^{100} \approx 0.0059$ (Less than 1% chance of a perfect score).

  So, mathematically, you can be extremely confident in every individual answer while being almost certain that you made at least one mistake somewhere. Your friend is treating confidence as if it transfers linearly, but risk accumulates exponentially.

  ### 2. The Philosophy: The "Preface Paradox"
  There is a famous philosophical problem called **The Preface Paradox**, proposed by D.C. Makinson in 1965.

  It goes like this: An author writes a non-fiction book. They have checked every fact meticulously. For every specific claim in the book (e.g., "The battle started in 1815"), the author is highly confident it is true. However, in the preface of the book, the author writes: *"Despite my best efforts to ensure accuracy, I am sure there are still some errors in this work."*

  Is the author contradicting themselves?
  *   **Belief A:** "Claim 1 is true, Claim 2 is true... Claim 1000 is true."
  *   **Belief B:** "At least one claim in this book is false."

  Philosophers generally agree that **this is rational.** Human knowledge is "fallible." We can have good evidence for every specific belief we hold, while simultaneously acknowledging that human error exists and it is statistically likely that at least one belief in a large set is wrong.

  You are experiencing the exact same thing with your test. You have evidence for every answer, but you acknowledge the statistical reality of human error over a large sample size.

  ### 3. The Logic: The Conjunction Fallacy
  Your friend is intuitively committing a variation of the **Conjunction Fallacy**. This is the mistaken belief that specific conditions are more probable than a single general one.

  In your case, the "conjunction" is the statement: *"I got Q1 right AND Q2 right AND Q3 right..."*
  The more "ANDs" you add to a chain, the less likely the entire chain is to hold true, even if each individual link is strong.

  Think of it like walking across a room.
  *   Are you confident you can take **one step** without tripping? Yes, 99% confident.
  *   Are you confident you can take **1,000 steps** on a tightrope without tripping once? No way.

  Does your confidence in the single step make you irrational for doubting the 1,000 steps? No. It makes you realistic.

  ### Summary
  Your friend thinks that confidence is a "state of being" that should be consistent across the board. But confidence is actually a **probability estimate.**

  *   **Individual Confidence:** High probability of success per event.
  *   **Aggregate Confidence:** Low probability of perfection across many events.

  You aren't being irrational; you actually have a better grasp of statistics and epistemology (the study of knowledge) than your friend does. It is perfectly logical to say, "I stand by every answer I gave, but I expect I lost points somewhere."
