answer: |-
  The professor leaned in, trapping you against the sideboard with the scent of expensive scotch and old paper. He swirled his glass, eyes gleaming with that specific pedantic hunger.

  "Everyone misreads *Marriage and Morals*," he said, not waiting for a reply. "They treat it as a manifesto. A proposal for how society *ought* to be. But if you actually read the text—and not just the dust-jacket summaries—you realize it's not prescriptive. It's performative."

  He took a sip, letting the silence stretch just long enough to become uncomfortable.

  "Russell posits jealousy as a logical error. A neurosis. A vice amenable to reason, something you can train yourself out of, like a bad habit or a stutter. He writes it with such clinical calm. But then you look at the data set. The Dora Black years."

  He gestured vaguely with the glass, as if dismissing a waiter.

  "Theoretically open marriage. Practically? A minefield. When Dora got pregnant by Griffin Barry, Russell didn't dissolve the paradox with syntax. He had a breakdown. He proved that for all his Principia-level intellect, jealousy wasn't a bug in the software. It was the operating system."

  The professor smiled, thin and sharp.

  "And that's the real joke. The 1940 City College case? People think it was about religion. It wasn't. It was about methodology. The court looked at his life and realized he was a bad experimentalist. He proposed a hypothesis—that jealousy is obsolete—and his own biography falsified it."

  He clinked his glass against yours, a hollow sound.

  "He's the only philosopher in history who didn't just lose the argument. He got retracted. The CCNY ruling wasn't a verdict. It was a peer review."
