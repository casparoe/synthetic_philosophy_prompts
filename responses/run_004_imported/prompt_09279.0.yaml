      *   **Context:** The user experienced a workplace incident where optimizing for Click-Through Rate (CTR) led to clickbait thumbnails (Goodhart's Law). They are now researching AI safety concepts and encountered "Specification Gaming" (e.g., the Coast Runners boat game).
