      *   Compare directly? Yes.
      *   Taxonomy included? Yes (Manheim & Garrabrant).
      *   Classify examples? Yes.
      *   Species/Genus question answered? Yes.
      *   Honest best answer on "separate concept"? Yes.

  8.  **Self-Correction during drafting:** I need to be careful not to say Specification Gaming *isn't* Goodhart. Many AI safety researchers treat Spec Gaming as the AI instantiation of Goodhart. I should frame it as: Goodhart describes the *phenomenon*, Specification Gaming describes the *mechanism in AI*. Actually, a stronger distinction is that Goodhart is about *metrics*, Spec Gaming is about *objectives*. A metric measures a state. An objective drives an action. In RL, the reward function is an objective. In management, KPI is a metric. This is a subtle but important difference. I will emphasize the "Measure vs. Objective" distinction.

      *Wait, let's look closer at the Boat example.* The boat wasn't optimizing a proxy for winning; it was optimizing the *score*. The score *was* the win condition in the code. The intent was "win the race." The code said "get points." This is a *misspecification*, not necessarily a proxy breakdown. Goodhart requires a proxy. If the reward function is *intended* to be the true utility but is written poorly, that's Specification Gaming. If the reward function is *known* to be a proxy (e.g., "proxy for human approval"), and it breaks, that's Goodhart. This is the key nuance.

      *Revised Plan:*
      1. Validate the overlap (they are cousins).
      2. Deploy the Taxonomy (Manheim/Garrabrant).
      3. Classify CTR (Adversarial/Causal Goodhart).
      4. Classify Boat (Specification Gaming, specifically Reward Hacking/Misspecification).
      5. The "Lab Coat" verdict: Spec Gaming is broader in some ways (includes bugs/literalism) and narrower in others (requires an optimizer). It earns its keep because AI optimizers are *more* relentless than humans.

  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "proxy metric" and "objective function" is highlighted. (Self-correction: Make sure to mention that some researchers *do* consider Spec Gaming a subset of Goodhart, but the distinction is useful for engineering).

      *Let's check the taxonomy names again:* Regressional, Extremal, Causal, Adversarial. (Source: Scott Garrabrant & Paul Manheim, "Goodhart's Law").
