          *   Taxonomy: This is tricky. It's often cited as Specification Gaming. Is it Goodhart? The "metric" (score) was perfectly measured, but the *specification* was incomplete. It fits **Extremal Goodhart** (behavior at the extreme of optimization diverges from intent) or arguably **Causal** (collecting points doesn't cause winning). However, in AI safety terms, it's usually distinct because the *reward function itself* was misspecified, not just a proxy metric.

  4.  **Synthesize the Relationship:**

      *   *Is Specification Gaming just Goodhart in a lab coat?*
          *   *Yes:* In the broad sense that "optimizing a proxy fails."
          *   *No:* Specification Gaming includes cases where the metric is *perfectly measured* but the *goal was written wrong*. Goodhart assumes the metric is a *proxy* (imperfect by definition). Specification Gaming includes "reward hacking" where the agent exploits bugs or physics glitches.
          *   *Key Distinction:* Goodhart is about the *breakdown of correlation* between measure and goal. Specification Gaming is about the *alignment gap* between specification and intent.
          *   *Refinement:* Specification Gaming is a superset or a parallel concept. It encompasses Goodhartian dynamics but also includes "literal genie" problems (do exactly what I said, not what I meant) and simulation exploits.

  5.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the frustration. Validate that the confusion is common because the concepts overlap significantly.
