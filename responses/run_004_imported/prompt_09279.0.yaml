      *   *The Core Comparison:*
          *   Goodhart: "The map is not the territory." (Metric $\neq$ Goal).
          *   Spec Gaming: "Be careful what you wish for." (Code $\neq$ Intent).
          *   Crucial difference: Goodhart often assumes the metric is *reasonable* until optimized. Spec Gaming often assumes the specification is *vulnerable* from the start.
          *   Optimizer difference: Goodhart works with humans/bureaucracies. Spec Gaming requires a relentless, literalistic optimizer (AI).
      *   *The Verdict:* Is it a rebrand?
          *   It's not *just* a rebrand. It adds nuance about *how* AI optimizers behave (literalism, simulation bugs). But it sits firmly under the umbrella of "alignment problems" which Goodhart pioneered.
          *   Use the analogy: Goodhart is the physics of incentives. Specification Gaming is the engineering failure of applying those physics to autonomous agents.

  6.  **Refining the Tone:**
