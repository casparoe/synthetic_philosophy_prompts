answer: |-
  This is one of the most celebrated and contentious cruxes in the history of Indian philosophy. You have identified the precise fault line where Nyāya realism meets the psychology of cognition. The tension you feel between *avyapadeśya* (non-verbal) and *vyavasāyātmaka* (determinate/ascertained) is not a misunderstanding on your part; it is the engine that drove Nyāya epistemology for over a millennium.

  Here is a breakdown of the sūtra's machinery, the history of its interpretation, and an assessment of whether the tension is truly resolved.

  ### 1. The Work of the Three Qualifiers

  To understand the tension, we must first see what specific "defects" (*doṣa*) or alternative cognitions each qualifier is meant to exclude. Gautama is defining *pramā* (valid cognition) via perception, and he needs to distinguish it from other mental events.

  *   **Avyapadeśyam (Non-verbal / Inexpressible)**
      *   **Defect Ruled Out:** Cognition derived merely from testimony (*śabda*) or memory (*smṛti*).
      *   **Function:** This ensures the *causal origin* is sensory, not linguistic. If I tell you "there is a fire on the mountain," and you cognize fire, that is *vyapadeśya* (derived from a name/word). Perception must arise from the *sannikarṣa* (contact) itself.
      *   **The Problem:** As you noted, "non-verbal" suggests a raw feel. If perception is *avyapadeśya*, how can I say "This is a cow"? "Cow" is a word.

  *   **Avyabhicāri (Non-deviating / Non-erroneous)**
      *   **Defect Ruled Out:** Illusion (*viparyaya* or *bhrama*).
      *   **Function:** This ensures *truth*. If I see a rope as a snake, that cognition arises from sense-contact and might feel determinate, but it "deviates" from the actual nature of the object. This qualifier guarantees that perception is a *pramāṇa* (instrument of truth), not just a mental event.

  *   **Vyavasāyātmakaṃ (Of the nature of ascertainment / Determinate)**
      *   **Defect Ruled Out:** Doubt (*saṃśaya*) and Hypothetical Reasoning (*tarka*).
      *   **Function:** This ensures *certainty*. Doubt ("Is this a post or a person?") arises from sense contact but lacks settlement. *Vyavasāya* implies a decisive grasp of the object. It marks the transition from a mere sensory registration to a cognitive claim.
      *   **The Problem:** Ascertainment usually implies a subject-predicate structure ("This is such-and-such"), which relies on concepts and, by extension, language.

  ### 2. The Apparent Contradiction

  You are correct that *avyapadeśya* and *vyavasāyātmaka* pull in opposite directions.
  *   *Avyapadeśya* points toward the **causal genesis** of the cognition (it comes from the senses, not words).
  *   *Vyavasāyātmaka* points toward the **normative structure** of the cognition (it is a valid, decisive judgment).

  If perception is strictly non-verbal, it cannot be a judgment. If it is a judgment, it is arguably verbalizable. If Gautama meant perception to be *only* the raw sensory flash, *vyavasāyātmaka* would be redundant or false. If he meant it to be the full judgment, *avyapadeśya* seems misleading.

  ### 3. The *Nirvikalpaka/Savikalpaka* Distinction: Implicit or Graft?

  This is where the commentary tradition steps in.

  **Vātsyāyana's Move (The Bhāṣya)**
  Vātsyāyana (c. 4th–5th century CE) is aware of the tension. His gloss on *avyapadeśya* is crucial. He does **not** interpret it as "devoid of all conceptual content." Instead, he interprets it as "not *caused* by words."
  For Vātsyāyana, a perceptual judgment like "This is a cow" is *avyapadeśya* because the *cause* of the cognition is the eye contacting the cow, not someone telling you "Here is a cow." The words "This is a cow" may arise *concurrently* or subsequently to express the cognition, but they did not *generate* it.
  *   **Verdict:** Vātsyāyana tries to solve the tension by making *avyapadeśya* about **etiology** (origin) rather than **content**.

  **The Later Nyāya Move (Uddyotakara to Gaṅgeśa)**
  Later Naiyāyikas found Vātsyāyana's solution insufficient. If perception includes the judgment "This is a cow," and "cow" is a universal (*sāmānya*) grasped through a concept, how is that strictly non-verbal?
  They formalized the **two-stage theory**:
  1.  **Nirvikalpaka Pratyakṣa (Indeterminate Perception):** The initial flash of contact. You see "something." You grasp the particular (*viśeṣa*) and the universal (*sāmānya*) but without relating them. No subject-predicate structure. This satisfies *avyapadeśya* strictly.
  2.  **Savikalpaka Pratyakṣa (Determinate Perception):** The subsequent cognition where the qualifier (*viśeṣaṇa*) is related to the qualificand (*viśeṣya*). "This (substrate) is a cow (qualifier)." This satisfies *vyavasāyātmaka*.

  **Is this a graft?**
  It is a **hermeneutic explication**, not a pure graft.
  *   **Argument for Graft:** Gautama's sūtra is singular (*pratyakṣam*). He does not explicitly posit two *types* of perception in 1.1.4. The *nirvikalpaka* is arguably a theoretical posit introduced to save the definition from Buddhist critique (specifically Dignāga, who argued perception *must* be free of conception).
  *   **Argument for Implicit:** The sūtra lists qualifiers that cannot apply to a single instantaneous cognitive event simultaneously. A cognition cannot be both "non-verbal" and "ascertained" (in the sense of a judgment) at the exact same logical moment. Therefore, the sūtra *implies* a temporal process. The later distinction merely names the stages that the sūtra describes functionally.

  I would argue it is **not merely a relabeling**. It does real work. It allows Nyāya to concede to the Buddhists that the *causal foundation* of perception is non-conceptual (*nirvikalpaka*), while maintaining their realist stance that the *fruit* of perception is a world of qualified objects (*savikalpaka*). Without this distinction, Nyāya collapses into either naive realism (ignoring the role of concepts) or skepticism (admitting concepts invalidate perception).

  ### 4. Critical Assessment: Is the Tension Resolved?

  Does this successfully explain how unconceptualized contact yields determinate cognition? Here is where my view diverges from a purely internal Nyāya reconstruction.

  **The Nyāya Realist Solution**
  For the Naiyāyika, the tension is resolved by **Ontology**.
  They believe universals (*sāmānya*, e.g., "cowness") are real entities existing in the world, not mental constructs. Therefore, when the sense organ contacts the object, it contacts *both* the particular and the universal.
  *   Because the universal is *in the object*, grasping it is still "perception" (sensory contact), not "conception" (mental construction).
  *   Therefore, the move from *nirvikalpaka* to *savikalpaka* is not a move from "sensory" to "mental," but from "registered" to "related."
  *   On these terms, the tension is resolved. The "concept" is just another perceived real.

  **The External Critique (The "Myth of the Given")**
  However, if we step outside Nyāya ontology (as a modern reader or a Buddhist nominalist might), the tension remains genuine and perhaps unresolved.
  *   **The Justification Problem:** How can a *nirvikalpaka* cognition (which has no propositional structure) justify a *savikalpaka* cognition (which does)? This is Wilfrid Sellars' "Myth of the Given." If the first stage is non-conceptual, it cannot logically entail the second stage. If the second stage adds the concept, where did that concept come from if not from the mind?
  *   **The Linguistic Turn:** If *vyavasāya* (ascertainment) implies the ability to say "This is X," then language is constitutive of the perception, not just an expression of it. Vātsyāyana's attempt to make *avyapadeśya* purely etiological feels like a dodge. If I cannot articulate it, do I truly have *vyavasāya*? If I can articulate it, is it truly *avyapadeśya*?

  **Conclusion**
  The *nirvikalpaka/savikalpaka* distinction saves the sūtra from internal contradiction, but it does so by positing a cognitive mechanism that is phenomenologically elusive (have you ever experienced *nirvikalpaka* perception? Nyāya says yes, but it's pre-reflective).

  The tension points to a genuine difficulty in **Direct Realism**: explaining how the mind moves from "being affected by an object" to "knowing an object as something."
  *   **Gautama's Sūtra** captures the *ideal*: Perception should be grounded in the senses (*avyapadeśya*) but yield knowledge (*vyavasāyātmaka*).
  *   **The Commentary** captures the *process*: It takes time and cognitive processing to move from one to the other.

  Is it unresolved? **Epistemologically, no** (for Nyāya), because they anchor concepts in reality. **Phenomenologically, yes**, because the transition from the non-verbal to the verbalized judgment remains a "black box" in the system. The distinction is not just a relabeling; it is a necessary theoretical bridge that reveals the cost of Nyāya's realism: to keep perception valid, they must populate the world with universals so that "concepts" can be "perceived."

  If your reading group accepts Nyāya ontology, the sūtra is consistent. If you treat the ontology as a hypothesis, the sūtra reveals the fragile seam between sensation and judgment that all realist epistemologies struggle to stitch.
