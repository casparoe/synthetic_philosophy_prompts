answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Theo's. And I should probably start by apologizing to the bride and groom. Because last night, at the rehearsal dinner, I nearly talked them out of getting married.

  We got into a bit of a debate. See, Theo and Mira have a very specific view on existence. Theo, through his meditation, and Mira, through her philosophy, have both concluded that there isn't really a fixed "Theo" or a fixed "Mira." No permanent soul, no unchanging self. Just a flowing stream of moments, thoughts, and sensations.

  And I pointed out that their vows say they will love each other "for the rest of our lives." And I asked: If there's no continuous person, who exactly is making that promise? Why should Theo-in-thirty-years feel bound by words spoken by a different bundle of aggregates tonight?

  Theo offered an image to answer me. He said a vow is like one candle flame lighting another. It's not the *same* flame, but it's not a *different* one, either. It's a continuation.

  I think I was so busy winning the argument that I missed the beauty of the answer. Because if you think about it, that makes what they are doing tonight infinitely more romantic than the standard story.

  If you believe you have a permanent soul, marriage is easy. You just sign a contract between two static statues. You assume the person you marry today is the exact same person who will be there in forty years. But Theo and Mira know better. They know that they will change. They know the "Theo" who wakes up tomorrow will be slightly different than the one standing here tonight.

  So, when they make this vow, they aren't building a cage to trap their future selves. They are lighting a torch.

  A vow like this isn't a demand placed on the future. It's an intention set in the present. It says: *In this moment, I choose to act in a way that makes it easy for the next moment to be kind. I choose to create conditions where the flame can be passed.*

  It acknowledges that love isn't a thing you possess; it's a process you maintain. It requires fuel. It requires attention. It requires that every morning, for the rest of your lives, you wake up and choose to light the fire again.

  To the family and friends who just want to cry happy tears: Do not worry. This doesn't mean their love is less real. It means it's more alive. It's not a stone monument; it's a living fire. And because there is no "forever" guaranteed by metaphysics, every single day they choose each other is a genuine miracle of will.

  Theo, Mira: You don't have to worry about binding people who don't exist yet. You only have to worry about the flame in your hand right now. Keep it bright. Keep it warm. Pass it gently.

  So, if everyone could raise a glass.

  To the flux. To the flow. To the flame that is never the same, but never goes out.

  To Theo and Mira.
