answer: |-
  It is wonderful to welcome a colleague from physics into the deep end of evolutionary theory. Your background gives you a distinct advantage in appreciating the mathematical formalisms underpinning these debates. However, as you transition from the specific arguments of E. O. Wilson's later career to the broader consensus of working evolutionary biologists, there is a crucial correction to be made regarding the current state of the field.

  The premise of your question—that Hamilton's inclusive fitness theory (IFT) has been mathematically superseded and that the gene's-eye view is a "discredited relic"—is not the view held by the majority of evolutionary biologists, theoretical biologists, or philosophers of biology. While Wilson, Nowak, and Tarnita's 2010 *Nature* paper was a landmark event, it did not settle the debate in favor of multilevel selection (MLS) to the exclusion of inclusive fitness. Rather, it ignited a fierce controversy that ultimately reinforced the utility of IFT for most practitioners.

  Here is a breakdown of why the field continues to utilize Hamiltonian language, framed for someone with your mathematical and philosophical background.

  ### 1. Mathematical Equivalence, Not Supersession
  From a physicist's perspective, the relationship between Inclusive Fitness Theory and Multilevel Selection is best understood not as competing theories, but as **equivalent mathematical formalisms** describing the same underlying dynamics.

  Both frameworks can be derived from the **Price Equation**, which is a covariance-based description of evolutionary change that is mathematically exact but tautological (it describes change but does not inherently predict it without further assumptions).
  *   **IFT** partitions the fitness effects into direct and indirect components weighted by relatedness ($r$).
  *   **MLS** partitions fitness variance into within-group and between-group components.

  In most standard models, these are isomorphic. You can transform an IFT model into an MLS model and vice versa without losing information. It is analogous to describing a physical system using Lagrangian mechanics versus Hamiltonian mechanics, or using Cartesian versus Polar coordinates. One coordinate system may be more tractable for a specific boundary condition, but choosing one does not "discredit" the other.

  When Nowak, Tarnita, and Wilson (2010) argued that IFT was a "special case" of a more general standard selection model and had limited applicability, they made a mathematical claim that was met with immediate and overwhelming pushback. A rebuttal letter signed by **137 leading evolutionary biologists** (including many who work on social evolution) was published in *Nature* shortly after, arguing that IFT remains robust, general, and mathematically sound.

  ### 2. Heuristic Utility and Tractability
  If the math is equivalent, why do biologists stick with the "gene's-eye" or kin-selection language? The answer lies in **heuristic utility**.

  Science is not just about finding *a* solution; it is about finding the solution that generates the most productive hypotheses. For many problems in social evolution, the IFT framework is more cognitively and computationally tractable.
  *   **Measurement:** In the field, it is often easier to measure genetic relatedness ($r$) and the cost/benefit to an individual ($c$ and $b$) than it is to quantify the variance in fitness between groups and the heritability of group traits.
  *   **Prediction:** IFT provides a simple inequality ($rb > c$) that offers immediate intuitive predictions about when a trait will spread. MLS models often require more complex parameterization to yield the same prediction.

  Biologists continue to use IFT not because they deny group structure, but because the "kin selection" lens often brings the causal factors into sharper focus for the specific systems they study (e.g., Hymenoptera, cooperative breeding in birds).

  ### 3. The "Settled" Debate is Actually Pluralism
  You mentioned that the units-of-selection debate is "settled in favor of group-level selection." In the philosophy of biology, the consensus is actually closer to **methodological pluralism**.

  Prominent philosophers of biology like Samir Okasha (*Evolution and the Levels of Selection*) and Peter Godfrey-Smith have argued that the debate is largely verbal. Whether selection acts on genes, individuals, or groups often depends on how you choose to model the population structure.
  *   If you model the population as a collection of individuals with interaction coefficients, you get IFT.
  *   If you model the population as a collection of groups with variance in reproduction, you get MLS.

  Because both are valid, the field has not abandoned IFT. To do so would be to discard a powerful tool in the toolkit. The "Gene's Eye View" (Dawkins) is also not discredited; it remains a potent way of visualizing evolutionary stability (Evolutionarily Stable Strategies), even if biologists acknowledge that selection can act at multiple levels simultaneously.

  ### 4. Empirical Track Record
  Finally, working biologists are pragmatic. Inclusive fitness theory has a staggering track record of empirical success over the last 50 years. It successfully predicted:
  *   The correlation between relatedness and altruistic behavior across taxa.
  *   The dynamics of conflict within eusocial colonies (e.g., worker policing).
  *   Sex ratio adjustments in response to local mate competition.

  While Wilson's later arguments highlighted legitimate limitations of IFT in complex, non-additive scenarios, the core theory remains the workhorse of social evolution. If IFT were truly a "discredited relic," it would not continue to generate successful, testable predictions in top-tier journals.

  ### Summary
  To answer your question directly: Working evolutionary biologists do not adopt MLS language *throughout* the field because the scientific community does not accept the premise that IFT has been falsified or superseded.

  The 2010 Wilson/Nowak/Tarnita paper is viewed by most theorists as a valuable contribution that clarified the boundaries of IFT, but not as a funeral for the theory. The field largely views IFT and MLS as **complementary modeling strategies**. Biologists use the language of genes and relatedness because, for many problems regarding altruism and eusociality, it remains the most efficient coordinate system for solving the equation.

  As a physicist, you might appreciate that the "truth" of the system lies in the dynamics themselves; the choice between "inclusive fitness" and "multilevel selection" is often just a choice of basis vectors. Most biologists keep both bases in their library and reach for the one that makes the calculation easiest.
