answer: |-
  Your teammate is rationalizing a bad process. While his intuition comes from a real place (wanting to verify skills and commitment), the specific conclusion he's drawing—that a 6+ hour unpaid slog is the right way to do it—is outdated, counterproductive, and likely illegal in some jurisdictions depending on how it's structured.

  Here is the breakdown of why his logic is flawed, where there is a tiny grain of truth, and how you can argue for the better approach.

  ### 1. The "Seriousness Filter" is actually a "Privilege Filter"
  Your teammate says a long task filters out people who "aren't serious." In reality, it filters out:
  *   **People currently employed:** Top talent usually has jobs. Asking for 6+ hours of unpaid work on a weeknight is impossible for them.
  *   **Caregivers:** Parents or those caring for relatives often don't have 6-hour blocks of uninterrupted time.
  *   **People with options:** The best candidates have multiple interviews. If Company A asks for 2 hours and Company B asks for 6, Company A wins the talent.

  **The Signal:** A 6-hour take-home doesn't signal "skill"; it signals "unemployed" or "desperate." You aren't filtering for quality; you're filtering for availability.

  ### 2. The "Faking" Argument is Weak
  His argument is that a short task is easy to fake.
  *   **Reality:** A 6-hour task is arguably *easier* to fake than a 2-hour task if the candidate is motivated to cheat. They can use AI, have a friend help, or copy-paste from GitHub/Stack Overflow over a longer period without detection.
  *   **Complexity vs. Duration:** You prevent faking by making the prompt **specific to your business context**, not by making it long. A 2-hour task that requires solving a specific, nuanced problem you actually face is harder to fake than a 6-hour generic "build a todo app" slog.
  *   **The AI Factor:** In the current landscape, a long, repetitive coding/writing task is exactly what LLMs are good at. A short, high-context reasoning task is harder for AI to replicate perfectly.

  ### 3. Is there *any* truth to his side?
  There is one valid metric he is trying to capture: **Sustained Focus and Architecture.**
  Sometimes, a 1-hour task only shows you can write a function. A longer task shows you can structure a project, handle fatigue, and make decisions over time.
  *   **However:** You can test this without a 6-hour slog. You can do a 2-hour task that requires setting up a repo, writing tests, and documenting decisions. That shows architecture without demanding a full work day.
  *   **The "Harder" Metric:** Making something "harder" (in terms of pain) tests **grit**, but unless your job is specifically high-stress crisis management, grit is a poor predictor of day-to-day performance. You want to hire for *flow*, not *suffering*.

  ### 4. The Business Case (Arguments for your meeting)
  If you need ammo to win this argument, use these points:

  *   **Drop-off Rates:** Data from hiring platforms (like Lever, Greenhouse, etc.) shows that completion rates plummet significantly after the 2-hour mark. You are shrinking your candidate pool artificially.
  *   **Employer Brand:** Candidates talk. Glassdoor and Blind reviews about "6-hour unpaid tests" spread fast. It brands your company as exploitative.
  *   **Legal/DEI Risk:** Unpaid work that takes significant time can be construed as off-the-clock labor. Furthermore, it disproportionately disadvantages underrepresented groups who may have less flexible time resources, opening you up to discrimination risks.
  *   **Diminishing Returns:** The correlation between take-home length and hiring success peaks around 60–90 minutes. After that, you are just gathering noise (fatigue, resentment, rushing).

  ### 5. The Compromise Solution
  If he is still resistant, propose these alternatives that solve his problem without the toxicity:

  1.  **Time-Boxing:** "Let's make the scope large, but explicitly tell candidates: *'We expect this to take 3 hours. If it takes longer, stop at 3 and tell us what you would have done next.'*" This tests their ability to estimate and prioritize (which is valuable) without demanding 6 hours.
  2.  **Paid Phase:** "If we truly need to see 6 hours of work, we should pay them for it." Treat it as a freelance contract. Serious candidates will love this; fake candidates will bail.
  3.  **The "Portfolio Review" Pivot:** Instead of a new project, ask them to walk through a complex project they've already done. "Show us the hardest thing you've built and talk us through the trade-offs." This takes 1 hour of their time and reveals more about their thinking than 6 hours of coding.

  ### Verdict
  **He is rationalizing a bad process.** He is confusing "difficulty" with "rigor."
  *   **Rigor** = Testing specific, hard skills relevant to the job.
  *   **Difficulty** = Making them suffer.

  Stick to your gun. A short, high-quality, context-specific task evaluated deeply is infinitely better than a long, generic slog evaluated superficially. If he wants to see how they handle a "slog," wait until they are actually on the payroll and you can manage that workload ethically.
