answer: |-
  This is one of the most sophisticated and common questions raised by serious readers of Spinoza. You have correctly identified that Spinoza is a strict determinist (or necessitarian) in the *Ethics*, yet a champion of liberty in the *Theological-Political Treatise (TTP)* and the *Political Treatise (TP)*.

  The short answer is: **You are right that Spinoza rejects libertarian free will, but you are assuming that his political argument for democracy relies on it. It does not.** In fact, Spinoza's argument for democracy is *stronger* because of his determinism, not in spite of it.

  To square these commitments, we need to look at how Spinoza redefines "freedom," how he views the purpose of the state, and why a deterministic psychology makes democracy more stable than despotism.

  ### 1. Two Concepts of Freedom
  The confusion often stems from equating "freedom" with "uncaused choice" (*liberum arbitrium*). Spinoza explicitly rejects this in the *Ethics*. However, he does not reject freedom (*libertas*) itself.

  *   **Metaphysical Freedom (Rejected):** The ability to have chosen otherwise given the exact same prior causes. Spinoza says this is an illusion born of ignorance.
  *   **Spinozistic Freedom (Affirmed):** To be "free" is to be the **adequate cause** of one's own actions. When I act from reason (understanding the necessity of nature), I am active and free. When I am driven by external passions (fear, hatred, hope) that I do not understand, I am in "bondage."

  So, for Spinoza, freedom is not the *absence of determination*; it is a specific *kind* of determination. A stone rolling down a hill is determined. A human acting from rational understanding is also determined, but they are "free" because the determination comes from their own essence (reason) rather than external coercion.

  ### 2. The Purpose of the State
  In the *TTP*, Spinoza famously writes: **"The end of the state is really liberty."**

  Since he doesn't mean "libertarian free will," what does he mean? He means a condition where citizens are less subject to irrational passions and fear, and more able to live according to reason.
  *   In a state of nature, we are slaves to our passions and constantly in fear of one another.
  *   The Social Contract is not about surrendering rights to a sovereign who then magically possesses "free will." It is a pragmatic arrangement to increase our **power of acting** (*potentia agendi*).

  A good government is one that minimizes the external causes that throw us into passive emotions (fear, anger) and maximizes the conditions under which we can use reason.

  ### 3. Why Democracy? (The Deterministic Argument)
  If human behavior is determined by causes, why prefer the many to the one? Spinoza offers a psychological and structural argument, not a metaphysical one.

  **A. Stability and the Laws of Physics**
  Spinoza treats politics like physics. He looks at the forces at play. The fundamental force in human society is the *conatus* (the striving to persevere).
  *   **The Despot:** A single ruler is subject to the same passions as everyone else (anger, lust, fear). If a despot rules by passion, the laws will be irrational. Furthermore, a despot relies on the power of the multitude to stay in power. If the laws go against the *conatus* of the people, the people will eventually resist. This creates instability.
  *   **The Democracy:** In a democracy, laws are (ideally) the result of aggregating many perspectives. Spinoza argues in the *TTP* that it is almost impossible for a majority of people to agree on an irrational plan. While one person can be easily overcome by passion, it is much harder for a large assembly to be overcome by the *same* passion at the *same* time.
  *   **Conclusion:** Democracy is structurally more likely to produce rational laws because it dilutes individual passions. Rational laws lead to a more stable society, which allows citizens more "freedom" (in the Spinozistic sense of acting from reason).

  **B. Obeying Oneself**
  In a monarchy, when you obey the law, you are obeying the will of another. This feels like (and functionally is) external coercion, which places you in "bondage."
  In a democracy, when you obey the law, you are obeying a collective will of which you are a part. Spinoza suggests this makes the transition from "state of nature" to "civil state" less jarring. You are not submitting to a master; you are coordinating power with your peers. This preserves more of your individual *conatus* than submission to a master does.

  **C. The "Enlightened Despot" Problem**
  You asked: *On his own premises, rule by an enlightened despot seems just as defensible.*
  Spinoza would reply that an "enlightened despot" is a statistical impossibility and a structural weakness.
  *   Because humans are determined by passions, relying on a ruler to *always* be rational is relying on a miracle.
  *   Even if a despot is enlightened today, their successor might not be.
  *   Even if the despot is enlightened, they cannot know the needs of the multitude as well as the multitude can.
  *   Therefore, a system that *institutionalizes* rationality (democracy) is superior to a system that *personifies* it (monarchy), because institutions are more stable than individual psyches.

  ### 4. Freedom from Fear
  In the *TTP*, Spinoza argues that the greatest obstacle to reason is **fear**. Superstition and tyranny thrive on fear.
  *   A tyrant rules by keeping subjects in fear. This keeps subjects in a state of passion/bondage.
  *   A democracy (ideally) rules by consent and shared interest. This reduces fear.
  *   Less fear = more capacity for reason = more Spinozistic freedom.

  Therefore, Spinoza prefers democracy not because it respects "free will" (which doesn't exist), but because it is the political system most conducive to producing **rational, fearless citizens.**

  ### Summary
  Spinoza's preference for democracy is not arbitrary. It is derived directly from his deterministic psychology:
  1.  **Humans are determined by passions and reason.**
  2.  **Passions make us unstable and unfree; reason makes us stable and free.**
  3.  **Single rulers are highly susceptible to passion; large assemblies are less so.**
  4.  **Therefore, democracy is the most rational and stable form of government.**

  Spinoza is essentially saying: "Since we are all determined, let's choose the system that determines us to be more rational and less fearful." He isn't trying to liberate the will from causality; he is trying to arrange causality so that it produces human flourishing.

  You haven't missed a definition; you've just encountered the moment where Spinoza's metaphysics forces a complete reinvention of political theory. He doesn't defend democracy *despite* determinism; he defends it *using* determinism.
