      *   **User's Reasoning:** If everything is determined (no libertarian free will), then individual choices aren't "free." Therefore, the collective choices of a democracy aren't "freer" than the choices of a despot. So why prefer democracy?
      *   **User's Question:** Is there a different definition of "freedom" at play? What is the non-arbitrary reason for preferring democracy given determinism?
