      *   **Hume's Framework:**
          *   *Hume's Fork:* Relations of Ideas (logic, math, certain, a priori) vs. Matters of Fact (empirical, contingent, a posteriori).
          *   *Induction/Causation:* Not based on reason/logic, but on Custom/Habit. We expect the future to resemble the past because of psychological association, not logical necessity.
          *   *Confirmation:* Hume doesn't have a formal theory of confirmation (that's Carnap/Hempel territory). He has a theory of *belief formation*.

  3.  **Brainstorming Hume's Potential Reaction:**
