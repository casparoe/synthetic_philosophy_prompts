      *   *On Confirmation/Evidence:* This is the crux. For Hume, "confirmation" isn't a logical relation between propositions; it's a psychological feeling of increased vivacity or belief resulting from experience.
      *   *On the Equivalence Condition:* Hume would likely reject the idea that logical equivalence dictates psychological confirmation. Just because two statements mean the same thing logically doesn't mean observing a green apple triggers the same *habit of mind* as observing a black raven.
      *   *On Induction:* Hume is skeptical that we infer general laws *at all*. We don't reason "All ravens are black, therefore this raven is black." We see many black ravens, and custom makes us expect the next one to be black.
