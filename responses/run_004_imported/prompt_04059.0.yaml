answer: |-
  ### Part 1: The Asymmetry Between Production and Omission

  The problem of profligate omissions is significantly more severe for counterfactual theories than ordinary causation by production because **production benefits from an independent metaphysical filter that omissions lack.**

  In ordinary causation by production (e.g., a rock throwing shatters a window), counterfactual dependence is usually accompanied by a physical process. Process theories (such as those of Wesley Salmon or Phil Dowe) define causation via the transmission of a conserved quantity (like energy or momentum) along a spatiotemporally continuous path. This provides a non-counterfactual, objective constraint on causal candidacy. Even if the counterfactual "If the rock hadn't been thrown, the window wouldn't have shattered" is true, we can verify the causal link by tracing the energy from the arm to the rock to the glass. Crucially, this physical requirement rules out the Queen, the stranger, or the gardener (if he wasn't holding the rock) because there is no energy transfer connecting them to the shattering. The physical process acts as a sieve, filtering out the infinite background conditions that are counterfactually relevant but causally inert.

  With omissions, this sieve disappears. An omission is, metaphysically speaking, a "non-event." There is no substance, no energy, and no spatiotemporally continuous process connecting the gardener's *not* watering to the plant's death. Because "nothing" happens, there is no conserved quantity to trace. Consequently, the counterfactual theory is left without its usual partner constraint. It must rely solely on dependency relations. Since the plant's survival counterfactually depends on the non-occurrence of an infinite number of events (the Queen not watering, the stranger not watering, a meteor not destroying the water can, etc.), and all these non-events actually obtained, the counterfactual account is forced to designate all of them as causes. Without the physical "anchor" of a process to limit the field, the counterfactual net captures everything, leading to the profligacy problem.

  ### Part 2: Evaluating Strategies for Restriction

  Of the two strategies for restricting omissions, **Strategy (a)—building normative or statistical normality into the causal analysis—is more defensible**, specifically because omissions are ontologically distinct from events.

  **Why Normality is Preferable:**
  Strategy (b) (the Pragmatic view, associated with David Lewis) maintains that the Queen's non-watering *is* a genuine cause metaphysically, but we ignore it in conversation because it isn't salient. While this preserves a clean, objective ontology, it comes at the cost of intuitive plausibility. It forces us to accept that, strictly speaking, the death of the plant was caused by the Queen, the stranger, and the gardener equally, and that our denial of the Queen's causation is merely a linguistic convenience. This renders the concept of causation explanatorily toothless; if we want to know *why* the plant died, being told "because the Queen didn't water it (among infinite other things)" is true but useless.

  Strategy (a) (associated with Hart & Honoré, and more recently Christopher Hitchcock and Joseph Halpern) argues that causation by omission is inherently sensitive to a "default/deviant" distinction. An omission is not just any non-occurrence; it is a failure to occur *when it was expected to*. The gardener's non-watering is a "deviant" non-occurrence (violating a job description or norm), whereas the Queen's non-watering is a "default" non-occurrence (conforming to expectation). By building this into the analysis, we capture the intuition that the Queen is *not* a cause, rather than merely saying she is an ignored cause. This is defensible because the very concept of an "omission" is normative; a "missing pulse" is only an omission if a pulse is expected. Therefore, importing norms into the analysis isn't contaminating causation; it is respecting the ontology of absences.

  **The Strongest Objection: The Threat to Objectivity**
  The strongest objection facing the Normality strategy is that it **conflates descriptive facts with prescriptive norms, thereby undermining the objectivity of causal claims.**

  Causation is traditionally viewed as a mind-independent relation in the world. If whether $C$ caused $E$ depends on whether $C$ was "normal" or "expected," then causal facts become relative to the normative framework of the observer. For example, in a society where gardening is not a recognized profession, the gardener's failure might be "normal," and thus not a cause. This implies that two observers with different moral or statistical expectations could look at the exact same physical situation and disagree on the *facts* of causation, not just on who is to blame.

  This is particularly damaging for legal and scientific contexts. In a courtroom, we want causal responsibility to rest on objective facts about the world, not on contested social norms. If the Normality strategy is correct, a defense attorney could argue their client didn't cause the harm because, relative to *their* normative framework, the omission was "default." By tethering causation to normativity, Strategy (a) risks collapsing the distinction between *causing* a result and being *responsible* for it, making causal inquiry vulnerable to subjective bias.
