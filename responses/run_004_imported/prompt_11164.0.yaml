          *   The structure of *Qiwu Lun*: It moves through various dialogues (Ziqi/Ziyou, Yao/Shun, etc.) to illustrate the leveling of distinctions. The Butterfly Dream is the *capper*, the experiential proof of the theory.
          *   Legge's punctuation is the culprit. Classical Chinese has no quotation marks. Legge imposed them based on his reading of the flow, but he often grouped thematic units together.
