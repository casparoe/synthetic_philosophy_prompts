          *   Butterfly passage starts with: 昔者莊周夢為胡蝶... (Formerly Zhuang Zhou dreamed he was a butterfly...)
          *   *Crucial Point:* In the original Chinese, there is no explicit "Zhuangzi said" marker before the butterfly passage. However, the shift from the allegorical dialogue (Penumbra/Shadow) to the historical/mythical figure (Zhuang Zhou) is usually understood as a shift in voice.
          *   *Commentary Tradition:* Guo Xiang (3rd century), the definitive editor/commentator, treats the butterfly passage as the conclusion of the chapter, summarizing the theme of *wuhua* (transformation). He does not attribute it to the Shadow.
      *   *Legge's Quotation Marks:* Legge uses Victorian punctuation conventions. He likely opened a quote at the start of the Penumbra dialogue and didn't close it until the end of the section, implying continuity where there might just be thematic continuity, not speaker continuity.

