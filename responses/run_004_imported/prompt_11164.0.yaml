      *   *Nuance:* The phrase "I, Kwang Kâu" (Yu, Zhuang Zhou) is the smoking gun. A shadow wouldn't identify as Zhuang Zhou unless Zhuang Zhou *is* the Shadow, which collapses the allegory.
