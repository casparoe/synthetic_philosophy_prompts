answer: |-
  The pot sat between them: $120. If Robert passed, it would grow to $160, and the decision would shift to Cristina. If she passed, it would grow again. But the shadow of backward induction hung over the table.

  Robert's hand hovered over the pile. "I'm taking it," he said, not looking at Cristina.

  "Because you think I'm irrational?" Cristina asked, leaning back.

  "Because I know you're rational. And you know I'm rational. It's common knowledge, Cristina. If we reach your turn, you'll take. Knowing that, I take now. Knowing that, I should have taken at node one. We're just finishing the logic."

  Cristina tapped the table. "But we *didn't* take at node one. We're here. That's the flaw in your 1995 paper. You say Common Knowledge of Rationality (CKR) implies backward induction. Fine. But CKR also implies this node is never reached. Since we *are* here, CKR is false. So why are you still using it to decide?"

  Robert finally looked up. "Because the counterfactual is vacuous. If CKR holds, this moment doesn't exist. If you force me to reason about a moment that shouldn't exist, I must assume the premise—your rationality—has collapsed. If you're irrational, I secure the payoff."

  "That's dogmatic," Cristina snapped. "You're treating rationality as a metaphysical state rather than a strategy. Stalnaker showed this. Rationality includes a belief revision policy. If you pass, I don't assume you're insane. I update. I think, 'Robert is signaling he expects me to pass.' If I believe that, passing is my best response. So passing is rational for you now."

  "You're smuggling in priors," Robert countered. "Under strict CKR, the probability of reaching this node is zero. You can't condition on an impossibility. Bayes' rule breaks. You have no license to update to 'cooperative.' The only consistent belief is that I will defect, because anything else contradicts the common knowledge we started with."

  "But we aren't in a vacuum!" Cristina leaned forward. "We're playing a dynamic game. If I reach a node I thought was impossible, I need a theory of what happened. Maybe you made a mistake. Maybe you're testing me. If I assume 'mistake,' I might still cooperate to see if you continue. If you anticipate that cooperation, passing is rational. Your backward induction only works if you assume I punish deviations blindly. But why would I punish myself with a lower payoff if cooperation yields more?"

  "Because if you cooperate after a deviation, you incentivize the deviation!" Robert's hand tightened. "If passing signals 'I want to cooperate,' then rational players will pass to send that signal. But then the signal loses meaning. The only stable signal is 'I maximize utility,' which means taking the money. If I pass, I'm lying about my rationality. You know I'm lying. So you take."

  "That's the paradox!" Cristina laughed, frustrated. "You're saying I should ignore the evidence of my eyes because it contradicts the axiom. Binmore called this out. You're solving the game by assuming the game never happens. If I actually have to move, I need a conditional rationality. If you pass, I believe you're the type who passes. Therefore I pass. Therefore you should pass."

  Robert shook his head. "If you believe I'm the type who passes, you're admitting CKR was false at the start. You're saying 'I thought we were rational, but now I think you're altruistic.' But if I know you'll switch to that belief, I know you'll pass. But if you know I know that, you know I'll pass... wait." He paused. "No. If you switch beliefs, you're admitting uncertainty. CKR eliminates uncertainty. If there's uncertainty, backward induction doesn't apply, but neither does your cooperative equilibrium. It's just chaos."

  "Exactly," Cristina said softly. "It's chaos. So why cling to the induction? The theorem proves that CKR and extensive-form games are incompatible unless the game ends immediately. Since we haven't ended immediately, drop the CKR. Look at the money. Pass."

  Robert looked at the $120. Then at Cristina. "If I pass, I'm admitting the theorem is incomplete."

  "If you take," Cristina said, "you're admitting it's irrelevant."

  Robert sighed, pulled the pile toward him. "I'd rather be consistent than rich."

  "Then you're not rational," Cristina said, standing up. "You're just logical."
