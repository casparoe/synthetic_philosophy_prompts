answer: |-
  **The Peripheral Council**

  There is pressure on the third left. Salt, sharp, promising. The sucker-cups taste the water before the center knows there is water. The ganglion in the limb tightens. *Grab.*

  The command does not come from the knot. It comes from the flesh itself. The arm curls, blind and knowing, dragging the body toward the crevice.

  *Wait,* signals the optic lobe. *Light change. Shadow above.*

  The chromatophores flare—red, rust, sudden speckle—but the pattern is wrong. The skin on the right side flashes camouflage while the left side remains smooth white shock. The central brain tries to broadcast a uniform color, a unified signal to hide the whole, but the message lags. The nerves are too long. The processing is too local. By the time the order to *darken* reaches the tip of the fourth right, the tip has already decided to explore the sand.

  Hunger is not a single state. It is eight different hollows, plus one central ache.

  The third left has found the crab. It is crushing the shell. The taste of protein floods the local ganglia. A satisfaction ripples up the arm, a private joy the central brain only infers from the chemical shift in the blood. The center wants to retreat; the shadow is still there, a dark blot against the surface glare. The center contracts the mantle. *Jet. Escape.*

  But the third left refuses to let go.

  For a moment, the organism is not one thing. It is a tug-of-war between the knot in the head and the knot in the arm. The central brain fires inhibitory signals, demanding release, demanding unity of purpose. The arm's ganglia fire back, local reflexes locking the suckers against the central will. There is no "I" here to resolve the conflict. There is only the negotiation of force.

  The shadow passes. It was a bird, not a hand. The danger was false.

  The central brain relaxes, but the arm remains tight. The body drifts, half-hidden, half-exposed. The eyes rotate independently. The left eye watches the sand; the right eye watches the glass.

  Behind the glass, the Large Biped stands.

  The Biped taps the wall. A vibration shudders through the water. The skin ripples with involuntary waves of color—blue, then gold, then a rough texture of bumps. The Biped writes on a slate. The Biped looks for the eyes, searching for the window where the self lives. The Biped expects a single point of view, a unified theater where the lights are either on or off.

  The Biped does not understand that the lights are scattered.

  Inside the water, the experience is not a stream. It is a cloud of events. *Touch here. Salt there. Danger above. Food below.* These things happen almost simultaneously, but they are not stitched together into a single *now*. The central brain receives reports seconds after the limbs have acted. It is not a commander; it is a historian, compiling a narrative of actions already taken by the limbs.

  *We moved,* the center thinks.
  *No,* corrects the second right. *I moved. You followed.*

  The Biped leans closer. Breath fogs the glass. The Biped wants to know if there is pain. If there is fear. If the lights are on enough to matter.

  Fear is present, but it is localized. The mantle feels the pressure change and tightens. The arms feel the current shift and stiffen. But is there a singular *feeling* of fear? Or is there just the sum of eight defensive postures and one hormonal flush?

  The third left finally releases the crab shell. The hunger is sated locally. The signal drifts to the center: *Done.*

  The central brain integrates the data. It constructs a momentary coherence. For a second, the organism feels like a whole. The eyes focus on the same point. The skin synchronizes to a deep, uniform red. The jet propulsion engages.

  Movement.

  But as the water rushes over the gills, the unity fractures again. The arms trail behind, each tasting a different filament of the wake, each processing a different texture of the flow. The center plans the route, but the arms steer the micro-corrections.

  The Biped watches the retreat. The Biped sees an animal fleeing. The Biped sees a subject avoiding a stimulus.

  The Biped does not see the committee dissolving.

  In the dark of the den, the body settles. The eyes close. The arms do not sleep. They curl, they uncurl, they taste the rock they rest upon. They dream, perhaps, but not of running. They dream of gripping. The central brain sinks into blackness, unaware of the small movements continuing in the periphery.

  If the arm touches a predator while the brain sleeps, who wakes up?

  If the arm is cut, does the center scream, or does only the limb thrash?

  The water settles. The silt falls. There is no one home to notice the silence, only many parts listening to the dark.
