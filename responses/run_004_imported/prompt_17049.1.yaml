prompt: |-
  Me and my roommates share a jar for grocery money and some cash went missing. One roommate found a video that's pretty convincing proof our friend Jamie took it, but another roommate, who's been close with Jamie for like 15 years, wont even watch it. She just says "I know Jamie, there's no way he'd steal from us, so whatever that video shows, there's gotta be some other explanation, I don't even need to see it to know that." Part of me thinks that's an awful way to treat evidence, but if she genuinely does know Jamie that well, isn't she basically right that any "evidence" against him has to be misleading somehow? Isnt that sort of what knowing someone means? So is she actually reasoning fine, or is something wrong with it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Situation:**
      *   **Conflict:** Cash missing from a shared grocery jar.
      *   **Evidence:** A video found by one roommate that is "pretty convincing proof" Jamie took it.
      *   **The Skeptic:** Another roommate (let's call her Sarah) refuses to watch the video.
      *   **Sarah's Reasoning:** She knows Jamie (15 years friendship). She believes he is incapable of stealing from friends. Therefore, any evidence suggesting otherwise *must* have an alternative explanation, so she doesn't need to see it.
      *   **The User's Dilemma:** Is Sarah's reasoning valid (based on deep knowledge of character) or flawed (ignoring evidence)?

  2.  **Deconstruct Sarah's Argument:**
      *   *Premise 1:* I know Jamie very well (15 years).
      *   *Premise 2:* Based on this knowledge, Jamie would never steal from friends.
      *   *Conclusion:* Therefore, any evidence suggesting Jamie stole must be misleading/misinterpreted.
      *   *Action:* I will not examine the evidence.

  3.  **Evaluate the Reasoning (Philosophical/Logical/Psychological):**
      *   *Is knowing someone a shield against evidence?* No. People surprise us. Even close friends commit acts out of character due to stress, addiction, desperation, or hidden struggles.
      *   *Is refusing to look at evidence rational?* No. This is "willful blindness" or "confirmation bias." It prioritizes a prior belief over new data.
      *   *What does "knowing someone" mean?* It means having a strong *prior probability* about their behavior, not a certainty. It should make you skeptical of the accusation, not immune to the proof.
      *   *The "Get Out of Jail Free" Card:* If Sarah's logic holds, no amount of evidence could ever prove Jamie guilty. That makes her belief unfalsifiable, which is a logical fallacy.

  4.  **Identify the Core Issues:**
      *   **Epistemic Closure:** Refusing to update beliefs based on new information.
      *   **Loyalty vs. Truth:** Sarah is prioritizing loyalty (or her self-image of knowing Jamie) over the factual reality of the missing money.
      *   **The Nature of Evidence:** Evidence exists to test hypotheses. Ignoring it defeats the purpose.
      *   **Impact on the Group:** This creates division. One group trusts the video, one trusts the character assessment, and no shared reality is established.

  5.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge the user's confusion. It *feels* like loyalty, but it *acts* like denial.
      *   *Direct Answer:* No, she is not reasoning fine. There is a flaw.
      *   *Key Concept 1: Priors vs. Certainty.* Knowing someone gives you a strong *prior*, but not 100% certainty. Evidence should update the prior.
      *   *Key Concept 2: Unfalsifiability.* If you decide *beforehand* that evidence against X is invalid, you can never be wrong about X. That's not knowledge; it's faith.
      *   *Key Concept 3: Human Complexity.* People do out-of-character things. 15 years doesn't grant omniscience.
      *   *Key Concept 4: The Social Dynamic.* Refusing to watch is disrespectful to the other roommates and the process of finding truth.
      *   *Nuance:* Acknowledge that skepticism is good. Blindly trusting a video (could be deepfake, context missing) is also bad. But *refusing to look* is the specific error here.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but firm on the logic.
      *   Avoid attacking Sarah personally, focus on the reasoning pattern.
      *   Avoid declaring Jamie guilty (we don't know for sure), focus on the *process* of evaluation.

  7.  **Final Polish (incorporating specific points):**
      *   *Bayesian Updating:* Explain it simply. You start with a belief, evidence comes in, you adjust. She is refusing to adjust.
      *   *The "No True Scotsman" vibe:* "Jamie wouldn't do this, so if it looks like he did, it isn't really him/it's misunderstood."
      *   *Practical advice:* How to handle this with the roommate?

  8.  **Self-Correction/Edge Case Consideration:**
