answer: |-
  This is a classic conflict between **prior belief** (what you think you know about a person) and **new evidence** (what is happening right now).

  While your roommate's loyalty is understandable, her reasoning is logically flawed. She is engaging in what philosophers and psychologists call **willful blindness** or **epistemic closure**.

  Here is a breakdown of why her reasoning doesn't hold up, even if her intentions are good.

  ### 1. Knowledge vs. Certainty
  Your roommate is treating her 15-year friendship as **certainty**, when it is actually just a **strong probability**.

  *   **How reasoning should work:** "I know Jamie very well. It is highly unlikely he would steal. Therefore, I should be very skeptical of this video and look for alternative explanations."
  *   **How her reasoning works:** "I know Jamie very well. It is impossible he would steal. Therefore, any evidence to the contrary must be false, so I don't need to look at it."

  Knowing someone well gives you a strong "prior belief." In logic (specifically Bayesian reasoning), a strong prior belief means you require *more* evidence to change your mind than you would for a stranger. It does **not** mean you are immune to evidence. By refusing to watch the video, she is deciding that her prior belief is infallible.

  ### 2. The Trap of Unfalsifiability
  Her argument creates a logical loop where Jamie cannot be proven wrong.
  *   If there is no evidence, he is innocent.
  *   If there *is* evidence, she claims it must be misleading without examining it.

  If you decide in advance that *any* evidence against a person is automatically invalid, you aren't evaluating the truth; you are protecting a belief. This makes her position unfalsifiable. If nothing can prove her wrong, her belief isn't based on reason; it's based on faith.

  ### 3. People Are Complex (and Capable of Change)
  Fifteen years is a long time, but it does not grant omniscience. People are not static characters.
  *   **Hidden Struggles:** People often hide addiction, debt, mental health crises, or desperation from even their closest friends. Jamie might be going through something he hasn't told her.
  *   **Out-of-Character Actions:** Good people sometimes do bad things under specific pressures. To say "I know him, he wouldn't do this" assumes you know every variable of his current life, which is impossible.

  ### 4. Skepticism vs. Denial
  There is a healthy middle ground that your roommate is skipping.
  *   **Healthy Skepticism:** "This video is shocking. It conflicts with who I know Jamie to be. I need to watch it closely to see if there is context we are missing, if it's edited, or if there is another explanation."
  *   **Denial:** "I won't watch it because it contradicts my view of him."

  Your roommate isn't being skeptical; she is being dismissive. True skepticism requires examining the evidence to test its validity, not ignoring it to protect a reputation.

  ### 5. The Social Cost
  Beyond the logic, there is a relational problem. By refusing to engage with the evidence:
  *   **She invalidates the other roommates:** She is essentially saying, "My assessment of Jamie is more important than your missing money and your time spent finding this video."
  *   **She prevents resolution:** If the video *is* misleading, watching it might prove Jamie's innocence (e.g., it shows him putting money *back*). If she won't watch it, she can't defend him effectively; she can only defend her idea of him.
  *   **She enables potential harm:** If Jamie *did* take the money (perhaps due to a crisis), ignoring it prevents the group from addressing the real issue.

  ### Conclusion
  Your roommate is confusing **loyalty** with **truth-seeking**.

  She is reasoning that "Knowing someone means knowing they are incapable of bad things." That isn't what knowing someone means. Knowing someone means understanding their history, but acknowledging they are human.

  **She is not "basically right."** She is prioritizing her comfort and her self-image as a good judge of character over the reality of the situation. The rational approach is to watch the video with a critical eye, acknowledge the conflict between the evidence and her experience, and then decide—but refusing to look at the evidence is never the right move.
