      *   *Argument 3: The "Slippery Slope" of Selfhood.* If the counterpart relation isn't transitive, then *I* am not a unified subject across modal space. There is no "me" that could have had different properties, only a chain of overlapping similars. This undermines moral responsibility across counterfactuals.
      *   *Argument 4: The Preemptive Strike (Addressing the "Ordinary Reasoning" comeback).* Proponents say ordinary reasoning is local. I need to argue that ordinary reasoning is *inherently* chaining. Planning, regret, and historical explanation all rely on long chains.

