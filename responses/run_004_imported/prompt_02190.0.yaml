      *   *Key Point:* The distinction between *de re* modality (about the object) and *de dicto* (about the description). CT claims to save *de re*, but by making the relation intransitive, it effectively destroys the *res* (the thing) as a stable anchor.

  5.  **Refining the "Ordinary Reasoning" Counter-Counterargument:**
