  7.  **Self-Correction/Nuance Check:**
      *   *Wait, did Smolensky admit this?* Later, Smolensky and Legendre (2006) argued for the "Strong Integration Thesis," claiming the symbolic level *emerges* from the subsymbolic. I need to address that this emergence doesn't escape F&P if the emergent level is what does the cognitive work.
      *   *Make sure not to strawman connectionism.* Standard PDP is the target of F&P. TPR is a specific refinement. The argument is that TPR refines it *into* symbolic territory.
      *   *Key distinction:* F&P argue about the *necessity* of structure for systematicity. If TPR provides structure, it confirms the necessity, even if the medium is vector space.

  8.  **Drafting the Content (Mental or Scratchpad):**
