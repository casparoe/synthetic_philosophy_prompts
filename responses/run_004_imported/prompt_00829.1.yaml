answer: |-
  This is a fantastic historical vignette, but if you're looking for a "misunderstood genius persecuted by the establishment" narrative, **this is probably the wrong case study.**

  While your instinct about the timeline is correct (Lindemann proved $\pi$ transcendental in 1882), the conclusion that Wallis was "just guessing" doesn't hold up. Here's the breakdown of why the Hobbes-Wallis feud doesn't fit the "Galileo vs. The Church" archetype, and where the real story lies.

  ### 1. You don't need to know something is *impossible* to know a proof is *wrong*
  This is the critical mathematical distinction. Wallis never claimed to prove squaring the circle was impossible (he couldn't, because the tools didn't exist yet). He claimed that **Hobbes's specific proofs were logically invalid.**

  If I claim $2 + 2 = 5$ and write out a "proof" that divides by zero halfway through, you can correctly reject my proof without needing to know the fundamental properties of arithmetic. Hobbes's errors weren't subtle frontier mathematics; they were elementary geometric blunders. He was redefining terms mid-argument and making basic calculation errors. Wallis (and others, like Christiaan Huygens) didn't need to know the circle couldn't be squared to see that Hobbes's ruler was bent.

  ### 2. Hobbes wasn't a secret math genius
  Hobbes was a towering genius in political philosophy (*Leviathan* is still foundational), but he was a latecomer to mathematics (he discovered Euclid in his 40s) and he lacked the technical discipline.

  The feud lasted over two decades not because the establishment kept suppressing a breakthrough, but because Hobbes kept publishing new "solutions" that were all variations of the same errors. He became notoriously thin-skinned. When Wallis critiqued him, Hobbes responded with personal insults, claiming Wallis was part of a conspiracy to protect the universities. Hobbes wasn't the victim of a pile-on; he was the instigator who refused to accept correction.

  ### 3. Yes, there was "turf," but the math held up
  You are right that there was a social/political element.
  *   **The Establishment:** Wallis was a key figure in the early Royal Society and Oxford. They were trying to professionalize mathematics and distance it from natural philosophy.
  *   **The Outsider:** Hobbes was a materialist and a royalist in a time of religious and political upheaval. He viewed geometry as a tool for his broader philosophical system, not a standalone discipline.

  The Royal Society *did* try to sideline Hobbes, partly because he was difficult and partly because his materialism was viewed as atheistic. However, in this specific instance, the establishment was **mathematically correct.** If you frame this as "The Establishment was right, but for mixed reasons," it's nuanced. If you frame it as "Hobbes was right," it's historically inaccurate.

  ### 4. A Better Angle for Your Piece
  If you want to write about scientists fighting the establishment, Hobbes vs. Wallis is actually a cautionary tale about **when the outsider is just wrong.**

  However, if you want to keep the "establishment resistance" theme, consider these nuances:
  *   **The Sociology of Error:** Why did the Royal Society feel the need to crush Hobbes so thoroughly? It wasn't just about the math; it was about defining who was allowed to speak on science. Hobbes represented the "gentleman philosopher" model, while Wallis represented the emerging "professional specialist" model. The feud was a battle over the *authority* of science, not just the truth of geometry.
  *   **The "Right for the Wrong Reasons" angle:** Wallis defended orthodoxy, but he also defended rigor. Sometimes the establishment protects standards, even if their motivations are territorial.

  ### Summary
  *   **Was Wallis guessing?** No. He identified logical fallacies in Hobbes's proofs.
  *   **Was Hobbes a misunderstood genius?** No. He was a brilliant philosopher with a Dunning-Kruger problem in mathematics.
  *   **Is it a turf war?** Yes, but the turf defenders were mathematically right.

  **Recommendation:** If you use this story, frame it as the danger of philosophical arrogance encroaching on technical specialization. Hobbes thought his philosophical materialism gave him insight into geometry that the specialists lacked. It didn't. It's a great story about the limits of interdisciplinary overreach, rather than a story about persecution.

  **Alternative Cases:** If you need a genuine "establishment was wrong/suppressive" case in math/science from that era, look at:
  *   **Évariste Galois:** Actually ignored/rejected by the Academy (Cauchy/Legendre lost his papers), actually a genius, actually died young.
  *   **Ignaz Semmelweis:** (Later, 1840s) The classic establishment refusal to accept handwashing.
  *   **Barry Marshall:** (Modern) Drank H. pylori broth to prove ulcers weren't caused by stress; the medical establishment hated him for years.

  Hobbes is a fun story, but he's the villain of his own mathematical tragedy, not the hero.
