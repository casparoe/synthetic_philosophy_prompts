          *   *Diplomacy:* Often Email Game (back channels, confirmations). But summits try to create Muddy Children moments (joint press conferences).
      *   *Synthesis:* The Email Game is the cautionary tale. It warns that "almost CK" is not CK. But institutions design mechanisms (public rituals) specifically to bridge the gap (turn Email scenarios into Muddy Children scenarios).

