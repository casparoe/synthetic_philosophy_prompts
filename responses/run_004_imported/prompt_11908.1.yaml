      *   Also, ensure I emphasize that in Muddy Children, the *announcement* is the key variable, whereas in Email Game, the *protocol* is the constraint.

  10. **Final Polish:** Check for clarity on the "unraveling" logic in the Email Game, as that's the hardest part to grasp. (If I send 100 messages, I worry you only got 99. If you got 99, you worry I only got 98... down to 0).

