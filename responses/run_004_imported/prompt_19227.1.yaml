      *   Use specific Cartesian terms (*Res Cogitans*, *Res Extensa*, *Substantial Union*, *Clear and Distinct Ideas*).
      *   Connect back to AI concepts (AIXI, self-modeling, wireheading).

  9.  **Final Review against Constraints:**
