prompt: |-
  I'm working on a piece about that 2023 blowup in consciousness research -- the open letter where 124 scientists called Integrated Information Theory "pseudoscience." Digging through the citations, one of the big pieces of ammo was this thing called the "unfolding argument," which basically says you can always unfold a recurrent network into a feedforward one that produces the exact same behavior -- and since IIT says feedforward nets have zero phi (i.e. arent conscious) while the recurrent original supposedly was, that's apparently a huge problem. I get the basic setup but I don't really get why this is suppose to be so devastating rather than just a weird corner case IIT could shrug off. Can you walk me through the actual intuition for why this argument is considered such a serious (some say fatal) blow to IIT and theories like it, in plain terms -- no phi equations required?
