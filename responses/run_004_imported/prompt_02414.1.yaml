          *   *Recurrent:* You walk down a hallway, hit a mirror (loop), walk back to the map, check it, then exit.
          *   *Feedforward:* You walk down a long corridor that *looks* like the hallway, then a second section that *looks* like the hallway again. You never turn back.
          *   *Outside Observer:* Sees you enter, waits 10 seconds, sees you exit with the answer. Can't tell which path you took.
          *   *IIT Verdict:* Hallway with mirror = Conscious. Long Corridor = Unconscious.
          *   *Problem:* Why does the *shape* of the path matter if the *journey* is identical?

  5.  **Addressing the "Fatal" Aspect:**
      *   It's not just that IIT might be wrong about *which* systems are conscious.
