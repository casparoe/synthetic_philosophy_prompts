      *   *Weakness 2 (Self-Ownership):* Nozick assumes self-ownership entails full private property rights in external resources. Cohen argues you can own yourself but still have constraints on how you use external resources (world-ownership).
      *   *Weakness 3 (Rectification):* Real history is full of theft/conquest. Entitlement theory demands rectification, but we can't trace it. Does this collapse into a patterned principle (like Rawls') for practical purposes?
