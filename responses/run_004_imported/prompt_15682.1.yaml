answer: |-
  Here are 10 interview questions designed for a graduate seminar context. They move from the internal coherence of the theory to its external application, specifically targeting the vulnerabilities in the "liberty upsets patterns" defense.

  ### 1. The Definition of "Pattern" (Cohen's Procedural Critique)
  **Question:** Nozick argues that any patterned principle of justice (like equality) must be continuously violated by free exchanges, requiring constant interference with people's lives. However, G.A. Cohen argued that a pattern doesn't have to be an *end-state* imposed after the fact; it could be built into the *background rules* of transfer themselves. If the rules of the game are structured so that voluntary transactions naturally sustain a specific distribution without ex-post interference, does "liberty upsets patterns" still hold, or does it just reveal a bias against specific *types* of background rules?

  **Follow-up:** If you say those background rules restrict liberty, aren't property rights themselves background rules that restrict liberty? Why is a rule preventing accumulation more liberty-violating than a rule enforcing it?

  ### 2. Self-Ownership vs. World-Ownership
  **Question:** A central pillar of your defense is that individuals own themselves and their talents, and therefore own what they produce. But Cohen distinguishes between self-ownership and *world-ownership*. I can own my hands (self-ownership) without owning the raw materials I touch (world-ownership). Why does owning my talent necessarily entail full private property rights in the external resources required to monetize that talent? Couldn't I own my labor while still being a joint tenant of the earth?

  **Follow-up:** If we are joint tenants of the earth, doesn't the Wilt Chamberlain example change? If the audience pays Wilt from a resource pool we all co-own, doesn't Wilt need *our* permission to appropriate that wealth, not just his own?

  ### 3. The Lockean Proviso in a Finite World
  **Question:** Nozick limits acquisition via the Lockean Proviso: appropriation is just only if it leaves "enough and as good" for others. In a world of finite resources and ecological limits, almost every significant appropriation worsens the position of latecomers. At what point does the Proviso trigger a requirement for redistribution that looks functionally identical to the patterned principles you reject?

  **Follow-up:** If the Proviso requires compensation for worsening another's position, isn't that compensation determined by the *outcome* for the loser, effectively making the justification consequentialist rather than historical?

  ### 4. The Non-Identity of Historical Holdings
  **Question:** Entitlement theory relies on a chain of just transfers starting from a just acquisition. But as you know, almost no current holdings can be traced back to a just original acquisition without a history of conquest or theft. If the historical chain is broken, the theory demands rectification. But if we cannot identify the specific victims and perpetrators, how does the theory generate *any* action-guiding norms for current holdings?

  **Follow-up:** If the theory cannot identify specific claims, are we not forced to treat all current holdings as "tainted" until proven otherwise, which seems to reverse the burden of proof Nozick intends?

  ### 5. Rectification as a "Difference Principle" Stopgap
  **Question:** This follows on the previous point. If we cannot trace historical injustices to apply rectification, Nozick suggests we might need to use a "rough rule of thumb." Given that the worst-off in society are often the descendants of the historically exploited, isn't the only coherent "rough rule of thumb" for rectification something very close to Rawls's Difference Principle? Is Entitlement Theory secretly leaning on Patterned Principles as a practical stopgap?

  **Follow-up:** If the practical application of Entitlement Theory converges on Rawlsian distribution due to historical messiness, what work is the Entitlement theory actually doing other than providing a different moral narrative for the same checks?

  ### 6. Taxation and Forced Labor
  **Question:** Nozick famously equates taxation of earnings from labor with forced labor, arguing it appropriates a portion of the person's time. But this assumes that the *full* market value of my labor is generated by me alone. Given that market value depends on social infrastructure, legal enforcement, and the demand created by others' wealth, why am I entitled to 100% of the marginal product rather than the portion attributable strictly to my physical exertion?

  **Follow-up:** If I claim 100% of the value, aren't I implicitly claiming ownership over the social conditions that made that value possible, which violates the self-ownership of my neighbors who built those conditions?

  ### 7. Democracy vs. Rights
  **Question:** You defend the Minimal State as the only state compatible with liberty. But in a democracy, citizens collectively choose to constrain their own liberty to secure social goods. If "liberty upsets patterns," why doesn't "democracy upset the Minimal State"? If a majority voluntarily chooses to tax themselves for healthcare, are you overriding *their* liberty to protect *their* property rights? Which liberty trumps?

  **Follow-up:** If you say property rights trump democratic choice, aren't you admitting that "liberty" isn't the ultimate value, but rather a specific *regime of property* is the ultimate value?

  ### 8. The Moral Arbitrariness of Acquisition
  **Question:** Nozick rejects patterned principles because they ignore historical entitlement. But original acquisition is often determined by brute luck (who got there first, who had the better technology). If the initial distribution of external resources is morally arbitrary, why does the historical process legitimize the inequalities that flow from it? Why does "I got here first" carry more moral weight than "We need this to survive"?

  **Follow-up:** If the initial acquisition is arbitrary, doesn't the historical chain merely transmit that arbitrariness forward, making the resulting entitlements morally suspect regardless of the voluntary nature of subsequent transfers?

  ### 9. Global Entitlement
  **Question:** Entitlement theory is usually applied within nation-states. But property rights and acquisition happen globally. If a corporation in a developed nation appropriates resources in a developing nation through a chain of transfers that were legal but coerced by economic necessity, does Entitlement Theory demand global rectification? If so, doesn't this require a global authority that violates the sovereignty of the Minimal State?

  **Follow-up:** If you deny global rectification, are you not treating borders as morally significant in a way that contradicts the universalism of natural rights?

  ### 10. The Function of "Liberty" in the Argument
  **Question:** To wrap up: In the Wilt Chamberlain argument, "liberty" seems to function specifically as the freedom to transfer property rights. If we defined liberty as "freedom from domination" or "freedom to act without desperate economic necessity," the Chamberlain exchange might look coercive rather than free. Is your defense of Entitlement Theory ultimately just a stipulative definition of liberty that begs the question against egalitarians?

  **Follow-up:** If liberty is just the absence of interference with property, isn't the argument tautological? i.e., "Property rights are paramount because liberty is paramount, and liberty is defined as respecting property rights."
