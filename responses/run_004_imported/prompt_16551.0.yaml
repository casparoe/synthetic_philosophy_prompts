prompt: |-
  I chair our department's colloquium series, and next month's invited speaker is a philosopher whose recent work argues that evidential cooperation in large worlds (ECL) gives us practical reason to act cooperatively toward agents who hold value systems other than our own — even though we cannot causally affect them — provided the universe or multiverse is large enough to contain many other agents reasoning in relevantly similar ways. Pressed on why any of this should matter absent a causal channel, she tends to reply that what needs to correlate across a large world is the decision procedure, not the object-level values, so it does not matter who is actually "out there." Draft eight to ten questions for the Q&A that go beyond having her restate the view: I want at least one question on what actually licenses confidence that our reasoning correlates with these agents rather than the correlation being merely stipulated, one on whether the superrationality machinery is doing any work that a simpler heuristic such as a moral parliament could not do on its own, and one on how, in practice, we are supposed to identify what "cooperating" with agents whose values we cannot observe even amounts to. For each, include a follow-up keyed to the answer she is most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a department colloquium series.
      *   **Speaker:** A philosopher working on Evidential Cooperation in Large Worlds (ECL).
      *   **Core Thesis:** ECL gives practical reason to cooperate with agents holding different value systems in a large universe/multiverse, even without causal contact, based on correlated decision procedures.
      *   **Speaker's Typical Defense:** Correlation is in the *decision procedure*, not object-level values; it doesn't matter who is "out there."
      *   **Task:** Draft 8-10 Q&A questions.
      *   **Constraints:**
          *   Go beyond restating the view.
          *   Must include specific questions on:
              1.  Licensing confidence in correlation (vs. stipulation).
              2.  Superrationality vs. Moral Parliament (is the machinery necessary?).
              3.  Practical identification of "cooperation" with unobservable agents.
          *   Each question needs a follow-up keyed to the *most likely answer*.

  2.  **Deconstruct ECL (Evidential Cooperation in Large Worlds):**
      *   *Background:* This is rooted in acausal decision theory (EDT/CDT/TDT/FDT debates), specifically applied to cosmology/multiverse scenarios. It's often associated with Effective Altruism and Longtermism circles (e.g., Oesterheld, Conitzer, MacAskill).
      *   *Mechanism:* If the universe is huge, there are likely copies or near-copies of me making similar decisions. If I cooperate, they likely cooperate. This creates acausal trade benefits.
      *   *Key Tension:* How do we know we are correlated? What counts as "similar reasoning"? How do we trade with people we can't talk to?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Correlation Confidence.*
          *   *Draft:* How do you know we correlate?
          *   *Refinement:* Needs to challenge the "stipulation" aspect. Is it an empirical claim or a normative assumption?
          *   *Follow-up:* She will likely say it's about logical similarity. Push on the reference class problem.

      *   *Requirement 2: Superrationality vs. Moral Parliament.*
          *   *Draft:* Why not just use a moral parliament?
          *   *Refinement:* Moral Parliament (MacAskill) handles normative uncertainty. ECL handles acausal partners. Is the complex decision theory adding value over just "being nice to everyone just in case"?
          *   *Follow-up:* She will likely say ECL provides *strength* of reason, not just possibility. Push on whether that strength is action-guiding.

      *   *Requirement 3: Practical Identification of Cooperation.*
          *   *Draft:* How do we know what to do?
          *   *Refinement:* If we can't observe them, how do we know what they value? Is "cooperation" just doing what we think they want?
          *   *Follow-up:* She will likely say "focus on shared meta-values." Push on the risk of projection bias.

      *   *Requirement 4: The "Large World" Assumption.*
          *   *Idea:* What if the universe isn't large enough? Does the obligation vanish?
          *   *Follow-up:* She'll say it's probabilistic. Push on the sensitivity of the argument to cosmological models.

      *   *Requirement 5: Decision Procedure Granularity.*
          *   *Idea:* How similar must the reasoning be? Does a utilitarian correlate with a Kantian?
          *   *Follow-up:* She'll say "relevantly similar." Push on where the cutoff lies.

      *   *Requirement 6: Exploitation/Defection Risks.*
          *   *Idea:* What if they defect while I cooperate?
          *   *Follow-up:* She'll say correlation prevents this. Push on the asymmetry of information.

      *   *Requirement 7: Normative Force vs. Prudence.*
          *   *Idea:* Is this morality or just selfishness in disguise?
          *   *Follow-up:* She'll say it's pragmatic reason. Push on whether it displaces genuine altruism.

      *   *Requirement 8: The "Who is Out There" Claim.*
          *   *Idea:* She says it doesn't matter who is out there. But doesn't the *distribution* of values matter for the trade volume?
          *   *Follow-up:* She'll say the *fact* of correlation matters. Push on the expected value calculation.

      *   *Requirement 9: Computational Tractability.*
          *   *Idea:* Can humans actually calculate this?
          *   *Follow-up:* She'll say use heuristics. Push on which heuristics are safe.

      *   *Requirement 10: Conflict with Causal Duties.*
          *   *Idea:* What if ECL conflicts with helping people here and now?
          *   *Follow-up:* She'll say weigh the expected values. Push on the risk of neglecting the observable.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific required topics included? Yes. Follow-ups included? Yes. Tone appropriate for a colloquium (respectful but probing)? Yes.
      *   *Self-Correction on Follow-ups:* Ensure the follow-up anticipates the *standard* ECL defense (usually based on logical decision theory or functionalism) and presses the weak point of that defense.

  5.  **Final Polish:**
      *   Make sure the phrasing is precise (e.g., distinguishing between "causal" and "evidential" links).
      *   Ensure the "Moral Parliament" question clearly distinguishes normative uncertainty from acausal uncertainty.
      *   Ensure the "Correlation" question targets the reference class problem.

  6.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  Here are ten questions designed for the Q&A session, including the three specific topics you requested. Each includes a follow-up tailored to the speaker's likely theoretical defenses.

  **1. The Licensing of Correlation (Required Topic)**
  "You argue that what correlates across the large world is the *decision procedure* rather than object-level values. But what licenses the confidence that my decision procedure is actually correlated with distant agents rather than this correlation being merely stipulated by the model? If I adopt a decision procedure that says 'cooperate,' but the distant agent adopts one that says 'defect against cooperators,' the evidential link breaks. How do we non-arbitrarily select the reference class of agents with whom we are correlated without begging the question?"
  *   **Follow-up:** "You will likely appeal to logical similarity or functional isomorphism. But given that human reasoning is heuristically messy rather than logically rigid, isn't the degree of correlation an empirical claim about cognitive science and cosmology that we currently lack the data to support, rather than a purely philosophical premise?"

  **2. Superrationality vs. Moral Parliament (Required Topic)**
  "Nick Bostrom and William MacAskill have previously discussed frameworks like the 'Moral Parliament' to handle normative uncertainty—essentially acting as if you represent various moral theories to avoid backing the wrong one. Does the machinery of evidential cooperation and superrationality actually do any work that a simpler heuristic of 'moral humility' or a Moral Parliament could not do on its own? If the practical output is simply 'don't be dogmatic and leave room for other values,' why do we need the heavy metaphysics of acausal trade?"
  *   **Follow-up:** "If you reply that ECL provides a stronger *prudential* incentive than mere moral humility, does this not risk crowding out genuine moral motivation? If I cooperate only because it evidentially benefits my values in the large world, have I really accepted the *moral* claim that other values matter?"

  **3. Identifying Cooperation with Unobservable Agents (Required Topic)**
  "In standard trade, agents signal preferences and enforce contracts. In ECL, we cannot observe these agents, let alone communicate with them. In practice, how are we supposed to identify what 'cooperating' with agents whose values we cannot observe actually amounts to? If I sacrifice resources here to 'cooperate' with a distant paperclip maximizer, but they do not reciprocate because they do not recognize my sacrifice as cooperation, haven't I simply incurred a cost for no gain?"
  *   **Follow-up:** "You might suggest we focus on 'meta-cooperation' or shared structural values. But doesn't this rely on a projection bias where we assume distant agents value 'fairness' or 'reciprocity' simply because *we* value them, thereby undermining the claim that we are cooperating with genuinely *different* value systems?"

  **4. The Granularity of Decision Procedures**
  "You emphasize that correlation holds at the level of the decision procedure. However, decision procedures can be described at varying levels of granularity. I might be running 'Act Utilitarianism,' while a distant agent is running 'Maximize Expected Value.' At what level of abstraction must our algorithms match for the evidential link to hold? If the bar is too high, cooperation vanishes; if it is too low, the correlation becomes trivial."
  *   **Follow-up:** "If you argue that the relevant level is 'rational agency' itself, does this not collapse ECL into a form of Kantian universalism, rendering the 'large world' cosmological premise unnecessary for the normative conclusion?"

  **5. Sensitivity to Cosmological Models**
  "The strength of the evidential link presumably scales with the size of the universe and the density of reasoning agents. If future cosmology suggests a smaller universe, or one less hospitable to life than current multiverse hypotheses suggest, does your practical recommendation change? Is the obligation to cooperate contingent on the success of specific inflationary models?"
  *   **Follow-up:** "If you say we should act on the *probability* of a large world, how do we weigh this against high-confidence causal opportunities? Are we not risking significant causal good for speculative acausal gains based on unsettled physics?"

  **6. The Problem of Asymmetric Information**
  "In causal trade, parties often have asymmetric information, which can lead to market failure. In ECL, the asymmetry is total: I cannot know if the other agents exist, what they value, or if they are even reasoning correctly. Does this asymmetry create a 'lemons problem' where the only agents I correlate with are those making the same epistemic errors I am, potentially amplifying bias rather than correcting it?"
  *   **Follow-up:** "You might argue that rational agents converge on truth. But if the mechanism relies on *similarity* of reasoning, doesn't that incentivize insularity? To maximize correlation, shouldn't I try to make my reasoning as average as possible rather than as correct as possible?"

  **7. Defection and Punishment**
  "In iterated causal games, defection is discouraged by the threat of future punishment. In ECL, there is no causal channel for punishment. If a subset of agents in the multiverse decides to 'defect' (i.e., take the benefits of others' cooperation without reciprocating), what mechanism disincentivizes this? Without enforcement, isn't 'cooperate' an unstable equilibrium?"
  *   **Follow-up:** "If your answer is that a rational agent simply *sees* that defection lowers expected value across the correlation, does this not assume that all agents have already accepted ECL? How does the norm get started among agents who haven't yet read your paper?"

  **8. The "Who Is Out There" Claim**
  "You have suggested that it does not matter who is actually 'out there,' only that *someone* is reasoning similarly. However, the expected value of cooperation depends heavily on the *values* of those partners. If the universe is large but populated mostly by agents with values orthogonal to or hostile to mine, does the ECL argument still generate a reason to cooperate, or does it generate a reason to hide?"
  *   **Follow-up:** "If you maintain that we should cooperate regardless of the distribution of values, are you not effectively arguing for a form of value agnosticism that contradicts the premise that we are trying to promote our own values through this cooperation?"

  **9. Computational Tractability for Humans**
  "ECL seems to require calculating expected utilities across a vast hypothesis space of possible agents and decision theories. Given human cognitive limitations, we cannot perform these calculations. Are we therefore obligated to adopt a crude heuristic? If so, which heuristic is the 'correct' one to correlate with, and how do we avoid a regress where we need a theory to select the heuristic?"
  *   **Follow-up:** "If you suggest we use 'common sense' morality as the heuristic, hasn't the ECL framework become epiphenomenal? It would mean the work is being done by our existing moral intuitions, with ECL merely providing a post-hoc justification."

  **10. Conflict with Causal Duties**
  "Finally, consider a conflict case. Suppose I have resources that could causally save a life in my immediate vicinity, or I could invest them in a project that promotes 'acausal cooperation' (e.g., researching decision theory) which might benefit agents in the large world. Does ECL imply that the potential magnitude of the large world *always* swamps local causal duties? If not, where is the cutoff?"
  *   **Follow-up:** "If you argue for a weighted balance, doesn't the sheer potential size of the multiverse almost mathematically guarantee that acausal duties dominate, effectively rendering our causal obligations to neighbors negligible?"
