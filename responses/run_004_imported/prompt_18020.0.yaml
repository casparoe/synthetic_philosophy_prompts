answer: |-
  The marsh held its breath, a vast expanse of cordgrass and still water under a pale autumn sky. Inside the blinds, the air smelled of damp canvas and old coffee. Elias adjusted the focus on the spotting scope, his knuckles swollen from decades of holding binoculars steady against the wind. Beside him, Mara, his former grad student turned colleague, tapped her pen against her notebook.

  "Ready?" she asked.

  "Run it," Elias said.

  Mara triggered the mechanism. A cardboard silhouette, painted with the rough approximation of a Cooper's hawk, swept across the wire above the reeds. Instantly, the marsh wrens erupted. A sharp, metallic *chink* sliced through the silence, followed by the frantic rustling of birds diving into cover.

  Elias lowered the scope. "Classic producer-consumer dynamics. The caller signals danger; the others hide. Everyone survives to reproduce. The selected function is clear."

  "But look at the second trial," Mara said, rewinding the data on her tablet. "Yesterday, when that plastic bag got caught in the updraft? Same call. Same intensity."

  Elias grunted. "The bag isn't a hawk."

  "It triggered the mechanism," Mara countered. "Just like the BB pellet triggers the frog's tongue. If the neural pathway fires for both, why isn't the content of the signal 'hawk-or-large-moving-shadow'? Why insist it's just 'hawk' and call the bag response a mistake?"

  This was the itch that had followed Elias into retirement. Ruth Millikan's teleosemantics argued that meaning wasn't about what *did* trigger a signal, but what the system was *selected* to track over evolutionary time. The frog's tongue was selected for flies, not BBs. Therefore, snapping at a BB was a misrepresentation, an error. But the disjunction problem nagged at the edges: why not say the system was always designed for the broader category?

  "Because normativity requires the possibility of failure," Elias said, his voice rough. "If the content is 'hawk-or-bag,' the bird is never wrong. It's just a detector. But evolution builds systems that can fail. That's the point of the theory."

  "Is it?" Mara pointed out the window. A drone, likely from a nearby farm, buzzed low over the water. It cast a shifting shadow, rhythmic and dark.

  The wrens screamed. The alarm call rang out, identical to the hawk response.

  Mara looked at him, eyes challenging. "The drone is neither hawk nor bag. It's a new thing. The mechanism is doing exactly what it was built to do: detect aerial threats of a certain velocity and size. If you say it's an error, you're privileging the past over the present utility. Maybe the content was always 'aerial-threat-equivalent.' Maybe we're the ones misrepresenting the signal by narrowing it to 'hawk.'"

  Elias watched the wren perched on a dry stalk, chest heaving. The bird was vibrating with biological urgency. It believed, in some primal sense, that death was swooping down. But death wasn't coming. Only a machine collecting crop data.

  If Elias accepted Mara's view, the signal was veridical. The bird was telling the truth about a dangerous object. But if he accepted Millikan, the bird was lying. It was producing a representation that failed to map onto the specific condition its consumers were adapted to evade. The other wrens were hiding from a predator that wasn't there. They were wasting energy, losing feeding time, operating on false information.

  The drone drifted away, indifferent. The wren fell silent, twitching its tail.

  Elias felt the weight of the choice. It wasn't just about birds; it was about how life grounds meaning. If meaning is just whatever triggers a reaction, then nothing is ever truly mistaken, only mismatched. But if meaning is tied to history, to the long chain of survival that shaped the neuron and the gene, then error is real. The bird was wrong.

  He looked at Mara. She wanted the world to be inclusive, to let the signal mean what it covered in the present moment. But Elias had spent forty years watching things die because they failed to distinguish the real from the fake.

  "The consumers aren't selected to hide from drones," Elias said quietly. "They're selected to hide from hawks. When they hide from a drone, they are acting on a falsehood. The system malfunctioned."

  "So it's an error?" Mara asked.

  "It's an error," Elias confirmed, marking the data sheet. "The content is fixed by the past, not the trigger. The bird thinks it's a hawk. It isn't."

  He capped his pen. It felt like a harsh judgment to pass on the little creature shivering in the reeds, calling out a lie to save its kin. But without the possibility of that lie, without the strict boundary of what the signal was *for*, there was no truth either. There was only noise. Elias turned back to the scope, watching for the next shadow, guarding the distinction between the real and the fake.
