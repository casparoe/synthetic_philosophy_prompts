answer: |-
  This is a fantastic angle for a high school paper. You have correctly identified that the "Standard Teleosemantic Reply" (which relies on distinguishing *normal* vs. *abnormal* conditions to rule out BBs as errors) often begs the question. It assumes we already know what the mechanism is *for* in order to define what the normal conditions are.

  The argument you are looking for is often called the **Indeterminacy of Selection** problem (sometimes associated with Jerry Fodor's critique of teleosemantics in *A Theory of Content and Beyond*).

  Here is a structured argument you can adapt for your paper. It focuses on why selection history is "extensionally blind" and cannot distinguish between co-extensive properties in the ancestral environment.

  ***

  ### Title Idea: The Blind Watchmaker's Semantics: Why Selection History Cannot Fix Content

  #### 1. The Teleosemantic Promise
  Start by briefly defining the goal. Teleosemantics (Millikan, Dretske, Papineau) attempts to solve the problem of mental representation by grounding it in biology.
  *   **The Claim:** A mental state represents $X$ because the mechanism producing that state was *selected for* tracking $X$.
  *   **The Frog Case:** The frog's visual neuron fires. Teleosemantics says it represents **FLY** because the snapping mechanism was evolutionarily selected to catch flies to sustain the frog's lineage. When it snaps at a BB, it is "misrepresenting" because the mechanism is malfunctioning relative to its proper function.

  #### 2. The Problem of Co-Extensionality in the EEA
  This is the core of your argument. You need to argue that natural selection tracks *causal outcomes* (survival/reproduction), not *semantic descriptions*.

  In the Environment of Evolutionary Adaptedness (EEA)—the historical period where the frog's visual system evolved—the following correlation held true:
  *   Every **Fly** was a **Small Dark Moving Thing (SDMT)**.
  *   Almost every **SDMT** the frog encountered was a **Fly**.

  In logical terms, the property *being a fly* and the property *being an SDMT* were **co-extensive** in the frog's ancestral history.

  **The Argument:**
  1.  Natural selection selects for traits that increase reproductive fitness.
  2.  In the EEA, snapping at Flies increased fitness.
  3.  In the EEA, snapping at SDMTs *also* increased fitness (because, historically, SDMTs = Flies).
  4.  Therefore, the genetic propensity to snap at Flies and the genetic propensity to snap at SDMTs would spread through the population at the **exact same rate**.
  5.  Selection history records *that* the trait was advantageous, but it does not record *under which description* the trait was advantageous.

  #### 3. Why "Proper Function" Remains Indeterminate
  Teleosemantics relies on the notion of a "Proper Function." Millikan defines this as the effect a trait performed in the past that explains its current existence.

  However, you must argue that there are **two competing explanations** for the trait's existence that are empirically identical:
  *   **Hypothesis A:** The mechanism exists because ancestors caught **Flies**.
  *   **Hypothesis B:** The mechanism exists because ancestors caught **SDMTs**.

  Since there were no BBs in the swamp 5 million years ago, there is no historical data point to distinguish Hypothesis A from Hypothesis B. Both are perfectly supported by the evolutionary record.

  If you ask, "Why did this gene survive?" the answer "Because it caught flies" is true. But the answer "Because it caught small dark moving things" is *equally* true. Teleosemantics needs one to be the *real* content and the other to be accidental. But evolution provides no metaphysical ground to privilege one over the other.

  #### 4. Critiquing the "Normal Conditions" Defense
  You mentioned you don't want the standard malfunction answer. Here is how you critique it.

  Teleosemanticists often reply: *"We define 'Normal Conditions' as the conditions under which the mechanism historically performed its function. Historically, the mechanism interacted with flies, not BBs. Therefore, the content is FLY."*

  **Your Counter-Argument:** This is circular.
  To define the "Normal Condition" as "involving flies," you have to *already assume* that the mechanism's function is to detect flies.
  *   If the function is to detect **SDMTs**, then the "Normal Condition" is simply "presence of an SDMT."
  *   In that case, snapping at a BB is **not** a malfunction. It is a successful performance of the function "Detect SDMT." The frog gets no nutrition, but the *representation* was accurate (it represented an SDMT, and there was an SDMT).

  By appealing to "Normal Conditions" to rule out BBs, the teleosemanticist is smuggling in the conclusion they are trying to prove. They are assuming the content is FLY to define the conditions, rather than deriving the content FLY from the conditions.

  #### 5. The "Grue" Problem for Evolution
  You can strengthen this by referencing Nelson Goodman's "New Riddle of Induction" (the Grue problem), applied to evolution.
  *   Just as we cannot logically prove the future will be "green" rather than "grue" (green until time $t$, then blue) based solely on past observations...
  *   ...We cannot logically prove the selected property was "Fly" rather than "SDMT" based solely on past selection history.

  Selection is blind to intensional differences (differences in meaning) when there is no extensional difference (difference in actual objects) in the historical record.

  #### 6. Conclusion: The Disjunction Problem Re-introduced
  Conclude by stating that teleosemantics promises to solve the disjunction problem (the problem of how a symbol means *Cow* and not *Cow-or-Horse-in-the-dark*).

  However, by pushing the problem back to evolutionary history, they haven't solved it; they've just moved it.
  *   **Standard Disjunction:** Does the symbol mean FLY or (FLY-or-BB)?
  *   **Teleosemantic Disjunction:** Does the *selection history* select for FLY or (FLY-or-SDMT)?

  Since the history is compatible with both, the content remains indeterminate. If content is indeterminate for a simple innate frog detector, teleosemantics fails to naturalize determinate mental content.

  ***

  ### Key Philosophical References for Your Bibliography
  If you want to cite specific philosophers who make this move (to show your teacher you did the reading):

  1.  **Jerry Fodor:** Specifically *A Theory of Content and Beyond* (1990). Fodor argues that teleosemantics cannot distinguish between co-extensive properties in the selection history. He calls this the problem of "distal content."
  2.  **Karen Neander:** She is a major defender of teleosemantics. Looking up critiques *of* Neander regarding "Indeterminacy of Function" will give you the counter-arguments to anticipate.
  3.  **David Papineau:** He acknowledges this problem and tries to solve it via "consumer systems" (what the brain does *after* the detection), but you can argue that just pushes the problem further down the line.

  ### Why This Works for Your Paper
  *   **It's Specific:** It moves beyond "Swampman" (which is about history vs. structure) to "Indeterminacy" (which is about the ambiguity of history itself).
  *   **It's Internal:** You aren't saying evolution is fake; you are saying evolution lacks the granularity to fix *semantic* content.
  *   **It's Strong:** It attacks the necessary condition for teleosemantics (that selection fixes function) rather than just pointing out weird edge cases.

  This argument essentially claims that **causation is not enough for representation.** Even if flies *caused* the selection of the gene, that doesn't mean the gene is *about* flies specifically, rather than the sensory features of flies. And since teleosemantics relies entirely on that causal history, it cannot bridge the gap.
