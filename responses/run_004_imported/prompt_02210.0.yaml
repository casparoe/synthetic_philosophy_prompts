      *   *Standard Reading:* Animals are mere means. The content of the duty is determined solely by what preserves human moral sensitivity.
      *   *Colleague's Challenge:* The content of the duty seems to depend on the animal's intrinsic properties (suffering, loyalty, service). This looks like direct duty disguised as indirect duty.

