          *   *Verdict:* Ingrid has the stronger Dennettian counter here. Implementation details don't negate pattern reality (see: chess computers).
      *   *Move 2 (Ingrid):* "Standard proves too much... we don't crack open skulls... belief-desire description doing real predictive work."
