          *   **Morgan's Canon Application:** For jays, we worry about over-attributing cognition. For LLMs, we worry about *under*-attributing complexity (thinking it's just lookup) or *over*-attributing agency (thinking it cares).
      *   *Verdict:* It feels the same (behavioral inference), but the *grounding* of the intentionality is different. Biological intentionality is underwritten by natural selection for truth-tracking. AI intentionality is underwritten by statistical correlation for text-prediction.

