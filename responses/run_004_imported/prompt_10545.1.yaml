answer: |-
  Here are eight interview questions tailored to your guest's position, including the required topics and targeted follow-ups.

  **1. The Coherence of Probability without Propositions**
  You accept Lewis's 1976 triviality result as a proof that no proposition can satisfy the equation $P(\text{if } A, C) = P(C|A)$. But standard probability theory is defined over a sigma-algebra of propositions—truth-bearers that can be negated and conjoined. If you deny that the indicative conditional expresses a proposition, isn't the left-hand side of that equation, $P(\text{if } A, C)$, a category mistake? How can we assign a probability value to something that, by your lights, lacks a truth value to be probable *of*?

  *   **Follow-up:** You'll likely reply that this measures "degree of acceptability" rather than "probability of truth." But if acceptability doesn't obey the standard axioms of probability (specifically additivity), are we still doing formal epistemology, or have we simply changed the subject to a psychology of assertion?

  **2. The Embedding Problem**
  If indicatives lack truth conditions, they shouldn't be able to function as arguments for truth-functional operators. Yet, in natural language, we routinely negate conditionals ("It's not the case that if it rains, the match is cancelled") or embed them in antecedents ("If, if it rains, the match is cancelled, then we should move it indoors"). How does your account recover the meaning of these compounds if the embedded conditional contributes no truth value for the operator to act upon?

  *   **Follow-up:** I anticipate you'll appeal to a suppositional account of negation or a pragmatic denial. But does this force you to admit that the logic of indicatives is fundamentally weaker than classical logic, limiting its utility in formal modeling?

  **3. Gibbard's "Sly Pete" and Third-Party Learning**
  In Gibbard's riverboat case, two informants with different evidence assert flatly incompatible indicatives about the same hand ("If Pete called, he won" vs. "If Pete called, he lost"). On your view, neither is false. However, a third party receiving both reports doesn't treat them as merely compatible subjective impressions; they treat them as jointly informative evidence about the game's structure. If the conditionals don't describe the world, what exactly is the third party learning that allows them to update their credences?

  *   **Follow-up:** If you say they are learning about the *informants'* information states, doesn't that reduce the conditionals to reports of evidence rather than guides to the world, undermining their role in deliberation?

  **4. Sorting Indicatives from Counterfactuals**
  You maintain a dual semantics: indicatives are non-truth-conditional (Ramsey/Adams), while counterfactuals are truth-conditional (Stalnaker/Lewis). But outside of constructed minimal pairs, natural language moods are notoriously ambiguous; speakers often use indicatives where counterfactuals seem appropriate and vice versa. What is your principled, non-circular criterion for sorting a specific utterance into the "truth-conditional bin" versus the "assertability-conditional bin"?

  *   **Follow-up:** If the criterion relies on the speaker's epistemic stance (e.g., whether they treat the antecedent as open), how do you handle cases where the speaker is mistaken about their own epistemic state or the context shifts mid-sentence?

  **5. Decision Theory Implications**
  Your semantic split mirrors the split in decision theory: Evidential Decision Theory relies on conditional probabilities $P(O|A)$, while Causal Decision Theory relies on counterfactuals. If indicatives truly lack truth conditions, does this imply that EDT is not actually evaluating the *truth* of a strategy, but merely its assertability? Does this semantic view force us to treat EDT as a normative theory of reasoning rather than a theory of rational choice?

  *   **Follow-up:** If EDT is just about reasoning norms, does it lose its claim to be a rival *decision* theory, becoming instead a heuristic for agents who cannot access causal structure?

  **6. Conditionalizing on Conditionals**
  In Bayesian updating, we conditionalize on propositions we learn to be true. If I hear a trusted expert assert "If A, C," and I want to incorporate this into my belief state, I cannot simply conditionalize on the content, since you say it has no truth conditions. What is the formal rule for updating on a non-propositional conditional? Are we forced into Jeffrey Conditioning or something more exotic?

  *   **Follow-up:** If the update rule depends on the *context* of the assertion rather than the content, doesn't that make belief convergence between agents significantly harder to model formally?

  **7. The Stability of Semantic Dualism**
  Many critics argue that positing two fundamentally different semantic mechanisms for "if" is theoretically costly and unstable. Why should the grammar of English track such a deep metaphysical divide between truth-conditional and non-truth-conditional operators? Isn't there a theoretical virtue in seeking a unified semantics, even if it means abandoning the strict Ramsey Test for indicatives?

  *   **Follow-up:** If you resist a unified theory to save the Ramsey Test, are you prioritizing a specific intuition about rational credence over the linguistic data that suggests a uniform underlying logic?

  **8. Normativity of Assertion**
  If an indicative conditional has no truth conditions, it cannot be false. Yet, we certainly criticize people for asserting bad conditionals. If we can't accuse them of asserting a falsehood, what is the norm of assertion here? Are we accusing them of being irrational, imprudent, or misleading? And how do we distinguish a "false" conditional from a merely "unassertible" one in your framework?

  *   **Follow-up:** If the charge is merely "imprudence," does that weaken the normative force of logical validity? Can an argument be valid if its premises cannot be false, only imprudent to assert?
