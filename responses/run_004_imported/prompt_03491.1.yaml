answer: |-
  Here is an argument structured for your philosophy club presentation. It is designed to be rigorous enough for a philosophy audience but accessible enough for a general discussion.

  ***

  ### Title: The High Cost of Saving the Equation: Why the Non-Propositionalist Retreat Abandons Semantics

  **Introduction: The Triviality Trap**
  As we know, David Lewis's 1976 triviality results pose a devastating challenge to the standard view of indicative conditionals. If we accept two premises—(1) that conditionals express propositions (they have truth conditions) and (2) that the probability of a conditional equals the conditional probability of its consequent given its antecedent (The Equation: $P(A \to C) = P(C|A)$)—probability theory collapses. The only way to save the math is to assume agents are dogmatic (assigning only 0 or 1 probabilities), which is empirically false.

  In response, Ernest Adams and later Dorothy Edgington proposed a radical solution: **Deny Premise 1.** They argue that indicative conditionals do not express propositions. They have no truth conditions. Therefore, they cannot be embedded in truth-functional contexts. The Equation holds, but only for "stand-alone" conditionals used as main clauses.

  My argument today is that this restriction is not a minor technical adjustment to save a theory. It is a fundamental concession that abandons the project of providing a *semantics* for the English conditional. By restricting conditionals to unembedded contexts, the Adams/Edgington view ceases to be a theory of meaning and becomes merely a theory of assertion.

  **1. The Violation of Compositionality**
  The cornerstone of modern semantics is the Principle of Compositionality: *The meaning of a complex expression is determined by the meanings of its constituent parts and the rules used to combine them.*

  In English, logical operators like "and," "or," and "not" are fully compositional. I can say "It is raining," "It is not raining," "It is raining or snowing," or "If it is not raining, we will go." The meaning of "not" remains stable whether it is the main operator or nested inside a conditional.

  The Adams/Edgington view treats "if" as a linguistic outlier of massive proportions. It claims that "if" functions perfectly well as a main connective but loses its semantic status when nested under negation, disjunction, or another conditional.
  *   **The Critique:** If a semantic theory claims that a specific word ("if") obeys the laws of grammar but violates the laws of semantics whenever it appears in a complex sentence, the fault lies with the theory, not the language. To claim that "if" is non-compositional is to claim that English speakers systematically generate meaningless sentences that they nevertheless understand perfectly well.

  **2. Descriptive Inadequacy: We *Do* Embed Conditionals**
  The non-propositionalist must argue that embedded conditionals are semantically defective. However, natural language data suggests otherwise. Consider the following sentences, which are intelligible to any competent English speaker:

  1.  **Negation:** "It is not the case that if you study, you will fail."
  2.  **Disjunction:** "Either if it rains the match is cancelled, or if it snows the match is cancelled."
  3.  **Nesting:** "If, if it rains, the ground gets wet, then we should bring umbrellas."

  For Adams and Edgington, these sentences are problematic. If conditionals have no truth value, what does it mean to negate them? What does it mean to disjoin them?
  *   **The Critique:** A semantic theory must account for the data. If the theory requires us to treat common, intelligible sentences as semantically ill-formed (or requires a completely different, *ad hoc* mechanism to interpret them), the theory is descriptively inadequate. By restricting the Equation to unembedded cases, the non-propositionalist is essentially saying, "Our theory works for a fragment of English, but we have no account for the rest." That is not a solution; it is a boundary line drawn around the problem.

  **3. Semantics vs. Assertability Conditions**
  The core of the Adams/Edgington move is to shift from *truth conditions* to *assertability conditions*. They argue we should not ask "Under what conditions is this conditional true?" but rather "Under what conditions is it appropriate to assert this conditional?"

  This works fine for simple assertions. However, semantics is supposed to explain meaning *independent* of assertion.
  *   **The Critique:** When I say, "If it is true that if A then B, then C," I am not asserting "If A then B." I am hypothesizing it. I am using the *meaning* of the conditional in the antecedent of a larger claim. If conditionals lack propositional content, they cannot be the objects of hypothesis, belief, or negation.
  *   By limiting the theory to assertability, Adams and Edgington provide a **pragmatic** account, not a **semantic** one. They explain when we can *speak*, but not what our words *mean* when they are not being spoken as main claims. A general semantics must explain how "if" contributes to the meaning of a sentence even when that sentence is not being asserted.

  **4. The Loss of Logical Relations**
  Finally, if conditionals are not propositions, standard logic breaks down. Logic is traditionally defined as the preservation of truth. If conditionals have no truth values, they cannot be premises or conclusions in valid arguments in the classical sense.

  While Adams developed a logic of probability preservation, this creates a disconnect between the logic of conditionals and the logic of the rest of the language.
  *   **The Critique:** Consider the inference: "It is not the case that if A then B; therefore, A and not-B." This seems valid in English. But if "If A then B" has no truth value, it cannot be "not the case." The non-propositionalist must reconstruct this inference in a convoluted way, denying the surface grammar of the language.
  *   To save the Equation, the non-propositionalist sacrifices the unity of logic. They create a "logic of assertion" for conditionals and a "logic of truth" for everything else. This bifurcation is theoretically expensive. It suggests that human reasoning operates on two incompatible systems depending on whether the word "if" is the main verb.

  **Conclusion: A Retreat, Not a Repair**
  To conclude, the restriction of the Equation to unembedded conditionals is often presented as a pragmatic compromise to save the intuitive link between conditionals and conditional probability. However, we should recognize this for what it is: a surrender of the semantic project.

  A general semantics for a natural language operator must explain how that operator functions in all grammatical contexts. By retreating to unembedded contexts, the Adams/Edgington view admits that "if" cannot be integrated into the compositional machinery of language. It saves the probability equation by sacrificing the proposition. In doing so, it ceases to be a semantics of the English conditional and becomes a semantics of a limited, artificial fragment. If a theory of "if" cannot handle "if" inside "not," "or," or another "if," it has not solved the puzzle of the conditional; it has merely sidestepped the places where the puzzle becomes difficult.
