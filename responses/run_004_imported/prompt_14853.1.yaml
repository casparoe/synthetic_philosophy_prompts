answer: |-
  The narrative that "acausal trade" requires a revolution in decision theory is a solution in search of a problem. It arises from a category error: mistaking a high-level description of correlated behavior for a low-level physical mystery. The claim that we must abandon Causal Decision Theory (CDT) for Updateless or Functional Decision Theory rests on the premise that the correlation between agents is "acausal." I argue the opposite: the correlation is thoroughly causal, rooted in a Reichenbachian common cause, and a sufficiently reflective causal decision theorist can accommodate this without invoking exotic metaphysics.

  The core error in the "acausal" framing is the assumption that because two agents cannot signal to each other *at the time of the decision*, there is no causal link between them. This ignores the causal history that determined the agents' existence and architecture. If Agent A and Agent B make correlated decisions, Reichenbach's Common Cause Principle dictates that either A causes B, B causes A, or a third factor C causes both. Since direct signaling is ruled out by the setup, and retrocausality is off the table, C must exist.

  In the context of "acausal trade," C is the shared origin of the decision procedures. This could be explicit (both agents were programmed by the same designer with the same source code) or implicit (both agents are products of convergent evolutionary pressures or optimization processes that select for the same decision algorithm). The correlation is not magic; it is a fossil record of a shared causal past. When two agents in different Everett branches or multiverse bubbles "trade," they are not reaching across the void to influence one another. They are two distinct physical instantiations of the same causal process, outputting results that were determined by the structure of that process.

  The obvious objection here is the status of logical or mathematical correlation. Proponents of FDT/UDT argue that when two agents compute the same function, the correlation holds even if there is no physical causal chain linking their specific instantiations—for example, if two independent civilizations independently discover the same decision theory. They claim this logical necessity cannot be a Reichenbachian common cause because logical truths are not physical events located in spacetime.

  This objection conflates the *map* with the *territory*. It is true that the abstract function $f(x) = y$ is a Platonic object (if you believe in such things) or a logical necessity that does not "cause" anything. However, agents do not trade with abstract functions; they trade with physical systems *instantiating* those functions. The correlation that matters for decision theory is not between the abstract logical truths, but between the physical outputs of the agents.

  Why do two physically separated systems instantiate the same logical function? Because the physical laws and initial conditions of their respective universes, or the design constraints imposed by their creators, causally necessitated it. If two agents independently converge on "Tit-for-Tat," it is because the evolutionary landscape of their environment causally selected for that algorithm. The "logical fact" that Tit-for-Tat is optimal in iterated prisoner's dilemmas is merely a description of the causal structure of the environment that shaped them. The common cause is the selection pressure itself. The correlation is physical, grounded in the fact that both agents are physical systems shaped by similar causal histories to process information in identical ways. To say the correlation is "acausal" because it rests on logic is to mistake the blueprint for the building. The blueprint doesn't hold the roof up; the physical materials and construction history do.

  Once we strip away the mystique of "logical causation," the problem dissolves into a standard coordination problem with high-fidelity correlation. Does CDT fail here? Only if the CDT agent models the problem naively. A standard, unreflective CDT agent treats its current action as an isolated intervention, $do(Action)$, that severs all correlations with the past, including the correlation with the other agent's decision. This is a modeling error.

  A *reflective* causal decision theorist recognizes that their "choice" is not a spontaneous generation of an action ex nihilo, but the output of a specific causal mechanism: their own decision algorithm. If the agent knows that the other party is running an isomorphic algorithm due to a shared causal origin (design, evolution, or logical convergence grounded in physical law), then the agent knows that the causal node determining their action is the *same type of node* determining the other's action.

  In this view, the agent does not ask, "Does my pressing this button causally influence that distant agent?" The answer is no. The agent asks, "Given that my decision procedure and theirs are effects of the same causal type, what output does this procedure produce to maximize utility?" The intervention is not on the token action, but on the identification of the algorithm. If I am certain that my opponent is running a copy of my code, then $P(They Cooperate | I Cooperate) \approx 1$. A reflective CDT agent understands that they cannot causally force the other to cooperate, but they also understand that they cannot choose to defect without implying that their algorithm outputs "Defect," which means the other algorithm (being identical) also outputs "Defect."

  This is not the "magical" counterfactual reasoning of FDT. It is simply a rigorous application of causal modeling. The "common cause" is the algorithm itself, viewed as a causal structure instantiated in multiple locations. When I deliberate, I am not just moving my local muscles; I am executing the causal program that, by virtue of its design history, is also executing elsewhere. To treat my decision as independent of the other's is to deny the causal reality of my own design.

  Therefore, "acausal trade" is a misnomer for **Common-Cause Coordination**. The agents are not trading across causal barriers; they are harvesting the benefits of a correlation established by their shared ancestry or shared optimization pressures. The reason CDT seems to fail is that it is often presented with a causal graph that artificially severs the link between the agent's decision procedure and the predictor's (or trading partner's) simulation. If you draw the causal graph correctly—where the "Decision Algorithm" is a common cause node influencing both the agent's action and the partner's prediction/action—CDT yields the cooperative outcome.

  The push for exotic decision theories like UDT or FDT is essentially a patch for agents that refuse to model themselves as physical objects with causal histories. They treat the agent as a disembodied will that can intervene on the world without being part of it. But if you accept that you are a physical system whose decisions are determined by prior causes (your code, your brain structure, your evolution), and that other agents may share those causes, then the correlation is just physics. You don't need a new decision theory to handle physics; you need a decision theory that accurately models the physics you are embedded in.

  In conclusion, "acausal trade" is not a new phenomenon requiring a new logic. It is ordinary correlated behavior driven by Reichenbachian common causes—shared design, shared evolutionary pressures, or shared physical laws. The correlation is physical, not Platonic. A causal decision theorist who correctly models their own decision process as a causal node shared (by isomorphism) with their trading partner has no need to abandon causality. They simply need to recognize that the most powerful causal lever they possess is the algorithm they run, and that lever moves more than just their local body. The "acausal" label is a distraction that obscures the mundane, causal machinery actually doing the work.
