      *   *Is the Simulation Hypothesis purely Cartesian?* Bostrom is probabilistic/ontological. *Matrix* is Gnostic/Platonic (escape the cave). Both assume "Base Reality" is better/truer. Zhuangzi challenges the "better/truer" valuation.
      *   *Make sure to mention *Wu Hua*.* That's the core concept from the prompt.

  9.  **Final Polish:** Check against the prompt's specific constraints (argue from commitments, not surface resemblance). Ensure the distinction between "skepticism as a tool for truth" vs. "skepticism as a tool for peace" is clear. (Proceed to generate output).

  *(Self-Correction during drafting)*: I should explicitly mention the concept of *tian ni* (Heavenly Equality) or *dao shu* (technique of the Dao) to show deep textual engagement. Also, emphasize that for Zhuangzi, the "dream" isn't an error state; it's a mode of existence.

  10. **Final Output Structure:**
