      *   *Section 2: The Ontological Trap.* The Simulation Hypothesis relies on a hierarchy of reality. Zhuangzi flattens this. Reference *Qiwulun*.
      *   *Section 3: The Ethical/Pragmatic Consequence.* If you think you're in a simulation, do you act differently? Neo wakes up to fight. Zhuangzi drums on a tub.
