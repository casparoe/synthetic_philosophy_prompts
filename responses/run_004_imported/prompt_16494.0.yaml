answer: |-
  Your intuition is correct: there are significant ethical and practical problems with your friend's reasoning, even if her intentions are harmless. This practice is often called **"sharenting,"** and while sharing milestones is common, posting vulnerable moments like potty training or meltdowns raises serious concerns.

  Here is a breakdown of why her reasoning is flawed, who is potentially being wronged, and how you might approach the conversation.

  ### 1. The Flaw in "He Won't Remember"
  Your friend argues that because her son is three, he cannot be embarrassed. This confuses **current capacity** with **future consequence**.
  *   **The Future Self:** While a three-year-old cannot consent, an eighteen-year-old can. By posting these images now, she is making a decision on behalf of her son's future adult self. She is effectively curating his digital identity before he has the agency to participate in that curation.
  *   **Dignity:** Imagine if your employer or partner found a high-definition video of you having a visceral emotional meltdown or struggling on the toilet. Most adults would find this deeply humiliating. Children deserve the same right to dignity, even if they cannot articulate it yet.

  ### 2. The Flaw in "I Will Delete It Later"
  Her plan to delete the content before he is old enough to search for it relies on a technical impossibility.
  *   **Data Permanence:** Once something is online, the original poster loses control of it. It can be screenshotted, screen-recorded (as happened with the birthday video), saved by third-party data brokers, or archived by the platform itself.
  *   **Algorithmic Spread:** As you noted, the meltdown video already circulated beyond her followers. Algorithms favor engagement, and emotional content (like tantrums) often gets pushed to wider audiences. She cannot guarantee deletion because she no longer holds the only copy.

  ### 3. Safety and Privacy Risks
  Beyond embarrassment, there are tangible safety risks associated with oversharing about children.
  *   **Digital Kidnapping:** Photos of children are sometimes stolen and used by strangers to create fake family profiles.
  *   **Data Harvesting:** Social media platforms collect data on the faces and habits of minors. This creates a digital footprint that the child did not choose, which could theoretically impact future opportunities (insurance, employment, security clearances) as biometric and data analysis evolves.
  *   **Physical Safety:** Regular posting can reveal patterns: where the child goes to school, what their daily routine is, or what their home looks like.

  ### 4. To Whom Is She Doing Wrong?
  You asked to whom she is doing wrong, given that no one currently alive is embarrassed.
  *   **The Child (Future Adult):** He is the primary stakeholder. He is being wronged because his **right to an open future** is being compromised. He is losing the ability to decide how he is introduced to the world.
  *   **The Parent-Child Relationship:** If the son discovers these posts later (and peers often find things before parents do), it may erode trust. He may feel that his vulnerable moments were treated as content for consumption rather than private experiences to be supported.
  *   **Society:** Normalizing the public consumption of children's distress desensitizes us to children's privacy rights. It suggests that children are extensions of their parents' brands rather than individuals with boundaries.

  ### 5. How to Approach the Conversation
  Since you don't have children, you may feel you lack standing, but this is actually an advantage: you can view it from the perspective of an outsider and a friend, rather than a competing parent.

  *   **Focus on Safety, Not Judgment:** Instead of saying "This is embarrassing," try saying, "I worry about safety. Since that video spread so fast, I'd hate for strangers to have access to his face or to know where he hangs out."
  *   **Highlight the "Future Self":** Ask her, "If your parents had posted videos of your worst teenage moments online, how would you feel about that now?"
  *   **Suggest a Middle Ground:** She doesn't have to stop posting entirely. Suggest boundaries: post about achievements or cute moments, but keep vulnerable moments (bathroom, sickness, anger) private. Suggest using private sharing groups (like family-specific apps) rather than public social media.
  *   **Validate Her Intentions:** Acknowledge that she is proud of him and wants to document his life. "I know you love sharing his journey, and these are precious memories. I just worry that the internet isn't a safe diary."

  ### Summary
  Your friend is operating under the assumption that **privacy is only about what we feel in the moment.** In the digital age, privacy is also about **control over our future narrative.**

  She is not necessarily a "bad" parent, but she is underestimating the permanence of the digital world and overestimating her control over it. She is prioritizing her current desire to share (or vent, or seek community) over her son's future right to privacy. That imbalance is where the ethical wrong lies.
