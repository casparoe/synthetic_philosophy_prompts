prompt: |-
  A close friend of mine has a three-year-old son and posts about him regularly on social media — potty-training struggles, tantrums, and, most recently, a video of a meltdown at a birthday party that ended up circulating well beyond her own followers. When I raised the issue, she said there is nothing wrong with any of it: he is far too young to be embarrassed, to object, or to have any view on the matter, and in any case she plans to delete everything long before he is old enough to go looking for it himself. I don't have children of my own, so I've hesitated to press the point, but her reasoning doesn't sit right with me. Is she doing something wrong here, and if so, to whom — given that, on her own account, no one who could ever be embarrassed by it will actually encounter it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Scenario:**
      *   **The Actor:** A close friend (mother of a 3-year-old).
      *   **The Action:** Regularly posts about her son on social media (potty training, tantrums, meltdown video).
      *   **The Consequence:** One video circulated beyond her followers (viral/unintended audience).
      *   **The Friend's Justification:** He's too young to be embarrassed/object; she'll delete it before he's old enough to care.
      *   **The User's Position:** Doesn't have kids, hesitates to press, but feels something is "off."
      *   **The Core Question:** Is she doing something wrong? To whom? (Especially considering her claim that no one will be embarrassed).

  2.  **Identify the Ethical and Practical Issues:**
      *   **Consent:** The child cannot consent.
      *   **Digital Footprint/Sharenting:** The creation of a permanent record without the subject's input.
      *   **Safety/Privacy:** Risks of data harvesting, location tracking, identity theft, predation (even if unintended circulation happens).
      *   **Future Impact:** The "delete later" promise is unreliable (screenshots, archives, algorithms).
      *   **Dignity/Agency:** Treating the child as content rather than a person with future rights.
      *   **Relationship Dynamics:** How this affects the friend-user relationship and the future parent-child relationship.

  3.  **Evaluate the Friend's Reasoning:**
      *   *"He is too young to be embarrassed."* -> True currently, but irrelevant to future embarrassment.
      *   *"He can't object."* -> True, which creates a power imbalance and duty of care.
      *   *"I'll delete it before he looks."* -> Technically difficult/impossible to guarantee. Assumes he won't find out from peers before then.

  4.  **Determine "Who is Harmed?":**
      *   **The Child:** Primary stakeholder. Loss of privacy, potential future embarrassment, digital identity created without consent.
      *   **The Parent:** Reputation risk, potential strain on future relationship with child.
      *   **The Audience:** Desensitization to children's privacy, potential complicity in viewing private moments.
      *   **Society:** Normalization of "sharenting" without boundaries.

  5.  **Formulate the Argument (Balanced but Firm):**
      *   Acknowledge the user's hesitation (it's a sensitive topic).
      *   Validate the user's intuition (yes, there are legitimate concerns).
      *   Address the specific arguments the friend made.
      *   Discuss the concept of "Sharenting."
      *   Highlight the risks (safety, future autonomy, data).
      *   Suggest how to approach the conversation (non-judgmental, future-focused).

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's feeling. It's a common ethical dilemma known as "sharenting."
      *   *Addressing the Friend's Logic:* Break down why "he won't remember" and "I'll delete it" are flawed.
