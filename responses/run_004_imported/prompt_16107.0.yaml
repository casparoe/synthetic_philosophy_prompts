answer: |-
  In reconstructing Frank Ramsey's likely response to the problem of old evidence, one must resist the temptation to anachronistically cast him as a proto-Garberian. While Ramsey certainly shares Garber's premise that human agents lack logical omniscience, his philosophical commitments in "Truth and Probability" push him toward a more radical conclusion: the problem of old evidence is not a technical glitch in Bayesian formalism to be repaired, but a category error resulting from the conflation of *consistency* with *reasonableness*. 

  I will argue that Ramsey would **dissolve** the problem rather than solve it. For Ramsey, the probability calculus is a normative constraint on the *static coherence* of betting dispositions, not a dynamic logic of discovery or confirmation. The "problem" arises only if one assumes the calculus must fully govern the *formation* of reasonable belief. By strictly adhering to Ramsey's distinction between the logic of consistency and the psychology of reasonable belief-formation, the paradox vanishes: the confirmation of General Relativity by Mercury's perihelion is a fact about the *reasonableness* of a belief shift, which the calculus monitors but does not generate. Ramsey's psychologism renders the "old evidence" puzzle a pseudo-problem of idealized epistemology that his "human logic" was designed to bypass.

  ### 1. Ramsey's Framework: Consistency vs. Reasonableness

  To understand why Ramsey would dissolve the problem, we must first locate his specific definition of probability. In "Truth and Probability," Ramsey rejects the logical interpretation of probability (championed by Keynes) in favor of a subjective, pragmatic one. He defines the degree of belief in a proposition $p$ as the price at which an agent would buy or sell a bet on $p$. The probability axioms are then derived as conditions necessary to avoid a "Dutch Book"—a set of bets that guarantees a loss regardless of the outcome.

  Crucially, Ramsey limits the scope of this derivation. He writes:

  > "The laws of probability are laws of consistency... they do not cover all reasonable belief."

  This distinction is the fulcrum of his view. The calculus ensures that an agent's beliefs are internally coherent (e.g., $P(p) + P(\neg p) = 1$). It does *not* ensure that those beliefs are aligned with the world, nor does it dictate how beliefs should change in response to new insights, except insofar as those changes must maintain consistency. 

  Ramsey is explicit that this consistency is an idealization. He acknowledges that humans are not logically omniscient. Regarding tautologies, he notes that while a perfectly consistent system *should* assign probability 1 to all logical truths, actual human believers do not—and often cannot—recognize all logical truths immediately. He treats this limitation not as a failure of the *theory* of probability, but as a fact of human psychology. The calculus describes the relations beliefs *ought* to have if they are to be consistent, but it does not describe the *process* by which a human comes to hold them.

  ### 2. The Category Error of the "Problem"

  The problem of old evidence, as formulated by Glymour, assumes that confirmation is a logical relation defined strictly by the probability calculus: $E$ confirms $H$ if and only if $P(H|E) > P(H)$. The paradox arises because, for a rational agent, known evidence $E$ has $P(E) = 1$, which mathematically entails $P(H|E) = P(H)$. Thus, the calculus seems to forbid confirmation by old evidence.

  Ramsey would diagnose this as a confusion of the *logic of consistency* with the *logic of truth* (or reasonableness). 

  For Ramsey, $P(E) = 1$ is not an objective status of the evidence $E$; it is a description of the agent's *actual* betting disposition. If an agent is certain of $E$, they bet accordingly. However, the relation between $H$ and $E$ (specifically, that $H$ entails $E$) is itself a proposition about which the agent has a degree of belief. 

  If an agent (like a pre-Einsteinian physicist) does not know that $H$ entails $E$, then, psychologically, they do not assign probability 1 to the conditional proposition $(H \rightarrow E)$. Consequently, within their *actual* subjective probability function, $P(E|H)$ is not 1. When Einstein discovers the entailment, he is not merely updating on $E$ (which was old); he is updating on the new proposition $L$: "$H$ entails $E$." 

  Here is where Ramsey diverges from Garber. Garber accepts the Glymour challenge as a genuine formal problem and constructs a formal language to represent $L$ so that Bayesian conditionalization can proceed. Ramsey, however, would argue that the formalism was never intended to capture the *discovery* of $L$ in the first place. The discovery of the entailment is a shift in the agent's *habits of belief-formation*. 

  In his closing remarks on induction, Ramsey argues that reasonable belief depends on "habits" that cannot be fully codified into a calculus. He writes that while consistency is necessary, "it is not... possible to map out perfectly... the reasonable degree of belief." The shift in confidence in General Relativity upon realizing it explains Mercury's orbit is a paradigmatic case of *reasonable* belief formation driven by a new insight (the entailment). Ramsey's calculus requires that *after* the insight, the agent's beliefs be consistent (i.e., if you now believe $H \rightarrow E$ and $E$, you must believe $H$ to a degree consistent with that). But the calculus does not—and cannot—dictate the *prior* probability of $H$ before the entailment was grasped. 

  Therefore, for Ramsey, there is no paradox. The agent's prior $P(H)$ was low. The agent learned $L$ ($H \rightarrow E$). The agent's new $P(H)$ is high. This change is *reasonable* (it fits the facts), and the resulting state is *consistent*. The fact that the standard formula $P(H|E) = P(H)$ (given $P(E)=1$) doesn't model this transition is irrelevant, because that formula applies to updating on $E$, not on the logical connection between $H$ and $E$. Since Ramsey denies that agents are logically omniscient, he denies that the agent *ever* had a prior where $P(H \rightarrow E) = 1$ before the discovery. Thus, the condition for the "problem" ($P(E|H)=1$ initially) is psychologically false.

  ### 3. Why This is Dissolution, Not Anticipation

  It is tempting to say Ramsey "anticipated" Garber because both deny logical omniscience. However, there is a fundamental difference in their projects. Garber seeks to *save* the Bayesian model of confirmation by expanding the formalism to accommodate non-omniscience. He treats the problem of old evidence as a flaw in the standard application of Bayesianism that needs fixing.

  Ramsey, by contrast, would view the demand for such a fix as a misunderstanding of what the probability calculus *is*. For Ramsey, probability is "the logic of partial belief," but it is a logic grounded in *actual* psychology, not idealized rationality. In "Truth and Probability," he emphasizes:

  > "We find therefore that a precise account of the nature of partial belief reveals that the laws of probability are laws of consistency... [but] they do not cover all reasonable belief."

  If the problem of old evidence is the claim that "Bayesianism cannot account for the confirmation of H by old E," Ramsey's response is: "Bayesianism (as I define it) is not a theory of confirmation; it is a theory of consistency." Confirmation is a matter of *reasonableness*, which Ramsey explicitly places outside the strict scope of the probability calculus. 

  To Ramsey, the "problem" is generated by expecting the consistency calculus to do the work of a theory of inference. He would argue that Glymour's puzzle only has bite if one assumes (as Keynes might) that probabilities are logical relations between propositions that exist independently of the agent's psychological state. If probabilities are logical relations, then $H \rightarrow E$ is a timeless truth, and the agent *ought* to have believed it all along. But Ramsey rejects this objective logical relation. For him, probability is *essentially* relative to the believer's dispositions. 

  If the believer did not *see* the entailment, the probability relation (as a psychological fact) did not exist for them. Therefore, when they come to see it, their probability function changes. There is no need to formalize this change as "conditionalization on old evidence." It is simply a change in the system of beliefs triggered by a new psychological event (grasping the proof). Ramsey's framework absorbs this without strain because it does not claim that the prior probability function was the "correct" one that got updated; it merely claims that the *new* function must be consistent. 

  ### 4. The Role of "Human Logic"

  The strongest evidence for the dissolution reading lies in Ramsey's conception of "human logic." In his later work (echoing sentiments in "Truth and Probability"), Ramsey critiques the idea that logic is about ideal truths independent of human capacity. He insists that logic is a normative study of how we *ought* to think, given how we *do* think. 

  Applied to old evidence: The "ought" is consistency. The "do" is the historical shift in belief upon discovering the entailment. The "problem" arises when we try to derive the "do" solely from the "ought." Ramsey explicitly forbids this. He states that while we can check beliefs for consistency, we cannot derive the *content* of reasonable belief from consistency alone. 

  Therefore, Ramsey would argue that the confirmation of General Relativity is not a puzzle for probability theory. It is a fact about scientific practice that falls under the umbrella of "reasonable habits." The probability calculus is satisfied as long as the scientist doesn't hold contradictory bets *after* the discovery. Whether the scientist *should* have believed GR before discovering the entailment is a question of induction and reasonableness, which Ramsey admits the calculus cannot fully answer. 

  By placing the burden of "confirmation" on the extra-calculus notion of *reasonableness*, Ramsey dissolves the normative force of the paradox. The paradox claims Bayesianism *fails* to account for old evidence. Ramsey replies that Bayesianism (as consistency) was never tasked with accounting for the *growth* of knowledge, only its *coherence*. The growth is handled by the psychological habits of the agent, which are reasonable precisely because they respond to new insights (like entailments) even when the data is old.

  ### Conclusion

  Frank Ramsey would not have viewed the problem of old evidence as a technical crisis requiring a Garber-style formal patch. Instead, his rigorous separation of *consistency* (the domain of the probability calculus) from *reasonableness* (the domain of induction and belief formation) leads to a philosophical dissolution of the puzzle. 

  For Ramsey, the premise that $P(E|H) = 1$ prior to Einstein's discovery is psychologically false; the agent did not possess that degree of belief because they did not grasp the logical connection. Since Ramsey grounds probability in actual betting dispositions rather than objective logical relations, the "prior" is simply the state of the agent before the insight. The change in belief is a reasonable adjustment of habit, monitored for consistency but not generated by the calculus. 

  To insist that this constitutes a "problem" for Bayesianism is to demand that the logic of consistency perform the work of a logic of discovery—a demand Ramsey explicitly rejects in his closing remarks on induction. Thus, Ramsey's psychologism does not merely anticipate the solution to the problem; it undermines the problem's very formulation, rendering it a pseudo-issue born of over-idealizing the rational agent beyond the bounds of "human logic."
