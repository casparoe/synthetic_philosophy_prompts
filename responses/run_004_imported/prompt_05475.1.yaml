      *   *New Principle (NP):* Lewis's fix. Defer not to the chance proposition $X$ directly, but to the conditional chance of $A$ given the history $H$. $C(A | H) = Ch(A | H)$. This avoids asserting $X$ as a categorical truth that might be undermined.
      *   *Propensity View:* Chances are physical properties of setups (dispositions), not summaries of patterns. They ground the PP naturally because they don't depend on the future.
      *   *Epistemic Access Problem (for Propensity):* If propensities aren't just frequencies, how do we measure them? How do we know what they are to defer to them?

