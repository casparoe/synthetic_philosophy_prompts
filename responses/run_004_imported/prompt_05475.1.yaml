answer: |-
  **Dr. Aris (Lewisian):** Let's begin with the worry you raised about undermining. Lewis admitted that on the Best-System Account, the chances supervene on the entire Humean Mosaic, past and future. Yes, there are possible futures that would make the current best system different. But the New Principle (NP) handles this. It tells us to align our credence not with the categorical chance proposition, but with the conditional chance given the history to date. The undermining futures are possible, but they are accounted for in the conditionalization. The rational norm remains intact without positing occult powers.

  **Dr. Thorne (Propensity):** Intact in form, perhaps, but gutted in substance. The Principal Principle was motivated by the idea that objective chance is a *guide* to belief because it is a feature of the physical setup *now*. If the chance of a decay event depends on what happens a million years hence, it cannot rationally guide my present credence. You've saved Humean Supervenience by making chance retroactively sensitive. I argue that only a propensity—a physical disposition existing at the moment of the trial—can ground the deference the Principle requires.

  **Dr. Aris:** But that "disposition" is metaphysically idle. What is it, other than a placeholder for our ignorance? On my view, chance is derived from the actual patterns of events plus our theoretical virtues like simplicity and strength. The NP works because it acknowledges that our access to chance is always via the history we have. We don't need a "now" property; we need a reliable inference rule, which the Best System provides.

  **Dr. Thorne:** A reliable inference rule requires a truth-maker. If your "chance" is just a summary of frequencies including the future, then strictly speaking, the chance of this specific coin toss is indeterminate until the end of time. That contradicts experimental practice. We assign probabilities to single cases based on the apparatus, not the future history of the universe. And don't dismiss propensities as idle; they explain *why* frequencies stabilize. Without them, the convergence of frequencies is a cosmic coincidence.

  **Dr. Aris:** It's not a coincidence; it's a constraint on what counts as a "best" system. A system that doesn't capture the stable regularities isn't simple or strong. But let's turn to your epistemic access. If propensities are distinct from frequencies—if a coin can have a propensity of 0.5 even if it lands heads ten times in a row—how do you measure them? If they don't supervene on categorical properties, they are undetectable. You cannot defer to a chance you cannot know.

  **Dr. Thorne:** We detect propensities through frequencies, just as we detect mass through acceleration. We don't *define* mass as acceleration, nor do we define propensity as frequency. The propensity is the physical property of the setup—the symmetry of the coin, the quantum state—that *produces* the frequency. My access is abductive: the hypothesis of a stable propensity best explains the observed stability of the data. Your Best System merely describes the data.

  **Dr. Aris:** But mass supervenes on the Humean Mosaic in physics; your propensity is meant to float free of the categorical base. That's the rub. With the New Principle, I preserve the link between physics and rationality. The NP says: conditionalize on the history. Since the undermining futures have negligible measure in the actual best system, the NP converges with the old Principal Principle in practice. You're fighting a technical glitch with heavy metaphysics.

  **Dr. Thorne:** It's not a technical glitch; it's a category error. You are trying to ground a normative principle of rationality on a summary of events. The "negligible measure" argument assumes the chance is already fixed to calculate that measure! You're using the chance to justify the chance. The Propensity view avoids this circle: the physical disposition exists independently of the outcome, so it can legitimately constrain credence without looking at the future.

  **Dr. Aris:** I'm not using chance to justify chance; I'm using the *theory* that posits chance to guide belief. The theory is validated by its fit with the mosaic. You claim your propensities avoid the circle, but you pay for it with mystery. If a propensity can fail to manifest in the frequency (as single-case accounts allow), then at what point does evidence count against your propensity hypothesis? If nothing can falsify it, it's not a physical magnitude.

  **Dr. Thorne:** It is falsifiable, just probabilistically. If I posit a propensity of 0.5 and observe a million heads, the likelihood of my hypothesis drops precipitously. The difference is that on your view, if that million heads occurs, the chance *was* never 0.5. On my view, the chance *was* 0.5, and we got a rare run. This preserves the objectivity of the chance at the time of the toss, which is essential for the Principal Principle to function as a bridge between world and mind.

  **Dr. Aris:** But that preservation comes at the cost of making chance empirically disconnected from the actual world's history. Lewis's point was that we must respect the supervenience of the physical. The New Principle acknowledges the Humean constraint while still telling the agent how to bet. It says: "Given what you know of the history, here is the optimal credence." That is all science requires. You want a "truth" that does no extra work.

  **Dr. Thorne:** It does the work of grounding the probability itself! Without propensities, you have frequencies and you have credences, but you have no *objective chance* connecting them. You've reduced chance to a feature of our description, not the world. The Principal Principle demands we defer to the world's probabilities, not our best description of them. By making chance description-dependent, you've made the Principle defer to itself.

  **Dr. Aris:** I've made chance world-dependent, just not in the way you like. It depends on the whole world, not just the present slice. The NP respects that totality. You cling to the intuition that chance must be local and categorical, but quantum non-locality should have cured you of that. The New Principle is the cost of doing business in a Humean world, and it's a price I'm willing to pay for a clear ontology.

  **Dr. Thorne:** And I'm willing to pay the ontological price for a coherent epistemology. If chance isn't a property of the trial, the Principal Principle is a command to defer to a ghost. You have a clean ontology of events, but no engine to drive the probabilities. I have an engine, and I know how to read the gauges.

  ***

  **Dr. Aris:** You have gone wrong by reifying a relation that is merely a feature of our best theoretical system, mistaking a map for the territory.

  **Dr. Thorne:** You have gone wrong by reducing chance to pattern, leaving no objective feature of the present to justify the rational deference the Principal Principle demands.
