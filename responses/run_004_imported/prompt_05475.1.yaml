      *   **User Context:** Retired experimental physicist, well-read on objective chance literature. Tone should be respectful, technical but accessible, and philosophically rigorous.

  2.  **Deconstruct the Philosophical Issues:**
      *   *Principal Principle (PP):* $C(A | X \cdot E) = x$, where $X$ is the proposition that the chance of $A$ is $x$, and $E$ is admissible evidence.
      *   *Humean Supervenience (HS):* Chances supervene on the total history of categorical events (the "Humean Mosaic").
