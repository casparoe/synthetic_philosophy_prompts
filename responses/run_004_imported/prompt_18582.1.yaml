answer: |-
  Here is a reconstruction of Carnap's likely position, designed for your seminar context.

  **The Short Answer**
  Carnap would view modern algorithmic policymaking as a **methodologically legitimate but philosophically corrupt** enterprise. He would endorse the *technical project* (the explication of vague social concepts into precise, calculable forms) as a necessary tool for the rational social planning he advocated. However, he would vehemently reject the *ideological presentation* of these tools as "neutral." He would argue that claiming an algorithm removes value judgments is a category mistake—a piece of disguised metaphysics that violates the principle of clarity. For Carnap, the algorithm does not eliminate the volition; it merely compiles it into the objective function. Hiding that compilation is not just an error; it is an anti-democratic obstruction of the very rational discourse he believed science should foster.

  **1. The Case for Explication (Why he would like the tools)**
  To understand why Carnap wouldn't simply dismiss these tools as "unscientific," you have to look at his doctrine of **explication**. For Carnap, the task of philosophy and science is to take vague, pre-scientific concepts (the *explicandum*), such as "justice," "risk," or "need," and replace them with precise, formalized concepts (the *explicatum*) that allow for exact reasoning and integration into a unified scientific framework.

  Modern risk-assessment scores and allocation formulas are, structurally, acts of explication. They take a messy social reality and render it into a logical syntax amenable to calculation. Carnap's commitment to the "unity of science" and his sympathy for Neurath's "in-kind" calculation suggests he would see this as a victory. Neurath argued that a socialist economy could not calculate in money prices but had to calculate in physical units of well-being and resources. Algorithmic policymaking is, in a sense, the technological realization of Neurath's dream: a way to process the massive data required for in-kind planning without the "fog" of the price mechanism.

  Carnap would argue that if we are to plan society rationally (a political goal he held), we *need* these precise instruments. To reject them would be to retreat into intuitionism, which he viewed as metaphysical and unproductive.

  **2. The Metaethical Critique (Why he would hate the marketing)**
  However, this is where the fact/value distinction bites. For Carnap, normative statements are not assertions of fact; they are expressions of **volition** (or attitudes). They cannot be true or false, only consistent or inconsistent with other volitions and empirical beliefs.

  When a designer claims an algorithm "removes contested value judgments," they are making a cognitive claim about a non-cognitive reality. They are asserting as a *fact* that values have been eliminated. Carnap would identify this as a **pseudo-statement**.
  *   **The Location of Value:** Carnap would point out that the value judgment has not disappeared; it has been relocated to the choice of the *loss function*, the *target variable*, and the *weighting of errors*. Deciding that "false negatives" (releasing someone who reoffends) are worse than "false positives" (detaining someone who wouldn't) is a volition, not a discovery.
  *   **The Metaphysical Mask:** By dressing this volition up as "neutral calculation," the designers are engaging in the very kind of metaphysics the Vienna Circle sought to eradicate. They are treating a decision (a volition) as if it were a description of the world (an assertion). For Carnap, this is intellectually dishonest. It prevents the very rational debate he wanted. If you cannot see the volition, you cannot debate its consistency with other volitions (e.g., "Do we value public safety more than liberty?").

  **3. Negotiating the Tension: Politics without Moral Truths**
  Your students are right to spot the tension: How can Carnap advocate for a specific socialist program if he thinks value statements aren't cognitively meaningful?

  Carnap's solution, which he would apply here, is **Instrumental Rationality combined with the Ethics of Clarity**.
  *   **Instrumentalism:** Science cannot tell you *that* you should reduce suffering. But if you *volunteer* that you want to reduce suffering, science can tell you whether socialism or capitalism achieves that better.
  *   **The Ethics of Clarity:** While science cannot dictate ends, Carnap believed that *clarity* about ends was itself a moral imperative. The Vienna Circle was an Enlightenment project. They believed that human suffering was often caused by confusion, metaphysical fog, and dogmatism.

  Therefore, Carnap would argue that algorithmic policymakers are failing politically *because* they are failing philosophically. By claiming neutrality, they shield the volitional premises from democratic scrutiny. For Carnap's "scientific world-conception" to serve social emancipation (as the 1929 Manifesto intended), the value premises must be stated as explicitly as the code itself. He would demand that every algorithmic policy be accompanied by a "volitional documentation" stating: *Here is the goal we chose to optimize. Here is the trade-off we decided to accept.*

  **4. Where the Record Underdetermines the Answer**
  There are two areas where we must speculate, and you should be honest with your students about this:

  *   **Probability and Risk:** Carnap spent decades wrestling with the concept of probability (distinguishing between logical degree of confirmation and frequentist statistics). Modern risk scores are often frequentist or machine-learning black boxes. It is unclear if Carnap would accept a "risk score" derived from a neural net as a valid *explicatum*, given his demand for logical reconstructibility. He might view opaque models as scientifically inferior to transparent statistical models, regardless of their predictive power.
  *   **Bureaucracy vs. Democracy:** While Carnap was a socialist, he was also a liberal in the classical sense (concerned with individual liberty). Neurath was more willing to trust a central planning bureau. It is underdetermined whether Carnap would trust the *state* to wield these algorithmic tools. He might fear that a "neutral" algorithm gives the state too much unchecked power, precisely because the volitions are hidden. He might argue for these tools to be used by democratic bodies to *inform* choice, rather than by technocrats to *make* choice.

  **Conclusion for the Seminar**
  If you need a plain position to offer your students: Carnap would be a **critical ally** of algorithmic policymaking. He would fight for its use in social planning but fight *against* its presentation as value-free. He would argue that the "neutrality" claim is not a scientific finding but a rhetorical move that undermines the rational discussion of values.

  He would tell your students: *"Use the algorithm to calculate the consequences of your volitions, but do not let the algorithm pretend it chose the volitions for you. To do so is not science; it is mythology."*

  This preserves his commitment to rational planning (politics) while strictly enforcing the fact/value distinction (metaethics). The tool is cognitive; the goal is not. Confusing the two is the error.
