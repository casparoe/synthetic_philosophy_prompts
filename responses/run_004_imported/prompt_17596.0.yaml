  **Move 1 (Caleb): Score 2**
  This is a textbook articulation of Michael Walzer's position in *Just and Unjust Wars*. Caleb correctly identifies the separation of *jus ad bellum* (justice of war) and *jus in bello* (conduct in war). His argument is strong because it combines a moral claim (soldiers can't judge national policy) with a pragmatic one (shared rules require mutual recognition). It sets a high bar for Nadia to clear.

  **Move 2 (Nadia): Score 2**
  Nadia accurately deploys Jeff McMahan's core intuition from *Killing in War*. The self-defense analogy is the standard Revisionist counter to Walzer. It is morally potent because it appeals to individual responsibility rather than collective symmetry. Like Caleb's opening, this is a philosophically precise statement of her position, earning a high score for clarity and relevance.

  **Move 3 (Caleb): Score 1**
  Caleb identifies a counter-intuitive implication of McMahan's view: that innocent conscripts and guilty volunteers might be treated similarly regarding liability. This is a strong intuitive objection. However, it scores slightly lower because it anticipates a distinction (between blame and liability) that Revisionists explicitly make. Caleb treats the "liability to be attacked" as equivalent to "moral guilt," which leaves him vulnerable to Nadia's correction in the next move.

  **Move 4 (Nadia): Score 2**
  This is the strongest technical move of the debate. Nadia correctly distinguishes between *liability* (whether it is permissible to harm someone) and *culpability* (whether they deserve blame). By conceding that the conscript is excused from blame but maintaining he is still liable to defensive force, she neutralizes Caleb's Move 3 without abandoning her core thesis. This demonstrates a sophisticated grasp of the Revisionist framework.

  **Move 5 (Caleb): Score 1**
  Caleb pivots to the "Demographic Objection," a known challenge for Revisionists. If liability is based on causal contribution to an unjust threat, why aren't taxpayers or weapons manufacturers liable? This is a strong strategic move because it forces Nadia to admit her view requires complex, contestable boundary-drawing (e.g., direct vs. indirect threats), whereas Walzer's view has a bright line (uniforms). It scores a 1 rather than 2 because Revisionists do have responses (necessity and directness), but it successfully highlights the practical complexity cost of her view.

  **Important Missing Considerations**

  Both teammates are debating high-level theory but missing two crucial elements relevant to your Ethics Bowl case:

  1.  **The Epistemic Problem:** Walzer's view is partly pragmatic because, in the "fog of war," soldiers rarely know for certain which side is objectively unjust. McMahan's view works well in philosophy seminars where the unjust aggressor is identified, but it is difficult to implement in real time. If soldiers must determine the justice of the war before shooting, war might become impossible or chaotic.
  2.  **Risk and Technology:** Your actual case is about *drone pilots*. Neither Caleb nor Nadia addressed how remote warfare changes the moral calculus. Traditionalists argue drone pilots face no risk, which might violate a "reciprocity of risk" norm. Revisionists might argue that because drone pilots have better information (surveillance) than ground troops, they have a higher epistemic burden to ensure the war is just, making McMahan's asymmetry *more* applicable to them than to ground soldiers. Connecting the theory back to the specific technology in your case packet will be key to winning.
