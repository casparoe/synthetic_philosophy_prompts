answer: |-
  The frost had settled into the barn timbers, turning the wood gray and brittle as bone. Inside the stall, the mare stood with her head low, her breath pluming in the cold air. She was blind in the left eye and her hind leg had been stiff since the thaw last spring. She did not turn when Elias entered, only twitched an ear, yellowed and fly-bitten at the tip.

  Elias carried the revolver in his coat pocket. The weight of it pulled at his shoulder, a cold anchor against his ribs. He had not fed her that morning. It seemed a waste of oats, and a cruelty to tempt a hunger she could no longer satisfy with work.

  "You're lingering," a voice said from the barn door.

  Elias didn't jump. He knew the tread. Gantry stood there, wrapped in a heavy wool coat, a pipe unlit in his hand. He was a man of books who had failed at the ministry and settled for surveying land. He looked at the mare, then at Elias's pocket.

  "She can't pull the plow, Gantry," Elias said. His voice sounded thin in the high rafters. "And she can't carry a saddle. To keep her is to watch her starve slowly or founder in the mud."

  "Then the conclusion is plain," Gantry said, stepping into the straw. He didn't look at the horse. He looked at Elias. "But your hand is in your pocket, and you haven't drawn it."

  "I dreamt of her last night," Elias said. "She was speaking. Not in words, but I knew what she meant. She asked why."

  Gantry struck a match against his boot heel and lit his pipe. The sulfur flare briefly illuminated the sharp lines of his face. "A dream of reason is still a dream. She cannot ask why. She has no concept of the future, Elias. She has no 'why' to ask. She has only the now, and the now is pain."

  "If I shoot her, I end the pain."

  "If you shoot her, you break a tool that is no longer useful," Gantry corrected gently. He leaned against a post, blowing smoke toward the rafters. "You are hesitating because you think you owe her a debt. You think there is a covenant between you and the beast."

  "Isn't there?" Elias took his hand out of his pocket. It was empty. He had left the gun on the workbench. "She served me fifteen years. Through the drought, through the winter the cattle died. She gave her strength."

  "And you gave her oats and shelter. The ledger is balanced." Gantry tapped the ash from his pipe. "You are troubled by the old Kantian objection. I know you read the essays when you were in Boston. You remember the distinction."

  Elias rubbed his face. The stubble rasped against his palm. "That we owe no duty to the animal itself. Because it is not an end. It is a means."

  "Precisely. A thing without rational autonomy cannot be wronged. To say you wrong the mare is to attribute a soul she does not possess. It is superstition, dressed up as sentiment." Gantry pushed off the post and walked closer to the stall. The mare shifted, the chains of her halter rattling. She did not shy from him. She knew him. "The duty is not to her, Elias. The duty is to you."

  "To me?"

  "To your own humanity. Cruelty is forbidden not because the beast suffers, but because the man who inflicts suffering damages his own capacity for sympathy. It dulls the blade. If you hack at her neck with an axe, or beat her while she dies, you coarsen yourself. You make yourself readier to be cruel to a woman, or a child, or a neighbor. That is the sin. The injury is reflexive."

  Elias looked at the mare. She was chewing slowly, a wisp of hay hanging from her lip. She looked back at him with the one good eye, dark and liquid. "So if I do it cleanly," Elias said, "if I feel no pleasure in it... I am safe?"

  "You are not 'safe.' You are moral," Gantry said. "You maintain your fitness for the company of men. You must kill her without anger. Without disgust. And without false pity. If you weep for her, you devalue the tears you owe to your wife when she dies. Do you see the geometry of it?"

  "It sounds like a ledger," Elias said. "Like you're balancing accounts where only one side counts."

  "Only one side *exists*," Gantry said. "The mare is a mirror. When you look at her, you should only see yourself. If you see a person, you are hallucinating. If you see a thing, you are clear-eyed. The question is not 'Does she suffer?' The question is 'Does this act make you less fit to love your fellow man?'"

  Elias walked to the workbench and picked up the revolver. It was heavy, cold steel. He checked the cylinder. One bullet.

  "If I believe you," Elias said, turning back, "then I am doing her a favor. Not because she deserves it, but because my own character requires me to be efficient. I am sanitizing my own soul."

  "You are performing a duty to humanity," Gantry said. He did not blink. "By removing a source of unnecessary suffering, you practice the discipline of mercy. But you must not mistake the object of that mercy. It is not for her. She will not know it. It is for you, so that you remain soft enough where it matters."

  Elias walked back to the stall. The mare smelled the oil on the gun. She didn't bolt. She stepped forward, pressing her nose against his coat, searching for an apple that wasn't there.

  "It feels like a lie," Elias whispered.

  "It feels like a lie because your instincts are old," Gantry said from the shadows. "You are a peasant in your blood, Elias. You feel the kinship of the warm body. But reason demands you cut the tie. If you spare her out of sentiment, you indulge a weakness. If you kill her out of duty, you strengthen your will. But you must not enjoy the power. That is the narrow path."

  Elias raised the gun. He pressed the barrel against the horse's forehead, between the eyes, just above the bridge of the nose. The fur was coarse. The skin was warm.

  He thought of his daughter, asleep in the farmhouse. He thought of the neighbor whose land he had argued over last week. He thought of the way he had shouted at his wife when the bread burned. Was he hard? Was he becoming hard?

  If he shot the horse, and felt nothing, was he a monster?
  If he shot the horse, and felt grief, was he a fool?

  "Tell me," Elias said, without lowering the gun. "If I shoot her, and I feel nothing... have I succeeded?"

  Gantry was silent for a long moment. The smoke from his pipe curled into the cold air. "If you feel nothing, you have preserved your reason. That is the victory."

  "And if I feel grief?"

  "Then you have confused the mirror for the reflection. You have grieved for yourself, but attributed it to the beast."

  Elias's finger tightened on the trigger. The mare shifted her weight, a small sigh escaping her nostrils. It sounded like a human sigh. It sounded like exhaustion.

  "It is a lonely philosophy, Gantry," Elias said.

  "It is a clean one," Gantry replied. "It leaves no ghosts. Only men."

  Elias closed his eye. He did not think of the mare. He thought of the duty. He thought of the preservation of his own capacity to be kind to his daughter. He told himself he was doing this to keep his heart soft for her. He told himself the horse was already gone, that this was just the breaking of a machine.

  He pulled the trigger.

  The sound was immense in the enclosed space, a crack of thunder that shattered the quiet. The mare dropped straight down, her legs folding beneath her. She did not kick. She did not scream. She was simply a weight that had ceased to be supported.

  Smoke drifted up from the gun. The smell of cordite mixed with the smell of hay and manure.

  Elias lowered the arm. He looked at the body. It was just a body. A arrangement of bone and meat that no longer functioned. He waited for the coarsening. He waited for the hardening of his chest.

  He felt nothing. No grief. No relief. Just a hollow silence.

  Gantry stepped forward and looked down at the animal. He nodded, once. "Clean," he said. "You have done no wrong. You have maintained your station."

  Elias put the gun back in his pocket. He reached out and touched the mare's ear. It was already cooling.

  "I need to go inside," Elias said. "My daughter will be waking."

  "Go," Gantry said. "Be kind to her. That is where the duty lies."

  Elias walked out of the barn into the blinding white snow. The air was sharp and cold. He walked toward the farmhouse, his boots crunching on the frozen ruts. He opened the kitchen door. The warmth hit him, smelling of coffee and woodsmoke.

  His wife was at the stove. His daughter sat at the table, coloring with a stub of charcoal. She looked up when he entered.

  "Papa?" she said.

  Elias looked at her. He tried to summon the feeling Gantry had spoken of. He tried to access the sympathy he had supposedly preserved. He looked at his daughter, this rational being, this end in herself. He knew he ought to feel a surge of love, a recognition of her dignity that he had denied the horse.

  He smiled. It was a correct smile. It was the smile of a man who knows his duty.

  "Good morning, Mary," he said. His voice was steady. It was not unkind.

  He hung his coat on the peg. He washed his hands in the basin, scrubbing the smell of the barn from his skin. He sat at the table. He was a good man. He had done the right thing. He had harmed no person.

  But as he watched his daughter draw a circle on the paper, he realized with a slow, creeping dread that he was looking at her the same way he had looked at the mare. He was checking for utility. He was checking for reason. He was wondering if she was an end, or if she was just another mirror for his own soul.

  He reached out to touch her hair. She leaned into his hand.

  Elias pulled his hand back, just slightly, before the contact was complete. He was afraid that if he touched her, he would find she was as hollow as the horse. Or worse, that he was the only hollow thing in the room, and the philosophy had worked exactly as intended, leaving him alone in a world of things, safe and utterly without kin.

  "Are you cold, Papa?" his wife asked.

  "No," Elias said. "I am perfectly preserved."

  He picked up his coffee cup. It was warm. He drank it down, and he did not shiver.
