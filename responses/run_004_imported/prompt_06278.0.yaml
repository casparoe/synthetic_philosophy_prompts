  4.  **Drafting the Explanation - Step-by-Step:**

      *   **Acknowledge the Frustration:** Validate the chemist's instinct. In classical logic (and classical chemistry), rejecting all four *is* nonsense. If you rule out the whole sample space, you have an error in the experimental design.
