  2.  **Deconstruct the Tetralemma (Catuskoti):**
      *   Standard Logic: $P$ or $\neg P$ (Excluded Middle). Cannot be $P \land \neg P$ (Non-Contradiction).
      *   Tetralemma:
          1.  $P$ (Exists)
          2.  $\neg P$ (Does not exist)
          3.  $P \land \neg P$ (Both)
          4.  $\neg (P \lor \neg P)$ (Neither)
      *   Nagarjuna's Move: Reject all four.
      *   *Why?* This is the crux. It's not about establishing a *new* truth value system (like paraconsistent logic implies in a static sense) but about dismantling the *framework* that makes the question askable.

  3.  **Identify the Core Misunderstanding (The Chemist's Lens):**
      *   A chemist assumes the terms refer to *substances* or *entities* with intrinsic properties. "Does the Tathagata exist?" implies "Tathagata" is a thing that can have the property of "existence" or "non-existence."
      *   Nagarjuna's Point: "Tathagata" (and "cause," "effect," "self") has no intrinsic nature (*svabhava*). Therefore, predicates like "exists" or "doesn't exist" don't stick.
