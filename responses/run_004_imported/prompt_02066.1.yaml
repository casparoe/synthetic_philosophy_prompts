  6.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Correction:* Lewis's RCA actually handles Finks well. The real battleground is Masks and the *specification of the basis*.
      *   *Key Insight:* Bird argues that masks show the conditional is not sufficient. But the deeper Primitivist point (Mumford, Ellis) is that the *basis* itself is often dispositional.
      *   *Let's try a different angle for the Primitivist:* The "Reverse Fink" or the idea that the "basis" clause is itself dispositional.
