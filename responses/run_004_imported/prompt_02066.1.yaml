answer: |-
  **Setting:** *The faculty lounge coffee station, 4:30 PM. The smell of stale espresso and dry-erase markers. Two philosophers, Elena and Mark, are leaning against the counter, nursing paper cups.*

  **Elena:** That seminar was... lively. I thought the speaker was going to throw a marker at the questioner during the Q&A.

  **Mark:** You mean when she asked if causal powers are just "Humean glue" with a marketing budget? Yeah. But honestly, the stuff on dispositions was the real sticking point. I still don't buy that we can analyze them away.

  **Elena:** Come on, Mark. You're a Primitivist through and through. You want to populate the world with little latent powers waiting to burst forth. I'm still holding out for the Reductionist dream. Dispositions *are* conditional facts, we just need the right analysis.

  **Mark:** The Simple Conditional Analysis (SCA) is dead, Elena. *If struck, then break.* Martin and Lewis killed it twenty years ago. The Fink cases are decisive.

  **Elena:** Finks are messy, sure. The sorcerer who snaps his fingers and makes the glass non-fragile the microsecond before it's struck. SCA says "If struck, it would break" is false, so the glass isn't fragile. But intuitively, it *was* fragile right up until the strike.

  **Mark:** Exactly. The stimulus kills the disposition before the manifestation.

  **Elena:** But that's why Lewis proposed the Reformed Conditional Analysis (RCA). It's not just "If $S$, then $M$." It's "If $S$, and the intrinsic causal basis $B$ is retained, then $M$." In the Fink case, the basis *isn't* retained—the sorcerer changes the molecular structure. So the antecedent of the conditional is false, the conditional holds vacuously or is simply not triggered, and we preserve the judgment that the glass was fragile *because* it had the basis $B$ prior to the strike.

  **Mark:** Lewis's fix works for Finks, I'll grant you that. By building the retention of the basis into the antecedent, you stop the stimulus from cheating by deleting the power. But that brings us to the asymmetry that's been bugging me. Why do we treat Finks and Masks so differently?

  **Elena:** Because they attack different links in the chain. A Fink attacks the *possession* of the disposition. A Mask attacks the *manifestation*.

  **Mark:** Right. Take Johnston's masking cases. The glass is wrapped in bubble wrap. You strike it. It doesn't break. The molecular structure—the basis $B$—is perfectly retained. No sorcerer, no magic. So Lewis's RCA says: "If struck and basis retained, it would break." But it *doesn't* break. The bubble wrap absorbs the shock. So the conditional is false, which implies the glass isn't fragile. But it *is* fragile.

  **Elena:** Okay, so for Masks, we just add a "no interferers" clause to the antecedent. "If struck, basis retained, and no masking conditions obtain, then break."

  **Mark:** And there it is. There's your asymmetry. To fix the Fink, you only have to hold one thing fixed: the intrinsic state of the object. That's local. To fix the Mask, you have to rule out *everything else in the universe* that might stop the manifestation.

  **Elena:** Not everything. Just the relevant interferers.

  **Mark:** Who decides what's relevant? If I say the glass is fragile, I mean it would break if struck in *normal* conditions. But "normal" is doing all the heavy lifting. If you have to list the absence of every possible mask—bubble wrap, force fields, divine intervention, local gravity anomalies—your antecedent becomes infinitely long. You can't reduce a finite property of the glass to an infinite conditional about the environment.

  **Elena:** That's the "indefinite extensibility" objection. Bird pushes it hard. But look, we don't need to list them explicitly. We rely on context. When a scientist says "cyanide is poisonous," they mean "if ingested by a human with a standard metabolic system, absent antidotes." The "standard metabolic system" clause implicitly excludes the masks.

  **Mark:** But "standard" is dispositional! A standard metabolic system is one *disposed* to process cyanide in a certain way. You're analyzing dispositions in terms of other dispositions. You haven't reduced them to non-dispositional conditionals; you've just pushed the modality into the background conditions.

  **Elena:** Is that fatal? Maybe reduction doesn't mean "eliminate all modal talk." Maybe it means "locate the truth-makers." The truth-maker for "fragile" is the microstructure. The conditional just tells us how that truth-maker connects to inputs and outputs.

  **Mark:** But if the conditional can't be specified without presupposing the very power you're trying to analyze, it's not an analysis. It's a description. Here's a sharper counterexample for your "no interferers" clause. Consider a "Reverse Fink."

  **Elena:** A Reverse Fink?

  **Mark:** An object that *lacks* the disposition, but the stimulus *creates* it instantly before manifestation. Imagine a non-fragile glass that a sorcerer makes fragile the moment it's struck, so it breaks. Your SCA says "If struck, it breaks," so it's fragile. But it wasn't fragile *before* the strike. Lewis's RCA handles this by checking the basis *at the time of the stimulus*.

  **Elena:** Right, the basis must exist at $t$.

  **Mark:** Now combine them. A "Masked Fink." The glass is fragile. The sorcerer is ready to make it non-fragile (Fink), but he also has a force field ready to catch it if he fails (Mask). Or simpler: The glass is fragile, but it's packed in bubble wrap (Mask). However, the bubble wrap is rigged to dissolve if the glass is struck (Reverse Fink on the mask?). No, let's stick to the core issue. The problem is that for Masks, the "interference" isn't always an event. It can be a standing condition.

  **Elena:** So?

  **Mark:** So, to cash out "no masks," you need a totality fact. You need to say "and nothing else prevents it." But "prevents" is causal. You're defining causation in terms of dispositions, and dispositions in terms of causation. It's circular. The Primitivist says: Stop running. The fragility *is* the power. The conditional is just the shadow it casts when the light shines. You're trying to eat the shadow.

  **Elena:** I think you're demanding too much precision from the reduction. Look, in the special sciences, we use ceteris paribus laws all the time. "Water boils at 100°C." Well, not at high altitude, not in a microwave without nucleation sites, not if it's superheated... Do we say boiling point isn't real because we can't list every mask?

  **Mark:** We say boiling point is a dispositional property of water relative to atmospheric pressure.

  **Elena:** Exactly! Relative to conditions. My claim isn't that there's a context-free conditional. It's that for any fixed context $C$, the disposition reduces to "If $S$ in $C$, then $M$." The disposition *is* the function from contexts to conditionals.

  **Mark:** But who fixes the context? If I ask, "Is this glass fragile?" I'm not asking "Is it fragile in a vacuum?" or "Is it fragile in bubble wrap?" I'm asking about the glass. The fragility has to be *in there*, robust across a range of contexts. If the truth of the attribution depends on an open-ended list of external conditions, the property isn't intrinsic. But fragility *feels* intrinsic.

  **Elena:** It is intrinsic. The basis $B$ is intrinsic. The *manifestation* depends on extrinsic conditions. That's why the asymmetry matters. Finks threaten the intrinsicality of the basis, so Lewis fixes it by stipulating the basis stays put. Masks threaten the connection between basis and manifestation. But that connection *should* depend on the environment. Gravity is intrinsic to mass, but whether you fall depends on whether there's a floor.

  **Mark:** But mass isn't defined by falling. Mass is defined by resistance to acceleration.

  **Elena:** Which is another conditional! "If force applied, then accelerate."

  **Mark:** Touché. But here's my final wedge. Suppose we have a perfect microphysical duplicate of a fragile glass. Call it Glass*. Glass* is in a universe with different laws of physics where silicon bonds don't shatter under impact; they flex like rubber. Same intrinsic basis. Different conditional outcome.

  **Elena:** Then it's not a duplicate. If the laws are different, the causal powers of the microstructure are different.

  **Mark:** Aha! So the basis *isn't* categorical. The microstructure only counts as a basis for fragility because of what it *does*. Its identity as a basis is dispositional. You haven't reduced the disposition to a categorical base plus a conditional. The base *is* a cluster of lower-level dispositions.

  **Elena:** *Pauses, taking a sip of coffee.* Okay. That's the Humean vs. Anti-Humean bedrock, isn't it? If I say the microstructure is categorical, you say "Show me the categorical." If I say it's dispositional, you say "Aha! Circularity."

  **Mark:** Precisely.

  **Elena:** Here's my reply, though. Even if the base is dispositional, the *level* of analysis matters. At the level of macroscopic objects, "fragile" is useful because it tracks a stable pattern of conditionals. I don't need to solve the metaphysics of quantum fields to say the glass will break. The reduction works pragmatically, even if it bottoms out in powers at the fundamental level. I can be a Reductionist about glass and a Primitivist about electrons.

  **Mark:** A layered ontology? That's... surprisingly reasonable. But you're conceding that at the fundamental level, the Conditional Analysis fails.

  **Elena:** I'm conceding that at the fundamental level, the distinction between "power" and "categorical base" might dissolve. But for the glass? I still think Lewis's RCA gets it 90% right. The Fink is a cheat, the Mask is a context error.

  **Mark:** And I think the Mask shows that the "context" is doing all the work, and the context is just a placeholder for the powers of the environment. But... I suppose if you're willing to let the fundamental level off the hook, we're not fighting about the glass anymore. We're fighting about the electrons.

  **Elena:** Which is where the real fun is.

  **Mark:** *Raises cup.* To the electrons, then. May they remain irreducibly spooky.

  **Elena:** *Clinks cup.* And may the conditionals hold, ceteris paribus.
