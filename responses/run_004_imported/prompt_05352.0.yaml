answer: |-
  **Setting:** *A quiet corner of a coffee shop, late evening. Two empty mugs sit between Alex (defender of the Divine Hiddenness argument) and Jordan (Reformed theist). The conversation has been running hot for an hour.*

  **Alex:** Let's strip this back to the epistemology. My core objection isn't even about whether God exists. It's about the structure of your defense. You're claiming that every single nonbeliever is, at some level, resisting God. But you admit we don't have introspective access to that resistance. If the subject can't see it, and I can't see it, and you can't see it... what work is the claim doing? It renders "nonresistant nonbelief" an empty set by definition. That's not a theory; it's a tautology shielded from evidence.

  **Jordan:** I get why it feels like a dodge. But you're assuming that "nonresistant" is the default state that needs proving. I'm arguing that given the noetic effects of sin, resistance is the default. But let's meet you on the epistemic ground. You say it's unfalsifiable because we can't verify resistance. Okay. Flip it. How do *you* verify nonresistance? You look at someone—say, a sincere agnostic who prays, "God, if you're there, show me"—and you say, "See? Nonresistant." But how do you know they aren't self-deceived?

  **Alex:** Because I take testimony seriously. If someone reports, "I am open to belief, but I lack evidence," and their life shows no active hostility toward religious practice, I have no defeater for that testimony. I don't need to read their soul. I just need a reasonable heuristic. If I require infallible access to the heart before I can accept someone is a counterexample to your theory, you've set the bar so high nothing could ever count against it.

  **Jordan:** But self-deception is a documented psychological phenomenon. People lie to themselves about their motives all the time. A husband might swear he's not angry at his wife while slamming cupboards. He *feels* like he's just being practical. If self-deception exists in mundane contexts, why is it special to say it exists spiritually? You're trusting the subject's self-report over the theological framework that predicts self-deception. That's not neutral; that's privileging the subject's limited introspection.

  **Alex:** I'm not privileging it as infallible. I'm saying it's the *best evidence we have*. If we discard first-person reports of openness because "maybe they're lying to themselves," we can't make claims about human psychology in *any* domain. But here's the deeper issue: Even if they are self-deceived, wouldn't a perfectly loving God bypass that deception? If the resistance is unconscious, hidden even from the seeker, God knows it's there. He could overcome unconscious resistance without violating freedom. Schellenberg's point is that a loving parent doesn't let a child's confusion keep them apart if the parent has the power to clarify.

  **Jordan:** That assumes the relationship is primarily intellectual. In the Reformed view, the resistance isn't just a lack of data; it's a volitional orientation. It's not that they *can't* see; it's that they *won't* see, even if the "won't" is baked into their nature. You ask why God doesn't bypass it. Sometimes He does. That's what conversion is. But if He bypassed it for everyone, you'd have coercion, not relationship.

  **Alex:** But that's the thing. You're saying He bypasses it for *some*. Which ones? The elect? Then we're back to unfalsifiability. If Person A believes, you say "God overcame their resistance." If Person B doesn't believe, you say "Person B's resistance was too deep." From the outside, A and B look identical before the moment of belief. They both had doubts; they both had questions. The only difference is the outcome. So "resistance" becomes a post-hoc label for "didn't believe."

  **Jordan:** No, it's not post-hoc. It's explanatory. Look, let's talk about access. You want an external marker of resistance. What would count? If someone screams, "I hate God," that's resistance. But what about the person who says, "I just don't care"? Is that nonresistance? Or is indifference the ultimate resistance?

  **Alex:** Indifference can be nonresistant if it's born of genuine apathy rather than rebellion. Maybe they just think religion is irrelevant, like stamp collecting. They aren't suppressing truth; they just haven't seen a reason to engage.

  **Jordan:** But in a universe where God is the source of Being, indifference *is* suppression. It's saying, "I am the center, and God is optional." That's a moral stance, not just an intellectual one. Here's my epistemic challenge to you: You claim Schellenberg's argument works because there are *actual* nonresistant nonbelievers. But to know that for a fact, you need access to the heart that you just told me *I* don't have. If I can't know they are resistant, you can't know they are nonresistant. You're in the same epistemic boat.

  **Alex:** Not the same boat. I'm making a probabilistic claim based on available evidence. I see many seekers who fit the profile of nonresistance. I conclude it's likely some are genuine. You are making a universal negative claim: *No one* is nonresistant. To support that, you need a mechanism that guarantees resistance in every single case. Your mechanism is "sin," which is invisible. So yes, the asymmetry holds. I only need one plausible case to make my argument; you need to explain away every single case.

  **Jordan:** I don't need to explain them away individually if the nature of the case is universal. But let's press the access point. You say you rely on testimony. What happens when the testimony changes? I've talked to atheists who became Christians. They often say, "I thought I was seeking, but I realize now I was seeking a God on my terms." Their self-assessment changed. Does that mean their earlier testimony was false?

  **Alex:** It means their interpretation changed. But at time *T1*, when they were praying and getting no answer, they were nonresistant *at T1*. If God is timeless, He meets them at T1. If He waits until T2 when they are "ready," He's withholding relationship during the period of sincere seeking. That's the hiddenness problem. It's not about the final destination; it's about the duration of the silence during the sincere search.

  **Jordan:** But how do you measure the sincerity of the search from the outside? You're assuming that because *you* can't detect resistance, God can't detect it. But if God is the judge of the heart, He sees the subtle idolatries. Maybe the person is saying, "Show me," but meaning, "Show me so I can control you." That's resistance. And since we can't access that motive perfectly, we can't use the nonbeliever's experience as a definitive proof against God's existence. We lack the data.

  **Alex:** This is the "Secret Sins" defense. It's logically possible, sure. But it kills natural theology. If the evidence for God is always ambiguous enough to be rejected by the "resistant," but clear enough to condemn them for rejecting it... that makes God a trap. You're arguing that God provides evidence that is sufficient to condemn but insufficient to convince unless He flips a switch. That might be sovereign, Jordan, but is it loving? Schellenberg says a loving God prioritizes being found over remaining hidden.

  **Jordan:** A loving parent also prioritizes the child's growth over immediate comfort. Sometimes hiding is an act of love. Kierkegaard talked about this—if God appeared in full glory, we'd be overwhelmed into obedience, not love. But I want to return to your epistemic confidence. You say, "I see a seeker, therefore they are nonresistant." I say, "I see a human, therefore they are capable of self-deception." Why is your read on human psychology more robust than mine? You're treating "nonresistance" as a visible behavior. I'm treating it as a heart orientation.

  **Alex:** Because behavior is all we have! We can't judge hearts. That's my point. If we can't judge hearts, then *you* can't claim everyone is resistant either. You're making a theological claim that functions as an empirical one. You're saying, "Look at the world, see all these nonbelievers? That's evidence of universal resistance." But if resistance is invisible, the nonbelief itself is the only evidence. So your argument is: "Nonbelief exists. Therefore resistance exists." That's circular.

  **Jordan:** It's not circular if you accept the premise of total depravity. But I'm not trying to prove total depravity to you empirically. I'm showing that your argument from hiddenness relies on a premise you can't verify: *That there exists a nonresistant nonbeliever.* You can't verify that from the outside. And the inside testimony is unreliable due to self-deception. So the argument stalls. It doesn't prove God doesn't exist; it proves we can't know the status of the seeker.

  **Alex:** It proves that if your theology is true, we can never know if a seeker is sincere. But that undermines the very idea of revelation. If God wants relationship, He communicates in a way that cuts through the noise. If the "noise" of sin is so loud that sincere seeking looks identical to resistant suppression, then the communication channel is broken. A loving God fixes the channel.

  **Jordan:** He does. That's the Holy Spirit. But He fixes it on His terms, not on the timeline of the philosopher.

  **Alex:** And there it is. "On His terms." Which sometimes means letting sincere people die in the dark.

  **Jordan:** Which means we don't know who was truly sincere. Only God knows.

  **Alex:** Exactly. Only God knows. So why are *you* telling *me* that every nonbeliever is resistant? You don't know that. You're claiming knowledge of a hidden variable to save a theory from a visible counterexample.

  **Jordan:** I'm not claiming to know the individual cases. I'm claiming the principle holds. Just like I don't need to check every human's DNA to say humans share genetic traits. The theological anthropology says resistance is the trait. You're asking for an exception to the rule to be verified by the very people subject to the rule.

  **Alex:** But Schellenberg isn't asking for an exception. He's saying the rule itself makes the relationship impossible. If the condition for belief is "overcome resistance," and the resistance is invisible and universal, then belief is never about evidence. It's about divine intervention. So why argue about evidence at all? Why not just say, "God hides from everyone until He chooses not to"?

  **Jordan:** Because He *doesn't* hide from everyone. General revelation is everywhere. Romans 1 says it's clearly perceived. The problem isn't the visibility of God; it's the suppression of the truth. The sun is shining, Alex. You're arguing it's dark. I'm saying you're wearing sunglasses you don't realize you're wearing.

  **Alex:** And I'm saying that if the sun is shining, and I'm standing outside squinting, and I ask for help taking the glasses off, and no one helps... the sun might as well not be there. And if you tell me, "You're not really asking," when I feel like I am... then we have no common ground to discuss reality. We're stuck in a war of introspective authority.

  **Jordan:** Then maybe that's the limit of the argument. You want an external verification of an internal state. I'm saying the internal state is corrupted, so external verification is impossible without divine illumination.

  **Alex:** So the argument from hiddenness is valid, but you can't see it because you're hidden from yourself.

  **Jordan:** And the argument from resistance is valid, but you can't see it because you think you're transparent.

  **Alex:** *Sighs.* So we're both claiming the other is blind to their own condition.

  **Jordan:** Looks like it.

  **Alex:** Well. At least we agree on the epistemic stalemate.

  **Jordan:** Agreed. But I'd still bet on the sunglasses.

  **Alex:** And I'd still bet on the dark.

  *They both reach for their cold coffee, the silence heavier than before.*
