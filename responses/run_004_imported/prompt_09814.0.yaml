      *   **The Disjunction Problem:** If a detector fires for $A$ (flies) and $B$ (BBs), does it represent $A$, $B$, or $A \lor B$? Causal theories struggle here.
      *   **Teleosemantics' Solution:** Content is determined by the *historical* success conditions of the mechanism's ancestors, not current performance.
      *   **The User's Objection:** "Proper function" sounds like "what it normally does." If frogs normally snap at BBs sometimes, isn't that part of the function?
      *   **Millikan's Distinction:** Proper function $\neq$ Statistical normality. Proper function = What the trait was *selected for* in the evolutionary past.
      *   **The "Fodor Objection":** Jerry Fodor famously attacked this. If the frog snapped at BBs in the past and survived, why isn't "BB or Fly" the content? Millikan's reply involves the *Derived Proper Function* and the specific mapping relation.

  3.  **Drafting the Response - Section by Section:**

