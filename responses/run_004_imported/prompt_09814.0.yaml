answer: |-
  It is excellent to hear from someone with a background in evolutionary biology tackling this. You have hit on exactly why the debate over teleosemantics has been so heated for the last forty years. Your intuition is not a misunderstanding; it is essentially the core of Jerry Fodor's famous objection to Millikan.

  You feel it's a bait-and-switch because, on the surface, "proper function" sounds like a synchronic description of what a system *does*, but Millikan intends it as a diachronic explanation of why the system *exists*.

  Here is the breakdown of why philosophers still credit the theory, where your biological radar is correctly pinging, and how Millikan attempts to dodge the "BB pellet" bullet.

  ### 1. Proper Function vs. Statistical Normality
  Your critique rests on the idea that "proper function" collapses into "what the mechanism reliably does." For a biologist, this is the natural reading. If a heart occasionally pumps air (embolism), and we observe a population of hearts, isn't the "function" just the statistical aggregate of pumping events?

  Millikan says **no**. She distinguishes between:
  *   **Performance:** What the trait actually does (including errors, misfires, and snapping at BBs).
  *   **Proper Function:** What the trait was *selected for* in the evolutionary past.

  To use a biological analogy: Consider a vestigial structure or a malfunctioning organ. If a heart has a defect and pumps inefficiently, its *statistical performance* is poor. But its *proper function* remains "pumping blood," because that is the effect that explains the reproduction of heart-traits in the lineage.

  In the frog's case, the "Proper Function" of the visual detector is not defined by what it fires at *today* (flies + BBs), but by what it fired at in the **history of selection** that caused the gene for that detector to proliferate. If the ancestors of the frog survived *because* they caught flies, and the BB-snapping was evolutionary noise (neutral or slightly deleterious but linked to the fly-snapping trait), then the proper function is fixed by the fly-correlation, not the BB-correlation.

  ### 2. The "Normal Conditions" Clause
  This is where the theory gets technical, and where your skepticism is most warranted. Millikan introduces the concept of **"Normal Conditions"** (capital N).

  Normal Conditions are not "statistically frequent conditions." They are **the conditions under which the selection history took place.**
  *   **Statistical Normalcy:** Frogs encounter BBs 5% of the time.
  *   **Millikan's Normal Conditions:** The specific environmental mapping that existed when the neural mechanism was being selected.

  If, in the Environment of Evolutionary Adaptedness (EEA) for the frog, there were no BB pellets, then the mechanism's content is fixed by the correlation that existed *then*. The fact that the frog snaps at a BB now is a **misrepresentation** because the mechanism is operating outside its Normal Conditions.

  This is why philosophers credit teleosemantics with solving the **Disjunction Problem**. Causal theories (like Fodor's early asymmetry theory) struggled to explain error. If a state is caused by a fly, it means "fly." If it's caused by a BB, it means "BB." So if it fires for both, it means "Fly OR BB." There is no error; the frog is never wrong.

  Teleosemantics allows for **error**. The frog is *wrong* about the BB because the BB does not satisfy the proper function (nutrition/reproduction) established by the selection history.

  ### 3. The Consumer Semantics (The Biologist's Save)
  However, you are right to be suspicious. Fodor's counter-punch was devastating: *How do you know the selection history was for "flies" and not "small dark moving things"?* If the frog's ancestors snapped at dark things (some nutritious, some not) and survived, the selection pressure was for "snapping at dark things," not specifically "flies."

  Millikan's sophisticated reply involves **Consumer Semantics**.
  She argues you cannot look at the detector (the producer) in isolation. You must look at the **consumer** of the signal.
  *   **Producer:** The visual neuron firing.
  *   **Consumer:** The tongue-snapping motor program and the digestive system.

  The content of the representation is fixed by what the *consumer* needs to do its proper function. The digestive system's proper function is to process *flies* (nutritive matter), not *BBs* (lead). The motor program is designed to deliver a fly to the stomach. Therefore, the visual signal's content is fixed by the requirements of the digestive system.

  If the signal fires for a BB, the consumer fails to perform its proper function. Thus, the content was "Fly," and the system has malfunctioned. This moves the semantic burden from the ambiguous detector to the specific metabolic needs of the organism.

  ### 4. Why the "Bait-and-Switch" Feeling Persists
  Despite the Consumer argument, many philosophers (and biologists) remain unsatisfied for reasons that should resonate with you:

  1.  **Indeterminacy of Selection:** As an evolutionary biologist, you know that selection rarely acts on single, neat variables. Did selection favor "fly detection" or "high-contrast motion detection"? The genetic and phenotypic reality is often a messy cluster of correlations. Teleosemantics requires a level of historical specificity that evolutionary biology often denies exists.
  2.  **The Swampman Objection:** If a lightning strike creates a molecule-for-molecule duplicate of a frog (Swampfrog) with no evolutionary history, does it have mental content? Millikan says no (no history, no proper function). Most intuitions say yes. This suggests teleosemantics might be describing the *history* of meaning, not the *nature* of meaning.
  3.  **Time Lag:** Evolution is slow. If the environment changes faster than selection (e.g., frogs now live near factories with BBs), the "Proper Function" is anchored in the past, but the organism is living in the present. The theory privileges the ancestral environment over current utility in a way that feels rigid for a dynamic system.

  ### 5. Why It Still Matters
  So, why do philosophers still credit it?
  *   **Naturalism:** It is the most robust attempt to ground meaning in physical science without invoking dualism or idealism.
  *   **Normativity:** It explains how a physical system can be *wrong*. A thermostat isn't "wrong" when it breaks; it's just broken. A frog can be *mistaken*. Teleosemantics provides a naturalistic basis for this normativity (success vs. failure of biological function).
  *   **Integration:** It forces philosophy of mind to engage with evolutionary biology, rather than treating the mind as a logic machine floating above the brain.

  ### Summary for a Biologist
  You aren't missing a subtlety; you are identifying the tension between **etiological function** (history of selection) and **dispositional function** (current causal powers).

  Teleosemantics solves the disjunction problem by anchoring content in **history** (what the trait was selected for) and **systemic integration** (what the consumer needs), rather than current causal covariance.

  However, your skepticism is shared by many. The theory works best when the evolutionary history is clear-cut (which, as you know, it rarely is). It trades the "spookiness" of dualism for the "fuzziness" of deep-time reconstruction. It hasn't "solved" the problem in a mathematical sense, but it successfully shifted the burden of proof: if you want to explain meaning, you now have to explain the biological function.

  If you want to dig deeper into the specific biological objections, I recommend looking at **Peter Godfrey-Smith's** work. He is a philosopher who writes with enough biological literacy to respect your intuition that "proper function" is often more messy than Millikan allows.
