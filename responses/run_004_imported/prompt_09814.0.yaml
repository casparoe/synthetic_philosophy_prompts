      *   **Goal:** Explain *why* philosophers still credit teleosemantics with making progress on this, clarify the distinction between "proper function" and "statistical normalcy" (especially from an evolutionary biologist's perspective), and acknowledge the validity of the user's skepticism (because it's a well-known objection).

