answer: |-
  The rain on the tin roof of the field station was a constant, static hiss, the kind of white noise that eventually disappears into the background of thought. Elara sat at the scarred wooden table, two thick binders open before her. One was bound in blue tape, the other in red.

  Outside, the jungle of the upper Amazon basin breathed in the dark. Inside, the air smelled of damp paper and stale coffee.

  Marcus leaned over her shoulder, squinting at the pages. He was her departmental supervisor, here for the final review before the documentation was archived. He tapped the blue binder. "This is the standard ontology? Count nouns, object permanence, discrete entities?"

  "Yes," Elara said. She didn't look up. Her eyes were fixed on a specific entry in the red binder.

  "And the red one?"

  "Alternative analytical hypotheses," she said.

  Marcus sighed, pulling up a chair. "Elara, we need a single translation manual for the community records. We can't submit 'Option A' and 'Option B' for basic vocabulary. Pick the one that matches the evidence."

  "They both match the evidence," Elara said softly. "Perfectly."

  "That's impossible. If they differ, one must be wrong."

  "They differ on reference, Marcus. Not on truth conditions." She slid the red binder toward him. "Look at entry four-zero-nine. *Kaba*."

  Marcus scanned the notes. "*Kaba*. Observed stimulus: presence of a rabbit. Native assent: Yes. Native dissent: No. Standard translation: 'Rabbit'." He looked at the red page. "Here you have it as 'Undetached rabbit part'."

  "Or 'Temporal stage of a rabbit'," Elara corrected. "It doesn't matter which. The point is, if *kaba* refers to a rabbit part, then the grammar surrounding it compensates. In the blue manual, *kaba* is a count noun. In the red manual, it's a mass noun. When the speaker says *'Lo kaba,'* blue translates it as 'There is a rabbit.' Red translates it as 'There is some rabbithood' or 'There is a rabbit-stage present.'"

  Marcus rubbed his temples. "But when they point to a whole rabbit, they assent. If I point to a paw, do they dissent?"

  "We tested that," Elara said. "If you point to a paw while the rabbit is present, they assent. If you point to a paw after the rabbit is gone, they dissent. The stimulus meaning is identical. The sensory irradiation on their retinas is the same in both cases."

  "So ask them," Marcus said, frustration creeping into his voice. "Ask them: 'Does *kaba* mean the whole animal or just the piece?'"

  Elara finally looked at him. Her eyes were tired. "In what language, Marcus? To ask that question, I have to use English. I have to use words like 'whole,' 'part,' 'animal,' 'piece.' But the meaning of *those* words is only fixed within my own background language. I'm trying to map their terms to mine. If I assume my ontology of objects to ask the question, I've already begged the question. I'm forcing their speech into my grid."

  "There has to be a fact of the matter," Marcus insisted. "When a child learns the language, they learn what the words stand for. There's a reality out there."

  "Quine would say there's a reality of stimuli, and a reality of physical objects posited by science," Elara said. "But there is no fact of the matter about what a word *refers to* independent of a translation manual. Reference is inscrutable."

  She stood up and walked to the window, watching the rain blur the glass. "Think about the compensation. In the red manual, because *kaba* means 'rabbit part,' the verb structure changes. What blue translates as 'is the same rabbit,' red translates as 'is part of the same rabbit fusion.' Every sentence, every assertion, every prediction about what they will say next is identical in both manuals. If I predict they will assent to *'Kaba navo,'* both manuals predict assent. They just explain the internal structure of that assent differently."

  Marcus flipped through the pages, faster now, looking for the crack. "One of them has to be what they *mean*."

  "That's the intuition we have to kill," Elara said. "We want to think meaning is a mental ghost that hovers over the word. But all we have is behavior. All we have is the disposition to assent or dissent given a sensory stimulus. Once you've accounted for all possible behavioral dispositions, you've accounted for everything there is to know. There is nothing left over."

  She turned back to the table. "If I spend another ten years here, if I record every utterance they ever make until the last speaker dies, I will not find a single piece of data that favors blue over red. Not because the data is hidden. But because the data doesn't exist."

  Marcus sat back, the chair creaking in the silence. The rain hammered on. "So what do we publish? 'We don't know what their words refer to'?"

  "We publish that reference is relative to the manual," Elara said. "We publish both. Or we pick one pragmatically. Blue is simpler for us, because it matches our English ontology. But we have to annotate it. We have to admit that when I write *'kaba = rabbit,'* I am not reporting a discovery. I am imposing a scheme. I am supplying the analytical hypotheses that bridge the gap."

  Marcus looked at the two binders. They sat side by side, heavy with the weight of the same information, structured differently. They were empirically equivalent. They were logically incompatible. They were both perfect.

  "It feels like surrendering," Marcus said quietly.

  "It's accepting the limits of the evidence," Elara replied. "Nature decides what counts as evidence. Nature decides the stimulus. But nature doesn't decide how we carve the stimulus into objects. We do that. We bring the objects to the world."

  She reached out and closed the blue binder. Then she closed the red one. She didn't stack them. She left them side by side on the table, equal and unresolved.

  "I'll write the introduction," Elara said. "I'll explain the indeterminacy."

  "And if they ask which one is true?"

  Elara picked up her pen, hovering it over the logbook. The ink waited, dark and fluid.

  "Then we tell them there is no fact of the matter," she said. "And we hope they understand that the silence isn't because we couldn't hear the answer. It's because there was never a question to answer."

  She put the pen down. The rain continued to fall, washing over the jungle, indifferent to the boundaries they tried to draw around it.
