answer: |-
  This is a profound ethical dilemma that cuts to the heart of what institutions are for. Your intuition is not crazy; in fact, it is protecting something essential about the integrity of judgment itself. However, your fellow judge (and your lawyer partner) are not arguing in bad faith. They are arguing from a different ethical framework.

  To answer your question: **No, she is not right that weighing this stuff is an "undodgeable part of judging."** She is right that consequences are undodgeable parts of *living*, but she is wrong that they belong inside the specific mechanism of a *prize*.

  Here is the principled reason to keep "would the world be better if this book won" separate from "is this the better book," and why your hesitation is actually a defense of the prize's utility.

  ### 1. The Distinction Between Retrospective and Prospective
  A literary prize is, by definition, a **retrospective** judgment. It is an assessment of labor already completed. It asks: *What was achieved here?*

  Your fellow judge is trying to turn the prize into a **prospective** investment. She is asking: *What good can we do with this lever?*

  These are both valid questions, but they require different tools.
  *   If the goal is to honor excellence, you give a **Prize**.
  *   If the goal is to sustain the ecosystem, you give a **Grant** or a **Subsidy**.

  By using the prize to save the press, the panel is effectively laundering a grant through a competition. This corrupts the currency of the prize. If it comes out (and in small literary circles, it always comes out) that the winner was chosen to save a press rather than for merit, the prize loses its prestige. If the prize loses its prestige, the cash award matters less, the press coverage matters less, and the tool becomes useless for *everyone*, including those unknown writers the judge wants to help.

  ### 2. The Contract of the Call for Entries
  When the arts council put out the call for submissions, they entered into an implicit contract with the entrants. The terms were: *Submit your best first novel, and we will judge them against each other based on literary merit.*

  Every writer who entered, including the author of the "better" book, accepted those terms. They subjected themselves to vulnerability based on the promise of a specific metric. To change the metric mid-stream—after the cards are dealt—is a breach of that contract.

  If the criteria were "Best First Novel that also supports local publishing infrastructure," the author of the stronger book might have still entered, but the author of the weaker book might not have. Or, a third book that was mediocre but from a stable press might not have entered. You cannot know, because the rules were changed in the deliberation room.

  ### 3. Answering Your Partner's Challenge
  Your partner asked: *"Okay, so what kind of reason would count then, if not one about what actually happens as a result?"*

  This is the classic Utilitarian challenge (outcomes matter most). The answer is: **Fidelity to the defined purpose of the institution.**

  In a legal context (since your partner is a lawyer), this is the difference between a judge sentencing a defendant and a governor granting a pardon.
  *   The **Judge** looks at the law and the crime (Merit/Rules).
  *   The **Governor** looks at the person's rehabilitation and the public good (Consequences/Mercy).

  If the Judge starts handing out sentences based on which defendant needs a job more, the legal system collapses. Not because consequences don't matter, but because the *Judge's role* is specifically to isolate merit/guilt from external noise.

  So, the reason that counts is: **Does this reason align with the stated mission of the award?** If the mission is "Excellence in Debut Fiction," then press stability is irrelevant data. It is noise. Introducing it isn't "more honest"; it's introducing bias.

  ### 4. The Slippery Slope is Real
  You worried about where to stop (neediness, likability, other deals). Your fellow judge implies this is a false fear. It is not.

  Once you admit that "literary merit" is negotiable based on "ecosystem health," you have opened the door to *any* external factor.
  *   Why not give it to the writer who is poorest? (Need)
  *   Why not give it to the writer who is a single parent? (Social Good)
  *   Why not give it to the writer who is friends with the council chair? (Networking)

  All of these have "real world consequences." All of them might make the world "better" in some specific utilitarian calculus. But if you allow them, the prize ceases to be a measure of writing. It becomes a social welfare instrument. There is nothing wrong with social welfare instruments, but they must be transparent. A prize that claims to measure art but measures poverty is a lie.

  ### 5. The "Certification" Problem
  You noted this applies to grades, blurbs, and performance reviews. You are absolutely right. This is the tension between **Evaluation** and **Intervention**.

  *   **Grades:** Should a teacher curve a grade because a student needs a B to keep their scholarship? (Intervention). Or because the student demonstrated B-level knowledge? (Evaluation). If you do the former, the grade no longer signals knowledge to the next institution (college/employer).
  *   **Blurbs:** Should you blurb a book because it's good? Or because the author is your friend and needs a sale? If you do the latter, your name on the cover stops meaning "quality" and starts meaning "favor."

  When you conflate Evaluation and Intervention, you devalue the currency of the Evaluation. If employers know grades are curved for need, they stop trusting GPAs. If readers know blurbs are favors, they stop reading blurbs. If writers know prizes are about press survival, they stop respecting the prize.

  ### 6. The Tragedy of the Situation
  Your fellow judge is not wrong that the press folding is a tragedy. It is. And it is likely that the Arts Council *could* do something about it. They could issue an emergency grant. They could organize a fundraiser. They could use their influence to find the press a distributor.

  But using the fiction prize to do it is inefficient and dangerous. It sacrifices the integrity of the award (which helps *all* future winners) to save a specific press (which helps *this* batch of authors). It is a localized good purchased with institutional damage.

  ### Summary
  Your partner asked what reason counts if not consequences. The answer is **Integrity of Function.**

  A scalpel is designed to cut. A hammer is designed to strike. You can use a scalpel to hammer a nail, and technically, "the nail goes in," but you ruin the scalpel.

  This prize is a scalpel. It is designed to dissect manuscripts and identify the sharpest one. Using it to prop up a collapsing building (the press) might keep the building standing for a year, but it ruins the edge of the tool.

  **My advice?**
  Hold your line, but acknowledge the empathy. You can say:
  *"I agree that the press's survival is vital, and I agree that our decision has consequences. But this specific tool—the prize—is the only thing we have that guarantees the winners are chosen for their writing. If we compromise that, we devalue the award for every writer who enters in the future, including the ones this press would publish. We should find another way to help the press, but we cannot do it by mislabeling a grant as a prize."*

  You are not being cold. You are being a guardian of the standard. That is the only thing that makes the prize worth winning in the first place.
