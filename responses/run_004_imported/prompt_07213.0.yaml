      *   **The Core Question:** Is the fellow judge right that weighing consequences is an honest, undodgeable part of judging? Or is there a principled reason to separate "world-bettering" from "quality-certifying"?
      *   **Broader Context:** The user sees this dynamic in blurbs, grades, performance reviews, etc. (Certification + Consequence).

  2.  **Deconstruct the Philosophical/Ethical Problem:**
      *   This is a classic tension between *Deontology* (duty/rules/merit) and *Consequentialism* (outcomes/utilitarianism).
      *   It's also about *Institutional Integrity* vs. *Social Utility*.
      *   It touches on the definition of a "Prize." What is a prize *for*?

  3.  **Evaluate the Fellow Judge's Position (Consequentialist/Utilitarian):**
      *   *Strengths:* Pragmatic. Acknowledges that art doesn't exist in a vacuum. A prize *does* have material effects. Saving a press helps the ecosystem.
      *   *Weaknesses:* Corrupts the specific metric of the prize (literary merit). Sets a precedent that merit is secondary to utility. Undermines trust in the prize's brand. If discovered, looks like pity or manipulation.

  4.  **Evaluate the User's Position (Deontological/Meritocratic):**
      *   *Strengths:* Preserves the integrity of the award. Honors the specific labor of the writer. Maintains a clear standard for future judging.
      *   *Weaknesses:* Can feel cold or detached from reality. Ignores the ecosystem that allows art to exist.

  5.  **Identify the Crucial Distinction:**
      *   The fellow judge is conflating the *mission of the prize* with the *mission of the arts council/ecosystem*.
      *   If the prize is "Best First Novel," the metric is the novel.
      *   If the prize is "Best Contribution to Local Literary Health," the metric includes the press's survival.
      *   *The Switch:* The judge is changing the definition of the prize mid-stream without transparency.

  6.  **Develop the Argument:**
      *   **Validate the User:** Their intuition is correct. It *is* a category error, but a sophisticated one.
      *   **The "Promise" of the Prize:** A prize makes a promise to the entrants and the public. "We will judge based on X." If X is merit, introducing Y (press survival) breaks the contract.
      *   **The Slippery Slope is Real:** If you introduce external factors, where do they stop? Need? Race? Gender? Previous connections? (Note: Some of these *are* valid criteria if stated upfront, but ad-hoc introduction is the problem).
      *   **The "Brand" Damage:** If the better book loses, and people find out why, the prize loses prestige. If the press wins on pity, does it really help them long-term?
      *   **The Distinction between *Judging* and *Granting*:** This is key. A prize is a judgment of *past* work. A grant is an investment in *future* potential/ecosystem. The judge is treating a prize like a grant.
      *   **The Partner's Challenge:** "What reason would count?" Answer: Reasons internal to the criteria of the award.

