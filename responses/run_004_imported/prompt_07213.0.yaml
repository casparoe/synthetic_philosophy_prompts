      *   *Tone:* Empathetic, intellectual, respectful of the user's profession, not dismissive of the other judge's good intentions.
      *   *Structure:*
          1.  Acknowledge the difficulty and the validity of the other judge's empathy.
          2.  Address the core philosophical clash (Consequences vs. Integrity).
          3.  Define the specific function of a prize (Retrospective vs. Prospective).
