      *   Okay, let's have UDT convince Celia that the "impossibility" is epistemic, not ontological, *from the perspective of the decision*. Or, Celia convinces UDT that without a probability distribution over logical facts, the expectation calculation fails.
      *   Best path: UDT argues that "possibility" is about the agent's uncertainty, not the universe's structure. Celia concedes that *if* she treats her uncertainty about math like uncertainty about coins, she pays. But she maintains that logical uncertainty is fundamentally different.
