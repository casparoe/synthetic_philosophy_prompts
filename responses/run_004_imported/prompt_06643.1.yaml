      *Refining the Ending:* Let's have them realize the disagreement isn't about the money, it's about whether "logical counterfactuals" have normative force. Celia concludes she won't pay because she refuses to validate logical contradictions as decision-relevant. Ulysses concludes he will pay because he treats his decision as a logical output.
      *   Actually, the most interesting resolution is the "Precommitment" angle. Celia admits she *wishes* she could have precommitted, but now it's too late. Ulysses says it's never too late if you are updateless.
      *   Let's go with: Celia pays, but frames it as buying into a "logical insurance policy" rather than a causal transaction. She concedes the UDT frame is more powerful for agents embedded in a world with predictors, even if it feels metaphysically weird.

