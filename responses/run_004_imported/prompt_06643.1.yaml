      *   *Move 3 (Celia):* But in the coin flip version, the other branch was physically possible. Here, it's logically contradictory. How can a simulation of a contradiction be valid?
      *   *Move 4 (Ulysses):* The predictor isn't simulating a contradiction. It's simulating *you* under a false assumption. It's asking: "If I tell this agent the digit is 1, what do they do?" That's a valid computational query.
