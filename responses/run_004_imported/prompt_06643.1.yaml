  2.  **Deconstruct the Positions:**
      *   **CDT (Causal Decision Theory):** Focuses on causal consequences of actions *now*.
          *   *Standard Mugging:* Don't pay. The coin already landed. Paying doesn't change the past.
          *   *Math Mugging:* Even stronger case. The digit *is* 0. It couldn't have been 1. The "counterfactual" where it is 1 is logically impossible, not just causally inaccessible. Therefore, the condition for the $1M reward is based on an impossible world. Why pay for a reward that could never exist?
      *   **UDT (Updateless Decision Theory):** Focuses on the policy chosen *before* knowing the specific outcome (or treating the specific outcome as information that shouldn't update the policy if the policy was optimal ex-ante).
          *   *Standard Mugging:* Pay. Ex-ante, you want to be the type of person who pays, because that policy yields $1M - $100 in expectation (if prob > threshold).
          *   *Math Mugging:* The logical distinction between "chance" and "math" shouldn't matter. If the predictor simulates you in the "Digit=1" branch, that simulation is logically coherent *relative to the predictor's computation*, even if "Digit=1" is mathematically false. UDT treats logical counterfactuals as valid. You pay to maintain the integrity of the policy that gets rewarded in the "Digit=1" logical branch.

  3.  **Identify the Core Tension:**
      *   The crux is the status of the "Digit=1" world.
      *   CDT says: It's a logical impossibility. You can't optimize for impossible worlds.
      *   UDT says: It's a logical counterfactual. The predictor is running a computation "What if $\pi_{10^{100}} = 1$?" and simulating you within that context. Your action now determines the output of that simulation.

  4.  **Drafting - Stage 1: Setting the Scene:**
      *   Need a setting. A quiet room, maybe after the Predictor has left.
      *   Characters: "Celia" (CDT) and "Ulysses" (UDT).
