      *   Let's aim for a nuanced ending: Celia admits that if she views herself as an abstract algorithm, UDT wins. But if she views herself as a physical instance in time, CDT feels right. The disagreement is about *identity*. Am I a momentary flesh-bag or a timeless policy?
