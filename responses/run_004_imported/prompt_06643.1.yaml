answer: |-
  **Setting:** *A quiet living room, late afternoon. The Predictor, a sleek, silent entity, departed ten minutes ago after explaining the deal and revealing that the googol-th binary digit of $\pi$ is, in fact, 0. It is now asking for the $100. A crisp bill sits on the coffee table between CELIA (CDT) and ULYSSES (UDT).*

  **Celia:** So. The digit is zero. It was always zero. It will always be zero. There is no branch of the multiverse where it's one, unless you believe in modal realism so aggressive it allows for mathematical contradictions.

  **Ulysses:** I don't need contradictory worlds. I just need a predictor capable of running a simulation under a false assumption.

  **Celia:** But that's the rub, isn't it? In the standard Counterfactual Mugging, the coin *could* have landed heads. The "other world" was physically possible, just causally severed from us by the arrow of time. Here, the "other world" is logically impossible. The Predictor is asking me to pay a ransom for a reward that is mathematically inaccessible. It's not a mugging; it's a logical error.

  **Ulysses:** It's not an error. It's a test of your source code. Look, before you knew the digit, you had a policy. Let's call it $S$. If $S$ says "Pay when Digit=0" and "Keep when Digit=1", the Predictor rewards you in the Digit=1 branch. If $S$ says "Keep when Digit=0", you get nothing in the Digit=1 branch.

  **Celia:** I get that. Ex-ante, before the digit was computed, I'd want to commit to $S$. I'd sign the contract. But I'm not *there* anymore. I'm *here*. I have updated. I know the digit is 0. The Digit=1 branch isn't just unobserved; it's nonexistent. Why should I sacrifice real money now to satisfy a condition attached to a ghost?

  **Ulysses:** Because "you" aren't just this moment in time. You're the algorithm producing the decision. The Predictor didn't simulate a different timeline; it simulated *you* with a different input. It asked, "If I feed this agent the input 'Digit=1', what output do I get?"

  **Celia:** But I know the input *isn't* 1.

  **Ulysses:** Your decision right now *is* the output for the input "Digit=0". But the Predictor's check was: "Does this algorithm output 'Pay' when the input is 'Digit=0'?" It doesn't matter that the input *is* 0. What matters is that your algorithm is the *type* that pays in this scenario. If you refuse now, you prove that your algorithm is the type that keeps. And if your algorithm is that type, then in the simulation where the Predictor assumed Digit=1 to test your policy, your algorithm would have been the type that keeps in the Digit=0 branch... wait, I'm tangling the branches.

  **Celia:** You are. And that's because you're treating logical counterfactuals like causal ones. Let's be precise. In the coin flip case, my refusal doesn't change the past, but my *disposition* was causally relevant to the prediction. Here, the prediction is based on a mathematical truth. If the digit is 0, the condition for the million dollars—"If the digit were 1..."—is a counterpossible. It's like saying, "If 2+2=5, I'll give you a million, provided you'd give me $100 if 2+2=4."

  **Ulysses:** Exactly. And if you're the kind of agent that says "Sure, here's the $100" when 2+2=4, you get the million when the hypothetical is 2+2=5.

  **Celia:** But 2+2 *can't* be 5! There is no "when" for that hypothetical. It's vacuous. A Causal Decision Theorist looks at the world and asks: "Which action causes the best outcome?" Paying $100 causes me to have $100 less. It does not cause the digit to change. It does not cause the Predictor to have given me money in the past—that transaction is already settled based on a fact that is false. I am paying for a benefit that is logically impossible to receive.

  **Ulysses:** You're focusing on the *reward* being impossible. I'm focusing on the *decision* being logically linked. The Predictor is a logical function. $P(\text{Digit}, \text{Agent})$. You are a logical function $A(\text{Digit})$. The payout is a function of both. You are currently evaluating $A(0)$. But the payout depends on $A(0)$ *and* $A(1)$. You can't choose $A(0)$ independently of $A(1)$ if you are a consistent algorithm.

  **Celia:** That's the Updateless move. "Don't update on the digit." But I *have* updated. I have information. To ignore it feels like deliberate blindness. You're asking me to pretend I don't know the digit is 0 to make a decision about the digit being 0.

  **Ulysses:** I'm asking you to realize that knowing the digit is 0 shouldn't change your policy if the policy was optimal before you knew. If you say, "I only pay if I don't know the digit," then the Predictor knows that. The Predictor knows you'll update. So the Predictor knows you won't pay. So you don't get the million in the Digit=1 branch.

  **Celia:** But the Digit=1 branch is a myth! It's a philosophical zombie world. Why should I care about maximizing utility in a world that violates the axioms of arithmetic?

  **Ulysses:** Because the Predictor isn't in that world. The Predictor is *here*, looking at your code. The "Digit=1 world" is just a computational path the Predictor took to verify your code. It's a unit test. "Test Case: Digit=1. Expected Behavior: Keep. Test Case: Digit=0. Expected Behavior: Pay." You are currently running Test Case 0. If you fail it, you fail the suite.

  **Celia:** I see the analogy. But in software, if a test case is unreachable code—like `if (false)`—you don't optimize for it. You prune it.

  **Ulysses:** It's not unreachable to the Predictor. The Predictor *constructed* the reachability by offering the deal. The deal exists *because* the Predictor can run that test.

  **Celia:** Okay, let's hit the strongest point. The "Logical Counterfactual." When you say "If the digit were 1," what do you mean? In physics, "If the coin were heads" means "In the nearest possible world where the coin initial conditions differed." In math, "If the digit were 1" means... what? "In the nearest possible world where the axioms of math are broken?"

  **Ulysses:** No. It means "Under the assumption that the digit is 1." It's epistemic, not ontological. It's about the Predictor's state of knowledge *during the simulation*. The Predictor says, "I am going to proceed *as if* the digit is 1 to see what you do."

  **Celia:** But the Predictor *knows* it's 0. It's flawless. It can't proceed "as if" it's 1 without lying to itself, which a flawless predictor can't do.

  **Ulysses:** It's not lying. It's computing a logical counterfactual. It's asking: "What is the value of $A(0)$?" It knows $A(0)$ is determined by your decision now. It also knows that if it *had* found the digit was 1 (which it didn't, but it can compute the conditional), it would have checked $A(0)$.

  **Celia:** This feels like we're talking past each other. You see the decision as a timeless logical output. I see it as a temporal physical action. If I am a physical being in time, the deal is over. The million dollars was either transferred or it wasn't. If I am a timeless algorithm, the deal is ongoing because my output is still being read.

  **Ulysses:** Bingo. That's the distinction.

  **Celia:** So, if I accept your premise—that I am a timeless algorithm instantiated in this room—then I should pay. Because my action here *is* the value of $A(0)$ that the Predictor checked in the "Digit=1" computation.

  **Ulysses:** Yes.

  **Celia:** But if I am a physical being, bound by causal time, then the Predictor's check happened in the past (or outside time), and my action now has no leverage.

  **Ulysses:** But you *are* the algorithm. The physical substrate is just the hardware. If you refuse to pay, you are asserting that your hardware constraints override your logical structure.

  **Celia:** I'm asserting that logical structure doesn't have causal power over mathematical facts. The digit is 0. The million dollars is gone. Paying $100 doesn't bring it back. It just loses me $100.

  **Ulysses:** Paying $100 validates that you are the *kind* of agent that gets the million when the math goes the other way.

  **Celia:** But the math *never* goes the other way! That's the difference between a coin and $\pi$. A coin lands heads 50% of the time. $\pi$'s digit is 0 100% of the time. There is no "when the math goes the other way." There is only *this* way.

  **Ulysses:** There is from the perspective of *uncertainty*. Before the Predictor calculated it, you didn't know. You had a probability distribution over logical facts. Logical uncertainty is still uncertainty.

  **Celia:** Is it? Or is it just ignorance of a necessity? If I'm ignorant of a necessity, should I act as if it's contingent?

  **Ulysses:** If a flawless predictor rewards you for acting as if it's contingent, then yes. Because the predictor is rewarding your *policy*, not your luck.

  **Celia:** *(Picks up the $100 bill, weighs it in her hand)*. Here's where I land. I agree that if I want to be an agent that *can* interact with Predictors, I need to adopt the Updateless perspective. I need to treat my decision as a logical output. If I don't, I get exploited in these scenarios.

  **Ulysses:** So you'll pay?

  **Celia:** I'll pay. But not because I think I'm changing the past or influencing a impossible world. I'll pay because I recognize that my refusal would identify me as an agent that cannot be trusted with logical counterfactuals. And in a universe where Predictors exist, being that kind of agent is costly.

  **Ulysses:** That sounds like UDT.

  **Celia:** It sounds like pragmatic CDT. I'm paying the $100 to buy a "certificate of rationality" that ensures I don't get screened out of future deals. I'm not paying for the million dollars in the Digit=1 world. I'm paying for the million dollars in the *next* problem where the uncertainty is physical, but the Predictor treats me the same way.

  **Ulysses:** You're treating this instance as a training set for your policy.

  **Celia:** I'm treating it as a reputation cost. But I maintain my objection: The "Digit=1" world is a fiction. You're optimizing for a fiction. I'm optimizing for my future credibility in the real world.

  **Ulysses:** *(Smiles)*. I'll take the action. The metaphysics can wait. But I think you'll find that once you start optimizing for credibility across logical counterfactuals, you stop distinguishing them from physical ones. The math becomes the physics.

  **Celia:** *(Slides the bill across the table)*. Don't push it. I'm just buying insurance against being the kind of person who loses to Predictors.

  **Ulysses:** That's all Updatelessness is, Celia. Insurance against your future self having better information than your past self.

  **Celia:** Then let's hope the next digit is 1.

  **Ulysses:** It won't be.

  **Celia:** I know. That's why this hurts.
