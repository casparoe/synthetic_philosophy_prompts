prompt: |-
  ok here's one that's been stuck in my head since I fell down a UDT rabbit hole in some old comment threads. Take the classic counterfactual mugging setup but swap the coin flip for something that isn't actually random: a flawless predictor privately works out the googol-th binary digit of pi -- a fixed fact of math nobody has ever checked, so its totally unknown to everyone, but not a chance event -- it was never "going" to be anything other than whatever it necessarily is. The predictor's policy: if the digit's a 1, it comes and hands you $1,000,000, but only in the world where it's confirmed that, had the digit been 0 instead, you'd be the type of agent who forks over $100 on request. If the digit's a 0, it shows up and asks for the $100, and explains this whole deal to you honestly right on your doorstep. Turns out the digit is 0.

  A causal decision theorist wants to say: don't pay, and not even for the usual reason -- the "other branch" wasn't just causally cut off from you, it was never really possible to begin with, so this isn't even a normal counterfactual mugging, its just a mugging. An updateless decision theorist wants to say the logical-vs-physical distinction is a red herring and you should pay regardless. I genuinely can't tell who's right, or whether they're even disagreeing about the same thing.

  Write me a dialogue between the two of them working through this. I want them actually engaging with each other's strongest move, not strawmanning, especially the bit about what a "counterfactual" even means when the antecedent was never really possible -- and I want it to land somewhere specific about whether that distinction changes what you should do, rather than both sides just restating their priors at each other.
