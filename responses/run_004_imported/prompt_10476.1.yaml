answer: |-
  **Setting:** *A dimly lit study, smoke hanging in the air. John Locke sits stiffly, a stack of papers on the table before him. George Berkeley leans forward, eyes bright, hands gesturing as if conducting an invisible orchestra.*

  **Locke:** You speak of money as a mere ticket, Mr. Berkeley. A counter at a gaming table. But if I lend a man a hundred pounds today, expecting repayment in a year, I am not lending him counters. I am lending him a portion of the earth's substance. Silver is a commodity, like corn or wool. It has a value anchored in its scarcity. If you tell the State it may issue paper against "industry" rather than silver, you hand them a license to steal.

  **Berkeley:** Steal? Or liberate? Tell me, Mr. Locke: if a shipload of silver sits in the Royal Vault, does it feed a single child in Cork? Does it clothe a weaver in Dublin? No. It sits. It is dead. I say money is not the meal, but the ticket to the dinner. If the dinner exists—if the industry is there—why must the ticket be made of precious metal? Why may the ticket not be paper, signed by the public trust?

  **Locke:** Because trust is a vapor! Metal is a chain. You ask what stops the State from printing tickets forever? I ask you: what stops a gambler from stacking chips until the table collapses? Once you sever the link between the coin and the weight of the silver, there is no natural brake. A King with a printing press is a King without a conscience. He will dilute the currency to pay his wars, and the widow holding your "ticket" will find it buys half a loaf.

  **Berkeley:** And a King with a mint? Does he not clip the coins? Does he not debase the alloy when it suits him? You worship the idol of silver, Mr. Locke. You say the value is in the metal. But I ask: is the value in the lump, or in the power it commands? If I am on a desert island with a pocket full of guineas and no bread, I am poorer than the savage with a yam. Value is not intrinsic to the dirt we dig from the ground. Value is a relation. It is the power to command the labor of another.

  **Locke:** It is a measure, sir! Just as a yardstick must be an invariant yard to measure cloth, money must be an invariant weight to measure debt. If you allow the State to alter the measure based on "industry" or "credit," you make all contracts moot. The creditor is ruined. Property rights dissolve. You speak of empowering the people, but you leave them at the mercy of the magistrate's whim. Silver is the only magistrate that does not lie.

  **Berkeley:** Silver lies as often as men do! Its supply fluctuates with the discovery of a new mine in the Americas. Is that not a whim of fortune? If a galleon sinks, does Irish industry vanish? If you tie our capacity to work to the accidental movements of Spanish ships, you enslave the living to the dead metal. I propose a bank that issues notes against the real wealth of the nation—the land, the labor, the skill. If the people work, the currency holds. If they are idle, no amount of silver in a vault will save them.

  **Locke:** But who judges the industry? You? The Banker? The King? When the link is cut, the politician becomes the alchemist. He will promise prosperity while printing ruin. You say value is a relation. I say it is a promise. And a promise backed by nothing but "public spirit" is a promise easily broken when the army needs pay.

  **Berkeley:** And a promise backed by silver is a promise that the metal itself will feed us? Pray, Mr. Locke, can you eat a shilling? Can you build a house with a guinea? No. You trade it for the work of your neighbor. My system admits this openly. It says: let the currency reflect the work, not the rock. If the State prints too much, yes, the ticket loses worth. But if you hoard the silver, the ticket never gets printed at all, and the work goes undone. Which tyranny is worse? The inflation of tickets, or the starvation of idleness?

  **Locke:** *(Pauses, tapping a finger on the table)* The starvation of uncertainty. A merchant cannot sail if he does not know what his cargo will fetch. You ask for faith in the State. I ask for fidelity to the weight.

  **Berkeley:** And I ask for faith in the People. Is the industry of a nation less real than the ore in a mountain?

  **Locke:** It is less tangible. And in economics, tangibility is the only shield against greed.

  **Berkeley:** Then we shall remain shielded, sir, while the world starves behind our walls.

  **Locke:** Better a hard wall than a painted door that opens onto a cliff.

  **Berkeley:** *(Smiling faintly)* Then let us agree on this: whether ticket or metal, if it does not move the hand to work, it is merely weight.

  **Locke:** Agreed. But let the weight be honest.
