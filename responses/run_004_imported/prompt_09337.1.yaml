answer: |-
  **1. The Metaphysical Link**
  Critics often suggest your economic theory is simply your immaterialist metaphysics applied to coin—just as you deny matter exists independent of perception, you deny money has value independent of its use. Does your monetary theory logically follow from your ontology, or is the resemblance merely poetic?
  *Follow-up:* If you say it is merely pragmatic, why do you consistently frame economic errors as philosophical errors regarding the nature of "substance"?

  **2. Power vs. Convention**
  You describe money as a "ticket" or "counter" conferring the power to command goods and labour. But isn't that indistinguishable from saying value is merely conventional—a name we agree to honor? Where lies the difference between a social fiction and a ticket to power?
  *Follow-up:* If it is power rather than convention, does that imply the state must actively enforce the "command" rather than just stamp the coin?

  **3. The Definition of Wealth**
  In *The Querist*, you suggest that wealth is not gold, but industry. If a nation had a mountain of gold but no one working, you would call them poor; yet by standard metrics, they are rich. Are you redefining wealth, or correcting a measurement error?
  *Follow-up:* If wealth is industry, is money merely a whip to keep men working, rather than a store of value?

  **4. Ireland vs. Universal Application**
  Your proposals emerged from Ireland's specific crisis: the drain of specie to absentee landlords and a negative trade balance. Is your paper credit a universal remedy for any economy, or a specific triage for a bleeding patient?
  *Follow-up:* If it is universal, why did you not propose it for England, where the banking system was already more developed?

  **5. The Backing of Credit**
  You propose a national bank issuing paper credit backed by land or national security rather than specie. But land is illiquid and hard to value compared to silver. Does tying money to land not risk freezing the very circulation you wish to accelerate?
  *Follow-up:* If the land value drops due to famine or war, does the money vanish with it?

  **6. The Risk of Inflation**
  If money is merely a ticket, what prevents the state from printing too many tickets? Without the anchor of gold, isn't your system an invitation to debasement and inflation that hurts the poor most?
  *Follow-up:* You trust the "wisdom of the nation" to limit issue; but what specific mechanism prevents political expediency from overriding that wisdom?

  **7. International Trade**
  Irish paper may command labour in Cork, but will a merchant in Amsterdam accept it? If foreign trade requires specie, doesn't your national bank merely isolate Ireland from the global market?
  *Follow-up:* Are you suggesting Ireland should aim for autarky, relying on domestic industry rather than imports?

  **8. The Absentee Landlord**
  A primary driver of Ireland's specie drain is English landlords collecting rents and living in London. Does your national bank effectively function as a tariff on absenteeism, keeping the "tickets" within the island?
  *Follow-up:* If so, is this economic policy or a political weapon against the English crown's influence?

  **9. Governance of the Bank**
  Who holds the pen that writes these tickets? If the power to command labour rests on credit, does the bank director become the true sovereign, superseding the King or Parliament?
  *Follow-up:* You argue for the public good; but how do you ensure the directors serve the public rather than their own pockets?

  **10. Psychological Resistance**
  People cling to gold as if it possesses a magical quality. Is this resistance to your paper credit due to greed, or is it a deeper, almost religious attachment to the idea of intrinsic substance?
  *Follow-up:* If it is a superstition, is it the role of the philosopher to cure the public of it, even if they resist the cure?
