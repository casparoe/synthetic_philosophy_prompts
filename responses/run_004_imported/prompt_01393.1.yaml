      *   **Taking a Side:** I will argue for the **Distinct** view. Why? Because the triviality results aren't just a technical nuisance; they reveal a fundamental cognitive difference. Indicatives are tools for learning within a belief state; counterfactuals are tools for evaluating the world against a belief state. The "unified" view requires too many epicycles (like Lewis's "rigidification" or complex pragmatic constraints) to explain away the probability mismatch. The linguistic form is similar, but the semantic engine is different.

