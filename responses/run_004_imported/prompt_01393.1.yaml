answer: |-
  This is a superb pedagogical pivot. Your colleague is channeling a dominant strand in formal semantics (the Stalnakerian orthodoxy), while your hesitation taps into a deep philosophical fault line revealed by probability logic. For a graduate seminar, this tension is exactly where the light is.

  Here is a breakdown of the terrain, structured to help you revise your slides and defend your position against the unified semantic story.

  ### 1. The Failure of Truth-Functional and Strict Analyses
  You are right to begin with the Oswald minimal pair, but to appreciate why we need possible worlds, we must first see why simpler logic fails for *both* constructions.

  *   **Material Implication ($A \supset C$):** This fails for both indicatives and counterfactuals.
      *   *For Indicatives:* It validates the paradoxes of material implication. "If the moon is made of cheese, Oswald killed Kennedy" is true because the antecedent is false. But the indicative "If the moon is made of cheese..." is not assertible. More damningly, it cannot explain why the Oswald indicative ("If Oswald didn't kill Kennedy, someone else did") is highly probable, while the material conditional probability is distinct from the conditional probability.
      *   *For Counterfactuals:* It renders all counterfactuals with false antecedents vacuously true. "If Oswald hadn't killed Kennedy, someone else would have" would be true simply because Oswald *did* kill Kennedy. This obliterates the distinction between a true counterfactual and a false one.
  *   **Strict Implication ($\Box(A \supset C)$):** This improves on the material conditional by requiring the connection to hold in all accessible worlds.
      *   *The Problem:* It is too strong. It implies that if "If A, C" is true, it is necessarily true. But conditionals seem contingent. Furthermore, strict implication cannot easily distinguish the indicative from the counterfactual without already building the distinction into the accessibility relation. If the accessibility relation is epistemic (for indicatives) and metaphysical (for counterfactuals), you have already posited two different semantic mechanisms, not one.

  ### 2. Stalnaker's Unified Selection-Function Semantics
  Your colleague's insistence on a single mechanism rests on **Stalnaker's (1968) theory**. This is the strongest case for unity.

  *   **The Mechanism:** Stalnaker proposes a selection function $f(A, w)$. Given an antecedent $A$ and a world $w$, $f$ selects the single "closest" possible world where $A$ is true.
  *   **The Truth Condition:** $A > C$ is true at $w$ iff $C$ is true at $f(A, w)$. This formula applies to *both* "If Oswald didn't..." and "If Oswald hadn't..."
  *   **The Pragmatic Constraint (The Colleague's Point):** Stalnaker argues the difference is not in the semantics of 'if', but in the **context set**.
      *   *Indicatives:* The selection function is constrained to pick a world within the *context set* (the set of worlds compatible with the participants' shared presuppositions). Since we presuppose Oswald killed Kennedy, the indicative "If Oswald didn't..." forces us to look at the closest world *within our current knowledge state* where he didn't. In that world (given the conspiracy theories of the time), someone else did.
      *   *Counterfactuals:* The selection function is *not* constrained to the context set. It can reach outside our presuppositions to metaphysically close worlds. In the closest world where Oswald didn't kill Kennedy (historically speaking), no one else was poised to do so.
  *   **The Moral:** On this view, 'if' is univocal. The difference is merely which domain the selection function searches.

  ### 3. The Probability Wedge: Adams and Lewis
  This is where your colleague's unified picture begins to crack. The behavior of probability suggests the semantic engines are fundamentally different.

  *   **Adams's Thesis:** Ernest Adams (1965) proposed that the probability of an indicative conditional is the conditional probability of the consequent given the antecedent:
      $$P(\text{If } A, C) = P(C|A)$$
      This fits the Oswald indicative perfectly. Given our evidence, $P(\text{Someone else did} | \text{Oswald didn't})$ is high.
  *   **The Counterfactual Mismatch:** Adams's thesis fails for counterfactuals.
      $$P(\text{If } A \text{ had been, } C \text{ would have been}) \neq P(C|A)$$
      In the Oswald counterfactual, $P(\text{Someone else would have} | \text{Oswald didn't})$ is low (historically), even though the conditional probability of "someone else did" given "Oswald didn't" (in the indicative sense) is high. If 'if' were the same mechanism, why does probability behave differently?
  *   **Lewis's Triviality Results:** David Lewis (1976) proved that if conditionals are propositions (i.e., they have truth conditions) and Adams's Thesis holds, then probability distributions collapse (triviality). Essentially, you cannot have a truth-conditional semantics where the probability of the conditional always equals the conditional probability.

  ### 4. Divergent Conclusions: Lewis vs. The Deflationists
  The triviality result forces a choice. You must give up either Truth Conditions or Adams's Thesis.

  *   **Lewis's Conclusion (Pro-Unity):** Lewis accepted that conditionals *have truth conditions* (preserving the Stalnaker-style possible worlds semantics). Therefore, he concluded **Adams's Thesis must be false** (or at least, not a general rule for truth-conditional probability). Lewis argued that indicative conditionals are simply counterfactuals with a specific temporal/modal restriction (roughly, the "past" is held fixed). He sacrificed the probabilistic intuition to save the semantic unity.
  *   **Adams, Gibbard, and Edgington (Pro-Distinction):** These philosophers accepted **Adams's Thesis** as a datum about how we use indicatives. Therefore, they concluded **Indicatives lack truth conditions**. They are not propositions that can be true or false; they are *assertibility conditions* or probabilistic constraints on belief.
      *   *The Implication:* If counterfactuals *do* have truth conditions (as Stalnaker and Lewis agree they do, since they are evaluated against similarity metrics of worlds) but indicatives *do not*, then they are **different semantic kinds**. One is a proposition; the other is a probabilistic operator.

  ### 5. Recommendation: Taking a Side
  For your seminar, I recommend you take the side of **Distinct Mechanisms**.

  While Stalnaker's unified story is elegant and syntactically motivated, it is semantically fragile in the face of the triviality results. Here is the argument you should present to your students to justify this stance:

  **The Argument for Distinctness:**
  1.  **The Probability Constraint:** Indicatives obey Adams's Thesis ($P(\text{If } A, C) = P(C|A)$). Counterfactuals do not.
  2.  **The Triviality Barrier:** Lewis showed that no truth-conditional semantics can satisfy Adams's Thesis.
  3.  **The Semantic Consequence:** Therefore, indicatives cannot be truth-conditional propositions in the way counterfactuals are.
  4.  **The Conclusion:** If counterfactuals are truth-conditional (evaluating worlds) and indicatives are non-truth-conditional (updating credences), they are not the same mechanism wearing different hats. They are different tools that happen to share a lexical item.

  **Why this beats the Stalnakerian Pragmatic View:**
  The Stalnakerian view tries to explain the difference via the *domain* of the selection function (context set vs. metaphysical set). But this cannot explain why the *logic of belief* changes. When we assess an indicative, we are learning about our actual world (updating the context set). When we assess a counterfactual, we are stepping outside our actual world to evaluate a alternative history.

  The linguist colleague wants to say the semantics is constant and the context changes. But the triviality results show that the *logical type* of the output changes. One outputs a truth value (counterfactual); the other outputs a constraint on conditional probability (indicative). You cannot reduce a type difference to a pragmatic constraint on a single function without doing violence to the probability logic.

  **Pedagogical Payoff:**
  By taking this side, you move the seminar from "How do we tweak the possible worlds model?" to "What kind of semantic value does a sentence have?" It opens the door to expressivism, dynamic semantics, and the nature of assertion. It validates your intuition that the Oswald pair reveals a fracture, not just a contextual shift. The indicative is a tool for navigating ignorance; the counterfactual is a tool for navigating possibility. They are kin, but they are not twins.

  **Suggested Slide Revision:**
  Keep the Oswald pair. Add a third slide: "The Probability Test." Show that $P(\text{Indicative}) \approx P(C|A)$ but $P(\text{Counterfactual}) \neq P(C|A)$. Then introduce Lewis's Triviality as the proof that these two probabilities cannot be generated by the same truth-conditional mechanism. This provides the formal backing for your philosophical hunch.
