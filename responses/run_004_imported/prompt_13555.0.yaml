answer: |-
  First off, congratulations on the wedding! It is genuinely delightful that you're navigating Lewisian convention theory while planning actual conventions (like bouquet tosses). There's no better way to internalize *Convention* than arguing over whether a ritual is a coordination equilibrium or a constitutive rule.

  Regarding the grading: You are right to feel the weight of the first stack. It's the moment the abstract becomes concrete. Below is how I would grade this response if I were your supervising professor, including the rubric and justification so you can see the reasoning process.

  ### **Score: 14 / 20**

  ### **Rubric**
  ```json
  {
    "rubric": [
      {
        "criterion": "Common Knowledge vs. Mutual Knowledge",
        "points": 5,
        "description": "Correctly identifies the iterative hierarchy of knowledge (I know that you know...) and links it to the stability of expectations/rationality of conformity."
      },
      {
        "criterion": "Convention vs. Agreement",
        "points": 10,
        "description": "Explains Lewis's specific denial that conventions are agreements (even tacit ones). Must distinguish between obligation via promise (agreement) vs. obligation via expectation/precedent (convention)."
      },
      {
        "criterion": "Original Example",
        "points": 5,
        "description": "Provides a non-lecture example that fits the criteria of a coordination problem with multiple equilibria."
      }
    ]
  }
  ```

  ### **Point-by-Point Comments**

  **1. Common Knowledge (5/5 points)**
  *   **Strengths:** The student nails the definition. They correctly identify that mutual knowledge is flat ("I know P, you know P") while common knowledge is hierarchical ("I know you know I know..."). Crucially, they link this hierarchy to the *rationality* of conformity ("otherwise neither of us can be fully confident... undercuts the whole point").
  *   **Feedback:** This is textbook Lewis. Full marks here.

  **2. Convention vs. Agreement (4/10 points)**
  *   **Weaknesses:** This is where the student loses significant points. The prompt asks why Lewis *denies* conventions arise from agreement. The student answers: *"This is really Lewis cashing out what an implicit agreement looks like... so the 'agreement' has to be tacit."*
  *   **The Error:** This is a common misconception that Lewis explicitly argues *against*. For Lewis, a convention is **not** a tacit agreement. An agreement (even tacit) implies a promise or a commitment that creates an obligation independent of expectations. A convention creates a reason to act based *only* on the expectation that others will act, derived from precedent. By calling it a "tacit agreement," the student misses Lewis's core philosophical move: grounding normativity in expectation rather than promising.
  *   **Credit Given:** They get partial credit for recognizing that no "meeting" is called and that precedent/repeated interaction is key, but the conceptual distinction is blurred.

  **3. Original Example (5/5 points)**
  *   **Strengths:** The "doorway etiquette" example is valid. It is a coordination problem (both trying to go at once = collision/awkwardness; both waiting = delay), it has multiple equilibria (Person A goes first OR Person B goes first), and it is sustained by expectation.
  *   **Feedback:** It's a solid, clear example that avoids the driving-side cliché.

  ### **TA-to-TA Advice**
  Since this is your first batch, here is what I'd keep in mind while grading the rest:

  1.  **Look for the "Promise" Distinction:** In social ontology, the difference between "I expect you to do X" (convention) and "I promised to do X" (agreement) is huge. If a student conflates them, it usually means they haven't grasped the source of the normativity. That's a major conceptual deduction.
  2.  **Be Consistent:** If you deduct here for the "tacit agreement" error, watch for it in other papers. It's a very common student mistake (because colloquially, we *call* them tacit agreements).
  3.  **Don't Overthink the Wedding Stuff:** Since you're deep in Lewis right now, you might spot nuances others miss. Try to grade based on what was taught in *your* seminar, not necessarily every nuance of Lewis's 1969 text unless your professor emphasized the "agreement vs. convention" distinction heavily (which, given the prompt, they did).

  You're going to do great. The fact that you're worrying about being rigorous rather than hand-waving it means you're already taking it seriously enough. Good luck with the rest of the stack (and the wedding planning)!
