answer: |-
  This is a profound observation that touches on one of the oldest and most difficult problems in philosophy: the tension between **relativism** (truth depends on your framework) and **realism** (there is a mind-independent truth we are trying to grasp).

  Your experience describes what philosophers call the **contingency of belief**. You have discovered firsthand that what feels like "common sense" is often just "local sense."

  To answer your question directly: **Yes, it is still a meaningful question, but you cannot answer it using the criteria provided by either outlook.** If you try to judge Outlook A using the rules of Outlook A, A will always win. If you use the rules of Outlook B, B will always win.

  To ask which is "truer," you have to step outside the binary of *which one matches reality* and ask *what kind of truth you are looking for.* Here are three ways to make that question sensible.

  ### 1. Pragmatic Truth: Which view sustains human flourishing?
  If we abandon the idea of a "God's eye view" (an objective perspective from nowhere), we can still judge outlooks based on their consequences. This is the pragmatic approach (think William James or John Dewey).

  You can ask:
  *   Which outlook leads to less unnecessary suffering?
  *   Which outlook allows for a more sustainable balance between individual needs and community health?
  *   Which outlook is more resilient when faced with crisis?

  If Outlook A (abroad) assumes leisure is a virtue and Outlook B (home) assumes leisure is laziness, you can look at the health outcomes, family cohesion, or reported life satisfaction of the people living under those assumptions. This doesn't tell you which one is "metaphysically true," but it tells you which one is **functionally adequate** for human beings.

  However, there is a catch: What works in one environment (e.g., a high-trust society with a strong safety net) might fail in another (e.g., a hyper-competitive market economy). So, the "truth" here might be contextual rather than universal.

  ### 2. Explanatory Power: Which view accounts for more of reality?
  A "truer" perspective is often one that can explain *why* the other perspective exists, while the other cannot explain it.

  *   **Outlook A** might say: "Work is for living."
  *   **Outlook B** might say: "Living is for work."

  If Outlook A can acknowledge, "I understand why people think living is for work; their economic insecurity forces them to prioritize survival," it has a wider field of vision. If Outlook B dismisses Outlook A as "lazy" without understanding the structural conditions that allow it to exist, Outlook B is operating with a blind spot.

  The outlook that recognizes its own contingency (as you are doing now) is arguably "truer" than the one that claims to be the only natural order. The view that acknowledges it is *a* view is more accurate than the view that claims to be *the* view.

  ### 3. The "View from Nowhere" vs. The "View from Everywhere"
  The philosopher Thomas Nagel wrote about the "View from Nowhere"—the attempt to be purely objective. Your experience suggests this is impossible for social truths. You are always somewhere.

  However, there is a middle ground. You now possess something your neighbors at home do not: **critical distance.**
  *   When you were abroad, you were immersed.
  *   When you returned home, you re-immersed.
  *   Now, you are aware of the immersion.

  This suggests that "truth" in this context isn't about picking the winning team. It is about recognizing that **both outlooks are partial maps of a complex territory.**
  *   Outlook A might see the value of community and time more clearly.
  *   Outlook B might see the value of ambition and agency more clearly.

  The "truer" position is not to choose one, but to hold the tension between them. This is what the philosopher John Kekes calls **pluralism**. It acknowledges that there are many genuine human goods (freedom, security, community, achievement) and they often conflict. No single culture optimizes all of them. Therefore, no single cultural outlook is wholly "true."

  ### So, is the question sensible?
  It is sensible, but only if you rephrase it.

  **Don't ask:** "Which culture is right about how life should be lived?"
  **Do ask:** "What does each culture see clearly that the other obscures, and what are the costs of each blindness?"

  Your experience has granted you a specific kind of wisdom: the knowledge that your deepest convictions are malleable. This is unsettling, but it is also liberating. It means you are no longer a prisoner of the "obvious."

  You can now curate your own outlook. You can take the assumption about *family* from Outlook A and the assumption about *work* from Outlook B, not because they are "true" in an absolute sense, but because **you have tested them against your own life and found them wanting or worthy.**

  In a way, the "truest" view is the one you construct consciously after seeing the alternatives, rather than the one you inherit unconsciously from your surroundings. The fact that you can see the water you are swimming in means you are no longer just a fish; you are a student of the ocean. That is the closest thing to objective truth available to us.
