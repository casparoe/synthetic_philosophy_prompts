      *   **Human Irrationality/Bias:** Humans are not Boltzmann-rational. We have akrasia (weakness of will), cognitive biases, habits, addiction, and mistakes. IRL assumes optimality. If the model assumes optimality and the human is suboptimal, the AI infers the *wrong* reward (e.g., inferring a human *wants* to miss the bus because they missed it).
      *   **The "Is-Ought" Problem (Philosophical):** Just because someone *does* something doesn't mean they *should* want it. Preferences vs. Revealed Preferences.
      *   **Dynamic/Changing Preferences:** Humans don't have a static reward function. We change our minds, learn new values, and are influenced by the AI itself (manipulation).
      *   **Goodhart's Law/Specification Gaming:** Even if you learn a proxy reward, optimizing it aggressively breaks it.
      *   **Off-Distribution Behavior:** IRL works on observed data. What happens when the AI takes actions humans never would? The reward function might extrapolate wildly.

