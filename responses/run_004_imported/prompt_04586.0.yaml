answer: |-
  **The Equator of Ash**

  The silence at the Boundary wasn't empty; it was heavy. It was the silence of a held breath, suspended between the exhale of a Big Bang and an inhale we couldn't name.

  Dr. Aris Thorne sat in the observation cupola of Station Zero, watching the spectrometer. Station Zero orbited at the precise gravitational null-point between our expanding cone of spacetime and the other one. Behind Aris, the universe was cooling, stars burning down, entropy climbing the slope toward heat death. Ahead, through the thick lead-glass of the forward viewport, lay the Mirror.

  To the naked eye, the Mirror looked like a distortion in the cosmic microwave background, a region where the static wasn't static at all. It shimmered.

  "Still reading the advanced waves?" Aris asked. Her voice sounded flat in the recycled air.

  Kael, her co-observer, didn't look up from his console. "Always. They're not waves, Aris. They're anti-waves. Photons converging on sources instead of diverging. It makes the photometry impossible. Their stars don't shine at us; they drink from us."

  This was the first disorientation, the one that had broken the first generation of Boundary physicists. If you looked at a star in the Mirror, you didn't see light exploding outward. You saw light gathering in, focusing onto a point of darkness. By our thermodynamic standards, a Mirror star was a black hole that only absorbed radiation and never emitted it.

  But Aris knew the theory. She had read Price. She had read Boltzmann. She knew that if you stood on the surface of a Mirror star, the light would be leaving you. The star would be hot, burning fuel, radiating into the cold dark. To them, we were the ones drinking the light. To them, our stars were the black holes.

  There was no absolute 'forward'. There was only the gradient. We were sliding down one side of the hill; they were sliding down the other. The Boundary was the peak.

  "We have a modulation," Kael said. His tension spiked; Aris could hear it in the tightness of his vowels. "Sector 4. It's structured."

  Aris moved to his station. On the screen, the background radiation of the Mirror sector showed a pattern. It wasn't random thermal noise. It was a sequence of pulses, low-entropy spikes in a high-entropy field.

  "Is it a leak?" Aris asked. "From our side?"

  "No. The thermodynamic signature is wrong. Look at the decay rate." Kael pointed to the waveform. "The signal starts coherent and degrades as it moves *away* from the Boundary. From our perspective, it's originating *there* and traveling *here*."

  "But time..."

  "From their perspective," Kael corrected, "the signal originates there and travels toward the Boundary. Just like ours would."

  Aris felt the familiar vertigo. This was the trap. If they sent a message now, and it took ten years to cross the Boundary, when did it arrive for them? If their time $t'$ ran opposite to our time $t$, then a message sent at $t=0$ arrives at $t=10$. For them, that arrival is at $t'=0$. If they reply immediately, their reply is sent at $t'=10$. That corresponds to our $t=-10$.

  We receive the reply ten years before we send the question.

  "It's a handshake protocol," Aris whispered. "They're trying to establish a channel."

  "Can we answer?"

  "If we answer, we create a closed timelike curve on a macroscopic scale. We're talking about causality, Kael. Not just physics. Memory."

  "Price says memory is just entropy," Kael muttered. "Records are low-entropy states. We remember the past because the past had lower entropy. They remember their past because their past had lower entropy. The peak is the moment of least memory for both of us."

  "Then they don't remember us sending the message," Aris said. "Because from their slope, our message comes from their future."

  "Exactly. So if we reply, we are sending a message into their future. They will receive it, record it, and then... what? They experience it as a memory of something that hasn't happened yet?"

  "No," Aris said, rubbing her temples. "That's the *Tenet* mistake. That's thinking they live backwards. They don't. To them, the message arrives, they record it, and it becomes part of their past. The fact that it's our future is irrelevant to their internal experience."

  She looked back at the viewport. The shimmering distortion seemed to pulse.

  "Put it on audio," she said. "Convert the entropy variance to sound."

  Kael keyed the sequence. The speakers hissed with the sound of cosmic static, then cut through with a rhythmic thumping. *Thump. Thump. Silence. Thump.*

  "It's prime numbers," Kael said. "Classic."

  "It's a test," Aris said. "They're checking if we can distinguish signal from noise. If we can identify order."

  "Should we send one back?"

  Aris hesitated. This was the moment the textbooks warned about. The Boltzmann-Schuetz fluctuation hypothesis suggested that conscious observers could only exist on the slopes, never at the peak. We were the fluctuation. They were the counter-fluctuation. If we interacted, did we dampen the gradient? Did we stabilize the peak and wipe out the conditions for life?

  Or was that superstition?

  "Send it," Aris said. "But encode it as a record, not a query. Don't ask a question. Just state a fact. 'We are here.'"

  Kael typed the command. A high-intensity neutrino burst, modulated to carry low-entropy information, fired toward the Mirror.

  They waited.

  Neutrinos cross the Boundary almost instantly. The round trip should have taken minutes.

  Minutes passed. An hour.

  "Nothing," Kael said.

  "Wait," Aris said. She was watching the logs. "Look at the receipt time."

  "The receipt time?"

  "Before we fired the burst. Look at the detector logs from yesterday."

  Kael scrolled back. There, timestamped twelve hours *before* Aris gave the order to transmit, was a spike in the neutrino detector. A pattern.

  *Thump. Thump. Silence. Thump.*

  "They answered before we spoke," Kael said, his voice hollow.

  "No," Aris said. "We answered before they spoke. From their perspective, they received our 'We are here' twelve hours ago. They replied immediately. Their reply arrived here twelve hours ago."

  "So they know we're coming?"

  "They know we *were* here," Aris corrected. "For them, this interaction is over. It's a memory."

  She stood up and walked to the glass. The vertigo was worse now, a physical nausea. It was the realization that the 'now' was a fiction. There was no shared present. There was only the block.

  "If we keep talking," Aris said, "we just fill up the static. We aren't having a conversation. We're carving inscriptions on a wall that already exists."

  "Then what's the point?"

  "The point is verification," she said. "Boltzmann wondered if there was a fact of the matter about who was moving forward. He said no. It's just slope."

  She turned back to the console. "Send the full archive. Everything. History, physics, biology. Send it all."

  "Aris, if we send everything, they get it in their past. They have our entire history before they even develop the technology to receive it. We're dictating their past."

  "And they've already dictated ours," she said, pointing to the log from yesterday. "That signal we received? It contained data. I haven't decoded it yet. I was waiting for authorization."

  Kael froze. "You received data... yesterday?"

  "I told you. From their slope, the exchange is complete. They sent their archive twelve hours ago. It's sitting on the server."

  Aris pulled up the file. It was massive. Petabytes of structured low-entropy states.

  "What's in it?" Kael asked.

  "Let's look."

  She opened the first directory. It wasn't math. It wasn't star charts. It was images. Visual records.

  She clicked the first file. It showed a star field. But the stars were wrong. The spectral lines were shifted, not by velocity, but by thermodynamics. The light was converging.

  "It's us," Kael whispered. "It's a picture of our galaxy."

  "Taken from their side," Aris said. "But look at the timestamp."

  The timestamp was in their local cycle count. Converted to our years, it corresponded to a date one billion years in *our* future.

  "They see our future," Kael said.

  "No. They see their past. Which happens to be our future." Aris felt a chill that had nothing to do with the station's life support. "They aren't predicting it. They remember it."

  "Like we remember the Big Bang."

  "Exactly. To them, the heat death of our universe is a fixed event in their history. Just like the Big Bang is a fixed event in ours."

  Aris scrolled further. There were images of civilizations rising and falling. There were records of wars, of art, of quiet moments. All of it stamped with the thermodynamic signature of the Mirror.

  And then, a text file. Translated by the AI based on mathematical universals.

  *We are the reflection. You are the source. We do not meet. We only touch at the edge.*

  *Do not try to cross. The gradient cannot hold.*

  "It's a warning," Kael said.

  "It's an observation," Aris said. "If we cross the Boundary, if we try to move into their slope, our entropy gradient would fight theirs. We'd be a low-entropy object in a world where low-entropy is the past. We would instantly equilibrate. We'd die."

  "And they would die if they came here."

  "Yes."

  Aris looked at the log from yesterday again. The message they had received before they sent their own.

  "We're trapped," she said. "We can trade artifacts. We can trade history. But we can't share a timeline. We can't say 'Hello' and wait for 'Hi'. Because by the time we say 'Hello', they've already said 'Hi' a thousand years ago."

  "So why did they contact us?"

  Aris thought about Price's argument. The symmetry. The idea that the universe doesn't care about the direction of the arrow, only the existence of the arrow.

  "Because they're lonely," she said softly. "Just like us. They looked across the peak and saw another slope. They saw order in the chaos. They wanted to know if the order was real."

  "Is it?"

  Aris looked at the data from the future-past. She looked at the converging light in the viewport. She thought about the forty years of physics she'd studied, the rigid lines of cause and effect.

  "It's real," she said. "But it's not ours."

  She keyed the microphone one last time. She didn't send a question. She didn't send a greeting.

  She sent a single pulse of pure white noise. Maximum entropy. A moment of silence in the signal.

  "What was that?" Kael asked.

  "Acknowledgement," Aris said. "I told them we understand. We accept the symmetry."

  On the screen, the waveform from yesterday—the one they had received before they sent the pulse—shifted. The white noise was there, embedded in the start of their message.

  They had received the acknowledgement before she sent it. Of course they had.

  "Shut down the transmitter," Aris said. "Leave the receivers on."

  "We're just going to listen?"

  "We're going to remember," she said. "For both of us."

  She turned off the console. The station hummed, a low, steady sound moving forward in time. Outside, the Mirror shimmered, a vast, dark eye blinking in a rhythm that matched her own heartbeat, perfectly out of phase.

  There was no fact of the matter about who was waiting. There was only the waiting itself, stretched across the peak of the hill, holding the two slopes apart so that neither would slide into the other.

  Aris watched the stars. Some were burning. Some were drinking. And for the first time, she didn't try to tell the difference.
