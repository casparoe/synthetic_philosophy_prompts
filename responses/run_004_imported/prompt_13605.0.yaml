      *   **Recommendation:** The "Contextualized Retention" model. Keep the name (acknowledging historical impact) but add a permanent statement/plaque and fund a related lecture/topic on ethics in science/logic.
      *   **Rationale:** Why this works (avoids erasure, acknowledges harm, turns it into a teaching moment).
