prompt: |-
  A friend and I spent most of last night arguing about moral luck and never really settled it. She thinks resultant luck is the only part of the problem with any real bite: her example was two equally drunk drivers, one of whom happens to hit a pedestrian and one of whom makes it home safely, and she takes the case as showing that our harsher judgment of the unlucky one is simply a mistake. But she doesn't extend the same skepticism to what Nagel calls circumstantial or constitutive luck — there, she says, the people really are different, in temperament or situation, so judging them differently isn't an error at all. I think that concedes too much: if someone's good behavior only ever reflects the fact that they were never tempted, their character seems exactly as unearned as the bad behavior of someone who was tempted and failed, so "they're actually different" just relocates the luck instead of answering for it.

  Could you write me a short story built around that second kind of case instead of the drunk-driving one? I want two characters alike in everything that should matter morally, whose reputations end up diverging only because one of them was, at some point, handed a temptation or a crisis the other never faced. Please resist the urge to give the untested character some other hidden flaw that restores a comforting sense of just deserts by the end; I'd like the unfairness of it to remain genuinely unresolved, and ideally felt by the untested character too, not just the reader.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Luck, specifically focusing on *circumstantial* and *constitutive* luck (Nagel's categories), rather than *resultant* luck (the drunk driver example).
      *   **Core Conflict:** Two characters who are morally alike in potential/capacity, but their reputations/outcomes diverge because one faced a temptation/crisis and the other didn't.
      *   **Constraint 1:** Do not give the "lucky" (untested) character a hidden flaw at the end to restore "just deserts." The unfairness must remain unresolved.
      *   **Constraint 2:** The unfairness should be felt by the untested character, not just the reader.
      *   **Format:** Short story.
      *   **Tone:** Philosophical, contemplative, slightly melancholic, avoiding easy moralizing.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Resultant Luck:* Outcomes beyond control (Drunk Driver A hits someone, Driver B doesn't). The friend thinks this is the only real problem.
      *   *Circumstantial/Constitutive Luck:* Who you are and what situations you face. The user argues that if Person A is good only because they were never tempted, their goodness is just as "lucky" (unearned) as Person B's badness when they *were* tempted and failed.
      *   *Goal:* Show two people who *would* have acted the same, but only one was tested. The one who wasn't tested gets the credit; the one who was tested gets the blame. The untested one needs to realize this credit is hollow.

  3.  **Brainstorming Scenarios:**
      *   *Idea 1: War.* Two soldiers. One sees combat, commits a war crime in a panic. The other is stationed elsewhere, gets a medal for "service." *Critique:* A bit cliché. High stakes might overshadow the subtle philosophical point.
      *   *Idea 2: Finance/Corporate.* Two accountants. One faces a massive embezzlement opportunity/pressure, cracks. The other never has the chance, becomes CFO. *Critique:* Good, but might feel too cold.
      *   *Idea 3: Caregiving/Elderly.* Two siblings caring for a parent. One has the parent live with them (stress, temptation to neglect/abuse), the other lives far away (visits occasionally, looks like the "good son"). *Critique:* Strong emotional resonance.
      *   *Idea 4: Small Town/Secret.* Two friends. A secret is entrusted to one. The other never knows the secret. The one who knows leaks it under pressure. *Critique:* A bit abstract.
      *   *Idea 5: The "Locked Room" Scenario.* Two identical trainees for a position of power. One is placed in a situation where bribery is possible/inescapable. The other is kept in a clean environment.

      *Decision:* Let's go with a variation of Idea 3 or a professional mentorship scenario. Let's try a **medical/ethical** setting. It allows for high stakes (life/death) but also clear rules. Two residents. Same skill, same ethics *until* the situation diverges.
      *Refinement:* Actually, a **political/activist** setting might work better for "reputation." Or perhaps **two brothers in a family business**. Let's go with **two junior partners in a law firm** or **two researchers**.
      *Better Idea:* **Two Aid Workers.** They are identical in training and intent. One is deployed to a famine zone where resource allocation requires choosing who eats (the trolley problem in real life). The other is deployed to a logistics hub where the resources are sufficient. The first makes a choice that haunts them; the second is hailed as a hero for efficiency.
      *Wait, simpler is better.* Let's look at the "Temptation" aspect specifically.
      *Scenario:* Two cashiers? No. Two people with access to funds.
      *Let's try:* **Two Junior Architects/Engineers.** Safety standards. One signs off on a building that stands. The other signs off on a building that collapses due to an unforeseen earthquake (Resultant). *No, that's resultant luck.*
      *Back to Circumstantial:* One is offered a bribe. The other is never offered one.
      *Let's try:* **Two Priests/Counselors.** Confidentiality. One parishioner confesses a crime. The other never has a confession like that.
      *Let's try:* **Two Friends, One Secret.**
      *Let's try:* **The "Wallet" Test.** Too simple.

      *Selected Concept:* **Two Aspiring Judges/Clerks.** Or better, **Two Medical Residents.**
      Let's go with **Two Medical Residents, Elias and Julian.**
      They are peers. Same school, same grades, same demeanor.
      Elias is rotated through a high-volume, under-resourced ER during a crisis (flu pandemic/riot). He has to triage. He makes a call that lets someone die to save others. He is investigated.
      Julian is rotated through a quiet, well-funded clinic. He follows protocol perfectly. He is praised for his "unwavering ethics."
      *Problem:* This leans towards resultant luck (the patient died).
      *Correction:* It needs to be about *temptation* or *moral failure* due to circumstance.
      *Revised Concept:* **Two Financial Auditors.**
      Elias and Julian. Best friends. Same firm.
      Elias is assigned to a client who actively tries to bribe him. He resists initially, but the pressure is immense (threats to family, massive sum). He cracks. He is caught. Fired. Disgraced.
      Julian is assigned to a clean client. No bribery offered. He audits perfectly. Promoted.
      *The Twist:* Julian *knows* he would have cracked. He knows his integrity is untested.
      *The Constraint:* The unfairness must be felt by the untested character (Julian).

  4.  **Drafting - Scene by Scene:**
      *   **Introduction:** Establish the bond between Elias and Julian. They are mirrors. Same background, same values.
      *   **The Divergence:** The assignment of cases. The "Clean" vs. "Dirty" portfolio.
      *   **The Fall:** Elias falls. Not because he's worse, but because the wall was higher.
      *   **The Aftermath:** Julian rises. He gets Elias's old office. He gets the praise.
      *   **The Climax/Resolution:** A moment where Julian realizes the hollowness of his virtue. He visits Elias. He acknowledges the luck. No redemption, no hidden flaw found in Julian. Just the silence of the untested.

  5.  **Refining the Narrative Voice:**
      *   Third-person limited (Julian's perspective) works best to satisfy the constraint that the *untested* character feels the unfairness.
      *   Avoid making Elias a villain. He should be pitiable but understandable.
      *   Avoid making Julian a secret hypocrite. He must be genuinely good, just untested.

  6.  **Writing - Key Moments:**
      *   The coffee shop scene (early days).
      *   The phone call (Elias's fall).
      *   The promotion ceremony (Julian's rise).
      *   The prison/visitation scene (The confrontation with luck).

  7.  **Addressing the Prompt's Specifics:**
      *   *No hidden flaw:* Julian shouldn't be secretly jealous or cruel. He should be genuinely troubled by his own unearned virtue.
      *   *Unresolved:* The story shouldn't end with Julian confessing or fixing it. It ends with the weight of the knowledge.
      *   *Circumstantial Luck:* Focus on the *assignment* of the client, not the outcome of the audit.

  8.  **Self-Correction during drafting:**
      *   *Check:* Did I make Elias weak? *Fix:* Emphasize the intensity of the pressure Elias faced compared to Julian's vacuum.
      *   *Check:* Is Julian too whiny? *Fix:* Make his internal struggle quiet. He accepts the award but feels the phantom weight of the bribe he never received.
      *   *Check:* Is the ending too neat? *Fix:* End on an image of uncertainty.

  9.  **Final Polish:** Check the pacing. Ensure the philosophical point lands without being a lecture. The dialogue should carry the weight. (e.g., Elias saying, "You didn't say no. You just weren't asked.")

  10. **Final Review against constraints:**
      *   Short story? Yes.
      *   Two characters alike in moral matter? Yes.
      *   Divergence due to temptation/crisis? Yes.
      *   No hidden flaw for the "good" one? Yes.
      *   Untested character feels the unfairness? Yes.

  *(Self-Correction Note: Make sure the "temptation" isn't just a test of skill, but of character. The bribe is the classic example for a reason. Let's ensure the pressure is psychological, not just financial.)*

  Let's write.

