  *Actually, let's focus on the feeling.* *The Lucky Saint.* No. *The Other Side of the Coin.*
  Let's just start writing and see what title fits.

  *Wait, one more check on the "Constitutive" luck.* The prompt mentions temperament. I should hint that their temperaments are identical. They grew up together, same struggles. This reinforces that the difference is purely circumstantial.

