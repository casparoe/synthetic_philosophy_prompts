          *   *Core:* Fundamental entities (electrons, quarks) have proto-consciousness.
          *   *Problem:* How do $N$ subjects become $1$ subject? (The Combination Problem).
          *   *Solution:* Phenomenal Bonding (Goff), Constitutive Russelian Monism.
          *   *Weakness:* Seems inconceivable. How can *my* experience be *part* of a larger experience without losing its identity?
      *   **Cosmopsychism:**
