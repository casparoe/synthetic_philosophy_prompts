      *   *Cosmopsychist:* Let's call her **Sarah**. Holistic, likes priority monism, focuses on the unity of experience.
      *   *Setting:* A quiet corner of a pub or a university common room. Let's go with the pub to match the prompt's vibe.

  4.  **Key Arguments to Include:**
      *   **Leo (Micro):** The "Inconceivability" objection. Subjects don't add like bricks.
