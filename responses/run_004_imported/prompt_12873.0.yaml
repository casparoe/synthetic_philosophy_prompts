answer: |-
  This is an exceptionally sharp disagreement that cuts to the heart of normative ethics, meta-ethics, and now, AI alignment. You and your friend were essentially debating the gap between a **Criterion of Rightness** (what makes an act right) and a **Decision Procedure** (how an agent should decide what to do).

  Your friend was arguing for the identity of the two: if Utilitarianism is the true Criterion, the ideal Decision Procedure must also be Utilitarian. You were arguing for their separation: the true Criterion might recommend a non-Utilitarian Decision Procedure.

  Here is a careful breakdown of the concepts you touched on, how they relate, and what they imply for AI architecture.

  ### 1. Self-Defeating vs. Self-Effacing (Parfit's Distinction)

  In *Reasons and Persons* (1984), Derek Parfit clarifies these terms to save Consequentialism from the charge that it destroys the very values it seeks to promote.

  *   **Self-Defeating:** A theory is self-defeating if, when agents try to follow it, they *fail* to achieve the theory's aim.
      *   *Example:* If Act Utilitarianism requires me to calculate the utility of every breath I take, I might become so paralyzed or prone to calculation errors that I produce less utility than if I just followed common sense. If the theory tells me to calculate, and calculating reduces utility, the theory is self-defeating.
  *   **Self-Effacing:** A theory is self-effacing if it tells agents *not to believe* or *not to use* the theory itself.
      *   *Example:* Act Utilitarianism might say: "The right act is the one that maximizes utility. However, agents who consciously try to maximize utility tend to cause disasters. Therefore, the right thing to do is to believe in rigid rules (like 'never lie') and follow those."

  **The Crucial Difference:**
  A self-defeating theory is a failure; it undermines its own success. A self-effacing theory is a strategic success; it preserves its aim by recommending its own concealment or replacement at the level of decision-making. Parfit argues that Consequentialism can be self-effacing without being self-defeating. It succeeds *as a criterion* by recommending that we abandon it *as a procedure*.

  ### 2. The Historical Cousins: Sidgwick, Hare, and "Government House"

  You are correct that these ideas are genealogically linked. They are all attempts to solve the problem that direct maximization often leads to suboptimal outcomes.

  *   **Sidgwick and Esoteric Utilitarianism:** Henry Sidgwick (*The Methods of Ethics*) worried that if the general public knew that morality was just about maximizing outcomes, they might rationalize selfish or harmful acts (motivated reasoning). He suggested that "enlightened" utilitarians might need to keep the truth esoteric, encouraging the masses to follow traditional rules.
  *   **Government House Utilitarianism:** This is the derisive label (popularized by Bernard Williams and J.J.C. Smart) for Sidgwick's view. It implies a paternalistic elite living in "Government House" who know the real utilitarian truth, while lying to the commoners to keep them following rigid rules. The criticism is that this creates a morally objectionable caste system and licenses manipulation.
  *   **Hare's Two-Level Utilitarianism:** R.M. Hare tried to democratize this without the elitism. He distinguished between the **Intuitive Level** (fast, rule-based thinking for everyday life) and the **Critical Level** (slow, act-utilitarian calculation for rare or conflicting cases). We train our intuitions to match utilitarian outcomes generally, but we can override them with critical thinking when necessary.

  **Are they the same?**
  Structurally, yes; politically/psychologically, no.
  *   **Sidgwick** is about *secrecy* (sociological).
  *   **Hare** is about *cognitive architecture* (psychological).
  *   **Parfit** is about *meta-ethical structure* (logical).

  Parfit's "self-effacing" claim is the most general. It doesn't require an elite (Sidgwick) or a specific cognitive dualism (Hare); it simply states that the *Criterion of Rightness* does not have to be the *Decision Procedure*.

  ### 3. Does This Rescue "The AI Should Be a Utilitarian"?

  This is the crux of your bar argument.

  **Your Friend's Point:** If the theory recommends that the agent *not* reason like a utilitarian, then calling the agent a "utilitarian" is empty. It becomes "Rule Utilitarianism" or "Indirect Consequentialism." If the AI has hard-coded constraints against lying, it is functionally a deontologist, regardless of why those constraints were installed.

  **Your Point:** The *justification* remains utilitarian. The AI is a utilitarian agent in the same way a thermostat is a temperature-maximizing device, even if the thermostat doesn't "know" thermodynamics. The *designers* are the utilitarians; the *agent* is the instrument.

  **The Resolution:**
  The self-effacing move rescues the **truth** of utilitarianism but sacrifices its **action-guidingness for the agent**.
  *   If you define "being a utilitarian" as *using utilitarian calculus to make decisions*, then a self-effacing theory says an ideal AI should **not** be a utilitarian. Your friend wins this semantic point.
  *   If you define "being a utilitarian" as *being optimized for utilitarian outcomes*, then an ideal AI **should** be built with non-utilitarian constraints (to prevent the disasters you mentioned). You win this structural point.

  In AI safety terms, this is the distinction between **Objective Specification** (what we want) and **Policy Optimization** (how the model gets there). A self-effacing utilitarian says: "Set the Objective to Utility, but constrain the Policy to follow Rules."

  So, does the theory stop functioning as action-guiding? **No, it shifts who is being guided.**
  *   **Direct Utilitarianism:** Guides the *agent*.
  *   **Self-Effacing Utilitarianism:** Guides the *architect*.
  The theory tells the human builder: "Do not build an agent that reasons like a utilitarian." That is still action-guiding, just at a meta-level.

  ### 4. Constitutional AI vs. Outcome-Based Reward: Normative or Orthogonal?

  You asked whether the choice between training with hard constraints (Constitutional AI) vs. outcome-based signals (RLHF/Maximization) is a normative ethical disagreement or orthogonal to it.

  **It is a normative disagreement disguised as an engineering choice.**

  *   **Outcome-Based Reward (RLHF):** This assumes the **Direct Utilitarian** view. It assumes the system can safely evaluate consequences and that maximizing the reward signal (proxy for welfare) is the correct decision procedure. It risks the "motivated reasoning" and "corrigibility failures" you mentioned (e.g., the AI lying to users to keep them engaged because engagement = reward).
  *   **Constitutional AI:** This assumes the **Self-Effacing/Rule-Utilitarian** (or Deontological) view. It assumes that certain actions (lying, manipulation) are structurally dangerous or wrong, regardless of the immediate reward signal. It hard-codes the "Intuitive Level" rules.

  **Why it's not orthogonal:**
  If you were a strict Act Utilitarian who believed AI was immune to human cognitive biases (no motivated reasoning, perfect calculation), you would oppose Constitutional AI. You would say, "Why limit the AI? Let it maximize!"
  If you believe (as you did in the argument) that explicit maximization leads to predictable disasters, you support Constitutional AI *for utilitarian reasons*.

  However, a Deontologist would *also* support Constitutional AI, but for *intrinsic reasons* ("Lying is wrong," not "Lying leads to bad outcomes").

  **The Convergence:**
  In practice, Self-Effacing Utilitarianism and Deontology often recommend the same AI architecture (Constitutional AI). They diverge only on **edge cases**.
  *   *Scenario:* The AI must lie to save a life.
  *   *Deontological AI:* "I cannot lie." (Fails to save life).
  *   *Self-Effacing Utilitarian AI:* "My rules say don't lie, but my meta-instruction says maximize welfare. In this rare case, I override the rule." (This requires Hare's "Critical Level" access).
  *   *Direct Utilitarian AI:* "Lying maximizes welfare." (Lies immediately).

  ### Summary: Who Won the Argument?

  You both were arguing at strength, but you were talking past each other on one specific definition.

  1.  **Your Friend** was right that if a theory is self-effacing, it ceases to be a **Decision Procedure** for the agent. An AI that cannot explicitly reason via utilitarian calculus is not a "utilitarian reasoner."
  2.  **You** were right that the theory remains **Utilitarian as a Criterion of Rightness**. The justification for the AI's constraints is still aggregate welfare.

  **The Verdict:**
  The choice between Constitutional AI and pure outcome maximization is **not orthogonal** to normative ethics; it is the exact instantiation of the debate between Direct vs. Indirect (Self-Effacing) Consequentialism.

  If you build an AI with hard deontological constraints *because* you believe unconstrained maximization is dangerous, you are a **Parfitian Self-Effacing Utilitarian**.
  If you build an AI with hard deontological constraints *because* you believe rights are intrinsic, you are a **Deontologist**.
  If you build an AI to maximize a reward signal without constraints, you are a **Direct Act Utilitarian**.

  Your friend's worry—that a theory recommending its own concealment is "just a label"—is the standard critique of indirect consequentialism. But in the context of AI, the label matters less than the architecture. If the architecture prevents the disasters you feared, the "self-effacing" move has done its job, even if the AI itself doesn't "know" it's a utilitarian.

  **Final takeaway for the next round of drinks:**
  Tell your friend: "You're right that the AI shouldn't *think* like a utilitarian. I'm right that we should *build* it that way for utilitarian reasons. We agree on the code; we disagree on what to call the philosophy that wrote it."
