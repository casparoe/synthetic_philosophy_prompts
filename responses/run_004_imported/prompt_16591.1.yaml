prompt: |-
  I've been reporting on coalition politics -- the whole "strange bedfellows" thing, like the classic Baptists-and-bootleggers story where two groups back the same policy for completely different reasons. When I mentioned that to a philosopher I was interviewing for the piece, she said that's not quite what she studies -- Baptists and bootleggers is really just a coincidence of interests -- but it reminded her of something related that she finds more interesting: "moral trade," where two people or groups who disagree about what actually matters morally strike an actual bargain, each conceding something by there own lights, so both end up better off according to their own values without either side budging on who's actually right. She traced the term to a paper by, I think, Toby Ord, and likened the logic to comparative advantage in econ -- you don't need to think another countries preferences are "correct" to still gain from trading with them. She was also careful to distinguish it from plain old moral offsetting (paying to cancel out a harm you caused), since trade specifically needs two parties with different values striking a real bargain, not just one person squaring their own books.

  I only caught the concept in passing and my draft is due soon, so I can't really chase her down again to flesh it out properly. Could you lay out what you think are the most important implications of taking moral trade seriously for how cause-focused orgs should actually negotiate with each other -- say, an animal-welfare group and a global-health group drawing from an overlapping pool of "effective giving" donors, occasionally having to decide whether to co-sign a campaign or split a shared grant? I'm less interested in the rosy comparative-advantage pitch and more in where you think the analogy strains or outright breaks down -- things like power imbalances between a bigger org and a smaller one, the fact that "moral credence" isn't verifiable or exchangeable the way currency is, the risk that quietly striking these deals corrodes the very conviction that made people effective advocates in the first place, or optics problems if donors find out their money was essentially traded away in a backroom compromise.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Trade (specifically distinguishing it from Baptists-and-Bootleggers and Moral Offsetting).
      *   **Source:** Attributed to Toby Ord (philosopher/effective altruism figure).
      *   **Context:** The user is a journalist writing about coalition politics/strange bedfellows. They need to understand the implications for cause-focused organizations (e.g., animal welfare vs. global health) negotiating with each other.
      *   **Specific Focus:** The user wants the *critical* analysis, not just the rosy pitch. They want to know where the analogy strains or breaks down (power imbalances, verifiability of moral credence, corrosion of conviction, optics/transparency).
      *   **Deadline:** Draft is due soon (needs concise, high-value insights).

  2.  **Deconstruct "Moral Trade":**
      *   *Definition:* Two agents with different moral values make a deal. Agent A does something that benefits B's values (but costs A), and B does something that benefits A's values (but costs B). Both gain *expected moral value* according to their own frameworks, without changing their fundamental beliefs.
      *   *Origin:* Toby Ord's paper "Moral Trade" (2014).
      *   *Comparison:* Like economic comparative advantage, but with moral utility functions instead of goods/services.
      *   *Distinction:* Not Baptists/Bootleggers (that's convergent interests, no concession). Not Offsetting (that's one agent neutralizing their own harm).

  3.  **Brainstorm Implications for Org Negotiations (Animal Welfare vs. Global Health):**
      *   *Scenario:* Overlapping donor pool (Effective Altruism community). Shared grant or co-signed campaign.
      *   *Potential Trade:* Animal Welfare (AW) agrees to prioritize human health messaging in a joint campaign; Global Health (GH) agrees to fund some AW projects or include animal welfare clauses in supply chain policies.
      *   *Benefit:* Both get more of what they value than if they fought over the same dollar.

  4.  **Identify the Strain Points/Criticisms (The Core Request):**
      *   *Power Imbalances:* Economics assumes roughly equal footing or at least voluntary exchange. In philanthropy, a large foundation holds all the cards. Can a small AW org really "trade" with a giant GH org? Or is it coercion?
      *   *Verifiability/Enforceability:* Money is fungible and countable. "Moral value" is subjective. How do I know you actually upheld your end of the moral bargain? If I concede on X, how do I measure if you gave me enough Y?
      *   *Corrosion of Conviction:* Advocacy requires passion. If I'm constantly trading away my core principles for "expected value," do I become a mercenary? Does it dilute the message? "Principal-Agent" problem: Do the donors want their money traded, or do they want it spent on *the cause*?
      *   *Optics/Transparency:* "Backroom deals." Donors might feel betrayed. "I gave money to save chickens, why is it going to bednets?" Even if the *expected* value is higher, the *tangible* outcome is different.
      *   *Moral Uncertainty vs. Moral Disagreement:* Ord's framework relies heavily on *moral uncertainty* (I'm not sure if animals matter, but maybe they do). The prompt describes *disagreement* (AW thinks animals matter, GH thinks humans matter). This is a crucial distinction. Trading across fundamental disagreement is harder than trading across uncertainty.
      *   *Transaction Costs:* Negotiating these deals takes time and energy that could be spent doing the work.

  5.  **Structure the Response:**
      *   **Introduction:** Validate the philosopher's reference (Toby Ord, 2014 paper). Briefly define Moral Trade to ensure alignment.
      *   **The Promise (Briefly):** Acknowledge why it's attractive (Pareto improvements in moral space).
      *   **The Strain Points (The Meat):** Address the specific criticisms requested.
          1.  *Incommensurability & Verification:* You can't audit moral utility.
          2.  *Power Dynamics:* Comparative advantage assumes free markets; philanthropy is oligarchic.
          3.  *The Principal-Agent Problem (Donor Trust):* Do donors authorize trading?
          4.  *Motivational Corrosion:* Does it kill the zeal needed for advocacy?
          5.  *Uncertainty vs. Disagreement:* The philosophical hitch.
      *   **Practical Advice for the Article:** How to frame this for the readers.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Refining the Ord Reference:* Yes, Toby Ord's "Moral Trade" (2014) is the key text. He argues that even if we disagree on fundamental values, we can trade actions to increase expected value for both.
      *   *Refining the "Strain":* The economic analogy breaks because in economics, I don't care *why* you want bread. In morals, I might care *why* you are doing this. If you save animals just to get me to save humans, is that virtuous?
      *   *Refining the Org Scenario:* Use the Animal Welfare vs. Global Health example explicitly.
      *   *Key Insight:* The difference between *Moral Uncertainty* (Ord's focus) and *Moral Disagreement* (The prompt's focus). Ord's model works best if I think there's a 10% chance you're right. If I think you are 100% wrong, trade is harder (though still possible if I value *your* satisfaction instrumentally). I need to make sure this distinction is clear.

  7.  **Final Review against Constraints:**
      *   Did I answer the specific prompt? Yes (implications for orgs, where analogy breaks).
      *   Is the tone appropriate? Yes (journalistic, analytical, critical).
