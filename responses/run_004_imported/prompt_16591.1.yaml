  8.  **Final Polish:** Check for clarity on "Baptists and Bootleggers" vs. "Moral Trade." Ensure the distinction is sharp. (Baptists/Bootleggers = same action, different reasons. Moral Trade = different actions, swapped to mutual benefit).

  *(Self-Correction during drafting)*: I initially thought about focusing heavily on the math of expected value. But the user is a journalist writing about *politics* and *negotiation*. I should focus more on the organizational behavior and trust aspects than the philosophical calculus. Keep the philosophy grounded in the practical reality of NGOs.

