answer: |-
  This is a sharp distinction your source made. You're right to separate **Baptists and Bootleggers** (convergent interests: both want alcohol banned, one for piety, one for profit) from **Moral Trade** (divergent interests: I want X, you want Y, we swap concessions to maximize our respective values).

  The philosopher is referring to **Toby Ord's 2014 paper, "Moral Trade."** Ord's core argument is that even if we fundamentally disagree on what is good (e.g., animal welfare vs. human health), we can often reach a Pareto improvement where both sides achieve more of their own moral goals by cooperating than by competing.

  However, applying this to organizational strategy (like an Animal Welfare org and a Global Health org) is where the philosophical elegance meets organizational friction. Here is where the analogy strains, breaks, or creates significant risk for the groups involved.

  ### 1. The Verification Problem (Moral Utility is Not Currency)
  In economics, trade works because price is a universal signal. If I trade you wheat for steel, we both know the quantity and quality of what we received.
  *   **The Strain:** In moral trade, "value" is subjective and unobservable. If the Animal Welfare (AW) group agrees to tone down a campaign to help the Global Health (GH) group secure a government contract, how does AW verify that GH actually "spent" that political capital on something AW values?
  *   **The Implication:** Moral trade requires a level of **radical transparency** that NGOs are rarely built for. To make the trade work, the GH org might have to open their books or strategy docs to the AW org to prove they upheld their end of the bargain. Most organizations guard their strategy as trade secrets. Without enforceable contracts on "moral concessions," these deals rely on trust, which defeats the purpose of a formal trade mechanism.

  ### 2. The Principal-Agent Problem (Who Owns the Moral Credence?)
  This is the biggest optics risk. In a market, I own my money and can trade it for whatever I want. In philanthropy, the money belongs to the **donors**, not the organization.
  *   **The Strain:** If an AW organization agrees to direct some donor funds toward a GH project (because the GH project offers higher "moral return on investment" according to a trade deal), they are effectively **rehypothecating donor intent.**
  *   **The Implication:** Donors give to specific causes, not to a "moral hedge fund." If donors discover their money was used as a bargaining chip in a backroom deal to advance a *different* cause (even if the logic is sound), they may feel betrayed. It looks like bait-and-switch. Organizations attempting moral trade need explicit donor consent for "flexible allocation," which is rare in cause-specific fundraising.

  ### 3. Power Asymmetries and Coercion
  Comparative advantage assumes a market of roughly equal actors. The non-profit landscape is often a hierarchy of massive foundations and scrappy implementers.
  *   **The Strain:** If a massive GH foundation proposes a "moral trade" to a tiny AW startup, is it a trade or a dictate? The larger org can absorb the cost of a moral concession easily; the smaller org might have to compromise its core identity to survive.
  *   **The Implication:** Moral trade can entrench incumbents. A large org can demand concessions that dilute a smaller org's message under the guise of "efficiency." For your story, look for cases where "collaboration" actually looks like **assimilation**. The smaller group gets resources, but loses the distinct voice that made them valuable in the first place.

  ### 4. Corrosion of Conviction (The "Mercenary" Risk)
  Advocacy often requires moral absolutism to motivate staff and donors. You need people who believe saving chickens is *the* most important thing, not *one* thing they are doing as part of a portfolio swap.
  *   **The Strain:** Institutionalizing moral trade turns moral agents into moral traders. It encourages a mindset where principles are negotiable commodities.
  *   **The Implication:** This can lead to **motivational hollowing.** If staff realize their campaigns are just leverage points in a broader negotiation, passion may drop. Furthermore, it makes public messaging incoherent. How do you rally volunteers with a slogan like "Save the Chickens (unless we can trade that for Malaria Nets)"? Moral trade works best in boardrooms, but advocacy happens in the streets. The two logics conflict.

  ### 5. Moral Uncertainty vs. Moral Disagreement
  This is the philosophical nuance your source might have glossed over. Ord's theory works best under **moral uncertainty** (I'm not sure if animals matter, but I assign a 10% probability that you're right). It works less well under **moral disagreement** (I am certain animals don't matter, and you are certain they do).
  *   **The Strain:** If the GH org genuinely believes animal welfare is morally irrelevant (0% weight), they gain nothing from helping the AW org, unless they value the *AW org's happiness* instrumentally.
  *   **The Implication:** For moral trade to work between distinct cause areas, both sides must admit some degree of **moral fallibility.** They have to say, "We might be wrong about our priority." Many organizations are built on the premise that they are *right*. Asking them to admit uncertainty for the sake of a trade deal can be existentially threatening to their brand identity.

  ### Angles for Your Piece
  If you want to move beyond the "rosy pitch," consider framing moral trade not as a solution, but as a **governance challenge.**

  1.  **The "Black Box" Risk:** If moral trade happens, it will likely happen in private. Does secret negotiation undermine the democratic accountability of non-profits?
  2.  **The "Dilution" Effect:** Does trading moral concessions make movements less effective by blurring their messages? (e.g., A climate group trading off fossil fuel divestment to gain support from a labor union might lose the urgency of their climate message).
  3.  **The "Exit" Option:** In economics, if a trade is bad, you walk away. In moral coalitions, exiting can be seen as betrayal. Does moral trade trap organizations in bad partnerships because the cost of breaking the "moral contract" is too high?

  **Summary for your draft:**
  Moral trade is theoretically sound but organizationally dangerous. It treats moral values as fungible assets, but NGOs are built on the premise that their specific values are *non-fungible*. The tension lies between **maximizing good** (the philosopher's goal) and **maintaining trust/mission** (the organization's goal). When those clash, the "trade" often looks like a compromise of integrity to the outside observer.
