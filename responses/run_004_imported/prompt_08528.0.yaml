answer: |-
  This is a classic x-phi skirmish, and it's great that you're digging into the dialectic rather than just the result. The Knobe Effect (Side-Effect Effect) is the gift that keeps on giving because it sits right at the intersection of semantics, social cognition, and normative evaluation.

  Since you're in the weeds of this literature, I'll skip the intro summaries and go straight to the scorecard. Here is the move-by-move breakdown, followed by where I think the state of the art actually lies.

  ### Move-by-Move Analysis

  **(1) Theo: Moral valence is constitutive of the concept of intentional action.**
  *   **Verdict:** **Theoretical Edge to Theo, Empirical Vulnerability.**
  *   **Analysis:** Theo is articulating the "Conceptual Competence" view (akin to Knobe's early "Praise/Blame" hypothesis or the "Deep Self" view). His analogy to "reckless" is philosophically sharp: thick ethical concepts *do* blend description and evaluation. If "intentional" is a thick concept, the asymmetry isn't an error; it's correct application.
  *   **Critique:** The vulnerability here is that "intentional" functions as a *mens rea* category in law and folk psychology precisely because we treat it as descriptive input for moral judgment, not output *of* moral judgment. If the concept itself contains the moral verdict, it loses its utility in deliberation. Theo has a coherent semantic theory, but it demands a revision of how we think folk psychology functions instrumentally.

  **(2) Naomi: If it were conceptual, you wouldn't need morality specifically (Alicke's Culpable Control).**
  *   **Verdict:** **Edge to Naomi.**
  *   **Analysis:** This is the standard "Performance Error" rebuttal. Alicke's Culpable Control Model is the strongest competitor to the Competence view. Naomi correctly identifies that if the asymmetry is driven by a desire to blame, it is a post-hoc rationalization (bias), not a conceptual truth. If I decide you're blameworthy first, then I inflate your foresight and intent to match, that is a distortion of the facts, not a revelation of the concept.
  *   **Why she wins:** She forces Theo to explain why *morality* specifically triggers this conceptual structure. If it's about the *concept* of intention, why does the valence of the outcome matter?

  **(3) Theo: Robustness (Cova et al.) implies competence, not bias.**
  *   **Verdict:** **Edge to Naomi.**
  *   **Analysis:** Theo is committing a version of the naturalistic fallacy here. Universality does not entail veridicality. The Fundamental Attribution Error, confirmation bias, and optical illusions are robust across cultures and contexts; that doesn't make them accurate representations of reality.
  *   **Why she wins:** Stability in cognitive architecture often signals evolutionary utility, not truth-tracking. A bias that promotes group cohesion (by quickly identifying bad actors) would be robust without being "conceptually correct" in a truth-conditional sense. Theo is conflating *descriptive prevalence* with *normative correctness*.

  **(4) Naomi: Robustness $\neq$ Correctness.**
  *   **Verdict:** **Clear Win for Naomi.**
  *   **Analysis:** She simply tightens the logic of her previous rebuttal. She correctly distinguishes between "people can't help doing it" (inevitability) and "people are right to do it" (accuracy). This is the core of the Bias view: the Knobe Effect is a cognitive illusion, like the Müller-Lyer lines. Just because everyone sees the lines as different lengths doesn't mean they *are*.

  **(5) Theo: Uttich & Lombrozo (Non-moral norm violations).**
  *   **Verdict:** **Edge to Theo.**
  *   **Analysis:** This is Theo's strongest empirical move. Uttich & Lombrozo (2010) showed that the effect arises with *normative* expectations, not just *moral* ones (e.g., violating a convention or a statistical norm that carries normative weight). This significantly damages the "Culpable Control" model, which relies on the motivation to blame/praise. If there is no moral blame to assign (e.g., a purely conventional violation), but the asymmetry persists, "blame-first" processing is insufficient.
  *   **Why he wins:** It broadens the scope from "Moral Bias" to "Normative Competence." It suggests the folk concept of intentional action is sensitive to *reasons* and *norms* broadly, not just moral valence. This supports the idea that the asymmetry is a feature of how we track agency in a normative landscape, not a bug caused by moral outrage.

  **(6) Naomi: Salience/Attention (Abnormal outcomes are attention-grabbing).**
  *   **Verdict:** **Draw / Slight Edge to Naomi (on parsimony), but with a caveat.**
  *   **Analysis:** Naomi pivots to a deflationary psychological mechanism. If bad side effects (or norm violations) are more salient, agents are judged to have paid more attention to them, hence higher foresight, hence higher intentionality. This avoids positing a "normative concept."
  *   **The Caveat:** This struggles to explain the *specificity* of the effect. Not all salient events are judged intentional (e.g., a loud noise caused by the agent isn't necessarily an intentional action). Furthermore, Uttich & Lombrozo's point lingers: it's not just *statistical* abnormality that drives the effect, it's *normative* deviation. If Naomi treats "abnormal" as purely statistical/salient, she misses the normative nuance. However, as a mechanistic explanation for *why* the asymmetry occurs without positing a thick concept, it is parsimonious.

  ### What Both Are Missing

  There are two major developments in the literature that would have complicated this debate:

  1.  **The Pragmatic Turn (e.g., Adams, Steadman, or later Knobe):** Both Theo and Naomi are assuming the debate is about *semantics* or *psychological processing*. A third option is that the concept of "intentional" is stable, but the *assertion conditions* vary. Saying "he intentionally did X" might implicate "he is responsible for X." The asymmetry isn't in the concept or the bias, but in what is conversationally relevant to mention.
  2.  **The Reasons View (e.g., Sripada, Pettit):** This bridges the gap. The agent in the harm case had a reason *not* to cause harm (moral norm) but proceeded anyway, revealing a commitment to the harm as acceptable. In the help case, they had no reason *not* to help, so helping doesn't reveal a commitment. This makes the asymmetry about the **structure of practical reasoning**, not just moral bias or semantic constitution. It validates Theo's "competence" intuition without requiring "intentional" to be a thick ethical concept.

  ### Overall Take: Competence or Bias?

  If forced to choose, **the "Competence" side (Theo) is closer to the truth, but for different reasons than he states.**

  Here is why the "Bias" label is increasingly unhelpful in this context:

  1.  **Functionalism:** Even if the process is "top-down" (evaluation influencing attribution), it may be a *feature* of our social cognition, not a bug. We attribute mental states to navigate a normative social world. Detecting "bad" agents requires a lower threshold of evidence than detecting "good" agents (error management theory). Calling this a "bias" implies it's a failure of a truth-tracking system, but if the system's goal is *social regulation* rather than *metaphysical accuracy*, it's working as designed.
  2.  **The Death of Culpable Control:** The replication of the effect in non-moral normative contexts (Move 5) is the nail in the coffin for the pure "Blame-First" bias model. If I judge a chairperson to intentionally violate a purely aesthetic convention, I'm not trying to blame them morally. I am tracking their relationship to the norm.
  3.  **The "Deep Self" Synthesis:** The most robust current models (like Chandra Sripada's Deep Self view) suggest that people attribute intentionality when the outcome aligns with the agent's deeper attitudes/values. In the harm case, the indifference ("I don't care") signals that the harm is consistent with the agent's priorities. In the help case, the indifference signals the help is *not* a priority. This is a form of **Competence**: people are correctly reading the agent's psychological profile, not just hallucinating intent based on anger.

  **Conclusion:**
  Naomi is right that robustness doesn't prove correctness (Move 4), and she is right that "blame-first" is a plausible mechanism. However, Theo is right that the effect is too stable and too broad (Move 5) to be dismissed as a mere moral error.

  The Knobe Effect doesn't show that we are bad at detecting intention; it shows that **intention is not a purely descriptive, mechanical relation.** It is inherently tied to the agent's stance toward norms. Therefore, the asymmetry reflects the **structure of the concept** (Competence), but that concept is more sensitive to normative context than traditional philosophy assumed. It's not that we are biased; it's that the "view from nowhere" on intentional action doesn't exist in folk psychology.

  If you're working on moral psych, the most fertile ground right now isn't asking "Is it a bias?" but "What specific normative inputs (moral, conventional, statistical, identity-based) modulate the threshold for attribution?" That moves past the Theo/Naomi dichotomy into the actual mechanics of the cognition.
