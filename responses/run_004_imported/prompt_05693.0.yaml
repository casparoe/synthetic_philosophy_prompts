answer: |-
  Your friend's take is a common misunderstanding, but you're right to suspect it misses the mark. Williams wasn't defending opera as "high art" in a snobbish sense; he was defending it as a *distinct philosophical category* that gets crushed when you judge it by the standards of spoken theater.

  The "Kerman view" (derived from Joseph Kerman's 1956 book *Opera as Drama*) is essentially a **reductionist** argument. It posits a hierarchy: Drama is the master, Music is the servant. If a beautiful aria stops the plot dead to let a singer show off, Kerman sees that as a failure of dramatic integrity.

  Williams, applying the same anti-reductionist instincts he brought to ethics (where he hated utilitarianism for reducing all value to a single metric of "utility"), argues that this hierarchy misdescribes the phenomenology of watching opera. He thinks Kerman is asking opera to be something it isn't, and in doing so, misses what it actually *is*.

  Here are the philosophical guts of Williams's counter-argument.

  ### 1. The Category Mistake: Opera is Not "Played Drama"
  Williams argues that Kerman's view rests on a category mistake. Kerman treats opera as if it were a play that happens to be sung, where the ideal is a kind of **psychological realism**. In this view, if a character sings a beautiful melody while dying, it's only justified if that melody accurately reflects the psychological state of dying in a realistic way.

  Williams pushes back by saying opera is inherently **impossible**. People do not sing in real life, especially not while dying or falling in love. Therefore, demanding "dramatic truth" in the realist sense is incoherent.

  For Williams, the "work" of opera isn't to simulate reality (which it can't do); it's to create a **conventionalized space** where emotion can be externalized. When a singer holds a high C, that isn't necessarily a failure of dramatic pacing (as Kerman might imply); it is the *actual substance* of the emotion. The music doesn't illustrate the drama; the music *constitutes* the drama. To subordinate the music to the text is to remove the very medium in which the opera's truth resides.

  ### 2. Music as Action, Not Commentary
  A key Williamsian insight is that in opera, music is not commentary; it is **action**.

  In spoken drama, if an actor says "I am angry," and the background music swells to tell us they are *really* angry, the music is illustrative. But in opera, the singing *is* the acting. Williams suggests that the emotional content of an opera is often carried more by the musical structure (tempo, key, vocal texture) than by the libretto.

  If you follow Kerman, you treat the libretto as the "script" and the music as the "delivery." Williams argues this splits the unity of the experience. He suggests that sometimes the "dramatic truth" is found precisely in the moments where the music *overrides* the text. If the text says "I must leave you" but the music is lush, lingering, and beautiful, the *truth* of the scene is the conflict between the duty (text) and the desire (music). If you cut the beauty to make the text clearer, you haven't improved the drama; you've lobotomized the emotional complexity.

  ### 3. The Defense of Convention (and Artificiality)
  This is where Williams is most distinct from the "high art" elitist label your friend gave him. Williams was deeply interested in **convention** as a necessary scaffold for human meaning (a theme also present in his work on truthfulness).

  Opera relies on extreme conventions: orchestras in pits, people singing in foreign languages, dying in song. Kerman tends to view these conventions as obstacles to be overcome by "good" dramatic composition. Williams argues these conventions are the **enabling conditions** of the art form.

  He suggests that the audience enters a "double consciousness." We know the singer is a singer, and we know the character is a character. The pleasure of opera comes from the tension between the human voice (the physical effort, the beauty of the tone) and the fictional role. When Kerman demands the music disappear into the drama, he is asking the audience to ignore half of what is happening. Williams argues that acknowledging the artificiality—the "spectacle," if you will—is not a cop-out; it is part of the contract. The "just beautiful" singing provides a form of **consolation** or **aesthetic resolution** that realistic drama cannot offer.

  ### 4. Truthfulness vs. Realism
  If you know Williams's *Truth and Truthfulness*, you'll see the parallel here. Williams distinguishes between **accuracy** (getting the facts right) and **truthfulness** (being sincere to the human condition).

  He applies this to opera. Kerman is obsessed with *accuracy* (does the music match the psychological state accurately?). Williams is interested in *truthfulness* (does this combination of sound and story reveal something true about human passion, even if it's unrealistic?).

  Williams argues that a "beautiful" aria that seems to stall the plot might actually be more truthful to the human experience of time and emotion. In real life, grief doesn't follow a plot schedule; it lingers, it loops, it obsesses. A da capo aria that repeats text and decorates it vocally might be "dramatically inefficient" by Kerman's standards, but it is **psychologically truthful** about the obsessive nature of grief or love. Williams resists the idea that "dramatic efficiency" is the highest good.

  ### 5. Why Your Friend is Wrong
  Your friend thinks Williams is defending "high art" against "spectacle." Actually, Williams is defending **pleasure** against **moralism**.

  The Kerman view is surprisingly moralistic: it implies you *shouldn't* enjoy a beautiful voice if it isn't "working" for the plot. It treats aesthetic pleasure as suspicious unless it is in service of a narrative goal. Williams, the philosopher who defended "integrity" against the demands of utilitarian calculation, sees the same structure here. He is arguing that the immediate, sensuous experience of the music has intrinsic value. It doesn't need to be "justified" by the drama.

  He isn't saying "spectacle is better than drama." He is saying that **music creates a different order of reality**, and judging that reality by the standards of spoken theater is a philosophical error.

  ### Summary of the Position
  Williams's position is that opera is a **hybrid form** where the music does not serve the drama, but rather **collaborates** with it to create a third thing.
  *   **Against Kerman:** Music is not a servant to text; it is an equal partner that often carries the primary emotional weight.
  *   **Against Realism:** Artificiality and convention are not bugs; they are features that allow for expressions of emotion impossible in realistic theater.
  *   **The "Work" of Opera:** The work is done not by narrative coherence, but by the **integration of sound and action** into a truthful (though not realistic) expression of human passions.

  So, when Williams defends "just beautiful" singing, he isn't being precious. He's arguing that the beauty *is* the meaning. To ask "what dramatic work is this note doing?" is to ask the wrong question. The note is doing the work of being a note, and in opera, that is enough.
