      *   *Why the User's Effort Wasn't Wasted:* It validated the *migration*, not the *reality*. It proves the new code calculates what the old code calculates.
      *   *How to do it right:*
          1.  **Synthetic Transactions:** Send 100 requests, count 100 successes.
          2.  **Orthogonal Data Source:** Compare LB logs vs. App logs vs. Network packets.
          3.  **Manual Sampling:** Randomly pick 50 IDs and trace them manually.
          4.  **Chaos Engineering:** Break something known and see if the metric catches it.
      *   *Closing:* Advice on how to talk to the Tech Lead. Acknowledge his point, pivot to the next step.

  6.  **Refining the Tone:**
