answer: |-
  This is an excellent pedagogical pivot. The standard objection (that common knowledge of posteriors is psychologically impossible) grants too much to the theorem's underlying epistemology. It accepts the *normative* claim (that rational agents *should* agree) while rejecting the *descriptive* feasibility.

  To give your students a "meatier" objection, you need to attack the **normative** claim itself. You need to show that the Agreement Theorem is not a deep result about the convergence of rational inquiry, but rather a mathematical tautology that holds only because the Common Prior Assumption (CPA) has already stipulated away the possibility of fundamental rational disagreement.

  Here is an argument structure you can use in your seminar, broken down into three core claims.

  ### 1. The Category Error: Intra-agent vs. Inter-agent Rationality
  The strongest philosophical objection is that the Harsanyi Doctrine conflates two distinct types of rationality constraints: **diachronic coherence** and **synchronic uniformity**.

  Subjective Bayesianism (the framework Aumann operates within) defines rationality as **coherence**.
  *   **Diachronic Coherence:** An agent must update their beliefs via Conditionalization to avoid dynamic Dutch Books.
  *   **Synchronic Coherence:** An agent's beliefs must satisfy the Probability Axioms to avoid static Dutch Books.

  Crucially, Subjective Bayesianism (à la de Finetti, Ramsey, Savage) is silent on the *content* of the prior. As long as the prior is coherent (sums to 1, non-negative), it is rational. There is no "Dutch Book" argument that forces Agent A's prior to match Agent B's prior. I can bet on my priors, and you can bet on yours, and as long as we are internally consistent, neither of us is irrational.

  **The Objection:** The Harsanyi Doctrine introduces a third constraint: **Inter-agent Uniformity**. It claims that rationality requires not just internal coherence, but *external alignment* of starting points.
  *   **Why this is a smuggle:** This moves the goalposts from Subjective Bayesianism to Objective Bayesianism (or Logical Probability) without justification. Objective Bayesians argue that the Principle of Indifference or Maximum Entropy dictates a unique rational prior. But Aumann's theorem is usually presented as a result of *Subjective* Bayesian rationality.
  *   **The Punchline:** If you are a Subjective Bayesian, you have no resources to insist two agents *should* share a prior. If you insist they must, you are no longer a Subjective Bayesian. Therefore, the Agreement Theorem does not prove that "Subjective Bayesians cannot agree to disagree." It proves that "Agents who happen to share a probability measure cannot disagree." The normativity comes entirely from the Harsanyi postulate, not the Bayesian updating.

  ### 2. The "Pre-Rationality" Problem (The Origin of Priors)
  Even if we grant that agents *should* share a prior, we must ask: **Where do priors come from?**

  In formal models, priors are defined at $t=0$, before any evidence is received. But in the real world, "priors" are the sedimented result of genetics, evolutionary heuristics, cultural upbringing, and linguistic conditioning. These are **causal** processes, not **epistemic** justifications.

  *   **The Argument:** If priors are the product of non-epistemic causal histories (e.g., evolutionary pressure to detect snakes vs. evolutionary pressure to detect spirits), there is no reason to expect them to converge on a single "True Prior."
  *   **The Implication:** To demand a Common Prior is to demand that all rational agents have identical causal histories or identical cognitive architectures. This is not a requirement of rationality; it is a requirement of **cloning**.
  *   **Seminar Point:** Ask your students: "If rationality is a tool for navigating the world, why must all tools be identical?" A hammer and a screwdriver are both rational tools for construction, but they have different 'priors' regarding the nature of the task. Demanding a common prior is like demanding that all rational carpenters must use only hammers.

  ### 3. The Tautology Charge: Agreement is Baked In
  This is the most damaging technical objection. The Agreement Theorem is often sold as a dynamic result: "As we exchange information, we *converge*."

  But mathematically, the theorem is static. It compares posterior probabilities derived from a **single, fixed probability measure** $P$ over a **single state space** $\Omega$.
  *   If Agent A and Agent B share $P$, they already agree on the probability of every event in $\Omega$ *before* they receive any private information.
  *   Their "disagreement" is merely an illusion caused by information asymmetry.
  *   Once the asymmetry is removed (via common knowledge), the underlying agreement (which existed at $t=0$) is revealed.

  **The Objection:** The theorem doesn't explain how rational agents *reach* agreement; it assumes they *started* in agreement.
  *   **The "Work" is in the CPA:** The heavy lifting is done entirely by the assumption that $P_A = P_B$. The Bayesian updating part is just bookkeeping.
  *   **Garbage In, Garbage Out:** If the Common Prior is wrong (e.g., both agents assign prior probability 0 to a true hypothesis), the theorem guarantees they will *agree* on the wrong answer with certainty. The theorem guarantees consensus, not accuracy. If the goal of epistemology is truth, not just consensus, the CPA is dangerous. It privileges **consistency among agents** over **responsiveness to the world**.

  ### Bonus: Why Subjective Bayesianism Cannot Mandate Shared Priors
  To drive the bonus point home, you can walk through the **Dutch Book Argument**.

  1.  **Static Dutch Book:** If my degrees of belief violate the probability axioms, you can construct a set of bets that guarantees my loss. This forces me to be probabilistically coherent.
  2.  **Dynamic Dutch Book:** If I do not update via Conditionalization, you can construct a strategy that guarantees my loss over time. This forces me to be a Bayesian updater.
  3.  **Inter-agent Dutch Book?** Can you construct a Dutch Book against *two* agents who have different priors but are both coherent? **No.**
      *   If I think $P(H) = 0.9$ and you think $P(H) = 0.1$, we can bet against each other. One of us will lose money, but neither of us is *irrational* ex-ante. We simply have different risk assessments.
      *   For a Dutch Book to force prior convergence, there would need to be a "Bookie" who knows the *True Probability*. But in Subjective Bayesianism, there is no "True Probability" accessible to the agents other than their own coherent beliefs.

  Therefore, Subjective Bayesianism treats priors as **tastes** or **values**, not as truth-claims subject to rational adjudication. Just as rationality does not demand you prefer chocolate ice cream to vanilla, it does not demand you prioritize hypothesis $H$ over $\neg H$ in the absence of evidence. The Harsanyi Doctrine treats priors as **facts** about the world that rational agents must detect. This is a category mistake within the Subjective framework.

  ### Summary for the Seminar
  You can summarize the objection for your students with this distinction:

  > "Aumann's Theorem is a mathematical truth, but an epistemological mirage. It proves that if you assume agents are essentially the same person (Common Prior) who have seen different things (Private Information), they will act the same once they compare notes.
  >
  > The Harsanyi Doctrine tries to sell this as a norm: 'You ought to be the same person.' But Subjective Bayesianism provides no argument for why rationality requires uniformity. By smuggling in the Common Prior Assumption, we aren't discovering a deep fact about rational consensus; we are simply defining disagreement as irrationality by fiat."

  This moves the critique from "people can't do this" (psychological impossibility) to "this doesn't mean what you think it means" (conceptual emptiness), which is much more satisfying for advanced students.
