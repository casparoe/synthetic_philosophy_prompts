      *   *Substance vs. Pride:* It was definitely substantive. It's about Occasionalism vs. Pre-established Harmony vs. Active Will. But pride was involved (priority on calculus, Royal Society politics). However, the theological stakes were real: Is nature autonomous or dependent?

