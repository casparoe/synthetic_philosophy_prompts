      *   *The Connection:* If the Son is not co-equal, the Father is the sole supreme authority. If the Father is the sole supreme authority, His will must be directly enacted in creation. A self-sufficient universe (Leibniz's view) implies the creation has autonomy *independent* of the Creator. For Newton, this diminishes God's sovereignty.
      *   *Key Concept:* "Lord God Pantokrator." Newton's definition of God is relational and volitional, not just ontological.
      *   *Deism vs. Newton:* Deism says God is perfect, so He made a perfect machine that doesn't need fixing. Newton says God is a *King*, and a King who abandons his kingdom is no King. Therefore, the machine *must* need fixing (or at least, God *must* be allowed to fix it) to prove His ongoing reign.
      *   *Idolatry:* Newton viewed the Trinity as idolatry (worshipping a creature). He viewed a self-sufficient universe as a form of atheism/materialism because it removes the need for God's will in the present tense. Both are about preserving the *absolute uniqueness and supremacy* of the Father.

