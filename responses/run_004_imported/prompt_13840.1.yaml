answer: |-
  This is not a rabbit hole; this is the heart of the matter. You have identified the exact tension that modern Newton scholarship (particularly the work of Rob Iliffe, J.E. McGuire, and Stephen Snobelen) has spent the last thirty years untangling.

  To answer your editor: **No, these are not two separate heterodoxies traveling together.** They are structurally identical commitments derived from a single, overriding theological axiom: **Absolute Sovereignty.**

  For Newton, the definition of God was not primarily ontological (what God *is* in essence) but relational and political (what God *does* and what authority He holds). If you lose that thread, the physics looks like bad astronomy and the theology looks like a hobby. If you keep the thread, they are the same argument.

  Here is the logical bridge you are looking for, broken down into the three components you need for your piece.

  ### 1. The Core Axiom: *Pantokrator* over *Prime Mover*
  The standard Deist argument (which your intuition is correctly flagging) runs like this: *If God is One and Rational, He creates a rational, self-sufficient system.*

  Newton's argument runs like this: *If God is One and Supreme, He must hold absolute dominion over the system at every moment.*

  In the *General Scholium* (1713), Newton writes: "For God is not eternity and infinity, but eternal and infinite; he is not duration or space, but he endures and is present." He goes on to define the word *God* as a relative term: "God is a relative word and has a respect to servants; and Deity is the dominion of God not over his own body, as those imagine who fancy God to be the world, but over servants."

  This is the key. To Newton, a God without dominion is not God. He is obsessed with the title *Pantokrator* (Lord of All).
  *   **The Trinitarian Problem:** If the Son is co-equal and co-eternal, sovereignty is shared. For Newton, this is a division of authority, akin to a constitutional monarchy or a committee. It dilutes the absolute will of the Father. By making the Son a created mediator (Arianism), Newton preserves the Father as the sole, absolute Monarch.
  *   **The Deist Problem:** If the universe is a perfect clockwork that runs without intervention, the creation has autonomy. It operates by its own inherent laws independent of the Creator's will. For Newton, this is a threat to sovereignty. If the universe doesn't *need* God to keep running, God is reduced to a past cause, not a present Lord.

  **The Link:** Both anti-Trinitarianism and anti-Deism serve the same goal: protecting the absolute, undivided, ongoing authority of the Father.

  ### 2. Space, Gravity, and the "Sensorium"
  This is where the physics becomes theology. You asked about the "active dominion" in the *Opticks* and the comets.

  Newton struggled with the mechanism of gravity. Action at a distance was philosophically absurd to him. How does the Sun pull the Earth without touching it?
  *   **Leibniz's answer:** Pre-established harmony. God set it up perfectly at the start.
  *   **Newton's answer:** Space is the "sensorium of God."

  Newton suggests that infinite space is an emanation of God's presence. Gravity isn't just a mechanical force; it is the physical manifestation of God's will acting continuously on matter. Matter is passive; God is active.

  If you remove God's active hand, gravity fails, the planets drift, and the system collapses. Therefore, the "instability" of the solar system (which requires correction) is not a bug; it is a feature. It ensures that the universe remains *dependent* on God. A perfect, self-sustaining universe is, to Newton, an atheistic universe because it renders God's will redundant in the present tense.

  So, the logical link is: **Dependency.**
  *   The Son depends on the Father (Theology).
  *   Creation depends on the Father (Physics).
  *   Any claim of independence (Co-equality or Clockwork Autonomy) is idolatry.

  ### 3. The Leibniz/Clarke Correspondence: What was at stake?
  Regarding your second question: The fight with Leibniz was absolutely substantive, though laced with priority disputes.

  When Leibniz mocked Newton's God as an "unskilled watchmaker" who has to clean his watch or wind it up, he was attacking from the standpoint of **Divine Perfection as Intellectual Elegance.** For Leibniz, a perfect God creates a perfect system. Needing to intervene implies a mistake in the design.

  Newton (via Clarke) countered from the standpoint of **Divine Perfection as Volitional Power.**
  *   **Leibniz:** God is bound by the Principle of Sufficient Reason. He chooses the "best of all possible worlds," but having chosen it, He acts according to the rational necessity of that choice.
  *   **Newton:** God is Will. He is not bound by the system He created. To say God *cannot* intervene because the machine is "too perfect" is to limit God's freedom.

  Clarke's famous rebuttal was that a kingdom is better than a machine. A machine runs itself; a kingdom requires a King. If the world is a machine, God is a mechanic. If the world is a kingdom, God is a Monarch. Newton needed the comets to need nudging, and the orbits to need correcting, because it proved the world was a Kingdom, not a machine.

  **The Stakes:** It was a fight over **Necessity vs. Will.**
  Leibniz's universe is a prison of logical necessity (even for God). Newton's universe is a realm of Divine Will. If you side with Leibniz, you get a cleaner physics but a God who is essentially bound by logic. If you side with Newton, you get a God who is free, but a physics that requires "divine upkeep."

  ### How to Frame This for Your Editor
  You can argue that Newton's "hidden" theology is not a secret hobby, but the **operating system** of his science.

  1.  **The Unity of Purpose:** Newton wasn't a scientist who happened to be religious, or a heretic who happened to do math. He was a natural philosopher seeking to describe the *action* of the One Supreme God upon matter.
  2.  **The "Bad Watchmaker" Reframed:** Newton didn't think God was a bad watchmaker. He thought Leibniz's "perfect watch" was a idol—a golden calf that replaced the living God with a dead mechanism.
  3.  **The Modern Relevance:** This explains why Newtonian physics eventually ate its own tail. The "God of the Gaps" (the divine upkeep) was eventually removed by Laplace ("I have no need of that hypothesis"). But for Newton, removing the gaps *was* removing God.

  ### Recommended Scholarship for Verification
  If you need to cite specific authorities to back this up for your fact-checkers:
  *   **Rob Iliffe, *Priest of Nature: The Religious Worlds of Isaac Newton* (2017).** This is the definitive modern biography regarding his theology. Iliffe argues exactly what I've outlined: Newton's theology was about authority and dominion, not just doctrine.
  *   **J.E. McGuire, "Newton on Place, Time, and God: An Unpublished Source" (1978).** Covers the "sensorium" and the metaphysical link.
  *   **Stephen Snobelen, "Isaac Newton, Heretic" (1999).** Good for the specific Arian/Socinian distinctions.
  *   **The Clarke-Leibniz Correspondence (1715-1716).** Specifically Clarke's 4th and 5th papers, where the "Kingdom vs. Machine" analogy is made explicit.

  **The Pitch:** Don't frame it as "Newton had a secret religion." Frame it as "Newton's physics was an act of worship." The math wasn't separate from the heresy; the math was the proof of the heresy. He proved the Father's dominion by showing the universe couldn't run without Him.

  If your editor cuts this, they are cutting the engine out of the car and asking why it won't drive. This is the only way to make sense of why the man who unlocked the laws of motion believed those laws required a Lawgiver to actively sustain them.
