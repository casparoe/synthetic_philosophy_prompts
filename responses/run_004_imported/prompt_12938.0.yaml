prompt: |-
  I run a pretty small philosophy-adjacent podcast (something like 40 regular listeners, mostly people from my old LW meetup group, so we can skip the 101 explainer stuff) and I finally landed a genuinely good guest: a philosopher of mind who's spent the last few years defending a pretty hardcore Dennett-style line on AI cognition. Her basic pitch is that asking whether a model "really" believes or wants anything is a confused question, full stop -- the only thing that matters is whether the intentional stance buys you real predictive leverage, and she leans hard on Dennett's old "real patterns" move to argue the pattern is objectively there in a transformer the same way its there in a person. I've read most of her stuff and find it pretty persuasive honestly, but I don't want the episode to just be her restating the thesis for the tenth time, I want to actually push on it.

  Can you draft me like 8-10 interview questions for this? I definitely want at least one that hits the interpretability angle -- since with an LLM we actually have the full "design stance" story available in principle (weights, activations, attention patterns) in a way Dennett never had for brains, doesn't that threaten to make the intentional stance eliminable for AI specifically, even where it isn't for people? I also want something on the "simulator" problem -- a single model can role-play a dozen contradictory personas inside one context window, so who's actually supposed to be the believer there, the underlying net or whichever character it's currently simulating? And I want a question that really presses on whether talk of a model "believing it's still in training" (the deceptive alignment framing you see all over AI safety discourse) is earning its keep as a genuinely predictive intentional-stance claim, or if its just folk psychology smuggled in the back door because its a vivid way to talk. For each question, throw in a short follow-up keyed to whatever answer she's most likely to give, so I've got something ready if she goes for the obvious dodge.
