  # The Metric and the Norm: Assessing the Circularity of the Accuracy-Dominance Argument

  In machine learning, the selection of a loss function is often pragmatic: we choose the Brier score or log-loss because they penalize confident errors heavily and facilitate gradient descent. However, in formal epistemology, these functions serve a foundational role. James M. Joyce's accuracy-dominance argument utilizes the mathematical properties of strictly proper scoring rules to argue for *probabilism*—the thesis that rational credences must satisfy the axioms of the probability calculus. The argument is elegant: if your credences violate probability axioms, there exists an alternative set of credences that satisfies them and is guaranteed to be more accurate than yours in every possible world.

  However, a potent philosophical objection threatens to undermine this derivation. The definition of a "strictly proper" scoring rule relies on the concept of mathematical expectation: a rule is proper if reporting your true probability minimizes your *expected* inaccuracy, calculated using that same probability. Critics argue that invoking expectation presupposes the very probabilistic framework the argument seeks to establish. If the metric used to prove probabilism is defined in terms of probabilistic expectation, the argument appears viciously circular. This essay assesses whether this circularity charge defeats the accuracy-dominance argument. While the objection highlights a tension between the mathematical tools and the normative conclusions, it ultimately fails. The restriction to proper scoring rules can be independently motivated by the structural requirements of truth-directedness and convexity, without begging the question in favor of probabilism.

  ### The Accuracy-Dominance Argument

  To understand the circularity charge, one must first grasp the mechanics of Joyce's argument. The core normative premise is *veritism*: the fundamental epistemic goal is to hold accurate beliefs. Accuracy is measured by an inaccuracy function $I(w, c)$, which assigns a penalty to a credence function $c$ given a world $w$ (where the truth values of propositions are determined).

  Joyce's theorem states that if a credence function $c$ violates the probability axioms (is incoherent), and the inaccuracy measure $I$ is "legitimate," then there exists a coherent credence function $c^*$ that accuracy-dominates $c$. That is, $I(w, c^*) < I(w, c)$ for every possible world $w$. If rationality requires avoiding dominated strategies, and incoherent credences are always dominated, then rationality requires probabilism.

  The crux of the theorem lies in the conditions for a "legitimate" inaccuracy measure. Joyce argues that $I$ must be continuous, additive, and, most critically, *strictly proper*. In the context of epistemic utility, strict propriety means that for any probabilistic credence function $p$, the expected inaccuracy of $p$ is strictly lower than the expected inaccuracy of any other function $q$, where the expectation is weighted by $p$ itself.

  ### The Circularity Objection

  The circularity charge strikes at the definition of propriety. To say a scoring rule $S$ is proper is to say:
  $$ \mathbb{E}_p[S(p, \cdot)] \leq \mathbb{E}_p[S(q, \cdot)] $$
  for all $q \neq p$. Here, $\mathbb{E}_p$ denotes the mathematical expectation operator weighted by the probabilities in $p$.

  The objection runs as follows: The accuracy-dominance argument is intended to justify the norms of probability to an agent who might not yet accept them. However, the tool used to justify these norms—propriety—is defined using the expectation operator, which is itself a probabilistic construct. If an agent's credences do not sum to one or violate additivity, the "expectation" calculated using those credences is mathematically suspect or behaviorally meaningless.

  By restricting legitimate inaccuracy measures to those that are proper, Joyce appears to be filtering for measures that behave well *only if* the agent is already probabilistic. Consequently, the argument seems to assume the coherence of the credence function to define the metric that proves the coherence of the credence function. As philosopher Alan Hájek and others have suggested, this looks like smuggling the conclusion into the premises. If we must assume the validity of probabilistic expectation to define the scoring rule, we have not derived probabilism from accuracy alone; we have derived it from accuracy plus probabilistic expectation.

  ### Independent Motivation: Truth-Directedness and Convexity

  To rescue the accuracy-dominance argument, one must demonstrate that the restriction to proper scoring rules does not rely on a decision-theoretic commitment to expectation, but rather on a more fundamental epistemic commitment. The defense rests on two pillars: the nature of truth-directedness and the geometric property of convexity.

  First, we must distinguish between the *mathematical definition* of propriety and its *epistemic justification*. In machine learning, propriety is justified by incentive compatibility: we want the model to report its true estimate. In epistemology, the justification is *truth-directedness*. An inaccuracy measure should reflect the distance between a credence and the truth value (0 or 1).

  Richard Pettigrew, a leading defender of epistemic utility theory, argues that propriety is necessary to ensure that the inaccuracy measure respects the agent's own perspective on the truth. If a scoring rule is *improper*, there are cases where an agent, believing $p$ is the case, would expect a different report $q$ to be more accurate. This creates a fracture between the agent's belief and their evaluation of accuracy. For an accuracy measure to be genuinely *epistemic* (rather than pragmatic), it must align with the agent's cognitive state. If I believe the chance of rain is 70%, an epistemic measure should not tell me that claiming 90% is "more accurate" relative to my own evidence. This alignment requirement motivates propriety without invoking rational choice theory; it invokes the internal consistency of the epistemic stance.

  Second, and more decisively, propriety can be characterized geometrically rather than probabilistically. A strictly proper scoring rule corresponds to an inaccuracy measure that is generated by a strictly convex function. Convexity is a mathematical property independent of probability interpretation. It ensures that the inaccuracy of a "mixture" of credences is not greater than the mixture of their inaccuracies.

  Why should an epistemologist care about convexity? Because it captures the intuition that extremity should be penalized unless supported by evidence. If an inaccuracy measure were concave, it would incentivize "jumping to conclusions"—adopting extreme credences (0 or 1) regardless of evidence, as this would minimize the score in a risk-seeking manner. Convexity ensures that the inaccuracy measure rewards calibration and modesty in the face of uncertainty. Since convexity can be defined and motivated without reference to the expectation operator (it is a property of the function's curvature), the reliance on propriety does not presuppose probabilism. It presupposes a structural constraint on how distance from the truth is measured, which happens to be mathematically equivalent to propriety.

  ### Weighing the Considerations

  The circularity charge is not frivolous. It correctly identifies that the *language* of expectation is probabilistic. If the argument relied on the agent *maximizing* expected accuracy as a decision rule, the circle would be vicious. It would amount to saying: "You should be probabilistic because if you calculate expectations probabilistically, probabilistic credences win."

  However, the accuracy-dominance argument does not require the agent to maximize expectation. It relies on a dominance theorem. The theorem states that *if* we measure accuracy using a proper rule (justified by convexity/truth-directedness), *then* incoherent credences are dominated. The expectation operator in the definition of propriety is a tool for the *theorist* to classify legitimate metrics, not a command for the *agent* to perform calculations.

  The circularity charge conflates the *context of justification* (why we choose the metric) with the *context of application* (how the agent uses the metric). We choose proper metrics because they are truth-directed and convex, not because we assume the agent is probabilistic. Once the metric is selected, the mathematics of dominance takes over. The fact that the mathematical definition of propriety uses the symbol $\mathbb{E}$ is a convenience of notation for weighted sums, not a commitment to the agent's rationality.

  Furthermore, if we reject proper scoring rules, we are left with measures that incentivize epistemic distortion. If an improper measure tells an agent that their true belief is less accurate than a falsehood (relative to their own evidence), that measure fails to track truth. Since the goal of the argument is to vindicate probabilism as a norm of *truth-seeking*, using a measure that distorts the relationship between belief and truth would be self-defeating. Thus, propriety is required by the very premise of veritism, independent of probability axioms.

  ### Verdict

  The circularity charge against Joyce's accuracy-dominance argument is insightful but ultimately unsuccessful. It mistakes the mathematical characterization of proper scoring rules for their normative justification. While propriety is defined via expectation, it is motivated by the non-probabilistic norms of truth-directedness and the geometric requirement of convexity. These motivations ensure that the inaccuracy measure faithfully represents the distance between belief and truth without presupposing that the agent already obeys the probability calculus.

  Therefore, the restriction to proper scoring rules does not beg the question. It establishes a necessary condition for any measure that claims to quantify epistemic accuracy. Since the dominance theorem holds for any measure satisfying these independently motivated conditions, the argument successfully derives probabilism from the goal of accuracy. The circularity charge fails to defeat the argument because the "probabilistic" elements in the definition of propriety are structural features of truth-tracking, not presuppositions of rational agency.

  **Verdict:** The circularity charge is **false**. The accuracy-dominance argument remains a valid derivation of probabilism, as the restriction to proper scoring rules is grounded in the pre-probabilistic norm of truth-directedness rather than a question-begging appeal to probabilistic expectation.
