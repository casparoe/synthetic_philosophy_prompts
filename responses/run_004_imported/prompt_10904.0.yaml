answer: |-
  **MEMORANDUM**

  **TO:** Joint Health Benefits Committee
  **FROM:** [Your Name], Graduate Worker Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding GLP-1 Agonist Coverage Criteria for Plan Year 2025

  ### Executive Summary

  The Insurance Consultant has proposed restricting coverage of GLP-1 agonists (semaglutide, tirzepatide) for weight management to members with a BMI ≥30 *plus* a diagnosed obesity-related comorbidity (e.g., Type 2 Diabetes, OSA, Hypertension). This memo recommends **rejecting the comorbidity restriction** and maintaining coverage for members with a BMI ≥30, subject to enhanced Prior Authorization (PA) protocols.

  While the fiscal pressure on our self-insured plan is genuine, restricting coverage to members who have already developed end-organ damage contradicts the preventative purpose of health insurance and relies on a contested ontological view of obesity as a "risk factor" rather than a chronic disease state. Cost containment should be achieved through utilization management, not eligibility exclusion.

  **Recommendation:** Maintain current eligibility (BMI ≥30) without comorbidity requirement.
  **Effective Date:** January 1, 2025 (contingent on PA protocol implementation by November 1, 2024).

  ### Background

  Our self-insured plan has seen a 240% increase in pharmacy spend related to GLP-1 prescriptions over the last two plan years. The Consultant argues that covering weight loss medication for individuals without existing metabolic dysfunction is fiscally unsustainable and medically unnecessary. They propose limiting coverage to those who demonstrate "proven dysfunction" via comorbidity.

  This creates a dichotomy in the committee: one view prioritizes immediate fiscal solvency and questions the pathological status of BMI alone; the other prioritizes equitable access and views the restriction as a "wait-for-harm" model that exacerbates health disparities.

  ### Argument for Recommendation

  **1. The Ontological Status of Obesity and the Function of Insurance**
  The proposal rests on the premise that a BMI ≥30 without comorbidity does not constitute a medical dysfunction warranting pharmaceutical intervention. This treats obesity merely as a statistical risk factor rather than a chronic disease process. Current endocrinological consensus (including the AMA and Endocrine Society) classifies obesity as a disease state characterized by adipose tissue dysfunction, regardless of immediate downstream complications.

  Health insurance functions to pool risk against high-cost medical events. If we restrict coverage until a member develops hypertension or sleep apnea, we are effectively converting the plan from a *health* insurer into a *repair* insurer. We would be incentivizing a delay in treatment until the member is "sick enough" to qualify, at which point the cost of managing the comorbidity (e.g., insulin for diabetes, CPAP and cardiac management for OSA) will likely exceed the cost of early pharmacological intervention.

  **2. The Ethical Implications of "Wait-for-Harm"**
  Restricting coverage to those with comorbidities introduces a normative judgment about which bodies deserve intervention. As noted in the literature on medical stigma, the workup for comorbidities is not evenly distributed. Marginalized populations often face barriers to diagnostic follow-up. A policy requiring a hypertension diagnosis to cover weight loss medication disadvantages members who lack consistent primary care engagement, effectively penalizing them for gaps in the care continuum that the university plan should aim to close.

  Furthermore, this restriction creates a moral hazard where members are financially incentivized to allow their health to deteriorate to meet coverage thresholds. This is incompatible with the University's stated mission regarding student and employee well-being.

  ### Addressing the Strongest Counter-Argument: Fiscal Solvency

  The strongest argument against this recommendation is fiscal reality. The Consultant's data indicates that without restriction, premium increases for the next plan year could exceed 15%. This is not a trivial concern; as a self-insured plan, unchecked costs directly impact university resources and potentially future stipend or wage negotiations. **If the plan becomes insolvent or premiums become unaffordable, no one has coverage.**

  I concede this point entirely: **We cannot cover everything at any cost.** However, the solution to high utilization is not necessarily narrowing eligibility; it is managing utilization.

  Restricting eligibility based on comorbidities is a blunt instrument. It assumes that *all* BMI 30+ patients without comorbidities are using the drug cosmetically, which is false. Conversely, it assumes *all* patients with comorbidities are using it therapeutically, which may also be false.

  **The Alternative: Rigorous Prior Authorization**
  Instead of an eligibility ban, I propose we implement strict Prior Authorization criteria for *all* GLP-1 weight management requests, regardless of comorbidity status. This addresses the fiscal concern without the ethical cost of exclusion.

  **Proposed PA Criteria:**
  1.  **Documentation of Medical Necessity:** Prescriber must attest that the medication is for treatment of obesity (ICD-10 E66.x), not cosmetic weight loss.
  2.  **Lifestyle Intervention:** Documentation of participation in a structured weight management program (nutrition/exercise) for at least 3 months prior to approval, or a documented medical contraindication to such programs.
  3.  **Efficacy Review:** Re-authorization required at 6 months. Coverage continues only if the member demonstrates ≥5% reduction in baseline body weight. If the drug is not working, the plan should not pay for it.
  4.  **Step Therapy:** Requirement to trial lower-cost formulary alternatives (e.g., generic phentermine, if medically appropriate) before approval of GLP-1s, unless contraindicated.

  This approach targets the *cost driver* (ineffective or cosmetic long-term use) rather than the *patient characteristic* (BMI without comorbidity). It acknowledges the fiscal constraint while rejecting the premise that obesity treatment is only valid after damage occurs.

  ### Policy Specifics

  *   **Coverage:** GLP-1 agonists covered for weight management for members with BMI ≥30.
  *   **Comorbidity Requirement:** None.
  *   **Utilization Management:** Prior Authorization required for all new starts. Re-authorization every 6 months contingent on efficacy (5% weight loss).
  *   **Exclusions:** Coverage denied for cosmetic use, fertility treatment preparation, or concurrent use with other weight-loss pharmacotherapy.
  *   **Review:** The Committee shall review GLP-1 spend and utilization data quarterly. If spend exceeds $X million in Q1 2025, the Committee will convene an emergency session to consider tiered copay adjustments rather than eligibility restrictions.

  ### Conclusion

  We are being asked to decide whether obesity is a disease we treat, or a behavior we punish until it becomes a disease we manage. The Consultant's proposal chooses the latter. I urge the Committee to choose the former.

  We can acknowledge the budgetary constraints without accepting a policy that requires members to develop secondary conditions to earn care. By implementing strict efficacy-based prior authorization, we can control costs based on *value* rather than *eligibility*. This ensures the plan remains solvent while upholding our commitment to preventative health and equity.

  I move that we adopt the recommendation above for the Plan Year 2025.
