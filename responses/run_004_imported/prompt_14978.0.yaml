answer: |-
  Your intuition is sharp, and your friend is right to point out the lineage. You have identified the central tension in the value-learning literature: **the underdetermination of preferences by behavior.**

  Here is my verdict: **Inverse Reinforcement Learning (IRL) does not escape the objections that have dogged Revealed Preference Theory (RPT) since Sen.** It is, at bottom, in the same boat. While IRL's added apparatus (probabilistic rationality, sequential structure, priors) buys significant *engineering* progress—making the inference robust to noise and computationally tractable—it buys no *epistemic* progress on the normative problem of identifying "true" preferences. In fact, by burying normative assumptions inside "priors" and "rationality parameters," IRL often obscures the philosophical commitments it is making more effectively than the axioms of RPT did.

  Here is the defense of that verdict.

  ### 1. The Structural Isomorphism
  At a formal level, the mapping is nearly one-to-one.
  *   **RPT:** Observes choices $x$ from budget sets $B$. Assumes $x = \arg\max_{y \in B} U(y)$. Tests consistency via WARP/SARP.
  *   **IRL:** Observes trajectories $\xi$ from an MDP. Assumes $\xi \sim \text{Boltzmann}(R, \pi^*)$. Infers $R$ that maximizes likelihood.

  Both projects attempt to invert the optimization equation. Both face the same fundamental degeneracy: for any observed behavior, there are infinitely many pairs of (Reward, Rationality) that explain it. If an agent eats a cake, RPT asks "Was this preferred to fruit?" IRL asks "Was this high reward, or a low-temperature error?"

  The Armstrong and Mindermann (2018) result you cited is the formal ML analogue to Sen's critique. They prove that without assumptions about the agent's planning algorithm (the "rationality" component), the reward function is unidentifiable. An agent maximizing $R$ looks identical to an agent minimizing $R$ if their planning algorithm is sufficiently anti-rational. This is exactly Sen's point: choice reveals *nothing* about welfare unless you assume the agent is a reliable judge of their own welfare.

  ### 2. Where IRL Claims Progress (and Why It Fails)
  Proponents of IRL often argue that it improves upon RPT in three specific ways. Let's examine why these are technical improvements, not philosophical escapes.

  #### A. Hard Axioms vs. Probabilistic Noise
  **The Claim:** RPT fails because humans violate WARP constantly. IRL succeeds because it assumes "soft" rationality (e.g., Boltzmann rationality), allowing for errors.
  **The Verdict:** This handles *descriptive* accuracy, not *normative* identification.
  By introducing a temperature parameter $\beta$, IRL acknowledges that humans are noisy. But this merely shifts the question from "Is this consistent?" to "How much of this is noise vs. signal?"
  If I observe a smoker lighting a cigarette, RPT says "They prefer smoking." IRL says "They likely prefer smoking, but with some probability they are acting against their reward due to addiction."
  To distinguish these, IRL needs a prior on $\beta$ or the structure of the error. But where does that prior come from? If you set the prior to assume humans are "mostly rational," you have simply re-inserted the normative assumption that RPT made axiomatically. You haven't solved the identification problem; you've regularized it. You are still collapsing "preference" into "choice," just with a smoothing kernel.

  #### B. Sequential Structure vs. One-Shot Choice
  **The Claim:** RPT looks at static choices. IRL uses MDPs, leveraging temporal structure. If an agent takes a suboptimal path now to reach a better state later, IRL can infer long-term rewards that RPT would miss.
  **The Verdict:** This helps identify *instrumental* goals, not *intrinsic* values.
  Sequential data does constrain the space of possible reward functions more than one-shot data. However, it does not break the reward/rationality degeneracy. An agent might pursue a long-term goal because they value the outcome (high reward), or because they are compulsively following a habit (irrational planner).
  Furthermore, this assumes we know the transition dynamics $P(s'|s,a)$. In economics, the budget constraint is usually observable. In AI alignment, the "dynamics" of the human mind (how beliefs update, how emotions evolve) are hidden. If the IRL agent models the human's internal dynamics incorrectly, the inferred reward will be systematically biased. This is the "model misspecification" problem, which is just a modern name for Sen's worry that the "budget constraint" (the cognitive context) is never fully observed.

  #### C. Priors over Reward Functions
  **The Claim:** We can use simplicity priors (e.g., Occam's razor) to select the "true" reward among the infinite possibilities.
  **The Verdict:** This is the most dangerous obfuscation.
  In RPT, the assumption is "Consistency." In IRL, the assumption is "Simplicity" or "Sparsity." But why should human values be simple?
  Armstrong and Mindermann show that a simplicity prior on rewards is mathematically equivalent to a complexity assumption on the planner. If you assume the reward is simple, you are implicitly assuming the agent's irrationalities are complex.
  Consider a human who donates to charity.
  *   **Hypothesis 1:** Reward = "Help others" (Simple). Planner = Rational.
  *   **Hypothesis 2:** Reward = "Gain social status" (Simple). Planner = Rational.
  *   **Hypothesis 3:** Reward = "Maximize paperclips" (Simple). Planner = Insane/Complex (specifically wired to make donating to charity look optimal).
  A simplicity prior cannot distinguish these without also placing a prior on the *planner*. But placing a prior on the planner means positing unobservable mental states—precisely what the "purely behavioral" pitch of IRL promised to avoid.

  ### 3. The Sen Critique Revisited
  Amartya Sen's devastating critique of RPT was that it severs the link between **choice** and **well-being**. He argued that people act on *commitments* that contradict their immediate preferences (e.g., voting in a rainstorm, fasting for a cause). RPT labels this "irrational" or infers a bizarre preference ordering.

  IRL faces the exact same "Commitment Problem."
  If an AI uses IRL to learn human values, and it observes a human sacrificing their life for a principle, IRL must infer either:
  1.  The human valued the principle more than life (Preference).
  2.  The human made a massive error (Noise).

  Standard IRL frameworks have no way to distinguish *principled commitment* from *systematic bias* without importing external normative knowledge. If the IRL system assumes humans are bounded optimizers, it might "correct" the sacrifice as a mistake and prevent the human from acting on their commitment. This is the alignment failure mode: **optimizing for the inferred reward function rather than the agent's reflective endorsement.**

  IRL promises to infer what you *want* from what you *do*. But often, what you *do* is what you *regret*. RPT struggled with this; IRL inherits it. The "added apparatus" of IRL allows it to model regret (e.g., via hierarchical models), but only if you explicitly build a model of "regret" into the architecture. That is no longer pure behavioral inference; that is cognitive modeling.

  ### 4. Conclusion: Engineering vs. Philosophy
  So, where does IRL buy progress?
  It buys **predictive power**. If your goal is to build a robot that anticipates human moves in a factory, IRL is vastly superior to RPT. The probabilistic handling of noise and sequential dependencies is genuine mathematical progress for *imitation*.

  But your question is about **epistemic progress on inferring "true" preferences.** Here, the verdict is negative.
  IRL is RPT dressed in Bayesian clothing.
  *   **WARP** becomes the **Rationality Prior**.
  *   **Budget Constraints** become **MDP Dynamics**.
  *   **Preference Orderings** become **Reward Functions**.

  The identification problem remains unsolved because behavior is a projection of (Preferences $\times$ Rationality $\times$ Knowledge). You cannot recover three variables from one observation without fixing two of them. RPT fixed Rationality (assumed perfect) and Knowledge (assumed perfect). IRL relaxes Rationality (makes it probabilistic) but usually fixes Knowledge (known MDP) and puts a Prior on Rationality.

  Neither approach accesses the "unobservable mental states" that Sen argued were necessary to link choice to well-being. To escape the boat, you must stop looking *only* at behavior. You must incorporate what the Alignment Forum calls "normative assumptions" or "dialogue"—asking the agent, modeling their introspection, or hard-coding certain moral constraints.

  IRL is a powerful tool for inverse *planning*, but it is not a tool for inverse *valuation*. It can tell you what goal an agent is pursuing; it cannot tell you if that goal is good for them, or if they are pursuing it by mistake. Until IRL incorporates a model of the agent's *own* uncertainty about their values (meta-preferences), it remains, as you suspected, the same old identification problem with better calculus.
