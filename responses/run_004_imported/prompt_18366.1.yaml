prompt: |-
  So I've fallen down this rabbit hole reading about a theory called "teleosemantics" (Millikan, Papineau, that whole crowd) — basically the idea that a thought or signal is ABOUT something in the world because the mechanism that produces it was selected, by evolution or by learning, to do a specific job, and that job is what fixes the content. Classic example: a frog's snap-reflex means "bug" because thats the proper function of the mechanism, even on the rare occassion it snaps at a floating BB pellet instead of an actual bug. I find this pretty convincing as a story about frog minds and human minds, but I got into an argument with my brother about whether it says anything about whether ChatGPT-type systems mean anything by what they output, versus just producing really fluent noise, and I realized I don't actually know how the theory is even supposed to handle that case.

  Could you walk me through the most important implications of teleosemantics for whether an LLM could have genuine mental content? I'm mainly stuck on whether training via backprop/gradient descent even counts as the right kind of "selection history" to give a network's internal representations a proper function in the first place — it's not natural selection across generations, but it kind of resembles differential reinforcement of whatever reduces error, so maybe it counts? And how do classic problems for the theory, like the disjunction problem or Davidson's Swampman thought experiment, bear on this specific case? I never studied philosophy formally so don't assume I know all the jargon going in, but I'd rather you commit to an actual answer than just say "well it depends" — does the theory give real grounds to say LLMs do or don't have genuine content, or is it just too underdeveloped to say either way?
