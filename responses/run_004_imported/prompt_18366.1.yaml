  2.  **Deconstruct Teleosemantics:**
      *   *Core Idea:* Content is fixed by *proper function*. Proper function is fixed by *selection history* (evolution or learning).
      *   *Key Mechanism:* A state $S$ represents $X$ if the mechanism producing $S$ was selected because it correlated with $X$ and led to success (survival/reward).
      *   *The Frog Example:* Snap mechanism selected for catching flies. Snaps at BBs = error (misrepresentation), not a new meaning "fly-or-BB".

  3.  **Apply to LLMs (The Crucial Step):**
      *   *Selection History:* LLMs undergo training. Is this selection?
