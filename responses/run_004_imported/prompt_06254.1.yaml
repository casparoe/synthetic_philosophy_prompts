answer: |-
  **Title:** The Myth of Equality: Moral Liability and the Ethics of Combat in Just War Theory

  **Introduction**

  The central tension of Just War Theory lies in the relationship between the reasons for fighting and the actions taken during the fight. For decades, the dominant framework, articulated most famously by Michael Walzer in *Just and Unjust Wars*, has relied on the "moral equality of combatants." This doctrine posits that soldiers on both sides of a conflict possess an equal right to kill one another, provided they adhere to the rules of engagement (*jus in bello*), regardless of whether their nation's cause is just (*jus ad bellum*). However, this traditional view has faced a rigorous philosophical challenge from Jeff McMahan's "revisionist" account, which argues that moral liability in war is grounded in individual responsibility for unjust threats. This essay evaluates the dispute between Walzer's traditionalism and McMahan's revisionism. While Walzer's defense of moral equality relies on compelling pragmatic considerations regarding reciprocity and the epistemic limitations of soldiers, it ultimately fails as a coherent moral doctrine. By utilizing the distinction between justification and excuse, McMahan demonstrates that moral equality is a useful legal fiction but a moral falsehood. Therefore, while Walzer's framework may remain necessary for international law, McMahan's revisionism offers the only defensible account of individual morality in war.

  **The Traditionalist Defense: Walzer and the War Convention**

  Michael Walzer's defense of the moral equality of combatants rests on a structural separation between the state and the individual. In Walzer's view, war is a duel between states, not between private individuals. Consequently, the justice of the war is a matter for political leaders, while the conduct of the war is the responsibility of the soldiers. This separation allows for the "moral equality of combatants": a soldier fighting an aggressive war is as permitted to kill enemy combatants as a soldier fighting in self-defense, and both are equally legitimate targets.

  Walzer offers three primary arguments to support this moral equality, moving beyond mere legal convention. First, he points to the **epistemic limitations** of the soldier. Ordinary combatants rarely have access to the intelligence, diplomatic cables, or historical context required to judge the justice of their nation's cause. In the "fog of war," compounded by state propaganda and secrecy, it is unreasonable to demand that a conscript determine the moral validity of the war before laying down their life. To deny them the right to fight based on a *jus ad bellum* violation they cannot verify is to hold them responsible for crimes they could not reasonably identify.

  Second, Walzer emphasizes the element of **coercion**. Soldiers, particularly conscripts, do not choose to enter the state of war. They are instruments of the state, threatened with imprisonment or execution if they refuse to fight. Because they lack agency in the decision to go to war, they should not bear the moral burden of its injustice.

  Finally, and perhaps most significantly, Walzer argues from **reciprocity**. The laws of war function as a mutual agreement to limit violence. If the rules dictated that only "just" combatants had the right to kill, "unjust" combatants would have no incentive to follow the rules of engagement (*jus in bello*). Knowing they are already deemed criminals, they would fight with greater brutality, making wars more sanguinary and harder to end. Thus, moral equality is a humanitarian device; it grants unjust combatants a stake in the rules of war, thereby protecting civilians and prisoners on both sides. For Walzer, this pragmatic benefit imbues the doctrine with moral weight, transforming it from a mere legal technicality into a moral necessity.

  **The Revisionist Critique: McMahan and Individual Liability**

  Jeff McMahan challenges Walzer's framework by rejecting the separation of *jus ad bellum* and *jus in bello*. McMahan argues that the ethics of killing in war should not differ fundamentally from the ethics of killing in ordinary life. In domestic society, one does not have the right to kill a police officer simply because the officer is acting on behalf of a state; the right to kill depends on whether the target is morally liable to be attacked.

  McMahan's core thesis is that **liability to attack** is derived from moral responsibility for an unjustified threat. A soldier fighting in self-defense (a "just combatant") poses a threat that is justified; therefore, they are not liable to be killed. A soldier fighting an aggressive war (an "unjust combatant") poses a threat that is unjustified; therefore, they are liable to be killed. This collapses the moral equality of combatants. On this view, unjust combatants generally lack the right to kill just combatants because they are essentially aggressors, while just combatants are defenders. Two people cannot simultaneously be morally permitted to kill each other in a vacuum; if one is defending a rightful claim, the other is violating it.

  McMahan addresses Walzer's epistemic and coercive arguments not by denying them, but by reclassifying them. He acknowledges that many unjust combatants are not evil people. However, he insists that being a "good person" is not the same as acting permissibly. This leads to McMahan's most potent philosophical tool: the distinction between **justification and excuse**.

  **The Crucial Distinction: Justification vs. Excuse**

  The pivot point of this debate lies in how we categorize the actions of the unjust soldier who is ignorant or coerced. Walzer treats these factors as making the soldier's killing *permissible* (justified). McMahan argues they merely make the soldier *blameless* (excused).

  To be **justified** is to act rightly; the act itself is morally permissible. To be **excused** is to act wrongly, but under circumstances where the agent is not morally culpable for the wrong. McMahan argues that an unjust combatant may be excused due to epistemic limitations (they didn't know the war was unjust) or duress (they were forced to fight). In such cases, we should not punish them as war criminals. However, their actions remain objectively unjustified. They do not have a *right* to kill the just combatant; rather, they are forgiven for doing so because they could not reasonably have done otherwise.

  This distinction dismantles Walzer's claim that moral equality is a moral truth. Walzer conflates "not blameworthy" with "morally permitted." McMahan shows that we can maintain the humanitarian intuition that we shouldn't punish confused or coerced soldiers (they are excused) without accepting the moral falsehood that they have an equal right to kill (they are not justified). This allows McMahan to retain the moral high ground: the just combatant is truly permitted to fight, while the unjust combatant is merely liable to be stopped, even if we choose not to blame them personally.

  **Evaluating the Pragmatic Objection**

  The strongest counter-argument to McMahan, often voiced by Walzer's defenders (and your friend), is pragmatic: even if McMahan is philosophically correct, adopting his view would make war worse. If unjust combatants believe they are "illegitimate," they may abandon the laws of war, leading to greater atrocities. Therefore, isn't Walzer's "fiction" morally superior because it saves lives?

  While this is a compelling argument for *policy*, it does not save Walzer's position as a *moral doctrine*. A moral theory seeks to describe what is right and wrong, not necessarily what is most expedient to enforce. If the moral equality of combatants is indeed a lie—meaning unjust soldiers truly do not have the right to kill—then basing our ethics on that lie is intellectually dishonest, even if the lie is useful.

  Furthermore, McMahan's framework does not necessarily lead to the brutalization Walzer fears. Because McMahan accepts the justification/excuse distinction, international law could still treat combatants equally (as Walzer wants) for pragmatic reasons, while acknowledging that, deep down, the morality is asymmetrical. We can teach soldiers to follow the laws of war without teaching them that their cause is morally equivalent to the enemy's. The pragmatic benefits of reciprocity belong to the realm of international law and strategy, not fundamental morality. To claim that a falsehood is "morally defensible" simply because it has good consequences is to conflate utilitarian policy with deontological ethics. As a matter of genuine moral doctrine, the truth of liability cannot be sacrificed for the convenience of symmetry.

  **Verdict: Moral Fiction vs. Moral Truth**

  The dispute between Walzer and McMahan ultimately turns on what we demand from a moral theory. If we demand a framework that aligns perfectly with international law and minimizes immediate brutality through mutual recognition, Walzer offers a robust system. His reliance on epistemic limitations and reciprocity explains *why* we treat soldiers equally and *why* we should continue to do so in legal statutes.

  However, the prompt asks whether the moral equality of combatants is defensible as a **genuine moral doctrine**. On this specific criterion, Walzer fails. A moral doctrine must account for the fundamental asymmetry of aggression and defense. It is logically incoherent to claim that a person defending their home from an invader and the invader themselves possess an equal moral right to kill one another. McMahan successfully demonstrates that the traditional view collapses when scrutinized through the lens of individual responsibility.

  By deploying the justification/excuse distinction, McMahan resolves the tension that traps Walzer. He allows us to say that an unjust soldier is not a monster (they are excused due to ignorance or coercion) without saying their killing is right (they are not justified). This preserves our moral intuitions about blame while correcting our understanding of liability. Walzer's position, by contrast, requires us to accept that morality stops at the border of the uniform, granting soldiers a "license to kill" that they would not possess in any other context, simply because the state ordered it.

  **Conclusion**

  In conclusion, while Michael Walzer's defense of the moral equality of combatants provides an indispensable foundation for the laws of war, it cannot withstand scrutiny as a genuine moral doctrine. His arguments regarding reciprocity and epistemic limitations explain why we *codify* equality, but they do not prove that equality *exists* morally. Jeff McMahan's revisionist account, grounded in the principles of self-defense and liability, offers a superior moral framework. It correctly identifies that the right to kill in war is contingent on the justice of the cause, while using the distinction between justification and excuse to protect individual soldiers from undue blame. Therefore, the moral equality of combatants must be understood as a necessary legal fiction—a pragmatic tool to regulate violence—rather than a reflection of moral truth. For the purpose of ethical inquiry, McMahan is right: in the eyes of morality, not all combatants are equal.

  ***

