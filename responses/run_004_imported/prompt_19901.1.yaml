answer: |-
  **Scenario:** A digital forensics analyst verifies the integrity of 500 evidence files from a hard drive. For each file $i$, she runs a cryptographic hash check against a trusted baseline and records the proposition $P_i$: "File $i$ is unaltered." Each check returns a deterministic match. However, in her report's methodology section, she adds a disclaimer: "Given the complexity of this volume of data and known rates of human operator error in logging hash results, it is highly probable that at least one verification was mishandled."

  **Classification:** This instantiates the **Preface Paradox**.

  **Analysis of Blocking Feature:** The feature blocking redescription as a Lottery case is the **locus of the statistical uncertainty**. In the Lottery paradox, the statistical evidence applies at the *object level*: the probability attaches directly to the truth of each $P_i$ (e.g., "Ticket $n$ loses" is true *because* of the odds). In this forensics case, the evidence for each $P_i$ is non-statistical and deterministic (the hash match); the statistical/inductive element applies only at the *meta-level* regarding the reliability of the verification process. To redescribe this as a Lottery case, one would have to claim the belief that "File $i$ is unaltered" rests on base rates of file integrity rather than the specific hash check, which contradicts the stipulated professional practice. Conversely, to redescribe the Lottery as a Preface case, one would need to identify specific, non-statistical justification for why Ticket $n$ will lose, which the fair draw explicitly precludes. Thus, the structures remain distinct: the Lottery turns on statistical support for individual conjuncts, while the Preface turns on non-statistical support for individuals coupled with inductive doubt about the conjunction.
