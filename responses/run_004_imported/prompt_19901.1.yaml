      *   **Context:** Reading group discussing Lottery vs. Preface paradoxes.
      *   **Core Issue:** The user senses a disanalogy: Lottery = statistical evidence for individual propositions (ticket $n$ loses); Preface = non-statistical/inductive evidence for the negation of the conjunction (book has an error), with individual claims based on specific justification.
