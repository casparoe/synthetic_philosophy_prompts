          *   Scenario: Randomized Drug Testing in a Sports League.
          *   Propositions: "Athlete $i$ is clean."
          *   Evidence: Statistical base rates? No, that's weak.
          *   Let's stick to the user's intuition: They think the *source* of uncertainty differs.
          *   Lottery: Uncertainty in the *individual* claims (statistical). Certainty in the *conjunction's falsity* (logical).
          *   Preface: Certainty (or high justification) in the *individual* claims (evidential). Uncertainty in the *conjunction* (inductive).

      *   *Idea 6: The "Audit" Scenario.*
          *   An auditor checks 1000 transactions.
          *   **Preface version:** Each transaction looks valid upon inspection (receipts match). But the auditor knows 5% of audits usually find *something* wrong somewhere.
