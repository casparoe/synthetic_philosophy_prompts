      *   **Preface Paradox (Makinson):**
          *   Structure: $P_1, P_2, ..., P_n$ (Claim $i$ in the book is true).
          *   Evidence for each $P_i$: Specific, non-statistical justification (research, argumentation).
          *   Evidence for $\neg(P_1 \land ... \land P_n)$: Inductive/Historical (authors make mistakes, humility).
