answer: |-
  The hearth was dying, the embers collapsing into a dull, red eye that blinked slowly in the draft. Elara held the next log in her lap, feeling its weight, its rough bark biting into her palms. She wanted to say the heat was the wood, that the warmth on her face was simply the timber releasing what it had stored, but that wasn't right. If the heat were the wood, the log would never change, yet here it was, blackening, splitting, becoming something else. But if the heat were separate from the wood, something distinct that came to visit it, then the fire should be able to hover without fuel, a ghost flame wandering the room. It couldn't. The heat was not the wood, but there was no heat without the wood.

  She looked toward the shrouded form in the other room, her husband still as the unlit kindling. She tried to find him in the grief tightening her chest, but the logic held firm. If the grief were her, she would be consumed entirely, leaving no one to feel the loss; yet she was still here, watching the embers. If the grief were separate from her, an object she could set down like the log, she would have put it aside hours ago. She didn't possess the grief, and the grief didn't possess her. They were meeting here, in the cold air of the kitchen, dependent on each other to exist. To say she was suffering was too solid; to say she was not suffering was a lie.

  The fire flickered, starving. She understood now that the flame was not a thing, but an event. It was a verb masquerading as a noun. It existed only in the giving over of the wood to the ash, in the specific, momentary friction of combustion. Her husband was not the body in the bedroom, and he was not the memory in her head. He was the living of it, the burning that had happened. To look for him now in either the remains or the recollection was to look for fire in the ash heap after the smoke had cleared. He was empty of a self that could stay, just as the fire was empty of a substance that could remain fixed.

  This did not mean the cold was an illusion. The draft still slipped under the door; her skin still prickled with gooseflesh. Because the fire had no inherent nature, it could change; because it was dependent, it required care. If the flame were truly independent, it wouldn't need her hand. If it were nothing at all, her hand wouldn't matter. But the dependence was real. The requirement for fuel was absolute. The emptiness of the fire did not absolve her of the task; it mandated it.

  Elara leaned forward and slid the log into the grate. She did not do it to preserve the fire forever, knowing now that nothing held itself together long enough for that. She did it because the burning was happening, and this was what the burning required. The wood caught with a sharp crack, sending a new tongue of orange light up the chimney. She warmed her hands over the new heat, not hers, not the wood's, but arising between them, sufficient for the night.
