answer: |-
  This is a profound problem for a novelist to grapple with, because it mirrors the central tension of character development: how can a person be the "same" when every observable trait has changed? You have stumbled upon the exact puzzle that motivated David Lewis to formulate the **Problem of Temporary Intrinsics**, which remains the central battleground in the metaphysics of persistence.

  Here is the comparison of the two views, their specific replies to the problem, the costs they incur, and my committed verdict on which is more defensible.

  ### The Contenders

  **Endurantism (3D-ism):**
  Your protagonist is a three-dimensional object that persists through time by being **wholly present** at every moment of their existence. The infant in Chapter 1 is numerically identical to the elder in Chapter 90. There is only one "you," fully existing at $t_1$ and fully existing at $t_2$.

  **Perdurantism (4D-ism):**
  Your protagonist is a four-dimensional "spacetime worm." They persist by having **temporal parts** at every moment. The infant is a temporal part of the worm; the elder is a different temporal part of the worm. Neither part is the *whole* person; the whole person is the aggregate of all these stages from birth to death.

  ### The Problem of Temporary Intrinsics

  The puzzle is logical. Let us say your protagonist is **bent** (hunched over) in old age and **straight** (upright) in youth.
  1.  In youth, the protagonist has the intrinsic property: *Straightness*.
  2.  In old age, the protagonist has the intrinsic property: *Bentness*.
  3.  If Endurantism is true, the person in youth is strictly identical to the person in old age.
  4.  Therefore, the same entity possesses *Straightness* and *Bentness*.
  5.  Since these are incompatible intrinsic properties, this violates the Law of Non-Contradiction.

  How do the two sides escape this contradiction?

  ---

  ### 1. The Perdurantist Reply: Temporal Parts

  **The Solution:**
  Perdurantism dissolves the contradiction by denying premise #3. The entity that is *Straight* is not identical to the entity that is *Bent*. The "person" is the sum of both. Just as a road can be straight in the valley and curved over the hill without contradiction (because different *spatial* parts have different shapes), a person can be straight in youth and bent in age without contradiction (because different *temporal* parts have different shapes).

  The property is borne by the *stage*, not the whole worm. The whole worm does not change; it simply contains variation along its temporal axis.

  **The Cost:**
  The ontological cost is high. It requires us to accept that you are not a unified substance but a collection of time-slices. This creates friction with our phenomenological experience of consciousness. When you think "I am in pain," you feel like a whole subject experiencing it, not a single temporal slice of a larger worm. It also complicates moral responsibility: if the "elder slice" commits a crime, why punish the "worm" that includes the innocent "infant slice"?

  ### 2. The Endurantist Reply: Adverbialism (or Time-Indexing)

  **The Solution:**
  Endurantism must deny that *Straightness* and *Bentness* are simple, monadic intrinsic properties. The strongest defense here is **Adverbialism** (or relationalism). It argues that objects do not instantiate properties *simpliciter*; they instantiate them *at-a-time*.

  The protagonist does not have the property *Bent*. They have the property *Bent-at-$t_2$*. The protagonist does not have the property *Straight*. They have the property *Straight-at-$t_1$*. Since *Bent-at-$t_2$* and *Straight-at-$t_1$* are not logically incompatible (just as "tall for a jockey" and "short for a basketball player" are not incompatible), there is no contradiction. The change is real, but the properties are implicitly relational to time.

  **The Cost:**
  The cost here is the loss of true intrinsicality. Lewis's main critique is that shape is paradigmatically intrinsic. If being "bent" always requires a relation to a time, then shape is not really about the object itself, but about the object's relationship to a moment. This makes change less of an internal alteration and more of a shifting set of external relations. It risks making the "self" a bare substratum that holds these relations but has no intrinsic nature of its own.

  ---

  ### The Verdict

  You asked me to commit. While Endurantism aligns better with our common-sense intuition of a unified self (which is tempting for a novelist), **Perdurantism offers the more defensible reply to the Problem of Temporary Intrinsics.**

  Here is why: **It preserves the integrity of properties.**

  The Endurantist solution saves the object (the single self) by sacrificing the nature of the properties (making intrinsics into relations). The Perdurantist solution saves the nature of the properties (shapes are truly intrinsic) by complicating the object (making the self a composite).

  In metaphysics, it is more defensible to adjust our ontology of objects than to deny the logical nature of properties. If we accept the Endurantist view, we must accept that *nothing* truly has an intrinsic property unless it exists outside of time. This renders the concept of "intrinsic" nearly vacuous for physical beings. Perdurantism, by contrast, allows properties to remain genuine features of reality while explaining change as variation across parts. It treats time with the same geometric seriousness as space, which aligns better with our best physical theories (specifically Special Relativity).

  Therefore, Perdurantism wins on logical consistency and compatibility with physics, even if it feels colder to our emotional intuition.

  ### A Note for Your Novel

  While Perdurantism is the metaphysically stronger position, it may be the wrong tool for your narrative engine.

  If you write from a **Perdurantist** perspective, your narrator might view the protagonist's life as a completed shape, a static sculpture where the "end" exists just as much as the "beginning." This creates a sense of fatalism or archival distance.

  If you write from an **Endurantist** perspective, you validate the character's subjective experience of *becoming*. Even if metaphysically shaky, the *feeling* of being a whole person who changes is the bedrock of psychological realism.

  **My advice:** Use Perdurantism to structure the plot (understanding that the end is implicit in the beginning), but write the prose with Endurantist empathy (allowing the character to feel like a unified soul enduring through the pain of change). The tension between these two views is, itself, a fertile ground for literary theme.
