prompt: |-
  My great-aunt Rosalind died three weeks ago at ninety-four, and I have somehow ended up writing her eulogy for the memorial this coming weekend, mostly because I am the family member whose job involves producing coherent sentences on a deadline, even though mine are usually in Python rather than English. Rosalind spent almost fifty years on the council of a small local psychical research society that explicitly modeled itself on the original Society for Psychical Research in London, and she kept a biography of Henry Sidgwick, that society's first president, on her nightstand for as long as anyone in the family can remember. Her standard explanation for admiring him so much, as best my mother can reconstruct it, went something like this: Sidgwick had ended his major work on ethics admitting he could not actually prove that reason requires a person to be moral rather than simply self-interested, and had suggested that only a genuinely moral universe -- one in which the two ultimately coincided, perhaps through some form of survival after death -- could close that gap; and rather than either assuming this was true or dismissing the whole question, he had spent much of his later career trying, empirically and rather unglamorously, to find out. Rosalind apparently regarded her own decades of sitting in on mediums and reviewing case notes, taken up not long after the man she had planned to marry died young, as continuing exactly that project, and by everyone's account she remained, like Sidgwick himself, unconvinced and essentially agnostic right up to the end, despite wanting very badly for the evidence to come out the other way.

  The memorial audience is going to split awkwardly down the middle: a dozen or so of Rosalind's fellow researchers, who will notice immediately if I turn her into either a secret spiritualist or a tidy debunker, and several dozen relatives who have never heard of Sidgwick and mainly want to be told that she is "at peace" and perhaps reunited with her fiancé. I don't want to hand either group a version of her she would not recognize. Could you write the eulogy for me? I would like it to take her actual, uncomfortable intellectual position seriously enough to build the whole speech around it, rather than resolving it into the kind of easy consolation she spent her entire adult life declining to accept without evidence.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Great-aunt Rosalind, died at 94, three weeks ago.
      *   **Speaker:** Great-niece/nephew (implied), a programmer (writes in Python), tasked with writing the eulogy due to writing skills.
      *   **Key Subject Matter:** Rosalind spent 50 years on a local psychical research society council (modeled on the SPR, London). She kept a biography of Henry Sidgwick on her nightstand.
      *   **Sidgwick Connection:** Sidgwick couldn't prove reason requires morality over self-interest without a moral universe (afterlife). He spent his later career empirically investigating this. Rosalind saw her work (mediums, case notes) as continuing this project.
      *   **Rosalind's Stance:** Unconvinced, essentially agnostic until the end, despite *wanting* the evidence to support survival (especially after her fiancé died young). She refused easy answers without evidence.
      *   **Audience:** Split 50/50.
          *   Group A: Fellow researchers (know the SPR, Sidgwick, the nuance). Will spot falsification (spiritualist vs. debunker).
          *   Group B: Relatives (want comfort, "at peace," reunited with fiancé). Don't know Sidgwick.
      *   **Goal:** Write a eulogy that honors her *actual* intellectual position (the uncomfortable agnosticism) without alienating the family or betraying her integrity to the researchers. Do not resolve the tension into easy consolation.

  2.  **Determine the Tone and Theme:**
      *   **Tone:** Respectful, honest, intellectual but accessible, warm but unflinching.
      *   **Theme:** The courage of uncertainty. The integrity of asking hard questions without demanding easy answers. Love as a motivation for truth, not just comfort.
      *   **Metaphor:** The "gap" (Sidgwick's gap between reason and morality/self-interest). The "work" (the empirical search). The "waiting" (not passive, but active).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the task. Introduce the speaker (subtly hint at the "code" background if it fits, maybe as a metaphor for structure/logic). Acknowledge Rosalind's age and presence.
      *   **The Core Conflict (Sidgwick & The Society):** Need to explain her passion without getting too bogged down in philosophy. Frame it as a search for *truth* rather than just "ghosts." Mention Sidgwick but explain *why* he mattered (the ethical gap).
      *   **The Personal Stake:** Her fiancé. This is crucial for the family's emotional connection. She didn't look for evidence just for science; she looked because she lost someone. But she didn't fake the result.
      *   **Addressing the Split Audience:**
          *   To the researchers: Acknowledge her rigor. She wasn't a believer or a skeptic; she was an investigator.
          *   To the family: Acknowledge their desire for comfort. Reframe "peace" not as "knowing the answer" but as "being okay with the question."
      *   **The Conclusion:** Bring it back to love and integrity. She lived honestly. That is her legacy.

  4.  **Navigating the Pitfalls:**
      *   *Pitfall 1: Too technical.* Don't lecture on Utilitarianism or the specific methods of the SPR. Keep it about the *human* drive behind it.
      *   *Pitfall 2: Too cold.* Don't make her sound like a robot. Emphasize her *wanting* to believe. The tension is between desire and duty to truth.
      *   *Pitfall 3: Offending the family.* If I say "She didn't believe she'd see her fiancé again," that hurts. If I say "She knew she would," that lies.
      *   *Solution:* Focus on the *quality* of her hope. She held space for the possibility without claiming the certainty. "At peace" can mean "at peace with uncertainty."

  5.  **Refining the Voice:**
      *   The prompt mentions the writer codes in Python. I should subtly weave in a sensibility of logic or structure, but keep it natural. Maybe the idea of "unresolved variables" or "open loops."
      *   Actually, better to keep the voice dignified. The "Python" detail is context for *why* the speaker was chosen, not necessarily the voice of the eulogy itself, though a touch of "seeking the true output" might work. Let's stick to a warm, thoughtful human voice.

  6.  **Drafting - Key Phrases to Include/Adapt:**
      *   "The gap between what we want to be true and what we can prove."
      *   "Sidgwick's question."
      *   "Fifty years of case notes."
      *   "Unconvinced but not indifferent."
      *   "Reunited?" -> "Held in the same love."

  7.  **Review against Constraints:**
      *   *Did I make her a spiritualist?* No, emphasized her agnosticism.
      *   *Did I make her a debunker?* No, emphasized her openness and desire for evidence.
      *   *Did I comfort the family?* Yes, by framing her integrity as a virtue and her love as enduring.
      *   *Did I respect the researchers?* Yes, by accurately portraying the Sidgwickian mission.

  8.  **Final Polish:** Check the rhythm. Ensure the transition from the philosophical to the personal is smooth. Make sure the ending lands emotionally without lying. (Self-Correction: Make sure not to use the word "Python" in the speech, it's too meta. Keep the logic metaphorical.)

      *   *Idea:* Use the concept of "holding the tension." That's a strong image.
      *   *Idea:* Address the "at peace" expectation directly but redefine it.

  9.  **Final Output Generation:** (Proceeding to write the eulogy based on these thoughts.)
answer: |-
  Friends, family, colleagues, and members of the Society.

  Thank you for being here to remember Rosalind. I was asked to speak today, I suspect, because my profession requires me to take complex, messy inputs and produce coherent outputs on a deadline. But as I sat down to write this, I realized that Rosalind's life was not about resolving complexity into something tidy. It was about the courage to live inside the complexity.

  To many of you in the family, Rosalind was simply Aunt Rose. She was the woman who made excellent tea, who remembered birthdays, and who listened more than she spoke. To others in this room, she was a steadfast colleague, a keeper of case notes, and a guardian of a very specific, very difficult tradition of inquiry.

  Reconciling those two views is the only way to honor her truthfully.

  For nearly fifty years, Rosalind dedicated her intellectual life to the question of survival. She kept a biography of Henry Sidgwick on her nightstand not because she was a devotee of a dead philosopher, but because she was a devotee of his honesty. Sidgwick, as some of you know, reached a terrifying point in his study of ethics. He realized that reason alone could not prove that being a moral person was rational, unless the universe itself was structured to reward morality—unless, essentially, there was something beyond this life to balance the scales.

  He didn't assume that was true. He didn't pray that it was true. He went out and looked for the evidence.

  Rosalind took up that same burden. After the death of the man she intended to marry, a loss that shattered her young adulthood, she could have turned to faith for comfort. She could have turned to skepticism for protection. Instead, she turned to the data. She sat in on séances. She reviewed transcripts. She examined the edges of human experience with a rigor that would have been exhausting for someone with less fortitude.

  I know that for many of us here, the comfort of a memorial lies in certainty. We want to say that she is "at peace." We want to say she is "reunited." And I understand why. We love her, and we miss her, and the gap she has left feels like a wound that needs closing.

  But Rosalind spent a lifetime teaching us that some gaps are not meant to be closed prematurely.

  She wanted to believe. I want you to know that. She hoped, with a deep and aching human desire, that the consciousness of the people she loved persisted beyond death. She wanted the evidence to come out the other way. But she valued the truth more than she valued her own comfort. She remained, to the end, essentially agnostic. She did not claim to know what she could not verify.

  To her colleagues in the Society: She was one of you. She never pretended to have answers she didn't possess. She understood that the integrity of the search matters more than the satisfaction of the result.

  To her family: She loved you. And the way she loved you was by refusing to offer you lies, even comfortable ones. She did not believe that "peace" comes from pretending we know the unknowable. She believed that peace comes from facing the mystery with open eyes and a clear mind.

  There is a specific kind of integrity in standing at the edge of the dark and admitting you cannot see what is on the other side, yet refusing to turn away. That was Rosalind. She lived in the question.

  So, I will not tell you today that she has found the proof she sought. I will not tell you that she knows, now, what she could not confirm while she was here. But I will say this: If there is a moral order to the universe, if there is a place where reason and love finally coincide, as Sidgwick hoped and as Rosalind investigated, then a woman of her honesty, her loyalty, and her fierce commitment to truth would surely have a place there.

  And if there is not, then she has left something behind that is just as enduring. She has left us a model of how to grieve without delusion, and how to hope without surrender.

  She did not solve the mystery. But she kept the light on while she looked for it. And that is enough.

  Thank you.
