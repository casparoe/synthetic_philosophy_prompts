  3.  **Evaluate the "Market Value vs. Authorship" Distinction:**
      *   Mara is conflating *value* with *authorship*. Just because a posthumous print sells for less doesn't mean it isn't a print of the original artist's work. It means it lacks *provenance* and *historical scarcity*.
