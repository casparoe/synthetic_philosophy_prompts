answer: |-
  "It's freezing," Elena said, wrapping both hands around her mug. The steam was still visible, but barely. "I know I feel cold. And obviously, I know that I know it."

  Marcus leaned back in the wicker chair, watching the sunrise burn off the mist over the lawn. "Obviously? That's the KK principle. If you know *p*, you're in a position to know that you know *p*. But look at the sun. It's going to get warmer. Slowly."

  "So? My current state is luminous, Marcus. I have immediate access to my phenomenal state. Nothing external changes the fact that I'm currently aware of this chill."

  "Access isn't knowledge," Marcus said. "Knowledge requires safety. To know you feel cold, you couldn't easily be wrong. But imagine the next ten minutes. The temperature rises imperceptibly. At 10:00, you feel cold. At 10:01, the difference is negligible. You can't tell the difference."

  "I don't need to tell the difference between minutes. I just need to know *now*."

  "But if you claim to know *now*, based on this feeling, you're committing to a margin for error," Marcus countered. "If you know you're cold at time *t*, you must be in a position to know you're cold at *t+1*, because the situations are subjectively indistinguishable. If you can't know it at *t+1*—because eventually, you'll be warm—then you can't know it at *t* either. You're stuck on a slippery slope."

  Elena took a sip of coffee. It was lukewarm. "That's just a sorites paradox. You're treating knowledge like a heap of sand. But my justification isn't inductive. I'm not guessing based on past trends. I'm attending to my experience. The fact that the experience will fade doesn't mean I'm ignorant of it while it's here."

  "But are you *safe*?" Marcus pressed. "Suppose you're in a borderline case. You're almost not cold. You believe you are. In a nearby possible world, the air is a fraction warmer, you don't feel cold, but you believe you do because you can't tell the difference. In that world, you're wrong. Since that world is nearby, your belief in this world isn't safe. If it isn't safe, it isn't knowledge. If you don't know, you can't know that you know."

  Elena set the mug down. "You're conflating the reliability of the *boundary* with the luminosity of the *center*. KK doesn't claim I know where the boundary lies. It claims that when I am clearly in the state, I know it. I'm clearly cold now. The fact that I won't know *when* I stop being cold doesn't strip me of knowledge while I am."

  "But how do you know you're in the center?" Marcus asked. "To know you know, you need to know you're not on the edge. If luminosity fails at the boundary—and Williamson shows it must, because knowledge requires a margin for error—then you can never be sure you're not at the boundary. Your internal perspective is the same at the center as it is one step from the edge. So your internal access can't guarantee knowledge."

  "My internal perspective gives me justification," Elena insisted. "External safety conditions might limit whether I satisfy some robust definition of knowledge, but they don't negate my epistemic position. I am in a position to know. Whether I form the second-order belief is irrelevant."

  "Being 'in a position' requires that nothing external blocks you," Marcus said. "But the external fact—that the world changes gradually—blocks you. It means your belief couldn't reliably track the truth across the continuum. You're trying to keep KK by retreating into your head, but knowledge reaches out. It touches the world. And the world is fuzzy."

  The sun broke fully over the trees. The shadow of the porch railing no longer touched Elena's feet.

  "I feel less cold," Elena admitted.

  "Did you know it was happening?"

  "No."

  "Then you weren't luminous to the change. And if you don't know when the state ends, you can't be certain you're in it now." Marcus picked up his own mug. The coffee was cold. "See? Even the coffee isn't luminous. You didn't know it went cold until you tasted it."

  Elena pulled her cardigan tighter. "I still know I'm chilly now."

  "Maybe," Marcus smiled. "But do you know that you know? Or do you just hope you're not on the edge?"

  Elena looked at her hands. "I know I'm not convinced by you."

  "Good," Marcus said. "At least that's luminous."
