answer: |-
  Your intuition is correct, and your simulation is telling you the truth. Your friend is also mathematically correct about the Expected Value (EV), but he is applying the wrong *type* of average to a problem that evolves over time.

  This is one of the most profound misunderstandings in probability and economics. It touches on a debate that has raged for decades, recently revitalized by physicists like Ole Peters. The short answer is: **Your friend is right that betting 100% is irrational, and he is right that it's not just about "risk tolerance."** However, the reason isn't that Expected Value is "wrong," but that it answers a different question than the one you are actually asking.

  Here is the breakdown of why EV fails here, what replaces it, and whether your friend's claim of "objectivity" holds water.

  ### 1. The Trap: Ensemble Average vs. Time Average

  The core confusion lies in what we mean by "Expectation." In standard probability theory, Expected Value is an **ensemble average**.

  Imagine 1 million people walk into a casino. Each plays the game once, betting their entire bankroll.
  *   700,000 people double their money.
  *   300,000 people go to zero.
  *   The *average* wealth across the group is huge (1.4x the starting bankroll).

  If you are a social planner looking at the welfare of that entire group, maximizing EV makes sense. You don't care that 30% of the people are ruined, because the 70% who won have enough surplus to compensate them (in theory).

  But you are not 1 million people playing once. **You are one person playing 100 times.** This is a **time average**.

  In a time sequence, outcomes compound. If you bet 100% of your bankroll:
  *   Flip 1: Heads. You have 2x.
  *   Flip 2: Heads. You have 4x.
  *   Flip 3: Tails. You have 0.
  *   Flip 4 to 100: You have 0.

  Once you hit zero, you cannot recover. The "average" outcome across parallel universes (ensemble) includes those rare universes where you win 100 times in a row and become a trillionaire. That single universe skews the average so massively that it hides the fact that in 99.99...% of universes (including the one you actually live in), you go broke.

  **The Lesson:** Expected Value assumes you can average out losses across parallel realities. In real life, you experience outcomes sequentially. If a loss wipes you out, you exit the game, and the "average" becomes irrelevant to you.

  ### 2. The Mechanism: Arithmetic vs. Geometric Growth

  Because you are reinvesting winnings, your wealth grows **multiplicatively**, not additively.
  *   **Additive process:** You win \$10 or lose \$10. Your bankroll is $W + \text{profit}$.
  *   **Multiplicative process:** You win 10% or lose 10%. Your bankroll is $W \times \text{multiplier}$.

  In multiplicative processes, the long-term growth rate is determined by the **Geometric Mean**, not the Arithmetic Mean (which is what EV uses).

  Let's look at a simple example. Suppose you bet 100% of your bankroll on two flips, one Head and one Tail (order doesn't matter).
  *   Start: \$100
  *   Head: \$200
  *   Tail: \$0
  *   End: \$0

  Now suppose you bet 50% of your bankroll.
  *   Start: \$100
  *   Head (win 50%): \$150
  *   Tail (lose 50%): \$75
  *   End: \$75

  Even though the Arithmetic Average return per flip might look positive, the *compounding* effect of a 100% loss destroys the capital base required to generate future returns. To survive compounding, you must avoid volatility drag. The strategy that maximizes the Geometric Mean of your returns is the **Kelly Criterion**.

  For your specific game (70% win chance, even money payout), the Kelly formula dictates betting **40%** of your bankroll.
  *   **Bet 100%:** Geometric growth rate is negative (you go to zero).
  *   **Bet 40%:** Geometric growth rate is maximized (wealth grows exponentially over time).
  *   **Bet 0%:** Geometric growth rate is zero (wealth stays flat).

  ### 3. The Philosophical Claim: Is this "Objective"?

  This is where your friend's claim gets interesting. He argues that choosing the Kelly fraction (40%) isn't just a matter of being "risk-averse," but is objectively rational.

  **The Standard Economic View (Subjective):**
  Traditional economics (Von Neumann-Morgenstern utility theory) says there is no "objectively correct" bet size. It depends on your **Utility Function**.
  *   If your Utility = Wealth (linear), you should bet 100% (Maximize EV).
  *   If your Utility = Log(Wealth), you should bet 40% (Maximize Kelly).
  *   If you are super scared of losing, you might bet 10%.

  In this view, your friend *is* smuggling in a preference. He is assuming you care about Log(Wealth) without admitting it. He is calling "Log(Wealth)" rational and "Linear(Wealth)" irrational, which is a value judgment.

  **The Ergodic Economics View (Objective):**
  However, there is a newer framework (championed by physicist Ole Peters) that supports your friend's philosophical claim. It argues that standard economics made a mistake by using Ensemble Averages (parallel universes) for problems that happen in Time (one life).

  If you accept that **time is irreversible** and you cannot step out of your timeline to average your results with other versions of yourself, then maximizing the *Time-Average Growth Rate* is the only physically consistent way to optimize wealth.

  Under this view:
  1.  **Rationality is defined by survival and growth in *this* timeline.**
  2.  Since betting 100% leads to a time-average growth rate of negative infinity (ruin), it is objectively irrational for a single agent acting over time.
  3.  It is not about "psychological risk aversion." It is about the **mathematics of compounding**. Even a robot with no feelings, programmed to maximize its bankroll after 100 rounds, should bet 40%. If it bets 100%, it will fail its programming in almost every instance.

  So, is your friend right? **Yes, in the context of repeated, multiplicative betting.** The "risk aversion" isn't a psychological preference; it's a mathematical requirement for survival in a non-ergodic system (a system where the time average $\neq$ the ensemble average).

  ### 4. Why Expected Value "Lies"

  Expected Value isn't wrong; it's just asking the wrong question.
  *   **EV asks:** "If I could play this game in a million parallel universes and pool all the money at the end, how much would I have?"
  *   **Kelly/Time-Average asks:** "If I play this game in my one life for 100 rounds, how much will I likely have?"

  For a single flip, EV is fine. For 100 compounded flips, EV is dominated by the one-in-a-billion outcome where you win every time. It ignores the *distribution* of outcomes.

  Think of it like this: If I offer you a bet where you have a 99.9% chance to die and a 0.1% chance to become immortal and rule the universe, the EV of "life years" might be positive. But if you only live once, taking that bet is suicidal, not rational. The "objective" rational choice is to stay alive, not to maximize the abstract average across possible worlds.

  ### Summary

  1.  **Your Simulation:** Correct. Betting 100% leads to ruin. Betting ~40% leads to growth.
  2.  **Your Friend's Math:** Correct on EV, but EV is the wrong metric for repeated compounding.
  3.  **The "Objective" Claim:** Your friend is channeling **Ergodicity Economics**. He is arguing that because we live in time, not in parallel universes, maximizing the geometric growth rate is physically necessary for long-term success, not just a psychological preference.
  4.  **The Verdict:** You should not bet 100%. The "rational" bet for a repeated, reinvested game is the Kelly fraction (40% in this case). This isn't just caution; it is the mathematical requirement to prevent volatility from destroying your capital base.

  Your friend is right to challenge the dogma that "Expected Value = Rationality." In the real world, where bankruptcy is absorbing (you can't play once you're broke) and time is linear, **maximizing the growth rate is the only strategy that doesn't rely on magic parallel universes to save you.**
