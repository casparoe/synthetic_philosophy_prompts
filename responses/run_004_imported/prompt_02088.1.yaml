answer: |-
  You are absolutely right to feel that the standard LW/FDT answer often talks past the specific philosophical nerve Kavka was trying to strike. Your intuition is correct: Kavka's puzzle is primarily a puzzle about the **psychology of intention** and the **norms of belief**, whereas FDT (and much of the decision theory literature) treats it as a puzzle about **policy selection** and **payoff matrices**.

  When a rationalist says "FDT solves Toxin," they usually mean "FDT agents get the money." When Kavka asks the question, he means "Is it psychologically/constitutively possible for a transparent agent to hold the mental state required to get the money?"

  Here is the breakdown of the "zoo" of solutions you mentioned, followed by an analysis of whether FDT actually engages with Kavka's specific worry about self-prediction.

  ### 1. Disentangling the Philosophers (Gauthier vs. McClennen vs. Bratman)

  You are correct that these are often lumped together as "The Rationalist Solution," but they make distinct moves.

  **David Gauthier (Constrained Maximization):**
  *   **The Move:** Rationality is about acquiring *dispositions*, not maximizing utility at every specific node.
  *   **The Mechanism:** You make yourself into a person who keeps commitments. Once you have that disposition, it is rational to acquire it (because you get the \$1M). Once you have it, you drink the toxin.
  *   **The Weakness:** Kavka's rebuttal is that dispositions don't magically override preferences. If I know I am in pain tomorrow and the money is already in the bank, my disposition to "be a committer" doesn't change the fact that drinking hurts and gains nothing *in that moment*. Gauthier assumes the disposition *causes* the action, but doesn't fully explain how it silences the immediate utility calculation without looking like irrationality.

  **Edward McClennen (Resolute Choice):**
  *   **The Move:** This is distinct from Gauthier. McClennen attacks the idea of **Dynamic Consistency** (the idea that you should maximize utility at every decision node).
  *   **The Mechanism:** At T1 (tonight), you choose a *plan* (Intend + Drink). At T2 (tomorrow), you do not treat the decision as new. You treat yourself as bound by the T1 plan. You refuse to "reopen" the deliberation.
  *   **The Difference:** Gauthier changes the *agent's character*; McClennen changes the *structure of deliberation over time*. McClennen argues it is rational to bind your future self's deliberation.
  *   **The Weakness:** Kavka (and others) argue this looks like "rational irrationality." How do you cognitively prevent yourself from reconsidering? If you know you *could* reconsider, haven't you already reconsidered?

  **Michael Bratman (Planning Theory of Intention):**
  *   **The Move:** This is the most distinct and addresses your worry about "intention vs. prediction."
  *   **The Mechanism:** Bratman argues Kavka relies on a false premise: that **Intention = Prediction of Future Utility Maximization.** Bratman says intentions are distinct mental states with their own norms (stability, inertia, consistency). You can intend to X even if you know that, *ceteris paribus*, you wouldn't want to X in the moment, because the intention itself provides a reason to act that isn't just immediate utility.
  *   **The Difference:** Gauthier/McClennen are trying to save Expected Utility Theory (EUT) by tweaking how it applies over time. Bratman is saying EUT is a bad model of human intention in the first place.
  *   **The Strength:** This actually engages with Kavka's phenomenological worry. It says, "Yes, humans can do this, because intention isn't just a bet on your future CDT calculations."

  ### 2. Does FDT Actually Solve Kavka's Worry?

  This is the crux of your annoyance. The standard LW pitch is: *"FDT agents one-box on Newcomb and drink the Toxin. Problem solved."*

  But as you noted, Kavka's puzzle isn't "How do you get the money?" It's **"How can you sincerely intend to do something you know you won't want to do?"**

  **Where FDT agrees with Kavka:**
  FDT agrees with Kavka that a **CDT agent** (who re-evaluates at T2 based on local consequences) *cannot* sincerely intend to drink. If your algorithm is "At T2, maximize local utility," you know tonight that T2-You will defect. Therefore, you cannot form the intention tonight. Kavka wins against CDT.

  **Where FDT "Dissolves" the Problem:**
  FDT changes the ontology of the agent.
  1.  **Policy as Identity:** In FDT, you don't choose actions; you choose a *policy function*. Your "action" tonight and your "action" tomorrow are outputs of the same function.
  2.  **Self-Prediction:** Kavka argues you can't intend X if you predict you won't do X. FDT says: "If your policy is `Drink_If_Paid`, then your prediction of your future self is `Will_Drink`."
  3.  **The Bridge:** FDT bridges the intention/action gap by making the intention (the policy selection) **causally/logically efficacious** on the future action.

  **The "Redefinition" Charge:**
  You asked if FDT just redefines the question. **Yes, it does.**
  *   **Kavka's Question:** "Can a human mind, aware of its own future utility maximization, form a sincere intention?"
  *   **FDT's Answer:** "A rational agent shouldn't be the kind of thing that separates 'intention' from 'policy execution' in that way."

  FDT effectively adopts a **functionalist version of Bratman**. Bratman says intentions have "inertia." FDT says policies have "logical continuity."
  *   For Bratman, the inertia is a psychological feature of planning agents.
  *   For FDT, the inertia is a logical feature of agents whose actions are determined by a fixed source code.

  If you are an FDT agent, you don't "trick" yourself into intending. You simply *are* an agent whose source code outputs `Intend=True` and `Drink=True`. The "sincerity" worry vanishes because there is no gap between your prediction and your action. You predict you will drink *because* you know your source code compels you to.

  ### 3. The Mechanics of the "Intention Gap"

  To address your request for mechanics: The puzzle relies on a specific tension between **Deliberation** and **Prediction**.

  **Kavka's Model (CDT-compatible):**
  1.  **T1 (Tonight):** I consider intending. To intend, I must believe I will drink.
  2.  **Prediction:** I simulate T2-Me. T2-Me sees Money=In_Bank, Pain=High, Benefit=0. T2-Me chooses `Don't Drink`.
  3.  **Result:** I cannot believe I will drink. Therefore, I cannot intend. Therefore, I get no money.

  **FDT/Resolute Model:**
  1.  **T1 (Tonight):** I select a policy `P`.
  2.  **Prediction:** I simulate T2-Me running `P`. `P` outputs `Drink`.
  3.  **Result:** I believe I will drink. I form intention.
  4.  **T2 (Tomorrow):** I run `P`. `P` outputs `Drink`.
      *   *Crucial Mechanic:* T2-Me does **not** calculate `Utility(Drink) vs Utility(No_Drink)`. T2-Me executes `P`.

  **The Friction:**
  The friction you feel (and the friction Kavka wants you to feel) comes from the fact that **humans are naturally CDT agents.** We naturally re-evaluate based on current stakes.
  *   When LW rationalists say "Just be FDT," they are saying "Rewrite your source code so you don't re-evaluate."
  *   When Kavka asks "Can you intend?", he is asking "Can you rewrite your source code *just by deciding to*?"

  This is where **McClennen's Resolute Choice** is actually closer to the human experience than FDT. McClennen admits you have to *refuse* to re-evaluate. FDT assumes you *can't* re-evaluate (because you are a function).

  ### 4. Summary: Is it a Solution or a Bypass?

  You are justified in your annoyance.

  *   **If the question is:** "How can an idealized rational agent secure the payoff?" -> **FDT solves it.** It defines the agent such that the intention/action gap doesn't exist.
  *   **If the question is:** "How can a human being, who knows they will be a utility maximizer tomorrow, sincerely intend to act against their interest?" -> **FDT bypasses it.** It tells you to stop being a human who maximizes utility at every node.

  **Bratman is the only one who really engages Kavka on the home turf of human psychology.** He argues that intention *isn't* a prediction of utility maximization. FDT agrees with the *conclusion* (you can intend) but for a different reason (you are a logical function, not a psychological planner).

  **The "Rationalist Solution" (Gauthier/McClennen/FDT) basically says:**
  "The puzzle proves that **Synchronic Rationality** (maximizing at every moment) is self-defeating. Therefore, rationality must be **Diachronic** (maximizing over the timeline)."

  Kavka's counter-punch is: "Okay, but how do you *implement* Diachronic Rationality in a mind that experiences time synchronically?"

  If you walk away with one distinction:
  *   **Gauthier:** Change your character (Disposition).
  *   **McClennen:** Change your deliberation rules (Resolute Choice).
  *   **Bratman:** Change your definition of intention (Planning State).
  *   **FDT:** Change your ontology (Logical Policy).

  FDT is the most robust *decision theory*, but Bratman offers the most robust *philosophy of action* regarding the specific puzzle Kavka posed. The LW crowd prefers FDT because it pays rent (gets the money), but you are correct that it dissolves the philosophical tension by assuming away the psychological limitations Kavka was highlighting.
