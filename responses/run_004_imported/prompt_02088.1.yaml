      *   *Bratman (Planning Theory):* Intentions are not just predictions or desires. They are distinct mental states with "stability" and "inertia." You *can* intend because intention isn't strictly tied to immediate expected utility maximization at the moment of action. *Key difference:* This is a philosophical psychology claim, not just a decision theory claim.

