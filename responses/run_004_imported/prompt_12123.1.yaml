answer: |-
  You have spotted exactly the right tension. Your intuition that there is a "sleight of hand" between paragraph 8 and 9 is shared by many commentators, but understanding *why* Hume feels entitled to make that move requires digging into the radical empiricism underpinning the *Treatise*.

  Here is an untangling of the inference, the specific epistemic/ontological bridge Hume builds, and how it stacks up against contemporary metaphysics.

  ### 1. The Structure of the Argument
  Let's formalize the steps Hume takes in these paragraphs to see where the friction points are.

  1.  **The Maxim:** Whatever is clearly conceived is possible; whatever is inconceivable is impossible. (Para 8)
  2.  **The Empirical Fact:** Our idea of extension is derived from sensory impressions (sight/touch). (Implicit from earlier sections)
  3.  **The Capacity Limit:** The imagination has finite capacity. We cannot form an idea of an infinite number of parts. Therefore, the idea of extension *as we possess it* terminates in indivisible parts (minimum sensibilia). (Para 9)
  4.  **The Negative Inference:** Since we cannot conceive of infinite divisibility, it implies a contradiction (for us). Therefore, infinite divisibility is impossible.
  5.  **The Positive Inference:** Since we *can* conceive of extension as composed of indivisible points, it implies no contradiction. Therefore, it is possible.
  6.  **The Ontological Leap:** Since the atomic model is the *only* conceivable model, extension *really exists* conformable to it. (Para 9)

  ### 2. The "Sleight of Hand": Epistemology to Ontology
  Your main worry is: *How does he get from "I can't picture infinite division" to "Space is actually atomic"?*

  By modern realist standards, this is a non-sequitur. Our cognitive limits (epistemology) usually don't dictate the structure of the external world (ontology). However, Hume is not a realist in the modern sense. He is operating under two constraints that license this move for him:

  **A. The Copy Principle and Meaning Empiricism**
  For Hume, a term is meaningless if it is not attached to a specific impression/idea. If "infinite divisibility" requires an idea of infinite parts, and the mind cannot form an idea of infinite parts (due to finite capacity), then the term "infinite divisibility" is literally nonsense. It doesn't refer to a difficult truth; it refers to nothing.
  *   **The Move:** He isn't saying "Infinite divisibility is false." He is saying "Infinite divisibility is unintelligible."
  *   **The Consequence:** If Option A (Atoms) is intelligible and Option B (Continuum) is unintelligible, Option A isn't just *possible*; it is the only candidate for *reality*.

  **B. Phenomenalism**
  Hume does not believe in a "space" that exists independently of our perceptions of it. Space *is* the manner in which colored points or tangible points appear to us.
  *   **The Move:** If the *appearance* is atomic (because our minimum impression is atomic), then space *is* atomic. There is no "noumenal space" hiding behind the impressions that might be continuous.
  *   **The Consequence:** The limit of the imagination *is* the limit of the object, because the object is constituted by the imagination's content.

  So, is it sleight of hand? **Yes, if you assume a mind-independent reality.** But within Hume's system, it is consistent. He collapses the distinction between "how we must conceive X" and "what X is."

  ### 3. The Conceivability Principle: Hume vs. Chalmers/Yablo
  You asked if this is the same move contemporary philosophers like Chalmers or Yablo discuss. It is the ancestor of that debate, but there is a crucial divergence.

  **Contemporary View (Chalmers):**
  Contemporary defenders of the conceivability-possibility thesis (like Chalmers in *The Conscious Mind*) distinguish between **psychological conceivability** (what a human can hold in their head) and **ideal conceivability** (what is conceivable without contradiction, regardless of cognitive limits).
  *   Chalmers would argue Hume is conflating the two. Just because *Hume's brain* can't simulate infinite division doesn't mean the concept involves a logical contradiction.
  *   For Chalmers, "Gunk" (infinitely divisible stuff with no simple parts) is ideally conceivable, even if we can't visualize it. Therefore, it is metaphysically possible.

  **Hume's View:**
  Hume has no notion of "ideal conceivability" detached from human psychology. For Hume, reason is nothing but the comparison of ideas. If the ideas cannot be formed (because impressions don't support them), reason has nothing to work with.
  *   Hume's maxim is psychological: "Nothing we *imagine* is absolutely impossible."
  *   **The Conflict:** Contemporary metaphysicians accept that mathematical coherence (e.g., the real number line) grants possibility. Hume rejects mathematical coherence if it outstrips sensory imagery. He explicitly privileges the "imaginary" over the "mathematical" in this section, calling the math "scholastick quibbles."

  ### 4. The "Gunk" Objection
  You mentioned that contemporary metaphysicians are comfortable with "gunk." This directly undercuts Hume, but Hume would anticipate this and reject the premise.

  *   **The Modern Argument:** We can define a line mathematically as a set of points with Dedekind completeness. This is coherent. Therefore, continuous space is possible.
  *   **Hume's Counter:** That definition is a "fiction of the imagination." You are using words ("point," "line," "infinite") without corresponding impressions. You are engaging in verbal manipulation, not reasoning about ideas.
  *   **The Verdict:** If you accept modern mathematical Platonism (that mathematical structures exist or are possible independent of sensory instantiation), Hume's argument fails. If you accept Hume's strict empiricism (no impression, no idea), Hume's argument holds.

  ### 5. Summary of the Inference
  To answer your specific question about which inference is doing the work:

  The heavy lifting is done in the transition from **Para 8 to Para 9**, specifically in the phrase: *"consequently 'tis possible for extension really to exist conformable to it."*

  Hume is relying on an **Inference to the Only Explanation**.
  1.  We need an account of extension.
  2.  Account A (Continuum) is inconceivable (therefore impossible/meaningless).
  3.  Account B (Atoms) is conceivable (therefore possible).
  4.  Therefore, Account B is the case.

  He treats "Possible" as "Actual" here because he has eliminated the competition. He isn't arguing "Atoms are possible, therefore they exist." He is arguing "Atoms are possible, Continuum is impossible, therefore Atoms exist."

  ### Conclusion for your Seminar
  Your professor waved at it as the "conceivability-possibility thesis," but that's only half the story. The real engine is Hume's **Meaning Empiricism**.

  *   **Your Instinct:** You are right that there is a gap between "I can't imagine it" and "It isn't real."
  *   **The Humean Defense:** Hume plugs that gap by defining "reality" (for the purposes of metaphysics) as "that which can be presented to the mind."
  *   **The Critique:** The argument fails if you believe mathematical coherence entails metaphysical possibility (which most of us do post-Cantor). Hume's "decisive reason" is decisive only if you accept his restrictive theory of ideas.

  If you want to press this in seminar, ask: *"Does Hume's argument rely on the Conceivability Principle, or does it rely on the Copy Principle? Because if the Copy Principle allows for abstract mathematical ideas that don't copy impressions, the argument collapses."* That will show you've seen the machinery behind the curtain.
