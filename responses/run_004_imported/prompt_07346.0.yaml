answer: |-
  This is a remarkably high-quality pub argument. It tracks a genuine, decades-long debate in welfare economics and political philosophy with surprising fidelity. Here is the round-by-round breakdown of who held the stronger position in each exchange, followed by the critical move that was left on the table.

  ### The Round-by-Round Breakdown

  **Move (1): Nadia (The Robbins Critique)**
  *   **The Claim:** Interpersonal comparisons of utility (ICU) are scientifically unobservable; claiming a dollar matters more to a poor person is a value judgment, not an empirical fact.
  *   **The Verdict:** **Nadia wins on methodological grounds.**
  *   **Why:** Within the strict confines of positive economics and logical positivism (which Robbins championed), she is unassailable. You cannot observe another person's utility function. There is no "utilometer." By demanding empirical verification for a claim that is inherently normative, she correctly identifies that the candidate's CBA model is resting on ethical premises disguised as technical ones. Owen cannot refute this empirically because the observation *is* impossible.

  **Move (2): Owen (The Hidden Normativity Critique)**
  *   **The Claim:** Refusing to compare isn't neutral; standard tools like Kaldor-Hicks implicitly compare by treating a dollar as equal across persons, which favors the status quo and the wealthy.
  *   **The Verdict:** **Owen wins on political-economic grounds.**
  *   **Why:** This is the strongest counter to Robbins. Owen successfully demonstrates that "skepticism" about ICU is not a neutral default position; it is itself a policy choice with distributive consequences. If you refuse to weight dollars by marginal utility, you effectively weight them by ability to pay. He exposes that Nadia's "scientific purity" in Move (1) would lead to policy paralysis or, worse, regressive outcomes masked as neutrality. He forces the debate from "can we know?" to "what are we doing if we don't?"

  **Move (3): Nadia (The Harsanyi Critique)**
  *   **The Claim:** Even Harsanyi's Social Welfare Theorem, which derives utilitarianism from rational choice axioms, does not solve the scaling problem (zero-points and units) or determine the weights.
  *   **The Verdict:** **Nadia wins on technical grounds.**
  *   **Why:** Owen tried to pivot to policy necessity in Move (2), but Nadia drags it back to formal theory, where she is the expert. She is technically correct: Harsanyi's theorem shows that *if* you satisfy certain axioms, your social welfare function looks like a sum of individual utilities. But it does not tell you how to normalize Person A's utility scale against Person B's. You still need an external ethical rule to set the weights. Owen's Kaldor-Hicks point didn't address this normalization problem, and Nadia correctly identifies that the "arbitrariness" hasn't vanished; it has just been moved to the weighting stage.

  **Move (4): Owen (The Extended Sympathy/Pragmatism Critique)**
  *   **The Claim:** We determine weights through "extended sympathy" (imagining ourselves in others' lives). Demanding thermometer-grade precision would outlaw necessary redistributive tools (QALYs, minimum wage).
  *   **The Verdict:** **Owen wins on pragmatic grounds, but leaves a flank open.**
  *   **Why:** Owen correctly identifies that society *does* make these comparisons constantly and successfully without perfect data. His argument from "reflective equilibrium" (we know a migraine outweighs a hangover) is a standard and robust philosophical move. However, by grounding this in psychological "sympathy," he shifts from a claim about *justice* to a claim about *psychology*. This works for now, but it invites the empirical rebuttal that psychology is flawed. He wins the round because he makes Nadia's skepticism look paralyzing, but he sets up the vulnerability Nadia exploits in the next move.

  **Move (5): Nadia (The Bias/Honesty Critique)**
  *   **The Claim:** Sympathy tracks vividness and proximity, not need. Grounding weights in intuition launders bias; explicit arbitrariness is more honest.
  *   **The Verdict:** **Nadia wins the final exchange.**
  *   **Why:** This is a devastating reply to Move (4). Behavioral economics and moral psychology support Nadia here: human sympathy is notoriously biased toward the identifiable victim, the geographically near, and the culturally similar. If Owen grounds the weights in "what we feel," he imports all our cognitive biases into the welfare function. Nadia's claim that it is better to be "openly arbitrary" (i.e., explicitly political about the weights) than to pretend intuition is a measurement tool is a strong normative position. It forces the conclusion that if we must choose weights, we should do so democratically or legislatively, not pretend we "discovered" them through sympathy.

  ***

  ### The Missing Move

  There is a major argument sitting on the table that neither of them made, which is particularly glaring given that Owen is described as "Rawls-adjacent."

  **The Missing Move: Primary Goods (or Capabilities) instead of Utility.**

  Owen should have pivoted away from defending *utility comparisons* entirely. John Rawls specifically constructed his theory of justice to avoid the problem Nadia raised in Move (1). Rawls agrees with Robbins that interpersonal comparisons of *utility* (satisfaction, happiness, preference fulfillment) are problematic and unreliable.

  **The Argument Owen Should Have Made:**
  "We don't need to compare utility functions, Nadia. We should compare **indices of primary goods** (rights, liberties, opportunities, income, wealth, and the social bases of self-respect). We can observe who has more income or fewer liberties without needing a thermometer for their subjective happiness. A CBA for pandemic relief shouldn't be weighing 'utils'; it should be weighing the impact on the least advantaged group's access to primary goods."

  **Why this changes the debate:**
  1.  **It sidesteps Robbins:** It accepts Nadia's premise that utility is unobservable but rejects her conclusion that comparison is impossible. We compare objective metrics, not subjective states.
  2.  **It fixes Owen's Move (4):** It removes the reliance on "sympathy." We don't need to imagine living the other person's life to know they lack healthcare or income; we just need to measure the healthcare and income.
  3.  **It neutralizes Nadia's Move (5):** Since primary goods are objective (or at least intersubjectively verifiable), they are less susceptible to the "vividness bias" of sympathy.

  **Alternative Missing Move: The Procedural Turn.**
  If not Primary Goods, the missing move is **Democratic Weighting**. Both are treating the weights as something to be *found* (either by economists or philosophers). The missing argument is that the weights are not a matter of discovery at all, but of **authorization**. The "correct" weight for a poor person's dollar vs. a rich person's dollar is whatever the legislature decides it is through the democratic process. The economist's job is not to determine the weights (which is ethical) nor to claim they can't be compared (which is paralyzing), but to say: *"If you choose weight X, the outcome is Y. If you choose weight Z, the outcome is Q."*

  **Verdict on the Missing Move:**
  Given Owen's philosophical profile, the **Primary Goods** argument is the one he *should* have made. It is the specific tool Rawlsians wield to defeat Robbinsian skepticism. By staying in the terrain of "utility" (even sympathetic utility), Owen fought on Nadia's home turf, where her social choice tools are superior. He should have changed the terrain.
