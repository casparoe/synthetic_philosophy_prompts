answer: |-
  The tension within Leibniz's mature jurisprudence lies in the friction between his normative definition of justice and his descriptive psychology of volition. On the one hand, Leibniz seeks to establish a robust, objective morality where justice (*caritas sapientis*) requires a genuine, disinterested love of the other. On the other hand, his metaphysical psychology dictates that all agency is fundamentally driven by the agent's pursuit of their own perfection and pleasure. I argue that these commitments are incompatible. By grounding the motive force of the will exclusively in the agent's own perception of perfection, Leibniz renders the "disinterestedness" of charity structurally impossible. Consequently, his definition of justice collapses into a form of enlightened egoism, failing to distinguish moral duty from prudential calculation.

  ### 1. The Moral Requirement: Disinterested Benevolence
  Leibniz defines justice as "the charity of the wise." Charity, for Leibniz, is a "constant disposition to take pleasure in the happiness of others." Crucially, he insists this love must be **disinterested** (*désintéressé*). To love disinterestedly means to value the object of love (the other's good) for its own sake, rather than as a mere instrument for the lover's advantage.

  For Leibniz, this distinction is vital to separate justice from mere prudence or Hobbesian contractarianism. If I help you only because I fear punishment or expect a reward, I am prudent, not just. True justice requires that the happiness of the other enters my volition as an **end in itself**. If the other's good is sought only because it serves *my* good, the relation is transactional, not moral. Thus, the integrity of Leibniz's jurisprudence depends on the possibility of a motive that terminates in the other, not the self.

  ### 2. The Psychological Premise: The Primacy of Self-Referential Pleasure
  However, Leibniz's psychology of action undermines this moral architecture. He posits three interconnected doctrines:
  1.  **Perfectionism:** The good is nothing but perfection.
  2.  **Hedonism:** Pleasure is nothing but the perception of perfection.
  3.  **Motivational Egoism:** Every act of will is moved by the pursuit of the agent's *own* greatest pleasure (perception of *own* perfection).

  Leibniz explicitly states that we never will anything unless we find some pleasure in it, and that this pleasure is always a feeling of our *own* perfection increasing. Even in love, Leibniz argues that "the happiness of the loved one enters into our own." While this sounds altruistic, the psychological mechanism remains self-referential: I am motivated to act because *I* perceive *my* perfection is enhanced by the contemplation or realization of the other's good.

  ### 3. The Collapse of Disinterestedness
  The contradiction arises when we analyze the structure of motivation implied by these premises.

  **The Instrumentality Problem**
  If every act of will is moved by the pursuit of the agent's *own* greatest pleasure, then the ultimate end of every action is the agent's own subjective state (pleasure/perfection).
  *   Let $O$ be the Other's Good.
  *   Let $P_{self}$ be the Agent's Own Pleasure.
  *   Leibniz claims: I will $O$ because $O$ produces $P_{self}$.

  In this causal chain, $O$ is the means, and $P_{self}$ is the end. Even if $P_{self}$ is caused by the existence of $O$, the *reason for acting* is the acquisition of $P_{self}$. This violates the definition of disinterestedness, which requires $O$ to be the ultimate end. If I cease to feel pleasure in your happiness, according to Leibniz's psychology, my will to promote your happiness ceases. Therefore, my will was contingent on my pleasure, not on your good *in itself*.

  **The "Inclusion" Strategy Fails**
  Leibniz attempts to evade this by arguing that in true charity, the other's good is *included* in one's own good. He suggests that the wise person so identifies with the other that their perfections are shared. However, this is a semantic sleight of hand that does not solve the structural egoism.
  Even if the other's good is a *constituent part* of my good, the *locus of value* that drives the will remains the self. The motive force is the augmentation of *my* state of perfection. To say "I seek your good because it is part of my perfection" is logically equivalent to "I seek your good because it benefits me." The distinction between "my good" and "your good" is blurred, but the *direction of fit* remains inward: the world is to be arranged to maximize *my* perception of perfection.

  **Refined Egoism, Not Altruism**
  This reduces Leibnizian justice to **enlightened egoism**.
  *   **Crude Egoism:** I harm you to benefit me.
  *   **Enlightened Egoism (Leibniz):** I benefit you because doing so benefits me (by increasing my spiritual perfection/pleasure).

  While the *action* is benevolent, the *motive* is self-referential. Leibniz claims the wise person delights in the other's good "for its own sake." But on his psychological premises, they delight in it for the sake of the *pleasure of the delight*. The "own sake" of the other is never the actual stopping point of the volition; the stopping point is always the agent's own feeling of perfection.

  ### 4. The Impossibility of *Caritas Sapientis*
  If justice requires disinterestedness, and disinterestedness requires that the other's good be an end independent of the agent's pleasure, then Leibniz's psychology makes justice psychologically impossible.
  *   If I act to maximize my pleasure, I am not acting disinterestedly.
  *   If I act disinterestedly, I must be capable of acting against the pursuit of my own greatest pleasure (or at least independently of it).
  *   Leibniz denies we can act independently of the pursuit of our own greatest pleasure.
  *   Therefore, Leibniz denies we can act disinterestedly.

  Leibniz tries to have it both ways: he wants the moral high ground of altruism (to refute Hobbes) while retaining the metaphysical consistency of a monadological psychology where every substance seeks its own unfolding perfection. He cannot have both. By defining pleasure as the perception of *one's own* perfection, he ensures that all love is ultimately a form of self-love (*amour de soi*), merely extended through the intellect to include others.

  ### Conclusion
  Leibniz's definition of justice as "the charity of the wise" fails to pick out anything beyond enlightened egoism because his psychological premises dissolve the distinction between the good of the self and the good of the other at the level of motivation. By insisting that the will is always moved by the agent's own pleasure, he renders the "disinterestedness" of charity illusory. The other's happiness becomes a sophisticated instrument for the agent's own spiritual gratification. Thus, the commitments cannot jointly be sustained: either Leibniz must abandon his psychological egoism to save the disinterestedness of justice, or he must admit that his jurisprudence describes only the most prudent path to self-perfection, not a moral obligation grounded in genuine love of the other.
