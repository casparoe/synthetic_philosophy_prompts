  **Interviewer:** "Professor Ayer, you saw the light. You met the ministers. Surely the statement 'there is life after death' is now empirically verified?"

  **Ayer:** "My dear fellow, you confuse a protocol sentence with a metaphysical inference. 'Ayer saw a red light' is verifiable. 'Ayer was dead' is falsified by my breathing. And 'There is an afterlife' remains cognitively meaningless because the verification conditions require public observability. Unless you choke on a fish and compare notes, you're just talking nonsense."

  **Interviewer:** "So your atheism stands?"

  **Ayer:** "My *positivism* stands. I don't deny the light; I deny that your sentence about it means anything. Though I admit, the red was very vivid. My conviction that death is the end is now slightly weakened. Now, could you verify this fish is boneless? Publicly?"
