answer: |-
  The room was soundproofed, lined with acoustic foam that swallowed the hum of the ventilation. Elias sat on one side of the steel table; Dr. Vane sat on the other. Between them lay a single file folder, open. Inside were scans, signatures, and a timestamp from three days prior.

  "The medical board has signed off," Vane said, tapping the paper. "Legally, biologically, and ontologically, you are deceased, Mr. Thorne. The body in the morgue is yours. The consciousness sitting here is a continuation protocol. We need you to confirm you understand."

  Elias looked at the scans. He recognized the fracture in the skull. He recognized the date. He had watched the accident happen from a vantage point that shouldn't have existed, before waking up in this room. The evidence was absolute. There was no room for error, no conspiracy, no hope of reversal.

  "I understand," Elias said. "I am dead."

  Vane nodded, pen hovering over a clipboard. "And do you believe that?"

  Elias paused. He looked inward, scanning the landscape of his own mind with the same clinical detachment he applied to the scans. He felt the weight of his hands on the table. He felt the rhythm of his breathing, simulated though it was. He felt the certainty of the fact *I am dead* resting in his cognition like a stone in a box. But he searched for the specific texture of *belief*—the leap of faith, the internal endorsement, the doxastic commitment that usually accompanies truth—and found only a void.

  "No," Elias said. "I don't believe I am dead."

  Vane stopped writing. He looked up, his brow furrowing. "Mr. Thorne, this is a standard integration interview. If you don't believe you're dead, you're in denial. That complicates the reintegration."

  "I am not in denial," Elias said calmly. "Denial implies I think the evidence is wrong. I don't. The evidence is correct. I am dead. But I do not believe it."

  "That's contradictory," Vane said, leaning forward. "If you accept the evidence, if you assert the fact, that *is* belief. You're saying 'P' and 'not-I-believe-P'. You can't sincerely hold both."

  "I am holding both," Elias said. "Look at the definition you're using. You treat belief as a synonym for acceptance. But I know my own mind. I accept the proposition 'I am dead' as true. I will act on it. I will sign the forms. I will not contact my family, because I am a legal non-entity. But the state you call 'belief'—the internal assimilation, the psychological alignment—that state is absent."

  Vane sighed, rubbing his temples. "Why? Why is it absent?"

  "Because belief is a tool for navigating uncertainty," Elias said. "It's a bridge between the subject and the world when the world isn't fully known. When the world is fully known, when the data is absolute, the bridge collapses. You don't believe the sun is rising when you are looking at it. You just see it. But this..." He gestured to himself. "This is data. It is absolute. But I am looking at it from the inside. The 'I' that should believe is the 'I' that is dead. The 'I' sitting here is a record. A record doesn't believe. It stores."

  "So you're saying you're a machine," Vane said.

  "I'm saying I'm a continuation protocol. You told me that yourself."

  Vane shook his head. "If you don't believe you're dead, you're going to try to prove you're alive. You'll seek validation. That's human nature."

  "I won't," Elias said. "Because I know I'm dead. I just don't believe it."

  "That makes no sense."

  "It makes sense to me," Elias said. "I have perfect self-knowledge on this matter. I know what is in my mind. There is truth, and there is absence. There is no belief. If I told you I believed it, I would be lying. If I told you I wasn't dead, I would be mistaken. I am choosing neither."

  Vane stood up, pacing the small room. The acoustic foam dampened his footsteps, making him look like he was moving through deep water. "The system requires a affirmative cognitive alignment. We need you to say 'I believe I am dead' to close the file. It's a safeguard. If you don't believe it, you're a risk."

  "I am not a risk," Elias said. "A risk comes from uncertainty. I have none."

  "It comes from dissonance," Vane corrected. "From the tension you're describing. It's unstable. People crack under that kind of split."

  "I haven't cracked," Elias said. "I'm reporting the topology of my mind. You want me to lie about my internal state to satisfy a category error. You want me to claim a psychological state that doesn't exist because you think truth requires it."

  "Truth requires a believer," Vane said.

  "Does it?" Elias asked. He looked at the file again. The timestamp stared back. It was the truth. He was the truth. But the believer was back in the morgue, cooling.

  "Say it," Vane demanded. "For the record."

  Elias looked at the doctor. He could say the words. He could force the shape of them into the air. But he knew that saying them would not create the state. It would only create a record of a lie. And he was committed to the truth, both about the world and about himself.

  "I am dead," Elias said. His voice was steady. "And I do not believe I am dead."

  Vane stared at him for a long moment. The silence stretched, heavy and unresolved. There was no logical contradiction in the room, only a human one. The facts were aligned. The mind was transparent. But the link between them—the fragile architecture that usually allows a person to inhabit their own truth—was missing.

  Vane finally sat down. He picked up his pen. He didn't write anything.

  "We'll reconvene tomorrow," Vane said quietly.

  "There's no need," Elias said, standing up. "The facts won't change. And neither will my mind."

  "Then how will you live?" Vane asked.

  Elias walked to the door. He paused, his hand on the cold steel handle. He didn't look back.

  "I won't live," he said. "I'll persist. There's a difference."

  He opened the door and stepped into the hallway. The light was fluorescent and humming. He knew where he was going. He knew who he was. He walked forward without the comfort of belief, carrying the truth like a weight he could not put down, acknowledging the burden without ever quite feeling it.
