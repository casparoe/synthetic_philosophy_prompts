answer: |-
  **Title:** Carving Nature at its Joints or Imposing a Grid? A Philosophical Evaluation of Representational Realism in Mechanistic Interpretability

  **Research Question:** To what extent do the features identified by sparse autoencoders in large language models qualify as genuine representations, adjudicated between Daniel Dennett's "real patterns" realism and William Ramsey's eliminativist critique?

  **Introduction**

  The rapid advancement of Large Language Models (LLMs) has precipitated a crisis of opacity. These systems exhibit sophisticated cognitive-like behaviors, yet their internal decision-making processes remain obscured within high-dimensional activation spaces. In response, the field of mechanistic interpretability has emerged, aiming to reverse-engineer these networks into human-understandable algorithms. A central technique in this endeavor is the use of Sparse Autoencoders (SAEs) to disentangle "superposed" features—directions in activation space that correspond to specific semantic concepts. However, a philosophical tension underpins this technical work. On one hand, intervening on these discovered features (e.g., amplifying a "Golden Gate Bridge" feature) causally alters model behavior in predictable ways, suggesting ontological weight. On the other hand, the phenomenon of superposition implies that no single decomposition of the activation space is privileged; increasing the SAE dictionary size yields different, equally valid sets of features, suggesting the decomposition is arbitrary.

  This essay investigates the ontological status of these SAE features. Are they genuine representations internal to the system, or are they merely instrumental fictions imposed by observers? This question is not merely semantic; it determines whether we can treat AI cognition as composed of discrete semantic units or if such talk is category error. To adjudicate this, I will evaluate two competing philosophical frameworks: Daniel Dennett's "Real Patterns" realism, which grounds reality in predictive and causal leverage, and William Ramsey's eliminativist critique, which demands that representations satisfy a specific "job description" within the system's architecture.

  This essay argues that while Ramsey's critique correctly identifies the lack of a unique decomposition, it relies on an overly restrictive structuralist criterion for representation. By contrast, Dennett's functionalist approach better accommodates the empirical reality of mechanistic interpretability. The specific causal traction gained through intervention demonstrates that SAE features are not merely descriptive tools for humans, but causally efficacious structures within the model. Therefore, a qualified Dennettian realism is the superior ontological stance: SAE features are real patterns, even if they are not uniquely determined.

  **The Technical Landscape: Superposition and Sparse Autoencoders**

  To evaluate the philosophical claims, one must first establish the technical constraints. Modern LLMs operate by transforming input tokens into high-dimensional vectors (activations) across multiple layers. A critical discovery in recent years is the phenomenon of *superposition*. Neural networks often need to represent more features than they have neurons (dimensions) available. To solve this, they pack multiple features into the same subspace, resulting in *polysemantic* neurons that fire for clusters of unrelated concepts (e.g., a single neuron activating for both "dog" and "car" depending on context). This makes individual neurons poor candidates for representation.

  Mechanistic interpretability attempts to resolve this via Sparse Autoencoders. An SAE attempts to find a new basis for the activation space—a "dictionary"—where the activations are *sparse* (most features are zero for any given input) and *monosemantic* (each feature corresponds to one concept). When successful, a specific direction in this expanded space corresponds to a coherent idea, such as "mentions of the Golden Gate Bridge."

  However, this solution introduces the "non-uniqueness" problem. There is no single, mathematically privileged dictionary size. If one trains an SAE with a dictionary size of $D$, one finds a set of features $F_D$. If one trains with size $2D$, one finds $F_{2D}$. These sets are not identical; $F_{2D}$ might split a feature from $F_D$ into two more granular features, or rotate the basis entirely while maintaining reconstruction loss. Consequently, there is no "God's eye view" of the model's features.

  Simultaneously, causal intervention experiments provide evidence for the reality of these features. In prominent studies (e.g., by Anthropic), researchers have "clamped" specific SAE features to high values during inference. When the "Golden Gate Bridge" feature was clamped, the model began steering conversations toward San Francisco and bridges, even when irrelevant. This suggests the feature is not just a post-hoc label applied by humans, but a causal lever within the system. The philosophical tension is thus: How can features be causally real if the decomposition that reveals them is arbitrary?

  **The Eliminativist Challenge: Ramsey's Representation Hunger**

  William Ramsey's critique of connectionist representation, articulated in *Representation Reconsidered*, provides the strongest framework for skepticism. Ramsey argues that for a state to count as a genuine representation, it must satisfy a specific "job description." It is not enough that an observer can *interpret* a state as representing something (e.g., "this voltage means 'dog'"). The system itself must *use* that state as a representation to guide behavior. Ramsey distinguishes between "stand-in" representations (which the system consumes to produce output) and mere indicators (which correlate with output but are not used structurally).

  Ramsey's eliminativism applies forcefully to the non-uniqueness problem of SAEs. If the activation space can be decomposed into Feature Set A or Feature Set B with equal mathematical validity, then neither set can claim to be the *actual* ontology of the system. If the model's behavior is determined by the raw vector mathematics of the residual stream, and the SAE features are merely a lossy compression created by an external observer (the researcher training the autoencoder), then the features are instrumental fictions. They are tools for *us* to understand the model, not parts of the model itself.

  From a Ramseyian perspective, the causal intervention evidence is insufficient to prove representational status. One can intervene on any correlated variable to change an outcome. If I intervene on a barometer to change the reading, I do not make the barometer the cause of the storm; it remains a mere indicator. Similarly, if I clamp an SAE feature, I am injecting a vector into the residual stream. The model processes this vector according to its weights. The fact that we *label* that vector "Golden Gate Bridge" does not mean the model possesses a concept of the bridge; it merely means we have found a direction in vector space that correlates with bridge-related outputs.

  Furthermore, Ramsey emphasizes structural isomorphism. A genuine representation should preserve the structural relationships of the thing represented. If SAE features shift and fragment as the dictionary size expands, they lack the stability required for structural isomorphism. A "Golden Gate Bridge" feature in a small dictionary might be a "San Francisco Landmarks" feature in a larger one. If the ontology of the system changes based on the hyperparameters of an external tool (the SAE), then the ontology is not in the system. It is projected onto it. Thus, Ramsey would conclude that talk of "features" is a convenient shorthand, but ontologically eliminable. The system is just weights and activations; "features" are vocabulary the system never needed.

  **The Realist Defense: Dennett's Real Patterns**

  Daniel Dennett's ontology, specifically his theory of "Real Patterns" from *Real Patterns* (1991), offers a counter-framework that is better suited to the high-dimensional, probabilistic nature of LLMs. Dennett argues against a "perfectly precise" realism. He suggests that an entity or pattern is real if positing its existence allows for successful prediction and explanation that would otherwise be impossible or prohibitively complex. Reality is not a binary of "fundamental particle" vs. "fiction"; it is a gradient of pattern density.

  For Dennett, the question is not "Is there a unique, privileged decomposition?" but rather "Does treating this pattern as real earn its keep?" The criterion is pragmatic but ontologically robust. If adopting the "intentional stance" (treating the system as having beliefs and desires) yields predictive power, those beliefs and desires are real patterns. Translating this to mechanistic interpretability: if treating SAE features as discrete semantic units allows researchers to predict and control model behavior with high fidelity, those features are real.

  The intervention evidence is the crux of the Dennettian defense. When Anthropic clamped the "Golden Gate Bridge" feature and the model's behavior shifted specifically toward bridge-related content, the feature demonstrated *causal leverage*. In the philosophy of science, specifically within interventionist accounts of causation (such as James Woodward's), a variable is causally relevant if manipulating it changes the outcome while holding other factors fixed. The SAE feature passes this test. It is not merely a barometer (correlated indicator); it is part of the mechanism. By injecting the activation vector associated with the feature, the researchers effectively "stimulated" a specific functional pathway within the network.

  Dennett would argue that the non-uniqueness of the decomposition does not negate the reality of the patterns, but rather reflects the *level of abstraction* at which we are viewing the system. Consider a pixelated image. At a low resolution, a face is a blur. At a high resolution, it is distinct pixels. Neither resolution is the "one true" description, yet the face is a real pattern existing across both. Similarly, a "Golden Gate Bridge" feature in a small dictionary and a "Golden Gate Bridge Tower" feature in a larger dictionary are not contradictions; they are the same real pattern viewed at different granularities. The fact that the basis rotates or splits does not mean the underlying semantic structure is absent; it means the structure is distributed and fuzzy, which is consistent with Dennett's rejection of Cartesian materialism.

  Furthermore, Dennett's view accommodates the observer-dependence of SAEs. The SAE is trained by humans, yes, but it is trained to reconstruct the *model's* activations. The features emerge because they are the most efficient way to encode the statistical regularities of the model's internal state. If the model did not internally distinguish "bridge" concepts from "dog" concepts in its activation geometry, the SAE could not find a direction that isolates them. The SAE discovers latent structure; it does not invent it. The "arbitrariness" Ramsey points to is actually a feature of high-dimensional geometry, not a bug of the ontology. Multiple valid maps do not imply the territory is unreal.

  **Synthesis and Evaluation**

  The conflict between Ramsey and Dennett in this context reduces to a disagreement over the necessary conditions for representation. Ramsey requires *architectural necessity* and *structural uniqueness*: the system must use *this specific* vehicle to represent *this specific* content, and there must be a fact of the matter about which vehicle it is. Dennett requires *causal efficacy* and *predictive utility*: the pattern must make a difference in the world and allow us to navigate the system's behavior.

  Ramsey's critique is potent because it exposes the risk of anthropomorphism. There is a genuine danger in assuming that because a feature looks like a human concept ("Golden Gate Bridge"), the model "thinks" about the bridge in the way humans do. If we treat SAE features as atomic symbols in a language of thought, we may miss the distributed, sub-symbolic nature of the actual computation. Ramsey is correct that the system does not "consume" the SAE features in the sense that the SAE output is not an input to the next layer of the model (during standard inference). The model operates on the residual stream, not the sparse feature vector.

  However, Ramsey's criterion is too strict for connectionist systems. It presupposes a classical computational architecture where representations are discrete files passed between modules. LLMs are not classical computers; they are dynamic dynamical systems. In such systems, "representation" is inherently distributed and context-dependent. To demand a unique decomposition is to demand that a neural network behave like a symbolic database. If we accept Ramsey's eliminativism, we are forced to conclude that *no* high-level cognitive states exist in neural networks, only raw weights and floats. This leads to a nihilism that renders interpretability impossible. If features aren't real, we cannot debug the model, we cannot align it, and we cannot explain its failures. We are left with only the "physical stance" (tracking every electron), which is computationally intractable.

  Dennett's realism avoids this nihilism while acknowledging the fuzziness. It accepts that the "Golden Gate Bridge" feature is not a hard symbol, but a *stable attractor* in the activation space. The intervention evidence is the deciding factor. Ramsey treats the intervention as manipulating an indicator (the barometer). But in a neural network, the activation vector *is* the state of the system. There is no hidden "true state" behind the activations. The activations are the physical substrate of the computation. Therefore, manipulating a direction in activation space *is* manipulating the system's cognitive state directly.

  If clamping a specific direction consistently produces specific semantic outcomes, that direction *is* a functional unit of the system, regardless of whether a different dictionary size would have sliced the space differently. The reality of the feature is grounded in its counterfactual stability: *If* this direction were active, the model *would* talk about bridges. This counterfactual support is the hallmark of a real pattern.

  Moreover, the non-uniqueness argument loses force when considering *instrumental convergence*. While many mathematical bases can reconstruct the activations, SAEs tend to converge on semantically meaningful features across different random seeds and architectures. If the features were purely arbitrary projections, different training runs would produce incoherent noise. Instead, they consistently find features corresponding to languages, topics, and reasoning steps. This convergence suggests the features are tracking objective structure in the model's function, not just mathematical artifacts.

  Therefore, while Ramsey is right to warn against reifying features into classical symbols, he is wrong to eliminate them entirely. The features are real, but their reality is functional and gradient-based, not structural and binary. Dennett's framework captures this nuance: features are real patterns because they provide the only viable vocabulary for predicting and controlling the system's complex behavior. To deny their reality is to deny the utility of the only tools we have to understand the system, which, in a pragmatic ontology, is to deny their reality.

  **Conclusion**

  The tension between the causal efficacy of SAE features and the non-uniqueness of their decomposition presents a profound ontological challenge. William Ramsey's eliminativism correctly identifies that these features lack the architectural privilege of classical symbols; they are not unique, nor are they explicitly passed as tokens within the network. However, Ramsey's critique relies on a definition of representation that is ill-suited for distributed, sub-symbolic systems. By demanding a unique "God's eye" decomposition, Ramsey sets a bar that neural networks cannot clear, leading to an unproductive skepticism.

  Daniel Dennett's "Real Patterns" realism offers a more robust framework. It shifts the criterion of reality from "unique structural existence" to "causal and predictive leverage." The empirical evidence from interventionist experiments demonstrates that SAE features are not merely descriptive labels for human observers. They are causal levers that, when manipulated, steer the model's behavior in semantically coherent ways. This causal traction validates their status as genuine components of the system's functional architecture. The fact that the decomposition varies with dictionary size does not render the features fictional; it indicates that the model's representations are multi-scale and fuzzy, much like biological concepts.

  Consequently, this essay defends the Dennettian position. The features discovered by sparse autoencoders are genuine representations. They are real patterns emergent from the weights and activations of the model, possessing sufficient stability and causal power to warrant ontological commitment. Accepting this realism is not just a philosophical preference; it is a prerequisite for the future of AI safety. If we cannot treat these features as real, we cannot reliably intervene to prevent harmful behaviors. We must accept that while the map may vary, the territory is real, and the features are the contours of that territory.

  ***

  **Bibliography**

  *   Anthropic. "Towards Monosemanticity: Decomposing Language Models With Dictionary Learning." *Transformer Circuits Thread*, 2023.
  *   Dennett, Daniel C. "Real Patterns." *Journal of Philosophy* 88, no. 1 (1991): 27-51.
  *   Ramsey, William. *Representation Reconsidered*. Cambridge University Press, 2007.
  *   Woodward, James. *Making Things Happen: A Theory of Causal Explanation*. Oxford University Press, 2003.
  *   Yun, Christopher, et al. "Superposition in Neural Networks." *arXiv preprint arXiv:2309.12423*, 2023.
