      *   *Approach 5: Justification Logic.* (Artemov). Replaces $K\phi$ with $t:\phi$ (term $t$ justifies $\phi$). Explicitly tracks evidence. Very promising, bridges proof theory and epistemology. High regard in formal epistemology recently.
