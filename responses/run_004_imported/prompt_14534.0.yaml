      *   *Approach 1: Impossible/Non-normal worlds.* (Hintikka, Rantala, etc.) Allows worlds where logical laws fail. Good for modeling ignorance of logic, but can be seen as ad hoc or too permissive (anything goes). Still widely discussed but often seen as a semantic fix rather than a procedural one.
