      *   Friend: "If Priya hadn't taken it, Sam still might not have... maybe log glitched."
      *   Okay, so the Friend is suggesting that if Priya didn't do it, that fact alone makes it *more likely* the logs are wrong, which makes it *more likely* Sam didn't do it either.
      *   This is **Evidential Dependence**.
      *   User treats "Logs are correct" as independent of "Who took it."
      *   Friend treats "Logs are correct" as *dependent* on "Who took it." (If the obvious suspect is innocent, the evidence pointing to them is suspect).
      *   This is the key! **Bayesian updating vs. Deductive logic.**

  11. **Final Plan:**
      *   Identify the logical forms: Indicative vs. Counterfactual.
