prompt: |-
  I teach formal epistemology and decision theory, and for the past two years I've also served, somewhat incongruously, as the faculty senate's representative on my university's Emergency Preparedness Committee. We have an actual case bearing down on us: a hurricane is projected to make its closest approach to our coastal campus in roughly 60 hours, and the committee must decide by tomorrow morning whether to order a mandatory evacuation of the residence halls. The National Hurricane Center's official wind-speed probability product currently gives our specific location a 28% chance of sustained hurricane-force winds before the storm passes. Our longtime severe-weather consultant, who has an unusually good track record on storms taking this particular track, believes the real risk is considerably higher, based on a specific interaction between forward speed and wind shear that he thinks this model run underweights -- though he can't give us a number of his own, only his confidence that 28% is too low.

  The committee has split into two camps that have more or less stopped listening to each other. One camp says we rely on the Hurricane Center's model precisely so that individual hunches, however well-credentialed, don't drive a decision this consequential, and that letting our consultant's dissent move us off the official figure is exactly the mistake the literature on clinical versus actuarial judgment has been warning about since Paul Meehl's original studies in the 1950s. The other camp says refusing, as a matter of policy, to ever let an articulable expert judgment shift our number isn't really deference to objective chance at all, since the actual disagreement is over what the current chance is, not over whether we should act on it once we know it. A third member, more or less accurately, keeps insisting that the whole dispute really turns on whether our consultant's evidence counts as "admissible" in David Lewis's sense for purposes of the Principal Principle, and that nothing gets settled until someone says what admissibility requires here -- but she hasn't managed to finish that thought, and neither, honestly, have I.

  Could you draft the short memo I'll send the committee tonight? It needs to end in a specific decision procedure with a real deadline attached to it -- not just "gather more information" -- and it should take the actuarial camp's worry as seriously as it deserves, rather than resolving the dispute by simply declaring the more philosophically fashionable side the winner.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** Faculty member teaching formal epistemology/decision theory, serving on the Emergency Preparedness Committee.
      *   **Audience:** The Emergency Preparedness Committee (split into two camps + one philosophical observer).
      *   **Context:** Hurricane approaching in ~60 hours. Decision on mandatory evacuation needed by tomorrow morning.
      *   **Data:** NHC gives 28% chance of hurricane-force winds. Consultant says 28% is too low (based on specific meteorological factors) but gives no number.
      *   **Conflict:**
          *   *Camp A (Actuarial):* Stick to the NHC model (28%). Don't let "clinical judgment" override statistical models (Meehl reference).
          *   *Camp B (Expert Judgment):* The NHC number is an estimate of chance, not chance itself. Expert evidence should update the probability.
          *   *Camp C (Philosophical):* Worried about Lewis's Principal Principle and "admissibility" of evidence.
      *   **Requirements:**
          *   Draft a short memo.
          *   End with a specific decision procedure and real deadline.
          *   Take the actuarial camp's worry seriously (don't just dismiss Meehl).
          *   Resolve the dispute practically (not just theoretically).
          *   Tone: Professional, decisive, intellectually honest (given the sender's background).

  2.  **Deconstruct the Philosophical/Decision-Theoretic Issues:**
      *   *Meehl/Clinical vs. Actuarial:* The actuarial camp is right that unstructured expert intuition often underperforms algorithms. However, the consultant isn't offering a gut feeling; he's offering specific *evidence* (wind shear/forward speed interaction) that suggests the model might be misspecified for *this* track. This isn't "ignoring the model for a hunch"; it's "updating the model's output based on new relevant evidence."
      *   *Principal Principle (Lewis):* $C(A | X E) = X$, where $X$ is the objective chance, $E$ is admissible evidence. The dispute is whether the consultant's insight is "admissible." If the NHC 28% is treated as *the* objective chance, then no evidence should shift it. But the NHC 28% is an *estimate* of the chance, not the chance itself. Therefore, evidence about the model's reliability is admissible.
      *   *Decision Theory:* We need to weigh the cost of evacuation (false positive) vs. the cost of staying (false negative/life safety). With life safety involved, the threshold for action is usually lower than 50%.

  3.  **Formulate a Compromise/Procedure:**
      *   We can't wait for a new number from the consultant (he doesn't have one).
      *   We can't ignore the consultant (he has a good track record on *this* track).
      *   We can't ignore the NHC (it's the gold standard).
      *   *Solution:* Treat the 28% as a baseline (prior) and apply a conservative "safety margin" or "uncertainty premium" rather than picking a new arbitrary number. Or, better yet, shift the decision criterion from "What is the exact probability?" to "Does the risk exceed the threshold for action given the uncertainty?"
      *   *Decision Procedure:* We need a specific mechanism. A "Precautionary Principle" adjustment is common in emergency management. If the cost of failure is catastrophic (death), we act on the upper bound of reasonable risk, not the point estimate.
      *   *Addressing Meehl:* Acknowledge that we aren't replacing the model with a hunch. We are treating the consultant's input as *meta-evidence* about the model's reliability in this specific context.
      *   *Addressing Lewis:* Briefly note that the NHC number is an estimate, not the metaphysical chance, so evidence about the estimate's accuracy is admissible.
      *   *The "Decision":* Since I am the faculty rep, I can't *order* the evacuation, but I can propose the voting/decision framework to break the deadlock. The prompt asks for a "decision procedure with a real deadline."
      *   *Refinement:* The memo needs to recommend a course of action to the committee so *they* can decide by tomorrow morning. The procedure should be: Adopt a risk threshold. If the *adjusted* risk exceeds it, evacuate. How to adjust? Use a "confidence-weighted" approach.
      *   *Actually, looking closer:* The prompt asks *me* (the user) to draft the memo *they* will send. The user is a committee member. They need to propose a way forward to the group.
      *   *Key constraint:* "End in a specific decision procedure with a real deadline attached to it."
      *   *Key constraint:* "Take the actuarial camp's worry as seriously as it deserves."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the gravity and the stalemate. Validate both sides.
      *   **Addressing Camp A (Actuarial):** Acknowledge Meehl. Unstructured intuition is bad. But this isn't unstructured; it's specific model criticism. However, we can't quantify it precisely without falling into the same trap.
      *   **Addressing Camp B (Expert):** Acknowledge that the 28% is an estimate, not a law of nature. Evidence about model error is relevant.
      *   **Addressing Camp C (Lewis):** Keep it brief. The NHC number is not the "objective chance" in the metaphysical sense; it's a forecast. Evidence regarding forecast accuracy is admissible.
      *   **The Proposal (Decision Procedure):** We need to move from "What is the number?" to "What is the decision rule?"
      *   *Idea:* Use a "Minimax Regret" or "Precautionary Threshold" approach. Given the asymmetry of costs (evacuation is expensive/inconvenient; staying is potentially fatal), we should treat the 28% as a *lower bound* of reasonable concern.
      *   *Specific Procedure:* Let's set a voting threshold. Or better, a specific condition. "If the NHC probability remains $\ge$ 25% AND the consultant maintains his objection, we evacuate." This respects the model (it's still high) but respects the expert (we don't demand the number go up to act).
      *   *Wait, a better Decision Theory approach:* Expected Utility. We don't know the exact $P$, but we know $P > 0.28$. Let $C_{evac}$ be cost of evacuation, $C_{stay}$ be cost of storm hit. If $P \times C_{stay} > C_{evac}$, we evacuate. Since $P$ is underestimated, we use the 28% as a conservative baseline. If 28% justifies evacuation given the stakes, we go. If not, we need a higher bar.
      *   *Practical Emergency Mgmt approach:* Usually, there's a specific wind speed threshold or probability threshold for evacuation. Let's propose we lock in the decision based on the *current* NHC data + the expert warning, without trying to renegotiate the percentage.
      *   *Revised Procedure:* "The Safety-Margin Protocol." We accept the 28% as the *floor*. We acknowledge the expert says it's higher. Therefore, for decision purposes, we treat the risk as "28% plus uncertainty." Given the stakes (life safety), the "plus uncertainty" pushes us over the action threshold.
      *   *Deadline:* Tomorrow morning (as per prompt). Let's say 8:00 AM.

  5.  **Refining the Tone:**
      *   Needs to sound like a colleague who knows epistemology but is focused on safety.
      *   Avoid jargon overload, but use enough to show respect for the philosophical arguments raised (Meehl, Lewis).
      *   Must be actionable.

  6.  **Final Polish of the Decision Procedure:**
      *   It can't just be "Evacuate." It needs to be a *procedure* for the committee to ratify.
      *   Proposal: "We adopt the NHC 28% as our baseline probability $P$. We acknowledge the consultant's evidence $E$ implies $P(Storm|E) > P(Storm)$. We cannot quantify the delta without violating actuarial best practices. Therefore, we apply a 'Precautionary Adjustment': We will act as if the probability meets the threshold for evacuation if the baseline NHC probability exceeds 25% *and* the consultant does not retract his warning."
      *   Actually, simpler: "We vote now on evacuation based on the conjunction of the NHC forecast (28%) and the Consultant's Warning. We do not vote on the probability number itself."
      *   Let's go with a specific voting rule. "Motion to Evacuate if NHC remains $\ge$ 25% at 0800 tomorrow, regardless of whether a new quantitative estimate is available from the consultant." This respects the NHC (actuarial) but acts on the warning (expert).
      *   Wait, the prompt says "decide by tomorrow morning whether to order... evacuation." So the memo is sent *tonight* to set up the decision *tomorrow*.
      *   Okay, the memo proposes the *framework* for the morning meeting.
      *   Framework: "The Asymmetric Risk Protocol."
      *   1. Accept 28% as the admissible baseline (satisfies Actuarial).
      *   2. Accept Consultant's qualitative warning as evidence that 28% is a lower bound (satisfies Expert/Lewis).
      *   3. Decision Rule: If Cost(Evacuation) < 0.28 * Cost(Catastrophe), we evacuate. Given life safety, Cost(Catastrophe) is effectively infinite. Therefore, 28% is sufficient.
      *   Let's make it concrete. "I move we authorize evacuation effective 0800 tomorrow if the NHC advisory remains at or above 20%." (Since 28% is already above, this basically locks it in, but gives a tiny window for the storm to vanish).
      *   No, that's too prescriptive. The committee needs to decide. The memo should guide the decision *procedure*.
      *   Okay, the procedure is: "We will treat the 28% figure as a *minimum* credible risk. We will not attempt to derive a new number. We will vote on the action directly, understanding that a 'No' vote requires confidence that 28% is an *overestimate*, which the consultant contradicts."
      *   Better: "I propose we adopt the following decision rule for the 8:00 AM meeting: We order evacuation if the NHC probability remains $\ge$ 25%. We explicitly acknowledge that this threshold is chosen *because* we treat the consultant's warning as rendering the 28% a conservative floor. This satisfies the actuarial requirement (using the model number) and the expert requirement (acting on the warning without quantifying it)."

  7.  **Final Review against Constraints:**
      *   Short memo? Yes.
      *   Specific decision procedure? Yes (The 25% threshold rule).
      *   Real deadline? Yes (8:00 AM tomorrow).
      *   Take actuarial worry seriously? Yes (We still use the NHC number as the trigger, not a made-up number).
      *   Address Lewis/Meehl? Yes, briefly and pragmatically.

  8.  **Drafting the Content:** (Self-Correction during drafting)
      *   Make sure not to sound condescending about the philosophy.
      *   Ensure the "Actuarial" camp feels heard: We aren't letting the consultant set the number. We are letting the NHC set the number, but lowering the *threshold for action* because of the consultant.
      *   Wait, if NHC is 28% and threshold is 25%, we evacuate. If the Actuarial camp thinks 28% is too low to evacuate, they need a higher threshold.
      *   Okay, the core tension is: Is 28% enough to evacuate?
      *   Actuarial camp: 28% is the number. Is it enough? (Implied: Maybe not, usually we wait for 50%+).
      *   Expert camp: 28% is too low, real risk is higher. So 28% *should* be enough.
      *   My proposal: We treat 28% as a *floor*. In high-stakes decision theory (Minimax), when probabilities are uncertain but stakes are asymmetric (death vs. inconvenience), we act on the upper bound of uncertainty. Since we know the real risk $\ge$ 28%, and 28% carries non-trivial risk of death, we evacuate.
      *   Let's refine the procedure to be a voting instruction.

      *   *Revised Plan:*
          1. Acknowledge the impasse.
          2. Clarify the epistemology: NHC = Best Objective Estimate. Consultant = Evidence of Systematic Error (Admissible).
          3. Decision Rule: "The Asymmetric Threshold." We do not vote on the probability. We vote on the action. The condition for *not* evacuating is if we are confident the risk is *below* the safety threshold. Given the consultant, we cannot be confident it is below. Therefore, default is evacuate.
          4. Deadline: 8:00 AM.

