answer: |-
  This is a fantastic hook, but if you write that Harsanyi "proved utilitarianism full stop" and that non-utilitarians are just bad at math, you will invite a barrage of corrections from philosophers and economists that could undermine the credibility of the rest of your piece.

  The short answer is: **The theorem is real, but the interpretation your interviewees are giving you is much stronger than the math actually supports.** It is not a "proof" in the sense of a geometric theorem that forces reality to conform; it is a conditional result that depends on controversial ethical premises disguised as "rationality axioms."

  Here is the sanity check you need, broken down by where the argument holds water and where the load-bearing walls are actually made of drywall.

  ### 1. What the Theorem Actually Says (The "Yes" Part)
  Your interviewees are correct about the mechanics. John Harsanyi's Aggregation Theorem (1955) essentially states:
  *   If every individual's preferences satisfy the von Neumann-Morgenstern (VNM) axioms of expected utility (completeness, transitivity, continuity, independence).
  *   If social preferences also satisfy the VNM axioms.
  *   If the Pareto principle holds (if everyone prefers A to B, society prefers A to B; if everyone is indifferent, society is indifferent).
  *   **Then:** The social welfare function must be a **linear combination of individual utility functions.**

  Mathematically: $W = a_1U_1 + a_2U_2 + ... + a_nU_n + C$

  This *looks* like utilitarianism. It looks like you are summing up utilities. For the mathematically-minded wing of EA, this is catnip because it suggests utilitarianism isn't just a moral intuition; it's a requirement of coherence.

  ### 2. The Load-Bearing Cracks (The "No" Part)
  Here is why you cannot write that this "proves utilitarianism" in a way that settles the debate.

  #### A. VNM Utility $\neq$ Moral Welfare
  This is the biggest conceptual leap. In economics, VNM utility is a formal representation of **preferences under risk**. It measures how much risk you are willing to take to get what you want.
  *   **The Problem:** Just because I prefer chocolate to vanilla doesn't mean my "utility units" of chocolate are comparable to your "utility units" of vanilla in a moral sense.
  *   **The Implication:** Summing VNM utilities gives you a consistent social *choice* function, but it doesn't necessarily sum *well-being*. A sadist might have high VNM utility for seeing others suffer. Harsanyi's theorem says you should count that in the sum if you accept the axioms. Most utilitarians (and EAs) want to sum *welfare* or *happiness*, not just raw preference satisfaction. The theorem doesn't distinguish between the two.

  #### B. The Interpersonal Comparison Problem (Your Friend Was Right)
  Your economist friend mentioned "Sen" and "interpersonal comparisons." This is **not a footnote**; it is the central objection.
  *   **The Math:** VNM utility functions are unique only up to **positive affine transformations**. This means for any individual, $U$ and $2U + 100$ represent the exact same preferences. The zero point and the unit size are arbitrary.
  *   **The Consequence:** Without a way to fix the scales across people, the sum is meaningless. I can make anyone the "dictator" of the social welfare function just by rescaling their utility units (multiplying their $U$ by a million).
  *   **Harsanyi's Move:** Harsanyi essentially *assumes* we can make interpersonal comparisons to get the result. But the math doesn't *force* those comparisons; it requires them as an input. If you can't compare my utility to yours, the theorem doesn't get you to utilitarianism. Amartya Sen's entire career was largely built on showing that welfare economics cannot bypass this measurement problem.

  #### C. The Axioms Are Ethical, Not Logical
  Your source claimed the axioms are "boring, near-tautological." This is false. The VNM axioms are substantive ethical commitments.
  *   **The Independence Axiom:** This is the big one. It implies that if you prefer A to B, you should still prefer a gamble involving A over the same gamble involving B, regardless of the background risk.
  *   **The Pushback:** Many non-utilitarian theories (like Rawls' Maximin or Prioritarianism) explicitly **reject** the Independence Axiom in moral contexts. A Rawlsian might say, "I prefer a guaranteed minimum for the worst-off over a higher average that risks catastrophe." This violates Independence.
  *   **The Verdict:** A Rawlsian isn't "bad at math"; they are rejecting a specific axiom of expected utility theory because they believe it fails to capture moral risk aversion. Harsanyi's theorem only works *if* you accept that moral choices should follow the same rules as gambling choices. That is a philosophical claim, not a mathematical proof.

  #### D. Weights Matter
  The theorem proves the social function is a *weighted* sum ($\sum a_i U_i$). It does **not** prove the weights must be equal ($a_i = 1$).
  *   Classical utilitarianism says "everyone counts for one."
  *   Harsanyi's theorem allows for "some people count for more."
  *   To get to standard utilitarianism, you need an additional symmetry argument (often derived from Harsanyi's *other* argument, the Veil of Ignorance, not the Aggregation Theorem).

  ### 3. How to Frame This in Your Piece
  You can absolutely keep the hook, but you should frame it as the **EA aspiration** rather than an **established fact.**

  **Don't write:**
  > "Harsanyi proved utilitarianism, meaning anyone who disagrees is mathematically incoherent."

  **Do write something like:**
  > "For the mathematically inclined, Harsanyi's Aggregation Theorem offers a tantalizing proposition: that utilitarianism isn't just a moral preference, but a requirement of rational consistency. If you accept that society should be as rational as an individual under uncertainty, the math seems to force you into summing utilities. But critics argue this relies on treating ethical axioms like laws of physics—and assumes we can compare human happiness with the precision of a ruler, a leap that economists like Amartya Sen argue the math simply cannot support."

  ### Summary for your notes:
  1.  **Is the math right?** Yes, given the premises.
  2.  **Are the premises neutral?** No, they are controversial ethical claims (specifically regarding risk and interpersonal comparison).
  3.  **Did it settle the debate?** No. It moved the debate from "Is utilitarianism good?" to "Are VNM axioms appropriate for moral choice?"
  4.  **Is Sen a footnote?** No, he is the main counter-voice. Ignoring him would be like writing about gravity without mentioning Einstein.

  If you characterize it as a **"powerful argument that relies on contentious definitions of rationality,"** you will be accurate. If you characterize it as a **"proof that ends the debate,"** you will be repeating a common misconception within the EA bubble that doesn't hold up outside of it.
