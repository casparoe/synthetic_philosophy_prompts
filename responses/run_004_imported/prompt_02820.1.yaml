prompt: |-
  I'm working on a piece about the more mathematically-minded wing of effective altruism, and I keep running into an argument that would be a great hook for the piece if its actually true, so I want to sanity check it before I write it up. A couple of people I've interviewed told me that Harsanyi's aggregation theorem basically proves utilitarianism. Here's the version I got: if both individuals and "society" are rational in the standard economic sense (preferences satisfying what economists call the von Neumann-Morgenstern axioms for choice under uncertainty), plus one mild condition -- if literally everyone is indifferent between two options, society has to be indifferent too -- then you're mathematically forced into a social welfare function that's just a weighted sum of everybody's individual utility. One guy pitched it to me as basically the utilitarian mirror image of Arrow's theorem: instead of proving something's impossible, it proves that once you accept a handful of boring, near-tautological axioms about rationality, you don't get to pick your ethical theory anymore -- the math picks it for you.

  If that's right, it seems like a much bigger deal than just another move in a philosophy seminar, since it would mean Rawlsians, virtue ethicists, and everybody else who isn't already a utilitiarian is just refusing to follow their own premises to their logical conclusion. The only pushback I got was from an economist friend, who mentioned something about "Sen" and interpersonal comparisons being an issue, but she was heading into a meeting and it came out sounding like a footnote-level technicality rather than a real crack in the argument. So, gut check: is it fair to tell readers that Harsanyi mathematically proved utilitarianism, full stop, and that everyone still arguing about ethics after 1955 hasn't caught up? Or is something load-bearing getting lost between the actual theorem and the version that's making the rounds?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Harsanyi's Aggregation Theorem and its relationship to Utilitarianism.
      *   **Context:** The user is writing a piece on the mathematically-minded wing of Effective Altruism (EA).
      *   **Claim to Verify:** "Harsanyi's aggregation theorem basically proves utilitarianism." Specifically, if individuals and society are VNM-rational + Pareto indifference (if everyone is indifferent, society is indifferent), then social welfare *must* be a weighted sum of individual utilities.
      *   **Implication:** If true, non-utilitarian ethical theories (Rawlsian, virtue ethics, etc.) are mathematically incoherent given standard rationality axioms.
      *   **Counter-argument heard:** An economist friend mentioned "Sen" and "interpersonal comparisons" as a potential issue, but dismissed it as a technicality.
      *   **Goal:** Sanity check the claim. Is it fair to say Harsanyi *proved* utilitarianism full stop, or is something load-bearing being lost?

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *What is Harsanyi's Aggregation Theorem?* It states that if individual preferences and social preferences satisfy the VNM axioms (expected utility theory) and the Pareto principle (specifically Pareto indifference or strong Pareto), then the social welfare function is a linear combination of individual utility functions. $W = \sum a_i U_i$.
      *   *Does this equal Utilitarianism?* It looks like utilitarianism (summing utilities).
      *   *What are the caveats?*
          1.  **VNM Utility is Cardinal but not Interpersonally Comparable:** VNM utility functions are unique only up to positive affine transformations ($U' = aU + b$). This means the zero point and the unit size are arbitrary for each individual.
          2.  **The Weights ($a_i$):** The theorem allows for weights. Classical utilitarianism usually implies equal weights ($a_i = 1$). Harsanyi's theorem doesn't dictate the weights; it just says the structure *must* be linear.
          3.  **Interpersonal Comparison:** To make the sum meaningful (e.g., to say taking 10 utils from Bob to give 11 to Alice is good), you need to fix the scales across people. The theorem itself doesn't do this. It assumes the utility functions are *given* in a comparable form, or it leaves the weighting as a normative choice.
          4.  **The "Veil of Ignorance" vs. Aggregation:** Harsanyi has *two* arguments. One is the Aggregation Theorem (ex-post). The other is the Veil of Ignorance argument (ex-ante). The user is asking about the Aggregation Theorem.
          5.  **Sen's Critique:** Amartya Sen is the big name here. He argued that VNM utility is about *risk preferences*, not *welfare intensity*. Just because I prefer A to B doesn't mean the "distance" between A and B represents my well-being in a way comparable to yours.
          6.  **Axioms aren't "Boring/Tautological":** The VNM axioms (Independence, Continuity, etc.) are controversial in ethics. For example, the Independence axiom leads to counterintuitive results in some moral contexts (e.g., catastrophic risks vs. certain small harms).
          7.  **Non-Utilitarian Theories:** Do they violate VNM? Some might. Rawls' Maximin, for instance, violates the Independence axiom (Allais paradox style). So, a Rawlsian can say, "I reject the Independence axiom for social choice," not "I bad at math."

  3.  **Synthesize the "Load-Bearing" Issues:**
      *   **Issue 1: The Meaning of "Utility".** VNM utility $\neq$ Hedonic/Benthamite utility. It's just a representation of preference ordering under risk. Summing them doesn't necessarily sum "happiness."
      *   **Issue 2: Interpersonal Comparisons.** The theorem requires fixed scales to be utilitarian in the normative sense. Without fixing the $a$ and $b$ in the affine transformations, the sum is meaningless. Harsanyi assumes we *can* compare, but the math doesn't force *how*.
      *   **Issue 3: The Axioms.** The VNM axioms are not neutral "rationality" truths. They are substantive ethical commitments. Rejecting them isn't irrational; it's adopting a different ethical framework (e.g., prioritarianism, sufficientarianism, Rawlsianism).
      *   **Issue 4: Weights.** The theorem allows weighted utilitarianism. It doesn't prove *classical* utilitarianism (equal weights).
      *   **Issue 5: Sen's Critique.** It's not a footnote. It's a fundamental objection to using VNM utility as a proxy for welfare.

  4.  **Drafting the Response:**
      *   *Tone:* Professional, nuanced, helpful for a journalist/writer. Avoid overly dense jargon but don't oversimplify.
      *   *Verdict:* The claim is **too strong**. It's not a "full stop" proof. It's a conditional result that relies on controversial premises.
      *   *Structure:*
          1.  Direct Answer: It's a powerful argument, but "proved utilitarianism full stop" is misleading.
          2.  What the Theorem Actually Says (The "Yes" part): Confirm the math structure (linear combination).
          3.  The Big Caveats (The "No" part):
              *   Utility definition (Preference vs. Welfare).
              *   Interpersonal Comparison (The scaling problem).
              *   The Axioms (Independence is not tautological).
              *   Weights (Equal vs. Weighted).
          4.  Sen's Objection (Elevate this from footnote to central critique).
          5.  Implications for the Article: How to frame this accurately without losing the hook.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between Harsanyi's *Aggregation Theorem* and his *Veil of Ignorance* argument. The user specifically asked about Aggregation. Keep the focus there, but maybe mention Veil as context for why EA likes Harsanyi.
      *   *Emphasis:* Highlight that rejecting VNM axioms isn't "irrational" in a moral context. Many ethical systems violate Independence.
      *   *EA Context:* Acknowledge why EAs like this (it gives a mathy foundation), but warn that it's a "if-then" statement, not an "is" statement.

  6.  **Final Polish:** Check against the user's specific phrasing ("math picks it for you," "everyone else... hasn't caught up"). These are the specific claims to push back on gently but firmly.

      *   *Key phrase to include:* "Garbage in, garbage out." If you define rationality in a utilitarian-friendly way, you get utilitarianism out.
      *   *Key concept:* "Affine transformations." Need to explain this simply. (Zero points and units are arbitrary).

  7.  **Final Review against Safety Guidelines:** No sensitive topics, no harmful advice. Just philosophical/economic analysis. Safe to proceed.

  **(Self-Correction Note):** I need to make sure I don't get bogged down in the math of affine transformations but explain *why* it matters (i.e., I can rescale your utility to make the sum anything I want unless we agree on a scale).

