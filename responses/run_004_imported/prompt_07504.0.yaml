      *   **Inertia:** Everyone knows $t$-tests and ANOVA. Changing software, curricula, and reviewer expertise takes time.
      *   **Misuse:** Bayesian methods can be misused too (e.g., tuning priors until significance is reached).
      *   **Root Cause Misdiagnosis:** The crisis isn't just about the *metric*; it's about the *incentive structure* (publish or perish).

