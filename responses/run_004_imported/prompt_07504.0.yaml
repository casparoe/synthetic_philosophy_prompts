      *   *Claim:* Bayesian stats *do* give $P(H|D)$. **Technically True, but with caveats.** They give $P(H|D)$ *conditional on the prior*.
      *   *Claim:* This is the *real root cause* of the replication crisis. **Debatable/Oversimplified.** While $p$-value misuse is a major factor, it's not the *only* factor. Publication bias, p-hacking, low power, and questionable research practices (QRPs) are equally or more important.
      *   *Claim:* Switching to Bayesian fixes it. **False.** You can p-hack a Bayes Factor. You can have informative priors that bias results. You can still have low power.

  3.  **Evaluate the User's Conclusion:**
