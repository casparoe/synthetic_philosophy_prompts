prompt: |-
  For my research methods class we've been covering the replication crisis (like how the Open Science Collaboration project only got something like a third of psych studies to replicate). My professor's basic point was that the real root cause is that p-values don't actually tell you the probability your hypothesis is true, whereas Bayesian stats (Bayes factors etc) actually can. So wouldn't just requiring Bayesian analysis instead of p-values in top journals pretty much fix the replication crisis on its own? Kinda confused why more fields havent made the swich already if its that straightforward.
