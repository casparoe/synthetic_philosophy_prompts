answer: |-
  Good evening, everyone. For those who don't know me, I'm the eldest, which apparently means I'm the one holding the microphone tonight.

  Mom, Dad, fifty years. It is a staggering amount of time. It's half a century of mornings, of bills, of holidays, of quiet Tuesdays. And standing here, looking at the two of you, I find myself thinking about my work. I'm currently in a seminar on metaphysics, specifically on how objects persist through time. It sounds dry, I know. But lately, it hasn't felt like an abstract puzzle. It feels like the only question that matters.

  The question is this: Are we wholly present at every single moment of our lives, or are we long, four-dimensional shapes stretching from birth to death, made of many different temporal parts?

  I ask this because, as many of you know, Dad was diagnosed with Alzheimer's six weeks ago. We are living in the shadow of that word. And yet, tonight, Dad is finishing Mom's sentences exactly the way he always has. He is here.

  If I take the first view—that we are wholly present at every moment—then the most important thing is that Dad is *here*, right now. On this view, he is not diminished by what might happen in five years. He is fully himself in this chair, finishing Mom's sentences, laughing at my uncle's jokes. This view demands that we honor the person in the room, exactly as he is tonight, without subtracting from him based on a future that hasn't happened yet. It asks us to be present, because this is the only time he is wholly here.

  But there is the other view. That a life is a single, extended object. That the Dad of 1974, the Dad of 1995, and the Dad of tonight are all equally real parts of one long shape. On this view, the diagnosis cannot erase the earlier parts. The strength he showed when we were young, the patience he learned in his forties, the love he built with Mom over five decades—those are fixed coordinates in the shape of his life. They are not lost, even if the current slice of time is difficult. They are eternally true parts of who he is.

  I used to think I had to choose one of these views to find comfort. I thought I had to decide if Dad is an enduring soul facing decline, or a completed story where the early chapters remain safe.

  But watching you two tonight, I realize that a fifty-year marriage doesn't choose. It does both.

  Marriage requires the first view: showing up, wholly and completely, day after day. It requires looking at the person in front of you and saying, "You are enough, right now." But it also requires the second view: trusting the shape of the whole story. It is knowing that the love you built in the past is a structural support for the present, even when the present is heavy.

  We don't know what the future holds. We don't know how the puzzle of time will resolve itself, philosophically or medically. But we know that under either description, you have succeeded. You have been fully present for each other, and you have built a life that stands solid in time.

  So, I would like to propose a toast.

  To Mom and Dad. Thank you for teaching us that love is not just a moment, and not just a memory. It is the thing that holds both together. To fifty years, and to the truth of all of them. Cheers.
