      *   **Context:** Father diagnosed with early-stage Alzheimer's 6 weeks ago. He is still "himself" cognitively/socially for now, but the shadow is there. This is the first big gathering since diagnosis.
      *   **Speaker's Background:** Graduate student in metaphysics (persistence, endurantism vs. perdurantism).
      *   **Core Theme:** Use the metaphysical debate (endurantism vs. perdurantism) to frame the toast about marriage, time, and the father's condition.
      *   **Constraints:**
          *   Length: ~4 minutes (approx. 500-600 words spoken at a moderate pace).
          *   Tone: Toast, not a lecture. Emotional resonance is key.
          *   Content: Must address persistence and change specifically, avoiding clichés ("people change, love stays the same").
          *   Integrity: Cannot falsely resolve the metaphysical tension for the sake of comfort. Must honor the truth of both views or sit with the tension.
          *   Accessibility: Non-philosophers shouldn't feel lost; the cousin shouldn't feel the theory is botched.

  2.  **Deconstruct the Metaphysics:**
      *   **Endurantism:** Objects are wholly present at each moment. The father *is* here, now. If he changes, *he* changes. The risk: If he loses memory/capacity, *he* is diminished. The comfort: He is fully here tonight.
      *   **Perdurantism (Four-Dimensionalism):** Objects are space-time worms. Temporal parts exist. The father is the sum of all his moments. The risk: The "now" is just a slice. The comfort: Past stages (the vigorous, sharp father) are eternally real parts of the whole worm, even if the current slice is fading.
      *   **Lewis's Temporary Intrinsics:** How can $x$ be $F$ at $t_1$ and not-$F$ at $t_2$? (Bent vs. Straight). Applied here: How can Dad be sharp at $t_1$ and fading at $t_2$?
      *   **The Goal:** Find a way to validate the marriage and the father's identity without lying about the disease or forcing a metaphysical solution.

  3.  **Drafting - Section by Section:**

