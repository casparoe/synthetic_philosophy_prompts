      *   *Refining the Alzheimer's aspect:* It needs to be honest. He is still himself *now*, but the future is uncertain. The toast shouldn't pretend the disease doesn't exist, but it shouldn't be a eulogy either.

      *   *Refining the Metaphysics:* Lewis's problem of temporary intrinsics is about properties. Being "sharp" vs. "forgetful." How does marriage solve this? Maybe marriage is the relation that binds the temporal parts, or the substance that endures the property change. Let's try to balance them.

