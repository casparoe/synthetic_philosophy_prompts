      *(Self-Correction during drafting)*: I should make sure to mention that the President's Commission *did* discuss consciousness, but ultimately anchored the definition in the loss of *all* brain function to avoid the personhood debate. The "simple insight" the user teaches is actually the *Higher-Brain* argument, which was *rejected* as the legal standard in favor of the *Whole-Brain* argument. This is the crux of the resolution.

