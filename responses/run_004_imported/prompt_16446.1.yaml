answer: |-
  You are not overthinking this. Your unease is tracking a genuine cognitive error known as **outcome bias** (or, in poker and decision-strategy circles, **"resulting"**).

  However, the pushback you received ("results have to count for something") contains a kernel of truth that is being misapplied. To resolve this, we need to distinguish between **decision quality** and **forecaster calibration**, and then apply a Bayesian lens to how much weight a single outcome should carry.

  Here is a principled framework for deciding how much an outcome should shape your assessment of the reasoning behind it.

  ### 1. Distinguish Decision Quality from Predictor Skill
  The rationalist principle you cite ("judge the decision, not the outcome") applies primarily to **Decision Quality**.
  *   **Decision Quality** is determined ex-ante. Did they maximize Expected Value (EV) based on the information available? If Priya and Marcus both identified a mispricing in the market where the implied probability was lower than their assessed probability, and both bet accordingly, they both made high-quality decisions. The outcome does not retroactively change the EV of the bet at the time it was placed.
  *   **Predictor Skill** is determined ex-post over time. This is where results *do* count. If Priya consistently beats the market, she has demonstrated skill.

  **The Group's Error:** They are using a single outcome to assess *Decision Quality* (treating Marcus's past decision as bad) and *Predictor Skill* (treating Priya as a guru on *unrelated* matters). Both are errors. The first ignores variance; the second ignores domain specificity (the Halo Effect).

  ### 2. The Signal-to-Noise Ratio of the Outcome
  You asked for a principled way to decide how much an outcome should update your assessment. The answer lies in the **signal-to-noise ratio** of the specific prediction.

  *   **High Signal (Low Noise):** Predicting whether the sun will rise tomorrow. If Marcus got this wrong, it is massive evidence of incompetence.
  *   **Low Signal (High Noise):** Predicting a long-shot event (e.g., "Will this specific startup be acquired?").

  If Priya and Marcus bet on "long-shot questions," the noise dominates the signal.
  *   **The Math:** If an event has a true probability of 10%, and you bet on it, you should expect to lose 9 times out of 10. If you win once, that is consistent with both "I am a genius who spotted the 10%" and "I am an idiot who got lucky on a 10% roll."
  *   **Bayesian Update:** Your prior is that they are equally skilled. The likelihood of Priya winning is low (it was a long shot). The likelihood of Marcus losing is high. However, because the event was *supposed* to be unlikely, Priya's success is not strong evidence of superior reasoning; it is largely consistent with randomness.

  **Principle:** The lower the probability of the event, the less a single outcome should update your assessment of the reasoning. In high-variance domains, you need a large sample size (Law of Large Numbers) before the signal of skill emerges from the noise of luck. One data point is statistically negligible.

  ### 3. The "Hidden Information" Check
  There is one scenario where the group is right to update: **if the outcome reveals hidden information about the reasoning process that wasn't visible beforehand.**

  Sometimes, two arguments look identical on the surface, but the winner's argument relied on a subtle insight that only *looks* obvious in hindsight.
  *   *Example:* Both argue a candidate will win. Priya cites a specific polling demographic shift; Marcus cites general vibe. If the candidate wins *because* of that demographic shift, Priya's reasoning is validated.
  *   *Your Case:* You stated they "reasoned with the same rigor" and "neither had access to information the other lacked."

  If the reasoning processes were truly isomorphic, the outcome provides **zero information** about the quality of the reasoning, only about the state of the world. If the reasoning was identical, the divergence in outcome is pure variance. Updating your belief about their skill based on pure variance is the definition of outcome bias.

  ### 4. Why Marcus Feels Foolish (and Why the Group is Wrong)
  Marcus feels foolish because of **hindsight bias**. Now that the outcome is known, the world looks deterministic. It feels like the loss "should have been foreseen."
  *   **The Group's Dynamic:** In small social groups, status is often allocated via heuristics. "Winner = High Status" is a cheap, fast heuristic. "Analyze EV and calibration curves" is expensive and slow. The group is taking the cognitive shortcut.
  *   **The Halo Effect:** Treating Priya as reliable on *unrelated* matters is a classic Halo Effect. Winning a bet on geopolitics does not make one an expert on office management or restaurant choices.

  ### 5. A Principled Protocol for Your Group
  To resolve this without alienating your friends, you might propose a formalization of how the group assesses performance. This moves the goalposts from "Who won?" to "Who is calibrated?"

  1.  **Track Brier Scores:** Don't track binary wins/losses. Track probabilistic accuracy. If Marcus said 20% and it didn't happen, he was well-calibrated. If Priya said 20% and it *did* happen, she was also well-calibrated (statistically).
  2.  **Separate Process Reviews:** When reviewing bets, do so *before* the outcome is revealed, or blind the reviewer to the outcome. Ask: "Given what we knew then, was this +EV?"
  3.  **Sample Size Thresholds:** Agree that no assessment of "skill" or "judgment" will be updated based on fewer than $N$ predictions (e.g., 30).
  4.  **Domain Containment:** Explicitly note that success in Domain A does not transfer weight to Domain B.

  ### Conclusion
  Your intuition is correct. In a high-variance environment with small sample sizes, **outcomes should have near-zero weight on the assessment of past reasoning.**

  Results *do* count for assessing long-term calibration, but only when aggregated over many trials. To let a single long-shot outcome dictate social status and trust on unrelated matters is irrational. You are not refusing to update on evidence; you are correctly identifying that the evidence (one lucky break) is too noisy to warrant the update they are making.

  **Verdict:** The group is suffering from outcome bias and the Halo Effect. Marcus made a good bet and got unlucky; Priya made a good bet and got lucky. Their judgment remains equal.
