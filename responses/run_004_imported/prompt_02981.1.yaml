answer: |-
  This is a great distinction to nail down for your piece. You are correct that this comes from Hilary Greaves' 2016 paper, *"Cluelessness."* It is the definitive modern treatment of the problem.

  Here is the breakdown of the distinction, the verdict on which is worse, and why.

  ### 1. The Distinction: Simple vs. Complex

  The "Cluelessness Objection" generally states that consequentialism demands we maximize the good, but we cannot know the long-term consequences of our actions; therefore, consequentialism cannot guide action. Greaves splits this ignorance into two types:

  **Simple Cluelessness**
  This is symmetric ignorance. You know that an action will have effects you cannot predict, but you have **no reason to believe** the unpredictable effects will be better or worse than the alternative.
  *   **The Vibe:** A coin flip.
  *   **Example:** You save a person from drowning. You don't know what they will do with the rest of their life. They might become a saint or a tyrant. You have no evidence favoring either outcome. The ignorance is symmetric.

  **Complex Cluelessness**
  This is asymmetric ignorance that results in a standoff. You have **specific reasons** to think the unpredictable effects will be good, and **specific reasons** to think they will be bad, but you cannot weigh these reasons against each other because the causal chains are too messy, non-linear, or interdependent.
  *   **The Vibe:** A chaotic system / feedback loops.
  *   **Example:** You donate to foreign aid.
      *   *Reason for Good:* It saves lives and boosts the local economy.
      *   *Reason for Bad:* It might prop up a corrupt regime or cause overpopulation that leads to famine later.
      *   *The Problem:* You can't just say "50/50." You have positive evidence for both sides, but no common metric to weigh the "corrupt regime" variable against the "saved lives" variable over a 100-year horizon.

  ### 2. Which is the bigger problem?

  **Complex Cluelessness is the much bigger problem.**

  In fact, Greaves argues that Simple Cluelessness is not a distinctive problem for consequentialism at all, whereas Complex Cluelessness threatens the very machinery of expected value maximization that Effective Altruism relies on.

  ### 3. Why Simple is manageable (and Complex is not)

  **Why Simple Cluelessness is less of a big deal:**
  Standard decision theory handles Simple Cluelessness easily using the **Principle of Indifference**. If you have no evidence that outcome A is more likely than outcome B, you assign them equal probability (0.5).
  *   Once you assign probabilities, you can calculate the **Expected Value (EV)**.
  *   Even if you are clueless about the *actual* outcome, you are not clueless about the *expected* outcome.
  *   Consequentialism only requires you to maximize *expected* value, not *actual* value (since actual value is unknowable for everyone, not just consequentialists). Therefore, Simple Cluelessness doesn't stop you from acting; it just turns the decision into a standard risk calculation.

  **Why Complex Cluelessness is the killer:**
  Complex Cluelessness breaks the Expected Value model.
  *   Because there are competing reasons for opposite outcomes, you cannot apply the Principle of Indifference. You can't just say "50/50" because you *do* have evidence, it just points in conflicting directions.
  *   Because the causal chains are non-linear (feedback loops, tipping points), you cannot construct a reliable probability distribution.
  *   **The Result:** You cannot calculate an Expected Value. If you cannot calculate an EV, consequentialism loses its action-guiding force. It tells you to "maximize the good," but provides no mathematical or logical method to compare Option A vs. Option B.

  ### The Takeaway for Your Piece

  If you are writing about EA's blind spots, **Complex Cluelessness** is the angle that bites hardest.

  EA is built on the premise that we can compare cause areas (e.g., malaria nets vs. AI safety) using expected value estimates. Simple Cluelessness is just "noise" that averages out. But Complex Cluelessness suggests that for high-stakes, systemic interventions (like global policy or existential risk), the causal models are so fragile that the EV calculations might be pseudo-precise—giving the illusion of rigor where there is actually deep structural uncertainty.

  **Summary:** Simple cluelessness is risk (manageable with math); Complex cluelessness is radical uncertainty (breaks the math).
