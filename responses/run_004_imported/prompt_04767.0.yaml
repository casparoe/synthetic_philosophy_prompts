answer: |-
  "You're drowning the text," Elara said, throwing the score onto the piano. "Again."

  Julian didn't look up from the keys. "I'm lifting it. There's a difference."

  "In *Così*, the text is a trap. Da Ponte wrote a cynical bet. Two men wagering that women are fickle. It's structural. It's cold."

  "And yet," Julian played a fragment of *Come scoglio*, the chords heavy, resonant, painfully sincere. "When Fiordiligi sings this, she isn't playing a role in a bet. She's breaking. The music knows she's falling in love with the disguise, even while the words swear fidelity. If I score it cynically, I'm lying."

  "You're sentimentalizing the critique!" Elara leaned over the piano, her voice tight. "The point isn't whether they love each other. It's that the *game* corrupts the love. If your music is too beautiful, you erase the corruption. You make the poison look like wine."

  "Because the poison *is* the wine, Elara. That's opera. Words lie; people lie. They say it's a game because they're terrified. The music is the only thing telling the truth."

  "That's romantic nonsense. Without the text, that aria is just a wave form. It has no object. You need the scaffolding of the plot to give the sound meaning."

  "Scaffolding?" Julian stopped playing. The silence rushed in. "You think I build on your scaffolding? I build on the subtext you're too afraid to write. You wrote 'I am constant,' but I wrote 'I am terrified I won't be.' Which one is the drama?"

  "The drama is the conflict between the two!" She slammed her hand on the lid. "Williams knew this. It's not a hierarchy. But you're acting like the music swallows the words whole. If the music is always the ultimate truth, then the text is just program notes. Why bother writing anything at all?"

  "Because I need you to tell me what they're lying about!" Julian stood, matching her height. "I need the words to be the mask so the music can tear it off. But you… you want the music to obey the mask. You want the sound to be as cynical as the plot. That's not opera. That's radio drama with a backing track."

  "It's integrity!"

  "It's cowardice! You don't want the audience to feel the pain, you want them to understand the joke."

  "And you don't want them to understand anything, as long as they weep!"

  They stood breathing hard, the piano between them like a barricade. The argument about *Così* hung in the air, transparently about themselves.

  "If I make the music sincere," Julian said quietly, "it's because I believe the feeling survives the game. Even when the game wins."

  Elara looked at the closed keyboard. "Sometimes the game is all there is, Julian. Sometimes the music is just what we tell ourselves to survive that."

  "Then why," he asked, "did you always sing along?"
