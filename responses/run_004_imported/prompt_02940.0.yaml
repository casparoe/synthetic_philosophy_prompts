      *   **1. Introspective Opacity (Armstrong):**
          *   *Idea:* We don't see the physical mechanisms of perception, so we posit something non-physical. Like seeing a woman but not her head (due to a mirror trick) and thinking she's headless.
          *   *Explanatory Power:* High. It explains *why* the gap feels real. We lack access to the neural machinery, so the output (experience) seems disconnected from the input/process. It directly addresses the "explanatory gap."
          *   *Critique:* It's a classic cognitive error explanation. Fits Chalmers' meta-problem criteria well.
