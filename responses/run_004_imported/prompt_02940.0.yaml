      *   **2. Phenomenal Concept Strategy (PCS) (Loar/Papineau/Balog):**
          *   *Idea:* We use special concepts (phenomenal concepts) to think about experience that are distinct from physical concepts, creating an *illusion* of a metaphysical gap even if there isn't one.
          *   *Explanatory Power:* Very High. This is arguably the heavyweight champion of physicalist responses to the hard problem. It explains the *intuition* of distinctness via conceptual dualism rather than ontological dualism. Chalmers takes this very seriously in the meta-problem paper.
          *   *Critique:* Some argue it begs the question (do we really have these concepts without the phenomenology?), but as a meta-problem explanation, it's robust.
          *   *Tier:* S.

      *   **3. Primitive Quality Attribution (Color-illusion analogy):**
          *   *Idea:* We project qualities onto the world (like color) that aren't really there, and we do the same for internal states.
          *   *Explanatory Power:* Medium. It explains why we think qualia are simple/atomic, but it doesn't fully explain why the *feeling* of them seems irreducible. It shifts the mystery from "consciousness" to "why do we project primitives?"
          *   *Critique:* A bit vague compared to PCS or Opacity. "Projection" is a metaphor that needs mechanistic cashing out.
