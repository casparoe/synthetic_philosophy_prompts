          *   Explain why Plantinga avoids it (MG entails necessary *existence*, not necessary *action*). Contingent truths remain contingent.
          *   Confirm the asymmetry is genuine.
      *   **Section 2: Dialectical Advantage?**
          *   Plantinga's burden: Defending the coherence/possibility of MG. (Epistemic access).
          *   Gödel's burden: Defending the axioms of Positivity. (Metaphysical/Logical access).
          *   Does Gödel buy safety? He tries to prove consistency rather than stipulate it.
          *   However, the cost is high. The "Positive Property" axioms are opaque.
      *   **Section 3: Offsetting the Risk.**
