          *   Highlight the difference (Theological/Metaphysical vs. Physical/Dynamical).
      *   **Part 2: The Role of PSR:**
          *   Leibniz: PSR is the hammer.
          *   Einstein: Causality/Determinism is the hammer. PSR is in the background (no physical difference without a cause), but the threat is indeterminism.
      *   **Part 3: Substantivalist Replies:**
          *   Newton: Bucket (observable effects of absolute motion).
          *   Hole: Harder. No "bucket" equivalent because the difference is *inside* the hole where there is no matter. The reply is usually to deny the independent identity of points (which is what Einstein eventually did).
      *   **Part 4: Einstein's Plausible Reply (The Core for the Novel):**
          *   *Tone:* Respectful but firm. He's tired, stressed, working on the math.
          *   *Acknowledgment:* "Yes, the spirit is Leibniz."
          *   *Distinction:* "But Leibniz worried about God's boredom. I worry about whether the sun rises tomorrow." (Determinism).
          *   *The Math:* The Hole Argument isn't just philosophy; it's a blockage in the *math*. It says generally covariant equations are impossible *if* points are real.
          *   *The Resolution (if late 1915):* Points aren't real. Only coincidences are.
      *   **Part 5: Verdict on the Narrator:**
          *   She is right about the lineage.
          *   She is wrong to be *unimpressed*. The stakes are higher now. It's not just metaphysics; it's the consistency of the field theory.

  5.  **Refining the Physics/History:**
      *   *Correction:* In 1913, Einstein *used* the Hole Argument to *reject* general covariance. He thought generally covariant equations were incompatible with determinism.
      *   *Narrator's Challenge:* If she says "It's just Leibniz," she implies he shouldn't let it stop him (since we rejected absolute space).
      *   *Einstein's Counter:* "Leibniz could afford to be relational because Newton's physics worked anyway. I am trying to *build* the physics. If I accept general covariance without solving the Hole problem, my theory predicts nothing."
      *   *Key Terminology:* *Lochbetrachtung* (Hole Argument), General Covariance, Determinism, Point-Coincidence (*Pointkoinzidenz*).
      *   *Historical Note:* The term "substantivalism" is modern (Earman/Norton 1987). Einstein wouldn't use that word. He would talk about the "reality of the manifold" or "coordinates." I need to make sure the dialogue reflects 1915 language, not 1987 language.

