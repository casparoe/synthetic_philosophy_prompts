      *   **Context:** A novel set 1912-1915, Zurich/Berlin. Narrator is a fictional junior assistant to Einstein.
      *   **Scene:** Narrator challenges Einstein on the "Hole Argument" (*Lochbetrachtung*). She claims it's just Leibniz's "Shift Argument" against Newton/Clarke in new clothes.
