      *   In this period, Einstein believes the Hole Argument is a *fatal objection* to general covariance. The narrator is telling him to ignore it because it's old news.
      *   Einstein's defense must be: "It's not old news because it proves my equations *cannot* be generally covariant unless I change what I mean by 'physical reality'."

