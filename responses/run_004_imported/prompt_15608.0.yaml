      *   Uncertainty vs. Risk? Included.
      *   Strains of Commitment? Included.
      *   Harsanyi's Lexical Objection? Included.
      *   No strawmen? Both arguments are steel-manned.
      *   No forced resolution? Ends in productive tension.

  7.  *(Final Polish)*: Check the flow. Ensure Blake's argument about "repeatability" vs. "single shot" is clear. Ensure Alex's distinction between "gambling with chips" and "gambling with a life" lands.

  **(Self-Correction Note):** I need to be careful not to let Alex slide into utilitarianism by accident. Alex must defend the *threshold* nature of primary goods. Blake needs to emphasize that *expected utility* doesn't mean ignoring the poor, but weighing them proportionally.

