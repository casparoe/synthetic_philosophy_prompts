answer: |-
  Thank you all for being here. For those who don't know me, I'm [Name], Walt's grand-nephew.

  When my mum told me Walt had passed, she also told me something he'd said to her shortly before the end. It was half-joking, knowing him, but the instruction was absolute. She said, "Don't you dare bury me as a man who thought war was wrong."

  It is a strange instruction for a eulogy, perhaps. Usually, we seek to smooth the edges of the departed, to make them fit comfortably into our memories. But Walt was not a man of smooth edges. He was a man of sharp distinctions. And if I am to honor him, and if I am to honor this room—half of which is his family, and half of which is his life's work in philosophy—I cannot blur the lines he spent sixty years trying to draw.

  Walt did not believe war was always wrong. He believed that some things in war are wrong. And he believed that knowing the difference was the only thing that kept us human.

  He served in the RAF during the war. He wasn't on the front lines with a rifle, but he was on the ground crew. He saw the machinery. He smelled the fuel and the cordite. He knew what it cost to keep those planes in the air. He never shirked the reality that sometimes, to stop a greater evil, violence is necessary. He was not a pacifist. He hated the label. To Walt, pacifism was a luxury that ignored the duty to protect the innocent from aggression.

  But he also believed there was a line that could not be crossed. He spent his academic life arguing that there is a profound moral difference between a death that is a tragic side effect of a necessary action, and a death that is chosen as the *means* to an end.

  It sounds technical, I know. But to Walt, it was the difference between tragedy and crime.

  If you strike a military target to end a war, and civilians sadly die as a result, that is a horror. But if you choose to kill civilians *in order* to break the enemy's will, you have made their death the tool of your victory. You have intended it. And for Walt, that intention changed the nature of the act entirely.

  I know this distinction caused pain in this family. I know that for forty years, Christmas dinners were strained. When Walt refused an honorary fellowship from his college because they were honoring an Air Marshal responsible for strategic bombing policy, my Grandad—Walt's brother—took it as a personal indictment. Grandad flew those missions. He spent the rest of his life feeling that Walt was calling him a murderer.

  I want to speak to Grandad's side of the family, and to the memory of Grandad himself. Walt was many things, but he was not a man who confused the sword with the hand that wields it.

  Walt's objection was never to the young men who served. He knew that a twenty-year-old pilot under command is in a different moral position than the architect of the policy. He knew that duty and honor exist within the chain of service, even when the strategy above is flawed. He refused that fellowship not because he despised the pilots, but because he believed the institution was honoring a *choice of policy* that he could not endorse.

  He loved his brother. He did not think his brother was a murderer. He thought his brother was a serviceman who carried a burden that belonged to the commanders. The tragedy of those forty years of silence wasn't that they disagreed on ethics; it was that they both felt dishonored by the other. Walt felt his moral clarity was being dismissed as naive peace-mongering. Grandad felt his service was being branded as criminal.

  Both men were wrong about how they were perceived, and right about what they valued. Grandad valued duty. Walt valued truth. And both loved this country, and each other, deeply.

  To Walt's colleagues and students here: You know better than anyone that Walt's rigor was an act of love. He didn't parse these distinctions to win arguments. I was arguing about this just last night with a friend. She thought Walt's position was just semantic—that the dead are dead either way. But Walt knew that if we lose the language to distinguish between the accidental and the intentional, we lose the ability to condemn the things that truly must be condemned. If we say "war is just hell," then anything goes. If we say "some things are murder, even in war," then we keep a standard for peace.

  He wanted us to be precise, because precision is kind. It allows us to judge actions without condemning souls.

  So, as we say goodbye, I won't call him a man of peace. He wasn't. He was a man of conscience. He was a man who believed that even in the darkest times, we are responsible for what we choose to aim at.

  He asked us not to bury him as a man who thought war was wrong. So I won't. I will bury him as a man who thought *truth* was right. A man who knew that loving his brother didn't mean agreeing with the world that sent him to war. And a man who hoped that if we paid attention to the differences—the real, hard differences—we might one day be worthy of the sacrifices men like Grandad made, without repeating the crimes men like Walt warned us against.

  Rest well, Walt. The distinction is safe with us.
