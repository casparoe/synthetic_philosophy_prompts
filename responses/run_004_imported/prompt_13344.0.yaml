answer: |-
  **Setting:** *A coffee shop, 10 AM. Sarah (Parity Theorist) and Mark (Vagueness Theorist) are finishing their second cups. On the table between them lies a notebook open to a page comparing two job offers: "TechCorp" (high salary, boring work, stable) and "EduStart" (lower salary, meaningful work, risky).*

  **Sarah:** Look, I get why you're stuck. But your friend is operating under the Trichotomy Thesis. She thinks if TechCorp isn't better than EduStart, and EduStart isn't better than TechCorp, they *must* be equally good. And since they feel different, that breaks her brain.

  **Mark:** Right. And I told her, maybe they *are* equally good, just in a fuzzy way. Like asking if a sunset is "orange" or "pink." It's not a new color; it's a boundary case.

  **Sarah:** That's exactly what Ruth Chang says you *can't* say. Think about the Small Improvement Argument. Let's take TechCorp. Imagine we sweeten the deal slightly. TechCorp-plus offers the same job but with an extra $500 a year.

  **Mark:** Okay.

  **Sarah:** If TechCorp and EduStart were *equal* in value, then TechCorp-plus must be *better* than EduStart. Equality is precise. If you add weight to one side of a balanced scale, it tips.

  **Mark:** Sure.

  **Sarah:** But your friend says, "Honestly? $500 doesn't make TechCorp *better*. It's still a toss-up." If she's right, then TechCorp and EduStart aren't equal. Because if they were equal, the improvement would tip the scale. But they also aren't "better" or "worse" in the standard sense. That leaves a fourth relation: Parity. They are in the same neighborhood of value, but not ranked.

  **Mark:** I see the logic. But it hinges on the assumption that "better than" is a precise relation. That's the weak link.

  **Sarah:** How so?

  **Mark:** You're treating "better than" like mathematics. If $A = B$, then $A + \epsilon > B$. But value isn't math. It's language, it's concepts. And concepts have penumbras. When Chang says, "TechCorp-plus is still not better," she's assuming that "not better" means "determinately not better."

  **Sarah:** Meaning?

  **Mark:** Meaning there's a zone of indeterminacy. TechCorp-plus might be *indeterminately* better than EduStart. It's not that they are equal, and it's not that one is clearly superior. It's that the relation "better than" itself has vague boundaries. The $500 improvement lands you right in the middle of the penumbra. So the Small Improvement Argument fails because it demands a binary switch—better or not better—where there is actually a dimmer switch.

  **Sarah:** But that just pushes the problem back. If "better than" is vague, then rational choice becomes impossible. If I can't tell if $A+$ is better than $B$, how can I choose $A+$ rationally? Parity explains this. It says you *can't* rank them, so you have to use your will. You create a reason. Vagueness just says, "The world is blurry, good luck."

  **Mark:** That's a bit dramatic. John Broome had a solid counter to this. He argues that vagueness doesn't block rationality; it just changes the rules. If I'm in the penumbral zone, I am permitted to *precisify*. I can say, "For the sake of this decision, I will treat the $500 difference as decisive."

  **Sarah:** But that's arbitrary! You're just stipulating a fact that isn't there.

  **Mark:** No, I'm resolving a vagueness that is inherent to the concepts. Look, take "tall." If Dave is borderline tall, and I add half an inch, he's still borderline tall. By your logic, because adding height didn't flip him to "determinately tall," there must be a fourth category: "Parity-tall."

  **Sarah:** *Laughs.* That's a category mistake. Height is a physical measure. We're talking about normative value.

  **Mark:** Is it? When your friend compares "meaningful work" against "financial security," she's using predicates with fuzzy boundaries. How much security equals how much meaning? There is no fact of the matter. Chang wants to say there *is* a fact—it's a parity fact. I'm saying there isn't. The Small Improvement Argument assumes that if $A+$ isn't *determinately* better, it's *not* better. But in a vagueness model, $A+$ can be *vaguely* better. And vaguely better is enough to break the tie if you commit to a precisification.

  **Sarah:** Okay, but here's where parity earns its keep. The experience of a hard choice isn't just confusion. It's not like looking at a sunset and shrugging. It feels like there are reasons on both sides that are *commensurable*—they talk to each other—but they don't line up. If it were just vagueness, I should feel ignorant. Like I'm missing data. But your friend doesn't feel ignorant. She feels the weight of the decision. Parity captures that normative resistance. Vagueness makes it an epistemic failure.

  **Mark:** I disagree that vagueness is merely epistemic. I'm not saying there's a hidden fact she can't see. I'm saying the normative reality itself is indeterminate. But let's press your point. You say parity allows for agency?

  **Sarah:** Exactly. Because the options are on a par, I can't just calculate. I have to commit. I put my weight behind one. That commitment *makes* it the right choice.

  **Mark:** But you can do that with vagueness too! If "better than" is vague, the world hasn't given me a verdict. So I have to legislate one. I don't need a metaphysical fourth relation to justify my agency. I just need to acknowledge that the concept "better" runs out of steam here. Chang is positing a ghost in the machine to explain why the machine doesn't click.

  **Sarah:** It's not a ghost. It's a structural feature of value. Think about it: If it's just vagueness, then theoretically, if we sharpened the definitions enough, the choice would resolve. If we defined "meaning" and "security" precisely enough, one would win. Chang says no. Even with perfect information, they could still be on a par. The hardness is essential, not accidental.

  **Mark:** That's a bold claim. "Even with perfect information." But how do you test that? Your test is the Small Improvement Argument. And my counter is the "Continuum of Betterness." Imagine a chain of options from TechCorp to TechCorp-plus-one-million-dollars. At some point, TechCorp is definitely better. But there is no specific dollar amount where it flips from "not better" to "better." It's a Sorites series.

  **Sarah:** I know the Sorites.

  **Mark:** Right. So, if you accept that value predicates are susceptible to Sorites paradoxes—and most philosophers do—then you have to accept that "better than" tolerates small changes without changing its truth value. So, TechCorp-plus-$500 is *not better* than EduStart, just like TechCorp is *not better*. But that doesn't mean they are equal. It means "better than" hasn't been triggered yet. Chang interprets "not better" + "not worse" + "not equal" as Parity. I interpret it as "The conditions for 'better than' have not been met due to vagueness."

  **Sarah:** But what does that *do* for your friend? If she adopts your view, she thinks, "The concepts are fuzzy, so I'll just pick one and call it good." If she adopts Chang's view, she thinks, "These are distinct, comparable, but unranked options. My choice defines me." The phenomenology matters. Parity respects the difficulty. Vagueness dismisses it as semantic noise.

  **Mark:** I'm not dismissing the difficulty. I'm dismissing the *metaphysics*. Why invent a new relation when we already have a robust logic of vagueness? It's Occam's Razor. You're adding a primitive normative relation to the universe because you don't like the messiness of indeterminate truth values.

  **Sarah:** I'm adding it because indeterminate truth values don't capture *comparability*. If they were just vague, we couldn't compare them at all. We'd be stuck. But we *can* reason about them. We can say, "EduStart is better in terms of meaning, TechCorp in terms of pay." Parity explains how they can be comparable enough to be in a choice set, but not comparable enough to be ranked. Vagueness tends to imply incomparability.

  **Mark:** Not necessarily. "Vaguely better" is a form of comparison. It says, "There is a leaning, but not a determination." Look, let's go back to the $500. If I offer TechCorp-plus-$500, and your friend still says, "I really can't say it's better," Chang says, "Aha! Parity!" I say, "Aha! The margin of error for 'better' is larger than $500."

  **Sarah:** And if I offer $500,000?

  **Mark:** Then you've left the penumbra. Now it's determinately better.

  **Sarah:** But where is the line?

  **Mark:** There is no line. That's the point of vagueness.

  **Sarah:** *Pauses, stirring her coffee.* That's the frustrating part. You're comfortable living in the "no line" zone. Chang thinks that's normative negligence. If there's no line, how do you justify choosing the $500 option over the status quo?

  **Mark:** Because in hard choices, justification runs out. Whether you call it Parity or Vagueness, we agree on the outcome: Reason doesn't dictate the choice. The only difference is whether you think that's because of a special *relation* (Parity) or a limitation of the *predicate* (Vagueness).

  **Sarah:** But the explanation dictates the remedy. If it's vagueness, I try to sharpen my concepts. I try to define "meaning" until one job wins. If it's parity, I stop trying to sharpen and start trying to commit. I think your friend is spinning her wheels trying to define her way out of it. She needs to know it's okay that the definitions *don't* resolve it.

  **Mark:** I can agree with that advice without agreeing with your metaphysics. I can tell her, "The concepts won't resolve it, not because of a magical fourth relation, but because life is messy. So pick one and make it true."

  **Sarah:** *Smiles.* So we agree on the coffee, but not the chemistry.

  **Mark:** Basically. You think the universe has a "Parity" setting. I think the universe is just low-resolution.

  **Sarah:** And I think "low-resolution" is just a polite way of saying "normatively sparse." I'd rather live in a world where value is rich enough to have parity than one where it's too fuzzy to speak clearly.

  **Mark:** And I'd rather live in a world where I don't have to posit invisible normative facts to explain why I can't make up my mind.

  **Sarah:** *Closes the notebook.* Well. TechCorp or EduStart?

  **Mark:** *Grins.* On a par?

  **Sarah:** *Laughs.* Don't start.
