answer: |-
  This is an incredibly painful and disorienting place to be. You are dealing with a intense somatic reaction (getting physically sick), a shift in your family structure, and a partner who is intellectualizing your pain rather than holding space for it.

  To answer your question directly: **You are likely thinking about the *stakes* and the *reality* more clearly, while he is thinking about the *theory* and the *possibility* more clearly.**

  However, clarity isn't the main issue here. The main issue is that your distress is being invalidated. Here is a breakdown of the dynamics at play, why your intuition about his "convenience" is spot-on, and why your physical reaction matters more than his theory.

  ### 1. The "Property" Argument is a Dismissal
  When your husband says jealousy is "leftover thinking from treating spouses like property," he is using a common talking point from the polyamory community that can often function as a shield against accountability.
  *   **Why it's flawed:** Jealousy is not just about ownership. In attachment theory, jealousy is a signal that a primary bond feels threatened. It is a biological alarm system related to security, safety, and fear of abandonment.
  *   **The impact:** By framing your pain as a moral or intellectual failing (i.e., you are "possessive" or "conditioned"), he is subtly gaslighting you. It shifts the burden entirely onto you to "fix" your emotions, rather than onto the relationship to ensure both partners feel safe.

  ### 2. "Exposure Therapy" Requires Consent and Pacing
  He is technically correct that sitting with difficult emotions can reduce their power over time. However, applying this as a relationship strategy without your full, enthusiastic consent on the *pace* is dangerous.
  *   **Trauma vs. Growth:** Exposure therapy works when the patient controls the timeline and feels safe. If you are pushed into a situation that makes you physically ill and told to "just sit with it," that is not therapy; that is flooding. It can traumatize you and associate your partner with feelings of sickness and panic.
  *   **The Veto Power:** In healthy open relationships, if one partner is in distress, the other usually hits the brakes. The fact that he is encouraging you to push through the sickness suggests he prioritizes the *opening of the marriage* over your *immediate well-being*.

  ### 3. Your Intuition About "Convenience" is Correct
  You noted that it is "awfully convenient for him to believe that." This is a crucial insight.
  *   **Beneficiary Bias:** He is the one currently experiencing the dopamine hit of a new connection. He is not the one staying home feeling sick. It is very easy to preach emotional regulation when you are the one out having fun.
  *   **The Labor Imbalance:** Right now, you are doing all the emotional labor. You are managing the jealousy, the childcare, the household stability, and the anxiety, while he manages the excitement. This imbalance often breeds resentment, which is much harder to "train away" than jealousy.

  ### 4. The Child Changes the Stakes
  You are absolutely right that having a three-year-old changes everything.
  *   **Hypothetical vs. Reality:** Arguing at 1 AM is low-stakes. Implementing a change that could destabilize the family unit is high-stakes.
  *   **Security:** Children thrive on predictability. If your marriage is in turbulence, the child feels it. Your instinct to protect the stability of your child's home is not "jealousy"; it is **maternal protection**. That is a biological imperative, not a social construct.

  ### Who is thinking clearly?
  *   **He** is thinking clearly about what *he wants* and how he hopes the dynamic *could* work in an ideal world.
  *   **You** are thinking clearly about how the dynamic *is* working, the emotional cost, and the risk to your family.

  **Your body is keeping the score.** Getting physically sick is a massive red flag. It is your nervous system telling you that you do not feel safe. Ignoring that signal because of a theoretical framework is rarely a good idea.

  ### Recommendations
  1.  **Pause the Opening:** You cannot "exposure therapy" your way out of a panic response while the stimulus continues. It is reasonable to ask for a pause on outside dates until you feel stable again. If he loves you, he should be willing to wait for you to feel safe.
  2.  **Reframe the Conversation:** Move away from "who is right about jealousy." Move toward "how do we ensure we are both safe?" If the arrangement makes one partner sick, the arrangement is currently broken.
  3.  **Seek Specialized Support:** Do not go to a standard couples therapist who might be biased toward monogamy, but also do not rely solely on his advice. Find a therapist who specializes in **Ethical Non-Monogamy (ENM)**. They can help distinguish between "growing pains" and "fundamental incompatibility."
  4.  **Check Your Consent:** Consent given under pressure is not enthusiastic consent. If you agreed to this because you feared losing him or because you wore down after a year of talking, that is coercion, even if unintentional. You are allowed to change your mind.

  You are not broken for feeling this way. Many people try to open a marriage and realize it isn't for them. Acknowledging that isn't a failure; it's data. Prioritize your nervous system and your child's stability over a theoretical ideal.
