answer: |-
  This is a fantastic nuance to catch. You have spotted the exact hinge upon which Logical Positivism turns, and also the exact point where most philosophers think it breaks.

  To write this character convincingly, you need to understand that he isn't arguing that the afterlife is *false*. He is arguing that the sentence "the soul survives death" is **literally meaningless**—in the same way that "Green ideas sleep furiously" is meaningless. It's not a fact; it's a grammatical error disguised as a fact.

  Here is the breakdown of the logic, the "rigged game" aspect, and how to put it in your character's mouth.

  ### 1. The Core Principle: Verificationism
  The engine driving your character is the **Verification Principle**. In the 1930s, Ayer and the Vienna Circle argued that for a statement to be cognitively meaningful (i.e., capable of being true or false), it must meet one of two criteria:
  1.  **Analytic:** It is true by definition (e.g., "All bachelors are unmarried").
  2.  **Empirically Verifiable:** There must be some possible sense experience (sight, touch, measurement) that could count as evidence for or against it.

  If a statement fits neither, it isn't "false." It is **nonsense**. It has no "factual content."

  ### 2. Why "Men Never Die" is Meaningful (but False)
  When someone says, "Men do not ever die," they are making a claim about **physical bodies in space and time**.
  *   **The Test:** We can observe men. We can observe them stopping breathing, their hearts stopping, their cells decaying.
  *   **The Verdict:** Because we can point to sensory evidence that contradicts the claim, the claim is meaningful. It is a hypothesis about the physical world. It happens to be wrong, but it is a valid move in the game of science.

  ### 3. Why "The Soul Survives" is Nonsense
  When the religious person says, "The *soul* survives," they usually define the soul as **imperceptible**, **non-spatial**, and **non-physical**.
  *   **The Test:** Your character asks: "What observation would prove this wrong?"
  *   **The Trap:** If the believer says, "You can't see the soul, it's beyond the physical," your character pounces. If the soul leaves no physical trace, affects no matter, and cannot be detected by any instrument or sense, then **no possible state of the universe could prove it false.**
  *   **The Verdict:** If nothing counts against it, nothing counts for it. If you can't describe what the world would look like if the soul *didn't* survive, you haven't actually said anything about the world. You've just made a noise.

  **The Crucial Distinction:**
  *   **False:** "There is a teapot orbiting Mars." (We can check, and we don't see one.)
  *   **Nonsense:** "There is an invisible, intangible, undetectable teapot orbiting Mars." (This is Ayer's point. If it's undetectable *in principle*, you aren't describing an object; you're just emoting.)

  ### 4. Is It a Fair Argument? (The "Rigged Game")
  You asked if he is "defining soul-talk out of the running so he wins by default."
  **The short answer is: Yes.**

  This is the standard philosophical critique of Logical Positivism.
  1.  **Definitional Exclusion:** Ayer defines "meaning" as "scientific/empirical meaning." By that definition, obviously, poetry, ethics, and religion are "meaningless." But many argue "meaning" is broader than just "factual content."
  2.  **Self-Refutation:** The Verification Principle itself is not analytically true, nor is it empirically verifiable. (You can't run an experiment to prove the Verification Principle). So, by its own standards, the Verification Principle is nonsense. (Ayer spent the rest of his life trying to patch this hole).
  3.  **Emotivism:** Ayer doesn't think religious people are lying. He thinks they are expressing **emotions**. When a priest says "God loves you," Ayer hears "I feel a warm commitment to moral behavior." It's not a fact-claim; it's a cheer.

  **For your novel:** Your character should be aware that people call this dogmatic. He should view it not as rigging the game, but as **cleaning up language**. He believes he is saving people from the confusion of thinking they are discussing facts when they are actually discussing feelings.

  ### 5. Writing the Scene: Character Voice & Logic
  To make him sound like a 1930s Oxford positivist, he should be precise, slightly impatient with vagueness, and focused on *conditions of verification*. He shouldn't sound angry; he should sound like a surgeon pointing out a malformed bone.

  **Key phrases/concepts to use:**
  *   "Factual content"
  *   "Conditions of verification"
  *   "Pseudo-proposition"
  *   "Emotive significance" vs. "Literal significance"
  *   "In principle" (crucial distinction)

  **Drafting Suggestion:**
  Here is a sketch of how that speech might look, incorporating the logic above:

  > "You are conflating falsity with nonsense, Sterling. They are not the same thing.
  >
  > "If I say, 'This table is made of gold,' I have made a meaningful statement. It is false, obviously. I can tap it, I can assay it, I can prove it is oak. The statement has factual content because I know what the world would have to look like for it to be true.
  >
  > "But when you speak of a 'soul' that persists... you define it as imperceptible. Non-spatial. Outside the chain of cause and effect. Very well. Tell me: what specific sense-experience would verify this? If I were to examine the corpse, the room, the universe, and find zero trace of this 'soul,' would you concede you were wrong?
  >
  > "No? You would say the soul is beyond detection?
  >
  > "Then you have not made a hypothesis. You have made a noise. To say something exists but can never, even *in principle*, interact with the observable world is to say nothing at all. It is not a false picture of reality. It is no picture. It is a poetic expression of your desire not to end, dressed up in the grammar of fact. And I have no quarrel with your poetry, provided you do not insist it is science."

  ### 6. The "Tell" for the Reader
  To make the character three-dimensional, you might want to show the limitation of his view without him admitting it.
  *   **The Blind Spot:** Have him struggle to explain why *his own* philosophical principle is meaningful (since it's not empirical).
  *   **The Human Cost:** Show him dismissing someone's grief as "emotive nonsense." It makes him logically consistent but emotionally alien.
  *   **The Era:** Remember, this is the 1930s. He views this as the cutting edge of modernity, sweeping away the superstitions that led to the Great War. He thinks he is saving civilization from irrationality.

  By understanding that he isn't attacking the *truth* of the soul but the *grammar* of the soul, you can make his argument feel much sharper and more authentic to the period.
