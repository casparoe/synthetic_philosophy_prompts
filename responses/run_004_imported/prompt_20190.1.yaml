answer: |-
  The apparent contradiction between I. J. Good's theorem on the value of information and Jack Hirshleifer's analysis of the social value of information is one of the most provocative puzzles in decision theory and welfare economics. On one hand, Good (1967) provides a rigorous proof that for a Bayesian expected-utility maximizer, costless information is never detrimental; it is a free option to refine one's actions, and options always have non-negative value. On the other hand, Hirshleifer (1971) demonstrates that public information, by resolving uncertainty before risk-sharing markets can clear, can destroy the very basis for mutually beneficial insurance, leaving all parties worse off ex-ante.

  To the casual observer, this looks like a paradox: one theorem says information is weakly dominant, the other says it can be Pareto-inferior. However, a close examination reveals that the tension is not genuine. It arises from an equivocation regarding the stability of the decision problem itself. Good's theorem operates within a fixed decision structure where the set of available actions is invariant to the information received. Hirshleifer's effect arises precisely because the information structure *alters* the feasible set of actions (specifically, the ability to contract). The two results are compatible once we recognize that Good's theorem is a lemma about optimization within a fixed game, while Hirshleifer's effect is a theorem about how information changes the game.

  To understand the reconciliation, we must first isolate the mechanism of Good's theorem. Good's result rests on the convexity of the value function. An agent facing a decision chooses an action $a$ to maximize expected utility $E[U(a, \theta)]$, where $\theta$ is the state of the world. If the agent observes a signal $s$ before acting, they can choose $a(s)$ conditional on that signal. Mathematically, the expected utility with information is $E_s[\max_a E[U(a, \theta) | s]]$, while without it is $\max_a E[U(a, \theta)]$. Because the maximum of expectations is less than or equal to the expectation of the maximum (a consequence of Jensen's inequality applied to the convex max operator), the value of information is non-negative.

  Crucially, this proof assumes that the set of available actions $A$ and the utility function $U$ remain constant regardless of whether the signal is observed. The information allows the agent to *map* states to actions more precisely, but it does not remove actions from the menu. In Good's framework, information is purely instrumental; it improves the targeting of actions but does not change the rules of engagement.

  Hirshleifer's scenario violates this invariance assumption. Consider two risk-averse farmers facing idiosyncratic crop risks. If uncertainty persists, they can sign insurance contracts ex-ante, smoothing consumption across states. This trade is mutually beneficial because it exploits the shared uncertainty. However, if a public signal resolves the crop outcomes *before* the market opens, the uncertainty vanishes. Consequently, the motive for insurance vanishes. The action "sign insurance contract" is no longer feasible or rational because the state is known; the market effectively closes.

  In Hirshleifer's setup, the arrival of information changes the *feasible set of actions*. In the "No Information" regime, the action set includes "Trade Risk." In the "Public Information" regime, the action set is restricted to "Consume Endowment." Good's theorem compares "Act on Prior" vs. "Act on Posterior" holding the action set fixed. Hirshleifer compares "Act on Prior with Insurance Available" vs. "Act on Posterior with Insurance Unavailable." Because Hirshleifer's comparison involves a contraction of the opportunity set (the loss of the insurance market), the expected utility can drop. The loss comes not from the information itself leading to a bad decision, but from the information eliminating the possibility of a good decision (risk-sharing) that required uncertainty to exist.

  Therefore, the conflict trades on an equivocation about what is being held fixed. Good's theorem holds *ceteris paribus* the institutional framework and the feasible set of actions. Hirshleifer shows that in a multi-agent economy, the institutional framework is often endogenous to the information structure. When information is public and arrives early, it transforms a risk-sharing problem into a pure allocation problem, eliminating the gains from trade that depended on ignorance. Good's theorem is a statement about *decision-theoretic efficiency* within a fixed environment; Hirshleifer's effect is a statement about *institutional design* where the environment is sensitive to information timing.

  This leads to a specific verdict: **Good's theorem and the Hirshleifer effect are not in tension; they address different layers of the problem.** Good's theorem is mathematically correct regarding the value of information for *conditioning actions*, provided the actions remain available. Hirshleifer is correct that information can reduce welfare by *removing actions* (specifically, contingent contracts) that were only viable under uncertainty. The "value" in Good's theorem is the value of *usage*; the "disvalue" in Hirshleifer's effect is the cost of *opportunity destruction*.

  Consequently, we must reject the unqualified slogan that "information is always valuable." The reconciliation forces a precise qualification on this claim. The correct formulation is:

  **"Costless information is always weakly valuable to a Bayesian agent, provided that the acquisition of that information does not alter the feasible set of actions or the timing of choices relative to the resolution of uncertainty."**

  In contexts where information acts as a "public bad" by collapsing the opportunity set for risk-sharing or cooperation—as in Hirshleifer's insurance markets—the proviso is violated, and the theorem does not apply. Recognizing this distinction saves Good's theorem from refutation while acknowledging Hirshleifer's profound insight: sometimes, to preserve the value of cooperation, we must remain ignorant.
