      *   **Nahmanides' Objection:** Abel and Noah offered sacrifices *before* idolatry existed (or at least before the Egyptian/canaanite cults Maimonides references). God accepted them. Therefore, sacrifice must have intrinsic value, not just be a concession to idolatry.
      *   **Task:** Make the *strongest case* that Maimonides' theory survives this objection. Engage *directly* with Abel and Noah. Explain how sacrifice can be a concession to idolatry *and* approved by God pre-idolatry.
