      *   *Argument 3: Evolutionary/Developmental Analogy (for the user).* Phylogeny vs. Ontogeny. Abel/Noah represent the "phylogenetic" origin (pure intent), while Sinai represents the "ontogenetic" management of a specific population (Israel) infected by Egyptian culture.
