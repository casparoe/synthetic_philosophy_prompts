answer: |-
  **Setting:** *The lounge of the hotel hosting the Annual Conference on Metaphysics. It is 11:30 PM. The noise level is a dull roar of clinking ice and exhausted academics. SARAH (a quantifier variantist) is nursing a gin and tonic. MARK (a structural realist) slides into the booth opposite her, loosening his tie.*

  **Mark:** You looked like you were about to strangle the speaker during the Q&A.

  **Sarah:** (Sighs) Did I make it that obvious? I just… I can't let the trout-turkey die. Again.

  **Mark:** Ah. The fusion of the front half of a trout and the back half of a turkey. The monster that refuses to be slain.

  **Sarah:** It's not a monster, Mark. It's a litmus test. The universalist says, "If you have the parts, you have the whole." So, trout-front plus turkey-back equals one object. The common-sense realist says, "Don't be absurd, that's just two halves near each other." And Eli Hirsch was right: they're just talking past each other.

  **Mark:** Here we go. The "merely verbal" defense. Sarah, look at the olive in your drink. Now look at the lemon wedge. Is there a single object that is the fusion of that olive and that lemon?

  **Sarah:** In the language of universalism? Yes. In the language of ordinary English? No. Both sentences are true. The word "exists"—the quantifier—just means something slightly different in those two contexts. One is restrictive; one is permissive. Neither is wrong.

  **Mark:** But one of them is *trivial*. That's the problem with your view. If you're right, then ontology—the study of what exists—isn't discovering facts about the world. It's just lexicography. It's just deciding which dictionary to use. If I say, "There is a trout-turkey," and you say, "There isn't," you're telling me we're both right?

  **Sarah:** I'm telling you that you're speaking Universalish, and I'm speaking Common-Speak. And since both languages are legitimate, both claims are true *relative to the language*.

  **Mark:** (Leans in) But that makes truth cheap. Too cheap. If I invent a language where "exists" means "is a purple dragon," can I say "Purple dragons exist" and claim I'm speaking truth?

  **Sarah:** Only if that language is conceptually coherent and useful for some purpose. Universalism is useful for logic. Common sense is useful for buying groceries. But neither gets to claim it's the *only* way the world is.

  **Mark:** That's exactly where you lose me. "The only way the world is." There *is* a structure to reality, Sarah. Reality has joints. Some ways of carving up the world cut at those joints, and some ways just smear the knife across the bone.

  **Sarah:** The "joints" metaphor. Ted Sider's favorite.

  **Mark:** It's the only thing that saves metaphysics from being a game of semantics. The trout-turkey is gerrymandered. It doesn't track any causal power. It doesn't hold together. It doesn't do anything *as a unit*. So when the universalist says "The trout-turkey exists," they are using a concept that fails to latch onto the fundamental structure of reality.

  **Sarah:** Okay, but here's the rub, Mark. And I want you to answer this without circling back to "structure." How do you *know*?

  **Mark:** Know what?

  **Sarah:** How do you know your quantifier is the one that carves at the joints? You call it "Ontologese"—the fundamental language of the universe. But you're a human being sitting in a hotel bar. You don't have a God's-eye view of reality's skeleton.

  **Mark:** I don't need God's eyes. I need the best explanation. When physics describes the world, it doesn't talk about trout-turkeys. It talks about fields, particles, masses. Those are the joints. When you say the trout-turkey exists, you're adding noise to the signal.

  **Sarah:** But physics isn't ontology. Physics tells us about forces and masses. Ontology asks what *is*. And when you say "My quantifier is the fundamental one," you aren't discovering a fact; you're *stipulating* one. You're privileging your intuition about what counts as an object and calling it "Structure" with a capital S to make it sound objective.

  **Mark:** It's not just intuition! It's about explanatory power. If I say the trout-turkey doesn't exist fundamentally, I explain why we never interact with trout-turkeys. Why we can't weigh them. Why they don't appear in equations. If you say it *does* exist, you have to explain why it's so invisible.

  **Sarah:** And if I say "exists" is vague, I explain why we're having this argument! Look, Mark, your view has a massive weakness. You claim there is a fact of the matter expressible in Ontologese. But if that language is so fundamental, why is it inaccessible to us? We're stuck using English, or logic, or math. If you can't translate "The trout-turkey does not exist" into a sentence I can understand without begging the question, then your "fact of the matter" is mystical. It's a ghost.

  **Mark:** (Takes a sip of whiskey) It's not mystical. It's theoretical. Just like an electron. You can't see an electron, but you accept it because the theory works. My theory of existence works better because it respects the difference between a pile of bricks and a house.

  **Sarah:** A pile of bricks and a house is one thing. The trout-turkey is another. The universalist treats them the same. I grant you that. But you're treating "existence" like a natural kind, like gold or water. It's not. It's a logical tool.

  **Mark:** And you're treating it like a game piece. If existence is just a tool, then nothing is *really* there. The trout-turkey is just as real as your coffee cup, provided we shift the definition of "real." That dissolves the world.

  **Sarah:** No, it respects the speaker. When a fisherman says, "There are no trout-turkeys in this lake," he is telling the truth. He isn't failing to carve joints. He's successfully communicating. If you tell him, "Actually, in Ontologese, there *is* a trout-turkey, you're just using the wrong quantifier," you aren't enlightening him. You're confusing him. You're violating the principle of charity.

  **Mark:** Charity is important, but truth is more important. If the fisherman believes there are no composite objects at all, except maybe atoms, he might be wrong about the world. I'm willing to tell the fisherman he's mistaken if the theory demands it. That's the cost of doing business. What's your cost?

  **Sarah:** (Pauses) My cost is that I can't tell you why universalism is *better* than common sense, only that it's *different*.

  **Mark:** Exactly. You render the debate pointless. If we're both right, why are we here? Why write the papers? Why fund the departments?

  **Sarah:** Because understanding *how* we differ tells us something about human cognition and language. That's valuable. But you… you claim you're finding the One True List of Objects. And my challenge remains: Show me the joints. Not the physics. Not the intuition. Show me the metaphysical glue that binds the trout's head to the turkey's tail and say "No, that's not real," while binding atoms into a table and saying "That *is* real." What is the difference *in the world*, not in your head?

  **Mark:** The difference is causal integration. The table acts as a unit. The trout-turkey doesn't.

  **Sarah:** But "causal integration" is just another concept! You're defining existence in terms of causation. Why not define it in terms of spatial continuity? If you define it that way, the trout-turkey might qualify. You're just choosing the definition that gives you the answer you want and calling it "Structure."

  **Mark:** And you're choosing the definition that makes everyone happy and calling it "Charity."

  *(A silence settles between them. The bartender begins wiping down the counter nearby, signaling last call.)*

  **Sarah:** So. The trout-turkey.

  **Mark:** Doesn't exist fundamentally.

  **Sarah:** Exists in the permissive domain.

  **Mark:** Which is a fancy way of saying "It's a useful fiction."

  **Sarah:** Which is a fancy way of saying "It doesn't match my intuition."

  **Mark:** (Signals for the check) Maybe we need a new case.

  **Sarah:** (Smiles wryly) There isn't one. We've been arguing about parts and wholes since Zeno.

  **Mark:** Then I suppose we'll be seeing each other at the bar next year.

  **Sarah:** Count on it. Does the check exist?

  **Mark:** In Ontologese? Yes. In your language? Only if the waiter brings it.

  **Sarah:** Then let's hope the waiter is a universalist.

  *(They clink glasses. The screen fades to black before the bill arrives.)*
