          *   Bayes: $P(H|M) = \frac{P(M|H)P(H)}{P(M|H)P(H) + P(M|T)P(T)}$.
          *   Using prior $P(H)=1/2$: $P(H|M) = \frac{1 \cdot 0.5}{1 \cdot 0.5 + 0.5 \cdot 0.5} = \frac{0.5}{0.75} = 2/3$.
