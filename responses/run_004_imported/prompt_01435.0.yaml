prompt: |-
  Random ask, but maybe your the right one for this - I'm drafting a scene for a historical novel set in 1690s Cambridge (yes, the irony of Newton being a fellow of Trinity College isn't lost on me) where he gets into a heated late-night argument with a fictional colleage, a devout fellow of the college, about the Trinity. From what I've read, Newton wasn't so much "pro-Arian" as obsessed with proving that Athanasius personally was a forger who'd altered scripture to win a political fight, more a historical grudge than an abstract doctrinal one. I want the orthodox fellow to be a genuinely sharp defender of Nicaea, not a guy who just says "because the church says so," and I want Newton arguing the way he actually did, from texts and church history, not generic modern-sounding skepticism. Can you write me that dialogue, maybe 10-15 exchanges, where they're both landing real points and it doesn't wrap up neatly?
