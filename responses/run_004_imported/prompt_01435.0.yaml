      *   He wrote millions of words on theology. Key text: *An Historical Account of Two Notable Corruptions of Scripture*.
      *   Key argument: The *Comma Johanneum* (1 John 5:7) is a forgery. The Council of Nicaea was a political victory for Athanasius, not a theological truth.
      *   Language: Late 17th-century English. Formal, Latinate, precise, passionate but restrained by academic decorum (until it slips).
      *   The Fictional Fellow: Needs to represent the "Orthodox" view but with intellectual weight. Maybe appealing to the coherence of salvation history or the consensus of the Fathers *before* Athanasius.

  3.  **Drafting - Step-by-Step:**

      *   *Exchange 1 (Setting the Scene):* Establish the late hour and the tension. Newton with papers, the Fellow (let's call him Dr. Sterling) challenging him.
