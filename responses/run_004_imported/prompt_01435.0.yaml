answer: |-
  **Setting:** *Isaac Newton's chambers in Trinity College, Cambridge. Circa 1692. The only light comes from a guttering tallow candle and the embers of a dying fire. Papers are stacked in precarious towers. Newton stands by the window; the fictional Fellow, DR. ELIAS STERLING, sits in a high-backed chair, holding a sheaf of Newton's manuscripts.*

  **1.**
  **Sterling:** You ask me to read these notes, Isaac, and then you glare when I turn the page. You call this 'historical inquiry,' but it reads like an indictment of the entire Church Militant.

  **Newton:** It is an indictment of fraud, Elias. Look at the Greek manuscripts I've collated. The *Comma Johanneum*—the witness of the Father, Word, and Spirit in John's epistle—it is absent from the ancient authorities. It is a marginal gloss that found its way into the text, a forgery inserted to bolster a doctrine that cannot stand on its own.

  **2.**
  **Sterling:** Even if one verse were removed, the structure does not fall. You treat the Trinity as a mathematical proof, where one variable cancels the equation. But the Fathers did not build Nicaea on a single scrap of text. They built it on the totality of Revelation.

  **Newton:** They built it on the ambition of Athanasius! I have traced the letters, the synods, the exiles. He was a politician who understood that to consolidate power, he must make his opponent not merely wrong, but impious. He turned a theological dispute into a test of loyalty.

  **3.**
  **Sterling:** You see politics where I see preservation. If Christ is a creature, however exalted, then we are worshipping a man. And if we worship a man, we are idolaters. Is that the simplicity you seek? To reduce the Church to a school of Unitarians?

  **Newton:** I seek the simplicity of the Gospel, before it was clouded by Platonic metaphysics. The early believers worshipped the Father through the Son. They did not torture language to say the Son *was* the Father in substance. That is not piety; it is confusion.

  **4.**
  **Sterling:** Confusion, or mystery? You, who map the orbits of comets, would deny God a nature more complex than gravity? We are finite, Isaac. To demand the Infinite fit neatly into your logic is the true arrogance.

  **Newton:** It is not arrogance to demand truth. If I say the moon is made of green cheese to comfort the superstitious, I lie. Athanasius lied. He altered the boundaries of truth to win a vote, and you ask me to accept the verdict because the vote was ancient.

  **5.**
  **Sterling:** I ask you to accept it because the Holy Spirit guided that Council. Do you presume to be the first man in thirteen hundred years to see the error? Where was the Spirit while the Church slept?

  **Newton:** The Spirit does not sleep, but men do. The Apostasy was prophesied. The corruption came quickly, like rot in fruit. I am not the first to see it; I am merely the first in this age with the manuscripts to prove it.

  **6.**
  **Sterling:** Manuscripts. You trust ink over the living body of Christ. If the Truth was lost for a millennium, then Christ failed His promise to be with us always. Your history makes God a absentee landlord.

  **Newton:** My history makes God a God of Truth, not a God of Compromise. Better a dark age than a lie sanctified. You defend the Creed because it is the foundation of your livelihood, Elias. Do not pretend it is only for God's glory.

  **7.**
  **Sterling:** *[Stands, voice tightening]* Do not speak to me of livelihood. I know what you fear. If your views were known, you would lose your chair. You write these things in cipher, in the dark, yet you preach them to me as if I were the coward.

  **Newton:** I write them because they are true! The silence is forced upon me by men like you, who would rather burn a scholar than question a creed. I am not afraid of losing my place; I am afraid of losing my soul by participating in idolatry.

  **8.**
  **Sterling:** Idolatry. You throw that word like a dagger. We worship the Father, in the Son, by the Spirit. The distinction is real, but the divinity is one. Where is the idol? In the unity?

  **Newton:** In the conflation! To make the Son equal to the Father is to strip the Father of His uniqueness. Christ himself said, "The Father is greater than I." You take the words of the Master and edit them to suit the Council.

  **9.**
  **Sterling:** Christ also said, "I and the Father are one." You cherry-pick the humility and discard the glory. Why? Because a subordinate God is easier to comprehend?

  **Newton:** Because a subordinate God is what the Scripture describes! A Mediator. Not the Source. You have made the Mediator the Rival. You have turned the Son into a second God, and that is not Christianity; it is polytheism dressed in Latin.

  **10.**
  **Sterling:** And you would tear the College apart to prove it? You would shatter the peace of the Church on the anvil of your private interpretation? What happens when every fellow decides he has the manuscripts to rewrite the Creed?

  **Newton:** Then let them read! Let them check the Greek. Let them look at the citations of Jerome and Cyprian. Truth is not a matter of consensus, Elias. If the whole world voted that the sun orbits the earth, it would still be false.

  **11.**
  **Sterling:** The sun is a body in the heavens; the Trinity is the nature of the Soul of the World. You cannot measure God with a telescope. You are trying to solve a mystery as if it were a problem in the *Principia*.

  **Newton:** God is not a mystery to be guarded; He is a Father to be known. You hide Him behind clouds of words so that no one can question the priests who claim to speak for Him. That is the Athanasian victory. Not truth. Control.

  **12.**
  **Sterling:** *[Softly, picking up the candle]* Then let us pray that your control is not merely the pride of intellect in reverse. You wish to be the only man in Cambridge who sees the light. But a light that burns alone usually consumes the holder.

  **Newton:** Then let it consume me. I would rather burn in the fire of truth than sit warm in the shadow of a lie. Give me the papers, Elias.

  **Sterling:** *[Hesitates, then places the manuscripts on the desk]* Keep them. But know this, Isaac. When you stand before the Judgment, it will not matter how well you parsed the Greek. It will matter if you loved the Church Christ bought, or the system you built to correct it.

  **Newton:** *[Blows out the candle, plunging the room into darkness]* We shall see whose system stands when the light returns. Good night, Doctor.

  **Sterling:** *[Groping for the door]* God keep you, Isaac. Even from yourself.
