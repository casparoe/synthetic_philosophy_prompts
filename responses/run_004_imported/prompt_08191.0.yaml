          *   Lewis's Twist: Lewis uses HS to say the world is a mosaic of local matters of fact. Causation is analyzed via counterfactuals supervening on this mosaic. Lewis argues that in NP, the counterfactual "If I one-box, the money is there" is true, *but* my choice doesn't *cause* the money to be there because the past is fixed. This relies on a specific asymmetry of counterfactual dependence that Hume might not accept in the same way.

