answer: |-
  This is an exceptionally sharp observation. You have identified a genuine fault line in the foundations of decision theory: the tension between David Lewis's *Humean Supervenience* (the metaphysical claim that the world is a mosaic of local matters of fact with no necessary connections) and his *Causal Decision Theory* (which requires a robust, asymmetric distinction between causal influence and mere correlation).

  Lewis believed he could reconcile these by analyzing causation through counterfactuals that supervene on the Humean mosaic. However, as you note, this relies on technical machinery (the asymmetry of counterfactual dependence) that Hume himself did not possess and might have rejected as scholastic.

  If we strip away Lewis's reconstruction and look at David Hume's actual texts—*A Treatise of Human Nature*, *An Enquiry Concerning Human Understanding*, and "Of Miracles"—Hume would likely **reject the dilemma as stated**, but if forced to engage with the empirical data, he would **one-box**. He would not two-box for Lewis's reasons, because he would find the metaphysical distinction CDT relies upon unintelligible.

  Here is the breakdown of why Hume would take this position, based on his epistemology, his metaphysics of causation, and his psychology of action.

  ### 1. The Epistemological Barrier: "Of Miracles"
  Before Hume decides which box to take, he must decide whether the scenario is credible. Newcomb's Problem stipulates a Predictor who is "near-infallible."

  In "Of Miracles" (Section X of the *Enquiry*), Hume argues that a miracle is a violation of the laws of nature, and laws of nature are established by "firm and unalterable experience." Testimony for a miracle is weighed against this uniform experience.
  *   **If the Predictor relies on precognition:** This violates the uniform experience that effects do not precede causes. Hume would argue that it is always more probable that the testimony regarding the Predictor's accuracy is mistaken (or fraudulent) than that the laws of temporality have been violated. He would reject the premise.
  *   **If the Predictor relies on determinism:** If the Predictor is a Laplacian demon or a super-computer simulating your brain states based on prior physical causes, this is *not* a miracle. It is consistent with Hume's naturalism. Hume accepts that human actions are determined by motives and character just as physical objects are determined by impact.

  **Verdict on Premise:** Hume accepts the problem *only if* the prediction is naturalistic (psychological/physical determinism). If it is supernatural, he walks away. Let us assume the naturalistic case, as is standard in modern decision theory.

  ### 2. The Metaphysical Tension: Causation as Constant Conjunction
  This is the core of your footnote. Causal Decision Theory (CDT) tells you to two-box because your choice cannot *cause* the money to be there; the money is already placed. CDT relies on a distinction between:
  1.  **Causal Dependence:** My choice brings about the outcome.
  2.  **Evidential Dependence:** My choice is news about the outcome.

  Hume's definition of causation undermines this distinction. In the *Treatise*, Hume argues that when we examine objects, we never perceive a "necessary connection" or a "power" in the cause that produces the effect. We only perceive **constant conjunction**. We see event A followed by event B repeatedly, and the mind forms a custom of expecting B when A occurs.

  For Hume, there is no "deep" causation distinct from reliable correlation. If the Predictor has a track record of 99% accuracy, then for Hume, the choice (One-Box) and the outcome ($1M) are conjoined with the highest degree of empirical certainty available to humans.

  To a strict Humean, the CDT insistence that "you aren't *causing* the money to be there" is metaphysical nonsense. We never cause anything in the thick sense; we only participate in regularities. If the regularity says "Agents who One-Box find $1M," then that is the only causal fact there is. To ignore this regularity in favor of an abstract dominance principle (which relies on a "secret power" of causation we cannot observe) would be to prioritize rationalist speculation over empirical evidence.

  ### 3. The Psychology of Action: Reason is the Slave of the Passions
  Hume is not a formal decision theorist; he is a moral psychologist. His famous dictum is: *"Reason is, and ought only to be the slave of the passions."*

  *   **The Passion:** You desire the million dollars.
  *   **The Reason:** Reason calculates the means to satisfy that passion based on experience.

  In Newcomb's Problem, experience (the Predictor's track record) indicates that the action "One-Box" is conjoined with the satisfaction of the passion (wealth). The action "Two-Box" is conjoined with poverty ($1k).

  CDT argues that you should Two-Box because, *given the state of the world*, Two-Boxing always yields +$1k. But Hume would argue that we never act "given the state of the world" in isolation; we act based on **expectations** formed by custom. The custom established by the Predictor is overwhelmingly strong. To act against this custom is to act against the psychological mechanism that guides all human action.

  For Hume, the "Dominance Principle" (which drives Two-Boxing) is a logical abstraction that ignores the empirical reality of the situation. If you consistently choose the option that yields +$1k in a vacuum but ignores the correlation that yields -$999k in reality, you are not being rational; you are being dogmatic. You are privileging a priori reasoning over a posteriori evidence.

  ### 4. Why Lewis Disagreed (and why Hume would disagree with Lewis)
  David Lewis was a Humean in metaphysics but a realist about counterfactuals. He argued that even if the world is a Humean mosaic, we can define causation via counterfactuals that hold the **past fixed**.
  *   *Lewis:* "If I were to One-Box, would the money be there?" No, because the past (where the money was placed) is fixed and independent of my current choice. Therefore, I gain nothing by One-Boxing.
  *   *Hume:* Hume does not have Lewis's possible worlds semantics. He has **custom**. Custom does not hold the past fixed in a counterfactual vacuum; custom looks at the observed sequence. The observed sequence is: One-Box → $1M.

  Hume would likely view Lewis's "fixity of the past" argument as a subtle reintroduction of the "necessary connection" Hume sought to excise. Lewis assumes a rigid, metaphysical arrow of time that prevents the future from indexing the past. Hume agrees time moves forward, but he denies we have any rational justification for assuming the *correlations* break down just because the *mechanism* is opaque. If the correlation holds, the expectation holds.

  ### 5. The Verdict
  If you placed David Hume before the boxes:

  1.  **He would scrutinize the Predictor.** If the mechanism implies backward causation or magic, he cites "Of Miracles" and rejects the setup.
  2.  **Assuming a naturalistic Predictor:** He would **One-Box**.

  **Why?**
  *   **Epistemologically:** He trusts the empirical regularity (the Predictor's track record) over the abstract causal intuition (that the past is fixed). For Hume, the regularity *is* the causation.
  *   **Psychologically:** His passion for wealth is best served by following the custom established by the Predictor's accuracy. To Two-Box is to let "reason" (in the form of a logical dominance principle) override the empirical evidence that guides successful action. This violates his view that reason serves the passions.
  *   **Metaphysically:** He would reject the CDT distinction between "causing" and "correlating" as unintelligible. We observe conjunctions, not powers. The conjunction favors One-Boxing.

  **The Irony:**
  The footnote nags you because Lewis tried to use Hume's metaphysics to justify Two-Boxing. But in doing so, Lewis had to import non-Humean machinery (asymmetric counterfactuals) to save the distinction between causation and correlation. A true Humean, lacking that machinery and adhering strictly to the *Treatise*, would find the CDT argument for Two-Boxing to be a prime example of the kind of empty scholasticism Hume sought to burn. He would take the million, not because he believes he is magically influencing the past, but because he believes in following the evidence of experience—and the evidence says One-Boxers get rich.
