  Working on a piece about Victorian scientists who dabbled in the occult, and Henry Sidgwick is a great case study — the guy wrote this famously rigorous, hyper-analytical work of moral philosophy (the Methods of Ethics), but then turns around and spends like two decades as founding president of the Society for Psychical Research, sitting in on seances and testing mediums. Feels like a textbook case of a brilliant, rational thinker having one totally seperate irrational blind spot that's walled off from his real philosophical work. Is that kind of compartmentalizing a known thing with super analytical people, and is there a good term for it I should use in the piece?
