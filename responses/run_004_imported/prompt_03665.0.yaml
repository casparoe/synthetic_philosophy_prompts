answer: |-
  This is a fantastic angle for a piece. Henry Sidgwick is indeed the perfect avatar for this tension. However, while your intuition about **compartmentalization** is correct, modern historians of science and psychologists suggest the dynamic is actually more complex (and interesting) than just a "blind spot."

  Here is a breakdown of the terminology, the psychological phenomena, and the historical nuance you should consider to make your piece sharper.

  ### 1. The Psychological Terms
  If you want to describe the cognitive mechanism at play, these are the most accurate terms:

  *   **Compartmentalization:** This is the defense mechanism you identified. It allows a person to hold two conflicting beliefs (e.g., "I am a rigorous empiricist" and "Telepathy is real") by keeping them in separate mental boxes so they never touch.
  *   **Motivated Reasoning:** This is arguably more accurate than compartmentalization for Sidgwick. It suggests that his desire for a specific outcome (evidence of an afterlife) unconsciously influenced how he processed data. He wasn't just ignoring the conflict; his intellect was actively working to justify the belief because the emotional stakes were high.
  *   **The Intelligence Trap:** Popularized by psychologist David Robson, this is a modern term for the phenomenon where high intelligence makes people *more* susceptible to certain biases. Smart people are better at rationalizing their intuitions and constructing complex arguments to defend irrational beliefs. Sidgwick didn't just "believe"; he built a philosophical framework to support the belief.
  *   **Cognitive Dissonance:** The state of tension that arises when holding conflicting ideas. Sidgwick's work with the Society for Psychical Research (SPR) can be seen as an attempt to *resolve* this dissonance by making the occult "scientific."

  ### 2. The Historical Context (Crucial Nuance)
  If you frame Sidgwick simply as having an "irrational blind spot," you risk **presentism** (judging the past by current standards). To Sidgwick and his peers, this wasn't irrational; it was the *ultimate* expression of rationality.

  *   **Scientific Spiritualism:** This is the historical term for the movement. In the late Victorian era, Darwinism and biblical criticism had shattered traditional religion. Intellectuals like Sidgwick, Alfred Russel Wallace (co-discoverer of natural selection), and William James wanted to save the "spirit" without the "dogma." They believed that if the soul existed, it should be discoverable via the scientific method.
  *   **Boundary Work:** This is a term from the sociology of science (Thomas Gieryn). It describes how scientists define what counts as "science" vs. "pseudoscience." Sidgwick wasn't leaving science to do the occult; he was attempting **boundary expansion**. He believed excluding psychical phenomena from study was dogmatic, not rational.
  *   **The Will to Believe:** This is the title of an 1896 essay by William James (a close associate of the SPR). It argues that when evidence is insufficient, humans have a right to believe based on "passional nature." This philosophical underpinning legitimized their research.

  ### 3. The "Blind Spot" vs. The "Bridge"
  Here is the twist that could elevate your piece: For Sidgwick, the *Methods of Ethics* and the SPR were not walled off from each other. They were two sides of the same coin.

  *   **Utilitarianism & The Afterlife:** Sidgwick was a utilitarian. A major problem for utilitarianism is: *Why be moral if it doesn't benefit me?* Sidgwick famously struggled with this. If there was no afterlife and no divine justice, rational self-interest might contradict moral duty.
  *   **The Connection:** Proving the survival of death (via the SPR) was actually a way to secure the foundations of his moral philosophy. If the soul survives and is judged, then morality and self-interest align.
  *   **The Term:** You could call this **"Philosophical Necessity."** He *needed* the occult to be real for his ethics to fully work.

  ### 4. Recommendations for Your Piece
  *   **Use "Motivated Reasoning" over "Blind Spot":** A blind spot implies he didn't see something. Motivated reasoning implies he used his brilliance to *look past* contradictory evidence because the conclusion was too important to lose.
  *   **Mention the Fraud Busting:** The SPR wasn't just a group of believers. They exposed many famous mediums as frauds. This reinforces the "Intelligence Trap" angle: they were skeptics who eventually convinced themselves that *some* phenomena were genuine despite the fraud.
  *   **The "Victorian Crisis of Faith":** Frame this not as a quirk of Sidgwick's, but as a symptom of his era. The "occult" was the placeholder for the God that science had killed.

  ### Summary of Terms to Use:
  *   **For the psychological mechanism:** *Motivated Reasoning* or *The Intelligence Trap*.
  *   **For the historical movement:** *Scientific Spiritualism*.
  *   **For the sociological action:** *Boundary Work* (expanding the limits of science).
  *   **For the specific philosophical drive:** *The Will to Believe*.

  Sidgwick is a tragic figure in this regard. He spent decades investigating and never found the conclusive proof he desperately wanted. As he reportedly said near the end of his life, the evidence was "too weak to convince the skeptic, but too strong to be dismissed by the believer." That quote alone captures the exact tension you are writing about.
