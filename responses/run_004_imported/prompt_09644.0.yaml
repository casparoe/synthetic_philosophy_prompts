      *   **Why PP is Worse than DA:**
          *   *Epistemic Immodesty:* DA limits our future expectations (humility about longevity). PP inflates our confidence in physical theories without data (arrogance about knowledge).
          *   *Empirical Override:* PP allows anthropics to trump empirical observation. If a telescope says $T_1$, but SIA says $T_2$, SIA forces you to ignore the telescope if the universe is big enough. This breaks science.
