answer: |-
  The promise of Inverse Reinforcement Learning (IRL) is seductive: if we can observe an agent's actions, we can infer its goals. By assuming the agent acts to maximize some reward function $R$, we hope to recover $R$ from the policy $\pi$. However, as Ng and Russell initially noted, and Armstrong and Mindermann (2018) rigorously demonstrated, this project faces a "No Free Lunch" theorem. For any observed behavior, there are infinitely many pairs of reward functions and planners (rationality models) that generate it. Even imposing simplicity priors fails, as complexity can be arbitrarily shifted between the reward function and the planner without changing the output behavior.

  It is tempting to view this as a mere engineering hurdle—a signal-to-noise problem awaiting better regularization or richer behavioral data. I argue that this is a category mistake. The indeterminacy identified by Armstrong and Mindermann is not merely epistemic (we lack enough data); it is ontological (there is no fact of the matter to be found). The situation in IRL is structurally isomorphic to W.V.O. Quine's thesis of the indeterminacy of translation. Just as Quine argued that there is no "fact of the matter" regarding the true meaning of a term beyond behavioral dispositions, the IRL results suggest there is no interpreter-independent fact of the matter regarding an agent's "true" preferences. To speak of a reward function existing independently of an interpretive framework is as confused as speaking of a meaning existing independently of a translation manual.

  ### The Structure of IRL Indeterminacy

  To see the depth of the problem, we must distinguish between *underdetermination* and *indeterminacy*. Underdetermination is epistemic: multiple theories fit the current data, but future data might distinguish them. Indeterminacy is stronger: no possible data could distinguish the theories because the distinction itself lacks content.

  In IRL, we observe a policy $\pi$. We assume $\pi$ is the output of a planner $P$ acting on a reward function $R$, such that $\pi = P(R)$. The inverse problem is to find $(R, P)$. Armstrong and Mindermann show that for any plausible pair $(R, P)$, one can construct a pair $(R', P')$ that produces the exact same $\pi$, where $R'$ is trivial (e.g., a constant function where all states have equal value) and $P'$ is a "degenerate" planner that hardcodes the behavior regardless of reward. Conversely, one can construct a pair where $R'$ is wildly complex and $P'$ is perfectly rational.

  Crucially, they demonstrate that no simplicity prior can resolve this. If we prefer simple rewards, the adversary can shift the complexity into the planner. If we prefer simple planners, the complexity shifts to the reward. Since the observable behavior $\pi$ remains invariant under these transformations, behavioral evidence alone cannot privilege one decomposition over another.

  ### The Quinean Analogy

  This structural deadlock mirrors Quine's argument in *Word and Object* regarding radical translation. Imagine a linguist encountering a native speaker. The native says "Gavagai" whenever a rabbit runs by. The linguist hypothesizes that "Gavagai" means *rabbit*. However, Quine points out that the behavioral evidence (stimulus conditions) is equally compatible with "Gavagai" meaning *undetached rabbit part*, *rabbit stage*, or *the instantiation of rabbithood*.

  The analogy between IRL and Quinean translation is precise:

  1.  **The Data (Behavior vs. Stimulus):** In IRL, the data is the agent's policy $\pi$ (actions taken in states). In Quine's scenario, the data is the native's assent/dissent patterns given sensory stimuli. Both are purely extensional, observable regularities.
  2.  **The Target (Reward vs. Meaning):** The IRL researcher seeks the reward function $R$, the normative "point" of the action. The linguist seeks the meaning (intension) of the term. Both are intensional properties intended to explain *why* the data occurred.
  3.  **The Mediator (Planner vs. Translation Manual):** To get from data to target, we need a bridge. In IRL, it is the planner $P$ (how rationality/bias maps value to action). In Quine, it is the analytical hypotheses or translation manual (how syntax/meaning maps to stimulus).
  4.  **The Indeterminacy:** Just as Quine argues that "rabbit" and "rabbit part" are empirically equivalent but mutually incompatible meanings, Armstrong and Mindermann show that "valuing X" and "being biased toward X" are empirically equivalent but mutually incompatible preference profiles.

  For Quine, the claim that "Gavagai" *really* means rabbit (and not rabbit part) presupposes a "museum myth" of meanings—objects stored in the mind waiting to be pointed at. Quine rejects this; meaning is constituted by the role in the web of belief and behavior, not by a hidden referent. Similarly, the standard IRL assumption presupposes a "museum myth" of preferences—that there is a specific function $R$ stored in the agent's cognition that constitutes its "true" values. The Armstrong-Mindermann result shows that behavior does not pin down this function. If we claim there is a "true" $R$ despite the empirical equivalence of $(R, P)$ and $(R', P')$, we are positing a hidden entity that does no explanatory work.

  ### The Physicalist Objection

  The most natural objection to this Quinean reading is physicalism. Quine was discussing *meaning*, which is semantic and abstract. Preferences, the objector argues, are causal mechanisms. An agent's reward function is not a semantic interpretation; it is a specific configuration of weights in a neural network, a dopamine signaling pathway, or a specific objective in a source code file. These are physical facts. Even if behavior is ambiguous, the physical substrate is not. Therefore, preferences are determinate physical facts that behavioral evidence merely fails to reveal.

  This objection fails because it conflates the *syntax* of cognition with the *semantics* of preference.

  To identify a physical state as a "reward signal" is already to interpret that state normatively. Consider a dopamine spike in a human brain when viewing sugar. Is this spike the *representation of value* (the reward), or is it a *prediction error* (part of the planner)? Is it a signal that sugar is *good*, or merely a signal that sugar is *salient*?

  If we look purely at the physical fact—a concentration of neurotransmitters—we see only syntax. To call it a "reward" is to assert that this physical state plays a specific functional role: it is what the agent *ought* to maximize, or what *justifies* the agent's actions. But as the IRL indeterminacy shows, the justification relation is not fixed by the physical dynamics alone.

  Imagine a robot with a physical register $X$. When $X=1$, the robot moves left. The physicalist says, "The value of $X$ is the reward." But is $X=1$ a command the robot *wants* to follow (a preference), or is it a constraint the robot is *forced* to follow (a bias/hardcode)?
  *   **Interpretation A:** Reward $R(s) = 1$ if left, $0$ if right. Planner $P$ is rational. The robot *prefers* left.
  *   **Interpretation B:** Reward $R(s) = 0$ always. Planner $P$ is biased to move left if $X=1$. The robot has *no preference*, only a compulsion.

  Both interpretations fit the physical circuitry and the behavior perfectly. The physical fact ($X=1$ causes left turn) does not determine whether $X$ represents a *goal* or a *glitch*. To decide this, we must ask normative questions: Is the agent *satisfied* when it turns left? If it could rewire $X$, *would* it? But these questions merely push the indeterminacy back to higher-order behaviors, which are subject to the same Armstrong-Mindermann decomposition.

  Just as Quine argued that physical facts about the brain do not fix the meaning of "Gavagai" (because meaning involves normative relations of synonymy and reference that exceed physical causation), physical facts about the brain do not fix the "reward." A physical state only becomes a "preference" when embedded in an interpretive stance that distinguishes between the agent's *competence* (what it values) and its *performance* (what it does). The IRL results prove that this distinction cannot be drawn from the outside without importing the interpreter's own normative biases.

  ### Conclusion

  The indeterminacy of Inverse Reinforcement Learning is not a bug to be patched with better priors; it is a feature of the conceptual landscape of agency. The Armstrong-Mindermann theorem demonstrates that the decomposition of behavior into "preferences" and "rationality" is radically underconstrained by any possible empirical evidence.

  This mirrors Quine's insight that facts about meaning are not facts about the world in the same way that facts about physics are. Meaning is relative to a translation manual; similarly, preference is relative to a planner interpretation. To speak of an agent's "true, interpreter-independent preferences" is to commit to a metaphysical realism about normativity that the structural logic of agency cannot support. There is no "reward function" waiting in the neurons to be discovered, any more than there is a "meaning" waiting in the vocal cords to be transcribed. There is only behavior, and the inevitable, inescapable responsibility of the interpreter to impose a normative structure upon it. We do not find values; we assign them.
