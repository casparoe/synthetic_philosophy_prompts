answer: |-
  **MEMORANDUM**

  **TO:** Office of the Provost and Vice President for Research
  **FROM:** Committee on Research Metrics
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Proposed Research Impact Index for Discretionary Fund Allocation

  ### 1. Executive Summary

  The Committee on Research Metrics has reviewed the proposal to replace departmental peer review with a quantitative "Research Impact Index" (RII) for allocating the $2M Annual Discretionary Research Fund. The proposed Index combines citation counts, grant income, and a "societal impact" score into a single formula.

  **Recommendation:** The Committee recommends **Adoption with Conditions** for a one-year pilot period. 

  We advise against the full replacement of peer review. Instead, the RII should serve as a *baseline eligibility filter* and *comparative aid*, subject to disciplinary normalization and a qualitative override mechanism. This approach harnesses the efficiency of data without obscuring the value judgments inherent in defining "impact."

  ### 2. Conceptual Framework: Facts, Values, and Metrics

  In evaluating this proposal, the Committee engaged deeply with the epistemological status of metrics. We recognize a critical tension identified in recent internal debates:

  1.  **The Risk of Technocratic Masking:** Quantitative indices can create an illusion of neutrality. If the weighting of the Index (e.g., 50% citations, 20% societal impact) is treated as a technical finding rather than a policy choice, it effectively hides value judgments behind a "black box." This risks privileging fields with high citation rates (STEM) over those with longer citation half-lives (Humanities), or prioritizing grant income over theoretical innovation, without explicitly acknowledging these priorities.
  2.  **The Opportunity for Explicit Deliberation:** Conversely, a transparent formula forces the administration to articulate its values. By publishing the weights, the university makes its strategic priorities revisable and open to debate, rather than leaving them to the implicit biases of informal peer networks.

  Our recommendation proceeds from the second premise but incorporates safeguards against the first. We treat the RII not as an objective measure of *worth*, but as a transparent tool for *allocation* based on explicitly stated institutional values.

  ### 3. Rationale for Conditional Adoption

  The Administration requires a defensible method for distributing limited resources. Pure peer review, while nuanced, is susceptible to insularity and implicit bias. Pure metrics are susceptible to Goodhart's Law (when a measure becomes a target, it ceases to be a good measure). A hybrid model offers the following advantages:

  *   **Transparency of Values:** By publishing the RII weights, the University acknowledges that "impact" is a constructed category. This allows departments to align their work with stated goals or formally petition to change the goals.
  *   **Efficiency:** The Index reduces the administrative burden of processing hundreds of small grant applications.
  *   **Equity:** Standardized data can help identify high-performing researchers in under-resourced departments who might be overlooked in informal networks.

  ### 4. Conditions for Implementation

  To mitigate the risks of metricization, the following conditions must be met for the pilot year:

  **A. Disciplinary Normalization**
  Citation rates and grant scales vary wildly between fields. A raw score comparing History to Biochemistry is invalid. The RII must be calculated *within* disciplinary clusters (e.g., Humanities, Social Sciences, Life Sciences). Funds will be allocated proportionally to clusters first, then distributed via the Index within them.

  **B. The "Qualitative Override"**
  Department Chairs retain the authority to override the Index ranking for up to 15% of their cluster's allocation. This must be accompanied by a brief written justification (e.g., "Candidate's monograph is under review but represents high potential," or "Candidate's work impacts local policy not captured by metrics"). This preserves the Carnapian distinction: the metric handles the facts; the Chair handles the values.

  **C. Public Weighting and Review**
  The specific formula (e.g., 40% Citations, 40% Grants, 20% Societal Impact) must be published. The Committee will review these weights annually. This ensures the "scientific planning body" does not freeze a contestable view of scholarship into permanent policy.

  **D. Exclusion of "Societal Impact" for Tenure Decisions**
  The Committee strongly advises that this Index be used *only* for discretionary funding. It must not be integrated into tenure or promotion files during this pilot phase, to prevent perverse incentives from altering long-term research trajectories.

  ### 5. Minority View and Risk Assessment

  A significant minority of the Committee (and many faculty stakeholders) urged the **Rejection** of the RII. Their arguments deserve a fair hearing and remain a primary risk factor for this policy:

  *   **The Corruption of Inquiry:** Critics argue that attaching funding to metrics inevitably shifts research behavior. Scholars may pursue "safe" topics with high citation potential rather than risky, innovative work.
  *   **The Definition of "Societal Impact":** There is no consensus on how to quantify this. Critics fear this metric will favor public relations-friendly projects over critical scholarship that challenges society.
  *   **The Technocratic Critique:** Even with transparent weights, critics argue that reducing scholarship to a formula legitimizes the idea that research value is *commensurable*. They contend that comparing a philosopher's contribution to an engineer's via a single number is a category error that degrades the university's mission.

  **Committee Response to Risks:** We acknowledge these risks are real. However, in a resource-constrained environment, *some* allocation mechanism is required. The Conditional Adoption model is designed specifically to limit the "corruption" risk by capping the Index's power (via the Qualitative Override) and isolating it from tenure decisions.

  ### 6. Implementation Timeline

  *   **November 15:** Finalize disciplinary clusters and normalization factors.
  *   **December 1:** Publish RII formula and weights for faculty comment.
  *   **January 1:** Pilot period begins.
  *   **May 1:** Committee review of pilot data and faculty feedback.
  *   **June 30:** Recommendation on permanent adoption, modification, or termination.

  ### 7. Conclusion

  The Committee believes that a "scientific world-conception" of university management is only ethical if it admits its own normative foundations. By adopting the Research Impact Index with the conditions outlined above, the Administration can achieve greater efficiency and transparency without pretending that data can replace judgment. We are choosing to make our values explicit, rather than hiding them behind a claim of objectivity.

  **Approved by:** 
  The Committee on Research Metrics
  *Chair: [Your Name]*
