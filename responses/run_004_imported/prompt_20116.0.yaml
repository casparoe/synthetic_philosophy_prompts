  The chronometer hummed, settling into the static of November 14, 1998. Rain slicked the asphalt of Oak Street. Elias knew the script: at 8:42 PM, his father's sedan would slide through the intersection, struck by a delivery truck. Dead on impact. Elias was here to rewrite the headline.

  This was Attempt Fourteen.

  In Attempt One, Elias had planned to slash the tires. He'd brought a knife from the future, sharpened to a molecular edge. But as he crouched by the curb, a stray dog barked, startling him. He slipped on the wet grass, slicing his own palm instead. The blood ruined his grip. He watched the car drive past, intact.

  In Attempt Seven, he tried to block the road. He'd stolen a local vehicle to create a barricade. But the stolen car, perfectly functional in the showroom, had a seized alternator. It died exactly halfway across the intersection, forcing him to push it away manually just as his father's headlights appeared. He waved frantically, but his father, squinting through the rain, didn't see a son from the future; he saw a drunk stranger and swerved around him, back onto the fatal path.

  Now, Attempt Fourteen. Elias stood on the corner, holding a flare. No dogs nearby. No stolen cars. He had checked the weather reports, the traffic logs, his own physiological stress levels. He was calm. He was ready. He had the ability. He had the motive. He had the opportunity.

  8:41 PM. The truck's rumble vibrated in his chest. His father's sedan crested the hill.

  Elias struck the flare. It hissed, burning bright red. He stepped into the street, arm raised.

  A sudden, violent cramp seized his calf. Not a mystical force, not a lightning bolt. Just a muscle fiber tearing from overuse during his training drills earlier that week. He stumbled. The flare flew from his hand, landing in a puddle. The hiss died instantly.

  He looked up. The sedan passed. The crunch of metal followed seconds later.

  Elias fell to his knees in the rain. He didn't scream. He started to laugh, a dry, hollow sound that tasted like copper.

  He finally understood the philosophy he'd skimmed in those late-night wiki binges. David Lewis. The consistency constraint. There were no branching timelines. There was no multiverse where his father lived. There was only this one, solid block of spacetime.

  The horror wasn't that the universe was protecting itself. The horror was that the universe didn't care.

  If Elias was standing here in 1998, it meant he had *always* been standing here in 1998. His memory of his father's death was a memory of a fact that included Elias's failure to prevent it. The past wasn't being guarded; it was already written. His presence here wasn't a variable changing the equation; it was a constant embedded in the solution.

  He could kill a man. He could build a machine. But he could not make the facts compossible with a contradiction. He could not kill his father because his father lived long enough to sire him. He could not save his father because his father died.

  The mundane accidents weren't cosmic police. They were just... logic. Physical logic. If the outcome is fixed, the path to that outcome must be traversable. If Elias succeeded, the path would vanish. Therefore, the path must contain obstacles. A slipped knife. A seized alternator. A cramped muscle. These weren't miracles; they were the necessary conditions for his own existence.

  He stood up, shivering. He walked back to the hidden machine. He looked at his hands. They were capable hands. They could hold a gun, they could turn a wrench. But in this context, their capability was irrelevant. He *could* pull the trigger, in the sense that he had the strength. But he *would not*, in the sense that the trigger would never fire in a way that changed the truth.

  Elias stepped into the machine. He could try again. Attempt Fifteen. He could bring a better flare. He could stretch his calves. He could hire a team.

  But he knew what would happen. A storm drain would overflow. A bird would strike the windshield. He would choke on his own saliva. The universe wouldn't lift a finger to stop him. The universe would simply remain consistent, and Elias would be the variable that bent to fit the geometry.

  He set the coordinates for home. The hum began. He realized with a sinking dread that he wasn't a traveler. He was a tourist in a museum where the exhibits were made of concrete, and he was just another statue placed there to ensure the display remained unchanged.

  The rain washed the blood from his palm. The past waited, patient and immovable, for him to finish playing his part.
