  2.  **Deconstruct David Lewis's Argument:**
      *   Lewis argues that "can" is context-sensitive. You *can* kill your grandfather in the sense that you have the ability (gun, motive, proximity), but you *cannot* kill him in the sense that it is compossible with the facts of the past (he didn't die).
      *   There is only one timeline. The past is fixed. If you are there in the past, you were always there.
      *   Therefore, any attempt to change the past must fail. The failure isn't caused by a mystical force; it's caused by ordinary events that align to prevent the change.
