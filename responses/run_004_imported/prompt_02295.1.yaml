      *   **Key Requirements:**
          *   Dig into weak spots of *both* views.
          *   Epistemicist challenge: What fixes the boundary if usage doesn't?
          *   Degree Theorist challenge: Does "degrees of truth" just push the sharp cutoff up a level (higher-order vagueness)?
          *   No strawmanning: Both must respond to the best version of the other's argument.
          *   Tone: Intellectual, engaging, slightly informal but philosophically rigorous.

  2.  **Character Conception:**
