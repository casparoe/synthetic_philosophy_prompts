answer: |-
  **Setting:** *A dimly lit graduate seminar room. At the front, a student named Maya stands at the whiteboard, marker poised. She is facing a sum she has never computed before: 3,892 + 4,109. The rest of the class watches in silence. At the very back, leaning against the wall, are ELIAS (the Kripkean skeptic) and SARAH (the straight-solution advocate). They speak in low murmurs.*

  **Elias:** Watch her hand. She's hesitating. Not because she doesn't know how to carry the one, but because, strictly speaking, she has no idea what she *ought* to do.

  **Sarah:** Don't start. She's doing arithmetic. She's grasping a necessary truth.

  **Elias:** Is she? Or is she extrapolating a habit? Kripke's point isn't that she'll get it wrong. It's that there is no fact about her past usage of "plus"—no neural state, no mental image, no behavioral disposition—that logically entails *this* specific output rather than the output of "quus."

  **Sarah:** "Quus." The function that matches addition up to now but diverges on this specific sum. We know the trope, Elias. But it's a parlor trick. It ignores the phenomenology of understanding. When she learned addition, she didn't just memorize a finite list of pairs. She grasped a *rule*. That grasp is the fact.

  **Elias:** What *is* that fact, concretely? If you open her skull, you find synapses, not plus-signs. If you query her introspection, she has a feeling of confidence, not a lookup table. If you say the fact is a "grasp of a concept," you're using a metaphor to solve a metaphysical problem. You need a truth-condition. What property of her mental state at time *t-1* makes 7,991 the *correct* answer at time *t*?

  **Sarah:** It's not a property of a mental state in isolation. It's a fact about her *competence*. She is a rational agent embedded in a practice of inference. The fact is that she possesses the capacity to recognize the normative demands of the concept itself. The concept 'plus' has an infinite extension, and her mind, by grasping it, is aligned with that extension.

  **Elias:** "Aligned." There's the magic word. How does a finite mind align with an infinite function? If you say she has a "capacity," I ask: how is that capacity distinct from a disposition? And Kripke demolished dispositionalism. She is disposed to make mistakes. If she gets drunk and says 3+3=7, you don't say her disposition changed; you say she failed her disposition. So the disposition isn't the meaning. You need a *normative* fact, not a descriptive one.

  **Sarah:** Exactly. So the fact isn't descriptive psychology. It's a sui generis intentional fact. It's primitive. To ask "in virtue of what?" is to demand a reduction where none is available. Meaning is a bedrock.

  **Elias:** Bedrock is where the spade turns, sure. But if you plant your flag on "primitive intentional facts," you've made meaning occult. You've saved truth-conditions by making them unobservable, inexplicable, and detached from use. Look at her. She's writing the '9'. Why is that right? On your view, because it matches the abstract object 'Addition.' On my view, it's right because when she writes it, the rest of us nod.

  **Sarah:** And there lies the trap. The Skeptical Solution. You replace truth with assertibility. You say she isn't *correct* in a realist sense; she's just *accepted* by the community. But Elias, press that harder. What stops the community from being indeterminate in exactly the way the individual is?

  **Elias:** *[Pauses, watching Maya carry the tens column]* Because the community isn't a single mind. It's a system of checks and balances. Norms arise from the friction between speakers. If I say "quus," you correct me. That correction isn't based on a fact we see; it's a reaction. The regularity of those reactions constitutes the rule.

  **Sarah:** But that's just skepticism writ large. If my individual dispositions don't fix meaning, why do our *collective* dispositions fix it? If the whole seminar room agreed that 3,892 + 4,109 equals 5,000, would it *be* 5,000?

  **Elias:** For the purposes of our language game, yes. There is no "view from nowhere" to check our math against.

  **Sarah:** That makes arithmetic contingent on sociology. If humanity goes extinct, does 2+2 cease to equal 4?

  **Elias:** The *statement* "2+2=4" loses its assertibility conditions. The utility vanishes. But you're clinging to a picture of correctness that hangs in the air, unsupported by human practice. You want correctness to be a rail laid out to infinity. I'm saying we lay the track as we walk, and we call it "straight" only because we walk together.

  **Sarah:** But if we lay the track as we walk, we can't distinguish between *thinking* we're following the rule and *actually* following it. You've collapsed the normativity into regularity. If the community agrees on "quus" tomorrow, you have to say they're following the "plus" rule all along, because the community defines the rule.

  **Elias:** No. If the community shifts, the meaning shifts. There is no timeless "plus" to betray. But here is my challenge to you, Sarah, and it's the one you keep dodging. You insist there is a fact about Maya *now* that settles this sum. Tell me, concretely: How does that fact *guide* her?

  **Sarah:** It guides her by making certain steps seem obvious.

  **Elias:** "Seem." That's psychological. What if it seems obvious to her to write 5,000?

  **Sarah:** Then she's mistaken.

  **Elias:** In light of what?

  **Sarah:** In light of the meaning of the terms she's using!

  **Elias:** Circular. You're saying she's mistaken because she violated the rule, and the rule is defined by what she shouldn't violate. You haven't identified the fact. You've just asserted that there *must* be one, on pain of arithmetic being illusory. But why is a skeptical solution illusory? Why isn't it just humility?

  **Sarah:** Because it leaves the success of her calculation unexplained. She didn't just get nodded at; she *succeeded*. There is a constraint on her thinking that comes from outside her community. The numbers themselves resist certain moves. Try to convince the class that 3,892 + 4,109 is 12. You can't. Not because they'll boo you, but because it's impossible. That impossibility is the fact.

  **Elias:** The impossibility is a feature of our form of life. We are built to count this way. Creatures with different cognitive architectures might not have "addition."

  **Sarah:** They might not have the *concept*, but the relations would still hold. Look, Elias. If you're right, then when Maya writes "7,991," she isn't satisfying a condition that existed before she wrote it. She's creating the standard retroactively.

  **Elias:** She's participating in a practice that sustains the standard.

  **Sarah:** But that practice is blind if it isn't tracking something. You're afraid of Platonism, so you've swung to sociological pragmatism. But the middle ground is that the fact is *constitutive*. The fact that she means plus is constituted by her role in a normative space where certain inferences are obligatory. That obligation isn't created by the community's applause; it's the condition of the community existing at all.

  **Elias:** "Obligatory." By whom? If not the community, then who is the obligor? A ghost?

  **Sarah:** Reason itself.

  **Elias:** *[Smiles thinly]* And there it is. The straight solution always ends in mysticism. "Reason itself."

  **Sarah:** And the skeptical solution always ends in silence. If nothing fixes meaning, why are we whispering about it? Why not just shout "quus" and see what happens?

  **Elias:** Because we know what will happen. You'll correct me.

  **Sarah:** Precisely. I'll correct you because you're *wrong*. Not just non-compliant. Wrong.

  *[Maya finishes the sum. She writes "7,991" on the board. She turns to the class. There is a collective, almost imperceptible exhale of relief. The professor nods.]*

  **Elias:** She's safe. For now. Until the next novel case.

  **Sarah:** She's always been safe. The answer was waiting for her.

  **Elias:** Or we just agreed to let it be the answer.

  **Sarah:** Is there a difference that makes a difference?

  **Elias:** For the mathematician, no. For the philosopher... everything.

  **Sarah:** Then let's hope she never asks us which one she is.

  *[They fall silent as the professor begins to speak, the whiteboard gleaming between them, the numbers stark and unreadable.]*
