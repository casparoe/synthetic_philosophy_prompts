          1.  **Rationality:** Both must be Bayesian updaters.
          2.  **Common Priors:** They must start with the same prior probability distribution over the state of the world.
          3.  **Common Knowledge:** It's not enough to *tell* each other the numbers. They must *know* that the other knows, know that the other knows that they know, ad infinitum (or at least reach a partition of information states where the expectation is common).
          4.  **Honesty:** They must be reporting their true beliefs.
