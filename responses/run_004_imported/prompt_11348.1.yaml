prompt: |-
  I'm on the Elections Board for my school's student council (we handle campaign complaints for class officer elections), and tomorrow's meeting has the board split down the middle. A candidate for senior class president didn't lie about anything, but for the last two days of voting she posted instagram stories with a countdown timer that reset every few hours ('polls close in 2 hrs, dont be the last one!!'), right next to a running tally of who'd already voted, built from screenshots supporters sent her of their 'I Voted' stickers. Undecided kids could watch the number climb and felt like everyone but them had already picked her -- nothing false, just true info arranged to pressure people. Half the board calls that normal hype-building, the kind every campaign does some version of; the other half says engineering that kind of social pressure to stampede people into voting without really thinking it through counts as manipulation even with zero lies involved. Our constitution just says campaigns have to be "honest and respectful," which doesn't really settle it either way. Can you draft the memo I have to bring to tomorrow's meeting? It needs to recommend something concrete (disqualify her, give her a warning, let the results stand but ban the tactic going forward, whatever) and actually defend that call, while taking the "it's just normal campaigning" side seriously instead of just brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the School Elections Board.
      *   **Task:** Draft a memo for tomorrow's meeting regarding a campaign complaint.
      *   **Situation:** A senior class president candidate used Instagram stories with countdown timers and a running tally of "I Voted" screenshots (social proof/pressure) during the last two days of voting. No lies were told.
      *   **Conflict:** The board is split 50/50.
          *   Side A: It's normal hype/get-out-the-vote (GOTV) effort.
          *   Side B: It's manipulative social pressure (bandwagon effect) that undermines thoughtful voting.
      *   **Rules:** Constitution says campaigns must be "honest and respectful." Ambiguous.
      *   **Requirements:**
          *   Recommend a concrete action (disqualify, warn, let stand + ban future, etc.).
          *   Defend the recommendation.
          *   Take the opposing view ("normal campaigning") seriously (steel-manning).
          *   Tone: Professional, fair, decisive, suitable for a student board meeting.

  2.  **Determine the Recommendation:**
      *   *Option 1: Disqualify.* Too harsh. No rules were explicitly broken, and no lies were told. It sets a bad precedent for punishing ambiguity.
      *   *Option 2: Do Nothing.* Ignores the valid concerns of half the board and the potential ethical issue.
      *   *Option 3: Warning + Let Results Stand + Clarify Rules.* This is the most balanced approach. It acknowledges the gray area, penalizes the candidate slightly (official warning) without overturning the will of the voters, and fixes the rule for the future.
      *   *Decision:* I will recommend **letting the results stand but issuing a formal warning and establishing a precedent/rule clarification** for future elections. This resolves the immediate crisis without causing chaos (overturning an election) while addressing the ethical concern.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the issue and the recommendation.
      *   **Background:** Summarize the complaint (IG stories, countdown, vote tally).
      *   **Analysis of the Conflict (The "Steel-Man"):**
          *   *Argument for "Normal Campaigning":* Acknowledge that GOTV is good. High turnout is desirable. Nothing was false. It's digital equivalent of "Get out the vote!"
          *   *Argument for "Manipulation":* Acknowledge the psychological pressure (FOMO, bandwagon effect). It targets undecided voters' anxiety rather than policy. It skirts the spirit of "respectful."
      *   **Interpretation of "Honest and Respectful":**
          *   "Honest": She passed this (no lies).
          *   "Respectful": This is the crux. Does coercive pressure respect voter autonomy?
      *   **Recommendation:** Let results stand (stability), Issue Warning (accountability), Clarify Rules (future-proofing).
      *   **Rationale:** Why this specific mix? Balances fairness to the candidate with integrity of the process.
      *   **Next Steps:** What the board needs to vote on.

  4.  **Refining the Tone:**
      *   Needs to sound like a student leader but professional.
      *   Avoid accusatory language.
      *   Ensure the "Normal Campaigning" side feels heard, not dismissed. *Self-Correction during drafting:* Make sure I explicitly validate that high turnout is a *good* thing, so the distinction is about *how* it was achieved, not *that* it was achieved.

  5.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Keep it crisp.
      *   *The "Normal" Argument:* Use terms like "Get Out The Vote" (GOTV). Mention that elections *should* be exciting.
      *   *The "Manipulation" Argument:* Focus on "undue influence" and "voter autonomy."
      *   *The Verdict:* Why not disqualify? Because retroactive punishment for unclear rules is unfair. Why not nothing? Because it sets a bad precedent.
      *   *The Rule Change:* Propose specific language about "real-time vote tallying" or "coercive urgency."

  6.  **Review against Constraints:**
      *   Concrete recommendation? Yes (Warning + Results Stand + Rule Clarification).
      *   Defend the call? Yes (in the Rationale section).
      *   Take opposing side seriously? Yes (dedicated section analyzing the "GOTV" perspective).
      *   Constitution mentioned? Yes ("Honest and Respectful").

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "lying" and "manipulating" is clear. (The resulting memo looks good. It strikes a balance between procedural integrity and ethical standards.)

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Student Elections Board
  **FROM:** [Your Name/Position]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Complaint vs. Senior Class Presidential Campaign

  ### Executive Summary
  This memo addresses the formal complaint regarding the Senior Class Presidential candidate's use of Instagram Stories during the final 48 hours of voting. The campaign utilized countdown timers and a running tally of "I Voted" screenshots to encourage turnout.

  After reviewing the complaint and our Constitution, I recommend that we **allow the election results to stand, issue a formal warning to the candidate, and immediately adopt a clarification to our campaign rules** regarding real-time vote tallying and coercive urgency. This approach balances the integrity of the election with the need for clearer ethical guidelines.

  ### Background
  During the final two days of voting, the candidate in question posted Instagram Stories featuring:
  1.  Countdown timers resetting every few hours ("Polls close in 2 hrs").
  2.  A cumulative count of supporters who had voted, evidenced by screenshots of "I Voted" stickers submitted by students.

  No false information was disseminated. The complaint argues that while factually accurate, this tactic engineered social pressure (the "bandwagon effect") that compromised voter autonomy. The campaign argues this is standard "Get Out The Vote" (GOTV) enthusiasm.

  ### Analysis of the Conflict
  The Board is currently divided. To reach a decision, we must weigh both interpretations of our Constitution's requirement that campaigns be "honest and respectful."

  **1. The Case for "Normal Campaigning" (The Defense)**
  We must take seriously the argument that this is standard democratic engagement.
  *   **Turnout is a Virtue:** Student council elections often suffer from low participation. Efforts to remind students to vote before the deadline are generally beneficial to the legitimacy of the council.
  *   **Factual Accuracy:** The candidate did not lie. The timers reflected reality, and the vote counts were based on actual submissions. Under a strict reading of "honest," the campaign complied.
  *   **Enthusiasm vs. Coercion:** There is a fine line between generating excitement and applying pressure. Supporters argue this was simply digital enthusiasm, akin to a rally or a pep talk, which is permitted.

  **2. The Case for "Undue Influence" (The Complaint)**
  However, the concern regarding "respectful" conduct warrants attention.
  *   **Voter Autonomy:** The "respectful" clause implies respecting the voter's right to choose freely. By publicly shaming non-voters ("don't be the last one") and creating a false sense of unanimity, the tactic targets psychological FOMO (Fear Of Missing Out) rather than policy merit.
  *   **The "Chilling" Effect:** For undecided voters, seeing a lopsided tally can discourage them from voting for an opponent, not because they changed their mind, but because they feel their vote is futile. This distorts the will of the student body.
  *   **Precedent:** If we allow this without comment, we signal that psychological manipulation is permissible so long as no explicit lies are told.

  ### Recommendation
  I propose the Board vote on the following three-part resolution:

  1.  **Certify the Election Results:** We will not disqualify the candidate or overturn the vote.
  2.  **Issue a Formal Warning:** The candidate will receive a written notice that while their actions did not violate the *letter* of the current rules, they pushed against the *spirit* of the "respectful" clause.
  3.  **Adopt an Immediate Rule Clarification:** For all future elections (effective immediately), we will amend the Campaign Guidelines to prohibit:
      *   The public tallying of votes or "I Voted" confirmations during active voting periods.
      *   The use of countdown timers within the final 24 hours of voting that imply immediate consequences for late voting.

  ### Rationale
  **Why let the results stand?**
  Disqualifying a candidate for a tactic that was not explicitly forbidden violates principles of due process. The candidate operated in a gray area created by our vague Constitution. Punishing them retroactively with disqualification would be disproportionate and could delegitimize the winner in the eyes of the student body.

  **Why issue a warning?**
  Ignoring the complaint entirely validates the tactic as acceptable. A formal warning acknowledges the validity of the concern regarding social pressure without nullifying the election. It holds the candidate accountable for testing the boundaries of "respectful."

  **Why change the rules now?**
  This is the most critical step. Our Constitution's language ("honest and respectful") is too subjective to adjudicate complex digital campaigning. By clarifying the rules now, we protect future candidates from ambiguity and ensure that future elections are decided on platforms and leadership qualities, rather than psychological pressure tactics.

  ### Conclusion
  This decision prioritizes the stability of the current election while safeguarding the integrity of future ones. It acknowledges that high turnout is good, but not when achieved through methods that compromise voter independence.

  I move that we adopt this recommendation to close the complaint and update the Campaign Guidelines accordingly.
