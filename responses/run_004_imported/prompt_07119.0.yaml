answer: |-
  **The Last Interval**

  The room was soundproofed, but Vera could feel the switching in her teeth.

  It started as a rhythmic clack, the heavy industrial relay throwing the circuit open and closed. *On* for thirty seconds. *Off* for fifteen. *On* for seven-point-five. The tungsten filament in the center of the chamber glowed, dimmed, glowed, dimmed. It was a standard bulb, the kind you could buy at a hardware store for a dollar, mounted on a rig that cost more than Vera's house.

  She sat behind the thick polycarbonate glass, a stopwatch in her lap. She wasn't holding her breath. She had trained herself not to.

  "Thirty seconds," she said to the recorder. Her voice sounded flat, absorbed by the foam wedges on the walls. "Initiating sequence. Subject is stable."

  This was the third attempt. The first had burned out the filament at the forty-five-second mark; the thermal shock of the rapid cycling was too great for standard metal. The second had suffered a logic error in the controller; the intervals drifted, ruining the geometric progression. If the sum of the intervals didn't equal exactly one minute, the paradox collapsed into mere engineering.

  Vera needed the minute.

  She wasn't doing this for the university. The grant money had dried up months ago, when the department head asked her, gently, what practical application a machine that did nothing but flicker could possibly have. She wasn't doing it for the bet, either, though she remembered the dinner party vividly. The philosopher, wine-stained teeth, smiling over the dessert course. *You can't build it, Vera. Not because of the materials, but because of the logic. You're trying to drive a car to the end of the road, but the map stops a mile short.*

  *I just want to see what's in the blank space,* she had said.

  Now, the clacking accelerated. *Click. Click. Click.*

  At the fifty-second mark, the sound ceased to be distinct impacts and became a buzz. The filament was no longer visibly dimming; the human eye couldn't process the frequency. It appeared to be burning at a constant, steady brightness, a persistent average of the two states. But Vera knew the switch was still throwing. The controller's LED indicator was a frantic blur.

  She thought about the other puzzle, the one she'd sketched on the whiteboard in her office. The vase and the balls. If you put ten balls in and take one out, then put ten in and take one out, infinitely, how many are left at the end? It depended on *which* balls you took out. If you removed them in order, the vase was empty. If you removed them randomly, it might be full. The physical reality of the vase at the one-minute mark was not determined by the process that filled it. It was underdetermined.

  The buzz rose in pitch. It was a whine now, vibrating the polycarbonate.

  Vera watched the stopwatch. 58 seconds. 59.

  She felt a sudden, sharp pang of grief, unexpected and precise. It wasn't for the grant, or the reputation. It was for her father, who had spent the last year of his life in a hospital bed, his breathing monitored by a machine that beeped faster as the end approached. He had died in the interval between two beeps. There had been a last breath, certainly, but the monitoring had stopped before it registered. The data stream ended, and the man was gone.

  She had spent her career trying to make sure the data didn't end before the event.

  59.5 seconds. The whine was a scream now, ultrasonic. The relay was moving faster than any mechanical part should move, driven by magnetic fields that heated the air in the chamber. The smell of ozone seeped through the seals.

  The instructions were perfect. They dictated the state of the lamp for every moment $t$ where $t < 1$. They defined the past completely. They mapped the approach to the cliff edge with surveyor's precision.

  But they said nothing about the cliff.

  Vera's thumb hovered over the lap counter. She didn't need to press it. The machine would cut the power to the switching mechanism automatically at $t = 60$. It had to. If it kept switching, the minute would be over, and they would be in the next minute. The supertask required a stop.

  The question that had kept her awake for three years was simple: When the switching stops, what is the lamp doing?

  Logic said the question was ill-posed. There is no last switch. There is no final state derived from the series $1/2 + 1/4 + 1/8...$ The series converges to 1, but the terms oscillate forever. To ask if the lamp is on or off at $t=1$ is like asking what color the number seven is.

  But physics is not logic. Physics is tungsten and copper and silicon. Physics demands a state. The filament must be hot or cold. The circuit must be open or closed.

  59.9 seconds. The vibration was in her bones now.

  Vera realized she was hoping for a contradiction. She wanted the lamp to explode, or vanish, or glow a color that didn't exist. She wanted the universe to admit that it couldn't handle the infinity she had fed it. She wanted the silence to be loud.

  But the philosopher was right. The silence wouldn't be loud. It would just be silence.

  The stopwatch hit 00:01:00.

  The controller killed the signal to the relay.

  The screaming whine vanished instantly.

  The room was utterly quiet. The only sound was the hum of the air filtration and the blood rushing in Vera's ears.

  She looked through the glass.

  The lamp was off.

  It sat there, a dark bulb in a dark chamber. The filament was cooling, fading from a dull cherry-red to black over the course of ten seconds.

  Vera waited. She waited for a spark, for a flicker, for the machine to reboot and tell her it had registered an error. Nothing. The state was 'Off'.

  She stood up and walked to the intercom. She could go in there. She could touch the glass of the bulb. It would be warm. She could trace the circuit back to the relay and see that the switch had defaulted to 'Open' when the power cut.

  And that was the answer. Not a logical necessity, but a mechanical default.

  The infinite sequence of switches had no say in the matter. The history of the lamp—the infinite, frantic history of the last minute—had no authority over the present moment. The past did not determine the now. The instructions had run out of road, and the car had simply stopped because the engine turned off, not because it had reached a destination.

  Vera pressed the record button.

  "Sequence complete," she said. Her voice was steady, though her hands were shaking. "Duration: sixty seconds. Final state: Off."

  She paused. She should log the data, shut down the rig, write the paper. *The Physical Indeterminacy of Supertask Termination.* It would be a footnote in a journal no one read.

  She looked at the dark bulb. She had wanted to see the end of infinity. She had wanted to stand at the limit and see what lay beyond.

  But there was nothing beyond. There was only the next second, and the one after that, unconnected to the ones before. The infinite past was a closed door.

  Vera turned off the recorder. She picked up her coat.

  She left the room without turning off the main power, leaving the dark lamp sitting in the silence, a question that had forgotten how to ask itself. Outside, the hallway lights flickered once as the building's timer cycled, then held steady. Vera walked under them, step by step, into the finite, unremarkable afternoon.
