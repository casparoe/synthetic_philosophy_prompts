  2.  **Character Voices & Arguments:**
      *   **Sor Filotea (The Bishop):**
          *   *Voice:* Paternal, concerned, ecclesiastical, gentle but firm. Uses theological language.
          *   *Core Argument:* The vocation of a nun is prayer and penance, not intellectual display. Secular learning distracts from salvation. St. Paul says women should be silent in the church. Humility is the highest virtue; intellectual pride is a spiritual danger.
          *   *Nuance:* He admires her talent (hence publishing the critique) but fears for her soul and the order of the Church.
      *   **Sor Juana:**
          *   *Voice:* Precise, logical, passionate but controlled, erudite.
          *   *Core Argument:* God gave me intellect; to not use it is to waste His gift. Secular sciences (physics, logic) are necessary to understand Scripture (the "handmaid" argument). St. Paul's injunction refers to preaching authority, not private study. There are precedents (St. Catherine, the Queen of Sheba).
          *   *Nuance:* She is obedient but claims a space for intellectual conscience. She seeks to justify her existence as a thinking woman within the cloister.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** A parlor in the Convent of Santa Paula. Late afternoon. Light and shadow (metaphor for enlightenment and obscurity).
