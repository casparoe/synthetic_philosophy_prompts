      *   **Context:** 1690-1691, following the publication of the *Carta Atenagórica* (critique of Vieira) and the Bishop's letter, leading to Sor Juana's *Respuesta a Sor Filotea*.
      *   **Task:** Write a dialogue where each presses their strongest case and answers the other's actual objections.
      *   **Constraints:**
          *   "Sor Filotea" must argue in earnest from Catholic tradition (priority of sacred learning, virtue of humility), *not* from crude prejudice/misogyny.
          *   Sor Juana must use her real arguments (St. Paul's silence, secular knowledge as handmaid to theology, precedents of learned women).
