prompt: |-
  ok this is a weird one but I've been chewing on it since Thanksgiving. my cousin quit his job two years ago and now just trades stocks/crypto full time, and on the side he lends money to people in the family at like 8-10% interest over a few months if anyone's short on cash. his argument is that its totally rational since the returns beat any salary he could earn, and nobodys forcing anyone to borrow from him. what gets me is he's not saving toward anything either - no house, no trip, no number where he'd stop - the balance going up is just the whole point now, indefinitely. it bugs me, but when I tried explaining why to my partner (who has index funds and says I'm just being precious about "real work" because I'm a broke philosophy PhD student) I couldn't pin down an actual principled objection. is there a meaningful line between what he's doing and normal saving/investing, or am I just being a snob about how people choose to live?
