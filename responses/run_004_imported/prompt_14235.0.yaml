  4.  **Identify Principled Objections (The "Meat" of the answer):**
      *   *Objection 1: The Family Dynamic (Relational vs. Transactional).* Mixing money and kinship changes the nature of the relationship. Charging market/near-market rates to family commodifies care. It creates a power hierarchy.
      *   *Objection 2: The Telos of Wealth (Aristotle/Philosophy).* Wealth is a tool, not an end. Infinite accumulation without a purpose (eudaimonia) is arguably irrational or spiritually hollow. This directly addresses the "balance going up is the whole point" issue.
