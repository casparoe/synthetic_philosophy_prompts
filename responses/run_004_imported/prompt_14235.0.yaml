answer: |-
  You are not just being a snob, and your partner's dismissal of this as "preciousness about real work" misses the deeper ethical and philosophical currents you're picking up on. As a philosophy PhD student, you are trained to look at *telos* (purpose) and the structure of human relationships, not just the bottom line.

  There are actually three distinct, principled objections to what your cousin is doing. Only one of them is about "work." The other two are about social ethics and the philosophy of value.

  Here is how you can pin down the objection.

  ### 1. The Commodification of Kinship (The Lending)
  This is the strongest ethical objection. Your cousin isn't just investing; he is running an informal bank within his own family network.

  *   **The Power Dynamic:** Even if "nobody is forcing anyone," family borrowing is rarely a transaction between equals. It happens during vulnerability ("if anyone's short on cash"). By charging 8–10% (which is high for family, though low for payday loans), he is monetizing his relatives' distress.
  *   **The Shift in Relationship:** When you lend money to a stranger, it is a contract. When you lend money to family, it is traditionally an act of mutual aid. By charging interest, he converts a *relational* obligation into a *transactional* one. This changes his role in the family from "cousin" to "creditor."
  *   **The Coercion Question:** Is it truly voluntary? If the alternative is a predatory payday lender or bankruptcy, and he is the "safe" option, there is still a form of structural coercion at play. He is profiting from the fact that the formal banking system has failed his family members.

  **The Principled Objection:** He is extracting rent from his own social safety net. He is turning the family into a market, which erodes the trust and reciprocity that families are supposed to be built on.

  ### 2. The Telos of Wealth (The "No Goal" Problem)
  This is where your philosophical background gives you the clearest lens. Your partner sees money as a tool for security (index funds). Your cousin sees money as a scorekeeping mechanism.

  *   **Aristotle's Distinction:** Aristotle distinguished between *oikonomia* (household management, acquiring what you need for a good life) and *chrematistics* (the art of wealth acquisition for its own sake). He argued that *chrematistics* is unnatural because there is no limit to it.
  *   **The Hedonic Treadmill of Capital:** If there is no number where he stops, he is not free. He is simply a servant to the compound interest formula. A person working a 9-to-5 to buy a house has a *telos* (a purpose/end). A person trading indefinitely just to see the number go up has no *telos*.
  *   **Existential Drift:** You sense that this is hollow because it *is* hollow. It is accumulation without consumption or utility. It treats capital as an end in itself rather than a means to human flourishing (*eudaimonia*).

  **The Principled Objection:** His lifestyle lacks a conception of "enough." Without a definition of "enough," he is not an investor; he is a hoarder. He has replaced a life plan with a growth chart.

  ### 3. Productive vs. Extractive Capital (The Economics)
  Your partner mentions index funds. There is a meaningful difference between what index funds do and what your cousin is doing.

  *   **Index Funds:** When you buy an index fund, you are providing liquidity to the market that allows companies to raise capital, build factories, hire workers, and create products. It is (theoretically) productive capital.
  *   **Crypto/Day Trading:** This is largely zero-sum. For him to win, someone else often has to lose (especially in short-term trading). It is speculative, not productive.
  *   **Family Lending:** If his family members are borrowing to cover consumption gaps (rent, bills), that capital is being consumed, not invested. He is earning interest on debt that does not create new value.

  **The Principled Objection:** He is positioning himself as a rentier within his own micro-economy. He is capturing value rather than creating it.

  ### Why Your Partner Doesn't Get It
  Your partner is operating under a standard neoliberal framework: *Risk taken = Reward earned. Voluntary exchange = Ethical.* From that viewpoint, your cousin is just an aggressive entrepreneur.

  But you are sensing that human life isn't just a series of voluntary transactions. You are sensing that **context matters.**
  *   Trading crypto is one thing; trading crypto *and* lending to family at interest is another.
  *   Making money to retire is one thing; making money indefinitely with no goal is another.

  ### The Verdict
  You aren't being a snob about "real work." Trading is stressful and requires skill; it is work.

  You are objecting to the **moral architecture** of his life.
  1.  He has turned his family into a customer base.
  2.  He has turned wealth into a god rather than a tool.
  3.  He is engaging in extractive economics rather than productive economics.

  It is perfectly rational to feel uneasy about someone who has optimized their life for capital accumulation at the expense of relational integrity and philosophical purpose. You don't have to hate him, but you don't have to respect the *system* he's built, either. It's not snobbery; it's a critique of values.
