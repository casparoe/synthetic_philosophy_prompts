      *   **The Cousin's Rationale:** Returns beat a salary, no coercion involved in borrowing.
      *   **The User's Discomfort:** The cousin isn't saving for a goal (house, trip, FI number); the accumulation of balance is the end goal *indefinitely*.
      *   **The Conflict:** The user's partner (index fund investor) dismisses the concern as "snobbery about real work" (noting the user is a broke philosophy PhD student).
