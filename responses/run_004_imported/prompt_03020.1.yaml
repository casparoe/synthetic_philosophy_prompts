answer: |-
  # The Groundless Truth: A Verdict on Molinism and the Grounding Objection

  William Lane Craig's enthusiasm for Molinism is well-known. For the apologist, it is the holy grail of theological mechanics: a system that preserves exhaustive divine sovereignty (God chooses the world) and robust libertarian freedom (creatures could have done otherwise) without contradiction. The mechanism is "Middle Knowledge." God knows not only all necessary truths (Natural Knowledge) and all actual truths (Free Knowledge), but also all counterfactuals of creaturely freedom (CCFs). He knows, logically prior to His creative decree, that "If Peter were in circumstance C, he would freely deny Christ."

  This allows God to actualize a world where free creatures invariably fulfill His will, not by determining them, but by selecting the specific circumstances in which He knows they will freely choose as He desires.

  However, as you have discovered, the system hinges on the ontological status of these CCFs. If they are true prior to creation and independent of God's will, what makes them true? This is the **Grounding Objection**, championed by Robert Adams and William Hasker. The debate between Molinists (like Thomas Flint and Alfred Freddoso) and their critics often stalls in a stalemate of intuitions.

  This essay will not stall. It will lay out the strongest form of the objection, the most sophisticated defense, and deliver a verdict. The conclusion is this: **The Grounding Objection wins on metaphysical grounds.** Molinism survives only by demanding an exception to general ontological principles that it cannot justify without special pleading. While Molinism functions as a coherent *logical* model, it fails as an *ontological* account of divine knowledge.

  ### The Grounding Objection: Truth Requires Being

  The Grounding Objection is not merely an epistemological query ("How could God know this?"); it is an ontological one ("What *is* this?"). It relies on the **Truthmaker Principle**: for any true contingent proposition, there must exist some entity or state of affairs in virtue of which that proposition is true. Truth does not float free of reality; it supervenes on being.

  Robert Adams formulated the dilemma sharply. Consider the CCF: *"If Peter were in C, he would freely deny Christ."*
  1.  **It cannot be grounded in God.** If God's will or nature makes it true, then Peter's action is determined by God, violating the libertarian freedom Molinism seeks to protect.
  2.  **It cannot be grounded in Peter.** Peter does not exist yet. A non-existent entity cannot ground a truth.
  3.  **It cannot be grounded in the Circumstance.** Circumstance C does not obtain yet.
  4.  **It cannot be grounded in the Actual World.** The world does not exist yet.

  William Hasker sharpened this by focusing on the nature of freedom. If the CCF is true *before* Peter exists, and God relies on it to create the world, then Peter's action is "fixed" prior to his existence. Even if God doesn't *cause* the action, the truth of the action is settled independently of Peter. Hasker argues this renders freedom illusory. If it is *already true* that I will do X in situation Y, before I exist, in what sense am I free to do otherwise? The truth of the counterfactual constrains God's options and predetermines the creature's profile.

  The core of the objection is that Molinism posits **brute contingent facts**. These are truths that just *are*, with no ontological anchor. For a metaphysician, this is spooky. It suggests a realm of "truths" hovering in the ether, unattached to any substance, property, or power.

  ### The Molinist Defense: Logic Over Ontology

  Molinists do not deny the Truthmaker Principle outright; they refine it. The strongest defense comes from Alfred Freddoso and Thomas Flint. Their strategy is to argue that the Grounding Objection relies on **Truthmaker Maximalism**—the idea that *every* true proposition requires a distinct ontological ground—and that Maximalism is false.

  Freddoso argues that some truths are grounded not by objects, but by the logical relations between other truths. For example, the negative truth "There are no unicorns" is true not because there is a "negative unicorn fact," but because the totality of positive facts excludes unicorns. Similarly, Molinists argue CCFs are grounded in the **individual essences** of creatures.

  Alvin Plantinga and Craig suggest that Peter has an "individual essence" (a *haecceity*) that exists in the mind of God eternally. This essence includes all the properties Peter *would* exemplify in any given circumstance. Thus, the ground for "If Peter were in C, he would do X" is the eternal conceptual content of Peter's essence.

  Furthermore, Molinists emphasize **logical priority** over temporal priority. They argue the Grounding Objection mistakenly treats God's knowledge as a temporal event occurring before creation. In reality, God's knowledge is timeless. The CCFs are logically prior to the decree, but not temporally prior. Therefore, asking "what existed *before* to make it true" is a category error. The truth is grounded in the logical structure of possible worlds, which God surveys in His Natural Knowledge.

  Finally, Flint argues that demanding a ground for CCFs is question-begging. If libertarian freedom is real, then there *must* be truths about what agents would freely do. If we cannot identify the ground, that is a limitation of our metaphysics, not proof that the truths don't exist. To deny CCFs is to deny the Principle of Bivalence (that every proposition is either true or false) for counterfactuals, which cripples rational deliberation.

  ### The Evaluation: Why the Defense Fails

  The Molinist defense is sophisticated, but it crumbles under the weight of two specific metaphysical problems: the **Problem of Contingency** and the **Problem of Explanatory Priority**.

  **1. The Problem of Contingency**
  The appeal to "individual essences" fails because essences are typically understood as *necessary*. Peter's essence (what makes him Peter) is the same in every possible world where he exists. However, CCFs are *contingent*. It is not necessary that Peter denies Christ in C; he could have affirmed Christ.
  If Peter's essence is necessary, it cannot ground a contingent truth. If the essence *includes* the contingent choice ("Peter-who-denies-in-C"), then the choice is essential to Peter, meaning he couldn't have done otherwise without ceasing to be Peter. This destroys libertarian freedom.
  Molinists try to have it both ways: the essence must be robust enough to ground the truth, but flexible enough to allow freedom. They cannot sustain this. A necessary entity (essence) cannot ground a contingent fact (free choice) without importing contingency from somewhere else. But where? Not from God (determinism), and not from the world (non-existent). The "ground" vanishes.

  **2. The Problem of Explanatory Priority**
  The Molinist claim that logical priority solves the ontological issue is a sleight of hand. Even if we grant timelessness, the *explanatory* order remains.
  *   Step 1: CCFs are true.
  *   Step 2: God decides to create World W based on Step 1.
  *   Step 3: Peter exists in World W.
  For Step 1 to explain Step 2, Step 1 must be ontologically secure. If Step 1 consists of brute, ungrounded truths, then God's creative decision is based on... nothing.
  Freddoso's rejection of Truthmaker Maximalism is the Molinist's strongest card, but it is played incorrectly. It is plausible that *negative* truths ("no unicorns") or *modal* truths ("2+2=4") lack robust truthmakers. But CCFs are **positive, contingent, categorical claims about non-existents.**
  To say "Peter *would* do X" is to make a claim about the causal powers of a non-existent agent. In every other area of metaphysics, we require a causal power to ground a causal claim. If a match doesn't exist, it has no power to ignite. Molinism asks us to believe that non-existent agents have determinate causal powers that are knowable prior to their existence. This is not just a rejection of Maximalism; it is a rejection of the correspondence theory of truth for contingent propositions.

  ### The Verdict

  Here is the landing spot: **The Grounding Objection is metaphysically superior, and Molinism fails as an ontological thesis.**

  The Molinist survives only by adopting a deflationary view of truth for CCFs while maintaining a realist view of their utility for providence. This is inconsistent.
  *   If CCFs are **brute facts** (as the Grounding Objection charges), then God's sovereignty is limited by a realm of truth He did not author and cannot explain. This introduces a form of dualism: God and the Brute Facts of Freedom.
  *   If CCFs are **grounded in essences**, then freedom is compromised (as the choices become essential properties).
  *   If CCFs are **ungrounded logical abstractions**, then they cannot serve the function Craig needs them to. God cannot *rely* on ungrounded abstractions to guarantee providential outcomes without making those abstractions functionally deterministic.

  **The Qualified Victory:**
  Molinism is a coherent *logic* of divine deliberation, but it is not a coherent *metaphysics* of divine knowledge.
  The Grounding Objection wins **if you hold that contingent truths about causal powers require ontological grounds.** This is a standard, robust metaphysical commitment. To reject it specifically to save Molinism is ad hoc special pleading.
  Molinism survives **only if you reject Truthmaker Maximalism specifically for counterfactuals of freedom.** But there is no independent reason to do this other than saving the theory.

  **Final Ruling:**
  The Grounding Objection succeeds. It exposes that Molinism purchases compatibility between sovereignty and freedom at the cost of ontological coherence. It posits a class of truths that are contingent yet uncaused, about agents that do not exist, known by a mind that did not will them. This is not a mystery of faith; it is a metaphysical contradiction.

  William Lane Craig's favorite move is a brilliant dialectical shield, but it cannot hold against the spear of ontology. There is no "Middle Knowledge" in the sense of pre-volitional, true counterfactuals grounded in reality. Either God determines the truth (losing freedom), or the truth is indeterminate until the agent exists (losing Middle Knowledge). The rabbit hole ends here: **Molinism is logically possible but ontologically groundless.**
