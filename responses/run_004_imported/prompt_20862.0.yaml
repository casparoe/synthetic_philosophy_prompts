prompt: |-
  I'm one of about four people who maintain a small internal Lean library at my company -- basically a tiny in-house mathlib we use to verify parts of a job scheduler. Someone opened a PR with a lemma that says any partial schedule can be extended to a maximal one, proved via Zorn's Lemma (treat partial schedules as a poset ordered by extension, chains get an upper bound by just unioning them, so a maximal element exists). Because that proof bottoms out in choice, Lean forces the definition to be marked noncomputable. Half the maintainers are fine merging it since the theorem's true and we actually need it, the other half think noncomputable lemmas shouldn't live in the same library as our executable scheduler code, since it blurs the line between "this exists" and "here's how to actually build it," and once that norm slides people stop noticing the difference. Our contribution guide says nothing about this case. I've gotta send a short memo before next weeks review recommending one of: merge as-is, quarantine anything noncomputable into its own module, or reject and require a constructive version. Can you draft that memo -- actually pick one, give the reasoning, and don't just wave away the quarantine side as being precious about purity, there's something real going on there so take it seriously.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Situation:**
      *   **Context:** Small internal Lean library for verifying a job scheduler.
      *   **Team:** 4 maintainers (split 2 vs 2 on the issue).
      *   **Issue:** A PR introduces a lemma proved via Zorn's Lemma (noncomputable due to Axiom of Choice).
      *   **Conflict:**
          *   Side A: It's true, we need it, merge it.
          *   Side B: Noncomputable code blurs the line between existence and construction, risks norms slipping, shouldn't mix with executable code.
      *   **Constraint:** Contribution guide is silent on this.
      *   **Task:** Draft a short memo recommending one of three options (Merge, Quarantine, Reject/Constructive).
      *   **Requirement:** Pick a side, give reasoning, acknowledge the validity of the opposing view (specifically the "quarantine" argument), don't be dismissive.

  2.  **Evaluate the Options:**

      *   **Option 1: Merge as-is.**
          *   *Pros:* Fast, gets the theorem needed for verification.
          *   *Cons:* Mixes computable and noncomputable contexts. In a library meant for *verification of a scheduler* (which implies execution), having noncomputable proofs can be confusing. If the library is used to *extract* code, this breaks extraction. Even if not extracting, it sets a precedent that might lead to accidental reliance on noncomputable definitions in computable contexts (though Lean's type system usually prevents this, it affects mental models).
          *   *Verdict:* Risky for a library tied to an *executable* scheduler.

      *   **Option 2: Reject and require constructive version.**
          *   *Pros:* Pure, fully executable, aligns perfectly with the "scheduler" domain.
          *   *Cons:* Zorn's Lemma is often used because the constructive version is hard or impossible without strong assumptions. If the scheduler relies on non-constructive existence (e.g., infinite domains, arbitrary choices), a constructive proof might be impossible or require changing the spec. It blocks progress if the constructive proof is too hard.
          *   *Verdict:* Idealistic, but might be impractical depending on the math involved.

      *   **Option 3: Quarantine noncomputable into its own module.**
          *   *Pros:* Compromise. Acknowledges the utility of classical logic while maintaining a clear boundary for executable code. Preserves the "norm" that default is computable. Makes dependencies explicit.
          *   *Cons:* Slight overhead in organization.
          *   *Verdict:* This is the most robust engineering decision for a mixed-use library. It respects the "purity" concern without blocking the math.

  3.  **Select the Recommendation:**
      *   I need to pick one. The prompt asks me to "actually pick one."
      *   *Decision:* **Quarantine (Option 3).**
      *   *Why?* It addresses the specific concern of the "Side B" maintainers (blurring lines, norms sliding) without discarding the useful math of "Side A". It treats the library as an engineering artifact, not just a math dump. Since the library verifies a *job scheduler* (implying runtime relevance), keeping the executable core pure is critical.

  4.  **Drafting the Memo - Key Elements:**
      *   **To/From/Subject:** Standard memo format.
      *   **Context:** Briefly state the PR issue.
      *   **Recommendation:** Clearly state "Quarantine."
      *   **Reasoning:**
          *   Acknowledge the value of the theorem (Side A).
          *   Acknowledge the risk of mixing contexts (Side B).
          *   Explain *why* the boundary matters (extraction, mental model, accidental dependencies).
          *   Explain the mechanism (separate namespace/module, explicit imports).
      *   **Tone:** Professional, decisive, empathetic to both sides.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is "Quarantine" just "Merge" with extra steps?
      *   *Correction:* No, it signals intent. It prevents `import` pollution. If I'm working on the executable kernel, I shouldn't even *see* the noncomputable lemmas unless I explicitly look for them. It enforces the "computable by default" norm.
      *   *Critique:* Did I take the "purity" argument seriously?
      *   *Correction:* I need to explicitly mention that in a verification library for an *executable* system, the distinction between "it exists" and "we can run it" is not just philosophical; it's functional. Relying on Choice in a module meant for code generation causes extraction failures. Even without extraction, it invites cognitive load.

  6.  **Finalizing the Content:**
      *   *Subject:* Policy on Noncomputable Definitions in Scheduler Library.
      *   *Recommendation:* Adopt a "Quarantine" policy (separate module).
      *   *Rationale:* Preserves utility of classical math while protecting the executable core's integrity.
      *   *Action:* Create `Scheduler.Classical` (or similar), move Zorn lemma there, update PR.

  7.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Pick one? Yes (Quarantine).
      *   Reasoning provided? Yes.
      *   Take quarantine/purity seriously? Yes.

  8.  **Final Polish:** Ensure the tone is collaborative but firm on the engineering principle. (Drafting the response now).

