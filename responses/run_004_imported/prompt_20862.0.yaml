answer: |-
  **TO:** Lean Library Maintainers
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation: Noncomputable Definitions in Scheduler Library

  **Recommendation**
  I recommend we adopt the **Quarantine** approach: merge the Zorn's Lemma proof, but require it reside in a dedicated module (e.g., `Scheduler.Classical`) explicitly separated from our core executable verification logic.

  **Reasoning**
  This issue highlights a tension between mathematical convenience and engineering integrity. Both sides of the current debate are correct about the risks involved.

  The argument for merging as-is is pragmatic: the theorem is true, and classical logic significantly reduces proof burden. However, the argument for quarantine is not merely about philosophical purity; it is about **architectural boundaries**.

  Our library serves a dual purpose: it verifies properties of the scheduler, and it defines the types and functions that the scheduler implements. In this context, the distinction between `noncomputable` and `computable` is functional, not just cosmetic.
  1.  **Extraction Safety:** If we allow noncomputable definitions to leak into core modules, we risk accidental dependencies that break code extraction. A hard module boundary prevents a developer from inadvertently depending on Choice in a module intended for runtime.
  2.  **Cognitive Load:** When working in the core scheduler logic, developers should operate under the assumption that "existence implies construction." Blurring this line increases the cognitive load required to distinguish what can be run versus what is merely proven.
  3.  **Precedent:** Without a quarantine norm, `noncomputable` becomes a default fallback rather than a deliberate tool. Isolating these definitions forces an explicit import decision, signaling to the reader: "Caution: classical reasoning is being used here."

  **Implementation Plan**
  1.  Create a new namespace/module `Scheduler.Classical`.
  2.  Move the Zorn's Lemma proof and any dependent noncomputable definitions there.
  3.  Update the contribution guide to state: *"Core modules must be computable by default. Classical reasoning is permitted only in explicitly marked modules."*

  This allows us to utilize the full power of Lean's logic for verification while maintaining the integrity of the executable core.

  Please review this proposal before next week's meeting.
