      *(Refining the Unanimity point)*: The Feddersen & Pesendorfer result is tricky. Basically, under unanimity, the burden of proof effectively shifts because jurors update their beliefs based on the fact that others are voting to convict. I need to explain this simply without getting bogged down in Bayesian game theory.

      *(Refining the "90% agreement" idea)*: If you require 90% of 50 people (45 people), that's functionally close to unanimity. If you require 90% of 12 (11 people), that's near unanimity. The user wants 90% of 50. That's a very high bar. Does it help? Only if independence holds.

  8.  **Final Polish:** Check for clarity, ensure the distinction between "accuracy" and "justice" (Type I vs Type II errors) is clear. Emphasize that the legal system prioritizes avoiding wrongful conviction over maximizing overall accuracy.

  9.  **Final Review against constraints:** No specific constraints other than answering the prompt. Keep it conversational but rigorous.

