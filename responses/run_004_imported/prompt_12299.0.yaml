  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user recently served on a jury (criminal case, 12 people, convicted after 2 days deliberation, split 9-3 initially).
      *   **Core Idea:** They discovered Condorcet's Jury Theorem (CJT).
      *   **Understanding of CJT:** They believe it proves that if individuals are $>50\%$ competent, a large majority is *mathematically guaranteed* to be correct.
      *   **Proposal:** Increase jury size (to 40-50) and require high agreement (90%) to maximize accuracy based on CJT.
