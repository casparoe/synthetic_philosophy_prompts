          *   Mechanism: Put every individual's name in the hat. 1 name for A, 5 names for B.
          *   Result: Individual in A has 1/6 chance. Individuals in B have 1/6 chance each.
          *   Why this fits Taurek: It respects the "separateness of persons" better than grouping them. It gives equal *individual* probability, whereas Taurek's coin flip gives unequal *individual* probability (50% vs 10%).

