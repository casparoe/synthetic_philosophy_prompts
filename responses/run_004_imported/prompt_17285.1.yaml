          *   Premise 3: Equal concern and respect means giving each individual an equal chance of survival *ex ante*.
          *   Conclusion: Flip a fair coin between Group A (1 person) and Group B (5 people). Each *group* gets 50%, meaning the individual in A has 50% chance, individuals in B have 10% each.
