  ### 3. Plain-Terms Explanation: Why the Reversal?

  You can have your characters explain this using the difference between **Distance** and **Surprise**.

  **The Brier Score measures "Distance."**
  Think of the Brier score like measuring physical distance from a target. If Dinah stands 1 foot away from the bullseye nine times, and 10 feet away once, her *average* distance is still quite good. The penalty for being wrong grows quadratically (squared), but it is **bounded**. The maximum error on any single race is 1.0 (predicting 100% and being wrong). Dinah's nine "close" calls mathematically outweighed her one "far" call.

  **The Log Score measures "Surprise."**
  The Logarithmic score measures how shocked you should be by the result. It is **unbounded**. If you say something is impossible (0%) and it happens, your penalty is infinite. If you say it is 3% likely and it happens, your penalty is massive (3.5 points).
  Renata wins here because she is **calibrated**. She never claimed an outcome was nearly impossible. Dinah loses here because she was **overconfident**. In the world of Log Scoring, one claim of "near certainty" that turns out false is so damaging that it cannot be redeemed by nine correct "likely" predictions.

  **The Tension:**
  Dinah was more *discriminating* (she knew which races were safer than others), which Brier rewards. Renata was more *humble* (she admitted uncertainty even in safe races), which Log rewards.

