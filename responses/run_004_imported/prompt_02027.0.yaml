  | 10 | 0 | $0.97$ | $0.9409$ | $0.75$ | $0.5625$ |
  | **Sum** | | | **1.0309** | | **1.1250** |
  | **Avg** | | | **0.1031** | | **0.1125** |

  **Verdict:** **Dinah Wins.** ($0.1031 < 0.1125$)
  *Why:* Dinah's high confidence on the 9 correct races (0.90 vs 0.75) reduced her error enough to offset the massive error on Race 10. The squared function penalizes the error, but not enough to overcome her resolution on the other nine.

  #### B. Logarithmic Score (Log Loss)
  *Formula:* $-\ln(p)$ if correct, $-\ln(1-p)$ if incorrect.
  *Intuition:* How "surprised" should we be by the outcome given the prediction? (Unbounded penalty).

  | Race | Outcome | Dinah's Log Penalty | Renata's Log Penalty |
  | :--- | :---: | :---: | :---: |
  | 1–9 | 1 | $-\ln(0.90) \approx 0.1054$ | $-\ln(0.75) \approx 0.2877$ |
  | 10 | 0 | $-\ln(0.03) \approx 3.5066$ | $-\ln(0.25) \approx 1.3863$ |
  | **Sum** | | **4.4552** | **3.9756** |
  | **Avg** | | **0.4455** | **0.3976** |

  **Verdict:** **Renata Wins.** ($0.3976 < 0.4455$)
  *Why:* Dinah's single error on Race 10 was a "Log catastrophe." Because she assigned only a 3% chance to the event that actually happened, the logarithmic penalty exploded to 3.5 points. Renata's caution (assigning 25% to the upset) limited her penalty to 1.38 points. This single race swung the entire Log tally, whereas it was merely a heavy weight on the Brier tally.

