  ### 2. The Scoring: Calculating the Verdict

  In forecasting and epistemology, these are typically calculated as **Loss Functions**, where **Lower is Better** (fewer penalty points = more accurate).

  #### A. Brier Score (Quadratic Loss)
  *Formula:* $(p - \text{outcome})^2$
  *Intuition:* How far was the probability from the truth (0 or 1), squared?

  | Race | Outcome | Dinah's Error | Dinah's Brier Penalty | Renata's Error | Renata's Brier Penalty |
  | :--- | :---: | :---: | :---: | :---: | :---: |
