      *   *The Trap:* You are assuming that if the physical cause is sufficient, the mental cause is redundant. This assumes they are *two different things*.
      *   *The Fix (Identity/Realization):* If mental state $M$ *is* physical state $P$ (at a higher level of description), then $M$ causing $M^*$ is the same event as $P$ causing $P^*$. No overdetermination.
      *   *Interventionism:* This is crucial for a rationalist audience. Judea Pearl/Woodward. Causation is about counterfactuals. If I intervene on the *belief* (via therapy), the outcome changes. Therefore, the belief is a cause. The fact that the belief intervention *works by* changing neurons doesn't make the belief irrelevant.
