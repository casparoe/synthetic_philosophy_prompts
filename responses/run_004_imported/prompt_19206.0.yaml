answer: |-
  This is a remarkably sharp diagnosis of the situation. You have identified the exact friction point that keeps philosophers of computation up at night: the Church-Turing Thesis (CTT) is an *explication* of an intuitive concept, not a mathematical theorem, yet it is often wielded as a physical law.

  Your intuition that "it's just a thesis, not a theorem" is often used rhetorically is correct, but it also carries genuine philosophical weight if we disentangle *which* thesis is being discussed. The confusion in your library group, your nephew's workplace, and the online forums stems almost entirely from conflating two distinct claims that share the same name.

  To answer your request, we need to separate the **Mathematical Church-Turing Thesis** from the **Physical Church-Turing Thesis**. Once separated, the epistemic status of each changes, and so does what counts as evidence for or against them.

  ### 1. The Two Theses and Their Epistemic Status

  **The Mathematical CTT (CTT-M):**
  *   *Claim:* Every function that is "effectively calculable" (by a human following a definite method) is Turing-computable.
  *   *Status:* Conceptual/Philosophical.
  *   *Why not a theorem?* As you noted, "effectively calculable" is an informal intuition. You cannot prove a formal system equivalent to an intuition without formalizing the intuition, which renders the proof circular.
  *   *Evidence:* The evidence is the convergence of formalisms (Lambda calculus, recursive functions, Turing machines) and the failure of 90 years of mathematicians to find a counter-example of a "human-algorithm" that isn't Turing-computable.
  *   *Falsifiability:* In principle, low. To falsify this, you would need to demonstrate a step-by-step procedure a human can follow that yields a non-recursive result. Since "step-by-step" implies finite symbols and finite time, it is hard to see how this could physically happen without redefining "procedure."

  **The Physical CTT (CTT-P):**
  *   *Claim:* Every function that is physically computable (by any physical system in our universe) is Turing-computable.
  *   *Status:* Empirical/Scientific.
  *   *Why distinct?* This moves from "what a human can calculate" to "what the universe can compute."
  *   *Evidence:* Our current best physical theories (QFT, GR).
  *   *Falsifiability:* High. If we build a device that solves the Halting Problem, CTT-P is false.

  Most disputes you encounter arise because participants switch between CTT-M and CTT-P without noticing.

  ### 2. The Brain and AI Argument (Nephew vs. Colleague)

  **The Dispute:**
  *   *Nephew:* Brains are Turing-equivalent $\rightarrow$ Digital AI can think.
  *   *Colleague:* Brains are analog/continuous $\rightarrow$ Hypercomputation $\rightarrow$ Digital AI fails.

  **Analysis:**
  This argument trades on **CTT-P**, but it smuggles in a third claim about consciousness.

  1.  **Analog vs. Digital:** Your colleague is technically referencing a known result in computability theory (e.g., Siegelmann & Sontag, 1994). An Analog Recurrent Neural Network (ARNN) with *arbitrary real-valued weights* can compute super-Turing functions. However, this requires infinite precision. In condensed matter terms, this assumes a continuous order parameter with no noise floor and no Bekenstein bound on information density.
  2.  **The Physics Check:** If the universe is fundamentally discrete (Planck scale) or if there is any fundamental noise floor, the "arbitrary real weight" collapses to a rational approximation, and the system returns to Turing-equivalence. Your colleague's argument relies on a specific (and controversial) ontology of spacetime and information.
  3.  **The "Thinking" Leap:** Even if the brain is a hypercomputer (refuting CTT-P), it does not follow that a Turing machine cannot "think." This conflates *computational capacity* with *semantic content*. A Turing machine can simulate the input-output behavior of a hypercomputer to arbitrary precision, even if it can't match it exactly in finite time. Whether that simulation constitutes "thinking" is a philosophical question (Searle, Functionalism), not a computability one.

  **Verdict:** The nephew and colleague are debating **CTT-P**. The nephew assumes standard physics (brains are finite state machines approximated by TMs); the colleague assumes continuous physics allowing hypercomputation. Neither argument settles the nature of "thinking," which is orthogonal to computability classes.

  ### 3. The Quantum Computing Argument

  **The Dispute:**
  *   *Claim:* Quantum Computers refute CTT.
  *   *Counter:* That's complexity, not computability.

  **Analysis:**
  The counter-claim is correct, and this is the clearest case of category confusion.

  1.  **Computability vs. Complexity:** CTT concerns the *boundary* of the computable (Recursive vs. Non-recursive). Quantum computers (BQP) do not cross this boundary. A Quantum Turing Machine can compute anything a classical TM can, and vice versa. They differ in *efficiency* (polynomial vs. exponential time), not *capability*.
  2.  **Epistemic Weight:** Invoking CTT here is indeed rhetorical fluff. The thesis is silent on time complexity. A quantum computer solving factoring in polynomial time does not threaten CTT-M or CTT-P any more than a fast GPU does.
  3.  **The Nuance:** There is a fringe argument (Tien Kieu, 2002) regarding Adiabatic Quantum Computing potentially solving Hilbert's 10th Problem (undecidable). However, this requires infinite precision in energy levels and infinite time to read out the ground state, returning us to the "infinite precision" physical objection mentioned above.

  **Verdict:** The claim that QC refutes CTT is a confusion of **Complexity Theory** with **Computability Theory**. It carries no philosophical weight against the thesis.

  ### 4. The Hypercomputation Argument (Oracles, Malament-Hogarth)

  **The Dispute:**
  *   *Claim:* If hypercomputers are physically possible, CTT is false.
  *   *Counter:* That doesn't count as "effective calculation."

  **Analysis:**
  This is where the distinction between CTT-M and CTT-P does the most work.

  1.  **Malament-Hogarth Spacetimes:** In certain solutions to General Relativity, an observer can witness an infinite computation finish in finite proper time (e.g., falling into a specific black hole while a computer orbits outside).
  2.  **CTT-P:** If such spacetimes exist and are accessible, **CTT-P is false.** The universe would allow the computation of non-recursive functions. This is an empirical question about the topology of our universe.
  3.  **CTT-M:** However, **CTT-M remains intact.** Why? Because the Church-Turing thesis defines "effective calculability" relative to a *human agent* following rules. In the Malament-Hogarth scenario, the "computer" does the hyper-work, but the human observer cannot replicate the process. The human cannot "effectively calculate" the result themselves; they merely observe the output of a physical oracle.
  4.  **Oracle Machines:** Turing himself introduced Oracle machines. He did not view them as refuting his thesis; he viewed them as extending the formalism beyond the "effective."

  **Verdict:** Physical hypercomputation refutes **CTT-P** (the universe is richer than TMs) but leaves **CTT-M** (the limits of human algorithmic reasoning) untouched. The disagreement online is often people arguing past each other about which version they mean.

  ### 5. What Counts as Evidence?

  To answer your core question on evidence and the weight of "it's just a thesis":

  **For CTT-M (Mathematical):**
  *   **Evidence:** Conceptual coherence. The fact that every attempt to formalize "algorithm" lands on the same class.
  *   **Falsification:** Almost impossible. It would require a human to demonstrate a "method" that is finite and definite but yields non-recursive results. Since "finite and definite" essentially builds Turing-computability into the definition, this is why it feels like a definition rather than a hypothesis.
  *   **Weight:** "It's just a thesis" here means **"This is a proposed definition."** We accept it because it is fruitful, not because it is empirically verified.

  **For CTT-P (Physical):**
  *   **Evidence:** The success of digital physics, the absence of observed infinite precision in nature, thermodynamic limits on computation (Landauer's principle).
  *   **Falsification:** A black box that consistently outputs solutions to the Halting Problem.
  *   **Weight:** "It's just a thesis" here is **misleading.** It is a scientific hypothesis subject to empirical falsification. If the universe is analog and noise-free, CTT-P falls.

  ### Summary for Your Discussion Group

  When you return to the library, you might propose this framework to cut through the noise:

  1.  **Check the Subject:** Are we talking about what a *human* can calculate (CTT-M) or what the *universe* can compute (CTT-P)?
  2.  **Check the Precision:** Arguments for biological or analog hypercomputation require **infinite physical precision**. In a physicist's terms, they assume a continuous phase space with no entropy floor. If you believe in the Bekenstein bound or quantum granularity, these arguments fail.
  3.  **Check the Category:** Quantum computing arguments usually confuse **speed** (Complexity) with **capability** (Computability).
  4.  **The "Thesis" Defense:** When someone says "It's just a thesis," ask them: "Do you mean it's a definition of human reasoning (which can't be disproven), or a claim about physics (which can be)?"

  The phrase "it's just a thesis" is not rhetorical fluff; it is a marker of **category**. It reminds us that CTT-M is a normative claim about the concept of the "algorithm," while CTT-P is a descriptive claim about the laws of physics. Your nephew and his colleague are debating physics (CTT-P); the online crowd is often debating definitions (CTT-M). They are playing different games with the same pieces.

  **Recommendation:** If you want to read one paper that bridges this gap beautifully for a physicist, look for **"The Physical Church-Turing Thesis" by Pitowsky (2002)** or **"Computational Power of Neural Networks" by Siegelmann (1995)**. They treat the physical constraints (noise, precision) with the seriousness a condensed matter physicist would appreciate.
