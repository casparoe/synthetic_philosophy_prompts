answer: |-
  This is a sophisticated philosophical problem to anchor a character in. You are asking about the **Overdetermination Problem** in moral psychology: If an agent has both a moral motive (duty) and a non-moral motive (inclination/affection) that are sufficient to produce the action, does the presence of the non-moral motive undermine the moral worth of the action?

  Kant's strict answer is "yes, potentially," because he requires the motive of duty to be *sufficient* on its own and prioritized over inclination. However, the contemporary philosophers you cited offer distinct mechanisms for saving the moral worth of your protagonist. They do not merely agree with each other; they disagree on *what feature* of the agent's psychology generates moral worth.

  Here is how Herman, Markovits, and Arpaly diverge on the specific mechanics of moral worth, structured to help you scaffold your protagonist's interiority.

  ### 1. Barbara Herman: Duty as the "Limiting Condition"
  **The Core Disagreement with Kant:** Kant worries that if you enjoy doing the right thing, you might be acting *only* for the enjoyment. Herman argues that we don't need to isolate duty as the primary psychological push in the moment.

  **The Mechanism:** Herman proposes that duty operates as a **background constraint** rather than a foreground motive. Your protagonist can act primarily out of love or self-interest, *provided* that these motives are vetted by a commitment to morality.
  *   **The Test:** Would the protagonist still refrain from the action if it turned out to be immoral, even if their affection or self-interest remained?
  *   **Moral Worth Source:** Worth comes from the **authority of the moral law** over the agent's other desires. The agent treats morality as a "limiting condition" on what their inclinations are allowed to do.

  **For Your Novel:**
  To write a Herman-esque protagonist, you don't need them to monologue about duty. Instead, show a moment where their affection *conflicts* with morality, and they choose morality.
  *   *Example:* He wants to save his friend (affection), but realizes doing so requires lying to an innocent third party. He stops. Later, when saving the friend requires no lying, he acts out of pure love.
  *   *Why it works:* The earlier restraint proves that duty is the "limiting condition." Once the boundary is set, he is free to act from mixed motives without losing moral worth.

  ### 2. Julia Markovits: The Coincidence of Reasons
  **The Core Disagreement with Herman (and Kant):** Markovits shifts the focus from the *authority* of morality (Herman/Kant) to the **content of the reasons**. She argues that moral worth is conferred when the agent's *motivating reasons* match the *justifying reasons* for the action.

  **The Mechanism:**
  *   **Justifying Reason:** Why the act is actually right (e.g., "This action alleviates suffering").
  *   **Motivating Reason:** Why the agent actually does it.
  *   **The Disagreement:** Herman still requires the agent to acknowledge the *authority* of duty. Markovits argues that if the agent acts because "this alleviates suffering," they have moral worth, even if they never think the word "duty." The presence of self-interest or affection doesn't cancel this out, provided the *moral reason* is also present and operative.
  *   **Overdetermination:** For Markovits, overdetermination isn't a problem. If I help you because I love you *and* because you are in pain, and "you are in pain" is what makes the act right, I have moral worth. The affection is surplus; it doesn't contaminate the moral reason.

  **For Your Novel:**
  To write a Markovits-esque protagonist, focus on their **perception of value**.
  *   *Example:* When he helps someone, show him noticing their need. His internal narrative shouldn't be "I must do this," but rather "This person is hurting, and that matters."
  *   *Why it works:* It validates his affection. If his affection makes him more sensitive to people's pain, his affection actually *enhances* his moral worth because it aligns his motivations with the justifying reasons (the pain itself).

  ### 3. Nomy Arpaly: Responsiveness to Moral Reasons (The Huck Finn Case)
  **The Core Disagreement with Markovits and Herman:** Arpaly takes the most radical stance. She argues that an agent can have moral worth even if they have **false moral beliefs**, provided they are responsive to the actual moral facts.

  **The Mechanism:**
  *   **The Huck Finn Case:** Huck believes helping Jim is *wrong* (against duty/societal law). He helps anyway because he sees Jim's humanity. Kant and Herman would struggle here because Huck rejects the authority of duty. Markovits might struggle because Huck doesn't grasp the *justifying reason* (he thinks the justification is weak/immoral).
  *   **Arpaly's View:** Moral worth is about **responsiveness to moral reasons**, not moral deliberation. Huck sees Jim's suffering (a moral reason) and responds to it, overriding his mistaken belief that he shouldn't.
  *   **The Disagreement:** Arpaly argues that "acting from duty" can sometimes be morally inferior to acting from unreflective empathy. If you help someone *only* because it's your duty, you might be missing the point (the person's suffering). If you help because you care, you are more deeply responsive to the moral reality.

  **For Your Novel:**
  To write an Arpaly-esque protagonist, give them **moral blind spots** or a distrust of abstract rules.
  *   *Example:* He might think he's just being "soft" or "weak" by helping, or he might explicitly think, "I probably shouldn't get involved," but he finds himself doing it anyway because he can't stand to see the injustice.
  *   *Why it works:* This creates a character whose goodness is deeper than their intellect. It allows you to write a protagonist who does the right thing *despite* their own self-conception, which is often more compelling fiction than a hero who knows they are holy.

  ### Summary of Disagreements for Character Scaffolding

  Here is how you can use their disagreements to tune specific scenes:

  | Feature | **Kant (Strict)** | **Herman (Limiting Condition)** | **Markovits (Coincidence)** | **Arpaly (Responsiveness)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Primary Source of Worth** | The motive of Duty alone. | The submission of Inclination to Duty's authority. | The match between Motivating & Justifying Reasons. | Responsiveness to Moral Facts (even without belief). |
  | **Role of Affection** | Suspicious. Risks crowding out duty. | Permitted, *if* duty sets the boundaries. | Irrelevant to worth, provided moral reasons are present. | Can be superior to duty; shows deeper responsiveness. |
  | **Role of Self-Interest** | Cancels moral worth if primary. | Permitted, *if* it doesn't violate moral constraints. | Irrelevant to worth, provided moral reasons are present. | Irrelevant; only responsiveness matters. |
  | **Conscious Belief** | Must believe "I am doing my duty." | Must acknowledge the authority of morality. | Must grasp the reasons why the act is good. | **Can be wrong** about morality (e.g., Huck Finn). |
  | **The Overdetermination Fix** | It's a threat; motives must be isolatable. | Duty is the silent partner/filter. | Overdetermination is fine; reasons coincide. | Overdetermination is a non-issue. |

  ### Practical Application: The "Mixed Motive" Scene

  Imagine a scene where your protagonist helps a rival at a cost to himself.

  1.  **If you follow Herman:** Show the protagonist considering a "shortcut" that would help the rival but break a rule. He rejects the shortcut. Then, he helps the rival via the right path, feeling happy to do so.
      *   *Scaffolding:* The worth comes from the *rejection* of the shortcut, validating the affection that follows.
  2.  **If you follow Markovits:** Show the protagonist recognizing the rival's plight. He thinks, "He's in a bad spot, and he doesn't deserve this." He helps. He also notes, "Plus, this makes me look good."
      *   *Scaffolding:* The self-interest is noted but doesn't negate the fact that he acted on the *reason* that makes the act right (the rival's underserved suffering).
  3.  **If you follow Arpaly:** Show the protagonist thinking, "I ought to walk away. He's my enemy. It's not my problem." But he sees the rival shaking with fear, and his legs move before his mind decides.
      *   *Scaffolding:* His moral worth is highest here precisely because his *belief* told him to walk away, but his *responsiveness* to the moral fact (fear/suffering) overrode it.

  ### Recommendation for Your Novel

  Since you want to avoid the "saintly" archetype (pure duty) but maintain philosophical soundness, a **hybrid of Markovits and Arpaly** is likely the most fertile ground for fiction.

  *   **Use Markovits** to validate his affection. He loves people, and that love makes him attentive to their needs (the justifying reasons). This makes him warm and human, not robotic.
  *   **Use Arpaly** to give him conflict. Let him sometimes doubt whether he's doing the right thing, or let him act against his own self-interest without fully understanding why. This creates the "overdetermination" you described: he acts from duty, love, and interest, but perhaps the love is the vehicle that allows the duty to manifest.

  This approach solves the overdetermination problem by suggesting that **motives are not zero-sum.** In these frameworks, affection doesn't dilute duty; often, affection is the psychological mechanism that allows an agent to be sufficiently responsive to moral reasons in the first place.
