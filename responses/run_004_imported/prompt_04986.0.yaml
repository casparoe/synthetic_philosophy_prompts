      *   **The Question:** Are these objections the *same* worry (personal identity/popular sovereignty)? If one case is defensible, is the other? Or is one shakier?
      *   **Elster's Trajectory:** *Ulysses and the Sirens* (optimistic) $\rightarrow$ *Ulysses Unbound* (pessimistic/qualified). Does this track a genuine asymmetry, or was he overcautious?
