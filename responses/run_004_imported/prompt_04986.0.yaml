      *   *Final Decision:* The psychiatric case is the stronger *moral* case for precommitment (due to competence loss). The constitutional case is the weaker *structural* case for precommitment (due to sovereignty issues). Elster was right to retreat on the constitutional case, but not for the same reasons one might doubt the psychiatric case.
