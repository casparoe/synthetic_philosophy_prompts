answer: |-
  Here is the verdict: **The psychiatric Ulysses contract is the more defensible instance of binding a future self, while the constitutional analogy is structurally flawed in ways that Elster correctly identified in his retreat.** The objections are not merely the same worry wearing different vocabulary; they reveal a fundamental asymmetry between *psychological continuity* and *political sovereignty*. Elster was not being overcautious in *Ulysses Unbound*; he was correcting a category error.

  To justify this, we must disentangle the metaphysics of identity from the mechanics of enforcement. The standard comparison assumes that because both cases involve $T_1$ restricting $T_2$, the normative logic is identical. It is not. The psychiatric case succeeds as a Ulysses contract precisely where the constitutional case fails: in the justification for overriding contemporaneous wishes.

  ### 1. The Competence Threshold vs. The Sovereignty Problem

  The strongest argument for the psychiatric Ulysses contract is that it does not actually rely on overriding a *competent* future self. It relies on a pre-determined finding of *incapacity*.

  In the psychiatric model, the "manic self" is not treated merely as a self with different preferences (e.g., valuing spiritual euphoria over financial stability). It is treated as a self with degraded cognitive machinery. The legal and ethical force of the advance directive rests on the medical consensus that mania impairs judgment, reality testing, and impulse control. When the doctors involuntarily medicate the patient, they are not saying, "Your past self knew better what you value." They are saying, "Your current self is legally incompetent to express values at all." The Ulysses contract here functions as a proxy appointment for a period of adjudicated incapacity.

  The constitutional case lacks this competence threshold. When a Supreme Court strikes down a law passed by a contemporary majority, it is not claiming the voters are *medically incompetent*. It is claiming they are *normatively mistaken* or *temporarily passionate*. This resurrects the Jeffersonian objection with full force. If the future generation is numerically distinct and fully competent, the "binding" is not a restraint on a weaker self, but a veto by a dead hand.

  Ackerman's distinction between "higher lawmaking" and "ordinary politics" attempts to import the psychiatric "lucid vs. manic" distinction into constitutional theory. However, this is a category error. We have biological markers for mania; we have no objective markers for when "The People" are speaking in a higher voice versus a lower one. In the psychiatric case, the transition from lucid to manic is (ideally) observable and diagnosable. In the constitutional case, the transition from "sovereign people" to "factional majority" is a matter of political interpretation, usually decided by the very institution (the Court) that is supposed to be bound by the text.

  Therefore, the psychiatric contract is more defensible because it rests on a threshold of *agency* (competence), whereas the constitutional contract rests on a hierarchy of *preferences* (rights vs. utility). Overriding a non-agent is paternalism justified by welfare; overriding a competent agent is counter-majoritarianism justified by abstract principle. The former is the classic Ulysses structure; the latter is a different beast entirely.

  ### 2. The Enforcement Asymmetry (The Mast Problem)

  This is where Elster's retreat in *Ulysses Unbound* is most telling. In the original Odysseus myth, the binding works because there is an external constraint (the ropes) and external enforcers (the crew) who are instructed to ignore Odysseus's pleas.

  In the psychiatric case, this structure holds. The "crew" consists of medical professionals and legal statutes. They are external to the patient's immediate will and are empowered by the patient's prior competent self to ignore the current incompetent self. The binding is causal and physical (medication, locked doors).

  In the constitutional case, the structure collapses. Who is the crew? The judiciary? The military? The bureaucracy? All of these are part of the ship. They are agents of the current polity. There is no external enforcer to hold the constitution against the will of a determined contemporary majority. If a majority truly wants to violate a constitutional norm (and has the political will to pack courts or ignore rulings), the "binding" dissolves.

  Elster came to realize that constitutions do not function primarily as *precommitment devices* (which require binding), but as *focal points* (which require coordination). A constitution helps a polity coordinate on which equilibria to avoid (e.g., tyranny), but it cannot physically prevent a determined majority from shifting to a new equilibrium. The psychiatric contract, by contrast, *can* physically prevent the patient from acting.

  This confirms the asymmetry: The psychiatric case is a genuine Ulysses contract because the binding mechanism is external to the $T_2$ self's will. The constitutional case is a metaphorical Ulysses contract because the binding mechanism is internal to the polity's own current operations.

  ### 3. Why Elster Was Right to Retreat

  Elster's shift from *Ulysses and the Sirens* to *Ulysses Unbound$ was not mere overcaution; it was a recognition that the constitutional analogy breaks down under the weight of *uncertainty* versus *weakness of will*.

  In the psychiatric case, the threat is internal and predictable: "I know I become manic." The precommitment is against a known flaw in the self.
  In the constitutional case, Elster argued that constitution-makers are often motivated by *uncertainty* about who will hold power in the future, not just a desire to bind passion. They are hedging bets. This makes the constitutional "contract" less about self-binding and more about insurance against opponents.

  Furthermore, Elster recognized that for a Ulysses contract to be rational, the $T_1$ self must be sure that $T_2$ is making a mistake. In the psychiatric case, the "mistake" is defined by the loss of competence. In the constitutional case, $T_1$ (the Founders) cannot know if $T_2$ (a future generation) is acting out of passion or out of a genuine moral evolution (e.g., regarding civil rights that the Founders themselves denied). If $T_2$ values are genuinely different, not just "hotter," the Ulysses contract becomes an instrument of oppression rather than protection.

  Elster's retreat tracks this genuine asymmetry. He realized that while individuals can reasonably predict their own future irrationality (akrasia), polities cannot reasonably predict that their future selves will be irrational rather than simply *different*.

  ### Conclusion

  The two objections are not the same worry. The psychiatric objection concerns the **metaphysics of personal identity** (is the manic self the same person?), but this is resolved by the **legal standard of competence**. The constitutional objection concerns the **legitimacy of intergenerational sovereignty** (can the dead rule the living?), which has no equivalent resolution because future generations are competent agents.

  **Verdict:** The psychiatric Ulysses contract is the more defensible model. It successfully isolates a state of diminished agency and authorizes external enforcement to bridge that gap. The constitutional Ulysses contract is a weaker analogy because it attempts to bind competent, distinct agents using internal enforcement mechanisms that lack the causal power of the psychiatric model.

  Elster's retreat was justified. He correctly identified that constitutions are not ropes tied around the mast of the state, but rather maps that the current crew chooses to follow only as long as they believe the map is useful. The psychiatric patient, however, is physically restrained by the crew she hired when she was sane. That distinction makes the psychiatric case a true Ulysses contract, and the constitutional case a useful, but ultimately distinct, political fiction.
