      *   **Core Question:** How would Quine react to the Universal Moral Grammar (UMG) research program? Would he attack it like he attacked Chomsky's linguistics, or does the ethical context change things?
      *   **Underlying Tension:** Quine's naturalism/empiricism vs. Innatism (Chomsky) vs. Moral Non-Cognitivism/Relativism (Quine's ethics).

  2.  **Deconstruct Quine's Positions:**
      *   **Epistemology/Ontology:** Naturalized epistemology. All knowledge ultimately rests on sensory stimulation (the "sensory periphery"). Holism (Web of Belief). Rejection of the analytic/synthetic distinction.
      *   **Linguistics (vs. Chomsky):** Quine favored behaviorist/empiricist accounts of language learning (induction, conditioning). He was skeptical of "rich" innate structures because they seemed occult, unobservable, and unnecessary if general learning mechanisms could do the job. He worried about the "poverty of the stimulus" argument but thought it was overstated or explainable differently.
      *   **Ethics ("On the Nature of Moral Values"):** Quine is a moral skeptic/relativist/non-cognitivist (depending on interpretation). He argues moral statements lack truth values in the scientific sense. They are expressions of sentiment or social conditioning. There is no "moral reality" to correspond to. Moral claims don't impinge on the sensory periphery.

  3.  **Analyze Universal Moral Grammar (UMG):**
      *   **Proponents:** Marc Hauser, John Mikhail, inspired by Chomsky.
      *   **Core Claim:** Humans have an innate, unconscious computational system for moral judgment (a "moral organ"). It generates intuitive judgments based on principles (like trolley problems) similar to how UG generates grammaticality judgments.
      *   **Methodology:** Trolley problems, cross-cultural studies, cognitive science experiments.
      *   **Goal:** To find objective, universal structures underlying moral intuition.

  4.  **Synthesize: Quine vs. UMG:**
      *   **Point 1: Innatism.** Quine hated positing innate ideas unless absolutely necessary. Chomsky argued language *required* it. UMG argues morality *requires* it. Quine would likely be skeptical of the *necessity* of the claim. He'd ask: Can't social conditioning and general learning explain this?
      *   **Point 2: Objectivity/Truth.** This is the big one. Chomsky's UG is descriptive (how the brain *works*), not normative (how we *should* speak). UMG claims to describe how the brain makes moral judgments. *However*, UMG often implies a search for universal moral *truths* or at least a structure that validates certain judgments. Quine's ethics paper says moral values aren't truth-apt in the scientific sense. If UMG is just psychology (descriptive), Quine might tolerate it as empirical science. If UMG claims to ground moral *objectivity*, Quine would reject it.
      *   **Point 3: The Sensory Periphery.** For Quine, science checks against observation. Linguistics checks against utterances/behavior. Moral grammar checks against... intuitive judgments? Quine would ask: What is the observational basis? Is it just reported feelings? That's shaky ground for a "science" of morality.
      *   **Point 4: Continuity.** Quine sees philosophy as continuous with science. If cognitive science finds a moral module, Quine *should* accept it *if* the evidence is good. But he would be a harsh critic of the evidence.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Initial thought:* Quine would hate it. He hates Chomsky, and he hates objective morality.
      *   *Correction:* It's more nuanced. Quine respects natural science. If UMG is presented as *psychology* (causal mechanisms), he might accept the methodology but doubt the conclusion. If it's presented as *ethics* (justifying values), he'd crush it.
      *   *Key Distinction:* Descriptive vs. Normative. Chomsky's linguistics is descriptive. UMG tries to be descriptive but often bleeds into normative implications (if it's universal, is it right?). Quine would police that boundary fiercely.
      *   *The "Poverty of the Stimulus" parallel:* Chomsky said kids hear too little to learn grammar. UMG says kids face too few moral dilemmas to learn moral principles. Quine would argue general socialization is enough.
      *   *The "Moral Reality" issue:* In "On the Nature of Moral Values," Quine says moral traits are cultivated, not discovered. UMG says they are discovered (internally). This is a direct clash.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Validate the connection between Quine's linguistics and ethics.
      *   **The "Chomsky" Angle (Innatism):** Discuss Quine's skepticism of rich innate structures. The "Poverty of the Stimulus" argument applied to morality. Quine's preference for behaviorism/conditioning.
      *   **The "Ethics" Angle (Objectivity):** Discuss "On the Nature of Moral Values." The lack of sensory periphery for morals. UMG tries to naturalize ethics, but Quine thinks ethics isn't truth-apt.
      *   **The Nuance (Naturalism):** Quine is a naturalist. If UMG is purely empirical psychology, he might accept the *project* but critique the *results*. He wouldn't rule it out a priori, but he'd demand rigorous behavioral evidence.
      *   **Conclusion:** Verdict. He would likely tear into it, but for slightly different reasons than Chomsky. It's a "double whammy" of innate ideas + moral objectivity.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did Quine actually write "On the Nature of Moral Values"? Yes, it's a short piece (1981).
      *   *Check:* What exactly was Quine's beef with Chomsky? It wasn't just behaviorism; it was about the indeterminacy of translation and the lack of empirical grounding for deep structures.
      *   *Check:* Hauser/Mikhail. They explicitly cite Chomsky. They focus on *unconscious* knowledge. Quine is skeptical of unconscious propositional attitudes that aren't behaviorally manifest.
      *   *Crucial Point:* Quine's *Indeterminacy of Translation*. If moral principles are internal and unconscious, how do we translate/verify them across cultures? Quine would say you can't pin them down.

  8.  **Final Polish:** Ensure the tone is appropriate for a seminar student (academic but accessible, engaging with the specific texts mentioned). Use Quinean terminology (sensory periphery, web of belief, indeterminacy, naturalized epistemology).

      *(Self-Correction on the Ethics Paper)*: In "On the Nature of Moral Values," Quine argues that moral statements are not true or false in the same way scientific statements are. They are more about fostering social cohesion. UMG claims to find a universal structure. Quine would say even if there is a universal structure, it doesn't make the values *true*, just biologically ingrained. This is the Euthyphro-style dilemma Quine would exploit.

  9.  **Finalizing the Verdict:** Quine would see UMG as a category mistake. It tries to use science (psychology) to validate something (moral structure) that science can't validate (moral truth). Plus, he'd hate the innatism. So, yes, he would tear into it.

