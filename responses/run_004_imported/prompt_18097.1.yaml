answer: |-
  This is a fantastic question. It cuts right to the heart of the tension between Quine's naturalism and his skepticism. You have correctly identified the two main pressure points: his **empiricist/behaviorist account of learning** (vs. Chomsky's innatism) and his **non-cognitivist/relativist account of ethics** (vs. the idea of objective moral truth).

  If Quine were alive today to review the Universal Moral Grammar (UMG) program of Hauser, Mikhail, and colleagues, I suspect he would dismantle it with even more vigor than he did Chomsky's linguistics. It would be a "double whammy": UMG violates his constraints on learning *and* his constraints on what counts as factual discourse.

  Here is how I think Quine would attack the UMG program, broken down by his core philosophical commitments.

  ### 1. The Innatism Objection (The Chomsky Replay)
  Quine's debate with Chomsky wasn't just about language; it was about the **poverty of the stimulus** argument. Chomsky argued that the input children receive is too sparse to explain the complexity of the grammar they acquire, necessitating a rich, innate Language Acquisition Device. Quine countered that general-purpose learning mechanisms (conditioning, induction, analogy) were sufficient and that positing specific innate structures was "occult" and scientifically unnecessary.

  Quine would see UMG as committing the exact same sin, only worse.
  *   **The Poverty of the Moral Stimulus:** UMG proponents argue that children face too few explicit moral dilemmas to learn complex moral principles (like the doctrine of double effect) unless they have an innate "moral organ."
  *   **Quine's Counter:** Quine would argue that moral behavior is learned through **social conditioning and reinforcement**, not by unlocking an internal syntactic module. For Quine, morality is about acquiring dispositions to behavior that align with the tribe. We don't need to posit unconscious rules; we just need to observe that certain behaviors are rewarded and others punished. To Quine, positing an unconscious "moral syntax" is to reify something that can be explained more simply by behavioral history.

  ### 2. The Sensory Periphery Objection (The Ethics Argument)
  This is where your reference to *"On the Nature of Moral Values"* becomes crucial. In that piece, Quine argues that scientific statements are anchored to the **sensory periphery**. If a prediction fails (observation clashes with theory), we adjust the web of belief.

  Moral statements, Quine argues, lack this anchor.
  *   **No Observation Categorical:** You cannot run an experiment to prove "killing is wrong" in the same way you prove "water is H2O." There is no sensory stimulation that *forces* a moral conclusion.
  *   **UMG's Claim:** UMG tries to naturalize ethics by saying, "We can find the objective structure of moral judgment in the brain."
  *   **Quine's Counter:** Quine would say UMG is conflating **causes** with **justifications**. Even if cognitive science discovers that all humans have a neural circuit that fires during Trolley Problems, that only tells us how we *do* judge, not what is *true*.
      *   For Quine, finding a universal neural structure for morality is like finding a universal neural structure for believing in ghosts. It explains the psychology, but it doesn't validate the ontology. UMG often implies that because these structures are universal, they have normative weight. Quine would call this a naturalistic fallacy. He would argue that UMG tries to bootstrap moral objectivity out of psychological facts, which his *"On the Nature of Moral Values"* explicitly forbids.

  ### 3. The Indeterminacy of Translation
  One of Quine's most famous doctrines is the **indeterminacy of translation**. He argued that there is no "fact of the matter" about whether a native's utterance means "gavagai" (rabbit) or "undetached rabbit part." We can only map behavior to behavior.

  UMG relies heavily on introspective reports (e.g., "Does it feel wrong to push the man?").
  *   **Quine's Critique:** Quine would be deeply suspicious of using intuitive judgments as data. These are verbal behaviors, and like all verbal behaviors, they are subject to radical translation.
  *   When a subject says a Trolley Problem scenario is "wrong," what are they actually assenting to? Is it a moral truth? A expression of disgust? A fear of punishment? Quine would argue that UMG assumes a stability of meaning ("wrongness") across subjects that simply isn't there. You can't build a universal grammar on top of data that is behaviorally indeterminate.

  ### 4. The One Place Quine Might Nod (Naturalized Epistemology)
  There is one nuance where Quine might not be entirely hostile. Quine was a **naturalist**; he believed philosophy should be continuous with science. He rejected "first philosophy" (armchair speculation).
  *   If Hauser and Mikhail present UMG strictly as **empirical psychology** (describing causal mechanisms in the brain) and make no claims about moral *truth* or *objectivity*, Quine might tolerate it as a scientific hypothesis.
  *   He would say: "Fine, study the neural pathways. Study the behavioral dispositions. But do not call it 'Moral Grammar' if you imply it functions like logic or mathematics. Call it 'Moral Behaviorism'."

  However, since UMG explicitly models itself on Chomsky's linguistics—which posits *competence* (knowledge) rather than just *performance* (behavior)—Quine would likely view the "competence" part as mentalistic mythology.

  ### The Verdict
  Quine would likely view Universal Moral Grammar as the **worst of both worlds**:
  1.  **Linguistically:** It revives the "rich innate ideas" hypothesis he spent his career fighting, positing hidden mental structures without sufficient behavioral evidence.
  2.  **Ethically:** It tries to smuggle objectivity back into ethics through the backdoor of cognitive science, ignoring his point that moral claims lack a sensory periphery.

  He would probably argue that UMG is a **category mistake**. It treats moral sentiments as if they were propositions with truth values generated by a computational syntax. For Quine, moral sentences are more like exclamations or commands ("Don't do that!") that have been grammatically dressed up to look like statements of fact. Studying the "syntax" of a command is useful linguistics, but it doesn't give you a science of *values*.

  **In seminar terms:** You could argue that UMG tries to solve the "poverty of the stimulus" for morality, but Quine would reply that morality doesn't *have* a stimulus in the relevant sense—it has reinforcement histories. Therefore, the whole project is built on a false analogy between language (which describes the world) and morality (which prescribes behavior within the world).

  **Suggested follow-up for your seminar:** You might bring up **Gilbert Harman** (another Quinean). Harman wrote *The Nature of Morality* and argued specifically against moral facts using Quinean naturalism. He would be the direct bridge between Quine's meta-ethics and the modern critique of Moral Grammar. Harman would agree with Quine: even if we have a "moral module," it only explains why we *believe* what we believe, not whether it's *true*. UMG forgets that distinction.
