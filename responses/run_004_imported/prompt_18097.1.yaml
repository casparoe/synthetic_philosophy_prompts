prompt: |-
  so for my 20th-century analytic philosophy seminar we've been going deep on Quine, including this short, kinda obscure piece of his on ethics (On the Nature of Moral Values, i think thats the title) where his basic move is that moral discourse can't bootstrap its way to the kind of objectivity science has, since theres no sensory periphery for ethical claims to answer to the way there is for empirical ones. earlier in the semester we also covered the whole Quine vs. Chomsky fight over innate universal grammar, where Quine was firmly team "general-purpose conditioning, we don't need a rich innate language module." given both of those, what do you think Quine would've said about the "universal moral grammar" research program that people like Hauser and Mikhail built in the 2000s, which is explicitly modeled on Chomsky's linguistics -- the idea being we have an innate moral "syntax" that spits out fast intuitive judgments the same way our language faculty spits out grammatical sentences. would Quine have torn into it the same way he went after Chomsky on language, or does the moral-grammar version dodge his objections somehow?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

