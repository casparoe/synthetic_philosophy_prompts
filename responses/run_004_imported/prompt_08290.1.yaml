      *   *Decision Theory:* Relies on EDT (my choice is *evidence* of theirs) rather than CDT (my choice doesn't *cause* theirs).
      *   *Critiques:* How do I know they're similar? Is this just Kant? Does it require infinite universes? Is it vulnerable to fanaticism (betting everything on a tiny chance of correlation)?
      *   *Key Names:* Caspar Oesterheld, Conitzer, MacAskill (sometimes associated), EA Forum.

