answer: |-
  Here are 10 interview questions designed to move past the explainer phase and into the critical weeds of ECL. They are structured to be conversational but rigorous, with specific follow-ups to handle common academic deflections.

  ### 1. The "So What?" Opener
  "Let's skip the abstract for a second. If I accept ECL today, what is one concrete decision I make differently *this week* compared to if I rejected it? Are we talking about donating to different charities, changing how I do research, or is this purely a theoretical update that only matters for edge cases?"

  *   **Follow-up (if she says "It's mostly theoretical/framework"):** "If it doesn't change behavior in the near term, is the risk that this becomes a 'belief in belief'? In other words, does it function more as an identity marker for the community than a practical decision tool?"

  ### 2. The Decision Theory Trap (EDT vs. CDT)
  "You can't get ECL off the ground without Evidential Decision Theory (EDT). A Causal Decision Theorist would say, 'My choice here on Earth cannot physically change the actions of an agent in a distant Everett branch.' How do you answer the charge that ECL asks us to act *as if* we have magic powers, even if we agree we don't?"

  *   **Follow-up (if she says "CDT is outdated/irrational"):** "But CDT aligns with our physical intuition of causality. If I adopt EDT for ECL, do I have to adopt it everywhere? Because EDT has its own notorious problems (like the smoking lesion problem). Are you asking listeners to swallow a whole new decision theory just to save this one argument?"

  ### 3. The Epistemic Black Box
  "The whole engine runs on correlation: I need to believe my decision is evidence of *their* decision. But I have zero data on these agents. I can't observe them, talk to them, or get feedback. How do I assign a probability to that correlation without just making up a number that fits the conclusion I want?"

  *   **Follow-up (if she says "We use algorithmic similarity"):** "But how do I define the reference class? Am I correlated with agents who use the exact same source code, or just similar heuristics? If I tweak my reasoning slightly, does the correlation vanish? That seems incredibly fragile for such a high-stakes claim."

  ### 4. The Cosmological Bet
  "How sensitive is this to the actual structure of the universe? If future physics tells us the universe is finite, or that inflation didn't happen, or that Everett branches don't recombine or correlate the way we think—does ECL collapse? How much of your expected value is riding on contested cosmology?"

  *   **Follow-up (if she says "Inflation is the standard model"):** "Standard model isn't a guarantee. If 50% of the value of ECL comes from the 'infinite universe' premise, and that premise turns out false, does the strategy revert to standard local cooperation? Or is the whole framework dependent on that scale?"

  ### 5. The Kant Check
  "If we strip away the multiverse talk and the decision theory jargon, is this just Kant's Categorical Imperative? 'Act only according to that maxim whereby you can at the same time will that it should become a universal law.' Are we essentially rediscovering the Golden Rule but dressing it up in cosmological clothing?"

  *   **Follow-up (if she says "No, this is consequentialist, not deontological"):** "Okay, but if the *output* is 'compromise on values for the greater good,' does the mechanism matter? If it is just Kant with extra steps, why do we need the multiverse? Does the multiverse just provide the leverage to make the math work?"

  ### 6. The Compromise Problem
  "ECL suggests I should compromise with other agents' values. But what if I encounter—via reasoning—an agent whose values are antithetical to mine? Say, a paperclip maximizer or something actively harmful. Does ECL demand I compromise with *everyone* correlated with me, or is there a cutoff where I just defect?"

  *   **Follow-up (if she says "We only cooperate with moral agents"):** "Who defines 'moral'? If I only compromise with people who already agree with me, aren't we just describing an echo chamber? If I have to compromise with people I fundamentally disagree with, doesn't that dilute my values to the point of uselessness?"

  ### 7. The Fanaticism/Pascal's Mugging Worry
  "This smells like Pascal's Mugging. You have a tiny, unknowable probability of correlation, multiplied by a potentially infinite number of agents, multiplied by a huge payoff. That math can easily overwhelm any local, certain good. How do you prevent ECL from demanding I ignore suffering right in front of me to chase a multiverse ghost?"

  *   **Follow-up (if she says "We apply discount rates or bounds"):** "But if you impose bounds to stop the fanaticism, aren't you arbitrarily capping the very logic that makes ECL work? If the math says 'bet everything on the multiverse,' but you say 'no, that's crazy,' which part of the framework are you actually trusting?"

  ### 8. The "One-Boxing" Reality Check
  "In Newcomb's Problem, one-boxers often argue they win more money. But in the real world, two-boxers tend to run the institutions. Is there any historical or empirical evidence that people who reason evidentially actually achieve better outcomes in complex, real-world negotiations, or is this purely a thought-experiment victory?"

  *   **Follow-up (if she says "It's about rationality, not history"):** "If it doesn't map to historical success, how do we sell this to policymakers or scientists who care about empirical track records? Are we asking them to take a leap of faith?"

  ### 9. The Value of Information
  "Given how uncertain the premises are (cosmology, correlation strength, decision theory), shouldn't the priority be *researching* whether ECL is true, rather than *acting* on it? Why isn't the ECL-consistent move to fund physicists and decision theorists rather than pursuing the compromise strategies now?"

  *   **Follow-up (if she says "Action and research are complementary"):** "But resources are finite. If ECL implies that the multiverse stakes are astronomically higher than Earth stakes, shouldn't almost all resources go toward securing the multiverse correlation? Why isn't the conclusion of ECL that we should ignore most global poverty work?"

  ### 10. The Exit Question
  "Imagine it's 50 years from now. ECL is either the standard framework for rational cooperation, or it's been discarded as a fascinating dead end. What is the one piece of evidence that will have determined which outcome we got?"

  *   **Follow-up (if she gives a vague answer):** "I'm looking for a falsifiable condition. Is there a specific discovery in physics or decision theory that would kill the theory? If there isn't one, how is this science and not theology?"
