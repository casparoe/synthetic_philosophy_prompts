  *(Check on Follow-ups)*: Make sure they aren't generic "Why?" but specific counter-arguments.
  *   *EDT Follow-up:* If she says "CDT is outdated," push on the "magic" aspect.
  *   *Correlation Follow-up:* If she says "algorithmic similarity," push on the "reference class" problem.
  *   *Kant Follow-up:* If she says "It's consequentialist," push on whether the mechanism matters.
