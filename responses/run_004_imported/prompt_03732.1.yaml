answer: |-
  This is a profound and deeply personal application of the concepts you are likely encountering in your bioethics seminar. It touches on the tension between **precedent autonomy** (the wishes of the competent past self) and **current autonomy** (the wishes of the potentially impaired present self), as well as the practical limits of laypeople in medical decision-making.

  Here is an analysis of your situation through several bioethical frameworks, followed by a perspective on how to approach the agreement.

  ### 1. The Ethical Framework: Ulysses Contracts
  What your sister is proposing is often referred to in bioethics and psychiatry as a **Ulysses Contract** (or a psychiatric advance directive). The name comes from Homer's *Odyssey*, where Ulysses orders his crew to tie him to the mast and ignore his future commands to be released when he hears the Sirens' song. He knows his future self will be compromised and wants his past self's judgment to prevail.

  *   **Argument for Agreeing:** From the perspective of **precedent autonomy**, honoring this request respects your sister's deepest values and long-term goals. She has identified that her "manic self" is not a true reflection of her agency but rather a pathology that hijacks her decision-making capacity. By agreeing, you are helping her maintain continuity of identity and protecting her from the harms (financial, relational, physical) that mania often causes.
  *   **Argument for Caution:** The ethical risk lies in **paternalism**. Even in mental illness, determining when capacity is lost is difficult. If you override her current wishes based solely on a past instruction, you risk treating her as a means to an end (her health) rather than an end in herself, should she actually retain some degree of capacity.

  ### 2. Decision-Making Capacity vs. Competence
  In your seminar, you likely distinguish between *competence* (a legal status) and *capacity* (a clinical, decision-specific assessment).

  *   **The Epistemic Problem:** You noted the worry that you won't know if she is "in the grip of an episode or has genuinely changed her mind." This is the crux of the ethical difficulty. Capacity is not a light switch; it is a dimmer.
  *   **Your Role:** You are not a clinician. You cannot clinically assess her capacity. However, as a sibling, you possess **longitudinal knowledge**. You know her baseline better than a stranger. Bioethics increasingly recognizes "relational autonomy," which suggests that autonomy is sustained by relationships. Your involvement isn't an infringement on her autonomy; it is a scaffold supporting it when her internal faculties are compromised.

  ### 3. Should You Agree?
  **Ethically, there is a strong case for agreeing, provided boundaries are set.**

  Refusing could isolate her and remove a safety net she has explicitly asked for. However, agreeing should not be a blank check. You might consider framing the agreement not as "I will override you," but as "I will advocate for the plan we made."

  **Conditions for Agreement:**
  *   **Formalization:** Ideally, this shouldn't just be a verbal promise between siblings. It should be part of a formal **Psychiatric Advance Directive (PAD)** filed with her treatment team. This moves the burden from your shoulders to the medical record.
  *   **Specific Triggers:** Define what constitutes a "manic episode" in observable terms (e.g., not sleeping for 3 days, specific delusional statements, spending sprees) rather than subjective feelings.
  *   **The "Out" Clause:** Agree that if there is evidence of *new* information (e.g., the medication is causing a severe allergic reaction), the contract is void.

  ### 4. Are You Bound to Carry It Out No Matter What?
  **No. You are not morally bound to blind obedience.**

  Ethical obligations are rarely absolute; they require practical wisdom (*phronesis*). Here is why you must retain some discretion:

  1.  **Distinction between Advocacy and Enforcement:** Your sister asked you to "call her psychiatrist." She did not ask you to physically restrain her or sign legal papers (unless you are her legal guardian). You are bound to **communicate** the information, but you are not bound to *force* an outcome. The psychiatrist holds the legal and clinical authority to determine if involuntary hold criteria are met.
  2.  **Safety:** If honoring the promise would put *you* in physical danger (e.g., she becomes violent), you are not obligated to sacrifice your safety. You can call emergency services instead of managing it personally.
  3.  **Contextual Changes:** If the context has changed significantly since the promise was made (e.g., a new treatment plan that changes the risk/benefit ratio), rigid adherence to the old promise might violate the principle of **beneficence**.

  ### 5. A Proposed Path Forward
  Given your studies and your family dynamic, consider this approach:

  1.  **Have a Meta-Conversation:** Tell her, "I want to honor your autonomy and your safety. I agree to be part of this plan, but I need us to define exactly what my role is so I don't fail you."
  2.  **Shift the Burden:** Encourage her to make this directive official with her doctor. Tell her, "I promise to tell the doctor what we discussed, but the doctor needs to be the one to make the medical call." This protects you from being the "bad guy" and ensures a professional assesses capacity.
  3.  **The "Check-In" Protocol:** Agree that in the moment, you will use a code phrase or a specific question to gauge her state. If she cannot engage with that, you proceed with the call.
  4.  **Forgiveness:** Discuss the aftermath. She mentioned she might say she will "never forgive you." Agree now that post-episode reconciliation is part of the plan. Acknowledge that her anger during mania is a symptom, not a genuine moral judgment.

  ### Conclusion
  You are navigating the space between **respect for persons** and **duty of care**. Agreeing to her request is an act of profound respect for her *true* autonomy—the autonomy of the stable self who wants to live well. However, you are not bound to execute this as a rigid algorithm. You are bound to act in good faith, prioritizing her safety while recognizing your own limitations as a non-clinician.

  In the language of your seminar: You are supporting her **precedent autonomy** to protect her **well-being**, while acknowledging that **relational support** has limits when **capacity** becomes opaque. Formalizing this with her care team is the most ethically robust way to proceed.

  ***

  *Disclaimer: I am an AI, not a lawyer or a mental health professional. This analysis is for educational and ethical discussion purposes. You should encourage your sister to formalize any medical directives with her healthcare providers and legal counsel.*
