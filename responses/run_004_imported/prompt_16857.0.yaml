answer: |-
  You have not found a bug in your calculation. You have stumbled directly into one of the most famous and controversial phenomena in the theory of imprecise probabilities: **Dilation.**

  What you are experiencing is a feature of the mathematical framework, not a calculation error. However, whether it is a *normative* feature (something a rational agent *should* do) or a *pathological* flaw (something that breaks decision theory) is the subject of intense philosophical debate.

  Here is the breakdown of what is happening, why it happens, and how it relates to the LessWrong skepticism you mentioned.

  ### 1. What is Dilation?
  In precise Bayesianism, the Law of Total Probability ensures that your expected posterior confidence equals your prior confidence. While a specific piece of evidence might move you up or down, you generally expect your uncertainty (variance) to decrease.

  In imprecise probability (credal sets), **dilation** occurs when the posterior interval for a hypothesis $H$ is strictly *wider* than the prior interval for $H$, **regardless of which outcome of the evidence $E$ occurs.**

  If $P(H) \in [0.4, 0.6]$, and you observe $E$ or $\neg E$, and your new credence becomes $P(H|E) \in [0.2, 0.8]$ and $P(H|\neg E) \in [0.2, 0.8]$, you have experienced dilation. You know beforehand that looking at the evidence will make you more uncertain.

  ### 2. Why does it happen? (The Intuition)
  Dilation usually arises when there is **uncertainty about the correlation** between the hypothesis and the evidence.

  Imagine a medical test for a disease.
  *   **Precise Bayes:** You believe the test has 90% sensitivity and 90% specificity. A positive result narrows your uncertainty.
  *   **Imprecise Credence:** You are deeply uncertain about the test's reliability. Your credal set includes models where the test is highly accurate, but it *also* includes models where the test is systematically misleading (e.g., it says "Positive" when you are healthy and "Negative" when you are sick).

  When you get a "Positive" result:
  1.  In the "Accurate Test" models, your credence in Disease goes **up**.
  2.  In the "Misleading Test" models, your credence in Disease goes **down** (because the test is lying).

  Because your credal set contains *both* types of models, the lower bound of your posterior is determined by the "Misleading" models, and the upper bound is determined by the "Accurate" models. The gap between them widens. The evidence fails to distinguish between "I have the disease and the test works" and "I don't have the disease and the test is broken."

  ### 3. Is it a Bug or a Feature?
  This is the crux of your question.

  **The Argument that it is a Feature (The "Honesty" View):**
  Proponents (like Peter Walley) argue that dilation is the honest representation of ignorance. If you truly do not know how reliable the evidence is, becoming *more* confident after seeing it is actually the irrational move. Precise Bayesians force a number by implicitly assuming a specific correlation that isn't justified. Dilation preserves the integrity of your uncertainty. It says: "This evidence is ambiguous relative to my current state of ignorance."

  **The Argument that it is a Flaw (The "Decision Theory" View):**
  Critics (including many in the precise Bayesian tradition, and notably Teddy Seidenfeld, who analyzed this extensively) argue that dilation violates the **Value of Information**.
  If you know beforehand that observing $E$ will widen your interval, and your decision rule depends on that interval (e.g., you only bet if the lower bound is > 0.5), you might refuse to look at the evidence.
  *   *Prior:* Interval [0.4, 0.6]. You decline to bet on H.
  *   *Posterior (after free evidence):* Interval [0.2, 0.8]. You *still* decline to bet on H.
  *   *Result:* You paid (in time/attention) to learn something that changed nothing about your actions but increased your confusion.

  To a precise Bayesian, this is pathological. They argue you should simply place a **hyper-prior** over the reliability of the test. This collapses the credal set back into a single precise distribution (by integrating over the uncertainty), which guarantees no dilation.

  ### 4. The LessWrong / Knightian Uncertainty Connection
  You mentioned the "old LW hostility to Knightian uncertainty." This is exactly where that hostility finds its ammunition.

  The standard LW/Eliezer Yudkowsky position is that "Knightian uncertainty" is often a confusion of levels. They argue that any uncertainty about probabilities can be modeled as uncertainty about parameters within a precise Bayesian framework (a hierarchical model).
  *   **Imprecise Prob Advocate:** "I don't know the prior!"
  *   **Precise Bayes (LW style):** "Then put a uniform prior over the space of priors."

  The problem, as you've seen, is that the "prior over priors" approach yields a single number, which feels like false precision when you are truly ignorant. However, the imprecise approach yields dilation, which feels like paralysis.

  The LW critique is often that imprecise probabilities don't actually solve the problem of decision-making; they just defer it. When your interval is $[0.2, 0.8]$, how do you act?
  *   Do you use the lower bound (Maximin)? (Extremely pessimistic)
  *   Do you use the midpoint? (Why not just be Bayesian then?)
  *   Do you refuse to bet? (You get money-pumped by someone willing to take both sides of your interval).

  ### 5. Is there a fix?
  Researchers in imprecise probabilities are aware of dilation. It is not ignored. There are a few responses:
  1.  **Accept it:** Acknowledge that some evidence is genuinely confusing under deep uncertainty.
  2.  **Restrict the Credal Set:** Use principles (like "Near-Ignorance" rather than "Complete Ignorance") that constrain the set enough to prevent dilation while still allowing vagueness.
  3.  **Alternative Updating Rules:** Standard conditionalization on credal sets (updating every distribution in the set) causes dilation. Some propose rules that shrink the set based on evidence reliability, though this risks reintroducing the "false precision" the framework was meant to avoid.

  ### Summary
  You aren't missing anything. You found **Dilation**.
  *   **Is it a calculation bug?** No. It is mathematically inherent to standard credal set conditioning under independence assumptions.
  *   **Is it a rational flaw?** That depends. If you value **calibration and honesty** about ambiguity, it's a feature. If you value **decisiveness and the value of information**, it's a bug.

  The fact that this happens is arguably the strongest argument *for* the LessWrong stance (that you should force a precise model, even if approximate) and the strongest argument *against* it (that forcing precision hides the fragility of your conclusions).

  If you want to read more, look up **Teddy Seidenfeld's work on dilation** and **Peter Walley's "Statistical Reasoning with Imprecise Probabilities."** You are now deep enough in the rabbit hole to read the primary sources. Welcome to the club.
