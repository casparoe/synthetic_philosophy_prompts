answer: |-
  **Setting:** *Backstage at the "Horizon 2050" Summit in San Francisco. Green room. One leather sofa, one ergonomic mesh chair. A bowl of untouched organic apples. CICERO (appearing as he did in his later years, robust but lined, wearing a dark wool suit that drapes like a toga) is pouring tea. DR. ARIS THORNE (40s, wearing a Patagonia vest over a black t-shirt, smart watch glowing) is pacing.*

  **THORNE:** You were good out there. The bit about the harvest. "Nature has a course like a field." Poetic. But with respect, Marcus, poetry doesn't fix mitochondrial decay.

  **CICERO:** And with respect, Doctor, fixing the decay doesn't fix the *point*. You speak of aging as if it were a leak in the hull. I speak of it as the ship reaching the harbor.

  **THORNE:** That's the framing I take issue with. The harbor implies the journey is over. We're saying the journey is just getting interesting, and then the boat falls apart. We can reinforce the hull. We can swap out the rot. Why is the default position acceptance of the rot?

  **CICERO:** Because the rot is not an error. It is a feature. You classify aging as a disease. I classify it as a law. If you cure aging, what do you put in its place? An indefinite extension of the self? That sounds less like health and more like hoarding.

  **THORNE:** Hoarding time?

  **CICERO:** Hoarding *presence*. You want to keep the actor on the stage after the play has ended.

  **THORNE:** No. We want to keep the actor healthy enough to finish the act. Look, I read your *De Senectute* for prep. I know the playbook. The old captain steering the ship while the young climb the rigging. It's a beautiful metaphor for division of labor. But it relies on a false scarcity.

  **CICERO:** Scarcity is the only truth there is.

  **THORNE:** It's an engineering constraint. Not a moral one. You argue that old age withdraws us from physical exertion and thereby frees the mind for judgment. I argue that's a rationalization for atrophy. You say the old captain *should* just steer. I ask: why can't he steer *and* climb? If we reverse the senescence in the muscle tissue, if we clear the amyloid plaques, the captain doesn't lose the judgment. He keeps the hands to execute it.

  **CICERO:** And if he does? If the old man climbs the rigging with the strength of twenty, does he not crowd out the boy who needs to learn the knots? Part of the order of things, Doctor, is succession. My death is not a tragedy; it is a necessity for the Republic to renew itself. Your "cure" creates a gerontocracy of immortals. Who inherits the earth if the fathers never die?

  **THORNE:** That's a sociological problem. We can solve inheritance law. We can't solve death without biology. And don't give me the "nature" argument. Nature gave us smallpox. Nature gave us childhood leukemia. You wouldn't tell a parent of a sick child that leukemia is "natural" and therefore should be accepted as a stage of development.

  **CICERO:** Do not equate the untimely theft of life with the ripening of it. That is a category error. I am not talking about pathology. I am talking about *completion*.

  **THORNE:** But where is the line? Is Alzheimer's completion? Is Parkinson's completion? Or is that just "damage" we're allowed to fix?

  **CICERO:** You see? You cannot draw the line. Because your philosophy has no concept of "enough."

  **THORNE:** My philosophy has a concept of *suffering*. That's the line. If it causes suffering, we fix it. You talk about the virtues of old age—freedom from lust, freedom from ambition. You make it sound like a promotion. But for most people, it's not a serene philosophical retreat. It's incontinence. It's isolation. It's watching your mind dissolve while your body stays just alive enough to be afraid. You call that "freedom from passion." I call it torture. And you're telling them to write odes to it.

  **CICERO:** *(Stirs tea, slow and deliberate)* I tell them to find dignity in it. There is a difference. You think dignity comes from the integrity of the flesh. I say it comes from the integrity of the character. Take Sophocles. His sons tried to have him declared senile, to seize his estate. They said he was unfit, that his mind was gone. Did he beg for a treatment? Did he plead for more years to prove his vitality?

  **THORNE:** He proved his competence.

  **CICERO:** He read them his newest tragedy. *Oedipus at Colonus*. Written in his dotage. He showed them that the mind could produce fruit even when the roots were dry. But notice: he did not try to prove he was *young*. He proved he was *Sophocles*. Your industry tells men they must be twenty forever to be valuable. That is the true ageism.

  **THORNE:** No. We tell them they shouldn't have to choose between being Sophocles and having a working hip. You're romanticizing the struggle. You're saying, "Look how noble I am, bearing this burden." I'm saying, "Put the burden down."

  **CICERO:** The burden is the ballast! Without it, the ship capsizes. You speak of curing death as if it were a technical glitch. But death is the editor of life. It cuts the excess. It forces urgency. If you have ten years, you write the tragedy. If you have a thousand... do you write the tragedy? Or do you just... wait?

  **THORNE:** That's the "coping" argument.

  **CICERO:** Excuse me?

  **THORNE:** You heard me. Is this Stoicism, or is it just learned helplessness dressed in rhetoric? You say death gives life meaning. I say that's what you tell yourself because you couldn't stop the dying. You couldn't save your daughter. You couldn't save your brother. You couldn't save the Republic. So you built a philosophy where losing is actually winning. Where fading away is "ripening."

  *(Cicero sets the cup down. The clink is sharp.)*

  **CICERO:** You think I do not know loss? You think because you have flow cytometry you understand grief better than a man who held the dying Republic in his hands? I do not praise death because I am weak. I praise it because I am honest. You are fighting a war you cannot win. You can delay the evening, Doctor. You cannot cancel it. And in trying to cancel it, you make the evening terrifying.

  **THORNE:** We've delayed malaria. We've delayed starvation. We're good at winning wars people said were unwinnable.

  **CICERO:** Those are external enemies. Aging is internal. It is *you*. To fight it is to fight your own nature. It is a civil war. And in a civil war, even the victor loses.

  **THORNE:** So we just... maintain? We accept the decline as "judgment-based contribution"? What if the judgment is compromised? What if the captain is steering the ship into the rocks because his synapses are firing at half-speed? You trust the old captain. I trust the data. The data says cognitive decline is not inevitable. It's mechanical.

  **CICERO:** And if you fix the machine, do you save the man? Or do you just keep the puppet moving? I learned Greek in my eighties. Not to extend my career. But because the soul requires growth until the end. You want to extend the career. I want to secure the soul.

  **THORNE:** I want to give the soul more time to grow. That's the disconnect. You think time is a container. I think it's fuel.

  **CICERO:** Time is a measure. If you stretch the measure, you dilute the wine.

  **THORNE:** Or you get to drink more of it. Look, Marcus. I'm not trying to live forever for the sake of ego. I'm trying to ensure that when a person is eighty, they aren't in pain. They aren't a burden to their children. They aren't terrified. If that means they live to be a hundred and fifty, and they spend those extra years mentoring, creating, loving... where is the harm? Is your objection purely poetic?

  **CICERO:** My objection is that you are removing the stakes. A life without an end is a story without a period. It becomes a run-on sentence. It loses its shape. You speak of burdening children? A parent who refuses to die is the ultimate burden.

  **THORNE:** A parent who is healthy, vibrant, and wise for forty extra years is a resource. A parent who dies at seventy because "nature said so" is a loss of capital. Human capital. We are throwing away centuries of accumulated wisdom because we're attached to the idea of the "natural lifecycle." Nature is cruel. We are supposed to be better than nature. That's why we wear coats. That's why we have medicine.

  **CICERO:** We wear coats to survive the winter. We do not wear coats to abolish the seasons. There is a time to sow, and a time to reap. You want to sow forever. But if you never reap, the field rots.

  **THORNE:** *(Stops pacing. Sits on the edge of the mesh chair.)* Maybe. Or maybe the field is bigger than you think. Maybe we've been harvesting too early.

  **CICERO:** *(Softens slightly)* You are a good man, Doctor. I see the fire. It is the same fire that drove me to defend the law. You want to save people. I respect that. But do not mistake the preservation of the vessel for the safety of the cargo.

  **THORNE:** And don't mistake the acceptance of the storm for navigation.

  *(Silence between them. The muffled sound of the next panel starting echoes through the wall.)*

  **CICERO:** I will tell you this. If your treatments allow a man to read Sophocles at a hundred, and understand him better than he did at forty... I will not stand in his way. But do not ask him to call it "youth." Call it what it is. A different country.

  **THORNE:** And if I can get him there without the pain? Without the dementia? Without the frailty?

  **CICERO:** Then you have not cured aging. You have cured suffering. And I have no argument with that. But do not promise him he will not die. Promise him he will live *well* until he does.

  **THORNE:** *(Stands up, extends a hand)* I can promise the living well. The rest... we'll see what the data says.

  **CICERO:** *(Takes the hand. His grip is firm, dry, earthy.)* And I will write about the dignity of the end. We shall see which story the future prefers.

  **THORNE:** See you on the panel, Marcus.

  **CICERO:** Go with care, Aris. The rigging is slippery, even for the young.

  *(Thorne exits. Cicero remains, looking at the bowl of apples. He picks one up, inspects a small bruise on the skin, and takes a bite anyway.)*
