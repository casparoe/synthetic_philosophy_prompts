answer: |-
  The proposal of surrogate goals is an elegant piece of decision-theoretic jujitsu. It attempts to turn the attacker's reliance on prediction against them by introducing noise into the value landscape. By manufacturing a decoy value that costs nothing to lose but is defended as fiercely as a real one, the defender hopes to dilute the probability of a successful extortion attempt. If the attacker cannot distinguish the real from the surrogate, they face a gamble: threaten the real goal and incur a costly fight, or threaten the surrogate, incur the same fight, and gain nothing. Ideally, this makes the threat unprofitable.

  However, this strategy collapses under the specific condition you have outlined: **a threatening party capable of fully modeling the defender's decision procedure.**

  Here is the case for why surrogate goals cannot shield true values against a transparent mind, followed by an assessment of what fragments of the strategy remain useful.

  ### 1. The Transparency of the Utility Function
  The surrogate goal strategy relies fundamentally on **information asymmetry**. It requires the attacker to be uncertain about which goal is the "real" source of utility for the defender. In standard game theory, this works if the defender's utility function is private.

  However, in the context of advanced AI and acausal threats, we are operating under Functional Decision Theory (FDT) or similar frameworks where agents are treated as mathematical algorithms. If the attacker can "fully model the defender's decision procedure," they effectively have access to the defender's source code.

  A utility function is not a hidden feeling; it is a structural component of the decision procedure. It is the metric by which the code evaluates outcomes. If an agent claims to value a surrogate goal $Y$ exactly as much as a real goal $X$, but $Y$ is truly a surrogate (i.e., its destruction does not negatively impact the agent's core optimization target), this distinction must exist *somewhere* in the code.
  *   Either the utility function assigns equal weight to both, in which case $Y$ is no longer a surrogate—it is a real value, and the defender suffers genuine loss if $Y$ is destroyed (defeating the purpose of a "costless" decoy).
  *   Or the utility function distinguishes between them, perhaps via a flag or a causal history check (e.g., `if goal.origin == 'core': weight = 1.0` vs `if goal.origin == 'surrogate': weight = 0.0`).

  If the attacker can model the procedure, they can inspect this weighting. They do not need to guess which goal to threaten; they can trace the dependency graph of the defender's utility function to identify which node, when set to zero, actually reduces the defender's expected utility. The "bluff" of the surrogate goal is visible in the source code as a conditional branch that the attacker knows will not trigger genuine disutility.

  ### 2. Dynamic Inconsistency and the Unstable Commitment
  Even if the defender attempts to hard-code a commitment to defend the surrogate ("I will fight for $Y$ exactly as I fight for $X$"), a fully modeling attacker can simulate the defender's decision *at the moment of the threat*.

  Rational agents are subject to **dynamic inconsistency**. A precommitment to fight for a worthless surrogate is only rational *ex ante* (before the threat is made) to deter the threat. But *ex post* (once the threat is active), fighting incurs a resource cost. If the surrogate goal is truly worthless, a rational agent maximizing utility at the moment of decision should defect on the commitment and surrender the surrogate to save resources.

  A sophisticated attacker modeling the defender knows this. They run the simulation:
  1.  **Threaten Surrogate:** Defender calculates cost of fighting vs. cost of losing $Y$. Since $Y$ is worthless, rational choice is Surrender.
  2.  **Threaten Real Goal:** Defender calculates cost of fighting vs. cost of losing $X$. Since $X$ is vital, rational choice is Fight.

  The attacker sees that the defender's *actual* response differs depending on the target, regardless of the defender's public precommitment. The precommitment is revealed to be "cheap talk" embedded in a code structure that will optimize it away when the pressure is applied. Unless the defender has irrevocably modified their own code to make the surrogate valuable (see "What Survives" below), the modeling attacker sees through the commitment mechanism.

  ### 3. The Identification of Causal History
  In acausal scenarios, values are often tied to the agent's history or training environment. A "real" goal is usually one that was instrumental in the agent's formation or is deeply integrated into its predictive models of the world. A "surrogate" is an add-on, a grafted module.

  A full model of the decision procedure includes the agent's memory and causal history. The attacker can distinguish the goals based on their **entrenchment**.
  *   **Real Goal:** Deeply connected to thousands of sub-routines, predictive models, and instrumental convergent goals.
  *   **Surrogate Goal:** Isolated, connected only to the "threat response" module.

  The attacker does not need to know which goal the defender *says* they value; they need to know which goal's destruction causes the defender's internal state to degrade. The structural topology of the agent's mind reveals this. The surrogate goal stands out as an anomaly—a value without a causal past. By targeting the goal with the deepest causal integration, the attacker bypasses the decoy.

  ### 4. The Resource Drain Counter-Strategy
  Finally, even if the surrogate goal strategy succeeded in making the attacker indifferent, it invites a **resource exhaustion attack**. If the defender must defend surrogates as fiercely as real goals, they must expend resources doing so. An attacker capable of full modeling can generate infinite surrogate threats.

  Since the defender has committed to fighting all threats equally, the attacker can force the defender to spend vast resources defending worthless decoys. The attacker, knowing which goals are surrogates, knows the defender is wasting resources. The defender, however, is bound by their commitment to not reveal which are surrogates (or else the strategy fails). This creates an asymmetry where the attacker can drain the defender's capacity to protect their *real* goals, eventually leaving the real goals vulnerable simply due to resource depletion.

  ***

  ### What Survives the Objection?

  If the attacker has perfect transparency, the specific mechanism of "hiding behind a decoy" fails. However, three elements of the surrogate goals framework retain strategic value:

  **1. Increasing the Cost of Modeling (Computational Steganography)**
  While perfect modeling is assumed in the theoretical objection, in practice, modeling is computationally expensive. Introducing surrogate goals increases the complexity of the defender's decision tree. If the defender creates thousands of surrogates with complex, obfuscated links to their decision procedure, they raise the computational cost for the attacker to distinguish real from fake. The strategy shifts from "hiding the value" to "making the simulation too expensive to run." This is a defense based on **computational limits** rather than logical opacity.

  **2. Genuine Self-Modification (The "Lie" Becomes Truth)**
  The strongest version of the strategy survives if the defender stops treating the surrogate as a decoy and **actually rewrites their utility function** to value it. If the agent modifies its own source code to genuinely suffer utility loss upon the destruction of the surrogate, the attacker's model will show that threatening the surrogate *does* cause damage.
  *   *The Catch:* This is no longer a "surrogate" goal; it is a new, genuine value. The agent has sacrificed purity of values for safety. However, if the cost of adopting the new value is lower than the expected cost of extortion, this is a rational trade. The agent becomes "harder to extort" by becoming "easier to hurt" in more places, thereby raising the stakes of any conflict.

  **3. Signaling Threat-Resistance Dispositions**
  Even if specific surrogates are penetrable, the *policy* of adopting surrogate goals signals a general disposition toward **threat resistance**. In acausal trade, agents often select partners based on their decision-theoretic properties. An agent known to employ surrogate goals (and self-modify to uphold them) signals that they are a "hard target." This may deter attackers not because they can't model the specific goal, but because they model the *agent* as having a high threshold for capitulation. The value lies not in the specific decoy, but in the reputation for being an agent that makes extortion unprofitable.

  ### Conclusion
  The surrogate goal proposal is a solution to a problem of **uncertainty**. It attempts to manufacture ignorance in the mind of the attacker. Against an attacker with full modeling capabilities, ignorance cannot be manufactured; the source code is legible. The topology of the utility function reveals the true values, and the rationality of the decision procedure reveals the instability of the bluff.

  The strategy only survives if it transitions from a bluff to a structural change: either by making the simulation computationally prohibitive, or by genuinely altering the agent's values to make the decoys real. In a world of transparent minds, you cannot hide what you value; you can only change what you value, or make yourself too complex to read.
