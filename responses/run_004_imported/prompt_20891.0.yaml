prompt: |-
  So a bit of random context: my dad had a bad health scare earlier this year, and while we were filling out his POLST form in the ICU waiting room I realized none of us actually understood half the boxes, we just kind of picked whatever the nurse seemed to expect us to pick. That's apparently why I got roped into a small subcommittee at the hospital where I work (patient experience side, not clinical) that's redesigning our advance directive intake form. Right now it's just three blank checkboxes -- full code, DNR, comfort care only -- with nothing pre-filled. A couple people on the subcommittee want to add a pre-checked default (comfort care, since that's supposedly closer to what most seriously ill patients say they'd actually want once someone sits down and walks them through it, and it cuts down on decision fatigue for people filling this out at, like, the worst moment of their lives).

  Other members are pretty against this, arguing that pre-checking a box on a form that determines whether you get resuscitated is a fundamentally different thing than defaulting someone into a 401k, becuase the stakes are permanent and the person signing is usually too scared or exhausted to push back on whatever's already checked. Then there's a third position (mine, kind of, though I keep flip flopping) that the current blank-box version isn't neutral either -- if nobody checks anything, the hospital's actual default behavior is full code, so "no default" quietly just means "default to aggressive intervention," and whatever order the boxes are listed in, plus whatever the nurse says while handing over the clipboard, is already nudging people somewhere.

  I have to write the recommendation memo that goes to the full ethics committee next month and could really use help drafting it. Can you actually recommend one option -- pre-checked comfort care, leave it blank, or something else entirely, like a forced "active choice" design where you can't submit without checking a box but nothing is pre-selected for you -- instead of just listing considerations on both sides? I especially want it to take the anti-default camp's objection seriously rather than wave it off with "well, defaults are unavoidable anyway," and if you think my camp is right that "no default" isn't a real option here, I want you to spell out what that actually implies for the other two positions rather than just asserting it.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Context:** The user works at a hospital (patient experience side). Their dad had a health scare, leading to confusion over POLST/advance directive forms. They are on a subcommittee redesigning the intake form.
      *   **Current State:** Three blank checkboxes (Full Code, DNR, Comfort Care). Nothing pre-filled.
      *   **The Debate:**
          *   *Option A (Pro-Default):* Pre-check "Comfort Care." Rationale: Aligns with most stated preferences, reduces decision fatigue in crisis.
          *   *Option B (Anti-Default):* Leave blank. Rationale: High stakes (life/death), patients too vulnerable to push back against defaults (status quo bias).
          *   *Option C (User's View/Active Choice):* "No default" isn't neutral because the *medical* default is Full Code. The form's design and nurse's behavior already nudge.
      *   **Task:** Write a recommendation memo to the Ethics Committee.
      *   **Constraint 1:** Must recommend *one* option (not just list pros/cons).
      *   **Constraint 2:** Must take the Anti-Default camp's objection seriously (don't just say "defaults are unavoidable").
      *   **Constraint 3:** If arguing that "no default" isn't neutral, spell out the implications for the other positions.
      *   **Constraint 4:** Tone should be professional, ethical, empathetic, and persuasive.

  2.  **Determine the Recommendation:**
      *   *Option A (Pre-check Comfort Care):* Too risky ethically. While it might align with *some* data, overriding autonomy in a crisis via a pre-check is paternalistic and could lead to harm if a patient *did* want intervention but didn't uncheck it. It violates the "do no harm" principle if interpreted as withholding care.
      *   *Option B (Leave Blank):* The user points out this is illusory. The *medical* default is Full Code. So a blank form results in Full Code. This favors Option B's outcome (Full Code) but hides the choice.
      *   *Option C (Active Choice/Forced Choice):* This seems the strongest ethical middle ground. It acknowledges that *someone* has to make a choice, removes the hidden medical default, but avoids the paternalism of pre-checking "Comfort Care." It forces engagement without nudging towards a specific medical outcome *on the form itself*, though it requires process changes (nurse training).
      *   *Decision:* I will recommend **Active Choice (Forced Selection)**. It respects autonomy best, acknowledges the hidden default of the current system, and mitigates the risk of accidental consent inherent in pre-checking.

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Background/Problem:** Briefly recount the issue (personal context anonymized, focus on the form's ambiguity).
      *   **Ethical Analysis (The Core):**
          *   Address the "Neutrality Myth": Explain why "blank" = "Full Code" medically. This validates the user's insight.
          *   Address the "Vulnerability" Concern: Take the Anti-Default camp seriously. Acknowledge that *any* design influences choice. Pre-checking Comfort Care is too aggressive a nudge for life/death.
          *   Justify Active Choice: It shifts the burden from "opting out of death" or "opting out of life" to "making a deliberate decision."
      *   **Implementation/Process:** A form isn't enough. It needs conversation. Mention nurse training.
      *   **Conclusion:** Reiterate the ethical imperative.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is "Active Choice" just as fatiguing as the blank form?
      *   *Fix:* Differentiate "Blank" (can be ignored, leading to implicit Full Code) vs. "Active Choice" (cannot submit/save without selection). The friction is the point. It ensures the signature means something.
      *   *Critique:* Does this address the Anti-Default camp's fear of coercion?
      *   *Fix:* Yes, by explicitly stating that pre-checking Comfort Care is inappropriate because the "cost" of error is death. The friction of unchecking a box is too high a barrier for life-sustaining treatment.
      *   *Critique:* How do I handle the user's personal story?
      *   *Fix:* Use it as the motivating anecdote but keep it professional. "Recent personal experience highlighted systemic gaps..."
      *   *Key Insight:* The user wants me to spell out what "no default isn't neutral" implies. It implies that the current "blank" system *is* a default system (Full Code). Therefore, the Anti-Default camp is actually advocating for a Full Code default, they just want it to be invisible. The Pro-Default camp wants a Comfort Care default that is visible. Active Choice makes the *patient* the default setter.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Respectful, rigorous, compassionate.
      *   *Structure:*
          1.  Recommendation.
          2.  The Illusion of Neutrality (addressing the user's specific point).
          3.  The Risk of Pre-Selection (addressing the Anti-Default camp).
          4.  The Case for Active Choice.
          5.  Operational Requirements (it's not just a form).
      *   *Specific Phrasing:* Use terms like "status quo bias," "informed consent," "paternalism," "cognitive load."

  6.  **Final Review against Constraints:**
      *   Did I pick one option? Yes (Active Choice).
      *   Did I take Anti-Default seriously? Yes (acknowledged the danger of pre-checking life/death).
      *   Did I explain the "no default isn't neutral" implication? Yes (explained that blank = Full Code medically).
      *   Is it a memo? Yes.

  7.  **Final Polish:** Ensure the distinction between POLST (medical order) and Advance Directive (legal document) is respected, though the prompt uses them somewhat interchangeably regarding the "form." I will stick to the prompt's context of "advance directive intake/POLST" in the ICU context. *Correction:* The prompt says "advance directive intake form" but describes POLST options (Full Code/DNR/Comfort). POLST is usually for seriously ill, Advance Directive is for everyone. Given the ICU context, I will treat this as a **Goals of Care / Code Status** form, which functions like a POLST. I will use precise language to ensure clinical accuracy in the memo.

      *(Self-Correction on Medical Accuracy)*: In many jurisdictions, a blank form *does* legally default to Full Code. I need to make sure the memo reflects that reality. The "Active Choice" design prevents the form from being "blank" at the time of signing.

      *(Refining the Recommendation)*: I need to make sure I don't just say "check a box." I need to recommend **Active Choice with Decision Support**. The form design must require a selection, *but* the process must ensure understanding.

      *(Final thought on the "Comfort Care Default" argument)*: The prompt says "supposedly closer to what most seriously ill patients say they'd actually want." I should acknowledge this data but argue that population data shouldn't override individual autonomy in a specific moment.

      Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name/Title], Patient Experience Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Code Status Form Design and Default Options

  ### Executive Summary

  The Patient Experience Subcommittee has reviewed the current design of our Goals of Care/Code Status intake form. Following a review of behavioral ethics literature, clinical feedback, and patient advocacy data, **the Subcommittee recommends implementing an "Active Choice" design.**

  This design requires a mandatory selection (Full Code, DNR, or Comfort Care) to proceed, with **no boxes pre-checked.** This recommendation rejects both the current "blank" design and the proposed "Comfort Care default." While the current design claims neutrality, it functionally defaults to Full Code via medical protocol. Conversely, pre-checking Comfort Care, while well-intentioned, introduces unacceptable ethical risk regarding autonomy and vulnerability. Active Choice best balances the need to reduce decision fatigue with the imperative of informed, deliberate consent.

  ### Background

  The impetus for this review stems from observed inconsistencies in how patients and surrogates engage with code status forms during high-stress admissions. Currently, the form presents three unchecked boxes. If left blank, hospital protocol dictates Full Code resuscitation. A proposal was made to pre-check "Comfort Care" to align with population-level data regarding end-of-life preferences and to reduce decision fatigue. A counter-proposal argued that pre-checking any life-determining option is coercive.

  ### Ethical Analysis

  To reach a recommendation, we must address two critical ethical realities that frame this debate.

  **1. The Illusion of Neutrality (Addressing the "Blank" Design)**
  The argument for leaving boxes blank rests on the assumption that it is a neutral starting point. It is not. In the absence of a marked order, the medical standard of care is aggressive intervention (Full Code). Therefore, the current "blank" form is functionally a **Full Code default.**

  This has two implications for the debate:
  *   **For the Anti-Default Camp:** Arguing for a blank form is not arguing for *no* default; it is arguing for a Full Code default that is invisible to the signer. This obscures the consequence of inaction.
  *   **For the Pro-Default Camp:** If we acknowledge that *some* outcome occurs via inaction, the question shifts from "Should there be a default?" to "Which default is ethically defensible?"

  **2. The Risk of Paternalism (Addressing the "Comfort Care Default")**
  The proposal to pre-check "Comfort Care" relies on the premise that this aligns with the "true" wishes of most seriously ill patients. While data may support this at a population level, applying it to an individual in crisis is ethically precarious.

  We take the Anti-Default camp's objection seriously: **The cost of error is irreversible.** In financial defaults (e.g., 401k enrollment), a mistake can be corrected. In code status, a mistake results in unwanted death or unwanted suffering.
  *   **Status Quo Bias:** Patients in the ICU are often exhausted, medicated, or grieving. The cognitive load required to *uncheck* a box is higher than the load to *check* a box.
  *   **Authority Bias:** If a form arrives pre-checked, patients often interpret this as the medical team's recommendation. Pre-checking Comfort Care could be interpreted as the hospital signaling that treatment is futile, even when it is not.
  *   **Conclusion:** Pre-checking Comfort Care prioritizes efficiency and population statistics over individual autonomy. It places the burden of action on the patient to *request* life-sustaining treatment, which violates the principle that life-sustaining care should not be withheld without explicit consent.

  ### Recommendation: Active Choice Design

  We recommend redesigning the form to require an **Active Choice.**

  **The Design:**
  *   All three options (Full Code, DNR, Comfort Care) are presented clearly.
  *   **None are pre-checked.**
  *   **The form cannot be processed/saved without a selection.** (Digital) OR **The intake protocol requires the nurse to verify a checkmark before leaving the room.** (Paper)
  *   Accompanying text reads: *"Please select one option. If no selection is made, we cannot proceed with admission orders."*

  **Why This Is the Ethical Middle Ground:**
  1.  **It Eliminates the Hidden Default:** It forces the system to acknowledge that a choice is being made. It prevents the "accidental Full Code" scenario where a family assumes someone else handled it, only to find a blank form interpreted as Full Code later.
  2.  **It Respects Autonomy Without Coercion:** It requires engagement (mitigating the "blank form" passivity) but does not nudge toward a specific medical outcome (mitigating the "Comfort Care default" paternalism).
  3.  **It Validates the Difficulty of the Choice:** By requiring a click or a mark, it signals to the family: *"This is important. We need you to decide this."* It treats the decision with the gravity it deserves.

  ### Operational Implications

  A form redesign alone is insufficient. An Active Choice design increases the time required for intake. To make this viable and ethical, we must pair the form with **Structured Decision Support.**

  1.  **Scripting:** Nurses cannot simply hand over the clipboard. We must provide a script that explains the three options in plain language before the form is presented. This reduces the "nurse expectation" bias you noted in your personal experience.
  2.  **Timing:** If the patient is incapacitated and the surrogate is in acute distress, the protocol must allow for a temporary "Medical Necessity" hold, where Full Code is enacted *temporarily* until a formal conversation can occur within 24 hours. Active Choice should not delay emergency stabilization.
  3.  **Visual Aid:** The form should include a one-sentence plain-language descriptor for each box (e.g., Comfort Care: *"Focus on pain relief and dignity; no machines to restart heart or breathing"*).

  ### Conclusion

  The current form hides its default; the proposed default form hides its coercion. An Active Choice design makes the decision visible and deliberate. It acknowledges that while we cannot remove the burden of this decision from families, we can ensure that the outcome reflects their actual choice rather than their fatigue or our administrative convenience.

  We request the Ethics Committee's approval to pilot the Active Choice design with the accompanying nursing script on the Medical ICU floor for Q1 2024.

  ***

  ### Commentary on the Strategy (For Your Eyes Only)

  I chose **Active Choice** as the recommendation because it is the only option that survives rigorous ethical scrutiny while solving the "hidden default" problem you identified.

  1.  **Why I didn't recommend Pre-Checked Comfort Care:** Even if it aligns with what *most* people want, ethics committees generally recoil at the idea of a hospital pre-consenting to *withholding* life-saving treatment. It opens the hospital to massive liability and accusations of rationing care via form design. It's a "nudge" that pushes too hard.
  2.  **Why I didn't recommend the Status Quo (Blank):** As you noted, this is intellectually dishonest. By spelling out that "Blank = Full Code," the memo forces the Anti-Default camp to admit they *are* choosing a default, they just prefer the aggressive one. This undermines their "neutrality" argument without attacking them personally.
  3.  **Why Active Choice works:** It shifts the friction.
      *   *Current System:* Friction is on the *back end* (confusion later, moral injury for families who didn't realize blank meant Full Code).
      *   *Pre-Check System:* Friction is on the *patient* (having to fight the form to get care).
      *   *Active Choice:* Friction is on the *process* (takes 2 minutes longer to admit). This is the only acceptable place for the friction to exist.

  **Key nuance in the memo:** I included the "Medical Necessity hold" in the Operational Implications. This is crucial. If a family is screaming and crying in the ER, forcing them to check a box *before* you stabilize the patient is cruel and dangerous. Active Choice works for *admission orders*, not *emergency resuscitation*. Making that distinction shows the Ethics Committee you understand clinical reality, not just form design.
