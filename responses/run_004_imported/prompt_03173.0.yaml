      *   **Masks/Antidotes (Johnston 1992 / Bird 1998):** The disposition exists, the stimulus occurs, but something external interferes with the *process* of manifestation without removing the disposition.
          *   *Example:* Fragile glass in packing. Stimulus (strike) happens. Disposition (fragility) exists. Manifestation (breaking) does not happen because packing absorbs shock.
          *   *Problem:* Breaks the link between the disposition + stimulus and the counterfactual truth.
      *   **Lewis's Reformed Conditional Analysis (RCA) (1997):** Tries to fix Finks by referencing an intrinsic causal basis ($B$) that persists through the stimulus.
