answer: |-
  **The Limits of the Conditional: Why Finks and Masks Defeat Reductive Analysis**

  The allure of the Simple Conditional Analysis (SCA) of dispositions is rooted in a desire for ontological parsimony. For the empirically minded philosopher, to say that a glass is "fragile" should not be to posit a mysterious, occult power hidden within the silica; it should simply be to say something about what the glass *would do* under specific conditions. Thus, the SCA proposes that an object $x$ is disposed to manifest $M$ when stimulated by $C$ if and only if, were $x$ to undergo $C$, $x$ would $M$. However, the philosophical literature of the 1990s dismantled this elegant reduction through a pincer movement of counterexamples: C. B. Martin's "finks" and Mark Johnston's "masks" (later refined by Alexander Bird as "antidotes"). While David Lewis attempted to fortify the conditional analysis against these attacks, the dialectic reveals a deeper structural flaw. Finks and masks are not merely two variants of the same problem; they attack the conditional analysis from opposite directions, targeting the necessity and sufficiency of the disposition-counterfactual link respectively. When examined together, they demonstrate that no non-circular version of the conditional analysis can survive. The definite verdict of this dialectic is that dispositions resist *reductive* analysis in conditional terms; they are instead categorical properties that ground the truth of counterfactuals, not vice versa.

  To understand why the conditional analysis collapses, one must first appreciate that finks and masks are logically distinct threats. They are not merely different examples of "things going wrong"; they exploit different vulnerabilities in the biconditional relationship proposed by the SCA.

  Martin's finks (1994) attack the link from the counterfactual to the disposition (the right-to-left direction of the biconditional, though they can be reversed). A finkish situation is one where the stimulus itself causes the disposition to be gained or lost *before* the manifestation can occur. Consider Martin's famous "electrofink": a wire is dead, but connected to a device that detects any contact with a conductor. The instant a conductor touches the wire, the device makes it live. Consequently, the counterfactual "if this wire were touched by a conductor, it would conduct electricity" is true. Yet, intuitively, the wire is not *actually* live (disposed to conduct) prior to the touch; it is dead. The fink shows that the truth of the counterfactual does not guarantee the current possession of the disposition because the stimulus can alter the intrinsic basis of the disposition itself. The problem here is *temporal volatility*: the object's property status changes in response to the test condition.

  Johnston's masks (1992) and Bird's antidotes (1998) attack the link from the disposition to the counterfactual (the left-to-right direction). Here, the object possesses the disposition, and the stimulus is applied, but an extrinsic factor prevents the manifestation. A fragile glass wrapped in perfect packing material is still fragile. However, the counterfactual "if this glass were struck, it would break" is false, because the packing absorbs the shock. Unlike the fink, the mask does not remove the disposition. The glass retains its molecular structure (its causal basis) throughout the strike. The problem here is *causal interference*: the intrinsic basis is present and stable, but the pathway from stimulus to manifestation is blocked externally.

  The distinction is crucial because a fix for one often exacerbates the other. If we tighten the conditions to rule out masks, we risk making the analysis too weak to rule out finks, and vice versa. David Lewis recognized this in his 1997 "Reformed Conditional Analysis" (RCA). Lewis saw that Martin's finks succeeded because the SCA failed to specify that the object must possess a *causal basis* for the disposition that *persists* through the stimulus. Lewis proposed that $x$ is disposed to $M$ when $C$ iff $x$ has an intrinsic property $B$ (the basis) such that, if $x$ were $C$ and retained $B$ for a sufficient time, $x$ would $M$.

  Lewis's RCA successfully neutralizes the fink. In the electrofink case, the wire lacks the intrinsic basis $B$ (the live state) *before* the touch. Therefore, the condition "if $x$ were $C$ and retained $B$" is vacuously false or fails to secure the counterfactual, correctly implying the wire is not disposed. However, as Bird (1998) demonstrated, Lewis's repair leaves the door wide open for masks. In the packing-material case, the glass possesses the intrinsic basis $B$ (the fragile molecular structure). When struck, it retains $B$ (the packing does not change the glass's structure, it only cushions the blow). Yet, the glass does not break. Thus, even with Lewis's retention clause, the conditional "if struck and basis retained, it would break" remains false for a fragile object. The RCA handles the intrinsic volatility of finks but cannot account for the extrinsic blocking of masks.

  Defenders of the conditional analysis have not surrendered. A prominent strategy to rescue the analysis from both finks and masks is to introduce a *ceteris paribus* (all else being equal) clause, or more specifically, an "absence of interferers" clause. This approach, explored by philosophers such as Sungho Choi (2008) and others, suggests that the analysis should read: $x$ is disposed to $M$ when $C$ iff, if $x$ were $C$ and *no finks or masks were present*, $x$ would $M$. Alternatively, Manley and Wasserman (2008) propose a proportionality analysis, suggesting dispositions are gradable: $x$ is disposed to $M$ when $C$ iff $x$ would $M$ in a high proportion of $C$-cases.

  While these patches appear to solve the extensional problems (they get the right truth values for the wire and the glass), they fail as *reductive* analyses. The fatal flaw is circularity. To specify what counts as a "fink," "mask," or "interferer" without already presupposing the disposition in question is impossible. How do we know the packing material is a "mask" for the glass? We know it only because we already know the glass is fragile and that the packing prevents the manifestation of that specific fragility. If we define the "normal conditions" or "absence of masks" as "those conditions in which the fragile object breaks," the analysis becomes trivial: "The glass is fragile iff it would break in conditions where it would break." This offers no ontological reduction; it merely restates the disposition in terms of itself.

  Similarly, the proportionality analysis abandons the binary logic that made the SCA attractive to begin with. If fragility is just a matter of breaking in "most" strike-cases, we must ask: what makes a case a relevant "strike-case"? Do we include cases with packing? With hammers? In a vacuum? To weight the cases correctly, we must again appeal to the causal nature of the disposition itself. The proportion of cases is determined by the disposition, not the other way around. Thus, these rescue attempts succeed only by smuggling the very notion of disposition back into the analysans, violating the requirement for a reductive analysis.

  The combined force of finks and masks therefore leads to a definite metaphysical verdict: the project of reducing dispositions to conditionals must be abandoned. Finks show that counterfactuals can be true without the disposition (because the stimulus creates the property), and masks show that dispositions can exist without the counterfactuals being true (because the environment blocks the outcome). Together, they prove that the relationship between a disposition and its associated counterfactual is not one of identity or reduction, but of grounding.

  The disposition is the *truth-maker* for the counterfactual, not the counterfactual itself. When we say a glass is fragile, we are positing a real, intrinsic causal power (likely grounded in its microphysical structure). This power *explains* why the glass would break in normal conditions, why it would break if the packing were removed, and why it would break if the finkish device were unplugged. The counterfactuals are contingent symptoms of the underlying power, sensitive to extrinsic factors (masks) and temporal quirks (finks) that the power itself transcends.

  To insist on a conditional analysis in the face of this dialectic is to prioritize linguistic form over metaphysical structure. We are tempted by the SCA because it translates modal talk ("would break") into a seemingly clearer logical form. But finks and masks reveal that the modal force comes from the object's nature, not the logical structure of the conditional. Lewis's attempt to anchor the conditional in an intrinsic basis was a step in the right direction, but by trying to keep the analysis conditional, he left it vulnerable to Bird's antidote.

  In conclusion, finks and masks are not merely technical hurdles to be cleared by adding clauses to a formula; they are signposts pointing toward a causal powers ontology. Finks demonstrate that the stimulus does not reliably reveal the property, and masks demonstrate that the property does not reliably guarantee the outcome via simple conditionals. Because any attempt to patch the conditional analysis requires an "absence of interferers" clause that can only be defined by referencing the disposition itself, the analysis becomes circular. Therefore, dispositions cannot be reductively analyzed in conditional terms. We must accept that dispositions are primitive, irreducible properties of objects that serve as the ontological foundation for the truth of counterfactual statements, rather than being constituted by them. The conditional analysis is dead; long live the causal power.
