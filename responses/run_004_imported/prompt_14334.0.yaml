      *   **Move 5: Maya's Rejoinder (The Normativity/Pathology Problem).**
          *   *Claim:* Without history, you can't distinguish function from dysfunction/side effect. Appendicitis contributes to capacities (inflammation) but isn't a function.
          *   *Philosophical Stance:* The "Normativity" objection to Causal Role accounts.
          *   *Evaluation:* This is a very strong philosophical point. Causal Role accounts struggle with malfunction. If function is just "what it does," then causing disease is a function if it does something.
