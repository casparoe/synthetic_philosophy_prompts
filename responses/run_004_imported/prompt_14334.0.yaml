      *   **Move 3: Maya's Rejoinder (The Selection Requirement).**
          *   *Claim:* Effect $\neq$ Function. Function requires selection history. Just because it *does* X doesn't mean it's *for* X.
          *   *Philosophical Stance:* Explicit Etiological Account (Millikan, Neander, etc.).
          *   *Evaluation:* This is the core philosophical objection. It distinguishes "function" from "mere benefit." A classic move in philosophy of biology.
          *   *Winner:* Maya wins on philosophical rigor regarding the *definition* of function within the etiological framework.

      *   **Move 4: Dev's Answer (Practice vs. Theory).**
          *   *Claim:* Biologists ascribe function based on current contribution, not history. History is hard/impossible to know.
