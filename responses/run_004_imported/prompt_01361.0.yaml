      *   *Step 2: The Motivation Divergence.* Why does Strawson argue this? To clarify moral status. Why did Nietzsche argue this? To dismantle Christian guilt.
      *   *Step 3: The "Responsibility" Pivot.* Nietzsche doesn't want to save responsibility; he wants to transform it. "Responsibility" for the sovereign individual isn't about blame, it's about ownership of one's fate (*Amor Fati*).
