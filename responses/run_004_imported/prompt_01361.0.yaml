prompt: |-
  ok this is for a scene in the novel i'm drafting -- two characters at a dinner party get into about free will, and one drops Galen Strawson's "Basic Argument" on the other: you can never be truly morally responsible for what you do, because that would require being responsible for the way you are, and you can't be responsible for that without an infinite regress of self-creation (Strawson literally uses the term "causa sui" for the impossible thing). the other character is a massive Nietzsche nerd and goes "he beat him to it by a century" -- pointing to that bit in Beyond Good and Evil where Nietzsche calls causa sui a self-contradiction, the whole pulling-yourself-up-by-the-hair-out-of-the-swamp-of-nothingness image, and how he ties it explicitly to people wanting ultimate responsibility for their own actions. so its basicaly the same target Strawson's aiming at, a century early.

  for the sake of getting the dialogue right: would Nietzsche just fully cosign Strawson's conclusion that real moral responsibility is impossible, or does something else in his philosophy -- amor fati, will to power, the whole project of going "beyond good and evil" -- push him toward a different reaction, maybe even toward thinking the question itself is confused? give me his most plausible in-character response and actually walk through the reasoning, don't just hand me a verdict.
