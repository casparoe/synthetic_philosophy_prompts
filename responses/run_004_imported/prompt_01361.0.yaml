      *   *Correction:* Strawson is a compatibilist/incompatibilist mix (he's a pessimist). Nietzsche is an incompatibilist regarding *moral* responsibility but wants to keep *agency* as a feeling of power.
      *   *Crucial distinction:* Strawson says "No responsibility." Nietzsche says "No *moral* responsibility (guilt), but yes to *self-affirmation*."
