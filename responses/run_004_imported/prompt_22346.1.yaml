answer: |-
  Here are ten substantive interview questions designed to probe the tensions in your guest's interpretation of Keynes, along with strategic follow-ups to prevent retreat into the "we aren't there yet" defense.

  **1. The Moral-Predictive Boundary**
  You argue that *Economic Possibilities* is primarily moral philosophy rather than a failed forecast. But Keynes explicitly ties the moral shift—the dissolution of the money-motive—to a material precondition: the solution to the economic problem of scarcity. If the material precondition has arguably been met in the developed world, yet the moral shift hasn't followed, does that not suggest a flaw in the philosophy itself, rather than just a delay in the timeline?
  *   **Follow-up:** If she argues that scarcity isn't truly solved because wants are infinite: "But Keynes distinguished between absolute needs and relative needs for status. If the barrier is purely status competition, doesn't that make the 'solution to scarcity' a moving goalpost that renders the moral argument unfalsifiable?"

  **2. The *My Early Beliefs* Contradiction**
  In his 1938 memoir *My Early Beliefs*, Keynes writes that his Bloomsbury circle ignored the fact that "civilisation was a thin and precarious crust" maintained only by strict conventions. Does this later admission undermine the 1930 essay's optimism? Specifically, does the 1930 vision rely on a view of human nature as inherently rational and peaceable once fed—a view he seems to disavow eight years later when acknowledging the fragility of social order?
  *   **Follow-up:** If she suggests the two texts address different domains: "But if the 'crust' of civilization includes the psychological restraint required to delay gratification, doesn't his 1938 pessimism about human irrationality cast doubt on the 1930 hope that we'd naturally choose leisure over accumulation?"

  **3. Purposiveness vs. Animal Spirits**
  There seems to be a tension between the 1930 essay and *The General Theory*. In *Economic Possibilities*, Keynes condemns "purposiveness"—the habit of deferring enjoyment for a future reward—as a moral failing. Yet *The General Theory* relies on "animal spirits," a restless, future-directed psychological drive, to sustain investment and employment. If we successfully cultivate the 1930 ideal of living in the moment, do we not risk collapsing the economic engine required to sustain that leisure?
  *   **Follow-up:** If she claims Keynes evolved his thinking between 1930 and 1936: "Even if he evolved, doesn't that evolution admit that the 'good life' he envisioned in 1930 is incompatible with the stability of a modern capitalist economy? Can we have the ethics of 1930 without the unemployment of the early 1930s?"

  **4. The Mechanism of the Money-Motive**
  Keynes describes the love of money as a possession as a "disgusting morbidity," akin to a psychiatric disorder. But if this behavior is pathological rather than rational, why has it proven so evolutionarily durable? Is it possible that the drive for accumulation isn't a bug of capitalism that will be patched out, but a feature of human status-seeking that persists regardless of material abundance?
  *   **Follow-up:** If she argues that culture can override biology: "We've had nearly a century of culture shifting toward self-actualization, yet working hours remain sticky. What specific cultural mechanism do you envision that will succeed where the last hundred years of productivity gains have failed?"

  **5. The Parochialism of the "Good Life"**
  Keynes's vision of leisure—art, contemplation, conversation—reads very much like a Cambridge-and-Bloomsbury aesthetic. Is there a risk that this essay universalizes a very specific, elite conception of the good life? If the "solution" to economics is becoming an amateur art critic or philosopher, is that a plausible universal destination for the global workforce, or a projection of his own class interests?
  *   **Follow-up:** If she contends that Keynes meant "creative engagement" broadly: "Even broadly, the ideal requires a certain security and education. If the 'good life' requires a baseline of capital that most people don't have, doesn't the essay effectively say 'once everyone is as rich as a don, they will act like dons'?"

  **6. Keynes the Speculator**
  Keynes was not just a theorist; he was an enthusiastic currency speculator and an aggressive art collector who treated art as an asset class. How do we reconcile the man who managed the Chest Fund to beat the market with the philosopher who claimed treating money as an end is a psychiatric disorder? Was the essay a sincere prescription for humanity, or a confession of a struggle he never fully resolved in his own life?
  *   **Follow-up:** If she frames his speculation as "playing the game to fund the good life": "But he seemed to enjoy the game itself. If the architect of the theory found the 'money-motive' personally irresistible even after achieving security, why should we expect his grandchildren to find it easier?"

  **7. The "Interim" Period**
  Keynes acknowledged that for the next hundred years, we would still need to honor the money-motive to get from here to there. But isn't there a danger that normalizing the money-motive for the "interim" entrenches the very values we are supposed to transcend? If we spend a century teaching people that their worth is tied to productivity, can we simply switch that off when the target is reached?
  *   **Follow-up:** If she argues that institutions will guide the transition: "Which institutions? The ones we have now are optimized for growth, not leisure. Are you arguing for a passive wait or an active dismantling of the incentives that keep us working?"

  **8. Positional Goods and Relative Scarcity**
  Critics often note that while absolute scarcity has diminished, relative scarcity (status, housing in desirable areas, access to elite networks) has intensified. Keynes anticipated this but seemed to think it would become irrelevant. Given that happiness data suggests income correlates with well-being largely through relative standing, isn't the "economic problem" actually unsolvable by definition?
  *   **Follow-up:** If she says Keynes knew this but hoped we'd outgrow it: "Hoping we'll outgrow status competition is a theological claim, not an economic one. What evidence from the last century suggests humans are losing interest in positional goods?"

  **9. Policy vs. Prophecy**
  If your reading is correct and this is moral philosophy, does it imply a policy agenda? Or is the historian's role merely to interpret Keynes's hopes? If we accept that AI will solve the productivity side of Keynes's equation, do we need a political movement to enforce the leisure side, or do you trust the market to distribute the time dividends automatically?
  *   **Follow-up:** If she says it's about individual choice: "Individual choices are made within structural constraints. If the structure rewards overwork, telling individuals to 'choose leisure' is ineffectual. Are you arguing for a shorter work week by law?"

  **10. The Falsifiability Condition**
  To close on a methodological point: Your defense against the failed forecast critique is that we "aren't there yet." But for this to be a robust historical thesis rather than a faith-based one, there must be a point where "not yet" becomes "no." What specific evidence—regarding leisure uptake, consumption patterns, or well-being metrics—would you accept as proof that Keynes's moral diagnosis was wrong, not just premature?
  *   **Follow-up:** If she offers a vague timeline (e.g., "another century"): "If productivity doubles again in the next fifty years and average working hours remain unchanged, would you concede then? I'm asking for the specific breaking point where the thesis is abandoned."
