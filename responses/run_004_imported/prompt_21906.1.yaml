answer: |-
  You have made a incredibly sharp observation, but you have also stumbled upon one of the most common mix-ups in contemporary philosophy. The tension you are feeling is real, but it isn't because one philosopher changed his mind or contradicted himself.

  **It is because you are reading two different philosophers.**

  *   **"Freedom and Resentment" (1962)** was written by **P.F. Strawson** (Peter Frederick Strawson).
  *   **"The Basic Argument" (1994)** was written by **Galen Strawson** (P.F. Strawson's son).

  They are father and son. Both are towering figures in philosophy, both work on metaphysics and ethics, and both wrote seminal texts on free will. It is extremely common for students (and sometimes TAs!) to conflate them, especially when course reading lists just say "Strawson."

  Here is how to disentangle them so you can ace your term paper.

  ### 1. P.F. Strawson: The Naturalist Compatibilist
  **Text:** *"Freedom and Resentment" (1962)*

  P.F. Strawson is arguing against the **Pessimists** (hard incompatibilists who say determinism kills responsibility) and the **Optimists** (classical compatibilists like Schlick who try to justify responsibility via social utility).

  *   **The Core Claim:** Our practices of holding people responsible are not grounded in a metaphysical theory of the universe (like "could have done otherwise" in a libertarian sense). They are grounded in human nature.
  *   **Reactive Attitudes:** We naturally feel resentment, gratitude, indignation, and love. These are "reactive attitudes." We only suspend these attitudes when someone is an inappropriate target (e.g., children, the mentally ill, or people under extreme duress).
  *   **The Verdict:** Determinism does not give us a reason to suspend these attitudes generally. Therefore, moral responsibility is real *in the only sense that matters to human life*. He dissolves the skeptical worry by calling it an intellectualist mistake to demand a metaphysical "god's eye view" justification for our practices.

  **Summary:** P.F. Strawson defends the *practice* of responsibility against the skeptic.

  ### 2. Galen Strawson: The Impossibilist
  **Text:** *"The Impossibility of Moral Responsibility" (1994)* (often taught as "The Basic Argument")

  Galen Strawson agrees with his father that the *ordinary* concept of responsibility might function socially, but he argues that if we analyze what **true** or **ultimate** moral responsibility requires, it is logically impossible.

  *   **The Core Claim:** To be truly responsible for an action, you must be responsible for the character/motives that produced the action. To be responsible for *that* character, you must have chosen it. But to choose it, you must have had a prior character to make that choice.
  *   **The Regress:** This leads to an infinite regress. You would have to be *causa sui* (cause of yourself) to have ultimate responsibility. Since nothing can be causa sui, ultimate responsibility is impossible.
  *   **The Verdict:** This holds true whether determinism is true or false. Indeterminism (randomness) doesn't help you be responsible any more than determinism does.
  *   **Key Distinction:** Galen often distinguishes between "moral responsibility" in the ordinary sense (which we practice) and **"Ultimate Moral Responsibility" (UR)**. He argues UR is impossible.

  **Summary:** Galen Strawson argues that the *metaphysical precondition* for true responsibility is impossible to satisfy.

  ### Why the TAs Were Confused
  *   **TA #1 (Revised View):** This TA likely didn't realize there were two Strawsons and assumed P.F. must have become more skeptical in his old age. P.F. Strawson did not recant "Freedom and Resentment."
  *   **TA #2 (The Shrug):** This TA might have sensed the tension but couldn't articulate the father/son distinction, or perhaps the syllabus failed to distinguish their initials (P.F. vs. Galen).

  ### How to Handle Your Term Paper
  This is actually a fantastic opportunity for your paper. Instead of trying to force one Strawson to be consistent, you can frame your paper around the **Strawson Dialectic**.

  **Suggested Angle:**
  *"While P.F. Strawson argues that the demand for metaphysical ultimacy is a mistake, his son Galen Strawson argues that this ultimacy is exactly what is required for true responsibility, and thus impossible. Does Galen successfully refute his father's naturalism, or does P.F. successfully show that Galen is demanding the wrong thing?"*

  **Key Points to Keep Straight:**
  1.  **Citations:** Be extremely careful with citations. Use "P.F. Strawson" and "Galen Strawson" explicitly. Do not just write "Strawson argues..."
  2.  **Definitions:** Note that they are arguably talking about slightly different concepts. P.F. is talking about the *social practice* of responsibility. Galen is talking about the *metaphysical possibility* of Ultimate Responsibility.
  3.  **Compatibility:** Some philosophers argue the two views are compatible! You could be a P.F. Strawsonian about our *lives* (we keep blaming and praising) while agreeing with Galen that *metaphysical ultimacy* is impossible. This is essentially the "Hard Compatibilist" or "Revisionist" stance.

  **Conclusion:**
  Your intuition that the arguments were in tension was correct! You just attributed the tension to one mind instead of two. Once you separate the father (who saves responsibility by lowering the metaphysical bar) from the son (who sinks responsibility by raising the metaphysical bar), the landscape becomes much clearer.

  Good luck with the paper! It's a great topic.
