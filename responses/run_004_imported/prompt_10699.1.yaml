answer: |-
  The ledger lay open on the desk, the leather cover creaking as Elias pressed his palms flat against the pages. The entry was simple. *Elias Vane. Tomorrow. Location: To Be Determined.*

  He knew the rules of the Ledger. It was not a schedule of where Death would be; it was a record of where Death *was*, and it was written before the ink dried on the decision to go there. The correlation was perfect. If the Ledger said Aleppo, Death was in Aleppo. If the Ledger said Damascus, Death was in Damascus. And the Ledger never lied.

  Elias stood up and began to pack a bag. His movements were brisk, efficient. *Aleppo,* he thought. *The roads are good. I can be there by noon.* A wave of relief washed over him, a tangible loosening of the knot in his chest. He was taking action. He was escaping the stagnation of this room.

  He zipped the bag. The sound was final.

  And then the logic caught up.

  If I am zipping this bag, Elias thought, it is because I have decided to go to Aleppo. But if I have decided to go to Aleppo, the Ledger anticipated this decision yesterday. The Ledger anticipated the relief I felt ten seconds ago. Therefore, the entry for tomorrow is already *Aleppo*.

  He looked at the bag. It was no longer a vessel of escape; it was a beacon. To take it was to walk directly into the appointment. The relief curdled into nausea. The bag was poisoned by his own intention.

  He unzipped it. He emptied the clothes onto the floor.

  *Damascus, then.* He would stay. He would sit in this chair, drink his wine, and let the world come to him. It felt defiant. It felt like a different variable. If he didn't move, surely the prediction would fail?

  But staying was a choice. It was a plan just as much as fleeing. If he settled into the chair, that settlement was the very evidence the Ledger used to write his name. If he chose to stay, the Ledger had already written *Damascus*. To stay was to wait in the exact coordinate where the scythe would fall.

  He paced the room. The floorboards groaned.

  *Don't choose,* he told himself. *Hover.*

  He tried to suspend his will. He would stand in the doorway, neither in nor out. He would let his feet decide. But even the decision to suspend choice was a strategy. It was a plan of "inaction," and the Ledger predicted plans. If he hovered, the Ledger said *Doorway*.

  The sun was beginning to dip below the horizon, casting long, grey shadows across the ledger.

  Elias rummaged in his drawer and found a coin. A silver quarter, worn smooth.

  *Randomization,* he thought. *Causal independence.*

  If he let chance decide, the Ledger couldn't predict his *will*, because he had no will. He would submit to the toss. Heads for Aleppo, Tails for Damascus.

  He held the coin in his thumb's crook. He prepared to flick it.

  But he stopped. His thumb hovered.

  If the Ledger is perfect, it does not just predict my thoughts. It predicts the state of the universe. It predicts the air resistance on this coin. It predicts the micro-fractures in the metal that will determine the bounce. It predicts the twitch in my thumb muscle.

  If he flipped the coin, and it landed on Heads, that outcome was already written in the Ledger. If he flipped it and it landed on Tails, that too was written. The coin did not break the chain; it was just another link in it. To trust the coin was to trust a mechanism that Death had already accounted for.

  There was no safety in chaos if the chaos was foreseen.

  Elias let the coin drop. It hit the desk and spun, a silver blur whining against the wood. He watched it, mesmerized, waiting for it to fall.

  *If it's Heads, I run,* he thought. *But if I plan to run on Heads, then Heads is death.*
  *If it's Tails, I stay. But if I plan to stay on Tails, then Tails is death.*

  The coin wobbled. It slowed.

  It didn't matter. Whichever side faced up, the moment he accepted it as his command, he signed his own warrant. The act of accepting the result was the act of confirming the prediction.

  He slapped his hand down over the coin before it settled. He didn't look. He couldn't look.

  He sat back in the chair, his hands trembling. The room was silent now. The logic was airtight. It was a room with no doors, constructed entirely of his own reasoning.

  Every plan he formulated carried the seed of its own destruction.
  To go was to die.
  To stay was to die.
  To flip was to die.
  To hesitate was to die.

  The horror wasn't that Death was coming. The horror was that there was no rational place to stand while he waited. Any ground he chose became, by the very act of choosing it, the killing ground.

  He looked at the ledger again. The ink seemed to shimmer.

  *I need a reason to move that isn't a reason,* he thought desperately. *I need to act without deciding.*

  He stood up abruptly, knocking the chair over. He would walk to the window. Not to jump, not to look, just to walk. A reflex.

  But as his foot lifted, he knew. The Ledger had predicted the knock. It had predicted the reflex. *Window,* the book whispered without sound.

  He froze with one foot in the air. He couldn't put it down, because that was a step toward the window. He couldn't pull it back, because that was a retreat to the center of the room.

  He stood like a statue, balanced on one leg, muscles burning.

  If he fell, it was fate. If he steadied, it was fate.

  The sun vanished. The room plunged into twilight. Elias remained balanced, trembling, sweat stinging his eyes. He realized then that he would not sleep tonight. To sleep was to choose the bed. To close his eyes was to choose the dark.

  He had to remain in the gap. He had to exist in the fraction of a second between the impulse and the action, forever.

  But his muscles were tired. Gravity was patient.

  Elias Vane stood in the darkening room, terrified not of the end, but of the next thought. Because he knew, with absolute certainty, that as soon as he thought of a way out, the Ledger would already be waiting for him there.
