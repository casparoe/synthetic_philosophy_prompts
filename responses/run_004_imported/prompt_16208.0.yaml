prompt: |-
  My grandmother taught AP Psychology and ran the philosophy club at my high school for nearly thirty years, and this past fall, her last semester before retiring, I was in both. She was known for one line she made every class repeat: "character is what you do when nobody's grading you" — the center of her case for virtue ethics over everything else we covered. A few weeks before she retired, she taught us Milgram, Zimbardo, and the Darley and Batson seminary-student study, and admitted, unprompted, that she'd never found an answer to the situationist critique that she actually believed. She died last week, before she got to finish that thought with us. I'm giving her eulogy this Saturday, about five minutes long, to a room that's roughly a third former students who will know exactly what I mean, and two-thirds family and neighbors who have never heard the word "situationism." Write the eulogy so that it genuinely works through the tension she left hanging, in a way she'd have recognized as honest, rather than just declaring she was a good woman and moving on — without letting it turn into a psychology lecture at her own funeral.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Grandmother, AP Psychology teacher, Philosophy Club advisor (30 years).
      *   **Key Phrase:** "Character is what you do when nobody's grading you." (Virtue Ethics).
      *   **The Conflict/Tension:** She taught situationist studies (Milgram, Zimbardo, Darley & Batson) which challenge virtue ethics. She admitted she never found an answer to the situationist critique that she *actually believed*, but died before finishing that thought.
      *   **Audience:** 1/3 former students (know the jargon/concepts), 2/3 family/neighbors (don't know "situationism").
      *   **Goal:** Write a 5-minute eulogy that addresses the tension honestly (not just "she was good"), without turning into a lecture. It needs to resolve or honor the hanging thought in a way she'd recognize.
      *   **Tone:** Honest, reflective, warm, intellectual but accessible.

  2.  **Deconstruct the Core Conflict:**
      *   *Virtue Ethics:* Goodness comes from within (character).
      *   *Situationism:* Goodness comes from context/circumstance (external pressures).
      *   *Grandma's Stance:* She taught virtue ethics as the ideal ("Character is..."), but intellectually respected the situationist evidence that context matters immensely. She died with this unresolved.
      *   *The Eulogy's Task:* How do we honor a life of building character while acknowledging the power of circumstance, without undermining her legacy?
      *   *Potential Resolution:* Maybe the "answer" she was looking for isn't a theoretical one, but a practical one. Maybe *she* was the situation. She created the context where good character could flourish. Or, maybe the tension itself is the point—striving for virtue *despite* knowing the odds.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge who she was (teacher, grandmother) and the setting. Establish the "line" immediately. It's the anchor.
      *   **The Middle (The Conflict):** Introduce the psychology concepts gently. Don't define "situationism" academically; define it through stories or feelings. Mention the studies (Milgram, etc.) but frame them as "the hard truths about human nature."
      *   **The Turning Point:** Address her admission. She didn't have the answer. That's okay.
      *   **The Resolution (The "Answer"):** How do we reconcile this?
          *   *Idea 1:* She proved the situationists wrong by being good regardless. (Too simple, ignores her admission).
          *   *Idea 2:* She knew the world was hard, but taught us to be good anyway. (Better).
          *   *Idea 3:* She *created* the situation. She built a classroom (a context) where grading didn't matter, only character did. She changed the environment so virtue could exist. (This feels strongest).
      *   **Closing:** Bring it back to the family/neighbors. Make it about how we live now. A call to action that fits her philosophy.

  4.  **Refining the Language (Audience Awareness):**
      *   *For the Students:* Use terms like "Milgram," "Virtue Ethics," "The Line." They will nod.
      *   *For the Family:* Explain these as "questions about why people do good or bad things." Keep it relatable.
      *   *Avoid:* Jargon heavy explanations. No defining "situationism" explicitly.
      *   *Time Check:* 5 minutes is roughly 600-750 words spoken at a moderate pace.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Grandma taught psych. She said "Character is what you do when no one grades." She loved virtue ethics. But she also taught us about Milgram and how context controls us. She told me she didn't know how to fix that contradiction. She died before solving it. But I think I know. She made a classroom where we felt safe to be good. So she was the situation. Let's be like her.

      *Critique 1:* Too blunt. Needs more emotion and flow. Needs to honor the intellectual honesty she valued.

  6.  **Drafting - Iteration 2 (Focusing on the "Unfinished Thought"):**
      Start with the quote. It's famous to us. Then talk about the last semester. The dark studies. Her honesty. She knew people are influenced by surroundings. But she kept teaching character. Why? Because she believed in the struggle. To the family: she believed in trying to be good even when it's hard. To the students: she knew the data, but chose hope.

      *Critique 2:* Better. But let's sharpen the resolution. The prompt asks to "work through the tension." The resolution should be that *she* was the variable. She created the conditions for virtue.

  7.  **Finalizing the Content (incorporating the "Situationist" angle subtly):**
      *   *Phrase:* "The circumstances we find ourselves in." (Instead of "Situationism").
      *   *Phrase:* "The experiments on obedience and pressure." (Instead of listing every study detail).
      *   *Key Insight:* She didn't deny the pressure; she built a room where the pressure was lifted.
      *   *Ending:* The grade is gone. Now what?

  8.  **Writing the Draft (incorporating sensory details and pacing):**
      *   *Opening:* The classroom atmosphere. The chant.
      *   *Body:* The conflict. The studies. Her confession.
      *   *Synthesis:* She wasn't naive. She was defiant. She built a "situation" of integrity.
      *   *Conclusion:* For the family (love) and students (legacy).

  9.  **Review against Constraints:**
      *   5 minutes? (Word count looks good).
      *   No lecture? (Concepts are woven into narrative).
      *   Honest tension? (Yes, acknowledges she didn't solve it theoretically).
      *   Audience balance? (Yes, explains concepts through human experience).

  10. **Final Polish:** Check the rhythm. Ensure the transition from "psych teacher" to "grandmother" is seamless. (Self-Correction: Make sure not to sound *too* academic. Keep the emotion front and center.) *Decision: Keep the specific study names but frame them as "stories about how easily we lose ourselves."*

