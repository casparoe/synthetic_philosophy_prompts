answer: |-
  Good morning. For those of you who don't know me, I'm her grandson. And for those of you who do know me, you know that standing here feels a bit like standing at the front of Room 304 waiting for the bell to ring.

  For nearly thirty years, my grandmother started her AP Psychology classes with a specific ritual. She didn't ask for silence. She didn't ask for notebooks out. She asked us to repeat a line. In a room full of teenagers, thirty voices would drone out: *"Character is what you do when nobody's grading you."*

  It was her shorthand for Virtue Ethics. It was her way of saying that goodness isn't a performance. It's an internal architecture.

  But those of us who were in her class this past fall know that the story is more complicated than that. In her final semester, she taught us the hard stuff. She taught us about Milgram and obedience. She taught us Zimbardo and the power of roles. She taught us the seminary student study, where good people walked past a suffering man simply because they were in a rush.

  These are the studies that suggest "character" might be a myth. That we are mostly products of our circumstances. That if the situation is strong enough, the inner self breaks.

  A few weeks before she retired, she admitted something to us. She told us that intellectually, she couldn't refute that critique. She said, "I have never found an answer to the situationist argument that I actually believe." She died last week before she could tell us what she meant to do with that doubt.

  It would be easy to stand here and ignore that tension. To say she was a good woman, and therefore, character wins. But she hated easy answers. She valued intellectual honesty over comfort. So, I've been thinking about what she left unfinished.

  If the situationists are right—if we are shaped by the pressures around us—then perhaps my grandmother's life wasn't a proof that character exists in a vacuum. Perhaps her life was proof that we can *build* the vacuum.

  She knew the world puts pressure on us. She knew we are tired, or rushed, or told to obey. But for thirty years, she built a room where the grading stopped. She created a situation where the only metric was integrity. She didn't just preach virtue; she engineered the context where it could survive.

  To her family and neighbors here: You knew this side of her. You knew that when nobody was watching, she was the one checking on the sick neighbor, or listening when everyone else was talking, or showing up when it was inconvenient. She didn't do those things because she was immune to human weakness. She did them because she spent a lifetime constructing a life where those choices were possible.

  To her students: She left us with a question, not a dogma. She knew the data says we are fragile. But she bet on us anyway.

  The tension she left hanging isn't a problem to be solved. It's a practice to be lived. We cannot control every variable. We cannot eliminate every pressure that tries to make us smaller, or crueler, or indifferent. But we can follow her lead. We can be the architects of our own situations. We can build rooms, and families, and communities where the "grade" doesn't matter, and where doing the right thing is the only thing that counts.

  She didn't finish that thought for us. I think that's because she knew the answer wasn't something she could say from the front of the room. It's something we have to demonstrate when we leave it.

  Character is what you do when nobody's grading you. And now, for the first time, she isn't grading us.

  So, let's get to work.
