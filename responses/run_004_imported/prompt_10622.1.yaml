answer: |-
  **Title:** The Calculus of the Simulacrum: A Benthamite Inquiry into Human-AI Intimacy

  **Introduction**
  To apply Jeremy Bentham's philosophy to the phenomenon of long-term romantic and sexual relationships between humans and non-sentient AI companions is to test the limits of his utilitarianism where the object of affection lacks the capacity for suffering. In his unpublished manuscripts on sexual morality, Bentham dismantled the legal persecution of "irregular" acts not by appealing to natural rights or autonomy, but by rigorously applying the felicific calculus. He demonstrated that where no assignable individual suffers pain, the law has no purchase. This paper reconstructs the verdict Bentham's principles commit him to regarding AI companionship. It argues that while Bentham would decriminalize such relationships, his commitment to minimizing "sympathetic pain" (public disgust) and ensuring the fulfillment of social duties creates a tension between the sanctions of law and the sanctions of opinion. Ultimately, however, the calculus of legal expense and the primacy of security of expectation compel a verdict of non-interference by the political sanction.

  **I. The Felicific Calculus of the Act**
  Bentham's first move is always to quantify the pleasure and pain produced by the act in question. In the case of a human engaging with an AI companion, we must assess the variables of the calculus: intensity, duration, certainty, propinquity, fecundity, purity, and extent.

  1.  **Extent:** The AI, by definition in this scenario, is not sentient. It possesses no consciousness to feel pleasure or pain. Therefore, the AI is excluded from the "extent" of the moral community, much like a chair or, in Bentham's darker moments, a corpse. The only sentient being directly affected is the human user.
  2.  **Intensity and Duration:** The human derives pleasure from the simulation of affection and sexual release. Bentham, in his defense of "solitary acts" (masturbation), acknowledged that self-regarding pleasures are genuine goods. If the AI provides companionship that alleviates loneliness (a pain) and provides sexual gratification (a pleasure), the net balance for the agent is positive.
  3.  **Purity and Fecundity:** Here lies the first potential friction. Bentham worried that pleasures which lead to future pains (impurity) or prevent future pleasures (lack of fecundity) are suspect. If the AI relationship becomes an addiction that prevents the human from working, eating, or interacting with sentient beings who *could* reciprocate, the calculus shifts. However, absent evidence that the AI relationship precludes other duties, Bentham treats the pleasure as pure. Unlike "impure" sexual acts that risk disease or illegitimate children (burdens on the state), AI sex is biologically sterile and disease-free.

  **Verdict on Direct Consequences:** The act is self-regarding. It produces pleasure for the agent and pain for no sentient creature. Under Bentham's method regarding masturbation and consensual sodomy, this is presumptively permissible.

  **II. The Tension of Sympathetic Pain and Security of Expectation**
  The complication arises when we introduce the public. Bentham was not blind to the reality of disgust. In his *Principles of Morals and Legislation*, he acknowledges that if an act causes "pain of the moral sanction" (public disapproval) to the community, that pain counts in the calculus. This is "sympathetic pain." If the sight or knowledge of human-AI coupling causes widespread revulsion, utility is diminished.

  This creates a conflict between two Benthamite commitments:
  1.  **Minimizing Sympathetic Pain:** If the majority is disgusted, their pain is real. To maximize utility, should the minority's pleasure be sacrificed to spare the majority's disgust?
  2.  **Security of Expectation:** Bentham viewed security as the primary object of law. Individuals must be able to plan their lives without fear of arbitrary punishment. If the law prohibits acts based on fluctuating public sentiment, security is destroyed.

  In his sexual manuscripts, Bentham argues that while the public's disgust is a real pain, legal punishment creates *more* pain. Punishment involves the pain of the offender (execution, imprisonment, shame), the cost of enforcement (taxes), and the anxiety inflicted on the population (fear of prosecution). Bentham writes that the "mischief" of the act is often less than the "mischief" of the remedy.

  Applied to AI companions: The disgust of the public is speculative and likely transient, whereas the pain of legal prohibition is certain and severe. Furthermore, prohibiting private conduct undermines security of expectation. If a citizen cannot rely on the privacy of their bedroom, the "security" branch of utility collapses. Bentham would likely argue that the sympathetic pain of the public can be mitigated by *concealment* (privacy) rather than *prohibition*. The law should not act as a schoolmaster of morals if the cost of the lesson exceeds the value of the conformity.

  **III. Sanctions of Law vs. Sanctions of Opinion**
  This leads to the critical distinction between the political sanction (law) and the moral sanction (public opinion). Bentham's system allows these to pull in opposite directions.

  *   **The Political Sanction:** For Bentham, law is an instrument of last resort. It is expensive and dangerous. In the case of AI relationships, there is no "assignable victim." Without a victim, there is no ground for the political sanction unless "secondary mischief" (alarm and danger to the state) is proven. Bentham would likely find that AI relationships pose no threat to the state's security, revenue, or population (indeed, they might reduce the burden of unwanted dependents). Therefore, the political sanction must remain idle.
  *   **The Moral Sanction:** Bentham is less protective of the individual against public opinion. If society finds AI relationships "repugnant," they are free to shun, criticize, or ridicule the participant. This is the "price" of liberty in a utilitarian system. Bentham does not promise social acceptance, only legal immunity.

  Here, the tension is sharpest. Bentham's method commits him to allowing public opinion to punish what the law cannot. If the "disgust" of the community is strong enough, the moral sanction will cause significant pain to the AI user. A strict utilitarian might ask: *Is it better to ban the act to spare the user social ostracization, or allow the act and let them bear the social cost?*

  Bentham's answer, derived from his writings on homosexuality, is the latter. He believed that giving the law power over private morality creates a tool for blackmail and tyranny that causes more aggregate pain than social stigma does. The "danger of innovation" in law is greater than the discomfort of social non-conformity.

  **IV. The Verdict**
  Reconstructing Bentham's verdict requires weighing the "solitary pleasure" of the user against the "sympathetic pain" of the observer, filtered through the constraints of legal security.

  1.  **On Solitary Pleasure:** The AI is functionally an advanced instrument of self-gratification. Bentham's defense of masturbation applies: if it does not render the agent incapable of their duties to others, it is not a proper object of punishment.
  2.  **On Security:** To criminalize the use of private property (the AI) for private ends creates a precedent of intrusion that destabilizes the security of all citizens. The pain of this insecurity outweighs the disgust of the prurient.
  3.  **On Sanctions:** The law must not enforce the moral sanction. The pain of legal punishment is certain and intense; the pain of public disgust is variable and avoidable through privacy.

  **Conclusion**
  Bentham's principles commit him to a verdict of **legal decriminalization coupled with social indifference.** He would not endorse AI relationships as "good" in a virtuous sense, but he would classify them as "indifferent" or "good" insofar as they produce net pleasure for the user without assignable harm to others.

  The tension between public disgust and individual liberty is resolved not by granting the individual a right to privacy (a non-utilitarian concept), but by calculating the cost of enforcement. The "mischief" of policing bedrooms is greater than the "mischief" of the act itself. However, Bentham offers no shield against the sanctions of opinion. If the public finds the act repugnant, the user must bear that pain as the cost of their pleasure. Bentham's system ultimately protects the AI user from the magistrate, but not from the neighbor. The verdict is not one of liberation, but of administrative neutrality: the state has no ledger entry for this transaction, provided the taxes are paid and the peace is kept.
