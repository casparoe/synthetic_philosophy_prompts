answer: |-
  You are absolutely not reading too much into this. In fact, you have stumbled onto one of the most fascinating ironies in the history of philosophy. Scholars like Noel Malcolm and Tom Sorell have written extensively about this, and the consensus is that Hobbes's stubbornness wasn't just old-man ego—it was structurally tied to the very foundation of his philosophy.

  Here is the breakdown of why geometry was the engine of *Leviathan*, and why that same engine trapped him into refusing to admit he was wrong about the circle.

  ### 1. Why Geometry Was Special: Definitions as Causes
  To understand Hobbes, you have to understand his materialism. He believed everything in the universe is matter in motion. But how do we get *certainty* about matter in motion?

  For Hobbes, there are two types of knowledge:
  1.  **Knowledge of Fact:** This is memory and experience (e.g., "It rained yesterday"). This is never certain; it's just probability.
  2.  **Knowledge of Consequences:** This is reasoning from one statement to another (e.g., "If A, then B"). This is where certainty lives.

  **Geometry was the only perfect "Science of Consequences."**
  Hobbes argued that in natural philosophy (physics), we observe effects and try to guess the causes. We can never be 100% sure we are right because nature is complex and hidden.

  But in geometry, **we create the causes.**
  *   When a geometer defines a "circle," they are stipulating the rules of its generation.
  *   Because we define the premises, we know the "cause" of the truth perfectly.
  *   Therefore, the conclusions we draw from those definitions must be certain.

  For Hobbes, geometry wasn't just about shapes; it was a **political act of definition.** He believed that if you could control definitions and reason strictly from them, you could eliminate disagreement. This is exactly what he tried to do in *Leviathan*. He wanted to define "Right," "Law," and "Covenant" so clearly that any rational person would have to agree that an Absolute Sovereign was the only logical conclusion.

  Geometry was the proof that his method worked.

  ### 2. The Trap: Why He Couldn't Admit He Was Wrong
  So, why did he spend his 70s and 80s fighting John Wallis over squaring the circle (which, for the record, is mathematically impossible)?

  If Hobbes admitted that he, the master of the geometric method, could not actually solve a basic geometric problem, it threatened to pull the rug out from under his entire political philosophy.

  Here is the logical trap he built for himself:

  **A. The Stakes of the Method**
  Hobbes claimed his political conclusions were as certain as geometric proofs. He often introduced his political arguments by saying they were demonstrated "more geometrico" (in the geometric style).
  *   **The Trap:** If Hobbes admits he is bad at geometry, he admits his method is flawed. If his method is flawed, then the "scientific" certainty of *Leviathan* collapses, and it becomes just another opinion. For a man who believed civil war was caused by conflicting opinions, admitting his philosophy was "just an opinion" was unacceptable.

  **B. Error is Irrationality**
  In Hobbes's system, correct reasoning is like arithmetic. If you add 2 + 2 and get 5, you aren't just "different"; you are wrong. There is no room for interpretation.
  *   **The Trap:** Because Hobbes believed his proof was a result of correct reasoning from clear definitions, he literally could not conceive that he was wrong. To admit error would be to admit that human reason is incapable of reaching certainty. If reason can't reach certainty in geometry, it can't reach certainty in politics, and we are doomed to the State of Nature forever. He *needed* to be right to save humanity from chaos.

  **C. The Enemy Was the "University"**
  Hobbes hated the universities (Oxford and Cambridge). He viewed them as breeding grounds for Aristotelian "vain philosophy" and religious sedition that led to the English Civil War. John Wallis was a professor at Oxford.
  *   **The Trap:** To Hobbes, Wallis wasn't just a mathematician; he was a representative of the corrupt establishment that Hobbes was trying to overthrow with his new "Civil Science." Admitting Wallis was right would mean admitting the "old guard" knew better than Hobbes's new revolutionary philosophy. He framed the debate not as "Hobbes vs. Math," but as "True Reason (Hobbes) vs. Pedantic Symbol Manipulation (Wallis)."

  ### 3. Was It a Philosophical Blind Spot?
  Yes. Hobbes had a very specific view of what geometry *was*.
  *   **Wallis (and modern math):** Viewed geometric objects as abstract symbols and algebraic relationships.
  *   **Hobbes:** Viewed geometric objects as **physical traces.** To Hobbes, a line was a mark made by a moving point. A circle was a physical shape drawn in space.

  Because Hobbes was a strict materialist, he trusted his physical intuition over abstract algebraic proofs. When Wallis used algebraic symbols to prove Hobbes wrong, Hobbes dismissed it as "meaningless marks." He believed that because he could *visualize* his solution physically, it had to be true, and Wallis's abstract proofs were just word games.

  This is the ultimate irony: **Hobbes, the champion of precise definitions, refused to accept the definition of proof that the mathematical community had established.**

  ### Summary
  You aren't reading too much into it. Hobbes was trapped by his own epistemology.
  1.  He claimed **Geometry** was the only path to **Certainty**.
  2.  He claimed **Politics** could be as certain as **Geometry**.
  3.  Therefore, if he failed at **Geometry**, his **Politics** lost its claim to Certainty.

  He couldn't admit he failed to square the circle because, in his mind, doing so would be admitting that there is no certain knowledge in the world. If there is no certain knowledge, *Leviathan* falls, and the State of Nature returns. His stubbornness was a desperate defense of the possibility of order itself.

  It's a tragic end to a brilliant career: the man who taught us that we need a Sovereign to prevent conflict spent his final decades in a bitter, public feud he refused to lose, proving that even the greatest philosophers are vulnerable to their own blind spots.
