  I've been falling down a bit of a rabbit hole on medieval political theory (there might be a piece on the ethics of assassinating dictators in this, we'll see) and I can't quite settle something about Aquinas and tyrannicide. In On Kingship he's pretty clearly wary of private citizens taking it upon themselves to kill a tyrant -- he worries about the precedent, about ambitious men using "tyranny" as a pretext to knock off inconvenient rulers, and mostly counsels appeal to whatever higher authority installed the guy in the first place, or failing that, prayer. But then over in the Summa, in the bit on sedition, he basically says (if I'm remembering right) that a tyrannical regime isn't even a "just" government to begin with, so rising up against it doesn't count as the sin of sedition at all -- if anything it's the tyrant who's the seditious one, for tearing the community apart for his own benefit. Historians of political thought argue about whether these two texts are actually consistant -- usurpers vs. rulers who go bad in office, private action vs some kind of public/communal authority, that sort of thing -- or whether Aquinas just never fully worked it out. Could you write me an essay that actually digs into this? Lay out the strongest version of each reading, be honest about where the tension is genuinely hard to resolve, and then commit to an answer: on balance, did Aquinas think killing a tyrant could be justified, and if so under what conditions?
