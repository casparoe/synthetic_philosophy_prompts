prompt: |-
  I'm the student representative on my school district's Educational Technology Advisory Committee. In three weeks we vote on whether to expand a pilot early-warning algorithm district-wide; it flags students at risk of not graduating on time, and flagged students get priority access to a limited number of counseling slots that can't cover everyone who'd benefit. Our charter requires any tool to be "shown fair across subgroups" before district-wide adoption, without ever defining fairness -- and the pilot has shown exactly why that omission matters. The vendor's audit found the tool well-calibrated by income: a 70% risk score means roughly a 70% chance of falling behind in every income group. But among students who do fall behind, it catches 82% of those from low-income households and only 61% of everyone else. Our data consultant confirmed this is a mathematical trade-off, not a fixable bug: because the two groups' base rates differ, no adjustment can equalize those catch rates without undoing the calibration. Half the committee wants equal catch rates whatever the cost to calibration; the other half wants to preserve calibration and live with the disparity. Please draft the memo I'll circulate before the vote: a concrete recommendation with a timeline, and a serious hearing for the strongest argument on whichever side it rejects.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the Educational Technology Advisory Committee (ETAC).
      *   **Task:** Draft a memo to circulate before a vote in three weeks.
      *   **Subject:** Expanding a pilot early-warning algorithm district-wide.
      *   **The Algorithm:** Flags students at risk of not graduating on time. Flagged students get priority counseling (limited slots).
      *   **The Constraint:** Charter requires tools to be "shown fair across subgroups" (undefined).
      *   **The Data:**
          *   *Calibration:* Good across income groups (70% score = 70% risk for everyone).
          *   *Recall (Catch Rate):* Disparate. 82% for low-income students who fall behind vs. 61% for others who fall behind.
          *   *Trade-off:* Data consultant confirms you can't have both perfect calibration and equal recall due to differing base rates.
      *   **The Conflict:** Half the committee wants equal catch rates (sacrificing calibration); half wants to preserve calibration (accepting disparate catch rates).
      *   **Requirements for the Memo:**
          *   Concrete recommendation with a timeline.
          *   Serious hearing for the strongest argument on the *rejected* side.
          *   Tone: Professional, persuasive, nuanced, student-centered.

  2.  **Determine the Recommendation:**
      *   *Option A: Reject Expansion.* (Status quo or seek new tool).
      *   *Option B: Approve Expansion with Calibration.* (Prioritize accuracy of risk assessment).
      *   *Option C: Approve Expansion with Equalized Catch Rates.* (Prioritize equal opportunity for intervention).
      *   *Option D: Conditional Approval / Hybrid.* (Expand but with specific mitigations).

      *Decision:* As a *student representative*, the primary goal is student welfare.
      *   *Calibration argument:* If we sacrifice calibration to equalize catch rates, we will be flagging students who *aren't* actually at risk just to boost numbers for the higher-income group. This wastes scarce counseling slots on students who don't need them as urgently, potentially harming the low-income students the tool was meant to help. It also undermines trust in the scores.
      *   *Catch Rate argument:* If we keep calibration, we miss more non-low-income students who are struggling. Is it fair to let a middle-class kid fail just because the math says their group fails less often?
      *   *The "Student Rep" Angle:* The scarce resource is *counseling*. The goal is *graduation*.
      *   *Best Path:* Recommend **Option B (Preserve Calibration)** but with a crucial caveat: The disparity in catch rates highlights a need for *more* counseling slots or a secondary screening process, not a broken algorithm. However, the prompt asks for a concrete recommendation on the *tool adoption*.
      *   *Refined Path:* I need to pick a side to make a "concrete recommendation."
      *   *Ethical Weighing:* False positives (flagging safe students) vs. False negatives (missing at-risk students).
          *   If we equalize catch rates (recall), we must lower the threshold for the higher-income group. This creates False Positives. Since counseling slots are *limited*, False Positives crowd out True Positives.
          *   If we keep calibration, we accept that we miss more higher-income at-risk students.
          *   *Student Rep Perspective:* Wasting limited counseling slots on false positives is arguably more harmful than the statistical disparity, because it actively denies help to those the algorithm *knows* are at risk. However, missing 39% of non-low-income at-risk students is also bad.
          *   *The "Fairness" Charter:* The charter is undefined. I need to interpret "fair."
          *   *Recommendation:* **Do not expand yet.** Why? Because the resource constraint (limited counseling) makes *any* algorithmic prioritization ethically fraught without a plan to address the capacity gap. The trade-off reveals a resource problem, not just a math problem.
          *   *Alternative Recommendation:* **Expand with Calibration (Option B)** but mandate a review of counseling capacity. Why? Because calibration ensures that when we *do* intervene, we are intervening on the right kids. Sacrificing calibration to game the stats harms the low-income students the most (who are already disadvantaged).
          *   *Let's go with Option B (Expand with Calibration)*. It aligns best with the "do no harm" principle regarding the scarce resource. If we flag kids who aren't at risk just to balance the books, we are stealing slots from kids who *are* at risk.
          *   *Wait, looking closer at the prompt:* "Half the committee wants equal catch rates... other half wants to preserve calibration." I need to break the tie.
          *   *Decision:* I will recommend **preserving calibration** (approving the tool as-is) but with a specific mandate to address the counseling bottleneck. This honors the accuracy of the risk assessment.
          *   *Wait, a stronger Student Rep move:* The "fairness" charter is the blocker. If we can't define fairness, we shouldn't vote. But I need a recommendation.
          *   *Let's pivot:* The most responsible recommendation is to **approve the tool with calibration preserved**, *provided* we acknowledge the missed students in the other group. Why? Because False Positives (caused by equalizing catch rates) actively harm the high-risk group by diluting their access to the *limited* slots.
          *   *Actually, the most nuanced position:* Recommend **Conditional Approval**. Adopt the tool with current calibration, *but* tie the expansion to a commitment to increase counseling capacity or implement a secondary review for near-miss students in the under-flagged group.
          *   *Simpler approach for a memo:* Pick a lane. I will recommend **Adoption with Calibration Preserved**. It is the more intellectually honest position regarding risk. I will treat the "Equal Catch Rate" argument with the seriousness requested.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (vote in 3 weeks) and the stakes (graduation, counseling).
      *   **The Situation:** Briefly explain the pilot results (Calibration good, Recall disparate). Explain the mathematical trade-off (Base Rate Fallacy/Impossibility Theorem).
      *   **The Recommendation:** Adopt district-wide *with current calibration*.
      *   **The Rationale:**
          *   Trustworthiness of the score.
          *   Resource allocation (Limited slots mean False Positives are dangerous).
          *   Protecting the most vulnerable (Low-income students already face systemic barriers; diluting their priority access is harmful).
      *   **The Rejected Argument (Equal Catch Rates):** Give this space. Why is it compelling? Because missing 39% of struggling non-low-income students feels like neglect. It looks like the system cares less about them. It violates the "equal opportunity" spirit. Acknowledge this moral weight.
      *   **The Mitigation/Timeline:** How do we address the missed kids?
          *   Phase 1 (Month 1-3): Rollout with calibration.
          *   Phase 2 (Month 4): Review counseling capacity.
          *   Phase 3 (Month 6): Secondary screening for students just below the threshold in the under-flagged group.
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
      *   Must sound like a student leader: Passionate but rigorous. Not naive, but focused on peer welfare.
      *   Avoid jargon where possible, or explain it (e.g., calibration vs. catch rate).
      *   Ensure the "rejected argument" doesn't feel like a strawman. It needs to feel like a genuine moral dilemma.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending adoption too risky given the charter's "fairness" clause?
      *   *Fix:* I need to explicitly define "fairness" in the memo to satisfy the charter. I will argue that *predictive accuracy* (calibration) is the only defensible definition of fairness when resources are scarce.
      *   *Critique:* Did I address the timeline?
      *   *Fix:* Add specific dates/milestones.
      *   *Critique:* Is the "rejected argument" strong enough?
      *   *Fix:* Frame it as "Equal Opportunity for Intervention." If two students are failing, they deserve the same chance of being caught, regardless of demographics. This is a powerful moral argument.

  6.  **Final Polish:** Check word count, clarity, and ensure all constraints of the prompt are met (concrete recommendation, timeline, serious hearing for rejected side).

      *(Self-Correction on the Recommendation)*: Actually, as a student rep, if I know 39% of struggling students in one group are being missed, is it ethical to let that happen?
      *   If we switch to equal catch rates, we lose calibration. That means a 70% score for a rich kid means 50% risk, but a 70% score for a poor kid means 70% risk. This makes the score meaningless for decision making.
      *   The *real* problem is the limited counseling slots.
      *   Okay, I will recommend **Adoption with Calibration**, but explicitly frame the "missed students" issue as a *budgetary* failure, not an algorithmic one. We cannot fix a resource shortage by breaking the thermometer.

  7.  **Finalizing the Memo Structure:**
      *   To/From/Date/Subject.
      *   Executive Summary.
      *   Context: The Pilot Data.
      *   The Core Conflict: Calibration vs. Catch Rate.
      *   Recommendation: Proceed with Calibration.
      *   The Case for the Alternative (Equal Catch Rates).
      *   Implementation Timeline & Mitigations.
      *   Closing.

