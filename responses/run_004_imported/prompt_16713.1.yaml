answer: |-
  **MEMORANDUM**

  **TO:** Educational Technology Advisory Committee (ETAC)
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding District-Wide Expansion of Early-Warning Algorithm

  ### Executive Summary

  In three weeks, this committee must vote on whether to expand the early-warning graduation algorithm district-wide. Our charter mandates that any adopted tool be "shown fair across subgroups." The pilot data presents a mathematical impossibility: we cannot satisfy all definitions of fairness simultaneously. We must choose between **calibration** (accuracy of risk scores) and **recall** (equal catch rates across income groups).

  After reviewing the vendor audit and consulting with our data analyst, I recommend we **approve district-wide expansion preserving the current calibration**, provided we immediately initiate a parallel review of counseling capacity. This memo outlines the rationale for this decision, offers a serious consideration of the opposing view, and proposes a timeline to mitigate the harms of this choice.

  ### Context: The Fairness Trade-Off

  The pilot results show a tool that is well-calibrated but disparate in its reach.
  *   **Calibration:** A risk score of 70% predicts a 70% likelihood of falling behind, regardless of a student's income. The "thermometer" reads accurately for everyone.
  *   **Recall (Catch Rate):** Among students who *do* fall behind, the tool identifies 82% of low-income students but only 61% of non-low-income students.

  Our data consultant has confirmed this is not a bug. Because the base rates of graduation risk differ between these groups, mathematically adjusting the thresholds to equalize catch rates would destroy calibration. If we force equal catch rates, a 70% score would mean different levels of actual risk depending on the student's background.

  ### Recommendation: Preserve Calibration

  I recommend we adopt the tool **with current calibration metrics**.

  **1. Integrity of Intervention**
  Our counseling slots are a scarce resource. Calibration ensures that when we allocate a slot to a student with a high risk score, we are confident that the risk is real. If we sacrifice calibration to equalize catch rates, we will inevitably flag students who are *not* actually at high risk simply to balance the demographic numbers. This creates "false positives." In a resource-constrained environment, every false positive displaces a true positive. We cannot justify denying a counseling slot to a student we *know* is at high risk in order to flag a student who is likely to graduate anyway.

  **2. Protecting Vulnerable Subgroups**
  Low-income students face systemic barriers that already jeopardize their graduation timelines. The pilot shows the tool is currently most effective at catching these students. Diluting the accuracy of their risk scores to improve statistics for a less vulnerable group risks re-establishing the very inequities this tool is meant to solve. Fairness, in this context, must mean trusting the data we have on the students most likely to be failed by the system.

  **3. Charter Compliance**
  I propose the committee formally interpret "fairness" in our charter, for the purpose of this tool, as **predictive accuracy**. A tool that lies about risk levels based on demographics is inherently unfair. A tool that tells the truth about risk, even if it misses some students due to base rate differences, remains honest.

  ### The Case for Equal Catch Rates

  I want to give full weight to the argument made by half of this committee: that we should prioritize **equal catch rates**, even at the cost of calibration. This position rests on a powerful moral premise: **Equal Opportunity for Intervention.**

  If two students are genuinely struggling—one low-income, one not—they are in the same boat. They both need a lifeline. By accepting the current disparity, we are effectively resigning ourselves to missing 39% of the struggling non-low-income students. To a parent or a student in that group, it looks like the district has decided their struggles are less worthy of detection.

  Furthermore, relying on calibration assumes our counseling interventions are perfectly targeted. If counseling is broadly beneficial, perhaps it is better to cast a wider net (higher catch rate) even if we include some students who might have succeeded without it. From this viewpoint, the "harm" of a false positive (wasting a slot) is less severe than the "harm" of a false negative (letting a student fail unnoticed). This argument prioritizes *access* over *efficiency*, suggesting that fairness is about who gets a chance at help, not how precisely we predict their failure.

  This is a compassionate stance. It highlights that our reliance on algorithmic precision should not blind us to the students falling through the cracks simply because their demographic group statistically fails less often.

  ### Mitigation and Timeline

  Accepting the recommendation to preserve calibration means we must acknowledge that we will miss some at-risk non-low-income students. We cannot treat the algorithm as the solution; it is only a triage mechanism. To address the valid concerns of the opposition, I propose the following implementation timeline:

  *   **Week 1 (Vote):** Committee votes to adopt tool with current calibration. Simultaneously, the committee passes a resolution acknowledging the disparate catch rates as a resource constraint issue, not an algorithmic one.
  *   **Month 1-3 (Rollout):** Algorithm deployed district-wide. Counseling slots allocated based on risk score priority.
  *   **Month 4 (Capacity Review):** Administration must present a report on counseling slot utilization. If slots remain unfilled by high-risk students, thresholds may be lowered globally (not by subgroup) to capture more students without breaking calibration.
  *   **Month 6 (Secondary Screening):** Implement a "near-miss" review. Students who score just below the flagging threshold (e.g., 60-69% risk) will undergo a brief manual review by counselors, specifically looking for the non-low-income students the algorithm is statistically likely to miss.
  *   **Month 12 (Audit):** Re-evaluate graduation outcomes. If the disparity in catch rates widens or counseling capacity has not increased, the license will not be renewed.

  ### Conclusion

  We are facing a mathematical constraint, but the ultimate constraint is human: we do not have enough counselors for every student who needs one. Breaking the thermometer will not fix the shortage of doctors.

  By preserving calibration, we ensure that the help we *can* offer goes to those who need it most. By acknowledging the missed students, we commit to finding the resources to help them, too. I ask the committee to vote for accuracy, transparency, and a plan to expand capacity, rather than obscuring the problem with statistical adjustments.

  I look forward to discussing this framework at our next session.

  Respectfully,

  [Your Name]
  Student Representative, ETAC
