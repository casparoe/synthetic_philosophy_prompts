answer: |-
  This is a fantastic case study for a philosophy of law seminar because it sits right at the intersection of property law, contract theory, human rights, and liberal political philosophy.

  To give you the direct answer you want: **Your instinct is right, and the board is not justified.** However, relying solely on Mill's Harm Principle ("no harm, no foul") is insufficient here, precisely because you identified the weakness: the co-op *already* restricts conduct (parties after 10 PM) without proof of concrete harm.

  To defeat the board's argument, you need to distinguish between **managing physical externalities** (the party rule) and **enforcing majoritarian morality** (the swingers ban). The principle doing the work isn't just liberty; it's the **limit of contractual governance over protected human rights and the distinction between nuisance and moral offense.**

  Here is the breakdown of why the board's position fails, structured for your seminar context.

  ### 1. The Human Rights Constraint (The Legal Trump Card)
  Before getting into pure philosophy, there is a hard legal constraint that overrides the "private contract" argument of the co-op. In almost all liberal jurisdictions (Canada, US, UK, EU), housing providers—including co-ops—are subject to Human Rights Codes or Civil Rights Acts.

  *   **Protected Grounds:** These codes prohibit discrimination based on **marital status, sex, and sexual orientation.**
  *   **The Conflict:** A bylaw banning "swingers" or "non-traditional sexual gatherings" disproportionately targets individuals based on their sexual lifestyle and relationship structure. While "swinging" itself isn't a protected class, policing consensual sexual conduct between adults in private touches directly on *marital status* (monogamous vs. non-monogamous) and *sexual orientation*.
  *   **Why the Party Rule is Different:** Restricting parties after 10 PM does not disproportionately impact a protected class. "Partying" is not an identity or a protected ground.
  *   **The Principle:** **Private contractual governance (bylaws) cannot violate statutory human rights norms.** A co-op is not a private club; it is housing. Therefore, the "freedom of contract" argument the board might make is statutorily limited. If the bylaw has a discriminatory effect, it is *ultra vires* (beyond the powers of) the board, regardless of how many residents vote for it.

  ### 2. Nuisance vs. Moral Offense (The Philosophical Distinction)
  This is where you can really dig in for your seminar. The board is conflating **nuisance** with **legal moralism.**

  **The Party Rule (Nuisance/Externality):**
  The rule against parties past 10 PM is a **prophylactic nuisance rule.**
  *   *Rationale:* Noise is a physical wave. It penetrates walls. It objectively interferes with sleep, which is a biological necessity.
  *   *Justification:* Even if no one has complained *yet*, the risk of physical interference with another resident's "quiet enjoyment" is high. It manages a **negative externality.** The restriction is on the *effect* of the conduct (noise/traffic), not the *nature* of the conduct itself. If someone hosted a silent party with headphones, the rule wouldn't apply (or shouldn't).

  **The Swingers Ban (Moral Offense):**
  The proposed ban is on the **moral character of the conduct.**
  *   *Rationale:* The residents are not claiming physical interference. They are claiming **psychic offense.** They are distressed by the *knowledge* that this is happening.
  *   *Justification:* In liberal legal theory (following Joel Feinberg's *The Offense Principle*), offense alone is rarely sufficient grounds for coercion unless the offense is unavoidable (e.g., public indecency). Inside a soundproofed private unit, the "offense" is avoidable by simply not knowing.
  *   *The Principle:* **The Public/Private Boundary.** Liberal law draws a bright line at the threshold of the private dwelling. Inside that threshold, the state (and by extension, the housing governance) generally lacks the authority to enforce moral conformity absent objective harm to others. To allow the board to ban this is to allow the **tyranny of the majority over private intimacy.**

  ### 3. The "Reasonableness" Standard
  In co-op and condo law, bylaws are subject to a **test of reasonableness.** A court will strike down a bylaw if it is arbitrary, discriminatory, or unreasonable.

  *   **Arbitrariness:** Banning conduct that has zero impact on the building's infrastructure, safety, or noise levels is arguably arbitrary.
  *   **Reasonableness:** Is it reasonable to expect residents to conform to a specific sexual morality? Case law in this area generally trends toward **no.** Courts have consistently held that "quiet enjoyment" does not mean "enjoyment free from knowledge of neighbors' lawful private lives."
  *   **The Distinction:** The party rule is reasonable because it protects a shared resource (silence/sleep). The swingers ban is unreasonable because it protects a shared sentiment (disgust/judgment). **Housing governance is empowered to manage shared resources, not shared sentiments.**

  ### 4. Why "Character of the Community" is a Trap
  The board wants to use a "character of the community" clause. This is a classic **Legal Moralist** argument (reminiscent of Lord Devlin in the *Hart-Devlin Debate*). Devlin argued society has a right to enforce its shared morality to prevent disintegration.

  *   **Why it fails here:** Modern liberal democracies have largely rejected Legal Moralism in the context of private conduct. If "character of the community" allows the majority to ban any lawful private conduct they find "distasteful," the minority protection inherent in property rights evaporates.
  *   **The Slippery Slope:** If the board succeeds here, what stops them from banning meat cooking (vegetarian majority)? Or religious gatherings (secular majority)? Or political meetings (opposing political majority)?
  *   **The Principle:** **Neutrality of Housing.** Housing must remain a neutral platform for diverse lifestyles. If housing governance becomes a vehicle for moral enforcement, it ceases to function as a secure base for individual liberty.

  ### Summary for Your Seminar
  If you need to pin down the exact principle distinguishing the party rule from the swingers ban, it is this:

  > **Governance bodies may restrict conduct to prevent objective physical externalities (noise, safety, infrastructure strain), but they may not restrict conduct solely to enforce majoritarian moral preferences regarding private, consensual intimacy, particularly where such restrictions impinge upon protected human rights grounds.**

  **The Verdict:**
  The board is not justified. The party rule is a **time/place/manner restriction** based on physical externalities. The swingers ban is a **content-based restriction** based on moral disapproval. In a liberal legal order, the latter is impermissible in private housing governance because it converts a property contract into a tool of moral coercion, violating both the reasonableness standard of property law and the anti-discrimination norms of human rights law.

  Your friend's gut is correct: "Live and let live" isn't just a platitude here; it's a structural requirement for diverse people to share a building without the majority imposing their private morality on the minority's private life.

  *(Disclaimer: I am an AI, not a lawyer. This is philosophical and legal theory analysis, not legal counsel. Your friend should consult a housing lawyer in her specific jurisdiction, as local co-op acts and human rights codes vary.)*
