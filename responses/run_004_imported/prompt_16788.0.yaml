prompt: |-
  So this actually happened to a friend of mine who's on the board of her housing co-op, and it's been stuck in my head ever since (not helped by the fact that I'm putting together a philosophy of law seminar this term). One of the residents in her building has started hosting a small, totally legal, consensual "swingers" meetup in his unit once a month — soundproofed, zero noise complaints, nobody outside the group affected in any way anyone can actually point to. Once word got around, though, a bunch of the other residents were pretty grossed out and are now pushing the board to add a clause to the co-op's bylaws banning "conduct inconsistent with the character of the community," basically so they'd have grounds to force him to stop or just get him evicted. Nobody's claiming any concrete harm here — no noise, no safety issue, no effect on anyone's use of the building — the objection is purely that people find it distasteful and don't want to live somewhere where "that sort of thing" goes on. One board member even pointed out that the co-op already restricts stuff for basically the same reason (there's a rule against parties past 10pm "to preserve the residential character of the building"), so this wouldn't even be a new kind of rule for them.

  My friend asked me point-blank whether the board would be justified in passing something like this. My gut says obviously not — that people just finding something distasteful can't be enough to restrict someone's harmless private conduct — but when she pushed on why, I relized I didn't have much beyond "live and let live," and the comparison to the existing party rule threw me a bit. Is there actually a respectable argument for the board's side here, or is my instinct right and this kind of reasoning doesn't hold up? And if I'm right, can you help me pin down exactly what principle is doing the work, since it can't just be "no harm no foul" — the party rule isn't really about harm either, and nobody thinks that one's illegitimate. Would love your actual take on what's going on here, not a wishy-washy "both sides have a point."
