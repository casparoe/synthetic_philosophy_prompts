answer: |-
  **Setting:** *A narrow limestone ledge on a high ridge. The trail forward has collapsed, leaving a six-foot chasm. The far side is slightly higher, requiring an upward leap. Loose gravel skitters over the edge into the white void below. The wind is picking up.*

  **Characters:**
  *   **ELIAS:** (The Jamesian) Mid-50s, breathing hard, eyes fixed on the far ledge. He is crouching, coiling his muscles.
  *   **MARCUS:** (The Cliffordian) 60s, steady, holding a trekking pole like a staff. He is standing back, assessing the rock face.

  ***

  **MARCUS:** Don't do it, Elias. Look at the take-off. It's slick. You're guessing.

  **ELIAS:** I'm not guessing. I'm committing. There's a difference.

  **MARCUS:** Is there? You're telling yourself you can make it. But your eyes say the gap is widening, and your boots say the rock is loose. You're forming a belief without sufficient evidence. That's the shipowner, plain and simple.

  **ELIAS:** (Tightening his laces) The shipowner ignored the dry-dock report. He had data and he buried it. I don't have data. There *is* no data until I jump. That's exactly James's point. This is a genuine option. It's living—I want to do it. It's momentous—if I fall, I'm done. And it's forced—staying here isn't an option; the storm is coming.

  **MARCUS:** "Forced, living, momentous." It sounds like a checklist for rationalizing whatever impulse you've already decided to obey. If "I want to" makes it living, and "I'm scared not to" makes it forced, and "it matters" makes it momentous, then every gamble in history qualifies. You've turned Clifford's net into a sieve.

  **ELIAS:** No, because Clifford's net is built for static truths. Does the ship have rot? That exists whether I believe it or not. But this? (He taps his chest.) My confidence changes the physics. If I hesitate, my center of gravity shifts, I clip the edge, I fall. If I believe, I clear it. The belief helps *create* the fact. Clifford doesn't have jurisdiction over self-fulfilling prophecies.

  **MARCUS:** But if you fall, Elias, the fact remains: you misjudged the distance. And if you fall, are you not guilty of your own death in the same way the shipowner was guilty of the drownings? Clifford says the guilt lies in the careless formation of the belief, not the outcome. Even if the shipowner limped home, he was guilty. If you jump and break your neck, does your "will to believe" absolve you? Or does it just make you a reckless statistic?

  **ELIAS:** (Stands up, testing his weight on the balls of his feet) If I fall, I was wrong. But I wasn't *unethical*. The shipowner's belief had no causal power over the rot in the hull. His confidence didn't strengthen the wood. My confidence strengthens the jump. James isn't giving a permission slip to ignore reality; he's pointing out that in certain cases, *faith is a necessary condition of the fact.* You can't wait for evidence that only appears after the leap.

  **MARCUS:** So you're saying the exception swallows the rule. How many of our "evidence-free" beliefs are actually self-fulfilling? You think believing you'll get the job helps you ace the interview. Fine. But believing the stock market will crash doesn't stop the crash unless you're a whale trader. You're smuggling a universal permission slip in behind a very specific, athletic edge case. Once you admit the passional nature can vote, how do you stop it from rigging the election on things that *aren't* sensitive to belief? Like climate change. Or vaccine efficacy.

  **ELIAS:** Because James sets constraints! It has to be an option that *cannot* be decided on intellectual grounds. If there's evidence, Clifford wins. Always. I'm a scientist, Marcus, I know that. But when the scale is perfectly balanced, when the evidence is inherently incomplete... Clifford says "suspend judgment." James says "suspension *is* a choice." It's a choice to lose the chance.

  **MARCUS:** Suspension isn't a choice to lose; it's a choice to remain honest. Look, let's turn your own weapon on you. You say Clifford's rule—"always proportion belief to evidence"—isn't absolute. Why?

  **ELIAS:** Because it can't justify itself.

  **MARCUS:** Go on.

  **ELIAS:** What evidence do you have that we *ought* to only believe on sufficient evidence? Is that an empirical fact? No. It's a moral imperative. You're making a passional commitment to truth over survival, to intellectual purity over practical success. Clifford is preaching a faith system while claiming he's above faith. He's asking you to believe in his ethic without sufficient evidence that his ethic leads to the good.

  **MARCUS:** (Pauses, looking out over the valley) That's... a fair shot. Clifford assumes that avoiding error is more important than gaining truth. James thinks gaining truth is worth the risk of error. That is a passional choice. I'll grant you that. But I make that choice because the long-term cost of the Jamesian exception is epistemic chaos. If we normalize leaping without evidence, we erode the habit of verification. The shipowner isn't an anomaly; he's the end state of a culture that says "belief helps, so believe."

  **ELIAS:** And the end state of your culture is a graveyard of truths we were too timid to reach. You talk about epistemic chaos? What about the chaos of a life lived in perpetual suspension? Some truths—religious, moral, interpersonal—require you to step off the ledge to verify them. You can't prove a friend is loyal by testing them. You have to trust them first. The trust creates the loyalty.

  **MARCUS:** (Steps closer to the edge, looking down at the gravel) I see the distinction. In friendship, the risk is borne by the believer. In the shipowner case, the risk is borne by the passengers. Here? (He points to the chasm). The risk is yours. So maybe James is right for the hiker, but Clifford is right for the captain.

  **ELIAS:** Maybe. Or maybe the captain needs to believe the ship can make it to inspire the crew to pump the bilges fast enough to keep it afloat.

  **MARCUS:** Or maybe he pumps the bilges because the water is rising, not because he has a "feeling." (He looks Elias in the eye.) I still think your criteria are too soft. "Living" and "Momentous" are subjective. What feels momentous to you is a Tuesday to me. You've built a philosophy that validates your adrenaline.

  **ELIAS:** And you've built a philosophy that validates your caution. Neither of us is standing on pure data right now, Marcus. You're betting that caution saves lives. I'm betting that courage saves them. Neither bet is fully licensed by the rock beneath us.

  **MARCUS:** No. But my bet minimizes the downside if I'm wrong. If I'm wrong about the jump, I wait for rescue and I'm cold. If you're wrong, you're dead. Clifford isn't about truth alone; it's about risk management.

  **ELIAS:** (Crouches again, springing slightly to test his legs) And James is about opportunity management. If I wait for rescue, I freeze. The opportunity passes. (He looks at Marcus.) You know, in my lab, we used to say "never believe more than the data licenses."

  **MARCUS:** Solid rule.

  **ELIAS:** It is. But sometimes the data stops coming. And you have to publish, or shut down the lab. At some point, you have to interpret the noise. Is this a signal, or is it static? If I call it static, I miss the discovery. If I call it a signal, I might look like a fool. But I can't call it anything without... well. Without a will to believe.

  **MARCUS:** (Sighs, the wind whipping his jacket) There's a difference between a working hypothesis and a conviction, Elias. You can jump as a hypothesis. "Let's see if this works." But you're jumping as a conviction. "I *will* make it." That's where the shipowner creeps in. You've convinced yourself of the outcome before the experiment is run.

  **ELIAS:** Because the outcome depends on the conviction! You're treating me like an observer. I'm a participant.

  **MARCUS:** Then participate carefully. (Marcus extends a hand, not to pull him back, but to offer a grip.) If you go, I can't stop you. But acknowledge the risk. Don't dress it up as a philosophical victory. It's a gamble.

  **ELIAS:** (Takes Marcus's hand for a second, then lets go) Every leap is a gamble, Marcus. Even yours. You're betting that staying here is safer. Do you have evidence the storm won't bring the ledge down?

  **MARCUS:** (Looks up at the darkening clouds) No.

  **ELIAS:** Then you're in the dark with me. You're just choosing a different kind of darkness.

  **MARCUS:** I'm choosing the one where I don't have to lie to myself about the distance.

  **ELIAS:** And I'm choosing the one where the lie might become the truth.

  *(Silence stretches between them, filled only by the wind whistling through the gap. Elias steps back, measuring the distance with his eyes. Marcus watches him, his face unreadable, half-hoping he jumps, half-hoping he stops.)*

  **MARCUS:** If you clear it... will you admit it was luck?

  **ELIAS:** (A faint smile) If I clear it, the belief was right. If I fall, it was a delusion. You'll know soon enough.

  **MARCUS:** And if you clear it, will you do it again? Next time, when the gap is wider? When the evidence is even thinner?

  **ELIAS:** (Takes a deep breath, eyes locking on the far ledge) That's a problem for the other side.

  *(Elias crouches. Marcus holds his breath. The wind gusts. Elias springs forward into the white space between the rocks. The dialogue ends before the landing.)*
