answer: |-
  This is a very strong start. You are definitely not walking into office hours with something "dumb." In fact, your grasp of the distinction between *intended means* and *foreseen side effects* is sharper than most undergraduates (and some graduates) manage on the first read.

  Here is the gut check you asked for, broken down by your two questions.

  ### 1. Is your representation of Anscombe's argument accurate?

  **Yes.** You have nailed the core distinction.

  Anscombe's objection is deontological, not consequentialist. She isn't arguing that the bombs were disproportionate (though she might think they were); she is arguing that the *description of the action* falls under the prohibition of murder.

  *   **The Double Effect Nuance:** You are correct that she blocks the Principle of Double Effect (PDE) move. For PDE to apply, the bad effect (civilian death) must not be the *means* to the good effect (ending the war). Anscombe argues that in the case of Hiroshima/Nagasaki (and area bombing generally), the suffering and death of civilians *was the mechanism* by which the war was ended (via breaking morale/will). Therefore, it was intended.
  *   **Potential Grader Nitpick:** The only place a grader might push back is if you imply PDE is commonly accepted as a valid excuse for "ordinary bombing." Anscombe was actually quite skeptical of Allied area bombing in WWII generally (e.g., Hamburg, Dresden). She views Truman not as an anomaly, but as the clearest, most undeniable instance of a corrupt principle that had already taken hold. If you frame it as "PDE usually excuses bombing, but not this," just be careful to acknowledge that Anscombe thinks PDE was being *misapplied* or abused in those other cases too.
  *   **Verdict:** Your summary is solid. You correctly identify that for Anscombe, "good outcomes" cannot cleanse an intrinsically evil intention.

  ### 2. Is the deterrence move a decent extension or a well-known objection?

  **It is a very decent extension, but it is not a new objection.**

  You have independently rediscovered one of the central debates in nuclear ethics from the 1980s. That is a good thing—it means you are thinking like a philosopher—but you cannot present it as a novel insight without risking looking like you haven't done the reading on the broader literature.

  *   **The Literature You're Looking For:** The "puzzle" you can't place is likely **Gregory Kavka**.
      *   Look up Kavka's **"The Paradox of Deterrence" (1984)** or his **"Toxin Puzzle."**
      *   Kavka argues exactly what you are hinting at: Deterrence seems to require forming a *conditional intention* to do something (mass slaughter) that it would be irrational/immoral to actually do if the condition were met.
      *   Also, look at **Michael Quinn** ("Actions, Intentions, and Consequences: The Doctrine of Double Effect"). He engages directly with Anscombe on whether *conditional intentions* to kill innocents corrupt the will in the same way actual killings do.
  *   **Anscombe's Stance:** Anscombe herself held the view you suspect: that forming the conditional intention to kill innocents (even in retaliation) is itself a corruption of the will. She would agree with your premise that the "bluff" doesn't save you, because a bluff doesn't deter, and a real intention is immoral.
  *   **How to Frame It:** Do not frame this as "I discovered a problem with deterrence." Frame it as: *"If Anscombe's critique of Truman rests on the corruption of the will via intention, consistency demands she (and we) condemn the intention inherent in deterrence policy, regardless of execution. This aligns with the 'Paradox of Deterrence' discussed by Kavka, but I want to focus specifically on the Anscombean moral psychology of it."*
  *   **Verdict:** It is the perfect way to end the paper, provided you acknowledge that this is a known extension of her view. It shows you understand the implications of her ethical framework beyond the specific historical case.

  ### Strategy for Office Hours

  Since you want to make the most of the meeting, here is how I would play it:

  1.  **Lead with the PDE distinction:** Ask the professor if they think your reading of her rejection of Double Effect is robust enough. (It is, but it shows you care about precision).
  2.  **Bring up the Deterrence angle honestly:** Say something like, *"I wanted to extend this to nuclear deterrence, because it seems like the same logic applies to conditional intentions. I know Kavka and others worked on the 'Paradox of Deterrence,' but I wanted to check if focusing on Anscombe's specific view on the corruption of the will is a fair application of her text, or if that's too much of a leap for a short paper."*
  3.  **Why this works:** It shows you've done the external research (knowing Kavka exists) but you are prioritizing the course material (Anscombe's specific moral psychology). Professors love that.

  **Bottom line:** The bones hold up completely. You've understood the text well, and your extension is philosophically sound, just historically established. Cite the deterrence debate, don't claim to invent it, and you'll have a very strong paper.
