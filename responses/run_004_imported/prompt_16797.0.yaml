prompt: |-
  So for my ethics of war seminar I've gotta write a short paper on Anscombe's pamphlet "Mr. Truman's Degree" -- the one where she goes after Oxford for giving Truman an honorary degree back in the 50s and basically accuses him of murder over Hiroshima and Nagasaki. My professor only mentioned it for like two minutes during a lecture on double effect but I went and read the thing and now I'm kind of obsessed, so I've drafted the main argument section plus an idea for where to take it next, and I want a gut check before I bring anything to office hours because I don't wanna walk in with something dumb.

  Here's my summary of her actual argument, roughly: she's not making some vague "war is bad" complaint or a proportionality argument. Her claim is that the bombs were dropped with the specific intention of killing masses of civilians as the means of ending the war -- breaking morale, forcing an unconditional surrender -- not as a foreseen-but-unwanted side effect of hitting some legitimate military target. That's supposedly why the standard double effect move that gets used to excuse civilian deaths in ordinary bombing campaigns doesn't apply here, you can't describe it as "we were aiming at the factory, the houses just happened to be close by." So on her view it's straightforwardly murder, and the fact that it plausibly shortened the war and saved soldiers' lives on net doesn't matter, because letting good projected outcomes license the intentional killing of innocents is exactly the kind of reasoning she spends her whole career arguing is corrupt.

  For the second half I wanna push this into nuclear deterrence, since I'm pretty sure she has a later essay ("War and Murder", maybe?) making a similar point about the intention behind deterrence itself, not just the act of actually nuking someone. My idea: if forming a genuine intention to slaughter civilians is itself the corrupting thing on her account, independent of whether the trigger ever gets pulled, doesn't that indict the whole logic of mutually-assured-destruction, since deterrence only works if the retaliatory intention is real and not bluffed? I've got this nagging feeling theres a whole seperate puzzle in the deterrence literature about exactly this, something about whether it's even rational to sincerely intend to do something you'd have every reason not to actually do if it came down to it, but I can't place who wrote it or how its supposed to bear on my point. Could you look this over and tell me (1) whether I'm actually representing Anscombe's argument right or flattening the double-effect bit in a way a grader would dock me for, and (2) whether the deterrence move is a decent extension or just a well-known objection I should be citing instead of presenting as my own thought? Not asking for a rewrite, just want to know if the bones hold up before I flesh out the rest.
