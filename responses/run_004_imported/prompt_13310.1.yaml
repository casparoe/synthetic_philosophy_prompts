answer: |-
  This is an exceptionally sharp reading of *On Certainty*. You have put your finger on the single most debated tension in the text. Many introductory summaries gloss over this because resolving it requires grappling with Wittgenstein's rejection of traditional foundationalism without falling into pure relativism.

  To answer your two questions directly: **No, the hinge and river-bed metaphors are not inconsistent,** but they describe different dimensions of the same phenomenon. And **yes, there is a principled basis for ranking your hinges over your brother-in-law's,** but it is not the basis you (or he) probably think it is.

  Here is a close reading of how those passages fit together and what they imply for your holiday argument.

  ### 1. The Tension: Fixed Hinges vs. Shifting River-Bed

  You are right that §341–343 suggests stability ("the hinges must stay put"), while §96–97 suggests flux ("the river-bed of thoughts may shift"). The key to reconciling them is distinguishing between the **synchronic** (at a single moment in time) and the **diachronic** (across historical time).

  **The Hinge (Synchronic Logic)**
  When Wittgenstein writes, "If I want the door to turn, the hinges must stay put" (§343), he is making a logical point about inquiry *right now*. For any specific language game of "testing," "verifying," or "doubting" to function, there must be a background of things taken for granted.
  *   If you doubt *everything* simultaneously, the concept of "doubt" loses its meaning. To doubt the accuracy of a thermometer, you must hold fast the existence of the thermometer, the concept of temperature, your own eyesight, etc.
  *   At any given moment $t$, a proposition functions as a hinge not because it is intrinsically true, but because it is **exempt from verification** within that specific inquiry. It is the scaffolding.

  **The River-Bed (Diachronic History)**
  When he writes about the river-bed in §96–97, he is making a historical point about how those scaffolding propositions change *over time*.
  *   "Fluid propositions hardened, and hard ones became fluid."
  *   Example: "The earth has existed for more than 100 years." For us, this is a hard rock in the river-bed. For a medieval peasant, the age of the earth might have been a fluid question determined by theology. For a future geologist, it might be fluid again based on new cosmological models.
  *   The "hardness" is not a property of the proposition itself (like "2+2=4"); it is a property of the **role** that proposition plays in our form of life at this moment.

  **The Synthesis**
  The metaphors are consistent if you view the river-bed as being made of hinges. At any specific moment, the bed *feels* solid (the hinges are fixed). But if you zoom out over centuries, you see the bed shifting.
  *   **§341:** Describes the *function* of certainty (it enables doubt).
  *   **§96:** Describes the *genealogy* of certainty (it evolves).

  So, there is no contradiction. Wittgenstein is saying: *We need fixed points to think, but which points are fixed is determined by history and practice, not by eternal logic.*

  ### 2. The Normative Question: Are Your Hinges "Better"?

  This is the harder pill to swallow. If hinges are just "what a community happens not to question," does that mean the Moon Landing denier is just playing a different language game, and you can't say he's wrong?

  Wittgenstein is often accused of relativism here, but a close reading of *On Certainty* suggests he offers a **coherentist and pragmatic** criterion for ranking hinges, rather than a foundationalist one. You can claim your hinges are epistemically superior, but not because you have "proof" and he doesn't.

  Here is the principled basis for saying your framework is better:

  #### A. Doubt Requires Grounds (The System Argument)
  Wittgenstein insists that doubt is not a default state; it requires justification just as much as belief does.
  > "A doubt without an end is not even a doubt." (§625)
  > "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty." (§115)

  For your brother-in-law to doubt the Moon Landing, he has to treat that proposition as "fluid." But to do so, he must treat *other* propositions as "hard." He has to hinge on the reliability of alternative conspiracy sources, the fallibility of mainstream photography, the motives of governments, etc.
  *   **Your position:** The Moon Landing is a hinge. It supports a vast network of other hard propositions (physics, engineering, Cold War history, telescope data).
  *   **His position:** The Moon Landing is fluid. To keep it fluid, he has to forcibly harden a bunch of *ad hoc* propositions (e.g., "NASA is perfectly capable of silencing thousands of whistleblowers").

  Wittgenstein would say your system is epistemically superior because **it requires less distortion of the rest of the river-bed.** Your hinges cohere with the massive bulk of empirical propositions we use to navigate the world (GPS, satellite imagery, material science). His hinges require him to carve out a special exception in the river-bed where normal rules of evidence don't apply. That isn't a different "equally valid" game; it's a malfunctioning one.

  #### B. Certainty is Shown in Action
  This is Wittgenstein's knockout punch against the skeptic. Certainty isn't a mental state; it's a behavioral one.
  > "My life consists in my being content to accept many things." (§344)
  > "At the foundation of well-founded belief lies belief that is not founded." (§253)

  Ask yourself: Does your brother-in-law live *as if* the Moon Landing was faked?
  *   Does he refuse to use technology derived from aerospace engineering?
  *   Does he treat astronauts as pariahs in social settings?
  *   Does he bet money on his theory?

  Usually, conspiracy theorists do not. They treat the Moon Landing as "fake" in conversation, but they treat it as "real" when they use GPS, trust weather satellites, or watch news broadcasts that rely on the same infrastructure.
  Wittgenstein would argue that **his actions betray his hinges.** He is verbally playing a game of doubt, but practically playing a game of acceptance. Your hinges are "better" because they align with your actions. There is no friction between your worldview and your life. His requires constant cognitive dissonance management.

  #### C. The "Inherited Background" (§94)
  > "I did not get my picture of the world by satisfying myself of its correctness... it is the inherited background against which I distinguish between true and false." (§94)

  Wittgenstein acknowledges that we don't *choose* our hinges rationally; we inherit them. However, we can evaluate them based on their **utility in the shared form of life.**
  The "Moon Landing Happened" hinge allows for successful prediction, technological application, and international cooperation. The "Moon Landing Fake" hinge yields no predictive power and requires the assumption of a perfect, leak-proof conspiracy (which contradicts our experience of how bureaucracies work).
  Therefore, your hinges are not "truer" in a God's-eye metaphysical sense, but they are **more rational within the human form of life.**

  ### 3. Why Evidence Didn't Move Him

  Understanding *On Certainty* explains exactly why your argument failed. You treated the Moon Landing as an **empirical proposition** (something to be proved with data). He treats it as a **hinge proposition** (something that defines what counts as data).

  *   **You:** "Here is a rock sample from the Moon." (You assume the hinge: *Science is reliable.*)
  *   **He:** "That rock could be planted." (He has made *Science is reliable* the fluid proposition, and *Government lies* the hard hinge.)

  When you showed him evidence, you were testing a fluid proposition in your game, but you were attacking a fixed hinge in his. As Wittgenstein says in §613:
  > "If someone asked me 'Do you know the earth existed 100 years ago?'... I should not say 'I know it', but 'I am not able to doubt it'."

  You cannot argue someone out of a hinge using evidence that *presumes* the hinge is false. To move his river-bed, you wouldn't need more photos; you would need a shift in his entire form of life (e.g., if he started working with engineers, or if a trusted figure in *his* community changed their mind).

  ### Summary

  1.  **Consistency:** The Hinge and River-Bed metaphors are consistent. Hinges are fixed *logically* at a moment in time so inquiry can happen; the River-Bed describes how those hinges shift *historically* over generations.
  2.  **Ranking:** Wittgenstein does not concede to "anything goes" relativism. You can rank hinges based on:
      *   **Coherence:** Which set of hinges requires fewer *ad hoc* distortions of the rest of the system? (Yours).
      *   **Action:** Which set of hinges aligns with how the person actually lives and acts? (Yours).
      *   **Predictive Success:** Which hinges allow for successful engagement with the world? (Yours).

  Your brother-in-law isn't just "wrong" about a fact; he is attempting to play a language game that is disconnected from the shared river-bed of modern empirical inquiry. Wittgenstein's lesson isn't that you should have won the argument with more evidence, but that you should recognize that **he is not currently participating in the same epistemic game as you.** He has hardened a different bed. And unfortunately, as Wittgenstein notes, you can't argue someone into a new form of life; they usually have to drift there, like the river moving the sand.
