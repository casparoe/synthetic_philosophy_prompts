answer: |-
  This is a delightful thought experiment, and given your background, you'll appreciate that the answer requires disentangling what Darwin actually wrote from the "Social Darwinist" or progressive-evolutionary baggage that was piled onto him later.

  If we sit Darwin down—fresh from the *Origin* and the *Descent of Man*—and explain the Fermi Paradox (the apparent contradiction between the high probability of habitable planets and the lack of contact), I believe he would lean significantly closer to **Gould's contingency** than Conway Morris's inevitability, though with a specific Darwinian nuance regarding the "Great Filter."

  Here is the reasoning, grounded in his specific texts and intellectual temperament.

  ### 1. Analogy vs. Homology: The Limit of Convergence
  You rightly point out that Darwin recognized "analogical resemblances" (convergence). In the *Origin*, he discusses how the placental wolf and the marsupial thylacine resemble each other due to similar habits. He understood that selection acts on function. If the physics of light are constant, the eye will converge. If aerodynamics are constant, wings will converge.

  However, Darwin drew a sharp line between *structural/functional* convergence and *historical* convergence. For Darwin, the "Tree of Life" was defined by **descent with modification**. The branching pattern was historical, not just functional.

  In *Descent of Man*, he argues that human intelligence evolved from specific social and ecological pressures facing primate ancestors (tool use, social cohesion, language). He never suggests these pressures are universal constants in the way that gravity or optics are. He views the human mind as a modification of the animal mind, shaped by specific ancestral constraints.

  If you asked him, "Would selection inevitably produce a radio-telescope-building mind?" he would likely ask, "Is there a universal niche for 'radio-telescope builder'?" He would probably conclude that while *problem-solving* is a convergent trait (like eyes), *technological civilization* is a specific historical pathway dependent on a cascade of prior contingencies (bipedalism, opposable thumbs, specific social structures). He would likely view intelligence as a local adaptation, not a universal attractor.

  ### 2. The Principle of Divergence
  This is perhaps the strongest argument against the Conway Morris position coming from Darwin himself. A core pillar of the *Origin* is the **Principle of Divergence**. Darwin argued that species succeed not by becoming the same, but by becoming *different* to exploit different niches.

  "Natural selection," he wrote, "tends... to diverge the characters of the offspring from those of the parent."

  If the galaxy is full of life, Darwin would expect it to be full of *divergent* life. To assume that alien life would converge on "human-like intelligence" is to assume that there is only one optimal peak on the adaptive landscape for high-level cognition. Darwin was deeply skeptical of "perfection." He viewed organisms as merely "good enough" to survive their specific conditions.

  He would likely argue that if intelligence arises elsewhere, it would diverge so radically from human intelligence (different sensory inputs, different social structures, different mediums of communication) that we might not even recognize it as "intelligence" in the way we define it. The Fermi Paradox assumes we are looking for *us*. Darwin would suggest we are looking for a twig that grew in a very specific, unlikely direction.

  ### 3. Anti-Teleology and the "Scale of Nature"
  Darwin spent his career dismantling the *Scala Naturae* (the Great Chain of Being). He fought against the idea that evolution has a direction or a goal, specifically the goal of producing Man.

  Conway Morris's argument often carries a whisper of teleology: that complexity and intelligence are somehow "destined" to emerge because they are "better." Darwin would be wary of this. In his correspondence (specifically regarding the "higher" vs. "lower" organisms), he cautioned that a "lower" organism (like a parasite or an insect) is often more perfectly adapted to its environment than a "higher" one.

  If you explained the Fermi Paradox to him, he would likely reject the premise that the silence is *paradoxical*. The silence is exactly what you expect if evolution has no drive toward technology. If intelligence is just one of many survival strategies (like camouflage or shell-hardening), and a very costly one at that (large brains require immense energy and slow reproduction), then it should be rare.

  He would likely side with Gould: Replay the tape, and you get bacteria and insects again. You might get eyes. You probably don't get Hominids.

  ### 4. The Great Filter: Extinction is the Rule
  Regarding the "Great Filter," Darwin's temperament was deeply attuned to the **Struggle for Existence** and the reality of **Extinction**. In the *Origin*, he notes that the vast majority of species that have ever lived are extinct. He viewed extinction not as an anomaly, but as the natural consequence of competition and environmental change.

  If he were to locate a filter, he would likely place it in two spots:

  1.  **Behind us (The Rarity of the Path):** Because of the Principle of Divergence and the lack of teleology, the specific chain of events leading to *technological* capability is a narrow, contingent path. Most life stays microbial or simple multicellular because that is a stable, successful strategy.
  2.  **Ahead of us (The Instability of Success):** Darwin was acutely aware that dominance is temporary. In *Descent of Man*, he worries about the moral and biological future of humanity. He understood that high intelligence brings new vulnerabilities (dependence on complex social structures, resource depletion).

  He would likely view the "silence" of the galaxy not as evidence that life is rare, but as evidence that *civilizations* are transient. If selection is a tinkerer, not an engineer, then technological societies might be evolutionary "dead ends" that burn out quickly, leaving no fossil record detectable across light-years.

  ### 5. Darwin's Temperament: Caution over Certainty
  Finally, we must consider the man. Darwin was notoriously cautious. He rarely made absolute claims without hedging ("I see no good reason why...", "It is probable that...").

  Conway Morris's certainty about convergence often frustrates biologists because it can gloss over the developmental constraints that prevent convergence. Gould's contingency can sometimes feel too nihilistic. Darwin sat in the middle: **Selection is powerful and predictable regarding function, but history is messy and unpredictable regarding lineage.**

  If you asked him, "Are we alone?" he would likely say:
  *"We cannot know. But given that my theory explains the diversity of life on this single planet without invoking a drive toward man, I see no necessity to assume that the conditions on other planets must inevitably reproduce the specific mental faculties of a 19th-century English naturalist."*

  ### The Verdict
  Darwin would likely resolve the Fermi Paradox by dissolving the expectation of convergence.

  *   **On Convergence:** He would agree that *basic* solutions (photosynthesis, motility, vision) are likely common (Conway Morris).
  *   **On Intelligence:** He would argue that *human-level technological intelligence* is a highly specific, contingent divergence (Gould).
  *   **On the Filter:** He would suggest the filter is the **Principle of Divergence** itself. Life diversifies away from complexity as often as toward it. The "human niche" is not a universal vacuum waiting to be filled; it is a narrow, historical accident.

  He would probably find the Fermi Paradox less puzzling than we do. To a mind that spent 20 years cataloging barnacles to understand how variation works, the idea that the universe is teeming with life that *doesn't* look or think like us would not be a paradox. It would be the expected outcome of natural selection.
