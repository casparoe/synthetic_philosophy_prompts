  hey so for my metaphysics seminar (we just wrapped the powers/dispositions unit) our prof invited a guest speaker for a q&a next week and volunteered me to draft the questions lol. the guest defends the view that finks and masks basically sink the whole conditional-analysis project for dispositions -- not even lewis's patched-up 'reformed' version survives the antidote/masking cases -- so shes arguing powers have to be taken as primitive instead (dispositional essentialism, at least for fundamental physical properties). can you write me like 8-9 questions that get past her just repeating 'CA's dead, powers are basic'? specifically i want one question that makes her say concretely how a primitivist tells a masked disposition apart from one that's just plain gone, since she can't lean on 'the conditional would've held but for interference' without basically sneaking a conditional analysis back in the side door; one on whether 'it has the power because powers are basic' actually explains anything or is just the dormitive-virtue move in a lab coat; and one on how her primitivism is supposed to relate to vetter-style potentiality, where dispositions come in degrees and don't need a fixed stimulus at all. give each of those a quick follow-up keyed to whatever dodge she'll probably reach for first, and end with a question on what would actually count as evidence against her view.
