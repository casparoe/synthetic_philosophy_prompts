answer: |-
  Here are 9 questions tailored for your seminar Q&A. They are designed to be respectful but rigorous, pushing past the standard "CA is dead, long live powers" slogan.

  I have structured the three specific questions you requested (Masking, Dormitive Virtue, Vetter) with a **Follow-Up** section, as asked. The remaining questions fill out the set to 9, ending with the falsification question.

  ### 1. The Masking vs. Loss Distinction (Individuation)
  "You argue that finks and masks refute the Conditional Analysis, forcing us to treat powers as primitive. But if we abandon conditionals, we lose the standard tool for distinguishing a *masked* disposition from a *lost* disposition. If a glass is wrapped in padding and doesn't break when struck, you say the fragility is still there but masked. But if the glass were actually hardened, the fragility would be gone. Observationally, both look identical: no breaking. Without leaning on the counterfactual 'it *would* have broken if the mask were removed,' what positive metaphysical criterion allows the primitivist to individuate a masked power from a power that has ceased to exist?"

  *   **Follow-Up (If she appeals to 'intrinsic nature' or 'essence'):** "I see, so the distinction lies in the intrinsic categorical base or the essence of the object. But if we cannot cash out that essence in terms of what the object *would do* under various conditions (which is just a conditional analysis in disguise), how do we have epistemic access to that essence? Are we positing a metaphysical difference that is in principle undetectable?"

  ### 2. Explanatory Power vs. Dormitive Virtue
  " Critics often charge that dispositional essentialism risks a 'dormitive virtue' explanation: saying 'opium causes sleep because it has a sleep-inducing power' looks suspiciously like labeling the phenomenon rather than explaining it. If powers are primitive, they aren't reducible to anything else. So, when you say a power *explains* a manifestation, are you offering a genuine metaphysical explanation, or are you simply asserting that there is a brute necessary connection? In other words, does primitivism stop the explanatory regress, or does it just name it?"

  *   **Follow-Up (If she says 'It's a sui generis form of explanation'):** "If it's *sui generis*, how do we distinguish a successful power explanation from a failed one? If the power is primitive and necessarily linked to its manifestation, could we not posit a 'dormitive power' for any regularity we observe? What constrains the positing of powers so that it doesn't become an 'anything goes' ontology?"

  ### 3. Relation to Vetter-Style Potentiality
  "Barbara Vetter's account of potentiality suggests dispositions come in degrees and don't always require a specific stimulus-manifestation pair. However, traditional Dispositional Essentialism (like Bird or Ellis) often treats powers as relations to specific manifestations. If you defend powers as primitive, do you commit to the view that every fundamental power must have a fixed manifestation type? If so, how do you account for the gradability of dispositions we see in macro-objects without reducing them to conditionals?"

  *   **Follow-Up (If she says 'Fundamental powers are specific, macro powers are vague'):** "That suggests a metaphysical discontinuity between the fundamental and the derived. If macro-dispositions are just aggregates of fundamental powers, how do degrees of potentiality emerge from all-or-nothing fundamental relations? Does the 'degree' come from the arrangement of the powers, and if so, doesn't that reintroduce a structural/conditional element you're trying to avoid?"

  ### 4. The Failure of Lewis's 'Reformed' Analysis
  "You mentioned that even Lewis's 'reformed' conditional analysis fails against antidote cases. Lewis tried to save CA by appealing to the intrinsic nature of the object holding fixed. Why is that move insufficient? Is your objection that 'intrinsic nature' itself cannot be specified without reference to dispositions, or is it that the conditional still fails to capture the *necessity* of the connection even if the truth conditions are met?"

  ### 5. Pure Powers vs. Mixed Ontology
  "If fundamental physical properties are essentially dispositional, does your view commit you to a 'Pure Powers' ontology where there are no categorical properties at all? If there are no categorical properties to ground the identity of the powers, do you face the worry that powers are just relations waiting for relata that don't exist? How do you secure the ontological independence of the power itself?"

  ### 6. The Source of Modal Force
  "Dispositional essentialism implies that the laws of nature are metaphysically necessary. Where does this necessity come from? Is it that the identity of the property *is* the necessity, or is there a further fact about why a power *must* manifest in the presence of its stimulus? I'm trying to understand if the modality is internal to the property or if it's a brute fact about the world."

  ### 7. Probabilistic Manifestations (Quantum Mechanics)
  "Modern physics suggests that at the fundamental level, many outcomes are probabilistic rather than deterministic. How does your primitivist account handle probabilistic powers? Does a power have a 'tendency' to manifest, and if so, is that tendency itself a further primitive property? I'm worried this might lead to an inflation of properties (a power to manifest, plus a power to manifest-with-probability-X)."

  ### 8. Epistemic Access to Primitives
  "If powers are irreducible primitives, our standard method of identifying them through observation of regularities seems to rely on the very conditionals you reject. How does the primitivist describe the epistemology of powers? Do we infer powers as the best explanation for regularities (abduction), or do we have some more direct access to them? If it's abduction, doesn't that make the existence of powers contingent on our best theories rather than metaphysically necessary?"

  ### 9. Falsification and Evidence (The Closer)
  "Finally, I want to ask about the empirical vulnerability of your view. If powers are primitive and not reducible to conditional regularities, what would count as evidence *against* Dispositional Essentialism? If we observed a world that looked exactly like ours but lacked primitive powers (a Humean world), would it be observationally indistinguishable? If there is no possible evidence that could falsify the existence of primitive powers, are we risking a view that is metaphysically robust but scientifically idle?"
