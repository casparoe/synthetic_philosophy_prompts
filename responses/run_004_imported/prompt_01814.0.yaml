      *   *Is this "irrational"?* No, it's rational if social standing is valued.
      *   *What if the friend argues "Preferences should be stable"?* Preferences over *outcomes* might be stable (I like more pizza), but preferences over *actions* depend on consequences.
      *   *Make sure to distinguish between "preferences" and "choices".* Choices reveal preferences only if the context is controlled.

  9.  **Final Polish:** Organize into clear sections. (1) You are right. (2) The "Same Options" fallacy. (3) The Social Cost. (4) Amartya Sen's insight. (5) Conclusion. (This matches the structure of the final output).

