answer: |-
  Your intuition is correct, and your friend is applying a very introductory, perhaps overly simplistic, model of rational choice theory. In economics and philosophy, this is a classic problem regarding how we define "options" and "preferences."

  You were not being irrational. Your friend is missing the fact that **the context changed the nature of the options themselves.**

  Here is how you can explain to your friend why your behavior was perfectly rational, using the very economic concepts they are studying.

  ### 1. The Options Were Not the Same
  Your friend's argument rests on the assumption that you faced the same choice twice: *Big Slice vs. Small Slice.*

  However, in economics, an "option" includes all the consequences attached to it.
  *   **Scenario A (Family Gathering):** The choice was not just about pizza. It was **[Big Slice + Social Cost of Looking Greedy]** vs. **[Small Slice + Social Benefit of Being Polite]**.
  *   **Scenario B (Alone in Kitchen):** The choice was **[Big Slice + No Social Cost]** vs. **[Small Slice + No Social Benefit]**.

  Because the "social cost" variable was present in the first scenario and absent in the second, you were not facing the same choice. A rational actor *should* change their decision when the costs and benefits change. If the price of a car drops, you might buy it; if the price is high, you don't. That isn't inconsistency; it's responsiveness to incentives. In the first scenario, the "price" of the big slice was high (reputation damage). In the second, the price was low.

  ### 2. Utility Includes More Than Calories
  Standard rational choice theory assumes people maximize **utility**. Your friend seems to think utility comes only from the physical consumption of the pizza (taste, fullness).

  However, human utility functions are complex. They include:
  *   Physical satisfaction (hunger/taste).
  *   Psychological satisfaction (pride, lack of guilt).
  *   Social capital (reputation, relationships).

  In the first scenario, you maximized your total utility by sacrificing some physical satisfaction (less pizza) to gain social capital (looking generous). In the second scenario, with no social capital to be gained, you maximized utility by taking the physical satisfaction. Your underlying preference (maximizing total well-being) was consistent; only the inputs changed.

  ### 3. The Amartya Sen Critique
  Your friend might appeal to "Revealed Preference Theory," which suggests that we can't know what you want; we can only look at what you choose. If you choose differently, the theory says your preferences must have changed.

  The Nobel Prize-winning economist **Amartya Sen** famously critiqued this narrow view. He used examples very similar to yours (often involving a guest taking the last apple from a bowl). Sen argued that rationality isn't just about internal consistency; it's about having **reasons** for your choices that make sense within a social framework.

  Sen pointed out that if we define "options" too narrowly (ignoring social norms), we label polite behavior as "irrational." He argued that a rational person considers the *implications* of an act, not just the physical act itself. Choosing the small slice to be polite is a rational calculation of social norms, not a violation of economic logic.

  ### 4. Signaling Theory
  From a game theory perspective, your first choice was a **signal**. By taking the smaller slice, you were signaling to your family that you value their comfort over your own immediate gratification. This maintains group harmony and your standing within the family.

  Signaling is only necessary when there is an audience. When the audience left, the need to signal disappeared. Changing your behavior when the audience leaves doesn't mean you are inconsistent; it means you understand when signaling is required and when it is not.

  ### Summary for Your Friend
  You can tell your friend that they are committing a **ceteris paribus** error. Economic models assume "all other things being equal." But all other things were *not* equal.

  *   **Time 1:** Big Slice + Audience = High Cost.
  *   **Time 2:** Big Slice + No Audience = Low Cost.

  You didn't change your mind about pizza; the "price" of the pizza changed. Paying a lower price when the audience leaves is the most rational thing in the world.
