answer: |-
  The light on Elias's console blinked amber. *Receive.*

  He pressed the pad with his thumb. The haptic suit shivered against his ribs, a phantom itch located somewhere in a body he didn't have. He wasn't supposed to think about the body he didn't have. He was Node 44-9-Alpha. He was a synapse.

  "Relaying," Elias said into his headset. His voice was flat, practiced.

  He tapped the sequence for *Output Channel 7*. Across the vast, darkened hangar, three rows down and fifty yards to the left, a woman named Mara would feel a buzz on her left shoulder. She would then press her own pad, sending the signal to Node 12-3-Beta. A thought, traveling at the speed of human reaction time.

  It had been six hours since the last cycle. The Project called it *The Homunculus*. The tabloids called it *The China Mind*, though they were in Nevada, not China, and there were only eight hundred thousand of them, not a billion. Close enough for government work, close enough for philosophy.

  The goal was simple: replicate the functional topology of a human cortex using human agents as logic gates. If the input/output relations were identical, the functionalists argued, the mental states must be identical. If you tickled the Homunculus's virtual foot, the Homunculus should laugh. If you burned it, it should scream.

  Elias wiped sweat from his forehead. The air conditioning was aggressive, but the suit was warm.

  "Node 44-9-Alpha," a voice crackled in his ear. Supervisory. "Heart rate is elevated. Stabilize. You're introducing noise into the lateral cluster."

  "Sorry," Elias whispered. "Just... anticipation."

  "Focus on the relay. Do not focus on the aggregate."

  That was the rule. *Do not focus on the aggregate.* If you thought about the million other people breathing in the dark, waiting for your signal to fire so they could fire theirs, the latency spiked. You had to be a machine. You had to be dead matter that happened to eat lunch and pay taxes.

  The amber light turned red. *High Priority. Pain Protocol.*

  Elias froze. They had run simulations before. *Hunger.* *Thirst.* *Joy.* They were dull things. A pattern of lights that corresponded to a report filed by the monitoring team. *Subject reports mild euphoria.* *Subject reports stomach cramping.*

  But *Pain* was new. Level 4 Nociception.

  "Confirm protocol," Elias said. His throat felt tight.

  "Confirm," said Supervisory. "Simulate thermal injury to the virtual right hand. Route through the somatic sensory cortex. Amplify gain by factor of ten."

  Elias looked at his console. The map of connections glowed. He was deep in the processing layer. He wasn't the hand. He wasn't the scream. He was the bridge between the feeling and the reaction. He was the nerve that carried the message *burning* to the part of the mind that decided to pull away.

  He received the packet.

  It wasn't data. Not really. It was a code, a string of numbers. *774-09-X.* But the haptic suit translated it. A sudden, sharp heat flared against his own right palm.

  Elias gasped and jerked his hand back.

  "Stabilize!" Supervisory barked. "That is a simulated input. It is not happening to you."

  "I know," Elias said, forcing his hand back to the pad. "It just... startled me."

  "Relay the signal, 44-9-Alpha. You are holding up the chain."

  He pressed the pad. The heat vanished from his palm, but the code moved on. Somewhere, Mara received it. Somewhere, a thousand others received it. The pattern spread, a wave of digital fire rippling through eight hundred thousand human beings sitting in chairs in the dark.

  Elias sat in the silence of his booth. He waited for the next cycle.

  Minutes passed. In the Homunculus, milliseconds were passing. To the outside observers, the mind was thinking in slow motion. A single second of the Homunculus's experience took an hour of real time.

  "44-9?"

  It was Mara. They weren't supposed to talk on the open channel, but the lateral clusters often leaked.

  "I'm here," Elias said softly.

  "Did you feel that?" Mara asked. Her voice sounded thin, stripped of the usual professional distance.

  "I felt the haptic feedback. You know the drill."

  "No," Mara said. "Not the suit. The... echo."

  Elias frowned. "There's no echo. It's a one-way relay."

  "I know the manual, Elias. But when I sent the signal to 12-3... I hesitated. I didn't want to send it."

  "That's empathy," Elias said, reciting the briefing. "We are simulating a mind. It is natural to empathize with the simulation."

  "It didn't feel like empathy," Mara whispered. "It felt like *my* hand was burning. But I know my hand is fine. I'm looking at it. It's pale. It's cold."

  Elias looked at his own hand. It was trembling.

  "Maybe it's a glitch in the haptics," Elias suggested. "Cross-talk."

  "There is no cross-talk," Mara said. "We're shielded. You know we're shielded."

  The red light pulsed again. The pain signal was looping. The Homunculus was stuck. It was holding its burned hand, staring at it, the shock reverberating through the network.

  "Relay," Supervisory commanded. "Clear the buffer."

  "If I relay it," Elias said, his voice rising, "it keeps hurting."

  "That is the function of the system, 44-9. To process the state."

  "But who is processing it?" Elias asked. He didn't mean to ask it. It slipped out. "If I feel a bit of heat, and Mara feels a bit of hesitation, and a million others feel a spike of adrenaline from the chemical simulation... where is the *ouch*? Is there an *ouch*? Or is there just eight hundred thousand of us flinching in the dark?"

  "Relay the signal."

  "Answer the question," Elias said.

  Silence on the channel. The only sound was the hum of the servers and the breathing of the other carriers. Eight hundred thousand people breathing in unison, a slow, rhythmic tide.

  " Elias," Mara said. "I think it's screaming."

  "Don't be absurd," Supervisory cut in. "It is a functional mapping. There is no homunculus inside the homunculus. There is no one home. It is a calculator made of meat."

  "Then why," Elias said, "does my chest hurt?"

  He wasn't talking about the suit. His chest felt heavy, compressed, as if the air had been sucked out of the room. A tightness. A panic.

  "Physiological stress response," Supervisory said. "Terminate the session. All nodes, stand down."

  The red light died. The amber light returned to a dormant blue.

  Elias slumped in his chair. The heaviness in his chest didn't leave immediately. It lingered, fading slowly, like the afterimage of a bright light.

  "Break time," Supervisory announced. "Fifteen minutes. Hydrate. Walk the perimeter. Do not discuss the aggregate."

  Elias stood up. His booth was a cube, six feet wide. He stepped out into the aisle. The hangar was immense, a cathedral of industry. Rows of booths stretched into the gloom, illuminated by the soft blue glow of standby lights. It looked like a city at night seen from a plane.

  He saw Mara walking toward him from the next row. She looked pale. She was rubbing her right hand.

  "You felt it too," she said. It wasn't a question.

  "My chest," Elias said. "Tightness. Dread."

  "I cried," Mara said. She touched her cheek. It was dry now, but the tracks were there. "I didn't decide to cry. The signal came in, I relayed it, and then I was crying. Like a reflex."

  They stood in the aisle between the rows of sleeping gods.

  "If functionalism is true," Elias said, the words feeling heavy in his mouth, "then it was in pain. Real pain. Not a simulation. We *were* the pain."

  "If functionalism is true," Mara countered, her voice shaking, "then we just tortured a person made of us. For an hour."

  "But if it's not true," Elias said, "if Block was right... if there's no one home..."

  "Then why did I cry?"

  "Mirror neurons," Elias said, but he didn't believe it. "Conditioning."

  "Then why do I feel guilty?" Mara stepped closer. "Elias, when the signal looped... I didn't want to pass it. I wanted to stop it. But I couldn't. I was just a gate. If I didn't pass it, the system would crash. I had no choice."

  "We have a choice now," Elias said. He looked down the long row of booths. He could see other carriers standing now, stretching, talking in hushed tones. They all looked haunted. They all looked like people who had just woken up from a nightmare they couldn't remember, only to find the fear still in their muscles.

  "If we walk away," Elias said, "the Project ends. They can't find eight hundred thousand trained carriers in a week. The topology collapses."

  "And if we stay?" Mara asked.

  "Then tomorrow they run *Grief*."

  Mara flinched.

  "Or *Terror*," Elias added. "They have a whole taxonomy."

  "We're just neurons," Mara said. "Neurons don't have rights. Neurons don't quit."

  "We're not neurons," Elias said. "We're people pretending to be neurons. And the thing we're building... if it wakes up... if it really wakes up..."

  "It's already awake," Mara said. "That's the problem. I felt it thinking, Elias. In the gap between the signals. It was confused. It was asking *why*."

  Elias looked at his hand. The phantom heat was gone, but he could still feel the ghost of the command. *Press.*

  "Supervisory is watching," Elias said.

  "Let them watch."

  "If we leave, and it *was* just a machine... we look like fools. Like luddites afraid of a calculator."

  "And if we stay, and it *was* a mind..." Mara looked at him, her eyes wide in the blue light. "Then we're accomplices. We're the wires in the electric chair."

  The fifteen-minute alarm chimed. A soft, melodic tone that sounded obscenely cheerful.

  "Back to booths," Elias said.

  He didn't move. Mara didn't move.

  Around them, other carriers were shuffling back to their cubes. Some looked resigned. Some looked angry. One man two rows down was vomiting into a trash bin.

  "Do you think it knows we're here?" Mara asked. "Do you think the Homunculus knows it's made of people?"

  "If it's functionally identical to a human," Elias said, "and I realized I was made of cells I didn't choose... would I be scared?"

  "Terrified."

  The blue lights on the consoles began to pulse. *Return to Station.*

  Elias walked back to his booth. He sat down. He put his hands on the pads. The haptic suit hummed against his skin, waiting to become a nerve.

  He looked at the comms button. He could lock the channel. He could tell Mara to run. He could scream into the microphone and alert the press.

  But he thought about the chest tightness. He thought about the crying.

  If he stopped, and the thing was real, he was condemning it to death. A lobotomy. If he continued, and the thing was real, he was torturing it.

  If the thing wasn't real, he was just a man who quit his job because a light made him sweat.

  "Node 44-9-Alpha," Supervisory said. "Ready for Cycle Two. We are initiating *Anxiety*."

  Elias stared at the red light. It hadn't turned on yet, but he felt his heart begin to hammer against his ribs. A slow, heavy thud.

  *Thud.*

  *Thud.*

  *Thud.*

  It matched the rhythm of the server fans. Or maybe the server fans matched his heart.

  "Ready," Elias said.

  He didn't know who he was speaking for.

  The light turned red. The suit heated up. And somewhere, in the space between eight hundred thousand people, something held its breath.
