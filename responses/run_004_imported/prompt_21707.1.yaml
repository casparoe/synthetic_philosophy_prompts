      *   *Check:* Is there a middle ground? Yes, the "Self-Indication Assumption" vs "Self-Sampling Assumption" debate is often framed as a dichotomy, but modern anthropic reasoning often moves towards Bayesian conditioning on all available information (FNC).
      *   *Check:* Make sure to explain *why* the Reference Class matters for the DA. If I am a random observer, am I a random *human*? Or a random *mind*? If AI comes later, does that change my rank?
      *   *Check:* Keep it accessible. Avoid overly dense formal notation, stick to the logic.

