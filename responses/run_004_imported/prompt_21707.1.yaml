answer: |-
  You were right to feel like Jake was moving too fast. His chain of reasoning contains two significant logical gaps. While his premise about the Presumptuous Philosopher is a standard objection to SIA, his conclusion that this automatically validates the Doomsday Argument (via SSA) is a classic false dichotomy.

  Here is the breakdown of where Jake's logic holds and where it falls apart, structured so you can take it back to him.

  ### 1. The Presumptuous Philosopher and SIA (Jake is mostly right here)
  Jake is correct that the **Presumptuous Philosopher (PP)** is the strongest argument against the **Self-Indication Assumption (SIA)**.

  *   **The Setup:** Physics gives us two theories. Theory A says the universe has 1 trillion observers. Theory B says it has 1 trillion trillion observers. Physics says they are equally likely.
  *   **The SIA Move:** SIA says you should reason as if you are a random observer from the set of *possible* observers. You are much more likely to exist in Theory B. Therefore, without looking through a telescope, you should bet a trillion-to-one that Theory B is true.
  *   **The Absurdity:** As Jake noted, this implies armchair philosophy can override empirical physics. Most anthropic reasoning scholars (including Nick Bostrom, who coined the example) agree that *unrestricted* SIA leads to this absurdity.

  **Verdict:** You can concede this point to Jake. SIA, in its strongest form, is widely considered problematic because of the Presumptuous Philosopher.

  ### 2. Gap #1: "If SIA is broken, SSA is the default" (Jake is wrong here)
  This is the first major logical leap. Jake is treating SIA and **Self-Sampling Assumption (SSA)** as the only two options in existence. They are not.

  *   **The False Dichotomy:** Rejecting SIA does not automatically make SSA true. It just means SIA is false. There are other frameworks for anthropic reasoning.
  *   **Alternative Frameworks:** Many philosophers and physicists now favor approaches like **Full Non-indexical Conditioning (FNC)**. This approach suggests you should condition on *all* your evidence (including the fact that you exist and have your specific memories) without needing a special "sampling assumption" like SSA or SIA.
  *   **The Consequence:** If you use FNC or standard Bayesian conditioning, the Doomsday Argument often dissolves entirely, *even if you reject SIA*. You don't have to "default" to SSA just because SIA is broken.

  **The Counter-Argument:** "Jake, saying 'SIA is wrong so SSA must be right' is like saying 'Kant's ethics have flaws, so we must default to Utilitarianism.' There are other options. Rejecting SIA doesn't force us into the Doomsday Argument; it just forces us to find a better anthropic theory, many of which do not yield Doomsday."

  ### 3. Gap #2: "If SSA holds, the Doomsday Argument holds" (Jake is skipping the Reference Class problem)
  This is the specific intuition you had about "reference classes." Even if we grant Jake SSA for the sake of argument, the Doomsday Argument (DA) does not automatically follow. The DA is entirely dependent on how you define the **Reference Class**.

  *   **How SSA Works:** SSA says you should reason as if you are a random sample from a specific group (the reference class).
  *   **The Doomsday Math:** The DA works only if your reference class is "all humans who will ever live." If you are the 60 billionth human, and you are a random sample, the total number of humans is likely not much higher than 120 billion. Doom soon.
  *   **The Reference Class Problem:** What defines the class?
      *   **Too Broad:** If the class is "all sentient observers," and future AI or aliens outnumber humans 1,000,000 to 1, then being human *now* is incredibly rare. This actually suggests a long future (because most observers are in the future), undermining Doomsday.
      *   **Too Narrow:** If the class is "humans born in the 20th century," the math tells you nothing about the 30th century.
      *   **The "Mind" Problem:** If future humans upload their brains and live for 10,000 years each, do they count as one observer or 10,000? SSA gives different answers depending on how you count "observers."

  **The Counter-Argument:** "Even if we accept SSA, the Doomsday Argument fails if we can't objectively define the reference class. Since there is no consensus on whether 'observers' means biological humans, conscious moments, or something else, the Doomsday conclusion is unstable. You can't get a hard 'Doom Soon' probability out of a variable input."

  ### 4. Bonus Ammo: SSA has its own "Presumptuous Philosopher"
  If Jake insists that SSA is the only alternative, point out that SSA leads to its own absurdities, specifically the **Adam & Eve Problem**.

  *   **The Scenario:** Adam (the first human) wants to avoid a painful task. He reasons via SSA: "If I perform this task, there will be billions of descendants. If I refuse, there will be none. Since I am a random sample from all humans, it is astronomically more likely that I exist in a world with no descendants. Therefore, I can safely refuse the task; the world will likely end with me."
  *   **The Absurdity:** SSA implies Adam can influence the probability of conception/births merely by his intentions. This is "psychic powers via statistics."
  *   **The Point:** If Jake rejects SIA because it allows philosophy to override physics, he must also reject SSA because it allows psychology to override biology.

  ### Summary for Your Rebuttal
  Here is the script to settle the bet:

  1.  **Concede the Presumptuous Philosopher:** "Okay, you're right. The Presumptuous Philosopher shows that unrestricted SIA is untenable. Philosophy shouldn't override empirical physics."
  2.  **Attack the Default:** "However, rejecting SIA does not mean we default to SSA. That is a false dichotomy. There are other Bayesian approaches (like FNC) that reject SIA *without* accepting the Doomsday Argument."
  3.  **Attack the Reference Class:** "Furthermore, even if we use SSA, the Doomsday Argument relies on an undefined reference class. Unless you can prove objectively that the reference class is 'biological humans only' and not 'all conscious minds,' the Doomsday math doesn't work."
  4.  **The Checkmate:** "Finally, SSA leads to the Adam & Eve paradox, where people can statistically will their ancestors into existence. If you reject SIA for being presumptuous, you have to reject SSA for being magical."

  **The Verdict:** Jake won the battle (SIA is problematic) but lost the war (this does not prove the Doomsday Argument). Your gut feeling about the "skipped step" was correct.
