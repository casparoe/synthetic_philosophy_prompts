answer: |-
  The basil plant is dead. You say it died because the housesitter didn't water it. Your friend says an absence cannot be a cause because absences are not "real things." This debate strikes at the heart of metaphysics: is causation purely physical, or is it something broader? After weighing the options, the verdict is clear: **omissions are genuine causes.** Your friend's metaphysical purity comes at too high a cost, but your intuition needs a sharper theoretical framework to handle the "mailman" objection.

  Your friend's argument relies on a "process theory" of causation, which holds that causation requires a physical transfer of energy or momentum. Since "not watering" transfers no energy, it cannot be a cause. This view is tidy but fails to capture how the world actually works. Causation is not just about collisions; it is about dependence. If the water had been provided, the plant would live. If it was not, the plant dies. This counterfactual dependence is the bedrock of causal reasoning. To deny this is to sever the link between cause and effect in medicine, engineering, and ethics. If a doctor fails to administer a life-saving drug, we say the omission caused the death. To say otherwise is to engage in semantic gymnastics that ignore reality.

  However, your friend raises a potent objection: the problem of profligate omissions. If "would have prevented" makes something a cause, then the Queen of England, the mailman, and everyone else who didn't water your basil are also causes. This seems absurd. Your friend's solution is to invoke norms: the housesitter caused it because she was *supposed* to water it. You worry this makes causation subjective, dependent on social rules rather than physical facts.

  Here is where the settlement lies: The mailman *is* causally relevant, but he is not *the* cause. We must distinguish between the **causal relation** and **causal selection**. The causal relation is objective and broad; thousands of conditions (gravity, oxygen, the mailman's inaction) were necessary for the plant's death. However, when we ask for "the cause," we are selecting the most relevant factor from that web. This selection is pragmatic, but it is not arbitrary.

  This solves your worry about objectivity. The "norm" that identifies the housesitter isn't merely a social whim; it is an objective feature of the system's design. A housesitter is functionally integrated into the plant's survival system; the mailman is not. The housesitter's omission represents a breakdown in a specific maintenance mechanism. The mailman's omission is merely a background condition. Distinguishing between a system failure and a background condition is an objective fact about how the system is organized, not just a social opinion.

  Therefore, your friend is wrong to deny omissions causal status. If we accept her view, we cannot explain prevention, negligence, or biological homeostasis. A heart beats because ions *don't* flood the cell prematurely; an engine runs because fuel *doesn't* leak. The universe is held together by absences as much as presences. However, you must concede that causation is not purely physical; it is also explanatory.

  The verdict stands: Omissions are genuine causes. The death of the basil was caused by the absence of water, specifically provided by the agent responsible for that provision. To deny this is to prioritize a narrow metaphysical definition over the functional reality of how events unfold. The housesitter didn't just fail to act; her inaction was the active ingredient in the plant's death.
