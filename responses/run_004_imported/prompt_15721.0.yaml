prompt: |-
  A student of mine described a habit in seminar last week that has stuck with me. She has a cousin whose moral judgment she trusts more than her own, so whenever she is genuinely unsure whether something would be wrong—breaking up with a partner by text message, keeping cash a cashier handed her by mistake, reporting a friend's minor cheating—she simply asks him and does whatever he recommends, and by her own account this has never once led her astray. A classmate objected that this amounts to a kind of moral cop-out even granting that the cousin's advice is always sound, but she remained unpersuaded: if the advice is reliably good, why should taking it count against her? I would be curious to hear how you would adjudicate the exchange, and in particular whether your assessment would change if she deferred just as heavily to a friend's judgment about medical or financial matters.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Scenario:**
      *   **The Protagonist:** A student (let's call her "S").
      *   **The Habit:** S defers moral judgment to a trusted cousin (let's call him "C") whenever she is unsure.
      *   **The Track Record:** C's advice is always sound (by S's account).
      *   **The Objection:** A classmate argues this is a "moral cop-out" (abdication of moral agency/responsibility).
      *   **S's Defense:** Consequentialist/Pragmatic. If the outcome is good (right action taken), why does the process matter?
      *   **The Comparison:** Does this change if the domain is medical or financial?
      *   **The Task:** Adjudicate the exchange (evaluate the moral status of S's habit) and address the domain comparison.

  2.  **Initial Philosophical Mapping:**
      *   *Consequentialism/Utilitarianism:* Focuses on outcomes. If the action is right, S is doing the right thing. The classmate's objection seems weak from this view.
      *   *Deontology/Kantianism:* Focuses on duty and autonomy. Moral worth comes from acting *from* duty, using one's own rational faculty. Deferring might undermine autonomy and moral development.
      *   *Virtue Ethics:* Focuses on character. Does this habit make S a virtuous person? Virtue requires practical wisdom (*phronesis*). Relying on someone else might stunt the growth of her own moral character.
      *   *Moral Agency/Responsibility:* Can you be morally praiseworthy/blameworthy for actions you didn't reason through yourself?

  3.  **Evaluating the "Moral Cop-Out" Objection:**
      *   *Strengths:* Morality isn't just about *what* you do, but *why* and *how* you decide. Moral maturity involves cultivating one's own judgment. S is treating morality like a rulebook to be consulted rather than a capacity to be exercised.
      *   *Weaknesses:* If S is genuinely unsure, deferring to expertise is rational. Avoiding wrongdoing is good. If C is truly reliable, S avoids sin/error.

  4.  **Evaluating S's Defense:**
      *   *Strengths:* Pragmatic. Avoids harm. Acknowledges limitations in her own judgment.
      *   *Weaknesses:* Ignores the developmental aspect of morality. What if C isn't available? What if C is wrong (even if he hasn't been yet)? It creates dependency.

  5.  **Addressing the Domain Comparison (Medical/Financial):**
      *   *Medical/Financial:* These are technical domains. Expertise is objective and specialized. Deferring to a doctor or financial advisor is standard and rational. We don't expect patients to diagnose themselves.
      *   *Moral:* Is morality a technical domain? Most philosophers say no. It's constitutive of personhood and agency. Deferring here is different because moral judgment is part of *who we are*, not just *what we manage*.
      *   *Key Distinction:* Instrumental value (money/health) vs. Intrinsic/Constitutive value (moral character).

  6.  **Synthesizing the Argument (Drafting the Response):**

      *   *Introduction:* Acknowledge the depth of the question. It touches on moral agency, autonomy, and the nature of ethical reasoning.
      *   *The Case for the Classmate (The "Cop-Out"):*
          *   **Moral Agency:** Morality requires owning your decisions. Kantian autonomy.
          *   **Moral Development:** You learn ethics by doing ethics. S is stunting her growth.
          *   **Responsibility:** If C is wrong later, is S responsible? Yes, because she outsourced the judgment.
      *   *The Case for the Student (The "Pragmatist"):*
          *   **Outcomes Matter:** Doing the right thing is the primary goal.
          *   **Humility:** Recognizing one's limitations is a virtue.
          *   **Community:** We are social beings; relying on others isn't inherently bad.
      *   *The Crucial Distinction (Morality vs. Medicine/Finance):*
          *   **Expertise:** Medical/financial advice is technical. Moral advice is deliberative.
          *   **Alienation:** In medicine, the goal is health (external to the reasoning). In morality, the reasoning *is* part of the good life.
          *   **The "Moral Crutch":** Relying on a crutch prevents walking on your own.
      *   *Nuance/Middle Ground:*
          *   There's a difference between *consulting* and *deferring*. Consulting involves listening then deciding. Deferring involves skipping the decision.
          *   S's habit is okay for *uncertain* cases, but problematic if it becomes a general policy.
      *   *Conclusion:* The classmate has the stronger philosophical point regarding moral character, even if S achieves good outcomes. The domain shift (medical/financial) highlights why moral deference is uniquely problematic.

  7.  **Refining the Tone:**
      *   Keep it academic but accessible (seminar context).
      *   Be balanced but take a stance (adjudicate).
      *   Use philosophical concepts (autonomy, phronesis, heteronomy) without being overly jargon-heavy.

  8.  **Self-Correction/Edge Case Consideration:**
      *   *Wait, is moral testimony valid?* There's a debate in meta-ethics about "moral testimony." Some (like Hills) argue understanding *why* is necessary. Others say trusting testimony is fine. I should mention this debate lightly.
      *   *What if S is morally impaired?* If S lacks capacity, deference is necessary. But the prompt implies she's a normal student, just unsure.
      *   *Make sure to answer the specific question about medical/financial.* Don't just tack it on; integrate it into the core argument about the nature of the domains.

  9.  **Final Polish:** Check structure.
      *   Intro: Frame the tension (Outcome vs. Agency).
      *   Section 1: The Moral Domain (Why deference is problematic here).
      *   Section 2: The Medical/Financial Comparison (Why deference is acceptable there).
      *   Section 3: Synthesis/Verdict (The distinction between consultation and abdication).
      *   Closing: Pedagogical takeaway.

  10. (Mental Check against Safety Guidelines): No sensitive personal advice, no harmful content. Purely philosophical discussion. Safe to proceed.

  11. (Final thought on the "Cousin"): Ensure I don't validate the idea that the cousin is *actually* infallible, but work within the student's premise that the advice is sound.

