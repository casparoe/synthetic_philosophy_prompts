prompt: |-
  My brother and I are dividing up our late parents' estate. Before we'd even sat down to discuss it properly, he told the whole family that he is "absolutely firm" on keeping the house and won't consider selling it or splitting the proceeds. Now I feel pressure to lock in an equally firm counter-position of my own before he can box me in any further, even though I haven't really worked out what I want yet. Is matching his move the right way to protect my interests here, or is something about this dynamic likely to backfire on both of us?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Dividing a late parents' estate with a brother.
      *   **Trigger Event:** Brother publicly declared he is "absolutely firm" on keeping the house (no sell, no split proceeds) *before* proper discussions.
      *   **User's Reaction:** Feels pressured to lock in an equally firm counter-position to avoid being "boxed in," despite not knowing what they actually want yet.
      *   **Core Question:** Is matching his move (digging in heels) the right strategy, or will it backfire?

  2.  **Evaluate the "Matching the Move" Strategy (Tit-for-Tat):**
      *   *Pros:* Might signal strength, prevents immediate capitulation, buys time if the position is vague.
      *   *Cons:* Escalates conflict, reduces flexibility, turns negotiation into a power struggle, damages sibling relationship long-term, ignores the underlying financial/emotional realities, risks litigation (partition actions).
      *   *Verdict:* Highly likely to backfire. It creates a deadlock.

  3.  **Identify the Underlying Dynamics:**
      *   **Anchoring:** The brother has set an extreme anchor ("I keep the house, period").
      *   **Audience Effect:** He told the *whole family*. This adds social pressure and makes him less likely to back down (saving face).
      *   **Emotional vs. Financial:** The house is likely loaded with emotional value for both, but also a major financial asset.
      *   **Premature Commitment:** Both are committing before gathering data (appraisal, mortgage status, tax implications, liquidity needs).

  4.  **Determine the Best Course of Action:**
      *   **Goal:** Protect interests without escalating conflict.
      *   **Strategy:** De-escalate, gather information, introduce objective criteria, keep options open.
      *   **Key Concept:** "Principled Negotiation" (from *Getting to Yes*). Separate people from the problem, focus on interests not positions.

  5.  **Drafting the Advice - Section by Section:**

      *   **Direct Answer:** Start with a clear "No, don't do that." Validate the feeling but warn against the action.
      *   **Why it Backfires (The Trap):** Explain the risks of positional bargaining (deadlock, cost, relationship damage). Mention the "Audience Effect" regarding the family.
      *   **The Brother's Move:** Analyze *why* he did it (fear, attachment, control). Understanding this helps counter it without fighting.
      *   **Better Strategy (The "Soft" Power Move):**
          *   *Pause:* Don't react immediately.
          *   *Data:* Get an appraisal, check mortgage/taxes.
          *   *Interests:* Ask *why* he wants it (memory? investment? convenience?).
          *   *Options:* Buyout, rent-back, co-ownership (temporary), sell.
      *   **Communication Script:** Give the user specific words to use. "I hear you, but we need numbers."
      *   **Protecting Interests:** How to ensure fairness without digging in. (Independent executor, mediator).
      *   **Long-term View:** Siblings are forever; money is temporary.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid taking sides.
      *   Focus on practical conflict resolution.
      *   Highlight the legal/financial risks (partition lawsuit).

  7.  **Self-Correction/Edge Case Consideration:**
