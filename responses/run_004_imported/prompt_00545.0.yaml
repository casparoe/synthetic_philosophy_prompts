answer: |-
  Matching your brother's move is almost certainly the wrong strategy. While your instinct to protect yourself is completely understandable, locking into a rigid counter-position before you know what you want is a classic negotiation trap that often leads to deadlock, financial loss, and permanent damage to your relationship.

  Here is why digging in your heels will likely backfire, and what you should do instead to actually protect your interests.

  ### 1. The Trap of "Positional Bargaining"
  Your brother has taken a **position** ("I keep the house"). If you take a counter-position ("I demand a sale" or "I demand 60%"), you have entered a tug-of-war.
  *   **The Backfire:** In a tug-of-war, the only way for one person to win is for the other to lose. This escalates conflict. If you both lock in, the only way out becomes a "partition action" (a lawsuit to force the sale), which eats up the estate's value in legal fees and delays.
  *   **The Better Way:** Focus on **interests**, not positions. Your interest might be financial liquidity, fairness, or minimizing tax liability. His interest might be emotional attachment, stability for his kids, or believing the property will appreciate. You can often satisfy interests without agreeing on initial positions.

  ### 2. The "Audience Effect"
  By telling the whole family he is "absolutely firm," your brother has created a public relations problem for himself, but he has also painted you into a corner.
  *   **The Backfire:** If you publicly declare a hard line, the family will view this as "sibling warfare." If you stay flexible, you look like the reasonable adult. If he refuses to budge later, *he* looks unreasonable, not you.
  *   **The Better Way:** Do not make public declarations. When family members ask, use a neutral script: *"We are still gathering information on the value and costs. We want to make sure whatever we decide is fair and financially sound for everyone."* This puts the onus on him to explain why he is ignoring the financial reality.

  ### 3. You Are Negotiating Without Data
  You mentioned you haven't worked out what you want yet. Making a firm move now is like betting on a horse race before the horses have arrived.
  *   **The Backfire:** You might lock yourself out of a solution you would have preferred. For example, if you demand a sale, but then realize you'd actually like to keep the house *if* you could afford the buyout, your earlier statement makes that impossible.
  *   **The Better Way:** Slow the process down. You cannot divide the estate until you know what it is worth.
      *   Get an independent appraisal.
      *   Determine the net equity (Value minus Mortgage minus Taxes minus Maintenance costs).
      *   Calculate the cost of a buyout (Can he refinance? Does he have the cash?).

  ### 4. How to Protect Your Interests Without Escalating
  You don't need to be aggressive to be strong. You can protect your interests by being procedural and objective.

  **Step 1: The "Pause" Response**
  Do not tell him what *you* want yet. Respond to his declaration with curiosity and process.
  *   *Say this:* "I hear that keeping the house is your priority. Before we decide if that's possible, we need to know if it's financially feasible. We need an appraisal and a review of the carrying costs."
  *   *Why this works:* It doesn't say "No." It says "Let's check the math." If he can't afford to buy you out, his position collapses on its own without you having to fight it.

  **Step 2: Involve a Neutral Third Party**
  Since he has already tried to dictate terms, the dynamic is unbalanced.
  *   *Action:* If there is an Executor named in the Will/Trust, remind them that their fiduciary duty is to treat beneficiaries equally. If you are co-executors, suggest hiring a mediator or an estate attorney to facilitate the division.
  *   *Why this works:* It removes the decision from the emotional sibling dynamic and places it in a professional framework.

  **Step 3: Keep Your Options Open**
  Until you know the numbers, your position should be "I want a fair division of assets."
  *   *Scenario A:* You want cash. If he keeps the house, he must refinance to pay you your share. If he can't, the house must be sold.
  *   *Scenario B:* You want the house. If the numbers work, you could offer to buy him out.
  *   *Scenario C:* Neither can afford a buyout. The house is sold, proceeds split.
  *   By not committing to A, B, or C yet, you retain the power to choose the best outcome later.

  ### 5. The Long-Term Cost
  Estate disputes are one of the leading causes of permanent sibling estrangement.
  *   **The Reality:** Money comes and goes. A brother is for life. If you dig in now, you establish a pattern of adversarial negotiation that will last for decades (future inheritance for kids, care for aging relatives, family gatherings).
  *   **The Strategy:** Be the one who de-escalates. It is not weakness; it is strategic control. By refusing to play the "who can be more stubborn" game, you force the conversation back to reality.

  ### Summary Recommendation
  **Do not match his move.**
  1.  **Stay Vague:** Tell him (and the family) that you are waiting on data (appraisals, tax info) before forming an opinion.
  2.  **Focus on Feasibility:** Ask him how he plans to finance the buyout of your share. Make *him* solve the problem of how to make his wish work financially.
  3.  **Use Process:** Insist on following the legal/probate process strictly. This protects you from being bullied without requiring you to be aggressive.

  You protect your interests by ensuring the process is fair and transparent, not by shouting louder than your brother.
