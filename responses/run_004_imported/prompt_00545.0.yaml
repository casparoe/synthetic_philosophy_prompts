      *   *What if the user actually wants cash?* *Advice:* Still don't dig in aggressively; focus on the *value* of the cash, not the *fight*.
      *   *What if the brother is irrational?* *Advice:* Mediation/Executor intervention becomes more important.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Don't match him" message is prominent. (This aligns with the initial thought that matching is a bad idea).

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm telling the user to be a doormat. Standing firm on *fairness* is different than standing firm on a *position*. I need to distinguish between "positions" (I want the house/I want cash) and "interests" (I need liquidity/I want to preserve memories).

