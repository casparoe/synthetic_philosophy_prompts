prompt: |-
  So I co-host a small philosophy podcast that our department's undergrad society runs, and next week's guest is a moral philosopher who's going to defend the existence of moral luck -- like, actually defend the Nagel/Williams line that our ordinary habit of judging people more harshly depending on how things turn out (the classic case of two equally reckless drivers, where one happens to hit a kid and the other doesn't) is philosophically defensible rather then just a bias we should train ourselves out of. I'm taking a moral responsibility seminar this term and we just spent almost three weeks on this exact debate, so I've got most of the vocab down (resultant vs circumstantial vs constitutive luck, the control principle, agent-regret, all that), but every question I try to draft on my own ends up being some version of "so what is moral luck," which is not gonna make for a good episode.

  Could you write me like 8-10 interview questions that actually push on the position instead of just giving her room to restate it? I specifically want: one question going after Nagel's regress worry -- once you start applying the control principle consistently, doesn't it eventually swallow almost everything, including character and even the decision made in the moment, so that hardly anything is left to judge -- and see how she stops the regress without it looking arbitrary; one on Williams' agent-regret idea, pressing on whether the driver who kills the kid through no extra fault of his own is really feeling something philosophically distinct from a bystander's regret, or whether "agent-regret" is just a label stuck onto the intuition we're supposed to be explaining; one that uses constitutive luck against the Kantian idea of the good will, since if temperament and character are themselves just handed to you by luck, the "good will" that's supposed to be the one thing immune to luck starts looking lucky too; and one on why criminal law punishes completed crimes so much more harshly than failed attempts when the only difference between them is often pure luck (the deflected bullet, the pedestrian who happened to look up in time). For each of those four, throw in a quick follow-up question keyed to whatever dodge or answer she's most likely to give, so the conversation doesn't just stop there. Thanks!
