answer: |-
  Here are 9 interview questions designed for your mock brown-bag. They are structured to corner the "IEDS Hardliner" on epistemic foundations, technical nuances, and empirical validity, with specific follow-ups to counter standard defensive maneuvers.

  ### 1. The Ontology of Mixed Dominance
  **Question:** You argue that we should eliminate any pure strategy dominated by a *mixed* strategy, even if it isn't dominated by any pure strategy. But consider a player who lacks the technology or cognitive capacity to randomize—they can only commit to pure actions. If a strategy is only dominated by a coin flip they *cannot* perform, in what sense is playing that strategy "irrational"?

  **Anticipated Dodge:** He will likely argue that dominance is about the *opponent's* uncertainty, not the player's ability to randomize. "The mix represents the opponent's belief about my behavior, not my actual randomization device."
  **Follow-up:** "If the mix is just a belief in the opponent's mind, then eliminating my strategy depends on the opponent having a specific belief structure. Doesn't that smuggle in assumptions about *their* rationality and beliefs that go beyond my own rationality? You said IEDS only requires Common Knowledge of Rationality, but this sounds like it requires Common Knowledge of 'Belief in Randomization Capability.'"

  ### 2. The Asymmetry of Elimination Order
  **Question:** We know iterated elimination of *strictly* dominated strategies (IESDS) is order-independent, but iterated elimination of *weakly* dominated strategies (IEWDS) is order-dependent. If rationality is a fundamental property of the agent, why should the set of rationalizable actions depend on the arbitrary order in which an analyst decides to cross things off a matrix? What does that asymmetry tell us about the stability of 'rationality' under weak dominance?

  **Anticipated Dodge:** He will probably concede IEWDS is problematic and say, "Fine, stick to Strict Dominance. It's the purer concept."
  **Follow-up:** "If you retreat to Strict Dominance, you lose the ability to solve vast classes of games, including many auctions and voting mechanisms where weak dominance is the only tool we have. Are you admitting your 'general solution concept' is actually only applicable to a small subset of strategic interactions?"

  ### 3. The Centipede Paradox (Aumann's Point)
  **Question:** Let's talk about the Centipede Game. As Aumann pointed out, Common Knowledge of Rationality (CKR) alone is sufficient to force Backward Induction, leading the first player to stop immediately. Yet, in experiments, players rarely do this; they cooperate for several rounds. If your solution concept predicts immediate defection but humans consistently cooperate, is the problem with the humans, or is CKR simply too strong an assumption for descriptive game theory?

  **Anticipated Dodge:** "Experimental subjects make mistakes or have social preferences. Theory describes idealized rational agents, not lab subjects."
  **Follow-up:** "But if CKR implies an outcome that is Pareto-dominated by strategies 'irrational' players choose, doesn't that suggest CKR is epistemically unstable? If I know you are rational, I stop. But if I know that *you know* that stopping yields a terrible payoff, shouldn't I doubt your rationality? Isn't the 'rational' move to doubt the Common Knowledge itself?"

  ### 4. The $N > 2$ Correlation Problem (The Bonus)
  **Question:** In two-player games, Rationalizability and IEDS are equivalent. But as Pearce showed, in games with more than two players, that equivalence only holds if players are allowed to hold *correlated* conjectures about their opponents' strategies. If we assume players form beliefs independently (no correlating device), Rationalizability becomes a stricter set than IEDS. Does your defense of IEDS commit you to the idea that players can epistemically justify correlated beliefs about independent opponents?

  **Anticipated Dodge:** "Correlated beliefs are natural. I might think if Player 2 plays Up, Player 3 is more likely to play Left. It's just conditional probability."
  **Follow-up:** "But if Player 2 and Player 3 choose independently, that correlation exists only in *your* head, not in the data generating process. If you eliminate a strategy because it fails against a correlated belief that *cannot* physically occur, aren't you eliminating strategies that are actually best-responses to the true structure of the game? Isn't that an error?"

  ### 5. Predictive Power vs. Epistemic Purity
  **Question:** One of the main critiques of IEDS is that it often leaves the entire strategy space intact (e.g., in Cournot or Bertrand games without specific cost structures), whereas Nash Equilibrium gives a sharp prediction. If a solution concept is epistemically 'purer' but predicts 'anything could happen,' is it actually doing any work as a *solution* concept? At what point does epistemic minimalism become explanatory vacuity?

  **Anticipated Dodge:** "Better to predict everything than to predict the wrong thing based on false assumptions about beliefs."
  **Follow-up:** "But science is about falsifiability. If your concept survives every observation because it allows every outcome, it's unfalsifiable. Are you proposing a solution concept, or just a tautology about rationality?"

  ### 6. The "Correct Beliefs" Charge
  **Question:** You argue Nash Equilibrium is flawed because it assumes players' beliefs about others are *correct* (consistent conjectures), whereas IEDS doesn't. But doesn't IEDS implicitly assume that players correctly believe *others are rational*? If I eliminate a strategy because I think you won't play a dominated one, but you *do* play it, my elimination was based on a false belief. How is 'Belief in Rationality' epistemically cheaper than 'Belief in Strategy'?

  **Anticipated Dodge:** "Rationality is a structural assumption; Strategy is a specific choice. It's easier to know someone is rational than to know their move."
  **Follow-up:** "In a coordination game, I might know you're rational, but if I don't know *which* rational equilibrium you're aiming for, IEDS doesn't help me. So you've swapped 'Correct Beliefs about Moves' for 'Correct Beliefs about Rationality Types.' Why is the latter guaranteed by Common Knowledge but the former isn't?"

  ### 7. Trembling Hand and Robustness
  **Question:** Selten introduced Trembling Hand Perfection to rule out equilibria sustained by weakly dominated strategies, precisely because they aren't robust to small mistakes. Since IEDS (especially with weak dominance) can retain strategies that Trembling Hand would kill, are you defending a solution concept that is inherently fragile? If a tiny probability of a 'tremble' destroys your solution, is it really 'rational'?

  **Anticipated Dodge:** "Trembles are an ad-hoc fix. Rationality should be deterministic."
  **Follow-up:** "But the real world is noisy. If your 'rational' solution collapses the moment there's a 1% chance of a slip-up, isn't Nash Equilibrium with refinement actually *more* robust to the reality of human error than your IEDS approach?"

  ### 8. The Coordination Problem
  **Question:** Consider a pure Coordination Game with two strict Nash Equilibria and no dominated strategies. IEDS eliminates nothing. Nash Equilibrium identifies the two stable points. If the goal of game theory is to guide action, how does your approach help a player choose between the two? If you say 'it doesn't,' aren't you admitting IEDS is incomplete as a general solution concept?

  **Anticipated Dodge:** "Game theory doesn't have to solve everything. It just defines the bounds of rationality."
  **Follow-up:** "If it doesn't help me choose, why should I use it over a focal point argument or a social norm? It seems like you're defending IEDS as a 'lower bound' on behavior, but calling it a 'solution concept' implies it solves the game. Which is it?"

  ### 9. Dynamic Consistency and Re-evaluation
  **Question:** In a dynamic game, IEDS is often applied to the normal form representation. But if a player reaches an information set that should have been eliminated by IEDS (because it requires a previous player to have played a dominated strategy), how should they update? If they update using Bayes' rule, the posterior is undefined. If they don't, how can they maintain Common Knowledge of Rationality moving forward?

  **Anticipated Dodge:** "That's why we use Sequential Equilibrium or Extensive Form Rationalizability."
  **Follow-up:** "But now you're adding extra machinery beyond simple IEDS on the normal form. Doesn't that concede that normal-form IEDS is insufficient for dynamic settings? If your 'general solution' needs a different version for extensive form games, is it really a unified theory?"
