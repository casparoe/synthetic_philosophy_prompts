prompt: |-
  I host a small podcast out of my philosophy department in which I interview people working on formal and technical topics at the edges of the discipline, and next week's recording is with a decision theorist who has spent much of her career defending the provability-logic construction — built on Löb's theorem and often glossed in the literature as "FairBot" — as the right way to rescue Tennenholtz's original program-equilibrium result from being a mere mathematical curiosity. I went through the 2004 paper with my graduate seminar a couple of weeks ago, and the students were struck by the folk-theorem-style result: once players submit programs — which can read one another's source code — rather than simply choosing actions, almost any individually rational payoff of the underlying one-shot game, including full mutual cooperation in a single-shot Prisoner's Dilemma, can be sustained in equilibrium. Several of them came away suspecting this was a clever fixed-point trick rather than anything that illuminates rational agency, and, having shown the class two of her recorded talks, I know she already has a polished explainer of the construction ready to go. I'd like this interview to push her past that explainer rather than elicit it again.

  Please draft eight to ten interview questions. I want at least one question on why Tennenholtz's own strategy for proving the result, which turns on comparing source code for exact textual equality, is too fragile to carry the philosophical weight usually placed on it, and on how the Löbian, bounded-proof-search construction is supposed to improve on that fragility without collapsing into an infinite regress of "it will prove that I will prove that it will cooperate..."; at least one on the equilibrium-selection worry that mutual unconditional defection is exactly as much a program equilibrium as mutual Löbian cooperation, so that the theorem may be silent on why two rational programmers would write the cooperative program rather than the defecting one; at least one on whether the various patches proposed for making the construction robust to small mismatches, or "trembles," between an opponent's actual code and the code it can be proved to run are principled extensions of the original idea or after-the-fact repairs; and at least one on whether the requirement that agents can read one another's exact source code models anything about rational agency at all, rather than being merely an idealization with no purchase on agents, human or artificial, who cannot fully inspect one another's dispositions. For each of these four, please add a pointed follow-up question keyed to the answer she is most likely to give, so the conversation doesn't just let her retreat back to the standard exposition.
