      *   *The Defense:* Nietzsche isn't proposing a universal morality. He distinguishes between "herd" morality and "higher type" physiology. He is descriptive, not prescriptive, in a moral sense. He is offering *hygiene*, not *virtue*. The key is the distinction between *causality* and *symptomatology*.
