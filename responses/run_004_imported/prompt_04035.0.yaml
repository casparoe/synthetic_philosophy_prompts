      *(Self-Correction during drafting)*: Make sure Marcus doesn't just say "Nietzsche is right." He needs to explain *why* the charge doesn't stick philosophically, not just authoritatively. Make sure Elena doesn't just say "It looks bad." She needs to pin down the logical structure of the fallacy.

