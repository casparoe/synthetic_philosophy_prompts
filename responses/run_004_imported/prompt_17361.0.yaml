      *Wait, let's be generous on (b).* The student *did* write $r(1)-r(0.99)$ in the example. That shows they know it's about differences in cumulative probability. The sentence "multiply it by $r(p_i)$" is a sloppy shorthand for "weight it by the risk-weighted probability mass." I should penalize for imprecision but acknowledge the example saves them from a zero. Let's go 7/10 for (b).
      *   Total: 5 + 7 + 4 = 16/20.

      *Actually, looking closer at (c):* The justification "increasing transformations preserve order" is actually quite weak for SD. SD is about distributions, not just order. I'll stick with a deduction there. 15/20 feels fair for "Good grasp of concepts, sloppy on formalism."

  7.  **Drafting the Response:**
