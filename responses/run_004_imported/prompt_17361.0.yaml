            "convexity": "Correctly identified convex r for risk-aversion.",
            "formal_definition": "Incorrectly stated r applies to raw probabilities p_i rather than cumulative probabilities.",
            "application": "Example calculation (Allais) showed correct intuition despite text error."
          }
        },
        {
