answer: |-
  **Setting:** *A quiet corner of a public library. Two chairs, a table between them. ELIAS and MARA have known each other for years. They are speaking softly.*

  **Elias:** You've been staring at that blank page for twenty minutes. Is it the wording?

  **Mara:** It's the signature line. It feels less like signing a medical form and more like signing a treaty with a hostile nation. Myself.

  **Elias:** That's exactly why you need to sign it. You're acknowledging that the "nation" changes borders. When you're well, you see the cliff. When you're manic, you think you can fly off it. The Ulysses contract isn't hostility; it's the rope. Odysseus didn't tie himself to the mast because he hated the Sirens' song. He tied himself because he knew his future self would lose the capacity to care about the rocks.

  **Mara:** But that assumes the "stable Elias" is the captain and the "manic Elias" is the mutinous crew. What if it's the other way around? What if the stable self is the bureaucrat, obsessed with safety and continuity, and the manic self is the explorer? Priya told me something once that stuck. She said, "When I'm manic, I don't feel sick. I feel like the first time I've woken up." If you sign this, you're giving the bureaucrat a gun to shoot the explorer.

  **Elias:** The explorer who ends up in the ICU? The explorer who maxes out credit cards and alienates their family? Look, I get the romanticism. But we're talking about *capacity*. In bioethics, we don't let people make irreversible decisions when they're delirious or intoxicated. We assume their judgment is compromised. Mania isn't just a "different mode of being"; it's a physiological storm that disrupts risk assessment. It's not about which self is "truer." It's about which self is capable of navigating reality without crashing.

  **Mara:** But "capacity" is a value judgment disguised as a medical one. You're saying capacity means "the ability to agree with the stable self's values." If the manic self values intensity, creativity, and risk, and the stable self values security and moderation, who decides which value set is the correct one? The law defaults to the stable self, obviously. But philosophically? That's just might makes right. The stable self has the legal power, so it declares itself the "real" owner of the body.

  **Elias:** It's not just power. It's continuity. Think about the constitutional analogy you brought up. Jefferson vs. Madison. Jefferson thought each generation should be sovereign—that the dead shouldn't rule the living. He wanted constitutions to expire every nineteen years. Madison said no, that creates chaos. You need a framework that persists so society doesn't collapse every time passions flare. Your stable self is Madison. It's building a framework so you don't burn the house down every time the temperature rises.

  **Mara:** I've been thinking about that analogy. And I think it breaks down. In the constitutional debate, the "future generation" is a *different group of people*. They have different interests. But in your case, it's supposed to be *you*. If the manic self is so radically different that it needs to be bound by the stable self, are we even talking about the same person?

  **Elias:** Legally and biologically, yes.

  **Mara:** Psychologically? Derek Parfit would argue that if psychological continuity breaks down—if your memories, values, and priorities shift that drastically—the "person" who signs the contract and the "person" who is hospitalized are only weakly connected. If they're weakly connected, why does the past self have the moral authority to inflict trauma on the future self? If Jefferson is right that the earth belongs to the living, then the earth of your mind belongs to the manic you when the mania hits. The stable you is, effectively, dead.

  **Elias:** That's a terrifying way to live. If you fragment yourself that much, you lose accountability. If "Manic Me" isn't responsible for "Stable Me's" debts or relationships, then there is no "Me." There's just a series of episodes. The Ulysses contract is an act of love across time. It's the stable self saying, "I know you won't thank me now, but I am protecting the conditions that allow *us* to exist at all." Without the contract, the mania consumes the host. There is no future self to liberate if the body is destroyed.

  **Mara:** But there's a middle ground you're ignoring. The contract assumes the only way to save the life is to override the will completely. But what if the trauma of coercion—the handcuffs, the forced injection, the loss of agency—does damage that lasts longer than the mania? Priya says the memory of being forced is what makes her afraid to seek help next time. So the "protection" creates the danger.

  **Elias:** So what's the alternative? Wait until you're homeless?

  **Mara:** The alternative is distinguishing between *safety* and *compliance*. Maybe the directive says: "Hospitalize me if I'm a danger, but do not medicate me unless I am imminently lethal." Let the manic self scream. Let it pace the halls. Protect the body, but don't try to chemically lobotomize the "Jeffersonian" self into submission just because it's inconvenient. The Madisonian view wants order. The Jeffersonian view wants liberty. Why can't the directive protect the life without crushing the spirit?

  **Elias:** Because the medication *is* the lifeboat. You can't separate the safety from the treatment. But I hear you. You're worried that by signing this, you're validating the idea that your stable self is the only one that matters. That you're erasing the validity of your own altered states.

  **Mara:** Exactly. If I sign this, I am agreeing that when I am manic, I am not a person with rights, but a problem to be solved. I become an object.

  **Elias:** And if you don't sign it, you are gambling that your future self will have the insight to ask for help when their brain is telling them they are a god. It's a gamble with your sister's trauma, too. She's the one finding you. She's the one signing the papers if you can't. This directive isn't just for you. It's for her. It relieves her of the guilt of overriding your will. It lets her say, "He told me to do this."

  **Mara:** That's the strongest argument you've made. The burden on the loved ones. But does their relief justify my coercion?

  **Elias:** It justifies the *structure*. Look, let's go back to the Constitution. Madison won, practically speaking. We don't rewrite the Constitution every generation. But we have the Amendment process. We have a way for the future to speak to the past. Can your directive have an Amendment process? Can you write in preferences for *how* you are treated, not just *that* you are treated?

  **Mara:** Like... "If I must be held, let me have my music." "If I must be medicated, start with this dose, not that one."

  **Elias:** Exactly. That acknowledges the Jeffersonian self. It says, "I know you are there. I know you have preferences. I am binding you for safety, but I am not erasing you." It turns the Ulysses contract from a gag order into a negotiation.

  **Mara:** But Ulysses didn't negotiate with the Sirens. He plugged his ears.

  **Elias:** No, he listened. That's the point. He tied himself up *so he could listen without jumping*. The medication isn't to make you deaf to the music. It's to keep you from jumping overboard while you listen.

  **Mara:** *(Pauses, looks at the form)*. The problem is, Ulysses knew the Sirens were dangerous. He wanted to survive. If my manic self genuinely believes that dying for the song is worth it... then the stable self is imposing a value judgment: *Survival is more important than Intensity.*

  **Elias:** Yes. I am imposing that. Because I have to live with the consequences of your death. And because I believe that "You" are a narrative, not a snapshot. A story needs pages after the climax. If the book ends in Chapter 12 because the protagonist flew into the sun, there is no story. The stable self is the editor. The manic self is the writer in a frenzy. The editor's job is to make sure there's a Chapter 13.

  **Mara:** But what if the writer hates the editor? What if the writer feels the editor is turning a masterpiece into a manual?

  **Elias:** Then the writer needs to survive long enough to argue about it when the ink dries. That's all the contract asks. Survive the episode. Argue later.

  **Mara:** *(Takes a pen, hovers it over the paper)*. If I sign this... I need to write a preamble.

  **Elias:** A preamble?

  **Mara:** Yes. Stating that this contract is a tragedy, not a triumph. That it is a failure of my biology that I need it. That the "Manic Self" is not an enemy combatant, but a wounded part of the whole. I won't sign a document that treats me like a risk to be managed. I'll sign one that treats me like a person who gets lost.

  **Elias:** I think... I think the psychiatrist might accept that. It changes the tone from "Authorization for Force" to "Request for Rescue."

  **Mara:** It's the difference between Madison locking up the protestors and Madison building a shelter for them during the storm.

  **Elias:** Then sign it. Not because the stable self is right and the manic self is wrong. But because the stable self is currently the one holding the pen, and has a duty to ensure the manic self gets a chance to hold it again.

  **Mara:** *(Writes for a moment, then sets the pen down)*. Okay. But I'm adding a clause.

  **Elias:** Which is?

  **Mara:** That once I'm stable, we review the tape. I get to hear what I said. I get to know what was done. No black boxes. If the stable self is going to rule the future, the future deserves to know the history.

  **Elias:** Transparency. That's very Jeffersonian.

  **Mara:** It's the only way the Constitution holds. If the people don't know what the government did in their name, they aren't citizens. They're subjects. I won't be a subject in my own mind.

  **Elias:** Deal.

  *(Mara signs. She doesn't look relieved, but she looks resolved.)*
