          2.  What did he actually say in the 1978 *Dialectica* paper ("Natural Selection and the Emergence of Mind")?
          3.  Does distinguishing between natural selection (mechanism) and evolution (history) dissolve the tension, or does the worry survive?

  2.  **Deconstruct Popper's Original Position:**
