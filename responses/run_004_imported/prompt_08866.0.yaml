          *   The *history* (common descent, specific pathways) is harder to test in a lab but testable via evidence (predictions about fossils, genetics).
          *   Popper's lingering worry: Evolutionary theory explains *adaptations*, but is it a universal law? He remained slightly ambivalent about its status compared to physics, but definitely moved it into the "science" column.
