answer: |-
  **London, 1656. A private room near Chancery Lane. The air is thick with pipe smoke and the smell of old paper. THOMAS HOBBES (68) sits rigid in a high-backed chair, a large sheet of parchment spread before him. JOHN WALLIS (39) stands by the window, holding a thin pamphlet—his latest *Elenchus*.**

  **HOBBES:** You write very quickly, Mr. Wallis. It takes a man years to contemplate the nature of magnitude. It takes you only weeks to call him a fool.

  **WALLIS:** I write quickly, Mr. Hobbes, because the error is plain. I do not need years to see that two and two make four, nor to see that your square is not equal to your circle. I need only look at the numbers.

  **HOBBES:** Numbers! Always the numbers. You treat geometry like a merchant treats his ledger. You count the coins but you do not know the metal from which they are struck. I am speaking of *generation*. Of motion. I construct the figure. I stipulate the cause. Therefore, I know the effect. That is science. *Scientia*.

  **WALLIS:** And yet, your construction fails. You claim that because you defined the motion, the result must be true. But the result is false. The ratio is wrong. If I build a bridge using your "generation," and I follow your construction precisely, the bridge falls. Does the bridge fall because the math is wrong, or because your "maker's knowledge" was a hallucination?

  **HOBBES:** The bridge falls because you do not understand the principles! You rely on these... *indivisibles*. These infinitesimal ghosts. You say a line is made of points, a surface of lines. It is nonsense. A point has no dimension. You cannot sum nothing to get something. My method is pure. I begin with bodies in motion. I derive the figure.

  **WALLIS:** Your method is pure, but it is blind. You insist that we can only know what we make. That is your great boast, is it not? We know geometry because we construct the definitions. We know civil philosophy because we construct the Commonwealth.

  **HOBBES:** It is the only path to certainty. God knows the natural world because He made it. Man knows geometry and the State because he makes them. In both cases, the knower is the cause. That is why my *Leviathan* is as demonstrable as Euclid.

  **WALLIS:** Then here is the cut, Thomas. If the certainty of the State rests on the certainty of the Geometry, and your Geometry is demonstrably false... what becomes of the State? You say the Sovereign creates justice by fiat, just as the geometer creates the circle by definition. But if the geometer defines a circle and it turns out to be an oval, we laugh at him. If the Sovereign defines justice and it turns out to be ruin, we bleed.

  **HOBBES:** You confuse *Truth* with *Right*. In geometry, truth is the agreement of our names with the consequences of our constructions. I may have made a slip in calculation—a human error. But the *method* remains certain. In politics, there is no external measure. The Sovereign's will *is* the measure.

  **WALLIS:** Is it? You argue that we flee the State of Nature because we fear death. That is a fact of nature, not a construction. You build your Commonwealth on the physics of human passion. If your physics is as shaky as your squaring of the circle, your Commonwealth is built on sand. You claim your algebra of power is exact. But you cannot even square a circle without me correcting your arithmetic.

  **HOBBES:** (Leans forward, tapping the parchment) I do not need your arithmetic. Arithmetic is for shopkeepers. I am dealing with *consequences*. Look here. I posit a motion from A to B. I generate the sector. The cause is known because I willed the motion.

  **WALLIS:** But you did not will the ratio of the curve! You can will the definition of a circle, Mr. Hobbes, but you cannot will the value of Pi. That is not yours to make. It is discovered. My algebra, these "symbols" you mock, they track the discovery. They land on the truth even when I do not fully grasp the physical generation.

  **HOBBES:** That is not knowledge! That is luck. That is a parrot reciting a prayer. You manipulate symbols without understanding the bodies that move behind them. You get the right answer, but you do not know *why*. I may get the wrong answer today, but I know *what I am doing*. I am tracing the causal chain. You are shuffling cards.

  **WALLIS:** I am shuffling cards that predict eclipses. You are tracing causal chains that cannot measure a wheel. You want to be the Galileo of Civil Science. But Galileo measured. He tested. He admitted when the numbers contradicted the intuition. You treat your diagrams like Royal Decrees. You think if you define it clearly enough, reality must obey.

  **HOBBES:** Reality *does* obey, if defined correctly! The error is in the language, not the world. This is why I hate your universities. You teach men to value authority over definition. You value the reputation of Archimedes over the evidence of your own reason.

  **WALLIS:** I value the result. And here is the danger for your politics. You want men to obey the Sovereign because the Sovereign is the "Artificial Man," the geometer of the State. You say we authorize his actions so that we know the cause of the laws, because we made him. But if the Sovereign is like you—insisting his construction is perfect while the walls crumble—why should we obey?

  **HOBBES:** Because the alternative is war! You miss the point entirely, Wallis. In geometry, if I am wrong, the theorem is false. In the Commonwealth, if the Sovereign is wrong, the law is *still* law. Certainty in politics does not come from being mathematically correct. It comes from being *uncontested*. My geometry seeks the true ratio. My politics seeks the peaceful order. The certainty of the one lies in the correctness of the cause. The certainty of the other lies in the unity of the will.

  **WALLIS:** But you link them! You say Civil Philosophy is a science comparable to Geometry. You say we can have *demonstration* in politics. How can you demonstrate a conclusion if your axioms are as prone to error as your *De Corpore*?

  **HOBBES:** Because the axioms of politics are internal! Fear of death. Desire for commodious living. These are not external quantities to be measured by your indivisibles. They are motions within the breast. I know them because I am a man. I do not need to measure the heart to know it beats. I know the Commonwealth because I know the parts that compose it.

  **WALLIS:** You know the parts, but you miscalculate the whole. Just as you miscalculate the circle. You treat men as uniform bodies in motion. But they are not. They are stubborn. They are irrational. They are like... well, like an old philosopher who refuses to admit his square is round.

  **HOBBES:** (A cold smile) And you, Mr. Wallis? You are a Presbyterian, are you not? You fought against the King. You believe authority comes from below, from the consent of the elect, from some mystical algebra of the people. I offer you a machine that guarantees peace. You pick at the gears because one cog is slightly out of alignment.

  **WALLIS:** I pick at the gears because if the mechanism is flawed, it will tear your hand off. You claim your system offers certainty. But you have spent twenty years trying to square the circle, and for twenty years I have shown you the error. You do not learn. You publish a new solution, I refute it, you publish another. If you cannot correct your own reasoning in geometry, where the figures are silent and cannot argue back, how can we trust you to reason for the State, where men will die for your errors?

  **HOBBES:** Because in the State, I do not ask them to trust my reasoning. I ask them to trust my *Sword*. Geometry is for the wise. Politics is for the living. You think your algebra makes you wise. I know my fear keeps me alive.

  **WALLIS:** Then admit it. Admit that your "Maker's Knowledge" is a shield, not a method. You say we know what we make so that you can claim authority over what you have written. You want to be the Sovereign of Truth.

  **HOBBES:** (Stands up, gathering his papers) I want to be the man who stopped the madness. You and your colleagues at Oxford... you debate words while the world burns. I offer a way to end the debate. If my geometry is imperfect, it is because I am a man. But if my politics are followed, there will be no more civil war. That is a result your algebra cannot give me.

  **WALLIS:** And if your politics require us to accept your geometry as dogma? If the Sovereign says the circle is squared, must we agree to keep the peace?

  **HOBBES:** (Pauses at the door) The Sovereign commands actions, not beliefs. You may think me a fool in your heart, Mr. Wallis. You may publish your pamphlets. But you will not take up the sword. And that... that is the only demonstration that matters.

  **HOBBES exits. WALLIS stands alone in the room. He looks down at the parchment on the table. He takes a pen from his pocket, draws a small, precise circle over Hobbes's diagram, and writes a single equation beside it.**

  **WALLIS:** (To himself) Actions speak. But numbers tell the truth.

