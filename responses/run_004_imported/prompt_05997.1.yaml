      *   *Clarification on "Conceivability":* Leibniz *does* use conceivability ("we might conceive it increased"). But he uses it to reveal a category error, not to establish modal possibility directly. The impossibility comes from the definitions, not the conceiving.
      *   *Zombie connection:* Leibniz doesn't argue for Zombies (machines without minds). He argues that machines *cannot* be minds. Chalmers argues minds *could* exist without the physical (or physical without minds). Wait, Chalmers argues Physical + No Phenomenal is possible. Leibniz argues Physical + Phenomenal is *impossible* (unless the physical is actually mental). This is a crucial distinction. Leibniz denies the antecedent of Physicalism. Chalmers accepts the physical description and adds the phenomenal.
