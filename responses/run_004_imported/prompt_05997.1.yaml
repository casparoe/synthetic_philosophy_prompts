  3.  **Compare with Chalmers's Zombie Argument:**
      *   *Chalmers:* P1: Zombies are conceivable. P2: If conceivable, then metaphysically possible. P3: If physicalism is true, zombies are impossible. C: Physicalism is false.
      *   *Leibniz:* Does he rely on *conceivability* leading to *possibility*?
      *   *Nuance:* Leibniz says we "would never find anything to explain a perception." This sounds like an explanatory gap. But for Leibniz, the gap isn't just a limit of human understanding; it's a category mistake. Perception is *sui generis*.
      *   *Difference:* Chalmers is arguing *against* physicalism from the outside (assuming physicalism might be true, then showing it fails). Leibniz is arguing *from* his own metaphysics (Monads) to show why mechanism *must* fail.
      *   *Conceivability:* Leibniz does ask us to "conceive" the machine enlarged. But the punchline isn't "you can conceive it without mind, so mind is separate." The punchline is "looking inside reveals *only* mechanics, and mechanics *by definition* cannot yield perception."

