  *(Self-Correction during drafting)*: I need to be careful not to make Kepler sound *too* modern. He wasn't a skeptic in the modern sense; he truly believed in the cosmic influence. The distinction is *mechanism*. Modern apps say "Sun in Aries = Bold." Kepler says "Square aspect = Tension in the Earth's Soul = Potential for conflict." The mechanism is geometric harmony, not symbolic association.

