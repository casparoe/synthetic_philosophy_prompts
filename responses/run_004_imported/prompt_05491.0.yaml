answer: |-
  **Title:** The Weapon in the Words: Douglass and the Art of Reading
  **Time:** Approx. 8–10 Minutes
  **Speaker:** Philosophy Faculty
  **Occasion:** University Constitution Day

  **(Start)**

  Good morning. I know what some of you are thinking. You're here because a syllabus told you to be here. There's extra credit on the table, and I appreciate your pragmatism. I'm a philosopher, not a historian or a lawyer, which is apparently why I've been handed the microphone today. The organizers said they wanted something "conceptual."

  I think that's code for: "Don't get bogged down in case law, but don't bore the history department either."

  So, I want to talk to you about reading. Specifically, I want to talk about how we read old, difficult documents when the stakes are life and death. And to do that, I want to talk about Frederick Douglass.

  We tend to memorialize Douglass as a statue. Bronze, stoic, fixed. But the Douglass I'm interested in is the one who changed his mind.

  In the 1840s, Douglass was a follower of William Lloyd Garrison. And Garrison's position on the Constitution was scorching earth. He called it a "covenant with death and an agreement with hell." Why? Because if you looked at the history, the compromises, and the men who wrote it, the Constitution was undeniably pro-slavery. It protected the slave trade for twenty years. It counted enslaved people as three-fifths of a person. It demanded the return of fugitive slaves.

  For the early Douglass, the moral character of a document was determined by the *intent* of its authors and the *reality* of its application. If the framers compromised with slavery, the document *was* slavery. To vote under it, to swear an oath to it, was to dirty your hands. It was a philosophical stance: You cannot separate the text from the sin of its context.

  But then, in the early 1850s, Douglass broke with Garrison. He published a letter titled "The Change of Opinion." He began to argue that the Constitution was, in his words, "a glorious liberty document."

  This wasn't because slavery had gotten better. It wasn't because the framers had suddenly become abolitionists. It was because Douglass changed *how he read*.

  He realized that if you look strictly at the text—the actual words on the page—the word "slave" appears nowhere. The word "slavery" appears nowhere. The Constitution speaks of "persons," "citizens," and "people." Douglass argued that the text itself, stripped of the secret compromises and the whispered intentions of the Philadelphia convention, was neutral. And in a legal system, if the text is neutral, you can weaponize it for justice.

  This is where it gets tricky for us today. Because right now, we are stuck in a very tired fight about how to read the Constitution. On one side, you have "Originalists," who say we must stick to the original public meaning. On the other, you have proponents of a "Living Constitution," who say the document evolves with our values.

  Both sides try to claim Douglass. The Originalists love the later Douglass because he focused on the *text* rather than the framers' secret intentions. The Living Constitutionalists love the early Douglass because he recognized that a document must be judged by its moral outcomes in the present.

  But I'm here to tell you that Douglass fits neatly into neither box. And understanding why is the conceptual key I want to leave you with.

  Douglass wasn't an Originalist because he didn't care about preserving the past. He didn't want to know what James Madison *thought* in 1787; he wanted to know what the words *could do* in 1852. He wasn't looking for historical fidelity; he was looking for moral leverage.

  But he also wasn't treating the Constitution as a "Living Document" in the sense of just projecting his own values onto it. He didn't say, "Slavery is bad, so I'll read the Constitution as if it bans slavery." He said, "The text *already* bans slavery if you read it literally, without the pro-slavery gloss that the courts have painted over it."

  For Douglass, interpretation wasn't an academic exercise. It was a fight for ownership.

  He understood that if you concede the text to your oppressor, you lose. If the Garrisonians said, "The Constitution is pro-slavery, so we must reject it," they left the Constitution entirely in the hands of the slaveholders. They ceded the ground.

  Douglass's genius was realizing that the law is not just a set of commands; it is a language. And like any language, it can be spoken by different voices. He refused to let the framers' racism dictate the text's potential. He argued that the *words themselves* held a promise that the *writers* had failed to keep.

  So, what does this mean for us, sitting here in 2024?

  It means that Constitutional interpretation is not something reserved for nine people in black robes in Washington. It is a civic act.

  When we read our founding documents, we are often told to choose between worship and cynicism. Either the Founders were gods and the text is perfect, or they were sinners and the text is tainted. Douglass offers us a third way.

  The third way is to recognize that a document outlives its authors. The Constitution is not a tombstone for the 18th century; it is a tool for the 21st. But tools require hands to use them.

  If you leave the reading to the experts, or the judges, or the historians, you surrender the power of the text. Douglass teaches us that the meaning of a law is not found only in the past, in the "original intent." It is found in the struggle over what that law can be made to *do* in the present.

  He teaches us that we are allowed to read our inheritance critically. We can acknowledge the "covenant with death"—the history of exclusion, of slavery, of inequality—without accepting it as the document's final destiny. We can hold the authors accountable for their failures while simultaneously claiming the text's promises for ourselves.

  To my history colleagues in the room: Yes, context matters. The framers compromised.
  To my law students: Yes, text matters. The words constrain us.
  But to the undergrads in the back, who are watching the clock: This is the part that matters for you.

  You are going to inherit institutions. You will inherit laws, norms, and traditions that were built by people who didn't expect you to be here. People who didn't count you as full citizens. You have two choices. You can reject the inheritance entirely as poisoned, or you can do what Douglass did.

  You can learn to read it better than they did.

  You can look at the gaps, look at the silences, look at the words "We the People," and insist that they mean what they say, even if the people who wrote them didn't fully believe it themselves.

  Douglass didn't change the Constitution. He changed the reading of it. And in doing so, he changed the country.

  So, happy Constitution Day. My hope is that you don't just celebrate the document as a relic. I hope you pick it up. I hope you argue over it. And I hope you realize that the extra credit isn't in listening to me talk about Douglass. The extra credit is in becoming the kind of reader he was: rigorous, unyielding, and brave enough to find liberty in a text that was written by men who wanted to keep it for themselves.

  Thank you.

  **(End)**
