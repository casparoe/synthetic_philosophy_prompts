  ok this has been rattling around in my head since an ACX open thread about the ship of theseus got derailed into the statue-and-clay case instead -- you take a lump of clay ("Lumpl") and squash it into a statue shape ("Goliath", apparently thats the actual naming convention from Gibbard's original 1975 paper lol), then argue about whether Lumpl and Goliath are really the same object. i went down a rabbit hole on the SEP page for material constitution afterwards and it turns out theres a whole zoo of named positions that never show up in the pop-philosophy version of the puzzle, and they can't all be equally good.

