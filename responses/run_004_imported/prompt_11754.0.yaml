          *   REU: $REU(f) = \sum [r(P(outcome \ge x_i)) - r(P(outcome \ge x_{i+1}))] u(x_i)$. Or more commonly expressed as $u(x_0) + \sum r(P(outcome \ge x_i)) [u(x_i) - u(x_{i-1})]$.
          *   Yes, structurally they are the same functional form. Both use a transformation function ($r$ in Buchak, $w$ in Quiggin) applied to cumulative probabilities of ranked outcomes.
      *   *Motivations:*
          *   Quiggin (1982): Primarily motivated by the Allais Paradox and empirical violations of EUT. Aim: Descriptive accuracy while maintaining stochastic dominance (unlike Prospect Theory's original formulation).
