      *   *Refinement:* The "route" (axioms + interpretation) distinguishes the *project*. Whether the project succeeds is secondary to whether it is distinct from Quiggin's.
      *   *Key Distinction:* Quiggin: $w(p)$ modifies belief. Buchak: $r(p)$ modifies the weight of the utility increment based on risk.
