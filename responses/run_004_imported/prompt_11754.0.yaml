      *   *Honest Academic Consensus:* Many decision theorists suspect the latter. The math is the math. If the math violates dynamic consistency, it's hard to call it rational regardless of the axioms.
      *   *However,* for a dissertation chapter, simply saying "it's the same" is boring. The philosophical *framing* matters.
      *   *Strategy:* I will defend the view that **REU is philosophically distinct and justifies a normative claim that RDU does not, primarily because Buchak decouples the weighting function from 'probability distortion' and re-couples it to 'risk attitude'.** This is a substantive philosophical move, not just relabeling. Quiggin's $w(p)$ suggests the agent gets the *probability* wrong (or perceives it differently). Buchak's $r(p)$ suggests the agent gets the probability right but cares about the *position* of the outcome in the distribution. This is a crucial normative difference.

