      *Decision:* I will take the middle path but lean towards Buchak. The *interpretation* matters for rationality. If I believe I am distorting probabilities (Quiggin), I might be irrational. If I believe I am weighing risk (Buchak), I might be rational. The *story* determines the normative status even if the *choice* is the same.
      *Actually, the strongest argument for Buchak is the "Global Preference" argument.* EUT assumes preferences are local (outcome-based). REU assumes preferences are global (gamble-based). This is a fundamental philosophical disagreement about the *object* of preference, not just the math. I will focus on this.

