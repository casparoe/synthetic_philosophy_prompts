      *(Self-Correction during drafting)*: Actually, looking at contemporary critical race theory, Du Bois is often vindicated. The idea that "black art must be beautiful" (Locke) can be a trap. Du Bois's "propaganda" is about *truth-telling*. Maybe Du Bois is the stronger philosophical position because he refuses to let aesthetics be an escape from reality.
      *Let's try to find a middle ground that takes a side.* I will argue for **Du Bois**. The reason: Locke's distinction between "inner expression" and "external persuasion" assumes a sovereign subject that racism actively denies. Du Bois recognizes that the *condition* of Black existence makes the personal inherently political. Therefore, Locke's attempt to separate them is theoretically unstable. Du Bois is more honest about the material conditions of production and reception.

