      *   *Locke:* Art has an intrinsic value related to human flourishing *before* it has political utility. If you sacrifice the intrinsic value for the political utility, you lose the utility anyway (because bad art doesn't persuade).
      *   *The Core Disagreement:* It's about the *ontology of the aesthetic moment*. For Du Bois, the aesthetic is a vehicle for the ethical. For Locke, the ethical is a *byproduct* of the aesthetic. If the aesthetic is compromised, the ethical fails.
      *   *Refinement:* It's not just strategy; it's about the *condition of possibility* for Black art. Du Bois thinks Black art is impossible *without* political intent. Locke thinks Black art is impossible *with* overt political intent (because that intent distorts the form).

