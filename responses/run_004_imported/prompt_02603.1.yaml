      *(Wait, let me step back.)* If I argue for Du Bois, I need to make sure I don't just say "politics are important." I need to say his *aesthetic theory* is better. His theory is that beauty is a form of truth, and in an unjust world, political truth is a prerequisite for beauty. Locke says beauty is a form of truth, and political truth distracts from beauty. Du Bois is more defensible because he recognizes that *distortion* (racism) makes *representation* (art) inherently political. You cannot paint a true picture of a Black life in 1926 without painting the politics. Therefore, Locke's "pure expression" is actually a *false* expression. Du Bois wins on the grounds of *truth*.

