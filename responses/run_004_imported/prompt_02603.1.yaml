  5.  **Drafting the Content:**
      *   *Intro:* Acknowledge the sophistication of the user's prompt. It's rare to see the "strategy vs. theory" distinction made so clearly.
      *   *Section 1 (Theory vs. Strategy):* Focus on the definition of "Propaganda." For Du Bois, it's unavoidable (ontological). For Locke, it's a choice (volitional). Du Bois says the *context* makes it propaganda. Locke says the *intent* makes it propaganda. This is a real theoretical split.
