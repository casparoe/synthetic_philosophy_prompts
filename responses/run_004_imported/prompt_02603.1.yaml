      *   *My Philosophical Lean:* Locke's argument is more robust *aesthetically*, but Du Bois is more robust *politically*. However, the prompt asks about the relationship between *art and politics*.
      *   *Argument for Locke:* Du Bois's view risks consuming art entirely into politics, rendering "art" redundant. If all art is propaganda, then "art" is just a fancy word for "effective communication." Locke preserves the autonomy of the aesthetic, which is necessary for art to do its unique work (which *includes* political work, but isn't *limited* to it).
