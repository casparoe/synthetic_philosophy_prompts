  **Dr. Aris:** "I never—"

  **Priya:** "So, I walk into your office. I wake up. The question is: What is my credence that the coin landed Heads? What are the odds I'm in the timeline where you actually help me?"

  **Dr. Aris:** "One half. Obviously. The coin is fair."

  **Priya:** "That's the Halfer position. It assumes waking up gives me no new information. But I'm a Thirder, Dr. Aris. I know that there are three possible waking states: Heads-Monday, Tails-Monday, Tails-Tuesday. Only one of those involves you being useful."

  **Dr. Aris:** "You are reducing my mentorship to a probability puzzle."

  **Priya:** "I'm reducing it to the data. If I assign a credence of one-third to this meeting being productive, I'm being optimistic. The other two-thirds is just the echo of a conversation I've already forgotten. So please, try to say something new. Statistically, you've already insulted this draft once today, and I just don't remember it."

  **Dr. Aris:** *[Silence. He picks up her draft.]* "Get out."

  **Priya:** *[Standing up]* "See? Tails behavior. I'll see you Tuesday."
