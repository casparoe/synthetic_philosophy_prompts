  2.  **Deconstruct the Philosophical Tension:**
      *   *The Problem:* Hard determinism says "no one deserves praise/blame." Eulogies are inherently about praise and loss (reactive attitudes).
      *   *The Trap:* Pretending Warren believed in free will insults his colleagues/intellect. Explicitly arguing determinism insults the family/makes it cold.
      *   *The Strawsonian Solution:* Reactive attitudes (love, grief, gratitude) are part of the human form of life. They don't require metaphysical libertarian free will. We participate in the "participant stance" regardless of the "objective stance."
      *   *The Translation:* How to say "We love him and miss him, and that love is real even if he thought it was just neurons" without saying "He was wrong about the neurons."
