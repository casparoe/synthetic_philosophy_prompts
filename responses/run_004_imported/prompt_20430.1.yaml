answer: |-
  **Elena (Counterfactual Theorist):** Let's look at the lifeguard case. The swimmer died. Why? Because the lifeguard failed to notice them. That failure is the cause. It's straightforward dependency: if the lifeguard *had* noticed, the swimmer would have lived. The outcome counterfactually depends on the omission. Therefore, the omission caused the death.

  **Marcus (Physical-Process Theorist):** That's where you lose me. Nothing passed from the lifeguard to the swimmer. No energy, no momentum, no signal. The water entered the lungs; the hypoxia stopped the heart. That is a continuous physical process. The lifeguard's inattention is a background condition, a null event. You can't build a causal chain out of nothing. The lifeguard didn't *do* anything to the swimmer.

  **Elena:** He didn't have to "do" something in the sense of a push or a shove. Causation is about making a difference. His vigilance was the variable that, had it been set to "active," changes the state of the world from "dead" to "alive." Since the setting was "inactive," and the result was "dead," the inactivity is the cause.

  **Marcus:** But that logic is profligate. It explodes the concept of cause. If the lifeguard's failure to jump in is a cause, then *my* failure to jump in is also a cause. I was sitting on the bench reading a book. Counterfactually, if I had jumped in, the swimmer would have lived. So, by your logic, I caused the death just as much as the lifeguard did. In fact, every person on Earth who didn't teleport to the pool to save the swimmer is a cause of the drowning. There are billions of causes for every single death. That renders the word "cause" useless for distinguishing what actually happened.

  **Elena:** That's the classic "profligacy" objection, but it confuses the *definition* of causation with the *selection* of causes for conversation. Yes, strictly speaking, billions of counterfactual dependencies exist. But we don't list them all because we filter for abnormality. We compare reality against a default model. In our model of a pool, random bystanders aren't expected to dive in; lifeguards are. The counterfactual dependence of the bystander is true but uninformative because it holds against a background where we don't expect them to act. The lifeguard's dependence is salient because it violates a norm. We aren't saying the bystander *didn't* satisfy the counterfactual test; we're saying their inaction isn't the *relevant* difference-maker in this context.

  **Marcus:** So you admit causation is subjective? You're smuggling norms and expectations into the fabric of reality. You're saying the physical universe waits to see what job title a person holds before deciding if their inaction is a cause. That's not metaphysics; that's HR policy. If causation depends on what we *expect* someone to do, then causation isn't in the world; it's in our heads. I need causation to be about how the machinery of the universe grinds, not about social contracts.

  **Elena:** I'm saying causation is a tool for explanation, and explanation is inherently contextual. But let's turn that back on you. If you insist that only physical transfers count, you have a massive blind spot. We are incredibly confident—legally, morally, and intuitively—that the lifeguard's inattention caused the death. If you say, "No, the water caused it, the lifeguard just didn't stop it," you sever the link between cause and responsibility. If the lifeguard didn't cause the death, why do we punish him for negligence? Why do we fix the scheduling system that left him tired? We intervene on the lifeguard, not just the water. If your theory can't account for why we treat the omission as the lever to pull, your theory is ontologically pure but practically dead.

  **Marcus:** You're conflating *causation* with *responsibility*. They are distinct. I can agree the lifeguard is responsible—blameworthy, liable, punishable—without agreeing he was the physical cause. We hold him responsible precisely because he *could have interrupted* the physical process but didn't. The water is the cause of death; the lifeguard is the agent who failed to intercept the cause. We punish the failure to intercept because it's within his control. You don't need to call the omission a "cause" to justify the punishment. You just need to acknowledge he had a duty to intervene in the causal chain. My theory preserves the integrity of the physical chain; yours dissolves it into a soup of "what-ifs."

  **Elena:** But that distinction is artificial. When we say "X caused Y," we are identifying the point of intervention. If I say "The water caused the death," the intervention is "drain the pool." If I say "The lifeguard caused the death," the intervention is "hire a better lifeguard." In a postmortem, we care about the latter. If your physical process theory tells me the lifeguard isn't a cause, it tells me the wrong place to look to prevent recurrence. You're prioritizing a physics textbook definition over the actual utility of causal reasoning. You're protecting the concept of "process" at the expense of understanding why things go wrong.

  **Marcus:** And you're protecting "utility" at the expense of truth. If we call omissions causes, we lose the ability to distinguish between killing and letting die. If I unplug a ventilator, I transfer energy to the plug. If I simply choose not to plug it in, I transfer nothing. Physically, those are different worlds. Legally, you might treat them similarly, but ontologically, they are distinct. If you collapse that distinction, you can't explain the asymmetry of the universe. Effects come from events, from happenings. A non-happening cannot produce a happening. You're asking me to believe that nothing can push something.

  **Elena:** I'm asking you to believe that the *absence* of a prevention is functionally identical to the *presence* of a threat in terms of outcome. The swimmer's lungs don't care if the water was pushed in by a wave or if the air was withheld by a guard. The dependency is the same. If you refuse to call it causation, you're just reserving the word for physical contact and forcing everyone else to use a different vocabulary for the exact same logical relationship. That's terminological gatekeeping, not insight.

  **Marcus:** It's not gatekeeping; it's precision. If I say "The lack of rain caused the famine," I am speaking metaphorically. The heat and the soil chemistry caused the crop failure. The rain's absence is how we describe the condition, not the mechanism. If we want to fix the famine, we need to know the mechanism—irrigation, drought resistance—not just mourn the missing clouds. By insisting omissions are causes, you stop looking for the active agents. You let the water off the hook because you're too busy blaming the man who didn't scoop it out.

  **Elena:** And by insisting only active agents are causes, you let the system off the hook because you're too busy blaming the water. We're done here. You won't accept that dependency defines cause, and I won't accept that physics defines relevance.

  **Marcus:** Agreed. You want causation to be about difference-making; I need it to be about connection-making. We're describing two different relations and calling them by the same name.

  **Elena:** Then the postmortem will remain a battlefield.

  **Marcus:** As long as humans care about blame more than physics, it will.
