prompt: |-
  I'm a retired physicist who's gotten pretty into philosophy since I retired, and lately I've fallen down a Gödel rabbit hole -- started with the incompleteness theorems, ended up reading about the letters he wrote his mother arguing for an afterlife, which honestly floored me more than any theorem did. I run a little philosophy-of-science discussion group, and next month we've got a guest coming who's spent years going through Gödel's unpublished philosophical notebooks (the "Max Phil" ones, I think they're called?) and his correspondence, and who thinks the afterlife argument deserves to be taken seriously as philosophy rather than filed away as a curiosity. Can you draft me eight or nine interview questions for her?

  I don't want her just re-explaining the "a rationally ordered world wouldn't develop a mind this elaborate only to waste it, so something of us continues" argument -- anyone who's read Wang's book already has that part down. I want at least one question pressing on where that "nothing is wasted" premise actually comes from and whether it's doing all the real work, one on how this argument is even supposed to relate to his separate ontological proof of God, one on how much of it is just inherited Leibniz versus anything original to Gödel, and one on the awkward fact that most of this was written to comfort his grieving mother, by a man who later starved himself to death out of paranoia -- which definately doesn't scream "rationally ordered universe" to me. For each of those four, tack on a follow-up keyed to whatever deflection she's most likely to reach for.
