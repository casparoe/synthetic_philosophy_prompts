answer: |-
  This is one of the most unsettling feelings a human can have: the realization that your own brain can operate without your "permission" or even your knowledge. It touches on neuroscience, psychology, and even philosophy.

  First, a crucial safety note: **Alcohol-induced blackouts are a significant medical warning sign.** They indicate that your Blood Alcohol Concentration (BAC) rose rapidly to a level that temporarily disabled your brain's ability to form new memories. This is distinct from "passing out" (losing consciousness) and is actually more dangerous in some ways because it signals neurotoxicity. If this becomes a pattern, it is worth discussing with a healthcare provider.

  To answer your specific question: **Your roommate and you are both partially right, but you are both working with slightly different definitions of "conscious."** Neuroscience suggests the truth is a unsettling middle ground.

  Here is the breakdown of what was likely happening in your head.

  ### 1. The Hardware vs. The Save Button
  To understand a blackout, you have to separate **conscious processing** from **memory consolidation**.
  *   **Conscious Processing:** This is your brain taking in sensory input (music, faces, arguments) and generating output (talking, dancing) in real-time.
  *   **Memory Consolidation:** This is the process of taking that real-time experience and transferring it from short-term holding (hippocampus) to long-term storage (cortex).

  During a blackout, alcohol specifically suppresses the NMDA receptors in the hippocampus. Think of this as **unplugging the "Save" button on a computer.**

  Your roommate is looking at the screen. The computer is still running. The program is open. You are typing and clicking. To an observer, the system is "on."
  You are looking at the hard drive later. The file is gone. To you, the system was "off."

  ### 2. Was "Someone Home"? (The Phenomenological Question)
  This is the core of your anxiety. Was there a *you* experiencing the pineapple pizza argument, or was it a philosophical zombie (a body acting without an inner life)?

  Most neuroscientists and psychologists lean toward the idea that **there was a diminished, immediate awareness, but no "narrative self."**

  *   **Immediate Awareness:** You likely *did* experience the moment as it happened. You felt the rhythm of the music, the heat of the argument, the taste of the drink. That is a form of consciousness. If someone had poked you, you would have felt it.
  *   **No Narrative Self:** However, the part of your brain that stitches those moments together into a continuous story ("I am [Name], and I am at a party, and this is fun") was impaired. You were likely experiencing life in isolated, fleeting seconds that evaporated as soon as your attention shifted.

  So, it wasn't "autopilot" in the sense of a reflex (like your knee jerking when tapped). It was more like **driving a car while looking only at the bumper.** You were reacting to the immediate stimulus, but you weren't integrating it into a larger context.

  ### 3. Why "Autopilot" Doesn't Fit
  If you were truly on autopilot (like a sleepwalker), your behavior would likely have been more repetitive, less responsive, and emotionally flat.
  *   **Sleepwalkers** rarely hold complex conversations or argue logic (like the pineapple on pizza debate).
  *   **Blackout You** was responsive, emotional, and adaptive.

  This suggests that the neural networks required for language, social cues, and emotion were active. The "lights were on," but the "security cameras weren't recording."

  ### 4. Is This Unknowable?
  Philosophically, this is close to the "Hard Problem of Consciousness." Since you have no memory of it, you cannot report on the *qualia* (the subjective feeling) of that time. In a strict sense, **you can never know for 100% certain what it felt like to be you in that state.**

  However, we can infer from similar states. People under hypnosis or certain sedatives sometimes report a feeling of "floating" or "detached observation." They are aware, but they don't care, and they don't remember. It is highly probable your experience was a fragmented version of normal consciousness: **bright spots of awareness that had no glue to hold them together.**

  ### The Verdict
  *   **Your Roommate:** Wrong that you were "normal." You were functionally impaired, even if it didn't look like it.
  *   **You:** Wrong that "nobody was home." There was likely a spark of awareness, but it was ephemeral.
  *   **The Reality:** You were conscious in the **present tense**, but you were unable to exist in the **past tense**.

  ### A Final Thought
  The reason this is messing with your head is that memory is foundational to our sense of self. We are the sum of our memories. When you lose a chunk of time, it feels like a chunk of your *self* was deleted.

  Please take this as a serious signal from your body. Blackouts are not just "fun gone wrong"; they are evidence that your brain was chemically prevented from doing a basic biological function. It's a sign that the amount you drank exceeded your brain's safety threshold. It might be worth reflecting on how to keep future nights within a range where your "Save" button stays plugged in.
