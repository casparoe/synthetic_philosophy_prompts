  ok so i've been stuck on this Popper/Darwinism thing from my quals reading list and want a second opinion written out properly. basically: in Unended Quest (and Objective Knowledge) Popper argues natural selection, in its usual "survival of the fittest" formulation, is almost tautological -- fitness gets cashed out in terms of differential survival and reproduction, so the "law" just ends up saying that those who survive and reproduce more, survive and reproduce more. he downgrades the whole theory to a "metaphysical research programme" rather than a genuinely testable science, more like a heuristic than a falsifiable law. then a few years later, in the piece i think is titled "Natural Selection and the Emergence of Mind" (78, IIRC), he partly recants and says the theory does make testable claims after all.

  write me an essay that actually adjudicates this instead of just summarizing it. was Popper's original tautology charge a real problem, or just a confusion about how biologists actually use "fitness" (e.g. propensity-style accounts like Mills & Beatty's, where fitness is a disposition fixed by an organism's traits, not defined by whether it actually gets lucky and survives)? and did the recantation actually fix things, or does the same tautology worry just resurface for the most general/schematic statement of the principle, even once specific hypotheses about particular traits are perfectly falsifiable? walk through the strongest moves on both sides but actually land on a verdict at the end -- don't just tell me "both sides have a point."
