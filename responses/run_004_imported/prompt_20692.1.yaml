          *   *Idea 3:* Internalities vs. Externalities. (Important for policy justification).
          *   *Selection:* **Decision Utility vs. Experienced Utility** is the most precise technical distinction that resolves the "revealed preference" deadlock. Also, **Normative vs. Positive** is relevant but less specific. Let's focus on Decision vs. Experienced Utility, and perhaps the distinction between *mistakes* and *preferences*.

