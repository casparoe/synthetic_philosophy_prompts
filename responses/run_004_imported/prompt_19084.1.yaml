      *   *Levinas:* The "face" commands us to live ethically. His "survival" is in the ethical demand he placed on us.
      *   *Wittgenstein:* Meaning is use. The meaning of his life is found in how we *live* now.
      *   *Traditional Comfort:* "He lives on in our hearts/deeds" is acceptable to secularists *and* can be framed religiously as "his soul is bound up in the bundle of life" or "his memory is a blessing" without necessarily implying a ghost in the machine.

