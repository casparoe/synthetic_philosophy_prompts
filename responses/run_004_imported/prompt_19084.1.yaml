answer: |-
  Friends, family, colleagues, and members of the congregation.

  We are gathered here in a room that holds two different languages of grief. I know this, because my grandfather knew it, and he loved you all enough to worry about how you would hear his absence.

  To some of you, he was a man of the university, a thinker who demanded rigor and honesty above all else. To others, he was a fellow observant Jew, a man who kept Shabbat with joy, prayed daily, and found holiness in the rhythm of the Jewish year. He was both, fully and without contradiction. And if we are to honor him, we must speak in a way that holds both truths together.

  He taught me that the hardest thing in the world is to pay attention. For thirty years, he taught philosophy, but in his later years, he taught something else: he taught us how to be present.

  There is a customary comfort offered at funerals. We are often told that the deceased is now "in a better place," or that they are "watching over us" from somewhere above. My grandfather loved you all too deeply to ask you to lie for him. He did not believe God was a being located in space, waiting to be found by a telescope or a syllogism. He did not believe his soul was a ghost waiting to detach from his body.

  But please hear me: this was not a lack of faith. It was a deepening of it.

  He found God not in the explanation of events, but in the sanctification of moments. He found the divine not in the sky, but in the space between people. He often spoke of the "face" of the other person—the way a human being commands us, simply by existing, to treat them with kindness, with justice, with care. When he looked at his grandchildren, or sat across from his wife at the Shabbat table, or stood in prayer with this congregation, he believed he was standing in the presence of something holy.

  He told me once that revelation is not a message delivered once and closed. It is a standing relation. It is something we keep open.

  So, where is he now? He is not watching us from a distance. He is here, in the weight of the silence we share. He is here in the ethical claim he made on all of us. To the academics and the grandchildren: he survives in the integrity you bring to your own thinking, and in the honesty you bring to your relationships. To the observant family and the congregation: he survives in the holiness you continue to make in this world. When you light the candles, when you say the Kaddish, when you care for the vulnerable, you are not just remembering him. You are continuing the work he believed was the only work that mattered.

  He did not need a supernatural reward to justify a life of goodness. He believed that the goodness itself was the point. The prayer was the point. The relationship was the point.

  And so, the consolation he would ask us to take is not that he has gone to a better place, but that he has left this place better than he found it. He is survived by the questions he asked, the prayers he whispered, and the love he demanded we show one another.

  In the tradition he cherished, we say that the memory of the righteous is a blessing. But my grandfather would add: a blessing is not a magic spell. It is a task. It is a command to live as he tried to live: with eyes open, with heart engaged, and with a fierce, unapologetic commitment to the holiness of this life, right here, right now.

  Let us not look up for him. Let us look around. Let us look at each other. For in the way we treat one another in this room of split languages and shared loss, that is where he told us we would find him.

  *Zichrono livracha.* May his memory be for a blessing. And may we be the ones to make it so.
