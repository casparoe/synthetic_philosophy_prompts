  *(Self-Correction during drafting)*: I initially thought about quoting Putnam directly. Better not. It makes it too academic. Instead, embody the ideas. Use the metaphor of "light" or "voice." Let's go with "voice" and "face."

  *(Refining the religious comfort)*: The religious family needs to feel he is *with God*. How to say that without dualism? "Bound up in the bundle of life." Or "Returned to the Source." Actually, sticking to the "Relation" is safer. "He entered into a dialogue with eternity." That sounds religious but fits Buber.

  Let's write it.

  *(Post-Drafting Check)*: Does it sound like a grandchild speaking? Yes, intimate but respectful. Does it handle the split room? Yes, by addressing the "different languages" of grief but finding the common ground.

  *Final Polish on the "Death" section:* Make sure to explicitly state he didn't want the "customary comfort." But do it gently. "He asked us not to say he is watching. He asked us to look at each other instead." That's very Levinas.

