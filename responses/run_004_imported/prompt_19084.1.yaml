      *   **The Comfort (The Bridge):** How do we find him now? In the ethical claims he made (Levinas) and the relationships (Buber). This satisfies the secularists (legacy) and the religious (holiness of connection).
      *   **The Observant Aspect:** Honor his Shabbat and prayer not as magic, but as discipline of attention. This validates the religious family's respect for his practice.
