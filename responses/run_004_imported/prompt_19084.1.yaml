  6.  **Developing the "Bridge" Concept:**
      *   The key is *Rosenzweig's* "standing relation." The relationship doesn't end with death because the *impact* of the relationship constitutes who we are now.
      *   For the religious side: This aligns with *Zichrono Livracha* (memory for a blessing) and the idea that the righteous live on through their deeds.
