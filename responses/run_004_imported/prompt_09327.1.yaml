      *   **Tone:** Philosophical, analytical, empathetic to the practitioner's dilemma, rigorous.

  2.  **Deconstruct the Philosophical Positions:**
      *   **The Enkratic Principle (Uniqueness/Conciliationism):** Rationality requires coherence between levels. If I believe my belief-forming process is unreliable, I shouldn't hold the belief. $B(P) \land B(\text{My belief that } P \text{ is unjustified})$ is irrational. This is akin to Moore's Paradox ("$P$, but I don't believe $P$").
      *   **Level-Splitting (Steadfastness):** It is possible to rationally hold $P$ while acknowledging the statistical unreliability of the process, *if* the first-order evidence is strong enough in this specific instance. The HOE is general; the FOE is specific.

  3.  **Evaluate the Doctor's Case:**
