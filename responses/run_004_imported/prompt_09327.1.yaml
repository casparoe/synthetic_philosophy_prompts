      *   *Wait, stronger philosophical stance:* Actually, the most robust epistemic position usually favors the Enkratic Principle (or a version of Conciliationism) regarding *justification*, even if practical action differs. If I believe my cognitive faculties are compromised or statistically unreliable *in this domain*, holding the belief is epistemically akratic.
