      *   *Better Verdict:* I will defend the **Enkratic Principle**. Maintaining the belief while acknowledging the unreliability of the belief-forming mechanism is a form of epistemic akrasia that undermines the very notion of justification. To be rational is to align credence with estimated reliability.
      *   *Implication for the Doctor:* The doctor must lower their credence that the call was correct, even if they would make the same call again based on risk thresholds. They cannot claim "I knew he was fine." They must admit, "I acted correctly, but my certainty was unjustified."

