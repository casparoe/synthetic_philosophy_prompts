      *   *Premise 2:* $R$ can be unfolded into feedforward network $F$ over time $T$.
      *   *Premise 3:* $R$ and $F$ are input-output (I/O) equivalent (behaviorally indistinguishable).
      *   *Premise 4 (Implicit):* Consciousness should supervene on I/O behavior (Functionalism).
      *   *IIT Claim:* Consciousness supervenes on causal structure (intrinsic cause-effect power). $F$ has no feedback, so $\Phi = 0$.
      *   *Conflict:* $R$ is conscious, $F$ is not (according to IIT), but they do the same thing.
