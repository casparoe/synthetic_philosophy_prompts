  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Actor:** A friend (let's call her "Friend A").
      *   **The Action:** Confidently told the group a chem test was pushed back a week based on hearsay ("heard it from someone in the other class").
      *   **The Consequence:** Half the group didn't study and "bombed" the test.
      *   **The Truth:** The information was fake.
      *   **The Defense:** Friend A claims it's not her fault because she genuinely believed it and the source seemed legit.
      *   **The Conflict:** Some friends think the excuse is fair (intent matters); others think she was irresponsible (confidence without verification matters).
      *   **The Question:** Who is right? Does the falsity matter, or does the belief matter?

  2.  **Evaluate the Perspectives:**

      *   **Perspective 1: Intent Matters (Friend A & supporters).**
          *   *Argument:* She didn't mean to hurt anyone. She wasn't lying maliciously. She thought she was helping.
          *   *Validity:* True, intent is important for moral character. She isn't a "bad person."
          *   *Limitation:* Impact often outweighs intent in practical situations. Good intentions don't fix bad grades.

      *   **Perspective 2: Responsibility Matters (The angry friends).**
          *   *Argument:* She stated it *confidently*. This discouraged others from verifying. Academic stakes are high. Spreading unverified info about assessments is risky.
          *   *Validity:* Very strong. Confidence implies certainty. When stakes are high (grades), verification is expected.
          *   *Limitation:* Punishing her socially might be too harsh if she learns from it.

  3.  **Determine the Core Ethical/Practical Issue:**
      *   This isn't just about "lying vs. truth." It's about *epistemic responsibility* (responsibility regarding knowledge and information sharing).
      *   It's about the weight of *confidence*. If she had said, "I heard X, but double-check," the outcome might be different.
      *   It's about *consequences*. Academic performance is a high-stakes environment.

  4.  **Formulate the Verdict:**
      *   Neither side is 100% "right" in a black-and-white way, but the angry friends have a stronger practical point.
      *   Friend A is *morally* innocent (no malice) but *socially/practically* negligent.
      *   The excuse ("I believed it") explains *why* she did it, but it doesn't absolve her of the *impact*.

