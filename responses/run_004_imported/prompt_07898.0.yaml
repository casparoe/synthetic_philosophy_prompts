answer: |-
  This is a classic conflict between **intent** and **impact**, mixed with a heavy dose of **epistemic responsibility** (which is a fancy way of saying "responsibility for what you claim to know").

  Here is the breakdown of who is right, why it matters, and how to look at the situation fairly.

  ### 1. The Argument for Your Friend (Intent)
  The friends who think her excuse is fair are focusing on **character and intent**.
  *   **No Malice:** She didn't lie to sabotage anyone. She thought she was doing a good deed by sharing helpful info.
  *   **Human Error:** Everyone spreads rumors sometimes. If the source seemed legit (e.g., a student who usually knows things), her belief was rational at the time.
  *   **Agency:** Ultimately, every student is responsible for their own study habits. Relying on a rumor instead of checking the syllabus or asking the professor is a risk *they* took.

  **Verdict on this side:** She is not a "bad person," and she shouldn't be villainized as if she did this on purpose.

  ### 2. The Argument for the Angry Friends (Impact & Confidence)
  The friends who are mad are focusing on **consequences and delivery**.
  *   **The Confidence Factor:** This is the most critical part. If she had said, *"Hey, I heard a rumor the test is moved, but you should probably double-check,"* the blame would be mostly on the students who didn't check. But because she stated it **confidently**, she removed the urge for others to verify. Confidence implies certainty.
  *   **High Stakes:** This isn't about where to get lunch; this is about academic grades. When stakes are high, the standard for verifying information should be higher.
  *   **The "I Believed It" Defense:** Believing something false doesn't make it true, and it doesn't erase the damage caused by spreading it. If a news anchor confidently reports false stock market info and people lose money, "I thought it was true" doesn't fix the financial loss.

  **Verdict on this side:** They have the stronger practical argument. Her negligence (speaking confidently without verification) directly contributed to their failure.

  ### 3. So, Who Is Actually Right?
  **The angry friends are more "right" regarding the situation, but your friend is "right" regarding her character.**

  Here is the hard truth: **Impact outweighs intent.**
  You can have the best intentions in the world, but if your actions cause harm, you still bear some responsibility for that harm. Her excuse explains *why* it happened, but it does not **absolve** her of the outcome.

  *   **Is it her fault the test wasn't moved?** No.
  *   **Is it her fault the info was fake?** No.
  *   **Is it her fault she spoke confidently enough to stop people from studying?** **Yes.**

  ### 4. The Nuance: Shared Responsibility
  While your friend was irresponsible, the friends who bombed the test also share some blame. In college/high school, the golden rule is: **Trust the professor/syllabus, not the classmate.**
  *   If the friend said, "The test is moved," the responsible reaction is, "Cool, I'll email the prof to confirm," not "Great, I'm not studying."
  *   Academic self-advocacy is a skill. Relying entirely on peer gossip is a risky strategy.

  ### 5. How to Resolve It
  If you want to keep the friend group intact, here is the healthy way to look at it:

  1.  **Acknowledge the Harm:** Your friend needs to admit that even though she didn't mean to, her confidence caused real stress and bad grades. A simple "I'm so sorry I spoke so definitively, I should have told you to verify" goes a long way.
  2.  **Drop the "Not My Fault":** She needs to stop saying "It's not my fault." Instead, she should say, "I feel terrible that I led you astray." Owning the impact is better than defending the intent.
  3.  **Learn the Lesson:** The group needs to agree that in the future, academic info must be verified at the source.
  4.  **Forgive the Mistake:** If she wasn't malicious, the group should accept her apology. Punishing her indefinitely won't fix the grades, and everyone makes mistakes with rumors.

  **Summary:** Your friend was **negligent, not malicious.** The angry friends are right to be upset about the result, but they should accept that she didn't do it to hurt them. She owes them an apology for her confidence; they owe her forgiveness for her mistake.
