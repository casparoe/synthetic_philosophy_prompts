answer: |-
  This is one of the most famous and contentious cruxes in Peirce scholarship. You have put your finger on exactly the right tension: the text oscillates between a semantic instruction (define it by its consequences) and an ontological claim (it is a real property distinct from those consequences).

  To answer your core question directly: **No, the distinction does not collapse.** Peirce is committed to something stronger than counterfactual frequentism in this passage, and the "Propensity" reading is justified, but with a specific metaphysical caveat that distinguishes Peirce from Popper.

  Here is a breakdown of what Peirce is committed to in CP 2.664, why the "counterfactual frequentist" reading fails to capture it, and how to navigate the "would-be" ontology in your seminar.

  ### 1. The Crucial Clause: "Consists In"
  The pivot point of the entire endnote is the final sentence: *"...and this statement will not of itself imply that the 'would-be' of the die consists in such behavior."*

  If Peirce were a counterfactual frequentist, he would have to say that the probability *is* (consists in) the limit of the hypothetical series. That is the reductionist move: to analyze the disposition away into a logical construction about events.

  By explicitly denying that the would-be *consists in* the behavior, Peirce is making an **anti-reductionist** claim. He is asserting that there is a truth-maker for the proposition "this die is fair" that exists *prior to* and *independently of* the tossing (actual or hypothetical).
  *   **Counterfactual Frequentism:** The truth of "P(6)=1/6" is grounded in the logical fact that *if* tossed infinitely, the frequency *would be* 1/6.
  *   **Peirce's Propensity:** The truth of "P(6)=1/6" is grounded in a real physical property (the "would-be") inherent in the die *now*, which *grounds* the truth of the counterfactual about the infinite toss.

  In CP 2.664, the counterfactual behavior is the *sign* or the *explication* of the would-be, not the *constituents* of it.

  ### 2. The Metaphysical Engine: Scholastic Realism
  You cannot fully parse this passage without referencing Peirce's **Scholastic Realism**. This is the missing key that prevents the collapse you are worried about.

  Peirce was a realist about "generals" (laws, habits, types). For a nominalist (which includes most frequentists and positivists), only actual particulars exist. A "law" is just a summary description of those particulars.
  *   **The Nominalist/Frequentist:** The habit is just a description of how the man *has* acted or *would* act.
  *   **The Scholastic Realist (Peirce):** The habit is a **Real General** (Thirdness). It is a genuine mode of being that governs future events.

  When Peirce analogizes the die's "would-be" to a man's "habit," he is not making a loose metaphor. He is invoking his category of **Thirdness**. A habit is a real law that binds the future. Therefore, the die possesses a real law-like property. This property exists even if the die is locked in a safe and never thrown. A counterfactual frequentist struggles to explain what makes the counterfactual true if the die is destroyed before being tossed; Peirce does not. The "would-be" was real while the die existed, regardless of the tossing.

  ### 3. Semantic vs. Ontological Commitments
  The confusion in the passage arises because Peirce is operating on two levels simultaneously, which he distinguished later in his career as **Pragmaticism** (semantic) vs. **Scholastic Realism** (ontological).

  *   **Semantically (The Pragmatic Maxim):** Peirce agrees that to *define* or *conceive* of the would-be, we must look to its sensible consequences ("how it would lead the die to behave"). We have no intellectual grip on the property other than through its potential manifestations. This is where the frequentist language comes from.
  *   **Ontologically (Scholastic Realism):** Peirce insists that the *reality* of the thing is not exhausted by our definition of it. The property is a real disposition.

  So, is he a frequentist? **Epistemically/Semantically, yes.** We measure and define probability via long-run frequencies.
  Is he a propensity theorist? **Ontologically, yes.** The truth-maker for probability claims is a physical disposition, not the sequence itself.

  This is why the distinction doesn't collapse. The counterfactual frequentist says the sequence (hypothetical) is the *truth-maker*. Peirce says the sequence is the *evidence* or the *meaning*, but the *truth-maker* is the "would-be" property.

  ### 4. Peirce vs. Popper
  The secondary literature links them because Popper explicitly acknowledged Peirce as a precursor. However, there is a nuance you should bring to your seminar to show mastery of the text:

  *   **Popper** wanted to liberate probability from the long run entirely to solve problems in quantum mechanics (single-case probabilities).
  *   **Peirce** (in this passage) still ties the *definition* of the would-be to the "occasion that would bring out the full consequence." Peirce is less interested in single-case probability as a standalone logical entity and more interested in the **reality of chance** (Tychism) in the universe.

  Peirce's "would-be" is not just a statistical propensity; it is an evolutionary habit of nature. The die has a would-be because the universe is governed by habits that are not absolutely rigid (determinism) but allow for spontaneity.

  ### 5. Summary for Your Seminar
  If you are asked to parse CP 2.664, here is the position to take:

  1.  **The text is anti-reductionist.** The clause "will not... imply that the 'would-be'... consists in such behavior" is a direct rejection of the Humean/Positivist view that dispositions are merely logical constructions of events.
  2.  **It is a Propensity view, but grounded in Realism.** It earns the "Propensity" label because it posits a physical property of the single object (the die) that explains the frequencies, rather than being defined by them.
  3.  **The "Collapse" is avoided by Thirdness.** The distinction between Peirce and the counterfactual frequentist is that Peirce believes "Laws/Habits" are real entities (Thirdness), whereas the frequentist believes only "Events" (Secondness) are real. For Peirce, the "would-be" is a real law; for the frequentist, it is a statement about events.
  4.  **Peirce's Unique Contribution.** Unlike Popper, who treated propensities largely as a fix for quantum mechanics, Peirce treats the "would-be" as part of a general metaphysics of habit. The die is a rudimentary example of the same kind of reality found in human habits and cosmic laws.

  **Verdict:** You are right to sense the frequentist language ("how it would lead the die to behave"), but Peirce uses that language to satisfy his Pragmatic Maxim (meaning lies in consequences) while using the "consists in" denial to satisfy his Scholastic Realism (reality lies in generals). He is a **Realist Propensity Theorist**, which is a stronger ontological position than a Counterfactual Frequentist.
