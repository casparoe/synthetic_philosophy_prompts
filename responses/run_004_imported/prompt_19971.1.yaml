answer: |-
  You have hit on one of the most common initial reactions to this debate. On the surface, Contextualism and Pragmatic Encroachment (PE) look like twin siblings: they both agree that the classic "Strict Invariantist" view (knowledge depends *only* on truth, belief, and evidence) is wrong, and they both agree that the Bank Cases reveal a flaw in traditional epistemology.

  However, epistemologists treat them as fierce rivals because they disagree fundamentally on **where** the stakes do their work.

  The short version is this: **Contextualism says stakes change the *meaning of the word* "knows." Pragmatic Encroachment says stakes change the *state of the knower*.**

  Here is the breakdown of why they are rivals, where they diverge, and why Stanley and DeRose care so much about the distinction.

  ### 1. The Locus of Variation (Speaker vs. Subject)
  This is the technical heart of the disagreement.

  *   **Epistemic Contextualism (DeRose, Lewis, Cohen):** The semantic content of "knows" is context-sensitive, similar to indexicals like "tall," "here," or "I."
      *   The standards for knowledge shift based on the **Attributor's Context** (the person *saying* "S knows that p").
      *   If *I* am in a low-stakes conversation, my word "knows" has low standards. If *I* am in a high-stakes conversation, my word "knows" has high standards.
      *   **Crucially:** The subject's stakes don't matter directly; only the speaker's conversational context matters.

  *   **Pragmatic Encroachment (Stanley, Fantl & McGrath):** Often called "Subject-Sensitive Invariantism" (SSI) or "Interest-Relative Invariantism" (IRI).
      *   The word "knows" has a fixed meaning, but whether a person satisfies it depends on their practical situation.
      *   The standards for knowledge shift based on the **Subject's Context** (the person *who is supposed to know*).
      *   **Crucially:** The speaker's stakes don't matter; only the subject's practical interests matter.

  ### 2. The Divergence Test
  If the theories were the same, they would predict the same truth values for knowledge claims in all scenarios. They don't. They diverge when the **Subject's stakes** and the **Speaker's stakes** come apart.

  Imagine the classic Bank Case with Hannah (the subject).

  **Scenario A: High-Stakes Subject, Low-Stakes Speaker**
  Hannah has a massive check to deposit; if she gets the hours wrong, she is ruined (High Stakes). She doesn't check the hours.
  Bob is talking about Hannah. Bob doesn't care about Hannah's money; he is just casually gossiping (Low Stakes).
  Bob says: *"Hannah knows the bank is open."*

  *   **Contextualist Verdict:** **True.** Bob is in a low-stakes context. The word "knows" in Bob's mouth sets a low bar. Hannah meets that bar.
  *   **Pragmatic Encroachment Verdict:** **False.** Hannah is in a high-stakes situation. Her practical interests raise the epistemic bar required for her to actually *have* knowledge. She doesn't meet it, so Bob's statement is false, regardless of how casual Bob is.

  **Scenario B: Low-Stakes Subject, High-Stakes Speaker**
  Hannah has a tiny check; if she gets the hours wrong, it's no big deal (Low Stakes). She doesn't check the hours.
  A Skeptic Philosopher is talking about Hannah. The philosopher is discussing radical skepticism and the nature of certainty (High Standards).
  The Philosopher says: *"Hannah knows the bank is open."*

  *   **Contextualist Verdict:** **False.** The Philosopher is in a high-standards context. In this context, the word "knows" requires ruling out skeptical possibilities. Hannah hasn't done that.
  *   **Pragmatic Encroachment Verdict:** **True.** Hannah's practical situation is low-stakes. She has enough evidence for her situation. She *does* know. The Philosopher is speaking falsely (or perhaps misleadingly), because Hannah actually possesses the knowledge state.

  ### 3. Why the Rivalry Matters (The Philosophical Stakes)
  You asked why Stanley and DeRose treat this as a genuine rivalry rather than just vocabulary. It comes down to what they think epistemology is studying.

  **For the Contextualist (DeRose):**
  Epistemology is largely about **linguistic norms**. We want to preserve the idea that knowledge is a pure mental state (justification + truth + belief). If Hannah's mental state doesn't change between the High and Low stakes cases, she still "knows" in the pure sense. It's just that in high-stakes conversations, we aren't *allowed to say* she knows. Contextualism saves the purity of the mental state by offloading the variability onto language.

  **For the Pragmatic Encroacher (Stanley):**
  Epistemology is about **action and reasoning**. Knowledge is the norm of practical reasoning (you should only act on p if you know p). If stakes make it irrational to act without further evidence, then you don't have knowledge. Stanley argues that Contextualism is a "cheat" that hides the real insight: that practical interests literally penetrate (encroach upon) the epistemic realm. For Stanley, Hannah literally loses her knowledge when the stakes go up.

  ### 4. Summary of the Conflict
  *   **Contextualism:** "Knows" is flexible; Knowledge (the mental state) is stable.
      *   *Variation location:* The Speaker's mouth.
  *   **Pragmatic Encroachment:** "Knows" is stable; Knowledge (the mental state) is flexible.
      *   *Variation location:* The Subject's mind/situation.

  ### Why it feels like they agree
  They agree on the **Bank Cases** specifically because in the Bank Cases, the Subject and the Attributor are usually the same person (or implied to be in the same context).
  *   When Hannah says "I know" in the Low Stakes case, both theories say "True."
  *   When Hannah says "I know" in the High Stakes case, both theories say "False."

  It is only when you decouple the speaker from the subject that the theories fight.

  ### Conclusion
  Stanley and DeRose are rivals because they are offering competing explanations for *why* the Bank Cases work.
  *   DeRose says: "The word 'knows' changed height."
  *   Stanley says: "Hannah shrank."

  If you care about whether knowledge is a property of the mind or a property of our conversation, this is one of the biggest divides in modern epistemology.
